has_subtypes:
- name: Conventional
  display_name: Conventional ameloblastoma
  description: >-
    The intraosseous conventional form includes tumors historically described
    as solid or multicystic. Conventional classification is a reported risk
    factor for recurrence.
  evidence:
  - reference: PMID:39177897
    reference_title: "Factors Associated with Recurrence of Ameloblastoma: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified prognostic factors for recurrence included: (1) Tumor size/diameter/volume, (2) cortical bone perforation/ soft tissue invasion, (3) multilocular radiolucency, (4) impacted tooth-involving lesions, (5) root resorption, (6) WHO classification - conventional (solid/multicystic) ameloblastoma, (7) histological subtype - mural invasion of unicystic ameloblastoma, (8) conservative treatment modalities - simple enucleation, curettage, and marsupialization, and (9) non-extraction/preservation of involved teeth."
    explanation: The scoping review directly identifies conventional solid/multicystic ameloblastoma and its association with recurrence.
- name: Unicystic
  display_name: Unicystic ameloblastoma
  description: >-
    A cystic form that can resemble dentigerous cyst or odontogenic keratocyst;
    mural invasion is associated with recurrence risk.
  evidence:
  - reference: PMID:33897185
    reference_title: "Comparison of calretinin expression in dentigerous cysts and ameloblastoma: An immunohistochemical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unicystic ameloblastoma poses a diagnostic challenge, as its histologic presentation can be sometimes mistaken for cystic odontogenic lesions."
    explanation: The study directly supports the cystic diagnostic overlap.
  - reference: PMID:39177897
    reference_title: "Factors Associated with Recurrence of Ameloblastoma: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified prognostic factors for recurrence included: (1) Tumor size/diameter/volume, (2) cortical bone perforation/ soft tissue invasion, (3) multilocular radiolucency, (4) impacted tooth-involving lesions, (5) root resorption, (6) WHO classification - conventional (solid/multicystic) ameloblastoma, (7) histological subtype - mural invasion of unicystic ameloblastoma, (8) conservative treatment modalities - simple enucleation, curettage, and marsupialization, and (9) non-extraction/preservation of involved teeth."
    explanation: The review directly identifies mural unicystic histology as a recurrence factor.
- name: Peripheral
  display_name: Peripheral ameloblastoma
  description: A soft-tissue variant rather than an intraosseous jaw lesion.
  evidence:
  - reference: PMID:24963238
    reference_title: "Ameloblastoma: A clinicoradiographic and histopathologic correlation of 11 cases seen in Goa during 2008-2012."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10 cases showed radiographic findings, while one case was a peripheral soft-tissue variant."
    explanation: This case series directly describes peripheral ameloblastoma as a soft-tissue variant.
- name: Metastasizing
  display_name: Metastasizing ameloblastoma
  description: >-
    The rare metastasizing form most often spreads to the lungs, followed by
    cervical lymph nodes, and has a different clinical profile from
    ameloblastic carcinoma.
  evidence:
  - reference: PMID:35822408
    reference_title: "Comparison of survival outcomes between ameloblastic carcinoma and metastasizing ameloblastoma: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metastases mainly affected the lungs, followed by cervical lymph nodes."
    explanation: The systematic review directly supports the principal metastatic sites.

prevalence:
- population: Global estimate based on studies from Europe, Africa, and Australia
  measure_type: ANNUAL_INCIDENCE
  rate_per_100000: 0.092
  rate_low: 0.057
  rate_high: 0.149
  notes: >-
    Pooled incidence was 0.92 per million person-years (95% CI 0.57-1.49),
    equivalent to 0.092 per 100,000 person-years; heterogeneity was significant
    and the included studies did not provide worldwide geographic coverage.
  evidence:
  - reference: PMID:30614154
    reference_title: "Global incidence and profile of ameloblastoma: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled incidence rate was 0.92 per million person-years (95% CI: 0.57-1.49), with significant heterogeneity between studies."
    explanation: The meta-analysis directly provides the pooled rate, confidence interval, and heterogeneity limitation.

progression:
- phase: Local growth and presentation
  age_range: Any age; peak incidence in the third decade
  notes: >-
    Tumors are commonly mandibular and may present with swelling and progressive
    jaw expansion. Mean age in the global meta-analysis was 34 years.
  evidence:
  - reference: PMID:30614154
    reference_title: "Global incidence and profile of ameloblastoma: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean age was 34 years and the peak age incidence in the third decade of life."
    explanation: The meta-analysis directly supports the age profile.
  - reference: PMID:11402276
    reference_title: "Ameloblastoma: a clinical, radiographic, and histopathologic analysis of 71 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-two (87.3%) of the 71 ameloblastomas were located in the mandible."
    explanation: The clinical cohort directly supports mandibular predominance.
- phase: Post-treatment surveillance and recurrence
  duration: Long-term
  notes: >-
    Recurrence can follow surgery, particularly conservative treatment; regular
    long-term follow-up is therefore important.
  evidence:
  - reference: PMID:11402276
    reference_title: "Ameloblastoma: a clinical, radiographic, and histopathologic analysis of 71 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall recurrence rate was 21.1%, and the average age of the patient at recurrence was 26.4 years."
    explanation: The cohort directly documents post-treatment recurrence.
  - reference: PMID:11402276
    reference_title: "Ameloblastoma: a clinical, radiographic, and histopathologic analysis of 71 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term follow-up at regular intervals after surgery is also recommended."
    explanation: The authors directly recommend long-term postoperative surveillance.

pathophysiology:
- name: Somatic RTK-RAS-MAPK Driver Alterations
  biological_scale: MOLECULAR
  conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
  description: >-
    Recurrent somatic activating variants in BRAF, KRAS, and FGFR2 define a
    major molecular route in ameloblastoma. BRAF p.Val600Glu is the most common
    alteration and is enriched in mandibular tumors; HRAS and NRAS alterations
    are also observed in molecularly profiled tumors or cell lines.
  genes:
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  - preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  - preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  evidence:
  - reference: PMID:24859340
    reference_title: Identification of recurrent SMO and BRAF mutations in ameloblastomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the discovery of oncogenic mutations in the Hedgehog and mitogen-activated protein kinase (MAPK) pathways in over 80% of ameloblastomas, locally destructive odontogenic tumors of the jaw, by genomic analysis of archival material."
    explanation: Genomic analysis directly establishes recurrent oncogenic MAPK-pathway alterations.
  - reference: PMID:36428683
    reference_title: "BRAF V600E Mutation in Ameloblastoma: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis prevalence of BRAF V600E in ameloblastoma was 70.49%, and a significant meta-analysis association was reported for those younger than 54 years old and in the mandible."
    explanation: The meta-analysis quantifies BRAF p.Val600Glu and its mandibular enrichment.
  - reference: PMID:42286159
    reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic mutations were identified in all cases, including alterations in BRAF, SMO, HRAS, FGFR2, and PIK3CA."
    explanation: Prospective profiling directly supports HRAS and FGFR2 alterations in human tumors.
  downstream:
  - target: Oncogenic Odontogenic Epithelial Proliferation
    description: Activating RTK-RAS-MAPK alterations promote tumor-cell growth and survival.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - MEK and ERK activation
    evidence:
    - reference: PMID:24859340
      reference_title: Identification of recurrent SMO and BRAF mutations in ameloblastomas.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ameloblastoma cells harboring an activating BRAF mutation encoding p.Val600Glu are sensitive to the BRAF inhibitor vemurafenib."
      explanation: Selective inhibitor sensitivity functionally supports dependence of BRAF-mutant ameloblastoma cells on the activating driver.
- name: Activating SMO-Hedgehog Signaling
  biological_scale: MOLECULAR
  description: >-
    Recurrent activating SMO variants define an alternative Hedgehog-signaling
    route that is enriched in maxillary ameloblastoma.
  genes:
  - preferred_term: SMO
    term:
      id: hgnc:11119
      label: SMO
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:24859340
    reference_title: Identification of recurrent SMO and BRAF mutations in ameloblastomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in SMO (encoding Smoothened, SMO) are common in ameloblastomas of the maxilla, whereas BRAF mutations are predominant in tumors of the mandible."
    explanation: The human tumor series directly establishes the site-associated SMO molecular class.
  downstream:
  - target: Oncogenic Odontogenic Epithelial Proliferation
    description: Constitutively active SMO promotes proliferation in ameloblast-lineage cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24859340
      reference_title: Identification of recurrent SMO and BRAF mutations in ameloblastomas.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Notably, overexpression of SMO Leu412Phe in immortalized mouse ameloblast-lineage cells (the ALC line10) enhanced cell proliferation in comparison to overexpression of wild-type SMO or empty vector control (Fig. 3), demonstrating a relevant phenotype in a germane cell type."
      explanation: The perturbation directly links activating SMO to increased ameloblast-lineage proliferation.
- name: Oncogenic Odontogenic Epithelial Proliferation
  biological_scale: CELLULAR
  conforms_to: sustaining_proliferative_signaling#Growth-Factor-Independent Proliferation
  description: >-
    Driver-dependent survival and proliferation of ameloblast-lineage tumor cells
    expands the odontogenic epithelial tumor compartment.
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: positive regulation of epithelial cell proliferation
    modifier: INCREASED
    term:
      id: GO:0050679
      label: positive regulation of epithelial cell proliferation
  evidence:
  - reference: PMID:35689405
    reference_title: New Ameloblastoma Cell Lines Enable Preclinical Study of Targeted Therapies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AB cells with KRAS or NRAS mutation (MAPK pathway) are exquisitely sensitive to MEK inhibition, which propels ameloblast differentiation."
    explanation: Mutation-matched MEK inhibition functionally demonstrates MAPK dependence in ameloblastoma cells.
  downstream:
  - target: RANKL-Dependent Osteoclast Activation
    description: Tumor-stromal signaling promotes osteoclast activation in the ameloblastoma-bone microenvironment.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - RANKL release from tumor-stromal coculture
    evidence:
    - reference: PMID:36582941
      reference_title: RANKL neutralisation prevents osteoclast activation in a human in vitro ameloblastoma-bone model.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RANKL release was validated through TACE/ADAM17 activation chemically or through hOB co-culture."
      explanation: The human 3D coculture directly demonstrates RANKL release in the modeled tumor-stromal context.
- name: RANKL-Dependent Osteoclast Activation
  biological_scale: CELLULAR
  description: >-
    RANKL signaling in the ameloblastoma-bone microenvironment activates
    osteoclasts; neutralization with denosumab reduces this activation in a
    fully human in-vitro model.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  evidence:
  - reference: PMID:36582941
    reference_title: RANKL neutralisation prevents osteoclast activation in a human in vitro ameloblastoma-bone model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Denosumab treatment resulted in decreased osteoclast activation in the presence of hOB and ameloblastoma cells."
    explanation: RANKL neutralization directly reduced osteoclast activation in the human ameloblastoma-bone model.
  downstream:
  - target: Local Jawbone Invasion and Destruction
    description: Activated osteoclasts contribute to resorption of jawbone adjacent to tumor.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Osteoclast-mediated bone resorption
    evidence:
    - reference: PMID:36582941
      reference_title: RANKL neutralisation prevents osteoclast activation in a human in vitro ameloblastoma-bone model.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "The aim of this study was to recapitulate ameloblastoma in a completely humanised 3D disease model containing ameloblastoma cells, osteoblasts and activated osteoclasts to investigate the RANKL pathway within the ameloblastoma stromal environment and its response to the RANKL antibody denosumab."
      explanation: The model supports the proposed osteoclast-mediated bridge, but it does not directly measure patient jawbone invasion; the edge is therefore partial and indirect.
- name: Local Jawbone Invasion and Destruction
  biological_scale: TISSUE
  description: >-
    Ameloblastoma invades and destroys jawbone and surrounding structures,
    producing expansile radiolucent lesions and local mass effects.
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:35689405
    reference_title: New Ameloblastoma Cell Lines Enable Preclinical Study of Targeted Therapies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although relatively uncommon and rarely metastatic, AB tumors are locally invasive and destructive to the jawbone and surrounding structures."
    explanation: The source directly supports local invasion and jawbone destruction.
  downstream:
  - target: Jaw Swelling
    description: Expansile tumor growth produces enlargement of the affected jaw.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11402276
      reference_title: "Ameloblastoma: a clinical, radiographic, and histopathologic analysis of 71 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Swelling was the most common symptom and was experienced by 27 (38.0%) patients."
      explanation: The clinical series directly documents jaw swelling in ameloblastoma.
  - target: Tooth Malposition
    description: Expansile jaw lesions can displace involved teeth.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24963238
      reference_title: "Ameloblastoma: A clinicoradiographic and histopathologic correlation of 11 cases seen in Goa during 2008-2012."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Radiographic features that could help in diagnosing ameloblastomas include its predominant occurrence in the mandible, multilocular radiolucency with well-defined, corticated, scalloped margins, expansion of buccal and lingual cortical plates, root resorption and tooth displacement."
      explanation: The case series directly links expanding ameloblastoma lesions with tooth displacement.
  - target: Facial Asymmetry
    description: Advanced jaw deformity can produce facial asymmetry.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Progressive jaw deformity
    evidence:
    - reference: PMID:42286159
      reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an advanced size, causing severe jaw deformity, facial asymmetry, and functional impairment."
      explanation: The clinical paper directly links advanced tumor size and jaw deformity to facial asymmetry.
  - target: Distant Metastatic Dissemination
    description: A rare subset disseminates beyond the primary jaw tumor by mechanisms that remain incompletely defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35822408
      reference_title: "Comparison of survival outcomes between ameloblastic carcinoma and metastasizing ameloblastoma: A systematic review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Metastases mainly affected the lungs, followed by cervical lymph nodes."
      explanation: The systematic review establishes distant dissemination and its sites, but does not resolve the causal intermediates from local invasion.

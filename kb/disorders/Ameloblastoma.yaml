name: Ameloblastoma
creation_date: "2026-06-22T00:00:00Z"
description: >-
  Ameloblastoma is a rare, usually benign epithelial odontogenic tumor of the
  jaw that is slow growing but locally invasive and destructive. Most tumors
  arise in the mandible. Recurrent somatic alterations activate MAPK or
  Hedgehog signaling, most often through BRAF p.Val600Glu or activating SMO
  variants. Surgery remains the principal treatment; recurrence risk is higher
  after conservative procedures, while radical surgery can cause substantial
  functional and aesthetic morbidity. Molecularly matched therapy is an
  emerging option for selected recurrent, unresectable, or neoadjuvant cases.
categories:
- Odontogenic Tumor
- Benign Neoplasm
parents:
- odontogenic neoplasm
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:42286159
      reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ameloblastomas are locally aggressive jaw tumors, primarily treated with radical surgery, which often results in significant functional and aesthetic morbidity."
      explanation: The disease is directly characterized as a tumor treated within an oncologic surgical framework.

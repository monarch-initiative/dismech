differential_diagnoses:
- name: Dentigerous cyst
  description: A cystic odontogenic lesion that can overlap histologically with unicystic ameloblastoma.
  distinguishing_features:
  - Calretinin staining was absent in the dentigerous cyst cases but present in most ameloblastoma and unicystic ameloblastoma cases in one study.
  evidence:
  - reference: PMID:33897185
    reference_title: "Comparison of calretinin expression in dentigerous cysts and ameloblastoma: An immunohistochemical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the cases of OKC and dentigerous cyst were negative for calretinin."
    explanation: The study directly supports a histopathologic adjunct distinguishing the cyst from ameloblastoma.
- name: Odontogenic keratocyst
  description: A cystic odontogenic lesion included in the histopathologic differential of unicystic ameloblastoma.
  distinguishing_features:
  - Calretinin staining was absent in the odontogenic keratocyst cases but present in most ameloblastoma and unicystic ameloblastoma cases in one study.
  evidence:
  - reference: PMID:33897185
    reference_title: "Comparison of calretinin expression in dentigerous cysts and ameloblastoma: An immunohistochemical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of eighty cases, in which twenty cases each of ameloblastoma, unicystic ameloblastoma, dentigerous cyst, and odontogenic keratocyst (OKC) were included in the study."
    explanation: The comparison directly places odontogenic keratocyst in the studied differential.
  - reference: PMID:33897185
    reference_title: "Comparison of calretinin expression in dentigerous cysts and ameloblastoma: An immunohistochemical study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the cases of OKC and dentigerous cyst were negative for calretinin."
    explanation: The study directly supports calretinin as a distinguishing adjunct.
- name: Ameloblastic carcinoma
  description: >-
    A malignant odontogenic tumor that must not be conflated with metastasizing
    ameloblastoma; the two have distinct clinical profiles and outcomes.
  distinguishing_features:
  - Ameloblastic carcinoma has worse survival after metastasis than metastasizing ameloblastoma in the systematic review.
  evidence:
  - reference: PMID:35822408
    reference_title: "Comparison of survival outcomes between ameloblastic carcinoma and metastasizing ameloblastoma: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering only the cases that metastasized, a higher ratio of AC patients died in comparison to MA patients (p = 0.003)."
    explanation: The systematic review directly distinguishes prognostic behavior after metastasis.

treatments:
- name: Aggressive Surgical Resection
  description: >-
    Radical or otherwise aggressive resection lowers recurrence compared with
    conservative surgery but can cause major functional and aesthetic morbidity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:34094934
    reference_title: "Recurrence Rates of Intraosseous Ameloblastoma Cases With Conservative or Aggressive Treatment: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled results indicated that the recurrence rate for aggressive treatment was much lower than that for conservative treatment."
    explanation: The meta-analysis directly supports lower recurrence after aggressive versus conservative surgery.
  - reference: PMID:42286159
    reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ameloblastomas are locally aggressive jaw tumors, primarily treated with radical surgery, which often results in significant functional and aesthetic morbidity."
    explanation: The prospective study directly describes radical surgery as principal treatment and its morbidity.
- name: Conservative Surgical Treatment
  description: >-
    Enucleation, curettage, or marsupialization may preserve jaw structure and
    quality of life in selected patients but carries a higher recurrence risk
    and requires closer surveillance.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39274556
    reference_title: "The Effect of Conservative vs. Radical Treatment of Ameloblastoma on Recurrence Rate and Quality of Life: An Umbrella Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the high recurrence rate, the latter was more appropriate in the case of smaller lesions and younger patients, due to better post-operative quality of life and reduced functional and esthetic impairments."
    explanation: The umbrella review directly supports the recurrence-versus-morbidity tradeoff for conservative treatment.
  - reference: PMID:39177897
    reference_title: "Factors Associated with Recurrence of Ameloblastoma: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified prognostic factors for recurrence included: (1) Tumor size/diameter/volume, (2) cortical bone perforation/ soft tissue invasion, (3) multilocular radiolucency, (4) impacted tooth-involving lesions, (5) root resorption, (6) WHO classification - conventional (solid/multicystic) ameloblastoma, (7) histological subtype - mural invasion of unicystic ameloblastoma, (8) conservative treatment modalities - simple enucleation, curettage, and marsupialization, and (9) non-extraction/preservation of involved teeth."
    explanation: The review directly identifies the conservative procedures and their association with recurrence.
- name: Molecularly Matched Targeted Therapy
  description: >-
    BRAF-directed therapy with dabrafenib with or without trametinib is an
    emerging, molecularly selected option. Evidence now includes prospective
    observational treatment, but cohort size and long-term disease-control data
    remain limited; use is not represented here as established first-line care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dabrafenib
      term:
        id: CHEBI:75045
        label: dabrafenib
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
    - preferred_term: vemurafenib
      term:
        id: CHEBI:63637
        label: vemurafenib
  target_mechanisms:
  - target: Somatic RTK-RAS-MAPK Driver Alterations
    treatment_effect: INHIBITS
    description: Dabrafenib inhibits mutant BRAF and trametinib inhibits downstream MEK signaling.
    evidence:
    - reference: PMID:24859340
      reference_title: Identification of recurrent SMO and BRAF mutations in ameloblastomas.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ameloblastoma cells harboring an activating BRAF mutation encoding p.Val600Glu are sensitive to the BRAF inhibitor vemurafenib."
      explanation: Mutation-matched inhibitor sensitivity directly supports inhibition of the BRAF driver mechanism.
    - reference: PMID:35689405
      reference_title: New Ameloblastoma Cell Lines Enable Preclinical Study of Targeted Therapies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "AB cells with KRAS or NRAS mutation (MAPK pathway) are exquisitely sensitive to MEK inhibition, which propels ameloblast differentiation."
      explanation: MEK-inhibitor sensitivity directly supports inhibition of downstream MAPK signaling in ameloblastoma cells.
  evidence:
  - reference: PMID:42286159
    reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Personalized treatment recommendations were made for 13 patients, and 11 received matched therapies: dabrafenib ± trametinib (n = 9), futibatinib (n = 1), or binimetinib (n = 1). Radiological tumor regression occurred in 10 of 11 treated patients."
    explanation: The prospective study directly reports molecularly matched regimens and responses.
  - reference: PMID:38927880
    reference_title: "Anti-MAPK Targeted Therapy for Ameloblastoma: Case Report with a Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "covering 23 patients treated with MAPK inhibitor therapies. The results were promising as nearly all patients showed a positive treatment response, with four achieving complete radiological remission and others showing substantial reductions in primary, recurrent, and metastatic ameloblastoma sizes."
    explanation: The systematic review supports treatment responses while retaining the limitation of a small case-based evidence base.
- name: Experimental SMO-Directed Therapy
  description: >-
    SMO-L412F ameloblastoma cells were resistant to vismodegib but sensitive in
    vitro to the distinct Smoothened inhibitor BMS-833923. This is preclinical
    genotype-specific evidence, not an established clinical treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Smoothened Antagonist BMS-833923
      term:
        id: NCIT:C77861
        label: Smoothened Antagonist BMS-833923
  target_mechanisms:
  - target: Activating SMO-Hedgehog Signaling
    treatment_effect: INHIBITS
    description: BMS-833923 reduced Hedgehog signaling and viability, whereas SMO-L412F cells were insensitive to vismodegib.
    evidence:
    - reference: PMID:35689405
      reference_title: New Ameloblastoma Cell Lines Enable Preclinical Study of Targeted Therapies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "AB cells with activating SMO-L412F mutation (Hedgehog pathway) are insensitive to vismodegib; however, a distinct small-molecule SMO inhibitor, BMS-833923, significantly reduces both downstream Hedgehog signaling and tumor cell viability."
      explanation: The mutation-matched experiment directly supports both vismodegib resistance and BMS-833923 sensitivity.
  evidence:
  - reference: PMID:35689405
    reference_title: New Ameloblastoma Cell Lines Enable Preclinical Study of Targeted Therapies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AB cells with activating SMO-L412F mutation (Hedgehog pathway) are insensitive to vismodegib; however, a distinct small-molecule SMO inhibitor, BMS-833923, significantly reduces both downstream Hedgehog signaling and tumor cell viability."
    explanation: The study directly establishes the genotype-specific preclinical response and resistance pattern.


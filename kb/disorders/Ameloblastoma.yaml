discussions:
- discussion_id: ameloblastoma_preclinical_model_fidelity
  prompt: How faithfully do current ameloblastoma models predict durable responses in patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - experimental_models#Conditionally reprogrammed human ameloblastoma cell-line panel
  - experimental_models#Fully humanized 3D ameloblastoma-bone coculture
  - treatments#Molecularly Matched Targeted Therapy
  rationale: >-
    Benign ameloblastoma cells have finite proliferation in two-dimensional
    culture, immortalization may alter phenotype, and subcutaneous xenograft
    engraftment is inefficient. Current response evidence is encouraging but
    small, and organoid or humanized models require further validation against
    long-term clinical outcomes.
  evidence:
  - reference: PMID:37550047
    reference_title: "[Research prospect of preclinical model construction and precision therapy in ameloblastoma]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In fact, benign tumor cells generally showed a finite proliferative capacity in two-dimensional culture, and most likely, they could exhibit altered cellular phenotype after immortalization. Moreover, this benign tumor presented low chances of subcutaneous engraftment in nude mice."
    explanation: The review directly states major fidelity and engraftment limitations of current models.
- discussion_id: ameloblastoma_targeted_therapy_durability
  prompt: Which patients obtain durable oncologic control from molecularly matched therapy, and when can surgical extent safely be reduced?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Molecularly Matched Targeted Therapy
  - pathophysiology#Somatic RTK-RAS-MAPK Driver Alterations
  rationale: >-
    Prospective evidence comprises a small observational cohort. Larger studies
    with standardized response, recurrence, resistance, and long-term surgical
    outcome measures are needed before targeted therapy can be treated as
    routine first-line management.
  evidence:
  - reference: PMID:42286159
    reference_title: "Targetable alterations and personalized treatment in ameloblastoma: results from a prospective observational precision oncology study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prospective observational study included comprehensive molecular profiling of 14 patients with ameloblastoma."
    explanation: The study directly establishes the limited prospective cohort size.


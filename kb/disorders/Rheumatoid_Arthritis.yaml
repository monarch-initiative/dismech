- name: Synovial Cellular Heterogeneity
  description: >
    Single-cell and mass cytometry profiling reveals discrete synovial fibroblast and macrophage subsets with distinct inflammatory and destructive potential. Disease-specific cellular phenotypes enable stratification into responder and non-responder groups for targeted therapy. Integration of synovial multi-omics signatures with clinical data supports precision medicine approaches.

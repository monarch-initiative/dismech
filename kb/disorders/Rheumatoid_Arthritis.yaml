    explanation: This reference indicates smoking as a significant predictor of severe extra-articular manifestations in RA, supporting the statement about severity.
  - reference: PMID:36155967
    reference_title: "Genetic, social, and environmental risk factors in rheumatoid arthritis-associated interstitial lung disease."
    supports: SUPPORT
    snippet: MUC5B and TOLLIP single nucleotide polymorphisms (SNPs) and cigarette smoking were associated with rheumatoid arthritis-interstitial lung disease (RA-ILD).
    explanation: Smoking is listed as a risk factor for RA and its associated complications, such as interstitial lung disease.
- name: Infections
  influences_mechanisms:
  - target: Mucosal Origins and Dysbiosis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the mucosal origins and dysbiosis node rather than at the
      autoimmune response, because that is where the cited sentences actually
      land: they concern microbial taxa at mucosal sites, not antibody
      production. All three items keep the partial grade this entry already
      assigned them, and the reason is visible in the sentences themselves,
      which offer a candidate culprit organism, a hedged more than one line of
      evidence, and a list of factors including infection. None establishes a
      route.
    evidence:
    - reference: PMID:32582191
      reference_title: "Infectious Triggers in Periodontitis and the Gut in Rheumatoid Arthritis (RA): A Complex Story About Association and Causality."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "In conclusion, we retrieved more than one line of evidence for mucosal sites and different microbial taxa to be potentially involved in the development of RA."
      explanation: >-
        Concludes there is more than one line of evidence for mucosal sites
        and different microbial taxa being potentially involved. Mucosal and
        microbial, which is this node, and hedged twice in one sentence.
    - reference: PMID:28516867
      reference_title: "The link between Proteus mirabilis, environmental factors and autoantibodies in rheumatoid arthritis."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Extensive data supports the roles of genetic, environmental and microbial factors in the triggering and development of this disease. Proteus mirabilis is considered as the main microbial culprit in the causation of RA."
      explanation: >-
        Names one organism as the main microbial culprit. A single candidate
        advanced by its own proponents rather than a settled attribution.
    - reference: PMID:35897715
      reference_title: "Interplay of Environmental, Individual and Genetic Factors in Rheumatoid Arthritis Provocation."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Possible mechanisms involving environmental and individual factors in RA pathogenesis were analyzed, namely, infections, mental stress, sleep deprivation ecology, age, perinatal and gender factors, eating habits, obesity and smoking."
      explanation: >-
        Lists infection among many environmental and individual factors
        analysed. Category level, and the weakest of the three.

  title: RNA-Seq Analysis of Fibroblast-Like Synoviocytes Treated With Lutein in a Rheumatoid Arthritis Context
  description: Rheumatoid arthritis (RA) is a chronic autoimmune disease characterized by synovial inflammation and progressive joint destruction. Although lutein is known for its antioxidant and anti-inflammatory properties, its effects on gene expression in RA-associated synoviocytes remain unclear. In this study, we performed RNA sequencing to investigate transcriptomic changes in fibroblast-like synoviocytes (FLS) treated with lutein. Differentially expressed genes were identified and analyzed using Gene Set Enrichment Analysis (GSEA) and Ingenuity Pathway Analysis (IPA) to explore relevant biological processes and molecular networks.

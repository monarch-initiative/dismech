- discussion_id: gap_ra_hypoxia_glycolysis_lactate_axis
  prompt: >-
    How do hypoxic microenvironment signals initiate glycolytic reprogramming in RA synovial
    cells, and via what epigenetic and inflammatory mechanisms does lactate accumulation and
    lactylation drive synovial hyperplasia, pannus formation, and osteoclastic bone destruction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Inflammatory Cytokine Production
  - pathophysiology#Synovial Hyperplasia
  - pathophysiology#Cartilage and Bone Destruction
  rationale: >-
    RA synovitis is characterized by a hypoxic microenvironment driven by chronic inflammation,
    increased metabolic demand, and impaired oxygen diffusion. Recent literature identifies that
    hypoxia → glycolytic switching → lactate-mediated epigenetic signaling (lactylation) as a
    conserved axis driving RA pathology. However, the specific causal relationships remain incompletely
    characterized: (1) which synovial cell types (fibroblasts, macrophages, T cells) are primary targets
    of hypoxic glycolytic reprogramming, (2) how lactate and lactylation of histone and non-histone
    proteins modify inflammatory gene expression, and (3) how metabolic reprogramming mechanistically drives
    the progression from inflammatory cytokine secretion to synovial hyperplasia and invasive pannus formation
    with subsequent cartilage and bone erosion. The RA entry captures autoimmune and inflammatory cytokine
    drivers but lacks representation of this metabolic-epigenetic axis as a mechanistic complement to classical
    immune-centered models, with both conserved cell-intrinsic and synovial-niche implications for targeting
    either the glycolytic program, lactate metabolism, or lactate-dependent epigenetic rewiring.
  evidence:
  - reference: PMID:42346149
    reference_title: "Mechanisms and Therapeutic Targets of Hypoxia-Mediated Modifications in Glycolysis and Lactylation in Rheumatoid Arthritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In an inflammatory environment, the body's metabolic rate accelerates, leading to increased local
      oxygen consumption and ultimately creating a hypoxic microenvironment. Research has shown that under
      hypoxic conditions, glycolysis serves as the body's primary energy pathway and is essential for sustaining
      the inflammatory response. Furthermore, lactate, a byproduct of glycolysis, functions not only as a metabolic
      byproduct but also as a precursor molecule; through lactylation, it contributes to the progression of RA.
    explanation: >-
      Recent review articulates the hypoxia-glycolysis-lactylation axis as an incompletely characterized but
      potentially conserved driver of RA pathology, mechanistically distinct from classical autoimmune pathways.
- discussion_id: gap_ra_cuproptosis_evidence_hierarchy
  prompt: >-
    Does copper dysregulation in rheumatoid synovium reach canonical cuproptosis
    - copper-dependent, FDX1-lipoylation-driven cell death with Fe-S cluster
    destabilization - or is it a copper-associated mitochondrial and redox
    stress state that belongs alongside the entry's existing hypoxia-glycolysis
    axis rather than as a separate cell-death mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Glycolytic Reprogramming of Inflammatory Cells
  - pathophysiology#Inflammatory-Induced Hypoxic Microenvironment
  rationale: >-
    RA is one of the two systemic autoimmune diseases named in the
    cuproptosis-in-autoimmunity literature, and this entry already models an
    immunometabolic arm - hypoxia, glycolytic reprogramming, and
    lactate-dependent epigenetic rewiring - that a copper-dependent
    mitochondrial mechanism would either extend or compete with. The unresolved
    question is one of evidence level, not plausibility: the source review
    defines a five-part bar for calling something canonical cuproptosis and
    reports that the RA-relevant literature does not clear it, reflecting
    copper-associated metabolic stress or susceptibility markers instead. This
    entry therefore records the mechanism as an open gap and adds no cuproptosis
    node, so that a later curator finds the question rather than an unsupported
    edge.
  evidence:
  - reference: PMID:42435071
    reference_title: "From copper imbalance to immunometabolic remodeling: cuproptosis-related vulnerability and therapeutic hypotheses in autoimmune diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      direct in vivo evidence of canonical cuproptosis in autoimmune lesions
      remains scarce, and most relevant studies rely on transcriptomic
      associations, public dataset mining, or model-dependent experiments
    explanation: >-
      States the evidence-hierarchy gap directly - the reason this entry records
      cuproptosis as an open question rather than as a pathophysiology node.
  - reference: PMID:42435071
    reference_title: "From copper imbalance to immunometabolic remodeling: cuproptosis-related vulnerability and therapeutic hypotheses in autoimmune diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      systemic AIDs (e.g., systemic lupus erythematosus, rheumatoid arthritis)
      and organ-specific AIDs (e.g., inflammatory bowel disease, ankylosing
      spondylitis) were summarized. Findings mostly reflected copper-associated
      metabolic stress or susceptibility markers rather than definitive
      functional activation.
    explanation: >-
      Names rheumatoid arthritis specifically, and characterizes what the
      RA-relevant findings actually show - metabolic stress or susceptibility
      markers, not demonstrated functional activation.
  - reference: PMID:42435071
    reference_title: "From copper imbalance to immunometabolic remodeling: cuproptosis-related vulnerability and therapeutic hypotheses in autoimmune diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      canonical cuproptosis can only be confirmed when copper dependence,
      involvement of the Ferredoxin 1 (FDX1)-lipoylation axis, aggregation of
      lipoylated proteins, destabilization of Fe-S clusters, and functional
      rescue are demonstrated
    explanation: >-
      Gives the explicit five-part confirmation bar that the proposed experiment's
      decision criterion is written against.
  - reference: PMID:42435071
    reference_title: "From copper imbalance to immunometabolic remodeling: cuproptosis-related vulnerability and therapeutic hypotheses in autoimmune diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current research on cuproptosis in AIDs is largely correlative,
      bioinformatic, or model dependent, and is insufficient to confirm canonical
      cuproptosis as a primary pathogenic mechanism in AIDs
    explanation: >-
      The review's own conclusion, and the explicit justification for leaving this
      out of the causal graph.
  proposed_experiments:
  - experiment_id: exp_ra_canonical_cuproptosis_criteria_in_synovium
    name: Canonical-cuproptosis criteria applied to RA synovial tissue and synovial macrophages
    description: >-
      Test the five canonical cuproptosis criteria in RA synovial biopsies and
      sorted synovial macrophages and fibroblast-like synoviocytes rather than in
      transcriptomic surrogates: quantify tissue and intracellular copper, assay
      FDX1 protein with lipoylated DLAT/DLST aggregation in situ, measure Fe-S
      cluster protein destabilization, and test chelation and ionophore rescue.
      Because the synovium is already hypoxic and glycolytic, run the panel
      against matched hypoxia and lactate readouts so that a copper-dependent
      death program can be distinguished from the entry's existing
      hypoxia-glycolysis-lactylation axis.
    experiment_type:
      preferred_term: mechanism validation study on human synovial tissue
    assays:
    - preferred_term: tissue and intracellular copper quantification
    - preferred_term: FDX1 immunoblot and in situ protein detection
    - preferred_term: lipoylated protein aggregation assay
    - preferred_term: Fe-S cluster protein stability assay
    - preferred_term: synovial hypoxia and lactate profiling
    readouts:
    - name: Copper dependence of synovial cell death
      target: pathophysiology#Glycolytic Reprogramming of Inflammatory Cells
      description: >-
        Synovial copper content paired with cell-death burden in macrophage and
        fibroblast compartments, and the change in that burden under chelation.
      direction: INCREASED
      interpretation: >-
        Copper burden tracking synovial cell death and falling with chelation
        would satisfy the copper-dependence criterion; no change would place the
        copper signal downstream of inflammation.
    - name: Separation from the hypoxia-glycolysis axis
      target: pathophysiology#Inflammatory-Induced Hypoxic Microenvironment
      description: >-
        FDX1-lipoylation readouts modeled against matched synovial hypoxia and
        lactate measurements in the same tissue.
      direction: ALTERED
      interpretation: >-
        An FDX1-lipoylation signal that persists after adjusting for hypoxia and
        lactate would justify a distinct mechanism node; one that collapses would
        confirm it as part of the existing immunometabolic arm.
    controls:
    - name: Osteoarthritis synovium
      description: >-
        Non-autoimmune degenerative synovial tissue, to test whether any copper
        signal is inflammation-specific.
    - name: Treatment-naive versus treated RA synovium
      description: >-
        Separates disease biology from copper handling altered by DMARD or
        biologic therapy.
    decision_criterion: >-
      Add a cuproptosis pathophysiology node to this entry only if all five
      canonical criteria are met in RA synovial material and the signal survives
      adjustment for hypoxia and lactate; otherwise record copper dysregulation as
      a metabolic-stress marker within the existing immunometabolic arm.
    would_support:
    - pathophysiology#Glycolytic Reprogramming of Inflammatory Cells
    - pathophysiology#Inflammatory-Induced Hypoxic Microenvironment

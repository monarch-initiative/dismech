discussions:
- discussion_id: gap_ra_synovial_lining_quiescence_induction
  prompt: >-
    Can the quiescent synovial lining program seen in RA remission be actively
    induced to suppress pathogenic fibroblast-myeloid niches, or is it only a
    marker that appears after inflammation has already resolved?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Synovial Hyperplasia
  - pathophysiology#Inflammatory Cytokine Production
  - pathophysiology#Cartilage and Bone Destruction
  rationale: >-
    The entry captures synovial hyperplasia and cytokine-driven joint
    destruction, but recent spatial and organoid studies indicate that
    fibroblast density, EGFR-CREB5 signaling, and myeloid-stromal niches may
    determine whether the lining adopts a homeostatic or invasive state. A
    causal experiment would distinguish remission biology that can be
    therapeutically induced from a passive correlate of low inflammation.
  proposed_experiments:
  - experiment_id: exp_ra_synovial_organoid_egfr_creb5_quiescence
    name: Human RA synovial organoid EGFR-CREB5 quiescence induction assay
    description: >-
      Build 3D human synovial organoids from RA fibroblast-like synoviocyte
      clusters, blood-derived myeloid precursors, and endothelial cells; tune
      fibroblast spatial density and inflammatory cytokine exposure; activate
      or inhibit HB-EGF-EGFR-CREB5 signaling; and test whether a quiescent
      lining program suppresses invasive, cytokine-producing fibroblast states.
    experiment_type:
      preferred_term: synovial organoid perturbation experiment
    model_systems:
    - name: Human RA synovial fibroblast-myeloid organoid
      description: >-
        Three-dimensional human synovial organoid containing RA
        fibroblast-like synoviocyte clusters, blood-derived myeloid precursors,
        and endothelial cells to reproduce lining and sublining niche
        architecture.
      experimental_model_type: ORGANOID
      namo_type: namo:Organoid
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: synovial membrane
        term:
          id: UBERON:0002018
          label: synovial membrane of synovial joint
      cell_types:
      - preferred_term: fibroblast-like synoviocyte
        term:
          id: CL:0000057
          label: fibroblast
      - preferred_term: macrophage
        term:
          id: CL:0000235
          label: macrophage
      - preferred_term: endothelial cell
        term:
          id: CL:0000115
          label: endothelial cell
      cell_source: RA synovial biopsy-derived fibroblasts plus blood-derived myeloid precursors
      culture_system: 3D matrix-embedded synovial organoid with controlled fibroblast density
    perturbations:
    - name: HB-EGF-EGFR-CREB5 axis activation or blockade
      target: pathophysiology#Synovial Hyperplasia
      description: >-
        Ligand stimulation, EGFR inhibition, and CREB5 activation or knockdown
        used to test whether proximity-sensing signaling actively specifies
        quiescent lining fibroblast differentiation.
      genes:
      - preferred_term: HBEGF
      - preferred_term: EGFR
      - preferred_term: CREB5
    - name: IL-1 beta and TGF-beta inflammatory fibroblast challenge
      target: pathophysiology#Inflammatory Cytokine Production
      description: >-
        Cytokine combination used to induce the invasive glycolytic RA-FLS
        state before or after quiescence-induction perturbations.
      biological_processes:
      - preferred_term: cytokine-mediated signaling pathway
        term:
          id: GO:0019221
          label: cytokine-mediated signaling pathway
    - name: TAK1 pathway blockade
      target: pathophysiology#Inflammatory Cytokine Production
      description: >-
        TAK1 inhibition used as a comparator for suppressing IL-1 beta/TGF-beta
        pathogenic fibroblast activation.
      gene:
        preferred_term: MAP3K7
    readouts:
    - name: Quiescent lining fibroblast differentiation
      target: pathophysiology#Synovial Hyperplasia
      description: PRG4, CLU, and PDPN lining markers versus proliferative fibrotic markers.
      assays:
      - preferred_term: spatial transcriptomic profiling
      - preferred_term: immunofluorescence assay
      direction: NEGATIVE
    - name: Pathogenic fibroblast invasion and matrix remodeling
      target: pathophysiology#Cartilage and Bone Destruction
      description: MMP, collagen, invasion, and synovial-growth readouts in the organoid matrix.
      biological_processes:
      - preferred_term: extracellular matrix organization
        term:
          id: GO:0030198
          label: extracellular matrix organization
      assays:
      - preferred_term: invasion assay
      - preferred_term: extracellular matrix immunostaining
      direction: POSITIVE
    - name: Myeloid-stromal inflammatory niche state
      target: pathophysiology#Inflammatory Cytokine Production
      description: Macrophage subset composition and FLS cytokine output after quiescence induction.
      biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
      assays:
      - preferred_term: single-cell transcriptomic profiling
      - preferred_term: multiplex cytokine profiling
      direction: POSITIVE
    controls:
    - name: Healthy donor synovial organoid
      description: Matched organoid built from non-RA synovial fibroblast and myeloid compartments.
    - name: Low-density fibroblast organoid
      description: Density-control organoid expected to favor proliferative or fibrotic states.
    - name: Vehicle-treated RA synovial organoid
      description: RA organoid receiving vehicle rather than EGFR-CREB5 or TAK1 perturbation.
    decision_criterion: >-
      Active induction is supported if EGFR-CREB5 activation restores PRG4/CLU/
      PDPN lining markers and reduces invasive, glycolytic, and cytokine
      readouts even under IL-1 beta/TGF-beta challenge; passive-marker status
      is supported if quiescent markers appear only after inflammatory signals
      are removed.
    would_support:
    - pathophysiology#Synovial Hyperplasia
    - pathophysiology#Inflammatory Cytokine Production
    would_refute:
    - pathophysiology#Synovial Hyperplasia
    evidence:
    - reference: PMID:41427340
      reference_title: "Fibroblasts sense spatial proximity via an EGFR-CREB5 axis to restore quiescent synovial lining in remission rheumatoid arthritis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Perturbation of the EGFR-CREB5 axis abolishes fibroblast proximity-sensing and blocks synovial lining fibroblast differentiation."
      explanation: >-
        Provides the specific proximity-sensing pathway that the proposed
        organoid experiment would test as an inducible remission mechanism.
    - reference: PMID:41333404
      reference_title: "The ontogeny of myeloid-stromal synovial tissue niches in rheumatoid arthritis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These organoids reproduced key synovial tissue features, including lining and sublining architecture and stromal-myeloid cell cluster composition."
      explanation: >-
        Supports feasibility of a human synovial organoid that preserves the
        tissue architecture needed to test lining-state restoration.
    - reference: PMID:41435749
      reference_title: "Immune cell-derived cytokines synergistically interact to drive synovial fibroblast invasive function and metabolic capacity."
      supports: SUPPORT

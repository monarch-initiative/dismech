- accession: geo:GSE309906
  title: Single-cell RNA sequencing of stem cell–like memory T (Tscm) cells from rheumatoid arthritis patients and healthy controls
  description: Stem cell–like memory T (Tscm) cells are a subset of T cells with self-renewal capacity and multipotent differentiation potential upon antigen stimulation. Tscm cells have been implicated in the pathogenesis of autoimmune diseases. In this study, we performed single-cell RNA sequencing using the 10x Genomics platform on Tscm cells enriched by fluorescence-activated cell sorting (FACS). Our objective was to characterize the transcriptomic signatures of Tscm cells in patients with rheumatoid arthritis (RA) and to identify disease-specific features that may contribute to RA pathogenesis and progression.

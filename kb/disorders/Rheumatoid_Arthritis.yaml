environmental:
- name: Smoking
  influences_mechanisms:
  - target: B Cell and Plasma Cell Responses
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The best-evidenced exposure in this entry, and the only one whose
      sentences distinguish which patients are affected: smoking raises the
      risk of the seropositive form specifically, the one defined by
      rheumatoid factor and anti-citrullinated protein antibodies. Pointed at
      the B cell and plasma cell node because that is where this entry puts
      those autoantibodies, rather than at the general autoimmune response
      node, whose own text is about synovial attack and carries no antibody
      content. The intermediates are left unknown despite that specificity,
      because no cited sentence follows smoke to citrullination or to any
      other step; the association is with the serotype, not with a mechanism.
    evidence:
    - reference: PMID:22609003
      reference_title: "Tobacco and other environmental risk factors in rheumatoid arthritis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Smoking is associated with an increased risk of developing seropositive RA (RF and/or ACPA). Recent studies show that tobacco smoking can influence disease phenotype, with the development of more aggressive disease and greater joint damage."
      explanation: >-
        Associates smoking with increased risk of seropositive disease and
        with a more aggressive phenotype and greater joint damage. The
        serotype it names is the antibody response at this node.
    - reference: PMID:12860726
      reference_title: "Extra-articular disease manifestations in rheumatoid arthritis: incidence trends and risk factors over 46 years."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In a multivariate analysis the main predictors of severe ExRA were smoking at RA diagnosis (risk ratio (RR)=2.94; 95% confidence interval (95% CI) 1.68 to 5.13)."
      explanation: >-
        Multivariate analysis making smoking at diagnosis the main predictor
        of severe extra-articular disease, at a risk ratio of 2.94. Severity
        of a different manifestation rather than the antibody response this
        node holds.
    - reference: PMID:36155967
      reference_title: "Genetic, social, and environmental risk factors in rheumatoid arthritis-associated interstitial lung disease."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "MUC5B and TOLLIP single nucleotide polymorphisms (SNPs) and cigarette smoking were associated with rheumatoid arthritis-interstitial lung disease (RA-ILD)."
      explanation: >-
        Associates smoking with the interstitial lung disease complication
        alongside two genetic variants. An organ complication, further still
        from this node.
  notes: Increases risk and severity
  exposure_term:
    preferred_term: Tobacco smoking exposure
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:

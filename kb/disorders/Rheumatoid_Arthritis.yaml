- accession: geo:GSE309430
  title: 'Blood-Based Gene Signatures Associated with Therapeutic Response to Anti-TNF Therapy in Rheumatoid Arthritis: A Combined Meta-Analytical and Machine Learning Approach'
  description: Objective Tumor necrosis factor alpha (TNF-α) inhibitors have significantly improved outcomes in rheumatoid arthritis (RA); however, up to 30–40% of patients show inadequate response. This highlights the need for predictive biomarkers to guide personalized therapy. Blood transcriptome profiling is a promising strategy for identifying gene signatures linked to treatment response, though prior studies have shown inconsistent results due to technical and biological heterogeneity. Methods We performed a comprehensive meta-analysis of baseline blood transcriptome datasets from eight independent RA cohorts to identify genes consistently upregulated in patients who responded to TNF-α inhibitors.

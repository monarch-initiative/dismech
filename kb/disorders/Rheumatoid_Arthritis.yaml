    description: Glycolytic reprogramming supports sustained cytokine production and inflammatory signaling in immune and stromal cells.
    causal_link_type: DIRECT
  - target: Lactate-Mediated Signaling and Epigenetic Modification
    description: Glycolysis generates lactate, which serves both as a metabolic signaling molecule and as a substrate for post-translational modifications that enhance inflammatory gene expression.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42346149
    reference_title: "Mechanisms and Therapeutic Targets of Hypoxia-Mediated Modifications in Glycolysis and Lactylation in Rheumatoid Arthritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Research has shown that under hypoxic conditions, glycolysis serves as the body's primary energy pathway and is essential for sustaining the inflammatory response."
    explanation: Paper establishes glycolysis as essential for sustaining RA-associated inflammatory responses in hypoxic synovial conditions.
- name: Lactate-Mediated Signaling and Epigenetic Modification
  description: >-
    Lactate produced by glycolytic reprogramming functions as both a metabolic byproduct
    and a precursor molecule for protein and histone lactylation, driving epigenetic
    modifications that promote inflammatory gene expression programs and contribute to
    synovial hyperplasia, pannus formation, and bone destruction. Lactate also activates
    metabolic signaling pathways in immune and stromal cells to amplify inflammatory responses.

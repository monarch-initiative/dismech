  downstream:
  - target: Cartilage and Bone Destruction
    description: Distinct pathogenic fibroblast and macrophage subsets in the inflamed synovium drive cartilage and bone destruction via their respective inflammatory and matrix-degrading programs.
  notes: Single-cell RNA sequencing and mass cytometry define refined synovial molecular signatures and cell-type abundance phenotypes; approximately 40% of RA patients show non-response to initial therapy, partly explained by distinct synovial cellular phenotypes. Distinct synovial cell subsets (fibroblasts, macrophages, T cells) engage in inflammatory crosstalk networks that drive disease.
  evidence:
  - reference: PMID:42167060
    reference_title: "New learnings from the molecular pathology of the synovial tissue in rheumatoid arthritis: from pathogenesis to therapeutic targeting toward precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cellular and molecular deconvolution of synovial tissue heterogeneity reveals discrete disease phenotypes, enabling disease stratification and response prediction. Recent advances in single-cell RNA sequencing and mass cytometry have defined more refined synovial molecular signatures and cell-type abundance phenotypes, uncovering novel pathogenic cellular subsets and inflammatory crosstalk networks.
    explanation: This review demonstrates that single-cell and multi-omics profiling of synovial tissue reveals discrete cellular phenotypes that correlate with disease pathogenesis and treatment response, supporting precision medicine approaches in RA.
  - reference: PMID:42167060
    reference_title: "New learnings from the molecular pathology of the synovial tissue in rheumatoid arthritis: from pathogenesis to therapeutic targeting toward precision medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite the success of targeted therapies in rheumatoid arthritis, the lack of predictive biomarkers of response leads to an empirical treatment approach, often delaying effective intervention due to non-response to the initially selected individualized medication regimens in approximately 40% of patients.
    explanation: Treatment response heterogeneity in RA is partially explained by differences in synovial cellular and molecular phenotypes, highlighting the need for biomarker-driven precision medicine strategies.
- name: Centrally Mediated Pain and Central Sensitization
  description: >
    Persistent pain in RA occurs despite inflammatory control in a subset of patients,
    reflecting central sensitization with augmented pain signal processing and impaired
    descending pain inhibition. Widespread pain phenotype with reduced conditioned pain
    modulation indicates involvement of central nervous system pain amplification mechanisms.
    Psychological distress is a stronger predictor of pain severity
    than peripheral inflammatory markers, supporting mechanism-based pain stratification
    and targeted analgesic strategies. Central amplification is mediated by dorsal horn
    neuron hyperexcitability and microglial neuroinflammation in the central nervous system.
  biological_processes:
  - preferred_term: Pain Processing
    term:
      id: GO:0048265
      label: response to pain
    modifier: INCREASED
  - preferred_term: Synaptic Transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DYSREGULATED
  cell_types:
  - preferred_term: Dorsal horn neuron
    term:
      id: CL:0005000
      label: spinal cord interneuron
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PPR:PPR1260392
    reference_title: "Peripheral and central contributions to persistent pain in rheumatoid arthritis: an unbiased latent profile analysis identifies four mechanism-based phenotypes"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four phenotypes were identified: a peripheral, low-inflammation/low-central phenotype (38%); a predominantly inflammatory phenotype (7%); and moderate (43%) and severe (12%) centrally mediated phenotypes. Centrally mediated phenotypes reported the highest pain (NRS 8.2), worst disease impact and lowest employment."
    explanation: Latent profile analysis identified centrally mediated pain phenotypes (moderate and severe) representing 55% of RA patients with persistent pain, showing highest pain severity and worst functional outcomes.
  - reference: PPR:PPR1260392
    reference_title: "Peripheral and central contributions to persistent pain in rheumatoid arthritis: an unbiased latent profile analysis identifies four mechanism-based phenotypes"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conditioned pain modulation was impaired relative to controls (p<0.001) and most reduced in the severe centrally mediated phenotype."
    explanation: Impaired descending pain inhibition (reduced conditioned pain modulation) is a hallmark of central sensitization and is most pronounced in severe centrally mediated pain phenotype.
  - reference: PPR:PPR1260392
    reference_title: "Peripheral and central contributions to persistent pain in rheumatoid arthritis: an unbiased latent profile analysis identifies four mechanism-based phenotypes"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychological distress was the strongest independent predictor of pain severity (model R²=0.33), whereas inflammatory markers were not."
    explanation: Psychological factors are stronger predictors of pain severity than peripheral inflammatory markers in RA, indicating that pain phenotyping requires assessment beyond inflammation.
  - reference: PPR:PPR1260392
    reference_title: "Peripheral and central contributions to persistent pain in rheumatoid arthritis: an unbiased latent profile analysis identifies four mechanism-based phenotypes"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DAS28-CRP was similar in both the inflammatory and severe centrally mediated phenotypes but for different reasons - swollen joints and CRP versus tender joints - and did not distinguish them."
    explanation: Disease Activity Score and CRP fail to distinguish inflammatory from centrally mediated pain phenotypes, revealing the limitations of inflammation-only assessment in RA pain stratification.
  - reference: PMID:22035625
    reference_title: "Central sensitization in patients with rheumatoid arthritis: a systematic literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symmetrical manifestation of the disease, the poor relation between disease activity and symptoms, and the generalized hyperalgesia at both articular and nonarticular sites for different kinds of stimuli are indicative of the presence of central sensitization in RA patients."
    explanation: Peer-reviewed systematic literature review corroborating the central-sensitization mechanism in RA, addressing the sole-preprint-reliance concern; generalized hyperalgesia and the poor disease-activity/symptom relationship indicate central pain amplification.
  - reference: PMID:38757102
    reference_title: "Impact of central sensitization on clinical parameters in patients with rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of CS leads to pain sensitivity as well as overestimation of disease activity in RA patients."
    explanation: Peer-reviewed clinical study (60 RA patients) providing independent corroboration that central sensitization amplifies pain sensitivity and inflates apparent disease activity, supporting mechanism-based pain stratification.

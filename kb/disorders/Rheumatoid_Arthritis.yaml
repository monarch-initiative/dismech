  downstream:
  - target: Glycolytic Reprogramming of Inflammatory Cells
    description: Hypoxic conditions in the inflamed synovium trigger metabolic reprogramming toward glycolysis as the primary energy pathway to sustain inflammatory cell function.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42346149
    reference_title: "Mechanisms and Therapeutic Targets of Hypoxia-Mediated Modifications in Glycolysis and Lactylation in Rheumatoid Arthritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In an inflammatory environment, the body's metabolic rate accelerates, leading to increased local oxygen consumption and ultimately creating a hypoxic microenvironment."
    explanation: Paper directly establishes that chronic inflammation in RA creates local synovial hypoxia through increased oxygen consumption.
- name: Glycolytic Reprogramming of Inflammatory Cells
  description: >-
    Hypoxia-inducible factors reprogram inflammatory immune cells and synovial
    fibroblasts toward glycolytic metabolism. Glycolysis becomes the primary ATP-generating
    pathway, driving sustained production of pro-inflammatory cytokines and matrix-degrading
    enzymes that maintain synovial hyperplasia and bone destruction.
  locations:

    term:
      id: NCIT:C15262
      label: Immunotherapy
- name: JAK Inhibitors
  description: >-
    Oral targeted synthetic DMARDs (tofacitinib, baricitinib, upadacitinib, and
    related agents) that inhibit Janus kinases, blocking JAK/STAT signal
    transduction downstream of multiple pro-inflammatory cytokine receptors
    (notably IL-6). Used in rheumatoid arthritis, typically after inadequate
    response to conventional synthetic or biologic DMARDs.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: JAK/STAT Signaling
    treatment_effect: INHIBITS
    description: >-
      JAK inhibitors block Janus kinase catalytic activity, suppressing the
      IL-6-driven JAK/STAT signaling that is implicated in RA synovial
      inflammation and disease progression.
    evidence:
    - reference: PMID:35367240
      reference_title: "Underpinning IL-6 biology and emphasizing selective JAK blockade as the potential alternate therapeutic intervention for rheumatoid arthritis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This review discusses the history of research into IL-6 biology and therapies that target the IL-6 driven JAK/STAT pathway, including the successes, challenges, and drawbacks, emphasizing RA."
      explanation: The review frames JAK inhibitors as therapies that target the IL-6-driven JAK/STAT pathway in RA, supporting the INHIBITS link to the JAK/STAT Signaling node.
  evidence:
  - reference: PMID:32550671
    reference_title: "Biologic agents and small-molecule inhibitors in systemic autoimmune conditions: an update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Janus kinase (JAK) inhibitors (tofacitinib, baricitinib, and upadacitinib) and phosphodiesterase 4 inhibitors (apremilast) form this group."
    explanation: Identifies tofacitinib, baricitinib, and upadacitinib as the JAK-inhibitor small-molecule class used in systemic autoimmune conditions including RA.
  - reference: PMID:35367240
    reference_title: "Underpinning IL-6 biology and emphasizing selective JAK blockade as the potential alternate therapeutic intervention for rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JAK inhibitors, namely Tofacitinib, Baricitinib, Decernotinib, Upadacitinib, Peficitinib, and Filgotinib, have demonstrated clinical efficacy in recent decades as an alternative therapeutic strategy to abrogate IL-6 mediated aberrant activity in RA."
    explanation: Establishes that JAK inhibitors have demonstrated clinical efficacy in RA, supporting their inclusion as a targeted synthetic DMARD treatment class.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

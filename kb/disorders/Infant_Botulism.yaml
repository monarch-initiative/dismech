    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infant botulism is a severe neuroparalytic disease caused by ingestion of
      the spore-forming neurotoxic clostridia, including Clostridium botulinum
      that colonize the large intestine and subsequently produce botulinum
      neurotoxin in situ.
    explanation: The review describes the intestinal-colonization mechanism unique to this form.
- name: Presynaptic acetylcholine release blockade
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    Absorbed toxin binds peripheral cholinergic terminals, is internalized, and
    its light-chain metalloprotease cleaves SNARE proteins, preventing
    acetylcholine exocytosis at somatic motor and autonomic cholinergic
    terminals. This presynaptic functional denervation underlies both the motor
    and the autonomic features of infant botulism.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: negative regulation of acetylcholine secretion, neurotransmission
    term:
      id: GO:0014058
      label: negative regulation of acetylcholine secretion, neurotransmission
  - preferred_term: acetylcholine secretion, neurotransmission
    modifier: DECREASED
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
  mechanism_confidence: ESTABLISHED
  biological_scale: CELLULAR
  downstream:
  - target: Descending flaccid paralysis
    causal_link_type: DIRECT
    description: Failure of acetylcholine release at skeletal neuromuscular junctions produces symmetric descending weakness.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Botulism is a rare, neurotoxin-mediated, life-threatening disease
        characterized by flaccid descending paralysis that begins with cranial
        nerve palsies and might progress to extremity weakness and respiratory
        failure.
      explanation: The guideline links presynaptic blockade to the descending flaccid paralysis.
  - target: Bulbar and ocular neuromuscular transmission failure
    causal_link_type: DIRECT
    description: Cranial motor terminals are prominently affected, producing ptosis, ophthalmoplegia, facial weakness, feeding difficulty, and a weak cry.
    evidence:
    - reference: PMID:37429225
      reference_title: "Neonatal Botulism: A Case Series Suggesting Varied Presentations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        other features can include facial diplegia, weak suck and cry,
        appendicular weakness, and hypotonia
      explanation: The case series documents the cranial and bulbar features of infant disease.
  - target: Autonomic cholinergic transmission failure
    causal_link_type: DIRECT
    description: Blockade at parasympathetic cholinergic terminals impairs intestinal motility and pupillary responses, producing constipation and pupillary abnormalities.
    evidence:
    - reference: PMID:37429225

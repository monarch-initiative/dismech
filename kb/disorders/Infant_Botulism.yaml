    preferred_term: neonatal sepsis
    term:
      id: MONDO:0700217
      label: neonatal sepsis
  description: >-
    A poorly feeding, hypotonic, lethargic young infant is commonly evaluated
    and treated first for sepsis; infant botulism should be considered when the
    infant does not improve with treatment for an infection.
  distinguishing_features:
  - Negative blood, urine, and cerebrospinal-fluid cultures with failure to improve on antimicrobial therapy favor infant botulism.
  - Constipation, ptosis, facial diplegia, bulbar weakness, and progressive areflexia point to a presynaptic neuromuscular cause.
  - Stool botulinum toxin or a presynaptic electrodiagnostic pattern confirms infant botulism.

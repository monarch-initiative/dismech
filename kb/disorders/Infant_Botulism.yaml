transmission:
- name: Intestinal colonization by ingested spores with in-situ toxin production
  description: >-
    Unlike foodborne botulism, which is an intoxication with preformed toxin,
    infant botulism follows ingestion of environmental C. botulinum spores that
    colonize the immature large intestine and produce toxin locally
    (toxicoinfection).
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome known as infant botulism is an exceedingly rare and sporadic
      disease caused by colonization of the intestine by Clostridia and in situ
      toxin production.
    explanation: The guideline defines infant botulism as intestinal colonization with in-situ toxin production.
- name: Environmental spore exposure from honey, soil, and dust
  description: >-
    The ingested spores are acquired from the environment; honey is the only
    well-established dietary risk factor, while outdoor soil and indoor dust are
    the implicated environmental sources.
  evidence:
  - reference: PMID:39138824
    reference_title: "Infant Botulism: In Search of Clostridium botulinum Spores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      primarily implicated outdoor soil and indoor dust, as well as commonly
      ingested foods including honey, dry cereals, and even powdered infant
      formula.
    explanation: The review identifies the environmental and dietary spore sources associated with infant botulism.
agent_life_cycle:
  description: >-
    C. botulinum is an environmental saprophyte whose heat-resistant spores
    persist in soil, aquatic sediments, and dust worldwide; there is no
    obligate animal host or arthropod vector. Human infant disease follows
    ingestion of these environmental spores and their germination to the
    toxin-producing vegetative form in the gut.
  notes: >-
    The reservoir is environmental rather than a non-human animal host, so no
    hosts or vectors are listed.
  evidence:
  - reference: PMID:39138824
    reference_title: "Infant Botulism: In Search of Clostridium botulinum Spores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      isolating C. botulinum spores from ground soil, aquatic sediments, and
      commonly available infant foods.
    explanation: The review documents the environmental spore reservoir of the agent.
  life_cycle_stages:
  - name: Environmental spore
    description: Heat-resistant dormant spore that persists in soil, sediment, and dust and is the ingested infectious form.
  - name: Vegetative toxin-producing form
    description: Germinated, multiplying form that colonizes the immature large intestine and produces botulinum neurotoxin in situ.
progression:
- phase: Early constipation and feeding difficulty
  notes: >-
    Constipation is classically the first sign, followed by poor feeding, a
    weak cry, and loss of head control before frank paralysis.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Constipation is often reported as an early symptom among children
    explanation: The guideline identifies constipation as an early manifestation in children.
- phase: Descending weakness and respiratory compromise
  notes: >-
    Cranial-nerve and bulbar weakness progress to a symmetric descending
    flaccid paralysis and hypotonia, and respiratory failure may require
    mechanical ventilation.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulism is a rare, neurotoxin-mediated, life-threatening disease
      characterized by flaccid descending paralysis that begins with cranial
      nerve palsies and might progress to extremity weakness and respiratory
      failure.
    explanation: The guideline describes the descending paralytic course toward respiratory failure.
- phase: Recovery
  duration: Weeks to months
  notes: >-
    Neuromuscular transmission recovers over weeks; treated infants are
    typically discharged within a few weeks and recover age-appropriate
    function.
  evidence:
  - reference: PMID:16452558
    reference_title: Human botulism immune globulin for the treatment of infant botulism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      infants treated with BIG-IV had a reduction in the mean length of the
      hospital stay, the primary efficacy outcome measure, from 5.7 weeks to
      2.6 weeks (P<0.001).
    explanation: The randomized trial quantifies the hospital course of treated infants.
pathophysiology:
- name: Intestinal colonization and in-situ toxin production
  description: >-
    Ingested C. botulinum spores germinate in the immature infant large
    intestine, multiply, and produce botulinum neurotoxin in situ, which is
    then absorbed into the circulation. A less mature intestinal microbiome is
    thought to permit this colonization in the susceptible age window.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  downstream:
  - target: Presynaptic acetylcholine release blockade
    causal_link_type: DIRECT
    description: Toxin produced in the colonized intestine is absorbed and reaches peripheral cholinergic terminals.
    evidence:
    - reference: PMID:24924163
      reference_title: "Molecular epidemiology of infant botulism in California and elsewhere, 1976-2010."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Infant botulism (IB), first identified in California in 1976, results
        from Clostridium botulinum spores that germinate, multiply, and produce

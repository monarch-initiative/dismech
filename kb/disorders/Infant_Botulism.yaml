treatments:
- name: Human-derived botulism immune globulin (BIG-IV / BabyBIG)
  action_category: THERAPEUTIC
  description: >-
    BIG-IV (BabyBIG) is the first-line, form-specific antitoxin for infant
    intestinal botulism caused by toxin type A or B. It is human-derived rather
    than equine, and prompt administration shortens hospital, intensive-care,
    ventilation, and feeding-support duration. It neutralizes circulating toxin
    but cannot reverse paralysis already established within neurons.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin infusion
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human botulism immune globulin (BIG-IV, BabyBIG)
      term:
        id: NCIT:C80825
        label: Human Botulinum Neurotoxin A/B Immune Globulin
  target_mechanisms:
  - target: Presynaptic acetylcholine release blockade
    treatment_effect: INHIBITS
    description: >-
      BIG-IV neutralizes circulating botulinum toxin before it binds peripheral
      cholinergic terminals, preventing further presynaptic blockade; it does
      not act on intestinal colonization and cannot reverse blockade already
      established inside neurons.
    evidence:
    - reference: PMID:16452558
      reference_title: Human botulism immune globulin for the treatment of infant botulism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We created the orphan drug Human Botulism Immune Globulin Intravenous
        (Human) (BIG-IV), which neutralizes botulinum toxin, and evaluated its
        safety and efficacy in treating infant botulism, the intestinal-toxemia
        form of human botulism.
      explanation: The randomized trial defines the human-derived toxin-neutralizing agent.
  evidence:
  - reference: PMID:16452558
    reference_title: Human botulism immune globulin for the treatment of infant botulism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      infants treated with BIG-IV had a reduction in the mean length of the
      hospital stay, the primary efficacy outcome measure, from 5.7 weeks to
      2.6 weeks (P<0.001).
    explanation: Randomized evidence demonstrates efficacy of BIG-IV in infant botulism.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      anti-A, anti-B botulinum antitoxin (BabyBIG), available
      after consultation from the California Department of Public
      Health
    explanation: The guideline names BabyBIG as the indicated treatment for infant botulism.
- name: Airway protection, mechanical ventilation, and intensive supportive care
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  description: >-
    Serial respiratory and feeding monitoring, airway protection, mechanical

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Infant botulism can progress to respiratory failure requiring mechanical
    ventilation and weeks of intensive supportive care; it is the most common
    form of botulism and can occasionally present as sudden death.
  evidence:
  - reference: PMID:16452558
    reference_title: Human botulism immune globulin for the treatment of infant botulism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      infants treated with BIG-IV had a reduction in the mean length of the
      hospital stay, the primary efficacy outcome measure, from 5.7 weeks to
      2.6 weeks (P<0.001).
    explanation: The multi-week hospital course even with treatment indicates a high burden.

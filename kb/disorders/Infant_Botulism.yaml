name: Infant Botulism
creation_date: '2026-11-26T18:23:15Z'
category: Infectious Disease
parents:
- Bacterial Infection
synonyms:
- infantile botulism
- infant intestinal toxemia botulism
disease_term:
  preferred_term: infant botulism
  term:
    id: MONDO:0015804
    label: infant botulism
description: >-
  Infant botulism is a toxicoinfectious neuroparalytic disease of children
  under one year of age. Ingested spores of Clostridium botulinum (and rarely
  the related species C. baratii or C. butyricum) germinate in the immature
  large intestine, multiply, and produce botulinum neurotoxin in situ, so the
  illness is an intestinal colonization rather than an intoxication with
  preformed toxin. Absorbed toxin reaches peripheral cholinergic terminals and
  blocks presynaptic acetylcholine release, producing the characteristic
  sequence of constipation, poor feeding, a weak cry, cranial-nerve palsies,
  and symmetric descending flaccid paralysis in a "floppy" hypotonic infant
  that can progress to respiratory failure. It differs from the preformed-toxin
  forms of botulism in its mechanism (in-situ intestinal toxin production from
  environmental spores, chiefly honey, soil, and dust), its first-line therapy
  (human-derived botulism immune globulin, BIG-IV/BabyBIG, rather than equine
  antitoxin), and its age and tempo.

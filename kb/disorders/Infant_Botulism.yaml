notes: >-
  Infant botulism is the most common form of botulism (reported as about 70% of
  annual cases in PMID:37429225), but the literature on population-level
  incidence is thin and no single-population incidence rate was quoted here, so
  structured prevalence is omitted. Phenotype frequencies are reported
  qualitatively in the cited clinical guideline and case series rather than as
  percentages, so frequency bands are deliberately left off the phenotype rows.
  The sudden-death association (PMID:24924163) is recorded as a documented
  minority presentation, not as an assertion that infant botulism accounts for
  a defined fraction of sudden infant death. Aminoglycosides and other
  neuromuscular-blocking antibiotics are contraindicated because they can
  worsen the paralysis (PMID:33956777). Reference caches were generated only
  with just fetch-reference.
review_notes: >-
  Deliberately lumped. The three toxin-producing species (Clostridium
  botulinum and the rare C. baratii and C. butyricum) are kept in one entry
  because they produce the same intestinal-toxemia syndrome, are confirmed by
  the same stool toxin and culture testing, and are treated identically with
  BIG-IV; the cited guideline and case series describe no species-specific
  presentation, diagnosis, therapy, or prognosis that would justify separate
  strata, so no taxonomic subtype rows are created.

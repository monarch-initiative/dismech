    reference_title: "Molecular epidemiology of infant botulism in California and elsewhere, 1976-2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infant botulism (IB), first identified in California in 1976, results
      from Clostridium botulinum spores that germinate, multiply, and produce
      botulinum neurotoxin (BoNT) in the immature intestine.
    explanation: The source names C. botulinum as the toxicoinfectious agent of infant botulism.
- name: Clostridium baratii
  infectious_agent_term:

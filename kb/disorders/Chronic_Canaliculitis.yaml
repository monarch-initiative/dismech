name: Chronic Canaliculitis
creation_date: "2026-09-25T22:49:34Z"
category: Infectious Disease
description: >-
  Chronic canaliculitis is a localized Actinomyces-associated infection of the
  lacrimal canaliculus in which filamentous bacteria aggregate into
  intracanalicular concretions that sustain chronic canalicular inflammation,
  epiphora, purulent punctal discharge, punctal swelling, and recurrent disease
  until the concretion nidus is expressed or surgically removed.
disease_term:
  preferred_term: chronic canaliculitis
  term:
    id: MONDO:0004924
    label: chronic canaliculitis
parents:
- Bacterial Infection
- eye infectious disorder
- actinomycosis
synonyms:
- Actinomycotic canaliculitis
- Actinomycotic primary canaliculitis
- Lacrimal canaliculitis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:36927124
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ocular actinomycosis is an uncommon progressive infection. The study
        aims to investigate the predisposing factors, clinical characteristics
        and treatment outcomes of culture-proven cases of Actinomycotic primary
        canaliculitis.
      explanation: >-
        The study describes culture-proven Actinomyces canaliculitis as an
        ocular infection, supporting Infectious Diseases placement.
infectious_agent:
- name: Actinomyces
  infectious_agent_term:
    preferred_term: Actinomyces species
    term:
      id: NCBITaxon:1654
      label: Actinomyces
  description: >-
    Filamentous anaerobic Gram-positive bacteria in the Actinomyces genus that
    colonize the lacrimal canalicular lumen and aggregate into concretions;
    canaliculitis can be polymicrobial, but Actinomyces is the defining genus
    for this MONDO actinomycosis subtype.
  evidence:
  - reference: PMID:41702562
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological examination identified Actinomyces species in 11 of 15
      concretions (73%; 95% confidence interval, Wilson method: 48 - 89%),
      supporting their leading role as causative organisms of canaliculitis.
    explanation: >-
      The case series found Actinomyces in most concretions sampled from
      canaliculitis cases and explicitly supports a leading etiologic role.
  - reference: PMID:36927124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 19 cases (86.0%) of identified Actinomyces species, A. odontolyticus
      (43.5%) was the predominant causative microorganism.
    explanation: >-
      The culture-proven Actinomyces primary canaliculitis series identifies
      Actinomyces species from affected canaliculi.
pathophysiology:
- name: Actinomyces Colonization of Lacrimal Canaliculus
  description: >-
    Resident or odontogenic Actinomyces organisms colonize the lacrimal
    canalicular lumen, often in an adult with dry eye and impaired tear
    clearance, and provide the microbial biomass that accumulates in the duct.
  biological_scale: TISSUE
  locations:
  - preferred_term: lacrimal canaliculus
    term:
      id: UBERON:0001770
      label: lacrimal canaliculus
  downstream:
  - target: Canalicular Actinomyces Concretion Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34287258
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lacrimal canaliculitis is a rare infection of the lacrimal canaliculi
        with canalicular concretions formed by aggregation of organisms.
      explanation: >-
        The metagenomic study links organism aggregation within lacrimal
        canaliculi to canalicular concretion formation.
  evidence:
  - reference: PMID:36927124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 201 patients diagnosed with primary canaliculitis, 22 (10.9%) were
      caused by Actinomyces.
    explanation: >-
      The retrospective series establishes that Actinomyces colonization causes
      a subset of primary canaliculitis cases.
- name: Canalicular Actinomyces Concretion Formation
  description: >-
    Actinomyces-rich, frequently polymicrobial canalicular concretions create a
    protected intraluminal bacterial community that acts as a persistent nidus
    for chronic infection and explains recurrence when concretions remain.
  biological_scale: CELLULAR
  locations:
  - preferred_term: lacrimal canaliculus
    term:
      id: UBERON:0001770
      label: lacrimal canaliculus
  downstream:
  - target: Chronic Canalicular Mucosal Inflammation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39488146
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Lacrimal infection is a vicious circle, in which infection leads to
        inflammation and post-inflammatory sequelae, themselves a source of
        occlusion and stagnation, which in turn encourages infection.
      explanation: >-
        The review links lacrimal infection to mucosal inflammation and
        obstructive sequelae that sustain local infection.
  evidence:
  - reference: PMID:34287258
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Canalicular concretions are polymicrobial with anaerobic and facultative,
      aerobic bacteria.
    explanation: >-
      The authors' conclusion supports canalicular concretions as polymicrobial
      bacterial communities.
- name: Chronic Canalicular Mucosal Inflammation
  description: >-
    Persistent infection of the lacrimal canalicular mucosa drives local
    inflammatory swelling, discharge from the punctum, epiphora, canalicular
    dilatation, and eventually stenotic sequelae that further impair drainage.
  biological_scale: TISSUE
  locations:
  - preferred_term: mucosa of lacrimal canaliculus
    term:
      id: UBERON:0005029
      label: mucosa of lacrimal canaliculus
  cell_types:
  - preferred_term: lacrimal drainage epithelial cell
    term:
      id: CL:1000435
      label: epithelial cell of lacrimal drainage system
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
  evidence:
  - reference: PMID:32563241
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary canaliculitis is a chronic infection of the proximal lacrimal
      pathway.
    explanation: >-
      The canaliculoplasty series defines the disease as chronic infection of
      the lacrimal canalicular drainage pathway.
phenotypes:
- name: Epiphora
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Epiphora
    term:
      id: HP:0009926
      label: Epiphora
  evidence:
  - reference: PMID:22836798
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common presenting symptom was epiphora, noted in 63 (85%)
      patients, and the most common clinical sign was thickening of canalicular
      portion of eyelid seen in 53 (72%) patients.
    explanation: >-
      The primary canaliculitis series identifies epiphora as the most common
      symptom and reports it in 85% of patients.
- name: Purulent Punctal Regurgitation
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: purulent punctal discharge
    term:
      id: HP:0034427
      label: Purulent eye discharge
  evidence:
  - reference: PMID:36927124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent symptom was mattering without epiphora (77.3%) and
      clinical signs were punctal regurgitation of purulent discharge (100%) and
      expressible concretions (95.5%).
    explanation: >-
      The Actinomyces-specific series observed purulent punctal regurgitation
      in all patients.
- name: Canalicular Dacroliths
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: canalicular concretions
    term:
      id: HP:6000131
      label: Dacrolith
  evidence:
  - reference: PMID:41702562
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 15 out of 17 canaliculi, concretions were found intraoperatively.
    explanation: >-
      The surgical case series found concretions in most affected lacrimal
      canaliculi.
- name: Actinomyces-Positive Lacrimal Tract Culture
  category: Laboratory
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Actinomyces-positive lacrimal tract culture
    term:
      id: HP:6000792
      label: Positive lacrimal tract actinomyces culture
  evidence:
  - reference: PMID:36927124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Culture-proven cases of Actinomyces-associated primary canaliculitis
      diagnosed and treated between January 2017 and December 2021 at the
      Beijing Tongren Eye Center, Capital Medical University were identified and
      reviewed for ocular and systemic risk factors, clinical presentations,
      microbiological profile, treatment modalities and outcomes.
    explanation: >-
      The cohort was defined by Actinomyces culture positivity from primary
      canaliculitis cases.
- name: Medial Eyelid Edema
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: medial eyelid edema
    term:
      id: HP:0100540
      label: Palpebral edema
  evidence:
  - reference: PMID:36644466
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The highlighting clinical features were medial eyelid edema (n = 40,
      100%), pouting and hyperemia of lacrimal punctum (n = 36, 90%), yellowish
      canalicular hue (n = 35, 87.5%), and canalicular distention and
      expressible discharge (n = 32, 80%).
    explanation: >-
      Medial eyelid edema was present in every eye in this lacrimal
      canaliculitis clinical tetrad series.
treatments:
- name: Canaliculotomy With Curettage
  therapeutic_modality: SURGERY
  description: >-
    Canaliculotomy opens the affected canaliculus and curettage removes the
    Actinomyces-rich concretions that maintain the protected infectious nidus;
    silicone tube intubation during the procedure can reduce postoperative
    obstruction.
  treatment_term:
    preferred_term: canaliculotomy with curettage
    term:
      id: NCIT:C15216
      label: Curettage Procedure
  target_mechanisms:
  - target: Canalicular Actinomyces Concretion Formation
    treatment_effect: INHIBITS
    description: Physically removes the intracanalicular concretion reservoir.
    evidence:
    - reference: PMID:40067167
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of 302 cases (89.35%) with canaliculitis, 297 (98.34%) were cured with
        canaliculotomy; 5 cases (1.66%) recurred within 1 year after surgery and
        were cured with canaliculotomy again.
      explanation: >-
        A large dacryolithiasis case series reported high canaliculotomy cure
        rates for canaliculitis.
  evidence:
  - reference: PMID:41702562
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical canaliculotomies allow complete removal of bacterial concretions
      which are found in the canaliculi for the most part.
    explanation: >-
      The abstract conclusion explains the mechanism and role of
      canaliculotomy in removing canalicular bacterial concretions.
  - reference: PMID:34275398
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Canaliculotomy with curettage gives excellent clinical outcomes in the
      treatment of patients with primary canaliculitis and a higher success rate
      can be achieved when silicone tube intubation is performed during the
      procedure.
    explanation: >-
      This randomized interventional case series supports canaliculotomy with
      curettage and silicone tube intubation as an effective surgical approach.
  notes: >-
    NCIT has no canaliculotomy-specific surgical term; `runoak -i ols:ncit
    search canaliculotomy` returned no matches on 2026-09-25, so the broader
    Curettage Procedure term is used with a canaliculotomy-specific
    preferred_term.
- name: Incision-Sparing Expression and Antibiotic Irrigation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Selected cases can be treated without a canaliculotomy by punctal dilation,
    manual expression or microcurettage of concretions, and irrigation with
    topical antibiotics chosen for the cultured organism.
  treatment_term:
    preferred_term: canalicular antibiotic irrigation
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Actinomyces Colonization of Lacrimal Canaliculus
    treatment_effect: INHIBITS
    description: >-
      Delivers topical antibiotics into the canaliculus after expression of
      infected material.
  evidence:
  - reference: PMID:28576205
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this study was to describe the outcomes of conservative
      (punctal dilation, manual expression, microcurettage, and canalicular
      irrigation with antibiotics) and surgical (punctoplasty) modalities for
      the management of canaliculitis in an Asian population.
    explanation: >-
      The case series evaluated the incision-sparing regimen of punctal
      dilation, expression, microcurettage, and antibiotic canalicular
      irrigation.
  - reference: PMID:36927124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conservative therapy combining repeated canalicular expression and
      irrigation with susceptible topical antibiotics achieved complete
      resolution in 86.4% of patients.
    explanation: >-
      The Actinomyces-specific series found high complete-resolution rates with
      repeated expression and susceptible topical antibiotic irrigation.
notes: >-
  MONDO:0004924 is a child of actinomycosis, but its generated synonyms
  broaden the label to "chronic actinomycosis"; this entry deliberately omits
  those synonyms and scopes the disease to lacrimal canalicular actinomycosis.
  The OpenScientist report also reviewed fungal, viral, and plug-related
  canaliculitis; those etiologies were treated as out of scope for this
  bacterial MONDO term.

    reference_title: "Canaliculitis: Too Often Underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 15 out of 17 canaliculi, concretions were found intraoperatively.
    explanation: >-
      The surgical case series found concretions in most affected lacrimal

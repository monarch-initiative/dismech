name: Chronic Canaliculitis
creation_date: "2026-09-25T22:49:34Z"
category: Infectious Disease
description: >-
  Chronic canaliculitis is a localized Actinomyces-associated infection of the
  lacrimal canaliculus in which filamentous bacteria aggregate into
  intracanalicular concretions that sustain chronic canalicular inflammation,
  epiphora, purulent punctal discharge, punctal swelling, and recurrent disease
  until the concretion nidus is expressed or surgically removed.
disease_term:
  preferred_term: chronic canaliculitis
  term:
    id: MONDO:0004924
    label: chronic canaliculitis
parents:
- Bacterial Infection
- eye infectious disorder
- actinomycosis
synonyms:
- Actinomycotic canaliculitis
- Actinomycotic primary canaliculitis
- Lacrimal canaliculitis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:36927124
      reference_title: "Actinomycotic primary canaliculitis: Predisposing factors, clinical characteristics, and treatment outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ocular actinomycosis is an uncommon progressive infection. The study
        aims to investigate the predisposing factors, clinical characteristics
        and treatment outcomes of culture-proven cases of Actinomycotic primary
        canaliculitis.
      explanation: >-
        The study describes culture-proven Actinomyces canaliculitis as an
        ocular infection, supporting Infectious Diseases placement.
infectious_agent:
- name: Actinomyces
  infectious_agent_term:
    preferred_term: Actinomyces species
    term:
      id: NCBITaxon:1654
      label: Actinomyces
  description: >-
    Filamentous anaerobic Gram-positive bacteria in the Actinomyces genus that
    colonize the lacrimal canalicular lumen and aggregate into concretions;
    canaliculitis can be polymicrobial, but Actinomyces is the defining genus
    for this MONDO actinomycosis subtype.
  evidence:
  - reference: PMID:41702562
    reference_title: "Canaliculitis: Too Often Underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological examination identified Actinomyces species in 11 of 15
      concretions (73%; 95% confidence interval, Wilson method: 48 - 89%),
      supporting their leading role as causative organisms of canaliculitis.
    explanation: >-
      The case series found Actinomyces in most concretions sampled from
      canaliculitis cases and explicitly supports a leading etiologic role.
  - reference: PMID:36927124
    reference_title: "Actinomycotic primary canaliculitis: Predisposing factors, clinical characteristics, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 19 cases (86.0%) of identified Actinomyces species, A. odontolyticus
      (43.5%) was the predominant causative microorganism.
    explanation: >-
      The culture-proven Actinomyces primary canaliculitis series identifies
      Actinomyces species from affected canaliculi.
transmission:
- name: Endogenous colonisation of the lacrimal canaliculus by its resident flora
  description: >-
    Chronic canaliculitis is not acquired from an external source. The lacrimal
    drainage system carries its own resident flora, and infection follows when
    local mucosal defence is overwhelmed rather than when a pathogen arrives:
    the organisms colonise the canalicular lumen and aggregate into concretions,
    and the resulting obstruction and tear stagnation sustain the infection
    rather than clearing it.
  notes: >-
    The sources cited here establish that the lacrimal ducts carry resident
    flora and that the concretions are polymicrobial, which is what supports
    calling the route endogenous. They do not state which body site the
    organisms come from, so no ocular-surface or oral origin is asserted.
    PMID:34287258 does report that the concretion microbiome resembles that of
    oral endodontic disease in structure, but a resemblance in composition is
    not evidence of an oral origin and is not cited as a route here.
  evidence:
  - reference: PMID:39488146
    reference_title: "[Lacrimal duct infections]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In addition to being a drainage system, the lacrimal ducts actively defend the eye through the action of the lacrimal pump, the presence of resident flora (lacriome) and the mucosa-associated immune tissue."
    explanation: >-
      States that the lacrimal ducts carry a resident flora of their own, which
      is the population the infecting organisms are drawn from.
  - reference: PMID:39488146
    reference_title: "[Lacrimal duct infections]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infection occurs when mucosal immune functions are overwhelmed."
    explanation: >-
      Locates the initiating event in failure of local defence against flora
      already present, not in acquisition of an organism from outside.
  - reference: PMID:39488146
    reference_title: "[Lacrimal duct infections]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lacrimal infection is a vicious circle, in which infection leads to inflammation and post-inflammatory sequelae, themselves a source of occlusion and stagnation, which in turn encourages infection."
    explanation: >-
      Describes the self-sustaining occlusion-and-stagnation loop that keeps the
      infection going once established.
  - reference: PMID:34287258
    reference_title: "Metagenomic Shotgun Sequencing Analysis of Canalicular Concretions in Lacrimal Canaliculitis Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Canalicular concretions are polymicrobial with anaerobic and facultative, aerobic bacteria."
    explanation: >-
      Shotgun metagenomics of concretions taken from patients shows a mixed
      flora rather than a single acquired pathogen.
- name: Secondary colonisation around a punctal plug or canalicular implant
  description: >-
    Where a punctal plug or canalicular implant has been placed, the device
    itself becomes the focus the same flora colonise, which is what
    distinguishes secondary from primary canaliculitis.
  evidence:
  - reference: PMID:36644466
    reference_title: "A \"Clinical Tetrad\" for Easy Diagnosis of Lacrimal Canaliculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Based on the etiology, LC is divided into primary and secondary varieties, the latter occurring due to inflammation caused by the material of punctum plugs or canalicular implants."
    explanation: >-
      States the device-associated secondary route as the recognised alternative
      to primary canaliculitis.
  - reference: PMID:28576205
    reference_title: "Incision-sparing management of canaliculitis: an efficacious alternative to surgical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten (83.3%) eyes had primary canaliculitis, and 2 (16.7%) eyes had secondary canaliculitis from punctal plug insertion."
    explanation: >-
      A clinical series attributing two of twelve affected eyes to punctal plug
      insertion, quantifying the device-associated route.
pathophysiology:
- name: Actinomyces Colonization of Lacrimal Canaliculus
  description: >-
    Resident or odontogenic Actinomyces organisms colonize the lacrimal
    canalicular lumen, often in an adult with dry eye and impaired tear
    clearance, and provide the microbial biomass that accumulates in the duct.
  biological_scale: TISSUE
  locations:
  - preferred_term: lacrimal canaliculus
    term:
      id: UBERON:0001770
      label: lacrimal canaliculus
  downstream:
  - target: Canalicular Actinomyces Concretion Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34287258
      reference_title: >-
        Metagenomic Shotgun Sequencing Analysis of Canalicular Concretions in
        Lacrimal Canaliculitis Cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lacrimal canaliculitis is a rare infection of the lacrimal canaliculi
        with canalicular concretions formed by aggregation of organisms.
      explanation: >-
        The metagenomic study links organism aggregation within lacrimal
        canaliculi to canalicular concretion formation.
  - target: Actinomyces-Positive Lacrimal Tract Culture
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Diagnostic cultures can recover Actinomyces from Actinomyces-associated
      primary canaliculitis.
  evidence:
  - reference: PMID:36927124
    reference_title: "Actinomycotic primary canaliculitis: Predisposing factors, clinical characteristics, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 201 patients diagnosed with primary canaliculitis, 22 (10.9%) were
      caused by Actinomyces.
    explanation: >-
      The retrospective series establishes that Actinomyces colonization causes
      a subset of primary canaliculitis cases.
- name: Canalicular Actinomyces Concretion Formation
  description: >-
    Actinomyces-rich, frequently polymicrobial canalicular concretions create a
    protected intraluminal bacterial community that acts as a persistent nidus
    for chronic infection and explains recurrence when concretions remain.
  biological_scale: CELLULAR
  locations:
  - preferred_term: lacrimal canaliculus
    term:
      id: UBERON:0001770
      label: lacrimal canaliculus
  downstream:
  - target: Chronic Canalicular Mucosal Inflammation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39488146
      reference_title: "[Lacrimal duct infections]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Lacrimal infection is a vicious circle, in which infection leads to
        inflammation and post-inflammatory sequelae, themselves a source of
        occlusion and stagnation, which in turn encourages infection.
      explanation: >-
        The review links lacrimal infection to mucosal inflammation and
        obstructive sequelae that sustain local infection.
  - target: Canalicular Dacroliths
    causal_link_type: DIRECT
    description: >-
      The microbial aggregates formed in the canalicular lumen are the
      canalicular dacroliths found during canaliculitis surgery.
  evidence:
  - reference: PMID:34287258
    reference_title: >-
      Metagenomic Shotgun Sequencing Analysis of Canalicular Concretions in
      Lacrimal Canaliculitis Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Canalicular concretions are polymicrobial with anaerobic and facultative,
      aerobic bacteria.
    explanation: >-
      The authors' conclusion supports canalicular concretions as polymicrobial
      bacterial communities.
- name: Chronic Canalicular Mucosal Inflammation
  description: >-
    Persistent infection of the lacrimal canalicular mucosa drives local
    inflammatory swelling, discharge from the punctum, epiphora, canalicular
    dilatation, and eventually stenotic sequelae that further impair drainage.
  biological_scale: TISSUE
  locations:
  - preferred_term: mucosa of lacrimal canaliculus
    term:
      id: UBERON:0005029
      label: mucosa of lacrimal canaliculus
  cell_types:
  - preferred_term: lacrimal drainage epithelial cell
    term:
      id: CL:1000435
      label: epithelial cell of lacrimal drainage system
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
  downstream:
  - target: Post-Inflammatory Canalicular Dilatation and Stasis
    causal_link_type: DIRECT
    description: >-
      Chronic infected mucosa and retained concretions enlarge the canalicular
      lumen and produce stagnant, obstructed lacrimal flow.
    evidence:
    - reference: PMID:32563241
      reference_title: >-
        Surgical procedure of canaliculoplasty in the treatment of primary
        canaliculitis associated with canalicular dilatation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Canalicular dilatation may be a consequence of a long-term stasis of
        concretions during the course of canaliculitis.
      explanation: >-
        This series places canalicular dilatation downstream of longstanding
        concretion stasis in severe canaliculitis.
  - target: Epiphora
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Canalicular inflammation and obstructive sequelae impair lacrimal drainage
      and contribute to tearing in canaliculitis.
  - target: Purulent Punctal Regurgitation
    causal_link_type: DIRECT
    description: >-
      Inflamed infected canaliculi can express purulent material through the
      lacrimal punctum.
  - target: Medial Eyelid Edema
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Canalicular infection and mucosal inflammation produce medial eyelid
      swelling around the affected canaliculus.
  - target: Pouting and Hyperemic Lacrimal Punctum
    causal_link_type: DIRECT
    description: >-
      Inflammation and edema of the vertical canalicular epithelium protrude the
      lacrimal punctum and make the punctal surface hyperemic.
    evidence:
    - reference: PMID:36644466
      reference_title: "A \"Clinical Tetrad\" for Easy Diagnosis of Lacrimal Canaliculitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pouting and hyperemia of the lacrimal punctum occur secondary to the
        inflammation of the canalicular epithelium.
      explanation: >-
        The lacrimal-canaliculitis tetrad series explicitly links punctal
        pouting and hyperemia to inflamed canalicular epithelium.
  evidence:
  - reference: PMID:32563241
    reference_title: >-
      Surgical procedure of canaliculoplasty in the treatment of primary
      canaliculitis associated with canalicular dilatation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary canaliculitis is a chronic infection of the proximal lacrimal
      pathway.
    explanation: >-
      The canaliculoplasty series defines the disease as chronic infection of
      the lacrimal canalicular drainage pathway.
- name: Post-Inflammatory Canalicular Dilatation and Stasis
  description: >-
    Long-standing canalicular inflammation and retained concretions dilate the
    canalicular lumen and create occlusion, lacrimal stagnation, and
    self-perpetuating infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: lacrimal canaliculus
    term:
      id: UBERON:0001770
      label: lacrimal canaliculus
  downstream:
  - target: Actinomyces Colonization of Lacrimal Canaliculus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Occlusion and stagnant lacrimal flow retain organisms and infected
      concretions, feeding the infection-inflammation-stasis loop.
    evidence:
    - reference: PMID:39488146
      reference_title: "[Lacrimal duct infections]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Lacrimal infection is a vicious circle, in which infection leads to
        inflammation and post-inflammatory sequelae, themselves a source of
        occlusion and stagnation, which in turn encourages infection.
      explanation: >-
        The review describes a feedback loop in which post-inflammatory
        lacrimal occlusion and stagnation promote further infection.
  evidence:
  - reference: PMID:32563241
    reference_title: >-
      Surgical procedure of canaliculoplasty in the treatment of primary
      canaliculitis associated with canalicular dilatation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The accumulated concretions, together with the mucopurulent discharge, are
      responsible for a self-perpetuating cycle of canalicular stasis and
      infection for years
    explanation: >-
      The canaliculoplasty report links retained concretions and mucopurulent
      material to prolonged canalicular stasis and infection.
phenotypes:
- name: Epiphora
  category: Ophthalmologic
  description: >-
    Tearing is common in mixed-etiology primary canaliculitis; the
    Actinomyces-specific cohort did not establish a similarly high
    Actinomyces-specific epiphora rate.
  phenotype_term:
    preferred_term: Epiphora
    term:
      id: HP:0009926
      label: Epiphora
  evidence:
  - reference: PMID:22836798
    reference_title: "Primary canaliculitis: clinical features, microbiological profile, and management outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common presenting symptom was epiphora, noted in 63 (85%)
      patients, and the most common clinical sign was thickening of canalicular
      portion of eyelid seen in 53 (72%) patients.
    explanation: >-
      The primary canaliculitis series identifies epiphora as common in
      canaliculitis overall, but not specifically in Actinomyces-associated
      canaliculitis.
- name: Purulent Punctal Regurgitation
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: purulent punctal discharge
    term:
      id: HP:0034427
      label: Purulent eye discharge
  evidence:
  - reference: PMID:36927124
    reference_title: "Actinomycotic primary canaliculitis: Predisposing factors, clinical characteristics, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent symptom was mattering without epiphora (77.3%) and
      clinical signs were punctal regurgitation of purulent discharge (100%) and
      expressible concretions (95.5%).
    explanation: >-
      The Actinomyces-specific series observed purulent punctal regurgitation
      in all patients.

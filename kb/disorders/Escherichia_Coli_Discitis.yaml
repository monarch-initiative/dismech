name: Escherichia coli Discitis
creation_date: "2026-11-26T02:20:18Z"
description: >-
  Escherichia coli discitis is a pyogenic Gram-negative infection of the
  intervertebral disc and adjacent vertebral endplates (spondylodiscitis) in
  which E. coli, usually from a urinary tract or other genitourinary or
  intra-abdominal source and often after urologic instrumentation, reaches the
  discovertebral unit through the bloodstream. It affects predominantly older
  adults and patients with malignancy, presents with back pain and often with
  constitutional or bacteremic features, can extend into the paravertebral,
  psoas and epidural spaces, and is increasingly caused by
  extended-spectrum beta-lactamase-producing strains that constrain
  antibiotic choice.
category: Infectious Disease
disease_term:
  preferred_term: escherichia coli discitis
  term:
    id: MONDO:8000002
    label: escherichia coli discitis
parents:
- Infectious discitis
- Bacterial arthritis
- Escherichia coli infection
synonyms:
- escherichia coli discitis
- E. coli spondylodiscitis
- Escherichia coli spondylodiscitis
- Escherichia coli vertebral osteomyelitis
infectious_agent:
- name: Escherichia coli
  description: >-
    Escherichia coli, typically an extraintestinal pathogenic strain of the
    patient's own gut or urinary flora, is the most frequent Gram-negative
    organism recovered from pyogenic spondylodiscitis. Extended-spectrum
    beta-lactamase-producing and fluoroquinolone-resistant isolates are
    reported.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:23543389
    reference_title: "The management gram-negative bacterial haematogenous vertebral osteomyelitis: a case series of diagnosis, treatment and therapeutic outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These organisms included Escherichia coli (4), Pseudomonas aeruginosa (3),
      Klebsiella pneumonia (1), Haemophilus influenza (1) and Enterobacter
      cloacae (1).
    explanation: >-
      In a Gram-negative haematogenous vertebral osteomyelitis series, E. coli
      was the most frequent Gram-negative isolate.
  - reference: PMID:25978839
    reference_title: Clinical characteristics and risk factors of pyogenic spondylitis caused by gram-negative bacteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were 62 patients (18.0%) with pyogenic spondylitis caused by GNB and
      the most common organism was Escherichia coli (n = 35, 10.2%), followed by
      Pseudomonas aeruginosa (n = 10, 2.9%).
    explanation: >-
      In 344 culture-confirmed pyogenic spondylitis cases, E. coli caused about
      one in ten and was the leading Gram-negative organism.
  - reference: PMID:28569143
    reference_title: Spondylodiscitis in a healthy 12-year-old girl with Extraintestinal pathogenic Escherichia coli (ExPEC) bacteraemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The strain harboured serogroup O1:K1 and virulence factors common to
      highly virulent extra intestinal pathogenic E. coli (ExPEC).
    explanation: >-
      Characterizes the causal isolate of a pediatric E. coli spondylodiscitis
      as an extraintestinal pathogenic strain.

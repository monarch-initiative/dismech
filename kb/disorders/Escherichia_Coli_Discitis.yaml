- name: E. coli DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_dna_topoisomerase_inhibition#DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)"
  biological_scale: MOLECULAR
  description: >-
    Ciprofloxacin and other fluoroquinolones, which reach bone well orally,
    kill susceptible E. coli by trapping the gyrase and topoisomerase IV
    cleavage complex; fluoroquinolone-resistant isolates are reported after
    prostate biopsy despite ciprofloxacin prophylaxis.
  biological_processes:
  - preferred_term: DNA topological change
    term:
      id: GO:0006265
      label: DNA topological change
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Quinolones dually target DNA gyrase and topoisomerase IV binding to
      specific domains and conformations so as to block DNA strand passage
      catalysis and stabilize DNA-enzyme complexes that block the DNA
      replication apparatus and generate double breaks in DNA that underlie
      their bactericidal activity.
    explanation: >-
      Establishes the dual fluoroquinolone target and its bactericidal
      mechanism.
  - reference: PMID:26264110
    reference_title: Epidural abscess with associated spondylodiscitis following prostatic biopsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      To our knowledge, this is the first case of spondylodiscitis secondary to
      fluoroquinolone resistant Escherichia coli.
    explanation: >-
      Documents fluoroquinolone resistance in an E. coli spondylodiscitis
      isolate, which limits this target in some patients.
- name: ESBL-Mediated Beta-Lactam Resistance
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Acquired Resistance and Drug Inactivation"
  biological_scale: MOLECULAR
  description: >-
    Extended-spectrum beta-lactamase-producing E. coli hydrolyse third-generation
    cephalosporins, so infections caused by these strains need a carbapenem.
    Such strains have been reported after urologic instrumentation and in
    patients without known risk factors.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:

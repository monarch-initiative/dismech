review_notes: >-
  Deliberately lumped. Antimicrobial-susceptible, fluoroquinolone-resistant and
  ESBL-producing E. coli strains, and extraintestinal pathogenic serogroups such
  as O1:K1, are kept in one entry because the PubMed literature on E. coli
  spondylodiscitis (searched as escherichia coli with spondylodiscitis,
  discitis or vertebral osteomyelitis) consists of case reports and small
  series that describe the same hematogenous genitourinary-source disease, and
  resistance changes the antibiotic choice rather than presentation, tempo,
  diagnosis or prognosis; resistance is carried as a therapeutic-vulnerability
  node instead.

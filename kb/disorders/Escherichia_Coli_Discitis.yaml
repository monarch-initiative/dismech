      CT-guided biopsy of the vertebral lesion grew E. coli with the same
      susceptibility profile as the preoperative urine isolate
    explanation: >-
      Links the vertebral isolate to the patient's preceding urinary isolate.
  - reference: PMID:27923346
    reference_title: "Comparison of gram-negative and gram-positive hematogenous pyogenic spondylodiscitis: clinical characteristics and outcomes of treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Compared with 37 GPC-HPS patients, the 17 GNB-HPS patients were more often
      found to be older individuals, a history of cancer, and a previous history
      of symptomatic urinary tract infection.
    explanation: >-
      A comparative cohort associates Gram-negative spondylodiscitis with prior
      symptomatic urinary tract infection.
    directness: INDIRECT
  - reference: PMID:25978839
    reference_title: Clinical characteristics and risk factors of pyogenic spondylitis caused by gram-negative bacteria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pyogenic spondylitis caused by GNB was more frequently associated with the
      female gender (64.5 vs. 35.5%, P <0.01), preexisting or synchronous
      genitourinary tract infection (32.3 vs. 2.1%, P< 0.01), and intra-abdominal
      infection (12.9 vs. 0.4%, P< 0.01) compared to patients with GPC.
    explanation: >-
      In a multicentre cohort in which E. coli was the leading Gram-negative
      organism, Gram-negative spondylitis was associated with genitourinary and
      intra-abdominal source infections.
    directness: INDIRECT
- name: E. coli Bacteremia
  biological_scale: ORGANISM

prevalence:
- population: Germany, adult inpatients, 2020 (all-cause spondylodiscitis)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 14.4
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Nationwide German hospital-coding study. The figure is the incidence of
    all-cause spondylodiscitis, not E. coli discitis; E. coli and other
    Enterobacterales were coded as concomitant pathogens in 22.4% of 2020
    cases with a coded pathogen, without confirmation that the coded pathogen
    was causative.
  evidence:
  - reference: PMID:37240479
    reference_title: "The Epidemiology of Spondylodiscitis in Germany: A Descriptive Report of Incidence Rates, Pathogens, In-Hospital Mortality, and Hospital Stays between 2010 and 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The incidence rate of spondylodiscitis increased to 14.4/100,000
      inhabitants, with 59.6% cases occurring in patients 70 years or older and
      affecting mainly the lumbar spine (56.2%).
    explanation: >-
      Reports the national annual incidence of spondylodiscitis, the clinical
      syndrome of which E. coli discitis is a pathogen-defined subset.
  - reference: PMID:37240479
    reference_title: "The Epidemiology of Spondylodiscitis in Germany: A Descriptive Report of Incidence Rates, Pathogens, In-Hospital Mortality, and Hospital Stays between 2010 and 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Staphylococci and Escherichia coli were the most coded pathogens.
    explanation: >-
      Places E. coli among the two most frequently coded pathogens in national
      spondylodiscitis data.
transmission:
- name: Hematogenous seeding from a genitourinary or intra-abdominal source
  description: >-
    E. coli reaches the discovertebral unit through the bloodstream, most often
    from a urinary tract infection or after a procedure that breaches the
    urogenital mucosa (lithotripsy, transrectal prostate biopsy, percutaneous
    nephrostomy); spread through the paravertebral (Batson) and pelvic venous
    plexuses has been proposed. The infection is endogenous and not
    transmitted between people.
  evidence:
  - reference: PMID:40568282
    reference_title: "Complicated Pyelonephritis Leading to Vertebral Osteomyelitis: Diagnostic and Therapeutic Considerations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This case illustrates the significant progression of pyelonephritis to
      vertebral osteomyelitis secondary to Escherichia coli bacteraemia,
      highlighting the potential for hematogenous dissemination from urinary
      tract infections to the spine.
    explanation: >-
      Documents progression from E. coli pyelonephritis and bacteremia to
      vertebral infection.
  - reference: PMID:38344536
    reference_title: Persistent Bacteremia Due to Escherichia coli Vertebral Osteomyelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It has been reported that infectious dissemination to the vertebrae may
      occur through Batson's venous plexus, which is a network of paravertebral
      veins, and the pelvic venous plexus.
    explanation: >-
      States the proposed venous route from the pelvis to the vertebrae.
progression:
- phase: Bacteremic seeding and acute discitis
  notes: >-
    Back pain with fever or constitutional symptoms develops after E. coli
    bacteremia, sometimes within a day of a urologic procedure and sometimes
    months after it.
  evidence:
  - reference: PMID:41769440
    reference_title: "A Rare Infectious Complication Following Transrectal Prostate Biopsy: Spondylodiscitis With Contiguous Psoas Muscle Abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: He developed fever and lower back pain 24 hours after the procedure.
    explanation: >-
      Illustrates acute onset of fever and back pain soon after transrectal
      prostate biopsy.
  - reference: PMID:42249268
    reference_title: "Escherichia coli vertebral osteomyelitis and spondylodiscitis following transurethral lithotripsy: a delayed complication possibly associated with untreated asymptomatic bacteriuria - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We report a case of E. coli vertebral osteomyelitis and spondylodiscitis
      with abscess formation in a 66-year-old man occurring 6 months after
      transurethral lithotripsy (TUL).
    explanation: >-
      Illustrates a delayed presentation months after urologic
      instrumentation.
- phase: Complicated spondylodiscitis with abscess and neurologic deficit
  notes: >-
    Delayed diagnosis allows paravertebral, psoas or epidural abscesses and
    cord or root compression, which can progress to paraparesis or
    quadriparesis.
  evidence:
  - reference: PMID:40110894
    reference_title: "Escherichia coli bacteremia leading to quadriparesis due to delayed diagnosis of multifocal spondylodiscitis: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Initially presenting with progressive neck pain and urinary tract
      infection, his condition worsened over 3 months, resulting in lower limb
      weakness, bladder and bowel dysfunction, and quadriparesis.
    explanation: >-
      Describes progression to quadriparesis over months of undiagnosed E. coli
      spondylodiscitis.
- phase: Relapse after antibiotic therapy
  notes: >-
    Infection can recur after a completed antibiotic course, particularly when
    the organism was not identified or an abscess was present.
  evidence:
  - reference: PMID:42327925
    reference_title: Lumbosacral Discitis and Vertebral Osteomyelitis Caused by ESBL-Producing Escherichia coli in an Immunocompetent Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two weeks after completion of antibiotics, she presented to her primary
      care physician with recurrence of lower back pain, leading to the
      outpatient MRI concerning for disease progression compared to prior
      studies
    explanation: >-
      Documents recurrence after six weeks of empiric therapy in a case later
      shown to be ESBL-producing E. coli discitis.

animal_models:
- name: Adenoviral CA12(E143K) expression in mouse salivary gland
  species: Mouse
  genotype: >-
    Wild-type mice transduced with a replication-defective adenovirus carrying
    human CA12 or CA12(E143K) cDNA; no germline Ca12 mutation
  background: C57
  publication: PMID:26486891
  description: >-
    An acute physiological preparation rather than a germline disease model: a
    first-generation E1-deleted serotype 5 adenovirus carrying human wild-type
    CA12 or CA12(E143K) cDNA was delivered by ductal cannulation to 8-week-old
    C57 mice, after which pilocarpine-stimulated salivation and fluid secretion
    by isolated ducts were measured.
  modeled_mechanisms:
  - target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces the secretory-gland arm of CA XII deficiency - the disease
      allele inhibits ductal fluid secretion and salivation - in the salivary
      gland rather than in the sweat gland where the human disorder presents.
    limitations: >-
      The animals are wild-type mice transduced in adulthood with a human
      CA12(E143K) cDNA, so the experiment reports what the allele does to an
      otherwise normal gland rather than what lifelong biallelic loss of CA12
      does to a developing one. No sweat chloride or sweat electrolyte
      measurement is reported, and the mouse does not carry a human-like
      distribution of eccrine sweat glands.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The eccrine sweat duct, which is where the disorder is expressed in
        patients, lies outside the model: only salivary and pancreatic ducts
        were studied.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The in vivo measurement is pilocarpine-stimulated salivary flow, which
        stands in for the node's quantity of ductal bicarbonate supply to AE2;
        bicarbonate itself was assayed in isolated ducts, not in the whole
        animal.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse salivary gland secretion is the measured system, and mouse sweat
        gland anatomy differs from the human eccrine gland, so the quantitative
        size of the secretory deficit does not transfer to patients.
    readouts:
    - name: Pilocarpine-stimulated salivation rate
      target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
      direction: DECREASED
      interpretation: >-
        Expressing the disease allele lowers stimulated salivary flow, the
        functional correlate of reduced ductal fluid secretion, while
        wild-type CA12 raises it.
      evidence:
      - reference: PMID:26486891
        reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of CA12 increased the initial rate of pilocarpine-stimulated salivation in mice, while expression of CA12(E143K) markedly inhibited salivation."
        explanation: >-
          Reports the direction of the salivation measurement in both arms of
          the experiment.
    - name: Salivary Na+ and Cl- concentration
      target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
      direction: INCREASED
      interpretation: >-
        Expressing the disease allele raised salivary sodium and chloride, the
        closest the salivary model comes to the patients' high-salt sweat.
      evidence:
      - reference: PMID:26486891
        reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "expression of CA12(E143K) increased both Na+ and Cl- concentration in the saliva, reproducing the findings with patients' sweat."
        explanation: >-
          The disease allele raised salivary Na+ and Cl-, which the authors note
          reproduces the patients' sweat electrolyte abnormality.
    evidence:
    - reference: PMID:26486891
      reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Delivery of CA12 to salivary glands increases salivation in mice and of the human mutation CA12(E143K) markedly inhibits it."
      explanation: >-
        Supports treating this preparation as informative for the secretory-duct
        node.
  evidence:
  - reference: PMID:26486891
    reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The AdCA12 and AdCA12(E143K) vectors used in this study are a first generation, E1-deleted, replication-defective, serotype 5 recombinant adenoviral vector with a human CA12 or CA12(E143K) cDNA."
    explanation: >-
      Documents the construct behind this model record: an adenovirally
      delivered human cDNA rather than a germline mouse mutation.

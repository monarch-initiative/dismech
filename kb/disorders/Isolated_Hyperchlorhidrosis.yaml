    explanation: >-
      Dates the symptomatic presentation to infancy in the natural-history
      series.
- phase: Childhood and adolescence on salt supplementation
  notes: >-
    On dietary salt the acute dehydration episodes stop and growth normalizes,
    leaving heat intolerance, visible salt precipitates and hyperhidrosis as the
    persisting complaints. The salt-wasting risk does not disappear with age:
    exertional rhabdomyolysis has been reported in adolescents exercising in a
    hot climate, which is why follow-up continues beyond early childhood.
  evidence:
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

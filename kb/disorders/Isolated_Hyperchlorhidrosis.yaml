- phase: Infantile symptomatic presentation
  age_range: First year of life
  notes: >-
    Symptomatic patients present in infancy with hyponatremic dehydration,
    failure to thrive and poor feeding, often precipitated by a mild
    intercurrent gastroenteritis, and most are hospitalized before their first
    birthday.
  evidence:
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

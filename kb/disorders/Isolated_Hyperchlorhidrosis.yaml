  evidence:
  - reference: PMID:21035102
    reference_title: "Hyperchlorhidrosis caused by homozygous mutation in CA12, encoding carbonic anhydrase XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate that the phenotype is due to a homozygous mutation in CA12, encoding carbonic anhydrase XII."
    explanation: >-
      The founding report mapping the disorder to a homozygous CA12 mutation.
  variants:
  - name: p.Glu143Lys (c.427G>A)
    description: >-
      The founder missense allele in the consanguineous Israeli Bedouin kindred,
      homozygous in affected individuals. Glu143 lies in the active site and is
      essential for zinc coordination; the mutant enzyme retains partial activity
      but, unlike the wild-type, is inhibited by physiologic concentrations of
      chloride, and the protein is abnormally glycosylated and retained in the
      endoplasmic reticulum.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21035102
      reference_title: "Hyperchlorhidrosis caused by homozygous mutation in CA12, encoding carbonic anhydrase XII."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "protein showed 71% activity of the wild-type enzyme for catalyzing the CO₂ hydration to bicarbonate and H(+), and it bound the clinically used sulfonamide inhibitor acetazolamide with high affinity (K(I) of 10 nM)."
      explanation: >-
        Reports the residual catalytic activity (71% of wild-type) of the
        recombinant c.427G>A (p.Glu143Lys) mutant enzyme; the sentence names
        the allele as "The mutant (c.427G>A [p.Glu143Lys])", which is omitted
        from the quote because of the bracketed span.
    - reference: PMID:21035102
      reference_title: "Hyperchlorhidrosis caused by homozygous mutation in CA12, encoding carbonic anhydrase XII."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Unlike the wild-type enzyme, which is not inhibited by chloride, bromide, or iodide (K(I)s of 73-215 mM), the mutant is inhibited in the submicromolar range by these anions (K(I)s of 0.37-0.73 mM)."
      explanation: >-
        Shows the key functional defect: the mutant enzyme is inhibited by
        chloride at physiologic concentrations, creating chloride-mediated
        negative feedback that the wild-type enzyme lacks.
  - name: p.His121Gln
    description: >-
      Homozygous missense variant in a consanguineous Omani family with elevated
      sweat chloride, infantile failure to thrive and recurrent hyponatremia;
      enzyme activity is severely diminished at physiologic extracellular
      chloride.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26911677
      reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In an unrelated consanguineous Omani family, two children with elevated sweat chloride, infantile FTT, and recurrent hyponatremia were homozygous for a novel missense variant (p.His121Gln)."
      explanation: >-
        Reports the homozygous p.His121Gln allele in affected children.
    - reference: PMID:26911677
      reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CA XII protein bearing either p.His121Gln or a previously identified p.Glu143Lys missense variant localized to the basolateral membranes of polarized Madin-Darby canine kidney (MDCK) cells, but enzyme activity was severely diminished when assayed at physiologic concentrations of extracellular chloride."
      explanation: >-
        Shows the allele reaches the basolateral membrane but loses activity at
        physiologic chloride, which is the functional defect it shares with
        p.Glu143Lys.
  - name: c.908-1G>A / c.859_860insACCT (compound heterozygous)
    description: >-
      Compound heterozygous CA12 alleles - a splice-acceptor variant and a
      frameshift insertion - in an American adult who had been diagnosed with
      cystic fibrosis on the basis of elevated sweat chloride. Respiratory
      epithelial RNA from this proband carried only aberrant CA12 transcripts
      with greatly reduced CA XII protein, while CFTR-mediated chloride
      transport was intact. The report describes them as deleterious without
      assigning an ACMG class, so none is recorded here.
    evidence:
    - reference: PMID:26911677
      reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified deleterious variants in each CA12 gene: c.908-1 G>A in a splice acceptor and a novel frameshift insertion c.859_860insACCT."
      explanation: >-
        Identifies the two alleles carried by the adult proband.
    - reference: PMID:26911677
      reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Respiratory epithelial cell RNA from the adult proband revealed only aberrant CA12 transcripts and in vitro analysis showed greatly reduced CA XII protein."
      explanation: >-
        Shows the alleles leave no normal CA12 transcript and little CA XII
        protein, establishing loss of function.
  - name: p.Thr255Pro (c.763A>C)
    description: >-
      Novel homozygous missense variant reported in a Chinese infant with
      recurrent hyponatremic hypochloremic dehydration; the first CA12 variant
      reported in China. Classified a variant of uncertain significance under
      ACMG criteria but segregating with the recessive phenotype.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:35359895
      reference_title: "Case Report: Novel CA12 Homozygous Variant Causing Isolated Hyperchloridrosis in a Chinese Child With Hyponatremia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a novel homozygous missense variant c.763A>C (p.Thr255Pro) in the CA12 gene (NM_001218.5)"
      explanation: >-
        Identifies the homozygous c.763A>C (p.Thr255Pro) allele in the affected
        child.
  - name: p.Tyr195Ter / p.Pro212Leu (compound heterozygous)
    description: >-
      Compound heterozygous CA12 variants in a Jordanian infant initially
      diagnosed with pseudohypoaldosteronism: a likely-pathogenic nonsense allele
      c.585C>A (p.Tyr195Ter) and a variant of uncertain significance c.635C>T
      (p.Pro212Leu).
    evidence:
    - reference: PMID:40726654
      reference_title: "A case report on pseudohypoaldosteronism with a pathogenic mutation of CA12 causes autosomal recessive isolated hyperchlorhidrosis disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The genetic workup identified two variants in the CA12 gene: c. 585C>A, p.(Tyr195Ter), classified as likely pathogenic, and c. 635C>T, p.(Pro212Leu), classified as a variant of uncertain significance (VOUS)."
      explanation: >-
        Documents compound heterozygous CA12 variants, extending the disorder
        beyond homozygous founder alleles.
pathophysiology:
- name: CA12 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in CA12 are the initiating lesion. The
    best-characterised allele, the active-site missense p.Glu143Lys, lowers
    protein-zinc affinity and leaves the enzyme catalytically partial but, unlike
    the wild-type, inhibitable by chloride at physiologic concentrations; other
    reported alleles (p.His121Gln, p.Thr255Pro, a nonsense and compound
    heterozygous alleles) similarly reduce CA XII function.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:

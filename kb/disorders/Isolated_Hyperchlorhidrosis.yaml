name: Isolated Hyperchlorhidrosis
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: isolated hyperchlorhidrosis
  term:
    id: MONDO:0007747
    label: isolated hyperchlorhidrosis
synonyms:
- hyperchlorhidrosis, isolated
description: >-
  Isolated hyperchlorhidrosis (HYCHL; OMIM 143860) is a rare autosomal recessive
  disorder caused by biallelic loss-of-function variants in CA12, encoding the
  membrane-anchored carbonic anhydrase XII. Reduced CA XII activity in the
  reabsorptive duct of the eccrine sweat gland impairs bicarbonate-dependent
  chloride reabsorption, so sweat chloride and sodium are abnormally high while
  CFTR function is intact. Affected infants present with salt precipitates after
  sweating, recurrent hyponatremic (and often hypochloremic, hyperkalemic)
  dehydration, poor feeding and failure to thrive, and the disorder is readily
  mistaken for cystic fibrosis or pseudohypoaldosteronism. It is managed with
  dietary salt supplementation; heat and strenuous exercise provoke excessive
  salt loss and, in adolescents, exertional rhabdomyolysis.
parents:
- autosomal recessive disease
references:
- reference: PMID:21035102
  title: "Hyperchlorhidrosis caused by homozygous mutation in CA12, encoding carbonic anhydrase XII."
prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists; the disorder is known from a
    small number of consanguineous kindreds (Israeli Bedouin, Omani) and
    individual case reports (Chinese, Jordanian), with four CA12 variants
    reported as of 2022.
  evidence:
  - reference: PMID:35359895
    reference_title: "Case Report: Novel CA12 Homozygous Variant Causing Isolated Hyperchloridrosis in a Chinese Child With Hyponatremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only four variants of the CA12 gene have been identified to be associated with HYCHL."
    explanation: >-
      Records that only four CA12 variants were associated with the disorder as
      of this 2022 report, consistent with an ultra-rare disease known from
      scattered kindreds.
  - reference: PMID:35359895
    reference_title: "Case Report: Novel CA12 Homozygous Variant Causing Isolated Hyperchloridrosis in a Chinese Child With Hyponatremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with the presented case, 14 cases (9 males and 5 females) and four CA12 mutations were summarized for analysis"
    explanation: >-
      Gives the literature case count behind the CASES_IN_LITERATURE measure: 14
      reported patients in total as of 2022.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  description: >-
    Disease requires two CA12 loss-of-function alleles. Affected individuals are
    homozygous or compound heterozygous; obligate heterozygote parents and
    screened heterozygous relatives are clinically unaffected. Penetrance is
    recorded as incomplete for the clinical disease, not for the biochemical
    defect: screening the Bedouin kindred found 4 of 11 biallelic individuals
    with elevated sweat chloride but normal or near-normal serum sodium and
    chloride and no salt-losing episodes, so the sweat phenotype is the
    penetrant trait and symptomatic salt wasting is not.
  evidence:
  - reference: PMID:21184099
    reference_title: "Autosomal recessive hyponatremia due to isolated salt wasting in sweat associated with a mutation in the active site of Carbonic Anhydrase 12."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel autosomal recessive form of isolated salt wasting in sweat, which leads to severe infantile hyponatremic dehydration."
    explanation: >-
      Establishes the autosomal recessive inheritance of the salt-wasting sweat
      phenotype.
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of the entire kindred identified 4 asymptomatic individuals with elevated sweat chloride. All symptomatic patients had failure to thrive and moderate-severe hyponatremia (106-124 mmol l(-1)); 6 had hypochloremia (79-94 mmol l(-1)). All asymptomatic subjects had normal or near-normal serum sodium and chloride concentrations."
    explanation: >-
      Documents biallelic individuals with the biochemical sweat phenotype but
      no clinical salt wasting, which is the basis for recording incomplete
      penetrance of the clinical disease.

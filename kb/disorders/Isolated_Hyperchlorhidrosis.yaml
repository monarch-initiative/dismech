discussions:
- discussion_id: ca12_airway_involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of CA XII function cause airway disease, or is the bronchiectasis
    in the one reported compound heterozygous adult independent of CA12?
  attaches_to:
  - pathophysiology#CA12 Loss-of-Function Variants
  rationale: >-
    CA XII protein is expressed apically in human bronchiolar epithelium, and
    the single reported compound heterozygous adult was diagnosed with cystic
    fibrosis on the strength of elevated sweat chloride and lung disease, which
    would make airway bicarbonate and surface pH handling a second organ arm of
    the disorder. Against that, long-term follow-up of eleven members of the
    Bedouin kindred carrying p.Glu143Lys found no chronic respiratory
    abnormality. This entry therefore models no airway node and treats the
    pulmonary finding as an unresolved association; resolving it needs airway
    phenotyping of further biallelic CA12 patients across genotypes.
  evidence:
  - reference: PMID:26911677
    reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CA XII protein was localized apically in human bronchiolar epithelia and basolaterally in the reabsorptive duct of human sweat glands."
    explanation: >-
      The expression finding that makes an airway arm biologically plausible.
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence for chronic renal, respiratory, gastrointestinal or fertility abnormalities was found."
    explanation: >-
      Long-term follow-up of the p.Glu143Lys kindred found no chronic
      respiratory disease, arguing against airway involvement as a core feature.
  posed_by: "dismech curation (issue #13989)"
  posed_date: "2026-10-13T00:00:00Z"
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Untreated infants face repeated, potentially life-threatening hyponatremic
    dehydration and failure to thrive, but dietary salt prevents the episodes
    and restores growth, leaving a lifelong requirement for salt supplementation
    and heat and exercise precautions rather than progressive organ damage.
  evidence:
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All symptomatic patients were treated by dietary salt, which prevents episodes of hyponatremic dehydration and promotes growth."
    explanation: >-
      Supports a burden that is serious when untreated but controllable with a
      simple intervention.
environmental:
- name: Heat exposure
  description: >-
    Hot environments drive thermoregulatory sweating, accelerating the loss of
    sodium and chloride that the sweat duct cannot reclaim and precipitating
    episodes of salt and water depletion.
  exposure_term:
    preferred_term: exposure to high temperature environment
    term:
      id: ECTO:1000007
      label: exposure to high temperature environment
  evidence:
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with CA XII mutations should be followed even after early childhood, especially in hot temperatures and intense physical activity."
    explanation: >-
      Names hot temperatures as an exposure that keeps patients at risk beyond early childhood.
  influences_mechanisms:
  - target: Systemic Salt and Water Depletion
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT

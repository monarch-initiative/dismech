  notes: >-
    CA12 encodes carbonic anhydrase XII, a plasma-membrane-anchored carbonic
    anhydrase with an extracellular catalytic site. No external gene-disease
    validity classification (ClinGen) is recorded for the CA12-isolated
    hyperchlorhidrosis pair; the evidence base is the reported kindreds and case

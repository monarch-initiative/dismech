    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glu143 in CA12 is essential for zinc coordination in this metalloenzyme and lowering of the protein-metal affinity reduces its catalytic activity."
    explanation: >-
      Explains how the active-site variant reduces carbonic anhydrase catalytic
      activity.
- name: Reduced Carbonic Anhydrase XII Catalysis in the Sweat Duct
  biological_scale: MOLECULAR
  description: >-
    Carbonic anhydrase XII catalyses the reversible hydration of carbon dioxide
    to bicarbonate and a proton. CA XII is localized basolaterally in the
    reabsorptive duct of the human eccrine sweat gland; its role as the major
    bicarbonate supplier for the ductal Cl--HCO3- exchanger AE2 was demonstrated
    directly in salivary and pancreatic ducts, and is inferred for the sweat
    duct. Reduced CA XII catalysis (through diminished activity, chloride
    inhibition shown directly for the E143K allele, or ER retention of the
    misfolded protein in expression models) lowers local bicarbonate available
    to drive anion exchange.
  biological_processes:
  - preferred_term: ductal bicarbonate supply to the Cl-/HCO3- exchanger AE2
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport
  locations:
  - preferred_term: duct of eccrine sweat gland
    term:
      id: UBERON:0035073
      label: duct of eccrine sweat gland
  downstream:
  - target: Impaired Ductal Chloride Reabsorption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26486891
      reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "CA12 markedly increases the activity and is the major HCO3 (-) supplier of ductal Cl(-) -HCO3 (-) exchanger AE2, but not of NBCe1-B."
      explanation: >-
        Ductal chloride-bicarbonate exchange depends on CA XII-supplied bicarbonate; this was shown in salivary and pancreatic ducts, so its application to the sweat duct is indirect.
  evidence:
  - reference: PMID:26486891
    reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "CA12 markedly increases the activity and is the major HCO3 (-) supplier of ductal Cl(-) -HCO3 (-) exchanger AE2, but not of NBCe1-B."
    explanation: >-
      Establishes CA XII as the bicarbonate source for the ductal AE2 anion
      exchanger; the measurement was made in salivary and pancreatic ducts, so
      its application to the sweat duct is indirect.
  - reference: PMID:26486891
    reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Knockdown of AE2 and of CA12 inhibited pancreatic and salivary gland ductal AE2 activity and fluid secretion."
    explanation: >-
      The AE2-dependence of ductal anion handling was shown in pancreatic and
      salivary ducts; the sweat duct was not assayed, so the coupling there is
      inferred.
  - reference: PMID:26911677
    reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CA XII protein was localized apically in human bronchiolar epithelia and basolaterally in the reabsorptive duct of human sweat glands."
    explanation: >-
      Localizes CA XII to the basolateral membrane of the sweat gland
      reabsorptive duct, the site of the defect.
- name: Impaired Ductal Chloride Reabsorption
  biological_scale: CELLULAR
  description: >-
    The eccrine duct normally reabsorbs sodium and chloride from the primary
    sweat, so sweat emerging at the skin surface is hypotonic. With reduced CA XII
    catalysis ductal AE2 activity is lost, so chloride (and the sodium that
    follows it) is not reclaimed and remains in the duct lumen. The route to that
    loss is not settled: in mouse salivary gland and expression models the
    misfolded CA12(E143K) protein is retained in the endoplasmic reticulum,
    whereas in polarized MDCK cells the same variant reached the basolateral
    membrane with activity lost instead through chloride inhibition. Both were
    studied outside the sweat duct, so the molecular route there is inferred.
  biological_processes:
  - preferred_term: chloride transmembrane transport in the sweat duct
    modifier: DECREASED
    term:
      id: GO:1902476
      label: chloride transmembrane transport
  downstream:
  - target: Elevated Sweat Chloride and Sodium
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21184099
      reference_title: "Autosomal recessive hyponatremia due to isolated salt wasting in sweat associated with a mutation in the active site of Carbonic Anhydrase 12."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate the importance of bicarbonate anion and proton production on salt concentration in sweat and its significance for sodium homeostasis."
      explanation: >-
        Ties loss of ductal bicarbonate-dependent anion handling to the raised salt concentration of sweat.
  evidence:
  - reference: PMID:26486891
    reference_title: "Essential role of carbonic anhydrase XII in secretory gland fluid and HCO3 (-) secretion revealed by disease causing human mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The E143K mutation alters CA12 glycosylation at N28 and N80, resulting in retention of the basolateral CA12 in the ER."
    explanation: >-
      Identifies ER retention of the misfolded mutant as one route to loss of
      AE2-dependent ductal anion handling; shown in mouse salivary gland and
      expression models, not the sweat duct.
  - reference: PMID:26911677
    reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "CA XII protein bearing either p.His121Gln or a previously identified p.Glu143Lys missense variant localized to the basolateral membranes of polarized Madin-Darby canine kidney (MDCK) cells, but enzyme activity was severely diminished when assayed at physiologic concentrations of extracellular chloride."
    explanation: >-
      In MDCK cells the E143K protein reached the basolateral membrane rather
      than being ER-retained, with activity lost through chloride inhibition.
      This conflicts with the ER-retention route above, so ductal anion handling
      is impaired by one mechanism or the other but which operates in the sweat
      duct is unresolved.

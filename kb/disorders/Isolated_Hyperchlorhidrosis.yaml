notes: >-
  CA XII also supplies bicarbonate for salivary and pancreatic ductal secretion,
  which explains the dry-mouth phenotype; no chronic renal, respiratory,
  gastrointestinal or fertility abnormality was found on long-term follow-up of
  the Bedouin kindred, supporting the "isolated" designation. One adult compound heterozygous for a
  CA12 splice and frameshift allele had lung disease with bronchiectasis and had
  been diagnosed as having cystic fibrosis (PMID:26911677); the two homozygous
  Omani children in the same report were described with sweat, growth and sodium
  findings rather than lung disease, and the Bedouin natural-history series found
  no chronic respiratory abnormality. Airway involvement is therefore treated as
  a reported association rather than a core feature, and is recorded as an open
  knowledge gap. No GeneReviews chapter exists for this disorder (checked offline
  against the committed Bookshelf index and confirmed with a live PubMed
  genereviews[book] title search). ClinGen has no gene-disease validity
  assertion for CA12.

  No `datasets:` block is curated. `just discover-datasets
  Isolated_Hyperchlorhidrosis` returns only GENE_ONLY candidates, reached
  through CA12 rather than through the disease, because CA12 is an
  estrogen-regulated breast cancer transcript: stage comparisons in
  HR-positive breast cancer, AHR-ligand and doxorubicin treatment series, and
  a salivary-gland carcinoma ex pleomorphic adenoma microRNA series. No
  candidate matches the disease directly, and none measures sweat-duct or
  salivary-duct electrolyte handling, so none is a dataset for this disease.

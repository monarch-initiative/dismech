diagnosis:
- name: Sweat chloride testing with CA12 sequencing
  description: >-
    The disorder mimics cystic fibrosis (elevated sweat chloride) and
    pseudohypoaldosteronism (hyponatremia, hyperkalemia), so recognition rests on
    an elevated sweat chloride with normal CFTR and the absence of renal salt
    wasting. The molecular diagnosis is usually made by whole-exome sequencing of
    CA12. Distinguishing it from cystic fibrosis and pseudohypoaldosteronism is
    important because management differs.
  evidence:
  - reference: PMID:24714577
    reference_title: "Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis due to carbonic anhydrase XII deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognizing this newly described entity and differentiating it from cystic fibrosis and pseudohypoaldosteronism are important."
    explanation: >-
      States the central diagnostic task of differentiating this disorder from
      its two mimics.
  - reference: PMID:35359895
    reference_title: "Case Report: Novel CA12 Homozygous Variant Causing Isolated Hyperchloridrosis in a Chinese Child With Hyponatremia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-exome sequencing (WES) was performed and revealed a novel homozygous missense variant c.763A>C (p.Thr255Pro) in the CA12 gene"
    explanation: >-
      Shows whole-exome sequencing establishing the molecular diagnosis.
differential_diagnoses:
- name: Cystic fibrosis
  description: >-
    Cystic fibrosis also presents with elevated sweat chloride and salt-loss
    dehydration, but is caused by CFTR variants and has pulmonary and pancreatic
    disease; in CA12 deficiency CFTR-mediated chloride transport is intact.
  disease_term:
    preferred_term: cystic fibrosis
    term:
      id: MONDO:0009061
      label: cystic fibrosis
  distinguishing_features:
  - Intact CFTR-mediated chloride transport
  - Absence of pulmonary and pancreatic disease
  evidence:
  - reference: PMID:26911677
    reference_title: "Loss of carbonic anhydrase XII function in individuals with elevated sweat chloride concentration and pulmonary airway disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of ion transport across respiratory epithelial cells in vivo and in culture revealed intact CFTR-mediated chloride transport in the adult proband."
    explanation: >-
      Shows CFTR function is intact in CA12 deficiency, distinguishing it from
      cystic fibrosis.
- name: Pseudohypoaldosteronism
  description: >-
    Pseudohypoaldosteronism presents with hyponatremia and hyperkalemia from
    renal (and sweat/salivary) salt wasting with aldosterone resistance; CA12
    deficiency spares renal function and cortisol/ACTH responses are normal.
  distinguishing_features:
  - Normal renal function and cortisol/ACTH response
  - Salt wasting confined to sweat rather than the kidney
  evidence:
  - reference: PMID:40726654
    reference_title: "A case report on pseudohypoaldosteronism with a pathogenic mutation of CA12 causes autosomal recessive isolated hyperchlorhidrosis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The discovery of CA12 gene mutations in this patient shifted the diagnosis from pseudohypoaldosteronism to autosomal recessive Isolated hyperchlorhidrosis disorder."
    explanation: >-
      A case initially diagnosed as pseudohypoaldosteronism, reclassified on
      finding CA12 variants.
treatments:
- name: Dietary salt supplementation
  description: >-
    Oral sodium chloride supplementation (e.g. oral 0.9% NaCl in infancy)
    replaces the sodium and chloride lost in sweat. It prevents episodes of
    hyponatremic dehydration and promotes growth, and is the mainstay of
    management.
  treatment_term:
    preferred_term: sodium chloride dietary supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: sodium chloride
      term:
        id: CHEBI:26710
        label: sodium chloride
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    Bound to the generic clinical action with sodium chloride as the
    `therapeutic_agent` because NCIT has no electrolyte- or
    sodium-supplementation term under NCIT:C25218 Clinical Intervention or
    Procedure: searching NCIT for "electrolyte replacement", "sodium
    supplementation" and "oral rehydration" returns substance and preparation

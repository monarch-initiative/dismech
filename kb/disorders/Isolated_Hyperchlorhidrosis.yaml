    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21184099
      reference_title: "Autosomal recessive hyponatremia due to isolated salt wasting in sweat associated with a mutation in the active site of Carbonic Anhydrase 12."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Glu143 in CA12 is essential for zinc coordination in this metalloenzyme and lowering of the protein-metal affinity reduces its catalytic activity."
      explanation: >-
        Links the active-site variant to reduced catalytic activity of the enzyme.
  - target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
    causal_link_type: DIRECT
    description: >-
      The same loss of CA XII function acts on salivary gland ducts in parallel
      with the sweat duct, rather than through the sweat-duct chain.
  evidence:

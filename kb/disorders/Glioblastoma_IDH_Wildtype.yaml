genetic:
- name: TERT
  association: Promoter Mutation
  notes: >-
    TERT promoter mutations (C228T or C250T) occur in approximately 80% of
    IDH-wildtype glioblastomas. Creates ETS binding sites leading to telomerase
    reactivation. One of three defining molecular features for diagnosis.
  evidence:
  - reference: PMID:30333046
    reference_title: "TERT promoter wild-type glioblastomas show distinct clinical features and frequent PI3K pathway mutations."
    supports: SUPPORT
    snippet: "TERT promoter (TERTp) mutations are found in the majority of World Health Organization (WHO) grade IV adult IDH wild-type glioblastoma (IDH-wt GBM)."
    explanation: "Abstract reports TERT promoter mutations in the majority of IDH-wildtype glioblastomas."
- name: EGFR
  association: Amplification
  notes: >-
    EGFR amplification occurs in 40-50% of cases. EGFRvIII variant (deletion of
    exons 2-7) present in approximately 50% of EGFR-amplified tumors. EGFR
    amplification is one of three defining molecular features.
  evidence:
  - reference: PMID:33235995
    reference_title: "Prognostic impact of CDKN2A/B deletion, TERT mutation, and EGFR amplification on histological and molecular IDH-wildtype glioblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mGBM was defined as grade II-III IDH-wildtype astrocytoma without histological features of GBM but with one of the following molecular alterations: TERT mutation, EGFR amplification, or combination of whole chromosome 7 gain and whole chromosome 10 loss."
    explanation: EGFR amplification is one of the molecular alterations that defines IDH-wildtype (molecular) glioblastoma.
- name: PTEN
  association: Loss/Mutation
  notes: >-
    PTEN is lost or mutated in 40-50% of glioblastomas through chromosome 10 loss,
    mutation, or promoter methylation. Loss activates PI3K/AKT signaling.
- name: CDKN2A/CDKN2B
  association: Homozygous Deletion
  notes: >-
    Homozygous deletion of CDKN2A/CDKN2B at 9p21 occurs in approximately 60% of
    glioblastomas. Eliminates p16INK4a and p14ARF tumor suppressors, disrupting
    both RB and p53 pathways.
  evidence:
  - reference: PMID:33235995
    reference_title: "Prognostic impact of CDKN2A/B deletion, TERT mutation, and EGFR amplification on histological and molecular IDH-wildtype glioblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A/B deletion was associated with worse OS (HR 1.57, 95% CI 1.003-2.46) and PFS (HR 1.57, 95% CI 1.04-2.36) on MVA, but TERT mutation and EGFR amplification were not."
    explanation: In a 367-patient IDH-wildtype GBM cohort, CDKN2A/B homozygous deletion was an independent adverse prognostic biomarker.
- name: TP53
  association: Somatic Mutation
  notes: >-
    TP53 mutations occur in approximately 30% of IDH-wildtype glioblastomas,
    less common than in IDH-mutant tumors.
- name: NF1
  association: Somatic Mutation
  notes: >-
    NF1 mutations occur in approximately 10-15% of glioblastomas, activating
    RAS/MAPK signaling. More common in mesenchymal subtype.
biochemical:
- name: MGMT Promoter Methylation
  notes: >-
    MGMT promoter methylation occurs in approximately 35-45% of glioblastomas and
    predicts response to temozolomide. Silencing of MGMT DNA repair enzyme improves
    sensitivity to alkylating chemotherapy.
computational_models:
- name: TumorTwin High-Grade Glioma Digital Twin
  description: >-
    Modular, differentiable Python framework for image-guided, patient-specific
    oncology digital twins. Its high-grade glioma demonstration calibrates an
    invasion, logistic-growth, chemotherapy, and radiotherapy model to longitudinal
    quantitative MRI-derived tumor-cell-density observations and forecasts spatial
    tumor growth and treatment response.
  model_type: DIGITAL_TWIN
  repository_url: https://github.com/OncologyModelingGroup/TumorTwin
  model_id: "GitHub:OncologyModelingGroup/TumorTwin@bedf90a6d47ba48cf5cdb25901967d84730061d1"
  model_software: TumorTwin (Python/PyTorch)
  model_format: Python/Jupyter Notebook/NIfTI
  publication: PMID:42116079
  modeled_mechanisms:
  - target: Uncontrolled Cell Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The high-grade glioma case represents proliferative expansion through a
      spatial tumor-cell-density field and reports longitudinal total tumor cell
      count while applying modeled chemotherapy and radiotherapy effects.
    limitations: >-
      The published package case is an idealized synthetic high-grade glioma
      demonstration, not a prospectively validated patient model. It is not
      stratified by the IDH-wildtype molecular criteria of this disease entry,
      assumes spatially homogeneous parameters, and is explicitly research-use
      software rather than clinical decision support.
    readouts:
    - name: Longitudinal total tumor cell count
      target: Uncontrolled Cell Proliferation
      interpretation: >-
        The simulated total tumor cell count trajectory summarizes the changing
        spatial tumor-cell-density field; it is a model output, not a validated
        clinical surrogate endpoint.
      evidence:
      - reference: PMID:42116079
        reference_title: "TumorTwin: a Python framework for patient-specific digital twins in oncology."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "Figure 3 shows a representative forward simulation for the model described in the previous section, showing both the TTC (Eq. (9)) over time, and 2D snapshots from the full 3D solution domain at specific timepoints."
        explanation: >-
          Identifies total tumor cell count over time as an explicit output of the
          three-dimensional high-grade glioma simulation.
    evidence:
    - reference: PMID:42116079
      reference_title: "TumorTwin: a Python framework for patient-specific digital twins in oncology."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We demonstrate the functionality of TumorTwin via an in silico dataset of high-grade glioma growth and response to radiation therapy."
      explanation: >-
        Supports linking the framework to the proliferative growth node while
        also delimiting the evidence to an in-silico high-grade glioma case.
  variables:
  - name: Normalized tumor cell density
    dataset_identifier: N
    description: Spatial tumor cellularity state bounded between zero and one.
    unit: dimensionless
    mappings_list:
    - preferred_term: cell population proliferation
      term:
        id: GO:0008283
        label: cell population proliferation
  - name: Total tumor cell count
    dataset_identifier: TTC
    description: >-
      Scalar tumor-burden output computed from normalized cell density and voxel
      cell capacity across the computational domain.
    unit: cells
  findings:
  - statement: >-
      The package demonstrates end-to-end digital-twin calibration and prediction
      with a synthetic high-grade glioma growth and radiotherapy-response dataset.
    evidence:
    - reference: PMID:42116079
      reference_title: "TumorTwin: a Python framework for patient-specific digital twins in oncology."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We demonstrate the functionality of TumorTwin via an in silico dataset of high-grade glioma growth and response to radiation therapy."
      explanation: >-
        Directly states the disease-site demonstration and its synthetic scope.
  evidence:
  - reference: PMID:42116079
    reference_title: "TumorTwin: a Python framework for patient-specific digital twins in oncology."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We present TumorTwin, a modular and differentiable software framework for initializing, updating, and leveraging patient-specific cancer tumor digital twins."
    explanation: Establishes the identity and patient-specific digital-twin purpose of the software.
  notes: >-
    Repository inspected at commit bedf90a6d47ba48cf5cdb25901967d84730061d1.
    The package uses the UT Austin Research License, which permits academic,
    research, experimental, and personal use but excludes commercial use and
    redistribution. At this revision, a Python 3.11 wheel installed and core
    imports plus the focused cellularity-estimation test passed, but the full
    upstream test suite failed during collection because of stale module imports.
- name: Serial-MRI High-Grade Glioma Data-Assimilation Digital Twin
  description: >-
    Patient-specific two-species reaction-diffusion model of enhancing and
    non-enhancing tumor regions. The platform repeatedly assimilates quantitative
    MRI-derived cell-density maps during chemoradiotherapy to update spatial tumor
    forecasts, and also evaluates longer forecasts initialized from two visits
    with patient-specific and cohort-derived parameters.
  model_type: DIGITAL_TWIN
  model_id: "PMID:40730976#two-species-data-assimilation"
  model_format: Reaction-diffusion PDE/MRI data-assimilation pipeline
  publication: PMID:40730976
  modeled_mechanisms:
  - target: Uncontrolled Cell Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model represents spatially varying proliferation, invasion, and
      chemoradiotherapy response through enhancing and non-enhancing tumor-cell
      populations calibrated to serial MRI-derived cellularity.
    limitations: >-
      The cohort contains 21 high-grade glioma cases, including 19 IDH-wildtype
      and two IDH-mutant tumors, so it is not a pure match to this disease entry.
      Weekly multiparametric MRI is not standard care, ADC is an imperfect proxy
      for tumor cellularity, and the reactive forecasting approach cannot predict
      de-novo tumor hotspots or explicitly model molecular and immune heterogeneity.
    readouts:
    - name: Agreement of predicted and measured total tumor cell count
      target: Uncontrolled Cell Proliferation
      interpretation: >-
        Concordance between predicted and MRI-derived total tumor cell counts
        evaluates how well the model tracks the proliferative tumor-burden
        trajectory during treatment; it is not a clinical outcome endpoint.
      evidence:
      - reference: PMID:40730976
        reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "concordance correlation coefficient (CCC) between the predicted and measured total tumor cell counts of 0.91"
        explanation: >-
          Provides the median agreement metric for the repeatedly updated total
          tumor-cell-count forecasts.
    evidence:
    - reference: PMID:40730976
      reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Tumor growth and response to chemoradiation was described using a two-species reaction-diffusion model of enhancing and non-enhancing regions of the tumor."
      explanation: >-
        Establishes that proliferative tumor growth and treatment response are
        explicit components of the two-species spatial model.
  variables:
  - name: Enhancing tumor-cell fraction
    dataset_identifier: Phi_E
    description: MRI-informed spatial state for the contrast-enhancing tumor population.
    unit: dimensionless
  - name: Non-enhancing tumor-cell fraction
    dataset_identifier: Phi_N
    description: MRI-informed spatial state for the non-enhancing T2-hyperintense tumor population.
    unit: dimensionless
  - name: Total tumor cell count
    dataset_identifier: total_tumor_cell_count
    description: Combined enhancing and non-enhancing tumor-cell burden used for forecast evaluation.
    unit: cells
  findings:
  - statement: >-
      Weekly data assimilation yielded a median total-cell-count concordance of
      0.91 and median tumor-volume error of -2.6%; less frequently updated
      forecasts had lower concordance.
    evidence:
    - reference: PMID:40730976
      reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "concordance correlation coefficient (CCC) between the predicted and measured total tumor cell counts of 0.91"
      explanation: Supplies the weekly data-assimilation concordance metric.
    - reference: PMID:40730976
      reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "percent error in tumor volume of -2.6%"
      explanation: Supplies the median weekly tumor-volume error.
    - reference: PMID:40730976
      reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "with significant differences between the approach (1) that does not use the cohort parameters and the two approaches (2 and 3) that do."
      explanation: >-
        Supports the benefit of incorporating cohort information into the
        less-frequently updated forecasts.
  evidence:
  - reference: PMID:40730976
    reference_title: "A data assimilation framework for predicting the spatiotemporal response of high-grade gliomas to chemoradiation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We present a novel computational platform that assimilates MRI data to continually predict spatiotemporal tumor changes during chemoradiotherapy."
    explanation: Establishes the continually updated, patient-specific forecasting platform.
  notes: >-
    No exact source-code repository was identified for this published model.
    TumorTwin is a related framework from the same modeling group but is curated
    separately above and must not be treated as the implementation of this study.
- name: M4RL Glioblastoma Tumor-Microenvironment Treatment Model
  description: >-
    Multiscale framework combining a spatial agent-based model of tumor cells,
    tumor-associated macrophages, cytokines, and intracellular ERK/AKT signaling
    with a Fokker-Planck physics-informed neural-network surrogate and A3C
    reinforcement learning to optimize CSF1R- and IGF1R-inhibitor scheduling.
  model_type: AGENT_BASED
  repository_url: https://github.com/SunXQlab/M4RL
  model_id: "GitHub:SunXQlab/M4RL@3f64a2cbeb6797cd281c19d70a838282996f62b2"
  model_software: C++ multiscale agent-based model; Python/PyTorch PINN and A3C
  model_format: C++/Python/CSV/PyTorch checkpoint (.pth)
  publication: PMID:40779623
  modeled_mechanisms:
  - target: M2-Like Tumor-Associated Macrophage Polarization
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      The agent-based model explicitly represents M0, M1, and M2 macrophage
      states and perturbs their polarization through simulated CSF1R inhibition.
    limitations: >-
      The discrete M0/M1/M2 states simplify a continuous macrophage phenotype
      spectrum, and the treatment response was evaluated computationally and
      against preclinical rather than prospective patient data.
    readouts:
    - name: M2-to-M1 macrophage repolarization under CSF1R inhibition
      target: M2-Like Tumor-Associated Macrophage Polarization
      direction: ALTERED
      interpretation: >-
        The simulated shift toward M1 macrophages is a direct readout of the
        model's macrophage-polarization mechanism, not evidence of clinical
        repolarization in patients.
      evidence:
      - reference: PMID:40779623
        reference_title: "Multiscale mathematical model-informed reinforcement learning optimizes combination treatment scheduling in glioblastoma evolution."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "These CSF1R_I molecules initially blocks the binding of CSF1 to CSF1R on M2 macrophages, leading some M2 macrophages to polarize into M1 macrophages (Fig. 3A, day 50)."
        explanation: Reports the simulated macrophage-state shift under CSF1R inhibition.
    evidence:
    - reference: PMID:40779623
      reference_title: "Multiscale mathematical model-informed reinforcement learning optimizes combination treatment scheduling in glioblastoma evolution."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We first develop a multiscale agent-based model (MSABM) for a critical biological scenario where interactions between tumor-associated macrophages (TAMs) and tumor cells (TCs) underlie immunotherapy resistance in glioblastoma."
      explanation: Establishes tumor-associated macrophages as explicit mechanistic agents in the model.
  - target: Uncontrolled Cell Proliferation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      The model perturbs tumor-cell proliferation indirectly through simulated
      CSF1R inhibition of macrophage polarization and IGF1R inhibition of tumor
      cells, using tumor-cell density and predicted survival as optimization
      outputs.
    limitations: >-
      Validation is preclinical and computational rather than prospective or
      patient-specific, and the modeled glioblastoma is not stratified by IDH
      status. The agent model reduces macrophages to M0/M1/M2 states, omits T
      cells and other signaling pathways, and represents vasculature only as a
      source of recruited macrophages and drug penetration.
    readouts:
    - name: Tumor-cell density under optimized combination treatment
      target: Uncontrolled Cell Proliferation
      direction: DECREASED
      interpretation: >-
        Lower simulated tumor-cell density reports suppression of the modeled
        proliferative endpoint under the optimized schedule; it does not establish
        efficacy in people with IDH-wildtype glioblastoma.
      evidence:
      - reference: PMID:40779623
        reference_title: "Multiscale mathematical model-informed reinforcement learning optimizes combination treatment scheduling in glioblastoma evolution."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "Accordingly, the Fokker-Planck equation–based surrogate model demonstrates that, under the most effective treatment scheduling, the predicted population’s TC density remains at a low level with a high probability (Fig. 8F)."
        explanation: >-
          Reports the direction of the tumor-cell-density output under the
          reinforcement-learning-selected combination schedule.
    evidence:
    - reference: PMID:40779623
      reference_title: "Multiscale mathematical model-informed reinforcement learning optimizes combination treatment scheduling in glioblastoma evolution."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "We first develop a multiscale agent-based model (MSABM) for a critical biological scenario where interactions between tumor-associated macrophages (TAMs) and tumor cells (TCs) underlie immunotherapy resistance in glioblastoma."

- name: Fasting-Induced Plasma Fatty-Acid Rise
  presence: INCREASED
  context: >-
    A 14-day fast in the mother produced weight loss and increased plasma fatty
    acids, showing that lipid mobilization remained possible under prolonged
    fasting. The source notes that reduced re-esterification could have
    contributed, so this does not identify the responsible pathway.
  evidence:
  - reference: PMID:4345904
    reference_title: "Triglyceride storage disease: a disorder of lipolysis in adipose tissue in two patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, lipolysis was stimulated by a fast of 14 days as judged by
      weight loss and a rise in plasma fatty acids from 0.4 to 1.2 mM.
    explanation: >-
      The fasting response is an important boundary condition against
      interpreting the ex vivo isoprenaline result as complete systemic
      lipolysis failure.
diagnosis:
- name: Historical Ex Vivo Adipose-Tissue Isoprenaline Challenge
  description: >-
    The reported phenotype was defined by biopsy-derived adipose tissue showing
    preserved cyclic-AMP generation but reduced glycerol release after
    isoprenaline. This invasive research assay has not been validated as a
    clinical diagnostic test, and no molecular confirmatory test is known.
  results: >-
    Normal stimulated adipose cyclic-AMP increment with reduced stimulated
    glycerol release relative to obese controls.
  evidence:
  - reference: DOI:10.1093/oxfordjournals.qjmed.a067378
    reference_title: Triglyceride Storage Disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In three other generalized obese patients of a kindred, isoprenaline
      (10−5M) stimulated the activity of adenyl cyclase in subcutaneous adipose
      tissue as judged by normal increments in tissue levels of cyclic-AMP but
      this failed to activate the triglyceride lipase; seen as a reduced output
      of glycerol compared to obese controls (P &lt; 0.01).
    explanation: >-
      This is the phenotype-defining paired functional assay, not evidence for
      a contemporary standard-of-care diagnostic procedure.
differential_diagnoses:
- name: Historical Triglyceride Storage Disease Type 1
  description: >-
    The historical type I phenotype was reported in severely underweight
    children with peripheral adipose triglyceride deposition, congenital and
    neurologic abnormalities, and absent cyclic-AMP as well as glycerol
    responses to isoprenaline. Type II instead retained the cyclic-AMP response
    and was described in generalized-obese relatives.
  disease_term:
    preferred_term: triglyceride storage disease, type 1
    term:
      id: MONDO:0008601
      label: triglyceride storage disease, type 1
  evidence:
  - reference: PMID:187005
    reference_title: "Triglyceride storage disease. A report of two affected children associated with neurological abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Peripheral adipose tissue of one of these children displayed: (a) reduced
      sensitivity of adenyl cyclase to stimulation by noradrenaline (b) no
      response in tissue levels of cyclic AMP when stimulated by isoprenaline
      and (c) impaired release of glycerol following stimulation with
      isoprenaline.
    explanation: >-
      The absent upstream cyclic-AMP response differentiates the pediatric
      historical phenotype from the preserved-cAMP type II pattern.
- name: Neutral Lipid Storage Myopathy
  description: >-
    PNPLA2-related neutral lipid storage myopathy (MONDO:0012545; OMIM:610717)
    is a distinct, molecularly defined PNPLA2 disorder with myopathy. It must
    not be treated as a synonym for the historical post-cAMP adipose-lipolysis
    phenotype MONDO:0008602 / OMIM:190430.
  disease_term:
    preferred_term: neutral lipid storage myopathy
    term:
      id: MONDO:0012545
      label: neutral lipid storage myopathy
  evidence:
  - reference: PMID:32564019
    reference_title: "Neutral Lipid Storage Disease Associated with the PNPLA2 Gene: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the PNPLA2 gene cause neutral lipid storage disease with
      myopathy (NLSDM) or triglyceride deposit cardiomyovasculopathy.
    explanation: >-
      This establishes PNPLA2-related NLSDM as a separate named molecular
      disease rather than evidence for PNPLA2 in triglyceride storage disease
      type 2.

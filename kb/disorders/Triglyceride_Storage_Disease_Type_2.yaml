review_notes: >-
  This review corrects a named-entity conflation. MONDO:0008602 maps to
  OMIM:190430 and the historical preserved-cAMP adipose-lipolysis phenotype;
  MONDO:0012545 maps to OMIM:610717 and PNPLA2-related neutral lipid storage
  myopathy. Accordingly, PNPLA2, autosomal-recessive inheritance, Jordan
  anomaly, myopathy, cardiomyopathy, hyperCKemia, and NLSDM management were
  removed from this record and remain in the separate
  `Neutral_Lipid_Storage_Myopathy.yaml` entry. Reciprocal synonymy claims still
  present in that file and in `Triglyceride_Storage_Disease_Type_1.yaml` are
  outside this target-scoped review and require separate collision-checked
  reviews. The retained type II content is calibrated to a single small kindred
  and an explicitly provisional 1974 classification. Putative
  autosomal-dominant inheritance is marked partial; no causal gene, molecular diagnostic
  test, treatment, animal or cellular disease model, clinical trial, or
  prevalence estimate is asserted. A deterministic GEO search returned only
  generic triglyceride-storage, obesity, or unrelated PNPLA2 datasets; OmicsDI
  and EBI omics searches found no exact disease dataset, so `datasets` is
  explicitly empty. No disease-specific GeneReviews chapter was found. The
  PMID cache for the 1974 paper contains metadata only, so exact abstract
  evidence is cited through the DOI cache generated by the sanctioned reference
  workflow.

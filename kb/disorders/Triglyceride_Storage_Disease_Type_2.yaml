name: Triglyceride Storage Disease Type 2
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Triglyceride storage disease type 2 is a historical, sparsely reported
  adipose-tissue lipolysis phenotype catalogued as MONDO:0008602 and
  OMIM:190430. In three generalized-obese relatives, isoprenaline produced a
  normal adipose-tissue cyclic-AMP response but abnormally little glycerol
  release, placing the proposed defect downstream of cyclic AMP and before or
  at triglyceride-lipase activation. The molecular lesion has not been
  identified, the original classification was explicitly provisional, and
  fasting could still mobilize fatty acids. This entity is distinct from
  PNPLA2-related neutral lipid storage myopathy (MONDO:0012545; OMIM:610717).
synonyms:
- triglyceride storage disease, type II
- TSD type II
category: Mendelian
disease_term:
  preferred_term: triglyceride storage disease, type 2
  term:
    id: MONDO:0008602
    label: triglyceride storage disease, type 2
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008602
      label: triglyceride storage disease, type 2
    mapping_predicate: skos:exactMatch
    mapping_source: OMIM:190430
    mapping_justification: >-
      MONDO:0008602 cross-references OMIM:190430 for the historical type II
      adipose-lipolysis phenotype. It is not the PNPLA2-related neutral lipid
      storage myopathy concept MONDO:0012545 / OMIM:610717.
parents:
- Triglyceride Storage Disease
inheritance:
- name: Putative autosomal dominant inheritance
  description: >-
    Affected mother-daughter transmission and the later description of three
    generalized-obese patients in one kindred are compatible with autosomal
    dominant inheritance. This remains provisional: no locus, variant,
    segregation study, penetrance estimate, or independent molecularly defined
    family has been reported.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:4345904
    reference_title: "Triglyceride storage disease: a disorder of lipolysis in adipose tissue in two patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The defect in this patient may be familial since her obese daughter also
      showed diminished release of glycerol from adipose tissue on three
      occasions when stimulated by isoprenaline, despite normal rises in levels
      of cyclic-AMP.
    explanation: >-
      Mother-daughter recurrence supports familial transmission but does not by
      itself establish an autosomal dominant molecular disorder.
pathophysiology:
- name: Post-cAMP Failure of Isoprenaline-Stimulated Adipocyte Lipolysis
  description: >-
    Subcutaneous adipose tissue from the reported type II kindred increased
    cyclic AMP after isoprenaline but released abnormally little glycerol. The
    historical authors placed the candidate lesion somewhere downstream of
    adenylate cyclase and cyclic AMP, but neither the affected protein nor the
    precise activation or lipase step was established.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  locations:
  - preferred_term: subcutaneous adipose tissue
    term:
      id: UBERON:0002190
      label: subcutaneous adipose tissue
  biological_processes:
  - preferred_term: triglyceride catabolic process
    term:
      id: GO:0019433
      label: triglyceride catabolic process
    modifier: DECREASED
  evidence:
  - reference: DOI:10.1093/oxfordjournals.qjmed.a067378
    reference_title: Triglyceride Storage Disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In three other generalized obese patients of a kindred, isoprenaline
      (10−5M) stimulated the activity of adenyl cyclase in subcutaneous adipose
      tissue as judged by normal increments in tissue levels of cyclic-AMP but
      this failed to activate the triglyceride lipase; seen as a reduced output
      of glycerol compared to obese controls (P &lt; 0.01).
    explanation: >-
      This directly defines the type II biochemical pattern: preserved
      cyclic-AMP generation with impaired downstream glycerol release.
  - reference: PMID:4345904
    reference_title: "Triglyceride storage disease: a disorder of lipolysis in adipose tissue in two patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An obese patient was studied whose adipose tissue showed a significant
      reduction in release of glycerol (P < 0.05) when stimulated by
      isoprenaline despite normal rises in tissue levels of cyclic-AMP.
    explanation: >-
      The original family report independently states the preserved upstream
      cyclic-AMP response and reduced downstream lipolytic readout.
  downstream:
  - target: Excessive Adipose Triglyceride Storage
    description: >-
      Impaired stimulated triglyceride breakdown was associated with excess
      adipose triglyceride storage, but causality and the intervening molecular
      step were not directly demonstrated.
    causal_link_type: UNKNOWN
    evidence:
    - reference: DOI:10.1093/oxfordjournals.qjmed.a067378
      reference_title: Triglyceride Storage Disease
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four patients are described with metabolic defects on the paths of
        triglyceride breakdown associated with excessive storage of
        triglyceride in adipose tissue.
      explanation: >-
        The classification paper reports association between impaired
        triglyceride breakdown and adipose storage, without establishing a
        molecularly complete causal chain.
- name: Excessive Adipose Triglyceride Storage
  description: >-
    Excess adipose triglyceride storage was reported in the provisional
    historical disease group. For type II, its causal dependence on the ex vivo
    isoprenaline-response defect remains plausible but unproven, particularly
    because fasting-mediated lipid mobilization was retained.
  role: central_effector

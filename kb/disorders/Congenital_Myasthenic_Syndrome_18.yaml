name: Congenital Myasthenic Syndrome 18
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Congenital Myasthenic Syndrome 18
  term:
    id: MONDO:0014590
    label: congenital myasthenic syndrome 18
parents:
- Congenital Myasthenic Syndrome
description: >-
  Congenital myasthenic syndrome 18 (CMS18, SNAP25-CMS; OMIM #616330) is an
  ultra-rare autosomal dominant presynaptic congenital myasthenic syndrome
  caused by de novo heterozygous variants in SNAP25, which encodes
  synaptosomal-associated protein 25 (SNAP-25B), the plasma-membrane
  (target/t-) SNARE that assembles with syntaxin-1 (t-SNARE) and
  synaptobrevin/VAMP (vesicle/v-SNARE) into the alpha-helical coiled-coil
  SNARE complex driving calcium-triggered synaptic vesicle fusion. Unlike the
  loss-of-function recessive presynaptic syndromes of acetylcholine synthesis
  and packaging (CHAT/CMS6, SLC5A7, SLC18A3), CMS18 is caused by
  dominant-negative alleles acting on the shared release machinery, so the
  defect is a reduction in the number of quanta released per nerve impulse
  with normal quantal size - electrophysiologically a Lambert-Eaton-like
  (LEMS-like) presynaptic release failure rather than a defect of transmitter
  supply. Because SNAP-25 is the same fusion protein used at central synapses,
  the neuromuscular phenotype is accompanied by prominent CNS involvement:
  the index patient presented with fatigable myasthenic weakness together with
  cerebral cortical hyperexcitability, cerebellar ataxia, and intellectual
  disability. The reported phenotypic range now extends from that
  adolescent-diagnosed myasthenic-plus presentation to a critically ill
  newborn with a de novo SNAP25 nonsense variant. CMS18 sits at a nosological
  boundary with SNAP25-related developmental and epileptic encephalopathy
  (SNAP25-DEE, curated separately as SNAP25 Encephalopathy): both are
  SNAREopathies arising from de novo SNAP25 variants, but CMS18 is defined by
  a demonstrable neuromuscular junction transmission defect - shown in the
  index patient by in vitro microelectrode studies of intercostal-muscle
  endplates - which is the therapeutic target that the encephalopathy label
  does not imply.
inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CMS18 alleles reported to date are heterozygous and de novo, arising in
    the affected individual with unaffected parents. This distinguishes CMS18
    from the majority of congenital myasthenic syndromes, which are autosomal
    recessive loss-of-function disorders; the dominant behaviour of SNAP25
    alleles is attributed to a dominant-negative effect of the mutant
    SNAP-25B subunit incorporated into SNARE complexes.
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a dominant de novo variant, p.Ile67Asn, in SNAP25B, a SNARE protein essential for exocytosis of synaptic vesicles from nerve terminals and of dense-core vesicles from endocrine cells."
    explanation: Establishes the dominant, de novo mode of inheritance of the index CMS18 allele.
pathophysiology:
- name: Dominant-Negative Disruption of the SNARE Complex
  biological_scale: MOLECULAR
  description: >-
    De novo heterozygous SNAP25 variants impair the SNAP-25B moiety of the
    ternary SNARE complex. In the index allele p.Ile67Asn, a highly
    hydrophobic isoleucine in the coiled-coil interface is replaced by a
    strongly hydrophilic asparagine, disrupting the hydrophobic packing that
    holds the four-helix SNARE bundle together. Because the mutant subunit is
    incorporated into complexes alongside wild-type SNAP-25B, the effect is
    dominant-negative rather than simple haploinsufficiency: co-expression of
    mutant with wild-type protein still markedly impairs evoked exocytosis.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: SNARE complex assembly
    term:
      id: GO:0035493
      label: SNARE complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We attribute the deleterious effects of the mutation to disruption of the hydrophobic α-helical coiled-coil structure of the SNARE complex by replacement of a highly hydrophobic isoleucine by a strongly hydrophilic asparagine."
    explanation: Defines the molecular lesion as disruption of the hydrophobic coiled-coil packing of the SNARE complex.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "depolarization of bovine chromaffin cells transfected with mutant SNAP25B or with mutant plus wild-type SNAP25B markedly reduced depolarization-evoked exocytosis compared with wild-type transfected cells."
    explanation: Co-transfection of mutant with wild-type SNAP25B still impairs evoked exocytosis, demonstrating the dominant-negative mechanism.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, cells cotransfected with both wild-type and mutant SNAP25B exocytosed vesicles at the same reduced rate as cells transfected with only the mutant SNAP25B, indicating that the I67N mutation has a dominant-negative effect."
    explanation: Explicitly names the dominant-negative effect of the I67N allele on exocytosis.
  downstream:
  - target: Impaired Calcium-Triggered Synaptic Vesicle Exocytosis
    causal_link_type: DIRECT
    description: >-
      A SNARE complex that cannot zipper into a stable coiled-coil cannot
      deliver the mechanical force required to fuse the synaptic vesicle with
      the presynaptic membrane on calcium entry.
    evidence:
    - reference: PMID:38411501
      reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, the I67N mutant decreased mEPSC frequency and evoked EPSC amplitudes due to an increase in the height of the energy barrier for fusion, whereas the RRP size was unaffected."
      explanation: >-
        Links the structural destabilization of the SNARE complex directly to a
        raised energy barrier for fusion and reduced release, the immediate
        downstream consequence.
- name: Impaired Calcium-Triggered Synaptic Vesicle Exocytosis
  biological_scale: CELLULAR
  description: >-
    Calcium-triggered exocytosis requires assembly of the vesicular SNARE
    synaptobrevin with the presynaptic t-SNAREs SNAP-25B and syntaxin. With a
    defective SNAP-25B moiety, fusion is hindered even in a reconstituted
    liposome system, and depolarization-evoked release from dense-core
    vesicles in chromaffin cells is markedly reduced. The same defect operates
    at cholinergic motor nerve terminals and at central synapses, which is why
    CMS18 is a combined neuromuscular and CNS disorder rather than a purely
    neuromuscular one.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Central nervous system neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Calcium-ion regulated exocytosis
    term:
      id: GO:0017156
      label: calcium-ion regulated exocytosis
    modifier: DECREASED
  - preferred_term: Synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Ca(2+) triggered fusion of liposomes incorporating v-SNARE with liposomes containing t-SNAREs was hindered when t-SNAREs harbored the mutant SNAP25B moiety."
    explanation: Direct reconstitution evidence that the mutant SNAP-25B blocks calcium-triggered membrane fusion.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis."
    explanation: States the pathogenic mechanism as inhibition of synaptic vesicle exocytosis.
  - reference: PMID:38411501
    reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All three mutations reduced Syt1-dependent vesicle docking to SNARE-carrying liposomes and Ca2+-stimulated membrane fusion in vitro and when expressed in mouse hippocampal neurons."
    explanation: >-
      Independent reconstitution and neuronal-expression work confirming that the
      CMS18 allele I67N reduces synaptotagmin-1-dependent vesicle docking and
      calcium-stimulated fusion.
  - reference: PMID:38411501
    reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the I67N mutant decreased mEPSC frequency and evoked EPSC amplitudes due to an increase in the height of the energy barrier for fusion, whereas the RRP size was unaffected."
    explanation: >-
      Refines the CMS18 mechanism in mouse hippocampal neurons: I67N raises the
      energy barrier for fusion, reducing both spontaneous and evoked release,
      without depleting the readily releasable pool. This is mechanistically
      distinct from the SNAP25 encephalopathy alleles V48F and D166Y, which act
      at the synaptotagmin-1 interface and instead show gain-of-function
      spontaneous release.
  downstream:
  - target: Reduced Evoked Quantal Release at the Motor Endplate
    causal_link_type: DIRECT
    description: >-
      Fewer synaptic vesicles fuse per nerve impulse, lowering the number of
      acetylcholine quanta released at the neuromuscular junction.
    evidence:
    - reference: PMID:25381298
      reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neuromuscular transmission at patient endplates was compromised by reduced evoked quantal release."
      explanation: >-
        Directly links the exocytosis defect to reduced evoked quantal release
        measured at patient motor endplates.
  - target: Central Synaptic Dysfunction
    causal_link_type: DIRECT
    description: >-
      The same fusion defect at central excitatory and inhibitory synapses
      produces cortical hyperexcitability, cerebellar dysfunction, and
      impaired cognitive development.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because synaptic proteins subserving exocytosis are also present in the brain, some affected patients also show abnormal cortical electrical activity and impaired cognitive development."
      explanation: >-
        States the causal link from the shared exocytosis machinery defect to
        central nervous system manifestations.
- name: Reduced Evoked Quantal Release at the Motor Endplate
  biological_scale: CELLULAR
  description: >-
    In vitro microelectrode studies of intercostal muscle endplates from the
    index patient showed neuromuscular transmission compromised by reduced
    evoked quantal release - the presynaptic, Lambert-Eaton-like signature
    that distinguishes SNAP25-CMS from postsynaptic acetylcholine receptor
    deficiency (a reduced synaptic response to acetylcholine, with quantal
    release preserved or even compensatorily increased) and from the
    acetylcholine-resynthesis defect of CHAT-CMS (a use-dependent fall in
    quantal size). SNAP25-CMS is classified with SYT2-, RPH3A- and
    UNC13A-CMS in the LEMS-like release-machinery subtype. Detailed endplate
    studies of the index patient refine this picture: the number of
    acetylcholine receptors per endplate was normal and endplate
    ultrastructure was preserved, but the probability of quantal release was
    reduced to 63% of normal, and the quantal content of the endplate
    potential and the number of readily releasable quanta were abnormally
    distributed - some endplates markedly abnormal and others normal or
    supranormal - a pattern the investigators attributed to postzygotic
    somatic mosaicism for the de novo variant.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:

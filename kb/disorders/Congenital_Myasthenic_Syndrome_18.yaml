    explanation: Documents normal brain imaging in the index CMS18 patient, a negative that argues against a structural CNS cause.
differential_diagnoses:
- name: Autoimmune Myasthenia Gravis
  description: >-
    The acquired autoimmune disorder of neuromuscular transmission, and the
    first differential a clinician must exclude in a child with fatigable
    weakness and ptosis. It is historically the entity against which the CMS
    were defined as distinct: the congenital syndromes were separated out only
    once the autoimmune origin of myasthenia gravis was established. The
    distinction is made serologically, and antibody negativity is what
    redirects the workup toward a genetic cause.
  distinguishing_features:
  - Autoimmune myasthenia gravis is antibody-mediated and acquired, whereas CMS18 is a de novo germline SNAP25 disorder present from birth
  - Anti-AChR and anti-MuSK antibody testing is indicated in sporadic patients over 1 year of age and in arthrogrypotic infants; antibody negativity is essential before attributing the phenotype to a congenital myasthenic syndrome
  - Myasthenia gravis is postsynaptic, whereas CMS18 is a presynaptic quantal-release defect, and it responds to immunotherapy rather than to 3,4-diaminopyridine
  disease_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tests for anti-AChR and anti-MuSK antibodies are indicated in sporadic patients after the age of 1 year and in arthrogrypotic infants even if the mother has no myasthenic symptoms."
    explanation: Establishes serological exclusion of autoimmune myasthenia gravis as an indicated step in the CMS workup.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CMS have been recognized as distinct clinical entities since the 1970s, after the autoimmune origin of myasthenia gravis and of the Lambert-Eaton myasthenic syndromes had been established."
    explanation: Documents that the congenital myasthenic syndromes are nosologically defined against autoimmune myasthenia gravis and LEMS.
- name: Lambert-Eaton Myasthenic Syndrome
  description: >-
    The acquired autoimmune presynaptic disorder, in which autoantibodies
    against presynaptic voltage-gated calcium channels reduce evoked quantal
    release. This is the closest mechanistic mimic of CMS18: both act
    presynaptically on quantal release, both produce post-tetanic facilitation
    of the compound muscle action potential, and both respond to
    3,4-diaminopyridine - which is why CMS18 is classified within the
    LEMS-like group of congenital myasthenic syndromes. The separation is
    aetiological rather than physiological.
  distinguishing_features:
  - LEMS is antibody-mediated and typically adult-onset and paraneoplastic (commonly small cell lung cancer), whereas CMS18 is a de novo germline SNAP25 disorder presenting from birth or early childhood
  - CMS18 additionally carries a central SNARE phenotype - epileptiform EEG, ataxia, and intellectual disability - that LEMS does not
  - The shared 3,4-diaminopyridine response reflects a shared presynaptic release defect and is therefore not discriminating
  disease_term:
    preferred_term: Lambert-Eaton myasthenic syndrome
    term:
      id: MONDO:0018556
      label: Lambert-Eaton myasthenic syndrome
  evidence:
  - reference: PMID:40533459
    reference_title: "Review of 40 genes causing congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "9 Lambert-Eaton myasthenic syndrome (LEMS)-like CMS SYT2, SNAP25, VAMP1, UNC13A, RPH3A, LAMA5"
    explanation: Classifies SNAP25-CMS by name within the Lambert-Eaton-like group, establishing LEMS as the phenotypic mimic that must be distinguished.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CMS have been recognized as distinct clinical entities since the 1970s, after the autoimmune origin of myasthenia gravis and of the Lambert-Eaton myasthenic syndromes had been established."
    explanation: Documents that the congenital myasthenic syndromes were delineated as distinct from the Lambert-Eaton myasthenic syndromes.
- name: SNAP25 Developmental and Epileptic Encephalopathy
  description: >-
    The allelic disorder caused by de novo SNAP25 variants, in which
    early-onset epilepsy and intellectual disability dominate and a
    demonstrable neuromuscular junction transmission defect is not the
    defining feature. CMS18 and SNAP25-DEE lie on a single SNAREopathy
    spectrum; the distinction rests on whether fatigable weakness with an
    electrophysiologically demonstrable neuromuscular transmission defect is
    present and therapeutically targetable.
  distinguishing_features:
  - Fatigable weakness with a demonstrable neuromuscular junction transmission defect is definitional for CMS18 but not for SNAP25-DEE
  - CMS18 has a specific pharmacological target (presynaptic quantal release, amenable to 3,4-diaminopyridine)
  notes: >-
    disease_term is deliberately left unbound here. MONDO carries SNAP25-DEE as
    an exact synonym of MONDO:0014590 - the same term this entry uses - so there
    is no distinct MONDO identifier to bind, and binding the entry's own term to
    its differential would be self-referential. The dismech SNAP25_Encephalopathy
    entry is anchored on that same MONDO:0014590 for the same reason. Splitting
    the two concepts depends on monarch-initiative/mondo#10532, which proposes a
    rename and re-parent of MONDO:0014590 and is still open.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide a comprehensive description of SNAP25-DEE with intellectual disability and early-onset epilepsy"
    explanation: Characterizes the allelic SNAP25 encephalopathy phenotype that must be distinguished from CMS18.
- name: Other Presynaptic Congenital Myasthenic Syndromes
  description: >-
    CMS caused by defects in the other presynaptic release-machinery and
    acetylcholine-supply proteins - SYT2, VAMP1, UNC13A, RPH3A (LEMS-like
    release defects) and CHAT, SLC5A7, SLC18A3 (acetylcholine synthesis,
    transport, and packaging). These share fatigable weakness but differ in
    inheritance, endplate electrophysiological signature, and drug response,
    and clinical and electrophysiological features alone are insufficient to
    discriminate them.
  distinguishing_features:
  - Most other presynaptic CMS are autosomal recessive loss-of-function disorders, whereas CMS18 is autosomal dominant de novo with a dominant-negative mechanism
  - Prominent cortical hyperexcitability, ataxia, and intellectual disability point toward the SNARE-complex subtypes rather than the acetylcholine-supply subtypes
  - Genetic testing is required for definitive subtype assignment
  disease_term:
    preferred_term: Presynaptic congenital myasthenic syndrome
    term:
      id: MONDO:0700466
      label: presynaptic congenital myasthenic syndrome
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical and electrophysiological features are not sufficient to identify a defective molecule, and genetic studies are always required for accurate diagnosis."
    explanation: Establishes that genetic testing, not clinical or electrophysiological phenotype, is required to distinguish CMS subtypes from one another.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    CMS18 is ultra-rare; only a small number of individually reported patients
    with de novo SNAP25 variants and a documented myasthenic phenotype exist in
    the literature. Congenital myasthenic syndromes as a family sit in the
    Orphanet 1-9 per 1,000,000 point-prevalence band - a contemporary UK
    national cohort of genetically confirmed cases put it at 6.5 per million
    overall - and SNAP25-CMS is one of the rarest subtypes within that family,
    dwarfed by CHRNE, DOK7, and RAPSN, so its own rate is well below that.
  evidence:
  - reference: ORPHA:590
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "1-9 / 1 000 000 | Europe | Point prevalence | EXPERT"
    explanation: >-
      Orphanet point-prevalence class for congenital myasthenic syndrome as a
      whole. Marked PARTIAL because no subtype-specific prevalence figure for
      CMS18 has been reported; the CMS-family figure is an upper bound and CMS18
      is one of the rarest subtypes within it.
  - reference: PMID:41251564
    reference_title: "Prevalence and Geographical Distribution of Patients With Congenital Myasthenic Syndromes in the United Kingdom."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The UK prevalence was 6.5 cases per million overall and 8.5 cases per million in the pediatric population."
    explanation: >-
      Contemporary genetically confirmed UK prevalence for congenital myasthenic
      syndromes as a whole, from a 442-patient national cohort in which CHRNE,

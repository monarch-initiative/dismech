discussions:
- discussion_id: gap_cms18_dee_nosological_boundary
  kind: OPEN_QUESTION
  prompt: >-
    Are CMS18 (SNAP25 congenital myasthenic syndrome) and SNAP25 developmental
    and epileptic encephalopathy one disorder with a variable neuromuscular
    component, or two mechanistically separable entities?
  attaches_to:
  - pathophysiology#Central Synaptic Dysfunction
  rationale: >-
    The two entities are allelic and share a single upstream lesion - impaired
    SNARE-mediated, calcium-triggered vesicle fusion. Biophysical work now
    suggests the distinction may be variant-specific rather than categorical:
    the CMS18 index allele I67N destabilizes the SNARE four-helix bundle and
    raises the energy barrier for fusion (a pure release deficit), whereas the
    encephalopathy-associated alleles V48F and D166Y sit at the
    synaptotagmin-1-binding interface and combine impaired priming with
    gain-of-function spontaneous release. If that distinction holds, whether a
    given patient is labelled CMS18 or SNAP25-DEE may depend on which arm of the
    release defect predominates, and on whether neuromuscular electrophysiology
    was performed at all - a serious ascertainment concern, because the
    myasthenic component is the treatable one.
  proposed_experiments:
  - experiment_id: cms18_rns_in_dee_ascertained_cohort
    name: Systematic neuromuscular electrophysiology in SNAP25 variant carriers ascertained through epilepsy
    description: >-
      Perform repetitive nerve stimulation and single-fibre EMG in a cohort of
      patients carrying de novo SNAP25 variants who were ascertained through
      epilepsy or developmental-encephalopathy channels, to determine what
      fraction have an unrecognized - and potentially 3,4-diaminopyridine
      responsive - neuromuscular transmission defect.
  - experiment_id: cms18_variant_position_stratification
    name: Variant-position stratification of the myasthenic component
    description: >-
      Test whether variant position (SNARE four-helix bundle versus
      synaptotagmin-1-binding interface) predicts the presence and severity of
      the myasthenic component and the response to 3,4-diaminopyridine.
  evidence:
  - reference: PMID:38411501
    reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We studied three mutations in SNAP25 that cause epileptic encephalopathy: V48F, and D166Y in the synaptotagmin-1 (Syt1)-binding interface, and I67N, which destabilizes the SNARE complex."
    explanation: >-
      Illustrates the nosological blur directly: the CMS18 index allele I67N is
      grouped with the encephalopathy alleles in the biophysical literature while
      being distinguished from them by structural mechanism.
  - reference: PMID:38411501
    reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These mutations lowered the energy barrier for fusion and increased the release probability, which are gain-of-function features not found in Syt1 knockout (KO) neurons"
    explanation: >-
      Documents the opposite directional effect of the V48F/D166Y encephalopathy
      alleles compared with the CMS18 I67N allele, supporting the proposal that
      the two clinical labels track distinct variant-level mechanisms.

    snippet: "9 Lambert-Eaton myasthenic syndrome (LEMS)-like CMS SYT2, SNAP25, VAMP1, UNC13A, RPH3A, LAMA5"
    explanation: >-
      Assigns SNAP25 by name to CMS subtype 9, the Lambert-Eaton-like
      presynaptic release-failure group, alongside its SNARE and

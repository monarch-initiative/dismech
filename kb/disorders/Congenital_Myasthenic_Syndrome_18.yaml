histopathology:
- name: Structurally Normal Neuromuscular Junction
  description: >-
    A key negative finding that localizes the CMS18 defect to the release
    machinery rather than to endplate structure: electron microscopy of 22
    endplates from the index patient revealed no structural abnormality, the
    cholinesterase-reactive synaptic contacts were normally shaped, and both
    acetylcholine receptor and acetylcholinesterase expression were normal.
    This distinguishes CMS18 from the endplate-development, endplate
    acetylcholine receptor deficiency, and endplate acetylcholinesterase
    deficiency syndromes, in which the junction is structurally abnormal.
  diagnostic: true
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron micrographs of 22 EPs revealed no structural abnormality"
    explanation: Documents normal endplate ultrastructure in CMS18, excluding a structural endplate defect.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cholinesterase reactive synaptic contacts on intercostal muscle fibers were pretzel shaped or ovoid and expressed AChR and AChE normally."
    explanation: Documents normal endplate morphology and normal AChR/AChE expression in CMS18.
genetic:
- name: SNAP25
  gene_term:
    preferred_term: SNAP25
    term:
      id: hgnc:11132
      label: SNAP25
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SNAP25 (20p11.2) encodes synaptosomal-associated protein 25. The
    neuron-specific SNAP-25B splice isoform, which predominates in mature
    brain and at the motor nerve terminal, is the relevant transcript. CMS18
    alleles reported to date are de novo and heterozygous, and include the
    index missense p.Ile67Asn in the coiled-coil interface and a nonsense
    c.529C>T (p.Gln177Ter) allele in a critically ill newborn.
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a dominant de novo variant, p.Ile67Asn, in SNAP25B, a SNARE protein essential for exocytosis of synaptic vesicles from nerve terminals and of dense-core vesicles from endocrine cells."
    explanation: Founding report identifying SNAP25 as the CMS18 gene.
  - reference: PMID:36379720
    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed rapid whole-genome sequencing (rWGS) on a critically ill newborn leading to the discovery of an unreported pathogenic de novo SNAP25 c.529C > T; p.Gln177Ter variant."
    explanation: Documents a second, nonsense CMS18 allele identified by rapid genome sequencing.
treatments:
- name: Amifampridine (3,4-Diaminopyridine)
  description: >-
    Amifampridine (3,4-diaminopyridine) is the mechanistically rational
    therapy for CMS18. It blocks presynaptic voltage-gated potassium channels,
    prolonging the nerve terminal action potential and increasing calcium
    entry, which raises the number of acetylcholine quanta released per
    impulse and so directly counteracts the reduced release probability caused
    by the defective SNARE complex. In the index patient it improved strength,
    but it did not improve the ataxia - an important expectation-setting point,
    since the central nervous system components of CMS18 are not corrected by
    a drug acting on presynaptic release at the neuromuscular junction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amifampridine
      term:
        id: CHEBI:135948
        label: amifampridine
  target_mechanisms:
  - target: Reduced Evoked Quantal Release at the Motor Endplate
    treatment_effect: RESTORES
    description: >-
      Potassium-channel blockade prolongs the presynaptic action potential and
      increases calcium influx, partially restoring the number of acetylcholine
      quanta released per nerve impulse.
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy with 3,4-diaminopyridine, along with levetiracetam to prevent seizures, improved the patient’s strength but not her ataxia."
    explanation: Documents the observed benefit of 3,4-diaminopyridine on strength in CMS18, and its failure to improve the cerebellar ataxia.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "3,4-diaminopyridine (3,4-DAP), a potassium channel blocker that enhances quantal release by prolonging the duration of the presynaptic action potential, and hence Ca2+ entry into the nerve terminal."
    explanation: Establishes the pharmacological mechanism by which 3,4-diaminopyridine enhances quantal release, the deficit that defines CMS18.
- name: Antiseizure Prophylaxis
  description: >-
    Because cortical hyperexcitability is intrinsic to CMS18, antiseizure
    medication may be required in parallel with myasthenia-directed therapy.
    The index patient received levetiracetam to prevent seizures alongside
    3,4-diaminopyridine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Central Synaptic Dysfunction
    treatment_effect: MODULATES
    description: >-
      Levetiracetam acts on the synaptic vesicle protein SV2A to dampen the
      cortical hyperexcitability arising from central synaptic dysfunction; it
      does not correct the underlying SNARE defect.
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy with 3,4-diaminopyridine, along with levetiracetam to prevent seizures, improved the patient’s strength but not her ataxia."
    explanation: Documents concurrent levetiracetam seizure prophylaxis in the management of the index CMS18 patient.
- name: Genetic Counseling
  description: >-
    CMS18 alleles reported to date are de novo and heterozygous, so recurrence
    risk for the parents of an affected child is low but not zero (germline
    mosaicism cannot be excluded), while an affected individual would carry a
    50% transmission risk. Molecular subtype identification is itself
    therapeutically consequential in the congenital myasthenic syndromes,
    because a drug that helps one subtype can worsen another.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36379720
    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Precise diagnosis and molecular subtype identification are critical for treatment as medication for one subtype may exacerbate disease in another"
    explanation: Establishes why molecular subtype identification (and the genetic counseling that accompanies it) is clinically consequential in the congenital myasthenic syndromes.
diagnosis:
- name: Repetitive nerve stimulation and single-fiber EMG
  description: >-
    The entry-level electrodiagnostic test. A decremental compound muscle
    action potential response to low-frequency repetitive nerve stimulation,
    or abnormal jitter/blocking on single-fiber EMG, establishes a defect of
    neuromuscular transmission and, with onset at birth to early childhood and
    fatigable cranial weakness, supports a generic CMS diagnosis. It does not
    discriminate CMS18 from other CMS subtypes.
  diagnosis_term:
    preferred_term: repetitive nerve stimulation electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  results: >-
    A decremental CMAP response on low-frequency repetitive nerve stimulation,
    or abnormal single-fiber EMG, indicates impaired neuromuscular
    transmission.
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A generic diagnosis of a CMS can be made on the basis of onset at birth to early childhood, fatigable weakness affecting especially the ocular and other cranial muscles, a positive family history, and a decremental EMG response or an abnormal single-fiber EMG."
    explanation: Defines the clinical-plus-electrodiagnostic basis on which a generic CMS diagnosis rests.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER

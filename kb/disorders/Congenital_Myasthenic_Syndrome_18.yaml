      Measurement of compound muscle action potentials elicited by repetitive
      nerve stimulation is required to diagnose CMS.
    explanation: Establishes repetitive nerve stimulation as a required diagnostic measurement in CMS.
- name: Molecular genetic testing
  description: >-
    Definitive subtype assignment requires identification of the causal SNAP25
    variant, because clinical and electrophysiological features cannot
    discriminate between CMS genes. Both reported CMS18 alleles were found by
    unbiased sequencing - the index p.Ile67Asn by whole-exome sequencing with

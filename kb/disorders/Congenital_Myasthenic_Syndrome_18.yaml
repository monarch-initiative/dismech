notes: >-
  Scope limits recorded at curation time. (1) The second reported CMS18 patient
  (Reynolds 2022, PMID:36379720, de novo p.Gln177Ter) is described in the source
  as a critically ill newborn, and the full text reports a neonatal course with
  respiratory failure. Only the abstract is cacheable through just
  fetch-reference - both the PMID and the DOI (10.1101/mcs.a006242) resolve to
  abstract_only, and the abstract states neither respiratory failure nor the
  outcome - so no respiratory phenotype is curated rather than quoting an
  unverifiable claim. This should be revisited if the PMC9808558 full text
  becomes cacheable, since respiratory involvement in 1 of only 2 reported
  patients is clinically significant. (2) No CMS18-specific prevalence figure
  exists; both prevalence rows bound the CMS family and are marked PARTIAL.
  (3) No decremental-response phenotype is curated: the index patient's
  transmission defect was demonstrated by in vitro microelectrode studies, and
  neither primary report documents a decrement on repetitive nerve stimulation.

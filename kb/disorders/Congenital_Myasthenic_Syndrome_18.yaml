    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed rapid whole-genome sequencing (rWGS) on a critically ill newborn leading to the discovery of an unreported pathogenic de novo SNAP25 c.529C > T; p.Gln177Ter variant. In this report, we present a novel case of CMS18 with complex neonatal consequence."
    explanation: >-
      Supports severe neonatal presentation in CMS18. Marked PARTIAL because the
      abstract documents critical neonatal illness without specifying cyanosis.
- category: Neurologic
  name: Cerebral Cortical Hyperexcitability
  diagnostic: true
  description: >-
    Cerebral cortical hyperexcitability is a defining component of the CMS18
    phenotype and the feature that separates it clinically from the other
    presynaptic congenital myasthenic syndromes. In the index patient it
    manifested as episodes of unresponsiveness without convulsions together
    with generalized atypical polyspike-and-wave discharges and diffuse
    background slowing on EEG; antiseizure prophylaxis with levetiracetam was
    given alongside the myasthenia-directed therapy. This CNS excitability
    phenotype is the clinical bridge between CMS18 and the allelic SNAP25
    developmental and epileptic encephalopathy.
  phenotype_term:
    preferred_term: Generalized polyspike-and-wave discharges on EEG
    term:
      id: HP:0011198
      label: EEG with generalized epileptiform discharges
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To identify and characterize the molecular basis of a syndrome associated with myasthenia, cortical hyperexcitability, cerebellar ataxia, and intellectual disability."
    explanation: >-

    evidence_source: HUMAN_CLINICAL
    snippet: "Intercostal muscle EP electrophysiology studies showed a slightly reduced MEPP amplitude, but the number of AChRs per EP was normal."
    explanation: Confirms the defect is presynaptic - endplate acetylcholine receptor number is preserved, excluding postsynaptic receptor deficiency.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "were abnormally distributed, with some values significantly lower and some normal or higher than normal, suggesting somatic mosaicism that can occur when a mutation arises in a postzygotic cell."
    explanation: >-
      Documents the heterogeneous endplate-to-endplate distribution of quantal
      content and readily releasable quanta. Marked PARTIAL because the somatic
      mosaicism interpretation is an inference from the endplate distribution
      rather than a directly demonstrated finding.
  downstream:
  - target: Impaired Neuromuscular Junction Transmission
    causal_link_type: DIRECT
    description: >-
      Fewer acetylcholine quanta per impulse reduce endplate potential
      amplitude and the safety factor of neuromuscular transmission.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Congenital myasthenic syndromes (CMS) are heterogeneous disorders in which the safety margin of neuromuscular transmission is impaired by one or more specific mechanisms."
      explanation: >-
        Establishes the reduced safety margin of neuromuscular transmission as the
        shared terminal consequence to which the CMS18 quantal-release deficit
        converges.
- name: Impaired Neuromuscular Junction Transmission
  biological_scale: CELLULAR
  description: >-
    The terminal shared mechanism of all congenital myasthenic syndromes: a
    reduced safety factor of cholinergic neuromuscular transmission, so that
    endplate potentials intermittently fail to reach the threshold for a
    muscle fibre action potential. Clinically this produces fatigable weakness
    and electrodiagnostically a decremental compound muscle action potential
    response on low-frequency repetitive nerve stimulation.
  cell_types:
  - preferred_term: Skeletal muscle fiber (postsynaptic motor endplate)
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: Neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To identify and characterize the molecular basis of a syndrome associated with myasthenia, cortical hyperexcitability, cerebellar ataxia, and intellectual disability."
    explanation: Establishes myasthenia (impaired neuromuscular transmission) as a defining component of the CMS18 syndrome.
  downstream:
  - target: Fatigable Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      A reduced safety factor becomes symptomatic with sustained or repetitive
      activity, producing exertion-dependent weakness.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Later, she presented fluctuating muscle weakness, intermittent eyelid ptosis, and episodes of unresponsiveness without convulsions."
      explanation: >-
        Documents the clinical fluctuating (fatigable) weakness that results from the
        impaired neuromuscular transmission in the index CMS18 patient.
- name: Central Synaptic Dysfunction
  biological_scale: CELLULAR
  description: >-
    SNAP-25B is the dominant SNAP-25 isoform in the mature brain, so the same
    exocytosis defect operates at central synapses. Impaired
    calcium-triggered release at cortical, cerebellar, and other CNS synapses
    produces the non-neuromuscular components of CMS18 - cerebral cortical
    hyperexcitability, cerebellar ataxia, and intellectual disability - which
    are not features of most other presynaptic congenital myasthenic
    syndromes and are the clinical bridge to the allelic SNAP25 developmental
    and epileptic encephalopathy.
  cell_types:
  - preferred_term: Central nervous system neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis."
    explanation: >-
      States the study's conclusion that the SNAP25B p.Ile67Asn variant acts by
      inhibiting synaptic vesicle exocytosis - the release defect this node
      applies at central synapses, where SNAP-25B is the dominant isoform. The
      CNS manifestations themselves are carried by the companion item below.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because synaptic proteins subserving exocytosis are also present in the brain, some affected patients also show abnormal cortical electrical activity and impaired cognitive development."
    explanation: States the mechanistic reason the presynaptic release machinery defect produces CNS as well as neuromuscular manifestations.
  downstream:
  - target: Cerebral Cortical Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Impaired regulation of transmitter release in cortical circuits produces
      the epileptiform cortical activity seen in CMS18.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Electroencephalography (EEG) revealed generalized atypical polyspike and wave discharges with diffuse slowing of the background rhythm."
      explanation: >-
        Documents the cortical hyperexcitability that results from central synaptic
        dysfunction in the index CMS18 patient.
  - target: Cerebellar Ataxia
    causal_link_type: DIRECT
    description: >-
      Cerebellar circuit dysfunction from the same release defect produces the
      ataxia, which - unlike the myasthenic weakness - does not improve with
      3,4-diaminopyridine.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therapy with 3,4-diaminopyridine, along with levetiracetam to prevent seizures, improved the patient’s strength but not her ataxia."
      explanation: >-
        Shows the ataxia is dissociable from the neuromuscular component: a drug
        acting on presynaptic release at the neuromuscular junction improved strength
        but left the cerebellar ataxia unchanged.
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      Impaired synaptic transmission and plasticity during development underlie
      the cognitive impairment.
    evidence:
    - reference: PMID:29355968
      reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because synaptic proteins subserving exocytosis are also present in the brain, some affected patients also show abnormal cortical electrical activity and impaired cognitive development."
      explanation: >-
        Links the central exocytosis defect to impaired cognitive development.
phenotypes:
- category: Neuromuscular
  name: Fatigable Muscle Weakness
  diagnostic: true
  description: >-
    Fluctuating, exertion-dependent muscle weakness - the defining myasthenic
    feature of CMS18 and the basis for its classification within the congenital
    myasthenic syndromes. In the index patient it involved the limbs (she
    could not rise from the floor or walk unaided) and the eyelids; respiratory
    muscle involvement dominates the severe neonatal end of the spectrum.
  phenotype_term:
    preferred_term: Fatigable weakness
    term:
      id: HP:0003473
      label: Fatigable weakness
  evidence:
  - reference: PMID:36379720
    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SNAP25-related CMS subtype (congenital myasthenic syndrome 18, CMS18; MIM #616330) is a rare disorder characterized by muscle fatigability, delayed psychomotor development, and ataxia."
    explanation: Names muscle fatigability as a defining clinical feature of CMS18.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, she was stiff and cyanotic and had multiple joint contractures. Later, she presented fluctuating muscle weakness, intermittent eyelid ptosis, and episodes of unresponsiveness without convulsions."
    explanation: Documents fluctuating (fatigable) muscle weakness in the index CMS18 patient.
- category: Neuromuscular
  name: Ptosis
  description: >-
    Intermittent eyelid ptosis, the classic ocular manifestation of a reduced
    safety factor of neuromuscular transmission, was present in the index
    CMS18 patient.
  phenotype_term:
    preferred_term: Intermittent ptosis
    term:
      id: HP:0000508
      label: Ptosis
    temporality: RECURRENT
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, she presented fluctuating muscle weakness, intermittent eyelid ptosis, and episodes of unresponsiveness without convulsions."
    explanation: Documents intermittent eyelid ptosis in the index CMS18 patient.
- category: Musculoskeletal
  name: Congenital Joint Contractures
  description: >-
    The index CMS18 patient was stiff at birth with multiple joint
    contractures, indicating that impaired neuromuscular transmission is
    already operating in utero and reducing fetal movement. Congenital
    contractures are a recognized presentation across severe congenital
    myasthenic syndromes generally, though SNAP25 is not among the genes
    Ohno's review lists for the arthrogryposis-multiplex-congenita CMS
    subtype; here the finding is curated from the index patient directly.
  phenotype_term:
    preferred_term: Multiple congenital joint contractures
    term:
      id: HP:0002803
      label: Congenital contracture
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, she was stiff and cyanotic and had multiple joint contractures."
    explanation: Documents congenital stiffness and multiple joint contractures at birth in the index CMS18 patient.
- category: Neonatal
  name: Neonatal Cyanosis
  description: >-
    The index patient was cyanotic at birth, consistent with the
    respiratory compromise that can accompany severe congenital neuromuscular
    transmission failure in the newborn period. The severity of the neonatal
    presentation in CMS18 is variable and can be extreme: the second reported
    patient, carrying a de novo SNAP25 nonsense allele, was a critically ill
    newborn.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:29355968

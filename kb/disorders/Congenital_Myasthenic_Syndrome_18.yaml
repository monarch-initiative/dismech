    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalography (EEG) revealed generalized atypical polyspike and wave discharges with diffuse slowing of the background rhythm."
    explanation: Documents the EEG abnormality in the index CMS18 patient.
- name: In vitro microelectrode study of the intercostal muscle endplate
  description: >-
    The definitive mechanistic diagnostic, available at only a few centers. In
    vitro microelectrode recording from an intercostal muscle endplate biopsy
    localizes the defect to presynaptic quantal release rather than to
    postsynaptic acetylcholine receptor number or endplate structure, and is

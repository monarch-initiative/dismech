    explanation: Documents the in vitro endplate study and its key discriminating result - a normal postsynaptic receptor complement.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuromuscular transmission at patient endplates was compromised by reduced evoked quantal release."
    explanation: The in vitro microelectrode result that localizes the CMS18 defect to evoked quantal release.
- name: Brain MRI
  description: >-
    A diagnostically informative negative. Brain MRI was normal in the index
    CMS18 patient despite intellectual disability, ataxia, and epileptiform

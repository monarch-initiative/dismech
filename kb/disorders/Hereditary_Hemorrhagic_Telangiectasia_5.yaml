- name: Loss of Endothelial Quiescence and Enhanced Angiogenic Response
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The working model for the whole HHT series is that BMP9/BMP10 signalling
    through ALK1 and endoglin holds endothelium in a quiescent state, and that
    losing it re-activates angiogenesis or sensitises the endothelium to
    angiogenic stimuli, producing endothelial hyperproliferation and
    hypermigration. Direct demonstration for the GDF2 lesion specifically is
    animal and in vitro: a bmp9-deficient zebrafish showed BMP9 is required in
    angiogenesis, and mutant BMP9 conditioned medium failed to induce ID1 in
    cultured endothelial cells. Marked PROBABLE rather than ESTABLISHED because
    the quiescence-to-AVM step is inferred from the shared pathway and from
    model systems rather than observed in HHT5 patient tissue.

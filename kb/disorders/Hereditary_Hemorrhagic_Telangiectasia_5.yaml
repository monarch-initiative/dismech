- name: PI3K-Akt-mTOR and VEGFR2 Overactivation in Endothelium
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Losing the BMP9/ALK1-SMAD1/5/8 input does not merely remove a brake; it
    releases two proliferative signalling arms. In HHT models, endothelial
    PI3K/Akt/mTOR and VEGFR2 signalling become overactivated, and correcting
    them pharmacologically blocks and reverses arteriovenous malformations. The
    reason this node belongs in a GDF2 entry rather than only in the parent
    disease is the model used: the malformations were produced by BMP9/BMP10
    immunoblockade, which is a ligand-deficiency model and therefore the closest
    available experimental analogue of HHT5 itself. It is nonetheless a mouse
    model and not a GDF2 patient, so the node is marked PROVISIONAL. It is also
    the mechanistic rationale for the single reported sirolimus response in this
    entity.

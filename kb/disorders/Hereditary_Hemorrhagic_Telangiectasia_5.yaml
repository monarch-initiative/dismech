- name: Arteriovenous Malformation and Telangiectasia Formation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The tissue lesion is a direct artery-to-vein connection without an
    intervening capillary bed - a telangiectasis where small and superficial, an
    arteriovenous malformation where large or visceral. In HHT5 the reported
    distribution is distinctive rather than simply a milder version of HHT: the
    cutaneous lesions are spider-like or linear and fall on the cheeks, chin and
    face rather than on the lips, oral cavity and finger pads that the Curacao
    criteria specify, and the pulmonary lesions tend to be numerous, tiny and
    diffuse rather than discrete feeding-vessel AVMs. The one reported
    heterozygous family is the exception on the cutaneous side, with
    telangiectasia its authors called typical of HHT.

prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists for HHT5, and none should be
    inferred from the parent disease. The published base is a handful of
    families: three unrelated heterozygous probands identified out of 191
    gene-negative individuals clinically suspected of HHT, one further
    heterozygous family, and a small number of homozygous children. In the
    largest systematic search, whole-genome sequencing of 160 HHT participants
    from 126 families in the 100,000 Genomes Project identified GDF2 variants in
    exactly one family, which places an upper bound on how much of the
    gene-negative HHT population this entity can explain.
  evidence:
  - reference: PMID:23972370
    reference_title: BMP9 mutations cause a vascular-anomaly syndrome with phenotypic overlap with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic etiology for 191 unrelated individuals clinically suspected to
      have HHT was investigated with the use of exome and Sanger sequencing;
      these individuals had no mutations in ENG, ACVRL1, and SMAD4. Mutations in
      BMP9 (also known as GDF2) were identified in three unrelated probands.
    explanation: >-
      Gives the denominator and numerator of the founding ascertainment: three
      probands out of 191 gene-negative HHT-suspected individuals.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through the 100,000 Genomes Project Data Release 6.0, WGS data were
      available for 160 HHT participants from 126 families. No other GDF2
      variants were identified in these families.
    explanation: >-
      Bounds the rarity of the entity within a systematically sequenced HHT
      cohort: one GDF2 family out of 126.
  - reference: PMID:34611981
    reference_title: "Clinical manifestations of patients with GDF2 mutations associated with hereditary hemorrhagic telangiectasia type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study reported on a cohort of four unrelated probands who were
      diagnosed with a rare form of GDF2-related HHT5, for which only five
      prior cases have been described.
    explanation: >-
      Gives the published proband count directly: four new plus five prior,
      which is the whole world literature on this entity at that point.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    OMIM catalogues HHT5 (615506) as an autosomal dominant trait, following the
    founding report, in which three unrelated probands carried heterozygous GDF2
    missense substitutions, and a later family in which a single heterozygous
    GDF2 missense variant segregated with clinically diagnosed HHT across three
    affected members of two generations. The dominant assignment is not
    uniformly supported across the reported case base - see the separate
    autosomal recessive block and the hht5_inheritance_mode discussion.
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome sequencing and tiering protocols identified a novel,
      heterozygous GDF2 sequence variant in all three affected members of one
      HHT family who had previously screened negative for ACVRL1, ENG, and
      SMAD4.
    explanation: >-
      Documents segregation of a single heterozygous GDF2 allele with disease in
      an HHT family, which is the strongest dominant evidence for this entity.
  - reference: PMID:23972370
    reference_title: BMP9 mutations cause a vascular-anomaly syndrome with phenotypic overlap with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in BMP9 (also known as GDF2) were identified in three unrelated
      probands.
    explanation: >-
      The founding heterozygous probands on which the OMIM dominant assignment
      rests.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A separate and larger part of the GDF2 case base is biallelic. Children
    homozygous for GDF2 nonsense or frameshift alleles - p.Gln26Ter,
    p.Glu279Ter, p.Tyr354ArgfsTer15 - have presented with pulmonary AVMs and
    facial telangiectases or with paediatric pulmonary arterial hypertension,
    while their obligate heterozygous parents were clinically unaffected on
    directed examination. Functionally, the homozygotes have undetectable
    circulating BMP9 whereas heterozygotes retain normal serum endothelial BMP
    activity despite reduced levels, which is a haplosufficiency argument
    against simple dominance for these alleles. Whether HHT5 is best described
    as dominant, recessive, or semi-dominant with allele-dependent behaviour is
    the entity's central unresolved genetic question.
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, these data show that homozygous GDF2 mutations, leading to a
      loss of circulating BMP9 and BMP10, can cause either pediatric PAH and/or
      "HHT-like" telangiectases and PAVMs.
    explanation: >-
      Establishes biallelic GDF2 loss of function as a disease genotype in its
      own right.
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither parent had telangiectases or other cutaneous vascular lesions on
      examination, and both denied epistaxis.
    explanation: >-
      Obligate heterozygous carriers examined and found clinically unaffected,
      which is the observation that makes these truncating alleles look
      recessive rather than dominant.
  - reference: PMID:32669404
    reference_title: Homozygous GDF2-Related Hereditary Hemorrhagic Telangiectasia in a Chinese Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ours is the first report of homozygous GDF2-related HHT; in addition, this
      variant has not been reported previously.
    explanation: >-
      A second, independently ascertained biallelic family, in a consanguineous
      pedigree with heterozygous parents.
genetic:
- name: GDF2
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GDF2
    term:
      id: hgnc:4217
      label: GDF2
  variants:
  - name: GDF2 p.Arg333Trp
    type: missense
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    description: >-
      One of the three heterozygous missense substitutions in the founding
      report. Population-scale sequencing later found it at 0.1% of control
      chromosomes, which is far too common for a cause of an ultra-rare
      disorder, and its pathogenicity is now uncertain. Do not cite it as an
      established pathogenic HHT5 allele.
    evidence:
    - reference: PMID:34904380
      reference_title: "Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With the recent expansion of population-scale whole genome
        sequencing (WGS), one of these variants (p.Arg333Trp) is found in
        0.1% of control chromosomes, and thus its pathogenicity is now
        uncertain
      explanation: >-
        Records the control-population frequency that downgraded this allele
        to uncertain significance.
  - name: GDF2 p.Cys428Arg
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Heterozygous missense variant segregating with clinically diagnosed HHT in
      all three affected members of one family, absent from the unaffected
      father, and reported once in 152,092 gnomAD alleles. Functionally
      characterised: the mutant construct expressed the proprotein but yielded
      no mature BMP9 dimer, and its conditioned medium failed to induce ID1 or
      pre-miR-21 in endothelial cells.
    evidence:
    - reference: PMID:34904380
      reference_title: "Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inspection of these Tier 3 variants identified a novel, heterozygous
        GDF2 missense variant (c.1282T>C, p.Cys428Arg).
      explanation: >-
        Names the variant and its zygosity in the family in which it was
        identified.
  - name: GDF2 p.Gln26Ter
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous nonsense allele in a child with severe paediatric pulmonary
      arterial hypertension and, on later examination, facial telangiectases.
      Translation can initiate at Met57 downstream of the stop, but the
      resulting protein is neither processed nor secreted, so circulating BMP9
      is absent.
    evidence:
    - reference: PMID:26801773
      reference_title: "Novel homozygous BMP9 nonsense mutation causes pulmonary arterial hypertension: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic screening revealed a novel homozygous nonsense mutation in
        the BMP9 gene (c.76C > T; p.Gln26Ter).
      explanation: >-
        Names the allele and its homozygous state in the index paediatric
        PAH case.
  - name: GDF2 p.Glu279Ter
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous nonsense allele in a consanguineous family; the child had
      multiple tiny pulmonary AVMs, facial telangiectases and hypoxaemia, with
      undetectable plasma BMP9 and pBMP10. Both parents were heterozygous and
      clinically unaffected.
    evidence:
    - reference: PMID:33834622
      reference_title: "Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an \"HHT-like\" syndrome in children."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both parents were heterozygous for this variant, which was not
        present in the brother.
      explanation: >-
        Establishes the biallelic segregation of this allele and the carrier
        status of the unaffected parents.
  - name: GDF2 p.Tyr354ArgfsTer15
    type: frameshift
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous frameshift allele in a consanguineous Chinese family, inherited
      from heterozygous parents. The proband had diffuse pulmonary AVMs and
      hypoxaemia; a sibling homozygous for the same allele was asymptomatic at
      age 7.
    evidence:
    - reference: PMID:34904380
      reference_title: "Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        More recently, two children with PAVMs and other features suggestive
        of HHT were identified with homozygous GDF2 mutations (one
        frameshift, one nonsense)
      explanation: >-
        Independent confirmation that a homozygous GDF2 frameshift allele
        was reported in a child with pulmonary AVMs.
  - name: GDF2 p.Val403Ile and p.Glu355Gln
    type: missense
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    description: >-
      Two heterozygous missense variants, one per proband, in a four-proband
      HHT5 cohort. Their authors state explicitly that neither had previously
      been annotated as pathogenic, and no functional characterisation of
      either is reported, so they are recorded here at the confidence their
      source claims and no higher.
    evidence:
    - reference: PMID:34611981
      reference_title: "Clinical manifestations of patients with GDF2 mutations associated with hereditary hemorrhagic telangiectasia type 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two patients harbored heterozygous missense variants not previously
        annotated as pathogenic (p.Val403Ile; p.Glu355Gln).
      explanation: >-
        Names both alleles and states their annotation status, which is what
        sets the clinical significance recorded here.
  - name: 10q11.22-10q11.23 interstitial deletion encompassing GDF2
    type: copy_number_loss
    clinical_significance: PATHOGENIC
    description: >-
      Interstitial deletions larger than five megabases spanning 10q11.22 to
      10q11.23 and including GDF2, in two of four probands in one cohort - the
      first report of large genomic deletions causing HHT5. Two consequences
      follow. Diagnostically, sequencing alone cannot find these; CNV-aware
      testing is required. Phenotypically, a multi-megabase deletion removes
      many genes besides GDF2, and the extravascular findings in these patients
      were attributed to the deletion rather than to BMP9 loss - so do not read
      their non-vascular features as HHT5 phenotypes.
    evidence:
    - reference: PMID:34611981
      reference_title: "Clinical manifestations of patients with GDF2 mutations associated with hereditary hemorrhagic telangiectasia type 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The other two patients harbored interstitial deletions larger than
        five megabases between 10q11.22 and 10q11.23 that included GDF2.
      explanation: >-
        Establishes the deletion allele class and its size range.
    - reference: PMID:34611981
      reference_title: "Clinical manifestations of patients with GDF2 mutations associated with hereditary hemorrhagic telangiectasia type 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        To our knowledge, this is the first report detailing large genomic
        deletions leading to HHT5.
      explanation: >-
        States that this allele class was previously unrecognised for this
        entity, which is why testing strategy has to account for it.
  notes: >-
    Inheritance for this gene is reported both as heterozygous (autosomal
    dominant, the OMIM assignment) and as homozygous (biallelic, in
    consanguineous or founder settings); see the two inheritance blocks and the
    hht5_inheritance_mode discussion. Both mechanistically characterised
    missense alleles act by blocking cleavage of the BMP9 proprotein rather than
    by abolishing transcription.

    Two further cautions for anyone extending this block. First, p.Arg333Trp - one of
    the three founding alleles - was later found at 0.1% of control chromosomes
    in population-scale sequencing and its pathogenicity is now uncertain; do
    not cite it as an established pathogenic variant. Second, GDF2 has a much
    better established gene-disease relationship with pulmonary arterial
    hypertension than with HHT: the ClinGen-style PAH gene curation classified
    GDF2 as definitive for heritable/idiopathic PAH, whereas no comparable
    definitive classification exists for GDF2-HHT, and the GeneReviews HHT
    chapter still confines molecular diagnosis of HHT to ACVRL1, ENG and SMAD4.
  evidence:
  - reference: PMID:23972370
    reference_title: BMP9 mutations cause a vascular-anomaly syndrome with phenotypic overlap with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data confirm a genetic cause of a vascular-anomaly syndrome that has
      phenotypic overlap with HHT.
    explanation: >-
      The founding assignment of GDF2 as the causal gene of this entity, stated
      in the authors' own careful wording.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, we propose that this heterozygous GDF2 variant is a rare
      cause of HHT associated with pulmonary AVMs.
    explanation: >-
      The strongest published statement that a heterozygous GDF2 allele causes
      HHT proper rather than an HHT-like syndrome.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the recent expansion of population-scale whole genome sequencing
      (WGS), one of these variants (p.Arg333Trp) is found in 0.1% of control
      chromosomes, and thus its pathogenicity is now uncertain
    explanation: >-
      Records the retraction in confidence for one of the three founding alleles,
      which is why the variant list above flags it rather than reciting it.
  - reference: PMID:37422716
    reference_title: Defining the clinical validity of genes reported to cause pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve genes (BMPR2, ACVRL1, ATP13A3, CAV1, EIF2AK4, ENG, GDF2, KCNK3,
      KDR, SMAD9, SOX17, and TBX4) were classified as having definitive evidence
    explanation: >-
      Supports the note that GDF2's definitive gene-disease validity was
      established for pulmonary arterial hypertension, not for HHT.
pathophysiology:
- name: GDF2 Variant Blocks BMP9 Proprotein Cleavage and Secretion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    BMP9 is synthesised as a precursor consisting of a prodomain and a
    C-terminal growth-factor domain, cleaved by furin-type proprotein
    convertases so that the prodomain remains non-covalently bound to the mature
    dimer. The two functionally characterised HHT5 missense alleles do not
    abolish expression of the precursor; they block this maturation step. Cells
    transfected with the p.Cys428Arg construct expressed the proprotein but
    secreted no mature BMP9 dimer, and conditioned medium from the mutant failed
    to induce the BMP target genes ID1 and pre-miR-21 in endothelial cells. The
    truncating alleles act earlier and more completely: p.Gln26Ter protein could
    be translated from an internal methionine but was neither processed nor
    secreted.
  genetic_context:
    gene:
      preferred_term: GDF2
      term:
        id: hgnc:4217
        label: GDF2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline GDF2 missense and truncating alleles; the characterised missense
      alleles impair proprotein processing rather than transcription.
  molecular_functions:
  - preferred_term: BMP receptor binding (mature BMP9 growth-factor domain)
    term:
      id: GO:0070700
      label: BMP receptor binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: BMP9 proprotein processing
    term:
      id: GO:0016485
      label: protein processing
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte (principal site of BMP9 synthesis)
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Loss of Circulating BMP9 and BMP10
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34904380
      reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In vitro studies showed the mutant construct expressed the proprotein but
        lacked active mature BMP9 dimer, suggesting the mutation disrupts correct
        cleavage of the protein. Plasma BMP9 levels in the patients were
        significantly lower than controls.
      explanation: >-
        Connects the processing defect measured in vitro to the reduced
        circulating BMP9 measured in the same patients, which is precisely this
        edge.
  evidence:
  - reference: PMID:23972370
    reference_title: BMP9 mutations cause a vascular-anomaly syndrome with phenotypic overlap with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analyses of the variant proteins suggested that mutations negatively
      affect protein processing and/or function
    explanation: >-
      The founding functional characterisation of the HHT5 alleles as processing
      defects.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, whereas wild-type medium induced a fivefold increase in ID1
      expression in cultured endothelial cells and a threefold increase in
      pre-miR-21, conditioned media from the mutant construct failed to
      upregulate these BMP-responsive target genes
    explanation: >-
      Shows the processing defect is functional, not merely biochemical: mutant
      conditioned medium cannot activate BMP target genes in endothelium.
  - reference: PMID:25620979
    reference_title: Emerging roles of BMP9 and BMP10 in hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This protein is cleaved by subtilisin-related pro-protein convertases
    explanation: >-
      Identifies the normal maturation step that the HHT5 missense alleles
      disrupt.
- name: Loss of Circulating BMP9 and BMP10
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    BMP9 is secreted principally by the liver and circulates in plasma; BMP10
    levels track it closely, partly through circulating BMP9/BMP10 heterodimers.
    In children homozygous for GDF2 nonsense alleles, plasma BMP9 and BMP10 were
    both undetectable and serum-derived endothelial BMP activity was
    correspondingly low. In the heterozygous classic-HHT family, circulating
    BMP9 was significantly reduced rather than absent. This node is the systemic
    step that makes HHT5 a ligand-deficiency disease, in contrast to the
    receptor and co-receptor haploinsufficiencies of HHT2 and HHT1, and it is
    the reason plasma BMP9 is a candidate biomarker for this entity specifically.
  biological_processes:
  - preferred_term: BMP signaling pathway (ligand availability)
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  downstream:
  - target: Reduced Endothelial ALK1-SMAD1/5/8 Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33834622
      reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma levels of both BMP9 and BMP10 were undetectable in the two
        homozygous index cases and this corresponded to low serum-derived
        endothelial BMP activity in the patients.
      explanation: >-
        Directly couples absent circulating ligand to reduced BMP signalling
        activity measured in an endothelial reporter line - the edge itself,
        assayed in patient serum.
  evidence:
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected, there was no detectable circulating BMP9 in the homozygotes,
      while the heterozygotes had circulating levels below those of healthy
      controls, suggesting haplosufficiency.
    explanation: >-
      Quantifies the node and, in the same sentence, records the dose dependence
      that distinguishes biallelic from monoallelic carriers.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma BMP9 levels in the patients were significantly lower than controls.
    explanation: >-
      Shows the same node is reached by a heterozygous processing-defective
      allele, not only by biallelic truncation.
  - reference: PMID:18309101
    reference_title: "Bone morphogenetic protein-9 is a circulating vascular quiescence factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The concentration of circulating BMP9 was found to vary between 2 and
      12 ng/mL in sera and plasma from healthy humans, a value well above
      its EC(50) (50 pg/mL)
    explanation: >-
      Establishes that BMP9 normally circulates far above its half-maximal
      effective concentration, which is why losing it is a systemic
      signalling loss rather than a local one.
- name: Reduced Endothelial ALK1-SMAD1/5/8 Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-

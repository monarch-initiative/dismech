    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for the GDF2-defined HHT entity (xref
      OMIM:615506). The entry is anchored to this term rather than to the parent
      HHT term because the entity is defined by its gene; the corresponding
      subtype stub on the parent entry

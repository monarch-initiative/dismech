name: Hereditary Hemorrhagic Telangiectasia Type 5
creation_date: '2026-09-01T00:00:00Z'
synonyms:
- HHT5
- telangiectasia, hereditary hemorrhagic, type 5
- GDF2-related hereditary hemorrhagic telangiectasia
- BMP9-related vascular anomaly syndrome
description: >-
  Hereditary hemorrhagic telangiectasia type 5 (HHT5) is the GDF2-defined member
  of the HHT numbered series. GDF2 encodes BMP9, the circulating high-affinity
  ligand of the endothelial ALK1/endoglin receptor complex whose receptor and
  co-receptor genes (ACVRL1, ENG) define HHT2 and HHT1. Pathogenic GDF2 variants
  impair proprotein cleavage and secretion of the mature BMP9 growth-factor
  domain, so that circulating BMP9 - and, because the two ligands travel
  together, circulating BMP10 - falls; endothelial SMAD1/5/8 signalling through
  ALK1 is correspondingly reduced, endothelial quiescence is lost, and
  arteriovenous malformations and telangiectases form. The entity is defined
  molecularly rather than clinically, and its clinical identity is genuinely
  unsettled: the founding report and the largest phenotyping study describe an
  HHT-like vascular anomaly syndrome whose patients do not meet the Curacao
  criteria and whose telangiectases differ in site and appearance from those of
  HHT, while a later family with a heterozygous GDF2 variant had classic HHT
  telangiectasia, nosebleeds and severe pulmonary AVMs. Pulmonary involvement is
  the recurring feature across reports, presenting either as diffuse
  microscopic pulmonary AVMs with hypoxaemia or as paediatric pulmonary arterial
  hypertension. This entry is curated narrowly around what the GDF2 case reports
  and functional studies actually establish, and it does not import the
  ENG/ACVRL1 organ-lesion profile of the parent disease as though it had been
  demonstrated for HHT5.
category: Mendelian
disease_term:
  preferred_term: hereditary hemorrhagic telangiectasia type 5
  term:

- name: Pulmonary Arterial Vascular Remodeling
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A branch of the same ligand deficiency, reached by a different vascular
    response. Rather than shunting, the pulmonary arterioles narrow and occlude,

    of the reported homozygous GDF2 children took this route: one presented at
    age 3 with severe pulmonary arterial hypertension and a dilated right
    ventricle and no evidence of a pulmonary shunt. Why the same lesion produces
    shunting AVMs in one child and obliterative arteriopathy in another is
    unexplained and is recorded as a knowledge gap.

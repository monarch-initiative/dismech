animal_models:
- name: bmp9 mutant zebrafish
  species: Zebrafish
  genotype: bmp9 loss-of-function mutant
  publication: PMID:31828546
  description: >-
    Germline zebrafish bmp9 mutants survive to adulthood with no overt
    phenotype, while combined loss of the duplicate BMP10 paralogs is
    embryonic-lethal with cranial arteriovenous malformations indistinguishable
    from acvrl1 mutants. The model is informative for HHT5 precisely because it
    fails: it says that removing BMP9 alone, in an animal that retains BMP10, is
    tolerated, which is the most concrete available explanation for why
    heterozygous GDF2 carriers are so often unaffected and why biallelic
    carriers - who lose circulating BMP10 as well - are the ones who present in
    childhood.
  modeled_mechanisms:
  - target: Arteriovenous Malformation and Telangiectasia Formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete germline loss of bmp9 does not produce arteriovenous
      malformations in this organism.
    limitations: >-
      Zebrafish carry duplicate BMP10 paralogs (bmp10 and bmp10-like) that
      cover for bmp9 loss, so the negative result is a statement about ligand
      redundancy in this species rather than evidence that BMP9 is dispensable
      in humans. Human biallelic GDF2 patients lose circulating BMP10 as well as
      BMP9, a state this single-gene mutant does not model. Note also that this
      mutant result contradicts the earlier bmp9 morpholino knockdown reported
      in the founding HHT5 paper - see the hht5_zebrafish_morphant_mutant
      discussion.
    evidence:
    - reference: PMID:31828546
      reference_title: "BMP10-mediated ALK1 signaling is continuously required for vascular development and maintenance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        bmp9 mutants survive to adulthood with no overt phenotype. In
        contrast, combined loss of bmp10 and bmp10-like results in embryonic
        lethal cranial AVMs indistinguishable from acvrl1 mutants.
      explanation: >-
        States the negative result and the redundancy that explains it,
        which is the whole reason this model is recorded.
- name: bmp9 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: bmp9 morpholino knockdown
  publication: PMID:23972370
  description: >-
    The transient knockdown used in the founding HHT5 report, which the authors
    read as showing BMP9 involvement in angiogenesis. It is recorded here beside
    the germline mutant because the two disagree, and because a curator reading
    only the founding paper would take this as settled.
  modeled_mechanisms:
  - target: Loss of Endothelial Quiescence and Enhanced Angiogenic Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Transient bmp9 knockdown produced an angiogenic phenotype, supporting a
      role for BMP9 in angiogenesis but not reproducing the human vascular
      lesion.
    limitations: >-
      Morpholino knockdown is transient and prone to off-target effects, and its
      result was not reproduced by the later germline bmp9 mutant, which had no
      overt phenotype.
    evidence:
    - reference: PMID:23972370
      reference_title: "BMP9 mutations cause a vascular-anomaly syndrome with phenotypic overlap with hereditary hemorrhagic telangiectasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a bmp9-deficient zebrafish model demonstrated that BMP9 is involved
        in angiogenesis
      explanation: >-
        The founding report's model result, stated as the authors stated it.

diagnosis:
- name: Molecular genetic testing of GDF2
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    HHT5 is a molecularly defined entity, so molecular testing is not a
    confirmation of a clinical diagnosis but the diagnosis itself. In every
    published case the route was the same: a patient with an HHT-like or
    unexplained pulmonary vascular phenotype, negative for ACVRL1, ENG and
    SMAD4, in whom exome or whole-genome sequencing found a GDF2 variant. This
    ordering matters because most reported patients would not be diagnosed
    clinically - they do not meet the Curacao criteria, and GDF2 is absent from
    the gene list on which the GeneReviews HHT chapter bases molecular diagnosis
    of HHT.
  results: >-
    A pathogenic heterozygous or biallelic GDF2 variant in a patient with
    telangiectases, pulmonary AVMs or unexplained paediatric pulmonary arterial
    hypertension. Interpretation requires care: one founding allele
    (p.Arg333Trp) reaches 0.1% in controls and is no longer confidently
    pathogenic.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The molecular diagnosis is established by identification of a heterozygous
      pathogenic variant in ACVRL1, ENG, or SMAD4 by molecular genetic testing.
    explanation: >-
      The GeneReviews HHT chapter's gene list, which does not include GDF2 - the
      reason HHT5 cannot be reached through the standard HHT molecular pathway
      and must be sought by broader sequencing.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome sequencing and tiering protocols identified a novel,
      heterozygous GDF2 sequence variant in all three affected members of one
      HHT family who had previously screened negative for ACVRL1, ENG, and
      SMAD4.
    explanation: >-
      The diagnostic route in practice: gene-negative HHT, then broad sequencing.
  - reference: PMID:34611981
    reference_title: "Clinical manifestations of patients with GDF2 mutations associated with hereditary hemorrhagic telangiectasia type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other two patients harbored interstitial deletions larger than
      five megabases between 10q11.22 and 10q11.23 that included GDF2.
    explanation: >-
      Half of one reported cohort carried multi-megabase deletions, so a
      sequencing-only strategy would have missed them; CNV-aware testing is
      required.
- name: Plasma BMP9 measurement
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    An entity-specific functional assay with no counterpart in HHT1 or HHT2:
    because the lesion is loss of a circulating ligand, it can be measured
    directly in plasma by ELISA. Biallelic carriers have undetectable BMP9 and
    reduced BMP10; the heterozygous processing-defective family had
    significantly reduced but detectable levels. Serum-derived endothelial BMP
    activity, assayed on a BMP-responsive endothelial reporter line, tracks the
    same lesion functionally. Treat this as a research assay: it is not
    standardised, not a clinical test, and heterozygous carriers can have normal
    serum activity despite reduced ligand levels.
  results: >-
    Undetectable plasma BMP9 and low pBMP10 in homozygotes, with low
    serum-derived endothelial BMP activity; significantly reduced plasma BMP9 in
    the heterozygous family; reduced levels but normal serum activity in
    asymptomatic heterozygous parents.
  evidence:
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma samples were assayed for BMP9 and BMP10 by ELISA. In parallel, serum
      BMP activity was assayed using an endothelial BRE-luciferase reporter cell
      line (HMEC1-BRE).
    explanation: >-
      Describes the two assays this diagnosis entry refers to.
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected, there was no detectable circulating BMP9 in the homozygotes,
      while the heterozygotes had circulating levels below those of healthy
      controls, suggesting haplosufficiency.
    explanation: >-
      Gives the readings the assay returns by genotype, and the reason it
      separates biallelic carriers cleanly but heterozygous carriers only
      partially.
treatments:
- name: Sirolimus
  description: >-
    An mTOR inhibitor used for vascular anomalies, reported in a single
    homozygous GDF2 child with diffuse pulmonary AVMs that were untreatable by
    embolisation; his condition improved significantly after treatment was
    started at age 9. This is one anecdote, not an evidence base, and it is
    recorded because it is the only pharmacological intervention reported to
    have changed the course of the pulmonary lesion in this entity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: PI3K-Akt-mTOR and VEGFR2 Overactivation in Endothelium
    description: >-
      Sirolimus inhibits mTOR, one of the two arms shown to be overactivated
      downstream of lost BMP9/ALK1 signalling. In a BMP9/BMP10-immunoblockade
      model - the closest experimental analogue of the HHT5 lesion - mTOR
      inhibition combined with receptor tyrosine kinase inhibition blocked and
      reversed arteriovenous malformations. That is the mechanistic rationale
      for the single reported clinical response; it is a model result, not a
      demonstration in a GDF2 patient.
    evidence:
    - reference: PMID:31689244
      reference_title: "Correcting Smad1/5/8, mTOR, and VEGFR2 treats pathology in hereditary hemorrhagic telangiectasia models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HHT pathogenesis strongly relies on overactivated PI3K/Akt/mTOR and
        VEGFR2 pathways in endothelial cells (ECs)
      explanation: >-
        Identifies mTOR as an overactivated pathway downstream of the
        lesion, which is what makes sirolimus a mechanistically directed
        choice here rather than an empirical one.
  evidence:
  - reference: PMID:32669404
    reference_title: Homozygous GDF2-Related Hereditary Hemorrhagic Telangiectasia in a Chinese Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 9 years, he was treated with sirolimus, and his condition
      improved significantly.
    explanation: >-
      The single reported treatment response in GDF2-related disease.
- name: Pulmonary Vasodilator Therapy for GDF2-Related Pulmonary Arterial Hypertension
  description: >-
    Standard PAH pharmacotherapy, reported to work in the GDF2 homozygous PAH
    children. The index case received inhaled nitric oxide and intravenous
    epoprostenol acutely, then sildenafil, bosentan and subcutaneous treprostinil,
    and was asymptomatic two years later; repeat right heart catheterisation
    after three months of therapy showed his pulmonary pressures had fallen from
    systolic estimates above 100 mmHg to a mean of 30 mmHg. Nothing about this
    regimen is GDF2-specific.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sildenafil
      term:
        id: CHEBI:9139
        label: sildenafil
    - preferred_term: bosentan
      term:
        id: CHEBI:51450
        label: bosentan
    - preferred_term: treprostinil
      term:
        id: CHEBI:50861
        label: treprostinil
  target_mechanisms:
  - target: Pulmonary Arterial Vascular Remodeling
    description: >-
      Pulmonary vasodilators reduce pulmonary vascular resistance and right
      ventricular afterload; they do not address the underlying BMP9 deficiency.
  evidence:
  - reference: PMID:26801773
    reference_title: "Novel homozygous BMP9 nonsense mutation causes pulmonary arterial hypertension: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Now, two years later, the child is asymptomatic on sildenafil, bosentan,
      subcutaneous treprostinil, and warfarin.
    explanation: >-
      Documents the regimen and the clinical response in the index GDF2 PAH case.
- name: Embolisation of Pulmonary Arteriovenous Malformations
  description: >-
    The standard HHT intervention, and the one that repeatedly fails in HHT5.
    Because the pulmonary lesions in this entity tend to be numerous, tiny and
    diffuse rather than discrete lesions with a feeding vessel of 2-3 mm or more,
    two independent reports found them unsuitable for percutaneous closure. This
    treatment is curated here as a documented negative - a case where the parent
    disease's management pathway does not transfer.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Embolization Therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_phenotypes:
  - preferred_term: Pulmonary arteriovenous malformation
    term:
      id: HP:0006548
      label: Pulmonary arteriovenous malformation
  evidence:
  - reference: PMID:33834622
    reference_title: Homozygous GDF2 nonsense mutations result in a loss of circulating BMP9 and BMP10 and are associated with either PAH or an "HHT-like" syndrome in children.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PAVMs were too small to be considered for percutaneous closure.
    explanation: >-
      Refutes the applicability of embolisation to this patient's lesions; graded
      REFUTE because the claim under test is that embolisation treats the
      pulmonary AVMs of this entity.
  - reference: PMID:34904380
    reference_title: Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had presented at the age of 8 years with cyanosis, and was diagnosed
      with multiple PAVMs that were too diffuse for treatment.
    explanation: >-
      A second independent case in which the diffuse lesion distribution ruled
      out the standard intervention.
- name: Genetic Counseling
  description: >-
    Complicated in this entity by the unsettled inheritance mode. A family with
    a heterozygous processing-defective allele should be counselled as autosomal
    dominant with incomplete, age-dependent penetrance; a consanguineous family
    with a truncating allele should be counselled as autosomal recessive, since
    the heterozygous parents in every reported biallelic family were
    unaffected. A homozygous sibling who is currently asymptomatic does not
    exclude later disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32669404
    reference_title: Homozygous GDF2-Related Hereditary Hemorrhagic Telangiectasia in a Chinese Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, his now 7-year-old sister with the same homozygous variant
      currently has no symptoms.
    explanation: >-
      The within-family variability that a counselling discussion has to convey.
  - reference: PMID:32669404
    reference_title: Homozygous GDF2-Related Hereditary Hemorrhagic Telangiectasia in a Chinese Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our report, we also confirm variable expressivity, even with the same
      pathogenic variant in GDF2-related HHT.
    explanation: >-
      The authors' own statement of variable expressivity within one genotype.
discussions:
- discussion_id: hht5_is_it_hht
  prompt: >-
    Is GDF2-related disease a type of hereditary hemorrhagic telangiectasia, or
    a distinct HHT-like vascular anomaly syndrome that the numbered series has
    absorbed by analogy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Hereditary Hemorrhagic Telangiectasia Type 5
  - pathophysiology#Arteriovenous Malformation and Telangiectasia Formation
  - phenotypes#Cutaneous Telangiectasia
  rationale: >-
    OMIM and MONDO both carry this entity as HHT type 5, and it sits in this
    knowledge base as a member of the HHT series. The primary literature is much
    less settled. The founding report named it a vascular-anomaly syndrome with
    phenotypic overlap with HHT and observed that the dermal lesions looked like
    those of RASA1-related capillary malformation-AVM syndrome rather than HHT
    telangiectases. The largest phenotyping study concluded that no reported
    patient met the Curacao criteria and that the entity seems distinct from HHT
    in the location and appearance of the telangiectases and in a tendency to
    tiny diffuse pulmonary AVMs. Against that, one family with a heterozygous
    GDF2 variant had nosebleeds, telangiectasia its authors called typical of
    HHT, and severe pulmonary AVMs, and its authors proposed GDF2 as a rare
    cause of HHT. The GeneReviews HHT chapter, updated in 2026, still restricts
    molecular diagnosis of HHT to ACVRL1, ENG and SMAD4. The question is not
    cosmetic: it determines whether HHT screening and surveillance protocols -
    brain MRI, hepatic imaging, five-yearly pulmonary shunt screening - should
    be applied to GDF2 carriers, and the diffuse untreatable pulmonary lesions
    reported here suggest the pulmonary protocol at least does not transfer
    cleanly.
  evidence:
  - reference: PMID:34904380
    reference_title: "Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, none of the patients previously reported with GDF2
      variants met Curaçao criteria
    explanation: >-
      The published statement of the gap: no reported GDF2 patient satisfied
      the clinical definition of HHT.
  proposed_experiments:
  - experiment_id: hht5_systematic_phenotyping_cohort
    name: Protocol-driven HHT phenotyping of an assembled GDF2 variant cohort
    description: >-
      Assemble the reported GDF2 families and any newly ascertained ones and
      apply the full HHT diagnostic and screening protocol uniformly: Curacao
      criterion scoring by an HHT centre, contrast echocardiography and chest CT
      for pulmonary shunting, brain MRI, hepatic Doppler, and standardised
      photographic documentation of telangiectasis site and morphology.
      Ascertainment so far has been by case report, so the apparent
      distinctiveness of the lesion distribution may be an artefact of who was
      looked at and how.
    decision_criterion: >-
      A cohort in which a substantial fraction meet the Curacao criteria and
      show the HHT organ-lesion distribution would support keeping GDF2 inside
      HHT; one that reproduces the atypical cutaneous distribution and the
      absence of hepatic and cerebral AVMs would support a separate entity.
    would_support:
    - phenotypes#Cutaneous Telangiectasia
    supporting_outcome:
    - >-
        A majority of GDF2 carriers score three or more Curacao criteria, with
        lip, oral and fingerpad telangiectases and visceral AVMs in the HHT
        distribution.
    refuting_outcome:
    - >-
        GDF2 carriers consistently show cheek and chin spider-like lesions,
        sparing lips and oral cavity, with pulmonary lesions but no hepatic or
        cerebral AVMs.
- discussion_id: hht5_inheritance_mode
  prompt: >-
    Is HHT5 autosomal dominant, autosomal recessive, or semi-dominant with the
    mode depending on the allele's functional class?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#GDF2
  - inheritance#Autosomal dominant inheritance
  - inheritance#Autosomal recessive inheritance
  rationale: >-
    OMIM catalogues HHT5 as dominant, on the strength of the founding
    heterozygous probands and one segregating family. But the biallelic case
    base is now at least as large, and its heterozygous parents were repeatedly
    examined and found unaffected. The functional data cut the same way: in the
    p.Glu279Ter family, heterozygotes had reduced circulating BMP9 and BMP10 yet
    normal serum endothelial BMP activity, which the authors read as
    haplosufficiency. A coherent reading is that truncating alleles are
    recessive because one wild-type allele supplies enough ligand, while
    processing-defective missense alleles such as p.Cys428Arg may act
    dominantly - but no study has tested that allele-class hypothesis directly,
    and the retraction in confidence for p.Arg333Trp removes one of the three
    original dominant data points. Getting this wrong has direct consequences
    for recurrence-risk counselling.
  evidence:
  - reference: PMID:34904380
    reference_title: "Identification and validation of a novel pathogenic variant in GDF2 (BMP9) responsible for hereditary hemorrhagic telangiectasia and pulmonary arteriovenous malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, all of the heterozygous parents and one homozygous sibling
      had few or no HHT features.
    explanation: >-
      The observation that makes the dominant assignment doubtful and keeps
      this question open.
  proposed_experiments:
  - experiment_id: hht5_allele_class_dose_response
    name: Allele-class-stratified BMP9 dose-response in carriers
    description: >-
      Measure plasma BMP9, plasma pBMP10 and serum-derived endothelial BMP
      activity in heterozygous carriers stratified by allele class (truncating
      versus processing-defective missense), alongside biallelic carriers and
      matched controls, and relate each to protocol-based clinical phenotyping.
    decision_criterion: >-
      If heterozygous missense carriers show reduced serum endothelial BMP
      activity while heterozygous truncating carriers do not, the allele-class
      model is supported and the two inheritance blocks in this entry describe
      genuinely different genetic mechanisms rather than a single unresolved one.
    would_support:
    - inheritance#Autosomal recessive inheritance
    supporting_outcome:
    - >-
        Serum endothelial BMP activity is normal in heterozygous truncating
        carriers and reduced in heterozygous missense carriers, tracking their
        clinical status.
    refuting_outcome:
    - >-
        Serum BMP activity is normal in both heterozygous groups, or reduced in
        both, with no relationship to clinical phenotype.
- discussion_id: hht5_avm_versus_pah_branch
  prompt: >-
    Why does the same loss of circulating BMP9 produce shunting pulmonary
    arteriovenous malformations in some children and obliterative pulmonary
    arterial hypertension in others?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pulmonary Arterial Vascular Remodeling
  - pathophysiology#Arteriovenous Malformation and Telangiectasia Formation
  - phenotypes#Pulmonary Arterial Hypertension
  rationale: >-
    The two pulmonary outcomes are opposite vascular behaviours - abnormal
    dilated low-resistance connections in one, narrowing and occlusion with
    raised resistance in the other - and both follow biallelic GDF2 nonsense
    alleles. They are not sequential: the index PAH child had no AVMs and a
    negative bubble study, and the child with multiple small PAVMs had a mean
    pulmonary artery pressure of 10 mmHg. Nor is the split explained by allele
    position, since both are nonsense alleles in the same gene producing the
    same undetectable circulating BMP9. Candidate explanations include modifier
    genotype, differences in residual BMP10 signalling, and a second-hit or
    flow-dependent local trigger, but none has been tested in GDF2 disease. This
    is the entity's sharpest mechanistic question because it is the one point
    where an identical molecular lesion demonstrably produces divergent
    pathology.
  evidence:
  - reference: PMID:37422716
    reference_title: "Defining the clinical validity of genes reported to cause pulmonary arterial hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of homozygous GDF2 pLOF variants in three children with
      severe PAH raises the possibility of semi-dominant inheritance
    explanation: >-
      Records that the same biallelic GDF2 genotypes appear in the PAH
      literature, which is the branch split this gap is about.
  proposed_experiments:
  - experiment_id: hht5_genotype_modifier_search
    name: Modifier and residual-signalling analysis across the GDF2 branch split
    description: >-
      In an assembled GDF2 cohort split by pulmonary outcome, compare residual
      circulating BMP10 and serum endothelial BMP activity, and sequence the
      wider ALK1/endoglin/BMPR2 pathway for co-occurring variants, testing
      whether the AVM and PAH branches separate on any of these.
    decision_criterion: >-
      A systematic difference in residual BMP10 or in pathway co-variants
      between the two branches would identify the modifier axis; no difference
      would point instead to stochastic or local flow-dependent determination.
    would_support:
    - pathophysiology#Pulmonary Arterial Vascular Remodeling
    supporting_outcome:
    - >-
        PAH-branch patients show lower residual BMP10 or carry additional
        BMPR2-pathway variants relative to AVM-branch patients.
    refuting_outcome:
    - >-
        Residual BMP10 and pathway co-variant burden are indistinguishable between
        the two branches.
- discussion_id: hht5_bmp9_replacement
  prompt: >-
    Would BMP9 or BMP9/BMP10 ligand replacement correct the vascular phenotype
    in GDF2-deficient patients, as the ligand-deficiency mechanism predicts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Circulating BMP9 and BMP10
  - treatments#
  rationale: >-
    HHT5 is the only member of the HHT series in which the missing molecule is a
    circulating ligand rather than a cell-surface receptor or an intracellular
    effector. That makes it the one member for which straightforward replacement
    is even conceptually available, and the plasma assay gives a direct
    pharmacodynamic readout. Nothing of the kind has been attempted: the
    treatments recorded in this entry are an mTOR inhibitor in one child and
    conventional PAH vasodilators, neither of which addresses the ligand
    deficiency. The gap is worth recording precisely because the mechanism is so
    unusually tractable relative to the rest of the series.
  evidence:
  - reference: PMID:25620979
    reference_title: "Emerging roles of BMP9 and BMP10 in hereditary hemorrhagic telangiectasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review will focus on the emerging role played by BMP9 and BMP10
      in the development of this disease and the therapeutic approaches that
      this opens.
    explanation: >-
      Establishes that ligand-directed therapy is the therapeutic avenue
      this mechanism opens, which is what makes its untested status a
      recordable gap.
  proposed_experiments:
  - experiment_id: hht5_ligand_replacement_preclinical
    name: Ligand replacement in a BMP9-deficient model with plasma pharmacodynamics
    description: >-
      In a Gdf2-null model, administer recombinant BMP9 or BMP9/BMP10 and follow
      both the vascular phenotype and the serum endothelial BMP activity readout
      used in patients, establishing whether restoring circulating ligand
      reverses or prevents the vascular lesion and what plasma level is needed.
    decision_criterion: >-
      Reversal or prevention of the vascular phenotype at achievable plasma
      levels would justify a first-in-human study in biallelic GDF2 patients,
      who have no circulating ligand at all and are therefore the cleanest
      possible test population.
    would_support:
    - pathophysiology#Loss of Circulating BMP9 and BMP10
    supporting_outcome:
    - >-
        Vascular lesions regress or fail to form, with serum endothelial BMP
        activity restored toward the control range.
    refuting_outcome:
    - >-
        Restored circulating ligand normalises the serum activity readout without
        changing the vascular phenotype.
- discussion_id: hht5_zebrafish_morphant_mutant
  prompt: >-
    Does loss of BMP9 alone cause a vascular phenotype in zebrafish, given that
    morpholino knockdown and germline mutation of bmp9 gave opposite answers?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  - pathophysiology#Loss of Endothelial Quiescence and Enhanced Angiogenic Response
  rationale: >-
    The founding HHT5 paper supported its mechanism with a bmp9-deficient
    zebrafish showing that BMP9 is involved in angiogenesis; that was a
    morpholino knockdown. A later study generating germline bmp9 mutants found
    they survive to adulthood with no overt phenotype, and that the vascular
    phenotype requires losing the duplicate BMP10 paralogs instead. The two
    results are not reconcilable as stated, and the direction of the discrepancy
    matters: the morphant is the one that supports the human mechanism, and it
    is the less reliable of the two designs. This is recorded as a
    HUMAN_MODEL_MISMATCH rather than a knowledge gap because the evidence exists
    in the model and it is the translational reading that is in doubt - and
    because the redundancy the mutant reveals may be the correct answer for
    humans too, explaining why heterozygous GDF2 carriers are so often
    unaffected while biallelic carriers, who lose circulating BMP10 as well, are
    the ones who present.
  evidence:
  - reference: PMID:31828546
    reference_title: "BMP10-mediated ALK1 signaling is continuously required for vascular development and maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      bmp9 mutants survive to adulthood with no overt phenotype. In
      contrast, combined loss of bmp10 and bmp10-like results in embryonic
      lethal cranial AVMs indistinguishable from acvrl1 mutants.
    explanation: >-
      The germline result that contradicts the founding paper's morphant,
      and the redundancy that would explain it.
  proposed_experiments:
  - experiment_id: hht5_bmp10_reserve_in_carriers
    name: Residual BMP10 as a penetrance modifier in human GDF2 carriers
    description: >-
      Measure circulating BMP10 alongside BMP9 and serum endothelial BMP
      activity in clinically affected and clinically unaffected human GDF2
      carriers, and test whether BMP10 reserve separates them. The zebrafish
      redundancy model predicts that it should.
    decision_criterion: >-
      If unaffected heterozygous carriers have preserved circulating BMP10 while
      affected carriers do not, the redundancy explanation transfers to humans
      and the mutant, not the morphant, is the informative model.
    would_support:
    - pathophysiology#Loss of Circulating BMP9 and BMP10
    supporting_outcome:
    - >-
      Circulating BMP10 is preserved in clinically unaffected GDF2 carriers and
      reduced in affected ones, independent of BMP9 level.
    refuting_outcome:
    - >-
      Circulating BMP10 does not differ between affected and unaffected GDF2
      carriers.

notes: >-
  Scope and guardrails for anyone extending this entry.

  Do not import the parent disease's organ-lesion profile wholesale, but do not
  assume it is wholly absent either. Hepatic AVMs, gastrointestinal
  telangiectasia and iron-deficiency anaemia are well documented in ENG- and
  ACVRL1-related HHT and have not been reported in a GDF2 patient; in the one
  child in whom they were actively sought, brain MRI and hepatic ultrasound
  showed no AVMs. Cerebral involvement is the exception and was for a time
  believed absent here too: a four-proband cohort documented cerebrovascular
  involvement in GDF2 disease for the first time, and that entry is curated as a
  phenotype. It is recorded at the resolution the source supports - the report
  says cerebrovascular involvement without naming the lesion, and two of those
  four probands carried multi-megabase 10q11 deletions, so the finding is not
  cleanly attributable to BMP9 loss alone. What is still absent from the
  literature is what should stay absent from this entry.

  Frequencies are not inherited from the parent disease. HHT-wide figures - over
  90% epistaxis, roughly 50% iron-deficiency anaemia, a 1-in-5,000 prevalence -
  are properties of a population dominated by ENG and ACVRL1 carriers and say
  nothing about an entity with about nine published probands. A secondary source
  that offers them as the framework for HHT5 is extrapolating, and this entry
  does not follow it.

  Do not treat HHT5 and HHT-with-PAH as the same claim. GDF2 has a definitive
  gene-disease relationship with heritable and idiopathic pulmonary arterial
  hypertension, established in large cohorts and independent of the HHT
  question; the HHT5 assignment rests on a much smaller and contested case
  base. A paper about GDF2 in PAH is not automatically evidence about HHT5, and
  conflating them would let a well-powered PAH literature silently vouch for a
  thinly supported HHT entity.

  Named-entity guardrails. GDF2 is at 10q11 and is the HHT5 gene; ENG (9q34) is
  HHT1, ACVRL1 (12q13) is HHT2, the HHT3 locus is on chromosome 5, the HHT4
  locus is at 7p14, and SMAD4 (18q21) gives the juvenile polyposis/HHT overlap.
  BMP9 is the protein product of GDF2 and the two names are used
  interchangeably in this literature - the founding paper is titled for BMP9 and
  the gene symbol is GDF2. BMP10 is a different gene and a different ligand; it
  appears in this entry only because its circulating level falls secondarily
  when BMP9 does.

  Evidence-base caveat. Every clinical claim here derives from case reports and
  small family studies. Frequencies are qualitative bands describing which
  reported patients had a feature, not population estimates, and no frequency in
  this entry should be quoted as a prevalence.

  No datasets. A GEO discovery sweep for this entry was run and returned only
  HHT datasets built on the other genes - ALK1/ACVRL1, ENG and SMAD4 knockouts,
  an HHT-on-a-chip platform, shear-stress work in SMAD4. Not one is about GDF2
  or BMP9. Attaching them would be Named Entity Confusion reached through
  dataset search: they resolve perfectly, they are genuinely about hereditary
  haemorrhagic telangiectasia, and they are about a different gene and a
  different molecular lesion than this entry describes. `datasets:` is therefore
  deliberately absent rather than unfinished; add a record here only for data
  generated on GDF2 or BMP9 material.

  Deep research. A falcon (Edison) run was requested for this curation and could
  not authenticate against the provider (HTTP 403); the run was re-issued with
  the recorded `--fallback`, and an openscientist report was produced and
  committed instead, carrying `fell_back: true` and the provider attempts in its
  frontmatter. Anchor references were selected from PubMed independently of that
  report and read in full where full text was cached; the report then
  contributed the four-proband cohort, the 10q11 deletion allele class, the
  BMP10-redundancy zebrafish result and the PI3K/mTOR-VEGFR2 arm, which this
  entry would otherwise have missed.

  None of the report's ontology suggestions were used. Its own term-validation
  section flags why: it proposed MONDO:0014660 for this disease, which is
  autosomal recessive primary microcephaly 15, and HP:0006775 for pulmonary
  arteriovenous malformation, which is multiple myeloma. It also offered
  NCIT:C15325 for therapeutic embolization, which is skin transplantation. Every
  term bound in this entry was resolved independently with OAK.

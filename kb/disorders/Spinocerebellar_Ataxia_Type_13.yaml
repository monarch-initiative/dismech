- name: Binaural Auditory Brainstem Timing Deficit
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Kv3.3 is abundant in the binaural auditory brainstem nuclei that compare
    sound timing and level between the ears. R420H carriers have normal
    pure-tone hearing but profoundly reduced sensitivity to interaural time
    and level differences, which is expected to impair sound localisation, and
    the deficit is present before ataxia begins. No HPO term for impaired
    sound localisation was found, so no phenotype is recorded for it.
  evidence:
  - reference: PMID:24116147
    reference_title: "Mutation in the kv3.3 voltage-gated potassium channel causing spinocerebellar ataxia 13 disrupts sound-localization mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate psychophysically that individuals with the mutant allele exhibit profound deficits in both ITD and ILD sensitivity, despite showing no obvious impairment in pure-tone sensitivity with either ear."
    explanation: Binaural cue sensitivity is lost with normal hearing thresholds.
  - reference: PMID:24116147
    reference_title: "Mutation in the kv3.3 voltage-gated potassium channel causing spinocerebellar ataxia 13 disrupts sound-localization mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, several individuals exhibited the auditory deficits even though they were pre-symptomatic for SCA13."
    explanation: The auditory deficit can precede ataxia.

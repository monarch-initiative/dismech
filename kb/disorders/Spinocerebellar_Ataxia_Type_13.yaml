- name: Purkinje Cell Excitability Dysfunction
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Purkinje cells carrying mutant Kv3.3 fire abnormally, in an
    allele-specific direction. In zebrafish an infant-onset allele sharply and
    transiently raises Purkinje cell excitability during cerebellar
    development, whereas the adult-onset allele leaves tonic firing intact and
    reduces firing only during evoked high-frequency spiking. Cultured mouse
    Purkinje cells expressing the R424H equivalent of R423H have less outward
    current and broader action potentials, and Purkinje cells of an R424H BAC
    transgenic mouse fire spontaneously at a lower rate.
  cell_types:

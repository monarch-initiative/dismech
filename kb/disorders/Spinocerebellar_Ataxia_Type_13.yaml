pathophysiology:
- name: Heterozygous KCNC3 Missense Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    One KCNC3 allele carries a missense or small in-frame change. The
    recurrent alleles sit in the voltage-sensing S4 segment (R420H, R423H) or
    the S5 segment (F448L); later reports added C-terminal variants such as the
    p.Pro583_Pro585del proline deletion. The variant's position predicts the
    clinical form: R420H gives adult-onset degeneration, R423H and F448L give
    infant-onset neurodevelopmental disease.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Usually inherited; rare cases are de novo. R420H and R423H act as
      dominant negatives on the wild-type subunit, while F448L and the
      C-terminal deletions alter gating, so no single functional category
      covers the allelic series and none is recorded.

name: Spinocerebellar Ataxia Type 13
creation_date: "2026-10-30T00:00:00Z"
category: Mendelian
synonyms:
- SCA13
- spinocerebellar ataxia 13
- KCNC3-related spinocerebellar ataxia
description: >-
  Spinocerebellar ataxia type 13 (SCA13) is an autosomal dominant cerebellar
  disorder caused by heterozygous missense and small in-frame variants in
  KCNC3, which encodes Kv3.3, a Shaw-type voltage-gated potassium channel
  subunit that lets Purkinje cells and auditory brainstem neurons fire at high
  rates. The variant decides whether the disease is developmental or
  degenerative. Infant-onset alleles (R423H, F448L) give cerebellar hypoplasia
  with delayed motor milestones, mild to moderate intellectual disability and
  sometimes seizures; the hypoplasia does not progress and motor and cognitive
  skills improve. Adult-onset alleles (R420H, and C-terminal changes such as
  p.Pro583_Pro585del) give a slowly progressive, mostly pure cerebellar ataxia
  with dysarthria and cerebellar atrophy, sometimes with spasticity. R420H and
  R423H produce non-conducting subunits that are retained inside the cell and
  suppress the wild-type current by a dominant negative effect; infant-onset
  alleles also alter channel gating. In zebrafish and mouse models the
  infant-onset allele raises Purkinje cell excitability and kills developing
  Purkinje cells, while the adult-onset allele reduces high-frequency firing
  without developmental loss. Kv3.3 is also needed in the auditory brainstem,
  and R420H carriers cannot use interaural timing or level cues. SCA13
  accounts for under 1% of ataxia index cases. Treatment is supportive; Kv3.3
  antisense knockdown rescues motor behaviour in a mouse model.

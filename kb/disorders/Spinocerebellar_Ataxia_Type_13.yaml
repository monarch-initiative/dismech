    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult-onset and slowly progressive cerebellar ataxia are the main clinical features of SCA13 and SCA19 caused by potassium channel mutations, which was similar in our cases."

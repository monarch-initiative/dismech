- name: Dominant Negative Suppression of Kv3.3 Current
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    R420H and R423H subunits do not conduct and co-assemble with wild-type
    subunits, reducing the Kv3 current. In mammalian cells both are
    under-glycosylated, short-lived and retained in intracellular
    compartments (R420H in the Golgi), so little channel reaches the plasma
    membrane.

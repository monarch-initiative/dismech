    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "an adult-onset mutation did not significantly alter basal tonic firing in Purkinje cells, but reduced excitability during evoked high frequency spiking."
    explanation: Adult-onset allele effect on Purkinje firing in zebrafish.

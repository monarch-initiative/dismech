- name: Tbk1 Overactivation and Hax-1 Loss
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Kv3.3 binds the cell-survival protein Hax-1. In mice homozygous for the
    G592R allele, Tbk1 is overactivated in the cerebellum and Hax-1 is routed
    to multivesicular bodies and lysosomes and degraded. Knocking Kv3.3 down
    with an antisense oligonucleotide reverses these changes and the rotarod
    deficit. The finding comes from a single homozygous mouse model.
  genes:
  - preferred_term: KCNC3
    term:
      id: hgnc:6235
      label: KCNC3
  evidence:
  - reference: PMID:34820911
    reference_title: "Suppression of Kv3.3 channels by antisense oligonucleotides reverses biochemical effects and motor impairment in spinocerebellar ataxia type 13 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A disease-causing mutation, Kv3.3-G592R, causes overstimulation of Tank Binding Kinase 1 (Tbk1) in the cerebellum, resulting in the degradation of Hax-1 by promoting its trafficking into multivesicular bodies and then to lysosomes."
    explanation: Describes the pathway in the G592R mouse.
  - reference: PMID:34820911
    reference_title: "Suppression of Kv3.3 channels by antisense oligonucleotides reverses biochemical effects and motor impairment in spinocerebellar ataxia type 13 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in mice homozygous for the Kv3.3-G592R-encoding mutation, the same ASO reduced Tbk1 activation and levels of Cd63, while restoring the expression of Hax-1 in the cerebellum."
    explanation: Reversal of the biochemical changes by Kv3.3 knockdown.
  downstream:
  - target: Loss of Cerebellar Cortical Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

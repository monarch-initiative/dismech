animal_models:
- name: Kcnc3 R424H BAC transgenic mouse
  species: Mouse
  genotype: BAC transgenic expressing full-length mouse Kcnc3 with R424H (equivalent to human R423H)
  description: >-
    Early-onset aberrant gait, tremor, cerebellar atrophy, progressive
    Purkinje cell loss and reduced Purkinje cell spontaneous firing.
  publication: PMID:40128944
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces Purkinje cell loss, cerebellar atrophy and ataxic gait.
    limitations: >-
      Expression from a BAC transgene on top of two wild-type alleles, not a
      knock-in, so the mutant-to-wild-type subunit ratio differs from
      patients; and R423H causes non-progressive hypoplasia in patients while
      the mouse shows progressive loss.
    evidence:
    - reference: PMID:40128944
      reference_title: "A novel early onset spinocerebellar ataxia 13 BAC mouse model with cerebellar atrophy, tremor, and ataxic gait."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our SCA13 transgenic mice recapitulate both neuropathological and behavioral changes manifested in human SCA13 R423H patients"
      explanation: Authors' assessment of model fidelity.
- name: Kcnc3 G592R mouse
  species: Mouse
  genotype: Kcnc3 G592R homozygous
  description: >-
    Homozygous mice have Tbk1 overactivation, Hax-1 loss and a rotarod
    deficit that are reversed by intracerebroventricular Kcnc3 antisense
    oligonucleotide.
  publication: PMID:34820911
  modeled_mechanisms:
  - target: Tbk1 Overactivation and Hax-1 Loss
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: The model in which the Tbk1/Hax-1 pathway was described.
    limitations: >-
      Homozygous for the variant, whereas patients are heterozygous, and the
      pathway has not been examined in patient tissue.
    evidence:
    - reference: PMID:34820911
      reference_title: "Suppression of Kv3.3 channels by antisense oligonucleotides reverses biochemical effects and motor impairment in spinocerebellar ataxia type 13 mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in mice homozygous for the Kv3.3-G592R-encoding mutation, the same ASO reduced Tbk1 activation and levels of Cd63, while restoring the expression of Hax-1 in the cerebellum."
      explanation: Biochemical pathway and its reversal in this model.
- name: Zebrafish Purkinje-cell-specific SCA13 R420H model
  species: Zebrafish
  genotype: Purkinje-cell-specific transgene expressing a zebrafish Kcnc3 variant mimicking human R420H
  description: >-
    Cell-autonomous progressive Purkinje cell degeneration with
    cerebellum-driven eye-movement deficits.
  publication: PMID:30862666
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Progressive, cell-autonomous Purkinje degeneration with the adult-onset allele.
    limitations: >-
      Transgenic overexpression in a non-mammalian cerebellum; R420H carriers
      have no cerebellar oculomotor disturbance, unlike the eye-movement
      deficit seen in the fish.
    evidence:
    - reference: PMID:30862666
      reference_title: "Modeling Neurodegenerative Spinocerebellar Ataxia Type 13 in Zebrafish Using a Purkinje Neuron Specific Tunable Coexpression System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We modeled a SCA13 zebrafish accessible for bioimaging to investigate disease progression, revealing robust PC degeneration, resulting in impaired eye movement."
      explanation: Purkinje cell degeneration in the fish model.
- name: Zebrafish infant- and adult-onset SCA13 alleles
  species: Zebrafish
  genotype: Expression of infant-onset and adult-onset Kv3.3 mutant subunits in developing Purkinje cells
  description: >-
    Allele-specific Purkinje cell excitability, maturation and survival during
    cerebellar development.
  publication: PMID:32644043
  modeled_mechanisms:
  - target: Impaired Purkinje Cell Dendritic Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Infant-onset allele stunts dendrites and kills developing Purkinje cells.
    limitations: >-
      Larval zebrafish cerebellum; the link to human cerebellar hypoplasia is
      by inference.
    evidence:
    - reference: PMID:32644043
      reference_title: "Infant and adult SCA13 mutations differentially affect Purkinje cell excitability, maturation, and viability in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results suggest that differential changes in the excitability of cerebellar neurons contribute to the distinct ages of onset and timing of cerebellar degeneration in infant- and adult-onset SCA13."
      explanation: The model separates the developmental and degenerative forms.

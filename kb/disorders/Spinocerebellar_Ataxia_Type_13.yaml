- name: Altered Kv3.3 Channel Gating
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Channels containing F448L or R423H subunits together with wild-type
    subunits activate at more negative voltages and close more slowly. R420H
    reduces current without changing the gating of mixed channels, and it
    does not cause infant-onset disease, so altered gating is proposed to be
    what makes an allele developmental. C-terminal proline deletions traffic
    normally but inactivate more slowly.
  genes:
  - preferred_term: KCNC3
    term:
      id: hgnc:6235
      label: KCNC3

- name: Impaired Purkinje Cell Dendritic Development
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    With infant-onset alleles, developing Purkinje cells extend fewer and
    shorter dendrites, form fewer synapses and die early. This is the proposed
    cellular basis of the congenital, non-progressive cerebellar hypoplasia
    seen with R423H. The adult-onset allele does not disturb Purkinje cell
    maturation.

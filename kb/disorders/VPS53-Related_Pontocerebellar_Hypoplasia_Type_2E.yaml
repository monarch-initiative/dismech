    modifier: DECREASED
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
  - preferred_term: Golgi vesicle transport
    modifier: ABNORMAL
    term:
      id: GO:0048193
      label: Golgi vesicle transport
  locations:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:24577744
    reference_title: "VPS53 mutations cause progressive cerebello-cerebral atrophy type 2 (PCCA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive PCCA type 2 is caused by VPS53 mutations."
    explanation: >-
      The discovery report establishes VPS53 as the causal disease gene.
  - reference: PMID:24577744
    reference_title: "VPS53 mutations cause progressive cerebello-cerebral atrophy type 2 (PCCA2)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Golgi-associated retrograde protein (GARP) complex is involved in the
      retrograde pathway recycling endocytic vesicles to Golgi
    explanation: >-
      This defines the primary vesicular-trafficking process disrupted by VPS53
      disease.
  downstream:
  - target: Abnormal endosomal vesicular bodies
    causal_link_type: DIRECT
    description: >-
      GARP dysfunction produces abnormal endosomal or vesicular-body morphology
      in patient fibroblasts.
    evidence:
    - reference: PMID:24577744
      reference_title: "VPS53 mutations cause progressive cerebello-cerebral atrophy type 2 (PCCA2)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Immunofluorescent microscopy demonstrated swollen and abnormally
        numerous CD63 positive vesicular bodies, likely intermediate
        recycling/late endosomes, in fibroblasts of affected individuals.
      explanation: >-
        Patient fibroblast microscopy directly supports abnormal endosomal
        vesicular bodies.
  - target: Sphingolipid and lysosomal homeostasis disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired GARP-mediated endosome-to-Golgi retrograde recycling
    description: >-
      Experimental GARP deficiency disrupts sphingolipid balance and lysosomal
      function; patient fibroblasts reproduce the lipid abnormalities.
    evidence:
    - reference: PMID:26357016
      reference_title: "The GARP complex is required for cellular sphingolipid homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GARP deficiency leads to accumulation of sphingolipid synthesis
        intermediates, changes in sterol distribution, and lysosomal dysfunction.
      explanation: >-
        GARP loss experimentally produces the lipid and lysosomal branch.
    - reference: PMID:26357016
      reference_title: "The GARP complex is required for cellular sphingolipid homeostasis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PCCA2 fibroblasts exhibited increases in sphingosine, sphinganine, and
        ceramides compared with control fibroblasts.
      explanation: >-
        Affected-person fibroblasts reproduce the sphingolipid abnormality.
  - target: GARP-dependent Golgi enzyme mislocalization and glycosylation defects
    causal_link_type: DIRECT
    description: >-
      VPS53 knockout disrupts Golgi-enzyme retention and N- and O-glycan
      processing in human cells.
    evidence:
    - reference: PMID:34161137
      reference_title: "The Golgi-associated retrograde protein (GARP) complex plays an essential role in the maintenance of the Golgi glycosylation machinery."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        KO of VPS53 or VPS54 in RPE1 cells caused N- and O-glycosylation defects
        in plasma membrane, intracellular, and secreted glycoproteins.
      explanation: >-
        VPS53 knockout directly supports this GARP-dependent cellular branch.
  - target: Progressive cerebello-cerebral atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Biallelic VPS53 variants cause PCCA2, but the intervening route from GARP
      trafficking dysfunction to progressive brain atrophy is not established.
    evidence:
    - reference: PMID:24577744
      reference_title: "VPS53 mutations cause progressive cerebello-cerebral atrophy type 2 (PCCA2)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Autosomal recessive PCCA type 2 is caused by VPS53 mutations."
      explanation: Establishes the causal gene-to-PCCA2 relation while leaving intermediates unknown.

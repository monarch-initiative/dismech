pathophysiology:
- name: VPS53 GARP-complex retrograde-trafficking defect
  biological_scale: CELLULAR
  description: >-
    Biallelic VPS53 variants disrupt the GARP complex, impairing retrograde
    recycling of endocytic vesicles to the Golgi.
  genes:

review_notes: >-
  The 2026 review separates demonstrated cellular mechanisms from clinical
  association. The pathograph retains three evidence-backed branches from
  VPS53/GARP trafficking dysfunction: abnormal patient-fibroblast endosomes,
  sphingolipid/lysosomal disruption, and Golgi-enzyme/glycosylation defects.
  It does not draw causal arrows from the lipid/lysosomal or glycosylation
  branches to clinical manifestations because the retained literature does not
  establish those routes. The prior bundled neurologic/hepatic mechanism and
  its unsupported edge were removed. A separate, evidence-backed progressive
  cerebello-cerebral atrophy node now connects the primary VPS53/GARP lesion to
  the neurologic findings reported in the discovery cohort. Cerebellar atrophy
  (HP:0001272) replaces the earlier congenital cerebellar-hypoplasia assertion,
  matching the progressive PCCA observation. The disease is not
  parented as a type II congenital disorder of glycosylation: VPS53-knockout
  human cells show glycosylation defects, but direct patient glycosylation data
  are not present in the reviewed sources. Patient fibroblast and VPS53-knockout
  RPE1 models are now structured explicitly, and sphingolipid-synthesis
  inhibition is recorded only as a preclinical strategy. No diagnostic,
  differential-diagnosis, frequency, or established-treatment claims were
  added without source text that directly supports them.

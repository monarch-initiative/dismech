diagnosis:
- name: Imaging of the lacrimal and salivary glands with FGF10 testing
  description: >
    The diagnosis is clinical, supported by MRI showing absent or hypoplastic
    lacrimal and major salivary glands, orbital CT for bony nasolacrimal
    obstruction and Schirmer testing, and confirmed by a heterozygous FGF10
    variant on gene or exome sequencing.
  evidence:
  - reference: PMID:30697385
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imaging tests are necessary to confirm the lack of formation of salivary
      glands and alteration of lacrimal system.
    explanation: Imaging is the confirmatory clinical test.
  - reference: PMID:19376597
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, MRI is an excellent alternative means for evaluating this
      disorder and also for ruling out other possible structural defects
      contributing to patients, symptoms.
    explanation: MRI is the imaging method of choice.
  - reference: PMID:38081329
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Slit-lamp ophthalmic examination, comprehensive physical examination,
      orbital computed tomography (CT) imaging, cervicofacial magnetic resonance
      imaging, audiometry, and whole exome sequencing on periphery blood were
      performed.
    explanation: The work-up used in a recent multi-family series, including exome sequencing.
  - reference: PMID:41791508
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Tc-99m scintigraphy was the most common diagnostic modality."
    explanation: >-
      Salivary scintigraphy is the usual imaging test in congenital major
      salivary gland agenesis; the reviewed cases were mostly not genetically
      characterised, so this applies to ALSG by inference.
differential_diagnoses:
- name: LADD syndrome
  description: >
    Lacrimo-auriculo-dento-digital syndrome shares the lacrimal and salivary
    anomalies and is allelic (FGF10), but is also caused by FGFR2 and FGFR3
    variants and adds cup-shaped ears, hearing loss, and dental and digital
    anomalies. An ALSG parent can have a child with LADD syndrome, so the two
    may be one spectrum.
  disease_term:
    preferred_term: LADD syndrome
    term:
      id: MONDO:0007872
      label: LADD syndrome
  distinguishing_features:
  - Cup-shaped ears and hearing loss
  - Dental anomalies
  - Digital anomalies
  - Causal variants also in FGFR2 or FGFR3
  evidence:
  - reference: PMID:17213838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in FGF10 were recently described in ALSG and in
      lacrimo-auriculo-dento-digital (LADD) syndrome which are overlapping
      clinical entities.
    explanation: States the clinical overlap and shared gene.
  - reference: PMID:16630169
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autosomal-dominant multiple congenital anomaly disorder characterized by
      aplasia, atresia or hypoplasia of the lacrimal and salivary systems,
      cup-shaped ears, hearing loss, and dental and digital anomalies.
    explanation: The ear, dental and digital features that distinguish LADD.
  - reference: PMID:16501574
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified heterozygous mutations in the tyrosine kinase domains of
      the genes encoding fibroblast growth factor receptors 2 and 3 (FGFR2,
      FGFR3) in LADD families, and in one further LADD family, we detected a
      mutation in the gene encoding fibroblast growth factor 10 (FGF10), a known
      FGFR ligand.
    explanation: LADD is also caused by FGFR2 and FGFR3, genes not reported in ALSG.
  - reference: PMID:32715658
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lacrimo-auriculo-dento-digital (LADD) syndrome is a rare autosomal
      dominant disorder caused by mutations in one of the three genes:
      fibroblast growth factor receptor 2 (FGFR2), FGFR3, or FGF10.
    explanation: Restates the three-gene basis of LADD.
  - reference: PMID:37615310
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      without concomitant abnormalities of the ears or digits, commensurate with
      a diagnosis of aplasia of the lacrimal and salivary glands (ALSG).
    explanation: Absence of ear and digit anomalies is what separates ALSG from LADD.
- name: Sjogren syndrome
  description: >
    Autoimmune dry eye and dry mouth can mimic ALSG. Normal minor salivary gland
    histology, onset in infancy and absent glands on imaging point to ALSG.
  disease_term:
    preferred_term: Sjogren syndrome
    term:
      id: MONDO:0010030
      label: Sjogren syndrome
  evidence:
  - reference: PMID:19376597
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case report of ALSG as an extremely rare, yet important
      alternative diagnosis in cases with symptoms and signs suggestive of
      Sjögren's syndrome.
    explanation: ALSG presents as a Sjogren-like sicca syndrome.
  - reference: PMID:41791508
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Awareness of this condition in children is limited, and differentiation
      from autoimmune or acquired causes of xerostomia, such as juvenile
      Sjögren's disease, is essential for accurate diagnosis.
    explanation: >-
      Systematic review of congenital agenesis of all major salivary glands, a
      group that includes ALSG but is not genetically defined; it names juvenile
      Sjogren disease as the differential to exclude.
- name: IGSF3-related isolated bony congenital nasolacrimal duct obstruction
  description: >
    Bony nasolacrimal duct obstruction from IGSF3 variants occurs with normal
    lacrimal and salivary glands, whereas FGF10 variants give the same
    obstruction with multi-gland hypoplasia.
  evidence:
  - reference: PMID:41533940
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, individuals carrying IGSF3 variants showed isolated bony
      CNLDO with normal glandular morphology.
    explanation: Gland imaging separates the two genetic causes of bony obstruction.
treatments:
- name: Lacrimal Drainage Reconstruction
  description: >
    Surgical reconstruction of the upper lacrimal drainage system, or other
    lacrimal surgery chosen by the clinical findings, for punctal atresia,
    nasolacrimal obstruction and mucocele.
  therapeutic_modality: SURGERY
  treatment_term:

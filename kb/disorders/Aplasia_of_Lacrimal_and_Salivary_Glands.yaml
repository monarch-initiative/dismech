genetic:
- name: FGF10
  notes: >
    FGF10 (5p12) encodes fibroblast growth factor 10, the principal FGFR2b
    ligand in branching organogenesis. Reported ALSG alleles include nonsense
    (p.Trp79*), canonical splice-site (c.429+1G>T, c.430-1G>A, c.429+2T>A) and
    missense variants (R80S, G138E and several others), plus a heterozygous
    5p12 deletion spanning the gene. The same gene causes some cases of LADD
    syndrome and, with heterozygous loss of function, lethal lung developmental
    disorders and childhood interstitial lung disease; those are separate
    entities. No ClinGen gene-disease validity record for FGF10 and ALSG was
    found in the local cache.
  gene_term:
    preferred_term: FGF10
    term:
      id: hgnc:3666
      label: FGF10
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:15654336
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped ALSG to 5p13.2-5q13.1, which coincides with the gene fibroblast
      growth factor 10 (FGF10). In two extended pedigrees, we identified
      heterozygous mutations in FGF10 in all individuals with ALSG.
    explanation: The gene discovery study, by linkage and mutation screening.
  - reference: PMID:17213838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present here two families with ALSG associated with missense mutations
      (R80S and G138E, respectively) affecting highly conserved residues in FGF10.
    explanation: Two further families with FGF10 missense alleles.
  - reference: PMID:26955834
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The candidate gene sequencing of the FGF10 gene identified a novel
      heterozygous nonsense mutation (c.237G > A, p.Trp79*) in the exon 1.
    explanation: A truncating allele in an independent Turkish family.
  - reference: PMID:41533940
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with FGF10 variants exhibited syndromic aplasia of lacrimal
      and salivary glands (ALSGs) phenotype characterized by bony CNLDO, punctal
      anomalies, and hypoplasia of lacrimal, parotid, and submandibular glands.
    explanation: A series of families with eight FGF10 variants, all with the ALSG phenotype.
  - reference: PMID:36124135
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Single-nucleotide variants in FGF10 or FGF10-involving copy-number variant
      deletions have been reported in families with lacrimo-auriculo-dento-digital
      syndrome, aplasia of the lacrimal and salivary glands, or lethal lung
      developmental disorders.
    explanation: >-
      Systematic review placing ALSG among the FGF10-related disorders, with
      both point variants and deletions.
pathophysiology:
- name: FGF10 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >
    A heterozygous nonsense, splice-site, missense or deletion allele leaves one
    functional FGF10 copy. FGF10 is the high-affinity ligand of the epithelial
    receptor FGFR2b, so the lesion halves the supply of this receptor ligand
    during gland development.
  genes:
  - preferred_term: FGF10
    term:
      id: hgnc:3666
      label: FGF10
  molecular_functions:
  - preferred_term: FGFR2b binding
    term:
      id: GO:0005111
      label: type 2 fibroblast growth factor receptor binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15654336
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that haploinsufficiency for FGF10 during a crucial stage of
      development results in ALSG.
    explanation: The discovering group's statement of the disease mechanism.
  - reference: PMID:26955834
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report further confirms that ALSG is caused by the haploinsufficiency
      of functional FGF10.
    explanation: A premature stop codon predicted to trigger nonsense-mediated decay supports haploinsufficiency.
  - reference: PMID:37615310
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RT-PCR assays of HEK-293 cells transfected with wild type or mutant FGF10
      demonstrated that the variant causes skipping of Exon 2.
    explanation: A transfection assay shows the donor splice-site allele disrupts the transcript.
  - reference: PMID:11062007
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that FGF10 acts as a major ligand for FGFR2b in
      mouse multi-organ development.
    explanation: Establishes FGF10 as the main FGFR2b ligand in organogenesis, the activity lost with the allele.
  downstream:
  - target: Reduced Mesenchymal FGF10-FGFR2b Signaling to Gland Epithelium
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41828344
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        In patients with ALSG, heterozygous loss-of-function mutations are
        found, and FGF10 haploinsufficiency results in the absence of these
        secretory organs.
      explanation: >-
        Background statement in a mouse study linking the heterozygous lesion
        in patients to failed gland formation through reduced FGF10 dose.
  - target: Lacrimal Drainage System Maldevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Punctal atresia and bony nasolacrimal duct obstruction segregate with
      FGF10 variants, but no study has traced how reduced FGF10 dose disturbs
      the drainage pathway, so the edge is drawn with unknown intermediates.
    evidence:
    - reference: PMID:38081329
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bony CNLDO was identified as a novel phenotype of ALSG implicated by
        missense mutations of highly conserved residues in the Fgf10 gene.
      explanation: Genotype-phenotype association, not a demonstrated mechanism.
- name: Reduced Mesenchymal FGF10-FGFR2b Signaling to Gland Epithelium
  biological_scale: CELLULAR
  description: >
    FGF10 is expressed by the mesenchyme surrounding the presumptive gland
    epithelium and acts on FGFR2b in the epithelial bud. With one functional
    allele, this paracrine signal falls below the level needed to drive
    epithelial proliferation and outgrowth.
  cell_types:
  - preferred_term: periglandular mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  - preferred_term: gland primordium epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:

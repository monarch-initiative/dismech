    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Lacrimal punctal atresia
    term:
      id: HP:0007820
      label: Lacrimal punctal atresia
  - preferred_term: Epiphora
    term:
      id: HP:0009926
      label: Epiphora
  evidence:
  - reference: PMID:37615310
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reconstruction of the upper lacrimal drainage system was performed in some
      of the affected individuals.
    explanation: Reports surgical reconstruction in affected kindred members.
  - reference: PMID:30697385

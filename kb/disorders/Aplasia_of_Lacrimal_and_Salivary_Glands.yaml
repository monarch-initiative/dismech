  target_phenotypes:
  - preferred_term: Dental caries
    term:
      id: HP:0000670
      label: Carious teeth
  evidence:
  - reference: PMID:26955834
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it will positively motivate oral health care to avoid
      further destruction of the tooth due to the lack of salivary production.
    explanation: Recommends oral health care to prevent tooth destruction.
- name: Minor Salivary Gland Transplantation
  description: >
    Autologous transplantation of minor salivary glands to the ocular surface
    has been used for congenital alacrimia with bilaterally absent lacrimal
    glands and corneal scarring, with improvement at five years. The reported
    child had no genetic diagnosis, so its use in ALSG is by extension.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: minor salivary gland transplantation to the ocular surface
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Dry, irritable eyes
    term:
      id: HP:0001097
      label: Keratoconjunctivitis sicca
  evidence:
  - reference: PMID:38537898
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      On long-term follow-up, 5 years after surgery, we observed considerable
      improvement in the photophobia, corneal transparency, and
      neovascularization.
    explanation: >-
      Single case of congenital alacrimia with absent lacrimal glands on CT,
      not genetically characterised; graded INDIRECT because the patient is not
      shown to have FGF10-related ALSG.
animal_models:
- name: Fgf10 heterozygous null mouse (Fgf10+/-)
  species: Mouse
  genotype: Fgf10+/-
  publication: PMID:15654336
  description: >
    Mice heterozygous for an Fgf10 null allele have a phenotype similar to
    ALSG. Lacrimal gland primordia fail to form, submandibular glands are
    hypoplastic, and the Harderian gland is often degenerated or absent,
    frequently on one side.
  evidence:
  - reference: PMID:15654336
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fgf10(+/-) mice have a phenotype similar to ALSG, providing a model for
      this disorder.
    explanation: The discovering group established the heterozygote as the ALSG model.
  - reference: PMID:38921483
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results show that the Fgf10 haploinsufficiency causes delayed or
      defective HG development, often unilaterally from the unexpectedly early
      neonatal period.
    explanation: >-
      Harderian gland defects in heterozygotes mirror the often unilateral gland
      involvement in ALSG; humans lack a Harderian gland, so this is an analogy.
  modeled_mechanisms:
  - target: Failure of Lacrimal Gland Budding
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Heterozygotes lack lacrimal gland primordia, as patients lack the gland.
    limitations: >-
      The mouse main lacrimal gland is exorbital with a long excretory duct,
      unlike the human intraorbital gland, and a small fraction of
      heterozygous primordia still show budding at E15.5.
    evidence:
    - reference: PMID:41828344
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        LG primordia were not observed in Fgf10+/- mice bilaterally at E16.5 or
        later stages.
      explanation: The heterozygote reproduces the absent lacrimal gland.
  - target: Impaired Salivary Gland Branching Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygotes have hypoplastic submandibular glands.
    limitations: >-
      Heterozygous mice show submandibular hypoplasia rather than the aplasia
      seen in many patients, and parotid development was not reported.
    evidence:
    - reference: PMID:15972105
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hypoplastic SMGs are seen in Fgf10 and Fgfr2b heterozygotes whereas SMG
        aplasia is seen in Fgf10 and Fgfr2b null embryos.
      explanation: Dose-dependent salivary gland hypoplasia in heterozygotes.
- name: Fgf10 Aey17 splice mutant mouse
  species: Mouse
  genotype: Fgf10 Aey17/+ (ENU-induced intron 1 splice-site allele)
  background: C3HeB/FeJ
  publication: PMID:19407009
  description: >
    An ENU-induced Fgf10 splice-site allele causing a frameshift. Heterozygotes
    have a dominant slit-eye phenotype from Harderian gland atrophy;
    homozygotes are not viable. The authors proposed it as a dry-eye model.
  evidence:
  - reference: PMID:19407009
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutation in the Fgf10 gene leads to a dominant slit-eye phenotype
      caused by atrophy of the Harderian gland.
    explanation: A second, independent heterozygous Fgf10 allele with an orbital gland defect.
  modeled_mechanisms:
  - target: Failure of Lacrimal Gland Budding
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Heterozygous loss of Fgf10 shrinks an FGF10-dependent orbital gland.
    limitations: >-
      The affected gland is the Harderian gland, which humans do not retain, and
      the lacrimal and salivary glands were not described.
    evidence:
    - reference: PMID:19407009
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histologic analysis of the major ocular tissues (cornea, lens, retina)
        did not reveal major alterations compared with the wild type, but the
        size of the Harderian gland was remarkably reduced in heterozygotes.
      explanation: Orbital gland hypoplasia from a single Fgf10 allele.
discussions:
- discussion_id: alsg_ladd_spectrum_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are ALSG and FGF10-related LADD syndrome distinct allelic disorders, or one
    variable spectrum separated by ascertainment?
  attaches_to:
  - disease#
  - pathophysiology#FGF10 Haploinsufficiency
  rationale: >
    Both are autosomal dominant FGF10 haploinsufficiency disorders, and a
    mother with ALSG and her daughter with LADD syndrome carried the same
    nonsense allele, so the extra-glandular features cannot be predicted from
    the allele. Whether modifier loci, the residual activity of particular
    alleles, or chance decide whether ears, teeth and digits are affected has
    not been studied. The G138E allele has been reported both in an ALSG family
    and as a LADD-causing allele.
  evidence:
  - reference: PMID:16630169
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A nonsense mutation was also found in exon 2 of FGF10 (Family 2) in a
      19-year-old mother with ALSG and her 2-year-old daughter with LADD
      syndrome.
    explanation: One allele, two diagnoses in one family.
  - reference: PMID:16630169
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that ALSG and LADD syndrome may represent variable

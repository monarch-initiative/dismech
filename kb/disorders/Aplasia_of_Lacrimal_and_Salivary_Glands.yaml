name: Aplasia of Lacrimal and Salivary Glands
creation_date: "2026-10-08T13:31:10Z"
category: Mendelian
description: >
  Aplasia of lacrimal and salivary glands (ALSG) is a rare autosomal dominant
  congenital disorder in which the lacrimal glands, the major salivary glands
  (parotid and submandibular) and parts of the lacrimal drainage system are
  absent, atretic or hypoplastic. Affected individuals present from infancy with
  irritable, dry eyes and reduced tear production, epiphora from punctal atresia
  or nasolacrimal duct obstruction, and dry mouth with early and severe dental
  caries. Expressivity is variable within families, from bilateral aplasia to
  unilateral or minimal involvement, and penetrance is incomplete.

  ALSG is caused by heterozygous loss-of-function variants in FGF10 (nonsense,
  splice-site and missense alleles, and a whole-gene deletion), and is read as
  FGF10 haploinsufficiency. FGF10 is secreted by the mesenchyme around the
  nascent gland epithelium and signals through the epithelial receptor FGFR2b to
  drive budding and branching morphogenesis. In mice a single functional Fgf10
  allele is insufficient for lacrimal gland budding and gives hypoplastic
  submandibular glands, while loss of both alleles abolishes the lacrimal and
  salivary glands. ALSG is allelic with lacrimo-auriculo-dento-digital (LADD)
  syndrome, which adds ear, dental and digital anomalies; both can occur in one
  family. Management is supportive: lacrimal drainage surgery, ocular
  lubrication and intensive dental prevention.
synonyms:
- ALSG
- aplasia of the lacrimal and major salivary glands
- agenesis of lacrimal and salivary glands
- congenital absence of lacrimal puncta and salivary glands

inheritance:
- name: Autosomal Dominant
  description: >
    Heterozygous FGF10 variants segregate with the disorder in multigeneration
    pedigrees. Penetrance is incomplete: an unaffected variant carrier was found
    in a six-generation kindred, and a three-family series described the
    pattern as autosomal dominant with variable penetrance. Expressivity varies
    within families, from bilateral gland aplasia to unilateral or minimal
    involvement.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:15654336
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two extended pedigrees, we identified heterozygous mutations in FGF10
      in all individuals with ALSG.
    explanation: Heterozygous variants segregating in extended pedigrees establish dominant inheritance.
  - reference: PMID:37615310
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, one of the variant carriers had no ALSG-related clinical
      findings, demonstrating incomplete penetrance.
    explanation: Unaffected heterozygous carrier in a large kindred documents incomplete penetrance.
  - reference: PMID:37615310
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, individuals sharing the same variant exhibited phenotypic
      variability, with unilateral or bilateral epiphora, as well as variable
      expression of dry mouth and caries.
    explanation: Variable expressivity among carriers of one allele.
  - reference: PMID:38081329
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inheritance pattern was autosomal dominant with variable penetrance."
    explanation: Independent families with FGF10 missense variants show the same pattern.

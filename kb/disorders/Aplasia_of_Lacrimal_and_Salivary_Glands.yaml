- discussion_id: alsg_lacrimal_drainage_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does reduced FGF10 dose cause punctal atresia and bony nasolacrimal
    duct obstruction?
  attaches_to:
  - pathophysiology#Lacrimal Drainage System Maldevelopment
  - phenotypes#Nasolacrimal duct obstruction
  - phenotypes#Lacrimal punctal atresia
  rationale: >
    The gland defects are explained by mouse work on lacrimal budding and
    salivary branching, but the drainage-system anomalies have only
    genotype-phenotype support in patients. No mouse study cited here describes
    the puncta or the bony nasolacrimal canal in Fgf10 heterozygotes.
notes: >
  No GeneReviews chapter exists for ALSG or for FGF10-related disorders in the
  committed Bookshelf index. Some sporadic patients diagnosed clinically
  without genetic testing carry extra features (growth and developmental
  retardation, PMID:21214158) that have not been linked to FGF10 and are not
  included here. One carrier of an FGF10 start-loss variant with lacrimal gland
  aplasia and xerostomia also had esophageal atresia and pulmonary hypoplasia,
  which were absent in relatives with the same variant (PMID:41409311); the
  authors suggest a second hit. Heterozygous FGF10 loss of function also causes
  lethal lung developmental disorders and childhood interstitial lung disease;
  these are separate entities.

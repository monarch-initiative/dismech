    term:
      id: GO:0060638
      label: mesenchymal-epithelial cell signaling
  - preferred_term: FGFR2b signaling
    modifier: DECREASED
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
  evidence:
  - reference: PMID:10821755
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of FGF10 in the mesenchyme adjacent to the presumptive
      lacrimal bud and absence of lacrimal gland development in FGF10-null mice
      strongly suggest that it is an endogenous inducer.
    explanation: Places FGF10 in the periglandular mesenchyme as the inducer of the lacrimal bud.
  - reference: PMID:41828344
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Among Fgf1, Fgf3, Fgf7, Fgf10, and Fgf22, Fgf10 was expressed in the
      mesenchyme surrounding developing LG epithelial cells
    explanation: Confirms the mesenchymal source of the signal in the developing lacrimal gland.
  downstream:
  - target: Failure of Lacrimal Gland Budding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10821755
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This was supported by the observation that inhibition of signaling by a
        receptor for FGF10 (receptor 2 IIIb) suppressed development of the
        endogenous lacrimal bud.
      explanation: Blocking FGFR2b signaling suppresses lacrimal bud formation.
    - reference: PMID:41828344
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A single allele of Fgf10 was found to be insufficient to support the
        budding process during LG morphogenesis.
      explanation: Halving the signal, as in ALSG, is enough to block budding.
  - target: Impaired Salivary Gland Branching Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15972105
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data indicates that FGF10/FGFR2b signaling is essential for the SMG
        epithelial branching and histodifferentiation, but not earliest initial
        bud formation.
      explanation: The signal drives submandibular epithelial branching.
    - reference: PMID:15972105
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Complementary in vitro studies further indicate that FGF10/FGFR2b
        signaling regulates SMG epithelial branching and cell proliferation.
      explanation: Explant work supports the same edge in culture.
    - reference: PMID:15716343
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        FGF7 induces epithelial budding, whereas FGF10 induces duct elongation,
        and both are inhibited by FGFR or ERK1/2 signaling inhibitors.
      explanation: In submandibular epithelial rudiments FGF10 drives duct elongation through FGFR and ERK1/2 signaling.

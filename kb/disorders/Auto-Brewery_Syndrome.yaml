- name: Prior Antibiotic Exposure
  influences_mechanisms:
  - target: Fungal Overgrowth in a Subset of Cases
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Antibiotics clear the bacteria that hold fungal populations in check,
      and the fungi expand into the space left behind. The intervening loss of
      colonization resistance is understood but is not measured here, and the
      exposure preceded disease in only some reported cases, which is why the
      link is graded predisposing and partial.
    evidence:
    - reference: PMID:33887125
      reference_title: "Gut fermentation syndrome: A systematic review of case reports."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The disease is mostly reported by Saccharomyces and Candida genera, and some cases were previously treated with antibiotics."
      explanation: >-
        Systematic review of case reports noting that the fungal cases are
        mostly Saccharomyces and Candida and that some had prior antibiotic
        treatment. Some, not all, is the reason this stays partial.
  description: >-
    Antibiotic exposure preceded disease in a subset of reported fungal cases and
    may disrupt colonization resistance. It is a risk context rather than a
    necessary cause, and antibiotics can also be used therapeutically in bacterial
    ABS.
  evidence:
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is mostly reported by Saccharomyces and Candida genera, and
      some cases were previously treated with antibiotics.
    explanation: The systematic review documents antecedent antibiotic use only in some cases.
- name: Gastrointestinal Obstruction or Hypomotility
  description: >-
    Chronic obstruction or hypomotility may favor microbial overgrowth and is a
    recognized clinical context in which ABS should be considered, but it is not
    present in every patient.
  evidence:
  - reference: PMID:34682761
    reference_title: "The Auto-Brewery Syndrome: A Perfect Metabolic \"Storm\" with Clinical and Forensic Implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome should be considered in patients with chronic obstruction or
      hypomotility presenting with elevated breath and blood alcohol concentrations
    explanation: The review identifies obstruction and hypomotility as predisposing contexts.
diagnosis:
- name: Supervised Oral Glucose Challenge with Serial Ethanol Measurement
  description: >-
    The diagnostic cornerstone is a monitored rise in blood or breath ethanol in
    a supervised setting, commonly after an oral glucose challenge. Baseline and
    serial sampling may be required because ethanol production can be delayed.
    Strict observation is essential to exclude exogenous alcohol ingestion.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13244660/
    reference_title: "Gut microbial ethanol metabolism contributes to Auto-brewery Syndrome in an observational cohort - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the gold standard for diagnosis consists of a monitored rise in blood
      alcohol concentration while the patient is in a supervised clinical setting
      and is typically facilitated with administration of an oral glucose load
    explanation: >-
      The current cohort report states the supervised blood-ethanol rise and oral
      glucose load that define confirmation.
- name: Targeted Gastrointestinal Microbiology and Susceptibility Testing
  description: >-
    Stool culture or endoscopically obtained gastrointestinal secretions can help
    identify bacterial or fungal contributors and guide susceptibility-based
    therapy. Microbial detection is adjunctive: culture alone does not prove ABS
    without a supervised endogenous ethanol rise.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:31423320
    reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this case report was confirmation and treatment of ABS using a
      standardised carbohydrate challenge test followed by upper and lower
      endoscopy to obtain intestinal secretions to detect fungal growth.
    explanation: >-
      The case demonstrates how endoscopic microbiology can complement a positive
      supervised challenge and enable targeted treatment.
differential_diagnoses:
- name: Exogenous Alcohol Ingestion or Alcohol Use Disorder
  description: >-
    Surreptitious or unrecognized exogenous alcohol exposure is the most important
    alternative explanation for intoxication and an elevated ethanol measurement.
    Confirmation of ABS requires strict supervision during challenge testing and
    exclusion of access to alcohol; symptoms and denial of use alone are not
    diagnostic.
  distinguishing_features:
  - In ABS, ethanol rises under supervised alcohol-free conditions after a carbohydrate challenge.
  - Exogenous intake is not explained by reproducible carbohydrate-triggered ethanol production under observation.
  evidence:
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important that the patients are strictly monitored during the test
      for any consumption of alcoholic beverages, which would otherwise severely
      bias the test.
    explanation: >-
      The systematic review identifies supervised exclusion of alcohol consumption
      as essential to valid diagnosis.
treatments:
- name: Targeted Antibacterial Combination Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    For bacterial ABS, susceptibility-informed antibiotics may suppress
    ethanol-producing pathobionts. Human outcome evidence is limited to small
    cohorts and combination regimens, so antibiotic monotherapy cannot be assumed
    effective and unnecessary broad-spectrum exposure may worsen dysbiosis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  target_mechanisms:
  - target: Flare-Associated Bacterial Gut Dysbiosis
    treatment_effect: INHIBITS
    description: Antibiotics suppress implicated ethanol-producing bacteria.
    evidence:
    - reference: PMID:41507585
      reference_title: "Gut microbial ethanol metabolism contributes to auto-brewery syndrome in an observational cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Faecal samples from individuals with ABS during a flare produced more
        ethanol in vitro, which could be reduced by antibiotic treatment.
      explanation: The cohort directly shows reduced flare-sample ethanol production after antibiotic treatment.
  evidence:
  - reference: PMID:37060744
    reference_title: "Three Klebsiella species as potential pathobionts generating endogenous ethanol in a clinical cohort of patients with auto-brewery syndrome: a case control study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments with antibiotics, a complex probiotic preparation and a
      low-carbohydrate diet not only alleviated ABS, but also erased ABS relapse
      during the follow-up observation of one of the patients.
    explanation: >-
      The study supports an antibiotic-containing combination regimen in one
      patient but does not isolate the antibiotic effect.
- name: Sensitivity-Guided Antifungal Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    When gastrointestinal fungi are recovered in a confirmed case, antifungal
    selection should follow organism identification and susceptibility testing.
    Evidence is case-based and should not be generalized to bacterial ABS.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antifungal agent
      term:
        id: NCIT:C514
        label: Antifungal Agent
  target_mechanisms:
  - target: Fungal Overgrowth in a Subset of Cases
    treatment_effect: INHIBITS
    description: Antifungal therapy suppresses cultured fermenting fungi.
    evidence:
    - reference: PMID:31423320
      reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with antifungal agents allowed subsequent ingestion of
        carbohydrates without symptoms.
      explanation: The case links antifungal treatment of fungal ABS to symptom-free carbohydrate ingestion.
  evidence:
  - reference: PMID:31423320
    reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with antifungal agents allowed subsequent ingestion of
      carbohydrates without symptoms.
    explanation: >-
      A confirmed fungal case improved and tolerated carbohydrate after targeted
      antifungal treatment.
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five case reports, fluconazole 100 mg/day for 3 weeks and/or
      low‐carbohydrate diet was sufficient to treat the GFS.
    explanation: The systematic review documents successful case-based regimens.
- name: Low-Carbohydrate Dietary Intervention
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Restricting fermentable carbohydrate reduces substrate for microbial ethanol
    production. The approach is supported by case reports and combination
    regimens; the optimal composition, duration, and reintroduction strategy are
    not established.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Excess Gut Microbial Ethanol Production
    treatment_effect: INHIBITS
    description: Reduced fermentable substrate limits microbial ethanol production.
    evidence:
    - reference: PMID:37060744
      reference_title: "Three Klebsiella species as potential pathobionts generating endogenous ethanol in a clinical cohort of patients with auto-brewery syndrome: a case control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Monosaccharide content was identified as a potential food-related inducing
        factor for alcohol production.
      explanation: Identifying monosaccharide substrate as an inducing factor supports dietary substrate restriction.
  evidence:
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five case reports, fluconazole 100 mg/day for 3 weeks and/or
      low‐carbohydrate diet was sufficient to treat the GFS.
    explanation: The systematic review supports low-carbohydrate treatment only at case-report level.
- name: Fecal Microbiota Transplantation for Refractory Disease
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Fecal microbiota transplantation (FMT) is an emerging microbiome-restoration
    strategy for severe or refractory ABS. The largest cohort reports detailed
    longitudinal improvement in one patient, followed by relapse after the first
    FMT and a longer remission after a second, more intensive multicomponent
    regimen. Efficacy and safety remain investigational.
  treatment_term:
    preferred_term: fecal microbiota transplantation
    term:
      id: NCIT:C118643
      label: Fecal Microbiota Transplantation
  target_mechanisms:
  - target: Flare-Associated Bacterial Gut Dysbiosis
    treatment_effect: RESTORES
    description: FMT aims to restore a non-ethanol-producing microbial community.
    evidence:
    - reference: PMID:41507585
      reference_title: "Gut microbial ethanol metabolism contributes to auto-brewery syndrome in an observational cohort."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Finally, one patient was treated with faecal microbiota transplantation,
        with positive correlations between gut microbiota composition and
        function, and symptoms.
      explanation: The single-patient analysis links FMT-associated microbiome changes with microbial function and symptoms.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13244660/
    reference_title: "Gut microbial ethanol metabolism contributes to Auto-brewery Syndrome in an observational cohort - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After initial FMT, the patient experienced significant improvement in
      symptoms and no detectable blood alcohol levels for 3 months.
    explanation: >-
      The cohort reports a clinically meaningful but single-patient response.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13244660/
    reference_title: "Gut microbial ethanol metabolism contributes to Auto-brewery Syndrome in an observational cohort - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, his symptoms relapsed after this initial period of remission."
    explanation: >-
      Relapse after the first procedure limits any efficacy conclusion and supports
      investigational framing.
animal_models:
- species: Mus musculus
  category: Microbiome transfer model
  description: >-
    High-alcohol-producing Klebsiella species isolated from patients with ABS
    induced an ABS-like ethanol-production phenotype in mice. This supports
    microbial causality for bacterial ABS but does not establish that Klebsiella
    explains all human cases.
  associated_phenotypes:
  - Endogenous ethanol production
  - Elevated blood alcohol concentration
  evidence:
  - reference: PMID:37060744
    reference_title: "Three Klebsiella species as potential pathobionts generating endogenous ethanol in a clinical cohort of patients with auto-brewery syndrome: a case control study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We isolated three species of HiAlc Klebsiella from ABS patients, which were
      able to induce ABS in mice.
    explanation: Patient-derived bacterial isolates reproduced an ABS-like phenotype in mice.
clinical_trials:
- name: NCT06083142
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Early-phase study of oral FMT capsules in people with diagnosed ABS. After an
    antibiotic and bowel-cleansing preparation, participants receive five capsule
    doses over one week and are followed for safety, feasibility, and research
    samples. The estimated enrollment is eight.
  review_notes: >-
    ClinicalTrials.gov reports the phase as EARLY_PHASE1; the schema's closest
    available value is PHASE_I. Registry status was ACTIVE_NOT_RECRUITING when
    reviewed on 2026-07-20, with estimated completion in 2030.
  evidence:
  - reference: clinicaltrials:NCT06083142
    reference_title: Fecal Microbiota Transplant for Autobrewery Syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this clinical trial is to study fecal microbiota
      transplantation(FMT) by oral capsule in people already diagnosed with
      auto-brewery syndrome (ABS, also known as gut fermentation syndrome).
    explanation: The registry documents the investigational oral-FMT intervention and population.

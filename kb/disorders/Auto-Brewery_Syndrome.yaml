name: Auto-Brewery Syndrome
creation_date: '2026-01-17T04:34:30Z'
category: Complex
description: >-
  Auto-brewery syndrome (ABS) is a rarely diagnosed disorder in which gut
  microorganisms produce enough ethanol from dietary carbohydrate to raise
  systemic blood ethanol and cause intoxication without exogenous alcohol
  consumption. The best current cohort evidence implicates flare-associated
  bacterial dysbiosis, particularly ethanol-producing Escherichia coli and
  Klebsiella pneumoniae and enriched fermentation pathways. Fungal overgrowth
  has been demonstrated in selected cases but was not a cohort-wide signature
  in the largest microbiome study. Diagnosis therefore requires a supervised
  rise in blood ethanol, usually after an oral glucose challenge, rather than
  symptoms or a positive microbial culture alone.
synonyms:
- Gut fermentation syndrome
- Endogenous alcohol fermentation syndrome
- Endogenous ethanol fermentation syndrome
disease_term:
  preferred_term: auto-brewery syndrome
  term:
    id: MONDO:0971031
    label: auto-brewery syndrome
parents:
- Gastrointestinal disorders
- Metabolic disorders
epidemiology:
- name: Published Case Burden and Unknown Population Prevalence
  description: >-
    Population prevalence is unknown. The 2021 systematic review identified 17
    case reports comprising 20 patients, underscoring both the rarity of the
    published diagnosis and the absence of population-level prevalence data.
  evidence:
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 17 case reports were included, consisting of 20 patients
      diagnosed with GFS.
    explanation: >-
      The systematic review quantifies the small published case literature; it
      does not establish population prevalence.
progression:
- phase: Carbohydrate-triggered intoxication flares and remission
  notes: >-
    ABS commonly follows an episodic course. Carbohydrate exposure can precede
    a rise in ethanol, while microbiome composition, stool ethanol-production
    capacity, and symptoms differ between flare and remission samples. Duration
    and recurrence vary, and standardized longitudinal natural-history data are
    not yet available.
  evidence:
  - reference: PMID:41507585
    reference_title: "Gut microbial ethanol metabolism contributes to auto-brewery syndrome in an observational cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Faecal samples from individuals with ABS during a flare produced more
      ethanol in vitro, which could be reduced by antibiotic treatment.
    explanation: >-
      The observational cohort directly compared symptomatic flares with other
      clinical states and found increased microbial ethanol-production capacity.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    In clinically manifest ABS, unpredictable intoxication can impair cognition,
    coordination, relationships, employment, and driving, and can lead to falls,
    injury, or legal consequences. Burden varies among patients, but the potential
    severity and difficulty obtaining a credible diagnosis justify a high burden
    classification for symptomatic disease.
  evidence:
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These symptoms can have severe impact on patients' wellbeing and can have
      social and legal consequences.
    explanation: >-
      The systematic review directly documents major wellbeing, social, and legal
      effects across the case literature.
  - reference: PMID:31423320
    reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most significant event caused by one of his inebriations was a fall
      that caused intracranial bleeding
    explanation: >-
      A confirmed case demonstrates that an intoxication flare can cause serious
      physical injury.
pathophysiology:
- name: Flare-Associated Bacterial Gut Dysbiosis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    During documented ABS flares, the gut microbiome shows lower diversity and
    enrichment of Proteobacteria and Enterobacteriaceae, including Escherichia
    coli and Klebsiella pneumoniae. Stool from flares produces more ethanol in
    culture than stool from remission or unaffected household-partner samples.
    These findings support bacterial dysbiosis as the dominant mechanism in the
    largest available cohort, without implying that one organism explains every
    case.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  biological_processes:
  - preferred_term: fermentation
    term:
      id: GO:0006113
      label: fermentation
    modifier: INCREASED
  evidence:
  - reference: PMID:41507585
    reference_title: "Gut microbial ethanol metabolism contributes to auto-brewery syndrome in an observational cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gut microbiome analysis using metagenomics revealed an enrichment of
      Proteobacteria, including Escherichia coli and Klebsiella pneumoniae.
    explanation: >-
      The 22-patient cohort identifies a flare-associated bacterial taxonomic
      signature in clinically documented ABS.
  - reference: PMID:37060744
    reference_title: "Three Klebsiella species as potential pathobionts generating endogenous ethanol in a clinical cohort of patients with auto-brewery syndrome: a case control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The abundance of the genus Klebsiella in Enterobacteriaceae was strongly
      associated with fluctuations of patient's blood alcohol concentration.
    explanation: >-
      An independent case-control study links Klebsiella abundance with the
      clinical blood-ethanol phenotype.
  downstream:
  - target: Excess Gut Microbial Ethanol Production
    causal_link_type: DIRECT
    description: >-
      Enriched ethanol-producing bacteria and fermentation pathways directly
      increase ethanol generation from carbohydrate in the intestinal lumen.
    evidence:
    - reference: PMID:41507585
      reference_title: "Gut microbial ethanol metabolism contributes to auto-brewery syndrome in an observational cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Faecal samples from individuals with ABS during a flare produced more
        ethanol in vitro, which could be reduced by antibiotic treatment.
      explanation: >-
        Flare samples directly produced excess ethanol ex vivo, and antibacterial
        exposure reduced that production.
- name: Fungal Overgrowth in a Subset of Cases
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Candida and Saccharomyces species have been cultured from the gastrointestinal
    tract in selected ABS cases, and sensitivity-guided antifungal treatment has
    been followed by a negative rechallenge. This mechanism remains provisional
    at the disease-wide level: the largest cohort found no significant fungal
    compositional difference, although prior antifungal exposure limited that
    analysis.
  locations:
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  biological_processes:
  - preferred_term: pyruvate fermentation to ethanol
    term:
      id: GO:0019655
      label: pyruvate fermentation to ethanol
    modifier: INCREASED
  evidence:
  - reference: PMID:31423320
    reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient in this case report had fungal yeast forms in the upper small
      bowel and cecum, which likely fermented carbohydrates to alcohol.
    explanation: >-
      A confirmed case directly localized fungal yeast forms to gastrointestinal
      sites and linked them to carbohydrate fermentation.
  - reference: PMID:33887125
    reference_title: "Gut fermentation syndrome: A systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The species that caused the GFS included Klebsiella pneumoniae, Candida
      albicans, C. glabrata, Saccharomyces cerevisiae, C. intermedia, C.
      parapsilosis, and C. kefyr.
    explanation: >-
      The systematic review documents several Candida and Saccharomyces species
      in published cases.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13244660/
    reference_title: "Gut microbial ethanol metabolism contributes to Auto-brewery Syndrome in an observational cohort - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the gut fungal microbiome by ITS2 sequencing demonstrated no
      significant differences in fungal composition between patients with ABS
      and household partners
    explanation: >-
      The largest cohort did not find a disease-wide fungal compositional signal,
      limiting generalization from individual culture-confirmed cases.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC13244660/
    reference_title: "Gut microbial ethanol metabolism contributes to Auto-brewery Syndrome in an observational cohort - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, increased antifungal use after ABS diagnosis (Table 2) may have
      suppressed intestinal fungal growth, so we cannot rule out a potential role
      for fungi in certain patients.
    explanation: >-
      Prior antifungal exposure prevents interpreting the negative cohort-wide
      fungal result as exclusion of fungal ABS in selected patients.
  downstream:
  - target: Excess Gut Microbial Ethanol Production
    causal_link_type: DIRECT
    description: >-
      In fungal-associated cases, yeast fermentation directly produces ethanol
      from ingested carbohydrate.
    evidence:
    - reference: PMID:31423320
      reference_title: "Case report and literature review of auto-brewery syndrome: probably an underdiagnosed medical condition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with antifungal agents allowed subsequent ingestion of
        carbohydrates without symptoms.
      explanation: >-
        Resolution after targeted antifungal treatment and subsequent carbohydrate
        ingestion supports a causal fungal fermentation mechanism in this case.

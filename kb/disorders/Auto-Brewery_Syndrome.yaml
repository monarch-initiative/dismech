      A total of 87 samples were sequenced, including 21 samples from household
      partners, 22 samples from patients with ABS in remission, 26 samples from
      patients during a flare, and an additional 18 samples from our FMT patient
      and household partner during and after FMTs.
    explanation: The methods give the exact sample count and clinical-condition breakdown.
notes: >-
  The bacterial mechanism has the strongest current cohort-level support. Fungal
  ABS remains credible for selected culture-confirmed cases but should not be
  assumed from the syndrome name or treated empirically without microbiologic
  support. A probiotic was used in combination regimens, but its independent
  benefit has not been studied. The public dataset contains sequencing data;
  metabolomics from the 2026 cohort are available only on request.

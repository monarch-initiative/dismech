- category: Constitutional
  name: Absence of Systemic and Neoplastic Features
  frequency: OBLIGATE
  description: >-
    MET is an oncogene, so the absence of tumours and of organ disease in the affected family
    is a substantive finding rather than a formality. Clinical evaluation of two affected
    children included complete blood counts, serum chemistries, urinalysis, liver function
    tests and fundoscopy, all normal, and there was no family history of cancer or of liver,
    kidney or heart disease.

    This is the clinical face of the same point the description makes about the literature:
    the germline missense alleles of DFNB97 do not behave like the somatic activating MET
    alterations of oncology, and nothing from that literature transfers here.

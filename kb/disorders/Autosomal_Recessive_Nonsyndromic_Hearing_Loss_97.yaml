    snippet: >-
      Homozygosity mapping with a dense array of one million SNP markers allowed us to map the
      gene for recessively inherited severe hearing loss to chromosome 7q31.2, defining a new
      deafness locus designated DFNB97 (maximum logarithm of the odds score of 4.8).
    explanation: >-
      The linkage result establishing recessive inheritance and the locus itself.

animal_models:
- name: Conditional c-Met inner ear inactivation mouse
  species: Mouse
  genotype: Conditional c-Met deletion using Wnt1-Cre in neural crest cells or Pax2-Cre in cochlear epithelium
  publication: PMID:27488639
  description: >-
    Separate neural-crest and cochlear-epithelium conditional c-Met deletions impaired melanocyte incorporation
    into the stria vascularis and produced profound hearing loss. Public full-text excerpts describe
    later hair-cell malformation and degeneration; that observation is not quoted in the abstract-only
    cache cited here. Sensory-cell preservation therefore cannot be assumed. The experiments establish
    a developmental role for Met without reproducing
    either reported human missense allele.
  modeled_mechanisms:
  - target: Failed Melanocyte Incorporation into the Stria Vascularis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Removing c-MET signalling in the developing inner ear stops the neural-crest-derived
      melanocytes entering the strial intermediate layer.
    limitations: >-
      Conditional inactivation is not a knock-in of a human missense allele. The experiment establishes
      a developmental role for the gene, without demonstrating the signaling defect or cochlear histology
      in the reported patients.
    readouts:
    - name: Melanocyte incorporation into the strial intermediate cell layer
      target: Failed Melanocyte Incorporation into the Stria Vascularis
      direction: DECREASED
      interpretation: >-
        The measured quantity is successful melanocyte incorporation, which decreases. The target node
        names the resulting failure of incorporation.
      evidence:
      - reference: PMID:27488639
        reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Genetic dissection of HGF signaling via c-MET reveals that the incorporation of the
          melanocytes into the future stria vascularis of the cochlear duct requires c-MET
          signaling.
        explanation: >-
          The genetic result behind this readout.
    evidence:
    - reference: PMID:27488639
      reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Genetic dissection of HGF signaling via c-MET reveals that the incorporation of the
        melanocytes into the future stria vascularis of the cochlear duct requires c-MET
        signaling.
      explanation: >-
        Conditional receptor inactivation tests the requirement for c-MET signaling during strial
        melanocyte incorporation, making this model informative for the proposed developmental lesion.
        It does not establish that either human missense allele produces the same defect.
  - target: Severe Prelingual Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Developmental receptor inactivation produces profound hearing loss in young adult mice. This supports
      an auditory role for Met without equating mouse and human onset stages.
    limitations: >-
      Conditional inactivation and human missense variation are different perturbations. Mouse young-adult
      hearing measurements do not establish congenital onset, progression or residual receptor activity
      in people with candidate MET variants.
    readouts:
    - name: Hearing threshold after developmental inactivation
      target: Severe Prelingual Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        Hearing is profoundly impaired, closing the chain from signalling loss to the clinical
        endpoint within a single organism.
      evidence:
      - reference: PMID:27488639
        reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, inactivation of either the ligand or receptor developmentally resulted
          in a profound hearing loss at young adult stages.
        explanation: >-
          The hearing measurement behind this readout, reported for the receptor arm as well
          as the ligand arm.
    evidence:
    - reference: PMID:27488639
      reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results suggest a novel connection between HGF signaling and deafness via

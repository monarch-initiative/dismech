  notes: >-
    The panel's evidence summary explains why only one of the three reported variants scored:
    "Only one missense variant was scored as the probands with the other variant had
    inconsistent phenotypes with nonsyndromic hearing loss and the minor allele frequency of
    the other variant was too high to be considered pathogenic." That is the specific reason
    the classification did not rise above Limited.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Two families. The 2019 Moroccan report describes itself as the second family in the world.
    No prevalence estimate exists.

    There is one measurement of how rare this is, and it is a negative result worth keeping:
    after mapping DFNB97, the discovering group screened a further 100 Pakistani families
    whose hearing loss was unexplained by known deafness genes and found no additional
    families at this locus.
  evidence:
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to find the contribution of the newly mapped locus to deafness, we screened
      100 families in which the moderate to profound hearing loss was not attributable to a
      known deafness gene variant.
    explanation: >-
      The screening effort that establishes DFNB97 as a rare cause even in the population
      where it was found.
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, this study reports the second family in the world associating deafness and
      mutation in the MET gene.
    explanation: >-
      Fixes the published family count at two as of 2019.

pathophysiology:

- name: Biallelic MET Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Both published alleles are homozygous missense variants and both are private to their
    family.

    The Pakistani allele c.2521T>G, p.Phe841Val, was found after homozygosity mapping placed
    the locus on 7q31.2 with a LOD of 4.8. It cosegregated with hearing loss in the family
    and was absent from 800 ethnically matched control chromosomes and from 136,602
    chromosomes in public variant databases.

    The Moroccan allele c.948A>G, p.Ile316Met, lies in the SEMA domain - the ligand-binding
    region of the receptor - and molecular dynamics simulation predicted that it costs the
    domain flexibility.

    Neither allele has been characterised functionally at the bench. That absence is what the
    ClinGen review means by case-level evidence only, and it is why the receptor-signalling
    node below is inferred rather than measured in a patient allele.
  genetic_context:
    gene:
      preferred_term: MET
      term:
        id: hgnc:7029
        label: MET
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous in both consanguineous families. functional_impact_category is deliberately
      omitted: the alleles are missense, no functional assay has been performed on either,
      and the only mechanistic prediction available is an in silico structural one. Asserting
      LOSS_OF_FUNCTION here would be inferring the very thing the evidence base does not
      supply.
  downstream:
  - target: Reduced HGF/MET Signalling in the Developing Cochlea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The inference from a missense receptor allele to reduced signalling. It is plausible
      for a SEMA-domain variant and it has not been measured for either allele.
  evidence:
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed a novel missense mutation c.2521T>G (p.F841V) in MET
      (mesenchymal epithelial transition factor), which encodes the receptor for hepatocyte
      growth factor.
    explanation: >-
      The founding allele.
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation cosegregated with the hearing loss phenotype in the family and was absent
      from 800 chromosomes of ethnically matched control individuals as well as from 136
    explanation: >-
      Cosegregation plus population absence, which is the strongest genetic evidence this
      entity has. The quote stops before the control-chromosome count because the source
      separates its digits with a thin space.
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel pathogenic homozygous c.948A>G (p.Ile316Met) mutation in the MET
      gene in one deaf Moroccan young girl carrying a total bilateral non-syndromic hearing
      impairment.
    explanation: >-
      The second family's allele.
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      The results of the MDS approach show that an Ile316Met mutation in the SEMA domain
      leads to protein flexibility loss.
    explanation: >-
      A molecular dynamics prediction, not a measurement. Graded COMPUTATIONAL and PARTIAL
      because a simulated flexibility change is a hypothesis about the allele's consequence
      rather than evidence of it.

- name: Reduced HGF/MET Signalling in the Developing Cochlea
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    HGF is expressed in the cochlear epithelium at the site that will become the stria
    vascularis, and its receptor MET is expressed both in that epithelium and on the
    melanocyte-derived intermediate cells. The signalling is therefore local, developmental
    and reciprocal, which is what makes an otherwise ubiquitous growth-factor pathway produce
    a phenotype confined to the ear.
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  biological_processes:
  - preferred_term: HGF receptor signalling through MET
    term:
      id: GO:0048012
      label: hepatocyte growth factor receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: Failed Melanocyte Incorporation into the Stria Vascularis
    causal_link_type: DIRECT
    description: >-
      Genetic dissection in mouse shows the incorporation step requires c-MET signalling.
  evidence:
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we discovered that hepatocyte growth factor (Hgf) is expressed in the future stria
      vascularis of the cochlear epithelium.
    explanation: >-
      Places the ligand at the anatomical site this node names.
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its receptor tyrosine kinase, c-Met, is expressed in the cochlear epithelium and
      melanocyte-derived intermediate cells in the stria vascularis.
    explanation: >-
      Places the receptor on both partners, which is what makes this a local signalling
      relationship rather than a systemic one.

- name: Failed Melanocyte Incorporation into the Stria Vascularis
  role: central_effector
  biological_scale: TISSUE
  description: >-
    In normal development a subpopulation of neural-crest-derived melanocytes migrates into
    a subregion of the cochlear epithelium and becomes the intermediate cell layer of the
    stria vascularis. Removing c-MET signalling stops that incorporation.

    This is the step that makes DFNB97 a neurocristopathy in the ear - a migration failure of
    a neural crest derivative - even though nothing outside the cochlea is affected.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  biological_processes:
  - preferred_term: melanocyte migration into the developing stria vascularis
    term:
      id: GO:0097324
      label: melanocyte migration
    modifier: DECREASED
  downstream:
  - target: Failure of Endolymphatic Potassium Homeostasis
    causal_link_type: DIRECT
    description: >-
      The intermediate cell layer is what the stria vascularis needs in order to do its ion
      transport job; without it, the job is not done.
  evidence:
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During mouse embryonic development, a subpopulation of neural crest cell-derived
      melanocytes migrates and incorporates into a subregion of the cochlear epithelium,
      forming the intermediate cell layer of the stria vascularis.
    explanation: >-
      The normal developmental process this node describes the failure of.
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic dissection of HGF signaling via c-MET reveals that the incorporation of the
      melanocytes into the future stria vascularis of the cochlear duct requires c-MET
      signaling.
    explanation: >-
      The direct genetic demonstration that this step depends on MET.

- name: Failure of Endolymphatic Potassium Homeostasis
  role: central_effector
  biological_scale: TISSUE
  description: >-
    The stria vascularis is a nonsensory structure whose function is to maintain the
    potassium concentration of the scala media and, with it, the endocochlear potential -
    the standing voltage across the endolymph that supplies the driving force for hair cell
    transduction.

    A caveat about provenance. The endocochlear potential itself has been measured in the
    HGF arm of this pathway, not the MET arm: a mouse carrying a noncoding Hgf deletion has
    neural crest cells failing to enter the strial intermediate layer and a significantly
    reduced endocochlear potential. That animal models DFNB39, the paired locus, not DFNB97.
    It is cited here because it measures the step, and the reader should know the measurement
    comes from the ligand side.
  locations:
  - preferred_term: stria vascularis of the cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  biological_processes:
  - preferred_term: endolymphatic potassium homeostasis maintained by the stria vascularis
    term:
      id: GO:0006813
      label: potassium ion transport
    modifier: DECREASED
  downstream:
  - target: Severe Prelingual Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Hair cells that are structurally intact cannot transduce without the endocochlear
      potential to drive current through them.
  evidence:
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The stria vascularis is a nonsensory structure that is essential for auditory hair cell
      function by maintaining potassium concentration of the scala media.
    explanation: >-
      States the function of the structure whose development fails upstream.
  - reference: PMID:32152201
    reference_title: "Noncoding Microdeletion in Mouse Hgf Disrupts Neural Crest Migration into the Stria Vascularis, Reduces the Endocochlear Potential, and Suggests the Neuropathology for Human Nonsyndromic Deafness DFNB39."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that, in the inner ear, the noncoding del10 mutation in Hgf leads to
      developmental defects of the SV and consequently dysfunctional ion homeostasis and a
      reduction in the EP, recapitulating human DFNB39 nonsyndromic deafness.
    explanation: >-
      The only direct measurement of the endocochlear potential in this pathway. Graded
      PARTIAL because it is the HGF ligand arm, modelling DFNB39 rather than DFNB97; it
      supports the shared downstream step and is not evidence about MET.

- name: Severe Prelingual Sensorineural Hearing Loss
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint, and it is confined to hearing. In the Pakistani family the affected
    individuals walked at 12 to 13 months, had normal tandem gait and Romberg testing, and
    had normal blood counts, serum chemistry, liver function and fundoscopy. In mouse,
    developmental inactivation of either the ligand or the receptor produced profound hearing
    loss in young adults.
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, inactivation of either the ligand or receptor developmentally resulted in a
      profound hearing loss at young adult stages.
    explanation: >-
      Closes the mouse chain from signalling loss to deafness, and does so for the receptor
      as well as the ligand, which is what makes it evidence about DFNB97.
  - reference: PMID:27488639
    reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings reveal a novel mechanism that may underlie human deafness DFNB39 and
      DFNB97.
    explanation: >-
      The authors' own statement that this mechanism is offered for DFNB97, hedged as they
      hedge it.


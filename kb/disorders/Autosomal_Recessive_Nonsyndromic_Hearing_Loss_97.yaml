name: Autosomal Recessive Nonsyndromic Hearing Loss 97
creation_date: '2026-08-28T21:00:00Z'
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 97
  term:
    id: MONDO:0014739
    label: autosomal recessive nonsyndromic hearing loss 97
synonyms:
- DFNB97
- deafness, autosomal recessive 97
- MET-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 97
description: >-
  DFNB97 denotes severe prelingual nonsyndromic sensorineural hearing loss associated with a homozygous
  MET p.Phe841Val variant in a large Pakistani family. MET encodes the hepatocyte growth factor receptor.
  The ClinGen Hearing Loss Gene Curation Expert Panel classified the recessive MET–hearing loss association
  as Limited in March 2021; causality and the human cochlear lesion remain incompletely established. A
  Moroccan child with bilateral total hearing loss and homozygous p.Ile316Met was also reported, but that
  variant has a later likely benign ClinVar submission covering conditions including DFNB97 and should
  not be counted as independent confirmation of causality. Conditional mouse experiments support a proposed
  developmental mechanism involving failed melanocyte incorporation into the stria vascularis. These gene-level
  experiments do not demonstrate the effects of either human missense allele on receptor signaling.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

external_assertions:
- name: ClinGen MET-nonsyndromic hearing loss gene-disease validity assertion
  source: ClinGen
  assertion_type: gene_disease_validity
  external_id: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
  url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
  description: >-
    The ClinGen Hearing Loss Gene Curation Expert Panel classified the autosomal recessive MET–nonsyndromic
    hearing loss relationship as Limited on March 26, 2021. Only one of three reported missense variants
    was scored; the others had an inconsistent phenotype or an allele frequency incompatible with pathogenicity.
    Expression, biochemical and mouse evidence support biological plausibility, but the panel considered
    the evidence insufficient to establish causality.
  evidence:
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: MET | HGNC:7029 | nonsyndromic genetic hearing loss | MONDO:0019497 | AR | Limited
    explanation: >-
      The classification row directly documents Limited gene-disease validity; it does not establish a
      causative relationship.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is limited evidence to support this gene-disease association.
    explanation: >-
      The expert-panel summary supports retaining uncertainty in the human gene-disease association.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although more evidence is needed to support a causal role, no convincing evidence has
      emerged that contradicts the gene-disease association.
    explanation: >-
      At the 2021 assessment the panel found insufficient support for causality without convincing contradictory
      gene-level evidence.
  notes: >-
    The panel's evidence summary explains why only one of the three reported variants scored:
    "Only one missense variant was scored as the probands with the other variant had
    inconsistent phenotypes with nonsyndromic hearing loss and the minor allele frequency of
    the other variant was too high to be considered pathogenic." That is the specific reason
    the classification did not rise above Limited.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Population prevalence is unknown. The founding report describes nine affected members of one Pakistani
    family. A later Moroccan case report claimed a second family, but the p.Ile316Met interpretation is
    disputed by a later likely benign ClinVar submission. These reports cannot be treated as two equally
    established molecular diagnoses. Screening 100 additional Pakistani families with unexplained moderate-to-profound
    hearing loss identified no additional families linked to DFNB97; this selected-family screen is not
    a population prevalence estimate.
  evidence:
  - reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to find the contribution of the newly mapped locus to deafness, we screened 100 families
      in which the moderate to profound hearing loss was not attributable to a known deafness gene variant.
      No other families were identified, which suggests that DFNB97 is a rare cause of hearing loss in
      Pakistan.
    explanation: >-
      The negative selected-family screen supports rarity in this ascertainment setting, not a population
      rate.
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, this study reports the second family in the world associating deafness and
      mutation in the MET gene.
    explanation: >-
      The authors reported a second candidate family; subsequent variant interpretation limits using that
      count as confirmed DFNB97.

pathophysiology:
- name: Biallelic MET Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous NM_000245.2:c.2521T>G (p.Phe841Val) segregated with severe early hearing loss in nine members
    of Pakistani family HLGM17 after linkage to 7q31.2. The variant lies in the extracellular IPT4 domain
    and was absent from the study controls and public databases examined in 2015. A linked regulatory
    variant remains an alternative explanation. Structural predictions suggest reduced protein stability,
    but receptor binding and signaling were not measured. An exon-trap assay was performed: 63 of 65 mutant-derived
    clones matched wild type, and the two aberrant products could reflect a small splice effect or artifacts.
    The separately reported p.Ile316Met variant is not treated as a confirmed pathogenic trigger.
  genetic_context:
    gene:
      preferred_term: MET
      term:
        id: hgnc:7029
        label: MET
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous p.Phe841Val in the founding family. The variant has segregation evidence, mixed computational
      predictions and an inconclusive exon-trap result; a loss-of-function category is not assigned without
      a demonstrated receptor defect.
  downstream:
  - target: Reduced HGF/MET Signalling in the Developing Cochlea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced receptor signaling is a proposed consequence of p.Phe841Val based on its extracellular domain
      location and structural predictions; it has not been demonstrated by a receptor signaling assay.
  evidence:
  - &id002
    reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant co-segregated with the phenotype, being homozygous in all 9 affected individuals, and
      was absent from DNA of 400 ethnically matched individuals (800 chromosomes).
    explanation: >-
      Segregation and absence from the study controls support candidacy, without excluding a linked causal
      variant.
  - &id001
    reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, since we only analyzed exonic regions, it is possible that a mutation in a regulatory region
      of MET or in a cis-acting element of any of the other 16 genes in the critical DFNB97 interval may
      be responsible for the hearing loss in family HLGM17 and the p.F841V variant is in linkage disequilibrium
      with the pathogenic allele.
    explanation: >-
      The founding study did not exclude linked regulatory variation as the actual cause.
  - &id003
    reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Results of the experiments revealed that all but 2 of the total 65 clones derived from the transfection
      of mutant construct were identical to those obtained after transfection of the wild-type construct.
    explanation: >-
      The exon-trap experiment mostly reproduced wild-type splicing; two aberrant clones do not establish
      a pathogenic splice defect.
  - &id006
    reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This indicates that the c.2521T>G mutation may have a limited effect on splicing or alternatively,
      the mutation does not affect splicing and the two aberrant splicing products are experimental artifacts.
    explanation: >-
      The authors explicitly retain both a small splice effect and an experimental-artifact interpretation.
  - reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Modelling the p.F841V mutation with CUPSAT and I-Mutant 2.0 using the crystal structure of IPT2-IPT410
      (PDB ID, 2CEW) and the amino acid sequence of MET (NP_000236.2) predicted a decrease in the overall
      stability of the resulting protein.
    explanation: >-
      Predicted destabilization is computational support, not measured receptor dysfunction.

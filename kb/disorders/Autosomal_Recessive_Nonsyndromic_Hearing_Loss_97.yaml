diagnosis:
- name: Comprehensive genetic evaluation and cautious MET interpretation
  description: >-
    Use a comprehensive hearing-loss panel or genomic testing with clinical correlation and segregation
    analysis. In the founding study, established recessive hearing-loss genes were excluded before the
    MET candidate was identified. That discovery workflow is not a requirement for sequential single-gene
    testing. A MET finding must be assessed in the context of Limited gene-disease validity; variants
    of uncertain significance cannot confirm a diagnosis.
  evidence:
  - reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of GJB2 and all other genes reported to underlie recessive deafness were ruled
      out as the cause of the phenotype in the affected members of the participating family.
    explanation: >-
      The exclusion step that preceded the DFNB97 diagnosis in the founding family.

  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A multigene hearing loss panel ... can often identify the cause of genetic hearing loss while limiting
      identification of pathogenic variants and variants of ... uncertain significance ... in genes that
      are irrelevant to the underlying
    explanation: >-
      General guidance supports broad hearing-loss testing rather than isolated MET testing.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of ... uncertain significance ... cannot be used to confirm or
      rule out the diagnosis.

name: Autosomal Recessive Nonsyndromic Hearing Loss 97
creation_date: "2026-08-28T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 97
  term:
    id: MONDO:0014739
    label: autosomal recessive nonsyndromic hearing loss 97
synonyms:
- DFNB97
- deafness, autosomal recessive 97
- MET-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 97
description: >-
  DFNB97 is severe, prelingual, isolated sensorineural hearing loss attributed to biallelic
  missense variants in MET, the receptor tyrosine kinase for hepatocyte growth factor. Two
  families have been published: a large consanguineous Pakistani kindred mapped in 2015, and
  a single Moroccan girl in 2019.

  The mechanism, unlike the gene, is not about cancer. HGF is expressed in the developing
  cochlear epithelium at the future stria vascularis, and MET is expressed both there and on
  the neural-crest-derived melanocytes that migrate in to form the intermediate cell layer.
  That layer is what makes the stria vascularis able to hold the endolymph's potassium
  concentration and generate the endocochlear potential - the battery that drives hair cell
  transduction. Inactivating MET in mouse stops the melanocytes incorporating, and the
  animals are profoundly deaf as young adults. So DFNB97 is a developmental disease of a
  nonsensory structure, and the hair cells are downstream bystanders.

  Two things about this entry need stating before it is read. First, the gene. MET is an
  oncogene and its literature is overwhelmingly tumour biology; none of that is relevant
  here, and the affected Pakistani family was explicitly free of cancer. Second, the
  strength of the claim. The ClinGen Hearing Loss Gene Curation Expert Panel classifies
  MET-nonsyndromic hearing loss as Limited - not disputed, but not established either, and
  the panel's stated reason is that the evidence is case-level with only one variant scoring.
  The entry is curated to that standard rather than above it.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

external_assertions:
- name: ClinGen MET-nonsyndromic hearing loss gene-disease validity assertion
  source: ClinGen
  assertion_type: gene_disease_validity
  external_id: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The founding consanguineous Pakistani pedigree supports recessive inheritance at the DFNB97 locus:
    p.Phe841Val was homozygous in nine affected relatives. This segregation does not independently establish
    the variant as causal. Recurrence counseling based on MET requires careful confirmation of the familial
    molecular diagnosis.

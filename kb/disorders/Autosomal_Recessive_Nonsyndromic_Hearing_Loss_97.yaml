phenotypes:
- category: Otologic
  name: Severe Prelingual Sensorineural Hearing Loss
  severity: SEVERE
  description: >-
    Nine affected relatives in the founding Pakistani family had severe sensorineural hearing loss. Pure-tone
    averages from 500 to 4000 Hz were 74–89 dB HL, measured in ambient noise. The separately reported
    Moroccan p.Ile316Met case had total bilateral hearing loss, but its uncertain molecular attribution
    precludes using it to establish the severity range of confirmed MET-related disease.
  phenotype_term:
    preferred_term: Severe sensorineural hearing impairment
    term:
      id: HP:0008625
      label: Severe sensorineural hearing impairment
  evidence:
  - reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiometry in ambient noise conditions revealed a severe degree of sensorineural hearing
      loss (pure tone average, PTA500 Hz-4000 Hz, 74–89 dB HL) with intra-familial variations
      in thresholds, (figure 1B).
    explanation: >-
      The audiometric thresholds and the intrafamilial range.
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel pathogenic homozygous c.948A>G (p.Ile316Met) mutation in the MET
      gene in one deaf Moroccan young girl carrying a total bilateral non-syndromic hearing
      impairment.
    explanation: >-
      Documents the phenotype of the reported Moroccan case, while the causal interpretation of p.Ile316Met
      is not accepted as established.


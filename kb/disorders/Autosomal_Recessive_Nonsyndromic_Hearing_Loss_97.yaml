  description: >-
    The ClinGen Hearing Loss Gene Curation Expert Panel classifies the autosomal recessive
    MET-nonsyndromic hearing loss relationship as Limited. This sits above Disputed and below
    Definitive: the panel found no contradicting evidence, but the supporting evidence is
    case-level, and of the three reported missense variants only one scored - the other
    probands had phenotypes inconsistent with nonsyndromic hearing loss or an allele
    frequency too high to be pathogenic. The mouse work is what the panel credits as
    experimental support.
  evidence:
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "MET | HGNC:7029 | nonsyndromic genetic hearing loss | MONDO:0019497 | AR | Limited"
    explanation: >-
      The expert-panel classification row. Graded PARTIAL because Limited neither supports
      nor refutes the relationship - it says the evidence is real but insufficient.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In summary, there is limited evidence to support this gene-disease association.
    explanation: >-
      The panel's summary sentence, which is the calibration this entry is written to.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although more evidence is needed to support a causal role, no convincing evidence has
      emerged that contradicts the gene-disease association.
    explanation: >-
      The half of the classification that distinguishes Limited from Disputed, and the reason

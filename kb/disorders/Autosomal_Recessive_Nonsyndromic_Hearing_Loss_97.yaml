    HGF and c-Met are expressed in the developing cochlea. Conditional mouse disruption supports a requirement
    for this signaling pathway in strial melanocyte incorporation. Reduced signaling is proposed, rather
    than directly measured, for the human p.Phe841Val allele.
  locations:

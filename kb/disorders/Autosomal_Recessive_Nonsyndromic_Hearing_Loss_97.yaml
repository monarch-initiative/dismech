      and there was no history of cancers in the family.
    explanation: >-
      Graded REFUTE against the bound HP term: neoplasia was looked for at family-history
      level and was absent. As with the vestibular entry, the negative is carried by the
      grading because the schema cannot bind an absent phenotype.
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."

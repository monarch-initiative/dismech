    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both families are consanguineous and both probands are homozygous. In the Pakistani
    kindred the allele cosegregated across nine affected individuals spanning ages 5 to 60,
    with heterozygous relatives unaffected - the deepest segregation evidence this entity has.
  evidence:
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping with a dense array of one million SNP markers allowed us to map the
      gene for recessively inherited severe hearing loss to chromosome 7q31.2, defining a new
      deafness locus designated DFNB97 (maximum logarithm of the odds score of 4.8).
    explanation: >-
      The linkage result establishing recessive inheritance and the locus itself.

animal_models:

- name: Conditional c-Met inner ear inactivation mouse
  species: Mouse
  genotype: Conditional inactivation of c-Met (and, in parallel arms, of Hgf) in the developing inner ear
  publication: PMID:27488639
  description: >-
    The source of the entire mechanism. It establishes where the ligand and receptor are
    expressed in the developing cochlea, shows by genetic dissection that melanocyte
    incorporation into the future stria vascularis requires c-MET signalling, and shows that
    developmental inactivation produces profound hearing loss in young adults. The paper
    names DFNB97 as one of the human diseases its mechanism may underlie.
  modeled_mechanisms:
  - target: Failed Melanocyte Incorporation into the Stria Vascularis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Removing c-MET signalling in the developing inner ear stops the neural-crest-derived
      melanocytes entering the strial intermediate layer.
    limitations: >-
      This is a conditional inactivation, not a knock-in of either human missense allele.
      Whether p.Phe841Val or p.Ile316Met reduces signalling enough to reproduce the
      developmental failure is exactly what has not been tested, and it is the reason
      ClinGen rates the human relationship Limited. Human cochlear histology in DFNB97 does
      not exist and will not, so the strial defect in patients is inferred from the mouse
      rather than observed.
    readouts:
    - name: Melanocyte incorporation into the strial intermediate cell layer
      target: Failed Melanocyte Incorporation into the Stria Vascularis
      direction: DECREASED
      interpretation: >-
        Incorporation fails without c-MET signalling, which is the developmental defect this
        node describes.
      evidence:
      - reference: PMID:27488639
        reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Genetic dissection of HGF signaling via c-MET reveals that the incorporation of the
          melanocytes into the future stria vascularis of the cochlear duct requires c-MET
          signaling.
        explanation: >-
          The genetic result behind this readout.
    evidence:
    - reference: PMID:27488639
      reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings reveal a novel mechanism that may underlie human deafness DFNB39 and
        DFNB97.
      explanation: >-
        The authors' statement that this model is offered as the mechanism for DFNB97.
  - target: Severe Prelingual Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Developmental inactivation of the receptor produces profound hearing loss in young adult
      mice, matching the severity and the developmental timing of the human phenotype.
    limitations: >-
      The mouse loss is described as profound and the human families are severe, and the mouse
      is a conditional null where the patients carry missense alleles - so the model probably
      sits at a more severe point on the allelic range than the disease does. Onset is
      "young adult" in mouse against prelingual in humans, which are not directly comparable
      developmental stages.
    readouts:
    - name: Hearing threshold after developmental inactivation
      target: Severe Prelingual Sensorineural Hearing Loss
      direction: DECREASED
      interpretation: >-
        Hearing is profoundly impaired, closing the chain from signalling loss to the clinical
        endpoint within a single organism.
      evidence:
      - reference: PMID:27488639
        reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, inactivation of either the ligand or receptor developmentally resulted
          in a profound hearing loss at young adult stages.
        explanation: >-
          The hearing measurement behind this readout, reported for the receptor arm as well
          as the ligand arm.
    evidence:
    - reference: PMID:27488639
      reference_title: Hepatocyte Growth Factor-c-MET Signaling Mediates the Development of Nonsensory Structures of the Mammalian Cochlea and Hearing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results suggest a novel connection between HGF signaling and deafness via
        melanocyte deficiencies.
      explanation: >-
        Supports treating this model as informative for the clinical endpoint.

diagnosis:
- name: Exome or comprehensive panel sequencing after excluding common causes
  description: >-
    DFNB97 has no distinguishing clinical feature; severe prelingual nonsyndromic hearing
    loss looks the same whatever causes it. Both published families reached the diagnosis the
    same way - by excluding GJB2 and the other established recessive deafness genes first,
    then sequencing. Given a Limited gene-disease classification and two families worldwide,
    a MET finding should be treated as a candidate that requires the common causes to have
    been ruled out, not as a first-line result.
  evidence:
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations of GJB2 and all other genes reported to underlie recessive deafness were ruled
      out as the cause of the phenotype in the affected members of the participating family.
    explanation: >-
      The exclusion step that preceded the DFNB97 diagnosis in the founding family.

differential_diagnoses:
- name: HGF-related nonsyndromic hearing loss (DFNB39)
  description: >-
    The paired locus, and a genuinely different disease. DFNB39 is caused by noncoding
    variants in HGF - two deletions in a conserved part of the 3' untranslated region of a
    short HGF isoform, and a silent substitution that alters splicing - rather than by coding
    variants in the receptor. It is common in Pakistani families where DFNB97 is not: 40
    consanguineous families mapped to the locus, against the single family that defines
    DFNB97 after 100 more were screened.

    The two converge downstream. Both disable HGF/MET signalling at the developing stria
    vascularis, and the mouse modelling the DFNB39 noncoding deletion is the animal in which
    the endocochlear potential reduction was actually measured. They are curated as separate
    entities because the gene, the variant class and the population frequency all differ,
    and evidence from the HGF side is graded PARTIAL wherever it appears in this entry.
  evidence:
  - reference: PMID:19576567
    reference_title: "Noncoding mutations of HGF are associated with nonsyndromic hearing loss, DFNB39."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the noncoding sequences of genes, as well as noncoding genes, and found
      three mutations clustered in intron 4 and exon 5 in the hepatocyte growth factor gene
      (HGF).
    explanation: >-
      Establishes the variant class that distinguishes DFNB39 from DFNB97.
  - reference: PMID:19576567
    reference_title: "Noncoding mutations of HGF are associated with nonsyndromic hearing loss, DFNB39."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped an additional 40 consanguineous families segregating nonsyndromic hearing loss
      to the DFNB39 locus and refined the obligate interval to 1.2 Mb.
    explanation: >-
      The family count, which is the practical reason DFNB39 is the likelier diagnosis in the
      population where both were found.
  - reference: PMID:32152201
    reference_title: "Noncoding Microdeletion in Mouse Hgf Disrupts Neural Crest Migration into the Stria Vascularis, Reduces the Endocochlear Potential, and Suggests the Neuropathology for Human Nonsyndromic Deafness DFNB39."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previous studies showed that developmental incorporation of neural crest cells into the
      SV depends on signaling from HGF/MET.
    explanation: >-
      States the shared downstream mechanism that makes these two entities converge, which is
      why they need separating explicitly.

- name: Hereditary papillary renal cell carcinoma (MET-related)
  description: >-
    The other germline MET disease, and the one a MET-focused literature search will surface
    first. It is dominant, caused by activating kinase-domain missense variants, presents as
    renal tumours in adulthood, and ClinGen rates it Definitive. It has no auditory
    phenotype and DFNB97 has no neoplastic one - the affected family was screened and had
    neither tumours nor organ disease. Listed here so the separation is explicit in the entry
    rather than assumed.
  evidence:
  - reference: PMID:25941349
    reference_title: "A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medical conditions including those related to liver, kidney and heart were not reported
      and there was no history of cancers in the family.
    explanation: >-
      The clinical evidence that the DFNB97 family carried no renal or neoplastic phenotype,
      which is what separates the two germline MET diseases at the bedside.

discussions:

- discussion_id: gap_met_allele_function_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic MET Missense Variant
  - pathophysiology#Reduced HGF/MET Signalling in the Developing Cochlea
  - genetic#MET
  prompt: >-
    Do the two reported DFNB97 missense alleles actually reduce HGF/MET signalling?
  rationale: >-
    Neither allele has been assayed. p.Phe841Val was called damaging by prediction programs;
    p.Ile316Met was run through a molecular dynamics simulation that reported loss of
    flexibility in the SEMA domain. Both are computational, and neither has been followed by
    a binding, phosphorylation or downstream-signalling measurement in any system.

    This is the specific gap that keeps the gene-disease classification at Limited. The mouse
    supplies a complete developmental mechanism, but it does so by removing the receptor
    entirely; the human alleles are missense and might be hypomorphic, or might be neutral in
    a consanguineous genome full of other homozygous variants. Nothing published distinguishes
    those.

    It is also tractable. MET signalling assays are routine because of the oncology
    literature, so the reagents to test a germline missense allele already exist - the
    experiment has simply not been done for these two.
  proposed_experiments:
  - experiment_id: met_dfnb97_allele_signalling_assay
    name: Functional characterisation of p.Phe841Val and p.Ile316Met MET signalling
    description: >-
      Express each variant receptor alongside wild type in a MET-null cell background, and
      measure HGF binding, receptor autophosphorylation and downstream ERK and AKT activation
      against wild type and against a known kinase-dead control.
    would_support:
    - pathophysiology#Reduced HGF/MET Signalling in the Developing Cochlea
    supporting_outcome:
    - >-
      Both alleles reduce HGF-dependent receptor activation relative to wild type, which would
      supply the variant-level functional evidence ClinGen names as missing and would connect
      the human genotype to the mouse mechanism.
    refuting_outcome:
    - >-
      The alleles signal normally, which would leave the two families' hearing loss without a
      mechanistic account through MET and would push the gene-disease relationship toward
      Disputed rather than Limited.

- discussion_id: mismatch_endocochlear_potential_measured_in_hgf_arm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Endolymphatic Potassium Homeostasis
  - animal_models#Conditional c-Met inner ear inactivation mouse
  prompt: >-
    Is the endocochlear potential actually reduced in MET-deficient cochleae, or is that
    inferred from the HGF arm of the same pathway?
  rationale: >-
    It is inferred. The endocochlear potential has been measured in a mouse carrying a
    noncoding Hgf deletion, where it is significantly reduced alongside failed neural crest
    infiltration of the strial intermediate layer. That mouse models DFNB39. The c-Met
    inactivation study reports failed melanocyte incorporation and profound hearing loss but
    does not report an endocochlear potential.

    The inference is a good one - the two manipulations disable the same ligand-receptor pair
    at the same structure - but it is an inference, and the entry marks it by grading the HGF
    measurement PARTIAL wherever it appears. The gap matters because the endocochlear
    potential is the step that converts a developmental defect into a functional one, and
    because a reduced-but-present potential and an abolished one imply different residual
    hearing and different windows for intervention.
  proposed_experiments:
  - experiment_id: met_conditional_endocochlear_potential
    name: Endocochlear potential measurement in conditional c-Met inner ear mutants
    description: >-
      Measure the endocochlear potential directly in the conditional c-Met inner ear mutant at
      the same age at which it was measured in the Hgf del10 mouse, alongside strial
      histology, and compare the magnitude of the reduction between the two arms.
    would_support:
    - pathophysiology#Failure of Endolymphatic Potassium Homeostasis
    supporting_outcome:
    - >-
      The potential is reduced in the receptor arm to a comparable degree, which would let the
      HGF measurement be retired from this entry and the node stand on MET evidence alone.
    refuting_outcome:
    - >-
      The potential is preserved despite failed melanocyte incorporation, which would mean the
      deafness in the receptor arm runs through some other consequence of the strial defect
      and this node is wrong as written.

notes: >-
  Named entity check, and it is the reason this entry was flagged. MET is an oncogene and its
  literature is overwhelmingly tumour biology, so a gene-frequency preflight on any MET
  retrieval passes trivially while telling you nothing. Deep-research preflight on the report
  for this disease flagged HGF at 33% of MET mentions - the paired DFNB39 locus bleeding in -
  and every citation used here was checked individually for whether it is about the deafness
  phenotype rather than about MET.

  Nothing from the oncology literature is curated. Somatic amplification, exon 14 skipping,
  kinase-domain activation and hereditary papillary renal cell carcinoma appear only in the
  gene notes and the differential diagnoses, as the things DFNB97 is not. The clinical
  counterpart is curated as a phenotype: the affected family was screened and had no tumours
  and no liver, kidney or heart disease.

  HGF separation. DFNB39 is a different disease with a different gene and a different variant
  class, and it converges with DFNB97 only downstream. The one place HGF evidence is used for
  a DFNB97 node is the endocochlear potential, because that is where the measurement exists;
  it is graded PARTIAL, labelled in the node description, and carries its own
  HUMAN_MODEL_MISMATCH discussion. The 2016 c-MET paper is different: it inactivates ligand
  and receptor in parallel arms and reports the receptor result, so it is MET evidence and is
  graded accordingly.

  Two absent phenotypes, one schema limitation. Preserved vestibular function and absence of
  neoplasia are both examined-and-negative findings that matter for this disease. The schema
  has no way to bind an absent phenotype - Phenotype has no presence slot and FrequencyEnum
  has no EXCLUDED value - so each is curated with the HP term for the thing that is absent
  and evidence graded REFUTE, with the description carrying the negative. This is a
  workaround and is flagged as one.

  Evidence grading. The mechanism is mouse and is graded MODEL_ORGANISM throughout. The
  molecular dynamics analysis of the Moroccan allele is graded COMPUTATIONAL and PARTIAL
  rather than being allowed to stand in for a functional assay - that absence is the subject
  of a knowledge gap.

  What is deliberately absent. No treatments: management is generic hearing habilitation with
  no DFNB97-specific evidence, and a curated treatment implies a curated indication. No
  clinical trials, no datasets, no biochemical markers.


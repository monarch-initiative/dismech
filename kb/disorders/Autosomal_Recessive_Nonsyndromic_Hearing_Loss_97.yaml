genetic:

- name: MET
  gene_term:
    preferred_term: MET
    term:
      id: hgnc:7029
      label: MET
  relationship_type: CAUSATIVE
  notes: >-
    Typed CAUSATIVE rather than DISPUTED, matching ClinGen's Limited classification - the
    panel found no contradicting evidence, only insufficient supporting evidence. The
    knowledge gap recorded in the discussions section carries the uncertainty; the
    relationship type should not double-count it.

    MET encodes the receptor tyrosine kinase for hepatocyte growth factor. Its dominant
    identity in the literature is oncological - somatic amplification, exon 14 skipping and
    kinase-domain activation across lung, gastric and renal cancers, and a germline
    relationship with hereditary papillary renal cell carcinoma that ClinGen separately rates
    Definitive. None of that is this disease. DFNB97 is caused by recessive germline missense
    alleles producing a developmental deficit in one nonsensory cochlear structure, in
    families without cancer.

    Three missense variants have been reported across three publications. Only one was
    scored by the ClinGen review; of the others, one proband had a phenotype inconsistent
    with nonsyndromic hearing loss and one variant was too common in the population to be
    pathogenic.
  evidence:
  - reference: PMID:31801140
    reference_title: Further Evidence for the Implication of the MET Gene in Non-Syndromic Autosomal Recessive Deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the mesenchymal epithelial transition factor (MET) gene are frequently
      associated with multiple human cancers but can also lead to human non-syndromic
      autosomal recessive deafness (DFNB97).
    explanation: >-
      States the two-identity problem explicitly and separates the deafness relationship from
      the cancer one.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Only one missense variant was scored as the probands with the other variant had
      inconsistent phenotypes with nonsyndromic hearing loss and the minor allele frequency of
      the other variant was too high to be considered pathogenic.
    explanation: >-
      The specific reason the reported variant count overstates the evidence, and the reason
      the classification is Limited.
  - reference: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
    reference_title: MET / nonsyndromic genetic hearing loss (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One missense variant in this gene segregated with disease in 8 additional family
      members (PMID: 25941349).
    explanation: >-
      The segregation count credited by the panel.


  description: >-
    Vestibular function is spared, which is consistent with a lesion confined to the stria
    vascularis of the cochlear duct rather than a general inner-ear defect. Affected
    individuals walked independently at 12 to 13 months and had normal tandem gait and
    Romberg testing.

      Interpretation uncertainty must be preserved when considering candidate MET alleles.
    directness: INDIRECT
- name: Audiometry and clinical assessment
  description: >-
    Establish hearing severity, onset and associated findings through audiometry and clinical evaluation.
    In the founding family, severe sensorineural loss was measured in ambient noise; clinical vestibular
    screening was reassuring, while laboratory and funduscopic examinations were reported for only two
    affected relatives.
  evidence:
  - reference: PMID:25941349
    reference_title: A mutation of MET, encoding hepatocyte growth factor receptor, is associated with human DFNB97 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiometry in ambient noise conditions revealed a severe degree of sensorineural hearing
      loss (pure tone average, PTA500 Hz-4000 Hz, 74–89 dB HL) with intra-familial variations
      in thresholds, (figure 1B).
    explanation: >-
      The audiometric thresholds and the intrafamilial range.
differential_diagnoses:
- name: HGF-related nonsyndromic hearing loss (DFNB39)
  description: >-
    DFNB39 is associated with HGF variants affecting noncoding sequence or splicing, whereas DFNB97 is
    associated with candidate missense variation in the MET receptor. The two genes participate in a shared
    signaling pathway and can produce overlapping hearing phenotypes. Hgf mouse data support pathway-level
    inference but are not direct evidence for the human MET variants. Reported family counts from differently
    ascertained studies do not establish comparative population frequencies.
  evidence:
  - reference: PMID:19576567
    reference_title: Noncoding mutations of HGF are associated with nonsyndromic hearing loss, DFNB39.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the noncoding sequences of genes, as well as noncoding genes, and found
      three mutations clustered in intron 4 and exon 5 in the hepatocyte growth factor gene
      (HGF).
    explanation: >-
      Establishes the variant class that distinguishes DFNB39 from DFNB97.
  - reference: PMID:19576567
    reference_title: Noncoding mutations of HGF are associated with nonsyndromic hearing loss, DFNB39.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped an additional 40 consanguineous families segregating nonsyndromic hearing loss
      to the DFNB39 locus and refined the obligate interval to 1.2 Mb.
    explanation: >-
      Documents the linked families in this study; the count is not a population prevalence estimate.
  - reference: PMID:32152201
    reference_title: Noncoding Microdeletion in Mouse Hgf Disrupts Neural Crest Migration into the Stria Vascularis, Reduces the Endocochlear Potential, and Suggests the Neuropathology for Human Nonsyndromic Deafness DFNB39.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previous studies showed that developmental incorporation of neural crest cells into the
      SV depends on signaling from HGF/MET.
    explanation: >-
      States the shared downstream mechanism that makes these two entities converge, which is
      why they need separating explicitly.

discussions:
- discussion_id: gap_met_allele_function_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic MET Missense Variant
  - pathophysiology#Reduced HGF/MET Signalling in the Developing Cochlea
  - genetic#MET
  prompt: >-
    Do the two reported DFNB97 missense alleles actually reduce HGF/MET signalling?
  rationale: >-
    The founding study performed an exon-trap assay, but it was inconclusive and did not measure HGF binding,
    receptor activation or downstream signaling. Structural predictions for p.Phe841Val and molecular
    dynamics for p.Ile316Met cannot establish a receptor defect. The latter allele also has a later likely
    benign ClinVar assertion. Conditional mouse loss of Met supports a gene-level mechanism, while variant
    causality, linked regulatory alternatives and residual signaling remain unresolved.
  proposed_experiments:
  - experiment_id: met_dfnb97_allele_signalling_assay
    name: Functional characterisation of p.Phe841Val and p.Ile316Met MET signalling
    description: >-
      Express each variant receptor alongside wild type in a MET-null cell background, and
      measure HGF binding, receptor autophosphorylation and downstream ERK and AKT activation
      against wild type and against a known kinase-dead control.
    would_support:
    - pathophysiology#Reduced HGF/MET Signalling in the Developing Cochlea
    supporting_outcome:
    - >-
      A reproducible allele-specific reduction in receptor activation would support the proposed mechanism,
      with interpretation integrated with segregation and population data.
    refuting_outcome:
    - >-
      Normal signaling would weaken the proposed receptor defect in the tested system, while leaving possible
      tissue-specific, splice or linked regulatory effects to investigate. It would not by itself determine
      a ClinGen classification.
- discussion_id: mismatch_endocochlear_potential_measured_in_hgf_arm
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Endocochlear Potential
  - animal_models#Conditional c-Met inner ear inactivation mouse
  - animal_models#Hgf del10 pathway-comparator mouse
  prompt: >-
    How closely does strial dysfunction in Hgf and conditional Met mouse models reproduce human MET-associated
    hearing loss?
  rationale: >-
    The Hgf del10 mouse provides a direct endocochlear-potential measurement and models DFNB39. The c-Met
    conditional-inactivation study establishes developmental strial and auditory abnormalities. Neither
    experiment directly measures the cochlear consequence of p.Phe841Val in humans. Variant-specific models
    and matched physiological measurements are needed to establish how far the ligand and receptor experiments
    generalize to the human candidate association.
  proposed_experiments:
  - experiment_id: met_conditional_endocochlear_potential
    name: Endocochlear potential measurement in conditional c-Met inner ear mutants
    description: >-
      Measure the endocochlear potential directly in the conditional c-Met inner ear mutant at
      the same age at which it was measured in the Hgf del10 mouse, alongside strial
      histology, and compare the magnitude of the reduction between the two arms.
    would_support:
    - pathophysiology#Reduced Endocochlear Potential
    supporting_outcome:
    - >-
      A reduced potential associated with strial abnormalities would strengthen the proposed receptor-to-strial
      physiology link while leaving human variant causality to be tested.
    refuting_outcome:
    - >-
      Preserved potential despite hearing loss would argue for an additional or alternative auditory mechanism
      in that model.
notes: >-
  In the founding family, independent walking was reported at 12–13 months and tandem gait and Romberg
  tests were normal, suggesting intact or residual peripheral vestibular function. These bedside observations
  do not localize the cochlear lesion or exclude subtle vestibular dysfunction. No liver, kidney or heart
  conditions or cancer history were reported. Normal blood counts, serum chemistry, urinalysis, liver
  tests and funduscopy were documented in only two affected individuals aged 12 and 15 years; this is
  not evidence of lifelong absence of neoplasia or systemic disease in all affected people.


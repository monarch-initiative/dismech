genetic:
- name: NRAS post-zygotic activating mutations
  gene_term:
    preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    The causal lesion, found in affected skin and affected central nervous system tissue of the same
    patient and absent from their blood. Codon 61 is the hotspot; p.Q61K predominates.

    No ClinGen gene-disease validity assertion for this pair is cached here, so none is recorded. The
    relationship_type is the curator's reading of the primary literature: one series of fifteen patients
    with the mutation in twelve, in matched affected and unaffected tissue, plus a mouse model of the
    central nervous system arm.
  variants:
  - name: p.Q61K
    description: c.181C>A, the commoner of the two alleles, in ten of twelve mutation-positive patients.
  - name: p.Q61R
    description: c.182A>G, in two of twelve.
  evidence:
  - reference: PMID:23392294
    reference_title: >-
      Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by postzygotic
      mutations in codon 61 of NRAS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that single postzygotic NRAS mutations are responsible for multiple CMN
      and associated neurological lesions in the majority of cases.
    explanation: >-
      The authors' own statement of the gene-disease relationship, with their hedge: suggest, and in
      the majority of cases rather than all.
- name: BRAF
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    An alternative lesion in a minority. It matters clinically rather than only taxonomically: a
    BRAF-variant patient has a drug the NRAS ones do not. Graded CAUSATIVE on two cited sources
    rather than one - a prospective cohort in which 2 of the 16 patients with the neural lesion
    carried BRAF V600E and whose authors call it a novel finding, and a case report of sustained
    improvement on BRAF inhibition. The schema maps CAUSATIVE to ClinGen Definitive or Strong, and
    no external body has graded this pair, so read it as the curator's reading of two reports rather
    than as a copied tier; gene_disease_validity is deliberately empty for that reason.
  evidence:
  - reference: PMID:42384401
    reference_title: >-
      BRAF Inhibition in Congenital Nevi and Neural Melanosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case report describes sustained neurologic and cutaneous improvement following BRAF
      inhibition in a patient with BRAF V600E-variant neurocutaneous melanosis.
    explanation: >-
      A BRAF V600E patient, and the consequence of being one: sustained improvement on a BRAF
      inhibitor. One patient, which is why this row claims the alternative lesion exists and nothing
      about how often.
  - reference: PMID:25490715
    reference_title: >-
      BRAF mutations are also associated with neurocutaneous melanocytosis and large/giant
      congenital melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurocutaneous melanocytosis (NCM) affected 16 (24.2%) of 66 patients, with NRAS Q61 mutation
      in 12 (75.0%), and BRAF V600E in 2 (12.5%), P=0.009.
    explanation: >-
      How often, from a prospective cohort of 66 congenital melanocytic naevus patients: of the 16
      who had the neural lesion, 12 carried NRAS Q61 and 2 carried BRAF V600E. Two patients, which
      is the basis for recording BRAF as a causative alternative rather than only as a case report.
  - reference: PMID:25490715
    reference_title: >-
      BRAF mutations are also associated with neurocutaneous melanocytosis and large/giant
      congenital melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, although NRAS Q61 mutations predominate, BRAF V600E mutation also affects
      patients with large/giant CMN (L/GCMN), and with NCM, a novel finding.
    explanation: >-
      The authors' own statement of what is established and how new it is. The grade CAUSATIVE rests
      on this plus the treated case report, not on the case report alone.
diagnosis:
- name: Screening brain and spine magnetic resonance imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the neuraxis
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The test that finds the neural half, and the one argued about. Imaging every infant with more than one congenital melanocytic naevus finds the lesion in a fifth to
    a third of them, depending on the series and on what counts as an abnormality. What proportion
    of those are symptom-free is not reported by the series that give those figures. Whether finding
    the lesion changes anything is the open question this entry records.
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Japanese pediatric patients with CMN under 1 year of age were included between January 2020
      and November 2022, and all patients underwent brain MRI to check for NCM in this study.
    explanation: >-
      The screening design: every infant imaged, which is what makes the 31.6% figure a prevalence
      in that group rather than a yield in the symptomatic.
  - reference: PMID:25966033
    reference_title: >-
      Classification of neurological abnormalities in children with congenital melanocytic naevus
      syndrome identifies magnetic resonance imaging as the best predictor of clinical outcome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For screening for congenital neurological lesions a single MRI in multiple CMN is a clinically
      relevant strategy.
    explanation: >-
      The conclusion of the 289-patient screened cohort, which is as close to an answer as the cited
      literature comes. It says the scan is a relevant strategy, not that acting on it changes the
      course; the entry's discussion records that second question as the one still open.
- name: Cerebrospinal fluid cytology and immunohistochemistry
  diagnosis_term:
    preferred_term: immunohistochemistry on cerebrospinal fluid
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    Used with imaging to confirm leptomeningeal melanosis without a biopsy of the meninges. The 1991
    review that proposed the diagnostic criteria names it and gadolinium-enhanced magnetic resonance
    imaging as the useful procedures, which is where this row comes from.
  evidence:
  - reference: PMID:29948137
    reference_title: >-
      Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
      case-based update.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A presumptive diagnosis of NCM was made based on the MR characteristics, CSF cytology and
      clinical presentation.
    explanation: >-
      The three things a diagnosis rests on in practice, and the word the authors use for the
      result: presumptive. One patient.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Useful diagnostic procedures include cerebrospinal fluid cytology and magnetic resonance
      imaging with gadolinium contrast.
    explanation: >-
      The two procedures named together by the review that set the criteria, which is a better basis
      for this row than the single case above it.
- name: Mutation testing of lesional tissue
  description: >-
    Blood will not carry the mutation, so the test has to be on lesional tissue - naevus, leptomeninges,
    or cultured cells from either. This is the practical consequence of mosaicism and the reason a
    negative blood test means nothing here. One cited source proposes a route that needs no lesional
    biopsy: detecting the same somatic mutation in cerebrospinal fluid.
  notes: >-
    No diagnosis_term is bound. The sibling rows carry NCIT clinical-action terms, and the nearest one
    available here names immunohistochemistry, which is the wrong kind of test for this row; binding it
    would assert a method this row is not about. The preferred term for the action is carried by the
    row name instead.
  evidence:
  - reference: PMID:26354928
    reference_title: >-
      Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated with
      specific inhibitors of NRAS signaling pathway.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Cultured cell identity was confirmed by demonstration of the same NRAS mutation found in the
      original lesions and by immunophenotyping.
    explanation: >-
      The test performed on lesional material rather than on blood, here to confirm that cultured
      cells came from the lesion. INDIRECT for the diagnostic claim: the paper's purpose is a cell
      model, not a diagnostic workflow.
  - reference: PMID:33921303
    reference_title: >-
      Novel Insights into Diagnosis, Biology and Treatment of Primary Diffuse Leptomeningeal
      Melanomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Last, we use a unique patient derived PDLMM cell model to provide first insights into in vitro
      drug sensitivities.
    explanation: >-
      A second patient-derived cell system in the cited literature, from a primary diffuse
      leptomeningeal melanomatosis report. Cited on this row because what both systems depend on is
      the claim this row makes: the material has to come from the lesion.
treatments:
- name: Cerebrospinal fluid shunting
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cerebrospinal fluid diversion
    term:
      id: NCIT:C93208
      label: Cerebrospinal Fluid Diversion
  description: >-
    The commonest operation in this disease, done for the hydrocephalus rather than for the melanocytic
    lesion. It relieves the pressure and leaves everything upstream of it untouched.
  target_mechanisms:
  - target: Obstruction of Cerebrospinal Fluid Flow
    description: >-
      Diverting cerebrospinal fluid bypasses the obstructed pathway. It acts on no step above that node:
      the mutant clone, the melanocytosis and the risk of transformation are all unaddressed, which is
      why a shunted child is not a treated child.
    evidence:
    - reference: PMID:29948137
      reference_title: >-
        Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
        case-based update.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient required placement of right-sided ventriculoperitoneal shunt to control
        hydrocephalus. The patient tolerated the procedure well and was discharged home with
        normal neurological function.
      explanation: >-
        The operation acting on this node in one infant, with the outcome that makes the point:
        normal neurological function on discharge, and the same child died of malignant
        transformation of the leptomeningeal disease the shunt did not touch.
  evidence:
  - reference: PMID:35535823
    reference_title: >-
      Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common surgical technique was CSF shunting (43%, 24/56 operations), with tethered
      cord release (4%, 2/56 operations) being the least frequently performed.
    explanation: >-
      How often it is done, across 74 pooled published patients.
  notes: >-
    No cited source compares shunting against not shunting. The row records practice and the mechanism
    it acts on.
- name: MEK inhibition
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
    - preferred_term: binimetinib
      term:
        id: CHEBI:145371
        label: binimetinib
  description: >-
    Blocking the pathway the mutation activates. The evidence runs from cell lines up to single patients
    and no further, and the four cited patients did not go the same way. One infant's
    leptomeningeal thickening fell rapidly on trametinib with azacitidine and he was developmentally
    normal at 53 months. A second, also on trametinib, took it for seven months and died at 30
    months of age of malignant transformation of his leptomeningeal disease. A 13-year-old died five days after binimetinib was started, too soon for a clinical effect, though
    his tissue showed lower pERK and Ki67 afterwards. The cited sources call that drug MEK162, which
    is the same molecule.
  target_mechanisms:
  - target: Post-zygotic NRAS Codon 61 Mutation
    description: >-
      The drug cannot undo the mutation; it acts on the pathway the mutation holds open, which this node
      binds as increased Ras protein signal transduction. Recorded against this node rather than a
      downstream one because that is where the target sits.
    evidence:
    - reference: PMID:24713450
      reference_title: >-
        Experimental treatment of NRAS-mutated neurocutaneous melanocytosis with MEK162, a
        MEK-inhibitor.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed lower MIB-1 expression and lower pERK expression in the post-treatment samples
        compared to pre-treatment, suggesting a potential effect of MEK inhibiting therapy.
      explanation: >-
        The pathway readout in one patient's own tumour before and after the drug, with the
        authors' hedge: suggesting a potential effect. The same patient died five days into
        treatment, so this is a molecular observation and not a clinical result.
  evidence:
  - reference: PMID:41973363
    reference_title: >-
      Efficacy of azacitidine and trametinib against leptomeningeal melanosis associated with
      congenital melanocytic nevus syndrome.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nucleoside analogue azacitidine and the Mitogen-Activated Protein Kinase, Kinase inhibitor
      trametinib were started at 6 weeks of age resulting in rapid reduction of leptomeningeal
      thickening.
    explanation: >-
      The clinical result, in one infant and with a second drug given alongside, so the effect
      cannot be attributed to MEK inhibition alone.
  - reference: PMID:41973363
    reference_title: >-
      Efficacy of azacitidine and trametinib against leptomeningeal melanosis associated with
      congenital melanocytic nevus syndrome.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 53 months of age, the patient still takes trametinib and has met all developmental
      milestones.
    explanation: >-
      The same child four and a half years on. One patient, and the authors say so: to their
      knowledge the first in whom this worked.
  - reference: PMID:29948137
    reference_title: >-
      Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
      case-based update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He received trametinib, a MAPK/Erk kinase inhibitor for 7 months.
    explanation: >-
      The third cited patient on a MEK inhibitor, and the only one who took it long enough for an
      effect to appear. His course is in the next item.
  - reference: PMID:29948137
    reference_title: >-
      Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
      case-based update.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient eventually succumbed to malignant transformation of leptomeningeal disease.
    explanation: >-
      How that course ended. REFUTE against the claim that MEK inhibition changes the course of the
      neural disease: one patient, which settles nothing, and the only cited patient treated long
      enough to find out.
  notes: >-
    No trial, no comparison, no series. Of the four patients described here, one received a second drug at the same time, one died before an
    effect could appear, one took the drug for seven months and died of the disease, and the fourth
    received it inside a four-drug combination for a different entity, primary diffuse
    leptomeningeal melanomatosis. None establishes that MEK inhibition changes the course and the
    third points the other way. The strongest supporting evidence is in cells, not patients, and is
    recorded on the next row.
- name: PI3K and mTOR pathway inhibition
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omipalisib
      term:
        id: CHEBI:95093
        label: omipalisib
    - preferred_term: alpelisib
      term:
        id: CHEBI:231324
        label: alpelisib
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  description: >-
    The other arm of the pathway the mutation opens. In nevospheres grown from four patients' own spinal cord, brain and skin lesions, the dual PI3K/mTOR
    inhibitor GSK2126458 reduced viability further than any other inhibitor tested - below half. One
    cited patient received an mTOR inhibitor, everolimus, but inside a four-drug combination with
    intraventricular chemotherapy, so nothing can be attributed to it.
  evidence:
  - reference: PMID:26354928
    reference_title: >-
      Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated with
      specific inhibitors of NRAS signaling pathway.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Inhibitors of specific mediators of the NRAS signaling pathway reduced viability of NRAS
      mutated cells. The highest effect was obtained with GSK2126458, showing a viability reduction
      below 50%.
    explanation: >-
      The comparison between inhibitors, in cells carrying the patients' own mutation. IN_VITRO, and
      four patients' lesions.
  - reference: PMID:29976629
    reference_title: >-
      The Dual PI3K/mToR Inhibitor Omipalisib/GSK2126458 Inhibits Clonogenic Growth in
      Oncogenically-transformed Cells from Neurocutaneous Melanocytosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Omipalisib treatment prevented colony formation and induced autophagic cell death.
    explanation: >-
      The same drug against the clonogenic growth that is this disease's cellular behaviour, rather
      than against bulk viability. Still in cells.
  - reference: PMID:38071601
    reference_title: >-
      Alpelisib decreases nevocytes of congenital melanocytic nevi.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Nevomelanocytic tissue samples of 10 patients were collected prospectively and, following a
      previously reported preclinical ex vivo model, explants were placed in organotypic culture for
      5 days, with or without alpelisib.
    explanation: >-
      What alpelisib was tested on: naevus explants from ten patients in organotypic culture, which
      is skin and not the neural lesion. Cited so the note's claim about this drug rests on a source
      inside the entry.
  notes: >-
    Three agents are bound and only one of them was tested on this disease's cells. Omipalisib, also
    called GSK2126458, is the compound in both cited cell studies. Alpelisib and everolimus are
    bound beside it because they are the approved drugs of the same two targets, and the distinction
    matters: alpelisib was tested on naevus explants from ten patients and not on the neural lesion,
    and everolimus appears in the cited literature only inside a four-drug combination given to one
    melanomatosis patient.
- name: BRAF inhibition
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: >-
    Available only to the minority with a BRAF variant, which is why the genetic row for BRAF is not a
    taxonomic footnote. One patient is reported with sustained neurological and cutaneous improvement.
  notes: >-
    No therapeutic_agent is bound. The only cited source says "following BRAF inhibition" and names no
    drug, and the two cited sources that do name vemurafenib use it as an in-vitro screening agent on
    naevus and nevosphere cells rather than as a drug given to this patient. Binding a specific
    inhibitor here would assert something the evidence does not say.
  evidence:
  - reference: PMID:42384401
    reference_title: >-
      BRAF Inhibition in Congenital Nevi and Neural Melanosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case report describes sustained neurologic and cutaneous improvement following BRAF
      inhibition in a patient with BRAF V600E-variant neurocutaneous melanosis.
    explanation: >-
      The whole of the cited evidence for this row: one case report, and the word sustained is the
      authors'.
- name: Surgical and laser management of the cutaneous naevi
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical removal and resurfacing of the naevus
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Excision, grafting, tissue expansion, dermabrasion, chemical peel and laser, done for the skin. A
    cited review calls the management of the cutaneous manifestations controversial, and nothing cited
    here shows that treating the skin changes the neural disease.
  evidence:
  - reference: PMID:29948137
    reference_title: >-
      Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
      case-based update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The management of cutaneous manifestations remains controversial; for neurological
      manifestations, outcome remains poor even with the use of radiotherapy and chemotherapy.
    explanation: >-
      Both halves of this row's caveat in one sentence: the skin management is contested, and the
      neurological outcome is poor whatever is done to it.
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment strategies include laser therapy, chemical peeling, dermabrasion, and surgical
      removal/grafting for CMNs and shunt surgery and surgical removal/chemo/radiotherapy for CNS
      lesions.
    explanation: >-
      The list this row covers, from a review of the disease.
progression:
- phase: Congenital cutaneous lesion
  notes: >-
    The naevi are present at birth and are what prompts everything else. Nothing neurological is expected at this point. How many go on to develop symptoms is not settled by
    the cited sources and the entry does not assert a majority either way: in the registry series,
    17 of the 26 patients reported to have the neural lesion also reported neurological symptoms,
    while the imaging series that found the lesion in a third of infants reports no symptom data at
    all.
  evidence:
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 379 patients with LCMN, 26 reportedly had NCM, with 17 reporting neurologic symptoms.
    explanation: >-
      The split between having the neural lesion and having symptoms, in a registry of 379 patients
      with large congenital melanocytic naevi. Self-reported, which is why the entry does not use
      these as rates.
- phase: Asymptomatic central nervous system involvement
  notes: >-
    Found only by imaging, in roughly a quarter to a third of infants with congenital melanocytic naevi
    when everyone is scanned. Whether this phase progresses is the question the entry's screening
    discussion records; the referral series includes a child with focal seizures and a normal scan,
    so the two do not map onto each other.
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM was diagnosed on brain MRI in 31.6% of the 38 patients with CMN and in 25.0% of patients
      with no prior examination or treatment.
    explanation: >-
      The prevalence of this phase among infants with the cutaneous disease, with the second figure
      for those not previously examined or treated.
- phase: Symptomatic neurological disease
  notes: >-
    Acute in infancy or, more often, later in childhood or adult life - though the 1991 review that set
    the criteria found most of its 39 cases presenting in the first two years. Once symptoms appear
    the outlook changes sharply: a systematic review states in its framing that patients typically
    die within three years of symptom onset, and the 1991 review found the prognosis extremely poor
    even without melanoma. Read that against the phase above:
    the figure is conditioned on becoming symptomatic, and what proportion of those with the lesion
    become symptomatic is not established by any cited source.
  evidence:
  - reference: PMID:35535823
    reference_title: >-
      Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM most often presents in pediatric patients within the first 2 years of life and is
      associated with high mortality due to proliferation of melanocytes in the brain. Prognosis is
      poor, as patients typically die within 3 years of symptom onset.
    explanation: >-
      The timing and the outcome of this phase, from a systematic review of 74 published patients.
      Published cases over-represent the severe, so this is the prognosis of reported symptomatic
      disease rather than of the disease.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with neurocutaneous melanosis presented in the first 2 years of life with
      neurologic manifestations of increased intracranial pressure, mass lesions, or spinal cord
      compression.
    explanation: >-
      How this phase presents, in 39 reviewed cases: raised pressure, mass lesions or spinal cord
      compression, mostly in the first two years.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leptomeningeal melanoma was present in 62% of the cases, but even in the absence of melanoma,
      symptomatic neurocutaneous melanosis had an extremely poor prognosis.
    explanation: >-
      Both halves, and the second is the one that matters: the outlook is poor once symptoms appear
      whether or not melanoma has developed. Thirty-nine published cases, so the 62% is a proportion
      of reported cases rather than of the disease.
- phase: Malignant transformation
  notes: >-
    Melanoma in the leptomeninges or the skin. In the cohort assembled as primary diffuse leptomeningeal
    melanomatosis, median overall survival is four months from diagnosis.
  evidence:
  - reference: PMID:33921303
    reference_title: >-
      Novel Insights into Diagnosis, Biology and Treatment of Primary Diffuse Leptomeningeal
      Melanomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality remains substantial despite diverse therapeutic approaches with a median overall
      survival of 4 months from diagnosis.
    explanation: >-
      The survival after this phase begins, from a review of 27 pooled cases of that entity.
prevalence:
- population: Japanese infants under one year treated for congenital melanocytic naevi, 2020-2022
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 31600.0
  rate_denominator: POPULATION
  notes: >-
    Not a population prevalence, and the denominator is what makes it meaningful: 38 infants referred
    for treatment of congenital melanocytic naevi, all of whom were imaged. The quantity is the
    proportion of that group with central nervous system involvement of any kind, symptomatic or
    not, which is why the class reads as common and would be absurd read as a figure for the general
    population. Two other cited sources measure the same quantity in different cohorts and give 21%
    and about 12%; all of them are recorded rather than averaged.
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM was diagnosed on brain MRI in 31.6% of the 38 patients with CMN and in 25.0% of patients
      with no prior examination or treatment.
    explanation: >-
      The numerator and denominator together. Thirty-eight infants is a small denominator and the
      entry does not present this as a rate for the disease.
- population: Patients with large congenital melanocytic naevi, internet-based registry
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4800.0
  rate_denominator: POPULATION
  notes: >-
    A different quantity from the row above, and the difference explains most of the gap: this counts
    asymptomatic central nervous system involvement only - 4.8% of the 186 registry patients who had
    magnetic resonance imaging - where the row above counts involvement of any kind. The same
    registry puts involvement of any kind at 26 of 379. This study is also self-reported, which its
    own limitations section states, while the row above is prospective imaging of every infant seen.
  evidence:
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 186 patients undergoing MRI, 9 reported abnormal findings without neurologic symptoms
      (4.8%); 80% had LCMN on the posterior axis, whereas 55% had more than 20 satellite nevi.
    explanation: >-
      The figure and its denominator. Self-reported through a questionnaire, which the authors state
      as the method.
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LIMITATIONS: Study data rely on the registry members' self-reported findings and are limited
      by lack of independent data verification.
    explanation: >-
      The authors' own limitation, which is the main reason this figure and the prospective one are
      not averaged.
- population: Children with multiple congenital melanocytic naevi, screened cohort, 1991-2013
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 21000.0
  rate_denominator: POPULATION
  notes: >-
    21% of the 289 children who met the single-screening-scan criterion in a specialist cohort. The
    denominator is children with more than one congenital melanocytic naevus at birth, not the
    population, and the numerator is an abnormal scan of any kind rather than melanocytosis
    specifically.
  evidence:
  - reference: PMID:25966033
    reference_title: >-
      Classification of neurological abnormalities in children with congenital melanocytic naevus
      syndrome identifies magnetic resonance imaging as the best predictor of clinical outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-one per cent of children with multiple CMN had an abnormal MRI.
    explanation: >-
      The figure and its denominator. Abnormal magnetic resonance imaging rather than melanocytosis,
      which is why this record and the 31.6% one are not the same quantity either.
- population: Individuals with large congenital melanocytic naevi
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 12000.0
  rate_denominator: POPULATION
  notes: >-
    About 12%, from a review, and the only one of this entry's conditional figures stated as a
    lifetime risk rather than a cross-sectional proportion. The same sentence names what raises it:
    wide extension and dorsal axial distribution of the naevus.
  evidence:
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 12% of individuals with LCMN will develop NCM: wide extension and/or dorsal
      axial distribution of LCMN increases the risk of NCM.
    explanation: >-
      The figure and the features that raise it, from a review of the disease.
- population: Europe, general population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  rate_denominator: POPULATION
  notes: >-
    The only population figure in this entry, and the one a reader filtering on prevalence_class
    needs: every other record here is a proportion among children who already have the cutaneous
    disease, and those read as common because their denominator is small. Orphanet gives a band
    rather than a point estimate, and the rate recorded is its midpoint.
  evidence:
  - reference: ORPHA:2481
    reference_title: >-
      Neurocutaneous melanocytosis
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      1-9 / 100 000 | Europe | Point prevalence | EXPERT
    explanation: >-
      Orphanet's epidemiology row for this disease. The class is an expert estimate rather than a
      measured rate, which is what the source's own Source column says.
animal_models:
- name: Embryonic melanocyte NRAS(G12D) mouse
  species: Mouse
  genotype: oncogenic NRAS (G12D) expressed in melanocytes of developing embryos
  publication: PMID:23303902
  description: >-
    Oncogenic NRAS driven in melanocytes during embryogenesis. It produces the congenital melanocytic
    lesions and the central nervous system melanoma of this disease, and it does not produce cutaneous
    melanoma.
  notes: >-
    No MGI identifier is bound for the targeted gene. The construct is human-numbered oncogenic NRAS
    expressed in mouse melanocytes and the cached abstract names no mouse allele, so the gene is left in
    the genotype string rather than bound to a model-organism identifier that would have to be written
    from memory.
  modeled_mechanisms:
  - target: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the embryonic timing and the two-compartment distribution: congenital melanocytic
      lesions in the skin and melanocytic disease in the central nervous system from one driver.
    limitations: >-
      The allele is G12D. Every mutation-positive patient in the series that established the lesion
      carries a codon 61 substitution instead - twelve of fifteen patients, the other three being
      mutation-negative - and a further cited cohort finds BRAF V600E rather than NRAS in two of
      sixteen, and the
      mouse's cutaneous lesions are described as resembling blue naevi rather than congenital melanocytic
      naevi. The mouse is a conditional transgenic rather than a mosaic, so the one feature that defines
      the human disease - mutant and wild-type cells side by side from a post-zygotic event - is not
      what the model has.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is NRAS G12D expressed from a transgene in a melanocyte lineage. The node's
        quantity is a codon 61 substitution present post-zygotically in one clone among wild-type cells.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cutaneous lesion the mouse makes is reported as resembling human blue naevus, which is not
        the congenital melanocytic naevus this node's descendants form in patients.
    evidence:
    - reference: PMID:23303902
      reference_title: >-
        Primary melanoma of the CNS in children is driven by congenital expression of oncogenic
        NRAS in melanocytes.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        When NRAS(G12D) was expressed in the melanocytes of developing embryos, it induced
        melanocyte proliferation and congenital melanocytic lesions reminiscent of human blue nevi
        but did not induce cutaneous melanoma.
      explanation: >-
        What the model does and does not reproduce, in the authors' own words, which is also the
        source of both divergences recorded above.
  - target: Malignant Transformation to Leptomeningeal Melanoma
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model's unexpected result and the reason it is cited here: early-onset primary melanoma of the
      central nervous system, which is the human disease's lethal arm.
    limitations: >-
      The human tumours are leptomeningeal and arise within a pre-existing melanocytosis; the mouse
      tumours are described as primary central nervous system melanoma without that substrate being
      characterised in the cached abstract.
    evidence:
    - reference: PMID:23303902
      reference_title: >-
        Primary melanoma of the CNS in children is driven by congenital expression of oncogenic
        NRAS in melanocytes.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, however, it did induce early-onset primary melanoma of the central nervous
        system (CNS).
      explanation: >-
        The arm the model does reproduce.
experimental_models:
- name: Patient-derived nevomelanocytic spheroids
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Spheroids grown from spinal cord, brain and skin lesions of four patients, carrying the same NRAS
    mutation as the lesions they came from. It is one of two patient-derived cell systems in the cited literature and the only one in which
    several inhibitors are compared against each other; the other, from a leptomeningeal
    melanomatosis report, is described only as giving first insights into in vitro drug
    sensitivities.
  modeled_mechanisms:
  - target: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The cells are the clone, taken from both compartments of the same patients, and their identity was
      confirmed by the mutation rather than assumed.
    limitations: >-
      Cells out of their tissue: the leptomeningeal environment, the cerebrospinal fluid compartment and
      the skin's architecture are all absent, and clonogenic growth in Geltrex is a proxy for what the
      lesion does in a patient.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Neither the leptomeningeal compartment nor the dermal environment is in the model, so nothing it
        shows bears on why the lesion sits where it does or why it obstructs cerebrospinal fluid.
    evidence:
    - reference: PMID:26354928
      reference_title: >-
        Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated
        with specific inhibitors of NRAS signaling pathway.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        We generated nevomelanocytic spheroids in vitro from lesions of the spinal cord, brain,
        and skin from 4 NCM patients.
      explanation: >-
        What the system is and where it came from: three compartments, four patients.
  evidence:
  - reference: PMID:26354928
    reference_title: >-
      Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated with
      specific inhibitors of NRAS signaling pathway.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Skin-derived cells formed more colonies than CNS-derived cells.
    explanation: >-
      A difference between the two compartments of the same clone, which is a result this system can
      give and a patient cannot.
discussions:
- discussion_id: ncm_screening_mri_value
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does screening every infant with more than one congenital melanocytic naevus for central nervous
    system involvement change what happens to them?
  attaches_to:
  - diagnosis#Screening brain and spine magnetic resonance imaging
  - progression#Asymptomatic central nervous system involvement
  rationale: >-
    Imaging finds the lesion in a fifth to a third of such infants, depending on the series and on what
    counts as an abnormality. No cited source shows that finding it early changes the course, and no
    treatment has been shown to change the course. What the cited sources do establish is weaker and
    still useful: an abnormal scan is the most significant predictor of abnormal neurodevelopment,
    seizures and the need for neurosurgery in the largest screened cohort, and that cohort's authors
    conclude a single screening scan is a clinically relevant strategy. Prediction is not benefit,
    which is why this stays a gap rather than a recommendation. The study that set out to answer
    this names the question in its own objective. Against that, the entry's own progression rows record
    that the symptomatic form kills within about three years of onset, so the argument for finding it
    early is not nothing - it is untested. The four cited proportions for how often the lesion is present span 4.8% to 31.6%, partly because
    they do not all count the same thing - one is asymptomatic involvement only - so the size of the
    screened-positive group is not settled either.
  evidence:
  - reference: PMID:25966033
    reference_title: >-
      Classification of neurological abnormalities in children with congenital melanocytic naevus
      syndrome identifies magnetic resonance imaging as the best predictor of clinical outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal MRI was the most significant predictor of all outcome measures.
    explanation: >-
      What the screened cohort established, which is prediction rather than benefit: the scan
      predicts abnormal neurodevelopment, seizures and the need for neurosurgery. The gap this
      discussion records is the step from predicting to changing.
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent retrospective studies using magnetic resonance imaging (MRI) to screen for
      neurocutaneous melanocytosis (NCM) among neurologically asymptomatic children with large
      congenital melanocytic nevi (LCMN) report high prevalence (23-30%) of asymptomatic NCM. We
      sought to determine prevalence of asymptomatic NCM, and current application of MRI as a
      screening tool.
    explanation: >-
      The size of the asymptomatic group as the literature had it, and a second study setting out to
      measure it - which then reported 4.8%. The gap between those figures is part of why the
      question stays open.
- discussion_id: ncm_targeted_therapy_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does inhibiting the pathway the NRAS mutation activates change the course of the neural disease?
  attaches_to:
  - treatments#MEK inhibition
  - treatments#PI3K and mTOR pathway inhibition
  rationale: >-
    The pathway is known, the drugs exist, and the evidence stops at single patients. Four cited patients received a MEK inhibitor and none of them settles it. One infant's
    leptomeningeal thickening fell rapidly on trametinib and he was developmentally normal at 53
    months, but he received azacitidine at the same time. A second took trametinib for seven months
    and died of malignant transformation of his leptomeningeal disease. A 13-year-old received a MEK
    inhibitor and died five days later, too soon for an effect, though his tissue showed reduced
    pERK afterwards. The fourth received trametinib inside a four-drug combination for primary
    diffuse leptomeningeal melanomatosis, improved temporarily and survived seven months, so nothing
    in his course can be attributed to the MEK inhibitor either. The
    cell-culture comparisons point at the PI3K/mTOR arm rather than the MEK arm, and the compound that
    performed best there has never been given to a patient in the cited literature. Nothing here is a
    series, let alone a trial, and the disease is rare enough that a trial would have to be
    international.
  evidence:
  - reference: PMID:24713450
    reference_title: >-
      Experimental treatment of NRAS-mutated neurocutaneous melanocytosis with MEK162, a
      MEK-inhibitor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite surgery, which is often not radical, few other treatment options exist.
    explanation: >-
      The state of treatment stated plainly by one of the groups trying to change it.
  - reference: PMID:24713450
    reference_title: >-
      Experimental treatment of NRAS-mutated neurocutaneous melanocytosis with MEK162, a
      MEK-inhibitor.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies are needed to determine whether MEK inhibitors can effectively target
      NRAS-mutated symptomatic NCM, a rare but potentially fatal disease.
    explanation: >-
      The gap named by the authors of the one patient report that measured a pathway effect. No quote_role
      is recorded: this is a single-patient report's own call for future work, which is neither its
      finding nor somebody else's fact.
- discussion_id: ncm_mouse_allele_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The mouse model of this disease carries NRAS G12D while every mutation-positive patient in the series that established the lesion - twelve of fifteen
    - carries a codon 61 substitution. Does the model's central nervous system melanoma arise
    the way the human one does?
  attaches_to:
  - pathophysiology#Post-zygotic NRAS Codon 61 Mutation
  - animal_models#Embryonic melanocyte NRAS(G12D) mouse
  rationale: >-
    The model is the main non-human evidence for this entry's lethal arm and it differs from the human
    disease in two ways that are not incidental. Its allele is at a different codon, and codon 61 is where the mutation sits in every
    mutation-positive patient of the series that established the lesion. And it is a transgenic rather than a mosaic, so the mutant cells
    are not surrounded by wild-type ones - which is the architecture the word mosaic in this disease's
    name refers to. The model's cutaneous lesions are reported as resembling blue naevi rather than
    congenital melanocytic naevi, which is consistent with the mismatch mattering rather than not. What
    the model does reproduce, early-onset central nervous system melanoma, is the result that made it
    worth building.
  evidence:
  - reference: PMID:23303902
    reference_title: >-
      Primary melanoma of the CNS in children is driven by congenital expression of oncogenic NRAS
      in melanocytes.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NRAS is not a common driver oncogene of primary melanoma of the CNS in adults, but we report
      two cases of primary melanoma of the CNS in children, both of which carried oncogenic
      mutations in NRAS.
    explanation: >-
      The human side the model is held against: two children, in whom the paper does not say which
      codon. INDIRECT because the match between model and patients is what is at issue and this
      sentence does not close it.
notes: >-
  Every cited source is a case report, a case series, a retrospective or prospective cohort, a
  systematic review of those, or a laboratory study, and every one is cached as an abstract: nothing
  here rests on a full text, so every statement about what the literature does not contain is a
  statement about those abstracts. No randomised or controlled study of this disease was found, and
  the entry names its denominator wherever it gives a number, because the denominators differ in
  kind and the figures differ with them. Three recur. A screening series images every infant
  with the cutaneous lesion and so measures how common the neural lesion is in that group. A tertiary
  neuro-oncology referral series counts the children severe enough to be sent there. A pooled review of
  published cases counts the cases somebody chose to publish, which over-represents the severe and is
  the source of most of the frequency figures here.

  Four cited sources give a proportion for how often the neural lesion is present among children with
  the cutaneous one, and they span 4.8% to 31.6%: prospective imaging of 38 Japanese infants gives
  31.6%, a 289-patient screened cohort gives 21%, a review gives about 12%, and a self-reported
  internet registry gives 4.8%. They are not all measuring the same thing - the lowest counts
  asymptomatic involvement only - and the entry records all of them rather than averaging.

  Treatment evidence stops at single patients. Every drug row here rests on one case report, or on
  cells, or both; two of the three patients described received something else at the same time or died
  before an effect could appear. Nothing in this entry should be read as evidence that a drug changes
  the course of the neural disease, which is what the second discussion records.
review_notes: >-
  Written from cached sources only, by hand. Where a claim rests on one patient or on cells, the
  explanation says so, because a reader of a card sees the explanation and not the methods.

  Three things are deliberately absent. No reference range or laboratory threshold is recorded,
  because none of the cited sources gives one for this disease. No cell of origin is asserted beyond melanoblast, which is
  inferred from where the clone's descendants end up rather than observed, and the pathophysiology node
  says so. And the mutation-testing diagnosis row carries no diagnosis_term, because the nearest cached
  NCIT clinical-action term names immunohistochemistry and this row is a sequencing test; an
  approximately-right binding there would assert the wrong method.

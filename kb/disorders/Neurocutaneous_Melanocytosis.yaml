    explanation: >-
      A breakthrough seizure-like episode about two months into trametinib, after which her
      antiseizure drug was increased: against reading her stable course as the MEK inhibitor's
      doing.
  - reference: PMID:33257354
    reference_title: >-
      Symptomatic neurocutaneous melanosis: mild clinical onset in a teenager.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At this time, she had completed 10 weeks of trametinib therapy and 4 weeks of the increased
      levetiracetam dose. The nevus on her forehead had decreased in size from 3.1 cm in diameter to
      2.7 cm and the borders of her largest nevus also appeared to be growing lighter.
    explanation: >-
      Her skin at the follow-up after 10 weeks of trametinib: one naevus smaller and the borders of
      the largest appearing lighter. Indirect: the report gives her skin at that follow-up, and that
      the drug caused the change is an inference with no comparison; the 3.1 cm was measured when
      she presented, before trametinib began.
  - reference: PMID:33257354
    reference_title: >-
      Symptomatic neurocutaneous melanosis: mild clinical onset in a teenager.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, some of the other lesions were reportedly darker.
    explanation: >-
      Other naevi darker at the same follow-up, by report: against reading her skin change as a
      uniform response to the drug.
  - reference: PMID:33921303
    reference_title: >-
      Novel Insights into Diagnosis, Biology and Treatment of Primary Diffuse Leptomeningeal
      Melanomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first case of a pediatric patient with PDLMM who received combination treatment
      including trametinib and everolimus, followed by intravenous nivolumab and ipilimumab with
      concomitant intensive intraventricular chemotherapy, resulting in temporary significant
      clinical improvement and overall survival of 7 months.
    explanation: >-
      A child with primary diffuse leptomeningeal melanomatosis, an aggressive cancer biologically
      closely related to this disease. The MEK inhibitor was given with everolimus and followed by
      two immunotherapies with intraventricular chemotherapy, so neither the temporary improvement
      nor the seven-month survival can be attributed to it. INDIRECT for that reason.
  notes: >-
    None of the clinical reports cited here makes a controlled comparison. The patients described
    here come from single case reports, one centre's series of four and a national registry study
    whose expanded cohort adds published cases, so some children may be counted more than once. In
    the series the benefit was temporary in every child, and every child in the series and in the
    registry study's cohort died. Of the patients cited here, only the infant given azacitidine and
    trametinib together is reported well years later. A phase II trial of mirdametinib for large and
    giant congenital naevi is registered (NCT07891286) and not yet recruiting; its primary endpoint
    is the size of the skin naevus, and it admits people with neurocutaneous melanocytosis only if
    that is asymptomatic and not progressing. The comparison between inhibitors is in cells and is
    recorded on the next row.
- name: PI3K and mTOR pathway inhibition
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omipalisib
      term:
        id: CHEBI:95093
        label: omipalisib
    - preferred_term: alpelisib
      term:
        id: CHEBI:231324
        label: alpelisib
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  description: >-
    The other arm of the pathway the mutation opens. In nevospheres grown from four patients' own
    spinal cord, brain and skin lesions, the dual PI3K/mTOR inhibitor GSK2126458 reduced viability
    further than any other inhibitor tested - below half. One cited patient received an mTOR
    inhibitor, everolimus, together with trametinib and followed by two immunotherapies with
    intraventricular chemotherapy, so nothing can be attributed to it. One centre reports that
    another mTOR inhibitor, sirolimus, had no measurable effect in three children with melanoma of
    the central nervous system.
  evidence:
  - reference: PMID:26354928
    reference_title: >-
      Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated with
      specific inhibitors of NRAS signaling pathway.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Inhibitors of specific mediators of the NRAS signaling pathway reduced viability of NRAS
      mutated cells. The highest effect was obtained with GSK2126458, showing a viability reduction
      below 50%.
    explanation: >-
      The comparison between inhibitors, in cells carrying the patients' own mutation. IN_VITRO, and
      four patients' lesions.
  - reference: PMID:29976629
    reference_title: >-
      The Dual PI3K/mToR Inhibitor Omipalisib/GSK2126458 Inhibits Clonogenic Growth in
      Oncogenically-transformed Cells from Neurocutaneous Melanocytosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Omipalisib treatment prevented colony formation and induced autophagic cell death.
    explanation: >-
      The same drug against the clonogenic growth that is this disease's cellular behaviour, rather
      than against bulk viability. Still in cells.
  - reference: PMID:38071601
    reference_title: >-
      Alpelisib decreases nevocytes of congenital melanocytic nevi.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Nevomelanocytic tissue samples of 10 patients were collected prospectively and, following a
      previously reported preclinical ex vivo model, explants were placed in organotypic culture for
      5 days, with or without alpelisib.
    explanation: >-
      What alpelisib was tested on: naevus explants from ten patients in organotypic culture, which
      is skin and not the neural lesion. Cited so the note's claim about this drug rests on a source
      inside the entry.
  - reference: PMID:28253523
    reference_title: >-
      MEK inhibition appears to improve symptom control in primary NRAS-driven CNS melanoma in
      children.
    supports: REFUTE
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our experience of systemic therapies for this disease include Dacarbazine and Temozolomide, a
      single experience with anti-CTLA-4 antibody therapy (Ipilimumab), and use of the mTOR
      inhibitor Sirolimus in three patients, none of which have had any measurable effect on
      symptoms or disease progression
    explanation: >-
      One centre's experience, given in its introduction from its unpublished data and its published
      cohort review: sirolimus, an mTOR inhibitor, had no measurable effect in three children with
      melanoma of the central nervous system. REFUTE against the claim that inhibiting this arm of
      the pathway helps; indirect, because the children had melanoma.
  notes: >-
    Three agents are bound and only one of them was tested on this disease's cells. Omipalisib, also
    called GSK2126458, is the compound in both cited cell studies. Alpelisib and everolimus are
    bound beside it because they are the approved drugs of the same two targets, and the distinction
    matters: alpelisib was tested on naevus explants from ten patients and not on the neural lesion,
    and everolimus appears in the cited literature only with trametinib, followed by two
    immunotherapies, in one melanomatosis patient.
- name: BRAF inhibition
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  description: >-
    Available only to the minority with a BRAF variant, which is why the genetic row for BRAF is not
    a taxonomic footnote; the trametinib series' authors call selective BRAF inhibitors
    contraindicated in NRAS-driven melanoma of the central nervous system. One patient is reported
    with sustained neurological and cutaneous improvement.
  notes: >-
    No therapeutic_agent is bound. Neither source as cached names a drug: the case report's abstract
    says "following BRAF inhibition", and the trametinib series speaks of selective BRAF inhibitors
    as a class. The two cited sources that do name vemurafenib use it as an in-vitro screening agent
    on naevus and nevosphere cells rather than as a drug given to a patient. Binding a specific
    inhibitor here would assert something the evidence does not say.
  evidence:
  - reference: PMID:42384401
    reference_title: >-
      BRAF Inhibition in Congenital Nevi and Neural Melanosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case report describes sustained neurologic and cutaneous improvement following BRAF
      inhibition in a patient with BRAF V600E-variant neurocutaneous melanosis.
    explanation: >-
      The one patient cited on this row, in a case report; the word sustained is the authors'.
  - reference: PMID:28253523
    reference_title: >-
      MEK inhibition appears to improve symptom control in primary NRAS-driven CNS melanoma in
      children.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Due to driver NRAS mutations the use of selective BRAF inhibitors is contraindicated, whereas
      targeting the more distal MAPK pathway is a possible option.
    explanation: >-
      Why BRAF inhibition is for the minority: with an NRAS driver, the series' authors call
      selective BRAF inhibitors contraindicated. An expert statement in the paper's introduction,
      about melanoma of the central nervous system, so indirect.
- name: Surgical and laser management of the cutaneous naevi
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical removal and resurfacing of the naevus
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Excision, grafting, tissue expansion, dermabrasion, chemical peel and laser, done for the skin. A
    cited review calls the management of the cutaneous manifestations controversial, and nothing cited
    here shows that treating the skin changes the neural disease.
  evidence:
  - reference: PMID:29948137
    reference_title: >-
      Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
      case-based update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The management of cutaneous manifestations remains controversial; for neurological
      manifestations, outcome remains poor even with the use of radiotherapy and chemotherapy.
    explanation: >-
      Both halves of this row's caveat in one sentence: the skin management is contested, and the
      neurological outcome is poor whatever is done to it.
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment strategies include laser therapy, chemical peeling, dermabrasion, and surgical
      removal/grafting for CMNs and shunt surgery and surgical removal/chemo/radiotherapy for CNS
      lesions.
    explanation: >-
      The list this row covers, from a review of the disease.
clinical_trials:
- name: NCT07891286
  phase: PHASE_II
  status: NOT_RECRUITING
  description: >-
    A single-group phase II study of the MEK inhibitor mirdametinib, taken by mouth in four-week
    cycles for up to two years, in people aged 3 to 40 with large or giant congenital melanocytic
    naevi that carry a somatic NRAS or BRAF variant or one of the gene fusions the record lists. Its
    primary endpoint is an objective decrease in the largest diameter of the naevus. The registry
    lists neurocutaneous melanocytosis among its conditions and admits people with it only if it is
    asymptomatic and not progressing, and participants have MRI of the brain and spinal cord.
    Registered by the US National Cancer Institute as not yet recruiting, with an estimated start in
    January 2027 and an estimated enrolment of 15; NOT_RECRUITING is the closest status the schema
    has.
  target_phenotypes:
  - preferred_term: large or giant congenital melanocytic naevi
    term:
      id: HP:0000995
      label: Melanocytic nevus
  notes: >-
    Registry fields as retrieved from ClinicalTrials.gov on 20 November 2026. The primary endpoint
    is the skin naevus. The secondary outcomes include pERK as a pharmacodynamic marker in serial
    biopsies of the naevus and whether melanoma occurs, and none is named for the leptomeningeal or
    parenchymal lesion.
  evidence:
  - reference: clinicaltrials:NCT07891286
    reference_title: >-
      A Phase II Study to Evaluate the Use of the MEK Inhibitor Mirdametinib to Reduce the Size of
      Large/Giant Congenital Melanocytic Nevi in Children, Adolescents and Young Adults
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Researchers want to find out if a drug approved for a different use (mirdametinib) can shrink
      the size of LGCMN.
    explanation: >-
      The trial's aim as the registry states it: a MEK inhibitor tested against the naevus itself.
  - reference: clinicaltrials:NCT07891286
    reference_title: >-
      A Phase II Study to Evaluate the Use of the MEK Inhibitor Mirdametinib to Reduce the Size of
      Large/Giant Congenital Melanocytic Nevi in Children, Adolescents and Young Adults
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Magnetic resonance imaging (MRI) scan: They will lie on a bed that slides into a tube; the
      scan will use large magnets to create images of their brain and spinal cord.
    explanation: >-
      Participants are imaged at the brain and spinal cord, where this disease's neural lesion lies.
- name: NCT04548817
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    An observational registry, run from Memorial Sloan Kettering Cancer Center, that collects
    retrospective and prospective clinical, treatment and outcome data on patients with large
    cutaneous melanocytic naevi present at birth or neurocutaneous melanocytosis, including patients
    with central nervous system melanocytosis and no skin lesion. Recruiting since September 2020,
    with an estimated enrolment of 100.
  notes: >-
    Registry fields as retrieved from ClinicalTrials.gov on 20 November 2026.
  evidence:
  - reference: clinicaltrials:NCT04548817
    reference_title: >-
      Prospective Registry of Patients With Neurocutaneous Melanocytosis (NCM) Including Cutaneous
      and CNS Involvement
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This study will involve collecting information about the regular medical care you receive for
      large cutaneous melanocytic nevi (LCMN) or neurocutaneous melanocytosis (NCM).
    explanation: >-
      What the registry collects: the routine care these patients receive, with no intervention of
      its own.
- name: NCT06828822
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    A prospective cohort, run from Nantes University Hospital, of children under 2 years with
    medium, large or giant congenital naevi, whose primary outcome is the prevalence of
    neurodevelopmental abnormalities at 3 years by naevus size and number. The record names
    neuro-meningeal melanosis among the neurological risks and asks whether routine brain imaging is
    needed. Registered as interventional with phase not applicable, its interventions being the
    study's own assessments (a neurodevelopmental assessment, a quality-of-life measure and a
    meeting with the parents); recruiting since July 2025, with an estimated enrolment of 819.
  target_phenotypes:
  - preferred_term: neurodevelopmental abnormality
    term:
      id: HP:0012759
      label: Neurodevelopmental abnormality
  notes: >-
    Registry fields as retrieved from ClinicalTrials.gov on 20 November 2026.
  evidence:
  - reference: clinicaltrials:NCT06828822
    reference_title: >-
      CIRCLE : CongenItal Naevus Cohort for Longitudinal Evaluation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Large CN can be associated with neurological abnormalities such as neuro-meningeal melanosis,
      hydrocephalus, or brain malformations.
    explanation: >-
      Why the cohort follows these children: the record names neuro-meningeal melanosis among the
      neurological risks of large naevi.
  - reference: clinicaltrials:NCT06828822
    reference_title: >-
      CIRCLE : CongenItal Naevus Cohort for Longitudinal Evaluation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is an urgent need for further research to clarify best practices in monitoring and
      treatment, including the need for routine brain imaging and criteria for surgical
      intervention.
    explanation: >-
      The screening question the cohort asks, which the entry's discussion on screening also
      records.
progression:
- phase: Congenital cutaneous lesion
  notes: >-
    The naevi are present at birth and are what prompts everything else. Nothing neurological is
    expected at this point. How many go on to develop symptoms is not settled by the cited sources
    and the entry does not assert a majority either way: in the registry series, 17 of the 26
    patients reported to have the neural lesion also reported neurological symptoms, while the
    abstract of the imaging series that found the lesion in a third of infants gives no symptom
    data.
  evidence:
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 379 patients with LCMN, 26 reportedly had NCM, with 17 reporting neurologic symptoms.
    explanation: >-
      The split between having the neural lesion and having symptoms, in a registry of 379 patients
      with large congenital melanocytic naevi. Self-reported, which is why the entry does not use
      these as rates.
- phase: Asymptomatic central nervous system involvement
  notes: >-
    Found only by imaging. One series that scanned every infant, 38 Japanese infants under one year
    treated for congenital melanocytic naevi, found the lesion on brain MRI in about a third, and in
    a quarter of those not previously examined or treated; its abstract does not say how many had
    symptoms. Whether this phase progresses is the question the entry's screening discussion
    records; the 14-patient referral series includes a child with focal seizures and a normal scan,
    so the two do not map onto each other.
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM was diagnosed on brain MRI in 31.6% of the 38 patients with CMN and in 25.0% of patients
      with no prior examination or treatment.
    explanation: >-
      How often brain MRI found the lesion in 38 Japanese infants treated for congenital melanocytic
      naevi, with the second figure for those not previously examined or treated. The abstract does
      not say how many had symptoms, so for this phase the figures are an upper bound for lesions
      seen on brain MRI.
- phase: Symptomatic neurological disease
  notes: >-
    Acute in infancy or, more often, later in childhood or adult life - though the 1991 review that set
    the criteria found most of its 39 cases presenting in the first two years. Once symptoms appear
    the outlook changes sharply: a systematic review states in its framing that patients typically
    die within three years of symptom onset, and the 1991 review found the prognosis extremely poor
    even without melanoma. Read that against the phase above:
    the figure is conditioned on becoming symptomatic, and what proportion of those with the lesion
    become symptomatic is not established by any cited source.
  evidence:
  - reference: ORPHA:2481
    reference_title: Neurocutaneous melanocytosis
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: HP:0001522 | Death in infancy | Occasional (29-5%)
    explanation: >-
      Orphanet classes death in infancy as occasional. Recorded on this phase because HP:0001522 is
      a clinical-course term, outside the phenotypic-abnormality branch that the phenotype rows
      bind. The record states no population or denominator for the class.
  - reference: PMID:35535823
    reference_title: >-
      Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM most often presents in pediatric patients within the first 2 years of life and is
      associated with high mortality due to proliferation of melanocytes in the brain. Prognosis is
      poor, as patients typically die within 3 years of symptom onset.
    explanation: >-
      The timing and the outcome of this phase, from a systematic review of 74 published patients.
      Published cases over-represent the severe, so this is the prognosis of reported symptomatic
      disease rather than of the disease.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with neurocutaneous melanosis presented in the first 2 years of life with
      neurologic manifestations of increased intracranial pressure, mass lesions, or spinal cord
      compression.
    explanation: >-
      How this phase presents, in 39 reviewed cases: raised pressure, mass lesions or spinal cord
      compression, mostly in the first two years.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leptomeningeal melanoma was present in 62% of the cases, but even in the absence of melanoma,
      symptomatic neurocutaneous melanosis had an extremely poor prognosis.
    explanation: >-
      Both halves, and the second is the one that matters: the outlook is poor once symptoms appear
      whether or not melanoma has developed. Thirty-nine published cases, so the 62% is a proportion
      of reported cases rather than of the disease.
- phase: Malignant transformation
  notes: >-
    Melanoma in the leptomeninges or the skin. For melanoma of the central nervous system in
    children with this disease, a German registry study with published cases added reports a median
    survival of 0.4 years from diagnosis; in 27 pooled cases of primary diffuse leptomeningeal
    melanomatosis, a related cancer, median overall survival is four months from diagnosis.
  evidence:
  - reference: PMID:33921303
    reference_title: >-
      Novel Insights into Diagnosis, Biology and Treatment of Primary Diffuse Leptomeningeal
      Melanomatosis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality remains substantial despite diverse therapeutic approaches with a median overall
      survival of 4 months from diagnosis.
    explanation: >-
      Survival in 27 pooled cases of primary diffuse leptomeningeal melanomatosis, a cancer the
      review calls biologically closely related to this disease; not a survival figure for melanoma
      arising in this disease, and indirect for that reason.
  - reference: PMID:38225622
    reference_title: >-
      Melanoma of the central nervous system based on neurocutaneous melanocytosis in childhood: A
      rare but fatal condition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the expanded cohort, no patient survived longer than 1 year after diagnosis despite
      multimodal therapy (including trametinib; n = 9), with a median survival of 0.4 years (range
      0.1-0.9).
    explanation: >-
      A survival figure for melanoma of the central nervous system in this disease: 27 children from
      a German registry and published reports, none of whom survived a year. The published cases may
      include children counted in other series in this entry.
prevalence:
- population: Japanese infants under one year treated for congenital melanocytic naevi, 2020-2022
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 31600.0
  rate_denominator: POPULATION
  notes: >-
    Not a population prevalence, and the denominator is what makes it meaningful: 38 infants
    starting treatment for congenital melanocytic naevi, all of whom were imaged. The quantity is
    the proportion of that group with the lesion on brain MRI, symptomatic or not, which is why the
    class reads as common and would be absurd read as a figure for the general population. The other
    proportions in this section measure other quantities in other groups, so they are recorded side
    by side rather than averaged.
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM was diagnosed on brain MRI in 31.6% of the 38 patients with CMN and in 25.0% of patients
      with no prior examination or treatment.
    explanation: >-
      The numerator and denominator together. Thirty-eight infants is a small denominator and the
      entry does not present this as a rate for the disease.
- population: Patients with large congenital melanocytic naevi, internet-based registry
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4800.0
  rate_denominator: POPULATION
  notes: >-
    A different quantity from the row above: this counts asymptomatic central nervous system
    involvement only - 4.8% of the 186 registry patients who had magnetic resonance imaging - where
    the row above counts the lesion on brain MRI whether or not there are symptoms. That difference
    does not close the gap: the same registry puts involvement of any kind at 26 of 379. This study
    is also self-reported, which its own limitations section states, while the row above is
    prospective imaging of every infant enrolled.
  evidence:
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 186 patients undergoing MRI, 9 reported abnormal findings without neurologic symptoms
      (4.8%); 80% had LCMN on the posterior axis, whereas 55% had more than 20 satellite nevi.
    explanation: >-
      The figure and its denominator. Self-reported through a questionnaire, which the authors state
      as the method.
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LIMITATIONS: Study data rely on the registry members' self-reported findings and are limited
      by lack of independent data verification.
    explanation: >-
      The authors' own limitation, which is the main reason this figure and the prospective one are
      not averaged.
- population: Children with multiple congenital melanocytic naevi, screened cohort, 1991-2013
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 21000.0
  rate_denominator: POPULATION
  notes: >-
    21% of the children with multiple congenital melanocytic naevi who had a screening scan in a
    specialist cohort; 289 met the criterion for one, and the abstract does not say how many were
    scanned. The denominator is children with more than one congenital melanocytic naevus at birth,
    not the population, and the numerator is an abnormal scan of any kind rather than melanocytosis
    specifically.
  evidence:
  - reference: PMID:25966033
    reference_title: >-
      Classification of neurological abnormalities in children with congenital melanocytic naevus
      syndrome identifies magnetic resonance imaging as the best predictor of clinical outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-one per cent of children with multiple CMN had an abnormal MRI.
    explanation: >-
      The figure and its denominator. Abnormal magnetic resonance imaging rather than melanocytosis,
      which is why this record and the 31.6% one are not the same quantity either.
- population: Individuals with large congenital melanocytic naevi
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 12000.0
  rate_denominator: POPULATION
  notes: >-
    About 12%, from a review, and the only one of this entry's conditional figures stated as a
    lifetime risk rather than a cross-sectional proportion. The same sentence names what raises it:
    wide extension and dorsal axial distribution of the naevus.
  evidence:
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 12% of individuals with LCMN will develop NCM: wide extension and/or dorsal
      axial distribution of LCMN increases the risk of NCM.
    explanation: >-
      The figure and the features that raise it, from a review of the disease.
- population: Europe, general population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  rate_low: 1.0
  rate_high: 9.0
  rate_denominator: POPULATION
  notes: >-
    The only population figure in this entry, and the one a reader filtering on prevalence_class
    needs: every other record here is a proportion among people who already have the cutaneous
    disease, and those read as common because their denominator is small. Orphanet gives a band
    rather than a point estimate: the band itself is carried as the low and high rates, and the
    midpoint is recorded as the point value.
  evidence:
  - reference: ORPHA:2481
    reference_title: >-
      Neurocutaneous melanocytosis
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      1-9 / 100 000 | Europe | Point prevalence | EXPERT
    explanation: >-
      Orphanet's epidemiology row for this disease. The class is an expert estimate rather than a
      measured rate, which is what the source's own Source column says.
animal_models:
- name: Embryonic melanocyte NRAS(G12D) mouse
  species: Mouse
  genotype: oncogenic NRAS (G12D) expressed in melanocytes of developing embryos
  publication: PMID:23303902
  description: >-
    Oncogenic NRAS driven in melanocytes during embryogenesis. It produces the congenital melanocytic
    lesions and the central nervous system melanoma of this disease, and it does not produce cutaneous
    melanoma.
  notes: >-
    No MGI identifier is bound for the targeted gene. The construct is human-numbered oncogenic NRAS
    expressed in mouse melanocytes and the cached abstract names no mouse allele, so the gene is left in
    the genotype string rather than bound to a model-organism identifier that would have to be written
    from memory.
  modeled_mechanisms:
  - target: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the embryonic timing and the two-compartment distribution: congenital melanocytic
      lesions in the skin and melanocytic disease in the central nervous system from one driver.
    limitations: >-
      The allele is G12D. Every mutation-positive patient in the series that established the lesion
      carries a codon 61 substitution instead - twelve of fifteen patients, the other three being
      mutation-negative - and a further cited cohort finds BRAF V600E rather than NRAS in two of
      sixteen, and the
      mouse's cutaneous lesions are described as resembling blue naevi rather than congenital melanocytic
      naevi. The mouse is a conditional transgenic rather than a mosaic, so the one feature that defines
      the human disease - mutant and wild-type cells side by side from a post-zygotic event - is not
      what the model has.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is NRAS G12D expressed from a transgene in a melanocyte lineage. The node's
        quantity is a codon 61 substitution present post-zygotically in one clone among wild-type cells.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cutaneous lesion the mouse makes is reported as resembling human blue naevus, which is not
        the congenital melanocytic naevus this node's descendants form in patients.
    evidence:
    - reference: PMID:23303902
      reference_title: >-
        Primary melanoma of the CNS in children is driven by congenital expression of oncogenic
        NRAS in melanocytes.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        When NRAS(G12D) was expressed in the melanocytes of developing embryos, it induced
        melanocyte proliferation and congenital melanocytic lesions reminiscent of human blue nevi
        but did not induce cutaneous melanoma.
      explanation: >-
        What the model does and does not reproduce, in the authors' own words, which is also the
        source of both divergences recorded above.
  - target: Malignant Transformation to Leptomeningeal Melanoma
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model's unexpected result and the reason it is cited here: early-onset primary melanoma of the
      central nervous system, which is the human disease's lethal arm.
    limitations: >-
      The human tumours are leptomeningeal and arise within a pre-existing melanocytosis; the mouse
      tumours are described as primary central nervous system melanoma without that substrate being
      characterised in the cached abstract.
    evidence:
    - reference: PMID:23303902
      reference_title: >-
        Primary melanoma of the CNS in children is driven by congenital expression of oncogenic
        NRAS in melanocytes.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unexpectedly, however, it did induce early-onset primary melanoma of the central nervous
        system (CNS).
      explanation: >-
        The arm the model does reproduce.
experimental_models:
- name: Patient-derived nevomelanocytic spheroids
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Spheroids grown from spinal cord, brain and skin lesions of four patients, carrying the same NRAS
    mutation as the lesions they came from. It is one of two patient-derived cell systems in the cited literature and the only one in which
    several inhibitors are compared against each other; the other, from a leptomeningeal
    melanomatosis report, is described only as giving first insights into in vitro drug
    sensitivities.
  modeled_mechanisms:
  - target: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The cells are the clone, taken from both compartments of the same patients, and their identity was
      confirmed by the mutation rather than assumed.
    limitations: >-
      Cells out of their tissue: the leptomeningeal environment, the cerebrospinal fluid compartment and
      the skin's architecture are all absent, and clonogenic growth in Geltrex is a proxy for what the
      lesion does in a patient.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Neither the leptomeningeal compartment nor the dermal environment is in the model, so nothing it
        shows bears on why the lesion sits where it does or why it obstructs cerebrospinal fluid.
    evidence:
    - reference: PMID:26354928
      reference_title: >-
        Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated
        with specific inhibitors of NRAS signaling pathway.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        We generated nevomelanocytic spheroids in vitro from lesions of the spinal cord, brain,
        and skin from 4 NCM patients.
      explanation: >-
        What the system is and where it came from: three compartments, four patients.
  evidence:
  - reference: PMID:26354928
    reference_title: >-
      Nevospheres from neurocutaneous melanocytosis cells show reduced viability when treated with
      specific inhibitors of NRAS signaling pathway.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Skin-derived cells formed more colonies than CNS-derived cells.
    explanation: >-
      A difference between the two compartments of the same clone, which is a result this system can
      give and a patient cannot.
discussions:
- discussion_id: ncm_screening_mri_value
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does screening every infant with more than one congenital melanocytic naevus for central nervous
    system involvement change what happens to them?
  attaches_to:
  - diagnosis#Screening brain and spine magnetic resonance imaging
  - progression#Asymptomatic central nervous system involvement
  rationale: >-
    Imaging finds an abnormality in a fifth to a third of the children scanned in the two screening
    series the diagnosis row names, depending on the series and on what counts as an abnormality. No
    cited source shows that finding it early changes the course, and no treatment has been shown to
    change the course. What the cited sources do establish is weaker and still useful: an abnormal
    scan is the most significant predictor of abnormal neurodevelopment, seizures and the need for
    neurosurgery in the largest screened cohort, and that cohort's authors conclude a single
    screening scan is a clinically relevant strategy. Prediction is not benefit, which is why this
    stays a gap rather than a recommendation. The study that set out to answer this names the
    question in its own objective. Against that, the entry's own progression rows record that
    patients with the symptomatic form typically die within three years of symptom onset, so the
    argument for finding it early is not nothing - it is untested. The entry's four prevalence
    records among people with congenital melanocytic naevi span 4.8% to 31.6%, partly because they
    do not all count the same thing - one is asymptomatic involvement only - so the size of the
    screened-positive group is not settled either.
  evidence:
  - reference: PMID:25966033
    reference_title: >-
      Classification of neurological abnormalities in children with congenital melanocytic naevus
      syndrome identifies magnetic resonance imaging as the best predictor of clinical outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal MRI was the most significant predictor of all outcome measures.
    explanation: >-
      What the screened cohort established, which is prediction rather than benefit: the scan
      predicts abnormal neurodevelopment, seizures and the need for neurosurgery. The gap this
      discussion records is the step from predicting to changing.
  - reference: PMID:16310055
    reference_title: >-
      Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic nevi:
      a study of cases from an Internet-based registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent retrospective studies using magnetic resonance imaging (MRI) to screen for
      neurocutaneous melanocytosis (NCM) among neurologically asymptomatic children with large
      congenital melanocytic nevi (LCMN) report high prevalence (23-30%) of asymptomatic NCM. We
      sought to determine prevalence of asymptomatic NCM, and current application of MRI as a
      screening tool.
    explanation: >-
      The size of the asymptomatic group as the literature had it, and a second study setting out to
      measure it - which then reported 4.8%. The gap between those figures is part of why the
      question stays open.
- discussion_id: ncm_targeted_therapy_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does inhibiting the pathway the NRAS mutation activates change the course of the neural disease?
  attaches_to:
  - treatments#MEK inhibition
  - treatments#PI3K and mTOR pathway inhibition
  rationale: >-
    The pathway is known, the drugs exist, and the evidence stops at case reports, one centre's
    series and a registry study, none with a controlled comparison. The series' four children, three
    of them with congenital naevi, had melanoma of the central nervous system; each improved on
    trametinib for one to nine months and then progressed through treatment and died, and in the
    registry study's cohort of 27 children with melanoma of the central nervous system in this
    disease, which adds published cases, none survived a year, including the nine given trametinib
    among other treatments. Of the single patients, one infant's leptomeningeal thickening fell
    rapidly on trametinib and he was developmentally normal at 53 months, but he received
    azacitidine at the same time. Another child took trametinib for seven months and died of
    malignant transformation of his leptomeningeal disease. A 13-year-old received a MEK inhibitor
    and died five days later, too soon for an effect, though his tissue showed reduced pERK
    afterwards. A teenager with parenchymal melanosis seen on imaging had no further decline at
    one-year follow-up, four to five months after trametinib was added to levetiracetam. A child
    with primary diffuse leptomeningeal melanomatosis, an aggressive cancer biologically closely
    related to this disease, received trametinib and everolimus followed by two immunotherapies with
    intraventricular chemotherapy, improved temporarily and survived seven months, so nothing in
    that course can be attributed to the MEK inhibitor either. MEK inhibition has relieved the
    symptoms of melanoma for a time; whether it changes the course of the benign neural lesion has
    not been tested in any comparison the cited reports describe. The cell-culture comparisons point
    at the PI3K/mTOR arm rather than the MEK arm, and the compound that performed best there has
    never been given to a patient in the cited literature. A phase II trial of mirdametinib for
    large and giant naevi is registered (NCT07891286) but not yet recruiting; its primary endpoint
    is the skin naevus, and it admits people with neurocutaneous melanocytosis only if that is
    asymptomatic; the disease is rare enough that a trial of the neural disease would have to be
    international.
  evidence:
  - reference: PMID:24713450
    reference_title: >-
      Experimental treatment of NRAS-mutated neurocutaneous melanocytosis with MEK162, a
      MEK-inhibitor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite surgery, which is often not radical, few other treatment options exist.
    explanation: >-
      The state of treatment stated plainly by one of the groups trying to change it.
  - reference: PMID:24713450
    reference_title: >-
      Experimental treatment of NRAS-mutated neurocutaneous melanocytosis with MEK162, a
      MEK-inhibitor.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies are needed to determine whether MEK inhibitors can effectively target
      NRAS-mutated symptomatic NCM, a rare but potentially fatal disease.
    explanation: >-
      The gap named by the authors of the one patient report that measured a pathway effect. No quote_role
      is recorded: this is a single-patient report's own call for future work, which is neither its
      finding nor somebody else's fact.
- discussion_id: ncm_mouse_allele_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The mouse model of this disease carries NRAS G12D while every mutation-positive patient in the series that established the lesion - twelve of fifteen
    - carries a codon 61 substitution. Does the model's central nervous system melanoma arise
    the way the human one does?
  attaches_to:
  - pathophysiology#Post-zygotic NRAS Codon 61 Mutation
  - animal_models#Embryonic melanocyte NRAS(G12D) mouse
  rationale: >-
    The model is the main non-human evidence for this entry's lethal arm and it differs from the human
    disease in two ways that are not incidental. Its allele is at a different codon, and codon 61 is where the mutation sits in every
    mutation-positive patient of the series that established the lesion. And it is a transgenic rather than a mosaic, so the mutant cells
    are not surrounded by wild-type ones - which is the architecture the word mosaic in this disease's
    name refers to. The model's cutaneous lesions are reported as resembling blue naevi rather than
    congenital melanocytic naevi, which is consistent with the mismatch mattering rather than not. What
    the model does reproduce, early-onset central nervous system melanoma, is the result that made it
    worth building.
  evidence:
  - reference: PMID:23303902
    reference_title: >-
      Primary melanoma of the CNS in children is driven by congenital expression of oncogenic NRAS
      in melanocytes.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NRAS is not a common driver oncogene of primary melanoma of the CNS in adults, but we report
      two cases of primary melanoma of the CNS in children, both of which carried oncogenic
      mutations in NRAS.
    explanation: >-
      The human side the model is held against: two children, in whom the paper does not say which
      codon. INDIRECT because the match between model and patients is what is at issue and this
      sentence does not close it.
notes: >-
  Every cited literature source is a case report, a case series, a retrospective or prospective
  cohort, a review of those, or a laboratory study. Each is cached as its abstract unless its cache
  file records a full text, and a statement here about what a source does not contain is a statement
  about that cached text. Orphanet's structured record for the disease, cited beside them, supplies
  most of the phenotype rows and most of their frequency bands. No randomised or controlled study of
  this disease was found, and wherever the entry uses a cited figure it names the denominator or
  says that the source does not, because the denominators differ in kind and the figures differ with
  them. Three recur among the cited studies. A screening series images every infant with the
  cutaneous lesion and so measures how common the neural lesion is in that group. A tertiary
  neuro-oncology referral series counts the children severe enough to be sent there. A pooled review
  of published cases counts the cases somebody chose to publish, which over-represents the severe;
  the Seizures, Hydrocephalus and Dandy-Walker bands come from it. Orphanet's frequency classes are
  a fourth kind, with no stated population and no denominator.

  The entry's four prevalence records among people with congenital melanocytic naevi span 4.8% to
  31.6%: prospective imaging of 38 Japanese infants gives 31.6%, a screened cohort of children born
  with more than one naevus gives 21%, a review gives about 12%, and a self-reported internet
  registry gives 4.8%. They do not measure the same thing - the 31.6% counts the lesion on brain
  MRI, symptomatic or not, the 21% an abnormal scan of any kind, the 12% a lifetime risk and the
  4.8% asymptomatic involvement only - so they are recorded side by side rather than averaged.

  Treatment evidence is case-level: the drug rows rest on reports of single patients or a few, on
  cells, or on both, and their explanations say which. Nothing in this entry should be read as
  evidence that a drug changes the course of the neural disease; whether inhibiting the pathway the
  NRAS mutation activates does so is the question the second discussion records.

  No ICD-O morphology is assigned. The lesion is an aggregation of naevus cells in the leptomeninges
  and brain parenchyma that can turn into melanoma, and the classification vocabulary's only
  melanocytic value is Melanoma, which would class the benign lesion as the malignant one.
review_notes: >-
  Written from cached sources; the classifications, the mappings and the placement of death in
  infancy also rest on the MONDO, NCIT, ICD-11 and HPO ontologies and on the schema's own
  vocabularies. The rows that transcribe Orphanet's phenotype table were generated from the cached
  record by a script; their notes, and everything else, were written by hand. Where a claim rests on
  one patient or on cells, the explanation says so, because a reader of a card sees the explanation
  and not the methods.

  Three things are deliberately absent. No reference range or laboratory threshold is recorded,
  because none of the cited sources gives one for this disease. No cell of origin is asserted beyond melanoblast, which is
  inferred from where the clone's descendants end up rather than observed, and the pathophysiology node
  says so. And the mutation-testing diagnosis row carries no diagnosis_term, because the nearest cached
  NCIT clinical-action term names immunohistochemistry and this row is a sequencing test; an
  approximately-right binding there would assert the wrong method.

name: Neurocutaneous Melanocytosis
creation_date: '2026-11-13T20:10:00Z'
disease_term:
  preferred_term: neurocutaneous melanocytosis
  term:
    id: MONDO:0009578
    label: neurocutaneous melanocytosis
categories:
- Neurocutaneous disorder
- Mosaic disorder
- Neurological disorder
parents:
- congenital melanocytic naevus syndrome
synonyms:
- NCM
- neurocutaneous melanosis
- melanosis neurocutanea
description: >-
  A mosaic disorder in which one post-zygotic NRAS mutation, arising in a melanoblast precursor before
  the neural crest has finished migrating, leaves melanocytic lesions in two places at once: congenital
  melanocytic naevi in the skin, and melanocytosis of the leptomeninges and brain parenchyma. The same
  codon 61 mutation is found in the skin and in the central nervous system lesions of one patient and is
  absent from their blood, which is what makes this one disease rather than two. Most central nervous
  system involvement is benign and much of it is silent, but it can obstruct cerebrospinal fluid flow,
  cause epilepsy, and transform to melanoma; symptomatic disease carries a poor prognosis. Non-melanocytic malformations - Dandy-Walker, arachnoid cysts, cortical dysplasia - occur in the
  same patients, and the non-melanocytic central nervous system samples that were sequenced in one
  series all carried the mutation. That series does not say which lesions those samples came from,
  so the mutation is established for the class and not for any named malformation.
inheritance:
- name: Somatic mosaicism
  inheritance_term:
    preferred_term: typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    The causal NRAS mutation is post-zygotic. It is present in affected skin and in affected central
    nervous system tissue and absent from blood and unaffected tissue, so the disease exists only as
    a mosaic. No cited source describes a constitutional form.
  evidence:
  - reference: PMID:23392294
    reference_title: >-
      Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by postzygotic
      mutations in codon 61 of NRAS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oncogenic missense mutations in codon 61 of NRAS were found in affected neurological and
      cutaneous tissues of 12 out of 15 patients, but were absent from unaffected tissues and blood,
      consistent with NRAS mutation mosaicism.
    explanation: >-
      The mosaicism, demonstrated the way mosaicism has to be: the mutation is in the affected
      tissue on both sides of the disease and in neither the blood nor the unaffected tissue of the
      same patient, in twelve of fifteen.
  - reference: PMID:1869648
    reference_title: >-
      Neurocutaneous melanosis: definition and review of the literature.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurocutaneous melanosis is a rare congenital syndrome characterized by the presence of large
      or multiple congenital melanocytic nevi and benign or malignant pigment cell tumors of the
      leptomeninges.
    explanation: >-
      The definition the field still uses, from the 1991 review of 39 cases that proposed the
      revised criteria. INDIRECT for the inheritance claim, which this sentence does not make; it is
      cited here because the two halves it names are the two halves of this entry's pathograph.
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenically, single postzygotic mutations in the NRAS (neuroblastoma RAS viral oncogene
      homologue; MIM # 164790; at 1p13.2) proto-oncogene explain the occurrence of single/multiple
      CMNs and melanocytic and non-melanocytic nervous system lesions in NCM: these disrupt the
      RAS/ERK/mTOR/PI3K/akt pathways.
    explanation: >-
      A review stating the same thing as the field's settled account, and adding what this entry's
      pathophysiology turns on: the one post-zygotic mutation explains the non-melanocytic nervous
      system lesions as well as the melanocytic ones.
pathophysiology:
- name: Post-zygotic NRAS Codon 61 Mutation
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    One activating missense mutation at codon 61 of NRAS, arising after fertilisation in a cell of the
    melanoblast lineage. Codon 61 is the hotspot: ten of twelve mutation-positive patients in the series
    that established this carried c.181C>A p.Q61K and two c.182A>G p.Q61R.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: melanoblast
    term:
      id: CL:0000541
      label: melanoblast
  genes:
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  molecular_functions:
  - preferred_term: NRAS G protein switch activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003925
      label: G protein activity
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  evidence:
  - reference: PMID:23392294
    reference_title: >-
      Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by postzygotic
      mutations in codon 61 of NRAS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 10 patients, the mutation was consistently c.181C>A, p.Q61K, and in 2 patients c.182A>G,
      p.Q61R.
    explanation: >-
      The two alleles and their split across twelve mutation-positive patients, which is the source
      of the variant detail on this node.
  - reference: PMID:33048248
    reference_title: >-
      Neurocutaneous melanocytosis (melanosis).
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenically, single postzygotic mutations in the NRAS (neuroblastoma RAS viral oncogene
      homologue; MIM # 164790; at 1p13.2) proto-oncogene explain the occurrence of single/multiple
      CMNs and melanocytic and non-melanocytic nervous system lesions in NCM: these disrupt the
      RAS/ERK/mTOR/PI3K/akt pathways.
    explanation: >-
      A review stating the lesion and the pathways it acts through. The molecular function is graded
      GAIN_OF_FUNCTION and the process INCREASED for the usual reason: a RAS codon 61 substitution
      takes the switch outside its normal regulatory control, and what is observed downstream is a
      pathway running above normal.
  notes: >-
    No cited source measures the hydrolysis defect itself in this disease, so nothing is asserted about
    it. The cell the mutation arises in is inferred from where its descendants end up - skin and neuraxis
    - rather than observed; the binding is to melanoblast, the migrating precursor, and the inference is
    the next node's claim.
  downstream:
  - target: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
    causal_link_type: DIRECT
    description: >-
      A mutation in one cell becomes a disease in two organs only if that cell is an ancestor of both
      populations. That is the step this edge asserts, and the evidence for it is that the same mutation
      is in both and in neither the blood nor the unaffected tissue of the same patient.
    evidence:
    - reference: PMID:23392294
      reference_title: >-
        Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by
        postzygotic mutations in codon 61 of NRAS.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Oncogenic missense mutations in codon 61 of NRAS were found in affected neurological and
        cutaneous tissues of 12 out of 15 patients, but were absent from unaffected tissues and
        blood, consistent with NRAS mutation mosaicism.
      explanation: >-
        The whole edge in one sentence: the same mutation in the neurological and the cutaneous
        tissue of the same patient, and in neither their blood nor their unaffected tissue.
- name: Mosaic Melanocytic Clone Spanning Skin and Neuraxis
  role: effector
  biological_scale: CELLULAR
  description: >-
    The mutant clone, distributed by neural crest migration. Its descendants reach the skin and the
    leptomeninges, which is why the two halves of this disease are one disease. The clone is not confined
    to melanocytes: the non-melanocytic central nervous system lesions of these patients carry the same
    mutation.
  cell_types:
  - preferred_term: melanoblast
    term:
      id: CL:0000541
      label: melanoblast
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: melanocyte differentiation
    term:
      id: GO:0030318
      label: melanocyte differentiation
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:23392294
    reference_title: >-
      Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by postzygotic
      mutations in codon 61 of NRAS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 11 non-melanocytic and melanocytic CNS samples from 5 patients were mutation positive,
      despite NRAS rarely being reported as mutated in CNS tumors.
    explanation: >-
      Every central nervous system sample tested carried the mutation, melanocytic and
      non-melanocytic alike. The second clause matters as much as the first: NRAS is not a common
      driver in central nervous system tumours, so finding it in all eleven is evidence of a shared
      clone rather than of a recurrent somatic event.
  - reference: PMID:23303902
    reference_title: >-
      Primary melanoma of the CNS in children is driven by congenital expression of oncogenic NRAS
      in melanocytes.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When NRAS(G12D) was expressed in the melanocytes of developing embryos, it induced melanocyte
      proliferation and congenital melanocytic lesions reminiscent of human blue nevi but did not
      induce cutaneous melanoma.
    explanation: >-
      The clone's behaviour modelled in mouse embryos, and the model's own limit. Expressing
      oncogenic NRAS in embryonic melanocytes produced congenital melanocytic lesions and
      proliferation, which is this node; it did not produce cutaneous melanoma, and the allele is
      G12D rather than the codon 61 one patients carry.
  downstream:
  - target: Congenital Melanocytic Naevi
    causal_link_type: DIRECT
    description: >-
      The cutaneous half: the clone's descendants that reach the skin.
    evidence:
    - reference: PMID:23392294
      reference_title: >-
        Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by
        postzygotic mutations in codon 61 of NRAS.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesized that a single postzygotic mutation in NRAS could be responsible for
        multiple CMN in the same individual, as well as for melanocytic and nonmelanocytic central
        nervous system (CNS) lesions.
      explanation: >-
        The hypothesis this edge states, quoted as a hypothesis. The same paper's results
        sentence, cited on the node above, is what tested it. INDIRECT because the sentence frames
        the study rather than reporting its finding.
  - target: Leptomeningeal and Parenchymal Melanocytosis
    causal_link_type: DIRECT
    description: >-
      The neural half: the clone's descendants that stay with the neuraxis. Where they settle is not
      random - the amygdala is the commonest site on screening imaging.
    evidence:
    - reference: PMID:37777590
      reference_title: >-
        Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
        melanocytic nevi.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NCM lesions were most frequently seen in the amygdala, followed by the cerebellum,
        brainstem, and cerebral hemispheres.
      explanation: >-
        Where the clone ends up inside the central nervous system, from brain magnetic resonance
        imaging of 38 Japanese infants with congenital melanocytic naevi. It is the source of the
        amygdala binding on the target node.
  - target: Non-Melanocytic Central Nervous System Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The malformations carry the mutation too, which is why they belong in this entry's chain rather
      than beside it as coincidence. No cited source shows how a RAS-activated clone produces a
      Dandy-Walker malformation or an arachnoid cyst, so the edge is drawn through unknown intermediates.
    evidence:
    - reference: PMID:23392294
      reference_title: >-
        Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by
        postzygotic mutations in codon 61 of NRAS.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All 11 non-melanocytic and melanocytic CNS samples from 5 patients were mutation positive,
        despite NRAS rarely being reported as mutated in CNS tumors.
      explanation: >-
        The non-melanocytic lesions carry the same mutation, which is the only part of this edge
        any cited source establishes. INDIRECT: the sentence shows the lesions share the clone,
        not that the clone caused the malformation.
- name: Congenital Melanocytic Naevi
  role: effector
  biological_scale: TISSUE
  description: >-
    The cutaneous lesions, present at birth, large or multiple or both, often with overlying
    hypertrichosis and with smaller satellite naevi. Their size, distribution, satellite count and
    surface features are what predict the neural half, which is why they are a mechanism node here and
    not only a phenotype.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distribution and size of CMN, number of satellite nevi, rugosity and nodules were strongly
      associated with the existence of NCM, and these findings may guide a future registry study
      with a large cohort of CMN patients.
    explanation: >-
      The features of the cutaneous lesion that predict the neural one. The authors' own hedge is
      kept: this is an association in 38 infants, offered as a basis for a registry study rather
      than as a rule.
  downstream:
  - target: Hypertrichosis
    causal_link_type: DIRECT
    description: >-
      Hair overlying the naevus, which a review names inside its definition of the syndrome rather
      than as an associated finding.
    evidence:
    - reference: PMID:33048248
      reference_title: >-
        Neurocutaneous melanocytosis (melanosis).
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a rare, congenital syndrome characterised by the association of (1) congenital melanocytic
        nevi (CMN) of the skin with overlying hypertrichosis
      explanation: >-
        The naevus and the overlying hypertrichosis in the same clause, which is the edge.
        INDIRECT: a definition states the association rather than deriving one from the other.
  - target: Melanocytic naevi of the skin
    causal_link_type: DIRECT
    description: The lesion as the clinical finding a parent and a clinician see at birth.
    evidence:
    - reference: PMID:16310055
      reference_title: >-
        Asymptomatic neurocutaneous melanocytosis in patients with large congenital melanocytic
        nevi: a study of cases from an Internet-based registry.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of 186 patients undergoing MRI, 9 reported abnormal findings without neurologic symptoms
        (4.8%); 80% had LCMN on the posterior axis, whereas 55% had more than 20 satellite nevi.
      explanation: >-
        The cutaneous features reported in the same sentence as the asymptomatic cases, without a stated
        denominator. INDIRECT for this edge, and read as a description of who is screened rather
        than of who screens positive.
- name: Leptomeningeal and Parenchymal Melanocytosis
  role: effector
  biological_scale: TISSUE
  description: >-
    Melanocytes where there should be almost none: infiltrating the leptomeninges and deposited in the
    brain parenchyma. About a third of infants with congenital melanocytic naevi have it on screening imaging; the series
    that gives that figure reports no symptom data at all, and no cited source establishes what
    proportion of those found on screening go on to neurological disease. It is the
    lesion every consequence below depends on.
  locations:
  - preferred_term: leptomeninx
    term:
      id: UBERON:0000391
      label: leptomeninx
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:37777590
    reference_title: >-
      Incidence of neurocutaneous melanosis in Japanese pediatric patients with congenital
      melanocytic nevi.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCM was diagnosed on brain MRI in 31.6% of the 38 patients with CMN and in 25.0% of patients
      with no prior examination or treatment.
    explanation: >-
      How common the lesion is among infants with the cutaneous disease when everyone is imaged:
      about a third. Read the denominator - 38 Japanese infants referred for treatment of their
      naevi, not an unselected population.
  - reference: PMID:22469364
    reference_title: >-
      Spectrum of central nervous system abnormalities in neurocutaneous melanocytosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had neuroimaging: six had findings suggestive of diffuse leptomeningeal
      melanocytosis; seven had multifocal melanocytic deposits; and one patient had normal
      neuroimaging but focal seizures.
    explanation: >-
      The two radiological forms this node covers, in fourteen children referred to a neuro-oncology
      service - and the patient with seizures and a normal scan, which is why imaging is not the
      definition of the lesion.
  notes: >-
    The denominators on this node point in opposite directions and both are needed. A screening series of
    infants with congenital melanocytic naevi finds the lesion in about a third of them, nearly all
    symptom-free; a neuro-oncology referral series finds diffuse leptomeningeal disease in six of
    fourteen and four leptomeningeal melanomas among six deaths. Neither is the disease's natural
    history: one counts who has the lesion and the other counts who was sent to a tertiary service.
  downstream:
  - target: Obstruction of Cerebrospinal Fluid Flow
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Melanocytes infiltrating the leptomeninges obstruct cerebrospinal fluid flow. No cited source
      measures the obstruction; what they report is hydrocephalus in patients with the lesion, which is
      why the edge is drawn through unknown intermediates.
    evidence:
    - reference: PMID:29948137
      reference_title: >-
        Neurocutaneous melanosis presenting with hydrocephalus and malignant transformation:
        case-based update.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe the case of a 5-month-old boy who presented with giant congenital melanocytic
        nevus and hydrocephalus. MR imaging and CSF immunohistochemistry confirmed leptomeningeal
        melanosis.
      explanation: >-
        The lesion and the hydrocephalus in one infant, with the lesion confirmed on imaging and
        cerebrospinal fluid immunohistochemistry. One patient, and the association rather than the
        mechanism, which is what the edge claims.
  - target: Cranial nerve palsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Melanocytic infiltration of the leptomeninges is where the cranial nerves run, and cranial
      nerve palsy is on the review's list of this disease's neurological manifestations. No cited
      source shows the infiltrate compressing a nerve, so the edge is drawn through unknown
      intermediates and could as well run through the raised pressure node.
    evidence:
    - reference: PMID:33048248
      reference_title: >-
        Neurocutaneous melanocytosis (melanosis).
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurological manifestations can appear acutely in infancy, or more frequently later in
        childhood or adult life, and include signs/symptoms of intracranial hypertension,
        seizures/epilepsy, cranial nerve palsies, motor/sensory deficits, cognitive/behavioural
        abnormalities, sleep cycle anomalies, and eventually neurological deterioration.
      explanation: >-
        The manifestation listed as one of this disease's, without a frequency and without a
        mechanism. INDIRECT for both reasons.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Profound delay occurs in a minority of children with the lesion and most have none or only mild
      delay, so this edge asserts a possible consequence and not a usual one. What separates them is
      partly established: in the largest screened cohort an abnormal scan was the most significant
      predictor of abnormal neurodevelopment, and the cohort split into intraparenchymal melanosis
      alone, which was not associated with malignancy or death even when symptomatic, and all other
      pathology, which was not so benign.
    evidence:
    - reference: PMID:22469364
      reference_title: >-
        Spectrum of central nervous system abnormalities in neurocutaneous melanocytosis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three patients had profound developmental delay; the other 11 patients had no or mild
        delay.
      explanation: >-
        Both halves, because three of fourteen is what the edge claims and eleven of fourteen is
        what keeps it from being read as the rule. INDIRECT: an outcome counted in children with
        the lesion, not derived from it.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epilepsy is the commonest neurological manifestation, and in the pooled neurosurgical literature
      the commonest symptom of any kind. How the melanocytic deposits produce it is not established by
      any cited source; focal cortical dysplasia in the same patients is one route and the deposits
      themselves another.
    evidence:
    - reference: PMID:35535823
      reference_title: >-
        Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seizures were the most frequently reported symptom (55%, 41/74 cases).
      explanation: >-
        The frequency, pooled across 74 published patients. INDIRECT for the edge: a symptom
        frequency in patients with the lesion is not a demonstration that the lesion produced it,
        and a pooled case-report series over-represents the symptomatic.
  - target: Malignant Transformation to Leptomeningeal Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The melanocytosis is the substrate melanoma arises in. A second genetic event is implicated rather
      than shown: loss of heterozygosity accompanied the onset of melanoma in two patients of the series
      that established the NRAS lesion, which the authors read as a multistep progression.
    evidence:
    - reference: PMID:23392294
      reference_title: >-
        Multiple congenital melanocytic nevi and neurocutaneous melanosis are caused by
        postzygotic mutations in codon 61 of NRAS.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loss of heterozygosity was associated with the onset of melanoma in two cases, implying a
        multistep progression to malignancy.
      explanation: >-
        The transition, and the authors' own word for how far it is established: implying. Two
        patients.
- name: Obstruction of Cerebrospinal Fluid Flow
  role: effector
  biological_scale: ORGANISM
  description: >-
    Thickened, infiltrated leptomeninges impede cerebrospinal fluid circulation and absorption. This is
    the arm that brings patients to neurosurgery: cerebrospinal fluid shunting is the commonest operation
    performed in this disease.
  locations:
  - preferred_term: leptomeninx
    term:
      id: UBERON:0000391
      label: leptomeninx
  evidence:
  - reference: PMID:35535823
    reference_title: >-
      Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common surgical technique was CSF shunting (43%, 24/56 operations), with tethered
      cord release (4%, 2/56 operations) being the least frequently performed.
    explanation: >-
      What is done about this node, which is also the measure of how often it matters: shunting is
      nearly half of all operations across 74 pooled patients.
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: The obstruction expressed as ventricular enlargement.
    evidence:
    - reference: PMID:35535823
      reference_title: >-
        Neurosurgical management of patients with neurocutaneous melanosis: a systematic review.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurological diagnoses associated with NCM included epilepsy (45%, 33/74 cases),
        hydrocephalus (24%, 18/74 cases), Dandy-Walker malformation (24%, 18/74 cases), and
        primary CNS melanocytic tumors (23%, 17/74 cases).
      explanation: >-
        The frequencies of this phenotype and of three others in the entry, pooled over 74
        published patients. The denominator is published cases, which over-represents the
        symptomatic.
  - target: Increased intracranial pressure
    causal_link_type: DIRECT
    description: >-
      The pressure the obstruction raises, and the presentation most often missed: in the pooled
      leptomeningeal melanomatosis literature it is present in two thirds and is the stated reason for
      delayed diagnosis.
    evidence:
    - reference: PMID:33921303
      reference_title: >-
        Novel Insights into Diagnosis, Biology and Treatment of Primary Diffuse Leptomeningeal
        Melanomatosis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of these cases revealed that the unspecific clinical presentation, such as
        unrecognized increased intracranial pressure (present in 67%), is a frequent reason for
        the delay in diagnosis.
      explanation: >-
        The frequency and its consequence. The cohort is primary diffuse leptomeningeal
        melanomatosis rather than this disease as a whole, which is the malignant end of it;
        INDIRECT for that reason.
- name: Malignant Transformation to Leptomeningeal Melanoma
  role: effector
  biological_scale: CELLULAR
  description: >-
    Melanoma arising within the leptomeningeal lesion. It is what kills: in the tertiary referral series
    four of the six children who died had leptomeningeal melanoma, and in the pooled melanomatosis

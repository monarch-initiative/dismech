- name: Other mosaic RASopathies
  description: >-
    Mosaic conditions that a review of the RASopathies lists with this disease: sebaceous naevus
    syndrome, McCune-Albright syndrome, phakomatosis pigmentokeratotica, epidermal naevus syndrome
    and encephalocraniocutaneous lipomatosis. The review's abstract does not compare their
    presentation with that of this disease. It notes that many RASopathies can be diagnosed
    clinically from their cutaneous findings; the skin lesion of this disease is the congenital
    melanocytic naevus.

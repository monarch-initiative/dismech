discussions:
- discussion_id: shashi_rbmx_mouse_human_mismatch
  prompt: >-
    Can rodent Rbmx models be used to study Shashi X-linked intellectual
    disability, given that Rbmx-deficient mice show only mild cortical
    abnormalities while affected humans have moderate intellectual disability?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cortical Development
  rationale: >-
    RBMX has an independently arisen retrocopy, RBMXL1, in both primates and
    rodents. RBMX and RBMXL1 share protein and RNA partners and act redundantly
    in brain development, so RBMXL1 buffers RBMX deficiency in a context- and
    dosage-dependent manner. Because that buffering differs between species,
    a mild murine cortical phenotype cannot be read as evidence against a
    severe human mechanism, and rodent models may systematically understate
    the consequences of RBMX loss.
  evidence:
  - reference: PMID:42360281
    reference_title: >-
      RBMX functional retrocopy safeguards brain development in a
      species-dependent context.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite severe phenotypes in humans, Rbmx-deficient mice display only
      mild cortical abnormalities.
    explanation: >-
      States the human-model phenotype mismatch directly.
  - reference: PMID:42360281
    reference_title: >-
      RBMX functional retrocopy safeguards brain development in a
      species-dependent context.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings establish RBMXL1 as a functional paralog of RBMX
      that is likely buffering deleterious variation in a context- and
      dosage-dependent manner.
    explanation: >-
      Provides the mechanistic explanation (paralog buffering) for why the
      mouse model under-reproduces the human phenotype.
- discussion_id: shashi_obesity_macroorchidism_mechanism_gap
  prompt: >-
    What links RBMX/hnRNP G loss of function to obesity and macroorchidism, the
    two non-neurological cardinal features of the Shashi syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RBMX Loss of Function
  rationale: >-
    All the mechanistic work on the Shashi RGG/RG allele to date addresses
    neural phenotypes (SRSF1 complex assembly, MDM4 splicing, p53 activation,
    neural progenitor differentiation). No published work explains why loss of
    an ubiquitously expressed splicing regulator produces obesity and
    macroorchidism, and the corresponding causal edges are therefore modelled
    with unknown intermediates.
  evidence:
  - reference: PMID:39356106
    reference_title: >-
      An anciently diverged family of RNA binding proteins maintain correct
      splicing of a class of ultra-long exons through cryptic splice site
      repression.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that in somatic cells the similar yet ubiquitously
      expressed RBMX protein has similar functions.
    explanation: >-
      Confirms that RBMX is ubiquitously expressed in somatic cells, which is
      what makes the tissue-restricted metabolic and gonadal phenotypes an
      unexplained gap rather than an obvious consequence.
  proposed_experiments:
  - experiment_id: shashi_tissue_resolved_splicing
    name: Tissue-resolved splicing analysis in RBMX-deficient adipose and testis
    description: >-
      Compare RBMX-dependent alternative splicing programs in adipose and
      gonadal tissue against neural tissue to identify tissue-restricted
      mis-splicing events that could account for the metabolic and gonadal
      features.
notes: >-
  This is a small-literature disorder: the clinical description rests on two
  families (nine affected males in total) reported in 2000 and 2003, with the
  causal RBMX allele identified in 2015 and functionally characterized in
  isogenic patient-genotype iPSCs in 2021. No GeneReviews chapter exists for
  RBMX-related or Shashi X-linked intellectual disability (the only Shashi
  GeneReviews chapter, PMID:39527683, covers the unrelated ASXL2-associated
  Shashi-Pena syndrome). The entry is deliberately kept thin rather than padded
  with unsourced claims; prevalence, natural history, and management are not
  quantitatively described in the primary literature.

  Deep-research caveat: the Edison/falcon report generated for this entry
  summarized the historical phenotype as "intellectual disability, short
  stature, obesity, and hypogonadism", apparently from an aggregated
  secondary source. That is not what the primary reports say. PMID:10677307
  and PMID:12605440 describe macroorchidism (large testicles / large testes),
  which is the opposite of hypogonadism, and neither abstract mentions short
  stature. The phenotype list here is taken directly from the primary
  abstracts; short stature and hypogonadism were deliberately not curated.
  Similarly, features such as microcephaly, corpus callosum abnormalities,
  seizures and early death belong to the wider RBMX-related spectrum
  (especially Gustavson syndrome) and are not assigned to the Shashi type.

  Frequency-band convention in this entry. The single PMID:10677307 sentence
  "Clinical findings in the seven living affected males include a moderate
  degree of mental retardation (MR), coarse facies, puffy eyelids, narrow
  palpebral fissures, prominent supraorbital ridges, a bulbous nose, a
  prominent lower lip, large ears, obesity, and large testicles" is the source
  for ten phenotypes, but only four of them carry a VERY_FREQUENT band:
  moderate intellectual disability, coarse facial features, obesity and
  macroorchidism. These are the cardinal features of the syndrome and are the
  ones re-observed in the independent second family (PMID:12605440), so a
  Pattern C qualitative band for a highly characteristic feature is defensible
  and is declared as such in each explanation. The remaining six entries -
  puffy eyelids, narrow palpebral fissures, prominent supraorbital ridges,
  bulbous nose, prominent lower lip and large ears - are the constituent
  sub-features of the coarse facial gestalt that "coarse facies" already
  captures. Banding each of them separately would re-assert the same single
  observation six more times at a granularity the source does not support (the
  sentence gives no per-feature count within the seven males), so they are
  deliberately left without a band per
  docs/frequency-evidence-guidelines.md ("when in doubt, omit the frequency").

  Pathograph shape. The distinctive craniofacial gestalt, obesity and
  macroorchidism hang off "RBMX Loss of Function" as parallel
  INDIRECT_UNKNOWN_INTERMEDIATES consequences, not off "Syndromic
  Neurodevelopmental Impairment". No published work links impaired
  corticogenesis to adiposity, testicular volume or craniofacial patterning,
  and asserting such edges would contradict the
  shashi_obesity_macroorchidism_mechanism_gap knowledge gap recorded below.
  Only "Moderate intellectual disability" descends from the corticogenesis
  branch.

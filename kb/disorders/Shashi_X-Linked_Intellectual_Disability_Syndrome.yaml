  prevalence_class: ULTRA_RARE
  notes: >-
    Only two families have been reported: the original four-generation North
    Carolina kindred with seven living affected males, and a Brazilian family
    with two affected brothers.
  evidence:
  - reference: PMID:10677307
    reference_title: >-
      A unique form of mental retardation with a distinctive phenotype maps to
      Xq26-q27.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel X-linked mental retardation (XLMR) syndrome, with
      characteristic facial dysmorphic features, segregating in a large North
      Carolina family. Only males are affected, over four generations.
    explanation: >-
      Establishes the size and structure of the index kindred, the primary
      source of reported cases.
  - reference: PMID:12605440
    reference_title: 'Shashi XLMR syndrome: report of a second family.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes a family with mental retardation in two brothers.
    explanation: >-
      The only additional reported family contributes two further affected
      males, supporting an ultra-rare literature case count.
pathophysiology:
- name: RBMX Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The proximal lesion is loss of function of RBMX, which encodes the
    RNA-binding protein hnRNP G. In the original Shashi kindred a 23 bp
    frameshift deletion segregates with disease in affected males and removes
    the RGG/RG motif of hnRNP G. RBMX is relatively intolerant to
    loss-of-function variation, a pattern shared by other X-linked
    intellectual disability genes.
  genes:
  - preferred_term: RBMX
    term:
      id: hgnc:9910
      label: RBMX
  molecular_functions:
  - preferred_term: mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:25256757
    reference_title: >-
      The RBMX gene as a candidate for the Shashi X-linked intellectual
      disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On whole exome sequencing in the large family originally reported with
      this disorder, we identified a 23 bp frameshift deletion in the RNA
      binding motif protein X-linked (RBMX) gene at Xq26 in the affected males
      (n = 7), one carrier female, absent in unaffected males (n = 2) and in
      control databases (7800 exomes).
    explanation: >-
      Directly identifies the segregating RBMX frameshift deletion as the
      causal lesion in the index family.
  - reference: PMID:25256757
    reference_title: >-
      The RBMX gene as a candidate for the Shashi X-linked intellectual
      disability syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      the findings were indicative of RBMX being relatively intolerant to loss
      of function variants, a distinctive pattern seen in a subset of XLID
      genes
    explanation: >-
      Genic intolerance analysis supports loss of function as the operative
      mechanism class for RBMX.
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA binding motif protein X-linked (RBMX) encodes the heterogeneous
      nuclear ribonucleoprotein G (hnRNP G) that regulates splicing, sister
      chromatid cohesion and genome stability.
    explanation: >-
      Establishes the gene product identity and its core molecular functions.
  downstream:
  - target: Disrupted hnRNP G RGG/RG-Dependent Splicing Regulation
    description: >-
      Deletion of the RGG/RG motif removes the low-complexity region through
      which hnRNP G engages RNA polymerase II and splicing partners.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37277488
      reference_title: >-
        Gustavson syndrome is caused by an in-frame deletion in RBMX associated
        with potentially disturbed SH3 domain interactions.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Deletion of the RGG/RG motif in hnRNP G has previously been associated
        with Shashi syndrome, however involvement of other hnRNP G domains in
        intellectual disability remain unknown.
      explanation: >-
        Assigns the Shashi-associated lesion specifically to the RGG/RG motif
        of hnRNP G.
  - target: Distinctive craniofacial dysmorphism
    description: >-
      The recognizable facial gestalt is a parallel consequence of RBMX loss
      rather than a downstream consequence of impaired corticogenesis; the
      developmental intermediates linking RBMX loss to craniofacial patterning
      are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10677307
      reference_title: >-
        A unique form of mental retardation with a distinctive phenotype maps to
        Xq26-q27.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cephalometric measurements suggest that the affected males have a
        distinctive craniofacial skeletal structure, when compared with normative
        measures.
      explanation: >-
        Documents that the craniofacial phenotype co-occurs with the syndrome in
        affected males. It does not establish the developmental intermediates
        between RBMX loss and craniofacial patterning, hence PARTIAL.
  - target: Obesity
    description: >-
      Obesity is a consistent non-neurological feature of the syndrome and is
      modeled as a parallel consequence of RBMX loss; no mechanistic
      intermediate between RBMX loss and adiposity has been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12605440
      reference_title: 'Shashi XLMR syndrome: report of a second family.'
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical features consist of coarse face, prominent lower lip, large
        testes, and obesity.
      explanation: >-
        Establishes obesity as a feature of the syndrome in a second independent
        family. No mechanistic intermediate between RBMX loss and adiposity is
        demonstrated, hence PARTIAL.
  - target: Macroorchidism
    description: >-
      Macroorchidism is a consistent feature in affected males and is modeled as
      a parallel consequence of RBMX loss; the intermediates are unknown,
      although genital malformations are part of the broader RBMX-variant
      spectrum.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42360281
      reference_title: >-
        RBMX functional retrocopy safeguards brain development in a
        species-dependent context.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hemizygous RBMX variants lead to neurodevelopmental disorders
        characterized by intellectual disability and variable brain, ocular, and
        genital malformations.
      explanation: >-
        Places genital phenotypes within the hemizygous RBMX-variant spectrum,
        consistent with the macroorchidism of the Shashi type. The causal
        intermediates are not established, hence PARTIAL.
- name: Disrupted hnRNP G RGG/RG-Dependent Splicing Regulation
  biological_scale: MOLECULAR
  description: >-
    hnRNP G is an m6A reader that binds RNA through an RRM and Arg-Gly-Gly
    (RGG) motifs and uses those RGG motifs to contact the phosphorylated
    C-terminal domain of RNA polymerase II, coupling it co-transcriptionally to
    nascent pre-mRNA and to transcriptome-wide alternative splicing decisions.
    Loss of the RGG/RG motif therefore removes the principal interface through
    which hnRNP G regulates splice-site selection.
  biological_processes:
  - preferred_term: regulation of mRNA splicing, via spliceosome
    term:
      id: GO:0048024
      label: regulation of mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31445886
    reference_title: >-
      Regulation of Co-transcriptional Pre-mRNA Splicing by m(6)A through the
      Low-Complexity Protein hnRNPG.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that hnRNPG directly binds to the phosphorylated
      carboxy-terminal domain (CTD) of RNA polymerase II (RNAPII) using RGG
      motifs in its low-complexity region.
    explanation: >-
      Identifies the RGG motifs deleted in Shashi-XLID as the interface hnRNP G
      uses to engage the transcription machinery.
  - reference: PMID:31445886
    reference_title: >-
      Regulation of Co-transcriptional Pre-mRNA Splicing by m(6)A through the
      Low-Complexity Protein hnRNPG.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through interactions with the phosphorylated CTD and nascent RNA, hnRNPG
      associates co-transcriptionally with RNAPII and regulates alternative
      splicing transcriptome-wide.
    explanation: >-
      Establishes that the RGG-dependent interaction controls alternative
      splicing genome-wide, the process disrupted by the Shashi allele.
  - reference: PMID:24692659
    reference_title: >-
      Characterization of the RNA recognition mode of hnRNP G extends its role
      in SMN2 splicing regulation.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We report that in addition to the C-terminal region of hnRNP G, the RNA
      Recognition Motif (RRM) and the middle part of the protein containing the
      Arg-Gly-Gly (RGG) box are important for this function.
    explanation: >-
      Structural work on a model target (SMN2 exon 7) independently shows the
      RGG box is required for hnRNP G splicing activity, though the target is
      not itself implicated in Shashi-XLID.
  - reference: PMID:39356106
    reference_title: >-
      An anciently diverged family of RNA binding proteins maintain correct
      splicing of a class of ultra-long exons through cryptic splice site
      repression.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      RBMX protein-RNA interactions are enriched within ultra-long exons,
      particularly within genes involved in genome stability, and repress the
      selection of cryptic splice sites that would compromise gene function.
    explanation: >-
      Defines a second, Shashi-independent arm of RBMX splicing control
      (cryptic splice-site repression in ultra-long exons) that is plausibly
      perturbed by loss of function but has not been demonstrated for the
      Shashi allele specifically.
  - reference: PMID:39356106
    reference_title: >-
      An anciently diverged family of RNA binding proteins maintain correct
      splicing of a class of ultra-long exons through cryptic splice site
      repression.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The C-terminal disordered domain of RBMXL2 is sufficient to rescue proper
      splicing control after RBMX depletion.
    explanation: >-
      Implicates the C-terminal disordered region — the part of hnRNP G removed
      by the Shashi frameshift deletion — as the functional module for splicing
      control, in a paralog rescue experiment rather than in Shashi cells.
  downstream:
  - target: RBMX/SRSF1 Higher-Order Complex Disruption
    description: >-
      Loss of the methylated RGG/RG motif prevents higher-order assembly with
      the SRSF1 splicing factor.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34260915
      reference_title: >-
        Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
        p53 activation and neuronal differentiation defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Moreover, we identify that the RBMX RGG/RG motif is methylated by
        protein arginine methyltransferase 5 (PRMT5), and this regulates
        assembly with the SRSF1 splicing factor into higher-order complexes.
      explanation: >-
        Links the RGG/RG motif directly to SRSF1 complex assembly.
- name: RBMX/SRSF1 Higher-Order Complex Disruption
  biological_scale: MOLECULAR
  description: >-
    The RBMX RGG/RG motif is methylated by PRMT5, and this methylation licenses
    assembly with the SRSF1 splicing factor into higher-order complexes. The
    Shashi-XLID frameshift removes the motif, so the higher-order RBMX/SRSF1
    complex fails to form and SRSF1 recruitment to its target pre-mRNAs is
    reduced.
  biological_processes:
  - preferred_term: protein-containing complex assembly
    term:
      id: GO:0065003
      label: protein-containing complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:34260915
    reference_title: >-
      Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
      p53 activation and neuronal differentiation defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we identify that the RBMX RGG/RG motif is methylated by
      protein arginine methyltransferase 5 (PRMT5), and this regulates
      assembly with the SRSF1 splicing factor into higher-order complexes.
    explanation: >-
      Establishes PRMT5-dependent methylation of the RGG/RG motif as the
      licensing step for higher-order RBMX/SRSF1 complex assembly, which the
      Shashi-XLID deletion removes.
  downstream:
  - target: MDM4 Exon 6 Mis-Splicing and Reduced MDM4 Protein
    description: >-
      Disruption of the RBMX/SRSF1 complex reduces SRSF1 binding to the MDM4
      pre-mRNA, which is what produces exon 6 exclusion and lower MDM4 protein.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34260915
      reference_title: >-
        Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
        p53 activation and neuronal differentiation defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Depletion of RBMX or disruption of the RBMX/SRSF1 complex in
        PRMT5-depleted cells reduces SRSF1 binding to the MDM4 precursor
        (pre-)mRNA, leading to exon 6 exclusion and lower MDM4 protein levels.
      explanation: >-
        The "leading to" in the source sentence is this causal step: reduced
        SRSF1 binding is the cause, exon 6 exclusion and reduced MDM4 protein
        the consequence.
- name: MDM4 Exon 6 Mis-Splicing and Reduced MDM4 Protein
  biological_scale: MOLECULAR
  description: >-
    Reduced SRSF1 occupancy on the MDM4 pre-mRNA causes skipping of exon 6,
    yielding an unstable transcript isoform and lower MDM4 protein levels.
    Isogenic Shashi-XLID iPSCs carrying the patient RGG/RG deletion reproduce
    this MDM4 splicing dysregulation.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34260915
    reference_title: >-
      Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
      p53 activation and neuronal differentiation defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of RBMX or disruption of the RBMX/SRSF1 complex in
      PRMT5-depleted cells reduces SRSF1 binding to the MDM4 precursor
      (pre-)mRNA, leading to exon 6 exclusion and lower MDM4 protein levels.
    explanation: >-
      States the exon 6 exclusion and the reduction in MDM4 protein that define
      this node.
  - reference: PMID:34260915
    reference_title: >-
      Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
      p53 activation and neuronal differentiation defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomic analysis of isogenic Shashi-XLID human-induced pluripotent
      stem cells (hiPSCs) generated using CRISPR-Cas9 reveals a dysregulation
      of MDM4 splicing and aberrant p53 upregulation.
    explanation: >-
      Confirms the mis-splicing step in a patient-genotype human cellular model
      of Shashi-XLID rather than only in knockdown cells.
  downstream:
  - target: Aberrant p53 Pathway Activation
    description: >-
      Reduced MDM4 protein removes a key negative regulator of p53, releasing
      p53 activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34260915
      reference_title: >-
        Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
        p53 activation and neuronal differentiation defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that RBMX-depleted cells exhibit aberrant activation of the p53

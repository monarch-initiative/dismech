name: Shashi X-Linked Intellectual Disability Syndrome
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
description: >-
  Shashi X-linked intellectual disability syndrome (MRXS11, SMRXS) is an
  ultra-rare X-linked recessive syndromic intellectual disability originally
  delineated in a large North Carolina family and subsequently confirmed in a
  second Brazilian family. Affected males have moderate intellectual
  disability together with a distinctive craniofacial gestalt (coarse facies,
  puffy eyelids, narrow palpebral fissures, prominent supraorbital ridges,
  bulbous nose, prominent lower lip, large ears), obesity and macroorchidism.
  The locus was mapped to Xq26-q27 and the causal gene identified as RBMX,
  which encodes heterogeneous nuclear ribonucleoprotein G (hnRNP G), an
  RNA-binding regulator of pre-mRNA splicing. The disease-associated allele in
  the original family is a 23 bp frameshift deletion removing the hnRNP G
  RGG/RG motif; loss of this motif disrupts PRMT5-dependent assembly with the
  SRSF1 splicing factor, causes MDM4 mis-splicing and aberrant p53 activation,
  and impairs neural progenitor differentiation.

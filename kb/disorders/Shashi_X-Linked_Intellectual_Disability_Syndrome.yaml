      explanation: >-
        Connects loss of RBMX function to p53 pathway activation.
- name: Aberrant p53 Pathway Activation
  biological_scale: CELLULAR
  description: >-
    Reduced MDM4 levels resulting from mis-splicing lead to aberrant

genetic:
- name: RBMX
  gene_term:
    preferred_term: RBMX
    term:
      id: hgnc:9910
      label: RBMX
  association: >-
    Causal X-linked gene; a 23 bp frameshift deletion removing the hnRNP G
    RGG/RG motif segregates with disease in the index family.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:25256757
    reference_title: >-
      The RBMX gene as a candidate for the Shashi X-linked intellectual
      disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On whole exome sequencing in the large family originally reported with
      this disorder, we identified a 23 bp frameshift deletion in the RNA
      binding motif protein X-linked (RBMX) gene at Xq26 in the affected males
      (n = 7), one carrier female, absent in unaffected males (n = 2) and in
      control databases (7800 exomes).
    explanation: >-
      Segregation in seven affected males with absence in unaffected males and
      in 7800 control exomes supports RBMX as the causal gene.
  - reference: PMID:25256757
    reference_title: >-
      The RBMX gene as a candidate for the Shashi X-linked intellectual
      disability syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RBMX gene has not been previously causal of human disease.
    explanation: >-
      At the time of discovery this was a novel gene-disease relationship,
      which is why the original report framed RBMX as a candidate; subsequent
      functional and cohort work has strengthened the assertion.
  - reference: PMID:34260915
    reference_title: >-
      Deletion of RBMX RGG/RG motif in Shashi-XLID syndrome leads to aberrant
      p53 activation and neuronal differentiation defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings identify RBMX as a regulator of SRSF1 and the p53 pathway,
      suggesting that the loss of function of the RBMX RGG/RG motif is the
      cause of Shashi-XLID syndrome.
    explanation: >-
      Functional modelling of the patient allele in isogenic iPSCs supports
      causality of the RGG/RG loss-of-function lesion.

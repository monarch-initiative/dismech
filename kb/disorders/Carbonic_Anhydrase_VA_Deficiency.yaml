- name: Impaired bicarbonate supply to mitochondrial carboxylases
  conforms_to: "metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit"
  description: >
    Bicarbonate depletion simultaneously impairs four mitochondrial
    carboxylation reactions: carbamoyl phosphate synthetase 1 (the entry step of
    the urea cycle), pyruvate carboxylase (anaplerosis and gluconeogenesis),
    propionyl-CoA carboxylase, and 3-methylcrotonyl-CoA carboxylase (branched-chain
    amino acid catabolism). Reduced ureagenesis allows ammonia to accumulate,
    reduced gluconeogenesis and anaplerosis promote hypoglycemia and lactate
    accumulation, and impaired carboxylases lead to excretion of their substrates
    — the biochemical signature of the disorder unmasked by catabolic stress.

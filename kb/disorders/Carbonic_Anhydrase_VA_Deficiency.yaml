phenotypes:
- name: Hyperammonemia
  description: >-
    Prominent during many acute crises, but not obligatory in all biallelic CA5A carriers. Ammonia can
    be normal between episodes and in asymptomatic adults.
  phenotype_term:
    preferred_term: Hyperammonemia
    term:
      id: HP:0001987
      label: Hyperammonemia
  evidence:
  - reference: PMID:26913920
    reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CAVA deficiency is a differential diagnosis of early-onset and life-threatening metabolic crisis, with hyperammonemia, hyperlactatemia, and ketonuria as apparently obligate signs.
    explanation: >-
      The early hyperammonemia-selected cohort described this feature as apparently obligatory; subsequent
      studies broadened the spectrum.
  - reference: PMID:38974611
    reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: the two asymptomatic patients had normal ammonia
    explanation: >-
      Normal ammonia in these two homozygous adults counters the claim that hyperammonemia is obligatory
      in every affected individual.

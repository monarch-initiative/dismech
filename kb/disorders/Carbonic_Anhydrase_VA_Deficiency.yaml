name: Carbonic Anhydrase VA Deficiency
creation_date: '2026-07-07T00:00:00Z'
category: Mendelian
synonyms:
- CA-VA deficiency
- CA5A deficiency
- Mitochondrial carbonic anhydrase VA deficiency
- Hyperammonemic encephalopathy due to carbonic anhydrase VA deficiency
- CA5AD
description: >-
  Carbonic anhydrase VA (CA-VA) deficiency is an autosomal recessive metabolic disorder caused by biallelic
  pathogenic CA5A variants. Reduced mitochondrial bicarbonate production limits carbamoyl phosphate synthetase
  1 and three biotin-dependent carboxylases, impairing ureagenesis, pyruvate metabolism and organic-acid
  metabolism. Presentation often involves neonatal or childhood hyperammonemic encephalopathy with variable
  hyperlactatemia, ketosis, acid-base disturbance and hypoglycemia. These findings are not obligatory:
  asymptomatic adults and children with developmental difficulties without recognized crises have been
  reported. Clinical outcomes range from normal development to persistent impairment and rare fatal decompensation.
  Acute anticatabolic and ammonia-lowering treatment and individualized sick-day management are used;
  recurrence can extend into later childhood.
classifications:
  icimd_category:
  - classification_value: urea_cycle_and_hyperammonemias
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Urea cycle &
      hyperammonemias" under category "Disorders of amino acid metabolism".
      CA-VA deficiency is an inherited hyperammonemia acting upstream of the
      urea cycle through impaired bicarbonate supply to carbamoyl phosphate
      synthetase 1. MONDO:0014332 is classified is_a "urea cycle disorder or
      inherited hyperammonemia".

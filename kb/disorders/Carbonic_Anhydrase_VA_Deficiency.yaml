- name: CA5A variants
  gene_term:
    preferred_term: CA5A
    term:
      id: hgnc:1377
      label: CA5A
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:26913920
      reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In 10 of 96 patients, mutations in CA5A were identified on both alleles but none in CA5B.
      explanation: Biallelic CA5A variants in affected patients support autosomal recessive inheritance.
    - reference: PMID:38974611
      reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 2/18 (11.1%) patients were asymptomatic adults with normal intellect who were identified during familial segregation studies
      explanation: >-
        Directly demonstrates incomplete clinical penetrance in this founder cohort.
    description: >-
      Autosomal recessive inheritance with variable clinical penetrance. Asymptomatic homozygous adults
      and affected relatives with different courses are documented.
  features: >-
    Pathogenic alleles include missense, nonsense, splice-altering synonymous variants and exon deletions,
    in homozygous or compound-heterozygous states. The synonymous c.555G>A change causes exon 4 skipping;
    exon 6 deletion can abolish detectable hepatic protein. The c.59G>A p.Trp20Ter allele occurs in an
    Arabian Peninsula founder cohort with marked intrafamilial variability. Missense effects differ between
    assay systems and do not establish a clinical severity ranking.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified and validated three different CA5A alterations, including a homozygous missense mutation (c.697T>C) in two siblings, a homozygous splice site mutation (c.555G>A) leading to skipping of exon 4, and a homozygous 4 kb deletion of exon 6.
    explanation: Documents the allelic spectrum of pathogenic CA5A variants.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The deleterious nature of the homozygous mutation c.697T>C (p.Ser233Pro) was demonstrated by reduced enzymatic activity and increased temperature sensitivity.
    explanation: Functional assays confirm pathogenicity of a recurrent CA5A missense variant.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sanger sequencing of the ∼550 bp band revealed an in-frame deletion of exon 4 from the index RNA
    explanation: >-
      Patient white-blood-cell RNA confirms abnormal splicing from the synonymous terminal-exon variant.
  - reference: PMID:38974611
    reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This retrospective cohort study reports 18 patients with CA-VA deficiency caused by homozygosity for a founder mutation, c.59G>A p.(Trp20*) in CA5A.
    explanation: >-
      Defines the founder allele and cohort.
  - reference: PMID:41736722
    reference_title: A novel homozygous CA5A gene deletion in carbonic anhydrase VA deficiency presenting as developmental delay without metabolic crisis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A pathogenic homozygous loss of 16.5 kb (exons 3-7) in CA5A gene
    explanation: >-
      Documents the larger deletion; transcript effects were not experimentally demonstrated.
  - reference: PMID:41113665
    reference_title: Carbonic anhydrase VA deficiency due to a novel CA5A variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Rapid trio genome sequencing revealed a biparentally inherited, homozygous variant of uncertain significance (VUS) in CA5A NM_001739.1:c.475T>C p.(Trp159Arg).
    explanation: >-
      Preserves the authors’ VUS classification despite supportive clinical and computational observations.
  - reference: PMID:41737902
    reference_title: Antenatal and Neonatal Management of Siblings With Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The maternally‐inherited variant has not been reported in the medical literature to date.
    explanation: >-
      The maternal allele in the antenatal report remained a VUS, as recorded in its Table 3.
  notes: >-
    The 2025 p.Trp159Arg report retained a variant-of-uncertain-significance classification despite a
    clinically compatible presentation. The 2026 antenatal series carried a pathogenic paternal frameshift
    and maternal p.Ala142Thr VUS. Neither should be recast as two experimentally proven pathogenic alleles.
    The 2026 exon 3–7 deletion series reported additional SYT2 and SYNE4 variants in two siblings and
    acknowledged that causal attribution of developmental delay requires further cases and functional
    studies.
treatments:
- name: Carglumic acid
  description: >-
    Carglumic acid is an N-acetylglutamate analogue that activates CPS1. It has been used off-label for
    acute hyperammonemia in CA-VA deficiency, with rapid biochemical responses in uncontrolled clinical
    reports. Activation of residual CPS1 flux despite bicarbonate limitation is proposed; benefit cannot
    always be separated from concurrent caloric support and other ammonia-lowering measures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carglumic acid
      term:
        id: CHEBI:71028
        label: carglumic acid
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the three children who were administered carglumic acid, hyperammonemia resolved.
    explanation: Direct clinical evidence that carglumic acid resolves hyperammonemia in CA-VA deficiency.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This hypothesis should be tested in the Car5A-null mouse model ... especially given the high cost of this medication and uncontrolled circumstances in which these children were managed with multiple therapeutic modalities.
    explanation: >-
      The authors qualify the proposed CA-VA-specific rescue mechanism and the uncontrolled treatment
      evidence.
  - reference: PMID:38974611
    reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When carglumic acid was used alone in three patients to treat hyperammonemia based on knowledge of founder effect or family history, ammonia normalized in less than 24 h.
    explanation: >-
      Provides additional uncontrolled clinical response data.
  target_mechanisms:
  - target: Impaired CPS1-dependent ureagenesis
    treatment_effect: RESTORES
    description: >-
      Enhances CPS1 activity; compensation for reduced bicarbonate availability is proposed.
    evidence:
    - reference: PMID:24530203
      reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: consistent with the suggestion that enhanced CPS1 activity can partially compensate for reduced HCO3− resulting from CA-VA deficiency.
      explanation: >-
        Mechanistic interpretation of observed clinical responses, not direct flux measurement.
  action_category: THERAPEUTIC
- name: Acute anticatabolic support
  action_category: THERAPEUTIC
  description: >-
    Hospital care uses glucose-containing fluids and additional caloric support, temporary protein adjustment
    when hyperammonemia is present, and close biochemical monitoring. This reverses catabolism while ammonia-lowering
    treatment is instituted. Management is individualized by metabolic specialists.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Always provide IV fluids (with glucose at maintenance doses) and extra calories via IV lipids; restrict protein intake if plasma ammonia is elevated.
    explanation: >-
      GeneReviews expert management recommendations; not evidence from a controlled CA-VA trial.

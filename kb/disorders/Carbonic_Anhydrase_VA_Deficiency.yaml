    reference_title: Antenatal and Neonatal Management of Siblings With Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Carglumic acid was used for each sibling infant and outcomes may have been due to its use, regular feeding and monitoring, or all of these factors.
    explanation: >-
      The authors explicitly acknowledge confounding between preventive interventions.
- name: Avoidance of carbonic anhydrase inhibitors
  action_category: THERAPEUTIC
  description: >-
    GeneReviews recommends avoiding acetazolamide and topiramate because further carbonic anhydrase inhibition
    may aggravate the metabolic defect. This is disease-specific expert advice rather than a quantified
    drug-risk estimate.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Acetazolamide should be avoided, as it inhibits carbonic anhydrase activity.
    explanation: >-
      Expert avoidance recommendation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If anti-seizure medication is necessary, avoid topiramate based on its action as a carbonic anhydrase inhibitor.
    explanation: >-
      Expert avoidance recommendation despite isolated published use.
- name: Metabolic and developmental surveillance
  action_category: MONITORING
  description: >-
    Follow metabolic stability, growth and neurodevelopment, with reassessment during illness. Recurrence
    into later childhood supports retaining an emergency plan even after prolonged stability.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Follow up during infancy and early childhood with a metabolic disease specialist every three to six months for physical and neurologic examinations.
    explanation: >-
      GeneReviews expert surveillance recommendation.
  - reference: PMID:42371568
    reference_title: Long-Term Follow-Up of Patients With Mitochondrial Carbonic Anhydrase VA Deficiency. A Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ongoing surveillance is recommended given the risk of MDE recurrence into later childhood and potential neurodevelopmental sequelae.
    explanation: >-
      Long-term follow-up supports continued clinical surveillance.
- name: Genetic counseling and family testing
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    For two heterozygous parents, each pregnancy has a one-in-four chance of a child inheriting both CA5A
    variants. Carrier and reproductive testing are possible once familial variants are known. Clinical
    penetrance and severity cannot be predicted reliably from genotype, and asymptomatic relatives may
    be homozygous.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25834911
    reference_title: Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a 25% chance of inheriting two CA5A pathogenic variants and usually being affected
    explanation: >-
      Supports Mendelian recurrence risk while retaining incomplete clinical penetrance.
  - reference: PMID:25834911
    reference_title: Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results of prenatal testing cannot be used to predict with certainty whether or not an individual will be affected
    explanation: >-
      Separates genotype prediction from clinical prognosis.
notes: >-
  CA5A deficiency is a variable clinical spectrum rather than a set of established molecular subtypes.
  A 2026 report of developmental delay without recognized metabolic crises is limited by small numbers
  and additional potentially relevant variants in two siblings; developmental findings should not automatically
  be attributed to CA5A alone. Genotype does not reliably predict crisis recurrence or neurological outcome.
progression:
- phase: Clinical course
  evidence:
  - reference: PMID:42371568
    reference_title: Long-Term Follow-Up of Patients With Mitochondrial Carbonic Anhydrase VA Deficiency. A Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Case 1 experienced three additional MDEs at ages 2 years 6 months, 3 years 6 months, and 8 years, all triggered by febrile illnesses.
    explanation: >-
      Extends the documented recurrence window into later childhood.
  - reference: PMID:42371568
    reference_title: Long-Term Follow-Up of Patients With Mitochondrial Carbonic Anhydrase VA Deficiency. A Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Currently, both cases show normal growth, development, and neurological outcomes
    explanation: >-
      Longitudinal follow-up of the original siblings supports favorable outcomes in these individuals,
      not a universal prognosis.
  - reference: url:https://www.nature.com/articles/s41436-019-0677-9
    reference_title: Fatal metabolic decompensation in carbonic anhydrase VA deficiency despite early treatment and control of hyperammonemia | Genetics in Medicine
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: this case demonstrates that the disease course can be fulminant and fatal despite rapid initiation of adequate treatment and despite quick normalization of ammonia and lactate levels during metabolic crisis.
    explanation: >-
      Rare fatal disease counters an unconditional benign prognosis.
  notes: >-
    Initial crises often occur in the neonatal period, but onset and recurrence can occur later in childhood.
    Normal development is possible even after recurrent episodes, while severe neurological impairment
    and rare fatal outcomes are also reported. In follow-up of the original siblings, one had her last
    crisis at eight years and the other remained stable; both had favorable adolescent outcomes.
diagnosis:
- name: Biochemical investigation during decompensation
  description: >-
    Assess ammonia, lactate, glucose, blood gases, plasma amino acids and urine organic acids. Elevated
    glutamine and alanine with low-to-normal citrulline and mild carboxylase-substrate elevations can
    suggest CA-VA deficiency. Results vary and may normalize between episodes.
  evidence:
  - reference: PMID:25834911
    reference_title: Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: elevated plasma glutamine and alanine and low-to-normal citrulline
    explanation: >-
      Identifies an informative amino-acid pattern.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, these abnormalities may be present only during symptomatic episodes.
    explanation: >-
      Normal interval testing cannot exclude the disorder.
- name: CA5A sequence and deletion analysis
  diagnosis_term:
    preferred_term: Molecular Diagnosis
    term:
      id: NCIT:C20826
      label: Molecular Diagnosis
  description: >-
    Identify biallelic pathogenic or likely pathogenic CA5A variants, using sequence and exon-level copy-number
    analysis as appropriate. Whole-exome or genome sequencing can detect atypical presentations. The homologous
    CA5AP1 pseudogene complicates assay design. VUS findings require interpretation and do not independently
    establish the diagnosis.
  evidence:
  - reference: PMID:25834911
    reference_title: Carbonic Anhydrase VA Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: biallelic pathogenic variants in CA5A identified by molecular genetic testing.
    explanation: >-
      Supports molecular confirmation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If only one or no variant is detected by the sequencing method used, the next step is to perform gene-targeted ... deletion/duplication analysis ... to detect exon and whole-gene deletions or duplications.
    explanation: >-
      GeneReviews recommends copy-number analysis after incomplete sequence results; ellipses skip glossary
      markup.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the CA5A variant was confirmed by targeted Sanger sequencing via carefully designed primers to avoid amplification of the pseudogene sequences
    explanation: >-
      Demonstrates the need for pseudogene-aware confirmation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of ... biallelic ... CA5A ... variants of ... uncertain significance ... (or identification of one known ... CA5A ... pathogenic variant ... and one ... CA5A ... variant of uncertain significance) does not establish or rule out a diagnosis of this disorder.
    explanation: >-
      VUS findings are not diagnostic; ellipses skip glossary markup.
- name: Newborn screening limitations
  description: >-
    A normal standard tandem-mass-spectrometry newborn screen does not exclude CA-VA deficiency. The characteristic
    C3 and C5OH elevations may be absent even during crises; genomic screening is being evaluated separately.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Newborn screening profiles (Tandem MS/MS), specifically C3 and C5OH levels, were unremarkable in all four cases
    explanation: >-
      Direct evidence of normal screening in affected children.
- name: Neurological assessment
  description: >-
    Developmental assessment and brain MRI help characterize injury; EEG is relevant when seizures are
    suspected. MRI may be normal or show cortical, deep-gray or white-matter injury. No imaging pattern
    independently establishes CA-VA deficiency.
  evidence:
  - reference: PMID:38974611
    reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MRI brain in patient 2 at the age of 9 days showed abnormal T2 signal intensity and diffusion restriction in the perirolandic cortex, insula, and basal ganglia in keeping with hyperammonemic encephalopathy
    explanation: >-
      Documents an observed acute imaging pattern.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: in the female sibling, both MRI and EEG were unremarkable.
    explanation: >-
      Normal neurodiagnostic tests also occur.
clinical_trials:
- name: NCT03655223
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Early Check is a prospective observational newborn-screening study whose registered condition list
    includes carbonic anhydrase VA deficiency. It evaluates expanded screening and its impact on families;
    it is not a CA5A-targeted treatment trial. The registry was last updated July 1, 2026.
  evidence:

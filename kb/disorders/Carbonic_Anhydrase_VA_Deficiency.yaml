    explanation: Supports early identification and hyperammonemia treatment to prevent neurologic injury.
notes: >
  First WP-001 (IEMbase metabolic) new-entry increment for issue #5556. CA-VA
  deficiency is one of the true new-entry gaps identified in the WP-001 coverage
  triage (row 1.1.09.01, CA5A/OMIM:615751/ORPHA:401948). Dietary protein
  management and long-term follow-up are established for the broader
  hyperammonemia/organic-aciduria class but were not added here because the two
  primary CA-VA references do not provide quotable disease-specific snippets for
  them; they can be added in a follow-up pass. This entry conforms to the
  metabolic_intoxication_decompensation module across its enzymatic-block,
  toxic-accumulation, decompensation, and encephalopathy nodes.

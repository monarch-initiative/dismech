    snippet: Early Check provides voluntary screening of newborns for a selected panel of conditions.
    explanation: >-
      Registry summary establishes the screening purpose; the official API condition list explicitly includes
      this disease.
animal_models:
- name: Car5a-null and Car5a/Car5b double-knockout mice
  species: Mouse
  genotype: Car5a knockout; Car5a/Car5b double knockout
  description: >-
    Car5a-null mice show hyperammonemia and impaired growth, with normal fasting glucose. Double knockout
    worsens hyperammonemia, growth and survival and reduces fasting glucose. Sodium-potassium citrate
    improved breeding and neonatal survival but did not improve growth or post-weaning mortality; efficacy
    in humans is unestablished.
  publication: PMID:23589845
  modeled_mechanisms:
  - target: Impaired CPS1-dependent ureagenesis
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Models defective ammonia disposal and the contribution of CA-VB.
    limitations: >-
      Whole-animal gene deletion does not establish age-dependent compensation or clinical prognosis in
      humans.
    evidence:
    - reference: PMID:23589845
      reference_title: Targeted mutagenesis of mitochondrial carbonic anhydrases VA and VB implicates both enzymes in ammonia detoxification and glucose metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The enhanced hyperammonemia and lower fasting blood sugar, which are both seen in the DKO mice, indicate that both Car5A and Car5B contribute to both ammonia detoxification (ureagenesis) and regulation of fasting blood sugar (gluconeogenesis).
      explanation: >-
        Genetic perturbation connects mitochondrial carbonic anhydrases with whole-animal metabolism.
  evidence:
  - reference: PMID:23589845
    reference_title: Targeted mutagenesis of mitochondrial carbonic anhydrases VA and VB implicates both enzymes in ammonia detoxification and glucose metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Their blood ammonia concentrations were markedly elevated, but their fasting blood sugars were normal.
    explanation: >-
      Car5a single knockout does not reproduce every human biochemical feature.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3645511/
    reference_title: Targeted mutagenesis of mitochondrial carbonic anhydrases VA and VB implicates both enzymes in ammonia detoxification and glucose metabolism - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: citrate salt supplementation improved breeding and reduced the neonatal mortality of the ... null and DKO mice, but we did not observe that it improved growth or reduced mortality after weaning.
    explanation: >-
      Full-text results distinguish neonatal benefit from absent growth or post-weaning benefit.
experimental_models:
- name: COS-7 expression of CA5A p.Ser233Pro
  experimental_model_type: CELL_LINE
  cell_source: Transfected COS-7 cells
  description: >-
    Heterologous expression demonstrates lower mutant CA-VA abundance and temperature-sensitive enzyme
    activity. These assays do not reproduce the integrated human liver metabolic phenotype.
  publication: PMID:24530203
  modeled_mechanisms:
  - target: Mitochondrial carbonic anhydrase VA deficiency
    relationship: RECAPITULATES
    description: >-
      Measures the variant-associated loss of enzyme function.
    evidence:
    - reference: PMID:24530203
      reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A marked reduction was observed in the steady-state levels of CA-VA p.Ser233Pro compared with wild-type protein despite similar transfection efficiencies
      explanation: >-
        COS-7 expression shows reduced mutant protein abundance.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: After a 30 min preincubation, the mutant enzyme had lost 80% of its activity at 30°C and almost all its activity at 40°C.
    explanation: >-
      Direct thermal-inactivation measurements in the COS-7 expression system.
- name: Sf9 expression of recombinant human CA-VA variants
  experimental_model_type: CELL_LINE
  cell_source: Baculovirus-transduced Sf9 insect cells
  description: >-
    Purified recombinant proteins permit comparison of catalytic activity and thermal stability. Missense
    and exon-deletion alleles show different activity and stability defects; cellular proteostasis and
    clinical severity are not fully captured.
  publication: PMID:26913920
  modeled_mechanisms:
  - target: Mitochondrial carbonic anhydrase VA deficiency
    relationship: RECAPITULATES
    description: >-
      Measures activity and stability of disease-associated enzyme forms.
    evidence:
    - reference: PMID:26913920
      reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Exhibiting decreased enzyme activity or thermal stability, all CAVA mutations were proven to cause disease, whereas the three variants showed no relevant effect.
      explanation: >-
        Recombinant enzyme studies distinguish loss of activity and stability from benign control variants.
  evidence:
  - reference: PMID:26913920
    reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: developed an expression system using insect cells, which enabled the characterization of wild-type CAVA, clinical mutations, and three variants that affect functional residues.
    explanation: >-
      Establishes the heterologous protein assay system.

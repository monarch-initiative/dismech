    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Carbonic anhydrase VA (CA-VA) was absent in liver in the child with the homozygous exon 6 deletion.
    explanation: Directly demonstrates loss of hepatic CA-VA protein as the molecular consequence of a CA5A null allele.
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A marked reduction was observed in the steady-state levels of CA-VA p.Ser233Pro compared with wild-type protein despite similar transfection efficiencies
    explanation: >-
      COS-7 expression shows reduced mutant protein abundance.
  - reference: PMID:26913920
    reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Exhibiting decreased enzyme activity or thermal stability, all CAVA mutations were proven to cause disease, whereas the three variants showed no relevant effect.
    explanation: >-
      Recombinant enzyme studies distinguish loss of activity and stability from benign control variants.
  downstream:
  - target: Reduced mitochondrial bicarbonate availability
    description: >-
      Reduced CA-VA activity limits locally generated mitochondrial bicarbonate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24530203
      reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Mitochondria are impermeable to HCO3−, and thus the two intramitochondrial carbonic anhydrases (CA-VA and CA-VB) are pivotal in providing HCO3− for multiple mitochondrial enzymes that catalyze the formation of essential metabolites of intermediary metabolism in the urea and Krebs cycles
      explanation: >-
        Explains why reduced mitochondrial bicarbonate production affects the downstream enzymes; this
        is biochemical background rather than a direct patient bicarbonate measurement.
      quote_role: BACKGROUND

- name: Hyperammonemic encephalopathy
  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Encephalopathy"
  description: >
    Circulating ammonia crosses the blood-brain barrier and is detoxified in
    astrocytes to glutamine, the brain's principal intracellular osmole; its
    accumulation drives astrocyte swelling and cytotoxic cerebral edema. The
    result is acute encephalopathy presenting as lethargy and depressed
    consciousness. Because the underlying lesion is treatable, prompt
    ammonia-lowering therapy can prevent neurologic sequelae.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

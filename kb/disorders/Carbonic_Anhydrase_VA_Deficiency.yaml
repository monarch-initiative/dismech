      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Defective hepatic bicarbonate production leads to a unique combination of biochemical findings: hyperammonemia, elevated lactate and ketone bodies, metabolic acidosis, hypoglycemia, and excretion of carboxylase substrates."
      explanation: Directly links impaired bicarbonate production to the combined biochemical decompensation.
- name: Acute hyperammonemic metabolic crisis
  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Decompensation"
  description: >
    The biochemical crisis of CA-VA deficiency is a distinctive combination of
    hyperammonemia (impaired CPS1-dependent ureagenesis), hyperlactatemia and
    ketosis (impaired pyruvate carboxylase anaplerosis), metabolic acidosis, and
    hypoglycemia (impaired gluconeogenesis). Hyperammonemia, hyperlactatemia, and
    ketonuria are described as apparently obligate signs.

  - reference: PMID:26913920
    reference_title: "Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early identification may allow specific treatment of hyperammonemia and ultimately prevent neurologic sequelae."
    explanation: Frames the encephalopathy as ammonia-driven and preventable with early treatment.

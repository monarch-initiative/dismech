prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Population prevalence is unknown. Identification of biallelic CA5A variants in 10 of 96 selected patients
    investigated for unexplained early-onset hyperammonemia is a diagnostic yield in a referred cohort,
    not a population prevalence estimate.
  evidence:
  - reference: PMID:26913920
    reference_title: Defective hepatic bicarbonate production due to carbonic anhydrase VA deficiency leads to early-onset life-threatening metabolic crisis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 10 of 96 patients, mutations in CA5A were identified on both alleles but none in CA5B.
    explanation: >-
      The denominator comprises selected hyperammonemia referrals; this finding supports under-recognition
      but cannot estimate population prevalence.
pathophysiology:
- name: Mitochondrial carbonic anhydrase VA deficiency
  conforms_to: metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism
  description: >-
    Biallelic pathogenic CA5A variants cause absent or reduced mitochondrial carbonic anhydrase VA activity.
    Mechanisms include reduced protein abundance, catalytic impairment and variant-dependent thermal instability.
    Patient liver and heterologous expression studies provide complementary evidence; residual activity
    is not a reliable predictor of clinical severity.

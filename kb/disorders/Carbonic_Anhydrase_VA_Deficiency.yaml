- name: Sick-day nutrition and fasting avoidance
  action_category: THERAPEUTIC
  description: >-
    An individualized emergency plan supplies additional carbohydrate and fat calories during illness,
    avoids fasting, and specifies temporary protein adjustment and criteria for hospital care. Long-term
    dietary or drug treatment during wellness is individualized; universal lifelong protein restriction
    is not established.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:42371568
    reference_title: Long-Term Follow-Up of Patients With Mitochondrial Carbonic Anhydrase VA Deficiency. A Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients should be provided with a personalized sick‐day protocol during periods of febrile illness and catabolic states, consisting of high‐calorie intake from fats and carbohydrates, temporary protein restriction, strict avoidance of fasting, and clear criteria for hospital admission
    explanation: >-
      Current expert synthesis supports individualized prevention.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK284774/
    reference_title: Carbonic Anhydrase VA Deficiency - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There is no evidence to date that use of a special diet and/or cofactor (zinc) treatment during periods of wellness prevents metabolic decompensations.
    explanation: >-
      Avoids presenting prophylactic dietary restriction or zinc as established treatment.
- name: Planned neonatal care after familial diagnosis
  action_category: THERAPEUTIC
  description: >-
    Antenatal or familial diagnosis allows planned delivery with metabolic support, regular feeding and
    biochemical observation. Two prenatally identified siblings remained stable after short-course prophylactic
    carglumic acid plus feeding support. The uncontrolled report does not establish which intervention
    prevented decompensation; one familial allele remained a VUS.

discussions:
- discussion_id: cavb_modifier
  prompt: Does CA-VB compensation explain variable penetrance and age-dependent recurrence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced mitochondrial bicarbonate availability
  rationale: >-
    Mouse double-knockout data support overlapping metabolic function. Developmental changes in human
    CA-VB activity and a role in interindividual prognosis remain unproven.
  evidence:
  - reference: PMID:23589845
    reference_title: Targeted mutagenesis of mitochondrial carbonic anhydrases VA and VB implicates both enzymes in ammonia detoxification and glucose metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The contribution of Car5B to ureagenesis and gluconeogenesis was evident only on a Car5A null background.
    explanation: >-
      Animal experiments support partial functional compensation.
  - reference: PMID:38974611
    reference_title: A founder mutation in CA5A causing intrafamilial and interfamilial phenotypic variability in a cohort of 18 patients with carbonic anhydrase VA deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We argue that the role of CA‐VB as a potential genetic modifier in patients with CA‐VA deficiency deserves further study.
    explanation: >-
      Human modifier activity remains a hypothesis.
- discussion_id: developmental_attribution
  prompt: How much of the developmental phenotype is attributable to CA5A independently of metabolic crises and other variants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Global developmental delay
  rationale: >-
    The 2026 deletion series contains no recognized hyperammonemic crises. Two siblings also carried homozygous
    SYT2 variants, with differing SYNE4 genotypes. The authors regarded these as secondary findings but
    acknowledged that definitive attribution to CA5A requires larger studies and functional work. No causal
    edge from acute hyperammonemic encephalopathy to all developmental findings is asserted.
  evidence:
  - reference: PMID:41736722
    reference_title: A novel homozygous CA5A gene deletion in carbonic anhydrase VA deficiency presenting as developmental delay without metabolic crisis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, definitively attributing the developmental delay to CA5A deletion needs a larger number of cases and functional studies.
    explanation: >-
      The original report explicitly limits causal attribution.
  - reference: PMID:41736722
    reference_title: A novel homozygous CA5A gene deletion in carbonic anhydrase VA deficiency presenting as developmental delay without metabolic crisis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: index (#2) had SYT2 (homozygous) and SYNE4 (heterozygous); affected sister (#3) had SYT2 (homozygous) and SYNE4 (homozygous)
    explanation: >-
      Other potentially relevant genotypes complicate interpretation.
differential_diagnoses:
- name: Proximal urea cycle disorders
  description: >-
    CPS1 and NAGS deficiencies share hyperammonemia, high glutamine, low citrulline and little orotic
    acid excretion. Lactate and carboxylase-related urinary metabolites can favor CA-VA deficiency, although
    their absence does not exclude it.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CA-VA deficiency should therefore be added to urea cycle defects, organic acidurias, and pyruvate carboxylase deficiency as a treatable condition in the differential diagnosis of hyperammonemia in the neonate and young child.
    explanation: >-
      The primary study establishes the differential diagnosis.
- name: Multiple carboxylase deficiency
  description: >-
    Biotinidase and holocarboxylase synthetase deficiencies can produce overlapping urinary metabolites.
    Secondary CPS1 impairment and milder PCC/3MCC metabolites can help distinguish CA-VA deficiency.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the significantly higher level of PCC and 3MCC metabolites in (even well-controlled) individuals with the two former disorders compared to those with CA-VA deficiency during metabolic decompensation
    explanation: >-
      The primary study compares biotinidase and holocarboxylase synthetase defects with CA-VA deficiency.
- name: Pyruvate carboxylase deficiency
  description: >-
    Shares lactic acidosis, hypoglycemia and hyperammonemia; molecular and biochemical investigation distinguishes
    primary PC deficiency from secondary impairment in CA-VA deficiency.
  evidence:
  - reference: PMID:24530203
    reference_title: Mitochondrial carbonic anhydrase VA deficiency resulting from CA5A alterations presents with hyperammonemia in early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Primary PC deficiency is biochemically characterized by lactic acidosis, hyperammonemia, and hypoglycemia
    explanation: >-
      The overlapping biochemical profile requires differential testing.

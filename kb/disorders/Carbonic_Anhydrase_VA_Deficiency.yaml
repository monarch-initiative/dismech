name: Carbonic Anhydrase VA Deficiency
creation_date: '2026-07-07T00:00:00Z'
category: Mendelian
synonyms:
- CA-VA deficiency
- CA5A deficiency
- Mitochondrial carbonic anhydrase VA deficiency
- Hyperammonemic encephalopathy due to carbonic anhydrase VA deficiency
- CA5AD
description: >
  Carbonic anhydrase VA (CA-VA) deficiency is an autosomal recessive inborn
  error of metabolism caused by biallelic loss-of-function variants in CA5A,
  which encodes the mitochondrial carbonic anhydrase isoform VA. CA-VA supplies
  bicarbonate to four bicarbonate-dependent mitochondrial liver enzymes —
  carbamoyl phosphate synthetase 1 (urea cycle), pyruvate carboxylase
  (anaplerosis and gluconeogenesis), propionyl-CoA carboxylase, and
  3-methylcrotonyl-CoA carboxylase (branched-chain amino acid catabolism).
  Deficient bicarbonate provision impairs all four reactions simultaneously,
  producing an early-onset, life-threatening metabolic crisis with
  hyperammonemia, hyperlactatemia, ketonuria, metabolic acidosis, hypoglycemia,
  and urinary excretion of carboxylase substrates. Presentation is typically in
  the neonatal period or early childhood with lethargy and hyperammonemic
  encephalopathy. Unlike most causes of neonatal hyperammonemia, CA-VA
  deficiency is treatable, and prompt recognition with carglumic acid and
  ammonia-lowering measures can resolve hyperammonemia and prevent neurologic
  sequelae.
classifications:
  icimd_category:
  - classification_value: urea_cycle_and_hyperammonemias
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Urea cycle &
      hyperammonemias" under category "Disorders of amino acid metabolism".
      CA-VA deficiency is an inherited hyperammonemia acting upstream of the
      urea cycle through impaired bicarbonate supply to carbamoyl phosphate
      synthetase 1. MONDO:0014332 is classified is_a "urea cycle disorder or
      inherited hyperammonemia".

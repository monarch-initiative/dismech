    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the three children who were administered carglumic acid, hyperammonemia resolved."
    explanation: Direct clinical evidence that carglumic acid resolves hyperammonemia in CA-VA deficiency.
- name: Acute hyperammonemia management
  description: >
    Prompt recognition and treatment of the hyperammonemic crisis — including
    ammonia-lowering therapy and reversal of catabolism — is the basis for
    preventing neurologic sequelae in this treatable condition.
  treatment_term:
    preferred_term: supportive care
    term:

pathophysiology:
- name: Mitochondrial carbonic anhydrase VA deficiency
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  description: >
    Biallelic loss-of-function CA5A variants reduce or abolish mitochondrial
    carbonic anhydrase VA activity in hepatocytes. CA-VA catalyzes the reversible
    hydration of carbon dioxide to bicarbonate, and its loss depletes the
    intramitochondrial bicarbonate pool required by downstream carboxylases.

- name: Hyperammonemic encephalopathy
  description: >-
    Ammonia-related brain dysfunction can cause altered consciousness and seizures. Severe cerebral injury
    may progress despite normalization of blood ammonia, so biochemical improvement does not guarantee
    neurological recovery. Cellular explanations involving energy failure and edema are incompletely resolved
    in this disorder.

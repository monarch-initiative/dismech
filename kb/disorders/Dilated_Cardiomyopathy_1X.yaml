    limitations: >-
      Graded PARTIALLY_RECAPITULATES because the model reproduces the membrane
      lesion but explicitly dissociates it from the functional phenotype, so it
      does not establish the membrane-fragility route as sufficient in humans.
    evidence:
    - reference: PMID:31848331
      reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although cardiac Fktn elimination markedly reduced α-dystroglycan glycosylation and dystrophin-glycoprotein complex proteins in sarcolemma at all developmental stages, cardiac dysfunction was observed only in later adulthood, suggesting that membrane fragility is not the sole etiology of cardiac dysfunction."
      explanation: >-
        Both the recapitulation and its limit are stated in the same sentence.
discussions:
- discussion_id: cmd1x_cardiac_vs_skeletal_tissue_selectivity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the myocardium fail in CMD1X while skeletal muscle carrying the same
    alpha-dystroglycan glycosylation defect stays close to normal, and can any
    current model answer this?
  rationale: >-
    The tissue selectivity is the defining feature of the entity, and no existing
    model system addresses it. The available mechanistic data come from
    cardiac-specific complete Fktn knockouts, in which the cardiac restriction is
    engineered by the Cre driver rather than emerging from the biology. Those
    models establish the Akt and MEF2-histone deacetylase lesion and show that
    membrane fragility alone is insufficient, but because they are nulls confined
    to one tissue they cannot test the hypothesis that actually explains the
    human phenotype, namely that a partial, body-wide reduction in fukutin
    activity crosses a threshold in cardiomyocytes that it does not cross in
    skeletal myofibres. A hypomorphic, non-tissue-restricted allelic series is
    what the question needs.
  attaches_to:
  - pathophysiology#Relative Sparing of Skeletal Muscle and Brain
  - animal_models#Mouse

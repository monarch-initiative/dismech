    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FKTN mutations could cause much wider spectrum of clinical features than previously perceived, including familial dilated cardiomyopathy and mildest limb girdle muscular dystrophy."
    explanation: >-
      Establishes FKTN as the causal gene for a dilated-cardiomyopathy-predominant
      phenotype at the mild end of its allelic spectrum.

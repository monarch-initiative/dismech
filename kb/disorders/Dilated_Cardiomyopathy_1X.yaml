genetic:
- name: FKTN
  notes: >-
    FKTN, at 9q31.2, encodes fukutin, a 461-amino-acid Golgi ribitol-phosphate
    transferase. The allelic architecture is the explanation for why CMD1X exists
    as an entity distinct from Fukuyama congenital muscular dystrophy rather than
    being a mild case of it, and it is worth stating explicitly.

    The Japanese founder allele is a roughly 3 kb retrotransposal insertion of
    tandemly repeated sequence in the FKTN 3' untranslated region, carried by 87
    per cent of FCMD chromosomes, and it abolishes expression in patients who
    carry it. Two null alleles of this kind give Fukuyama congenital muscular
    dystrophy. CMD1X patients are compound heterozygotes who carry one severe
    allele in trans with a milder allele that retains partial enzyme function.
    Missense alleles reported in the cardiac-predominant phenotype include
    p.Ser299Arg and p.Asn442Ser. Deep-intronic alleles acting through aberrant
    splicing are also described in this gene.

    That one-severe-plus-one-hypomorphic model is what the entry's
    functional_impact_category of PARTIAL_LOSS_OF_FUNCTION asserts at the level of
    the enzyme, and it is the reason the phenotype stops at the myocardium instead
    of extending to brain and skeletal muscle.
  gene_term:
    preferred_term: FKTN
    term:
      id: hgnc:3622
      label: FKTN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FKTN mutations could cause much wider spectrum of clinical features than previously perceived, including familial dilated cardiomyopathy and mildest limb girdle muscular dystrophy."
    explanation: >-
      Establishes FKTN as the causal gene for a dilated-cardiomyopathy-predominant
      phenotype at the mild end of its allelic spectrum.
  - reference: PMID:9690476
    reference_title: An ancient retrotransposal insertion causes Fukuyama-type congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that there is a retrotransposal insertion of tandemly repeated sequences within this candidate-gene interval in all FCMD chromosomes carrying the founder haplotype (87%)."
    explanation: >-
      Documents the founder allele that supplies the severe half of the CMD1X
      compound-heterozygous genotype, and its frequency among FCMD chromosomes.
  - reference: PMID:9690476
    reference_title: An ancient retrotransposal insertion causes Fukuyama-type congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inserted sequence is about 3 kilobases long and is located in the 3' untranslated region of a gene encoding a new 461-amino-acid protein. This gene is expressed in various tissues in normal individuals, but not in FCMD patients who carry the insertion."
    explanation: >-
      Establishes both the physical nature of the founder allele and that it
      abolishes expression, which is what makes it the severe allele in the
      CMD1X genotype model.
  - reference: PMID:35743126
    reference_title: Compound Heterozygous FKTN Variants in a Patient with Dilated Cardiomyopathy Led to an Aberrant α-Dystroglycan Pattern.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we reported the case of a patient with muscular dystrophy, early onset dilated cardiomyopathy, and elevated creatine kinase levels who was a carrier of the compound heterozygous variants p.Ser299Arg and p.Asn442Ser in FKTN"
    explanation: >-
      Names two of the missense alleles reported in the cardiac-predominant
      phenotype and confirms the compound heterozygous configuration.
diagnosis:
- name: Echocardiography
  description: >-
    Echocardiography establishes the cardiomyopathy itself, showing left
    ventricular dilation with hypokinesis and reduced ejection fraction. It is
    what the patient is referred for, and on its own it says nothing about the
    cause.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Left ventricular dilation with reduced ejection fraction.
  evidence:
  - reference: PMID:26566449
    reference_title: A case of pregnancy complicated with dilated cardiomyopathy 1X.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In early pregnancy, the evaluation of her cardiac function showed ejection fraction 47% and NYHA class II."
    explanation: >-
      Reports the echocardiographic assessment of cardiac function in a
      genetically confirmed CMD1X patient.
- name: Serum creatine kinase measurement
  description: >-
    A raised creatine kinase in a patient who looks like idiopathic dilated
    cardiomyopathy is the trigger that should prompt a genetic workup, because it
    is present even without clinically detectable weakness. This is the step on
    which the whole diagnosis turns in practice: nothing else about the
    presentation points away from idiopathic disease.
  diagnosis_term:
    preferred_term: serum creatine kinase measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Elevated serum creatine kinase.
  evidence:
  - reference: PMID:35743126
    reference_title: Compound Heterozygous FKTN Variants in a Patient with Dilated Cardiomyopathy Led to an Aberrant α-Dystroglycan Pattern.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we reported the case of a patient with muscular dystrophy, early onset dilated cardiomyopathy, and elevated creatine kinase levels who was a carrier of the compound heterozygous variants p.Ser299Arg and p.Asn442Ser in FKTN"
    explanation: >-
      Records elevated creatine kinase as an observed feature in a genetically
      confirmed patient, which is the basis for using it as a workup trigger.
- name: Muscle biopsy with alpha-dystroglycan glycoepitope staining and laminin overlay
  description: >-
    Immunohistochemistry and immunoblot for the glycoepitope of
    alpha-dystroglycan, with a laminin overlay assay, is the confirmatory
    functional test. Its interpretation in CMD1X carries a trap worth stating:
    the routine histology of the same biopsy is close to normal, so a report of
    minimal dystrophic change does not exclude the diagnosis and the glycoepitope
    study has to be requested specifically.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: Reduced alpha-dystroglycan glycosylation with reduced laminin binding.
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal muscles from the patients showed minimal dystrophic features but have altered glycosylation of alpha-dystroglycan and reduced laminin binding ability."
    explanation: >-
      Establishes both the assay result and the near-normal routine histology that
      makes the specific glycoepitope study necessary.
- name: FKTN sequencing
  description: >-
    Targeted FKTN sequencing, or a dystroglycanopathy or cardiomyopathy gene
    panel, confirms the biallelic genotype. Two allele classes need specific
    attention because standard exome sequencing can miss them: the Japanese
    founder retrotransposal insertion in the 3' untranslated region, and
    deep-intronic variants acting through aberrant splicing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic FKTN variants, typically compound heterozygous.
  evidence:
  - reference: PMID:9690476
    reference_title: An ancient retrotransposal insertion causes Fukuyama-type congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inserted sequence is about 3 kilobases long and is located in the 3' untranslated region of a gene encoding a new 461-amino-acid protein."
    explanation: >-
      Describes the founder allele's position and size, which is why it needs a
      targeted assay rather than coding-sequence analysis.
biochemical:
- name: Glycosylated alpha-dystroglycan on muscle biopsy
  notes: >-
    Immunohistochemistry and immunoblot for the glycoepitope of
    alpha-dystroglycan show reduced or aberrant signal, with reduced laminin
    binding on overlay assay. This is the confirmatory functional assay, and in
    CMD1X it is abnormal in skeletal muscle whose histology is close to normal.
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal muscles from the patients showed minimal dystrophic features but have altered glycosylation of alpha-dystroglycan and reduced laminin binding ability."
    explanation: >-
      Reports the assay result that defines the biochemical lesion, in patient
      skeletal muscle.
treatments:
- name: Guideline-directed heart failure pharmacotherapy
  description: >-
    There is no FKTN-specific therapy. Management follows standard treatment for
    heart failure with reduced ejection fraction. This is recorded as the
    prevailing standard of care rather than as an intervention tested in CMD1X,
    for which no trial evidence exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin-converting enzyme inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-adrenergic blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Ventricular Remodeling and Myocardial Fibrosis
    description: >-
      Guideline-directed therapy acts on the neurohormonal drive of adverse
      remodelling. It is disease-modifying for the remodelling process, not for
      the glycosylation defect upstream of it.
- name: Cardiac transplantation
  description: >-
    Transplantation is the definitive treatment for end-stage disease and has
    been reached by reported patients in adolescence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Dilated Cardiomyopathy with Systolic Failure
    description: >-
      Transplantation replaces the failing organ; it does not address the
      underlying glycosylation defect, which remains present in skeletal muscle.
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient died by rapid progressive dilated cardiomyopathy at 12 years old, and the other patient received cardiac implantation at 18 years old."
    explanation: >-
      Documents cardiac transplantation as an outcome reached in the defining
      series.
environmental:
- name: Haemodynamic load of pregnancy
  description: >-
    Pregnancy is a documented precipitant of decompensation in established CMD1X.
    It is not causal, and the entry does not treat it as such: the reported course
    is a fall in cardiac function from the third trimester, requiring bed rest and
    elective early delivery, with the cardiac parameters returning to their
    pre-pregnancy baseline about a month postpartum. The skeletal muscle behaved
    differently in the same patient, with weakness that persisted afterwards, so
    the two compartments did not recover in step.
  review_notes: >-
    No ECTO exposure term is bound. ECTO covers chemical, dietary and
    environmental exposures; the physiological haemodynamic load of pregnancy is
    not an exposure in that sense, and binding a chemical-exposure term here would
    be worse than leaving it unbound.
  influences_mechanisms:
  - target: Dilated Cardiomyopathy with Systolic Failure
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      The volume and afterload changes of gestation are superimposed on a ventricle
      that already cannot mount a compensatory hypertrophic response, so function
      falls further.
    evidence:
    - reference: PMID:26566449
      reference_title: A case of pregnancy complicated with dilated cardiomyopathy 1X.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Worsening of cardiac function was observed from 30 weeks, manifesting reduced cardiac load with left ventricular dilatation and in-hospital bed rest was necessary."
      explanation: >-
        Documents deterioration of cardiac function under the haemodynamic load of
        late pregnancy in a genetically confirmed CMD1X patient.
  evidence:
  - reference: PMID:26566449
    reference_title: A case of pregnancy complicated with dilated cardiomyopathy 1X.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parameters of her cardiac function returned to the pre-pregnancy status in a month after delivery, whereas she realized persistent worsening of muscular weakness at postpartum."
    explanation: >-
      Establishes that the cardiac decompensation is reversible once the load is
      removed, while the skeletal muscle change was not, which is why this is
      recorded as an exacerbating exposure rather than a cause.
animal_models:
- name: Cardiac-specific fukutin knockout mouse
  species: Mouse
  genotype: Fktn flox/flox; MCK-Cre (constitutive) and Fktn flox/flox; alphaMHC-MerCreMer (inducible)
  publication: PMID:31848331
  description: >-
    Cardiomyocyte-restricted elimination of Fktn, both constitutively and
    inducibly in the adult heart. The model is the principal source of
    mechanistic information about how fukutin loss causes cardiac failure.
  modeled_mechanisms:
  - target: Impaired Compensatory Hypertrophic Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Establishes the Akt and MEF2-histone deacetylase signaling lesion, and the
      stress-dependence of the phenotype.
    limitations: >-
      The knockout is a complete null restricted to the heart, whereas human
      CMD1X arises from a hypomorphic biallelic genotype affecting every tissue.
      The model therefore cannot address why human skeletal muscle is spared, and
      the mouse phenotype is engineered to be cardiac-restricted rather than
      being so for the reasons the human disease is.
    evidence:
    - reference: PMID:31848331
      reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "During young adulthood, Fktn-deficient mice were vulnerable to pathological hypertrophic stress with downregulation of Akt and the MEF2-histone deacetylase axis."
      explanation: >-
        Supports treating this model as informative for the compensatory
        signaling node.
  - target: Weakened Sarcolemma-to-Basement-Membrane Linkage in Cardiomyocytes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the loss of sarcolemmal alpha-dystroglycan glycosylation and
      dystrophin-glycoprotein complex, while showing that this alone does not
      produce contractile failure.
    limitations: >-
      Graded PARTIALLY_RECAPITULATES because the model reproduces the membrane
      lesion but explicitly dissociates it from the functional phenotype, so it
      does not establish the membrane-fragility route as sufficient in humans.
    evidence:
    - reference: PMID:31848331
      reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although cardiac Fktn elimination markedly reduced α-dystroglycan glycosylation and dystrophin-glycoprotein complex proteins in sarcolemma at all developmental stages, cardiac dysfunction was observed only in later adulthood, suggesting that membrane fragility is not the sole etiology of cardiac dysfunction."
      explanation: >-
        Both the recapitulation and its limit are stated in the same sentence.
discussions:
- discussion_id: cmd1x_cardiac_vs_skeletal_tissue_selectivity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the myocardium fail in CMD1X while skeletal muscle carrying the same
    alpha-dystroglycan glycosylation defect stays close to normal, and can any
    current model answer this?
  rationale: >-
    The tissue selectivity is the defining feature of the entity, and no existing
    model system addresses it. The available mechanistic data come from
    cardiac-specific complete Fktn knockouts, in which the cardiac restriction is
    engineered by the Cre driver rather than emerging from the biology. Those
    models establish the Akt and MEF2-histone deacetylase lesion and show that
    membrane fragility alone is insufficient, but because they are nulls confined
    to one tissue they cannot test the hypothesis that actually explains the
    human phenotype, namely that a partial, body-wide reduction in fukutin
    activity crosses a threshold in cardiomyocytes that it does not cross in
    skeletal myofibres. A hypomorphic, non-tissue-restricted allelic series is
    what the question needs.
  attaches_to:
  - pathophysiology#Relative Sparing of Skeletal Muscle and Brain
  - animal_models#Mouse

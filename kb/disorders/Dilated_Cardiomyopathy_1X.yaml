inheritance:
- name: Autosomal recessive
  description: >-
    Reported patients carry two FKTN variants, typically as compound
    heterozygotes rather than homozygotes, consistent with autosomal recessive
    inheritance of a hypomorphic allele combination. Despite the "1X" in the
    disease name, the locus is autosomal.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified six patients in four families showing dilated cardiomyopathy with no or minimal limb girdle muscle involvement and normal intelligence, associated with a compound heterozygous FKTN mutation"
    explanation: >-
      The founding series reports biallelic compound heterozygous FKTN variants
      in six patients across four families, establishing recessive inheritance
      at an autosomal locus.
pathophysiology:
- name: Reduced Fukutin Ribitol-Phosphate Transferase Activity
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic FKTN variants reduce, without abolishing, the Golgi
    ribitol-phosphate transferase activity of fukutin. Fukutin and
    fukutin-related protein act sequentially to transfer ribitol phosphate from
    CDP-ribitol, which is synthesised by ISPD, onto the core M3 O-mannosyl glycan
    of alpha-dystroglycan. The residual activity in this allele combination is
    what separates CMD1X from the null genotypes that cause Fukuyama congenital
    muscular dystrophy.
  genetic_context:
    gene:
      preferred_term: FKTN
      term:
        id: hgnc:3622
        label: FKTN
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: protein O-linked mannosylation
    term:
      id: GO:0035269
      label: protein O-linked glycosylation via mannose
    modifier: DECREASED
  evidence:
  - reference: PMID:27194101
    reference_title: ISPD produces CDP-ribitol used by FKTN and FKRP to transfer ribitol phosphate onto alpha-dystroglycan.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we demonstrate that isoprenoid synthase domain-containing protein (ISPD) synthesizes CDP-ribitol, present in muscle, and that both recombinant fukutin (FKTN) and fukutin-related protein (FKRP) can transfer a ribitol phosphate group from CDP-ribitol to α-dystroglycan"
    explanation: >-
      Establishes the enzymatic activity of fukutin that this node describes as
      reduced, using recombinant protein and cell assays.
  downstream:
  - target: Alpha-Dystroglycan Hypoglycosylation and Loss of Laminin Binding
    description: >-
      Reduced ribitol-phosphate transfer leaves the M3 glycan incomplete, so the
      matriglycan chain that carries ligand-binding activity cannot be built out.
- name: Alpha-Dystroglycan Hypoglycosylation and Loss of Laminin Binding
  biological_scale: MOLECULAR
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Alpha-Dystroglycan Glycosylation and ECM Ligand Binding Failure"
  description: >-
    The incompletely glycosylated alpha-dystroglycan cannot bind laminin, agrin
    and perlecan in the basement membrane. In CMD1X this is demonstrable in both
    compartments: skeletal muscle biopsy shows altered glycosylation and reduced
    laminin binding despite near-normal histology, and the one cardiac biopsy in
    the founding series showed the same glycosylation defect seen in Fukuyama
    congenital muscular dystrophy.
  molecular_functions:
  - preferred_term: laminin binding
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal muscles from the patients showed minimal dystrophic features but have altered glycosylation of alpha-dystroglycan and reduced laminin binding ability."
    explanation: >-
      Direct demonstration in patient tissue that the glycosylation and
      laminin-binding defect is present even where histology is near-normal.
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One cardiac muscle that underwent biopsy showed altered glycosylation of alpha-dystroglycan similar to that observed in a Fukuyama-type congenital muscular dystrophy patient."
    explanation: >-
      Establishes that the same biochemical lesion is present in the myocardium,
      which is the tissue that actually fails in this disease.
  downstream:
  - target: Weakened Sarcolemma-to-Basement-Membrane Linkage in Cardiomyocytes
    description: >-
      Loss of ligand binding uncouples the dystrophin-glycoprotein complex from
      the extracellular matrix at the cardiomyocyte surface.
- name: Weakened Sarcolemma-to-Basement-Membrane Linkage in Cardiomyocytes
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The dystrophin-glycoprotein complex normally transmits force between the
    cardiomyocyte cytoskeleton and the basement membrane. With alpha-dystroglycan
    unable to bind laminin, that linkage is weakened and the sarcolemma is less
    able to withstand the mechanical load of repeated contraction. Mouse data
    make the important qualification that this membrane-fragility route is not on
    its own sufficient to produce contractile failure.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:31848331
    reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Although cardiac Fktn elimination markedly reduced α-dystroglycan glycosylation and dystrophin-glycoprotein complex proteins in sarcolemma at all developmental stages, cardiac dysfunction was observed only in later adulthood, suggesting that membrane fragility is not the sole etiology of cardiac dysfunction."
    explanation: >-
      Supports the loss of sarcolemmal dystrophin-glycoprotein complex at the
      cardiomyocyte membrane, and simultaneously constrains how much of the
      phenotype that loss can explain. Graded INDIRECT because it is a complete
      cardiac knockout rather than the hypomorphic human genotype.
  downstream:
  - target: Impaired Compensatory Hypertrophic Signaling
    description: >-
      Beyond mechanical fragility, fukutin loss disables the signaling response
      that would normally let the myocyte compensate for haemodynamic load.
  - target: Ventricular Remodeling and Myocardial Fibrosis
    description: >-
      Repeated contraction-induced injury to a poorly anchored sarcolemma drives
      cardiomyocyte loss and replacement fibrosis.
- name: Impaired Compensatory Hypertrophic Signaling
  biological_scale: CELLULAR
  description: >-
    Fukutin-deficient cardiomyocytes fail to mount the adaptive hypertrophic
    response that normally offsets haemodynamic load. In the mouse, adrenergic
    and pressure-overload stress that produces compensated hypertrophy in
    controls instead produces chamber dilation, fibrosis and contractile failure,
    with loss of the expected Akt phosphorylation and a disrupted MEF2-histone
    deacetylase axis. This is the branch that best explains why the human disease
    is stress-sensitive and variable in onset rather than uniformly congenital.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:31848331
    reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "During young adulthood, Fktn-deficient mice were vulnerable to pathological hypertrophic stress with downregulation of Akt and the MEF2-histone deacetylase axis."
    explanation: >-
      Identifies the signaling lesion this node asserts. INDIRECT because the
      claim about human CMD1X rests on a complete murine knockout rather than the
      hypomorphic human genotype.
  - reference: PMID:31848331
    reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Acute Fktn elimination caused severe cardiac dysfunction and accelerated mortality with myocyte contractile dysfunction and disordered Golgi-microtubule networks, which were ameliorated with colchicine treatment."
    explanation: >-
      Shows that fukutin is required for ongoing myocyte function beyond its role
      in building the sarcolemmal glycan, since acute removal in the adult heart
      causes failure without waiting for membrane damage to accumulate.
  downstream:
  - target: Ventricular Remodeling and Myocardial Fibrosis
    description: >-
      A myocyte that cannot compensate for load remodels maladaptively instead.
- name: Ventricular Remodeling and Myocardial Fibrosis
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Cardiomyocyte injury and failed compensation give way to increased myocyte
    cross-sectional area, interstitial fibrosis and chamber dilation. In the
    cardiac-specific fukutin knockout these changes appear in middle-aged animals
    and are accompanied by disorganised myofilaments and impaired calcium
    handling during excitation-contraction coupling.
  evidence:
  - reference: PMID:31848331
    reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular dystrophy-associated heart failure.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "These mice also showed cardiac dysfunction and chamber dilation during diastole at this age."
    explanation: >-
      Documents the remodeling and dilation this node describes in the cardiac
      fukutin knockout.
  downstream:
  - target: Dilated Cardiomyopathy with Systolic Failure
    description: >-
      Progressive loss of contractile tissue and chamber dilation present
      clinically as dilated cardiomyopathy.
- name: Dilated Cardiomyopathy with Systolic Failure
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The clinical endpoint is a dilated, hypokinetic left ventricle with reduced
    ejection fraction, presenting as heart failure. The course is variable: the
    founding series included both a child who died of rapidly progressive disease
    and an adolescent who reached transplantation.
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient died by rapid progressive dilated cardiomyopathy at 12 years old, and the other patient received cardiac implantation at 18 years old."
    explanation: >-
      Establishes both the dilated cardiomyopathy endpoint and the severity range
      reported in the defining series.
- name: Relative Sparing of Skeletal Muscle and Brain
  biological_scale: TISSUE
  description: >-
    The defining feature of CMD1X is what does not happen. The same
    hypoglycosylation of alpha-dystroglycan that destroys skeletal muscle and
    brain in Fukuyama congenital muscular dystrophy leaves these patients with
    normal intelligence and no or minimal limb girdle weakness, and with skeletal
    muscle biopsies showing only minimal dystrophic change. The residual fukutin
    activity of the hypomorphic allele combination is the usual explanation, but
    it does not by itself say why the myocardium is the tissue that cannot
    tolerate the shortfall. This tissue-selectivity is recorded as an open
    question rather than resolved.
  evidence:
  - reference: PMID:17036286
    reference_title: Fukutin gene mutations cause dilated cardiomyopathy with minimal muscle weakness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FKTN mutations could cause much wider spectrum of clinical features than previously perceived, including familial dilated cardiomyopathy and mildest limb girdle muscular dystrophy."
    explanation: >-
      The authors' own framing of CMD1X as the mild end of the FKTN allelic
      spectrum, which is the claim this node records.

genetic:
- name: FKTN
  notes: >-
    FKTN, at 9q31.2, encodes fukutin, a Golgi ribitol-phosphate transferase.
    CMD1X arises from biallelic hypomorphic variants, typically compound
    heterozygous, that reduce rather than abolish enzyme activity. Null
    combinations of the same gene produce Fukuyama congenital muscular dystrophy
    and the more severe dystroglycanopathies.
  gene_term:

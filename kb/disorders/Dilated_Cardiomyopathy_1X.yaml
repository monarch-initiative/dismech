name: Dilated Cardiomyopathy 1X
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  Dilated cardiomyopathy 1X (CMD1X) is an autosomal recessive dilated
  cardiomyopathy caused by biallelic, usually compound heterozygous, variants in
  FKTN. Fukutin is a Golgi ribitol-phosphate transferase that acts with
  fukutin-related protein to build the tandem ribitol-phosphate structure on the
  core M3 O-mannosyl glycan of alpha-dystroglycan; that structure is the scaffold
  on which matriglycan is polymerised, and matriglycan is what lets
  alpha-dystroglycan bind laminin, agrin and perlecan in the basement membrane.
  Null combinations of FKTN alleles produce Fukuyama congenital muscular
  dystrophy, with severe skeletal myopathy, brain malformation and intellectual
  disability. CMD1X sits at the opposite, hypomorphic end of the same allelic
  series: enough fukutin activity survives to leave skeletal muscle and brain
  largely intact, but not enough to protect the myocardium. Patients therefore
  present with what looks like isolated dilated cardiomyopathy, with normal
  intelligence and no or minimal limb girdle weakness, while their skeletal
  muscle nonetheless shows biochemically abnormal alpha-dystroglycan
  glycosylation and reduced laminin binding on biopsy. The course is variable and
  can be severe, with reported death in childhood and cardiac transplantation in
  adolescence. Why cardiac muscle is so much less tolerant of the same molecular
  lesion than skeletal muscle is the central unresolved question of the entity.
notes: >-
  The name is a nomenclature trap and is worth stating explicitly, because the
  entity is repeatedly conflated with a genetically unrelated disease. CMD1X is
  not X-linked. OMIM's dilated cardiomyopathy nomenclature enumerates the CMD1
  series with sequential letters, and "1X" is simply the position reached in that
  enumeration; FKTN is autosomal, at 9q31.2, and inheritance is autosomal
  recessive. X-linked dilated cardiomyopathy is a separate entity caused by DMD
  variants at Xp21. The two are indexed together by search engines and are
  sometimes confused in secondary literature.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's front matter, not the Clinical
  Characteristics, Diagnosis, Management or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical baseline for this entry is therefore
  built from the primary FKTN literature: the founding case series
  (PMID:17036286), the compound-heterozygote report with cardiac end-stage
  disease (PMID:35743126), and the pregnancy case (PMID:26566449).

  Module conformance divergence. The node conforming to
  pial_basement_membrane_radial_glial_endfoot_failure#Alpha-Dystroglycan
  Glycosylation and ECM Ligand Binding Failure does not carry the module node's
  GO:0035269 process term. That is deliberate rather than an oversight: this
  entry splits the mannosyl-glycan synthesis step onto the upstream enzyme node
  and reserves the conforming node for the resulting ligand-binding failure, so
  the process term sits one node earlier than the module places it.

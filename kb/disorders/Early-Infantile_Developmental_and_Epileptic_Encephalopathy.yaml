name: Early-Infantile Developmental and Epileptic Encephalopathy
creation_date: "2026-07-31T23:35:00Z"
description: >-
  Early-infantile developmental and epileptic encephalopathy (EIDEE) is the
  ILAE 2022 neonatal/infantile-onset epilepsy syndrome defined by frequent,
  drug-resistant seizures beginning at or before 3 months of age, an abnormal
  interictal EEG (classically burst-suppression, but also multifocal
  epileptiform discharges or hypsarrhythmia), an abnormal neurological
  examination, and developmental impairment. An identifiable structural,
  genetic, or metabolic cause is found in up to 80% of affected infants.

  Nosology - the point of this entry. EIDEE is a reclassification, not a new
  disease. In the 2022 ILAE Task Force on Nosology and Definitions position
  statement on epilepsy syndromes with onset in neonates and infants, the two
  historically separate entities Ohtahara syndrome (early infantile epileptic
  encephalopathy with suppression-bursts, defined by tonic spasms plus a
  persistent suppression-burst EEG) and early myoclonic encephalopathy (EME,
  defined by erratic/fragmentary myoclonus plus suppression-burst, classically
  metabolic in origin) were folded into the single syndrome EIDEE. The
  unification followed a long-standing argument that the clinical presentation,
  prognosis, and electroencephalographic signature of the two overlap so
  extensively that they represent one spectrum rather than two disorders, and
  that the historical split tracked presumed etiology (structural for Ohtahara,
  metabolic for EME) more reliably than it tracked electroclinical phenotype.
  MONDO:0800491 carries "Ohtahara syndrome", "early myoclonic encephalopathy",
  "EIEE", and "early infantile epileptic encephalopathy" as exact synonyms,
  reflecting this merge.

  Scope and boundaries. EIDEE is an age-at-onset electroclinical syndrome,
  etiologically heterogeneous by design. It should not be conflated with (a)
  the numbered OMIM/MONDO "DEE1..DEEn" (historically "EIEE1..n") series, which
  are gene-defined diseases curated separately in dismech (KCNQ2-DEE, STXBP1
  encephalopathy, CDKL5 deficiency disorder, SCN2A-DEE, SCN8A-DEE, GNAO1-DEE
  and others); (b) Genetic_Developmental_and_Epileptic_Encephalopathy, the
  etiology-defined umbrella spanning all ages of onset; or (c) the later-onset
  infantile syndromes Infantile_Spasms (infantile epileptic spasms syndrome),
  Dravet_syndrome, and Epilepsy_of_Infancy_with_Migrating_Focal_Seizures, from
  which EIDEE is separated by its onset at or before 3 months and its
  interictal EEG. This entry captures the syndrome-level definition, the shared
  mechanism, the etiologic spectrum, and the etiology-guided treatment
  approach; gene-specific variant spectra and natural history belong on the
  gene-specific entries.
category: Genetic

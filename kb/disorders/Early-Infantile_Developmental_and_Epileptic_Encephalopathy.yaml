notes: >-
  Boundary handling with adjacent dismech entries. Ohtahara syndrome and early
  myoclonic encephalopathy are curated here as synonyms of EIDEE rather than as
  separate entries, matching both the ILAE 2022 reclassification and the
  MONDO:0800491 synonym set. Dravet_syndrome (MONDO:0100135) stays a distinct
  entry: its onset is typically at 5-6 months with febrile hemiclonic seizures
  and a normal early EEG, which places it outside the "seizures at or before 3
  months with abnormal interictal EEG and abnormal neurological examination"
  EIDEE definition. Note the one deliberate crossover recorded below: rare
  SCN1A gain-of-function variants produce a non-Dravet EIDEE phenotype with
  onset by three months, and that phenotype is EIDEE, not Dravet syndrome, with
  the opposite sodium-channel-blocker recommendation. Infantile_Spasms
  (infantile epileptic spasms syndrome) is likewise kept separate; it is the
  commonest downstream syndrome EIDEE evolves into, and the transition is
  modelled here as a progression phase rather than by merging the two entries.
  Gene-level entries (KCNQ2_Developmental_and_Epileptic_Encephalopathy,
  STXBP1_Encephalopathy, CDKL5_Deficiency_Disorder,
  SCN2A-Related_Developmental_and_Epileptic_Encephalopathy,
  SCN8A-Related_Developmental_and_Epileptic_Encephalopathy,
  GNAO1-Related_Developmental_and_Epileptic_Encephalopathy) are referenced from
  the genetic section rather than duplicated.
  Undetermined_Early_Onset_Epileptic_Encephalopathy (MONDO:0018614) is the
  closest neighbouring entry and is also kept separate: it is an
  etiology-undetermined grouping holding numbered DEE subtypes, whereas EIDEE is
  a positively defined electroclinical syndrome with a specified onset window
  and an identifiable cause in up to 80% of cases.

  Relationship to the EIDEE Grouping. A companion Grouping,
  `kb/groupings/Early_Infantile_Developmental_and_Epileptic_Encephalopathies`
  (PR #7480), models the same ILAE syndrome as an auditable *union* over the
  molecularly defined member Disease entries whose documented onset falls inside
  the three-month window (KCNQ2, SCN2A, STXBP1, CDKL5, UGDH). The two are
  complementary, not duplicative, and follow the pattern CLAUDE.md records for
  diabetes mellitus, where a Grouping carries a skos mapping to a MONDO umbrella
  term while a retained umbrella Disease carries that term as its
  `disease_term`. The division of labour: a Grouping cannot carry
  `pathophysiology`, `phenotypes`, `prevalence`, `treatments` or `definitions`,
  so the conserved mechanism chain, the ILAE 2022 diagnostic criteria, the
  Ohtahara/EME reclassification story, the epidemiology and the
  etiology-guided treatment approach live here; the explicit, evaluator-checkable
  membership boundary lives there. The Grouping asserts `skos:broadMatch` to
  MONDO:0800491 precisely because it covers only a subset of the syndrome's
  genetic, structural and metabolic etiologies - this entry covers the whole
  syndrome concept, including the structural and metabolic causes that have no
  gene-level member entry. The same argument the
  Genetic_Developmental_and_Epileptic_Encephalopathy entry makes for being an
  umbrella Disease rather than a Grouping applies here.

  Deliberate omissions. `clinical_trials` is empty: the EIDEE-relevant trials
  surfaced by deep research are all gene-specific (SCN2A ASO, KCNQ2 channel
  opener, STXBP1 gene therapy) and several were terminated, so they belong on
  the gene-level entries where their status can be maintained. `animal_models`
  and `experimental_models` are likewise gene-specific; the one model directly
  used here (the Munc18-1 Ohtahara mouse, PMID:29217410) is cited as
  MODEL_ORGANISM evidence on the synaptic pathophysiology node instead.

  Mortality is not curated as a `phenotypes` entry. HP:0001522 (Death in
  infancy) sits in the HPO Mortality/Aging branch rather than under Phenotypic
  abnormality and is therefore outside the PhenotypeTerm dynamic enum, matching
  the handling in Isolated_Sulfite_Oxidase_Deficiency and
  Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I. Mortality is instead
  recorded under `clinical_burden`, where the population-based figure (16% of
  all severe infantile epilepsies dead before age two) is quoted with evidence.
  The EIDEE-specific 14% mortality over a mean 30-month follow-up comes from the
  full text of PMID:38074073 rather than its cached abstract, so it is stated
  there as unquoted free text only.

  Other full-text-derived figures. Several percentages in this entry come from
  the full text of PMID:38074073 and are therefore stated in `description`,
  `rationale` and `notes` fields rather than as evidence snippets: 60%
  drug-resistant and 71% severe developmental delay at follow-up, and the
  interictal EEG breakdown of 42% burst-suppression, 30% multifocal discharges
  and 13% hypsarrhythmia. This follows the repo SOP of moving unquotable claims
  into free text rather than fabricating a snippet.

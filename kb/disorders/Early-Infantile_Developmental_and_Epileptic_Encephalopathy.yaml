- name: Developmental and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The clinical endpoint is a two-component encephalopathy. A developmental
    encephalopathy arises directly from the etiology and impairs development
    independently of any seizure; an epileptic encephalopathy is superimposed
    when the epileptiform activity itself further degrades cognition and
    behaviour beyond what the underlying pathology alone would produce. The
    distinguishing feature of EIDEE specifically is that these two components
    cannot be separated: onset at or before three months means the etiology and
    the epileptiform activity act on the same window of development. This is the
    mechanistic reason EIDEE is defined as a developmental AND epileptic
    encephalopathy rather than a pure epileptic encephalopathy, and the reason
    seizure control alone does not restore development.

    Module note: this node declares no conforms_to. The
    epilepsy_excitation_inhibition_imbalance module terminates at recurrent
    unprovoked seizures (conformed above by Recurrent Drug-Resistant Seizures);
    the two-component developmental-plus-epileptic encephalopathy is
    EIDEE-specific content that lies beyond the module's chain. The module's
    "Seizure Generation and Epileptogenesis" node is likewise not separately
    instantiated: in EIDEE the epileptogenesis step is not clinically separable
    from the burst-suppression effector that precedes it, so splitting it out
    would create a node with no independent evidence.

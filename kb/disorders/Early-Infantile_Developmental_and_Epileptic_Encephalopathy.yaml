progression:
- phase: Neonatal/early infantile onset
  age_range: birth to 3 months
  notes: >-
    Frequent tonic, clonic or myoclonic seizures begin at or before 3 months,
    with a persistently abnormal interictal EEG (suppression-burst, multifocal
    discharges or hypsarrhythmia) and an abnormal neurological examination.
    Median onset in a prospective cohort was 28 days, range 1-90 days.
  evidence:
  - reference: PMID:11751020
    reference_title: "Early-infantile epileptic encephalopathy with suppression-bursts, Ohtahara syndrome; its overview referring to our 16 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      frequent tonic spasms, with or without clustering, of early onset within a
      few months of life
    explanation: Defines the onset phase of the syndrome.
- phase: Evolution to infantile epileptic spasms syndrome
  age_range: 3 to 6 months
  notes: >-
    Many infants evolve from EIDEE to West syndrome (infantile epileptic spasms
    syndrome), with the EEG transitioning from suppression-burst to
    hypsarrhythmia at around age 3-6 months. This age-dependent transition is
    the historical basis for treating EIDEE, West syndrome and Lennox-Gastaut
    syndrome as a single age-dependent epileptic encephalopathy continuum.
  evidence:
  - reference: PMID:11751020
    reference_title: "Early-infantile epileptic encephalopathy with suppression-bursts, Ohtahara syndrome; its overview referring to our 16 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic age-dependent evolution from OS to West syndrome (WS) in
      many cases, and further from WS to Lennox-Gastaut syndrome (LGS) in some
    explanation: Documents the syndromic evolution sequence.
- phase: Later childhood - chronic drug-resistant epilepsy with profound impairment
  age_range: 1 year onward
  notes: >-
    Further evolution from West syndrome to Lennox-Gastaut syndrome occurs in
    some, with the EEG moving from hypsarrhythmia to diffuse slow spike-waves at
    around age 1 year. Seizures may remit in some genotypes (over 50% of
    KCNQ2-EIDEE by age 9 months to 4 years) without corresponding developmental
    recovery, leaving moderate-to-profound impairment.
  evidence:
  - reference: PMID:20437616
    reference_title: KCNQ2-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures generally cease between ages nine months and four years. At
      onset, EEG shows a burst-suppression pattern or multifocal epileptiform
      activity; early brain MRI can show basal ganglia hyperdensities and later
      MRIs may show white matter or general volume loss.
      Moderate-to-profound developmental impairment is present.
    explanation: >-
      Documents late seizure remission in the prototypical genetic EIDEE
      alongside the persisting moderate-to-profound developmental impairment.

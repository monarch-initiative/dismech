      explicit in the same row.
- population: Victoria, Australia (population-based cohort of severe epilepsies with onset before 18 months)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.6
  notes: >-
    Incidence of "early infantile epileptic encephalopathy" (the pre-2022 label
    for the same electroclinical concept) in a population-based Victorian
    cohort, reported per 100,000 live births per year alongside West syndrome
    and EIMFS. Lower than the Scottish estimate, consistent with the narrower
    pre-ILAE-2022 EIEE definition and with differences in ascertainment.
  evidence:
  - reference: PMID:33475165
    reference_title: "The severe epilepsy syndromes of infancy: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of epilepsy of infancy with migrating focal seizures (EIMFS)
      was 4.5/100 000 and of early infantile epileptic encephalopathy (EIEE) was
      3.6/100 000.
    explanation: >-
      Provides a second, independent population-based incidence estimate for the
      syndrome under its pre-2022 name.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    In a prospective EIDEE cohort, 60% remained drug-resistant, 71% had severe
    developmental delay or intellectual disability, and 14% died over a mean
    30-month follow-up. In a population-based cohort, every infant with EIEE had
    severe-to-profound developmental delay or was deceased by age two.
  evidence:
  - reference: PMID:33475165
    reference_title: "The severe epilepsy syndromes of infancy: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All infants with EIEE or EIMFS had severe-profound delay or were deceased,
      but only 19 of 64 (30%) infants with WS, "WS-like," or "unifocal epilepsy"
      had severe-profound delay
    explanation: >-
      Directly contrasts the uniformly severe outcome of EIEE with the more
      variable outcome of the later-onset infantile syndromes.
  - reference: PMID:33475165
    reference_title: "The severe epilepsy syndromes of infancy: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighteen (16%) infants died before age 2 years.
    explanation: >-
      Population-based mortality figure for the severe infantile epilepsies as a
      group, of which EIEE/EIDEE is among the worst-outcome subgroups.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The majority of genetically resolved EIDEE is caused by heterozygous de novo
    variants in dominant channel and synaptic genes (KCNQ2, STXBP1, SCN2A,
    SCN8A, GNAO1, KCNT1). Two thirds of pathogenic findings in a prospective
    EIDEE cohort followed dominant inheritance.
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LOF de novo KCNQ2 variants cause neonatal-onset EIDEE
    explanation: >-
      Illustrates the de novo dominant mechanism for the prototypical EIDEE
      gene. The same sentence continues that inherited KCNQ2 variants instead
      cause self-limited seizures; the snippet is truncated because the source
      PDF carries a reference marker immediately after "EIDEE".
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A minority of EIDEE is autosomal recessive, most notably the metabolic and
    mitochondrial causes (SLC25A22, biotinidase deficiency, ALDH7A1, PNPO).
    Recessive causes are enriched in consanguineous populations. One third of
    pathogenic findings in a prospective EIDEE cohort were recessive.
  evidence:
  - reference: PMID:19780765
    reference_title: Mutations in the mitochondrial glutamate carrier SLC25A22 in neonatal epileptic encephalopathy with suppression bursts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a novel SLC25A22 mutation in an unrelated patient born from
      first cousin Algerian parents and presenting severe epileptic
      encephalopathy characterized by an EEG with SB, hypotonia, microcephaly
    explanation: >-
      A homozygous SLC25A22 variant in a consanguineous family is the archetypal
      recessive, metabolic cause of neonatal EE with suppression-burst.
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    CDKL5 and ARX are X-linked causes of EIDEE. ARX mutations act through
    disrupted GABAergic interneuron migration and maturation, producing X-linked
    infantile spasms syndrome and, at the severe end, early-infantile
    encephalopathy with suppression-burst.
  evidence:
  - reference: PMID:22565167
    reference_title: "Interneuron, interrupted: molecular pathogenesis of ARX mutations and X-linked infantile spasms."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      A spectrum of mutations in the Aristaless-Related Homeobox gene (ARX) has
      been linked to ISSX, and downstream targets of this interneuron-expressed
      transcription factor are being defined.
    explanation: >-
      Establishes ARX as an interneuron-expressed transcription factor whose
      mutation spectrum underlies X-linked infantile spasms syndrome (ISSX).
      Marked PARTIAL rather than SUPPORT because the snippet itself names
      neither the X-linked mode of inheritance in words nor EIDEE; the X-linkage
      and the EIDEE-severity end of the ARX spectrum are stated in the body of
      the source rather than in this sentence. Evidence source is OTHER because
      this is a review article.
pathophysiology:
- name: Etiologic Lesion of the Immature Brain
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    EIDEE is a final common electroclinical phenotype rather than a single
    disease, and the upstream lesion is heterogeneous: a pathogenic variant in
    an ion-channel, synaptic, transcriptional or metabolic gene; a structural
    malformation of cortical development or acquired perinatal brain injury; or
    an inborn error of metabolism, frequently a vitamin-responsive one. In a
    prospective EIDEE cohort an etiology was established in 83% of infants -
    genetic in 50%, structural in 19% and metabolic in 14%, with all metabolic
    cases vitamin-responsive.
  notes: >-
    On biological_scale. This node is tagged MOLECULAR because the genetic and
    metabolic etiologies that account for the substantial majority of EIDEE
    (50% + 14% = 64% of the prospective cohort, versus 19% structural) are
    molecular lesions. The structural arm - malformation of cortical development
    and acquired perinatal injury - is genuinely TISSUE-scale, so the single
    tag under-describes that minority. This is a deliberate and disclosed
    compromise, not an oversight: EIDEE is defined by the ILAE as an
    etiologically heterogeneous final common electroclinical phenotype, so a
    single heterogeneous entry-point node is the correct model for it, and
    splitting the node by scale would fragment that construct without adding
    mechanism. Revisit if the structural arm is ever elaborated into its own
    chain.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Regulation of Membrane Potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  - preferred_term: Chemical Synaptic Transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients were further classified into four aetiological groups: genetic
      (50%), structural (19%), metabolic (14%; all were vitamin responsive) and
      unknown
    explanation: >-
      Quantifies the etiologic heterogeneity of the trigger node in the largest
      prospective EIDEE-specific cohort.
  - reference: PMID:35503712
    reference_title: "ILAE classification and definition of epilepsy syndromes with onset in neonates and infants: Position statement by the ILAE Task Force on Nosology and Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The principal aim of this proposal, consistent with the 2017 ILAE
      Classification of the Epilepsies, is to support epilepsy diagnosis and
      emphasize the importance of classifying epilepsy in an individual both by
      syndrome and etiology.
    explanation: >-
      The ILAE position statement establishes that syndrome and etiology are
      orthogonal axes, which is exactly why EIDEE has a single conserved
      mechanism chain with a heterogeneous trigger. Evidence source is OTHER
      because this is a consensus position statement rather than primary data.
  downstream:
  - target: Reduced Kv7.2/Kv7.3 M-Current
  - target: Increased Persistent Sodium Current
  - target: Impaired Synaptic Vesicle Release and Inhibitory Circuit Formation
  - target: Excitation-Inhibition Imbalance in Immature Cortical Networks
  - target: Developmental and Epileptic Encephalopathy
    description: >-
      The developmental-encephalopathy arm. The etiologic lesion degrades
      development directly, independently of any seizure, by perturbing
      developmental processes and neural cell function in the immature brain.
      This edge is required for the entry to model EIDEE as a developmental AND
      epileptic encephalopathy; without it the pathograph would assert - against
      the ILAE construct and against this entry's own outcome-node description -
      that all developmental impairment is seizure-mediated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39237642
      reference_title: Developmental and epileptic encephalopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        a shared consequence is impairment of higher cortical functions, in
        addition to drug-resistant seizures
      explanation: >-
        States that the impairment of higher cortical function is a consequence
        of the etiology alongside - not downstream of - the drug-resistant
        seizures, which is the direct developmental arm this edge encodes.
- name: Reduced Kv7.2/Kv7.3 M-Current
  biological_scale: MOLECULAR
  role: mechanism
  description: >-
    KCNQ2 and KCNQ3 form the heterotetrameric M-channel that regulates neuronal
    excitability. De novo loss-of-function KCNQ2 variants reduce the M-current
    that repolarizes neurons after firing, removing a brake on repetitive
    discharge and producing neonatal-onset EIDEE. The same gene's inherited
    variants instead cause self-limited familial neonatal epilepsy, so the
    lesion is dose- and mechanism-dependent rather than gene-dependent. This
    node is deliberately separated from the sodium-channel gain-of-function node
    below: the two are opposite-direction lesions converging on the same
    downstream imbalance, and only one of them is a sodium-channel-blocker
    target.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Potassium Ion Transmembrane Transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  molecular_functions:
  - preferred_term: voltage-gated potassium channel activity
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LOF de novo KCNQ2 variants cause neonatal-onset EIDEE
    explanation: >-
      States the loss-of-function KCNQ2 to EIDEE relationship directly, using
      the EIDEE label. Evidence source is OTHER because the source is a Nature
      Reviews Disease Primers review article.
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      KCNQ3 and KCNQ2 form the heterotetrameric M-
    explanation: >-
      Identifies the Kv7.2/Kv7.3 heterotetrameric M-channel as the molecular
      substrate. The quote is truncated at "M-" because the source PDF
      hyphenates "M-channel" across a line break. Evidence source is OTHER
      because the source is a review article.
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      KCNQ2 EIDEE typically causes severe to profound impairment
    explanation: >-
      Establishes the clinical severity of the KCNQ2 arm. Marked PARTIAL because
      it speaks to outcome rather than to the M-current mechanism this node
      asserts. Evidence source is OTHER because the source is a review article.
  downstream:
  - target: Excitation-Inhibition Imbalance in Immature Cortical Networks
- name: Increased Persistent Sodium Current
  biological_scale: MOLECULAR
  role: mechanism
  description: >-
    Gain-of-function variants in the sodium-channel alpha subunits SCN2A, SCN8A,
    SCN3A and rarely SCN1A slow fast inactivation, accelerate its recovery, or
    increase persistent inward sodium current, raising intrinsic neuronal
    excitability. This is the arm of the EIDEE channelopathy spectrum that
    responds to sodium-channel-blocker therapy, and it is why the functional
    direction of a sodium-channel variant - not the gene name - determines the
    prescription.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Sodium Ion Transmembrane Transport
    term:
      id: GO:0035725
      label: sodium ion transmembrane transport
    modifier: INCREASED
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: INCREASED
  evidence:
  - reference: PMID:28379373
    reference_title: Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations associated with early infantile epilepsy result in increased
      sodium channel activity with gain-of-function, characterized by slowing of
      fast inactivation, acceleration of its recovery or increased persistent
      sodium current
    explanation: >-
      Establishes the gain-of-function biophysical signature specific to SCN2A
      variants presenting with epilepsy onset before three months.
  - reference: PMID:32090326
    reference_title: Biological concepts in human sodium channel epilepsies and their relevance in clinical practice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with gain-of-function SCN2A/3A/8A missense variants or CNV
      duplications share similar characteristics, most frequently present with
      early onset epilepsy (<3 months)
    explanation: >-
      Extends the gain-of-function-to-early-onset relationship across SCN2A,
      SCN3A and SCN8A as a class.
  downstream:
  - target: Excitation-Inhibition Imbalance in Immature Cortical Networks
- name: Impaired Synaptic Vesicle Release and Inhibitory Circuit Formation
  biological_scale: CELLULAR
  role: mechanism
  description: >-
    The second major genetic class is the synaptopathies and
    interneuronopathies. STXBP1 (Munc18-1) haploinsufficiency disrupts
    SNARE-mediated synaptic vesicle docking and fusion, reducing evoked
    neurotransmitter release; STXBP1 was the single commonest gene in both a
    prospective EIDEE cohort and a burst-suppression cohort. ARX loss disrupts
    the specification and tangential migration of cortical GABAergic
    interneurons, so the inhibitory circuitry itself is built wrong. Recessive
    SLC25A22 loss abolishes mitochondrial glutamate carrier activity, coupling a
    metabolic lesion to the same neurotransmission endpoint.

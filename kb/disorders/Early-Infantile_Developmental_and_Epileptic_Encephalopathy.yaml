      the underlying pathology alone would produce, and that this can worsen
      over time. This is the epileptic component superimposed on the
      developmental encephalopathy in this node.
mechanistic_hypotheses:
- hypothesis_group_id: eidee_epileptic_component_reversibility
  hypothesis_label: >-
    Suppressing epileptiform activity in EIDEE recovers a separable share of
    developmental potential
  status: EMERGING
  description: >-
    The DEE construct implies that the epileptic component of the encephalopathy
    is, in principle, modifiable: if the epileptiform activity independently
    degrades development, then abolishing it should yield developmental gains
    over and above the fixed developmental encephalopathy. There are clear
    proofs of principle in other DEEs (withdrawal of contraindicated
    sodium-channel blockers in Dravet syndrome, EEG normalization in
    Landau-Kleffner syndrome). Whether this holds for EIDEE specifically is
    unresolved, because at onset before three months the two components act on
    the same developmental window and cannot be dissociated clinically. In
    KCNQ2-EIDEE, for example, seizures remit in more than half of patients in
    early life yet impairment remains severe to profound - which argues that the
    developmental component dominates in at least some genotypes.
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      there are clear examples where improvement of seizure control or
      resolution of interictal EEG abnormalities ameliorate cognitive outcome
    explanation: >-
      Supports the general premise for the DEEs while the same source notes it
      is difficult to determine any additive effect of seizures on cognitive
      outcome, which is why this is recorded as an emerging hypothesis rather
      than an established mechanism.

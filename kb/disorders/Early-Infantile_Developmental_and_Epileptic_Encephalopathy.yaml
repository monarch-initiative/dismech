      Frequency is OBLIGATE because onset at or before three months is part of
      the syndrome definition rather than an observed proportion.
- category: Neurological
  name: Tonic Seizures and Tonic Spasms
  frequency: FREQUENT
  description: >-
    Frequent tonic seizures and tonic spasms, occurring both awake and asleep
    and often in clusters, are the classic seizure type of the Ohtahara arm of
    EIDEE. Tonic spasms appear concomitantly with the EEG bursts. In a
    prospective EIDEE cohort, tonic seizures were significantly less likely in
    the vitamin-responsive and structural etiologic groups than in the
    genetic/unknown groups.
  phenotype_term:
    preferred_term: Tonic seizure
    term:
      id: HP:0032792
      label: Tonic seizure
  evidence:
  - reference: PMID:11751020
    reference_title: "Early-infantile epileptic encephalopathy with suppression-bursts, Ohtahara syndrome; its overview referring to our 16 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ohtahara syndrome (OS) is characterized by frequent tonic spasms, with or
      without clustering, of early onset within a few months of life, and a
      suppression-burst (S-B) pattern in electroencephalography (EEG). Tonic
      spasms occur in not only waking but also sleeping state in most cases.
    explanation: >-
      Defines frequent tonic spasms as a core feature occurring in most cases,
      supporting the FREQUENT band.
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: PARTIAL

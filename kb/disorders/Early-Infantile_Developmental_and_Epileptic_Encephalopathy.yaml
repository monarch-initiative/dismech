  name: Myoclonic Seizures
  description: >-
    Erratic, fragmentary or massive myoclonus was the defining seizure type of
    early myoclonic encephalopathy, the arm of EIDEE historically associated
    with inborn errors of metabolism. Myoclonic seizures remain one of the
    common seizure types recorded in EIDEE cohorts alongside clonic and tonic
    seizures. No frequency band is assigned: published EIDEE cohorts report
    seizure-type lists without a myoclonus-specific proportion.

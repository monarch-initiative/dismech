prevalence:
- population: Scotland (prospective population-based birth cohort, 169,500 live births)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  rate_low: 5.8
  rate_high: 16.0
  notes: >-
    Cumulative incidence per 100,000 live births for EIDEE explicitly defined to
    include Ohtahara syndrome and early myoclonic encephalopathy, from a
    three-year prospective population-based Scottish study tabulated in the 2024
    Nature Reviews Disease Primers on the DEEs. Recorded as BIRTH_PREVALENCE
    because the denominator is live births in a defined birth cohort rather than
    person-years at risk. The point estimate of 10/100,000 sits exactly on the
    boundary between the Orphanet 1-9/100,000 and 1-5/10,000 bands and the 95%
    CI (5.8-16) straddles both; the higher band is recorded for the point
    estimate, but the true band is uncertain.

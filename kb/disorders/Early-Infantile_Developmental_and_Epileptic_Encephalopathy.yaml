treatments:
- name: Etiology-Guided Diagnostic Workup and Precision Treatment
  description: >-
    Because EIDEE is defined electroclinically but treated etiologically, the
    single most consequential intervention is rapid etiologic diagnosis: video
    EEG, epilepsy-protocol brain MRI, targeted metabolic testing, and rapid trio
    exome or genome sequencing. Molecular diagnosis was achieved in 69% of
    tested infants in a prospective EIDEE cohort. The diagnosis then determines
    treatment direction - vitamin supplementation, sodium-channel blockade,
    channel opener, resective surgery or ketogenic diet - and the same gene can
    require opposite treatments depending on the functional direction of the
    variant.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A molecular diagnosis was achieved in 53 out of 77 patients tested (69%).
      Next-generation sequencing had a yield of 51%, while microarray had a
      yield of 14%.
    explanation: >-
      Quantifies the diagnostic yield that makes an etiology-first strategy
      worthwhile in EIDEE.
- name: Vitamin and Cofactor Trials for Treatable Metabolic Causes
  description: >-
    A monitored empiric trial of pyridoxine (for ALDH7A1 pyridoxine-dependent
    epilepsy), pyridoxal 5'-phosphate (PNPO deficiency), folinic acid and biotin
    (biotinidase deficiency) is a priority in any infant presenting with EIDEE,
    because these are the only etiologies with a demonstrably favourable seizure
    outcome. In a prospective EIDEE cohort all metabolic causes were
    vitamin-responsive, and vitamin responsiveness was the only independently
    significant positive predictor of seizure control. Pyridoxine trials require
    cardiorespiratory monitoring because apnoea can occur.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
    - preferred_term: biotin
      term:
        id: CHEBI:15956
        label: biotin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Etiologic Lesion of the Immature Brain
    treatment_effect: INHIBITS
    description: >-
      Cofactor supplementation corrects the underlying metabolic block in
      vitamin-responsive causes, removing the trigger rather than suppressing
      the downstream discharge.
  evidence:
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with vitamin responsive epilepsies had the best probability of
      seizure control.
    explanation: >-
      The cohort's headline treatment conclusion, directly supporting vitamin
      trials as the highest-yield intervention.
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic testing was diagnostic in three out of 41 patients tested (all
      three had biotinidase deficiency).
    explanation: >-
      Identifies biotinidase deficiency as the specific treatable metabolic
      cause found in this cohort, supporting the biotin arm.
- name: Sodium Channel Blocker Therapy for Gain-of-Function Channelopathies
  description: >-
    Carbamazepine, phenytoin and related sodium-channel blockers are the
    prototype EIDEE precision therapy. In infants with gain-of-function SCN2A,
    SCN3A or SCN8A variants, and in KCNQ2 loss-of-function EIDEE,
    sodium-channel blockade is often markedly more effective than other
    antiseizure medications; the same drugs are contraindicated in SCN1A
    loss-of-function Dravet syndrome, where they aggravate seizures. Because
    EIDEE and Dravet syndrome can both be caused by SCN1A, the functional
    direction of the variant - not the gene name - must drive the prescription.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Increased Persistent Sodium Current
    treatment_effect: INHIBITS
    description: >-
      Sodium-channel blockade directly counteracts the increased persistent
      inward sodium current produced by gain-of-function variants. The edge
      points at the sodium arm only: the KCNQ2 potassium arm is a
      loss-of-function lesion and its precision target is an M-channel opener,
      not a blocker.
  evidence:
  - reference: PMID:32090326
    reference_title: Biological concepts in human sodium channel epilepsies and their relevance in clinical practice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most frequently present with early onset epilepsy (<3 months), and
      demonstrate good response to sodium channel blockers (SCBs)
    explanation: >-
      Directly links the EIDEE onset window to sodium-channel-blocker
      responsiveness in gain-of-function sodium channelopathies.
  - reference: PMID:28379373
    reference_title: Genetic and phenotypic heterogeneity suggest therapeutic implications in SCN2A-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the use of sodium channel blockers was often associated with clinically
      relevant seizure reduction or seizure freedom in children with early
      infantile epilepsies (<3 months), whereas other antiepileptic drugs were
      less effective
    explanation: >-
      Quantitative clinical support for sodium-channel blockade specifically in
      the under-three-month onset group.
  - reference: PMID:20437616
    reference_title: KCNQ2-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizure freedom is more likely achieved when receiving sodium channel
      blockers.
    explanation: >-
      GeneReviews recommendation for KCNQ2 neonatal-onset DEE.
  notes: >-
    Agents to avoid. The DEE Primer records that sodium-channel blockers may
    exacerbate seizures in SCN1A loss-of-function Dravet syndrome; the same
    caution does not apply to the gain-of-function EIDEE phenotypes described
    here, which is why the functional direction of the variant must be
    established before prescribing.
- name: Conventional Antiseizure Medication
  description: >-
    Phenobarbital, levetiracetam, benzodiazepines, valproate and vigabatrin are
    the conventional first- and second-line antiseizure medications used while
    the etiology is being established and in the majority of infants for whom no
    precision option exists. Phenobarbital, valproic acid and vigabatrin are the
    most commonly used agents in STXBP1 encephalopathy, the commonest
    single-gene EIDEE. Roughly a quarter of STXBP1 patients are refractory to
    antiseizure medication altogether.
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Burst-Suppression and Hypersynchronous Cortical Discharge
    treatment_effect: INHIBITS
    description: >-
      Conventional antiseizure medications act symptomatically on network
      hypersynchrony rather than on the upstream etiologic lesion.
  evidence:
  - reference: PMID:27905812
    reference_title: STXBP1 Encephalopathy with Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly used anti-seizure medications (ASMs) are phenobarbital,
      valproic acid, and vigabatrin. About 20% of individuals require more than
      one ASM and approximately 25% are refractory to ASM therapy.
    explanation: >-
      GeneReviews for the commonest EIDEE gene names the conventional ASMs used
      and quantifies refractoriness.
- name: Hormonal Therapy with ACTH or Corticosteroid
  description: >-
    Adrenocorticotropic hormone and high-dose corticosteroid are the standard of
    care once EIDEE evolves into infantile epileptic spasms syndrome (West
    syndrome), the commonest downstream syndrome, typically at 3-6 months as the
    EEG moves from suppression-burst to hypsarrhythmia. Hormonal therapy is far
    less consistently effective for EIDEE in its suppression-burst phase, and
    spasm-phase efficacy should not be read back onto the neonatal phase. No
    `target_mechanisms` edge is declared: the mechanism by which hormonal
    therapy suppresses spasms is not established, and asserting an edge into
    this entry's pathograph would overstate what is known.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticotropin
      term:
        id: CHEBI:3892
        label: corticotropin
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:35765990
    reference_title: "Treatment of children with infantile spasms: A network meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments including ACTH and high dose prednisolone are more effective in
      achieving electroclinical and clinical remissions for infantile spasms.
    explanation: >-
      Supports hormonal therapy for infantile spasms, the syndrome EIDEE
      characteristically evolves into. Marked PARTIAL because the evidence is
      for the spasms phase, not for EIDEE in its suppression-burst phase.
      Evidence source is HUMAN_CLINICAL: this is a network meta-analysis
      synthesising randomised trials in children, not a narrative review.
  - reference: PMID:11751020
    reference_title: "Early-infantile epileptic encephalopathy with suppression-bursts, Ohtahara syndrome; its overview referring to our 16 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic age-dependent evolution from OS to West syndrome (WS) in
      many cases
    explanation: >-
      Establishes the evolution to West syndrome that makes hormonal therapy
      relevant to the EIDEE care pathway.
- name: Ketogenic Diet
  description: >-
    The ketogenic diet is used for antiseizure-medication-resistant EIDEE and is
    disease-targeted therapy in GLUT1 deficiency. It is feasible in neonates and
    young infants but requires close monitoring: in a neonatal series 40% had a
    good response while the diet had to be suspended in a further 40% because of
    serious adverse effects.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Burst-Suppression and Hypersynchronous Cortical Discharge
    treatment_effect: INHIBITS
    description: >-
      Ketosis raises seizure threshold and suppresses network hypersynchrony;
      in GLUT1 deficiency it additionally bypasses the etiologic transport
      defect.
  evidence:
  - reference: PMID:37321250
    reference_title: "Ketogenic Diet in Neonates with Drug-Resistant Epilepsy: Efficacy and Side Effects-A Single Center's Initial Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diet had a good response in four (40%) patients. In four patients, the
      ketogenic diet was suspended because of the onset of serious side effects.
    explanation: >-
      Gives both the response rate and the tolerability limitation of the
      ketogenic diet in neonates with drug-resistant epilepsy.
  - reference: PMID:37321250
    reference_title: "Ketogenic Diet in Neonates with Drug-Resistant Epilepsy: Efficacy and Side Effects-A Single Center's Initial Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ketogenic diet is efficacious and safe in infants, but the early and
      aggressive management of adverse reactions is important to improve the
      safety and effectiveness of the ketogenic treatment.
    explanation: >-
      The authors' overall conclusion on ketogenic diet use in this age group.
- name: Epilepsy Surgery for Resectable Structural Lesions
  description: >-
    Structural etiology accounts for roughly a fifth of EIDEE, and where a
    unifocal resectable lesion such as focal cortical dysplasia is identified,
    surgical resection can be transformative. In a burst-suppression EIDEE
    cohort, surgical resection was effective in patients with cortical dysplasia.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Etiologic Lesion of the Immature Brain
    treatment_effect: INHIBITS
    description: >-
      Resection removes the structural lesion that is the etiologic trigger,
      rather than modulating the downstream network.
  evidence:
  - reference: PMID:32247221
    reference_title: Genetic diagnosis and clinical characteristics by etiological classification in early-onset epileptic encephalopathy with burst suppression pattern.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      surgical resection proved to be effective in patients with cortical
      dysplasia
    explanation: >-
      Direct evidence for resective surgery in the structural subgroup of
      early-onset EE with burst suppression.
- name: Multidisciplinary Supportive and Developmental Care
  description: >-
    Because developmental impairment persists even when seizures improve,
    holistic care is essential: feeding and swallowing assessment with
    gastrostomy where needed, respiratory and sleep management, physiotherapy,
    occupational and speech/communication therapy, management of tone and
    movement disorders, vision and hearing services, seizure rescue planning,
    and psychosocial and palliative support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:27905812
    reference_title: STXBP1 Encephalopathy with Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment per orthopedics, physical medicine and rehabilitation, physical
      therapy, and occupational therapy to help avoid contractures and falls,
      with positioning and mobility devices as needed.
    explanation: >-
      GeneReviews management recommendations for the commonest EIDEE gene,
      representative of supportive care across the syndrome.
- name: Genetic Counseling
  description: >-
    Most EIDEE-causing dominant variants are de novo, giving a low but non-zero
    recurrence risk; parental mosaicism raises that risk above the conventional
    germline-mosaicism estimate and can be detected with high-depth sequencing.
    Recessive and X-linked diagnoses carry standard recurrence risks and support
    cascade testing, prenatal testing and preimplantation genetic testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20437616
    reference_title: KCNQ2-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals diagnosed with KCNQ2-NEO-DEE have a de novo pathogenic
      variant.
    explanation: >-
      GeneReviews establishes the de novo origin that determines counselling for
      the prototypical genetic EIDEE.
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      high-depth sequencing of parental blood or salivary samples found that 8%
      of patients had a parent with low-level mosaicism
    explanation: >-
      Quantifies the parental-mosaicism rate that this counselling
      recommendation depends on, replacing what was previously an unsourced
      claim in the description. Tagged OTHER because this Nat Rev Dis Primers
      narrative review reports the 8% figure secondhand from its own reference
      175 rather than as primary data, consistent with the other twelve items
      citing this review.
definitions:
- name: ILAE 2022 Syndrome Definition of EIDEE
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The ILAE Task Force on Nosology and Definitions defines EIDEE as an epilepsy
    syndrome with seizure onset at or before 3 months of age, frequent
    drug-resistant seizures of multiple types (tonic, clonic, myoclonic, focal,
    epileptic spasms), an abnormal interictal EEG (burst-suppression, multifocal
    epileptiform discharges or hypsarrhythmia), an abnormal neurological
    examination, and developmental impairment. The syndrome subsumes the
    previously separate Ohtahara syndrome and early myoclonic encephalopathy.
    The 2022 position statement publishes per-syndrome tables of mandatory
    features, cautionary alerts and exclusionary features, and provides guidance
    for syndrome diagnosis in resource-limited settings where EEG, MRI and
    genetic testing may be unavailable.
  scope: >-
    Syndrome-level diagnostic criteria applied to neonates and infants with
    seizure onset in the first three months of life.
  inclusion_criteria:
  - preferred_term: Seizure onset at or before 3 months of age
    description: The mandatory age-at-onset criterion that defines the syndrome.
  - preferred_term: Frequent, typically drug-resistant seizures
    description: >-
      Multiple seizure types may occur - tonic, clonic, myoclonic, focal and
      epileptic spasms.
  - preferred_term: Abnormal interictal EEG
    description: >-
      Burst-suppression, multifocal epileptiform discharges, or hypsarrhythmia.
    term:
      id: HP:0002353
      label: EEG abnormality
  - preferred_term: Abnormal neurological examination
    description: >-
      Typically axial hypotonia with or without limb hypertonia or spasticity.
  - preferred_term: Developmental impairment
    description: >-
      Impairment beyond that attributable to the epileptiform activity alone,
      reflecting the developmental as well as the epileptic component.
    term:
      id: HP:0001263
      label: Global developmental delay
  exclusion_criteria:
  - preferred_term: Acute provoked (acute symptomatic) neonatal seizures
    description: >-
      Seizures secondary to an acute reversible insult such as hypoglycaemia,
      hypocalcaemia or acute infection, without an ongoing epilepsy.
  - preferred_term: Self-limited neonatal or infantile epilepsy
    description: >-
      Normal development and normal interictal EEG with spontaneous remission -
      the self-limited arm of the ILAE neonatal/infantile classification.
  - preferred_term: Seizure onset after 3 months of age
    description: >-
      Later onset points to infantile epileptic spasms syndrome, Dravet
      syndrome, or another infantile syndrome.
  evidence:
  - reference: PMID:35503712
    reference_title: "ILAE classification and definition of epilepsy syndromes with onset in neonates and infants: Position statement by the ILAE Task Force on Nosology and Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tables summarize mandatory features, cautionary alerts, and
      exclusionary features for the common syndromes.
    explanation: >-
      Establishes that the 2022 position statement is the source of the
      mandatory/cautionary/exclusionary criterion structure used here. Evidence
      source is OTHER because this is a consensus position statement.
  - reference: PMID:35503712
    reference_title: "ILAE classification and definition of epilepsy syndromes with onset in neonates and infants: Position statement by the ILAE Task Force on Nosology and Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Syndromes are separated into self-limited syndromes, where there is likely
      to be spontaneous remission and developmental and epileptic
      encephalopathies, diseases where there is developmental impairment related
      to both the underlying etiology independent of epileptiform activity and
      the epileptic encephalopathy.
    explanation: >-
      States the self-limited versus DEE dichotomy that underpins the exclusion
      of self-limited neonatal epilepsy from EIDEE. Evidence source is OTHER
      because this is a consensus position statement.
  notes: >-
    The exact mandatory/alert/exclusionary tables are in the full text of the
    position statement; only the abstract is available in the reference cache,
    so the criteria listed here are the syndrome features documented in the
    abstract, the MONDO:0800491 definition, and the primary cohort literature.
differential_diagnoses:
- name: Dravet syndrome
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
  description: >-
    SCN1A loss-of-function DEE with onset typically at 5-6 months, prolonged
    febrile hemiclonic or generalized seizures, and initially normal development
    and EEG - all outside the EIDEE definition. The distinction is
    treatment-critical: sodium-channel blockers aggravate Dravet syndrome but
    may be the treatment of choice in gain-of-function EIDEE.
  distinguishing_features:
  - Onset at 5-6 months rather than by 3 months
  - Normal development and normal interictal EEG before onset
  - Febrile, often prolonged hemiclonic seizures
  - SCN1A loss-of-function rather than gain-of-function
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      patients with the non-Dravet, EIDEE phenotype due to GOF variants may
      respond to SCB, such as carbamazepine and phenytoin
    explanation: >-
      Explicitly contrasts the EIDEE phenotype with Dravet syndrome at the level
      of SCN1A variant direction and drug response.
- name: Infantile epileptic spasms syndrome (West syndrome)
  disease_term:
    preferred_term: infantile spasms
    term:
      id: MONDO:0018097
      label: infantile spasms
  description: >-
    Epileptic spasms in clusters with hypsarrhythmia, typically presenting at
    3-12 months. It is both a differential diagnosis and the commonest syndrome
    into which EIDEE evolves; the discriminator is age at onset and the
    interictal EEG pattern at presentation.
  distinguishing_features:
  - Onset typically after 3 months
  - Hypsarrhythmia rather than suppression-burst at presentation
  - Epileptic spasms in clusters as the defining seizure type
  evidence:
  - reference: PMID:33475165
    reference_title: "The severe epilepsy syndromes of infancy: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      West syndrome (WS) and "WS-like" epilepsy (infantile spasms without
      hypsarrhythmia or modified hypsarrhythmia) were the most common syndromes
    explanation: >-
      Population-based study distinguishing West syndrome from EIEE as separate
      syndromes with different incidences and outcomes.
- name: Epilepsy of infancy with migrating focal seizures
  disease_term:
    preferred_term: epilepsy of infancy with migrating focal seizures
    term:
      id: MONDO:0017385
      label: malignant migrating partial seizures of infancy
  description: >-
    A distinct neonatal/infantile DEE defined by migrating focal seizures on EEG
    rather than suppression-burst, most often caused by KCNT1 gain-of-function.
    Curated separately in dismech as
    Epilepsy_of_Infancy_with_Migrating_Focal_Seizures; the MONDO term is bound
    here as well so that the differential boundary is machine-queryable. The
    binding uses MONDO:0017385 to match that sibling entry: MONDO:0100025
    carries the obsoletion_candidate subset (the two terms share the
    NANDO:1200595 xref and are duplicate concepts), so MONDO:0017385 is the
    surviving MONDO class for EIMFS. preferred_term keeps the modern ILAE label.
  distinguishing_features:
  - Ictal EEG shows seizures migrating between hemispheres
  - Interictal EEG does not show a persistent suppression-burst pattern
  - Strong association with KCNT1 gain-of-function
  evidence:
  - reference: PMID:33475165
    reference_title: "The severe epilepsy syndromes of infancy: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of epilepsy of infancy with migrating focal seizures (EIMFS)
      was 4.5/100 000 and of early infantile epileptic encephalopathy (EIEE) was
      3.6/100 000.
    explanation: >-
      Treats EIMFS and EIEE as separate, separately enumerated syndromes in a
      population-based cohort.
- name: Self-limited (familial) neonatal epilepsy
  disease_term:
    preferred_term: self-limited familial neonatal epilepsy
    term:
      id: MONDO:0100023
      label: self-limited familial neonatal epilepsy
  description: >-
    Neonatal seizures beginning in otherwise healthy infants in the first days
    of life that remit spontaneously in the first year, with normal development.
    Most commonly caused by inherited KCNQ2 variants - the same gene whose de
    novo loss-of-function variants cause EIDEE - which makes this the single
    most instructive EIDEE differential.
  distinguishing_features:
  - Normal development and normal interictal EEG
  - Spontaneous remission between the first and sixth to twelfth month of life
  - Inherited rather than de novo KCNQ2 variant
  evidence:
  - reference: PMID:20437616
    reference_title: KCNQ2-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KCNQ2-SLFNE is characterized by seizures that start in otherwise healthy
      infants between two and eight days after term birth and spontaneously
      disappear between the first and the sixth to 12th month of life.
    explanation: >-
      GeneReviews contrasts the self-limited and DEE ends of the KCNQ2
      continuum, which is exactly the differential at issue.
- name: Pyridoxine-dependent and other vitamin-responsive epilepsies
  disease_term:
    preferred_term: pyridoxine-dependent epilepsy
    term:
      id: MONDO:0009945
      label: pyridoxine-dependent epilepsy
  description: >-
    ALDH7A1 pyridoxine-dependent epilepsy, PNPO deficiency, folinic-acid
    responsive seizures and biotinidase deficiency present within the EIDEE
    window and satisfy the EIDEE criteria, but are separable by their dramatic
    response to the relevant vitamin or cofactor and carry a much better seizure
    prognosis. Curated separately as Pyridoxine-Dependent_Epilepsy. Empiric
    monitored vitamin trials should not be delayed pending genetic results. The
    binding deliberately uses the generic parent MONDO:0009945 rather than the
    ALDH7A1-specific MONDO:0020741 bound by that sibling entry, because this
    differential spans PNPO, folinic-acid-responsive and biotinidase deficiency
    as well as ALDH7A1; MONDO:0020741 is a child of MONDO:0009945, so the
    sibling entry still resolves under this term by subsumption.
  distinguishing_features:
  - Dramatic seizure response to pyridoxine, pyridoxal 5'-phosphate, folinic acid or biotin
  - Best probability of seizure control of any EIDEE etiologic group
  evidence:
  - reference: PMID:38074073
    reference_title: "Early-infantile developmental and epileptic encephalopathy: the aetiologies, phenotypic differences and outcomes-a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      metabolic (14%; all were vitamin responsive)
    explanation: >-
      All metabolic EIDEE causes in this prospective cohort were
      vitamin-responsive, which is what makes this differential actionable.
discussions:
- discussion_id: eidee_ohtahara_eme_merge_residual_structure
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the ILAE 2022 merge of Ohtahara syndrome and early myoclonic
    encephalopathy into EIDEE discard clinically actionable structure, given
    that the historical split tracked etiology (structural versus metabolic) and
    that the two arms differ in predominant seizure type?
  attaches_to:
  - "pathophysiology#Etiologic Lesion of the Immature Brain"
  rationale: >-
    The 2012 review that argued for unification did so on the basis of
    overlapping clinical presentation, prognosis and EEG signature. But the 2023
    prospective EIDEE cohort found that etiologic group is strongly predictive
    within EIDEE: tonic seizures are enriched in the genetic/unknown group (risk
    ratio 0.66 for the vitamin-responsive/structural group) while clonic
    seizures are enriched in the vitamin-responsive/structural group (risk ratio
    1.36), and severe developmental delay differs by an odds ratio of 57 between
    the groups. That is close to the axis the Ohtahara/EME split was tracking.
    If the seizure-type-plus-etiology structure is reproducible, EIDEE may need
    documented etiologic strata rather than a single undifferentiated syndrome.
  proposed_experiments:
  - experiment_id: exp_eidee_etiology_stratified_seizure_type_cohort
    name: Etiology-stratified prospective EIDEE cohort with seizure-type and EEG phenotyping
    description: >-
      Prospective multi-centre EIDEE cohorts reporting seizure type, interictal
      EEG pattern and outcome stratified by etiologic group, powered to test
      whether the tonic versus myoclonic/clonic distinction is independent of
      etiology.
    decision_criterion: >-
      If seizure type remains associated with the historical Ohtahara/EME split
      after adjustment for etiologic group, the merged syndrome is hiding
      reproducible structure.
  - experiment_id: exp_eidee_historical_series_reclassification
    name: Retrospective reclassification of historical Ohtahara and EME series
    description: >-
      Reclassify published Ohtahara syndrome and early myoclonic encephalopathy
      case series against the ILAE 2022 EIDEE criteria with modern genomic and
      metabolic testing, to determine how cleanly the historical labels map onto
      contemporary etiologic strata.
    decision_criterion: >-
      A clean mapping would indicate the historical labels were etiologic
      proxies; a poor mapping would support the merge.
  evidence:
  - reference: PMID:23044011
    reference_title: "Early-onset epileptic encephalopathies: Ohtahara syndrome and early myoclonic encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Newer understandings of underlying etiologies of these conditions may
      support the previously suggested concept that they represent a single
      spectrum of disease rather than two distinct disorders.
    explanation: >-
      States the unification argument that the ILAE 2022 reclassification
      adopted. Evidence source is OTHER because this is a review article.
- discussion_id: eidee_developmental_vs_epileptic_component
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    In EIDEE specifically, what share of the eventual developmental impairment
    is attributable to the epileptiform activity itself and is therefore
    potentially modifiable by seizure and EEG control, versus fixed by the
    underlying etiology?
  attaches_to:
  - "pathophysiology#Developmental and Epileptic Encephalopathy"
  rationale: >-
    The DEE construct asserts two separable contributors, but at onset before
    three months both act on the same developmental window and the DEE Primer
    states the distinction is often impossible to make. The natural experiment -
    KCNQ2-EIDEE, where seizures remit in over half of patients by age 9 months
    to 4 years yet impairment remains severe to profound - suggests the
    developmental component dominates for at least some genotypes. Resolving
    this determines whether aggressive seizure suppression in the neonatal
    period is developmentally worthwhile or only symptomatically so, and it is
    the central unstated assumption behind every EIDEE precision-therapy trial
    endpoint.
  proposed_experiments:
  - experiment_id: exp_eidee_epileptiform_burden_vs_developmental_quotient
    name: Longitudinal correlation of interictal epileptiform burden with developmental outcome
    description: >-
      Genotype-stratified longitudinal studies correlating quantitative
      interictal epileptiform burden in the first six months with developmental
      quotient at 2 and 5 years, controlling for etiologic group.
    decision_criterion: >-
      An independent association between epileptiform burden and later
      developmental quotient after adjusting for genotype would establish a
      modifiable epileptic component.
  - experiment_id: exp_eidee_eeg_normalization_outcome_comparison
    name: Outcome comparison by early EEG normalization
    description: >-
      Compare developmental outcome between EIDEE infants achieving early
      complete EEG normalization and matched infants with persistent
      epileptiform activity but equivalent clinical seizure control.
    decision_criterion: >-
      Better outcome in the EEG-normalized arm at equivalent seizure control
      would isolate the epileptic contribution to the encephalopathy.
  evidence:
  - reference: PMID:20437616
    reference_title: KCNQ2-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures generally cease between ages nine months and four years.
    explanation: >-
      Establishes the seizure-remission-without-developmental-recovery pattern
      in KCNQ2-EIDEE that motivates this question; the same GeneReviews entry
      records that moderate-to-profound developmental impairment is present.

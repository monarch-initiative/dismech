      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings highlight that the ISD11 R68A/R68L mutation display reduced affinity to form a stable subcomplex with NFS1"
      explanation: The patient R68L substitution weakens the ISD11-NFS1 subcomplex.
- name: Weakened ISD11 Binding to NFS1
  description: >
    ISD11 forms a stable complex with NFS1 and, with acyl carrier protein (ACP), holds
    it in an active conformation. Its role is regulatory rather than catalytic. The
    R68L variant lowers the affinity of ISD11 for NFS1.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LYRM4 (ISD11)
    term:
      id: hgnc:21365
      label: LYRM4
  - preferred_term: NFS1

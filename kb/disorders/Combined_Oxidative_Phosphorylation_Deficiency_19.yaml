discussions:
- discussion_id: coxpd19_cysteine_availability_hypothesis
  prompt: >-
    Does limited cysteine availability in the newborn period explain why one cousin died
    as a neonate and the other, with the same genotype, is healthy as an adult, and would
    a sulfur donor therefore help?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced NFS1 Cysteine Desulfurase Activity
  - pathophysiology#Homozygous LYRM4 Missense Variant
  rationale: >-
    The founding report proposes that residual NFS1 activity is substrate-limited, so
    that the cysteine supply sets how much cluster assembly survives. Cysteine is
    conditionally essential in the newborn because cystathionase activity is low, which
    would make the neonatal period the point of greatest vulnerability and could account
    for two relatives with one genotype and opposite outcomes. The proposal is the
    authors' interpretation; no cysteine or N-acetylcysteine has been given to a patient
    and no plasma cysteine measurement from these patients is published. It matters
    because it is the only therapeutic idea this disease has, and because the same
    argument does not transfer to the late-acting MMDS genes, whose step is not
    sulfur-limited. The hypothesis also has a published objection: the third patient's
    crises began at two years and recurred, which a limitation confined to the newborn
    period does not explain, and her own authors say so.
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The differences in biochemical and clinical features between the two patients may relate to limited availability of cysteine in the newborn period and suggest a potential approach to therapy."
    explanation: States the hypothesis and its therapeutic implication, as a possibility rather than a result.
  - reference: PMID:31497476
    reference_title: "Iron-sulfur cluster ISD11 deficiency (LYRM4 gene) presenting as cardiorespiratory arrest and 3-methylglutaconic aciduria."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, this justification does not account for the late onset and repeated episodes on this patient."
    explanation: The later case report argues the cysteine explanation does not fit its own patient, whose crises began at two years and recurred, which a newborn-period substrate limitation cannot explain.
  proposed_experiments:
  - experiment_id: coxpd19_cysteine_dose_response
    name: Cysteine dose-response of cluster assembly in patient-genotype cells
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In LYRM4-knockout human cells re-expressing R68L, Y31C or wild-type ISD11, titrate
      extracellular cysteine and N-acetylcysteine across the physiological newborn and
      adult range and measure NFS1 level, radiolabelled iron incorporation into SDHB and
      aconitase, and complex I and II activity, in parallel with a galactose-forced
      respiration readout.
    would_support:
    - pathophysiology#Reduced NFS1 Cysteine Desulfurase Activity
    supporting_outcome:
    - Cluster assembly and complex activity in variant-expressing cells rise with cysteine across the newborn-to-adult range while wild-type cells are already saturated
    refuting_outcome:
    - Variant cells are saturated at newborn cysteine levels, which would mean the clinical difference between the cousins has another cause and would remove the rationale for a sulfur donor
- discussion_id: coxpd19_complex_iv_deficiency
  prompt: >-
    Why is complex IV, which contains no iron-sulfur cluster, deficient in the muscle of
    two of the three patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Respiratory Chain Complex I, II and III Deficiency
  - phenotypes#Decreased activity of mitochondrial complex IV
  rationale: >-
    Complex IV has copper and heme centres and no Fe-S cluster, so its deficiency cannot
    be read directly off the assembly defect. Three routes are plausible and none has
    been tested in this disease: loss of complex III destabilizing the III-IV
    supercomplex; the ferrochelatase deficiency limiting heme a availability; and
    general mitochondrial damage from the iron and reactive-oxygen accumulation the
    cellular model shows. Yeast work on a late assembly factor reports a role in
    III/IV supercomplexes, which is suggestive but a different gene and organism. The
    answer decides whether complex IV deficiency should be read as part of this
    disease's core biochemistry or as a secondary marker of tissue damage.
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complex IV was also deficient in her skeletal muscle."
    explanation: Records the complex IV deficiency that the Fe-S mechanism does not directly explain.
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several other Fe-S proteins were also affected in both patients, including the aconitases and ferrochelatase."
    explanation: Supplies the ferrochelatase route, since loss of the last enzyme of heme synthesis could limit heme a.
  proposed_experiments:
  - experiment_id: coxpd19_supercomplex_heme_split
    name: Supercomplex and heme-a rescue in patient-genotype myotubes
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In variant-expressing myotubes, resolve respiratory supercomplexes by native
      electrophoresis, quantify heme a and heme b by mass spectrometry, and ask whether
      complex IV activity is restored by supplying heme precursors (5-aminolevulinic acid)
      or by an antioxidant, while complex I and II stay deficient.
    would_support:
    - pathophysiology#Ferrochelatase Deficiency
    supporting_outcome:
    - Heme a is low and complex IV activity is restored by heme precursor supply without correcting complex I or II, which would place complex IV downstream of the ferrochelatase defect
    refuting_outcome:
    - Normal heme a with loss of the III-IV supercomplex and no response to heme precursors, which would make complex IV deficiency a structural consequence of complex III loss
- discussion_id: coxpd19_tissue_sparing_of_fibroblasts
  prompt: >-
    Why are cultured fibroblasts largely spared when muscle and liver are severely
    deficient, and what does that mean for diagnosis?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Respiratory Chain Complex I, II and III Deficiency
  rationale: >-
    The founding report found fibroblast respiratory chain activities largely normal
    while the same patient's muscle and liver were severely deficient, so a normal
    fibroblast study does not exclude this diagnosis. Two explanations compete: a real
    tissue difference in demand for Fe-S flux, with oxidative tissues having the lower
    reserve, or an artefact of culture in high glucose, where glycolysis makes
    respiratory capacity dispensable and a defect need not show. The second is testable
    by forcing oxidative metabolism in galactose, and distinguishing them matters for
    which tissue a diagnostic laboratory should assay.
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a patient with deficiency of complexes I, II and III in muscle and liver"
    explanation: The deficiency is reported for muscle and liver, the tissues the paper assayed as abnormal; the fibroblast sparing is stated in the paper's full text rather than its abstract.
  notes: >-
    The fibroblast enzyme values and the MyoD myotube experiment are reported in the
    full text of PMID:23814038, which is cached as an abstract only, so the quantitative
    claim is recorded here as the open question rather than as evidence.

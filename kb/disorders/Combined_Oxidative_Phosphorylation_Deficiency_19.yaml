- name: Reduced NFS1 Cysteine Desulfurase Activity
  description: >
    NFS1 releases sulfur from L-cysteine as a persulfide for cluster assembly on ISCU.
    With R68L ISD11 this activity is barely detectable in vitro.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cysteine desulfurase activity

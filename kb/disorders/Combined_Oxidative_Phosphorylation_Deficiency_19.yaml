    term:
      id: GO:0030234
      label: enzyme regulator activity
  evidence:
  - reference: PMID:19454487
    reference_title: "Human ISD11 is essential for both iron-sulfur cluster assembly and maintenance of normal cellular iron homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have cloned and characterized human ISD11 and shown that human ISD11 forms a stable complex in vivo with the human cysteine desulfurase (ISCS)"
    explanation: ISD11 binds the cysteine desulfurase NFS1 (ISCS) in human cells.
  - reference: PMID:29097656
    reference_title: "Structure and functional dynamics of the mitochondrial Fe/S cluster synthesis complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We assign specific regulatory rather than catalytic roles to ISD11-ACP"
    explanation: Structural work places ISD11 in a regulatory role on NFS1.
  downstream:
  - target: NFS1 Destabilization and Aggregation

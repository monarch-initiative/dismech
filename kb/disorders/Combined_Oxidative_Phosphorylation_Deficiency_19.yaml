    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our in vitro studies showed that the l-cysteine desulfurase activity of NFS1 was barely present when co-expressed with mutant ISD11."
    explanation: Desulfurase activity collapses with the patient ISD11 variant.
  downstream:
  - target: Impaired Early-Step Mitochondrial Iron-Sulfur Cluster Assembly
    causal_link_type: DIRECT
- name: Impaired Early-Step Mitochondrial Iron-Sulfur Cluster Assembly
  description: >
    Reduced sulfur supply blocks de novo cluster synthesis on the ISCU scaffold. Because
    this is the first step of the ISC pathway, all downstream mitochondrial and
    cytosolic Fe-S proteins are at risk, unlike the late-acting MMDS factors that affect
    only [4Fe-4S] clients.
  biological_scale: MOLECULAR
  biological_processes:

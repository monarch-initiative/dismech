name: Combined Oxidative Phosphorylation Deficiency 19
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- COXPD19
- LYRM4 deficiency
- ISD11 deficiency
description: >
  Combined oxidative phosphorylation deficiency 19 (COXPD19) is an ultra-rare autosomal
  recessive mitochondrial disease caused by biallelic missense variants in LYRM4, which
  encodes ISD11, the small LYR-motif subunit that binds and stabilizes the cysteine
  desulfurase NFS1 in the core mitochondrial iron-sulfur cluster (ISC) assembly complex.
  Weakened ISD11-NFS1 binding destabilizes NFS1, cutting the sulfur supply for de novo
  cluster assembly, so the defect sits at the earliest step of the ISC pathway and
  reaches a broad range of Fe-S client proteins. Patients show combined deficiency of
  respiratory chain complexes I, II and III in muscle and liver, with loss of the
  aconitases and ferrochelatase, and present in the newborn period or early childhood
  with lactic acidosis and respiratory failure. Three patients in two families are
  reported, and the course ranges from death as a neonate to full recovery between
  infection-triggered crises.
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 19
  term:
    id: MONDO:0014269
    label: combined oxidative phosphorylation deficiency 19
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial iron-sulfur cluster assembly disorder
notes: >-
  No GeneReviews chapter covers LYRM4 (PubMed search `LYRM4[TIAB] AND genereviews[book]
  NOT retired[TI]` returned 0 on 2026-11-19); the phenotype baseline comes from the two
  case reports. PMID:31497476 is cached as full text and is used as such; PMID:23814038 is
  cached as an abstract only, so findings that appear solely in its full text (stridor,
  hepatic steatosis, the per-tissue enzyme percentages, the fibroblast values) are not
  curated here as evidence-backed phenotypes. Where PMID:31497476 restates the founding
  patients' findings in its own introduction and discussion, those items are graded
  HUMAN_CLINICAL with `quote_role: BACKGROUND`, because the quoted sentence is not that
  paper's own result. Phenotype frequencies are omitted because three patients are
  reported.
  ClinGen has no gene-disease validity record for LYRM4. The p.Tyr31Cys allele is
  called probably pathogenic in its case report and has had no functional assay.

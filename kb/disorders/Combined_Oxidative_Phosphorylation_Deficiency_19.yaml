- name: IRP1 Activation and Cellular Iron Dysregulation
  description: >
    Apo-cytosolic aconitase binds iron-responsive elements as IRP1, IRP2 rises, and cells
    misread their iron status. Ferric iron accumulates in punctate deposits, and the
    R68L variant raises mitochondrial iron and reactive oxygen species.
  biological_scale: CELLULAR

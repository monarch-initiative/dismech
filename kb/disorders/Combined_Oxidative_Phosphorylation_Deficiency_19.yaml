    snippet: "She was asymptomatic between crisis with regular growth and normal development."
    explanation: Full recovery between episodes.
pathophysiology:
- name: Homozygous LYRM4 Missense Variant
  description: >
    Homozygous germline missense variants in LYRM4, p.Arg68Leu (c.203G>T) in the
    founding family and p.Tyr31Cys (c.92A>G) in the second family. Arg68 sits in the
    third helix of ISD11, which contacts NFS1. No truncating patient allele is known,
    consistent with ISD11 being essential.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: LYRM4 (ISD11)
    term:
      id: hgnc:21365
      label: LYRM4
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous mutation (c.203G>T, p.R68L) was identified via massively parallel sequencing of >1000 mitochondrial genes (MitoExome sequencing)"
    explanation: Identifies the founding homozygous variant.
  - reference: PMID:16341090
    reference_title: "The Nfs1 interacting protein Isd11 has an essential role in Fe/S cluster biogenesis in mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified a novel essential protein of the mitochondrial matrix, which is highly conserved from yeast to human and which we termed Isd11"
    explanation: Isd11 is essential in yeast, so only hypomorphic human alleles are expected to be compatible with life.
  downstream:

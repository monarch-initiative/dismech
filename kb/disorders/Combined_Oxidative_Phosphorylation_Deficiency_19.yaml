    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings are consistent with a defect in the early step of ISC assembly affecting a broad variety of Fe-S proteins."
    explanation: The authors place the defect at the earliest ISC step.
  downstream:
  - target: Failure to Mature Fe-S Client Proteins
    causal_link_type: DIRECT
- name: Failure to Mature Fe-S Client Proteins
  description: >
    Client apoproteins do not receive their clusters, so several Fe-S proteins are lost
    together in patient tissue: subunits of complexes I, II and III, mitochondrial and
    cytosolic aconitase, and ferrochelatase. This is the convergence point of the
    disease mechanism.
  biological_scale: MOLECULAR
  role: central_effector
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several other Fe-S proteins were also affected in both patients, including the aconitases and ferrochelatase."
    explanation: Multiple Fe-S proteins are deficient in patient tissue.
  downstream:
  - target: Respiratory Chain Complex I, II and III Deficiency
    causal_link_type: DIRECT
  - target: Aconitase Inactivation
    causal_link_type: DIRECT
  - target: Ferrochelatase Deficiency
    causal_link_type: DIRECT
- name: Respiratory Chain Complex I, II and III Deficiency
  description: >
    Complexes I, II and III each contain Fe-S clusters and are deficient in patient
    muscle and liver. Complex IV, which has no Fe-S cluster, was also low in the muscle

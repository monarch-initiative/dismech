    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of Isd11, Nfs1 is prone to aggregation."
    explanation: Yeast Nfs1 aggregates without Isd11.
  - reference: PMID:26342079
    reference_title: "Mapping Key Residues of ISD11 Critical for NFS1-ISD11 Subcomplex Stability: IMPLICATIONS IN THE DEVELOPMENT OF MITOCHONDRIAL DISORDER, COXPD19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Due to altered interaction with ISD11 mutants, the levels of NFS1 and Isu1 were significantly depleted"
    explanation: NFS1 and the scaffold are depleted when ISD11 is mutant.

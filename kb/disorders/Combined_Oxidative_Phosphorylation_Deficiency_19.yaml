- name: Glycolytic Shift and Lactate Accumulation
  description: >
    With oxidative phosphorylation blocked, pyruvate is reduced to lactate. Lactate rises
    in blood, and in the third patient only during crises.
  biological_scale: ORGANISM
  biological_processes:

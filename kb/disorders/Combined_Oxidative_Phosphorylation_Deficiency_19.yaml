      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mutation of these conserved ISD11 residues into alanine leads to its compromised interaction with NFS1, resulting in reduced stability and enhanced aggregation of NFS1 in the mitochondria"
      explanation: Weakened binding makes NFS1 unstable and aggregation-prone.
- name: NFS1 Destabilization and Aggregation
  description: >
    Without a stable ISD11 partner, NFS1 aggregates in the mitochondrial matrix and its
    level falls, as does the level of the scaffold ISCU (Isu1 in yeast).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NFS1
    term:
      id: hgnc:15910

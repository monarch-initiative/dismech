    snippet: "the R68L ISD11 mutant displayed accumulation of mitochondrial iron and reactive oxygen species"
    explanation: The patient variant causes mitochondrial iron and ROS accumulation.
- name: Ferrochelatase Deficiency
  description: >
    Ferrochelatase, the [2Fe-2S] enzyme that inserts iron into protoporphyrin IX in the
    last step of heme synthesis, is deficient in patient tissue. No anemia or
    porphyrin phenotype is described in the reported patients.
  biological_scale: MOLECULAR

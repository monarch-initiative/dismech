    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During acute events of illness, she had hyperlactacidemia (maximum lactate 5.2 mmol/L)"
    explanation: Lactate rises during crises.
  downstream:
  - target: Increased circulating lactate concentration
- name: Energy Failure Under Catabolic Stress
  description: >
    The residual oxidative capacity is enough between crises but fails under the
    demand of an intercurrent infection, producing lethargy, ketosis and
    cardiorespiratory arrest. The link from complex deficiency to the arrest is inferred
    from the biochemistry and the clinical timing.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31497476

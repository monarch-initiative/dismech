progression:
- phase: Neonatal onset
  age_range: Neonatal
  notes: >-
    Both patients of the founding family presented as newborns; one cousin died as a
    neonate and the other survived.
  evidence:
  - reference: PMID:23814038
    reference_title: "Mutations in LYRM4, encoding iron-sulfur cluster biogenesis factor ISD11, cause deficiency of multiple respiratory chain complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing identified the same mutation in his similarly affected cousin, who had a more severe phenotype and died while a neonate."
    explanation: Neonatal death in the more severe cousin.
- phase: Episodic childhood crises with recovery
  age_range: Early childhood
  notes: >-
    The third patient had cardiorespiratory arrests at 2 and 3 years after viral
    respiratory illnesses and was well between crises, with normal growth and development.
  evidence:
  - reference: PMID:31497476
    reference_title: "Iron-sulfur cluster ISD11 deficiency (LYRM4 gene) presenting as cardiorespiratory arrest and 3-methylglutaconic aciduria."

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two loss-of-function ADAMTS2 alleles are required, either in homozygous form
    or as compound heterozygotes. Heterozygous carriers are unaffected - roughly
    half-normal N-proteinase activity is sufficient to process procollagen, which
    is why this disease has no dominant counterpart in the way that several other
    EDS subtypes do.
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Ehlers-Danlos syndrome (EDS), dermatosparaxis type, is a recessively inherited connective
      tissue disorder caused by deficient activity of ADAMTS-2
    explanation: States the recessive inheritance and the enzymatic basis together.
pathophysiology:
- name: Biallelic ADAMTS2 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both ADAMTS2 alleles carry variants that abolish procollagen I N-proteinase
    activity. The reported alleles are overwhelmingly truncating - nonsense,
    frameshift and splice variants distributed across the gene rather than
    clustered in one domain - which is consistent with the mechanism being simple
    loss of the enzyme rather than any position-specific effect on how it behaves.
    Five of the first six patients identified were homozygous for the same
    nonsense allele, Q225X.
  genetic_context:
    gene:
      preferred_term: ADAMTS2
      term:
        id: hgnc:218
        label: ADAMTS2
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: procollagen I N-proteinase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Failure of Procollagen N-Propeptide Excision
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10417273
    reference_title: Human Ehlers-Danlos syndrome type VII C and bovine dermatosparaxis are caused by mutations
      in the procollagen I N-proteinase gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data provide direct evidence that EDS type VIIC and dermatosparaxis result from mutations
      in the pNPI gene.
    explanation: The study that established the gene-disease relationship, in humans and in the bovine
      disease simultaneously.
  - reference: PMID:10417273
    reference_title: Human Ehlers-Danlos syndrome type VII C and bovine dermatosparaxis are caused by mutations
      in the procollagen I N-proteinase gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five of the individuals with EDS type VIIC were homozygous for a C-->T transition that results
      in a premature termination codon, Q225X.
    explanation: Documents the truncating character of the founding alleles.
- name: Failure of Procollagen N-Propeptide Excision
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    ADAMTS2 normally cleaves the aminoterminal propeptide from types I, II and
    III procollagen. Without it the N-propeptide is retained and the secreted
    molecule remains pN-collagen. This is a processing defect, not a synthesis
    defect: the amount of collagen protein reaching the matrix is not reduced,
    only its maturation state. ADAMTS3 and ADAMTS14 are homologous N-proteinases
    but do not compensate in skin, which is why the phenotype is dermatological
    even though the substrate is ubiquitous.
  biological_processes:
  - preferred_term: protein processing
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016485
      label: protein processing
  - preferred_term: collagen biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  downstream:
  - target: Hieroglyphic Collagen Fibril Assembly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: an enzyme that cleaves the aminoterminal propeptide domain of types I, II, and III procollagen
    explanation: Names the substrate specificity of the missing enzymatic step.
  - reference: PMID:25863161
    reference_title: The procollagen N-proteinases ADAMTS2, 3 and 14 in pathophysiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the amino-propeptide is usually processed by procollagen N-proteinases: ADAMTS2, 3 and 14"
    explanation: Establishes that ADAMTS2 belongs to a three-member family, which is what makes the absence
      of compensation in skin a substantive observation rather than an assumption.
  - reference: PMID:29649548
    reference_title: Spontaneous atopic dermatitis due to immune dysregulation in mice lacking Adamts2
      and 14.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: They are healthy, fertile and display normal aminoprocollagen processing.
    explanation: Adamts14-deficient mice process aminoprocollagen normally, which is the direct evidence
      that the paralogue does not carry this function on its own.
- name: Hieroglyphic Collagen Fibril Assembly
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Retained N-propeptides end up on the surface of the assembling fibril, in the
    overlap zone of the D-period. Being there, they prevent the fibril from
    achieving a circular cross-section, and the fibril grows as a flattened,
    branching ribbon - "hieroglyphic" in transverse section, and in the most
    severely affected skin appearing as sheets rather than discrete fibrils. The
    dermatosparactic calf, in which this was quantified, carried 57% pN-collagen
    in its dermal fibrils. Notably the propeptides on such fibrils can no longer
    be removed even by exogenous N-proteinase, so the lesion is self-locking once
    assembly has occurred.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Loss of Dermal Tensile Strength
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9571043
    reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are
      not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the collagen fibrils in the skin of a dermatosparactic calf contained 57% type I pNcollagen
      and 43% type I collagen and the fibrils were irregularly arranged in bundles and hieroglyphic in
      cross-section
    explanation: The quantitative measurement of pN-collagen content alongside the fibril morphology it
      produces.
  - reference: PMID:9571043
    reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are
      not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Image analysis of the fibril cross-sections suggested that the deviation from circularity
      of dermatosparactic fibrils was caused by N-propeptides of pNcollagen being located at the fibril
      surface.
    explanation: Attributes the abnormal fibril geometry specifically to the surface location of the retained
      propeptides.
  - reference: PMID:1403389
    reference_title: 'Initial observations of human dermatosparaxis: Ehlers-Danlos syndrome type VIIC.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electron microscopic examination of the skin shows collagen sheets rather than fibrils, and
      characteristic distortions resembling hieroglyphs.
    explanation: Confirms the same fibril pathology in human skin, and is the source of the descriptive
      term used throughout the literature.
- name: Loss of Dermal Tensile Strength
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The tensile strength of dermis depends on near-cylindrical fibrils packing
    closely enough to interact along their length. Ribbon-shaped fibrils cannot
    do that, so load is no longer distributed between fibrils and the tissue
    tears at low force. This is the step at which a molecular processing defect
    becomes a mechanical one, and it explains why the skin is simultaneously
    fragile and redundant - the same loss of fibril-fibril engagement that lets
    it tear also lets it stretch and hang.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Generalised Connective Tissue Fragility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9571043
    reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are
      not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the normal mechanical properties of skin are strongly dependent on the close association of
      near-cylindrical fibrils, thereby enabling maximal fibril-fibril interactions
    explanation: States the mechanical principle that the abnormal fibril shape violates.
  - reference: PMID:9571043
    reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are
      not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Partial loss of enzyme activity results in accumulation of pNcollagen (collagen with N-propeptides)
      and abnormal collagen fibrils in the fragile skin.
    explanation: Links the accumulated pN-collagen directly to the fragility of the skin.
- name: Generalised Connective Tissue Fragility
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Type I collagen is not confined to skin, so the processing defect is
    expressed wherever fibrillar collagen carries load. Clinically this appears
    as umbilical and inguinal herniation, joint laxity, craniofacial features
    reflecting a soft cranial vault with wide sutures and large fontanelles, and
    - in the more severely affected - visceral and vascular fragility including
    bladder and diaphragmatic rupture. The severity of this systemic component is
    what the 2016 expansion of the phenotype turned on: three of five newly
    reported patients were substantially milder than every previously published
    case, so the multisystem burden is variable rather than obligate.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: extreme skin fragility and laxity, excessive bruising, and sometimes major complications due
      to visceral and vascular fragility
    explanation: Establishes that the fragility extends beyond skin to viscera and vessels in some patients.
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three of these displayed a phenotype that was strikingly milder than that of previously reported
      patients.
    explanation: The observation behind treating the systemic burden as variable rather than uniform.

diagnosis:
- name: Skin Biopsy with Transmission Electron Microscopy
  description: 'Ultrastructural examination of dermal collagen shows the hieroglyphic fibril profiles, or in
    severe cases collagen sheets in place of discrete fibrils. This is unusually informative for an EDS subtype:
    most others have non-specific or normal ultrastructure, whereas here the fibril morphology is close to
    pathognomonic and follows directly from the biochemical lesion.'
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:1403389
    reference_title: 'Initial observations of human dermatosparaxis: Ehlers-Danlos syndrome type VIIC.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electron microscopic examination of the skin shows collagen sheets rather than fibrils, and characteristic
      distortions resembling hieroglyphs.
    explanation: Describes the ultrastructural finding the test looks for.
- name: ADAMTS2 Molecular Testing
  description: Sequencing of ADAMTS2 to identify biallelic variants, which confirms the diagnosis and enables
    carrier testing in the family.
  diagnosis_term:

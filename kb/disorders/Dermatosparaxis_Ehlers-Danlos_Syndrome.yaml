    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: an enzyme that cleaves the aminoterminal propeptide domain of types I, II, and III procollagen
    explanation: Names the substrate specificity of the missing enzymatic step.
  - reference: PMID:25863161
    reference_title: The procollagen N-proteinases ADAMTS2, 3 and 14 in pathophysiology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'the amino-propeptide is usually processed by procollagen N-proteinases: ADAMTS2, 3 and 14'
    explanation: 'Establishes that ADAMTS2 belongs to a three-member family, which is what makes the absence
      of compensation in skin a substantive observation rather than an assumption. Graded OTHER rather than
      IN_VITRO: the publication is a review and this sentence is its background statement, not an experiment
      it reports.'
  - reference: PMID:29649548
    reference_title: Spontaneous atopic dermatitis due to immune dysregulation in mice lacking Adamts2 and
      14.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: They are healthy, fertile and display normal aminoprocollagen processing.
    explanation: Adamts14-deficient mice process aminoprocollagen normally, which is the direct evidence that
      the paralogue does not carry this function on its own.
  - reference: PMID:26446156
    reference_title: ADAMTS3 activity is mandatory for embryonic lymphangiogenesis and regulates placental
      angiogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Procollagens I, II and III processing was unaffected in these embryos.
    explanation: The ADAMTS3 half of the non-compensation claim. Adamts3-null embryos die of failed lymphangiogenesis
      with procollagen processing intact, so ADAMTS3's essential role is elsewhere and it does not cover for
      ADAMTS2 in this pathway.
- name: Hieroglyphic Collagen Fibril Assembly
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: Retained N-propeptides end up on the surface of the assembling fibril, in the overlap zone of
    the D-period. Being there, they prevent the fibril from achieving a circular cross-section, and the fibril
    grows as a flattened, branching ribbon - "hieroglyphic" in transverse section, and in the most severely
    affected skin appearing as sheets rather than discrete fibrils. The dermatosparactic calf, in which this
    was quantified, carried 57% pN-collagen in its dermal fibrils. Notably the propeptides on such fibrils
    can no longer be removed even by exogenous N-proteinase, so the lesion is self-locking once assembly has
    occurred.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: ABNORMAL
    term:
      id: GO:0030199
      label: collagen fibril organization
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization

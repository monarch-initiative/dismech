      label: Autosomal recessive inheritance
  description: Two loss-of-function ADAMTS2 alleles are required, either in homozygous form or as compound
    heterozygotes. Heterozygous carriers are unaffected - roughly half-normal N-proteinase activity is sufficient
    to process procollagen, which is why this disease has no dominant counterpart in the way that several other
    EDS subtypes do.
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis
      type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Ehlers-Danlos syndrome (EDS), dermatosparaxis type, is a recessively inherited connective
      tissue disorder caused by deficient activity of ADAMTS-2
    explanation: States the recessive inheritance and the enzymatic basis together.
pathophysiology:
- name: Biallelic ADAMTS2 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Both ADAMTS2 alleles carry variants that abolish procollagen I N-proteinase activity. The reported
    alleles are overwhelmingly truncating - nonsense, frameshift and splice variants distributed across the
    gene rather than clustered in one domain - which is consistent with the mechanism being simple loss of
    the enzyme rather than any position-specific effect on how it behaves. Five of the first six patients identified
    were homozygous for the same nonsense allele, Q225X.
  genetic_context:
    gene:
      preferred_term: ADAMTS2
      term:
        id: hgnc:218
        label: ADAMTS2
    functional_impact_category: LOSS_OF_FUNCTION

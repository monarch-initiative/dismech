notes: 'This entry is deliberately separate from the umbrella Ehlers-Danlos_Syndrome entry, which lists Dermatosparaxis
  EDS among its has_subtypes. That follows the repository''s existing practice, where Vascular, Hypermobile,
  Musculocontractural, Spondylodysplastic and Cardiac Valvular EDS all carry their own entries in addition
  to being listed as subtypes on the umbrella.

  Deep research. Curated with a single OpenScientist deep-research report (research/Dermatosparaxis_Ehlers-Danlos_Syndrome-deep-research-openscientist.md).
  Its reference validation reported 13/13 citations verified with no unsupported quotes. Its term validation
  reported needs_review for two obsolete GO terms (GO:0004251, and GO:0005615 replaced by GO:0005576) and a
  cosmetic CL:0000057 label variant; none of those CURIEs is bound in this entry. The report''s substantive
  contribution over the literature search was the Adamts2/Adamts14 double-knockout result, which is what turned
  "the paralogues presumably do not compensate" into a cited negative finding.


  Phenotype frequencies. The bands come from the counted findings table in PMID:26765342 across the 15 patients
  reported to 2016, and each phenotype description states its count. The table rows themselves are not used
  as evidence snippets: check_snippet_length rejects them, and its message gives the reason - an extracted
  table row is not propositional and its cells may not survive text extraction. Where a quotable prose sentence
  covers the feature it is cited instead; where none exists, the band rests on the table and the description
  says so. Two features counted in that table, atrophic scarring (5 of 15) and short limbs with short hands
  and feet (11 of 15), are recorded here rather than modelled as phenotypes, because the paper offers no prose
  sentence for either and an evidence item with no citable snippet would be worse than this note.'
progression:
- phase: Adulthood
  evidence:
  - reference: PMID:39641471
    reference_title: 'The Natural History of Dermatosparaxis Ehlers Danlos Syndrome: An Adult Case Series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Given the lack of information regarding adults with dEDS, our aim was to describe adults with
      dEDS to inform management recommendations in adulthood.
    explanation: Establishes that adult natural history was unknown before this series, which is why this record
      exists at all.
  - reference: PMID:39641471
    reference_title: 'The Natural History of Dermatosparaxis Ehlers Danlos Syndrome: An Adult Case Series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Discussion of management considerations includes thorough investigations of acute pain, careful
      consideration of skin closure techniques and manual handling, as well as monitoring for reduced bone
      mineral density after low-impact fracture and/or post-menopause.
    explanation: The adult management concerns, including the bone-density monitoring this record describes.
  notes: The molecular defect is static - the enzyme is absent from birth and the fibrils are laid down abnormally
    throughout - but the consequences accumulate. Adults reported at 22 to 42 years carry iatrogenic injury
    from earlier medical handling, redundant skin folds that have grown enough to warrant surgical resection,
    fractures, and in one case a gastric volvulus from a diaphragmatic hernia. Reduced bone mineral density
    becomes a monitoring concern after a low-impact fracture or the menopause. Until 2025 the oldest reported
    patient was 19, so the adult natural history is new information rather than established knowledge.
  age_range: 22-42 years

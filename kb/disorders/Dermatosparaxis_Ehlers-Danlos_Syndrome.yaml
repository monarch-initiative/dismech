notes: >-
  This entry is deliberately separate from the umbrella Ehlers-Danlos_Syndrome
  entry, which lists Dermatosparaxis EDS among its has_subtypes. That follows the
  repository's existing practice, where Vascular, Hypermobile, Musculocontractural,
  Spondylodysplastic and Cardiac Valvular EDS all carry their own entries in
  addition to being listed as subtypes on the umbrella.

  Deep research. Curated with a single OpenScientist deep-research report
  (research/Dermatosparaxis_Ehlers-Danlos_Syndrome-deep-research-openscientist.md).
  Its reference validation reported 13/13 citations verified with no unsupported
  quotes. Its term validation reported needs_review for two obsolete GO terms
  (GO:0004251, and GO:0005615 replaced by GO:0005576) and a cosmetic CL:0000057
  label variant; none of those CURIEs is bound in this entry. The report's
  substantive contribution over the literature search was the Adamts2/Adamts14
  double-knockout result, which is what turned "the paralogues presumably do not
  compensate" into a cited negative finding.


    explanation: Confirms the same fibril pathology in human skin, and is the source of the descriptive term
      used throughout the literature.
- name: Loss of Dermal Tensile Strength
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: The tensile strength of dermis depends on near-cylindrical fibrils packing closely enough to
    interact along their length. Ribbon-shaped fibrils cannot do that, so load is no longer distributed between
    fibrils and the tissue tears at low force. This is the step at which a molecular processing defect becomes
    a mechanical one, and it explains why the skin is simultaneously fragile and redundant - the same loss
    of fibril-fibril engagement that lets it tear also lets it stretch and hang.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:

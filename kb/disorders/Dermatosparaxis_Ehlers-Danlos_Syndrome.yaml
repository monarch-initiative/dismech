diagnosis:
- name: Skin Biopsy with Transmission Electron Microscopy
  description: >-
    Ultrastructural examination of dermal collagen shows the hieroglyphic fibril
    profiles, or in severe cases collagen sheets in place of discrete fibrils.
    This is unusually informative for an EDS subtype: most others have
    non-specific or normal ultrastructure, whereas here the fibril morphology is
    close to pathognomonic and follows directly from the biochemical lesion.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:1403389
    reference_title: 'Initial observations of human dermatosparaxis: Ehlers-Danlos syndrome type VIIC.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electron microscopic examination of the skin shows collagen sheets rather than fibrils, and
      characteristic distortions resembling hieroglyphs.
    explanation: Describes the ultrastructural finding the test looks for.
- name: ADAMTS2 Molecular Testing
  description: >-
    Sequencing of ADAMTS2 to identify biallelic variants, which confirms the
    diagnosis and enables carrier testing in the family.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mutation (c.2T>C, p.? and c.884_887delTGAA, p.(Met295Thrfs26*)) in ADAMTS2 in five patients
      from four unrelated families
    explanation: Demonstrates molecular confirmation by ADAMTS2 sequencing in a clinical series.
treatments:
- name: Skin Protection and Wound Care
  therapeutic_modality: BEHAVIORAL
  description: >-
    No therapy addresses the enzymatic defect. Management is protective -
    avoiding trauma, padding, careful wound closure, and caution with adhesive
    dressings, which can themselves tear the skin. This entry records no
    disease-modifying treatment because none was found in the literature
    reviewed, not because the search was cut short: the published literature is a
    few dozen patients and reports no intervention study.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Loss of Dermal Tensile Strength
    treatment_effect: MODULATES
    description: >-
      Reduces the mechanical load the weakened dermis has to bear. It does not
      alter fibril structure.
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: sometimes major complications due to visceral and vascular fragility
    explanation: PARTIAL because it establishes what has to be guarded against, not that any particular
      protective measure has been shown to work. No reviewed source reports a treatment outcome in this
      disease.
- name: Genetic Counselling
  therapeutic_modality: OTHER
  description: >-
    Autosomal recessive recurrence counselling for the parents, with a 25%
    recurrence risk in each pregnancy, and carrier testing once the familial
    ADAMTS2 alleles are known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Ehlers-Danlos syndrome (EDS), dermatosparaxis type, is a recessively inherited connective
      tissue disorder
    explanation: The recessive inheritance that determines the recurrence risk being counselled.
animal_models:
- name: Dermatosparactic calf
  species: Cattle
  genotype: ADAMTS2 17-bp deletion, homozygous
  publication: PMID:10417273
  description: >-
    Bovine dermatosparaxis is the disease in which the enzymatic defect was first
    characterised, decades before the human condition was recognised. It is a
    naturally occurring homologue rather than an engineered model, and the
    causative allele was identified in the same study that solved the human
    disease.
  modeled_mechanisms:
  - target: Hieroglyphic Collagen Fibril Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The calf reproduces the human fibril pathology and is the system in which
      it was quantified - dermal fibrils containing 57% pN-collagen, irregularly
      bundled and hieroglyphic in cross-section.
    limitations: >-
      The bovine allele is a 17-bp deletion causing a reading-frame shift, so it
      models complete loss of function specifically. It says nothing about the
      milder human phenotypes reported in 2016, whose molecular basis is not a
      different class of allele but is not fully explained either.
    readouts:
    - name: pN-collagen content of dermal fibrils
      target: Hieroglyphic Collagen Fibril Assembly
      direction: INCREASED
      interpretation: Direct measurement of the unprocessed substrate accumulating in the matrix.
      evidence:

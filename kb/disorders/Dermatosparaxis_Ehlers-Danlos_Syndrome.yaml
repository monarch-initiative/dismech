name: Dermatosparaxis Ehlers-Danlos Syndrome
creation_date: '2026-08-28T21:45:00Z'
category: Mendelian
description: 'Type I procollagen is secreted with propeptides at both ends, and both must be removed before
  the molecule can pack into a normal fibril. ADAMTS2 is the enzyme that removes the N-terminal one. Dermatosparaxis
  Ehlers-Danlos syndrome is what happens when biallelic ADAMTS2 variants abolish that activity: the N-propeptide
  is never excised, and the cell secretes pN-collagen into the dermis instead of collagen.

  The consequence is structural rather than quantitative. There is no shortage of collagen. The retained N-propeptides
  sit on the outside of the growing fibril, and because they are bulky and charged they prevent the fibril
  from closing into a cylinder. What assembles instead is a flattened, branching ribbon that is irregular in
  cross-section - the "hieroglyphic" appearance that is the diagnostic electron-microscopic finding, and the
  reason a skin biopsy is informative here in a way it is not for most EDS subtypes. Fibrils shaped like that
  cannot interdigitate, so the dermis loses the fibril-fibril interaction that carries tensile load.

  This is what separates dermatosparaxis from the rest of the EDS family. The classical subtypes alter a collagen
  chain or a collagen-modifying enzyme and produce a spectrum of laxity and fragility; here a single processing
  step fails completely, and the skin becomes fragile enough to tear and redundant enough to hang in folds
  from birth. It is also the one EDS subtype with a long-standing veterinary counterpart - dermatosparaxis
  was described in cattle and other domestic species decades before the human disease was recognised, and the
  bovine disease was what identified the enzyme.'

      fibrils, thereby enabling maximal fibril-fibril interactions
    explanation: States the mechanical principle that the abnormal fibril shape violates.
  - reference: PMID:9571043
    reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are not
      cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Partial loss of enzyme activity results in accumulation of pNcollagen (collagen with N-propeptides)
      and abnormal collagen fibrils in the fragile skin.
    explanation: Links the accumulated pN-collagen directly to the fragility of the skin.
- name: Generalised Connective Tissue Fragility
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: 'Type I collagen is not confined to skin, so the processing defect is expressed wherever fibrillar
    collagen carries load. Clinically this appears as umbilical and inguinal herniation, joint laxity, craniofacial
    features reflecting a soft cranial vault with wide sutures and large fontanelles, and - in the more severely
    affected - visceral and vascular fragility including bladder and diaphragmatic rupture. The severity of
    this systemic component is what the 2016 expansion of the phenotype turned on: three of five newly reported
    patients were substantially milder than every previously published case, so the multisystem burden is variable
    rather than obligate.'
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis
      type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: extreme skin fragility and laxity, excessive bruising, and sometimes major complications due to
      visceral and vascular fragility
    explanation: Establishes that the fragility extends beyond skin to viscera and vessels in some patients.
  - reference: PMID:26765342
    reference_title: Expanding the clinical and mutational spectrum of the Ehlers-Danlos syndrome, dermatosparaxis
      type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three of these displayed a phenotype that was strikingly milder than that of previously reported
      patients.
    explanation: The observation behind treating the systemic burden as variable rather than uniform.

animal_models:
- name: Dermatosparactic calf
  species: Cattle
  genotype: ADAMTS2 17-bp deletion, homozygous
  publication: PMID:10417273
  description: Bovine dermatosparaxis is the disease in which the enzymatic defect was first characterised,
    decades before the human condition was recognised. It is a naturally occurring homologue rather than an
    engineered model, and the causative allele was identified in the same study that solved the human disease.
  modeled_mechanisms:
  - target: Hieroglyphic Collagen Fibril Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The calf reproduces the human fibril pathology and is the system in which it was quantified
      - dermal fibrils containing 57% pN-collagen, irregularly bundled and hieroglyphic in cross-section.
    limitations: The bovine allele is a 17-bp deletion causing a reading-frame shift, so it models complete
      loss of function specifically. It says nothing about the milder human phenotypes reported in 2016, whose
      molecular basis is not a different class of allele but is not fully explained either.
    readouts:
    - name: pN-collagen content of dermal fibrils
      target: Hieroglyphic Collagen Fibril Assembly
      direction: INCREASED
      interpretation: Direct measurement of the unprocessed substrate accumulating in the matrix.
      evidence:
      - reference: PMID:9571043
        reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils are
          not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril surface.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: the collagen fibrils in the skin of a dermatosparactic calf contained 57% type I pNcollagen
          and 43% type I collagen
        explanation: The quantitative pN-collagen measurement in the bovine dermis.
    evidence:
    - reference: PMID:10417273
      reference_title: Human Ehlers-Danlos syndrome type VII C and bovine dermatosparaxis are caused by mutations
        in the procollagen I N-proteinase gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In the dermatosparactic calf, the mutation is a 17-bp deletion that changes the reading frame
        of the message.
      explanation: Establishes that the bovine disease has the same genetic basis, which is what makes it informative
        for the human mechanism.
- name: Adamts2/Adamts14 double-deficient mouse
  species: Mouse
  genotype: Adamts2 and Adamts14 double-deficient
  publication: PMID:29649548
  description: 'Built to ask whether the closest paralogue of ADAMTS2 compensates for it. The answer is that
    it does not: Adamts14-deficient mice are healthy with normal aminoprocollagen processing, and removing
    both enzymes produces no worse procollagen processing and no worse fibril pathology than removing ADAMTS2
    alone. That negative result is what licenses this entry to describe ADAMTS2 as the non-redundant dermal
    N-proteinase rather than merely the principal one.'
  modeled_mechanisms:
  - target: Failure of Procollagen N-Propeptide Excision
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Reproduces the processing defect and the fibril alterations, and adds the paralogue test that
      human genetics cannot supply.
    limitations: The double-knockout develops a spontaneous atopic-dermatitis-like phenotype from about two
      months of age, driven by abnormal Th1 T-lymphocyte activation. That is not a reported feature of human
      dermatosparaxis EDS, so any skin finding in aged animals of this genotype has to be read against an immune
      phenotype the human disease does not have.
    readouts:
    - name: Aminoprocollagen processing
      target: Failure of Procollagen N-Propeptide Excision
      direction: UNCHANGED
      interpretation: Unchanged relative to Adamts2-single-deficient animals - a real negative result, and
        the point of the experiment.
      evidence:
      - reference: PMID:29649548
        reference_title: Spontaneous atopic dermatitis due to immune dysregulation in mice lacking Adamts2
          and 14.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: showed the same phenotype as that of Adamts2-deficient mice, with no further reduction of
          procollagen processing and no significant aggravation of the structural alterations of collagen fibrils
        explanation: The measurement establishing that removing ADAMTS14 as well adds nothing.
    evidence:
    - reference: PMID:29649548
      reference_title: Spontaneous atopic dermatitis due to immune dysregulation in mice lacking Adamts2 and
        14.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: They were further crossed with Adamts2-deficient mice to evaluate potential functional redundancies
        between these two highly related enzymes.
      explanation: States the purpose of the model, which is what makes it informative for this node.
discussions:
- discussion_id: deds_mild_phenotype_molecular_basis_unexplained
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Generalised Connective Tissue Fragility
  - genetic#ADAMTS2
  prompt: Why do some patients with biallelic loss-of-function ADAMTS2 alleles have a strikingly milder phenotype
    than others?
  rationale: 'The 2016 series reported that three of five new patients were much milder than any previously
    published case, and it did so while identifying alleles that are, on their face, of the same class as the
    severe ones - homozygous frameshift and splice variants. If the mechanism is simple loss of enzyme, and
    the alleles are all null, the severity range has no obvious explanation within the gene.

    Several possibilities are open and none has been tested. Residual ADAMTS2 activity from leaky splicing
    or from an alternative transcript would predict a genotype-severity relationship that has not been looked
    for. Compensation by ADAMTS3 or ADAMTS14, whose contribution to skin has been assumed rather than measured,
    would predict variation driven outside the ADAMTS2 locus. Ascertainment is the third and most deflating
    candidate: the severe phenotype was defined from the first ten patients, so a milder tail may always have
    existed and simply never reached a specialist.

    Distinguishing these matters clinically, because the 2016 authors proposed revised diagnostic criteria
    on the strength of the milder cases, and how those criteria should be applied depends on whether mild disease
    is a distinct biological state or the bottom of one distribution.'
  proposed_experiments:
  - experiment_id: deds_residual_adamts2_activity_vs_severity
    name: Quantify residual N-proteinase activity against reported allele severity
    description: Measure procollagen I N-propeptide processing in dermal fibroblasts from patients across the
      reported severity range, and relate residual activity to phenotype score. A correlation would support
      leaky alleles; its absence would move the explanation outside the locus.
    would_support:
    - pathophysiology#Biallelic ADAMTS2 Loss of Function
    supporting_outcome:
    - Measurable residual N-propeptide cleavage in fibroblasts from mildly affected patients and none in severely
      affected patients.
    refuting_outcome:
    - Uniformly absent N-propeptide cleavage across the severity range, which would place the modifier outside
      ADAMTS2.

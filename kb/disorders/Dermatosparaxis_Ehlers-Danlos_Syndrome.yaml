      four unrelated families
    explanation: Demonstrates molecular confirmation by ADAMTS2 sequencing in a clinical series.
treatments:
- name: Skin Protection and Wound Care
  therapeutic_modality: BEHAVIORAL
  description: 'No therapy addresses the enzymatic defect, and that is a documented position rather than an
    absence of searching: the EDS care-pathway review states there is no specific treatment for non-vascular
    EDS and that management is symptomatic, multidisciplinary and personalised. In practice that means avoiding
    trauma, careful consideration of skin closure techniques and manual handling, thorough investigation of
    acute pain, and caution with adhesive dressings, which can themselves tear the skin.'
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Loss of Dermal Tensile Strength
    treatment_effect: MODULATES
    description: Reduces the mechanical load the weakened dermis has to bear. It does not alter fibril structure.
  evidence:
  - reference: PMID:40887396
    reference_title: '[Ehlers-Danlos syndromes: Diagnosis and care pathway of these complex and multisystemic
      diseases].'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: There is no specific treatment for non-vascular EDS to date, so the care management is symptomatic,
      multidisciplinary and personalized.
    explanation: The guideline-level statement that management is symptomatic, which is the claim this entry
      makes.
  - reference: PMID:39641471
    reference_title: 'The Natural History of Dermatosparaxis Ehlers Danlos Syndrome: An Adult Case Series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Discussion of management considerations includes thorough investigations of acute pain, careful
      consideration of skin closure techniques and manual handling, as well as monitoring for reduced bone
      mineral density after low-impact fracture and/or post-menopause.
    explanation: The concrete protective measures named for adults, which this entry describes.
- name: Surgical Resection of Redundant Skin Folds
  therapeutic_modality: SURGERY
  description: Redundant skin folds often grow enough in adulthood to require surgical resection. Recorded
    as its own treatment because it is an intervention performed on the tissue consequence, in a disease whose
    skin tears easily and heals atrophically - so the operation carries the disease's own risk. Hernia repair
    falls in the same category.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Generalised Connective Tissue Fragility
    treatment_effect: MODULATES
    description: Removes accumulated redundant tissue. It does not alter fibril structure, and the operative
      site heals with the same defective collagen.
  evidence:
  - reference: PMID:39641471
    reference_title: 'The Natural History of Dermatosparaxis Ehlers Danlos Syndrome: An Adult Case Series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    explanation: Documents the truncating character of the founding alleles.
- name: Failure of Procollagen N-Propeptide Excision
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: 'ADAMTS2 normally cleaves the aminoterminal propeptide from types I, II and III procollagen.
    Without it the N-propeptide is retained and the secreted molecule remains pN-collagen. This is a processing
    defect, not a synthesis defect: the amount of collagen protein reaching the matrix is not reduced, only
    its maturation state. ADAMTS3 and ADAMTS14 are homologous N-proteinases but do not compensate in skin,
    which is why the phenotype is dermatological even though the substrate is ubiquitous.'
  biological_processes:
  - preferred_term: protein processing
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016485
      label: protein processing
  - preferred_term: collagen biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  downstream:

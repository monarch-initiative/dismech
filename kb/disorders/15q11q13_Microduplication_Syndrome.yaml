treatments:
- name: Supportive care
  description: >-
    Multidisciplinary supportive care is central, especially for developmental,
    feeding, communication, educational, and behavioral management. Core
    services include physical therapy for hypotonia and gross motor delay,
    occupational therapy for fine-motor and adaptive skills, speech-language
    therapy with augmentative and alternative communication when needed, feeding
    therapy, behavioral therapy such as applied behavior analysis, and
    psychotropic medication when behavioral manifestations require medication.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supportive care may include: feeding therapy, occupational and physical
      therapy, alternative and augmentative communication, behavioral therapy
      (e.g., applied behavioral analysis therapy), psychotropic medications
      for behavioral manifestations
    explanation: >-
      GeneReviews supports the specific developmental, communication, feeding,
      behavioral, and psychotropic components of supportive management.
- name: Gastrointestinal symptom management
  description: >-
    Gastrointestinal symptoms should be actively assessed because presentation
    can be atypical in nonverbal or minimally verbal individuals. In a
    retrospective Dup15q cohort, polyethylene glycol was the most commonly
    reported treatment for constipation and proton-pump inhibitors for reflux;
    treatment remains individualized rather than syndrome specific.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Constipation
    term:
      id: HP:0002019
      label: Constipation
  - preferred_term: Gastroesophageal reflux
    term:
      id: HP:0002020
      label: Gastroesophageal reflux
  evidence:
  - reference: PMID:25573720
    reference_title: Gastrointestinal problems in 15q duplication syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common treatments were polyethylene glycol for constipation and
      proton pump inhibitors for reflux.
    explanation: >-
      This documents treatments used in a retrospective cohort; it does not
      establish comparative efficacy or a Dup15q-specific regimen.
- name: Individualized epilepsy treatment
  description: >-
    Epilepsy treatment is tailored to seizure type and syndrome. Family-survey
    and retrospective multicenter data associate broad-spectrum antiseizure
    medications, oxcarbazepine, and valproate with responses in subsets; the
    survey also found ACTH more effective than vigabatrin for infantile spasms.
    These nonrandomized findings do not establish a universal hierarchy.
  notes: >-
    No prospective or randomized controlled trial data establish an antiseizure
    medication hierarchy for Dup15q. The 2014 family survey had a low return rate,
    and the 2026 multicenter study was retrospective; therapy should therefore be
    individualized by seizure type, structural subtype, tolerability, and
    specialist judgment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Infantile spasms
    term:
      id: HP:0012469
      label: Infantile spasms
  evidence:
  - reference: PMID:24502430
    reference_title: >-
      A survey of seizures and current treatments in 15q duplication syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Broad spectrum antiepileptic drugs (AEDs) were the most effective
      medications, but carbamazepine and oxcarbazepine were also effective,
      although typical benzodiazepines were relatively ineffective.
    explanation: >-
      This supports differential reported responses while the study's
      questionnaire design and low return rate preclude a treatment hierarchy.
  - reference: PMID:24502430
    reference_title: A survey of seizures and current treatments in 15q duplication syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For those with infantile spasms, adrenocorticotropic hormone (ACTH) was
      more effective than vigabatrin.
    explanation: >-
      This supports the observed ACTH-versus-vigabatrin difference only within a
      small, family-reported subgroup and is not treated as definitive guidance.
  - reference: PMID:42184160
    reference_title: >-
      Epileptic and developmental encephalopathy secondary to inversion-duplication
      of chromosome 15: Description of epilepsy characteristics and therapeutic outcomes.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most effective antiseizure drugs were oxcarbazepine for focal (9/11,
      81%) and for generalized (2/3, 67%) epilepsy and valproic acid (6/10, 60%)
      for generalized epilepsy
    explanation: >-
      The recent retrospective cohort supports response associations in small
      subgroups; it does not provide randomized comparative efficacy.
- name: Seizure trigger avoidance and surveillance
  description: >-
    Families should receive counseling on avoidable seizure triggers such as
    sleep deprivation and stress. Clinical follow-up should separately monitor
    for new seizures or changes in seizure type and assess nutritional status and
    growth.

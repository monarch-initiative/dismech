      GABRB3, GABRA5, and GABRG3, which encode the β3, α5 and γ3 receptor
      subunits, respectively.
    explanation: >-
      This identifies GABRB3 as one of the duplicated GABA-A receptor subunit
      genes in the 15q11.2-q13.1 critical region.

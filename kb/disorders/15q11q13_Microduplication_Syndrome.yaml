  notes: >-
    GABRB3 is part of the non-imprinted GABA-A receptor subunit gene cluster
    within the duplicated region. Increased cluster dosage is a leading
    hypothesis for the elevated beta EEG phenotype, but the exact mechanism and
    clinical consequences have not been established.

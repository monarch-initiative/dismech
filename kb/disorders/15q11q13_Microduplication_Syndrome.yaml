- name: Electroencephalography
  description: >-
    Awake and sleep EEG is used to characterize seizure types and epilepsy
    severity. Diffuse fast or beta activity is a recognizable syndrome-associated
    pattern, but EEG does not replace genetic confirmation.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:24239951
    reference_title: >-
      Duplication of the 15q11-q13 region: clinical and genetic study of 30 new cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      18 patients had an abnormal EEG with a typical, recognizable pattern of
      excessive diffuse rapid spikes in the waking record, similar to the
      pattern observed after benzodiazepine exposure.
    explanation: >-
      This directly supports EEG as an abnormal diagnostic finding.
- name: EEG beta oscillation biomarker
  description: >-
    Elevated beta power is a stable, reproducible electrophysiologic biomarker
    of Dup15q and a candidate pharmacodynamic or target-engagement readout. A
    locally referenced beta-power metric correlated with cognitive and adaptive
    scores in participants without epilepsy, but not in the epilepsy subgroup;
    this exploratory result requires replication and does not establish causal
    direction or treatment responsiveness.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an electrophysiological biomarker of the syndrome, characterized by
      excessive beta oscillations (12-30 Hz), resembling electroencephalogram
      (EEG) changes induced by allosteric modulation of GABAARs.
    explanation: >-
      This defines the characteristic Dup15q beta oscillation EEG biomarker
      and links it to GABAAR allosteric modulation.
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Beta power and peak frequency showed high stability across repeated visits
      (beta power ICC = 0.93, BPF ICC = 0.92). A reproducibility analysis
      revealed that beta power estimates are comparable between research and
      clinical EEG (ICC = 0.94).
    explanation: >-
      This supports elevated beta oscillations as a stable and clinically
      reproducible EEG biomarker in Dup15q syndrome.
  - reference: PMID:42297774
    reference_title: >-
      Excess EEG beta-band oscillations in Dup15q syndrome correlate with
      clinical severity.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlations between LRPβ and clinical scores in children with Dup15q
      syndrome without epilepsy were significant for all scores investigated
    explanation: >-
      Locally referenced beta power correlated with cognitive and adaptive
      severity in the subgroup without epilepsy. The exploratory analyses used
      one-sided, uncorrected tests and did not find corresponding associations in
      participants with epilepsy, so clinical qualification remains incomplete.
differential_diagnoses:
- name: Paternal 15q11.2-q13.1 duplication
  description: >-
    The same 15q11.2-q13.1 copy-number gain can be paternal rather than maternal.
    Paternal duplications are generally normal or associated with milder,
    variable findings and do not define maternal Dup15q, so parent-of-origin
    testing is the direct discriminator.
  evidence:
  - reference: PMID:37029316
    reference_title: >-
      Population screening for 15q11-q13 duplications: corroboration of the
      difference in impact between maternally and paternally inherited alleles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternally inherited duplications are always associated with a clinical
      phenotype (ranging from learning difficulties to intellectual impairment,
      epilepsy and psychiatric disorders), while paternal duplications are normal
      or associated with milder phenotypes (mild learning difficulties and dyslexia).
    explanation: >-
      This supports paternal duplication as the most direct parent-of-origin
      alternative to maternal Dup15q while preserving its variable impact.
- name: Angelman syndrome
  description: >-
    Angelman syndrome overlaps because it involves the same imprinted region
    but typically reflects loss of UBE3A function rather than duplication.
  disease_term:

diagnosis:
- name: Chromosomal copy-number, structure, and parent-of-origin testing
  description: >-
    Chromosomal microarray or array-CGH detects the 15q11.2-q13.1 copy-number
    gain and its extent. Karyotype and FISH help define a supernumerary
    isodicentric chromosome or mosaicism, while methylation or parental-marker
    analysis establishes the parent of origin required for maternal Dup15q.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39457428
    reference_title: >-
      Chromosome 15q11-q13 Duplication Syndrome: A Review of the Literature and
      14 New Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, a total of 14 pre- and postnatal cases were
      diagnosed as 15q11.2q13 duplication carriers using Affymetrix CytoScan 750
      K array-CGH, and our analysis combined these with 120 cases existing in
      the literature.
    explanation: >-
      This directly supports chromosomal microarray/array-CGH copy-number
      testing as a diagnostic method for Dup15q.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of maternal dup15q is established by detection of at least
      one extra maternally derived copy of the Prader-Willi/Angelman critical
      region, a region approximately 5 Mb long within chromosome region
      15q11.2-q13.1.
    explanation: >-
      GeneReviews supports detection of the extra maternally derived
      Prader-Willi/Angelman critical-region copy as the diagnostic basis of
      maternal Dup15q.
  - reference: PMID:19019226
    reference_title: The inv dup (15) or idic (15) syndrome (Tetrasomy 15q).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is achieved by standard cytogenetics and FISH analysis, using
      probes both from proximal chromosome 15 and from the PWS/ASCR.
    explanation: >-
      This directly supports cytogenetics plus FISH for defining idic(15)
      structure.
  - reference: PMID:19019226
    reference_title: The inv dup (15) or idic (15) syndrome (Tetrasomy 15q).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microsatellite analysis on parental DNA or methylation analysis on the
      proband DNA, are also needed to detect the parent-of-origin of the inv
      dup(15) chromosome.
    explanation: >-
      This directly supports molecular parent-of-origin testing after the
      copy-number and structural finding.
- name: Maternal CNV detection during genome-wide NIPS
  description: >-
    Low-coverage genome-wide cell-free DNA screening can incidentally identify a
    15q11-q13 duplication carried by the pregnant woman. Such a maternal finding
    is not a fetal diagnosis: it requires confirmatory maternal testing, genetic
    counseling, and separate assessment of fetal inheritance when indicated.
  diagnosis_term:
    preferred_term: prenatal genome-wide NIPS
    term:

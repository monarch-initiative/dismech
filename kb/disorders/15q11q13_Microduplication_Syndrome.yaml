    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: UBE3A-dependent neuronal hyperexcitability
  description: >-
    Patient-derived Dup15q neurons show hyperexcitability that is largely
    prevented by normalizing UBE3A dosage. UBE3A overexpression alone did not
    reproduce all synaptic phenotypes, indicating that it is necessary for many
    observed cellular abnormalities but is not sufficient to explain Dup15q.
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: UBE3A
    term:
      id: hgnc:12496
      label: UBE3A
  cell_types:
  - preferred_term: neuron

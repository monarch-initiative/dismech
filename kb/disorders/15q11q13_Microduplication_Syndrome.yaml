genetic:
- name: Maternal 15q11-q13 duplication
  association: Causal chromosomal duplication
  notes: >-
    Maternal Dup15q is most often caused either by an interstitial duplication
    contributing one extra critical-region copy (regional trisomy) or by an
    isodicentric supernumerary chromosome contributing two extra copies (regional
    tetrasomy). Recurrent breakpoints in the low-copy-repeat-rich 15q11.2-q13.1
    region generate variable rearrangements, and parent of origin materially
    affects phenotypic impact.
  evidence:
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      typically comprising two extra copies of 15q11.2-q13.1 and resulting in
      tetrasomy for 15q11.2-q13.1
    explanation: >-
      GeneReviews directly supports two additional critical-region copies and
      regional tetrasomy in the common idic(15) subtype.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A maternal interstitial 15q11.2-q13.1 duplication that typically includes
      one extra copy of 15q11.2-q13.1 within chromosome 15, resulting in trisomy
      for 15q11.2-q13.1 (~20-40%).
    explanation: >-
      GeneReviews directly supports one additional critical-region copy and
      regional trisomy in the interstitial subtype.
  - reference: PMID:39457428
    reference_title: >-
      Chromosome 15q11-q13 Duplication Syndrome: A Review of the Literature and
      14 New Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 15q11.2q13 chromosomal region is particularly susceptible to
      chromosomal rearrangements due to low-copy repeats (LCRs) located inside
      this area.
    explanation: >-
      This supports the LCR-mediated mechanism responsible for recurrent
      15q11-q13 duplications.
  - reference: PMID:39457428
    reference_title: >-
      Chromosome 15q11-q13 Duplication Syndrome: A Review of the Literature and
      14 New Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific breakpoints (BP1-BP5) that lead to deletions and duplications of
      variable size have been identified.
    explanation: >-
      This supports named LCR breakpoints as generating variable duplication
      sizes in Dup15q syndrome.
- name: GABRB3 duplicated-region dosage

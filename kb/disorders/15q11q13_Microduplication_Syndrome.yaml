- name: Prader-Willi syndrome
  description: >-
    Severe infantile hypotonia and feeding difficulty can initially suggest
    Prader-Willi syndrome. Both disorders involve the same imprinted region, but
    Prader-Willi syndrome reflects loss of paternally expressed 15q11-q13 genes
    rather than an extra maternally derived critical-region copy.
  disease_term:
    preferred_term: Prader-Willi syndrome
    term:
      id: MONDO:0008300
      label: Prader-Willi syndrome
- name: Autism spectrum disorder
  description: >-

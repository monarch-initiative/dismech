inheritance:
- name: Maternal parent-of-origin effect with subtype-dependent recurrence risk
  inheritance_term:
    preferred_term: Autosomal dominant inheritance with paternal imprinting
    term:
      id: HP:0012274
      label: Autosomal dominant inheritance with paternal imprinting
  parent_of_origin_effect: >-
    The diagnosis of maternal Dup15q requires at least one extra maternally
    derived copy of the 15q11.2-q13.1 Prader-Willi/Angelman critical region.
    Paternal duplications do not define maternal Dup15q and show variable,
    generally milder outcomes, so parent of origin must be established rather
    than inferred from copy number alone.
  de_novo_rate: >-
    Maternal idic(15) has been reported de novo in all affected individuals to
    date. Maternal interstitial 15q11.2-q13.1 duplication is de novo in
    approximately 85% of probands and maternally inherited in approximately
    15%.
  description: >-
    Recurrence counseling depends on the structural subtype and parental origin.
    Unaffected parents of a child with de novo idic(15) generally have low
    recurrence risk, with residual concern for maternal germline mosaicism. If a
    mother carries an interstitial 15q11.2-q13.1 duplication, each child has a
    50% risk of inheriting the duplication; prenatal or preimplantation genetic
    testing by chromosomal microarray can detect the duplication but cannot
    reliably predict severity.
  evidence:
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of maternal dup15q is established by detection of at least
      one extra maternally derived copy of the Prader-Willi/Angelman critical
      region
    explanation: >-
      GeneReviews defines maternal origin of the duplicated critical-region copy
      as central to the Dup15q diagnosis.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: De novo in all affected individuals reported to date
    explanation: >-
      GeneReviews supports de novo occurrence as the rule for maternal idic(15),
      with residual recurrence risk from possible maternal germline mosaicism.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: De novo in approximately 85% of probands and inherited from the mother in approximately 15%
    explanation: >-
      GeneReviews gives the subtype-specific de novo and inherited proportions
      for maternal interstitial 15q11.2-q13.1 duplications.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the risk to each child of inheriting the duplication is 50%
    explanation: >-
      GeneReviews supports 50% recurrence risk when the mother carries the
      interstitial duplication.
  - reference: PMID:27308687
    reference_title: Maternal 15q Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal testing or preimplantation genetic testing using chromosomal
      microarray (CMA) will detect the 15q interstitial duplication
    explanation: >-
      GeneReviews supports prenatal and preimplantation testing availability
      when the familial duplication is known.
has_subtypes:
- name: int15
  display_name: Interstitial 15q11-q13 duplication (int15)
  description: >-
    Interstitial tandem duplication of 15q11-q13 on the maternal chromosome,
    typically adding one copy and producing regional trisomy. It is usually
    milder than idic15, with a lower frequency and later onset of epilepsy, but
    developmental, behavioral, and seizure phenotypes remain variable.
- name: idic15
  display_name: Isodicentric 15 (idic15)
  description: >-
    Supernumerary isodicentric marker chromosome typically containing two extra
    copies of 15q11.2-q13.1 and producing regional tetrasomy. It is more strongly
    associated with severe, drug-resistant epilepsy than the interstitial
    subtype.
- name: Mosaic idic15
  description: >-
    Mosaic form of idic15 in which only a subset of cells carry the
    supernumerary isodicentric 15 chromosome, producing variable and often
    attenuated clinical severity relative to non-mosaic idic15.
progression:
- phase: Infancy and early development
  age_range: Congenital origin with infantile presentation
  notes: >-
    Central hypotonia, delayed acquisition of motor milestones, feeding
    difficulties, and global developmental delay commonly become apparent in
    infancy or early childhood. Speech and language development is particularly
    affected, and autistic or other behavioral features may emerge with age.
  evidence:
  - reference: PMID:19019226
    reference_title: The inv dup (15) or idic (15) syndrome (Tetrasomy 15q).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inv dup(15) or idic(15) syndrome displays distinctive clinical findings
      represented by early central hypotonia, developmental delay and intellectual
      disability, epilepsy, and autistic behaviour.
    explanation: >-
      This open-access clinical review supports the early developmental phase,
      particularly for the usually more severe idic(15) subtype.
  - reference: PMID:19019226
    reference_title: The inv dup (15) or idic (15) syndrome (Tetrasomy 15q).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Feeding difficulties are reported in the newborn period.
    explanation: >-
      This directly supports neonatal feeding difficulty as part of the early
      idic(15) presentation.
- phase: Epilepsy evolution
  age_range: Infancy through adulthood
  notes: >-
    Epilepsy may begin with infantile spasms or with focal or generalized
    seizures later in childhood. Multiple seizure types can accumulate, and a
    substantial subgroup develops drug-resistant developmental and epileptic
    encephalopathy, including Lennox-Gastaut syndrome; onset and severity are
    generally earlier and greater with idic15 than with int15.
  evidence:
  - reference: PMID:24502430
    reference_title: A survey of seizures and current treatments in 15q duplication syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures are common in idic(15) and typically difficult to control, often
      presenting with infantile spasms and progressing to a Lennox-Gastaut-type
      syndrome.
    explanation: >-
      The family survey supports the characteristic infantile-spasm-to-mixed,
      drug-resistant epilepsy trajectory while its low response rate limits
      population-level precision.
  - reference: PMID:42184160
    reference_title: >-
      Epileptic and developmental encephalopathy secondary to inversion-duplication
      of chromosome 15: Description of epilepsy characteristics and therapeutic outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial seizures were mostly focal motor (10/29, 34%) and generalized
      tonic-clonic seizures (8/29, 28%), later evolving to tonic, myoclonic, and
      atypical absence seizures.
    explanation: >-
      This multicenter retrospective cohort directly documents evolution from
      initial seizures to multiple later seizure types.
pathophysiology:
- name: Maternal 15q11-q13 dosage increase
  description: >-
    One or more extra maternally derived copies of 15q11.2-q13.1 increase dosage
    of neuronal UBE3A and multiple biallelically expressed genes. Human genetic
    and cell-model data support UBE3A as an important contributor, but neither
    UBE3A nor the duplicated GABAA-receptor genes alone explain the full clinical
    phenotype.
  genes:
  - preferred_term: UBE3A
    term:
      id: hgnc:12496
      label: UBE3A
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:25884337
    reference_title: >-
      15q11.2 Duplication Encompassing Only the UBE3A Gene Is Associated with
      Developmental Delay and Neuropsychiatric Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplications of chromosome region 15q11-q13 with the maternal imprint are
      associated with a wide spectrum of neuropsychiatric disorders, including
      autism spectrum disorders, developmental delay, learning difficulties,
      schizophrenia, and seizures.
    explanation: >-
      This supports maternal 15q11-q13 dosage increase as the initiating
      disease mechanism.
  - reference: PMID:37029316
    reference_title: >-
      Population screening for 15q11-q13 duplications: corroboration of the
      difference in impact between maternally and paternally inherited alleles.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternally inherited duplications are always associated with a clinical
      phenotype (ranging from learning difficulties to intellectual impairment,
      epilepsy and psychiatric disorders), while paternal duplications are normal
      or associated with milder phenotypes (mild learning difficulties and dyslexia).
    explanation: >-
      This directly supports a parent-of-origin effect as a key driver of
      phenotypic impact in 15q11-q13 duplications.
  - reference: PMID:36898382
    reference_title: >-
      The role of UBE3A in the autism and epilepsy-related Dup15q syndrome using
      patient-derived, CRISPR-corrected neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      UBE3A, which encodes an E3 ubiquitin ligase, is likely a major driver of
      Dup15q because UBE3A is the only imprinted gene expressed solely from the
      maternal allele.
    explanation: >-
      Patient-derived neuron experiments support UBE3A as a major imprinted
      dosage driver in Dup15q syndrome.
  downstream:
  - target: UBE3A-dependent neuronal hyperexcitability
    description: >-
      Increased maternal UBE3A dosage contributes to neuronal hyperexcitability

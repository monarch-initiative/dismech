    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
  evidence:
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an electrophysiological biomarker of the syndrome, characterized by
      excessive beta oscillations (12-30 Hz), resembling electroencephalogram
      (EEG) changes induced by allosteric modulation of GABAARs.
    explanation: >-
      This supports an association between the Dup15q beta EEG phenotype and
      GABAA-receptor pharmacology without establishing causation.
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although an exact mechanism of beta oscillations has not been elucidated
      in Dup15q syndrome
    explanation: >-
      This explicitly frames the GABAA-gene interpretation as a mechanistic
      hypothesis rather than an established causal pathway.
  - reference: PMID:41491842
    reference_title: >-
      RO4938581, a GABA(A)-α5 negative allosteric modulator rescued behavioral
      and EEG phenotypes of a mouse model of Dup15q syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      EEG recordings showed increased beta-power in 15q dup mice - which
      resembled the spectral signature of subjects with Dup15q - and was
      partially normalized following RO4938581 treatment.
    explanation: >-
      Selective α5-receptor modulation provides experimental support for the
      GABAA/beta hypothesis. The study used small groups of all-male mice with a
      paternal-equivalent duplication, and partial EEG rescue does not establish
      the mechanism or therapeutic effect in people with maternal Dup15q.
- name: Sodium channel dysfunction
  description: >-
    Dup15q neurons show abnormal sodium-channel kinetics with increased sodium
    current density and altered inactivation. These findings come from an
    isogenic patient-derived in-vitro model and have not yet established a
    clinical treatment target.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:37329181
    reference_title: >-
      Dysfunctional sodium channel kinetics as a novel epilepsy mechanism in
      chromosome 15q11-q13 duplication syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Dup15q neurons showed increased sodium current density and a depolarizing
      shift in steady-state inactivation.
    explanation: >-
      This directly supports sodium-channel dysfunction in Dup15q neurons.
  downstream:
  - target: Epileptogenic network dysfunction
    description: >-

discussions:
- discussion_id: mismatch_dup15q_mouse_sleep_physiology
  prompt: >-
    Why do maternal-duplication mice reproduce the human beta EEG signature but
    not the abnormal human NREM-sleep phenotype, and which part of the model is
    appropriate for preclinical target-engagement studies?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotype#Abnormal sleep physiology
  - diagnosis#EEG beta oscillation biomarker
  - pathophysiology#GABAA-receptor-associated beta oscillations
  rationale: >-
    Chromosome-engineered maternal-duplication mice reproduce elevated beta
    oscillations across brain states, supporting use of beta power as a
    translational measurement. The same mice do not reproduce the abnormal NREM
    sleep architecture observed in children with Dup15q and retain normal NREM
    recovery after sleep deprivation. The agreement is therefore biomarker
    specific rather than evidence that the mouse faithfully models the broader
    human sleep phenotype. This distinction matters when a preclinical
    intervention changes beta power without demonstrating a patient-relevant
    sleep or behavioral effect.
  proposed_experiments:
  - experiment_id: exp_dup15q_harmonized_human_mouse_sleep_eeg
    name: Harmonized longitudinal human-mouse sleep EEG perturbation study
    description: >-
      Use matched spectral definitions, sleep-stage metrics, age windows, and
      medication annotations in longitudinal human Dup15q sleep EEG and
      maternal-duplication mice, then compare responses to the same target-engagement
      perturbation. Treat beta power and NREM architecture as separate outcomes
      and test whether either predicts patient-centered sleep measures.
  evidence:
  - reference: PMID:39014349
    reference_title: >-
      Sleep EEG signatures in mouse models of 15q11.2-13.1 duplication (Dup15q)
      syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our study revealed that across brain states, matDp/+ mice mirrored the
      elevated beta oscillation phenotype observed in clinical EEGs from
      individuals with Dup15q syndrome.
    explanation: >-
      This directly supports preservation of the human beta EEG signature in the
      maternal-duplication mouse across brain states.
  - reference: PMID:39014349
    reference_title: >-
      Sleep EEG signatures in mouse models of 15q11.2-13.1 duplication (Dup15q)
      syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, NREM sleep between Dup15q mutant and WT littermate mice remained
      unaltered, suggesting a divergence from the clinical presentation in humans.
    explanation: >-
      This directly identifies the mouse-human NREM mismatch.
- discussion_id: gap_dup15q_gabaa_beta_clinical_causality
  prompt: >-
    Does increased dosage of GABRB3, GABRA5, or GABRG3 generate the Dup15q beta
    EEG biomarker, and is that signal causally related to epilepsy or clinical
    outcomes rather than merely correlated with them?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GABAA-receptor-associated beta oscillations
  - pathophysiology#Epileptogenic network dysfunction
  - diagnosis#EEG beta oscillation biomarker
  rationale: >-
    Human EEG establishes a stable beta biomarker and pharmacologic resemblance
    to GABAA-receptor modulation, but the exact mechanism remains unknown. A
    2026 study using locally referenced beta power found cross-sectional
    correlations with cognitive and adaptive severity in participants without
    epilepsy, but not in those with epilepsy; the analyses were exploratory and
    uncorrected for multiple testing. Selective α5-receptor modulation normalized
    the measured behavioral phenotypes and partially normalized beta power in a
    paternal-duplication mouse model. Neither result establishes directionality
    or clinical treatment response, and the basmisanil trial terminated after
    only seven participants.
    Individual-gene perturbation and prospective human intervention data are
    still needed before the GABAA cluster, beta biomarker, clinical outcomes, and
    therapeutic response can be placed in one causal chain.
  proposed_experiments:
  - experiment_id: exp_dup15q_gabaa_gene_dosage_network_rescue
    name: Isogenic GABAA-cluster dosage dissection in human neuronal networks
    description: >-
      In patient-derived mixed excitatory-inhibitory neuronal cultures, normalize
      GABRB3, GABRA5, and GABRG3 singly and in combinations while leaving UBE3A
      dosage unchanged. Measure receptor composition, inhibitory currents,
      network beta oscillations, and epileptiform activity, then compare the
      rescued signatures with longitudinal human EEG and seizure outcomes.
  evidence:
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although an exact mechanism of beta oscillations has not been elucidated
      in Dup15q syndrome
    explanation: >-
      This explicitly states that the gene-dosage mechanism remains unresolved.
  - reference: PMID:32791992
    reference_title: Properties of beta oscillations in Dup15q syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We urge caution in not overinterpreting the relationship between epilepsy
      and beta oscillations, as without preclinical models to manipulate the
      underlying altered circuitry, we will not be able to prove directionality
      of the association.
    explanation: >-
      This directly identifies the unresolved directionality between the beta
      biomarker and epilepsy.
  - reference: PMID:42297774
    reference_title: >-
      Excess EEG beta-band oscillations in Dup15q syndrome correlate with
      clinical severity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p-values (uncorrected for multiple testing) from our exploratory
      analyses should be interpreted as indicative of evidence strength rather
      than statistical conclusions.
    explanation: >-
      The authors explicitly qualify the new clinical-severity correlations as
      exploratory, leaving replication and causal interpretation open.

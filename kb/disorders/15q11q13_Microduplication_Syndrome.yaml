name: 15q11q13 Microduplication Syndrome
creation_date: "2026-04-15T23:46:24Z"
synonyms:
- Dup15q syndrome
- Duplication 15q11q13 syndrome
- 15q11-q13 duplication syndrome
- 15q11.2-q13.1 duplication syndrome
- Chromosome 15q11-q13 duplication syndrome
description: >-
  15q11q13 microduplication syndrome (Dup15q syndrome) is a recurrent chromosome
  15q11.2-q13.1 copy-number disorder defined clinically by one or more extra
  maternally derived copies of the Prader-Willi/Angelman critical region. Core
  manifestations include hypotonia, motor and language delay, intellectual
  disability, autistic behavior, and variably severe epilepsy; feeding,
  gastrointestinal, behavioral, and sleep-physiology abnormalities also occur.
  Interstitial maternal duplications usually produce trisomy for the region,
  whereas a maternal isodicentric chromosome 15 usually contributes two extra
  copies and produces regional tetrasomy. UBE3A dosage and the duplicated GABAA
  receptor gene cluster are leading mechanistic candidates, but their respective
  contributions to the human phenotype remain incompletely resolved.
category: Genetic
parents:
- hereditary disease
- chromosomal disorder
disease_term:
  preferred_term: 15q11q13 microduplication syndrome
  term:
    id: MONDO:0012081
    label: 15q11q13 microduplication syndrome

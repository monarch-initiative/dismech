progression:
- phase: Onset
  age_range: infancy to adulthood
  notes: >-
    There is no single onset age. Reported onset spans from birth or infancy (the neuropathy
    series, the Chinese case, and the cardiomyopathy identified at six months) to adulthood -
    the adult founding individual had life-long exercise intolerance but presented formally at
    25. Onset age is therefore not a useful discriminator for this disorder, which is itself
    worth recording.
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one presented in childhood with failure to thrive and hypertrophic cardiomyopathy, and the other was an adult with a life-long history of exercise intolerance"
    explanation: The two onset extremes, within a single report and a single genotype class.
- phase: Established disease
  notes: >-
    Course tracks presentation severity. The adult phenotype is a stable, life-long exercise
    limitation; the infantile phenotype is a progressive multisystem disease with developmental
    delay, neuropathy, seizures and organ involvement. No systematic natural-history study
    exists, so this is a summary of case reports rather than a described course.
  evidence:
  - reference: PMID:35109800
    reference_title: "Novel heterozygous compound TRMT5 mutations associated with combined oxidative phosphorylation deficiency 26 in a Chinese family: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the hepatic feature was first observed in a COXPD26 patient."
    explanation: >-
      Illustrates that organ involvement was still being added to the phenotype as recently as
      the most recent case report, which is why no settled natural history can be stated.
diagnosis:
- name: Respiratory Chain Enzymology in Skeletal Muscle
  description: >-
    Muscle rather than fibroblast is the informative tissue, and this is the single most
    practically important statement in the entry. In one founding individual, muscle enzymology
    showed decreased complex IV and borderline-low complex I while fibroblast studies were
    normal. A normal fibroblast panel does not exclude COXPD26.

    The test is not sufficient either: the 2022 series found essentially normal muscle
    respiratory-chain activity in three genetically confirmed patients, so a normal muscle assay
    does not exclude the diagnosis in a patient with a compatible phenotype.
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory-chain analysis in frozen muscle tissue showed decreased activity of respiratory complex IV and borderline-low complex I activity (Table 1), whereas fibroblast studies showed normal values."
    explanation: The tissue discrepancy that makes muscle the tissue to sample.
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the mitochondrial respiratory chain complex activity in skeletal muscle was normal, except in one patient in whom there was a mild decrease in complex I enzyme activity"
    explanation: >-
      Refutes the sufficiency of muscle enzymology as a rule-out test - three confirmed patients
      with normal muscle biochemistry.
- name: Exome or Genome Sequencing
  description: >-
    Every published case was solved by sequencing rather than by biochemistry. Given that the
    biochemical phenotype is inconstant, sequencing is the diagnostic route rather than the
    confirmation step.
  evidence:

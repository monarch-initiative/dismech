    evidence_source: HUMAN_CLINICAL
    snippet: "Medical exome sequencing with high coverage depth was employed to identify potential genetic variants in the patient."
    explanation: The same route in the most recent case report.
- name: m1G37 Modification Assay on Mitochondrial tRNA
  description: >-
    A research-grade functional assay rather than a clinical test, but the one that directly
    measures the disease mechanism: reverse-transcriptase primer extension across position 37 of
    mt-tRNA-Leu(CUN), read out as increased readthrough when the methyl group is absent. Useful
    for classifying a variant of uncertain significance in TRMT5, and most sensitive on muscle
    RNA.
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-PEx reactions performed on total RNA preparations isolated from skeletal-muscle biopsy samples of affected individuals demonstrated severely diminished pausing at G37, in particular for the 65205 sample as compared to the control samples (Figure 4C)."
    explanation: The assay, the tissue in which it performs best, and its readout.
treatments:
- name: Genetic Counseling
  description: >-
    Autosomal recessive with a 25% recurrence risk. Counselling in this disorder has an unusual
    difficulty to convey: the three patients of the 2022 series carry the identical allele pair
    and one of the founding pair had adult-onset exercise intolerance, so a confirmed genotype
    does not predict severity.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients carried the same two compound heterozygous variants of the TRMT5 (tRNA Methyltransferase 5) gene"
    explanation: >-
      Establishes the shared genotype across three families, which is what makes genotype-based
      prognostication unsupportable here.
- name: Supportive and Organ-Directed Care
  description: >-
    No disease-modifying therapy exists. Management is supportive and follows the organs
    involved in the individual patient - cardiac surveillance where cardiomyopathy is present,
    nutritional and gastrointestinal support, seizure control, and rehabilitation for the
    neuropathy and weakness. Recorded with no agent bound, because none of the cited sources
    makes a pharmacological recommendation for this disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Multisystem Energy-Failure Phenotype
    description: >-
      Addresses the organ consequences only. Nothing available restores m1G37 modification or
      mitochondrial translation.
  notes: >-
    Deliberately thin. All three primary sources are gene-discovery, phenotype-expansion or
    case-report papers with no management section, and no GeneReviews chapter covers COXPD26.
    General mitochondrial-disease management is not imported here, because doing so would
    attribute to COXPD26 guidance written for a heterogeneous group.
  evidence:
  - reference: PMID:35109800
    reference_title: "Novel heterozygous compound TRMT5 mutations associated with combined oxidative phosphorylation deficiency 26 in a Chinese family: a case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "renal and hepatic defects, and recurrent seizures with spastic diplegia"
    explanation: >-
      Establishes the range of organs that need surveillance. INDIRECT because no cited source
      states a management recommendation; the organ-directed framing follows from the reported
      involvement, not from a recommendation in this sentence.
experimental_models:
- name: TRMT5 siRNA-depleted human cells
  experimental_model_type: CELL_LINE
  description: >-
    RNAi knockdown of TRMT5 in control human cells, used as the forward causal control for the
    modification defect observed in patients.
  publication: PMID:26189817
  modeled_mechanisms:
  - target: m1G37 Hypomodification of Mitochondrial tRNA
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Knockdown reproduces the same G37 hypomodification seen in patient material, in the same
      assay.
    limitations: >-
      An acute knockdown in a control background, not a hypomorphic germline allele in patient
      tissue - so it models the molecular defect but not its developmental or tissue-specific
      consequences, and cannot address why muscle is affected more than fibroblast.
    readouts:
    - name: m1G37 readthrough in mt-tRNA-Leu(CUN) by RT primer extension
      target: m1G37 Hypomodification of Mitochondrial tRNA
      direction: INCREASED
      interpretation: Increased readthrough indicates the methyl group is missing.
      evidence:
      - reference: PMID:26189817
        reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The siRNA-mediated depletion of TRMT5 resulted in G37 hypomodification in mt-tRNALeu(CUN) in the RT-PEx assay, as observed for the samples derived from the affected individuals."
        explanation: Reports the primer-extension measurement behind this readout.
    evidence:
    - reference: PMID:26189817
      reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Deficiency of the G37 modification was also detected in human cells subjected to TRMT5 RNAi."
      explanation: Supports treating this model as informative for the modification node.
- name: Patient-derived primary fibroblasts with wild-type TRMT5 rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from both founding individuals, with lentiviral re-expression of wild-type TRMT5
    cDNA as the rescue arm. The uninfected cells carry the modification defect; the transduced
    cells do not.
  publication: PMID:26189817
  modeled_mechanisms:
  - target: m1G37 Hypomodification of Mitochondrial tRNA
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Re-expression of wild-type TRMT5 restores m1G37 to control levels in patient fibroblasts,
      with no effect in control cells - the specificity control that makes this a rescue rather
      than an overexpression artefact.
    limitations: >-
      Fibroblasts are the tissue in which this disease is least well represented. The same cells
      showed normal respiratory-chain values in one individual and no detectable change in
      oxygen consumption in the other, so the rescue is demonstrated at the molecular readout
      and not at the bioenergetic one.
    readouts:
    - name: m1G37 amount in mt-tRNA-Leu(CUN) after wild-type TRMT5 transduction
      target: m1G37 Hypomodification of Mitochondrial tRNA
      direction: RESTORED
      interpretation: Restoration to control levels, establishing the modification defect as TRMT5-dependent.
      evidence:
      - reference: PMID:26189817
        reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "in transduced 73901 fibroblasts, the expression of wild-type TRMT5 was found to reverse the hypomodification effect observed in fibroblasts from the affected individuals, resulting in m1G37 amounts matching those of the control individual"
        explanation: Reports the rescue measurement behind this readout.
    - name: Cellular oxygen consumption rate
      target: m1G37 Hypomodification of Mitochondrial tRNA
      direction: UNCHANGED
      interpretation: >-
        A real negative result in the second patient's fibroblasts, and the reason this model is
        used for the molecular node rather than the bioenergetic one.
      evidence:
      - reference: PMID:26189817
        reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "The latter is also supported by a modestly lowered respiration rate in the 65205 fibroblast (Figure S6), but no detectable changes in oxygen consumption in the 73901 fibroblast."
        explanation: >-
          Refutes the proposition that patient fibroblasts reliably show a bioenergetic defect -
          one of the two showed none.
    evidence:
    - reference: PMID:26189817
      reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The transduction had no noticeable effect on the G37 modification status of mt-tRNALeu(CUN) in the control-cell line (C2-T, Figure 5A)."
      explanation: >-
        The specificity control - transduction changes nothing in control cells - which is what
        licenses reading the patient-cell change as a rescue.
- name: Heterologous Saccharomyces cerevisiae Trm5p model
  experimental_model_type: OTHER
  description: >-
    Yeast complementation assay used to test the pathogenicity of the patient TRMT5 alleles,
    exploiting the absolute conservation of the catalytic residues between human TRMT5 and yeast
    Trm5p.
  publication: PMID:26189817
  modeled_mechanisms:
  - target: TRMT5 Biallelic Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Confirms that the patient alleles are functionally deficient in a heterologous system,
      independently of any human-cell measurement.
    limitations: >-
      Yeast has no equivalent of the human clinical phenotype and does not model tissue
      specificity, developmental timing or the respiratory-chain output. It establishes allele
      pathogenicity, and nothing beyond it.
    readouts:
    - name: Complementation of Trm5p function by patient-allele constructs
      target: TRMT5 Biallelic Loss of Function
      direction: DECREASED
      interpretation: Reduced complementation indicates the patient alleles are hypomorphic.
      evidence:
      - reference: PMID:26189817
        reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "To further substantiate the pathogenicity of the identified TRMT5 variants, we utilized a yeast model to analyze the Trm5p p."
        explanation: >-
          Names the assay and its purpose. Graded OTHER rather than MODEL_ORGANISM because a
          yeast complementation assay is a biochemical pathogenicity test rather than an animal
          disease model; the cache renders the residue designation as a truncated fragment, so
          the quote stops at the sentence boundary the cache provides.
    evidence:
    - reference: PMID:26189817
      reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Met386 residues show absolute evolutionary conservation between human and yeast (Figure 1B)."
      explanation: >-
        The conservation that licenses using yeast as a surrogate for the human enzyme at all.
discussions:
- discussion_id: coxpd26_respiratory_chain_deficiency_not_obligate
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    The disorder is named for a combined oxidative phosphorylation deficiency, but the largest
    published patient group had normal skeletal-muscle respiratory-chain activity. Is the
    biochemical defect the disease, or one variable consequence of it?
  attaches_to:
  - pathophysiology#Combined Respiratory Chain Complex Deficiency
  - diagnosis#Respiratory Chain Enzymology in Skeletal Muscle
  - histopathology#Proliferation of giant mitochondria in skeletal muscle
  - disease#Combined Oxidative Phosphorylation Defect Type 26
  rationale: >-
    Well-conducted reports disagree about the disorder's defining feature, and the disagreement
    is not reconciled anywhere in the literature cited here. It is not an even split: of the
    three reports with muscle enzymology, two find it abnormal and one does not.

    The founding report defines COXPD26 by "multiple mitochondrial respiratory-chain-complex
    deficiencies in skeletal muscle" in both of its individuals, with cytochrome c oxidase
    deficiency and a complex III defect in one and decreased complex IV with borderline-low
    complex I in the other. The Chinese case report, published the same year as the series
    below, independently found reduced respiratory-chain complex enzyme activities on muscle
    biopsy in its patient - a third patient group, and a second report on that side.

    The 2022 neuropathy series studied respiratory-chain complex activity in the muscle of all
    three of its index patients and found it normal in two, with a mild complex I decrease in
    the third - and it found this despite proliferation of giant mitochondria in the same
    tissue, which is itself a morphological marker of mitochondrial disease. So the structural
    signal was present and the enzymatic signal was not.

    Several readings are open and this entry does not choose between them. Note that a
    2-versus-1 split is still a real disagreement and not a majority verdict - the 2022 series
    is the largest single patient group of the three, so counting reports and counting patients
    do not point the same way. The third report is also incomplete on the axis that matters
    most: it could not measure COX activity, and COX is the complex the founding report found
    most affected, so it establishes abnormal enzymology without establishing which complexes.
    The 2022 patients' shared missense allele p.Ile222Thr may destabilise tRNA binding rather
    than abolish
    catalysis, leaving enough residual m1G37 to keep enzymology in range while still causing
    disease in the most vulnerable tissue - which would make the neuropathy the sensitive
    readout and the muscle biochemistry an insensitive one. Or the assay may be at fault: the
    founding report's own data show the m1G37 deficit is tissue-specific, and nothing guarantees
    that a frozen-muscle enzyme panel is the tissue and the readout where a translation defect
    shows up. Or the biochemical phenotype may be genuinely variable between patients.

    What would settle it is not available: nobody has measured m1G37 modification in the 2022
    patients' muscle. That is the missing link between the two reports, and it is a single assay
    the founding group already established.

    Practical consequence, recorded in the diagnosis section: normal muscle respiratory-chain
    enzymology does not exclude COXPD26.
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both affected individuals presented with lactic acidosis and evidence of multiple mitochondrial respiratory-chain-complex deficiencies in skeletal muscle"
    explanation: One side of the disagreement - the defining biochemical feature as first described.
  - reference: PMID:35109800
    reference_title: "Novel heterozygous compound TRMT5 mutations associated with combined oxidative phosphorylation deficiency 26 in a Chinese family: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy also indicated reduced respiratory chain complex enzyme activities."
    explanation: >-
      The same side as the founding report, from an independent group and patient. Recorded in
      the discussion itself so that a reader weighing the disagreement sees all three reports
      without having to reconstruct the tally from the pathophysiology node. Incomplete on one
      axis: the same paragraph reports that COX activity could not be measured in that lab, and
      COX is the complex the founding report found most affected.
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the proliferation of giant mitochondria, the mitochondrial respiratory chain complex activity in skeletal muscle was normal, except in one patient in whom there was a mild decrease in complex I enzyme activity."
    explanation: >-
      The other side - three genetically confirmed patients without the biochemical phenotype
      the disorder is named for.
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computer modelling of the human TRMT5 protein structure suggests that the rare p.Ile222Thr mutation could affect the stability of tRNA binding."
    explanation: >-
      Supports the residual-activity reading of the discrepancy, at the strength in-silico
      modelling permits and no further.
  proposed_experiments:
  - experiment_id: exp_coxpd26_m1g37_in_neuropathy_patients
    name: m1G37 modification assay on muscle RNA from TRMT5 patients with normal enzymology
    description: >-
      Run the founding report's RT primer-extension assay across G37 of mt-tRNA-Leu(CUN) on
      stored skeletal-muscle RNA from the three patients whose respiratory-chain enzymology was
      normal, alongside the founding patients as positive controls. This is the one measurement
      that would say whether the two reports describe one disease with a variable biochemical
      readout or two different degrees of enzyme deficiency.
    would_support:
    - pathophysiology#m1G37 Hypomodification of Mitochondrial tRNA
    - pathophysiology#Combined Respiratory Chain Complex Deficiency
    supporting_outcome:
    - >-
      Muscle m1G37 is clearly hypomodified in the neuropathy patients despite normal enzymology,
      showing that the modification defect is the constant feature and the respiratory-chain
      deficiency a variable downstream consequence - and that the modification assay, not the
      enzyme panel, is the diagnostic test.
    refuting_outcome:
    - >-
      Muscle m1G37 is near-normal in those patients, indicating their alleles retain substantial
      activity and that their neuropathy is driven by something other than the mechanism curated
      here.
- discussion_id: coxpd26_tissue_specificity_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is m1G37 hypomodification more severe in skeletal muscle than in fibroblasts from the
    same patient, and does that gradient explain which organs fail?
  attaches_to:
  - pathophysiology#Tissue-Specific Amplification of the Modification Defect in Skeletal Muscle
  - pathophysiology#Multisystem Energy-Failure Phenotype
  rationale: >-
    The tissue gradient is observed and unexplained.

    Established: the hypomodification is present in patient fibroblasts and "particularly
    prominent in skeletal muscle"; muscle enzymology is abnormal in a patient whose fibroblast
    enzymology is normal; the founding authors attribute organ selectivity in this class of
    disorder to tissue-specific threshold effects, with the heart singled out as most vulnerable
    to a reduced mitochondrial translation rate.

    Not established: what sets the threshold. Candidate explanations - differing TRMT5
    expression, differing mitochondrial tRNA turnover, differing translational demand between
    post-mitotic muscle and dividing fibroblasts - are all plausible and none is tested in any
    source cited here. The threshold argument itself is drawn by analogy across three different
    tRNA-modification disorders rather than from COXPD26 data.

    This matters beyond mechanism. If the gradient tracks translational demand, then the organs
    at risk are predictable and surveillance can be targeted; if it does not, the multisystem
    presentation has to be managed reactively, which is what happens now.
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkable tissue specificity for the effect of TRMT5 variants on G37 modification was identified when mt-tRNA from skeletal muscle was analyzed in the same assay (Figure 4C)."
    explanation: The observation this gap is about, described by the authors as remarkable and left unexplained.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The increased sensitivity of cardiac tissue as a consequence of a perturbed mitochondrial translation has recently been recapitulated in an MTO1 mouse model."
    explanation: >-
      The only mechanistic support offered for the threshold argument. Graded MODEL_ORGANISM
      because the sentence reports an in-vivo mouse result; INDIRECT because that mouse carries
      a different gene's lesion, which is a separate axis from what kind of study it was.

name: Combined Oxidative Phosphorylation Defect Type 26
category: Mendelian
creation_date: "2026-08-30T21:40:00Z"
synonyms:
- COXPD26
- Combined oxidative phosphorylation deficiency 26
- TRMT5 combined oxidative phosphorylation deficiency
- Combined oxidative phosphorylation deficiency caused by mutation in TRMT5
description: >-
  COXPD26 is an autosomal recessive multisystem mitochondrial disease caused by biallelic
  variants in TRMT5, the nuclear gene encoding the tRNA methyltransferase that installs the
  m1G37 modification immediately 3' of the anticodon in mitochondrial tRNAs. Losing that single
  methyl group degrades mitochondrial translation, and because every mtDNA-encoded subunit
  depends on it, the biochemical result is a combined rather than an isolated respiratory-chain
  defect.

  The reason to curate this entry carefully is that its phenotype is not one disease shape. The
  two individuals in the founding report shared a genotype class, a biochemical lesion and a
  molecular defect, and looked nothing alike: one presented in childhood with failure to thrive
  and hypertrophic cardiomyopathy, the other was an adult with a life-long history of exercise
  intolerance. A later series of three patients added an infantile-onset severe demyelinating
  peripheral neuropathy with intellectual disability and cerebellar abnormality, and a Chinese
  case report added hepatic and renal involvement and seizures. Fewer than a dozen patients have
  been published in total, and they span from adult exercise intolerance to lethal infantile
  multisystem disease.

  One mechanistic detail explains part of that spread and is curated as its own node: the
  hypomodification is tissue-specific. In the founding report the m1G37 deficit was
  "particularly prominent in skeletal muscle", with fibroblast respiratory-chain values normal
  in the same patient whose muscle enzymology was abnormal. A negative fibroblast assay
  therefore does not exclude this disease, which is a diagnostic fact rather than a footnote.

  The entry also records a genuine disagreement in the literature rather than averaging it away.
  The founding report defines the disease by "multiple mitochondrial respiratory-chain-complex
  deficiencies in skeletal muscle". The 2022 neuropathy series reports that in its three
  patients "the mitochondrial respiratory chain complex activity in skeletal muscle was normal,
  except in one patient in whom there was a mild decrease in complex I enzyme activity" - despite
  proliferation of giant mitochondria in the same tissue. The defining biochemical feature of
  the disorder was absent in the largest published family group. That is filed as a
  CONTROVERSY, not smoothed over.
classifications:
  icimd_category:
  - classification_value: mtdna_transcript_processing_and_modification
    notes: >-
      TRMT5 is a nuclear-encoded enzyme acting post-transcriptionally on mitochondrial tRNAs,
      which places the disorder with the mtDNA transcript processing and modification defects
      rather than with a respiratory-chain subunit or assembly-factor group - even though the
      measured biochemical phenotype is a respiratory-chain one.

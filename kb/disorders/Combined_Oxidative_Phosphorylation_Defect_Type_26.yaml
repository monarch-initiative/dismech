- name: Hepatic steatosis with glycogen accumulation, Kupffer-cell activation and portal fibrosis
  finding_term:
    preferred_term: diffuse hepatocellular steatosis
    term:
      id: NCIT:C36185
      label: Steatosis
  description: >-
    Liver biopsy in the single patient with hepatic involvement showed diffuse hepatocellular
    steatosis, intracytoplasmic glycogen accumulation on PAS, activated Kupffer cells and
    fibrous hyperplasia in the portal area. The authors state outright that liver pathology in
    this disorder had not been reported before, so this is the only histological description of
    the hepatic phenotype in the COXPD26 literature - which is why it is modelled here rather
    than left as the one-word "hepatic defects" the phenotype section carries.

    Electron microscopy adds a second modality on the same biopsy: abundant lipid droplets,
    which is the ultrastructural correlate of the steatosis seen by light microscopy. Recorded
    because it is a distinct modality rather than a restatement, and the companion to the
    ultrastructural mitochondrial finding modelled above.

    Read with the corresponding caution: it is one patient, and the entry bands the hepatic
    phenotype OCCASIONAL for that reason. A single biopsy is the whole evidence base for this
    finding.
  context: Liver biopsy, one patient, the Chinese case report.

  preferred_term: combined oxidative phosphorylation defect type 26
  term:
    id: MONDO:0014684
    label: combined oxidative phosphorylation defect type 26
parents:
- Mitochondrial Disease
notes: >-
  Evidence base and its limits. Three primary sources carry this entry, and they are small:
  the founding report of two unrelated individuals with functional work (PMID:26189817), a
  three-patient series from three unrelated families that redefines the phenotype as a
  demyelinating neuropathy (PMID:35342985), and a single-patient case report adding hepatic
  involvement (PMID:35109800). Two further papers (PMID:33398350, PMID:29222331) are cited only
  for TRMT5 enzymology and the downstream consequences of losing m1G37 - both study
  mitochondrial tRNA point mutations that *create* a TRMT5 substrate rather than TRMT5 variants
  themselves, and their evidence is graded INDIRECT wherever it is used for a claim about this
  disease.

  Why the phenotype section is hedged. With under a dozen published patients and no cohort
  study, per-phenotype frequencies cannot be computed honestly. Frequencies here are set from
  what the sources state about their own patients and no attempt is made to convert a case
  count into a population rate.

  The tissue-specificity point is load-bearing and is easy to lose. Muscle is the tissue where
  the m1G37 deficit and the respiratory-chain defect are found; fibroblasts were normal on
  respiratory-chain enzymology in one of the two founding patients and showed no detectable
  change in oxygen consumption in the other. A clinician or curator reading only "combined
  OXPHOS deficiency" would expect a fibroblast assay to be informative, and it is not reliably.

  Deep research, and a warning worth carrying with the entry. The first OpenScientist run for
  this disease returned a complete, internally coherent, fully cited report about the wrong
  disease: it described TRMT10C / MRPP1, which is COXPD30 (MONDO:0014856, OMIM 616974), while
  labelling it COXPD26 and printing MONDO:0014684 in its own identifier table. Its validators
  looked healthy - 14/14 references resolved, confabulation rate 0.0, 21/22 ontology terms
  resolved. `just preflight-dr` caught it unambiguously ("Expected gene TRMT5 is never
  mentioned, but TRMT10C is mentioned 52 times"), and the report was discarded rather than
  cherry-picked, per that tool's own advice. It contributed nothing to this entry, which was
  built from primary literature throughout.

  A second run, with the gene named in the brief rather than only the MONDO ID, is the report
  committed alongside this entry. It passes `preflight-dr` cleanly (TRMT5 mentioned 38 times to
  TRMT10C's 5, the latter only as the contrast), which is the useful experimental result here:
  passing the MONDO ID was not enough, and naming the gene in the disease-name variable was.
  It too is a lead source only - every snippet below is anchored to a PMID fetched into
  `references_cache/` and read directly.

  What the second report does *not* contain is worth recording, because it bears on how much
  weight a deep-research report should carry on its own. It never cites PMID:35342985 - the
  three-patient neuropathy series that found normal skeletal-muscle respiratory-chain activity,
  which is the observation this entry's CONTROVERSY discussion is about and arguably the single
  most important thing to know about the disorder's biochemical phenotype. A report that is on
  the right disease and cites 18 references with zero confabulation still missed the paper that
  complicates its own central claim.

  The general point is worth recording because it is not obvious from the numbers: citation
  validation and entity correctness are orthogonal. A report can quote every source accurately
  and still be about a different disease, and for a numbered disease series like COXPD, where
  the number is the only thing distinguishing two neighbouring entities with similar mechanisms,
  that failure is easy to make and hard to see.

  No mechanism module fits. `kb/modules/mitochondrial_dysfunction.yaml` is the aging-hallmark
  module (mtDNA damage, mitophagy, senescence), not a primary mitochondrial-translation module,
  so no `conforms_to` is declared here. The sibling entry
  `Combined_Oxidative_Phosphorylation_Defect_Type_21` (TARS2) makes the same choice and repeats
  the same node chain independently, which is the signature of a missing module rather than of
  two unrelated diseases.
inheritance:
- name: Autosomal recessive
  description: >-
    Compound heterozygous TRMT5 variants in every published case. The three patients in the
    neuropathy series, from three unrelated families, carry the identical variant pair.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing, we identified two unrelated individuals carrying compound heterozygous variants in TRMT5 (tRNA methyltransferase 5)."
    explanation: Establishes biallelic compound heterozygous inheritance in the two founding individuals.
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients carried the same two compound heterozygous variants of the TRMT5 (tRNA Methyltransferase 5) gene"
    explanation: >-
      Recessive inheritance across three unrelated families, and a shared allele pair that makes
      the phenotypic difference from the founding patients harder to attribute to genotype. The
      two alleles are named in square-bracketed HGVS immediately after this clause; the
      reference validator strips bracketed spans that do not match its literal patterns, so the
      quote stops before them and the allele identities are carried in the variant entries below.
pathophysiology:
- name: TRMT5 Biallelic Loss of Function
  description: >-
    Biallelic TRMT5 variants remove or degrade the nuclear-encoded methyltransferase that
    catalyses m1G37 formation on mitochondrial tRNAs. TRMT5 is the human orthologue of yeast
    Trm5p, and residues involved in catalysis are absolutely conserved between the two - which
    is what made a heterologous yeast complementation assay a usable pathogenicity test for the
    patient alleles. In the neuropathy series the missense allele p.Ile222Thr is predicted by
    structural modelling to destabilise tRNA binding rather than to abolish the catalytic site.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRMT5
    term:
      id: hgnc:23141
      label: TRMT5
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
  molecular_functions:
  - preferred_term: tRNA (guanine(37)-N1)-methyltransferase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0052906
      label: tRNA (guanine(37)-N1)-methyltransferase activity
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: m1G37 Hypomodification of Mitochondrial tRNA
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TRMT5 encodes a mitochondrial protein with strong homology to members of the class I-like methyltransferase superfamily."
    explanation: Identifies the gene product, its compartment and its enzyme class.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The human ortholog,22 TRMT5 (tRNA methyltransferase 5), catalyzes the formation of m1G37 in vitro."
    explanation: >-
      The enzymatic identity this node depends on. Graded IN_VITRO because that is the kind of
      evidence the sentence reports - purified-enzyme biochemistry, as its own "in vitro" says.
      It is background rather than a finding of this study, but novelty is not what
      `evidence_source` classifies.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenicity of the detected variants was further confirmed in a heterologous yeast model and by the rescue of the molecular phenotype after re-expression of wild-type TRMT5 cDNA in cells derived from the affected individuals."
    explanation: >-
      The two orthogonal pathogenicity controls. Graded OTHER because the sentence bundles a
      yeast complementation result with a human-cell rescue and so has no single evidence
      source; the human-cell rescue is quoted separately on the node below.
- name: m1G37 Hypomodification of Mitochondrial tRNA
  description: >-
    The direct molecular consequence, and the one measured in patients. Reverse-transcriptase
    primer-extension across position 37 of mt-tRNA-Leu(CUN) shows markedly increased readthrough
    in patient material, meaning the methyl group is missing. Two controls make this causal
    rather than correlative: siRNA depletion of TRMT5 in control cells reproduces the
    hypomodification, and lentiviral re-expression of wild-type TRMT5 in patient fibroblasts
    reverses it to control levels.

    A negative result is worth recording here too: loss of m1G37 does not destabilise the tRNA.
    Steady-state mt-tRNA-Leu(CUN) levels are similar in control and patient fibroblasts, so the
    downstream defect is a translation-fidelity or efficiency problem rather than a loss of the
    tRNA pool.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial tRNA methylation
    modifier: DECREASED
    term:
      id: GO:0070901
      label: mitochondrial tRNA methylation
  downstream:
  - target: Tissue-Specific Amplification of the Modification Defect in Skeletal Muscle
    causal_link_type: DIRECT
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, mt-tRNALeu(CUN) was found to have considerably decreased levels of the m1G37 modification in primary fibroblasts from both individuals, as demonstrated by increased readthrough past G37 (Figure 4B)."
    explanation: The direct measurement of the modification defect in patient cells.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The siRNA-mediated depletion of TRMT5 resulted in G37 hypomodification in mt-tRNALeu(CUN) in the RT-PEx assay, as observed for the samples derived from the affected individuals."
    explanation: >-
      Knockdown reproduces the patient phenotype in control cells - the forward half of the
      causal control pair.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in transduced 73901 fibroblasts, the expression of wild-type TRMT5 was found to reverse the hypomodification effect observed in fibroblasts from the affected individuals, resulting in m1G37 amounts matching those of the control individual"
    explanation: >-
      Rescue by wild-type cDNA - the reverse half of the causal control pair, and the strongest
      single piece of evidence that the modification defect is caused by the TRMT5 variants.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "The loss of m1G37 does not appear to impact tRNA stability, given that similar steady-state levels of mt-tRNALeu(CUN) are found in control and affected fibroblast cells (Figure S4A)."
    explanation: >-
      Refutes the proposition that the mechanism runs through loss of the tRNA pool, which is
      why the downstream node is a translation defect rather than a tRNA-depletion node.
- name: Tissue-Specific Amplification of the Modification Defect in Skeletal Muscle
  description: >-
    The hypomodification is not uniform across tissues. In the founding report the deficit was
    described as particularly prominent in skeletal muscle, with severely diminished pausing at
    G37 in muscle biopsy RNA - more marked than in the same patients' fibroblasts. The clinical
    correlate is direct and diagnostically important: in one of the two founding individuals,
    muscle respiratory-chain analysis showed decreased complex IV and borderline-low complex I
    activity while fibroblast studies were normal.

    This node is modelled explicitly rather than left as a caveat because it changes what a
    negative test means. A normal fibroblast respiratory-chain assay does not exclude COXPD26.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in TRMT5 were associated with the hypomodification of a guanosine residue at position 37 (G37) of mitochondrial tRNA; this hypomodification was particularly prominent in skeletal muscle."
    explanation: The tissue-specificity claim itself, in the authors' own words.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory-chain analysis in frozen muscle tissue showed decreased activity of respiratory complex IV and borderline-low complex I activity (Table 1), whereas fibroblast studies showed normal values."
    explanation: >-
      The muscle-versus-fibroblast discrepancy within a single patient, which is the
      diagnostically actionable form of this node.
- name: Impaired Mitochondrial Translation
  description: >-
    m1G37 sits immediately 3' of the anticodon and maintains reading-frame fidelity and
    translational efficiency; losing it degrades synthesis of the thirteen mtDNA-encoded
    respiratory-chain subunits. In COXPD26 this step is inferred rather than directly measured -
    the founding report measures the modification and the respiratory-chain output and reasons
    across the gap. It is measured directly, however, in the cybrid systems where an mtDNA point
    mutation creates a spurious TRMT5 substrate, which is why those papers are cited here with
    their indirectness marked.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is possible that the higher degree of mt-tRNA hypomodification detected in individual 65205 (Figure 4) and the consequent impairment of mitochondrial translation accounts for the more severe symptoms in this case (Table 1)."
    explanation: >-
      The authors' inference that hypomodification impairs translation, and their own hedge
      ("It is possible") is kept in the quote. INDIRECT because translation rate was not
      measured in these patients; the step is reasoned from modification to respiratory-chain
      output.
  - reference: PMID:29222331
    reference_title: "A hypertension-associated mitochondrial DNA mutation introduces an m(1)G37 modification into tRNA(Met), altering its structure and function."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "aberrant tRNAMet metabolism resulted in variable decreases in mitochondrial DNA (mtDNA)-encoded polypeptides in the mutant cybrids."
    explanation: >-
      Direct measurement that disturbed m1G37 status degrades synthesis of mtDNA-encoded
      polypeptides. INDIRECT for this disease because the cybrid model carries an mtDNA mutation
      that adds a spurious m1G37 site, the inverse of the TRMT5 loss curated here - the same
      modification, perturbed in the opposite direction.
  - reference: PMID:33398350
    reference_title: "A deafness-associated tRNA mutation caused pleiotropic effects on the m1G37 modification, processing, stability and aminoacylation of tRNAIle and mitochondrial translation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The aberrant tRNA metabolism resulted in the impairment of mitochondrial translation, respiratory deficiency, decreasing membrane potentials and ATP production"
    explanation: >-
      A second, independent demonstration that disturbed m1G37 status impairs mitochondrial
      translation and, downstream of it, respiration and ATP production. INDIRECT for the same
      reason as the item above: the mutation creates a spurious m1G37 site rather than removing
      one, so the modification is perturbed in the opposite direction from TRMT5 loss. Two
      cybrid systems perturbing the same modification in the same direction as each other, and
      opposite to this disease, is the strongest available support for a step that has never
      been measured in a COXPD26 patient.
- name: Combined Respiratory Chain Complex Deficiency
  description: >-
    Because every mtDNA-encoded subunit passes through the same translational bottleneck, the
    enzymology in muscle shows several complexes affected together rather than one. In the
    founding individuals this took the form of a marked histochemical and biochemical cytochrome
    c oxidase deficiency with a complex III defect in one, and decreased complex IV with
    borderline-low complex I in the other.

    This node is where the literature disagrees, and the entry does not resolve the
    disagreement - see the CONTROVERSY discussion. The 2022 neuropathy series found normal
    respiratory-chain activity in the skeletal muscle of all three of its patients bar a mild
    complex I decrease in one, despite giant mitochondria on morphology.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Multisystem Energy-Failure Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both affected individuals presented with lactic acidosis and evidence of multiple mitochondrial respiratory-chain-complex deficiencies in skeletal muscle"
    explanation: The defining biochemical phenotype, in both founding individuals.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent evaluation led to the diagnosis of a mitochondrial myopathy associated with a marked histochemical and biochemical deficiency of cytochrome c oxidase (COX), along with a defect in complex III activity."
    explanation: The specific complexes involved in the childhood-onset individual.
  - reference: PMID:35109800
    reference_title: "Novel heterozygous compound TRMT5 mutations associated with combined oxidative phosphorylation deficiency 26 in a Chinese family: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy also indicated reduced respiratory chain complex enzyme activities."
    explanation: >-
      A third independent report, and the second finding abnormal muscle enzymology. It matters
      for how the disagreement below should be weighed: the contradicting 2022 series is one
      report against two, not one against one. Read with one limitation the same paragraph
      states: "Unfortunately, the enzyme activity of COX could not be detected in our lab." COX
      is complex IV, which is the complex the founding report found most affected, so this
      report's panel is incomplete on precisely the axis the disagreement turns on. It supports
      abnormal enzymology; it cannot speak to which complexes.
  - reference: PMID:35342985
    reference_title: "A novel TRMT5 mutation causes a complex inherited neuropathy syndrome: The role of nerve pathology in defining a demyelinating neuropathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the proliferation of giant mitochondria, the mitochondrial respiratory chain complex activity in skeletal muscle was normal, except in one patient in whom there was a mild decrease in complex I enzyme activity."
    explanation: >-
      Refutes this node as an obligate feature of the disease. Three patients from three
      families with pathogenic TRMT5 variants and essentially normal muscle respiratory-chain
      enzymology. Recorded here rather than only in the discussion so that the contradicting
      result travels with the claim it contradicts.
- name: Multisystem Energy-Failure Phenotype
  description: >-
    The clinical endpoint, and the least uniform part of the disease. Reported presentations
    range from adult-onset exercise intolerance with exertional dyspnoea, through childhood
    failure to thrive with hypertrophic cardiomyopathy, to infantile severe developmental delay
    with demyelinating neuropathy, seizures, spastic diplegia, and hepatic and renal
    involvement. Lactic acidosis is the recurring biochemical accompaniment.

    The tissues that fail are the ones the founding authors predicted would: the heart is called
    out as specifically vulnerable to a diminished mitochondrial translation rate, a
    threshold-effect argument they draw from the shared cardiomyopathy across three
    tRNA-modification disorders.
  biological_scale: ORGANISM
  downstream:
  - target: Exercise Intolerance
    causal_link_type: DIRECT
  - target: Lactic Acidosis
    causal_link_type: DIRECT
  - target: Hypertrophic Cardiomyopathy
    causal_link_type: DIRECT
  - target: Demyelinating Peripheral Neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although the clinical presentation of the two affected subjects was remarkably different; one presented in childhood with failure to thrive and hypertrophic cardiomyopathy, and the other was an adult with a life-long history of exercise intolerance"
    explanation: >-
      The clinical heterogeneity, stated by the founding authors themselves and within one
      report, which is what makes it an observation rather than a comparison across studies.
  - reference: PMID:26189817
    reference_title: "TRMT5 Mutations Cause a Defect in Post-transcriptional Modification of Mitochondrial tRNA Associated with Multiple Respiratory-Chain Deficiencies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The presence of hypertrophic cardiomyopathy as a prominent and common phenotype in all three disorders indicates tissue-specific threshold effects; the heart is specifically vulnerable for a diminished mitochondrial translation rate."
    explanation: >-
      The authors' threshold-effect explanation for organ selectivity. INDIRECT because the
      argument is drawn across three different tRNA-modification disorders rather than from
      COXPD26 data alone.

- name: CDKN2A Alteration
  description: >-
    The tumour-suppressor gene CDKN2A was the most frequently altered gene, in 46% of a series of
    28, whose abstract does not say how it was altered; a 2025 review lists CDKN2A mutations and
    deletions in histiocytic sarcoma. The series reads cyclin-CDK4/6-INK4 signalling as cooperating
    with MAPK and PI3K signalling in the tumour. The process bound here, negative regulation of
    cyclin-dependent kinase activity, reads that INK4 signalling as the activity of the INK4 protein
    CDKN2A encodes; the abstract does not draw that link.

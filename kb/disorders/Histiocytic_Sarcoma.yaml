  description: >-
    Disease confined to one site, which carries the better outlook. In a pooled analysis of 27
    primary intracranial cases, median survival was 34.8 months with a solitary lesion against 4
    months with multifocal lesions; gross total resection and a solitary lesion predicted better
    survival, and resection was the only factor that did so independently. That paper divides
    against itself on radiotherapy, reporting a benefit in some of its own sentences and none in
    others; both sides are quoted below, and the entry draws no conclusion about radiotherapy in
    intracranial disease from it. In a cohort of 43 malignant histiocytoses from two US referral
    centres, 26 of them
    histiocytic sarcomas, 10 patients had unifocal disease (4 of them histiocytic sarcomas), with a
    median overall survival of 50 months against 10 months for multifocal disease, computed over the
    whole cohort rather than over the histiocytic sarcomas alone, a trend that did not reach
    significance (p = 0.07), which that paper's abstract nonetheless calls significantly shorter;
    the authors of that cohort read unifocal disease as one
    that surgery or radiation may control with durable remission, and a four-case series reports one
    of its own patients, with a localised hand lesion excised and irradiated, disease free twelve
    years later. In SEER, after censoring patients with bone marrow, spleen or reticuloendothelial
    involvement, those managed surgically had better overall survival (hazard ratio 0.33), a
    comparison not adjusted for fitness; a four-case series' account of a separate 330-case series
    likewise reports better survival with surgery, with or without radiation, in localised skin and
    connective tissue disease, and improved survival with adjuvant radiotherapy where adjuvant
    chemotherapy gave no similar benefit.

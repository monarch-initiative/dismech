pathophysiology:
- name: Somatic RAS-MAPK Pathway Mutation
  description: >-
    A recurrent driver in most tumours: in a series of 28, 57% carried a mutation in a RAS-MAPK
    pathway gene (MAP2K1, KRAS, NRAS, BRAF, PTPN11, NF1 or CBL), and in 16 secondary tumours with a
    lymphoid malignancy, histiocytic sarcoma pooled with dendritic-cell tumours, 14 did, KRAS most
    often. The histiocyte is bound as the cell of origin because the tumour cells are histiocytic
    cells of the monocyte/macrophage system; the cell in which the lesion first arises is not
    settled, somatic origin is stated only for single tumours (KRAS and MAP2K1 in histiocytic
    sarcomas, BRAF in a histiocytic/dendritic cell sarcoma) and not for the series, and in secondary
    tumours the clonal evidence points to a precursor shared with the earlier neoplasm.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: histiocyte
    term:
      id: CL:0000235
      label: macrophage
  genetic_context:
    variant_origin: SOMATIC
  evidence:
  - reference: PMID:30626916
    reference_title: >-
      Identification of diverse activating mutations of the RAS-MAPK pathway in histiocytic sarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified recurrent mutations involving the RAS-MAPK signaling pathway (MAP2K1, KRAS,
      NRAS, BRAF, PTPN11, NF1, CBL) in a majority (57%) of histiocytic sarcoma cases and report a
      clinical response to a MEK inhibitor (Cobimetinib) in a patient with a NF1-mutated histiocytic
      sarcoma.
    explanation: >-
      RAS-MAPK pathway mutations in 57% of 28 histiocytic sarcomas.
  - reference: PMID:32929178
    reference_title: >-

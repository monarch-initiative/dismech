progression:
- phase: Outcome
  description: >-
    Aggressive. The figures come from cohorts of different kinds and are given separately, and what
    disease extent does to them is in the two phases below. In the US SEER registry (159 adults,
    2000 to 2014), median overall survival was 6 months and 5-year disease-specific survival was
    42.3% in men and 33.6% in women, which the authors call similar; 5-year overall survival was
    similar for patients diagnosed in 2000 to 2007 and in 2008 to 2014. Survival did not differ
    significantly by primary site (P = .06) or between disease that was a first and a second primary
    cancer (P = .38), but median overall survival was 7 months with concomitant non-Hodgkin lymphoma
    and 10 months with acute myeloid leukaemia, against 16 months for histiocytic sarcoma alone, the
    paper's comparator. A 2021 case report's abstract and
    a 2025 review repeat the 6-month median, in the same words. In a French national series of 141
    malignant histiocytoses, median overall survival was 8.5 months for the subset classified as
    histiocytic sarcoma (43% of the 100 cases that could be subtyped), not significantly different
    from the interdigitating dendritic cell and Langerhans cell sarcomas in the same series; for the
    series as a whole 5-year overall survival was 31.3%, age and sex were not associated with
    survival, and primary and secondary disease did not differ significantly, though the secondary
    group spanned haematological disorders with very different outcomes. In a two-centre US cohort
    of 43 malignant histiocytoses, the 26 histiocytic sarcomas had a median of 17 months, again not
    significantly different from that cohort's Langerhans cell and interdigitating dendritic cell
    sarcomas. A single-centre series of 6 patients reported 52 months, a figure that disagrees with
    the rest.

- name: Histiocytic Marker Expression
  description: >-
    The cells express histiocytic markers including CD163, CD68 and lysozyme, and PU.1, and usually
    CD4, CD31, CD45 and CD45RO. The review reports PU.1 as expressed and elsewhere groups it with
    the markers that are usually positive; its summary table lists factor XIIIa in the panel too.
    The review says two different things about S100: its conclusion states that S100 is negative
    apart from focal weak reactivity in some cases, while its immunophenotype paragraph records
    variable S100 expression. Both are quoted below, attributed to where in the review each sits;
    this row adopts neither reading and records that the review gives both. The review also cautions
    that these markers are not specific for this disease. The review's abstract states negative
    staining with follicular dendritic cell and myeloid markers.

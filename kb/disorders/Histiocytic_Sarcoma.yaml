clinical_trials:
- name: NCT04079179
  phase: PHASE_II
  status: RECRUITING
  description: >-
    Cobimetinib, a MEK inhibitor, in Langerhans cell histiocytosis and other histiocytic disorders
    that have relapsed or not responded; four enrolment groups. The quote below carries the drug,
    its target and the refractory setting. It does not carry the eligibility: this disease is named
    in the registration's own conditions list, read from ClinicalTrials.gov on 2026-11-28, which the
    cached summary does not reproduce. This is not the completed cobimetinib study reported in
    PMID:30867592 and discussed under treatments, which registered as NCT02649972 and enrolled no
    patient with this disease; the present trial began in 2021 and has reported nothing.
  evidence:
  - reference: clinicaltrials:NCT04079179
    reference_title: >-
      A Phase 2 Study to Assess the Safety and Efficacy of Cobimetinib in Refractory Langerhans Cell
      Histiocytosis, LCH-Associated Neurodegenerative Disease, and Other Histiocytic Disorders.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      This is a research study of a drug called cobimetinib in children and adults diagnosed with
      Langerhans cell histiocytosis (LCH), and other histiocytic disorders that has returned or does
      not respond to treatment. Cobimetinib blocks activation of a protein called Mitogen-activated
      protein kinase (MEK) that is part of incorrect growth signals in histiocytosis cells.
    explanation: >-
      A registration record, not study evidence, and it reports no result. The quoted text
      establishes a trial of MEK inhibition in histiocytic disorders that have returned or not
      responded. It names this disease nowhere, so eligibility rests on the conditions list cited in
      the description rather than on the quote, and the grading is INDIRECT.
- name: NCT02523040
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Lenalidomide in adults with one of three histiocyte disorders. This disease is named in the
    trial's own summary, so its eligibility is stated rather than inferred.
  evidence:

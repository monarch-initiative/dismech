histopathology:
- name: Gross Appearance
  description: >-
    The tumour is often a fleshy mass with a greyish-white cut surface, in which haemorrhage and
    necrosis may be seen.
  evidence:
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Grossly, HS often appears as a fleshy mass with a grayish white cut surface. Hemorrhage and
      necrosis may be seen [ 1 ]
    explanation: >-
      The macroscopic appearance, which the review states immediately before the microscopic
      description and relays from its reference 1.
- name: Cytological Appearance
  description: >-
    The tumour is made of sheets of large, round to oval cells with abundant eosinophilic cytoplasm,
    oval to irregular nuclei with vesicular chromatin and variably prominent nucleoli. Nuclear
    atypia varies, binucleated or multinucleated cells are common, and mitoses may be frequent with
    necrosis common.
  evidence:
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, HS is composed of sheets of large, round to oval cells with abundant
      eosinophilic cytoplasm, oval to irregular nuclei with vesicular chromatin, and variably
      prominent nucleoli (Figure 1).
    explanation: >-
      The review's account of the tumour's appearance.
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nuclear atypia is variable. Binucleated or multinucleated cells are commonly observed [ 5 ]
    explanation: >-
      That the nuclear atypia varies, and the binucleated and multinucleated cells the review relays
      from its reference 5 and reports as common.
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitotic activity may be frequent, and necrosis is common.
    explanation: >-
      Mitoses and necrosis, from the same paragraph as the cytology sentence above.
- name: Inflammatory Background
  description: >-
    A prominent inflammatory background is usually present, most often of neutrophils and
    lymphocytes.
  notes: >-
    Bound to NCIT:C35978 Inflammatory Infiltrate rather than to NCIT:C35983 Lymphocytic Infiltrate.
    The two are siblings under NCIT:C35867 Morphologic Finding, not a general and a specific form of
    one thing: C35978 names an inflammatory infiltrate without saying what it is made of, which is
    what this row claims, while C35983 names a lymphocytic one and would drop the neutrophils the
    review reports.
  finding_term:
    preferred_term: prominent neutrophil-and-lymphocyte inflammatory background
    term:
      id: NCIT:C35978
      label: Inflammatory Infiltrate
  evidence:
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is usually a prominent inflammatory background, most often consisting of neutrophils and
      lymphocytes.
    explanation: >-
      The review's own statement of the inflammatory background and what it is made of.
- name: Diffuse Infiltration with Sinusoidal Distribution
  description: >-
    The tumour infiltrates soft tissue diffusely, and in lymph node, liver and spleen a sinusoidal
    distribution may be seen.
  finding_term:
    preferred_term: diffuse infiltrative growth with sinusoidal distribution
    term:
      id: NCIT:C41453
      label: Infiltrative Growth Pattern
  evidence:

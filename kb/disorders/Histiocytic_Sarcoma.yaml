  description: >-
    Some tumours may show significant pleomorphism, with focal areas of spindle cells. A spindled
    tumour is sometimes difficult to distinguish from undifferentiated pleomorphic sarcoma; the
    review notes that UPS is negative for PU.1, in contrast to histiocytic sarcoma.

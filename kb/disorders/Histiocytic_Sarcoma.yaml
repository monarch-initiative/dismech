- name: Secondary
  display_name: Secondary histiocytic sarcoma
  description: >-
    Arising with or after another haematological malignancy, often a B-cell lymphoma or leukaemia,
    or with a mediastinal germ cell tumour; the tumour can share the clone of the earlier neoplasm.
    A presumed transdifferentiation of an earlier haematolymphoid disorder can be shown in about a
    quarter of cases by one estimate. In a US registry of adults, 34 of 159 arose as a second
    primary malignancy after any earlier cancer, 13 of them after a named haematological one.

diagnosis:
- name: Biopsy with immunohistochemistry
  description: >-
    The diagnosis rests on biopsy morphology and an immunohistochemical panel: CD163, CD68, lysozyme
    and PU.1 positive, follicular dendritic cell and myeloid markers negative, with mimics such as
    carcinoma, lymphoma and neuroendocrine tumours excluded. A 2026 consensus asks for a minimum
    immunophenotypic panel, broad molecular profiling and a record of any earlier haematopoietic
    malignancy.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry plays a crucial role in the diagnosis of HS, showing expression of CD163,
      CD68, lysozyme, and PU.1 and negative staining with follicular dendritic cell markers and
      myeloid cell markers.
    explanation: >-
      The positive and the negative markers.
  - reference: PMID:25405526
    reference_title: >-
      Clinicopathologic characteristics and outcomes of histiocytic and dendritic cell neoplasms:
      the moffitt cancer center experience over the last twenty five years.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that histiocytic and dendritic cell neoplasms are very rare and perplexing
      disorders that should be diagnosed with a combination of judicious morphology review and a
      battery of immunohistochemistry to rule out mimics such as carcinoma, lymphoma, neuroendocrine
      tumors and to better sub-classify these difficult to diagnose lesions.
    explanation: >-
      Diagnosis by excluding mimics. INDIRECT: stated for the whole group of histiocytic and
      dendritic cell neoplasms.
  - reference: PMID:41915766
    reference_title: >-
      Consensus recommendations for malignant histiocytic neoplasms (histiocytic, Langerhans, and
      interdigitating dendritic cell sarcomas).
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Key recommendations include the adoption of a unified MHN designation, use of a minimum
      immunophenotypic panel, integration of broad molecular profiling, and the documentation of
      previous hematopoietic malignancy.
    explanation: >-
      The 2026 consensus work-up for malignant histiocytic neoplasms. INDIRECT: stated for the whole
      group.

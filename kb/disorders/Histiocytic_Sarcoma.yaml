name: Histiocytic Sarcoma
creation_date: '2026-11-21T00:06:12Z'
category: Cancer
categories:
- Histiocytic Neoplasm
- Hematologic Malignancy
synonyms:
- Sarcoma, histiocytic, malignant
description: >-
  Histiocytic sarcoma is a rare, aggressive malignant neoplasm of cells with the morphological and
  immunophenotypic features of mature tissue histiocytes (macrophages): the tumour cells express
  CD163, CD68 and lysozyme, and the diagnosis is made by excluding the tumours it resembles. It
  occurs frequently in adults and most often outside the lymph nodes; in a US registry of adults the
  median age was 63, the incidence 0.17 per million, and the commonest presenting sites the skin and
  connective tissue and the lymph nodes. It arises either alone or with or after another
  haematological malignancy, often a B-cell lymphoma or leukaemia whose clone it can share. Most
  tumours carry a RAS-MAPK pathway mutation. Median overall survival is about six months.

notes: >-
  Primary and secondary disease are thin subtype rows here; the secondary form's descent from a
  B-cell clone is one step. The genes with rows (KRAS, MAP2K1, BRAF, NF1, CDKN2A) are not placed on
  the nodes, because the cited abstracts list the mutated genes without the molecular activity each
  one carries. The CDKN2A node's process binding is the entry's reading of the series' INK4
  signalling, not an activity the abstracts state.

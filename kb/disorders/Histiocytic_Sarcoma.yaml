- phase: Multifocal or disseminated disease
  description: >-
    Disease at more than one site, or spread through the body, which carries a poor outlook. In the
    pooled intracranial cases median survival was 4 months with multifocal lesions against 34.8
    months with a solitary one, and in the two-centre US cohort 10 months against 50. In the US
    referral cohort, involvement of a risk organ (bone marrow, spleen or liver) went with a median
    overall survival of 5 months against 41 months without it, though a subset of patients with
    multifocal disease had durable responses to treatment. In the French national series,
    involvement of the spleen (median 4.9
    against 15.6 months) or of the central nervous system (2.5 against 15.6 months) was associated
    with shorter survival. The US and French series pool histiocytic sarcoma with dendritic-cell
    sarcomas; the intracranial figures are for histiocytic sarcoma alone. For haematopoietic and
    reticuloendothelial involvement, the same four-case series' account of that 330-case series
    reports better survival with chemotherapy, 15 against 0.5 months.

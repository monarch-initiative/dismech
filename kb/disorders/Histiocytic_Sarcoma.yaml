    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found mutations in RAS/MAPK pathway genes in 14/16 cases of sHDT associated with diverse
      mature and precursor B-cell and T-cell neoplasms, involving KRAS (8/16), BRAF (2/16), NRAS
      (2/16), MAP2K1 (1/16), and NF1 (1/16).
    explanation: >-
      RAS-MAPK pathway mutations in 14 of 16 secondary tumours, KRAS in 8. INDIRECT: histiocytic
      sarcoma is pooled with dendritic-cell tumours.

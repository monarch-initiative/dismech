notes: >-
  Primary and secondary disease are thin subtype rows here; the secondary form's descent from a
  B-cell clone is one step. The genes with rows (KRAS, MAP2K1, BRAF, NF1, CDKN2A) are not placed on
  the nodes, because no cited quote states a molecular activity for a gene as a finding about this
  disease. The review's own prose gives that activity for four of them inside its expanded gene
  names, not for NF1, which it expands only as neurofibromin 1; this entry quotes none of them.
  Where a source files one of these genes under a heading at all, the heading is a pathway, a
  function, or a gene class such as tumour suppressor, never a molecular activity - a pathway and a
  function respectively in the review's Table 2 rows for MAP2K1 and CDKN2A, quoted on the KRAS and
  CDKN2A rows, a gene class in the series' sentence, which this entry quotes, and in a sentence of
  the review's own, which it does not. For CDKN2A the review gives more than a heading: beyond
  filing it under cell-cycle regulation, the review relays a report of complete loss of p16 protein
  expression where the deletion is homozygous, which the gene's own row quotes. The CDKN2A node's
  process binding is the entry's reading of the series' INK4 signalling, and no cited quote states
  it as a finding about the disease: that p16 result reports protein expression, not the regulatory
  activity, and covers only the homozygous-deletion subset.

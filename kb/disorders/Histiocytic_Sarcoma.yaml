- name: MEK inhibitors
  description: >-
    Single-patient responses are reported in tumours with a RAS-MAPK pathway mutation, one within a
    28-case series and three in case reports: to cobimetinib in an NF1-mutated tumour, a near
    complete response to trametinib in a KRAS-mutated one, and a rapid response to selumetinib in a
    MAP2K1-mutated secondary tumour, with a sustained response to a BRAF and a MEK inhibitor
    together in a tumour classed as histiocytic/dendritic cell sarcoma. A 2026 consensus recommends
    targeted therapy for multifocal disease when an actionable mutation is present. None of the 18
    patients reported from the phase 2 trial of cobimetinib in histiocytic neoplasms had histiocytic
    sarcoma.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

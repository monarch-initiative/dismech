- name: Transdifferentiation from a B-Cell Clone
  description: >-
    In secondary disease the tumour can descend from the clone of an earlier B-cell lymphoma or
    leukaemia, which loses its B-cell phenotype and takes on a histiocytic one: the two tumours can
    share gene rearrangements and other genetic alterations.
  subtypes:
  - Secondary
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:42366059
    reference_title: >-
      Histiocytic sarcoma with a common clonal origin emerged after 33 years from B-cell precursor
      acute lymphoblastic leukemia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both neoplasms shared identical immunoglobulin heavy chain and T-cell receptor gene
      rearrangements, confirming a clonal relationship.
    explanation: >-
      A secondary histiocytic sarcoma clonally related to a B-cell precursor leukaemia 33 years
      earlier.
  - reference: PMID:41798885
    reference_title: >-
      Selumetinib as an Effective Therapy of Histiocytic Sarcoma Evolving From a B-Cell Acute
      Lymphoblastic Leukaemia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A shared IGK/TCRB rearrangements and PAX5 alterations between the leukaemic and histiocytic
      clones suggested transdifferentiation driven by PAX5.
    explanation: >-
      Rearrangements and PAX5 alterations shared by the leukaemic and the histiocytic clone, in a
      secondary tumour after B-cell acute lymphoblastic leukaemia.
  - reference: PMID:32929178
    reference_title: >-
      The mutational landscape of histiocytic sarcoma associated with lymphoid malignancy.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study confirms the role of the RAS/MAPK pathway in the pathogenesis of sHDT, provides
      further evidence of a common neoplastic precursor and, in the case of FL, gives additional
      insight into the stage in lymphomagenesis at which transdifferentiation may occur.
    explanation: >-
      A common neoplastic precursor and transdifferentiation from follicular lymphoma. INDIRECT:
      pooled with dendritic-cell tumours, and the 16 cases include T-cell as well as B-cell
      associations.
  - reference: PMID:30626916
    reference_title: >-
      Identification of diverse activating mutations of the RAS-MAPK pathway in histiocytic sarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, a subset of histiocytic sarcoma cases shows striking molecular genetic similarities
      to B cell lymphomas, supporting a clonal relationship between B cell neoplasms and a subset of
      histiocytic sarcomas.
    explanation: >-
      Molecular similarities to B-cell lymphomas in a subset, from which the authors infer a clonal
      relationship. INDIRECT: a resemblance to B-cell lymphomas as a class.
  - reference: PMID:32929178
    reference_title: >-
      The mutational landscape of histiocytic sarcoma associated with lymphoid malignancy.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we note that FL-associated sHDT frequently shares a similar mutational profile to
      the associated malignancy, identifying mutations in CREBBP or KMT2D in all cases
    explanation: >-
      A mutational profile like that of the associated follicular lymphoma, with CREBBP or KMT2D
      mutations in all cases. INDIRECT: pooled with dendritic-cell tumours.
  downstream:
  - target: Neoplastic Histiocyte Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

    reference_title: A Phase II Study of Lenalidomide for Adult Histiocyte Disorders
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      This research study is studying a chemotherapy drug Lenalidomide as a possible treatment for
      one of three histiocyte disorders: Langerhans cell histiocytosis (LCH), Erdheim-Chester
      disease (ECD), or histiocytic sarcoma (HS).
    explanation: >-
      A registration record, not study evidence. The summary names this disease as one of the three

progression:
- phase: Outcome
  description: >-
    Aggressive, especially when disseminated. In a US registry of 159 adults, median overall
    survival was 6 months, and 5-year survival was similar for patients diagnosed in 2000 to 2007
    and in 2008 to 2014; a 2021 case report's abstract and a 2025 review repeat the same median, in
    the same words. A single-centre series of 6 patients reported 52 months, a figure that disagrees
    with the rest.
  evidence:
  - reference: PMID:29183888
    reference_title: >-
      Histiocytic sarcoma: a population-based analysis of incidence, demographic disparities, and
      long-term outcomes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median overall survival (OS) in the entire cohort of HS was 6 months (Figure 1A).
    explanation: >-
      Median overall survival of 6 months in the registry cohort.
  - reference: PMID:29183888
    reference_title: >-
      Histiocytic sarcoma: a population-based analysis of incidence, demographic disparities, and
      long-term outcomes.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the incidence of HS significantly increased over time (P = .006), the 5-year OS was
      similar between patients diagnosed from 2000 to 2007 and 2008 to 2014 (Figure 1D).
    explanation: >-
      5-year survival similar across the two periods, while the incidence rose.
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median overall survival from the time of diagnosis is approximately six months.
    explanation: >-
      A median of about six months, as the 2025 review states.
  - reference: PMID:33671860
    reference_title: >-
      Histiocytic Sarcoma: Challenging Course, Dismal Outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median overall survival from the time of diagnosis is approximately six months.
    explanation: >-
      The same sentence, in a 2021 case report's abstract.
  - reference: PMID:33671860
    reference_title: >-
      Histiocytic Sarcoma: Challenging Course, Dismal Outcome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No standardized treatment for HS exists and especially in a disseminated disease the clinical
      course is overly aggressive with a dismal outcome.
    explanation: >-
      A dismal outcome in disseminated disease.
  - reference: PMID:25405526
    reference_title: >-
      Clinicopathologic characteristics and outcomes of histiocytic and dendritic cell neoplasms:
      the moffitt cancer center experience over the last twenty five years.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median overall survival was not reached in cases with LCH and showed 52 months in cases with
      HS, 12 months in cases with FDCS, 58 months in cases with IDCS, 13 months in the case of
      INDCS, and 51 months in the case of FRCT.
    explanation: >-
      52 months in 6 patients at one centre, against the registry's 6.

- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  relationship_type: COOPERATING
  variant_origin: UNKNOWN
  notes: >-
    A tumour-suppressor gene, and the most frequently altered gene in a series of 28 (46%), whose
    authors read cyclin-CDK4/6-INK4 signalling as cooperating with MAPK and PI3K signalling. That
    series' abstract does not say how CDKN2A was altered; a 2025 review lists CDKN2A mutations and
    deletions in histiocytic sarcoma, files the gene under cell-cycle regulation, gives its
    alteration frequency as 39 to 46%, and relays a report of complete loss of p16 protein
    expression in the homozygous-deletion cases, all quoted on this row. Neither reports the origin
    of the CDKN2A change itself; the only statement in the review that bears on origin is a framing
    clause introducing somatic mutations, which names no gene and speaks of mutations where the
    review lists CDKN2A mutations or deletions. So the variant origin is recorded as unknown. The
    relationship is recorded as cooperating, which holds whether the change is somatic or inherited.
    The series names cyclin-CDK4/6-INK4 signalling rather than CDKN2A itself, so it supports that
    reading only through the step from the gene to the INK4 protein; the review states the
    cooperation of the gene, relaying one study of CDKN2A with PTEN, and that quote is on this row.
  evidence:
  - reference: PMID:30626916
    reference_title: >-
      Identification of diverse activating mutations of the RAS-MAPK pathway in histiocytic sarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the tumor-suppressor gene CDKN2A was the most frequently altered gene (46%).
    explanation: >-
      CDKN2A altered in 46% of the series of 28.
  - reference: PMID:30626916
    reference_title: >-
      Identification of diverse activating mutations of the RAS-MAPK pathway in histiocytic sarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support a cooperative role for MAPK, PI3K, and cyclin-CDK4/6-INK4 signaling in
      the pathogenesis of histiocytic sarcoma and provide a rational basis for targeting these
      pathways.
    explanation: >-
      The cooperative role the authors give cyclin-CDK4/6-INK4 signalling. INDIRECT: their reading
      of mutation data, and the sentence names the signalling, not CDKN2A.
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several genomic alterations have been identified in HS, including mutations involving the
      RAS/MAPK and PI3K/AKT/mTOR signaling pathways, CDKN2A mutations/deletions, and TP53 mutations.
    explanation: >-
      CDKN2A mutations and deletions among the alterations found in histiocytic sarcoma.
  - reference: PMID:40943476
    reference_title: >-
      Histiocytic Sarcoma: A Review and Update.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intriguingly, all cases with homozygous CDKN2A deletion revealed complete loss of p16 protein
      expression [ 23 ]
    explanation: >-
      The p16 result the review relays, under its own reference 23, for the homozygous-deletion

      label: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The most often mutated RAS-MAPK gene in secondary tumours (8 of 16, pooled with dendritic-cell
    tumours); listed among the RAS-MAPK genes of a series of 28. The cited abstracts give no figure
    for KRAS across all histiocytic sarcomas.
  evidence:
  - reference: PMID:30626916
    reference_title: >-
      Identification of diverse activating mutations of the RAS-MAPK pathway in histiocytic sarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified recurrent mutations involving the RAS-MAPK signaling pathway (MAP2K1, KRAS,
      NRAS, BRAF, PTPN11, NF1, CBL) in a majority (57%) of histiocytic sarcoma cases and report a
      clinical response to a MEK inhibitor (Cobimetinib) in a patient with a NF1-mutated histiocytic
      sarcoma.
    explanation: >-
      KRAS among the RAS-MAPK genes mutated in 57% of 28 histiocytic sarcomas.

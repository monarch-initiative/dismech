notes: >-
  Nosological relationship to MONDO:0014974 (sudden cardiac failure,
  alcohol-induced): OMIM and MONDO maintain two distinct autosomal recessive
  PPA2-related entries based on clinical presentation and onset—sudden cardiac
  failure, infantile (SCFI; OMIM:617222; MONDO:0014973; Guimier et al.,
  PMID:27523598) and sudden cardiac failure, alcohol-induced (SCFAI;
  OMIM:617223; MONDO:0014974; Kennedy et al., PMID:27523597). Functional and
  clinical cohort studies (PMID:27523597; PMID:34400813) show that these two
  allelic disorders reflect different levels of residual mitochondrial inorganic
  pyrophosphatase 2 (PPA2) activity and distinct acute metabolic triggers:
  lower-activity genotypes (such as homozygous p.Pro167Leu or compound
  heterozygous p.Glu172Lys paired with a severe or truncating allele) present in
  the neonatal period, infancy, or early childhood (frequently precipitated by
  febrile viral illness, corresponding to MONDO:0014973), whereas compound
  heterozygous genotypes retaining higher residual activity (classically pairing
  p.Pro228Leu with a lower-activity allele such as p.Glu172Lys) permit survival
  into adolescence or adulthood with sudden cardiac arrest triggered by modest
  ethanol/acetic acid intake (corresponding to MONDO:0014974).
references:
- reference: PMID:27523598
  title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
  findings:
  - statement: >-
      Compound heterozygous missense variants in PPA2 cause sudden unexpected
      cardiac arrest between 4 and 20 months of age, and pathogenic PPA2
      variants rapidly collapse the mitochondrial inner membrane electrical
      potential in yeast complementation models.
    supporting_text: >-
      Using a regulatable (doxycycline-repressible) gene expression system, we
      found that the pathogenic PPA2 mutations rapidly inactivate the
      mitochondrial energy transducing system and prevent the maintenance of a
      sufficient electrical potential across the inner membrane, which explains
      the subsequent disappearance of mitochondria from the mutant yeast cells.
    evidence:
    - reference: PMID:27523598
      reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using a regulatable (doxycycline-repressible) gene expression system, we
        found that the pathogenic PPA2 mutations rapidly inactivate the
        mitochondrial energy transducing system and prevent the maintenance of a
        sufficient electrical potential across the inner membrane, which
        explains the subsequent disappearance of mitochondria from the mutant
        yeast cells.
      explanation: >-
        Demonstrates the mechanistic link between pathogenic PPA2 variants and
        collapse of the inner mitochondrial membrane potential.
- reference: PMID:27523597
  title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
  findings:
  - statement: >-
      Biallelic hypomorphic variants in PPA2 reduce mitochondrial inorganic
      pyrophosphatase activity in correlation with clinical severity (5%–10%
      residual activity in infantile-lethal p.Pro167Leu and p.Glu172Lys versus
      24%–28% in p.Pro228Leu), cause mid-myocardial fibrosis, and sensitize the
      myocardium to ACSS1-mediated PPi generation from ethanol/acetic acid.
    supporting_text: >-
      Comparison of normal and mutant PPA2-containing mitochondria from
      fibroblasts showed that the activity of inorganic pyrophosphatase was
      significantly reduced in affected individuals. Recombinant PPA2 enzymes
      modeling hypomorphic missense mutations had decreased activity that
      correlated with disease severity.
    evidence:
    - reference: PMID:27523597
      reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Comparison of normal and mutant PPA2-containing mitochondria from
        fibroblasts showed that the activity of inorganic pyrophosphatase was
        significantly reduced in affected individuals. Recombinant PPA2 enzymes
        modeling hypomorphic missense mutations had decreased activity that
        correlated with disease severity.
      explanation: >-
        Establishes that residual PPA2 enzymatic activity correlates with
        clinical severity across infantile and adolescent presentations.
- reference: PMID:34400813
  title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
  findings:
  - statement: >-
      In a cohort of 34 individuals from 20 families (expanding the world total
      to 56 patients from 30 families), 28 died (15 of sudden cardiac arrest, 13
      of acute heart failure), focal myocardial fibrosis was present in 15 of 17
      evaluated cases, and adult survivors developed progressive peripheral
      axonal neuropathy, external ophthalmoplegia, ptosis, or spastic cerebellar
      ataxia.
    supporting_text: >-
      Among the 34 individuals, only 6 remain alive. Twenty-three died before
      the age of 2 years while five died between 14 and 16 years. Within these
      28 cases, 15 died of sudden cardiac arrest and 13 of acute heart failure.
    evidence:
    - reference: PMID:34400813
      reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among the 34 individuals, only 6 remain alive. Twenty-three died before
        the age of 2 years while five died between 14 and 16 years. Within these
        28 cases, 15 died of sudden cardiac arrest and 13 of acute heart
        failure.
      explanation: >-
        Summarizes the natural history and mortality of biallelic PPA2
        deficiency in the largest published cohort.

name: Sudden cardiac failure, infantile
creation_date: '2026-10-14T11:36:00Z'
category: Mendelian
synonyms:
- SCFI
- sudden cardiac failure, infantile, autosomal recessive
- PPA2-related sudden cardiac death
- PPA2-associated sudden cardiac death
- mitochondrial inorganic pyrophosphatase 2 deficiency
description: >-
  Sudden cardiac failure, infantile (SCFI; MONDO:0014973) is an autosomal
  recessive mitochondrial cardiomyopathy and sudden cardiac death disorder
  caused by biallelic hypomorphic or compound heterozygous pathogenic variants
  in PPA2, which encodes mitochondrial inorganic pyrophosphatase 2. PPA2
  hydrolyzes inorganic pyrophosphate (PPi) to orthophosphate within the
  mitochondrial matrix, driving PPi-generating biosynthetic and metabolic
  reactions forward. Deficient PPA2 activity causes intramitochondrial PPi
  accumulation, impairs mitochondrial inner membrane potential maintenance and
  oxidative phosphorylation energy transduction in cardiomyocytes, and leads to
  cardiomyocyte loss, focal or mid-myocardial replacement fibrosis, dilated
  cardiomyopathy, ventricular tachyarrhythmias (including ventricular
  fibrillation), acute cardiogenic shock, and sudden unexpected cardiac arrest.
  SCFI classically presents in the neonatal period, infancy, or early childhood
  (frequently precipitated by febrile viral illness), with severe alleles also
  causing neonatal lactic acidosis, seizures, and hypotonia, and surviving
  patients remaining at risk for chronic progressive neurological manifestations
  (peripheral axonal neuropathy, external ophthalmoplegia, ptosis, and spastic
  cerebellar ataxia). It is allelic with sudden cardiac failure, alcohol-induced
  (SCFAI; MONDO:0014974), a distinct MONDO disorder in which biallelic PPA2
  genotypes retaining higher residual enzymatic activity (such as compound
  heterozygosity pairing p.Pro228Leu with p.Glu172Lys) present in adolescence or
  adulthood with sudden cardiac arrest triggered by small amounts of alcohol.

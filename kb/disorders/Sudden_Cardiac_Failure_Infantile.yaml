environmental:
- name: Viral infection and febrile illness (hyperthermia)
  disease_effect: TRIGGERS
  causal_role: MODIFIER
  exposure_term:
    preferred_term: exposure to virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  description: >-
    Mild intercurrent viral infections (respiratory or gastrointestinal) and the
    accompanying febrile response (hyperthermia) frequently precipitate acute
    cardiac decompensation or sudden cardiac arrest in infants and young children
    with biallelic PPA2 variants. Elevated body temperature further destabilizes
    thermolabile mutant PPA2 enzymes, causing acute intramitochondrial PPi
    accumulation and myocardial ATP crisis.
  evidence:
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infection induces the cellular response of hyperthermia, which in the case
      of PPA2-deficient individuals may mean a further reduction in residual
      PPA2 enzyme function. We propose that this may be the mechanism that
      affects their cardiac tissue, ultimately resulting in sudden death.
    explanation: >-
      Proposes how infection-induced hyperthermia further reduces residual mutant
      PPA2 activity and triggers acute cardiac decompensation and sudden death.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that viral infections in affected individuals may tip the
      cardiac muscle into ATP deficit, due to a build-up of PPi following the
      effects of temperature increase on the already deficient PPA2 enzyme of
      these individuals.
    explanation: >-
      Links viral infection and fever to PPi buildup and myocardial ATP
      deficit in PPA2-deficient patients.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For 11 variants, recombinant PPA2 enzyme activities were significantly
      decreased and sensitive to temperature, compared to wild-type PPA2 enzyme
      activity.
    explanation: >-
      Demonstrates experimentally that pathogenic recombinant PPA2 variants are
      temperature-sensitive in vitro.
  influences_mechanisms:
  - target: Mitochondrial inorganic pyrophosphatase 2 (PPA2) enzymatic deficiency
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Fever/hyperthermia during viral infection further reduces the residual
      catalytic activity of temperature-sensitive mutant PPA2 enzymes.
    evidence:
    - reference: PMID:34400813
      reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        For 11 variants, recombinant PPA2 enzyme activities were significantly
        decreased and sensitive to temperature, compared to wild-type PPA2 enzyme
        activity.
      explanation: >-
        Directly demonstrates in vitro temperature sensitivity of mutant
        recombinant PPA2 enzymes.
    - reference: PMID:34400813
      reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Infection induces the cellular response of hyperthermia, which in the
        case of PPA2-deficient individuals may mean a further reduction in
        residual PPA2 enzyme function. We propose that this may be the mechanism
        that affects their cardiac tissue, ultimately resulting in sudden death.
      explanation: >-
        Supports thermal exacerbation of residual PPA2 enzymatic deficiency
        during febrile viral illness.
- name: Ethanol (alcohol) and acetic acid / vinegar exposure
  disease_effect: TRIGGERS
  causal_role: MODIFIER
  exposure_term:
    preferred_term: exposure to ethanol
    term:
      id: ECTO:9000027
      label: exposure to ethanol
  chemicals:
  - Ethanol
  - Acetic acid
  description: >-
    Ingestion of even small amounts of ethanol (alcohol) or acetic
    acid/vinegar-containing foods can trigger acute chest pain, bradycardia, and
    lethal sudden cardiac arrest in adolescents and adults with hypomorphic
    biallelic PPA2 variants (the clinical phenotype designated sudden cardiac
    failure, alcohol-induced; MONDO:0014974). Ethanol is oxidized via
    acetaldehyde to acetic acid, which is activated to acetyl-CoA in cardiac
    mitochondria by short-chain acyl-CoA synthetases (such as ACSS1), generating
    equimolar intramitochondrial inorganic pyrophosphate (PPi) that overwhelms
    deficient PPA2 activity.
  evidence:
  - reference: PMID:27523597
    reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ethanol is oxidized to acetaldehyde and further to acetic acid.13
      Resulting acetic acid has to be activated to acetyl-coenzyme A, which is
      accompanied by the formation of equimolar amounts of PPi (Figure S7). This
      esterification reaction is catalyzed by short-chain acyl-CoA synthetases
      encoded, for example, by ACSS1 (MIM: 614355), an enzyme with high
      expression in heart mitochondria.14
    explanation: >-
      Defines the biochemical mechanism by which ethanol oxidation and
      ACSS1-mediated acetate activation generate intramitochondrial PPi in
      cardiomyocytes, precipitating acute decompensation in PPA2 deficiency.
  influences_mechanisms:
  - target: Mitochondrial matrix inorganic pyrophosphate accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      ACSS1-mediated esterification of ethanol-derived acetic acid generates an
      acute intramitochondrial PPi surge that cannot be hydrolyzed by deficient
      PPA2, directly exacerbating mitochondrial matrix PPi accumulation.
    evidence:
    - reference: PMID:27523597
      reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ethanol is oxidized to acetaldehyde and further to acetic acid.13
        Resulting acetic acid has to be activated to acetyl-coenzyme A, which is
        accompanied by the formation of equimolar amounts of PPi (Figure S7).
        This esterification reaction is catalyzed by short-chain acyl-CoA
        synthetases encoded, for example, by ACSS1 (MIM: 614355), an enzyme with
        high expression in heart mitochondria.14
      explanation: >-
        Establishes that ethanol-derived acetic acid activation generates
        equimolar PPi in heart mitochondria, directly overloading the
        PPi-dependent mitochondrial energy-transducing system.
diagnosis:
- name: Molecular genetic testing of PPA2
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of biallelic (homozygous or compound heterozygous) pathogenic
    variants in PPA2 by multigene cardiomyopathy/arrhythmia panel, exome or
    genome sequencing (including postmortem molecular autopsy from dried blood
    spots), or long-read sequencing to phase de novo or structural variants.
  description: >-
    Definitive diagnosis requires identification of biallelic pathogenic variants
    in PPA2. Because respiratory chain enzyme activities in skeletal muscle and
    skin fibroblasts are typically normal, molecular genetic testing and cascade
    carrier/sibling screening are essential for diagnosis, including postmortem
    molecular autopsy in unexplained infantile sudden death or suspected viral
    myocarditis.
  evidence:
  - reference: PMID:27523598
    reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report seven individuals from three families affected by sudden
      and unexpected cardiac arrest between 4 and 20 months of age. Whole-exome
      sequencing revealed compound heterozygous missense mutations in PPA2 in
      affected infants of each family.
    explanation: >-
      Demonstrates that whole-exome sequencing establishes the molecular
      diagnosis by identifying biallelic PPA2 mutations in affected infants.
  - reference: PMID:33028643
    reference_title: "Postmortem diagnosis of PPA2-associated sudden cardiac death from dried blood spot in a neonate presenting with vocal cord paralysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, molecular autopsy via whole-genome sequencing from newborn
      dried blood spot identified compound heterozygous mutations in PPA2, with
      a paternally inherited, pathogenic missense variant (c.514G > A;
      p.Glu172Lys) and a novel, maternally inherited missense variant of
      uncertain significance (c.442A > T; p.Thr148Ser).
    explanation: >-
      Demonstrates postmortem diagnosis of biallelic PPA2 deficiency by
      whole-genome sequencing from archived newborn dried blood spots.
- name: Cardiac magnetic resonance imaging (CMR) with late gadolinium enhancement
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging of the Heart
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  results: >-
    Demonstrates focal, patchy, or circumferential mid-myocardial and
    subepicardial late gadolinium enhancement (myocardial fibrosis), frequently
    present even in clinically asymptomatic individuals with biallelic PPA2
    variants.
  description: >-
    Cardiac MRI is the most sensitive non-invasive modality to detect subclinical
    or overt myocardial fibrosis in PPA2 deficiency and is recommended for
    evaluation and longitudinal surveillance of at-risk or biallelic siblings.
  evidence:
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal myocardial fibrosis upon histology and/or cardiac MRI was reported
      in 15 of 17 cases for which data were available. Such an observation
      should alert physicians to possible PPA2 dysfunction regardless of the
      clinical presentation and even in asymptomatic individuals.
    explanation: >-
      Establishes cardiac MRI detection of focal myocardial fibrosis as a key
      diagnostic clue to PPA2 dysfunction, even in asymptomatic individuals.
  - reference: PMID:27523597
    reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac MRI showed marked mid-myocardial fibrosis in both siblings (P4
      shown in Figure 2). They subsequently each received an implantable
      defibrillator for primary prophylaxis of sudden arrhythmic cardiac death,
      although no events have occurred to date.
    explanation: >-
      Demonstrates that cardiac MRI detects marked mid-myocardial fibrosis in
      asymptomatic biallelic siblings, guiding prophylactic ICD placement.
- name: Transthoracic echocardiography
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: >-
    May show acute or chronic left ventricular dilation and systolic dysfunction
    (dilated cardiomyopathy) during decompensation, or may be entirely normal
    prior to sudden arrhythmic cardiac arrest despite underlying mid-myocardial
    fibrosis on cardiac MRI.
  description: >-
    Echocardiography diagnoses dilated cardiomyopathy and ventricular systolic
    dysfunction in patients presenting with acute heart failure, though a normal
    echocardiogram does not exclude PPA2 deficiency or myocardial fibrosis.
  evidence:
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the latter group of 13 individuals, dilated cardiomyopathy or
      ventricular dysfunction was usually diagnosed by echocardiography, rapidly
      followed by multiorgan failure and/or ventricular fibrillation (VF,
      reported for six cases).
    explanation: >-
      Documents echocardiography as the primary modality diagnosing dilated
      cardiomyopathy and ventricular dysfunction in patients presenting with
      acute heart failure.
differential_diagnoses:
- name: Viral myocarditis
  disease_term:
    preferred_term: viral myocarditis
    term:
      id: MONDO:0023161
      label: viral myocarditis
  description: >-
    Infants and young children with biallelic PPA2 deficiency frequently present
    with acute heart failure, cardiogenic shock, or sudden cardiac arrest
    shortly after a febrile viral respiratory or gastrointestinal illness, and
    a subset show mild myocardial inflammatory infiltrates on autopsy or biopsy,
    closely mimicking acute viral myocarditis.
  distinguishing_features:
  - >-
    Prominent focal or mid-myocardial collagen fibrosis (present in ~88% of
    evaluated PPA2 cases and always accompanying any inflammatory infiltrate)
    on cardiac MRI or histology
  - >-
    Familial recurrence of sudden unexpected cardiac arrest or acute heart
    failure in siblings
  - >-
    Identification of biallelic pathogenic variants in PPA2 on molecular
    genetic testing
  evidence:
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irrespective of the main clinical presentation, myocardial fibrosis was
      reported in 15 cases in our cohort, either at necropsy or on cardiac MRI,
      whereas an inflammatory infiltrate was noted in only 6 cases and always in
      combination with fibrosis. Thus, fibrosis may help discriminate between
      PPA2-related cardiomyopathy and viral myocarditis when individuals present
      with acute heart failure.
    explanation: >-
      Highlights viral myocarditis as the principal clinical differential
      diagnosis during acute heart failure and identifies prominent myocardial
      fibrosis and PPA2 genetic testing as the key discriminating features.
- name: Sudden cardiac failure, alcohol-induced
  disease_term:
    preferred_term: sudden cardiac failure, alcohol-induced
    term:
      id: MONDO:0014974
      label: sudden cardiac failure, alcohol-induced
  description: >-
    Sudden cardiac failure, alcohol-induced (SCFAI; OMIM:617223; MONDO:0014974)
    is an allelic autosomal recessive disorder caused by biallelic hypomorphic
    variants in PPA2—classically compound heterozygosity pairing the milder
    hypomorphic allele p.Pro228Leu (24%–28% residual enzymatic activity) in
    trans with a lower-activity allele such as p.Glu172Lys (5%–10% residual
    activity)—in which sudden cardiac arrest is triggered in adolescence or
    adulthood by ingestion of small amounts of alcohol.
  distinguishing_features:
  - >-
    SCFI (MONDO:0014973) typically presents in the neonatal, infantile, or
    early-childhood period (often triggered by febrile viral illness) in
    individuals whose biallelic PPA2 genotypes confer lower total residual
    enzymatic activity (e.g., 5%–10% for p.Pro167Leu and p.Glu172Lys)
  - >-
    SCFAI (MONDO:0014974) typically presents in adolescence or adulthood with
    sudden cardiac arrest precipitated by small amounts of alcohol in
    individuals carrying at least one milder hypomorphic allele with higher
    residual PPA2 activity (~24%–28% for p.Pro228Leu, often in compound
    heterozygosity with p.Glu172Lys)
  evidence:
  - reference: PMID:27523597
    reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared to wild-type, the p.Pro167Leu and p.Glu172Lys variants showed
      5%–10% residual activity at PPi substrate concentrations 18–500 μmol/L.
      The p.Pro228Leu variant had a residual activity of 24%–28% in this
      concentration range compared to wild-type (Figure 3D).
    explanation: >-
      Demonstrates that the infantile-onset (MONDO:0014973) and adolescent
      alcohol-induced (MONDO:0014974) forms of PPA2 deficiency are stratified by
      the residual mitochondrial pyrophosphatase activity of the underlying
      missense alleles (5%–10% for p.Pro167Leu and p.Glu172Lys versus 24%–28%
      for p.Pro228Leu).

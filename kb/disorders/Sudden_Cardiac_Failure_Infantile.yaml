  - target: Mitochondrial matrix inorganic pyrophosphate accumulation
    description: >-
      Loss of mitochondrial inorganic pyrophosphatase catalytic activity and
      temperature-induced inactivation of residual mutant PPA2 prevent clearance
      of intramitochondrial inorganic pyrophosphate (PPi), causing PPi buildup
      within the mitochondrial matrix.

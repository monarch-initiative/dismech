- name: Mitochondrial bioenergetic failure and ATP depletion
  description: >-
    Dissipation of the inner mitochondrial membrane potential and impaired
    oxidative phosphorylation (with normal-to-moderately reduced complex I and
    IV respiratory chain activities in cardiac tissue) cause acute or chronic
    cellular ATP depletion in high-energy-demand tissues. Cardiomyocytes are
    most vulnerable during acute metabolic or thermal stress, while neonates
    with severe alleles develop systemic lactic acidosis, seizures, and
    hypotonia, and older survivors develop chronic ATP-deficiency injury in
    peripheral nerves, extraocular/eyelid muscles, and cerebellar pathways.

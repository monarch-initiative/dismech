    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Ethanol is oxidized to acetaldehyde and further to acetic acid.13
      Resulting acetic acid has to be activated to acetyl-coenzyme A, which is
      accompanied by the formation of equimolar amounts of PPi (Figure S7). This
      esterification reaction is catalyzed by short-chain acyl-CoA synthetases
      encoded, for example, by ACSS1 (MIM: 614355), an enzyme with high
      expression in heart mitochondria.14
    explanation: >-
      Describes the biochemical source of intramitochondrial PPi formation in
      heart mitochondria during acetate/ethanol activation.

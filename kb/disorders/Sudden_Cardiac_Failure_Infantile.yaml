clinical_burden:
  burden_level: HIGH
  rationale: >-
    Biallelic PPA2 deficiency carries an exceptionally high mortality rate in
    infancy, early childhood, and adolescence: in the largest international
    cohort of 34 affected individuals, 28 (82%) died—23 before 2 years of age
    and 5 between 14 and 16 years of age—from sudden unexpected cardiac arrest
    or acute heart failure. Survivors require lifelong cardiology surveillance,
    strict avoidance of alcohol and fever triggers, implantable
    cardioverter-defibrillator placement, or orthotopic heart transplantation,
    and may develop progressive peripheral axonal neuropathy, external
    ophthalmoplegia, or cerebellar ataxia in adulthood.
  evidence:
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 34 individuals, only 6 remain alive. Twenty-three died before
      the age of 2 years while five died between 14 and 16 years. Within these
      28 cases, 15 died of sudden cardiac arrest and 13 of acute heart failure.
    explanation: >-
      Demonstrates the high lethality of biallelic PPA2 deficiency, with 28 of
      34 patients in the series dying in infancy or adolescence from sudden
      cardiac arrest or acute heart failure.
pathophysiology:
- name: Mitochondrial inorganic pyrophosphatase 2 (PPA2) enzymatic deficiency
  description: >-
    Biallelic hypomorphic missense variants or compound heterozygous
    missense/truncating variants in PPA2 severely reduce mitochondrial inorganic
    pyrophosphatase activity in the mitochondrial matrix. Because PPA2
    catalyzes the hydrolysis of inorganic pyrophosphate (PPi) into two
    orthophosphate ions, reduced PPA2 activity impairs PPi clearance during
    high-flux mitochondrial biosynthetic reactions (DNA, RNA, protein, and
    lipid synthesis) and short-chain fatty-acid/acetate activation. Residual
    enzymatic activity of recombinant mutant PPA2 proteins correlates with age
    at onset and clinical severity: variants associated with neonatal or early
    infantile lethality (such as p.Pro167Leu and p.Glu172Lys) retain only
    5%–10% wild-type activity, whereas variants permissive for survival into
    adolescence (such as p.Pro228Leu) retain 24%–28% activity. Furthermore,
    missense PPA2 variants exhibit temperature sensitivity in vitro, so febrile
    viral illnesses or modest ethanol/acetic acid loads acutely overwhelm
    residual PPi hydrolysis capacity.

    reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPA2 encodes the mitochondrial pyrophosphatase, which hydrolyzes inorganic
      pyrophosphate into two phosphates. This is an essential activity for many
      biosynthetic reactions and for energy metabolism of the cell.
    explanation: >-
      Defines the canonical molecular function of PPA2 as mitochondrial
      inorganic pyrophosphate hydrolysis required for cellular biosynthetic
      reactions and energy metabolism.
  - reference: PMID:27523597
    reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Comparison of normal and mutant PPA2-containing mitochondria from
      fibroblasts showed that the activity of inorganic pyrophosphatase was
      significantly reduced in affected individuals. Recombinant PPA2 enzymes
      modeling hypomorphic missense mutations had decreased activity that
      correlated with disease severity.
    explanation: >-
      Demonstrates significantly reduced mitochondrial pyrophosphatase activity
      in patient fibroblast mitochondria and establishes that residual activity
      of recombinant mutant PPA2 enzymes correlates with clinical severity.
  - reference: PMID:27523597
    reference_title: "Sudden Cardiac Death Due to Deficiency of the Mitochondrial Inorganic Pyrophosphatase PPA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared to wild-type, the p.Pro167Leu and p.Glu172Lys variants showed
      5%–10% residual activity at PPi substrate concentrations 18–500 μmol/L.
      The p.Pro228Leu variant had a residual activity of 24%–28% in this
      concentration range compared to wild-type (Figure 3D).
    explanation: >-
      Quantifies residual pyrophosphatase activity for key pathogenic missense
      variants, linking lower residual enzymatic activity (5%–10% for
      p.Pro167Leu and p.Glu172Lys) to infantile onset and higher residual
      activity (24%–28% for p.Pro228Leu) to later-onset alcohol-triggered
      presentations.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For 11 variants, recombinant PPA2 enzyme activities were significantly
      decreased and sensitive to temperature, compared to wild-type PPA2 enzyme
      activity.
    explanation: >-
      Experimentally confirms that pathogenic missense PPA2 variants have
      significantly reduced and temperature-sensitive enzymatic activity in
      vitro.

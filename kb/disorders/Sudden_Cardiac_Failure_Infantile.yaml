- name: Mitochondrial matrix inorganic pyrophosphate accumulation
  description: >-
    Impaired hydrolysis of inorganic pyrophosphate (PPi) by deficient PPA2—and
    acute PPi surges generated by thermal inactivation during febrile viral
    illness or by ACSS1-mediated activation of ethanol-derived acetic acid to
    acetyl-CoA—results in accumulation of PPi within the mitochondrial matrix,
    inhibiting PPi-producing biosynthetic reactions and mitochondrial energy
    transduction.

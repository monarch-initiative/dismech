genetic:
- name: PPA2
  gene_term:
    preferred_term: PPA2
    term:
      id: hgnc:28883
      label: PPA2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:27523598
      reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Altogether these data demonstrate that PPA2 is an essential gene in yeast
        and that biallelic mutations in PPA2 cause a mitochondrial disease leading
        to sudden cardiac arrest in infants.
      explanation: >-
        Establishes autosomal recessive inheritance of biallelic PPA2 mutations
        in infantile sudden cardiac arrest.
  features: >-
    Biallelic pathogenic variants in PPA2 (12 exons, chromosome 4q24) cause
    autosomal recessive infantile sudden cardiac failure and the broader
    PPA2-related sudden cardiac death and cardiomyopathy spectrum. Because
    complete loss of mitochondrial inorganic pyrophosphatase is incompatible with
    cell survival, biallelic null genotypes have not been observed; affected
    individuals carry either two hypomorphic missense variants or one missense
    variant in trans with a nonsense, frameshift, splice-site, or multi-exon
    deletion allele. The most frequent recurrent pathogenic missense allele in
    European-ancestry cohorts is c.514G>A (p.Glu172Lys), identified in 11 of 20
    families in the 2021 international series. Homozygosity for c.500C>T
    (p.Pro167Leu) causes a severe neonatal/early-infantile presentation with
    lactic acidosis, seizures, hypotonia, and lethal arrhythmia, whereas compound
    heterozygosity pairing c.683C>T (p.Pro228Leu; 24%–28% residual activity) with
    c.514G>A (p.Glu172Lys; 5%–10% residual activity) permits survival into
    adolescence or adulthood with extreme sensitivity to alcohol-induced sudden
    cardiac arrest (allelic disorder MONDO:0014974).
  evidence:
  - reference: PMID:27523598
    reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether these data demonstrate that PPA2 is an essential gene in yeast
      and that biallelic mutations in PPA2 cause a mitochondrial disease leading
      to sudden cardiac arrest in infants.
    explanation: >-
      Establishes that biallelic pathogenic mutations in PPA2 cause autosomal
      recessive mitochondrial disease presenting with infantile sudden cardiac
      arrest.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, the most frequent pathogenic PPA2 variant is c.514G>A;
      p.(Glu172Lys), identified in 11 of the 20 families in our cohort, and has
      been reported in several families in previous studies.
    explanation: >-
      Identifies c.514G>A (p.Glu172Lys) as the most frequent recurrent
      pathogenic PPA2 allele across published cohorts.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two truncating variants: c.250C>T; p.(Arg84*) and c.938C>A;
      p.(Ser313*), lie in exons 3 and 10 respectively (of 12 exons in total)
      and are predicted to induce nonsense-mediated messenger RNA (mRNA) decay.
    explanation: >-
      Documents nonsense loss-of-function alleles occurring in trans with
      hypomorphic missense alleles in affected individuals.
  - reference: PMID:33826954
    reference_title: "Long-read sequencing identified a novel nonsense and a de novo missense of PPA2 in trans in a Chinese patient with autosomal recessive infantile sudden cardiac failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome and Sanger sequencing revealed two variants in PPA2, with one
      novel nonsense variant (c.524C > G; p.Ser175*) inherited from the mother
      and one de novo missense variant (c.379C > T; p.Arg127Cys).
    explanation: >-
      Documents compound heterozygosity for a maternal nonsense variant and a de
      novo missense variant in trans in an infant with sudden cardiac failure.
  variants:
  - name: c.514G>A (p.Glu172Lys)
    description: >-
      Most frequent recurrent pathogenic PPA2 missense allele in European-ancestry
      cohorts (identified in 11 of 20 families in the 2021 international series).
      Recombinant p.Glu172Lys retains 5%–10% residual inorganic pyrophosphatase
      activity; homozygosity or compound heterozygosity with a severe allele
      causes infantile sudden cardiac failure (MONDO:0014973), whereas compound
      heterozygosity with p.Pro228Leu causes adolescent/adult alcohol-induced

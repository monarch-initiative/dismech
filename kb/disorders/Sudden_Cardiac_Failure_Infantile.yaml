inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Sudden cardiac failure, infantile is inherited in an autosomal recessive
    manner due to homozygous or compound heterozygous pathogenic variants in
    PPA2. At least one hypomorphic missense allele is required for postnatal
    viability because complete loss of mitochondrial pyrophosphatase activity is
    cell-lethal; clinical expressivity varies with residual enzyme activity and
    environmental triggers such as febrile viral infection or alcohol exposure.
  evidence:
  - reference: PMID:27523598
    reference_title: "Biallelic PPA2 Mutations Cause Sudden Unexpected Cardiac Arrest in Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report seven individuals from three families affected by sudden
      and unexpected cardiac arrest between 4 and 20 months of age. Whole-exome
      sequencing revealed compound heterozygous missense mutations in PPA2 in
      affected infants of each family.
    explanation: >-
      Identifies compound heterozygous biallelic PPA2 variants in multiple
      affected siblingships with unaffected carrier parents, establishing
      autosomal recessive inheritance.
  - reference: PMID:34400813
    reference_title: "PPA2-associated sudden cardiac death: extending the clinical and allelic spectrum in 20 new families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report a cohort of 34 individuals with biallelic PPA2
      variants from 20 families, enlarging the number of reported patients to 56
      from 30 families worldwide.
    explanation: >-
      Confirms autosomal recessive biallelic inheritance across 56 affected
      individuals from 30 unrelated families and demonstrates variable clinical
      expressivity ranging from infantile cardiac arrest to adult-onset
      cardiomyopathy and neuropathy.

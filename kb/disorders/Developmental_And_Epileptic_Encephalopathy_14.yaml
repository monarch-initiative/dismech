- name: KCNT1-Lowering Antisense Oligonucleotide (investigational)
  description: >-
    Gene-silencing rather than channel-blocking: a gapmer antisense
    oligonucleotide reduces KCNT1 mRNA, removing the excess channel instead of
    trying to block it. In the p.P924L mouse a single intracerebroventricular
    dose in symptomatic animals cut seizure frequency, improved behaviour and
    extended survival, and neonatal dosing was also tolerated and effective.
    It is the approach that has moved furthest since quinidine stalled, and it
    has now been given to patients. Two 2-year-old girls with the recurrent
    p.R474H variant received an experimental, non-allele-specific intrathecal
    KCNT1-targeting oligonucleotide by lumbar puncture, and both had a
    significant reduction in seizure frequency and intensity — the first human
    efficacy signal of any kind in this disorder. Both also developed
    ventricular enlargement or hydrocephalus, which in one case prompted
    redirection of goals of care. That toxicity is the central fact about this
    treatment today: efficacy is real and so is the harm, the harm appears
    monitorable, and neither is yet characterized at the sample size needed to
    weigh them. A separate intrathecal candidate (S230815) is in first-in-human
    Phase Ib/II study, and an oral agent (ABS-1230) in a placebo-controlled
    Phase 1b/2.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: KCNT1
      term:
        id: hgnc:18865
        label: KCNT1
    target_transcript: KCNT1 mRNA
    conjugation: UNCONJUGATED
    delivery_platform: UNFORMULATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Elevated Sodium-Activated Potassium Current
    description: >-
      Knocking down KCNT1 message lowers the amount of Slack channel available,
      reducing the pathologically elevated KNa current at its source rather than
      antagonizing the channel pharmacologically.
    evidence:
    - reference: PMID:36173683
      reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we test a potential precision therapeutic approach in KCNT1-associated DEE using a gene-silencing antisense oligonucleotide (ASO) approach"
      explanation: >-
        Identifies the mechanism of action as gene silencing of the causal
        channel, which is the node this link targets.
  evidence:
  - reference: PMID:36173683
    reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The data presented here provide proof of concept for ASO-based gene silencing as a promising therapeutic approach in KCNT1-associated epilepsies."
    explanation: >-

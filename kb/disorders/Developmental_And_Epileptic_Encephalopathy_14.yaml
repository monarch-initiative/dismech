inheritance:
- name: Autosomal Dominant (De Novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    DEE14 is inherited in an autosomal dominant manner. Most affected
    individuals are simplex cases carrying a de novo heterozygous KCNT1
    missense variant, but the de novo proportion varies by phenotype: the
    severe infantile presentations are essentially always de novo (or inherited
    from a mosaic unaffected parent), whereas the sleep-related hypermotor
    presentation is often familial with an affected parent. Penetrance is
    incomplete and intrafamilial variability is substantial.
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of affected individuals represent simplex cases (i.e., a single occurrence in a family) resulting from a de novo KCNT1 pathogenic variant. The proportion of cases caused by a de novo pathogenic variant varies by phenotype."
    explanation: >-
      GeneReviews states the dominant de novo inheritance and that the de novo
      fraction is phenotype-dependent, which is what this block records.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo variants were found in 96% of tested parents (23/24)."
    explanation: >-
      Quantifies the de novo fraction in an international paediatric cohort in
      which two-thirds of patients had the EIMFS presentation.
  - reference: PMID:26122718
    reference_title: "Mutations in KCNT1 cause a spectrum of focal epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the 100% penetrance so far reported for KCNT1 mutations, we observed incomplete penetrance."
    explanation: >-
      Establishes that penetrance is incomplete, correcting the earlier
      assumption of full penetrance.
- name: Parental Somatic and Germline Mosaicism
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    A minority of children with an apparently de novo variant have in fact
    inherited it from a clinically unaffected parent carrying the variant in
    mosaic form. This matters for recurrence-risk counselling, because such a
    family's risk is not the near-zero risk of a true de novo event.
  evidence:
  - reference: PMID:26140313
    reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNT1 mutations occurred de novo in 10 patients, and one was transmitted from the patient's mother who carried a somatic mosaic mutation."
    explanation: >-
      Documents transmission from a mosaic unaffected parent in a cohort that
      was otherwise de novo.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been established for DEE14. Case series are the
    only basis for an estimate: the largest dedicated international cohort
    assembled 27 children, and disorder-defining and cohort studies report
    between 11 and 27 patients each. The proportional statistic that is
    reasonably well established is the KCNT1 share of EIMFS, which is an
    etiologic fraction rather than a prevalence and is therefore recorded on the
    KCNT1 genetic record as case_fractions, not here.
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-seven children (15 males, mean age = 40.8 months) were included."
    explanation: >-
      Gives the size of the largest dedicated international DEE14 cohort, the
      basis for a cases-in-literature estimate.
- population: Children with epilepsy of infancy with migrating focal seizures
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Not a population prevalence: this records the share of the EIMFS syndrome
    attributable to KCNT1, which is the figure the literature actually
    establishes. Roughly half of EIMFS is KCNT1-related, so DEE14 and the EIMFS
    syndrome entry each hold patients the other does not.
  evidence:
  - reference: PMID:36173683
    reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic gene variants have been identified in KCNT1 and account for up to 50% of the etiology of EIMFS"
    directness: INDIRECT
    explanation: >-
      States the KCNT1 share of EIMFS aetiology. Graded OTHER because it is a
      literature-review sentence in a mouse study's introduction rather than
      that study's own result.
  - reference: PMID:26140313
    reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nine of 18 EIMFS cases (50%) in whom migrating foci were observed, one of 180 West syndrome cases (0.56%), and one of 66 unclassified EOEE cases (1.52%)"
    explanation: >-
      Independently quantifies the KCNT1 yield within EIMFS at 50%, and shows how
      much lower it is in West syndrome and unclassified early-onset epileptic
      encephalopathy.
has_subtypes:
- name: EIMFS
  display_name: EIMFS presentation (epilepsy of infancy with migrating focal seizures)
  description: >-
    The commonest and most severe DEE14 presentation, accounting for about
    two-thirds of children in dedicated cohorts. Focal, asynchronous seizures
    begin within the first six months of life, migrate between cortical regions
    and hemispheres on EEG, and become nearly continuous by six to nine months.
    Development plateaus or regresses at onset, autonomic features are common,
    and outcome is poor. This is the presentation the syndrome entry
    Epilepsy_of_Infancy_with_Migrating_Focal_Seizures models from the syndrome
    side; here it is the KCNT1-caused fraction of it.
  genes:
  - preferred_term: KCNT1
    term:
      id: hgnc:18865
      label: KCNT1
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-thirds had epilepsy of infancy with migrating focal seizures (EIMFS), and focal tonic seizures were common (48.1%)."
    explanation: >-
      Quantifies EIMFS as the majority presentation within a KCNT1-defined
      cohort, which is what makes it this entry's principal subtype.
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EIMFS is characterized by seizures, typically focal and asynchronous, beginning in the first six months of life with associated developmental plateau or regression."
    explanation: >-
      GeneReviews definition of the EIMFS presentation, the source of this
      subtype's description.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four phenotypic groups emerged from our analysis: (i) EIMFS (152 individuals, 33 previously unpublished); (ii) developmental and epileptic encephalopathies other than EIMFS (non-EIMFS developmental and epileptic encephalopathies) (37 individuals, 17 unpublished); (iii) autosomal dominant or sporadic sleep-related hypermotor epilepsy (53 patients, 14 unpublished); and (iv) other phenotypes (six individuals, two unpublished)."
    explanation: >-
      The 248-individual spectrum series, the largest reported, resolves the
      KCNT1 phenotype into exactly the four groups this entry uses as subtypes
      and gives each its denominator: EIMFS is 152/248.
- name: ADSHE
  display_name: ADSHE/ADNFLE presentation (sleep-related hypermotor epilepsy)
  subtype_term:
    preferred_term: KCNT1-related autosomal dominant sleep-related hypermotor epilepsy
    term:
      id: MONDO:0014002
      label: autosomal dominant nocturnal frontal lobe epilepsy 5
  description: >-
    Clusters of nocturnal motor seizures ranging from simple arousals to
    hyperkinetic events with tonic or dystonic features. KCNT1-related cases sit
    at the severe end of the sleep-related hypermotor epilepsy spectrum: onset
    is earlier and cognitive, psychiatric and behavioural comorbidity is more
    common than in ADSHE from other genes. This presentation is often familial
    rather than de novo, and it is the presentation carried as the ENFL5 subtype
    of the Familial_Sleep_Related_Hypermotor_Epilepsy entry.
  genes:
  - preferred_term: KCNT1
    term:
      id: hgnc:18865
      label: KCNT1
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with KCNT1-related ADNFLE are more likely to develop seizures at a younger age, have cognitive comorbidity, and display psychiatric and behavioral problems than individuals with ADNFLE resulting from other causes."
    explanation: >-
      States the specific severity signature that distinguishes the KCNT1 form
      of this syndrome from other genetic causes.
  - reference: PMID:23086396
    reference_title: "Missense mutations in the sodium-gated potassium channel gene KCNT1 cause severe autosomal dominant nocturnal frontal lobe epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KCNT1 mutations were identified in two additional families and a sporadic case with severe ADNFLE and psychiatric features."
    explanation: >-
      The disorder-defining report of KCNT1 in the sleep-related hypermotor
      presentation, including its psychiatric comorbidity.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in autosomal dominant or sporadic sleep-related hypermotor epilepsy, we observed a high prevalence of drug-resistance, although seizure frequency improved with age in some individuals, appearance of cognitive regression after seizure onset in all patients, no reported severe psychiatric disorders, although behavioural/psychiatric comorbidities were reported in ∼50% of the patients"
    explanation: >-
      Characterizes this subtype in the largest series: 53 of 248 individuals,
      drug-resistant, with cognitive regression in all and behavioural or
      psychiatric comorbidity in about half. Note it declines to call the
      psychiatric burden severe, a more measured reading than the founding
      family reports.
- name: Other DEE
  display_name: Other early-onset epileptic encephalopathies (Ohtahara, West, early myoclonic)
  description: >-
    A minority of children with pathogenic KCNT1 variants present with an
    early-onset epileptic encephalopathy other than EIMFS — Ohtahara syndrome,
    West syndrome, or early myoclonic encephalopathy — and some with
    leukoencephalopathy. The KCNT1 diagnostic yield in these syndromes is an
    order of magnitude lower than in EIMFS, so a KCNT1 variant is a much less
    expected finding here.
  genes:
  - preferred_term: KCNT1
    term:
      id: hgnc:18865
      label: KCNT1
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Less common seizure phenotypes in individuals with KCNT1-related epilepsy include West syndrome, Ohtahara syndrome, early myoclonic encephalopathy, leukodystrophy and/or leukoencephalopathy, focal epilepsy, and multifocal epilepsy."
    explanation: >-
      Enumerates the less common syndromic presentations grouped by this
      subtype.
  - reference: PMID:26140313
    reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study demonstrates that the phenotypic spectrum of de novo KCNT1 mutations is largely restricted to EIMFS."
    explanation: >-
      Supports treating the non-EIMFS encephalopathies as a distinctly less
      common subtype: systematic screening of 362 early-onset epileptic
      encephalopathy patients found KCNT1 concentrated in EIMFS.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in non-EIMFS developmental and epileptic encephalopathies, possible onset with West syndrome, occurrence of atypical absences, possible evolution to developmental and epileptic encephalopathies with sleep-related hypermotor epilepsy features; one case of sudden unexplained death in epilepsy"
    explanation: >-
      Characterizes this subtype in the largest series (37 of 248) and records
      that it can evolve toward sleep-related hypermotor features, which is why
      the subtype boundaries here are descriptive rather than fixed.
- name: Focal and Multifocal Epilepsy
  display_name: Focal / multifocal epilepsy without encephalopathy
  description: >-
    The mildest end of the spectrum: focal or multifocal epilepsy, sometimes
    with cardiac arrhythmia, in individuals who do not meet criteria for an
    epileptic encephalopathy. Its existence is what makes DEE14 a misleading
    name for the full KCNT1 phenotype, and it is the reason the broader synonym
    "KCNT1-related epilepsy" is often preferred clinically.
  genes:
  - preferred_term: KCNT1
    term:
      id: hgnc:18865
      label: KCNT1
  evidence:
  - reference: PMID:26122718
    reference_title: "Mutations in KCNT1 cause a spectrum of focal epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified KCNT1 mutations in 12 previously unreported patients with focal epilepsy, multifocal epilepsy, cardiac arrhythmia, and in a family with sudden unexpected death in epilepsy (SUDEP), in addition to patients with NFLE and MMFSI."
    explanation: >-
      Establishes focal and multifocal epilepsy, with cardiac involvement, as
      part of the KCNT1 phenotypic spectrum beyond the two classic syndromes.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "other phenotypes in individuals with mutation of KCNT1 included temporal lobe epilepsy, and epilepsy with tonic-clonic seizures and cognitive regression"
    explanation: >-
      Names the residual phenotypes in the largest series, six of 248
      individuals, which is the size of this subtype.
mechanistic_hypotheses:
- hypothesis_group_id: interneuron_disinhibition
  hypothesis_label: Interneuron-selective KNa gain disables inhibition
  status: CANONICAL
  description: >-
    The dominant account of how a potassium-channel gain of function produces
    epilepsy. The excess KNa current is present in both excitatory and
    inhibitory cortical neurons, but only in inhibitory neurons does it operate
    across subthreshold voltages, where it opposes the depolarization needed to
    reach threshold. Interneurons therefore fire less, cortical inhibition
    fails, and the network becomes hyperexcitable — a circuit-level mechanism
    requiring network context.
- hypothesis_group_id: cell_autonomous_firing
  hypothesis_label: Cell-autonomous increase in firing rate via afterhyperpolarization
  status: ALTERNATIVE
  description: >-
    A competing, not obviously compatible account derived from human
    iPSC-derived neurons. Here the excess KNa current shortens action potential
    duration and deepens the afterhyperpolarization, which speeds recovery of
    sodium-channel availability and so raises the maximum firing rate of the
    same neuron carrying the variant. The authors show this is cell-autonomous
    and does not require network interactions, which is the point of tension:
    it predicts hyperexcitability without any interneuron-selective step.
  notes: >-
    The two hypotheses are not mutually exclusive — they were established in
    different preparations (mouse cortex in vivo versus human iPSC-derived
    neurons in vitro) and could both operate — but neither study tests the
    other's mechanism in the other's preparation, the iPSC neurons carry two
    mutant alleles where patients carry one, and no work has yet measured the
    two mechanisms' relative contributions in human cortex. Which one dominates matters therapeutically:
    an interneuron-selective mechanism suggests cell-type-targeted intervention,
    whereas a cell-autonomous one argues for uniform channel knockdown of the
    kind the antisense approach delivers.
pathophysiology:
- name: KCNT1 Gain-of-Function Missense Variant
  description: >-
    A heterozygous missense variant in KCNT1, almost always de novo, altering
    the Slack (KNa1.1) sodium-activated potassium channel subunit. Variants
    concentrate in the C-terminal regulator-of-potassium-conductance (RCK)
    domains around the putative NAD+-binding site and in the S5 transmembrane
    segment. No nonsense or other truncating variant has been reported, which
    is itself evidence that the mechanism is altered channel function rather
    than loss of the protein.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Slack (KNa1.1) sodium-activated potassium channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005228
      label: intracellular sodium-activated potassium channel activity
  downstream:
  - target: Increased Cooperative Slack Channel Gating
    causal_link_type: DIRECT
    description: >-
      The variant protein reaches the membrane at essentially normal abundance;
      what changes is how channels in a cluster gate together.
    evidence:
    - reference: PMID:25482562
      reference_title: "Human slack potassium channel mutations increase positive cooperativity between individual channels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This could not be accounted for by increases in the intrinsic open probability of individual channels. Rather, greatly increased opening was a consequence of cooperative interactions between multiple channels in a patch."
      explanation: >-
        Directly establishes that the variant acts by increasing cooperative
        gating rather than by changing single-channel behaviour, which is the
        causal step this edge asserts.
  evidence:
  - reference: PMID:23086397
    reference_title: "De novo gain-of-function KCNT1 channel mutations cause malignant migrating partial seizures of infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed exome sequencing in three probands with MMPSI and identified de novo gain-of-function mutations affecting the C-terminal domain of the KCNT1 potassium channel."
    explanation: >-
      The disorder-defining identification of de novo C-terminal
      gain-of-function KCNT1 variants.
  - reference: PMID:26140313
    reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations accumulated in transmembrane segment 5 (2/9, 22.2%) and regulators of K(+) conductance domains (7/9, 77.8%)."
    explanation: >-
      Quantifies the two domains in which pathogenic variants cluster.
  - reference: PMID:26122718
    reference_title: "Mutations in KCNT1 cause a spectrum of focal epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All KCNT1 mutations identified both previously2-9 and here are missense mutations, with no nonsense or other truncating mutations reported. This suggests that perturbation of normal KCNT1 protein function, rather than loss of function, underlies the pathogenicity"
    explanation: >-
      The absence of any truncating variant across the reported series is the
      human-genetic argument that the mechanism is not haploinsufficiency.
- name: Increased Cooperative Slack Channel Gating
  description: >-
    Variant Slack channels in a membrane patch open in a strongly coordinated
    fashion. The degree of cooperative gating is far greater for every mutant
    tested than for wild type, and it explains the current increase even for a
    variant whose single-channel conductance is reduced. Channel protein
    abundance is essentially unchanged, so this is a gating change and not an
    expression change.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Slack (KNa1.1) sodium-activated potassium channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005228
      label: intracellular sodium-activated potassium channel activity
  downstream:
  - target: Elevated Sodium-Activated Potassium Current
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25482562
      reference_title: "Human slack potassium channel mutations increase positive cooperativity between individual channels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The degree of cooperative gating was much greater for all of the mutant channels than for the wild-type channel, and could explain increases in current even in a mutant with reduced unitary conductance."
      explanation: >-
        States that cooperative gating is what produces the macroscopic current
        increase, which is exactly this edge.
  evidence:
  - reference: PMID:25482562
    reference_title: "Human slack potassium channel mutations increase positive cooperativity between individual channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We examined nine different mutations of the KCNT1 (Slack) Na(+)-activated K(+) channel that give rise to three distinct forms of epilepsy. All produced many-fold increases in current amplitude compared to the wild-type channel."
    explanation: >-
      Establishes the uniform many-fold current increase across nine variants
      spanning three clinical syndromes.
- name: Elevated Sodium-Activated Potassium Current
  description: >-
    The functional common denominator of every pathogenic KCNT1 variant tested:
    a large increase in outward KNa current, reported up to 22-fold over wild
    type. The magnitude differs systematically between the syndromes — variants
    associated with the severe infantile presentation confer greater gain than
    those associated with the sleep-related hypermotor presentation — but the
    correlation is a group difference and does not predict an individual's
    syndrome.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: potassium ion efflux through Slack channels
    modifier: INCREASED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  downstream:
  - target: Impaired GABAergic Interneuron Excitability
    causal_link_type: DIRECT
    hypothesis_groups:
    - interneuron_disinhibition
    evidence:
    - reference: PMID:33113364
      reference_title: "Reduced GABAergic Neuron Excitability, Altered Synaptic Connectivity, and Seizures in a KCNT1 Gain-of-Function Mouse Model of Childhood Epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "there is an increase in the KNa current across subthreshold voltages only in inhibitory neurons, particularly in those with non-fast-spiking properties, resulting in inhibitory-neuron-specific impairments in excitability and action potential (AP) generation"
      explanation: >-
        States the causal step precisely: the subthreshold KNa increase is
        confined to inhibitory neurons and it is what impairs their excitability.
  - target: Shortened Action Potential with Enhanced Afterhyperpolarization
    causal_link_type: DIRECT
    hypothesis_groups:
    - cell_autonomous_firing
    evidence:
    - reference: PMID:31350261
      reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the increased KNa current in neurons with the P924L mutation acts to shorten the duration of action potentials and to increase the amplitude of the afterhyperpolarization that follows each action potential"
      explanation: >-
        Names the increased KNa current as the cause of both waveform changes,
        which is this edge.
  evidence:
  - reference: PMID:24591078
    reference_title: "KCNT1 gain of function in 2 epilepsy phenotypes is reversed by quinidine."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While mutations from ADNFLE cases were associated with currents that were approximately 3 fold larger than WT, the mutations associated with the more severe syndrome of EIMFS were on average around 5 fold greater"
    explanation: >-
      Carries the direction as well as the existence of the difference, which
      the abstract's "significant group difference" wording does not: the more
      severe syndrome is associated with the larger current gain.
  - reference: PMID:36173683
    reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies have shown that KCNT1 pathogenic variants associated with epilepsy result in an overall gain-of-function effect on the channel activity, increasing the current up to 22-fold compared with the wild-type channel"
    explanation: >-
      Gives the upper bound on the reported current increase.
  - reference: PMID:31350261
    reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "sodium-dependent potassium currents are increased several-fold in neurons bearing a homozygous P924L mutation"
    explanation: >-
      Confirms in human neurons, rather than a heterologous expression system,
      that the current increase is real in the native cellular context.
  - reference: PMID:36499459
    reference_title: "Functional Effects of Epilepsy Associated KCNT1 Mutations Suggest Pathogenesis via Aberrant Inhibitory Neuronal Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a positive correlation between the severity of the neurological disorder and the KCNT1 channel open probability at resting membrane potential."
    explanation: >-
      Identifies which functional parameter tracks clinical severity. It is not
      peak current amplitude but open probability at the resting potential —
      the quantity that determines how much the channel is doing while the
      neuron is at rest, and therefore how far it raises the firing threshold.
- name: Impaired GABAergic Interneuron Excitability
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    Cortical inhibitory interneurons, and particularly non-fast-spiking ones,
    are selectively disabled: the extra subthreshold potassium conductance
    opposes depolarization toward threshold, so fewer action potentials are
    generated for a given input. Because these cells supply the inhibition that
    constrains cortical activity, their silencing releases the network. This is
    the step that resolves the disorder's central paradox, in which a potassium
    channel gain of function produces hyperexcitability rather than the
    hypoexcitability naive reasoning predicts.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical GABAergic interneuron
    term:
      id: CL:0010011
      label: cerebral cortex GABAergic interneuron
  biological_processes:
  - preferred_term: GABAergic synaptic transmission
    modifier: DECREASED
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
  downstream:
  - target: Aberrant Synaptic Rewiring
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cortical Network Hyperexcitability and Hypersynchrony
    causal_link_type: DIRECT
    hypothesis_groups:
    - interneuron_disinhibition
  evidence:
  - reference: PMID:33113364
    reference_title: "Reduced GABAergic Neuron Excitability, Altered Synaptic Connectivity, and Seizures in a KCNT1 Gain-of-Function Mouse Model of Childhood Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings support inhibitory-neuron-specific mechanisms in mediating the epileptogenic effects of KCNT1 channel GOF, offering cell-type-specific currents and effects as promising targets for therapeutic intervention."
    explanation: >-
      The study's own conclusion that the epileptogenic effect is mediated
      specifically through inhibitory neurons.
- name: Shortened Action Potential with Enhanced Afterhyperpolarization
  description: >-
    In human iPSC-derived neurons carrying a pathogenic KCNT1 variant, the
    excess KNa current shortens each action potential and deepens the following
    afterhyperpolarization. Rather than damping the neuron, this raises the
    number of spikes evoked by a depolarizing input and raises the maximum
    firing rate — the deeper afterhyperpolarization speeds recovery from sodium
    channel inactivation.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: action potential waveform
    modifier: DYSREGULATED
    term:
      id: GO:0001508
      label: action potential
  - preferred_term: regulation of neuronal membrane potential
    modifier: DYSREGULATED
    term:
      id: GO:0042391
      label: regulation of membrane potential
  downstream:
  - target: Cortical Network Hyperexcitability and Hypersynchrony
    causal_link_type: DIRECT
    hypothesis_groups:
    - cell_autonomous_firing
    evidence:
    - reference: PMID:31350261
      reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In networks of spontaneously active neurons, the mean firing rate, the occurrence of rapid bursts of action potentials, and the intensity of firing during the burst were all increased in neurons with the P924L Slack mutation."
      explanation: >-
        Carries the claim from the single neuron to the network, which is what
        this edge asserts.
  evidence:
  - reference: PMID:31350261
    reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the number of action potentials that were evoked by depolarizing currents as well as maximal firing rates were increased in neurons expressing the mutant channel"
    explanation: >-
      Records the counterintuitive functional outcome of the waveform change:
      more spiking, not less.
- name: Aberrant Synaptic Rewiring
  description: >-
    Beyond the acute excitability change, cortex carrying a pathogenic KCNT1
    variant reorganizes its connectivity, with increased homotypic synaptic
    connections. This is a structural, developmentally accumulated
    contribution to the epileptic network rather than a moment-to-moment
    excitability effect, and it is one reason DEE14 seizures are so resistant
    to drugs that act only on excitability.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: synapse organization
    modifier: DYSREGULATED
    term:
      id: GO:0050808
      label: synapse organization
  downstream:
  - target: Cortical Network Hyperexcitability and Hypersynchrony
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33113364
    reference_title: "Reduced GABAergic Neuron Excitability, Altered Synaptic Connectivity, and Seizures in a KCNT1 Gain-of-Function Mouse Model of Childhood Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further observe evidence of synaptic rewiring, including increases in homotypic synaptic connectivity, accompanied by network hyperexcitability and hypersynchronicity."
    explanation: >-
      Documents the connectivity change and its association with the network
      phenotype in the knock-in mouse.
- name: Cortical Network Hyperexcitability and Hypersynchrony
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    The convergent tissue-level state: cortical networks that are both more
    excitable and more synchronous than normal, generating spontaneous seizures
    and abundant interictal discharge. In the knock-in mouse this is
    demonstrable as motor cortex hyperexcitability with early-onset seizures
    closely resembling the human disorder.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: regulation of neuronal membrane potential
    modifier: DYSREGULATED
    term:
      id: GO:0042391
      label: regulation of membrane potential
  downstream:
  - target: Migrating Multifocal Seizures
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41981306
      reference_title: "Antisense oligonucleotide-mediated knockdown therapy in two infants with severe KCNT1 epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic KCNT1 variants lead to overactive Slack channels, boosting total neuronal potassium currents by up to 40%, driving cortical hyperexcitability and causing seizures."
      explanation: >-
        States the causal step from cortical hyperexcitability to seizures,
        which is this edge rather than either node alone.
  - target: Focal Tonic Seizures
    causal_link_type: DIRECT
  - target: Nocturnal Hypermotor Seizures
    causal_link_type: DIRECT
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as indirect because how much of the developmental impairment is
      caused by the seizure burden, as opposed to the channel defect acting on
      development in parallel, is exactly what the literature does not resolve.
    evidence:
    - reference: PMID:32167590
      reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "half (48.1%) exhibited developmental plateauing upon onset"
      explanation: >-
        The temporal coincidence of developmental plateau with seizure onset is
        the observational basis for this edge, and it is association rather
        than demonstrated causation, which is why the link is INDIRECT.
  evidence:
  - reference: PMID:33113364
    reference_title: "Reduced GABAergic Neuron Excitability, Altered Synaptic Connectivity, and Seizures in a KCNT1 Gain-of-Function Mouse Model of Childhood Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we introduce a human Na+-activated K+ (KNa) channel variant (KCNT1-Y796H) into mice and, using a multiplatform approach, find motor cortex hyperexcitability and early-onset seizures, phenotypes strikingly similar to those of human patients"
    explanation: >-
      Demonstrates that the network state and the resulting seizures follow from
      the human variant in vivo.
  - reference: PMID:31350261
    reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "gain-of-function in Slack KNa channels causes hyperexcitability in both isolated neurons and in neural networks"
    explanation: >-
      Independent human-cell support that the endpoint of the molecular lesion
      is network hyperexcitability.
- name: Impaired Neurodevelopment
  description: >-
    The mechanism behind the "developmental" half of developmental and epileptic
    encephalopathy, kept distinct from the clinical plateau it produces. Two
    contributions are in play and the literature does not apportion them: the
    seizure burden itself, and the channel defect acting directly on
    development. Two findings support the second. KCNT1 has a non-conducting
    function, its C-terminus binding cytoplasmic proteins in developmental
    signalling pathways; and functional KNa1.1 conductance is already present
    and developmentally regulated in prenatal human neurons, so a
    gain-of-function variant is acting on the brain long before the first
    seizure.
  biological_scale: ORGANISM
  downstream:
  - target: Developmental Plateau and Regression
    causal_link_type: DIRECT
  - target: Profound Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure onset ranged from 1 day to 6 months, and half (48.1%) exhibited developmental plateauing upon onset."
    explanation: >-
      Quantifies developmental plateauing and ties it temporally to seizure
      onset.
  - reference: PMID:23086397
    reference_title: "De novo gain-of-function KCNT1 channel mutations cause malignant migrating partial seizures of infancy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "In addition to regulating ion flux, KCNT1 has a non-conducting function, as its C terminus interacts with cytoplasmic proteins involved in developmental signaling pathways."
    explanation: >-
      Raises the possibility of a channel-intrinsic route to the developmental
      phenotype, separate from seizure burden. It does not demonstrate one: the
      sentence is a background statement about protein biology, reporting no
      experiment in that paper, so the inference from a developmental-signalling
      interaction to the clinical developmental phenotype is entirely ours.
  - reference: PMID:42056090
    reference_title: "RNA targeting therapy for a prenatally enriched potassium channel associated with severe childhood epilepsy and premature death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using patch-clamp electrophysiology, we observe functional prenatal KNa1.1 conductance that is developmentally regulated."
    directness: INDIRECT
    explanation: >-
      Establishes that the channel is already functional and developmentally
      regulated before birth, which makes a prenatal contribution to the
      developmental phenotype possible. It does not demonstrate one — showing
      the channel works prenatally is not the same as showing a variant harms
      development prenatally.
  - reference: PMID:42056090
    reference_title: "RNA targeting therapy for a prenatally enriched potassium channel associated with severe childhood epilepsy and premature death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In mid-gestation primary human neurons, ASO knockdown suppresses current-evoked firing, suggesting a potential early therapeutic target before the onset of infantile encephalopathy."
    explanation: >-
      Shows the prenatal window is pharmacologically reachable, which converts
      the developmental-timing question from an academic one into a treatment
      design question.
diagnosis:
- name: KCNT1 Molecular Genetic Testing
  description: >-
    The diagnosis is established by finding a heterozygous pathogenic or likely
    pathogenic KCNT1 variant in a proband with intractable epilepsy. Phenotype
    and EEG are not sufficient on their own, because every syndrome KCNT1
    produces is genetically heterogeneous; nor is a variant of uncertain
    significance diagnostic. Multigene panel or trio exome/genome testing is the
    appropriate route, since the differential at presentation spans SCN2A,
    SCN1A, SLC12A5, TBC1D24, KCNQ2 and STXBP1.
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of KCNT1-related epilepsy is established in a proband with intractable epilepsy and a heterozygous pathogenic variant in KCNT1 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews diagnostic criterion, quoted directly.
- name: Electroencephalography
  description: >-
    EEG in the EIMFS presentation shows focal, asynchronous ictal discharges
    arising independently in different cortical regions and migrating between
    them, which is the electrographic finding the syndrome is named for.
    Background attenuation is common. EEG is also the surveillance instrument
    for this disorder rather than only a diagnostic one.
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EIMFS is characterized by seizures, typically focal and asynchronous, beginning in the first six months of life with associated developmental plateau or regression."
    explanation: >-
      Describes the seizure pattern EEG demonstrates in this presentation.
  - reference: PMID:26140313
    reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A generalized attenuation of background activity on electroencephalography was seen in six patients (6/11, 54.5%)."
    explanation: >-
      Quantifies the background abnormality accompanying the ictal findings.
- name: Brain MRI
  description: >-
    MRI is often normal early and becomes abnormal over time. Sixty percent of
    children in the international cohort had an abnormal scan, most commonly
    delayed myelination, thin corpus callosum and brain atrophy. Its role is to
    exclude a structural cause rather than to establish this diagnosis.
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty percent had abnormal magnetic resonance imaging (MRI) findings. Delayed myelination, thin corpus callosum, and brain atrophy were the most common."
    explanation: >-
      Gives the yield and the pattern of MRI abnormality.
phenotypes:
- category: Neurological
  name: Migrating Multifocal Seizures
  subtype: EIMFS
  description: >-
    Focal, asynchronous seizures arising independently in both hemispheres and
    migrating from one cortical region to another on EEG, beginning in the first
    six months of life and becoming nearly continuous by six to nine months.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Migrating focal seizure
    term:
      id: HP:0032786
      label: Migrating focal seizure
    temporality: CHRONIC
  sequelae:
  - target: Convulsive Status Epilepticus
    description: >-
      Near-continuous migrating seizures are the substrate from which convulsive
      status epilepticus arises in this disorder.
  - target: Progressive Microcephaly
    description: >-
      Head growth falls away after seizure onset rather than before it, so the
      acquired microcephaly follows the seizure burden temporally. Whether it is
      caused by it, or by the channel defect acting on development in parallel,
      is the open question recorded on the Impaired Neurodevelopment node.
  evidence:
  - reference: PMID:30234941
    reference_title: "KCNT1-Related Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures are intractable to multiple anticonvulsants and progress to become nearly continuous by age six to nine months."
    explanation: >-
      GeneReviews description of the seizure course in the EIMFS presentation.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-thirds had epilepsy of infancy with migrating focal seizures (EIMFS), and focal tonic seizures were common (48.1%)."
    explanation: >-
      Establishes the frequency of the migrating-seizure presentation within a
      KCNT1-defined cohort, supporting the FREQUENT band.

animal_models:
- name: Kcnt1 p.P924L knock-in mouse (homozygous)
  species: Mouse
  genotype: Kcnt1 p.P924L (murine p.P905L) homozygous knock-in
  publication: PMID:36173683
  description: >-
    Knock-in mouse carrying the human KCNT1 p.P924L pathogenic variant. Only
    homozygous animals show the phenotype, which is the model's chief
    translational limitation: patients are heterozygous. Homozygotes have
    spontaneous seizures, abundant interictal electrocorticographic activity,
    behavioural abnormalities and early death, and the model is the platform on
    which antisense knockdown was shown to work.
  modeled_mechanisms:
  - target: Cortical Network Hyperexcitability and Hypersynchrony
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Homozygous animals reproduce the spontaneous seizures and interictal
      discharge that define the human network phenotype.
    limitations: >-
      Heterozygous animals carrying the variant are unaffected, whereas human
      disease is heterozygous and dominant. The model therefore requires twice
      the mutant gene dose to express the phenotype, so its threshold for
      disease does not match the human one.
    evidence:
    - reference: PMID:36173683
      reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mouse model carrying the KCNT1 p.P924L pathogenic variant; only the homozygous animals presented with the frequent, debilitating seizures and developmental compromise that are seen in patients."
      explanation: >-
        States both the recapitulation and the zygosity limitation recorded here.
- name: Kcnt1 p.Y796H knock-in mouse
  species: Mouse
  genotype: Kcnt1 p.Y796H knock-in
  publication: PMID:33113364
  description: >-
    Knock-in mouse carrying the human KCNT1 Y796H variant, used to establish the
    interneuron-selective mechanism. Multiplatform characterization showed motor
    cortex hyperexcitability and early-onset seizures resembling the human
    disorder, with the subthreshold KNa increase confined to inhibitory neurons.
  modeled_mechanisms:

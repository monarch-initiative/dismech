    snippet: "heterozygous loss-of-function variants in KCNT1 are not significantly constrained in human population datasets (probability of loss-of-function intolerance, pLI = 0), supporting the potential clinical tolerability of reduction of gene dosage"
    explanation: >-
      The population-genetic argument that non-allele-selective knockdown should

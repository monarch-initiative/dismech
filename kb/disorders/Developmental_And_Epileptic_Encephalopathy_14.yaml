    mapping_predicate: skos:narrowMatch
    mapping_source: manual curation
    mapping_justification: >-
      ENFL5 is the KCNT1-caused sleep-related hypermotor epilepsy, curated here
      as the ADSHE subtype and also carried as a subtype of the
      Familial_Sleep_Related_Hypermotor_Epilepsy entry. It is narrower than
      DEE14 because it names one of the four phenotypic groups KCNT1 produces.
  - term:
      id: MONDO:0017385
      label: malignant migrating partial seizures of infancy
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      Deliberately relatedMatch rather than broadMatch or narrowMatch. EIMFS and
      DEE14 overlap without either containing the other: KCNT1 accounts for
      about half of EIMFS, so EIMFS holds patients this entry excludes, while
      DEE14 also covers the sleep-related hypermotor, Ohtahara, West and focal
      presentations that EIMFS excludes. A relatedMatch does not retire the
      mapped concept from the curation queue, which is right here, because the
      EIMFS entry stands on its own.
notes: >-
  Scope, and its relationship to two neighbouring dismech entries. DEE14
  (MONDO:0013989, OMIM 614959) is defined by its *etiology* — a pathogenic
  KCNT1 variant — and therefore spans every syndrome KCNT1 can produce. The two
  entries it overlaps are defined by *syndrome* instead, and neither contains
  it nor is contained by it. Epilepsy_of_Infancy_with_Migrating_Focal_Seizures
  (MONDO:0017385) is the EIMFS syndrome, which is genetically heterogeneous —
  KCNT1 accounts for up to half of cases, with SCN2A, SCN1A, TBC1D24, SLC12A5
  and others making up the rest — so it holds KCNT1-negative patients this entry
  excludes. Familial_Sleep_Related_Hypermotor_Epilepsy (MONDO:0000030) carries
  KCNT1-related ADSHE as one gene-defined subtype (ENFL5) alongside CHRNA4,
  CHRNB2 and DEPDC5 subtypes.

  The intent is that this entry becomes the place where the KCNT1 channel
  biology, the cross-syndrome genotype-phenotype picture, and the KCNT1-directed
  precision therapies are curated, with the two syndrome entries carrying the
  syndrome-level clinical picture. That is not yet the state of the repository:
  the EIMFS entry currently carries its own KCNT1 mechanism chain, KCNT1
  genetics and quinidine treatment, and this change does not edit it, so the
  KCNT1 mechanism is at present curated in two places. Reconciling them, either
  by trimming the EIMFS entry to syndrome level and pointing it here or by
  recording why the duplication is deliberate, is left to a follow-up rather
  than bundled into a new-entry PR. The overlapping relations are recorded
  structurally in mappings.mondo_mappings below, so the scope claim is
  machine-checkable rather than only prose.

  A Grouping was considered and rejected. Grouping records carry members and
  criteria but no pathophysiology, treatments, models or trials, so the channel
  biology and the KCNT1-directed therapies would have had nowhere to live.

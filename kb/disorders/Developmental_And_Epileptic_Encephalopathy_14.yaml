  description: >-
    Intellectual disability with psychiatric and behavioural problems —
    depression, anxiety, ADHD, and in one reported family a suicide attempt —
    distinguishing KCNT1-related sleep-related hypermotor epilepsy from ADSHE
    of other genetic causes. The largest series is more measured than the
    founding family reports: it found cognitive regression after seizure onset

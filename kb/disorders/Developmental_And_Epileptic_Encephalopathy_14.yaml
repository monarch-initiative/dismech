- category: Neurological
  name: Premature Death in Childhood
  description: >-
    Mortality is high, and how high depends on which presentation is counted.
    Four of 27 children (15%) in the mixed international cohort died, none of
    SUDEP; EIMFS series report 17% to 33% mortality; and for KCNT1-related
    EIMFS specifically, nearly half of patients are reported to die before
    three years of age. Death is typically from prolonged status epilepticus
    and respiratory failure.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Death in childhood
  notes: >-
    Left unbound deliberately. HPO's mortality terms (HP:0003819 Death in
    childhood, HP:0001522 Death in infancy) sit under Mortality/Aging, which is
    a clinical-modifier branch and is not reachable from HP:0000118 Phenotypic
    abnormality, so they are not members of the PhenotypeTerm enum and fail
    validation. Binding a seizure term such as HP:0002133 Status epilepticus
    here instead would name the usual mechanism of death rather than the death,
    which is the claim this phenotype makes.
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients died (15%), none of sudden unexpected death in epilepsy."
    explanation: >-
      Gives the mortality rate in the dedicated KCNT1 cohort and rules out SUDEP
      as its mechanism there.
  - reference: PMID:36173683
    reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "this syndrome is associated with a high mortality rate (ranging from 17% to 33%)"
    directness: INDIRECT
    explanation: >-
      Gives the mortality range reported across EIMFS series, higher than the
      single KCNT1 cohort figure. Graded OTHER because it is a review sentence
      in a mouse paper's introduction, and INDIRECT because "this syndrome" is
      EIMFS, so the figure covers KCNT1-negative EIMFS patients too.
  - reference: PMID:41981306
    reference_title: "Antisense oligonucleotide-mediated knockdown therapy in two infants with severe KCNT1 epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with KCNT1-related EIMFS also have high early mortality, often related to seizure comorbidities or sudden unexpected death in epilepsy; nearly half of patients die before 3 years of age"
    explanation: >-
      The starkest and most presentation-specific mortality figure available,
      and materially worse than the 15% seen in the mixed-phenotype cohort. It
      is why early intervention is the field's priority.
- category: Neurological
  name: Sudden Unexpected Death in Epilepsy
  description: >-
    SUDEP is reported in KCNT1-related epilepsy, including in an adult with the
    sleep-related hypermotor presentation, so the mortality risk is not confined
    to the encephalopathic infantile end of the spectrum. It is curated
    separately from childhood mortality because the two are distinct: the
    international paediatric cohort's four deaths were explicitly not SUDEP.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Sudden unexpected death in epilepsy
  notes: >-
    Left unbound for the same reason as the childhood-mortality phenotype:
    HP:0033258 Sudden unexpected death in epilepsy sits outside the
    PhenotypeTerm enum's Phenotypic abnormality root.
  evidence:
  - reference: PMID:26122718
    reference_title: "Mutations in KCNT1 cause a spectrum of focal epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual III.1 (Fig. 1A) had frequent nocturnal seizures and died suddenly and unexpectedly during the night at 23 years of age. His death was classified as sudden unexplained death in epilepsy (SUDEP)."
    explanation: >-
      Documents SUDEP in a KCNT1 family with the sleep-related hypermotor
      phenotype.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one case of sudden unexplained death in epilepsy"
    explanation: >-
      Independent SUDEP case in the largest series, in the non-EIMFS
      encephalopathy group.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients died (15%), none of sudden unexpected death in epilepsy."
    explanation: >-
      Evidence against SUDEP as the mechanism of childhood mortality in this
      disorder: every death in the dedicated paediatric cohort had another
      cause. This is why SUDEP is curated as a separate, rarer phenotype rather
      than as the explanation for the high childhood death rate.
genetic:
- name: KCNT1
  gene_term:
    preferred_term: KCNT1
    term:
      id: hgnc:18865
      label: KCNT1
  relationship_type: CAUSATIVE
  case_fractions:
  - population: Children with epilepsy of infancy with migrating focal seizures
    case_fraction_percent: 50.0
    cohort_size: 18
    notes: >-
      The share of the EIMFS syndrome attributable to KCNT1. This is an
      etiologic fraction, not a population prevalence, and it is the number that
      makes DEE14 and the EIMFS syndrome entry non-nested: about half of EIMFS
      is KCNT1-related, so each holds patients the other does not.
    evidence:
    - reference: PMID:26140313
      reference_title: "De novo KCNT1 mutations in early-onset epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "nine of 18 EIMFS cases (50%) in whom migrating foci were observed, one of 180 West syndrome cases (0.56%), and one of 66 unclassified EOEE cases (1.52%)"
      explanation: >-
        Gives the KCNT1 yield within EIMFS as 9/18, and how much lower it is in
        West syndrome and unclassified early-onset epileptic encephalopathy.
  notes: >-
    KCNT1 (chromosome 9q34.3) encodes the Slack/KNa1.1 sodium-activated
    potassium channel subunit, a Slo-family channel highly expressed in frontal
    and piriform cortex. Across the 248-individual spectrum series every variant
    was missense but for a single in-frame deletion; there are no truncating
    variants, and the disease mechanism is gain of function rather than
    haploinsufficiency. Variants cluster in the C-terminal RCK domains near the
    putative NAD+-binding site and in the S5 transmembrane segment. Recurrent
    variants include p.Ala934Thr, p.Gly288Ser and p.Arg398Gln.

    variant_origin is deliberately left unset rather than set to DE_NOVO. The
    slot is single-valued and this entry's scope spans all three origins: de
    novo in almost all of the severe infantile presentation, inherited from an
    affected parent in much of the sleep-related hypermotor presentation, and
    inherited from a clinically unaffected mosaic parent in a minority. The
    disease-level inheritance blocks carry that distinction with its evidence.
  evidence:
  - reference: PMID:23086397
    reference_title: "De novo gain-of-function KCNT1 channel mutations cause malignant migrating partial seizures of infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced KCNT1 in 9 additional individuals with MMPSI and identified mutations in 4 of them, in total identifying mutations in 6 out of 12 unrelated affected individuals."
    explanation: >-
      Establishes the gene-disease relationship with a diagnostic yield of 6/12
      in the disorder-defining cohort.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent recurrent KCNT1 variants were c.2800G>A; p.Ala934Thr (n = 5) and c.862G>A; p.Gly288Ser (n = 4)."
    explanation: >-
      Names the two commonest recurrent variants and their counts in the
      international cohort.
  - reference: PMID:29196579
    reference_title: "Clinical and molecular characterization of KCNT1-related severe early-onset epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All evaluated KCNT1 variants resulted in marked gain of function with significantly increased channel amplitude and variable blockade by quinidine."
    explanation: >-
      Confirms gain of function as the uniform functional consequence, and
      records that quinidine sensitivity is not uniform across variants.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotypic analysis of the whole cohort of 248 individuals showed only missense mutations and one inframe deletion in KCNT1."
    explanation: >-
      Establishes the variant-class restriction across the largest cohort, and
      is the reason this entry says all-missense-but-one rather than
      all-missense.
  - reference: PMID:34114611
    reference_title: "KCNT1-related epilepsies and epileptic encephalopathies: phenotypic and mutational spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "many of the autosomal dominant or sporadic sleep-related hypermotor epilepsy-associated mutations to be clustered around the RCK2 domain in the C terminus, distal to the NADP domain. Mutations associated with EIMFS/non-EIMFS developmental and epileptic encephalopathies did not show a particular pattern of distribution"
    explanation: >-
      The one positional genotype-phenotype signal that does exist: variants
      causing the milder sleep-related hypermotor presentation cluster around
      RCK2, while the encephalopathy-associated variants are scattered. This is
      a group-level enrichment, not a rule for an individual variant.
  - reference: PMID:36499459
    reference_title: "Functional Effects of Epilepsy Associated KCNT1 Mutations Suggest Pathogenesis via Aberrant Inhibitory Neuronal Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutations studied, except T314A, increased the amplitude of KCNT1 currents, and some mutations shifted the voltage dependence of KCNT1 open probability, increasing the proportion of channels open at the resting membrane potential."
    explanation: >-
      A 14-variant survey establishing that current increase is near-universal
      but not absolute, and naming the second gating mechanism (a shift in
      voltage dependence) alongside raw amplitude.
  - reference: PMID:36499459
    reference_title: "Functional Effects of Epilepsy Associated KCNT1 Mutations Suggest Pathogenesis via Aberrant Inhibitory Neuronal Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The T314A mutation did not affect KCNT1 current amplitude but abolished its voltage dependence."
    explanation: >-
      The documented exception. Recorded because it means a new KCNT1 variant
      cannot simply be assumed to raise current amplitude, even though nearly
      all do.
treatments:
- name: Quinidine
  description: >-
    Quinidine is a partial antagonist of the Slack channel and the obvious
    precision-therapy candidate for a KCNT1 gain-of-function disorder: it
    reverses the increased current for the variants tested in vitro. Clinical
    results have not followed. The only randomized trial — order-randomized,
    blinded, placebo-controlled, crossover, in six people with the severe
    sleep-related hypermotor presentation — found no efficacy, with seizures
    nonsignificantly increased and dose-limiting QT prolongation appearing at
    serum levels well below the therapeutic range. A prospective series of four
    infants with the EIMFS presentation treated early likewise showed no
    benefit. Against this, open-label cohort experience is mixed but not null:
    5 of 11 children had at least a 25% seizure reduction, and individual case
    reports describe marked improvement. Quinidine is therefore best regarded
    as an unproven option for an individual patient rather than an established
    therapy, and the cardiac risk is real, particularly given that cardiac
    arrhythmia is itself part of the KCNT1 phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: quinidine
      term:
        id: CHEBI:28593
        label: quinidine
  target_mechanisms:
  - target: Elevated Sodium-Activated Potassium Current
    description: >-
      Quinidine blocks the mutant Slack channel, reducing the pathologically
      increased KNa current that is the shared functional lesion of the
      disorder.
    evidence:
    - reference: PMID:24591078
      reference_title: "KCNT1 gain of function in 2 epilepsy phenotypes is reversed by quinidine."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "exposure to quinidine significantly reduces this gain of function for all mutations studied"
      explanation: >-
        Establishes that the drug acts on precisely the mechanism node it is
        linked to.
  evidence:
  - reference: PMID:29196578
    reference_title: "Precision therapy for epilepsy due to KCNT1 mutations: A randomized trial of oral quinidine."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Quinidine did not show efficacy in adults and teenagers with ADNFLE. Dose-limiting cardiac side effects were observed even in the presence of low measured serum quinidine levels."
    explanation: >-
      The only randomized controlled trial refutes clinical efficacy in the
      sleep-related hypermotor presentation and documents the dose-limiting
      cardiac toxicity.
  - reference: PMID:29196578
    reference_title: "Precision therapy for epilepsy due to KCNT1 mutations: A randomized trial of oral quinidine."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures per day were nonsignificantly increased by quinidine (median 2, 95% confidence interval -1.5 to +5, p = 0.15) and no patient had a 50% seizure reduction."
    explanation: >-
      Gives the primary outcome: no patient reached the 50% responder threshold
      and the point estimate favoured placebo.
  - reference: PMID:30182418
    reference_title: "Lack of response to quinidine in KCNT1-related neonatal epilepsy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had no reported benefit to quinidine therapy despite age at treatment initiation."
    explanation: >-
      A prospective protocol-driven series in the infantile presentation, testing
      and refuting the hypothesis that early treatment is what the trial lacked.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven tried quinidine; 45% had marked (>50% seizure reduction) or some improvement (25%-50% seizure reduction)."
    explanation: >-
      Open-label cohort experience in which about half of treated children
      improved, the counterweight to the negative trial and series.
  - reference: PMID:25042079
    reference_title: "Targeted treatment of migrating partial seizures of infancy with quinidine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with quinidine was correlated with a marked reduction in seizure frequency and improved psychomotor development."
    explanation: >-
      The index case report of quinidine benefit, which is what motivated the
      subsequent trials.
  - reference: PMID:39093319
    reference_title: "Efficacy of anti-seizure medications and alternative therapies (ketogenic diet, CBD, and quinidine) in KCNT1-related epilepsy: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "QUIN resulted in benefit in 44.6% (25/56)"
    explanation: >-
      Pooled response rate in the EIMFS group across 43 studies, the largest
      denominator available for quinidine in the infantile presentation.
  - reference: PMID:39093319
    reference_title: "Efficacy of anti-seizure medications and alternative therapies (ketogenic diet, CBD, and quinidine) in KCNT1-related epilepsy: A systematic review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "QUIN was trialed in 8 patients with no reported benefit."
    explanation: >-
      In the sleep-related hypermotor group, quinidine benefited none of eight
      patients. Read alongside the negative randomized trial in the same
      phenotype, this is the clearest signal in the dataset: the phenotype
      predicts the answer better than any variant does, and quinidine has no
      demonstrated role in this presentation.
  - reference: PMID:35116000
    reference_title: "Efficacy of Anti-seizure Medications, Quinidine, and Ketogenic Diet Therapy for KCNT1-Related Epilepsy and Genotype-Efficacy Correlation Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all patients (ours and those in previous reports), the overall ERs for quinidine and KDT were 26.0 and 43.5%, respectively (P = 0.135)."
    explanation: >-
      Applies the stricter 50%-seizure-reduction responder definition, under
      which quinidine's response rate falls to 26% and does not differ
      significantly from ketogenic diet.
  - reference: PMID:30182418
    reference_title: "Lack of response to quinidine in KCNT1-related neonatal epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two patients with novel variants, showed characteristic gain-of-function and were thus predicted to be pathogenic. Of interest, these variants were essentially insensitive to high levels of quinidine."
    explanation: >-
      Supports variant-level quinidine sensitivity testing as a way to identify
      patients for whom the drug cannot work, a different claim from the
      efficacy claim the same paper refutes.
  notes: >-
    The two evidence directions here are deliberate and not a contradiction to
    be tidied away. The randomized trial and the prospective neonatal series
    refute efficacy; the open-label cohort and case report support it in some
    individuals. The most likely reconciliation is that quinidine sensitivity is
    variant-specific and that achievable brain concentrations are marginal, both
    of which are recorded above as separate evidence items.
- name: Cannabidiol
  description: >-
    Pharmaceutical-grade cannabidiol produced the highest response rate of any
    agent in the international cohort, with 5 of 7 treated children showing at
    least some seizure reduction. This is open-label, uncontrolled, small-sample
    experience in a disorder where regression to the mean and reporting
    enthusiasm both operate, so it is a lead rather than an established
    treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cannabidiol
      term:
        id: CHEBI:69478
        label: cannabidiol
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven used cannabidiol; 71% experienced marked or some improvement."

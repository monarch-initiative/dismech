      in this disorder accumulates during the first months of life.
  - reference: PMID:41981306
    reference_title: "Antisense oligonucleotide-mediated knockdown therapy in two infants with severe KCNT1 epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrathecal delivery of an experimental, non-allele-specific, KCNT1-targeting antisense oligonucleotide by lumbar puncture in two 2-year-old females with KCNT1 p.R474H, a severe, recurrent pathogenic variant, led to a significant reduction in seizure frequency and intensity."
    explanation: >-
      The first human efficacy result for any KCNT1-directed therapy, and the
      reason this treatment is no longer preclinical-only. Note the
      oligonucleotide was non-allele-specific, which is the design question the
      knowledge gap on translation raises.
  - reference: PMID:41981306
    reference_title: "Antisense oligonucleotide-mediated knockdown therapy in two infants with severe KCNT1 epileptic encephalopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, investigational treatment was also associated with the development of ventricular enlargement or hydrocephalus in both patients, prompting in one case the redirection of goals of care, pointing to a potential monitorable toxicity of some intrathecal antisense oligonucleotides."
    explanation: >-
      Records the serious adverse outcome in both treated patients. It is filed

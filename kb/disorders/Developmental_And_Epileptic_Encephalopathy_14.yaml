name: Developmental and Epileptic Encephalopathy 14
creation_date: "2026-09-07T00:00:00Z"
description: >-
  Developmental and epileptic encephalopathy 14 (DEE14) is the etiology-defined
  disorder caused by heterozygous gain-of-function missense variants in KCNT1,
  which encodes the sodium-activated potassium channel Slack (KNa1.1). The
  variants cluster in the C-terminal regulator-of-conductance (RCK) domains and
  in the S5 transmembrane segment, and they raise Slack current many-fold, not
  by changing the gating of individual channels but by increasing cooperative
  gating between channels in a cluster. That a potassium-channel gain of
  function should cause epilepsy at all is the central paradox of the disorder;
  the leading resolution is that the excess KNa current falls disproportionately
  on GABAergic interneurons at subthreshold voltages, disabling inhibition and
  leaving cortical networks hyperexcitable and hypersynchronous.
  Clinically DEE14 is highly pleiotropic. Roughly two-thirds of children present
  with epilepsy of infancy with migrating focal seizures, and the rest span
  autosomal dominant sleep-related hypermotor epilepsy, Ohtahara and West
  syndromes, early myoclonic encephalopathy, and focal or multifocal epilepsy;
  the same variant can produce different syndromes in different members of one
  family. Seizures are pharmacoresistant, developmental plateau or regression is
  usual, and mortality is high. Quinidine, a partial Slack antagonist, is the
  precision-therapy candidate, but the one randomized trial was negative and
  clinical benefit outside case reports has been inconsistent. Antisense
  oligonucleotide silencing of KCNT1 has overtaken it: effective in mice, and
  in two children it cut seizure frequency and intensity, though both developed
  ventricular enlargement or hydrocephalus. Three registered trials are now
  running, so this is a disorder whose therapeutic picture is changing.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy
- Channelopathy
synonyms:
- DEE14
- EIEE14
- KCNT1-related epilepsy
- KCNT1 early infantile epileptic encephalopathy
- epileptic encephalopathy, early infantile, 14
- early infantile epileptic encephalopathy caused by mutation in KCNT1

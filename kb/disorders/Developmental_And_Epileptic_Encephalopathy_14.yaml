      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "find motor cortex hyperexcitability and early-onset seizures, phenotypes strikingly similar to those of human patients"
      explanation: >-
        States the recapitulation claim directly.
experimental_models:
- name: KCNT1 P924L human iPSC-derived neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Genetically engineered human induced pluripotent stem cell-derived neurons
    homozygous for the KCNT1 P924L variant. This is the system in which the
    increased KNa current was first demonstrated in human neurons rather than a
    heterologous expression system, and in which the cell-autonomous
    hyperexcitability mechanism was established.
  modeled_mechanisms:
  - target: Shortened Action Potential with Enhanced Afterhyperpolarization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Current-clamp recordings in these neurons are the direct evidence for the
      action-potential waveform change and its effect on firing rate.
    limitations: >-
      The engineered neurons are homozygous for the variant whereas patients are
      heterozygous, and iPSC-derived neurons are developmentally immature
      relative to the postnatal cortex in which the disease manifests, so the
      developmental timing of the effect cannot be read off this system.
    evidence:
    - reference: PMID:31350261
      reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using genetically engineered human induced pluripotent stem cell (iPSC)-derived neurons, we have now found that sodium-dependent potassium currents are increased several-fold in neurons bearing a homozygous P924L mutation."
      explanation: >-
        Describes the model system and the homozygous engineering, and reports
        the current increase this link is grounded on.
- name: Xenopus oocyte two-electrode voltage clamp assay of mutant KCNT1
  experimental_model_type: OTHER
  description: >-
    Heterologous expression of human KCNT1 variants in Xenopus laevis oocytes
    with automated two-electrode voltage clamp. This is the workhorse assay for
    the disorder: it established the uniform gain of function across variants,
    the syndrome-associated group difference in gain magnitude, and the
    variant-specific quinidine sensitivity that bears directly on who might
    respond to the drug.
  modeled_mechanisms:
  - target: Elevated Sodium-Activated Potassium Current
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The assay measures the macroscopic current increase that defines the
      molecular lesion, and the effect of quinidine on it.
    limitations: >-
      An amphibian oocyte lacks the neuronal complement of interacting channels,
      auxiliary subunits and second messengers, so the assay reports channel
      behaviour rather than neuronal excitability, and its quinidine
      concentrations are far above what is achievable in human brain.
    evidence:
    - reference: PMID:24591078
      reference_title: "KCNT1 gain of function in 2 epilepsy phenotypes is reversed by quinidine."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we use a Xenopus laevis oocyte-based automated 2-electrode voltage clamp assay."
      explanation: >-
        Identifies the assay this model entry describes.
discussions:
- discussion_id: kcnt1_genotype_phenotype_discordance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the same KCNT1 variant produce a devastating infantile
    encephalopathy in one person and a comparatively mild sleep-related
    hypermotor epilepsy in another, sometimes within one family?
  attaches_to:
  - genetic#KCNT1
  - has_subtypes#EIMFS
  - has_subtypes#ADSHE
  rationale: >-
    p.Arg398Gln has been documented causing either the migrating-seizure
    presentation or the sleep-related hypermotor presentation in members of the
    same family, and the in vitro degree of current gain does not correlate with
    which syndrome results. Genotype therefore does not determine phenotype, and
    what does is unknown. This is not a curatorial nicety: it is why a variant
    found prenatally or in an unaffected relative cannot currently be given a
    prognosis, and why the cohort study found no significant differences on any
    outcome when the two recurrent variants were compared against the rest.
  evidence:
  - reference: PMID:26122718
    reference_title: "Mutations in KCNT1 cause a spectrum of focal epilepsies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is notable that we report that the one KCNT1 mutation, p.Arg398Gln, can lead to either of the two distinct phenotypes, ADNFLE or MMFSI, even within the same family. This indicates that genotype-phenotype relationships for KCNT1 mutations are not straightforward."
    explanation: >-
      Documents the same variant producing both syndromes within one family,
      which is the observation that defines this gap.
  - reference: PMID:25482562
    reference_title: "Human slack potassium channel mutations increase positive cooperativity between individual channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that the same mutation gave rise to different forms of epilepsy in different individuals."
    explanation: >-
      Independent confirmation from the functional side, in a study that also
      found no correlation between the magnitude of current gain and the
      resulting syndrome.
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When comparing the recurrent variants to the rest of the cohort with respect to developmental trajectory, presence of EIMFS, >500 seizures/mo, abnormal MRI, and treatment response, there were no statistically significant differences."
    explanation: >-
      A systematic negative result: the two commonest recurrent variants
      predicted none of five clinical outcomes.
- discussion_id: kcnt1_mechanism_model_discordance
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the interneuron-selective mechanism established in mouse cortex, or the
    cell-autonomous firing-rate mechanism established in human iPSC-derived
    neurons, account for hyperexcitability in human DEE14 cortex?
  attaches_to:
  - pathophysiology#Impaired GABAergic Interneuron Excitability
  - pathophysiology#Shortened Action Potential with Enhanced Afterhyperpolarization
  - mechanistic_hypotheses#interneuron_disinhibition
  - mechanistic_hypotheses#cell_autonomous_firing
  rationale: >-
    Both mechanisms are demonstrated, in different systems, and each is
    sufficient on its own account to explain the hyperexcitability. The mouse
    result requires a network — inhibition fails and the surrounding excitatory
    cells are released — while the human iPSC result is explicitly stated to be
    cell-autonomous and not to require network interactions. Neither study
    tests the other's mechanism in the other's preparation, though the mouse
    study did measure KNa current and action-potential generation in cortical
    excitatory neurons and found the subthreshold increase absent there, which
    is a direct negative test of the cell-autonomous account in mouse. The
    mismatch is not that a model failed to reproduce human disease; it is that
    two models of the same variant class give mechanistically different answers,
    and there is no human tissue measurement to arbitrate.

    One confound is large enough to weaken the framing before any biology is
    invoked: the iPSC-derived neurons are homozygous for P924L, while the mouse
    is heterozygous and patients are heterozygous. A double gene dose is the
    leading benign explanation for a cell-autonomous effect appearing where the
    mouse saw none, and it would have to be excluded before the two results are
    called irreconcilable. It matters therapeutically: an
    interneuron-selective lesion argues for cell-type-targeted intervention,
    whereas a cell-autonomous one argues for uniform knockdown of the sort the
    antisense approach delivers.
  proposed_experiments:
  - experiment_id: human_cortex_celltype_kna
    name: Cell-type-resolved KNa current measurement in human DEE14 cortex
    description: >-
      Measure subthreshold KNa current separately in identified excitatory and
      inhibitory neurons in human cortical tissue carrying a pathogenic KCNT1
      variant, or in human cortical organoids differentiated long enough to
      contain both populations, and test whether the current increase is
      interneuron-selective as in mouse or uniform as the cell-autonomous
      account implies.
    would_support:
    - pathophysiology#Impaired GABAergic Interneuron Excitability
    supporting_outcome:
    - >-
      A subthreshold KNa current increase confined to, or substantially larger
      in, GABAergic interneurons than in glutamatergic neurons in human tissue.
    would_refute:
    - pathophysiology#Impaired GABAergic Interneuron Excitability
    refuting_outcome:
    - >-
      A subthreshold KNa current increase of comparable magnitude in both
      neuronal classes, with excitatory neurons nonetheless firing faster.
  evidence:
  - reference: PMID:31350261
    reference_title: "An Epilepsy-Associated KCNT1 Mutation Enhances Excitability of Human iPSC-Derived Neurons by Increasing Slack K(Na) Currents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "occurs by a cell-autonomous mechanism that does not require network interactions"
    explanation: >-
      The explicit claim of cell-autonomy, which is what puts this result in
      tension with the network-dependent mouse mechanism.
  - reference: PMID:33113364
    reference_title: "Reduced GABAergic Neuron Excitability, Altered Synaptic Connectivity, and Seizures in a KCNT1 Gain-of-Function Mouse Model of Childhood Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "there is an increase in the KNa current across subthreshold voltages only in inhibitory neurons"
    explanation: >-
      The interneuron-selective claim, established in mouse and untested in
      human tissue.
- discussion_id: kcnt1_developmental_phenotype_origin
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the developmental impairment in DEE14 is caused by the seizure
    burden, and how much by the KCNT1 defect acting on brain development in
    parallel?
  attaches_to:
  - pathophysiology#Impaired Neurodevelopment
  - phenotypes#Developmental Plateau and Regression
  rationale: >-
    This is the "developmental" half of developmental and epileptic
    encephalopathy and it is unresolved. The observational anchor is only a
    temporal association: about half of children plateau at the moment seizures
    begin, which is equally consistent with seizures causing the arrest and with
    a common upstream cause producing both. Two findings argue for a parallel,
    seizure-independent contribution without demonstrating one — KCNT1 has a
    non-conducting function whose C-terminus binds proteins in developmental
    signalling pathways, and functional KNa1.1 conductance is present and
    developmentally regulated in prenatal human neurons, so the variant is
    acting long before the first seizure.

    It is not an academic question. If the impairment is seizure-driven, then
    seizure control at any age should help; if it accrues prenatally and in
    early infancy independent of seizures, then a therapy that arrives after
    infancy cannot recover it, and the treatment window is much earlier than the
    age at which children currently reach genetic diagnosis. The first two
    children given a KCNT1-lowering oligonucleotide were treated at two years
    old and had seizure reduction; what that did to development is the datum
    this gap wants.
  proposed_experiments:
  - experiment_id: prenatal_vs_postnatal_kcnt1_knockdown
    name: Prenatal versus postnatal Kcnt1 knockdown in a phenotype-expressing mouse
    description: >-
      Compare developmental and behavioural outcome after Kcnt1 knockdown begun
      prenatally, neonatally, and after seizure onset, in a knock-in mouse that
      expresses the phenotype, holding seizure control constant where possible
      so that developmental outcome can be separated from seizure burden.
    would_support:
    - pathophysiology#Impaired Neurodevelopment
    supporting_outcome:
    - >-
      Better developmental outcome from prenatal or neonatal knockdown than from
      post-onset knockdown achieving equivalent seizure control, which would
      show a seizure-independent developmental contribution.
    would_refute:
    - pathophysiology#Impaired Neurodevelopment
    refuting_outcome:
    - >-
      Developmental outcome tracking seizure control alone, with no additional
      benefit from treating before onset.
  evidence:
  - reference: PMID:32167590
    reference_title: "KCNT1-related epilepsy: An international multicenter cohort of 27 pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure onset ranged from 1 day to 6 months, and half (48.1%) exhibited developmental plateauing upon onset."
    explanation: >-
      The temporal association that both hypotheses have to explain, and which
      neither is currently able to distinguish itself by.
  - reference: PMID:42056090
    reference_title: "RNA targeting therapy for a prenatally enriched potassium channel associated with severe childhood epilepsy and premature death."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The emergence of functional KNa1.1 during fetal brain development and its contribution to neuronal excitability in utero suggest that GoF variants likely contribute to disease pathophysiology before birth."
    explanation: >-
      The authors' own inference that the variant acts prenatally. Quoted with
      its hedge intact — it says "suggest" and "likely", and this remains an
      inference from channel expression rather than a demonstration of prenatal
      harm.
- discussion_id: kcnt1_aso_translation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can antisense knockdown of KCNT1 be translated from the homozygous mouse to
    heterozygous human disease?
  attaches_to:
  - treatments#KCNT1-Lowering Antisense Oligonucleotide (investigational)
  - clinical_trials#NCT07227857
  - pathophysiology#Elevated Sodium-Activated Potassium Current
  rationale: >-
    A single intracerebroventricular gapmer ASO injection nearly abolished
    seizures and extended survival in the mouse, and better than 90% knockdown
    was tolerated in wild-type animals, which is reassuring about on-target
    liability. But the model is homozygous while patients are heterozygous and
    retain a wild-type allele, so a non-allele-selective ASO would knock down
    normal Slack alongside mutant Slack in people who need the normal channel.
    Whether an allele-selective approach is required, and whether treating after
    the developmental damage of infancy is already done can still change
    outcome, are both open.
  proposed_experiments:
  - experiment_id: allele_selective_aso_het_mouse
    name: Allele-selective versus non-selective knockdown in the heterozygous R455H mouse
    description: >-
      Compare allele-selective against non-selective ASO knockdown in the
      existing heterozygous Kcnt1 p.R455H mouse — homologous to the human
      p.R474H that both treated children carry, and already reported to have
      spontaneous seizures — measuring seizure control against residual
      wild-type Slack current. The comparison, not the model, is what is
      missing: a phenotype-expressing heterozygous model already exists, so the
      experiment does not require building one.
    would_support:
    - treatments#KCNT1-Lowering Antisense Oligonucleotide (investigational)
    supporting_outcome:
    - >-
      Seizure reduction from allele-selective knockdown at doses that leave
      wild-type Slack current substantially intact.
  evidence:
  - reference: PMID:36173683
    reference_title: "Antisense oligonucleotide therapy for KCNT1 encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "After a single intracerebroventricular bolus injection of a Kcnt1 gapmer ASO in symptomatic mice at postnatal day 40, seizure frequency was significantly reduced, behavioral abnormalities improved, and overall survival was extended compared with mice treated with a control ASO (nonhybridizing sequence)."
    explanation: >-
      The preclinical result this gap asks about translating.
  - reference: PMID:41981306
    reference_title: "Antisense oligonucleotide-mediated knockdown therapy in two infants with severe KCNT1 epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "investigational treatment was also associated with the development of ventricular enlargement or hydrocephalus in both patients, prompting in one case the redirection of goals of care"
    explanation: >-
      Reframes the gap. The translation question is no longer whether knockdown
      works in people — it does — but whether the delivery route can be made
      safe. Both treated children developed ventricular enlargement or
      hydrocephalus, and the authors read this as a property of intrathecal
      oligonucleotides rather than of KCNT1 knockdown, which is the hypothesis
      the running trials will test.

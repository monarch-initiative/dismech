      label: phosphatidylinositol-4,5-bisphosphate binding
  downstream:
  - target: Disorganized Radial Glial Scaffold and Impaired Neuronal Migration
    description: >-
      Expressed in embryonic mouse cortex, the variant, unlike wild-type MTSS2,
      disorganizes radial glial fibres and leaves neurons stalled as multipolar
      cells.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, whereas wild-type MTSS2 (MTSS2-FL) expression showed no defects in radial glial morphology or neuronal migration, the R671W mutant expression resulted in disorganized radial glial fibers and accumulation of multipolar neurons in the SVZ/lower IZ with very few bipolar neurons (Figure 6E)."
      explanation: The patient variant disrupts radial glia and neuronal migration in mouse cortex.
  - target: Impaired Cytokinesis of Radial Glial Progenitors
    description: >-
      Loss of Mtss2 blocks progenitor division, but the variant did not reduce
      RhoA activation or the number of dividing cells when expressed with
      wild-type Mtss2, so whether the variant acts through this route is
      contested.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "When Mtss2 was absent in the developing brain, it led to a halt in radial glial cell proliferation, disorganized radial fibers, and abnormal migration of neuronal progenitors."
      explanation: >-
        Loss of Mtss2 halts progenitor proliferation. INDIRECT for the variant,
        because this is knockdown rather than the patient allele.
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "However, it is unlikely that the mechanism behind this phenotype is a result of MTSS2-R671W acting in a dominant-negative manner on cell cycle progression."
      explanation: The authors' own data argue against the variant acting on progenitor division.
  - target: Reduced Synaptic Transmission
    description: >-
      In flies the variant only partly restores the function of the ortholog
      and impairs it when overexpressed.
    evidence:
    - reference: PMID:36067766
      reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of the human MTSS2 reference cDNA rescued the mim loss-of-function (LoF) phenotypes, whereas the c.2011C>T variant had decreased rescue ability compared to the reference, suggesting it is a partial LoF allele."
      explanation: The variant is a partial loss-of-function allele in the fly rescue assay.
    - reference: PMID:36067766
      reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, elevated expression of the variant, but not the reference MTSS2 cDNA, led to similar defects as observed by mim LoF, suggesting that the variant is toxic and may act as a dominant-negative allele when expressed in flies."
      explanation: Overexpressed, the variant reproduces the loss-of-function defects in flies.
  evidence:
  - reference: PMID:36067766

    explanation: Supports reanalysis of negative exomes.
discussions:
- discussion_id: mtss2_r671w_mode_of_action
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#De Novo MTSS2 p.Arg671Trp Variant
  - pathophysiology#Impaired Cytokinesis of Radial Glial Progenitors
  prompt: >-
    Does the recurrent p.Arg671Trp variant act in human cortex as a partial loss
    of function, a dominant negative, or a gain of function?
  rationale: >-
    The two model systems point different ways. In flies the variant only
    partly rescues the ortholog, as a partial loss of function would, and is
    toxic when overexpressed, as a dominant negative might be. In mouse cortex
    it disorganizes radial glia and migration but neither lowers RhoA
    activation nor progenitor division alongside wild-type Mtss2, and the
    authors raise a gain of function. Patient fibroblasts have normal MTSS2
    levels. Each reading predicts a different cortical defect, and none has
    been tested at physiological dosage.
  evidence:
  - reference: PMID:36067766
    reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, elevated expression of the variant, but not the reference MTSS2 cDNA, led to similar defects as observed by mim LoF, suggesting that the variant is toxic and may act as a dominant-negative allele when expressed in flies."
    explanation: The fly data suggest a toxic or dominant-negative allele.
  - reference: PMID:40698928
    reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This could also suggest a gain-of-function effect of the R671W mutation."
    explanation: The authors raise a gain of function as an alternative.
  proposed_experiments:
  - experiment_id: mtss2_r671w_heterozygous_knockin_cortex
    experiment_design: TARGETED_PERTURBATION
    name: Heterozygous Mtss2 p.Arg671Trp knock-in mouse cortical phenotyping
    description: >-
      Introduce the patient variant into one Mtss2 allele and examine embryonic
      cortex for radial glial organization, neuronal migration and progenitor
      division at physiological dosage. A migration defect without a division
      defect would match the electroporation results; a division defect would
      support the knockdown route.
    readouts:
    - name: Radial glial fibre organization and neuronal migration
      target: pathophysiology#Disorganized Radial Glial Scaffold and Impaired Neuronal Migration
      interpretation: >-
        A defect at physiological dosage would confirm the migration route for
        the patient allele.
    - name: Proportion of dividing radial glial progenitors
      target: pathophysiology#Impaired Cytokinesis of Radial Glial Progenitors
      interpretation: >-
        No change would argue against the variant acting through progenitor
        division.
- discussion_id: mtss2_ocular_findings_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Ocular anomalies
  prompt: >-
    What causes the eye findings in this disorder, and why do the specific
    findings differ so much between patients?
  rationale: >-
    Eye involvement is common, in nine of eleven reported patients, but no
    single finding recurs: foveal hypoplasia, optic nerve atrophy, iris cysts
    and refractive errors each appear in one or a few patients. The cited
    mechanism studies address the cortex and synapses, not the eye.
  evidence:
  - reference: PMID:41641084
    reference_title: "Identification of a Chinese patient with MTSS2-causing intellectual disability by WES reanalysis: a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmological anomalies | + | + | + | + | + | + | + | − | + | − | + | 81.8%(9/11)"
    explanation: >-
      Eye anomalies in 9 of 11 patients.
  - reference: PMID:41641084
    reference_title: "Identification of a Chinese patient with MTSS2-causing intellectual disability by WES reanalysis: a case report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 10 previously reported IDDOF patients, some showed ophthalmological manifestations such as foveal hypoplasia, progressive optic nerve atrophy, iris cysts, and myopia"
    explanation: The specific eye findings differ between patients.
notes: >-
  Named MTSS2-Related Neurodevelopmental Disorder rather than with the MONDO
  and OMIM label because the gene-related name is in recurring use in the
  primary literature, in the titles of PMID:37657631 and PMID:39890443; the
  MONDO label and the acronym IDDOF are kept as synonyms. No GeneReviews
  chapter covers MTSS2. MTSS2 is distinct from its paralog MTSS1, which has a
  separate cancer literature that is not used here. Phenotype frequencies come
  from the pooled table of all eleven reported patients in PMID:41641084.
  Findings reported in a single patient (hypothyroidism, duodenal obstruction
  from Ladd's bands, inguinal hernias, cryptorchidism, spina bifida occulta)
  are not curated as phenotypes; the eleventh patient's ptosis and bitemporal
  narrowing are recorded under facial dysmorphism. No disease-specific treatment has been reported,
  so no treatments are recorded.

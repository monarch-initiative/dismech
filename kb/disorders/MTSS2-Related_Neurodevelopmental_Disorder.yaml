name: MTSS2-Related Neurodevelopmental Disorder
creation_date: "2026-11-16T15:54:53Z"
category: Mendelian
disease_term:
  preferred_term: intellectual developmental disorder with ocular anomalies and distinctive facial features
  term:
    id: MONDO:0859303
    label: intellectual developmental disorder with ocular anomalies and distinctive facial features
synonyms:
- intellectual developmental disorder with ocular anomalies and distinctive facial features
- IDDOF
- MTSS2-related disorder
description: >-
  Autosomal dominant neurodevelopmental disorder caused by a recurrent
  heterozygous missense variant in MTSS2, c.2011C>T p.(Arg671Trp), which every
  reported patient carries and which arose de novo in every patient whose
  parents were tested. MTSS2 (also MTSS1L or ABBA) is an
  I-BAR protein that binds actin monomers and deforms phosphoinositide-rich
  membranes, and it is a different gene from its paralog MTSS1. The core
  features are global developmental delay, especially of language, mild
  intellectual disability, microcephaly or relative microcephaly, eye
  anomalies and mild facial dysmorphism; hypotonia, seizures, autistic
  behaviour, hearing impairment, feeding difficulties and poor coordination
  occur in some patients. In embryonic mouse cortex the variant disorganizes the radial glial
  scaffold and disrupts neuronal migration, while loss of Mtss2 blocks radial
  glial cytokinesis. In flies the variant only partly replaces the ortholog
  and is toxic when overexpressed. How the variant acts in human cortex, as a
  partial loss of function, a dominant negative or a gain of function, is
  unresolved. About eleven patients have been reported, and no
  disease-specific treatment exists.

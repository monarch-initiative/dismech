    reference_title: "MTSS2-related neurodevelopmental disorder: Further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case confirms that the MTSS2-related NDD is caused by the recurrent MTSS2 missense variant p.Arg671Trp."
    explanation: An independent case confirms the gene-disease relationship.
animal_models:
- name: mim loss-of-function fly with human MTSS2 cDNA
  species: Drosophila melanogaster
  species_term:
    preferred_term: Drosophila melanogaster
    term:
      id: NCBITaxon:7227
      label: Drosophila melanogaster
  genotype: mim loss of function, with human reference or c.2011C>T MTSS2 cDNA expressed
  publication: PMID:36067766
  description: >-
    Loss of mim, the single fly ortholog of MTSS1 and MTSS2, shortens lifespan,
    impairs locomotion and reduces synaptic transmission. Human reference
    MTSS2 rescues these defects, the patient variant rescues them only partly,
    and overexpressing the variant causes similar defects.
  modeled_mechanisms:
  - target: Reduced Synaptic Transmission
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Reduced synaptic transmission in adult flies lacking mim.
    limitations: >-
      mim is the fly ortholog of both MTSS1 and MTSS2, the variant is tested by
      rescue and overexpression rather than as a heterozygous knock-in, and the
      readout is in adult flies rather than developing cortex.
    evidence:
    - reference: PMID:36067766
      reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of mim led to a reduction in lifespan, impaired locomotor behavior, and reduced synaptic transmission in adult flies."
      explanation: The fly model shows reduced synaptic transmission.
- name: Mtss2 knockdown and MTSS2 R671W in utero electroporation mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: >-
    In utero electroporation of Mtss2 shRNA, or of human wild-type or R671W
    MTSS2 cDNA, into embryonic mouse cortex
  publication: PMID:40698928
  description: >-
    Embryonic cortex studied after knockdown of Mtss2 or expression of the
    human patient variant.
  modeled_mechanisms:
  - target: Disorganized Radial Glial Scaffold and Impaired Neuronal Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: The patient variant disorganizes radial glia and neuronal migration.
    limitations: >-
      The variant is overexpressed on a wild-type background for a few
      embryonic days, not carried as a heterozygous knock-in.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, whereas wild-type MTSS2 (MTSS2-FL) expression showed no defects in radial glial morphology or neuronal migration, the R671W mutant expression resulted in disorganized radial glial fibers and accumulation of multipolar neurons in the SVZ/lower IZ with very few bipolar neurons (Figure 6E)."
      explanation: The variant disrupts radial glia and migration in vivo.
  - target: Impaired Cytokinesis of Radial Glial Progenitors
    relationship: PERTURBS
    fidelity: UNKNOWN
    description: Knockdown of Mtss2 blocks radial glial progenitor cytokinesis.
    limitations: >-
      Knockdown removes Mtss2, whereas patients carry one missense allele that
      did not reduce progenitor division in the same study.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Downregulation of Mtss2's expression had a striking effect on RGP cell progression, resulting in a blocking of cytokinesis and a subsequent apoptosis."
      explanation: Knockdown blocks progenitor cytokinesis.

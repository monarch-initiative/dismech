genetic:
- name: MTSS2
  association: >-
    Causal gene. Every reported patient is heterozygous for the same
    c.2011C>T p.(Arg671Trp) variant, de novo in each patient whose parents were
    tested, found by exome sequencing in unrelated patients from several
    countries.
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: MTSS2
    term:
      id: hgnc:25094
      label: MTSS2
  notes: >-
    No ClinGen gene-disease validity record exists for MTSS2, so none is
    recorded here.
  variants:
  - name: p.Arg671Trp (c.2011C>T)
    description: >-
      The recurrent de novo variant, reported as a hotspot; it is the only
      allele reported for this disorder.
    evidence:
    - reference: PMID:37657631
      reference_title: "MTSS2-related neurodevelopmental disorder: Further delineation of the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This case confirms that the MTSS2-related NDD is caused by the recurrent MTSS2 missense variant p.Arg671Trp."
      explanation: The recurrent variant causes the disorder.
    - reference: PMID:39890443
      reference_title: "MTSS2 -Related Disorder: Refining the Phenotype in Four New Cases and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We present clinical data about four new unrelated patients harboring the MTSS2 recurrent variant c.2011C>T (p.Arg671Trp)."
      explanation: Four more unrelated patients carry the same variant.
    - reference: PMID:41641084
      reference_title: "Identification of a Chinese patient with MTSS2-causing intellectual disability by WES reanalysis: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study reports an additional patient and new phenotypes for IDDOF and suggests the c.2011C>T(p.Arg671Trp) variant in the MTSS2 gene as a hotspot."
      explanation: The variant is a mutational hotspot.
  evidence:
  - reference: PMID:36067766
    reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report five individuals with the same heterozygous de novo variant in MTSS2 (GenBank: NM_138383.2: c.2011C>T ... ) identified by exome sequencing."
    explanation: >-
      The founding cohort of five patients with the same de novo variant. The
      bracketed protein change in the source is bridged with an ellipsis.

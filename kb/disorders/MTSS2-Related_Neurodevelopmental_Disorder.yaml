- name: Disorganized Radial Glial Scaffold and Impaired Neuronal Migration
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    In embryonic mouse cortex, expression of MTSS2 R671W disorganized radial
    glial fibres, kept progenitors in the ventricular and subventricular zones,
    and left neurons multipolar with few bipolar migrating cells, without
    changing the number of dividing cells. The authors suggest the variant acts
    mainly after cell division, for example on migration. MTSS2 (ABBA) normally
    regulates actin and membrane dynamics in radial glia, and depleting it
    impairs radial glial process extension.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: migrating cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: radial glia-guided neuronal migration
    modifier: ABNORMAL
    term:
      id: GO:0021801
      label: cerebral cortex radial glia-guided migration
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Global developmental delay
    description: >-
      Abnormal cortical development is the proposed basis of the developmental
      delay.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The data presented indicate that the abnormal expression of the R671W mutation, rather than the normal protein, leads to abnormal development of the developing cortex."
      explanation: >-
        The variant disturbs cortical development in mice. INDIRECT for the
        human phenotype because it is a mouse model.
  evidence:
  - reference: PMID:40698928
    reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings make it plausible to suggest that a mechanism responsible for the phenotype associated with overexpression of the human variant may primarily involve post-cell division processes, such as cell migration."
    explanation: The authors place the variant's effect after cell division, on processes such as migration.
  - reference: PMID:18413296
    reference_title: "ABBA regulates plasma-membrane and actin dynamics to promote radial glia extension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In radial-glia-like C6-R cells, ABBA localises to the interface between the actin cytoskeleton and plasma membrane, and its depletion by RNAi led to defects in lamellipodial dynamics and process extension."
    explanation: MTSS2 (ABBA) is needed for radial glial process extension in a cell model.
- name: Impaired Cytokinesis of Radial Glial Progenitors
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Abnormal Progenitor Division and Fate Choice"
  description: >-
    At the cleavage furrow of dividing radial glial progenitors, Mtss2 recruits
    the scaffold protein Nedd9 and promotes RhoA activity. Knocking Mtss2 down
    in embryonic mouse cortex blocks cytokinesis, followed by apoptosis, and
    halts progenitor proliferation. This branch rests on knockdown: the patient
    variant expressed with wild-type Mtss2 neither reduced RhoA activation nor
    changed the number of dividing cells, so it is marked provisional. The
    module node is framed around the centrosome and spindle, whereas Mtss2 acts
    at the cleavage furrow.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: cytokinesis
    modifier: DECREASED
    term:
      id: GO:0000910
      label: cytokinesis
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Microcephaly
    description: >-
      Failed progenitor division is the authors' proposed route to microcephaly.
    evidence:
    - reference: PMID:40698928
      reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, these findings offer valuable mechanistic insights into the development of microcephaly and the cerebral cortex by identifying Mtss2 as a novel regulator involved in ensuring the accurate progression of mitosis in neuronal progenitor cells."
      explanation: >-
        Links Mtss2-dependent progenitor mitosis to microcephaly. INDIRECT
        because it is a mouse knockdown result.
  evidence:
  - reference: PMID:40698928
    reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During cell division, Mtss2 localized to the cleavage furrow, where it recruited the scaffolding protein Nedd9 and positively influenced the activity of RhoA, a crucial regulator of cell division."
    explanation: Mtss2 acts at the cleavage furrow through Nedd9 and RhoA.
  - reference: PMID:40698928
    reference_title: "Identification of novel human microcephaly-linked protein Mtss2 that mediates cortical progenitor cell division and corticogenesis through Nedd9-RhoA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Downregulation of Mtss2's expression had a striking effect on RGP cell progression, resulting in a blocking of cytokinesis and a subsequent apoptosis."
    explanation: Knockdown blocks radial glial progenitor cytokinesis.
- name: Reduced Synaptic Transmission
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In flies, loss of the ortholog mim reduces synaptic transmission. In mice,
    Mtss1l (MTSS2) is induced in activated dentate granule cells and is needed
    for activity-dependent increases in dendritic spines and excitatory
    currents, and ABBA is enriched in parvalbumin-positive interneurons and
    drives spine initiation in cultured neurons. Whether synaptic function is
    impaired in patients has not been studied.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    modifier: DECREASED
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  downstream:
  - target: Intellectual disability
    description: >-
      Impaired neural function is the proposed basis of the intellectual
      disability.
    evidence:
    - reference: PMID:36067766
      reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, our findings support that mim is important for appropriate neural function, and that the MTSS2 c.2011C>T variant causes a syndromic form of intellectual disability."
      explanation: >-
        Ties the fly neural-function results to the human disorder. INDIRECT
        because the neural readouts come from flies.
  evidence:
  - reference: PMID:36067766
    reference_title: "The recurrent de novo c.2011C>T missense variant in MTSS2 causes syndromic intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of mim led to a reduction in lifespan, impaired locomotor behavior, and reduced synaptic transmission in adult flies."
    explanation: Loss of the fly ortholog reduces synaptic transmission.
  - reference: PMID:31232686
    reference_title: "Exercise-induced enhancement of synaptic function triggered by the inverse BAR protein, Mtss1L."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "shRNA-mediated Mtss1L knockdown in vivo prevented the exercise-induced increases in spines and excitatory postsynaptic currents."
    explanation: Mtss1l (MTSS2) is needed for activity-dependent synaptic changes in mouse hippocampus.
  - reference: PMID:41359239
    reference_title: "Expression, Subcellular Localization, and Mechanistic Analysis of Intellectual Disability Syndrome Protein ABBA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As a novel discovery, we found that ABBA was highly expressed in GABAergic inhibitory neurons, such as parvalbumin-positive interneurons in the hippocampus."
    explanation: MTSS2 (ABBA) is enriched in parvalbumin-positive interneurons.
  - reference: PMID:41359239
    reference_title: "Expression, Subcellular Localization, and Mechanistic Analysis of Intellectual Disability Syndrome Protein ABBA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through live-cell imaging, we demonstrated that ABBA facilitates spine initiation by clustering on the plasma membrane before a new filopodium appears."
    explanation: MTSS2 (ABBA) drives dendritic spine initiation in cultured neurons.

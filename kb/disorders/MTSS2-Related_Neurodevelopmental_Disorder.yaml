      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41641084
    reference_title: "Identification of a Chinese patient with MTSS2-causing intellectual disability by WES reanalysis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) initially did not find a phenotype-contributing variant in 2021, whereas reanalysis of WES data in 2024 revealed that the de novo c.2011C>T(p.Arg671Trp) heterozygous variant of the MTSS2 gene in the patient turned out to be pathogenic, which had been reported to cause IDDOF in 2022."
    explanation: A reanalysed exome found the variant after an initial negative result.
  - reference: PMID:41641084
    reference_title: "Identification of a Chinese patient with MTSS2-causing intellectual disability by WES reanalysis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

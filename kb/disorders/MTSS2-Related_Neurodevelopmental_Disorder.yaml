pathophysiology:
- name: De Novo MTSS2 p.Arg671Trp Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The recurrent heterozygous de novo c.2011C>T p.(Arg671Trp) variant changes a
    conserved residue in the C-terminal part of MTSS2, outside the
    membrane-binding I-BAR domain. MTSS2 binds ATP-actin monomers through its WH2 domain
    and deforms PI(4,5)P2-rich membranes through its I-BAR domain; the effect of
    the variant on these activities has not been measured, so they are bound
    without a modifier. Patient fibroblasts have normal MTSS2 protein levels.
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      NM_138383.2:c.2011C>T, p.(Arg671Trp), heterozygous in every reported
      patient and de novo in each one whose parents were tested. In a fly rescue assay it behaves as a partial loss of
      function, and it is toxic when overexpressed in flies; in mouse cortex it
      does not act as a dominant negative on RhoA activation or progenitor
      division. No functional_impact_category is set because these readings
      disagree.

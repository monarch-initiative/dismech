notes: >-
  Scope. This entry curates the Mendelian, MT-RNR1-dependent susceptibility, in which
  an ordinary dose deafens a carrier. Aminoglycosides also cause dose- and
  duration-dependent ototoxicity in people with no MT-RNR1 variant, which is a
  pharmacological toxicity rather than this disease; the drug-resistant tuberculosis
  prevalence record is included and explicitly labelled so the two are not conflated.

  Gene assignment. MONDO records TRMU as the causal gene for MONDO:0010799 under
  RO:0004003, and the automated Named Entity Confusion preflight therefore flagged the
  research report for mentioning MT-RNR1 45 times against TRMU 3 times. That warning is
  a false positive: OMIM 580000, the entity MONDO maps to, is the MT-RNR1 locus, and
  the OMIM identifier matches between MONDO and the report. Both genes are curated,
  with MT-RNR1 CAUSATIVE and TRMU MODIFIER.

  Exposure term left unbound. ECTO:9002231 "exposure to aminoglycoside antibiotic" is
  the exact term for this exposure and resolves in OLS, but it is absent from the local
  sqlite:obo:ecto build that term validation uses, so binding it fails. The antibiotic
  exposure terms that the local build does carry are all agrochemical - antibiotic
  pesticide, insecticide, acaricide, nematicide - and none of them describes therapeutic
  administration. Rather than bind a wrong term, the exposure is left with a free-text
  preferred_term; environmental-term-audit will classify it PARTIAL. Refreshing the ECTO
  build would let it be bound as-is.

  Ontology corrections. Nine of the nineteen CURIEs the research report suggested were
  wrong or obsolete and were corrected against OLS before use. The consequential one
  was CHEBI:9334, offered as streptomycin, which is sulfasalazine; also wrong were
  CL:0000598 (offered as inner hair cell, is pyramidal neuron), CL:0000211 (offered as
  vestibular hair cell, is electrically active cell), UBERON:0005988 (offered as organ
  of Corti, is atrium myocardial trabecula), UBERON:0009663 (offered as spiral ganglion,
  is telencephalic nucleus), UBERON:0001824 (offered as vestibular organ, is mucosa of
  larynx), UBERON:0001846 (offered as cochlea, is internal ear), and the obsolete
  GO:0070997 and CHEBI:41000.

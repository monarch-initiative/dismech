- name: Larval zebrafish acute and delayed aminoglycoside sensory-cell injury
  species: Zebrafish
  publication: PMID:39610699
  description: >-
    Living 5–8-day-postfertilization larvae were exposed to neomycin, gentamicin or G418, with acute
    imaging and survival after washout. Acute injury often involved mitochondrial calcium elevations
    and partial mitoTEMPO protection. Delayed injury correlated with lysosomal drug localization and
    responded to endolysosomal perturbation; G418 could also cause acute injury at higher doses.
  modeled_mechanisms:
  - target: Cochlear Hair Cell Loss
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Lateral-line sensory-cell loss provides a comparative drug-injury model for the cochlear injury
      node.
    model_scale: CELLULAR
    limitations: >-
      Lateral-line rather than cochlear hair cells; no MT-RNR1 susceptibility allele, hearing test
      or human regeneration claim.
    evidence:
    - reference: PMID:39610699
      reference_title: Multiple mechanisms of aminoglycoside ototoxicity are distinguished by subcellular localization of action.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: We found that 1 h exposure to 200 μM gentamicin was sufficient to cause damage comparable to that seen with neomycin if animals were incubated an additional 23 h in fresh medium
      explanation: >-
        Delayed whole-larva sensory-cell injury after washout.
    readouts:
    - name: Hair-cell survival after gentamicin washout
      target: Cochlear Hair Cell Loss
      direction: DECREASED
      description: >-
        Delayed loss despite removal of extracellular drug after one hour.
      evidence:
      - reference: PMID:39610699
        reference_title: Multiple mechanisms of aminoglycoside ototoxicity are distinguished by subcellular localization of action.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: We found that 1 h exposure to 200 μM gentamicin was sufficient to cause damage comparable to that seen with neomycin if animals were incubated an additional 23 h in fresh medium
        explanation: >-
          Observed survival endpoint.
  evidence:
  - reference: PMID:39610699
    reference_title: Multiple mechanisms of aminoglycoside ototoxicity are distinguished by subcellular localization of action.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Experiments were conducted on 5–8 dpf (days postfertilization) larval zebrafish.
    explanation: >-
      Whole-organism model scope.
  - reference: PMID:39610699
    reference_title: Multiple mechanisms of aminoglycoside ototoxicity are distinguished by subcellular localization of action.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: By contrast we observed no protection against 100 or 200 μM G418 using the 1+23 h exposure paradigm
    explanation: >-
      Limits transfer of the acute mitoTEMPO-sensitive pathway to delayed injury.
  notes: >-
    GPN altered intracellular distribution without lowering total fluorescent uptake, whereas bafilomycin
    reduced uptake and confounded a purely downstream lysosomal interpretation. Labeling efficiency
    prevented absolute between-drug concentration comparisons. Lysosomal membrane permeabilization,
    ferroptosis and pyroptosis were not established mediators. Calcium necessity/sufficiency was supported
    by cited prior work, not a new universal test in this study.
clinical_trials:
- name: NCT04105205
  phase: PHASE_I
  description: >-
    First-in-human single-ascending-dose apramycin safety, tolerability and pharmacokinetic study in
    healthy volunteers. The published analysis included 40 participants, of whom 30 received active
    drug. This is contextual antibiotic development, not a trial demonstrating prevention of hearing
    loss in MT-RNR1 carriers.
  evidence:
  - reference: clinicaltrials:NCT04105205
    reference_title: A Phase I, Randomized, Double-blind, Placebo-controlled, Single Ascending Dose Study to Assess the Safety, Tolerability, and Pharmacokinetics of Apramycin Administered Intravenously in Healthy Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: This is a first-in-human study to assess the safety, tolerability and pharmacokinetics of escalating single doses of apramycin.
    explanation: >-
      Registry summary establishes trial scope.
  - reference: PMID:35849148
    reference_title: Population pharmacokinetics of apramycin from first-in-human plasma and urine data to support prediction of efficacious dose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A total sample size of 40 subjects were enrolled in the trial and consecutively grouped into five sequential dose cohorts
    explanation: >-
      Small healthy-volunteer study; no carrier-specific otoprotection endpoint.
  notes: >-
    The published pharmacokinetic dose projections are not clinical efficacy results. Active-drug participants
    were predominantly male and White. Lower preclinical ototoxicity does not establish apramycin safety
    in inherited susceptibility.

inheritance:
- name: Mitochondrial (maternal) inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    MT-RNR1 is mitochondrially encoded, so the predisposing variant is transmitted
    only by mothers, to all of their children. A single index case therefore identifies
    a whole matriline whose members should be genotyped before any aminoglycoside is
    given.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: is caused by pathogenic variants in mitochondrial DNA (mtDNA) and is transmitted
      by maternal inheritance
    explanation: GeneReviews Genetic Counseling states the mode of transmission.
pathophysiology:
- name: MT-RNR1 12S rRNA Decoding-Site Variant
  biological_scale: MOLECULAR
  description: >-
    A homoplasmic or near-homoplasmic substitution in the mitochondrially encoded 12S
    rRNA, most commonly m.1555A>G and less commonly m.1494C>T, both of which fall in
    the decoding region of the small subunit.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Bacterial-Like Conformation of the Mitoribosomal Decoding Site
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17698299
    reference_title: Maternally inherited aminoglycoside-induced and nonsyndromic hearing
      loss is associated with the 12S rRNA C1494T mutation in three Han Chinese pedigrees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequence analysis of the complete mitochondrial genomes in these pedigrees
      showed the presence of the deafness-associated 12S rRNA C1494T mutation
    explanation: Identifies the second recurrent 12S rRNA decoding-site variant in
      maternally transmitted aminoglycoside-induced deafness.
- name: Bacterial-Like Conformation of the Mitoribosomal Decoding Site
  biological_scale: MOLECULAR
  description: >-
    The variant remodels the 12S rRNA decoding site so that it more closely resembles
    the bacterial 16S rRNA A site. This is the whole mechanism in one step: aminoglycosides
    are selective antibacterials only because the human mitoribosome normally differs
    from the bacterial ribosome at this position, and the variant erases that difference.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Aminoglycoside Binding to the Mitochondrial Ribosome
    causal_link_type: DIRECT
    description: >-
      The altered site is necessary but not sufficient - binding additionally requires
      that the drug be administered.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Pathogenic variants in MT-RNR1 can be associated with predisposition to
      aminoglycoside ototoxicity
    explanation: PARTIAL because the chapter states the predisposition without describing
      the structural basis; the 16S-mimicry step is the mechanistic reading.
- name: Aminoglycoside Binding to the Mitochondrial Ribosome
  biological_scale: MOLECULAR
  description: >-
    Drug occupies the altered decoding site. This node is the point at which the
    environmental exposure enters the pathograph, and nothing downstream of it happens
    in an unexposed carrier.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
- name: Impaired Mitochondrial Translation
  biological_scale: MOLECULAR
  description: >-
    Drug occupancy of the decoding site inhibits and misdirects synthesis of the
    mitochondrially encoded oxidative phosphorylation subunits, in the same way
    aminoglycosides act on the bacterial ribosome.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  downstream:
  - target: Cochlear Hair Cell Mitochondrial Injury and Oxidative Stress
    causal_link_type: DIRECT
- name: Cochlear Hair Cell Mitochondrial Injury and Oxidative Stress
  biological_scale: CELLULAR
  description: >-
    Loss of OXPHOS subunit synthesis collapses mitochondrial function in hair cells
    and generates reactive oxygen species. Hair cells are the vulnerable population
    because of their high and sustained metabolic demand.
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  locations:
  - preferred_term: spiral organ of cochlea (organ of Corti)
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Cochlear Hair Cell Death
    causal_link_type: DIRECT
- name: Cochlear Hair Cell Death
  biological_scale: CELLULAR
  description: >-
    Hair cells die by intrinsic apoptosis with a contribution from regulated necrosis.
    Loss follows a base-to-apex gradient, so the high-frequency-encoding basal turn
    goes first - which is what gives the audiogram its characteristic downward-sloping
    shape before speech frequencies are involved. Mammalian cochlear hair cells do
    not regenerate, which is why the deficit is permanent.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway
    modifier: INCREASED
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
  downstream:
  - target: Irreversible Bilateral Sensorineural Hearing Loss
    causal_link_type: DIRECT
- name: Irreversible Bilateral Sensorineural Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Bilateral, severe-to-profound, permanent sensorineural loss appearing days to weeks
    after exposure.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hearing loss associated with aminoglycoside ototoxicity is bilateral and
      severe to profound, occurring within a few days to weeks after administration
      of any amount (even a single dose) of an aminoglycoside antibiotic
    explanation: GeneReviews Clinical Characteristics gives the laterality, severity,
      latency, and the dose-independence that defines this presentation.
environmental:
- name: Systemic aminoglycoside antibiotic administration
  description: >-
    Therapeutic exposure to gentamicin, tobramycin, amikacin, kanamycin or streptomycin.
    In a carrier this is not a dose-related risk but a threshold event, which is why
    ordinary therapeutic drug monitoring does not protect against it.
  exposure_term:
    preferred_term: exposure to aminoglycoside antibiotic
  influences_mechanisms:
  - target: Aminoglycoside Binding to the Mitochondrial Ribosome
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure supplies the ligand for the altered decoding site. It is the second
      of the two hits, and the only one that is modifiable.
    evidence:
    - reference: PMID:20301595
      reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: occurring within a few days to weeks after administration of any amount
        (even a single dose) of an aminoglycoside antibiotic such as gentamycin, tobramycin,
        amikacin, kanamycin, or streptomycin
      explanation: Names the triggering exposure and the drugs that carry it, and states
        that any amount suffices.
  evidence:
  - reference: PMID:34015383
    reference_title: 'Prevalence of aminoglycoside-induced hearing loss in drug-resistant
      tuberculosis patients: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: aminoglycoside use results in high prevalence of ototoxic hearing loss
    explanation: Establishes the exposure as the operative risk factor at population
      scale.

  description: >-
    Document hearing thresholds, onset, aminoglycoside history and the maternal family history. Age-appropriate
    audiometry and objective tests when needed characterize sensorineural loss; high-frequency testing
    can identify injury that conventional speech-frequency tests miss. A failed neonatal screening test
    alone is not proof of permanent aminoglycoside deafness.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test

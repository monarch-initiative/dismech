    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: patients should undergo a baseline hearing test including ultrahigh frequencies prior to AG administration to allow for early and unambiguous assessment of potential ototoxic damage.
    explanation: >-
      General ototoxicity assessment guidance; obtain when feasible without delaying urgent treatment.
  - reference: PMID:25155176
    reference_title: Mitochondrial mutation m.1555A>G as a risk factor for failed newborn hearing screening in a large cohort of preterm infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

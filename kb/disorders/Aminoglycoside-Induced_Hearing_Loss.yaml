discussions:
- discussion_id: aihl_penetrance_without_exposure
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#MT-RNR1 12S rRNA Decoding-Site Variant
  - phenotypes#Bilateral Sensorineural Hearing Loss
  prompt: Does m.1555A>G cause hearing loss on its own, or only with exposure?
  rationale: >-
    Family-based series report substantial penetrance of hearing loss in carrier
    matrilines even excluding aminoglycoside-exposed members - 14% on average across
    three Chinese pedigrees - which reads as evidence that the variant is independently
    pathogenic. An unbiased population cohort found the opposite: 19 carriers ascertained
    by genotyping the British 1958 birth cohort had hearing thresholds indistinguishable
    from non-carriers at 44-45 years.

    The discrepancy is most simply explained by ascertainment. Pedigrees come to attention
    because someone in them is deaf, so they are enriched for whatever modifiers or
    exposures made that happen; a birth cohort is not. Curated as an interpretation
    rather than a contradiction because both results can hold - the variant may be
    weakly penetrant in the presence of nuclear modifiers such as TRMU while contributing
    nothing detectable at population level.

    The practical consequence runs the other way from what "low penetrance" usually
    implies. If carriers keep normal hearing into middle age unless they are exposed,
    then the case for genotyping before prescribing gets stronger, not weaker: there is
    a long, entirely healthy window in which the disease is preventable.
  evidence:
  - reference: PMID:22223843
    reference_title: 'Hearing in 44-45 year olds with m.1555A>G, a genetic mutation
      predisposing to aminoglycoside-induced deafness: a population based cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unbiased ascertainment of mutation carriers provides no evidence that this
      mutation alone causes non-syndromic hearing impairment in the UK.
    explanation: The population-level negative result, stated with its ascertainment
      caveat by the authors themselves.
  - reference: PMID:22223843
    reference_title: 'Hearing in 44-45 year olds with m.1555A>G, a genetic mutation
      predisposing to aminoglycoside-induced deafness: a population based cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The findings lend weight to arguments for genetic testing for this mutation
      prior to aminoglycoside administration, as hearing in susceptible individuals is
      expected to be preserved well into adult life.
    explanation: The authors draw the same inference curated here - preserved baseline
      hearing strengthens rather than weakens the case for pre-emptive testing.
  - reference: PMID:17698299
    reference_title: Maternally inherited aminoglycoside-induced and nonsyndromic hearing
      loss is associated with the 12S rRNA C1494T mutation in three Han Chinese pedigrees.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: When the effect of aminoglycosides was excluded, the penetrances of hearing
      loss in these seven pedigrees were 21%, 13% and 8%, with an average of 14%.
    explanation: The pedigree-based figure that the population study appears to contradict;
      PARTIAL because it supports one side of the interpretation rather than the whole.
- discussion_id: aihl_otoprotection_when_avoidance_impossible
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: Is there any way to protect a carrier who must receive an aminoglycoside?
  rationale: >-
    Avoidance fails when there is no adequate alternative - multidrug-resistant
    tuberculosis and some neonatal sepsis are the standing examples. No otoprotectant
    is approved for aminoglycoside ototoxicity. Sodium thiosulfate is approved for
    cisplatin ototoxicity in children, which is a different drug with a partly shared
    oxidative mechanism, and reduced-ototoxicity aminoglycosides such as apramycin
    remain preclinical. The entry therefore records no protective pharmacotherapy,
    and that absence is the gap rather than an omission.

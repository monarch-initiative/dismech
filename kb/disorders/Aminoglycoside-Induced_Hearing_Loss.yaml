    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: pharmacogenetic testing of variants in MT‐RNR1 should be undertaken in all individuals, of all age groups where this is possible in a clinically achievable time frame prior to use for all aminoglycosides
    explanation: >-

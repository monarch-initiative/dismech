notes: >-
  The entry concerns inherited MT-RNR1-associated susceptibility. General aminoglycoside ototoxicity is
  included only where it provides explicitly qualified experimental context. Hearing loss without documented
  exposure occurs in selected families; drug avoidance reduces exposure-associated risk without guaranteeing
  normal lifetime hearing. Vestibular toxicity of the drug class is not assigned as an established MT-RNR1-specific
  phenotype. The exact aminoglycoside-exposure concept is retained as free text because ECTO:9002231 has
  no label in the configured local ontology adapter. Full primary texts and the full GeneReviews chapter
  were reviewed; URL caches supply the scientific bodies where canonical PMID retrieval returned only
  an abstract.
progression:
- phase: Exposure-associated onset and persistent hearing impairment
  notes: >-
    Hearing loss can begin within days to weeks after aminoglycoside exposure and is often severe and
    irreversible. Hearing level and age at recognition vary. A normal newborn screen or a previously
    tolerated course does not establish safety of subsequent exposure.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Hearing loss associated with aminoglycoside ototoxicity is bilateral and severe to profound, occurring within a few days to weeks after administration of any amount (even a single dose) of an aminoglycoside antibiotic
    explanation: >-
      Clinical synthesis of the characteristic presentation; not a universal penetrance estimate.
  - reference: PMID:34032273

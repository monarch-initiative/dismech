- name: Reduced TRMU-Dependent tRNA Thiolation
  biological_scale: MOLECULAR
  description: >-
    The TRMU p.Ala10Ser modifier is associated with reduced 2-thiouridine modification of wobble U34
    in selected mitochondrial tRNAs. Purified-protein thermal stability and cellular abundance were
    reduced in the 2017 study, but degradation kinetics were not measured and the earlier import assay
    was normal. This branch applies to the studied modifier genotypes, not all MT-RNR1 carriers.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:28049726

inheritance:
- name: Mitochondrial (maternal) inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    Predisposing mitochondrial variants are maternally transmitted. Children of a woman carrying a variant
    are at risk of inheritance; male carriers do not transmit their mitochondrial variant. Homoplasmy
    and heteroplasmy require different counseling, and inherited variant status does not by itself predict
    hearing-loss onset or severity.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: All offspring of females with a mtDNA pathogenic variant are at risk of inheriting the pathogenic variant. Offspring of males with a mtDNA pathogenic variant are not at risk of inheriting the pathogenic variant.
    explanation: >-
      Defines maternal transmission without guaranteeing phenotype or identical heteroplasmy in offspring.
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Furthermore, the presence of the mtDNA pathogenic variant does not predict the age of onset or severity of hearing loss.
    explanation: >-
      Separates transmission from clinical penetrance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1422/
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the presence of the mtDNA pathogenic variant does not predict the age of onset or severity of hearing loss.
    explanation: >-
      Full GeneReviews chapter distinguishes inherited variant status from phenotype prediction.
pathophysiology:
- name: Predisposing MT-RNR1 Variants
  biological_scale: MOLECULAR
  description: >-
    Mitochondrial MT-RNR1 variants confer susceptibility to aminoglycoside ototoxicity. m.1555A>G and
    m.1494C>T are the best-supported alleles; m.1095T>C is also actionable with a lower level of evidence.
    Carriage can be homoplasmic or heteroplasmic. Variant status is a susceptibility state rather than
    a guarantee of hearing loss.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: there was sufficient and consistent evidence to assign actionability to the m.1555A>G and m.1494C>T variants with high levels of evidence and the m.1095T>C variant with a moderate level of evidence
    explanation: >-
      The clinical susceptibility set is broader than the alleles tested in the structural experiments.
  downstream:
  - target: Altered Mitoribosomal Decoding-Site Geometry
    description: >-
      This structural route concerns m.1555A>G and m.1494C>T. The same detailed geometry has not been
      demonstrated for every actionable MT-RNR1 variant.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18308926
      reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Both the C1494U and the A1555G mutation replace the noncanonical C1494·A1555 interaction by a Watson–Crick base pairing, thus shortening the extended conformation of the mitochondrial loop.
      explanation: >-
        Structural interpretation of the human-sequence decoding site in hybrid bacterial ribosomes;
        C1494U is the RNA equivalent of the DNA C1494T variant.
  genes:
  - preferred_term: MT-RNR1
    term:
      id: hgnc:7470
      label: MT-RNR1
- name: Altered Mitoribosomal Decoding-Site Geometry
  biological_scale: MOLECULAR
  description: >-
    The m.1555A>G and m.1494C>T substitutions introduce a Watson–Crick pair that shortens the extended
    mitochondrial decoding-site loop. Hybrid-ribosome experiments support altered decoding behavior,
    but loop closure alone did not reproduce the fidelity defect. This is not wholesale conversion of
    a human mitoribosome into a bacterial ribosome.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:18308926
    reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Both the C1494U and the A1555G mutation replace the noncanonical C1494·A1555 interaction by a Watson–Crick base pairing, thus shortening the extended conformation of the mitochondrial loop.
    explanation: >-
      Structural interpretation of the human-sequence decoding site in hybrid bacterial ribosomes;
      C1494U is the RNA equivalent of the DNA C1494T variant.
  downstream:
  - target: Aminoglycoside Binding to the Mitochondrial Ribosome
    description: >-
      The altered decoding environment increases aminoglycoside binding when drug is present. This
      interaction is supported by chemical footprinting of hybrid ribosomes.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2634874/
      reference_title: Genetic analysis of interactions with eukaryotic rRNA identify the mitoribosome as target in aminoglycoside ototoxicity - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: increased drug binding to its target and excessive aggravation of the mutants' inherent deficiency in ribosomal accuracy.
      explanation: >-
        Chemical footprinting and translation assays support enhanced drug binding plus inherent
        decoding infidelity in A1555G/C1494T hybrids.
  - target: Mitoribosomal Decoding Errors
    description: >-
      The mutant decoding site has reduced translational fidelity even without drug. The precise conformational
      sequence is inferred; simple loop closure alone was insufficient in a control construct.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18308926
      reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: In contrast, the accuracy of mRNA translation was significantly reduced in the hybrid ribosomes carrying a deafness mutation.
      explanation: >-
        Direct comparative misincorporation assays distinguish accuracy from total protein output.
- name: Cochlear Aminoglycoside Accumulation
  biological_scale: CELLULAR
  description: >-
    Systemically administered aminoglycosides reach the inner ear and accumulate in sensory hair cells.
    Mechanotransduction channels are an important entry route in experimental systems. Uptake and intracellular
    localization vary with drug and exposure; this is general ototoxicity biology rather than a demonstrated
    MT-RNR1-specific uptake defect.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:22121370
    reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: there is strong evidence that AGs enter hair cells through the MET channel located at the top of the stereocilia.  # codespell:ignore-line
    explanation: >-
      Review of experimental hair-cell entry mechanisms.
  downstream:
  - target: Aminoglycoside Binding to the Mitochondrial Ribosome
    description: >-
      Intracellular drug must reach the mitoribosomal target. The cited assays establish target susceptibility
      but do not resolve transport across every cellular and mitochondrial compartment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2634874/
      reference_title: Genetic analysis of interactions with eukaryotic rRNA identify the mitoribosome as target in aminoglycoside ototoxicity - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: increased drug binding to its target and excessive aggravation of the mutants' inherent deficiency in ribosomal accuracy.
      explanation: >-
        Chemical footprinting and translation assays support enhanced drug binding plus inherent
        decoding infidelity in A1555G/C1494T hybrids.
    - reference: PMID:22121370
      reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: The mechanism of involvement of mitochondrial mutations in ototoxic hair cell death is not completely understood.
      explanation: >-
        The tissue-selective link remains unresolved; generic aminoglycoside models are not proof
        of the complete MT-RNR1 causal chain.
  - target: Cochlear Hair Cell Loss
    description: >-
      Drug exposure causes sensory-cell injury through multiple routes. This aggregate edge preserves
      experimental toxicity outside the incompletely resolved mitochondrial-variant pathway.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22699498
      reference_title: Dissociation of antibacterial activity and aminoglycoside ototoxicity in the 4-monosubstituted 2-deoxystreptamine apramycin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Treatment with 140 mg gentamicin/kg body weight resulted in a base-to-apex gradient of hair cell loss with a complete destruction of hair cells in the basal half of the cochlea.
      explanation: >-
        Whole-animal gentamicin injury in guinea pigs, not a human susceptibility-allele model.
  - target: RIPOR2 Redistribution in Hair Cells
    description: >-
      Gentamicin exposure drives rapid RIPOR2 redistribution in mouse cochlear explants with functional
      mechanotransduction. The intervening entry/signaling steps are not isolated by this experiment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40842562
      reference_title: Aminoglycoside induces RIPOR2 translocation and phosphatidylserine externalization via distinct mechanisms.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: RIPOR2 translocated robustly from the stereocilia base to the pericuticular area
      explanation: >-
        Observed immunostaining redistribution in drug-treated explants.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: cochlear inner hair cell
    term:

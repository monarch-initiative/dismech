genetic:
- name: MT-RNR1
  gene_term:
    preferred_term: MT-RNR1
    term:
      id: hgnc:7470
      label: MT-RNR1
  relationship_type: CAUSATIVE
  notes: >-
    The primary locus. m.1555A>G is the most common allele and m.1494C>T the next;
    both sit in the 12S rRNA decoding region. Note that MONDO records TRMU rather than
    MT-RNR1 as the causal gene for MONDO:0010799 under RO:0004003, which appears to
    reflect the difficulty of representing mitochondrially encoded loci rather than a
    claim that TRMU is primary - OMIM 580000, the entity MONDO maps to, is the MT-RNR1
    locus.
  evidence:
  - reference: PMID:37314952
    reference_title: Clinical Pharmacogenomic MT-RNR1 Screening for Aminoglycoside-Induced
      Ototoxicity and the Post-Test Counseling Conundrum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Aminoglycoside antibiotic exposure can result in ototoxicity and irreversible
      hearing loss among individuals that harbor the m.1555A>G variant in the mitochondrial
      12S rRNA gene, MT-RNR1
    explanation: Names the gene, the variant, and the exposure dependency together.
- name: TRMU
  gene_term:
    preferred_term: TRMU
    term:
      id: hgnc:25481
      label: TRMU
  relationship_type: MODIFIER
  notes: >-
    Nuclear modifier of penetrance rather than a cause. Curated because it is the gene
    MONDO carries for this concept, and because penetrance modification is the open
    question for the unexposed carrier.
  evidence:
  - reference: PMID:17698299
    reference_title: Maternally inherited aminoglycoside-induced and nonsyndromic hearing
      loss is associated with the 12S rRNA C1494T mutation in three Han Chinese pedigrees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: aminoglycosides and other nuclear modifier genes play a modifying role in
      the phenotypic manifestation of the C1494T mutation in these Chinese families
    explanation: Establishes that nuclear modifiers act on penetrance alongside the drug.

genetic:
- name: MT-RNR1
  gene_term:
    preferred_term: MT-RNR1
    term:
      id: hgnc:7470
      label: MT-RNR1
  relationship_type: CAUSATIVE
  notes: >-
    MT-RNR1 encodes mitochondrial 12S rRNA. m.1555A>G and m.1494C>T have high-level evidence for aminoglycoside
    susceptibility; m.1095T>C has moderate evidence and receives the same prescribing precaution. Other
    variants require variant-specific assessment; omission from these actionable variants does not prove
    benignity. There is no established heteroplasmy threshold below which an actionable variant makes
    aminoglycoside exposure safe.
  variants:
  - name: m.1555A>G
    description: >-
      The best-studied predisposing variant; high evidence for a drug-variant interaction. Hybrid-ribosome
      experiments show both intrinsic decoding errors and increased drug susceptibility.
    evidence:
    - reference: PMID:34032273
      reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Some MT-RNR1 variants (i.e., m.1095T>C; m.1494C>T; m.1555A>G) more closely resemble the bacterial 16s rRNA subunit and result in increased risk of aminoglycoside-induced hearing loss.
      explanation: >-
        CPIC includes this variant in its actionable susceptibility set; the detailed experimental
        mechanism is allele-dependent.
      quote_role: REVIEW_SYNTHESIS
  - name: m.1494C>T
    description: >-
      A decoding-site variant with high evidence for aminoglycoside susceptibility, including maternal
      pedigrees and hybrid-ribosome experiments. Clinical severity varies.
    evidence:
    - reference: PMID:34032273
      reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: additional variants with sufficient evidence to support a drug-variant interaction are m.1095T>C and m.1494C>T
      explanation: >-
        CPIC includes this variant in its actionable susceptibility set; the detailed experimental
        mechanism is allele-dependent.
      quote_role: REVIEW_SYNTHESIS
  - name: m.1095T>C
    description: >-
      An actionable susceptibility variant with moderate evidence. The detailed structural experiments
      on m.1555A>G and m.1494C>T should not be assumed to establish an identical molecular mechanism
      for this allele.
    evidence:
    - reference: PMID:34032273
      reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: additional variants with sufficient evidence to support a drug-variant interaction are m.1095T>C and m.1494C>T
      explanation: >-
        CPIC includes this variant in its actionable susceptibility set; the detailed experimental
        mechanism is allele-dependent.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: there was sufficient and consistent evidence to assign actionability to the m.1555A>G and m.1494C>T variants with high levels of evidence and the m.1095T>C variant with a moderate level of evidence
    explanation: >-
      Distinguishes evidence strength and clinical actionability.
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: there is not sufficient evidence to define a level of heteroplasmy where aminoglycoside administration becomes safe
    explanation: >-
      Supports precaution at any detected actionable variant level.
- name: TRMU
  gene_term:
    preferred_term: TRMU
    term:
      id: hgnc:25481
      label: TRMU
  relationship_type: MODIFIER
  notes: >-
    TRMU p.Ala10Ser is a reported nuclear modifier in selected m.1555A>G families, not the primary mitochondrial
    susceptibility locus. Eighteen relatives homozygous for this allele and carrying m.1555A>G had prelingual
    profound deafness in the reported families, without aminoglycoside exposure. Other affected relatives
    lacked the modifier. Family-derived non-isogenic lymphoblast studies support altered tRNA modification
    and mitochondrial function, but do not establish a universal penetrance rule or a validated prescribing
    test.

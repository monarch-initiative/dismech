name: Aminoglycoside-Induced Hearing Loss
creation_date: "2026-08-27T06:05:00Z"
category: Mendelian
description: >-
  Aminoglycoside-induced hearing loss in its Mendelian form is a gene-environment
  disease: a maternally inherited variant in the mitochondrial 12S rRNA gene MT-RNR1
  - most often m.1555A>G, less often m.1494C>T - reshapes the decoding site of the
  mitochondrial small ribosomal subunit so that it resembles the bacterial 16S rRNA
  site that aminoglycosides were designed to bind. The variant is silent on its own.
  What converts it into deafness is exposure to the drug, and the resulting hearing
  loss is bilateral, severe to profound, irreversible, and idiosyncratic rather than
  dose-dependent: a single conventional dose is sufficient. That combination is what
  makes the disease unusual among Mendelian conditions - the genotype is common
  (roughly 1 in 385 in a UK birth cohort), the exposure is routine, and the outcome
  is entirely preventable if the two are kept apart.

  Because the variant is carried on mitochondrial DNA, transmission is maternal, so
  identifying one affected person places an entire matriline at risk. The clinical
  consequence is that this entry's most important treatment is not a drug but an
  avoidance: substituting a non-aminoglycoside antibiotic when the genotype is known.
  The practical obstacle has been time - aminoglycosides are first-line for suspected
  neonatal sepsis and are given within hours, while conventional genotyping takes
  days - which is why point-of-care testing that returns a result inside half an hour
  is curated here as the intervention that makes the avoidance actionable.

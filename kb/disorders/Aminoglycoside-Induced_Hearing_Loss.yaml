    explanation: >-
      Full chapter recommendation is evaluation for candidacy rather than universal implantation.
  target_mechanisms:
  - target: Bilateral Sensorineural Hearing Loss
    treatment_effect: BYPASSES
    description: >-
      Electrical stimulation bypasses impaired sensory transduction to support hearing.
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C201922
      label: Surgical Implantation
  notes: >-
    The action is bound to Surgical Implantation rather than the Cochlear Implant device class. Local
    OAK searches using t~Cochlear Implant and t~Implantation identified NCIT:C157820 as a device outside
    the TreatmentActionTerm hierarchy and NCIT:C201922 as a surgical procedure; the name and description
    retain the cochlear indication.
- name: Communication, language and educational support
  therapeutic_modality: OTHER
  description: >-
    Provide speech/language therapy, culturally appropriate language support and educational accommodations
    according to the individual and family’s communication preferences and needs.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Appropriate rehabilitation (hearing aids, speech therapy, culturally appropriate language training, cochlear implantation, educational programs for the hearing impaired).
    explanation: >-
      Guidance includes language, speech and educational support.
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
- name: Maternal-family counseling and durable prescribing alerts
  therapeutic_modality: OTHER
  description: >-
    Explain maternal transmission, variable penetrance and the importance of sharing drug-risk information
    with maternal relatives. Record the actionable result so future prescribers can retrieve it. The
    2026 UK guideline considers maternal relatives of a homoplasmic carrier at risk without requiring
    confirmatory genotyping of each relative; testing first-degree maternal relatives can be considered
    for heteroplasmic findings. Prenatal variant detection does not predict hearing severity.
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the advice to avoid aminoglycosides should be cascaded to the relevant individuals within the family.
    explanation: >-
      Family risk communication.
  - reference: PMID:42524757
    reference_title: 'MT-RNR1 genotype testing for preventing aminoglycoside-mediated ototoxicity: A guideline developed by the UK Centre of Excellence in Regulatory Science and Innovation in Pharmacogenomics (CERSI-PGx).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Where the variant detected is heteroplasmic, testing in first degree maternal relatives can be considered.
    explanation: >-
      Heteroplasmy-specific family testing advice.
  - reference: PMID:42524757
    reference_title: 'MT-RNR1 genotype testing for preventing aminoglycoside-mediated ototoxicity: A guideline developed by the UK Centre of Excellence in Regulatory Science and Innovation in Pharmacogenomics (CERSI-PGx).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The results should be recorded in the patient record (ideally in the electronic record in a format that is immediately available to inform future prescribing decisions).
    explanation: >-
      Durable pharmacogenetic communication, not a direct therapeutic action on the causal graph.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Hearing protection and routine vaccination
  therapeutic_modality: OTHER
  description: >-
    Avoid excessive noise exposure as part of hearing preservation. Trace aminoglycosides in vaccines
    are not a reason to forgo recommended vaccination: the 2026 guideline considers vaccination benefits
    to outweigh the theoretical ototoxicity risk.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Aminoglycosides and noise exposure, especially in those with normal hearing who have the m.1555A>G or m.1494C>T MT-RNR1 pathogenic variants.
    explanation: >-
      Exposure-avoidance guidance.
  - reference: PMID:42524757
    reference_title: 'MT-RNR1 genotype testing for preventing aminoglycoside-mediated ototoxicity: A guideline developed by the UK Centre of Excellence in Regulatory Science and Innovation in Pharmacogenomics (CERSI-PGx).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the benefits of vaccination far outweigh any theoretical risks of ototoxicity from vaccination in an individual with an AIHL associated MT‐RNR1 variant.
    explanation: >-
      Distinguishes trace excipients from therapeutic aminoglycoside exposure.
discussions:
- discussion_id: carrier_penetrance_and_exposure
  prompt: Which exposures and modifiers explain clinical penetrance across actionable MT-RNR1 variants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#MT-RNR1
  - pathophysiology#Predisposing MT-RNR1 Variants
  rationale: >-
    Severe loss after limited exposure is well documented, but selected maternal pedigrees and neonatal
    screening endpoints do not yield an unbiased lifetime risk. The British birth cohort had no individual
    aminoglycoside-exposure data and assessed better-ear thresholds at two frequencies in midlife. TRMU
    modifier families were selected and had no reported aminoglycoside exposure. General drug-resistant-tuberculosis
    ototoxicity estimates mix genetically unselected populations and cannot serve as prevalence of this
    inherited disorder.
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: there was sufficient and consistent evidence to assign actionability to the m.1555A>G and m.1494C>T variants with high levels of evidence and the m.1095T>C variant with a moderate level of evidence
    explanation: >-
      The clinical susceptibility set is broader than the alleles tested in the structural experiments.
  - reference: PMID:25155176
    reference_title: Mitochondrial mutation m.1555A>G as a risk factor for failed newborn hearing screening in a large cohort of preterm infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: It is important to note, that most infants with failed newborn hearing screening do not develop permanent hearing loss.
    explanation: >-
      A screening failure is not equivalent to permanent hearing impairment.
  - reference: PMID:34015383
    reference_title: 'Prevalence of aminoglycoside-induced hearing loss in drug-resistant tuberculosis patients: A systematic review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: aminoglycoside use results in high prevalence of ototoxic hearing loss
    explanation: >-
      Genetically unselected tuberculosis-treatment context, not Mendelian disease prevalence.
- discussion_id: human_cochlear_mechanistic_bridge
  prompt: How do allele-specific mitoribosomal defects produce selective cochlear injury in exposed carriers?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mitoribosomal Decoding Errors
  - pathophysiology#Cochlear Hair Cell Loss
  rationale: >-
    Hybrid ribosomes isolate decoding-site effects and lymphoblasts establish cellular susceptibility,
    but neither reproduces the complete sensory-cell context. General drug models show multiple exposure-dependent
    injury responses, including delayed routes not protected by the tested mitochondrial antioxidant.
    A patient-genotype hair-cell system with allele correction and physiological drug exposure would
    help distinguish initiating defects from secondary stress.
  evidence:
  - reference: PMID:22121370
    reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The mechanism of involvement of mitochondrial mutations in ototoxic hair cell death is not completely understood.
    explanation: >-
      The tissue-selective link remains unresolved; generic aminoglycoside models are not proof of
      the complete MT-RNR1 causal chain.
  - reference: PMID:39610699
    reference_title: Multiple mechanisms of aminoglycoside ototoxicity are distinguished by subcellular localization of action.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The underlying mechanisms by which lysosomal accumulation of AGs result in delayed cell death remain unclear.  # codespell:ignore-line
    explanation: >-
      Even the delayed generic drug-injury mediator remains unresolved.
- discussion_id: clinical_otoprotection_and_testing_outcomes
  prompt: Can alternative antibiotics or otoprotective strategies preserve hearing in actionable-variant carriers without compromising infection treatment?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - treatments#Avoidance or substitution of aminoglycoside antibiotics
  - clinical_trials#NCT04105205
  rationale: >-
    PALOH demonstrated prescribing change and similar mean antibiotic timing within its implementation
    comparison, not comparative long-term hearing protection. Apramycin has progressed beyond purely
    preclinical work to a healthy-volunteer phase I study, but that does not establish carrier safety.
    Antioxidant and other otoprotective findings in general drug models should not replace current genotype-guided
    avoidance.
  evidence:
  - reference: PMID:35311942
    reference_title: Rapid Point-of-Care Genotyping to Avoid Aminoglycoside-Induced Ototoxicity in Neonatal Intensive Care.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Three participants with the m.1555A>G variant were identified, all of whom avoided aminoglycoside antibiotics.
    explanation: >-
      Observed implementation benefit; no measured comparative permanent-hearing outcome.
  - reference: PMID:22121370
    reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: these protective results are mainly based on acute studies and the sustainability of therapeutic potential and safety remains to be evaluated in chronic exposure scenarios or in clinical trials.
    explanation: >-
      Limits extrapolating experimental otoprotection to standard care.

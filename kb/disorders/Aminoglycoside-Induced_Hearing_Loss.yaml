  description: >-
    Assess the actionable m.1555A>G, m.1494C>T and m.1095T>C variants, with an assay whose variant coverage
    and heteroplasmy detection limit are understood. A negative targeted panel does not exclude all
    genetic susceptibility or general drug ototoxicity. Hearing loss and an appropriate molecular finding
    establish mitochondrial disease; an incidental positive result identifies susceptibility, not existing
    deafness.

- name: Aminoglycoside Binding to the Mitochondrial Ribosome
  biological_scale: MOLECULAR
  description: >-
    Aminoglycosides bind the mitochondrial decoding region, with enhanced susceptibility of A1555G/C1494T
    hybrid sites. Drug binding can both worsen decoding accuracy and inhibit protein synthesis; these
    are distinct readouts. The intrinsic variant-associated fidelity defect can exist before exposure.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2634874/
    reference_title: Genetic analysis of interactions with eukaryotic rRNA identify the mitoribosome as target in aminoglycoside ototoxicity - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: increased drug binding to its target and excessive aggravation of the mutants' inherent deficiency in ribosomal accuracy.
    explanation: >-
      Chemical footprinting and translation assays support enhanced drug binding plus inherent decoding
      infidelity in A1555G/C1494T hybrids.
  downstream:
  - target: Mitoribosomal Decoding Errors
    description: >-
      Drug binding aggravates miscoding by the mutant decoding apparatus.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2634874/
      reference_title: Genetic analysis of interactions with eukaryotic rRNA identify the mitoribosome as target in aminoglycoside ototoxicity - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: increased drug binding to its target and excessive aggravation of the mutants' inherent deficiency in ribosomal accuracy.
      explanation: >-
        Chemical footprinting and translation assays support enhanced drug binding plus inherent
        decoding infidelity in A1555G/C1494T hybrids.
  - target: Reduced Mitochondrial Protein Synthesis
    description: >-
      Aminoglycoside interaction with the translation machinery inhibits mitochondrial protein synthesis.
      In patient-derived lymphoblasts, drug-dependent labeling inhibition was greater in carriers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10915767
      reference_title: A biochemical basis for the inherited susceptibility to aminoglycoside ototoxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The ratios of translation rates in the presence and absence of paromomycin, which reflected the effect of the drug on mitochondrial protein synthesis, were significantly decreased in the cell lines derived from symptomatic and asymptomatic individuals (by 30 and 28% on average, respectively), compared with the ratios in the control cell lines.
      explanation: >-
        Drug-dependent mitochondrial protein-labeling inhibition in family-derived lymphoblasts;
        high paromomycin concentration, not a clinical dose threshold.
- name: Mitoribosomal Decoding Errors
  biological_scale: MOLECULAR
  description: >-
    A1555G/C1494T hybrid ribosomes misincorporate amino acids more frequently; aminoglycosides exacerbate
    the defect. Reduced reporter enzymatic activity despite comparable full-length protein output demonstrates
    why fidelity should be separated from a lower synthesis rate.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:18308926
    reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In contrast, the accuracy of mRNA translation was significantly reduced in the hybrid ribosomes carrying a deafness mutation.
    explanation: >-
      Direct comparative misincorporation assays distinguish accuracy from total protein output.
  - reference: PMID:18308926
    reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Mutant and wild-type mitochondrial hybrid ribosomes produced the same level of full-length protein
    explanation: >-
      The drug-free luciferase experiment distinguishes product quality from total protein output.
  downstream:
  - target: Reduced Mitochondrial Respiration
    description: >-
      Incorrectly translated mitochondrial proteins are proposed to impair respiratory function. The
      hybrid-ribosome study does not itself measure human respiratory complexes or prove mediation
      in cochlear cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18308926
      reference_title: Mitochondrial deafness alleles confer misreading of the genetic code.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: This observation is compatible with our luciferase data in the mitochondrial hybrid ribosomes, which demonstrate that mutation-mediated misreading manifests primarily at the level of functional activity of the translated protein by missense rather than by nonsense decoding
      explanation: >-
        Authors connect reduced translation-product function with mitochondrial respiratory components;
        human cochlear mediation remains an inference.
    - reference: PMID:22121370
      reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: The mechanism of involvement of mitochondrial mutations in ototoxic hair cell death is not completely understood.
      explanation: >-
        The tissue-selective link remains unresolved; generic aminoglycoside models are not proof
        of the complete MT-RNR1 causal chain.
    hypothesis_groups:
    - mitoribosomal_dysfunction_to_cochlear_injury
- name: Reduced Mitochondrial Protein Synthesis
  biological_scale: MOLECULAR
  description: >-
    Aminoglycosides reduce mitochondrial protein synthesis in susceptible family-derived lymphoblasts.
    Separate unexposed TRMU modifier studies also show reduced mitochondrial protein labeling. These
    observations concern selected cultured cells and do not establish uniform translational arrest in
    every carrier.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:10915767
    reference_title: A biochemical basis for the inherited susceptibility to aminoglycoside ototoxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The ratios of translation rates in the presence and absence of paromomycin, which reflected the effect of the drug on mitochondrial protein synthesis, were significantly decreased in the cell lines derived from symptomatic and asymptomatic individuals (by 30 and 28% on average, respectively), compared with the ratios in the control cell lines.
    explanation: >-
      Drug-dependent mitochondrial protein-labeling inhibition in family-derived lymphoblasts; high
      paromomycin concentration, not a clinical dose threshold.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1559489/
    reference_title: Mutation in TRMU Related to Transfer RNA Modification Modulates the Phenotypic Expression of the Deafness-Associated Mitochondrial 12S Ribosomal RNA Mutations - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: the decrease in the rate of mitochondrial-protein labeling in cell lines V-1 and V-3, carrying both A1555G and homozygous A10S mutations, relative to the controls had a range of 44%–57%, with an average of 51%.
    explanation: >-
      Mitochondrial protein-labeling readout in the selected double-mutant lymphoblasts.
  downstream:
  - target: Reduced Mitochondrial Respiration
    description: >-
      Reduced synthesis of mitochondrial respiratory-chain components is a proposed route to impaired
      respiration. Supporting family-cell studies show both abnormalities, but do not isolate each
      mediator in human hair cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5314183/
      reference_title: Biochemical Evidence for a Nuclear Modifier Allele (A10S) in TRMU (Methylaminomethyl-2-thiouridylate-methyltransferase) Related to Mitochondrial tRNA Modification in the Phenotypic Manifestation of Deafness-associated 12S rRNA Mutation - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The defective translation resulted in the reduced activities of mitochondrial respiration chains.
      explanation: >-
        Authors’ mechanistic interpretation of linked translation and respiratory findings in selected
        lymphoblasts.
    hypothesis_groups:
    - mitoribosomal_dysfunction_to_cochlear_injury
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
- name: Reduced Mitochondrial Respiration
  biological_scale: CELLULAR
  description: >-
    Reduced oxygen consumption is measured in m.1555A>G lymphoblasts, with larger reductions in selected
    TRMU A10S double-mutant lines. Extending these findings to drug-exposed carrier hair cells remains
    a mechanistic hypothesis. Non-isogenic family lines do not isolate the effect of one allele from
    every other background difference.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5314183/
    reference_title: Biochemical Evidence for a Nuclear Modifier Allele (A10S) in TRMU (Methylaminomethyl-2-thiouridylate-methyltransferase) Related to Mitochondrial tRNA Modification in the Phenotypic Manifestation of Deafness-associated 12S rRNA Mutation - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: the average basal OCRs in mutant cell lines carrying both m.1555A→G and homozygous or heterozygous TRMU A10S mutations, and only m.1555A→G mutation were 54, 76, and 88%, relative to the mean value measured in the control cell lines, respectively.
    explanation: >-
      OCR measurements in eight non-isogenic lymphoblast lines, including modifier genotypes and controls;
      no drug exposure or hair cells.
  downstream:
  - target: Reduced Mitochondrial ATP Production
    description: >-
      Respiratory impairment is proposed to reduce mitochondrial ATP output. The measured mitochondrial
      ATP condition suppressed glycolysis; it does not demonstrate the same loss of total cellular
      ATP.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5314183/
      reference_title: Biochemical Evidence for a Nuclear Modifier Allele (A10S) in TRMU (Methylaminomethyl-2-thiouridylate-methyltransferase) Related to Mitochondrial tRNA Modification in the Phenotypic Manifestation of Deafness-associated 12S rRNA Mutation - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: the levels of ATP production in mutant cell lines carrying both m.1555A→G and homozygous or heterozygous TRMU A10S mutations and only m.1555A→G mutation were 48, 61, and 83% of the mean value measured in the control cell lines, respectively.
      explanation: >-
        ATP measured with glycolysis inhibited; total cellular ATP was much less affected, so this
        is not a global energy collapse.
    hypothesis_groups:
    - mitoribosomal_dysfunction_to_cochlear_injury
  - target: Oxidative Stress
    description: >-
      Mitochondrial dysfunction may increase oxidant stress or reduce stress resistance. The selected
      cell studies and general drug models do not establish a uniform ROS mechanism in carrier cochleae.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5314183/
      reference_title: Biochemical Evidence for a Nuclear Modifier Allele (A10S) in TRMU (Methylaminomethyl-2-thiouridylate-methyltransferase) Related to Mitochondrial tRNA Modification in the Phenotypic Manifestation of Deafness-associated 12S rRNA Mutation - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: the levels of ROS generation in the mutant cell lines cells carrying both m.1555A→G and homozygous TRMU A10S mutations ranged from 155 to 167%, with an average 161% of the mean value measured in the control cell lines
      explanation: >-
        Fluorescent-probe response under hydrogen-peroxide challenge in selected double-mutant lymphoblasts;
        not a direct measurement in human cochlea.
    - reference: PMID:22121370
      reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Furthermore, it is hypothesized that the mitochondrial RNA mutations when exposed to AG cause an increased formation of ROS, which then promote apoptotic cell death
      explanation: >-
        Explicitly hypothetical mitochondrial-variant-to-oxidative-death route.
    hypothesis_groups:
    - mitoribosomal_dysfunction_to_cochlear_injury

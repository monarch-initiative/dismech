- name: Pre-treatment and point-of-care genotyping
  description: >-
    The 2026 UK CERSI-PGx guideline recommends testing before aminoglycoside treatment across ages and
    ancestries when a result is feasible within the clinical time frame. Planned treatment permits pre-emptive
    testing. A 26-minute m.1555A>G bedside assay changed prescribing in the 751-participant PALOH implementation
    study: 424/526 antibiotic-treated infants were successfully tested and three confirmed carriers
    avoided aminoglycosides. This was a workflow study, not a randomized demonstration of prevention
    of permanent hearing loss. It predominantly recruited from one center and excluded infants requiring
    immediate antibiotics with established intravenous access. Positive bedside results require laboratory
    confirmation; single-variant tests do not cover every actionable allele.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42524757

prevalence:
- population: United Kingdom, British 1958 birth cohort (m.1555A>G carriers)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 260.0
  notes: >-
    m.1555A>G carrier frequency was 19/7350 (0.26%; 95% CI 0.14–0.38%) in successfully genotyped participants
    from the British 1958 birth cohort. This is neither hearing-loss prevalence nor a pooled frequency
    for every actionable variant. Audiometry at age 44–45 used better-ear thresholds at 1 and 4 kHz;
    individual aminoglycoside exposure was not recorded.
  evidence:
  - reference: PMID:22223843
    reference_title: 'Hearing in 44-45 year olds with m.1555A>G, a genetic mutation predisposing to aminoglycoside-induced deafness: a population based cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 19 of 7350 individuals successfully genotyped had the m.1555A>G mutation, giving a prevalence of 0.26% (95% CI 0.14% to 0.38%) or 1 in 385
    explanation: Gives the carrier frequency with its confidence interval in an unselected birth cohort.

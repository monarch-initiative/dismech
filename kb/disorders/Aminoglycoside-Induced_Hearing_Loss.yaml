mechanistic_hypotheses:
- hypothesis_group_id: mitoribosomal_dysfunction_to_cochlear_injury
  hypothesis_label: Mitoribosomal dysfunction, bioenergetic stress and selective cochlear injury
  status: EMERGING
  description: >-
    Mutant ribosome biochemistry and selected family-derived cells support impaired translation and
    mitochondrial function. Connecting these findings to ATP limitation, oxidant stress and sensory-cell
    loss in exposed human carriers remains incompletely demonstrated. Generic drug-exposed fish, guinea-pig
    and mouse-explant systems do not encode the human susceptibility alleles; their drug-specific responses
    caution against a universal linear death pathway.

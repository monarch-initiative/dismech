name: Aminoglycoside-Induced Hearing Loss
creation_date: '2026-08-27T06:05:00Z'
category: Mendelian
description: >-
  This entry describes inherited susceptibility to aminoglycoside-induced sensorineural hearing loss associated
  with mitochondrial MT-RNR1 variants. The strongest prescribing evidence concerns m.1555A>G and m.1494C>T,
  with moderate evidence for m.1095T>C. Hearing loss can be bilateral, severe to profound and permanent
  after standard therapeutic exposure, sometimes after a single dose, but penetrance and severity are
  not uniform. Some families also have hearing loss without documented aminoglycoside exposure; population
  data do not establish inevitable hearing loss in carriers.

  For m.1555A>G and m.1494C>T, experimental ribosomes show altered decoding accuracy and increased aminoglycoside
  binding. The steps connecting these defects to selective human cochlear injury remain incompletely resolved.
  Avoiding aminoglycosides when an effective alternative exists is central to prevention. Genotype-guided
  prescribing must preserve timely treatment of serious infection: urgent therapy should not be delayed
  while awaiting a test. The general dose- and duration-related ototoxicity of aminoglycosides can also
  occur without an identified MT-RNR1 variant and is distinguished from inherited susceptibility here.

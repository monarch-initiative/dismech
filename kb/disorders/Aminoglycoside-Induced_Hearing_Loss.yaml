- name: Audiologic monitoring after exposure or established hearing loss
  description: >-
    When aminoglycosides are unavoidable in an actionable-variant carrier, arrange frequent hearing/audiovestibular
    assessment during and after treatment alongside renal and therapeutic-drug monitoring. Annual audiometry
    is advised in established mitochondrial hearing loss to assess stability or progression. CPIC finds
    insufficient evidence to require additional hearing assessments solely because an asymptomatic carrier
    has never been exposed.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: with clinical audiovestibular assessment performed during and after treatment.
    explanation: >-

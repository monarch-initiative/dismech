environmental:
- name: Systemic aminoglycoside antibiotic administration
  description: >-
    Systemic aminoglycoside treatment provides the drug exposure that can trigger hearing injury in
    genetically susceptible people. Therapeutic concentrations and even single doses have been associated
    with severe loss, but risk is not a universal dose-independent threshold. Duration, route and other
    clinical factors remain relevant, and ordinary drug-level monitoring does not eliminate inherited
    susceptibility.
  exposure_term:
    preferred_term: exposure to aminoglycoside antibiotic
  influences_mechanisms:
  - target: Cochlear Aminoglycoside Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Drug distribution into the inner ear and entry through hair-cell membranes precede intracellular
      accumulation.
    evidence:
    - reference: PMID:22121370
      reference_title: Mechanisms of aminoglycoside ototoxicity and targets of hair cell protection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: there is strong evidence that AGs enter hair cells through the MET channel located at the top of the stereocilia.  # codespell:ignore-line
      explanation: >-
        General experimental uptake biology.
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The identification of an MT-RNR1 variant that is known to predispose to AIHL is sufficient to assign a phenotype status, but the absence of a variant does not indicate no risk of AIHL.
    explanation: >-
      Distinguishes inherited susceptibility from the class’s broader ototoxicity.
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: occurring within a few days to weeks after administration of any amount (even a single dose) of an aminoglycoside antibiotic
    explanation: >-
      Documents potential severity after limited therapeutic exposure without assigning universal
      penetrance.

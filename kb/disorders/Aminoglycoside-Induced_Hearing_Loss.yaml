animal_models:
- name: Guinea-pig comparative aminoglycoside ototoxicity
  species: Guinea pig
  publication: PMID:22699498
  description: >-
    Systemic gentamicin and apramycin were compared using auditory brainstem responses and cochlear
    histology. Apramycin produced less injury at tested doses. Gentamicin caused a basal-to-apical hair-cell-loss
    gradient and systemic toxicity; two of three animals at 160 mg/kg died early.
  modeled_mechanisms:
  - target: Cochlear Hair Cell Loss
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      In-vivo histology documents drug-associated cochlear sensory-cell loss.
    model_scale: CELLULAR
    limitations: >-
      Wild-type drug toxicity, not a human MT-RNR1 allele model; unequal dose responses and systemic
      toxicity limit extrapolation to safer human prescribing.
    evidence:
    - reference: PMID:22699498
      reference_title: Dissociation of antibacterial activity and aminoglycoside ototoxicity in the 4-monosubstituted 2-deoxystreptamine apramycin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Treatment with 140 mg gentamicin/kg body weight resulted in a base-to-apex gradient of hair cell loss with a complete destruction of hair cells in the basal half of the cochlea.
      explanation: >-
        Guinea-pig cochlear histology.

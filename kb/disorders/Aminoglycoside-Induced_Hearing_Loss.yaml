    explanation: >-
      Prevents extrapolating an annual disease-surveillance schedule to every unexposed carrier.
treatments:
- name: Avoidance or substitution of aminoglycoside antibiotics
  therapeutic_modality: OTHER
  description: >-
    For carriers of an actionable MT-RNR1 variant, choose an effective non-aminoglycoside regimen when
    available. This reduces the drug-associated risk but does not eliminate all possible hearing loss.
    The precaution applies across the aminoglycoside class. Inhaled delivery can still produce systemic
    exposure; low-absorption topical/enteral use and damaged barriers require route-specific assessment.
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: aminoglycosides should be avoided unless the increased risk of hearing loss is outweighed by the severity of infection and lack of safe or effective alternative therapies
    explanation: >-
      Relative contraindication balances hearing risk against effective infection treatment.
  target_mechanisms:
  - target: Cochlear Aminoglycoside Accumulation
    treatment_effect: INHIBITS
    description: >-
      Avoiding the drug prevents this exposure-dependent step; it does not correct the mitochondrial
      variant.
- name: Expert management when aminoglycosides are essential
  therapeutic_modality: OTHER
  description: >-
    When no safe effective alternative exists, obtain infectious-disease/microbiology advice, document
    and discuss the risk-benefit decision, and use the shortest effective course with drug-level, renal
    and audiovestibular monitoring. If testing information is unavailable and clinical urgency is high,
    do not delay necessary antibiotic treatment.
  evidence:
  - reference: PMID:34032273
    reference_title: Clinical Pharmacogenetics Implementation Consortium Guideline for the Use of Aminoglycosides Based on MT-RNR1 Genotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: an aminoglycoside used in patients at increased risk of AIHL due to the presence of an MT-RNR1 variant should be administered for the shortest possible period, under expert supervision, with therapeutic drug and ototoxicity monitoring
    explanation: >-
      Guideline precautions; monitoring does not guarantee prevention.
  - reference: PMID:42524757
    reference_title: 'MT-RNR1 genotype testing for preventing aminoglycoside-mediated ototoxicity: A guideline developed by the UK Centre of Excellence in Regulatory Science and Innovation in Pharmacogenomics (CERSI-PGx).'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Aminoglycoside treatment should not be delayed, and administration should proceed according to local microbiological guidance, as the benefit exceeds the risk.
    explanation: >-
      Applies to the acute setting where genotype information is unavailable.
- name: Hearing aids and auditory rehabilitation
  therapeutic_modality: DEVICE
  description: >-
    Offer hearing aids and audiologic rehabilitation appropriate to residual hearing and communication
    needs. These improve functional access to sound; they do not regenerate damaged cochlear hair cells.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Appropriate rehabilitation (hearing aids, speech therapy, culturally appropriate language training, cochlear implantation, educational programs for the hearing impaired).
    explanation: >-
      Mitochondrial-hearing-loss rehabilitation guidance.
  target_mechanisms:
  - target: Bilateral Sensorineural Hearing Loss
    treatment_effect: BYPASSES
    description: >-
      Amplification supports use of residual hearing without repairing the initiating molecular defect.
  treatment_term:
    preferred_term: hearing-aid rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    The action is bound to Rehabilitation rather than the Hearing Aid device class. Local OAK searches
    using t~Hearing Aid and t~Rehabilitation identified NCIT:C183182 as a device outside the TreatmentActionTerm
    procedure hierarchy and NCIT:C15315 as rehabilitation under Supportive Care.
- name: Cochlear implantation and electric acoustic stimulation
  therapeutic_modality: SURGERY
  description: >-
    Evaluate cochlear implantation for severe hearing loss according to standard candidacy assessment.
    Electric acoustic stimulation may be considered when usable low-frequency hearing remains. The GeneReviews
    recommendations address mitochondrial hearing loss generally, not a genotype-specific comparative
    trial.
  evidence:
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Appropriate rehabilitation (hearing aids, speech therapy, culturally appropriate language training, cochlear implantation, educational programs for the hearing impaired).
    explanation: >-
      Includes cochlear implantation among rehabilitation options.
  - reference: PMID:20301595
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Electric acoustic stimulation for individuals with mitochondrial hearing loss with residual hearing in the lower frequencies.
    explanation: >-
      Qualifies the residual-hearing indication.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1422/
    reference_title: Nonsyndromic Hearing Loss and Deafness, Mitochondrial - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

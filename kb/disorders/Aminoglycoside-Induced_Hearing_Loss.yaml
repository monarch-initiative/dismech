    ribosomes, with wild-type, A1555G and C1494T variants. Cell-free amino-acid incorporation, luciferase
    and gentamicin-footprinting assays separate decoding fidelity, protein output and drug binding.
  modeled_mechanisms:
  - target: Mitoribosomal Decoding Errors
    relationship: PARTIALLY_RECAPITULATES
    description: >-

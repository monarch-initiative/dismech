- name: NCT04339777
  phase: PHASE_II
  status: RECRUITING
  description: >-
    A phase II allogeneic haematopoietic stem cell transplant protocol for inborn errors
    of immunity, on which one patient in the reported cohort (patient 8) was
    transplanted. It is not a TLR8-specific trial - the eligible population is primary
    immunodeficiency or primary immune regulatory disorder where standard management has
    failed or does not exist - which is the usual route to transplant for a disease with
    ten reported patients.
  target_phenotypes:
  - preferred_term: Severe refractory neutropenia

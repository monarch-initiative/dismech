    snippet: "Whole-exome sequencing revealed a TLR8-G572D mutation, leading to a diagnosis of autoimmune myelofibrosis (AIMF) secondary to TLR8 gain of function (GOF)."
    explanation: A further variant and the presentation it was found in.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight patients had mutations at the same amino acid location, 6 with the previously reported p.P432L variant and 2 with novel variants (p.P432Q and p.P432R)."
    explanation: >-

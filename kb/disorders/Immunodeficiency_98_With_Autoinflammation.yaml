genetic:
- name: TLR8
  association: Causal
  gene_term:
    preferred_term: TLR8
    term:
      id: hgnc:15632
      label: TLR8
  notes: >-
    TLR8 is at Xp22.2. Disease-causing variants are missense and gain of function.
    Most are somatic, present as post-zygotic mosaics at peripheral blood variant
    allele fractions of 7 to 26 per cent and detectable in skin fibroblasts as well as
    blood; germline variants are reported, including in the first described female
    patient.

    The dominant recurrent position is p.P432. Eight of the ten reported patients carry
    a variant there - six p.P432L, plus the novel p.P432Q and p.P432R - and the authors
    call it a hot spot for somatic variation, particularly during embryogenesis. The
    two novel alleles were functionally validated: neither is constitutively active, and
    both show increased NF-kB activity after stimulation with the TLR8-specific ligand
    TL8-506, which is the same ligand-hypersensitivity signature as p.P432L. Outside the
    hot spot, p.F494L and a germline p.G572D are each reported once, the latter in a
    patient with autoimmune myelofibrosis.

    Age of onset spans 9 months to 28 years. Because most cases are mosaic, variant
    calling at standard germline heterozygous thresholds will miss them.
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated with 3 different variants in the X-linked gene TLR8, encoding the endosomal Toll-like receptor 8 (TLR8)"
    explanation: Establishes TLR8 as the causal gene and names its product.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel missense variants in the TLR8 gene, located on the short arm of chromosome X (Xp22.2), were recently identified in 6 unrelated male patients with severe neutropenia, lymphoproliferation, and immune dysregulation, known as INFLTR8 (inflammation, neutropenia, bone marrow failure, and lymphoproliferation caused by TLR8)."
    explanation: Gives the cytogenetic location and the acronym the disease is also known by.

name: Immunodeficiency 98 With Autoinflammation
creation_date: "2026-09-13T00:00:00Z"
category: Mendelian
synonyms:
- IMD98
- immunodeficiency 98 with autoinflammation, X-linked
- TLR8 gain-of-function disorder
- TLR8 GOF
- INFLTR8
- inflammation, neutropenia, bone marrow failure, and lymphoproliferation caused by TLR8
description: >-
  Immunodeficiency 98 with autoinflammation is caused by gain-of-function variants
  in TLR8, the X-linked endosomal sensor of single-stranded RNA degradation
  products. TLR8 is expressed mainly by myeloid cells and signals through NF-kB to
  produce proinflammatory cytokines. The disease-causing variants make the
  receptor hypersensitive to ligand rather than constitutively active, so patient
  cells over-respond to stimulation.

  The clinical picture pairs two things that usually pull in opposite directions:
  immunodeficiency - severe refractory neutropenia, recurrent infection, impaired
  B-cell maturation - and autoinflammation, with activated T cells, raised serum
  cytokines and lymphoproliferation. Bone marrow characteristically shows severe
  myeloid hypoplasia with activated T-cell infiltrates. Disease is refractory to
  granulocyte colony-stimulating factor and corticosteroids, and allogeneic
  haematopoietic cell transplantation is the only intervention shown to resolve
  the phenotype.

  Two features of this disease are unusual enough to be the reason it is worth a
  separate entry rather than a line in a TLR-signalling review. First, most
  patients are somatic mosaics with variant allele fractions between 7 and 26 per
  cent, and the phenotype is full-blown anyway - so a minority clone of
  hypersensitive cells is sufficient, and the disease would be missed by any
  workflow assuming germline heterozygosity. Second, TLR8 turns out to act inside
  the erythroid lineage as well, blocking EPO signalling by a mechanism that has
  been worked out in detail, which makes the anaemia a second molecular arm rather
  than a consequence of the marrow inflammation.

inheritance:
- name: X-linked dominant, frequently somatic mosaic
  description: >-
    TLR8 is at Xp22.2. The disease was first described in males, but a female
    patient with a germline variant has since been reported, which establishes the
    mode as X-linked dominant rather than X-linked recessive. Most patients carry
    the variant as a post-zygotic somatic mosaic rather than in the germline, and
    mosaicism has been demonstrated outside the haematopoietic compartment in skin
    fibroblasts - so the mutational event is early and not confined to blood.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TLR8 GOF is an X-linked dominant disorder that should be considered in male and female patients with cytopenia, particularly severe neutropenia, lymphoproliferation with immune dysregulation, increased LGLs, and new to this cohort, red cell aplasia."
    explanation: >-
      States the inheritance mode explicitly, and the female patient is what changed it
      from the X-linked recessive assumption of the original male-only cohort.
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mosaicism was also detected in skin-derived fibroblasts in 3 patients, demonstrating that mutations were not limited to the hematopoietic compartment."
    explanation: >-
      Establishes that the mosaicism is developmental rather than a clonal
      haematopoietic event, which matters for how and where to test for it.
pathophysiology:
- name: TLR8 Gain-of-Function Variant
  description: >-
    The initiating lesion. Missense variants in TLR8 confer gain of function on the
    encoded receptor. In most patients the variant is present as a somatic mosaic at
    a low variant allele fraction rather than in every cell, which is recorded here
    in genetic_context because it is the defining molecular feature of the disease
    rather than an incidental finding in a few cases.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: SOMATIC
  downstream:
  - target: Hypersensitivity of the Endosomal ssRNA Sensor
    causal_link_type: DIRECT
    description: >-
      The variants do not make the receptor constitutively active; they lower its
      threshold, so patient cells over-respond when ligand is present.
    evidence:
    - reference: PMID:41370196
      reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All TLR8 variants led to a gain-of-function (GOF) of the encoded protein, with patient-derived cells exhibiting hypersensitivity to ligand stimulation, resulting in increased NF-κB activation and cytokine production."
      explanation: >-
        The whole molecular chain in one sentence - gain of function, expressed as
        ligand hypersensitivity, producing NF-kB activation and cytokine output.
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, 5 patients had somatic variants in TLR8 with <30% mosaicism, suggesting a dominant mechanism responsible for the clinical phenotype."
    explanation: >-
      Records both the mosaicism and the inference the authors draw from it - that a
      minority clone suffices, which is what makes the mechanism dominant.
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All variants conferred gain of function to TLR8 protein"
    explanation: Establishes the direction of the functional effect for every variant described.
  - reference: PMID:41729082
    reference_title: "Structural modeling and functional characterization of a novel gain-of-function TLR8 variant causing severe inflammatory syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies showed that the TLR8 A518T variant enhanced NF-κB activation and increased secretion of proinflammatory cytokines compared with WT TLR8 upon stimulation, consistent with a gain-of-function effect."
    explanation: A further gain-of-function allele, characterised in two male siblings with recurrent infection and systemic inflammation.
  - reference: PMID:41729082
    reference_title: "Structural modeling and functional characterization of a novel gain-of-function TLR8 variant causing severe inflammatory syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein degradation and turnover assays revealed reduced abundance of the mutant TLR8 protein due to faster turnover and increased proteasomal degradation."
    explanation: >-
      The counterintuitive half of the mechanism - there is less mutant protein, not
      more. Recorded because it rules out the obvious reading that gain of function here
      means gain of receptor.
  - reference: PMID:41729082
    reference_title: "Structural modeling and functional characterization of a novel gain-of-function TLR8 variant causing severe inflammatory syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational modeling predicted enhanced structural stabilization of the active TLR8 homodimer interface via additional water-mediated hydrogen bonds introduced by the A518T substitution."
    explanation: >-
      The proposed reconciliation: the variant stabilises the active conformation rather
      than increasing receptor number. Graded COMPUTATIONAL because it is a modelling
      prediction, not a structure.
- name: Hypersensitivity of the Endosomal ssRNA Sensor
  description: >-
    TLR8 sits in the endosome and recognises single-stranded RNA degradation
    products, signalling through NF-kB. A hypersensitive receptor converts ordinary
    ligand exposure - which for an endosomal RNA sensor is routine - into a
    disproportionate signal. Myeloid cells differentiated from patient-derived
    induced pluripotent stem cells show the increased responsiveness directly, which
    matters because it locates the defect in the cell rather than in the patient's
    inflammatory milieu.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Excess NF-kB-Dependent Cytokine Production
    causal_link_type: DIRECT
    description: >-
      NF-kB is the transcriptional output of TLR8, so an over-responsive receptor
      produces an over-active pathway.
    evidence:
    - reference: PMID:41370196
      reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient-derived cells exhibiting hypersensitivity to ligand stimulation, resulting in increased NF-κB activation and cytokine production"
      explanation: Connects the receptor-level hypersensitivity to the pathway-level output in patient cells.
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Differentiation of myeloid cells from patient-derived induced pluripotent stem cells demonstrated increased responsiveness to TLR8."
    explanation: >-
      Demonstrates the cellular phenotype in a patient-derived system independent of
      the patient's circulating inflammatory environment.
  - reference: PMID:21949866
    reference_title: "Comparative analysis of species-specific ligand recognition in Toll-like receptor 8 signaling: a hypothesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "The primary sequences of rodent and non-rodent TLR8s are similar, but the antiviral compound (R848) that activates the TLR8 pathway is species-specific."
    explanation: >-
      Why a human patient-derived system is the right model and a rodent one would not
      be: the receptor does not respond to the same ligands across species. Graded
      COMPUTATIONAL because the mechanistic account is homology modelling and docking;
      the species difference in R848 response it starts from is an established
      experimental fact.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Toll-like receptor 8 (TLR8) is an endosomal pattern recognition receptor primarily expressed by myeloid cells that recognizes microbial single-stranded RNA degradation products, with activation ultimately resulting in the production of NF-κB–dependent cytokines and proinflammatory signature."
    explanation: >-
      Describes the normal function the variants exaggerate. Graded OTHER because it is
      background physiology stated in the introduction rather than a result of this study.
  - reference: PMID:25599397
    reference_title: "Toll-like receptor 8 senses degradation products of single-stranded RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TLR8 recognized two degradation products of ssRNA—uridine and a short oligonucleotide—at two distinct sites: uridine bound the site on the dimerization interface where small chemical ligands are recognized, whereas short oligonucleotides bound a newly identified site on the concave surface of the TLR8 horseshoe structure."
    explanation: >-
      Defines what the receptor actually senses, at structural resolution. The uridine
      site sits on the dimerization interface, which is the surface the A518T variant is
      modelled to stabilise - so the ligand chemistry and the disease mechanism meet at
      the same place.
  - reference: PMID:25599397
    reference_title: "Toll-like receptor 8 senses degradation products of single-stranded RNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Site-directed mutagenesis revealed that both binding sites were essential for activation of TLR8 by ssRNA."
    explanation: Establishes that activation requires both sites, which is what makes the dimer interface a point of control rather than an incidental surface.
- name: Excess NF-kB-Dependent Cytokine Production
  description: >-
    The proinflammatory state. Patients show activated T cells and elevated serum
    cytokines. This node is the shared upstream of the marrow, lymphoid and humoral
    consequences below, which is why they branch from it rather than from each other.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  - preferred_term: cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  downstream:
  - target: Myeloid Hypoplasia and Bone Marrow Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The marrow shows myeloid hypoplasia alongside activated T-cell infiltrates. How
      the inflammatory state suppresses granulopoiesis - whether through the T-cell
      infiltrate, a cytokine effect on progenitors, or both - is not established in
      these patients.
    evidence:
    - reference: PMID:41370196
      reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bone marrow characteristically demonstrated severe myeloid hypoplasia and activated T-cell infiltrates and/or aggregates."
      explanation: >-
        Puts the hypoplasia and the T-cell infiltrate in the same marrow, which is the
        observation the edge rests on without establishing which drives which.
  - target: Lymphoproliferation with Immune Dysregulation
    causal_link_type: DIRECT
    description: >-
      Activated T cells and raised cytokines are the proximate description of the
      lymphoproliferative phenotype.
  - target: Impaired B-Cell Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Humoral defects accompany the inflammatory phenotype. The paper reports the
      association rather than a mechanism connecting the two.
    evidence:
    - reference: PMID:33512449
      reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "immune phenotyping demonstrated a proinflammatory phenotype with activated T cells and elevated serum cytokines associated with impaired B-cell maturation"
      explanation: >-
        States the association between the inflammatory phenotype and the B-cell defect,
        in the associative language the source itself uses.
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immune phenotyping demonstrated a proinflammatory phenotype with activated T cells and elevated serum cytokines"
    explanation: The immunophenotype that defines this node in patients.
- name: Myeloid Hypoplasia and Bone Marrow Failure
  description: >-
    The dominant clinical problem. Neutropenia is universal and usually severe, and is
    refractory to the treatments that work in other neutropenias. Anaemia and
    thrombocytopenia are common, so the failure is not confined to the granulocytic
    line. An increased number of large granular lymphocytes was found in half the
    expanded cohort.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had neutropenia, most with severe neutropenia refractory to medical therapy. Anemia and thrombocytopenia were common."
    explanation: The cytopenia profile across the full reported cohort, and its refractoriness.
- name: Lymphoproliferation with Immune Dysregulation
  description: >-
    The autoinflammatory arm. Lymphoproliferation was among the founding cohort's
    defining features and remains in the diagnostic description of the expanded one.
    Coexisting with the immunodeficiency, it is what makes the disease a combined
    picture rather than a simple bone marrow failure syndrome.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 6 unrelated males with neutropenia, infections, lymphoproliferation, humoral immune defects, and in some cases bone marrow failure associated with 3 different variants in the X-linked gene TLR8, encoding the endosomal Toll-like receptor 8 (TLR8)."
    explanation: The founding clinical description, listing lymphoproliferation alongside the immunodeficiency features.
- name: Impaired B-Cell Maturation
  description: >-
    The humoral arm. B-cell maturation is impaired and humoral immune defects are part
    of the founding phenotype, contributing to the infectious susceptibility alongside
    the neutropenia.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these findings demonstrate that gain-of-function variants in TLR8 lead to a novel childhood-onset IEI with lymphoproliferation, neutropenia, infectious susceptibility, B- and T-cell defects, and in some cases, bone marrow failure"
    explanation: The authors' summary of the disease, naming the B- and T-cell defects as components.
- name: TLR8-Driven Blockade of EPO Signaling in Erythroid Progenitors
  description: >-
    A second, mechanistically separate arm, and the one that is worked out in most
    molecular detail. TLR8 is expressed in the erythroid lineage, and activating it
    impairs erythropoiesis from the progenitor stage onward while inhibiting it
    enhances erythropoiesis. The mechanism is specific: TLR8 activation blocks
    annexin A2-mediated plasma membrane localisation of STAT5, which disrupts
    erythropoietin signalling. This is an erythroid-intrinsic effect rather than a
    consequence of the marrow inflammation, which is why it is modelled as its own
    branch from the receptor node rather than downstream of the cytokine node.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythropoietin-mediated signaling pathway
    term:
      id: GO:0038162
      label: erythropoietin-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, TLR8 activation blocks annexin A2 (ANXA2)-mediated plasma membrane localization of STAT5 and disrupts EPO signaling in HuDEP2 cells."
    explanation: The specific molecular mechanism by which TLR8 activation impairs erythropoiesis.
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TLR8 is expressed in erythroid lineage and erythropoiesis is impaired by TLR8 activation whereas enhanced by TLR8 inhibition from erythroid progenitor stage."
    explanation: >-
      Establishes both the expression and the bidirectional dependence - inhibition
      improves erythropoiesis, which is what makes the effect causal rather than
      correlative.
mechanistic_hypotheses:
- hypothesis_group_id: low_vaf_mosaic_sufficiency
  hypothesis_label: How a somatic clone at 7-26 per cent variant allele fraction produces the full phenotype
  status: EMERGING
  description: >-
    Eight of the ten reported patients are somatic mosaics with peripheral blood
    variant allele fractions between 7 and 26 per cent. A minority of hypersensitive
    cells is therefore sufficient to produce severe, refractory, transplant-requiring
    disease. The original authors read this as evidence of a dominant mechanism.

    What "dominant" means here is the open part. A cell-autonomous account would
    require the mutant clone to have a competitive advantage that the data do not yet
    establish. A non-cell-autonomous account fits the observed picture better - a
    small population of over-responsive myeloid cells secreting enough cytokine to
    suppress the marrow around it would explain both the low fraction and the marrow
    findings, and it would explain why transplantation with full donor chimerism
    resolves the phenotype. Neither has been tested directly in these patients.

    Two practical consequences follow regardless of which is right. A germline-only
    variant calling pipeline at standard heterozygous thresholds will miss most of
    these patients, and a negative blood test does not exclude the disease, since
    mosaicism has been found in fibroblasts.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight patients had somatic mosaicism with peripheral blood variant allele fractions of 7% to 26%, and age of disease onset of 9 months to 28 years."
    explanation: The observation the hypothesis is about - low variant allele fractions with full disease.
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mosaicism is a prominent molecular mechanism of this new disease."
    explanation: The authors' framing of mosaicism as a defining feature rather than an incidental one.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients are surviving at 1 to 3 years after HCT with full donor myeloid and T-cell chimerism, and resolution of disease phenotype."
    explanation: >-
      Replacing the haematopoietic compartment resolves the disease, which is consistent
      with the non-cell-autonomous reading but does not by itself distinguish the two.
- hypothesis_group_id: conformational_gain_not_receptor_gain
  hypothesis_label: Whether gain of function here is conformational stabilisation rather than more receptor
  status: EMERGING
  description: >-
    The A518T allele produces more NF-kB activation and more cytokine from *less*
    protein: turnover assays show reduced abundance of the mutant, through faster
    proteasomal degradation. So whatever "gain of function" means in this disease, it is
    not gain of receptor.

    The proposal is that the substitution stabilises the *active* TLR8 homodimer
    interface - computational modelling predicts additional water-mediated hydrogen
    bonds there - so each remaining receptor spends more of its time in the signalling
    conformation. That is consistent with the ligand-hypersensitivity phenotype the
    founding cohort reported, and it would explain why a somatic clone at low variant
    allele fraction suffices, since the effect is per-receptor rather than per-cell.

    It is one allele, and the structural claim is a prediction rather than a solved
    structure. Whether the other reported variants share the mechanism has not been
    tested; they were characterised as gain of function by reporter activity, which does
    not distinguish more receptor from better receptor.
  evidence:
  - reference: PMID:41729082
    reference_title: "Structural modeling and functional characterization of a novel gain-of-function TLR8 variant causing severe inflammatory syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein degradation and turnover assays revealed reduced abundance of the mutant TLR8 protein due to faster turnover and increased proteasomal degradation."
    explanation: The observation the hypothesis exists to explain - less protein with more signal.
  - reference: PMID:41729082
    reference_title: "Structural modeling and functional characterization of a novel gain-of-function TLR8 variant causing severe inflammatory syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Together, these findings integrating structural modeling with functional assays identify a novel TLR8 ligand-specific gain-of-function mutation resulting in complex immunopathology in"
    explanation: >-
      The authors' summary, calling the mutation ligand-specific - which is the
      conformational reading rather than an abundance one. Truncated at a line boundary
      in the cached record.

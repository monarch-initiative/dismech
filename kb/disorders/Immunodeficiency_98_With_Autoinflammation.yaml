      label: Decreased total neutrophil count
  evidence:
  - reference: clinicaltrials:NCT04339777
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To see if stem cell transplant can be successfully performed in people with primary immunodeficiency disease and cure them."
    explanation: The trial's stated objective, which is the intervention this entry curates as the only effective one.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 8 underwent HCT on a clinical trial (ClinicalTrials.gov identifier: NCT04339777)."
    explanation: The link between this trial and the cohort, naming the patient transplanted on it.
diagnosis:
- name: Targeted deep sequencing for low-variant-allele-fraction somatic TLR8 variants
  description: >-
    The diagnostic problem in this disease is not recognising the phenotype, it is
    detecting the variant. Eight of ten patients are somatic mosaics with peripheral
    blood variant allele fractions between 7 and 26 per cent, and a germline exome or
    genome pipeline calling at standard heterozygous thresholds will filter those out.
    The authors state the remedy directly: a high index of suspicion, and targeted deep
    sequencing when standard analysis is negative.

    Two details change the threshold for reaching for it. In female patients the
    fraction is expected to be lower still, because there are two X chromosomes to
    dilute it - which is precisely the group least likely to be suspected in what was
    described as a male disease. And a negative blood test does not exclude the
    diagnosis, since the mosaicism has been found in skin fibroblasts as well.
  diagnosis_term:
    preferred_term: targeted deep sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high index of suspicion is necessary, as somatic mutations may be missed on standard exome and genome analysis, especially in female patients where VAFs may be lower due to the presence of 2 X chromosomes."
    explanation: The reason standard sequencing fails here, and the group it fails hardest in.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alternative methodologies to identify variants, such as targeted deep sequencing, may be required."
    explanation: The recommended alternative, stated by the authors as a methodology rather than a suggestion.
  - reference: PMID:36119097
    reference_title: "Gain-of-function defects in toll-like receptor 8 shed light on the interface between immune system and bone marrow failure disorders."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "This not only has repercussions for the diagnostic workup of these disorders, inasmuch that routine genetic testing may miss somatic variants, but has therapeutic implications as well, for example, with the approach to curative treatment, such as hematopoietic stem cell transplantation."
    explanation: >-
      The same problem stated from the review literature, and generalized: TLR8 gain of
      function is one of a growing set of disorders caused by both germline and somatic
      variants, for which routine testing is systematically blind.
- name: Bone marrow biopsy with immunophenotyping
  description: >-
    The marrow is where this disease looks like itself: myeloid hypoplasia to
    agranulocytosis with predominantly CD8-positive T-cell infiltrates or aggregates,
    and in half the cohort CD8-positive CD57-positive large granular lymphocytes. No
    patient showed dysplasia, which matters because the differential includes marrow
    failure syndromes that do.

    The finding to be careful with is the negative one. The first reported female
    patient had myeloid predominance with erythroid hypoplasia and lacked the inverted
    CD4:CD8 ratio and memory skewing seen in the others, and the authors say plainly
    that absent characteristic findings do not exclude the diagnosis. So the biopsy
    supports the diagnosis and cannot rule it out.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients had marked myeloid hypoplasia to agranulocytosis, and the presence of predominantly CD8+ T-cell lymphoid infiltrates or aggregates."
    explanation: The characteristic marrow picture.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of dysplasia on any of the bone marrow biopsies."
    explanation: >-
      A negative that does diagnostic work: it separates this from the myelodysplastic
      end of the marrow-failure differential.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the absence of characteristic findings on bone marrow biopsy and immune phenotyping does not preclude a diagnosis of TLR8 GOF."
    explanation: >-
      Evidence against treating the biopsy as a rule-out test. Recorded as REFUTE against
      that use of it, not against its value when positive.
treatments:
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The only intervention shown to resolve the disease. Seven of ten reported patients
    were transplanted; five are surviving at one to three years with full donor
    myeloid and T-cell chimerism and resolution of the phenotype. The counterfactual is
    stark - both patients who presented in childhood and were not transplanted died of
    the disease. It is not a benign option: post-transplant cytopenia of unclear
    aetiology and graft-versus-host disease were both common.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: TLR8 Gain-of-Function Variant
    description: >-
      Replacing the haematopoietic compartment removes the mutant clone from blood and
      marrow. Note that it does not remove it from other tissues, since the mosaicism
      extends to fibroblasts - so this addresses the compartment that produces the
      disease rather than the variant itself.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients are surviving at 1 to 3 years after HCT with full donor myeloid and T-cell chimerism, and resolution of disease phenotype."
    explanation: The efficacy result, with chimerism as the mechanistic correlate of the clinical resolution.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High rates of post-HCT cytopenia of unclear etiology and graft-versus-host disease were observed."
    explanation: The toxicity side of the same cohort, recorded so the treatment is not read as straightforwardly successful.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2 patients who presented during childhood and did not undergo HCT ultimately died from disease."
    explanation: The untransplanted outcome, which is what makes the case for transplantation despite its toxicity.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although this hypothesis is unproven, it may be prudent to avoid high-dose busulfan for patients with TLR8 GOF due to concerns for increased risk of chemotherapy-related toxicity."
    explanation: >-
      The conditioning recommendation, which is the one piece of actionable detail on
      how to do this transplant rather than whether to. Note the authors' own hedge -
      the mechanism they propose for it, that TLR8-GOF tissue-resident cells surviving
      conditioning are primed to over-respond to tissue injury, is unproven.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the patient (patient 2) who received high-dose busulfan developed severe VOD and multisystem organ failure after HCT followed by secondary graft failure."
    explanation: >-
      The single case behind the recommendation. One patient, which is why it is recorded
      as prudence rather than as a contraindication.
- name: Granulocyte Colony-Stimulating Factor and Corticosteroids
  description: >-
    Recorded because they do not work. Both are standard for the presentations this
    disease mimics - chronic neutropenia and immune-mediated cytopenia - and the
    neutropenia is refractory to both. That refractoriness is a diagnostic signal as
    much as a therapeutic failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_mechanisms:
  - target: Myeloid Hypoplasia and Bone Marrow Failure
    description: >-
      Both agents act on the marrow failure node, and both fail there - which locates
      the problem upstream of anything a growth factor or a broad immunosuppressant
      can reach.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The neutropenia was refractory to granulocyte-colony stimulating factor (G-CSF) and corticosteroids, and 3 patients underwent allogeneic hematopoietic cell transplant (HCT)."
    explanation: >-
      Direct evidence against these agents as treatments for this disease. Recorded as
      REFUTE rather than omitted because "tried and failed" is a finding a curator or a
      clinician needs, and because the refractoriness is itself diagnostically useful.
- name: TLR8 Inhibition
  description: >-
    Preclinical, and the evidence now comes from two directions that need separating.

    In patient cells. Three inhibitors were tested in iPSC-derived macrophages carrying
    the p.P432L variant, the commonest one in this disease. Chloroquine, which raises
    endosomal pH, and CPG-52364, a small-molecule TLR7/8 inhibitor, both suppressed IL-6
    production from the gain-of-function receptor. CU-CPT9a did not: it inhibited
    wild-type TLR8 and the p.P432L cells were resistant to it. That split is
    informative beyond the drug screen, because CU-CPT9a works by binding TLR8 in its
    inactive conformation - so a variant that resists it is a variant that is not
    spending its time in that conformation, which is what the conformational-gain
    hypothesis in this entry predicts.

    In other erythroid systems. TLR8 inhibition also improves erythropoiesis in
    RPS19-haploinsufficient cells and in CD34-positive cells from healthy donors and
    from patients with inherited non-haemolytic anaemia. That work was done in the
    context of inherited anaemia rather than in TLR8 gain-of-function patients, so it
    supports the erythroid arm by analogy rather than directly.

    Neither line has reached a patient. There are no clinical data for any TLR8
    inhibitor in this disease, and the one endosomal-signalling inhibitor that was given
    to a patient - hydroxychloroquine, in one case - had no effect on the neutrophil
    count.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: TLR8-Driven Blockade of EPO Signaling in Erythroid Progenitors
    description: >-
      Inhibition acts on the receptor node directly, which is the one point in the
      erythroid arm upstream of the STAT5 mislocalisation.
  evidence:
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TLR8 inhibition improves erythropoiesis in RPS19+/- HuDEP2 cells and CD34+ cells from healthy donors and inherited non-hemolytic anemic patients."
    explanation: >-
      The rescue result. Note the cell systems named are not from TLR8 gain-of-function
      patients, which is the limitation recorded in the description.
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identify a gene implicated in inherited anemia and a previously undescribed role for TLR8 in erythropoiesis, which could potentially be explored for therapeutic benefit in inherited anemia."
    explanation: The authors' own framing of the therapeutic implication as something to explore rather than established.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CHQ and CPG-52364 both inhibited IL-6 production by macrophages expressing WT and GOF TLR8 (Figure 2H-I)."
    explanation: >-
      The positive result, and the only inhibitor data generated in cells carrying a
      disease-causing TLR8 variant rather than in a surrogate system.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "The results demonstrate that CU-CPT9a inhibited WT TLR8 activity, but cells with the p.P432L variant were resistant to CU-CPT9a treatment (Figure 2G)."
    explanation: >-
      Evidence against one of the three agents specifically. Recorded as REFUTE rather
      than omitted because a selective TLR8 inhibitor that fails on the disease variant
      is exactly what a reader reaching for this strategy needs to know.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydroxychloroquine, which is thought to inhibit endosomal TLR signaling,10 was also trialed in 1 patient, again without effect."
    explanation: >-
      The one time an endosomal TLR inhibitor reached a patient in this cohort. A single
      case, and negative, which is why the description calls the strategy preclinical
      despite the in vitro results above.
- name: Immunoglobulin Replacement
  description: >-
    Given to the six of ten patients with hypogammaglobulinemia. Unlike the other
    medical therapies in this entry it is not being tried against the neutropenia; it
    replaces a deficiency the disease produces, and the cohort report records it as
    administered rather than as trialled. It does nothing for the marrow failure.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired B-Cell Maturation
    description: >-
      Substitutes exogenous antibody for the antibody the impaired B-cell compartment
      cannot produce. It is pure replacement: the maturation defect is untouched.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients had hypogammaglobulinemia requiring immunoglobulin replacement."
    explanation: The therapy and its indication in one sentence, in six of ten patients.
- name: Sirolimus, Mycophenolate Mofetil and JAK Inhibitors
  description: >-
    Recorded for the same reason G-CSF and corticosteroids are: they were tried and
    none of them worked. Sirolimus in four patients, mycophenolate mofetil in two, JAK
    inhibitors in two, all without response, and a further patient received
    azathioprine, methotrexate, cyclophosphamide and rituximab over three to four
    months with no improvement in neutrophil count.

    The pattern is the finding. These agents span mTOR, purine synthesis, JAK-STAT and
    B-cell depletion, and the neutropenia is indifferent to all of them. That is what
    makes transplantation the only intervention in this entry with a positive result,
    and it is a substantive claim about where the lesion sits rather than a list of
    disappointments.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: Excess NF-kB-Dependent Cytokine Production
    description: >-
      All of these are aimed, directly or indirectly, at the inflammatory output of this
      node. Their uniform failure is evidence that suppressing the output downstream does
      not reach the receptor-level lesion that generates it.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Other therapies that were trialed in >1 patient included sirolimus (n = 4), mycophenolate mofetil (n = 2), and JAK inhibitors (n = 2), all without response."
    explanation: >-
      Direct evidence against three drug classes in this disease, with the numbers
      treated. Recorded as REFUTE for the same reason the G-CSF entry is.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient received alemtuzumab for suspected evolving T-cell LGL leukemia, and 1 patient received azathioprine, methotrexate, cyclophosphamide, and rituximab therapy for 3 to 4 months with no improvement in neutrophil count."
    explanation: >-
      The single-patient failures, including the one given four agents in sequence. Kept
      with the multi-patient failures above because the claim is about the class of
      approach rather than about any one drug.
notes: >-
  Why this is a Disease entry and not a line in a TLR-signalling module. The
  combination of immunodeficiency with autoinflammation from a single sensor's gain
  of function, arising predominantly as a somatic mosaic, is a specific pathograph
  rather than an instance of a general pattern. The erythroid arm is a second,
  independently characterised mechanism from the same receptor.

  On the somatic variant_origin. The pathophysiology's initiating node carries
  variant_origin: SOMATIC because that is the majority molecular mechanism - eight of
  ten patients. Germline variants are also reported, including in the first female
  patient, and the disease is the same. The slot is single-valued, so the majority
  case is recorded there and the germline route is described in the inheritance and
  genetic blocks.

  Evidence that this entry deliberately records as negative. Granulocyte
  colony-stimulating factor and corticosteroids are curated as a treatment with
  REFUTE evidence rather than left out, because their failure is a diagnostic signal
  and because a reader looking for what to try should find out here that those were
  tried. The same applies to the transplant toxicity, which is recorded alongside the
  efficacy rather than after it.

  Why there is no knock-in mouse. TLR8 ligand recognition is species-specific: the
  antiviral compound R848 activates the human receptor but not the rodent one, and the
  sequence variation responsible localises to LRR14-15. A mouse carrying the homologous
  substitution would therefore not be sensing the same things, which is a stronger
  objection than the usual mouse-versus-human caveat. The divergence is not confined to
  the receptor either: TIRAP is recruited to the TLR8-MyD88 complex in human monocytes
  and not to MyD88 in mouse macrophages, and human IRAK-2 is required for TLR8-driven
  NF-kB activation where the mouse knockout said it was not. Both are curated on the
  adaptor node.

  The objection is to a knock-in, and the humanised route gets around it, so the
  animal_models section is not empty: a human TLR8 transgenic crossed onto a lupus
  background is curated there, with fidelity LOW and the reasons stated. It is a real
  model of a converging phenotype rather than a model of this disease, and the earlier
  version of this note overstated the absence by not distinguishing the two routes.

  The patient-derived iPSC myeloid differentiation in the founding paper remains the
  system that carries the weight, and it is curated on the sensor node.

  What is thin. This disease was first described in 2021 and the literature is a
  founding cohort, an expanded cohort that contains it, and a small number of single
  cases. Several claims here rest on ten patients or fewer, and two phenotypes
  (autoimmune myelofibrosis, pure red cell aplasia) rest on one patient each and are
  flagged as such in their own descriptions.

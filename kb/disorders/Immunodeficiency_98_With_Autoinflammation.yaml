- name: Myeloid Hypoplasia and Bone Marrow Failure
  description: >-
    The dominant clinical problem. Neutropenia is universal and usually severe, and is
    refractory to the treatments that work in other neutropenias. Anaemia and
    thrombocytopenia are common, so the failure is not confined to the granulocytic
    line. An increased number of large granular lymphocytes was found in half the
    expanded cohort.

genetic:
- name: TLR8
  association: Causal
  gene_term:
    preferred_term: TLR8
    term:
      id: hgnc:15632
      label: TLR8
  notes: >-
    TLR8 is at Xp22.2. Disease-causing variants are missense and gain of function.
    Most are somatic, present as post-zygotic mosaics at peripheral blood variant
    allele fractions of 7 to 26 per cent and detectable in skin fibroblasts as well as
    blood; germline variants are reported, including in the first described female
    patient. A TLR8-G572D variant has been reported in a patient with autoimmune
    myelofibrosis. Age of onset spans 9 months to 28 years. Because most cases are
    mosaic, variant calling at standard germline heterozygous thresholds will miss
    them.
  evidence:
  - reference: PMID:33512449
    reference_title: "Immunodeficiency and bone marrow failure with mosaic and germline TLR8 gain of function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated with 3 different variants in the X-linked gene TLR8, encoding the endosomal Toll-like receptor 8 (TLR8)"
    explanation: Establishes TLR8 as the causal gene and names its product.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel missense variants in the TLR8 gene, located on the short arm of chromosome X (Xp22.2), were recently identified in 6 unrelated male patients with severe neutropenia, lymphoproliferation, and immune dysregulation, known as INFLTR8 (inflammation, neutropenia, bone marrow failure, and lymphoproliferation caused by TLR8)."
    explanation: Gives the cytogenetic location and the acronym the disease is also known by.
  - reference: PMID:42023410
    reference_title: "Autoimmune myelofibrosis with a TLR8 gain-of-function defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a TLR8-G572D mutation, leading to a diagnosis of autoimmune myelofibrosis (AIMF) secondary to TLR8 gain of function (GOF)."
    explanation: A further variant and the presentation it was found in.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients in the expanded cohort, which incorporates the original six. Further
    single cases have been reported since. The disease was first described in 2021, so
    the reported count reflects how recently it was recognised at least as much as how
    rare it is - a point the mosaic molecular mechanism sharpens, since routine
    germline pipelines would not have found these patients.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the expanded clinical and laboratory phenotype and management of 10 patients, including the original cohort of 6 male patients."
    explanation: The cohort size and its relationship to the founding series.
treatments:
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The only intervention shown to resolve the disease. Seven of ten reported patients
    were transplanted; five are surviving at one to three years with full donor
    myeloid and T-cell chimerism and resolution of the phenotype. The counterfactual is
    stark - both patients who presented in childhood and were not transplanted died of
    the disease. It is not a benign option: post-transplant cytopenia of unclear
    aetiology and graft-versus-host disease were both common.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: TLR8 Gain-of-Function Variant
    description: >-
      Replacing the haematopoietic compartment removes the mutant clone from blood and
      marrow. Note that it does not remove it from other tissues, since the mosaicism
      extends to fibroblasts - so this addresses the compartment that produces the
      disease rather than the variant itself.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients are surviving at 1 to 3 years after HCT with full donor myeloid and T-cell chimerism, and resolution of disease phenotype."
    explanation: The efficacy result, with chimerism as the mechanistic correlate of the clinical resolution.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High rates of post-HCT cytopenia of unclear etiology and graft-versus-host disease were observed."
    explanation: The toxicity side of the same cohort, recorded so the treatment is not read as straightforwardly successful.
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2 patients who presented during childhood and did not undergo HCT ultimately died from disease."
    explanation: The untransplanted outcome, which is what makes the case for transplantation despite its toxicity.
- name: Granulocyte Colony-Stimulating Factor and Corticosteroids
  description: >-
    Recorded because they do not work. Both are standard for the presentations this
    disease mimics - chronic neutropenia and immune-mediated cytopenia - and the
    neutropenia is refractory to both. That refractoriness is a diagnostic signal as
    much as a therapeutic failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_mechanisms:
  - target: Myeloid Hypoplasia and Bone Marrow Failure
    description: >-
      Both agents act on the marrow failure node, and both fail there - which locates
      the problem upstream of anything a growth factor or a broad immunosuppressant
      can reach.
  evidence:
  - reference: PMID:41370196
    reference_title: "Clinical characteristics, management, and hematopoietic cell transplantation of patients with TLR8 gain-of-function."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The neutropenia was refractory to granulocyte-colony stimulating factor (G-CSF) and corticosteroids, and 3 patients underwent allogeneic hematopoietic cell transplant (HCT)."
    explanation: >-
      Direct evidence against these agents as treatments for this disease. Recorded as
      REFUTE rather than omitted because "tried and failed" is a finding a curator or a
      clinician needs, and because the refractoriness is itself diagnostically useful.
- name: TLR8 Inhibition
  description: >-
    A preclinical strategy aimed at the erythroid arm. TLR8 inhibition improves
    erythropoiesis in RPS19-haploinsufficient cells and in CD34-positive cells from
    healthy donors and from patients with inherited non-haemolytic anaemia. The work
    was done in the context of inherited anaemia generally rather than in TLR8
    gain-of-function patients, so this is a mechanistic rationale rather than a
    treatment for this disease. No clinical data exist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: TLR8-Driven Blockade of EPO Signaling in Erythroid Progenitors
    description: >-
      Inhibition acts on the receptor node directly, which is the one point in the
      erythroid arm upstream of the STAT5 mislocalisation.
  evidence:
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TLR8 inhibition improves erythropoiesis in RPS19+/- HuDEP2 cells and CD34+ cells from healthy donors and inherited non-hemolytic anemic patients."
    explanation: >-
      The rescue result. Note the cell systems named are not from TLR8 gain-of-function
      patients, which is the limitation recorded in the description.
  - reference: PMID:38971858
    reference_title: "Erythroid-intrinsic activation of TLR8 impairs erythropoiesis in inherited anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identify a gene implicated in inherited anemia and a previously undescribed role for TLR8 in erythropoiesis, which could potentially be explored for therapeutic benefit in inherited anemia."
    explanation: The authors' own framing of the therapeutic implication as something to explore rather than established.
notes: >-
  Why this is a Disease entry and not a line in a TLR-signalling module. The
  combination of immunodeficiency with autoinflammation from a single sensor's gain
  of function, arising predominantly as a somatic mosaic, is a specific pathograph
  rather than an instance of a general pattern. The erythroid arm is a second,
  independently characterised mechanism from the same receptor.

  On the somatic variant_origin. The pathophysiology's initiating node carries
  variant_origin: SOMATIC because that is the majority molecular mechanism - eight of
  ten patients. Germline variants are also reported, including in the first female
  patient, and the disease is the same. The slot is single-valued, so the majority
  case is recorded there and the germline route is described in the inheritance and
  genetic blocks.

  Evidence that this entry deliberately records as negative. Granulocyte
  colony-stimulating factor and corticosteroids are curated as a treatment with
  REFUTE evidence rather than left out, because their failure is a diagnostic signal
  and because a reader looking for what to try should find out here that those were
  tried. The same applies to the transplant toxicity, which is recorded alongside the
  efficacy rather than after it.

  Why there is no animal model here. TLR8 ligand recognition is species-specific: the
  antiviral compound R848 activates the human receptor but not the rodent one, and the
  sequence variation responsible localises to LRR14-15. A mouse carrying the homologous
  substitution would therefore not be sensing the same things, which is a stronger
  objection than the usual mouse-versus-human caveat and is why the animal_models
  section is absent rather than thin. The patient-derived iPSC myeloid differentiation
  in the founding paper is the model that carries the weight instead, and it is curated
  on the sensor node.

  What is thin. This disease was first described in 2021 and the literature is a
  founding cohort, an expanded cohort that contains it, and a small number of single
  cases. Several claims here rest on ten patients or fewer, and two phenotypes
  (autoimmune myelofibrosis, pure red cell aplasia) rest on one patient each and are
  flagged as such in their own descriptions.

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Oocytes lacking Zfp36l2 fail to accumulate histone methylation at H3K4
        and H3K9, marks associated with the transcriptionally silent,
        developmentally competent oocyte state.
      explanation: Direct readout of the node in the model.
  - target: Failed Global Transcriptional Silencing in Oocytes
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Source of the transcriptional-silencing node.
    limitations: >-
      A complete oocyte-specific knockout rather than a patient allele;

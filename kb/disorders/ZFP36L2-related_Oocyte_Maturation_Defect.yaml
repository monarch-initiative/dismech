diagnosis:
- name: Genetic testing after repeated IVF/ICSI failure
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility gene panel including ZFP36L2 can
    be considered for women with repeated IVF/ICSI failure from oocyte
    maturation defect or preimplantation embryo arrest. Biallelic variants
    must be confirmed in trans by parental testing.
  evidence:
  - reference: PMID:37211617
    reference_title: A novel homozygous variant in ZFP36L2 cause female infertility due to oocyte maturation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that ZFP36L2 might be a genetic diagnostic marker for the
      affected individuals with oocyte maturation defect
    explanation: Authors propose ZFP36L2 as a diagnostic marker.
animal_models:
- name: Oocyte-specific Zfp36l2 conditional knockout mouse
  species: Mouse
  genotype: Zfp36l2 conditional knockout in oocytes
  publication: PMID:29408237
  description: >-
    Females lacking Zfp36l2 in oocytes are completely infertile. Their
    oocytes fail to silence transcription or gain H3K4 and H3K9 methylation,
    mature abnormally, and are not fertilized.
  modeled_mechanisms:
  - target: Failed Oocyte H3K4 and H3K9 Methylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Source of the histone-mark node.
    limitations: >-
      A complete oocyte-specific knockout, whereas patient genotypes are
      in-frame or missense alleles; histone marks have not been measured in
      patient oocytes.
    evidence:
    - reference: PMID:29408237

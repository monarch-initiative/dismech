name: ZFP36L2-related Oocyte Maturation Defect
creation_date: "2026-10-21T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte maturation defect 13
  term:
    id: MONDO:0859330
    label: oocyte maturation defect 13
synonyms:
- oocyte maturation defect 13
- OOMD13
- ZFP36L2-related female infertility
description: >-
  ZFP36L2-related oocyte maturation defect (oocyte maturation defect 13) is an
  autosomal-recessive form of primary female infertility caused by biallelic
  variants in ZFP36L2, an AU-rich-element RNA-binding protein that recruits the
  CCR4-NOT deadenylase to degrade maternal mRNAs in the oocyte and zygote.
  Affected women have no reported somatic abnormality, and their IVF/ICSI
  cycles fail either because oocytes do not mature or because fertilized
  embryos arrest before implantation. Patient variants lower ZFP36L2 protein,
  weaken its binding to the CCR4-NOT complex, and impair degradation of
  maternal mRNAs in HeLa cells, mouse oocytes, and patient zygotes. In mice,
  oocyte-specific loss of Zfp36l2 leaves histone demethylase mRNAs undegraded,
  so oocytes fail to gain H3K4 and H3K9 methylation and to silence
  transcription, and they then mature and fertilize poorly. A hypomorphic
  Zfp36l2 allele gives two-cell embryo arrest or, on another strain
  background, oocyte germinal-vesicle arrest. Fewer than ten affected women
  have been reported, all in Chinese infertility cohorts, and no treatment is
  established.
parents:
- hereditary disease
- female reproductive system disease
references:
- reference: PMID:34611029

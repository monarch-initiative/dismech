- name: DeltaN-Zfp36l2 hypomorphic mouse
  species: Mouse
  genotype: Zfp36l2 targeted allele expressing reduced N-terminally truncated protein (DeltaN-Zfp36l2), homozygous
  publication: PMID:15342461
  description: >-
    Homozygous females are infertile. On the C57BL/6NTac background they
    ovulate and their eggs are fertilized, but embryos arrest at the two-cell
    stage. On a 129S6/SvEvTac background they do not ovulate and most oocytes
    stay at the germinal vesicle stage, a difference the authors partly
    attribute to strain differences in ovarian luteinizing hormone receptor
    mRNA, another ZFP36L2 target.
  modeled_mechanisms:
  - target: Embryo Developmental Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Embryos from mutant oocytes arrest at the two-cell stage.
    limitations: >-
      Engineered truncation with reduced expression rather than a patient
      allele; mouse embryos arrest at the two-cell stage, the time of mouse
      zygotic genome activation, which differs from the human timing.
    evidence:
    - reference: PMID:15342461
      reference_title: The CCCH tandem zinc-finger protein Zfp36l2 is crucial for female fertility and early embryonic development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        DeltaN-Zfp36l2 females apparently cycled and ovulated normally, and
        their ova could be fertilized; however, the embryos did not progress
        beyond the two-cell stage of development.
      explanation: Two-cell embryo arrest in the model.
  - target: Oocyte Maturation Arrest
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Germinal-vesicle arrest on the 129S6/SvEvTac background.
    limitations: >-
      Seen on one strain background only and accompanied by anovulation,
      which has not been reported in patients; the authors link it partly to
      ovarian LH receptor mRNA rather than to an oocyte-intrinsic defect.
    evidence:
    - reference: PMID:24830504
      reference_title: The RNA-binding protein, ZFP36L2, influences ovulation and oocyte maturation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Remarkably, only 21 ± 6% of ΔN-Zfp36l2 oocytes matured, and the bulk
        (79 ± 6%) remained arrested at the germinal vesicle (GV) stage
      explanation: Germinal-vesicle arrest in the model.
  evidence:
  - reference: PMID:24830504
    reference_title: The RNA-binding protein, ZFP36L2, influences ovulation and oocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, we discovered that ZFP36L2 interacts with the 3'UTR of LHR
      mRNA and that decreased expression levels of Zfp36l2 correlates with
      higher levels of LHR mRNA in synchronized ovaries.
    explanation: Ovarian LH receptor mRNA as a second ZFP36L2 target in the model.
notes: >-
  No treatments section: no treatment for this disorder has been reported. A
  PubMed search for "ZFP36L2 AND (infertility OR oocyte OR embryo)" (21 records
  on 2026-10-21) returned no report of in-vitro maturation, cRNA rescue, donor
  oocytes, or pregnancy in an affected woman. The only rescue data are ex vivo
  partial rescue of mouse germinal-vesicle arrest by PKA inhibition
  (PMID:24830504).

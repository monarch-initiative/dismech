  evidence:
  - reference: PMID:29408237
    reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated by the mRNA Decay Activator ZFP36L2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following superovulation and mating experiments to examine
      fertilization, no zygotes were recovered from 8 cKO females compared to
      ninety-five zygotes from 5 control females, demonstrating that cKO
      oocytes are incompetent to undergo fertilization (Figure 1G).

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected women carry a homozygous variant (one from a consanguineous
    family) or compound-heterozygous variants. No penetrance value is assigned.
    The zygosity of the two variants reported in the subcortical-maternal-complex
    cohort (PMID:39178021) is not stated in its abstract.
  evidence:
  - reference: PMID:37211617
    reference_title: A novel homozygous variant in ZFP36L2 cause female infertility due to oocyte maturation defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we used whole exome sequencing in the affected individual with oocyte
      maturation defect from a consanguineous family and identified a
      homozygous variant c.853_861del (p.285_287del) in ZFP36L2.
    explanation: Homozygous variant in a proband from a consanguineous family.
  - reference: PMID:38829516
    reference_title: Identification of novel compound heterozygous ZFP36L2 variants implicated in oocyte maturation defects and female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel compound heterozygous variant in ZFP36L2 (c.186T > G, p.His62Gln
      and c.869 C > T, p.Pro290Leu) was discovered in a patient with oocyte
      maturation defects.
    explanation: Compound-heterozygous proband, consistent with recessive transmission.
  - reference: PMID:34611029
    reference_title: Biallelic variants in ZFP36L2 cause female infertility characterised by recurrent preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in ZFP36L2 were associated with RPEA and the recurrent
      variant (p.Ser308_Ser310del) prevented maternal mRNA decay in zygotes and
      HeLa cells.
    explanation: Biallelic genotypes in the founding cohort.
pathophysiology:
- name: Biallelic ZFP36L2 Variants Reducing mRNA Decay Activator Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    In-frame deletions and missense variants lower ZFP36L2 protein in oocytes
    (attributed to instability of the variant mRNA) and weaken binding of
    ZFP36L2 to the CCR4-NOT deadenylase subunit CNOT6L. ZFP36L2 normally binds
    AU-rich elements in the 3' untranslated region of its target mRNAs and
    recruits CCR4-NOT to deadenylate and degrade them. The genotypes are
    treated as partial rather than complete loss of function because affected
    women have no reported somatic phenotype, and none of the reported
    genotypes is a predicted null.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Biallelic genotypes made of in-frame deletions or duplications and
      missense variants, several clustered between residues 285 and 310.
  genes:
  - preferred_term: ZFP36L2
    term:
      id: hgnc:1108
      label: ZFP36L2
  molecular_functions:
  - preferred_term: AU-rich element mRNA binding
    term:
      id: GO:0035925
      label: mRNA 3'-UTR AU-rich region binding
    modifier: DECREASED
  - preferred_term: CCR4-NOT complex binding
    term:
      id: GO:1905762
      label: CCR4-NOT complex binding
    modifier: DECREASED
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:37211617
    reference_title: A novel homozygous variant in ZFP36L2 cause female infertility due to oocyte maturation defect.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies showed that the variant caused decreased protein levels
      of ZFP36L2 in oocytes due to mRNA instability and might lead to the loss
      of its function to degrade maternal mRNAs.
    explanation: The homozygous in-frame deletion lowers ZFP36L2 protein in oocytes.
  - reference: PMID:38829516
    reference_title: Identification of novel compound heterozygous ZFP36L2 variants implicated in oocyte maturation defects and female infertility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings indicate that these variants lead to compromised binding
      capacity of the ZFP36L2-CONT6L complex and impaired mRNA degradation in
      HeLa cells and mouse oocytes.
    explanation: >-
      Patient missense variants weaken the interaction with the CCR4-NOT
      subunit CNOT6L (spelled CONT6L in the abstract).
  - reference: PMID:29408237
    reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated by the mRNA Decay Activator ZFP36L2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Oocyte-specific loss of ZFP36L2 an RNA-binding protein that promotes
      AU-rich element-dependent mRNA decay prevents global transcriptional
      silencing and causes oocyte maturation and fertilization defects, as
      well as complete female infertility in the mouse.
    explanation: >-
      Establishes the normal function lost here, AU-rich element-dependent
      mRNA decay in the oocyte.
  downstream:
  - target: Impaired Maternal mRNA Decay in Oocytes and Zygotes
    description: >-
      Less functional ZFP36L2 means fewer of its target maternal mRNAs are
      deadenylated and degraded.
- name: Impaired Maternal mRNA Decay in Oocytes and Zygotes
  biological_scale: MOLECULAR
  description: >-
    Maternal mRNAs that ZFP36L2 would normally degrade persist in patient
    zygotes, in mouse oocytes expressing patient variants, and in transfected
    HeLa cells. Single-cell RNA sequencing of patient oocytes shows altered
    transcripts for cell division, mitochondrial function, and ribosome
    metabolism. One cohort reports that ZFP36L2 co-precipitates with
    subcortical maternal complex proteins, but whether that interaction is
    part of the disease mechanism is not established.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: maternal mRNA clearance
    term:
      id: GO:0141065
      label: maternal mRNA clearance
    modifier: DECREASED
  - preferred_term: mRNA destabilization
    term:
      id: GO:0061157
      label: mRNA destabilization
    modifier: DECREASED
  evidence:
  - reference: PMID:34611029
    reference_title: Biallelic variants in ZFP36L2 cause female infertility characterised by recurrent preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in ZFP36L2 were associated with RPEA and the recurrent
      variant (p.Ser308_Ser310del) prevented maternal mRNA decay in zygotes and
      HeLa cells.
    explanation: Maternal mRNA decay fails in patient zygotes.
  - reference: PMID:38829516
    reference_title: Identification of novel compound heterozygous ZFP36L2 variants implicated in oocyte maturation defects and female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we characterized the changes in the human oocyte
      transcriptome associated with ZFP36L2 variants, with a particular
      emphasis on cell division, mitochondrial function, and ribosome
      metabolism.
    explanation: Patient oocyte transcriptome is altered.
  - reference: PMID:39178021
    reference_title: "Variants in NLRP2 and ZFP36L2, non-core components of the human subcortical maternal complex, cause female infertility with embryonic development arrest."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the ZFP36L2 variants were associated with disrupted
      stability of its target mRNAs, which resulted in aberrant H3K4me3 and
      H3K9me3 levels.
    explanation: >-
      A third variant set disrupts target-mRNA stability when expressed in
      mouse oocytes.
  downstream:
  - target: Failed Oocyte H3K4 and H3K9 Methylation
    description: >-
      Histone demethylase mRNAs are among the ZFP36L2 targets left
      undegraded.
  - target: Embryo Developmental Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Persisting maternal mRNAs in the zygote are associated with
      preimplantation arrest; which persisting transcripts cause the arrest is
      not known.
- name: Failed Oocyte H3K4 and H3K9 Methylation
  biological_scale: MOLECULAR
  description: >-
    Mainly model-derived. In growing mouse oocytes lacking Zfp36l2, mRNAs for
    H3K4 and H3K9 demethylases are not degraded, and the oocyte fails to
    accumulate H3K4me3 and H3K9me3. Patient ZFP36L2 variants expressed in
    mouse oocytes also give aberrant H3K4me3 and H3K9me3 levels. Histone marks
    have not been measured in patient oocytes. No GO term is bound because the
    GO histone-methylation process terms are obsolete.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:29408237
    reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated by the mRNA Decay Activator ZFP36L2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Single-cell RNA sequencing revealed that ZFP36L2 downregulates mRNAs
      encoding transcription and chromatin modification regulators, including
      a large group of mRNAs for histone demethylases targeting H3K4 and H3K9,
      which we show are bound and degraded by ZFP36L2.
    explanation: Identifies histone demethylase mRNAs as ZFP36L2 decay targets.
  - reference: PMID:29408237
    reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated by the mRNA Decay Activator ZFP36L2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Oocytes lacking Zfp36l2 fail to accumulate histone methylation at H3K4
      and H3K9, marks associated with the transcriptionally silent,
      developmentally competent oocyte state.
    explanation: Loss of the histone marks in knockout oocytes.
  - reference: PMID:39178021
    reference_title: "Variants in NLRP2 and ZFP36L2, non-core components of the human subcortical maternal complex, cause female infertility with embryonic development arrest."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the ZFP36L2 variants were associated with disrupted
      stability of its target mRNAs, which resulted in aberrant H3K4me3 and
      H3K9me3 levels.
    explanation: Patient variants alter the same histone marks in mouse oocytes.
  - reference: PMID:39178021
    reference_title: "Variants in NLRP2 and ZFP36L2, non-core components of the human subcortical maternal complex, cause female infertility with embryonic development arrest."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These disruptions decreased oocyte quality and further developmental
      potential.
    explanation: >-
      Patient-variant-driven histone-mark changes reduce oocyte developmental
      potential in mouse oocytes.
  downstream:
  - target: Failed Global Transcriptional Silencing in Oocytes
    description: >-
      In the oocyte, accumulated H3K4me3 and H3K9me3 accompany and contribute
      to global transcriptional silencing at the end of growth.
- name: Failed Global Transcriptional Silencing in Oocytes
  biological_scale: CELLULAR
  description: >-
    Model-derived. Fully grown mouse oocytes normally silence transcription
    before the oocyte-to-embryo transition, and silencing marks the
    developmentally competent state. Oocytes lacking Zfp36l2 do not silence
    transcription, and they then mature and fertilize poorly. Silencing has
    not been assessed in patient oocytes. No GO term is bound: OLS searches of
    GO for "transcriptional silencing" and "heterochromatin formation"
    returned RNA-mediated silencing and heterochromatin-formation terms, none
    describing global transcriptional silencing of the oocyte.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  evidence:
  - reference: PMID:29408237
    reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated by the mRNA Decay Activator ZFP36L2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Oocyte-specific loss of ZFP36L2 an RNA-binding protein that promotes
      AU-rich element-dependent mRNA decay prevents global transcriptional
      silencing and causes oocyte maturation and fertilization defects, as
      well as complete female infertility in the mouse.
    explanation: Loss of Zfp36l2 prevents global transcriptional silencing in mouse oocytes.
  downstream:
  - target: Oocyte Maturation Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Oocytes that fail to silence transcription mature poorly; the steps
      between persistent transcription and failed meiotic resumption are not
      defined.
  - target: Embryo Developmental Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced oocyte developmental competence is proposed to carry through to
      early embryo failure.

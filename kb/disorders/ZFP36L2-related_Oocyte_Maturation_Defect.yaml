- name: Oocyte Maturation Arrest
  description: >-
    Retrieved oocytes fail to mature. The two case reports describe an
    oocyte maturation defect without stating the arrest stage in their
    abstracts; in the hypomorphic mouse most oocytes stay at the germinal
    vesicle stage.

    snippet: >-
      ADNP-related HVDAS is an autosomal dominant disorder. Most probands whose
      parents have undergone molecular genetic testing have the disorder as the
      result of a de novo ADNP pathogenic variant. In two families reported to
      date, probands diagnosed with ADNP-related HVDAS inherited a pathogenic
      variant from an unaffected parent.
    explanation: >-
      GeneReviews establishes dominant inheritance, the predominance of de novo
      variants, and the rare occurrence of inherited pathogenic variants.

    evidence_source: MODEL_ORGANISM
    snippet: "The adult Adnp-HT hippocampus shows hyperphosphorylated CaMKIIα and its substrates, including SynGAP1, and excessive long-term potentiation that is normalized by CaMKIIα inhibition."
    explanation: A mouse model links Adnp deficiency to CaMKII dysregulation and altered long-term potentiation.
  - reference: PMID:42208149
    reference_title: "An Adnp frameshift variant disrupts Wnt signalling inducing chromatocytoskeletal defects and autism-related behaviour in male mice."

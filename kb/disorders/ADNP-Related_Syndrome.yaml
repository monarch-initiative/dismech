  description: >-
    Common last-exon truncating alleles are transcribed and escape
    nonsense-mediated decay. Mutant RNA is established, but the abundance,
    stability, localization, and action of any corresponding truncated protein
    in patient tissues remain unresolved.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24531329
    reference_title: "A SWI/SNF-related autism syndrome caused by de novo mutations in ADNP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      demonstrating that the excessADNPmRNA in patients corresponds to the mRNA
      transcribed from the mutant allele.
    explanation: >-
      Allele-aware expression in patient lymphoblastoid cells demonstrates
      production of mutant transcript.
  downstream:
  - target: ADNP Chromatin-Complex Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

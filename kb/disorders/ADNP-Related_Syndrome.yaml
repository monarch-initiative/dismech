imaging_findings:
- name: Abnormal Brain MRI
  modality: MRI
  imaging_finding_term:
    preferred_term: Abnormal brain morphology
    term:
      id: HP:0012443
      label: Abnormal brain morphology
  description: >
    Among individuals who underwent brain MRI, reported abnormalities included atypical white-matter lesions, delayed myelination, cortical dysplasia or atrophy, hydrocephalus, and hippocampal hypoplasia. Perinatal hypoxic-ischemic injury was also recorded in the cohort but is not modeled as a primary ADNP mechanism.
  diagnostic: false
  frequency: FREQUENT
  evidence:
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      In this cohort, magnetic resonance imaging of the brain was performed in 75.6% of the individuals. Fifty-six percent of them appeared to have cerebral abnormalities, including atypical white matter lesions, delayed myelination, cortical dysplasia or atrophy, perinatal hypoxic ischemic encephalopathy, hydrocephalus, and hippocampal hypoplasticity (Figure 3C).
    explanation: >
      The 56% estimate applies to the 75.6% imaged subgroup, not the entire cohort; the findings are heterogeneous and not individually assigned that frequency.
- name: Developmental Brain-Structure Pattern on MRI
  modality: MRI
  imaging_finding_term:
    preferred_term: Developmental brain-structure abnormalities
  description: >
    Detailed rereview of five MRIs identified recurrent underdevelopment or simplified gyration of the frontal lobes, thin or short corpus callosum, inferior vermis hypoplasia, abnormal opercularization, ventricular dilatation, and dilated perivascular spaces. The small selected reread set does not support feature-specific population frequencies.
  diagnostic: false
  evidence:
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Magnetic resonance images of 5 individuals were studied in detail. The following abnormalities were seen in multiple individuals: underdevelopment of the frontal lobes with simplified gyral pattern of the cortex and occasional hypoplasia of the bulbus olfactorius and chiasma opticum; a thin and/or short, underdeveloped corpus callosum and inferior vermis hypoplasia; abnormal, often asymmetric opercularization of the Sylvian fissure with sometimes abnormal overlying cortex; dilatation of the lateral ventricles, mostly in the frontal areas; and dilated perivascular spaces of Virchow-Robin in the cerebral white matter (Figure 6).
    explanation: >
      This detailed imaging pattern derives from only five selected MRIs and is therefore presented without individual finding frequencies.
diagnosis:
- name: ADNP Molecular Genetic Confirmation
  description: >
    Molecular diagnosis is established by identifying a heterozygous pathogenic ADNP variant in a person with a compatible neurodevelopmental and multisystem phenotype.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: ADNP
        term:
          id: hgnc:15766
          label: ADNP
  results: A heterozygous pathogenic ADNP variant establishes molecular confirmation in a compatible clinical context.
  evidence:
  - reference: PMID:27054228
    reference_title: ADNP-Related Helsmoortel-Van der Aa Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      The diagnosis of ADNP-related HVDAS is established by identification of a heterozygous ADNP pathogenic variant by molecular genetic testing.
    explanation: >
      GeneReviews defines the molecular diagnostic criterion.
- name: Episignature-Assisted Evaluation After Negative Exome Sequencing
  description: >
    A compatible peripheral-blood DNA-methylation episignature and phenotype classifier can prioritize ADNP after unrevealing exome sequencing; whole-genome and transcriptome sequencing may then identify and confirm a non-coding splice variant. The episignature is complementary, not a standalone severity or prognostic test.
  diagnosis_term:
    preferred_term: genome-wide DNA methylation analysis
  results: A compatible episignature can trigger genome-wide variant detection and RNA confirmation of an otherwise missed non-coding ADNP allele.
  evidence:
  - reference: PMID:38424297
    reference_title: Loss-of-function of activity-dependent neuroprotective protein (ADNP) by a splice-acceptor site mutation causes Helsmoortel-Van der Aa syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Whereas exome sequencing failed to detect the non-coding deletion, genome-wide CpG methylation analysis revealed an episignature suggestive of a Helsmoortel-Van der Aa syndrome diagnosis.
    explanation: >
      A molecularly resolved case demonstrates an episignature-assisted route after negative exome sequencing.
  - reference: PMID:38424297
    reference_title: Loss-of-function of activity-dependent neuroprotective protein (ADNP) by a splice-acceptor site mutation causes Helsmoortel-Van der Aa syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      with transcriptome sequencing showing this deletion leads to skipping of exon 4.
    explanation: >
      Genome and transcriptome sequencing supplied variant-level confirmation after the screening clue.

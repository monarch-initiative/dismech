    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The protein is associated with the pericentromeric protein HP1, the SWI/SNF core complex protein BRG1, and other members of this chromatin remodeling complex and, in murine stem cells, with the chromodomain helicase CHD4 in a ChAHP complex."
    explanation: The review synthesizes ADNP membership in multiple chromatin-regulatory complexes.
  - reference: PMID:42208149
    reference_title: "An Adnp frameshift variant disrupts Wnt signalling inducing chromatocytoskeletal defects and autism-related behaviour in male mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Introduction of the 14-base pair deletion reduced cellular Adnp levels in the brain (p = 0.0008) and decreased its chromatin association (p = 0.001), parallelled by a genome-wide increase in chromatin accessibility."
    explanation: >-
      A male-mouse frameshift model directly links an Adnp allele to altered
      chromatin association and accessibility.
  downstream:

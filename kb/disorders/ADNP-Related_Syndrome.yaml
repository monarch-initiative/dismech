progression:
- phase: Infancy and early-childhood neurodevelopment
  age_range: Infancy through early childhood
  notes: >
    Hypotonia and global developmental delay are recognized early, followed by marked speech and motor delay. The disorder is developmental and multisystemic; the available evidence does not establish a uniformly progressive or neurodegenerative human course.
  evidence:
  - reference: PMID:27054228
    reference_title: ADNP-Related Helsmoortel-Van der Aa Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      is characterized by hypotonia, speech and motor delay, mild-to-severe intellectual disability, and characteristic facial features
    explanation: >
      GeneReviews defines the early neurodevelopmental presentation without describing a universal progressive course.
- phase: Variable later developmental course
  age_range: Childhood through adulthood
  notes: >
    Apparent loss of previously acquired abilities has been reported in a subset. The denominator and trajectories are insufficient to classify ADNP-related syndrome as globally regressive; long-term longitudinal follow-up remains a major evidence gap.
  evidence:
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Apparent loss of acquired abilities was reported in 12 children for skills such as speaking, counting, riding a bicycle, or being toilet trained.
    explanation: >
      The cohort documents reported skill loss in 12 children but does not supply a feature-specific assessed denominator or prove a progressive disease course.
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      The main limitation of our study is the relatively young age of our study cohort. Longterm follow-up studies are necessary to define the developmental path of individuals with a mutation in ADNP.
    explanation: >
      The authors explicitly identify long-term natural history as unresolved.
mechanistic_hypotheses:
- hypothesis_group_id: nmd_escape_truncation_branch
  hypothesis_label: NMD-Escaping Truncation Branch
  status: ALTERNATIVE
  description: >-
    Most pathogenic last-exon truncating variants escape nonsense-mediated
    decay and produce mutant transcript. Whether their downstream effect is
    functional insufficiency, dominant interference, toxic gain of function,
    or a mixture remains unresolved because mutant protein has not been
    unambiguously demonstrated in patient material.
  evidence:
  - reference: PMID:36945042
    reference_title: "Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      as many mutations cluster in the fifth and last exon and escape from NMD
      has been demonstrated, the majority of patients might still produce
      protein. Thought it needs to be mentioned that mutated protein has never
      been unambiguously demonstrated in patients, an additional gain of toxic
      function of the mutant protein, if present, could also be envisaged
    explanation: >-
      This review defines the unresolved mechanism of the common NMD-escaping
      truncation branch and explicitly separates mutant transcript from proof
      of mutant protein.
- hypothesis_group_id: allele_specific_haploinsufficiency_branch
  hypothesis_label: Allele-Specific ADNP Haploinsufficiency Branch
  status: CANONICAL
  description: >-
    True ADNP haploinsufficiency is experimentally confirmed for a non-coding
    splice-acceptor deletion that causes exon skipping and no detectable
    truncated protein. This branch is allele specific and is not generalized
    to the common last-exon truncating variants.
  evidence:
  - reference: PMID:38424297
    reference_title: "Loss-of-function of activity-dependent neuroprotective protein (ADNP) by a splice-acceptor site mutation causes Helsmoortel-Van der Aa syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An N-terminal truncated protein could not be detected in transfection
      experiments with a mutant expression vector in HEK293T cells, strongly
      suggesting this is a first confirmed diagnosis exclusively due to
      haploinsufficiency of the ADNP gene.
    explanation: >-
      The splice allele provides direct experimental support for an
      allele-specific true-null branch without establishing that mechanism for
      all pathogenic ADNP variants.

pathophysiology:
- name: Heterozygous ADNP Pathogenic Variation
  description: >-
    The initiating lesion is a heterozygous pathogenic ADNP variant. Most
    established alleles are protein-truncating and usually de novo, but their
    molecular consequences differ by position and RNA processing. This root
    therefore represents pathogenic variation without presupposing uniform
    haploinsufficiency.
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: ADNP
    term:
      id: hgnc:15766
      label: ADNP
  evidence:
  - reference: PMID:29724491
    reference_title: "Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found 46 unique mutations on the DNA level, of which 25 were nonsense
      and 21 frameshift (Supplemental Table S2). All but three mutations were
      located in the fifth and last exon of the ADNP gene and were predicted to
      escape nonsense-mediated decay.
    explanation: >-
      The 78-person cohort establishes the predominance and position of
      truncating variants while showing why a uniform null model is unsafe.
  downstream:

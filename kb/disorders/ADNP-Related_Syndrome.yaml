      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        mutant mRNA has been detected in patient-derived sample materials and
        mouse models
      explanation: >-
        Mutant RNA is established, but absence of patient-protein evidence makes
        its route to chromatin dysfunction provisional.
  - target: ADNP-EB Microtubule Dynamics Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

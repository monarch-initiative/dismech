  description: >-
    Adnp-deficient and frameshift mouse models show reduced dendritic spine
    density, altered synaptic gene expression, disrupted Camk2a/Dbn1
    interactions, abnormal CaMKII phosphorylation, and excessive long-term
    potentiation. These findings support a synaptic branch but remain
    model-derived rather than direct measurements in affected human brain.

- name: ADNP Chromatin-Complex Dysfunction
  description: >-
    ADNP participates in HP1/BRG1-associated chromatin regulation and the
    CHD4-containing ChAHP complex. Pathogenic variation can alter ADNP abundance,
    localization, chromatin association, or binding specificity, but the exact
    perturbation is allele dependent. A 2026 male-mouse frameshift model showed
    reduced chromatin association, increased accessibility, and Wnt-pathway
    downregulation; these model findings are not treated as direct human proof.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Chromatin remodeling
    term:

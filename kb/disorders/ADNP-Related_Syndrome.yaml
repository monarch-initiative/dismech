name: ADNP-Related Syndrome
creation_date: "2026-06-04T00:00:00Z"
synonyms:
- Helsmoortel-Van der Aa syndrome
- HVDAS
- ADNP syndrome
description: >-
  ADNP-related syndrome (Helsmoortel-Van der Aa syndrome; HVDAS) is an
  autosomal dominant multisystem neurodevelopmental disorder caused mainly by
  heterozygous, usually de novo, protein-truncating ADNP variants. The molecular
  consequence is allele dependent rather than uniformly haploinsufficient:
  most recurrent last-exon variants escape nonsense-mediated decay, but mutant
  protein has not been unambiguously demonstrated in patient material and the
  relative contributions of functional insufficiency, dominant interference,
  and toxic gain of function remain unresolved. A rare splice-acceptor deletion
  with no detectable truncated protein establishes that true
  haploinsufficiency can cause the syndrome. ADNP participates in chromatin
  regulatory complexes and binds microtubule end-binding proteins; disruption
  of these functions converges on altered neurodevelopmental transcription,
  neuronal differentiation, dendritic spines, and synaptic plasticity.
  Intellectual and developmental disability, marked speech and motor delay,
  autistic and other behavioral features, hypotonia, characteristic facial
  features, sleep and feeding problems, visual abnormalities, congenital
  anomalies, and premature primary-tooth eruption form a variable clinical
  spectrum. Mutation-position-dependent blood DNA-methylation episignatures
  support diagnosis and variant interpretation but are biomarkers rather than
  established causal mediators or severity predictors.

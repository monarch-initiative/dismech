animal_models:
- species: Mouse (Mus musculus)
  genotype: Complete Adnp knockout
  category: Knockout
  genes:
  - preferred_term: Adnp
    term:
      id: hgnc:15766
      label: ADNP
  associated_phenotypes:
  - Embryonic lethality
  - Failure of neural-tube closure
  description: >
    Complete Adnp deletion causes embryonic lethality around E8.5-E9.0 with failed neural-tube closure. It establishes an essential developmental function but cannot model the postnatal human syndrome.
  evidence:
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      Full knockouts, lacking the entire protein coding sequence of the Adnp gene, are embryonically lethal and die around E8.5–9.0 with failure of the neural tube closure, suggesting a role in brain development.
    explanation: >
      The complete-null mouse demonstrates an essential embryonic role and a severe model-human boundary.
- species: Mouse (Mus musculus)
  genotype: Heterozygous Adnp null allele (Adnp+/-)
  category: Heterozygous knockout
  genes:
  - preferred_term: Adnp
    term:
      id: hgnc:15766
      label: ADNP
  associated_phenotypes:
  - Reduced dendritic spine density
  - Altered synaptic gene expression
  - Cognitive and social-memory impairment
  - Gait and motor dysfunction
  description: >
    The heterozygous null model reduces Adnp RNA and protein by about 50% and shows cognitive, motor, vocalization, spine, and synaptic phenotypes. It models a true dosage-loss branch that may not represent common NMD-escaping human alleles.
  evidence:
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      These mice showed the expected 50% reduction in Adnp RNA and protein levels and exhibited cognitive deficits in the Morris water maze in adolescence and older age
    explanation: >
      The heterozygous null mouse directly models reduced dosage and cognitive phenotypes.
  - reference: PMID:30106381
    reference_title: Activity-dependent neuroprotective protein deficiency models synaptic and developmental phenotypes of autism-like syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      We discovered that Adnp deficiency reduced dendritic spine density and altered synaptic gene expression, both of which were partly ameliorated by NAP treatment.
    explanation: >
      Primary mouse work supports synaptic pathology and partial preclinical NAP rescue.
  - reference: PMID:30106381
    reference_title: Activity-dependent neuroprotective protein deficiency models synaptic and developmental phenotypes of autism-like syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      Adnp+/-mice further exhibited global developmental delays, vocalization impediments, gait and motor dysfunctions, and social and object memory impairments, all of which were partially reversed by daily NAP administration (systemic/nasal).
    explanation: >
      Primary mouse evidence supports the model's developmental, vocalization, gait, motor, social-memory, and object-memory phenotypes.
- species: Mouse (Mus musculus)
  genotype: Heterozygous Adnp p.Tyr718* knock-in (human p.Tyr719* ortholog)
  category: Knock-in
  genes:
  - preferred_term: Adnp
    term:
      id: hgnc:15766
      label: ADNP
  associated_phenotypes:
  - Delayed development
  - Sex-dependent gait and behavior
  - Altered dendritic spines
  - Tau pathology and visual-evoked-potential abnormalities
  description: >
    This recurrent-allele ortholog expresses mutant and wild-type RNA, but the predicted truncated protein was not visualized. Its phenotypes therefore do not by themselves resolve loss-of-function versus toxic-mutant action.
  evidence:
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      A truncated protein product in the mutant animals was predicted but not visualized.
    explanation: >
      Failure to visualize the predicted protein preserves the central allele-mechanism uncertainty.
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      Phenotypically, Tyr mice had delayed development and with sex-dependent gait defect and syntax abnormalities. Grooming duration and nociception threshold autistic traits were significantly affected in males. Anatomically, dendritic spine densities were reduced an morphologies altered.
    explanation: >
      The knock-in reproduces developmental, behavioral, motor, and spine phenotypes with sex dependence.
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      Early-onset tauopathy in hippocampus and visual cortex was accentuated in males and was paralleled by impaired visual evoked potentials.
    explanation: >
      The allele-matched mouse review reports male-accentuated tau pathology together with impaired visual evoked potentials.
- species: Mouse (Mus musculus)
  genotype: Heterozygous Adnp c.2463_2476del (p.Leu822Hisfs*6) frameshift
  category: Knock-in
  genes:
  - preferred_term: Adnp
    term:
      id: hgnc:15766
      label: ADNP
  associated_phenotypes:
  - Increased chromatin accessibility
  - Wnt-pathway downregulation
  - Cytoskeletal and synaptic dysfunction
  - Cognitive and autism-related behavior
  description: >
    A 2026 CRISPR frameshift model was studied only in male mice. Multi-omic and behavioral results connect chromatin, Wnt, cytoskeletal, and synaptic abnormalities, but sex restriction and the engineered allele limit direct human generalization.
  evidence:
  - reference: PMID:42208149
    reference_title: An Adnp frameshift variant disrupts Wnt signalling inducing chromatocytoskeletal defects and autism-related behaviour in male mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      Our findings demonstrate a role for Adnp in chromatin regulation and Wnt signalling, coupled to aberrant expression of cytoskeletal components and synaptic dysfunction.
    explanation: >
      The male-mouse frameshift model supports convergence across the curated mechanism nodes.

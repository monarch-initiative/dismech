discussions:
- discussion_id: gap_adnp_allele_specific_molecular_mechanism
  prompt: >
    For common NMD-escaping truncating alleles, does disease result from reduced effective ADNP function, dominant interference, toxic gain of function, or an allele-specific mixture, and how does that compare with confirmed true-null and emerging missense alleles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NMD-Escaping Mutant ADNP Transcripts
  - pathophysiology#Allele-Specific ADNP Haploinsufficiency
  - pathophysiology#ADNP Chromatin-Complex Dysfunction
  rationale: >
    Mutant RNA is demonstrable for common last-exon alleles, but mutant protein has not been unambiguously demonstrated in patients. A splice allele proves true haploinsufficiency can cause disease, while p.C687R supplies limited gain-of-function-like experimental evidence. Therapy and model selection therefore require allele-stratified mechanism.
  evidence:
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      mutations cluster in the fifth and last exon and escape from NMD has been demonstrated, the majority of patients might still produce protein. Thought it needs to be mentioned that mutated protein has never been unambiguously demonstrated in patients, an additional gain of toxic function of the mutant protein, if present, could also be envisaged
    explanation: >
      The review explicitly frames the unresolved mutant-protein question.
  - reference: PMID:41943166
    reference_title: ADNP missense variant p.C687R disrupts chromatin regulation and GABAergic differentiation in Helsmoortel-Van der Aa syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >
      Our results suggest that p.C687R may exert gain-of-function-like effects in experimental systems and underscore chromatin-mediated regulation of GABAergic lineage genes in HVDAS.
    explanation: >
      A single missense allele supplies an emerging alternative mechanism that requires replication.
  proposed_experiments:
  - experiment_id: exp_adnp_isogenic_allele_mechanism_panel
    name: Isogenic ADNP allele-mechanism panel in human neural lineages
    description: >
      Create isogenic human iPSC lines carrying representative NMD-escaping truncations, the confirmed splice-null allele, p.C687R, matched knockouts, corrected controls, and allele-specific mutant knockdown. Compare allele-specific RNA and proteomics, ADNP localization and chromatin occupancy, methylome/transcriptome states, microtubule dynamics, neuronal differentiation, dendritic spines, and synaptic physiology, with wild-type addback and mutant-selective suppression arms.
    decision_criterion: >
      Support a dominant or toxic mutant mechanism only if an NMD-escaping or missense allele produces effects exceeding matched dosage loss and those effects are preferentially rescued by mutant-selective suppression; support pure dosage loss when matched knockout and variant phenotypes align and wild-type addback rescues both.
    would_support:
    - pathophysiology#NMD-Escaping Mutant ADNP Transcripts
    - pathophysiology#Allele-Specific ADNP Haploinsufficiency
- discussion_id: mismatch_adnp_null_mouse_common_human_alleles
  prompt: >
    Which findings from heterozygous null mice translate to people with common NMD-escaping truncating variants, and which reflect a rare true-null branch or model-specific sex and background effects?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#NMD-Escaping Mutant ADNP Transcripts
  - pathophysiology#Allele-Specific ADNP Haploinsufficiency
  - pathophysiology#Dendritic Spine and Synaptic Plasticity Dysfunction
  rationale: >
    The frequently used Adnp+/- mouse deletes one allele and therefore models dosage loss, whereas most common human alleles escape NMD. Several mouse phenotypes are sex dependent, and the 2026 frameshift study tested only males.
  evidence:
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      While it is tempting to draw parallels between the clinical presentation of patients and the abnormalities observed in the mouse model, it should be stressed that the model described is a full deletion and the mutational mechanism of the Helsmoortel–Van der Aa syndrome has not been fully established.
    explanation: >
      The review explicitly identifies the null-model versus human-allele mismatch.
- discussion_id: gap_adnp_longitudinal_natural_history_and_regression
  prompt: >
    What are the age-specific developmental trajectories, true frequency and domains of regression, adult outcomes, and nonprogressive versus progressive subgroups in ADNP-related syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Global Developmental Delay
  - phenotypes#Speech Delay
  - phenotypes#Motor Delay
  rationale: >
    The main cohort was young and cross-sectional. Apparent skill loss was reported in 12 children without a feature-specific denominator, so a globally progressive or neurodegenerative label is not justified.
  evidence:
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Apparent loss of acquired abilities was reported in 12 children for skills such as speaking, counting, riding a bicycle, or being toilet trained.
    explanation: >
      Reported regression requires prospective confirmation and a defined denominator.
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      The main limitation of our study is the relatively young age of our study cohort. Longterm follow-up studies are necessary to define the developmental path of individuals with a mutation in ADNP.
    explanation: >
      The cohort authors explicitly call for longitudinal follow-up.
  proposed_experiments:
  - experiment_id: exp_adnp_longitudinal_natural_history
    name: Allele-stratified longitudinal ADNP natural-history cohort
    description: >
      Follow children and adults prospectively with standardized developmental, adaptive, speech, motor, behavioral, sleep, seizure, sensory, growth, and organ-system measures, recording acquisition and loss of individual skills and stratifying by allele position, NMD prediction, episignature group, age, and sex.
    decision_criterion: >
      Classify regression or progression only from repeated within-person decline exceeding measurement variability, with domain-specific denominators and age-specific incidence; otherwise retain a variable lifelong neurodevelopmental course.
- discussion_id: interpretation_adnp_episignature_scope
  prompt: >
    How sensitive and specific are ADNP episignatures for diagnosis and variant interpretation, and can any reproducible methylation measure predict phenotype after controlling for allele position and ascertainment?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - biochemical#Mutation-Position-Dependent Blood DNA Methylation Episignatures
  rationale: >
    Two mutation-position-dependent signatures are reproducible, but their correlation with behavioral severity is limited. Diagnostic and VUS-classification performance should be kept separate from prognosis.
  evidence:
  - reference: PMID:32758449
    reference_title: Episignatures Stratifying Helsmoortel-Van Der Aa Syndrome Show Modest Correlation with Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      We found limited phenotypic differences between the two HVDAS-affected groups and no evidence that individuals with more widespread methylation changes are more severely affected.
    explanation: >
      The replication cohort argues against using methylation extent as a severity proxy.
- discussion_id: gap_adnp_controlled_treatment_evidence
  prompt: >
    Can davunetide or ketamine improve clinically meaningful outcomes in ADNP-related syndrome, and do efficacy or safety differ across true-null, NMD-escaping, and missense allele mechanisms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Davunetide (NAP, investigational)
  - treatments#Low-Dose Ketamine (investigational)
  rationale: >
    Davunetide evidence is preclinical. Ketamine has only a small single-dose open-label study; peripheral blood transcriptional changes do not establish central target engagement, and increasing mutant ADNP could have allele-specific consequences.
  evidence:
  - reference: PMID:36119806
    reference_title: An open-label study evaluating the safety, behavioral, and electrophysiological outcomes of low-dose ketamine in children with ADNP syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Ketamine was generally well tolerated, and there were no serious adverse events.
    explanation: >
      The small open-label study informs short-term tolerability but cannot establish efficacy.
  - reference: PMID:36945042
    reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes to syndromic autism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >
      The ketamine rationale is based on the finding that ketamine increased ADNP expression, however, the possibility of ketamine increasing mutated ADNP expression needs to be further investigated
    explanation: >
      The review identifies an allele-specific safety and mechanism question.
  - reference: PMID:30106381
    reference_title: Activity-dependent neuroprotective protein deficiency models synaptic and developmental phenotypes of autism-like syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      We discovered that Adnp deficiency reduced dendritic spine density and altered synaptic gene expression, both of which were partly ameliorated by NAP treatment.
    explanation: >
      NAP rescue remains preclinical model evidence.

      Advances in ADNP methylation profiling further enhance diagnostic precision and variant interpretation in this evolving neurodevelopmental syndrome.
    explanation: >
      The 2025 systematic review supports the diagnostic and variant-interpretation role while the primary replication study constrains prognostic use.
  notes: >
    Two opposing mutation-position-dependent signatures have been replicated. Their clinical role is complementary diagnosis and variant interpretation; limited phenotype correlation argues against placing the episignature in the causal pathophysiology chain.
genetic:
- name: ADNP Pathogenic Variants
  gene_term:
    preferred_term: ADNP
    term:
      id: hgnc:15766
      label: ADNP
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    Heterozygous pathogenic ADNP variants are usually de novo and predominantly protein truncating. Most variants in the main cohort lie in the last exon and are predicted to escape NMD, so they should not be labeled uniformly haploinsufficient. Rare true-null alleles establish an allele-specific haploinsufficiency branch. Emerging missense alleles require variant-specific functional evidence and should not be generalized from a single experimental system. The recurrent p.Tyr719* allele was associated with later walking and higher pain threshold in the main cohort, but a blanket claim of globally greater severity is not retained.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:27054228
      reference_title: ADNP-Related Helsmoortel-Van der Aa Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >
        ADNP-related HVDAS is an autosomal dominant disorder. Most probands whose parents have undergone molecular genetic testing have the disorder as the result of a de novo ADNP pathogenic variant. In two families reported to date, probands diagnosed with ADNP-related HVDAS inherited a pathogenic variant from an unaffected parent.
      explanation: >
        GeneReviews supports dominant inheritance, predominantly de novo origin, and rare inherited cases.
    description: >
      ADNP-related syndrome is autosomal dominant. Most molecularly tested cases are de novo, with rare inheritance from an apparently unaffected parent.
  evidence:
  - reference: PMID:24531329
    reference_title: A SWI/SNF-related autism syndrome caused by de novo mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Here, we report ten patients with ASD and other shared clinical characteristics, including intellectual disability and facial dysmorphisms caused by a mutation in ADNP, a transcription factor involved in the SWI/SNF remodeling complex.
    explanation: >
      The founding series establishes ADNP as a causal disease gene.
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      We found 46 unique mutations on the DNA level, of which 25 were nonsense and 21 frameshift (Supplemental Table S2). All but three mutations were located in the fifth and last exon of the ADNP gene and were predicted to escape nonsense-mediated decay.
    explanation: >
      The 78-person cohort establishes the predominant truncating, last-exon allele spectrum.
  - reference: PMID:29724491
    reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations in ADNP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Sixty-eight mutations in our cohort were confirmed de novo, eight mutations were of unknown inheritance, and two C-terminal mutations were inherited.
    explanation: >
      The cohort quantifies the predominance of de novo origin while preserving inherited exceptions.
  - reference: PMID:38424297
    reference_title: Loss-of-function of activity-dependent neuroprotective protein (ADNP) by a splice-acceptor site mutation causes Helsmoortel-Van der Aa syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >
      An N-terminal truncated protein could not be detected in transfection experiments with a mutant expression vector in HEK293T cells, strongly suggesting this is a first confirmed diagnosis exclusively due to haploinsufficiency of the ADNP gene.
    explanation: >
      One splice allele establishes a true-null mechanism without generalizing it to all ADNP variants.
  - reference: PMID:41943166
    reference_title: ADNP missense variant p.C687R disrupts chromatin regulation and GABAergic differentiation in Helsmoortel-Van der Aa syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >
      This study is based on a single patient-derived line in combination with complementary experimental models. In the heterozygous endogenous context, distinguishing increased functional activity from dosage-related effects requires further investigation.
    explanation: >
      The p.C687R study supplies emerging variant-specific evidence while explicitly limiting broader missense interpretation.

- name: Corticomedullary-Junction Leukoencephalopathy
  biological_scale: TISSUE
  role: effector
  description: >-
    NIID produces a distinctive leukoencephalopathy whose radiologic signature is high
    signal intensity along the corticomedullary junction on diffusion-weighted MRI. In a
    57-case adult-onset series this finding was present in both sporadic and familial
    cases and in all dementia-dominant cases, and it is the single strongest imaging clue
    to the diagnosis. NIID therefore belongs in the differential diagnosis of adult
    leukoencephalopathy.
  downstream:
  - target: Multisystem Neurological Decline
    causal_link_type: DIRECT
    description: >-
      White-matter disruption contributes to the dementia-dominant cognitive phenotype.
  evidence:
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Head magnetic resonance imaging showed high intensity signal in corticomedullary junction in diffusion-weighted image in both sporadic and familial NIID cases, a strong clue to the diagnosis."
    explanation: Establishes the corticomedullary-junction DWI hyperintensity as the characteristic imaging finding.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the dementia dominant cases presented with this type of leukoencephalopathy on head magnetic resonance imaging."
    explanation: Links the leukoencephalopathy to the dementia-dominant clinical subgroup.
- name: Peripheral and Autonomic Nerve Involvement
  biological_scale: TISSUE
  role: effector
  description: >-
    Inclusions are present in peripheral and autonomic neurons, and nerve conduction
    studies are frequently abnormal in both sporadic and familial NIID, alongside
    elevated cerebrospinal fluid protein. Clinically this arm produces sensory
    disturbance, muscle weakness, miosis, and bladder dysfunction.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  downstream:
  - target: Multisystem Neurological Decline
    causal_link_type: DIRECT
    description: >-
      Peripheral and autonomic involvement contributes weakness, sensory loss, miosis,
      and bladder dysfunction to the clinical syndrome.
  evidence:
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated cerebrospinal fluid protein and abnormal nerve conduction were frequently observed in both sporadic and familial NIID cases."
    explanation: Documents frequent nerve-conduction abnormality and raised CSF protein as evidence of peripheral nerve involvement.
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eosinophilic intranuclear inclusion bodies in the nuclei of neurons in the central, peripheral, and autonomic nervous systems"
    explanation: Confirms that the inclusion pathology extends to peripheral and autonomic neurons.
- name: Multisystem Neurological Decline
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The clinical endpoint is a slowly progressive, highly heterogeneous multisystem
    neurological syndrome. Two clinicopathologically defined presentations recur: a
    dementia-dominant group (sporadic, later onset, with miosis, ataxia, and episodes of
    unconsciousness) and a limb-weakness-dominant group (familial, onset before 40, with
    sensory disturbance, miosis, and bladder dysfunction). Episodic features — headache,
    fever, altered consciousness, and seizures — punctuate the course and are a frequent
    source of misdiagnosis.
  evidence:
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the sporadic NIID cases with onset age from 51 to 76, dementia was the most prominent initial symptom (94.7%) as designated 'dementia dominant group', followed by miosis, ataxia and unconsciousness."
    explanation: Defines the dementia-dominant sporadic presentation and its component features.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."

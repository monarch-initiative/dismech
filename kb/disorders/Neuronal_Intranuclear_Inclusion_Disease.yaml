genetic:
- name: NOTCH2NLC
  gene_term:
    preferred_term: NOTCH2NLC
    term:
      id: hgnc:53924
      label: NOTCH2NLC
  association: Expanded GGC trinucleotide repeat in the 5'UTR (noncoding 5' region)
  presence: Positive
  notes: >-
    NIID is caused by an expanded GGC (CGG) trinucleotide repeat in the 5'
    region/5'UTR of the human-specific gene NOTCH2NLC (MIM 618025), which arose
    by segmental duplication of NOTCH2. Unaffected individuals carry short
    repeats, whereas affected individuals carry large expansions. The expansion
    is thought to act by a toxic gain of function (RAN translation of a
    polyglycine product and abnormal antisense transcription). The same
    NOTCH2NLC expansion underlies a broader "NIID-related disorder" spectrum,
    with alleles also detected in some families presenting as Alzheimer disease
    or parkinsonism.
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the identification of an expanded GGC repeat in NOTCH2NLC
      (MIM: 618025) via long-read genome sequencing (LRS) in a five-generation
      Chinese Han NIID family
    explanation: Identifies the NOTCH2NLC GGC repeat expansion as the causal variant.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we directly searched for repeat expansion mutations and identified
      noncoding CGG repeat expansions in NBPF19 (NOTCH2NLC) as the causative
      mutations for NIID.
    explanation: Confirms the noncoding NOTCH2NLC repeat expansion as causative.

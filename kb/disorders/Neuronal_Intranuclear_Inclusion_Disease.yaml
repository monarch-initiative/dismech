mappings:
  ncit_mappings:
  - term:
      id: NCIT:C122655
      label: Neuronal Intranuclear Inclusion Disease
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO:0011327
    mapping_justification: >-
      MONDO:0011327 lists NCIT:C122655 as a cross-reference and the two terms denote the
      same disease entity. The NCIT definition is dated in one respect — it describes NIID
      as "usually affects children", which predates the recognition (PMID:27797808) that
      adult-onset disease dominates the ascertained population once skin biopsy is used —
      but the entity is the same, so the mapping is exact rather than close.
notes: >-
  Scope and boundary notes. (1) NIID is a polyGLYCINE disease driven by a NON-coding
  GGC/CGG repeat translated from an upstream ORF; it deliberately does NOT declare
  conformance to the `polyglutamine_expansion_proteotoxicity` module, which is explicitly
  scoped to translated CAG/polyQ disorders. (2) The same NOTCH2NLC repeat expansion also
  causes oculopharyngodistal myopathy type 3 (see the `Oculopharyngodistal Myopathy`
  entry, which cross-references NIID); the determinants of the NIID-versus-OPDM3
  phenotypic split are unresolved and are captured as a knowledge gap below. (3) A
  conformance edge to `peripheral_axonal_degeneration` is a plausible follow-up for the
  peripheral-nerve arm, but the currently cited evidence (frequent nerve-conduction
  abnormality) does not by itself establish the distal axonal-degeneration/demyelination
  chain, so it is not asserted here. (4) There is no disease-modifying therapy; the
  triggering case report (PMID:42428984) discusses potential therapeutic implications
  only and is cited for clinical/diagnostic description, never as sole support for a
  mechanistic claim.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Familial NIID segregates as an autosomal dominant trait: linkage analysis in large
    multiplex families mapped the locus to chromosome 1p, and the NOTCH2NLC GGC repeat
    expansion was found in all affected members of those families.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By long-read sequencing, we identified a GGC repeat expansion in the 5' region of NOTCH2NLC (Notch 2 N-terminal like C) in all affected family members."
    explanation: Co-segregation of the expansion with affected status in a large multiplex family supports dominant transmission of familial NIID.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we have performed genetic linkage analysis and mapped the disease locus to 1p13.3-q23.1"
    explanation: >-
      Supports a single Mendelian locus for familial NIID at 1p13.3-q23.1 (the NOTCH2NLC
      region). Note that linkage mapping alone does not establish the mode of inheritance;
      dominance rests on the co-segregation evidence in the item above and on the
      pedigrees in this same study.
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most reported NIID cases are sporadic rather than familial, although the same GGC
    repeat expansion is found in sporadic cases; sporadic and familial cases differ
    systematically in age at onset and in dominant clinical presentation.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average onset age is 59.7 years among approximately 140 NIID cases consisting of mostly sporadic and several familial cases."
    explanation: Documents that the reported NIID case series is composed mostly of sporadic cases.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestation of NIID varies widely, and both familial and sporadic cases have been reported."
    explanation: Confirms that NIID occurs in both familial and sporadic forms.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_un2cpolyg_proteotoxicity_model
  hypothesis_label: Canonical uORF-Translated Polyglycine (uN2CpolyG) Proteotoxicity Model
  status: CANONICAL
  description: >-
    The dominant model holds that the pathogenic species in NIID is a protein, not the
    RNA. The expanded GGC repeat lies within a small upstream open reading frame (uN2C)
    in the NOTCH2NLC 5' UTR; translation through the expanded repeat produces a
    polyglycine-containing protein, uN2CpolyG, which misfolds, accumulates in the
    nucleus, and forms the eosinophilic ubiquitin-positive intranuclear inclusions that
    define the disease. Expression of uN2CpolyG alone is sufficient to cause inclusion
    formation, neuronal loss, locomotor impairment, and premature death in mice, which is
    the key causal (rather than merely correlative) evidence for this arm. The model is
    directly parallel to FMRpolyG in FXTAS and defines a class of polyG diseases.
  evidence:
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that these repeats are embedded in a small upstream open reading frame (uORF) (uN2C), resulting in their translation into a polyglycine-containing protein, uN2CpolyG."
    explanation: Establishes the uORF-translation route from the expanded GGC repeat to the polyglycine protein that is the proposed pathogenic species.
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, expression of uN2CpolyG in mice leads to locomotor alterations, neuronal cell loss, and premature death of the animals."
    explanation: Mouse expression of the polyglycine protein alone reproduces neurodegeneration, supporting a causal rather than epiphenomenal role.
- hypothesis_group_id: repeat_rna_gain_of_function_model
  hypothesis_label: Expanded-Repeat RNA Gain-of-Function Model
  status: ALTERNATIVE
  description: >-
    A non-exclusive alternative arm proposes that the expanded GGC/CGG repeat is also
    pathogenic at the RNA level, as it is in other non-coding repeat expansion disorders
    (FXTAS, myotonic dystrophy): expanded-repeat sense and antisense transcripts
    accumulate and may sequester RNA-binding proteins. Patient-derived fibroblasts show
    abnormal antisense transcripts that are absent from unaffected individuals, and the
    disease gene was found by explicitly reasoning from the clinical and neuroimaging
    similarity to FMR1 CGG-repeat FXTAS. A necessary precondition for this arm is
    satisfied: the expanded repeat is not hypermethylated even above 200 repeats and
    NOTCH2NLC expression is unchanged in carriers, so — unlike full-mutation FMR1 — the
    locus is not silenced and repeat-containing transcript continues to be made. That is
    permissive, not demonstrative: it shows the substrate exists without showing it is
    toxic. The relative contribution of RNA toxicity versus uN2CpolyG proteotoxicity in
    human NIID brain is not resolved.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed abnormal anti-sense transcripts in fibroblasts specifically from patients but not unaffected individuals."
    explanation: Patient-specific abnormal antisense transcripts are the primary evidence offered for an RNA-level arm of NIID pathogenesis.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inspired by the striking similarities in the clinical and neuroimaging findings between neuronal intranuclear inclusion disease (NIID) and fragile X tremor/ataxia syndrome caused by noncoding CGG repeat expansions in FMR1"
    explanation: The clinical/radiologic parallel to FXTAS, itself a canonical non-coding repeat RNA gain-of-function disorder, motivates the RNA-toxicity arm.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the expanded GGC repeat does not alter the expression of NOTCH2NLC and that the GGC repeat RNA could potentially play a role in the molecular pathogenesis of NIID"
    explanation: PARTIAL — unchanged expression of the unmethylated expanded allele establishes that repeat-containing RNA is still produced (a precondition for RNA toxicity) but does not demonstrate that the RNA is itself pathogenic; the authors state it only as a possibility.
pathophysiology:
- name: NOTCH2NLC 5' UTR GGC Repeat Expansion
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is an expanded non-coding GGC (CGG) trinucleotide repeat in the
    5' region of NOTCH2NLC, a human-specific gene that arose by segmental duplication of
    NOTCH2. The expansion was identified independently by two long-read-sequencing
    studies and by a targeted repeat search, in familial and sporadic NIID alike. Because
    the repeat is non-coding, the mechanism is not loss of NOTCH2NLC function but a
    gain-of-function acting through the expanded repeat itself.
  gene:
    preferred_term: NOTCH2NLC
    modifier: ABNORMAL
    term:
      id: hgnc:53924
      label: NOTCH2NLC
  downstream:
  - target: uORF Translation of the Polyglycine Protein uN2CpolyG
    causal_link_type: DIRECT
    description: >-
      The expanded repeat lies within an upstream open reading frame and is translated
      through, generating the polyglycine protein.
    hypothesis_groups:
    - canonical_un2cpolyg_proteotoxicity_model
  - target: Expanded-Repeat Transcript Accumulation
    causal_link_type: DIRECT
    description: >-
      Transcription across the expanded repeat yields abnormal sense and antisense
      repeat-containing transcripts.
    hypothesis_groups:
    - repeat_rna_gain_of_function_model
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work shows that repeat expansion in human-specific NOTCH2NLC, a gene that evolved by segmental duplication, causes a human disease."
    explanation: Establishes the NOTCH2NLC GGC repeat expansion as the causal lesion of NIID.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We then performed long-read genome sequencing and identified a large GGC repeat expansion within human-specific NOTCH2NLC."
    explanation: Independent replication of the causal repeat expansion in a separate NIID cohort.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we directly searched for repeat expansion mutations and identified noncoding CGG repeat expansions in NBPF19 (NOTCH2NLC) as the causative mutations for NIID"
    explanation: Third independent identification of the non-coding repeat expansion as the NIID mutation.
- name: uORF Translation of the Polyglycine Protein uN2CpolyG
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    The expanded GGC repeat is embedded in a small upstream open reading frame (uN2C) in
    the NOTCH2NLC 5' UTR. Translation of that uORF reads through the expanded repeat and
    produces uN2CpolyG, a protein carrying a long polyglycine tract. This is the same
    class of event as RAN/uORF translation of FMRpolyG from the FMR1 CGG premutation in
    FXTAS, and it is what makes NIID a polyglycine rather than a polyglutamine disease.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: ABNORMAL
  downstream:
  - target: Eosinophilic Ubiquitin-Positive Intranuclear Inclusion Formation
    causal_link_type: DIRECT
    description: >-
      uN2CpolyG accumulates in the nucleus and is a constituent of the intranuclear
      inclusions.
    hypothesis_groups:
    - canonical_un2cpolyg_proteotoxicity_model
  evidence:
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that these repeats are embedded in a small upstream open reading frame (uORF) (uN2C), resulting in their translation into a polyglycine-containing protein, uN2CpolyG."
    explanation: Directly demonstrates uORF translation of the expanded repeat into the polyglycine protein.
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NIID is caused by an expansion of GGC repeats in the 5' UTR of the NOTCH2NLC (N2C) gene."
    explanation: Confirms the 5' UTR location of the expansion that places it within the upstream ORF.
- name: Expanded-Repeat Transcript Accumulation
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    Transcription across the expanded repeat produces abnormal repeat-containing
    transcripts, including antisense transcripts detectable in patient fibroblasts but
    not in cells from unaffected individuals. By analogy with FXTAS and other non-coding
    repeat expansion disorders, such transcripts are candidate mediators of an RNA
    gain-of-function arm; their contribution in human NIID brain remains unquantified.
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: ABNORMAL
  downstream:
  - target: Eosinophilic Ubiquitin-Positive Intranuclear Inclusion Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Postulated RNA-mediated route to nuclear inclusion pathology, by analogy with
      RNA-binding-protein sequestration in other non-coding repeat expansion disorders.
    hypothesis_groups:
    - repeat_rna_gain_of_function_model
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed abnormal anti-sense transcripts in fibroblasts specifically from patients but not unaffected individuals."
    explanation: Demonstrates patient-specific abnormal antisense transcripts arising from the expanded locus.
- name: Eosinophilic Ubiquitin-Positive Intranuclear Inclusion Formation
  biological_scale: CELLULAR
  role: effector
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    The defining pathological lesion is an eosinophilic, hyaline, ubiquitin- and
    SUMO1-positive intranuclear inclusion. NIID is a systemic inclusion-body disease:
    inclusions occur in neurons and glia of the central, peripheral, and autonomic
    nervous systems, in visceral organs, and in somatic cells of the skin — adipocytes,
    fibroblasts, and sweat gland cells — where they are ultrastructurally identical to
    those in neurons. This node conforms to the conserved misfolded-protein aggregation
    step of the proteostasis module, substituting uN2CpolyG as the aggregating species
    and the widely distributed neuronal, glial, and somatic cells as the affected
    populations.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002551
      label: fibroblast of dermis
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: sweat gland epithelial cell
    term:
      id: CL:1000448
      label: epithelial cell of sweat gland
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  downstream:
  - target: Progressive Neuronal Dysfunction and Loss
    causal_link_type: DIRECT
    description: >-
      Nuclear accumulation of the polyglycine protein is proteotoxic to long-lived
      postmitotic neurons.
    hypothesis_groups:
    - canonical_un2cpolyg_proteotoxicity_model
  evidence:
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In NIID skin biopsy samples, intranuclear inclusions were observed in adipocytes, fibroblasts, and sweat gland cells."
    explanation: Establishes the somatic (skin) cell types carrying the inclusions.
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These inclusions were stained with both anti-ubiquitin and anti-SUMO1 antibodies."
    explanation: Documents the ubiquitin/SUMO1 immunoprofile of the inclusions.
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy revealed that the features of the intranuclear inclusions in adipocytes, fibroblasts, and sweat gland cells were identical to those of neuronal cells."
    explanation: Shows the somatic and neuronal inclusions are the same lesion, supporting a single systemic aggregation process.
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This protein accumulates in intranuclear inclusions in cell and mouse models and in tissue samples of individuals with NIID."
    explanation: Identifies uN2CpolyG as a component of the inclusions in patient tissue, linking the aggregating species to the lesion.
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuronal intranuclear inclusion disease (NIID) is a chronic progressive neurodegenerative disorder characterized by the formation of eosinophilic intranuclear inclusion bodies in the nuclei of neurons in the central, peripheral, and autonomic nervous systems, as well as visceral organs."
    explanation: Confirms the multisystem anatomical distribution of the inclusions.
- name: Progressive Neuronal Dysfunction and Loss
  biological_scale: CELLULAR
  role: effector
  description: >-
    Proteotoxic nuclear accumulation of uN2CpolyG produces progressive neuronal
    dysfunction and neuronal loss. The strongest causal evidence is from mouse models
    expressing uN2CpolyG, which develop neuronal cell loss, locomotor impairment, and
    premature death; the corresponding human evidence is the slowly progressive
    neurodegenerative course.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

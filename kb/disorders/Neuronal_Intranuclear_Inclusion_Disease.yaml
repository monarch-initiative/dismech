genetic:
- name: NOTCH2NLC
  gene_term:
    preferred_term: NOTCH2NLC
    term:
      id: hgnc:53924
      label: NOTCH2NLC
  association: Causative non-coding GGC (CGG) repeat expansion in the 5' region/5' UTR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NOTCH2NLC is a human-specific gene generated by segmental duplication of NOTCH2. The
    NIID mutation is an expanded non-coding GGC/CGG repeat in its 5' region, discovered
    independently by long-read sequencing in two NIID cohorts and by a targeted repeat
    search. Because the repeat is non-coding and lies within an upstream ORF,
    pathogenicity is a gain of function (polyglycine protein production and possible RNA
    toxicity), not NOTCH2NLC haploinsufficiency. Two observations reinforce that reading
    and bear on the two curated mechanistic arms: unlike the FMR1 CGG repeat, NOTCH2NLC
    alleles exceeding 200 repeats are NOT hypermethylated, and NOTCH2NLC expression in
    carrier blood is unchanged — so the locus is neither silenced nor transcriptionally
    upregulated, and the expanded repeat continues to be transcribed and thus available
    both for uORF translation and for RNA-level effects. The same expanded repeat also
    causes oculopharyngodistal myopathy type 3, and has been found in families ascertained
    for parkinsonism and Alzheimer disease.
  variants:
  - name: NOTCH2NLC 5' region GGC repeat expansion
    description: >-
      Expansion of the non-coding GGC (CGG) trinucleotide repeat in the 5' region/5' UTR
      of NOTCH2NLC, above the normal repeat-length range. The expanded repeat is embedded
      in the uN2C upstream open reading frame and is translated into the polyglycine
      protein uN2CpolyG. Reported allele sizes in affected individuals span 66-517
      repeats, against a control distribution of 5-38 (usually under 40) repeats in 211
      healthy subjects. Repeat length shows no clear association with severity or age at
      onset, though it tracks loosely with presenting subgroup in the discovery cohort
      (muscle-weakness-dominant 118-517, dementia-dominant 91-268, parkinsonism-dominant
      66-102) — which is why the genotype-phenotype relationship is curated below as an
      open knowledge gap rather than as a rule.
    gene:
      preferred_term: NOTCH2NLC
      term:
        id: hgnc:53924
        label: NOTCH2NLC
    type: trinucleotide repeat expansion
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we found similar expansions in 8 unrelated families with NIID and 40 sporadic NIID cases."
    explanation: Establishes the expansion across multiple unrelated families and a large sporadic case series.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expanded GGC repeats as the cause of NIID was further confirmed in an additional three NIID-affected families as well as five sporadic NIID-affected case subjects."
    explanation: Independent confirmation of the causal expansion in additional familial and sporadic NIID cases.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified similar noncoding CGG repeat expansions in two other diseases: oculopharyngeal myopathy with leukoencephalopathy and oculopharyngodistal myopathy, in LOC642361/NUTM2B-AS1 and LRP12, respectively"
    explanation: Places the NIID expansion within a family of non-coding CGG repeat disorders sharing a repeat motif across different host genes.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a wide range (66-517) of repeat numbers were observed in affected individuals, while control subjects have fewer than 40 repeats"
    explanation: Provides the affected and control repeat-length ranges quoted in the variant description.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is no apparent association between GGC repeat size and the severity or the onset age in NIID"
    explanation: Establishes that repeat length alone is not prognostic, which is the substance of the curated genotype-phenotype knowledge gap.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "many expanded alleles associated with NIID-affected individuals exceeded 200 repeats but were not methylated"
    explanation: Supports the statement that, unlike FMR1, the expanded NOTCH2NLC repeat is not hypermethylated and the locus is therefore not transcriptionally silenced.

name: Neuronal Intranuclear Inclusion Disease
creation_date: "2026-07-11T12:00:00Z"
category: Mendelian
parents:
- Trinucleotide Repeat Disorder
- Neurodegenerative Disease
synonyms:
- NIID
- neuronal intranuclear hyaline inclusion disease
- Intranuclear inclusion body disease
- NIID-related disorders
- NIIDRD
description: >-
  Neuronal intranuclear inclusion disease (NIID) is a slowly progressive, multisystem
  neurodegenerative disorder defined pathologically by eosinophilic, ubiquitin- and
  SUMO1-positive intranuclear inclusions in neurons and glia throughout the central,
  peripheral, and autonomic nervous systems and also in visceral and somatic cells
  (adipocytes, dermal fibroblasts, sweat gland cells). It is caused by a non-coding GGC
  repeat expansion in the 5' region of the human-specific gene NOTCH2NLC. The expanded
  repeat sits inside a small upstream open reading frame and is translated into a toxic
  polyglycine protein, uN2CpolyG, which accumulates in the inclusions — placing NIID in
  the "polyG diseases" alongside FXTAS (FMRpolyG) rather than in the translated
  CAG/polyglutamine family. Clinical expression is strikingly heterogeneous: adult
  sporadic disease is usually dementia-dominant with miosis, ataxia, and episodes of
  unconsciousness, whereas early-onset familial disease is usually limb-weakness-dominant
  with sensory disturbance and bladder dysfunction. The radiologic hallmark — high
  signal at the corticomedullary junction on diffusion-weighted MRI — together with skin
  biopsy has converted NIID from a post-mortem diagnosis into an antemortem one, and the
  disease is now thought to be substantially underdiagnosed.
disease_term:
  preferred_term: Neuronal Intranuclear Inclusion Disease

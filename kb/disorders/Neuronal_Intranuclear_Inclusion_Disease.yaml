diagnosis:
- name: Skin biopsy
  description: >-
    Because eosinophilic intranuclear inclusions are present in dermal cells,
    skin biopsy demonstrating p62/ubiquitin-positive intranuclear inclusions has
    become a minimally invasive, ante-mortem confirmatory test for NIID,
    supplanting the historical requirement for post-mortem brain examination.
  diagnosis_term:
    preferred_term: biopsy of skin
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      skin biopsy has become a useful tool to confirm NIID diagnosis
    explanation: >-
      Skin biopsy detecting dermal intranuclear inclusions is an established
      confirmatory diagnostic test for NIID.
- name: Diffusion-weighted brain MRI
  description: >-
    A symmetrical high-intensity signal at the corticomedullary junction on
    diffusion-weighted imaging (DWI) is a characteristic neuroimaging finding
    used to screen for and raise suspicion of NIID, although it is absent in a
    substantial minority of molecularly confirmed cases.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical symmetrical high signal seen in corticomedullary junctions
      using diffusion weighted imaging (DWI) could be a powerful tool for
      screening NIID-affected case subjects.
    explanation: >-
      The symmetrical corticomedullary-junction DWI hyperintensity is a hallmark
      imaging screening finding for NIID.
- name: NOTCH2NLC GGC-repeat testing
  description: >-
    Targeted molecular testing for the expanded GGC repeat in the 5' region of
    NOTCH2NLC (by repeat-primed and GC-rich PCR or long-read sequencing) is the
    confirmatory genetic test and is more sensitive than MRI, since only ~37% of
    affected individuals show the typical radiological features.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic testing for the expanded GGC repeat could potentially be a more
      sensitive and accurate screening tool for NIIDRD.
    explanation: >-
      NOTCH2NLC GGC-repeat molecular testing is the sensitive, confirmatory
      genetic diagnostic for NIID and the broader NIID-related disorder spectrum.
notes: >-
  Diagnosis rests on skin biopsy demonstrating eosinophilic,
  p62/ubiquitin-positive intranuclear inclusions in dermal cells, the
  characteristic symmetrical corticomedullary-junction high-intensity signal
  on diffusion-weighted MRI, and confirmatory NOTCH2NLC GGC-repeat testing. NIID sits within
  a broader spectrum of NOTCH2NLC GGC-repeat "NIID-related disorders" that can
  also present clinically as leukoencephalopathy, parkinsonism, dementia, or
  peripheral neuropathy.

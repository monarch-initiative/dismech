inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Familial NIID segregates as an autosomal dominant repeat-expansion disorder,
    with the expanded NOTCH2NLC GGC repeat cosegregating with disease in
    affected family members. The large majority of ascertained cases are
    sporadic, reflecting both de novo/underascertained transmission and the
    late, variable onset of the disease.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By long-read sequencing, we identified a GGC repeat expansion in the 5'
      region of NOTCH2NLC (Notch 2 N-terminal like C) in all affected family
      members.
    explanation: >-
      The expanded NOTCH2NLC GGC repeat cosegregates with disease across
      affected members of an NIID pedigree, supporting autosomal dominant
      transmission.
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average onset age is 59.7 years among approximately 140 NIID cases
      consisting of mostly sporadic and several familial cases.
    explanation: >-
      Documents that ascertained NIID is predominantly sporadic with a minority
      of familial cases.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Historically regarded as very rare, with only tens of autopsy-confirmed
    cases before skin biopsy and NOTCH2NLC testing became available. The
    average onset age is approximately 59.7 years across roughly 140 reported
    cases, most of them sporadic. Wider molecular screening has since shown that
    NIID (and the broader NIID-related disorder spectrum) is more prevalent than
    the older post-mortem literature suggested.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average onset age is 59.7 years among approximately 140 NIID cases
      consisting of mostly sporadic and several familial cases.
    explanation: >-
      Provides the approximate reported case count and mean onset age framing
      NIID as a rare, adult-onset disorder.
progression:
- phase: Onset
  age_range: Typically adulthood (mean ~59.7 years); infantile and juvenile forms also described
  notes: >-
    NIID onset age varies widely and is classically divided into infantile,
    juvenile, and adult forms. Adult-onset disease is the most frequently
    ascertained and typically presents in the fifth to seventh decades.
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset age of NIID varies widely and can be divided into three
      subgroups according to the age of onset: infant form, juvenile form, and
      adult form.
    explanation: Establishes the recognized age-of-onset subgrouping of NIID.
- phase: Manifest disease
  age_range: Adult
  notes: >-
    Chronic, progressive multisystem neurodegeneration. Depending on the
    dominant clinical axis (dementia-dominant vs limb-weakness-dominant),
    patients accumulate cognitive, movement, peripheral nerve, and autonomic
    disability, often punctuated by episodic encephalopathy.
  evidence:
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuronal intranuclear inclusion disease (NIID) is a chronic progressive
      neurodegenerative disorder characterized by the formation of eosinophilic
      intranuclear inclusion bodies in the nuclei of neurons in the central,
      peripheral, and autonomic nervous systems, as well as visceral organs.
    explanation: Summarizes the chronic progressive multisystem natural history.
pathophysiology:
- name: NOTCH2NLC 5'UTR GGC repeat expansion
  description: >-
    The primary molecular lesion is an expanded GGC trinucleotide repeat in the
    5' region (5'UTR) of NOTCH2NLC, a human-specific gene that arose by
    segmental duplication of NOTCH2. The expanded allele confers a toxic gain of
    function: it drives repeat-associated non-AUG (RAN) translation of a
    polyglycine-containing product and generates abnormal antisense transcripts
    detectable in patient fibroblasts, seeding downstream inclusion formation.
  role: driver
  genes:
  - preferred_term: NOTCH2NLC
    term:
      id: hgnc:53924
      label: NOTCH2NLC
  biological_processes:
  - preferred_term: repeat-associated (RAN) translation of the expanded GGC repeat
    term:
      id: GO:0006412
      label: translation
    modifier: ABNORMAL
  downstream:
  - target: Eosinophilic intranuclear inclusion formation
    description: >-
      The expanded NOTCH2NLC GGC repeat and its aberrant translation products
      drive accumulation of misfolded protein into intranuclear inclusions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31178126
      reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        their skin biopsies revealed typical eosinophilic, p62-positive, and
        ubiquitin-positive intranuclear inclusions, the pathological feature
        associated with classic NIID-affected individuals
      explanation: >-
        NOTCH2NLC GGC-repeat-expansion carriers exhibit the characteristic
        eosinophilic, p62/ubiquitin-positive intranuclear inclusions, tying the
        expansion directly to intranuclear inclusion formation rather than to
        general disease causation.
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By long-read sequencing, we identified a GGC repeat expansion in the 5'
      region of NOTCH2NLC (Notch 2 N-terminal like C) in all affected family
      members.
    explanation: Identifies the 5' NOTCH2NLC GGC repeat expansion as the driver lesion.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we directly searched for repeat expansion mutations and identified
      noncoding CGG repeat expansions in NBPF19 (NOTCH2NLC) as the causative
      mutations for NIID.
    explanation: Independent identification of the noncoding NOTCH2NLC repeat expansion as causative for NIID.
- name: Eosinophilic intranuclear inclusion formation
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Misfolded protein derived from the expanded repeat self-associates into
    eosinophilic hyaline intranuclear inclusions. These inclusions are
    immunoreactive for ubiquitin and ubiquitin-related proteins including p62,
    SUMO1, FUS, MYO6, and OPTN, implicating overwhelmed nuclear proteostasis
    (ubiquitin-proteasome and autophagy) machinery. The inclusions are present
    not only in central, peripheral, and autonomic neurons but also in dermal
    and visceral somatic cells, which is the basis for skin-biopsy diagnosis.
  role: effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
    modifier: INCREASED
  downstream:
  - target: Multisystem neurodegeneration and clinical manifestations
    description: >-
      Accumulating intranuclear inclusions and proteotoxic stress in
      postmitotic neurons drive progressive neuronal dysfunction and the
      multisystem clinical phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31178126
      reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Considering the wide range in distribution of intranuclear inclusions
        in the nervous system and other organs, it is possible that there are
        additional phenotypes of NIID.
      explanation: >-
        Links the wide anatomical distribution of intranuclear inclusions to the
        multisystem clinical spectrum of NIID.
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the intranuclear inclusions are positive for ubiquitin and ubiquitin
      related proteins, including p62, SUMO1, FUS, MYO6, and OPTN-C proteins
    explanation: >-
      Defines the ubiquitin/p62-positive immunohistochemical signature of the
      intranuclear inclusions, implicating proteostasis failure.
- name: Multisystem neurodegeneration and clinical manifestations
  conforms_to: "loss_of_proteostasis#Proteotoxic Cell Dysfunction and Neurodegeneration"
  description: >-
    Proteotoxic burden in long-lived postmitotic neurons of the central,
    peripheral, and autonomic nervous systems produces the heterogeneous,
    progressive clinical syndrome: dementia and episodic encephalopathy,
    parkinsonism and cerebellar ataxia, peripheral neuropathy, and autonomic
    failure. White-matter involvement manifests as the characteristic
    diffusion-weighted corticomedullary-junction hyperintensity and FLAIR
    leukoencephalopathy.
  role: consequence
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical symmetrical high signal seen in corticomedullary junctions
      using diffusion weighted imaging (DWI) could be a powerful tool for
      screening NIID-affected case subjects.
    explanation: >-
      Captures the hallmark neuroimaging correlate of NIID white-matter
      neurodegeneration.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal and glial injury is accompanied by the characteristic white-matter
      abnormality at the corticomedullary junction.
  - target: Peripheral and Autonomic Nerve Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inclusion-bearing peripheral and autonomic neurons develop conduction abnormality
      and clinical neuropathy.
  - target: Multisystem Neurological Decline
    causal_link_type: DIRECT
    description: >-

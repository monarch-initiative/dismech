histopathology:
- name: Eosinophilic hyaline intranuclear inclusions
  description: >-
    The diagnostic lesion is an eosinophilic hyaline intranuclear inclusion that is
    ubiquitin- and SUMO1-immunoreactive. It is found in neurons and glia and, critically
    for antemortem diagnosis, in skin adipocytes, fibroblasts, and sweat gland cells,
    where roughly 10% of adipocytes carry inclusions and where they are
    ultrastructurally identical to the neuronal inclusions. Inclusions are absent from
    normal controls and from patients with other neurological diseases.
  evidence:
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 10% of adipocytes showed intranuclear inclusions."
    explanation: Quantifies the inclusion burden in skin adipocytes, the basis of the skin-biopsy test.
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No intranuclear inclusions were identified in the skin samples from normal control subjects and patients with other neurologic diseases."
    explanation: Establishes the specificity of the skin inclusion finding against controls and other neurological disease.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "based on the presence of characteristic eosinophilic, hyaline and ubiquitin-positive intanuclear inclusion"
    explanation: States the histopathological diagnostic criterion used to define adult-onset NIID cases.

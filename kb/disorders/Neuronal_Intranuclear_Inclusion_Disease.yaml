name: Neuronal intranuclear inclusion disease
creation_date: "2026-07-11T12:00:00Z"
category: Mendelian
synonyms:
- NIID
- Neuronal intranuclear hyaline inclusion disease
- Intranuclear inclusion body disease
- NIID-related disorders
- NIIDRD
description: >-
  Neuronal intranuclear inclusion disease (NIID) is a slowly progressive,
  multisystem neurodegenerative disorder defined by eosinophilic, ubiquitin- and
  p62-positive hyaline intranuclear inclusions in neurons and in somatic
  (including visceral) cells. It is caused by an expanded GGC trinucleotide
  repeat in the 5' region (5'UTR) of the human-specific gene NOTCH2NLC. The
  clinical picture is strikingly heterogeneous and age-dependent, spanning
  dementia, episodic encephalopathy, parkinsonism, cerebellar ataxia,
  peripheral neuropathy, autonomic dysfunction (including miosis and bladder
  dysfunction), and seizures, which makes ante-mortem diagnosis difficult. Skin
  biopsy demonstrating intranuclear inclusions in dermal cells, together with a
  characteristic symmetrical corticomedullary-junction high signal on
  diffusion-weighted MRI and NOTCH2NLC GGC-repeat testing, has made ante-mortem diagnosis
  feasible and revealed that NIID is more common than previously appreciated. No
  disease-modifying therapy exists; management is symptomatic and supportive.

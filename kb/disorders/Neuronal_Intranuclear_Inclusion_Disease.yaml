    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Skin biopsy demonstrating eosinophilic, ubiquitin/p62- and SUMO1-positive intranuclear
    inclusions in adipocytes, fibroblasts, and sweat gland cells is the established,
    minimally invasive antemortem diagnostic procedure for NIID. Its adoption converted
    NIID from a post-mortem to an antemortem diagnosis and is directly responsible for the
    rise in adult-onset NIID case ascertainment. In current practice it is paired with
    NOTCH2NLC repeat-length genetic testing.
  results: Eosinophilic ubiquitin/p62- and SUMO1-positive intranuclear inclusions in dermal adipocytes, fibroblasts, and sweat gland cells
  notes: >-
    Unlike the corticomedullary-junction DWI sign, the skin-biopsy finding was positive in
    all familial expansion carriers examined in PMID:31178126, so it does not lose
    sensitivity in the early-onset familial group.
  evidence:
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin biopsy is an effective and less invasive antemortem diagnostic tool for NIID."
    explanation: States the conclusion establishing skin biopsy as the antemortem diagnostic procedure.
  - reference: PMID:21411744
    reference_title: "Skin biopsy is useful for the antemortem diagnosis of neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No intranuclear inclusions were identified in the skin samples from normal control subjects and patients with other neurologic diseases."
    explanation: Establishes the specificity of the skin inclusion finding against controls and other neurological disease.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "since we reported the usefulness of skin biopsy for the diagnosis of NIID, the number of NIID diagnoses has increased, in particular adult-onset NIID"
    explanation: Documents the effect of skin biopsy on NIID case ascertainment.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, all skin biopsies revealed eosinophilic, p62-positive, and ubiquitin-positive intranuclear inclusions in dermal cells"
    explanation: Independent series in which every expansion carrier biopsied showed the diagnostic dermal inclusion, supporting the sensitivity claim in the notes.
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article reports a case of NIID diagnosed through skin biopsy and genetic testing, along with a review of relevant literature."
    explanation: Confirms current practice pairs skin biopsy with genetic testing for diagnosis.
- name: Diffusion-Weighted Brain MRI
  diagnosis_term:
    preferred_term: diffusion-weighted brain MRI
    term:
      id: NCIT:C111116
      label: Diffusion Weighted Imaging
  description: >-
    High signal intensity along the corticomedullary junction on diffusion-weighted brain
    MRI is the strongest antemortem imaging clue to NIID and, together with skin biopsy,
    underpins the published diagnostic flow chart for adult-onset disease. It was present
    in all dementia-dominant cases in the largest adult-onset series. Sensitivity is
    presentation-dependent rather than universal: in an independent familial cohort only
    about 37.5% of expansion carriers showed the classic corticomedullary DWI lesion, so a
    negative MRI does not exclude NIID — particularly in the early-onset limb-weakness
    group.
  results: Symmetrical high signal at the corticomedullary junction on DWI, with white matter hyperintensity on FLAIR/T2
  evidence:
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Head magnetic resonance imaging showed high intensity signal in corticomedullary junction in diffusion-weighted image in both sporadic and familial NIID cases, a strong clue to the diagnosis."
    explanation: Establishes the corticomedullary-junction DWI sign as the key antemortem imaging clue in both sporadic and familial NIID.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the dementia dominant cases presented with this type of leukoencephalopathy on head magnetic resonance imaging."
    explanation: Quantifies complete penetrance of the imaging finding within the dementia-dominant group.
  - reference: PMID:27797808
    reference_title: "Clinicopathological features of adult-onset neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on these clinicopathological features, we proposed a diagnosis flow chart of adult-onset NIID."
    explanation: Documents that these imaging and pathological features were assembled into a formal diagnostic algorithm.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Only about 37.5% of affected familial individuals presented with the classical NIID radiological findings of symmetrical hyperintense linear lesions in the corticomedullary junction in DWI"
    explanation: PARTIAL because it confirms the sign occurs but bounds its sensitivity in familial cases, showing a negative DWI cannot exclude the diagnosis.
- name: NOTCH2NLC GGC Repeat-Length Genetic Testing
  diagnosis_term:
    preferred_term: NOTCH2NLC GGC repeat-length testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sizing the non-coding GGC repeat in the 5' region of NOTCH2NLC is the molecular
    confirmatory test. Because the repeat is GC-rich and can be very long, it is assayed by
    repeat-primed PCR combined with GC-rich PCR, or by long-read sequencing; short-read
    exome sequencing does not resolve it. Affected individuals in the discovery cohorts
    carried more than 66 repeats, against a control range of roughly 5-38 (usually under
    40) repeats.
  results: Expanded 5' NOTCH2NLC GGC repeat (>66 repeats reported in affected individuals; controls usually <40)
  markers: NOTCH2NLC 5' GGC repeat length
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we designed primer sets for both repeat-primed PCR (RP-PCR) and GC-rich PCR (GC-PCR) assays to detect both normal and expanded GGC repeats"
    explanation: Describes the assay pair used to size the expansion, which is the basis of the clinical genetic test.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 211 healthy control subjects that we examined, the GGC repeat sizes range from 5 to 38, with modes at 11 and 16 repeats"
    explanation: Provides the control repeat-length distribution against which an expanded allele is called.
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals from both familial and sporadic case subjects carried an expanded GGC repeat larger than 66."
    explanation: Provides the affected repeat-length threshold observed across familial and sporadic cases.
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article reports a case of NIID diagnosed through skin biopsy and genetic testing, along with a review of relevant literature."
    explanation: Confirms that genetic testing is used alongside skin biopsy in current diagnostic practice.
treatments:
- name: Symptomatic and Supportive Care
  description: >-
    No disease-modifying therapy exists for NIID. Management is symptomatic and
    supportive, directed at the individual patient's dominant problems (cognitive
    decline, weakness, neuropathic symptoms, seizures, autonomic and bladder
    dysfunction), and is best delivered as coordinated multidisciplinary care alongside
    early diagnosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42428984
    reference_title: "Neuronal Intranuclear Inclusion Disease: A Case Report With Insights Into Clinical Features and Potential Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasizing the importance of early diagnosis and comprehensive treatment in managing this rare neurological disorder"
    explanation: Supports early diagnosis plus comprehensive (supportive, multidisciplinary) management as the current standard; no disease-modifying option is described.
- name: Genetic Counseling
  description: >-
    Because familial NIID is autosomal dominant and caused by a defined repeat expansion,
    genetic counseling and NOTCH2NLC repeat-length testing are relevant for probands and
    at-risk relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By long-read sequencing, we identified a GGC repeat expansion in the 5' region of NOTCH2NLC (Notch 2 N-terminal like C) in all affected family members."
    explanation: Establishes a defined, testable germline lesion segregating in families, which is the basis for counseling and cascade testing.
discussions:
- discussion_id: gap_niid_notch2nlc_genotype_phenotype
  prompt: >-
    Why does the same non-coding NOTCH2NLC GGC repeat expansion produce phenotypes as
    different as dementia-dominant adult NIID, early-onset limb-weakness familial NIID,
    oculopharyngodistal myopathy type 3, parkinsonism, and Alzheimer-disease-like
    presentations — and what (repeat length, repeat interruption/impurity, methylation,
    somatic instability, modifier loci) determines which a given carrier develops?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NOTCH2NLC 5' UTR GGC Repeat Expansion
  - pathophysiology#Multisystem Neurological Decline
  rationale: >-
    A single lesion class producing a spectrum this wide means allele identity alone
    cannot be prognostic. The gap is clinically consequential: it blocks counseling of
    expansion-positive relatives, and it determines whether NIID, OPDM3, and
    NOTCH2NLC-associated parkinsonism should be curated as one entity or several. The
    proposal of an umbrella NIID-related disorders category is an explicit
    acknowledgement that the boundary is unresolved.
  proposed_experiments:
  - experiment_id: exp_niid_pooled_genotype_phenotype
    name: Pooled NOTCH2NLC expansion genotype-phenotype correlation
    description: >-
      Relate repeat length, repeat purity/interruption, and methylation status to
      presenting syndrome (NIID dementia-dominant vs NIID limb-weakness vs OPDM3 vs
      parkinsonism) across a pooled multi-ancestry cohort of expansion carriers.
  - experiment_id: exp_niid_tissue_resolved_polyg_burden
    name: Tissue-resolved somatic instability and uN2CpolyG burden
    description: >-
      Measure somatic repeat instability and uN2CpolyG protein burden in brain versus
      skeletal muscle from carriers with divergent phenotypes, testing whether
      tissue-specific expansion or translation efficiency explains the NIID/OPDM3 split.
  evidence:
  - reference: PMID:31178126
    reference_title: "Expansion of Human-Specific GGC Repeat in Neuronal Intranuclear Inclusion Disease-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we suggest defining a term NIID-related disorders (NIIDRD), which will include NIID and other related neurodegenerative diseases caused by the expanded GGC repeat within human-specific NOTCH2NLC."
    explanation: The authors' proposal of an umbrella category is direct evidence that the entity boundaries and genotype-phenotype relationship are unresolved.
  - reference: PMID:31332380
    reference_title: "Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease, oculopharyngodistal myopathy and an overlapping disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings expand our knowledge of the clinical spectra of diseases caused by expansions of the same repeat motif, and further highlight how directly searching for expanded repeats can help identify mutations underlying diseases."
    explanation: Frames the same repeat motif as generating a broad clinical spectrum, which is the substance of this gap.
- discussion_id: interp_niid_rna_versus_protein_toxicity
  prompt: >-
    In human NIID brain, how much of the pathology is driven by the uN2CpolyG polyglycine
    protein versus by the expanded-repeat RNA itself?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#uORF Translation of the Polyglycine Protein uN2CpolyG
  - pathophysiology#Expanded-Repeat Transcript Accumulation
  rationale: >-
    The two mechanistic arms curated here are not mutually exclusive and rest on
    asymmetric evidence: the protein arm has a sufficiency experiment (uN2CpolyG
    expression alone causes neuronal loss in mice), whereas the RNA arm rests on
    patient-specific abnormal antisense transcripts in fibroblasts plus analogy to FXTAS.
    Resolving the balance matters therapeutically, because repeat-RNA-directed strategies
    (for example antisense oligonucleotides) and polyG-directed strategies target
    different steps.
  evidence:
  - reference: PMID:33887199
    reference_title: "Translation of GGC repeat expansions into a toxic polyglycine protein in NIID defines a novel class of human genetic disorders: The polyG diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, expression of uN2CpolyG in mice leads to locomotor alterations, neuronal cell loss, and premature death of the animals."
    explanation: The sufficiency result that makes the protein arm the stronger of the two.
  - reference: PMID:31332381
    reference_title: "Long-read sequencing identifies GGC repeat expansions in NOTCH2NLC associated with neuronal intranuclear inclusion disease."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We observed abnormal anti-sense transcripts in fibroblasts specifically from patients but not unaffected individuals."
    explanation: The observation supporting an RNA arm; PARTIAL because it is correlative, in fibroblasts rather than brain, and does not establish toxicity.

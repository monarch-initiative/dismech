    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a dynamin 2 mutation presented with a classical Charcot-Marie-Tooth phenotype, which was mild to moderately severe since only 3% of the patients were wheelchair-bound."
    explanation: >-
      Peer-reviewed cohort statement of the phenotype and its severity, cited in preference to
      the retired chapter.
- name: Depressed Tendon Reflexes
  category: Neurologic
  description: Reduced or absent deep tendon reflexes, as expected in a peripheral neuropathy.
  frequency: FREQUENT
  phenotype_term:

histopathology:
- name: Sural Nerve - Mixed Axonal Loss and Myelin Abnormality
  description: >-
    The human tissue counterpart of the "intermediate" label, and the reason it is more than
    an electrophysiological convention. A single biopsy shows both arms at once: diffuse loss
    of large myelinated fibres and clusters of regenerating myelinated axons, which is axonal
    pathology with regeneration, alongside fibres with focal myelin thickenings, which is a
    myelin abnormality. The same picture was reported independently in an Australian family.
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsy in a Dutch patient with Lys558Glu mutation showed diffuse loss of large myelinated fibres, presence of many clusters of regenerating myelinated axons and fibres with focal myelin thickenings--findings very similar to those previously reported in the Australian family."
    explanation: >-
      Human nerve tissue showing axonal and myelin pathology together, with independent
      replication - the direct tissue support for modelling both arms.
animal_models:
- name: Zebrafish expressing CMT-mutant human DNM2 mRNA
  species: Zebrafish
  genotype: Injection of human DNM2 G537C (CMT) mRNA; compared against R522H (CNM)
  publication: PMID:26842864
  description: >-
    A side-by-side comparison of the two DNM2 disease mutations in one system. Its value is
    the contrast rather than either arm alone: the CNM mutant produces incorrect branching,
    the CMT mutant produces no branching at all, in the same experiment.
  modeled_mechanisms:
  - target: Motor Axon Branching and Maintenance Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      CMT-mutant mRNA abolishes secondary motor neuron branching, a more severe defect than
      the CNM mutant produces.
    limitations: >-
      This is transient overexpression of human mutant mRNA in a zebrafish embryo, not the
      endogenous heterozygous state of a patient, and the readout is developmental branching
      rather than the adult length-dependent degeneration the human disease shows.
    readouts:
    - name: Secondary motor neuron branching
      target: Motor Axon Branching and Maintenance Failure
      direction: ABOLISHED
      interpretation: >-
        Complete absence of branching, recorded as ABOLISHED rather than DECREASED because
        that is what the source reports and it is the point of the CNM contrast.
      evidence:
      - reference: PMID:26842864
        reference_title: "Zebrafish as a Model to Investigate Dynamin 2-Related Diseases."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "incorrect branching in embryos injected with CNM-mutated mRNA, and total absence of branching in those injected with CMT-mutated mRNA"
        explanation: Reports the branching measurement, and the CNM comparator that gives it meaning.
    evidence:
    - reference: PMID:26842864
      reference_title: "Zebrafish as a Model to Investigate Dynamin 2-Related Diseases."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results showing, a continuum between CNM and CMTDIB phenotypes in zebrafish, similarly to the human conditions, confirm this animal model to be a powerful tool to investigate mutations of DNM2 in vivo."
      explanation: The authors' own statement that the model reproduces the human CNM-CMTDIB relationship.
- name: Dnm2 K562E/+ knock-in mouse and the CNM/CMT compound cross
  species: Mouse
  genotype: Dnm2 K562E/+ (CMT); crossed with Dnm2 S619L/+ (CNM) to give Dnm2 S619L/K562E
  publication: PMID:40393994
  description: >-
    A genetic test of the opposite-directions hypothesis. If CNM variants raise dynamin-2
    activity and CMT variants lower it, then combining them in one animal should move activity
    back toward normal - and it does. The compound heterozygote has improved motor
    coordination, strength and mass over either single mutant, with normalized muscle
    structure and nerve fibre organization.
  modeled_mechanisms:
  - target: DNM2 Variant Impairing Dynamin-2 Lipid Binding
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Mutual rescue between a CMT and a CNM allele. This is the strongest available support
      for the loss-of-function direction assigned to the CMT variant node: the rescue only
      makes sense if the two alleles push dynamin-2 activity opposite ways.
    limitations: >-
      The rescue is genetic, not therapeutic - it requires carrying a second disease-causing
      allele, so it demonstrates the direction of the defect rather than offering a treatment.
      Muscle readouts dominate; nerve fibre organization is reported but the peripheral-nerve
      phenotyping is less detailed than the muscle phenotyping.
    readouts:
    - name: Motor coordination, muscle strength and mass
      target: DNM2 Variant Impairing Dynamin-2 Lipid Binding
      direction: RESTORED
      interpretation: Functional rescue in the compound heterozygote relative to either single mutant.
      evidence:
      - reference: PMID:40393994
        reference_title: "Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dnm2S619L/K562E offspring exhibit strongly improved motor coordination and muscle strength and mass, compared to single-mutant littermates."
        explanation: Reports the functional rescue measurement.
    - name: Nerve fibre organization
      target: DNM2 Variant Impairing Dynamin-2 Lipid Binding
      direction: RESTORED
      interpretation: Structural rescue in peripheral nerve, the tissue relevant to this disease.
      evidence:
      - reference: PMID:40393994
        reference_title: "Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dnm2S619L/K562E mice present normalized muscle structure and nerve fiber organization."
        explanation: Reports the structural rescue, including the nerve arm.
    evidence:
    - reference: PMID:40393994
      reference_title: "Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study reveals that two distinct disease-causing mutations within the DNM2 gene compensate each other in vivo, leading to corrections of most individual phenotypes."
      explanation: >-
        Supports treating this cross as informative for the direction of the CMT variant's
        functional effect. Note "most individual phenotypes" - the correction is not total.
progression:
- phase: Onset
  age_range: 2 to 50 years (mean 16)
  notes: >-
    Age at onset is strikingly variable - a mean of 16 years across a 34-patient cohort, with
    a range spanning most of life. One family showed onset from age 12 to the fifth decade
    within the same variant, so the variability is not only between genotypes.
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at onset was 16 years with a large variability ranging from 2 to 50 years."
    explanation: Cohort statement of onset age and its spread.
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a very broad range of the onset of clinical symptoms from an early onset around the age of 12 to the late onset during the fifth decade"
    explanation: >-
      Shows the same spread within a single family carrying one variant, which is what makes
      the variability intrafamilial rather than genotype-driven.
- phase: Established disease
  notes: >-
    Slowly progressive, without loss of ambulation in the reported family, and only 3% of a
    larger cohort wheelchair-bound. It is unusual for individuals with this disease to become
    wheelchair-bound.
  evidence:
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progression was slow with no loss of ambulation."
    explanation: Course in a 15-member affected family.
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is unusual for individuals with DI-CMTB to become wheelchair bound."
    explanation: >-
      Prognostic statement. Source is a retired GeneReviews chapter, but the 3% figure in
      PMID:19502294 supports the same conclusion independently.

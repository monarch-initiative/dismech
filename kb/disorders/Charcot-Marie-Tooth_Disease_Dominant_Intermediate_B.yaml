name: Charcot-Marie-Tooth Disease Dominant Intermediate B
category: Mendelian
creation_date: '2026-08-28T12:00:00Z'
synonyms:
- CMTDIB
- DI-CMTB
- DNM2-related intermediate Charcot-Marie-Tooth neuropathy
- Dominant intermediate Charcot-Marie-Tooth neuropathy type B
- Charcot-Marie-Tooth disease, dominant intermediate B
description: >-
  CMTDIB is an autosomal dominant sensorimotor neuropathy caused by heterozygous DNM2 variants. It typically
  causes slowly progressive distal weakness and wasting, sensory loss, reduced reflexes, and foot deformities,
  with intermediate or axonal nerve conduction findings. Neutropenia and early cataracts occur in some
  families. Dynamin-2 dysfunction affects membrane trafficking and peripheral nerve myelination, but biochemical
  effects differ among variants: reduced lipid-coupled activity is established for K562E, whereas the
  CMT-associated ΔDEE mutant shows increased assembly-dependent GTPase activity in vitro. DNM2-related
  centronuclear myopathy is an allelic disorder with distinct clinical and experimental features.

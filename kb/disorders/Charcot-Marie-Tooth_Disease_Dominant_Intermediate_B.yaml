notes: >-
  The disease-specific GeneReviews chapter is retired and is not used as a current clinical
  baseline. Disease-specific clinical findings here derive from primary family studies; the current full-text
  CMT GeneReviews overview supplies general management and counseling guidance. Experimental DNM2 and
  BIN1 manipulations do not establish an effective human disease-modifying
  therapy. Variant numbering is retained as reported in each primary study. PMID:19502294 and
  url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2724916/ identify the same cohort paper; the PMID cache
  contains its abstract, while the PMC URL cache supplies the full text.
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant transmission of heterozygous DNM2 variants, with variable expressivity and clinically
    silent carriers reported at examination. Each child of a heterozygous affected parent has a 50% chance
    of inheriting the variant; severity cannot be predicted from transmission alone.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22091729
    reference_title: Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This missense mutation segregated with the neuropathy, indicating the causal character of this mutation.
    explanation: Dominant segregation in a Czech family with 15 affected members.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2724916/
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two individuals carried a DNM2 mutation but experienced no symptoms of a neuropathy (CMT-48/III.9;
      CMT-310/V.6).
    explanation: >-
      The full cohort report documents clinically silent carriers at examination; it does not establish
      complete penetrance.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Each child of an individual with autosomal dominant CMT has a 50% chance of inheriting the pathogenic variant.
    explanation: Supports the Mendelian transmission risk. This is general CMT guidance, applied indirectly to CMTDIB.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
pathophysiology:
- name: DNM2 Neuropathy-Associated Variants
  description: >-
    Heterozygous missense, in-frame deletion, and splice-altering DNM2 variants cause dominant intermediate
    neuropathy. Variants occur in the pleckstrin homology domain and also in the middle and proline-rich
    domains. Their biochemical effects are allele- and assay-dependent.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  genetic_context:
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  downstream:
  - target: Reduced Lipid-Coupled Dynamin-2 Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Demonstrated for K562E; this branch is not generalized to every CMT allele.
  - target: Impaired Clathrin-Mediated Endocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Endocytic defects were observed for the neuropathy mutants tested in cultured peripheral nerve cells.
  - target: Motor Axon Branching Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The G537C overexpression model supports a developmental axonal effect; the intervening mechanism
      is unresolved.
  - target: Neutropenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Family cosegregation supports a DNM2-associated feature, but its cellular mechanism and modifiers
      are unresolved.
  - target: Early-Onset Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Observed in a Lys558del family; the lens-specific causal intermediates remain unresolved.
  - target: Skeletal Muscle Trafficking Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: K562E mouse muscle findings; their contribution to human neuropathy disability remains uncertain.
  evidence:
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in contrast to the other Charcot-Marie-Tooth-related mutations in dynamin 2, which are all located
      in the pleckstrin homology domain, they were situated in the middle domain and proline-rich domain
      of dynamin 2, respectively. We report the first disease-causing mutation in the proline-rich domain
      of dynamin 2.
    explanation: >-
      Establishes the PH-domain clustering and the two documented exceptions, in a cohort of 34 patients
      from six families.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2724916/
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all eight patients of the Belgian pedigree CMT-48 and in seven CMT patients belonging to the
      Australian family CMT-310, haematological abnormalities were observed (Table 1, Figs 1 and 3), which
      were not present in the other DNM2-mutated pedigrees including the Dutch H20 family harbouring the
      same mutation as CMT-310.
    explanation: >-
      Family-specific hematological findings, including their absence in a family with the same Lys558Glu
      allele, preclude a deterministic residue-only association.
    quote_role: PRIMARY_RESULT
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: early onset cataracts were observed in one of the Charcot-Marie-Tooth families
    explanation: The primary cohort identifies cataracts as an accompanying feature in one family.
    quote_role: PRIMARY_RESULT
- name: Reduced Lipid-Coupled Dynamin-2 Activity
  description: >-
    Recombinant DNM2-K562E has defective PIP2 binding and reduced lipid-stimulated GTPase activity. This
    is an allele-specific biochemical result, not a uniform property of all CMT-associated variants. The
    ΔDEE mutant retains PIP2 binding and has increased assembly-dependent GTPase activity in vitro.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  downstream:
  - target: Impaired Clathrin-Mediated Endocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired lipid binding provides a mechanistic link for lipid-binding-defective variants, rather
      than proof of this route for every allele.
  evidence:
  - reference: PMID:40393994
    reference_title: Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The data show that the rDNM2-KE is defective in PIP2 binding, consistent with the localization of
      this mutation in the lipid-binding loop.
    explanation: Recombinant-protein liposome assays directly establish the K562E lipid-binding defect.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40042903
    reference_title: BIN1 reduction ameliorates DNM2-related Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: With PS, the K562E mutant showed reduced GTPase activity compared to WT.
    explanation: >-
      The decrease is measured with phosphatidylserine supplementation; it is not a claim of universally
      reduced basal activity.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34744632
    reference_title: Gain-of-Function Properties of a Dynamin 2 Mutant Implicated in Charcot-Marie-Tooth Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results demonstrate that at least one CMT-linked mutation, ΔDEE, confers the gain-of-function
      in vitro properties that were hitherto observed only with CNM-linked mutations
    explanation: >-
      This counterexample limits generalization of the K562E biochemical loss of function to all CMT alleles.
      It does not prove a gain-of-function disease mechanism in patients.
    quote_role: PRIMARY_RESULT
- name: Impaired Clathrin-Mediated Endocytosis
  description: >-
    Cultured Schwann cells and peripheral neurons expressing the tested CMT-associated DNM2 mutants have
    impaired clathrin-mediated endocytosis. Altered Schwann-cell surface protein abundance provides a
    link to defective myelination.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: clathrin-dependent endocytosis
    modifier: DECREASED
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
  downstream:
  - target: Schwann Cell Myelin Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The culture study links impaired endocytosis to altered Schwann-cell surface protein levels and
      impaired myelination.
  evidence:
  - reference: PMID:22451505
    reference_title: >-
      Dynamin 2 mutations in Charcot-Marie-Tooth neuropathy highlight the importance of clathrin-mediated
      endocytosis in myelination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Schwann cells and neurons from the peripheral nervous system expressing dominant intermediate Charcot-Marie-Tooth
      neuropathy mutants showed defects in clathrin-mediated endocytosis. We demonstrate that, as a consequence,
      protein surface levels are altered in Schwann cells.
    explanation: >-
      Experiments in cultured peripheral neurons and Schwann cells connect defective endocytosis to altered
      surface protein abundance.
    quote_role: PRIMARY_RESULT
- name: Motor Axon Branching Defect
  description: >-
    Transient expression of human DNM2-G537C in zebrafish embryos disrupts secondary motor axon formation.
    This developmental phenotype supports an axonal contribution, but does not directly establish the
    sequence leading to adult length-dependent degeneration.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:26842864
    reference_title: Zebrafish as a Model to Investigate Dynamin 2-Related Diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Defects arose especially in secondary motor neuron formation, with incorrect branching in embryos
      injected with CNM-mutated mRNA, and total absence of branching in those injected with CMT-mutated
      mRNA.
    explanation: Direct model evidence for a motor axon branching defect specific to the CMT-type variant.
    quote_role: PRIMARY_RESULT
- name: Schwann Cell Myelin Dysfunction
  description: >-
    DNM2-dependent endocytosis is required for peripheral myelination in culture. CMT-associated mutants
    impaired myelination in the tested ex vivo system. A sensitized K562E mouse lacking the wild-type
    Dnm2 allele specifically in Schwann cells additionally develops severe myelin thinning and axonal
    loss, with reduced EGR2 and MPZ levels; the added deletion limits direct extrapolation to heterozygous
    patients.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: Intermediate Nerve Conduction Slowing
    causal_link_type: DIRECT
    description: Myelin loss contributes to slowing, although human electrophysiology also reflects axonal involvement.
  - target: Length-Dependent Distal Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myelin failure and axonal loss coexist in the sensitized mouse; their temporal and molecular relationship
      in patients remains incompletely resolved.
  evidence:
  - reference: PMID:22451505
    reference_title: >-
      Dynamin 2 mutations in Charcot-Marie-Tooth neuropathy highlight the importance of clathrin-mediated
      endocytosis in myelination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dominant intermediate Charcot-Marie-Tooth neuropathy type B-associated dynamin 2 mutants, but not
      autosomal dominant centronuclear myopathy mutants, impaired myelination
    explanation: The mutant comparison was performed in an ex vivo peripheral nerve culture, not in an intact animal.
    quote_role: PRIMARY_RESULT
  - reference: PMID:42774638
    reference_title: >-
      DNM2-Charcot-Marie-Tooth neuropathy stems from disrupted Schwann cell function and shows limited
      therapeutic reversibility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In particular, a downregulation of the transcription factor EGR2, a master regulator of myelin gene
      expression, and of the myelin protein MPZ correlates with demyelination.
    explanation: >-
      The sensitized mouse links Schwann-cell dysfunction to myelin loss; EGR2 and MPZ reductions are
      correlates, not separately demonstrated causal steps.
    quote_role: PRIMARY_RESULT
- name: Length-Dependent Distal Axonal Degeneration
  description: >-
    Loss of large myelinated axons and regeneration in human sural nerve biopsies accompany a length-dependent
    sensorimotor neuropathy. Distal denervation contributes to weakness and wasting; sensory axon dysfunction
    contributes to distal sensory loss and reduced reflexes.
  biological_scale: TISSUE
  downstream:
  - target: Distal Muscle Weakness
    causal_link_type: DIRECT
  - target: Distal Muscle Atrophy
    causal_link_type: DIRECT
  - target: Sensory Loss
    causal_link_type: DIRECT
  - target: Depressed Tendon Reflexes
    causal_link_type: DIRECT
  - target: Pes Cavus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Chronic muscle imbalance contributes to fixed foot deformity.
  - target: Frequent Falls
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Distal weakness and sensory impairment compromise gait and balance.
  evidence:
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsy in a Dutch patient with Lys558Glu mutation showed diffuse loss of large myelinated
      fibres, presence of many clusters of regenerating myelinated axons and fibres with focal myelin
      thickenings--findings very similar to those previously reported in the Australian family.
    explanation: >-
      Human nerve tissue showing axonal and myelin pathology together, with independent replication -
      the direct tissue support for modelling both arms.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35993408
    reference_title: 'A Novel Dynamin 2 Mutation Causing Dominant Intermediate Charcot-Marie-Tooth Neuropathy: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDX studies (Table 1) demonstrated a moderately severe, chronic length-dependent predominantly axonal
      sensorimotor polyneuropathy with some demyelinating features and no conduction block, as seen in
      DI-CMTB.
    explanation: The affected brother had a length-dependent sensorimotor axonopathy with additional demyelinating features.
    quote_role: PRIMARY_RESULT
- name: Intermediate Nerve Conduction Slowing
  description: >-
    Median motor conduction velocities range from about 26 m/s to normal, with variability within and
    between families. The electrophysiological spectrum includes intermediate and axonal patterns and
    is not specific enough to identify DNM2 without genetic testing.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our electrophysiological data indicate intermediate or axonal motor median nerve conduction velocities
      (NCV) ranging from 26 m/s to normal values in four families, and less pronounced reduction of motor
      median NCV (41-46 m/s) with normal amplitudes in two families.
    explanation: >-
      The primary cohort documents the range of median motor conduction velocities and the variability
      between families.
    quote_role: PRIMARY_RESULT
- name: Skeletal Muscle Trafficking Defects
  description: >-
    Dnm2-K562E mouse muscle shows desmin and integrin mislocalization and membrane trafficking abnormalities.
    Improvement after muscle-specific DNM2 expression from embryogenesis supports an intrinsic muscle
    component in this model; it does not establish a primary myopathy in all patients with CMTDIB.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:41683892
    reference_title: >-
      Muscle-Specific DNM2 Overexpression Improves Charcot-Marie-Tooth Disease In Vivo and Reveals a Narrow
      Therapeutic Window in Skeletal Muscle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Muscle-specific DNM2 overexpression from embryogenesis in Dnm2K562E/+ mice ameliorated desmin and
      integrin mislocalization, membrane trafficking defects, mitochondrial abnormalities, and fibrosis
      in skeletal muscle, resulting in improved locomotor coordination despite persistent muscle atrophy.
    explanation: >-
      Muscle-targeted rescue supports a model-specific intrinsic muscle contribution while persistent
      atrophy limits the rescue claim.
    quote_role: PRIMARY_RESULT

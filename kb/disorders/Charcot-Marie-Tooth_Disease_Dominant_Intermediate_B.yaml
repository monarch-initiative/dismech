genetic:
- name: DNM2
  notes: >-
    Encodes dynamin-2. CMT-associated variants cluster in the pleckstrin homology domain, with
    documented exceptions in the middle and proline-rich domains. Variants at Lys558 are
    associated with cosegregating neutropenia.

    The allelic relationship with centronuclear myopathy is the mechanistically notable point
    and is deliberately kept as a contrast rather than merged into this entry: the proposal in
    the literature is that CNM variants make the protein hyperactive while CMT variants reduce
    its activity, so the two diseases sit on opposite sides of normal.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  variants:
  - name: Lys558Glu
    description: >-
      One of two variants at Lys558 - the other is Lys558del - carried by the Australian and
      Belgian families in which the neuropathy cosegregated with neutropenia. The residue,
      not the specific substitution, is what the neutropenia association tracks.
    evidence:
    - reference: PMID:19502294
      reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lys558del (Belgium); Lys558Glu (Australia, the Netherlands)"
      explanation: Names the two Lys558 alleles and the families carrying them.
  - name: Gly358Arg
    description: >-
      A middle-domain variant, one of the two exceptions to the pleckstrin homology domain
      clustering.
    evidence:
    - reference: PMID:19502294
      reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gly358Arg (Spain); Asp551_Glu553del; Lys550fs (North America)"
      explanation: Names the variant and its cohort of origin.
  - name: Thr855_Ile856del
    description: >-
      The first disease-causing variant reported in the proline-rich domain of dynamin-2.
    evidence:
    - reference: PMID:19502294
      reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the first disease-causing mutation in the proline-rich domain of dynamin 2."
      explanation: Establishes the domain novelty of this allele.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis requires identification of a heterozygous pathogenic variant in DNM2, the only gene known to be associated with DI-CMTB."
    explanation: >-
      Establishes DNM2 as the sole known gene for this entity. Source is a retired GeneReviews
      chapter; independently supported by the cohort papers cited in this entry.
  - reference: PMID:30426359
    reference_title: "Dynamin 2 (DNM2) as Cause of, and Modifier for, Human Neuromuscular Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant mutations in the ubiquitously expressed DNM2 cause 2 discrete neuromuscular diseases: autosomal dominant centronuclear myopathy (ADCNM) and dominant intermediate Charcot-Marie-Tooth neuropathy (CMT)."
    explanation: Establishes the allelic relationship recorded in the notes above.
diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Motor median NCV in the intermediate or axonal range, roughly 26 m/s to normal. This is
    what places a patient in the intermediate category and prompts DNM2 testing rather than
    the CMT1A duplication that accounts for most CMT.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is suspected in individuals with typical findings of CMT hereditary neuropathy and intermediate or axonal motor median nerve conduction velocities (NCV) ranging from 26 m/s to normal."
    explanation: >-
      States the electrophysiological criterion. Source is a retired GeneReviews chapter; the
      intermediate electrophysiology is independently confirmed in PMID:19502294.
- name: DNM2 Sequencing
  description: Identification of a heterozygous pathogenic DNM2 variant confirms the diagnosis.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."

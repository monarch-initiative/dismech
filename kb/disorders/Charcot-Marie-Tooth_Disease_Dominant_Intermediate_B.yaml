diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Nerve conduction studies document intermediate or axonal sensorimotor neuropathy, with median motor
    velocities from about 26 m/s to normal. This pattern supports inherited neuropathy but does not select
    DNM2 to the exclusion of other CMT genes.
  evidence:
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our electrophysiological data indicate intermediate or axonal motor median nerve conduction velocities
      (NCV) ranging from 26 m/s to normal values in four families, and less pronounced reduction of motor
      median NCV (41-46 m/s) with normal amplitudes in two families.
    explanation: >-
      The primary cohort documents the range of median motor conduction velocities and the variability
      between families.
    quote_role: PRIMARY_RESULT
- name: Molecular Genetic Testing
  description: >-
    A heterozygous pathogenic or likely pathogenic DNM2 variant in a compatible phenotype establishes
    DNM2-related neuropathy. For an undiagnosed CMT proband, current general guidance begins with PMP22
    dosage testing and then a suitable neuropathy panel or broader sequencing. Segregation can help evaluate
    uncertain DNM2 variants; a variant of uncertain significance alone is not confirmatory.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: <i>PMP22</i> deletion/duplication analysis is recommended as the first test for all probands with CMT.
    explanation: >-
      Supports the initial testing step rather than bypassing PMP22 because velocities are intermediate.
      This is general CMT guidance, applied indirectly to CMTDIB.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:35993408
    reference_title: 'A Novel Dynamin 2 Mutation Causing Dominant Intermediate Charcot-Marie-Tooth Neuropathy: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To evaluate a clinical suspicion of autosomal dominant CMT neuropathy in our patients, the Hereditary
      Neuropathy genetic test panel was performed by GeneDx (Gaithersburg, Maryland) using oral rinse
      specimens.
    explanation: A disease-specific example of multigene-panel testing followed by familial interpretation.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35993408
    reference_title: 'A Novel Dynamin 2 Mutation Causing Dominant Intermediate Charcot-Marie-Tooth Neuropathy: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their mother possessed the same heterozygous missense DNM2 point mutation which was absent in their
      father (Figure 2), supporting our inference that DNM2 (c.1609 G>A) is causative of DI-CMTB in this
      family cohort.
    explanation: >-
      Primary family testing supports maternal transmission; this is the authors' inference rather than
      an independent ACMG classification.
    quote_role: PRIMARY_RESULT

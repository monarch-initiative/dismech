histopathology:
- name: Sural Nerve - Mixed Axonal Loss and Myelin Abnormality
  description: >-
    Sural nerve biopsy in a Dutch Lys558Glu carrier showed loss of large myelinated fibers, regenerating
    axonal clusters, and focal myelin thickenings, similar to earlier Australian findings. These observations
    establish mixed axonal and myelin pathology without requiring a uniform primary demyelinating mechanism.
  evidence:
  - reference: PMID:19502294
    reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsy in a Dutch patient with Lys558Glu mutation showed diffuse loss of large myelinated
      fibres, presence of many clusters of regenerating myelinated axons and fibres with focal myelin
      thickenings--findings very similar to those previously reported in the Australian family.
    explanation: >-
      Human nerve tissue showing axonal and myelin pathology together, with independent replication -
      the direct tissue support for modelling both arms.
    quote_role: PRIMARY_RESULT
animal_models:
- name: Zebrafish expressing CMT-mutant human DNM2 mRNA
  species: Zebrafish
  genotype: Injection of human DNM2 G537C (CMT) mRNA; compared against R522H (CNM)
  publication: PMID:26842864
  description: >-
    Transient human G537C mRNA expression in zebrafish embryos disrupted secondary motor axon development;
    R522H and wild-type mRNA were comparators.
  modeled_mechanisms:
  - target: Motor Axon Branching Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Secondary motor axon branching was absent after G537C mRNA injection.
    limitations: >-
      This is transient overexpression of human mutant mRNA in a zebrafish embryo, not the endogenous
      heterozygous state of a patient, and the readout is developmental branching rather than the adult
      length-dependent degeneration the human disease shows.
    readouts:
    - name: Secondary motor neuron branching
      target: Motor Axon Branching Defect
      direction: ABOLISHED
      interpretation: Absence of secondary motor axon branching in the embryonic assay.
      evidence:
      - reference: PMID:26842864
        reference_title: Zebrafish as a Model to Investigate Dynamin 2-Related Diseases.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          incorrect branching in embryos injected with CNM-mutated mRNA, and total absence of branching
          in those injected with CMT-mutated mRNA
        explanation: Reports the branching measurement, and the CNM comparator that gives it meaning.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:26842864
      reference_title: Zebrafish as a Model to Investigate Dynamin 2-Related Diseases.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results showing, a continuum between CNM and CMTDIB phenotypes in zebrafish, similarly to
        the human conditions, confirm this animal model to be a powerful tool to investigate mutations
        of DNM2 in vivo.
      explanation: The authors' own statement that the model reproduces the human CNM-CMTDIB relationship.
      quote_role: PRIMARY_RESULT
- name: Dnm2 K562E/+ knock-in mouse and the CNM/CMT compound cross
  species: Mouse
  genotype: Dnm2 K562E/+ (CMT); crossed with Dnm2 S619L/+ (CNM) to give Dnm2 S619L/K562E
  publication: PMID:40393994
  description: >-
    Combining K562E and S619L improved motor performance and several muscle and nerve measures. The rescue
    was incomplete: sensory response amplitudes remained reduced at one year. This lifelong genetic cross
    is not a post-onset treatment experiment.
  modeled_mechanisms:
  - target: Reduced Lipid-Coupled Dynamin-2 Activity
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The accompanying recombinant-protein experiments show normalization of K562E lipid binding when
      combined with S619L.
    limitations: >-
      The biochemical assay is in vitro and the genetic cross acts from development. Neither establishes
      restoration of fission in patient Schwann cells or efficacy of a human treatment.
    readouts:
    - name: Recombinant DNM2 binding to PIP2 liposomes
      target: Reduced Lipid-Coupled Dynamin-2 Activity
      direction: RESTORED
      interpretation: PIP2 binding normalized in recombinant hetero-oligomers; this is distinct from an animal nerve readout.
      evidence:
      - reference: PMID:40393994
        reference_title: Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found that the SL&KE hetero-oligomers normalized the binding to PIP2 liposomes to WT level
          compared to rDNM2-KE alone, similarly in the Coexpr and Mix conditions.
        explanation: >-
          Reports the binding measurement. Graded IN_VITRO because it is a co-sedimentation assay with
          recombinant protein and synthetic liposomes, not an animal readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:40393994
      reference_title: Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study reveals that two distinct disease-causing mutations within the DNM2 gene compensate
        each other in vivo, leading to corrections of most individual phenotypes.
      explanation: The genetic cross supports compensatory interactions for this pair of alleles, not all DNM2 variants.
      quote_role: PRIMARY_RESULT
  - target: Intermediate Nerve Conduction Slowing
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      At one year the compound mutant improved sensory conduction velocity relative to K562E alone, but
      did not normalize sensory response amplitude.
    limitations: >-
      The K562E/+ model has mild nerve involvement and prominent muscle abnormalities. Motor conduction
      was unaffected in all groups, and muscle improvement cannot be equated with rescue of human distal
      axonal degeneration.
    readouts:
    - name: Sensory conduction velocity and amplitude
      target: Intermediate Nerve Conduction Slowing
      direction: INCREASED
      interpretation: >-
        Velocity improved relative to K562E, but remained above wild type in compound mutants and sensory
        amplitude was not rescued.
      evidence:
      - reference: PMID:40393994
        reference_title: Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These findings suggest that while the double mutant exhibit improvement in conduction velocity,
          they fail to rescue sensory amplitude deficits.
        explanation: Full-text electrophysiology limits the abstract-level rescue claim.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:40393994
      reference_title: Combining dynamin 2 myopathy and neuropathy mutations rescues both phenotypes.

      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings suggest that while the double mutant exhibit improvement in conduction velocity,
        they fail to rescue sensory amplitude deficits.
      explanation: Full-text electrophysiology limits the abstract-level rescue claim.
      quote_role: PRIMARY_RESULT
- name: Schwann-cell-sensitized Dnm2 K562E mouse
  species: Mouse
  genotype: 'Dnm2 K562E/SC-: systemic K562E heterozygosity with Schwann-cell-specific deletion of wild-type Dnm2'
  publication: PMID:42774638
  description: >-
    The model develops severe conduction deficits, myelin thinning, axonal loss, and inflammatory changes.
    Intrathecal MPZ-promoter AAV9-DNM2 at four weeks increased nerve DNM2 but did not improve the measured
    outcomes by seven to eight weeks.
  modeled_mechanisms:
  - target: Schwann Cell Myelin Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model develops severe conduction deficits, myelin thinning, axonal loss, and inflammatory changes.
      Intrathecal MPZ-promoter AAV9-DNM2 at four weeks increased nerve DNM2 but did not improve the measured
      outcomes by seven to eight weeks.
    limitations: >-
      The added Schwann-cell deletion differs from patient heterozygosity. Failure at this dose, timing,
      promoter, and follow-up does not establish that all DNM2 supplementation is ineffective.
    evidence:
    - reference: PMID:42774638
      reference_title: >-
        DNM2-Charcot-Marie-Tooth neuropathy stems from disrupted Schwann cell function and shows limited
        therapeutic reversibility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This model faithfully reproduces key clinical and pathological features of DNM2-Charcot-Marie-Tooth,
        including motor deficits, reduced general force and coordination, and severe sensory and motor
        conduction deficits associated with axonal loss, demyelination and inflammation.
      explanation: The study characterizes the severe phenotype of the model carrying the additional Schwann-cell deletion.
      quote_role: PRIMARY_RESULT
    - reference: PMID:42774638
      reference_title: >-
        DNM2-Charcot-Marie-Tooth neuropathy stems from disrupted Schwann cell function and shows limited
        therapeutic reversibility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although DNM2 expression increased in peripheral nerves (∼1.9-fold), no significant improvements
        were observed across behavioural, electrophysiological, structural or molecular parameters.
      explanation: A negative post-symptomatic intervention result in a sensitized mouse, not a human treatment outcome.
      quote_role: PRIMARY_RESULT

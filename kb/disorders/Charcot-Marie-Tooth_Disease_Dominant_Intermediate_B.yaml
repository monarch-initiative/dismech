genetic:
- name: DNM2
  notes: >-
    Heterozygous DNM2 variants segregate with dominant intermediate neuropathy. Most reported variants
    involve the pleckstrin homology domain, with middle- and proline-rich-domain variants also documented.
    Functional direction must be assessed per allele and assay. Neutropenia and cataracts vary among families,
    and clinically silent carriers preclude assuming universal clinical penetrance.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  variants:
  - name: Lys558Glu
    description: >-
      Lys558Glu was found in Australian and Dutch families. Hematological abnormalities accompanied the
      Australian family but were absent in the Dutch family with the same allele.
    evidence:
    - reference: PMID:19502294
      reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Lys558del (Belgium); Lys558Glu (Australia, the Netherlands)
      explanation: Names the two Lys558 alleles and the families carrying them.
      quote_role: PRIMARY_RESULT
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2724916/
      reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In all eight patients of the Belgian pedigree CMT-48 and in seven CMT patients belonging to the
        Australian family CMT-310, haematological abnormalities were observed (Table 1, Figs 1 and 3),
        which were not present in the other DNM2-mutated pedigrees including the Dutch H20 family harbouring
        the same mutation as CMT-310.
      explanation: >-
        Family-specific hematological findings, including their absence in a family with the same Lys558Glu
        allele, preclude a deterministic residue-only association.
      quote_role: PRIMARY_RESULT
  - name: Gly358Arg
    description: A middle-domain variant, one of the two exceptions to the pleckstrin homology domain clustering.
    evidence:
    - reference: PMID:19502294
      reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Gly358Arg (Spain); Asp551_Glu553del; Lys550fs (North America)
      explanation: Names the variant and its cohort of origin.
      quote_role: PRIMARY_RESULT
  - name: Thr855_Ile856del
    description: The first disease-causing variant reported in the proline-rich domain of dynamin-2.
    evidence:
    - reference: PMID:19502294
      reference_title: Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

name: Charcot-Marie-Tooth Disease Dominant Intermediate B
category: Mendelian
creation_date: "2026-08-28T12:00:00Z"
synonyms:
- CMTDIB
- DI-CMTB
- DNM2-related intermediate Charcot-Marie-Tooth neuropathy
- Dominant intermediate Charcot-Marie-Tooth neuropathy type B
- Charcot-Marie-Tooth disease, dominant intermediate B
description: >-
  CMTDIB is an autosomal dominant peripheral neuropathy caused by heterozygous DNM2 variants.
  Dynamin-2 is a large GTPase that pinches off membrane invaginations - the fission step of
  endocytosis and of vesicle traffic - and it is expressed everywhere, which is why the
  disease is not confined to nerve.

  "Intermediate" is the informative word and the reason this entry exists separately.
  Conduction velocities in these patients run from about 26 m/s to normal, straddling the
  boundary between demyelinating CMT1 (slow) and axonal CMT2 (normal velocity, reduced
  amplitude). The pathograph therefore has to carry a Schwann cell arm and an axonal arm
  rather than choosing one, and the entry is built that way.

  DNM2 is also the gene for autosomal dominant centronuclear myopathy, and the relationship
  between the two diseases is the mechanistically interesting part: current evidence suggests
  the CNM variants make dynamin-2 hyperactive, with elevated GTPase and fission activity,
  while the CMT variants impair lipid binding and reduce activity. Same gene, opposite
  directions, different tissue. The entry records that asymmetry with `functional_impact_category`
  rather than leaving it as prose, but the underlying claim is a proposal in a review, not a
  settled result, and the node says so.

  Two extra features are worth knowing because they are not what a clinician expects from a
  CMT: asymptomatic neutropenia and early-onset cataracts, the former cosegregating with
  variants at Lys558 specifically.

  A note on the sources. The GeneReviews chapter for this disease, PMID:20614582, has been
  **retired** - its own first line says so - and is cited here only for the clinical
  description, with each such evidence item flagged. That is a real limitation of this entry:
  the authoritative clinical summary for CMTDIB is an archival document, and dismech has no
  structured way to record that a cited source has been withdrawn.
disease_term:
  preferred_term: Charcot-Marie-Tooth disease dominant intermediate B
  term:
    id: MONDO:0011674
    label: Charcot-Marie-Tooth disease dominant intermediate B
parents:
- Charcot-Marie-Tooth Disease
references:
- reference: PMID:20614582
  title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
  tags:
  - GeneReviews
notes: >-
  Source status. The GeneReviews chapter for this disease (PMID:20614582) is retired. Its
  cached abstract opens "NOTE: THIS PUBLICATION HAS BEEN RETIRED. THIS ARCHIVAL VERSION IS FOR
  HISTORICAL REFERENCE ONLY, AND THE INFORMATION MAY BE OUT OF DATE." It is still the most
  complete clinical synthesis available for CMTDIB, so it is used - but every evidence item
  drawing on it says in its explanation that the source is retired, and where a peer-reviewed
  cohort paper states the same fact, that paper is cited instead.

  This is flagged prominently because nothing in the schema or the validators can express it.
  `reference_title` carries the retirement notice only because it happens to be part of the
  title string; a curator citing a different retired chapter whose title does not say so would
  leave no trace at all. A `tags: [retired]` marker was tried and rejected by the schema - the
  `ReferenceTag` enum permits exactly one value, `GeneReviews` - so the only place this can
  live is prose.

  Allelic disorders. DNM2 also causes autosomal dominant centronuclear myopathy, and is a
  modifier of the X-linked and autosomal recessive forms of CNM. Those are separate diseases
  and are not modelled here; the shared gene is treated as a mechanistic contrast in the
  pathophysiology rather than as subtypes of this entry.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous DNM2 variants. Most affected individuals have an affected parent; the
    proportion arising de novo is not known.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DI-CMTB is inherited in an autosomal dominant manner. Most individuals diagnosed with DI-CMTB have an affected parent. The proportion of cases caused by a heterozygous de novo pathogenic variant is unknown."
    explanation: >-
      States the inheritance mode and, honestly, the limit of what is known about de novo
      rates. Source is a retired GeneReviews chapter; the segregation is independently
      supported by the family studies cited elsewhere in this entry.
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation segregated with the neuropathy, indicating the causal character of this mutation."
    explanation: >-
      Independent, non-retired confirmation of dominant segregation in a 15-member affected
      family.
pathophysiology:
- name: DNM2 Variant Impairing Dynamin-2 Lipid Binding
  description: >-
    Heterozygous DNM2 variants, most of them in the pleckstrin homology domain, which is the
    membrane-binding module of the protein. Two further disease-causing positions are known
    outside it - one in the middle domain and the first reported in the proline-rich domain -
    so the PH domain is where most CMT variants fall rather than the only place they can.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  downstream:
  - target: Reduced Dynamin-2 Membrane Fission Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in contrast to the other Charcot-Marie-Tooth-related mutations in dynamin 2, which are all located in the pleckstrin homology domain, they were situated in the middle domain and proline-rich domain of dynamin 2, respectively. We report the first disease-causing mutation in the proline-rich domain of dynamin 2."
    explanation: >-
      Establishes the PH-domain clustering and the two documented exceptions, in a cohort of
      34 patients from six families.
  - reference: PMID:30426359
    reference_title: "Dynamin 2 (DNM2) as Cause of, and Modifier for, Human Neuromuscular Disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "CMT mutations could impair DNM2 lipid binding and activity"
    explanation: >-
      The proposed functional consequence, and the basis for the PARTIAL_LOSS_OF_FUNCTION
      category on this node. Graded PARTIAL and OTHER deliberately: the source is a review and
      its own wording is "could impair", so this is a proposal rather than a demonstrated
      result.
- name: Reduced Dynamin-2 Membrane Fission Activity
  description: >-
    Dynamin-2 oligomerises at the neck of membrane invaginations and severs them. Reduced
    activity impairs endocytosis and the vesicle traffic that depends on it. Because the
    protein is ubiquitously expressed, the consequences are not restricted to nerve - which is
    the most economical explanation for the neutropenia and cataracts that accompany the
    neuropathy in some families.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  biological_processes:
  - preferred_term: clathrin-dependent endocytosis
    modifier: DECREASED
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
  downstream:
  - target: Motor Axon Branching and Maintenance Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Schwann Cell Myelin Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Extraneural Dynamin-2 Dependence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30426359
    reference_title: "Dynamin 2 (DNM2) as Cause of, and Modifier for, Human Neuromuscular Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dynamin 2 (DNM2) belongs to a family of large GTPases that are well known for mediating membrane fission by oligomerizing at the neck of membrane invaginations."
    explanation: >-
      States the molecular function this node describes. Graded OTHER as a background
      statement of protein biology in a review.
- name: Motor Axon Branching and Maintenance Failure
  description: >-
    The axonal arm. Zebrafish expressing CMT-mutant human DNM2 mRNA show a total absence of
    secondary motor neuron branching - a more severe defect than the incorrect branching seen
    with CNM-mutant mRNA in the same experiment, which is the clearest available evidence that
    the two mutation classes are not simply degrees of one lesion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Length-Dependent Distal Axonal Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26842864
    reference_title: "Zebrafish as a Model to Investigate Dynamin 2-Related Diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Defects arose especially in secondary motor neuron formation, with incorrect branching in embryos injected with CNM-mutated mRNA, and total absence of branching in those injected with CMT-mutated mRNA."
    explanation: Direct model evidence for a motor axon branching defect specific to the CMT-type variant.
- name: Schwann Cell Myelin Dysfunction
  description: >-
    The demyelinating arm, inferred rather than directly demonstrated. It is included because
    the conduction velocities require it: values as low as 26 m/s are below the range a purely
    axonal neuropathy produces. No cited source in this entry demonstrates a primary Schwann
    cell lesion, so the node is deliberately thin and its upstream edge carries unknown
    intermediates.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  downstream:
  - target: Intermediate Nerve Conduction Slowing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "intermediate or axonal motor median nerve conduction velocities (NCV) ranging from 26 m/s to normal"
    explanation: >-
      Supports the existence of conduction slowing below the axonal range, which is the
      indirect basis for this node - not a demonstration of a Schwann cell lesion. Source is a
      retired GeneReviews chapter; the same velocity range is reported independently in
      PMID:19502294.
- name: Length-Dependent Distal Axonal Degeneration
  description: >-
    The final common path of the axonal arm: distal muscle weakness and atrophy with sensory
    loss, worst in the longest nerves, producing the pes cavus and depressed reflexes of a
    classical CMT phenotype.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "has a classic, mild to moderately severe Charcot-Marie-Tooth hereditary neuropathy phenotype that often includes pes cavus foot deformity, depressed tendon reflexes, distal muscle weakness and atrophy, and sensory loss"
    explanation: >-
      The clinical syndrome this node produces. Source is a retired GeneReviews chapter; the
      mild-to-moderate severity is independently confirmed in PMID:19502294.
- name: Intermediate Nerve Conduction Slowing
  description: >-
    Motor median NCV from about 26 m/s to normal - the electrophysiological signature that
    defines the "intermediate" designation and the reason this is a separate CMT category
    rather than a variant of CMT1 or CMT2.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our electrophysiological data indicate intermediate or axonal"
    explanation: >-
      Peer-reviewed cohort confirmation of the intermediate electrophysiology, cited in
      preference to the retired chapter for this claim.
- name: Extraneural Dynamin-2 Dependence
  description: >-
    DNM2 is ubiquitously expressed, and two non-neural features accompany the neuropathy in
    some families: asymptomatic neutropenia, which cosegregated with the neuropathy in two
    families carrying different variants at the same residue (Lys558), and early-onset
    cataracts. The residue-specific cosegregation is the strongest available hint that these
    are genotype-dependent consequences of the same protein defect rather than incidental
    findings - but neither the tissue mechanism nor the genotype correlation has been worked
    out, and a large Czech family with a different variant had neither feature.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, in the Australian and Belgian families, which carry two different mutations affecting the same amino acid (Lys558), Charcot-Marie-Tooth cosegregated with neutropaenia. In addition, early onset cataracts were observed in one of the Charcot-Marie-Tooth families."
    explanation: Documents both extraneural features and the residue-specific pattern of the neutropenia.
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No additional symptoms such as cranial nerve involvement, cataract, and signs of neutropenia or myopathy syndrome were observed in any member of the family yet."
    explanation: >-
      Graded PARTIAL because it supports the node's claim that these features are variable and
      genotype-dependent by providing the negative case - a 15-member family with a different
      variant and neither feature.

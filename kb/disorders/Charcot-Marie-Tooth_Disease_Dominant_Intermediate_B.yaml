  - name: Met580Thr
    description: >-
      Missense variant segregating with neuropathy in a large Czech family with variable onset and electrophysiology.
    evidence:
    - reference: PMID:22091729
      reference_title: Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Subsequent sequence analysis of the DNM2 gene in the index patient revealed a novel missense mutation
        p.Met580Thr.
      explanation: Identifies the allele found in the Czech pedigree.
      quote_role: PRIMARY_RESULT
  - name: Gly537Ser
    description: >-
      The heterozygous c.1609G>A variant was reported in two affected adult siblings and their symptomatic
      mother. The authors considered it clinically likely pathogenic based on segregation and predicted
      effects; no direct functional assay was supplied.
    evidence:
    - reference: PMID:35993408
      reference_title: 'A Novel Dynamin 2 Mutation Causing Dominant Intermediate Charcot-Marie-Tooth Neuropathy: Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Their mother possessed the same heterozygous missense DNM2 point mutation which was absent in
        their father (Figure 2), supporting our inference that DNM2 (c.1609 G>A) is causative of DI-CMTB
        in this family cohort.
      explanation: >-
        Primary family testing supports maternal transmission; this is the authors' inference rather than
        an independent ACMG classification.
      quote_role: PRIMARY_RESULT

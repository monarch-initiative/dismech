- name: Neutropenia
  category: Hematologic
  description: >-
    Asymptomatic neutropenia, cosegregating with the neuropathy in two families carrying
    different variants at Lys558. Absent in families with other variants, so this is
    genotype-dependent rather than a general feature.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the Australian and Belgian families, which carry two different mutations affecting the same amino acid (Lys558), Charcot-Marie-Tooth cosegregated with neutropaenia"
    explanation: Documents the neutropenia and its residue-specific cosegregation.
- name: Early-Onset Cataract
  category: Ophthalmologic
  description: >-
    Cataracts noted in childhood, typically before age 15, in some families. Not a feature a
    clinician would expect in a CMT, which is why it is worth modelling explicitly.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early onset cataracts were observed in one of the Charcot-Marie-Tooth families"
    explanation: Peer-reviewed report of the cataracts, cited in preference to the retired chapter.
genetic:
- name: DNM2
  notes: >-
    Encodes dynamin-2. CMT-associated variants cluster in the pleckstrin homology domain, with
    documented exceptions in the middle and proline-rich domains. Variants at Lys558 are
    associated with cosegregating neutropenia.

    The allelic relationship with centronuclear myopathy is the mechanistically notable point
    and is deliberately kept as a contrast rather than merged into this entry: the proposal in
    the literature is that CNM variants make the protein hyperactive while CMT variants reduce
    its activity, so the two diseases sit on opposite sides of normal.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis requires identification of a heterozygous pathogenic variant in DNM2, the only gene known to be associated with DI-CMTB."
    explanation: >-
      Establishes DNM2 as the sole known gene for this entity. Source is a retired GeneReviews
      chapter; independently supported by the cohort papers cited in this entry.
  - reference: PMID:30426359
    reference_title: "Dynamin 2 (DNM2) as Cause of, and Modifier for, Human Neuromuscular Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant mutations in the ubiquitously expressed DNM2 cause 2 discrete neuromuscular diseases: autosomal dominant centronuclear myopathy (ADCNM) and dominant intermediate Charcot-Marie-Tooth neuropathy (CMT)."
    explanation: Establishes the allelic relationship recorded in the notes above.
diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Motor median NCV in the intermediate or axonal range, roughly 26 m/s to normal. This is
    what places a patient in the intermediate category and prompts DNM2 testing rather than
    the CMT1A duplication that accounts for most CMT.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is suspected in individuals with typical findings of CMT hereditary neuropathy and intermediate or axonal motor median nerve conduction velocities (NCV) ranging from 26 m/s to normal."
    explanation: >-
      States the electrophysiological criterion. Source is a retired GeneReviews chapter; the
      intermediate electrophysiology is independently confirmed in PMID:19502294.
- name: DNM2 Sequencing
  description: Identification of a heterozygous pathogenic DNM2 variant confirms the diagnosis.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis requires identification of a heterozygous pathogenic variant in DNM2"
    explanation: States the confirmatory genetic test. Source is a retired GeneReviews chapter.
treatments:
- name: Orthoses and Assistive Devices
  description: >-
    Ankle-foot orthoses, forearm crutches or canes, and wheelchairs where needed. Given that
    only 3% of a 34-patient cohort were wheelchair-bound, the lower-tier devices carry most of
    the load in practice.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Length-Dependent Distal Axonal Degeneration
    description: Compensates for distal weakness; does not modify the underlying degeneration.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment may include ankle/foot orthoses, orthopedic surgery, forearm crutches or canes, wheelchairs, acetaminophen or nonsteroidal anti-inflammatory agents (NSAIDs) for musculoskeletal pain, and career and employment counseling."
    explanation: >-
      Management recommendation. Source is a retired GeneReviews chapter, so the specific
      recommendations should be checked against current CMT guidance before clinical use.
- name: Physical Therapy for Contracture Prevention
  description: >-
    Physiotherapy to prevent foot contractures and acquired deformity - framed in the source as
    prevention of secondary complications rather than symptomatic relief.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Length-Dependent Distal Axonal Degeneration
    description: Targets the musculoskeletal sequelae of denervation rather than the neuropathy itself.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical therapy to prevent foot contractures, acquired foot deformities, and difficulty walking."
    explanation: Prevention-of-secondary-complications recommendation. Source is a retired GeneReviews chapter.
- name: Avoidance of Neurotoxic Agents
  description: >-
    All drugs and agents known to be hazardous in peripheral neuropathies are to be avoided.
    The source states this as a category rather than a list, so no specific agent is bound.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Length-Dependent Distal Axonal Degeneration
    description: Avoids additional insult to an already compromised peripheral nerve.
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: All drugs or agents known to be hazardous for peripheral neuropathies."
    explanation: >-
      Agents-to-avoid recommendation. This one in particular should be checked against a
      current source, since the specific list of neurotoxic agents changes over time and this
      chapter is retired.
progression:
- phase: Onset
  age_range: 2 to 50 years (mean 16)
  notes: >-
    Age at onset is strikingly variable - a mean of 16 years across a 34-patient cohort, with
    a range spanning most of life. One family showed onset from age 12 to the fifth decade
    within the same variant, so the variability is not only between genotypes.
  evidence:
  - reference: PMID:19502294
    reference_title: "Phenotypic spectrum of dynamin 2 mutations in Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at onset was 16 years with a large variability ranging from 2 to 50 years."
    explanation: Cohort statement of onset age and its spread.
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a very broad range of the onset of clinical symptoms from an early onset around the age of 12 to the late onset during the fifth decade"
    explanation: >-
      Shows the same spread within a single family carrying one variant, which is what makes
      the variability intrafamilial rather than genotype-driven.
- phase: Established disease
  notes: >-
    Slowly progressive, without loss of ambulation in the reported family, and only 3% of a
    larger cohort wheelchair-bound. It is unusual for individuals with this disease to become
    wheelchair-bound.
  evidence:
  - reference: PMID:22091729
    reference_title: "Phenotypic variability in a large Czech family with a dynamin 2-associated Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progression was slow with no loss of ambulation."

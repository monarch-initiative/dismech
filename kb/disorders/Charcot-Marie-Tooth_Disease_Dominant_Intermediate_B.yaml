    term:
      id: HP:0001265
      label: Hyporeflexia
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pes cavus foot deformity, depressed tendon reflexes, distal muscle weakness and atrophy, and sensory loss"
    explanation: Named in the clinical description. Source is a retired GeneReviews chapter.
- name: Sensory Loss
  category: Neurologic
  description: Distal sensory impairment accompanying the motor involvement.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
  evidence:
  - reference: PMID:20614582
    reference_title: "DNM2-Related Intermediate Charcot-Marie-Tooth Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distal muscle weakness and atrophy, and sensory loss"
    explanation: >-
      Names the sensory loss. Bound to the modality-agnostic distal sensory impairment term

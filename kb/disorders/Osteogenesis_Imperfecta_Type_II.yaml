        degradation, and impair the formation of the extracellular matrix.
      explanation: >-
        Review of biochemical studies on patient cells stating that the mutant
        procollagen molecules produced by the dominant-negative mechanism are
        poorly secreted and more readily degraded.
  - target: Impaired Bone Mineralization
    description: >-

    causal_link_type: DIRECT
    description: >-
      Procollagen trimers that incorporate a mutant pro-alpha chain are poorly
      secreted and more susceptible to degradation, so the dominant-negative defect is
      expressed first as a failure of procollagen export.
    evidence:
    - reference: PMID:7643358

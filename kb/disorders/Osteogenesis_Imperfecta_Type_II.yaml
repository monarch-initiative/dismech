- name: Thoracic Restriction and Pulmonary Hypoplasia
  description: >
    Multiple rib fractures from severe bone fragility produce a small, bell-shaped
    thorax that mechanically restricts fetal lung growth. Defective collagen in
    pulmonary connective tissue may also directly impair alveolar development.
    The resulting pulmonary hypoplasia causes respiratory insufficiency at birth
    and is the proximate cause of perinatal lethality in OI type II.
  biological_processes:

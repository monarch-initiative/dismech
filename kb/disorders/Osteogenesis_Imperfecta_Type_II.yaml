    reference_title: "Pulmonary hypoplasia and osteogenesis imperfecta type II with defective synthesis of alpha I(1) procollagen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that biochemically regulated processes, as well as mechanical factors, may impeded pulmonary development in similar cases of OI type II."
    explanation: >-
      Establishes that both mechanical (thoracic restriction) and biochemical
      (collagen deficiency) mechanisms impair pulmonary development in OI type II,
      linking the molecular defect to the lethal phenotype.
  downstream:
  - target: Bell-Shaped Thorax
  - target: Pulmonary Hypoplasia
  - target: Respiratory Insufficiency
  - target: Perinatal Respiratory Failure
genetic:
- name: COL1A1
  association: Causative
  gene_term:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  relationship_type: CAUSATIVE
  notes: >
    Heterozygous glycine substitutions in the Gly-X-Y triple-helical domain of
    COL1A1 (encoding the pro-alpha1(I) chain, two copies of which assemble into
    each type I procollagen heterotrimer) are the predominant cause of perinatal
    lethal OI type II. Mutations closer to the C-terminus tend to be more severe
    due to C-to-N triple-helix propagation.
  evidence:
  - reference: PMID:7643358
    reference_title: "Perinatal lethal osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perinatal lethal osteogenesis imperfecta is the result of heterozygous mutations
      of the COL1A1 and COL1A2 genes that encode the alpha 1(I) and alpha 2(I) chains
      of type I collagen, respectively. Point mutations resulting in the substitution
      of Gly residues in Gly-X-Y amino acid triplets of the triple helical domain
      of
      the alpha 1(I) or alpha 2(I) chains are the most frequent mutations.
    explanation: >-
      Identifies heterozygous glycine substitutions in COL1A1 as a primary cause
      of perinatal lethal OI type II.
- name: COL1A2
  association: Causative
  gene_term:
    preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  relationship_type: CAUSATIVE
  notes: >
    Heterozygous glycine substitutions or in-frame splice/deletion variants in
    the Gly-X-Y triple-helical domain of COL1A2 (encoding the pro-alpha2(I)
    chain of type I collagen) act in a dominant-negative manner to cause
    perinatal lethal OI type II.
  evidence:
  - reference: PMID:7643358
    reference_title: "Perinatal lethal osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perinatal lethal osteogenesis imperfecta is the result of heterozygous mutations
      of the COL1A1 and COL1A2 genes that encode the alpha 1(I) and alpha 2(I) chains
      of type I collagen, respectively. Point mutations resulting in the substitution
      of Gly residues in Gly-X-Y amino acid triplets of the triple helical domain
      of
      the alpha 1(I) or alpha 2(I) chains are the most frequent mutations.
    explanation: >-
      Identifies heterozygous glycine substitutions in COL1A2 as a primary cause
      of perinatal lethal OI type II.

- name: Impaired Bone Mineralization
  description: >
    Structurally abnormal collagen prevents proper mineral deposition in bone
    matrix. The disorganized collagen fibrils cannot support normal hydroxyapatite
    crystal nucleation and growth, resulting in severe skeletal hypomineralization
    — diffusely decreased bone density, multiple prenatal fractures, and crumpled
    long bones with beaded ribs. This skeletal fragility underlies the lethal
    phenotype.

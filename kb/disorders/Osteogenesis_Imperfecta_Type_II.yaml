    persistently low serum alkaline phosphatase.
  evidence:
  - reference: PMID:20301329
    reference_title: "Hypophosphatasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal (severe): Characterized by restrictive lung disease, respiratory failure, vitamin B6-dependent seizures, hypercalcemia with high morbidity, and mortality"
    explanation: >-
      GeneReviews describes the severe perinatal form, whose respiratory
      failure and mortality overlap the presentation of OI type II.
  - reference: PMID:34884378
    reference_title: "Hypophosphatasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Persistently low serum alkaline phosphatase is the cardinal biochemical feature of the disease."
    explanation: >-
      Low serum alkaline phosphatase is the biochemical feature that separates
      hypophosphatasia from OI.
- name: Campomelic dysplasia
  disease_term:
    preferred_term: campomelic dysplasia
    term:
      id: MONDO:0007251
      label: campomelic dysplasia
  description: >-
    SOX9-related skeletal dysplasia with bowing of the lower limbs and sex
    reversal in males, usually fatal in the neonatal period from respiratory
    insufficiency.
  evidence:
  - reference: PMID:24800790
    reference_title: "Campomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Campomelic dysplasia is a rare hereditary congenital osteochondral
      dysplasia characterized by abnormal bowing of the lower limbs, sex reversal
      in males, and other skeletal and extraskeletal abnormalities. It is usually
      fatal in the neonatal period because of respiratory insufficiency.
    explanation: >-
      Describes the bowed lower limbs and neonatal respiratory death that

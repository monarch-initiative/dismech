datasets:
references:
- reference: PMID:20301472
  title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      COL1A1- and COL1A2-related osteogenesis imperfecta encompasses four major
      clinical types including perinatally lethal OI (type II), and is
      established by identifying a heterozygous pathogenic variant in COL1A1 or
      COL1A2.
    supporting_text: >-
      The diagnosis of COL1A1/COL1A2-OI is established in a proband with
      clinical and radiographic manifestations of OI by identification of a
      heterozygous in COL1A1 or COL1A2 by molecular genetic testing.
  - statement: >-
      Virtually 100% of probands with perinatally lethal OI represent simplex
      cases, with parental mosaicism accounting for up to 16% across
      COL1A1/COL1A2-OI families.
    supporting_text: >-
      virtually 100% of probands with progressively deforming or perinatally
      lethal OI represent simplex cases. A proband who appears to be the only
      affected family member may have COL1A1/COL1A2-OI as the result of a
      pathogenic variant that occurred de novo in the proband or as a
      postzygotic de novo event in a parent with gonadal (or somatic and
      gonadal) mosaicism. The overall rate of mosaicism is up to 16% in the
      parents of children with COL1A1/COL1A2-OI.
- reference: PMID:30725642
  title: "Osteogenesis Imperfecta."
  tags:
  - StatPearls
  findings:
  - statement: >-
      Severe forms of osteogenesis imperfecta present with crumpled ribs, a
      fragile cranium, and infantile long-bone fractures associated with high
      perinatal mortality.
    supporting_text: >-
      Clinical manifestations range from mild, nearly asymptomatic presentations
      to severe forms characterized by crumpled ribs, a fragile cranium, and
      long bone fractures in infancy, which are often incompatible with life and
      associated with increased perinatal mortality.

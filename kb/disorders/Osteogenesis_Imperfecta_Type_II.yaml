    reference_title: "Diagnosis of fetal osteogenesis imperfecta by multidisciplinary assessment: a retrospective study of 10 cases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results: By postnatal radiographic examination, five patients were diagnosed with type II OI and five were diagnosed with type III OI."
    explanation: >-
      Demonstrates that OI type III is the primary clinical and radiographic
      differential diagnosis for prenatal-onset severe OI.
- name: Thanatophoric dysplasia
  disease_term:
    preferred_term: thanatophoric dysplasia
    term:
      id: MONDO:0017042
      label: thanatophoric dysplasia
  description: >-
    FGFR3-related short-limb skeletal dysplasia that is typically lethal in the
    perinatal period, with micromelia, short ribs and a narrow thorax. Type 1
    has bowed femurs, and type 2 has straight femurs with cloverleaf skull.
  evidence:
  - reference: PMID:20301540
    reference_title: "Thanatophoric Dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thanatophoric dysplasia (TD) is a short-limb skeletal dysplasia that is typically lethal in the perinatal period."
    explanation: >-
      GeneReviews establishes TD as a perinatal lethal short-limb dysplasia,
      the reason it enters the prenatal differential of OI type II.
  - reference: PMID:20301540
    reference_title: "Thanatophoric Dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TD type 1 is characterized by micromelia with bowed femurs and,
      uncommonly, the presence of craniosynostosis of varying severity. TD type
      2 is characterized by micromelia with straight femurs and uniform presence
      of moderate-to-severe craniosynostosis with cloverleaf skull deformity.
    explanation: >-
      Gives the femoral and cranial features that characterize the two TD types.
- name: Achondrogenesis type II
  disease_term:
    preferred_term: achondrogenesis type II
    term:
      id: MONDO:0008702
      label: achondrogenesis type II
  description: >-
    COL2A1-related lethal skeletal dysplasia with severe micromelia. Unlike OI
    type II, skull ossification is normal while ossification of the pelvis and
    spine is decreased, and the short ribs are often without fractures.
  evidence:
  - reference: PMID:15054848
    reference_title: "Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achondrogenesis type II is a lethal skeletal dysplasia caused by new dominant mutations within the type II collagen gene (COL2A1)."
    explanation: >-
      Establishes achondrogenesis type II as a lethal COL2A1 (type II collagen)
      skeletal dysplasia.
  - reference: PMID:31523626
    reference_title: "Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skull ossification is normal in ACG2, alongside decreased ossification in
      the pelvis and spine. Rib fractures are common in ACG1A, whereas short ribs
      are often without fractures in ACG2
    explanation: >-
      States the radiographic features (normal skull ossification, poor pelvic
      and spinal ossification, unfractured ribs) that separate ACG2 from a
      fracturing hypomineralized phenotype such as OI type II.
- name: Perinatal lethal hypophosphatasia
  disease_term:
    preferred_term: perinatal lethal hypophosphatasia
    term:
      id: MONDO:0016605
      label: perinatal lethal hypophosphatasia
  description: >-
    ALPL-related perinatal form of hypophosphatasia with restrictive lung

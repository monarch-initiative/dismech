      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "inactivation of MRM2 or MRM3 in human cells by RNA interference results in respiratory incompetence as a consequence of diminished mitochondrial translation"
      explanation: Links diminished mitochondrial translation to respiratory failure in MRM2-depleted cells.
  evidence:
  - reference: PMID:25009282
    reference_title: MRM2 and MRM3 are involved in biogenesis of the large subunit of the mitochondrial ribosome.

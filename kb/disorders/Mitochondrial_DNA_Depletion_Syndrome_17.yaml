name: Mitochondrial DNA Depletion Syndrome 17
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
synonyms:
- MTDPS17
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 17
  term:
    id: MONDO:0032815
    label: mitochondrial DNA depletion syndrome 17
description: >
  Mitochondrial DNA depletion syndrome 17 (MTDPS17) is an autosomal recessive
  mitochondrial disorder caused by biallelic variants in MRM2, the
  mitochondrial rRNA methyltransferase that 2'-O-methylates uridine U1369 in
  the A-loop of the 16S mitochondrial rRNA, a component of the peptidyl
  transferase centre of the mitoribosome large subunit. Loss of MRM2 activity
  impairs large-subunit assembly and mitochondrial translation, producing
  combined respiratory chain (OXPHOS) deficiency. The index patient had
  childhood-onset, rapidly progressive encephalomyopathy with stroke-like
  episodes, refractory epilepsy, a complex hyperkinetic movement disorder and
  low plasma citrulline, a MELAS-like picture without the m.3243A>G variant;
  muscle showed multiple OXPHOS defects and partial reduction of mtDNA copy
  number. Two further families with progressive dystonia or a
  neurodevelopmental disorder with involuntary movements broaden the
  phenotype. Fewer than ten affected individuals in three families have been
  reported.
notes: >
  The "mtDNA depletion" in the name rests on one measurement: 40% residual mtDNA
  copy number in the index patient's muscle (PMID:28973171). The reporting
  authors state in their discussion that 40% lies above the conventional 30%
  threshold for clinically manifest mtDNA depletion and offer a secondary effect
  on mtDNA replication only as a hypothesis; no mtDNA measurement is reported
  for the two later families (PMID:36002240). The primary defect is in
  mitoribosome maturation and translation, not mtDNA maintenance, so the
  mtDNA-copy-number phenotype below is not wired to any mechanism node. No
  GeneReviews chapter names this disorder. No disease-specific treatment has
  been reported; the index patient's dyskinesia did not respond to levodopa and
  carbidopa.
parents:
- mitochondrial DNA depletion syndrome
- mitochondrial disease
pathophysiology:
- name: Biallelic MRM2 Loss of Function
  description: >
    Homozygous MRM2 variants have been reported in three families: the missense
    p.Gly189Arg (c.567G>A) at a residue conserved from E. coli RrmJ to human in
    the index MELAS-like patient, a donor splice-site variant c.8+1G>T that
    produces a frameshifted transcript in a subset of mRNAs in a dystonia
    family, and the missense p.Ala81Val in a family with a neurodevelopmental
    disorder. Yeast complementation showed that the allele carrying the
    equivalent of p.Gly189Arg cannot rescue respiration.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MRM2
    term:
      id: hgnc:16352
      label: MRM2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of 16S mt-rRNA U1369 2'-O-Methylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28973171
      reference_title: Defective mitochondrial rRNA methyltransferase MRM2 causes MELAS-like clinical syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a knockout yeast model for the orthologous gene that showed a defect in respiration and the reduction of the 2'-O-methyl modification at the equivalent position (U2791) in the yeast mitochondrial 21S rRNA."
      explanation: >
        Loss of the yeast orthologue reduces methylation at the residue
        equivalent to human U1369, linking MRM2 loss to the missing
        modification. Shown in yeast, not in patient tissue.
  evidence:
  - reference: PMID:28973171
    reference_title: Defective mitochondrial rRNA methyltransferase MRM2 causes MELAS-like clinical syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted exome sequencing of genes encoding the mitochondrial proteome identified a damaging mutation, c.567 G > A, affecting a highly conserved amino acid residue (p.Gly189Arg) of the MRM2 protein."
    explanation: Identifies the MRM2 missense variant in the index patient.
  - reference: PMID:28973171
    reference_title: Defective mitochondrial rRNA methyltransferase MRM2 causes MELAS-like clinical syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complementation with the mrm2 allele carrying the equivalent yeast mutation failed to rescue the respiratory phenotype, which was instead completely rescued by expressing the wild-type allele."
    explanation: >
      Functional evidence in yeast that the patient variant is loss of
      function.
  - reference: PMID:36002240
    reference_title: "MRM2 variants in families with complex dystonic syndromes: evidence for phenotypic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the MRM2 c.8+1G>T allele, an aberrant alternative acceptor splice-site located within exon 2 was used in a subset of the transcripts, creating a frameshift in the open reading frame."
    explanation: >
      The splice-site variant in the second family yields frameshifted MRM2
      transcripts, consistent with partial loss of function.
- name: Loss of 16S mt-rRNA U1369 2'-O-Methylation
  description: >
    MRM2 is the 2'-O-ribose methyltransferase for uridine U1369 of human 16S
    mitochondrial rRNA, a residue in the A-loop of the peptidyl transferase
    centre that contacts aminoacyl-site tRNA. Loss of MRM2 activity removes
    this modification.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: rRNA (uridine-2'-O-ribose)-methyltransferase activity
    term:
      id: GO:0008650
      label: rRNA (uridine-2'-O-ribose)-methyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: rRNA 2'-O-methylation
    term:
      id: GO:0000451
      label: rRNA 2'-O-methylation
    modifier: DECREASED
  downstream:
  - target: Defective Mitoribosome Large Subunit Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25009282
      reference_title: MRM2 and MRM3 are involved in biogenesis of the large subunit of the mitochondrial ribosome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Ineffective translation in MRM2- and MRM3-depleted cells results from aberrant assembly of the large subunit of the mitochondrial ribosome (mt-LSU)."
      explanation: >
        MRM2 knockdown in human cells disrupts mt-LSU assembly. Knockdown removes
        the protein as well as its catalytic activity, so this supports the
        edge from loss of MRM2 function to the assembly defect without
        isolating the methyl mark itself.
  evidence:
  - reference: PMID:25074936
    reference_title: "Assignment of 2'-O-methyltransferases to modification sites on the mammalian mitochondrial large subunit 16 S ribosomal RNA (rRNA)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MRM1, MRM2, and RNMTL1 are responsible for modification of human large subunit rRNA at residues G(1145), U(1369), and G(1370), respectively."
    explanation: Assigns U1369 of the human 16S rRNA as the MRM2 modification site.
  - reference: PMID:28973171
    reference_title: Defective mitochondrial rRNA methyltransferase MRM2 causes MELAS-like clinical syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "encodes an enzyme responsible for 2'-O-methyl modification at position U1369 in the human mitochondrial 16S rRNA"
    explanation: Restates the MRM2 enzymatic function in the disease report.
- name: Defective Mitoribosome Large Subunit Assembly
  description: >
    The 16S rRNA A-loop modified by MRM2 and its neighbour MRM3 is part of the
    peptidyl transferase centre, and MRM2 acts during late maturation of the
    mitoribosome large subunit together with the GTPase GTPBP5. Without MRM2
    the large subunit assembles aberrantly.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial large ribosomal subunit assembly
    term:
      id: GO:1902775
      label: mitochondrial large ribosomal subunit assembly
    modifier: DECREASED
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25009282
      reference_title: MRM2 and MRM3 are involved in biogenesis of the large subunit of the mitochondrial ribosome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ineffective translation in MRM2- and MRM3-depleted cells results from aberrant assembly of the large subunit of the mitochondrial ribosome (mt-LSU)."
      explanation: States that the translation defect results from the mt-LSU assembly defect.
  evidence:
  - reference: PMID:25009282
    reference_title: MRM2 and MRM3 are involved in biogenesis of the large subunit of the mitochondrial ribosome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MRM2 and MRM3 are human mitochondrial methyltransferases involved in the modification of 16S rRNA and are important factors for the biogenesis and function of the large subunit of the mitochondrial ribosome."
    explanation: Places MRM2 in mt-LSU biogenesis.
  - reference: PMID:32652011
    reference_title: Human GTPBP5 (MTG2) fuels mitoribosome large subunit maturation by facilitating 16S rRNA methylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MRM2, the methyltransferase that catalyzes the modification of the 16S mt-rRNA A-loop U1369 residue"
    explanation: >
      Names MRM2 among the large-subunit factors that GTPBP5 crosslinks with
      during mt-LSU maturation.
- name: Impaired Mitochondrial Translation
  description: >
    Defective large-subunit biogenesis lowers synthesis of the 13 mtDNA-encoded
    respiratory chain subunits.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:

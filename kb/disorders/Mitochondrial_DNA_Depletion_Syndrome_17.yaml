- name: Combined OXPHOS Deficiency
  description: >
    Reduced mitochondrial translation causes deficiency of several respiratory
    chain complexes. In the index patient's muscle complexes I and IV were
    severely affected. Patient fibroblasts grown in standard medium did not
    show the defect, which the authors attribute to the tissue specificity of
    mitochondrial translation disorders.
  biological_scale: CELLULAR

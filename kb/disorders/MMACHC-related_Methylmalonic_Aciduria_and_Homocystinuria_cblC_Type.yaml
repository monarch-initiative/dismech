      snippet: Compounds receiving hydroxocobalamin intramuscular injection monotherapy had age-appropriate psychomotor performance and normal ophthalmological examinations. In contrast, c.271dupA homozygotes showed marked psychomotor retardation, retinopathy and feeding problems despite penta-therapy
      explanation: Comparative cohort study demonstrates a milder clinical and ophthalmic course and strong hydroxocobalamin response in c.158T>C/c.271dupA compound heterozygotes compared with c.271dupA homozygotes.
  - name: c.80A>G (p.Gln27Arg)

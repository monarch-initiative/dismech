- population: Global
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    cblC deficiency is a rare disorder overall but represents the most common inborn error of intracellular
    vitamin B12 metabolism worldwide and the most common type of methylmalonic acidemia in China.
  evidence:

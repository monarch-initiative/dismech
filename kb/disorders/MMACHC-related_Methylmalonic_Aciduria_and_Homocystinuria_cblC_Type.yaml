      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Genetic analysis identified 52 MMACHC variants, with c.482G>A (34.3%) and c.609G>A (17.6%) being most frequent.
      explanation: Multicenter study of 156 late-onset cblC patients in northern China confirms c.482G>A as the most frequent allele in late-onset disease.
  - name: c.158T>C (p.Leu53Pro)
    description: >-
      Missense MMACHC variant associated with mild clinical and biochemical phenotypes and marked response
      to intramuscular hydroxocobalamin monotherapy even when compound heterozygous with truncating c.271dupA.

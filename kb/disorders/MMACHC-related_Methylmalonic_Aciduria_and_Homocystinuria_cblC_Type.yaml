progression:
- phase: Prenatal, neonatal, or infantile onset (early-onset cblC)
  age_range: Prenatal to <1 year
  notes: >-
    Early-onset disease can manifest in utero with nonimmune hydrops, cardiomyopathy, and intrauterine
    growth restriction, or in neonates and infants with poor feeding, microcephaly, hypotonia, seizures,
    hemolytic uremic syndrome, and infantile maculopathy. Even with newborn screening and early hydroxocobalamin
    initiation (median 9 days of life), developmental impairment and ocular manifestations remain frequent.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of initial presentation of cblC spans a wide range: In utero with fetal presentation of nonimmune hydrops, cardiomyopathy, and intrauterine growth restriction."
    explanation: GeneReviews chapter documents prenatal and early infantile onset features of cblC deficiency.
  - reference: PMID:41728752
    reference_title: Impact of Early Intervention on the Developmental and Ocular Outcome of Patients With Cobalamin C Deficiency Identified Through Newborn Screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite early intervention, a substantial proportion of individuals exhibited developmental impairments or ocular manifestations, and neonatal onset appears to be associated with disease severity.
    explanation: Longitudinal newborn-screening cohort demonstrates that neonatal onset is associated with greater disease severity and persistent developmental or ocular morbidity.
- phase: Childhood, adolescent, or adult onset (late-onset cblC)
  age_range: ">1 year to adulthood"
  notes: >-
    Late-onset disease presents after 1 year of age (ranging into the seventh decade) with heterogeneous
    neuropsychiatric abnormalities, spastic paraparesis/spinal cord degeneration, cognitive decline, renal
    thrombotic microangiopathy, or pulmonary hypertension. Diagnostic delay is common and is an independent
    risk factor for incomplete recovery, although prompt high-dose hydroxocobalamin and betaine therapy
    often yields marked biochemical and clinical improvement.
  evidence:
  - reference: PMID:37770946
    reference_title: "Late-onset cblC defect: clinical, biochemical and molecular analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The age of onset ranged from 2 to 32.8 years old (median age 8.6 years, mean age 9.4 years). The time between first symptoms and diagnosis ranged from a few days to 20 years (median time 2 months, mean time 20.7 months).
    explanation: Cohort of 85 late-onset cblC patients characterizes onset distribution and substantial diagnostic delay.
  - reference: PMID:41341912
    reference_title: "Clinical and genetic characteristics of late-onset cobalamin C deficiency: A multicenter study in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cohort (95 males, 61 females) had a median onset age of 16 years (range: 2-65). Common symptoms included spastic paralysis (41.0%), mental and behavioral abnormalities (36.5%), and renal damage (28.8%)."
    explanation: Multicenter cohort of 156 late-onset patients documents onset through adulthood and predominant neurological, psychiatric, and renal presentations.
treatments:
- name: Hydroxocobalamin therapy
  description: 'Parenteral hydroxocobalamin is the central disease-modifying therapy for cblC deficiency, including during acute metabolic decompensation and thromboembolic complications. Higher-dose regimens are associated with better biochemical and neurodevelopmental outcomes in early-onset disease and with rapid metabolic correction in late-onset adults.

    '
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Reduced methylcobalamin supply
    treatment_effect: RESTORES
    description: Hydroxocobalamin improves homocysteine and methionine values, consistent with correcting the methylcobalamin/remethylation branch.
    evidence:
    - reference: PMID:39152755
      reference_title: "Improved biochemical and neurodevelopmental profiles with high-dose hydroxocobalamin therapy in cobalamin C defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Biochemical analyses revealed better values of homocysteine, methionine and methylmalonic acid in Group A compared to Group B1 (p < 0.01, p < 0.05 and p < 0.01, respectively) and B2 (p < 0.001, p < 0.01 and p < 0.001, respectively).
      explanation: High-dose hydroxocobalamin improved remethylation-linked metabolites in treated children.
  - target: Reduced adenosylcobalamin supply
    treatment_effect: RESTORES
    description: Hydroxocobalamin improves methylmalonic acid values, consistent with correcting the adenosylcobalamin/mutase branch.
    evidence:
    - reference: PMID:39152755
      reference_title: "Improved biochemical and neurodevelopmental profiles with high-dose hydroxocobalamin therapy in cobalamin C defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Biochemical analyses revealed better values of homocysteine, methionine and methylmalonic acid in Group A compared to Group B1 (p < 0.01, p < 0.05 and p < 0.01, respectively) and B2 (p < 0.001, p < 0.01 and p < 0.001, respectively).
      explanation: High-dose hydroxocobalamin improved methylmalonic acid in treated children, supporting impact on the adenosylcobalamin-dependent branch.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early institution of injectable hydroxocobalamin improves survival and may reduce but not completely prevent primary manifestations.
    explanation: GeneReviews chapter identifies parenteral hydroxocobalamin as the primary therapy that improves survival and reduces primary disease manifestations.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Critically ill individuals must be stabilized, preferably in consultation with a metabolic specialist, by treating acidosis, reversing catabolism, and initiating parenteral hydroxocobalamin.
    explanation: GeneReviews chapter specifies parenteral hydroxocobalamin alongside acidosis and catabolism reversal as acute management for critically ill patients.
  - reference: PMID:39152755
    reference_title: "Improved biochemical and neurodevelopmental profiles with high-dose hydroxocobalamin therapy in cobalamin C defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study showed that "high-dose" OH-Cbl treatment in NBS-diagnosed children with severe early-onset Cbl-C defect led to a significant improvement in the metabolic profile and in neurocognitive outcome, compared to age-matched patients treated with a "low-dose" regimen.
    explanation: Early-onset treatment cohort directly supports better metabolic and neurocognitive outcomes with higher-dose hydroxocobalamin.
  - reference: PMID:32071835
    reference_title: "High-dose hydroxocobalamin achieves biochemical correction and improvement of neuropsychiatric deficits in adults with late onset cobalamin C deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A regimen of high-dose hydroxocobalamin (25 mg/day) together with betaine and folic acid resulted in rapid and sustainable biochemical correction, resolution of psychosis, improvement of neurological functions, and amelioration of brain and spinal cord lesions.
    explanation: Adult late-onset series directly supports strong clinical and biochemical benefit from intensified hydroxocobalamin-based therapy.
- name: Betaine supplementation
  description: 'Betaine is used as adjunctive remethylation therapy together with hydroxocobalamin-based regimens, including for thromboembolic complications such as hemolytic-uremic syndrome and thrombotic microangiopathy.

    '

  variants:
  - name: c.482G>A (p.Arg161Gln)
    description: 'Recurrent MMACHC variant associated with later-onset, milder disease, lower mortality, and better neurological outcomes than comparison cohorts lacking this allele.

      '
    evidence:
    - reference: PMID:38070096

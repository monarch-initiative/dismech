    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of cobalamin metabolism" under category
      "Disorders of vitamin and cofactor metabolism". MMACHC encodes the intracellular cobalamin processing
      protein required for methylcobalamin and adenosylcobalamin synthesis.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic germline pathogenic variants in MMACHC cause cblC deficiency; at conception, each sibling of
    an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier,
    and a 25% chance of being unaffected and not a carrier. Clinical presentation and age of onset show
    marked variable expressivity from prenatal hydrops to adult-onset neuropsychiatric or renal disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The majority of disorders of intracellular cobalamin metabolism are inherited in an autosomal recessive manner.
    explanation: GeneReviews chapter states autosomal recessive inheritance for intracellular cobalamin metabolism disorders except X-linked HCFC1.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews genetic counseling guidance documents the 25%/50%/25% sibling recurrence and carrier risks at conception for autosomal recessive intracellular cobalamin disorders.
  - reference: PMID:39225018
    reference_title: "Evaluation of the clinical, biochemical, and molecular spectrum of Cobalamin C (CblC) defect in 33 patients from Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cobalamin C is the most common inborn error of intracellular cobalamin metabolism caused by biallelic pathogenic variants in the MMACHC gene, leading to impaired conversion of dietary vitamin B12 into its two metabolically active forms, methylcobalamin and adenosylcobalamin.
    explanation: Human cohort abstract confirms that cblC deficiency is caused by biallelic pathogenic variants in MMACHC.
has_subtypes:
- name: Early onset
  display_name: Early-onset cblC deficiency
  description: 'Neonatal or infantile presentation, often detected by newborn screening, with persistent risk of developmental and ocular morbidity despite early treatment.

    '
  evidence:
  - reference: PMID:39152755
    reference_title: "Improved biochemical and neurodevelopmental profiles with high-dose hydroxocobalamin therapy in cobalamin C defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We assessed OH-Cbl therapy impact on biochemical, neurocognitive and visual outcomes in early-onset Cbl-C patients treated with different OH-Cbl doses over 3 years.
    explanation: Supports early-onset cblC as a clinically recognized disease subset with distinct neurocognitive and visual outcome questions.
- name: Late onset
  display_name: Late-onset cblC deficiency
  description: 'Presentation after infancy, frequently with neuropsychiatric, renal, or cardiovascular manifestations and delayed diagnosis due to heterogeneous symptoms.

    '
  evidence:
  - reference: PMID:37770946
    reference_title: "Late-onset cblC defect: clinical, biochemical and molecular analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with late-onset form (>1 year) are often misdiagnosed due to heterogeneous symptoms.
    explanation: Directly supports late-onset cblC as a clinically distinct presentation stratum.
pathophysiology:
- name: MMACHC intracellular cobalamin processing deficiency
  description: 'Biallelic MMACHC pathogenic variants impair intracellular processing (reductive decyanation and dealkylation) and binding of dietary cobalamin, preventing synthesis of its two metabolically active cofactor forms.

    '

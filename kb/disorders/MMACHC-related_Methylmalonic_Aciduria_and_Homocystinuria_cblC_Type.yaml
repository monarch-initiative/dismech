      snippet: Betaine is used to lower homocysteine as a substrate for betaine‐homocysteine methyltransferase, which can convert homocysteine into methionine.
      explanation: Human clinical report background describes the mechanism by which betaine bypasses impaired cobalamin-dependent remethylation.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment of thromboembolic complications (e.g., HUS and thrombotic microangiopathy) includes initiation of hydroxocobalamin (OHCbl) and betaine or an increase in their doses.
    explanation: GeneReviews chapter recommends initiating or increasing hydroxocobalamin and betaine for thromboembolic complications including hemolytic-uremic syndrome and thrombotic microangiopathy.
  - reference: PMID:32071835
    reference_title: "High-dose hydroxocobalamin achieves biochemical correction and improvement of neuropsychiatric deficits in adults with late onset cobalamin C deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A regimen of high-dose hydroxocobalamin (25 mg/day) together with betaine and folic acid resulted in rapid and sustainable biochemical correction, resolution of psychosis, improvement of neurological functions, and amelioration of brain and spinal cord lesions.
    explanation: Adult late-onset cohort supports betaine as part of an effective remethylation-focused treatment regimen.
- name: Avoidance of dietary methionine and protein restriction
  description: >-
    Unlike isolated methylmalonic acidemia, cblC deficiency causes hypomethioninemia; dietary protein intake
    below age-appropriate recommendations and methionine-free medical foods are contraindicated to avoid
    worsening methionine deficiency.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Prolonged fasting (longer than overnight without dextrose-containing intravenous fluids); dietary protein intake below the recommended dietary allowance for age or more than that prescribed by a metabolic specialist; methionine restriction including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide.
    explanation: GeneReviews chapter lists dietary protein restriction below the recommended allowance and methionine restriction (including methionine-free medical foods) among agents and circumstances to avoid in cblC deficiency.
- name: Avoidance of nitrous oxide and catabolic triggers
  description: >-
    Affected individuals should avoid prolonged fasting, dehydration, and catabolic stressors that precipitate
    metabolic decompensation, as well as the anesthetic nitrous oxide, which irreversibly inactivates
    cobalamin-dependent methionine synthase.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To prevent metabolic decompensations, affected persons are advised to avoid situations that result in catabolism, such as prolonged fasting and dehydration, and always remain on a weight-appropriate dose of hydroxocobalamin.
    explanation: GeneReviews chapter advises avoiding catabolic triggers such as prolonged fasting and dehydration while maintaining weight-appropriate hydroxocobalamin dosing.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Prolonged fasting (longer than overnight without dextrose-containing intravenous fluids); dietary protein intake below the recommended dietary allowance for age or more than that prescribed by a metabolic specialist; methionine restriction including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide.
    explanation: GeneReviews chapter explicitly lists prolonged fasting and the anesthetic nitrous oxide as exposures to avoid.
- name: Newborn screening
  description: 'Presymptomatic identification through newborn screening improves outcome, especially when treatment begins within the first days of life.

    '
  treatment_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:40981307
    reference_title: "Milder Form of Cobalamin C Disease May Be Missed by Newborn Screening: The Importance of Methylmalonic Acid Assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This approach allows for early diagnosis and immediate treatment with hydroxocobalamin in patients with mild CblC deficiency, resulting in early intervention, effective metabolic control, and, based on current follow-up, normal neurodevelopmental outcomes.
    explanation: Newborn-screening study directly supports screening as a management intervention that changes timing of diagnosis and outcome.
- name: Ophthalmologic monitoring
  description: 'Close serial ophthalmologic examination alongside routine neurologic and cardiac surveillance is warranted because retinal degeneration may begin in the first months of life before obvious visual deprivation.

    '
  treatment_term:
    preferred_term: eye examination

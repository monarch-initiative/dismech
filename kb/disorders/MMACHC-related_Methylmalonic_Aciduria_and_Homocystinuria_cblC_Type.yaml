      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Routine ophthalmologic, neurologic, and cardiac evaluations may also be appropriate.
    explanation: GeneReviews surveillance guidance recommends routine ophthalmologic, neurologic, and cardiac evaluations.
  - reference: PMID:40565527
    reference_title: "Retinal Changes in Early-Onset cblC Methylmalonic Acidemia Identified Through Expanded Newborn Screening: Highlights from a Case Study and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We recommend initiating therapy immediately after biochemical diagnosis, along with close ophthalmological monitoring, before the appearance of any signs.
    explanation: Ophthalmic case study directly recommends close eye monitoring because retinal injury can emerge early despite treatment.
notes: 'cblC disease should be curated as a distinct combined cobalamin-processing disorder rather than being collapsed into isolated methylmalonic acidemia or generic homocystinuria. The central mechanistic split is failure to supply methylcobalamin and adenosylcobalamin, which creates parallel remethylation and methylmalonyl-CoA mutase defects. Early biochemical control improves outcome, but ocular disease is notably treatment-resistant relative to systemic metabolites. Variant-specific heterogeneity is substantial; c.482G>A and c.158T>C tend to mark a milder or later-onset disease course, whereas severe early-onset disease remains common in cohorts dominated by truncating alleles such as c.271dupA.

  '

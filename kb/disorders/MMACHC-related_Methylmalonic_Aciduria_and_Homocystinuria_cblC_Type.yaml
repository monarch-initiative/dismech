      explanation: Cohort of 26 cblC patients with pulmonary hypertension identifies c.80A>G as the most frequent allele.
  features: 'MMACHC encodes the intracellular cobalamin-processing protein required to generate both methylcobalamin and adenosylcobalamin. Disease severity is strongly modified by genotype, with recurrent missense variants such as c.482G>A and c.158T>C associated with later onset or milder phenotypes and better hydroxocobalamin responsiveness, whereas homozygosity for truncating alleles such as c.271dupA is associated with severe early-onset neurodevelopmental and retinal morbidity.


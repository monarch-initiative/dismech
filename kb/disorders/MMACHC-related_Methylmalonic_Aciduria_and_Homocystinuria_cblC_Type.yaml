diagnosis:
- name: Newborn screening with second-tier methylmalonic acid assessment
  description: 'Expanded newborn screening can identify cblC presymptomatically, but mild disease may be missed if follow-up relies only on first-tier C3 markers without second-tier MMA measurement.

    '
  evidence:
  - reference: PMID:40981307
    reference_title: "Milder Form of Cobalamin C Disease May Be Missed by Newborn Screening: The Importance of Methylmalonic Acid Assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Notably, three infants had completely normal C3 levels and ratios during the second screening test, yet they showed MMA levels above the cut-off value (2 µmol/L), enabling a diagnosis of otherwise undetectable mild CblC cases.
    explanation: Directly supports second-tier MMA testing as necessary to avoid missing mild cblC on newborn screening.
- name: Plasma and urine methylmalonic acid and total homocysteine measurement
  description: >-
    Measurement of methylmalonic acid in urine and blood together with plasma total homocysteine is the
    mainstay of biochemical diagnostic testing for intracellular cobalamin metabolism disorders.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total homocysteine (tHcy) level are the mainstays of biochemical testing.
    explanation: GeneReviews chapter identifies blood/urine methylmalonic acid and plasma total homocysteine measurement as the primary biochemical diagnostic workup.
- name: MMACHC molecular genetic testing
  description: >-
    Definitive diagnosis of cblC deficiency is established by identifying biallelic pathogenic variants in
    MMACHC on molecular genetic testing, distinguishing cblC from other intracellular cobalamin complementation groups.
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is confirmed by identification of biallelic pathogenic variants in one of the following genes (associated complementation groups indicated in parentheses): MMACHC (cblC), MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ), THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which can show a cblC complementation class)."
    explanation: GeneReviews chapter specifies that molecular identification of biallelic MMACHC pathogenic variants confirms the diagnosis of cblC deficiency.
differential_diagnoses:
- name: Other disorders of intracellular cobalamin metabolism
  description: >-
    Combined methylmalonic aciduria and homocystinuria or isolated remethylation defects can also arise
    from defects in lysosomal cobalamin export (LMBRD1/cblF, ABCD4/cblJ), downstream trafficking (MMADHC/cblD),
    cytosolic remethylation (MTR/cblG, MTRR/cblE), or transcriptional regulators of MMACHC (HCFC1/cblX,
    THAP11, ZNF143). Molecular genetic testing distinguishes MMACHC-related cblC from these complementation
    groups.
  distinguishing_features:
  - Biallelic pathogenic variants in MMACHC confirm cblC deficiency and exclude MMADHC (cblD), LMBRD1 (cblF), ABCD4 (cblJ), and X-linked HCFC1 (cblX).
  - Complementation and molecular genetic testing distinguish MMACHC (cblC) from MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ), THAP11 (cblX-like), ZNF143 (cblX-like), and X-linked HCFC1 (cblX).
  evidence:
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is confirmed by identification of biallelic pathogenic variants in one of the following genes (associated complementation groups indicated in parentheses): MMACHC (cblC), MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ), THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which can show a cblC complementation class)."
    explanation: GeneReviews chapter lists the genetic differential diagnosis of intracellular cobalamin metabolism disorders and their complementation groups.
- name: Acquired or nutritional vitamin B12 deficiency
  description: >-
    Dietary or malabsorptive vitamin B12 deficiency can mimic cblC deficiency biochemically (elevated
    methylmalonic acid and total homocysteine) and clinically (megaloblastic anemia, subacute combined
    degeneration, neuropsychiatric symptoms), but serum vitamin B12 concentration is typically normal
    or elevated in cblC deficiency.
  distinguishing_features:
  - Serum vitamin B12 concentration is typically normal or elevated in cblC deficiency, whereas it is low in nutritional or malabsorptive vitamin B12 deficiency.
  - Persistent elevation of methylmalonic acid and total homocysteine despite normal serum B12 prompts plasma tHcy/MMA and MMACHC molecular testing.
  evidence:
  - reference: PMID:32071835
    reference_title: "High-dose hydroxocobalamin achieves biochemical correction and improvement of neuropsychiatric deficits in adults with late onset cobalamin C deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial evaluations of adults with new onset of neuropsychiatric symptoms often include serum vitamin B12 levels. However, serum vitamin B12 level are often normal in cblC, and serum tHcy and MMA levels are not routinely ordered to evaluate for an intracellular vitamin B12 metabolism defect.
    explanation: Adult late-onset cblC series highlights normal serum vitamin B12 concentration as a key diagnostic pitfall distinguishing intracellular cblC deficiency from nutritional vitamin B12 deficiency.

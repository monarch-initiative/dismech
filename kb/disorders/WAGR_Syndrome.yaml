- name: Somatic biallelic WT1 inactivation in renal precursor cells
  description: >
    In a WT1-driven tumor route, a renal precursor clone loses the remaining WT1
    function through somatic copy-neutral 11p loss of heterozygosity or through
    an independent somatic WT1 alteration. In the heterogeneous hereditary and
    bilateral cohort, 43 of 53 tumors used copy-neutral LOH and 10 were compound
    heterozygous; importantly, compound-heterozygous alterations occurred
    preferentially with large WAGR or other structural WT1 variants. The 43/53
    aggregate therefore must not be interpreted as evidence that LOH predominates
    specifically in WAGR. In the subset using 11p LOH, concomitant imprinted IGF2
    activation and subsequent WNT-pathway activation provide a route to tumor
    growth.

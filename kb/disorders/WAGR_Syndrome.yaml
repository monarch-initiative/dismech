    reference_title: "Distinct pathways for genetic and epigenetic predisposition in familial and bilateral Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete loss of WT1 function in tumors was due to somatic copy-neutral LOH of 11p in 43/53 samples, while 10 were compound heterozygous with 6 truncating mutations, 2 missense substitution or in-frame insertion variants, and 2 deletions of C-terminal exons (exons 6–10 or 7–10). These compound heterozygous alterations occurred preferentially in tumors with large (WAGR) or small structural WT1 variants that may prevent a reduction to homozygosity."
    explanation: >
      This complete result distinguishes the two somatic routes and explicitly
      cautions against assigning the mixed-cohort LOH proportion to WAGR, whose
      structural variants preferentially followed the compound-heterozygous route.
  - reference: PMID:40340749
    reference_title: "Distinct pathways for genetic and epigenetic predisposition in familial and bilateral Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second WT1 hit occurred independently on both sides in all 11 informative bilateral cases"
    explanation: >
      Independent second hits in paired bilateral tumors support separate somatic

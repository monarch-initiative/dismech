  evidence:
  - reference: PMID:20301534
    reference_title: "PAX6 Aniridia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive treatment: Multidisciplinary care by specialists in ophthalmology who are familiar with management of PAX6 aniridia syndrome (i.e., correction of refractive errors; use of tinted or photochromic lenses; occlusion therapy in childhood for anisometropic amblyopia or strabismic amblyopia; caution regarding surgical procedures to decrease the likelihood or exacerbation of aniridic-related keratopathy (ARK) and/or severe aniridic fibrosis syndrome (AFS); cautious use of lensectomy to attempt to improve visual acuity in those with cataracts because of associated foveal hypoplasia; use of topical anti-glaucoma medication to manage glaucoma when possible; methods to treat corneal opacification)."
    explanation: >
      This complete management statement directly supports refractive correction,
      tinted lenses, amblyopia therapy, cautious surgery/lensectomy, glaucoma
      medication, and corneal treatment without extending beyond the source.
- name: WAGRO weight monitoring and preventive lifestyle guidance
  description: >
    For individuals whose deletion includes BDNF, monitor weight more vigilantly
    and provide early family guidance about dietary intake and physical activity.
    This is preventive supportive care based on the obesity-prone WAGRO phenotype,
    not evidence for a disease-modifying pharmacologic treatment.

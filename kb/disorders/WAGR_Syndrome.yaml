inheritance:
- name: Autosomal dominant contiguous-gene deletion, typically de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    WAGR spectrum disorder is autosomal dominant but is usually caused by a de
    novo 11p13 deletion. Rarely, an unaffected parent carries a predisposing
    chromosome rearrangement or mosaicism, so parental genomic and chromosome
    testing is important for recurrence-risk counseling.
  evidence:
  - reference: PMID:41818601
    reference_title: "WAGR Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WAGR spectrum disorder is an autosomal dominant disorder typically caused by a de novo 11p13 deletion"
    explanation: >
      GeneReviews establishes the inheritance mode and the usual de novo origin.
  - reference: PMID:41818601
    reference_title: "WAGR Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, an unaffected parent of a proband with WAGR spectrum disorder has a predisposing chromosome rearrangement"
    explanation: >
      This documents the uncommon parental structural-rearrangement mechanism
      that makes parental testing relevant despite the usually de novo origin.
prevalence:
- population: Worldwide literature estimate

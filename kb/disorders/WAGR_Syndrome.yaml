diagnosis:
- name: Molecular copy-number testing for an 11p13 deletion
  description: >
    Confirm WAGR spectrum disorder by demonstrating a chromosome 11p13 deletion
    that includes both WT1 and PAX6. A chromosomal microarray or another validated
    molecular copy-number method can define the deletion and determine whether it
    extends to BDNF or other neighboring genes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41818601
    reference_title: "WAGR Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of WAGR spectrum disorder is established in a proband with suggestive findings and a deletion of chromosome 11p13 that includes the genes WT1 and PAX6 identified by molecular genetic testing"
    explanation: >
      GeneReviews defines the molecular diagnostic criterion: deletion of both
      WT1 and PAX6, rather than aniridia or a WT1 alteration alone.
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A geneticist can determine the most appropriate molecular analyses to be performed, as a variety of molecular tests have been suggested for these patients and often a combination of multiple methods is needed for an accurate diagnosis"
    explanation: >
      The syndrome-specific care model supports individualized copy-number and
      chromosome testing when a single assay does not fully define the lesion.
- name: Evaluation of aniridia for WAGR tumor risk
  description: >
    Congenital or early-onset aniridia should trigger prompt genetics assessment
    for a deletion involving both PAX6 and WT1. Until WAGR is excluded, manage the
    patient as potentially at risk for Wilms tumor rather than assuming isolated
    PAX6-related aniridia.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients suspected for WAGR spectrum should be considered at risk for WT development and receive renal ultrasounds every 3 months while the diagnostic work-up occurs"
    explanation: >
      This supports provisional tumor-risk management during molecular work-up
      when aniridia raises concern for WAGR spectrum disorder.
differential_diagnoses:
- name: Isolated PAX6-related aniridia
  description: >
    PAX6-related aniridia can reproduce the ocular phenotype but lacks the
    contiguous WT1 deletion and therefore does not confer the WAGR-associated
    Wilms tumor risk.
  distinguishing_features:
  - A pathogenic PAX6 variant or isolated PAX6 deletion without WT1 involvement supports isolated PAX6-related aniridia.
  - A deletion encompassing both PAX6 and WT1 supports WAGR spectrum disorder and changes tumor surveillance.
  evidence:
  - reference: PMID:33146894
    reference_title: "Clinical characteristics and outcomes of children with WAGR syndrome and Wilms tumor and/or nephroblastomatosis: The 30-year SIOP-RTSG experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic diagnosis of WAGR syndrome requires the involvement of both WT1 and the aniridia gene PAX6 in the deletion, whereas patients with isolated PAX6 deletions are not at risk of developing WT"
    explanation: >
      This directly distinguishes isolated PAX6 deletion from the two-gene WAGR
      deletion by both genotype and tumor risk.
- name: WT1-related tumor predisposition or nephropathy
  description: >
    Germline WT1 variants or smaller deletions can cause Wilms tumor
    predisposition, nephropathy, or differences of sex development without the
    PAX6-related pan-ocular aniridia phenotype that defines WAGR.
  distinguishing_features:
  - A pathogenic WT1 variant or WT1-limited deletion without PAX6 involvement supports a WT1-related disorder.
  - Pan-ocular aniridia plus a deletion of both WT1 and PAX6 supports WAGR spectrum disorder.
  evidence:
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The WT1-related tumor predisposition syndromes, however, are distinct from WAGR syndrome which involves a large germline deletion spanning a larger section of the chromosomal region and includes both WT1 and PAX6"
    explanation: >
      The AACR update explicitly distinguishes limited WT1-related conditions
      from the multigene WT1-PAX6 deletion defining WAGR.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Heterozygous Bdnf knockout
  category: Heterozygous knockout
  genes:
  - preferred_term: BDNF
    term:
      id: hgnc:1033
      label: BDNF
  associated_phenotypes:
  - Hyperphagia
  - Obesity
  - Decreased nociception
  - Impaired learning and social behavior
  description: >
    Heterozygous Bdnf knockout mice reproduce the hyperphagia and obesity seen in
    BDNF-deleted WAGRO and show learning and social-behavior changes. The model
    isolates Bdnf dosage and therefore cannot reproduce the WT1/PAX6 tumor,
    genitourinary, or ocular arms of the human contiguous-gene deletion.
  evidence:
  - reference: PMID:23517654
    reference_title: "Association of brain-derived neurotrophic factor (BDNF) haploinsufficiency with lower adaptive behaviour and reduced cognitive functioning in WAGR/11p13 deletion syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous Bdnf knockout mice exhibit hyperphagia, obesity, decreased nociception, and impaired learning and social behaviours"
    explanation: >
      This summarizes the model phenotype overlapping the metabolic and
      neurobehavioral BDNF-deletion arm of WAGRO.
  - reference: PMID:18753648
    reference_title: "Brain-derived neurotrophic factor and obesity in the WAGR syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice that are heterozygous for inactivated BDNF have a 50% reduction in hypothalamic expression of BDNF, and they have hyperphagia and obesity, which are reversed by intracerebroventricular infusions of BDNF"
    explanation: >
      The dosage, phenotype, and BDNF-rescue result support a direct BDNF
      energy-homeostasis mechanism in the mouse.
discussions:
- discussion_id: gap_wagr_bdnf_mouse_contiguous_deletion_translation
  prompt: >
    Which metabolic and neurobehavioral effects of the human BDNF-deleted WAGRO
    phenotype are attributable specifically to BDNF dosage, and which require
    other genes in the variably sized 11p deletion or human developmental context?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#BDNF haploinsufficiency and hypothalamic energy dysregulation
  rationale: >
    Heterozygous Bdnf knockout mice provide strong directional support for the
    hyperphagia-obesity mechanism and show learning and social-behavior changes.
    Human WAGRO, however, is a variably sized contiguous-gene deletion that always
    also removes WT1 and PAX6 and may remove additional neurodevelopmental genes.
    The mouse therefore supports BDNF-specific dosage biology but cannot by itself
    assign every human cognitive, adaptive, or autism-related feature to BDNF, and
    it does not model the renal-tumor, genitourinary, or ocular syndrome arms.
  evidence:
  - reference: PMID:23517654
    reference_title: "Association of brain-derived neurotrophic factor (BDNF) haploinsufficiency with lower adaptive behaviour and reduced cognitive functioning in WAGR/11p13 deletion syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous Bdnf knockout mice exhibit hyperphagia, obesity, decreased nociception, and impaired learning and social behaviours"
    explanation: >
      The model recapitulates several BDNF-associated traits but is a single-gene
      perturbation rather than the human contiguous deletion.
  - reference: PMID:23517654
    reference_title: "Association of brain-derived neurotrophic factor (BDNF) haploinsufficiency with lower adaptive behaviour and reduced cognitive functioning in WAGR/11p13 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the aetiology of cognitive impairment, which is quite variable among individuals with WAGR syndrome, has not been well elucidated"
    explanation: >-
      Human evidence explicitly preserves uncertainty about assigning variable
      cognition to one deleted gene.

- name: BDNF haploinsufficiency and hypothalamic energy dysregulation
  description: >
    When the 11p deletion extends distally to BDNF (11p14.1), brain-derived
    neurotrophic factor dosage is reduced. BDNF acts in hypothalamic circuits
    regulating energy homeostasis, and its haploinsufficiency produces hyperphagia
    and childhood-onset obesity, defining the WAGRO subtype. Serum BDNF is roughly
    halved in deletion carriers. BDNF deletion is also associated with lower
    cognitive and adaptive-behavior scores within WAGR syndrome. Apparent
    differences in autism-interview social scores disappeared after adjustment
    for cognitive function, and clinician-assigned ASD did not differ
    significantly by BDNF deletion status; ASD is therefore not assigned as a
    BDNF-specific downstream outcome.

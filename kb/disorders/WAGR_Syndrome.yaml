treatments:
- name: Wilms tumor surveillance
  action_category: SCREENING
  description: >
    Begin renal ultrasound at birth or diagnosis and repeat every three months
    through the seventh birthday. This schedule targets the early-childhood risk
    window in which at least 95% of predisposition-associated Wilms tumors occur.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For WT screening, we propose initiating screening at birth (or upon diagnosis of the specific syndrome) with renal ultrasound every 3 months up to the child's 7th birthday"
    explanation: >
      The 2024 AACR update gives the exact start point, modality, interval, and
      stopping age for Wilms tumor surveillance.
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we recommend a standard surveillance strategy using ultrasounds every three months in early childhood until the 7th birthday, to cover the reported age range in which 95% of WT develop"
    explanation: >
      This supports both the three-month interval and the reported 95% coverage
      of the age-defined tumor-risk window.
  - reference: PMID:33146894
    reference_title: "Clinical characteristics and outcomes of children with WAGR syndrome and Wilms tumor and/or nephroblastomatosis: The 30-year SIOP-RTSG experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intensive monitoring of toxicity and surveillance of the remaining kidney(s) are advised"
    explanation: >
      The SIOP-RTSG cohort advises ongoing surveillance of remaining kidney tissue
      in WAGR patients given the high rate of bilateral disease.
- name: Extended kidney-health surveillance
  action_category: SCREENING
  description: >
    Continue kidney-health monitoring into adolescence and adulthood after
    tumor-focused screening ends. Follow-up should assess blood pressure,
    urinalysis/proteinuria, kidney function, and imaging as individualized by
    nephrology. Registry authors propose at least annual renal ultrasound across
    the lifetime, but the precise adult interval remains a care-model proposal
    rather than a trial-tested schedule.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional screening to evaluate kidney health should extend into adolescence and beyond"
    explanation: >
      AACR guidance distinguishes extended kidney-health monitoring from the
      finite childhood tumor-surveillance schedule.
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients should at least receive annual RUS to monitor for CKD risk"
    explanation: >
      The WAGR registry care model proposes a minimum annual renal ultrasound
      after the high-risk childhood period; the record preserves its proposal
      status rather than presenting it as experimentally validated.
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Routine monitoring of kidney function and cardiometabolic health is warranted, and specific monitoring schedules can be determined by the care team"
    explanation: >
      This supports individualized functional and cardiometabolic follow-up in
      addition to the registry's proposed imaging schedule.
- name: Cardiometabolic monitoring
  action_category: SCREENING
  description: >
    Measure growth and weight trajectory, blood pressure, and other routine
    biometric markers at primary-care visits, with urine or serum testing and
    referral to nephrology, cardiology, endocrinology, or weight management when
    abnormalities emerge.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all patients with WAGR should receive routine biometric screening at all visits from their pediatrician and/or primary care provider"
    explanation: >
      The syndrome-specific care model recommends routine cardiometabolic
      surveillance because obesity, hypertension, and CKD frequently cluster.
- name: Wilms tumor surgical resection
  description: >
    Surgical resection of Wilms tumor may use nephron-sparing surgery or total
    nephrectomy. Kidney preservation is especially relevant because bilateral
    disease and later chronic kidney disease are common.
  treatment_term:
    preferred_term: nephrectomy

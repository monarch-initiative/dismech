- name: WT1 haploinsufficiency and Wilms tumor predisposition
  description: >
    Loss of one WT1 allele removes a copy of the WT1 zinc-finger transcription
    factor that is essential for normal nephrogenesis and gonadal development.
    Constitutional haploinsufficiency predisposes to Wilms tumor and contributes
    to genitourinary malformations and later glomerular/kidney dysfunction. The
    constitutional deletion creates susceptibility; complete somatic WT1
    inactivation in a renal precursor is represented separately because the
    second-hit mechanism varies among tumors.
  gene:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  cell_types:
  - preferred_term: nephrogenic blastemal cell
    term:
      id: CL:0000354
      label: blastemal cell
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: kidney development
    term:
      id: GO:0001822
      label: kidney development
    modifier: DECREASED
  - preferred_term: gonad development
    term:
      id: GO:0008406
      label: gonad development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18753648
    reference_title: "Brain-derived neurotrophic factor and obesity in the WAGR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haploinsufficiency of the WT1 and PAX6 genes on chromosome 11p13"
    explanation: >
      WT1 haploinsufficiency in the contiguous deletion is the basis of the Wilms
      tumor and genitourinary components of WAGR syndrome.
  downstream:
  - target: Somatic biallelic WT1 inactivation in renal precursor cells
    description: >
      Constitutional loss of one WT1 copy creates a substrate in which an
      independently acquired somatic event can eliminate the remaining WT1
      function in a renal precursor clone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40340749
      reference_title: "Distinct pathways for genetic and epigenetic predisposition in familial and bilateral Wilms tumor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complete loss of WT1 function in tumors was due to somatic copy-neutral LOH of 11p in 43/53 samples, while 10 were compound heterozygous"

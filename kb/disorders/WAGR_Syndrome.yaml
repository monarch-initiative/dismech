progression:
- phase: Early-childhood Wilms tumor risk window
  age_range: Birth to the seventh birthday
  notes: >
    Wilms tumor and nephroblastomatosis usually arise in early childhood. In a
    30-year WAGR cohort, the median presentation age was 22 months and most
    tumors were asymptomatic findings on surveillance.
  evidence:
  - reference: PMID:33146894
    reference_title: "Clinical characteristics and outcomes of children with WAGR syndrome and Wilms tumor and/or nephroblastomatosis: The 30-year SIOP-RTSG experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at WT/nephroblastomatosis presentation was 22 months (range, 6-44 months). The majority of the tumors were asymptomatic and were detected by surveillance (27 of 39 [69.2%])"
    explanation: >
      This defines the early-childhood tumor window and demonstrates the value
      of presymptomatic surveillance.
- phase: Later kidney disease risk
  age_range: Childhood through adulthood
  notes: >
    Chronic kidney disease can emerge years after Wilms tumor treatment or in
    individuals without a tumor history. Kidney-health surveillance therefore
    continues after tumor-focused screening ends and into adulthood.
  evidence:
  - reference: PMID:33146894
    reference_title: "Clinical characteristics and outcomes of children with WAGR syndrome and Wilms tumor and/or nephroblastomatosis: The 30-year SIOP-RTSG experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5 of these 20 patients (25%), a decreased eGFR, proteinuria (2+), or both were reported, with the age of onset varying from 3 to 16 years"
    explanation: >
      Longitudinal cohort data demonstrate kidney impairment emerging across
      childhood and adolescence.
  - reference: PMID:39320341
    reference_title: "Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann Syndrome and Other Predisposition Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional screening to evaluate kidney health should extend into adolescence and beyond"
    explanation: >
      The 2024 AACR surveillance update explicitly extends kidney-health
      monitoring beyond the childhood tumor-surveillance window.
- phase: Outcomes after WAGR-associated Wilms tumor
  age_range: Five years after Wilms tumor diagnosis
  notes: >
    In the tumor-enriched SIOP-RTSG WAGR cohort, five-year event-free survival
    was 84.3% and overall survival was 91.2%. These are outcome estimates among
    affected children with Wilms tumor, not survival estimates for all people
    with WAGR syndrome.
  evidence:
  - reference: PMID:33146894
    reference_title: "Clinical characteristics and outcomes of children with WAGR syndrome and Wilms tumor and/or nephroblastomatosis: The 30-year SIOP-RTSG experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with WT, the 5-year event-free survival rate was 84.3% (95% confidence interval, 72.4%-98.1%), and the overall survival rate was 91.2% (95% confidence interval, 82.1%-100%)."
    explanation: >
      The cohort directly reports five-year event-free and overall survival for
      WAGR-associated Wilms tumor.
has_subtypes:
- name: WAGR
  display_name: WAGR syndrome (BDNF intact)
  description: >
    Classic WAGR syndrome with an 11p13 deletion encompassing WT1 and PAX6 but
    sparing BDNF. Affected individuals show Wilms tumor predisposition, aniridia,
    genitourinary anomalies, and a range of developmental delay without the severe
    childhood-onset obesity characteristic of the WAGRO subtype.
  evidence:
  - reference: PMID:18753648
    reference_title: "Brain-derived neurotrophic factor and obesity in the WAGR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significantly higher BMI z scores throughout childhood than did patients with intact BDNF"
    explanation: >
      Genotype-stratified BMI data distinguish BDNF-intact classic WAGR from the
      BDNF-deleted obesity-prone WAGRO subgroup without implying that obesity can
      never occur when BDNF is intact.
- name: WAGRO
  display_name: WAGRO syndrome (BDNF-deleted)
  description: >
    Extended-deletion subtype in which the 11p deletion reaches distally to include
    BDNF at 11p14.1. BDNF haploinsufficiency adds hyperphagia and childhood-onset
    Obesity to the WAGR phenotype, giving the WAGRO acronym.
  evidence:
  - reference: PMID:23266638
    reference_title: "The modifier effect of the BDNF gene in the phenotype of the WAGRO syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are susceptible to Wilms tumor, aniridia, mental retardation, genitourinary anomalies and obesity (WAGRO syndrome)"
    explanation: >
      This report documents the WAGRO label for the obesity-associated extension
      of the WAGR phenotype.
  - reference: PMID:18753648
    reference_title: "Brain-derived neurotrophic factor and obesity in the WAGR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among persons with the WAGR syndrome, BDNF haploinsufficiency is associated with lower levels of serum BDNF and with childhood-onset obesity"
    explanation: >
      Direct genotype-phenotype analysis supports BDNF deletion as the molecular
      basis of childhood-onset obesity in the WAGRO subtype.
pathophysiology:
- name: 11p13 contiguous-gene deletion
  description: >
    WAGR syndrome results from a heterozygous, variably sized interstitial deletion
    at chromosome 11p13 that simultaneously removes multiple contiguous genes,
    obligately including WT1 and PAX6. Because the deletion is the unifying lesion,
    the specific genes lost (and therefore the clinical features) depend on deletion
    extent; larger deletions reaching BDNF produce the WAGRO obesity subphenotype.
  evidence:
  - reference: PMID:41818601
    reference_title: "WAGR Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a deletion of chromosome 11p13 that includes the genes WT1 and PAX6 identified by molecular genetic testing"
    explanation: >
      The GeneReviews diagnostic criterion confirms that a contiguous 11p13 deletion
      removing both WT1 and PAX6 defines the disorder.
  - reference: PMID:18753648
    reference_title: "Brain-derived neurotrophic factor and obesity in the WAGR syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous, variably sized, contiguous gene deletions causing haploinsufficiency of the WT1 and PAX6 genes on chromosome 11p13"
    explanation: >
      Confirms the contiguous-gene deletion mechanism and the variability in
      deletion size that underlies the phenotypic spectrum.
  - reference: PMID:34970513
    reference_title: "Results From the WAGR Syndrome Patient Registry: Characterization of WAGR Spectrum and Recommendations for Care Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a broader phenotypic spectrum beyond the classic syndrome exists"
    explanation: >
      Registry data support reframing the contiguous-deletion disorder as a broad
      WAGR spectrum whose manifestations depend on the genes deleted.
  downstream:
  - target: WT1 haploinsufficiency and Wilms tumor predisposition

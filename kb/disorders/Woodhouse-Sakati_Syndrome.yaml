progression:
- age_range: Childhood through adulthood
  notes: >-
    Hair thinning begins in childhood and can progress to alopecia totalis;
    hypogonadism becomes evident at puberty. Neurologic disease usually begins
    in adolescence but is heterogeneous: a rapidly progressive subgroup
    develops severe disability over a mean of 7.4 years, whereas another
    subgroup has absent or mild neurologic involvement with preserved daily
    function. Dystonia and diabetes become more prevalent with age, so an
    initially mild examination does not exclude later complications.
  evidence:
  - reference: PMID:27489925
    reference_title: "Woodhouse-Sakati Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Virtually all individuals with Woodhouse-Sakati syndrome (WSS) have the endocrine findings of hypogonadism (evident at puberty) and progressive childhood-onset hair thinning that often progresses to alopecia totalis in adulthood
    explanation: >-
      GeneReviews defines the characteristic childhood-to-adult ectodermal and
      pubertal endocrine course.
  - reference: PMID:31726291
    reference_title: "Patterns of neurological manifestations in Woodhouse-Sakati Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A disabling, rapidly progressive pattern (NIS of 3-4; Type 1) was noted in eighteen patients (12 males, 6 females; 47.4%) with severe disability that occurs within a mean duration of 7.4 ± 3.6 years.
    explanation: >-
      This cohort quantifies the rapidly progressive neurologic trajectory.
  - reference: PMID:24464444
    reference_title: "Endocrine disorders in Woodhouse-Sakati syndrome: a systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients exhibited intellectual disabilities of varying severity (87 %), bilateral deafness (76 %), cervicofacial dystonia and limb pain (42 % of cases, rising to 89 % after 25 years) and diabetes (66 %, rising to 96 % after 25 years).
    explanation: >-
      The systematic review documents age-dependent increases in dystonia and
      diabetes among published cases.
mechanistic_hypotheses:
- hypothesis_group_id: dcaf17_crl4_proteostasis_model
  hypothesis_label: CRL4-DCAF17-dependent proteostasis model
  status: EMERGING
  description: >-
    An emerging model proposes that DCAF17 acts as a CRL4 ubiquitin-ligase
    substrate receptor and that loss of this function disrupts protein
    degradation. The direct experimental support is limited to Dcaf17-deficient
    golden-hamster spermatogenic cells. It has not established the causal bridge
    to human neurologic, endocrine, auditory, or ectodermal manifestations, and
    both the founding human study and a systematic endocrine review describe
    DCAF17 function or WSS pathophysiology as unresolved.
  evidence:
  - reference: PMID:39239833
    reference_title: "Single-cell RNA sequencing reveals the important role of Dcaf17 in spermatogenesis of golden hamsters."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data emphasize the significant regulatory role played by Dcaf17 in early spermatogenic cells, with many biological processes being affected, including spermatogenesis and protein degradation.
    explanation: >-
      The hamster model supplies organ- and cell-type-specific support for the
      proposed protein-degradation arm.
  - reference: PMID:24464444
    reference_title: "Endocrine disorders in Woodhouse-Sakati syndrome: a systematic review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathophysiology of WSS remains unclear.
    explanation: >-
      Human review literature explicitly bounds this model as an unresolved
      hypothesis rather than an established systemic mechanism.
pathophysiology:
- name: Biallelic DCAF17 loss and nucleolar involvement
  description: >-
    Biallelic loss-of-function variants in DCAF17 cause WSS. The founding human
    study localized the encoded protein to the nucleolus and observed a cellular
    phenotype in patient lymphoblasts that implicated nucleolar dysfunction,
    while explicitly describing the protein's function as unknown.
  genes:
  - preferred_term: DCAF17
    term:
      id: hgnc:25784
      label: DCAF17
  evidence:
  - reference: PMID:19026396
    reference_title: "Mutations in C2orf37, encoding a nucleolar protein, cause hypogonadism, alopecia, diabetes mellitus, mental retardation, and extrapyramidal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a founder mutation consisting of a single base-pair deletion in C2orf37 in eight families of Saudi origin. Three other loss-of-function mutations were subsequently discovered in patients of different ethnicities.
    explanation: >-
      The founding human genetic study establishes multiple disease-associated
      loss-of-function variants across families and ethnicities.
  - reference: PMID:19026396
    reference_title: "Mutations in C2orf37, encoding a nucleolar protein, cause hypogonadism, alopecia, diabetes mellitus, mental retardation, and extrapyramidal syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The gene encodes a nucleolar protein of unknown function, and the cellular phenotype observed in patient lymphoblasts implicates a role for the nucleolus in the pathogenesis of this disease.
    explanation: >-
      This is patient-derived lymphoblast cellular evidence for nucleolar
      involvement and explicitly preserves the unresolved normal function of
      DCAF17.
  downstream:
  - target: Unresolved multisystem tissue dysfunction
    description: >-
      Unknown intermediates connect DCAF17 loss and nucleolar involvement to
      the human multisystem phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Putative CRL4-dependent proteostasis disruption
    description: >-
      A model-organism study supports a possible CRL4/protein-degradation arm,
      but this edge has not been demonstrated in affected human tissues.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - dcaf17_crl4_proteostasis_model
    evidence:
    - reference: PMID:39239833
      reference_title: "Single-cell RNA sequencing reveals the important role of Dcaf17 in spermatogenesis of golden hamsters."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dcaf17, also known as DDB1- and CUL4-associated factor 17, is a member of the DCAF family and acts as the receptor for the CRL4 ubiquitin E3 ligase complex.
      explanation: >-
        Supports the proposed molecular role in hamster while leaving the human
        disease edge unconfirmed.
- name: Putative CRL4-dependent proteostasis disruption
  description: >-
    Dcaf17-deficient golden-hamster spermatogenic cells show transcriptional
    disruption of protein-degradation programs. This is curated as an emerging,
    model-specific mechanism and not as a settled explanation for human WSS.
  biological_processes:

discussions:
- discussion_id: wss_systemic_mechanism_gap
  prompt: >-
    Which nucleolar or CRL4-dependent molecular consequences of DCAF17 loss
    cause the human neurologic, endocrine, auditory, ectodermal, and imaging
    manifestations of Woodhouse-Sakati syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic DCAF17 loss and nucleolar involvement
  - pathophysiology#Unresolved multisystem tissue dysfunction
  rationale: >-
    Biallelic DCAF17 loss and nucleolar localization are established, but the
    intervening human molecular pathway is not. Assigning every manifestation
    to impaired CRL4 proteostasis would exceed the current organ-limited animal
    evidence and could misdirect biomarker or therapeutic development.
  proposed_experiments:
  - experiment_id: exp_wss_isogenic_multilineage_human_models
    name: Isogenic DCAF17 human multilineage functional comparison
    description: >-
      Compare DCAF17-null and isogenic-corrected human iPSC-derived neurons,
      pancreatic beta cells, pituitary endocrine cells, and hair-follicle cells
      using nucleolar morphology, ribosome-biogenesis, ubiquitin-proteomics,
      protein-turnover, and lineage-specific functional readouts. Concordant
      rescue by DCAF17 correction would identify which abnormalities bridge the
      genotype to multiple human tissues.
  evidence:
  - reference: PMID:19026396
    reference_title: "Mutations in C2orf37, encoding a nucleolar protein, cause hypogonadism, alopecia, diabetes mellitus, mental retardation, and extrapyramidal syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The gene encodes a nucleolar protein of unknown function, and the cellular phenotype observed in patient lymphoblasts implicates a role for the nucleolus in the pathogenesis of this disease.
    explanation: >-
      The founding study defines both the nucleolar clue and the unresolved
      molecular function that motivate this gap.
- discussion_id: wss_hamster_human_model_mismatch
  prompt: >-
    Does the Dcaf17-deficient male golden-hamster reproductive phenotype model
    the multisystem human syndrome, or only a tissue-specific role in
    spermatogenesis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Putative CRL4-dependent proteostasis disruption
  - phenotypes#Male infertility
  rationale: >-
    The model directly demonstrates infertility and altered
    protein-degradation programs in early spermatogenic cells, but the published
    abstract reports no neurologic, endocrine, auditory, ectodermal, or brain
    imaging characterization. It therefore cannot yet validate a systemic
    CRL4/proteostasis mechanism for human WSS.
  proposed_experiments:
  - experiment_id: exp_wss_hamster_multisystem_phenotyping
    name: Longitudinal multisystem phenotyping of Dcaf17-deficient hamsters
    description: >-
      Assess male and female mutants longitudinally for movement disorder,
      hearing, glucose and insulin secretion, thyroid and gonadal axes, hair
      loss, cognition, brain MRI iron and white-matter changes, and matched
      tissue proteostasis readouts to determine which human manifestations the
      model actually recapitulates.
  evidence:
  - reference: PMID:39239833
    reference_title: "Single-cell RNA sequencing reveals the important role of Dcaf17 in spermatogenesis of golden hamsters."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we created Dcaf17-deficient male golden hamsters using CRISPR-Cas9 technology; the results of which demonstrate that deletion of Dcaf17 led to abnormal spermatogenesis and infertility.
    explanation: >-
      The publication establishes reproductive recapitulation but does not
      establish multisystem human-disease recapitulation.

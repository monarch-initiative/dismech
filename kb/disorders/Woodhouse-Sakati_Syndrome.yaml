differential_diagnoses:
- name: Neurodegeneration with brain iron accumulation
  description: >-
    WSS is classified within the NBIA spectrum and shares progressive
    extrapyramidal movement disorder and brain iron accumulation with other
    NBIA disorders, but is distinguished by its prominent endocrine and
    ectodermal features (hypogonadism, alopecia, diabetes).
  distinguishing_features:
  - WSS combines a movement disorder with hypogonadism and progressive alopecia.
  - WSS is caused by biallelic DCAF17 variants rather than other NBIA genes.
  disease_term:
    preferred_term: neurodegeneration with brain iron accumulation
    term:
      id: MONDO:0018307
      label: neurodegeneration with brain iron accumulation
  evidence:
  - reference: PMID:38320940
    reference_title: "Woodhouse-Sakati syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Woodhouse-Sakati Syndrome (WSS) is one of the rarest NBIAs.
    explanation: >-
      This review places WSS within the NBIA spectrum, supporting NBIA disorders
      as the relevant differential category.
- name: Perrault syndrome
  description: >-
    Perrault syndrome overlaps WSS through sensorineural hearing loss and female
    gonadal dysfunction. Its defining combination is sensorineural hearing loss
    in both sexes with gonadal dysgenesis in females; molecular testing can
    distinguish genetically heterogeneous Perrault syndrome from DCAF17-related
    WSS.
  distinguishing_features:
  - Perrault syndrome is defined by sensorineural hearing loss in males and females and gonadal dysgenesis in females.
  - A molecular diagnosis in a Perrault-associated gene distinguishes it from biallelic DCAF17-related WSS.
  disease_term:
    preferred_term: Perrault syndrome
    term:
      id: MONDO:0017312
      label: Perrault syndrome
  evidence:
  - reference: PMID:32423379
    reference_title: "LARS2-Perrault syndrome: a new case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perrault syndrome is a rare recessive and genetically heterogeneous disorder characterized by sensorineural hearing loss in males and females and gonadal dysgenesis in females.
    explanation: >-
      The abstract directly defines the overlapping auditory and female gonadal
      phenotype and its genetic heterogeneity.
- name: Gordon Holmes syndrome
  description: >-
    Gordon Holmes syndrome overlaps WSS through hypogonadism and neurologic
    disease, but its defining neurologic pattern is early-onset ataxia with
    brisk reflexes rather than the characteristic WSS combination of dystonia,
    hearing loss, endocrine disease, and alopecia.
  distinguishing_features:
  - Gordon Holmes syndrome is defined by early-onset ataxia, hypogonadism, and brisk reflexes.
  - Its ataxia-predominant pattern with brisk reflexes differs from the dystonia-predominant WSS pattern.
  disease_term:
    preferred_term: Gordon Holmes syndrome
    term:
      id: MONDO:0008935
      label: cerebellar ataxia-hypogonadism syndrome
  evidence:
  - reference: PMID:24355708
    reference_title: "PNPLA6 mutations cause Boucher-Neuhauser and Gordon Holmes syndromes as part of a broad neurodegenerative spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Boucher-Neuhäuser and Gordon Holmes syndromes are clinical syndromes defined by early-onset ataxia and hypogonadism plus chorioretinal dystrophy (Boucher-Neuhäuser syndrome) or brisk reflexes (Gordon Holmes syndrome).
    explanation: >-
      The abstract directly defines the early ataxia, hypogonadism, and
      brisk-reflex pattern used to distinguish Gordon Holmes syndrome.
- name: Deafness-dystonia-optic neuronopathy syndrome
  description: >-
    TIMM8A-related deafness-dystonia-optic neuronopathy syndrome overlaps WSS
    through deafness and dystonia. Its X-linked inheritance and TIMM8A cause
    distinguish it from autosomal recessive DCAF17-related WSS.
  distinguishing_features:
  - DDON syndrome is an X-linked TIMM8A disorder characterized by early-onset deafness and dystonia.
  - TIMM8A testing and X-linked inheritance distinguish DDON from DCAF17-related WSS.
  disease_term:

  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate is available. A systematic review
    through June 2022 identified 185 affected individuals from 97 families in
    12 countries; ascertainment is concentrated in consanguineous families from
    the Greater Middle East and is not a population prevalence denominator.

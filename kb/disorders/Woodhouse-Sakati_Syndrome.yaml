    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The syndrome of deafness-dystonia is rare and refers to the association of hearing impairment and dystonia when these are dominant features of a disease. Known genetic causes include Mohr-Tranebjaerg syndrome, Woodhouse-Sakati syndrome, and mitochondrial disorders, but the cause frequently remains unidentified.
    explanation: >-
      This study directly places both Mohr-Tranebjaerg and Woodhouse-Sakati

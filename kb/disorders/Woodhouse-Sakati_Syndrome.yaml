- name: Genetic counseling and familial variant testing
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counsel families about autosomal recessive inheritance: when both parents
    are carriers, each sibling has a 25% chance of being affected, a 50% chance
    of being an asymptomatic carrier, and a 25% chance of being unaffected and
    not a carrier. Once familial DCAF17 variants are known, carrier testing,
    testing of at-risk siblings, prenatal testing, and preimplantation genetic
    testing are possible.

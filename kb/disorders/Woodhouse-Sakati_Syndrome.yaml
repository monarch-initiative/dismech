name: Woodhouse-Sakati Syndrome
creation_date: "2026-06-03T00:00:00Z"
description: >-
  Woodhouse-Sakati syndrome (WSS) is a rare autosomal recessive multisystem
  neuroendocrine disorder caused by biallelic pathogenic variants in DCAF17.
  DCAF17 is a nucleolar protein and a member of the DCAF family, but its normal
  human function and the mechanism linking its loss to the multisystem disease
  remain unresolved. Hypogonadism and childhood-onset progressive alopecia are
  characteristic; variably progressive neurologic manifestations include
  dystonia, dysarthria, dysphagia, sensorineural hearing loss, and intellectual
  disability. Diabetes mellitus, hypothyroidism, low circulating IGF-1, basal
  ganglia iron accumulation, and cerebral white-matter lesions are also
  recognized. WSS is classified within the neurodegeneration with brain iron
  accumulation (NBIA) spectrum, although MRI abnormalities are not universal.
category: Mendelian
parents:
- hereditary disease
- neurodegeneration with brain iron accumulation

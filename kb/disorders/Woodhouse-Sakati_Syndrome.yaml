- name: Multisystem surveillance
  action_category: MONITORING
  description: >-
    Monitor for hypogonadism beginning at age 12-14 years; diabetes and
    hypothyroidism beginning at age 20 years; serum IGF-1 every three to five
    years after diagnosis; dystonia, development, and audiology annually; and
    speech and swallowing as clinically indicated. People with dystonia should
    also avoid situations that materially increase fall risk.

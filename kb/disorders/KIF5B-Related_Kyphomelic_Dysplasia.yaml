  - reference: PMID:37934770
    reference_title: "Dominant negative variants in KIF5B cause osteogenesis imperfecta via down regulation of mTOR signaling."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Microscopy studies in human cells showed dilated endoplasmic reticulum,
      multiple intracellular vacuoles, and abnormal distribution of the Golgi
      complex, supporting an intracellular trafficking defect. RNA sequencing,
      proteomic analysis, and bone immunohistochemistry demonstrated down
      regulation of the mTOR signaling pathway that was partially rescued with
      leucine supplementation in patient cells.
    explanation: >-
      Demonstrates intracellular organelle trafficking disruption and reduced
      mTOR signaling in human fibroblasts and bone from an allelic KIF5B
      catalytic motor-domain skeletal disorder that shares the p.Thr195Lys
      variant.

      reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        kyphomelic dysplasia is categorized within the bent bone dysplasia group
        among other entities namely, Campomelic dysplasia (OMIM# 114290), Cumming
        syndrome (OMIM# 211890), and Stuve–Wiedemann syndrome (OMIM# 601559),
        Kyphomelic dysplasia with facial dysmorphism, KIF5B related (OMIM# 614592)
      explanation: >-
        Documents placement of KIF5B-related kyphomelic dysplasia in the ISDS
        bent bone dysplasia group.
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group", entry
      NOS 20-0040, listed there as "Kyphomelic dysplasia with facial
      dysmorphism, KIF5B-related" (AD, KIF5B). This dismech entry is that
      nosology entry. The nosology attaches MIM 211350 to it and adds the
      caveat that "the name 'kyphomelic dysplasia' has been applied to
      heterogeneous conditions"; MIM 211350 has since been resolved to the
      recessive CCN2-related form (PMID:39506047), which dismech curates
      separately as CCN2-related kyphomelic dysplasia. The group assignment
      here rests on the KIF5B gene-phenotype pairing named in the table, not on
      the MIM number.

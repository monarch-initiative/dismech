genetic:
- name: KIF5B
  gene_term:
    preferred_term: KIF5B
    term:
      id: hgnc:6324
      label: KIF5B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: De novo heterozygous in all four reported individuals
  notes: >-
    KIF5B (10p11.22) encodes the kinesin-1 heavy chain. The three reported
    pathogenic alleles — p.(Lys91Arg) recurring in two individuals,
    p.(Thr195Lys) and p.(Gly234Val) — all affect conserved residues in or near
    the ATPase-related motifs of the catalytic motor domain. Notably, de novo
    c.584C>A p.(Thr195Lys) has also been identified in a fetus (proband 4 in
    PMID:37934770) ascertained prenatally with osteopenia, skeletal
    hypomineralization, bent and short long bones, and hypoplastic and
    unossified vertebrae and pelvic bones without in utero fractures (whereas in
    utero fractures occurred in proband 3 carrying p.Gly90Ala), indicating
    allelic continuity across KIF5B motor-domain bent-bone and bone-fragility
    phenotypes. KIF5B disease belongs to the kinesinopathies, and this phenotype
    extends that spectrum.
  evidence:
  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants involved conserved amino acids in or close to the ATPase
      activity-related motifs in the catalytic motor domain of the KIF5B protein.
    explanation: >-
      Establishes the domain clustering of the pathogenic alleles.
  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Furthermore, alterations in kinesins cause various symptoms known as
      kinesinopathies, and our findings also extend the phenotypic spectrum of
      kinesinopathies.
    explanation: >-
      Places this gene-disease relationship within the kinesinopathy class.
  - reference: PMID:37934770
    reference_title: "Dominant negative variants in KIF5B cause osteogenesis imperfecta via down regulation of mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified de novo, heterozygous variants: c.269G>C,
      p.Gly90Ala (proband 3), and c.584C>A, p.Thr195Lys (proband 4) in KIF5B
      (NM_004521.2).
    explanation: >-
      Independently identifies the recurrent de novo c.584C>A p.(Thr195Lys)
      catalytic motor-domain variant in a prenatal skeletal dysplasia/osteogenesis
      imperfecta presentation.

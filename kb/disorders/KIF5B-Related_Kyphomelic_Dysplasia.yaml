name: KIF5B-related kyphomelic dysplasia
creation_date: "2026-08-22T00:00:00Z"
description: >-
  KIF5B-related kyphomelic dysplasia is a dominantly inherited bent-bone
  skeletal dysplasia caused by de novo heterozygous variants in KIF5B, which
  encodes the kinesin-1 heavy chain — the motor subunit that carries cargo along
  microtubules toward the cell periphery. It is one of two molecularly defined
  forms of kyphomelic dysplasia, the other being the recessive CCN2-related
  form. All reported variants alter conserved residues in or near the
  ATPase-related motifs of the catalytic motor domain, implicating motor
  function specifically rather than kinesin abundance. Affected individuals have
  sharp angulation of the femora and humeri, distinctive facial features and
  neonatal respiratory distress; postnatal osteoporosis with subsequent
  fractures and optic atrophy are features that distinguish this form from the
  CCN2 one. Because kinesins carry cargo in every cell type, this disorder also
  sits within the broader group of kinesinopathies.
category: Mendelian
parents:
- hereditary disease
synonyms:
- KIF5B-related kyphomelic dysplasia
- kyphomelic dysplasia, KIF5B type
- autosomal dominant kyphomelic dysplasia
- kyphomelic dysplasia, Itai-Ikegawa type
- KDII

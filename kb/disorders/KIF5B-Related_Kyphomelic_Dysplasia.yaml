- name: Disrupted Kinesin-1 Dependent Intracellular Transport
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Impaired kinesin-1 motor function disrupts anterograde microtubule-based
    transport of organelles (including mitochondria and lysosomes) and secretory
    cargo, with downstream effects on endoplasmic reticulum-Golgi organization,
    autophagy, and mTOR signaling demonstrated in allelic KIF5B motor-domain
    models. This node remains PROVISIONAL specifically for the kyphomelic
    dysplasia alleles because the founding report established variant clustering
    in the catalytic motor domain without directly measuring transport or cargo
    delivery in kyphomelic dysplasia patient cells, although p.(Thr195Lys) is
    shared with the experimentally characterized KIF5B motor-domain osteogenesis
    imperfecta spectrum.

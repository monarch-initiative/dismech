  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants involved conserved amino acids in or close to the ATPase
      activity-related motifs in the catalytic motor domain of the KIF5B protein.
    explanation: >-
      Establishes that the variants cluster in the catalytic motor domain,
      implicating motor function.
  - reference: PMID:37934770
    reference_title: "Dominant negative variants in KIF5B cause osteogenesis imperfecta via down regulation of mTOR signaling."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C. elegans heterozygous for the unc-116 Thr90Ile variant displayed abnormal
      body length and motility phenotypes that were suppressed by additional
      copies of the wild type allele, consistent with a dominant negative
      mechanism. Time-lapse imaging of GFP-tagged mitochondria showed defective
      mitochondria transport in unc-116 Thr90Ile neurons providing strong
      evidence for disrupted kinesin motor function.
    explanation: >-
      Demonstrates that an allelic catalytic motor-domain P-loop substitution in
      the KIF5B ortholog impairs kinesin-1 motor function via a dominant-negative
      mechanism, supporting the dominant-negative interpretation of motor-domain
      clustering in KIF5B skeletal dysplasia.

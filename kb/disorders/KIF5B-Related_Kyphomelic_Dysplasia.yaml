differential_diagnoses:
- name: CCN2-related kyphomelic dysplasia
  description: >-
    The other molecularly defined form under the same clinical label, and the
    primary differential. It is autosomal recessive rather than de novo dominant,
    arises in a matricellular protein controlling chondrocyte proliferation
    rather than in a microtubule motor, and characteristically includes cleft
    palate, micro-retrognathia and radial head dislocation while lacking the
    postnatal osteoporosis and optic atrophy of the KIF5B form.
  evidence:
  - reference: PMID:39506047
    reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the probands had short stature, cleft palate, and micro-retrognathia.
    explanation: >-
      Documents the craniofacial features characteristic of the CCN2 form.
discussions:
- discussion_id: kif5b_kd_transport_step_unevidenced
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do KIF5B kyphomelic dysplasia variants actually impair kinesin-1 dependent
    transport, and which cargo in which cell type accounts for the skeletal
    phenotype?
  attaches_to:
  - "pathophysiology#Disrupted Kinesin-1 Dependent Intracellular Transport"
  rationale: >-
    This is why the central node of this entry is PROVISIONAL. The variants'
    location in the ATPase motifs of the motor domain is a strong argument that
    motor function is impaired, but no motility, cargo-delivery or patient-cell
    transport assay has been reported for these alleles. Nor is it known why a
    ubiquitously expressed motor produces a phenotype concentrated in bone,
    which is the same tissue-specificity puzzle that recurs across the
    kinesinopathies. The osteoporosis-with-fractures arm makes the question
    sharper: bone fragility appearing after birth suggests an ongoing defect in
    osteoblast or osteoclast function rather than a purely developmental
    patterning error, and those are different cargo problems.
  proposed_experiments:
  - experiment_id: exp_kif5b_kd_single_molecule_motility
    name: Single-molecule motility assays of the patient alleles
    description: >-
      Purify recombinant KIF5B carrying p.(Lys91Arg), p.(Thr195Lys) and
      p.(Gly234Val) and measure ATPase rate, microtubule binding, velocity and
      run length against wild type, including mixed dimers to test for a
      dominant-negative effect on the wild-type subunit.
  - experiment_id: exp_kif5b_kd_osteoblast_cargo_transport
    name: Cargo transport in patient-derived bone cells
    description: >-
      Differentiate osteoblasts from patient-derived induced pluripotent stem
      cells and image anterograde transport of kinesin-1 cargoes, including
      secretory vesicles carrying bone matrix components, to identify the cargo
      whose mislocalization explains the skeletal phenotype.
notes: >-
  Scope. This entry curates the KIF5B-anchored dominant form of kyphomelic
  dysplasia. It is a member of the `Kyphomelic_Dysplasia` grouping, which unions
  it with the CCN2-related recessive form; the grouping carries the MONDO
  mapping and the reasoning for treating the clinical label as a grouping.

  Note on the MONDO anchor, and why `disease_term` is absent. OMIM has already
  split this label: OMIM 211350 is kyphomelic dysplasia (KMD, the CCN2 form) and
  OMIM 621644 is kyphomelic dysplasia, Itai-Ikegawa type (KDII, this KIF5B
  entity). MONDO has caught up with only the first — there is no MONDO term for
  the KIF5B entity, only a MedGen CUI (CN382186). This entry therefore omits
  `disease_term` rather than borrowing MONDO:0008881 from the grouping, which
  would assert an equivalence the literature does not support. When a MONDO term
  for OMIM:621644 is created it should be bound here. Filing that MONDO request
  is the unblocking action for this entry.

  A caution for curators extending this entry. The chain from motor domain to
  bent bone is one inferential step longer than it looks. The reporting study
  established genotype and phenotype well but measured no cell biology, so the
  transport node is PROVISIONAL and should not be promoted without an actual
  motility or cargo assay. The postnatal onset of the osteoporosis is a
  particularly interesting loose end, since it points at continuing bone cell
  dysfunction rather than a one-off developmental error.

  Evidence base. Four individuals in a single report, with one recurrent allele
  across two of them. No functional, animal-model or treatment data, so no
  treatments or animal_models blocks are curated.

pathophysiology:
- name: KIF5B Motor Domain Dysfunction
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    KIF5B encodes the kinesin-1 heavy chain, the ATP-hydrolysing motor subunit
    that moves cargo anterogradely along microtubules. The three reported
    pathogenic variants — p.(Lys91Arg), p.(Thr195Lys) and p.(Gly234Val) — all
    affect conserved residues in or close to the ATPase-related motifs of the
    catalytic motor domain. That clustering is the mechanistic argument: the
    lesion is in force generation or ATP handling specifically, not in overall
    kinesin expression, which is consistent with a dominant rather than
    haploinsufficient mode.
  genes:
  - preferred_term: KIF5B
    term:
      id: hgnc:6324
      label: KIF5B
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      De novo heterozygous missense variants clustering in the catalytic motor
      domain. Dominant action on a motor that functions as a dimer is the
      straightforward reading, though the specific dominant mechanism was not
      tested experimentally.
  molecular_functions:
  - preferred_term: microtubule motor activity

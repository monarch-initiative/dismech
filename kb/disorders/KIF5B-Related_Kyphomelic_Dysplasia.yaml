    quote_role: BACKGROUND
    snippet: >-
      KIF5B is a Kinesin family motor protein, an intracellular protein required
      for organelle transport, especially mitochondria and lysosomes, nuclear
      positioning and plays an important role in the control of autophagy.
      Although detailed mechanistic studies are unavailable, it appears likely
      that dysregulated autophagy in kif5b loss of function results in a loss of
      hypertrophic chondrocytes, and significantly impairs the extensive
      cartilage remodeling that occurs during early skeletogenesis [25].
    explanation: >-

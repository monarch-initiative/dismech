differential_diagnoses:
- name: CCN2-Related Kyphomelic Dysplasia
  description: >-
    The other molecularly defined form under the same clinical label, and the
    primary differential. Unlike KIF5B-related kyphomelic dysplasia — which is
    de novo autosomal dominant and associated with postnatal osteoporosis with
    fractures and optic atrophy — CCN2-related kyphomelic dysplasia shows
    autosomal recessive inheritance in consanguineous families, arises in a
    matricellular protein regulating chondrocyte proliferation and
    differentiation, and characteristically includes radial head dislocations
    and mild platyspondyly on skeletal radiographs. (Short stature, cleft
    palate, and micrognathia occur in both forms and do not discriminate
    between them.)
  evidence:
  - reference: PMID:39506047
    reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained two unrelated consanguineous families with kyphomelic
      dysplasia.
    explanation: >-
      Documents autosomal recessive ascertainment in consanguineous families
      for the CCN2-related form, contrasting with de novo dominant KIF5B cases.
  - reference: PMID:39506047
    reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographs revealed kyphomelic femora, bowing of long bones, radial head
      dislocations and mild platyspondyly.
    explanation: >-
      Documents radial head dislocations and mild platyspondyly as radiographic
      features reported in CCN2-related kyphomelic dysplasia.
  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three developed postnatal osteoporosis with subsequent fractures, two
      showed brachycephaly, and two were diagnosed with optic atrophy.
    explanation: >-
      Documents postnatal osteoporosis with fractures and optic atrophy as
      distinguishing features of KIF5B-related kyphomelic dysplasia absent from
      the CCN2-related form.
- name: KIF5B-Related Osteogenesis Imperfecta
  description: >-
    Allelic dominant-negative KIF5B catalytic motor-domain disorder (p.Thr87Ile,
    p.Gly90Ala, and p.Thr195Lys — the latter shared directly with KIF5B-related
    kyphomelic dysplasia) presenting with low bone mineral density, recurrent or
    in utero fractures, long-bone bowing, scoliosis, short stature, and ptosis,
    representing an overlapping bone-fragility spectrum rather than a genetically
    distinct entity.
  evidence:
  - reference: PMID:37934770
    reference_title: "Dominant negative variants in KIF5B cause osteogenesis imperfecta via down regulation of mTOR signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report dominant negative variants in the KIF5B kinesin motor domain in
      individuals with osteogenesis imperfecta. This study expands the spectrum
      of kinesin-related disorders and identifies dysregulated signaling targets
      for KIF5B in skeletal development.
    explanation: >-
      Documents the overlapping allelic KIF5B motor-domain osteogenesis
      imperfecta phenotype.
discussions:
- discussion_id: kif5b_kd_transport_step_unevidenced
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do KIF5B kyphomelic dysplasia variants actually impair kinesin-1 dependent
    transport, and which cargo in which cell type accounts for the skeletal
    phenotype?
  attaches_to:
  - "pathophysiology#Disrupted Kinesin-1 Dependent Intracellular Transport"
  rationale: >-
    This is why the central node of this entry is PROVISIONAL. The variants'
    location in the ATPase motifs of the motor domain is a strong argument that
    motor function is impaired, and functional modeling of the allelic
    osteogenesis imperfecta variant p.Thr87Ile (PMID:37934770) demonstrates
    dominant-negative anterograde trafficking failure and mTOR downregulation,
    yet no direct single-molecule motility, cargo-delivery, or patient-cell
    transport assay has been reported specifically for the kyphomelic dysplasia
    cohort cells or for p.(Lys91Arg) and p.(Gly234Val). Nor is it known why a
    ubiquitously expressed motor produces a phenotype concentrated in bone,
    which is the same tissue-specificity puzzle that recurs across the
    kinesinopathies. The osteoporosis-with-fractures arm makes the question
    sharper: bone fragility appearing after birth suggests an ongoing defect in
    osteoblast or osteoclast function rather than a purely developmental
    patterning error, and those are different cargo problems.
  proposed_experiments:
  - experiment_id: exp_kif5b_kd_single_molecule_motility
    name: Single-molecule motility assays of the patient alleles
    description: >-
      Purify recombinant KIF5B carrying p.(Lys91Arg), p.(Thr195Lys) and
      p.(Gly234Val) and measure ATPase rate, microtubule binding, velocity and
      run length against wild type, including mixed dimers to test for a
      dominant-negative effect on the wild-type subunit.
  - experiment_id: exp_kif5b_kd_osteoblast_cargo_transport
    name: Cargo transport in patient-derived bone cells
    description: >-
      Differentiate osteoblasts from patient-derived induced pluripotent stem
      cells and image anterograde transport of kinesin-1 cargoes, including
      secretory vesicles carrying bone matrix components, to identify the cargo
      whose mislocalization explains the skeletal phenotype.
tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/9274
  title: "Upstream MONDO requests for kyphomelic dysplasia: stale definition on MONDO:0008881, missing term for OMIM:621644"
  tracked_issue_role: ontology_term_request
  tracked_issue_status: OPEN
  notes: >-
    MONDO has no term for OMIM:621644, so this entry carries no `disease_term`.
    Filing and landing that new-term request is the unblocking action for this
    entry; when the term is minted it should be bound here.
notes: >-
  Scope. This entry curates the KIF5B-anchored dominant form of kyphomelic
  dysplasia. It is a member of the `Kyphomelic_Dysplasia` grouping, which unions
  it with the CCN2-related recessive form; the grouping carries the MONDO
  mapping and the reasoning for treating the clinical label as a grouping.

  Note on the MONDO anchor, and why `disease_term` is absent. OMIM has already
  split this label: OMIM 211350 is kyphomelic dysplasia (KMD, the CCN2 form) and
  OMIM 621644 is kyphomelic dysplasia, Itai-Ikegawa type (KDII, this KIF5B
  entity). MONDO has caught up with only the first — there is no MONDO term for
  the KIF5B entity, only a MedGen CUI (CN382186). This entry therefore omits
  `disease_term` rather than borrowing MONDO:0008881 from the grouping, which
  would assert an equivalence the literature does not support. When a MONDO term
  for OMIM:621644 is created it should be bound here. Filing that MONDO request
  is the unblocking action for this entry.

  A caution for curators extending this entry. The chain from motor domain to
  bent bone is one inferential step longer than it looks. The founding
  kyphomelic dysplasia report (PMID:35342932) established genotype and phenotype
  well without measuring cell biology; functional evidence for dominant-negative
  intracellular transport failure and reduced mTOR signaling comes from modeling
  of the allelic KIF5B motor-domain variant p.Thr87Ile in osteogenesis
  imperfecta (PMID:37934770, which also identified recurrent p.Thr195Lys).
  Because direct motility and cargo assays on kyphomelic dysplasia patient cells
  have not yet been performed, the transport node remains PROVISIONAL. The
  postnatal onset of the osteoporosis is a particularly interesting loose end,
  since it points at continuing bone cell dysfunction rather than a one-off
  developmental error.

  Evidence base. Four individuals in the founding kyphomelic dysplasia report
  (PMID:35342932), plus one overlapping prenatal p.(Thr195Lys) case in the
  allelic KIF5B osteogenesis imperfecta series (PMID:37934770). No
  disorder-specific interventional treatment data have been published, so no
  treatments block is curated.

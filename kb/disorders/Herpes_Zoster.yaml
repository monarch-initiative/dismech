infectious_agent:
- name: Varicella-zoster virus (Human alphaherpesvirus 3)
  description: >-
    Neurotropic human alphaherpesvirus that causes varicella (chickenpox) during
    primary infection and establishes lifelong latency in sensory and autonomic
    ganglionic neurons, reactivating to cause herpes zoster.
  infectious_agent_term:
    preferred_term: Human alphaherpesvirus 3
    term:
      id: NCBITaxon:10335
      label: Human alphaherpesvirus 3
  evidence:
  - reference: PMID:37632006
    reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
    explanation: Establishes VZV latency in ganglionic neurons and reactivation as the etiology of herpes zoster.
agent_life_cycle:
  description: >-
    Varicella-zoster virus is an exclusively human herpesvirus that establishes
    latency in dorsal root, cranial nerve (trigeminal and geniculate), and
    autonomic ganglia after primary varicella infection and reactivates
    endogenously to cause herpes zoster.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: obligate human reservoir and definitive host
transmission:
- name: Endogenous reactivation from ganglionic latency
  description: >-
    Herpes zoster arises by endogenous reactivation of latent varicella-zoster
    virus from sensory and autonomic ganglionic neurons established during
    prior primary varicella infection.
  evidence:
  - reference: PMID:37632006
    reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
    explanation: Establishes that herpes zoster develops via endogenous reactivation of latent VZV in ganglionic neurons following primary varicella infection.
prevalence:
- population: General population
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    Approximately one in three individuals experience at least one episode of
    herpes zoster during their lifetime, and 1.2% to 9.6% of individuals with
    an initial episode experience recurrence (1.7 to 16.6 cases per 1,000
    person-years).
  evidence:
  - reference: PMID:38416279
    reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The considerable healthcare burden of HZ is relatively well documented, with approximately one in three individuals experiencing at least one episode during their lifetime, debilitating symptoms including neuropathic pain, and complications such as post-herpetic neuralgia, vision loss, and rarely, stroke, and increased severity in immunocompromised individuals."
    explanation: Documents a lifetime occurrence of approximately one in three individuals and increased severity in immunocompromised hosts.
  - reference: PMID:38416279
    reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies in general populations of immunocompetent or immunocompetent/immunosuppressed (mixed) populations with an initial HZ episode estimate that approximately 1.2-9.6% of individuals may experience HZ recurrence, with an incidence rate of 1.7-16.6 cases per 1000 person-years."
    explanation: Quantifies herpes zoster recurrence rates (1.2% to 9.6%) in general and mixed populations.
progression:
- phase: Ganglionic Latency and Prodromal Reactivation Phase
  notes: >-
    After primary varicella infection in childhood, VZV remains latent in
    ganglionic neurons for a variable period until declining cell-mediated
    immunity permits viral reactivation and intraganglionic replication.
  evidence:
  - reference: PMID:37632006
    reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
    explanation: Establishes the variable latency period in ganglionic neurons prior to reactivation as herpes zoster.
- phase: Acute Dermatomal Eruptive Phase
  notes: >-
    Reactivated virus travels down sensory nerves to the skin, producing an
    acute painful unilateral dermatomal rash.
  evidence:
  - reference: PMID:38416279
    reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herpes zoster (HZ; shingles) is a painful, cutaneous disease caused by reactivation of the varicella zoster virus, which causes varicella (chickenpox) typically during childhood."
    explanation: Characterizes the acute painful cutaneous presentation of herpes zoster following VZV reactivation.
- phase: Chronic Postherpetic Neuralgia and Potential Recurrence Phase
  notes: >-
    Following resolution of the acute rash, patients may develop persistent
    postherpetic neuralgia (PHN) and carry a 1.2% to 9.6% long-term risk of
    herpes zoster recurrence.
  evidence:
  - reference: PMID:38416279
    reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies in general populations of immunocompetent or immunocompetent/immunosuppressed (mixed) populations with an initial HZ episode estimate that approximately 1.2-9.6% of individuals may experience HZ recurrence, with an incidence rate of 1.7-16.6 cases per 1000 person-years."
    explanation: Quantifies the long-term recurrence rate after an initial herpes zoster episode.
pathophysiology:
- name: Ganglionic VZV Latency and Reactivation Under Waning T-Cell Immunity
  description: >-
    Following primary varicella infection, VZV persists latently in dorsal root,
    trigeminal, geniculate, and autonomic ganglionic neurons. Immunosenescence
    or cellular immunosuppression allows latent VZV to reactivate, replicate
    within ganglionic neurons, and spread anterogradely down sensory axons to
    the corresponding cutaneous dermatome and central nervous system targets.
  role: trigger
  biological_scale: CELLULAR

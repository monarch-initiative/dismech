    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Prominent among these conditions is a VZV vasculopathy, but the role of VZV in causing giant cell arteritis (GCA) is currently controversial. VZV reactivation can also cause segmental motor weakness, myelitis, cranial nerve syndromes, Guillain-Barre syndrome, meningoencephalitis, and zoster sine herpete, where a neurological syndrome occurs in the absence of the zoster rash."
    explanation: Documents CNS and cerebrovascular manifestations of VZV reactivation including vasculopathy, myelitis, and meningoencephalitis.

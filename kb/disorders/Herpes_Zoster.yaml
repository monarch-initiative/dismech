    innervated dermatome, VZV infects epidermal keratinocytes, modulating local
    antigen-presentation molecules (such as absent ICAM-1 and HLA-DR on
    VZV-infected keratinocytes alongside surrounding epidermal Th1 cytokine
    upregulation) and producing intraepidermal vesicular lesions.

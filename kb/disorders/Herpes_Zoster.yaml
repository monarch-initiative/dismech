  evidence:
  - reference: PMID:37435162
    reference_title: "Can we forecast poor outcome in herpes simplex and varicella zoster encephalitis? A narrative review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Less common manifestations of VZV reactivation, and rarely of primary infection, affect the CNS and peripheral nervous system (PNS). They include encephalitis, meningitis, cerebellitis, myelitis and vasculopathy/stroke as well as radiculopathy, peripheral facial palsy and Ramsay Hunt syndrome (18)."
    explanation: Directly establishes VZV encephalitis as a central nervous system manifestation of VZV reactivation.
  - reference: PMID:37435162
    reference_title: "Can we forecast poor outcome in herpes simplex and varicella zoster encephalitis? A narrative review."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Both, HSV and VZV encephalitis have mortality rates between 5 and 20% and complete recovery rates range from 14 to 43% for HSV and 33 to 49% for VZV encephalitis."
    explanation: Quantifies mortality (5-20%) and complete recovery (33-49%) rates in VZV encephalitis.
diagnosis:
- name: Clinical and Virological Confirmation of Herpes Zoster
  description: >-
    Confirmation of suspected herpes zoster episodes by clinical evaluation of
    the unilateral dermatomal rash and laboratory testing (VZV DNA PCR, Tzanck
    smear of herpetic vesicle specimens, or VZV-specific IgM and IgA serology in
    inconclusive or atypical presentations).
  presence: Unilateral dermatomal vesicular rash on clinical examination or positive VZV DNA PCR / VZV-specific IgM and IgA antibodies
  results: Confirms active varicella-zoster virus reactivation, including in atypical presentations or zoster sine herpete using intact skin scrapings.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:37588338
    reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of shingles is often made clinically, based on the visually apparent and clear temporal-regional pattern of the rash. In cases where the clinical assessment is inconclusive, traditional methods such as VZV DNA PCR, Tzanck smear using herpetic vesicle specimens, or the detection of serological markers with immunoglobulins like serum IgM and IgA antibodies can be employed to confirm the diagnosis."
    explanation: Documents clinical diagnosis from the rash pattern and laboratory confirmation by VZV DNA PCR, Tzanck smear, or VZV IgM/IgA serology.
  - reference: PMID:37588338
    reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To definitively diagnose VZV involvement, a skin scraping sample was taken from the affected area for VZV DNA PCR, which yielded a positive result."
    explanation: Demonstrates confirmatory VZV DNA PCR testing on skin scrapings from the affected dermatome.
treatments:
- name: Adjuvanted Recombinant Zoster Vaccine (RZV / Shingrix, VZV gE + AS01B)
  description: >-
    Two-dose recombinant subunit vaccine containing varicella-zoster virus
    glycoprotein E (gE) and the AS01B liposomal adjuvant system (MPL and QS-21).
    In phase 3 trials, HZ/su achieved 97.2% overall vaccine efficacy against
    herpes zoster in adults >=50 years of age (ZOE-50) and 91.3% efficacy
    against herpes zoster plus 88.8% efficacy against postherpetic neuralgia in
    adults >=70 years of age (pooled ZOE-50/ZOE-70), overcoming the age-related
    efficacy decline seen with live-attenuated zoster vaccine.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Ganglionic VZV Latency and Reactivation Under Waning T-Cell Immunity
    treatment_effect: INHIBITS
    description: >-
      AS01B-adjuvanted gE immunization restores VZV-specific CD4+ T-cell and
      humoral immunity that suppresses clinical VZV reactivation from ganglionic
      latency.
    evidence:
    - reference: PMID:25916341
      reference_title: "Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "During a mean follow-up of 3.2 years, herpes zoster was confirmed in 6 participants in the vaccine group and in 210 participants in the placebo group (incidence rate, 0.3 vs. 9.1 per 1000 person-years) in the modified vaccinated cohort. Overall vaccine efficacy against herpes zoster was 97.2% (95% confidence interval ... 93.7 to 99.0; P<0.001)."
      explanation: Demonstrates 97.2% efficacy of HZ/su in preventing herpes zoster reactivation in adults aged 50 years or older.
  effect_modifiers:
  - effect_modifier_type: COMORBIDITY
    stratum: immunocompromised individuals
    comparator_stratum: immunocompetent older adults
    modified_outcome: herpes zoster incidence, severity, and absolute risk reduction from non-live recombinant vaccination
    effect_in_stratum: LARGER_EFFECT
    description: >-
      Immunocompromised individuals experience higher herpes zoster incidence,
      severity, and recurrence risk, and non-live recombinant adjuvanted
      zoster vaccination is specifically indicated where live-attenuated
      vaccines are contraindicated.
    evidence:
    - reference: PMID:38416279
      reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The considerable healthcare burden of HZ is relatively well documented, with approximately one in three individuals experiencing at least one episode during their lifetime, debilitating symptoms including neuropathic pain, and complications such as post-herpetic neuralgia, vision loss, and rarely, stroke, and increased severity in immunocompromised individuals."
      explanation: Documents increased herpes zoster severity and burden in immunocompromised individuals.
  evidence:
  - reference: PMID:25916341
    reference_title: "Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During a mean follow-up of 3.2 years, herpes zoster was confirmed in 6 participants in the vaccine group and in 210 participants in the placebo group (incidence rate, 0.3 vs. 9.1 per 1000 person-years) in the modified vaccinated cohort. Overall vaccine efficacy against herpes zoster was 97.2% (95% confidence interval ... 93.7 to 99.0; P<0.001)."
    explanation: Pivotal ZOE-50 trial showing 97.2% vaccine efficacy against herpes zoster.
  - reference: PMID:27626517
    reference_title: "Efficacy of the Herpes Zoster Subunit Vaccine in Adults 70 Years of Age or Older."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In pooled analyses of data from participants 70 years of age or older in ZOE-50 and ZOE-70 (16,596 participants), vaccine efficacy against herpes zoster was 91.3% (95% CI, 86.8 to 94.5; P<0.001), and vaccine efficacy against postherpetic neuralgia was 88.8% (95% CI, 68.7 to 97.1; P<0.001)."
    explanation: Pivotal ZOE-70 pooled analysis demonstrating 91.3% efficacy against HZ and 88.8% efficacy against PHN in adults >=70 years old.
- name: Nucleoside Analog Antiviral Therapy (Acyclovir and Valacyclovir)
  description: >-
    Systemic nucleoside analog antiviral therapy (oral acyclovir, valacyclovir,
    or famciclovir for uncomplicated acute herpes zoster; intravenous acyclovir
    for immunocompromised patients, ocular zoster, or central nervous system
    complications such as VZV vasculopathy, meningoencephalitis, and myelitis)
    accelerates rash healing and shortens acute zoster pain.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: acyclovir
      term:
        id: CHEBI:2453
        label: acyclovir
    - preferred_term: valacyclovir
      term:
        id: CHEBI:35854
        label: valacyclovir
  target_mechanisms:
  - target: Ganglionic VZV Latency and Reactivation Under Waning T-Cell Immunity
    treatment_effect: INHIBITS
    description: Inhibits viral DNA polymerase-mediated VZV genome replication following ganglionic reactivation.
    evidence:
    - reference: PMID:23794213
      reference_title: Complications of varicella zoster virus reactivation.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Oral antiviral drugs speed healing of rash and shorten acute pain. Immunocompromised patients require intravenous acyclovir."
      explanation: Demonstrates clinical antiviral suppression of active VZV reactivation, accelerating rash resolution and shortening acute pain.
  - target: Sensory Ganglionitis and Neuroinflammation
    treatment_effect: INHIBITS
    description: Early suppression of VZV replication limits ganglionic inflammation and shortens acute herpetic radicular pain.
    evidence:
    - reference: PMID:23794213
      reference_title: Complications of varicella zoster virus reactivation.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Oral antiviral drugs speed healing of rash and shorten acute pain. Immunocompromised patients require intravenous acyclovir."
      explanation: Establishes that oral and intravenous antiviral therapy shortens acute zoster pain and accelerates healing.
    - reference: PMID:37588338
      reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Prompt initiation of antiviral therapy is crucial for minimizing the duration and severity of radicular pain in ZSH cases."
      explanation: Background clinical recommendation noting that prompt antiviral initiation reduces radicular pain duration and severity in zoster sine herpete.
  - target: Central Nervous System Extension of VZV
    treatment_effect: INHIBITS
    description: Intravenous acyclovir suppresses VZV replication across the blood-brain barrier in VZV myelitis, meningoencephalitis, and cerebral vasculopathy.
    evidence:
    - reference: PMID:23794213
      reference_title: Complications of varicella zoster virus reactivation.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "VZV vasculopathy, meningoencephalitis, and myelitis are all treated with intravenous acyclovir."
      explanation: Establishes intravenous acyclovir as standard treatment for central nervous system VZV complications.
  evidence:
  - reference: PMID:8827537
    reference_title: "Acyclovir for the prevention and treatment of varicella zoster in children, adolescents and pregnancy."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Early commencement of acyclovir is recommended for children with both varicella and altered cell mediated immunity, newborns during the first 2 weeks of life, preterm infants in the neonatal nursery, and severe varicella or shingles (including ocular zoster) in any patient, as well as during pregnancy."
    explanation: Australasian Society for Infectious Diseases consensus guideline recommending early commencement of acyclovir for severe shingles (including ocular zoster) and immunocompromised hosts.
  - reference: PMID:23794213
    reference_title: Complications of varicella zoster virus reactivation.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral antiviral drugs speed healing of rash and shorten acute pain. Immunocompromised patients require intravenous acyclovir."
    explanation: Summarizes established efficacy of oral antivirals in uncomplicated zoster and the requirement for intravenous acyclovir in immunocompromised patients.
  - reference: PMID:23794213
    reference_title: Complications of varicella zoster virus reactivation.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "VZV vasculopathy, meningoencephalitis, and myelitis are all treated with intravenous acyclovir."
    explanation: Documents intravenous acyclovir therapy for neurological complications of VZV reactivation.
  - reference: PMID:37588338
    reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Prompt initiation of antiviral therapy is crucial for minimizing the duration and severity of radicular pain in ZSH cases."
    explanation: Supplementary background statement emphasizing early antiviral initiation in zoster sine herpete.
- name: Neuropathic Pain Pharmacotherapy (Gabapentinoids and Topical Lidocaine)
  description: >-
    First-line neuropathic pain pharmacotherapy—including gabapentinoids
    (gabapentin and pregabalin), topical lidocaine patches or cream, and
    tricyclic antidepressants—for symptomatic relief of persistent postherpetic
    neuralgia and zoster-associated radicular pain.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gabapentin
      term:
        id: CHEBI:42797
        label: gabapentin
    - preferred_term: pregabalin
      term:
        id: CHEBI:64356
        label: pregabalin
    - preferred_term: lidocaine
      term:
        id: CHEBI:6456
        label: lidocaine
  target_mechanisms:
  - target: Sensory Neuron Injury and Nociceptor Sensitization
    treatment_effect: INHIBITS
    description: Attenuates sensitized peripheral and central nociceptive transmission to relieve postherpetic neuralgia and radicular pain.
    evidence:
    - reference: PMID:23794213
      reference_title: Complications of varicella zoster virus reactivation.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "First-line treatments for post-herpetic neuralgia include tricyclic antidepressants, gabapentin, pregabalin, and topical lidocaine patches."
      explanation: Establishes gabapentin, pregabalin, and topical lidocaine patches among first-line pharmacotherapies targeting postherpetic neuralgia.
  evidence:
  - reference: PMID:23794213
    reference_title: Complications of varicella zoster virus reactivation.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "First-line treatments for post-herpetic neuralgia include tricyclic antidepressants, gabapentin, pregabalin, and topical lidocaine patches."
    explanation: Clinical treatment review establishing gabapentin, pregabalin, and topical lidocaine patches as first-line therapies for postherpetic neuralgia.
  - reference: NCIT:C1108
    reference_title: "Gabapentin (NCIT)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NCIT:C1108 | Gabapentin | Accepted_Therapeutic_Use_For | - | - | Management of Epilepsy; Pain; Mania; Depression and Anxiety Disorders; Postherpetic Neuralgia"
    explanation: NCI Thesaurus structured indication record documenting accepted therapeutic use of gabapentin for postherpetic neuralgia.
  - reference: PMID:37588338
    reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the confirmed diagnosis of ZSH based on the skin sample, the patient was prescribed 3% lidocaine topical cream as needed, in addition to continuing with gabapentin. Over a few weeks, her radicular pain gradually improved, as observed during repeat cranial nerve examinations at subsequent close follow-up visits."
    explanation: Supplementary single-patient case report illustrating gradual radicular pain improvement during combined gabapentin and topical lidocaine therapy in confirmed zoster sine herpete.

category: Infectious Disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    notes: Caused by endogenous reactivation of latent varicella-zoster virus (Human alphaherpesvirus 3).
    evidence:
    - reference: PMID:37632006
      reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
      explanation: Establishes herpes zoster as a viral infectious disease resulting from VZV reactivation.
  - classification_value: NEUROLOGIC
    notes: Reactivation occurs in sensory and autonomic ganglionic neurons and produces acute radicular neuralgia, postherpetic neuralgia, myelitis, and meningoencephalitis.
    evidence:
    - reference: PMID:37632006
      reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While the most frequent reactivation syndrome is herpes zoster, this may be followed by the serious and painful post-herpetic neuralgia (PHN) and by many other neurological conditions."
      explanation: Documents the primary ganglionic and neurological spectrum of VZV reactivation.
  - classification_value: DERMATOLOGY
    notes: Classic clinical presentation is a painful unilateral dermatomal vesicular cutaneous eruption.
    evidence:
    - reference: PMID:38416279
      reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Herpes zoster (HZ; shingles) is a painful, cutaneous disease caused by reactivation of the varicella zoster virus, which causes varicella (chickenpox) typically during childhood."
      explanation: Characterizes herpes zoster as a painful cutaneous disease.
description: >-
  Herpes zoster (shingles) is a neurocutaneous disease caused by the
  reactivation of latent varicella-zoster virus (VZV; human alphaherpesvirus 3)
  from cranial nerve, dorsal root, or autonomic ganglionic neurons when
  VZV-specific cell-mediated immunity declines with advancing age or
  immunosuppression. Reactivated virus replicates in ganglionic neurons and
  travels anterogradely along sensory axons to the innervated dermatome,
  producing a painful unilateral vesicular rash and ganglionic inflammation that
  frequently progresses to postherpetic neuralgia (PHN) and can be complicated
  by VZV vasculopathy, cranial neuropathies, myelitis, or meningoencephalitis.

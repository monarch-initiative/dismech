  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: T cell mediated immunity
    modifier: DECREASED
    term:
      id: GO:0002456
      label: T cell mediated immunity
  evidence:
  - reference: PMID:37632006
    reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
    explanation: Confirms ganglionic neuronal latency and subsequent reactivation to produce herpes zoster.
  - reference: PMID:23794213
    reference_title: Complications of varicella zoster virus reactivation.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "With advancing age or immunosuppression, cell-mediated immunity to VZV declines and virus reactivates to cause zoster (shingles), which can occur anywhere on the body."
    explanation: Directly links waning VZV-specific cell-mediated immunity with ganglionic viral reactivation causing herpes zoster.
  downstream:
  - target: Sensory Ganglionitis and Neuroinflammation
    description: Reactivated intraganglionic VZV replication provokes sensory ganglionitis and local neuroinflammation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27188665
      reference_title: Varicella zoster virus infection.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Reactivation of the virus leads to virus replication, which causes zoster (shingles) in tissues innervated by the involved neurons, inflammation and cell death - a process that can lead to persistent radicular pain (postherpetic neuralgia)."
      explanation: Links VZV reactivation and replication in ganglionic neurons directly to ganglionic inflammation and neuronal cell death.
- name: Sensory Ganglionitis and Neuroinflammation
  description: >-
    Active VZV replication in dorsal root and cranial sensory ganglia provokes
    acute ganglionic inflammation and immune-cell infiltration within the
    affected ganglion and peripheral nerve root, driving peripheral delivery of
    virions to the innervated dermatome, sensory neuronal injury, and occasional
    extension into the central nervous system.

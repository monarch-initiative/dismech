  evidence:
  - reference: PMID:37632006
    reference_title: "The Spectrum of Neurological Manifestations of Varicella-Zoster Virus Reactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the most frequent reactivation syndrome is herpes zoster, this may be followed by the serious and painful post-herpetic neuralgia (PHN) and by many other neurological conditions. Prominent among these conditions is a VZV vasculopathy, but the role of VZV in causing giant cell arteritis (GCA) is currently controversial. VZV reactivation can also cause segmental motor weakness, myelitis, cranial nerve syndromes, Guillain-Barre syndrome, meningoencephalitis, and zoster sine herpete, where a neurological syndrome occurs in the absence of the zoster rash."
    explanation: Details the neurological complications of VZV reactivation including postherpetic neuralgia, VZV vasculopathy, cranial neuropathies, myelitis, and meningoencephalitis.
  downstream:
  - target: Skin rash
    description: Anterograde axonal delivery of VZV to epidermis produces the unilateral dermatomal vesicular rash.
  - target: Neuralgia
    description: Sensory ganglionic damage and central sensitization produce acute zoster pain and postherpetic neuralgia.

    explanation: Documents debilitating neuropathic pain and postherpetic neuralgia as primary complications of herpes zoster.
diagnosis:
- name: Clinical and Virological Confirmation of Herpes Zoster
  description: >-
    Confirmation of suspected herpes zoster episodes by clinical evaluation of
    the unilateral dermatomal rash and laboratory testing (VZV DNA PCR, Tzanck
    smear of herpetic vesicle specimens, or VZV-specific IgM and IgA serology in
    inconclusive or atypical presentations).
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:37588338
    reference_title: "Zoster Sine Herpete: Confirmatory Diagnosis Using Varicella-Zoster Virus DNA Polymerase Chain Reaction Analysis of Intact Skin Scrapings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of shingles is often made clinically, based on the visually apparent and clear temporal-regional pattern of the rash. In cases where the clinical assessment is inconclusive, traditional methods such as VZV DNA PCR, Tzanck smear using herpetic vesicle specimens, or the detection of serological markers with immunoglobulins like serum IgM and IgA antibodies can be employed to confirm the diagnosis."
    explanation: Documents clinical diagnosis from the rash pattern and laboratory confirmation by VZV DNA PCR, Tzanck smear, or VZV IgM/IgA serology.
treatments:
- name: Adjuvanted Recombinant Zoster Vaccine (RZV / Shingrix, VZV gE + AS01B)
  description: >-
    Two-dose recombinant subunit vaccine containing varicella-zoster virus
    glycoprotein E (gE) and the AS01B liposomal adjuvant system (MPL and QS-21).
    In phase 3 trials, HZ/su achieved 97.2% overall vaccine efficacy against
    herpes zoster in adults >=50 years of age (ZOE-50) and 91.3% efficacy
    against herpes zoster plus 88.8% efficacy against postherpetic neuralgia in
    adults >=70 years of age (pooled ZOE-50/ZOE-70), overcoming the age-related
    efficacy decline seen with live-attenuated zoster vaccine.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Ganglionic VZV Latency and Reactivation Under Waning T-Cell Immunity
    treatment_effect: INHIBITS
    description: >-
      AS01B-adjuvanted gE immunization restores VZV-specific CD4+ T-cell and
      humoral immunity that suppresses clinical VZV reactivation from ganglionic
      latency.
    evidence:
    - reference: PMID:25916341
      reference_title: "Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "During a mean follow-up of 3.2 years, herpes zoster was confirmed in 6 participants in the vaccine group and in 210 participants in the placebo group (incidence rate, 0.3 vs. 9.1 per 1000 person-years) in the modified vaccinated cohort. Overall vaccine efficacy against herpes zoster was 97.2% (95% confidence interval [CI], 93.7 to 99.0; P<0.001)."
      explanation: Demonstrates 97.2% efficacy of HZ/su in preventing herpes zoster reactivation in adults aged 50 years or older.
  effect_modifiers:
  - effect_modifier_type: COMORBIDITY
    stratum: immunocompromised individuals
    comparator_stratum: immunocompetent older adults
    modified_outcome: herpes zoster incidence, severity, and absolute risk reduction from non-live recombinant vaccination
    effect_in_stratum: LARGER_EFFECT
    description: >-
      Immunocompromised individuals experience higher herpes zoster incidence,
      severity, and recurrence risk, and non-live recombinant adjuvanted
      zoster vaccination is specifically indicated where live-attenuated
      vaccines are contraindicated.
    evidence:
    - reference: PMID:38416279
      reference_title: "Herpes Zoster Recurrence: A Narrative Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The considerable healthcare burden of HZ is relatively well documented, with approximately one in three individuals experiencing at least one episode during their lifetime, debilitating symptoms including neuropathic pain, and complications such as post-herpetic neuralgia, vision loss, and rarely, stroke, and increased severity in immunocompromised individuals."
      explanation: Documents increased herpes zoster severity and burden in immunocompromised individuals.
  evidence:
  - reference: PMID:25916341
    reference_title: "Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During a mean follow-up of 3.2 years, herpes zoster was confirmed in 6 participants in the vaccine group and in 210 participants in the placebo group (incidence rate, 0.3 vs. 9.1 per 1000 person-years) in the modified vaccinated cohort. Overall vaccine efficacy against herpes zoster was 97.2% (95% confidence interval [CI], 93.7 to 99.0; P<0.001)."
    explanation: Pivotal ZOE-50 trial showing 97.2% vaccine efficacy against herpes zoster.
  - reference: PMID:27626517
    reference_title: "Efficacy of the Herpes Zoster Subunit Vaccine in Adults 70 Years of Age or Older."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In pooled analyses of data from participants 70 years of age or older in ZOE-50 and ZOE-70 (16,596 participants), vaccine efficacy against herpes zoster was 91.3% (95% CI, 86.8 to 94.5; P<0.001), and vaccine efficacy against postherpetic neuralgia was 88.8% (95% CI, 68.7 to 97.1; P<0.001)."
    explanation: Pivotal ZOE-70 pooled analysis demonstrating 91.3% efficacy against HZ and 88.8% efficacy against PHN in adults >=70 years old.

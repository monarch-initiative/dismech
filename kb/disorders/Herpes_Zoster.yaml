    snippet: "Varicella-Zoster virus (VZV) is a pathogenic human alpha herpes virus that causes varicella (chicken pox) as a primary infection and, following a variable period of latency in different ganglionic neurons, it reactivates to produce herpes zoster (shingles)."
    explanation: Confirms ganglionic neuronal latency and subsequent reactivation to produce herpes zoster.
  downstream:
  - target: Dermatomal Ganglionitis, Neuroinflammation, and Postherpetic Neuralgia
    description: Intraganglionic viral replication and anterograde axonal transport trigger dermatomal skin lesions and sensory ganglionitis.
    causal_link_type: DIRECT
- name: Dermatomal Ganglionitis, Neuroinflammation, and Postherpetic Neuralgia
  description: >-
    Active VZV replication in sensory ganglia and peripheral nerves provokes
    hemorrhagic ganglionitis, neuronal injury, and demyelination that manifest
    acutely as dermatomal vesicular rash and acute herpetic pain, and persist as
    chronic neuropathic pain (postherpetic neuralgia), cranial nerve palsies,
    myelitis, meningoencephalitis, or cerebral VZV vasculopathy.
  role: central_effector
  biological_scale: TISSUE

  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the hereditary dRTA-causing pathogenic variant(s) have been identified in an affected
      family member, prenatal and preimplantation genetic testing are possible.
    explanation: States the reproductive options available once the variants are known.
animal_models:
- name: Atp6v0a4 knockout mouse
  species: Mouse
  genotype: Atp6v0a4 null (homozygous knockout)
  publication: PMID:22872862
  description: A germline null that reproduces both arms of the human disease. It is the model that turns
    the auditory arm from an expression-and-inference argument into a measured one, and it also shows an
    extrarenal, extra-auditory phenotype - impaired olfaction - that has no established human counterpart.
  modeled_mechanisms:
  - target: Cochlear Endolymph Acid-Base Homeostasis Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: The null abolishes the endocochlear potential, which is the direct physiological readout
      of endolymph homeostasis failure.
    limitations: The human auditory phenotype is variable in onset and sometimes absent, whereas the null
      mouse is uniformly and severely affected. The model therefore describes the mechanism faithfully
      while overstating its penetrance, so it cannot be used to reason about which ATP6V0A4 patients will
      lose hearing.
    readouts:
    - name: Endocochlear potential
      target: Cochlear Endolymph Acid-Base Homeostasis Failure
      direction: ABOLISHED
      interpretation: Direct measurement of the endolymphatic driving potential the pump maintains.
      evidence:
      - reference: PMID:22872862
        reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
          loss, with additional extrarenal phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: They were severely hearing-impaired, as shown by elevated auditory brainstem response
          thresholds and absent endocochlear potential.
        explanation: Reports the measurement and its direction. The full sentence is quoted rather than
          the bare phrase, because a three-word fragment carries no propositional content.
    - name: Auditory brainstem response threshold
      target: Cochlear Endolymph Acid-Base Homeostasis Failure
      direction: INCREASED
      interpretation: Functional hearing readout; an elevated threshold means worse hearing.
      evidence:
      - reference: PMID:22872862
        reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
          loss, with additional extrarenal phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: elevated auditory brainstem response thresholds
        explanation: The functional hearing measurement, in the direction recorded.
  - target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Severe metabolic acidosis with hypokalaemia by weaning, lethal without alkali, matching
      the untreated human course.
    readouts:
    - name: Plasma acid-base and potassium status
      target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
      direction: ALTERED
      interpretation: Severe acidosis with hypokalaemia - the human biochemical signature.
      evidence:
      - reference: PMID:22872862
        reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
          loss, with additional extrarenal phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: By the time of weaning, Atp6v0a4(-/-) mice demonstrated severe metabolic acidosis,
          hypokalemia, and early nephrocalcinosis.
        explanation: Reports the biochemical phenotype and its timing.
  - target: Hypercalciuria with Hypocitraturia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The null reproduces the hypocitraturia but not the hypercalciuria, so it dissociates the
      two halves of this node rather than reproducing it whole.
    limitations: Hypercalciuria is absent in the mouse and present in most human patients. Inferences
      from this model about calcium handling or stone risk in the human disease therefore do not hold,
      even though the model does develop nephrocalcinosis.
    readouts:
    - name: Urinary citrate and calcium
      target: Hypercalciuria with Hypocitraturia
      direction: ALTERED
      interpretation: Citrate low as in humans; calcium not raised, unlike humans.
      evidence:
      - reference: PMID:22872862
        reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
          loss, with additional extrarenal phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Null mice were hypocitraturic, but hypercalciuria was absent.
        explanation: Reports both measurements in one sentence, one matching the human disease and one
          not.
  evidence:
  - reference: PMID:22872862
    reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
      loss, with additional extrarenal phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This mouse model recapitulates the loss of H(+)-ATPase function seen in human disease and
      can provide additional insights into dRTA and the physiology of the a4 subunit.
    explanation: The authors' own statement of the model's fidelity to the human mechanism, which is the
      claim these model links make.
treatments:
- name: Oral Alkali Replacement
  therapeutic_modality: SMALL_MOLECULE
  description: 'Bicarbonate and citrate salts given to replace the buffer the kidney cannot regenerate.
    Citrate preparations do double duty, since urinary citrate is itself the depleted inhibitor of calcium
    precipitation in this disease.

    It treats the consequence and not the cause. The pump stays defective and the urine stays
    inappropriately alkaline. Critically, it does not act on the ear: the auditory arm is parallel to the
    acidosis rather than downstream of it, so correcting blood pH has no mechanistic reason to change
    hearing outcome.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
  target_mechanisms:
  - target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
    description: Supplies the base the failed distal nephron cannot regenerate, correcting the systemic
      acidosis without addressing the transport defect that causes it.
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The medical treatment is simple and involves an alkali load which allows curing the metabolic
      acidosis.
    explanation: States the treatment and the consequence it corrects.
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Long-term outcome is usually good unless the patient's compliance is low or alkalizing
      treatment is insufficient.
    explanation: Makes adherence the determinant of outcome, which is the argument for the prolonged
      release formulation curated below.
- name: Prolonged-Release Potassium Citrate and Potassium Bicarbonate (ADV7103)
  therapeutic_modality: SMALL_MOLECULE
  description: 'A prolonged-release combination developed specifically for dRTA, addressing the thing
    that determines outcome in this disease - adherence to a frequently dosed, unpalatable alkali. Over
    24 months it held plasma bicarbonate and potassium in range in most patients, and spine bone mineral
    density z-score rose.

    Best read as a better treatment of the acidosis rather than a treatment of the disease. It acts on
    the same node the older alkali salts do; nothing in the reported outcomes bears on the auditory arm.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
  target_mechanisms:
  - target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
    description: The same target as conventional alkali, with a release profile intended to hold plasma
      bicarbonate in range between doses.
  - target: Skeletal Demineralisation and Growth Failure
    description: Improvement in spine bone mineral density and in growth z-scores follows from sustained
      correction of the acidosis, so the bone effect is an indirect consequence of the acid-base effect
      rather than a separate action of the drug.
  evidence:
  - reference: PMID:33635379
    reference_title: 'Safety, efficacy, and acceptability of ADV7103 during 24 months of treatment: an
      open-label study in pediatric and adult patients with distal renal tubular acidosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma bicarbonate and potassium levels were in the normal ranges at the different visits,
      respectively, in 69-86% and 83-93% of patients.
    explanation: The efficacy result on the acid-base node this treatment targets, reported as the
      proportion of patients controlled rather than as a mean.
  - reference: PMID:36529656
    reference_title: Bone mineral density and growth changes in patients with distal renal tubular
      acidosis after two-years treatment with a new alkalizing drug (ADV7103).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After 24 months of treatment with ADV7103, mean spine BMD z-score values significantly
      increased as compared with baseline (p=0.024).
    explanation: Evidences the bone arm of the treatment effect. The study is an open-label extension
      with no control arm, so the comparison is within-patient over time rather than against an untreated
      group.
  notes: The studied cohort is dRTA of mixed genotype rather than ATP6V0A4 specifically, and both studies
    are open-label extensions without a control arm. Neither fact is visible from the effect sizes, and
    both limit what this treatment record can claim.
- name: Hearing Amplification and Cochlear Implantation
  therapeutic_modality: DEVICE
  description: 'Amplification, escalating to cochlear implantation as the hearing loss progresses. It is
    curated as a separate treatment from alkali because it addresses the other arm of the disease: the
    auditory branch is parallel to the acidosis, so correcting blood pH does nothing for it and the only
    available intervention is to compensate for the deficit.

    This record is the reason the two-armed architecture is not merely a modelling preference. If the
    arms were in series, treating the acidosis early would be an ear treatment too, and it is not.'
  treatment_term:
    preferred_term: hearing amplification and cochlear implantation
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Sensorineural hearing loss
    description: Compensates for the auditory deficit. It does not act on endolymph homeostasis or on
      the pump.
  notes: Deliberately unevidenced for efficacy. No audiological intervention outcome is reported in the
    ATP6V0A4-specific literature. What is evidenced, on the alkali record above and in the surveillance
    recommendation under diagnosis, is the negative that makes this treatment necessary.
- name: Avoidance of Potassium-Sparing Diuretics
  therapeutic_modality: OTHER
  description: GeneReviews lists potassium-sparing diuretics among the agents to use with caution or
    avoid. This is counterintuitive, because the disease runs with hypokalaemia and a potassium-sparing
    agent looks corrective - but these drugs act on the same distal segment whose proton secretion is
    already failing, so the acidosis is worsened while the potassium is being chased.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Failure of Apical Proton Secretion by Alpha-Intercalated Cells
    treatment_effect: MODULATES
    description: Avoidance is aimed at not compounding the primary transport lesion; nothing here
      corrects it.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Agents/circumstances to avoid: Potassium-sparing diuretics should be used with caution or
      avoided.'
    explanation: GeneReviews Management names the drug class to avoid in hereditary dRTA.
  notes: The mechanistic rationale in the description is the curator's reading of why this class is
    listed. GeneReviews states the avoidance without giving a reason.
diagnosis:
- name: Urinary acidification testing
  description: Demonstration that the urine cannot be acidified appropriately, either spontaneously
    during acidosis or after an ammonium chloride or furosemide challenge once the acidosis has been
    compensated.
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When the metabolic acidosis is compensated, dRTA can be diagnosed by the failure of urinary
      acidification after oral ammonium chloride or furosemide administration.
    explanation: States the provocative test and the circumstance in which it is needed.
- name: Audiological surveillance
  description: Repeated audiological assessment rather than a single test at diagnosis, because hearing
    loss in this gene may be absent at presentation and appear later.
  evidence:
  - reference: PMID:37121229
    reference_title: Hearing Loss Related to Gene Mutations in Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A regular audiological follow-up is essential for the early detection of a possible
      late-onset or progressive hearing loss in these patients.
    explanation: States the surveillance recommendation and the reason for it.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Audiometry annually in at-risk individuals.
    explanation: Supplies the interval the recommendation above leaves unspecified.
- name: Renal and growth surveillance
  description: Lifelong monitoring rather than a one-off assessment, because the renal arm progresses.
    Imaging for calcification and stones, growth measurement on a schedule that tightens in infancy, and
    bone densitometry as needed.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Growth assessment with calculation of body mass index in infants at least every three
      months, and in older children at least every six months until achievement of final height. Bone
      densitometry as needed.
    explanation: Gives the surveillance intervals for the growth and skeletal arms.
- name: Genetic testing of the H+-ATPase subunit genes
  description: Sequencing of ATP6V1B1 and ATP6V0A4 regardless of hearing status, since neither gene can
    be excluded on the auditory phenotype alone.
  evidence:
  - reference: PMID:16611712
    reference_title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence
      for early sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: they highlight the importance of genetic screening for recessive forms of dRTA independent
      of hearing status
    explanation: States the testing recommendation and the reason for it - that hearing status does not
      predict genotype.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of hereditary dRTA is established in a proband with dRTA and biallelic
      pathogenic variants in ATP6V0A4, ATP6V1B1, FOXI1, or WDR72
    explanation: States the molecular criterion by which the diagnosis is established, naming ATP6V0A4
      first among the biallelic genes.
clinical_trials:
- name: EUCTR2013-003828-36-SK
  phase: PHASE_III
  status: NOT_RECRUITING
  description: Multicentre open-label extension evaluating the long-term safety, tolerability and
    efficacy of ADV7103 in distal renal tubular acidosis, following on from an earlier phase II/III
    study. Uncontrolled and unblinded by design. The registry gives a target sample size of 24 and lists
    four recruiting countries; the published extension reports 30 patients, and neither source reconciles
    the two figures. This is the registration behind the 24-month outcome publications cited on the
    ADV7103 treatment record.
  target_phenotypes:
  - preferred_term: Hyperchloremic metabolic acidosis
    term:
      id: HP:0004918
      label: Hyperchloremic metabolic acidosis
  evidence:
  - reference: ICTRP:EUCTR2013-003828-36-SK
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Register | EUCTR
    explanation: WHO ICTRP registration record establishing the trial's identity and its source
      registry.
  - reference: ICTRP:EUCTR2013-003828-36-SK
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Countries of recruitment | France; Serbia; Slovakia; Spain
    explanation: Records the recruiting countries. Worth noting alongside the treatment record, because
      it shows the cohort is European and multi-centre rather than single-site.
  notes: 'status is NOT_RECRUITING because that is the state the ICTRP record itself carries, and this
    record quotes that registry. The trial in fact ran to completion - its 24-month outcomes are published
    as PMID:33635379 and PMID:36529656 - so a reader should treat the registry status as stale rather
    than as the trial''s fate. The 24 in the description is the registry''s Target sample size field;
    the published extension enrolled 30, and the two numbers are not reconciled in either source.

    Registered on EUCTR rather than ClinicalTrials.gov, so it is keyed on its WHO ICTRP identifier.
    The country suffix matters: ICTRP indexes EUCTR trials per country, and this trial resolves only
    under the -SK (Slovakia) record even though it recruited in four countries. The bare EudraCT number
    printed in the publications, 2013-003828-36, does not resolve on its own.'
discussions:
- discussion_id: atp6v0a4_hearing_onset_variability
  kind: KNOWLEDGE_GAP
  prompt: What determines whether and when an ATP6V0A4 patient loses hearing, given that biallelic loss
    of function produces severe hearing loss from two months of age in some patients and preserved
    hearing into adulthood in others, and given that genetic background is a demonstrated modifier in
    the sibling subunit's mouse?
  attaches_to:
  - pathophysiology#Cochlear Endolymph Acid-Base Homeostasis Failure
  - phenotypes#Sensorineural hearing loss
  rationale: 'This is the open question of the entry, and it is not a gap in whether the mechanism is
    real - the mouse null settles that with an abolished endocochlear potential. It is a gap in what
    modifies it. Four candidate explanations are on the table, and they are not equally evidenced.

    Genetic background is the best evidenced of the four, and it is the one an ATP6V0A4-only reading of
    the literature misses. In Atp6v1b1 mice the auditory phenotype depends on strain: MRL mutants are
    profoundly deaf, the same mutation on a C57BL/6 background is not, and a backcross maps a Chr 13
    locus accounting for about 20% of hearing-threshold variance. That is a demonstrated modifier effect
    on dRTA-related hearing loss, and it is the reason this discussion does not claim the variability is
    unexplained.

    It is evidence about a different subunit, though, and the entry does not paper over that. No modifier
    mapping has been done for ATP6V0A4, in mice or in humans, so transferring the finding is an inference
    from one V-ATPase subunit to another - which is why the evidence item carries directness INDIRECT.

    The other three remain candidates with no study discriminating between them: residual a4 function
    differing by allele, enlarged vestibular aqueduct acting as a structural modifier, and ascertainment,
    since a cohort recruited through nephrology will not audiometrically test everyone at the same age.
    The two human series cited on the hearing phenotype point in opposite directions - seven early-onset
    probands in one, one affected of six in another - without either being wrong.'
  evidence:
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice, a new
      genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: We found statistically significant linkage with a locus on Chr 13 that accounts for about
      20% of the hearing threshold variation in the backcross mice.
    explanation: The mapped modifier effect. Graded INDIRECT because the mapping was done in Atp6v1b1
      mice and this entry is about ATP6V0A4 - it establishes that genetic background modifies
      dRTA-associated hearing loss, not that it does so for this gene.
  - reference: PMID:28934385
    reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice, a new
      genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: The abnormal inner ear phenotype of MRL- Atp6v1b1vtx/vtx mice was lost when the mutation
      was transferred onto the C57BL/6J (B6) background, indicating the influence of strain-specific
      genetic modifiers.
    explanation: The strain-swap experiment, which is the cleaner demonstration - the same mutation
      produces deafness or not depending only on background. Same INDIRECT caveat as above.
  proposed_experiments:
  - experiment_id: atp6v0a4_longitudinal_audiometry
    name: Genotype-stratified longitudinal audiometry with inner-ear imaging
    description: Serial audiometry from infancy in a genotyped ATP6V0A4 cohort, with vestibular aqueduct
      measurement on imaging, so that allele, inner-ear structure and age at testing are separated rather
      than confounded.
    readouts:
    - name: Age at onset of measurable sensorineural hearing loss
      target: phenotypes#Sensorineural hearing loss
      direction: INCREASED
      interpretation: If onset age tracks vestibular aqueduct size independently of allele, the structural
        modifier explanation is supported over the residual-function one.
- discussion_id: atp6v0a4_mouse_calcium_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: Does the Atp6v0a4 null mouse's calcium handling transfer to human ATP6V0A4 disease, given that
    the mouse is hypocitraturic without hypercalciuria while human patients are typically both?
  attaches_to:
  - pathophysiology#Hypercalciuria with Hypocitraturia
  rationale: The mouse is a faithful model of the pump defect, the acidosis and the deafness, and it still
    develops nephrocalcinosis - but it gets there without the hypercalciuria that is standard in human
    patients. So the model cannot be used to test calcium-directed interventions or to reason about stone
    risk, even though it is the right model for the acid-base and auditory arms. The mismatch is recorded
    so the model's fidelity is not read as uniform across the three nodes it is linked to.
  proposed_experiments:
  - experiment_id: atp6v0a4_matched_acid_load_calcium
    name: Species comparison of bone buffering and filtered calcium load under matched acid loading
    description: Match the degree of systemic acidosis between mouse and human and measure filtered
      calcium load and bone mineral release, to establish whether the species difference lies in the
      response to acidosis or in tubular calcium reabsorption.
    readouts:
    - name: Urinary calcium excretion at matched blood pH
      target: pathophysiology#Hypercalciuria with Hypocitraturia
      direction: UNCHANGED
      interpretation: If mouse urinary calcium stays normal at a blood pH that makes humans
        hypercalciuric, the difference is in the response to acidosis rather than in its severity.
notes: 'Boundary with the other dRTA entries. This entry covers the ATP6V0A4 (a4 subunit) form only.
  ATP6V1B1 disease is curated at Renal_Tubular_Acidosis_Distal_2_With_Progressive_Sensorineural_Hearing_Loss
  and SLC4A1 disease at Renal_Tubular_Acidosis_Distal_4_with_Hemolytic_Anemia. The parent MONDO concept
  renal tubular acidosis (MONDO:0001909) spans proximal, distal and hyperkalaemic forms with unrelated
  mechanisms and is grouping-shaped rather than a disease; it is not curated here.

  A gain-of-function ATP6V0A4 variant (p.V512L) has been reported to cause distal renal tubular alkalosis
  with hypokalaemia and acidic urine - the mirror image of this disease in the same gene. It is
  deliberately not curated as a subtype or variant of this entry, because the direction of the functional
  impact is what determines the phenotype and the two directions are opposite. PMID:40299568 is cited on
  the trigger node only to establish that what this entry describes is the loss-of-function phenotype.

  GeneReviews (PMID:31600044) is tagged in references and mined across all four of its domains -
  clinical complications on the nephrolithiasis, chronic kidney disease and rickets phenotypes,
  diagnosis on the genetic testing record, management on the diuretic-avoidance treatment and the two
  surveillance records, and genetic counselling on the inheritance block.

  Two of the frequency figures in this entry come from a mixed-genotype dRTA cohort rather than from
  ATP6V0A4 patients. The chronic kidney disease figures (35% of children, 82% of adults) and the ~21%
  nephrolithiasis figure are both from a 340-patient European survey spanning all dRTA genes, and each
  evidence explanation says so. No ATP6V0A4-specific outcome cohort exists.

  One node is deliberately left without an ontology descriptor. Impaired Net Acid Excretion has no GO
  biological process naming renal net acid excretion; the nearest candidates describe blood-pressure
  regulation or generic proton transport, neither of which is the claim being made. Per the ontology
  term contract, no term beats a term that names something else.

  The ADV7103 registration is curated in clinical_trials as ICTRP:EUCTR2013-003828-36-SK. Finding it
  took some doing and the lesson generalises: ICTRP indexes EUCTR trials one record per recruiting
  country, so the bare EudraCT number printed in the publications (2013-003828-36) resolves to nothing,
  and the correct identifier is the number plus a two-letter country suffix. This trial recruited in
  France, Serbia, Slovakia and Spain but is only retrievable under -SK. There is no way to search
  ICTRP by the bare number through the repository tooling, so a curator holding only what the paper

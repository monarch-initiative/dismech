name: Renal Tubular Acidosis, Distal, 3, With or Without Sensorineural Hearing Loss
creation_date: '2026-09-06T08:15:00Z'
category: Mendelian
disease_term:
  preferred_term: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
  term:
    id: MONDO:0011268
    label: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
synonyms:
- ATP6V0A4-related distal renal tubular acidosis
- autosomal recessive distal renal tubular acidosis with preserved hearing
- dRTA type 3
- recessive dRTA with late-onset sensorineural hearing loss
description: 'Autosomal recessive distal renal tubular acidosis caused by biallelic loss of ATP6V0A4,
  which encodes the a4 subunit of the vacuolar H+-ATPase. The pump sits on the apical membrane of
  collecting-duct alpha-intercalated cells and is the route by which the distal nephron secretes protons
  into the tubular lumen. Without a functioning a4 subunit the urine cannot be acidified even while the
  blood is acidotic, and the result is hyperchloraemic normal-anion-gap metabolic acidosis with
  hypokalaemia, hypocitraturia, nephrocalcinosis, impaired bone physiology and growth failure.

  The entry this one sits next to in the knowledge base, ATP6V1B1-related dRTA, is the same disease of
  a different subunit of the same pump. What separates them is the ear, and the separation is one of
  timing rather than of kind. Both subunits are expressed in the inner ear as well as the kidney, and
  the distinction originally drawn in the literature - B1 gives deafness, a4 preserves hearing - did not
  survive contact with larger cohorts. The name of this disease still carries "with or without" for that
  reason.

  Three things about the auditory arm are curated rather than smoothed over. First, hearing loss in
  ATP6V0A4 disease was initially described as late-onset or absent, then found in a French referral
  series to begin as early as two months of age. Second, the two organs are not in series: alkali therapy
  corrects the acidosis and does not act on the ear, because the cochlear defect is a parallel
  consequence of the same pump failure rather than a downstream consequence of the acidosis. Third,
  enlarged vestibular aqueduct is common in dRTA and is a plausible structural modifier of who becomes
  deaf and when, which means the onset variability may not be a pure allele effect at all.

  A 2025 report of a heterozygous ATP6V0A4 gain-of-function variant causing distal renal tubular
  alkalosis is recorded here as a boundary rather than as part of this disease. It is the same gene read
  in the opposite direction, and it is the clearest available demonstration that what is curated here is
  specifically the loss-of-function phenotype.'
parents:
- Distal Renal Tubular Acidosis
- Inherited Sensorineural Hearing Loss
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: No population rate has been established for the ATP6V0A4 form specifically. The literature is
    a set of consanguineous-kindred series; the largest genetic survey assembled 21 ATP6V0A4 families,
    which indicates the scale of ascertainment rather than an occurrence measure.
  evidence:
  - reference: PMID:16611712
    reference_title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence
      for early sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fourteen new and five recurrent mutations of the ATP6V0A4 gene were identified in 21 families.
    explanation: An ascertained kindred count from a national referral series. It is a count of families
      studied, not a rate in any defined population, which is why the record is CASES_IN_LITERATURE.
references:
- reference: PMID:31600044
  title: Hereditary Distal Renal Tubular Acidosis.
  tags:
  - GeneReviews
- reference: PMID:12414817
  title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular acidosis with
    new evidence for hearing loss.
- reference: PMID:16611712
  title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence for early
    sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
- reference: PMID:22872862
  title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing loss, with
    additional extrarenal phenotype.
- reference: PMID:30773598
  title: Treatment and long-term outcome in primary distal renal tubular acidosis.
- reference: PMID:28934385
  title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice, a new genetic
    model for non-syndromic deafness with enlarged vestibular aqueducts.
pathophysiology:
- name: ATP6V0A4 Variants Disabling the V-ATPase a4 Subunit
  role: trigger
  biological_scale: MOLECULAR
  description: Biallelic loss of function in the a4 subunit of the V0 membrane domain of the vacuolar
    H+-ATPase. Like the B1 subunit, a4 has expression largely restricted to kidney and inner ear, which
    is why losing it produces a two-organ disease rather than the systemic failure a housekeeping pump
    subunit would cause.
  genetic_context:
    gene:
      preferred_term: ATP6V0A4
      term:
        id: hgnc:866
        label: ATP6V0A4
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic loss of function, most series reporting homozygous variants in consanguineous
      kindreds and compound heterozygosity elsewhere. The loss-of-function direction is not an assumption
      here - it is what separates this disease from the alkalosis phenotype produced by a gain-of-function
      variant in the same gene.
  downstream:
  - target: Failure of Apical Proton Secretion by Alpha-Intercalated Cells
    causal_link_type: DIRECT
    description: The subunit is a component of the pump that performs the secretion, so losing it removes
      the transport activity itself.
    evidence:
    - reference: PMID:16611712
      reference_title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence
        for early sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Mutations in the ATP6V1B1 and ATP6V0A4 genes, encoding subunits B1 and 4 of apical H(+)
        ATPase, cause recessive forms of distal renal tubular acidosis (dRTA).
      explanation: States the gene-to-pump-to-disease link that this edge asserts.
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recently, we identified mutations in genes encoding two different subunits of the renal
      alpha-intercalated cell's apical H(+)-ATPase that cause rdRTA.
    explanation: The gene-disease assignment, naming the cell type and the membrane domain at which the
      pump acts.
  - reference: PMID:40299568
    reference_title: A gain-of-function mutation in ATP6V0A4 drives primary distal renal tubular alkalosis
      with enhanced V-ATPase activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Previous studies have suggested that mutations in ATP6V0A4 consistently result in a loss
      of function, impairing the hydrogen ion transport efficacy of V-ATPase and leading to distal renal
      tubular acidosis and sensorineural hearing loss.
    explanation: States the loss-of-function direction that defines this disease. The same paper reports
      a contrary gain-of-function variant, which is recorded as a boundary in notes rather than as part
      of this entry.
- name: Failure of Apical Proton Secretion by Alpha-Intercalated Cells
  role: central_effector
  biological_scale: CELLULAR
  description: 'The pump cannot move protons across the apical membrane into the tubular lumen or, in
    the inner ear, into the endolymphatic compartment. This one failed transport step is the branch point
    of the entry: the renal and the auditory consequences both hang off it, and neither is downstream of
    the other. That architecture is what makes alkali therapy ineffective for the hearing loss.'
  cell_types:
  - preferred_term: collecting-duct alpha-intercalated cell
    term:
      id: CL:4030015
      label: kidney collecting duct alpha-intercalated cell
  molecular_functions:
  - preferred_term: proton-transporting ATPase activity, rotational mechanism
    term:
      id: GO:0046961
      label: proton-transporting ATPase activity, rotational mechanism
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: proton-transporting V-type ATPase, V0 domain
    term:
      id: GO:0033179
      label: proton-transporting V-type ATPase, V0 domain
  biological_processes:
  - preferred_term: proton transmembrane transport
    term:
      id: GO:1902600
      label: proton transmembrane transport
    modifier: DECREASED
  downstream:
  - target: Impaired Net Acid Excretion
    causal_link_type: DIRECT
    description: Net acid excretion is the sum of the protons the distal nephron secretes, so removing
      the secretory step removes the excretion.
  - target: Cochlear Endolymph Acid-Base Homeostasis Failure
    causal_link_type: DIRECT
    description: The same pump, expressed in the inner ear, contributes to the acid-base composition of
      endolymph. This edge is parallel to the renal one rather than downstream of it.
    evidence:
    - reference: PMID:12414817
      reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
        acidosis with new evidence for hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We show here that ATP6V0A4 is expressed within the human inner ear.
      explanation: Establishes that the gene is expressed at the site of the auditory phenotype, which
        is the evidence that the ear arm is a direct consequence of the pump defect rather than of the
        systemic acidosis.
- name: Impaired Net Acid Excretion
  role: consequence
  biological_scale: ORGANISM
  description: The kidney cannot excrete the daily acid load or regenerate the bicarbonate consumed in
    buffering it. The diagnostic signature is a urine that stays inappropriately alkaline while the blood
    is acidotic. No ontology descriptor is bound to this node - see notes.
  downstream:
  - target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
    causal_link_type: DIRECT
    description: Retained acid with preserved chloride handling gives an acidosis with a normal anion gap.
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Primary distal renal acidosis (dRTA) is characterized by hyperchloremic metabolic acidosis
      due to failure in proton excretion, variably severe nephrocalcinosis and/or nephrolithiasis
      associated with hypercalciuria and hypocitraturia.
    explanation: States the failure-of-proton-excretion to acidosis step and names the downstream renal
      consequences this node feeds.
- name: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
  role: consequence
  biological_scale: ORGANISM
  description: Sustained systemic acidosis, present from childhood and severe enough to be
    life-threatening untreated. Everything else in the renal arm of this disease is a consequence of it,
    which is why one treatment - alkali - addresses that whole arm and nothing else.
  downstream:
  - target: Renal Potassium Wasting
    causal_link_type: DIRECT
    description: Impaired distal proton secretion increases the electrochemical drive for potassium
      secretion in the same nephron segment.
  - target: Hypercalciuria with Hypocitraturia
    causal_link_type: DIRECT
    description: Acidosis mobilises bone buffer, raising the filtered calcium load, and increases
      proximal citrate reabsorption, lowering the urinary citrate that would otherwise hold that calcium
      in solution.
  - target: Skeletal Demineralisation and Growth Failure
    causal_link_type: DIRECT
    description: Chronic buffering of retained acid at the expense of bone mineral.
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive distal renal tubular acidosis (rdRTA) is characterised by severe
      hyperchloraemic metabolic acidosis in childhood, hypokalaemia, decreased urinary calcium solubility,
      and impaired bone physiology and growth.
    explanation: Names the acidosis and the three downstream consequences this node points at, in one
      sentence.
- name: Renal Potassium Wasting
  role: consequence
  biological_scale: ORGANISM
  description: Continued distal potassium secretion in the face of failed proton secretion, giving
    hypokalaemia that is occasionally severe enough to present as paralysis before the acidosis is
    recognised.
  downstream:
  - target: Hypokalemia
    causal_link_type: DIRECT
    description: The wasting is the mechanism; the low plasma potassium is the measured phenotype.
- name: Hypercalciuria with Hypocitraturia
  role: consequence
  biological_scale: ORGANISM
  description: 'The stone-forming combination: more calcium in the urine and less of the citrate that
    keeps it soluble. Notably the mouse null for this gene is hypocitraturic without being hypercalciuric,
    so the two halves of this node are not obligately linked.'
  downstream:
  - target: Nephrocalcinosis
    causal_link_type: DIRECT
    description: Calcium salts precipitate in the medullary interstitium once urinary solubility is
      exceeded.
  - target: Nephrolithiasis
    causal_link_type: DIRECT
    description: The same supersaturation forms discrete stones as well as diffuse medullary deposition.
  - target: Progressive Nephron Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Calcification and stone disease damage the interstitium over years, which is how the
      renal arm reaches chronic kidney disease.
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: variably severe nephrocalcinosis and/or nephrolithiasis associated with hypercalciuria and
      hypocitraturia
    explanation: Links the urinary chemistry directly to the calcification outcome this edge asserts.
- name: Progressive Nephron Loss
  role: consequence
  biological_scale: TISSUE
  description: Sustained medullary calcification and stone disease scar the interstitium, and renal
    function declines over time. This is the node the renal arm was missing - nephrocalcinosis is not
    an endpoint, it is the step by which a treatable electrolyte disorder becomes chronic kidney
    disease, and it is the reason the surveillance schedule exists.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Chronic kidney disease
    causal_link_type: DIRECT
    description: Cumulative nephron loss presenting as reduced glomerular filtration rate.
  evidence:
  - reference: PMID:30773598
    reference_title: Treatment and long-term outcome in primary distal renal tubular acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was an increased prevalence of chronic kidney disease (CKD) Stage >=2 in children
      (35%) and adults (82%).
    explanation: Quantifies the outcome this node produces, and the child-to-adult gradient is what makes
      it a progressive process rather than a fixed deficit. The cohort is dRTA of mixed genotype, not
      ATP6V0A4 specifically.
- name: Skeletal Demineralisation and Growth Failure
  role: consequence
  biological_scale: ORGANISM
  description: Bone as the acid buffer of last resort. Chronic mineral release impairs bone physiology
    in the growing skeleton and produces the growth failure that brings many of these children to
    attention in the first place.
  downstream:
  - target: Growth failure
    causal_link_type: DIRECT
    description: The systemic growth consequence of sustained acidosis and its skeletal buffering.
  - target: Rickets
    causal_link_type: DIRECT
    description: Demineralisation at the growth plate, the radiographic form the bone lesion takes in
      the growing skeleton.
- name: Cochlear Endolymph Acid-Base Homeostasis Failure
  role: consequence
  biological_scale: TISSUE
  description: 'Loss of the same proton pump in the inner ear, where it contributes to the acid-base
    composition of endolymph. In the mouse null the consequence is unambiguous, and it is the strongest
    mechanistic evidence available for this arm: the endocochlear potential is not merely reduced but
    absent. In humans the arm is variable, and when it manifests is the least settled question in this
    disease.'
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Enlarged vestibular aqueduct
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Endolymphatic compartment enlargement accompanies the pump defect. The edge is drawn
      with unknown intermediates on purpose - the mouse shows enlarged endolymphatic compartments in a
      V-ATPase mutant, but nothing establishes the steps between failed proton secretion and the
      structural change, and in humans the association is with dRTA generally rather than with this gene.
  - target: Sensorineural hearing loss
    causal_link_type: DIRECT
    description: Failure of endolymph homeostasis in the cochlea, with loss of the endocochlear potential
      that drives hair cell transduction.
    evidence:
    - reference: PMID:22872862
      reference_title: Atp6v0a4 knockout mouse is a model of distal renal tubular acidosis with hearing
        loss, with additional extrarenal phenotype.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: They were severely hearing-impaired, as shown by elevated auditory brainstem response
        thresholds and absent endocochlear potential.
      explanation: The mouse null gives the mechanistic readout human studies cannot - the endocochlear
        potential itself is abolished, which places the lesion at endolymph homeostasis rather than at
        a neural or conductive step.
  evidence:
  - reference: PMID:37121229
    reference_title: Hearing Loss Related to Gene Mutations in Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LVAS is common in patients with dRTA and may influence the type and severity of hearing loss
      in these patients.
    explanation: Records that a structural inner-ear abnormality accompanies the functional pump defect
      and may modify the auditory outcome, which is one reason the auditory arm is variable rather than
      obligate.
phenotypes:
- category: Renal
  name: Hyperchloremic metabolic acidosis
  frequency: OBLIGATE
  description: Normal-anion-gap metabolic acidosis with a urine that cannot be appropriately acidified -
    the defining biochemical lesion of the disease.
  phenotype_term:
    preferred_term: Hyperchloremic metabolic acidosis
    term:
      id: HP:0004918
      label: Hyperchloremic metabolic acidosis
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive distal renal tubular acidosis (rdRTA) is characterised by severe
      hyperchloraemic metabolic acidosis in childhood
    explanation: Names the phenotype as the characterising feature of the disease.
- category: Renal
  name: Hypokalemia
  frequency: FREQUENT
  description: Low plasma potassium from continued distal potassium secretion, occasionally severe enough
    to present as hypokalaemic paralysis.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severe hyperchloraemic metabolic acidosis in childhood, hypokalaemia, decreased urinary
      calcium solubility, and impaired bone physiology and growth
    explanation: Lists hypokalaemia among the characterising features of the disease.
- category: Renal
  name: Nephrocalcinosis
  frequency: FREQUENT
  description: Medullary calcium deposition, typically found on ultrasound at or near diagnosis, and the
    main long-term threat to renal function.
  phenotype_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: variably severe nephrocalcinosis and/or nephrolithiasis associated with hypercalciuria and
      hypocitraturia
    explanation: Names nephrocalcinosis as a characterising feature and gives the urinary chemistry that
      produces it.
- category: Auditory
  name: Sensorineural hearing loss
  frequency: VARIABLE
  description: 'The variable feature the disease name encodes. Originally described as preserved hearing
    or hearing loss beginning in young adulthood, then shown to begin as early as two months of age in
    some patients. Onset, not presence, is what distinguishes this from the ATP6V1B1 form.'
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, several patients with ATP6V0A4 mutations have developed hearing loss, usually in
      young adulthood.
    explanation: The original characterisation of the auditory phenotype in this gene as late-onset.
  - reference: PMID:16611712
    reference_title: 'Genetic investigation of autosomal recessive distal renal tubular acidosis: evidence
      for early sensorineural hearing loss associated with mutations in the ATP6V0A4 gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surprisingly, seven probands with ATP6V0A4 gene mutations developed severe early SNHL between
      the ages of 2 mo and 10 yr.
    explanation: The observation that overturned the late-onset rule, and the reason the disease name
      says "with or without" rather than naming an onset.
  - reference: PMID:37121229
    reference_title: Hearing Loss Related to Gene Mutations in Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was one patient with hearing loss in patients with ATP6V0A4 mutations (n = 6).
    explanation: A small contemporary audiological series in which the ATP6V0A4 auditory phenotype was
      the exception rather than the rule. It is the counterweight to the French series above, and the
      two together are why this phenotype is VARIABLE.
- category: Auditory
  name: Enlarged vestibular aqueduct
  frequency: VARIABLE
  description: A structural inner-ear abnormality found on imaging in a majority of imaged dRTA patients,
    and a candidate modifier of which patients become deaf and how severely.
  phenotype_term:
    preferred_term: Enlarged vestibular aqueduct
    term:
      id: HP:0011387
      label: Enlarged vestibular aqueduct
  evidence:
  - reference: PMID:37121229
    reference_title: Hearing Loss Related to Gene Mutations in Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Large vestibular aqueduct syndrome (LVAS) was detected in 6 (67%) of 9 patients whose
      radiological evaluation results were available.
    explanation: Gives the imaging frequency in a dRTA cohort. The cohort is not restricted to ATP6V0A4
      patients, so this is a dRTA-level rather than a gene-level frequency.
- category: Renal
  name: Nephrolithiasis
  frequency: FREQUENT
  description: Discrete calculi alongside the diffuse medullary calcification. Reported in about a fifth
    of non-SLC4A1 dRTA patients, against roughly double that in the SLC4A1 form.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:30773598
    reference_title: Treatment and long-term outcome in primary distal renal tubular acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nephrolithiasis was more common with SLC4A1 mutations (42% versus 21%).
    explanation: The 21% is the comparator group, which is where ATP6V0A4 patients sit. The figure is
      therefore for non-SLC4A1 dRTA rather than for this gene specifically.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Renal complications of hereditary dRTA include nephrocalcinosis, nephrolithiasis, medullary
      cysts, and impaired kidney function.
    explanation: GeneReviews names nephrolithiasis among the renal complications of hereditary dRTA.
- category: Renal
  name: Chronic kidney disease
  frequency: FREQUENT
  description: Declining glomerular filtration, present in about a third of children and the large
    majority of adults with dRTA. It is the outcome that makes the renal arm of this disease consequential
    beyond the electrolyte disturbance, and the reason surveillance is lifelong.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
  evidence:
  - reference: PMID:30773598
    reference_title: Treatment and long-term outcome in primary distal renal tubular acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was an increased prevalence of chronic kidney disease (CKD) Stage >=2 in children
      (35%) and adults (82%).
    explanation: Gives the frequency in children and adults separately. The cohort is 340 dRTA patients
      of mixed genotype across 29 countries, so the figure is not ATP6V0A4-specific and the entry does
      not claim it is.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Renal complications of hereditary dRTA include nephrocalcinosis, nephrolithiasis, medullary
      cysts, and impaired kidney function.
    explanation: GeneReviews names impaired kidney function among the renal complications, independently
      of the cohort figure above.
- category: Skeletal
  name: Rickets
  frequency: FREQUENT
  description: Demineralisation at the growth plate from chronic buffering of retained acid by bone. The
    adult counterpart is osteomalacia.
  phenotype_term:
    preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Additional manifestations include bone demineralization (rickets, osteomalacia), sensorineural
      hearing loss (in ATP6V0A4-, ATP6V1B1-, and FOXI1-related dRTA)
    explanation: Names rickets and osteomalacia as manifestations, and in the same sentence names
      ATP6V0A4 among the genes whose dRTA carries sensorineural hearing loss.
- category: Growth
  name: Growth failure
  frequency: FREQUENT
  description: Failure to thrive in childhood, frequently the presenting complaint, and partly reversible
    once the acidosis is corrected.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: impaired bone physiology and growth
    explanation: Names impaired growth among the characterising features of the disease.
  - reference: PMID:36529656
    reference_title: Bone mineral density and growth changes in patients with distal renal tubular
      acidosis after two-years treatment with a new alkalizing drug (ADV7103).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was an increase>0.5 units in z-scores for height and weight in 18% and 36% of the
      paediatric patients, respectively.
    explanation: Reports growth z-scores improving on alkali therapy, which evidences growth impairment
      as a feature of the treated disease and shows it is partly reversible.
genetic:
- name: ATP6V0A4
  gene_term:
    preferred_term: ATP6V0A4
    term:
      id: hgnc:866
      label: ATP6V0A4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: The a4 accessory subunit of the V0 membrane domain of the apical H+-ATPase. Biallelic
    loss-of-function variants cause this disease. The mutational spectrum is heterogeneous and largely
    private, with most reported variants novel to the family in which they were found.
  evidence:
  - reference: PMID:12414817
    reference_title: Novel ATP6V1B1 and ATP6V0A4 mutations in autosomal recessive distal renal tubular
      acidosis with new evidence for hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 12 ATP6V0A4 kindreds, seven of 10 mutations were novel.
    explanation: Quantifies the private, family-specific character of the mutational spectrum in this
      gene.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic ATP6V0A4 variants, with homozygosity common in the consanguineous kindreds that
    dominate the published series.
  evidence:
  - reference: PMID:19297287
    reference_title: '[Primary distal renal tubular acidosis].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Also, mutations in ATP6V0A4 gene encode the accessory subunit a4 of the H+ATPase, leading
      to recessive forms of dRTA with preserved hearing or delayed signs of deafness.
    explanation: States the recessive inheritance for this gene, together with the auditory

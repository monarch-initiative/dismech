discussions:
- discussion_id: gap_nit1_dgsh_to_vasculopathy
  prompt: >-
    How does loss of NIT1 and accumulation of deaminated glutathione lead to electron-dense deposits in
    cerebral artery walls, dilated basal ganglia perivascular spaces and hemorrhage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Deaminated Glutathione Accumulation
  - pathophysiology#Cellular Oxidative Stress
  - pathophysiology#Cerebral Small Vessel Wall Deposits
  rationale: >-
    The molecular lesion and the vascular pathology are both documented in patients, but nothing connects
    them. The deposit composition is unreported, oxidative stress rests on one fibroblast SOD measurement,
    and the cited knockout-mouse study reports no vascular phenotype. Why the basal ganglia are selectively
    affected is also unexplained.
notes: >-
  Entry level: a single gene with one mechanism and no MONDO descendants, so curated as one Disease. It is
  kept separate from the COL4A1 and COL4A2 brain small vessel diseases (Brain_Small_Vessel_Disease_1_With_Or_Without_Ocular_Anomalies,
  Brain_Small_Vessel_Disease_2), which are basement-membrane collagen disorders. The French family reported
  as a familial deep cavitating state (PMID:31705625) carries compound heterozygous NIT1 loss-of-function
  variants and is treated as the same disease. No treatment section is given because no disease-specific
  or published supportive management exists.

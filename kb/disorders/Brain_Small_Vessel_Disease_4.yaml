    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "The cytoplasmic SOD (Cu/Zn SOD) activity was not changed, whilst the activity of the mitochondrial SOD (MnSOD) showed a twofold increase as compared to control samples"
    explanation: Patient fibroblast measurement underlying the oxidative-stress node.

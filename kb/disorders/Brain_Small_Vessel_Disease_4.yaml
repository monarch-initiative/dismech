name: Brain Small Vessel Disease 4 (NIT1)
category: Mendelian
creation_date: "2026-10-25T22:00:00Z"
synonyms:
- NIT1-related brain small vessel disease
- NIT1-small vessel disease
- NIT1-SVD
- BSVD4
- Familial deep cavitating state with a glutathione metabolism defect
description: >-
  Brain small vessel disease 4 is an autosomal recessive cerebral small vessel disease caused by biallelic
  loss-of-function variants in NIT1, which encodes nitrilase-like protein 1, the metabolite-repair amidase
  that hydrolyzes deaminated glutathione (dGSH), a by-product formed by side reactions of transaminases.
  Patients lack detectable NIT1 protein and accumulate dGSH, which is excreted in urine and can give a
  false-positive urine sulfite dipstick test. Presentation is in adulthood with movement disorders,
  neuropsychiatric symptoms (psychosis, schizophrenia, cognitive deterioration) and occasionally seizures,
  together with a striking imaging pattern of numerous, massively dilated basal ganglia perivascular spaces
  that has also been described as a deep cavitating state or basal ganglia cysts. Non-lobar intracerebral
  hemorrhage in mid-adulthood occurred in three of seven patients in the largest series and was fatal in
  two. Autopsy shows large electron-dense deposits in the walls of small and medium-sized cerebral
  arteries. How dGSH accumulation produces the vasculopathy is not established; increased oxidative stress
  is a proposed but unproven link. About ten patients from six families have been reported, most carrying
  the recurrent p.Arg243Trp variant. There is no disease-specific treatment.

genetic:
- name: NIT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NIT1
    term:
      id: hgnc:7828
      label: NIT1
  notes: >-
    Reported alleles are the recurrent missense c.727C>T p.(Arg243Trp), found homozygous in four unrelated
    patients and in trans with the truncating c.198_199del p.(Ala68*) in three siblings (PMID:38430071), and,
    in a French family, c.457G>A p.(Gly153Arg), which alters the last nucleotide of exon 4 and affects
    splicing, in trans with the frameshift c.670dupA p.(Thr224Asnfs*41) (PMID:31705625). All tested
    genotypes abolished detectable NIT1 protein in patient fibroblasts. No ClinGen gene-disease validity
    record for NIT1 is cached, so no validity tier is recorded.
  evidence:
  - reference: PMID:38430071
    reference_title: "Bi-allelic NIT1 variants cause a brain small vessel disease characterized by movement disorders, massively dilated perivascular spaces, and intracerebral hemorrhage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "The first identified patients were 3 siblings, compound heterozygous for the NIT1 c.727C>T; (p.Arg243Trp) variant and the NIT1 c.198_199del; p.(Ala68∗) variant."
    explanation: Compound heterozygous missense and truncating NIT1 variants in the first affected sibship.
  - reference: PMID:31705625
    reference_title: Familial deep cavitating state with a glutathione metabolism defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "two rare variants were found in the NIT1 gene (Nitrilase‐like protein 1, NM_005600): an heterozygous c.457G > A;p.Gly153Arg variation and an heterozygous c.670dupA;p.Thr224Asnfs*41 variation"
    explanation: A second, independent family with compound heterozygous NIT1 variants.
pathophysiology:
- name: NIT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NIT1 variants abolish NIT1 protein in patient fibroblasts. NIT1 is an amidase highly active on
    deaminated glutathione, so its loss removes the cell's repair route for this side product of
    transaminase activity.
  genes:
  - preferred_term: NIT1
    term:
      id: hgnc:7828
      label: NIT1
  molecular_functions:
  - preferred_term: deaminated glutathione amidase activity
    term:
      id: GO:0110050
      label: deaminated glutathione amidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: metabolite repair
    term:
      id: GO:0110051
      label: metabolite repair
    modifier: DECREASED
  evidence:
  - reference: PMID:38430071
    reference_title: "Bi-allelic NIT1 variants cause a brain small vessel disease characterized by movement disorders, massively dilated perivascular spaces, and intracerebral hemorrhage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Western blotting on patient fibroblasts showed absence of NIT1 protein, and metabolic analysis in urine confirmed loss of NIT1 enzymatic function."
    explanation: Patient material shows absent protein and absent enzyme function.
  - reference: PMID:31705625
    reference_title: Familial deep cavitating state with a glutathione metabolism defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "Accordingly, the level of Nit1 protein was undetectable by western blot in fibroblasts from patient II.5 (Fig. 1D)."
    explanation: Independent family with undetectable NIT1 protein.
  - reference: PMID:28373563
    reference_title: Nit1 is a metabolite repair enzyme that hydrolyzes deaminated glutathione.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "we demonstrate that both the mammalian Nit1 and its yeast ortholog are amidases highly active toward deaminated glutathione (dGSH; i.e., a form of glutathione in which the free amino group has been replaced by a carbonyl group)"
    explanation: Biochemical assays identify dGSH hydrolysis as the enzymatic function that is lost.
  downstream:
  - target: Deaminated Glutathione Accumulation
    description: Without NIT1, dGSH formed by transaminase side reactions is not repaired and accumulates.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28373563
      reference_title: Nit1 is a metabolite repair enzyme that hydrolyzes deaminated glutathione.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Nit1-KO mutants of both human and yeast cells accumulate dGSH"
      explanation: NIT1 knockout cells accumulate the substrate.
  - target: Cerebral Small Vessel Wall Deposits
    description: >-
      NIT1 deficiency is followed by electron-dense deposits in the walls of small and medium-sized cerebral
      arteries. The intermediate steps, including whether dGSH itself is deposited, are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38430071
      reference_title: "Bi-allelic NIT1 variants cause a brain small vessel disease characterized by movement disorders, massively dilated perivascular spaces, and intracerebral hemorrhage."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Brain autopsy revealed large electron-dense deposits in the vessel walls of small and medium sized cerebral arteries."
      explanation: Autopsy of NIT1-deficient patients shows the arterial wall lesion; the abstract does not identify the deposited material.
- name: Deaminated Glutathione Accumulation
  biological_scale: ORGANISM
  description: >-
    Deaminated glutathione (N-(4-oxoglutaryl)-L-cysteinylglycine) builds up in NIT1-deficient cells and is
    excreted in urine, where it is the diagnostic metabolite and the probable cause of a positive urine
    sulfite dipstick test. Transaminases, cytosolic and mitochondrial, are the main source of dGSH.
  chemical_entities:
  - preferred_term: deaminated glutathione
    term:
      id: CHEBI:138934
      label: N-(4-oxoglutaryl)-L-cysteinylglycine
    modifier: INCREASED
  evidence:
  - reference: PMID:31705625
    reference_title: Familial deep cavitating state with a glutathione metabolism defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "A qualitative organic acid analysis profile10 on urine samples of members of the family identified in individuals mutated for NIT1 an unusual compound with a mass spectrum identical to dGSH (Fig. 1E)."
    explanation: Patients excrete dGSH in urine.
  - reference: PMID:28373563
    reference_title: Nit1 is a metabolite repair enzyme that hydrolyzes deaminated glutathione.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: "the same compound is excreted in large amounts in the urine of Nit1-KO mice"
    explanation: Nit1 knockout mice excrete dGSH in urine, matching the patient finding.
  downstream:
  - target: Cellular Oxidative Stress
    description: >-
      dGSH accumulation is proposed to interfere with glutathione metabolism and cause redox damage. This is
      a hypothesis; patient fibroblasts show only an adaptive increase in mitochondrial SOD activity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31705625
      reference_title: Familial deep cavitating state with a glutathione metabolism defect.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "dGSH may represent a toxic metabolite, whose accumulation would interfere with the glutathione metabolism and in the long term possibly induce redox damages."
      explanation: The authors' proposed link from dGSH accumulation to redox damage, stated as a possibility.
- name: Cellular Oxidative Stress
  biological_scale: CELLULAR
  description: >-
    Fibroblasts from a NIT1-deficient patient show a twofold increase in mitochondrial (Mn) superoxide
    dismutase activity with unchanged cytoplasmic Cu/Zn SOD, read as an adaptive response to reactive oxygen
    species. Whether oxidative stress contributes to the vasculopathy is unknown.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979

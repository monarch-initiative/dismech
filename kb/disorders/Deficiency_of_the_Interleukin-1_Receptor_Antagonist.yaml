diagnosis:
- name: Failure to respond to antimicrobial therapy
  presence: PRESENT
  description: >-
    Not a test, but the commonest route to suspicion. These neonates are treated
    for presumed infection, do not improve on broad-spectrum antimicrobials, and
    the sterility of the lesions only becomes apparent once that has failed.
  evidence:
  - reference: PMID:21792839
    reference_title: The first reported case of compound heterozygous IL1RN mutations causing deficiency of
      the interleukin-1 receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'After not responding to broad-spectrum antimicrobial therapy and achieving only moderate
      success with systemic steroid therapy, he was ultimately treated with recombinant IL-1Ra,
      anakinra, and experienced significant clinical improvement.'
    explanation: The diagnostic sequence in practice - antimicrobial failure, partial steroid
      response, then response to IL-1 blockade.
- name: IL1RN molecular genetic testing with copy number analysis
  presence: PRESENT
  description: >-
    Diagnosis is molecular, and sequencing alone is not sufficient. Genomic
    deletions are a recurring mechanism, one of which was found only by SNP array
    followed by breakpoint mapping, so copy number analysis belongs in the
    workup.

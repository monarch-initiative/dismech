prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: 29 genetically confirmed patients across 18 articles in a systematic review covering
    2009 to 2024.
  evidence:
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'As shown in Table 1, the majority of studies were case reports (94%),'
    explanation: Establishes that the reported experience is a case-report literature rather than
      a population denominator, which is why the measure type is CASES_IN_LITERATURE rather than
      a rate.
- population: Puerto Rico
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 15.9
  notes: Founder 175 kb deletion at 2q13, carrier allele frequency 1.3 percent. This is the only
    population-level rate available for this disease. One in 6,300 births is 15.9 per 100,000,
    which is three orders of magnitude above the worldwide case-report picture; the numeric slot
    is populated so that comparison can be made without re-reading the snippet.
  evidence:
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In the Americas, the 175 kb mutation (located in 2q13) was evidenced in Puerto Rican
      patients with DIRA, with an allele frequency of 1.3% and an incidence of 1 in every 6,300
      births.'
    explanation: Gives a birth incidence in a defined population, which is a different kind of
      measure from the worldwide case count and is why this is a second record rather than a
      replacement.
biochemical:
- name: Acute phase response
  presence: PRESENT
  notes: >-
    Markedly elevated acute phase reactants are part of the presenting picture and
    are what the treatment response is measured against. Raised ESR or CRP was
    found in 57.17 percent of patients tested in the systematic review, with
    leukocytosis in 48.27 percent and hypochromic microcytic anaemia in 37.93
    percent. They are non-specific, so they track disease activity rather than
    confirming the diagnosis, and the pooled anakinra analysis quantifies their
    improvement on treatment.
  evidence:
  - reference: PMID:28503715
    reference_title: 'Deficiency of Interleukin-1 Receptor Antagonist (DIRA): Report of the First Indian Patient
      and a Novel Deletion Affecting IL1RN.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'DIRA presents clinically with early onset generalized pustulosis, multifocal osteomyelitis,
      and elevation of acute phase reactants.'
    explanation: Names elevated acute phase reactants as part of the defining presentation.
  - reference: PMID:38398338
    reference_title: Analysis of Anakinra Therapy for the Deficiency of Interleukin-1 Receptor Antagonist through
      Clinical Evidence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Through the literature review and data analysis, it was found that 88% of patients
      had complete clinical remission of DIRA upon continual treatment with anakinra; patients
      had a mean improvement of Hemoglobin (+3.18 g/dL), Erythrocyte Sedimentation Rate (-53.4
      mm/h), and C-reactive'
    explanation: Quantifies the change in ESR and the other markers on treatment, which is how
      these non-specific measures are used in practice.
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Of the patients who underwent laboratory tests, 57.17% showed increased inflammatory
      activity'
    explanation: Gives a measured proportion for the acute phase response rather than describing
      it qualitatively. The accompanying leukocytosis and anaemia figures from the same sentence
      are carried on their own phenotypes.
animal_models:
- name: Il1rn knockout mouse
  species: Mouse
  genotype: Il1rn null
  publication: PMID:11094434
  description: >-
    IL-1Ra knockout mice develop spontaneous inflammatory disease, but what they
    develop depends on genetic background - arthritis on one, vasculitis on
    another. That background dependence is the reason this model is included with
    low fidelity rather than as a straightforward counterpart of the human
    disease, which presents with osteomyelitis and pustulosis rather than either.
  evidence:
  - reference: PMID:11094434
    reference_title: Physiologic role of interleukin-1 receptor antagonist.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Recent studies have described the spontaneous development of arthritis or vasculitis
      in IL-1 receptor antagonist (IL-1Ra) knockout mice bred on specific and different genetic
      backgrounds.'
    explanation: Establishes the model and, in the same sentence, that its phenotype is
      background-dependent.
  modeled_mechanisms:
  - target: Unopposed Interleukin-1 Driven Inflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Confirms that losing IL-1Ra alone is sufficient to produce spontaneous
      inflammatory disease, which is the core claim of the human mechanism.
    limitations: >-
      The organ targeted differs from the human disease and differs between mouse
      strains, giving arthritis or vasculitis rather than sterile osteomyelitis
      and pustulosis. The model therefore supports the sufficiency of IL-1Ra loss
      to cause inflammation without reproducing the tissue distribution that
      defines the human condition.
    evidence:
    - reference: PMID:11094434
      reference_title: Physiologic role of interleukin-1 receptor antagonist.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Thus, an imbalance between IL-1 and IL-1Ra may predispose to local inflammatory
        disease in particular tissues in the presence of other as yet unknown genetically influenced
        factors.'
      explanation: The authors' own framing - an IL-1 to IL-1Ra imbalance predisposes to local
        disease, with tissue selection depending on further unidentified genetic factors. That is
        the limitation this link records.
genetic:
- name: IL1RN
  gene_term:
    preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic Loss of Function
  notes: >-
    The allelic spectrum spans nonsense and frameshift point mutations, compound
    heterozygosity, and genomic deletions of two very different sizes - a 22 kb
    deletion covering the first four exons, and a larger Puerto Rican deletion
    removing IL1RN together with five other IL-1 family members. Heterozygous
    carriers are asymptomatic with normal cytokine responses in vitro, so a single
    functional copy is sufficient and this is not a dosage-sensitive gene in the
    way A20 is.
  evidence:
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At least three of the mutations are founder mutations; heterozygous carriers were
      asymptomatic, with no cytokine abnormalities in vitro.'
    explanation: Establishes that heterozygotes are unaffected and functionally normal, which is
      what makes this recessive rather than haploinsufficient.
  - reference: PMID:28503715
    reference_title: 'Deficiency of Interleukin-1 Receptor Antagonist (DIRA): Report of the First Indian Patient
      and a Novel Deletion Affecting IL1RN.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'PCR and Sanger sequencing of the borders of the deleted area allowed identification
      of the breakpoints of the deletion, thus confirming a homozygous 22,216 bp deletion that
      spans the first four exons of IL1RN.'
    explanation: A precisely characterised deletion allele, which also shows why sequencing alone
      can miss the diagnosis and copy number analysis is needed.
  - reference: PMID:21792839
    reference_title: The first reported case of compound heterozygous IL1RN mutations causing deficiency of
      the interleukin-1 receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sequencing of his IL1RN gene revealed that the patient was compound heterozygous for
      a known mutation (E77X) associated with IL-1Ra deficiency and a novel mutation in exon 2
      of the gene (c.140delC; p.T47TfsX4).'
    explanation: Documents compound heterozygosity, so the disease is not confined to
      consanguineous or founder populations.

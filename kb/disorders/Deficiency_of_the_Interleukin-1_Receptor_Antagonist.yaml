        and IL-1β activity at the respective receptors.'
      explanation: The increase in ligand activity at the receptor is the immediate consequence
        this edge asserts.
- name: Unopposed Interleukin-1 Driven Inflammation
  biological_scale: CELLULAR
  description: >-
    Systemic, neutrophil-dominated sterile inflammation. It begins in the neonatal
    period, which distinguishes it from most autoinflammatory diseases, and it is
    driven by signalling through a receptor that has lost its off switch rather
    than by an infectious or autoimmune stimulus.

notes: >-
  The therapeutic logic is unusually direct, and the history follows it. IL1RN
  encodes the endogenous IL-1 receptor antagonist; anakinra is recombinant IL-1
  receptor antagonist. Treatment therefore replaces the exact protein the patient
  cannot make, which is why the anakinra target_mechanisms link uses RESTORES
  rather than INHIBITS. The disease was also found this way round: a neonate
  responded to empirical anakinra, and that response is what prompted sequencing
  of the IL-1 pathway genes. The drug preceded the gene.

  Contrast with Majeed syndrome, curated separately. Both produce sterile
  multifocal osteomyelitis and both respond to IL-1 blockade, but the lesions are
  different in kind. Majeed is dysregulated production of IL-1 beta through an
  inflammasome that has lost its restraint; this disease is normal IL-1
  production with the antagonist absent. That difference is why anakinra is
  replacement here and blockade there, and it is worth stating because the two
  entries otherwise look similar.

  A caveat on canakinumab. The systematic review names it the drug of choice, and
  it is recorded as such. But canakinumab neutralises IL-1 beta only, while the
  defect in this disease leaves both IL-1 alpha and IL-1 beta unopposed. The
  treatment description states that mismatch rather than presenting the two agents
  as interchangeable.

  A negative recorded against the treatment of choice. One patient developed
  anaphylaxis to anakinra and required desensitisation. That is carried as REFUTE
  evidence on the anakinra entry, because the mechanistic neatness of replacement
  therapy does not make it universally tolerated and a curator should not read
  elegance as safety.

  Treatment efficacy is quantified, unusually for a disease this rare. A pooled
  analysis of 25 patients from 15 papers reports 88% complete clinical remission
  on continued anakinra, with mean improvements in haemoglobin, ESR and CRP. That
  is recorded in preference to the impression of efficacy that individual case
  reports convey, and it sits alongside the anaphylaxis case and the authors' own
  statement that side effects occur.

  Scale of the evidence. A systematic review covering 2009 to 2024 found 29
  confirmed patients across 18 articles, 94% of which were case reports. Every
  frequency band in this entry now derives from a measured proportion in that
  review's Results section, across all 29 patients, except where the denominator
  is patients who underwent laboratory tests; where that is the case the evidence
  explanation says so.

  Corrections made during review, kept short here because the reasoning is in the
  history records. Three bindings and two factual claims were wrong in the first
  drafts. Nail changes and osteolytic lesions were omitted from a ranked list four
  of whose other items were curated, on a rationale not applied to those four.
  Osteolytic lesions were then bound to HP:0003330 on the mistaken belief that HPO
  carried only site-specific osteolysis terms; HP:0002797 Osteolysis exists and is
  used. Nail changes were bound to HP:0008404 Nail dystrophy, which asserts a
  morphology no source here describes; HP:0001597 Abnormal nail morphology is used
  instead. Frequency bands were taken from the ranked prose in the abstract of
  PMID:40060136 while the same paper's Results section, in the same committed
  cache file, gave measured proportions; four of eight bands were wrong. And the
  reported male predominance was described as being at around four years of age;
  the paper says four months.

  The one general rule worth carrying forward. Content_type was checked and the
  cache was correctly labelled full text, so checking it would not have prevented
  the banding error. Prefer a paper's Results section over its abstract whenever
  both are cached.

  Periostitis is the one phenotype whose band does not come from the measured
  sentence, because the review does not count it. Its band rests on the original
  nine-patient cohort, where it is part of the defining triad.

  There is no GeneReviews chapter for this disease. PubMed searches under both the
  disease name and DIRA return nothing, and the systematic review at PMID:40060136
  is the closest equivalent synthesis. This is recorded so the next reader does not
  repeat the search.

  No NF-kappa-B or MyD88-IRAK step is modelled between the absent antagonist and
  the downstream inflammation. None of the seven cached references contains that
  language anywhere, so the node would have no quotable source behind it, and the
  gap is left visible rather than filled from background knowledge.

  Known extension points: multiple organ failure as the severe endpoint;
  adalimumab in a late-onset case, which would need PMID:31467740 fetched;
  AA amyloidosis as a long-term risk, which appears in this review only as
  "amyloid substance A" in one patient's laboratory column and is too thin to
  curate; and bone pain or pseudoparalysis, which the deep-research report
  raises but which no cached source here mentions.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check. Six of the seven cached references are full
  text rather than abstracts, and content_type was checked before writing. An
  earlier draft of this sentence said eight of ten, which was wrong at the time it
  was written and is corrected here.

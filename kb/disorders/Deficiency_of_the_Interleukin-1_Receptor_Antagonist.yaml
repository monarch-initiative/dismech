treatments:
- name: Anakinra
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Recombinant interleukin-1 receptor antagonist, and therefore replacement of
    the exact protein the patient cannot make rather than blockade of an excess.
    The correspondence is also historical: an empirical anakinra response in the
    first patient is what prompted sequencing of the IL-1 pathway and led to the
    disease being defined.
  treatment_term:
    preferred_term: biological therapy
    term:
      id: NCIT:C15187

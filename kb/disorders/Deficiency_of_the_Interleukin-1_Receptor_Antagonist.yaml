        label: Anakinra
  target_mechanisms:
  - target: Absent Antagonism at the Interleukin-1 Receptor
    treatment_effect: RESTORES
    description: Supplies exogenous IL-1 receptor antagonist, restoring the competitive block that
      the mutation removed. This is restoration of a missing function rather than inhibition of a
      pathway.
    evidence:
    - reference: PMID:19494218
      reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Response to empirical treatment with the recombinant interleukin-1-receptor antagonist
        anakinra in the first patient prompted us to test for the presence of mutations and changes
        in proteins and their function in interleukin-1-pathway genes including IL1RN.'
      explanation: The drug is named as recombinant IL-1 receptor antagonist, which is what makes
        this restoration of the missing protein rather than generic anti-cytokine therapy.
  evidence:
  - reference: PMID:21792839
    reference_title: The first reported case of compound heterozygous IL1RN mutations causing deficiency of
      the interleukin-1 receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'His case highlights IL-1Ra deficiency as an autoinflammatory disease that is distinct
      from neonatal-onset multisystem inflammatory disease but that also responds well to
      anakinra.'
    explanation: Records the response and distinguishes the disease from its main differential.
  - reference: PMID:38398338
    reference_title: Analysis of Anakinra Therapy for the Deficiency of Interleukin-1 Receptor Antagonist through
      Clinical Evidence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Through the literature review and data analysis, it was found that 88% of patients
      had complete clinical remission of DIRA upon continual treatment with anakinra; patients
      had a mean improvement of Hemoglobin (+3.18 g/dL), Erythrocyte Sedimentation Rate (-53.4
      mm/h), and C-reactive'
    explanation: The only quantified response figure available - 88% complete remission across 25
      patients pooled from 15 papers, with the accompanying laboratory improvements. It replaces
      the impression of efficacy that individual case reports give.
  - reference: PMID:38398338
    reference_title: Analysis of Anakinra Therapy for the Deficiency of Interleukin-1 Receptor Antagonist through
      Clinical Evidence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although anakinra has been effective for the complete remission of DIRA, it has also
      shown various side effects.'
    explanation: Pairs the efficacy with the authors' own qualification about side effects, which
      is the context for the anaphylaxis item below.
  - reference: PMID:28503715
    reference_title: 'Deficiency of Interleukin-1 Receptor Antagonist (DIRA): Report of the First Indian Patient

phenotypes:
- category: Skeletal
  name: Osteomyelitis
  frequency: FREQUENT
  description: >-
    Sterile multifocal osteomyelitis with neonatal onset, the cardinal skeletal
    feature. Culture-negative, so it is the finding most often pursued as
    infection before the diagnosis is reached.
  phenotype_term:
    preferred_term: Osteomyelitis
    term:
      id: HP:0002754
      label: Osteomyelitis
    onset:
      onset_category: NEONATAL
      notes: Neonatal onset distinguishes this from most autoinflammatory bone disease, and is
        supported by PMID:19494218 describing neonatal onset in all nine children of the original
        cohort. Onset is not invariably neonatal. PMID:26100510 reports a girl who first presented
        at one year of age and is described there as having a late-onset presentation in comparison
        with previously reported children. The category stays NEONATAL because that is the
        presentation in the great majority of reported patients, but a later presentation does not
        exclude the diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The most frequent clinical signs were the presence of pustular lesions on the skin
      (82.75%), followed by the presence of osteolytic lesions (55.17%), nail changes (41.37%),
      osteomyelitis (41.37%), arthralgia (27.58%), fever (27.58%), dyspnea (24.13%), pneumonia
      (20.68%), joint contracture (13.79%), and bone fracture (10.34%).'
    explanation: 41.37 percent, which confirms the FREQUENT band this phenotype already carried.
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We studied nine children from six families who had neonatal onset of sterile multifocal
      osteomyelitis, periostitis, and pustulosis.'
    explanation: Establishes the feature and its neonatal onset in the defining cohort.

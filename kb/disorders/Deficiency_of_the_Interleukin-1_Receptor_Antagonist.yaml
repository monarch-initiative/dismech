genetic:
- name: IL1RN
  gene_term:
    preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic Loss of Function
  notes: >-
    The allelic spectrum spans nonsense and frameshift point mutations, compound
    heterozygosity, and genomic deletions of two very different sizes - a 22 kb
    deletion covering the first four exons, and a larger Puerto Rican deletion
    removing IL1RN together with five other IL-1 family members. Heterozygous
    carriers are asymptomatic with normal cytokine responses in vitro, so a single
    functional copy is sufficient and this is not a dosage-sensitive gene in the
    way A20 is.
  evidence:
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At least three of the mutations are founder mutations; heterozygous carriers were
      asymptomatic, with no cytokine abnormalities in vitro.'
    explanation: Establishes that heterozygotes are unaffected and functionally normal, which is
      what makes this recessive rather than haploinsufficient.
  - reference: PMID:28503715
    reference_title: 'Deficiency of Interleukin-1 Receptor Antagonist (DIRA): Report of the First Indian Patient
      and a Novel Deletion Affecting IL1RN.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'PCR and Sanger sequencing of the borders of the deleted area allowed identification
      of the breakpoints of the deletion, thus confirming a homozygous 22,216 bp deletion that
      spans the first four exons of IL1RN.'
    explanation: A precisely characterised deletion allele, which also shows why sequencing alone
      can miss the diagnosis and copy number analysis is needed.
  - reference: PMID:21792839
    reference_title: The first reported case of compound heterozygous IL1RN mutations causing deficiency of
      the interleukin-1 receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sequencing of his IL1RN gene revealed that the patient was compound heterozygous for
      a known mutation (E77X) associated with IL-1Ra deficiency and a novel mutation in exon 2
      of the gene (c.140delC; p.T47TfsX4).'
    explanation: Documents compound heterozygosity, so the disease is not confined to
      consanguineous or founder populations.

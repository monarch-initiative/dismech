- name: Rilonacept
  therapeutic_modality: OTHER
  description: >-
    A recombinant fusion protein that acts as a soluble decoy receptor, binding
    both IL-1 alpha and IL-1 beta. That dual binding matches the defect here
    better than canakinumab does, since both ligands are left unopposed when the
    antagonist is absent. It is named as one of three IL-1 blockers used in this
    disease, but the cached sources report no outcome data for it in DIRA
    specifically. Modality is recorded as OTHER because a decoy-receptor fusion
    protein is neither a monoclonal antibody nor replacement of a protein the
    patient lacks.
  treatment_term:
    preferred_term: biological therapy

name: Deficiency of the Interleukin-1 Receptor Antagonist
creation_date: '2026-09-09T17:00:00Z'
description: >-
  An autosomal recessive autoinflammatory disease caused by biallelic
  loss-of-function variants in IL1RN, which encodes the interleukin-1 receptor
  antagonist. IL-1Ra is the endogenous competitive blocker of the IL-1 receptor,
  so losing it leaves IL-1 alpha and IL-1 beta signalling with no brake at all.
  Neonates present with sterile multifocal osteomyelitis, periostitis and
  pustulosis, and without treatment the disease carries high morbidity and
  mortality. The therapeutic logic is unusually direct: anakinra is recombinant
  IL-1Ra, so treatment replaces the exact protein the patient cannot make. That
  correspondence is also how the disease was found - a neonate responded to
  empirical anakinra, which prompted sequencing of the IL-1 pathway genes.
categories:
- Autoinflammatory Disease
- Inborn Error of Immunity
- Autoinflammatory Bone Disease
parents:
- autoinflammatory syndrome
synonyms:
- DIRA
- interleukin-1 receptor antagonist deficiency
- osteomyelitis, sterile multifocal, with periostitis and pustulosis
- OMPP
epidemiology:
- name: Original description and founder mutations
  description: >-
    Described in 2009 in nine children from six families, in Newfoundland, the
    Netherlands, Lebanon and Puerto Rico. At least three of the identified
    mutations are founder mutations, which is why the disease clusters in
    particular populations rather than appearing uniformly.
  evidence:
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified homozygous mutations of IL1RN in nine affected children, from one family
      from Newfoundland, Canada, three families from The Netherlands, and one consanguineous family
      from Lebanon.'
    explanation: Gives the original cohort and its geographic spread.
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At least three of the mutations are founder mutations; heterozygous carriers were
      asymptomatic, with no cytokine abnormalities in vitro.'
    explanation: Records the founder effect and, importantly, that heterozygous carriers are
      unaffected with normal cytokine function - the evidence that one working copy suffices.
- name: Reported experience
  description: >-
    Still very rare. A systematic review covering 2009 to 2024 found 18 eligible
    articles describing 29 confirmed patients, and 94% of those articles were case
    reports. Every frequency statement about this disease rests on that base.
  evidence:
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'As shown in Table 1, the majority of studies were case reports (94%),'
    explanation: Characterises the evidence base as almost entirely case reports, which is the
      main caveat on everything else recorded here.
pathophysiology:
- name: Biallelic IL1RN Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Homozygous or compound heterozygous IL1RN variants
    abolish or truncate the interleukin-1 receptor antagonist. Point mutations,
    frameshifts and genomic deletions all occur, including a Puerto Rican deletion
    removing IL1RN together with five other IL-1 family members and a 22 kb
    deletion spanning the first four exons.
  genes:
  - preferred_term: IL1RN
    term:
      id: hgnc:6000
      label: IL1RN
  molecular_functions:
  - preferred_term: interleukin-1 receptor antagonist activity
    modifier: DECREASED
    term:
      id: GO:0005152
      label: interleukin-1 receptor antagonist activity
  evidence:
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We report a disorder caused by mutations of IL1RN, which encodes the interleukin-1-receptor
      antagonist, with prominent involvement of skin and bone.'
    explanation: Names the gene, the protein it encodes, and the two organ systems that dominate
      the phenotype.
  - reference: PMID:19494218
    reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A nonconsanguineous patient from Puerto Rico was homozygous for a genomic deletion
      that includes IL1RN and five other interleukin-1-family members.'
    explanation: A contiguous gene deletion removing several IL-1 family members alongside IL1RN,
      which matters because the phenotype is nevertheless the same - consistent with IL1RN loss
      being the operative lesion.
  downstream:
  - target: Absent Antagonism at the Interleukin-1 Receptor
    causal_link_type: DIRECT
    description: With no antagonist protein made, the competitive block at the IL-1 receptor is
      simply absent.
    evidence:
    - reference: PMID:40060136
      reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Mutations in IL-1RN result in the partial or complete absence of the IL-1RA (interleukin-1
        receptor antagonist) protein, which leads to a significant increase in interleukin (IL)-1α
        and IL-1β activity at the respective receptors.'
      explanation: States the step from absent protein to increased ligand activity at the
        receptor, and names both IL-1 alpha and IL-1 beta.
    - reference: PMID:19494218
      reference_title: An autoinflammatory disease with deficiency of the interleukin-1-receptor antagonist.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'The IL1RN mutations resulted in a truncated protein that is not secreted, thereby
        rendering cells hyperresponsive to interleukin-1beta stimulation.'
      explanation: The direct functional demonstration, and the strongest single piece of evidence
        for this edge. It establishes both halves - the protein is not secreted, and the
        consequence is cellular hyperresponsiveness to IL-1 beta.
- name: Absent Antagonism at the Interleukin-1 Receptor
  biological_scale: MOLECULAR
  description: >-
    IL-1Ra normally occupies the IL-1 receptor without activating it, competing
    with IL-1 alpha and IL-1 beta. Its absence is a loss of negative feedback
    rather than an increase in ligand, which is why the disease behaves as
    unopposed rather than excessive signalling.
  genes:
  - preferred_term: IL1A
    term:
      id: hgnc:5991
      label: IL1A
  - preferred_term: IL1B
    term:
      id: hgnc:5992
      label: IL1B
  - preferred_term: IL1R1
    term:
      id: hgnc:5993
      label: IL1R1
  biological_processes:
  - preferred_term: interleukin-1-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0070498
      label: interleukin-1-mediated signaling pathway
  evidence:
  - reference: PMID:40060136
    reference_title: 'Deficiency of interleukin-1 receptor antagonist: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This lack of negative feedback on the IL-1 receptor leads to an acute, severe, and
      sometimes fatal inflammatory process.'
    explanation: Frames the defect as loss of negative feedback at the receptor, which is the
      distinction this node draws, and states that the resulting process can be fatal.
  downstream:
  - target: Unopposed Interleukin-1 Driven Inflammation
    causal_link_type: DIRECT
    description: Without the antagonist, physiological IL-1 signalling proceeds without
      termination.
    evidence:
    - reference: PMID:40060136

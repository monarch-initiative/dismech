notes: >-
  The therapeutic logic is unusually direct, and the history follows it. IL1RN
  encodes the endogenous IL-1 receptor antagonist; anakinra is recombinant IL-1
  receptor antagonist. Treatment therefore replaces the exact protein the patient
  cannot make, which is why the anakinra target_mechanisms link uses RESTORES
  rather than INHIBITS. The disease was also found this way round: a neonate
  responded to empirical anakinra, and that response is what prompted sequencing
  of the IL-1 pathway genes. The drug preceded the gene.

  Contrast with Majeed syndrome, curated separately. Both produce sterile
  multifocal osteomyelitis and both respond to IL-1 blockade, but the lesions are
  different in kind. Majeed is dysregulated production of IL-1 beta through an
  inflammasome that has lost its restraint; this disease is normal IL-1
  production with the antagonist absent. That difference is why anakinra is
  replacement here and blockade there, and it is worth stating because the two
  entries otherwise look similar.

  A caveat on canakinumab. The systematic review names it the drug of choice, and
  it is recorded as such. But canakinumab neutralises IL-1 beta only, while the
  defect in this disease leaves both IL-1 alpha and IL-1 beta unopposed. The
  treatment description states that mismatch rather than presenting the two agents
  as interchangeable.

  A negative recorded against the treatment of choice. One patient developed
  anaphylaxis to anakinra and required desensitisation. That is carried as REFUTE
  evidence on the anakinra entry, because the mechanistic neatness of replacement
  therapy does not make it universally tolerated and a curator should not read
  elegance as safety.

  Treatment efficacy is quantified, unusually for a disease this rare. A pooled
  analysis of 25 patients from 15 papers reports 88% complete clinical remission
  on continued anakinra, with mean improvements in haemoglobin, ESR and CRP. That
  is recorded in preference to the impression of efficacy that individual case
  reports convey, and it sits alongside the anaphylaxis case and the authors' own
  statement that side effects occur.

  Scale of the evidence. A systematic review covering 2009 to 2024 found 29
  confirmed patients across 18 articles, 94% of which were case reports. Frequency
  bands here derive from a single ranked list in that review rather than from
  denominators, so they express rank order rather than measured proportions. Where
  a manifestation sits inside a grouped category - fracture within the
  osteoarticular group - it is banded one level lower and the reason is stated in
  its evidence explanation.

  Known extension points: nail changes, which the review ranks immediately after
  the osteoarticular manifestations but which no cached source describes in enough
  detail to bind confidently; multiple organ failure as the severe endpoint;
  rilonacept and glucocorticoids, named as used without outcome data; growth and
  developmental delay; and the reported male predominance around four years of
  age, which sits oddly against the neonatal onset described elsewhere and would
  need the full review text to reconcile.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check. Eight of the ten cached references are full
  text rather than abstracts, and content_type was checked before writing.

    An anti-IL-1 beta monoclonal antibody, used successfully including in a
    late-onset case, and identified as the drug of choice in the systematic
    review. Note it neutralises IL-1 beta only, so unlike anakinra it does not
    address IL-1 alpha signalling, which is also unopposed in this disease.
  treatment_term:
    preferred_term: biological therapy

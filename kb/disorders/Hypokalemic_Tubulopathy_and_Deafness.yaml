    Targeted disruption of Kcnj16 produces hypokalemic, hyperchloremic metabolic
    acidosis with hypercalciuria, and exaggerated short-term responses to
    hydrochlorothiazide indicating excessive distal convoluted tubule sodium
    absorption. Chronic hydrochlorothiazide normalised urinary sodium and calcium
    and abolished the acidosis. Electrophysiology of the DCT basolateral membrane
    showed increased potassium conductance despite the absence of Kir5.1, because
    the remaining homomeric Kir4.1 channels lose their pH sensitivity — a
    compensation, not a preserved normal state.

    Important context: this study was published in 2011, a decade before the
    human KCNJ16 disease was delineated in 2021. Its authors could only compare
    their mice against EAST/SeSAME, and on that comparison described the renal
    phenotype as the opposite of it. Read against the human entity now known,
    the acidotic mouse anticipates rather than contradicts the human phenotype.
  modeled_mechanisms:
  - target: Disturbed Proximal Bicarbonate Handling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the hypokalemia and the acidotic direction of the
      acid-base disturbance that distinguishes this disease from Kir4.1 disease.
    limitations: >-
      The paper predates the human disease and frames its findings against
      EAST/SeSAME rather than against KCNJ16 patients, so the correspondence is
      one drawn here rather than claimed by the authors. The murine acidosis is
      specifically hyperchloremic with hypercalciuria, which is a more precisely
      specified picture than the "variable severity" acidosis reported in
      patients, so the match should not be over-read. Deafness is not addressed
      by this study.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        In the knockout mouse, remaining homomeric Kir4.1 channels lose pH
        sensitivity and basolateral potassium conductance actually rises. Whether
        the same compensation occurs in human patients is not established, so the
        residual-conductance state of the murine tubule may not represent the
        human one.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The characterisation is of an adult constitutive knockout under acute and
        chronic thiazide challenge, not of the developmental course or natural
        history of the human disease.
    evidence:
    - reference: PMID:21633011
      reference_title: "Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Kir5.1(-/-) mice displayed hypokalemic, hyperchloremic metabolic acidosis with hypercalciuria."
      explanation: >-
        Reports the knockout's hypokalemia and metabolic acidosis, the two
        features corresponding to the human KCNJ16 phenotype.
    - reference: PMID:21633011
      reference_title: "Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "there is an increased K(+) conductance caused by the decreased pH sensitivity of the remaining homomeric Kir4.1 channels"
      explanation: >-
        Documents the compensatory change in residual Kir4.1 channels recorded as
        a species divergence, since it is unestablished in human patients.
- name: Kir5.1-null mouse, auditory phenotype (Lv et al.)
  species: Mouse
  genotype: Kcnj16 -/-
  publication: PMID:35370765
  description: >-
    A separate Kcnj16 knockout line in which hearing function was unaffected.
    Recorded as its own model entry rather than folded into the renal knockout
    above, because it makes the opposite kind of claim: a negative result on the
    deafness arm. The review that reports it proposes compensatory mechanisms
    present in the mouse strain but not to the same extent in humans with
    biallelic Kir5.1 mutations.

    The primary source is Lv et al. 2021; it is cited here through the review,
    which is the version available in this entry's reference cache.
  modeled_mechanisms:
  - target: Sensorineural Hearing Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Loss of Kir5.1 in the mouse does not reproduce the sensorineural hearing
      loss that is a defining feature of the human disease.
    limitations: >-
      This is a negative result whose interpretation is unsettled. It does not
      show that Kir5.1 is dispensable for human hearing; the review's reading is
      that murine compensation masks the deficit. Because the model fails on
      precisely the phenotype it would be used to study, it cannot be used to
      investigate the cochlear arm of this disease, and a reader should not infer
      from the renal knockout above that the auditory question is merely
      unstudied.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The review attributes the discrepancy to compensatory mechanisms present
        in this mouse strain that are not present to the same extent in humans
        carrying biallelic Kir5.1 mutations, so the murine auditory system does
        not stand in for the human one here.
    evidence:
    - reference: PMID:35370765
      reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, hearing function has been shown to be unaffected in a Kir5.1 knockout mouse model (Lv et al., 2021)."
      explanation: >-
        Reports the negative auditory result that this link records.
    - reference: PMID:35370765
      reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This may indicate efficient compensatory mechanisms in this strain of Kir5.1 knockout mice that are not present to the same extent in humans with biallelic Kir5.1 mutations."
      explanation: >-
        Gives the review's interpretation of the negative result, which is the
        basis for the species divergence recorded here.
discussions:
- discussion_id: kcnj16_murine_hearing_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does loss of Kir5.1 cause sensorineural hearing loss in humans but leave
    hearing unaffected in the Kcnj16 knockout mouse?
  attaches_to:
  - pathophysiology#Cochlear Potassium Homeostasis Failure
  - phenotypes#Sensorineural Hearing Loss
  rationale: >-
    Evidence exists on both sides and they disagree, which is the defining shape
    of a model-fidelity gap rather than an absence of evidence. Human patients
    with biallelic KCNJ16 variants have sensorineural hearing loss consistently
    enough for it to be part of the disease definition, yet a Kcnj16 knockout
    mouse hears normally. The review proposes murine compensation, but that is a
    hypothesis rather than a demonstrated mechanism, and it is unresolved which
    compensating conductance is responsible.

    This matters beyond bookkeeping: it means the cochlear arm of this disease
    currently has no validated animal model, so the Kir5.1 role in the spiral
    ligament rests on human genetics plus expression data rather than on
    reproduction in a model system.
  evidence:
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This may indicate efficient compensatory mechanisms in this strain of Kir5.1 knockout mice that are not present to the same extent in humans with biallelic Kir5.1 mutations."
    explanation: >-
      States the proposed explanation for the mismatch and marks it as
      provisional.
treatments:
- name: Potassium and Alkali Replacement
  description: >-
    Supportive electrolyte management: potassium supplementation for the urinary
    losses, with alkali as required for the acidosis. Symptomatic rather than
    mechanism-directed — there is no therapy that restores the channel — so this
    entry deliberately claims no target_mechanisms link. The mouse data hinting
    at thiazide responsiveness are a model finding, not human evidence, and are
    recorded under animal_models rather than proposed as treatment here.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    Deliberately carries no evidence item. None of the three sources cached for
    this entry states a management recommendation -- the review only gestures at
    future channel-targeting compounds -- so there is no quotable clinical
    statement to attach, and manufacturing one would be worse than leaving the
    treatment uncited. The murine finding that chronic hydrochlorothiazide
    normalised urinary sodium and calcium and abolished the acidosis is recorded
    under animal_models, not here: it is model data and has not been shown in
    patients.
  treatment_term:
    preferred_term: potassium and alkali supplementation
    term:
      id: NCIT:C15433

      rodent immunohistochemistry, not human tissue.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Kir5.1 is expressed mainly in the root cells and spindle cells of the spiral ligament"
    explanation: >-
      Localises Kir5.1 to the spiral ligament rather than the stria vascularis,
      which is the compartment this node binds.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Kir4.1 is expressed primarily in intermediate cells of the stria vascularis and is responsible for endolymph composition and endocochlear potential"
    explanation: >-
      Assigns the stria vascularis and the endocochlear potential to Kir4.1, the
      partner subunit, which is why this node does not claim them for Kir5.1.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "proposed that Kir5.1 is involved in K+ cycling and may play a role in the establishment of the endocochlear potential"
    explanation: >-
      States the Kir5.1 cochlear role as proposed rather than established, which

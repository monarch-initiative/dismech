    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants affect the function of heteromeric potassium channels, disturbing proximal tubular bicarbonate handling as well as distal tubular salt reabsorption."
    explanation: >-
      Directly attributes disturbed proximal bicarbonate handling to the
      heteromeric channel defect.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT

genetic:
- name: KCNJ16 loss of function
  gene_term:
    preferred_term: KCNJ16
    term:
      id: hgnc:6262
      label: KCNJ16
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic KCNJ16 variants, first delineated in 2021 in eight patients by a
    candidate gene approach plus whole-exome sequencing. Disease-associated
    variants are scattered across different functional domains of Kir5.1 and all
    strongly impair heteromers with Kir4.1 or Kir4.2, which is consistent with
    Kir5.1 acting only as an obligate partner subunit. The absence of CNS
    involvement in patients is itself informative: it argues against Kir5.1
    forming functionally important channels with other partners in the brain.
    Functional consequences were generally more severe when Kir5.1 mutants were
    coexpressed with Kir4.2 than with Kir4.1, consistent with the prominence of
    the proximal tubular arm, since Kir4.2 is the proximal partner.
  evidence:
  - reference: PMID:33811157
    reference_title: "Defects in KCNJ16 Cause a Novel Tubulopathy with Hypokalemia, Salt Wasting, Disturbed Acid-Base Homeostasis, and Sensorineural Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A candidate gene approach and whole-exome sequencing determined the underlying genetic defect in eight patients"
    explanation: >-
      Describes how the causative gene was identified in the founding cohort.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as all Kir5.1 mutations investigated, scattered over different functional domains of Kir5.1, strongly affected heteromers with either Kir4.1 or Kir4.2"
    explanation: >-
      Establishes that the causative variants act uniformly through impaired
      heteromer function regardless of which domain they affect.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "functional consequences were generally more severe when Kir5.1 mutants were coexpressed with Kir4.2"
    explanation: >-
      Shows the defect is more severe with the proximal partner Kir4.2, helping
      explain the prominence of the proximal tubular arm.

- name: Cochlear Potassium Homeostasis Failure
  biological_scale: TISSUE
  description: >-
    Kir4.1 and Kir5.1 are both expressed in the inner ear, but not in the same
    compartment, and the distinction matters here. Kir4.1 sits in the
    intermediate cells of the stria vascularis and is what generates the
    endocochlear potential; Kir5.1 is expressed mainly in the root and spindle
    cells of the spiral ligament, where it is proposed to participate in
    potassium cycling and may contribute to establishing that potential. The
    Kir5.1 role is therefore proposed rather than established, and this node is
    worded to reflect that: loss of the Kir5.1-containing conductance in the
    spiral ligament is the best-supported route to the sensorineural deafness,
    which is the one major extrarenal feature of this disease and the feature it
    shares with EAST/SeSAME.

    An earlier revision of this entry bound the stria vascularis here. That was
    wrong in exactly the way this entry's notes warn about -- it assigned Kir5.1
    the compartment the cited review assigns to Kir4.1.
  locations:
  - preferred_term: root and spindle cells of the spiral ligament
    term:
      id: UBERON:0006725
      label: spiral ligament

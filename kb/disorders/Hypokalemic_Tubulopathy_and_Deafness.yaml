    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:33811157
    reference_title: "Defects in KCNJ16 Cause a Novel Tubulopathy with Hypokalemia, Salt Wasting, Disturbed Acid-Base Homeostasis, and Sensorineural Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in the KCNJ16 gene encoding KCNJ16, which along with KCNJ15 and KCNJ10, constitutes the major basolateral potassium channel of the proximal and distal tubules, respectively."
    explanation: >-
      Places the affected channel at the basolateral membrane of both nephron
      segments, which is the anatomical basis of the mixed tubulopathy.
  - reference: PMID:33811157
    reference_title: "Defects in KCNJ16 Cause a Novel Tubulopathy with Hypokalemia, Salt Wasting, Disturbed Acid-Base Homeostasis, and Sensorineural Deafness."
    supports: SUPPORT

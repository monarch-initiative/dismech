- name: Disturbed Proximal Bicarbonate Handling
  biological_scale: TISSUE
  description: >-
    In the proximal tubule, where Kir5.1 partners Kir4.2, loss of the basolateral
    conductance disturbs bicarbonate handling. This is the arm that produces the
    acid-base abnormality, and it is the axis on which this disease separates most
    sharply from EAST/SeSAME: KCNJ16 patients show acidosis of variable severity
    rather than the hypokalemic metabolic alkalosis of Kir4.1 disease.

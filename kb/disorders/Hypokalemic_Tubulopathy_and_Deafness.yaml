name: Hypokalemic Tubulopathy and Deafness
creation_date: "2026-09-04T03:55:00Z"
category: Genetic
description: >-
  Hypokalemic tubulopathy and deafness is an autosomal recessive channelopathy
  caused by biallelic variants in KCNJ16, which encodes the inwardly rectifying
  potassium channel subunit Kir5.1. Kir5.1 does not form functional channels on
  its own; it works as an obligate partner, heteromerising with Kir4.1 (KCNJ10)
  in the distal nephron and with Kir4.2 (KCNJ15) in the proximal tubule to make
  the major basolateral potassium conductance of each segment. That conductance
  recycles potassium to sustain the basolateral Na+/K+-ATPase, and it is
  strongly pH-sensitive, so Kir5.1 also acts as a pH sensor coupling acid-base
  status to salt transport. Loss of Kir5.1 therefore produces a tubulopathy with
  both proximal and distal components — disturbed bicarbonate handling and
  impaired distal salt reabsorption — presenting with hypokalemia, renal salt
  wasting and a disturbed acid-base picture, together with sensorineural
  deafness from the equivalent channel in the inner ear. Unlike its Kir4.1
  counterpart, the central nervous system is spared.
disease_term:
  preferred_term: hypokalemic tubulopathy and deafness
  term:
    id: MONDO:0859167
    label: hypokalemic tubulopathy and deafness
synonyms:
- KCNJ16-related tubulopathy
- Kir5.1 channelopathy
parents:
- Renal Tubulopathy
notes: >-
  Named Entity Confusion guardrail, and the main risk on this entry. EAST/SeSAME
  syndrome (already curated as EAST_Syndrome) is caused by KCNJ10/Kir4.1, the
  obligate *partner* subunit of the very channel disrupted here. The two entries
  will therefore look alike, and the literature frequently discusses them
  together. They are different diseases, and the review cited here states the
  differences directly:

  - Shared: sensorineural hearing loss and hypokalemia.
  - Different: EAST/SeSAME produces hypokalemic metabolic *alkalosis*, whereas
    KCNJ16 loss produces *acidosis* of variable severity.
  - Different: the CNS is unaffected in KCNJ16 disease — no epilepsy, ataxia or
    intellectual disability, which are cardinal in EAST/SeSAME.

  Evidence must come from KCNJ16-specific reports and must not be borrowed from
  the KCNJ10 literature. The existing EAST_Syndrome entry mentions KCNJ16
  contextually; that mention is correct and is not an entry for this disease.

  A second, subtler trap concerns the mouse model. The Kcnj16-null mouse was
  published in 2011, a decade before this human entity was delineated in 2021,
  so its authors compared their acidotic mice against EAST/SeSAME and described
  the phenotype as the opposite of it. Read today, that mouse anticipates the
  human KCNJ16 phenotype rather than contradicting it. The animal_models block
  is worded to report what the paper measured without attributing to it a
  comparison it could not have made.

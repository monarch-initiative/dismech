genetic:
- name: KCNJ16 loss of function
  gene_term:
    preferred_term: KCNJ16
    term:
      id: hgnc:6262
      label: KCNJ16
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic KCNJ16 variants, first delineated in 2021 in eight patients by a
    candidate gene approach plus whole-exome sequencing. Disease-associated
    variants are scattered across different functional domains of Kir5.1 and all
    strongly impair heteromers with Kir4.1 or Kir4.2, which is consistent with
    Kir5.1 acting only as an obligate partner subunit. The absence of CNS
    involvement in patients is itself informative: it argues against Kir5.1
    forming functionally important channels with other partners in the brain.
  evidence:
  - reference: PMID:33811157
    reference_title: "Defects in KCNJ16 Cause a Novel Tubulopathy with Hypokalemia, Salt Wasting, Disturbed Acid-Base Homeostasis, and Sensorineural Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A candidate gene approach and whole-exome sequencing determined the underlying genetic defect in eight patients"
    explanation: >-
      Describes how the causative gene was identified in the founding cohort.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as all Kir5.1 mutations investigated, scattered over different functional domains of Kir5.1, strongly affected heteromers with either Kir4.1 or Kir4.2"
    explanation: >-
      Establishes that the causative variants act uniformly through impaired
      heteromer function regardless of which domain they affect.
animal_models:
- name: Kir5.1-null mouse (Kcnj16 knockout)
  species: Mouse
  genotype: Kcnj16 -/-
  publication: PMID:21633011
  description: >-
    Targeted disruption of Kcnj16 produces hypokalemic, hyperchloremic metabolic
    acidosis with hypercalciuria, and exaggerated short-term responses to
    hydrochlorothiazide indicating excessive distal convoluted tubule sodium
    absorption. Chronic hydrochlorothiazide normalised urinary sodium and calcium
    and abolished the acidosis. Electrophysiology of the DCT basolateral membrane
    showed increased potassium conductance despite the absence of Kir5.1, because
    the remaining homomeric Kir4.1 channels lose their pH sensitivity — a
    compensation, not a preserved normal state.

    Important context: this study was published in 2011, a decade before the
    human KCNJ16 disease was delineated in 2021. Its authors could only compare
    their mice against EAST/SeSAME, and on that comparison described the renal
    phenotype as the opposite of it. Read against the human entity now known,
    the acidotic mouse anticipates rather than contradicts the human phenotype.
  modeled_mechanisms:
  - target: Disturbed Proximal Bicarbonate Handling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the hypokalemia and the acidotic direction of the
      acid-base disturbance that distinguishes this disease from Kir4.1 disease.
    limitations: >-
      The paper predates the human disease and frames its findings against
      EAST/SeSAME rather than against KCNJ16 patients, so the correspondence is
      one drawn here rather than claimed by the authors. The murine acidosis is
      specifically hyperchloremic with hypercalciuria, which is a more precisely
      specified picture than the "variable severity" acidosis reported in
      patients, so the match should not be over-read. Deafness is not addressed
      by this study.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        In the knockout mouse, remaining homomeric Kir4.1 channels lose pH
        sensitivity and basolateral potassium conductance actually rises. Whether
        the same compensation occurs in human patients is not established, so the
        residual-conductance state of the murine tubule may not represent the
        human one.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The characterisation is of an adult constitutive knockout under acute and
        chronic thiazide challenge, not of the developmental course or natural
        history of the human disease.
    evidence:
    - reference: PMID:21633011
      reference_title: "Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Kir5.1(-/-) mice displayed hypokalemic, hyperchloremic metabolic acidosis with hypercalciuria."
      explanation: >-
        Reports the knockout's hypokalemia and metabolic acidosis, the two
        features corresponding to the human KCNJ16 phenotype.
    - reference: PMID:21633011
      reference_title: "Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "there is an increased K(+) conductance caused by the decreased pH sensitivity of the remaining homomeric Kir4.1 channels"
      explanation: >-
        Documents the compensatory change in residual Kir4.1 channels recorded as
        a species divergence, since it is unestablished in human patients.
treatments:
- name: Potassium and Alkali Replacement
  description: >-
    Supportive electrolyte management: potassium supplementation for the urinary
    losses, with alkali as required for the acidosis. Symptomatic rather than
    mechanism-directed — there is no therapy that restores the channel — so this
    entry deliberately claims no target_mechanisms link. The mouse data hinting
    at thiazide responsiveness are a model finding, not human evidence, and are
    recorded under animal_models rather than proposed as treatment here.
  therapeutic_modality: SMALL_MOLECULE

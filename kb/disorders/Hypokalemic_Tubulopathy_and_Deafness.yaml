pathophysiology:
- name: Kir5.1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    KCNJ16 encodes Kir5.1. Unlike most channel subunits, Kir5.1 is an obligate
    partner rather than a channel in its own right, so its variants act by
    crippling the heteromers it forms. Coexpressing mutant KCNJ16 with either
    KCNJ15 or KCNJ10 in Xenopus oocytes significantly reduces currents, and
    disease-associated variants scattered across different functional domains all
    strongly affect heteromers with Kir4.1 or Kir4.2. This is why one gene
    produces a tubulopathy spanning two nephron segments that use different
    partner subunits.
  gene:
    preferred_term: KCNJ16
    term:
      id: hgnc:6262
      label: KCNJ16
  molecular_functions:
  - preferred_term: inward rectifier potassium channel activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33811157
    reference_title: "Defects in KCNJ16 Cause a Novel Tubulopathy with Hypokalemia, Salt Wasting, Disturbed Acid-Base Homeostasis, and Sensorineural Deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of mutant KCNJ16 together with KCNJ15 or KCNJ10 in Xenopus oocytes significantly reduced currents."
    explanation: >-
      Electrophysiological demonstration that the patient variants reduce current
      through both heteromeric partnerships, establishing loss of function.
  - reference: PMID:35370765
    reference_title: "EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike Kir4.1, Kir5.1 does not appear to form homomeric channels, but forms heteromeric channels primarily with Kir4.1 and Kir4.2."
    explanation: >-
      Establishes that Kir5.1 acts only as a heteromeric partner, which is why
      its loss is expressed through the channels it would otherwise complete.
  downstream:
  - target: Failure of Basolateral Potassium Recycling
    causal_link_type: DIRECT
- name: Failure of Basolateral Potassium Recycling
  biological_scale: CELLULAR
  description: >-
    Kir4.1/Kir5.1 and Kir4.2/Kir5.1 heteromers make the major basolateral
    potassium conductance of the distal and proximal tubule respectively. That
    conductance recycles potassium across the basolateral membrane so the
    Na+/K+-ATPase can keep running, and it is highly pH-sensitive, which is how
    the channel couples acid-base status to sodium handling. Losing it therefore
    disables the driving force for transepithelial transport in both segments at
    once.
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:

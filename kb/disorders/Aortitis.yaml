progression:
- phase: Acute outcomes after open thoracic aortic aneurysm repair
  notes: >-
    In a United States administrative cohort of open thoracic aortic aneurysm
    repairs, a coded diagnosis of noninfectious aortitis was independently
    associated with worse in-hospital outcomes. This is a post-intervention,
    selected-population association rather than disease incidence or causality.
  evidence:
  - reference: PMID:42175556
    reference_title: Association of Non-infectious Aortitis With Acute Outcomes of Open Thoracic Aortic Aneurysm Repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following multivariable adjustment, aortitis was independently associated
      with increased odds of in-hospital mortality (AOR: 1.45, 95% CI:
      1.14-1.84), major adverse cardiac and cerebrovascular events (AOR: 1.40,
      95% CI: 1.15-1.70), neurologic complications (AOR: 1.33, 95% CI:
      1.05-1.70), and nonhome discharge (AOR: 1.38, 95% CI: 1.19-1.60).
    explanation: >-
      Reports adjusted acute outcome associations in a national administrative
      cohort; it does not establish aortitis as the cause of each outcome.

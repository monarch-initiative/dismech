- name: Tenascin-C and IL-6 inflammatory persistence
  description: >-
    In resected giant-cell, clinically isolated, and IgG4-related aortitis
    specimens, tenascin-C accumulated in lesions and stromal cells showed
    phenotypic modulation. Primary human smooth-muscle-cell experiments support
    a TNC-TLR4/NF-kappaB-IL-6-STAT3 inflammatory loop; this mechanistic component
    is experimental and not yet a validated therapeutic biomarker.

- phase: Accelerated thoracic aortic aneurysm growth in inflammatory aortitis
  notes: >-
    A small retrospective matched study found faster preoperative aneurysm
    growth with histology-confirmed aortitis, especially clinically isolated
    aortitis; prospective validation is needed.
  evidence:
  - reference: PMID:42276733
    reference_title: Aortitis accelerates the growth rate of thoracic aortic aneurysms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean growth rate was significantly higher in the aortitis group
      (0.177±0.01 mm/month; 2.12 mm/year) compared with controls
      (0.039±0.02 mm/month; 0.47 mm/year), representing a 4.5-fold acceleration
      (p<0.001).
    explanation: Supports an association with faster growth in 23 aortitis cases and 42 matched controls.

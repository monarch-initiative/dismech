animal_models:
- species: Mouse (Mus musculus)
  background: SCID mouse bearing a human temporal-artery xenograft
  description: >-
    Human temporal arteries with giant-cell arteritis remain inflamed after
    engraftment into SCID mice, enabling in-vivo study of vascular immune
    persistence and glucocorticoid response. The model uses temporal artery,
    not aorta, and does not reproduce systemic disease or chronic aortic
    remodeling and aneurysm formation.
  associated_phenotypes:
  - Persistent human arterial inflammation
  - Cytokine expression after glucocorticoid treatment
  evidence:
  - reference: PMID:9185506
    reference_title: Glucocorticoid-mediated repression of cytokine gene transcription in human arteritis-SCID chimeras.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GCA is self-sustained in temporal arteries engrafted into SCID mice,
      providing a model in which the mechanisms of action and limitations of
      glucocorticoid therapy can be examined in vivo.
    explanation: Supports model validity for persistent human arterial inflammation while the description states its aortic limitations.
discussions:
- discussion_id: disc_aortitis_cia_immunosuppression
  prompt: Does postoperative immunosuppression improve aortic outcomes in clinically isolated aortitis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Clinically isolated aortitis
  - treatments#Specialist multidisciplinary follow-up and aortic surveillance
  rationale: >-
    Clinically isolated aortitis is often discovered only after resection and
    carries subsequent vascular risk, but surveillance is better supported than
    a uniform immunosuppressive regimen. Etiology, residual active inflammation,
    and surgical selection complicate treatment comparisons; no disease-level
    efficacy claim was added.
  evidence:
  - reference: PMID:40099651
    reference_title: Isolated aortitis - an approach to diagnosis and management.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance of patients with IA with repeated clinical assessments and imaging
      is recommended.
    explanation: Supports surveillance while leaving postoperative immunosuppression unresolved.
  posed_date: "2026-08-05T00:00:00Z"
- discussion_id: disc_aortitis_model_fidelity
  prompt: Which experimental model can reproduce chronic human aortic inflammation, remodeling, and aneurysm formation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse (Mus musculus)
  rationale: >-
    The human temporal-artery SCID chimera preserves an arterial immune lesion
    and enables perturbation studies, but its anatomy and time course do not
    model chronic aortic remodeling. Aortic-tissue and longitudinal models are
    needed before extrapolating model interventions to aortic outcomes.
  evidence:
  - reference: PMID:9185506
    reference_title: Glucocorticoid-mediated repression of cytokine gene transcription in human arteritis-SCID chimeras.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GCA is self-sustained in temporal arteries engrafted into SCID mice,
      providing a model in which the mechanisms of action and limitations of
      glucocorticoid therapy can be examined in vivo.
    explanation: Defines what the model supports and, by its temporal-artery anatomy, the principal mismatch.
  posed_date: "2026-08-05T00:00:00Z"

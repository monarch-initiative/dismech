- name: Current tobacco smoking
  influences_mechanisms:
  - target: Aortic wall structural remodeling
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The target was forced by the graph as much as chosen: every
      inflammatory node in this entry is etiology-specific, naming
      large-vessel vasculitis, infection, G-CSF or IgG4, so wall remodeling is
      the only etiology-agnostic node available to an exposure that belongs to
      none of those arms. The cited regression associates smoking with
      aortitis as a whole and names no mechanism, so nothing in the evidence
      points anywhere in particular; remodeling is where a chronic inhaled
      exposure is understood to land. Intermediates unknown for the
      same reason. This is the weakest link in the tranche and is graded to
      say so.
    evidence:
    - reference: DOI:10.3390/jcdd11120405
      reference_title: "Aortitis Increases the Risk of Surgical Complications and Re-Operations After Major Aortic Surgery"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a mean follow-up of 39.2 ± 26.7 months, 72 patients (53.7%)
      experienced clinical remission, 64 (47.8%) complete remission and only 15
      (11.2%) imaging remission.
    explanation: Quantifies remission discordance in a single referral-center cohort.
clinical_trials:
- name: NCT03725202
  phase: PHASE_III
  status: COMPLETED
  description: >-
    SELECT-GCA randomized participants with giant cell arteritis to upadacitinib
    plus a 26-week glucocorticoid taper or placebo plus a 52-week taper. It is
    relevant to an important etiology of aortitis but did not establish an
    aortitis-specific structural or imaging benefit.
  notes: No aortitis target phenotype is assigned because aortic involvement was not a trial-specific endpoint.
  evidence:
  - reference: clinicaltrials:NCT03725202
    reference_title: "A Multicenter, Randomized, Double-Blind, Placebo-Controlled Study to Evaluate the Safety and Efficacy of Upadacitinib in Subjects With Giant Cell Arteritis: SELECT-GCA"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The objective of Period 1 is to evaluate the efficacy of upadacitinib in
      combination with a 26-week corticosteroid (CS) taper regimen compared to
      placebo in combination with a 52-week CS taper regimen, as measured by the
      proportion of participants in sustained remission at Week 52
    explanation: Documents the completed phase III trial design and primary remission objective.

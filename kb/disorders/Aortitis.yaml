environmental:
- name: Granulocyte-colony stimulating factor exposure
  influences_mechanisms:
  - target: G-CSF-associated aortic inflammation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The node is named for this drug, so the exposure is the node's own
      content rather than something inferred onto it, and direct is the honest
      link type for a drug-induced inflammation with no intervening disease.
      The strongest item is the second: patients re-exposed to the drug
      developed the aortitis again, and the review concludes that neither
      repeated use nor a change of preparation rules out recurrence.
      Recurrence on re-exposure is the classic argument for drug causation and
      is what lifts this link above an association. Note for anyone
      re-checking this entry that the reference is a DOI, and the reference
      validator skips DOI-prefixed snippets, so every quote here was verified
      against the cached record by hand.
    evidence:
    - reference: DOI:10.3389/fphar.2024.1487501
      reference_title: "Literature review analysis of aortitis induced by granulocyte-colony stimulating factor"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(G-CSF)-induced aortitis is a rare but particularly serious adverse event, commonly seen in cancer patients undergoing chemotherapy"
      explanation: >-
        States drug-induced aortitis as an adverse event of this drug rather
        than assuming it, which is the claim this edge makes.
    - reference: DOI:10.3389/fphar.2024.1487501
      reference_title: "Literature review analysis of aortitis induced by granulocyte-colony stimulating factor"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This indicated that patients with a history of G-CSF-induced aortitis, whether through repeated use or changes in dosage form, cannot rule out the possibility of recurrent G-CSF-induced aortitis"
      explanation: >-
        The review's conclusion from its re-administration cases: the aortitis
        returns when the drug does, and switching preparation does not prevent
        it. Recurrence on re-exposure is the strongest causal design available
        for a drug, and it is what this link rests on. Two limits belong with
        it rather than after it: the authors qualify this very sentence by
        noting that reporting bias means the possibility still needs further
        validation, and the underlying numbers are small, three
        re-administrations of the same preparation plus two switches.
    - reference: DOI:10.3389/fphar.2024.1487501
      reference_title: "Literature review analysis of aortitis induced by granulocyte-colony stimulating factor"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The G-CSF type with the highest frequency of occurrence of aortitis is pegfilgrastim."
      explanation: >-
        Names pegfilgrastim as the G-CSF most frequently associated with
        aortitis. It settles which agent within an association it takes as
        given, so it supports the edge by assuming it rather than by showing
        it, and it stays partial for that reason now that the two items above
        carry the claim directly.
  presence: Positive

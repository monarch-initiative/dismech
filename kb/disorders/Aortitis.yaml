    description: >-
      Persistent vascular inflammation contributes to later remodeling and
      structural complications such as aneurysm, dissection, or ischemia.
    evidence:
    - reference: PMID:41948935
      reference_title: Spatially controlled tenascin-C accumulation contributes to inflammatory disease persistence in giant cell aortitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Single-cell spatial profiling revealed aortic wall remodeling in the GCA
        aortas, highlighting substantial phenotypic modulation in stromal cells,
        including vascular smooth muscle cells (SMCs) and fibroblasts.
      explanation: Human aortic-tissue profiling directly links giant-cell aortitis with stromal remodeling.
  - target: Tenascin-C and IL-6 inflammatory persistence
    description: Immune-mediated giant-cell aortitis is associated with lesion-localized tenascin-C accumulation and stromal inflammatory modulation.

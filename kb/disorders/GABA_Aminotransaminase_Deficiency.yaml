    causal_link_type: DIRECT
    description: Less folded enzyme leaves less transaminase activity.
    evidence:
    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "variants with strong structural and catalytic defects (p.P152S, p.L211F, and p.L478P)"
      explanation: Expression of patient variants in HEK-293 cells identified a group in which a structural defect accompanies loss of GABA transaminase activity.
  evidence:
  - reference: PMID:40414180
    reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, the data obtained on protein expression level, GABA transaminase activity, and the predicted structural impact allowed us to classify the variants into three distinct groups"
    explanation: Protein level and activity measured for ten patient variants separate structural from catalytic defects.
  notes: >-
    Distances and solvent accessibilities are measured on PDB 1OHV chains A
    and B after aligning UniProt P80404 to pig P80147; the AlphaFold model
    AF-P80404-F1 is confident (pLDDT above 98) at every variant residue. The
    same placements are reproduced independently, with code, in the ABAT
    review of the ai4curation/ai-gene-review repository
    (genes/human/ABAT/ABAT-bioinformatics).
- name: Impaired ABAT Catalysis and Dimer Assembly
  description: >-
    A second class of missense variants leaves protein that folds but cannot
    turn over substrate. The catalytic defect is experimental; the residue
    contacts described here are read from the pig crystal structure and are
    predictions for the human variants. ABAT is an obligate homodimer whose two active sites
    are built from both subunits: the cofactor forms a Schiff base with Lys357
    of one subunit and its phosphate is held by Asn380 and Thr381 of the
    other. Arg220 (pig Arg192) is the substrate-carboxylate arginine, 5.7
    angstroms from the cofactor and bound to an acetate ion in the native
    crystal; the conservative p.Arg220Lys change keeps the charge but shortens
    the side chain. Gln296 and Gly331 are buried residues 7 to 8 angstroms
    from the cofactor in the PLP-binding domain. Arg377 of one subunit forms a
    salt bridge with Asp237 of the partner (2.9 angstroms) next to the
    Asn380-Thr381 phosphate-binding segment, so p.Arg377Trp and p.Asp237Asn
    disrupt the same inter-subunit contact from opposite sides.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Missense variants at the substrate site, the cofactor shell, or the
      subunit interface that completes the partner active site.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2017 series collected 10 patients; later reports add single families.
    gnomAD v4 (queried 2026-11-28) lists 81 high-confidence predicted
    loss-of-function variants on the canonical ABAT transcript, with a
    combined allele count of 136 in about 1.6 million alleles and no
    homozygotes, which is consistent with a very low expected birth
    prevalence.
  evidence:
  - reference: PMID:30644311
    reference_title: "GABA Transaminase Deficiency With Survival Into Adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "GABA-transaminase deficiency is an extremely rare autosomal recessive disorder of GABA metabolism first reported in 1984."
    explanation: States the rarity of the disorder.
  - reference: PMID:28411234
    reference_title: "Phenotype of GABA-transaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case series of 10 patients with γ-aminobutyric acid (GABA)-transaminase deficiency including a novel therapeutic trial and an expanded phenotype."
    explanation: The largest series, assembled from new cases and the literature, contained ten patients.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic ABAT variants; obligate carriers have
    intermediate enzyme activity and are clinically unaffected.
  evidence:
  - reference: PMID:3939544
    reference_title: "Demonstration of 4-aminobutyric acid aminotransferase deficiency in lymphocytes and lymphoblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data indicate that the parents and healthy sibling are heterozygous and the patient is homozygous for a defective gene responsible for 4-aminobutyric acid aminotransferase deficiency, and that inheritance is autosomal recessive."
    explanation: Enzyme activities in the index family established recessive inheritance with intermediate activity in carriers.
progression:
- phase: Neonatal or early infantile onset
  age_range: Birth to 6 months
  description: >-
    Encephalopathy with hypotonia, hypersomnolence and, in most patients,
    seizures begins in the neonatal period or the first months of life.
    Prenatal signs (polyhydramnios, abnormal fetal movements) have been
    reported in the most severe families.
  evidence:
  - reference: PMID:28411234
    reference_title: "Phenotype of GABA-transaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with neonatal or early infantile-onset encephalopathy; other features were hypotonia, hypersomnolence, epilepsy, choreoathetosis, and accelerated linear growth."
    explanation: Onset was neonatal or early infantile in every patient of the series.
- phase: Childhood course in survivors
  age_range: 1 to 10 years
  description: >-
    About half of reported patients died in infancy. Survivors pass through a
    phase of hyperkinetic movements and episodic encephalopathy in early
    childhood and then a more stable phase with brain atrophy, while brain GABA
    measured by spectroscopy falls with age.
  evidence:
  - reference: PMID:28411234
    reference_title: "Phenotype of GABA-transaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five of the 10 patients are currently alive with age at last follow-up between 18 months and 9.5 years."
    explanation: Half of the series survived beyond infancy.
  - reference: PMID:29478219
    reference_title: "Serial Magnetic Resonance Imaging and (1)H-Magnetic Resonance Spectroscopy in GABA Transaminase Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In early childhood, the patient presented with refractory involuntary and hyperkinetic movements and dystonic hypertonicity."
    explanation: A ten-year follow-up describes the age-dependent phases of the disorder in a long-term survivor.
pathophysiology:
- name: ABAT Fold Destabilization
  description: >-
    One class of disease missense variants removes the enzyme by destabilizing
    its fold. The residue placements that follow are predictions from the
    structure and have not been tested experimentally; the protein-level and
    activity results are from the cited expression study. On the pig GABA
    aminotransferase crystal structure (PDB 1OHV,
    94.8% identical to human ABAT; crystal numbering is human precursor
    numbering minus 28) the residues Pro152, Leu211, Phe213, Gly465, Leu478
    and Phe480 are all buried in the hydrophobic core (relative side-chain
    solvent accessibility 0.04 or less) and lie 10 to 18 angstroms from the
    cofactor, so substitutions there are expected to act through packing
    defects and not through chemistry. Pro152, Leu211 and Phe213 sit in the
    large PLP-binding domain and Gly465, Leu478 and Phe480 in the C-terminal
    small domain. Expression in HEK-293 cells confirms that p.Pro152Ser,
    p.Leu211Phe and p.Leu478Pro combine reduced protein level with loss of
    activity.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) missense variants at
      buried core residues.

- name: Impaired Mitochondrial dNTP Supply
  description: >-
    One research group proposes that ABAT has a second role in the
    mitochondrial nucleoside salvage pathway, supporting conversion of
    deoxynucleoside diphosphates to triphosphates together with
    succinyl-CoA synthetase and the nucleoside diphosphate kinase NME4. The
    evidence is from knock-down, vigabatrin treatment and patient fibroblasts;
    no enzymatic mechanism by which an aminotransferase would act in
    nucleotide phosphorylation has been shown.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: deoxyribonucleoside triphosphate biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0009202
      label: deoxyribonucleoside triphosphate biosynthetic process
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  downstream:
  - target: Mitochondrial DNA Depletion
    causal_link_type: DIRECT
    description: Insufficient dNTP supply limits mitochondrial DNA replication.
    hypothesis_groups:
    - abat_mitochondrial_nucleoside_salvage
    evidence:
    - reference: PMID:25738457
      reference_title: "The GABA transaminase, ABAT, is essential for mitochondrial nucleoside metabolism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pharmacological inhibition of ABAT through the irreversible inhibitor Vigabatrin caused depletion of mtDNA in photoreceptor cells that was prevented through addition of dNTPs in cell culture media."
      explanation: Depletion caused by ABAT inhibition was prevented by supplying dNTPs, placing the dNTP deficit upstream of the loss of mitochondrial DNA.
  evidence:
  - reference: PMID:25738457

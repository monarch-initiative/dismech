    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nucleoside rescue and co-IP experiments pinpoint that ABAT functions in the mitochondrial nucleoside salvage pathway to facilitate conversion of dNDPs to dNTPs."
    explanation: The proposal rests on nucleoside rescue and co-immunoprecipitation in cultured cells.
- name: Mitochondrial DNA Depletion
  description: >-
    Reduced mitochondrial DNA copy number with lower membrane potential,
    respiratory capacity and ATP production was found in fibroblasts from
    patients with both mild and severe disease. Whether this contributes to
    the encephalopathy, beyond the effect of GABA excess, is not known.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
  downstream:
  - target: Neonatal or Infantile Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed contribution of an energy deficit to the encephalopathy.
    hypothesis_groups:
    - abat_mitochondrial_nucleoside_salvage
  evidence:
  - reference: PMID:25738457
    reference_title: "The GABA transaminase, ABAT, is essential for mitochondrial nucleoside metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We describe a family with encephalomyopathic MDS caused by a homozygous missense mutation in ABAT that results in elevated GABA in subjects' brains as well as decreased mtDNA levels in subjects' fibroblasts."
    explanation: Patient fibroblasts homozygous for p.Leu211Phe had reduced mitochondrial DNA.

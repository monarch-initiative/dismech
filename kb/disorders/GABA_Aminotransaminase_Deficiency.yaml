      partner active site is malformed. p.Asp237Asn (c.709G>A, ClinVar
      VCV000191066, Likely pathogenic) removes the other side of the same
      salt bridge.
    clinical_significance: LIKELY_PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Catalytic defect through the subunit interface.
    evidence:
    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "variants characterized mainly by a strong catalytic defect (p.R220K, p.Q296H, and p.R377W)"
      explanation: Functional classification of the variant.
  - name: p.Phe213Cys
    description: >-
      c.638T>G; ClinVar VCV000635255, Pathogenic. In trans with the splice

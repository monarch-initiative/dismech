name: GABA Aminotransaminase Deficiency
creation_date: "2026-11-26T19:30:00Z"
category: Mendelian
synonyms:
- GABA transaminase deficiency
- GABA-transaminase deficiency
- GABA-T deficiency
- GABA aminotransferase deficiency
- 4-aminobutyrate aminotransferase deficiency
- gamma-aminobutyric acid transaminase deficiency
- ABAT deficiency
description: >-
  Ultra-rare autosomal recessive disorder of GABA catabolism caused by
  biallelic loss-of-function variants in ABAT, which encodes the mitochondrial
  pyridoxal 5'-phosphate-dependent enzyme 4-aminobutyrate aminotransferase
  (GABA transaminase). Loss of the enzyme blocks the first step of GABA
  degradation, so free GABA, its dipeptide homocarnosine and the alternative
  substrate beta-alanine accumulate in cerebrospinal fluid and brain. The
  clinical picture is a neonatal or early-infantile encephalopathy with
  hypotonia, hypersomnolence, seizures, choreoathetosis, severe developmental
  impairment, delayed myelination and accelerated linear growth with raised
  growth hormone.
disease_term:
  preferred_term: GABA aminotransaminase deficiency
  term:
    id: MONDO:0013166
    label: GABA aminotransaminase deficiency
parents:

    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Gamma-amino butyrate aminotransferase (GABA-AT or ABAT) is a pyridoxal 5'-phosphate (PLP)-dependent enzyme that catalyzes the conversion of GABA and α-ketoglutarate into succinic semialdehyde and L-glutamate."
    explanation: States the normal reaction catalyzed by the enzyme.
  - reference: PMID:3939544
    reference_title: "Demonstration of 4-aminobutyric acid aminotransferase deficiency in lymphocytes and lymphoblasts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activities in lysates of both types of cell derived from a Flemish patient were less than 3% of control."
    explanation: Patient lymphocytes and lymphoblasts have almost no GABA transaminase activity.
  - reference: PMID:27903293

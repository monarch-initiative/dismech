      snippet: "indicate that GABA and beta-alanine transaminases are identical."
      explanation: Patient lymphoblasts lost activity toward both GABA and beta-alanine in this study, from which the authors conclude that one enzyme handles both.
  - target: Impaired Mitochondrial dNTP Supply
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

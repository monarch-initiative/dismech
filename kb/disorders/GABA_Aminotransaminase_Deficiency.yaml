    explanation: The therapeutic rationale for an antagonist of the GABA-A receptor benzodiazepine site points to receptor over-activation; the node is inferred from this and from treatment response, not measured directly.
- name: Paradoxical Network Hyperexcitability
  description: >-
    Seizures and an epileptic encephalopathy develop despite an excess of the
    main inhibitory transmitter. Proposed explanations are a depolarizing,
    excitatory action of GABA in immature neurons with high intracellular
    chloride, preferential silencing of inhibitory interneurons, and
    use-dependent down-regulation of GABA receptors. None has been tested in
    patients or in a genetic model of this disease.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: Network hyperexcitability manifests as seizures.
    hypothesis_groups:
    - developmental_depolarizing_gaba
  - target: EEG Burst Suppression
    causal_link_type: DIRECT
    description: The severe neonatal form shows a burst-suppression pattern.
    hypothesis_groups:
    - developmental_depolarizing_gaba
  evidence:
  - reference: PMID:30644311
    reference_title: "GABA Transaminase Deficiency With Survival Into Adulthood."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Putative hypotheses have been excessive inhibition of inhibitory interneurons, paradoxical depolarizing effects of GABA as in immature neurons with reversed chloride gradients, and downregulation of GABA receptors due to chronic overuse as demonstrated in deficiency in succinic semialdehyde dehydrogenase (SSADH), the other inherited disorder of GABA metabolism."
    explanation: Lists the candidate explanations for epilepsy in a state of GABA excess and makes clear they are hypotheses.

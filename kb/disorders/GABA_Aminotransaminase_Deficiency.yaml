      reference_title: "Identification of Additional Cases of Severe Neonatal GABA-Transaminase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both of her affected siblings were also found to be homozygous for the same variant, and carrier status was confirmed in both parents."
      explanation: Segregation of the nonsense variant in the family.
  - name: c.316G>A (p.Gly106Ser)
    description: >-
      Reported as a homozygous missense variant in a neonate with epileptic
      encephalopathy. c.316 is the last nucleotide of the exon spanning
      c.199-316 on NM_020686.6, so the primary effect is expected to be on
      the splice donor, as the report itself notes; it should be counted with
      the null alleles and not as a missense variant.
    functional_effects:
    - function: mRNA splicing
      type: loss-of-function
      description: Predicted disruption of the splice donor.
    evidence:
    - reference: PMID:33768830
      reference_title: "GABA transaminase deficiency. Case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The homozygous G to A nucleotide alters the wildtype splice donor at the end of exon 5."
      explanation: The report attributes the effect to the splice donor.
  - name: c.1439T>G (p.Phe480Cys)
    description: >-
      Homozygous in a consanguineous Pakistani family with a neurodevelopmental
      disorder; no biochemical confirmation was reported. Phe480 is fully
      buried in the C-terminal small domain, so a fold-destabilizing effect is
      plausible, but the variant has no functional data.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:39281811
      reference_title: "The genetic cause of neurodevelopmental disorders in 30 consanguineous families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Six families presented newly described variants in known NDD-related genes: ABAT (c.1439 T > G; p.Phe480Cys) [OMIM613163]"
      explanation: Reports the variant in one family.
  notes: >-
    ClinVar accessions and classifications in the variant descriptions were
    retrieved on 2026-11-28, and AlphaMissense scores are from the AlphaFold
    database file for P80404. ClinGen has curated ABAT only for the broader disease class developmental
    and epileptic encephalopathy (MONDO:0100062; Moderate, autosomal
    recessive, Epilepsy Gene Curation Expert Panel, 2022). That record is for
    a different MONDO disease, so no gene_disease_validity tier is copied
    here. A homozygous variant reported as c.1490G>A p.Arg497His in two
    siblings surviving to adulthood (PMID:30644311; chr16:8875215 G>A on
    GRCh37) is not a missense change on the canonical transcript: residue 497
    of UniProt P80404 is alanine, and on NM_020686.6 the same genomic change
    is the synonymous c.1431G>A p.Thr477= (ClinVar VCV000887492, conflicting
    classifications; coordinates checked against the Ensembl exon structure
    of ENST00000268251 and gnomAD v4 on 2026-11-28). It is missense only on a 515-residue alternative
    transcript (ENST00000569156), has a gnomAD v4 allele count of 158 without
    homozygotes, and that family had no cerebrospinal fluid GABA,
    spectroscopy or enzyme confirmation. The report is therefore not used
    here as evidence for survival into adulthood. The common polymorphism
    p.Gln56Arg (allele frequency 0.60; arginine in pig) is benign.
animal_models:
- name: Drosophila gabat loss-of-function mutant
  species: Drosophila melanogaster
  genotype: gabat (CG7433) loss of function
  description: >-
    Flies lacking the mitochondrial GABA transaminase have raised brain GABA,
    sleep more, and fail to survive on carbohydrate-only food.
  publication: PMID:24637426
  modeled_mechanisms:
  - target: Excess GABA Receptor Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Loss of the fly enzyme increases sleep, the counterpart of hypersomnolence.
    limitations: >-
      An invertebrate model: seizures, myelin change and growth acceleration
      cannot be assessed, and the metabolic lethality on carbohydrate food has
      no reported human counterpart.
    evidence:
    - reference: PMID:26124278
      reference_title: "Independent Effects of γ-Aminobutyric Acid Transaminase (GABAT) on Metabolic and Sleep Homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Drosophila, the loss of the specific enzyme that degrades GABA, GABA transaminase (GABAT), increases sleep, and we show here that it also affects metabolism such that flies lacking GABAT fail to survive on carbohydrate media."
      explanation: Summarizes the sleep and metabolic phenotypes of the fly mutant.
- name: Vigabatrin-treated dog
  species: Dog
  genotype: Wild type, chronic vigabatrin 300 mg/kg/day
  description: >-
    Pharmacological phenocopy: chronic irreversible inhibition of GABA
    transaminase produces reversible intramyelinic edema.
  publication: PMID:7936252
  modeled_mechanisms:
  - target: White Matter Myelin Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Enzyme inhibition produces a myelin lesion visible on MRI and histology.
    limitations: >-
      A drug model in adult animals with a mature brain; the lesion is
      reversible vacuolation in specific tracts, not the delayed myelination
      of a developing brain, and vigabatrin may have effects beyond enzyme
      inhibition.
    evidence:
    - reference: PMID:7936252
      reference_title: "MRI monitoring of vigabatrin-induced intramyelinic edema in dogs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Chronic administration of vigabatrin (gamma-vinyl GABA) in dogs produces reversible microvacuolation (intramyelinic edema) in discrete brain regions."
      explanation: Describes the myelin lesion produced by enzyme inhibition.
experimental_models:
- name: HEK-293 expression of patient ABAT variants
  description: >-
    Transient expression of ten patient missense variants in HEK-293 cells
    with measurement of protein level and GABA transaminase activity.
  experimental_model_type: CELL_LINE
  publication: PMID:40414180
  modeled_mechanisms:
  - target: Loss of GABA Transaminase Activity
    relationship: MEASURES
    fidelity: MODERATE
    description: Separates variants with structural, catalytic and moderate defects.
    limitations: >-
      Over-expression in a non-neural cell line; protein level after transient
      transfection may not reflect turnover of the endogenous enzyme in
      neurons or astrocytes.
    evidence:
    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In this work a biochemical characterization of 10 pathogenic variants of human GABA-AT was carried out by expressing the protein in HEK-293 cells."
      explanation: Describes the model and what it measures.
- name: Patient fibroblasts and ABAT-depleted cells
  description: >-
    Patient skin fibroblasts and cell lines with ABAT knock-down or vigabatrin
    treatment, assayed for GABA transaminase activity, mitochondrial DNA copy
    number and respiratory function.
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:27903293
  modeled_mechanisms:
  - target: Mitochondrial DNA Depletion
    relationship: MEASURES
    fidelity: LOW
    description: Source of the mitochondrial DNA depletion finding.
    limitations: >-
      Fibroblasts are not an affected tissue, and the mitochondrial compromise
      was the same in mild and severe patients, so the readout does not track
      clinical severity.
    evidence:
    - reference: PMID:27903293
      reference_title: "Personalized medicine approach confirms a milder case of ABAT deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Additionally, functional studies conducted in cells from both mild and severe patient fibroblasts showed similar levels of compromise in mitochondrial membrane potential, respiratory capacity, ATP production and mtDNA depletion."
      explanation: Mitochondrial readouts in patient fibroblasts.
discussions:
- discussion_id: gabatd_seizures_despite_gaba_excess
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does lifelong excess of the main inhibitory neurotransmitter produce
    an epileptic encephalopathy, and does the answer change with age?
  attaches_to:
  - pathophysiology#Paradoxical Network Hyperexcitability
  - phenotypes#Seizures
  rationale: >-
    The canonical model explains hypersomnolence and hypotonia but predicts
    fewer seizures, not more. Depolarizing GABA in immature neurons,
    interneuron silencing and receptor down-regulation have been proposed and
    none has been tested, because there is no vertebrate genetic model of
    this disease. The answer bears on treatment: a receptor antagonist is
    rational only if the receptor remains inhibitory.
  evidence:
  - reference: PMID:30644311
    reference_title: "GABA Transaminase Deficiency With Survival Into Adulthood."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The epileptogenic effects of persistently elevated endogenous GABA remain unexplained."
    explanation: States the gap.
- discussion_id: gabatd_nucleoside_salvage_role
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Does ABAT have a second, GABA-independent function in mitochondrial
    nucleoside salvage, and does mitochondrial DNA depletion contribute to
    the disease in affected tissues?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial dNTP Supply
  - pathophysiology#Mitochondrial DNA Depletion
  - mechanistic_hypotheses#abat_mitochondrial_nucleoside_salvage
  rationale: >-
    The claim comes from one group and from cultured cells. An
    aminotransferase has no evident chemistry for phosphorylating
    deoxynucleoside diphosphates, so the proposed role would have to be
    structural, through association with succinyl-CoA synthetase and NME4.
    Loss of the fly enzyme does disturb tricarboxylic acid cycle intermediates
    and ATP, which offers a GABA-shunt explanation for an energy deficit that
    does not require a nucleotide function. Mitochondrial DNA content in
    patient muscle or brain, and replication in an independent laboratory,
    would settle it.
  evidence:
  - reference: PMID:26124278
    reference_title: "Independent Effects of γ-Aminobutyric Acid Transaminase (GABAT) on Metabolic and Sleep Homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, we also observed that gaba mutants display a general disruption in bioenergetics as measured by altered levels of tricarboxylic acid cycle intermediates, NAD(+)/NADH, and ATP levels."
    explanation: An energy deficit follows loss of the fly enzyme through the GABA shunt itself, an alternative to a nucleotide-salvage role.
- discussion_id: gabatd_severity_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines the range from neonatal death to a milder course without
    seizures, given that residual activity in cell assays does not separate
    mild from severe genotypes?
  attaches_to:
  - pathophysiology#Loss of GABA Transaminase Activity
  - genetic#ABAT pathogenic variants
  rationale: >-
    Variants that retain substantial activity when over-expressed (p.Arg92Gln,
    p.Phe213Cys, p.Gly465Arg) are found in both mild and typical patients, and
    one cell-based assay reported the mild genotype to be as impaired as the
    severe ones. Homozygous null genotypes do give the most severe neonatal
    form. Residual activity in brain, the second allele, and the timing of
    brain GABA exposure are candidate modifiers; none has been measured.
  evidence:
  - reference: PMID:27903293
    reference_title: "Personalized medicine approach confirms a milder case of ABAT deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This work confirmed the novel variants compromised ABAT function to similar levels as variants in previously characterized cases with more severe clinical presentation, thereby confirming the molecular diagnosis of this patient."
    explanation: Cell-based activity did not distinguish the mild genotype from severe ones.
notes: >-
  No GeneReviews chapter covers this disorder or ABAT (PubMed searches
  "GABA transaminase deficiency" and ABAT[TIAB] restricted to
  genereviews[book] returned no records on 2026-11-28). The phenotype baseline
  is the ten-patient series PMID:28411234 together with the individual case
  reports cited above.

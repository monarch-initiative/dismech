    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: partial loss-of-function
      description: Moderate defect with residual activity.
    evidence:
    - reference: PMID:31133775
      reference_title: "2-Pyrrolidinone and Succinimide as Clinical Screening Biomarkers for GABA-Transaminase Deficiency: Anti-seizure Medications Impact Accurate Diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "c.168+1G>A, likely pathogenic variant c.638T>G (p.Phe213Cys), heterozygous VUS, in trans"

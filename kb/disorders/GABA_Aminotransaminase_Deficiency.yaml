      reference_title: "A neuron-glia interaction involving GABA transaminase contributes to sleep loss in sleepless mutants."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of GABAT increases daily sleep and improves sleep consolidation, indicating that GABAT promotes wakefulness."
      explanation: Genetic loss of GABA transaminase in Drosophila increases sleep, the fly counterpart of hypersomnolence; the receptor step is not tested in this experiment.
    - reference: PMID:28411234
      reference_title: "Phenotype of GABA-transaminase deficiency."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient, with a milder phenotype, began treatment at age 21 months and has continued for 20 months with improved alertness and less excessive adventitious movements."
      explanation: Improvement of alertness on an antagonist of the GABA-A receptor benzodiazepine site supports receptor over-activation as the cause, by therapeutic response in a single patient.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Central hypotonia is attributed to excess inhibitory tone; the link is inferred.
  - target: Neonatal or Infantile Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Depressed consciousness and episodic lethargy track brain GABA levels.
    evidence:
    - reference: PMID:29478219
      reference_title: "Serial Magnetic Resonance Imaging and (1)H-Magnetic Resonance Spectroscopy in GABA Transaminase Deficiency: A Case Report."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that the encephalopathic episodes in infancy and clinical severity of involuntary and hyperkinetic movements may be correlated with levels of GABA in the basal ganglia."
      explanation: Within one patient followed for ten years, encephalopathic episodes coincided with the period of highest basal ganglia GABA; a correlation in a single case.
  - target: Choreoathetosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hyperkinetic movements coincide with high GABA in the basal ganglia.

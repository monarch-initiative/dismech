  - reference: PMID:14534310
    reference_title: "Structures of gamma-aminobutyric acid (GABA) aminotransferase, a pyridoxal 5'-phosphate, and [2Fe-2S] cluster-containing enzyme, complexed with gamma-ethynyl-GABA and with the antiepilepsy drug vigabatrin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both inactivators form a covalent ternary adduct with the active site Lys-329 and the pyridoxal 5'-phosphate (PLP) cofactor."
    explanation: The crystal structures identify the catalytic lysine and the cofactor site against which the variants are placed.
  - reference: PMID:14534310
    reference_title: "Structures of gamma-aminobutyric acid (GABA) aminotransferase, a pyridoxal 5'-phosphate, and [2Fe-2S] cluster-containing enzyme, complexed with gamma-ethynyl-GABA and with the antiepilepsy drug vigabatrin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cluster of yet unknown function at the center of the dimeric molecule in the vicinity of the PLP cofactors."
    explanation: The enzyme is a dimer whose subunits are bridged by an iron-sulfur cluster close to both active sites.
  notes: >-
    The dimer is described here from the crystal structure, in which the
    [2Fe-2S] cluster is held by Cys163 and Cys166 of both subunits. The
    interchain disulfide at Cys321 annotated in UniProt P80404 (from
    mutagenesis, PMID:15528998) is not used: in PDB 1OHV the equivalent
    cysteine is buried and its sulfur is 37.6 angstroms from that of the
    partner subunit.
- name: Loss of GABA Transaminase Activity
  description: >-
    ABAT normally transfers the amino group of GABA to 2-oxoglutarate in the
    mitochondrial matrix, producing succinic semialdehyde and glutamate; this
    is the first and committing step of GABA degradation. Null alleles
    (nonsense, frameshift, canonical splice-site and exon-deletion variants)
    and the two missense classes above converge on loss of this activity.
    Residual activity in patient cells is a few percent of control, and
    carriers with roughly a quarter of control activity are healthy, so the
    disease is recessive loss of function with no evidence for a
    dominant-negative or gain-of-function effect.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic ABAT variants of any class.

    gnomAD v4 constraint for ABAT (queried 2026-11-28; pLI near 0, loss-of-function
    observed/expected upper bound 0.89) shows that heterozygous loss of
    function is tolerated, as expected for a recessive enzyme deficiency.
- name: GABA Accumulation
  description: >-
    Free GABA rises many-fold in cerebrospinal fluid and is raised in plasma
    and urine. Proton spectroscopy shows millimolar GABA in the basal ganglia
    in infancy, which falls with age in survivors while the cerebrospinal
    fluid level stays high.

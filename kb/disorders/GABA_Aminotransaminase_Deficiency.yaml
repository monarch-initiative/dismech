    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "variants exhibiting moderate structural and catalytic defects maintaining substantial transaminase activity (p.R92Q, p.F213C, p.G465D, and p.G465R)"
      explanation: Functional classification of the variant.

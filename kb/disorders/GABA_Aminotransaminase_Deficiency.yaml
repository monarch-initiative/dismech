differential_diagnoses:
- name: Succinic semialdehyde dehydrogenase deficiency
  description: >-
    The other inherited disorder of GABA degradation, one step downstream.
    GABA is raised in both, but succinic semialdehyde dehydrogenase deficiency
    also has 4-hydroxybutyric aciduria and usually a milder, non-progressive
    course without accelerated growth.
  disease_term:
    preferred_term: succinic semialdehyde dehydrogenase deficiency
    term:
      id: MONDO:0010083
      label: succinic semialdehyde dehydrogenase deficiency
  distinguishing_features:
  - 4-Hydroxybutyric acid is absent from urine organic acids in GABA aminotransaminase deficiency.
  - Beta-alanine is raised in GABA aminotransaminase deficiency because it shares the deficient enzyme.
  evidence:
  - reference: PMID:25485164
    reference_title: "Disorders of GABA metabolism: SSADH and GABA-transaminase deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "GABA-T deficiency is associated with severe neonatal/early infantile epileptic encephalopathy and growth acceleration."
    explanation: The review contrasts the severe early encephalopathy and growth acceleration of this disorder with succinic semialdehyde dehydrogenase deficiency.
- name: Vigabatrin exposure
  description: >-
    Vigabatrin irreversibly inhibits the same enzyme and reproduces the
    biochemical signature (raised GABA and 2-pyrrolidinone), so samples taken
    on vigabatrin cannot establish the diagnosis.
  evidence:
  - reference: PMID:31133775
    reference_title: "2-Pyrrolidinone and Succinimide as Clinical Screening Biomarkers for GABA-Transaminase Deficiency: Anti-seizure Medications Impact Accurate Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analysis of metabolomic data across our patient population revealed the association of elevated levels of 2-pyrrolidinone with administration of vigabatrin, a commonly used anti-seizure medication and a known inhibitor of GABA-transaminase."
    explanation: Vigabatrin produces the same metabolomic marker.
treatments:
- name: Flumazenil
  description: >-
    Continuous treatment with the GABA-A receptor benzodiazepine-site
    antagonist flumazenil has been tried in a few patients to counter excess
    GABAergic tone. One mildly affected patient had better alertness and fewer
    involuntary movements; a severely affected older child did not continue,
    and a neonate showed only subtle EEG change. There is no established
    disease-modifying treatment; seizures are managed symptomatically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: flumazenil
      term:
        id: CHEBI:5103
        label: flumazenil
  target_mechanisms:
  - target: Excess GABA Receptor Activation
    treatment_effect: INHIBITS
    description: Flumazenil antagonizes the benzodiazepine site of the GABA-A receptor.
    evidence:
    - reference: PMID:28411234
      reference_title: "Phenotype of GABA-transaminase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The GABA-A benzodiazepine receptor antagonist flumazenil may represent a therapeutic strategy."
      explanation: States the receptor-level rationale for the treatment.
  target_phenotypes:
  - preferred_term: Hypersomnolence
    term:
      id: HP:0001262
      label: Excessive daytime somnolence
  evidence:
  - reference: PMID:28411234
    reference_title: "Phenotype of GABA-transaminase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient, with a milder phenotype, began treatment at age 21 months and has continued for 20 months with improved alertness and less excessive adventitious movements."
    explanation: Clinical benefit in one of two treated patients.
  - reference: PMID:41573381
    reference_title: "Identification of Additional Cases of Severe Neonatal GABA-Transaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A trial of flumazenil infusion showed subtle EEG improvement."
    explanation: A limited electrographic response in a severely affected neonate.
  notes: >-
    Vigabatrin acts by irreversibly inhibiting the enzyme that is deficient in
    this disorder (see the vigabatrin entry under differential diagnoses), so
    it has no rational basis as an antiseizure treatment here.
genetic:
- name: ABAT pathogenic variants
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ABAT
    term:
      id: hgnc:23
      label: ABAT
  inheritance:
  - name: Autosomal recessive
  evidence:
  - reference: PMID:10407778
    reference_title: "4-Aminobutyrate aminotransferase (GABA-transaminase) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation resulted in substitution of an invariant arginine at amino acid 220 by lysine."
    explanation: First disease-causing ABAT variant identified, in the index proband.
  - reference: PMID:41573381
    reference_title: "Identification of Additional Cases of Severe Neonatal GABA-Transaminase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by biallelic pathogenic variants in the ABAT gene."
    explanation: States the biallelic genetic cause.
  variants:
  - name: p.Arg220Lys
    description: >-
      c.659G>A; ClinVar VCV000016216, Pathogenic. Found in trans with
      p.Leu478Pro in the Flemish index proband. Arg220 (pig Arg192) is the
      substrate-carboxylate arginine in the active site, 5.7 angstroms from
      the cofactor, invariant from Escherichia coli GabT to human; lysine keeps
      the charge but cannot reach the substrate carboxylate. Recombinant enzyme
      retains about a quarter of wild-type Vmax; in HEK-293 cells the defect is
      mainly catalytic.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Catalytic defect with near-normal protein level.
    evidence:
    - reference: PMID:10407778
      reference_title: "4-Aminobutyrate aminotransferase (GABA-transaminase) deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of the mutant in E. coli, followed by isolation and enzymatic characterization of the recombinant protein, revealed an enzyme whose Vmax was reduced to 25% of wild-type activity."
      explanation: Direct enzymology of the recombinant variant.
  - name: p.Leu478Pro
    description: >-
      c.1433T>C; ClinVar VCV000162035, Pathogenic. Listed as the allele in
      trans with p.Arg220Lys in the index family in the genotype tables of
      later reports (PMID:20052547, PMID:27903293); the original report had
      left the second allele unidentified. Leu478 is fully buried (relative accessibility 0.02) in the
      C-terminal small domain, 15 angstroms from the cofactor; proline at a
      buried position ahead of the C-terminal helix is expected to break local
      backbone geometry. Experimentally a combined structural and catalytic
      defect.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Reduced protein level and activity.
    evidence:
    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "variants with strong structural and catalytic defects (p.P152S, p.L211F, and p.L478P)"
      explanation: Functional classification of the variant.
  - name: p.Leu211Phe
    description: >-
      c.631C>T; ClinVar VCV000162034, Pathogenic/Likely pathogenic.
      Homozygous in the family in which mitochondrial DNA depletion was
      described. Leu211 is completely buried in the core of the PLP-binding
      domain, 12.5 angstroms from the cofactor; the larger phenylalanine
      cannot be accommodated without repacking. Experimentally a combined
      structural and catalytic defect.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Reduced protein level and activity.
    evidence:
    - reference: PMID:25738457
      reference_title: "The GABA transaminase, ABAT, is essential for mitochondrial nucleoside metabolism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant (ABAT NM_000663.3 c.631C>T; NP_000654.2 p.Leu211Phe) was not observed in the ExAC cohort comprised of 61,486 individuals which includes 5,804 individuals who are attributed as ‘American’ ethnicity."
      explanation: Reports the homozygous variant and its absence from population data.
  - name: p.Pro152Ser
    description: >-
      c.454C>T; ClinVar VCV000635253, Pathogenic. In trans with p.Gly465Arg in
      the mildest reported patient. Pro152 is buried (relative accessibility
      0.04) in the PLP-binding domain, 15 angstroms from the cofactor and
      conserved from yeast to human. Experimentally a combined structural and
      catalytic defect.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Reduced protein level and activity.
    evidence:
    - reference: PMID:27903293
      reference_title: "Personalized medicine approach confirms a milder case of ABAT deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The subject appeared compound heterozygous for two missense variants: ABAT NM_000663.4 c.454C > T;p.Pro152Ser and c.1393G > C; p.Gly465Arg."
      explanation: Genotype of the mildly affected patient.
  - name: p.Gly465Arg
    description: >-
      c.1393G>C; ClinVar VCV000635254, Pathogenic. Gly465 is buried in the
      C-terminal small domain and invariant in eukaryotic orthologs; any side
      chain, and a charged arginine in particular, clashes with the core.
      p.Gly465Asp (c.1394G>A, ClinVar conflicting) at the same residue was
      homozygous in a patient with the metabolomic signature. Both retain
      substantial activity in HEK-293 cells, which fits the milder course of
      the compound heterozygote.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: partial loss-of-function
      description: Moderate structural and catalytic defect with residual activity.
    evidence:
    - reference: PMID:40414180
      reference_title: "Biochemical investigation of pathogenic missense mutations of human 4-amino butyrate aminotransferase towards the understanding of the molecular pathogenesis of GABA transaminase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "variants exhibiting moderate structural and catalytic defects maintaining substantial transaminase activity (p.R92Q, p.F213C, p.G465D, and p.G465R)"
      explanation: Places both Gly465 substitutions in the residual-activity group.
  - name: p.Arg92Gln
    description: >-
      c.275G>A; ClinVar VCV000162036, Pathogenic/Likely pathogenic. In trans
      with a deletion of the exon spanning c.199-316 in a Japanese patient.
      Arg92 lies in the N-terminal part of the small domain, 25 angstroms from
      the cofactor and partly solvent exposed, and is not conserved outside
      vertebrates; AlphaMissense scores the change as likely benign (0.20).
      It is the least structurally explained of the established variants and
      retains substantial activity in HEK-293 cells, so its pathogenicity
      probably depends on being paired with a null allele.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: partial loss-of-function
      description: Moderate defect with residual activity.
    evidence:
    - reference: PMID:20052547
      reference_title: "A new case of GABA transaminase deficiency facilitated by proton MR spectroscopy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Molecular studies of the GABA-T gene revealed compound heterozygosity for a deletion of one exon and a missense mutation, 275G>A, which was not detected in 210 control chromosomes."
      explanation: Genotype of the Japanese patient.
  - name: p.Gln296His
    description: >-
      c.888G>T. Homozygous in a boy who died at 12 months. Gln296 is buried
      in the PLP-binding domain 7 angstroms from the cofactor and invariant
      from Escherichia coli to human. Experimentally a mainly catalytic
      defect.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: 4-aminobutyrate:2-oxoglutarate transaminase activity
      type: loss-of-function
      description: Catalytic defect.
    evidence:
    - reference: PMID:27376954
      reference_title: "Phenotyping GABA transaminase deficiency: a case description and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ABAT gene sequencing was performed post-mortem, identifying a homozygous variant c.888G > T (p.Gln296His),not previously described."
      explanation: Reports the homozygous variant.
  - name: p.Arg377Trp
    description: >-
      c.1129C>T. Arg377 is a subunit-interface residue, exposed in the monomer
      and buried in the dimer, whose guanidinium forms a salt bridge with
      Asp237 of the partner subunit beside the Asn380-Thr381 segment that
      binds the partner cofactor phosphate. Tryptophan removes the salt

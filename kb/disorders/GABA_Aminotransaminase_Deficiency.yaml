    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, functional studies conducted in cells from both mild and severe patient fibroblasts showed similar levels of compromise in mitochondrial membrane potential, respiratory capacity, ATP production and mtDNA depletion."
    explanation: Fibroblasts from mildly and severely affected patients showed the same degree of mitochondrial compromise, so the cellular finding does not track clinical severity.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_gaba_catabolic_block
  hypothesis_label: Canonical GABA Catabolic Block
  status: CANONICAL
  description: >-
    Biallelic loss of ABAT transaminase activity blocks GABA degradation; the
    resulting excess of GABA in the brain causes the encephalopathy,
    hypersomnolence, movement disorder and, through growth hormone, the
    accelerated growth.
  evidence:
  - reference: PMID:10407778
    reference_title: "4-Aminobutyrate aminotransferase (GABA-transaminase) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "4-Aminobutyrate aminotransferase (GABA-transaminase, GABA-T, EC 2.6.1.19) deficiency (McKusick 137150), an inborn error of GABA degradation, has until now been documented in only a single Flemish child."
    explanation: Defines the disorder as an inborn error of GABA degradation.
- hypothesis_group_id: developmental_depolarizing_gaba
  hypothesis_label: Depolarizing GABA in the Immature Brain
  status: ALTERNATIVE
  description: >-
    Explains seizures in a state of GABA excess by the excitatory action of
    GABA on immature neurons before the developmental chloride switch,
    starting prenatally. Competing explanations are silencing of inhibitory
    interneurons and receptor down-regulation.
  evidence:
  - reference: PMID:20052547
    reference_title: "A new case of GABA transaminase deficiency facilitated by proton MR spectroscopy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that excessive prenatal GABA exposure in the central nervous system (CNS) was responsible for the clinical manifestations of GABA transaminase deficiency."
    explanation: The authors propose prenatal GABA excess acting on the developing brain; this is an interpretation of one patient's findings.
- hypothesis_group_id: abat_mitochondrial_nucleoside_salvage
  hypothesis_label: ABAT in Mitochondrial Nucleoside Salvage
  status: EMERGING
  description: >-
    Proposes that ABAT is also required to maintain mitochondrial dNTP pools
    and mitochondrial DNA, making the disease in part a mitochondrial DNA
    depletion syndrome. All supporting data come from one group; muscle or
    brain mitochondrial DNA content has not been systematically measured in
    patients, and ClinGen has not curated ABAT for a mitochondrial disease.
  evidence:
  - reference: PMID:25738457
    reference_title: "The GABA transaminase, ABAT, is essential for mitochondrial nucleoside metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This work reveals ABAT as a connection between GABA metabolism and nucleoside metabolism and defines a neurometabolic disorder that includes MDS."
    explanation: The original statement of the hypothesis.

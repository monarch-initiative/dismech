differential_diagnoses:
- name: Other mitochondrial complex I deficiencies
  description: >
    Nuclear and mitochondrial-DNA complex I disorders can produce the same
    combination of cardiomyopathy, myopathy, lactic acidosis, neurologic
    involvement, and isolated complex I deficiency.
  distinguishing_features:
  - Molecular identification of biallelic ACAD9 variants establishes ACAD9 deficiency.
  - ACAD9 deficiency often has a prominent cardiomyopathic/myopathic phenotype and may show riboflavin responsiveness, but neither feature is diagnostic alone.
  evidence:
  - reference: PMID:21057504
    reference_title: "Exome sequencing identifies ACAD9 mutations as a cause of complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An isolated defect of respiratory chain complex I activity is a frequent
      biochemical abnormality in mitochondrial disorders.
    explanation: >-
      The nonspecificity of isolated complex I deficiency necessitates molecular
      differentiation from other mitochondrial etiologies.
- name: Very long-chain acyl-CoA dehydrogenase deficiency
  disease_term:
    preferred_term: very long chain acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0008723
      label: very long chain acyl-CoA dehydrogenase deficiency
  description: >
    VLCAD deficiency overlaps through acyl-CoA-dehydrogenase-family membership,
    cardiomyopathy, and muscle disease. ACAD9 also has tissue-dependent
    long-chain FAO activity, so the distinction should be based on the full
    clinical, biochemical, and molecular pattern rather than protein-family
    membership.
  distinguishing_features:
  - Hypoglycemia, rhabdomyolysis, and liver failure are typical of VLCAD deficiency but infrequent in ACAD9 deficiency.
  - ACAD9 deficiency is defined by biallelic ACAD9 variants and a complex I assembly defect rather than the classic VLCAD biochemical phenotype.
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although both ACAD9 and VLCAD deficiency can present with cardiomyopathy,
      the clinical pheno- type is otherwise distinct, with hypoglycemia,
      rhabdo- myolysis and liver failure, typically seen in VLCAD.
    explanation: >-
      The cohort review states the principal clinical distinctions from VLCAD
      deficiency while newer work preserves the tissue-dependent FAO nuance.
treatments:
- name: Riboflavin (Vitamin B2) Supplementation
  description: >
    Riboflavin is a commonly attempted empiric treatment. Complex I
    activity improved in 9/15 patient fibroblast lines, whereas 6/15 did not
    respond. Physicians reported clinical benefit in 20/31 retrospectively
    described patients and no effect in 11/31; a 2026 systematic review
    classified 22/29 reported patients as responsive. These overlapping,
    nonrandomized reports support a possible benefit but do not establish a
    causal survival effect, optimal regimen, or reliable response predictor.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: B vitamin supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  target_mechanisms:
  - target: Mitochondrial complex I deficiency
    treatment_effect: MODULATES
    description: >
      Riboflavin increased complex I activity in a subset of patient fibroblast
      lines. Improved folding or stability of some mutant ACAD9 species has been
      proposed as the upstream explanation, but the direct mechanism remains
      unresolved and ECSIT normally releases FAD when ACAD9 enters its assembly
      state.
    evidence:
    - reference: PMID:30025539
      reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Riboflavin supplementation led to a significant im- provement of complex
        I activity in nine out of 15 patient cell lines and had no effect in the
        remaining six cell lines.
      explanation: >-
        Patient-fibroblast rescue is reproducible in a subset but does not prove
        the proposed FAD/folding mechanism or universal responsiveness.
    - reference: PMID:30025539
      reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        previous studies suggested that riboflavin increases the mitochondrial
        FAD concentration thereby supporting FAD binding and consecutively
        improving ACAD9 folding and stability, thus promoting complex I assembly
      explanation: >-
        The authors explicitly present ACAD9 stabilization as a prior-study
        suggestion rather than a demonstrated treatment mechanism.
    - reference: PMID:38086790
      reference_title: "The assembly of the Mitochondrial Complex I Assembly complex uncovers a redox pathway coordination."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        ECSIT binding induces a major conformational change in the FAD-binding
        loop of ACAD9, releasing the FAD cofactor and converting ACAD9 from a
        fatty acid β-oxidation (FAO) enzyme to a CI assembly factor.
      explanation: >-
        The normal FAD-release step in assembly-state conversion complicates a
        simple model in which sustained FAD binding directly rescues MCIA
        function.
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For 20 patients (20/31 = 65%) physicians reported a beneficial effect, for
      11 (35%) no effect.
    explanation: >-
      Retrospective physician reports show frequent response alongside a
      substantial nonresponder group.
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This might indicate that our analysis is prone to survivor treatment
      selection bias. Detailed data about the starting point of riboflavin
      treatment, the dosage etc. in more patients are needed.
    explanation: >-
      The study's own limitations prevent interpreting the early-onset survival
      association as controlled evidence of efficacy.
  - reference: PMID:42046426
    reference_title: "Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACAD 9 (n = 29, 75.9% responsive)
    explanation: >-
      The 2026 systematic review summarizes reported response, but the ACAD9
      evidence derives from small, nonrandomized and partly overlapping reports.
  - reference: PMID:42046426
    reference_title: "Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse effects were infrequent and mild.
    explanation: >-
      The systematic review found generally mild adverse effects across the
      included inherited metabolic diseases, without an ACAD9-specific safety
      denominator.
  - reference: PMID:20929961
    reference_title: "Riboflavin-responsive oxidative phosphorylation complex I deficiency caused by defective ACAD9: new function for an old gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exercise intolerance and complex I activity was improved by a supplement
      of riboflavin at high dosage.
    explanation: >-
      Documents family-level clinical and biochemical responsiveness without
      establishing general effectiveness.
- name: Bezafibrate plus nicotinamide riboside (experimental)
  description: >
    One riboflavin-unresponsive infant with life-threatening cardiomyopathy and
    lactic acidosis temporarily improved and stabilized after high-dose
    bezafibrate plus nicotinamide riboside, but later died of cardiac failure
    with infection at 10.5 months. This is experimental, single-patient evidence
    and does not establish efficacy or a standard regimen.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

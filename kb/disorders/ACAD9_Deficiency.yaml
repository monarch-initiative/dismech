    reference_title: "Riboflavin-responsive oxidative phosphorylation complex I deficiency caused by defective ACAD9: new function for an old gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In muscle, subsarcolemmal mitochondrial proliferation and a severe
      complex I deficiency were observed.
    explanation: >-
      Patient skeletal muscle shows severe complex I deficiency with
      mitochondrial proliferation.
  downstream:
  - target: Reduced electron transport and oxidative phosphorylation
    description: >
      Complex I deficiency impairs electron transport and oxidative
      phosphorylation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20816094
      reference_title: "Acyl-CoA dehydrogenase 9 is required for the biogenesis of oxidative phosphorylation complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Contrary to its previously proposed involvement in fatty acid
        oxidation, we describe a role for ACAD9 in oxidative phosphorylation.
      explanation: >-
        Places the ACAD9-dependent complex I defect within oxidative
        phosphorylation.
- name: Reduced electron transport and oxidative phosphorylation
  description: >
    Reduced complex I function impairs NADH-to-ubiquinone electron transport and
    oxidative phosphorylation, limiting mitochondrial ATP production.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease causing biallelic variants in ACAD9 have been reported in
      individuals presenting with lactic acidosis and cardiomyopathy.
    explanation: >-
      Clinical co-occurrence is consistent with bioenergetic failure but does
      not experimentally resolve each downstream tissue mechanism.
  downstream:
  - target: ATP deficit and compensatory lactate production
    description: >
      Impaired oxidative phosphorylation lowers ATP availability and increases
      reliance on glycolysis, contributing to lactate accumulation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced electron transport limits proton-motive-force generation and ATP synthesis.
    - Increased glycolytic flux regenerates cytosolic ATP and produces lactate.
    evidence:
    - reference: PMID:30025539
      reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Disease causing biallelic variants in ACAD9 have been reported in
        individuals presenting with lactic acidosis and cardiomyopathy.
      explanation: >-
        The clinical association supports, but does not by itself prove, the
        proposed ATP-deficit and lactate-producing intermediate.
- name: ATP deficit and compensatory lactate production
  description: >
    Reduced oxidative ATP production particularly stresses heart, skeletal
    muscle, brain, and renal tissue. Compensatory glycolytic metabolism can
    raise circulating lactate; the precise tissue intermediates leading to each
    clinical manifestation remain incompletely resolved.
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  chemical_entities:

discussions:
- discussion_id: gap_acad9_riboflavin_response_mechanism
  prompt: >-
    Which patients with ACAD9 deficiency benefit from riboflavin, what dose and
    treatment timing are optimal, and how does response arise when ECSIT-driven
    conversion of ACAD9 into its complex I assembly state normally releases the
    FAD cofactor?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired ACAD9 complex I assembly-factor function
  - pathophysiology#Tissue-dependent long-chain fatty-acid-oxidation impairment
  - treatments#Riboflavin (Vitamin B2) Supplementation
  rationale: >-
    Riboflavin improves complex I activity in only 9/15 tested fibroblast lines,
    and retrospective reports include substantial clinical nonresponse and an
    acknowledged survivor-treatment-selection bias. The recent structural model
    also shows FAD release, rather than retention, when ECSIT commits ACAD9 to
    the assembly state. Prospective response criteria and a variant-aware
    mechanism are needed before observational survival differences can be
    interpreted causally or a regimen can be optimized.
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Riboflavin supplementation led to a significant im- provement of complex I
      activity in nine out of 15 patient cell lines and had no effect in the
      remaining six cell lines.
    explanation: >-
      Establishes cellular response heterogeneity.
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This might indicate that our analysis is prone to survivor treatment
      selection bias. Detailed data about the starting point of riboflavin
      treatment, the dosage etc. in more patients are needed.
    explanation: >-
      Identifies the principal limitation of the reported survival association.
  - reference: PMID:38086790
    reference_title: "The assembly of the Mitochondrial Complex I Assembly complex uncovers a redox pathway coordination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ECSIT binding induces a major conformational change in the FAD-binding
      loop of ACAD9, releasing the FAD cofactor and converting ACAD9 from a
      fatty acid β-oxidation (FAO) enzyme to a CI assembly factor.
    explanation: >-
      Defines the structural observation that a therapeutic mechanism must
      reconcile.
  - reference: PMID:42046426
    reference_title: "Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACAD 9 (n = 29, 75.9% responsive)
    explanation: >-
      Summarizes reported responsiveness while leaving trial-level efficacy and
      response predictors unresolved.

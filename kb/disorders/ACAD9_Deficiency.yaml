progression:
- phase: Early-onset severe disease
  age_range: Presentation in the first year of life
  notes: >-
    Most reported patients presented in the first year. In the retrospective
    cohort, approximately half of this early-onset subgroup did not survive the
    first two years; the estimate is sensitive to ascertainment and treatment.
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the patients presented in the first year of life. For this
      subgroup the survival was poor (50% not surviving the first 2 years)
      comparing to patients with a later presentation (more than 90% surviving
      10 years).
    explanation: >-
      The retrospective cohort documents poor survival in the early-onset
      subgroup and a strong age-of-onset survival gradient.
- phase: Later-onset attenuated disease
  age_range: After the first year of life
  notes: >-
    Later presentation is associated with substantially better survival, but
    muscle, cardiac, and neurologic manifestations may still evolve over time.
  evidence:
  - reference: PMID:30025539
    reference_title: "Clinical, biochemical and genetic spectrum of 70 patients with ACAD9 deficiency: is riboflavin supplementation effective?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For this subgroup the survival was poor (50% not surviving the first 2
      years) comparing to patients with a later presentation (more than 90%
      surviving 10 years).
    explanation: >-
      Cohort survival was markedly better among patients presenting after the
      first year of life.
  - reference: PMID:26669660
    reference_title: "High incidence and variable clinical outcome of cardiac hypertrophy due to ACAD9 mutations in childhood."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the surviving patients later developed delayed-onset neurologic or
      muscular symptoms, namely cognitive impairment, seizures, muscle weakness
      and exercise intolerance.
    explanation: >-
      A selected childhood series shows that later neurologic and muscular
      manifestations can emerge in survivors.
pathophysiology:
- name: Impaired ACAD9 complex I assembly-factor function
  description: >
    ACAD9 binds NDUFAF1 and ECSIT within the mitochondrial complex I assembly
    complex. ECSIT binding opens the ACAD9 FAD-binding loop, releases FAD, and
    switches ACAD9 from its acyl-CoA dehydrogenase state into a complex I
    assembly-factor state. Disease-causing ACAD9 variants impair this assembly
    function.
  genes:
  - preferred_term: ACAD9
    term:
      id: hgnc:21497
      label: ACAD9
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:20816094
    reference_title: "Acyl-CoA dehydrogenase 9 is required for the biogenesis of oxidative phosphorylation complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ACAD9 binds complex I assembly factors NDUFAF1 and Ecsit and is
      specifically required for the assembly of complex I.
    explanation: >-
      Cell-based work establishes ACAD9 as a complex I assembly factor binding
      NDUFAF1 and ECSIT.
  - reference: PMID:38086790
    reference_title: "The assembly of the Mitochondrial Complex I Assembly complex uncovers a redox pathway coordination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ECSIT binding induces a major conformational change in the FAD-binding
      loop of ACAD9, releasing the FAD cofactor and converting ACAD9 from a
      fatty acid β-oxidation (FAO) enzyme to a CI assembly factor.
    explanation: >-
      Structural and biochemical work defines the FAD-releasing molecular
      switch between the two mutually exclusive ACAD9 states.
  downstream:
  - target: Mitochondrial complex I deficiency
    description: >
      Loss of ACAD9 assembly-factor function prevents proper assembly of
      respiratory chain complex I, producing isolated complex I deficiency.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20816094
      reference_title: "Acyl-CoA dehydrogenase 9 is required for the biogenesis of oxidative phosphorylation complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, ACAD9 mutations result in complex I deficiency and not in
        disturbed long-chain fatty acid oxidation.
      explanation: >-
        Cell-based work directly links ACAD9 dysfunction to impaired complex I
        assembly; it did not detect a classic long-chain FAO defect in the cells
        tested.
    - reference: PMID:21057504
      reference_title: "Exome sequencing identifies ACAD9 mutations as a cause of complex I deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrated the pathogenic role of the ACAD9 variants by the
        correction of the complex I defect on expression of the wildtype ACAD9
        protein in fibroblasts derived from affected individuals.
      explanation: >-
        Complementation rescue in patient fibroblasts causally links ACAD9
        variants to the complex I defect.
- name: Tissue-dependent long-chain fatty-acid-oxidation impairment
  description: >
    In cells that express ACAD9 strongly, its FAD-dependent long-chain acyl-CoA
    dehydrogenase activity contributes to fatty-acid-oxidation capacity. This
    function is distinct from the ECSIT-bound assembly state and may modify
    clinical severity even though ACAD9 deficiency does not usually present as
    a classic long-chain fatty-acid-oxidation disorder.
  genes:
  - preferred_term: ACAD9
    term:
      id: hgnc:21497
      label: ACAD9
  molecular_functions:
  - preferred_term: acyl-CoA dehydrogenase activity
    term:
      id: GO:0003995
      label: acyl-CoA dehydrogenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25721401
    reference_title: "Complex I assembly function and fatty acid oxidation enzyme activity of ACAD9 both contribute to disease severity in ACAD9 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ACAD9 knockout in HEK293 cells affected long-chain fatty acid oxidation
      along with Cl, both of which were rescued by wild type ACAD9.
    explanation: >-
      Knockout and rescue establish a tissue-expression-dependent contribution
      of ACAD9 to long-chain fatty-acid oxidation.
  - reference: PMID:25721401
    reference_title: "Complex I assembly function and fatty acid oxidation enzyme activity of ACAD9 both contribute to disease severity in ACAD9 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We showed that there was a significant inverse correlation between
      residual enzyme ACAD activity and phenotypic severity of ACAD9-deficient
      patients.
    explanation: >-
      Functional study of 16 variants from 24 patients supports ACAD activity as
      a severity modifier rather than the sole disease mechanism.
- name: Mitochondrial complex I deficiency
  description: >
    Impaired assembly of respiratory chain complex I (NADH:ubiquinone
    oxidoreductase) produces isolated complex I deficiency. This is demonstrable
    biochemically in patient skeletal muscle and fibroblasts.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:

name: ACAD9 Deficiency
creation_date: '2026-07-02T00:00:00Z'
category: Mendelian
synonyms:
- Acyl-CoA dehydrogenase 9 deficiency
- ACAD9-related mitochondrial complex I deficiency
- Mitochondrial complex I deficiency, nuclear type 20
description: >
  ACAD9 deficiency is an autosomal recessive mitochondrial disorder caused by
  biallelic pathogenic variants in ACAD9. ACAD9 has two mutually exclusive
  molecular states: an FAD-containing long-chain acyl-CoA dehydrogenase state
  and an ECSIT-bound mitochondrial complex I assembly (MCIA) state. Impaired
  complex I assembly is the defining biochemical defect, while loss of
  tissue-dependent fatty-acid-oxidation activity may modify disease severity
  without producing the classic VLCAD-deficiency phenotype. Cardiomyopathy,
  muscle weakness, exercise intolerance, and lactic acidosis predominate;
  neurologic and other organ involvement is variable. Most recognized patients
  present in the first year of life, although later presentations occur.
  Riboflavin often improves complex I activity in patient fibroblasts and
  observational clinical responses are reported, but nonresponse is common and
  neither a causal survival benefit nor the molecular treatment mechanism has
  been established in a controlled trial.

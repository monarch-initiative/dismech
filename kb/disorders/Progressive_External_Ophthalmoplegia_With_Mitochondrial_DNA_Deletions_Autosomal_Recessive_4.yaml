      label: Mitochondrial myopathy
  notes: >-
    5 of 5 subjects, but by construction: the cohort was defined as adults with mitochondrial
    myopathy and multiple mtDNA deletions in muscle, so this frequency describes the ascertainment
    and not the penetrance of the genotype. Graded VERY_FREQUENT rather than OBLIGATE for exactly
    that reason - a genotype-first series could well find DGUOK carriers without myopathy.

    explanation: >-
      Independent expert-panel assignment of autosomal recessive inheritance, and of a Definitive
      classification. Graded OTHER because a curation assertion is an expert judgement rather than
      a study.
pathophysiology:
- name: Biallelic DGUOK Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of DGUOK. The 2012 series reported recessive DGUOK mutations in five
    unrelated adults ascertained for adult-onset mitochondrial myopathy with multiple mtDNA
    deletions in muscle; individual alleles are not given in the abstract available here. Across
    the whole DGUOK phenotype ClinGen counted fourteen variants - six missense, six truncating,
    two affecting splicing - and read the mechanism as loss of function.
  genes:
  - preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  genetic_context:
    genes:
    - preferred_term: DGUOK
      term:
        id: hgnc:2858
        label: DGUOK
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic recessive variants. Zygosity is not stated per subject in the source available
      here and is left unset rather than guessed; across the wider DGUOK literature both
      homozygotes and compound heterozygotes are reported.
    notes: >-
      LOSS_OF_FUNCTION is supported directly for this presentation, not only by inference: muscle
      DGUOK enzyme activity and DGUOK protein stability were both impaired in the 2012 subjects.
      That is unusual for an adult-onset allelic series, where the assumption is often that the
      later-onset phenotype carries hypomorphic alleles - here the enzyme defect is measured.

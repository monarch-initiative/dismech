- name: Respiratory-Chain Deficiency in Skeletal Muscle
  biological_scale: CELLULAR
  description: >-
    Each large-scale mtDNA deletion removes tRNA genes and structural subunit genes, so a fibre
    whose deleted species has clonally expanded past the biochemical threshold loses oxidative
    phosphorylation capacity. Because expansion is independent in each fibre, the deficiency is
    mosaic rather than uniform.

    This node is the standard account of how multiple mtDNA deletions cause disease and is
    inferred here rather than measured: no respiratory-chain enzymology, blue-native analysis or
    COX/SDH histochemistry in a PEOB4 patient is reported in the sources cited here.
  biological_processes:

    snippet: "Affected individuals have a spectrum of clinical features ranging from infantile or childhood onset noncirrhotic portal hypertension, isolated hepatic failure (with at least one case that was apparently spontaneously reversible), hepatic failure with neurologic involvement that is often fatal, and adult-onset mitochondrial myopathy with chronic progressive ophthalmoplegia and multiple mitochondrial DNA (mtDNA) deletions in muscle."
    explanation: >-
      Independent confirmation that muscle mtDNA deletions belong to the DGUOK phenotype. Graded
      OTHER because a curation narrative is an expert synthesis rather than a study.

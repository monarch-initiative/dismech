    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DGUOK occurred in five independent subjects, representing 5.6% of our cohort of patients with mitochondrial DNA multiple deletions, and impaired both muscle DGUOK activity and protein stability."
    explanation: >-
      The number of subjects, the share of the cohort they represent, and the two functional
      consequences measured in their muscle.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z

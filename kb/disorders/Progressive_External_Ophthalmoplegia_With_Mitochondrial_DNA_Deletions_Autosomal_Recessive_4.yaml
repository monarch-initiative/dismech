  downstream:
  - target: Failure of Mitochondrial Purine Deoxyribonucleoside Salvage
    causal_link_type: DIRECT
- name: Failure of Mitochondrial Purine Deoxyribonucleoside Salvage
  biological_scale: MOLECULAR
  description: >-
    The mitochondrial salvage pathway is how a post-mitotic cell obtains deoxyribonucleotides for
    mtDNA synthesis. A dividing cell makes dNTPs in the cytosol through ribonucleotide reductase,
    coupled to nuclear S phase; a neuron or a muscle fibre has no S phase, and depends on
    salvaging deoxyribonucleosides inside the matrix. Deoxyguanosine kinase supplies the purine
    half of that route. This is the standing explanation for why defects of mitochondrial
    nucleotide supply strike post-mitotic tissue hardest, and it is stated here as the accepted
    account rather than as something demonstrated in these patients.
  biological_processes:
  - preferred_term: purine nucleotide salvage
    modifier: DECREASED
    term:
      id: GO:0032261
      label: purine nucleotide salvage
  evidence:
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Deoxyguanosine kinase (dGK) is an essential rate-limiting component of the mitochondrial purine nucleotide salvage pathway, encoded by the nuclear gene encoding deoxyguanosine kinase (DGUOK)."
    explanation: >-
      Places the enzyme in the salvage pathway this node names. Graded OTHER because the sentence
      states established background biology rather than a result of the study.
  downstream:
  - target: Imbalanced Mitochondrial dNTP Pool
    causal_link_type: DIRECT
- name: Imbalanced Mitochondrial dNTP Pool
  biological_scale: MOLECULAR
  description: >-
    Losing one arm of matrix nucleotide supply does not simply lower every dNTP equally; it skews
    the pool, and a skewed pool is what damages replication. The zebrafish work makes that point
    from the other direction: supplementing juvenile fish with a single purine nucleoside
    *reduced* mtDNA copy number in both mutant and wild-type animals, which the authors attribute
    to nucleotide pool imbalance, while supplementing adult mutants with both purine nucleosides
    increased liver mtDNA copy number. Balance, not absolute supply, is the variable.

    No direct measurement of the mitochondrial dNTP pool in a PEOB4 patient is reported in the
    sources cited here; this node rests on the salvage-pathway biology above and on the model
    system below.
  evidence:
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "When supplemented with only one purine nucleoside (dGuo), mtDNA copy number in both mutant and wt juvenile animals was significantly reduced, contrasting with previous cell culture studies, possibly because of nucleotide pool imbalance."
    explanation: >-
      The pool-imbalance reading, and the observation that motivates it. INDIRECT because the
      imbalance is the authors' inferred explanation for a copy-number result, not a measured
      pool, and because the system is a zebrafish rather than a patient.
  downstream:
  - target: Impaired and Error-Prone mtDNA Replication
    causal_link_type: DIRECT
- name: Impaired and Error-Prone mtDNA Replication
  biological_scale: MOLECULAR
  description: >-
    An inadequate and skewed dNTP supply slows the replication fork and raises the chance of
    misincorporation and of strand slippage at the repeat elements where large-scale mtDNA
    deletions arise. DGUOK sits with POLG, POLG2, TWNK, OPA1, MPV17 and TYMP in the group of
    nuclear genes whose loss impairs mtDNA maintenance, and that group produces mtDNA depletion,
    mtDNA deletions, or both, depending on the gene and the tissue.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
  evidence:
  - reference: PMID:35114397
    reference_title: "Mitochondrial DNA homeostasis impairment and dopaminergic dysfunction: A trembling balance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in several nuclear genes (i.e., POLG, POLG2, TWNK, OPA1, DGUOK, MPV17, TYMP) impair mtDNA maintenance, leading to clinical syndromes characterized by mtDNA depletion and/or deletions in affected tissues."
    explanation: >-
      DGUOK placed in the mtDNA-maintenance gene group, and the statement that this group yields
      depletion and deletions rather than one or the other. Graded OTHER because a review's
      enumeration is an expert synthesis rather than a study.
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study we developed a mutant dguok zebrafish (Danio rerio) line using CRISPR/Cas9 mediated mutagenesis; dguok-/- fish have significantly reduced mtDNA levels compared with wild-type (wt) fish."
    explanation: >-
      Direct evidence that losing dguok reduces mtDNA content in a whole animal. INDIRECT for this
      node because the readout is copy number rather than replication fidelity, and because it is
      the depletion arm of the phenotype rather than the deletion arm this entity shows.
  downstream:
  - target: Multiple Large-Scale mtDNA Deletions in Skeletal Muscle
    causal_link_type: DIRECT
- name: Multiple Large-Scale mtDNA Deletions in Skeletal Muscle
  biological_scale: MOLECULAR
  description: >-
    The defining molecular lesion of this presentation: multiple large-scale mtDNA deletions in
    skeletal muscle. This is the point at which PEOB4 diverges from the infantile hepatocerebral
    DGUOK phenotype, which shows mtDNA depletion in liver and brain instead. Deleted mtDNA species
    clonally expand within individual post-mitotic fibres over decades, which is why the
    presentation is adult-onset even though the enzyme defect is congenital.

    The tissue-and-age dependence of depletion versus deletion is the entity's most interesting
    open question and is not explained in the literature cited here; it is recorded as a
    discussion rather than asserted as a mechanism.

prevalence:
- population: Adults with multiple mitochondrial DNA deletions in skeletal muscle
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    The one quantitative figure available is not a population prevalence but a diagnostic yield:
    DGUOK accounted for 5.6 percent of a cohort of patients with multiple mtDNA deletions - five
    of about ninety. That is a useful number for a clinician deciding whether to sequence DGUOK in
    such a patient and is worthless as a population rate, so it is recorded in this note and the
    prevalence_class is left at the numeric floor tier with no rate_per_100000. The population
    field names the denominator the 5.6 percent actually refers to rather than "Worldwide", which
    would misrepresent it.
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DGUOK occurred in five independent subjects, representing 5.6% of our cohort of patients with mitochondrial DNA multiple deletions, and impaired both muscle DGUOK activity and protein stability."
    explanation: The diagnostic yield, with its numerator and its explicitly stated denominator.
progression:
- phase: Adult onset, decades after a congenital enzyme defect
  notes: >-
    The enzyme deficiency is present from conception, but this presentation is adult-onset. The
    standard explanation is that deleted mtDNA species must clonally expand within individual
    post-mitotic fibres before enough of them cross the biochemical threshold to produce symptoms,
    which takes decades - the same reasoning that applies across the multiple-mtDNA-deletion
    syndromes. Age at onset per subject is not given in the source available here.
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Syndromes associated with mitochondrial DNA multiple deletions are caused by different molecular defects resulting in a wide spectrum of predominantly adult-onset clinical presentations, ranging from progressive external ophthalmoplegia to multi-systemic disorders of variable severity."
    explanation: The predominantly adult onset of this class of syndromes, and the range of severity within it.
- phase: Survival of the infantile hepatic phase in one patient
  notes: >-
    One subject reached the adult muscle phenotype only because she survived the infantile hepatic
    one, by liver transplantation at nine months. She is the single documented instance of one
    person traversing the DGUOK spectrum, and she implies something about the others: an adult
    PEOB4 patient is, in principle, someone whose liver was spared, and what determines that is
    not known.
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentations were variable, including mitochondrial myopathy with or without progressive external ophthalmoplegia, recurrent rhabdomyolysis in a young female who had received a liver transplant at 9 months of age and adult-onset lower motor neuron syndrome with mild cognitive impairment."
    explanation: The infantile liver transplant in the subject who later presented with rhabdomyolysis.
genetic:
- name: DGUOK
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: DGUOK
    term:
      id: hgnc:2858
      label: DGUOK
  notes: >-
    DGUOK encodes mitochondrial deoxyguanosine kinase. The gene-disease relationship is
    ClinGen-Definitive - much stronger than for most entities of this size - but the strength
    attaches to DGUOK-related mitochondrial disease as a whole rather than to this presentation
    specifically.

    The allelic series is the thing to understand before extending this entry. DGUOK carries three
    OMIM phenotype numbers, all recessive and all this gene: 251880, the classic infantile
    hepatocerebral mtDNA depletion syndrome; 617068, noncirrhotic portal hypertension 1; and
    617070, this entity. dismech curates none of the other two as disorder entries - the
    portal-hypertension form is curated as a differential inside
    `Portal_Hypertension_Noncirrhotic_2`, which is a GIMAP5 disease - so a curator searching
    dismech for DGUOK will find scattered mentions and this file.

    ClinGen has explicitly decided against that split. Its 2024 curation states that the various
    names given to DGUOK-related disease describe one primary mitochondrial disease and that the
    phenotype has been lumped into a single entity under its Lumping and Splitting Framework. This
    entry does not follow that decision, and the reason is recorded in the entry notes rather than
    left implicit.
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings reinforce the concept that mutations in genes involved in deoxyribonucleotide metabolism can cause diverse clinical phenotypes and suggest that DGUOK should be screened in patients harbouring mitochondrial DNA deletions in skeletal muscle."
    explanation: >-
      The authors' own generalisation - one nucleotide-metabolism gene, diverse phenotypes - and
      the clinical recommendation that follows from it.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z
    reference_title: "DGUOK / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is definitive evidence to support the relationship between DGUOK and primary mitochondrial disease."
    explanation: >-
      The independent strength-of-evidence judgement. Graded OTHER because a curation assertion is
      an expert judgement rather than a study.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z
    reference_title: "DGUOK / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, the DGUOK phenotype has been lumped into one disease entity according to the ClinGen Lumping and Splitting Framework."
    explanation: >-
      The expert panel's lumping decision, quoted because this entry deliberately takes the
      opposite position and the disagreement should be visible rather than hidden. Graded OTHER as
      above.
diagnosis:
- name: Muscle mtDNA deletion analysis followed by nuclear gene sequencing
  description: >-
    The diagnostic route that defined this entity, and the one it recommends. Multiple mtDNA
    deletions in a muscle biopsy establish a nuclear mtDNA-maintenance defect but not which gene;
    targeted or exome sequencing then names it. Before 2012, DGUOK was not on the candidate list
    for an adult with muscle mtDNA deletions - it was an infantile liver gene - and the defining
    paper's practical conclusion is precisely that it should be added.

    Note the ascertainment asymmetry this creates: every reported PEOB4 patient was found because
    someone had already demonstrated mtDNA deletions in their muscle. A DGUOK patient without a
    muscle biopsy is invisible to this route.
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings reinforce the concept that mutations in genes involved in deoxyribonucleotide metabolism can cause diverse clinical phenotypes and suggest that DGUOK should be screened in patients harbouring mitochondrial DNA deletions in skeletal muscle."
    explanation: The screening recommendation that follows from the series.
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations underlying these conditions remain undisclosed in half of the affected subjects."
    explanation: >-
      The diagnostic gap this route was built to close - half of multiple-deletion syndromes were
      genetically unsolved.
animal_models:
- name: dguok-null zebrafish
  species: Zebrafish
  genotype: dguok-/- (CRISPR/Cas9 mutagenesis)
  publication: PMID:30428046
  description: >-
    A CRISPR/Cas9 dguok-knockout zebrafish line. It reproduces the mtDNA-depletion arm of the
    DGUOK phenotype - mutant fish have significantly reduced mtDNA levels - and was built to test
    nucleoside supplementation, which is the only mechanistically motivated therapeutic idea for
    this gene. The result was informative and unwelcome: supplementing juveniles with a single
    purine nucleoside reduced mtDNA copy number in mutants *and* in wild-type fish, contradicting
    earlier cell-culture work, while supplementing adult mutants with both purine nucleosides
    raised liver mtDNA copy number.
  modeled_mechanisms:
  - target: Impaired and Error-Prone mtDNA Replication
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      A whole-animal demonstration that losing deoxyguanosine kinase reduces mtDNA content, which
      establishes the link from the enzyme to mtDNA maintenance in vivo.
    limitations: >-
      It models mtDNA *depletion*, which is the infantile hepatic phenotype, and not the multiple
      large-scale mtDNA *deletions* in skeletal muscle that define this entity - the copy-number
      readout says nothing about deletion burden, and the reported effect is in liver. A complete
      null in a fish also does not correspond to the human recessive alleles here, and the
      lifespan of the model cannot accommodate the decades of clonal expansion that make the human
      disease adult-onset. This is the most important caveat in the entry: the only animal model
      of the gene addresses the other end of its spectrum.
    readouts:
    - name: mtDNA copy number in dguok-/- fish
      target: Impaired and Error-Prone mtDNA Replication
      direction: DECREASED
      interpretation: >-
        Mutant fish carry significantly less mtDNA than wild-type, establishing the enzyme's role
        in mtDNA maintenance in a whole animal.
      evidence:
      - reference: PMID:30428046
        reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In this study we developed a mutant dguok zebrafish (Danio rerio) line using CRISPR/Cas9 mediated mutagenesis; dguok-/- fish have significantly reduced mtDNA levels compared with wild-type (wt) fish."
        explanation: The model and its baseline mtDNA phenotype.
    evidence:
    - reference: PMID:30428046
      reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study we developed a mutant dguok zebrafish (Danio rerio) line using CRISPR/Cas9 mediated mutagenesis; dguok-/- fish have significantly reduced mtDNA levels compared with wild-type (wt) fish."
      explanation: >-
        Establishes the model as informative for the mtDNA-maintenance node it is linked to, at
        the level of copy number.
  - target: Imbalanced Mitochondrial dNTP Pool
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Nucleoside supplementation manipulates the substrate supply to the salvage pathway, and the
      divergent results of supplying one versus both purine nucleosides are the entity's clearest
      evidence that pool *balance* rather than absolute supply is what matters.
    limitations: >-
      The pool itself was not measured; imbalance is the authors' inferred explanation for a
      copy-number result. The single-nucleoside effect was seen in juveniles and the
      two-nucleoside effect in adults, so the two arms are not directly comparable, and the
      beneficial result is a liver readout in a model of the hepatic phenotype rather than a
      muscle readout relevant to this entity.
    readouts:
    - name: Liver mtDNA copy number after dual purine nucleoside supplementation in adults
      target: Imbalanced Mitochondrial dNTP Pool
      direction: INCREASED
      interpretation: >-
        Supplying both purine nucleosides raises liver mtDNA copy number in adult mutants, which
        is the pro-therapeutic result.
      evidence:
      - reference: PMID:30428046
        reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, in adult dguok-/- fish we detected a significant increase in liver mtDNA copy number when supplemented with both purine nucleosides."
        explanation: The positive supplementation result, with its species, age and tissue attached.
    - name: mtDNA copy number after single purine nucleoside supplementation in juveniles
      target: Imbalanced Mitochondrial dNTP Pool
      direction: DECREASED
      interpretation: >-
        Supplying deoxyguanosine alone lowered mtDNA copy number in mutant and wild-type juveniles
        alike - a negative result, and the reason the entry treats nucleoside supplementation as
        unproven rather than promising.
      evidence:
      - reference: PMID:30428046
        reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "When supplemented with only one purine nucleoside (dGuo), mtDNA copy number in both mutant and wt juvenile animals was significantly reduced, contrasting with previous cell culture studies, possibly because of nucleotide pool imbalance."
        explanation: >-
          The negative result and the authors' explanation for it, including that it contradicts
          earlier cell-culture work.
    evidence:
    - reference: PMID:30428046
      reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study further supports the idea that nucleoside supplementation has a potential therapeutic benefit in mtDNA depletion syndromes by substrate enhancement of the purine nucleoside salvage pathway and might improve the liver pathology in patients."
      explanation: >-
        The authors' framing of what the model is for - testing substrate enhancement of the
        pathway this node describes.
treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists for PEOB4 and none has been trialled. Management is
    supportive and symptomatic - ptosis surgery or lid crutches where ocular involvement is
    disabling, exercise and rehabilitation advice, avoidance of the catabolic and exertional
    triggers that precipitate rhabdomyolysis, and genetic counselling. None of that is specific to
    DGUOK, and none of it is reported for these patients in the sources cited here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded with no evidence block and no target_mechanisms link, deliberately. There is no
    treatment publication for this entity, an evidence item requires an exact quote supporting the
    specific claim, and a mechanism link would assert an effect on the pathograph that nothing
    demonstrates.
- name: Purine nucleoside supplementation
  description: >-
    Supplying deoxyribonucleosides to bypass the missing kinase step is the one mechanistically
    motivated therapeutic idea for DGUOK deficiency, and it remains preclinical. In the dguok-null
    zebrafish, supplementing adults with both purine nucleosides raised liver mtDNA copy number,
    but supplementing juveniles with deoxyguanosine alone *reduced* copy number in mutant and
    wild-type fish alike - a result that contradicted earlier cell-culture work and that the
    authors attribute to nucleotide pool imbalance.

    Two things follow, and both argue against reading this as an emerging therapy for PEOB4. The
    tested benefit is a liver copy-number readout in a depletion model, whereas this entity is a
    muscle deletion disorder; and the direction of effect depends on which nucleosides are given,
    so a partial regimen may be worse than none.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: purine deoxyribonucleoside supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Preclinical only - no human trial, and no report of its use in a PEOB4 patient. No
    target_mechanisms link is declared even though the mechanism is clear, because a link would
    assert an effect on this entity's pathograph and the only evidence is a zebrafish liver
    readout in the depletion arm of the phenotype. The supporting and contradicting results are
    curated in full on the animal model above rather than summarised optimistically here.
  evidence:
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "However, in adult dguok-/- fish we detected a significant increase in liver mtDNA copy number when supplemented with both purine nucleosides."
    explanation: >-
      The positive preclinical result. INDIRECT because it is a copy-number readout in fish liver,
      two steps from a clinical benefit in human muscle.
  - reference: PMID:30428046
    reference_title: "Nucleoside supplementation modulates mitochondrial DNA copy number in the dguok -/- zebrafish."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "When supplemented with only one purine nucleoside (dGuo), mtDNA copy number in both mutant and wt juvenile animals was significantly reduced, contrasting with previous cell culture studies, possibly because of nucleotide pool imbalance."
    explanation: >-
      Refutes the simple form of the claim - that supplying the missing substrate raises mtDNA.
      Given alone, deoxyguanosine did the opposite, in mutants and controls alike.
differential_diagnoses:
- name: Autosomal recessive progressive external ophthalmoplegia 1 (POLG)
  description: >-
    PEOB1, caused by biallelic POLG variants, is the commonest recessive cause of adult PEO with
    multiple mtDNA deletions and presents in the same way - ptosis and ophthalmoplegia with a
    mitochondrial myopathy and multiple deletions in muscle. It is separated from PEOB4 only by
    sequencing, and it is curated in dismech as its own entry
    (`Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1`). The distinction matters
    clinically because POLG disease carries an absolute contraindication to valproic acid that
    DGUOK disease does not.
  evidence:
  - reference: PMID:35114397
    reference_title: "Mitochondrial DNA homeostasis impairment and dopaminergic dysfunction: A trembling balance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in several nuclear genes (i.e., POLG, POLG2, TWNK, OPA1, DGUOK, MPV17, TYMP) impair mtDNA maintenance, leading to clinical syndromes characterized by mtDNA depletion and/or deletions in affected tissues."
    explanation: >-
      POLG and DGUOK named together in the same mtDNA-maintenance group, which is why they
      phenocopy each other. Graded OTHER because a review's enumeration is an expert synthesis
      rather than a study.
- name: DGUOK-related hepatocerebral mitochondrial DNA depletion syndrome
  description: >-
    The infantile form of the same enzyme deficiency, OMIM 251880: liver failure with neurological
    deterioration in the first days or weeks of life, with mtDNA depletion rather than deletions,
    and a generally poor prognosis. It is a differential only in the sense that it is the same
    gene at a different age - a family history of an infant death from liver failure is a
    diagnostic clue in an adult with unexplained mtDNA deletions, and one patient in the defining
    series had this phenotype herself before developing the adult one.
  evidence:
  - reference: PMID:32278775
    reference_title: "Acute liver failure due to DGUOK deficiency-is liver transplantation justified?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deoxyguanosine kinase (DGUOK) deficiency is one of the causes of the hepatocerebral form of mitochondrial depletion syndrome (MDS)."
    explanation: The infantile entity and its mechanism, named as a DGUOK phenotype.
  - reference: PMID:32278775
    reference_title: "Acute liver failure due to DGUOK deficiency-is liver transplantation justified?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by an early onset of liver failure with concomitant neurological deterioration."
    explanation: >-
      The infantile presentation, which is what distinguishes it from this entity at the bedside.
- name: DGUOK-related noncirrhotic portal hypertension
  description: >-
    Noncirrhotic portal hypertension 1, OMIM 617068, the third DGUOK phenotype: portal
    hypertension of indeterminate cause beginning in infancy or childhood without cirrhosis. It is
    curated in dismech as a differential inside `Portal_Hypertension_Noncirrhotic_2`, the GIMAP5
    disease, rather than as its own entry. Listed here because a curator reasoning about the DGUOK
    allelic series needs to know all three phenotypes exist and where each is modelled.
  evidence:
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z
    reference_title: "DGUOK / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected individuals have a spectrum of clinical features ranging from infantile or childhood onset noncirrhotic portal hypertension, isolated hepatic failure (with at least one case that was apparently spontaneously reversible), hepatic failure with neurologic involvement that is often fatal, and adult-onset mitochondrial myopathy with chronic progressive ophthalmoplegia and multiple mitochondrial DNA (mtDNA) deletions in muscle."
    explanation: >-
      All three DGUOK phenotypes in one sentence, from an independent expert panel. Graded OTHER
      because a curation narrative is an expert synthesis rather than a study.
discussions:
- discussion_id: peob4_depletion_versus_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Multiple Large-Scale mtDNA Deletions in Skeletal Muscle
  - pathophysiology#Imbalanced Mitochondrial dNTP Pool
  prompt: >-
    Why does the same DGUOK enzyme deficiency cause mtDNA depletion in infant liver and mtDNA
    deletions in adult muscle?
  rationale: >-
    This is the entity's central unexplained fact, and it is a question about DGUOK rather than
    about PEOB4 alone. Three candidate explanations are consistent with what is published and are
    not distinguished by it: allele severity, with null genotypes exhausting the pool fast enough
    to deplete and hypomorphic ones merely skewing it; tissue-specific salvage capacity, since
    liver and muscle differ in cytosolic and mitochondrial deoxyribonucleoside handling; and
    proliferative context, since a growing infant liver replicates mtDNA far faster than an adult
    muscle fibre and may fail by exhaustion where the fibre fails by infidelity over decades.

    The entry's description offers the third as a synthesis and explicitly marks it as such. It is
    recorded here rather than asserted because no source cited here tests it, and because the one
    patient who traversed both phenotypes shows the alleles alone cannot be the whole answer -
    the same genotype produced depletion in her liver and deletions in her muscle.
  proposed_experiments:
  - experiment_id: exp_peob4_tissue_dntp_pools
    name: Genotype-matched comparison of mitochondrial dNTP pools and mtDNA lesions across tissues
    description: >-
      In cells or tissue from DGUOK patients spanning the allelic series - ideally including the
      patient with both phenotypes - measure matrix dNTP pool composition, mtDNA copy number and
      large-scale deletion burden in hepatocyte-like and myotube models derived from the same
      individual, and ask whether the depletion-versus-deletion outcome tracks residual enzyme
      activity, cell type, or proliferation rate.
    would_support:
    - pathophysiology#Imbalanced Mitochondrial dNTP Pool
    supporting_outcome:
    - >-
      The same genotype gives depletion in the proliferating hepatocyte-like model and an
      accumulating deletion burden in the post-mitotic myotube model, with a comparably skewed
      dNTP pool in both.
    refuting_outcome:
    - >-
      Depletion and deletion segregate with residual enzyme activity rather than with cell type,
      which would make the two phenotypes an allele-severity effect and leave the tissue synthesis
      in this entry wrong.
    readouts:
    - name: Large-scale mtDNA deletion burden by cell type
      target: pathophysiology#Multiple Large-Scale mtDNA Deletions in Skeletal Muscle
      direction: INCREASED
      interpretation: >-
        A higher deletion burden in the post-mitotic model at matched genotype would support the
        proliferative-context explanation.
- discussion_id: peob4_versus_clingen_lumping
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - disease#Progressive External Ophthalmoplegia with Mitochondrial DNA Deletions, Autosomal Recessive 4
  prompt: >-
    Should dismech curate DGUOK as one disease entry, as ClinGen does, rather than as this
    presentation alone?
  rationale: >-
    ClinGen's 2024 curation states outright that the DGUOK phenotype has been lumped into one
    disease entity, on the grounds that the various names describe one primary mitochondrial
    disease. This entry does the opposite, and the disagreement is deliberate rather than
    accidental.

    The case for splitting: MONDO and OMIM both carry three separate identifiers, this entity has
    its own MONDO term that dismech's stub queue nominated, and dismech already curates the
    sibling PEOB1 (POLG) as a standalone entry - so a per-presentation entry is the local
    convention, and lumping DGUOK would make it the only mtDNA-maintenance gene curated
    gene-first. The case for lumping: one patient in the defining series had both phenotypes, the
    mechanism is identical, and a reader who wants to understand DGUOK has to assemble it from
    this entry, a differential inside a GIMAP5 disease entry, and nothing at all for the infantile
    form.

    A `DGUOK-Related_Mitochondrial_Disease` entry with this presentation as a `has_subtypes` entry
    would satisfy ClinGen and would be a reasonable future refactor; it is not attempted here
    because it would require curating two phenotypes this claim did not cover.
notes: >-
  Scope and shape. entry_type DISEASE, standalone. Two things drove that: dismech curates the
  sibling PEOB series per gene - `Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1` is
  the POLG entity and was the template for this file - and there is no DGUOK entry in `kb/` for
  this to be a subtype of. The stub is deleted because MONDO:0014899 is now bound by this entry's
  disease_term.

  The lump/split disagreement is recorded, not hidden. ClinGen explicitly lumps all of
  DGUOK-related disease into one entity, and that quote is curated as evidence in the `genetic`
  block with an explanation saying this entry takes the opposite position. An OPEN_QUESTION
  discussion sets out both cases and names the refactor - a `DGUOK-Related_Mitochondrial_Disease`
  entry with this as a `has_subtypes` - that would reconcile them. No mtDNA-depletion grouping was
  created; that concept was set aside as over-broad earlier in this queue, and nothing here needs
  it.

  Where the DGUOK allelic series is modelled in dismech today. This entry is OMIM 617070. OMIM
  251880, the infantile hepatocerebral depletion syndrome, has no dismech entry and is curated
  here only as a differential. OMIM 617068, noncirrhotic portal hypertension 1, is curated as a
  differential inside `Portal_Hypertension_Noncirrhotic_2`, which is a GIMAP5 disease. The other
  DGUOK mentions in `kb/` - `Alpers-Huttenlocher_Syndrome` and
  `TRMU-Related_Acute_Infantile_Liver_Failure` - are differential-diagnosis prose about the
  infantile hepatic phenotype, not causal-gene assignments, and were checked before this entry was
  written.

  One reference is deliberately absent. PMID:29228108 (Caporali et al., Brain 2018) is the
  DGUOK-parkinsonism report and is the source the Orphanet-derived MONDO definition's mention of
  parkinsonism traces to. It is a Letter to the Editor and neither its PubMed record nor its DOI
  returned any retrievable text, so no exact quote could be taken from it and it is not cited. The
  Parkinsonism phenotype is therefore supported only by class-level evidence, and its `notes` say
  so and name the missing source.

  What the full text has that this entry does not. The falcon deep-research report committed
  alongside this entry passed preflight (DGUOK mentioned 76 times, dominating its gene counts) and
  read the defining paper's full text, which this entry could not. It reports content that is
  genuinely published and simply unquotable here: seven named DGUOK alleles in the adult cohort
  (c.186C>A p.Tyr62Ter, c.605_606delGA p.Arg202TyrfsTer12, c.130G>A p.Glu44Lys, c.137A>G
  p.Asn46Ser, c.462T>A p.Asn154Lys, c.509A>G p.Gln170Arg and the splice allele c.444-11C>G),
  ragged-red and COX-negative fibres with severe COX deficiency on muscle histology, myopathic EMG,
  and creatine kinase ranging from mildly raised to around 2,000 U/L. A curator with journal access
  should add those as evidence items; they are named here rather than paraphrased into the entry
  because none of them can be verified against a cached reference. Note in particular that this
  changes the reading of two hedges above: the entry says muscle histology and enzymology are not
  reported "in the sources cited here", which is accurate, but they are not unpublished.

  What is not here at all. The defining 2012 paper was retrievable as an abstract only, so
  per-subject ages, genotypes, muscle histology, respiratory-chain enzymology and deletion burdens
  are absent from this entry rather than estimated. No dataset accession is recorded, because no PEOB4
  patient omics deposit was identified. No prevalence rate exists - the 5.6 percent figure is a
  diagnostic yield in an enriched cohort and is recorded as such, with the `population` field
  naming that cohort rather than "Worldwide". The only animal model addresses the depletion arm of
  the phenotype rather than this one, which is stated in its `limitations` rather than left for a
  reader to notice.

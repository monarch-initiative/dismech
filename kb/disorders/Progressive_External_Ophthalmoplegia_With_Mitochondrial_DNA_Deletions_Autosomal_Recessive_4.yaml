inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Recessive in all reported subjects. The 2012 series identified autosomal recessive DGUOK
    mutations in five independent adults, and ClinGen's expert panel independently classifies the
    DGUOK gene-disease relationship as autosomal recessive. DGUOK is nuclear-encoded and
    autosomal, so although the disease is expressed as mitochondrial DNA damage it segregates as
    an ordinary recessive trait, with a 25 percent sibling recurrence risk and no maternal
    transmission - which is the point that separates it from the primary mtDNA-deletion
    syndromes it phenocopies.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23043144
    reference_title: "Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified autosomal recessive mutations in the DGUOK gene (encoding mitochondrial deoxyguanosine kinase), which has previously been associated with an infantile hepatocerebral form of mitochondrial DNA depletion."
    explanation: >-
      The inheritance mode as reported, together with the prior association that makes this
      presentation the other end of an allelic series.
  - reference: CGGV:assertion_dd4c3ef2-6738-4770-ad64-4db31672ca9a-2024-02-22T170000.000Z

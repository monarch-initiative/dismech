  biological_scale: TISSUE
  description: >-
    Extraocular muscle has the highest mitochondrial content and the highest continuous duty cycle
    of any striated muscle, and it is the tissue that fails first and most visibly across the
    multiple-mtDNA-deletion syndromes - which is why so many of them are named for progressive
    external ophthalmoplegia. In this entity the ophthalmoplegia is characteristic but not
    universal: the defining series describes mitochondrial myopathy *with or without* PEO.

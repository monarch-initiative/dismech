name: Progressive External Ophthalmoplegia with Mitochondrial DNA Deletions, Autosomal Recessive 4
category: Mendelian
creation_date: "2026-09-09T00:00:00Z"
synonyms:
- PEOB4
- progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive type 4
- progressive external ophthalmoplegia, autosomal recessive 4
- adult-onset multiple mitochondrial DNA deletion syndrome due to DGUOK deficiency
- adult-onset multiple mtDNA deletion syndrome due to DGUOK deficiency
- DGUOK-related adult-onset mitochondrial myopathy
disease_term:
  preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 4
  term:
    id: MONDO:0014899
    label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal recessive 4
description: >-
  PEOB4 is the adult-onset, muscle-predominant end of the DGUOK allelic spectrum: biallelic
  variants in DGUOK presenting in adulthood as a mitochondrial myopathy, with or without
  progressive external ophthalmoplegia, and with multiple large-scale mitochondrial DNA
  deletions in skeletal muscle.

  The gene had been known since 2001 for something almost opposite. DGUOK classically causes a
  hepatocerebral mitochondrial DNA *depletion* syndrome of the neonatal period - liver failure
  with neurological deterioration, usually fatal in infancy. PEOB4 was defined in 2012, when a
  MitoExome screen of adults with mitochondrial myopathy and multiple mtDNA deletions in muscle
  found recessive DGUOK mutations in five independent subjects, 5.6 percent of that cohort. The
  same enzyme deficiency therefore produces mtDNA depletion in infant liver and mtDNA deletions
  in adult muscle, and one patient in the 2012 series makes the continuity explicit: she had a
  liver transplant at nine months of age and presented decades later with recurrent
  rhabdomyolysis.

  The mechanism is nucleotide supply. Deoxyguanosine kinase phosphorylates purine
  deoxyribonucleosides inside the mitochondrial matrix and is the rate-limiting step of the
  mitochondrial purine salvage pathway - the route by which post-mitotic cells, which cannot use
  the cytosolic replication-coupled route, obtain dNTPs for mtDNA synthesis. Losing it leaves an
  imbalanced matrix dNTP pool, and mtDNA replication that is both slowed and error-prone. Which
  failure mode dominates appears to depend on tissue and on age: an imbalanced pool in a rapidly
  growing infant liver gives depletion, while decades of stalled and mispaired replication in
  post-mitotic muscle give clonally expanded large-scale deletions. That reading is a synthesis
  of the two phenotypes rather than a demonstrated switch, and the entry marks it as such.

  Clinically the 2012 series was heterogeneous: mitochondrial myopathy with or without PEO,
  recurrent rhabdomyolysis, and adult-onset lower motor neuron syndrome with mild cognitive
  impairment. Muscle DGUOK activity and DGUOK protein stability were both impaired. There is no
  disease-modifying treatment; nucleoside supplementation is a mechanistically motivated idea
  tested only in cells and in a dguok-null zebrafish, where the result depended on which
  nucleosides were given.

      not appear to apply.
- name: Loss of TNF-alpha Intracellular Domain Signalling to IL-12
  biological_scale: MOLECULAR
  description: >-
    A second and mechanistically separate consequence of losing the protease.
    SPPL2a catalyses intramembrane cleavage of TNF-alpha, releasing its
    intracellular domain, and that released domain triggers IL-12 expression in
    activated human dendritic cells. Losing it therefore lowers IL-12 output
    from dendritic cells that are still alive, by a route entirely independent
    of the CD74 fragment and of cDC2 depletion.

    Two caveats are load-bearing and are the reason this node is graded
    provisional. The source characterises SPPL2a and SPPL2b jointly and does not
    isolate the contribution of SPPL2a alone, so the attribution to SPPL2A
    specifically is an inference. And the work is in human dendritic cells in
    vitro, not in patient cells - no SPPL2A-deficient patient has been shown to
    have a TNF-alpha-ICD defect.
  genes:
  - preferred_term: SPPL2A
    term:
      id: hgnc:30227
      label: SPPL2A
  cell_types:
  - preferred_term: conventional dendritic cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:16829952
    reference_title: SPPL2a and SPPL2b promote intramembrane proteolysis of TNFalpha in activated dendritic cells to trigger IL-12 production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SPPL2a and SPPL2b, which are sorted to endosomes and the plasma membrane, respectively, are functional proteases that catalyse intramembrane cleavage of tumour necrosis factor alpha (TNFalpha)"
    explanation: >-
      Establishes TNF-alpha as a second SPPL2a substrate, and shows the two
      proteases are characterised jointly - which is why this node's attribution
      to SPPL2a alone is graded provisional.
  - reference: PMID:16829952
    reference_title: SPPL2a and SPPL2b promote intramembrane proteolysis of TNFalpha in activated dendritic cells to trigger IL-12 production.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two proteases promoted the release of the TNFalpha intracellular domain, which in turn triggers expression of the pro-inflammatory cytokine interleukin-12 by activated human dendritic cells."
    explanation: >-
      The route from the protease to IL-12 output in human dendritic cells. This
      is the observation that keeps the entry from claiming SPPL2A has no
      connection to the IL-12 circuit.
  downstream:
  - target: Shifted Dendritic Cell Cytokine Balance
    causal_link_type: DIRECT
    description: >-
      Reduced IL-12 from surviving dendritic cells contributes to their altered
      cytokine output independently of how many of them remain.
- name: Depletion of CD1c-Positive Conventional Dendritic Cells
  biological_scale: CELLULAR
  description: >-
    The accumulated CD74 NTF selectively depletes the CD1c-positive
    conventional dendritic cells (cDC2) that produce IL-12 and IL-23, along with
    their circulating progenitors. Selectivity is the striking feature: a
    fragment that accumulates in all MHC class II-positive cells kills one
    subset preferentially.

    That the depletion is caused by the substrate rather than by loss of the
    protease was shown by epistasis in mice - cDC2 depletion in Sppl2a-knockout
    animals is abolished when CD74 is also deleted. Removing the substrate
    rescues the cell type, which is the cleanest available demonstration that the
    fragment, not the missing enzyme, is the toxic agent.
  cell_types:
  - preferred_term: CD1c-positive conventional dendritic cell (cDC2)
    term:
      id: CL:0002399
      label: CD1c-positive myeloid dendritic cell
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30127434
    reference_title: Disruption of an antimycobacterial circuit between dendritic and helper T cells in human SPPL2a deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This toxic fragment selectively depletes IL-12- and IL-23-producing CD1c+ conventional dendritic cells (cDC2s) and their circulating progenitors."
    explanation: >-
      The central mechanistic claim of the disease, and the wording that
      justifies treating the fragment as the toxic agent.
  - reference: PMID:33239420
    reference_title: Deficiency of the Intramembrane Protease SPPL2a Alters Antimycobacterial Cytokine Responses of Dendritic Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we confirm depletion of conventional DC2 in lymphatic tissues of SPPL2a-/- mice and demonstrate dependence on CD74 using SPPL2a-/- CD74-/- mice"
    explanation: >-
      The epistasis control. Deleting the substrate rescues the phenotype, which
      establishes causation by fragment accumulation rather than by protease loss.
  downstream:
  - target: Failure of IFN-gamma Production by Mycobacterium-Specific Memory T Cells
    causal_link_type: DIRECT
    description: >-
      Loss of the IL-12/IL-23-producing dendritic cell removes the signal that
      licenses mycobacterium-specific T cells to make IFN-gamma.
  - target: Shifted Dendritic Cell Cytokine Balance
    causal_link_type: DIRECT
    description: >-
      A second, functional consequence in the dendritic cells that remain,
      distinct from their reduced number.
- name: Failure of IFN-gamma Production by Mycobacterium-Specific Memory T Cells
  biological_scale: CELLULAR
  description: >-
    SPPL2a-deficient memory TH1* cells selectively fail to produce IFN-gamma
    when stimulated with mycobacterial antigens in vitro. The word that carries
    the mechanism is "selectively": the defect is antigen-specific rather than a
    general inability of the T cells to make IFN-gamma, which is what a primary
    T-cell lesion would look like. This node is the point at which the disease
    converges on the classical MSMD phenotype, having arrived there without a
    mutation anywhere in the IFN-gamma circuit.
  cell_types:
  - preferred_term: memory T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  biological_processes:
  - preferred_term: type II interferon production
    modifier: DECREASED
    term:
      id: GO:0032609
      label: type II interferon production
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30127434
    reference_title: Disruption of an antimycobacterial circuit between dendritic and helper T cells in human SPPL2a deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPPL2a-deficient memory TH1* cells selectively fail to produce IFN-γ when stimulated with mycobacterial antigens in vitro."
    explanation: >-
      The T-cell functional defect and its antigen selectivity, measured in
      patient cells.
  downstream:
  - target: Mycobacterial Disease
    causal_link_type: DIRECT
    description: >-
      Loss of antigen-specific IFN-gamma is the effector deficit that permits
      mycobacterial growth, as in the other MSMD genes.
- name: Shifted Dendritic Cell Cytokine Balance
  biological_scale: CELLULAR
  description: >-
    Beyond their reduced number, the dendritic cells that remain behave
    differently. SPPL2a-deficient bone-marrow-derived dendritic cells exposed to
    mycobacteria secrete more IL-1-beta and less IL-10 and IFN-beta, a shift from
    anti- to pro-inflammatory output, and this tracks with altered signalling
    through TLR4 and Dectin-1, with Dectin-1 redistributed to endosomal
    compartments.

    Graded provisional: the work is entirely in mouse cells, and the proposal
    that this functional change contributes to disease alongside the cell loss
    is the authors' own and has not been tested in patients.
  cell_types:
  - preferred_term: conventional dendritic cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33239420
    reference_title: Deficiency of the Intramembrane Protease SPPL2a Alters Antimycobacterial Cytokine Responses of Dendritic Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Upon contact with mycobacteria, SPPL2a-/- bone marrow-derived DCs show enhanced secretion of IL-1β, whereas production of IL-10 and IFN-β is reduced."
    explanation: The measured cytokine shift in mycobacteria-exposed dendritic cells.
  - reference: PMID:33239420
    reference_title: Deficiency of the Intramembrane Protease SPPL2a Alters Antimycobacterial Cytokine Responses of Dendritic Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that in addition to the DC reduction, this altered DC functionality contributes to Mendelian susceptibility to mycobacterial disease upon SPPL2a deficiency."
    explanation: >-
      The authors' proposal, quoted as a proposal. It is the reason this node
      exists and the reason it is graded provisional.
  downstream:
  - target: Mycobacterial Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A proposed additional contribution to susceptibility, not an established
      one.
- name: Impaired Immunoglobulin Production
  biological_scale: ORGANISM
  description: >-
    Hypogammaglobulinaemia was reported in the fourth patient, notably with
    normal B-cell counts. That combination - low immunoglobulin with preserved
    B-cell numbers - is the opposite shape to the mouse, which lacks mature
    B-cell subsets outright, and it is the reason the human B-cell arm of this
    disease should not be described from the murine literature.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39586751
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease with Signal Peptide Peptidase-like 2A (SPPL2A) Deficiency: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had hypogammaglobulinemia, normal B-cell counts, normal CD4 counts, low CD8 counts, and SPPL2A deficiency"
    explanation: >-
      The single human observation of the B-cell compartment, including the
      normal B-cell count that distinguishes it from the murine phenotype.
- name: Mycobacterial Disease
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: disease caused by weakly virulent mycobacteria,
    principally BCG after vaccination. This is the MSMD phenotype, reached
    through dendritic-cell loss rather than through a lesion in the IFN-gamma
    circuit itself.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30127434
    reference_title: Disruption of an antimycobacterial circuit between dendritic and helper T cells in human SPPL2a deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that inherited SPPL2a deficiency in humans underlies mycobacterial disease by decreasing the numbers of cDC2s and impairing IFN-γ production by mycobacterium-specific memory TH1* cells."
    explanation: The authors' summary of the full causal chain from gene to clinical phenotype.
genetic:
- name: SPPL2A
  gene_term:
    preferred_term: SPPL2A
    term:
      id: hgnc:30227
      label: SPPL2A
  relationship_type: CAUSATIVE
  notes: >-
    SPPL2A encodes an aspartyl intramembrane protease of lysosomes and late
    endosomes. CD74 was the first substrate validated in vivo, and remains the
    one through which the disease mechanism runs.

    A homozygous microdeletion on chromosome 15 disrupting the SPPL2A locus was
    characterised in human B-cell lines before any MSMD patient was reported.
    Those lines established that human cells lacking SPPL2a accumulate the CD74
    NTF - the molecular phenotype - without yet connecting it to a clinical
    disease. The 2018 patients supplied that connection.
  evidence:
  - reference: PMID:30127434
    reference_title: Disruption of an antimycobacterial circuit between dendritic and helper T cells in human SPPL2a deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe patients with Mycobacterium bovis (BCG) disease who are homozygous for loss-of-function mutations of SPPL2A."
    explanation: The causal genotype-phenotype association in the founding patients.
  - reference: PMID:25035924
    reference_title: Signal-peptide-peptidase-like 2a is required for CD74 intramembrane proteolysis in human B cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that this deletion disrupts the SPPL2A genomic locus and leads to loss of SPPL2a transcript."
    explanation: An independent human loss-of-function allele class, characterised in cell lines.

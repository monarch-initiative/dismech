discussions:
- discussion_id: sppl2a_murine_b_cell_phenotype
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The Sppl2a-null mouse lacks mature B-cell subsets and phenocopies BAFF
    deficiency. The one human patient with reported B-cell numbers had
    hypogammaglobulinaemia with normal B-cell counts. Does the murine B-cell
    phenotype model the human disease at all?
  attaches_to:
  - pathophysiology#Impaired Immunoglobulin Production
  - animal_models#Sppl2a-knockout mouse
  rationale: >-
    This mismatch is unusually well localised, which is what makes it worth
    recording rather than merely noting. The molecular step is demonstrably
    conserved: human B-cell lines lacking SPPL2a accumulate the CD74 NTF
    comparably to mouse B cells. So the species divergence is not in the
    biochemistry of the lesion but in what the B lineage does about it.

    The stakes are practical. SPPL2a inhibition has been proposed as a way to
    target B cells therapeutically in autoimmunity, and that proposal rests on
    the murine B-cell phenotype. If human B cells tolerate CD74 NTF accumulation
    without being depleted, the therapeutic rationale weakens even though the
    target engagement is real.

    The human side of the comparison is one patient. That is thin, and the entry
    says so rather than treating the divergence as settled.
  proposed_experiments:
  - experiment_id: exp_sppl2a_human_b_cell_immunophenotyping
    name: Systematic B-cell immunophenotyping across reported SPPL2A patients
    description: >-
      Assess transitional, naive, and memory B-cell subsets and serum
      immunoglobulin levels in all reported SPPL2A-deficient patients using a
      common panel, rather than relying on total B-cell counts from a single
      case, and compare directly against the murine subset distribution.
    would_support:
    - pathophysiology#Impaired Immunoglobulin Production
    supporting_outcome:
    - >-
      Human patients show preserved mature B-cell subsets with impaired
      immunoglobulin secretion, confirming a functional rather than numerical
      humoral defect and a genuine divergence from the mouse.
    refuting_outcome:
    - >-
      Human patients are found to have selective loss of mature B-cell subsets
      once the compartment is examined properly, indicating that the single
      normal total B-cell count was misleading and the mouse models the human
      B-cell phenotype after all.
- discussion_id: sppl2a_dc_loss_versus_dc_dysfunction
  kind: OPEN_QUESTION
  prompt: >-
    Is mycobacterial susceptibility in SPPL2A deficiency caused by the loss of
    cDC2s, by altered function of the dendritic cells that remain, or by both?
  attaches_to:
  - pathophysiology#Depletion of CD1c-Positive Conventional Dendritic Cells
  - pathophysiology#Shifted Dendritic Cell Cytokine Balance
  - pathophysiology#Loss of TNF-alpha Intracellular Domain Signalling to IL-12
  rationale: >-
    The founding paper attributes the disease to reduced cDC2 numbers and the
    consequent IFN-gamma failure. A later murine study found that SPPL2a-null
    dendritic cells also behave abnormally when they meet mycobacteria -
    secreting more IL-1-beta and less IL-10 and IFN-beta, with Dectin-1
    redistributed to endosomes - and proposed this as an additional contribution.

    There is a third possibility that predates both, and it is the one with
    human data behind it. SPPL2a cleaves TNF-alpha to release an intracellular
    domain that triggers IL-12 expression in activated human dendritic cells.
    That is a direct, cell-intrinsic route from the protease to the cytokine
    whose absence defines the MSMD phenotype, and it requires no cell to die and
    no CD74 fragment to accumulate. Its caveats are real - the 2006 work treats
    SPPL2a and SPPL2b jointly and was done in vitro, never in patient cells -
    but it is human, which the murine functional data are not.

    The three are not alternatives, and the question is one of weight. It
    matters for any future attempt to treat the disease by restoring the
    dendritic-cell compartment: if the surviving cells are also functionally
    impaired, and impaired by a route that transplanting or expanding cDC2s
    would not correct, restoring numbers alone would not restore the
    antimycobacterial circuit.
  proposed_experiments:
  - experiment_id: exp_sppl2a_patient_dc_function
    name: Function-per-cell assessment of patient dendritic cells
    description: >-
      Measure IL-12, IL-23, IL-1-beta, IL-10 and IFN-beta output per cell from
      the residual CD1c-positive dendritic cells of SPPL2A-deficient patients
      after mycobacterial stimulation, normalising to cell number so that
      functional impairment can be separated from depletion. Assay TNF-alpha
      intracellular-domain release in the same cells, so that a per-cell IL-12
      deficit can be attributed to the TNF-alpha route or to the murine
      pattern-recognition-receptor route rather than left ambiguous between them.
    would_support:
    - pathophysiology#Shifted Dendritic Cell Cytokine Balance
    supporting_outcome:
    - >-
      Residual patient cDC2s show the same anti- to pro-inflammatory shift seen
      in the mouse on a per-cell basis, supporting a dual mechanism and promoting
      that node from provisional.
    refuting_outcome:
    - >-
      Residual patient cDC2s show normal per-cell cytokine output, indicating
      that depletion alone accounts for the human disease and that the murine
      functional finding does not transfer.


name: Immunodeficiency 86
creation_date: "2026-08-30T03:05:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 86
  term:
    id: MONDO:0030448
    label: immunodeficiency 86
description: >-
  An autosomal recessive Mendelian susceptibility to mycobacterial disease
  (MSMD) caused by biallelic loss of SPPL2A, the lysosomal aspartyl
  intramembrane protease that performs the final proteolytic step in turnover of
  the MHC class II invariant chain CD74.

  The disease is mechanistically unusual among the inborn errors of immunity,
  and the shape of the mechanism is the reason to curate it carefully. Most MSMD
  genes encode components of the IFN-gamma / IL-12 / IL-23 signalling circuit
  itself - a receptor, a chain, a transcription factor - and the disease follows
  from losing that signal. SPPL2A is not one of those components. What
  accumulates instead is an uncleaved substrate: the membrane-bound N-terminal
  fragment of CD74 builds up in MHC class II-positive cells and is toxic to one
  of them in particular, selectively depleting the CD1c-positive conventional
  dendritic cells that supply IL-12 and IL-23. The IFN-gamma failure is
  downstream and secondary - the T cells are starved of the signal rather than
  unable to receive it.

  The distinction is real but not absolute, and the entry says so rather than
  overstating it. SPPL2a has a second, separate connection to the same circuit:
  it cleaves TNF-alpha to release its intracellular domain, which triggers IL-12
  expression in activated human dendritic cells. That is a cell-intrinsic route
  from SPPL2A loss to reduced IL-12 which needs no dendritic cell to die, and it
  is curated as its own node.

  So this is a gain-of-toxic-substrate disease presenting as a signalling
  deficiency, and the entry's pathophysiology is written to make that ordering
  explicit rather than to place SPPL2A alongside the IL12RB1-type lesions it
  phenocopies.
synonyms:
- IMD86
- SPPL2A deficiency
- Mendelian susceptibility to mycobacterial disease due to SPPL2A deficiency
parents:
- primary immunodeficiency disease
notes: >-
  Scope and relationship to MSMD. This entry is kept as its own Disease rather
  than folded into a Mendelian-susceptibility-to-mycobacterial-disease grouping,
  because the mechanism is not a variant of the IFN-gamma circuit defect that
  the grouping is built around - it reaches the same clinical endpoint mainly by
  a different route, through loss of a cell type rather than loss of a signal.
  That said, SPPL2a does have one direct link into the IL-12 arm of the circuit,
  through TNF-alpha intracellular-domain release, so the separation is a matter
  of the dominant mechanism rather than of no overlap at all. The clinical
  phenotype is MSMD either way, and the entry says so.

  The disease is very rare: three patients had been reported when the fourth was
  published in 2024. Every frequency statement in this entry is therefore a
  count, not a rate, and single-patient findings are labelled as such.

  A caution for curators extending this entry from the mouse literature. The
  Sppl2a-knockout mouse has a striking B-cell phenotype - it lacks mature B-cell
  subsets and phenocopies BAFF deficiency - and it is tempting to import that as
  the human B-cell phenotype. The one human patient with reported B-cell numbers
  had hypogammaglobulinaemia with NORMAL B-cell counts. The molecular lesion is
  conserved between species; the cellular consequence in the B lineage appears
  not to be. See the HUMAN_MODEL_MISMATCH discussion.

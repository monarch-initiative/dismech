animal_models:
- name: Sppl2a-knockout mouse
  species: Mouse
  genotype: Sppl2a-/-
  publication: PMID:30127434
  description: >-
    The mouse null, used in the founding human paper to close the loop between
    the cellular defect and mycobacterial susceptibility in vivo.
  modeled_mechanisms:
  - target: Mycobacterial Disease
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Sppl2a-null mice lack cDC2s, have CD4+ T cells that produce little
      IFN-gamma after BCG infection, and are highly susceptible to BCG and to
      M. tuberculosis - the same three-step chain demonstrated in the patients,
      in the same order.
    limitations: >-
      The mouse additionally has a profound B-cell phenotype that the human
      disease does not appear to share, so the model over-predicts the humoral
      consequences of SPPL2a loss even while it reproduces the mycobacterial
      ones.
    readouts:
    - name: Susceptibility to BCG and M. tuberculosis infection
      target: Mycobacterial Disease
      direction: INCREASED
      interpretation: In vivo confirmation that the cellular defect is sufficient for mycobacterial susceptibility.

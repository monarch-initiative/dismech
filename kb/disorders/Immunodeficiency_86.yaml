- name: Failure of CD74 N-Terminal Fragment Proteolysis
  biological_scale: MOLECULAR
  description: >-
    CD74 is degraded stepwise in endosomal compartments to let MHC class II
    acquire peptide. The final membrane-bound N-terminal fragment requires
    SPPL2a for its turnover, and the primary cleavage site has been mapped
    within the CD74 transmembrane segment between Y52 and F53. Without SPPL2a
    that last step does not happen.

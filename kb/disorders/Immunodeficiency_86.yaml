- name: Sppl2a/CD74 double-knockout mouse
  species: Mouse
  genotype: SPPL2a-/- CD74-/-
  publication: PMID:33239420
  description: >-
    An epistasis experiment rather than a disease model. Deleting CD74 on the
    Sppl2a-null background removes the substrate whose fragment accumulates, and
    tests whether that fragment is what causes the dendritic-cell loss.
  modeled_mechanisms:
  - target: Depletion of CD1c-Positive Conventional Dendritic Cells
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      cDC2 depletion in Sppl2a-null mice depends on CD74. Removing the substrate
      rescues the cell type, establishing that the toxic agent is the accumulated
      fragment and not the absence of the protease - the single most important
      control behind this entry's framing of the mechanism.
    limitations: >-
      Performed in mice, and on the murine cDC2 equivalent rather than on human
      CD1c-positive cells; no comparable epistasis test is possible in patients.
    readouts:

      snippet: "Sppl2a-/- mice lack cDC2s, have CD4+ T cells that produce small amounts of IFN-γ after BCG infection, and are highly susceptible to infection with BCG or Mycobacterium tuberculosis"
      explanation: Establishes the model as informative for the mycobacterial phenotype.
  - target: Impaired Immunoglobulin Production
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse null has a profound humoral immunodeficiency and lacks mature
      B-cell subsets, phenocopying BAFF deficiency. The one human patient with
      reported B-cell numbers had hypogammaglobulinaemia with normal B-cell
      counts. The murine B-cell phenotype is therefore not a model of the human
      one: both are humoral defects, but a numerical loss of mature B cells and a
      functional immunoglobulin deficit with preserved cell numbers are different
      lesions.
    limitations: >-
      The comparison rests on a single human patient's immunophenotype, so the
      divergence is reported rather than established. It is included because the
      alternative - describing the human B-cell compartment from the mouse - is
      the error this entry most wants to prevent. Note also that the molecular
      step upstream IS conserved: human SPPL2a-null B-cell lines accumulate the
      CD74 NTF comparably to mouse B cells, so the divergence appears downstream
      of the substrate accumulation, not at it.

  evidence:
  - reference: PMID:25035924
    reference_title: Signal-peptide-peptidase-like 2a is required for CD74 intramembrane proteolysis in human B cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "intramembrane proteolysis of the final membrane-bound N-terminal fragment (NTF) of CD74 is catalyzed by Signal-peptide-peptidase-like 2a (SPPL2a) and that this process is indispensable"
    explanation: Establishes SPPL2a as the enzyme for the terminal step in CD74 turnover.
  - reference: PMID:26987812
    reference_title: Substrate determinants of signal peptide peptidase-like 2a (SPPL2a)-mediated intramembrane proteolysis of the invariant chain CD74.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we report identification of the primary SPPL2a cleavage site between Y52 and F53 within the CD74 transmembrane segment"
    explanation: Localises the cleavage to a specific bond, which is what makes the substrate relationship a molecular rather than a correlative claim.
  downstream:
  - target: CD74 N-Terminal Fragment Accumulation
    causal_link_type: DIRECT
    description: An uncleaved fragment that is not turned over accumulates.
- name: CD74 N-Terminal Fragment Accumulation
  biological_scale: MOLECULAR
  description: >-
    The uncleaved CD74 NTF builds up in the MHC class II-positive myeloid and
    lymphoid cells of SPPL2a-deficient patients. This node is the hinge of the
    whole entry: it is the point at which the disease stops being a loss of
    function and becomes a gain of something toxic. Everything downstream is
    attributed to the presence of this fragment, not to the absence of the
    protease.

    That the accumulation is conserved in humans and not only in mice was shown
    independently in human B-cell lines carrying a homozygous deletion of the
    SPPL2A locus, before any patient with mycobacterial disease had been
    reported.
  genes:

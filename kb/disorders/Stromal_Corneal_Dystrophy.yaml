treatments:
- name: Phototherapeutic Keratectomy
  description: >-
    Excimer-laser ablation of superficial (anterior) stromal deposits to
    improve visual clarity and reduce recurrent erosions. It is the preferred
    approach for anterior deposits and can be repeated, but deposits recur.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: phototherapeutic keratectomy
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: "Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where there is visual reduction, treatment options may include either phototherapeutic keratectomy (PTK) or corneal transplantation."
    explanation: >-
      Establishes phototherapeutic keratectomy and corneal transplantation as
      the two treatment options for visually significant stromal dystrophies.
  - reference: DOI:10.3341/kjo.2023.0032
    reference_title: "Mini-Review: Clinical Features and Management of Granular Corneal Dystrophy Type 2"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phototherapeutic keratectomy removes anterior opacities and is advantageous in terms of its applicability and repeatability."
    explanation: >-
      Supports PTK as a repeatable option for removing anterior stromal
      opacities in a TGFBI-associated stromal dystrophy.
- name: Corneal Transplantation
  description: >-
    Lamellar (deep anterior lamellar keratoplasty) or penetrating keratoplasty
    for deep or diffuse stromal opacification not amenable to phototherapeutic
    keratectomy. Deposits frequently recur in the graft over time, and in
    Schnyder dystrophy the recurrence risk makes phototherapeutic keratectomy
    the preferred option when treatment is required.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Corneal Transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: "Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For lattice, Avellino, granular and macular corneal dystrophies, PTK provides temporary visual improvement; however, with recurrences, repeat PTK or a corneal transplant would be needed."
    explanation: >-
      Documents corneal transplantation as the option for advancing/recurrent
      stromal dystrophy after phototherapeutic keratectomy.
  - reference: PMID:20301741
    reference_title: "Congenital Stromal Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "penetrating or deep anterior lamellar keratoplasty"
    explanation: >-
      GeneReviews lists penetrating and deep anterior lamellar keratoplasty as
      the surgical management for congenital stromal corneal dystrophy.
- name: Supportive Ocular Surface Care
  description: >-
    Lubricants/artificial tears, bandage contact lenses, and topical antibiotics
    manage recurrent corneal erosions and ocular surface symptoms in the earlier
    stages before surgical intervention is required.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Counseling on inheritance is important given the mixed autosomal dominant
    (Schnyder, congenital stromal, TGFBI forms) and autosomal recessive (macular,
    CHST6) transmission across the group.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301741
    reference_title: "Congenital Stromal Corneal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an affected individual has a 50% chance of inheriting the pathogenic variant"
    explanation: >-
      GeneReviews states the 50% autosomal dominant recurrence risk that genetic
      counseling communicates for the dominant stromal dystrophies.

name: Stromal Corneal Dystrophy
creation_date: "2026-08-14T00:00:00Z"
description: >-
  Stromal corneal dystrophy is the group of inherited, bilateral,
  non-inflammatory corneal dystrophies in which abnormal material is
  progressively deposited within the corneal stroma (substantia propria),
  reducing corneal transparency and causing slowly progressive visual
  impairment. The group is defined by the anatomical compartment affected
  (the stroma) rather than by a single gene: distinct genes, deposited
  substances, and modes of inheritance underlie the individual forms. The
  principal forms are macular corneal dystrophy (CHST6, autosomal recessive;
  deposition of abnormally sulfated keratan sulfate), Schnyder corneal
  dystrophy (UBIAD1, autosomal dominant; corneal cholesterol and phospholipid
  accumulation), congenital stromal corneal dystrophy (DCN/decorin, autosomal
  dominant; disorganized collagen fibrils present at birth), and the
  TGFBI-associated epithelial-stromal dystrophies (granular type 1, granular
  type 2 / Avellino, and lattice type 1; autosomal dominant; deposition of
  mutant transforming growth factor beta-induced protein). Regardless of the
  deposited material, the shared final common pathway is loss of stromal
  transparency; management is limited to symptomatic and surgical options
  (phototherapeutic keratectomy and keratoplasty), both of which are prone to
  recurrence of deposits.
category: Genetic
parents:
- Corneal Dystrophy
- Ophthalmological Disease
disease_term:
  preferred_term: stromal corneal dystrophy
  term:
    id: MONDO:0020213
    label: stromal corneal dystrophy
has_subtypes:
- name: MCD
  display_name: Macular Corneal Dystrophy
  description: >-
    Autosomal recessive stromal dystrophy caused by biallelic mutations in
    CHST6 (carbohydrate sulfotransferase 6) on chromosome 16q22, encoding
    corneal N-acetylglucosamine-6-O-sulfotransferase. Loss of enzyme activity
    prevents normal sulfation of corneal keratan sulfate, so poorly sulfated
    or unsulfated keratan sulfate accumulates in keratocytes and the stromal
    extracellular matrix. Presents in the first decade with a diffuse stromal
    haze and grayish-white opacities extending to the limbus and to Descemet
    membrane, progressing to bilateral visual loss. Subtypes I and II are
    distinguished by absence versus presence of sulfated keratan sulfate in
    serum but are clinically indistinguishable. It is the only common stromal
    corneal dystrophy inherited recessively.
  subtype_term:
    preferred_term: macular corneal dystrophy
    term:
      id: MONDO:0009020
      label: macular corneal dystrophy
  genes:
  - preferred_term: CHST6
    term:
      id: hgnc:6938
      label: CHST6
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
- name: SCCD
  display_name: Schnyder Corneal Dystrophy
  description: >-
    Autosomal dominant stromal dystrophy caused by mutations in UBIAD1 (UbiA
    prenyltransferase domain-containing 1) on chromosome 1p36, characterized by
    progressive corneal accumulation of cholesterol and phospholipids. Mutant
    UBIAD1 is sequestered on and inhibits sterol-accelerated ER-associated
    degradation of HMG-CoA reductase, dysregulating local cholesterol
    metabolism. Clinically shows corneal crystalline deposits (in about half of
    patients), a central corneal haze, and an arcus lipoides; visual acuity
    declines with age and many patients have systemic hypercholesterolemia.
    Formerly called Schnyder crystalline corneal dystrophy, though crystals are
    not always present.
  subtype_term:
    preferred_term: Schnyder corneal dystrophy
    term:
      id: MONDO:0007374
      label: Schnyder corneal dystrophy
  genes:
  - preferred_term: UBIAD1
    term:
      id: hgnc:30791
      label: UBIAD1
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
- name: CSCD
  display_name: Congenital Stromal Corneal Dystrophy
  description: >-
    Rare autosomal dominant stromal dystrophy caused by heterozygous
    frameshift/truncating mutations in DCN (decorin) on chromosome 12q21.
    Decorin is a small leucine-rich proteoglycan that regulates the diameter
    and regular spacing of stromal collagen fibrils; the truncated protein acts
    in a dominant-negative manner, disorganizing collagen fibril architecture.
    Presents at or shortly after birth with diffuse bilateral corneal clouding
    and flake-like whitish stromal opacities that increase with age, without
    systemic features. GeneReviews (NBK2690) provides expert clinical guidance
    for this form.
  subtype_term:
    preferred_term: congenital stromal corneal dystrophy
    term:
      id: MONDO:0012401
      label: congenital stromal corneal dystrophy
  genes:
  - preferred_term: DCN
    term:
      id: hgnc:2705
      label: DCN
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance

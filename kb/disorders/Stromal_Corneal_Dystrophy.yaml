inheritance:
- name: Autosomal Dominant
  description: >-
    Schnyder, congenital stromal, and the TGFBI-associated (granular and
    lattice) stromal dystrophies are inherited in an autosomal dominant pattern.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
- name: Autosomal Recessive
  description: >-
    Macular corneal dystrophy (CHST6) is inherited in an autosomal recessive
    pattern, distinguishing it from the other stromal dystrophies.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    The individual stromal corneal dystrophies are each rare; macular corneal
    dystrophy is comparatively more common in some populations (e.g., parts of
    India, Saudi Arabia, and Iceland) owing to founder effects and consanguinity,
    while congenital stromal corneal dystrophy has been reported in only a
    handful of families worldwide.
pathophysiology:
- name: Inherited Abnormal Stromal Deposition
  biological_scale: TISSUE
  description: >-
    The unifying lesion of the group is inherited, non-inflammatory deposition
    of abnormal material within the corneal stroma. The deposited substance
    differs by form: abnormally sulfated keratan sulfate (macular, CHST6),
    cholesterol and phospholipid (Schnyder, UBIAD1), disorganized collagen
    fibrils from defective decorin (congenital stromal, DCN), or mutant
    TGFBI protein (granular and lattice). In each case the accumulating
    material progressively disrupts the ordered stromal collagen lattice that
    is required for corneal transparency.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification and Visual Impairment
    description: >-
      Accumulation of abnormal stromal material progressively scatters light
      and reduces corneal transparency.
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: "Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal dystrophies are a group of non-inflammatory inherited disorders of the cornea."
    explanation: >-
      Establishes the defining feature of the group: inherited, non-inflammatory
      corneal disorders, of which the stromal dystrophies are the stroma-affecting
      subset.
- name: CHST6 Keratan Sulfate Undersulfation
  biological_scale: MOLECULAR
  description: >-
    In macular corneal dystrophy, loss-of-function mutations in CHST6 abolish
    corneal N-acetylglucosamine-6-O-sulfotransferase activity. Keratan sulfate,
    a major corneal glycosaminoglycan whose sulfation confers water solubility,
    is left poorly sulfated or unsulfated; the resulting less-soluble
    proteoglycan accumulates within keratocytes and the stromal matrix,
    disrupting fibril organization and corneal hydration and producing
    progressive opacification.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification and Visual Impairment
    description: >-
      Accumulation of unsulfated keratan sulfate reduces stromal transparency.
  notes: >-
    Primary literature for the CHST6 mechanism (not cited as evidence here
    because the abstracts could not be fetched/verified in the offline curation
    environment): PMID:10655551 (original CHST6 identification), and reviews of
    the >180 reported CHST6 variants.
- name: UBIAD1 Corneal Cholesterol Accumulation
  biological_scale: MOLECULAR
  description: >-
    In Schnyder corneal dystrophy, mutant UBIAD1 remains bound to HMG-CoA
    reductase and blocks its sterol-accelerated ER-associated degradation, so
    reductase accumulates and local cholesterol synthesis is dysregulated. The
    excess cholesterol and phospholipid are deposited in the corneal stroma
    (often as crystals), reducing transparency; many patients also have systemic
    hypercholesterolemia.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Sterol metabolic process
    term:
      id: GO:0016125
      label: sterol metabolic process
    modifier: INCREASED
  locations:
  - preferred_term: Cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Progressive Stromal Opacification and Visual Impairment
    description: >-
      Corneal cholesterol/phospholipid deposition reduces stromal transparency.
  notes: >-
    Mechanistic primary literature (not cited as evidence for the offline reason
    noted above): PMID:17334357 (UBIAD1 identified as causal for Schnyder
    corneal dystrophy) and studies of UBIAD1 regulation of HMG-CoA reductase ERAD.
- name: Decorin Deficiency and Collagen Disorganization
  biological_scale: MOLECULAR
  description: >-
    In congenital stromal corneal dystrophy, heterozygous truncating DCN
    mutations yield a dominant-negative decorin. Decorin normally regulates the
    diameter and uniform spacing of stromal collagen fibrils; the abnormal
    protein accumulates and disorganizes the collagen lattice, so the cornea is
    diffusely cloudy from birth with flake-like stromal opacities.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification and Visual Impairment
    description: >-
      Disorganized collagen fibrils scatter light and reduce corneal clarity.
  notes: >-
    Mechanistic primary literature (not cited as evidence for the offline reason
    noted above): PMID:15671264 (congenital stromal corneal dystrophy caused by a
    decorin mutation) and studies of decorin control of collagen fibrillogenesis.
- name: TGFBI Protein Deposition (Epithelial-Stromal Forms)
  biological_scale: MOLECULAR
  description: >-
    In the granular and lattice (TGFBI-associated) dystrophies, missense
    mutations in TGFBI produce a misfolded transforming growth factor
    beta-induced protein (TGFBIp / keratoepithelin) that accumulates as
    insoluble deposits in the stroma. Deposit morphology is mutation-specific
    (hyaline in granular type 1, amyloid in lattice, mixed in granular type 2 /
    Avellino). This arm is curated in depth in the subtype-level entry
    TGFBI_Corneal_Dystrophies.yaml; it is represented here for completeness of
    the stromal-dystrophy group.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification and Visual Impairment
    description: >-
      Insoluble TGFBIp deposits progressively reduce corneal transparency.
  evidence:
  - reference: DOI:10.3341/kjo.2023.0032
    reference_title: "Mini-Review: Clinical Features and Management of Granular Corneal Dystrophy Type 2"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by well demarcated granular shaped opacities in central anterior stroma"
    explanation: >-
      Localizes TGFBI-associated (granular type 2 / Avellino) deposits to the
      anterior corneal stroma, illustrating the epithelial-stromal deposition arm.
- name: Progressive Stromal Opacification and Visual Impairment
  biological_scale: ORGANISM
  description: >-
    Regardless of the deposited substance, accumulation within the corneal
    stroma scatters incident light and progressively reduces corneal
    transparency, producing bilateral, slowly progressive visual impairment.
    Recurrent corneal erosions, glare, and photophobia may accompany the more
    superficial forms.
  locations:
  - preferred_term: Cornea
    term:
      id: UBERON:0000964
      label: cornea
phenotypes:
- name: Corneal opacity
  category: Ophthalmological
  description: >-
    Bilateral corneal opacification from abnormal stromal deposits is the
    defining clinical finding across the stromal dystrophies.
  phenotype_term:
    preferred_term: Corneal stromal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
    clinical_course: PROGRESSIVE
- name: Reduced visual acuity
  category: Ophthalmological
  description: >-
    Progressive bilateral reduction in visual acuity results from loss of
    corneal transparency; advanced disease often requires keratoplasty.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
- name: Photophobia
  category: Ophthalmological
  description: >-
    Light sensitivity and glare are common, particularly in the more anterior
    (epithelial-stromal) forms and with recurrent epithelial erosions.
  phenotype_term:
    preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
- name: Recurrent corneal erosions
  category: Ophthalmological
  description: >-
    Recurrent breakdown of the corneal epithelium, causing ocular pain, is
    characteristic of the TGFBI-associated forms (notably lattice and granular
    type 2) when deposits are superficial.

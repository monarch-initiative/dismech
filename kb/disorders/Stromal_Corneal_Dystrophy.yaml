    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the clinical examination will often be sufficient to provide a specific corneal dystrophy diagnosis, this also depends on the experience and expertise of the examiner. Genetic testing is an easy way to confirm or refute the phenotypic diagnosis."
    explanation: >-
      IC3D Edition 3 establishes molecular genetic testing to confirm or refine

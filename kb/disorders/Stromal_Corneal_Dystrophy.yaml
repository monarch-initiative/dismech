prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    The individual stromal corneal dystrophies are each rare; macular corneal
    dystrophy is comparatively more common in some populations (e.g., parts of
    India, Saudi Arabia, and Iceland) owing to founder effects and consanguinity,
    while congenital stromal corneal dystrophy has been reported in only a
    handful of families worldwide.
pathophysiology:
- name: Inherited Abnormal Stromal Deposition
  biological_scale: TISSUE
  description: >-
    The unifying lesion of the group is inherited, non-inflammatory deposition
    of abnormal material within the corneal stroma. The deposited substance
    differs by form: abnormally sulfated keratan sulfate (macular, CHST6),
    cholesterol and phospholipid (Schnyder, UBIAD1), disorganized collagen
    fibrils from defective decorin (congenital stromal, DCN), or mutant
    TGFBI protein (granular and lattice). In each case the accumulating
    material progressively disrupts the ordered stromal collagen lattice that
    is required for corneal transparency.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification
    description: >-
      Accumulation of abnormal stromal material progressively scatters light
      and reduces corneal transparency.
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: "Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal dystrophies are a group of non-inflammatory inherited disorders of the cornea."
    explanation: >-
      Establishes the defining feature of the group: inherited, non-inflammatory
      corneal disorders, of which the stromal dystrophies are the stroma-affecting
      subset.
- name: CHST6 Keratan Sulfate Undersulfation
  biological_scale: MOLECULAR
  description: >-
    In macular corneal dystrophy, loss-of-function mutations in CHST6 abolish
    corneal N-acetylglucosamine-6-O-sulfotransferase activity. Keratan sulfate,
    a major corneal glycosaminoglycan whose sulfation confers water solubility,
    is left poorly sulfated or unsulfated; the resulting less-soluble
    proteoglycan accumulates within keratocytes and the stromal matrix,
    disrupting fibril organization and corneal hydration and producing
    progressive opacification.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification
    description: >-
      Accumulation of unsulfated keratan sulfate reduces stromal transparency.
  evidence:
  - reference: PMID:11017086
    reference_title: "Macular corneal dystrophy type I and type II are caused by distinct mutations in a new sulphotransferase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify a new carbohydrate sulphotransferase gene (CHST6), encoding an enzyme designated corneal N-acetylglucosamine-6-sulphotransferase (C-GlcNAc6ST), within the critical region of MCD type I"
    explanation: >-
      Original identification of CHST6 (encoding corneal
      N-acetylglucosamine-6-sulfotransferase) as the gene mutated in macular
      corneal dystrophy, grounding the keratan sulfate undersulfation mechanism.
- name: UBIAD1 Corneal Cholesterol Accumulation
  biological_scale: MOLECULAR
  description: >-
    In Schnyder corneal dystrophy, mutant UBIAD1 remains bound to HMG-CoA
    reductase and blocks its sterol-accelerated ER-associated degradation, so
    reductase accumulates and local cholesterol synthesis is dysregulated. The
    excess cholesterol and phospholipid are deposited in the corneal stroma
    (often as crystals), reducing transparency; many patients also have systemic
    hypercholesterolemia.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Sterol metabolic process
    term:
      id: GO:0016125
      label: sterol metabolic process
    modifier: INCREASED
  locations:
  - preferred_term: Cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Progressive Stromal Opacification
    description: >-
      Corneal cholesterol/phospholipid deposition reduces stromal transparency.
  evidence:
  - reference: PMID:17962451
    reference_title: "Mutations in the UBIAD1 gene on chromosome short arm 1, region 36, cause Schnyder crystalline corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in UBIAD1 was identified in all six families"
    explanation: >-
      Original identification of UBIAD1 as the gene mutated in Schnyder corneal
      dystrophy across six affected families.
  - reference: PMID:17962451
    reference_title: "Mutations in the UBIAD1 gene on chromosome short arm 1, region 36, cause Schnyder crystalline corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal increase in cholesterol and phospholipid deposition in the cornea, leading to progressive corneal opacification"
    explanation: >-
      Establishes the corneal cholesterol and phospholipid deposition that
      characterizes Schnyder corneal dystrophy and drives opacification.
- name: Decorin Deficiency and Collagen Disorganization
  biological_scale: MOLECULAR
  description: >-
    In congenital stromal corneal dystrophy, heterozygous truncating DCN
    mutations yield a dominant-negative decorin. Decorin normally regulates the
    diameter and uniform spacing of stromal collagen fibrils; the abnormal
    protein accumulates and disorganizes the collagen lattice, so the cornea is
    diffusely cloudy from birth with flake-like stromal opacities.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Opacification
    description: >-
      Disorganized collagen fibrils scatter light and reduce corneal clarity.
  evidence:
  - reference: PMID:15671264
    reference_title: "Congenital stromal dystrophy of the cornea caused by a mutation in the decorin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed a frameshift mutation in the DCN gene (c.967delT) that encodes for decorin"
    explanation: >-
      Identifies the DCN (decorin) frameshift mutation causing congenital stromal

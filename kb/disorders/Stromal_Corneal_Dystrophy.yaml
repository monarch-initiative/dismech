histopathology:
- name: Macular corneal dystrophy glycosaminoglycan deposits
  subtype: MCD
  diagnostic: true
  description: >-
    In macular corneal dystrophy, abnormal glycosaminoglycan (keratan sulfate)
    accumulates in keratocytes and stroma and stains positively with
    colloidal iron (Muller Mowry) and Alcian blue, the histochemical
    discriminator from the other stromal dystrophies.
  evidence:
  - reference: PMID:3056354
    reference_title: "Heterogeneity in macular corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All corneas exhibited positive staining with Muller Mowry's colloidal iron"
    explanation: >-
      Colloidal iron positivity marks the glycosaminoglycan deposits diagnostic
      of macular corneal dystrophy.
- name: Granular corneal dystrophy hyaline deposits (Masson trichrome)
  subtype: GCD1
  description: >-
    Granular (TGFBI) dystrophy deposits are hyaline (non-amyloid) and stain red
    with Masson trichrome, distinguishing them from lattice amyloid.
  evidence:

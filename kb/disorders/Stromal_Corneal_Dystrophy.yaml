- name: Schnyder corneal dystrophy lipid deposits
  subtype: SCCD
  description: >-
    Schnyder dystrophy deposits are lipid (cholesterol and phospholipid),
    demonstrable on unfixed/frozen sections by lipid stains such as oil red O;

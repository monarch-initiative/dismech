histopathology:
- name: Macular corneal dystrophy glycosaminoglycan deposits
  subtype: MCD
  diagnostic: true
  description: >-
    In macular corneal dystrophy, abnormal glycosaminoglycan (keratan sulfate)
    accumulates in keratocytes and stroma and stains positively with
    colloidal iron (Muller Mowry) and Alcian blue, the histochemical
    discriminator from the other stromal dystrophies.
  evidence:
  - reference: PMID:3056354
    reference_title: "Heterogeneity in macular corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All corneas exhibited positive staining with Muller Mowry's colloidal iron"
    explanation: >-
      Colloidal iron positivity marks the glycosaminoglycan deposits diagnostic
      of macular corneal dystrophy.
- name: Granular corneal dystrophy hyaline deposits (Masson trichrome)
  subtype: GCD1
  description: >-
    Granular (TGFBI) dystrophy deposits are hyaline (non-amyloid) and stain red
    with Masson trichrome, distinguishing them from lattice amyloid.
  evidence:
  - reference: PMID:20697279
    reference_title: "Granular and lattice deposits in corneal dystrophy caused by R124C mutation of TGFBIp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "granular deposits stained with Masson trichrome and lattice deposits stained with ThT and Congo red showing birefringence and dichroism as expected"
    explanation: >-
      Masson trichrome positivity marks granular/hyaline deposits, distinct from
      Congo-red-positive lattice amyloid.
- name: Lattice corneal dystrophy amyloid deposits (Congo red)
  subtype: LCD1
  finding_term:
    preferred_term: Corneal amyloid deposits
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  description: >-
    Lattice (TGFBI) dystrophy deposits are amyloid and stain with Congo red,
    showing birefringence and dichroism under polarized light.
  evidence:
  - reference: PMID:20697279
    reference_title: "Granular and lattice deposits in corneal dystrophy caused by R124C mutation of TGFBIp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

- name: TGFBI Protein Deposition (Epithelial-Stromal Forms)
  genes:
  - preferred_term: TGFBI
    term:
      id: hgnc:11771
      label: TGFBI
  biological_scale: MOLECULAR
  conforms_to: "amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition"
  description: >-
    In the granular and lattice (TGFBI-associated) dystrophies, missense
    mutations in TGFBI produce a misfolded transforming growth factor
    beta-induced protein (TGFBIp / keratoepithelin) that accumulates as
    insoluble deposits in the stroma. Deposit morphology is mutation-specific
    (hyaline in granular type 1, amyloid in lattice, mixed hyaline and amyloid
    in granular type 2 / Avellino, with the amyloid-forming arm conforming to
    extracellular amyloid fibril deposition). This arm is curated in depth in
    the subtype-level entry TGFBI_Corneal_Dystrophies.yaml; it is represented
    here for completeness of the stromal-dystrophy group.

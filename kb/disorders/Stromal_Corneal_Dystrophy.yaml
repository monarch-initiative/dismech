- name: GCD2
  display_name: Granular Corneal Dystrophy Type 2 (Avellino)
  description: >-
    Autosomal dominant epithelial-stromal (TGFBI) dystrophy with mixed granular
    and lattice (amyloid) deposits, caused by the R124H mutation in TGFBI;
    prevalence is high in East Asia including Korea, and homozygotes have severe
    early-onset disease. Refractive laser surgery (PRK/LASIK/SMILE) dramatically
    accelerates opacification and is contraindicated. Curated in detail in
    TGFBI_Corneal_Dystrophies.yaml.
  subtype_term:

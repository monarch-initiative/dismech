    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of congenital stromal corneal dystrophy is established in an individual with bilateral corneal opacities and characteristic findings on transmission electron microscopy. Identification of a heterozygous pathogenic variant in DCN by molecular genetic testing can confirm the diagnosis."
    explanation: >-

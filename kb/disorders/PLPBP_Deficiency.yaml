      description: Loss of the intron 2 donor site; predicted null.
      type: loss-of-function
    evidence:
    - reference: PMID:31741821
      reference_title: "Diagnostic pitfalls in vitamin B6-dependent epilepsy caused by mutations in the PLPBP gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for the splice‐site variant c.207+1G>A, shows a severe phenotype according to the adapted clinical severity score"
      explanation: Severe disease in a homozygote for the splice variant.
  - name: p.Arg241Gln
    description: >-
      c.722G>A. Cofactor-pocket variant. Arg241 is invariant in all 29 other family sequences and buried (relative accessibility 0.05). In the model its guanidinium is about 3 angstroms from the pyridine ring nitrogen (N1) of PLP, the arginine-to-N1 contact that characterizes fold-type III PLP proteins, and it is hydrogen-bonded to the backbone of Thr182, Ser222 and Met223. Glutamine is predicted to lose that ring contact. This matches experiment: the recombinant protein is purified without PLP and is destabilized, and the allele fails to complement in bacteria. gnomAD v4 allele frequency 3.1e-05. ClinVar: pathogenic/likely pathogenic.
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000374857
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Protein is purified without cofactor; the predicted contact with the PLP ring nitrogen is lost.
      type: loss-of-function
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The p.Arg241Gln and p.Tyr69Cys mutants respectively lacked PLP or had a decreased amount of this cofactor."
      explanation: Recombinant p.Arg241Gln lacks PLP.
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, R241Q and V45D did not bear any cofactor, confirming the role of these residues in PLP binding"
      explanation: Independent mass-spectrometric confirmation that the variant protein carries no cofactor.
  - name: p.Val45Asp
    description: >-
      c.134T>A. Cofactor-pocket variant. Val45 is on strand beta-1 two residues before the Schiff-base lysine, buried (relative accessibility 0.07), conserved in 24 of 29 other family sequences (the rest are isoleucine or alanine) and 3.8 angstroms from PLP in the model. Aspartate is predicted to put a buried negative charge against the pyridine ring. Experimentally the protein is purified without cofactor and in low yield. It is absent from ClinVar.
    type: missense
    variant_type: single nucleotide variant
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Protein is purified without cofactor and is unstable.
      type: loss-of-function
    evidence:
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, R241Q and V45D did not bear any cofactor, confirming the role of these residues in PLP binding"
      explanation: Recombinant p.Val45Asp carries no cofactor.
  - name: p.Glu67Lys
    description: >-
      c.199G>A. Glu67 is invariant in all 29 other family sequences and fully buried (relative accessibility 0.00) at the end of strand beta-2, 6.9 angstroms from PLP. In the model its carboxylate bonds the backbone nitrogen of Lys47, the side chain of Ser46 and Lys76, so it positions the loop that carries the Schiff-base lysine. Lysine reverses the charge in a buried site. Consistent with a folding defect, this was the one variant that could not be produced in E. coli. ClinVar holds conflicting classifications for it.
    type: missense
    variant_type: single nucleotide variant
    identifiers:
    - ClinVar:VCV002159457
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Charge reversal in a buried, invariant residue that positions the Lys47 loop; protein not recoverable from E. coli.
      type: loss-of-function
    evidence:
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Notably, all mutants except E67K could be successfully obtained"
      explanation: >-
        Failure to obtain the recombinant protein is indirect evidence of a
        folding or stability defect; it was not characterized further.
  - name: p.Tyr69Cys
    description: >-
      c.206A>G. Tyr69 follows the PLP-contacting Asn68 and, in the model, is 7.4 angstroms from PLP and surface-exposed (relative accessibility 0.29), unlike the buried pocket variants. The two recombinant studies of this variant disagree. One found extensive disulfide-linked dimerization with reduced PLP content and accessibility. The other found the protein fully saturated with PLP, slightly more thermostable than wild type, and monomeric even without reducing agent, and placed Tyr69 at the dimer interface. Both agree that the protein folds and is stable, so this variant does not act through loss of the protein; how it causes disease is unresolved. It is absent from ClinVar.
    type: missense
    variant_type: single nucleotide variant
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Folded, stable protein. Reported either as a disulfide-linked dimer with reduced cofactor or as a PLP-saturated monomer; the functional defect is not established.
      type: uncertain
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "With p.Tyr69Cys there was extensive protein dimerization due to disulfide bridge formation, and PLP accessibility was decreased (judged from d-cycloserine reaction)."
      explanation: Biochemical characterization of the variant protein.
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "Even under nonreductive conditions the Y69C mutant did not form dimers contrary to previous postulations"
      explanation: A second recombinant study contradicts the disulfide-linked dimerization reported for this variant.
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "The MS analysis of NaBH4-reduced proteins revealed that Y69C and R41Q mutants are fully saturated with PLP after purification"
      explanation: The same study finds the variant protein fully loaded with cofactor, against the reduced PLP content reported earlier.
  - name: p.Leu175Pro
    description: >-
      c.524T>C. Misfolding variant. In the model Leu175 is 18.8 angstroms from PLP, buried (relative accessibility 0.01) in barrel strand beta-6, and it is conserved in 26 of 29 other family sequences. Proline cannot donate the backbone hydrogen bond a beta-strand needs, which is the predicted reason the barrel fails to fold. The recombinant protein is grossly misfolded and none is detected in patient fibroblasts. The ClinVar pathogenic record carries no assertion criteria.
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000374853
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Gross misfolding; fails to complement the E. coli yggS mutant.
      type: loss-of-function
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The p.Leu175Pro mutation grossly misfolded PLPHP."
      explanation: Direct evidence of misfolding.
  - name: p.Pro87Leu
    description: >-
      c.260C>T. Stability variant far from the cofactor: in the model Pro87 is 22 angstroms from PLP in an exposed loop (relative accessibility 0.52) between helix alpha-3 and strand beta-4, and it is not conserved (7 of 29 other family sequences). The purified protein is well folded but solubility and yield are reduced. It is the most common pathogenic missense allele in gnomAD v4 (6.3e-05). ClinVar: pathogenic/likely pathogenic.
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000374856
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Reduced solubility and yield of an otherwise folded protein; hypomorphic.
      type: partial loss-of-function
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations p.Arg241Gln and p.Pro87Leu decreased protein solubility and yield of pure PLPHP, but their pure forms were well folded"
      explanation: Biochemical characterization of the variant protein.
    - reference: PMID:36295057
      reference_title: "The Conserved Family of the Pyridoxal Phosphate-Binding Protein (PLPBP) and Its Cyanobacterial Paradigm PipY."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thus, it is not surprising that despite the lack of conservation, Pro87Leu also results in the loss-of-function of PLPHP."
      explanation: Review confirming that the residue is not conserved and that the variant is nonetheless loss of function.
  - name: p.Arg41Gln
    description: >-
      c.122G>A. Arg41 is on strand beta-1, 10.7 angstroms from PLP, and in
      the model makes a salt bridge to Glu220 and a hydrogen bond to Asn239,
      tying strand beta-1 to strands beta-7 and beta-8 where the barrel
      closes. It is not strictly conserved (lysine in several homologs, so
      the positive charge is the conserved feature). The variant protein is
      fully loaded with PLP but less thermostable, and patients are at the
      mild end of the spectrum. A stability variant with intact cofactor
      binding; p.Arg41Trp at the same residue is also reported.
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: LIKELY_PATHOGENIC
    identifiers:
    - ClinVar:VCV004739088
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Cofactor binding retained; thermal stability reduced. Hypomorphic.
      type: partial loss-of-function
    evidence:
    - reference: PMID:31825581
      reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The MS analysis of NaBH4-reduced proteins revealed that Y69C and R41Q mutants are fully saturated with PLP after purification"
      explanation: Shows the variant protein retains its cofactor.
    - reference: PMID:31741821
      reference_title: "Diagnostic pitfalls in vitamin B6-dependent epilepsy caused by mutations in the PLPBP gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(Arg41Gln) has been described in patients with mild clinical presentations (clinical severity score 2‐3)."
      explanation: Clinical mildness of the genotype.
  - name: p.Pro40Leu
    description: >-
      c.119C>T. Stability variant. In the model Pro40 opens strand beta-1, is buried (relative accessibility 0.03) and 13.8 angstroms from PLP. The purified protein is folded but less thermostable. ClinVar classifies it as of uncertain significance.
    type: missense
    variant_type: single nucleotide variant
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Folded protein of reduced thermal stability.
      type: partial loss-of-function
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PLPHP stability was decreased in p.Arg241Gln, p.Pro40Leu, and p.Arg205Gln mutants (thermofluor assays)."
      explanation: Thermal-shift evidence of reduced stability.
    identifiers:
    - ClinVar:VCV002136655
  - name: p.Arg205Gln
    description: >-
      c.614G>A. Stability variant. Arg205 is on helix alpha-6, 18.4 angstroms from PLP and partly buried (relative accessibility 0.14); a basic residue is present at this position in 12 of 29 other family sequences. The purified protein is folded but less thermostable.
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: LIKELY_PATHOGENIC
    identifiers:
    - ClinVar:VCV002136657
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Folded protein of reduced thermal stability.
      type: partial loss-of-function
    evidence:
    - reference: PMID:29689137
      reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PLPHP stability was decreased in p.Arg241Gln, p.Pro40Leu, and p.Arg205Gln mutants (thermofluor assays)."
      explanation: Thermal-shift evidence of reduced stability.
  - name: p.Val235Gly
    description: >-
      c.704T>G. Val235 is the last residue of the C-terminal
      phosphate-anchoring helix (residues 226-235), 15.6 angstroms from PLP
      and not conserved. Reported with a favorable cognitive outcome and
      interpreted as hypomorphic. It is the most common reported allele in
      gnomAD v4 (2.1e-04, 335 of 1,611,816 alleles, no homozygotes) and
      ClinVar holds conflicting classifications, so its pathogenicity is less
      secure than that of the other alleles listed.
    type: missense
    variant_type: single nucleotide variant
    identifiers:
    - ClinVar:VCV000802398
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Proposed hypomorph; no protein-level assay has been reported.
      type: partial loss-of-function
    evidence:
    - reference: PMID:36324377
      reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "variant had a favorable cognitive outcome with average intelligence and brain imaging, suggesting that the missense variant is hypomorphic."
      explanation: >-
        The hypomorphic reading is the authors' inference from a mild clinical
        course, not a functional measurement.
  - name: p.His92Arg
    description: >-
      c.275A>G. His92 is invariant in all 29 other family sequences and fully buried (relative accessibility 0.00) on strand beta-4, 8.6 angstroms from PLP, two residues before the PLP-contacting Ile94. Found in compound heterozygosity with p.Ala107Thr in a patient whose seizures began at eight months, the latest onset reported. Ala107 is exposed (relative accessibility 0.48), 19.8 angstroms from PLP and poorly conserved, so the structural case for p.Ala107Thr is weak and the late onset may reflect a mild second allele. Neither has been tested functionally; p.His92Arg is absent from ClinVar and p.Ala107Thr is a variant of uncertain significance there.
    type: missense
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:40976369
      reference_title: "Late-onset Vitamin B6-dependent epilepsy caused by compound heterozygous pathogenic PLPBP variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which developed when the patient was just 8 months old but was diagnosed at 10 years of age."
      explanation: The case report of the genotype with late onset.
diagnosis:
- name: Vitamin B6 Trial with PLPBP Molecular Genetic Testing
  description: >-
    There is no specific biochemical marker. The diagnosis is made by
    molecular genetic testing in an infant with suggestive findings, usually
    after a clinical and electroencephalographic response to pyridoxine or
    PLP. Urinary alpha-aminoadipic semialdehyde is normal, which separates
    the disorder from ALDH7A1 deficiency, and plasma B6 vitamer profiles on
    treatment do not separate it from the other B6-dependent epilepsies. A
    vitamin B6 trial should not wait for a lactate or glycine result to be
    explained.
  diagnosis_term:
    preferred_term: molecular genetic testing of PLPBP
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PLPBP deficiency is established in a proband with suggestive findings and biallelic pathogenic variants in PLPBP identified by molecular genetic testing."
    explanation: GeneReviews diagnostic standard.
  - reference: PMID:37428623
    reference_title: "On pathways and blind alleys-The importance of biomarkers in vitamin B(6) -dependent epilepsies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "while there is no biomarker to test for PLPHP deficiency. Secondary elevation of glycine or lactate was recognized as diagnostic pitfall."
    explanation: Review stating the absence of a specific biomarker and the two biochemical pitfalls.
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin B6 plasma profiles on pyridoxine did not enable the differentiation of patients with PROSC mutations."
    explanation: Plasma vitamer profiles on treatment are not discriminating.
differential_diagnoses:
- name: ALDH7A1 Pyridoxine-Dependent Epilepsy
  description: Clinically and electroencephalographically indistinguishable; separated by raised alpha-aminoadipic semialdehyde and by genotype.
  distinguishing_features:
  - Raised urinary and plasma alpha-aminoadipic semialdehyde in ALDH7A1 deficiency; normal in PLPBP deficiency
  evidence:
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and electroencephalographic phenotype in patients with PROSC mutations was indistinguishable from ALDH7A1 and PNPO deficiency."
    explanation: States that the three disorders cannot be separated clinically.
- name: PNPO Deficiency
  description: Also clinically indistinguishable; separated by genotype and, where available, by plasma pyridoxamine and PNPO activity.
  evidence:
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and electroencephalographic phenotype in patients with PROSC mutations was indistinguishable from ALDH7A1 and PNPO deficiency."
    explanation: States that the three disorders cannot be separated clinically.
- name: Mitochondrial Encephalopathy
  description: >-
    Suggested by persistent lactic acidosis with neonatal encephalopathy.
    This misdiagnosis has delayed or prevented a vitamin B6 trial in patients
    who died.
  evidence:
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Suspicion of an underlying mitochondrial disorder often delays B6 trial and diagnosis of the B6RDs, leading to delayed or lack of appropriate treatment."
    explanation: Documents the diagnostic delay caused by suspecting mitochondrial disease.
- name: Glycine Encephalopathy
  description: >-
    Suggested by raised plasma glycine. In PLPBP deficiency cerebrospinal
    fluid glycine is only moderately raised and the cerebrospinal fluid to
    plasma ratio is normal.
  evidence:
  - reference: PMID:31741821
    reference_title: "Diagnostic pitfalls in vitamin B6-dependent epilepsy caused by mutations in the PLPBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, on the background of glycine elevation in plasma, glycine encephalopathy was wrongly adopted as diagnosis for a patient in our report."
    explanation: A documented misdiagnosis of glycine encephalopathy.
treatments:
- name: Pyridoxine Supplementation
  description: >-
    Lifelong pharmacological pyridoxine. Given as soon as the disorder is
    suspected, it stops or improves seizures in every patient in whom a trial
    is documented, usually at once. It supplies substrate in excess, raising
    the PLP available to apoenzymes despite the missing carrier; it does not
    restore PLPHP. Withdrawal brings back encephalopathy within days.
    High-dose pyridoxine carries a risk of sensory neuropathy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Brain Pyridoxal Phosphate Deficiency
    description: Excess substrate raises brain PLP by mass action.
  target_phenotypes:
  - preferred_term: Neonatal seizure
    term:
      id: HP:0032807
      label: Neonatal seizure
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapy is lifelong pharmacologic treatment with either PN or PLP, and often with additional ASMs."
    explanation: GeneReviews management standard.
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A pyridoxine or PLP trial was documented in 91% (49/54) and resulted in initial seizure cessation or improvement in all patients."
    explanation: Pooled response to a first B6 trial.
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients underwent a controlled pyridoxine withdrawal with signs of encephalopathy within a couple of days."
    explanation: Shows the dependency by controlled withdrawal.
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "concern of acquiring a neuropathy associated with high dose pyridoxine treatment"
    explanation: Documents that neuropathy from high-dose pyridoxine is a recognized concern that has led to dose reduction in this disorder.
- name: Pyridoxal 5-Phosphate Supplementation
  description: >-
    PLP is an alternative to pyridoxine and is tried when the response to pyridoxine is partial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxal 5'-phosphate
      term:
        id: CHEBI:18405
        label: pyridoxal 5'-phosphate
  target_mechanisms:
  - target: Brain Pyridoxal Phosphate Deficiency
    description: Supplies the active cofactor directly.
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically show an immediate positive response to vitamin B6, given as either pyridoxine (PN) or pyridoxal 5'-phosphate (PLP)."
    explanation: GeneReviews lists PLP as an effective form of vitamin B6 in this disorder.
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The addition of PLP or folinic acid to B6 therapy resulted in seizure cessation or improved seizure control in a subset of patients"
    explanation: Benefit of adding PLP in partial responders.
- name: Folinic Acid Add-On
  description: >-
    Folinic acid has stopped seizures in individual patients who did not
    respond fully to pyridoxine and PLP, and gave no clear benefit in others.
    The evidence is a handful of case observations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  evidence:
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, adding folinic acid to two patients who failed the pyridoxine and PLP trial resulted in prompt seizure cessation"
    explanation: Case-level evidence of benefit.
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "folinic acid was prescribed to our patient without clear clinical benefit."
    explanation: A patient in the same report did not benefit, so the effect is not consistent.
- name: Adjunct Antiseizure Medication
  description: >-
    Most patients need antiseizure medication in addition to vitamin B6.
    Carbamazepine, valproate, phenytoin and phenobarbital can lower plasma
    PLP and are listed by GeneReviews as agents to be aware of.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to vitamin B6 treatment, almost 60% of individuals require adjunct ASMs to achieve optimal seizure control."
    explanation: Proportion needing adjunct antiseizure medication.
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several ASMs (such as carbamazepine, valproate, phenytoin, and phenobarbitone) can cause a low plasma concentration of PLP."
    explanation: GeneReviews agents and circumstances to avoid.
- name: Developmental Supportive Care
  description: Multidisciplinary support for the neurodevelopmental consequences, including speech-language, physical and occupational therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care for neurodevelopmental issues typically includes specialists in multiple disciplines including neurology, developmental pediatrics, speech-language therapy, physical therapy, and occupational therapy."
    explanation: GeneReviews supportive care recommendation.
- name: Genetic Counseling and Management of At-Risk Newborns
  description: >-
    Once the familial variants are known, carrier testing and prenatal or
    preimplantation testing are possible. An at-risk newborn is either
    treated with the vitamer that worked in the affected sib while results
    are pending, or monitored and treated at the first sign of seizures.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the PLPBP pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal and preimplantation genetic testing are possible."
    explanation: GeneReviews genetic counseling statement.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate has been published; 54 individuals had been
    reported by the 2026 systematic review. As a rough check on rarity, the
    summed gnomAD v4 allele frequency of high-confidence predicted
    loss-of-function PLPBP variants is 2.1e-04 (queried 2026-11-26), and
    adding the reported pathogenic missense alleles other than p.Val235Gly
    brings it to about 3.7e-04. Under Hardy-Weinberg assumptions that
    corresponds to a birth frequency in the order of one in several million.
    This is a curator calculation, not a published figure, and it ignores
    consanguinity and founder populations, where the disorder is
    concentrated.
  evidence:
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including our additional cases, the total number of individuals with PLPBP variants increased to 54."
    explanation: Case count in the literature at the time of the most recent systematic review.
progression:
- phase: Prenatal and neonatal onset
  notes: >-
    Abnormal fetal movements, fetal distress and prematurity in a minority;
    seizures within the first day of life in over half and within the first
    week in three quarters.
  evidence:
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals in the reviewed studies presented with early neonatal seizures, with the majority occurring within the first 24 h of life (55.5%) or the first week of life (76%)."
    explanation: Timing of onset.
- phase: Lifelong treated course
  notes: >-
    Seizures are controlled or reduced on vitamin B6 but breakthrough
    seizures, often with fever, are common and most patients need added
    antiseizure medication. Developmental outcome ranges from normal to
    severe impairment. Onset after the neonatal period, up to eight months,
    occurs with hypomorphic genotypes.
  evidence:
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite a dramatic early response to B6/PLP, almost all patients (74%, 34/46) had incomplete seizure control, even with the concomitant use of ASMs."
    explanation: Long-term seizure control on treatment.
- phase: Early death without treatment
  notes: >-
    Death between two weeks and sixteen months, concentrated in patients with
    the mitochondrial-encephalopathy-like presentation who received no
    vitamin B6 trial or had it withdrawn.
  evidence:
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the seven reported individuals with a neonatal mitochondrial encephalopathy-like presentation, five died early in life (2 weeks-16 months) ( 1 , 8 ): two died in the neonatal period without receiving a B6 trial, and three died following B6 treatment withdrawal."
    explanation: Documents early death and the presentation it clusters in.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    A neonatal-onset epilepsy that is fatal in infancy when the vitamin B6
    trial is missed or withdrawn, requires lifelong daily treatment, leaves
    incomplete seizure control in most patients and developmental impairment
    in about two thirds. A minority with hypomorphic genotypes reach
    adulthood with normal intellect.
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When left untreated, the disease can progress to status epilepticus and death in infancy."
    explanation: Natural history without treatment.
animal_models:
- name: Zebrafish plpbp knockout
  species: Danio rerio
  genotype: plpbp-/- (CRISPR/Cas9)
  genes:
  - preferred_term: plpbp
    term:
      id: ZFIN:ZDB-GENE-030131-1378
      label: plpbp
  publication: PMID:30668673
  description: >-
    CRISPR/Cas9 knockout larvae develop behavioral, biochemical and
    electrophysiological signs of seizures by 10 days post-fertilization and
    die by 16 days. Pyridoxine improves the seizure phenotype and extends
    survival. Larvae show altered B6 vitamers, amino acids, GABA and
    catecholamines.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Spontaneous, pyridoxine-responsive seizures follow loss of the ortholog.
    limitations: >-
      Larvae die by 16 days post-fertilization, so the model cannot address
      long-term neurodevelopmental outcome or the structural brain findings
      seen in patients.
    readouts:
    - name: Electrophysiological seizure activity
      target: Neuronal Hyperexcitability
      direction: INCREASED
      interpretation: Electrographic seizures in knockout larvae, reduced by pyridoxine.
    evidence:
    - reference: PMID:30668673
      reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our model recapitulates the disease, with plpbp-/- larvae showing behavioural, biochemical, and electrophysiological signs of seizure activity by 10 days post-fertilization and early death by 16 days post-fertilization."
      explanation: The model reproduces the seizure phenotype.
  - target: Reduced Glutamate Decarboxylase Activity

name: PLPBP Deficiency
creation_date: "2026-11-26T19:30:00Z"
category: Mendelian
description: >-
  PLPBP deficiency is an autosomal recessive, treatable vitamin B6-dependent
  epilepsy caused by biallelic loss-of-function variants in PLPBP (formerly
  PROSC), which encodes the pyridoxal 5'-phosphate homeostasis protein (PLPHP).
  PLPHP is a small, non-catalytic TIM-barrel protein that carries pyridoxal
  5'-phosphate (PLP, the active form of vitamin B6) as a Schiff base on Lys47.
  It has no known enzymatic activity; its loss disturbs the cellular B6 vitamer
  pool, lowers the PLP available to PLP-dependent enzymes in brain, and so
  reduces GABA and monoamine synthesis. Seizures usually begin in the first
  days of life, resist antiseizure medication and respond to pyridoxine or
  PLP, which must be continued for life. Raised lactate and glycine at
  presentation mimic mitochondrial disease and glycine encephalopathy and have
  delayed the vitamin B6 trial in fatal cases. More than half of affected
  individuals have developmental impairment, and severity tracks genotype:
  biallelic truncating variants give the most severe disease, hypomorphic
  missense variants the mildest.
parents:
- Epilepsy
- Inborn Errors of Metabolism
- Neurodevelopmental Disorder
synonyms:
- PLPHP deficiency
- Epilepsy, early-onset, vitamin B6-dependent
- EPVB6D
- Vitamin B6-dependent epilepsy due to PLPBP deficiency
- Pyridoxal phosphate-binding protein deficiency
- PROSC deficiency

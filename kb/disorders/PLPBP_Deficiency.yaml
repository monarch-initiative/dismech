  evidence:
  - reference: PMID:31825581
    reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lys47 was determined the PLP-binding site of PLPBP via liquid chromatography combined with tandem MS (LC-MS/MS) analysis after reduction of the PLP adduct to the secondary amine using NaBH4"
    explanation: Experimental identification of Lys47 as the PLP attachment site in the human protein.
  - reference: PMID:29689137
    reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, the six missense mutations caused ill effects and five of them impaired folding or decreased stability"
    explanation: >-
      Recombinant analysis of six patient missense variants shows each damages
      the protein, most by misfolding or destabilization.
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complementation with human PROSC restored growth whereas hPROSC encoding p.Leu175Pro, p.Arg241Gln, and p.Ser78Ter did not."
    explanation: >-
      Functional complementation in the E. coli yggS mutant shows that patient
      alleles of three classes (misfolding, cofactor-pocket, truncating) all
      lose function.
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe phenotypes were associated with variants leading to loss of function of PLPBP or significantly affecting protein stability/PLP-binding."
    explanation: Links the loss-of-function classes to clinical severity across a patient series.
  notes: >-
    The oligomeric state of the human protein is unsettled. One recombinant
    study found it largely monomeric with a minor disulfide-linked dimer
    (PMID:29689137); another found it predominantly dimeric under reducing
    conditions, with a cross-linking-derived interface around Lys47 that
    shields the cofactor (PMID:31825581). The loss-of-function reading above
    does not depend on which is right, but the placement of surface variants
    such as p.Tyr69Cys does.
  downstream:
  - target: Disturbed Cellular Vitamin B6 Vitamer Pool
    causal_link_type: DIRECT
    description: >-
      Without functional PLPHP, cells cannot maintain their PLP pool and
      accumulate the phosphorylated precursors.
    hypothesis_groups:
    - plp_carrier_model
    - vitamer_flux_model
    evidence:
    - reference: PMID:30668673
      reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using mass spectrometry, we observed significant B6 vitamer level changes in plpbp-/- zebrafish, patient fibroblasts and PLPHP-deficient HEK293 cells."
      explanation: Loss of the protein changes B6 vitamer levels in three independent systems, two of them human cell cultures and one the zebrafish model; graded by the cell-culture measurements.
- name: Disturbed Cellular Vitamin B6 Vitamer Pool
  description: >-
    PLPHP-deficient human cells have lower intracellular PLP whichever B6
    vitamer they are fed, accumulate pyridoxine 5'-phosphate and pyridoxamine
    5'-phosphate, and hydrolyze PLP to pyridoxal faster. Accumulation of
    pyridoxine 5'-phosphate is shared with yggS-deficient bacteria. The
    first report found the opposite direction for PLP in cultured patient
    fibroblasts; that conflict is recorded as a discussion.

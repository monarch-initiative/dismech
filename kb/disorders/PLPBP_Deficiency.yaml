discussions:
- discussion_id: controversy_plpbp_fibroblast_plp_direction
  prompt: >-
    Is intracellular PLP high or low in PLPHP-deficient human cells, and what
    explains the opposite results in patient fibroblasts?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Disturbed Cellular Vitamin B6 Vitamer Pool
  rationale: >-
    The founding report found excessive PLP in cultured patient fibroblasts
    while cerebrospinal fluid PLP was low. Later studies found low PLP in
    patient fibroblasts and knockout HEK293 cells under every vitamer
    supply tested. The two readings imply different mechanisms: failure to
    deliver PLP that is present, or failure to maintain the PLP pool.
    Culture medium vitamer content, the patient genotypes studied and assay
    method are candidate explanations that have not been tested side by
    side.
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, cultured fibroblasts showed excessive PLP accumulation."
    explanation: One side of the conflict.
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "independent of extracellular B6 vitamer type (pyridoxine, pyridoxamine, or pyridoxal), intracellular pyridoxal 5'-phosphate (PLP) was lower in PLPHP-deficient fibroblasts and HEK293 cells than controls."
    explanation: The other side of the conflict.
- discussion_id: gap_plpbp_molecular_function
  prompt: >-
    What does PLPHP do with the PLP it binds: transfer it to apoenzymes,
    buffer it against phosphatase and side reactions, relieve product
    inhibition of PNPO, or regulate something else through RNA binding?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of PLPHP Pyridoxal Phosphate Binding
  - mechanistic_hypotheses#plp_carrier_model
  - mechanistic_hypotheses#vitamer_flux_model
  - mechanistic_hypotheses#rna_binding_model
  rationale: >-
    Every step of the pathograph below the first node follows from PLP shortage, but the first step is inferred. The human protein binds PLP and has no detected catalytic activity; PLP transfer to an apoenzyme has been shown only for bacterial and plant homologs, not for the human protein, whose binding partners in HEK293 cells were not enriched for PLP-dependent enzymes; the oligomeric state is disputed; and no stable PNPO interaction was found. Which function is lost determines whether a pharmacochaperone for destabilized missense proteins, or inhibition of pyridoxal phosphatase, could add to vitamin B6.
  evidence:
  - reference: PMID:36295057
    reference_title: "The Conserved Family of the Pyridoxal Phosphate-Binding Protein (PLPBP) and Its Cyanobacterial Paradigm PipY."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "fundamental questions concerning the mechanism of action of PLPBPs remain to be answered and additional lines of investigation are required to advance knowledge."
    explanation: A review of the protein family stating that the mechanism of action is unresolved.
  proposed_experiments:
  - experiment_id: exp_plpbp_plp_transfer_to_apoenzyme
    name: Direct PLP transfer from human PLPHP to neuronal apoenzymes
    description: >-
      Reconstitute purified holo-PLPHP, wild type and patient variants, with
      apo-glutamate decarboxylase and apo-aromatic L-amino acid
      decarboxylase and measure the rate of enzyme activation against free
      PLP at matched concentration, with and without pyridoxal phosphatase.
    would_support:
    - mechanistic_hypotheses#plp_carrier_model
    would_refute:
    - mechanistic_hypotheses#plp_carrier_model
    supporting_outcome:
    - >-
      Holo-PLPHP activates the apoenzymes faster than free PLP, protects PLP
      from the phosphatase, and cofactor-pocket variants fail to do so.
    refuting_outcome:
    - >-
      Holo-PLPHP activates apoenzymes no faster than free PLP and offers no
      protection from the phosphatase.
- discussion_id: gap_plpbp_brain_malformation_mechanism
  prompt: >-
    How does PLPHP deficiency produce microcephaly, simplified gyri, white
    matter abnormality and cysts, and can prenatal vitamin B6 prevent them?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Perinatal Brain Development
  rationale: >-
    The structural findings are frequent and predict outcome, but the edge
    from PLP shortage to abnormal brain development is inferred from timing
    alone. Surviving patients in the founder families had mothers who took
    high-dose pyridoxine as an antiemetic in pregnancy, which suggests
    prenatal supply matters, but this is an observation in a handful of
    patients.
  evidence:
  - reference: PMID:33977028
    reference_title: "A founder mutation in the PLPBP gene in families from Saguenay-Lac-St-Jean region affected by a pyridoxine-dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both patients, who are alive, had a history of prenatal supplements taken by their mothers as antiemetic medication with high doses of pyridoxine."
    explanation: The observation that raises the question of prenatal treatment.
- discussion_id: mismatch_plpbp_zebrafish_lifespan
  prompt: >-
    Can a model that dies as a larva inform the neurodevelopmental outcome
    that determines long-term disability in patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Danio rerio
  - pathophysiology#Abnormal Perinatal Brain Development
  rationale: >-
    The zebrafish knockout reproduces the seizures and their pyridoxine response but dies by 16 days post-fertilization. Patients on treatment survive, and their disability comes from developmental impairment and structural brain abnormality that the model cannot show. The one mammalian model is the International Mouse Phenotyping Consortium knockout allele Plpbp em1(IMPC)Bay, whose only significant call in homozygotes is preweaning lethality with incomplete penetrance (MP:0011110); seizures and brain structure have not been characterized in it. No human neuronal model has been published.
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "early death by 16 days post-fertilization"
    explanation: The lifespan limit of the model.
notes: >-
  Phenotype baseline. The GeneReviews chapter (PMID:36795901) is tagged below
  and its clinical characteristics are all represented. Frequencies were
  taken from the 54-individual literature review in PMID:36324377 and the
  systematic review in PMID:41671913, whose patient sets overlap; where they
  differ slightly the review giving explicit numerators is quoted.

  Scope. This entry covers only the PLPBP disorder. ALDH7A1 deficiency and
  PNPO deficiency are separate entries (Pyridoxine-Dependent_Epilepsy,
  PNPO_Deficiency) with different primary lesions.

  Name. "PLPBP deficiency" is the GeneReviews chapter title. The MONDO label
  and the literature synonym "PLPHP deficiency" are kept as synonyms.

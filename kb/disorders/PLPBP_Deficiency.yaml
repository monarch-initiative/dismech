genetic:
- name: PLPBP
  gene_term:
    preferred_term: PLPBP
    term:
      id: hgnc:9457
      label: PLPBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >
    PLPBP (8p11.23, previous symbol PROSC) encodes PLPHP, 275 residues (UniProt O94903; MANE transcript NM_007198.4). No external body has classified this gene-disease pair (no ClinGen gene-validity record), so gene_disease_validity is absent.


    Constraint. gnomAD v4 gives pLI 0.00002 and a loss-of-function observed/expected ratio of 0.67 (21 observed, 31.2 expected; upper bound 0.97), with missense observed/expected 0.87. The gene tolerates heterozygous loss of function, as expected for a recessive disorder, and this gives no support to a dominant mechanism. No homozygote is recorded in gnomAD for any variant listed below.


    Structural placements are predictions, not measurements. There is no experimental structure of human PLPHP. The distances, solvent accessibilities and conservation counts in the variant descriptions were computed for this entry on the AlphaFold model of O94903 (mean pLDDT 89; residues 1-11 and 250-275 below 70) carrying a PLP transplanted by AlphaFill from the yeast ortholog structures 1B54 and 1CT5, with conservation counted as identity to the human residue across the 29 other reviewed YggS/PROSC-family sequences in UniProt. In that model the residues within 4.5 angstroms of PLP are Val45, Lys47, Asn68, Ile94, Met181, Ile183, Met225, Ser226, Ala227, Arg241, Ile242, Gly243, Ser244 and Arg250, the phosphate is held by Ser226, Gly243 and Ser244, the ring nitrogen by Arg241 and the ring hydroxyl by Asn68. A second placement, by superposing the model on four PLP-bound homolog structures (1B54, 1CT5, 1W8G, 5NM8), gives the same contact residues and distances within about half an angstrom. Because the PLP pose is a homology transplant, distances carry an uncertainty of one to two angstroms, and a monomer model cannot test effects on the disputed dimer interface. Where a recombinant-protein result exists it is cited on the variant and takes precedence over the prediction.


    Other alleles. ClinVar also classifies as pathogenic or likely pathogenic the canonical splice variants c.320-2A>G, c.207+1G>T, c.207+1G>C and c.319+1G>C and further nonsense and frameshift alleles including c.249_252del; they are null alleles of the same class as those listed. Residue 41 is also altered by p.Arg41Trp. Variants in the disordered C-terminal tail (p.His275Asp, and p.Pro258Leu and p.Ala262Thr in ClinVar) fall in a region the model does not resolve and that is absent from the bacterial and yeast orthologs; the structural case for them is weak.
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of two children from a consanguineous family with pyridoxine-dependent epilepsy revealed a homozygous nonsense mutation in proline synthetase co-transcribed homolog (bacterial), PROSC, which encodes a PLP-binding protein of hitherto unknown function. Subsequent sequencing of 29 unrelated indivduals with pyridoxine-responsive epilepsy identified four additional children with biallelic PROSC mutations."
    explanation: The founding report of biallelic variants in affected children.
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four further unrelated patients harbouring a total of six different mutations, including four novel disease mutations."
    explanation: Independent replication in unrelated patients.
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with pyridoxine significantly improved the epileptic phenotype and extended lifespan in plpbp-/- animals."
    explanation: A knockout animal reproduces the B6-responsive epilepsy, which supports causation.
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis revealed an association of missense variants and compound heterozygous variants with an attenuated phenotype, while biallelic truncating variants and homozygous variants were linked to severe phenotypes and/or early mortality."
    explanation: Genotype-phenotype correlation across 54 individuals, as expected for a loss-of-function dosage series.
  variants:
  - name: p.Ser78Ter
    description: >-
      c.233C>G. Nonsense variant in the third beta/alpha unit; any product
      lacks 198 of 275 residues, including Ile94, the phosphate-binding turn
      and Arg241. The founding family's allele: transcript reduced and no
      protein detected in patient fibroblasts. A null allele.
    type: nonsense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000374852
    functional_effects:
    - function: pyridoxal phosphate binding
      description: No functional protein; fails to complement the E. coli yggS mutant.
      type: loss-of-function
    evidence:
    - reference: PMID:27912044
      reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "complementation with human PROSC restored growth whereas hPROSC encoding p.Leu175Pro, p.Arg241Gln, and p.Ser78Ter did not."
      explanation: Functional evidence that the allele is null.
  - name: p.Asp124LysfsTer2
    description: >-
      c.370_373del. Frameshift at residue 124 with a stop two codons later,
      removing the C-terminal half of the barrel including the whole
      phosphate-binding site. The most frequently reported allele (18.5% of
      reported individuals) and a founder allele in the Saguenay-Lac-St-Jean
      region of Quebec. Homozygotes are at the severe end of the spectrum.
      gnomAD v4 allele frequency 6.7e-05 (108 of 1,614,058 alleles), the most
      common predicted loss-of-function allele in the gene.
    type: frameshift
    variant_type: deletion
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000503895
    functional_effects:
    - function: pyridoxal phosphate binding
      description: Truncation before the phosphate-binding site; predicted null.
      type: loss-of-function
    evidence:
    - reference: PMID:33977028
      reference_title: "A founder mutation in the PLPBP gene in families from Saguenay-Lac-St-Jean region affected by a pyridoxine-dependent epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis showed a single shared profile for the affected persons and their parents, leading to a hypothesis about founder effect of the mutation in Saguenay-Lac-St-Jean region of French Canadians."
      explanation: Establishes the founder haplotype.
    - reference: PMID:36324377
      reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The eight individuals homozygous for this variant are at the severe end of the clinical spectrum with poor outcomes: six presented with a neonatal mitochondrial encephalopathy-like phenotype, and five died early in life (2 weeks to 16 months)."
      explanation: Clinical severity of the homozygous frameshift genotype.
    - reference: PMID:41671913
      reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common type of variant was missense variants (48%), with the variant c.370-373del being the most frequently reported (18.5%)."
      explanation: Frequency of the allele among reported individuals.
  - name: c.207+1G>A
    description: >-
      Canonical splice donor variant of intron 2. Homozygous in a patient with
      a severe phenotype. gnomAD v4 allele frequency 4.6e-05 (74 of 1,614,076
      alleles). The same position is also altered by c.207+1G>T and
      c.207+1G>C in other patients.

    snippet: "Culturing cells with pyridoxine or pyridoxamine led to the concentration-dependent accumulation of pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate (PMP), respectively, suggesting insufficient pyridox(am)ine 5'-phosphate oxidase activity."
    explanation: Documents accumulation of the two phosphorylated PNPO substrates.
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, cultured fibroblasts showed excessive PLP accumulation."
    explanation: >-

    evidence_source: HUMAN_CLINICAL
    snippet: "Increase in 3-O-methyldopa and 5-hydroxytryptophan was demonstrated in some patients with vitamin B6-dependent epilepsy, suggestive of pyridoxal 5'-phosphate deficiency in the brain."
    explanation: >-
      Accumulation of the two substrates of aromatic L-amino acid decarboxylase in cerebrospinal fluid is the human readout of reduced enzyme activity. The series pooled seven patients with ALDH7A1 deficiency and two with PLPHP deficiency and reports the finding in some of them, so it is indirect for this disorder.
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Larvae had disruptions in amino acid metabolism as well as GABA and catecholamine biosynthesis, indicating impairment of PLP-dependent enzymatic activities."
    explanation: Zebrafish lacking plpbp show a catecholamine synthesis defect, the expected consequence of reduced aromatic L-amino acid decarboxylase activity.
  downstream:
  - target: Paroxysmal Movement Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Oculogyric crises and dystonic posturing are the movement phenotype of
      monoamine deficiency; a patient with this presentation was first
      thought to have aromatic L-amino acid decarboxylase deficiency.
    evidence:
    - reference: PMID:30668673
      reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Suspected clinical diagnoses prior to identification of PLPBP variants included mitochondrial encephalopathy (two patients), folinic acid-responsive epilepsy (one patient) and a movement disorder compatible with AADC deficiency (one patient)."
      explanation: >-
        A patient's movement disorder was clinically indistinguishable from
        primary AADC deficiency, which supports the monoamine route to this
        phenotype without proving it.
  - target: Oculogyric Crisis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Oculogyric crises are the characteristic eye-movement sign of dopamine deficiency, as in primary aromatic L-amino acid decarboxylase deficiency. The link is inferred from that parallel in a single reported patient.
- name: Neuronal Hyperexcitability
  description: >-
    Loss of inhibitory tone produces seizures that standard antiseizure
    medication does not control, with burst suppression on
    electroencephalography in the most severe cases. Restoring PLP supply with
    pharmacological vitamin B6 reverses it, usually at once.
  role: central_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "plpbp-/- larvae showing behavioural, biochemical, and electrophysiological signs of seizure activity by 10 days post-fertilization and early death by 16 days post-fertilization."
    explanation: Loss of the gene alone produces electrographic seizures in a vertebrate.
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures are unresponsive to (or only partly responsive to) anti-seizure medications (ASMs) but typically show an immediate positive response to vitamin B6"
    explanation: The therapeutic response in patients shows the hyperexcitability depends on B6 supply.
  downstream:

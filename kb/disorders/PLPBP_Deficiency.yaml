classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of vitamin B6 handling; Harrison's covers inborn errors
      of metabolism under the endocrinology and metabolism Part.
  - classification_value: NEUROLOGIC
    notes: >-
      The presenting and defining problem is a neonatal-onset epilepsy, so the
      disorder also sits in the neurology Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian autosomal recessive disorder caused by biallelic PLPBP
      variants.
  icimd_category:
  - classification_value: pyridoxine_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) group "Disorders of
      pyridoxine (vitamin B6) metabolism" under "Disorders of vitamin and
      cofactor metabolism". The lesion is in handling of the B6 cofactor
      itself, as in PNPO deficiency, and unlike ALDH7A1 deficiency, whose
      primary lesion is in lysine catabolism.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Affected individuals carry biallelic (homozygous or compound heterozygous) pathogenic PLPBP variants; heterozygous carriers are asymptomatic. Age at onset and severity vary widely with genotype. Penetrance has not been studied formally and is not recorded.
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLPBP deficiency is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual, irrespective of sex, has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier"
    explanation: >-
      Gives the recessive recurrence risks and records that heterozygous
      carriers are asymptomatic, which is the human evidence that one
      functional allele is sufficient.
mechanistic_hypotheses:
- hypothesis_group_id: plp_carrier_model
  hypothesis_label: PLPHP is a carrier that supplies PLP to apoenzymes while shielding it
  status: CANONICAL
  description: >-
    The prevailing model since the gene was identified. PLP is a reactive aldehyde, so free PLP must be kept low while newly made apoenzymes still receive it. PLPHP is proposed to hold PLP on Lys47 and hand it to PLP-dependent enzymes. Loss of the carrier leaves apoenzymes under-supplied even when total cellular B6 is normal or high, which is why pharmacological vitamin B6 can compensate by mass action. Transfer of PLP to a PLP-dependent enzyme has been shown in vitro for the E. coli, Salmonella and Arabidopsis homologs, and for Salmonella is supported in vivo. It has not been shown for the human protein, whose interaction partners in HEK293 cells were not enriched for PLP-dependent enzymes; for the human protein the model rests on PLP binding, the absence of catalytic activity, and the phenotype of deficient cells.
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "our studies suggest that PROSC is involved in intracellular homeostatic regulation of PLP, supplying this cofactor to apoenzymes while minimizing any toxic side reactions."
    explanation: >-
      The founding report proposes the carrier role. The authors say the
      mechanism is not fully understood, so this supports the model as a
      hypothesis and not as a demonstrated activity.
  - reference: PMID:38954500
    reference_title: "Two pyridoxal phosphate homeostasis proteins are essential for management of the coenzyme pyridoxal 5'-phosphate in Arabidopsis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Assays in vitro show that Arabidopsis PLPHP can coordinate PLP transfer and withdrawal from other enzymes."
    explanation: >-
      Direct demonstration of PLP transfer to and from enzymes, but for the
      Arabidopsis homolog; it shows the family can do this and is indirect for
      the human protein.
  - reference: PMID:36218140
    reference_title: "Characterization of the Escherichia coli pyridoxal 5'-phosphate homeostasis protein (YggS): Role of lysine residues in PLP binding and protein stability."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "YggS binds PLP very tightly and is able to slowly transfer it to a model PLP-dependent enzyme, serine hydroxymethyltransferase."
    explanation: In vitro transfer of PLP from the E. coli homolog to an apoenzyme. Shows the family can act as a carrier; indirect for the human protein.
  - reference: PMID:42045118
    reference_title: "PLP Homeostasis Protein Is Required for Efficient Maturation of Aromatic Amino Acid Aminotransferase in Salmonella enterica."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Using TyrB as a target, we provide the first demonstration that YggS of S. enterica can mediate transfer of PLP to a PLP-DE in vitro."
    explanation: Transfer of PLP from the Salmonella homolog to an aminotransferase, in a study whose genetics also support the transfer in vivo. Indirect for the human protein.
  - reference: PMID:31825581
    reference_title: "Biochemical and Proteomic Studies of Human Pyridoxal 5'-Phosphate-Binding Protein (PLPBP)."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "We did not observe an over-representation of PLP-DEs among the PLPBP-binding proteins"
    explanation: Cross-linking and co-immunoprecipitation of human PLPHP in HEK293 cells did not recover PLP-dependent enzymes preferentially, which the authors read as evidence against delivery to apoenzymes. A transient transfer would not necessarily be captured, so this weighs against the model without excluding it.
- hypothesis_group_id: vitamer_flux_model
  hypothesis_label: Loss of PLPHP lowers PLP by reducing PNPO flux and increasing PLP hydrolysis
  status: EMERGING
  description: >-
    Isotope tracing in PLPHP-deficient human cells shows two proximate causes
    of the low PLP pool: reduced flux through pyridox(am)ine 5'-phosphate
    oxidase, with accumulation of its substrates pyridoxine 5'-phosphate and
    pyridoxamine 5'-phosphate, and faster hydrolysis of PLP to pyridoxal by
    pyridoxal phosphatase. This refines the carrier model more than it
    competes with it: unprotected PLP is both a product inhibitor of PNPO and
    a phosphatase substrate.
  evidence:
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experiments utilizing 13C4-pyridoxine confirmed lower pyridox(am)ine 5'-phosphate oxidase activity and revealed increased fractional turnovers of PLP and pyridoxal, indicating increased PLP hydrolysis to pyridoxal in PLPHP-deficient cells."
    explanation: Tracer evidence for both arms of the model in patient fibroblasts and HEK293 cells.
- hypothesis_group_id: mitochondrial_transaminase_model
  hypothesis_label: PLPHP maintains mitochondrial PLP for transaminases and oxidative metabolism
  status: EMERGING
  description: >-
    PLPHP is found in mitochondria as well as cytosol. Its loss changes
    mitochondrial PLP and pyridoxamine 5'-phosphate, lowers tricarboxylic acid
    cycle intermediates downstream of alpha-ketoglutarate and raises lactate
    and pyruvate in cells. The model proposes that under-supplied
    mitochondrial transaminases explain the lactic acidemia and the
    mitochondrial-encephalopathy-like presentation of the most severe
    patients.
  evidence:
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PLPHP deficiency had a distinct effect on mitochondrial PLP and PMP, suggesting impaired activity of mitochondrial transaminases."
    explanation: The observation in fractionated HEK293 cells on which the model rests.
- hypothesis_group_id: rna_binding_model
  hypothesis_label: PLPHP has a PLP-modulated RNA-binding function
  status: EMERGING
  description: >-
    Bacterial YggS and human PLPHP bind RNA in vitro, with affinity modulated
    by PLP. Whether this contributes to PLP homeostasis or to disease is
    unknown; no patient variant has been tested for an RNA-binding defect and
    no edge in this entry depends on the model.
  evidence:
  - reference: PMID:39604152
    reference_title: "The ubiquitous pyridoxal 5'-phosphate-binding protein is also an RNA-binding protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The interaction with RNA is evidently conserved, since it is also observed with human PLP-BP."
    explanation: Reports RNA binding by the human protein in vitro.
pathophysiology:
- name: Loss of PLPHP Pyridoxal Phosphate Binding
  description: >-
    The normal protein is a single-domain TIM-barrel of the fold-type III PLP
    family that binds one PLP as an internal aldimine (Schiff base) on Lys47
    and has no detected catalytic activity. Biallelic PLPBP variants remove
    this function in one of three ways. Nonsense, frameshift and canonical
    splice variants give no stable protein. Missense variants in the cofactor
    pocket (p.Val45Asp, p.Arg241Gln) give protein that is purified without
    PLP. Missense variants away from the pocket (p.Leu175Pro, p.Pro40Leu,
    p.Arg205Gln, p.Arg41Gln) misfold or destabilize the barrel. All three
    classes are loss of function; no variant has been shown to act as a gain
    of function or dominant negative, and heterozygous carriers are
    asymptomatic.

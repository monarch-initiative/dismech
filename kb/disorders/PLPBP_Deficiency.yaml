    causal_link_type: DIRECT
- name: Impaired Mitochondrial Oxidative Metabolism
  description: >-
    PLPHP-deficient HEK293 cells accumulate lactate and pyruvate and lose
    tricarboxylic acid cycle intermediates downstream of alpha-ketoglutarate,
    and yeast lacking the ortholog deplete PLP only on carbon sources that
    require mitochondrial metabolism. In patients the counterpart is raised
    lactate at presentation, persistent in a subset with a
    mitochondrial-encephalopathy-like course.
  role: mediator
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lactate and pyruvate accumulation along with the decrease of tricarboxylic acid cycle intermediates downstream of α-ketoglutarate suggested impaired mitochondrial oxidative metabolism in PLPHP-deficient HEK293 cells."
    explanation: Metabolite evidence for the node in a human knockout cell line.
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in YBL036C-deficient yeast, PLP was depleted and PMP accumulated only with carbon sources requiring mitochondrial metabolism."
    explanation: >-
      Yeast lacking the ortholog show the vitamer defect only under respiratory growth, tying the role of the protein to mitochondrial metabolism.
  downstream:

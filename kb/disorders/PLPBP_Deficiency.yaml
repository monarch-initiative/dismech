- name: Impaired Glycine Cleavage
  description: >-
    Glycine is raised in plasma and cerebrospinal fluid at presentation in a quarter to a half of patients and falls on treatment. The glycine cleavage system is PLP-dependent, so reduced cleavage is the proposed cause; its activity has not been measured in patients. Two routes are possible and have not been separated: shortage of PLP for the P-protein, or competition at the P-protein by the pyridoxine 5'-phosphate that accumulates when PLPHP is lost, which is what inhibits glycine cleavage in the E. coli yggS mutant.
  role: mediator
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: glycine decarboxylation via glycine cleavage system
    term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
    modifier: DECREASED
  evidence:
  - reference: PMID:33728241
    reference_title: "Early-onset vitamin B(6)-dependent epilepsy due to pathogenic PLPBP variants in a premature infant: A case report and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glycine, the substrate for B6‐dependent glycine cleavage system was also elevated (45%)."
    explanation: >-
      A literature review attributes the raised glycine to the PLP-dependent
      cleavage system. The link is an inference from the substrate
      accumulating.
  - reference: PMID:31677193
    reference_title: "Inhibition of glycine cleavage system by pyridoxine 5'-phosphate causes synthetic lethality in glyA yggS and serA yggS in Escherichia coli."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Biochemical assays confirmed that PNP disrupts the GCV system by competing with PLP in GcvP protein."
    explanation: In E. coli lacking the PLPHP homolog, accumulated pyridoxine 5'-phosphate inhibits the glycine cleavage P-protein. A candidate mechanism for the raised glycine in patients, shown only in bacteria.
  downstream:

- name: Abnormal Perinatal Brain Development
  description: >-
    About two thirds of patients imaged have structural abnormalities:
    white matter signal change or delayed myelination, underdeveloped gyri
    with shallow sulci, periventricular or temporal cysts, and a thin corpus
    callosum. Microcephaly, congenital or acquired, is present in over a
    third. Abnormal fetal movements, fetal distress and prematurity indicate
    that the process begins before birth in some. This node records the
    observed developmental lesion; its cellular mechanism is unknown.
  role: mediator
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of brain MRI studies identified anomalies in 65% of cases, including white matter abnormalities (54%), periventricular or temporal cysts (27%), anomalies of the corpus callosum (15.4%), and global brain underdevelopment with broad gyri and shallow sulci (44%)."
    explanation: Pooled imaging data across 54 individuals document the structural lesion.
  - reference: PMID:36324377
    reference_title: "Case report: PLPHP deficiency, a rare but important cause of B6-responsive disorders: A report of three novel individuals and review of 51 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal intrauterine movements were reported in 17% (9/54)."
    explanation: Evidence that the disease process is active before birth in a minority.
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
  - target: Cerebral White Matter Abnormality
    causal_link_type: DIRECT
  - target: Simplified Gyral Pattern
    causal_link_type: DIRECT
  - target: Periventricular Cysts
    causal_link_type: DIRECT
  - target: Thin Corpus Callosum
    causal_link_type: DIRECT
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The later-childhood form of the same developmental impairment.
  - target: Delayed Speech and Language Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The language component of the same developmental impairment.
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A recorded form of the same developmental impairment.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Structural abnormality present at birth is not reversed by treatment
      and is the proposed reason early treatment does not guarantee a normal
      outcome in the severe genotypes.
    evidence:
    - reference: PMID:33977028
      reference_title: "A founder mutation in the PLPBP gene in families from Saguenay-Lac-St-Jean region affected by a pyridoxine-dependent epilepsy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Even with early appropriate treatment, neurological outcome of our patient is still poor."
      explanation: >-
        In the founder truncating genotype, which shows delayed myelination,
        atrophy and temporal cysts, early treatment did not prevent a poor
        outcome; this is consistent with, and does not prove, a contribution
        of the structural lesion.

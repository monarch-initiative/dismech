has_subtypes:
- name: MAP2K1-related
  display_name: MAP2K1-related (classic dripping candle wax)
  description: >-
    Somatic activating mutations clustering in the MEK1 negative regulatory
    domain, producing the classic cortical dripping candle wax pattern.
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The activating mutations (Q56P, K57E and K57N) cluster tightly in the MEK1 negative
      regulatory domain.'
    explanation: Names the recurrent alleles and their shared location in the negative regulatory
      domain.
- name: SMAD3-related
  display_name: SMAD3-related (endosteal pattern)
  description: >-
    Somatic activating SMAD3 mutations producing an endosteal rather than cortical
    dripping pattern, and an opposite cellular phenotype.
  evidence:
  - reference: PMID:32232430
    reference_title: Somatic SMAD3-activating mutations cause melorheostosis by up-regulating the TGF-β/SMAD
      pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We now report somatic SMAD3 mutations in bone lesions of four unrelated patients
      with endosteal pattern melorheostosis.'
    explanation: Establishes the gene and ties it specifically to the endosteal radiographic
      pattern.
pathophysiology:
- name: Post-zygotic Somatic Mutation in Skeletal Tissue
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion, and the reason this disease looks the way it does. The
    mutation arises after fertilisation and is confined to a clone of cells, so it
    is present in affected bone and absent from unaffected bone in the same
    patient. Mosaicism extends to the skin overlying the lesions in most patients
    tested, which is consistent with a progenitor mutated early enough to populate
    more than one tissue.
  genes:
  - preferred_term: MAP2K1
    term:
      id: hgnc:6840
      label: MAP2K1
  - preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
      but not unaffected, bone of eight unrelated patients with melorheostosis.'
    explanation: The affected-versus-unaffected contrast within the same patient is what
      establishes somatic mosaicism rather than germline disease.
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Mosaicism is also detected in the skin overlying bone lesions in four of five patients
      tested.'
    explanation: Extends the mosaic clone beyond bone into overlying skin, which bears on how
      early the mutation arose.
  downstream:
  - target: MEK1-ERK Pathway Hyperactivation
    causal_link_type: DIRECT
    description: An activating mutation in the MEK1 negative regulatory domain releases the kinase
      from autoinhibition.
    evidence:
    - reference: PMID:29643386
      reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Affected bone displays a mosaic pattern of increased p-ERK1/2 in osteoblast
        immunohistochemistry.'
      explanation: Shows the pathway output raised in affected bone, and mosaically, matching the
        genetic finding.
  - target: TGF-beta-SMAD3 Pathway Hyperactivation
    causal_link_type: DIRECT
    description: An activating SMAD3 mutation raises signalling through the TGF-beta pathway in
      the alternative arm.
    evidence:
    - reference: PMID:32232430
      reference_title: Somatic SMAD3-activating mutations cause melorheostosis by up-regulating the TGF-β/SMAD
        pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In vitro, the SMAD3 mutations stimulated the TGF-β pathway in osteoblasts, enhanced
        nuclear translocation and target gene expression, and inhibited proliferation.'
      explanation: Demonstrates pathway activation and nuclear translocation for the mutant
        protein.

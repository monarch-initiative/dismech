    evidence_source: HUMAN_CLINICAL
    snippet: 'The disease remains limited to medial or lateral side of the extremity with proximo-distal
      progression.'
    explanation: Characterises the segmental boundary, which is the feature the mosaic mechanism
      has to explain.
  downstream:
  - target: Pain, Deformity and Restricted Movement
    causal_link_type: DIRECT
    description: Excess bone and soft tissue involvement produce the symptoms that bring patients
      to attention.
    evidence:

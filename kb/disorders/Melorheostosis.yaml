disease_term:
  preferred_term: melorheostosis
  term:
    id: MONDO:0007970
    label: melorheostosis
notes: >-
  Why two arms converge on one disease. MAP2K1 and SMAD3 both cause
  melorheostosis, but by opposite cellular routes. The MAP2K1 arm raises
  osteoblast proliferation and impairs mineralisation, so the excess bone is
  largely unmineralised osteoid. The SMAD3 arm suppresses proliferation and
  enhances mineralisation, so affected bone is more mineralised than unaffected
  bone. They also produce different radiographic patterns, cortical dripping
  versus endosteal. Modelling them as separate arms rather than a single
  "increased bone formation" node preserves that, and the subtypes slot on each
  node records which arm it belongs to.

  A recorded negative that matters clinically. LEMD3 is carried as DISPUTED with
  REFUTE evidence. It is genuinely causative for osteopoikilosis and
  Buschke-Ollendorff syndrome, and melorheostosis-like lesions occur in those
  conditions, which is why the association persists. But sequencing of blood,
  skin and bone from a patient with isolated melorheostosis found nothing, and
  reviews conclude it is not the causative gene. Buschke-Ollendorff syndrome is a
  separate entity, has an open curation issue assigned to another curator, and is
  deliberately not modelled here.

  A deprecated hypothesis retained on purpose. The sclerotome account of the
  segmental distribution was tested by whole body CT in thirty patients and only
  17% conformed to a single sclerotome. It is recorded with status DEPRECATED and
  REFUTE evidence rather than omitted, because reviews published after that test
  still state a sclerotomal distribution as fact, and a curator meeting that
  claim should be able to find the evidence against it from this entry.

  Testing implication of mosaicism. The mutations are present in affected bone
  and absent from unaffected bone in the same patient. A blood sample will
  therefore be negative, and this is a property of the disease rather than a
  limitation of any assay. It is stated in the genetic notes because it changes
  what a clinician should order.

  A correction made before submission. This entry initially recorded that no
  quotable prevalence figure existed. It does - an estimated 0.9 per million -
  and the deep-research job surfaced it from a paper the draft had not fetched.
  That is the third time in this series that a claim of "no figure available" has
  turned out to be a claim about my search rather than about the literature, so
  it is recorded here rather than quietly replaced.

  Known extension points: soft tissue and skin involvement, which
  is consistently described but was not modelled as its own phenotype; the
  reported association with osteosarcoma and malignant fibrous histiocytoma,
  including malignant transformation of pre-existing lesions; MEK inhibition,
  which the MAP2K1 paper proposes as a treatment avenue but which has no clinical
  evidence in these sources; and Buschke-Ollendorff syndrome, which belongs in
  its own entry.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check, recorded alongside this entry. Seven of the
  ten cached references are full text rather than abstracts, and content_type was
  checked before writing.

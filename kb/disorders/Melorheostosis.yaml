name: Melorheostosis
creation_date: '2026-09-08T17:00:00Z'
description: >-
  A rare sclerosing bone dysplasia in which excess cortical bone accumulates in a
  striking asymmetric, segmental pattern classically likened to wax dripping down
  a candle. It is not inherited. The cause is a post-zygotic somatic mutation
  present only in affected tissue, which is why the disease stops at a boundary
  on the limb and why blood testing is uninformative. Two genes are established
  and they produce different radiographic patterns by opposite cellular routes:
  activating MAP2K1 mutations drive ERK signalling, increase osteoblast
  proliferation and impair mineralisation, leaving abundant unmineralised osteoid;
  activating SMAD3 mutations drive TGF-beta signalling, inhibit proliferation and
  enhance mineralisation. Both converge on excess bone. The historical explanation
  for the segmental distribution, that lesions follow sclerotomes, has been tested
  directly and largely fails.
categories:
- Sclerosing Bone Dysplasia
- Somatic Mosaic Disorder
- Skeletal Overgrowth Disorder
parents:
- osteochondrodysplasia
synonyms:
- Leri disease
- melorheostosis, isolated, somatic mosaic
- mixed sclerosing bone dystrophy
epidemiology:
- name: Reported case count
  description: >-
    About 400 cases had been reported in the century after its first description,
    almost all as single reports or small series, which is the main constraint on
    everything else known about it.
  evidence:
  - reference: PMID:28676968
    reference_title: 'Melorheostosis: a Rare Sclerosing Bone Dysplasia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Since its first description in 1922, about 400 cases of melorheostosis have been
      reported, either as single reports or in small case series.'
    explanation: Gives the total reported experience and the study designs it rests on.
- name: Skeletal distribution
  description: >-
    The appendicular skeleton is affected more often than the axial, and lower
    limb deformity is the usual presentation.
  evidence:
  - reference: PMID:28676968
    reference_title: 'Melorheostosis: a Rare Sclerosing Bone Dysplasia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Melorheostosis affects the appendicular skeleton more commonly than the axial skeleton
      and usually presents with lower limb deformity.'
    explanation: Gives the anatomical distribution and the typical presentation.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.09
  notes: Estimated prevalence 0.9 per million.
  evidence:
  - reference: PMID:41938408
    reference_title: A case report and literature review of pediatric multifocal melorheostosis in a unilateral
      limb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Melorheostosis (Léri-Joanny syndrome) is a rare, nonhereditary, congenital sclerotic
      bone dysplasia with an estimated prevalence of 0.9 per million.'
    explanation: Gives the estimated population prevalence.
has_subtypes:
- name: MAP2K1-related
  display_name: MAP2K1-related (classic dripping candle wax)
  description: >-
    Somatic activating mutations clustering in the MEK1 negative regulatory
    domain, producing the classic cortical dripping candle wax pattern.
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The activating mutations (Q56P, K57E and K57N) cluster tightly in the MEK1 negative
      regulatory domain.'
    explanation: Names the recurrent alleles and their shared location in the negative regulatory
      domain.
- name: SMAD3-related
  display_name: SMAD3-related (endosteal pattern)
  description: >-
    Somatic activating SMAD3 mutations producing an endosteal rather than cortical
    dripping pattern, and an opposite cellular phenotype.
  evidence:
  - reference: PMID:32232430
    reference_title: Somatic SMAD3-activating mutations cause melorheostosis by up-regulating the TGF-β/SMAD
      pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We now report somatic SMAD3 mutations in bone lesions of four unrelated patients
      with endosteal pattern melorheostosis.'
    explanation: Establishes the gene and ties it specifically to the endosteal radiographic
      pattern.
pathophysiology:
- name: Post-zygotic Somatic Mutation in Skeletal Tissue
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion, and the reason this disease looks the way it does. The
    mutation arises after fertilisation and is confined to a clone of cells, so it
    is present in affected bone and absent from unaffected bone in the same
    patient. Mosaicism extends to the skin overlying the lesions in most patients
    tested, which is consistent with a progenitor mutated early enough to populate
    more than one tissue.
  genes:
  - preferred_term: MAP2K1
    term:
      id: hgnc:6840
      label: MAP2K1
  - preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
      but not unaffected, bone of eight unrelated patients with melorheostosis.'
    explanation: The affected-versus-unaffected contrast within the same patient is what
      establishes somatic mosaicism rather than germline disease.
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Mosaicism is also detected in the skin overlying bone lesions in four of five patients
      tested.'
    explanation: Extends the mosaic clone beyond bone into overlying skin, which bears on how
      early the mutation arose.
  downstream:
  - target: MEK1-ERK Pathway Hyperactivation
    causal_link_type: DIRECT
    description: An activating mutation in the MEK1 negative regulatory domain releases the kinase
      from autoinhibition.
    evidence:
    - reference: PMID:29643386
      reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Affected bone displays a mosaic pattern of increased p-ERK1/2 in osteoblast
        immunohistochemistry.'
      explanation: Shows the pathway output raised in affected bone, and mosaically, matching the
        genetic finding.
  - target: TGF-beta-SMAD3 Pathway Hyperactivation
    causal_link_type: DIRECT
    description: An activating SMAD3 mutation raises signalling through the TGF-beta pathway in
      the alternative arm.
    evidence:
    - reference: PMID:32232430
      reference_title: Somatic SMAD3-activating mutations cause melorheostosis by up-regulating the TGF-β/SMAD
        pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In vitro, the SMAD3 mutations stimulated the TGF-β pathway in osteoblasts, enhanced
        nuclear translocation and target gene expression, and inhibited proliferation.'
      explanation: Demonstrates pathway activation and nuclear translocation for the mutant
        protein.
- name: MEK1-ERK Pathway Hyperactivation
  biological_scale: MOLECULAR
  subtypes:
  - MAP2K1-related
  description: >-
    Constitutive ERK1/2 signalling in the mutant osteoblast clone, demonstrable as
    two populations of differing p-ERK level within the same bone.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Osteoblasts cultured from affected bone comprise two populations with distinct
      p-ERK1/2 levels by flow cytometry, enhanced ERK1/2 activation, and increased cell
      proliferation.'
    explanation: Two distinct populations in one culture is the cellular signature of mosaicism,
      measured directly.
  downstream:
  - target: Osteoblast Overproliferation with Impaired Mineralisation
    causal_link_type: DIRECT
    description: ERK activation raises proliferation while blocking BMP2-driven differentiation
      and mineralisation.
    evidence:
    - reference: PMID:29643386
      reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'However, these MAP2K1 mutations inhibit BMP2-mediated osteoblast mineralization
        and differentiation in vitro, underlying the markedly increased osteoid detected in affected
        bone histology.'
      explanation: The authors' own "however" marks the paradox this edge carries - an activating
        oncogenic mutation that impairs rather than enhances mineralisation.
- name: TGF-beta-SMAD3 Pathway Hyperactivation
  biological_scale: MOLECULAR
  subtypes:
  - SMAD3-related
  description: >-
    Constitutive TGF-beta/SMAD signalling in the alternative arm, with enhanced

- name: Increased RANKL/OPG Ratio in Affected Bone
  biological_scale: MOLECULAR
  subtypes:
  - MAP2K1-related
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Osteoblasts from affected bone carry a markedly increased ratio of RANKL to
    osteoprotegerin transcripts. RANKL drives osteoclast differentiation and bone
    resorption, so the shift predicts increased osteoclastic remodelling within the
    lesion and is the join point for any therapy acting on bone turnover. The
    direction of causation is not established: the source raises the alternative
    that the shift is compensatory for the dense bone rather than contributing to
    it, which is why mechanism_confidence is HYPOTHETICAL and why the alternative
    is recorded as its own evidence item rather than omitted.

      explanation: Describes the cortical abnormality recorded by this phenotype.
  - target: Skeletal Muscle Atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Restricted movement leads to disuse, and disuse to muscle atrophy. The
      intermediate is stated in the source rather than inferred, which is what distinguishes this
      from a primary myopathy.
    evidence:
    - reference: PMID:31485554
      reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Eight patients had muscle atrophy from disuse.'
      explanation: Attributes the atrophy to disuse, which places it downstream of the restricted
        movement rather than beside it.
phenotypes:
- category: Skeletal
  name: Abnormal Cortical Bone Morphology
  frequency: OBLIGATE
  description: >-
    Irregular cortical hyperostosis, classically in the dripping candle wax
    pattern, though not every case shows it. This is the defining finding and the
    basis of diagnosis.
  phenotype_term:
    preferred_term: Abnormal cortical bone morphology
    term:
      id: HP:0003103
      label: Abnormal cortical bone morphology
    onset:
      onset_category: CHILDHOOD
      notes: Half of patients are diagnosed by age 20, so onset is recorded as childhood while
        noting that diagnosis in adulthood is common and that the somatic mutation is present
        from before birth. PMID:31485554 states that most patients present in childhood or
        adolescence, with 50 percent diagnosed by age 20 years.
  diagnostic: true
  evidence:
  - reference: PMID:25343102
    reference_title: Melorheostosis and a review of the literature in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The characteristic radiographic appearance consists of irregular hyperostotic changes
      of the cortex resembling melted wax dripping down the side of a candle.'
    explanation: Gives the characteristic cortical appearance.
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Diagnosis typically relies on X-rays, although not all cases exhibit the classic
      candle wax appearance.'
    explanation: Qualifies the classic sign, which matters because its absence does not exclude
      the diagnosis.
- category: Skeletal
  name: Bone Pain
  frequency: FREQUENT
  description: >-
    Local pain, the commonest symptomatic complaint, though the disease is
    sometimes found incidentally.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
  evidence:
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It can often be an incidental discovery, with patients experiencing associated pain
      and deformities.'
    explanation: Names pain and deformity, and records that presentation may equally be
      incidental.
- category: Musculoskeletal
  name: Flexion Contracture
  description: >-
    Joint contracture from the soft tissue component of the lesion, recorded
    prospectively in the natural history cohort alongside pain and restricted
    range of motion.
  phenotype_term:
    preferred_term: Flexion contracture
    term:
      id: HP:0001371
      label: Flexion contracture
  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patients present with pain, deformities, contractures, range of motion limitation(s),
      and limb swelling.'
    explanation: Enumerates the presenting features in a prospectively recruited cohort, which is
      stronger than the case-report literature this disease otherwise rests on.
- category: Musculoskeletal
  name: Limitation of Joint Mobility
  frequency: FREQUENT
  description: >-
    Restricted joint motion and limb stiffness where the lesion and its soft
    tissue component cross a joint.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Motor exam showed restriction of joint movement due to bony growth in 16 patients.'
    explanation: Sixteen of thirty on examination, which grounds the FREQUENT band on a
      denominator rather than on a qualitative description.
  - reference: PMID:25343102
    reference_title: Melorheostosis and a review of the literature in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Melorheostosis is an uncommon, non-genetic, non-developmental, sclerosing dysplasia
      of bone and adjacent soft tissues, with deformity of the extremity, pain, limb stiffness
      and limitation of motion.'
    explanation: Names limb stiffness and limitation of motion.
- category: Dermatologic
  name: Skin Changes Overlying Affected Bone
  frequency: FREQUENT
  description: >-
    Skin changes confined to the segment overlying the melorheostotic bone, most
    often irregular macular erythema without surface change. The segmental
    distribution is the informative part: the skin follows the same somatic clone
    as the bone, which is why the finding tracks the lesion rather than appearing
    generally.
  phenotype_term:
    preferred_term: Erythema
    term:
      id: HP:0010783
      label: Erythema
  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Skin abnormalities overlying the affected bone lesions were identified in 16 of 30
      patients (53%).'
    explanation: Gives the denominator, 16 of 30, which is what places this in the FREQUENT band
      rather than resting on a qualitative term.
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Of 16 patients, 9 (56%) patients’ skin findings manifested as vascular changes, most

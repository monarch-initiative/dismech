name: Melorheostosis
creation_date: '2026-09-08T17:00:00Z'
description: >-
  A rare sclerosing bone dysplasia in which excess cortical bone accumulates in a
  striking asymmetric, segmental pattern classically likened to wax dripping down
  a candle. It is not inherited. The cause is a post-zygotic somatic mutation
  present only in affected tissue, which is why the disease stops at a boundary
  on the limb and why blood testing is uninformative. Two genes are established
  and they produce different radiographic patterns by opposite cellular routes:
  activating MAP2K1 mutations drive ERK signalling, increase osteoblast
  proliferation and impair mineralisation, leaving abundant unmineralised osteoid;
  activating SMAD3 mutations drive TGF-beta signalling, inhibit proliferation and
  enhance mineralisation. Both converge on excess bone. The historical explanation
  for the segmental distribution, that lesions follow sclerotomes, has been tested
  directly and largely fails.
categories:
- Sclerosing Bone Dysplasia
- Somatic Mosaic Disorder
- Skeletal Overgrowth Disorder
parents:
- osteochondrodysplasia
synonyms:
- Leri disease
- melorheostosis, isolated, somatic mosaic
- mixed sclerosing bone dystrophy
epidemiology:
- name: Reported case count
  description: >-
    About 400 cases had been reported in the century after its first description,
    almost all as single reports or small series, which is the main constraint on
    everything else known about it.
  evidence:
  - reference: PMID:28676968
    reference_title: 'Melorheostosis: a Rare Sclerosing Bone Dysplasia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Since its first description in 1922, about 400 cases of melorheostosis have been
      reported, either as single reports or in small case series.'
    explanation: Gives the total reported experience and the study designs it rests on.
- name: Skeletal distribution
  description: >-
    The appendicular skeleton is affected more often than the axial, and lower
    limb deformity is the usual presentation.
  evidence:
  - reference: PMID:28676968
    reference_title: 'Melorheostosis: a Rare Sclerosing Bone Dysplasia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Melorheostosis affects the appendicular skeleton more commonly than the axial skeleton
      and usually presents with lower limb deformity.'
    explanation: Gives the anatomical distribution and the typical presentation.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.09
  notes: Estimated prevalence 0.9 per million.
  evidence:

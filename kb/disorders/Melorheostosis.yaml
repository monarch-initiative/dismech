    explanation: Imaging confirmation of the compression mechanism rather than inference from the
      sensory findings.
  - reference: PMID:30989250
    reference_title: "Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Surgical intervention may be required for those with large bone growths, nerve
      entrapments, joint impingement syndromes or major limb deformities.'
    explanation: Independent source naming nerve entrapment as a surgical indication, which is why
      it is curated separately from the broader sensory deficit.
- category: Musculoskeletal
  name: Localized Soft Tissue Swelling
  frequency: FREQUENT
  description: >-
    Swelling of the affected limb segment, listed among the common presenting
    features. Recorded separately from the bone lesion because it involves the
    soft tissue envelope, which the somatic clone also affects.
  phenotype_term:
    preferred_term: Localized soft-tissue swelling on extremity
    term:

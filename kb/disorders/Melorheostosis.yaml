disease_term:
  preferred_term: melorheostosis
  term:
    id: MONDO:0007970
    label: melorheostosis
notes: >-
  Why two arms converge on one disease. MAP2K1 and SMAD3 both cause
  melorheostosis, but by opposite cellular routes. The MAP2K1 arm raises
  osteoblast proliferation and impairs mineralisation, so the excess bone is
  largely unmineralised osteoid. The SMAD3 arm suppresses proliferation and
  enhances mineralisation, so affected bone is more mineralised than unaffected
  bone. They also produce different radiographic patterns, cortical dripping
  versus endosteal. Modelling them as separate arms rather than a single
  "increased bone formation" node preserves that, and the subtypes slot on each
  node records which arm it belongs to.

  A recorded negative that matters clinically. LEMD3 is carried as DISPUTED with
  REFUTE evidence. It is genuinely causative for osteopoikilosis and
  Buschke-Ollendorff syndrome, and melorheostosis-like lesions occur in those
  conditions, which is why the association persists. But sequencing of blood,
  skin and bone from a patient with isolated melorheostosis found nothing, and
  reviews conclude it is not the causative gene. Buschke-Ollendorff syndrome is a
  separate entity, has an open curation issue assigned to another curator, and is
  deliberately not modelled here.

  A deprecated hypothesis retained on purpose. The sclerotome account of the
  segmental distribution was tested by whole body CT in thirty patients and only
  17% conformed to a single sclerotome. It is recorded with status DEPRECATED and
  REFUTE evidence rather than omitted, because reviews published after that test
  still state a sclerotomal distribution as fact, and a curator meeting that
  claim should be able to find the evidence against it from this entry.

  Testing implication of mosaicism. The mutations are present in affected bone
  and absent from unaffected bone in the same patient. A blood sample will
  therefore be negative, and this is a property of the disease rather than a
  limitation of any assay. It is stated in the genetic notes because it changes
  what a clinician should order.

  A correction made before submission. This entry initially recorded that no
  quotable prevalence figure existed. It does - an estimated 0.9 per million -
  and the deep-research job surfaced it from a paper the draft had not fetched.
  That is the third time in this series that a claim of "no figure available" has
  turned out to be a claim about my search rather than about the literature, so
  it is recorded here rather than quietly replaced.

  Review round 2 added the RANKL/OPG limb, which is the one piece of molecular
  biology in this entry that connects to a drug class already in use. Osteoblasts
  from affected bone carry a markedly increased RANKL to osteoprotegerin ratio,
  RANKL drives osteoclast differentiation, and bisphosphonates act on the
  osteoclast - so that node, not the hyperostosis, is where bisphosphonate therapy
  attaches. The node is HYPOTHETICAL and its downstream link is UNKNOWN, because
  the same sentence that reports the ratio raises the possibility that it is
  compensatory for the dense bone rather than contributing to it. That caveat is
  carried as its own evidence item on the node and again on the RANKL inhibition
  treatment, so a reader cannot meet the proposal without it.

  Review round 1, and the pattern it exposed. The reviewer found that the entry
  under-consumed references this branch had already cached, and was right about
  every item. The natural history cohort at PMID:31485554 was the worst case: one
  sentence was quoted from it three times while the same full text carried
  denominators for skin change (16 of 30), sensory deficit (77 percent), nerve
  entrapment (five patients) and muscle atrophy (eight patients), plus the
  diagnosis-by-age-20 figure, the normal-biochemistry finding, the neuropathic
  pain recommendation and the trial registration. All are now consumed. The
  previous paragraph here listed skin and soft tissue involvement as an
  "extension point", which is not a scoping rationale when the evidence is
  already in the repository; both are now curated phenotypes.

  The frequency bands added in this round rest on denominators from the cohort
  rather than on qualitative terms, with one exception. Limb swelling has no count
  in any cached source and is banded FREQUENT from the framing "patients present
  with", with that basis stated in its evidence explanation rather than left
  implicit.

  The bundled treatment node is split. It previously described "conservative
  measures or surgery" while carrying therapeutic_modality SURGERY, which made the
  tag contradict its own content. There are now four treatments: surgery,
  physical therapy, bisphosphonates and gabapentinoids for the neuropathic
  component. The bisphosphonate entry records that definitive guidance on its use
  is lacking, quoted from the source, because a treatment being used is not the
  same as a treatment being established.

  Normal bone biochemistry is recorded as a diagnosis entry with presence ABSENT.
  A negative finding is worth curating here because it separates melorheostosis
  from the metabolic sclerosing bone diseases that produce a similar radiographic
  impression, and because it is what a disease driven by a segmental somatic clone
  should look like.

  Malignant transformation, stated because the reassurance is as useful as the
  risk. Melorheostotic bone lesions do not metastasise, and conversion to
  osteosarcoma has been reported only rarely. The natural history cohort notes at
  least three case reports of malignancy but says it is not clear whether the
  osteosarcoma arose in the precise distribution of the melorheostosis in any of
  them. That is well under the threshold at which a phenotype would be curated,
  and it is recorded here rather than as a phenotype for that reason.

  Two treatments here are proposals rather than practice. MEK inhibition and
  RANKL inhibition are both curated because the reasoning behind them is part of
  what the molecular work bought, and because the RANKL proposal comes with its
  own caveat in the same sentence that makes it. Neither has a treated patient in
  any cached source, and both descriptions say so. Nifedipine appears in one
  cached source as having produced symptomatic improvement in pain and vasomotor
  function; it is not curated as a treatment because the mention carries no
  denominator, no outcome measure and no mechanism beyond vasoconstriction, and
  the same source says it would not alter disease progression.

  Known extension points: malignant fibrous histiocytoma, reported in association
  but not described in any cached source here; animal and iPSC models, which the
  review suggested but which no cached reference describes, so adding them would
  mean fetching PMIDs that appear only in the deep-research report; and
  Buschke-Ollendorff syndrome, which belongs in its own entry.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check, recorded alongside this entry. Content_type
  was checked before writing, and after review round 1 the full texts were mined
  again rather than trusted to have been mined the first time.

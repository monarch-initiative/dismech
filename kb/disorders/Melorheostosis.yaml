    reference_title: Melorheostosis and a review of the literature in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The characteristic radiographic appearance consists of irregular hyperostotic changes
      of the cortex resembling melted wax dripping down the side of a candle.'
    explanation: Describes the radiographic lesion that defines the disease.
  - reference: PMID:30218789
    reference_title: CT analysis of anatomical distribution of melorheostosis challenges the sclerotome hypothesis.

genetic:
- name: MAP2K1
  gene_term:
    preferred_term: MAP2K1
    term:
      id: hgnc:6840
      label: MAP2K1
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  association: Somatic Mosaic Activating Mutation
  notes: >-
    Recurrent alleles Q56P, K57E and K57N cluster in the MEK1 negative regulatory
    domain, and a further variant in the catalytic domain, C121S, has since been
    reported. Testing must be on affected tissue: the variants are absent from
    unaffected bone in the same patient, so a blood sample will not find them.
    MAP2K1 accounts for about half of sporadic cases, and the sources state
    further locus heterogeneity, so a negative result on affected tissue does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
      but not unaffected, bone of eight unrelated patients with melorheostosis.'
    explanation: Establishes causation and the tissue-restricted distribution that dictates how
      testing must be done.
  - reference: PMID:29643386
    reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'strongly support MAP2K1 somatic mutations as causing about half of cases of sporadic
      melorheostosis.'
    explanation: Supports causation while bounding it at about half of sporadic cases, which is
      what makes a negative MAP2K1 result uninformative rather than exclusionary.
  - reference: PMID:32387835
    reference_title: A multi-omics approach expands the mutational spectrum of MAP2K1-related melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our observations confirm that mutations in MAP2K1 are a major cause of melorheostosis
      and also suggest further locus heterogeneity for this disorder.'
    explanation: An independent statement of locus heterogeneity, which together with the previous
      item is why the genetic notes now say a negative result does not exclude the diagnosis.
  - reference: PMID:32387835
    reference_title: A multi-omics approach expands the mutational spectrum of MAP2K1-related melorheostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'WGS and RNAseq analysis in a third patient demonstrated the presence of a novel variant
      (p.Cys121Ser) in the catalytic domain of MAP2K1.'
    explanation: Independent replication that also extends the mutational spectrum beyond the
      original hotspot.
- name: SMAD3
  gene_term:
    preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  association: Somatic Activating Mutation in Endosteal Pattern Disease
  notes: >-
    Worth contrasting with germline SMAD3 disease. Loss-of-function SMAD3
    mutations cause Loeys-Dietz syndrome type 3, in which bone is undermineralised
    and fragile. Somatic gain-of-function SMAD3 mutations here produce the
    opposite, overmineralised excess bone. The gene, the tissue and the direction
    of the mutation together determine the phenotype.
  evidence:
  - reference: PMID:32232430
    reference_title: Somatic SMAD3-activating mutations cause melorheostosis by up-regulating the TGF-β/SMAD
      pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We now report somatic SMAD3 mutations in bone lesions of four unrelated patients with
      endosteal pattern melorheostosis.'
    explanation: Establishes the gene and its association with the endosteal pattern.
  - reference: PMID:35874167
    reference_title: SMAD3 mutation in LDS3 causes bone fragility by impairing the TGF-β pathway and enhancing
      osteoclastogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Bone histomorphometry revealed markedly reduced cortical thickness (-68 %), trabecular
      thickness (-32 %), bone formation rate (-50 %) and delayed mineralization.'
    explanation: The germline loss-of-function contrast. This is a different disease, cited to show
      that the same gene in the opposite direction gives thin, undermineralised bone rather than
      excess bone.
- name: LEMD3
  gene_term:
    preferred_term: LEMD3
    term:
      id: hgnc:28887
      label: LEMD3
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  association: Causes Osteopoikilosis and Buschke-Ollendorff Syndrome, Not Isolated Melorheostosis
  notes: >-
    Recorded as a negative. LEMD3 was long implicated because melorheostosis-like
    lesions occur in Buschke-Ollendorff syndrome, but direct sequencing of blood,
    skin and bone from a patient with isolated melorheostosis found no pathogenic
    change, and reviews conclude it is not the causative gene for the sporadic
    disease. Buschke-Ollendorff syndrome is a distinct entity and is not curated
    here.
  evidence:
  - reference: PMID:19438932
    reference_title: Novel and recurrent germline LEMD3 mutations causing Buschke-Ollendorff syndrome and
      osteopoikilosis but not isolated melorheostosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The search for mutations in DNA extracted from the peripheral blood, as well as skin
      and bone biopsies of the patient with melorheostosis failed to identify any pathogenic
      change.'
    explanation: A direct negative in the right tissues, which is why this gene is recorded as
      disputed rather than causative.
  - reference: PMID:28676968
    reference_title: 'Melorheostosis: a Rare Sclerosing Bone Dysplasia.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'LEM domain-containing protein 3 (LEMD3) gene mutations have been demonstrated in
      several familial cases, but these have been more strongly correlated with other hereditary
      dysplasias, such as osteopoikilosis, and are not thought to be the causative gene for
      melorheostosis.'
    explanation: Review-level conclusion that this gene is not causative for melorheostosis.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  association: Somatic Activating Mutation in a Minority of Cases
  notes: >-
    A third somatic gene in the same pathway family, reported in a small number of
    cases. Its existence supports the general model - a somatic activating
    mutation in a growth-signalling pathway within a skeletal clone - rather than
    any one gene being essential.
  evidence:
  - reference: PMID:30989250
    reference_title: 'Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recent studies of melorheostosis lesional tissue indicate that most cases arise from
      somatic MAP2K1 mutations although a small number may arise from other genes in related
      pathways, such as KRAS.'
    explanation: Establishes KRAS as an additional somatic gene and places it as a minority cause
      alongside MAP2K1.
  - reference: PMID:30989250
    reference_title: 'Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Those cases associated with MAP2K1 mutations are more likely to have the classic
      "dripping candle wax" appearance on radiographs.'
    explanation: A genotype-phenotype correlation supporting the separation of arms by gene, which
      is how the subtypes in this entry are organised.
mechanistic_hypotheses:
- hypothesis_group_id: somatic_mosaic_clone
  hypothesis_label: Somatic Mosaic Clone Determines the Segmental Distribution
  status: CANONICAL
  description: >-
    The distribution reflects the territory occupied by the descendants of a
    single mutated progenitor. This follows from the genetics rather than from
    anatomy, and it accounts for the sharp boundary, the restriction to one side
    of a limb, and the involvement of overlying skin.
  evidence:
  - reference: PMID:30218789
    reference_title: CT analysis of anatomical distribution of melorheostosis challenges the sclerotome hypothesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We believe that the disease distribution can be explained by clonal proliferation
      of a mutated skeletal progenitor cell along the limb axis. Studies in mice models on clonal
      proliferation in limb buds mimic the patterns seen in melorheostosis.'
    explanation: The authors propose a clonal explanation in place of the sclerotome account, and
      cite limb-bud clonal proliferation in mice as producing comparable patterns.
- hypothesis_group_id: sclerotome_hypothesis
  hypothesis_label: Sclerotomal Distribution
  status: DEPRECATED
  description: >-
    The historical account, that lesions occupy the bone territory innervated by a
    single spinal nerve level. It was tested directly by whole body CT in thirty
    patients and largely failed: only 17% conformed to a single sclerotome.
    Retained here because it is still widely repeated, including in reviews
    published after the test.
  evidence:
  - reference: PMID:30218789
    reference_title: CT analysis of anatomical distribution of melorheostosis challenges the sclerotome hypothesis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'We found that the disease distribution conformed to the distribution of a single
      sclerotome in only 5 patients (17%). In another 12 patients, the lesions spanned parts of
      contiguous sclerotomes but did not involve the entire extent of the sclerotomes.'
    explanation: Direct quantitative test of the hypothesis in thirty patients, with the great
      majority not conforming.
  - reference: PMID:30218789
    reference_title: CT analysis of anatomical distribution of melorheostosis challenges the sclerotome hypothesis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our findings raise concerns about the sclerotomal hypothesis being the definitive
      explanation for the pattern of anatomic distribution in MEL.'
    explanation: The authors' own conclusion against the hypothesis.
  notes: >-
    Marked DEPRECATED rather than deleted because it is still stated as fact in
    the review literature, including PMID:28676968, which describes a sclerotomal
    distribution. A curator meeting that claim should be able to find the test
    that contradicts it.
diagnosis:
- name: Radiographic diagnosis
  presence: PRESENT
  description: >-
    Diagnosis rests on imaging. There is no definitive histological feature, so
    biopsy resolves uncertainty rather than confirming the diagnosis, and genetic
    testing requires affected tissue rather than blood.
  evidence:
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A biopsy may be necessary in cases of uncertainty, as there is not a definitive
      histological feature.'
    explanation: States both the role of biopsy and the absence of a defining histological
      feature.
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A new imaging sign known as the "dumpling on a plate sign" has been proposed for flat
      bones for both MRI and CT scans.'
    explanation: Records a newer sign for flat bones, where the candle wax appearance does not
      apply.
- name: Normal bone biochemistry
  presence: ABSENT
  description: >-
    Bone turnover markers and mineral chemistry are normal. This is a negative
    finding recorded because it is diagnostically useful: it separates
    melorheostosis from the metabolic sclerosing bone diseases that produce a
    similar radiographic impression, and it fits a disease driven by a somatic
    clone confined to one segment rather than by a systemic derangement.
  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'However, we did not find any biochemical abnormalities characteristic of the
      disease.'
    explanation: The prospective cohort looked for biochemical abnormality and found none.
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Additional support can be obtained through normal serum calcium, phosphorus, and
      alkaline phosphatase levels,'
    explanation: States which normal values support the diagnosis, which is what makes the
      negative finding useful rather than merely unremarkable.
treatments:
- name: Surgical Management
  therapeutic_modality: SURGERY
  description: >-
    Excision of bone overgrowth, release of contracture, or decompression of an
    entrapped nerve. Recurrence after excision is a recognised problem, which is
    unsurprising given that the causative somatic clone remains in place.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pain, Deformity and Restricted Movement
    treatment_effect: MODULATES
    description: Addresses the mechanical consequences of the lesion without altering the somatic
      mutation that produces it.
    evidence:
    - reference: PMID:30989250
      reference_title: "Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Surgical intervention may be required for those with large bone growths, nerve
        entrapments, joint impingement syndromes or major limb deformities.'
      explanation: Names the four mechanical indications, each of which is a consequence of the
        lesion rather than of the mutation.
  evidence:
  - reference: PMID:38978887
    reference_title: "Melorheostosis (Leri's Disease): A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Management is generally aimed at symptom relief, either through conservative measures
      or surgical intervention.'
    explanation: Places surgery as one of two arms of symptomatic management, not as
      disease-modifying therapy.
- name: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  description: >-
    Part of conventional management alongside surgery and bisphosphonates, aimed
    at range of motion and at the disuse that drives the muscle atrophy.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Pain, Deformity and Restricted Movement
    treatment_effect: MODULATES
    description: Targets restricted movement and its downstream disuse consequences rather than
      the bone lesion.
    evidence:
    - reference: PMID:28676968
      reference_title: "Melorheostosis: a Rare Sclerosing Bone Dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Management in recent years has involved nitrogen-containing bisphosphonates in
        addition to traditional orthopedic surgical approaches and physical therapy.'

- name: Segmental Cortical Hyperostosis
  biological_scale: TISSUE
  description: >-
    Excess bone confined to a segment of the skeleton, classically as irregular
    cortical thickening resembling wax dripping down a candle, and often with
    involvement of the adjacent soft tissue. The segmental boundary is a
    consequence of mosaicism, though the historical explanation for its precise
    shape does not survive testing.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification

- category: Cardiovascular
  name: Hypervascularity of Affected Bone
  frequency: FREQUENT
  description: >-
    Marked hypervascularity of the cortex and adjacent soft tissue in half the
    natural history cohort, seen on ultrasound, on bone histology and on
    18F-NaF PET/CT. HPO has no term for increased vascularity of bone, so this

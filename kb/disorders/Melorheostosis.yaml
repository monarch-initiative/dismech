    evidence_source: HUMAN_CLINICAL
    snippet: 'The finding of markedly increased ratio of RANKL/OPG transcripts in osteoblasts
      from affected bone in patients with MAP2K1-positive melorheostosis raises the possibility
      of using RANKL inhibitors in these patients,'
    explanation: Measures the transcript ratio in osteoblasts from affected bone and states the

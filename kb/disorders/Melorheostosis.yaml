    segmental distribution is what distinguishes it from an incidental
    neuropathy.
  phenotype_term:
    preferred_term: Somatic sensory dysfunction
    term:
      id: HP:0003474
      label: Somatic sensory dysfunction
  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Neurological clinical evaluation showed all 30 patients reporting pain symptomology
      with 77% patients with confirmed sensory deficit in the distribution of melorheostosis on

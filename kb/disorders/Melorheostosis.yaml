  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Three additional ultrasound studies showed either displacement or swelling of a nerve

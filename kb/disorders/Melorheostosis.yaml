  evidence:
  - reference: PMID:31485554
    reference_title: Clinical Evaluation of Melorheostosis in the Context of a Natural History Clinical Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Electrophysiological testing identified isolated neuropathy in 43% patients (12/28
      patients tested, with six sensory neuropathies and six mixed motor neuropathies) in the
      distribution of melorheostosis'
    explanation: An objective electrodiagnostic figure, 12 of 28 tested, alongside the five
      patients with imaging-confirmed entrapment. The two numbers measure different things, so

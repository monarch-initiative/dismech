      Sequence analysis of two genes located in the critical region identified
      the founder HMSNL mutation: a premature-termination codon at position 148
      of the N-myc downstream-regulated gene 1 (NDRG1).
    explanation: >-
      Identifies the founder truncating allele as the cause of HMSNL/CMT4D.
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-two pathogenic NDRG1 variants were documented, with p.(Arg148*)
      being most frequent (64% of patients), predominantly in Roma populations.
    explanation: >-
      Quantifies the allelic spectrum across the published literature and the
      dominance of the founder allele within it.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional characterization of these novel variants implicates a
      loss-of-function mechanism due to shorter gene products.
    explanation: >-
      Establishes loss of function as the mechanism for the splice-site alleles,
      not only for the founder nonsense allele.
  - reference: PMID:28776325
    reference_title: "Identification and functional characterization of two missense mutations in NDRG1 associated with Charcot-Marie-Tooth disease type 4D."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell culture transfection studies showed that mutant NDRG1 carrying
      p.Leu146Pro, p.Arg148*, or p.Arg234Gln variant degraded faster than
      wild-type NDRG1, resulting in lower protein levels.
    explanation: >-
      Shows that the missense alleles reduce NDRG1 abundance, extending the
      loss-of-function mechanism beyond truncating variants.

- name: Early Severe Axonal Loss
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Severe axonal loss occurs early in human CMT4D and contributes to neurological disability. Human expression and pathology implicate impaired Schwann-cell support of axons, but the specific glia-to-axon causal route remains provisional. Mouse models reproduce demyelination but fail to reproduce the early severe axonal loss typical of patients. The Greyhound model has axonal pathology, although its timing and proportionality relative to demyelination have not been established to the same standard. The peripheral-neuron target here does not imply that NDRG1 loss acts cell-autonomously in the axon.

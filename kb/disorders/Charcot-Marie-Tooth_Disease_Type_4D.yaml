name: Charcot-Marie-Tooth disease type 4D
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Charcot-Marie-Tooth disease type 4D (CMT4D), historically hereditary motor and
  sensory neuropathy-Lom (HMSNL), is an autosomal recessive, childhood-onset,
  severe demyelinating sensorimotor neuropathy caused by biallelic
  loss-of-function variants in NDRG1. It was first delineated in Roma families
  from the town of Lom in Bulgaria, where a single founder nonsense allele
  p.Arg148* accounts for most cases worldwide, but it is not a Roma-restricted
  disease: frameshift, splice-site, missense and exon-duplication alleles have
  since been reported in families of Italian, Turkish, Indian, Chinese, Saudi
  and Bulgarian Muslim origin. NDRG1 is expressed at very high levels in the
  Schwann cell and not detectably in axons, so the primary lesion is glial; what
  distinguishes CMT4D from other demyelinating CMT is that severe axonal loss
  appears early rather than as a late consequence of chronic demyelination,
  which is why the original gene-discovery work framed the disorder as a failure
  of axon-glia interaction rather than of myelin structure. Sensorineural
  deafness, usually emerging in the third decade, is the second defining
  feature. The molecular function of NDRG1 remains only partly understood; the
  leading account is a Schwann-cell vesicular-trafficking role that cannot meet
  the enormous membrane demand of myelin growth, and the neuregulin-1/ErbB
  evidence that would connect that defect to demyelination is so far entirely
  from mouse.

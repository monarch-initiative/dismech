  - reference: PMID:21303696
    reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The widespread large fibre demyelination coincides precisely with the
      period of rapid growth of the animals and the dramatic (160-500-fold)
      increase in myelin volume and length in large fibres.
    explanation: >-
      The timing observation that motivates the demand-mismatch account and
      explains the sparing of small fibres.
  - reference: PMID:21303696
    reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings do not support the proposed roles of NDRG1 in growth arrest,
      terminal differentiation, gene expression regulation and proteasomal
      degradation.
    explanation: >-
      Curated as REFUTE against the competing functional accounts of NDRG1, which
      is part of why trafficking is the leading hypothesis rather than one of
      several equals.
  downstream:
  - target: Myelin Sheath Breakdown with Onion Bulb Formation
- name: Attenuated Neuregulin 1-ErbB Signaling
  biological_scale: MOLECULAR
  role: mediator
  mechanism_confidence: PROVISIONAL
  description: >-
    Axonal neuregulin 1 signalling through Schwann-cell ErbB2/ErbB3 is the main
    route by which an axon instructs its Schwann cell how much myelin to make. In
    Ndrg1-deficient mice this pathway is decoupled in an informative way: ligand
    and receptor are not scarce - neuregulin 1 and total ErbB2/3 are both
    increased - yet the phosphorylated receptors and their downstream cascades
    are reduced, and integrin beta-4, the co-receptor that positively regulates
    the pathway, is markedly reduced. The lesion is therefore in receptor
    activation, not in ligand supply, which fits a trafficking defect that fails
    to present or maintain the receptor complex correctly at the Schwann-cell
    membrane. Marked PROVISIONAL for a specific reason: every one of these
    measurements comes from mouse sciatic nerve, and no equivalent has been shown
    in human CMT4D nerve. The same paper reports that its mouse does not
    reproduce the axonal loss that defines the human disease.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: ERBB signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038127
      label: ERBB signaling pathway
  evidence:
  - reference: PMID:35708320
    reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the absence of NDRG1, although the total ErbB2/3 receptors expressed by
      Schwann cells were significantly increased, levels of the phosphorylated
      forms of ErbB2/3 and their downstream signaling cascades were decreased.
    explanation: >-
      The central observation: receptor abundance up, receptor activation down.
  - reference: PMID:35708320
    reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This change was not associated with the level of the neuregulin 1 ligand,
      which was increased in Ndrg1-deficient mice.
    explanation: >-
      Excludes ligand scarcity as the explanation and localises the defect to the
      Schwann-cell receptor side.
  - reference: PMID:35708320
    reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

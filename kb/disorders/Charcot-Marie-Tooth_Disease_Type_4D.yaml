- name: Loss of Schwann Cell NDRG1 Function
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDRG1 is ubiquitously expressed, but in peripheral nerve it is concentrated
    in the Schwann cell, and immunofluorescence in mouse sciatic nerve localises
    it to S100-beta-positive Schwann cells with no signal in axons that are
    positive for neurofilament 200. Its expression is low before two postnatal weeks and rises
    thereafter, tracking the myelin proteins MPZ, MBP and PMP22 rather than
    preceding them. The cell-biological consequence of losing it is therefore
    glial and post-myelination rather than neuronal or developmental, which is
    the reason the disorder presents as demyelination of an initially normal
    nerve rather than as failure to myelinate at all.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have studied expression in peripheral nerve and have detected
      particularly high levels in the Schwann cell.
    explanation: >-
      Establishes Schwann-cell enrichment of NDRG1 in peripheral nerve.
  - reference: PMID:35708320
    reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the sciatic nerve, NDRG1 was restricted to S100β-positive Schwann cells
      but not detected in neurofilament 200-positive axons.
    explanation: >-
      Localises NDRG1 to the Schwann cell and excludes the axon, establishing the
      primary lesion as glial.
  - reference: PMID:35708320
    reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, NDRG1 was expressed at a low level before 2 weeks of age and at a
      high level after 2 weeks of age. This temporal expression pattern was
      similar to the myelin proteins
    explanation: >-
      Times NDRG1 expression to the myelination and myelin-maintenance period
      rather than to early Schwann-cell development.
  - reference: PMID:15082788
    reference_title: "Ndrg1-deficient mice exhibit a progressive demyelinating disorder of peripheral nerves."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In wild-type mice, NDRG1 was abundantly expressed in the cytoplasm of
      Schwann cells rather than the myelin sheath.
    explanation: >-
      Localises NDRG1 to the Schwann-cell cytoplasm rather than to myelin itself,
      which is why the disorder is not a structural myelin-protein disease.
  downstream:
  - target: Impaired Schwann Cell Vesicular Trafficking

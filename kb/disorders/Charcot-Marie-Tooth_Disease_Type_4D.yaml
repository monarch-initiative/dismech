  - target: Myelin Sheath Breakdown with Onion Bulb Formation
- name: Myelin Sheath Breakdown with Onion Bulb Formation
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The tissue lesion in CMT4D is demyelination of a nerve that myelinated
    normally to begin with. Human sural nerve shows marked depletion of
    myelinated fibres, thin myelin sheaths on the fibres that survive, and onion
    bulb formations; the surviving myelinated fibres are small and the onion
    bulbs poorly developed, which is reported as histologically distinctive.
    Nerve conduction studies show markedly reduced conduction velocities and
    prolonged distal latencies with absent sensory nerve action potentials. In
    the mouse the same lesion is dated precisely: nerves are normal at two weeks,
    begin to thin at four weeks when myelination would normally be complete, and
    deteriorate thereafter.

genetic:
- name: NDRG1
  gene_term:
    preferred_term: NDRG1
    term:
      id: hgnc:7679
      label: NDRG1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NDRG1 sits at 8q24.22 and encodes a 43-kDa protein of the alpha/beta
    hydrolase superfamily that is considered catalytically inactive; its
    structure comprises a central alpha/beta hydrolase fold flanked by a short N
    terminus and a C-terminal region of three ten-residue repeats whose
    conformation changes on lipid binding. It is ubiquitously expressed but
    unusually abundant in Schwann cells.

    Twenty-two pathogenic variants have been reported across 72 patients. The
    Roma founder allele p.Arg148* accounts for 64 percent of them, which is why
    ancestry is a useful prior in CMT genetic testing but not a gate: CMT4D has
    now been reported in families of Italian, Turkish, Indian, Chinese, Saudi and
    Bulgarian Muslim origin, and one Italian patient's novel frameshift allele
    prompted the explicit conclusion that CMT4D is not a private Romani disease.
    Two splice-acceptor alleles, c.538-1G>A and c.327-2A>G, are founder mutations
    in a second and distinct ethnic minority, the Bulgarian Muslims, on ancestral
    haplotypes of 2.4 and 9.6 Mb respectively.

    The allelic spectrum spans nonsense, frameshift, canonical splice-site,
    exon-duplication and missense classes. That breadth is mechanistically
    informative rather than incidental: the missense alleles p.Leu146Pro and
    p.Arg234Gln reduce NDRG1 protein abundance by accelerating its degradation
    rather than truncating it, so the disease can be produced by hypomorphic
    protein levels alone. Consistently, no genotype-phenotype partition within
    NDRG1 has been established - unlike genes such as BAG3 where allele class
    selects the tissue affected, every reported CMT4D allele produces the same
    demyelinating neuropathy with deafness.
  evidence:
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our systematic literature review identified 26 articles describing 72
      patients with CMT4D.
    explanation: >-
      Establishes the size of the published patient series underlying the
      allelic and phenotypic figures used in this entry.
  - reference: PMID:33305529
    reference_title: "Crystal and solution structure of NDRG1, a membrane-binding protein linked to myelination and tumour suppression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The 43-kDa NDRG1 is considered as an inactive member of the α/β hydrolase
      superfamily.
    explanation: >-
      States the protein's structural class and presumed catalytic inactivity.
  - reference: PMID:33305529
    reference_title: "Crystal and solution structure of NDRG1, a membrane-binding protein linked to myelination and tumour suppression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDRG1 binds to various types of lipid vesicles, and the conformation of the
      C-terminal region is modulated upon lipid interaction.
    explanation: >-
      Establishes lipid-vesicle binding, the structural counterpart of the
      trafficking role proposed for NDRG1 in the Schwann cell.
  - reference: PMID:27982524
    reference_title: "A novel NDRG1 mutation in a non-Romani patient with CMT4D/HMSN-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of this NDRG1 mutation confirms that CMT4D is not a
      private Romani disease and should be considered in the differential
      diagnosis of recessive demyelinating CMT.
    explanation: >-
      Establishes that ancestry must not be used to exclude CMT4D from the
      differential.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, two splice-site variants are exclusive to Bulgarian Muslims and
      reside in ancestral haplotypes, suggesting a founder effect.
    explanation: >-
      Establishes a second, independent founder effect in a different population.
  - reference: PMID:24136616
    reference_title: "Exonic duplication CNV of NDRG1 associated with autosomal-recessive HMSN-Lom/CMT4D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected an ~6.25 kb homozygous intragenic duplication in NDRG1, a gene
      known to be causative for recessive HMSNL/CMT4D, in three individuals from a
      Turkish family with CMT neuropathy.
    explanation: >-
      Establishes copy-number variation as a fifth allelic class in NDRG1,
      identified in a non-Roma Turkish family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate for CMT4D exists. The published literature
    totals 72 patients across 26 articles. The disorder is concentrated in Roma
    communities, where it is one of three CMT subtypes caused by founder
    mutations private to that population, and within a Bulgarian demyelinating
    CMT cohort of 150 index patients NDRG1 variants explained 15 patients from 11
    families - roughly seven percent of that ascertained, and therefore heavily
    enriched, series. That figure is a diagnostic yield within a selected cohort,
    not a population rate, and must not be read as one.
  evidence:
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our systematic literature review identified 26 articles describing 72
      patients with CMT4D.
    explanation: >-
      The total published case count, which is the only defensible occurrence
      figure for this disorder.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cohort consisted of 150 index Bulgarian patients with demyelinating CMT.
      We identified 15 patients from 11 families with recurrent or novel variants
      in the NDRG1 gene
    explanation: >-
      The diagnostic yield of NDRG1 testing within an ascertained demyelinating
      CMT cohort.
animal_models:
- name: Ndrg1 exon 4-5 knockout mouse
  species: Mouse
  genotype: Ndrg1-/- (CRISPR/Cas9 deletion of exons 4 and 5)
  publication: PMID:35708320
  description: >-
    A CRISPR-generated null mouse that develops early progressive demyelinating
    neuropathy and limb muscle weakness, with reduced motor nerve conduction
    velocity and compound muscle action potential amplitude by eight weeks. It is
    the model in which the neuregulin 1/ErbB findings were made.
  modeled_mechanisms:
  - target: Myelin Sheath Breakdown with Onion Bulb Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the demyelinating lesion with correct timing - normal at two
      weeks, thinning from four weeks when myelination would normally be
      complete, progressive thereafter, with occasional onion bulbs.
    limitations: >-
      The hypomyelination does not lead to apparent axonal loss, so the model
      reproduces the demyelination while missing the early severe axonal loss
      that produces disability in patients.
    readouts:
    - name: Sciatic nerve g-ratio
      target: Myelin Sheath Breakdown with Onion Bulb Formation
      direction: INCREASED
      interpretation: >-
        A raised g-ratio is the quantitative signature of thin myelin relative to
        axon calibre, confirming demyelinating rather than axonal pathology.
      evidence:
      - reference: PMID:35708320
        reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Quantitative analysis indicated that the G ratio of the nerve fibers was
          significantly increased inNdrg1−/−mice, suggesting the presence of
          demyelinating neuropathy
        explanation: >-
          Reports the g-ratio measurement supporting the demyelinating phenotype.
    evidence:
    - reference: PMID:35708320
      reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ndrg1-deficient mice develop early progressive demyelinating neuropathy
        and limb muscle weakness.
      explanation: >-
        Establishes the model as informative for the demyelinating node.
  - target: Early Severe Axonal Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining human feature - early severe axonal loss - is absent from this
      model despite otherwise faithful demyelination, and the authors say so
      explicitly.
    limitations: >-
      A shift in axonal size distribution occurs, but no apparent axonal loss.
      Any therapeutic result obtained in this model therefore speaks to the
      demyelinating arm only and cannot be assumed to address the axonal
      degeneration that causes disability in patients.
    evidence:
    - reference: PMID:35708320
      reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although a shift in the axonal size distribution was observed
        inNdrg1−/−mice, the hypomyelination did not lead to apparent axonal loss
      explanation: >-
        The authors' direct statement that axonal loss is absent from the model.
  - target: Attenuated Neuregulin 1-ErbB Signaling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The model is the sole source of the neuregulin 1/ErbB evidence in this
      entry: it is where receptor phosphorylation, ligand level and integrin
      beta-4 abundance were measured.
    limitations: >-
      No equivalent measurement exists in human CMT4D nerve, so the entire
      signalling arm of this entry's pathograph rests on this mouse.
    readouts:
    - name: Phosphorylated ErbB2/ErbB3 in sciatic nerve
      target: Attenuated Neuregulin 1-ErbB Signaling
      direction: DECREASED
      interpretation: >-
        Reduced receptor phosphorylation against increased total receptor is the
        measurement that localises the defect to receptor activation.
      evidence:
      - reference: PMID:35708320
        reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          levels of the phosphorylated forms of ErbB2/3 and their downstream
          signaling cascades were decreased
        explanation: >-
          The phosphorylation measurement underlying this readout.
    evidence:
    - reference: PMID:35708320
      reference_title: "Aberrant Neuregulin 1/ErbB Signaling in Charcot-Marie-Tooth Type 4D Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        our data suggest that the demyelinating phenotype of CMT4D disease is at
        least in part a consequence of molecular defects in neuregulin 1/ErbB
        signaling
      explanation: >-
        The authors' own hedged conclusion, which is the claim this link records.
- name: Stretcher mouse (spontaneous Ndrg1 null)
  species: Mouse
  genotype: Ndrg1 str/str (spontaneous total Ndrg1 deficiency)
  publication: PMID:21303696
  description: >-
    A spontaneous total Ndrg1-null mutant, compared directly against a hypomorphic
    Ndrg1 knockout. The comparison is the informative part: the markedly more
    severe stretcher phenotype implies that even low residual Ndrg1 expression
    rescues a large part of the phenotype, which is a dosage statement no single
    model could make.
  modeled_mechanisms:
  - target: Impaired Schwann Cell Vesicular Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is the basis of the trafficking-demand-mismatch hypothesis: its
      large-fibre demyelination coincides precisely with the period of rapid
      myelin growth and small fibres are spared, while gene expression profiling
      found only non-specific secondary changes and normal proteasomal function.
    limitations: >-
      The trafficking defect itself is not measured in this model; the inference
      rests on the timing and fibre-size selectivity of the lesion, and gene
      expression profiling was explicitly non-specific.
    evidence:
    - reference: PMID:21303696
      reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Impaired SC trafficking failing to meet the considerable demands of nerve
        growth, emerges as the likely pathogenetic mechanism in NDRG1 deficiency.
      explanation: >-
        The conclusion this model supports, stated as the authors state it.
  - target: Early Severe Axonal Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Neither the stretcher mouse nor the hypomorphic knockout reproduces the
      early severe axonal loss of human CMT4D. Axon damage occurs, but
      regenerative capacity is unimpaired.
    limitations: >-
      Because both models compared in that study fail at the same point, as does
      the independent CRISPR Ndrg1-/- mouse, no rodent model reconstructs the
      step from Schwann-cell NDRG1 loss to axonal degeneration, which constrains
      what preclinical work on this disorder can test. The canine model is
      deliberately excluded from that claim: it does show axonal pathology, and
      is treated separately in the HUMAN_MODEL_MISMATCH discussion.
    evidence:
    - reference: PMID:21303696
      reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neither model replicates fully the features of CMT4D: although axon damage
        is present, regenerative capacity is unimpaired and the mice do not
        display the early severe axonal loss typical of the human disease.
      explanation: >-
        The explicit statement that both rodent models fail to reproduce the
        defining human feature.
- name: Ndrg1 knockout mouse (Okuda)
  species: Mouse
  genotype: Ndrg1-/- (targeted knockout)
  publication: PMID:15082788
  description: >-
    The first published Ndrg1-null mouse, and the model the stretcher work later
    used as its hypomorphic comparator. Its contribution is a timing argument:
    sciatic nerve myelination is normal for the first two postnatal weeks and
    only then degenerates with demyelination at about five weeks, which separates
    myelin maintenance from myelin formation as the affected process.
  modeled_mechanisms:
  - target: Myelin Sheath Breakdown with Onion Bulb Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes progressive demyelination of an initially normally myelinated
      nerve, with Schwann-cell dysfunction as the proximate cause.
    limitations: >-
      Reported as a hypomorphic rather than complete null in the later
      head-to-head comparison with the stretcher mouse, and neither model in that
      comparison displays the early severe axonal loss of the human disease.
    readouts:
    - name: Sciatic nerve myelination timing
      target: Myelin Sheath Breakdown with Onion Bulb Formation
      direction: DECREASED
      interpretation: >-
        Normal myelination for two weeks followed by demyelination at five weeks
        is the readout that distinguishes maintenance failure from formation
        failure.
      evidence:
      - reference: PMID:15082788
        reference_title: "Ndrg1-deficient mice exhibit a progressive demyelinating disorder of peripheral nerves."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histological analysis showed that the sciatic nerve of Ndrg1-deficient
          mice degenerated with demyelination at about 5 weeks of age. However,
          myelination of Schwann cells in the sciatic nerve was normal for 2 weeks
          after birth.
        explanation: >-
          The histological timing measurement underlying this readout.
    evidence:
    - reference: PMID:15082788
      reference_title: "Ndrg1-deficient mice exhibit a progressive demyelinating disorder of peripheral nerves."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicate that NDRG1 deficiency leads to Schwann cell
        dysfunction, suggesting that NDRG1 is essential for maintenance of the
        myelin sheaths in peripheral nerves.
      explanation: >-
        States the conclusion this model supports - maintenance, not formation.
  - target: Early Severe Axonal Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      This model was one of the two compared head to head in PMID:21303696, and
      that comparison found neither reproduces the early severe axonal loss of
      human CMT4D.
    limitations: >-
      The failure is shared with the stretcher mouse and is the reason no rodent
      model reconstructs the axonal arm. It says nothing about the canine model,
      which does show axonal pathology.
    evidence:
    - reference: PMID:21303696
      reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neither model replicates fully the features of CMT4D: although axon damage
        is present, regenerative capacity is unimpaired and the mice do not
        display the early severe axonal loss typical of the human disease.
      explanation: >-
        The head-to-head comparison covering this model and the stretcher mouse,
        which is what makes this a structural FAILS_TO_RECAPITULATE link rather
        than a prose assertion inside a myelin link's limitations.
- name: Greyhound polyneuropathy (NDRG1 exon 15 deletion)
  species: Dog
  genotype: NDRG1 c.1080_1089delTCGCCTGGAC homozygous (p.Arg361SerfsX60)
  publication: PMID:20582309
  description: >-
    A naturally occurring canine model: juvenile Greyhound show dogs with a
    recessive polyneuropathy tracing to a single founder male, in which a ten-base
    deletion in NDRG1 exon 15 is perfectly associated with the phenotype and
    abolishes NDRG1 protein in peripheral nerve.
  modeled_mechanisms:
  - target: Progressive Demyelinating Sensorimotor Neuropathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces a severe chronic progressive polyneuropathy of juvenile onset on
      a recessive founder background, with NDRG1 protein absent from peripheral
      nerve on Western blot.
    limitations: >-
      The canine lesion is described as a mixed polyneuropathy rather than the
      predominantly demyelinating picture with early axonal loss seen in patients,
      and deafness - a defining human feature - is not reported in the affected
      dogs.
    evidence:
    - reference: PMID:20582309
      reference_title: "A deletion in the N-myc downstream regulated gene 1 (NDRG1) gene in Greyhounds with polyneuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Western blot analysis demonstrated an absence of NDRG1 protein in
        peripheral nerve biopsy of an affected Greyhound.
      explanation: >-
        Confirms loss of NDRG1 protein in the affected tissue, establishing the
        model as an NDRG1-null neuropathy.
    - reference: PMID:20582309
      reference_title: "A deletion in the N-myc downstream regulated gene 1 (NDRG1) gene in Greyhounds with polyneuropathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A severe chronic progressive mixed polyneuropathy was observed.
      explanation: >-
        Supports the model link indirectly: a severe chronic progressive
        polyneuropathy is the right general lesion, but a MIXED polyneuropathy is
        not the same thing as the human demyelinating neuropathy with early
        axonal loss, which is why the link is PARTIALLY_RECAPITULATES and the
        directness is INDIRECT.
treatments:
- name: Percutaneous Endoscopic Gastrostomy Feeding
  therapeutic_modality: SURGERY
  description: >-
    Enteral feeding via a PEG tube for the severe dysphagia that can develop in
    advanced CMT4D. This is curated because it was actually performed in reported
    CMT4D patients, not extrapolated from neuromuscular disease generally - bulbar
    involvement was unrecognised in CMT4D until the 2026 sibling report, and an
    entry that omitted it would leave swallowing off the surveillance list.
  treatment_term:
    preferred_term: percutaneous endoscopic gastrostomy
    term:
      id: NCIT:C106040
      label: Percutaneous Endoscopic Gastrostomy
  evidence:
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, they exhibited previously unreported features including severe
      dysphagia requiring PEG tube placement, bilateral vocal cord paralysis
      causing respiratory insufficiency necessitating non-invasive ventilation,
      and cognitive delay.
    explanation: >-
      Documents PEG placement as the intervention used for CMT4D dysphagia in the
      reported siblings.
- name: Non-Invasive Ventilation
  therapeutic_modality: DEVICE
  description: >-
    Non-invasive ventilation was used for respiratory insufficiency attributed to bilateral vocal cord paralysis in the reported Italian siblings.
  treatment_term:
    preferred_term: non-invasive mechanical ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  evidence:
  - reference: PMID:42089726
    reference_title: Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, they exhibited previously unreported features including severe dysphagia requiring PEG tube placement, bilateral vocal cord paralysis causing respiratory insufficiency necessitating non-invasive ventilation, and cognitive delay.
    explanation: >-
      Documents the reported findings in two adult siblings with homozygous p.Arg148*. It explicitly attributes respiratory insufficiency to bilateral vocal cord paralysis, but does not reconstruct the neuropathological cause of the bulbar or cognitive findings.
diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Nerve conduction studies establish the demyelinating character and its
    severity: markedly reduced conduction velocities, prolonged distal latencies
    including in cranial nerves, and absent sensory nerve action potentials.
    Needle EMG shows scattered fibrillation and neurogenic motor unit potentials,
    more pronounced distally, reflecting the accompanying axonal degeneration.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by markedly reduced conduction velocities and prolonged
      distal latencies of the motor nerves (including musculocutaneous, axillary,
      hypoglossal, and facial nerves), absent sensory nerve action potentials
      (SNAP), and a blink reflex with an unusual three-component response
    explanation: >-
      The full electrophysiological signature, including the cranial-nerve
      involvement and the unusual blink reflex.
- name: Brainstem Auditory Evoked Potentials
  description: >-
    Brainstem auditory evoked potentials are abnormal before patients report
    hearing loss, which makes them a presymptomatic marker of auditory pathway
    involvement rather than a confirmation of an existing complaint.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brainstem auditory-evoked potentials showed increased latencies of waves
      I–III–V, as well as increased interpeak latencies in some patients
    explanation: >-
      Documents the brainstem auditory evoked potential abnormality measured in
      the Bulgarian cohort.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the two patients with no auditory complains (case II-1 and
      case II-2), aged 30 and 31 years, respectively, also had normal audiograms
    explanation: >-
      Cases II-1 and II-2 are named among the patients with increased brainstem
      evoked-potential latencies in the quote above, yet had no hearing complaint
      and normal audiograms - which is what makes the evoked potential a
      presymptomatic marker rather than a confirmation of an existing complaint.
- name: Targeted NDRG1 Sequencing
  description: >-
    Molecular confirmation. Because a single founder allele accounts for most
    cases, targeted testing of NDRG1 has a high yield in patients of Roma origin
    with early-onset demyelinating neuropathy, and the authors of the Slovak
    series argue for making it routine in that setting. It must not be restricted
    to that setting, however: whole-exome and targeted panel sequencing have found
    NDRG1 alleles in patients with no Roma ancestry.
  evidence:
  - reference: PMID:23996628
    reference_title: "Founder mutations in NDRG1 and HK1 genes are common causes of inherited neuropathies among Roma/Gypsies in Slovakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Providing genetic analysis of these genes for patients with Roma origin as a
      common part of diagnostic procedure would contribute to a better rate of
      diagnosed cases of demyelinating neuropathy
    explanation: >-
      The argument for routine targeted testing in the founder population.
- name: Sural Nerve Biopsy
  description: >-
    Not required for diagnosis now that molecular testing is available, but
    historically decisive and still informative where the genetic result is
    ambiguous: CMT4D nerve histology is reported as distinct, showing depletion of
    myelinated fibres, small calibre in those that survive, and poorly developed
    onion bulbs.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve histology seems to be distinct, and shows a depletion in myelinated
      nerve fibers with small size in the few preserved myelinated fibers and
      poorly developed onion bulbs
    explanation: >-
      Describes the histological picture and its claimed distinctiveness, in the
      source's own hedged terms.
differential_diagnoses:
- name: CMT4G (HMSN-Russe, HK1-related)
  description: >-
    The closest differential in the population where CMT4D is commonest. CMT4G is
    the other recessive demyelinating neuropathy caused by a founder mutation
    private to the Roma, and in the Slovak series the two accounted for all four
    families tested - two CMT4D and two CMT4G. Ancestry and clinical phenotype
    therefore do not discriminate them; the HK1 versus NDRG1 genotype does, which
    is the practical argument for testing both together rather than sequentially.
  evidence:
  - reference: PMID:23996628
    reference_title: "Founder mutations in NDRG1 and HK1 genes are common causes of inherited neuropathies among Roma/Gypsies in Slovakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected mutation p.R148X (g.631C>T) in the NDRG1 (NM_006096.3) gene in
      two families and mutation g.9712G>C in the HK1 (NM_033498) gene in the other
      two families. These mutations cause CMT4D and CMT4G, respectively.
    explanation: >-
      Shows the two disorders arising side by side in the same population and
      ascertainment, distinguishable only genetically.
- name: Other autosomal recessive demyelinating CMT (CMT4 subtypes)
  description: >-
    CMT4D must be separated from the other CMT4 subtypes - CMT4A (GDAP1), CMT4B1
    and CMT4B2 (MTMR2, SBF2), CMT4C (SH3TC2), CMT4F (PRX) and CMT4J (FIG4) - which
    share recessive inheritance, early onset and slowed conduction. Two features
    point towards NDRG1: sensorineural deafness, which is not a general CMT4
    feature, and the early severity of axonal loss. Neither is decisive, and the
    entity is defined genetically. Curated in this knowledge base as
    `Charcot-Marie-Tooth_Disease_Type_4`, which also carries CMT4D as a subtype
    block.
  evidence:
  - reference: PMID:27982524
    reference_title: "A novel NDRG1 mutation in a non-Romani patient with CMT4D/HMSN-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      should be considered in the differential diagnosis of recessive demyelinating
      CMT
    explanation: >-
      Places CMT4D within the recessive demyelinating CMT differential regardless
      of ancestry.
discussions:
- discussion_id: cmt4d_axonal_loss_has_no_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does none of the three NDRG1-deficient rodent models reproduce the early
    severe axonal loss that actually causes disability in patients, when all
    three reproduce the demyelination - and has the canine model, which does show
    axonal pathology, ever been assessed for whether its axonal loss is early and
    disproportionate to the demyelination?
  attaches_to:
  - "pathophysiology#Early Severe Axonal Loss"
  - "pathophysiology#Myelin Sheath Breakdown with Onion Bulb Formation"
  rationale: >-
    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the
    evidence is not absent - four independent NDRG1-deficient models exist,
    three rodent and one canine, and all have had their myelin phenotype
    characterised in detail. What is uncertain is their translational validity
    for the arm of the disease that matters clinically, which is precisely the
    arm that has not been characterised to the same standard. The stretcher
    mouse and the hypomorphic Ndrg1 knockout were compared head to head and
    neither displays the early severe axonal loss typical of the human disease,
    with regenerative capacity explicitly unimpaired; the independent CRISPR
    Ndrg1-/- mouse likewise shows no apparent axonal loss despite faithful
    demyelination; and the canine model is described as a mixed polyneuropathy
    without the deafness that defines the human disorder.

    The consequence is precise and constraining, and the rodent and canine models
    have to be stated separately because they fail differently. No rodent model
    reconstructs the step from Schwann-cell NDRG1 loss to axonal degeneration:
    all three reproduce demyelination and none the early severe axonal loss. The
    Greyhound is not in that position - it has prominent axonal pathology, with
    severe axonal atrophy, dropout of large myelinated fibres, Wallerian
    degeneration and neurogenic muscle atrophy. What has not been shown for the
    canine model is the feature that actually defines the human lesion: that the
    axonal loss is early and disproportionate to the demyelination rather than a
    late consequence of it. Nobody has assessed it for that, which is a different
    and weaker statement than failing to reproduce it.

    The practical consequence is unchanged. The gene-discovery work framed CMT4D
    as a disease of impaired axon-glia interaction, and axonal loss is what
    produces the disability. Any preclinical result in the rodent models -
    including the observation that a treatment window exists before the four-week
    onset of myelin thinning - speaks to the demyelinating arm only, and must not
    be curated or read as addressing the axonal arm. The canine line is the one
    place the axonal arm might be testable, which is why the proposed long-axon
    experiment below uses it.
  proposed_experiments:
  - experiment_id: exp_cmt4d_longer_axon_model
    name: Test whether axon length explains the model failure
    description: >-
      Human peripheral axons are an order of magnitude longer than murine ones,
      and the demand-mismatch hypothesis predicts that vulnerability scales with
      the membrane load a Schwann cell must service. Characterise NDRG1-null
      neuropathy in a large-animal model with long axons - the Greyhound line
      already exists - with axonal counts and regeneration assays as the primary
      readouts rather than myelin measures.
  - experiment_id: exp_cmt4d_schwann_axon_coculture
    name: Human Schwann cell-neuron co-culture with NDRG1 loss restricted to glia
    description: >-
      Co-culture patient-derived or NDRG1-edited human Schwann cells with
      wild-type sensory neurons, and the reciprocal combination, to determine
      whether Schwann-cell NDRG1 loss is sufficient to injure a genetically normal
      axon and over what timescale.
- discussion_id: cmt4d_ndrg1_molecular_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What does NDRG1 actually do in the Schwann cell, and is the trafficking
    account sufficient to explain a demyelinating neuropathy?
  attaches_to:
  - "pathophysiology#Impaired Schwann Cell Vesicular Trafficking"
  - "pathophysiology#Loss of Schwann Cell NDRG1 Function"
  rationale: >-
    Twenty-six years after the gene was found, the molecular function of NDRG1
    remains unresolved, and a 2013 clinical report still opens by saying so. What
    makes this a genuine gap rather than an unfinished literature is that the
    field has actively excluded candidates: the stretcher work found no support
    for roles in growth arrest, terminal differentiation, gene expression
    regulation or proteasomal degradation, leaving vesicular trafficking as the
    surviving hypothesis largely by elimination. The positive evidence for
    trafficking is real but indirect - Rab4a compartment enlargement and failed
    LDL receptor recycling in cell lines, lipid-vesicle binding by the purified
    protein, and a timing coincidence between demyelination and peak myelin
    growth in mouse. None of it measures membrane flux in a Schwann cell, and the
    protein is a hydrolase-fold member with no demonstrated catalytic activity, so
    the possibility that its relevant function is something not yet tested is not
    closed.
  proposed_experiments:
  - experiment_id: exp_cmt4d_schwann_membrane_flux
    name: Direct measurement of membrane trafficking flux in NDRG1-null Schwann cells
    description: >-
      Quantify endocytic and recycling flux, and myelin membrane delivery rate, in
      primary NDRG1-null Schwann cells during active myelination in co-culture,
      testing the demand-mismatch hypothesis directly rather than through the
      timing of the lesion.
  - experiment_id: exp_cmt4d_ndrg1_hydrolase_activity
    name: Screen for catalytic activity of the NDRG1 hydrolase fold
    description: >-
      The crystal structure resolves an alpha/beta hydrolase fold presumed
      inactive. Screen substrate classes appropriate to the fold, and test whether
      the CMT4D missense alleles p.Leu146Pro and p.Arg234Gln affect any activity
      found, to close or confirm the possibility of an unrecognised enzymatic
      function.
- discussion_id: cmt4d_central_nervous_system_involvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the central nervous system genuinely affected in CMT4D, or are the imaging
    and evoked-potential abnormalities secondary to the peripheral lesion?
  attaches_to:
  - "pathophysiology#Auditory Pathway Involvement"
  rationale: >-
    Three independent lines of observation point at the central nervous system:
    subcortical white matter abnormalities in a non-Roma p.Arg148*-homozygous
    family, cerebellar, medullary and upper cervical cord atrophy in an Italian
    patient with a different allele, and prolonged brainstem auditory evoked
    potential interpeak latencies that appear before hearing complaints. NDRG1 is
    ubiquitously expressed, so central involvement is biologically unsurprising.
    But none of these is decisive: evoked-potential delay is equally compatible
    with conduction failure in the proximal eighth-nerve segment, imaging findings
    come from single families, and no neuropathological examination of CMT4D
    central tissue has been reported. The authors who first reported the white
    matter lesions themselves called for further study rather than claiming a
    central phenotype. This entry therefore keeps the auditory node separate from
    the somatic chain rather than asserting a shared mechanism.
  proposed_experiments:
  - experiment_id: exp_cmt4d_systematic_neuroimaging
    name: Systematic central nervous system imaging in a genotyped CMT4D cohort
    description: >-
      Quantitative brain and cord MRI with diffusion metrics in a genotyped CMT4D
      cohort against age-matched controls, to determine whether white matter
      abnormality is a consistent feature or a sporadic finding in single
      families.
  - experiment_id: exp_cmt4d_ndrg1_cns_expression
    name: NDRG1 expression and oligodendrocyte requirement in central white matter
    description: >-
      Determine whether NDRG1 is expressed in oligodendrocytes at levels
      comparable to Schwann cells, and whether central myelin is affected in
      NDRG1-null animals, which would distinguish a primary central phenotype from
      a peripheral one.
- discussion_id: cmt4d_phenotype_causal_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which routes account for the reported spinal, bulbar, cognitive and central imaging findings, and for motor delay in some families?
  attaches_to:
  - phenotypes#Scoliosis
  - phenotypes#Dysphagia
  - phenotypes#Bilateral Vocal Cord Paralysis
  - phenotypes#Cognitive Impairment
  - phenotypes#Central Nervous System White Matter Abnormality
  - phenotypes#Cerebellar Atrophy
  - phenotypes#Cervical Spinal Cord Atrophy
  - phenotypes#Medullary Atrophy
  - phenotypes#Motor Delay
  - pathophysiology#Visual Pathway Dysfunction
  rationale: >-
    The reviewed human reports establish these observations, but do not identify a causal route for each. Scoliosis is quantified without a demonstrated paraspinal denervation or other spinal mechanism. The two siblings with dysphagia and vocal cord paralysis have no reported localization sufficient to distinguish cranial neuropathy from central motor involvement; vocal cord paralysis causing respiratory insufficiency is explicitly established and is represented. Cognitive delay lacks a defined developmental or neuropathological substrate. White matter lesions, cerebellar atrophy, medullary atrophy and cervical cord atrophy come from different limited reports whose authors do not establish whether each is a primary central consequence of NDRG1 loss or secondary degeneration. The visual evoked-potential abnormality establishes visual pathway dysfunction, but not its cause or correspondence to those structural findings. Motor delay is directly observed in some molecularly confirmed patients while other cohorts have normal milestones; the reviewed sources do not connect the delayed milestones to a defined early peripheral lesion. These uncertainties concern causal attribution, not a requirement to reconstruct every molecular intermediate. The peripheral glia-to-axon route and the auditory route are represented with their stated uncertainty.
notes: >-
  Scope. This entry covers CMT4D / HMSN-Lom (MONDO:0011085), the NDRG1-related
  recessive demyelinating neuropathy. CMT4D also appears as a subtype block
  within `Charcot-Marie-Tooth_Disease_Type_4`, which surveys the CMT4 group as a
  whole; the two are complementary rather than duplicative, and this entry is
  where the NDRG1-specific mechanism, allelic spectrum, animal models and open
  questions belong. Per-subtype entries alongside a type-level entry are the
  established pattern in this knowledge base, as with CMT2JJ and CMT2W alongside
  `Charcot-Marie-Tooth_Disease_Type_2`.

  Ancestry is a prior, not a criterion. It is tempting to curate CMT4D as a Roma
  disease, and older sources describe it as found exclusively in that population.
  That is no longer correct and acting on it would cause missed diagnoses: 22
  pathogenic NDRG1 variants are now known, the founder p.Arg148* allele accounts
  for 64 percent rather than all of them, and reported patients include Italian,
  Turkish, Indian, Chinese, Saudi and Bulgarian Muslim families. A second,
  entirely independent founder effect exists in Bulgarian Muslims for two
  splice-acceptor alleles.

  The pathograph's signalling arm is mouse-only. Everything in this entry
  concerning neuregulin 1/ErbB signalling, the myelination transcription program
  and PMP22 turnover comes from Ndrg1-deficient mice and has no human
  counterpart, which is why those nodes are PROVISIONAL and carry
  MODEL_ORGANISM evidence. The same models fail to reproduce the early severe
  axonal loss that defines the human disorder, so their negative and positive
  results are not symmetrically transferable - a treatment that preserves myelin
  in these mice has not been shown to address the arm of the disease that
  disables patients. This is recorded as a HUMAN_MODEL_MISMATCH discussion rather
  than left implicit.

  Only supportive treatments, and only ones actually given. No disease-modifying
  therapy exists for CMT4D and none is in clinical development for it. The two
  curated treatments - percutaneous endoscopic gastrostomy feeding and
  non-invasive ventilation - are curated because they were performed in reported
  CMT4D patients, not extrapolated from neuromuscular disease in general; bulbar
  involvement was unrecognised in this disorder until 2026, so an entry that
  omitted them would leave swallowing and vocal cord function off the
  surveillance list. Generic CMT rehabilitation and orthotics are deliberately
  not curated, because no CMT4D-specific source supports them.

  One therapeutic-sounding observation is deliberately left uncurated. The mouse
  work notes that myelin thinning begins at four weeks, after myelination is
  complete, and calls this a window of opportunity for intervention. That is an
  argument about the demyelinating arm, made in a model that lacks the axonal
  loss which disables patients, and it is recorded here rather than treated as a
  therapeutic claim.

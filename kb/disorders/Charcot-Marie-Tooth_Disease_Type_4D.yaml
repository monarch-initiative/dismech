- category: Neurologic
  name: Central Nervous System White Matter Abnormality
  description: >-
    A minority finding whose significance is unsettled. A non-Roma family
    homozygous for the same p.Arg148* allele had subcortical white matter
    abnormalities on brain MRI, and a separate Italian patient with a novel
    frameshift allele had slight atrophy of cerebellum, medulla oblongata and

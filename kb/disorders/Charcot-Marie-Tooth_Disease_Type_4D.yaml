- name: Motor Denervation
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Motor axonal loss deprives affected muscles of innervation. Human CMT4D electromyography demonstrates chronic denervation, supporting neurogenic weakness and wasting in distal muscles and, in severe disease, proximal muscles.
  evidence:
  - reference: PMID:24136616
    reference_title: Exonic duplication CNV of NDRG1 associated with autosomal-recessive HMSN-Lom/CMT4D.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Needle electromyography showed no activity in distal and proximal muscles of the lower limbs and distal muscles of the upper limbs; chronic denervation findings were present in proximal muscles of the upper limbs.
    explanation: >-
      Human electrophysiology documents denervation in the genetically affected NDRG1-duplication homozygote BAB4149.
  - reference: PMID:24136616
    reference_title: Exonic duplication CNV of NDRG1 associated with autosomal-recessive HMSN-Lom/CMT4D.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The physical examination revealed severe distal and mild proximal muscle weakness and distal wasting with areflexia.
    explanation: >-
      The genetically affected Turkish proband had distal wasting and both distal and proximal weakness; these are observations in NDRG1-associated disease, unlike the differently affected wild-type sibling.
  downstream:
  - target: Distal Amyotrophy
    description: >-
      Chronic loss of motor innervation causes neurogenic wasting in the predominantly affected distal muscles.
    causal_link_type: DIRECT

      distal latencies of the motor nerves
    explanation: >-
      Establishes the demyelinating electrophysiological signature.
- category: Neurologic
  name: Distal Muscle Weakness
  description: >-
    Severe distal weakness, worst in the lower limbs. In the Bulgarian cohort toe
    and plantar flexors and extensors were graded 0-1 of 5. Hand weakness follows
    lower-limb weakness by roughly a decade. The accompanying muscle wasting is
    curated separately below, because weakness and amyotrophy are separately
    measurable and the HPO distinguishes them.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39201732

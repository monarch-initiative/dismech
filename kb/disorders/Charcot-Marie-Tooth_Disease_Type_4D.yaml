- name: Dysregulated Myelination Transcription Program
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Downstream of the signalling defect, the Schwann-cell myelination program
    itself is disordered in Ndrg1-deficient mice. EGR2, SOX10 and OCT6 - the
    transcription factors that drive myelination - are all abnormally expressed,
    and the structural myelin proteins follow: MBP and MPZ fall at both mRNA and
    protein level. PMP22 behaves differently and is worth recording separately,
    because its mRNA falls while its protein rises, which the authors read as
    NDRG1 loss impairing PMP22 degradation. That dissociation is a second,
    independent pointer at a trafficking or turnover defect rather than a
    transcriptional one. PROVISIONAL: mouse only.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell

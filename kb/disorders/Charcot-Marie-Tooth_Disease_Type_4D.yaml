      of 10–17 years.
    explanation: >-
      Dates the upper-limb involvement relative to lower-limb onset.
- category: Neurologic
  name: Distal Amyotrophy
  description: >-
    Wasting of abductor pollicis brevis, the interossei, gastrocnemius and
    tibialis anterior, present in all patients of the Bulgarian cohort with
    slight left-right asymmetry in two of five assessed. Curated separately from
    weakness rather than bundled with it, since a patient can be weak without
    visible wasting early in the course.
  phenotype_term:
    preferred_term: Distal amyotrophy
    term:
      id: HP:0003693
      label: Distal amyotrophy
  evidence:

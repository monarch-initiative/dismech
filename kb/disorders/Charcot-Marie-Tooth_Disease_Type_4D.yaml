- name: Early Severe Axonal Loss
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    The feature that separates CMT4D from other demyelinating CMT is that axonal
    loss is early and severe rather than a late consequence of chronic
    demyelination, and it is what produces the disability. The gene-discovery
    work framed the disorder in exactly these terms: features of Schwann-cell
    dysfunction with concomitant early axonal involvement, implying that impaired
    axon-glia interaction rather than defective myelin is the pathogenic core.
    Clinically it shows up as severe demyelination with secondary axonal
    degeneration on nerve conduction studies.

    The node is PROVISIONAL not because the axonal loss is in doubt - it is the
    best-documented feature of the human disease - but because the causal step
    from Schwann-cell NDRG1 loss to axonal degeneration has never been
    reconstructed in any model. All three published rodent models fail at
    precisely this point, and that failure is curated as a HUMAN_MODEL_MISMATCH
    discussion rather than being glossed over.

    The cell type on this node is the peripheral neuron, not the Schwann cell -
    the only node in this pathograph where that is so. That is the entry's
    mechanistic point rather than an inconsistency: NDRG1 is a Schwann-cell
    protein, and the disabling lesion is in a cell that does not express it.
  cell_types:
  - preferred_term: peripheral nervous system neuron
    term:
      id: CL:2000032
      label: peripheral nervous system neuron
  evidence:
  - reference: PMID:10831399
    reference_title: "N-myc downstream-regulated gene 1 is mutated in hereditary motor and sensory neuropathy-Lom."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HMSNL shows features of Schwann-cell dysfunction and a concomitant early
      axonal involvement, suggesting that impaired axon-glia interactions play a
      major role in its pathogenesis.
    explanation: >-
      The original statement of early axonal involvement and of axon-glia failure
      as the pathogenic core.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve conduction studies (NCS) of all of our patients were consistent with
      severe demyelination and secondary axonal degeneration.
    explanation: >-
      Electrophysiological confirmation of axonal degeneration accompanying the
      demyelination in a contemporary patient cohort.
  - reference: PMID:21303696
    reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      although axon damage is present, regenerative capacity is unimpaired and
      the mice do not display the early severe axonal loss typical of the human
      disease
    explanation: >-
      Curated as PARTIAL: it confirms early severe axonal loss as the typical
      human feature while establishing that the rodent models do not reproduce
      it, which is why this node stays PROVISIONAL.
  - reference: PMID:9549516
    reference_title: "Hereditary motor and sensory neuropathy--Lom, a novel demyelinating neuropathy associated with deafness in gypsies. Clinical, electrophysiological and nerve biopsy findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypertrophic changes were not evident in the oldest individual biopsied
      and it is likely that they had regressed secondarily to axon loss.
    explanation: >-
      Cross-sectional histological evidence that axon loss ultimately supplants
      the hypertrophic demyelinating picture, which is why the disability is
      axonal rather than demyelinating in character.
  downstream:
  - target: Progressive Demyelinating Sensorimotor Neuropathy
- name: Progressive Demyelinating Sensorimotor Neuropathy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  description: >-
    The clinical endpoint: a severe, progressive, childhood-onset demyelinating
    sensorimotor neuropathy. Distal lower-limb weakness with steppage gait and
    frequent falls is the presenting complaint, hand weakness follows in the
    second decade, and ambulation is commonly lost in early adult life. Median
    age at onset across the published literature is seven years. Unlike most CMT
    the involvement is not confined to the distal limbs - the two most recently
    reported siblings had distal-proximal weakness with generalised areflexia -
    and bulbar and respiratory involvement has now been documented.
  evidence:
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset was 7 years, 96% of patients presented with lower
      limb involvement
    explanation: >-
      Quantifies onset and the near-universal lower-limb presentation across 72
      reported patients.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial manifestations in all patients included distal muscle weakness
      in the lower limbs with impaired steppage gait and frequent falls.
    explanation: >-
      Describes the uniform presenting picture in a contemporary cohort.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients present with an early onset demyelinating peripheral neuropathy
      causing severe distal muscle weakness and sensory loss, leading to loss of
      ambulation and progressive sensorineural hearing loss.
    explanation: >-
      States the full clinical course including loss of ambulation.
  - reference: PMID:9549516
    reference_title: "Hereditary motor and sensory neuropathy--Lom, a novel demyelinating neuropathy associated with deafness in gypsies. Clinical, electrophysiological and nerve biopsy findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It begins consistently in the first decade of life with gait disorder
      followed by upper limb weakness in the second decade and, in most subjects,
      by deafness which is most often first noticed in the third decade.
    explanation: >-
      The original delineation's decade-by-decade description of the natural
      history, which still frames how the disorder is staged.
- name: Auditory Pathway Involvement
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Sensorineural deafness is the second defining feature of CMT4D, typically
    developing in the third decade and affecting about three-fifths of reported
    patients. Where the lesion sits is not settled. Brainstem auditory evoked
    potentials show prolonged I-V interpeak latencies before patients complain of
    hearing loss, which points at the central auditory pathway rather than at the
    cochlea alone, and a subset of patients has subcortical white-matter
    abnormality or brainstem and cervical cord atrophy on MRI. Whether this
    represents a genuinely central NDRG1 phenotype or conduction delay in the
    proximal eighth-nerve segment has not been resolved, and no cochlear or
    auditory-nerve pathology from a CMT4D patient has been reported. This node is
    kept separate from the somatic-nerve chain for that reason: the mechanism is
    plausibly shared but has not been shown to be. It is reached from the
    genotype by an edge explicitly typed as having unknown intermediates.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another typical electrophysiological finding is an abnormality in brain-stem
      auditory-evoked potentials with prolonged I–V interpeak latencies,
      suggesting the involvement of the central pathways
    explanation: >-
      The evoked-potential evidence pointing at central auditory pathway
      involvement, in the source's own hedged terms.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The audiograms of the rest were consistent with sensorineural hearing loss,
      especially for high frequencies.
    explanation: >-
      Characterises the hearing loss as sensorineural and high-frequency
      predominant.
  - reference: PMID:17142040
    reference_title: "NDRG1-linked Charcot-Marie-Tooth disease (CMT4D) with central nervous system involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, central nervous system white matter lesions are
      demonstrated in CMT4D.
    explanation: >-
      Independent evidence of central nervous system involvement in
      p.Arg148*-homozygous patients.
  - reference: PMID:9549516
    reference_title: "Hereditary motor and sensory neuropathy--Lom, a novel demyelinating neuropathy associated with deafness in gypsies. Clinical, electrophysiological and nerve biopsy findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the results suggested demyelination in the eighth cranial nerve and also
      abnormal conduction in the central auditory pathways in the brainstem
    explanation: >-
      The original evoked-potential analysis implicates both candidate sites at
      once - the eighth nerve and the central pathways - which is precisely why
      this node does not commit to one and is marked PROVISIONAL.
phenotypes:
- category: Neurologic
  name: Demyelinating Sensorimotor Polyneuropathy
  description: >-
    The defining feature. Nerve conduction studies show markedly reduced
    conduction velocities and prolonged distal latencies with absent sensory
    nerve action potentials, and sural nerve biopsy shows depletion of myelinated
    fibres with onion bulbs. Distal lower-limb involvement is near-universal.
  phenotype_term:
    preferred_term: Demyelinating motor and sensory neuropathy
    term:
      id: HP:0007108
      label: Demyelinating peripheral neuropathy
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:42089726
    reference_title: "Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset was 7 years, 96% of patients presented with lower
      limb involvement
    explanation: >-
      Supplies the frequency band: 96 percent of 72 reviewed patients had lower
      limb involvement, which falls in the VERY_FREQUENT range of 80-99 percent.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

- name: Auditory Pathway Involvement
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Auditory pathway dysfunction produces progressive sensorineural hearing loss, usually recognized in the third decade but sometimes in childhood. Brainstem auditory evoked potentials may be delayed before hearing complaints. The original human electrophysiology suggested eighth-nerve demyelination and abnormal central auditory conduction; their relative contributions remain unresolved. This node is separate from the somatic nerve chain and is reached from the genotype through an edge with unknown intermediates. Broad hearing impairment was reported in 61% of published cases, but that estimate does not establish specifically sensorineural loss in every reviewed patient.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another typical electrophysiological finding is an abnormality in brain-stem
      auditory-evoked potentials with prolonged I–V interpeak latencies,
      suggesting the involvement of the central pathways
    explanation: >-
      The evoked-potential evidence pointing at central auditory pathway
      involvement, in the source's own hedged terms.
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT

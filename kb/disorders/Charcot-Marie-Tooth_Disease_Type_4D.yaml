- name: Visual Pathway Dysfunction
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Abnormal visual evoked potentials demonstrate dysfunction of the visual system in reported CMT4D siblings. The anatomical substrate and causal route from NDRG1 loss are unresolved; this node identifies the state measured by VEPs without assigning it to the cerebral white matter lesions reported in a different family.
  evidence:
  - reference: PMID:42089726
    reference_title: Clinical and pathological findings in two Italian siblings of Romani ancestry with charcot-marie-tooth type 4D and review of the current literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Visual system involvement was demonstrated through abnormal visual evoked potentials with reduced P100 amplitude and absent responses, expanding the recognized phenotypic spectrum.
    explanation: >-
      Documents the exact electrophysiological finding in the two siblings. The review’s 17% broad visual-involvement estimate does not quantify abnormal VEPs specifically.

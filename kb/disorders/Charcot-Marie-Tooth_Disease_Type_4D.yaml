      predominant.
  - reference: PMID:17142040
    reference_title: "NDRG1-linked Charcot-Marie-Tooth disease (CMT4D) with central nervous system involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, central nervous system white matter lesions are

      label: Autosomal recessive inheritance
  description: >-
    Biallelic NDRG1 variants, homozygous in the great majority of reported
    patients and compound heterozygous in a minority. The recessive mode is what
    makes founder populations the natural setting for the disorder: the Roma
    p.Arg148* allele and two Bulgarian Muslim splice-site alleles each reached
    homozygosity through consanguinity within a genetically isolated community
    rather than through recurrent mutation.
  evidence:
  - reference: PMID:39201732
    reference_title: "Identification and Characterization of Novel Founder Mutations in NDRG1: Refining the Genetic Landscape of Charcot-Marie-Tooth Disease Type 4D in Bulgaria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis was performed on the available family members, and all
      of the variants co-segregated with the disease phenotype in the
      corresponding pedigrees
    explanation: >-
      Co-segregation of biallelic NDRG1 variants with disease across eleven
      families.
  - reference: PMID:23996628
    reference_title: "Founder mutations in NDRG1 and HK1 genes are common causes of inherited neuropathies among Roma/Gypsies in Slovakia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are three subtypes of autosomal recessive CMT with mutations private
      to the Roma population: CMT4C, CMT4D and CMT4G.
    explanation: >-
      States the recessive mode and the founder-population context.
pathophysiology:
- name: Biallelic NDRG1 Loss-of-Function Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  description: >-
    The initiating lesion is biallelic loss of NDRG1. The founder allele
    p.Arg148* (c.442C>T) introduces a premature termination codon and accounts
    for roughly two-thirds of reported patients. The remaining alleles converge
    on the same functional endpoint by different routes: frameshifts
    (p.His247Thrfs*74, p.Ser317Argfs*4, p.Glu170Glyfs*35), further nonsense
    alleles, canonical splice-acceptor variants whose transcripts favour exon
    skipping, a duplication of exons 6-8, and two missense alleles (p.Leu146Pro,
    p.Arg234Gln) that destabilise the protein rather than truncating it. The
    missense alleles matter mechanistically because they show the disease can be
    produced by reduced NDRG1 abundance alone, with no truncation involved.
  genes:
  - preferred_term: NDRG1
    term:
      id: hgnc:7679
      label: NDRG1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Germline biallelic loss of function, most often homozygous for a founder
      nonsense allele. Functional characterisation of the novel Bulgarian
      splice-site alleles showed shorter gene products consistent with loss of
      protein function, and cell-culture work on the missense alleles showed
      accelerated degradation and lower steady-state protein levels.

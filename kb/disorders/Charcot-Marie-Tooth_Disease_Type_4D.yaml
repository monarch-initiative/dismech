- name: Impaired Schwann Cell Vesicular Trafficking
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The leading account of what NDRG1 actually does in the Schwann cell is
    vesicular trafficking. NDRG1 regulates endosomal recycling through
    Rab4a-positive compartments and low-density lipoprotein receptor turnover;
    CMT4D
    missense mutants leave the NDRG1-Rab4a interaction intact but produce
    enlarged Rab4a-positive compartments and fail to support LDL uptake or to
    restore receptor levels at the cell surface. The proposal that follows -
    that a trafficking Schwann cell simply cannot meet the membrane demand of
    myelin growth - is supported by a striking timing coincidence in the
    stretcher mouse, where widespread large-fibre demyelination coincides exactly
    with the period in which myelin volume and length in large fibres increase
    several hundred-fold, and small fibres are spared. It is marked PROVISIONAL
    because the trafficking defect is demonstrated in cell lines and the
    demand-mismatch argument is an inference from the timing rather than a direct
    measurement of membrane flux in a CMT4D nerve. The same work explicitly
    argues against several earlier candidate functions.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: endosomal recycling of membrane receptors
    modifier: DECREASED
    term:
      id: GO:0032456
      label: endocytic recycling
  evidence:
  - reference: PMID:28776325
    reference_title: "Identification and functional characterization of two missense mutations in NDRG1 associated with Charcot-Marie-Tooth disease type 4D."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, NDRG1-knockdown cells expressing mutant NDRG1 displayed enlarged
      Rab4a-positive compartments.
    explanation: >-
      Shows a recycling-endosome abnormality specific to the CMT4D mutant
      protein, with the NDRG1-Rab4a interaction itself preserved.
  - reference: PMID:28776325
    reference_title: "Identification and functional characterization of two missense mutations in NDRG1 associated with Charcot-Marie-Tooth disease type 4D."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, mutant NDRG1 could not enhance the uptake of DiI-LDL or increase
      the fraction of low-density lipoprotein receptor on the cell surface.
    explanation: >-
      Demonstrates a functional trafficking deficit for a receptor whose
      recycling NDRG1 normally supports.
  - reference: PMID:21303696
    reference_title: "Ndrg1 in development and maintenance of the myelin sheath."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Impaired SC trafficking failing to meet the considerable demands of nerve

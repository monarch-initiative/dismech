    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological examination revealed severe distal muscle weakness in the lower
      limbs in all patients with muscle strength of toe flexors and extensors and
      plantar flexors and extensors of 0–1/5 in MRC score.
    explanation: >-
      Quantifies the severity of distal lower-limb weakness.
  - reference: PMID:39201732

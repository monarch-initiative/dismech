  findings:
  - statement: >-
      Orphanet defines AADC deficiency as a rare severe genetic neurometabolic
      disorder caused by impaired catecholamine and serotonin synthesis.
    supporting_text: >-
      A rare, severe, genetic neurometabolic disorder associated with clinical
      manifestations related to impaired synthesis of dopamine, noradrenaline,
      adrenaline and serotonin.
- reference: PMID:28100251
  title: Consensus guideline for the diagnosis and treatment of aromatic l-amino acid decarboxylase (AADC) deficiency.
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      The international consensus guideline supports autosomal recessive
      inheritance, early onset, key motor/autonomic symptoms, laboratory
      diagnosis, imaging/EEG considerations, and medical management.
    supporting_text: >-
      In the face of limited definitive evidence, we constructed practical
      recommendations on clinical diagnosis, laboratory diagnosis, imaging and
      electroencephalograpy, medical treatments and non-medical treatments.
- reference: PMID:19172410
  title: "Aromatic L-amino acid decarboxylase deficiency: clinical features, drug therapy and follow-up."
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      A German clinical cohort supports the combined serotonin/dopamine/
      catecholamine deficiency, core neurologic and extraneurologic features,
      characteristic CSF profile, plasma enzyme confirmation, and symptomatic
      drug treatment classes.
    supporting_text: >-
      AADC deficiency is a disorder of biogenic amine metabolism resulting in
      generalized combined deficiency of serotonin, dopamine and catecholamines.
- reference: PMID:36268467
  title: "Clinical Features in Aromatic L-Amino Acid Decarboxylase (AADC) Deficiency: A Systematic Review."
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      A systematic review of 261 molecularly or biochemically diagnosed patients
      supports DDC causation, early onset, frequent hypotonia, developmental
      delay, oculogyric crises, hypokinesia, ptosis, dysautonomia,
      gastrointestinal symptoms, sleep disorders, and behavioral disorders.
    supporting_text: >-
      By analysing 261 patients from 41 papers with molecular and/or
      biochemical diagnosis of AADC deficiency for which individuality could be
      determined with certainty, we found symptom onset to occur in the first 6
      months of life in 93% of cases.
- reference: PMID:30689738
  title: Gene therapy improves motor and mental function of aromatic l-amino acid decarboxylase deficiency.
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      An open-label phase 1/2 intraputaminal AAV-DDC study supports restored
      putaminal dopamine synthesis and improved motor, oculogyric, dystonic,
      cognitive, and verbal function after gene therapy.
    supporting_text: >-
      The restoration of dopamine synthesis in the putamen via gene transfer
      provides transformative medical benefit across all patient ages,
      genotypes, and disease severities included in this study.
- reference: PMID:1357595
  title: "Aromatic L-amino acid decarboxylase deficiency: clinical features, diagnosis, and treatment of a new inborn error of neurotransmitter amine synthesis."
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      The original case report documents severe hypotonia, oculogyric crises,
      absent/reduced AADC activity, reduced biogenic amines, elevated precursors,
      and partial response to bromocriptine/tranylcypromine-based therapy.
    supporting_text: >-
      Activity of aromatic L-amino acid decarboxylase was virtually absent in a
      liver biopsy sample and greatly reduced in plasma.
- reference: PMID:32409695
  title: The genetic and clinical characteristics of aromatic L-amino acid decarboxylase deficiency in mainland China.
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      A 23-patient mainland China cohort supports DDC variants, early onset,
      hypotonia, oculogyric crises, autonomic symptoms, and frequent partial
      improvement with pyridoxine, dopamine agonist, and MAO inhibitor regimens.
    supporting_text: >-
      Eighteen patients (78.3%) got various degree of improvement after using
      pyridoxine monotherapy or different combination of pyridoxine, dopamine
      agonists, and monoamine oxidase (MAO) inhibitors.
- reference: DOI:10.1001/jama.2024.28666
  title: Eladocagene Exuparvovec for Aromatic L-Amino Acid Decarboxylase Deficiency
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      JAMA Insights reports FDA approval of Kebilidi, eladocagene exuparvovec,
      for AADC deficiency in adult and pediatric patients.
    supporting_text: >-
      This JAMA Insights discusses the US Food and Drug Administration approval
      of Kebilidi, eladocagene exuparvovec, for the treatment of aromatic
      L-amino acid decarboxylase deficiency in adult and pediatric patients.
- reference: clinicaltrials:NCT04903288
  title: An Open-Label Trial to Address the Safety of the SmartFlow MR-Compatible Ventricular Cannula for Administering Eladocagene Exuparvovec to Pediatric Subjects
  found_in:
  - Aromatic_L_Amino_Acid_Decarboxylase_Deficiency-deep-research-fallback.md
  findings:
  - statement: >-
      ClinicalTrials.gov documents an active-not-recruiting phase 2 trial of
      eladocagene exuparvovec in pediatric AADC deficiency.
    supporting_text: >-
      The primary objectives of the trial phase are to assess the
      pharmacodynamics (PD) of eladocagene exuparvovec treatment by evaluation
      of homovanillic acid (HVA) levels and to assess the safety of the
      SmartFlow magnetic resonance compatible ventricular cannula.
- reference: PMID:37824694
  title: Aromatic L-Amino Acid Decarboxylase Deficiency.
  tags:
  - GeneReviews
  findings:
  - statement: >-
      GeneReviews provides the current clinical baseline for presentation,
      diagnosis, management, surveillance, and genetic counseling.
    supporting_text: >-
      The diagnosis of AADC deficiency is established in a proband who has the
      following core diagnostic testing results: biallelic pathogenic variants
      in DDC identified by molecular genetic testing OR cerebrospinal fluid
      (CSF) or plasma neurotransmitter profile consistent with AADC deficiency
      AND significantly reduced AADC enzyme activity in plasma.
- reference: PMID:12891654
  title: "Aromatic L-amino acid decarboxylase deficiency: overview of clinical features and outcomes."
  findings:
  - statement: >-
      An 11-patient series documents the characteristic early movement disorder
      and broad but generally poor functional outcomes.
    supporting_text: >-
      Functional clinical outcomes as a group remain poor, in spite of a
      variety of attempted treatment interventions, with marked impairment in
      motor abilities as well as in speech and communication; however, outcome
      was quite variable from patient to patient and covered a broad spectrum
      of neurological disability.
- reference: PMID:32369189
  title: "AADC deficiency from infancy to adulthood: Symptoms and developmental outcome in an international cohort of 63 patients."
  findings:
  - statement: >-
      A 63-person international cohort defines early presentation, motor
      severity, developmental outcomes, treatment response, and mortality.
    supporting_text: >-
      The majority of subjects (70%) had profound motor impairment
      characterized by absent head control and minimal voluntary movement,
      while 17% had mild motor impairment and were able to walk independently.
- reference: PMID:34763085
  title: Long-term efficacy and safety of eladocagene exuparvovec in patients with AADC deficiency.
  findings:
  - statement: >-
      Follow-up of 26 treated patients supports sustained motor and cognitive
      benefit beyond five years while identifying transient postoperative
      dyskinesia and procedure-related complications.
    supporting_text: >-
      Rapid improvements in motor and cognitive function occurred within 12
      months after gene therapy and were sustained during follow-up for >5
      years.
- reference: PMID:38302374
  title: "Newborn screening for aromatic l-amino acid decarboxylase deficiency - Strategies, results, and implication for prevalence calculations."
  findings:
  - statement: >-
      A prospective German pilot supports dried-blood-spot 3-O-methyldopa
      screening and supplies a population-specific birth-prevalence estimate.
    supporting_text: >-
      The proposed screening strategy with 3-OMD detection in DBS is feasible
      and effective to identify individuals with AADCD.
- reference: PMID:37635029
  title: "Streamlined determination of 3-O-methyldopa in dried blood spots: Prospective screening for aromatic l-amino-acid decarboxylase deficiency."
  findings:
  - statement: >-
      Prospective Taiwanese screening found six molecularly confirmed newborns
      among 157,371 screened.
    supporting_text: >-
      Among them, six newborns were confirmed to carry two pathogenic DDC
      variants, indicating an incidence of AADC deficiency of ~1:26,000 (95%
      confidence interval: 1 in 12,021 to 1 in 57,228).
- reference: PMID:37348148
  title: Prevalence of DDC genotypes in patients with aromatic L-amino acid decarboxylase (AADC) deficiency and in silico prediction of structural protein changes.
  findings:
  - statement: >-
      The largest assembled genotype dataset identifies the East Asian
      c.714+4A>T founder allele as the most common reported DDC variant.
    supporting_text: >-
      The splice variant c.714+4A>T, with a founder effect in Taiwan and China,
      was the most common variant (allele frequency = 32.4%), and
      c.[714+4A>T];[714+4A>T] was the most common genotype (genotype frequency =
      21.3%).
- reference: PMID:28973165
  title: A pathogenic S250F missense mutation results in a mouse model of mild aromatic l-amino acid decarboxylase (AADC) deficiency.
  findings:
  - statement: >-
      The homozygous S250F knock-in mouse is a viable, mild model with residual
      enzyme activity, marked serotonin loss, and behavioral and autonomic
      abnormalities.
    supporting_text: >-
      Such mutants represent a novel, mild model of human AADC deficiency.
- reference: PMID:40318155
  title: "The CRISPR-Cas9 knockout DDC SH-SY5Y in vitro model for AADC deficiency provides insight into the pathogenicity of R347Q and L353P variants: a cross-sectional structural and functional analysis."
  findings:
  - statement: >-
      A DDC-knockout human neuroblastoma model reproduces enzyme loss and the
      low-HVA/high-3-OMD biochemical signature and supports variant testing.
    supporting_text: >-
      This model showed a deficiency in AADC protein and activity, with an
      altered dopamine metabolites profile (low homovanillic acid and high
      3-O-methyldopa).
- reference: PMID:37402126
  title: "Gene therapy for aromatic L-amino acid decarboxylase deficiency: Requirements for safe application and knowledge-generating follow-up."
  findings:
  - statement: >-
      International experts identify unresolved long-term and comparative
      effectiveness questions after intracerebral AAV2 gene therapy.
    supporting_text: >-
      Due to lack of data on long-term outcomes and the comparative efficacy of
      alternative stereotactic procedures and brain target sites, a structured
      follow-up plan and systematic documentation of outcomes in a suitable,
      industry-independent registry study are necessary.
- reference: PMID:41724580
  title: "Pharmacodynamics, Efficacy, and Safety of Intraputaminal Eladocagene Exuparvovec Administered to Pediatric Patients With Aromatic L-Amino Acid Decarboxylase Deficiency Using an MR-Compatible Cannula: 48 Weeks of Follow-Up."
  findings:
  - statement: >-
      The 2026 phase 2 report from NCT04903288 documents increased CSF HVA,
      acquired motor milestones, and no deaths or withdrawals through 48 weeks.
    supporting_text: >-
      At baseline (n = 13), all patients showed severe motor developmental
      delay; at week 48 (n = 12), nine achieved full head control, four could sit
      unassisted, two could stand with support, and two could walk independently
      to a toy.
- reference: PMID:42389831
  title: "Gene Therapy for Amino Acid Decarboxylase Deficiency: Clinical and Imaging Outcomes in a French Cohort."
  findings:
  - statement: >-
      A July 2026 six-patient French cohort relates clinical recovery to
      dopamine-production dynamics rather than exhaustive putaminal coverage.
    supporting_text: >-
      Clinical recovery did not correlate with the putaminal coverage volume,
      indicating a biological threshold effect.
- reference: PMID:36103022
  title: "Eladocagene Exuparvovec: First Approval."
  findings:
  - statement: >-
      The European authorization is restricted to patients aged at least 18
      months with severe, clinically and molecularly confirmed disease.
    supporting_text: >-
      Eladocagene exuparvovec was approved in July 2022 in the EU for the
      treatment of patients aged 18 months and older with a clinical,
      molecular, and genetically confirmed diagnosis of AADC deficiency with a
      severe phenotype (i.e. patients who cannot sit, stand or walk).
- reference: clinicaltrials:NCT01395641
  title: A Phase I/II Clinical Trial for Treatment of Aromatic L-amino Acid Decarboxylase (AADC) Deficiency Using AAV2-hAADC
  findings:
  - statement: The completed phase 1/2 study evaluated AAV2-hAADC safety and efficacy.
    supporting_text: >-
      This Phase I/II trial is to prove the efficacy and safety of AAV2-hAADC to
      treat patients with AADC deficiency.
- reference: clinicaltrials:NCT02926066
  title: A Clinical Trial for Treatment of Aromatic L-amino Acid Decarboxylase (AADC) Deficiency Using AAV2-hAADC - An Expansion (NTUH-AADC-011)
  findings:
  - statement: The completed phase 2 expansion increased experience and evaluated a modestly higher dose.
    supporting_text: >-
      This clinical trial expansion is to offer patients, who are not enrolled
      into the Phase I/II trial, a chance of treatment, to provide the
      experience in this gene therapy, and to increase the dose slightly.

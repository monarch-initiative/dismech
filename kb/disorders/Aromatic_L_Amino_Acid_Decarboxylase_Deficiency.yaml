differential_diagnoses:
- name: Tetrahydrobiopterin synthesis or recycling disorders
  description: >-
    BH4 disorders can share dopamine- and serotonin-pathway abnormalities, but
    AADC deficiency characteristically retains normal CSF pterins.
  distinguishing_features:
  - Normal CSF neopterin, dihydrobiopterin, and tetrahydrobiopterin in AADC deficiency
  evidence:
  - reference: PMID:28100251
    reference_title: "Consensus guideline for the diagnosis and treatment of aromatic l-amino acid decarboxylase (AADC) deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Reduced 5-HIAA and HVA, and elevated 3-OMD, L-Dopa and 5-HTP , with
      normal pterins, point to AADCD.
    explanation: The consensus identifies normal pterins as part of the biochemical pattern that points to AADC deficiency.
- name: PNPO deficiency
  disease_term:
    preferred_term: PNPO deficiency
    term:
      id: MONDO:0012407
      label: pyridoxal phosphate-responsive seizures
  description: >-
    PNPO deficiency can secondarily reduce AADC activity and resemble the AADC
    CSF profile. Very low CSF pyridoxal phosphate with elevated glycine and
    threonine, together with neonatal epileptic encephalopathy, favors PNPO
    deficiency.
  distinguishing_features:
  - Very low CSF pyridoxal phosphate with increased CSF glycine and threonine
  - Severe neonatal epileptic encephalopathy rather than the usual AADC presentation
  evidence:
  - reference: PMID:28100251
    reference_title: "Consensus guideline for the diagnosis and treatment of aromatic l-amino acid decarboxylase (AADC) deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is a secondary failure of AADC due to a deficiency of its cofactor
      pyridoxal phosphate
    explanation: The guideline directly describes the overlapping secondary AADC mechanism.
  - reference: PMID:28100251
    reference_title: "Consensus guideline for the diagnosis and treatment of aromatic l-amino acid decarboxylase (AADC) deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "very low PLP , and increased glycine and threonine in CSF."
    explanation: The guideline gives the discriminating CSF analytes.
treatments:
- name: Eladocagene exuparvovec gene therapy
  description: >-
    Eladocagene exuparvovec delivers DDC via an adeno-associated viral vector to
    the putamen, aiming to restore dopamine synthesis and improve motor,
    developmental, and oculogyric manifestations. The US indication includes
    adult and pediatric patients of any severity who have sufficient skull
    maturity for surgery; the European indication is limited to patients aged
    at least 18 months with severe, clinically and molecularly confirmed disease.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
    therapeutic_agent:
    - preferred_term: eladocagene exuparvovec
      term:
        id: NCIT:C171796
        label: Eladocagene Exuparvovec
  target_mechanisms:
  - target: DDC Enzymatic Deficiency
    treatment_effect: RESTORES
    description: Gene addition supplies the human DDC coding sequence to restore AADC activity in the putamen.
    evidence:
    - reference: PMID:30689738
      reference_title: "Gene therapy improves motor and mental function of aromatic l-amino acid decarboxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients received a total of 2 × 1011 vector genomes of adeno-associated virus vector harbouring DDC via bilateral intraputaminal infusions."
      explanation: Open-label clinical study describes AAV vector delivery of DDC to the putamen.
  - target: Biogenic Monoamine Synthesis Failure
    treatment_effect: RESTORES
    description: Restored putaminal DDC expression increases dopamine synthesis.
    evidence:
    - reference: PMID:30689738
      reference_title: "Gene therapy improves motor and mental function of aromatic l-amino acid decarboxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The restoration of dopamine synthesis in the putamen via gene transfer provides transformative medical benefit across all patient ages"
      explanation: Clinical study supports restoration of putaminal dopamine synthesis.
  evidence:
  - reference: PMID:30689738
    reference_title: "Gene therapy improves motor and mental function of aromatic l-amino acid decarboxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At up to 2 years after gene therapy, the motor function was remarkably improved in all patients."
    explanation: Open-label phase 1/2 study supports motor improvement after AAV-DDC gene therapy.
  - reference: PMID:30689738
    reference_title: "Gene therapy improves motor and mental function of aromatic l-amino acid decarboxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia disappeared and oculogyric crisis was markedly decreased in all patients."
    explanation: Gene therapy improved key movement disorder manifestations.
  - reference: DOI:10.1001/jama.2024.28666
    reference_title: "Eladocagene Exuparvovec for Aromatic L-Amino Acid Decarboxylase Deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "US Food and Drug Administration approval of Kebilidi, eladocagene exuparvovec, for the treatment of aromatic L-amino acid decarboxylase deficiency in adult and pediatric patients."
    explanation: JAMA Insights reports FDA approval for AADC deficiency.
  - reference: PMID:34763085
    reference_title: Long-term efficacy and safety of eladocagene exuparvovec in patients with AADC deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rapid improvements in motor and cognitive function occurred within 12
      months after gene therapy and were sustained during follow-up for >5
      years.
    explanation: Follow-up of 26 treated patients supports durable clinical benefit beyond five years.
  - reference: PMID:34763085
    reference_title: Long-term efficacy and safety of eladocagene exuparvovec in patients with AADC deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients experienced mild to moderate dyskinesia that resolved in a
      few months.
    explanation: The long-term cohort documents a common transient post-treatment adverse effect.
  - reference: PMID:36103022
    reference_title: "Eladocagene Exuparvovec: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Eladocagene exuparvovec was approved in July 2022 in the EU for the
      treatment of patients aged 18 months and older with a clinical,
      molecular, and genetically confirmed diagnosis of AADC deficiency with a
      severe phenotype (i.e. patients who cannot sit, stand or walk).
    explanation: The approval review records the narrower European indication.
  - reference: PMID:37824694
    reference_title: Aromatic L-Amino Acid Decarboxylase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This treatment was also approved by the FDA for use in the United States
      to treat individuals of any disease severity with sufficient skull
      maturity to safely tolerate the neurosurgical procedure.
    explanation: GeneReviews states the US severity and surgical-maturity boundaries.
  - reference: PMID:41724580
    reference_title: "Pharmacodynamics, Efficacy, and Safety of Intraputaminal Eladocagene Exuparvovec Administered to Pediatric Patients With Aromatic L-Amino Acid Decarboxylase Deficiency Using an MR-Compatible Cannula: 48 Weeks of Follow-Up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At baseline (n = 13), all patients showed severe motor developmental
      delay; at week 48 (n = 12), nine achieved full head control, four could
      sit unassisted, two could stand with support, and two could walk
      independently to a toy.
    explanation: The 2026 phase 2 report quantifies milestone acquisition through 48 weeks.
  - reference: PMID:42389831
    reference_title: "Gene Therapy for Amino Acid Decarboxylase Deficiency: Clinical and Imaging Outcomes in a French Cohort."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients achieved genotype-independent motor improvements and OGC
      reduction, with no serious adverse events.
    explanation: A small independent European cohort supports benefit across six genetically diverse patients but cannot establish broad genotype independence.

animal_models:
- species: Mus musculus
  genotype: Homozygous Ddc p.S250F knock-in
  category: Mild hypomorphic knock-in model
  genes:
  - preferred_term: Ddc
    term:
      id: MGI:94872
      label: Ddc
  description: >-
    Homozygous S250F mice retain minute AADC activity and are viable. They show
    marked serotonin depletion with behavioral and autonomic abnormalities, but
    only modest brain dopamine reduction and no loss or morphologic abnormality
    of dopaminergic neurons. The model therefore represents disease with mild
    residual enzyme activity rather than the severe human phenotype.
  associated_phenotypes:
  - Markedly reduced brain serotonin
  - Modestly reduced brain dopamine
  - Behavioral abnormality
  - Autonomic dysfunction
  evidence:
  - reference: PMID:28973165
    reference_title: A pathogenic S250F missense mutation results in a mouse model of mild aromatic l-amino acid decarboxylase (AADC) deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although the low enzymatic activity of the protein resulted in only
      modestly reduced concentrations of brain dopamine, serotonin levels were
      markedly diminished, and this perturbed behavior as well as autonomic
      function in mutant mice.
    explanation: The knock-in study directly reports the biochemical and organismal phenotypes.

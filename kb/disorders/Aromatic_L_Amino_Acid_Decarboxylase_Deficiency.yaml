    and avoid strongly serotonergic ergot-derived dopamine agonists because of
    valvular and fibrotic risk. Routine levodopa is avoided outside the narrow
    variant-directed setting described separately.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37824694
    reference_title: Aromatic L-Amino Acid Decarboxylase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ergot-derived dopamine agonists with strong serotonergic (5-HT2B) agonist
      action (pergolide and cabergoline) due to risk of cardiac valvulopathy and
      other fibrotic complications
    explanation: GeneReviews states the ergot-derived dopamine-agonist safety rationale.

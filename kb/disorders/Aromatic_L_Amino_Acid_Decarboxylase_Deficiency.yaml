    reference_title: "The CRISPR-Cas9 knockout DDC SH-SY5Y in vitro model for AADC deficiency provides insight into the pathogenicity of R347Q and L353P variants: a cross-sectional structural and functional analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, the DDC-KO model recapitulates some key features of AADC
      deficiency, is useful to study the molecular basis of the disease, and
      represents an ideal system for small molecule screening regarding
      specific enzyme defects
    explanation: The authors define the model's supported use while limiting the claim to some disease features.
discussions:
- discussion_id: aadc_residual_activity_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which model can reproduce the near-absent AADC activity and profound motor
    phenotype of severe human disease while remaining viable for longitudinal
    mechanistic and treatment studies?
  rationale: >-
    The available S250F knock-in mouse retains enough activity for substantial
    dopamine production, has only modest dopamine depletion, and lacks
    dopaminergic-cell pathology. It is informative for mild residual-activity
    disease but cannot establish mechanisms or treatment thresholds for the
    severe phenotype that dominates clinical cohorts.
  attaches_to:
  - pathophysiology#DDC Enzymatic Deficiency
  - pathophysiology#Motor Circuit Dysfunction
  evidence:
  - reference: PMID:28973165
    reference_title: A pathogenic S250F missense mutation results in a mouse model of mild aromatic l-amino acid decarboxylase (AADC) deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that even minute levels of active AADC are sufficient to
      allow for substantial amounts of dopamine to be produced in model mice
      harboring the S250F mutation. Such mutants represent a novel, mild model
      of human AADC deficiency.
    explanation: The model authors explicitly identify residual dopamine production and mild fidelity.
  proposed_experiments:
  - experiment_id: aadc_human_neuron_allelic_series
    name: Isogenic human monoaminergic-neuron DDC allelic series
    description: >-
      Compare DDC null, severe splice, ligand-binding-site, S250F, and corrected
      isogenic human iPSC-derived dopaminergic and serotonergic neurons for AADC
      activity, monoamine flux, maturation, electrophysiology, and rescue by
      gene addition or variant-directed substrate therapy.
- discussion_id: aadc_gene_therapy_long_term_comparative_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How durable and broadly generalizable are gene-therapy benefits, and how do
    putaminal and midbrain targets compare in long-term efficacy and safety?
  rationale: >-
    Published follow-up supports benefit beyond five years in a small,
    uncontrolled treated cohort, but comparative target-site data, rare adverse
    events, and outcomes across severity, age, and genotype remain uncertain.
    Structured independent follow-up is therefore essential after regulatory
    authorization.
  attaches_to:
  - treatments#Eladocagene exuparvovec gene therapy
  - clinical_trials#NCT04903288
  evidence:
  - reference: PMID:37402126
    reference_title: "Gene therapy for aromatic L-amino acid decarboxylase deficiency: Requirements for safe application and knowledge-generating follow-up."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Due to lack of data on long-term outcomes and the comparative efficacy of
      alternative stereotactic procedures and brain target sites, a structured
      follow-up plan and systematic documentation of outcomes in a suitable,
      industry-independent registry study are necessary.
    explanation: The international expert statement directly defines the unresolved evidence needs.
  - reference: PMID:42389831
    reference_title: "Gene Therapy for Amino Acid Decarboxylase Deficiency: Clinical and Imaging Outcomes in a French Cohort."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients received bilateral intraputaminal rAAV2-hAADC infusion.
    explanation: The newest cohort adds independent follow-up but remains too small and single-target to close the comparative evidence gap.
- discussion_id: aadc_natural_history_ascertainment_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are unbiased age-specific phenotype frequencies, developmental
    trajectories, and survival estimates across genotypes and ancestry groups?
  rationale: >-
    The largest clinical synthesis combines heterogeneous reports susceptible
    to reporting bias, while the international natural-history cohort is
    retrospective and age-skewed. Current percentages are useful descriptive
    estimates, not population-based risks or causal genotype-phenotype rules.
  attaches_to:
  - progression#Persistent motor and developmental disability
  - progression#Survival and prognosis
  evidence:
  - reference: PMID:36268467
    reference_title: "Clinical Features in Aromatic L-Amino Acid Decarboxylase (AADC) Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although reporting bias cannot be excluded, there is still a need for
      comprehensive clinical descriptions of symptoms at onset and during
      follow-up.
    explanation: The systematic review explicitly identifies reporting bias and incomplete longitudinal description.
notes: >-
  AADC deficiency is distinct from disorders of dopamine synthesis upstream of
  DDC because both catecholamine and serotonin pathways are affected. Classical
  symptomatic pharmacotherapy remains variable in effect, while intraputaminal
  eladocagene exuparvovec is the disease-directed gene-addition therapy with
  documented regulatory approval.
datasets:
- accession: geo:GSE153990
  title: An iPSC-derived midbrain dopaminergic neuronal model of aromatic amino acid decarboxylase (AADC) deficiency gives insight into neurodevelopmental disease features
  description: Aromatic L-amino acid decarboxylase (AADC) deficiency is a complex inherited neurological disorder of monoamine synthesis which results in dopamine and serotonin deficiency. Affected patients have severe cognitive and motor delay, recurrent oculogyric crises, a complex movement disorder and high risk of premature mortality. Standard pharmacological treatment provides limited clinical benefit. Promising gene therapy approaches are emerging, though may not be either suitable or easily accessible for all patients.
  organism:
    preferred_term: human

- name: Distal Peripheral Nerve Hyperexcitability and Junctional Remodeling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The neuromuscular arm of SJS behaves as a congenital distal peripheral
    nerve hyperexcitability rather than as a myopathy or a nerve-trunk

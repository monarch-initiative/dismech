- name: Perlecan C1532Y point-mutation-only mouse
  species: Mouse
  genotype: Hspg2 p.C1532Y knock-in without the Neo cassette (C1532Y)
  publication: PMID:17213231
  description: >-
    The control arm of the same knock-in series, carrying only the human SJS
    missense change. Its mild phenotype is a substantive negative result: it
    implies that the point mutation alone is not sufficient to produce the SJS
    skeletal phenotype in mouse, and that transcriptional down-regulation of
    perlecan is what drives disease in this system.
  genes:
  - preferred_term: HSPG2
    term:
      id: hgnc:5273
      label: HSPG2
  modeled_mechanisms:
  - target: Chondrodysplasia and Skeletal Deformity
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Mice carrying only the SJS-associated C1532Y substitution show a mild
      phenotype inconsistent with SJS.
    limitations: >-
      This is a species/allele-level mismatch rather than a technical failure:
      the same substitution is associated with disease in the human family in
      which it was found. It leaves open whether the human allele acts through
      an additional transcriptional effect not reproduced in mouse, or whether
      the human family carries a second contributing lesion.
    readouts:
    - name: Skeletal phenotype severity
      target: Chondrodysplasia and Skeletal Deformity
      direction: UNCHANGED
      interpretation: >-
        A negative result: the isolated missense allele does not reproduce the

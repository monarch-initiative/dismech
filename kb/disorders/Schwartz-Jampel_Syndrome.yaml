        the previous “Perlecan group” and “Aggrecan group” were incorporated into the new group of “Proteoglycan core protein disorders”
      explanation: >-
        Supports the group's identity and its provenance from the merged 2019
        perlecan group. Note the scope of this citation: the consensus paper's
        text documents the restructuring, while the assignment of Schwartz-Jampel

  - target: Fiber-Type-Specific Myostatin and Akt-mTORC1 Dysregulation
    causal_link_type: DIRECT
    description: >-
      A third, cell-autonomous consequence of the perlecan deficit, independent
      of the endplate AChE route: perlecan loss releases myostatin restraint in
      fast-twitch muscle and lowers Akt/mTORC1 tone in slow-twitch muscle.
    evidence:

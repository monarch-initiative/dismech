notes: >-
  ENTITY-IDENTITY NOTE (do not "fix" by splitting or by re-pointing the
  disease_term). Historically "Schwartz-Jampel syndrome type 2" (SJS2, neonatal
  Schwartz-Jampel syndrome) was treated as a severe allelic variant of this
  disorder. It is not: SJS2 was shown to be caused by null mutations of LIFR
  and is now recognized as Stuve-Wiedemann syndrome, a clinically and
  genetically distinct condition (PMID:14740318). This entry therefore models
  only the HSPG2/perlecan disorder — which the modern literature calls SJS
  type 1 — and MONDO:0100435 (Schwartz-Jampel syndrome type 1) is recorded as a
  narrowMatch rather than as the primary anchor, because the top-level
  Orphanet-backed MONDO:0009717 concept is the one the SJS literature uses.
  Curators using deep-research output for this disease should treat any report
  that discusses LIFR, JAK/STAT3 or hyperthermic episodes as describing a
  different entity (CLAUDE.md section 2b, Named Entity Confusion).

  The allelic severe disorder dyssegmental dysplasia, Silverman-Handmaker type
  (DDSH; HSPG2 functional null) is deliberately NOT modeled here as a subtype:
  it is a separate lethal neonatal entity with its own MONDO term and is listed
  alongside SJS as a separate row of the ISDS nosology. It is referenced in
  this entry only as the null end of the perlecan dosage series and as a
  differential diagnosis, and remains an open curation target of
  monarch-initiative/dismech#7867.

name: Schwartz-Jampel Syndrome
creation_date: "2026-08-17T00:00:00Z"
category: Mendelian
description: >-
  Schwartz-Jampel syndrome (SJS, chondrodystrophic myotonia) is a rare
  autosomal recessive disorder in which hypomorphic mutations of HSPG2 reduce
  secretion of perlecan, the major heparan sulfate proteoglycan of basement
  membranes and of the cartilage pericellular matrix. The resulting perlecan
  deficiency produces a two-armed phenotype that is unusual among skeletal
  dysplasias: a chondrodysplasia with short stature, kyphoscoliosis, bowed
  diaphyses and irregular epiphyses, together with continuous muscle
  hyperactivity (myotonia/neuromyotonia) with a characteristic mask-like face,
  blepharophimosis, blepharospasm and pursed lips. The neuromuscular arm is
  best explained by distal peripheral nerve hyperexcitability arising from
  synaptic acetylcholinesterase deficiency at the motor endplate — perlecan is
  the basement-membrane anchor that concentrates AChE in the synaptic cleft —
  together with preterminal nerve and neuromuscular-junction remodeling, rather
  than by a muscle-membrane channelopathy. Allelic functional-null HSPG2
  mutations instead cause the lethal neonatal dyssegmental dysplasia,
  Silverman-Handmaker type, so SJS and DDSH form a perlecan gene-dosage series.
disease_term:
  preferred_term: Schwartz-Jampel syndrome
  term:

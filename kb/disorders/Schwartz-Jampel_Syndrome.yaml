      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, perlecan deficiency causes hypertrophy in fast-twitch muscles by reducing myostatin signaling (1) and also can cause atrophy in the slow-twitch muscles, possibly through disinhibition of autophagy related to reduced Akt/mTORC1 signaling (2).
      explanation: >-
        States the perlecan-to-myostatin and perlecan-to-Akt/mTORC1 links that
        this edge models, and marks them as separate from the endplate route.

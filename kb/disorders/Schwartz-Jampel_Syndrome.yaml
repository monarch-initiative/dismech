- name: Fiber-Type-Specific Myostatin and Akt-mTORC1 Dysregulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A signalling account of the muscle-bulk changes in perlecan deficiency that
    is separate from, and potentially additive to, the neuromuscular-hyperactivity
    account of hypertrophy. Perlecan is a myostatin-binding basement-membrane
    proteoglycan, so its loss reduces myostatin (TGF-beta family) growth
    restraint and drives hypertrophy selectively in fast-twitch muscle; in
    slow-twitch muscle the same deficit is associated instead with reduced
    Akt/mTORC1 signalling and disinhibited autophagy, producing atrophy. The
    entry records this as PROVISIONAL and the atrophy arm explicitly as
    hypothesised, because the source itself hedges the Akt/mTORC1-autophagy
    limb ("possibly through") and because the fibre-type dissection rests on
    mouse work rather than on SJS patient muscle. Curated so the entry does not
    silently assert only the weaker of the two available explanations for the
    Skeletal Muscle Hypertrophy phenotype.

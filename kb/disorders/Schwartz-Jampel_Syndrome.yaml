- name: Cartilage Pericellular Matrix Failure and Impaired Chondrocyte Condensation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Perlecan is deposited in the pericellular matrix surrounding chondrocytes,
    where domain IV of the core protein drives prechondrocyte clustering — the
    condensation step that initiates cartilage formation — through
    deactivation of FAK/Src and reduced ERK signaling, with induction of Sox9,
    N-cadherin, collagen II and aggrecan. An SJS-associated domain IV missense
    change (R3452Q) limits this clustering activity, and SJS-associated
    mutations in the disulfide-rich region 3 destabilize the protein.
  cell_types:

differential_diagnoses:
- name: Stuve-Wiedemann syndrome (formerly "Schwartz-Jampel syndrome type 2")
  description: >-
    Severe neonatal condition with bowed long bones, respiratory distress,
    feeding difficulties and hyperthermic episodes causing early lethality.
    Historically classified as SJS type 2 on clinical overlap, it is caused by
    null LIFR mutations with impaired JAK/STAT3 signaling and is a genetically
    distinct disorder — not an allelic form of the HSPG2 disease modeled here.
  distinguishing_features:
  - Causal gene LIFR (5p13.1) rather than HSPG2
  - Hyperthermic episodes causing early lethality
  - No perlecan deficiency
  evidence:
  - reference: PMID:14740318
    reference_title: Null leukemia inhibitory factor receptor (LIFR) mutations in Stuve-Wiedemann/Schwartz-Jampel type 2 syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude, therefore, that SWS and SJS2 represent a single clinically and genetically homogeneous condition due to null mutations in the LIFR gene on chromosome 5p13.
    explanation: >-
      Establishes that the historical "SJS type 2" is Stuve-Wiedemann syndrome,
      a distinct LIFR disorder.
- name: Dyssegmental dysplasia, Silverman-Handmaker type (DDSH)
  description: >-
    Lethal autosomal recessive neonatal skeletal dysplasia caused by functional
    null mutations of the same gene, HSPG2. Allelic with SJS but at the null
    end of the perlecan dosage series.
  distinguishing_features:
  - Functional-null rather than hypomorphic HSPG2 alleles
  - Truncated perlecan is not secreted at all, rather than secreted at reduced level
  - Neonatal lethality with dyssegmental ossification of the spine
  evidence:
  - reference: PMID:11279527
    reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, DDSH is caused by a functional null mutation of HSPG2.
    explanation: >-
      Establishes the allelic but mechanistically distinct null disorder.
  - reference: PMID:11279527
    reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemically, truncated perlecan was not secreted by the patient fibroblasts, but was degraded to smaller fragments within the cells.
    explanation: >-
      Gives the biochemical distinction from the hypomorphic SJS alleles, which
      still permit reduced secretion.
discussions:
- discussion_id: sjs_ache_sufficiency_gap
  prompt: >-
    Is endplate acetylcholinesterase deficiency sufficient to generate the
    spontaneous muscle activity of Schwartz-Jampel syndrome, or are additional
    perlecan-dependent changes required?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Endplate Acetylcholinesterase Deficiency
  - pathophysiology#Distal Peripheral Nerve Hyperexcitability and Junctional Remodeling
  rationale: >-
    The mouse model that established the endplate AChE deficiency in vivo also
    showed that the deficiency alone did not produce resting spontaneous EMG
    activity in the diaphragm, so the causal chain from AChE loss to continuous
    muscle hyperactivity is necessary-but-not-obviously-sufficient. The human
    biopsy study points to a combination of synaptic AChE deficiency,
    preterminal amyelination and junctional remodeling acting synergistically.
    Which of those is rate-limiting is unresolved, and it matters
    therapeutically: an AChE-directed strategy would only help if that arm
    dominates.
  proposed_experiments:
  - experiment_id: sjs_nmj_perlecan_restoration
    name: Muscle-specific perlecan restoration in the SJS mouse
    description: >-
      Restore synaptic perlecan (and hence endplate AChE) selectively at the
      neuromuscular junction in the C1532Yneo line and test whether spontaneous
      EMG activity resolves without correcting preterminal myelination.
  evidence:
  - reference: PMID:18647752
    reference_title: Evidence of a dosage effect and a physiological endplate acetylcholinesterase deficiency in the first mouse models mimicking Schwartz-Jampel syndrome neuromyotonia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, physiological endplate AChE deficiency was not associated with spontaneous activity at rest on EMG in the diaphragm, suggesting that additional changes are required to generate such activity characteristic of SJS.
    explanation: >-
      The authors state the insufficiency directly; this is the gap recorded
      here.
- discussion_id: sjs_c1532y_mouse_human_mismatch
  prompt: >-
    Why does the SJS-associated HSPG2 C1532Y substitution cause disease in the
    human family in which it was found but only a mild, non-SJS phenotype when
    knocked into mouse without a transcription-lowering cassette?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#HSPG2 Hypomorphic Variation
  - pathophysiology#Chondrodysplasia and Skeletal Deformity
  - animal_models#Perlecan C1532Y point-mutation-only mouse
  rationale: >-
    The knock-in series separates the missense change from the transcriptional
    down-regulation supplied by the retained Neo cassette. Only the
    down-regulated line reproduces SJS, which led the authors to question
    whether C1532Y is the sole causative factor in the human family. Two
    readings remain open — that the human allele carries an additional
    transcriptional effect the mouse construct does not reproduce, or that
    mouse tolerates a perlecan level that human does not — and they imply
    different things about how faithfully hypomorphic-allele mouse models can
    be used to rank SJS variant severity.
  proposed_experiments:
  - experiment_id: sjs_c1532y_family_expression_reanalysis
    name: Re-sequencing and expression analysis of the original C1532Y family
    description: >-
      Determine HSPG2 transcript level and search for a second cis-acting
      regulatory variant in the family carrying C1532Y, to test whether the
      human genotype includes a transcriptional component absent from the
      mouse knock-in.
  evidence:
  - reference: PMID:17213231
    reference_title: Reduced perlecan in mice results in chondrodysplasia resembling Schwartz-Jampel syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These studies question the C1532Y mutation as the sole causative factor of SJS in the human family harboring this alteration and imply that transcriptional changes leading to perlecan reduction may represent the disease mechanism for SJS.
    explanation: >-
      States the mismatch and the authors' proposed resolution.
tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/7867
  title: "Coverage gap: 4 ISDS skeletal-nosology groups have zero dismech entries"
  tracked_issue_role: SOURCE
  notes: >-
    This entry is the first dismech member of the ISDS 2023 group 7
    (proteoglycan core protein disorders). The remaining members listed in that
    issue — dyssegmental dysplasia (HSPG2) and the three ACAN disorders —
    are still uncurated.
review_notes: >-
  Second-pass curation targets deliberately left open in this first pass:
  (1) no Orphanet provenance — ORPHA:800 is not in references_cache and would
  need an Orphadata refresh, which would also supply HPO frequency annotations;
  (2) no phenotype frequency: bands, per docs/frequency-evidence-guidelines.md,
  since no source in the evidence set quantifies them;
  (3) no histopathology or imaging_findings blocks (the muscle-biopsy and
  skeletal-survey findings are currently carried as pathophysiology evidence);
  (4) no conforms_to declared — there is no basement-membrane / pericellular
  proteoglycan module in kb/modules/, and the endochondral-ossification
  mechanism here is not the FGFR gain-of-function pattern; a module covering
  proteoglycan core-protein deficiency would be a reasonable follow-up once the
  ACAN and DDSH entries exist to conform to it.

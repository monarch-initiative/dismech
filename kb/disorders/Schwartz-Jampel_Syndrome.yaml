        row for the disorder, which is not quotable from the cached record.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    SJS segregates as an autosomal recessive trait; affected individuals carry
    biallelic (homozygous or compound heterozygous) hypomorphic HSPG2 variants
    and heterozygous parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11101850
    reference_title: "Perlecan, the major proteoglycan of basement membranes, is altered in patients with Schwartz-Jampel syndrome (chondrodystrophic myotonia)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Schwartz-Jampel syndrome (SJS1) is a rare autosomal recessive disorder characterized by permanent myotonia (prolonged failure of muscle relaxation) and skeletal dysplasia
    explanation: >-
      The disease-gene identification paper states the autosomal recessive mode
      of inheritance.
  - reference: PMID:33767660
    reference_title: A Novel Pathogenic HSPG2 Mutation in Schwartz-Jampel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation carried by the asymptomatic parents was previously registered in a single-nucleotide polymorphism database
    explanation: >-
      Carriage of the pathogenic allele by asymptomatic parents is direct
      evidence of recessive inheritance with unaffected heterozygotes.

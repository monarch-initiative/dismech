    reference_title: Spectrum of HSPG2 (Perlecan) mutations in patients with Schwartz-Jampel syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but four mutations were private, and we found no evidence for a founder effect.
    explanation: >-
      Supports the allelic-heterogeneity statement recorded in this block.
  - reference: PMID:37761893
    reference_title: "Novel HSPG2 Gene Mutation Causing Schwartz-Jampel Syndrome in a Moroccan Family: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Schwartz-Jampel syndrome type 1 (SJS1) is a rare autosomal recessive musculoskeletal disorder caused by various mutations in the HSPG2 gene encoding the protein perlecan, a major component of basement membranes.
    explanation: >-
      Contemporary confirmation of HSPG2 as the causal gene for SJS1.

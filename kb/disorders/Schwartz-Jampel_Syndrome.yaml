        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, C1532Y mice, harboring only the mutation associated with SJS, displayed a mild phenotype, inconsistent with SJS.
        explanation: Reports the negative skeletal result for this line.
    evidence:
    - reference: PMID:17213231

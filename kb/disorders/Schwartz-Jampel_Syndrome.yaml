  description: >-
    Primary fibroblasts from a patient homozygous for HSPG2 c.1125C>G
    (p.Cys375Trp), used to test the functional consequence of the variant.
    Secreted perlecan and migration were reduced while proliferation was
    unaffected, giving a cell-level readout of the hypomorphic effect.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606

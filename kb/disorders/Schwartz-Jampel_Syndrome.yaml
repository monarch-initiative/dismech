  notes: >-
    CK is raised but only modestly so — 750-800 U/L in the two serial
    measurements reported for one molecularly confirmed SJS1 patient, an order
    of magnitude below the values typical of Duchenne muscular dystrophy. The
    elevation is a non-specific marker of the muscle involvement and does not

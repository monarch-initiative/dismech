        FAILS_TO_RECAPITULATE link.
- name: Perlecan-null (Hspg2 knockout) mouse
  species: Mouse
  genotype: Hspg2 null (knockout)
  publication: PMID:11279527
  description: >-
    The complete-null end of the perlecan dosage series. It models the allelic

pathophysiology:
- name: HSPG2 Hypomorphic Variation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic partial loss-of-function variants distributed across the 97 exons
    of HSPG2 are the initiating lesion. Two molecularly distinct routes reduce
    the amount of functional perlecan reaching the extracellular space:
    truncating alleles destabilize HSPG2 mRNA through nonsense-mediated decay,
    while missense alleles affecting cysteine residues cause intracellular
    retention of the mutant core protein by ER quality control. Crucially,
    these are hypomorphic rather than null alleles — the same gene's functional
    null alleles cause dyssegmental dysplasia, Silverman-Handmaker type.
  genes:
  - preferred_term: HSPG2
    term:
      id: hgnc:5273
      label: HSPG2
  genetic_context:
    gene:
      preferred_term: HSPG2
      term:
        id: hgnc:5273
        label: HSPG2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous hypomorphic germline HSPG2 alleles;
      compound heterozygosity is common because almost all reported mutations
      are private.
  evidence:
  - reference: PMID:11101850
    reference_title: "Perlecan, the major proteoglycan of basement membranes, is altered in patients with Schwartz-Jampel syndrome (chondrodystrophic myotonia)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe mutations, including missense and splicing mutations, of the gene encoding perlecan (HSPG2) in three SJS1 families.
    explanation: >-
      Identifies HSPG2 as the SJS disease gene, the initiating lesion of this
      pathograph.
  - reference: PMID:16927315
    reference_title: Spectrum of HSPG2 (Perlecan) mutations in patients with Schwartz-Jampel syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations included nine deletion or insertion (41%), six splice site (27%), five missense (23%), and two nonsense mutations (9%).
    explanation: >-
      Documents the allelic spectrum across 23 families, supporting the
      variety of variant classes recorded on this node.
  - reference: PMID:16927315
    reference_title: Spectrum of HSPG2 (Perlecan) mutations in patients with Schwartz-Jampel syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our analyses strengthen the idea that SJS results from hypomorphic mutations of the HSPG2 gene.
    explanation: >-
      Establishes that SJS-causing alleles are hypomorphic, not null — the
      distinction that separates SJS from DDSH.
  downstream:
  - target: Reduced Perlecan Secretion into Basement Membranes
    causal_link_type: DIRECT
    description: >-
      Both truncating (NMD) and cysteine-missense (intracellular retention)
      alleles converge on less perlecan being secreted.
    evidence:
    - reference: PMID:16927315
      reference_title: Spectrum of HSPG2 (Perlecan) mutations in patients with Schwartz-Jampel syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        truncating mutations resulted in instability of HSPG2 mRNA through nonsense mRNA-mediated decay, whereas missense mutations involving cysteine residues led to intracellular retention of perlecan, probably due to quality control pathways
      explanation: >-
        Gives the two molecular routes by which HSPG2 variants reduce secreted
        perlecan.
    - reference: PMID:33767660
      reference_title: A Novel Pathogenic HSPG2 Mutation in Schwartz-Jampel Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        At cellular levels, mutant primary fibroblasts had reduced levels of secreted perlecan and impaired migration ability but normal capability of proliferation.
      explanation: >-
        Patient-derived fibroblasts directly demonstrate reduced perlecan
        secretion downstream of the HSPG2 variant.
- name: Reduced Perlecan Secretion into Basement Membranes
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Perlecan is the major heparan sulfate proteoglycan of basement membranes
    and of the cartilage pericellular matrix. Reduced secretion lowers its
    concentration in basement membranes throughout the body, and the residual
    level sets disease severity: perlecan abundance and phenotype severity are
    inversely correlated in allelic mouse lines, and complete absence produces
    the lethal DDSH phenotype instead. From this single molecular deficit the
    pathograph branches into an ECM/cartilage arm and a synaptic/neuromuscular
    arm.

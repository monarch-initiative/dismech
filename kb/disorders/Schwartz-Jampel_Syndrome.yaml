diagnosis:
- name: Clinical recognition with molecular confirmation
  description: >-
    The diagnostic route for SJS1. The combination of myotonic signs with the
    typical facial features and skeletal dysplasia is regarded as
    pathognomonic, so the diagnosis is made clinically and then confirmed by
    sequencing HSPG2; instrumental studies are supportive rather than
    discriminating.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37761893
    reference_title: "Novel HSPG2 Gene Mutation Causing Schwartz-Jampel Syndrome in a Moroccan Family: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, SJS1 diagnosis mainly relies on clinical data, then needing molecular confirmation.
    explanation: >-
      States the diagnostic strategy directly — clinical recognition first,
      molecular confirmation second.
  - reference: PMID:38285320
    reference_title: Successful Treatment of Schwartz-Jampel Syndrome with Botulinum Toxin Type A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While electromyography (EMG) signs of myotonia and X-ray abnormalities are commonly used in diagnosing SJS, we opted for genetic confirmation instead of EMG
    explanation: >-
      A worked case in which molecular testing substituted for EMG, supporting
      genetic confirmation as sufficient.
  notes: >-
    Worth flagging for anyone extending this section: the same review states
    that EMG and muscle biopsy "do not provide any additional clues useful for
    the diagnosis of SJS1", so their role is to place the patient in the
    myotonic-disorder differential, not to establish SJS.
- name: Needle electromyography
  description: >-
    EMG in SJS shows continuous high-frequency repetitive discharges — often
    complex repetitive discharges lacking the waxing-and-waning of classical
    myotonia. It establishes that the stiffness is of neuromuscular origin and
    is the instrumental correlate of the Continuous Muscle Fiber Hyperactivity
    node, but it does not by itself distinguish SJS from other myotonic
    disorders.
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:37761893
    reference_title: "Novel HSPG2 Gene Mutation Causing Schwartz-Jampel Syndrome in a Moroccan Family: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The creatine kinacse (CK) level was elevated (750 U/L), and electromyograph (EMG) revealed myotonic discharges with high-frequency repetitive activity.
    explanation: >-
      Reports the characteristic EMG finding in a molecularly confirmed case.
  - reference: PMID:33767660
    reference_title: A Novel Pathogenic HSPG2 Mutation in Schwartz-Jampel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

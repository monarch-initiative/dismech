      phenotype.
  downstream:
  - target: Distal Peripheral Nerve Hyperexcitability and Junctional Remodeling
    causal_link_type: DIRECT
    description: >-
      Prolonged cholinergic action at a structurally remodeled, partly
      amyelinated preterminal axon generates ectopic distal nerve activity.
    evidence:

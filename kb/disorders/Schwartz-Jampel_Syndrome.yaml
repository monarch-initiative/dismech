    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 7 "Proteoglycan core proteins
      disorders", listed there as "Schwartz-Jampel syndrome (myotonic
      chondrodystrophy)" with HSPG2. In the 2019 revision (PMID:31633310) the
      same disorder sat in the separate "Perlecan group"; the 2023 revision
      merged the perlecan and aggrecan groups into this single group.
    evidence:
    - reference: PMID:36779427
      reference_title: "Nosology of genetic skeletal disorders: 2023 revision."
      supports: SUPPORT
      evidence_source: OTHER

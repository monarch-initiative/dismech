      In previous literature, needle EMG often reveals CRDs with higher frequency and lack of typical waxing and waning compared to typical myotonia discharge
    explanation: >-
      Characterizes the discharge morphology and, importantly, distinguishes it
      from classical myotonic discharges.
genetic:
- name: HSPG2
  gene_term:
    preferred_term: HSPG2
    term:
      id: hgnc:5273
      label: HSPG2
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  frequency: >-
    The only gene known to cause Schwartz-Jampel syndrome; almost all reported
    alleles are private, with no founder effect identified.
  notes: >-
    Variants are distributed across the whole gene rather than clustering in a
    hotspot, and both truncating and missense classes are pathogenic. Whether a
    given allele produces a hypomorphic or a functional-null protein determines
    whether the phenotype is SJS or the lethal allelic disorder DDSH.
  evidence:
  - reference: PMID:11101850
    reference_title: "Perlecan, the major proteoglycan of basement membranes, is altered in patients with Schwartz-Jampel syndrome (chondrodystrophic myotonia)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In so doing, we have identified the first human mutations in HSPG2
    explanation: >-

notes: >-
  Scope note: this entry covers the HHV-8-negative idiopathic multicentric form
  only. It was split out of the former umbrella `Castleman_Disease` entry,
  together with `Unicentric_Castleman_Disease` and
  `HHV-8-Associated_Multicentric_Castleman_Disease`, because those forms have
  different causes, different first-line therapy, and different confirmatory
  tests - differences that live in `pathophysiology`, `treatments` and
  `diagnosis`, none of which carry a `subtype:` discriminator. The curated union
  is kept in `kb/groupings/Castleman_Disease.yaml`.

  Subtype note: iMCD-TAFRO, iMCD-IPL and iMCD-NOS are kept as `has_subtypes`
  rather than as separate entries because they share an etiology (unknown), the
  same diagnostic criteria, and the same first-line drug. TAFRO is the closest
  to the line - it has its own MONDO term (MONDO:0018702), its own Japanese
  diagnostic criteria, and two pathophysiology nodes here that do not apply to
  its siblings - and should be promoted to its own entry if a subtype-specific
  first-line therapy is established, plausibly sirolimus via NCT03933904.
  Whether iMCD-IPL should be a formal subtype at all is contested and recorded
  as `controversy_imcd_ipl_as_subtype`.

  Evidence note: the stromal, autoantibody, mTOR and subtype-specific IL-6-source
  nodes rest on human tissue or serum association without any perturbation
  experiment, because no validated animal or cell-culture model of Castleman
  disease exists. That limitation is recorded as its own knowledge gap
  (gap_imcd_no_disease_model) and is why those nodes carry EMERGING hypothesis
  groups and, where applicable, HYPOTHETICAL mechanism confidence rather than
  being asserted as established mechanism.

discussions:
- discussion_id: gap_imcd_initiating_process
  prompt: >-
    What initiates idiopathic multicentric Castleman disease - autoimmunity, an
    ectopic clonal cytokine source, a non-HHV-8 infection, or a germline
    inflammatory predisposition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unknown iMCD Initiating Process
  - pathophysiology#Autoantibody-Mediated Immune Dysregulation
  - pathophysiology#Somatic Stromal Cell Mutation
  rationale: >-
    This is the field's central unanswered question and everything downstream
    depends on it. Three candidate processes were formally proposed in 2014 and
    none has been confirmed or excluded since. Viral-Track sequencing of 22 UCD
    and 19 iMCD nodes found no shared viral signature, weakening the infectious
    candidate; autoantibody enrichment supports but does not establish the
    autoimmune candidate; and recurrent somatic alleles support but do not
    establish a clonal candidate. Because the etiology is unknown, iMCD is
    defined by exclusion, has no diagnostic biomarker, and is treated with a
    single-cytokine blockade that fails in most patients.
  evidence:
  - reference: PMID:24622327
    reference_title: "HHV-8-negative, idiopathic multicentric Castleman disease: novel insights into biology, pathogenesis, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urgent priorities include elucidating the process driving iMCD hypercytokinemia, identifying the hypercytokine-secreting cell, developing consensus criteria for diagnosis, and building a patient registry to track cases."
    explanation: >-
      States the gap as an explicit research priority. Two of the four priorities
      listed (consensus criteria, registry) have since been met; the first two have not.
  - reference: DOI:10.1038/s41598-025-85193-x
    reference_title: "No evidence for active viral infection in unicentric and idiopathic multicentric Castleman disease by Viral-Track analysis"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "While uncontrolled infection with human herpesvirus-8 (HHV-8) is responsible for the cytokine storm in a portion of multicentric CD (HHV-8-associated MCD) cases, the etiology of unicentric CD (UCD) and HHV-8-negative/idiopathic MCD (iMCD) is unknown."
    explanation: Confirms the gap is still open as of a 2025 sequencing study.
  proposed_experiments:
  - experiment_id: exp_imcd_paired_multiomic_etiology_screen
    name: Paired serologic, viral, and clonality screen across adjudicated iMCD subtypes
    description: >-
      In a prospectively enrolled, expert-adjudicated iMCD cohort stratified by
      TAFRO/IPL/NOS, run in parallel on the same patients: unbiased
      autoantigen-array and functional receptor-blocking serology, metagenomic
      and viral-capture sequencing of lymph node and plasma, and deep targeted
      sequencing of sorted stromal, plasma cell, and T cell fractions for
      clonality. Testing the three candidate etiologies on shared samples is what
      makes them comparable; the existing evidence for each comes from separate
      cohorts.
    would_support:
    - pathophysiology#Autoantibody-Mediated Immune Dysregulation
    - pathophysiology#Somatic Stromal Cell Mutation
    supporting_outcome:
    - >-
        A candidate process is enriched in one subtype and co-segregates with disease activity, with the other two candidates negative in the same patients.
    refuting_outcome:
    - >-
        All three candidate processes are negative or are equally present in disease controls, indicating the initiating process lies outside the three proposed categories.
- discussion_id: gap_imcd_no_disease_model
  prompt: >-
    Can a cell-culture or animal model be built that reproduces the Castleman
    lymph node lesion, and until one exists how can any proposed mechanism be
    tested causally?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
  - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
  - pathophysiology#Stromal VEGF Overproduction and Neovascularization
  rationale: >-
    Every mechanism node in this entry derives from human tissue association -
    spatial transcriptomics, immunohistochemistry, serum proteomics - with no
    perturbation experiment behind it, because no validated model system exists.
    The authors of the largest spatial study state this limitation directly and
    note that the disease may have no genetic basis to engineer, being instead
    immune-driven by antigenic stimuli whose origin is unknown. This is the
    upstream reason the causal direction of the stromal model cannot be settled:
    stromal activation could be driving the cytokine storm or responding to it.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of accurate cell culture or murine models limits functional studies of CD."
    explanation: States the gap in the authors' own words.
  proposed_experiments:
  - experiment_id: exp_cd_lymphoid_organoid_stromal_perturbation
    name: Human lymphoid organoid with defined stromal perturbation
    description: >-
      Build a human lymphoid organoid or lymph-node-on-chip containing primary
      follicular dendritic cells, T-zone and perivascular reticular cells, naive
      B cells, and endothelium, then perturb single stromal populations
      (constitutive PDGFRB N666S expression, forced VEGFA or IL6 expression,
      lymphotoxin-beta receptor stimulation, DLL4-NOTCH1 blockade) and score for
      the defining tissue readouts: CD21 meshwork expansion, concentric mantle-zone
      B cell layering, perifollicular neovascularization, and plasmablast output.
    would_support:
    - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
    - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
    supporting_outcome:
    - >-
        Perturbing a single stromal population reproduces the onion-skinning and penetrating-vessel architecture, establishing stromal activation as sufficient rather than reactive.
    refuting_outcome:
    - >-
        No stromal perturbation reproduces the architecture, indicating the lesion requires a systemic or hematopoietic input absent from the organoid.
- discussion_id: gap_imcd_anti_il6_nonresponse
  prompt: >-
    What drives disease in the majority of iMCD patients who do not respond to
    IL-6 blockade, and can non-responders be identified before weeks of failed
    therapy have passed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#IL-6 Overproduction
  - pathophysiology#PI3K/AKT/mTOR Pathway Activation
  - pathophysiology#CXCL13 Chemokine Axis Elevation
  rationale: >-
    Siltuximab produced a durable response in 34% of patients in the registration
    trial and is effective in roughly 34-50% of cases, so most patients treated
    with the only approved drug do not benefit from it, and severe patients have
    a narrow window before escalation to cytotoxic chemotherapy is needed. Two
    partial answers exist and neither is complete: PI3K/AKT/mTOR activation
    identified in three refractory TAFRO patients, and an early CXCL13 fall that
    predicts response by day 8. What drives the remaining non-responders is not
    known.
  evidence:
  - reference: PMID:36433996
    reference_title: CXCL13 is a predictive biomarker in idiopathic multicentric Castleman disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interleukin-6 (IL-6) is a known disease driver in some patients, but anti-IL-6 therapy with siltuximab is not effective in all patients, and biomarkers indicating success at an early time point following treatment initiation are lacking."
    explanation: States both halves of the gap - unexplained non-response and missing early biomarkers.
  - reference: PMID:31408438
    reference_title: "Identifying and targeting pathogenic PI3K/AKT/mTOR signaling in IL-6-blockade-refractory idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular underpinnings of interleukin-6(IL-6)-blockade refractory patients remain unknown; no targeted therapies exist."
    explanation: The explicit statement of the gap that motivated the mTOR work.
  proposed_experiments:
  - experiment_id: exp_imcd_pretreatment_endotype_stratified_trial
    name: Pretreatment endotype stratification with response-adaptive assignment
    description: >-
      Profile serum proteome, lymph node spatial transcriptome, and PBMC
      phospho-signaling before first-line therapy in an iMCD cohort, assign a
      candidate endotype (IL-6-high, CXCL13-high, TNF-high, mTOR-high), then
      randomize within endotype to IL-6 blockade versus the endotype-matched
      agent (sirolimus for mTOR-high, JAK inhibition for broad gp130 signaling).
      A day-8 CXCL13 readout is embedded as a prespecified early futility rule.
    would_support:
    - mechanistic_hypotheses#immune_stromal_dysregulation
    - mechanistic_hypotheses#il6_independent_mtor
    supporting_outcome:
    - >-
        Endotype-matched assignment beats uniform IL-6 blockade on durable response, and day-8 CXCL13 identifies non-responders before week 3.
    refuting_outcome:
    - >-
        Response rates are the same regardless of pretreatment endotype, indicating the proposed endotypes are descriptive rather than predictive.
- discussion_id: gap_stromal_cytokine_source_causality
  prompt: >-
    Are activated lymph node stromal cells the source that drives the Castleman
    cytokine excess, or do they expand and secrete in response to a cytokine
    excess generated elsewhere?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
  - pathophysiology#Stromal VEGF Overproduction and Neovascularization
  - pathophysiology#IL-6 Overproduction
  rationale: >-
    The spatial data establish where VEGF and IL-6 transcripts are, not what
    started them. The question is not academic: if stromal cells are the driver,
    stroma-directed agents (lymphotoxin-beta receptor fusion proteins, VEGF
    inhibitors, NOTCH inhibitors) are rational; if they are responders, those
    agents treat a consequence. The evidence is one observational cohort of
    22 cases with no perturbation, and the subtype-specific IL-6 source data
    point the other way for TAFRO, where endothelial IL-6 is proposed to be
    secondary to the cytokine storm.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A limitation of the study is the moderate sample size and its observational nature."
    explanation: >-
      The authors' own statement of the limitation that leaves causal direction
      unresolved.
  - reference: PMID:40931874
    reference_title: "Distinct interleukin-6 production in IPL and TAFRO subtypes of idiopathic multicentric Castleman disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, IL-6 production in iMCD-TAFRO may be predominantly from vascular endothelial cells, suggesting that elevated serum IL-6 is a secondary phenomenon of the cytokine storm in this subtype."
    explanation: >-
      Argues explicitly for the responder interpretation in at least one subtype,
      which is why the question is recorded as open rather than settled.
- discussion_id: controversy_imcd_ipl_as_subtype
  prompt: >-
    Should iMCD-IPL be recognized as a formal subtype separate from iMCD-NOS, and
    if so, does the CDCN severity classification apply to it?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - has_subtypes#iMCD-IPL
  - has_subtypes#iMCD-NOS
  rationale: >-
    The CDCN consensus criteria recognize only TAFRO and NOS, but IPL accounted
    for 45.2% of 228 iMCD-NOS patients in the largest cohort and behaved
    differently: higher inflammatory state, longer overall survival, better
    response to myeloma-like and IL-6-blocking regimens than to lymphoma-like
    ones, and - importantly - no survival difference between CDCN-severe and
    CDCN-non-severe patients, meaning the severity classification does not
    stratify this group. The 2026 expert perspective now lists IPL as one of
    three iMCD subtypes. Recording it as a subtype here follows that, but the
    formal criteria have not been revised.
  evidence:
  - reference: PMID:38356434
    reference_title: "Idiopathic multicentric Castleman disease (iMCD)-idiopathic plasmacytic lymphadenopathy: A distinct subtype of iMCD-not otherwise specified with different clinical features and better survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether these patients should be excluded from the current classification system lacks sufficient evidence."
    explanation: States the controversy directly.
  - reference: PMID:38356434
    reference_title: "Idiopathic multicentric Castleman disease (iMCD)-idiopathic plasmacytic lymphadenopathy: A distinct subtype of iMCD-not otherwise specified with different clinical features and better survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant difference in overall survival was observed between severe and non-severe patients in the iMCD-IPL group according to the CDCN severity classification."
    explanation: >-
      The specific finding that the existing severity classification fails to
      stratify IPL patients, which is the practical stake in this controversy.
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three subtypes are iMCD–thrombocytopenia, anasarca, fever, renal dysfunction/reticulin fibrosis, organomegaly (TAFRO); iMCD–idiopathic plasmacytic lymphadenopathy (IPL); and iMCD–not otherwise specified (NOS)."
    explanation: The expert review that treats IPL as a subtype, which this entry follows.
- discussion_id: controversy_imcd_malignancy_risk
  prompt: >-
    Does iMCD raise the risk of subsequent myeloid and solid malignancy, or is
    the reported excess an artifact of misclassifying malignancy-associated
    reactive lymphadenopathy as iMCD?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - has_subtypes#iMCD-TAFRO
  - has_subtypes#iMCD-NOS
  rationale: >-
    A systematic review and a claims-based study both reported increased myeloid
    and solid malignancy after iMCD, but in the expert-adjudicated ACCELERATE
    cohort only one patient developed a myeloid malignancy and no patient
    developed diffuse large B-cell lymphoma, with a malignancy rate comparable to
    the claims study's controls. The two readings have opposite implications: an
    excess means iMCD warrants cancer surveillance, whereas an artifact means
    claims-based iMCD cohorts contain patients who only ever had a malignancy.
    Because iMCD diagnostic criteria explicitly exclude concurrent malignancy,
    strict adjudication could also be excluding genuine iMCD patients who then
    developed cancer, so neither cohort settles it.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort, few patients developed a malignancy following the diagnosis of iMCD."
    explanation: The adjudicated-registry finding on one side of the controversy.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, our strict inclusion criteria might have inadvertently excluded true iMCD patients who also developed malignancies."
    explanation: >-
      The authors' own statement of why their negative result does not settle the
      question either.

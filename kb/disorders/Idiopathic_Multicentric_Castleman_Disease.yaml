description: >-
  Idiopathic multicentric Castleman disease (iMCD) is the HHV-8-negative
  multicentric form, and the one whose cause is unknown. It presents with
  multicentric lymphadenopathy, characteristic angiofollicular lymph node
  histopathology, cytopenias, and a systemic inflammatory syndrome that can
  progress to multiorgan failure. Diagnosis is by the international consensus
  criteria and is a diagnosis of exclusion: there is no diagnostic serum
  biomarker, and infection, malignancy and autoimmune disease - all of which can
  produce Castleman-like nodal changes - must be ruled out first.
  Three clinical subtypes with materially different courses are recognized:
  iMCD-TAFRO, an acute cytokine storm with thrombocytopenia, anasarca, renal
  dysfunction and marrow fibrosis; iMCD-IPL, an indolent form with polyclonal
  hypergammaglobulinemia and thrombocytosis that closely mimics IgG4-related
  disease; and iMCD-NOS. First-line therapy across all three is the anti-IL-6
  antibody siltuximab, the only approved drug, but it produces a durable response
  in only about a third of patients and what drives the remainder is not known.
  An emerging framework proposes immune-stromal dysregulation - activated
  follicular dendritic, T-zone and perivascular reticular cells supplying VEGF
  and IL-6 - alongside molecular endotypes defined by IL-6, CXCL13, TNF and
  PI3K/AKT/mTOR pathway activation. That framework is recorded here as EMERGING
  rather than as settled pathophysiology, and the absence of any validated
  animal or cell-culture model is the reason it cannot yet be tested causally.
mechanistic_hypotheses:
- hypothesis_group_id: immune_stromal_dysregulation
  hypothesis_label: Immune-Stromal Dysregulation and Molecular Endotypes
  status: EMERGING
  description: >-
    Molecular endotypes defined by differential pathway activation (IL-6 vs.
    CXCL13 vs. TNF vs. PI3K/AKT/mTOR signaling) underlie clinical and
    therapeutic heterogeneity in iMCD. Single-cell transcriptomics and spatial
    biology identify immune-stromal dysregulation involving fibroblastic
    reticular cells and endothelial dysfunction as core mechanistic components.
  applies_to_subtypes:
  - iMCD-TAFRO
  - iMCD-IPL
  - iMCD-NOS
  evidence:
  - reference: PPR:PPR1286884
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent discoveries have transformed Castleman disease from a
      clinicopathological entity largely defined by interleukin-6 excess into a
      complex disorder of immune–stromal dysregulation. Single-cell
      transcriptomics and spatial biology have identified fibroblastic reticular
      cells, endothelial dysfunction and dysregulated immune-cell communication
      as central pathogenic components.
    explanation: >-
      Narrative review synthesizing recent molecular and immunological
      discoveries, establishing immune-stromal dysregulation as an organizing
      framework for contemporary pathophysiology.
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD shows increased stromal cells that form unique microenvironments."
    explanation: >-
      Spatial proteomic and transcriptomic mapping of 22 Castleman lymph nodes
      provides the primary tissue evidence for a stromal-centred model.
- hypothesis_group_id: stromal_cytokine_source
  hypothesis_label: Lymph Node Stromal Cells as the Source of IL-6 and VEGF
  status: EMERGING
  description: >-
    The cells that oversupply IL-6 and VEGF in iMCD are lymph node stromal cells
    - PDGFRA+ T-zone reticular cells and ACTA2+ perivascular reticular cells,
    with CXCL13+ follicular dendritic cells contributing inside follicles -
    rather than the hematopoietic compartment that earlier immunohistochemical
    work implicated. The T-zone and perivascular subsets are the ones that expand
    in multicentric disease, in contrast to the B-zone reticular cells that
    dominate the unicentric form. The evidence is a single spatial multi-omic
    study of 22 cases with no functional perturbation, so the causal direction
    (stromal activation driving the cytokine storm versus responding to it) is
    not established.
  applies_to_subtypes:
  - iMCD-TAFRO
  - iMCD-IPL
  - iMCD-NOS
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCD is characterized by increased TRC while UCD shows increased B-reticular cells (BRC)."
    explanation: >-
      Establishes that distinct stromal subsets dominate the unicentric and
      multicentric forms, the core claim of this hypothesis group.
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, prominent FDCs in CD were considered remnants of attenuated germinal centers."
    explanation: >-
      States the prior interpretation this hypothesis displaces: follicular
      dendritic cells as passive remnants rather than activated drivers.
- hypothesis_group_id: autoimmune_etiology
  hypothesis_label: Autoantibody-Driven Etiology of iMCD
  status: EMERGING
  description: >-
    iMCD is initiated by autoimmunity, with autoantibodies against connective
    tissue disease antigens and against cytokines themselves driving the
    hypercytokinemia. Supporting observations are an enrichment of
    CTD-associated and anti-cytokine IgG autoantibodies in iMCD sera relative to
    healthy controls, and the long-standing clinical overlap between iMCD and
    connective tissue disease. The autoantibodies detected are heterogeneous
    rather than a shared specificity, and no pathogenic mechanism has been
    demonstrated, so this remains one of several competing candidate etiologies.
  applies_to_subtypes:
  - iMCD-TAFRO
  - iMCD-IPL
  - iMCD-NOS
  evidence:
  - reference: PMID:40181993
    reference_title: "Common connective tissue disorder and anti-cytokine autoantibodies are enriched in idiopathic multicentric castleman disease patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgG autoantibodies binding autoantigens associated with common CTDs and cytokines are elevated in iMCD patients compared to HC, suggesting that autoimmunity may be involved in iMCD pathogenesis."
    explanation: >-
      The authors state the autoimmune hypothesis as a suggestion drawn from a
      case-control serology comparison, matching the EMERGING status recorded here.
  - reference: PMID:24622327
    reference_title: "HHV-8-negative, idiopathic multicentric Castleman disease: novel insights into biology, pathogenesis, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that 1 or more of the following 3 candidate processes may drive iMCD hypercytokinemia: systemic inflammatory disease mechanisms via autoantibodies or inflammatory gene mutations, paraneoplastic syndrome mechanisms via ectopic cytokine secretion, and/or a non-HHV-8 virus."
    explanation: >-
      Places the autoantibody mechanism as one of three explicitly competing
      candidate drivers, which is why this is recorded as EMERGING rather than canonical.
- hypothesis_group_id: clonal_stromal_origin
  hypothesis_label: Clonal Somatic Mutation as a Driver of iMCD
  status: EMERGING
  description: >-
    Recurrent somatic mutations - notably NCOA4 L261F in about 23% of iMCD, with
    chromatin-organization and methylation abnormalities clustering in this form
    - make iMCD at least partly a clonal process rather than a purely reactive
    one. The alleles are recurrent and enriched, but they are present in a
    minority of cases, the functional consequence of NCOA4 L261F in this disease
    has not been characterized, no functional model has shown that it initiates
    the lymph node lesion, and its cell of origin within the node is unresolved.
  applies_to_subtypes:
  - iMCD-TAFRO
  - iMCD-IPL
  - iMCD-NOS
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23% of idiopathic multicentric CD (iMCD) cases"
    explanation: >-
      Quantifies the recurrent somatic alleles this hypothesis rests on, and the
      minority frequencies that keep it from being canonical.
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we continue to lack a foundational understanding of the biological mechanisms driving this disease process."
    explanation: >-
      The same review states that the mechanistic significance of these genetic
      findings is not established, limiting the hypothesis to EMERGING status.
- hypothesis_group_id: il6_independent_mtor
  hypothesis_label: PI3K/AKT/mTOR Signaling in IL-6-Blockade-Refractory iMCD
  status: EMERGING
  description: >-
    In the substantial fraction of iMCD patients who do not respond to anti-IL-6
    therapy, the disease is driven by PI3K/AKT/mTOR signaling with CD8+ T cell
    activation and VEGF-A elevation rather than by IL-6 itself. The supporting
    evidence is a three-patient precision-medicine study in which mTOR pathway
    activity was elevated and sirolimus produced durable remissions; a
    prospective single-arm trial (NCT03933904) was designed to test it.
  applies_to_subtypes:
  - iMCD-TAFRO
  evidence:
  - reference: PMID:31408438
    reference_title: "Identifying and targeting pathogenic PI3K/AKT/mTOR signaling in IL-6-blockade-refractory idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of three IL-6-blockade refractory iMCD cases revealed increased CD8+ T cell activation, VEGF-A, and PI3K/Akt/mTOR pathway activity."
    explanation: Reports the pathway activation on which this hypothesis rests.
  - reference: PMID:31408438
    reference_title: "Identifying and targeting pathogenic PI3K/AKT/mTOR signaling in IL-6-blockade-refractory idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This precision medicine approach identifies PI3K/Akt/mTOR signaling as the first pharmacologically-targetable pathogenic process in IL-6-blockade refractory iMCD."
    explanation: >-
      The authors' own framing of the finding as a first identification in three
      patients rather than an established mechanism.
- hypothesis_group_id: subtype_specific_il6_source
  hypothesis_label: Subtype-Specific Cellular Source of IL-6
  status: EMERGING
  description: >-
    The cell producing IL-6 differs between iMCD subtypes, and this explains
    their divergent response to IL-6 blockade. In iMCD-IPL, plasma cells are the
    dominant IL-6 source under XBP1-driven endoplasmic reticulum stress and
    plasma cell differentiation, consistent with the good response of IPL to
    siltuximab or tocilizumab. In iMCD-TAFRO, IL-6 comes predominantly from
    vascular endothelial cells, which would make the elevated serum IL-6 a
    secondary consequence of the cytokine storm rather than its driver. Evidence
    is tissue expression profiling without functional perturbation.
  applies_to_subtypes:
  - iMCD-IPL
  - iMCD-TAFRO
  evidence:
  - reference: PMID:40931874
    reference_title: "Distinct interleukin-6 production in IPL and TAFRO subtypes of idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry and in situ hybridization revealed that plasma cells were the predominant IL-6-expressing cells in iMCD-IPL, whereas vascular endothelial cells expressed IL-6 in iMCD-TAFRO."
    explanation: The direct tissue observation of a subtype-specific IL-6 source.
  - reference: PMID:40931874
    reference_title: "Distinct interleukin-6 production in IPL and TAFRO subtypes of idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, IL-6 production in iMCD-TAFRO may be predominantly from vascular endothelial cells, suggesting that elevated serum IL-6 is a secondary phenomenon of the cytokine storm in this subtype."
    explanation: >-
      States the strong form of the hypothesis - that IL-6 is secondary in TAFRO -
      in the authors' own hedged terms.
has_subtypes:
- name: iMCD-TAFRO
  display_name: iMCD with Thrombocytopenia, Anasarca, Fever, Reticulin Fibrosis, Organomegaly
  description: >-
    Acute, severe clinical subtype of iMCD presenting as a rapid-onset cytokine
    storm with thrombocytopenia, anasarca, fever, renal dysfunction or bone
    marrow reticulin fibrosis, and organomegaly, often with small-volume
    lymphadenopathy. Serum immunoglobulins are normal or low, distinguishing it
    from iMCD-IPL. It carries the highest requirement for dialysis, mechanical
    ventilation, and transfusion, and most iMCD deaths occur in this subtype.
  subtype_term:
    preferred_term: Castleman-Kojima disease
    term:
      id: MONDO:0018702
      label: Castleman-Kojima disease
  evidence:
  - reference: PMID:29157612
    reference_title: TAFRO Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thrombocytopenia and severe anasarca accompanied by relatively low serum immunoglobulin levels are characteristic clinical findings of TAFRO syndrome that are not present in iMCD-not otherwise specified (iMCD-NOS)."
    explanation: >-
      Identifies the immunoglobulin-level contrast that separates TAFRO from the
      other iMCD subtypes.
  - reference: PMID:29157612
    reference_title: TAFRO Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAFRO syndrome follows a more aggressive course, compared with iMCD-NOS, and there is no standard treatment."
    explanation: Establishes the aggressive course and the absence of a standard regimen.
- name: iMCD-IPL
  display_name: iMCD with Idiopathic Plasmacytic Lymphadenopathy
  description: >-
    Indolent clinical subtype of iMCD characterized by polyclonal
    hypergammaglobulinemia, thrombocytosis, plasmacytic or mixed lymph node
    histopathology, and anemia of inflammation. Despite a higher measured
    inflammatory state than other iMCD-NOS patients, survival is longer, and
    IL-6-blocking and myeloma-like regimens outperform lymphoma-like regimens.
    It is the subtype most often confused with IgG4-related disease. Whether it
    should be formally split out of iMCD-NOS is still contested; it is recorded
    here as a subtype because the international expert review and the largest
    cohort both treat it as one.
  evidence:
  - reference: PMID:38356434
    reference_title: "Idiopathic multicentric Castleman disease (iMCD)-idiopathic plasmacytic lymphadenopathy: A distinct subtype of iMCD-not otherwise specified with different clinical features and better survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with iMCD-IPL showed a significantly higher inflammatory state but longer overall survival."
    explanation: >-
      The 228-patient cohort quantifies the paradoxical combination of higher
      inflammation with better survival that defines this subtype.
  - reference: PMID:38356434
    reference_title: "Idiopathic multicentric Castleman disease (iMCD)-idiopathic plasmacytic lymphadenopathy: A distinct subtype of iMCD-not otherwise specified with different clinical features and better survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This retrospective analysis of 228 patients with iMCD-NOS identified 103 (45.2%) patients with iMCD-IPL."
    explanation: Establishes that IPL accounts for roughly half of what is otherwise labeled iMCD-NOS.
- name: iMCD-NOS
  display_name: iMCD, Not Otherwise Specified
  description: >-
    iMCD that meets neither the TAFRO nor the IPL pattern. Clinically it often
    mimics indolent lymphoma or an autoimmune condition. In the ACCELERATE
    registry, NOS patients were hospitalized far less than TAFRO patients but
    spent a significantly greater proportion of their follow-up in active
    disease flare, so a milder acute presentation does not mean a lower
    long-term symptom burden.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Those who have iMCD not meeting criteria for TAFRO or IPL have iMCD‐NOS, which often mimics indolent lymphoma or autoimmune conditions."
    explanation: Defines iMCD-NOS as the residual category and names its usual clinical mimics.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "iMCD-NOS patients, however, spent a significantly greater proportion of time following disease onset in a state of disease flare (median 52.3% vs. 18.9%; P=0.004)."
    explanation: Quantifies the chronic flare burden of NOS relative to TAFRO.
pathophysiology:
- name: Unknown iMCD Initiating Process
  description: >-
    The event that starts idiopathic multicentric Castleman disease has not been
    identified. Three candidate processes have been proposed and none has been
    excluded: systemic inflammatory disease driven by autoantibodies or germline
    inflammatory gene variants; a paraneoplastic mechanism in which a clonal cell
    population ectopically secretes cytokine; and infection by a virus other than
    HHV-8. Viral-Track analysis of 22 UCD and 19 iMCD lymph nodes found no shared
    viral signature, which weighs against the third candidate without excluding a
    hit-and-run or non-transcribed agent. This node is deliberately kept in the
    graph as an explicit unknown so that everything downstream is not implicitly
    attributed to IL-6.
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24622327
    reference_title: "HHV-8-negative, idiopathic multicentric Castleman disease: novel insights into biology, pathogenesis, and therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that 1 or more of the following 3 candidate processes may drive iMCD hypercytokinemia: systemic inflammatory disease mechanisms via autoantibodies or inflammatory gene mutations, paraneoplastic syndrome mechanisms via ectopic cytokine secretion, and/or a non-HHV-8 virus."
    explanation: Enumerates the three candidate initiating processes named in this node.
  - reference: DOI:10.1038/s41598-025-85193-x
    reference_title: "No evidence for active viral infection in unicentric and idiopathic multicentric Castleman disease by Viral-Track analysis"
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "These results suggest that active viral infection is unlikely to be a pathological driver of UCD or iMCD."
    explanation: >-
      Argues against the non-HHV-8 virus candidate specifically, leaving the
      initiating process unresolved.

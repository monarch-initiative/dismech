  attaches_to:
  - pathophysiology#Endothelial Injury and Renal Thrombotic Microangiopathy
  - phenotypes#Acute Renal Failure
  rationale: >-
    Renal failure is the most common post-diagnosis morbidity in iMCD (48%) and
    27% of patients require dialysis, so the renal lesion drives a large share of
    the disease's burden. The histology - membranoproliferative-like injury and
    thrombotic microangiopathy - points at glomerular endothelium, and IL-6 and
    VEGF are the proposed mediators, but the review that summarizes this states
    plainly that their role in renal injury is not well understood. No therapy is
    directed at the renal lesion specifically.
  evidence:
  - reference: PMID:34208103
    reference_title: "TAFRO Syndrome with Renal Thrombotic Microangiopathy: Insights into the Molecular Mechanism and Treatment Opportunities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The role of these cytokines in renal injury, however, is not well understood."
    explanation: States the mechanistic gap directly.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following the iMCD diagnosis, 48% (n=49) of the cohort developed acute renal failure"
    explanation: Quantifies why this gap matters clinically.
  - reference: PMID:34208103
    reference_title: "TAFRO Syndrome with Renal Thrombotic Microangiopathy: Insights into the Molecular Mechanism and Treatment Opportunities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, it is suggested that there are factors other than IL-6 and VEGF, which dominate the glomerular injury."
    explanation: >-
      Narrows the gap: the review concludes the two cytokines usually invoked are
      not the dominant cause of the glomerular lesion, so the mediator is unidentified.
  proposed_experiments:
  - experiment_id: exp_tafro_renal_biopsy_mediator_mapping
    name: Spatial mediator mapping of TAFRO renal biopsies
    description: >-
      Apply the same spatial transcriptomic and in situ hybridization panel used
      on Castleman lymph nodes to banked TAFRO kidney biopsies, localizing IL6,
      VEGFA, complement components, and endothelial injury markers to glomerular
      compartments, and compare with thrombotic microangiopathy from other causes
      and with membranoproliferative glomerulonephritis controls.
    would_support:
    - pathophysiology#Endothelial Injury and Renal Thrombotic Microangiopathy
    supporting_outcome:
    - >-
        A specific mediator localizes to injured glomerular endothelium in TAFRO but not in the comparator lesions, nominating a renal-directed target.
    refuting_outcome:
    - >-
        The TAFRO renal lesion is indistinguishable from other causes of thrombotic microangiopathy, indicating a shared final common pathway rather than a Castleman-specific mediator.
- discussion_id: gap_imcd_diagnostic_biomarker
  prompt: >-
    Is there a serum or tissue marker that can establish a diagnosis of iMCD,
    rather than the current diagnosis by exclusion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#International consensus diagnostic criteria for iMCD
  - biochemical#C-X-C Motif Chemokine Ligand 13 (CXCL13)
  - biochemical#Interleukin-6 (IL-6)
  rationale: >-
    iMCD is diagnosed on non-specific clinical features plus characteristic but
    non-specific histopathology, after excluding infection, malignancy, and
    autoimmune disease - and Castleman-like nodal changes occur in all three of
    those. There is no known diagnostic serum biomarker, which the natural
    history study names as a contributor to underdiagnosis. CXCL13 is the closest
    candidate but was validated as a predictor of siltuximab response, not as a
    diagnostic discriminator, and the reported comparison groups included related
    diseases rather than the full mimic set a diagnostic test would face.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Underdiagnosis is likely as diagnostic criteria were not developed until 2017, and there is no known diagnostic serum biomarker."
    explanation: States the absence of a diagnostic biomarker and its consequence.
  proposed_experiments:
  - experiment_id: exp_imcd_diagnostic_biomarker_mimic_cohort
    name: Biomarker discovery against the full iMCD mimic set
    description: >-
      Compare serum proteomes of adjudicated iMCD against each mimic the
      diagnostic criteria require excluding - IgG4-related disease, HHV-8+ MCD,
      POEMS, lymphoma, SLE, and HLH - powered per comparator rather than pooling
      them as "related diseases", and evaluate candidate markers including CXCL13
      as a diagnostic classifier with prespecified sensitivity and specificity
      targets.
    would_support:
    - biochemical#C-X-C Motif Chemokine Ligand 13 (CXCL13)
    supporting_outcome:
    - >-
        A marker or panel separates iMCD from every individual mimic at clinically useful sensitivity and specificity.
    refuting_outcome:
    - >-
        Candidate markers separate iMCD from healthy controls but not from individual mimics, confirming that diagnosis by exclusion is unavoidable with serum markers alone.

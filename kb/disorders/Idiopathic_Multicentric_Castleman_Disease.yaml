- name: Autoantibody-Mediated Immune Dysregulation
  description: >-
    IgG autoantibodies against connective tissue disease autoantigens are found
    in 47% of iMCD patients versus 17% of healthy controls, and anti-cytokine
    autoantibodies in 38% versus 10%. One sample showed receptor-blocking
    activity against interferon-omega. The autoantibodies are heterogeneous
    rather than a single shared specificity, and no pathogenic mechanism linking
    them to lymph node pathology has been shown, so this node records an
    association-level candidate mechanism rather than an established step.

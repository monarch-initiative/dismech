progression:
- phase: Presentation and diagnostic delay
  notes: >-
    Diagnosis rests on non-specific clinical features plus characteristic lymph
    node histopathology, with no diagnostic serum biomarker and diagnostic
    criteria that did not exist before 2017, so underdiagnosis is expected.
    Patients are hospitalized a median of 5 days in the 6 months before the
    diagnostic biopsy. iMCD occurs at all ages; in the ACCELERATE cohort the
    youngest patient was diagnosed at 1.8 years and the oldest at 74.4, with a
    median of 35.3 years.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, we found iMCD in individuals of all ages, with the youngest patient in the cohort diagnosed at 1.8 years and the oldest at 74.4."
    explanation: Gives the age range at diagnosis quoted here.
- phase: Severe presentation at diagnosis
  notes: >-
    Most patients are already severely ill when diagnosed: 77% met the guideline
    definition of severe iMCD at diagnosis, rising to 93% of TAFRO patients and
    still 51% of NOS patients. Severity is bimodal by age, with patients under
    30 and over 60 more likely to present severely.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 100 patients with sufficient information to determine disease severity at diagnosis, 77 (77%) initially presented with severe disease."
    explanation: Quantifies severe presentation at diagnosis.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients <30 and patients >60 years old were more likely to have severe disease (94.6% and 90.0%, respectively) as compared to patients between 30 and 60 years old (62.2%)"
    explanation: Supports the bimodal age-severity pattern described here.
- phase: Acute multiorgan failure (TAFRO)
  subtype: iMCD-TAFRO
  notes: >-
    TAFRO patients spend a median of 36 days in hospital in the year surrounding
    diagnosis (versus 0 for NOS), and 27% require dialysis and 17% mechanical
    ventilation at some point. Most iMCD deaths occur here: of eight deaths in
    the ACCELERATE cohort, six were TAFRO patients and five of those died within
    two years of diagnosis.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we found life-sustaining interventions, such as mechanical ventilation (17%) and dialysis (27%), were required among iMCD patients, predominantly those with iMCD-TAFRO."
    explanation: Quantifies the life-sustaining interventions required in this phase.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the eight deceased patients in this cohort, six had TAFRO and five of these TAFRO patients died within 2 years of diagnosis."
    explanation: Establishes that mortality concentrates in the TAFRO subtype and early after diagnosis.
- phase: Chronic relapsing-remitting course
  subtype: iMCD-NOS
  notes: >-
    NOS patients are hospitalized much less than TAFRO patients but spend a
    median 52.3% of their post-onset follow-up in active flare, versus 18.9% for
    TAFRO. A milder acute presentation is therefore not a lower long-term
    symptom burden, just a differently distributed one.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "iMCD-NOS patients, however, spent a significantly greater proportion of time following disease onset in a state of disease flare (median 52.3% vs. 18.9%; P=0.004)."
    explanation: Quantifies the chronic flare burden that characterizes this phase.
- phase: Long-term survival
  notes: >-
    Across the whole disease, 2-, 5-, and 10-year overall survival in a
    113-patient two-centre series was 92%, 76%, and 59%. Survival separates
    sharply by category: 5-year survival was 91% for UCD, 90% for MCD with the
    osteosclerotic POEMS variant, 65% for MCD without POEMS, and 27% for MCD
    with POEMS but without osteosclerotic lesions.
  evidence:
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all patients, 2, 5, and 10-year OS was 92%, 76%, 59%, respectively."
    explanation: Gives the overall survival figures quoted here.
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(1) unicentric CD (91%); (2) multicentric CD associated with the osteosclerotic variant of POEMS syndrome (90%); (3); multicentric CD without POEMS syndrome (65%); and (4) multicentric CD with POEMS syndrome without osteosclerotic lesions (27%)."
    explanation: Gives the category-specific 5-year survival stratification.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden spans nearly the whole available range depending on subtype.
    iMCD-TAFRO is a life-threatening cytokine storm: 93% of
    patients present with severe disease, 27% require dialysis and 17%
    mechanical ventilation, median hospitalization in the year around diagnosis
    is 36 days, and most deaths occur within two years. iMCD-NOS sits between
    them, with less acute intensity but a majority of follow-up time spent in
    active flare and quality of life inversely tracking symptom score years
    after diagnosis. Access to effective therapy is itself part of the burden:
    only 8.7% of US iMCD patients in a claims analysis received siltuximab, the
    only approved and guideline-recommended first-line drug, while 33% received
    no iMCD-directed treatment at all.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we found life-sustaining interventions, such as mechanical ventilation (17%) and dialysis (27%), were required among iMCD patients, predominantly those with iMCD-TAFRO."
    explanation: Supports the organ-support burden at the severe end of the range.
  - reference: DOI:10.3324/haematol.2023.283603
    reference_title: "Longitudinal, natural history study reveals the disease burden of idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "QOL scores were inversely correlated with MCD symptom score (R=-0.69; P<0.001)"
    explanation: >-
      Supports the persistent quality-of-life impact measured a median 3.9 years
      after diagnosis.
  - reference: DOI:10.1182/bloodadvances.2021004441
    reference_title: "Epidemiology and treatment patterns of idiopathic multicentric Castleman disease in the era of IL-6–directed therapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Siltuximab, which is the only US Food and Drug Administration–approved treatment and established first-line treatment recommendation, was used in only 8.7% of patients with iMCD."
    explanation: Supports the treatment-access component of the burden described above.
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(1) unicentric CD (91%); (2) multicentric CD associated with the osteosclerotic variant of POEMS syndrome (90%); (3); multicentric CD without POEMS syndrome (65%); and (4) multicentric CD with POEMS syndrome without osteosclerotic lesions (27%)."
    explanation: Supports the survival spread across categories that motivates the VARIABLE assignment.
diagnosis:
- name: Excisional lymph node biopsy
  description: >-
    Diagnosis requires characteristic lymph node histopathology; there is no
    diagnostic serum biomarker. Excisional biopsy is preferred over core or fine
    needle sampling because architectural features - regressed or hyperplastic
    germinal centers, mantle-zone onion-skinning, penetrating vessels,
    interfollicular plasmacytosis - cannot be assessed on a fragment. Histology
    alone is not sufficient: reactive Castleman-like changes occur in
    autoimmune disease, lymphoma, and infection, so the findings must be
    combined with clinical and laboratory data.
  diagnosis_term:
    preferred_term: lymph node biopsy
    term:
      id: NCIT:C51900
      label: Lymph Node Biopsy
  results: >-
    Angiofollicular lymph node hyperplasia of hyaline-vascular, plasma-cell, or
    mixed type.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: States directly why histology alone cannot establish the diagnosis.
- name: International consensus diagnostic criteria for iMCD
  description: >-
    The CDCN evidence-based criteria, derived from 244 clinical cases and 88
    tissue samples, require multicentric lymphadenopathy with the defined
    histopathology, at least two of eleven clinical or laboratory minor criteria,
    and exclusion of the infectious, malignant, and autoimmune conditions that
    mimic iMCD - in particular HHV-8-associated MCD, POEMS syndrome, lymphoma,
    and IgG4-related disease.
  results: >-
    Diagnosis of iMCD when both major criteria, at least two minor criteria, and
    all exclusions are satisfied.
  evidence:
  - reference: DOI:10.1182/blood-2016-10-746933
    reference_title: "International, evidence-based consensus diagnostic criteria for HHV-8–negative/idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The criteria require multicentric lymphadenopathy with defined histopathology, ≥2 clinical/laboratory changes, and exclusion of iMCD mimics."
    explanation: States the three-part structure of the criteria described here.
  - reference: DOI:10.1182/blood-2016-10-746933
    reference_title: "International, evidence-based consensus diagnostic criteria for HHV-8–negative/idiopathic multicentric Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An international panel established the first ever diagnostic criteria for iMCD based on review of 244 clinical cases and 88 tissue samples."
    explanation: Establishes the evidence base behind the criteria.
- name: Bone marrow biopsy
  description: >-
    Performed in suspected iMCD-TAFRO to document reticulin fibrosis with
    megakaryocytic hyperplasia and to exclude a primary marrow disorder as the
    cause of the cytopenias. TAFRO also has its own Japanese diagnostic criteria
    (Iwaki, and the Masaki 2019 update), separate from the CDCN iMCD criteria, in
    which thrombocytopenia is a major criterion; the two criteria sets are not
    identical and a case can satisfy one without the other.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  results: Reticulin fibrosis, often with megakaryocytic hyperplasia.
  evidence:
  - reference: PMID:34208103
    reference_title: "TAFRO Syndrome with Renal Thrombotic Microangiopathy: Insights into the Molecular Mechanism and Treatment Opportunities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of thrombocytopenia fulfills one of the major diagnostic criteria"
    explanation: >-
      In the source sentence this refers to the Iwaki and Masaki TAFRO
      definitions, establishing that TAFRO has its own diagnostic criteria in
      which thrombocytopenia is a major criterion. The numeric citation markers
      in the original sentence are omitted from the quote because the reference
      validator strips bracketed spans before matching.
  - reference: PMID:29157612
    reference_title: TAFRO Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymph node biopsy is recommended to exclude other diseases and to diagnose TAFRO syndrome, which reveals characteristic histopathological findings similar to hyaline vascular-type CD."
    explanation: >-
      Supports the exclusion-focused role of tissue sampling in TAFRO. Note the
      quote refers to lymph node biopsy; the marrow finding is the "R" of the
      TAFRO acronym.
- name: Cross-sectional and FDG-PET imaging
  description: >-
    CT of the neck, chest, abdomen, and pelvis, or FDG-PET/CT, establishes
    whether disease is unicentric or multicentric - the single most consequential
    branch point in management, since unicentric disease is surgically curable.
    Imaging also selects the biopsy target and, in UCD, determines resectability.
  diagnosis_term:
    preferred_term: positron emission tomography
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: >-
    A single involved nodal region indicates UCD; multiple involved regions
    indicate MCD.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unicentric CD (UCD) involves one enlarged lymph node region, whereas multicentric CD (MCD) involves multiple enlarged lymph node regions."
    explanation: The distinction that imaging is performed to establish.
- name: Serum IgG4 to IgG ratio
  description: >-
    Used to separate iMCD-IPL from IgG4-related disease when the lymph node
    contains numerous IgG4-positive plasma cells. Absolute serum IgG4 does not
    discriminate; the IgG4/IgG ratio does, with a reported cut-off of 19.0%.
  results: >-
    A serum IgG4/IgG ratio above roughly 19% favors IgG4-related disease over
    iMCD-IPL.
  evidence:
  - reference: PMID:38378248
    reference_title: "Diagnostic challenges of the idiopathic plasmacytic lymphadenopathy (IPL) subtype of idiopathic multicentric Castleman disease (iMCD): Factors to differentiate from IgG4-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the serum IgG4/IgG ratio was significantly higher in IgG4-RD, with a cut-off value of 19.0%."
    explanation: Gives the discriminating test and threshold.
differential_diagnoses:
- name: IgG4-related disease
  description: >-
    The closest mimic of iMCD-IPL. Both present with lymphadenopathy, polyclonal
    hypergammaglobulinemia, and IgG4-positive plasma cell infiltrates, and a
    third of iMCD-IPL lymph nodes meet the histological criteria for IgG4-RD.
    Serum IgG4 alone does not separate them; the serum IgG4/IgG ratio (cut-off
    19.0%) does. IgG4-RD additionally shows storiform fibrosis and characteristic
    extranodal organ involvement (pancreas, salivary and lacrimal glands).
  disease_term:
    preferred_term: IgG4-related disease
    term:
      id: MONDO:0017287
      label: immunoglobulin G4-related sclerosing disease
  evidence:
  - reference: PMID:38378248
    reference_title: "Diagnostic challenges of the idiopathic plasmacytic lymphadenopathy (IPL) subtype of idiopathic multicentric Castleman disease (iMCD): Factors to differentiate from IgG4-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the three, iMCD-IPL closely mimics IgG4-related disease (IgG4-RD)."
    explanation: Names IgG4-RD as the principal mimic of this iMCD subtype.
  - reference: PMID:38378248
    reference_title: "Diagnostic challenges of the idiopathic plasmacytic lymphadenopathy (IPL) subtype of idiopathic multicentric Castleman disease (iMCD): Factors to differentiate from IgG4-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combination of clinical presentations, laboratory values including the serum IgG4/IgG ratios and histological analysis is crucial for diagnosis of IgG4-RD and iMCD-IPL."
    explanation: States the combined approach needed to separate the two.
- name: HHV-8-associated multicentric Castleman disease
  description: >-
    Not a different disease from Castleman disease but the branch point within
    it, and the exclusion that defines iMCD. Distinguished by HHV-8 LANA-1
    immunohistochemistry on the node, usually with HIV co-infection, higher rates
    of constitutional symptoms and splenomegaly, and a different first-line
    therapy (rituximab rather than siltuximab).
  distinguishing_features:
  - >-
      HHV-8 LANA-1-positive plasmablasts on lymph node immunohistochemistry; detectable plasma KSHV viral load; usual HIV co-infection.
  evidence:
  - reference: DOI:10.1182/bloodadvances.2024013548
    reference_title: "The clinical picture of Castleman disease: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with HHV8+ MCD had significantly higher rates of constitutional symptoms (46.6% vs 98.6%; P = .038) and splenomegaly (48.2% vs 89.2%; P = .031)"
    explanation: Quantifies the clinical features that differ between the two subtypes.
- name: POEMS syndrome
  description: >-
    A clonal plasma cell disorder that can present with Castleman-like
    lymphadenopathy. Distinguished by peripheral neuropathy, a monoclonal
    (usually lambda-restricted) paraprotein, osteosclerotic bone lesions, and
    endocrinopathy - none of which belong to iMCD, where the immunoglobulin
    elevation is polyclonal. The distinction changes prognosis sharply: MCD with
    non-osteosclerotic POEMS had 27% 5-year survival versus 65% for MCD without
    POEMS.
  distinguishing_features:
  - >-
      Monoclonal plasma cell disorder, peripheral polyneuropathy, osteosclerotic lesions, endocrinopathy.
  evidence:
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the patients with multicentric CD, 32% had criteria sufficient for a diagnosis of POEMS syndrome."
    explanation: >-
      Establishes how often the POEMS distinction actually has to be made in an
      MCD population.
- name: Lymphoma
  description: >-
    Hodgkin and non-Hodgkin lymphoma both produce lymphadenopathy with systemic
    symptoms and can generate reactive Castleman-like nodal changes; iMCD-NOS in
    particular mimics indolent lymphoma. Lymphoma is a formal exclusion in the
    iMCD diagnostic criteria. The relationship also runs the other way in
    HHV-8+ MCD, where concurrent KSHV-driven lymphoma occurs at 28 cases per
    1,000 patient-years.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: Names lymphoma among the conditions producing Castleman-like reactive nodes.
- name: Hemophagocytic lymphohistiocytosis
  disease_term:
    preferred_term: hemophagocytic lymphohistiocytosis
    term:
      id: MONDO:0015540
      label: hemophagocytic syndrome
  description: >-
    iMCD-TAFRO presents as an acute cytokine storm with fever, cytopenias,
    organomegaly, and multiorgan failure that is clinically close to HLH or to
    sepsis. Both require urgent treatment and the therapies differ, so the
    distinction is made on ferritin, soluble IL-2 receptor, hemophagocytosis on
    marrow, HLH genetic and trigger workup, and above all the lymph node
    histopathology.
  distinguishing_features:
  - >-
      Lymph node biopsy showing Castleman histopathology; absence of the ferritin and hemophagocytosis profile typical of HLH.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid onset cytokine storm with severe inflammation, anasarca, thrombocytopenia, and small volume lymphadenopathy, similar to hemophagocytic lymphohistiocytosis or sepsis, are the hallmarks of iMCD‐TAFRO."
    explanation: Names HLH and sepsis as the clinical mimics of iMCD-TAFRO.
- name: Systemic lupus erythematosus and other connective tissue diseases
  description: >-
    Autoimmune disease produces lymphadenopathy with Castleman-like reactive
    nodal changes and is a formal exclusion for iMCD. The overlap is not only
    diagnostic: 47% of iMCD patients carry at least one CTD-associated
    autoantibody versus 17% of healthy controls, which is part of why an
    autoimmune etiology for iMCD remains under active consideration.
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  evidence:
  - reference: PMID:40181993
    reference_title: "Common connective tissue disorder and anti-cytokine autoantibodies are enriched in idiopathic multicentric castleman disease patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, connective tissue disorders (CTDs) and iMCD share many clinical features, and autoantibodies have been anecdotally reported in individual iMCD patients."
    explanation: States the clinical and serologic overlap that makes this differential difficult.
genetic:
- name: NCOA4
  gene_term:
    preferred_term: NCOA4
    term:
      id: hgnc:7671
      label: NCOA4
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: Somatic mutation in lesional tissue
  frequency: L261F in about 23% of idiopathic multicentric CD.
  notes: >-
    The most frequently reported recurrent somatic allele in iMCD. Its functional
    consequence in this disease has not been characterized and no mechanism links
    it to the lymph node lesion, so it is recorded as a recurrence observation.
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23% of idiopathic multicentric CD (iMCD) cases"
    explanation: Gives the recurrence frequency of NCOA4 L261F in iMCD.
treatments:
- name: Siltuximab
  description: >-
    Anti-IL-6 monoclonal antibody. FDA-approved first-line therapy across
    all iMCD subtypes (TAFRO, IPL, NOS). Directly binds and neutralizes
    human IL-6. Durable tumor and symptomatic response occurred in 34% of
    treated patients in the registration trial, and progression-free survival was
    significantly prolonged. It is also recommended for unresectable UCD with an
    inflammatory syndrome. Despite this it reached only 8.7% of US iMCD patients
    in a claims analysis.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: IL-6 Overproduction
    treatment_effect: INHIBITS
    description: Neutralizes circulating human IL-6 before it engages gp130.
    evidence:
    - reference: PMID:25042199
      reference_title: "Siltuximab for multicentric Castleman's disease: a randomised, double-blind, placebo-controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

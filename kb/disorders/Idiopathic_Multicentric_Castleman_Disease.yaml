histopathology:
- name: Angiofollicular Lymph Node Hyperplasia, Plasma-Cell Variant
  description: >-
    Plasma-cell histologic variant predominates in MCD. Features
    hyperplastic germinal centers, sheets of mature plasma cells in the
    interfollicular zone, and increased interfollicular vascularity.
    Mantle-zone onion-skinning is less prominent than in the
    hyaline-vascular variant. This is the pattern associated with iMCD-IPL and
    with polyclonal hypergammaglobulinemia.
  context: MCD
  subtype: iMCD-IPL
- name: Mixed Histopathologic Variant
  description: >-
    Nodes carrying features of both the hyaline-vascular and plasma-cell
    patterns. In the ACCELERATE registry the histopathologic distribution across
    102 adjudicated iMCD cases was hypervascular/hyaline vascular 61.8%, mixed
    26.5%, and plasmacytic 6.9%; TAFRO cases were predominantly
    hypervascular and none were plasmacytic. The clinical significance of the
    histopathologic subtype is not established.
  context: MCD
  evidence:
  - reference: PMID:36433996
    reference_title: CXCL13 is a predictive biomarker in idiopathic multicentric Castleman disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are also classified according to histopathologic subtype, including hyaline vascular/hypervascular, plasmacytic, or mixed, though the clinical implications of defining histopathologic subtype is unclear."
    explanation: >-
      States both the three-way histopathologic classification and that its
      clinical meaning is unresolved.
- name: IgG4-Positive Plasma Cell Infiltrate
  description: >-
    Lymph nodes in iMCD-IPL can contain enough IgG4-positive plasma cells to
    satisfy the histological diagnostic criteria for IgG4-related disease: in one
    series 13 of 39 iMCD-IPL cases (33.3%) did so, and serum IgG4 levels did not
    separate the two conditions. The serum IgG4/IgG ratio, with a cut-off of
    19.0%, is the discriminator that did.
  context: iMCD-IPL
  subtype: iMCD-IPL
  evidence:
  - reference: PMID:38378248
    reference_title: "Diagnostic challenges of the idiopathic plasmacytic lymphadenopathy (IPL) subtype of idiopathic multicentric Castleman disease (iMCD): Factors to differentiate from IgG4-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the cases considered to be iMCD-IPL, 33.3% (13/39) cases also met the histological diagnostic criteria for IgG4-RD and serum IgG4 levels were not different between the two groups."
    explanation: Quantifies the histological overlap and the failure of serum IgG4 to discriminate.
  - reference: PMID:38378248
    reference_title: "Diagnostic challenges of the idiopathic plasmacytic lymphadenopathy (IPL) subtype of idiopathic multicentric Castleman disease (iMCD): Factors to differentiate from IgG4-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the serum IgG4/IgG ratio was significantly higher in IgG4-RD, with a cut-off value of 19.0%."
    explanation: Gives the discriminating ratio and its cut-off.
- name: Expanded CD21-Positive Follicular Dendritic Cell Meshwork
  description: >-
    CD21 immunostaining shows follicular dendritic cell meshworks of greater
    area, intensity, and structural complexity (image entropy) in both UCD and
    MCD than in reactive lymph nodes, and UCD follicles show reduced cellular
    diversity consistent with FDC predominance. This is an immunohistochemical
    correlate of the stromal-activation model rather than a routine diagnostic
    criterion.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD shows increased stromal cells that form unique microenvironments."
    explanation: >-
      Records the increased stromal content quantified by CD21 meshwork imaging
      in this study.
- name: Bone Marrow Reticulin Fibrosis with Megakaryocytic Hyperplasia
  description: >-
    Bone marrow biopsy in iMCD-TAFRO shows increased reticulin fibrosis, often
    with megakaryocytic hyperplasia despite peripheral thrombocytopenia. Marrow
    examination is part of the TAFRO workup and helps exclude a primary
    myeloproliferative or myelodysplastic cause of the cytopenias.
  context: iMCD-TAFRO
  subtype: iMCD-TAFRO
  evidence:
  - reference: PMID:29157612
    reference_title: TAFRO Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAFRO syndrome is a newly recognized variant of idiopathic multicentric Castleman disease (iMCD) that involves a constellation of syndromes: thrombocytopenia (T), anasarca (A), fever (F), reticulin fibrosis (R), and organomegaly (O)."
    explanation: Names reticulin fibrosis on marrow biopsy as a defining TAFRO feature.
imaging_findings:
- name: FDG-Avid Multicentric Lymphadenopathy
  modality: PET
  description: >-
    FDG-PET/CT demonstrates avid lymphadenopathy in multiple nodal stations in
    MCD and is used both to establish multicentricity and to select the node to
    biopsy. Uptake is typically moderate, and marked focal uptake in a single
    node raises concern for lymphomatous transformation rather than Castleman
    disease itself.
  diagnostic: true
- name: Serosal Effusions and Organomegaly
  modality: CT
  description: >-
    Cross-sectional imaging in iMCD-TAFRO shows pleural effusions, ascites,
    generalized subcutaneous edema, and hepatosplenomegaly, often with only
    modest lymph node enlargement. The imaging pattern of severe third-spacing
    with small nodes is a recognizable TAFRO signature.
  subtype: iMCD-TAFRO
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid onset cytokine storm with severe inflammation, anasarca, thrombocytopenia, and small volume lymphadenopathy, similar to hemophagocytic lymphohistiocytosis or sepsis, are the hallmarks of iMCD‐TAFRO."
    explanation: >-
      Establishes the combination of anasarca with small-volume lymphadenopathy
      that this imaging pattern reflects.
biochemical:
- name: Interleukin-6 (IL-6)
  presence: Elevated
  context: >-
    Markedly elevated in MCD (both HHV-8+ and iMCD); typically normal in
    UCD. IL-6 levels correlate with disease activity. The producing cell differs
    by iMCD subtype - plasma cells in IPL, vascular endothelium in TAFRO - and in
    TAFRO the serum elevation may be a downstream consequence of the cytokine
    storm rather than its driver. There is no validated diagnostic serum
    biomarker for iMCD, and serum IL-6 is not one.
  evidence:
  - reference: PMID:40931874
    reference_title: "Distinct interleukin-6 production in IPL and TAFRO subtypes of idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, IL-6 production in iMCD-TAFRO may be predominantly from vascular endothelial cells, suggesting that elevated serum IL-6 is a secondary phenomenon of the cytokine storm in this subtype."
    explanation: Supports the caveat that serum IL-6 may be secondary in the TAFRO subtype.
- name: C-Reactive Protein (CRP)
  presence: Elevated
  context: >-
    Acute-phase reactant driven by IL-6 signaling. Elevated in MCD; useful
    biomarker for disease activity and prognosis, and a component of the
    fever/elevated-CRP criterion in the CDCN TAFRO formulation.
- name: C-X-C Motif Chemokine Ligand 13 (CXCL13)
  presence: Elevated
  context: >-
    Of 1,178 serum proteins compared across 88 iMCD patients, 60 disease
    controls, and 42 healthy participants, CXCL13 was the most prominently
    up-regulated protein in iMCD. A 17% fall by day 8 of siltuximab predicts
    later response, making CXCL13 the best-supported pharmacodynamic marker in
    the disease. It has not been established as a diagnostic marker.
  evidence:
  - reference: PMID:36433996
    reference_title: CXCL13 is a predictive biomarker in idiopathic multicentric Castleman disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C-X-C Motif Chemokine Ligand-13 (CXCL13) is identified and validated as the protein most prominently up-regulated in iMCD."
    explanation: Establishes CXCL13 as the top differentially elevated serum protein in iMCD.
  - reference: PMID:36433996
    reference_title: CXCL13 is a predictive biomarker in idiopathic multicentric Castleman disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early and significant decrease in CXCL13 levels clearly distinguishes siltuximab responders from non-responders; a 17% reduction by day 8 following siltuximab therapy initiation is predictive of response at later time points."
    explanation: Supports the predictive-response use described here.
- name: Vascular Endothelial Growth Factor A (VEGF-A)
  presence: Elevated
  context: >-
    Elevated in MCD and central to the POEMS phenotype. In IL-6-blockade
    refractory iMCD-TAFRO, VEGF-A was elevated alongside PI3K/AKT/mTOR pathway
    activity and fell on sirolimus, alongside clinical response. Lymph node
    stromal cells (perivascular and T-zone reticular cells, and follicular
    dendritic cells) are the tissue source.
  evidence:
  - reference: PMID:31408438
    reference_title: "Identifying and targeting pathogenic PI3K/AKT/mTOR signaling in IL-6-blockade-refractory idiopathic multicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Administration of sirolimus significantly attenuated CD8+ T cell activation and decreased VEGF-A levels."
    explanation: Supports both the elevation of VEGF-A and its pharmacological reversibility.
- name: Serum Albumin
  presence: Decreased
  context: >-
    Hypoalbuminemia is a minor criterion for iMCD and one of the laboratory
    abnormalities tracked for treatment response. Median albumin at iMCD
    diagnosis in the ACCELERATE registry was 2.2 g/dL.
  evidence:
  - reference: DOI:10.3324/haematol.2023.283603

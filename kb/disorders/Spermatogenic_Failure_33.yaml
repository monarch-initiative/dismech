genetic:
- name: CFAP251
  association: Causal
  gene_term:
    preferred_term: CFAP251
    term:
      id: hgnc:28506
      label: CFAP251
  notes: >-
    Reported alleles include frameshift (p.Asp42Metfs*4, p.Leu530Valfs*4),
    nonsense (p.Glu111*), splice-site (c.1192-3C>G, c.1535+1G>C,
    c.1269+2T>C) variants and a homozygous deletion of exons 20-21 mediated by
    an SVA retrotransposon insertion. The deletion is a North African founder
    allele found in 7 of 46 Tunisian MMAF patients. ClinGen has not classified
    this gene-disease pair.
  evidence:
  - reference: PMID:30122541
    reference_title: "Loss of Calmodulin- and Radial-Spoke-Associated Complex Protein CFAP251 Leads to Immotile Spermatozoa Lacking Mitochondria and Infertility in Men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the two brothers were homozygous for the frameshift chr12: g.122359334delA (p.Asp42Metfs∗4), and the third individual was compound heterozygous for chr12: g.122359542G>T (p.Glu111∗) and chr12: g.122395032_122395033delCT (p.Leu530Valfs∗4)"
    explanation: First report of biallelic loss-of-function variants.
  - reference: PMID:30122540
    reference_title: "A Homozygous Ancestral SVA-Insertion-Mediated Deletion in WDR66 Induces Multiple Morphological Abnormalities of the Sperm Flagellum and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion was found in 7 of the 46 Tunisian MMAF subjects analyzed here, indicating that in this population, the WDR66 deletion is responsible for 15% of cases."
    explanation: Founder deletion explaining a large share of Tunisian MMAF.
  - reference: PMID:30310178
    reference_title: "Biallelic mutations of CFAP251 cause sperm flagellar defects and human male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these CFAP251 mutations are loss-of-function."
    explanation: Independent Han Chinese cohort.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, we identified two novel homozygous splicing mutations in CFAP251 that cause the loss of CFAP251 protein in patients with MMAF."
    explanation: Further homozygous splice alleles with protein loss.
animal_models:
- name: Cfap251 knockout mouse
  species: Mouse
  genotype: Cfap251-/- (knockout, C57BL/6J), homozygous
  publication: PMID:41943837
  description: >-
    Knockout males are infertile with fully immotile MMAF sperm, central pair
    and radial spoke loss, a disorganized mitochondrial sheath and a marked
    fall in epididymal sperm count. Tracheal cilia keep normal length and
    density but often lack inner dynein arms.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout reproduces the central pair and radial spoke loss and the mitochondrial sheath defect.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse knockout males have a striking reduction in epididymal sperm
        count and smaller testes, whereas most men with CFAP251 variants have
        normal sperm concentration, so mouse spermatogenesis is more sensitive
        to loss of the protein than human.
    evidence:
    - reference: PMID:41943837
      reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, sperm from Cfap251-/- mice exhibited severe abnormalities in all analyzed sections, characterized by CP and RS loss (Figure 4F)."
      explanation: Same ultrastructural lesion as in patients.
    - reference: PMID:41943837
      reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "H&E staining of epididymal sections also showed a striking reduction in the sperm count of Cfap251-/- mice (Figure 2I)."
      explanation: Records the low sperm count behind the species divergence.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout sperm are fully immotile with MMAF.
    evidence:
    - reference: PMID:41943837
      reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The cauda epididymal spermatozoa of Cfap251-/- males were 100% immotile compared with those of Cfap251+/+ (Figure 2J and K)."
      explanation: Immotile sperm in knockout males.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. Clinical pregnancies and live births
    have been reported with ejaculated sperm, including in men with no motile
    sperm when viable sperm were selected with the hypo-osmotic swelling test.
    No fertilization failure has been reported for CFAP251, but the number of
    treated couples is small.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:41943837
      reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also demonstrated that ICSI could overcome infertility in the affected probands, as evidenced by the successful delivery of healthy offspring."
      explanation: ICSI overcomes the flagellar defect.
  evidence:
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four couples (F1 IV-1, F2 II-1, M1 IV-1, and M4 II-1) achieved clinical pregnancy after ICSI treatment and subsequently delivered healthy infants."
    explanation: Live births in four couples.
  - reference: PMID:35087568
    reference_title: "Successful Results of Intracytoplasmic Sperm Injection of a Chinese Patient With Multiple Morphological Abnormalities of Sperm Flagella Caused by a Novel Splicing Mutation in CFAP251."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study was the first ICSI outcome report of a patient with the CFAP251 variant, and the results showed that successful clinical pregnancy could be achieved when the patient harboring the CFAP251 mutation was treated with ICSI."
    explanation: Clinical pregnancy after ICSI.
  - reference: PMID:42871648
    reference_title: "Hypo-osmotic swelling test guided sperm selection followed by intracytoplasmic sperm injection in two men with multiple morphological abnormalities of the sperm flagella associated with SPEF2 and CFAP251 variants: two case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both cases of MMAF patients with SPEF2 and CFAP251 gene mutations reported in this study successfully achieved pregnancy and delivered healthy offspring through HOST combined with ICSI."
    explanation: Live birth when viable immotile sperm were selected by the hypo-osmotic swelling test.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP251 alleles are known. Uniparental disomy
    has been documented, in which only one parent is a carrier, and sons
    conceived by ICSI inherit one CFAP251 variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35087568
    reference_title: "Successful Results of Intracytoplasmic Sperm Injection of a Chinese Patient With Multiple Morphological Abnormalities of Sperm Flagella Caused by a Novel Splicing Mutation in CFAP251."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rare inheritance mode, maternal uniparental disomy, was first reported in MMAF patients, which indicated to us that even if only one parent was a heterozygous variant carrier, the offspring would still suffer a probable risk of MMAF."
    explanation: Uniparental disomy changes the recurrence risk used in counselling.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings highlight the underlying risk of male infertility and PCD-like ciliary defects associated with CFAP251 and provide a valuable reference for personalized genetic counselling and clinical treatment of affected individuals."
    explanation: The authors name genetic counselling as an application of the molecular diagnosis.

      evidence_source: MODEL_ORGANISM
      snippet: "Specifically, FAP251-null cilia lack an arch-like density at the RS3 base, whereas FAP61-null cilia lack an adjacent portion of the RS3 stem region."
      explanation: >-
        Cryo-electron tomography of Tetrahymena cilia locates the orthologue

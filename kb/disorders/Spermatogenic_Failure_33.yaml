name: Spermatogenic Failure 33
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF33
- spermatogenic failure 33
- CFAP251-related multiple morphological abnormalities of the sperm flagella
- WDR66-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 33 (SPGF33) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP251 (formerly WDR66).
  CFAP251 is a WD-repeat subunit of the calmodulin- and spoke-associated complex
  (CSC), which with CFAP61 and CFAP91 builds the base of radial spoke 3 (RS3) on
  the peripheral microtubule doublets of the axoneme. In the absence of
  CFAP251 the CSC and RS3 fail to assemble in sperm, the developing flagellum is
  disorganized, and men present with asthenoteratozoospermia with multiple
  morphological abnormalities of the sperm flagella (MMAF): absent, short,
  coiled, bent and irregular-caliber flagella with low or absent motility.
  Electron microscopy shows loss of the central pair and radial spokes,
  disorganized doublets, outer dense fibers and fibrous sheath, and a defective
  mitochondrial sheath.

  A recurrent C-terminal deletion of exons 20-21 is a founder allele in North
  Africa and explains about 15% of MMAF in Tunisian men. Most patients have no
  respiratory symptoms, but one 2026 report described a cough and chest CT
  changes in one patient and inner dynein arm loss in tracheal cilia of
  knockout mice. Intracytoplasmic sperm injection (ICSI) has produced
  pregnancies and live births.

notes: >-
  MONDO cross-references the phenotype as OMIM 618152. ClinGen has not
  classified CFAP251 for spermatogenic failure 33: no CFAP251 row is present in
  the ClinGen gene-disease validity export dated 2026-10-14
  (data/clingen/gene_validity.csv), so gene_disease_validity is left absent.
  The CFAP251 report in PMID:42871648 is a compound heterozygote whose phase
  could not be confirmed because parental samples were unavailable. A 2023
  study of CFAP61 knockdown in Leydig cells is not used here because it does
  not concern CFAP251. The Trypanosoma and Tetrahymena orthologue studies are
  cited as evidence for the conserved position of CFAP251 in the radial spoke 3
  base; neither organism has sperm. No GeneReviews chapter covers this disease
  (Bookshelf index snapshot 2026-09-10).
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP251 variants: homozygous variants in
    consanguineous and founder-allele families, and compound heterozygous
    variants. One proband with a homozygous splice variant inherited both copies
    from his mother through maternal uniparental disomy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30122541
    reference_title: "Loss of Calmodulin- and Radial-Spoke-Associated Complex Protein CFAP251 Leads to Immotile Spermatozoa Lacking Mitochondria and Infertility in Men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three men, we found bi-allelic loss-of-function mutations in WDR66, encoding cilia- and flagella-associated protein 251 (CFAP251)"
    explanation: Biallelic loss-of-function variants in affected men.
  - reference: PMID:35087568
    reference_title: "Successful Results of Intracytoplasmic Sperm Injection of a Chinese Patient With Multiple Morphological Abnormalities of Sperm Flagella Caused by a Novel Splicing Mutation in CFAP251."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the patient's mother was a heterozygous carrier for the mutation, but his father was not, and finally, the inheritance pattern was proven to be maternal uniparental disomy."
    explanation: Homozygosity arising through maternal uniparental disomy, a recessive mechanism with a different recurrence risk.
pathophysiology:
- name: Loss of CFAP251
  description: >-
    Frameshift, nonsense, splice-site and large C-terminal deletion alleles
    abolish or sharply reduce CFAP251 in sperm. CFAP251 is normally present
    along the whole flagellum, with a sperm-specific isoform produced during
    maturation. It is a structural WD-repeat scaffold of the calmodulin- and
    spoke-associated complex at the base of radial spoke 3.

- name: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
  description: >-
    The CSC (CFAP61, CFAP91 and CFAP251 with calmodulin) sits at the base of
    radial spoke 3 and links it to the doublet microtubules. Loss of any one
    subunit destabilizes the others: CFAP251 is lost from sperm of men with
    CFAP61 variants and from Cfap91 knockout sperm, and in Cfap251 knockout
    mice the radial spoke proteins RSPH1 and RSPH3 are reduced along the
    flagellum. Radial spoke 3 therefore fails to assemble.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Radial spoke 3
    term:
      id: GO:0120335
      label: radial spoke 3
  biological_processes:

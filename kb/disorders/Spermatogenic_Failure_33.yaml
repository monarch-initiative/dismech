mechanistic_hypotheses:
- hypothesis_group_id: cfap251_sperm_restricted
  hypothesis_label: CFAP251 loss causes isolated male infertility rather than primary ciliary dyskinesia
  status: CANONICAL
  description: >-
    CFAP251 is expressed in both testis and airway, but almost all reported
    patients have isolated infertility, and a health questionnaire for PCD
    manifestations was negative in the founder-deletion cohort. In 2026 one
    patient with a homozygous splice variant was reported with tinnitus, a
    seasonal cough and chest CT changes (increased lung markings and a
    pulmonary bulla), and Cfap251 knockout mice had frequent loss of inner
    dynein arms in tracheal cilia. The human evidence for a respiratory
    phenotype is a single patient without ciliary biopsy, beat analysis or
    nasal nitric oxide, so the PCD-like phenotype is unconfirmed, and it is not
    recorded as a disease phenotype here.
  evidence:
  - reference: PMID:30122540
    reference_title: "A Homozygous Ancestral SVA-Insertion-Mediated Deletion in WDR66 Induces Multiple Morphological Abnormalities of the Sperm Flagellum and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects had an isolated MMAF phenotype and no mention of any other PCD symptoms."
    explanation: No PCD manifestations in a cohort that included seven homozygous founder-deletion carriers.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, one patient carrying biallelic CFAP251 mutations showed PCD-like symptoms, including tinnitus, seasonal cough, and radiological findings of coarsened lung markings and a solitary pulmonary bulla associated with chronic bronchitic inflammation."
    explanation: A single patient with respiratory symptoms and CT changes, without ciliary investigation.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Although the loss of CFAP251 in the respiratory cilia of Cfap251-/- mice did not result in overt defects in ciliary length or density, TEM revealed a frequent absence of inner dynein arms within the axoneme."
    explanation: Knockout mice have an ultrastructural defect in tracheal cilia.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Another notable limitation is that while ciliary dynein arm defects are clearly demonstrated in the mouse model (Supplementary Figure 4), human ciliary ultrastructure data could not be generated owing to the unavailability of patient ciliary biopsy samples, meaning the PCD-like phenotype in humans was inferred solely from symptoms and chest CT findings rather than direct morphological evidence."
    explanation: The authors' own statement that the human respiratory phenotype is not confirmed by ciliary studies.
- hypothesis_group_id: cfap251_tubb4b_slc25a4_recruitment
  hypothesis_label: CFAP251 recruits TUBB4B and SLC25A4 to the developing sperm flagellum
  status: EMERGING
  description: >-
    A single 2026 study found that CFAP251 binds the beta-tubulin TUBB4B and
    the mitochondrial ADP/ATP carrier SLC25A4 (testis pull-down with mass
    spectrometry, co-immunoprecipitation in vitro, and structural modelling),
    that both proteins are reduced in Cfap251 knockout testis and along
    knockout sperm flagella, and that their flagellar immunofluorescence is
    reduced in sperm of two men with homozygous CFAP251 splice variants. The
    authors propose that CFAP251 is a scaffold needed to incorporate both
    proteins into the flagellum, which would add a tubulin-supply and an
    energy-transport component to the radial spoke 3 defect. It has not been
    replicated, and no experiment separates the contribution of these two
    proteins from that of radial spoke loss.
  evidence:
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."

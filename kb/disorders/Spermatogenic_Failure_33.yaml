    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we observed a complete absence of CFAP251 proteins in the sperm tails of the patients with CFAP61 variants, indicating that CFAP61 is essential for the localization of CFAP251 in sperm flagella."
    explanation: CFAP251 depends on its CSC partner CFAP61 in human sperm.

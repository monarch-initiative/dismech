  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Radial spokes anchor the central pair and connect it to the dynein arms;
      without RS3 the central pair is lost and the axoneme becomes unstable
      during flagellar assembly. How loss of one spoke leads to wholesale
      disorganization of the flagellum in sperm, but not in most motile cilia,
      is not established.
    evidence:
    - reference: PMID:41943837
      reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings revealed decreased or completely absent expression of CP-related protein SPAG6, RS-related proteins RSPH1 and RSPH3, ODA-related protein DNAI2, and ODF-related protein ODF2 in the sperm of Cfap251-/- mice compared with that of controls."
      explanation: In knockout mice, central-pair, radial spoke, outer-arm and outer dense fiber proteins are all reduced.
  evidence:
  - reference: PMID:25694453
    reference_title: "The CSC proteins FAP61 and FAP251 build the basal substructures of radial spoke 3 in cilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that in Tetrahymena, loss of either FAP61 or FAP251 reduces cell swimming and affects the ciliary waveform and that RS3 is either missing or incomplete, whereas RS1 and RS2 are unaffected."
    explanation: CSC subunits are needed specifically for RS3 assembly.
  - reference: PMID:32161152
    reference_title: "Biallelic variants in MAATS1 encoding CFAP91, a calmodulin-associated and spoke-associated complex protein, cause severe astheno-teratozoospermia and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we confirmed that the WDR66 protein is a physical and functional partner of CFAP91 into the CSC."
    explanation: CFAP251 and CFAP91 are partners in the human sperm CSC.
  - reference: PMID:35174165

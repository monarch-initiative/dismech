    explanation: Physical interaction of CFAP251 with both partners.
  - reference: PMID:41943837
    reference_title: "CFAP251 Deficiency Induces Male Infertility and PCD-like Ciliary Defects by Disrupting TUBB4B and SLC25A4 Recruitment in Humans and Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The levels of TUBB4B and SLC25A4 were reduced in Cfap251-/- testes, whereas CABYR and AKAP3 levels were unaffected (Figure 6H and I)."
    explanation: Loss of both partners in knockout testis.

name: Mannose-binding Lectin Deficiency
creation_date: "2026-10-30T10:56:34Z"
category: Mendelian
description: >-
  Mannose-binding lectin (MBL) deficiency is a common, inherited reduction in
  the concentration or function of MBL, the liver-derived collectin that
  recognises mannose, fucose and N-acetylglucosamine arrays on microbial
  surfaces and initiates the lectin pathway of complement. It is caused by
  common coding and promoter variation in MBL2: the three exon-1 structural
  alleles D (rs5030737), B (rs1800450) and C (rs1800451) - collectively "O",
  against the wild-type "A" - impair assembly of the higher-order oligomers MBL
  needs for high-avidity binding, while the -221 X promoter allele (rs7096206)
  lowers transcription. One or two low-producing alleles lower serum MBL in an
  additive, functionally codominant way.

  The defining feature of this entry is that the biochemical deficiency is
  common and its clinical penetrance is very low and context-dependent. By a
  common "<100 ng/mL" cutoff roughly 5% of people are deficient, and far more
  under broader cutoffs, yet most deficient adults are healthy and prospective
  studies have not found them prone to severe infection. MBL deficiency is
  therefore best modelled as an inherited susceptibility state, not a fully
  penetrant monogenic immunodeficiency. Where it does become clinically
  relevant, it is chiefly in a second context that removes the compensating
  redundancy of the immune system - early infancy after maternal antibody has
  waned, chemotherapy-induced neutropenia, transplantation and other
  immunosuppression, or a coexisting antibody or structural lung defect. The
  same low activation can also be protective: reduced complement-assisted uptake
  of intracellular organisms is associated with lower risk of tuberculosis and
  modifies leprosy, the "MBL paradox".

  Because "deficiency" is defined by many different serum thresholds and
  because the clinical signal is small and context-dependent, the literature is
  genuinely conflicting, and this entry curates that conflict rather than
  resolving it: positive associations (pneumococcal death, pneumococcal
  meningitis, cryptosporidiosis) are carried beside negative ones (a 5-year
  respiratory-outcome cohort, a meningococcal-disease cohort, a COPD-exacerbation
  cohort) as SUPPORT and REFUTE items on the same nodes.

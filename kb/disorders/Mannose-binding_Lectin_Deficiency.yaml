parents:
- Complement Disorder
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A defect of the lectin pathway of complement, discussed among the innate
      immune / complement disorders, placing it in Harrison's immune and
      rheumatologic Part beside the sibling lectin-pathway entries
      Ficolin_3_Deficiency and Immunodeficiency_Due_To_MASP-2_Deficiency.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      MBL deficiency is the lectin-pathway recognition-molecule entry in the
      IUIS complement-deficiency table, the recognition-molecule counterpart of
      the MASP2 (enzyme) and C2/C3 (shared downstream component) rows. It is
      listed with the explicit caveat that its clinical penetrance is low.
inheritance:
- name: Semidominant (codominant) inheritance
  description: >-
    How MBL deficiency is inherited is reported inconsistently, and this block
    records the disagreement rather than choosing a side. OMIM lists autosomal
    dominant for the chronic-infection susceptibility phenotype, older IUIS
    tables have used autosomal recessive, and MedlinePlus calls the inheritance
    unclear. Functionally the MBL2 alleles behave codominantly and additively:
    one low-producing allele lowers serum MBL severalfold and two lower it
    further, so the XA/O and O/O genotypes carry the lowest concentrations. The
    semidominant binding reflects that additive genotype-to-level relationship,
    which is the one feature all sources agree on; the contributing alleles are
    named in the genetic section rather than here, since the Inheritance class
    has no genes slot.
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  evidence:
  - reference: PMID:18611155
    reference_title: "Low serum mannose-binding lectin level increases the risk of death due to pneumococcal infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XA/O and O/O MBL2 genotypes had the lowest median MBL concentrations."
    explanation: >-
      The additive, genotype-graded relationship between low-producing alleles
      and serum MBL concentration on which the semidominant (codominant) reading
      rests: one low-producing allele (XA/O) lowers the level and two (O/O)
      lower it further.
- name: Typified by incomplete penetrance
  description: >-
    The clinical penetrance of MBL deficiency is very low. Roughly 5% of people
    lack functional serum MBL, yet in prospective study deficient individuals
    have not been found prone to severe infection, and most deficient adults
    remain well. This block makes the low-penetrance observation - the central
    qualifier of the whole entry - machine-queryable rather than leaving it only
    in prose.
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:
  - reference: PMID:15148331
    reference_title: "Human Mannose-binding Lectin in Immunity: Friend, Foe, or Both?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 5% of individuals lack functional serum MBL and have not been found to be prone to severe infections in prospective studies."
    explanation: >-
      States both halves of the low-penetrance claim: the deficiency is common
      (about 5%), and prospective follow-up has not shown those individuals to
      be prone to severe infection.
pathophysiology:
- name: MBL2 Low-Producing and Structural Variants
  biological_scale: MOLECULAR
  description: >-
    The three exon-1 missense alleles - D (rs5030737, p.Arg52Cys), B
    (rs1800450, p.Gly54Asp) and C (rs1800451, p.Gly57Glu), collectively called
    O - fall in or adjacent to the collagen-like region and change MBL
    structure and serum concentration; the -221 X promoter allele (rs7096206)
    lowers transcription. These are common population variants rather than rare
    highly penetrant loss-of-function mutations, and ClinVar carries discordant
    assertions for them, which is why the functional impact is recorded as a
    partial loss of function.
  genetic_context:
    gene:
      preferred_term: MBL2
      term:
        id: hgnc:6922
        label: MBL2
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33013845
    reference_title: "Association of MBL2 Exon 1 Polymorphisms With Multibacillary Leprosy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "single-nucleotide polymorphisms located at exon 1, such as rs5030737 C>T (D variant), rs1800450 G>A (B variant), and rs1800451 G>A (C variant), may change the MBL structure and the serum concentration."
    explanation: >-
      Names the three exon-1 structural alleles with their rsIDs and letter
      designations and states that they change MBL structure and serum
      concentration. The sentence is the paper's framing of MBL2 biology rather
      than its own leprosy result, so it is graded BACKGROUND.
  - reference: PMID:27876780
    reference_title: "A Meta-analysis of MBL2 Polymorphisms and Tuberculosis Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "MBL2 gene variants, rs1800451, rs1800450, rs5030737, rs7096206, rs11003125 and rs7095891 are associated with impaired serum level"
    explanation: >-
      Adds the promoter and 5' regulatory variants (rs7096206 among them) to the
      coding alleles and states that they impair serum MBL level, supporting the
      promoter half of this node. Quoted from the paper's background framing.
  downstream:
  - target: Defective MBL Oligomerization and Reduced Serum MBL
    causal_link_type: DIRECT
    description: >-
      The structural alleles act by compromising assembly of the oligomers MBL
      is active as; the promoter allele acts by lowering how much is made. Both
      routes converge on less functional oligomeric MBL in serum.
- name: Defective MBL Oligomerization and Reduced Serum MBL
  biological_scale: MOLECULAR
  description: >-
    MBL is functional only as higher-order oligomers (tetramers to hexamers of
    structural units) that present multiple carbohydrate-recognition domains for
    high-avidity binding. The exon-1 variants disrupt the collagen-like helix so
    that only low-order, largely noncovalent assemblies form, and these bind
    microbial carbohydrate ligands with markedly reduced capacity. This was
    shown directly in recombinant protein expressed in Chinese hamster ovary
    cells.
  molecular_functions:
  - preferred_term: carbohydrate binding
    term:
      id: GO:0030246
      label: carbohydrate binding
    modifier: DECREASED
  chemical_entities:
  - preferred_term: D-mannose (a recognised microbial carbohydrate ligand)
    term:
      id: CHEBI:16024
      label: D-mannose
  evidence:
  - reference: PMID:14764589
    reference_title: "Disease-associated mutations in human mannose-binding lectin compromise oligomerization and activity of the final protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in the collagenous region of human MBL compromise assembly of higher order oligomers, resulting in reduced ligand binding capacity and thus reduced capability to activate complement."
    explanation: >-
      The direct in-vitro demonstration, in recombinant variant protein, that
      the collagen-region mutations impair oligomer assembly and so reduce
      ligand binding and complement activation - the molecular lesion this node
      represents.
  - reference: PMID:14764589
    reference_title: "Disease-associated mutations in human mannose-binding lectin compromise oligomerization and activity of the final protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MBL variants bound ligands with a markedly reduced capacity compared with WT MBL-A."
    explanation: >-
      The ligand-binding readout specifically, establishing the carbohydrate-
      binding decrement annotated on this node.
  downstream:
  - target: Decreased serum mannose-binding lectin
    causal_link_type: DIRECT
    description: >-
      Less functional oligomeric MBL in serum is what the antigen measurement
      reads out, so the defining laboratory abnormality is a direct readout of
      this node.
  - target: Impaired Lectin Pathway Complement Activation
    causal_link_type: DIRECT
    description: >-
      MBL bound to a microbial surface is what recruits and activates the
      MASPs; fewer high-avidity binding events means fewer initiated
      lectin-pathway complexes.
- name: Impaired Lectin Pathway Complement Activation
  biological_scale: MOLECULAR
  description: >-
    Surface-bound MBL carries MASP-1 and MASP-2; on clustering, MASP-1
    autoactivates and is the physiological activator of MASP-2, and MASP-2 then
    cleaves C4 and C2 to build the C4b2b (C4b2a) C3 convertase that deposits
    C3b. Reduced functional MBL means less of this lectin-pathway C3-convertase
    activity and so less C3b deposition, while the classical and alternative
    pathways and total complement (CH50/AH50) are typically preserved. In human
    pneumococcal meningitis, cerebrospinal-fluid MBL level correlated with C3a
    and iC3b, direct evidence that lectin-pathway MBL drives complement
    activation in people and not only in vitro.
  biological_processes:
  - preferred_term: complement activation, lectin pathway
    term:
      id: GO:0001867
      label: complement activation, lectin pathway
    modifier: DECREASED
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  evidence:
  - reference: PMID:23741476
    reference_title: "Genetic variation and cerebrospinal fluid levels of mannose binding lectin in pneumococcal meningitis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF MBL levels were positively correlated with C3a and iC3b levels, indicating complement activation by the lectin pathway."
    explanation: >-
      A human in-vivo demonstration that MBL level tracks lectin-pathway
      complement activation products, grounding this node's claim that reduced
      MBL means reduced lectin-pathway C3 activation in patients.
  downstream:
  - target: Reduced Opsonophagocytic Clearance of Microbes
    causal_link_type: DIRECT
    description: >-
      C3b deposited by the lectin-pathway convertase is the opsonin that
      complement-receptor-bearing phagocytes engage, so less C3b deposition
      means less complement-mediated uptake.
  - target: Reduced Opsonization of Intracellular Pathogens
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same reduced opsonisation branch can lower complement-assisted entry
      of intracellular organisms, which is the proposed basis of the protective
      associations rather than a route to disease.
- name: Reduced Opsonophagocytic Clearance of Microbes
  biological_scale: CELLULAR
  description: >-
    With less C3b and less surface-bound MBL, neutrophils and macrophages take
    up and kill susceptible extracellular microbes less efficiently; MBL also
    acts as a direct opsonin independent of C3b. In human monocyte-derived
    macrophages, opsonising Neisseria meningitidis with MBL increased capture
    and doubled internalisation, so loss of MBL removes a measurable opsonic
    contribution. This is the effector step whose weakening underlies the
    infection susceptibility, but on its own it is usually compensated by
    antibody, the other complement pathways and neutrophils.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: opsonization
    term:
      id: GO:0008228
      label: opsonization
    modifier: DECREASED
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:15569696
    reference_title: "Mannose-binding lectin enhances phagocytosis and killing of Neisseria meningitidis by human macrophages."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Opsonization with MBL significantly increased the capture and doubled the amount of internalization of Neisseria meningitidis."
    explanation: >-
      Quantifies the opsonic contribution of MBL to phagocyte uptake in human
      macrophages, which is the function this node loses when MBL is deficient.
  - reference: PMID:15569696
    reference_title: "Mannose-binding lectin enhances phagocytosis and killing of Neisseria meningitidis by human macrophages."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that MBL is a dependent opsonin able to accelerate microbial uptake and killing."
    explanation: >-
      States the authors' conclusion that MBL is an opsonin accelerating uptake
      and killing, the effector role whose reduction defines this node.
  downstream:
  - target: Infection Susceptibility Under a Second Immune Stressor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced opsonophagocytic clearance becomes a clinical liability only when
      the redundancy that normally covers it is absent; the edge to a clinical
      phenotype runs through that second-context node rather than directly.
- name: Infection Susceptibility Under a Second Immune Stressor
  biological_scale: ORGANISM
  description: >-
    This is the gating node that makes MBL deficiency a susceptibility state
    rather than a disease. Reduced lectin-pathway opsonisation produces
    recurrent or unusually severe infection chiefly when a second factor removes
    compensating redundancy: early infancy (roughly 6-18 months, after maternal
    antibody wanes but before adaptive immunity matures), chemotherapy-induced
    neutropenia, transplantation and other immunosuppression, or a coexisting
    antibody or structural lung defect. In isolation the deficiency is usually
    silent, which is why the downstream phenotype edges are drawn from this node
    and not directly from the molecular lesion.
  evidence:
  - reference: PMID:14723627
    reference_title: "Human plasma-derived mannose-binding lectin: a phase I safety and pharmacokinetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Genetically determined MBL deficiency is very common and can be associated with increased susceptibility to a variety of infections, especially in children and immunosuppressed individuals."
    explanation: >-
      States the context dependence that defines this node - that the increased
      susceptibility is seen especially in children and the immunosuppressed.
      The sentence is the paper's framing rather than its own pharmacokinetic
      result, so it is graded BACKGROUND.
  - reference: PMID:15086395
    reference_title: "Mannan-binding lectin insufficiency in children with recurrent infections of the respiratory system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mannan-binding lectin insufficiency, with or without a coexisting immune defect, is associated with the occurrence of recurrent respiratory infections in childhood, and this relationship is particularly strong and statistically significant in children with concomitant impairments of humoral immunity."
    explanation: >-
      Directly supports the gene-environment framing: the association with
      recurrent respiratory infection is strongest where a second (humoral)
      immune defect coexists.
  downstream:
  - target: Recurrent Respiratory Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The most frequently reported clinical correlate, chiefly in young
      children and under a second immune stressor.
  - target: Recurrent Pneumonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe or recurrent lower-respiratory infection, with pneumococcus the
      organism carrying the clearest mortality signal.
  - target: Pneumococcal Meningitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Invasive pneumococcal disease including meningitis is enriched in
      defective MBL2 genotypes, though the meningococcal signal is absent (see
      the phenotype's REFUTE item).
  - target: Recurrent Cryptosporidium Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recurrent cryptosporidial gastrointestinal infection, reported especially
      in young children.
- name: Reduced Opsonization of Intracellular Pathogens
  biological_scale: CELLULAR
  description: >-
    The opposing branch of the "MBL paradox": because MBL-mediated opsonisation
    can facilitate complement-assisted entry of some intracellular organisms,
    reduced MBL is associated with lower susceptibility to tuberculosis and
    modifies leprosy. This node records that reduced lectin-pathway activation
    is not uniformly harmful; it is a protective association, not a route to the
    disease's infection phenotype.
  biological_processes:
  - preferred_term: opsonization
    term:
      id: GO:0008228
      label: opsonization
    modifier: DECREASED
  evidence:
  - reference: PMID:27876780
    reference_title: "A Meta-analysis of MBL2 Polymorphisms and Tuberculosis Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MBL2 rs1800450 and rs1800451 polymorphisms play a protective role in TB infection and reinforce their critical significance as a potential genetic marker for TB resistance."
    explanation: >-
      Meta-analytic support that low-producing MBL2 alleles are protective
      against tuberculosis, the clearest instance of the protective branch this
      node represents.
  - reference: PMID:20375630
    reference_title: "Mannose-binding lectin deficiency and respiratory tract infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intracellular infections like tuberculosis may be less common with MBL deficiency because of reduced opsonophagocytosis."
    explanation: >-
      States the mechanism of the protective branch - reduced opsonophagocytosis
      lowering intracellular-pathogen uptake - as the review's synthesis of the
      field.
phenotypes:
- category: Laboratory
  name: Decreased serum mannose-binding lectin
  description: >-
    The defining laboratory abnormality: low circulating MBL antigen and low
    mannan-dependent lectin-pathway activity, congenital and lifelong though it
    can rise as an acute-phase reactant. There is no universal threshold -
    reported "deficiency" cutoffs span <50 to <600 ng/mL and one study set it at
    <0.6 mg/L - so the proportion called deficient depends heavily on the assay
    and cutoff.
  phenotype_term:
    preferred_term: Decreased serum mannose-binding lectin
    term:
      id: HP:0032305
      label: Decreased circulating mannose-binding protein concentration
  evidence:
  - reference: PMID:37503644
    reference_title: "Respiratory Outcomes at 5-Year Follow-Up in Children with Mannose-Binding Lectin Deficiency: A Retrospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mannose-binding lectin deficiency (defined as a level of less than 0.6 mg/L)"
    explanation: >-
      One operational serum-concentration definition of the deficiency state,
      illustrating that the abnormality is defined by a measured low MBL level.
  - reference: PMID:23226013
    reference_title: "Mannose-binding lectin deficiency and acute exacerbations of chronic obstructive pulmonary disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of mannose-binding lectin deficiency ranged from 0.5% to 52.2%, depending on how deficiency was defined."
    explanation: >-
      Supports the caveat that the measured prevalence of the abnormality is
      almost entirely a function of the chosen cutoff.
- category: Immunological
  name: Recurrent Respiratory Infection
  description: >-
    Recurrent upper- and lower-respiratory infection is the most frequently
    reported clinical correlate, chiefly in infancy and early childhood and most
    evident where a second immune defect coexists. Its status as a consequence
    of isolated MBL deficiency is disputed, and the entry carries that dispute:
    a 5-year follow-up cohort found no difference in respiratory outcomes between
    MBL-deficient and MBL-sufficient children. No frequency band is tagged,
    because the proportion affected comes from referral cohorts and cannot be
    generalised to all deficient individuals.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:15086395
    reference_title: "Mannan-binding lectin insufficiency in children with recurrent infections of the respiratory system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mannan-binding lectin insufficiency, with or without a coexisting immune defect, is associated with the occurrence of recurrent respiratory infections in childhood, and this relationship is particularly strong and statistically significant in children with concomitant impairments of humoral immunity."
    explanation: >-
      The primary clinical association, with the gene-environment qualifier that
      it is strongest alongside a humoral defect.
  - reference: PMID:20375630
    reference_title: "Mannose-binding lectin deficiency and respiratory tract infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinical studies in humans have shown that MBL deficiency appears to predispose to severe respiratory tract infection."
    explanation: >-
      The review's synthesis of the human respiratory-infection literature,
      stated with the hedge ("appears to") that matches the disputed status.
  - reference: PMID:37503644
    reference_title: "Respiratory Outcomes at 5-Year Follow-Up in Children with Mannose-Binding Lectin Deficiency: A Retrospective Cohort Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with mannose-binding lectin deficiency and sufficiency showed similar clinical, radiological, and microbiological characteristics."
    explanation: >-
      A 5-year respiratory-outcome cohort found no difference between deficient
      and sufficient children. Curated as REFUTE on the same node rather than
      omitted, because the disagreement is the state of the evidence.
- category: Respiratory
  name: Recurrent Pneumonia
  description: >-
    Recurrent or severe pneumonia, variable in age and severity, occasionally
    progressing to bronchiectasis. The clearest hard-outcome signal is with
    Streptococcus pneumoniae, where MBL deficiency was associated with increased
    mortality after adjustment for bacteraemia and comorbidity. No frequency is
    tagged.
  phenotype_term:
    preferred_term: Recurrent pneumonia
    term:
      id: HP:0006532
      label: Recurrent pneumonia
  evidence:
  - reference: PMID:18611155
    reference_title: "Low serum mannose-binding lectin level increases the risk of death due to pneumococcal infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of death was increased among MBL-deficient patients with Streptococcus pneumoniae infection (odds ratio, 5.62; 95% confidence interval, 1.27-24.92) after adjustment for bacteremia, comorbidities, and age."
    explanation: >-
      The adjusted mortality association specifically with pneumococcal
      infection, the strongest hard-outcome signal for severe lower-respiratory
      disease in this deficiency.
  sequelae:
  - target: Bronchiectasis
    description: >-
      Repeated or severe lower-respiratory infection can leave secondary
      bronchiectasis in a subset, though cohort evidence does not show an excess
      over symptomatic MBL-sufficient controls.
- category: Immunological
  name: Pneumococcal Meningitis
  description: >-
    Invasive pneumococcal disease including meningitis is enriched in people
    homozygous for defective MBL2 genotypes. The signal is pathogen-specific:
    the same deficiency does not increase invasive meningococcal disease, which
    the entry records as a REFUTE item to keep the pathogen-dependence visible.
    No frequency is tagged.
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:23741476
    reference_title: "Genetic variation and cerebrospinal fluid levels of mannose binding lectin in pneumococcal meningitis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of contracting pneumococcal meningitis was substantially increased for white individuals homozygous with the defective MBL2 0/0 genotype"
    explanation: >-
      A prospective cohort with meta-analysis finding substantially increased
      pneumococcal-meningitis risk in the defective 0/0 genotype.
  - reference: PMID:26464842
    reference_title: "Mannose-Binding Lectin Gene, MBL2, Polymorphisms Do Not Increase Susceptibility to Invasive Meningococcal Disease in a Population of Danish Children."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Defective MBL2 diplotypes did not predict either an increased IMD susceptibility or mortality in a Danish population of children."
    explanation: >-
      A large Danish childhood cohort found no increased invasive meningococcal
      disease with defective MBL2. Curated as REFUTE on the meningitis node to
      record that the invasive-infection signal is pathogen-specific rather than
      general.
- category: Immunological
  name: Recurrent Cryptosporidium Infection
  description: >-
    Recurrent cryptosporidial gastrointestinal infection, reported in young
    children, where serum MBL deficiency and the -221 promoter / YO/XA haplotype
    were strongly associated with recurrent Cryptosporidium infection. No
    frequency is tagged.
  phenotype_term:
    preferred_term: Recurrent Cryptosporidium infection
    term:
      id: HP:5210120
      label: Recurrent Cryptosporidium infection
  evidence:
  - reference: PMID:19827946
    reference_title: "Deficient serum mannose-binding lectin levels and MBL2 polymorphisms increase the risk of single and recurrent Cryptosporidium infections in young children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum MBL deficiency, polymorphisms in the -221 promoter region, and the YO/XA MBL2 haplotype were strongly associated with Cryptosporidium infections, particularly recurrent infection."
    explanation: >-
      The prospective paediatric-cohort association between MBL deficiency and
      recurrent cryptosporidial infection behind this phenotype.
- category: Respiratory
  name: Bronchiectasis
  description: >-
    Bronchiectasis occurs as a secondary complication of repeated or severe
    lower-respiratory infection in a subset, not as a defining or primary
    feature. Cohort evidence does not show an excess of bronchiectasis in
    MBL-deficient over MBL-sufficient children, so it is recorded as a
    downstream complication of recurrent pneumonia rather than a direct
    consequence of the deficiency.
  phenotype_term:
    preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
  evidence:
  - reference: PMID:37503644
    reference_title: "Respiratory Outcomes at 5-Year Follow-Up in Children with Mannose-Binding Lectin Deficiency: A Retrospective Cohort Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "also the prevalence of bronchiectasis was similar in both groups"
    explanation: >-
      In a 5-year paediatric cohort the prevalence of bronchiectasis did not
      differ between MBL-deficient and MBL-sufficient children, refuting an
      excess of bronchiectasis attributable to the deficiency. None of the
      cached sources states that bronchiectasis follows recurrent infection in
      MBL deficiency specifically, so the sequela edge from Recurrent Pneumonia
      carries no evidence of its own.
biochemical:
- name: Serum mannose-binding lectin concentration
  presence: DECREASED
  notes: >-
    The screening measurement. There is no universally accepted cutoff -
    reported thresholds for "deficiency" span <50 to <600 ng/mL and one cohort
    used <0.6 mg/L - and MBL behaves as an acute-phase reactant, so a borderline
    low value is best confirmed on a second, non-acute sample. A low
    concentration is the trait, not by itself a clinical diagnosis.
  evidence:
  - reference: PMID:18611155
    reference_title: "Low serum mannose-binding lectin level increases the risk of death due to pneumococcal infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an MBL cutoff value of 0.5 microg/mL was a reliable predictor of low-producing MBL2 genotypes"
    explanation: >-
      One systematically derived serum cutoff (0.5 microg/mL) for the
      low-producing genotype, establishing the measurement that defines the
      deficiency state.
- name: Mannan-dependent lectin-pathway functional activity
  presence: DECREASED
  notes: >-
    The functional counterpart of the antigen measurement: low mannan-dependent
    C4/C3 deposition with preserved classical (CH50) and alternative (AH50)
    pathway activity localises the defect to the lectin pathway. A low functional
    result is not specific to MBL, since a MASP or ficolin defect can also lower
    it. This marker carries no evidence item: none of the references cited in
    this entry reports a mannan-dependent C4/C3 deposition assay in
    MBL-deficient patients, and the antigen-level and recombinant-protein
    results cited elsewhere measure different things.
genetic:
- name: MBL2
  gene_term:
    preferred_term: MBL2
    term:
      id: hgnc:6922
      label: MBL2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    MBL2 variation is the cause of the biochemical deficiency state that names
    this disease, but the relationship to clinical infection is a low-penetrance
    susceptibility rather than a deterministic one: the common exon-1 and
    promoter alleles are frequent in healthy populations and ClinVar carries
    discordant assertions for them, so they are modelled as partial
    loss-of-function risk alleles and the variant clinical significance is left
    UNCERTAIN_SIGNIFICANCE. The D, B and C exon-1 alleles are collectively "O"
    against the wild-type "A"; one low-producing allele lowers serum MBL
    severalfold and two lower it further. No ClinGen gene-disease validity
    assertion is recorded because none was found for this pair, and
    gene_disease_validity is left absent rather than filled with a curator's own
    tier.
  evidence:
  - reference: PMID:33013845
    reference_title: "Association of MBL2 Exon 1 Polymorphisms With Multibacillary Leprosy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This protein is encoded by MBL2 gene, and single-nucleotide polymorphisms located at exon 1, such as rs5030737 C>T (D variant), rs1800450 G>A (B variant), and rs1800451 G>A (C variant), may change the MBL structure and the serum concentration."
    explanation: >-
      Names the gene and its three exon-1 structural alleles with rsIDs, and
      states that they alter MBL structure and serum concentration.
  variants:
  - name: D variant (rs5030737)
    description: >-
      Exon-1 missense allele (rs5030737, C>T; p.Arg52Cys) in the collagen-like
      region. Reduces oligomer assembly and ligand binding. One of the three "O"
      alleles; ClinVar carries conflicting assertions, consistent with a common
      low-penetrance risk allele rather than a classic pathogenic variant.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:33013845
      reference_title: "Association of MBL2 Exon 1 Polymorphisms With Multibacillary Leprosy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "rs5030737 C>T (D variant)"
      explanation: >-
        Identifies the D allele by rsID and nucleotide change.
  - name: B variant (rs1800450)
    description: >-
      Exon-1 missense allele (rs1800450, G>A; p.Gly54Asp), the commonest O
      allele in Europeans and many Asian populations. Distorts the collagen
      triple helix and destabilises oligomers.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:33013845
      reference_title: "Association of MBL2 Exon 1 Polymorphisms With Multibacillary Leprosy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "rs1800450 G>A (B variant)"
      explanation: >-
        Identifies the B allele by rsID and nucleotide change.
  - name: C variant (rs1800451)
    description: >-
      Exon-1 missense allele (rs1800451, G>A; p.Gly57Glu), concentrated in
      sub-Saharan African populations. Impairs oligomerisation.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:33013845
      reference_title: "Association of MBL2 Exon 1 Polymorphisms With Multibacillary Leprosy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "rs1800451 G>A (C variant)"
      explanation: >-
        Identifies the C allele by rsID and nucleotide change.
  - name: -221 X promoter allele (rs7096206)
    description: >-
      Regulatory 5' variant (rs7096206, the -221 Y/X polymorphism) that lowers
      MBL2 transcription and serum concentration, especially in combination with
      an exon-1 O allele. A common low-expression polymorphism rather than a
      classic pathogenic variant.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:27876780
      reference_title: "A Meta-analysis of MBL2 Polymorphisms and Tuberculosis Risk."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "rs1800451, rs1800450, rs5030737, rs7096206, rs11003125 and rs7095891 are associated with impaired serum level"
      explanation: >-
        Lists rs7096206 among the MBL2 variants, including promoter variants,
        associated with impaired serum MBL level.
prevalence:
- population: General populations (functional MBL deficiency, prospective studies)
  measure_type: UNKNOWN
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 5000.0
  notes: >-
    About 5% of individuals lack functional serum MBL. measure_type is UNKNOWN
    rather than a prevalence measure because this is the frequency of a
    biochemical trait, not of a clinical disease: the same source states these
    individuals have not been found prone to severe infection, so reading 5% as
    a disease prevalence would assert the penetrance this entry records as very
    low. The figure also depends on the chosen cutoff (see the second record).
  evidence:
  - reference: PMID:15148331
    reference_title: "Human Mannose-binding Lectin in Immunity: Friend, Foe, or Both?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 5% of individuals lack functional serum MBL"
    explanation: >-
      Source of the ~5% functional-deficiency figure normalised here to 5000 per
      100,000.
- population: Human population (broad serum-concentration cutoff)
  measure_type: UNKNOWN
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 30000.0
  notes: >-
    Under a broad serum cutoff the deficiency is far commoner, classified as an
    immune disorder affecting about 30% of the human population. measure_type is
    UNKNOWN for the same reason as the record above - this is a biochemical trait
    frequency at a permissive threshold, not a clinical disease prevalence. The
    gap between 5% and 30% is entirely the effect of the threshold.
  evidence:
  - reference: PMID:22377282
    reference_title: "Mannan-binding lectin deficiency - Good news, bad news, doesn't matter?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mannan-binding lectin (MBL) deficiency has been classified as a commonly occurring immune disorder, affecting approximately 30% of the human population."
    explanation: >-
      Source of the ~30% figure under a broad cutoff, normalised here to 30000
      per 100,000.
animal_models:
- name: Mbl-null mouse (combined MBL deficiency)
  species: Mouse
  genotype: Mbl-A/Mbl-C combined deficiency (all MBL activity absent)
  publication: DOI:10.1084/jem.20032207
  description: >-
    Mice devoid of all MBL activity were generated to test MBL's role in host
    defence directly in vivo. On intravenous Staphylococcus aureus challenge,
    MBL-null mice showed greatly increased mortality, and neutrophils together
    with MBL were required to limit infection.
  modeled_mechanisms:
  - target: Reduced Opsonophagocytic Clearance of Microbes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The whole-animal model demonstrates that loss of MBL impairs control of a
      susceptible microbe, which is the organism-level readout of the reduced
      opsonophagocytic clearance node.
    limitations: >-
      Mice carry two functional MBL genes (Mbl-A and Mbl-C) where humans express
      one product, so profound deficiency requires combined knockout rather than
      a single-gene lesion; the intravenous lethal inoculum is far more severe
      than typical human exposure; and the model reproduces a profound,
      fully penetrant deficiency rather than the common, low-penetrance human
      state this entry describes.
    readouts:
    - name: Mortality after intravenous S. aureus challenge
      target: Reduced Opsonophagocytic Clearance of Microbes
      direction: INCREASED
      interpretation: >-
        Increased mortality in MBL-null versus wild-type mice is the
        organism-level correlate of impaired opsonophagocytic clearance.
      evidence:
      - reference: DOI:10.1084/jem.20032207
        reference_title: "Mannose-binding Lectin-deficient Mice Are Susceptible to Infection with\n                    <i>Staphylococcus aureus</i>"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that 100% of MBL-null mice died 48 h after exposure to an intravenous inoculation of S. aureus compared with 45% mortality in wild-type mice."
        explanation: >-
          The mortality measurement behind this readout.
    evidence:
    - reference: DOI:10.1084/jem.20032207
      reference_title: "Mannose-binding Lectin-deficient Mice Are Susceptible to Infection with\n                    <i>Staphylococcus aureus</i>"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we demonstrated that neutrophils and MBL are required to limit intraperitoneal infection with S. aureus."
      explanation: >-
        Supports treating this model as informative for the opsonophagocytic
        clearance node: MBL and neutrophils are jointly required to control the
        organism.
treatments:
- name: Prompt organism-directed antimicrobial therapy
  description: >-
    Standard of care for breakthrough bacterial (and, as indicated, fungal or
    viral) infection: treat the infection on its own merits, obtaining cultures
    where feasible. There is no MBL-specific pharmacotherapy and no
    genotype-directed regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
- name: Routine and additional vaccination
  description: >-
    Age-appropriate routine vaccination, often with annual influenza vaccination
    and - particularly where infection has been severe or recurrent, or a
    broader complement concern exists - pneumococcal, meningococcal and Hib
    vaccination, maintaining adaptive compensation for the lectin-pathway
    deficit. This is extrapolated from complement-deficiency management rather
    than from MBL-specific trial evidence.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
- name: Supportive and pulmonary care
  description: >-
    Most deficient individuals need no regular treatment. For those with
    frequent or severe infection, management is phenotype-driven: individualised
    low-dose antibiotic prophylaxis, and for established bronchiectasis or
    chronic suppurative lung disease, airway clearance and physiotherapy per
    pulmonary guidelines. Immunoglobulin replacement is not indicated for
    isolated MBL deficiency and is considered only if a separate antibody-
    production defect is demonstrated.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Experimental MBL replacement
  description: >-
    Reconstitution with exogenous MBL has been tested but is not an approved
    routine treatment. A phase I study of plasma-derived MBL in 20 deficient
    healthy adults found it safe and able to restore serum MBL to normal levels,
    with a short and variable half-life implying frequent dosing would be needed
    to maintain protective levels. Plasma-derived MBL was later given to
    MBL-deficient children with chemotherapy-induced neutropenia in a phase II
    study (NCT00138736); a phase I dose-escalation study of recombinant MBL in
    the same setting (NCT00886496) was registered but withdrawn.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: mannose-binding lectin replacement
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mannose-binding lectin
      term:
        id: NCIT:C1151
        label: Mannose-Binding Lectin
  evidence:
  - reference: PMID:14723627
    reference_title: "Human plasma-derived mannose-binding lectin: a phase I safety and pharmacokinetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum MBL levels increased up to normal levels (1200-4500 ng/ml) immediately after each infusion, but the half-life of the infused MBL was highly variable, ranging from 18 to 115 h (mean 69.6)."
    explanation: >-
      The phase I pharmacokinetic result: infused MBL restored normal serum
      levels but with a short, variable half-life, which is why maintaining
      protective levels would require frequent dosing.
  - reference: PMID:14723627
    reference_title: "Human plasma-derived mannose-binding lectin: a phase I safety and pharmacokinetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No adverse clinical or laboratory changes were observed in any of the 20 participants"
    explanation: >-
      The phase I safety result in 20 MBL-deficient adults.
clinical_trials:
- name: NCT00886496
  phase: PHASE_I
  status: WITHDRAWN
  description: >-
    Planned multi-centre safety, pharmacokinetic and dose-escalation study of

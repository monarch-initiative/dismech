discussions:
- discussion_id: mbl_susceptibility_versus_disease
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Infection Susceptibility Under a Second Immune Stressor
  - phenotypes#Recurrent Respiratory Infection
  prompt: >-
    Is isolated MBL deficiency a sufficient cause of recurrent infection, or
    only a modifier that becomes visible under a second immune stressor?
  rationale: >-
    The biochemical deficiency is common and mostly silent: prospective study
    has not shown deficient individuals prone to severe infection, and a 5-year
    paediatric respiratory-outcome cohort found no difference from sufficient
    children. Yet positive signals are real and adjusted - pneumococcal
    mortality, pneumococcal meningitis, recurrent cryptosporidiosis - and are
    concentrated in young children and the immunosuppressed. The two readings
    are not reconciled by the published data, and the difference matters for how
    the gene-disease relationship should be classified: a sufficient cause, or a
    context-dependent risk modifier. Discriminating them needs prospective
    follow-up of genotyped deficient individuals with any second immune defect
    recorded, rather than associations drawn from referral and case-control
    cohorts assembled around an outcome.
notes: >-
  This entry was curated from a Perplexity (sonar-deep-research) deep-research
  report whose citations and term suggestions were reference- and
  term-validated before use; every CURIE and label was re-checked against OLS /
  the local NCIT build in the step it was written, and every snippet is an exact
  quote from a reference fetched into references_cache. Identifiers and alleles
  suggested by the report were treated as leads: the HP:0032305 label the report
  gave ("Decreased mannose-binding protein level") was corrected to the
  canonical "Decreased circulating mannose-binding protein concentration", and
  the protein-level consequences p.Arg52Cys / p.Gly54Asp / p.Gly57Glu are
  stated in the variant descriptions while each variant's evidence is anchored
  to a source that gives its rsID and nucleotide change.

  The whole entry is framed as a low-penetrance, context-dependent
  susceptibility state rather than a fully penetrant immunodeficiency. That is
  why the causal phenotype edges run from the "Infection Susceptibility Under a
  Second Immune Stressor" gating node rather than directly from the molecular
  lesion, why no HPO frequency bands are tagged on the phenotypes, why the
  prevalence records carry measure_type UNKNOWN (they are biochemical-trait
  frequencies, not disease prevalences), and why the MBL2 variants are modelled
  as PARTIAL_LOSS_OF_FUNCTION risk alleles with UNCERTAIN_SIGNIFICANCE.

  The conflicting literature is curated rather than flattened: the recurrent
  respiratory infection node carries a REFUTE item (the negative 5-year cohort)
  beside its SUPPORT items, and the pneumococcal-meningitis node carries a
  REFUTE item (the negative meningococcal cohort) that records the
  pathogen-specificity of the invasive-infection signal. The "MBL paradox" -
  that reduced lectin-pathway activation can be protective against intracellular
  organisms such as the tuberculosis bacillus - is modelled as a separate
  mechanistic branch node, not as a route to the infection phenotype.

  No GeneReviews chapter exists for this disease: `just check-genereviews
  --online` reports NO_CHAPTER against the entry's name, its synonyms and its
  MONDO term, against the committed Bookshelf index. MBL deficiency is a common
  susceptibility trait rather than a classic Mendelian syndrome, consistent with
  the absence of a chapter.

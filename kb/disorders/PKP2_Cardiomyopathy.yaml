    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endurance exercise and frequent exercise increase the risk of VT/VF, HF, and ARVD/C in desmosomal mutation carriers."
    explanation: >-
      Directly demonstrates that endurance and frequent exercise increase
      penetrance, VT/VF, and heart failure risk in this predominantly PKP2
      mutation-carrier cohort.

    reference_title: "Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specific evaluations are recommended in all patients suspected of AC: detailed history and family history, physical examination, 12-lead ECG (while off medications), signal averaged ECG, 24-hour Holter monitoring, maximal exercise testing, two-dimensional echocardiography with quantitative wall motion analysis, and more detailed imaging by cardiac magnetic resonance imaging (MRI) with delayed enhancement analysis."
    explanation: >-
      12-lead ECG off antiarrhythmic medication is a core recommended
      diagnostic evaluation in suspected arrhythmogenic cardiomyopathy.
- name: 24-Hour Holter Monitoring
  description: >-
    Ambulatory 24-hour Holter monitoring quantifies premature ventricular
    contraction burden (>500 per 24 hours) and detects non-sustained or
    sustained ventricular tachycardia for diagnosis and sudden-death risk
    stratification.

  features: >-
    Heterozygous loss-of-function mutations in PKP2 (plakophilin-2) are the
    most common genetic cause of ARVC, identified in approximately 43-50% of
    patients fulfilling Task Force Criteria in the curated cohorts. Mutation
    types include frameshift, nonsense, splicing, and missense variants. The
    PKP2 C-terminus has been identified as a potential functional domain.
    Truncating variants likely cause disease irrespective of transcript
    position.

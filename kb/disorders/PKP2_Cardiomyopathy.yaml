  notes: >-
    Overall arrhythmogenic cardiomyopathy prevalence in the general population is
    estimated at 1:1,000 to 1:5,000, and PKP2 pathogenic variants account for
    approximately 43-50% of index cases fulfilling Task Force Criteria across
    the curated cohorts, placing PKP2-related arrhythmogenic cardiomyopathy in
    the rare prevalence tier without a separately measured population-wide
    PKP2-only denominator.

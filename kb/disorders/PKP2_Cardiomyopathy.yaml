- accession: geo:GSE199925
  title: Desmosomal protein degradation as underlying causes of arrhythmogenic cardiomyopathy [PKP2 c.1755delA/WT and WT]
  description: Arrhythmogenic cardiomyopathy (ACM) is an inherited progressive cardiomyopathy. The pathophysiological events are well understood, yet the underlying molecular mechanisms remain undefined. Here we use patient originated hiPSC-derived cardiomyocytes bearing a pathogenic PKP2 mutation (PKP2 c.2013delC/WT), a corresponding knock-in mouse model carrying the equivalent murine mutation (Pkp2 c.1755delA/WT), and human explanted ACM hearts, to identify disease driving mechanisms. Pkp2 c.1755delA/WT mice over time displayed signs of ACM as observed by cardiac dysfunction and pathological remodeling.

- name: Wnt/Beta-Catenin Signaling Suppression
  description: >-
    Desmosomal disruption in cardiac muscle cells causes nuclear translocation
    of plakoglobin, which competitively inhibits beta-catenin-mediated canonical
    Wnt signaling through Tcf/Lef1 transcription factors. Suppression of Wnt
    signaling in cardiomyocytes upregulates adipogenic and fibrogenic gene
    expression programs and intracellular lipid accumulation, driving
    fibrofatty myocardial remodeling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Wnt signaling pathway

diagnosis:
- name: 12-Lead Electrocardiography
  description: >-
    Resting 12-lead electrocardiography evaluates Task Force repolarization and
    depolarization criteria, including right precordial T-wave inversions
    (V1-V3), prolonged terminal activation duration, and epsilon waves.
  presence: ABNORMAL
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  results: >-
    Inverted T waves in right precordial leads V1-V3, epsilon waves, or
    prolonged terminal activation duration (>=55 ms).
  evidence:
  - reference: PMID:16567567
    reference_title: "Plakophilin-2 mutations are the major determinant of familial arrhythmogenic right ventricular dysplasia/cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "negative T waves in V(2) and V(3) occurred more often in PKP2 mutation carriers (P<0.05)."
    explanation: >-

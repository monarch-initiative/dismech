  diagnosis_term:
    preferred_term: Holter Monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  results: >-
    Greater than 500 ventricular extrasystoles per 24 hours or episodes of
    non-sustained/sustained ventricular tachycardia.
  evidence:

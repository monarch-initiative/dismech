      label: exposure to strenuous exercise
  evidence:
  - reference: PMID:23871885
    reference_title: "Exercise increases age-related penetrance and arrhythmic risk in arrhythmogenic right ventricular dysplasia/cardiomyopathy-associated desmosomal mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The final study population included 87 individuals (46 male) from 51 families with a single copy of a pathogenic ARVD/C-associated desmosomal mutation (76 PKP2, 7 DSG2, 3 DSP, 1 DSC2, Supplementary Table 1)."
    explanation: >-
      Establishes that 76 of 87 (87%) studied desmosomal mutation carriers
      harbored pathogenic PKP2 mutations.

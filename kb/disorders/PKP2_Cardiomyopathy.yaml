    reference_title: "Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presence of sustained and non-sustained VT on Holter monitoring or during exercise testing, and sustained VT/VF during electrophysiological study were significant predictors of ICD therapy in a multivariate analysis in 84 patients treated with ICDs for primary prevention"
    explanation: >-
      Holter monitoring detects sustained and non-sustained ventricular
      tachycardia used in both Task Force diagnosis and ICD risk stratification.

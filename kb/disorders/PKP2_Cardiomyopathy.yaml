- name: Fibrofatty Replacement
  description: >-
    Progressive replacement of right ventricular myocardium with fibroadipocytic
    tissue is the pathological hallmark of PKP2-related ARVC. This results
    from cardiomyocyte apoptosis and loss due to mechanical uncoupling, combined
    with nuclear plakoglobin-mediated Wnt/beta-catenin suppression that drives
    adipogenic and fibrogenic remodeling. The right ventricle is preferentially
    affected due to its thinner wall and greater mechanical stress.

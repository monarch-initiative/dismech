      id: GO:0016055
      label: Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: fat cell differentiation
    term:
      id: GO:0045444
      label: fat cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:16823493
    reference_title: "Suppression of canonical Wnt/beta-catenin signaling by nuclear plakoglobin recapitulates phenotype of arrhythmogenic right ventricular cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      suppression of DP expression leads to nuclear localization of the
      desmosomal protein plakoglobin and a 2-fold reduction in canonical
      Wnt/beta-catenin signaling through Tcf/Lef1 transcription factors. The
      ensuing phenotype is increased expression of adipogenic and fibrogenic
      genes and accumulation of fat droplets.
    explanation: Demonstrates in cultured cardiac myocytes that desmosomal disruption causes Wnt suppression via nuclear plakoglobin, leading to adipogenic and fibrogenic gene expression.
  downstream:
  - target: Fibrofatty Replacement
    description: Suppressed Wnt signaling activates adipogenic transcription programs
- name: Gap Junction Remodeling
  description: >-
    Loss of PKP2 leads to secondary reduction and redistribution of connexin43
    (Cx43) gap junctions and voltage-gated sodium channels (Nav1.5) within the
    cardiomyocyte intercalated disc functional triad. Reduced gap-junctional
    coupling and sodium-channel conduction slow ventricular activation,
    creating an early arrhythmogenic substrate that can precede overt
    structural disease.
  biological_scale: CELLULAR

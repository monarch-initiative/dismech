- accession: geo:GSE301005
  title: Modeling arrhythmogenic cardiomyopathy fattyfibro pathology through the use of PKP2-deficient human iPSC-derived epicardial cells
  description: Arrhythmogenic cardiomyopathy (ACM) is an inherited cardiac disease characterized by progressive fatty-fibro replacement of the ventricular myocardium leading to arrhythmias and an increased risk of sudden cardiac death. To date, the cell types and signaling mechanisms involved in fatty-fibro infiltration of the myocardium have yet to be fully resolved. However, given that fatty-fibro replacement is initiated within the subepicardial layer, epicardial cells are predicted to contribute to the development of this pathology.

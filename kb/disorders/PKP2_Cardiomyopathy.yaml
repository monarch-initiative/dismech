    Vigorous endurance athletics and high annual exercise volume markedly
    increase age-related penetrance, Task Force Criteria fulfillment,
    life-threatening ventricular tachyarrhythmias (VT/VF), and progression to
    stage C heart failure in PKP2 and other desmosomal mutation carriers.
  exposure_term:

references:
- reference: PMID:20301310
  title: Arrhythmogenic Right Ventricular Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  This entry covers 4 Gene2Phenotype (G2P) rows for PKP2: the definitive
  association with ARVC, and disputed associations with Brugada syndrome,
  catecholaminergic polymorphic ventricular tachycardia (CPVT), and dilated
  cardiomyopathy. PKP2 missense mutations have been reported to produce a
  Brugada-syndrome-like phenotype via sodium channel dysfunction, but this
  association remains controversial and is not considered a definitive
  gene-disease relationship. Similarly, rare reports of PKP2 variants in
  CPVT and DCM phenotypes exist but lack definitive evidence for causality.
  Left-ventricular involvement can occur in later disease stages, but cohort
  comparison (PMID:34191271) demonstrates significantly higher left-ventricular
  ejection fraction and lower rates of left-ventricular involvement and heart
  failure in PKP2 mutation carriers than in non-PKP2 ARVC. The NCBI Bookshelf
  GeneReviews chapter Arrhythmogenic Right Ventricular Cardiomyopathy Overview
  (PMID:20301310) exposes only its purpose statement in the public cache without
  a clinical-characteristics section, so clinical phenotypes and genotype
  proportions are curated from primary PKP2 cohorts and reviews (PMID:15489853,
  PMID:16567567, PMID:18662195, PMID:23871885, PMID:24817548, PMID:34191271).

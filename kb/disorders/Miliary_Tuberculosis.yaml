  - reference: PMID:30819659
    reference_title: Predictors and outcomes of disseminated tuberculosis in an intermediate burden setting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      Compared to single organ TB, the clinical presentation of dTB patients
      differed by the absence of haemoptysis (OR 3.2, 95% CI 1.3-8.4) and of
      dyspnoea (OR 1.9, 95% CI 1.2-3.1), presence of weight loss (OR 1.8, 95%
      CI 1.1-2.9), night sweats (OR 1.7, 95% CI 1.1-2.7) and bilateral lung
      involvement (OR 4.4, 95% CI 2.8-7.1).
    explanation: >-
      Night sweats were more common in disseminated than single-organ
      tuberculosis; disseminated tuberculosis is broader than miliary.

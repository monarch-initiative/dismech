      label: Fever
  frequency: VERY_FREQUENT
  description: >-
    Fever, typically with evening rises, lasting weeks. It is absent in some
    older patients (cryptic miliary tuberculosis). The 100% figure in the
    Turkish series reflects inclusion criteria that required a compatible
    picture such as prolonged fever.
  evidence:
  - reference: PMID:35488218
    reference_title: Extremely high levels of central nervous system involvement in miliary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most frequent symptom of TB was fever (90.56%), followed by cough
      (46.68%).
    explanation: >-
      Fever was present in 91% of 392 Chinese adults with miliary
      tuberculosis.

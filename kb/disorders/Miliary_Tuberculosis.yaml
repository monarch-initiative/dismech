name: Miliary Tuberculosis
creation_date: "2026-11-26T15:45:36Z"
description: >-
  Miliary tuberculosis is the disseminated form of tuberculosis in which
  Mycobacterium tuberculosis spreads massively through the blood and lymphatics
  from a primary or reactivated focus, in a host whose cell-mediated immunity
  fails to contain it. Innumerable tubercles about 1-3 mm across, resembling
  millet seeds, form in the lungs, liver, spleen, bone marrow, choroid,
  meninges, kidneys and adrenals. It presents as a weeks-long febrile wasting
  illness with a miliary pattern on chest imaging, and can be complicated by
  tuberculous meningitis, acute respiratory distress syndrome, cytopenias,
  hyponatremia and adrenal insufficiency. It is fatal if untreated and still
  carries substantial mortality with standard antituberculous therapy.
category: Infectious Disease
disease_term:
  preferred_term: miliary tuberculosis
  term:
    id: MONDO:0005848
    label: miliary tuberculosis
parents:
- Tuberculosis
synonyms:
- acute miliary tuberculosis
- generalized tuberculosis
- miliary TB
notes: >-
  Seeded from `research/Miliary_Tuberculosis-deep-research-claude_code.md`
  and PubMed searches. The evidence base is reviews by one group (Sharma and
  Mohan), retrospective single- and multi-centre case series, two ARDS cohorts,
  a Japanese administrative database and an autopsy series. There are no
  randomised trials of regimen, duration or corticosteroids in miliary
  tuberculosis specifically. Symptom and laboratory frequencies come mainly
  from a 263-patient Turkish series whose inclusion criteria required a
  compatible clinical picture (prolonged fever among others), so its 100%
  fever figure reflects selection. The urine LAM and urine Xpert yields are
  from HIV inpatients with "disseminated tuberculosis", a broader category
  than miliary disease (blood-culture or urine-test positive, or two
  non-contiguous sites). "Disseminated tuberculosis" is a MONDO synonym of
  this term but is not used here as an entry synonym for that reason.
  Tuberculous meningitis, which complicates a substantial minority of cases,
  is curated separately in Meningeal_Tuberculosis; this entry records the
  meningeal seeding node and the meningitis phenotype without repeating that
  entry's pathophysiology. Osteoarticular involvement (about 18% in a Chinese
  series) is noted here but not modelled as a phenotype, because the source
  does not say which bone or joint lesion it counted.
review_notes: >-
  Deliberately lumped. Miliary disease caused by Mycobacterium tuberculosis,
  the uncommon miliary disease caused by Mycobacterium bovis BCG after
  intravesical BCG therapy, cryptic miliary tuberculosis in older adults,
  nonreactive (anergic) miliary tuberculosis with poorly formed granulomas in
  advanced HIV, and paediatric miliary tuberculosis are kept in one entry. The
  cited reviews and series describe the same lymphohematogenous dissemination,
  diagnose them with the same imaging, sampling and fundoscopy, and treat them
  with the same first-line regimen; none describes a stratum with its own
  first-line therapy or diagnostic pathway. PubMed was searched for miliary
  tuberculosis reviews and series, cryptic miliary tuberculosis, miliary
  tuberculosis in HIV, and BCG-associated miliary disease; the BCG literature
  found was a review mention and case reports, so it is recorded as a second
  agent rather than as a subtype.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium whose massive lymphohematogenous
    spread from a bacilli-laden focus causes miliary tuberculosis.
  evidence:
  - reference: PMID:15978528
    reference_title: "Miliary tuberculosis: new insights into an old disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Miliary tuberculosis is a potentially lethal form of tuberculosis
      resulting from massive lymphohaematogeneous dissemination of
      Mycobacterium tuberculosis bacilli.
    explanation: >-
      Names M. tuberculosis as the agent whose lymphohematogenous
      dissemination produces miliary tuberculosis.
- name: Mycobacterium bovis BCG
  infectious_agent_term:
    preferred_term: Mycobacterium bovis BCG
    term:
      id: NCBITaxon:33892
      label: Mycobacterium tuberculosis variant bovis BCG
  description: >-
    The attenuated M. bovis vaccine strain, which uncommonly causes miliary
    disease after intravesical BCG immunotherapy for bladder cancer.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Further, the uncommon occurrence of miliary disease caused by
      intravesical bacille Calmette–Guerin (BCG) therapy for urinary bladder
      carcinoma has also been documented
    explanation: >-
      Records BCG, an M. bovis strain, as an uncommon cause of miliary
      disease.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans as airborne droplet nuclei. After
    inhalation it establishes a primary pulmonary focus, which either seeds
    the blood directly during primary infection or is contained and later
    reactivates; miliary disease follows when bacilli from either focus enter
    the blood and lymphatics in large numbers. M. bovis has its reservoir in
    cattle and reaches humans mostly by raw milk or droplets from diseased
    animals.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host of M. tuberculosis
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: reservoir of M. bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:27525395
    reference_title: "[Investigation of Mycobacterium bovis subsp. bovis among the strains of Mycobacterium tuberculosis complex isolated in Düzce Province, Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Today, M.bovis infection is mostly transmitted from animals to humans and
      very rarely from humans to other humans. The most significant means of
      transmission of the infection are to the gastrointestinal tract via
      consumption of raw milk and to the respiratory system via droplet
      infection from the animals with disease.
    explanation: >-
      The introduction of a human isolate-typing study states that M. bovis
      reaches humans mostly from animals, supporting cattle as its reservoir.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Miliary TB is a fatal form of disseminated TB that results from a
      massive lymphohematogeneous dissemination from a Mycobacterium
      tuberculosis-laden focus
    explanation: >-
      Places the dissemination step that produces miliary disease downstream
      of an established bacilli-laden focus.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    Humans acquire M. tuberculosis by inhaling airborne bacilli. Miliary
    disease is the later lymphohematogenous spread of that infection, not a
    separate route of acquisition.
prevalence:
- population: Tuberculosis cases in immunocompetent adults
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Miliary tuberculosis is reported as under 2% of all tuberculosis and up to
    20% of extrapulmonary tuberculosis in immunocompetent adults, and is more
    common in late HIV infection and at autopsy. This is a share of
    tuberculosis cases, not a population prevalence or incidence, so no
    rate_per_100000 is asserted. Community-based prevalence data do not exist.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In various clinical studies among immunocompetent adults, miliary TB
      accounts for less than 2% of all cases of TB and up to 20% of all
      extra-pulmonary TB (EPTB) cases
    explanation: >-
      Gives the share of tuberculosis and extrapulmonary tuberculosis cases
      that are miliary.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reliable community-based epidemiological data are not available on the
      prevalence of miliary TB.
    explanation: >-
      States that no population prevalence estimate exists.
environmental:
- name: HIV co-infection
  description: >-
    Advanced HIV infection is the main predisposing condition for miliary and
    other disseminated tuberculosis, through loss of the T-cell immunity that
    contains the bacillus.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      HIV-driven CD4 T-cell loss removes the cell-mediated immunity whose
      failure allows dissemination.
    evidence:
    - reference: PMID:30819659
      reference_title: Predictors and outcomes of disseminated tuberculosis in an intermediate burden setting.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Independent risk factors for dTB were pharmacological immunosuppression
        (OR 5.6, 95% CI 2.8-11.3), HIV infection (OR 5.1, 95% CI 3.1-8.3),
        chronic liver failure or cirrhosis (OR 2.3, 95% CI 1.4-4.1) and
        duration of symptoms (OR 2.3, 95% CI 1.4-3.8).
      explanation: >-
        In a Portuguese cohort of 744 tuberculosis patients, HIV infection was
        an independent risk factor for disseminated tuberculosis. Disseminated
        tuberculosis is broader than miliary disease, so the link to this
        entry is an inference.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In late, advanced stage of HIV infection miliary TB is seen more often
    explanation: >-
      States that miliary tuberculosis is more frequent in advanced HIV
      infection.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Key risk factors include human immunodeficiency virus (HIV)
      co-infection, anti-tumor necrosis factor-α (TNF-α) agents and chronic
      malnutrition.
    explanation: >-
      Names HIV co-infection as a key risk factor for miliary tuberculosis.
- name: Anti-TNF biologic therapy
  description: >-
    TNF inhibitors (infliximab, adalimumab and, less so, etanercept) used for
    inflammatory disease reactivate latent infection, and a large share of the
    resulting tuberculosis is disseminated or miliary, often within weeks of
    starting treatment.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TNF neutralization undermines the granulomatous containment of latent
      bacilli, allowing reactivation and spread.
    evidence:
    - reference: PMID:11596589
      reference_title: "Tuberculosis associated with infliximab, a tumor necrosis factor alpha-neutralizing agent."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Forty of the patients had extrapulmonary disease (17 had disseminated
        disease, 11 lymph node disease, 4 peritoneal disease, 2 pleural
        disease, and 1 each meningeal, enteric, paravertebral, bone, genital,
        and bladder disease).
      explanation: >-
        Among 70 FDA MedWatch reports of tuberculosis after infliximab, 17 were
        disseminated disease.
  evidence:
  - reference: PMID:22771605
    reference_title: "Challenges in the diagnosis & treatment of miliary tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      disseminated and miliary TB accounted for 27.5 per cent of all TB cases,
      44 per cent of extra-pulmonary TB.
    explanation: >-
      Reports the share of disseminated and miliary disease among tuberculosis
      cases in a prospective anti-TNF cohort.
  - reference: PMID:11596589
    reference_title: "Tuberculosis associated with infliximab, a tumor necrosis factor alpha-neutralizing agent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were 70 reported cases of tuberculosis after treatment with
      infliximab, for a median of 12 weeks.
    explanation: >-
      Tuberculosis appears early after infliximab is started.
- name: Glucocorticoid, immunosuppressive and transplant-related immunosuppression
  description: >-
    Glucocorticoids, cytotoxic and other immunosuppressive drugs, and organ
    transplantation predispose to miliary tuberculosis.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pharmacological immunosuppression weakens T-cell containment of the
      bacillus; the cited sources do not resolve the intervening steps.
    evidence:
    - reference: PMID:30819659
      reference_title: Predictors and outcomes of disseminated tuberculosis in an intermediate burden setting.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Independent risk factors for dTB were pharmacological immunosuppression
        (OR 5.6, 95% CI 2.8-11.3), HIV infection (OR 5.1, 95% CI 3.1-8.3),
        chronic liver failure or cirrhosis (OR 2.3, 95% CI 1.4-4.1) and
        duration of symptoms (OR 2.3, 95% CI 1.4-3.8).
      explanation: >-
        Pharmacological immunosuppression was the strongest independent risk
        factor for disseminated tuberculosis; disseminated tuberculosis is
        broader than miliary disease.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to glucocorticoids, immunosuppressive, cytotoxic drugs that
      are known to predispose to the development of miliary TB, use of
      immunomodulatory biologicals has been reported to cause fatal TB
      including miliary TB
    explanation: >-
      Names glucocorticoids, immunosuppressive and cytotoxic drugs as
      predisposing to miliary tuberculosis.
  - reference: PMID:38848041
    reference_title: The clinical features and prognostic factors of miliary tuberculosis in a high tuberculosis burden area.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The major comorbidities were pharmacological immunosuppression (21.53%),
      pneumoconiosis (15.28%), diabetes (10.76%), and pregnancy or postpartum
      (7.29%).
    explanation: >-
      Pharmacological immunosuppression was the commonest comorbidity in 288
      Chinese patients with miliary tuberculosis.
- name: Malnutrition, diabetes and other predisposing conditions
  description: >-
    Malnutrition, diabetes mellitus, chronic kidney disease and dialysis,
    alcoholism, malignancy, silicosis and other pneumoconioses, pregnancy and
    the postpartum period, and childhood infections are recorded predisposing
    conditions. Diabetes was the commonest underlying disease in a cohort with
    miliary-tuberculosis ARDS and predicted ARDS development.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      These conditions are associated with miliary tuberculosis; the cited
      sources list them without resolving how each impairs containment.
    evidence:
    - reference: PMID:31723681
      reference_title: "Miliary tuberculosis: A new look at an old foe."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        Some of these conditions include childhood infections, malnutrition,
        HIV/AIDS, alcoholism, chronic kidney disease, dialysis, post-gastrectomy
        status, organ transplantation, immunosuppressive drug use, connective
        tissue disorders, pregnancy, postpartum, presence of an underlying
        malignancy, and silicosis
      explanation: >-
        Lists the conditions documented as predisposing to miliary
        tuberculosis; the mechanism by which each acts is inferred.
  evidence:
  - reference: PMID:22607610
    reference_title: "Predictors and outcome of patients with acute respiratory distress syndrome caused by miliary tuberculosis: a retrospective study in Chongqing, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Diabetes mellitus (DM) was the most common underlying disease
      (18.8%).ICU mortality was 47.1%.
    explanation: >-
      Diabetes was the commonest underlying disease among 85 patients with
      miliary-tuberculosis ARDS.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Key risk factors include human immunodeficiency virus (HIV)
      co-infection, anti-tumor necrosis factor-α (TNF-α) agents and chronic
      malnutrition.
    explanation: >-
      Names chronic malnutrition as a key risk factor.
- name: Young age
  description: >-
    Before chemotherapy miliary tuberculosis was mainly a disease of infants
    and children; children with miliary disease have more lymphadenopathy and
    hepatosplenomegaly and more often have meningitis than adults. BCG
    vaccination reduces miliary disease in children.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The immature immune response of infants and young children is less able
      to contain primary infection; the cited sources state the age
      association without the mechanism.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Before the advent of anti-TB treatment, miliary TB was predominantly seen
      as a disease of infants and children
    explanation: >-
      Records the historical predominance of miliary tuberculosis in infants
      and children.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In children with miliary TB, chills and night sweats, hemoptysis,
      productive cough are less common; peripheral lymphadenopathy and
      hepatosplenomegaly are more frequent compared with adults.
    explanation: >-
      Describes how the paediatric presentation differs from the adult one.
pathophysiology:
- name: Primary or Reactivated Tuberculous Focus
  role: trigger
  description: >-
    A bacilli-laden focus, either the primary infection or a reactivated
    latent focus, is the source from which bacilli enter the blood and
    lymphatics.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Massive Lymphohematogenous Dissemination
    causal_link_type: DIRECT
    description: >-
      Bacilli escape the focus into the blood and lymphatics.
    evidence:
    - reference: PMID:31723681
      reference_title: "Miliary tuberculosis: A new look at an old foe."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Miliary TB is a fatal form of disseminated TB that results from a
        massive lymphohematogeneous dissemination from a Mycobacterium
        tuberculosis-laden focus
      explanation: >-
        States that miliary disease results from dissemination from a
        bacilli-laden focus.
  evidence:
  - reference: PMID:35488218
    reference_title: Extremely high levels of central nervous system involvement in miliary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Miliary tuberculosis (TB) is caused by the acute, diffused dissemination
      of Mycobacterium tuberculosis (Mtb) from the primary site of infection,
      generally as a consequence of inadequate host defenses
    explanation: >-
      The introduction of a Chinese cohort study places dissemination
      downstream of the primary site of infection.
- name: Impaired Cell-Mediated Immune Containment
  role: predisposing factor
  description: >-
    An inadequate effector T-cell (Th1) response, with skewing toward Th2 and
    regulatory T cells, fails to organize granulomas that confine the bacillus
    at its first site, so infection is not limited locally.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
    modifier: DECREASED
  downstream:
  - target: Massive Lymphohematogenous Dissemination
    causal_link_type: DIRECT
    description: >-
      Failure to limit infection at the local site favours dissemination.
    evidence:
    - reference: PMID:31723681
      reference_title: "Miliary tuberculosis: A new look at an old foe."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In a susceptible host, immune responses skewed towards Th2
        cross-inhibit protective responses, such as granuloma formation and
        this failure in limiting the disease activity at the local site favors
        dissemination.
      explanation: >-
        Links failed local containment to dissemination.
  - target: Poorly Formed Granulomas With Abundant Bacilli
    causal_link_type: DIRECT
    description: >-
      With profound loss of cellular immunity, as in advanced HIV, the
      seeded lesions are poorly formed and teem with bacilli.
    evidence:
    - reference: PMID:42577908
      reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In individuals co-infected with human immunodeficiency virus (HIV),
        miliary TB exhibits distinct pathological alterations characterized by
        poorly formed granulomas, minimal inflammatory cellular reaction,
        extensive tissue necrosis, and abundant acid-fast bacilli, reflecting
        severe impairment of host cellular immunity.
      explanation: >-
        Attributes the poorly formed, bacilli-rich lesions of HIV-associated
        miliary tuberculosis to impaired cellular immunity.
  evidence:
  - reference: PMID:15978528
    reference_title: "Miliary tuberculosis: new insights into an old disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Impaired cell-mediated immunity underlies the disease's development.
    explanation: >-
      States that impaired cell-mediated immunity underlies miliary
      tuberculosis.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Miliary TB is thought to result as a consequence of the inadequate
      effector T-cell (Teff) response in containing the tubercle bacillus
    explanation: >-
      Attributes miliary tuberculosis to an inadequate effector T-cell
      response.
- name: Massive Lymphohematogenous Dissemination
  description: >-
    Large numbers of bacilli circulate in the blood and lymph and lodge in
    organs with high blood flow and many phagocytes: lungs, liver, spleen,
    bone marrow, eyes, kidneys, adrenals and meninges. Bacillemia can be
    detected by mycobacterial blood culture in a minority of patients.
  biological_scale: ORGANISM
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Multiorgan Miliary Granuloma Formation
    causal_link_type: DIRECT
    description: >-
      Circulating bacilli seed many organs at once, each focus becoming a
      tubercle.
    evidence:
    - reference: PMID:28151863
      reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Large amounts of bacillemia in miliary TB involve organs with high
        blood supply including lungs, liver, bone marrow, eyes, kidneys, and
        adrenals.
      explanation: >-
        The discussion of a case series restates that bacillemia seeds organs
        with high blood supply.
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      TB blood culture yielded M tuberculosis in a rate of 20% within 16 to 39
      days.
    explanation: >-
      Mycobacterial blood cultures documented bacillemia in a fifth of tested
      patients in a 263-patient series.
- name: Multiorgan Miliary Granuloma Formation
  conforms_to: "granuloma_formation#Organized Granuloma Assembly"
  description: >-
    In each seeded organ the bacilli are walled off in tubercles about 2 mm
    across: central caseous necrosis surrounded by epithelioid macrophages,
    Langhans giant cells and lymphocytes. Acute massive dissemination gives
    soft exudative tubercles with easily seen bacilli; chronic or episodic
    dissemination gives hard tubercles in which bacilli are scarce.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0002150
      label: epithelioid macrophage
  - preferred_term: Langhans giant cell
    term:
      id: CL:0000647
      label: multinucleated giant cell
  biological_processes:
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Diffuse Pulmonary Miliary Lesions
    causal_link_type: DIRECT
    description: >-
      Tubercles distributed randomly through both lungs.
  - target: Hepatosplenic Miliary Involvement
    causal_link_type: DIRECT
    description: >-
      Tubercles in the liver and spleen.
  - target: Bone Marrow Miliary Involvement
    causal_link_type: DIRECT
    description: >-
      Tubercles in the bone marrow.
  - target: Central Nervous System Seeding
    causal_link_type: DIRECT
    description: >-
      Tubercles in the meninges and brain parenchyma.
  - target: Choroidal Tubercle Formation
    causal_link_type: DIRECT
    description: >-
      Tubercles in the choroid of the eye.
  - target: Adrenal Miliary Involvement
    causal_link_type: DIRECT

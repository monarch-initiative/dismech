- name: Nodular-random pattern on pulmonary HRCT
  phenotype_term:
    preferred_term: Miliary pattern on chest imaging
    term:
      id: HP:0025400
      label: Nodular-random pattern on pulmonary HRCT
  frequency: VERY_FREQUENT
  description: >-
    Uniform 1-3 mm nodules randomly distributed through both lungs. The chest
    radiograph shows it in about half of patients at presentation and can be
    normal early; HRCT is more sensitive. The pattern appeared about 50 days
    after fever began in the Turkish series. Disease without a miliary
    pattern on chest radiography is called cryptic miliary tuberculosis.
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A miliary pattern was seen on chest X-ray and/or HRCT in 232 (88%)
      patients. Miliary pattern developed approximately 50 days (range 21–150)
      after the emergence of fever.
    explanation: >-
      A miliary pattern was seen in 88% of 263 patients, appearing weeks
      after fever onset.
  - reference: PMID:20197435
    reference_title: "Miliary tuberculosis: a comparison of CT findings in HIV-seropositive and HIV-seronegative patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All of the HIV-seropositive and -seronegative patients had small
      nodules and micronodules distributed randomly throughout both lungs.
    explanation: >-
      Confirms the random distribution of the nodules on CT.

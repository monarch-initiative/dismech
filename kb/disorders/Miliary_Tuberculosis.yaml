histopathology:
- name: Caseating Miliary Tubercles
  description: >-
    Tissue from liver, lung, bone marrow and lymph nodes shows granulomas,
    most with caseating necrosis; acid-fast bacilli are seen in a minority.
    In advanced HIV the granulomas are poorly formed with abundant bacilli.
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eighty-nine tissue samples including mainly bone marrow samples were
      studied and granulomas were detected in 74 (88%). Caseating necrosis was
      noted in 53 (72%). AFB were seen in 25% in granulomatous tissues
    explanation: >-
      Granulomas, mostly caseating and usually without visible bacilli, were
      found in 88% of tissue samples.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases of acute massive hematogenous dissemination, pathological
      examination typically reveals “soft” or “exudative” tubercles, which are
      characterized by active inflammation and easily detectable acid-fast
      bacilli (AFB) within the lesions.
    explanation: >-
      Describes the soft exudative tubercle of acute dissemination.
progression:
- phase: Primary infection or latent focus
  description: >-
    Inhaled bacilli establish a primary focus; in infants and the
    immunocompromised this can disseminate during primary infection, and
    otherwise a contained focus may reactivate later.
  evidence:
  - reference: PMID:35488218
    reference_title: Extremely high levels of central nervous system involvement in miliary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Miliary tuberculosis (TB) is caused by the acute, diffused dissemination
      of Mycobacterium tuberculosis (Mtb) from the primary site of infection,
      generally as a consequence of inadequate host defenses
    explanation: >-
      Places dissemination after the primary site of infection.
- phase: Lymphohematogenous dissemination and febrile illness
  description: >-
    Weeks of fever, sweats, anorexia and wasting. The chest radiograph may be
    normal at first; the miliary pattern appeared a median of about seven
    weeks after fever onset in one series, so serial imaging and HRCT are
    advised.
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A miliary pattern was seen on chest X-ray and/or HRCT in 232 (88%)
      patients. Miliary pattern developed approximately 50 days (range 21–150)
      after the emergence of fever.
    explanation: >-
      Times the appearance of the miliary pattern after fever onset.
- phase: Multiorgan complications
  description: >-
    Meningitis, ARDS, adrenal insufficiency, acute kidney injury, cytopenias
    and HLH can complicate the course, sometimes as the first presentation.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sometimes, complications like acute respiratory distress syndrome (ARDS)
      or myocarditis may in fact be the initial presentation.
    explanation: >-
      Notes that complications may be the first presentation.
- phase: Outcome
  description: >-
    Untreated disease is fatal within a year. With treatment, mortality is
    about 15-30% in most series (22.6% in-hospital in a 2,817-patient
    Japanese database; 17% at one year in the Turkish series), higher in
    adults than children and with ARDS, and as low as 2% in a UK cohort with
    ready access to critical care. Delay in starting treatment is the main
    modifiable factor.
  evidence:
  - reference: PMID:22771605
    reference_title: "Challenges in the diagnosis & treatment of miliary tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although several prognostic markers have been described which predict
      mortality, yet untreated miliary TB has a fatal outcome within one year.
    explanation: >-
      States that untreated disease is fatal within a year.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Delayed initiation of specific anti-TB treatment appears to be the most
      important factor responsible for mortality in miliary TB.
    explanation: >-
      Names treatment delay as the main determinant of mortality.
  - reference: PMID:38636244
    reference_title: "Factors affecting in-hospital mortality in patients with miliary tuberculosis: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In total, 2817 patients with miliary TB and 637 (22.6%) in-hospital
      deaths were identified.
    explanation: >-
      In-hospital mortality was 22.6% in a Japanese nationwide database.
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Forty-four (17%) patients died within 1 year after diagnosis established.
    explanation: >-
      One-year mortality was 17% in 263 patients.
  - reference: PMID:28427368
    reference_title: "Complications of miliary tuberculosis: low mortality and predictive biomarkers from a UK cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Despite the frequency of severe complications, one-year mortality was
      low at 2%.
    explanation: >-
      One-year mortality was 2% in a UK cohort.
  - reference: PMID:21740675
    reference_title: "Acute respiratory distress syndrome caused by miliary tuberculosis: a multicentre survey in South Korea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All-cause mortality in the ICU and hospital were respectively 58.2% and
      61.2%.
    explanation: >-
      Hospital mortality was 61% in 67 ICU patients with miliary-tuberculosis
      ARDS.
diagnosis:
- name: Clinical diagnostic criteria
  description: >-
    Criteria proposed by Sharma and colleagues combine a compatible clinical
    picture of more than six weeks responding to treatment, a classical
    miliary pattern or diffuse reticulonodular lesions on a background of
    miliary shadows on chest radiograph or HRCT, and microbiological,
    histopathological or molecular evidence of tuberculosis. A positive
    tuberculin skin test or IGRA shows only infection, and tuberculin anergy
    is common, so neither confirms or excludes miliary disease.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Following criteria are useful for the diagnosis of miliary TB in the
      clinical setting: (i) clinical presentation consistent with a diagnosis
      of TB such as, pyrexia with evening rise of temperature, weight loss,
      anorexia, tachycardia and night sweats of greater than six weeks
      duration responding to anti-TB treatment; (ii) classical miliary pattern
      on chest radiograph;
    explanation: >-
      States the first two of the four diagnostic criteria.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculin anergy is common in miliary TB and has ranged from 35%–74%
      and 20%–70% in various pediatric
    explanation: >-
      Records the high rate of tuberculin anergy, which limits skin testing.
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      TST positivity was seen in 29% (61/210) of the cases.
    explanation: >-
      Only 29% of tested patients had a positive tuberculin skin test.
- name: Chest radiography
  description: >-
    Shows the classical miliary pattern in about half of patients at
    presentation; it can be normal early, so it is repeated during work-up.
  diagnosis_term:
    preferred_term: chest radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      For this reason, if miliary TB is a concern, sequential chest X-ray
      studies should be obtained.
    explanation: >-
      Recommends serial chest radiographs because the pattern can lag.
- name: High-resolution CT of the chest
  description: >-
    HRCT shows randomly distributed miliary nodules and is more sensitive
    than radiography; it can show the pattern when the radiograph is normal.
  diagnosis_term:
    preferred_term: high-resolution CT
    term:
      id: NCIT:C20644
      label: High Resolution Computed Tomography
  evidence:
  - reference: PMID:22771605
    reference_title: "Challenges in the diagnosis & treatment of miliary tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical manifestations are nonspecific, typical chest radiograph
      findings may not be evident till late in the disease, high resolution
      computed tomography (HRCT) shows randomly distributed miliary nodules and
      is relatively more sensitive.
    explanation: >-
      States that HRCT is more sensitive than the chest radiograph.
- name: Dilated fundoscopy for choroid tubercles
  description: >-
    Ophthalmoscopy after mydriasis in every suspected case; choroid tubercles
    are pathognomonic and can give an early diagnosis.
  diagnosis_term:
    preferred_term: ophthalmoscopy
    term:
      id: NCIT:C120698
      label: Ophthalmoscopy
  evidence:
  - reference: PMID:28281441
    reference_title: Miliary Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fundus examination for detecting choroid tubercles offers a valuable
      clinical clue for early diagnosis, as their presence is pathognomonic of
      miliary TB.
    explanation: >-
      Recommends fundoscopy for choroid tubercles.
- name: Mycobacterial culture of multiple specimens
  description: >-
    Sputum or induced sputum, bronchoalveolar lavage, gastric aspirate in
    children, CSF, urine, blood and tissue are cultured, with drug
    susceptibility testing. Yield rises with the number of specimen types;
    smear microscopy is often negative.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:28427368
    reference_title: "Complications of miliary tuberculosis: low mortality and predictive biomarkers from a UK cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Forty patients (77%) had positive cultures for M. tuberculosis (MTB)
      complex. Induced sputa lead to a positive culture in thirty (58%)
      patients. Only ten sputum samples (19%) revealed acid-alcohol fast
      bacilli (AFB) on microscopy.
    explanation: >-
      Culture confirmed 77% of a UK cohort, while sputum smear was positive
      in only 19%.
  - reference: PMID:38848041
    reference_title: The clinical features and prognostic factors of miliary tuberculosis in a high tuberculosis burden area.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Regarding etiological detection, multi-site and multi-type specimens
      should be collected for a timely diagnosis.
    explanation: >-
      Recommends sampling multiple sites and specimen types.
- name: Nucleic acid amplification (Xpert MTB/RIF)
  description: >-
    Xpert MTB/RIF or Ultra on sputum, lavage, CSF, urine and tissue gives a
    rapid diagnosis with rifampicin-resistance detection. In HIV inpatients
    with disseminated tuberculosis, urine Xpert Ultra had the highest yield
    of any single test.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Current evidence suggests that the GeneXpert MTB/RIF assay (Cepheid,
      Sunnyvale, CA) appears to be the promising rapid diagnostic test for
      patients with extrapulmonary TB.
    explanation: >-
      Supports Xpert MTB/RIF as a rapid test for extrapulmonary tuberculosis.
  - reference: PMID:43065709
    reference_title: Relative Diagnostic Yield of Tests for Disseminated Tuberculosis Among Inpatients With Human Immunodeficiency Virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      Diagnostic yield was higher for uXPU (82%) than uLAM (68%), blXPU (30%),
      and TB blood culture (24%).
    explanation: >-
      In 426 HIV inpatients with disseminated tuberculosis, urine Xpert Ultra
      had the highest yield. Disseminated tuberculosis here is defined by
      urine or blood test positivity and is broader than miliary disease.
- name: Urine lipoarabinomannan and urine Xpert in HIV
  description: >-
    In hospitalised people with advanced HIV, urine LAM and urine Xpert
    detect disseminated tuberculosis quickly and identify most patients with
    mycobacteremia, including those who die early. In a Ghanaian
    cluster-randomised trial, offering urine LAM increased tuberculosis
    diagnosis and treatment, but did not shorten time to treatment and only
    half of LAM-positive patients started treatment. No NCIT term for the
    LAM assay was found, so diagnosis_term is omitted.
  evidence:
  - reference: PMID:28883510
    reference_title: "Disseminated tuberculosis among hospitalised HIV patients in South Africa: a common condition that can be rapidly diagnosed using urine-based assays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      In contrast to sputum diagnostics, urine Xpert and
      urine-lipoarabinomannan (LAM) combined identified 88% of TB
      blood-culture-positive patients, including 9/9 who died within 90-days.
    explanation: >-
      Urine tests identified most mycobacteremic HIV inpatients; mycobacteremic
      disseminated tuberculosis overlaps with but is not the same as miliary
      disease.
  - reference: PMID:37233720
    reference_title: "Point-of-Care Urine Lipoarabinomannan Testing to Guide Tuberculosis Treatment Among Severely Ill Inpatients With Human Immunodeficiency Virus in Real-World Practice: A Multicenter Stepped Wedge Cluster-Randomized Trial From Ghana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      The Determine LAM intervention in real-world practice increased TB
      diagnosis and the probability of TB treatment but did not reduce time to
      treatment initiation. Despite high uptake, only half of the LAM-positive
      patients initiated TB treatment.
    explanation: >-
      A trial in HIV inpatients with any tuberculosis shows that urine LAM
      raises diagnosis but not speed of treatment; it is not specific to
      miliary disease.
- name: Bone marrow aspiration and biopsy
  description: >-
    Marrow histology and culture are recommended early, particularly with
    cytopenias, because they are safer than liver or lung biopsy and yield
    granulomas in most patients.
  diagnosis_term:
    preferred_term: bone marrow aspiration and biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although liver biopsy has a high diagnostic rate, as its complications
      are more frequent than bone marrow biopsy, the latter is recommended to
      perform initially.
    explanation: >-
      Recommends marrow biopsy before liver biopsy because it is safer.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bone marrow aspiration and biopsy are valuable in miliary TB,
      particularly when hematological abnormalities are present.
    explanation: >-
      Supports marrow sampling when cytopenias are present.
- name: Liver biopsy
  description: >-
    Needle liver biopsy has the highest granuloma yield, including in
    patients with normal liver tests, but more complications than marrow
    biopsy.
  diagnosis_term:
    preferred_term: liver biopsy
    term:
      id: NCIT:C51677
      label: Liver Biopsy
  evidence:
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although liver function tests were normal and hepatomegaly was not
      present in nearly one-third of the cases, liver biopsy showed granulomas
      in all of 21 patients experienced this procedure.
    explanation: >-
      Liver biopsy showed granulomas in all 21 biopsied patients.
- name: Lumbar puncture
  description: >-
    Done at a low threshold in every patient to detect tuberculous meningitis,
    which changes treatment duration and adds corticosteroids. CSF is
    abnormal in fewer CNS-involved patients than MRI.
  diagnosis_term:
    preferred_term: lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinicians should have a low threshold for performing lumbar puncture to
      document TB meningitis.
    explanation: >-
      Recommends lumbar puncture to look for meningitis.
- name: Brain MRI to screen for CNS involvement
  description: >-
    MRI is more sensitive than CT or CSF examination for CNS involvement and
    finds lesions in most patients even without neurological symptoms;
    routine screening is suggested where MRI is available.
  diagnosis_term:
    preferred_term: brain MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:35488218
    reference_title: Extremely high levels of central nervous system involvement in miliary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Therefore, a routinely screening of CNS TB should be strongly suggested
      in miliary TB and MRI could be used as the initial approach in resources
      rich settings.
    explanation: >-
      Recommends routine CNS screening with MRI.
  - reference: PMID:28427368
    reference_title: "Complications of miliary tuberculosis: low mortality and predictive biomarkers from a UK cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Magnetic resonance imaging (MRI) was more sensitive than computed
      tomography (CT) or lumbar puncture for detecting CNS disease.
    explanation: >-
      MRI outperformed CT and lumbar puncture for CNS disease.
treatments:
- name: Standard Four-Drug Antituberculous Therapy
  description: >-
    Isoniazid, rifampicin, pyrazinamide and ethambutol for two months, then
    isoniazid and rifampicin for four months, for drug-susceptible disease;
    9-12 months when meningitis is present, and longer for bone and joint
    disease. There is no consensus or trial evidence on optimum duration,
    and organ involvement (especially meningitis and pericarditis) is
    assessed before starting. Drug-induced liver injury is common (15-16% in
    two series); an asymptomatic transaminase rise is not by itself a reason
    to stop, but true injury requires stopping the hepatotoxic drugs.
    Rifampicin lowers antiretroviral levels through CYP450 induction, so HIV
    regimens need adjusting.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazide
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Multiorgan Miliary Granuloma Formation
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli in the disseminated tubercles.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      | Intensive phase | RHZE for 2 months | RHZE for 2 months | RHZE for 2
      months |
    explanation: >-
      The guideline table gives two months of rifampicin, isoniazid,
      pyrazinamide and ethambutol as the intensive phase in all three
      guidelines.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Standard 6-month isoniazid, rifampicin, pyrazinamide ethambutol and
      isoniazid, rifampicin (HRZE-HR) regimens apply to isolated pulmonary
      miliary TB, whereas 9-12-month extended therapy plus adjunctive
      dexamethasone is required for CNS complications.
    explanation: >-
      Gives the standard regimen and its extension for CNS disease.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There is no consensus regarding the optimum duration of treatment for
      miliary TB. Careful evaluation of extent of organ system involvement,
      especially, for TBM and TB pericarditis is indicated before the
      initiation of anti-TB treatment as this can influence the therapeutic
      decision.
    explanation: >-
      Records the lack of consensus on duration and the need to assess organ
      involvement first.
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Forty-two patients (16%) developed hepatotoxicity in days 3 to 10 and
      improved within 10 days (median 5–60 days) of discontinuation.
    explanation: >-
      Records the frequency of drug-induced hepatotoxicity.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Asymptomatic rise in hepatic transaminases is common in patients with
      miliary TB and unless definitive evidence of DILI is present
    explanation: >-
      Cautions against stopping therapy for an asymptomatic transaminase rise.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rifampicin, by inducing the hepatic cytochrome P450 pathway, can result
      in dangerously low levels of antiretroviral agents.
    explanation: >-
      Records the rifampicin-antiretroviral interaction.
- name: Adjunctive Corticosteroids for Specific Complications
  description: >-
    Corticosteroids are not routinely recommended for miliary tuberculosis;
    studies of routine use are few and conflicting. They are used for
    specific complications: adrenal insufficiency (an absolute indication),
    tuberculous meningitis, pericarditis, and, with weaker evidence, ARDS,
    IRIS and immune-complex nephritis. In ARDS a small retrospective series
    found better 3-month survival with steroid pulses, while a larger ICU
    cohort could not determine any effect on survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: Miliary Tuberculosis-Associated ARDS
    treatment_effect: INHIBITS
    description: >-
      Steroid pulses damp the inflammatory alveolar injury; the evidence is a
      small retrospective series.
    evidence:
    - reference: PMID:36466135
      reference_title: Efficacy of steroid pulse therapy for miliary tuberculosis complicated by acute respiratory distress syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Six of 8 patients with MTB complicated by ARDS were alive 3 months
        after hospitalization in the steroid pulse therapy group, whereas only
        1 of 5 patients was alive in the non-steroid pulse therapy group.
      explanation: >-
        Better 3-month survival with steroid pulses in 13 retrospective
        patients with miliary-tuberculosis ARDS.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Presence of adrenal insufficiency is an absolute indication for the
      administration adjunctive glucocorticoid treatment.
    explanation: >-
      States the absolute indication for corticosteroids.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sparse published data are available specifically evaluating the role of
      adjunct glucocorticoid treatment in patients with miliary TB and the
      results have been conflicting.
    explanation: >-
      Supports the claim that routine corticosteroid use is unproven.
  - reference: PMID:28151863
    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Steroids are recommended to add when complications such as meningitis,
      pericarditis, ARDS, and adrenal insufficiency associate.
    explanation: >-
      The discussion of a case series restates the complication-specific
      indications.
  - reference: PMID:21740675
    reference_title: "Acute respiratory distress syndrome caused by miliary tuberculosis: a multicentre survey in South Korea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It was difficult to determine the efficacy of systemic corticosteroids on
      patient survival.
    explanation: >-
      In 67 ICU patients with miliary-tuberculosis ARDS the effect of
      corticosteroids on survival could not be determined, supporting the
      statement that benefit in ARDS is unproven.
- name: Intensive Care and Mechanical Ventilation
  description: >-
    Patients with ARDS or multi-organ dysfunction need intensive care,
    mechanical ventilation and sometimes dialysis. Early anti-tuberculous
    treatment and ventilation are associated with survival.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intensive care, assisted mechanical ventilation, dialysis and other
      interventions may be required for the management of patients with
      miliary TB-ARDS and those admitted with MODS
    explanation: >-
      Lists intensive care and ventilation for miliary-tuberculosis ARDS.
  - reference: PMID:22607610
    reference_title: "Predictors and outcome of patients with acute respiratory distress syndrome caused by miliary tuberculosis: a retrospective study in Chongqing, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Accurate diagnosis, early initiation of anti-tuberculosis therapy and
      mechanical ventilation are important for the outcome of patients with
      ARDS caused by miliary TB.
    explanation: >-
      Associates early treatment and ventilation with outcome in 85 patients.
- name: Antiretroviral Therapy in HIV Co-infection
  description: >-
    People with HIV start antiretroviral therapy according to WHO timing
    after antituberculous treatment begins, with regimens chosen for
    rifampicin interactions. IRIS, which can itself present as miliary
    disease with ARDS or AKI, occurs in about a third of co-infected patients
    within weeks of starting antiretrovirals.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiretroviral therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  target_mechanisms:
  - target: Impaired Cell-Mediated Immune Containment
    treatment_effect: RESTORES
    description: >-
      Immune recovery restores cell-mediated containment, at the cost of a
      risk of IRIS.
  evidence:
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      IRIS, reported in about one-third of patients co-infected with HIV and
      TB usually manifests within days to weeks of the initiation of highly
      active antiretroviral therapy (HAART)
    explanation: >-
      Records IRIS as a frequent complication of starting antiretroviral
      therapy.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      should be followed regarding the timing of starting of antiretroviral
      drugs, the choice of drugs and the timing of initiation in relation to
      institution of anti-TB treatment.
    explanation: >-
      Directs antiretroviral timing and choice to WHO guidance.
- name: TNF Antagonist Salvage for Refractory Paradoxical Reactions
  description: >-
    Infliximab, adalimumab or thalidomide have been used as salvage for
    corticosteroid-refractory paradoxical reactions or IRIS. The evidence is
    45 case reports, and neurological sequelae remained common.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-TNF therapy
    term:
      id: NCIT:C15577
      label: Anti-Tumor Necrosis Factor Therapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  evidence:
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These findings suggest that TNF-α antagonists, particularly infliximab,
      are effective salvage options for corticosteroid-refractory PR/IRIS in
      tuberculosis, though neurological sequelae remain common and close
      monitoring is required.
    explanation: >-
      A review of 45 reported cases supports TNF antagonist salvage while
      noting persistent neurological sequelae.
- name: Latent Tuberculosis Screening Before Anti-TNF Therapy
  description: >-
    Screening for and treating latent infection before starting TNF
    inhibitors prevents reactivation, including disseminated disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:11596589
    reference_title: "Tuberculosis associated with infliximab, a tumor necrosis factor alpha-neutralizing agent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Before prescribing the drug, physicians should screen patients for
      latent tuberculosis infection or disease.
    explanation: >-
      Recommends latent-tuberculosis screening before infliximab.
  - reference: PMID:42577908
    reference_title: "Miliary Tuberculosis: A Comprehensive Review of Epidemiology, Clinical Manifestations, Diagnosis, Treatment, and Complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In candidates for anti-TNF therapy, screening and treatment of LTBI
      reduces TB risk by 74–89%.
    explanation: >-
      Quantifies the risk reduction from latent-infection screening and
      treatment.
- name: BCG Vaccination
  description: >-
    Infant BCG vaccination strongly protects children against miliary and
    meningeal tuberculosis and is cost-effective in high-incidence countries.
    It does not work in people already infected and must not be given to
    immunosuppressed people, in whom the live vaccine can itself disseminate.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: BCG vaccine
      term:
        id: NCIT:C298
        label: BCG Vaccine
  evidence:
  - reference: PMID:24336911
    reference_title: "Protection by BCG vaccine against tuberculosis: a systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Protection against meningeal and miliary tuberculosis was also high in
      infants (RR, 0.1; 95% CI, .01-.77) and children stringently tuberculin
      tested (RR, 0.08; 95% CI, .03-.25).
    explanation: >-
      A meta-analysis of randomised trials finds strong protection against
      miliary and meningeal tuberculosis in infants.
  - reference: PMID:16616560
    reference_title: "Effect of BCG vaccination on childhood tuberculous meningitis and miliary tuberculosis worldwide: a meta-analysis and assessment of cost-effectiveness."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We estimated that the 100.5 million BCG vaccinations given to infants in
      2002 will have prevented 29,729 cases of tuberculous meningitis
      (5th-95th centiles, 24,063-36,192) in children during their first 5
      years of life, or one case for every 3435 vaccinations (2771-4177), and
      11,486 cases of miliary tuberculosis (7304-16,280), or one case for
      every 9314 vaccinations (6172-13,729).
    explanation: >-
      A modelling study estimates the miliary cases prevented by infant BCG.
  - reference: PMID:31723681
    reference_title: "Miliary tuberculosis: A new look at an old foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, BCG vaccine is not effective in individuals who have LTBI and
      should not be administered to immunosuppressed persons.
    explanation: >-
      Records the limits and contraindication of BCG.

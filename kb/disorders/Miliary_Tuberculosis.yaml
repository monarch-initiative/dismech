    reference_title: "Miliary tuberculosis: Epidemiologicaland clinical analysis of large-case series from moderate to low tuberculosis endemic Country."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

discussions:
- discussion_id: meds2_epilepsy_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does YIPF5 loss cause epilepsy? Is it a consequence of the cortical
    malformation, a cell-autonomous neuronal trafficking defect, or ER stress in
    mature neurons?
  attaches_to:
  - phenotypes#Epilepsy
  - pathophysiology#Disrupted Cerebral Cortex Development
  rationale: >-
    Epilepsy is present in every reported patient, but the beta-cell arm is the
    only one with a mechanistic study in human cells. The rabbit and mouse models
    report head size, progenitor and migration phenotypes and do not report
    seizures, so the edge to epilepsy in this entry is inferred.
  status: OPEN
  evidence:
  - reference: PMID:41717013
    reference_title: "The microcephaly-associated protein YIPF5 differentially regulates ER export."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We describe changes in secretome and surfaceome composition and a Ca2+ imbalance in the ER in YIPF5 KO-cells, but which of these changes contribute to the microcephaly phenotype remains to be shown."
    explanation: >-
      Even for microcephaly the responsible cargo or change is unresolved; the
      route to epilepsy is further still from the data.
- discussion_id: meds2_genotype_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does residual YIPF5 function explain the spread from death in infancy to
    normal neuromotor development and from permanent diabetes to transient,
    illness-triggered hyperglycemia?
  attaches_to:
  - phenotypes#Illness-triggered transient hyperglycemia
  - phenotypes#Severe global developmental delay
  - genetic#YIPF5
  rationale: >-
    The mildest patient carries a missense that half the in silico tools call
    tolerated, and the hypomorphic p.(Ile98Ser) sisters were diagnosed later and
    kept C-peptide. The 2024 transient case suggests a further mild end. Seven
    genotyped patients and no allele-by-allele functional comparison are not
    enough to test this.
  status: OPEN
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "however, our cohort of patients with homozygous YIPF5 mutations is currently too small to allow accurate estimation of any genotype-phenotype relationship."
    explanation: >-
      The discovery authors state the gap directly.
- discussion_id: meds2_beta_cell_er_stress_relief
  kind: KNOWLEDGE_GAP
  prompt: >-
    Would lowering insulin secretory demand, for example with an insulin
    sensitiser such as pioglitazone, relieve beta-cell ER stress and preserve
    residual beta-cell function in MEDS2?
  attaches_to:
  - pathophysiology#Beta-Cell ER Stress
  - treatments#Insulin replacement therapy
  rationale: >-
    The beta-cell arm is driven by proinsulin load in the ER, so reducing demand
    is a mechanistically motivated hypothesis. It was proposed in the commentary
    on the discovery paper and has not been tested in cells, animals or patients.
    The commentators also note it would not address the brain manifestations.
  status: OPEN
  evidence:
  - reference: PMID:33164987
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly: progress for precision medicine and mechanistic understanding."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Based on the observed pathophysiology associated with YIPF5 mutations, we hypothesize that an insulin sensitizer such as pioglitazone might improve glycemic control while decreasing the demand for insulin secretion, thereby alleviating ER stress and potentially improving β cell health."
    explanation: >-
      The hypothesis as stated by the commentators; it is a proposal, not a
      result.
external_assertions:
- name: OMIM MEDS2 entry
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:619278
  url: https://omim.org/entry/619278
  description: >-
    OMIM phenotype entry for microcephaly, epilepsy, and diabetes syndrome 2.
    Recorded as an identifier only; not quoted as evidence.
notes: >-
  No GeneReviews chapter covers MEDS2 or YIPF5 (PubMed search "YIPF5 AND
  genereviews[book]" returned 0 records). Orphanet's ORPHA:306558 (primary
  microcephaly-epilepsy-permanent neonatal diabetes syndrome) spans both MEDS1 and
  MEDS2, so its prevalence class and clinical description are not used as
  MEDS2-specific facts. The 2026 iScience paper (PMID:41717013) cites OMIM 614231
  for MEDS2 in its introduction; 614231 is the MEDS1 (IER3IP1) number, and the
  MEDS2 OMIM number is 619278. The same paper calls MEDS2 a fatal disorder of
  early childhood, which the discovery series does not support, so that
  characterisation is not carried into this entry.

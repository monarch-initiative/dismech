inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients are homozygous for a YIPF5 variant, and every parent
    tested was an unaffected heterozygous carrier. The two index probands were
    born to first-cousin parents; the text of the discovery paper does not state
    consanguinity for the three replication families.
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for the mutations in parental samples confirmed that the unaffected parents were heterozygous for the mutations."
    explanation: >-
      Unaffected heterozygous parents of homozygous probands (families I and II)
      is the recessive segregation pattern.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for the mutations in family members confirmed that the parents were all heterozygous for the mutations and that patient III’s affected sister was also homozygous for the p.(Ile98Ser) variant"
    explanation: >-
      The same pattern in the three replication families, including
      cosegregation in an affected sibling pair.
prevalence:
- population: Published MEDS2 literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six genetically confirmed patients from five families in the 2020 discovery
    series, plus one further patient with a novel homozygous missense variant
    reported in 2024. Four affected siblings of one proband died in infancy with
    the same clinical triad but were never genotyped and are not counted.
    Orphanet's prevalence class for ORPHA:306558 covers a broader entry that
    also includes MEDS1, so it is not recorded here as a MEDS2 figure.
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 6 patients from 5 families with homozygous mutations in the YIPF5 gene, which is involved in trafficking between the endoplasmic reticulum (ER) and the Golgi."
    explanation: >-
      The founding case count.
  - reference: PMID:38632213
    reference_title: "Illness stress-induced transient hyperglycemia in a patient with a novel YIPF5 homozygous missense variant: expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we describe a patient with a newly reported variant in the YIPF5 gene, who presented with short events of severe hyperglycemia, induced by the stress of common illnesses, which completely resolved after recovery."
    explanation: >-
      One additional published patient after the discovery series.
progression:
- phase: Neonatal to infantile onset with variable course
  notes: >-
    Diabetes is diagnosed from 4 weeks to 20 months and epilepsy from 1 to 7
    months. The course then diverges: patient II died at 1.3 years and four
    ungenotyped siblings with the same triad died in infancy, while the two
    p.(Ile98Ser) sisters were alive more than ten years after diagnosis and
    patient I had normal neuromotor development at five years with epilepsy
    resolved by two. Mortality is recorded here rather than as a phenotype,
    following the repository convention that death-age HPO terms sit outside the
    PhenotypeTerm enum.
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient II died at the age of 1.3 years. There was a family history of 4 siblings (2 female and 2 male) diagnosed with neonatal diabetes, epilepsy, and microcephaly who had died in infancy. DNA was not available for these individuals."
    explanation: >-
      One genotyped death and four ungenotyped infant deaths in the same family.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease severity was variable between families, with 5 affected individuals in family II dying in early infancy (the homozygous YIPF5 mutation could be confirmed only in the proband, as DNA was not available from siblings), while patient I is reported to have normal neuromotor development at the age of 5 years and his epilepsy resolved at the age of 2 years."
    explanation: >-
      States the between-family variability in course and outcome.
pathophysiology:
- name: YIPF5 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic YIPF5 variants (four missense and one single-residue in-frame
    deletion in the discovery series) at residues conserved to yeast. Three fall
    in the cytoplasmic domain and two in the third and fourth transmembrane
    domains. The authors interpret them as at least partial loss of function; the
    patient p.(Ile98Ser) allele behaves as a hypomorph in stem-cell models, and
    complete knockout gives the most severe cellular phenotype.
  genes:
  - preferred_term: YIPF5
    term:
      id: hgnc:24877
      label: YIPF5
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nature and position of the variants are consistent with at least a partial loss of protein function."
    explanation: >-
      The authors' reading of the five patient variants as (partial)
      loss-of-function alleles.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, our results demonstrate that the p.(Ile98Ser) YIPF5 mutation does not compromise differentiation and function of β cells but affects cell survival by sensitizing them to ER stress–induced apoptosis."
    explanation: >-
      A patient allele tested in isogenic and patient-derived stem cells is
      hypomorphic rather than null, supporting partial loss of function.
  downstream:
  - target: Proinsulin Retention in the Beta-Cell ER
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33164986

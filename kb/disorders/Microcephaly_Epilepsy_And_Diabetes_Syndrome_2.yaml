diagnosis:
- name: Molecular genetic testing for YIPF5
  description: >-
    Diagnosis is molecular: biallelic YIPF5 variants. In the discovery series
    YIPF5 was found by genome sequencing after known neonatal diabetes genes had
    been excluded, and then by targeted next-generation sequencing of unsolved
    cases diagnosed with diabetes before 12 months. The triad of severe
    microcephaly, infantile epilepsy and diabetes in the first two years should
    prompt testing of YIPF5 alongside IER3IP1 and TMEM167A. No imaging, EEG or
    biochemical finding is specific to MEDS2.
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome sequencing was performed for 2 unrelated probands diagnosed with neonatal diabetes, epilepsy, and severe microcephaly (patients I and II in Table 1 and Figure 1A) in whom mutations in known neonatal diabetes genes had been excluded."
    explanation: >-
      The diagnostic route by which the disease was found.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we analyzed the coding regions and exon-intron boundaries of the YIPF5 gene in a further 187 cases diagnosed with diabetes before the age of 12 months (10 also had microcephaly) who did not have a mutation in known monogenic diabetes genes."
    explanation: >-
      Sequencing YIPF5 in unsolved early-onset diabetes found three more
      families (3 of 187, a selected-cohort yield, not a prevalence).
differential_diagnoses:
- name: Microcephaly, epilepsy, and diabetes syndrome 1 (IER3IP1)
  description: >-
    MEDS1 has the same triad and similar cell biology: IER3IP1 is an ER-to-Golgi
    trafficking protein whose loss also impairs proinsulin export from the ER of
    stem cell-derived beta cells. It is separated from MEDS2 genetically.
  disease_term:
    preferred_term: microcephaly, epilepsy, and diabetes syndrome 1
    term:
      id: MONDO:0031481
      label: microcephaly, epilepsy, and diabetes syndrome 1
  distinguishing_features:
  - >-
    Biallelic IER3IP1 rather than YIPF5 variants. MEDS1 descriptions emphasise a
    simplified gyral pattern and an infantile epileptic encephalopathy, which
    have not been reported for MEDS2, but too few MEDS2 patients have published
    imaging for that to be a reliable clinical discriminator.
  evidence:
  - reference: PMID:24138066
    reference_title: "Microcephaly, epilepsy, and neonatal diabetes due to compound heterozygous mutations in IER3IP1: insights into the natural history of a rare disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A syndrome of permanent neonatal diabetes along with primary microcephaly with simplified gyral pattern associated with severe infantile epileptic encephalopathy was recently described in two independent reports in which disease-causing homozygous mutations were identified in the immediate early response-3 interacting protein-1 (IER3IP1) gene."
    explanation: >-
      Defines MEDS1 and its IER3IP1 etiology.
  - reference: PMID:39441964
    reference_title: "IER3IP1 Mutations Cause Neonatal Diabetes Due to Impaired Proinsulin Trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of IER3IP1 resulted in a threefold reduction in endoplasmic reticulum-to-Golgi trafficking of proinsulin in stem cell-derived β-cells, leading to β-cell dysfunction both in vitro and in vivo."
    explanation: >-
      MEDS1 shares the proinsulin ER-export mechanism, so mechanism does not
      separate it from MEDS2.
- name: TMEM167A-related microcephaly, epilepsy, and diabetes syndrome
  description: >-
    A third genetic cause of MEDS, reported in 2025 in six individuals. TMEM167A
    is also an ER-to-Golgi pathway protein, and a patient variant impairs
    proinsulin trafficking to the Golgi and sensitises beta cells to ER stress.
    No MONDO term was found for it at the time of curation, so it carries no
    disease_term here.
  distinguishing_features:
  - >-
    Biallelic TMEM167A variants. In the first series all six patients had
    neonatal diabetes before six months and severe microcephaly but only five
    had epilepsy.
  evidence:
  - reference: PMID:40924476
    reference_title: "Recessive TMEM167A variants cause neonatal diabetes, microcephaly, and epilepsy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly, epilepsy, and diabetes syndrome (MEDS) is a congenital disorder with two known etiological genes, IER3IP1 and YIPF5."
    explanation: >-
      Places YIPF5 among the genetically heterogeneous causes of MEDS.
  - reference: PMID:40924476
    reference_title: "Recessive TMEM167A variants cause neonatal diabetes, microcephaly, and epilepsy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All had neonatal diabetes (diagnosed at <6 months) and severe microcephaly, and 5 also had epilepsy."
    explanation: >-
      The overlapping phenotype that makes TMEM167A a genetic differential.

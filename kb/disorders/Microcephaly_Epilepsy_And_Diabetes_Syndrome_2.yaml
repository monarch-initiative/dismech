- name: Cortical Neuron ER Stress
  biological_scale: CELLULAR
  description: >-
    In the developing cortex of p.(Trp218Arg) knock-in rabbits, altered YIPF5
    function in cortical neurons is associated with ER stress and an unfolded
    protein response, and with interference in the generation of apical
    progenitors, the first progenitor population of the developing cortex. This
    is the cortical counterpart of the beta-cell ER stress arm, demonstrated in
    an animal carrying a patient allele.
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976

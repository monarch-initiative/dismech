    snippet: "However, ESCp.(Ile98Ser)-derived islet-like aggregates showed a significant decrease in human C-peptide levels associated with increased proinsulin accumulation and signs of ER stress after implantation, demonstrating the evolution of cellular pathology with further maturation of the stem cell–derived β cells."
    explanation: >-
      For the patient allele, ER stress develops as beta cells mature in vivo,
      consistent with diabetes onset after birth in those patients.
  downstream:

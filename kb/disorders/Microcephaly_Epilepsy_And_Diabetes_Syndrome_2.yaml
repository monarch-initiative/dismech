- name: Dysregulated Cargo-Selective ER Export
  biological_scale: CELLULAR
  description: >-
    YIPF5 binds the ER export receptor SURF4 and regulates the export of a
    subset of cargoes rather than ER export as a whole. In knockout cells, SURF4
    cargoes and KDEL-bearing ER chaperones are secreted more, while several
    neuronal adhesion and migration proteins reach the cell surface less. Knockout
    cells also have lower ER calcium. Most of this was measured in non-neuronal
    MCF10A and HeLa cells.
  biological_processes:
  - preferred_term: ER-to-Golgi export of selected cargoes
    modifier: DYSREGULATED

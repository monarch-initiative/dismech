  description: >-
    All six patients in the discovery series were treated with full replacement
    doses of insulin. There is no MEDS2-specific trial or dosing evidence. The
    single 2024 patient with transient, illness-triggered hyperglycemia shows that
    insulin need can be episodic, so treatment should follow measured glycaemia.

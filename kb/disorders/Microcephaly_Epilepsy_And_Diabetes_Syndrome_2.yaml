    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A 15-fold increase was detected in the number of cells with high BiP immunoreactivity (INS+BiPhi) in the KO (Figure 4, B and D; and Supplemental Figure 6B), likely reflecting ER stress response triggered by proinsulin retention in the ER."
    explanation: >-

name: Microcephaly, Epilepsy, and Diabetes Syndrome 2
creation_date: "2026-10-09T20:30:00Z"
description: >-
  Microcephaly, epilepsy, and diabetes syndrome 2 (MEDS2) is an autosomal
  recessive disorder caused by biallelic variants in YIPF5, which encodes a small
  multi-pass membrane protein of the endoplasmic reticulum (ER) and early
  secretory pathway that takes part in ER-to-Golgi export. The defining triad is
  severe microcephaly, epilepsy beginning in the first months of life, and
  insulin-requiring diabetes diagnosed between the neonatal period and early
  infancy, usually with low birth weight and severe developmental delay. The
  disease was defined in 2020 from six genetically confirmed patients in five
  families; severity varied, from death at 1.3 years in one family
  to normal neuromotor development at five years in another. In human beta-cell
  models, loss of YIPF5 traps proinsulin in the ER, causing ER distension, an ER
  stress response and increased susceptibility to ER stress-induced apoptosis,
  which is the experimentally supported route to diabetes. The brain mechanism is
  less settled: model studies implicate cargo-selective ER export defects,
  premature cortical neuron migration and ER stress in cortical progenitors, but
  none of these has been shown in patient brain. MEDS2 is one of three genetic
  causes of the MEDS phenotype, alongside IER3IP1 (MEDS1) and TMEM167A, all of
  which encode ER-to-Golgi trafficking proteins.

        80% reduction in knockout beta cells.
      evidence:
      - reference: PMID:33164986
        reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Stem cell–derived β cells of all 3 lines showed glucose-stimulated insulin secretion, but the absolute amount of secreted insulin was 50% lower in the KO cells (Figure 4F), and cellular insulin content was reduced by 80% (Figure 4G)."
        explanation: >-
          The quantified readout.
- name: Patient p.(Ile98Ser) iPSC-derived beta cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSCs reprogrammed from the PBMCs of the two affected sisters homozygous for
    p.(Ile98Ser), differentiated to islet cells and compared with healthy and
    CRISPR-corrected isogenic controls.
  modeled_mechanisms:
  - target: Increased Susceptibility to ER Stress-Induced Beta-Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient beta cells are less viable and more prone to ER stress-induced
      apoptosis than corrected controls, with DP5 and PUMA induction.
    limitations: >-
      One variant in one family; differentiation and insulin content were
      normal, so the model reproduces the survival defect but not the
      proinsulin-retention defect of the knockout.
    evidence:
    - reference: PMID:33164986
      reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, our results demonstrate that the p.(Ile98Ser) YIPF5 mutation does not compromise differentiation and function of β cells but affects cell survival by sensitizing them to ER stress–induced apoptosis."
      explanation: >-
        The patient-genotype result, with isogenic correction as control.
  - target: Proinsulin Retention in the Beta-Cell ER
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Patient iPSC beta cells did not show altered proinsulin or insulin content
      in vitro.
    limitations: >-
      Proinsulin retention and ER stress appeared with the same allele only after
      grafts matured in vivo, so the negative in vitro result may reflect
      immaturity rather than absence of the mechanism.
    evidence:
    - reference: PMID:33164986
      reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The p.(Ile98Ser) mutation did not affect proinsulin and insulin content (Supplemental Figure 12, A and B) nor glucose- and/or forskolin-stimulated insulin secretion (Supplemental Figure 12C)."
      explanation: >-
        The negative result stated directly.
- name: YIPF5-knockout MCF10A cells and YIPF5-knockdown rat hippocampal neurons
  experimental_model_type: OTHER
  description: >-
    MCF10A human mammary epithelial cells with YIPF5 knocked out, used for
    secretome and surfaceome proteomics and ER calcium imaging, together with
    primary rat hippocampal neurons transfected with YIPF5 shRNA and a
    RUSH-based L1CAM reporter.
  modeled_mechanisms:
  - target: Dysregulated Cargo-Selective ER Export
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Knockout cells show cargo-selective changes in secretion and surface
      delivery.
    limitations: >-
      The proteomic screens used non-neuronal cells, and no patient-derived
      neural cells were tested.
    evidence:
    - reference: PMID:41717013
      reference_title: "The microcephaly-associated protein YIPF5 differentially regulates ER export."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We describe changes in secretome and surfaceome composition and a Ca2+ imbalance in the ER in YIPF5 KO-cells, but which of these changes contribute to the microcephaly phenotype remains to be shown."
      explanation: >-
        The authors' own statement of what the model shows and does not show.
  - target: Impaired Neuritic Delivery of Neuronal Adhesion Molecules
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      In cultured rat neurons, YIPF5 knockdown retains L1CAM in the soma.
    limitations: >-
      Rodent neurons with acute knockdown and an overexpressed reporter cargo.
    evidence:
    - reference: PMID:41717013
      reference_title: "The microcephaly-associated protein YIPF5 differentially regulates ER export."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In shLuciferase-expressing neurons, L1CAM localized predominantly to neurites, whereas in shYIPF5-transfected neurons, L1CAM accumulated in the soma in an ER-like pattern, indicative of a trafficking defect."
      explanation: >-
        The neuronal readout.
animal_models:
- name: YIPF5 p.W218R knock-in rabbit
  species: Rabbit
  genotype: YIPF5 p.(Trp218Arg) introduced by SpRY-ABEmax base editing
  publication: PMID:37142085
  description: >-
    A genome-edited rabbit carrying the patient p.(Trp218Arg) allele. It
    reproduces reduced head circumference, stunted growth, motor abnormalities
    and reduced survival. The abstract does not report on diabetes or seizures.
  modeled_mechanisms:
  - target: Cortical Neuron ER Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      ER stress in cortical neurons and impaired apical progenitor generation
      in the developing cortex.
    limitations: >-
      The authors describe the ER stress-microcephaly relationship as a
      correlation; whether ER stress causes the progenitor deficit was not tested
      by rescue.
    evidence:
    - reference: PMID:37142085
      reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, these YIPF5-mutant rabbits support a correlation between unfolded protein responses (UPR) induced by endoplasmic reticulum stress (ERS), and the development of PMCPH"
      explanation: >-
        The rabbit links ER stress to the microcephaly.
  - target: Severe microcephaly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reduced head circumference in rabbits carrying a patient allele.
    limitations: >-
      Only the brain arm of the syndrome is reported in the abstract; diabetes
      and epilepsy were not described.
    readouts:
    - name: Head circumference
      target: Severe microcephaly
      direction: DECREASED
      interpretation: >-
        Reduced compared with wild-type controls.
      evidence:
      - reference: PMID:37142085
        reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Compared with wild-type controls, the mutant rabbits exhibited stunted growth, reduced head circumference, altered motor ability, and decreased survival rates."
        explanation: >-
          The measured head-size readout.
    evidence:
    - reference: PMID:37142085
      reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we constructed a rabbit PMCPH model harboring YIPF5 (p.W218R) mutation using SpRY-ABEmax mediated base substitution, which precisely recapitulated the typical symptoms of human PMCPH."
      explanation: >-
        The authors present the model as recapitulating human microcephaly.
- name: Embryonic mouse cortex with in utero Yipf5 knockdown
  species: Mouse
  genotype: Yipf5 shRNA delivered by in utero electroporation at E13.5
  publication: PMID:41717013
  description: >-
    Acute, local knockdown of Yipf5 in neural progenitors of the lateral cortex,
    analysed at E15.5.
  modeled_mechanisms:
  - target: Premature Cortical Neuron Migration
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown shifts electroporated cells from the ventricular and
      subventricular zones into the cortical plate and alters neuronal
      morphology.
    limitations: >-
      A two-day, local knockdown in mouse rather than a germline patient allele;
      head size and postnatal outcomes were not assessed.
    evidence:
    - reference: PMID:41717013
      reference_title: "The microcephaly-associated protein YIPF5 differentially regulates ER export."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In utero knockdown of Yipf5 in embryonic mouse brains induces premature neuronal migration and abnormal neuronal morphology."
      explanation: >-
        The in vivo migration phenotype.
- name: Immunodeficient mice carrying YIPF5-knockout human islet-like grafts
  species: Mouse
  genotype: NOD/SCID-gamma host with kidney-capsule grafts of YIPF5-knockout or p.(Ile98Ser) hESC-derived islet-like cells
  publication: PMID:33164986

  evidence:
  - reference: PMID:37142085
    reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, these YIPF5-mutant rabbits support a correlation between unfolded protein responses (UPR) induced by endoplasmic reticulum stress (ERS), and the development of PMCPH"
    explanation: >-
      The rabbit study links ER stress and the UPR to the microcephaly; the
      authors call it a correlation, not a demonstrated cause.
  downstream:
  - target: Disrupted Cerebral Cortex Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37142085
      reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further investigation based on model rabbit elucidated that altered YIPF5 function in cortical neurons could lead to endoplasmic reticulum stress and neurodevelopmental disorders, interference of the generation of apical progenitors (APs), the first generation of progenitors in the developing cortex."
      explanation: >-
        Connects ER stress to impaired generation of apical progenitors in the
        developing cortex.
- name: Disrupted Cerebral Cortex Development
  biological_scale: TISSUE
  description: >-
    YIPF5 is broadly expressed in the developing human cortex, in both the
    ventricular-zone progenitor and the neuronal compartments, most strikingly at
    12 gestational weeks. Two model routes converge on disturbed cortical
    development: premature neuronal migration (mouse knockdown) and ER stress
    with reduced apical progenitor generation (rabbit knock-in). Neither has been
    examined in patient brain tissue.
  biological_processes:
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression was found in both progenitor (ventricular zone) and neuronal (intermediate zone and cortical plate) compartments."
    explanation: >-
      In situ hybridisation of human fetal brain places YIPF5 in the cell
      populations that build the cortex.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is consistent with YIPF5 playing a role in neural progenitors and/or neurons during development of the cerebral cortex, which is mostly affected by primary microcephaly."
    explanation: >-
      The authors' interpretation of the expression pattern, stated as
      consistency rather than proof.
  downstream:
  - target: Severe microcephaly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37142085
      reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Compared with wild-type controls, the mutant rabbits exhibited stunted growth, reduced head circumference, altered motor ability, and decreased survival rates."
      explanation: >-
        A patient allele knocked into rabbits reproduces the reduced head size,
        tying the cortical developmental defect to microcephaly in a model.
  - target: Epilepsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred. Epilepsy accompanies the microcephaly in every reported patient,
      but no study has examined how YIPF5 loss produces seizures, and no model
      has reported a seizure phenotype.
  - target: Severe global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from the shared neurodevelopmental origin; not studied
      mechanistically.

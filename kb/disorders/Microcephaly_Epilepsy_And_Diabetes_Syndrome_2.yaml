- name: Beta-Cell ER Stress
  biological_scale: CELLULAR
  description: >-
    Proinsulin accumulation distends the ER and activates the ER stress response
    (BiP and HYOU1 induction in knockout cells; in knockdown cells exposed to
    stressors, PERK- and ATF6-dependent markers rose more than the IRE1 target
    sXBP1). The p.(Ile98Ser) allele gives little basal ER stress but an
    exaggerated response to applied stressors, and ER stress emerged in
    p.(Ile98Ser) islet grafts only after maturation in vivo.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of YIPF5 function in stem cell-derived islet cells resulted in proinsulin retention in the ER, marked ER stress, and β cell failure."
      explanation: >-
        Loss of YIPF5 is directly shown to cause proinsulin retention in the ER
        of stem cell-derived beta cells.
  - target: Dysregulated Cargo-Selective ER Export
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41717013
      reference_title: "The microcephaly-associated protein YIPF5 differentially regulates ER export."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate that YIPF5 is involved in ER export of a subset of proteins, including cargoes of the ER export receptor SURF4, with which it directly interacts."
      explanation: >-
        YIPF5 knockout and knockdown cells show altered ER export of a subset of
        cargoes, linking the gene to a selective export defect.
  - target: Cortical Neuron ER Stress
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37142085
      reference_title: "YIPF5 (p.W218R) mutation induced primary microcephaly in rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further investigation based on model rabbit elucidated that altered YIPF5 function in cortical neurons could lead to endoplasmic reticulum stress and neurodevelopmental disorders, interference of the generation of apical progenitors (APs), the first generation of progenitors in the developing cortex."
      explanation: >-
        In rabbits carrying the patient p.(Trp218Arg) allele, altered YIPF5
        function is linked to ER stress in the developing cortex.
- name: Proinsulin Retention in the Beta-Cell ER
  biological_scale: CELLULAR
  description: >-
    Without YIPF5, proinsulin fails to leave the ER of beta cells. In
    hESC-derived YIPF5-knockout beta cells the proinsulin-stained area was 5.5-fold
    higher and the insulin-stained area 70% lower than in wild-type cells, and the
    retained proinsulin colocalised with ER chaperones. Knockout alpha cells did
    not show the same ER abnormality, which the authors read as a beta-cell
    selective requirement for YIPF5 in proinsulin export.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: ER-to-Golgi transport of proinsulin
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The percentage of cytoplasmic area stained for proinsulin per β cell of the KO was 5.5-fold higher than in their WT counterparts, while the percentage of insulin area was 70% less in the KO β cells"
    explanation: >-
      Quantifies proinsulin accumulation at the expense of mature insulin in
      YIPF5-knockout stem cell-derived beta cells.
  - reference: PMID:33164986
    reference_title: "YIPF5 mutations cause neonatal diabetes and microcephaly through endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the ER in YIPF5-KO α cells was not affected, suggesting that YIPF5 is specifically essential for proinsulin trafficking from the ER in β cells."
    explanation: >-
      Places the export defect specifically in beta cells and names proinsulin
      as the affected cargo.

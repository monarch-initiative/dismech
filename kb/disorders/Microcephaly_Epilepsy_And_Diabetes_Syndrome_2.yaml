- name: Beta-Cell Insulin Deficiency
  biological_scale: TISSUE
  description: >-
    The net result in the beta-cell compartment is too little insulin.
    hESC-derived knockout beta cells had 80% less insulin content and secreted
    half as much insulin; transplanted knockout grafts produced barely detectable
    human C-peptide and were dominated by glucagon-positive cells. The patient
    p.(Ile98Ser) allele retains some function: the two sisters carrying it were
    diagnosed later in infancy and still had low but measurable C-peptide more
    than ten years after diagnosis.

- name: Increased Susceptibility to ER Stress-Induced Beta-Cell Apoptosis
  biological_scale: CELLULAR
  description: >-
    YIPF5 deficiency does not much change basal beta-cell survival but sharply
    sensitises beta cells to apoptosis when ER stress is applied (thapsigargin,
    tunicamycin, brefeldin A), with induction of the pro-apoptotic BH3-only
    proteins DP5 and PUMA. This was seen with partial knockdown in EndoC-betaH1
    cells and with the patient p.(Ile98Ser) allele in iPSC- and hESC-derived beta
    cells. Whether beta-cell loss in patients follows the same course in vivo has
    not been examined.
  cell_types:
  - preferred_term: pancreatic beta cell

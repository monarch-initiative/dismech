name: PBX1-Related Syndromic CAKUT
creation_date: "2026-11-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital anomalies of kidney and urinary tract syndrome with or without hearing loss, abnormal ears, or developmental delay
  term:
    id: MONDO:0060549
    label: congenital anomalies of kidney and urinary tract syndrome with or without hearing loss, abnormal ears, or developmental delay
synonyms:
- CAKUTHED
- PBX1-related syndrome
- PBX1 haploinsufficiency syndromic CAKUT
description: >-
  An autosomal dominant, highly pleiotropic developmental disorder (CAKUTHED;
  OMIM 617641) caused by heterozygous loss of function of PBX1, a TALE-class
  homeodomain transcription factor that acts in multimeric complexes with HOX
  and other TALE proteins. PBX1 haploinsufficiency - from 1q23.3 microdeletions,
  truncating variants, or deleterious missense variants that impair PBX-dependent
  transactivation or nuclear localization - disrupts PBX1/HOX transcriptional
  programs in developing mesenchyme. The core feature is congenital anomalies of
  the kidney and urinary tract (most often bilateral renal hypoplasia), with
  variable extrarenal involvement: developmental delay, external-ear anomalies
  and hearing loss, facial dysmorphism, 46,XY differences of sex development and
  cryptorchidism, congenital heart defects, and diaphragmatic eventration.
  Severity ranges from perinatal lethality to mild renal hypoplasia recognized
  only in adulthood. Most cases are de novo; parental (including gonadal)
  mosaicism is documented and raises recurrence risk.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PBX1 loss of function, usually de novo. Parental somatic/gonadal
    mosaicism is documented and carries a non-trivial recurrence risk.
  evidence:
  - reference: PMID:32141698
    reference_title: "Paternal mosaicism for a novel PBX1 mutation associated with recurrent perinatal death: Phenotypic expansion of the PBX1-related syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant (de novo) mutations in PBX1 are known to cause congenital abnormalities of the kidney and urinary tract (CAKUT), with or without extra-renal abnormalities."
    explanation: Establishes autosomal dominant, usually de novo, inheritance.
genetic:
- name: PBX1 variants
  gene_term:
    preferred_term: PBX1
    term:
      id: hgnc:8632
      label: PBX1
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous PBX1 loss of function via 1q23.3 microdeletions, truncating
    variants, or deleterious missense variants. A 276-kb minimal common deletion
    region overlaps only PBX1. Missense variants act by reducing protein,
    impairing nuclear localization, or perturbing PBX-dependent transactivation.
    Most variants are de novo; parental mosaicism (blood and sperm) is documented.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_28186515-9751-4137-a631-5addc51461b9-2025-11-23T170000.000Z
    evidence:
    - reference: CGGV:assertion_28186515-9751-4137-a631-5addc51461b9-2025-11-23T170000.000Z
      reference_title: "PBX1 / congenital anomalies of kidney and urinary tract syndrome with or without hearing loss, abnormal ears, or developmental delay (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PBX1 | HGNC:8632 | congenital anomalies of kidney and urinary tract syndrome with or without hearing loss, abnormal ears, or developmental delay | MONDO:0060549 | AD | Definitive | SOP11 | Syndromic Disorders Gene Curation Expert Panel | 2025-11-23T17:00:00.000Z"
      explanation: ClinGen classifies the PBX1-CAKUTHED relationship as Definitive (AD).
  variants:
  - name: 1q23.3q24.1 microdeletion (276-kb minimal region, PBX1)
    description: Recurrent CNV deleting PBX1; 276-kb minimal common region overlaps only PBX1.
    clinical_significance: PATHOGENIC
  - name: c.551G>C p.(Arg184Pro)
    description: De novo missense adjacent to the homeodomain; reduces PBX1 protein; tetralogy of Fallot and multi-organ anomalies (modelled in mouse).
    clinical_significance: PATHOGENIC
  - name: p.(Arg107Trp)
    description: Paternal-mosaic missense; recurrent perinatal death with 46,XY sex reversal and diaphragmatic eventration.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:29036646
    reference_title: "De novo, deleterious sequence variants that alter the transcriptional activity of the homeoprotein PBX1 are associated with intellectual disability and pleiotropic developmental defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present eight patients with de novo, deleterious sequence variants in the PBX1 gene."
    explanation: De novo PBX1 sequence variants cause the disorder.
  - reference: PMID:28270404
    reference_title: "PBX1 haploinsufficiency leads to syndromic congenital anomalies of the kidney and urinary tract (CAKUT) in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We defined a 276-kb minimal common region (MCR) that only overlaps with the PBX1 gene. All eight patients presented with syndromic CAKUT."
    explanation: Deletion mapping defines PBX1 as the culprit gene for syndromic CAKUT.
pathophysiology:
- name: PBX1 Haploinsufficiency
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Heterozygous PBX1 deletion, truncation, or deleterious missense reduces
    functional nuclear PBX1, a TALE homeodomain transcription factor that acts in
    multimeric complexes with HOX and other TALE proteins to regulate
    developmental transcription. Missense variants reduce protein, impair nuclear
    localization, or perturb PBX-dependent transactivation.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:
  - target: Impaired Metanephric Mesenchymal Function
    description: Loss of PBX1/HOX transcriptional programs impairs renal mesenchyme.
  - target: Impaired Urogenital Ridge Development
    description: PBX1 loss reduces urogenital ridge outgrowth and gonadal/adrenal differentiation.
  - target: Developmental delay
    description: Disrupted PBX1/HOX transcription in the developing brain contributes to developmental delay (mechanism not resolved).
  - target: External ear anomalies
    description: Disrupted branchial-arch/ear development produces ear malformations.
  - target: Congenital heart defect
    description: Disrupted Hedgehog/PBX cardiac morphogenesis produces the heart defect.
  - target: Diaphragmatic eventration
    description: Disrupted diaphragm development produces eventration.
  - target: Diaphragmatic hernia
    description: Disrupted diaphragm development produces hernia.
  evidence:
  - reference: PMID:29036646
    reference_title: "De novo, deleterious sequence variants that alter the transcriptional activity of the homeoprotein PBX1 are associated with intellectual disability and pleiotropic developmental defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PBX1 encodes a three amino acid loop extension (TALE) homeodomain transcription factor that forms multimeric complexes with TALE and HOX proteins to regulate target gene transcription during development."
    explanation: Defines PBX1's molecular role as a TALE/HOX transcriptional regulator.
  - reference: PMID:29036646
    reference_title: "De novo, deleterious sequence variants that alter the transcriptional activity of the homeoprotein PBX1 are associated with intellectual disability and pleiotropic developmental defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Functional studies on five PBX1 sequence variants revealed perturbation of intrinsic, PBX-dependent transactivation ability and altered nuclear translocation"
    explanation: Disease variants impair PBX-dependent transactivation and nuclear translocation.
- name: Impaired Metanephric Mesenchymal Function
  biological_scale: TISSUE
  description: >-
    PBX1 is required in metanephric mesenchyme and stroma for
    mesenchymal-epithelial signalling; its loss reduces ureteric branching and nephron number,
    producing renal hypoplasia/dysplasia, mispositioning, or agenesis. Shown in
    the Pbx1-null mouse.
  biological_processes:
  - preferred_term: nephron development
    modifier: ABNORMAL
    term:
      id: GO:0072006
      label: nephron development
  cell_types:
  - preferred_term: metanephric mesenchyme stem cell
    term:
      id: CL:0000324
      label: metanephric mesenchyme stem cell
  downstream:
  - target: Renal hypoplasia
    description: Reduced nephron endowment produces renal hypoplasia.
  evidence:
  - reference: PMID:12591246
    reference_title: "Pbx1 regulates nephrogenesis and ureteric branching in the developing kidney."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pbx1(-/-) kidneys contained fewer nephrons and were characterized by expanded regions of mesenchymal condensates in the nephrogenic zone."
    explanation: Pbx1 loss reduces nephron number via mesenchymal dysfunction.
  - reference: PMID:12591246
    reference_title: "Pbx1 regulates nephrogenesis and ureteric branching in the developing kidney."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these data establish a role for Pbx1 in mesenchymal-epithelial signaling and demonstrate that Pbx1 is an essential regulator of mesenchymal function during renal morphogenesis."
    explanation: Establishes PBX1's role in renal mesenchymal-epithelial signalling.
- name: Impaired Urogenital Ridge Development
  biological_scale: TISSUE
  description: >-
    PBX1 is widely expressed in urogenital mesenchyme; its loss reduces
    urogenital ridge outgrowth and impairs gonadal and adrenal differentiation,
    corresponding to the human differences of sex development and cryptorchidism.
    Shown in the Pbx1-null mouse; the human correspondence is inferred.
  biological_processes:
  - preferred_term: male gonad development
    modifier: ABNORMAL
    term:
      id: GO:0008584
      label: male gonad development
  downstream:
  - target: Ambiguous genitalia / 46,XY DSD
    description: Impaired gonadal differentiation underlies the DSD/sex-reversal phenotype.
  - target: Cryptorchidism
    description: Reduced urogenital ridge outgrowth and gonadal differentiation underlie failed testicular descent.
  evidence:
  - reference: PMID:14595835
    reference_title: "Pbx1 is essential for adrenal development and urogenital differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The complete lack of adrenal glands and formation of gonads displaying rudimentary sexual differentiation correlated with decreased cellular proliferation in Pbx1(-/-) genital ridges."
    explanation: Pbx1 loss impairs urogenital ridge and gonadal development.

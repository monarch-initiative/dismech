animal_models:
- name: Pbx1 knockout mouse (renal)
  species: Mouse
  genotype: Pbx1 -/- (constitutive knockout)
  publication: PMID:12591246
  description: >-
    Constitutive Pbx1 knockout; embryos show small, mispositioned kidneys with
    unilateral agenesis in severe cases and reduced ureteric branching.
  modeled_mechanisms:
  - target: Impaired Metanephric Mesenchymal Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the renal hypoplasia/agenesis and nephron-deficit mechanism.
    limitations: >-
      The renal phenotype is characterized in homozygous nulls, which are
      embryonic-lethal, whereas the human disease is heterozygous
      haploinsufficiency; the heterozygous mouse renal phenotype was not
      established in the source.
    evidence:
    - reference: PMID:12591246
      reference_title: "Pbx1 regulates nephrogenesis and ureteric branching in the developing kidney."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pbx1(-/-) embryos displayed kidneys that were reduced in size, axially mispositioned, and in more severe cases, exhibited unilateral agenesis."
      explanation: Reproduces the human renal hypoplasia/agenesis spectrum.
- name: Pbx1 p.R184P knock-in mouse
  species: Mouse
  genotype: Pbx1 p.R184P (CRISPR knock-in)
  publication: PMID:31625560
  description: >-
    Knock-in of the human p.R184P missense variant; heterozygotes show
    developmental anomalies, supporting a dominant mechanism.
  modeled_mechanisms:
  - target: PBX1 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Models a disease missense allele with reduced PBX1 protein and multi-organ anomalies.
    limitations: >-
      The full malformation spectrum is seen in homozygotes; heterozygotes show
      anomalies in a proportion of embryos, matching the human dominant mode.
    evidence:
    - reference: PMID:31625560
      reference_title: "Functional characterization of a novel PBX1 de novo missense variant identified in a patient with syndromic congenital heart disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also observed developmental anomalies in a proportion of heterozygous embryos, suggestive of a dominant mode of inheritance."
      explanation: Heterozygous knock-in reproduces a dominant developmental phenotype.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Chromosomal microarray detects PBX1-containing deletions; exome or genome
    sequencing (ideally trio) detects sequence variants. PBX1 is on CAKUT gene
    panels. Parental and multi-tissue testing is advised to detect mosaicism.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:28270404
    reference_title: "PBX1 haploinsufficiency leads to syndromic congenital anomalies of the kidney and urinary tract (CAKUT) in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "CMA should be recommended in cases of fetal renal anomalies to improve genetic counselling and pregnancy management."
    explanation: Chromosomal microarray is recommended for fetal renal anomalies to detect PBX1 deletions.
  - reference: PMID:28566479
    reference_title: "Targeted Exome Sequencing Identifies PBX1 as Involved in Monogenic Congenital Anomalies of the Kidney and Urinary Tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations included five de novo heterozygous loss of function mutations/deletions in the PBX homeobox 1 gene (PBX1), a gene known to have a crucial role in kidney development."
    explanation: Targeted exome/panel sequencing detects PBX1 sequence variants and deletions.
treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-specific therapy exists. Management follows CKD/CAKUT standards:
    renal-function monitoring, RAAS blockade for proteinuria, and dialysis or
    transplantation for end-stage kidney disease; plus organ-directed care
    (cardiac surgery, hearing rehabilitation, orchidopexy and DSD multidisciplinary
    care, developmental support).
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29036646
    reference_title: "De novo, deleterious sequence variants that alter the transcriptional activity of the homeoprotein PBX1 are associated with intellectual disability and pleiotropic developmental defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We conclude that deleterious sequence variants in PBX1 cause intellectual disability and pleiotropic malformations resembling those in Pbx1 mutant mice"
    explanation: The pleiotropic multi-organ malformations define the multidisciplinary supportive-care needs.

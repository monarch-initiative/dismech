name: Breasts and Nipples Aplasia or Hypoplasia 2
synonyms:
- breasts and/or nipples, aplasia or hypoplasia of, 2
- breasts and/or nipples, aplasia or hypoplasia of, type 2
- BNAH2
- PTPRF isolated congenital breast hypoplasia/aplasia
- PTPRF-related athelia
creation_date: "2026-10-20T23:35:36Z"
category: Mendelian
description: >-
  Breasts and/or nipples, aplasia or hypoplasia of, 2 (BNAH2; MIM 616001) is an
  extremely rare autosomal recessive disorder of nipple-areola development
  caused by biallelic loss-of-function variants in PTPRF, which encodes the
  receptor-type protein tyrosine phosphatase LAR. The disorder rests on a single
  published family: three children (a girl and two boys) from two branches of a
  consanguineous Israeli Arab kindred who were homozygous for a PTPRF
  frameshift variant and showed nipple anomalies ranging from unilateral
  hypothelia to bilateral athelia, with no other consistent anomaly apart from
  a characteristic eyebrow shape. A second, unresolved observation is a woman
  with syndromic bilateral amastia carrying a balanced translocation that
  disrupts one PTPRF allele, in whom PTPRF protein was nearly absent but no
  second variant was found. Female mice lacking the LAR phosphatase domains
  develop mammary glands but fail at terminal alveolar differentiation and
  cannot lactate. How PTPRF loss perturbs development of the nipple-areola
  region in humans has not been studied directly; the gene product localizes
  to adherens junctions and has been proposed to act through epithelial
  cell-cell contacts, growth factor signaling and the canonical Wnt pathway.
  Because the human evidence is one family plus one single-allele case, the
  mechanism and phenotype spectrum recorded here are provisional.
disease_term:
  preferred_term: breasts and/or nipples, aplasia or hypoplasia of, 2
  term:
    id: MONDO:0014450
    label: breasts and/or nipples, aplasia or hypoplasia of, 2
parents:
- Isolated congenital breast hypoplasia/aplasia
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance is inferred from the one reported family:
    the affected children came from a consanguineous kindred and were
    homozygous for the PTPRF frameshift variant identified by homozygosity
    mapping. The single-allele translocation case is not by itself evidence
    for dominant inheritance, since carrier relatives were unaffected.
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping after single nucleotide polymorphism (SNP) array genotyping and candidate gene sequencing we identified a homozygous frameshift mutation in PTPRF as the likely cause of nipple anomalies in this family."
    explanation: Homozygosity mapping in a consanguineous family and a homozygous causal variant support autosomal recessive inheritance.
  - reference: PMID:21453473
    reference_title: PTPRF is disrupted in a patient with syndromic amastia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the patient's mother and sisters also harbored the translocated chromosome, their non-translocated chromosomes 1 were different from that of the patient."
    explanation: Relatives carrying the same PTPRF-disrupting translocation were unaffected, which argues against a dominant effect of one disrupted allele.
prevalence:
- population: Published literature worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three affected children from one consanguineous Israeli Arab family carry
    the homozygous PTPRF frameshift variant. One further woman with syndromic
    amastia and a PTPRF-disrupting translocation has been reported, without a
    second variant. No population prevalence estimate exists.
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on three children from two branches of an extended consanguineous Israeli Arab family, a girl and two boys, who presented with a spectrum of nipple anomalies ranging from unilateral hypothelia to bilateral athelia"
    explanation: The only family with biallelic PTPRF variants comprises three affected children.
pathophysiology:
- name: Biallelic PTPRF Loss of Function
  description: >-
    A homozygous frameshift variant truncates PTPRF (LAR), a receptor-type
    protein tyrosine phosphatase with an adhesion-molecule-like extracellular
    region and two cytoplasmic phosphatase domains. Loss of the phosphatase is
    presumed to remove LAR-dependent tyrosine dephosphorylation at epithelial
    junctions. In the translocation case, one allele was disrupted and PTPRF
    RNA and protein were severely reduced in lymphoblastoid cells, which is
    consistent with near-complete loss of function, though the second hit was
    not identified.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  genetic_context:
    gene:
      preferred_term: PTPRF
      term:
        id: hgnc:9670
        label: PTPRF
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Homozygous frameshift (truncating) variant in the one reported family.
  gene:
    preferred_term: PTPRF
    term:
      id: hgnc:9670
      label: PTPRF
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine phosphatase activity
    term:
      id: GO:0005001
      label: transmembrane receptor protein tyrosine phosphatase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous frameshift mutation in PTPRF as the likely cause of nipple anomalies in this family"
    explanation: Identifies a homozygous truncating PTPRF variant as the disease lesion.
  - reference: PMID:21453473
    reference_title: PTPRF is disrupted in a patient with syndromic amastia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis revealed that PTPRF was nearly absent in the proband, while her unaffected mother and older sister had significant (p < 0.05) PTPRF protein remaining"
    explanation: In the translocation case, near-absent PTPRF protein accompanies the breast phenotype, consistent with a loss-of-function mechanism.
  - reference: PMID:12678846
    reference_title: "The leukocyte common antigen-related protein LAR: candidate PTP for inhibitory targeting."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a phosphatase subunit containing a short extracellular domain, a transmembrane segment, and tandem cytoplasmic PTP catalytic domains"
    explanation: Review describing LAR as a transmembrane receptor with cytoplasmic tyrosine phosphatase domains, the activity lost when the protein is truncated.
  downstream:
  - target: Disrupted LAR Signaling at Epithelial Adherens Junctions
    causal_link_type: UNKNOWN
    description: >-
      Proposed, not demonstrated, for this disease: loss of LAR would remove
      its phosphatase activity from cadherin complexes. No human or mouse
      study has examined junctional signaling in the developing nipple.
- name: Disrupted LAR Signaling at Epithelial Adherens Junctions
  description: >-
    LAR localizes to adherens junctions, associates with cadherin complexes and
    dephosphorylates beta-catenin, and also localizes to focal adhesions. It
    has been proposed that loss of this activity in the developing nipple-areola
    epithelium perturbs cell-cell contact, peptide growth factor signaling or
    canonical Wnt signaling. This node records that hypothesis; which, if any,
    of these routes operates in nipple development has not been tested.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "PTPRF encodes a receptor-type protein phosphatase that localizes to adherens junctions and may be involved in the regulation of epithelial cell-cell contacts, peptide growth factor signaling, and the canonical Wnt pathway."
    explanation: The disease-gene report itself frames the junctional and Wnt roles of PTPRF as possible, not shown, mechanisms for the nipple phenotype.
  - reference: PMID:12678846
    reference_title: "The leukocyte common antigen-related protein LAR: candidate PTP for inhibitory targeting."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current evidence supports a role for LAR in cadherin complexes where it associates with and dephosphorylates beta-catenin, a pathway which may be critical for cadherin complex stability and cell-cell association."
    explanation: Review evidence for the normal junctional function of LAR that the disease hypothesis invokes.
  downstream:
  - target: Defective Nipple-Areola Development
    causal_link_type: UNKNOWN
    description: >-
      The link from junctional LAR function to nipple-areola morphogenesis is
      inferred from the gene's known functions and the human phenotype, not
      measured.
- name: Defective Nipple-Areola Development
  description: >-
    The human phenotype points to a requirement for PTPRF in formation of the
    nipple-areola complex, with variable severity between and within affected
    individuals (unilateral hypothelia to bilateral athelia). Whether breast
    tissue itself is absent in biallelic carriers is not reported, as the
    affected individuals were children. In the translocation case, both
    breasts and nipples were absent.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: nipple
    term:
      id: UBERON:0002030
      label: nipple
  - preferred_term: areola
    term:
      id: UBERON:0002032
      label: areola
  biological_processes:
  - preferred_term: nipple development
    term:
      id: GO:0060618
      label: nipple development
    modifier: DECREASED
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results indicate a key role for PTPRF in the development of the nipple-areola region"
    explanation: The authors conclude from the family, the mouse lactation defect and the translocation case that PTPRF is required for nipple-areola development.
  downstream:
  - target: Athelia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24781087
      reference_title: Homozygous truncating PTPRF mutation causes athelia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a spectrum of nipple anomalies ranging from unilateral hypothelia to bilateral athelia"
      explanation: Absent nipples are the severe end of the developmental defect in homozygous children.
  - target: Hypothelia
    causal_link_type: DIRECT
  - target: Amastia
    causal_link_type: UNKNOWN
    description: >-
      Attributed to PTPRF only through the single translocation case, in which
      the second allele was not resolved.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have demonstrated that the PTPRF gene is interrupted on chromosome 1 in a woman with bilateral amastia and a balanced chromosome translocation."
    explanation: Reports bilateral amastia with PTPRF disruption in one woman.

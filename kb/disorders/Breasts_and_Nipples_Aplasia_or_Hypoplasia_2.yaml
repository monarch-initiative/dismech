- category: Integumentary
  name: Amastia
  description: >-
    Bilateral absence of breasts and nipples in the single woman with a
    PTPRF-disrupting balanced translocation. Her other features (ectodermal
    dysplasia with absent upper incisors and brittle nails, small cup-shaped
    pinnae, and unilateral renal agenesis) have not been seen in the
    homozygous family and are not attributed to BNAH2 here.
  phenotype_term:
    preferred_term: Amastia
    term:
      id: HP:0100783
      label: Breast aplasia
  notes: >-
    Single case, one disrupted allele, second hit not found. Recorded because
    MONDO and OMIM group the PTPRF breast phenotype under this disease, not
    because the case establishes the phenotype.
  evidence:
  - reference: PMID:21453473

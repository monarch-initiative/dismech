genetic:
- name: PTPRF
  presence: Positive
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PTPRF
    term:
      id: hgnc:9670
      label: PTPRF
  notes: >-
    Biallelic truncating PTPRF variants are the cause in the one reported
    family (homozygous frameshift). No ClinGen gene-disease validity
    classification was found for PTPRF and this disease, so no tier is
    recorded. Separately, a balanced t(1;20)(p34.1;q13.13) translocation
    breaking PTPRF between introns 7 and 11 was found in a woman with
    syndromic amastia; coding sequence, promoter and copy-number analysis of
    the other allele found no pathogenic change.
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous frameshift mutation in PTPRF as the likely cause of nipple anomalies in this family"
    explanation: Establishes PTPRF as the causal gene in the defining family.
  - reference: PMID:21453473
    reference_title: PTPRF is disrupted in a patient with syndromic amastia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a definite pathogenic mutation on the paternal allele could not be identified, PTPRF's RNA and protein of the patient were significantly less than those of her unaffected family members."
    explanation: Supports a PTPRF role in breast development while showing the second allele was not resolved in this case.
animal_models:
- name: Ptprf (LAR) phosphatase-domain knockout mouse
  species: Mus musculus
  genotype: LAR-/- (targeted deletion of both LAR phosphatase domains)
  publication: PMID:9245518
  genes:
  - preferred_term: PTPRF
    term:
      id: hgnc:9670
      label: PTPRF
  description: >-
    Mice lacking the sequences encoding both LAR phosphatase domains develop
    normally, but homozygous females cannot deliver milk because alveoli fail
    to complete terminal differentiation in late pregnancy. The model shows a
    mammary-gland requirement for LAR but does not report a nipple or areola
    defect, so it does not recapitulate the human nipple-areola phenotype.
  modeled_mechanisms:
  - target: Biallelic PTPRF Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The targeted allele removes the cytoplasmic phosphatase domains, modeling loss of LAR phosphatase function.
    limitations: >-
      A truncated mRNA lacking the phosphatase domains is still produced, so the
      allele is not a complete null for the extracellular region.
    evidence:
    - reference: PMID:9245518
      reference_title: Impaired mammary gland development and function in mice lacking LAR receptor-like tyrosine phosphatase activity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We used gene targeting in mouse embryonic stem cells to generate mice lacking sequences encoding both LAR phosphatase domains."
      explanation: Describes the loss-of-phosphatase allele.
  - target: Defective Nipple-Areola Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Shows a mammary-gland developmental requirement for LAR, at the alveolar stage rather than the nipple.
    limitations: >-
      The defect is in late-pregnancy alveolar differentiation and lactation;
      nipple and areola formation are not described as abnormal.
    evidence:
    - reference: PMID:9245518
      reference_title: Impaired mammary gland development and function in mice lacking LAR receptor-like tyrosine phosphatase activity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mammary glands of LAR-/- females were incapable of delivering milk due to an impaired terminal differentiation of alveoli at late pregnancy."
      explanation: The mouse defect is in terminal alveolar differentiation, a different developmental stage from the human nipple phenotype.
  evidence:
  - reference: PMID:9245518
    reference_title: Impaired mammary gland development and function in mice lacking LAR receptor-like tyrosine phosphatase activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these findings suggest an important role for LAR-mediated signalling in mammary gland development and function"
    explanation: Establishes a mammary-gland requirement for LAR in mice.
treatments:
- name: Breast and Nipple-Areola Reconstructive Surgery
  description: >-
    Surgical reconstruction (implant-based, autologous tissue, combined, or
    fat grafting, with or without nipple-areola reconstruction) is the general
    management of congenital absence or hypoplasia of the breast and nipple.
    No report describes reconstruction in a PTPRF patient; the evidence below
    is a systematic review of congenital breast anomalies (mainly amazia,
    absent breast tissue with a nipple present) and is cited as indirect
    support for the approach, not for its outcome in this disorder.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: breast and nipple-areola reconstruction
    term:
      id: NCIT:C15354
      label: Mammoplasty
  evidence:
  - reference: PMID:23896162
    reference_title: "Bilateral congenital amazia: a case report and systematic review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prosthetic and autologous reconstructions were equally represented (19 patients each, 35.2%; Table 2). Autologous reconstruction with prosthesis was slightly less common (15 patients, 27.8%)."
    explanation: Across 54 reconstructions of congenital breast anomalies, implant-based and autologous techniques were the main approaches; applied to BNAH2 by extrapolation only.
  - reference: PMID:23896162
    reference_title: "Bilateral congenital amazia: a case report and systematic review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of the 36 cases in which the approach to the NAC was addressed, most (66.7%) were not reconstructed."
    explanation: Nipple-areola complex reconstruction was usually not performed in congenital breast anomaly reconstructions, relevant because the nipple-areola complex is the structure affected in BNAH2.
differential_diagnoses:
- name: Ulnar-Mammary Syndrome
  description: >-
    TBX3-related autosomal dominant syndrome with nipple and breast hypoplasia
    accompanied by posterior limb, dental, genital and apocrine gland defects.
  evidence:
  - reference: PMID:30550377
    reference_title: Hypogonadotropic hypogonadism and pituitary hypoplasia as recurrent features in Ulnar-Mammary syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ulnar-mammary syndrome (UMS) is characterized by ulnar defects, and nipple or apocrine gland hypoplasia, caused by TBX3 haploinsufficiency."
    explanation: Nipple hypoplasia occurs in UMS together with ulnar defects, which are absent in the PTPRF family.
- name: TP63-Related Limb-Mammary Syndrome
  description: >-
    Autosomal dominant TP63 disorder with mammary-gland and nipple hypoplasia
    plus ectrodactyly, lacrimal duct, nail, dental and orofacial cleft
    anomalies.
  evidence:
  - reference: PMID:32067224
    reference_title: Novel phenotype of syndromic premature ovarian insufficiency associated with TP63 molecular defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "One of the syndromes linked to TP63 is limb mammary syndrome (LMS), an autosomal dominant inherited disorder characterized by ectrodactyly, hypoplasia of mammary-gland and nipple, lacrimal duct stenosis, nail dysplasia, dental anomalies, cleft palate and/or cleft lip and absence of skin and hair defects."
    explanation: Limb-mammary syndrome shares nipple and breast hypoplasia but carries limb and ectodermal features not seen in BNAH2.
- name: KMT2D-Related Disorder with Athelia
  description: >-
    De novo KMT2D missense variants outside the Kabuki syndrome spectrum can
    cause athelia with choanal atresia, hypoparathyroidism, absent puberty and
    extreme short stature.
  evidence:
  - reference: PMID:32083401
    reference_title: "Phenotypic expansion of KMT2D-related disorder: Beyond Kabuki syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here four patients (including one previously published patient) with de novo KMT2D missense variants and with shared but unusual clinical findings not typically seen in Kabuki syndrome, including athelia (absent nipples), choanal atresia, hypoparathyroidism, delayed or absent pubertal development, and extreme short stature."
    explanation: Athelia occurs in this KMT2D phenotype alongside systemic features absent in the PTPRF family.
- name: Scalp-Ear-Nipple Syndrome
  description: >-
    Syndromic athelia or amastia with scalp and ear anomalies, named in the
    PTPRF reports as a principal syndromic cause of absent nipples or breasts.
  evidence:
  - reference: PMID:24781087
    reference_title: Homozygous truncating PTPRF mutation causes athelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can affect either sex and is mostly part of syndromes including other congenital or ectodermal anomalies, such as limb-mammary syndrome, scalp-ear-nipple syndrome, or ectodermal dysplasias."
    explanation: Lists the syndromic forms of athelia to be excluded before diagnosing an isolated PTPRF form.
notes: >-
  Evidence base: one family with biallelic PTPRF variants (PMID:24781087, cached
  abstract only, so variant nomenclature and per-patient findings are not
  recorded here) and one single-allele translocation case (PMID:21453473). The
  Borck abstract describes only nipple anomalies in the homozygous children;
  breast aplasia or hypoplasia in biallelic carriers is not reported there and
  is not asserted here. No treatment has been reported in a PTPRF patient; the
  reconstructive-surgery entry is extrapolated from congenital breast anomalies
  in general. Neither a population constraint metric nor a carrier frequency
  for PTPRF is recorded, since none was available from a cached source. No
  GeneReviews chapter covers this disorder (`just
  check-genereviews --online` returned NO_CHAPTER against the 2026-09-10
  Bookshelf index and a live PubMed title search).

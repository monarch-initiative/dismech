name: Self-Limited Epilepsy with Centrotemporal Spikes
creation_date: "2026-07-18T00:00:00Z"
category: Complex
description: >-
  Self-limited epilepsy with centrotemporal spikes (SeLECTS; formerly benign
  epilepsy with centrotemporal spikes / benign Rolandic epilepsy) is the most
  common focal epilepsy of childhood. It presents between about ages 3 and 14
  years (peak 8-9) in a developmentally normal child, with infrequent
  focal seizures - characteristically nocturnal, involving one side of the face
  and the oropharynx (hemifacial twitching, hypersalivation, speech arrest),
  sometimes evolving to a bilateral tonic-clonic seizure. The EEG hallmark is
  high-amplitude centrotemporal (Rolandic) spikes that are markedly activated by
  sleep. Seizures remit by adolescence in almost all cases. It is understood as
  an age-dependent, genetically influenced disorder of maturation of the
  perirolandic sensorimotor cortex; during the active period, transient
  language and cognitive difficulties can occur and improve with remission.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- SeLECTS
- Benign epilepsy with centrotemporal spikes
- BECTS
- Benign Rolandic epilepsy
- Benign childhood epilepsy with centrotemporal spikes

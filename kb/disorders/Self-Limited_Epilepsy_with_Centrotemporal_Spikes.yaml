inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    SeLECTS is a genetically complex (polygenic) syndrome rather than a Mendelian
    disorder. The associated centrotemporal-sharp-wave EEG trait shows heritable,
    age-dependent, incomplete penetrance (linked to 11p13/ELP4); GRIN2A
    contributes at the severe end of the epilepsy-aphasia spectrum. Most trait
    carriers never develop clinical seizures.
pathophysiology:
- name: Genetic Predisposition to Cortical Hyperexcitability
  description: >-
    SeLECTS is genetically complex rather than monogenic: the centrotemporal
    spike EEG trait is heritable with age-dependent expression, and common and
    rare variants (including, at the severe/atypical end of the related
    epilepsy-aphasia spectrum, GRIN2A) contribute susceptibility. This node
    captures the single concept of the polygenic predisposition.
  role: trigger
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:19172991
    reference_title: "Centrotemporal sharp wave EEG trait in rolandic epilepsy maps to Elongator Protein Complex 4 (ELP4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with genome-wide linkage of CTS to 11p13 (HLOD 4.30)."
    explanation: >-
      Maps the heritable centrotemporal-sharp-wave EEG trait to the 11p13/ELP4
      locus, evidence that a genetic cortical-excitability trait underlies the
      syndrome.
  - reference: PMID:29056244
    reference_title: "GRIN2A mutations in epilepsy-aphasia spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIN2A mutation was found in 11.1% (1 out of 9 cases) of LKS, and in 7.1% (3 out of 42 cases) of ABPE, but in none with ECSWS and BECTS."
    explanation: >-
      Shows GRIN2A variants concentrate at the severe end of the epilepsy-aphasia
      spectrum and are absent from classic BECTS/SeLECTS, distinguishing this
      complex disorder from the GRIN2A monogenic end.
  downstream:
  - target: Age-Dependent Perirolandic Cortical Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The genetic predisposition manifests as transient hyperexcitability of the
      maturing perirolandic cortex.
    evidence:
    - reference: PMID:20825490
      reference_title: "Pleiotropic effects of the 11p13 locus on developmental verbal dyspraxia and EEG centrotemporal sharp waves."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Taken together, these data strongly support a neurodevelopmental origin for classic RE."
      explanation: >-
        Linkage of both the centrotemporal-sharp-wave trait and speech sound
        disorder to the same 11p13 locus argues that the inherited
        susceptibility acts through cortical development, which is why the
        resulting hyperexcitability is confined to a maturational window. The
        link is annotated INDIRECT_UNKNOWN_INTERMEDIATES because the steps
        between locus and cortical excitability are not established.
- name: Age-Dependent Perirolandic Cortical Hyperexcitability
  description: >-
    During a maturational window in mid-childhood, the perirolandic
    (centrotemporal) sensorimotor cortex becomes transiently hyperexcitable; the
    age-restricted nature of this hyperexcitability underlies both the
    childhood onset and the spontaneous remission with brain maturation. This
    node captures the single concept of the maturation-dependent cortical
    hyperexcitability.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Sleep-Activated Centrotemporal Epileptiform Discharges
    causal_link_type: DIRECT
    description: >-
      The hyperexcitable perirolandic cortex generates centrotemporal spikes,
      strongly activated by sleep.
    evidence:
    - reference: PMID:34220477
      reference_title: "Computational Evidence for a Competitive Thalamocortical Model of Spikes and Spindle Activity in Rolandic Epilepsy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "epileptiform spikes can be triggered and promoted by either a reduced NMDA current or h-type current"
      explanation: >-
        A thalamocortical neural-mass model of rolandic epilepsy shows how
        altered excitability in the Rolandic circuit generates the
        NREM-sleep-activated spikes, the step this edge asserts. Evidence source
        is COMPUTATIONAL because the result comes from in silico simulation.
    - reference: PMID:34220477
      reference_title: "Computational Evidence for a Competitive Thalamocortical Model of Spikes and Spindle Activity in Rolandic Epilepsy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "changes in inhibitory transmission in the thalamic reticular nucleus mediates an antagonistic dynamic between epileptiform spikes and spindles"
      explanation: >-
        Offers a mechanism for the sleep dependence specifically: the spikes
        compete for the same thalamocortical circuit that generates NREM sleep
        spindles.
- name: Sleep-Activated Centrotemporal Epileptiform Discharges
  description: >-
    The electrographic hallmark is high-amplitude centrotemporal (Rolandic)
    spike-wave discharges that are markedly potentiated during non-REM sleep.
    This node captures the single concept of the characteristic epileptiform
    activity.
  role: central_effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Focal Sensorimotor (Rolandic) Seizures
    causal_link_type: DIRECT
    description: >-
      The discharges manifest clinically as focal perirolandic seizures.
    evidence:
    - reference: PMID:32661641
      reference_title: "Seizures in self-limited epilepsy with centrotemporal spikes: video-EEG documentation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Since seizures associated with rolandic spikes are infrequent and usually occur during sleep"
      explanation: >-
        Ictal video-EEG documents the seizures as the clinical counterpart of
        the rolandic spikes and shares their sleep predominance, which is what
        this edge asserts.
  - target: Transient Language and Cognitive Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Frequent epileptiform activity, especially in sleep, transiently disrupts
      language and cognitive networks.
    evidence:
    - reference: PMID:28801973
      reference_title: "Cognitive functioning in children with self-limited epilepsy with centrotemporal spikes: A systematic review and meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "children with ECTS demonstrated significantly lower scores on neuropsychological tests across all cognitive factors compared to healthy controls"
      explanation: >-
        A meta-analysis of 42 case-control samples establishes that the
        cognitive dysfunction is real and measurable, so the target of this edge
        is well supported. Graded PARTIAL rather than SUPPORT because the same
        paper argues the deficits are pervasive rather than circumscribed, which
        cuts against calling them merely transient; the paper does not test
        whether the discharges cause them.
- name: Focal Sensorimotor (Rolandic) Seizures
  description: >-
    The clinical seizures are focal, typically nocturnal, and involve the face
    and oropharynx (hemifacial twitching, hypersalivation, speech arrest,
    tonic-clonic activity of one side of the face), sometimes evolving to a
    bilateral tonic-clonic seizure. This node captures the single concept of the
    seizure endpoint and conforms to the shared epilepsy final common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
- name: Transient Language and Cognitive Dysfunction
  description: >-
    During the active epilepsy period, reversible deficits in language and
    executive functioning can occur and characteristically improve when seizures
    remit. This node captures the single concept of the transient
    neuropsychological effect.
  role: effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
- name: Age-Dependent Remission
  description: >-
    As the perirolandic cortex matures, the hyperexcitability resolves and
    seizures remit, almost always by adolescence, with normalization of the EEG.
    This node captures the single concept of the self-limited course, a defining
    feature of the syndrome.
  role: consequence
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron

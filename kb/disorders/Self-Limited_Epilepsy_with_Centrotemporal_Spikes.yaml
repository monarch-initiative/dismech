genetic:
- name: ELP4
  gene_term:
    preferred_term: ELP4
    term:
      id: hgnc:1171
      label: ELP4
  relationship_type: SUSCEPTIBILITY
  notes: >-
    The heritable centrotemporal-sharp-wave EEG trait maps to the 11p13 locus
    containing ELP4 (Elongator complex subunit 4); associated variants are
    largely non-coding/regulatory. This is a susceptibility trait, not a single
    Mendelian cause; SeLECTS is genetically complex.
  evidence:
  - reference: PMID:19172991
    reference_title: "Centrotemporal sharp wave EEG trait in rolandic epilepsy maps to Elongator Protein Complex 4 (ELP4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with genome-wide linkage of CTS to 11p13 (HLOD 4.30)."
    explanation: >-
      Maps the centrotemporal-spike EEG trait to the 11p13/ELP4 locus.
- name: GRIN2A
  gene_term:
    preferred_term: GRIN2A
    term:
      id: hgnc:4585
      label: GRIN2A
  relationship_type: SUSCEPTIBILITY
  notes: >-
    GRIN2A (encoding the NMDA receptor subunit GluN2A) variants cluster at the
    severe/atypical end of the epilepsy-aphasia spectrum (Landau-Kleffner
    syndrome, atypical benign focal epilepsy, EE-SWAS) and are essentially absent
    from classic SeLECTS/BECTS - a distinction from the GRIN2A monogenic
    disorders.
  evidence:
  - reference: PMID:29056244
    reference_title: "GRIN2A mutations in epilepsy-aphasia spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIN2A mutation was found in 11.1% (1 out of 9 cases) of LKS, and in 7.1% (3 out of 42 cases) of ABPE, but in none with ECSWS and BECTS."
    explanation: >-
      Shows GRIN2A variants concentrate at the severe end of the spectrum and are
      absent from classic BECTS/SeLECTS.
treatments:
- name: Antiseizure Medication (Often Not Required)
  description: >-
    Because seizures are infrequent and self-limited, many children need no
    antiseizure medication; when treatment is used (e.g., for frequent or
    daytime seizures), standard focal-epilepsy antiseizure medications are
    effective.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Watchful Observation and Counseling
  description: >-
    Given the benign, self-limited course, reassurance, family counseling, and
    observation are often sufficient management.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
prevalence:
- population: Children under 15 years
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 14.0
  rate_low: 7.0
  rate_high: 21.0
  notes: >-
    SeLECTS is the most common focal epilepsy of childhood, accounting for
    roughly 6-7% of all childhood epilepsy and rising to about 15-25% of
    epilepsies diagnosed between ages 5 and 15. Reported annual incidence in
    children under 15 is approximately 7-21 per 100,000 (varying with
    ascertainment method).
datasets: []
discussions:
- discussion_id: gap_selects_epilepsy_aphasia_spectrum_progression
  prompt: >-
    What determines whether a child with centrotemporal spikes stays at the
    benign SeLECTS end of the epilepsy-aphasia spectrum or progresses toward the
    severe end (atypical benign focal epilepsy, epileptic encephalopathy with
    spike-and-wave activation in sleep, Landau-Kleffner syndrome)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Sleep-Activated Centrotemporal Epileptiform Discharges
  - pathophysiology#Transient Language and Cognitive Dysfunction
  rationale: >-
    SeLECTS is the mild anchor of a continuum whose severe end carries lasting
    language and cognitive morbidity. GRIN2A variants are enriched at the severe
    end and are essentially absent from classic SeLECTS, but they explain only a
    minority even of severe cases, so the factors (genetic, EEG burden in sleep,
    others) that tip a given child toward encephalopathic outcome are largely
    unknown. Because the severe end is where irreversible harm occurs, predicting
    and preventing progression is the central clinical question of the spectrum.
  evidence:
  - reference: PMID:29056244
    reference_title: "GRIN2A mutations in epilepsy-aphasia spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GRIN2A mutation was found in 11.1% (1 out of 9 cases) of LKS, and in 7.1% (3 out of 42 cases) of ABPE, but in none with ECSWS and BECTS."
    explanation: >-
      Shows GRIN2A partly explains the severe end but not classic SeLECTS,
      leaving the determinants of progression largely open.
  proposed_experiments:
  - experiment_id: exp_selects_progression_predictors
    name: Predictors of progression along the epilepsy-aphasia spectrum
    description: >-
      In a prospective centrotemporal-spike cohort, relate sleep EEG spike
      burden, genotype, and early language measures to progression toward
      atypical/encephalopathic outcomes, to identify early predictors.
    experiment_type:
      preferred_term: prospective predictor cohort experiment
    readouts:
    - name: Progression versus baseline predictors
      target: pathophysiology#Transient Language and Cognitive Dysfunction
      assays:
      - preferred_term: electroencephalography
      - preferred_term: neuropsychological assessment
      direction: POSITIVE
    controls:
    - name: Non-progressing SeLECTS
      description: Children with typical self-limited course as comparators.
    decision_criterion: >-
      A predictor is supported if it separates children who progress to the
      severe end from those with typical remission.
    would_support:
    - pathophysiology#Transient Language and Cognitive Dysfunction

- discussion_id: gap_selects_maturational_remission_mechanism
  prompt: >-
    What maturational change in the perirolandic cortex switches off the
    age-dependent hyperexcitability and produces the reliable spontaneous
    remission of SeLECTS by adolescence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Age-Dependent Remission
  - pathophysiology#Age-Dependent Perirolandic Cortical Hyperexcitability
  rationale: >-
    Unlike most epilepsies, SeLECTS is programmed to remit as the brain matures,
    which makes its offset an unusual natural experiment in how a developing
    cortical network loses a seizure-generating state. The specific maturational
    processes (changes in inhibition, myelination, synaptic pruning, or network
    connectivity of the sensorimotor cortex) responsible for remission are not
    established. Understanding them could illuminate general principles of
    epileptogenesis and its reversal.
  proposed_experiments:
  - experiment_id: exp_selects_remission_maturation
    name: Maturational correlates of SeLECTS remission
    description: >-
      Longitudinally track perirolandic network excitability, inhibitory
      maturation, and connectivity (EEG, imaging) from active epilepsy through
      remission, to identify which maturational changes coincide with offset.
    experiment_type:
      preferred_term: longitudinal maturation-imaging experiment
    readouts:
    - name: Excitability and connectivity across remission
      target: pathophysiology#Age-Dependent Remission
      assays:
      - preferred_term: electroencephalography
      - preferred_term: functional magnetic resonance imaging assay
      direction: NEGATIVE
    controls:
    - name: Age-matched unaffected children
      description: Typically developing children of matched ages.
    decision_criterion: >-
      A maturational process is implicated if its change reliably coincides with
      the resolution of centrotemporal spikes and seizures.
    would_support:
    - pathophysiology#Age-Dependent Remission

- discussion_id: gap_selects_cts_trait_penetrance_and_language_pleiotropy
  prompt: >-
    Why do only some carriers of the heritable centrotemporal-sharp-wave (CTS)
    EEG trait develop clinical seizures, and how does the same 11p13/ELP4 locus
    connect the EEG trait to the associated speech and language difficulties?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Genetic Predisposition to Cortical Hyperexcitability
  - pathophysiology#Transient Language and Cognitive Dysfunction
  rationale: >-
    The CTS EEG trait maps to 11p13/ELP4 and is far more common than clinical
    SeLECTS, so most trait carriers never have seizures - the determinants of
    this incomplete, age-dependent penetrance are unknown. The same locus shows
    pleiotropy with developmental verbal dyspraxia, hinting that the EEG trait
    and the language phenotype share a developmental substrate. Whether ELP4
    regulatory variation sets a cortical-excitability and language-network
    vulnerability that only sometimes crosses the seizure threshold is an open,
    testable hypothesis.
  evidence:
  - reference: PMID:19172991
    reference_title: "Centrotemporal sharp wave EEG trait in rolandic epilepsy maps to Elongator Protein Complex 4 (ELP4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with genome-wide linkage of CTS to 11p13 (HLOD 4.30)."
    explanation: >-
      Establishes the heritable EEG trait locus whose incomplete penetrance and
      language pleiotropy are the subject of this hypothesis.
  - reference: PMID:20825490
    reference_title: "Pleiotropic effects of the 11p13 locus on developmental verbal dyspraxia and EEG centrotemporal sharp waves."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pleiotropic effects of the 11p13 locus on developmental verbal dyspraxia and EEG centrotemporal sharp waves."
    explanation: >-
      Ties the same 11p13 locus to both the EEG trait and developmental verbal
      dyspraxia, the pleiotropy this hypothesis addresses.
  proposed_experiments:
  - experiment_id: exp_selects_elp4_penetrance
    name: ELP4 regulatory variation, excitability, and language
    description: >-
      In carriers stratified by ELP4 regulatory genotype, relate cortical
      excitability measures and language-network function to seizure occurrence,
      testing whether the same variation grades both excitability and language
      vulnerability.
    experiment_type:
      preferred_term: genotype-endophenotype stratification experiment
    readouts:
    - name: Excitability and language by genotype and seizure status
      target: pathophysiology#Genetic Predisposition to Cortical Hyperexcitability
      assays:
      - preferred_term: electroencephalography
      - preferred_term: language assessment
      direction: POSITIVE
    controls:
    - name: Non-carrier controls
      description: Individuals without the CTS-associated 11p13 genotype.
    decision_criterion: >-
      The hypothesis is supported if ELP4 regulatory genotype grades both
      cortical excitability and language-network measures, with seizures
      occurring above an excitability threshold.
    would_support:
    - pathophysiology#Genetic Predisposition to Cortical Hyperexcitability

- name: Impaired Myelination
  description: Mouse Chd8 haploinsufficiency and Olig1-lineage heterozygous deletion impair myelination. This differs from increased glial markers or greater white-matter volume in primate models. Olig1-Cre also marks ventral interneuron progenitors, so behavioral changes cannot be assigned exclusively to mature oligodendrocytes.

- name: Increased Gliogenesis
  description: CHD8-disrupted cynomolgus monkey brains have increased astrocytic and oligodendroglial markers, and engineered newborn brain slices show enhanced glial proliferation. The embryo-edited series includes one aborted fetus, one stillborn animal and one surviving male. Different alleles, very small animal numbers and uncertain brain editing in the surviving animal limit inference about human disease.

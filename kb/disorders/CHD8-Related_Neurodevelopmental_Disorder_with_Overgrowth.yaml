name: CHD8-Related Neurodevelopmental Disorder with Overgrowth
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- intellectual developmental disorder with autism and macrocephaly
- IDDAM
- CHD8 overgrowth syndrome
- CHD8-related neurodevelopmental disorder
- CHD8-NDD
- autism, susceptibility to, 18
- AUTS18
description: >-
  CHD8-related neurodevelopmental disorder with overgrowth is an autosomal dominant disorder associated principally with heterozygous loss-of-function variants in CHD8 at 14q11.2. CHD8 is an ATP-dependent chromatin regulator. The clinical spectrum includes variable macrocephaly and tall stature, developmental and speech delay, intellectual disability ranging from mild to severe, autism, sleep disturbance and gastrointestinal symptoms, particularly constipation. Hypotonia and seizures occur in a minority; dystonia can occasionally be a prominent presentation with limited cognitive involvement. Most pathogenic variants arise de novo, but transmission with markedly variable expression is documented. The frequency of each feature depends on ascertainment, age and reporting completeness. This entry concerns the molecularly defined CHD8 disorder; broad autism cohorts inform gene discovery, while CHD8-specific cohorts inform clinical frequencies. Contiguous deletions may add effects from neighboring genes.

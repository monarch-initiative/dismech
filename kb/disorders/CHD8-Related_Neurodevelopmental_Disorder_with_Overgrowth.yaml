    description: Shorter G1 offers a candidate route to faster expansion in this cultured progenitor model; the inference is not universal across alleles or models.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Increased Neural Progenitor Proliferation
  description: Progenitor proliferation increases in engineered human cerebral organoids and zebrafish morphants. In the Hurley mouse allelic series, increased TBR2-positive basal progenitor proliferation occurs in mild hypomorphs with approximately 36% residual protein, but was not detected in approximately 50% heterozygotes. More severe depletion instead produces apoptosis and brain hypoplasia; the response is not monotonic.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:

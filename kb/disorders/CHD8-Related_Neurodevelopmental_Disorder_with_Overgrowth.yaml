    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Gastrointestinal Dysmotility
  description: Zebrafish morphants show delayed intestinal transit alongside reduced innervation. This supplies a candidate mechanism for human constipation. The Chatterjee mouse model has increased permeability without a change in measured stool transit, so dysmotility and barrier impairment are distinct readouts.

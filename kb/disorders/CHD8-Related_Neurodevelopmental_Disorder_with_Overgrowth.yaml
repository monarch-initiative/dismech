- name: Increased Gliogenesis and White Matter Expansion
  biological_scale: CELLULAR
  description: >-
    A primate-specific arm of the overgrowth mechanism. CRISPR/Cas9 disruption of
    CHD8 in cynomolgus monkey embryos increases gliogenesis and the number of glial
    cells in newborn monkeys, and knockdown in organotypic newborn-monkey brain
    slices enhances glial proliferation. Because rodent studies gave inconsistent
    accounts of how CHD8 loss enlarges the brain - and because mouse cortex is
    enlarged without a proportionate increase in neuron number - glial expansion
    rather than neuronal excess may be the dominant driver of megalencephaly in
    primates, including humans. This node is retained deliberately as a parallel,
    species-qualified route into brain overgrowth; see the HUMAN_MODEL_MISMATCH
    discussion.

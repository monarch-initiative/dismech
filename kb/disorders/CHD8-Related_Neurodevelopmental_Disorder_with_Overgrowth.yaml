    explanation: GeneReviews genetic counselling guidance.
animal_models:
- species: Mus musculus
  genotype: Chd8+/- (heterozygous loss-of-function)
  category: GENETIC
  description: >-
    Constitutive Chd8 heterozygous mice are the closest dosage match to the human
    disorder and recapitulate brain overgrowth, hypertelorism, motor delay, altered
    social responses, increased anxiety and repetitive behaviour, together with
    long-range functional over-connectivity on resting-state fMRI.
  evidence:
  - reference: PMID:27602517
    reference_title: "CHD8 haploinsufficiency results in autistic-like phenotypes in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that mice heterozygous for Chd8 mutations manifest ASD-like behavioural characteristics including increased anxiety, repetitive behaviour, and altered social behaviour.
    explanation: Behavioural recapitulation in the mouse heterozygote.
  - reference: PMID:29668850
    reference_title: "Altered Neocortical Gene Expression, Brain Overgrowth and Functional Over-Connectivity in Chd8 Haploinsufficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that Chd8 heterozygous mice display increased brain size, motor delay, hypertelorism, pronounced hypoactivity, and anomalous responses to social stimuli.
    explanation: Somatic and behavioural recapitulation in the mouse heterozygote.
  - reference: PMID:36738737
    reference_title: "Mouse population genetics phenocopies heterogeneity of human Chd8 haploinsufficiency."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Trait disruptions mimicked those seen clinically, with robust strain and sex differences. Some strains exhibited large effect-size trait disruptions, sometimes in opposite directions, and-remarkably-others expressed resilience.
    explanation: >-
      Crossing the Chd8 lesion across 33 mouse strains shows genetic background is a
      powerful modifier, producing opposite-direction effects and outright
      resilience. This reframes the well-known behavioural inconsistency between
      published Chd8 mouse lines as background-dependent biology rather than
      experimental noise, and is the main reason any single-strain mouse result here
      is weighted cautiously. PARTIAL because it qualifies rather than directly
      supports the model's fidelity.
- species: Danio rerio
  genotype: chd8 loss of function (morpholino suppression and stable constitutive mutant)
  category: GENETIC
  description: >-
    Zebrafish chd8 loss of function reproduces the two most distinctive arms of the
    human syndrome simultaneously - increased head size from forebrain/midbrain
    expansion, and impaired gastrointestinal motility from reduced enteric
    innervation - and further localises the GI defect to vagal neural crest
    development and intestinal epithelial homeostasis.
  evidence:
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      chd8 disruption in zebrafish recapitulates features of the human phenotype, including increased head size as a result of expansion of the forebrain/midbrain and impairment of gastrointestinal motility due to a reduction in postmitotic enteric neurons.
    explanation: Dual recapitulation of the head-size and GI arms of the phenotype.
  - reference: PMID:36375841
    reference_title: "Loss of autism-candidate CHD8 perturbs neural crest development and intestinal homeostatic balance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings propose a causal developmental link between chd8, NCC development, intestinal homeostasis, and autism-associated gastrointestinal complaints.
    explanation: Localises the GI arm to neural crest and intestinal homeostasis.
- species: Macaca fascicularis
  genotype: CRISPR/Cas9-mediated CHD8 mutation (embryo editing)
  category: GENETIC
  description: >-
    Cynomolgus monkey CHD8 mutants are the only non-human primate model and are
    uniquely informative because they resolve a question rodents could not: they
    show that macrocephaly in a primate arises through increased gliogenesis rather
    than excess neuronal production. Limitations are small n, cost, mosaic founders
    and limited behavioural phenotyping.
  evidence:
  - reference: PMID:36878905
    reference_title: "CHD8 mutations increase gliogenesis to enlarge brain size in the nonhuman primate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, knocking down CHD8 via CRISPR/Cas9 in organotypic monkey brain slices from newborn monkeys also enhanced the proliferation of glial cells.
    explanation: >-
      Independent slice-culture confirmation of the glial proliferation phenotype in
      primate tissue.
experimental_models:
- name: CHD8 heterozygous human cerebral organoids
  description: >-
    Isogenic CRISPR/Cas9 CHD8+/- iPSC-derived cerebral organoids model CHD8
    haploinsufficiency in a human genetic background. They show enlargement, an
    accelerated/delayed split in inhibitory versus excitatory neurogenesis, and
    cell-autonomous, patient-mutation-specific molecular defects in proliferation
    and alternative splicing.
  evidence:
  - reference: PMID:35385734
    reference_title: "CHD8 haploinsufficiency links autism to transient alterations in excitatory and inhibitory trajectories."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through an isogenic design of patient-specific mutations and mosaic organoids, we define genotype-phenotype relationships and uncover their cell-autonomous nature.
    explanation: Describes the isogenic organoid design and its cell-autonomous readout.
  - reference: PMID:28321286
    reference_title: "CRISPR/Cas9-mediated heterozygous knockout of the autism gene CHD8 and characterization of its transcriptional networks in cerebral organoids derived from iPS cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR/Cas9-mediated heterozygous knockout of the autism gene CHD8 and characterization of its transcriptional networks in cerebral organoids derived from iPS cells.
    explanation: Establishes the heterozygous CHD8 organoid model system.
differential_diagnoses:
- name: Autism Spectrum Disorder (multifactorial)
  disease_term:
    preferred_term: autism spectrum disorder
    term:
      id: MONDO:0005258
      label: autism spectrum disorder
  description: >-
    The single most important boundary for this entry. Broad, multifactorial autism
    spectrum disorder lists CHD8 among many risk genes recovered by large-scale
    exome sequencing, and dismech curates it as a separate, polygenic entity. This
    entry is NOT that entity: here CHD8 haploinsufficiency is the sufficient
    monogenic cause of a syndromic, highly penetrant phenotype with overgrowth,
    macrocephaly, dysmorphism, sleep and gastrointestinal involvement.
  distinguishing_features:
  - >-
      Presence of a heterozygous pathogenic CHD8 variant; macrocephaly and tall
      stature; recognisable facies; prominent sleep and gastrointestinal involvement;
      autosomal dominant transmission with 50% recurrence risk to offspring. Broad ASD
      has no single sufficient genetic cause and no consistent overgrowth phenotype.
  evidence:
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that CHD8 disruptions define a distinct ASD subtype and reveal unexpected comorbidities between brain development and enteric innervation.
    explanation: >-
      Explicitly frames CHD8 disruption as defining a distinct subtype separable
      from autism at large.
- name: CHARGE Syndrome (CHD7)
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  description: >-
    Caused by the CHD paralogue CHD7, not CHD8. Cited here as an explicit
    named-entity-confusion guard: CHD7 and CHD8 are adjacent in the CHD family and
    are readily transposed in literature searches, but the diseases are distinct.
  distinguishing_features:
  - >-
      CHARGE syndrome is characterised by coloboma, choanal atresia, cranial nerve
      dysfunction, characteristic external and inner ear anomalies with semicircular
      canal hypoplasia, and heart defects; growth retardation rather than overgrowth
      is typical. CHD8-NDD has none of these as core features.
- name: CHD2-Related Developmental and Epileptic Encephalopathy
  disease_term:
    preferred_term: CHD2-related developmental and epileptic encephalopathy
    term:
      id: MONDO:0014150
      label: developmental and epileptic encephalopathy 94
  description: >-
    Caused by the CHD paralogue CHD2. A second explicit NEC guard: CHD2 is an
    epilepsy gene, and seizures also occur in a minority of CHD8-NDD, so the
    combination of a "CHD" gene plus seizures is a known route to
    misattribution.
  distinguishing_features:
  - >-
      CHD2-related disease is dominated by early-onset, often photosensitive
      myoclonic epilepsy and epileptic encephalopathy with developmental regression.
      In CHD8-NDD seizures occur in only 10%-15%, are not the defining feature, and
      overgrowth/macrocephaly dominates the presentation.
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Less common features are hypotonia (about 30% of affected individuals), seizures (10%-15%), dystonia (rare), and Chiari I malformation (rare).
    explanation: >-
      Quantifies seizures as a minority feature in CHD8-NDD, distinguishing it from
      a primary epilepsy gene.
- name: Sifrim-Hitz-Weiss Syndrome (CHD4)
  disease_term:
    preferred_term: Sifrim-Hitz-Weiss syndrome
    term:
      id: MONDO:0014946
      label: Sifrim-Hitz-Weiss syndrome
  description: >-
    Caused by the CHD paralogue CHD4. A third NEC guard within the CHD family;
    CHD4-related disease also involves developmental delay and macrocephaly, making
    it the closest phenotypic neighbour among the paralogues.
  distinguishing_features:
  - >-
      CHD4-related Sifrim-Hitz-Weiss syndrome is typically caused by missense
      (largely gain-of-function-like) variants and features hearing loss, congenital
      heart defects, skeletal and genital anomalies, and ventriculomegaly. CHD8-NDD
      is a loss-of-function/haploinsufficiency disorder without that visceral
      malformation profile.
- name: 14q11.2 Microdeletion Syndrome
  description: >-
    A contiguous-gene deletion encompassing CHD8 and neighbouring genes. Deletion
    cases share the CHD8-NDD core phenotype, and the minimal critical region has
    been narrowed to SUPT16H and CHD8, but a deletion is not a pure CHD8 lesion.
  distinguishing_features:
  - >-
      Detected by chromosomal microarray rather than sequencing; additional deleted
      genes (notably SUPT16H) may modify the phenotype, so deletion cases are held
      adjacent to, not inside, the intragenic-variant entity.
  evidence:
  - reference: PMID:25257502
    reference_title: "Recurrent \u223c100 Kb microdeletion in the chromosomal region 14q11.2, involving CHD8 gene, is associated with autism and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The minimal critical region, considering present and previous cases, contains the SUPT16H and CHD8 genes.
    explanation: >-
      Defines the minimal critical region and shows it is not CHD8 alone.
- name: 14q11.2 Microduplication (CHD8-SUPT16H) Syndrome
  disease_term:
    preferred_term: 14q11.2 microduplication syndrome
    term:
      id: MONDO:0016835
      label: 14q11.2 microduplication syndrome
  description: >-
    The reciprocal dosage disorder. Duplication of the same 14q11.2 segment
    containing CHD8 and SUPT16H also produces a neurodevelopmental phenotype, which
    is why CHD8 is described as requiring tight dosage control in both directions.
    Duplication cases are a separate entity and must not be folded into this entry.
  distinguishing_features:
  - >-
    Detected as a copy-number GAIN on chromosomal microarray rather than a
    loss-of-function sequence variant; neurodevelopmental severity is variable and
    at least one reported individual had normal intelligence; the duplication also
    spans SUPT16H so single-gene CHD8 triplosensitivity is not established.
  evidence:
  - reference: PMID:31823155
    reference_title: "Neurodevelopmental phenotype associated with CHD8-SUPT16H duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, a 14q11.2 microduplication syndrome, encompassing CHD8 and SUPT16H, has been described, highlighting the importance of a tight control of at least CHD8 gene-dosage for a normal development.
    explanation: >-
      Establishes the duplication entity and the bidirectional dosage sensitivity.
  - reference: PMID:31823155
    reference_title: "Neurodevelopmental phenotype associated with CHD8-SUPT16H duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on two patients with 14q11.2 microduplication encompassing CHD8 and SUPT16H, one of whom had normal intelligence.
    explanation: >-
      Documents the milder end of the duplication phenotype, distinguishing it from
      the deletion/loss-of-function disorder.
- name: PTEN Hamartoma Tumor Syndrome
  disease_term:
    preferred_term: PTEN hamartoma tumor syndrome
    term:
      id: MONDO:0017623
      label: PTEN hamartoma tumor syndrome
  description: >-
    The most important not-to-miss alternative in the macrocephaly-plus-autism
    presentation, because unlike CHD8-NDD it carries a defined cancer risk that
    changes surveillance.
  distinguishing_features:
  - >-
    In PTEN hamartoma tumor syndrome the macrocephaly is disproportionate to height,
    whereas CHD8-NDD overgrowth is generalised (height and head circumference
    together). Hamartomas and a defined malignancy risk are features of PTEN
    disease and are not established in CHD8-NDD, where tumour surveillance is
    explicitly not recommended.
- name: Other Overgrowth-with-Intellectual-Disability Syndromes
  description: >-
    Sotos syndrome (NSD1), Weaver syndrome (EZH2), Tatton-Brown-Rahman syndrome
    (DNMT3A), Malan syndrome (NFIX) and Beckwith-Wiedemann syndrome share the
    overgrowth-plus-developmental-impairment presentation and are the differential
    within which CHD8-NDD was originally delineated.
  distinguishing_features:
  - >-
    Most of these conditions - including CHD8-NDD itself - have distinct DNA
    methylation episignatures, so a single episignature array can discriminate much
    of this differential simultaneously. Beckwith-Wiedemann syndrome is further
    distinguished by asymmetric/lateralised overgrowth and embryonal tumour risk.
  evidence:
  - reference: PMID:31001818
    reference_title: "The clinical presentation caused by truncating CHD8 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD8 is one of the causative genes for OGID (overgrowth and ID)
    explanation: >-
      Places CHD8 explicitly within the overgrowth-and-intellectual-disability
      disease group that constitutes this differential.
discussions:
- discussion_id: chd8_nec_boundary_vs_multifactorial_asd
  kind: INTERPRETATION
  prompt: >-
    Where exactly is the boundary between this monogenic CHD8 entity and the broad
    multifactorial autism spectrum disorder entry that also lists CHD8 as a risk
    gene?
  rationale: >-
    kb/disorders/Autism_Spectrum_Disorder.yaml lists CHD8 among many autism risk
    genes. That entry models the polygenic/multifactorial disease. This entry models
    the syndromic, autosomal dominant, highly penetrant disorder in which a single
    heterozygous CHD8 loss-of-function variant is sufficient. The two must not be
    merged, and evidence should not be moved between them: large-scale autism exome
    cohorts (e.g. PMID:22495309) belong in both as gene-discovery evidence, but
    CHD8-ascertained phenotype frequencies (macrocephaly, overgrowth, GI, sleep)
    belong only here. Practical rule applied during curation: any claim sourced from
    a cohort that was NOT ascertained on CHD8 genotype is admissible here only for
    gene-level statements.
- discussion_id: chd8_brain_overgrowth_causality_for_behaviour
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is brain overgrowth causally upstream of the autistic and cognitive phenotype in
    CHD8-NDD, or are the two parallel consequences of the same progenitor lesion?
  attaches_to:
  - pathophysiology#Brain Overgrowth and Megalencephaly
  rationale: >-
    Macrocephaly and autism co-segregate tightly in CHD8-NDD, and both are
    downstream of altered progenitor proliferation, but no experiment separates
    them. The edge from Brain Overgrowth and Megalencephaly to the behavioural
    outcome is therefore modelled as INDIRECT_UNKNOWN_INTERMEDIATES rather than as
    a supported direct cause.
  proposed_experiments:
  - experiment_id: chd8_exp_brain_size_vs_behaviour_rescue
    name: Temporally restricted CHD8 restoration in a Chd8+/- mouse that normalises brain size after the neurogenic window, testing whether behaviour is rescued independently of size.
  - experiment_id: chd8_exp_imaging_genetics_ohc_vs_severity
    name: Human imaging-genetics comparison of CHD8 variant carriers stratified by head circumference against behavioural severity.
- discussion_id: chd8_gut_brain_axis_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the gut-to-brain contribution to behaviour demonstrated in Chd8
    haploinsufficient mice operate in humans with CHD8-NDD?
  attaches_to:
  - pathophysiology#Gastrointestinal Dysmotility and Barrier Dysfunction
  rationale: >-
    In mice, gut-epithelial-restricted Chd8 haploinsufficiency alters anxiety-related
    behaviour and antibiotic treatment attenuates social deficits, implying a
    microbiota-dependent gut-to-brain arm. Nothing equivalent has been shown in
    humans, and the human GI phenotype is documented clinically (constipation)
    without any demonstrated behavioural consequence. Evidence exists in the model
    but its translational validity is the open question, so this is a
    HUMAN_MODEL_MISMATCH rather than a plain knowledge gap.
  proposed_experiments:
  - experiment_id: chd8_exp_human_gut_brain_cohort
    name: Prospective characterisation of GI symptom burden, intestinal permeability and microbiome composition in a CHD8-NDD cohort with paired behavioural measures.
- discussion_id: chd8_dystonia_female_preponderance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do the reported CHD8-related dystonia cases show an apparent female
    preponderance, and how frequent is dystonia in unselected CHD8-NDD cohorts?
  rationale: >-
    Every reported CHD8-related young-onset dystonia case to date has been female,
    and these individuals had minimal or absent cognitive and autistic features -
    the opposite of the classical presentation. Because the observation comes from
    small case series with obvious ascertainment bias, both the sex skew and the
    true frequency of dystonia remain unresolved; the frequency band here is taken
    from the GeneReviews "rare" descriptor, not from these series.
  evidence:
  - reference: PMID:38441608
    reference_title: "CHD8-related disorders redefined: an expanding spectrum of dystonic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work validates our previous observation that dystonia is part of the phenotypic spectrum of CHD8-related
    explanation: Source of the dystonia observation and the female-preponderance suggestion.
- discussion_id: chd8_megalencephaly_rodent_vs_primate_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is CHD8-related brain overgrowth in humans driven mainly by excess glial
    production, as the non-human primate data indicate, or by excess neural
    progenitor/neuronal output, as the rodent models are usually read to show?
  attaches_to:
  - pathophysiology#Increased Gliogenesis and White Matter Expansion
  - pathophysiology#Brain Overgrowth and Megalencephaly
  rationale: >-
    Rodent models produced inconsistent accounts of the macrocephaly mechanism, and
    mouse cortex is enlarged without a proportionate increase in neuron number. In
    cynomolgus monkey, CHD8 disruption before the gliogenic switch increases glial
    number and enlarges the brain. Because primate brains have a far larger glial
    complement and a much more protracted gliogenic period than rodent brains, this
    is plausibly a real species difference rather than a technical discrepancy - so
    the question is not whether the mouse result is reproducible but whether it
    translates. That is a translational-validity question about existing model
    evidence, which is why this is a HUMAN_MODEL_MISMATCH rather than a plain
    knowledge gap. Practical consequence: the entry keeps both the
    progenitor-proliferation route and the gliogenesis route as parallel edges
    into brain
    overgrowth rather than committing to one.
  proposed_experiments:
  - experiment_id: chd8_exp_human_postmortem_glia_neuron_ratio
    name: Cell-type-resolved quantification (single-nucleus RNA-seq or stereology) of glial versus neuronal number in post-mortem cortex from CHD8 variant carriers versus matched controls.
  - experiment_id: chd8_exp_human_white_matter_imaging
    name: Systematic volumetric and white-matter MRI characterisation of a CHD8-NDD cohort, testing whether white-matter expansion accounts for the increased head circumference as it does in the monkey.
  evidence:
  - reference: PMID:36878905
    reference_title: "CHD8 mutations increase gliogenesis to enlarge brain size in the nonhuman primate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, studies of small animal models showed inconsistent findings about the mechanisms for CHD8 deficiency-mediated autism symptoms and macrocephaly.
    explanation: >-
      States the rodent inconsistency that the primate work was designed to resolve.
- discussion_id: chd8_frequency_ascertainment_discrepancy
  kind: INTERPRETATION
  prompt: >-
    Which phenotype frequencies should this entry assert, given that CHD8 cohorts
    were ascertained in systematically different ways and report materially
    different numbers for the same features?
  rationale: >-
    The published cohorts disagree in a patterned, non-random way. Cohorts recruited
    through overgrowth clinics report near-universal overgrowth and intellectual
    disability; cohorts recruited through autism cohorts report high autism rates;
    the largest series is a literature aggregation across both and regresses toward
    lower values. Concretely: macrocephaly is 62.5% in the truncating-variant series
    and about 80% in GeneReviews; sleep disturbance is 50% versus 29%; hypotonia is
    27%-29% across two cohorts versus "about 30%" in GeneReviews. The convention
    applied in this entry is to band on the figure defensible across sources rather
    than the highest available one, to cite the quantitative statement itself as
    evidence for each band per the project's frequency-evidence guidelines, and to
    record the disagreeing figure alongside it rather than suppress it. Where the
    sources cannot be reconciled into a band at all, `frequency:` is omitted.
  evidence:
  - reference: PMID:31001818
    reference_title: "The clinical presentation caused by truncating CHD8 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a pattern of common features: macrocephaly (62.5%), tall stature (47%), developmental delay and/or intellectual disability (81%), ASDs (84%), sleep difficulties (50%), gastrointestinal problems (40%), and distinct facial features
    explanation: >-
      The protein-truncating-variant cohort figures used as the primary quantitative
      anchor for several bands in this entry.
- discussion_id: chd8_neoplasia_not_established
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does CHD8-NDD carry an increased tumour risk, and should tumour surveillance be
    recommended?
  rationale: >-
    Two separate literatures could be mistaken for one. Somatic CHD8 alterations
    occur in sporadic microsatellite-instability-high gastric and colorectal
    cancers, and a retrospective aggregation of CHD8-NDD individuals recorded
    neoplasia in a minority. Neither establishes a germline tumour predisposition:
    the tumour types, comparison to population baseline, and causality are not
    established, and the GeneReviews management section - which would be expected to
    flag a tumour risk - does not recommend tumour surveillance. This entry
    therefore asserts no tumour phenotype and no surveillance recommendation. The
    point matters clinically because two conditions in this entry's differential
    (PTEN hamartoma tumor syndrome and Beckwith-Wiedemann syndrome) do carry defined
    tumour risk, so conflating them with CHD8-NDD in either direction would be
    harmful.
  proposed_experiments:
  - experiment_id: chd8_exp_cancer_incidence_registry_linkage
    name: Registry linkage of a molecularly confirmed CHD8-NDD cohort to national cancer registries, with age- and sex-standardised incidence ratios against population baseline.
- discussion_id: chd8_genetic_background_modifier
  kind: OPEN_QUESTION
  prompt: >-
    Is the marked clinical variability of CHD8-NDD - which extends from severe
    intellectual disability with autism to an isolated adult focal dystonia in a
    cognitively intact individual - driven by genetic background rather than chance?
  rationale: >-
    Crossing a Chd8 mutation across a mouse genetic reference panel produced strain-
    and sex-dependent trait disruptions, including effects in opposite directions on
    different backgrounds and frank resilience on others. That is a designed
    experiment rather than a post-hoc observation, and it makes modifier-driven
    variability a serious hypothesis for the human disorder. No human modifier locus
    has been mapped, so no MODIFIER-typed gene record is asserted in the `genetic:`
    section. The practical implication for counselling is that intrafamilial
    variability should be expected, as the documented paternal-transmission case
    shows.
  proposed_experiments:
  - experiment_id: chd8_exp_human_polygenic_modifier_analysis
    name: Polygenic background and rare-variant modifier analysis within a molecularly confirmed CHD8-NDD cohort phenotyped on a common severity instrument.
  evidence:
  - reference: PMID:36738737
    reference_title: "Mouse population genetics phenocopies heterogeneity of human Chd8 haploinsufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Some strains exhibited large effect-size trait disruptions, sometimes in opposite directions, and-remarkably-others expressed resilience.
    explanation: >-
      Demonstrates background-dependent modification of the same Chd8 lesion,
      including resilience.

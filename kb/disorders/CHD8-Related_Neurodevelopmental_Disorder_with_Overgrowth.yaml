    description: Developmental pharmacologic experiments support a serotonin contribution to the fly sleep phenotype.
    causal_link_type: DIRECT
- name: Sleep Fragmentation
  description: Kismet mutants show fragmented sleep and reduced total sleep time with preserved sleep latency. Adult sleep restriction improves sleep efficiency and fragmentation but not total sleep duration. CHD8 patient questionnaires independently identify both onset and maintenance difficulties; the precise human mechanism remains unresolved.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  evidence:

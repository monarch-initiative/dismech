differential_diagnoses:
- name: Autism Spectrum Disorder (multifactorial)
  disease_term:
    preferred_term: autism spectrum disorder
    term:
      id: MONDO:0005258
      label: autism spectrum disorder
  description: >-
    Autism has many genetic and non-genetic contributors. A pathogenic CHD8 variant identifies a molecularly defined neurodevelopmental disorder that may include autism, overgrowth, sleep and gastrointestinal findings.
  distinguishing_features:
  - A pathogenic or likely pathogenic CHD8 variant, interpreted with the phenotype, distinguishes this disorder; macrocephaly and tall stature are useful but not obligatory clues.
  evidence:
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that CHD8 disruptions define a distinct ASD subtype and reveal unexpected comorbidities between brain development and enteric innervation.
    explanation: >-
      Explicitly frames CHD8 disruption as defining a distinct subtype separable
      from autism at large.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: CHARGE Syndrome (CHD7)
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  description: >-
    This distinct disorder involves the paralogous gene CHD7. Similar gene names and overlapping developmental features do not make its evidence interchangeable with CHD8-NDD.
  distinguishing_features:
  - Molecular confirmation of the responsible CHD7 variant distinguishes this diagnosis from a CHD8-associated disorder.
- name: CHD2-Related Developmental and Epileptic Encephalopathy
  disease_term:
    preferred_term: CHD2-related developmental and epileptic encephalopathy
    term:
      id: MONDO:0014150
      label: developmental and epileptic encephalopathy 94
  description: >-
    This distinct disorder involves the paralogous gene CHD2. Similar gene names and overlapping developmental features do not make its evidence interchangeable with CHD8-NDD.
  distinguishing_features:
  - Molecular confirmation of the responsible CHD2 variant distinguishes this diagnosis from a CHD8-associated disorder.
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Less common features are hypotonia (about 30% of affected individuals), seizures (10%-15%), dystonia (rare), and Chiari I malformation (rare).
    explanation: >-
      Quantifies seizures as a minority feature in CHD8-NDD, distinguishing it from
      a primary epilepsy gene.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Sifrim-Hitz-Weiss Syndrome (CHD4)
  disease_term:
    preferred_term: Sifrim-Hitz-Weiss syndrome
    term:
      id: MONDO:0014946
      label: Sifrim-Hitz-Weiss syndrome
  description: >-
    This distinct disorder involves the paralogous gene CHD4. Similar gene names and overlapping developmental features do not make its evidence interchangeable with CHD8-NDD.
  distinguishing_features:
  - Molecular confirmation of the responsible CHD4 variant distinguishes this diagnosis from a CHD8-associated disorder.
- name: 14q11.2 Microdeletion Syndrome
  description: >-
    A contiguous deletion that includes CHD8 can produce CHD8 haploinsufficiency while additional deleted genes contribute to the presentation.
  distinguishing_features:
  - Copy-number analysis defines the deletion and other affected genes, including SUPT16H in the recurrent small interval. This is a route to CHD8 loss with potential additional effects, rather than an exclusion from the CHD8 spectrum.
  evidence:
  - reference: PMID:25257502
    reference_title: "Recurrent ∼100 Kb microdeletion in the chromosomal region 14q11.2, involving CHD8 gene, is associated with autism and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The minimal critical region, considering present and previous cases, contains the SUPT16H and CHD8 genes.
    explanation: >-
      Defines the minimal critical region and shows it is not CHD8 alone.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: 14q11.2 Microduplication (CHD8-SUPT16H) Syndrome
  disease_term:
    preferred_term: 14q11.2 microduplication syndrome
    term:
      id: MONDO:0016835
      label: 14q11.2 microduplication syndrome
  description: >-
    The reciprocal dosage disorder. Duplication of the same 14q11.2 segment
    containing CHD8 and SUPT16H also produces a neurodevelopmental phenotype, which
    is why CHD8 is described as requiring tight dosage control in both directions.
    Duplication cases are a separate entity and must not be folded into this entry.
  distinguishing_features:
  - >-
    Detected as a copy-number GAIN on chromosomal microarray rather than a
    loss-of-function sequence variant; neurodevelopmental severity is variable and
    at least one reported individual had normal intelligence; the duplication also
    spans SUPT16H so single-gene CHD8 triplosensitivity is not established.
  evidence:
  - reference: PMID:31823155
    reference_title: "Neurodevelopmental phenotype associated with CHD8-SUPT16H duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, a 14q11.2 microduplication syndrome, encompassing CHD8 and SUPT16H, has been described, highlighting the importance of a tight control of at least CHD8 gene-dosage for a normal development.
    explanation: >-
      Establishes the duplication entity and the bidirectional dosage sensitivity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31823155
    reference_title: "Neurodevelopmental phenotype associated with CHD8-SUPT16H duplication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on two patients with 14q11.2 microduplication encompassing CHD8 and SUPT16H, one of whom had normal intelligence.
    explanation: >-
      Documents the milder end of the duplication phenotype, distinguishing it from
      the deletion/loss-of-function disorder.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: PTEN Hamartoma Tumor Syndrome
  disease_term:
    preferred_term: PTEN hamartoma tumor syndrome
    term:
      id: MONDO:0017623
      label: PTEN hamartoma tumor syndrome
  description: >-
    PTEN-related disease can also present with macrocephaly and autism and carries an established tumor-predisposition phenotype.
  distinguishing_features:
  - PTEN-related hamartomas and characteristic tumor risk distinguish the condition. CHD8 overgrowth is variable and may be disproportionately cranial; head-to-height proportionality is not a reliable exclusion rule. An increased germline malignancy risk has not been established for CHD8-NDD.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK585456/
    reference_title: CHD8-Related Neurodevelopmental Disorder with Overgrowth - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: there is no current evidence that individuals with ... are at increased risk for developing cancer
    explanation: The chapter distinguishes somatic cancer observations from established germline risk.
- name: Other Overgrowth-with-Intellectual-Disability Syndromes
  description: >-
    Sotos, Weaver, Tatton-Brown-Rahman and Malan syndromes are overlapping overgrowth/neurodevelopmental diagnoses. Beckwith-Wiedemann syndrome is an overgrowth differential with a different characteristic phenotype; intellectual disability is not its defining feature.
  distinguishing_features:
  - Molecular diagnosis and syndrome-specific findings distinguish these conditions. Lateralized overgrowth, macroglossia and embryonal tumor risk particularly support Beckwith-Wiedemann syndrome. Methylation testing can contribute in appropriate cases but is not uniformly diagnostic across this differential.
  evidence:
  - reference: PMID:31001818
    reference_title: "The clinical presentation caused by truncating CHD8 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD8 is one of the causative genes for OGID (overgrowth and ID)
    explanation: >-
      Places CHD8 explicitly within the overgrowth-and-intellectual-disability
      disease group that constitutes this differential.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
discussions:
- discussion_id: chd8_nec_boundary_vs_multifactorial_asd
  kind: INTERPRETATION
  prompt: >-
    Where exactly is the boundary between this monogenic CHD8 entity and the broad
    multifactorial autism spectrum disorder entry that also lists CHD8 as a risk
    gene?
  rationale: >-
    Pathogenic CHD8 variants define a molecular neurodevelopmental disorder with variable autism penetrance. Broad autism studies support gene discovery but cannot supply CHD8-specific phenotype frequencies without a separable genotype subgroup. CHD7, CHD2 and CHD4 disorders require their own evidence.
- discussion_id: chd8_brain_overgrowth_causality_for_behaviour
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is brain overgrowth causally upstream of the autistic and cognitive phenotype in
    CHD8-NDD, or are the two parallel consequences of the same progenitor lesion?
  attaches_to:
  - pathophysiology#Brain Overgrowth and Megalencephaly
  rationale: >-
    Brain enlargement and neurobehavioral differences coexist in several models, but neither the human clinical cohorts nor the cited experiments establish brain size as the causal mediator. They are therefore represented as potentially parallel consequences; a causal edge from brain overgrowth to autism is not asserted.
  proposed_experiments:
  - experiment_id: chd8_exp_brain_size_vs_behaviour_rescue
    name: Temporally restricted CHD8 restoration in a Chd8+/- mouse that normalises brain size after the neurogenic window, testing whether behaviour is rescued independently of size.
  - experiment_id: chd8_exp_imaging_genetics_ohc_vs_severity
    name: Human imaging-genetics comparison of CHD8 variant carriers stratified by head circumference against behavioural severity.
- discussion_id: chd8_gut_brain_axis_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the gut-to-brain contribution to behaviour demonstrated in Chd8
    haploinsufficient mice operate in humans with CHD8-NDD?
  attaches_to:
  - pathophysiology#Intestinal Barrier Impairment
  - pathophysiology#Gastrointestinal Dysmotility
  rationale: >-
    Gut-epithelial conditional Chd8 loss increases selected anxiety measures while preserving sociability. Antibiotics improve selected behaviors in a separate systemic heterozygous model. Neither experiment establishes human gut-to-brain causality, a human barrier lesion, or antibiotic treatment efficacy. Stool transit is unchanged in the mouse permeability study.
  proposed_experiments:
  - experiment_id: chd8_exp_human_gut_brain_cohort
    name: Prospective characterisation of GI symptom burden, intestinal permeability and microbiome composition in a CHD8-NDD cohort with paired behavioural measures.
- discussion_id: chd8_dystonia_female_preponderance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do the reported CHD8-related dystonia cases show an apparent female
    preponderance, and how frequent is dystonia in unselected CHD8-NDD cohorts?
  rationale: >-
    The 2021 and 2024 movement-disorder reports describe five women with variable cognitive involvement. Their ascertainment does not determine population frequency or an exclusive sex effect. The 2025 inherited-variant case includes dystonia with substantial developmental difficulties, further broadening the presentation.
  evidence:
  - reference: PMID:38441608
    reference_title: "CHD8-related disorders redefined: an expanding spectrum of dystonic phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work validates our previous observation that dystonia is part of the phenotypic spectrum of CHD8-related
    explanation: Source of the dystonia observation and the female-preponderance suggestion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: chd8_megalencephaly_rodent_vs_primate_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    How much do progenitor proliferation, neuronal production and gliogenesis each contribute to human CHD8-related brain overgrowth?
  attaches_to:
  - pathophysiology#Increased Gliogenesis
  - pathophysiology#White Matter Expansion
  - pathophysiology#Brain Overgrowth and Megalencephaly
  rationale: >-
    Primate results support a glial contribution in a very small, heterogeneous edited series. Mouse effects vary with dosage and timing, and some heterozygotes show enlargement without detectable progenitor proliferation changes. These experiments do not isolate species as the explanation or establish a dominant glial mechanism in humans.
  proposed_experiments:
  - experiment_id: chd8_exp_human_postmortem_glia_neuron_ratio
    name: Cell-type-resolved quantification (single-nucleus RNA-seq or stereology) of glial versus neuronal number in post-mortem cortex from CHD8 variant carriers versus matched controls.
  - experiment_id: chd8_exp_human_white_matter_imaging
    name: Systematic volumetric and white-matter MRI characterisation of a CHD8-NDD cohort, testing whether white-matter expansion accounts for the increased head circumference as it does in the monkey.
  evidence: []
- discussion_id: chd8_frequency_ascertainment_discrepancy
  kind: INTERPRETATION
  prompt: >-
    Which phenotype frequencies should this entry assert, given that CHD8 cohorts
    were ascertained in systematically different ways and report materially
    different numbers for the same features?
  rationale: >-
    The cohorts overlap and differ in recruitment, age, definitions and available-data denominators. Ever-macrocephalic status differs from macrocephaly at examination; combined autism/traits differs from formal diagnosis. The 2022 study assembled 106 individuals but excluded five uncertain variants from its main analysis. Context-specific frequencies preserve these distinctions instead of treating the estimates as independent population measurements.
  evidence:
  - reference: PMID:31001818
    reference_title: "The clinical presentation caused by truncating CHD8 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a pattern of common features: macrocephaly (62.5%), tall stature (47%), developmental delay and/or intellectual disability (81%), ASDs (84%), sleep difficulties (50%), gastrointestinal problems (40%), and distinct facial features
    explanation: >-
      The protein-truncating-variant cohort figures used as the primary quantitative
      anchor for several bands in this entry.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: chd8_neoplasia_not_established
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does CHD8-NDD carry an increased tumour risk, and should tumour surveillance be
    recommended?
  rationale: >-
    The 2022 aggregation explicitly lists six neoplasms among 54 individuals with information: three glabellar hemangiomas, one fibroma, one fibrosarcoma and one uterine leiomyoma. Thus the tumor types are known, but an excess incidence or causal germline predisposition is not established. GeneReviews reports no evidence of increased malignancy risk and no published tumor-screening guidelines; this is not an explicit recommendation against surveillance. Somatic CHD8 alterations in cancer require separate interpretation.
  proposed_experiments:
  - experiment_id: chd8_exp_cancer_incidence_registry_linkage
    name: Registry linkage of a molecularly confirmed CHD8-NDD cohort to national cancer registries, with age- and sex-standardised incidence ratios against population baseline.
  evidence:
  - reference: PMID:36182950
    reference_title: The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'Neoplasia was seen in six individuals (11%, 6/54): glabellar hemangioma in three, fibroma in one, fibrosarcoma in one, and uterine leiomyoma in one individual.'
    explanation: The full text identifies the lesions; the retrospective count does not establish increased cancer incidence.
- discussion_id: chd8_genetic_background_modifier
  kind: OPEN_QUESTION
  prompt: >-
    Is the marked clinical variability of CHD8-NDD - which extends from severe
    intellectual disability with autism to an isolated adult focal dystonia in a
    cognitively intact individual - driven by genetic background rather than chance?
  rationale: >-
    A single Chd8 allele tested across 33 mouse genetic backgrounds produces sex- and trait-dependent effects, including opposite directions and resilience for particular traits. This demonstrates model modifiers without identifying a human modifier locus or showing that every discrepancy between models is genetic background. Human allele, age, ascertainment and developmental differences also remain relevant.
  proposed_experiments:
  - experiment_id: chd8_exp_human_polygenic_modifier_analysis
    name: Polygenic background and rare-variant modifier analysis within a molecularly confirmed CHD8-NDD cohort phenotyped on a common severity instrument.
  evidence:
  - reference: PMID:36738737
    reference_title: "Mouse population genetics phenocopies heterogeneity of human Chd8 haploinsufficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Some strains exhibited large effect-size trait disruptions, sometimes in opposite directions, and-remarkably-others expressed resilience.
    explanation: >-
      Demonstrates background-dependent modification of the same Chd8 lesion,
      including resilience.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: chd8_pain_self_injury_specificity
  kind: KNOWLEDGE_GAP
  prompt: Does gastrointestinal pain contribute to self-injury specifically in CHD8-NDD?
  attaches_to:
  - phenotypes#Self-Injurious Behavior
  rationale: A 112-person mixed-gene cohort found an association between severe abdominal pain and self-injury, but did not establish a CHD8-specific effect or causal direction. Prospective symptom and pain assessment within CHD8 cohorts could test this possibility.
  evidence:
  - reference: PMID:33175317
    reference_title: 'Brief Report: Associations Between Self-injurious Behaviors and Abdominal Pain Among Individuals with ASD-Associated Disruptive Mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: History of severe abdominal pain was associated with SIB status and severity in a cohort of 112 individuals with disruptive mutations to ASD-associated genes.
    explanation: The pooled association motivates a CHD8-specific question without answering it.
- discussion_id: chd8_developmental_rescue_window
  kind: KNOWLEDGE_GAP
  prompt: Which CHD8-dependent outcomes remain reversible after neurodevelopment?
  attaches_to:
  - pathophysiology#Premature Ventral Progenitor Differentiation
  - pathophysiology#CHD8 Haploinsufficiency
  rationale: Mouse endogenous-locus restoration prevents selected behavioral abnormalities when performed during midfetal development or in ventral progenitors. This does not establish postnatal reversal. A separate human neural-culture preprint supports enhancer-targeted dosage restoration. Human delivery, dosage control, developmental timing and outcome-specific reversibility remain open questions.
  evidence:
  - reference: PMID:42203765
    reference_title: Defective ventral neurogenesis due to midfetal Chd8 mutation drives autistic-like behavior in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The genetic rescue of Chd8 expression at E14.5 or before, but not at E17.5 or after, ameliorated autistic-like behavior
    explanation: Prenatal genetic restoration prevents selected mouse behavioral abnormalities; later restoration in the tested windows did not reproduce the benefit.

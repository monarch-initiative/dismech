- name: Premature Ventral Progenitor Differentiation
  description: Midfetal induction of Chd8 heterozygous deletion in mouse neural stem cells accelerates ventral progenitor cell-cycle exit and differentiation toward interneuron and oligodendrocyte lineages. The corresponding dorsal cortical measures are unchanged. Genetic restoration in Olig1-expressing ventral progenitors normalizes differentiation and ameliorates behavioral abnormalities, supporting a developmental contribution in this mouse model.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:42203765
    reference_title: Defective ventral neurogenesis due to midfetal Chd8 mutation drives autistic-like behavior in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a significantly higher proportion of Ki67-negative EdU+ cells (cells that had exited the cell cycle) in the ganglionic eminence but not in the cortex
    explanation: E14.5-induced heterozygous deletion accelerates cell-cycle exit in ventral progenitors at E16.5.
  - reference: PMID:42203765
    reference_title: Defective ventral neurogenesis due to midfetal Chd8 mutation drives autistic-like behavior in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: restoration of Chd8 expression in ventral progenitor cells by Olig1-Cre resulted in normalization of the differentiation of progenitors of both interneurons and oligodendrocytes
    explanation: The genetic rescue supports a requirement for ventral CHD8 dosage.
  downstream:
  - target: Abnormal Neural Development
    description: Ventral genetic rescue reduces mouse behavioral phenotypes; the lineage-level route to adult circuitry and transfer to human symptoms remain incompletely defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Excitatory-Inhibitory Neuronal Trajectory Imbalance
  description: Engineered female H9 embryonic-stem-cell cerebral organoids show earlier inhibitory-neuron production and delayed excitatory-neuron production around day 60, followed by excitatory expansion at day 120. These are transient lineage-proportion changes, not a measured functional excitation/inhibition ratio. The S62X allele, affecting only the long isoform, does not reproduce the enlargement of the other tested alleles.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:35385734
    reference_title: "CHD8 haploinsufficiency links autism to transient alterations in excitatory and inhibitory trajectories."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we find that CHD8 haploinsufficiency disrupted neurodevelopmental trajectories with an accelerated and delayed generation of, respectively, inhibitory and excitatory neurons that yields, at days 60 and 120, symmetrically opposite expansions in their proportions.
    explanation: >-
      Directly demonstrates the excitatory-inhibitory trajectory imbalance in a
      human isogenic model of CHD8 haploinsufficiency.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  biological_processes:

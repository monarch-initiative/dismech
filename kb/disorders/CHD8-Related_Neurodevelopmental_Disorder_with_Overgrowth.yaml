    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Intestinal Barrier Impairment
  description: Increased tracer permeability is measured in male Chd8L heterozygous mice. The fish study suggests barrier disturbance from morphology and inflammatory changes without directly measuring permeability. Neither result establishes a corresponding permeability defect or inflammatory bowel disease in human CHD8-NDD.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:

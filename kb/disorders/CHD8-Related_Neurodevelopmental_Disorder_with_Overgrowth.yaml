name: CHD8-Related Neurodevelopmental Disorder with Overgrowth
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- intellectual developmental disorder with autism and macrocephaly
- IDDAM
- CHD8 overgrowth syndrome
- CHD8-related neurodevelopmental disorder
- CHD8-NDD
- autism, susceptibility to, 18
- AUTS18
description: >-
  CHD8-related neurodevelopmental disorder with overgrowth (CHD8-NDD; MONDO:0014017,
  OMIM 615032, also catalogued as "intellectual developmental disorder with autism
  and macrocephaly"/IDDAM) is an autosomal dominant, highly penetrant monogenic
  neurodevelopmental syndrome caused by heterozygous loss-of-function variants in
  CHD8 (HGNC:20153) at 14q11.2. CHD8 encodes chromodomain helicase DNA-binding
  protein 8, an ATP-dependent chromatin remodeller that binds the promoters of a
  large network of neurodevelopmental and autism risk genes. Haploinsufficiency
  produces a recognisable clinical gestalt: generalised overgrowth with macrocephaly
  (usually apparent in infancy) and tall stature (usually emerging around puberty),
  developmental delay with disproportionate speech and motor delay, intellectual
  disability that is most often mild to moderate, autism spectrum disorder, a
  characteristic facies (broad forehead with prominent supraorbital ridges,
  hypertelorism/widely spaced eyes, depressed nasal bridge, long philtrum, large
  ears), sleep disturbance affecting both sleep initiation and maintenance, and
  gastrointestinal dysfunction dominated by constipation. Less frequent features
  include hypotonia (about 30%), seizures (10%-15%), and rarely dystonia and Chiari I
  malformation. Most probands carry a de novo variant, but inherited variants with
  markedly variable expressivity are documented.

  Entity scope (NEC boundary, see `discussions` and `differential_diagnoses`): this
  entry is the MONOGENIC CHD8 haploinsufficiency syndrome anchored on
  MONDO:0014017 / OMIM:615032 / RO:0004003 HGNC:20153. It is deliberately kept
  distinct from (i) broad multifactorial autism spectrum disorder, in which CHD8 is
  merely one of many risk genes recovered by large-scale exome studies - that
  polygenic/multifactorial entity is curated separately and must not be conflated
  with this syndrome; and (ii) the CHD paralogue disorders that are the most common
  sources of citation confusion - CHD7 (CHARGE syndrome), CHD2 (developmental and
  epileptic encephalopathy), and CHD4 (Sifrim-Hitz-Weiss syndrome). Large-scale
  autism exome-sequencing cohorts are cited here only for gene discovery and
  gene-level burden, never for CHD8-specific phenotype frequencies; those come from
  the GeneReviews chapter and CHD8-ascertained clinical series.

  biological_scale: MOLECULAR
  role: TRIGGER
  description: >-
    Heterozygous truncating, splice-disrupting and deletion alleles reduce functional CHD8 dosage. Approximately half-normal protein is measured in several engineered models, rather than in every patient. Haploinsufficiency is the principal mechanism; selected missense alleles can alter function without the same remodeling defect.

genetic:
- name: CHD8
  gene_term:
    preferred_term: CHD8
    term:
      id: hgnc:20153
      label: CHD8
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous loss-of-function variants in CHD8 at 14q11.2 - nonsense, frameshift
    and splice-site variants, and whole-gene deletions within the recurrent 14q11.2
    microdeletion - cause CHD8-NDD by haploinsufficiency. Missense variants also
    occur; the helicase-C (HELIC) domain is a genotype-phenotype hotspot associated
    with a more severe phenotype. CHD8 is the gene most frequently hit by de novo
    disruptive variants in autism exome studies, and truncating events are absent
    from large control cohorts. The MONDO entity used as this entry's anchor asserts
    RO:0004003 to HGNC:20153, verified with OAK.
  evidence:
  - reference: PMID:22495309
    reference_title: "Sporadic autism exomes reveal a highly interconnected protein network of de novo mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In proband exomes, recurrent protein-altering mutations were observed in two genes: CHD8 and NTNG1.
    explanation: >-
      Gene-discovery evidence: the original sporadic-autism exome study that
      identified recurrent de novo CHD8 mutations. Cited for discovery only, not for
      CHD8-specific phenotype frequencies.
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we resequenced the ASD-associated gene CHD8 in 3,730 children with developmental delay or ASD. We identified a total of 15 independent mutations; no truncating events were identified in 8,792 controls, including 2,289 unaffected siblings.
    explanation: >-
      Establishes the mutational burden and the absence of truncating CHD8 events in
      controls.
  - reference: PMID:31980904
    reference_title: "De novo variants in the Helicase-C domain of CHD8 are associated with severe phenotypes including autism, language disability and overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HELIC domain mutations were associated with a severe phenotype defined by a greater number of clinical features, lower verbal IQ, and a prominent, consistent pattern of overgrowth as measured by weight, height and head circumference.
    explanation: Documents the HELIC-domain genotype-phenotype correlation.
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 29 unique nonsense, 25 frameshift, 24 missense, and 12 splice site variants. Furthermore, two unique inframe deletions, one larger deletion (exons 26-28), and one translocation were observed.
    explanation: >-
      Defines the variant spectrum across the largest assembled cohort: truncating
      classes dominate, but missense variants are the second most numerous class.
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no significant difference in severity was observed between males and females, individuals with a missense variant were less severely affected.
    explanation: >-
      Reports a modest missense-versus-truncating severity difference and no sex
      difference in severity. PARTIAL because the missense finding is borderline,
      unreplicated, and confounded by the demonstration (PMID:38438524) that some
      CHD8 missense variants in autism patients are not causal at all - which would
      by itself dilute apparent severity in a missense group.
  - reference: PMID:25257502
    reference_title: "Recurrent \u223c100 Kb microdeletion in the chromosomal region 14q11.2, involving CHD8 gene, is associated with autism and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The minimal critical region, considering present and previous cases, contains the SUPT16H and CHD8 genes.
    explanation: >-
      Recurrent 14q11.2 microdeletion route to CHD8 haploinsufficiency; note the
      minimal region also contains SUPT16H, so deletion cases are not a pure CHD8
      lesion.
variants:
- name: CHD8 helicase-C (HELIC) domain truncating and missense variants
  gene:
    preferred_term: CHD8
    term:
      id: hgnc:20153
      label: CHD8
  description: >-
    Constitutive truncating variants in the helicase-C domain of CHD8 are seen in
    individuals with autism (and, somatically, in cancer) but not in the general
    population, and are associated with the most severe end of the CHD8-NDD
    phenotypic spectrum, including lower verbal IQ and a consistent overgrowth
    pattern.
  evidence:
  - reference: PMID:31980904
    reference_title: "De novo variants in the Helicase-C domain of CHD8 are associated with severe phenotypes including autism, language disability and overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we compiled a comprehensive list of CHD8 variants from the literature and databases, which revealed constitutive and somatic truncating variants in the HELIC (Helicase-C) domain in ASD and in cancer patients, respectively, but not in the general population.
    explanation: >-
      Documents the HELIC-domain variant class and its absence from the general
      population.
- name: CHD8 missense variants of uncertain causality
  gene:
    preferred_term: CHD8
    term:
      id: hgnc:20153
      label: CHD8
  description: >-
    Missense variants are the most common non-truncating CHD8 change reported in
    autism, and they are the principal variant-interpretation problem in this
    disorder. Functional testing across biochemical activity, embryonic stem cell
    neural differentiation and mouse behaviour showed that only high-prediction-score
    missense alleles produce autism-like phenotypes, so a CHD8 missense variant must
    not be assumed pathogenic without in silico support and, ideally, functional or
    episignature data.
  evidence:
  - reference: PMID:38438524
    reference_title: "The complex etiology of autism spectrum disorder due to missense mutations of CHD8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only mutations with high prediction scores gave rise to ASD-like phenotypes in mice, suggesting that not all CHD8 missense mutations detected in ASD patients are directly responsible for the development of ASD.
    explanation: >-
      Direct functional evidence that a subset of CHD8 missense variants found in
      autism patients are not causal.
diagnosis:
- name: Molecular Genetic Diagnosis of CHD8-NDD
  description: >-
    The diagnosis is molecular: identification of a heterozygous pathogenic or
    likely pathogenic CHD8 variant in a proband with a consistent phenotype
    (macrocephaly and/or tall stature with developmental delay and/or autism).
    Chromosomal microarray will detect the 14q11.2 whole-gene deletion route.
    For variants of uncertain significance, DNA methylation episignature testing
    and structural modelling have been used as adjunctive reclassification tools.
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CHD8-NDD is established in a proband by identification of a heterozygous pathogenic (or likely pathogenic) variant in CHD8 by molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:41407309
    reference_title: "Phenotypic Variability and Paternal Inheritance of a CHD8 Variant Causing Intellectual Developmental Disorder With Autism and Macrocephaly Confirmed by Epigenetic and Structural Analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenicity was confirmed through epigenetic signature testing (EpiSign), demonstrating characteristic methylation patterns and structural biology analysis, predicting significant protein destabilization.
    explanation: >-
      Illustrates episignature and structural modelling as VUS-reclassification
      adjuncts in this disorder.
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methylation analysis was performed for 13 patients, 11 of which showed the previously established episignature for IDDAM (85%) associated with CHD8 haploinsufficiency
    explanation: >-
      Establishes the CHD8/IDDAM peripheral-blood DNA methylation episignature and
      quantifies its sensitivity at 85% - so a negative episignature does not
      exclude the diagnosis.

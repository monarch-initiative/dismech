- name: Dysregulation of Neurodevelopmental Gene Networks
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_scale: MOLECULAR
  description: >-
    Reducing CHD8 to single-allele levels perturbs the expression of well over a
    thousand genes. Directly bound genes are dominated by chromatin and
    transcriptional regulators, while the indirectly down-regulated secondary
    network is dominated by brain-development programmes - synapse formation, neuron
    differentiation, cell adhesion, and axon guidance. This secondary network, not
    any single target, is the proximate cause of the neurodevelopmental phenotype.
  biological_processes:
  - preferred_term: synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
    modifier: DECREASED
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
    modifier: DECREASED
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25294932
    reference_title: "CHD8 regulates neurodevelopmental pathways associated with autism spectrum disorder in neural progenitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Suppressing CHD8 to levels comparable with the loss of a single allele caused altered expression of 1,756 genes, 64.9% of which were up-regulated.
    explanation: >-
      Establishes the scale and directionality of transcriptional dysregulation at a
      haploinsufficient CHD8 dose.
  - reference: PMID:25294932
    reference_title: "CHD8 regulates neurodevelopmental pathways associated with autism spectrum disorder in neural progenitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Genes indirectly down-regulated (i.e., without CHD8-binding sites) reflect pathways involved in brain development, including synapse formation, neuron differentiation, cell adhesion, and axon guidance, whereas CHD8-bound genes are strongly associated with chromatin modification and transcriptional regulation.
    explanation: >-
      Identifies the specific neurodevelopmental programmes carried by the secondary
      network.
  - reference: PMID:29668850
    reference_title: "Altered Neocortical Gene Expression, Brain Overgrowth and Functional Over-Connectivity in Chd8 Haploinsufficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genes involved in cell adhesion and axon guidance are particularly prominent amongst the downregulated transcripts.
    explanation: >-

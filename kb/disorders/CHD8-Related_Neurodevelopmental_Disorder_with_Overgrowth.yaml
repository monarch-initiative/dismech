- name: Delayed Cortical Spine Development
  description: A 2025 preprint reports lower dendritic spine density and increased spine formation in adolescent constitutive Chd8 heterozygous mice. Adult spine density and dynamics are normal. This is a transient structural phenotype and does not establish persistent synapse loss in patients.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:

- name: Chd8 exon-3 heterozygous mouse
  species: Mus musculus
  genotype: Constitutive exon-3 frameshift heterozygote on C57BL/6 background
  publication: PMID:29668850
  description: Approximately half-normal full-length protein, modest brain enlargement, delayed early motor reflexes and adult hypoactivity. The study reports heightened sociability, with no clear anxiety or repetitive-behavior phenotype; this is not uniform recapitulation of human autism.
  modeled_mechanisms:
  - target: Brain Overgrowth and Megalencephaly
    description: Models modest volumetric enlargement.
    evidence:
    - reference: PMID:29668850
      reference_title: "Altered Neocortical Gene Expression, Brain Overgrowth and Functional Over-Connectivity in Chd8 Haploinsufficient Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that Chd8 heterozygous mice display increased brain size, motor delay, hypertelorism, pronounced hypoactivity, and anomalous responses to social stimuli.
      explanation: Mouse heterozygote recapitulates brain overgrowth and hypertelorism.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Total brain increase is approximately 2.7% and depends on statistical threshold; body weight is reduced rather than generalized overgrowth.
    fidelity: MODERATE
  - target: Aberrant Long-Range Functional Connectivity
    description: Measures regional resting-state synchronization.
    evidence:

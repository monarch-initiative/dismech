- name: REST-Mediated Repression of Neuronal Genes
  biological_scale: MOLECULAR
  description: >-
    CHD8 physically interacts with the RE-1 silencing transcription factor (REST).
    When CHD8 is reduced, REST is abnormally activated and represses the
    transcription of many neuronal genes, providing one route by which a chromatin
    dosage lesion is converted into a global delay of the neuronal differentiation
    programme. REST activation has also been observed in autism brain tissue.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:

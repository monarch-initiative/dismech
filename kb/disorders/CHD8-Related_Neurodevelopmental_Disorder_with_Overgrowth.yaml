notes: >-
  Phenotype estimates come from small, differently ascertained and partly overlapping cohorts. The 2022 aggregation assembled 106 individuals, including 70 previously published and 36 new individuals, and excluded five uncertain variants from its main clinical analysis. Missing feature documentation may indicate either absence or nonreporting. GeneReviews summarizes management, while model-specific mechanisms require separate human validation. The Villa full text is the official institutional PDF of the 2022 Cell Reports article (PMID:35385734).

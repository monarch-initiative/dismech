- name: Developmental Glial Sleep Regulation Defect
  description: Developmental knockdown of fly kismet in glia, including subperineurial blood-brain-barrier glia, disrupts adult sleep. Adult-only knockdown does not reproduce the phenotype. Kismet is shared by the CHD7 and CHD8 families, limiting gene-specific human interpretation.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:34088660
    reference_title: "The CHD8/CHD7/Kismet family links blood-brain barrier glia and serotonin to ASD-associated sleep defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that Kismet is required in glia for early developmental and adult sleep architecture. This role localizes to subperineurial glia constituting the blood-brain barrier.
    explanation: >-
      Localises the sleep requirement to blood-brain-barrier glia in the sole
      CHD8/CHD7 ortholog.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:
  - target: Developmental Serotonin Excess
    description: Developmental glial kismet loss elevates serotonin in flies; this is not a measurement in CHD8 patients.
    causal_link_type: DIRECT
- name: Developmental Serotonin Excess
  description: 'Kismet-deficient flies show increased serotonin during development. Developmental pharmacologic reduction improves later sleep fragmentation, whereas adult treatment does not. Serotonin direction is tissue- and species-dependent: the stable chd8 zebrafish gut instead has fewer serotonin-producing cells.'
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:34088660
    reference_title: "The CHD8/CHD7/Kismet family links blood-brain barrier glia and serotonin to ASD-associated sleep defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that Kismet-related sleep disturbances are caused by high serotonin during development, paralleling a well-established but genetically unsolved autism endophenotype.
    explanation: >-
      Identifies developmental hyperserotonemia as the mediator of the sleep defect.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:

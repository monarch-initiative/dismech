    snippet: Ablation of Chd8 specifically in oligodendrocytes of mice impaired myelination, slowed action potential propagation
    explanation: The primary mouse study reports myelination and conduction abnormalities; Olig1 lineage specificity requires caution in light of its ventral interneuron progenitor expression.
  downstream:

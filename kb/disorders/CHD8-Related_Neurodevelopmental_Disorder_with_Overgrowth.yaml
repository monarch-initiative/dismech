    description: Altered adolescent spine development is a candidate contributor to circuit function; this link is provisional and based on a preprint.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
mechanistic_hypotheses:
- hypothesis_group_id: chd8_canonical_haploinsufficiency
  hypothesis_label: Canonical CHD8 haploinsufficiency
  status: CANONICAL
  description: >-
    Heterozygous loss of functional CHD8 dosage perturbs developmental transcriptional programs. Genetic cohorts, engineered models and a characteristic methylation episignature support haploinsufficiency. The downstream response depends on allele, dosage, cell type, developmental stage and genetic background.
- hypothesis_group_id: chd8_remodeling_independent_missense
  hypothesis_label: Remodelling-independent mechanism for a subset of missense alleles
  status: EMERGING
  description: >-
    Selected missense alleles produce experimental phenotypes with or without loss of chromatin-remodeling activity. This does not establish the clinical pathogenicity or benignity of every tested allele. A mirror methylation pattern in one person with p.Gly1322Arg suggests an alternative mechanism, but that variant remained uncertain and gain of function was not functionally demonstrated.
  evidence:
  - reference: PMID:38438524
    reference_title: "The complex etiology of autism spectrum disorder due to missense mutations of CHD8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we found that mutations with high scores cause ASD by mechanisms either dependent on or independent of loss of chromatin-remodeling function.
    explanation: >-
      The experimental study supports mechanistic heterogeneity among tested missense alleles; mouse behavior does not itself classify human variants.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one analysis was inconclusive, and one showing a possible gain-of-function signature instead of the expected haploinsufficiency signature was observed
    explanation: >-
      A single uncertain variant produced a mirror methylation pattern; gain of function remains a hypothesis.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
phenotypes:
- category: Growth
  name: Macrocephaly
  description: >-
    Head circumference may be enlarged from birth or increase during infancy. An 80% ever-macrocephalic rate in the founding series and a 52% rate at examination in the later aggregation use different definitions and overlapping patients.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  frequency: FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common findings are the development of macrocephaly (most often during infancy) and tall stature (most typically during puberty), which is often accompanied by ASD and/or DD/ID.
    explanation: >-
      GeneReviews names macrocephaly as one of the two most common findings of the
      syndrome.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:31001818
    reference_title: "The clinical presentation caused by truncating CHD8 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a pattern of common features: macrocephaly (62.5%), tall stature (47%), developmental delay and/or intellectual disability (81%), ASDs (84%), sleep difficulties (50%), gastrointestinal problems (40%), and distinct facial features
    explanation: >-
      Quantifies macrocephaly at 62.5% in a 25-person CHD8 protein-truncating-variant cohort. This is the quantitative basis for the FREQUENT (30-79%) band; VERY_FREQUENT is deliberately NOT used because cohort figures range from about 52% to 80% depending on ascertainment (see the phenotype description and the frequency-ascertainment discussion).
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to a high likelihood of an ASD diagnosis among patients bearing CHD8 mutations, characteristics enriched in this group included macrocephaly, distinct faces, and gastrointestinal complaints.
    explanation: >-
      The founding CHD8-ascertained cohort supports macrocephaly enrichment; later literature aggregations include overlapping patients.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      macrocephaly is a striking feature that was common, at birth (53%, 8/15) and at the age of examination (52%, 46/88)
    explanation: >-
      The largest assembled cohort quantifies macrocephaly at 52% (46/88) at
      examination, the lower of the two directly quantified series and the reason
      the band is FREQUENT rather than VERY_FREQUENT. The 53% at-birth figure has a
      denominator of only 15 and is not used for banding.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  phenotype_contexts:
  - population: 'Dingemans 2022: 101 individuals in the main phenotype analysis (106 assembled; five uncertain variants excluded)'
    frequency: FREQUENT

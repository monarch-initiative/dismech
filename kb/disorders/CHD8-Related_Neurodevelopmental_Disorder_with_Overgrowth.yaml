- name: Reduced Neuronal Chromatin Accessibility
  description: Conditional CHD8 deletion in human stem-cell-derived excitatory neurons reduces accessibility at CHD8-bound promoters, especially ETS-motif-containing sites. The strong genome-wide result is from homozygous deletion; heterozygous changes are modest and not statistically significant at the highlighted sites. This supplies experimental support for a chromatin-accessibility mechanism without equating binding maps with remodeling failure in patients.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36575212
    reference_title: The autism risk factor CHD8 is a chromatin activator in human neurons and functionally dependent on the ERK-MAPK pathway effector ELK1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: many more sites lost accessibility (1,481 peaks in homozygous KO) than gained accessibility (106 peaks in homozygous KO)
    explanation: ATAC-seq measures accessibility; the numerical result applies to complete deletion.
  - reference: PMID:36575212
    reference_title: The autism risk factor CHD8 is a chromatin activator in human neurons and functionally dependent on the ERK-MAPK pathway effector ELK1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The ATAC-seq peaks in the heterozygous knockout experiment at sites with moderate change (no statistical significance) also revealed similar results for ETS motif enrichment
    explanation: The heterozygous result is weaker and does not establish genome-wide closure in human disease.
  - reference: PMID:36575212
    reference_title: The autism risk factor CHD8 is a chromatin activator in human neurons and functionally dependent on the ERK-MAPK pathway effector ELK1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: CHD8 binding was specifically lost at ETS motif-containing CHD8 peaks upon ELK1 knockdown
    explanation: ELK1 perturbation supports recruitment of CHD8 to selected neuronal targets; ELK1 overexpression did not restore binding.
  downstream:
  - target: Dysregulation of Neurodevelopmental Gene Networks
    description: Loss of accessibility accompanies reduced transcription at direct neuronal targets, most strongly after homozygous deletion.
    causal_link_type: DIRECT
- name: Dysregulation of Neurodevelopmental Gene Networks
  description: Human neural progenitor knockdown changes expression of chromatin regulators and a secondary network enriched for neurodevelopmental genes. Sugathan et al. reported 1,756 nominally significant genes, of which 369 passed false-discovery correction. Control-cell binding maps identified 7,324 sites, but most expression changes lacked a nearby CHD8-binding site. These results support direct and indirect regulation; pathway enrichment does not itself demonstrate reduced synapse assembly or axon guidance.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/pmc/articles/PMC4210312/
    reference_title: CHD8 regulates neurodevelopmental pathways associated with autism spectrum disorder in neural progenitors - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 1,756 genes were differentially expressed ... 369 of which were significant
    explanation: The full text distinguishes nominal and multiple-testing-adjusted differential expression.
  - reference: PMID:25752243
    reference_title: The autism-associated chromatin modifier CHD8 regulates other autism risk genes during human neurodevelopment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: When we considered genes that showed the strongest dysregulation due to CHD8 knockdown, we found that ASD risk genes tended to be downregulated
    explanation: The knockdown experiment supports altered regulation of conserved neural targets.

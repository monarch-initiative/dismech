- name: CHD8 missense variants of uncertain causality
  gene:
    preferred_term: CHD8
    term:
      id: hgnc:20153
      label: CHD8
  description: >-
    A CHD8 missense variant requires clinical and genetic interpretation. Biochemical assays, cellular phenotypes, segregation and methylation signatures can contribute; computational scores or mouse behavior alone do not prove pathogenicity or benignity. Tested alleles can act with or without loss of remodeling activity.
  evidence:
  - reference: PMID:38438524
    reference_title: "The complex etiology of autism spectrum disorder due to missense mutations of CHD8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only mutations with high prediction scores gave rise to ASD-like phenotypes in mice, suggesting that not all CHD8 missense mutations detected in ASD patients are directly responsible for the development of ASD.
    explanation: >-
      This experimental study demonstrates heterogeneity among tested alleles, not a diagnostic rule for every human missense variant.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
diagnosis:
- name: Molecular Genetic Diagnosis of CHD8-NDD
  description: >-
    Diagnosis rests on a heterozygous pathogenic or likely pathogenic CHD8 variant interpreted with the phenotype. Broad neurodevelopmental/overgrowth panels, exome or genome sequencing, and copy-number analysis are appropriate routes; single-gene testing is rarely the preferred initial approach. A variant of uncertain significance does not establish or exclude the diagnosis. Episignature testing can provide adjunctive evidence; 11 positive results among 13 selected samples in the 2022 study are not a diagnostic sensitivity estimate. Protein structural modeling is computational evidence, not measured functional loss.
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of CHD8-NDD is established in a proband by identification of a heterozygous pathogenic (or likely pathogenic) variant in CHD8 by molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:41407309
    reference_title: "Phenotypic Variability and Paternal Inheritance of a CHD8 Variant Causing Intellectual Developmental Disorder With Autism and Macrocephaly Confirmed by Epigenetic and Structural Analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenicity was confirmed through epigenetic signature testing (EpiSign), demonstrating characteristic methylation patterns and structural biology analysis, predicting significant protein destabilization.
    explanation: >-
      The report combines an inherited missense variant, characteristic methylation findings and computational structural analysis; the latter is not a protein assay.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methylation analysis was performed for 13 patients, 11 of which showed the previously established episignature for IDDAM (85%) associated with CHD8 haploinsufficiency
    explanation: >-
      This selected-sample result supports an adjunctive role, not validated sensitivity or specificity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

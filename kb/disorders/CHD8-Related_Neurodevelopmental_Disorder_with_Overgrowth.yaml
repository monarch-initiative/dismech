    description: Increased oligodendroglial abundance accompanies enlarged white matter in edited primate tissue; a dominant human contribution is unestablished.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: White Matter Expansion
  description: Primate tissue and longitudinal imaging suggest altered white-matter growth, including an increased white-to-gray matter ratio in the surviving edited monkey. This is distinct from proving that glial excess is the principal cause of macrocephaly in people with CHD8 variants.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36878905
    reference_title: CHD8 mutations increase gliogenesis to enlarge brain size in the nonhuman primate.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: with enlarged white matter labeled by immunostaining of GFAP
    explanation: The stillborn edited monkey had enlarged brain tissue and white matter.
  downstream:
  - target: Brain Overgrowth and Megalencephaly
    description: White-matter expansion can contribute to overall brain enlargement in the primate model.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Brain Overgrowth and Megalencephaly
  description: Increased brain or head size recurs across several animal models; selected human cerebral organoids also enlarge. Progenitor expansion and altered gliogenesis are candidate contributions. Brain enlargement does not demonstrate that macrocephaly causes autism or intellectual disability. A 2025 mouse preprint found increased cortical volume without increased total neuron number or soma size, so enlargement cannot be assumed to reflect excess neurons.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:29668850
    reference_title: "Altered Neocortical Gene Expression, Brain Overgrowth and Functional Over-Connectivity in Chd8 Haploinsufficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that Chd8 heterozygous mice display increased brain size, motor delay, hypertelorism, pronounced hypoactivity, and anomalous responses to social stimuli.
    explanation: Mouse heterozygote recapitulates brain overgrowth and hypertelorism.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35385734
    reference_title: "CHD8 haploinsufficiency links autism to transient alterations in excitatory and inhibitory trajectories."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This imbalance is consistent with an enlargement of cerebral organoids as an in vitro correlate of patients' macrocephaly.
    explanation: >-
      Human cerebral organoid model links the cellular imbalance to enlargement,
      the in vitro correlate of macrocephaly.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40501938
    reference_title: Persistent cortical excitatory neuron dysregulation in adult Chd8 haploinsufficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We did not find significant differences in total neuron number in either the full cohort or sex-stratified analyses
    explanation: Stereology in the constitutive exon-5 mouse supports model-specific dissociation of cortical volume and neuron count; the source is a preprint.
  downstream:
  - target: Macrocephaly
    description: Greater brain volume can increase head circumference; clinical macrocephaly remains variable.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Aberrant Long-Range Functional Connectivity
  description: Resting-state fMRI in the exon-3 Chd8 heterozygous mouse shows increased synchronized activity in specific cortico-hippocampal and auditory-parietal networks. The result is a model observation, not an established human diagnostic signature. Organoid lineage proportions and transcriptional enrichment do not directly establish its cause. A separate awake Olig1-Cre mouse imaging study found regional microstructural differences and exploratory connectivity changes; the connectivity comparisons did not survive multiple-testing correction, and that cohort did not reproduce increased social-contact time. Neither result establishes a universal direction of connectivity change.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:29668850
    reference_title: "Altered Neocortical Gene Expression, Brain Overgrowth and Functional Over-Connectivity in Chd8 Haploinsufficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Resting-state functional MRI identified increased synchronized activity in cortico-hippocampal and auditory-parietal networks in Chd8 heterozygous mutant mice, implicating altered connectivity as a potential mechanism underlying the behavioral phenotypes.
    explanation: >-
      Provides the functional-imaging evidence for altered long-range connectivity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:33228730
    reference_title: Chd8 mutation in oligodendrocytes alters microstructure and functional connectivity in the mouse brain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Although these differences did not survive multiple corrections, uncorrected statistics supported the alterations of functional connectivity
    explanation: Regional connectivity findings are exploratory; anatomical DTI results used separate corrected analyses.
  downstream:
  - target: Abnormal Neural Development
    description: Altered network organization is a candidate contributor to neurobehavioral effects; behavioral causality has not been isolated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Striatal Circuit Dysfunction
  description: Nucleus accumbens slices from Chd8 heterozygous mice show increased spontaneous excitatory currents and reduced miniature inhibitory-current amplitude, with unchanged miniature excitatory currents. Adult accumbens perturbation enhances acquired rotarod learning; this does not model impaired developmental motor milestones.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:28402856
    reference_title: Chd8 Mutation Leads to Autistic-like Behaviors and Impaired Striatal Circuits.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Perturbation of Chd8 in adult mice recapitulates improved acquired motor learning behavior found in Chd8+/- animals
    explanation: Adult perturbation identifies a striatal contribution to enhanced learned motor performance.
- name: Abnormal Neural Development
  description: Human CHD8 disease causes variable developmental, cognitive and behavioral dysfunction. Cellular and animal experiments identify several plausible developmental and circuit routes, but none establishes a unique pathway to each clinical feature. Motor, seizure and tone manifestations likewise have unresolved cellular intermediates.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:

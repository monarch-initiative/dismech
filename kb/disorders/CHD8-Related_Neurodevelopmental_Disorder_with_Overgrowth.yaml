        REST-driven repression of the neuronal programme is accompanied by a measurable delay in neurodevelopment in the same model.
- name: Altered Neural Progenitor Proliferation and Delayed Neuronal Differentiation
  biological_scale: CELLULAR
  description: >-
    The convergent cellular consequence of the transcriptional lesion. CHD8
    normally stimulates cell-cycle gene transcription while restraining premature
    induction of neural-specific genes; at reduced dose the balance between
    progenitor proliferation and differentiation is disturbed and neurodevelopment
    is globally delayed. In mouse models the effect is dosage-graded: heterozygous
    and mildly hypomorphic animals show increased proliferation of intermediate
    progenitors and brain hyperplasia, whereas severe depletion flips the phenotype
    to p53-driven apoptosis and brain hypoplasia.

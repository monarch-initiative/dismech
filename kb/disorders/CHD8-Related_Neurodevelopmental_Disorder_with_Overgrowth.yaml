- name: Reduced Aged-Cortex Proteostasis Response Signature
  description: Twelve-month-old male Chd8 p.Val986* heterozygous mice have reduced expression of unfolded-protein-response and chaperone pathways, accompanied by lower phospho-S6 staining. Whether these changes reflect impaired proteostasis, lower stress, or a blunted response remains unresolved. Most effects are small, selected individual genes are only nominal trends, and human progressive neurodegeneration is not established.

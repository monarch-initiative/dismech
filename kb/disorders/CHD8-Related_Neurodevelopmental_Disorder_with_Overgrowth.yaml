- name: NCT01238250
  status: RECRUITING
  description: >-
    Simons Searchlight is an observational international research program for people with rare genetic changes, including CHD8. It collects medical, behavioral, learning and developmental information; it is not a CHD8-directed interventional treatment trial.
  target_phenotypes:
  - preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: clinicaltrials:NCT01238250
    reference_title: "Online Study of People Who Have Genetic Changes and Features of Autism: Simons Searchlight"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simons Searchlight is an observational, online, international research program for families with rare genetic variants that cause neurodevelopmental disorders and may be associated with autism.
    explanation: >-
      Describes the registry that provides longitudinal natural-history data for
      CHD8 variant carriers.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

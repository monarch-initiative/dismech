- name: Shortened Neural Progenitor G1 Phase
  description: In one H9 embryonic-stem-cell-derived neural progenitor clone with heterozygous CHD8 disruption, live-cell FUCCI imaging shows a shorter G1 phase without an overt S/G2/M change. Increased cyclin-E expression and ERK phosphorylation accompany the change, but their necessity was not tested by rescue. Progenitor expansion and delayed differentiation are proposed consequences rather than directly measured fate outcomes. Other cerebral organoid experiments found increased proliferation without changed cell-cycle length.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: url:https://gala.gre.ac.uk/id/eprint/42417/1/42417_GETTI_Autism_associated_CHD8_keeps_proliferation_of_human_neural_progenitors.pdf
    reference_title: https://gala.gre.ac.uk/id/eprint/42417/1/42417_GETTI_Autism_associated_CHD8_keeps_proliferation_of_human_neural_progenitors.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Comparative analysis of phase duration across genotypes revealed a marked shortening of G1
    explanation: FUCCI imaging compared a single H9-derived heterozygous exon-4 frameshift clone with wild type; G1 medians were 517 and 1,408 minutes, respectively.
  - reference: url:https://gala.gre.ac.uk/id/eprint/42417/1/42417_GETTI_Autism_associated_CHD8_keeps_proliferation_of_human_neural_progenitors.pdf
    reference_title: https://gala.gre.ac.uk/id/eprint/42417/1/42417_GETTI_Autism_associated_CHD8_keeps_proliferation_of_human_neural_progenitors.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT

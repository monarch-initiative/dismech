    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      reduced expression of CHD8 was associated with abnormal activation of RE-1 silencing transcription factor (REST), which suppresses the transcription of many neuronal genes
    explanation: >-
      Identifies REST derepression of the neuronal programme as a CHD8-dosage
      consequence.
  downstream:

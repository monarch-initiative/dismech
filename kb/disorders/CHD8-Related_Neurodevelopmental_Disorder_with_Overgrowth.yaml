inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CHD8-NDD segregates as an autosomal dominant trait. The great majority of
    reported probands carry a de novo CHD8 pathogenic variant, but transmitted
    variants occur and can be associated with strikingly milder parental
    presentations, indicating variable expressivity.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHD8-NDD is inherited in an autosomal dominant fashion. However, most probands reported to date whose parents have undergone molecular genetic testing have the disorder as the result of a de novo CHD8 pathogenic variant.
    explanation: >-
      GeneReviews states autosomal dominant inheritance with a predominance of de
      novo variants.
  - reference: PMID:41407309
    reference_title: "Phenotypic Variability and Paternal Inheritance of a CHD8 Variant Causing Intellectual Developmental Disorder With Autism and Macrocephaly Confirmed by Epigenetic and Structural Analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the case of IDDAM caused by a paternally inherited CHD8 variant. Our findings highlight the importance of considering parental inheritance in IDDAM diagnoses
    explanation: >-
      Documents transmitted (non-de novo) inheritance with variable expressivity in
      an IDDAM family.
pathophysiology:
- name: CHD8 Haploinsufficiency
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  role: TRIGGER
  description: >-
    A heterozygous loss-of-function variant in CHD8 (nonsense, frameshift, splice,
    or a whole-gene 14q11.2 deletion) reduces functional chromodomain helicase
    DNA-binding protein 8 to roughly half of the normal dose. CHD8 is the root
    molecular lesion of the syndrome; the disorder is a dosage disease rather than a
    dominant-negative or gain-of-function condition, and truncating variants are
    essentially absent from population controls.
  gene:
    preferred_term: CHD8
    term:
      id: hgnc:20153
      label: CHD8
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodelling activity
    term:
      id: GO:0008094
      label: ATP-dependent activity, acting on DNA
    modifier: DECREASED
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:36302072
    reference_title: "CHD8-Related Neurodevelopmental Disorder with Overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CHD8-NDD is established in a proband by identification of a heterozygous pathogenic (or likely pathogenic) variant in CHD8 by molecular genetic testing.
    explanation: Establishes the heterozygous CHD8 variant as the defining molecular lesion.
  - reference: PMID:24998929
    reference_title: "Disruptive CHD8 mutations define a subtype of autism early in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we resequenced the ASD-associated gene CHD8 in 3,730 children with developmental delay or ASD. We identified a total of 15 independent mutations; no truncating events were identified in 8,792 controls, including 2,289 unaffected siblings.
    explanation: >-
      Complete absence of truncating CHD8 events in 8,792 controls supports
      loss-of-function/haploinsufficiency as the disease mechanism.
  - reference: PMID:30670789
    reference_title: "A distinct neurodevelopmental syndrome with intellectual disability, autism spectrum disorder, characteristic facies, and macrocephaly is caused by defects in CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      confirms our suggestion that this is a syndromic disorder caused by haploinsufficiency or heterozygous loss of function of CHD8
    explanation: States haploinsufficiency explicitly as the mechanism.
  downstream:
  - target: Failure of Chromatin Remodelling at CHD8 Target Promoters
    causal_link_type: DIRECT
    description: >-
      Halving CHD8 protein reduces occupancy and remodelling activity at the
      thousands of promoters CHD8 normally binds.
    evidence:
    - reference: PMID:25294932
      reference_title: "CHD8 regulates neurodevelopmental pathways associated with autism spectrum disorder in neural progenitors."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        CHD8 showed widespread binding to chromatin, with 7,324 replicated sites that marked 5,658 genes.
      explanation: >-
        Establishes that CHD8 dose is applied at thousands of chromatin sites, so a halving of protein acts at the promoter-occupancy step.
- name: Failure of Chromatin Remodelling at CHD8 Target Promoters
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_scale: MOLECULAR
  description: >-
    CHD8 binds chromatin very widely - thousands of replicated promoter-proximal
    sites in neural progenitors - and its target set is strongly enriched for other
    autism risk genes and for chromatin-modification and transcription-regulation
    genes. Reduced CHD8 dose therefore acts as a hub lesion: a limited set of direct
    binding-site effects is amplified into a far larger secondary transcriptional
    network.

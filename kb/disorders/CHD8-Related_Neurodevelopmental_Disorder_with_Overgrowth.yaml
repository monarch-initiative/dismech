- name: Altered Intestinal Epithelial Differentiation
  description: Mouse Chd8L haploinsufficiency changes intestinal epithelial transcription and reduces selected tuft and goblet cell populations. Small-intestinal goblet loss and colonic mucus thinning are anatomically distinct findings. Stable zebrafish mutants also show epithelial changes, with several adult findings strongest in homozygotes.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:37783686
    reference_title: "CHD8 regulates gut epithelial cell function and affects autism-related behaviors through the gut-brain axis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The current study found that mice haploinsufficient for the large isoform of Chd8 (Chd8L) exhibited increased intestinal permeability, transcriptomic dysregulation in gut epithelial cells, reduced tuft cell and goblet cell counts in the gut, and an overall increase in microbial load.
    explanation: >-
      Mammalian replication of the gut epithelial defect at a haploinsufficient
      Chd8 dose.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:

- name: Reduced Vagal Neural Crest Cell Pool
  description: Stable heterozygous p.Glu223* zebrafish have fewer vagal neural crest cells leaving the neural tube at 24 hours and an early migration delay. Later migration speed and arrival at the distal gut are preserved; a persistent failure of migration is not demonstrated.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36375841
    reference_title: Loss of autism-candidate CHD8 perturbs neural crest development and intestinal homeostatic balance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed a significant decrease in the number of NCCs released from the neural tube
    explanation: The early progenitor deficit is directly measured.
  downstream:
  - target: Reduced Enteric Neuron Abundance
    description: A smaller initial neural crest pool is a candidate explanation for fewer mature enteric neurons.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Enteric Neuron Abundance
  description: CHD8-disrupted zebrafish have fewer enteric neurons. The 2014 morpholino study reports an approximately halved count; the stable 2022 heterozygous mutant has a smaller reduction. Serotonergic enteric neurons and non-neuronal enterochromaffin cells are also reduced in the stable mutant. Human enteric-neuron depletion has not been demonstrated.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:

    snippet: Pathways associated with the unfolded protein response (UPR), endoplasmic reticulum (ER) stress, and chaperone-mediated protein folding were reduced
    explanation: The result is a cortical transcriptional signature at 12 months, not a direct measurement of protein-folding capacity.

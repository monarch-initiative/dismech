    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 29 unique nonsense, 25 frameshift, 24 missense, and 12 splice site variants. Furthermore, two unique inframe deletions, one larger deletion (exons 26-28), and one translocation were observed.
    explanation: >-
      The assembled variant spectrum includes nonsense, frameshift, missense, splice and structural alleles; uncertain variants were separately assessed.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no significant difference in severity was observed between males and females, individuals with a missense variant were less severely affected.

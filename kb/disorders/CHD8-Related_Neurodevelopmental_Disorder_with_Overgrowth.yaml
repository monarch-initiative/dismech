- name: Genetic Counseling
  description: >-
    Autosomal dominant counselling: each child of an affected individual has a 50%
    chance of inheriting the variant. Because most probands have a de novo variant,
    parental testing informs recurrence-risk estimates - and, as transmitted
    variants with very mild parental expression are documented, apparently
    unaffected parents should still be tested before recurrence risk is quoted as
    low. Once the familial variant is known, prenatal and preimplantation genetic
    testing are possible.

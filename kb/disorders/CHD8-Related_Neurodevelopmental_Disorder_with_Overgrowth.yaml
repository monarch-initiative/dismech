      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Resting-state functional MRI identified increased synchronized activity in cortico-hippocampal and auditory-parietal networks in Chd8 heterozygous mutant mice, implicating altered connectivity as a potential mechanism underlying the behavioral phenotypes.
      explanation: >-
        Provides the functional-imaging evidence for altered long-range connectivity.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Regional mouse fMRI under experimental conditions; no established human biomarker or causal behavioral mediation.
    fidelity: MODERATE
  - target: Increased Neural Progenitor Proliferation

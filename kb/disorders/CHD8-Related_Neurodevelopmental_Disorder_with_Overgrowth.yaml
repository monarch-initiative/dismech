- name: Impaired Wnt/beta-Catenin Signal Transduction
  biological_scale: MOLECULAR
  description: >-
    CHD8 interacts with beta-catenin and regulates the expression of key transducers
    of the Wnt pathway. Chd8 knockdown disrupts Wnt signalling during cortical
    development, and restoring Wnt signalling rescues the resulting transcriptional
    and behavioural deficits, making this a mechanistically load-bearing branch
    rather than a correlate. Wnt/chromatin-remodelling connectivity is also the
    network into which the most disruptive de novo autism mutations fall.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27694995
    reference_title: "Chd8 mediates cortical neurogenesis via transcriptional regulation of cell cycle and Wnt signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      knockdown of Chd8 disrupts the expression of key transducers of Wnt signaling, and enhancing Wnt signaling rescues the transcriptional and behavioral deficits caused by Chd8 knockdown
    explanation: >-
      Rescue by Wnt enhancement establishes the causal role of the Wnt branch.
  - reference: PMID:22495309
    reference_title: "Sporadic autism exomes reveal a highly interconnected protein network of de novo mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      39% (49 of 126) of the most severe or disruptive de novo mutations map to a highly interconnected β-catenin/chromatin remodelling protein network ranked significantly for autism candidate genes
    explanation: >-
      Places CHD8 within the beta-catenin/chromatin-remodelling network at the level
      of autism genetics; PARTIAL because this is cohort-level network evidence, not
      a CHD8-specific functional assay.

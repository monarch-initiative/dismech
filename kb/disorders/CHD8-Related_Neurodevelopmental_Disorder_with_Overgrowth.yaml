- name: REST-Mediated Repression of Neuronal Genes
  description: Reduced CHD8 is associated with enhanced REST-mediated repression in the Katayama mouse model, most prominently around E14.5. Neurodevelopmental gene-set timing is delayed in that model. REST activity has not been shown to explain every CHD8 allele or all human manifestations.

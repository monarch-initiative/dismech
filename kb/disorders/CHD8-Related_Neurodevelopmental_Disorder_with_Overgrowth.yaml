mechanistic_hypotheses:
- hypothesis_group_id: chd8_canonical_haploinsufficiency
  hypothesis_label: Canonical CHD8 haploinsufficiency
  status: CANONICAL
  description: >-
    The mainstream model: a heterozygous loss-of-function variant halves CHD8
    protein, reducing ATP-dependent chromatin remodelling at CHD8-bound promoters
    and dysregulating a large secondary network of neurodevelopmental and autism
    risk genes. Supported by the complete absence of truncating CHD8 variants in
    8,792 controls, by the DNA-methylation episignature associated with CHD8
    haploinsufficiency, and by dose-matched heterozygous animal models. This is the
    model the main pathophysiology chain in this entry represents.
- hypothesis_group_id: chd8_remodeling_independent_missense
  hypothesis_label: Remodelling-independent mechanism for a subset of missense alleles
  status: EMERGING
  description: >-
    A minority model with real support: not every CHD8 missense variant found in
    autism patients is causal, and among those that are, some act by a mechanism
    that does NOT involve loss of chromatin-remodelling function. Independently, one
    individual in the largest cohort showed a possible gain-of-function methylation
    signature rather than the expected haploinsufficiency signature. Together these
    imply that "haploinsufficiency" is an incomplete description of the molecular
    etiology and that the pathophysiology graph should not be read as forcing every
    pathogenic allele through the single remodelling node.
  evidence:
  - reference: PMID:38438524
    reference_title: "The complex etiology of autism spectrum disorder due to missense mutations of CHD8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we found that mutations with high scores cause ASD by mechanisms either dependent on or independent of loss of chromatin-remodeling function.
    explanation: >-
      Direct functional demonstration that some pathogenic CHD8 missense alleles act
      independently of chromatin-remodelling loss.
  - reference: PMID:36182950
    reference_title: "The phenotypic spectrum and genotype-phenotype correlations in 106 patients with variants in major autism gene CHD8."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one analysis was inconclusive, and one showing a possible gain-of-function signature instead of the expected haploinsufficiency signature was observed
    explanation: >-
      A single human episignature observation consistent with a non-haploinsufficiency
      mechanism; PARTIAL because it is one individual and the signature is described
      only as "possible".

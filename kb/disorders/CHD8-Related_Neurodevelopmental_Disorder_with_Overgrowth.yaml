notes: >-
  Provenance. Deep research was run with the `claude_code` provider
  (`just research-disorder claude_code CHD8-Related_Neurodevelopmental_Disorder_with_Overgrowth`;
  report at research/CHD8-Related_Neurodevelopmental_Disorder_with_Overgrowth-deep-research-claude_code.md,
  1,602 lines, 29 web searches, 78 turns). The report itself warns that its quoted
  snippets are model-summarised rather than verbatim; accordingly EVERY PMID cited
  in this entry was independently fetched with `just fetch-reference` and every
  snippet was copy-pasted from the cached abstract and verified by
  `just validate-references`. Several claims present in the research report were
  dropped because the cached abstract did not contain a quotable sentence for them
  (see items 1 and 2 below).

  NEC boundary. The mandatory preflight was re-run before any content was written:
  `uv run runoak -i sqlite:obo:mondo info MONDO:0014017 -O obo` returns
  `relationship: RO:0004003 HGNC:20153 ! CHD8` and `xref: OMIM:615032`, matching the
  target exactly. Every citation in this entry was checked to be about CHD8 and not
  a CHD paralogue; CHD7 (CHARGE), CHD2 (developmental and epileptic encephalopathy)
  and CHD4 (Sifrim-Hitz-Weiss) are recorded as explicit differential diagnoses for
  that reason. The one genuine cross-gene citation, PMID:34088660, studies
  Drosophila `kismet`, which is the SOLE ortholog of both CHD8 and CHD7 - this is
  stated in the node description rather than glossed over, and the node is marked
  MODEL_ORGANISM. PMID:33175317 is a multi-gene autism-risk-gene cohort, not a CHD8
  cohort, and is marked PARTIAL for that reason.

  Deliberate omissions and honest gaps.

  (1) No `prevalence` record is asserted. No population-based prevalence estimate for
  CHD8-NDD exists. The figures in circulation (about 0.2%-0.4% of autism cohorts,
  about 2% of macrocephalic autism probands, 1.7% of
  overgrowth-plus-intellectual-disability) are diagnostic YIELDS within
  ascertained cohorts, not population
  occurrence, and the structured Prevalence class would misrepresent them. Those
  yields also appear only in the GeneReviews chapter body, not in the cached
  structured abstract, so no verified snippet is available for them either.
  Orphanet has a record for this entity (Orphanet:642675, "CHD8 overgrowth
  syndrome") but it is absent from this repository's ORPHA reference cache, so no
  ORPHA-sourced epidemiology row could be quoted.

  (2) CORRECTED at review (PR #7603). This note previously claimed that figures
  appearing only in a paper's body text were unquotable because the cache holds only
  the abstract. That is wrong for PMID:36182950: its cache is a full-text capture and
  the reference validator matches against the whole cached body, not just the
  abstract. The Dingemans body-text figures are therefore now cited directly -
  macrocephaly at examination 52% (46/88), tall stature 50% (39/78), and overweight
  34% (24/71), the last of which is curated as its own Growth phenotype
  (`HP:0025502`, FREQUENT: 24/71 = 33.8%). The correction does NOT extend to
  GeneReviews: the PMID:36302072 cache is a 92-line structured summary, not the full
  chapter, so the Table 2 percentage grid is genuinely absent from it and remains
  uncited. The distinction is per-reference - each cache must be checked for what it
  actually contains rather than assumed to be abstract-only. Frequency bands
  that still rest on cross-cohort judgement rather than a single figure are explained
  in the `chd8_frequency_ascertainment_discrepancy` discussion.

  (3) Frequency bands were set on the figure defensible across cohorts rather than
  the highest available. Macrocephaly and autism spectrum disorder are banded
  FREQUENT, not VERY_FREQUENT, because the quantified series bracket rather than
  clear the 80% threshold. Hypotonia is banded OCCASIONAL because two independent
  cohorts report 27% and 29% against the GeneReviews "about 30%". Several
  phenotypes carry no band at all - diarrhoea, anxiety, ADHD, self-injurious
  behaviour and every craniofacial feature - because the sources describe them
  qualitatively only.

  (4) The distinctive facial gestalt is curated as individual HPO-bound features
  rather than one "characteristic facies" phenotype, because that is what the
  primary series enumerate. Reported forehead- and dental-abnormality rates near
  90% are not curated: their denominators (18 and 11) reflect assessment only when
  a dysmorphologist examined the patient, which makes them uninterpretable as
  population frequencies.

  (5) No tumour phenotype and no tumour surveillance are asserted, despite an 11%
  neoplasia figure in one retrospective aggregation and a separate somatic
  CHD8-in-cancer literature. See the `chd8_neoplasia_not_established` discussion for
  the full reasoning; this is a deliberate refusal, not an oversight.

  (6) The mechanism graph is single-rooted at CHD8 Haploinsufficiency, with all 15
  nodes reachable from it over 20 causal edges. Terminal edges into the behavioural
  outcome are typed INDIRECT_UNKNOWN_INTERMEDIATES because the causal step from
  brain overgrowth, altered connectivity, striatal dysfunction or disrupted sleep to
  the behavioural phenotype is not experimentally established in humans.

  (7) Much of the mechanistic evidence is MODEL_ORGANISM (mouse, zebrafish,
  cynomolgus monkey, Drosophila) or IN_VITRO (human neural progenitors, cerebral
  organoids); this is flagged per evidence item. Human-clinical evidence is used for
  every phenotype claim. Model evidence supports mechanism nodes and corroborates
  phenotypes but never stands alone for a human phenotype. Model fidelity is itself
  qualified: PMID:36738737 shows the same Chd8 lesion produces opposite-direction
  effects and even resilience on different mouse backgrounds, which is why no single
  mouse result is treated as decisive here.

  (8) Two named agents in the dystonia literature (tizanidine, botulinum toxin) and
  the levodopa trials are described in the deep-research report from the papers'
  case tables, not their abstracts, so no `therapeutic_agent` bindings are asserted
  for them; the dystonia treatment entry cites only the deep brain stimulation
  outcome, which IS in the abstract. Similarly, no melatonin, methylphenidate or
  antipsychotic agent is curated, because no CHD8-specific source names them - the
  sleep and behavioural treatments are kept at the level GeneReviews actually
  states.

  (9) No `conforms_to` module reference is declared. No existing kb/modules/ module
  captures the chromatin-remodeller-dosage-to-neurodevelopment pattern; a future
  "chromatinopathy" module would be the natural home and would also serve SETD5,
  the other CHD paralogue disorders, and the KMT2 disorders.

  (10) A `biochemical` record for the DNA-methylation episignature was considered
  and not created: the episignature is a diagnostic classifier rather than an
  analyte with a reference interval, so it is curated under `diagnosis` instead.

  (11) `clinical_course: PROGRESSIVE` on anxiety was considered at review and NOT
  asserted. PMID:38622540 is now cited for the age-anxiety association, but that
  association is estimated across the pooled three-gene sample (N=65; CHD8 n=18),
  reported hedged as "may worsen with increasing age", and derived from a
  cross-sectional design. GeneReviews names anxiety only as a surveillance target
  and says nothing about its trajectory. The finding is therefore carried in the
  phenotype description and in a PARTIAL evidence row rather than as a structured
  course qualifier.

  (12) A `CGDS:HGNC_20153` ClinGen dosage evidence row was attempted at review and
  could not be produced: `just clingen-dosage-refresh` fails with a checksum
  mismatch against the pinned snapshot in data/clingen-dosage/MANIFEST.yaml, and
  re-pinning that repository-wide snapshot is out of scope for a single disorder
  entry. The haploinsufficiency mechanism remains supported by the primary
  literature already cited.

  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This gene-disease relationship is supported by expression studies (Mohuczy et al. PMID:
      12468103, Gupta et al. PMID: 20443895).
    explanation: >-
      The panel's own statement that these two studies are what supports the relationship
      experimentally, which is why this node is curated at all.

mechanistic_hypotheses:
- hypothesis_group_id: psen2_calcium_handling_dcm
  hypothesis_label: Presenilin-2 dysfunction causes dilated cardiomyopathy through disturbed cardiomyocyte calcium handling
  status: ALTERNATIVE
  description: >-
    The only mechanistic model proposed for CMD1V: a PSEN2 variant perturbs presenilin-2 in the
    cardiomyocyte, which disturbs sarcoplasmic-reticulum calcium handling - plausibly through
    the presenilin-2 association with RyR2 and sorcin - and the resulting
    excitation-contraction defect drives dilatation and pump failure.

    It is recorded as ALTERNATIVE, not CANONICAL, because the disease it explains carries only
    Limited gene-disease validity and because every support falls short of the claim. Carrier
    calcium signalling was measured in skin fibroblasts. The RyR2 and sorcin interaction was
    demonstrated in mouse heart and in a heterologous cell line, not in a carrier. No
    cardiomyocyte carrying Ser130Leu has ever been studied.

    Worse for the model than any of that: the one in vivo cardiac phenotype attributable to
    losing presenilin-2 points the wrong way. Psen2 knockout mice show increased contractility
    and larger calcium transients, with no hypertrophy or fibrosis - not the failing, dilating
    ventricle this entry is named for. That does not refute the hypothesis, since the CMD1V
    allele is a missense variant whose functional consequence is unknown and need not resemble
    deletion, but it does mean the mechanism cannot simply be read off the knockout.

    The model is nevertheless worth keeping, because it is amyloid-independent and stated as
    such in the sources, which distinguishes it from the neuronal presenilin literature and
    makes it falsifiable: an isogenic Ser130Leu human iPSC-cardiomyocyte line with
    calcium-transient and RyR2-flux readouts would settle it in either direction.
  evidence:
  - reference: PMID:37176125
    reference_title: "Presenilin-1 (PSEN1) Mutations: Clinical Phenotypes beyond Alzheimer's Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DCM may not be related to impaired APP cleavage by gamma secretase, suggesting that
      PSEN1 (and PSEN2) could impact heart failure through an amyloid-independent mechanism
    explanation: >-
      A review's statement of the amyloid-independent framing this hypothesis adopts, naming
      PSEN2 explicitly, and the reason the neuronal amyloid literature is excluded from the
      entry.
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, our results suggest that PS2 plays an important role in cardiac
      excitation-contraction coupling by interacting with RyR2.
    explanation: >-
      The authors' conclusion, which is the strongest available statement that presenilin-2 has
      a real role in cardiomyocyte calcium handling - the premise this hypothesis needs.
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Invasive hemodynamic analysis revealed that cardiac contractility in PS2KO mice increased
      compared with that in their littermate controls.
    explanation: >-
      The result that cuts against this hypothesis and is quoted so the entry does not overstate
      it: removing presenilin-2 from a mouse heart makes it contract better, not worse, which is
      the opposite of the direction a dilated cardiomyopathy mechanism requires.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This gene-disease relationship is supported by expression studies (Mohuczy et al. PMID:
      12468103, Gupta et al. PMID: 20443895).
    explanation: >-
      The expert panel's account of what does survive: expression work, which is where the
      myocardial presenilin-2 results sit. Quoted to show this hypothesis rests on the evidence
      class ClinGen credits rather than on the genetic evidence it discounts.

phenotypes:

- category: Cardiovascular
  name: Dilated Cardiomyopathy
  description: >-
    Left ventricular enlargement with impaired systolic function, unexplained by ischaemic,
    valvular, hypertensive or congenital causes. This is the defining and effectively the only
    phenotype of the entity: the entire reported clinical description of CMD1V is two families'
    cardiomyopathy, reported as milder than at the sibling PSEN1 locus.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  diagnostic: true
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel PSEN1 missense mutation (Asp333Gly) was identified in one family, and a single
      PSEN2 missense mutation (Ser130Leu) was found in two other families.
    explanation: >-
      Identifies the families in which the dilated-cardiomyopathy phenotype defining this locus
      was observed.
  notes: >-
    No frequency band is assigned, and no clinical_course qualifier either. The denominator is
    two pedigrees in a single paper, so a FrequencyEnum value would present a family observation
    as a disease-level frequency; and unlike the sibling locus, where the course is described as
    progressive, the only course statement available for CMD1V is that the disease was milder
    with a more favourable prognosis, which does not support PROGRESSIVE.

- category: Cardiovascular
  name: Congestive Heart Failure
  description: >-
    Symptomatic pump failure following the dilatation. Reported for this locus as milder than at
    the PSEN1 locus and with a more favourable prognosis; no transplantation or death is
    described in the CMD1V families.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that PSEN1 and PSEN2 mutations are associated with DCM and heart
      failure and implicate novel mechanisms of myocardial disease.
    explanation: >-
      The founding study's own conclusion sentence, naming heart failure alongside dilated
      cardiomyopathy as the reported phenotype for both presenilin loci.
  notes: >-
    No frequency band assigned, for the same reason as the dilated-cardiomyopathy phenotype:
    the only denominator available is two pedigrees.

genetic:

- name: PSEN2
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PSEN2
    term:
      id: hgnc:9509
      label: PSEN2
  association: >-
    PSEN2 encodes presenilin-2, a catalytic subunit of the gamma-secretase intramembrane
    protease and a paralogue of PSEN1. Its relationship with dilated cardiomyopathy was proposed
    in 2006 on the strength of two families carrying Ser130Leu, found in a screen of 315
    dilated-cardiomyopathy index patients, together with altered calcium signalling in carrier
    skin fibroblasts. A second missense allele, Arg62His, was later reported in two of twenty
    sporadic idiopathic cases.

    ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel first evaluated PSEN2 for
    dilated cardiomyopathy in December 2019, re-evaluated it under SOP10 in October 2024, and
    the classification did not change: **Limited**, re-reported March 2026. The panel counts two
    missense variants in four probands across two studies as the whole human genetic evidence
    base, records that the genetic evidence points decreased over time, and notes that both
    reported variants have since been found too frequently in population reference data for a
    monogenic pathogenic effect.

    The relationship is typed UNKNOWN rather than CAUSATIVE or DISPUTED, and the choice is
    deliberate in both directions. CAUSATIVE would assert what the panel declines to assert -
    Limited explicitly means the evidence does not establish the relationship. DISPUTED would
    import the sibling locus's verdict: the enum's own description binds DISPUTED to ClinGen
    "Disputed" or "Refuted", and PSEN2 is neither. Limited sits between the two, and UNKNOWN -
    "the relationship between the gene and the disease is unclear or not yet classified" - is
    the closest honest value the enum offers. The precise classification is recorded in the
    external_assertions block and in the evidence below, which is where a reader should look
    rather than relying on this coarse slot.

    The verdict is specific to the cardiac phenotype. PSEN2's relationship with early-onset
    familial Alzheimer disease is not in question and is a separate matter from this entry.
  variants:
  - name: PSEN2 p.Ser130Leu
    description: >-
      The founding CMD1V allele. A heterozygous missense substitution replacing serine with
      leucine, reported in two dilated-cardiomyopathy families with partial penetrance and
      milder disease than the PSEN1 allele found in the same screen. The original paper
      describes it at the nucleotide level in a historical transcript convention; that
      description is not restated here because it cannot be converted to modern HGVS without
      transcript confirmation.
  - name: PSEN2 p.Arg62His
    description: >-
      The second PSEN2 missense allele the expert panel counts, reported in two of twenty
      sporadic idiopathic dilated-cardiomyopathy patients rather than in a CMD1V family. It is
      recorded here because it forms part of the evidence base behind the Limited
      classification, not because it is a CMD1V allele. In the same report it did not segregate
      with disease status in the Alzheimer families in which it was also examined.
  evidence:
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PSEN2 | HGNC:9509 | dilated cardiomyopathy 1V | MONDO:0013373 | AD | Limited | SOP10 |
      Dilated Cardiomyopathy Gene Curation Expert Panel
    explanation: >-
      The current expert-panel classification row, curated against this exact MONDO term. This
      is the single most important item in the entry for anyone interpreting a PSEN2 variant in
      a cardiomyopathy patient.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      There is limited evidence to support this gene-disease relationship.
    explanation: >-
      The panel's conclusion about the strength of the relationship, and the reason
      relationship_type is not CAUSATIVE.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PSEN2 was first reported in relation to autosomal dominant dilated cardiomyopathy in 2006
      (Li et al. PMID: 17186461).
    explanation: >-
      Confirms the panel curated the same founding paper this entry is built on, so the Limited
      verdict and the entry's evidence base are about the same claim.
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 315 index patients with DCM were evaluated for sequence variation in PSEN1
      and PSEN2.
    explanation: >-
      The screen that produced the original gene-disease claim, and the larger part of its human
      genetic evidence base.
  - reference: PMID:20194882
    reference_title: "Protein aggregates and novel presenilin gene variants in idiopathic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Thus, the E318G and R62H missense substitutions may play an important role in the
      pathogenesis of a subset of patients with iDCM by modulating different functions of the
      presenilin proteins.
    explanation: >-
      The second study's proposal for the PSEN2 Arg62His allele it reported. INDIRECT because it
      is a stated possibility about sporadic idiopathic cases rather than a demonstration, and
      the allele is not the CMD1V one.
  notes: >-
    The Arg62His allele is curated as a variant under this gene record rather than as its own
    genetic record, because it is the panel's second counted variant but was not found in a
    CMD1V family. Note the same report states it did not segregate with Alzheimer affection
    status in the Alzheimer families examined, which is a point about that allele's pathogenicity
    generally rather than about dilated cardiomyopathy.

external_assertions:
- name: ClinGen PSEN2-dilated cardiomyopathy 1V gene-disease validity assertion
  source: ClinGen
  assertion_type: gene_disease_validity
  external_id: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
  url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
  description: >-
    The ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel classifies the autosomal
    dominant PSEN2 - dilated cardiomyopathy 1V relationship as Limited. The curation is against
    MONDO:0013373 itself, so it is about this entity rather than about dilated cardiomyopathy in
    general. First evaluated December 2019, re-evaluated under SOP v10 in October 2024 with no
    change, approved by the working group in May 2025, report dated 2026-03-04. Its evidence
    summary is specific about the shape of the evidence: two missense variants in four probands
    across two studies, both variants too common in population reference data, no new human
    genetic evidence since the previous curation, and experimental support resting on two
    expression studies.

    This is one tier above the Disputed classification the same panel gives PSEN1 for dilated
    cardiomyopathy 1U on the same report date - a difference worth preserving, since for PSEN1
    the panel found no scorable human genetic evidence at all.
  evidence:
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The overall genetic evidence points decreased over time.
    explanation: >-
      The direction of travel of the evidence between curations, which is the panel's own
      summary of why the classification did not improve.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, there is a lack of new supporting evidence in the period since the previous
      curation.
    explanation: >-
      Records that the relationship has not strengthened in the twenty years since it was
      proposed, which is the substance of the Limited verdict.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More evidence is needed to support the relationship of PSEN2 with AD DCM.
    explanation: >-
      Quoted so the Limited classification is not read as a rejection. The panel asks for more
      evidence rather than ruling the relationship out, which is why this entry curates the
      locus.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While Li et al. demonstrated limited segregation and functional evidence for the missense
      variant identified in their study
    explanation: >-
      The panel's characterisation of what the founding study actually established for this
      allele - limited segregation and functional evidence - which is the positive evidence that
      distinguishes Limited from the sibling locus's Disputed.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous transmission in the two reported families, and the mode of inheritance ClinGen
    curated the relationship under. The founding paper describes partial penetrance for the
    PSEN2 variant, in contrast to complete penetrance for the PSEN1 variant at the sibling
    locus. No penetrance_percentage is recorded: a penetrance statement drawn from two small
    pedigrees, with younger carriers still unaffected, is not a population estimate, and
    recording a number would give it a precision the source does not have.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable
      prognosis.
    explanation: >-
      The reported penetrance of the CMD1V allele, quoted for the penetrance clause. Partial
      penetrance is the feature that distinguishes this locus's inheritance from the sibling
      locus's.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PSEN2 | HGNC:9509 | dilated cardiomyopathy 1V | MONDO:0013373 | AD | Limited | SOP10 |
      Dilated Cardiomyopathy Gene Curation Expert Panel
    explanation: >-
      Records the mode of inheritance the expert panel curated the relationship under,
      alongside the classification.

diagnosis:
- name: Echocardiographic Diagnosis of Dilated Cardiomyopathy
  description: >-
    The phenotype is established on imaging - a dilated left ventricle with impaired systolic
    function and no ischaemic, valvular or load-related explanation - before any genetic
    question arises. Nothing about CMD1V changes this step, and there is no PSEN2-specific
    diagnostic feature: no cardiac imaging, biopsy or biomarker finding distinguishes a PSEN2
    carrier from any other dilated cardiomyopathy.
  evidence:
  - reference: PMID:20301486
    reference_title: "Dilated Cardiomyopathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide the evaluation strategy of a proband with nonsyndromic DCM
    explanation: >-
      The GeneReviews overview's statement that it defines proband evaluation for this disease
      class.

- name: Natriuretic Peptide, Troponin and Multimodality Cardiac Imaging
  description: >-
    The laboratory and imaging workup that establishes the phenotype. A 2025 systematic review
    of dilated-cardiomyopathy guidelines found cross-guideline consensus on B-type natriuretic
    peptides and high-sensitivity troponin in laboratory testing and on multimodality
    cardiovascular imaging for initial diagnosis. None of this is PSEN2-specific, which is
    itself worth recording: it means the diagnosis of this entity rests entirely on sequencing
    plus pedigree.
  evidence:
  - reference: DOI:10.1093/ehjqcco/qcae109
    reference_title: "Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical practice guidelines and recommendations"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Our review revealed consensus on several key aspects: the definition of DCM, the use of
      B-type natriuretic peptides and high-sensitivity troponin in laboratory testing, the
      essential role of multimodality cardiovascular imaging for initial diagnosis, genetic
      counselling, and the management of advanced disease.
    explanation: >-
      The elements of the diagnostic workup that guidelines agree on. INDIRECT because the
      review is about dilated cardiomyopathy generally; nothing in it is specific to this locus.

- name: Multigene Cardiomyopathy Panel Testing
  description: >-
    Genetic testing is by panel or exome. For PSEN2 the point is interpretation rather than
    efficiency: with the gene-disease relationship classified Limited, a PSEN2 variant found in
    a dilated-cardiomyopathy proband is weak evidence and should not carry the weight of a
    molecular diagnosis on its own. The panel's specific observation - that both reported
    variants are too common in population reference data for a monogenic effect - applies
    directly to interpreting a new one.

    Limited is nevertheless a positive tier rather than a contested one, so this is a weaker
    caution than the sibling PSEN1 locus warrants. A PSEN2 finding in a proband with a
    compatible family history is worth pursuing; it is not on its own an answer.
  evidence:
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PSEN2 | HGNC:9509 | dilated cardiomyopathy 1V | MONDO:0013373 | AD | Limited | SOP10 |
      Dilated Cardiomyopathy Gene Curation Expert Panel
    explanation: >-
      The classification that governs how much weight a PSEN2 result should carry in this
      setting.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      both of the reported missense variants have subsequently been found at a frequency
      higher than would be expected for a monogenic, pathogenic effect in population reference
      data sets
    explanation: >-
      The population-frequency observation that should inform interpretation of any new PSEN2
      variant found in this setting.

treatments:

- name: Guideline-Directed Heart Failure Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Management of CMD1V is management of dilated cardiomyopathy: there is no PSEN2-directed
    therapy, no trial in this population, and no reason to expect genotype-specific treatment
    while the genotype-phenotype relationship carries only Limited validity. Treatment follows
    the contemporary heart-failure pathway, which acts on the remodeling and pump-failure end of
    the chain rather than on any presenilin lesion.

    The agents listed below are the standard classes of guideline-directed medical therapy for
    heart failure with reduced ejection fraction, recorded so the treatment is queryable by drug
    identity. They are not a CMD1V-specific regimen and no source names them for this locus.
    Beta-blockers belong in the same list but are not recorded as a therapeutic_agent, because
    the NCI Thesaurus build configured here has no drug-class term for them that could be
    verified.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin receptor-neprilysin inhibitor
      term:
        id: NCIT:C190796
        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
  target_mechanisms:
  - target: Systolic Dysfunction and Heart Failure
    description: >-
      Acts on the clinical endpoint, not on the proposed molecular mechanism. Nothing in the
      standard regimen targets presenilin-2 or the calcium node above it.
  evidence:
  - reference: PMID:35379503
    reference_title: "2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure: A Report of the American College of Cardiology/American Heart Association Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      The recommendations present an evidence-based approach to managing patients with heart
      failure, with the intent to improve quality of care and align with patients' interests.
    explanation: >-
      The guideline this treatment defers to. INDIRECT because it is written for heart failure
      as a whole and says nothing about PSEN2 - which is the point: no PSEN2-specific regimen
      exists, so the general pathway is the treatment.

- name: Cardiac Surveillance of At-Risk Relatives
  therapeutic_modality: OTHER
  description: >-
    Serial cardiac assessment of first-degree relatives of an affected proband. For a
    partially penetrant, late-onset cardiomyopathy this is the intervention with the clearest
    rationale, because it detects dilatation before symptoms - and partial penetrance is exactly
    the setting in which a clinical rather than genotypic trigger matters, since an unaffected
    carrier may remain unaffected.

    Whether surveillance should be triggered by a PSEN2 variant specifically is a weaker
    question than at the sibling PSEN1 locus but still not settled: Limited validity does not
    support genotype-directed surveillance on a PSEN2 result alone. Clinical surveillance of
    relatives of an affected proband stands on the family history regardless of genotype.
  treatment_term:
    preferred_term: serial cardiac surveillance
    term:
      id: NCIT:C168126
      label: Cardiac Disease Screening
  target_mechanisms:
  - target: Ventricular Remodeling and Chamber Dilatation
    description: >-
      Detects remodeling early rather than modifying it; the benefit comes from starting
      heart-failure therapy before decompensation.
  evidence:
  - reference: PMID:20301486
    reference_title: "Dilated Cardiomyopathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a basic view of genetic risk assessment of at-risk asymptomatic relatives of a
      proband with DCM to inform cardiac surveillance and allow early detection and treatment of
      DCM to improve long-term outcome.
    explanation: >-
      The rationale for surveillance of at-risk relatives, stated by GeneReviews as one of the
      purposes of its dilated-cardiomyopathy overview: early detection before symptoms so
      treatment can start sooner.
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable
      prognosis.
    explanation: >-
      The partial penetrance that makes clinical rather than genotype-driven surveillance the
      sensible framing here. INDIRECT because the sentence describes the reported families, not
      a surveillance study.

animal_models:
- name: Presenilin-2 knockout mouse (cardiac phenotype)
  species: Mouse
  genotype: Psen2 germline knockout (PS2KO)
  publication: PMID:16204356
  genes:
  - preferred_term: PSEN2
    term:
      id: hgnc:9509
      label: PSEN2
  description: >-
    Mice lacking presenilin-2, characterised specifically for cardiac phenotype rather than for
    Alzheimer biology. The animals develop normally with no hypertrophy or fibrosis, but
    invasive haemodynamics show increased contractility, and isolated papillary muscle shows
    larger calcium transients and higher peak tension. The study goes on to show that
    presenilin-2 interacts with sorcin and the cardiac ryanodine receptor RyR2 and colocalises
    with them at the Z-lines.

    This is the only in vivo work directed at the presenilin-2 cardiac question, and it is
    curated here as the molecular anchor for the calcium node while being explicit that its
    phenotype runs opposite to dilated cardiomyopathy.
  modeled_mechanisms:
  - target: Dysregulated Cardiomyocyte Calcium Handling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Establishes that presenilin-2 is a real participant in cardiomyocyte calcium handling in
      the intact heart, through a defined interaction with RyR2 and sorcin - the mechanistic
      premise this entry's hypothesis rests on.
    limitations: >-
      The allele is a germline deletion, while CMD1V is a heterozygous missense variant whose
      functional consequence has never been determined; a knockout therefore cannot be assumed
      to model it. More importantly the direction is wrong: knockout hearts contract better,
      with larger calcium transients and no hypertrophy, fibrosis or dilatation, which is the
      opposite of the phenotype this entity is named for. The model was not built on, or tested
      against, the Ser130Leu allele, and no claim about the human disease mechanism rests on it.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is calcium transient amplitude and contractility in a
        presenilin-2-null heart. The node's quantity is disturbed calcium handling caused by a
        missense allele, which need not act by loss of function.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Murine cardiomyocyte calcium handling and heart rate differ substantially from human,
        and no human carrier cardiomyocyte has been studied for comparison.
    readouts:
    - name: Peak amplitude of calcium transients in isolated papillary muscle
      target: Dysregulated Cardiomyocyte Calcium Handling
      direction: INCREASED
      interpretation: >-
        The calcium measurement that ties presenilin-2 to cardiomyocyte calcium handling in
        vivo - and the one whose direction is opposite to what a dilated cardiomyopathy
        mechanism would predict.
      evidence:
      - reference: PMID:16204356
        reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          A study of isolated papillary muscle showed that peak amplitudes of Ca2+ transients
          and peak tension were significantly higher in PS2KO mice than those in their
          littermate controls.
        explanation: >-
          The calcium and tension measurements behind this readout, with their direction.
    - name: Cardiac hypertrophy and fibrosis
      target: Dysregulated Cardiomyocyte Calcium Handling
      direction: UNCHANGED
      interpretation: >-
        A negative structural result, recorded because it is what makes this model a poor
        analogue of the human entity: losing presenilin-2 does not remodel the mouse heart.
      evidence:
      - reference: PMID:16204356
        reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          PS2KO mice developed normally with no evidence of cardiac hypertrophy and fibrosis.
        explanation: >-
          The absence of structural remodeling in the knockout heart.
  - target: Ventricular Remodeling and Chamber Dilatation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not reproduce the structural phenotype the human entity is named for:
      mice lacking presenilin-2 develop no dilatation, no hypertrophy and no fibrosis, and
      their hearts contract better than controls. This is the central model-fidelity problem
      for the locus, recorded structurally rather than left in prose.
    limitations: >-
      A germline knockout is not a Ser130Leu knock-in, so this negative does not rule the
      mechanism out - a heterozygous missense allele could act by gain of function, dominant
      negativity, or a presenilin-2 function the deletion does not isolate. It does establish
      that simple loss of presenilin-2 is insufficient to produce dilated cardiomyopathy in the
      mouse.
    evidence:
    - reference: PMID:16204356
      reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PS2KO mice developed normally with no evidence of cardiac hypertrophy and fibrosis.
      explanation: >-
        The measured absence of the remodeling phenotype in the knockout, which is what this
        negative link records.
  evidence:
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, our results suggest that PS2 plays an important role in cardiac
      excitation-contraction coupling by interacting with RyR2.
    explanation: >-
      The authors' conclusion, which is the claim that makes this model informative for this
      entry: presenilin-2 has a genuine role in cardiomyocyte calcium handling.
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      PS2 is ubiquitously expressed in various tissues including hearts.
    explanation: >-
      The expression premise for studying this animal's heart at all. INDIRECT because
      expression is not a disease mechanism.

discussions:

- discussion_id: psen2_dcm_gene_validity
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is PSEN2 a dilated cardiomyopathy gene, or is CMD1V an OMIM locus resting on two families
    and a variant that turns out to be too common?
  attaches_to:
  - genetic#PSEN2
  - disease#Dilated Cardiomyopathy 1V
  rationale: >-
    Twenty years after the founding report the human evidence is two families from the original
    screen plus two sporadic patients carrying a different allele, and the expert panel counts
    four probands in total. ClinGen has looked at it three times - 2019, 2024, 2026 - and each
    time called it Limited, on the ground that both reported disease-causing variants are too
    common in population reference data for a monogenic effect, and that nothing new has
    appeared.

    The counter-argument is stronger here than at the sibling PSEN1 locus, and that asymmetry is
    the interesting part. The panel credits the founding study with limited segregation and
    functional evidence for this allele - where for PSEN1 it found no scorable human genetic
    evidence at all - and there is a defined cardiac interaction partner for presenilin-2 in
    RyR2 and sorcin. Limited is a positive tier: it means some evidence exists and more is
    needed, not that the relationship is contested.

    This is recorded as an open controversy rather than resolved in either direction because
    the deciding work - a modern population-frequency and case-control reassessment of PSEN2 in
    a large dilated-cardiomyopathy cohort, or a cardiomyocyte model of Ser130Leu - has not been
    done. It matters practically: it determines whether PSEN2 belongs on a
    dilated-cardiomyopathy panel.
  evidence:
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      No new human genetic evidence has emerged since the last curation.
    explanation: >-
      The specific deficiency the classification rests on: the evidence base has not grown
      between curations.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While Li et al. demonstrated limited segregation and functional evidence for the missense
      variant identified in their study
    explanation: >-
      The counter-argument in the panel's own words: unlike the sibling locus, this one has
      some scorable positive evidence, which is what puts it a tier higher.
  proposed_experiments:
  - experiment_id: psen2_dcm_case_control_burden
    name: Modern population-frequency and case-control reassessment of PSEN2 in dilated cardiomyopathy
    description: >-
      Genotype PSEN2 across a large sequenced dilated-cardiomyopathy cohort and compare variant
      burden against a matched population reference, testing directly the observation the
      Limited classification rests on.
    would_support:
    - pathophysiology#PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
    supporting_outcome:
    - >-
        Excess of rare, conserved PSEN2 missense variants in cases over ancestry-matched
        population controls, with Ser130Leu rare enough to be compatible with a monogenic
        effect.
    would_refute:
    - pathophysiology#PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
    refuting_outcome:
    - >-
        No case-control burden difference, and reported disease-causing alleles present in
        population reference data at frequencies incompatible with a rare dominant
        cardiomyopathy.

- discussion_id: psen2_knockout_direction_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The only in vivo cardiac phenotype for presenilin-2 loss is increased contractility with no
    dilatation. Does the proposed calcium mechanism actually point towards dilated
    cardiomyopathy?
  attaches_to:
  - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
  - mechanistic_hypotheses#psen2_calcium_handling_dcm
  rationale: >-
    Every piece of evidence for the calcium mechanism at this locus comes from the wrong cell,
    the wrong genotype, or the wrong direction. Carrier calcium signalling was measured in
    cultured skin fibroblasts, which are not contractile. The RyR2 and sorcin interaction was
    demonstrated in mouse heart and in a heterologous overexpression system, not in a carrier.
    And the one functional cardiac phenotype - from Psen2 knockout mice - shows increased
    contractility, larger calcium transients and no hypertrophy, fibrosis or dilatation.

    That last point is the substance of this mismatch and is worth stating precisely. It is not
    a refutation: CMD1V is a heterozygous missense allele, and a missense variant need not
    behave like a deletion - it could be a gain of function, a dominant negative, or act on a
    presenilin-2 function the knockout does not isolate. But it does mean the mechanism cannot
    be read off the knockout, and any account that treats "presenilin-2 dysfunction impairs
    cardiomyocyte calcium handling and the heart dilates" as established is asserting a
    direction that the only in vivo experiment contradicts.

    This is a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap because the evidence is not
    absent - the model exists, is well characterised and is internally sound. What is missing is
    any demonstration that it composes into the human disease mechanism in the relevant genotype
    and direction.
  evidence:
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Invasive hemodynamic analysis revealed that cardiac contractility in PS2KO mice increased
      compared with that in their littermate controls.
    explanation: >-
      The directional mismatch this discussion is about, in the source's own words.
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Calcium signaling was altered in cultured skin fibroblasts from PSEN1 and PSEN2 mutation
      carriers.
    explanation: >-
      Names the tissue in which the carrier calcium phenotype was actually observed, which is
      the other half of the mismatch: a surrogate cell rather than a cardiomyocyte.
  proposed_experiments:
  - experiment_id: psen2_s130l_ipsc_cardiomyocyte_calcium
    name: Isogenic PSEN2 Ser130Leu human iPSC-cardiomyocyte calcium phenotyping
    description: >-
      Introduce Ser130Leu into a human iPSC line by genome editing, differentiate to
      cardiomyocytes alongside the isogenic wild-type parent, and measure calcium transients,
      sarcoplasmic-reticulum calcium load, RyR2-mediated leak and contractility.
    would_support:
    - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
    supporting_outcome:
    - >-
        Altered calcium transient kinetics and impaired contractility in the Ser130Leu
        cardiomyocytes relative to the isogenic control, in the direction of reduced rather than
        enhanced systolic performance.
    would_refute:
    - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
    refuting_outcome:
    - >-
        Calcium transients, sarcoplasmic-reticulum load and contractility indistinguishable from
        the isogenic wild-type control.

differential_diagnoses:
- name: Dilated Cardiomyopathy 1U
  description: >-
    The PSEN1 locus, and the sibling of this one in the most literal sense: both were defined by
    the same 2006 screen of the same 315 probands. PSEN1 Asp333Gly was found in one family with
    complete penetrance, aggressive disease and an outcome of transplantation or death. ClinGen's
    Dilated Cardiomyopathy Gene Curation Expert Panel classifies PSEN1 for dilated cardiomyopathy
    1U as Disputed - one tier below this entry's Limited, on the same review date - because it
    found no scorable human genetic evidence at all. dismech curates CMD1U as a separate entry.
  distinguishing_features:
  - >-
    Different gene (PSEN1, hgnc:9508) and a more severe reported phenotype with complete
    penetrance and a progressive course. The two cannot be told apart clinically; only
    sequencing separates them.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PSEN1 mutation was associated with complete penetrance and progressive disease that
      resulted in the necessity of cardiac transplantation or in death.
    explanation: >-
      The clinical contrast between the two presenilin loci as reported in the paper that
      defined both, quoted from the PSEN1 side.

- name: Idiopathic Dilated Cardiomyopathy
  description: >-
    Dilated cardiomyopathy with no identified cause, which is what a CMD1V patient has if the
    PSEN2 attribution is not accepted. This is not an academic alternative: with the relationship
    at Limited and both reported variants too common in population data, it is the diagnosis
    implied for many PSEN2 carriers with the phenotype. Note also that the second PSEN2 allele
    the expert panel counts was itself found in idiopathic rather than familial cases, so the
    boundary between the two categories is where part of this locus's evidence base sits.
  distinguishing_features:
  - >-
    Absence of a family history or of a segregating variant. Given how weak the genetic evidence
    is, the practical boundary between this and CMD1V is the pedigree at least as much as the
    genotype.
  evidence:
  - reference: PMID:20194882
    reference_title: "Protein aggregates and novel presenilin gene variants in idiopathic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The coding region and promoters of PSEN1 and PSEN2 were sequenced in 20 patients with
      iDCM.
    explanation: >-
      Establishes that part of the presenilin cardiac evidence base was assembled in idiopathic,
      not familial, cases - and in a cohort of twenty.

notes: >-
  **Companion to Dilated Cardiomyopathy 1U.** This entry was written as the deliberate sibling
  of dismech's CMD1U (PSEN1, MONDO:0013371), which noted that this stub was open and shared its
  entire primary evidence base - same paper, same screen - differing in ClinGen verdict and in
  penetrance. Both of those differences are curated here rather than assumed: Limited against
  Disputed, and partial penetrance with milder disease against complete penetrance and a course
  ending in transplantation or death. The 1U file was not modified by this PR.

  Two places where copying the sibling entry would have been wrong, and was avoided. First,
  cardiac transplantation is curated as a treatment in 1U because the founding paper reports it
  as the outcome in that family; it is **not** curated here, because the same paper reports a
  more favourable prognosis for the PSEN2 families and no transplantation or death. Second, the
  dilated-cardiomyopathy phenotype in 1U carries clinical_course: PROGRESSIVE; here it does not,
  for the same reason. An implantable defibrillator is likewise not curated: 1U includes it to
  record that guidelines disagree about prophylactic criteria, and repeating that general point
  at a milder locus with no reported arrhythmic phenotype would add nothing this entry can
  source.

  **Separating the cardiac from the amyloid literature.** PSEN2 is far better known as a
  familial Alzheimer disease gene, and almost none of that work is about this disease. The
  Limited verdict applies to the cardiac phenotype only. Every citation in this file was checked
  to be about heart tissue, heart cells, or a cardiomyopathy cohort. The one review cited
  (PMID:37176125) is titled for PSEN1 but is quoted only where it speaks to PSEN2, and the
  quoted sentence names PSEN2 explicitly.

  **Where this entry's mechanism differs from the sibling's.** 1U's calcium route runs through
  SERCA2a, on the strength of a presenilin-1/SERCA2a co-immunoprecipitation in explanted
  myocardium. The PSEN2 cardiac interaction reported in the literature is with RyR2 and sorcin
  instead, so the molecular_functions binding here is the ryanodine-sensitive calcium-release
  channel rather than the P-type calcium transporter. Both are calcium handling and neither has
  been demonstrated for the disease allele, but they are different claims and are curated as
  such.

  **The expression node is deliberately outside the causal chain.** ClinGen names two expression
  studies as the experimental support for this relationship, so they are curated - but a
  presenilin-2 level that rises in failing myocardium and falls again when function improves is
  at least as consistent with a marker of failure as with a cause of it. The node carries no
  downstream edge for that reason.

  **Independent check on the ClinGen frequency argument.** The panel states that both reported
  variants are too frequent in population reference data. Looked up directly in gnomAD v4
  through the public API on 2026-09-05, PSEN2 p.Ser130Leu (rs63750197, 1-226885570-C-T) is
  present at an exome allele frequency of 1.3e-03 (1,830 of 1,461,780 alleles) and a genome
  allele frequency of 7.1e-04 - roughly one carrier in every four hundred people, which is far
  too common for a monogenic dominant cause of a rare cardiomyopathy and is considerably more
  common than the PSEN1 Asp333Gly allele at the sibling locus. This lookup is recorded here as
  a check on the reasoning rather than cited as evidence, because a database query is not a
  quotable publication; the evidence items in this entry rest on the ClinGen record.

  **What was deliberately not curated.** No biochemical, histopathology, imaging, dataset,
  clinical-trial or environmental section: nothing PSEN2-specific exists for any of them. No
  phenotype beyond dilated cardiomyopathy and heart failure - the founding abstract, which is
  all the cache holds, mentions no other cardiac finding for these families. No experimental
  models section: no human cardiomyocyte or organoid system carrying a PSEN2 cardiomyopathy
  allele has been reported, which is precisely the gap recorded in the HUMAN_MODEL_MISMATCH
  discussion.

  The general dilated-cardiomyopathy and heart-failure sources that are cited - the guideline
  systematic review, the 2022 heart failure guideline and the GeneReviews overview - are used
  only where the claim really is about the disease class, and are marked INDIRECT where they
  support a locus-adjacent claim. No general-class source is used to make a claim about PSEN2.

  **Deep research provenance.** The Edison/falcon provider returned HTTP 402 (account out of
  credits), so the run was repeated through the repository's recorded fallback mechanism, which
  produced the report under the claude_code provider and stamped the fallback in its frontmatter.
  No provider was substituted by hand.


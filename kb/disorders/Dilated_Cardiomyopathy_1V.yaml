- name: Stress-Responsive Myocardial Presenilin-2 Expression
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Presenilin-2 is present in myocardium and its level moves with cardiac stress: it is
    detectable in cultured cardiac cells and in adult rat heart, rises with glucose deprivation
    and hypoxia in cardiac cells, and is increased in the failing myocardium of dogs with heart
    failure, where a contractility-modulation therapy that improves ventricular function
    normalises it again.

    This node is kept outside the disease's causal chain deliberately, and no downstream edge is
    drawn from it. It is the expression work the ClinGen panel names as supporting the
    gene-disease relationship, so it belongs in the entry; but every observation in it is
    correlative and none involves a PSEN2 variant. The direction of causality is exactly what is
    unresolved - presenilin-2 rising in a failing heart is at least as consistent with a
    response to failure as with a cause of it, and the canine result, in which the increase
    reverses when ventricular function improves, reads more naturally as the former.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:12468103
    reference_title: "Presenilins in the heart: presenilin-2 expression is increased by low glucose and by hypoxia in cardiac cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Presenilin-2 (PS2) was detected in the cultured heart cells.
    explanation: >-
      Establishes the presence of presenilin-2 in cardiac cells, which is the premise of this
      node. Graded IN_VITRO because the measurement was made in a cultured cardiac cell line.
  - reference: PMID:12468103
    reference_title: "Presenilins in the heart: presenilin-2 expression is increased by low glucose and by hypoxia in cardiac cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Glucose deprivation itself caused significant up-regulation of the presenilin-2 (to 160%)
      and with low oxygen increased presenilin-2 level to over 200% of the control.
    explanation: >-
      The stress-responsiveness this node names, with the measured magnitudes. This is one of
      the two expression studies the ClinGen panel cites as supporting the relationship.
  - reference: PMID:20443895
    reference_title: "Ca(2+)-binding proteins in dogs with heart failure: effects of cardiac contractility modulation electrical signals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compared with NL, the expression of S100A1, sorcin, and HRC was decreased, whereas the
      expression of PS2 was increased in untreated HF dogs.
    explanation: >-
      Presenilin-2 expression is altered in failing myocardium in vivo - the second expression
      study the panel cites. Graded MODEL_ORGANISM because it is a canine heart-failure model.
  - reference: PMID:20443895
    reference_title: "Ca(2+)-binding proteins in dogs with heart failure: effects of cardiac contractility modulation electrical signals."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      CCM therapy normalized the expression of S100A1, sorcin, and PS2 but not of HRC.
    explanation: >-
      The reversal that makes the direction of causality unclear: a therapy that improves

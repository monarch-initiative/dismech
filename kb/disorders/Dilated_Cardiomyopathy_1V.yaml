name: Dilated Cardiomyopathy 1V
creation_date: "2026-09-05T13:30:00Z"
category: Mendelian
disease_term:
  preferred_term: dilated cardiomyopathy 1V
  term:
    id: MONDO:0013373
    label: dilated cardiomyopathy 1V
synonyms:
- CMD1V
- DCM1V
- cardiomyopathy, dilated, 1V
- cardiomyopathy, dilated, type 1V
- dilated cardiomyopathy type 1V
- PSEN2 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in PSEN2
description: >-
  A numbered OMIM dilated-cardiomyopathy locus assigned to PSEN2, the second presenilin and,
  like its sibling PSEN1, far better known as an early-onset Alzheimer disease gene. This entry
  is the companion of dismech's Dilated Cardiomyopathy 1U: the two loci were defined by the same
  2006 screen of the same 315 probands, and they are curated on the same evidence base for the
  same reason - the locus exists and is queried, not because the gene-disease relationship is
  settled.

  The single most important thing in the entry is the expert-panel verdict, and it differs from
  1U's. In March 2026 the ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel reported the
  PSEN2 - dilated cardiomyopathy 1V relationship as **Limited** under SOP10. Limited is a
  positive but weak tier: some human genetic evidence is scorable, and it is not enough. That is
  one tier better than PSEN1's **Disputed** at the sibling locus, and the difference is real
  rather than cosmetic - for PSEN1 the panel found no scorable human genetic evidence at all,
  whereas for PSEN2 it counted two missense variants in four probands across two studies. The
  panel nevertheless records that the genetic evidence points decreased over time, that both
  reported variants turn out to be too common in population reference data for a monogenic
  effect, and that no new human genetic evidence has emerged since the previous curation.

  The clinical phenotype also differs, and in the direction that matters for a family. Where the
  PSEN1 family showed complete penetrance and progressive disease ending in transplantation or
  death, the PSEN2 variant Ser130Leu - found in two families in the same screen - showed partial
  penetrance, milder disease and a more favourable prognosis. Any statement about penetrance here
  rests on two small pedigrees and is not a lifetime estimate.

  The mechanism is held loosely, as at the sibling locus, but the cardiac anchor is a different
  molecule. For PSEN1 the proposed route runs through the sarcoplasmic-reticulum calcium pump
  SERCA2a. For PSEN2 the specific cardiac interaction reported is with the ryanodine receptor
  RyR2 and its modulator sorcin, demonstrated by co-immunoprecipitation and colocalisation at the
  Z-lines in mouse heart. Presenilin-2 is expressed in myocardium, and its expression rises with
  hypoxia and glucose deprivation in cardiac cells and in failing canine myocardium - which is
  the expression work ClinGen names as supporting the relationship. What is missing is the step
  that would matter: no cardiomyocyte carrying Ser130Leu has ever been studied, and the one in
  vivo cardiac calcium phenotype - from a Psen2 knockout mouse - runs in the wrong direction,
  showing increased contractility and no dilatation. The causal chain below is therefore held
  inside a single ALTERNATIVE mechanistic hypothesis rather than asserted as the disease
  mechanism.

  Practically: a PSEN2 variant found in a patient with dilated cardiomyopathy is weak evidence
  and should not be reported as a molecular diagnosis on its own. The Limited classification is
  specific to the cardiac phenotype and says nothing about PSEN2's established role in
  early-onset familial Alzheimer disease.


prevalence:
- population: Dilated cardiomyopathy index patients screened for presenilin variants
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence exists for this locus and none can be estimated. The only
    frequency figures in the literature are yields within screened cohorts: two PSEN2 families
    out of 315 dilated-cardiomyopathy index patients in the founding study, and, on the expert
    panel's count across both reporting studies, two missense variants in four probands in
    total. Those are variant-detection rates in selected cohorts, not disease prevalences, and
    the Limited classification means they should not be read as one.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 315 index patients with DCM were evaluated for sequence variation in PSEN1
      and PSEN2.
    explanation: >-
      The size and design of the screen that produced the CMD1V families, which is the
      denominator behind the two-family yield.
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel PSEN1 missense mutation (Asp333Gly) was identified in one family, and a single
      PSEN2 missense mutation (Ser130Leu) was found in two other families.
    explanation: >-
      The numerator: two PSEN2 families. The PSEN1 family in the same sentence is the separate
      locus CMD1U and is not counted here.
  - reference: CGGV:assertion_9e20579f-efc7-4ccd-8653-85c0aafe788f-2026-03-04T170000.000Z
    reference_title: "PSEN2 / dilated cardiomyopathy 1V (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two missense variants have been reported in 4 probands in two studies (Li et al. PMID:
      17186461, Gianni et al. PMID: 20194882).
    explanation: >-
      The expert panel's own count of the reported cases across the whole literature, which is
      the largest number anyone has assembled for this locus.

progression:
- phase: Nonpenetrant carrier state
  notes: >-
    Unlike the sibling PSEN1 locus, where the founding paper describes complete penetrance,
    the PSEN2 variant is explicitly reported with partial penetrance: carriers in the two
    reported families were not uniformly affected. No penetrance_percentage is recorded on the
    inheritance block, because a penetrance statement drawn from two small pedigrees with age
    censoring is a family observation rather than a population estimate.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable
      prognosis.
    explanation: >-
      The reported penetrance of the CMD1V variant, and the sentence that separates this locus
      clinically from CMD1U.
- phase: Symptomatic dilated cardiomyopathy
  notes: >-
    Where the disease did manifest it was reported as milder than at the PSEN1 locus, with a
    more favourable prognosis - the founding paper contrasts it directly with the progressive
    PSEN1 course that ended in transplantation or death. No case series, follow-up study or
    outcome data exist for this locus beyond that sentence, so nothing more specific about the
    trajectory can be stated.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable
      prognosis.
    explanation: >-
      The only statement of clinical course available for this locus, quoted for the severity
      and prognosis clauses rather than the penetrance one.

pathophysiology:

- name: PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A heterozygous germline PSEN2 missense variant, Ser130Leu, reported in two dilated
    cardiomyopathy families in the founding screen and segregating with disease in them.
    Presenilin-2 is expressed in myocardium as well as brain, so a cardiomyocyte-autonomous
    lesion is anatomically possible.

    What the variant does to presenilin-2 in a cardiomyocyte has never been measured. There is
    no structural or biochemical characterisation of Ser130Leu in cardiac tissue, no Ser130Leu
    cardiomyocyte model, and no directional statement available about gamma-secretase activity
    in the heart of a carrier. The node is therefore typed as the proposed initiating lesion
    and given no modifier and no functional_impact_category: neither loss nor gain of function
    has been shown for this allele in this tissue, and FunctionalImpactEnum has no value that
    would be honest here.

    A second PSEN2 allele has been reported in myocardial disease and is placed at the same
    point in the chain rather than given its own node: the missense variant Arg62His, found in
    two of twenty sporadic idiopathic dilated-cardiomyopathy patients whose presenilin genes
    were sequenced. It is a different allele in different, non-familial patients, and it is
    recorded because the expert panel counts it as one of the two variants behind the Limited
    classification.

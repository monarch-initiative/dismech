  downstream:
  - target: Ventricular Remodeling and Chamber Dilatation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - psen2_calcium_handling_dcm
    description: >-
      Impaired excitation-contraction coupling as a chronic cardiomyocyte insult driving
      adverse remodeling. This edge is the general cardiomyopathy chain rather than a
      CMD1V-specific finding; nothing in the PSEN2 literature measures it.
  evidence:
  - reference: PMID:17186461
    reference_title: "Mutations of presenilin genes in dilated cardiomyopathy and heart failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Calcium signaling was altered in cultured skin fibroblasts from PSEN1 and PSEN2 mutation
      carriers.
    explanation: >-
      The only functional measurement made in cells from CMD1V carriers. Graded IN_VITRO
      because the measurement was made in cultured cells, and INDIRECT because skin fibroblasts
      are a surrogate tissue: it supports a calcium phenotype in carrier cells, not in
      myocardium.
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immmunoprecipitation analysis showed that PS2, sorcin, and RyR2 interact with each other
      in HEK-293 cells overexpressing these proteins or in mouse hearts.
    explanation: >-
      The physical association that makes calcium handling, rather than amyloid, the proposed
      route for this locus - and specifically the release channel rather than the SERCA2a pump
      implicated at the sibling locus. Quoted with the source's own typography.
  - reference: PMID:16204356
    reference_title: "Presenilin 2 regulates the systolic function of heart by modulating Ca2+ signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunohistochemistry of heart muscle indicated that PS2 colocalizes with RyR2 and sorcin
      at the Z-lines.
    explanation: >-
      Places the interaction at the calcium-release apparatus of the cardiomyocyte rather than
      leaving it as a biochemical result in a lysate.
  - reference: PMID:20194882
    reference_title: "Protein aggregates and novel presenilin gene variants in idiopathic dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Additionally, missense mutations in the PSEN1 and PSEN2 genes alter presenilin expression
      and may alter its interaction with proteins involved in excitation-contraction coupling.
    explanation: >-
      The authors' proposal of exactly this node, from the study of sporadic idiopathic cases.
      INDIRECT because it is a stated possibility about a different allele in different
      patients, not a measurement in a CMD1V carrier.

- name: Ventricular Remodeling and Chamber Dilatation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Adverse structural remodeling of the left ventricle - chamber dilatation with wall
    thinning - as the shared final common path of the cardiomyopathies. Nothing in the CMD1V
    literature characterises remodeling in a PSEN2 carrier heart specifically: there is no
    histology, no fibrosis quantification and no imaging series. The node is curated because
    the reported clinical phenotype is dilated cardiomyopathy and this is the step that word
    names, and it conforms to the shared module rather than claiming disease-specific detail.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  downstream:
  - target: Systolic Dysfunction and Heart Failure
    causal_link_type: DIRECT
    description: >-
      Chamber dilatation with impaired contraction is by definition the dilated
      cardiomyopathy phenotype and the substrate for pump failure.
  - target: Dilated Cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      The clinical phenotype is the imaging expression of this tissue-level state: a dilated
      left ventricle with impaired systolic function is what this node names, observed on
      echocardiography. Definitional rather than a separately evidenced causal step.
  evidence:
  - reference: DOI:10.1093/ehjqcco/qcae109
    reference_title: "Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical practice guidelines and recommendations"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Our review revealed consensus on several key aspects: the definition of DCM, the use of
      B-type natriuretic peptides and high-sensitivity troponin in laboratory testing, the
      essential role of multimodality cardiovascular imaging for initial diagnosis, genetic
      counselling, and the management of advanced disease.
    explanation: >-
      Cited to anchor the node in the recognised disease class rather than to make a mechanistic
      claim: a systematic review of dilated-cardiomyopathy guidelines reports cross-guideline
      consensus on the disease definition and on the imaging that establishes it, which is what
      this node names. INDIRECT because it is about dilated cardiomyopathy generally, not
      remodeling in a PSEN2 carrier - of which nothing has been reported.


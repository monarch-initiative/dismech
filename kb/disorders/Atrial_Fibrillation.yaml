- accession: geo:GSE295056
  title: Gene-Gene Interactions Between A LMNA Variant and Common Polymorphisms Drive Early-Onset Atrial Fibrillation [ATAC-seq]
  description: Atrial fibrillation (AF) is a common arrhythmia with a complex genetic basis, yet the molecular mechanisms linking rare and common variants remain unclear. Using induced pluripotent stem cell-derived atrial cardiomyocytes, we uncover a novel mechanism by which a rare pathogenic LMNA variant encoding Lamin A/C disrupts chromatin accessibility and gene regulation at AF-associated loci. Specifically, reduced accessibility at an SCN5A enhancer harboring an AF-associated variant leads to reduced sodium current, conduction abnormalities, and re-entrant AF.

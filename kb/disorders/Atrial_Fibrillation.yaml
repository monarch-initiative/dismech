environmental:
- name: Hypertension
  influences_mechanisms:
  - target: Atrial Fibrosis
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic pressure load stretches the atrium, and that stretch drives the
      fibrotic remodelling that creates the reentrant substrate. Hypertension
      is the commonest condition in patients presenting with new atrial
      fibrillation.
    evidence:
    - reference: PMID:27057292
      reference_title: "Atrial Fibrillation and Hypertension: Mechanistic, Epidemiologic, and Treatment Parallels."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Of all the risk factors, HTN is the most commonly encountered condition in patients with incident AF."
      explanation: >-
        Identifies hypertension as the most commonly encountered condition in
        patients with incident atrial fibrillation, the leading contributor to
        the substrate.
  notes: Major modifiable population risk factor.
  evidence:
  - reference: PMID:27057292
    reference_title: "Atrial Fibrillation and Hypertension: Mechanistic, Epidemiologic, and Treatment Parallels."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Of all the risk factors, HTN is the most commonly encountered condition in patients with incident AF."
    explanation: Review confirms hypertension is the most common risk factor for atrial fibrillation.
  - reference: PMID:38984719
    reference_title: "Global burden of atrial fibrillation/atrial flutter and its attributable risk factors from 1990 to 2021."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      High systolic blood pressure emerged as the leading contributor to
      age-standardized AF/AFL incidence, prevalence, death, and DALY rate
      globally among all potential risk factors, followed closely by high body mass index.
    explanation: GBD modeling supports blood pressure as the leading attributable AF/AFL risk factor.
- name: Obesity
  influences_mechanisms:
  - target: NOX2-Dependent Atrial Oxidative Stress
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Targets the oxidative stress node specifically rather than the generic
      substrate, because the cited work shows NOX2 inhibition normalising
      atrial action potential duration and abolishing obesity-driven ion
      channel remodelling, placing NOX2 on the causal path.
    evidence:
    - reference: PMID:39146015
      reference_title: "Modulation of NOX2 causes obesity-mediated atrial fibrillation."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We showed that NOX2 inhibition normalized atrial action potential duration and abrogated obesity-mediated ion channel remodeling with reduced AF burden."
      explanation: >-
        NOX2 inhibition normalized atrial action potential duration and
        abrogated obesity-mediated ion channel remodeling. Support is PARTIAL
        because the demonstration is experimental animal work.
  notes: Associated with atrial remodeling
  evidence:

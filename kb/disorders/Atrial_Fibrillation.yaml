name: Atrial Fibrillation
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Atrial fibrillation (AF) is the most common sustained cardiac arrhythmia,
  characterized by rapid, disorganized atrial electrical activity that replaces
  coordinated atrial contraction with an irregularly irregular ventricular
  response. It arises from a combination of ectopic triggers (often from the
  pulmonary veins) and an atrial substrate of electrical and structural
  remodeling. AF reduces cardiac output and promotes atrial thrombus formation,
  substantially increasing the risk of ischemic stroke.
category: Complex
synonyms:
- AF
- AFib
parents:
- Cardiovascular Disease
- Cardiac Arrhythmia
disease_term:
  preferred_term: atrial fibrillation
  term:
    id: MONDO:0004981
    label: atrial fibrillation
definitions:
- name: Electrocardiographic clinical definition of atrial fibrillation
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A supraventricular tachyarrhythmia confirmed on 12-lead ECG by irregular
    atrial activity (fibrillatory waves) without discrete P waves, or on a rhythm
    strip lasting longer than 30 seconds. A wearable-device alert alone is a
    screening signal and requires ECG correlation or additional testing.
  scope: >-
    This entry represents common clinical atrial fibrillation across paroxysmal,
    persistent, long-standing persistent, and permanent temporal patterns. Rare
    Mendelian familial atrial fibrillation is modeled separately in
    Familial_Atrial_Fibrillation.
  evidence:
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of AF is confirmed by identifying irregular atrial activity
      (fibrillatory waves) without discrete P waves on 12-lead ECG4or lasting for
      longer than 30 seconds on rhythm strip.
    explanation: >-
      Directly supplies the electrocardiographic case boundary used here.
has_subtypes:
- name: Paroxysmal Atrial Fibrillation
  description: Episodes terminate spontaneously within 7 days.
  evidence: &af_temporal_classification
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AF is classified as paroxysmal (intermittent AF episodes lasting ≤7 days),
      persistent (continuous AF episodes lasting >7 days and/or requiring
      cardioversion), or long-standing persistent (AF episode lasting >1 year).
    explanation: Directly supplies the paroxysmal, persistent, and long-standing persistent duration boundaries.
- name: Persistent Atrial Fibrillation
  description: Episodes last longer than 7 days or require intervention.
  evidence: *af_temporal_classification
- name: Long-standing Persistent Atrial Fibrillation
  description: Continuous AF for more than 12 months.
  evidence: *af_temporal_classification
- name: Permanent Atrial Fibrillation
  description: AF accepted as permanent rhythm.
  evidence:
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with stage 4 AF have permanent AF, for which a decision has
      been made not to pursue rhythm control based on patient and clinical factors
    explanation: Directly supports permanent AF as an accepted management state rather than an episode-duration category.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 510.0
  notes: >-
    Reported as 0.51% of the worldwide population in 2017. The article's
    "37,574 million cases" is interpreted as a comma/decimal artifact for
    37.574 million.
  evidence:
  - reference: PMID:31955707
    reference_title: "Global epidemiology of atrial fibrillation: An increasing epidemic and public health challenge."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The worldwide prevalence of atrial fibrillation is 37,574 million cases
      (0.51% of worldwide population), increased also by 33% during the last 20 years.
    explanation: Supplies the reported 2017 global point-prevalence estimate.
progression:
- phase: Paroxysmal atrial fibrillation
  subtype: Paroxysmal Atrial Fibrillation
  duration: Variable; may progress over years
  notes: >-
    In a retrospective cohort, 32.4% progressed to persistent or permanent AF
    during a mean 57.3 months; this is cohort-specific rather than a universal
    transition probability.
  evidence:
  - reference: PMID:28496630
    reference_title: "Evolution of Paroxysmal Atrial Fibrillation to Persistent or Permanent Atrial Fibrillation: Predictors of Progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over a mean duration of 57.3±55.9 months, 32.4% of patients progressed to
      persistent/permanent AF.
    explanation: Directly quantifies temporal progression in the 437-patient cohort.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    AF may be asymptomatic or intermittently symptomatic, but its population and
    individual burden is high because it is chronic and recurrent, increases
    stroke, heart-failure, dementia, and mortality risks, and commonly requires
    lifelong risk-factor management, rhythm/rate decisions, and thromboembolic
    risk reassessment.
  evidence:
  - reference: PMID:41543444
    reference_title: "The clinical pathophysiology of atrial fibrillation: outstanding questions from bedside to bench and back."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Atrial fibrillation (AF) is a major public health problem, associated with
      increased risks of heart failure, stroke, dementia, and mortality.
    explanation: Directly supports the major morbidity and mortality components of high burden.
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is associated with a 1.5- to 2-fold increase in mortality and a 4- to
      5-fold increase in the risk of stroke.
    explanation: Quantifies two major adverse prognostic consequences.
epidemiology:
- name: Global AF and atrial-flutter burden in 2021
  description: >-
    The Global Burden of Disease analysis combines atrial fibrillation and atrial
    flutter; its counts must not be interpreted as AF-only estimates.
  unit: cases, DALYs, and deaths
  factors:
  - High systolic blood pressure
  - High body mass index
  evidence:
  - reference: PMID:38984719
    reference_title: "Global burden of atrial fibrillation/atrial flutter and its attributable risk factors from 1990 to 2021."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Globally, in 2021, there were 4.48 million incident cases
    explanation: Supplies global modeled burden while explicitly retaining AF/AFL scope.
  - reference: PMID:38984719
    reference_title: "Global burden of atrial fibrillation/atrial flutter and its attributable risk factors from 1990 to 2021."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      8.36 million DALYs (95% UI: 6.97-10.13) and 0.34 million deaths (95% UI:
      0.29-0.37) attributed to AF/AFL.
    explanation: Directly supports the DALY and death components of the combined AF/AFL burden.
pathophysiology:
- name: NOX2-Dependent Atrial Oxidative Stress
  description: >-
    In obesity-driven AF models, NOX2-derived oxidative stress promotes atrial
    ion-channel remodeling and abnormal action-potential duration.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:39146015
    reference_title: "Modulation of NOX2 causes obesity-mediated atrial fibrillation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NOX2 inhibition normalized atrial action potential duration and abrogated
      obesity-mediated ion channel remodeling with reduced AF burden.
    explanation: >-
      Perturbational evidence identifies NOX2-dependent oxidative stress as an
      upstream driver of obesity-mediated atrial electrical remodeling.
  downstream:
  - target: Atrial Electrical Remodeling
    description: >-
      NOX2 inhibition reverses abnormal atrial action-potential duration and
      ion-channel remodeling in obesity-driven AF models.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39146015
      reference_title: "Modulation of NOX2 causes obesity-mediated atrial fibrillation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        NOX2 inhibition normalized atrial action potential duration and
        abrogated obesity-mediated ion channel remodeling with reduced AF burden.
      explanation: >-
        Targeted inhibition directly reverses the downstream electrical-remodeling
        phenotype, supporting the direction and polarity of this model edge.
- name: Atrial Electrical Remodeling
  description: >
    Rapid atrial rates cause shortening of atrial refractory period and
    loss of rate adaptation, promoting AF maintenance. AF begets AF.
  cell_types:
  - preferred_term: Atrial Cardiomyocyte
    term:
      id: CL:0002129
      label: regular atrial cardiac myocyte
  biological_processes:
  - preferred_term: Cardiac Conduction
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
  evidence:
  - reference: PMID:7671380
    reference_title: "Atrial fibrillation begets atrial fibrillation. A study in awake chronically instrumented goats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During the first 24 hours of AF the median fibrillation interval shortened from 145 +/- 18 to 108 +/- 8 ms and the inducibility of AF by a single premature stimulus increased from 24% to 76%."
    explanation: The original demonstration that sustained rapid atrial rates shorten atrial refractoriness and increase AF inducibility - the tachycardia-induced electrical remodeling the phrase "AF begets AF" refers to.
  downstream:
  - target: Atrial Fibrillation
    description: >-
      Disordered atrial electrical activation is the defining arrhythmia
      phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7671380
      reference_title: "Atrial fibrillation begets atrial fibrillation. A study in awake chronically instrumented goats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        During the first 24 hours of AF the median fibrillation interval
        shortened from 145 +/- 18 to 108 +/- 8 ms and the inducibility of AF by
        a single premature stimulus increased from 24% to 76%.
      explanation: Directly links tachycardia-induced electrical remodeling to increased AF inducibility.
  - target: Palpitations
    description: >-
      Atrial fibrillation-related rhythm disturbance commonly manifests as
      palpitations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - symptomatic perception of irregular atrial rhythm
    evidence:
    - reference: PMID:35873859
      reference_title: "Dyspnea in patients with atrial fibrillation: Mechanisms, assessment and an interdisciplinary and integrated care approach."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Palpitations are the cardinal symptom of AF and many AF therapies are targeted towards relieving this symptom."
      explanation: Review evidence directly identifies palpitations as the cardinal AF symptom.
  - target: Dyspnea
    description: >-
      AF-related rhythm and hemodynamic disturbance can produce dyspnea.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired atrial contribution to cardiac output
    - comorbid cardiovascular reserve limitation
    evidence:
    - reference: PMID:35873859
      reference_title: "Dyspnea in patients with atrial fibrillation: Mechanisms, assessment and an interdisciplinary and integrated care approach."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "However, up to two-third of patients also complain of dyspnea as a predominant self-reported symptom."
      explanation: Review evidence supports dyspnea as a common predominant symptom in AF patients.
  - target: Fatigue
    description: >-
      AF symptom burden includes fatigue, often alongside dyspnea and
      intermittent symptoms.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - symptomatic rhythm disturbance
    evidence:
    - reference: PMID:26318825
      reference_title: "Fatigue, dyspnea, and intermittent symptoms are associated with treatment-seeking delay for symptoms of atrial fibrillation before diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Experiencing fatigue, dyspnea and intermittent symptoms produced symptom representations and emotional and behavioral responses associated with treatment-seeking delay."
      explanation: Clinical symptom study supports fatigue as part of the symptomatic AF presentation.
  - target: Exercise Intolerance
    description: >-
      Rate irregularity and loss of coordinated atrial contribution can reduce
      exercise capacity, although severity depends strongly on ventricular rate
      and comorbid cardiac reserve.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - irregular ventricular response
    - reduced hemodynamic reserve during exertion
    evidence:
    - reference: PMID:40645996
      reference_title: "Cross-population GWAS and proteomics improve risk prediction and reveal mechanisms in atrial fibrillation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        symptoms including palpitations and decreased exercise
      explanation: The article's clinical background directly identifies decreased exercise capacity as an AF symptom.
  - target: Chest Pain
    description: >-
      Chest pain can occur during AF, but the intermediate mechanism and the
      contribution of coexisting ischemic or structural disease vary.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39680399
      reference_title: "Atrial Fibrillation: A Review."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Symptoms of AF include palpitations, dyspnea, chest pain, presyncope,
        exertional intolerance, and fatigue
      explanation: Supports chest pain as an AF symptom but not a unique causal intermediate.
- name: Fibroblast NLRP3 Inflammasome Activation
  biological_scale: CELLULAR
  description: >-
    NLRP3 inflammasome signaling is increased in atrial fibroblasts from people
    with AF. Fibroblast-restricted activation is sufficient to create a
    profibrotic, conduction-slowing atrial substrate in mice.
  cell_types:
  - preferred_term: Cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  genes:
  - preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  evidence:
  - reference: PMID:40243956
    reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NLRP3 was up-regulated in atrial fibroblasts from AF patients.
    explanation: Direct human atrial-fibroblast observation supporting disease relevance.
  - reference: PMID:40243956
    reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fibroblast-specific activation of NLRP3 in mice induced AF-promoting
      atrial myopathy and heart failure with diastolic dysfunction, accompanied
      by increased fibrosis, and reduced conduction velocity.
    explanation: The perturbation study supports causal sufficiency in mice, not in humans.
  downstream:
  - target: Atrial Fibrosis
    description: Fibroblast-restricted NLRP3 activation promotes profibrotic atrial remodeling.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40243956
      reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockdown of NLRP3 prevented the AF-promoting atrial substrate and
        cardiomyopathy in the context of NLRP3 activation in fibroblasts.
      explanation: Genetic reversal supports a causal NLRP3-to-substrate link in the mouse model.
- name: Atrial Fibrosis
  biological_scale: TISSUE
  description: >
    Excess atrial extracellular matrix separates cardiomyocyte bundles and
    creates heterogeneous, slowed conduction that favors reentry and AF
    maintenance.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  evidence:
  - reference: PMID:40243956
    reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fibroblast-specific activation of NLRP3 in mice induced AF-promoting
      atrial myopathy and heart failure with diastolic dysfunction, accompanied
      by increased fibrosis, and reduced conduction velocity.
    explanation: Links increased atrial fibrosis with slowed conduction and an AF-promoting substrate in vivo.
  - reference: PMID:42462800
    reference_title: "Contemporary concepts in the onset and maintenance of atrial fibrillation: Mechanisms, substrates, and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Low-voltage substrate regions are a common feature, and typically
      correlate with underlying fibrotic scar.
    explanation: The most recent review before the cutoff links the electrophysiologic substrate to atrial fibrotic scar.
  downstream:
  - target: Atrial Electrical Remodeling
    description: Fibrotic discontinuity slows and heterogenizes atrial conduction, facilitating reentry.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced atrial conduction velocity
    evidence:
    - reference: PMID:40243956
      reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fibroblast-specific activation of NLRP3 in mice induced AF-promoting
        atrial myopathy and heart failure with diastolic dysfunction,
        accompanied by increased fibrosis, and reduced conduction velocity.
      explanation: Directly observes fibrosis and conduction slowing in the same causal model.
- name: Pulmonary Vein Triggers
  description: >
    Ectopic beats originating from pulmonary vein myocardial sleeves
    commonly trigger AF episodes. These foci have distinct electrophysiology.
  locations:
  - preferred_term: Pulmonary vein
    term:
      id: UBERON:0002016
      label: pulmonary vein
  evidence:
  - reference: PMID:9725923
    reference_title: Spontaneous initiation of atrial fibrillation by ectopic beats originating in the pulmonary veins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three foci were in the right atrium, 1 in the posterior left atrium, and
      65 (94 percent) in the pulmonary veins
    explanation: Mapping of 69 triggering foci in 45 drug-refractory patients localized 94% to pulmonary veins.
  downstream:
  - target: Atrial Fibrillation
    description: Rapid ectopic pulmonary-vein discharges initiate paroxysmal AF.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9725923
      reference_title: Spontaneous initiation of atrial fibrillation by ectopic beats originating in the pulmonary veins.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pulmonary veins are an important source of ectopic beats, initiating
        frequent paroxysms of atrial fibrillation.
      explanation: The mapped human study directly supports initiation polarity.
- name: Atrial Thrombus Formation
  description: >
    Loss of atrial contraction leads to blood stasis, particularly in
    the left atrial appendage, promoting thrombus formation and embolic stroke.
  evidence:
  - reference: PMID:30571060
    reference_title: Paroxysmal Atrial Fibrillation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      atrial contractility is lost, causing an inability to completely empty
      blood from the atrial appendage leading to the risk of clot formation and
      subsequent thromboembolic events.
    explanation: Directly supports the direction from ineffective atrial contraction to appendage clot and embolism.
  - reference: PMID:8572814
    reference_title: "Appendage obliteration to reduce stroke in cardiac surgical patients with atrial fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, 201 of 222 (91%) of nonrheumatic atrial fibrillation-related left atrial thrombi were isolated to, or originated in the left atrial appendage"
    explanation: Systematic review of 23 studies localizes the overwhelming majority of nonrheumatic AF-related left atrial thrombi to the left atrial appendage, supporting appendage stasis as the site of thrombus formation.
  downstream:
  - target: Thromboembolic Stroke
    description: >-
      Atrial thrombus formation creates risk for embolic stroke, which is the
      main target of anticoagulation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - left atrial appendage stasis
    - systemic embolism
    evidence:
    - reference: PMID:30571060
      reference_title: Paroxysmal Atrial Fibrillation.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        atrial contractility is lost, causing an inability to completely empty
        blood from the atrial appendage leading to the risk of clot formation
        and subsequent thromboembolic events.
      explanation: Supports the clot-to-thromboembolism sequence; the separate phenotype evidence establishes stroke as a major AF outcome.
- name: Gut Microbial TMA Production
  biological_scale: MOLECULAR
  description: >
    Gut bacteria transform dietary choline to trimethylamine (TMA) through the
    CutC/D pathway. Iodomethylcholine (IMC) inhibits this microbial
    choline-to-TMA(O) transformation.
  biological_processes:
  - preferred_term: microbial amine biosynthetic process
    term:
      id: GO:0009309
      label: amine biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: choline
    term:
      id: CHEBI:15354
      label: choline
  - preferred_term: trimethylamine
    term:
      id: CHEBI:18139
      label: trimethylamine
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1172/JCI201684
    reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Iodomethylcholine (IMC), the gut microbial CutC/D inhibitor that
      suppresses choline→TMA(O) metabolic transformation, reduced circulating
      TMAO levels ... and choline induced AF onset
    explanation: Directly identifies CutC/D-mediated microbial choline-to-TMA(O) transformation and its inhibition by IMC.
  downstream:
  - target: Elevated Circulating TMAO
    description: >-
      Inhibiting microbial CutC/D lowers circulating TMAO during choline
      supplementation, linking microbial TMA generation to systemic TMAO
      exposure without separately asserting an uncited hepatic step.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - host conversion of absorbed trimethylamine to trimethylamine N-oxide
    hypothesis_groups: [tmao_autonomic_af]
    evidence:
    - reference: DOI:10.1172/JCI201684
      reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Iodomethylcholine (IMC), the gut microbial CutC/D inhibitor that
        suppresses choline→TMA(O) metabolic transformation, reduced circulating
        TMAO levels ... and choline induced AF onset
      explanation: Pharmacologic upstream inhibition links microbial metabolism to circulating TMAO in the mouse experiment.

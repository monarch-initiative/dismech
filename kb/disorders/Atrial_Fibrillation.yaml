- name: Courtemanche-Ramirez-Nattel human atrial action-potential model
  description: >-
    Ionic-current kinetic model of the human atrial cardiomyocyte action
    potential used to examine rate adaptation and ion-current contributions to
    AF susceptibility. It models cellular electrophysiology, not whole-patient
    natural history or treatment outcomes.
  model_type: KINETIC
  model_id: Courtemanche-1998-human-atrial-AP
  publication: PMID:9688927
  modeled_mechanisms:
  - target: Atrial Electrical Remodeling
    description: Models rate-dependent atrial action-potential adaptation and its ionic-current determinants.
    evidence:
    - reference: PMID:9688927
      reference_title: "Ionic mechanisms underlying human atrial action potential properties: insights from a mathematical model."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Rate-dependent adaptation of AP duration, an important determinant of
        susceptibility to atrial fibrillation, was attributable to incomplete
        L-type Ca2+ current recovery from inactivation and incomplete delayed
        rectifier current deactivation at rapid rates.

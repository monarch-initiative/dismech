- name: Beta-Adrenergic Receptor Blockade (Rate-Control Target)
  conforms_to: beta_adrenergic_receptor_blockade#Beta-Adrenergic Receptor Antagonist Occupancy
  description: 'The molecular target of rate-control therapy: blocking beta-1 receptors on nodal tissue
    slows atrioventricular conduction and so the ventricular rate during fibrillation, without restoring
    sinus rhythm. It is the receptor through which `Cardiac Autonomic Dysfunction` raises that rate.
    The node is added because the entry''s `Rate Control` treatment previously pointed only at the
    symptoms it relieves (palpitations, exercise intolerance) and named no mechanism; conformance
    is to the beta-adrenergic blockade module''s receptor-occupancy trigger, whose nodal arm covers
    sinoatrial and atrioventricular slowing.
    The node carries no causal edge on purpose, because its relation to the driver it suppresses
    is inhibitory while a `downstream` edge asserts causation, so there is no honest edge to
    draw from a blockade node to the mechanism it blunts. It is a treatment anchor, reached
    through the treatment''s `target_mechanisms`, the same shape the merged mu-opioid conformers
    use.'
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: beta-adrenergic receptor activity
    term:
      id: GO:0004939
      label: beta-adrenergic receptor activity
    modifier: DECREASED
  genes:
  - preferred_term: ADRB1
    term:
      id: hgnc:285
      label: ADRB1
  evidence:
  - reference: PMID:39604644
    reference_title: '[European Society of Cardiology (ESC) guidelines on atrial fibrillation 2024
      : What is new and what is important?].'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: For rate or rhythm control pharmacotherapy with beta-blockers, digitalis, amiodarone
      and flecainide are still the most important drugs.
    explanation: Establishes beta-blockers as the mainstay of rate control in atrial fibrillation,
      which is the therapy this node gives a receptor-level target.
  - reference: PMID:17998992
    reference_title: Antianginal actions of beta-adrenoceptor antagonists.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Beta-adrenoceptor antagonists competitively inhibit the binding of endogenous catecholamines
      to beta1-adrenoceptors in the heart.
    explanation: States the receptor-level action this node records as the drug's point of attack.

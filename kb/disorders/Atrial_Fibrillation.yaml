  title: H3K27ac and H3K4me3 ChIP-Seq profiling of a human paired left and right atrial cohort of atrial fibrillation and healthy sinus rhythm individuals
  description: H3K27ac and H3K4me3 ChIP-Seq profiling was performed on atrial appendages samples from 12 individuals aged over 60 years, either classified as persistent atrial fibrillation (AF) or normal sinus rhythm (SR). For all individuals, careful examination of medical history displayed no indications of hypertension, hypothyroidism or diabetes.

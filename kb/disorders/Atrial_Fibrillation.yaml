    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the gut microbial metabolite TMAO, independently associated with AF risk in subjects, enhances AF in multiple AF mouse models via autonomic dysfunction"
    explanation: The study attributes TMAO-enhanced AF across mouse models to autonomic dysfunction.
  downstream:
  - target: Atrial Electrical Remodeling
    description: >-
      The high-TMAO state is associated with slower conduction velocity and
      APD80/wavelength shortening, which may lower the reentry threshold and
      feed electrical remodeling that sustains AF.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups: [tmao_autonomic_af]
    evidence:
    - reference: DOI:10.1172/JCI201684
      reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Optical mapping studies showed that mice supplemented with choline exhibited reduced conduction velocity, shortened action potential duration at 80% repolarization, and decreased wavelength."
      explanation: Optical mapping links the high-TMAO state to APD80 and wavelength shortening, the reentry substrate.

- accession: geo:GSE322635
  title: Humanin and MOTS-c Attenuate Atrial Fibrillation by Suppressing Fibrosis and Mitochondrial Dysfunction in murine models
  description: 'BACKGROUND: Atrial fibrillation (AF) is the most common clinical arrhythmia associated with mitochondrial dysfunction, oxidative stress, and atrial fibrosis. Mitochondrial-derived peptides (MDPs) including humanin (HN) and MOTS-c, demonstrated potent cytoprotective effects, but their role in AF remains elusive. METHODS: Public GEO database, immunohistochemistry and immunofluorescence were applied to determine their expressions in atrial tissues. Plasma peptide levels were measured in a clinical cohort.'

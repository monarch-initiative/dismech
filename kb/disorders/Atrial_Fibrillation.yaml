    snippet: >-
      Additional factors associated with increased AF risk include more than
      moderate alcohol use (defined as >1 standard alcoholic drink per day or
      binge drinking), sleep apnea, and hyperthyroidism.
    explanation: Directly supports hyperthyroidism as an associated AF risk factor.
biochemical:
- name: NT-proBNP as an incident-AF risk biomarker
  presence: Elevated
  specificity: Low for AF; prognostic/predictive rather than diagnostic
  notes: >-
    NT-proBNP reflects myocardial stress and predicts incident AF, but elevation
    is not AF-specific and its prospective utility for targeted screening is not
    yet established.
  evidence:
  - reference: PMID:36610061
    reference_title: Exploring the incremental utility of circulating biomarkers for robust risk prediction of incident atrial fibrillation in European cohorts using regressions and modern machine learning methods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NT-proBNP was the strongest circulating predictor of incident AF [hazard
      ratio (HR) per standard deviation (SD), 1.93 (95% CI, 1.82-2.04); P < 0.001].
    explanation: Directly supports predictive association in 42,280 pooled European cohort participants.
  readouts:
  - target: Atrial Fibrillation
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Higher NT-proBNP marks the atrial myocardial stress that precedes clinical
      atrial fibrillation, so it predicts incident AF without being specific to
      it or diagnostic of it.
- name: Multimarker adverse-outcome panel in established AF
  presence: Measured in plasma
  specificity: Prognostic panel; not a diagnostic signature
  notes: >-
    D-dimer, GDF-15, IL-6, NT-proBNP, and hs-troponin T improve risk prediction
    for several adverse outcomes, but do not establish a single causal AF
    mechanism or replace validated clinical assessment.
  evidence:
  - reference: PMID:40744929
    reference_title: Biomarker panels for improved risk prediction and enhanced biological insights in patients with atrial fibrillation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify 5 biomarkers including D-dimer, growth differentiation factor
      15 (GDF-15), interleukin-6 (IL-6), N-terminal pro-B-type natriuretic
      peptide (NT-proBNP), and high-sensitivity troponin T (hsTropT) that
      independently predict cardiovascular death, stroke, myocardial infarction,
      and systemic embolism
    explanation: Directly reports outcome prediction in 3,817 patients with AF.
  readouts:
  - target: Thromboembolic Stroke
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      The five-marker panel independently predicts stroke and systemic embolism
      in established AF; it is a risk readout on the thromboembolic endpoint and
      does not identify a causal mechanism.
diagnosis:
- name: Clinician-interpreted electrocardiography
  description: >-
    A 12-lead ECG or other clinician-reviewed rhythm tracing establishes AF by
    documenting the characteristic atrial rhythm. Longer ambulatory monitoring
    may be required when episodes are intermittent; device alerts require
    confirmatory review.
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  results: Electrocardiographic tracing consistent with atrial fibrillation.
  evidence:
  - reference: PMID:39674741
    reference_title: Analysis of The 2024 ESC/EACTS Guidelines For The Management Of Atrial Fibrillation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For diagnosis, electrocardiographic confirmation of clinical AF is
      essential, followed by risk stratification using the CHA₂DS₂-VASc score
      to guide anticoagulation therapy.
    explanation: Directly supports the diagnostic role of an electrocardiographic tracing.
  - reference: PMID:10549907
    reference_title: Electrocardiographic differentiation of atrial flutter from atrial fibrillation by physicians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study was to determine the ability of physicians to
      differentiate atrial flutter from atrial fibrillation on a surface
      electrocardiogram (ECG).
    explanation: Directly supports clinician interpretation of a surface ECG and the need to distinguish AF from flutter.
- name: Non-invasive systematic AF screening
  description: >-
    Pulse, handheld ECG, patch, or wearable strategies can increase detection of
    previously unrecognized AF, but trial evidence has not shown reduced adverse
    outcomes; screening is therefore distinct from diagnosis and treatment.
  evidence:
  - reference: PMID:40276326
    reference_title: "Systematic screening for atrial fibrillation with non-invasive devices: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic screening for AF using non-invasive devices is associated with
      increased diagnosis of AF, but not reduced adverse clinical events.
    explanation: Meta-analysis distinguishes higher diagnostic yield from unproven clinical-outcome benefit.
- name: Initial structural and secondary-cause evaluation
  description: >-
    After AF is confirmed, transthoracic echocardiography evaluates cardiac
    structure and ventricular function; complete blood count, metabolic panel,
    and thyroid testing assess clinically relevant associated conditions.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Cardiac structure/function and laboratory contributors documented for management.
  evidence:
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Evaluation of patients with newly identified AF should include transthoracic echocardiogram to assess cardiac structure and to identify possible causes for AF (eg, valve disease) 4 or outcomes associated with AF (eg, reduced ventricular function). Basic laboratory testing, including complete blood count, metabolic panel, and thyroid function, is appropriate. 4 Additional testing"
    explanation: Directly supports the initial structural and laboratory evaluation.
differential_diagnoses:
- name: Atrial Flutter
  disease_term:
    preferred_term: atrial flutter
    term:
      id: MONDO:0005310
      label: atrial flutter
  description: >-
    A macroreentrant atrial arrhythmia that may have a regular or variably
    conducted ventricular response and can be mistaken for AF on a surface ECG.
  distinguishing_features:
  - Organized flutter-wave activity and a repeating atrial cycle favor flutter.
  - Prominent atrial activity can make AF appear flutter-like; review multiple leads and longer recordings.
  evidence:
  - reference: PMID:10549907
    reference_title: Electrocardiographic differentiation of atrial flutter from atrial fibrillation by physicians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, atrial fibrillation is frequently misdiagnosed as atrial
      flutter. Misdiagnosis of atrial fibrillation occurs more often when atrial
      activity is prominent on an ECG in more than one lead.
    explanation: Directly demonstrates clinically important ECG overlap and misclassification.
- name: Multifocal Atrial Tachycardia
  disease_term:
    preferred_term: multifocal atrial tachycardia
    term:
      id: MONDO:0017988
      label: multifocal atrial tachycardia
  description: >-
    An irregular atrial tachyarrhythmia, often in severe cardiopulmonary illness,
    that can mimic AF.
  distinguishing_features:
  - At least three different nonsinus P-wave morphologies in one lead.
  - Atrial rate above 100 beats/min with an isoelectric baseline between P waves.
  evidence:
  - reference: PMID:8040593
    reference_title: "Recognition and treatment of multifocal atrial tachycardia: a critical review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic criteria include the presence of at least three different,
      nonsinus P waves in the same lead; an atrial rate greater than 100 beats
      per minute; and an isoelectric baseline between P waves. MAT is often
      difficult to differentiate from atrial fibrillation.
    explanation: Provides explicit distinguishing ECG criteria and states the AF differential.
treatments:
- name: Anticoagulation
  action_category: THERAPEUTIC
  description: >-
    Warfarin or a direct oral anticoagulant (DOAC) is used to prevent stroke
    according to thromboembolic risk. DOAC preference applies only in patients
    without mechanical heart valves or moderate-to-severe mitral stenosis.
  notes: >-
    Contemporary guidelines no longer classify AF itself as valvular versus
    nonvalvular; that distinction is retained only to guide anticoagulant
    selection. It is therefore represented here as a treatment caveat rather
    than as an AF subtype.
  target_phenotypes:
  - preferred_term: Thromboembolic stroke
    term:
      id: HP:0001727
      label: Thromboembolic stroke
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
    - preferred_term: apixaban
      term:
        id: CHEBI:72296
        label: apixaban
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
    - preferred_term: dabigatran
      term:
        id: CHEBI:70752
        label: dabigatran
  evidence:
  - reference: PMID:37573616
    reference_title: "Systematic Review and Meta-Analysis of Direct Oral Anticoagulants Versus Warfarin in Atrial Fibrillation With Low Stroke Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOAC was associated with a significantly lower risk of stroke or systemic embolism (hazard ratio 0.85, 95% confidence interval 0.75 to 0.96, p = 0.008, I2 = 0%), major bleeding, intracranial hemorrhage, and mortality compared with warfarin."
    explanation: Meta-analysis of 132,980 patients demonstrates DOACs reduce stroke risk in AF patients.
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If it is 2 or higher, oral anticoagulation (OAC) is indicated, of a type that should be decided on an individual basis."
    explanation: The guideline indicates oral anticoagulation for AF patients with a CHA2DS2-VA score of 2 or higher.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients without mechanical heart valves or moderate to severe mitral
      stenosis, DOACs are preferred because they are associated with less
      bleeding than warfarin.
    explanation: Directly supplies the mechanical-valve and mitral-stenosis boundary on DOAC preference.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: AF is no longer categorized according to valvular or nonvalvular AF.
    explanation: Directly supports not retaining valvular AF as a contemporary subtype.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "4 This distinction is only currently used to guide OAC strategy."
    explanation: Supports retaining valvular status specifically as an anticoagulation modifier.
- name: Rate Control
  action_category: THERAPEUTIC
  description: Beta blockers, calcium channel blockers, or digoxin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoprolol
      term:
        id: CHEBI:6904
        label: metoprolol
    - preferred_term: diltiazem
      term:
        id: CHEBI:101278
        label: diltiazem
    - preferred_term: digoxin
      term:
        id: CHEBI:4551
        label: digoxin
  evidence:
  - reference: PMID:39604644
    reference_title: "European Society of Cardiology (ESC) guidelines on atrial fibrillation 2024: What is new and what is important?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For rate or rhythm control pharmacotherapy with beta-blockers, digitalis,
      amiodarone and flecainide are still the most important drugs.
    explanation: Current guideline summary directly supports beta-blocker/digitalis rate control and antiarrhythmic rhythm control.
  target_mechanisms:
  - target: Beta-Adrenergic Receptor Blockade (Rate-Control Target)
    treatment_effect: ACTIVATES
    description: Occupies the beta-adrenergic receptor, which is the molecular step this
      therapy acts on.
  - target: Palpitations
    treatment_effect: INHIBITS
    description: >-
      Slowing atrioventricular nodal conduction lowers the ventricular response
      rate during fibrillation, which is what the patient perceives; the atrial
      substrate itself is unchanged, so this is symptomatic therapy.
  - target: Exercise Intolerance
    treatment_effect: INHIBITS
    description: >-
      Controlling the ventricular rate restores diastolic filling time and
      stroke volume during exertion, improving achievable workload.
- name: Rhythm Control
  action_category: THERAPEUTIC
  description: Antiarrhythmic drugs (amiodarone, flecainide, sotalol).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amiodarone
      term:
        id: CHEBI:2663
        label: amiodarone
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
    - preferred_term: sotalol
      term:
        id: CHEBI:63622
        label: sotalol
  evidence:
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with cardiovascular risk factors, early rhythm control has been shown to reduce prognostically relevant cardio - vascular endpoints (3.9 versus 5.0 per 100 patientyears)."
    explanation: Guideline evidence that early rhythm control reduces cardiovascular endpoints in AF patients with cardiovascular risk factors.
  target_mechanisms:
  - target: Atrial Electrical Remodeling
    treatment_effect: INHIBITS
    description: >-
      Antiarrhythmic drugs act on the atrial ion currents that remodeling has
      altered, prolonging refractoriness and slowing conduction enough to
      destabilize the reentrant circuits the remodeled substrate supports.
  - target: Pulmonary Vein Triggers
    treatment_effect: INHIBITS
    description: >-
      Sodium- and potassium-channel blockade suppresses the ectopic firing from
      the pulmonary vein sleeves that initiates paroxysms.
- name: Catheter Ablation
  action_category: THERAPEUTIC
  description: Pulmonary vein isolation for rhythm control.
  target_mechanisms:
  - target: Pulmonary Vein Triggers
    treatment_effect: INHIBITS
    description: Pulmonary-vein isolation blocks trigger conduction into the atria.
    evidence:
    - reference: PMID:9725923
      reference_title: Spontaneous initiation of atrial fibrillation by ectopic beats originating in the pulmonary veins.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A local depolarization could also be recognized during sinus rhythm and
        abolished by radiofrequency ablation.
      explanation: Directly supports ablation of the mapped pulmonary-vein trigger activity.
  treatment_term:
    preferred_term: Ablation Therapy
    term:
      id: NCIT:C20985
      label: Ablation Therapy
  evidence:
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple studies have shown that catheter ablation is superior to drug-based antiarrhythmic therapy in patients with paroxysmal symptomatic AF as well as in those with heart failure and AF."
    explanation: The guideline notes catheter ablation is superior to antiarrhythmic drug therapy for paroxysmal symptomatic AF and for AF with heart failure.
- name: Cardioversion
  action_category: THERAPEUTIC
  description: Electrical or pharmacological restoration of sinus rhythm.
  treatment_term:
    preferred_term: Cardioversion
    term:
      id: NCIT:C70911
      label: Cardioversion
  evidence:
  - reference: PMID:39716733
    reference_title: "Spotlight on the 2024 ESC/EACTS management of atrial fibrillation guidelines: 10 novel key aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The AF duration threshold for early cardioversion was reduced from 48 to
      24 h, and a wait-and-see approach for spontaneous conversion is advised
      to promote patient safety.
    explanation: Supports cardioversion as a guideline-managed rhythm-restoration strategy and its timing nuance.
  target_mechanisms:
  - target: Atrial Fibrillation
    treatment_effect: INHIBITS
    description: >-
      Synchronized shock or a pharmacologic agent terminates the fibrillatory
      activation itself and restores sinus rhythm; it addresses the arrhythmia
      episode rather than the substrate that produced it.
- name: Left Atrial Appendage Closure
  action_category: THERAPEUTIC
  description: Alternative to anticoagulation in selected patients.
  target_mechanisms:
  - target: Atrial Thrombus Formation
    treatment_effect: INHIBITS
    description: Excludes the appendage, the predominant site of AF-related left-atrial thrombi.
    evidence:
    - reference: PMID:8572814
      reference_title: Appendage obliteration to reduce stroke in cardiac surgical patients with atrial fibrillation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        201 of 222 (91%) of nonrheumatic atrial fibrillation-related left atrial
        thrombi were isolated to, or originated in the left atrial appendage
      explanation: Directly supports the anatomical mechanism targeted by appendage exclusion.
  evidence:
  - reference: PMID:41040442
    reference_title: 2025 SCAI/HRS Clinical Practice Guidelines on Transcatheter Left Atrial Appendage Occlusion.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Left atrial appendage occlusion (LAAO) devices reduce the risk of atrial
      fibrillation-associated stroke relative to no oral anticoagulation.
    explanation: Current evidence-based guideline supports stroke-risk reduction while noting selection uncertainty.
- name: Risk Factor Modification
  action_category: THERAPEUTIC
  description: Weight loss, blood pressure control, sleep apnea treatment.
  evidence:
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lifestyle interventions and the reduction of risk factors lessen the frequency of AF."
    explanation: Guideline evidence that lifestyle intervention and risk-factor reduction lower AF frequency.
  target_mechanisms:
  - target: NOX2-Dependent Atrial Oxidative Stress
    treatment_effect: INHIBITS
    description: >-
      Weight loss removes the adipose-driven NADPH-oxidase activation that this
      entry curates as the obesity route into the atrial substrate.
  - target: Atrial Fibrosis
    treatment_effect: INHIBITS
    description: >-
      Blood-pressure control removes the pressure load that drives atrial
      stretch and fibrotic remodeling.
  - target: Cardiac Autonomic Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Treating obstructive sleep apnea removes the repetitive apnea-related
      autonomic surges that this entry curates as the sleep-apnea route to AF.
- name: Gut Microbial TMA-Lyase Inhibition (Iodomethylcholine)
  action_category: THERAPEUTIC
  description: >
    Iodomethylcholine (IMC), a gut-restricted CutC/D choline-TMA lyase inhibitor,
    suppresses microbial choline-to-TMA(O) transformation, reduces circulating
    TMAO, and delays choline-induced AF onset in mice. It is an investigational
    AF-prevention strategy, not yet a human therapy.
  notes: >-
    No suitable CHEBI or NCIT therapeutic-agent term was identified for
    iodomethylcholine; retain the named agent in the treatment name pending one.
  target_mechanisms:
  - target: Gut Microbial TMA Production
    treatment_effect: INHIBITS
    description: >-
      IMC inhibits the gut microbial CutC/D choline-TMA lyase, cutting TMA (and
      hence TMAO) production upstream of the autonomic-dysfunction arm.
    evidence:
    - reference: DOI:10.1172/JCI201684
      reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Iodomethylcholine (IMC), the gut microbial CutC/D inhibitor that
        suppresses choline→TMA(O) metabolic transformation, reduced circulating
        TMAO levels ... and choline induced AF onset
      explanation: Directly supports target engagement and the upstream metabolic effect in mice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: DOI:10.1172/JCI201684
    reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Iodomethylcholine (IMC), the gut microbial CutC/D inhibitor that
      suppresses choline→TMA(O) metabolic transformation, reduced circulating
      TMAO levels ... and choline induced AF onset
    explanation: Directly supports the molecular target, lowered circulating TMAO, and delayed AF onset in mice.
mechanistic_hypotheses:
- hypothesis_group_id: tmao_autonomic_af
  hypothesis_label: Gut microbial TMAO promotes AF via M2 muscarinic receptor autonomic dysfunction
  status: EMERGING
  description: >
    Gut-microbiome-derived TMAO promotes AF onset and persistence, at least in
    part by inhibiting the cardiac M2 muscarinic receptor (TMAO mimics
    acetylcholine), producing autonomic dysfunction with atrial APD/wavelength
    shortening. Supported by a human association (adjusted OR 1.7), two mouse AF
    models, and pharmacologic reversal with the gut-restricted CutC/D inhibitor
    IMC.
  evidence:
  - reference: DOI:10.1172/JCI201684
    reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMAO levels were quantified in plasma from serial subjects undergoing
      elective cardiac catheterizations (N=5090) and shown to independently
      associate with prevalent AF following adjustment for risk factors (TMAO
      adjusted odds ratio 1.7 [95% confidence interval 1.3-2.1]
    explanation: Supports human association only; it does not prove the proposed causal chain.
  - reference: DOI:10.1172/JCI201684
    reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the gut microbial metabolite TMAO, independently associated with AF risk
      in subjects, enhances AF in multiple AF mouse models via autonomic dysfunction
    explanation: Supports the model-organism mechanism while preserving EMERGING status.
experimental_models:
- name: Palmitate-treated human iPSC-derived atrial cardiomyocytes
  description: >-
    Human iPSC-derived atrial cardiomyocytes exposed to palmitate model the
    obesity-associated NOX2 oxidative-stress and ion-channel-remodeling axis.
    The reductionist system lacks multicellular atrial structure, autonomic
    input, and thromboembolic physiology.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Atrial cardiomyocyte
    term:
      id: CL:0002129
      label: regular atrial cardiac myocyte
  conditions:
  - Palmitate exposure
  culture_system: Two-dimensional human iPSC-derived atrial cardiomyocyte culture
  modeled_mechanisms:
  - target: Atrial Electrical Remodeling
    description: Assays obesity-associated NOX2-dependent atrial ion-channel remodeling.
  evidence:
  - reference: PMID:39146015
    reference_title: Modulation of NOX2 causes obesity-mediated atrial fibrillation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unbiased transcriptomics analysis revealed that NOX2 mediates atrial
      remodeling in obesity-mediated AF in DIO mice, PA-treated hiPSC-aCMs, and
      human atrial tissue from obese individuals
    explanation: Directly identifies the palmitate-treated hiPSC atrial-cardiomyocyte model and cross-system comparison.
animal_models:
- species: Goat (Capra hircus)
  category: Chronic rapid-atrial-pacing model
  description: >-
    Awake chronically instrumented goats were maintained in AF to measure
    time-dependent shortening of fibrillation interval and increased AF
    inducibility, establishing tachycardia-induced electrical remodeling.
  associated_phenotypes:
  - Atrial Fibrillation
  evidence:
  - reference: PMID:7671380
    reference_title: "Atrial fibrillation begets atrial fibrillation. A study in awake chronically instrumented goats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During the first 24 hours of AF the median fibrillation interval shortened
      from 145 +/- 18 to 108 +/- 8 ms and the inducibility of AF by a single
      premature stimulus increased from 24% to 76%.
    explanation: Defines the model and its core electrophysiologic outputs.
  modeled_mechanisms:
  - target: Atrial Electrical Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Sustained rapid atrial activation in the awake goat reproduces the
      shortening of atrial refractoriness and rising AF inducibility that define
      tachycardia-induced electrical remodeling.
    limitations: >-
      Remodeling is driven by imposed pacing in structurally normal goat atria,
      so it isolates the rate-dependent component and omits the fibrotic,
      inflammatory, and metabolic substrate of human clinical AF.
    evidence:
    - reference: PMID:7671380
      reference_title: "Atrial fibrillation begets atrial fibrillation. A study in awake chronically instrumented goats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        During the first 24 hours of AF the median fibrillation interval shortened
        from 145 +/- 18 to 108 +/- 8 ms and the inducibility of AF by a single
        premature stimulus increased from 24% to 76%.
      explanation: Reports the shortened fibrillation interval and increased inducibility that constitute electrical remodeling in this model.
- species: Mouse (Mus musculus)
  genotype: Fibroblast-specific NLRP3 activation with knockdown rescue
  category: Conditional inflammatory atrial-cardiomyopathy model
  genes:
  - preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  description: >-
    Fibroblast-restricted NLRP3 activation models inflammatory atrial fibrosis,
    conduction slowing, and AF susceptibility; NLRP3 knockdown provides a causal
    rescue arm.
  associated_phenotypes:
  - Atrial Fibrillation
  evidence:
  - reference: PMID:40243956
    reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fibroblast-specific activation of NLRP3 in mice induced AF-promoting
      atrial myopathy and heart failure with diastolic dysfunction, accompanied
      by increased fibrosis, and reduced conduction velocity.
    explanation: Directly reports the modeled AF substrate and phenotypes.
  modeled_mechanisms:
  - target: Fibroblast NLRP3 Inflammasome Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Conditional fibroblast-restricted NLRP3 activation is the direct
      experimental instantiation of this node, and the knockdown arm supplies
      the causal rescue.
    limitations: >-
      Inflammasome activity is engineered and cell-type-restricted rather than
      arising from the mixed inflammatory milieu of human atrial myopathy.
    evidence:
    - reference: PMID:40243956
      reference_title: Fibroblast-Restricted Inflammasome Activation Promotes Atrial Fibrillation and Heart Failure With Diastolic Dysfunction.
      supports: SUPPORT

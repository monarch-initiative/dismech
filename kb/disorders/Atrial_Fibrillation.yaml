clinical_trials:
- name: NCT01288352
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    EAST-AFNET 4 randomized 2,789 patients with recently diagnosed AF and
    cardiovascular conditions to early rhythm control or usual care. Early
    rhythm control reduced the primary cardiovascular composite, while serious
    rhythm-control-related adverse events were more frequent.
  target_phenotypes:
  - preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: clinicaltrials:NCT01288352
    reference_title: Early Therapy of Atrial Fibrillation for Stroke Prevention Trial (EAST).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EAST prospectively tests the hypothesis that an early, structured rhythm
      control therapy based on antiarrhythmic drugs and catheter ablation can
      prevent atrial fibrillation (AF) related complications in patients with AF
      when compared to usual care.
    explanation: Registry text establishes the trial question and randomized strategies.
  - reference: PMID:32865375
    reference_title: Early Rhythm-Control Therapy in Patients with Atrial Fibrillation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A first-primary-outcome event occurred in 249 of the patients assigned to
      early rhythm control (3.9 per 100 person-years) and in 316 patients assigned
      to usual care (5.0 per 100 person-years) (hazard ratio, 0.79; 96% confidence
      interval, 0.66 to 0.94; P = 0.005).
    explanation: Supplies the principal randomized outcome without implying all AF populations share the effect.
- name: NCT00911508
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    CABANA randomized 2,204 symptomatic patients to catheter ablation or drug
    therapy. In intention-to-treat analysis ablation did not significantly
    reduce the primary death/disabling-stroke/serious-bleeding/cardiac-arrest
    composite, but reduced AF recurrence and death or cardiovascular hospitalization.
  target_phenotypes:
  - preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: clinicaltrials:NCT00911508
    reference_title: Catheter Ablation vs Anti-arrhythmic Drug Therapy for Atrial Fibrillation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CABANA Trial is designed to test the hypothesis that the treatment
      strategy of left atrial catheter ablation for the purpose of eliminating
      atrial fibrillation (AF) will be superior to current state-of-the-art therapy
    explanation: Registry text establishes the interventional comparison.
  - reference: PMID:30874766
    reference_title: "Effect of Catheter Ablation vs Antiarrhythmic Drug Therapy on Mortality, Stroke, Bleeding, and Cardiac Arrest Among Patients With Atrial Fibrillation: The CABANA Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients with AF, the strategy of catheter ablation, compared with
      medical therapy, did not significantly reduce the primary composite end
      point of death, disabling stroke, serious bleeding, or cardiac arrest.
    explanation: Preserves the neutral primary intention-to-treat result rather than overstating ablation benefit.
discussions:
- discussion_id: gap_af_mechanism_to_human_therapy
  prompt: >-
    Which experimentally supported AF-promoting mechanisms produce reproducible,
    mechanism-specific benefit in randomized human trials beyond established
    rhythm, rate, anticoagulation, and risk-factor strategies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Fibroblast NLRP3 Inflammasome Activation
  - pathophysiology#Gut Microbial TMA Production
  rationale: >-
    NLRP3 and TMAO perturbations are compelling in animal models, but neither
    establishes clinical efficacy or a validated human causal treatment path.
  evidence:
  - reference: PMID:41543444
    reference_title: "The clinical pathophysiology of atrial fibrillation: outstanding questions from bedside to bench and back."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The treatment of AF involves multiple potential approaches, all of which
      presently have significant limitations.
    explanation: Current review explicitly identifies the treatment-translation gap.
- discussion_id: gap_af_screening_outcome_benefit
  prompt: >-
    Which target populations, AF-burden thresholds, and downstream treatment
    pathways make systematic AF screening improve stroke or survival outcomes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Non-invasive systematic AF screening
  rationale: >-
    Detection yield is reproducibly higher, but randomized screening data have
    not demonstrated fewer strokes, deaths, hospitalizations, or bleeding events.
  evidence:
  - reference: PMID:40276326
    reference_title: "Systematic screening for atrial fibrillation with non-invasive devices: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pooled data from RCTs did not demonstrate an effect of screening on death
      (RR 1.01, 95% CI 0.97-1.05), cardiovascular hospitalisation (1.00, 95% CI
      0.97-1.03), stroke (0.95, 95% CI 0.87-1.04) or bleeding (1.08, 95% CI 0.91-1.29).
    explanation: Directly supports the unresolved clinical-outcome question.
- discussion_id: gap_af_biomarker_clinical_utility
  prompt: >-
    Can NT-proBNP or multimarker panels prospectively improve AF screening or
    outcome-guided management enough to change clinical outcomes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#NT-proBNP as an incident-AF risk biomarker
  rationale: >-
    Current cohorts demonstrate association and incremental prediction, not
    prospective benefit from biomarker-directed action.
  evidence:
  - reference: PMID:36610061
    reference_title: Exploring the incremental utility of circulating biomarkers for robust risk prediction of incident atrial fibrillation in European cohorts using regressions and modern machine learning methods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical benefit of these findings for identifying at-risk individuals
      for targeted AF screening needs to be elucidated and tested prospectively.
    explanation: The study explicitly states the prospective-utility limitation.
- discussion_id: gap_af_evidence_generalizability_and_equity
  prompt: >-
    How should AF evidence and care pathways be adapted and tested across racial,
    ethnic, socioeconomic, disability, insurance, and rural populations that
    remain underrepresented or experience lower access to guideline-directed care?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Trial generalizability and unequal access to anticoagulation, ablation, and
    specialty care limit population-wide translation of efficacy evidence.
  evidence:
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      generalizability of the evidence is limited because many clinical trials
      have not included substantial proportions of participants who were Black
      or Hispanic, and have not examined variation by SDOH.
    explanation: The review explicitly identifies the evidence-generalizability limitation.
review_notes: >-
  Publication-readiness review through 2026-08-05 reconciled this common-AF
  record to MONDO:0004981, moved rare familial channelopathy claims out of scope,
  replaced broad or mismatched HPO mappings with AF-specific terms, removed
  unsupported frequency bands, split human from model evidence, and added
  epidemiology, progression, burden, diagnosis, differentials, biomarkers,
  trials, models, limitations, and prognosis. Valvular AF was not retained as a
  subtype because contemporary guidance no longer uses that disease
  classification; the mechanical-valve and mitral-stenosis distinction is
  captured explicitly under anticoagulation. The full 31-item D2P disposition
  is recorded in the associated REVIEW history event and PR.

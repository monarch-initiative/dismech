    reference_title: "Gut microbial trimethylamine N-oxide generation promotes risk of atrial fibrillation via muscarinic receptor-mediated autonomic dysfunction"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TMAO levels were quantified in plasma from serial subjects undergoing elective cardiac catheterizations (N=5090) and shown to independently associate with prevalent AF following adjustment for risk factors (TMAO adjusted odds ratio 1.7 [95% confidence interval 1.3-2.1]"
    explanation: Plasma TMAO independently associates with prevalent AF in a 5,090-subject clinical cohort (adjusted OR 1.7).
  - reference: DOI:10.1172/JCI201684

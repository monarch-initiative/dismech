biochemical:
- name: NT-proBNP as an incident-AF risk biomarker
  presence: Elevated
  specificity: Low for AF; prognostic/predictive rather than diagnostic
  notes: >-
    NT-proBNP reflects myocardial stress and predicts incident AF, but elevation
    is not AF-specific and its prospective utility for targeted screening is not
    yet established.
  evidence:
  - reference: PMID:36610061
    reference_title: Exploring the incremental utility of circulating biomarkers for robust risk prediction of incident atrial fibrillation in European cohorts using regressions and modern machine learning methods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NT-proBNP was the strongest circulating predictor of incident AF [hazard
      ratio (HR) per standard deviation (SD), 1.93 (95% CI, 1.82-2.04); P < 0.001].
    explanation: Directly supports predictive association in 42,280 pooled European cohort participants.
- name: Multimarker adverse-outcome panel in established AF
  presence: Measured in plasma
  specificity: Prognostic panel; not a diagnostic signature
  notes: >-
    D-dimer, GDF-15, IL-6, NT-proBNP, and hs-troponin T improve risk prediction
    for several adverse outcomes, but do not establish a single causal AF
    mechanism or replace validated clinical assessment.
  evidence:
  - reference: PMID:40744929
    reference_title: Biomarker panels for improved risk prediction and enhanced biological insights in patients with atrial fibrillation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify 5 biomarkers including D-dimer, growth differentiation factor
      15 (GDF-15), interleukin-6 (IL-6), N-terminal pro-B-type natriuretic
      peptide (NT-proBNP), and high-sensitivity troponin T (hsTropT) that
      independently predict cardiovascular death, stroke, myocardial infarction,
      and systemic embolism
    explanation: Directly reports outcome prediction in 3,817 patients with AF.
diagnosis:
- name: Clinician-interpreted electrocardiography
  description: >-
    A 12-lead ECG or other clinician-reviewed rhythm tracing establishes AF by
    documenting the characteristic atrial rhythm. Longer ambulatory monitoring
    may be required when episodes are intermittent; device alerts require
    confirmatory review.
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  results: Electrocardiographic tracing consistent with atrial fibrillation.
  evidence:
  - reference: PMID:39674741
    reference_title: Analysis of The 2024 ESC/EACTS Guidelines For The Management Of Atrial Fibrillation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For diagnosis, electrocardiographic confirmation of clinical AF is
      essential, followed by risk stratification using the CHA₂DS₂-VASc score
      to guide anticoagulation therapy.
    explanation: Directly supports the diagnostic role of an electrocardiographic tracing.
  - reference: PMID:10549907
    reference_title: Electrocardiographic differentiation of atrial flutter from atrial fibrillation by physicians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study was to determine the ability of physicians to
      differentiate atrial flutter from atrial fibrillation on a surface
      electrocardiogram (ECG).
    explanation: Directly supports clinician interpretation of a surface ECG and the need to distinguish AF from flutter.
- name: Non-invasive systematic AF screening
  description: >-
    Pulse, handheld ECG, patch, or wearable strategies can increase detection of
    previously unrecognized AF, but trial evidence has not shown reduced adverse
    outcomes; screening is therefore distinct from diagnosis and treatment.
  evidence:
  - reference: PMID:40276326
    reference_title: "Systematic screening for atrial fibrillation with non-invasive devices: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic screening for AF using non-invasive devices is associated with
      increased diagnosis of AF, but not reduced adverse clinical events.
    explanation: Meta-analysis distinguishes higher diagnostic yield from unproven clinical-outcome benefit.
- name: Initial structural and secondary-cause evaluation
  description: >-
    After AF is confirmed, transthoracic echocardiography evaluates cardiac
    structure and ventricular function; complete blood count, metabolic panel,
    and thyroid testing assess clinically relevant associated conditions.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Cardiac structure/function and laboratory contributors documented for management.
  evidence:
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evaluation of patients with newly identified AF should include
      transthoracic echocardiogram to assess cardiac structure and to identify
      possible causes for AF (eg, valve disease)4or outcomes associated with AF
      (eg, reduced ventricular function). Basic laboratory testing, including
      complete blood count, metabolic panel, and thyroid function, is
      appropriate.4Additional testing
    explanation: Directly supports the initial structural and laboratory evaluation.
differential_diagnoses:
- name: Atrial Flutter
  disease_term:
    preferred_term: atrial flutter
    term:
      id: MONDO:0005310
      label: atrial flutter
  description: >-
    A macroreentrant atrial arrhythmia that may have a regular or variably
    conducted ventricular response and can be mistaken for AF on a surface ECG.
  distinguishing_features:
  - Organized flutter-wave activity and a repeating atrial cycle favor flutter.
  - Prominent atrial activity can make AF appear flutter-like; review multiple leads and longer recordings.
  evidence:
  - reference: PMID:10549907
    reference_title: Electrocardiographic differentiation of atrial flutter from atrial fibrillation by physicians.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, atrial fibrillation is frequently misdiagnosed as atrial
      flutter. Misdiagnosis of atrial fibrillation occurs more often when atrial
      activity is prominent on an ECG in more than one lead.
    explanation: Directly demonstrates clinically important ECG overlap and misclassification.
- name: Multifocal Atrial Tachycardia
  disease_term:
    preferred_term: multifocal atrial tachycardia
    term:
      id: MONDO:0017988
      label: multifocal atrial tachycardia
  description: >-
    An irregular atrial tachyarrhythmia, often in severe cardiopulmonary illness,
    that can mimic AF.
  distinguishing_features:
  - At least three different nonsinus P-wave morphologies in one lead.
  - Atrial rate above 100 beats/min with an isoelectric baseline between P waves.
  evidence:
  - reference: PMID:8040593
    reference_title: "Recognition and treatment of multifocal atrial tachycardia: a critical review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic criteria include the presence of at least three different,
      nonsinus P waves in the same lead; an atrial rate greater than 100 beats
      per minute; and an isoelectric baseline between P waves. MAT is often
      difficult to differentiate from atrial fibrillation.
    explanation: Provides explicit distinguishing ECG criteria and states the AF differential.
treatments:
- name: Anticoagulation
  action_category: THERAPEUTIC
  description: >-
    Warfarin or a direct oral anticoagulant (DOAC) is used to prevent stroke
    according to thromboembolic risk. DOAC preference applies only in patients
    without mechanical heart valves or moderate-to-severe mitral stenosis.
  notes: >-
    Contemporary guidelines no longer classify AF itself as valvular versus
    nonvalvular; that distinction is retained only to guide anticoagulant
    selection. It is therefore represented here as a treatment caveat rather
    than as an AF subtype.
  target_phenotypes:
  - preferred_term: Thromboembolic stroke
    term:
      id: HP:0001727
      label: Thromboembolic stroke
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
    - preferred_term: apixaban
      term:
        id: CHEBI:72296
        label: apixaban
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
    - preferred_term: dabigatran
      term:
        id: CHEBI:70752
        label: dabigatran
  evidence:
  - reference: PMID:37573616
    reference_title: "Systematic Review and Meta-Analysis of Direct Oral Anticoagulants Versus Warfarin in Atrial Fibrillation With Low Stroke Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOAC was associated with a significantly lower risk of stroke or systemic embolism (hazard ratio 0.85, 95% confidence interval 0.75 to 0.96, p = 0.008, I2 = 0%), major bleeding, intracranial hemorrhage, and mortality compared with warfarin."
    explanation: Meta-analysis of 132,980 patients demonstrates DOACs reduce stroke risk in AF patients.
  - reference: PMID:40526576
    reference_title: "Clinical Practice Guideline: Preventive Measures and Treatment Options for Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If it is 2 or higher, oral anticoagulation (OAC) is indicated, of a type that should be decided on an individual basis."
    explanation: The guideline indicates oral anticoagulation for AF patients with a CHA2DS2-VA score of 2 or higher.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients without mechanical heart valves or moderate to severe mitral
      stenosis, DOACs are preferred because they are associated with less
      bleeding than warfarin.
    explanation: Directly supplies the mechanical-valve and mitral-stenosis boundary on DOAC preference.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: AF is no longer categorized according to valvular or nonvalvular AF.
    explanation: Directly supports not retaining valvular AF as a contemporary subtype.
  - reference: PMID:39680399
    reference_title: "Atrial Fibrillation: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This distinction is only currently used to guide OAC strategy.
    explanation: Supports retaining valvular status specifically as an anticoagulation modifier.

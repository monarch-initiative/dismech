    explanation: This review identifies structural neurological disease as the predominant etiologic context.
  - reference: PMID:23206528
    reference_title: "Neurological and neuropsychological characteristics of occipital, occipito-temporal and occipito-parietal infarction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual disorders, such as achromatopsia, akinetopsia or prosopagnosia, were rarely reported by the patients."
    explanation: >-
      This cohort documents akinetopsia after posterior cerebral infarction,

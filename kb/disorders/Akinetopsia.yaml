treatments:
- name: Underlying-condition-directed treatment
  description: >-
    Management is individualized to the cause of akinetopsia. A systematic
    review of case reports found that treatment was usually successful when
    directed at the underlying condition, whereas cases caused by organic
    lesions tended to be treatment-resistant.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:39996018
    reference_title: "Akinetopsia: a systematic review on visual motion blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments were mostly successful when they were aimed at the underlying
      condition, while cases due to organic lesions tended to be
      therapy-resistant.
    explanation: >-
      The systematic review directly supports cause-directed management while
      documenting poorer treatment response in organic-lesion cases.
  notes: >-
    This is a cross-etiology management principle from case literature, not
    evidence for one universal intervention; the specific treatment depends on
    the diagnosed underlying condition.
- name: Carbamazepine for seizure-related akinetopsia
  description: >-
    In a single seizure-associated case, carbamazepine 200 mg/day completely
    suppressed recurrent akinetopsic symptoms. This case-level response should
    not be generalized to structural or exposure-associated akinetopsia.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Paroxysmal MT/V5 Hyperexcitability
    treatment_effect: MODULATES
    description: >-
      Symptom suppression is consistent with modulation of the cortical
      hyperexcitability implicated in this patient; the abstract does not
      establish a molecular drug target.
    evidence:
    - reference: PMID:25667833
      reference_title: "Akinetopsia as epileptic seizure."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We diagnosed his visual symptom as akinetopsia, which was aroused by hyperexcitability of the right temporal and parietal cortices, including area MT/V5."
      explanation: This identifies the case-specific mechanism targeted by antiseizure treatment.
    - reference: PMID:25667833
      reference_title: "Akinetopsia as epileptic seizure."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We administered carbamazepine 200 mg/day, which suppressed his akinetopsic symptom completely."
      explanation: >-
        This documents complete symptom suppression but does not directly assay
        carbamazepine's molecular or network target.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:

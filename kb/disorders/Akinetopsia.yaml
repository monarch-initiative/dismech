name: Akinetopsia
creation_date: '2026-02-02T17:31:18Z'
category: Complex
description: >-
  Akinetopsia (motion blindness) is a rare visual cortical disorder characterized
  by impaired perception of visual motion, with moving objects perceived as
  disjointed jumps or freeze-frames. The condition is linked to dysfunction of
  motion-processing regions in the visual cortex, especially area V5/MT.
disease_term:
  preferred_term: akinetopsia
  term:
    id: MONDO:0000660
    label: akinetopsia
parents:
- agnosia
- mental disorder
synonyms:
- Motion blindness
- Visual motion blindness
notes: >-
  Akinetopsia is described as a cortical syndrome in which patients lose the
  ability to perceive visual motion.
prevalence:
- population: Reported cases
  notes: >-
    Since first description in 1911, only a handful of cases have been studied,
    indicating an extremely rare disorder.
  evidence:
  - reference: PMID:40605075
    reference_title: "Life in stop motion: a review of akinetopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since akinetopsia was first described in 1911, only a handful of cases have been studied."
    explanation: This review emphasizes the rarity of akinetopsia and the limited number of documented cases.
  - reference: PMID:37938052
    reference_title: "Akinetopsia: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Selective motion blindness, also known as akinetopsia, is infrequently reported in the literature."
    explanation: This systematic review notes that akinetopsia is infrequently reported, supporting rarity.
pathophysiology:
- name: Cortical Visual-Motion Integration Failure
  description: >-
    Dysfunction of the V5/MT-centered visual-motion network prevents normal
    integration of successive visual positions into continuous motion. Clinical
    and experimental observations differ in hemispheric predominance, and
    symptom severity varies with the surviving network and stimulus speed.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: visual cortex
    term:
      id: UBERON:0000411
      label: visual cortex
  - preferred_term: secondary visual cortex
    term:
      id: UBERON:0022232
      label: secondary visual cortex
  downstream:
  - target: Global Akinetopsia
    causal_link_type: UNKNOWN
    description: >-
      Bilateral V5/MT lesions are associated with global, often chronic motion
      blindness, but the review does not establish a single lesion-to-symptom
      route for every case.
    evidence:
    - reference: PMID:39996018
      reference_title: "Akinetopsia: a systematic review on visual motion blindness."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Bilateral lesions to V5/MT most often coincided with global akinetopsia and chronicity, although we found that the severity of the condition also depends on surviving components of the visual motion network as a whole"
      explanation: >-
        The systematic review links bilateral V5/MT lesions with the global
        endpoint while also showing that network context modifies severity;
        causal directness is therefore left unresolved.
  - target: Hemifield Akinetopsia
    causal_link_type: UNKNOWN
    description: >-
      Motion blindness can be confined to one visual hemifield, although the
      available review does not resolve a consistent lesion-to-field mapping.
    evidence:
    - reference: PMID:39996018
      reference_title: "Akinetopsia: a systematic review on visual motion blindness."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the clinical cases, 12% showed hemiakinetopsia, 50% continuous or progressive symptoms, and 52% a chronic course."
      explanation: >-
        This establishes hemiakinetopsia as a reviewed clinical endpoint but
        does not establish the directness or laterality of its causal route.
  evidence:
  - reference: PMID:39996018
    reference_title: "Akinetopsia: a systematic review on visual motion blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite its profound impact, the condition remains poorly understood beyond the established centrality of cortical area V5/MT in visual motion perception."
    explanation: This systematic review highlights V5/MT as central to motion perception, supporting V5/MT dysfunction as a core mechanism.
  - reference: PMID:27193360
    reference_title: "Some Unusual Neuropsychological Syndromes: Somatoparaphrenia, Akinetopsia, Reduplicative Paramnesia, Autotopagnosia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "akinetopsia (cortical syndrome in which patient losses the ability to perceive visual motion)"
    explanation: This review defines akinetopsia as a cortical syndrome with loss of visual motion perception.
  - reference: PMID:37938052
    reference_title: "Akinetopsia: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results revealed distinct characteristics for the various etiologies of this phenomenon in addition to a shared pathophysiologic pathway among them."
    explanation: This systematic review supports a shared pathophysiologic pathway across akinetopsia etiologies.
  - reference: PMID:39996018
    reference_title: "Akinetopsia: a systematic review on visual motion blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathophysiologically, in right-handed individuals, the left area V5/MT was found to be particularly susceptible to acute interference, as evidenced by the experimental studies."
    explanation: >-
      Experimental observations identify left V5/MT susceptibility to acute
      interference; this is retained as context rather than a separate causal node.
  - reference: PMID:39996018
    reference_title: "Akinetopsia: a systematic review on visual motion blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a greater prevalence of right-hemispheric afflictions in clinical cases, suggesting that the right area V5/MT plays a more dominant role in motion perception."
    explanation: >-
      Clinical observations identify right-hemispheric predominance; this
      complements, rather than replaces, the experimental laterality finding.
  - reference: PMID:39996018
    reference_title: "Akinetopsia: a systematic review on visual motion blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the severity of the condition also depends on surviving components of the visual motion network as a whole, and-in line with the dynamic parallellism theory-the speed of moving objects."  # codespell:ignore-line
    explanation: >-
      This supports surviving network components and stimulus speed as context
      modifying the severity of cortical visual-motion integration failure.
- name: Structural V5/MT Network Injury
  description: >-
    Stroke and neurodegenerative conditions are the predominant reported
    structural contexts for akinetopsia. Clinical reports in infarction,
    posterior cortical atrophy, and Parkinson disease are retained here as
    etiologic context rather than represented as differential diagnoses.

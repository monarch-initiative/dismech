    explanation: >-
      Places the gene product in the cochlear sensory epithelium, the cell
      population the module identifies as the vulnerable target of its trigger
      node. Classified MODEL_ORGANISM because this is rodent inner-ear tissue
      (rat organ of Corti whole mounts and adult mouse expression data), not a
      cell culture.
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural
      hearing loss in 47 individuals from 28 (26 unrelated) families.
    explanation: >-
      Establishes that biallelic loss of the gene expressed in the cochlear
      sensory epithelium causes sensorineural hearing loss in humans.
  notes: >-
    Conformance is deliberately limited to the module's trigger node. See entry
    note (6) and the `afg2b_cochlear_mechanism_gap` discussion for why the
    downstream module nodes (ionic homeostasis and oxidative stress, hair cell
    mechanotransduction failure and death, spiral ganglion degeneration,
    progressive hearing loss) are NOT claimed.


    This node hangs directly off the root loss-of-function node rather than off
    55LCC ATPase Complex Dysfunction, and that placement is deliberate. The
    tissue-level cochlear claim rests on AFG2B expression in the cochlear sensory
    epithelium plus the human genotype-phenotype relationship. No 55LCC
    complex-level experiment has ever been performed in cochlear tissue, so
    routing the edge through the complex node would assert a mechanism that has
    not been shown in the ear.

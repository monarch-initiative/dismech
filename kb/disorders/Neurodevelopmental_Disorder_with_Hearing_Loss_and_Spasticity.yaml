diagnosis:
- name: Trio exome sequencing
  description: >-
    Diagnosis is molecular. The disorder has been identified exclusively by exome
    sequencing; trio testing establishes that the two variants are in trans and
    that each parent is a carrier. There is no biochemical marker and no
    disease-specific imaging finding, so a child with sensorineural hearing loss
    plus developmental delay, spasticity or dystonia should be offered sequencing
    rather than a metabolic workup, and AFG2B should be covered by
    neurodevelopmental and hearing-loss gene panels.
  notes: >-
    PMID:41375745 also reports an incidental de novo FRYL variant in the same
    proband that the authors could not exclude as a sequencing artefact. It is
    recorded here only as a reminder that incidental findings complicate
    interpretation in this ultra-rare disorder; it is not curated as a modifier.
  evidence:
  - reference: PMID:37902276
    reference_title: A further case of AFG2B-related neurodevelopmental disorder with
      hearing loss and microcephaly allows further clarification of pathogenicity
      of the variant c.1313T>C, p.(Leu438Pro).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed trio exome sequencing on the patient and her parents.
    explanation: Trio exome sequencing is the diagnostic method used.
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genetic testing confirmed the variants in trans.
    explanation: >-
      Confirming the trans configuration is the decisive step for a recessive
      diagnosis.
- name: Audiological assessment
  description: >-
    Formal audiology or auditory brainstem response testing establishes the
    bilateral sensorineural hearing loss that defines the disorder, and should be
    performed in infancy in any child with unexplained global developmental delay
    and abnormal tone.
  evidence:
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the 7th month of life audiological evaluation revealed bilateral sensorineural
      hearing loss of 60 dBnHL, and hearing aids were fitted.
    explanation: >-
      Audiological evaluation is what established the defining feature in the
      reported infant.
treatments:
- name: Hearing amplification
  description: >-
    Hearing aids are fitted once bilateral sensorineural hearing loss is
    identified, typically in infancy. This is supportive management of the
    disorder's defining feature, not disease-modifying therapy.
  treatment_term:
    preferred_term: hearing aid fitting
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: DEVICE
  notes: >-
    Cochlear implantation is the obvious escalation when amplification is
    insufficient, and the body of PMID:34626583 remarks that there appeared to be
    some benefit among the individuals who received it. That sentence is NOT
    quotable as evidence here: the cached copy of PMID:34626583 is abstract-only
    and the string "implant" does not occur in it, so the observation is recorded
    in this note rather than as an evidence item, and no cochlear-implantation
    treatment is curated. It is also uncontrolled and unquantified.


    The natural action term here would be MAXO:0009030 (hearing aid usage), but
    the `TreatmentActionTerm` dynamic-enum expansion cached in this repository
    (`cache/enums/treatmentactionterm_*.csv`) contains no MAXO terms at all - it
    resolves to NCIT only, and no MAXO term is used anywhere else in `kb/`. The
    closest in-enum NCIT action term is therefore used, with the specific
    intervention carried by `preferred_term` and `therapeutic_modality: DEVICE`.
    NCIT:C183182 (Hearing Aid) is also outside the cached enum expansion.
  evidence:
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: In the 7th month of life audiological evaluation revealed bilateral sensorineural
      hearing loss of 60 dBnHL, and hearing aids were fitted.
    explanation: >-
      Documents amplification in a single affected child. PARTIAL because no
      audiological outcome of amplification is reported for this disorder.

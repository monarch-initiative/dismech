- name: Cochlear Sensory Epithelium Involvement
  description: >-
    AFG2B is expressed in the neurosensory hair cells and supporting cells of the
    rodent inner ear - the founding report localised the protein to the hair
    cells and pillar cells of the rat organ of Corti and detected transcript in
    both inner and outer hair cells - and biallelic human variants produce
    bilateral sensorineural hearing loss in essentially every reported
    individual. This makes the cochlear sensory epithelium a directly affected
    tissue and places the disorder at the generic trigger node of the conserved
    sensorineural hair-cell-loss module, a hereditary lesion whose vulnerable
    target is the mechanosensitive cochlear hair cell. What happens next in the
    AFG2B cochlea is unknown; no hair-cell counts, endocochlear potential
    measurements, cochlear histology or spiral ganglion studies have been
    published for this gene, so conformance is asserted at this node only.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  conforms_to: sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult

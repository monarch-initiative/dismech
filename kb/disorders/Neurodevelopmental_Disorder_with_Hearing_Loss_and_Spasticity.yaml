        Just over half of affected individuals carry a microcephaly, developmental
        delay, cerebral palsy and epilepsy burden that is managed neurologically.
notes: >-
  Scope, naming and provenance notes for this entry.


  (1) GENE SYMBOL HISTORY - READ THIS FIRST. The causative gene is AFG2B
  (HGNC:28762, OMIM:619578), renamed from SPATA5L1 (spermatogenesis associated 5
  like 1). Every founding clinical report uses SPATA5L1: a PubMed search on
  2026-08-15 returned 14 records for `SPATA5L1` but only 2 for `AFG2B`, and the
  largest cohort (PMID:34626583) never uses the new symbol. Searching either
  symbol alone therefore misses most of the disease literature; both were
  searched for this entry. The rename has not propagated through the ontology
  stack used here. MONDO's `RO:0004003` axiom on MONDO:0859206 already reads
  `HGNC:28762 ! AFG2B`, but the HGNC adapter shipped with `sqlite:obo:hgnc` still
  resolves `hgnc:28762` to the label `SPATA5L1` (verified with
  `runoak -i sqlite:obo:hgnc info hgnc:28762`; a search for `AFG2B` returns
  nothing). Every `gene_term` in this entry therefore carries
  `preferred_term: AFG2B` with `term.label: SPATA5L1`, because SPATA5L1 is the
  label the term validator resolves. This is a lag in the cached HGNC build, not
  a curation error, and it must NOT be "fixed" to `AFG2B` until the adapter is
  refreshed. The sibling entry AFG2A-Related_Encephalopathy documents the exactly
  analogous situation for hgnc:18119 / SPATA5.


  (2) NAMED-ENTITY CONFUSION WITH AFG2A / SPATA5 - THE PRIMARY RISK FOR THIS
  ENTRY. AFG2A (HGNC:18119, formerly SPATA5) is a DIFFERENT gene one suffix away
  from this one, and it causes a DIFFERENT, clinically overlapping disorder
  (MONDO:0014698, curated in this repository as AFG2A-Related_Encephalopathy;
  founding report PMID:26299366). This entry is about AFG2B only. The NEC
  preflight was run before any deep-research content was used:
  `runoak -i sqlite:obo:mondo info MONDO:0859206 -O obo` returns
  `relationship: RO:0004003 HGNC:28762 ! AFG2B` and `xref: OMIM:619616`,
  matching the intended target on both the gene and the OMIM anchor. Every
  clinical citation in this entry was then checked for which gene the reported
  individuals actually carry variants in: PMID:34626583, PMID:37902276 and
  PMID:41375745 are AFG2B/SPATA5L1 cohorts. PMID:41933351 is an AFG2A cohort
  review and is cited ONLY inside `differential_diagnoses`, never as support for
  a phenotype of this entry. The three structural and biochemical papers
  (PMID:38554706, PMID:40268917, PMID:35354024) study the 55LCC complex as a
  whole and are cited for complex composition and function, not for any
  gene-specific clinical claim; PMID:35354024 in particular measures the protein
  synthesis defect after loss of C1ORF109 or SPATA5 (AFG2A), NOT after loss of
  AFG2B, which is why the downstream translation node is marked PROVISIONAL.
  Two further AFG2B papers surfaced by the literature search, PMID:34864870
  (full-house nephropathy with high SPATA5L1 expression) and PMID:41390732
  (AFG2B variants in childhood lupus nephritis), describe renal and autoimmune
  phenotypes that are not part of NEDHLS and are deliberately NOT cited.


  (3) DISEASE NAME. The file is named for the OMIM and MONDO term, which is also
  the name used by the issue that requested this entry and by the only paper that
  uses the new gene symbol in its title (PMID:37902276, "A further case of
  AFG2B-related neurodevelopmental disorder with hearing loss and microcephaly").
  No paper titles the disorder "AFG2B-related encephalopathy"; that phrase
  appears only inside the body of the AFG2A review (PMID:41933351) and was
  therefore not adopted as the entry name or as a synonym.


  (4) NO GENEREVIEWS CHAPTER EXISTS. PubMed searches run on 2026-08-15 with the
  queries `SPATA5L1 GeneReviews[All Fields]`, `AFG2B GeneReviews[All Fields]` and
  `neurodevelopmental disorder with hearing loss and spasticity GeneReviews[All
  Fields]` each returned zero records. The mandatory GeneReviews phenotype
  baseline therefore does not apply. The baseline used instead is the founding
  47-individual cohort (PMID:34626583), which remains the largest published
  series, cross-checked against the two subsequent single-case reports
  (PMID:37902276, PMID:41375745).


  (5) FREQUENCY BANDS AND THE ASCERTAINMENT CAVEAT. Only one frequency band is
  asserted, from a published denominator in PMID:34626583. Sensorineural hearing
  loss is VERY_FREQUENT: it was present in all 47 individuals. That denominator
  is however ascertainment-biased, because the cohort was assembled around
  hearing loss, so the band states what is true of reported individuals, not
  necessarily of all biallelic AFG2B genotypes, and this caveat is recorded on
  the phenotype. The composite neurodevelopmental burden (microcephaly,
  developmental delay/intellectual disability, cerebral palsy and/or epilepsy)
  was 25/47 (53%), which would map to FREQUENT, but that figure is a COMPOSITE
  across four features and cannot be redistributed onto any single one of them.
  No per-feature denominator has ever been published for AFG2B. Bands on
  microcephaly, developmental delay, intellectual disability, cerebral palsy,
  spasticity, dystonia and epilepsy are therefore deliberately OMITTED rather
  than guessed, and the 53% composite is recorded in each of those phenotypes'
  `notes:`. Craniofacial dysmorphism is likewise unbanded: PMID:41375745
  describes it in "approximately one-third of affected individuals in the
  literature" but gives no numerator or denominator of its own.


  (6) WHY CONFORMANCE TO `sensorineural_hair_cell_loss` IS PARTIAL AND NOT
  ASSERTED DOWN THE WHOLE CHAIN. This was evaluated rather than assumed. The
  cochlear node of this entry declares
  `conforms_to: sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult`
  and nothing further. That single conformance is supported: PMID:34626583 shows
  that in the rodent inner ear Spata5l1 is expressed in the neurosensory hair
  cells and inner ear supporting cells (its full text localises the protein to
  hair cells and pillar cells of the organ of Corti in rat whole mounts), and
  biallelic human variants produce sensorineural hearing loss. That is exactly
  the module's generic trigger, a hereditary lesion of the cochlear sensory
  epithelium with the mechanosensitive hair cell as the vulnerable target. The
  module's three downstream nodes - cochlear ionic homeostasis disruption and
  oxidative stress, hair cell mechanotransduction failure and death, and spiral
  ganglion neuron degeneration - have NO AFG2B evidence whatsoever: no cochlear
  histology of an AFG2B-deficient animal, no endocochlear potential measurement,
  no hair cell counts and no auditory nerve study has been published for this
  gene. Conforming to them would assert mechanisms nobody has looked for. The
  module's terminal node is furthermore "Progressive Sensorineural Hearing Loss",
  and PMID:34626583 explicitly characterises the accompanying phenotype as
  NONPROGRESSIVE, so even the endpoint is not safe to claim. The gap is recorded
  as a KNOWLEDGE_GAP discussion (`afg2b_cochlear_mechanism_gap`) with the
  experiments that would resolve it.


  (7) STRUCTURED SOURCES CHECKED AND FOUND ABSENT, NOT SKIPPED BY DEFAULT. No
  Orphanet, ClinGen gene-disease validity (CGGV) or ClinGen dosage (CGDS) record
  is cited. This absence is specific rather than general: MONDO:0859206 carries
  `xref: Orphanet:659975` but `ls references_cache/ORPHA_659975.md` returns no
  such file, and
  `grep -l -i -e SPATA5L1 -e AFG2B -e HGNC:28762 references_cache/CGGV_*.md
  references_cache/CGDS_*.md` returns nothing across the CGGV and CGDS files
  present in the cache. Generating the missing records would require bumping a
  structured-source `data/*/MANIFEST.yaml` pin, which is out of scope for a
  curation PR (and those pins are tracked as stale in #7622), so the citation is
  skipped rather than fabricated.


  (8) DEEP RESEARCH PROVENANCE. One Falcon (Edison) run was performed and is
  committed at
  `research/Neurodevelopmental_Disorder_with_Hearing_Loss_and_Spasticity-deep-research-falcon.md`.
  It was treated as leads only. It independently resolved the disease to AFG2B
  (not AFG2A) and surfaced the same two primary clinical sources and the same
  mechanistic source used here, so it passed the NEC preflight. Its own reference
  validator flagged one unresolved citation (a malformed DOI link), and every
  PMID, snippet and ontology term used in this entry was independently fetched
  and verified against the local cache rather than taken from the report.


  (9) WHAT IS KNOWINGLY ABSENT. No treatment in this entry is disease-modifying;
  everything curated is supportive (amplification, rehabilitation, genetic
  counselling) and the disease-specific evidence base for each is a single case
  report at best. No animal model of AFG2B deficiency has been published, so
  there is no `animal_models` block; the only in vivo AFG2B data located are
  rodent expression studies (PMID:34626583), not a knockout, and the point is
  recorded as a discussion. No genotype-phenotype correlation is asserted
  anywhere in this entry; PMID:41375745 states explicitly that the published
  cohort is too small to support one. No prevalence rate is given because none
  has been estimated; the entry records only a CASES_IN_LITERATURE count. No
  environmental factor is curated, because the deep-research run found no toxin,
  infection, or exposure implicated in this monogenic disorder. The mTOR rescue
  axis reported for the paralogous 55LCC subunit AIRIM/C1orf109 (PMID:40760247)
  is curated as a pathophysiology observation and a discussion, NOT as a
  treatment, because it has never been tested in an AFG2B model.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or, more commonly, compound heterozygous) AFG2B
    variants are required. Heterozygous carrier parents are unaffected, and
    segregation in trans has been confirmed in the reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Collectively, our results indicate that bi-allelic SPATA5L1 variants
      lead to a human disease characterized by sensorineural hearing loss (SNHL)
      with or without a nonprogressive mixed neurodevelopmental phenotype.
    explanation: >-
      The founding cohort establishes that the disorder requires biallelic
      variants.
  - reference: PMID:37902276
    reference_title: A further case of AFG2B-related neurodevelopmental disorder with
      hearing loss and microcephaly allows further clarification of pathogenicity
      of the variant c.1313T>C, p.(Leu438Pro).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bi-allelic variants in AFG2B (previously known as SPATA5L1) have recently
      been associated with a neurodevelopmental disorder with hearing loss and spasticity,
      as well as isolated hearing loss.
    explanation: >-
      Independent restatement of the biallelic requirement, and the only report
      to use the current gene symbol in its title.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty-seven individuals from 28 (26 unrelated) families in the founding
    cohort (PMID:34626583), plus two subsequently reported single cases
    (PMID:37902276, PMID:41375745). No population prevalence or incidence has
    ever been estimated for this disorder, so no rate is recorded.
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural
      hearing loss in 47 individuals from 28 (26 unrelated) families.
    explanation: Gives the total number of individuals reported in the founding series.
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Importantly, biallelic pathogenic variants in SPATA5L1 were only recently
      recognized as a cause of a distinct neurodevelopmental disorder, and fewer than
      30 affected individuals have been described to date
    explanation: >-
      Independent confirmation of ultra-rarity. Note that this case report counts
      only the individuals with the full neurodevelopmental phenotype, which is
      the 25/47 subgroup of the founding cohort rather than all 47.
progression:
- age_range: Birth to 2 years
  notes: >-
    Bilateral sensorineural hearing loss is typically identified in infancy (one
    reported child at 7 months, 60 dBnHL) and developmental concerns are usually
    raised in the first year. The motor phenotype can evolve: an infant may
    present with generalised hypotonia and persistent primitive reflexes and only
    later develop the spastic-dystonic pattern. Microcephaly may be postnatal
    rather than congenital in at least some individuals.
  evidence:
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the 7th month of life audiological evaluation revealed bilateral sensorineural
      hearing loss of 60 dBnHL, and hearing aids were fitted.
    explanation: Documents infantile identification of the hearing loss.
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The persistence of primitive reflexes, central hypotonia, and pathological
      postural reactions provided a coherent neuromotor profile and indicated a high
      vulnerability to atypical motor development, and do not rule out the possibility
      of later evolution toward a spastic-dystonic motor pattern.
    explanation: >-
      Supports evolution of the motor phenotype from infantile hypotonia toward a
      spastic-dystonic pattern, but only as an anticipated possibility in a single
      24-month-old, hence PARTIAL.
- age_range: Childhood onwards
  notes: >-
    The founding cohort characterised the accompanying neurodevelopmental
    phenotype as nonprogressive, which distinguishes the disorder from a
    neurodegenerative encephalopathy. No longitudinal audiometric, motor, imaging
    or survival data have been published, so whether the hearing loss itself
    progresses is unknown; see the `afg2b_natural_history_gap` discussion.
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Collectively, our results indicate that bi-allelic SPATA5L1 variants
      lead to a human disease characterized by sensorineural hearing loss (SNHL)
      with or without a nonprogressive mixed neurodevelopmental phenotype.
    explanation: States the nonprogressive character of the neurodevelopmental phenotype.
pathophysiology:
- name: Biallelic AFG2B Loss of Function
  description: >-
    Biallelic pathogenic variants in AFG2B (SPATA5L1) are the initiating lesion.
    Twenty-eight distinct biallelic variants were reported in the founding
    cohort; most are private missense changes, with nonsense alleles also
    described. Protein modelling indicated that the missense variants act largely
    by destabilising folded domains of the protein rather than by a gain of
    function, and specific substitutions in the ATPase motor (for example
    p.Gly689Val) are predicted to disrupt ATP binding and hydrolysis. The gene
    was an orphan gene of unknown function when the disease association was first
    made.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: AFG2B
    term:
      id: hgnc:28762
      label: SPATA5L1
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural
      hearing loss in 47 individuals from 28 (26 unrelated) families.
    explanation: Establishes the biallelic genetic lesion as the root of the disorder.
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Modeling indicated damaging effect of variants on the protein, largely
      via destabilizing effects on protein domains.
    explanation: >-
      In silico structural modelling supports a destabilising loss-of-function
      mechanism rather than a gain of function.
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Missense variants such as p.Gly689Val are predicted to disrupt ATP binding
      and hydrolysis, thereby impairing the catalytic function of the ATPase motor
    explanation: >-
      Links a recurrent missense allele specifically to loss of ATPase catalytic
      activity. Predicted, not measured, hence COMPUTATIONAL.
  downstream:
  - target: 55LCC ATPase Complex Dysfunction
  - target: Cochlear Sensory Epithelium Involvement
- name: 55LCC ATPase Complex Dysfunction
  description: >-
    AFG2B does not act alone. It is an obligate subunit of the 55LCC complex, a
    4:2:2:2 assembly of AFG2A (SPATA5), AFG2B (SPATA5L1), C1orf109 and CINP in
    which the N-terminal domains of the two AAA+ ATPases interact with the
    C1orf109-CINP heterodimer to form a funnel-like ring sitting above a
    cylindrical stacked-ring ATPase motor. The assembled complex hydrolyses ATP
    several-fold faster than AFG2A alone, so loss of AFG2B compromises a
    multi-subunit machine rather than a single enzyme. That shared machine is the
    structural reason why AFG2A- and AFG2B-related diseases overlap clinically.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40268917
    reference_title: Cryo-EM structure of the AAA+ SPATA5 complex and its role in
      human cytoplasmic pre-60S maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we reveal that SPATA5 forms a 4:2:2:2 complex with SPATA5L1, C1orf109,
      and CINP.
    explanation: >-
      Cryo-EM defines the stoichiometry of the complex and places AFG2B
      (SPATA5L1) inside it as an obligate subunit.
  - reference: PMID:38554706
    reference_title: The SPATA5-SPATA5L1 ATPase complex directs replisome proteostasis
      to ensure genome integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: An integrative structural biology approach revealed a molecular architecture
      of SPATA5-SPATA5L1 N-terminal domains interacting with C1orf109-CINP to form
      a funnel-like structure above a cylindrically shaped ATPase motor.
    explanation: >-
      Independent structural work describing the same architecture and naming the
      complex 55LCC.
  downstream:
  - target: Impaired Cytoplasmic Pre-60S Ribosomal Maturation
  - target: Replisome Proteostasis Failure and Replication Stress
- name: Impaired Cytoplasmic Pre-60S Ribosomal Maturation
  description: >-
    The 55LCC complex, of which AFG2B is a subunit, executes a late cytoplasmic
    maturation step of the pre-60S large ribosomal subunit. AFG2A is the human
    homolog of yeast Drg1, which releases the assembly factor Rlp24 from newly
    exported pre-60S particles; in humans the reaction requires the whole
    four-protein complex, and recognition of the pre-60S particle is mediated by
    the human-specific subunit CINP. Loss of AFG2B is therefore expected to stall
    the final step of large-subunit biogenesis.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: ribosomal large subunit biogenesis
    term:
      id: GO:0042273
      label: ribosomal large subunit biogenesis
    modifier: DECREASED
  - preferred_term: ribosome biogenesis
    term:
      id: GO:0042254
      label: ribosome biogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35354024
    reference_title: Labeling of heterochronic ribosomes reveals C1ORF109 and SPATA5
      control a late step in human ribosome assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We provide evidence that these factors, together with CINP and SPATA5L1,
      control a late step of human pre-60S maturation in the cytoplasm.
    explanation: >-
      Names SPATA5L1 (AFG2B) explicitly as one of the four factors controlling
      the late cytoplasmic pre-60S maturation step.
  - reference: PMID:40268917
    reference_title: Cryo-EM structure of the AAA+ SPATA5 complex and its role in
      human cytoplasmic pre-60S maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also obtained a cryo-EM structure of pre-60S-bound SPATA5 complex.
    explanation: >-
      Direct structural demonstration that the AFG2A-AFG2B-containing complex
      engages the pre-60S particle.
  downstream:
  - target: Reduced Global Protein Synthesis
- name: Reduced Global Protein Synthesis
  description: >-
    Failure of the late pre-60S maturation step reduces the supply of mature 60S
    subunits and lowers global translational capacity. This has been measured
    directly for the other 55LCC subunits (C1ORF109 and AFG2A/SPATA5), where loss
    impairs global protein synthesis; the equivalent measurement has not been
    made after loss of AFG2B itself, so the node is provisional for this disorder
    even though the complex-level logic is strong.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: cytoplasmic translation
    term:
      id: GO:0002181
      label: cytoplasmic translation
    modifier: DECREASED
  evidence:
  - reference: PMID:35354024
    reference_title: Labeling of heterochronic ribosomes reveals C1ORF109 and SPATA5
      control a late step in human ribosome assembly.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Loss of either C1orf109 or SPATA5 impairs global protein synthesis.
    explanation: >-
      Demonstrates the translational consequence for two of the four 55LCC
      subunits. PARTIAL because the experiment was not performed for AFG2B
      (SPATA5L1) itself; the extrapolation rests on shared complex membership.
  notes: >-
    Deliberately marked PROVISIONAL and PARTIAL. This is the single point in the
    chain where the evidence is about the paralogue AFG2A rather than about
    AFG2B, and the named-entity-confusion risk for this disorder makes it worth
    flagging explicitly rather than letting the complex-level argument stand
    unqualified. Note also that PMID:38554706 found the replication and
    genome-instability phenotype separable from the reported ribosomal function,
    so the two arms of 55LCC dysfunction are modelled here as parallel branches
    rather than as one linear chain.
  downstream:
  - target: Neuroepithelial Vulnerability During Differentiation
- name: Neuroepithelial Vulnerability During Differentiation
  description: >-
    Ribosome levels fall physiologically as neuroepithelial cells differentiate
    during early human brain development, which makes precisely this window
    hypersensitive to any further reduction in ribosome biogenesis. Reduced
    ribosome availability preferentially impairs translation of specific
    transcripts and disrupts both survival and cell-fate commitment of
    transitioning neuroepithelia. This is the leading explanation for why a
    housekeeping defect in a ubiquitously required complex produces a
    predominantly neurodevelopmental disease.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neuroepithelial progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: We find that ribosome levels decrease during neuroepithelial differentiation,
      making differentiating cells particularly vulnerable to perturbations in ribosome
      biogenesis during this time.
    explanation: >-
      Explains the tissue specificity of 55LCC-complex disease. PARTIAL because
      the human cerebral organoid work was done for the AIRIM/C1orf109 subunit,
      not for AFG2B; the argument generalises across the complex but has not been
      tested for this gene.
  notes: >-
    The `cell_types` binding uses CL:0011020 (neural progenitor cell), the
    closest existing CL class to the differentiating neuroepithelial progenitor
    population studied in the cerebral organoids; `preferred_term` records the
    intended, more specific meaning. CL:0000098 (sensory epithelial cell) was
    used in an earlier revision and was wrong - that class is the ear/eye/nose
    sensory-receptor lineage, not a neural progenitor - and is no longer used
    anywhere in this entry. The mTOR-rescue result
    in PMID:40760247 is NOT curated as a treatment here; see the entry notes and
    the `afg2b_mtor_rescue_untested` discussion.
  downstream:
  - target: Impaired Neuronal and White Matter Development
- name: Replisome Proteostasis Failure and Replication Stress
  description: >-
    The second established function of the 55LCC complex is to direct turnover of
    replisome components, a proteostasis job distinct from the
    ubiquitin-dependent VCP/p97 unfolding of the CMG helicase that terminates DNA
    replication. The complex acts as an unfoldase on chromatin-bound replisome
    proteins, and its deficiency produces ubiquitin-independent proteotoxicity,
    replication stress, and severe chromosome instability. Consistent with this,
    transcriptomic profiling of fibroblasts from affected individuals with
    biallelic AFG2B variants implicated DNA replication and mitosis alongside
    cell-surface adhesion and focal adhesion pathways.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: ABNORMAL
  - preferred_term: replication fork processing
    term:
      id: GO:0031297
      label: replication fork processing
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38554706
    reference_title: The SPATA5-SPATA5L1 ATPase complex directs replisome proteostasis
      to ensure genome integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we identify replisome factor interactions with a protein complex
      composed of AAA+ ATPases SPATA5-SPATA5L1 together with heterodimeric partners
      C1orf109-CINP (55LCC).
    explanation: >-
      Establishes that the AFG2B-containing complex physically engages replisome
      factors, the basis of the replisome-proteostasis role.
  - reference: PMID:38554706
    reference_title: The SPATA5-SPATA5L1 ATPase complex directs replisome proteostasis
      to ensure genome integrity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deficiency in the 55LCC complex elicited ubiquitin-independent proteotoxicity,
      replication stress, and severe chromosome instability.
    explanation: >-
      Direct demonstration of the replication-stress consequence of losing the
      complex that contains AFG2B.
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Analysis of differentially expressed genes and networks suggested a role
      for SPATA5L1 in cell surface adhesion receptor function, intracellular focal
      adhesions, and DNA replication and mitosis.
    explanation: >-
      Patient-fibroblast transcriptomics independently points at DNA replication
      and mitosis, but this is a correlative expression signature rather than a
      functional replication assay, hence PARTIAL.
  notes: >-
    Marked PROVISIONAL because no causal link has been shown between replication
    stress and any specific clinical feature of this disorder. It is curated as a
    parallel arm of 55LCC dysfunction rather than as an established step on the

- name: Impaired Neuronal and White Matter Development
  description: >-
    AFG2B protein localises to neuronal and glial nuclei, with more prominent
    expression in neurons, so the brain is a directly affected tissue rather than
    a bystander. The structural consequence seen in affected individuals is a
    global reduction in cerebral volume with disproportionate white matter loss:
    quantitative volumetry showed significantly diminished white matter volumes,
    and imaging shows a thin corpus callosum, delayed myelination and
    periventricular leukomalacia.

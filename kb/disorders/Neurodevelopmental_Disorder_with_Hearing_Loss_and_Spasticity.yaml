name: Neurodevelopmental Disorder with Hearing Loss and Spasticity
creation_date: '2026-08-15T00:00:00Z'
category: Mendelian
synonyms:
- NEDHLS
- AFG2B-related neurodevelopmental disorder
- SPATA5L1-related neurodevelopmental disorder
- neurodevelopmental disorder with psychomotor delay, hearing loss, and spasticity
description: >-
  Neurodevelopmental disorder with hearing loss and spasticity (NEDHLS,
  OMIM:619616) is an ultra-rare autosomal recessive disorder caused by biallelic
  variants in AFG2B, the gene reported throughout the founding clinical
  literature under its former symbol SPATA5L1. Sensorineural hearing loss is the
  near-constant feature; roughly half of reported individuals additionally have a
  mixed neurodevelopmental phenotype comprising microcephaly, global
  developmental delay and impaired intellectual development, spastic-dystonic
  cerebral palsy, and focal or generalised epilepsy. Some children, particularly
  in infancy, present with hypotonia rather than hypertonia, and craniofacial
  dysmorphism and strabismus occur in a subset. Brain imaging typically shows
  diminished cerebral volume, reduced white matter volume, a thin corpus
  callosum, delayed myelination and periventricular leukomalacia. AFG2B encodes
  an AAA+ ATPase that is an obligate subunit of the 55LCC complex together with
  its paralogue AFG2A (SPATA5), C1orf109 and CINP; the complex directs replisome
  proteostasis and also drives the last cytoplasmic maturation step of the
  pre-60S ribosomal subunit. Because AFG2B and AFG2A are partners in the same
  complex, the two gene-specific disorders overlap clinically, and the paralogue
  pair is a recognised source of named-entity confusion (see notes).
disease_term:
  preferred_term: neurodevelopmental disorder with hearing loss and spasticity
  term:
    id: MONDO:0859206
    label: neurodevelopmental disorder with hearing loss and spasticity

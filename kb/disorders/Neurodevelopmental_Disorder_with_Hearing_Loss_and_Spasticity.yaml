differential_diagnoses:
- name: AFG2A-Related Encephalopathy
  description: >-
    The disorder caused by biallelic variants in the paralogous gene AFG2A
    (formerly SPATA5), whose protein is the obligate partner of AFG2B inside the
    same 55LCC complex. The clinical pictures overlap substantially, with
    intellectual disability, developmental delay, epilepsy, hearing loss and
    movement disorder in both, which is exactly why the pair is a named-entity
    confusion hazard. That disorder is curated in this repository as
    `AFG2A-Related_Encephalopathy`, and it in turn lists this disorder as one of
    its differentials.
  disease_term:
    preferred_term: AFG2A-related encephalopathy
    term:
      id: MONDO:0014698
      label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
        muscle tone syndrome
  distinguishing_features:
  - AFG2A-related encephalopathy typically has earlier seizure onset, more pronounced
    (congenital) microcephaly and more frequent movement disorders, and frequently
    presents as a developmental and epileptic encephalopathy.
  - AFG2B-related disease is dominated by sensorineural hearing loss, which is near-universal
    and can be the sole manifestation, with a more consistently spastic-dystonic motor
    pattern and a neurodevelopmental burden that affects only about half of individuals.
  - Only sequencing distinguishes the two reliably; the genes differ by one letter
    in both their current (AFG2A/AFG2B) and their legacy (SPATA5/SPATA5L1) symbols.
  evidence:
  - reference: PMID:41375745
    reference_title: Neurodevelopmental Disorder with Psychomotor Delay, Hearing Loss,
      and Spasticity Caused by Compound Heterozygous SPATA5L1 Variants-Expanding Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SPATA5-related disorder (NEDCAS) presents with earlier seizure onset,
      more pronounced microcephaly, and frequent movement disorders
    explanation: >-
      Directly contrasts the two paralogous disorders on the features that
      distinguish them.
  - reference: PMID:41933351
    reference_title: AFG2A-related encephalopathy, expanding the neurodevelopmental
      and epileptic spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFG2A-RE is an ultra-rare, recessive disorder, sometimes presenting\
      \ as a developmental and epileptic encephalopathy (DEE), characterised by the\
      \ triad of epilepsy, congenital microcephaly, and deafness, and typically associated\
      \ with intellectual disability, spasticity, and movement disorders."
    explanation: >-
      Describes the AFG2A phenotype from the largest AFG2A cohort. This is the
      only citation in this entry drawn from an AFG2A series, and it is confined
      to this differential.
- name: Autosomal recessive nonsyndromic sensorineural hearing loss
  description: >-
    Because biallelic AFG2B variants can cause isolated hearing loss with no
    neurodevelopmental features, the disorder enters the differential for
    apparently nonsyndromic recessive sensorineural hearing loss, and AFG2B
    should be covered by hearing-loss gene panels.
  distinguishing_features:
  - Nothing distinguishes the isolated-hearing-loss presentation clinically; only
    sequencing does.
  - Conversely, the presence of microcephaly, spasticity, dystonia or epilepsy alongside
    hearing loss argues against a nonsyndromic aetiology.
  notes: >-
    Deliberately left UNBOUND to a MONDO term. MONDO models autosomal recessive
    nonsyndromic hearing loss only as numbered locus-specific entities (DFNB1A,
    DFNB2, DFNB3 and so on), and selecting any one of them would assert a locus
    that no AFG2B report implicates. This mirrors the same decision recorded in
    the sibling AFG2A entry.
  evidence:
  - reference: PMID:37902276
    reference_title: A further case of AFG2B-related neurodevelopmental disorder with
      hearing loss and microcephaly allows further clarification of pathogenicity
      of the variant c.1313T>C, p.(Leu438Pro).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bi-allelic variants in AFG2B (previously known as SPATA5L1) have recently
      been associated with a neurodevelopmental disorder with hearing loss and spasticity,
      as well as isolated hearing loss.
    explanation: >-
      States explicitly that biallelic AFG2B variants can produce isolated
      hearing loss.
- name: Acquired (non-genetic) cerebral palsy
  description: >-
    The spastic-dystonic motor phenotype with periventricular leukomalacia on
    imaging closely mimics cerebral palsy of perinatal hypoxic-ischaemic origin,
    and affected children may carry that label for years before sequencing.
  distinguishing_features:
  - Absence of a perinatal insult, plus consanguinity or affected siblings, should
    prompt genomic testing rather than an acquired-aetiology label.
  - Accompanying bilateral sensorineural hearing loss is the single most useful pointer
    away from acquired cerebral palsy.
  - Periventricular leukomalacia in this disorder is not explained by prematurity
    or perinatal asphyxia.
  evidence:
  - reference: PMID:34626583
    reference_title: Bi-allelic variants in SPATA5L1 lead to intellectual disability,
      spastic-dystonic cerebral palsy, epilepsy, and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain imaging revealed diminished cerebral volume, thin corpus callosum,
      and periventricular leukomalacia, and quantitative volumetry demonstrated significantly
      diminished white matter volumes in several individuals.
    explanation: >-
      Periventricular leukomalacia is the imaging finding that most strongly
      suggests an acquired perinatal aetiology and is therefore the source of the
      diagnostic confusion.
discussions:
- discussion_id: afg2b_cochlear_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What actually happens in the AFG2B-deficient cochlea downstream of the
    expression of AFG2B in hair cells and supporting cells?
  attaches_to:
  - pathophysiology#Cochlear Sensory Epithelium Involvement
  rationale: >-
    Sensorineural hearing loss is the defining feature of this disorder, yet the
    only cochlear data in existence are rodent expression studies showing
    Spata5l1 in neurosensory hair cells, supporting cells and the pillar cells of
    the organ of Corti. Nobody has published hair cell counts, cochlear
    histology, endocochlear potential measurements, distortion-product otoacoustic
    emissions or spiral ganglion studies in an AFG2B-deficient animal or human
    temporal bone. Consequently the entry conforms to the
    `sensorineural_hair_cell_loss` module at its trigger node only and cannot
    claim the module's hair-cell-death, ionic-homeostasis or spiral-ganglion
    nodes. Whether hair cells die (as in most hereditary sensorineural loss) or
    merely function abnormally, and whether the loss is cochlear or
    retrocochlear, is completely open. The only indirect human hint is the
    founding report's observation, in the body of PMID:34626583 rather than in
    its abstract, of apparent benefit from cochlear implantation in the
    individuals who received it, which is weakly consistent with a preserved
    auditory nerve but is uncontrolled and unquantified.
  proposed_experiments:
  - experiment_id: afg2b_cochlear_knockout_phenotyping
    name: Afg2b knockout cochlear phenotyping
    description: >-
      Generate a cochlea-conditional or constitutive Afg2b knockout mouse and
      perform ABR and DPOAE phenotyping alongside serial cochlear histology with
      inner and outer hair cell counts, to establish whether hair cells are lost
      or merely dysfunctional.
  - experiment_id: afg2b_endocochlear_potential
    name: Endocochlear potential measurement
    description: >-
      Measure the endocochlear potential in the same model to test whether the
      module's cochlear ionic homeostasis arm is engaged, which would distinguish
      a strial mechanism from a primary hair-cell mechanism.
  - experiment_id: afg2b_spiral_ganglion_density
    name: Spiral ganglion neuron density quantification
    description: >-
      Quantify spiral ganglion neuron density to test the module's retrocochlear
      node and to predict whether cochlear implantation would be expected to work
      in affected individuals.
  - experiment_id: afg2b_cochlear_implant_outcomes
    name: Cochlear implant outcome collation
    description: >-
      Collate audiological and cochlear implant outcomes across the reported
      human cohort, which would provide indirect human evidence about spiral
      ganglion integrity without requiring temporal bone histology.
- discussion_id: afg2b_no_animal_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of Afg2b in an animal model recapitulate the human
    hearing-loss-plus-spasticity phenotype?
  attaches_to:
  - pathophysiology#Biallelic AFG2B Loss of Function
  rationale: >-
    No animal model of AFG2B deficiency has been published, which is why this
    entry carries no `animal_models` block. The only in vivo AFG2B data located
    are rodent expression studies (PMID:34626583); a PubMed search for SPATA5L1
    combined with zebrafish returned no records, and the Falcon deep-research run
    likewise found no stable Afg2b-knockout mouse, rat, zebrafish, Drosophila,
    iPSC neuron, cochlear organoid or cerebral organoid model. Every functional
    claim in this entry therefore rests either on human observational data, on
    patient fibroblast transcriptomics, or on cell-based work performed on other
    subunits of the 55LCC complex. Without a model the causal direction from
    ribosome biogenesis failure or replication stress to the neurological and
    auditory phenotype remains inferred rather than demonstrated.
  proposed_experiments:
  - experiment_id: afg2b_mouse_null_phenotyping
    name: Afg2b null mouse neurodevelopmental phenotyping
    description: >-
      Characterise any existing IMPC allele, or generate an Afg2b null mouse, and
      phenotype brain volume, myelination, motor tone and hearing to test whether
      the human phenotype is reproduced.
  - experiment_id: afg2b_zebrafish_hair_cell
    name: Zebrafish afg2b hair cell development assay
    description: >-
      Use a zebrafish afg2b knockdown or knockout to test hair cell development
      in the lateral line and inner ear, the standard rapid assay applied to
      other deafness genes.
  - experiment_id: afg2b_ipsc_organoid_translation
    name: Patient iPSC organoid translation assay
    description: >-
      Differentiate patient-derived iPSC into cortical and inner-ear organoids
      and assay 60S subunit levels and global translation, to test the proximal
      ribosome-biogenesis defect in human AFG2B-mutant cells.
- discussion_id: afg2b_replication_stress_to_neural_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which arm of 55LCC dysfunction - impaired pre-60S ribosome maturation or
    replisome proteostasis failure - actually produces the neural and cochlear
    phenotype of AFG2B deficiency?
  attaches_to:
  - pathophysiology#Replisome Proteostasis Failure and Replication Stress
  - pathophysiology#Reduced Global Protein Synthesis
  rationale: >-
    The 55LCC complex has two experimentally established jobs, and PMID:38554706
    reports that the replication and genome-instability phenotype is separable
    from the previously described ribosomal function. Both are therefore modelled
    here as parallel branches from complex dysfunction, and both carry an edge
    into the neural node - but neither edge has been demonstrated in a neural or
    cochlear context for AFG2B. The replication-stress work was done in HeLa and
    engineered degron cell lines, and the ribosome work was done on other
    subunits. Because all four 55LCC components are pan-essential in cultured
    cells, yet the human disease is tissue-restricted and survivable, something
    about the developing brain and cochlea must determine selectivity, and which
    branch drives that selectivity is unknown. This is the weakest link in the
    pathograph and the reason both intermediate nodes are marked PROVISIONAL.
  proposed_experiments:
  - experiment_id: afg2b_branch_separation_neural
    name: Branch separation in a neural model
    description: >-
      Introduce separation-of-function AFG2B alleles that impair replisome
      substrate processing without disturbing pre-60S maturation (and the
      converse) into a human neural progenitor or organoid model, and determine
      which allele class reproduces the growth and differentiation defect.
  - experiment_id: afg2b_replication_stress_markers_patient
    name: Replication-stress markers in patient cells
    description: >-
      Measure phosphorylated RPA, DNA-fiber fork progression, cohesion defects
      and micronucleus frequency in fibroblasts and iPSC-derived neural cells
      from individuals with biallelic AFG2B variants, to test whether the
      cell-line replication-stress phenotype is present at physiological
      patient-allele dosage.
- discussion_id: afg2b_mtor_rescue_untested
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mTOR-activation rescue demonstrated for the AIRIM/C1orf109 subunit
    of the 55LCC complex generalise to AFG2B deficiency?
  attaches_to:
  - pathophysiology#Neuroepithelial Vulnerability During Differentiation
  rationale: >-
    Enhancing mTOR activity suppresses the growth and developmental defects
    caused by AIRIM/C1orf109 variants in human cerebral organoids
    (PMID:40760247). AIRIM/C1orf109 is a subunit of the same 55LCC complex as
    AFG2B, and the proposed mechanism, restoring translational output when
    ribosome availability falls during neuroepithelial differentiation, would
    apply equally to AFG2B loss on paper. But the experiment has never been done
    for AFG2B, the organoid system models early cortical development rather than
    the cochlea where this disorder's defining phenotype lies, and mTOR
    activation is not a benign intervention. The mismatch between an encouraging
    organoid result on one subunit and the complete absence of data on the
    subunit that causes this disease is exactly why the finding is curated as a
    pathophysiology observation and a discussion rather than as a treatment.
  proposed_experiments:
  - experiment_id: afg2b_organoid_mtor_rescue
    name: mTOR rescue in AFG2B-variant cerebral organoids
    description: >-
      Generate AFG2B-variant human cerebral organoids and test whether mTOR
      activation rescues growth and cell-fate commitment as it does for
      AIRIM/C1orf109 organoids.
  - experiment_id: afg2b_60s_translation_measurement
    name: 60S availability and translation in AFG2B-deficient neuroepithelia
    description: >-
      Measure 60S subunit availability and global translation in AFG2B-deficient
      neuroepithelia to confirm that the proximal defect assumed by the rescue
      rationale is actually present.
  - experiment_id: afg2b_inner_ear_organoid_rescue
    name: Inner-ear organoid rescue test
    description: >-
      Test whether any mTOR rescue extends to inner-ear organoids, since cortical
      rescue alone would not address the disorder's defining hearing loss.
  evidence:
  - reference: PMID:40760247
    reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Enhancing mTOR activity suppresses the growth and developmental defects
      associated with AIRIM/C1orf109 variants.
    explanation: >-
      The rescue result that motivates the question, obtained for a different
      subunit of the same complex in human cerebral organoids.
- discussion_id: afg2b_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history of AFG2B-related disease beyond childhood, and
    does the hearing loss progress?
  attaches_to:
  - pathophysiology#Bilateral Sensorineural Hearing Loss
  rationale: >-
    The founding cohort described the neurodevelopmental phenotype as
    nonprogressive, but no longitudinal audiometric data have been published, so
    whether the hearing loss itself is stable or progressive is unknown. This
    matters directly for the module-conformance decision recorded in entry note
    (6), because the `sensorineural_hair_cell_loss` module terminates in a node
    named "Progressive Sensorineural Hearing Loss", which cannot be claimed here.
    No survival, life-expectancy, adult-outcome or quality-of-life data exist for
    this disorder either.
  proposed_experiments:
  - experiment_id: afg2b_serial_audiometry
    name: Serial audiometry across the reported cohort
    description: >-
      Perform serial audiometry across the reported cohort to establish whether
      hearing thresholds deteriorate with age, which would determine whether the
      module's progressive-hearing-loss endpoint can be claimed.
  - experiment_id: afg2b_natural_history_registry
    name: Prospective natural-history registry
    description: >-
      Establish a prospective natural-history registry capturing motor function,
      epilepsy course, communication outcome and survival into adulthood.
  - experiment_id: afg2b_longitudinal_mri
    name: Longitudinal brain MRI
    description: >-
      Acquire longitudinal MRI to determine whether the cerebral and white matter
      volume loss is static or progressive.

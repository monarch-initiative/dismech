review_notes: >
  Review used four cached sources anchored to MONDO:0010160 and TAT. No
  disease-specific public molecular dataset or model with an evidence-supported
  mechanism link was identified in the repository, so those sections are
  explicitly empty. Phenotype frequencies were omitted because the cited
  sources do not provide defensible denominators or qualitative bands. Direct
  evidence supports TAT deficiency causing hypertyrosinemia and tyrosine crystal
  deposition causing eye and skin lesions. Neurologic phenotypes are linked with
  INDIRECT_UNKNOWN_INTERMEDIATES edges because association and treatment timing
  support a relationship while the causal route remains unresolved.

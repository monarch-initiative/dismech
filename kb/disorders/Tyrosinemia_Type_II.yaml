      reference_title: "Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One \"complex\" RHS allele carries a GT----GG splice donor mutation in intron 8 together with a Gly----Val substitution at amino acid 362."
      explanation: Patient-allele sequencing documents a splice-donor variant with a missense substitution.

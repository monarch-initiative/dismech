inheritance:
- name: Autosomal recessive
  description: >
    Tyrosinemia type II is caused by biallelic pathogenic variants in TAT;
    heterozygous carriers are asymptomatic and each sib of an affected
    individual has a 25% recurrence risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tyrosinemia type II is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the autosomal recessive inheritance pattern.
  - reference: PMID:1357662
    reference_title: "Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosinemia type II (Richner-Hanhart syndrome, RHS) is a disease of autosomal recessive inheritance characterized by keratitis, palmoplantar hyperkeratosis, mental retardation, and elevated blood tyrosine levels."
    explanation: Confirms autosomal recessive inheritance and the defining clinical tetrad.
progression:
- phase: Early-treated course
  age_range: Infancy onward
  notes: >
    Individuals diagnosed and treated from early infancy may remain asymptomatic
    or have only mild eye and skin manifestations.
  evidence:
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals diagnosed and treated from early infancy may be asymptomatic or have only mild ocular and skin manifestations."
    explanation: GeneReviews describes the attenuated course associated with early diagnosis and treatment.
- phase: Delayed or untreated presentation
  age_range: Infancy through later childhood or adulthood
  notes: >
    Delayed diagnosis or absence of treatment is associated with ocular and
    skin disease and variable cognitive manifestations; painful eye disease may
    be mistaken for herpetic keratitis.
  evidence:
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with delayed diagnosis or lack of treatment present with ocular, skin, and variable cognitive manifestations."
    explanation: GeneReviews states the manifestations associated with delayed diagnosis or no treatment.
clinical_burden:
  burden_level: MODERATE
  rationale: >
    Untreated disease can cause painful keratitis, corneal injury, painful
    palmoplantar hyperkeratosis, and variable cognitive disability. The burden
    is substantially modifiable because early diagnosis and lifelong dietary
    therapy can produce an asymptomatic or mild course, although sustained diet,
    biochemical monitoring, and multidisciplinary surveillance are required.
  evidence:
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tyrosinemia type II is characterized by corneal dystrophy, painful palmoplantar hyperkeratosis, and variable intellectual disability."
    explanation: The characteristic painful, ocular, cutaneous, and cognitive manifestations support a moderate untreated burden.
pathophysiology:
- name: Tyrosine aminotransferase deficiency
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function TAT variants reduce hepatic cytosolic tyrosine
    aminotransferase activity, blocking the first (transamination) step of
    tyrosine catabolism that converts L-tyrosine to 4-hydroxyphenylpyruvate.
  genes:
  - preferred_term: TAT
    term:
      id: hgnc:11573
      label: TAT
  molecular_functions:
  - preferred_term: tyrosine aminotransferase activity
    term:
      id: GO:0004838
      label: L-tyrosine:2-oxoglutarate transaminase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-tyrosine catabolic process
    term:
      id: GO:0006572
      label: L-tyrosine catabolic process
    modifier: DECREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:1357662
    reference_title: "Point mutations in the tyrosine aminotransferase gene in tyrosinemia type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease results from deficiency in hepatic tyrosine aminotransferase (TAT; L-tyrosine:2-oxoglutarate aminotransferase, EC 2.6.1.5), a 454-amino acid protein encoded by a gene with 12 exons."
    explanation: Identifies deficiency of hepatic tyrosine aminotransferase as the causal enzymatic lesion.
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of tyrosinemia type II is established in a proband by identification of biallelic pathogenic variants in TAT on molecular genetic testing"
    explanation: Confirms biallelic TAT pathogenic variants as the molecular basis of the disease.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tyrosine aminotransferase (TAT) transaminates tyrosine, forming p‐hydroxyphenylpyruvate and glutamate."
    explanation: Defines the biochemical reaction catalyzed by TAT.
  downstream:
  - target: Hypertyrosinemia and systemic tyrosine accumulation
    description: >
      Loss of tyrosine aminotransferase activity prevents normal tyrosine
      degradation, causing tyrosine to accumulate in blood and tissues.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22389994
      reference_title: "Richner-Hanhart syndrome (tyrosinemia type II): a case report of delayed diagnosis with pseudodendritic corneal lesion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Richner-Hanhart syndrome (tyrosinemia type II) is a rare autosomal recessive disease associated with high serum tyrosine levels caused by the deficiency of tyrosine aminotransferase enzyme."
      explanation: Directly links tyrosine aminotransferase deficiency to elevated serum tyrosine.
- name: Hypertyrosinemia and systemic tyrosine accumulation
  role: CENTRAL_EFFECTOR
  biological_scale: ORGANISM
  description: >
    The upstream enzymatic block produces increased tyrosine in plasma and
    cerebrospinal fluid and increased tyrosine catabolic metabolites in plasma
    and urine. Tyrosine crystal deposition is implicated in the characteristic
    eye and skin lesions.
  chemical_entities:
  - preferred_term: L-tyrosine
    term:
      id: CHEBI:17895
      label: L-tyrosine
    modifier: INCREASED
  evidence:
  - reference: PMID:22389994
    reference_title: "Richner-Hanhart syndrome (tyrosinemia type II): a case report of delayed diagnosis with pseudodendritic corneal lesion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood tests showed a tyrosine level of 508 micromol/L (normal range: 30-150)."
    explanation: Documents the marked hypertyrosinemia (508 vs normal 30-150 micromol/L) that defines the biochemical phenotype.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TAT deficiency leads to increased levels of tyrosine in plasma and CSF together with increased levels of its catabolic metabolites in plasma and urine."
    explanation: Review supports the compartments and metabolite classes affected by TAT deficiency.
  downstream:
  - target: Oculocutaneous tyrosine deposition
    description: >
      Elevated intracellular tyrosine deposits in the cornea and in palmoplantar
      epidermis, triggering the inflammatory and hyperkeratotic tissue response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31603991
      reference_title: "Inborn errors of enzymes in glutamate metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Deposition of tyrosine crystals leads to eye and skin lesions in patients with TAT deficiency, resulting in infancy‐onset ophthalmological and dermatological symptoms."
      explanation: Review directly attributes eye and skin lesions to tyrosine crystal deposition.
  - target: Intellectual disability
    description: >
      Sustained untreated hypertyrosinemia is associated with variable cognitive
      manifestations through unresolved neurologic intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39446998
      reference_title: "Tyrosinemia Type II."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Individuals with delayed diagnosis or lack of treatment present with ocular, skin, and variable cognitive manifestations."
      explanation: The treatment-timing association supports a link while leaving the neurologic intermediates unresolved.
  - target: Seizures
    description: Hypertyrosinemia is associated with reported seizures through unresolved neurologic intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31603991
      reference_title: "Inborn errors of enzymes in glutamate metabolism."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The phenotype is further characterised by seizures and self‐injuring and difficult behaviour."
      explanation: Establishes the TAT-deficiency neurologic endpoint but not the route from tyrosine elevation.
  - target: Self-injurious behavior
    description: Hypertyrosinemia is associated with reported self-injurious behavior through unresolved neurologic intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31603991

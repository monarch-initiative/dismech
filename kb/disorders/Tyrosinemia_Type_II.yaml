pathophysiology:
- name: Tyrosine aminotransferase deficiency
  description: >
    Biallelic loss-of-function TAT variants reduce hepatic cytosolic tyrosine
    aminotransferase activity, blocking the first (transamination) step of
    tyrosine catabolism that converts L-tyrosine to 4-hydroxyphenylpyruvate.

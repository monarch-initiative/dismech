inheritance:
- name: Autosomal recessive
  description: >
    Tyrosinemia type II is caused by biallelic pathogenic variants in TAT;
    heterozygous carriers are asymptomatic and each sib of an affected
    individual has a 25% recurrence risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

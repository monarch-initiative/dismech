notes: >
  Unlike tyrosinemia type I, the metabolic block is at the first step of
  tyrosine degradation, so tyrosine itself accumulates rather than
  fumarylacetoacetate or succinylacetone. Nitisinone, the principal therapy for
  type I, acts downstream of TAT and is not used in type II because it would
  further increase tyrosine.
  Surveillance described by GeneReviews includes quantitative plasma tyrosine
  and phenylalanine at each visit, annual or clinically indicated ophthalmology
  and skin assessments, annual developmental and neuropsychological review, and
  nutritional monitoring including calcium, phosphorus, and 25-hydroxyvitamin D.
  Increased dietary protein should be avoided. The causal route from systemic
  tyrosine elevation to variable cognitive manifestations remains unresolved;
  neurologic outcomes are therefore linked only through unknown intermediates.

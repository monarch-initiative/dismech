treatments:
- name: Dietary tyrosine and phenylalanine restriction
  description: >
    Lifelong low-protein diet restricting dietary tyrosine and phenylalanine,
    combined with phenylalanine-free/tyrosine-free amino acid, vitamin, and
    mineral supplements. Lowering plasma tyrosine produces rapid resolution of
    the corneal and cutaneous lesions. Early-treated individuals may be
    asymptomatic or have only mild ocular and skin manifestations.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Hypertyrosinemia and systemic tyrosine accumulation
    treatment_effect: INHIBITS
    description: Dietary restriction reduces the systemic tyrosine burden.
    evidence:
    - reference: PMID:22389994
      reference_title: "Richner-Hanhart syndrome (tyrosinemia type II): a case report of delayed diagnosis with pseudodendritic corneal lesion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One and a half months after the tyrosine- and phenylalanine-restricted diet, her tyrosine level dropped to 395 micromol/L level, her corneal lesions subsided, and a symptomatic relief was achieved."
      explanation: Human treatment response directly supports diet lowering tyrosine and improving corneal disease.
  evidence:
  - reference: PMID:39446998
    reference_title: "Tyrosinemia Type II."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lifelong restriction of dietary tyrosine and phenylalanine with low-protein diet combined with age-appropriate amino acid (phenylalanine-free and tyrosine-free), vitamin, and mineral supplements."
    explanation: GeneReviews specifies dietary tyrosine/phenylalanine restriction as targeted therapy.
  - reference: PMID:22389994
    reference_title: "Richner-Hanhart syndrome (tyrosinemia type II): a case report of delayed diagnosis with pseudodendritic corneal lesion."

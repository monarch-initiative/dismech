name: Tyrosinemia Type II
category: Mendelian
creation_date: '2026-07-07T00:00:00Z'
synonyms:
- Richner-Hanhart syndrome
- Oculocutaneous tyrosinemia
- Tyrosine aminotransferase deficiency
- TAT deficiency
- Keratosis palmoplantaris-corneal dystrophy syndrome
- TYRSN2
description: >
  Tyrosinemia type II (Richner-Hanhart syndrome) is a rare autosomal recessive
  inborn error of tyrosine metabolism caused by deficiency of hepatic cytosolic
  tyrosine aminotransferase (TAT), the first enzyme of the tyrosine degradation
  pathway. Loss of TAT activity blocks transamination of tyrosine to
  4-hydroxyphenylpyruvate, producing marked hypertyrosinemia and systemic
  accumulation of tyrosine. Intracellular tyrosine deposition in the cornea and
  in the epidermis of the palms and soles drives the disorder's characteristic
  oculocutaneous phenotype: a pseudodendritic, herpetiform keratitis with
  corneal dystrophy, and painful palmoplantar hyperkeratosis. Variable
  intellectual disability may occur, particularly with delayed diagnosis or
  untreated disease. Because the biochemical block is upstream and toxic
  metabolites are limited to tyrosine itself, dietary restriction of tyrosine
  and phenylalanine lowers plasma tyrosine and produces rapid resolution of the
  ocular and cutaneous lesions, distinguishing it clinically and mechanistically
  from the hepatorenal disease of tyrosinemia type I (FAH deficiency).

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lubricating eye drops and ointment; ocular surgery as needed to"
    explanation: GeneReviews lists supportive ocular care in management.
notes: >
  Tyrosinemia type II is mechanistically distinct from tyrosinemia type I
  (FAH deficiency): the enzymatic block is at the first step of tyrosine
  degradation, so the pathogenic species is tyrosine itself rather than the
  hepatotoxic fumarylacetoacetate/succinylacetone metabolites of the type I
  distal block. This explains the oculocutaneous (rather than hepatorenal)
  phenotype and the strong, rapid response to dietary tyrosine restriction.
  Individuals diagnosed and treated from early infancy may be asymptomatic or
  have only mild ocular and skin manifestations. Nitisinone (NTBC), used in
  type I, is not the mainstay for type II because it acts downstream of TAT and
  would further raise tyrosine.

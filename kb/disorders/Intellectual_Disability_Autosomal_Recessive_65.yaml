name: Intellectual Disability Autosomal Recessive 65
creation_date: "2026-09-07T22:00:00Z"
category: Mendelian
synonyms:
- MRT65
- mental retardation, autosomal recessive 65
- intellectual developmental disorder, autosomal recessive 65
- KDM5B-related recessive neurodevelopmental disorder
disease_term:
  preferred_term: intellectual disability, autosomal recessive 65
  term:
    id: MONDO:0020850
    label: intellectual disability, autosomal recessive 65
description: >-
  MRT65 is a rare autosomal recessive neurodevelopmental disorder caused by
  biallelic (homozygous or compound heterozygous) disruptive variants in KDM5B,
  the gene for a JmjC-domain histone demethylase that removes methyl groups from
  lysine 4 of histone H3. It was defined in 2018 by two papers published within a
  year of each other: a genome-wide recessive burden analysis of the Deciphering
  Developmental Disorders cohort, which named KDM5B and EIF3F as the two genes
  newly associated with recessive developmental disorders, and a
  pathway-based survey of the histone lysine methylases and demethylases, which
  described the resulting entity as a recognisable syndrome of developmental
  delay, facial dysmorphism and camptodactyly. Roughly ten individuals with
  biallelic KDM5B variants have been reported. Developmental delay or impaired
  intellectual development is present in all of them; facial dysmorphism,
  behavioural problems and macrocephaly are recurrent, and agenesis of the
  corpus callosum has been described in a subset.


  The interesting thing about this gene is that the recessive entity is only one
  end of a dose-response relationship, and the entry is scoped deliberately to
  that end. In the Deciphering Developmental Disorders cohort KDM5B was the only
  gene enriched for biallelic variants and de novo mutations at the same time.
  Heterozygous KDM5B loss-of-function alleles are found in unaffected relatives
  and in population controls, do not segregate cleanly within families, and at
  population scale associate with a measurable downward shift in adult cognitive
  function rather than with a discrete disease. One group put it as "a spectrum
  of recessiveness". So the reduced penetrance that is repeatedly documented in
  the KDM5B literature is a statement about the *heterozygous* state; it is not,
  on the sources available, a statement about the biallelic genotype that
  defines MRT65. See the inheritance block and the discussions for how far that
  distinction can currently be pushed.


  SCOPE NOTE. This entity is defined by biallelic KDM5B. It must not be
  conflated with (a) the disorders of the KDM5 paralogues, which are separate
  genes with separate disease associations - in particular KDM5C, which causes
  Claes-Jensen type X-linked intellectual disability and is curated separately
  here; (b) the proposed dominant, monoallelic KDM5B-related neurodevelopmental
  disorder, whose existence and boundaries are still argued over and which is
  the subject of a discussion below rather than of this entry; (c) the large
  somatic KDM5B cancer literature, in which the gene appears under its older
  names PLU-1 and JARID1B as an amplified oncogene in breast cancer and a driver
  of drug-tolerant persister states in melanoma - a different biological context
  entirely; or (d) RUSC2-related Alwadei syndrome (OMIM 617773), a distinct
  recessive intellectual disability syndrome that some tertiary aggregator pages
  conflate with this one.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019502
      label: autosomal recessive non-syndromic intellectual disability
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    notes: >-
      MONDO places MRT65 under a non-syndromic grouping, but the founding
      description is explicitly of a recognisable syndrome with facial
      dysmorphism and camptodactyly, and later reports add macrocephaly and
      corpus callosum agenesis. The mapping is recorded as a broad match
      (a cross-reference) rather than an exact or narrow one so that it does
      not assert the non-syndromic characterisation.

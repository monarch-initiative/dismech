genetic:
- name: KDM5B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KDM5B (lysine demethylase 5B)
    term:
      id: hgnc:18039
      label: KDM5B
  notes: >-
    KDM5B (1q32.1; also known as JARID1B and PLU-1) encodes a JmjC-domain
    demethylase for H3K4me1/me2/me3 with a JmjN domain, an ARID DNA-binding
    domain, a C5HC2 zinc finger and three PHD fingers. Reported biallelic
    genotypes are homozygous nonsense, compound heterozygous nonsense or
    frameshift pairs, and one JmjC-domain missense allele in trans with a
    frameshift null. Two things about this gene are unusual for a recessive
    neurodevelopmental disease gene and are the reason the entry carries a
    controversy and a knowledge gap rather than a clean genotype-phenotype
    statement. First, in the Deciphering Developmental Disorders cohort it was
    the only gene enriched for biallelic variants and de novo mutations at the
    same time. Second, heterozygous loss-of-function alleles are tolerated: they
    occur in unaffected relatives and controls, and at population scale they
    associate with lower adult cognitive function rather than with disease.


    Somatic KDM5B alteration in cancer - amplification in breast cancer under the
    name PLU-1, and a role in drug-tolerant persister states in melanoma - is a
    separate biological context and is not evidence about this germline
    disorder. Neither are results from the paralogues KDM5A, KDM5C and KDM5D,
    which have their own disease associations; KDM5C in particular causes
    Claes-Jensen type X-linked intellectual disability and is a different entity.
  evidence:
  - reference: PMID:30409806
    reference_title: Quantifying the contribution of recessive coding variation to developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two genes not previously associated with recessive developmental disorders, KDM5B and EIF3F, and functionally validated them with mouse and cellular models."
    explanation: >-
      The founding gene-disease association, from a recessive burden analysis of
      6,040 human families. The same sentence names EIF3F, whose disorder is
      curated separately here as MRT67.
  - reference: PMID:29276005
    reference_title: Histone Lysine Methylases and Demethylases in the Landscape of Human Developmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, we describe a recessive histone lysine-methylation defect caused by homozygous or compound heterozygous KDM5B variants and resulting in a recognizable syndrome with developmental delay, facial dysmorphism, and camptodactyly."
    explanation: >-
      The contemporaneous independent description, which is what gives the
      biallelic genotype a recognisable clinical phenotype rather than only a
      statistical association.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the deciphering developmental disorders (DDD) cohort, KDM5B was the only gene enriched for both biallelic variants and de novo mutations (DNMs), the latter including three missense and six loss-of-function (LoF) variants."
    explanation: >-
      The dual enrichment that makes KDM5B's mode of inheritance genuinely
      contested rather than merely under-described.
  - reference: PMID:37231097
    reference_title: The impact of rare protein coding genetic variation on adult cognitive function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify eight genes (ADGRB2, KDM5B, GIGYF1, ANKRD12, SLC8A1, RC3H2, CACNA1A and BCAS3) that are associated with adult cognitive function through rare coding variants with large effects."
    explanation: >-
      KDM5B carries a measurable cognitive effect in the general adult
      population, in an exome study of 485,930 people. This is the population-end
      anchor for the dose-response reading of the gene.
animal_models:
- name: Kdm5b demethylase-inactive (delta-ARID) mouse
  species: Mus musculus
  genotype: Kdm5b delta-ARID homozygous (demethylase-inactive)
  publication: PMID:38575342
  description: >-
    Mice homozygous for a Kdm5b allele that removes demethylase activity while
    leaving the rest of the protein. Viable into adulthood, which the constitutive
    null largely is not, so this is the model in which adult cognition can be
    studied at all.
  genes:
  - preferred_term: KDM5B (lysine demethylase 5B)
    term:
      id: hgnc:18039
      label: KDM5B
  modeled_mechanisms:
  - target: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Hyperactivity and hippocampus-dependent long-term memory deficits, with
      immediate-early gene expression low at baseline and overshooting on a
      learning stimulus.
    limitations: >-
      The allele is demethylase-inactive rather than protein-null, so it models
      the catalytic arm of the human lesion and not the loss of KDM5B's
      demethylase-independent functions, which the same group notes exist. The
      readouts are behavioural and electrophysiological in a whole animal, one
      scale above the cellular node they are cited for, so the plasticity claim
      is inferred from what the animal does rather than measured in the human
      neuron. And it is a mouse: no biallelic human individual has had
      hippocampal plasticity measured.
    readouts:
    - name: Hippocampus-dependent long-term memory
      target: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
      direction: DECREASED
      interpretation: >-
        Behavioural correlate of the plasticity node, with short-term memory
        spared.
      evidence:
      - reference: PMID:38575342
        reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Kdm5b knockdown resulted in spontaneous seizures, hyperactivity, and hippocampus-dependent long-term memory and long-term potentiation deficits."
        explanation: >-
          Reports the memory and long-term potentiation deficits, here in the
          adult knockdown arm of the same study.
    - name: Immediate-early gene expression at baseline and after a learning stimulus
      target: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
      direction: ALTERED
      interpretation: >-
        Bidirectional dysregulation - down at baseline, hyperactivated on
        stimulation - rather than a simple loss of induction.
      evidence:
      - reference: PMID:38575342
        reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The expression of immediate early, activity-dependent genes was downregulated in these mice and hyperactivated upon a learning stimulus compared with wild-type (WT) mice."
        explanation: >-
          The measurement itself, in the demethylase-inactive homozygotes.
    evidence:
    - reference: PMID:38575342
      reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings identify KDM5B as a critical regulator of gene expression and synaptic plasticity in the adult hippocampus and suggest that at least some of the cognitive phenotypes associated with KDM5B gene variants are caused by direct effects on memory consolidation mechanisms."
      explanation: >-
        Attests that this model is informative for the plasticity node, and
        states how far the authors extend it toward the human phenotype.
  notes: >-
    The authors also note that some KDM5-family functions in brain appear to be
    independent of demethylase activity, which is a reason to treat this allele
    as a partial model of the human null rather than an equivalent of it.
  evidence:
  - reference: PMID:38575342
    reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The KDM5 family of lysine demethylases has developmental and homeostatic functions in the brain, some of which appear to be independent of lysine demethylase activity."
    explanation: >-
      Grounds the caveat that a demethylase-inactive allele does not reproduce
      everything a null allele would remove.
- name: Adult hippocampal Kdm5b knockdown mouse
  species: Mus musculus
  genotype: Wild-type mouse with shRNA-mediated Kdm5b knockdown in adult hippocampus
  publication: PMID:38575342
  description: >-
    Knockdown restricted to the adult hippocampus of an otherwise wild-type
    mouse. The point of the experiment is timing: it removes KDM5B after
    development is over.
  genes:
  - preferred_term: KDM5B (lysine demethylase 5B)
    term:
      id: hgnc:18039
      label: KDM5B
  modeled_mechanisms:
  - target: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Acute adult knockdown produces spontaneous seizures, hyperactivity, and
      long-term memory and long-term potentiation deficits, so part of the
      requirement for KDM5B is postnatal and ongoing rather than developmental.
    limitations: >-
      An acute, regionally restricted, partial knockdown in an adult animal is
      not the human lesion, which is constitutive, whole-body and complete from
      conception. It shows that adult KDM5B loss is sufficient for these
      deficits; it does not show that the human deficits are caused that way. The
      seizures it produces have no counterpart in the reported biallelic human
      individuals, in whom the 2024 cohort found no seizures. Readouts are
      whole-animal, one scale above the cellular node.
    evidence:
    - reference: PMID:38575342
      reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kdm5b knockdown resulted in spontaneous seizures, hyperactivity, and hippocampus-dependent long-term memory and long-term potentiation deficits."
      explanation: >-
        The perturbation result that licenses treating the plasticity node as an
        ongoing adult requirement.
  evidence:
  - reference: PMID:38575342
    reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Next, we knocked down Kdm5b specifically in the adult, WT mouse hippocampus with shRNA."
    explanation: >-
      Describes the model itself - what was knocked down, where, and in what
      background - which is what makes it a timing experiment rather than a
      second constitutive model.

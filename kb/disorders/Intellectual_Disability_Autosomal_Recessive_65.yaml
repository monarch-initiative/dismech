  - target: Increased Grin2d and NMDA Receptor Subunit 2D Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Raised H3K4me3 at the Grin2d promoter, raised Grin2d expression, and more

    allelic_hit_role: BIALLELIC_INACTIVATION
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: nonsense, frameshift, canonical splice-site, or catalytic-domain
      missense in trans with a null allele
    notes: >-
      Zygosity is recorded as HOMOZYGOUS because that is the single value the
      slot takes and homozygous nonsense alleles are the reported archetype;
      compound heterozygous genotypes are equally common in the case literature
      and are described in the genetic section.

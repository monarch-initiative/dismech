      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings identify KDM5B as a critical regulator of gene expression and synaptic plasticity in the adult hippocampus"
      explanation: >-
        Supports the edge rather than either node: the authors tie KDM5B's
        control of gene expression directly to synaptic plasticity in the same
        tissue, which is the causal step being asserted here.
  - target: Altered Cortical Neurodevelopment and Brain Overgrowth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38575342
    reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The expression of immediate early, activity-dependent genes was downregulated in these mice and hyperactivated upon a learning stimulus compared with wild-type (WT) mice."
    explanation: >-
      The bidirectional dysregulation, in demethylase-inactive mice.
- name: Increased Grin2d and NMDA Receptor Subunit 2D Expression
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    One specific downstream target has been traced end to end in the mouse:
    raised H3K4me3 at the Grin2d promoter, raised Grin2d expression, and more
    NMDAR2D protein in synaptosomes from early postnatal neocortex. Recorded as
    HYPOTHETICAL for MRT65 because it is entirely a mouse result and because the
    behavioural readout it was traced to - socio-communication deficit - is the
    feature that biallelic human individuals conspicuously do not have. It is
    kept in the graph because it is the only mechanistically complete
    chromatin-to-synapse link anyone has for this gene, and because it names a
    druggable node.
  downstream:
  - target: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
    causal_link_type: DIRECT
  evidence:

pathophysiology:
- name: Biallelic KDM5B Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. Two disruptive KDM5B alleles - nonsense, frameshift,
    canonical splice-site, or a catalytic-domain missense in trans with a null -
    leave the cell without functional KDM5B. A single such allele does not
    produce this disorder, which is the whole content of calling the entity
    recessive.

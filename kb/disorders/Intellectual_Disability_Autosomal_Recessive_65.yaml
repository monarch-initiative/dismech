    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased H3K4me3 levels at the promoter and associated expression of the Grin2d gene were associated with increased levels of N-methyl-d-aspartate receptor subunit 2D (NMDAR2D) protein in synaptosomes isolated from the early postnatal Kdm5b-deficient neocortex."
    explanation: >-
      The full mark-to-transcript-to-protein chain, measured in Kdm5b-deficient
      mouse neocortex.
- name: Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis"
  description: >-
    Where the chromatin defect becomes a neuronal one. Demethylase-inactive mice

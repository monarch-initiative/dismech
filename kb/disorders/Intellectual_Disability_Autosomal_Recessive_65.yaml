- name: Dysregulated Neurodevelopmental Transcriptional Program
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  description: >-
    The transcriptional consequence, and it is bidirectional rather than a simple
    upward shift. Neurodevelopmental genes are expressed at higher levels in the
    developing mutant neocortex, while activity-dependent immediate-early genes
    sit lower at baseline and then overshoot on stimulation. What the mark
    change costs the neuron is regulated, appropriately timed transcription, not
    transcription as such.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: LOSS_OF_FUNCTION
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: DECREASED
  downstream:
  - target: Increased Grin2d and NMDA Receptor Subunit 2D Expression

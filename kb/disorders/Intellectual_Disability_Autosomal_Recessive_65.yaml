    snippet: "There are very few treatment options available for DDs such that these are conditions with significant unmet clinical need."
    explanation: >-
      A review of the KDM5B developmental-disorder literature stating the absence
      of treatment options for this class of condition. Graded OTHER because the
      review reports no primary data.
  notes: >-
    Nothing in the sources reviewed reports an outcome for any specific
    intervention in an individual with biallelic KDM5B variants, so no
    effectiveness claim is made here.
- name: Developmental, Educational and Communication Therapy
  description: >-
    Early intervention, speech and language therapy, occupational therapy and
    physical therapy, directed at the developmental delay and the hand function
    that camptodactyly may limit. This is standard care for syndromic
    intellectual disability rather than anything established for MRT65.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    No evidence item is attached to this treatment. No study of any developmental
    therapy in KDM5B-related disorder exists in the sources reviewed, and citing
    a general early-intervention trial would attach evidence about a different
    population to this entry.
- name: Genetic Counseling
  description: >-
    Recurrence risk for the siblings of an affected child of two carrier parents
    is one in four on the standard recessive expectation, and prenatal or
    preimplantation testing is possible once the familial alleles are known - a
    sibling pair with corpus callosum agenesis was in fact ascertained partly
    prenatally. The counselling is harder than that arithmetic suggests, though,
    because carrier relatives of an affected child may themselves carry a
    heterozygous loss-of-function allele whose consequences are contested, and
    the 2024 cohort says plainly that variant interpretation in this gene is
    difficult in the light of reduced penetrance.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotypic interpretation remains difficult in the light of reduced penetrance."
    explanation: >-
      The authors' own statement of what makes counselling for this gene
      difficult, and the reason this entry does not present a clean recessive
      counselling message.
prevalence:
- population: Worldwide, published biallelic KDM5B cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence estimate exists for MRT65. The disorder
    is known from a case literature of roughly ten individuals with biallelic
    KDM5B variants: the founding descriptions in 2018, a compound heterozygous
    sibling pair in 2021, and two further individuals in the 2024
    genotype-phenotype cohort. The 2024 paper is internally inconsistent about
    the running total - its discussion counts four previously described biallelic
    cases attributable to the two 2018 reports, while its literature-comparison
    table uses a denominator of eight - so "roughly ten" is the honest figure and
    a precise count is not asserted here. No numeric rate is recorded. A
    theoretical birth incidence near 1 in 1.3 million appears in one of the
    committed deep-research reports, but it is a calculation from an assumed
    carrier frequency and an assumed complete penetrance, not a measurement, and
    it is not curated as a prevalence value here.
  evidence:
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four cases of bi-allelic KDM5B variants with intellectual developmental disorder autosomal recessive-65 (MRT65) (OMIM: 618109) have been described in the literature"
    explanation: >-
      The published case count attributed to the two founding reports, which is
      what places this disorder in the ultra-rare band and rules out any
      population-rate claim.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Sequencing is how every reported case was found and is effectively the only
    diagnostic route. Camptodactyly with a recognisable facial gestalt and
    developmental delay may raise the question, but the phenotype is not
    distinctive enough to reach the gene without sequencing, and with about ten
    individuals published no clinician can be expected to recognise it.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  markers: Two disruptive KDM5B alleles in trans - nonsense, frameshift, canonical
    splice-site, or a JmjC-domain missense allele opposite a null. A single heterozygous
    loss-of-function allele does not establish this diagnosis, since such alleles
    occur in unaffected relatives and population controls.
  evidence:
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic disruptive variants (nonsense, frameshift, and splicing variants) in KDM5B have been identified as causative for autosomal recessive intellectual developmental disorder type 65."
    explanation: >-
      Names the variant classes a sequencing report must show, and that they must
      be biallelic.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, dominant variants, usually disruptive as well, have been more difficult to implicate in a specific phenotype, since some of them have been found in unaffected controls or relatives."
    explanation: >-
      Why phasing matters diagnostically: a single disruptive KDM5B allele is
      found in unaffected people, so a monoallelic finding does not make this
      diagnosis.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Imaging is worth doing because agenesis of the corpus callosum has been found
    in biallelic individuals, including prenatally, and the authors of that
    report argued on that basis for putting KDM5B on diagnostic panels for
    corpus callosum agenesis. It is not a screening test for the diagnosis:
    structural malformation was present in only one of the biallelic individuals
    imaged in the 2024 cohort.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34573379
    reference_title: Agenesis of the Corpus Callosum with Facial Dysmorphism and Intellectual Disability in Sibs Associated with Compound Heterozygous KDM5B Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with the observations in this family, this suggests that agenesis of the corpus callosum may be part of the phenotypic spectrum associated with KDM5B variants and that the KDM5B gene should be included in gene panels to clarify the etiology of ACC both in the prenatal and postnatal setting."
    explanation: >-
      The authors' recommendation, and the reason imaging findings feed back into
      the genetic differential rather than only into prognosis.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Structural brain malformations were noted for three of the seven individuals with dominant variants and one individual with bi-allelic variants."
    explanation: >-
      Sets expectations: a normal scan does not argue against the diagnosis.
discussions:
- discussion_id: kdm5b_dominant_disorder_existence
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is there a distinct dominant, monoallelic KDM5B neurodevelopmental disorder,
    or is MRT65 the only KDM5B disease and heterozygous loss of function merely a
    quantitative shift in cognitive function?
  attaches_to:
  - genetic#KDM5B
  - inheritance#Autosomal recessive inheritance
  - disease#Intellectual Disability Autosomal Recessive 65
  rationale: >-
    The literature has argued both sides and has not settled. On one side, a 2018
    functional study of splice variants concluded flatly that KDM5B
    haploinsufficiency is not a mechanism in intellectual disability and that the
    KDM5B loss-of-function disorder is recessive; the same paper notes that
    de novo loss-of-function and missense KDM5B variants have been found in
    unaffected individuals as well as in patients. On the other, a 2024
    genotype-phenotype study of 21 individuals - nineteen of them monoallelic -
    describes a monoallelic phenotype in detail and argues for the pathogenicity
    of certain dominant missense variants. Its own framing is that there is "a
    spectrum of recessiveness" in KDM5B disease.


    The population data are what make this hard rather than merely
    under-reported. Heterozygous KDM5B protein-truncating variants are common
    enough in the general adult population to be studied at biobank scale, where
    they associate with a measurable downward shift in cognitive function - a
    quantitative effect, not a disease. That is compatible either with a dominant
    disorder of very reduced penetrance or with no dominant disorder at all and a
    dose-response relationship whose lower end is subclinical.


    What this entry does about it: it scopes itself to the biallelic genotype,
    which is what MONDO:0020850 and OMIM 618109 name and what every source agrees
    is disease-causing. It does not curate a dominant KDM5B entity, and it does
    not import monoallelic phenotype frequencies into the biallelic phenotype
    list. If a dominant entity is eventually accepted with its own MONDO term, it
    should be a separate entry, not a subtype here.
  evidence:
  - reference: PMID:30217758
    reference_title: "Novel KDM5B splice variants identified in patients with developmental disorders: Functional consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data reinforces the recent observation that the KDM5B haploinsufficiency is not a mechanism involved in intellectual disability and that KDM5B disorder associated with LOF variants is a recessive disorder."
    explanation: >-
      The recessive-only position, stated explicitly.
  - reference: PMID:30217758
    reference_title: "Novel KDM5B splice variants identified in patients with developmental disorders: Functional consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, de novo loss-of-function and missense variants in KDM5B were identified in patients with intellectual disability (ID) and autism spectrum disorder (ASD) but also in unaffected individuals."
    explanation: >-
      The observation that drives the recessive-only position: the same de novo
      alleles appear in affected and unaffected people.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In our opinion, there is a spectrum of recessiveness in KDM5B-related diseases"
    explanation: >-
      Graded REFUTE against the strict recessive-only position quoted above: this
      cohort argues that monoallelic KDM5B variants can be pathogenic and that
      the recessive-versus-dominant question is not binary. It does not refute
      the biallelic disease claim, which this paper affirms elsewhere in the
      entry.
  - reference: PMID:37231097
    reference_title: The impact of rare protein coding genetic variation on adult cognitive function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the case of KDM5B we show how the genetic dosage of one of these genes may determine the variability of cognitive, behavioral and molecular traits in mice and humans."
    explanation: >-
      The dose-response framing that reconciles the two positions without
      settling them. Graded HUMAN_CLINICAL because the study is a human exome
      analysis of 485,930 adults; its mouse arm is a secondary component of the
      same sentence and cannot be split out of one quote.
- discussion_id: kdm5b_biallelic_penetrance_unmeasured
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the penetrance of the biallelic KDM5B loss-of-function genotype? No
    study has estimated it, and the reduced penetrance that the KDM5B literature
    repeatedly documents belongs to the heterozygous state.
  attaches_to:
  - inheritance#Autosomal recessive inheritance
  - genetic#KDM5B
  rationale: >-
    Every published individual with two disruptive KDM5B alleles has been
    affected. That is a real observation and it is why the entry does not record
    incomplete penetrance. But all of them were ascertained through an affected
    proband in a literature of about ten cases, so it cannot separate complete
    penetrance from the ascertainment that produced the case series, and no
    source reviewed here reports an unaffected homozygous or compound
    heterozygous relative. Penetrance is therefore recorded as UNKNOWN rather
    than COMPLETE.


    The reason the question is live rather than pedantic is the gene's behaviour
    one dose up. Heterozygous loss-of-function alleles are tolerated well enough
    to sit in population reference data at an observed-to-expected ratio near
    0.57, which the 2024 cohort reads as partial penetrance, and they do not
    segregate with disease in families. A gene whose heterozygous null state is
    that permissive is exactly the kind of gene where an unaffected biallelic
    individual would be worth actively looking for.


    Resolving it needs population-scale data rather than more case reports: a
    genotype-first search of a large biobank or a consanguineous-population
    cohort for biallelic KDM5B loss-of-function individuals, with phenotyping
    that does not presuppose they were referred for developmental delay.
  proposed_experiments:
  - experiment_id: kdm5b_genotype_first_biallelic_ascertainment
    name: Genotype-first ascertainment of biallelic KDM5B loss-of-function carriers
    description: >-
      Search large unselected exome or genome cohorts, weighted toward
      populations with high autozygosity, for individuals homozygous or compound
      heterozygous for KDM5B protein-truncating alleles, then phenotype them
      through linked health records and direct cognitive assessment rather than
      through the referral route that produced the existing case series.
    decision_criterion: >-
      Whether any ascertained biallelic individual lacks developmental delay or
      intellectual disability on direct assessment.
    would_support:
    - inheritance#Autosomal recessive inheritance
    supporting_outcome:
    - Every biallelic individual found by genotype-first ascertainment has
      developmental delay or intellectual disability, which would move penetrance
      from UNKNOWN toward COMPLETE.
    refuting_outcome:
    - Unaffected or minimally affected biallelic individuals are found, which
      would establish incomplete penetrance for the biallelic genotype and change
      both the recurrence-risk counselling and the diagnostic weight of a
      biallelic finding.
  evidence:
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is in line with a partial penetrance of heterozygous LoF KDM5B variants."
    explanation: >-
      The documented partial penetrance, stated for the heterozygous genotype.
      This is the claim that must not be transferred to the biallelic genotype.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moderate-to-severe DD and impaired intellectual development were common to all."
    explanation: >-
      All reported biallelic individuals were affected, which is the observation
      the gap is about: it is consistent with complete penetrance and equally
      consistent with ascertainment.
- discussion_id: kdm5b_mouse_autism_vs_human_biallelic
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Mice without KDM5B demethylase activity show autism-like behaviour, yet the
    reported biallelic human individuals do not have autistic behaviours. Is the
    NMDAR2D mechanism traced in the mouse relevant to MRT65 at all, or is it a
    model of the monoallelic human phenotype?
  attaches_to:
  - pathophysiology#Increased Grin2d and NMDA Receptor Subunit 2D Expression
  - animal_models#Kdm5b demethylase-deficient mouse (neocortical H3K4me3 study)
  - phenotypes#Behavioral Abnormalities
  rationale: >-
    This is a mismatch of the specific kind the HUMAN_MODEL_MISMATCH label exists
    for: the model evidence is strong and the human evidence is not absent, they
    simply point different ways. The mouse chain is unusually complete for a
    chromatinopathy - raised H3K4me3 at the Grin2d promoter, raised transcript,
    raised NMDAR2D protein in synaptosomes, socio-communication deficits, and
    rescue of the vocalisation deficit by memantine. But the endpoint it lands on
    is the feature the biallelic human individuals do not have. The 2024 cohort
    states that both of its biallelic individuals had behavioural problems
    without autistic behaviours, and notes the same monoallelic-versus-biallelic
    split for autistic behaviour that it had previously reported for another
    epigenetic regulator.


    Two readings survive. Either the mouse models the monoallelic end of the
    human dose-response, in which case its mechanism is about the contested
    dominant disorder and not about MRT65; or autistic behaviour in biallelic
    humans is simply undercounted at a denominator of two plus a small pooled
    literature. Nothing in the sources distinguishes them, and the entry does not
    pick: the Grin2d node is retained with mechanism_confidence HYPOTHETICAL, and
    autistic behaviour is not curated as a phenotype of this entity.
  evidence:
  - reference: PMID:42160407
    reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice exhibited autism-like behaviors and increased brain size."
    explanation: >-
      The model phenotype, in mice without KDM5B demethylase activity.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Both individuals with bi-allelic variants displayed behavioral problems such as mood swings and aggressivity, but they did not display autistic behaviors."
    explanation: >-
      Graded REFUTE against the proposition that the mouse autism-like phenotype
      corresponds to a feature of the biallelic human disorder. It is the human
      observation that creates the mismatch.
- discussion_id: kdm5b_nmdar_antagonism_as_target
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Does NMDA receptor antagonism have any therapeutic potential in KDM5B-related
    neurodevelopmental disorder, given that memantine rescued a vocalisation
    deficit in demethylase-deficient mice?
  attaches_to:
  - pathophysiology#Increased Grin2d and NMDA Receptor Subunit 2D Expression
  - treatments#Supportive and Symptom-Directed Management
  rationale: >-
    This is recorded as a hypothesis and nothing more. A single mouse study
    reports that memantine rescued ultrasonic vocalisation deficits in mice
    lacking KDM5B demethylase activity, downstream of raised Grin2d expression.
    That is a mechanistically motivated result, and it names a drug that is
    already licensed for other indications, which is why it is worth recording at
    all. Against it: the rescued endpoint is a mouse vocalisation deficit whose
    human counterpart is a socio-communication phenotype that the reported
    biallelic individuals do not have; no human has been treated; and no trial
    exists. The entry does not list memantine as a treatment, and this discussion
    should not be read as suggesting it be used.
  evidence:
  - reference: PMID:42160407
    reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treating mice with the NMDAR antagonist memantine rescued deficits in ultrasonic vocalizations."
    explanation: >-
      The rescue result. Mouse only, and the endpoint is a vocalisation measure.
- discussion_id: kdm5b_developmental_versus_ongoing_requirement
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the cognitive impairment in MRT65 fixed at the end of development, or does
    part of it reflect an ongoing adult requirement for KDM5B that might in
    principle remain modifiable?
  attaches_to:
  - pathophysiology#Impaired Activity-Dependent Gene Expression and Synaptic Plasticity
  - animal_models#Adult hippocampal Kdm5b knockdown mouse
  rationale: >-
    Knocking Kdm5b down in the adult mouse hippocampus alone - after development
    is complete - produces long-term memory and long-term potentiation deficits.
    That is a genuinely interesting result for a disorder that is otherwise
    described as a static developmental disability, because it separates the
    developmental requirement for the gene from a continuing one. Whether any
    part of the human phenotype has the same character is unknown: no
    longitudinal cognitive data exist for biallelic individuals, and the oldest
    reported individual is described only cross-sectionally. The question is
    recorded because it bears directly on whether a postnatal intervention window
    could exist at all, not because any intervention is available.
  evidence:
  - reference: PMID:38575342
    reference_title: The Intellectual Disability Risk Gene Kdm5b Regulates Long-Term Memory Consolidation in the Hippocampus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Kdm5b knockdown resulted in spontaneous seizures, hyperactivity, and hippocampus-dependent long-term memory and long-term potentiation deficits."
    explanation: >-
      Adult-restricted knockdown is sufficient for the deficits, which is what
      raises the question of an ongoing rather than purely developmental
      requirement.
notes: >-
  Curation scope and sourcing. This entry covers the biallelic KDM5B genotype
  named by MONDO:0020850 and OMIM 618109. It draws on eight primary sources plus
  one review, and on two deep-research reports committed alongside it. The
  requested falcon provider returned HTTP 402; the recorded fallback produced an
  openscientist report, and a claude_code report was run in parallel while that
  one was outstanding. Both are committed. They agree on the disease definition,
  the causal gene, the mechanism and the absence of any disease-modifying
  therapy, and both were read before the entry was finalised.


  Where the two reports disagree with this entry, and with each other.
  Penetrance: the openscientist report calls the biallelic genotype fully or
  highly penetrant, qualified as "based on limited cohorts". This entry records
  UNKNOWN instead, for the reason set out in the inheritance block - every
  reported biallelic individual was ascertained through an affected proband, so
  a case series of about ten cannot separate complete penetrance from
  ascertainment, and no source reviewed states a penetrance estimate for the
  biallelic genotype. gnomAD constraint: the 2024 cohort quoted in this entry
  reports a loss-of-function observed-to-expected ratio of about 0.57 from
  gnomAD non-neuro v2.1.2, while the openscientist report gives 0.74 with LOEUF
  0.855 from a current gnomAD query. Both readings support the same conclusion -
  that heterozygous KDM5B loss of function is tolerated - and the entry quotes
  only the figure that has a citable source behind it. Incidence: the
  openscientist report offers a carrier frequency near 1 in 570 and a birth
  incidence near 1 in 1.3 million, and flags both as theoretical calculations
  assuming random mating and complete penetrance. Neither is curated, because
  neither is an observation and the second is derived from the penetrance
  assumption this entry declines to make.


  Claims present in the deep-research report but deliberately not curated here,
  because they could not be verified against a cached source: the specific
  variant list from the founding cohort, the 96.89-fold enrichment of homozygous
  protein-truncating variants, the absence of homozygous KDM5B knockouts among
  3,222 consanguineous reference individuals, and the constitutive Kdm5b-null
  mouse phenotype including perinatal lethality and exencephaly. All of those sit
  in the full text of PMID:29276005, which is cached as abstract only, so no
  exact quote is available for them. They are recorded here as unverified leads,
  not as entry content. The report also gave hgnc:29332 for KDM5B and HP:0002510
  for moderate intellectual disability; both are wrong - the gene is hgnc:18039
  and HP:0002510 is Spastic tetraplegia - and neither was used.


  Not curated for lack of a quotable biallelic-specific source: feeding
  difficulties, dolichocephaly, cardiac septal defect, genitourinary anomalies,
  hernias, supernumerary nipple, optic nerve hypoplasia and pectus excavatum.
  Speech and language delay was on this list in an earlier revision and should
  not have been: PMID:34573379 describes its Case 1, a compound heterozygote,
  with poor speech at four years, which is a quotable biallelic-specific
  sentence, and the HPO annotation for OMIM:618109 lists HP:0000750 as frequent.
  It is now curated, as is the hypotonia in the same sentence. What remains
  correct is the exclusion of the 7-of-13 speech figure in PMID:39202393, which
  is explicitly a count over that paper's dominant cohort. Each appears in the deep-research report,
  usually as a single-patient observation traceable to the full text of a source
  that is cached as abstract only. Sleep disturbance and autistic behaviour are
  omitted for the opposite reason: the 2024 cohort, which is the best source for
  both, reports them absent in its biallelic individuals while common in its
  monoallelic ones.


  The pathophysiology chain leaves facial dysmorphism and camptodactyly
  unconnected. That is not an oversight. No source reviewed here traces a route
  from KDM5B loss through chromatin to the craniofacial or hand phenotype, and
  drawing an edge to fill the gap would assert a mechanism nobody has shown.


  Module conformance. Three nodes conform to the epigenetic machinery
  neurodevelopmental dysregulation module. The initiating node deliberately does
  not: that module's first node is haploinsufficiency of a dosage-sensitive
  chromatin component, and this disorder is biallelic complete loss. The
  direction of the chromatin change is also inverted relative to the module's
  worked conformers - most of them lose a writer and lose a permissive mark,
  whereas losing KDM5B removes an eraser and the permissive H3K4me3 mark
  accumulates. The conserved middle of the module, chromatin imbalance to
  dysregulated neurodevelopmental transcription to impaired neuronal maturation,
  holds either way, which is why conformance is declared from the second node on.
datasets: []

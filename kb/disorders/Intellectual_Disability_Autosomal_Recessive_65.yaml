treatments:
- name: Supportive and Symptom-Directed Management
  description: >-
    There is no disease-modifying or gene-directed therapy for MRT65, and no
    MRT65-specific management guideline, GeneReviews chapter, or clinical trial
    was found. Management is what it is for any syndromic intellectual
    disability: multidisciplinary developmental support, and treatment of the
    individual anomalies a given child turns out to have.

  evidence:
  - reference: PMID:30409806
    reference_title: Quantifying the contribution of recessive coding variation to developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two genes not previously associated with recessive developmental disorders, KDM5B and EIF3F, and functionally validated them with mouse and cellular models."
    explanation: >-
      The founding gene-disease association, from a genome-wide recessive burden
      analysis of 6,040 Deciphering Developmental Disorders families. Graded
      HUMAN_CLINICAL because the association itself is a human cohort finding;
      the same sentence also reports mouse and cellular validation, but a single
      quote carries a single grade.
  - reference: PMID:29276005
    reference_title: Histone Lysine Methylases and Demethylases in the Landscape of Human Developmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, we describe a recessive histone lysine-methylation defect caused by homozygous or compound heterozygous KDM5B variants and resulting in a recognizable syndrome with developmental delay, facial dysmorphism, and camptodactyly."
    explanation: >-
      Names both reported biallelic configurations and the syndrome they produce.
- name: Loss of KDM5B H3K4 Demethylase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    KDM5B is an Fe(II)/2-oxoglutarate-dependent JmjC-domain demethylase whose
    substrate is methylated lysine 4 of histone H3. Without it, the cell loses
    the enzyme that erases that mark. Note the direction of travel here: unlike
    most chromatinopathies, where a writer is lost and a permissive mark falls,
    the lesion in MRT65 removes an eraser, so the permissive mark accumulates.
  molecular_functions:
  - preferred_term: histone H3K4me3/me2/me1 demethylase activity
    term:
      id: GO:0034647
      label: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: histone H3K4 demethylase activity
    term:
      id: GO:0032453
      label: histone H3K4 demethylase activity
    modifier: DECREASED
  downstream:
  - target: Elevated H3K4 Trimethylation at Developmental Gene Promoters
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42160407
      reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "H3K4me3 levels and the expression of neurodevelopmental genes were increased in the developing Kdm5b mutant neocortex."
      explanation: >-
        Establishes the edge rather than either node: removing KDM5B demethylase
        activity is what raises H3K4me3 in developing neocortex. Demonstrated in
        mice without KDM5B demethylase activity, not in human tissue.
  evidence:
  - reference: PMID:35905858
    reference_title: Pathogenic KDM5B variants in the context of developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KDM5B is responsible for the demethylation of lysine 4 on the amino tail of histone 3 and plays a vital role in normal development and regulating cell differentiation."
    explanation: >-
      States the enzyme's substrate specificity. Graded OTHER because this is a
      narrative review that reports no primary data of its own; the underlying
      biochemistry is in the papers it cites.
- name: Elevated H3K4 Trimethylation at Developmental Gene Promoters
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    H3K4me3 is a promoter-proximal permissive mark. With the eraser gone it
    accumulates at the promoters of developmentally regulated and
    activity-dependent genes, shifting the permissive-repressive balance toward
    permissive - the same imbalance the chromatinopathy module describes, reached
    from the opposite direction. Recorded as PROVISIONAL for human disease: the
    accumulation is directly measured in mouse neocortex and has not been shown
    in tissue from an individual with MRT65.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: chromatin
    term:
      id: GO:0000785
      label: chromatin
  downstream:
  - target: Dysregulated Neurodevelopmental Transcriptional Program
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42160407
      reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings suggest that increased H3K4me3 levels and associated Grin2d gene up-regulation disrupt brain development and function, leading to socio-communication deficits and identify a potential therapeutic target for neurodevelopmental disorders associated with KDM5B deficiency."
      explanation: >-
        The authors' causal reading of their own data: raised H3K4me3 drives the
        transcriptional change, which drives the phenotype. Mouse.
  evidence:
  - reference: PMID:42160407
    reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
    supports: SUPPORT

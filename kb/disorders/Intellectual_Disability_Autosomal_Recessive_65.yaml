inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    Two disruptive KDM5B alleles are required, in cis-trans configuration
    confirmed where phasing was possible; reported genotypes are homozygous
    nonsense, compound heterozygous nonsense or frameshift pairs, and one
    JmjC-domain missense allele in trans with a frameshift null.


    Penetrance is recorded as UNKNOWN, and that is a deliberate reading of what
    the sources will and will not support. Every reported individual carrying two
    disruptive KDM5B alleles has had developmental delay or impaired intellectual
    development, and no unaffected biallelic individual has been described. But
    all of those individuals were ascertained through an affected proband, in a
    literature of about ten cases, so the observation cannot distinguish complete
    penetrance from ascertainment. No study has estimated penetrance for the
    biallelic genotype, and none of the sources reviewed reports an unaffected
    homozygous or compound heterozygous relative. COMPLETE would overstate a
    case series; INCOMPLETE would import a finding that belongs to a different
    genotype.


    That different genotype is the heterozygous one, and there the reduced
    penetrance is documented and repeatedly restated: heterozygous KDM5B
    loss-of-function alleles turn up in unaffected relatives and in population
    controls, dominant loss-of-function variants do not segregate with disease
    within families, and the gnomAD observed-to-expected ratio for
    loss-of-function of about 0.57 is read by the same authors as partial
    penetrance of heterozygous loss of function. Keeping the two apart is the
    point: the KDM5B penetrance literature is about carriers, not about patients
    with MRT65.


    Expressivity is recorded as VARIABLE. Severity of the intellectual disability
    ranges from mild in the two biallelic individuals of the 2024 cohort to
    moderate-to-severe in the earlier literature, and structural brain
    malformation is present in some biallelic individuals and absent in others.
  evidence:
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic disruptive variants (nonsense, frameshift, and splicing variants) in KDM5B have been identified as causative for autosomal recessive intellectual developmental disorder type 65."
    explanation: >-
      States the recessive, biallelic genotype that defines this entity.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, dominant variants, usually disruptive as well, have been more difficult to implicate in a specific phenotype, since some of them have been found in unaffected controls or relatives."
    explanation: >-
      The documented unaffected carriers are heterozygous, not biallelic. This is
      the sentence behind the entry's decision to record reduced penetrance as a
      property of the heterozygous state and to leave biallelic penetrance
      unknown.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is in line with a partial penetrance of heterozygous LoF KDM5B variants."
    explanation: >-
      The authors' own reading of the gnomAD constraint data, stated for the
      heterozygous genotype specifically.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moderate-to-severe DD and impaired intellectual development were common to all."
    explanation: >-
      Every biallelic individual in the pooled literature was affected, which is
      what makes COMPLETE tempting and what ascertainment through affected
      probands makes unsafe.
  - reference: PMID:39202393
    reference_title: A Genotype/Phenotype Study of KDM5B-Associated Disorders Suggests a Pathogenic Effect of Dominantly Inherited Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both individuals with bi-allelic variants presented with a mild ID, and one of them presented with a GDD."
    explanation: >-
      The 2024 biallelic individuals sit at the mild end, against
      moderate-to-severe in the earlier literature. This severity range is the
      basis for expressivity VARIABLE.

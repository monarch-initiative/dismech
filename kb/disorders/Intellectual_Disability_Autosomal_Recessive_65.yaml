- name: Altered Cortical Neurodevelopment and Brain Overgrowth
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A second branch, and a much weaker one. Mice without KDM5B demethylase
    activity have larger brains, and macrocephaly is recorded in biallelic human
    individuals, so a growth arm to the phenotype is plausible. Whether the same
    process accounts for the structural malformations seen in a subset - agenesis
    of the corpus callosum in particular - is not established, and the route from
    chromatin dysregulation to the craniofacial and hand features of the syndrome
    has not been worked out at all for this gene. Recorded as HYPOTHETICAL for
    that reason.

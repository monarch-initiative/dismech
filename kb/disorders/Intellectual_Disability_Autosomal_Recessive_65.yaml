  evidence:
  - reference: PMID:42160407
    reference_title: Autism-like phenotypes and increased NMDAR2D expression in mice with KDM5B histone lysine demethylase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To study the role of KDM5B (lysine demethylase 5B)-mediated H3K4me3 demethylation, we investigated neurodevelopmental phenotypes in mice without KDM5B demethylase activity."
    explanation: >-

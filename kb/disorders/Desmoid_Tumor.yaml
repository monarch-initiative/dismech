name: Desmoid Tumor
creation_date: '2026-09-02T12:45:00Z'
description: >-
  A locally aggressive monoclonal proliferation of myofibroblasts that infiltrates
  surrounding tissue but never metastasises. Almost all cases are driven by
  constitutive Wnt/beta-catenin signalling: sporadic tumours carry activating
  somatic mutations in CTNNB1 exon 3, while tumours arising in familial adenomatous
  polyposis carry germline APC mutations. Both lesions converge on the same defect,
  failure of the Axin/APC/GSK3-beta destruction complex to degrade cytoplasmic
  beta-catenin, which then accumulates in the nucleus and drives myofibroblast
  proliferation and collagen-rich matrix deposition. The clinical course is
  strikingly unpredictable, with long spontaneous stability and outright regression
  common enough that active surveillance, rather than surgery, is now the
  recommended first-line management for most patients.
categories:
- Soft Tissue Neoplasm
- Wnt Pathway Disorder
- Locally Aggressive Non-Metastasising Neoplasm
parents:
- fibromatosis
synonyms:
- aggressive fibromatosis
- desmoid-type fibromatosis
- desmoid fibromatosis
- deep fibromatosis
epidemiology:
- name: Incidence
  description: >-
    A rare tumour, estimated at three to five cases per million person-years. The
    rarity is itself clinically consequential: it limits awareness and contributes
    to the diagnostic delay patients typically experience.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The low incidence of DT (estimated 3-5 cases per million person-years) limits
      disease awareness.
    explanation: Gives the population incidence and links the rarity to delayed recognition.
- name: Proportion of soft tissue tumours
  description: >-
    Desmoid tumours make up roughly 3% of soft tissue tumours.
  evidence:
  - reference: PMID:27542640
    reference_title: Management of Desmoids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Desmoid tumors are rare, comprising 3% of soft tissue tumors.
    explanation: Gives the share of soft tissue tumours represented by this entity.
- name: Symptom burden
  description: >-
    Despite being non-metastasising, the disease carries a heavy symptom burden.
    Up to 63% of patients have chronic pain, with downstream effects on sleep, mood
    and daily function.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patients with DT experience a high symptom burden: up to 63% of patients
      experience chronic pain, which leads to sleep disturbance (73% of cases), irritability
      (46% of cases), and anxiety/depression (15% of cases).'
    explanation: Quantifies chronic pain and its consequences in this population.
has_subtypes:
- name: Sporadic
  display_name: Sporadic (CTNNB1-mutant)
  description: >-
    The large majority of cases. Driven by an activating somatic mutation in CTNNB1
    exon 3, most often T41A or S45F, in a patient with no polyposis syndrome.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most DTs are sporadic, harboring somatic mutations in the gene that encodes
      for β-catenin, whereas DTs occurring in patients with familial adenomatous polyposis
      have germline mutations in the APC gene, which encodes for a protein regulator of
      β-catenin.
    explanation: Separates the sporadic somatic-CTNNB1 arm from the germline-APC arm.
- name: FAP-associated
  display_name: FAP-associated (germline APC)
  description: >-
    Arises in familial adenomatous polyposis on a background of germline APC
    mutation. These tumours are disproportionately intra-abdominal and mesenteric,
    and they are the second leading cause of death in FAP after colorectal cancer.
  evidence:
  - reference: PMID:20676788
    reference_title: Evaluating causes of death in familial adenomatous polyposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Desmoid disease was the second cause of death (10.5% of all causes), leading
      to a fatal outcome 22% of all patients who developed DT during the study period.
    explanation: Establishes desmoid disease as the second cause of death in this FAP
      cohort and quantifies its lethality among those affected.
pathophysiology:
- name: CTNNB1 Exon 3 Activating Mutation
  description: >-
    The sporadic arm. An activating point mutation in CTNNB1 exon 3 removes the
    serine and threonine residues that GSK3-beta and casein kinase 1 phosphorylate,
    so beta-catenin is never marked for destruction. Three codons account for
    almost all of it: T41A, S45F and S45P.
  biological_scale: MOLECULAR
  subtypes:
  - Sporadic
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The point mutations are predominantly T41A (55%), S45F (35%), and S45P (10%).'
    explanation: Gives the codon distribution that defines this arm.
  downstream:
  - target: Failure of Cytoplasmic beta-catenin Degradation
    causal_link_type: DIRECT
    description: Loss of the phosphorylation substrate disables destruction of beta-catenin from
      the substrate side.
    evidence:
    - reference: PMID:35670122
      reference_title: Evolving strategies for management of desmoid tumor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In 85%–90% of sporadic cases, DTs harbor somatic mutations in CTNNB1, the gene
        that encodes for β‐catenin, leading to its accumulation.'
      explanation: States the mutation-to-accumulation step for the sporadic arm.
- name: Germline APC Loss of Function
  description: >-
    The familial adenomatous polyposis arm. Germline APC mutation removes a
    structural component of the complex that presents beta-catenin for
    phosphorylation, disabling the same machinery from the scaffold side. The two
    lesions are mutually exclusive, which gives the genotype diagnostic value: a
    CTNNB1 mutation rules out FAP and an APC mutation rules out sporadic disease.
  biological_scale: MOLECULAR
  subtypes:
  - FAP-associated
  genes:
  - preferred_term: APC
    term:
      id: hgnc:583
      label: APC
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Because mutations in these two genes are mutually exclusive, the finding of CTNNB1
      mutation rules out FAP, and APC mutation rules out sporadic DT.'
    explanation: States the mutual exclusivity that separates this arm from the sporadic one and
      gives it diagnostic use.
  downstream:
  - target: Failure of Cytoplasmic beta-catenin Degradation
    causal_link_type: DIRECT
    description: Loss of the scaffold disables destruction of beta-catenin from the complex side,
      converging on the same defect as the sporadic arm.
    evidence:
    - reference: PMID:35670122
      reference_title: Evolving strategies for management of desmoid tumor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In patients with FAP, DTs harbor germline mutations in the APC gene, which
        encodes for a protein regulating β‐catenin levels.'
      explanation: Identifies APC as a regulator of beta-catenin levels, which is how this arm
        reaches the shared node.
- name: Constitutive Activation of the Wnt-beta-catenin Axis
  description: >-
    The shared consequence of the two lesions above, stated as a pathway state
    rather than as a genetic event. Both arms produce persistent canonical Wnt
    signalling in a cell that is receiving no Wnt ligand.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  - preferred_term: APC
    term:
      id: hgnc:583
      label: APC
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most DTs are sporadic, harboring somatic mutations in the gene that encodes
      for β-catenin, whereas DTs occurring in patients with familial adenomatous polyposis
      have germline mutations in the APC gene, which encodes for a protein regulator of
      β-catenin.
    explanation: Names both genetic routes into this node and their relationship to one
      another.
  - reference: PMID:24325833
    reference_title: 'Sporadic desmoid-type fibromatosis: a stepwise approach to a non-metastasising neoplasm--a
      position paper from the Italian and the French Sarcoma Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pathogenesis of DF is not completely understood even if a high prevalence
      (∼85%) of CTNNB1 mutations discovered in sporadic DF underlies the importance of
      the Wnt/β-catenin pathway.
    explanation: Quantifies CTNNB1 mutation prevalence in sporadic disease and states the
      pathway it implicates, while being explicit that the pathogenesis is not fully
      understood.
  downstream:
  - target: Failure of Cytoplasmic beta-catenin Degradation
    causal_link_type: DIRECT
    description: Loss of either the phosphorylation substrate or the scaffold disables the
      complex that would otherwise destroy cytoplasmic beta-catenin.
    evidence:
    - reference: PMID:31189665
      reference_title: 'Destruction complex dynamics: Wnt/β-catenin signaling alters Axin-GSK3β interactions
        in vivo.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The central regulator of the Wnt/β-catenin pathway is the Axin/APC/GSK3β destruction
        complex (DC), which, under unstimulated conditions, targets cytoplasmic β-catenin
        for degradation.
      explanation: Identifies the complex whose failure this edge describes and names APC and
        GSK3-beta as its components, which is why mutations in either arm converge here. This is
        a Drosophila study, so it is cited for the canonical complex biology rather than for the
        human tumour; the human co-citation below carries that.
    - reference: PMID:35670122
      reference_title: Evolving strategies for management of desmoid tumor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In patients with FAP, DTs harbor germline mutations in the APC gene, which
        encodes for a protein regulating β‐catenin levels.'
      explanation: Human evidence that APC regulates beta-catenin levels, which is the arm of
        the convergence that the fly study does not cover.
- name: Failure of Cytoplasmic beta-catenin Degradation
  biological_scale: MOLECULAR
  description: >-
    Unphosphorylated beta-catenin escapes ubiquitin-mediated destruction, accumulates
    in the cytoplasm and translocates to the nucleus, where it partners with TCF/LEF
    transcription factors. Nuclear beta-catenin is the diagnostic hallmark of the
    tumour on immunohistochemistry, which makes this node directly observable in
    routine practice rather than inferred.
  cellular_components:
  - preferred_term: beta-catenin destruction complex
    modifier: DECREASED
    term:
      id: GO:0030877
      label: beta-catenin destruction complex
  evidence:
  - reference: PMID:15375433
    reference_title: Nuclear beta-catenin in mesenchymal tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-level nuclear beta-catenin staining was seen in a very limited subset
    explanation: The tissue-microarray result across 549 bone and soft tissue tumours, showing
      that high-level nuclear beta-catenin marks only a narrow set of entities.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In 85%–90% of sporadic cases, DTs harbor somatic mutations in CTNNB1, the gene
      that encodes for β‐catenin, leading to its accumulation.'
    explanation: Human evidence that the CTNNB1 mutation leads to beta-catenin accumulation,
      which is the step this node asserts.
  - reference: PMID:33788979
    reference_title: A comparison of the usefulness of nuclear beta-catenin in the diagnosis of desmoid-type
      fibromatosis among commonly used anti-beta-catenin antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A hallmark of the tumor is nuclear positivity for beta-catenin in immunohistochemistry
      due mostly to CTNNB1 mutations.
    explanation: Confirms that nuclear beta-catenin is observed in the tumour itself and ties
      it back to the CTNNB1 lesion upstream.
  downstream:
  - target: Clonal Myofibroblast Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Nuclear beta-catenin acting through TCF/LEF drives the proliferative
      programme of the tumour cell.
    evidence:
    - reference: PMID:24325833
      reference_title: 'Sporadic desmoid-type fibromatosis: a stepwise approach to a non-metastasising neoplasm--a
        position paper from the Italian and the French Sarcoma Group.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Desmoid-type fibromatosis (DF) is a rare locally aggressive monoclonal proliferation
        of myofibroblasts lacking metastatic capacity.
      explanation: Names the proliferating cell that this edge terminates in and the clonal
        character of its expansion.
- name: Clonal Myofibroblast Proliferation
  biological_scale: CELLULAR
  description: >-
    The tumour cell is a myofibroblast, and the lesion is a monoclonal proliferation
    of them rather than a reactive scar. That distinction is what moved this entity
    from "reactive fibrous overgrowth" to neoplasm, and it is why the lesion behaves
    autonomously rather than resolving when the presumed trauma heals.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:32004793
    reference_title: 'The management of desmoid tumours: A joint global consensus-based guideline approach
      for adult and paediatric patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Desmoid tumor (DT; other synonymously used terms: Desmoid-type fibromatosis,
      aggressive fibromatosis) is a rare and locally aggressive monoclonal, fibroblastic
      proliferation characterised by a variable and often unpredictable clinical course.'
    explanation: States the monoclonal fibroblastic character of the proliferation in the
      global consensus definition.
  downstream:
  - target: Unpredictable Natural History with Spontaneous Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The proliferating population does not expand monotonically. In a substantial
      minority it arrests or regresses outright, and what determines which course a given
      tumour takes is not known.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The clinical course of the disease varies, and data suggest that an initial tumor
        growth phase is followed by a long period of growth arrest and even regression.
      explanation: States that the proliferative phase is characteristically followed by arrest
        or regression, which is the alternative outcome this edge records.
  - target: Infiltrative Growth without Metastatic Capacity
    causal_link_type: DIRECT
    description: The expanding myofibroblast population lays down a collagen-rich matrix and
      advances along fascial planes into adjacent tissue.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Depending on their location, DT tend to infiltrate adjacent organs, extend along
        fascial planes, compress blood vessels and nerves, erode bones, or obstruct organs
        such as the bowel.
      explanation: Describes the mode of local advance that this edge asserts.
- name: Notch Pathway Dependence
  description: >-
    A parallel dependency rather than a step in the Wnt chain, and included because
    it is the only target for which a randomised trial has produced an approved
    drug. Gamma-secretase cleaves the Notch receptor to release its intracellular
    domain; blocking that cleavage produces objective responses in this tumour. The
    node is therefore inferred largely backwards, from therapeutic response, and is
    graded accordingly.
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24076266
    reference_title: 'Targeting notch signaling pathway in cancer: clinical development advances and challenges.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Antitumor activity by GSIs and mAbs administered as single agent in early phases
      of clinical trials has been observed in advanced or metastatic thyroid cancer, non-small
      cell lung cancer, intracranial tumors, sarcoma or desmoid tumors, colorectal cancer
      with neuroendocrine features, melanoma and ovarian cancer.
    explanation: Records antitumour activity of Notch-directed agents in desmoid tumours,
      which is the observation this node rests on.
  downstream:
  - target: Clonal Myofibroblast Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Notch signalling sustains the proliferating myofibroblast population; the
      intermediates between receptor cleavage and proliferation in this tumour are not
      established.
    evidence:
    - reference: PMID:36884323
      reference_title: Nirogacestat, a γ-Secretase Inhibitor for Desmoid Tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The percentage of patients who had an objective response was significantly higher
        with nirogacestat than with placebo (41% vs. 8%; P<0.001), with a median time to response
        of 5.6 months and 11.1 months, respectively; the percentage of patients with a complete
        response was 7% and 0%, respectively.
      explanation: Tumour shrinkage on gamma-secretase inhibition is the evidence that the
        proliferating population depends on this pathway, and it is indirect evidence.
- name: Infiltrative Growth without Metastatic Capacity
  biological_scale: TISSUE
  description: >-
    The defining behaviour, and an unusual combination. The lesion invades muscle,
    fascia, nerve and vessel and erodes bone, yet it has no metastatic potential at
    all. Morbidity is therefore entirely local and entirely a function of what the
    tumour happens to sit next to.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:30575484
    reference_title: Sorafenib for Advanced and Refractory Desmoid Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Desmoid tumors (also referred to as aggressive fibromatosis) are connective tissue
      neoplasms that can arise in any anatomical location and infiltrate the mesentery, neurovascular
      structures, and visceral organs.
    explanation: States the infiltrative behaviour and the structures involved.
  - reference: PMID:35217286
    reference_title: Evaluation of diagnostic algorithm and therapeutic interventions for intra-abdominal
      desmoid tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite the lack of metastasizing potential, the course can be unpredictable.
    explanation: States the absence of metastatic capacity, which is the second half of this
      node.
  downstream:
  - target: Local Tissue and Organ Compromise
    causal_link_type: DIRECT
    description: Compression and invasion of adjacent structures produce the pain, functional
      loss and obstruction that constitute the clinical disease.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Muscle, nerve, and vessel involvement may cause debilitating symptoms, including
        pain, restricted mobility, or deformity [2].
      explanation: Names the symptoms produced by involvement of adjacent structures.
- name: Local Tissue and Organ Compromise
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Because the tumour never spreads, everything that harms
    the patient follows from local mass effect and invasion: chronic pain, loss of
    mobility, and, for mesenteric tumours, bowel obstruction that can be fatal.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients can experience compromised QOL due to diagnostic challenges and the high
      clinical burden of DT, including severe pain, impaired physical function and mobility,
      and high recurrence rates.
    explanation: Summarises the clinical burden that constitutes this endpoint.
  downstream:
  - target: Chronic Pain
    causal_link_type: DIRECT
    description: Invasion and compression of muscle, nerve and vessel produce the chronic pain
      that dominates the patient experience.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Muscle, nerve, and vessel involvement may cause debilitating symptoms, including
        pain, restricted mobility, or deformity [2].
      explanation: Attributes pain directly to involvement of the adjacent structures.
  - target: Limitation of Joint Mobility
    causal_link_type: DIRECT
    description: Infiltration of muscle and periarticular tissue restricts movement.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Muscle, nerve, and vessel involvement may cause debilitating symptoms, including
        pain, restricted mobility, or deformity [2].
      explanation: Attributes restricted mobility to the same tissue involvement.
  - target: Intestinal Obstruction
    causal_link_type: DIRECT
    description: A mesenteric or intra-abdominal tumour obstructs the bowel, which is how a
      non-metastasising tumour becomes lethal.
    evidence:
    - reference: PMID:37436594
      reference_title: 'Desmoid Tumors: A Comprehensive Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Depending on their location, DT tend to infiltrate adjacent organs, extend along
        fascial planes, compress blood vessels and nerves, erode bones, or obstruct organs such
        as the bowel.
      explanation: Names bowel obstruction as a direct consequence of tumour location.
- name: Unpredictable Natural History with Spontaneous Regression
  description: >-
    A property of the disease rather than a step in its causal chain, but the single
    most consequential fact about it. A substantial fraction of tumours stabilise or
    regress with no treatment at all. This is the observation that displaced surgery
    as first-line management, and it means any uncontrolled treatment series in this
    disease will overstate benefit.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'According to estimates, approximately 10–28% of DT will resolve spontaneously
      without treatment (22% for extra-abdominal tumors to 28% for abdominal tumors)'
    explanation: The fullest quantitative breakdown of natural history available in the cached
      sources, and the basis for the figures recorded in the progression section.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A large, prospective, observational study (ClinicalTrials.gov identifier
      NCT02547831) of patients with sporadic DT who were managed with active surveillance (MRI
      or CT every 3–6 months) recently reported a treatment‐free survival rate of 65.9% at 3
      years, with 55% of patients experiencing spontaneous regression either initially or after
      progression.'
    explanation: Prospective rather than retrospective evidence, and the strongest single figure
      available - 55% regression under active surveillance.
  - reference: PMID:27542640
    reference_title: Management of Desmoids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: this has begun to evolve into a movement of watchful waiting as observational
      studies have shown long-term stability of many tumors without treatment and even spontaneous
      regression in 5% to 10% of cases
    explanation: The earlier and more conservative estimate, retained to show the range across
      sources rather than presenting only the highest figure.
  - reference: PMID:32004793
    reference_title: 'The management of desmoid tumours: A joint global consensus-based guideline approach
      for adult and paediatric patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Previously surgery was the standard primary treatment modality; however, in recent
      years a paradigm shift towards a more conservative management has been introduced
    explanation: Records the resulting change in standard of care at consensus level.
phenotypes:
- category: Neoplastic
  name: Desmoid Tumor
  description: >-
    The defining lesion: a firm, infiltrative soft tissue mass arising from muscle,
    fascia or aponeurosis, classified by site as intra-abdominal, abdominal wall or
    extra-abdominal.
  phenotype_term:
    preferred_term: Desmoid tumor
    term:
      id: HP:6001034
      label: Desmoid tumor
  evidence:
  - reference: PMID:35217286
    reference_title: Evaluation of diagnostic algorithm and therapeutic interventions for intra-abdominal
      desmoid tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They can emerge from any connective tissue including muscle, fascia and aponeurosis
      and are therefore classified, according to location, as intra-abdominal, of the abdominal
      wall and extra-abdominal.
    explanation: Describes the tissue of origin and the anatomical classification of the
      lesion.
- category: Neoplastic
  name: Gastrointestinal Desmoid Tumor
  subtype: FAP-associated
  description: >-
    The intra-abdominal and mesenteric form, which predominates in familial
    adenomatous polyposis and carries the highest local recurrence rates.
  phenotype_term:
    preferred_term: Gastrointestinal desmoid tumor
    term:
      id: HP:0100245
      label: Gastrointestinal desmoid tumor
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Local recurrence rates of intra-abdominal tumors in patients with FAP are higher
      than those for extra-abdominal tumors and reported to be 57–86% [2].
    explanation: Quantifies the higher local recurrence rate of the intra-abdominal
      FAP-associated tumours, which is what distinguishes this form.

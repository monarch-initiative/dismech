    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Frequently mentioned symptoms are pain, limited function and mobility, fatigue,
      muscle weakness, and swelling around the tumor.
    explanation: Names limited function and mobility among the frequently reported symptoms.
- category: Gastrointestinal
  name: Intestinal Obstruction
  subtype: FAP-associated
  description: >-
    Obstruction of the bowel by a mesenteric or intra-abdominal tumour. This is the
    mechanism by which a non-metastasising tumour becomes lethal, and it is why
    desmoid disease is the second cause of death in familial adenomatous polyposis.
  phenotype_term:
    preferred_term: Intestinal obstruction
    term:
      id: HP:0005214
      label: Intestinal obstruction
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Depending on their location, DT tend to infiltrate adjacent organs, extend along
      fascial planes, compress blood vessels and nerves, erode bones, or obstruct organs such
      as the bowel.
    explanation: Names bowel obstruction as a direct consequence of tumour location.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.3
  rate_high: 0.5
  notes: Three to five cases per million person-years; approximately 1000-1500 new cases
    diagnosed annually in the United States.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with an estimated annual incidence of three to five cases per million worldwide.
    explanation: Gives the annual incidence per million and the share of soft tissue neoplasms.
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The low incidence of DT (estimated 3-5 cases per million person-years) limits
      disease awareness.
    explanation: Independent statement of the same incidence figure.
progression:
- phase: Diagnosis
  notes: >-
    Diagnosis is frequently delayed. Because the tumour resembles other
    myofibroblastic lesions and is rare, 30 to 40% of cases are misdiagnosed, and
    in one series the interval from symptom onset to diagnosis exceeded a year for
    more than half of patients. Most cases present between 30 and 40 years of age.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 30–40% of DT cases are reported to be misdiagnosed following
    explanation: Quantifies the misdiagnosis rate that defines this phase.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In one study, the time from patient‐reported symptom onset to DT diagnosis exceeded
      one year for 54% of patients.'
    explanation: Quantifies the diagnostic delay.
- phase: Growth phase
  notes: >-
    An initial period of tumour growth, during which pain and functional loss
    develop. Shorter progression-free survival is associated with age under 37,
    tumour size over 7 cm, and extra-abdominal location.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Factors significantly associated with shorter progression‐free survival (PFS)
      include age (younger than 37 years), tumor size (>7 cm), and tumor location
      (extra‐abdominal).'
    explanation: Gives the factors that predict a faster course through this phase.
- phase: Stabilisation or regression
  notes: >-
    The phase that makes this disease unusual. Roughly half of tumours remain
    stable after diagnosis, 10 to 28% resolve outright without treatment, 30%
    cycle between progression and resolution, and only about 10% progress rapidly.
    Under prospective active surveillance, 55% of patients experienced spontaneous
    regression and treatment-free survival was 65.9% at three years.
  evidence:
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'According to estimates, approximately 10–28% of DT will resolve spontaneously
      without treatment (22% for extra-abdominal tumors to 28% for abdominal tumors)'
    explanation: Gives the spontaneous resolution range that characterises this phase.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A large, prospective, observational study (ClinicalTrials.gov identifier
      NCT02547831) of patients with sporadic DT who were managed with active surveillance (MRI
      or CT every 3–6 months) recently reported a treatment‐free survival rate of 65.9% at 3
      years, with 55% of patients experiencing spontaneous regression either initially or after
      progression.'
    explanation: Prospective evidence for the size of this phase, and the basis for active
      surveillance as first-line management.
- phase: Post-surgical recurrence
  notes: >-
    When surgery is performed, recurrence is common. Postsurgical local recurrence
    at five to ten years has been reported between 30 and 77%, and higher again in
    FAP-associated intra-abdominal disease at 57 to 86%.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'However, postsurgical local recurrence rates at 5–10 years were reported to be in
      the range from 30% to 77%.'
    explanation: Gives the post-resection recurrence range that this phase records.
  - reference: PMID:37436594
    reference_title: 'Desmoid Tumors: A Comprehensive Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Local recurrence rates of intra-abdominal tumors in patients with FAP are higher
      than those for extra-abdominal tumors and reported to be 57–86% [2].
    explanation: Gives the higher recurrence rate in the FAP-associated intra-abdominal form.
genetic:
- name: CTNNB1
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating Exon 3 Mutation in Sporadic Disease
  notes: >-
    Present in approximately 85% of sporadic tumours. The three recurrent codons are
    T41A, S45F and S45P. The specific mutation carries prognostic weight rather than
    being merely diagnostic: S45F predicts markedly worse recurrence-free survival
    after resection than T41A or wild type.
  evidence:
  - reference: PMID:24325833
    reference_title: 'Sporadic desmoid-type fibromatosis: a stepwise approach to a non-metastasising neoplasm--a
      position paper from the Italian and the French Sarcoma Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pathogenesis of DF is not completely understood even if a high prevalence
      (∼85%) of CTNNB1 mutations discovered in sporadic DF underlies the importance of the
      Wnt/β-catenin pathway.
    explanation: Gives the mutation prevalence in sporadic disease.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The point mutations are predominantly T41A (55%), S45F (35%), and S45P (10%).'
    explanation: Gives the codon distribution quoted in this block's notes, which was previously
      asserted without evidence.
  - reference: PMID:23913621
    reference_title: 'CTNNB1 45F mutation is a molecular prognosticator of increased postoperative primary
      desmoid tumor recurrence: an independent, multicenter validation study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated 3-year and 5-year RFS rates were 0.49 and 0.45, respectively, for
      patients who had tumors with the S45F mutation; 0.91 and 0.91, respectively, for patients
      who had wild-type tumors; and 0.70 and 0.66, respectively, for all others (P< .001).
    explanation: Quantifies the recurrence-free survival difference between S45F, wild type and
      other mutations after resection.
  - reference: PMID:33397129
    reference_title: Prognostic significance of CTNNB1 mutation in recurrence of sporadic desmoid tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: S45F-mutated DTs were more likely to recur compared with wild type, T41A and other
      mutated DTs.
    explanation: An eight-study meta-analysis confirming the S45F recurrence signal, which is
      why it is recorded here rather than as a single-series finding.
- name: APC
  gene_term:
    preferred_term: APC
    term:
      id: hgnc:583
      label: APC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Germline Loss in FAP-associated Disease
  notes: >-
    APC is a structural component of the destruction complex, so germline APC loss
    produces the same failure of beta-catenin degradation that CTNNB1 exon 3
    mutation produces from the other side. In this disease APC acts through
    beta-catenin, not through the polyposis phenotype.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most DTs are sporadic, harboring somatic mutations in the gene that encodes for
      β-catenin, whereas DTs occurring in patients with familial adenomatous polyposis have
      germline mutations in the APC gene, which encodes for a protein regulator of β-catenin.
    explanation: States the germline APC route and identifies APC as a regulator of
      beta-catenin, which is how the two arms converge.
environmental:
- name: Antecedent Surgical Trauma
  presence: PRESENT
  description: >-
    Prior surgery at the site is a recognised risk factor. This matters clinically
    in an unusual way: because operating can precipitate disease, and because the
    tumour often regresses without treatment, surgery has lost its place as
    first-line therapy.
  influences_mechanisms:
  - target: Clonal Myofibroblast Proliferation
    description: Tissue injury precedes tumour development at the operated site, though the
      link between wound healing and clonal outgrowth is an association rather than an
      established mechanism.
    evidence:
    - reference: PMID:35217286
      reference_title: Evaluation of diagnostic algorithm and therapeutic interventions for intra-abdominal
        desmoid tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Desmoid tumors (DT) arise either sporadically or in association with FAP (familial
        adenomatous polyposis), although certain risk factors have also been identified, including
        pregnancy and antecedent surgical trauma.
      explanation: Identifies antecedent surgical trauma as a risk factor, which is the
        association this link records; the source does not establish the intervening mechanism.
  evidence:
  - reference: PMID:35217286
    reference_title: Evaluation of diagnostic algorithm and therapeutic interventions for intra-abdominal
      desmoid tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Desmoid tumors (DT) arise either sporadically or in association with FAP (familial
      adenomatous polyposis), although certain risk factors have also been identified, including
      pregnancy and antecedent surgical trauma.
    explanation: Names antecedent surgical trauma as an identified risk factor.
- name: Pregnancy and Estrogen Exposure
  presence: PRESENT
  description: >-
    Roughly 70% of patients are women, risk rises during and after pregnancy, and
    women of childbearing age have faster tumour growth than men or
    postmenopausal women. Desmoid tumours express estrogen receptors. The
    inference has never converted into a treatment, though: antiestrogen response
    rates of 48 to 51% come from case series with no active-surveillance
    comparator, and guidelines no longer routinely recommend hormone therapy.
  influences_mechanisms:
  - target: Clonal Myofibroblast Proliferation
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Estrogen exposure is associated with faster growth of the proliferating
      population; the receptor is expressed in the tumour, but the intervening signalling is not
      established and the therapeutic test of the hypothesis was uncontrolled.
    evidence:
    - reference: PMID:35670122
      reference_title: Evolving strategies for management of desmoid tumor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Evidence includes estrogen receptor expression in DTs and the heightened DT risk
        during and shortly after pregnancy and among women taking estrogen‐containing oral
        contraceptives. Women of childbearing age appear to have greater DT growth rates than
        men or postmenopausal women'
      explanation: Assembles the receptor expression, the pregnancy and contraceptive risk, and
        the growth-rate difference that together support this link.
    - reference: PMID:35670122
      reference_title: Evolving strategies for management of desmoid tumor.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: 'although the lack of an active surveillance comparator makes this finding
        difficult to interpret. Therefore, treatment guidelines no longer routinely recommend
        hormone therapies.'
      explanation: The therapeutic test of this link was uncontrolled and guidelines abandoned
        it, which argues against reading the association as an actionable mechanism.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'DTs occur predominantly in women (approximately 70% of cases), and the risk of DT
      development or progression appears to increase during and after pregnancy.'
    explanation: Gives the sex ratio and states the pregnancy-associated risk directly.
  - reference: PMID:35217286
    reference_title: Evaluation of diagnostic algorithm and therapeutic interventions for intra-abdominal
      desmoid tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Desmoid tumors (DT) arise either sporadically or in association with FAP (familial
      adenomatous polyposis), although certain risk factors have also been identified, including
      pregnancy and antecedent surgical trauma.
    explanation: Names pregnancy as an identified risk factor.
diagnosis:
- name: Nuclear beta-catenin immunohistochemistry
  presence: PRESENT
  description: >-
    Nuclear beta-catenin staining is the diagnostic hallmark. Its performance is
    strongly antibody-dependent, which is a practical trap: sensitivity ranges from
    54% to 96% and specificity from 98% down to 62% across three commonly used
    clones, so a negative result with a specific antibody does not exclude the
    diagnosis.
  evidence:
  - reference: PMID:33788979
    reference_title: A comparison of the usefulness of nuclear beta-catenin in the diagnosis of desmoid-type
      fibromatosis among commonly used anti-beta-catenin antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The sensitivity and specificity of nuclear beta-catenin for the diagnosis of DF
      were different among antibodies; 54% and 98% in clone beta-catenin 1, 85% and 84% in
      17C2, and 96% and 62% in 14.'
    explanation: Quantifies the antibody dependence that this entry flags as a practical
      pitfall.
- name: Magnetic resonance imaging
  presence: PRESENT
  description: >-
    MRI is the preferred imaging modality for most anatomical sites, both for
    delineating the infiltrative margin and for serial assessment during active
    surveillance.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Magnetic resonance imaging is preferred for most anatomic locations.
    explanation: States MRI as the preferred modality.
treatments:
- name: Active Surveillance
  therapeutic_modality: BEHAVIORAL
  description: >-
    First-line management for most patients. Because spontaneous regression occurs
    and surgery carries both recurrence risk and avoidable morbidity, initial
    observation with pain management has displaced immediate resection. This is a
    monitoring strategy rather than a therapeutic action, so it is deliberately not
    linked to a pathophysiology node.
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Consequently, active surveillance in conjunction with pain management is now
      recommended for most patients.
    explanation: States active surveillance with pain management as the recommendation for most
      patients.
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surgery, once the standard of care for initial treatment of DT, is associated with
      a significant risk of recurrence as well as avoidable morbidity because spontaneous
      regressions are known to occur without treatment.
    explanation: Gives the reasoning behind the shift away from surgery, which is what makes
      surveillance a positive choice rather than a default.
- name: Nirogacestat
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An oral gamma-secretase inhibitor, and the first agent to show benefit for this
    disease in a placebo-controlled phase 3 trial. It blocks the proteolytic
    cleavage that releases the Notch intracellular domain. Diarrhoea is near
    universal and ovarian toxicity is a specific concern in women of childbearing
    potential.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nirogacestat
      term:
        id: CHEBI:229217
        label: nirogacestat
    - preferred_term: gamma-secretase inhibitor
      term:
        id: NCIT:C200529
        label: Gamma-Secretase Inhibitor
  target_mechanisms:
  - target: Notch Pathway Dependence
    treatment_effect: INHIBITS
    description: Blocks gamma-secretase cleavage of the Notch receptor, which is the step this
      node depends on.
    evidence:
    - reference: PMID:36884323
      reference_title: Nirogacestat, a γ-Secretase Inhibitor for Desmoid Tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients were assigned in a 1:1 ratio to receive the oral γ-secretase inhibitor
        nirogacestat (150 mg) or placebo twice daily.
      explanation: Identifies the molecular target of the agent as gamma-secretase.
  evidence:
  - reference: PMID:36884323
    reference_title: Nirogacestat, a γ-Secretase Inhibitor for Desmoid Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nirogacestat had a significant progression-free survival benefit over placebo (hazard
      ratio for disease progression or death, 0.29; 95% confidence interval, 0.15 to 0.55; P<0.001);
      the likelihood of being event-free at 2 years was 76% with nirogacestat and 44% with
      placebo.
    explanation: Gives the randomised progression-free survival benefit, which is the primary
      endpoint result.
  - reference: PMID:36884323
    reference_title: Nirogacestat, a γ-Secretase Inhibitor for Desmoid Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Frequent adverse events with nirogacestat included diarrhea (in 84% of the patients),
      nausea (in 54%), fatigue (in 51%), hypophosphatemia (in 42%), and maculopapular rash
      (in 32%); 95% of adverse events were of grade 1 or 2.
    explanation: Records the toxicity profile, which is part of why this is not automatically
      preferred over surveillance.
- name: Sorafenib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A multi-targeted tyrosine kinase inhibitor with randomised evidence of benefit
    in progressive or symptomatic disease. Note that 36% of placebo patients were
    also progression-free at two years, which is the spontaneous-stability effect
    made visible by a controlled design.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sorafenib
      term:
        id: CHEBI:50924
        label: sorafenib
    - preferred_term: tyrosine kinase inhibitor
      term:
        id: NCIT:C1967
        label: Tyrosine Kinase Inhibitor
  target_mechanisms:
  - target: Clonal Myofibroblast Proliferation
    treatment_effect: INHIBITS
    description: Kinase inhibition slows growth of the proliferating tumour population, though
      the specific kinase dependency in this tumour is not established.
    evidence:
    - reference: PMID:30575484
      reference_title: Sorafenib for Advanced and Refractory Desmoid Tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Among patients with progressive, refractory, or symptomatic desmoid tumors, sorafenib
        significantly prolonged progression-free survival and induced durable responses.
      explanation: Establishes that the agent controls tumour growth, which is the effect this
        link asserts.
  evidence:
  - reference: PMID:30575484
    reference_title: Sorafenib for Advanced and Refractory Desmoid Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the 2-year progression-free survival rate was 81% (95% confidence interval [CI],
      69 to 96) in the sorafenib group and 36% (95% CI, 22 to 57) in the placebo group (hazard
      ratio for progression or death, 0.13; 95% CI, 0.05 to 0.31; P<0.001)
    explanation: Gives both the treatment effect and the placebo-arm stability rate that this
      description draws attention to.
- name: Methotrexate and Vinblastine
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Low-dose chemotherapy, used mainly in extra-abdominal disease. The evidence is
    uncontrolled: response rates around 36% with clinical benefit up to 85%, but no
    randomised comparison against no treatment, which given the natural history of
    this disease is a serious limitation.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: vinblastine
      term:
        id: CHEBI:27375
        label: vincaleukoblastine
  target_mechanisms:
  - target: Clonal Myofibroblast Proliferation
    treatment_effect: INHIBITS
    description: Cytotoxic suppression of the proliferating myofibroblast population.
    evidence:
    - reference: PMID:31845730
      reference_title: 'Efficacy of low-dose chemotherapy with methotrexate and vinblastine for patients with
        extra-abdominal desmoid-type fibromatosis: a systematic review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'According to Response Evaluation Criteria in Solid Tumors criteria, the mean
        response rate (complete remission or partial response) was 36% (11-57%).'
      explanation: Gives the pooled objective response rate attributable to this regimen.
  evidence:
  - reference: PMID:31845730
    reference_title: 'Efficacy of low-dose chemotherapy with methotrexate and vinblastine for patients with
      extra-abdominal desmoid-type fibromatosis: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were three prospective case series but no randomized controlled trials among
      the nine studies. There was no case-control report (vs. no treatment).
    explanation: States the absence of controlled comparison, which is the limitation this entry
      records alongside the response rate.
- name: Doxorubicin-based Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Anthracycline regimens, including liposomal doxorubicin, reserved for
    progressive disease. As with methotrexate and vinblastine, the supporting
    evidence contains no randomised controlled trials.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxorubicin
      term:
        id: CHEBI:28748
        label: doxorubicin
  target_mechanisms:
  - target: Clonal Myofibroblast Proliferation
    treatment_effect: INHIBITS
    description: Cytotoxic suppression of the proliferating myofibroblast population.
    evidence:
    - reference: PMID:32700733
      reference_title: 'Effectiveness of doxorubicin-based and liposomal doxorubicin chemotherapies for patients
        with extra-abdominal desmoid-type fibromatosis: a systematic review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the response rates of doxorubicin-based regimens and liposomal doxorubicin were
        44% (28.6-54) and 33.3% (0-75) on average, respectively
      explanation: Gives the pooled response rates for both anthracycline formulations.
  evidence:
  - reference: PMID:32700733
    reference_title: 'Effectiveness of doxorubicin-based and liposomal doxorubicin chemotherapies for patients
      with extra-abdominal desmoid-type fibromatosis: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were no randomized controlled trials.
    explanation: States the evidence limitation directly.
- name: Surgical Resection
  therapeutic_modality: SURGERY
  description: >-
    No longer first-line. When used, the aim is microscopically negative margins,
    but not at the cost of organ or limb function, and recurrence after resection is
    approximately 20%. In FAP-associated intra-abdominal disease, recurrence rates
    are higher still.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Infiltrative Growth without Metastatic Capacity
    treatment_effect: INHIBITS
    description: Removes the infiltrating lesion, which is effective locally but does not
      address the underlying signalling defect, hence the recurrence rate.
    evidence:
    - reference: PMID:27542640
      reference_title: Management of Desmoids.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: When surgical therapy is used, wide local excision with microscopically negative
        margins is the goal of resection but should not be at the expense of organ or limb
        function.
      explanation: States the surgical goal and the functional constraint on achieving it.
  evidence:
  - reference: PMID:27542640
    reference_title: Management of Desmoids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recurrence rates after surgical resection are approximately 20%; a variety of
      multimodal therapies are useful in controlling disease.
    explanation: Quantifies post-resection recurrence, which is the reason surgery was displaced
      as first-line management.
inheritance:
- name: Autosomal dominant (FAP-associated subset)
  description: >-
    The sporadic form is not heritable; the driver is a somatic CTNNB1 mutation. The
    FAP-associated subset follows the autosomal dominant inheritance of the
    underlying germline APC mutation, so what is inherited is the polyposis
    predisposition rather than the desmoid tumour itself.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:35670122
    reference_title: Evolving strategies for management of desmoid tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most DTs are sporadic, harboring somatic mutations in the gene that encodes for
      β-catenin, whereas DTs occurring in patients with familial adenomatous polyposis have
      germline mutations in the APC gene, which encodes for a protein regulator of β-catenin.
    explanation: Distinguishes the somatic sporadic form from the germline FAP-associated form,
      which is what determines whether inheritance applies.

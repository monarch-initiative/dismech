disease_term:
  preferred_term: desmoid tumor
  term:
    id: MONDO:0007608
    label: desmoid tumor
notes: >-
  Scope. This entry describes desmoid tumour as a single disease with two etiologic
  arms that converge on one biochemical lesion. The Wnt/beta-catenin chain is well
  supported; the Notch node is not, and is marked HYPOTHETICAL because it is
  inferred backwards from the response to gamma-secretase inhibition rather than
  from direct pathway measurement in this tumour.

  Why the natural history is modelled as a node. Spontaneous regression and long
  stability without treatment are not incidental. They are the reason surgery lost
  its first-line role and the reason every uncontrolled treatment series here should
  be read sceptically. The sorafenib trial makes the point quantitatively: 36% of
  placebo patients were progression-free at two years. The two chemotherapy entries
  are recorded with their own evidence of having no randomised control, rather than
  with response rates alone.

  Ontology notes. HPO has an exact term for the lesion (HP:6001034 Desmoid tumor)
  and a separate term for the intra-abdominal form (HP:0100245 Gastrointestinal
  desmoid tumor); both are used rather than a generic soft tissue neoplasm parent.
  MAXO is not used in this repository, so treatments are bound to NCIT actions with
  CHEBI or NCIT therapeutic agents. No NCIT term for "watchful waiting" or "active
  surveillance" exists anywhere under NCIT:C25218, the root of this repository's
  TreatmentActionTerm enum, so Active Surveillance is deliberately left without a
  treatment_term rather than bound to a generic Observation Activity that would
  misrepresent it. Vinblastine has no CHEBI term, so
  NCIT:C930 is used for that agent alongside CHEBI for methotrexate.

  Known extension points: histopathology as a structured section; clinical_trials
  (the DeFi and Alliance A091105 trials behind the two randomised entries above);
  cryoablation and radiotherapy as locoregional options; the female predominance,
  for which no cleanly quotable ratio was found in the cached abstracts; and the
  hormonal-therapy history, which is now discouraged and would need its own
  refuting evidence rather than a bare mention.

  Provenance. Curated directly from PubMed rather than from a deep-research report:
  both configured research providers were unavailable at the time of curation
  (openscientist.io returned CloudFront 403 on POST and 401 on authenticated GET;
  the cyberian backend returned 500). Every snippet below was fetched with
  just fetch-reference and verified as an exact substring of the cached abstract.

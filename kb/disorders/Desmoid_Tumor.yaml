notes: >-
  Scope. This entry describes desmoid tumour as a single disease with two etiologic
  arms that converge on one biochemical lesion. The Wnt/beta-catenin chain is well
  supported; the Notch node is not, and is marked HYPOTHETICAL because it is
  inferred backwards from the response to gamma-secretase inhibition rather than
  from direct pathway measurement in this tumour.

  Why the natural history is modelled as a node. Spontaneous regression and long
  stability without treatment are not incidental. They are the reason surgery lost
  its first-line role and the reason every uncontrolled treatment series here should
  be read sceptically. The sorafenib trial makes the point quantitatively: 36% of
  placebo patients were progression-free at two years. The two chemotherapy entries
  are recorded with their own evidence of having no randomised control, rather than
  with response rates alone.

  Ontology notes. HPO has an exact term for the lesion (HP:6001034 Desmoid tumor)
  and a separate term for the intra-abdominal form (HP:0100245 Gastrointestinal
  desmoid tumor); both are used rather than a generic soft tissue neoplasm parent.
  MAXO is not used in this repository, so treatments are bound to NCIT actions with
  CHEBI or NCIT therapeutic agents. No NCIT term for "watchful waiting" or "active
  surveillance" exists anywhere under NCIT:C25218, the root of this repository's
  TreatmentActionTerm enum, so Active Surveillance is deliberately left without a
  treatment_term rather than bound to a generic Observation Activity that would
  misrepresent it.

  Corrections, review round 1. Two claims in this section were wrong and are
  retracted here rather than silently deleted. The first said vinblastine has no
  CHEBI term; CHEBI:27375 vincaleukoblastine is vinblastine, was already in the
  committed cache, and was already used for this agent elsewhere in the knowledge
  base. It is now bound. The second said no quotable female-predominance ratio was
  available; PMID:35670122, a reference this entry cites repeatedly, states that
  desmoid tumours "occur predominantly in women (approximately 70% of cases)". The
  sex skew and the estrogen axis are now modelled as an environmental factor with
  an explicit influences_mechanisms link. Both errors have the same cause: the two
  large cached reviews are full-text rather than abstract-only, and they were read
  selectively for the specific claims being written rather than end to end. They
  have since been read in full, which is also where the codon frequencies, the
  prospective active-surveillance figures, the misdiagnosis rate and the two NCT
  identifiers came from.

  Why there is no conforms_to link. The obvious candidate module,
  sustaining_proliferative_signaling, does not fit. Its central node is defined as
  flux through "the RAS-RAF-MEK-ERK (MAPK) pathway" and "the PI3K-AKT-mTOR
  pathway" and is bound to GO:0007265 Ras protein signal transduction and the ERK
  cascade. Desmoid tumour is driven by canonical Wnt/beta-catenin, a
  transcriptional pathway sharing none of that machinery, so a conforming node
  here would carry none of the module's expected biological processes. Declaring
  conformance on the strength of "both are proliferative" would make the
  conformance check mean less. invasion_and_metastasis is likewise inapplicable,
  and for a more interesting reason: this tumour invades but provably never
  metastasises, so it satisfies half of that module and refutes the other half.

  Known extension points: histopathology as a structured section (the cached
  reviews describe low-to-moderate cellularity, long fascicles of uniform cells,
  dense collagenous stroma, and an immunohistochemical panel of nuclear
  beta-catenin, SMA, vimentin and COX-2 positive with desmin, S100, CD34 and KIT
  negative); cryoablation, high-intensity focused ultrasound and radiotherapy as
  locoregional options; and pazopanib and vinorelbine, both with prospective data
  in the cached sources.

  Provenance. Curated directly from PubMed rather than from a deep-research report:
  both configured research providers were unavailable at the time of curation
  (openscientist.io returned CloudFront 403 on POST and 401 on authenticated GET;
  the cyberian backend returned 500). Every snippet below was fetched with
  just fetch-reference and verified as an exact substring of the cached abstract.

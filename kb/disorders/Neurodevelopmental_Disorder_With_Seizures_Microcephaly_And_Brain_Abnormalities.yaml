progression:
- phase: Onset and course
  age_range: Prenatal to early infancy onset; lifelong course
  notes: >-
    Microcephaly is often present at birth and progresses, seizures begin at a
    median of 2 months, and in one fetus growth restriction and microcephaly were
    seen during pregnancy, with calcifications confirmed after termination. Four of the 16 individuals in the founding cohort died in childhood, between
    3 years 9 months and 8 years of age. Serial MRI in two individuals showed
    progression of periventricular hyperintensities and white-matter loss.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four of the 16 individuals in this cohort deceased during childhood at
      ages ranging from 3 years and 9 months to 8 years.
    explanation: Childhood mortality in a quarter of the cohort.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis rests on finding biallelic PPFIBP1 loss-of-function variants;
    every reported individual was diagnosed by exome or genome sequencing after
    standard testing was unrevealing.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By exome and genome sequencing, we detected nine ultra-rare homozygous
      loss-of-function variants in 16 individuals from 12 unrelated families.
    explanation: All cases were identified by exome or genome sequencing.
- name: Head CT for Intracranial Calcification
  description: >-
    Head CT shows the bilateral periventricular and basal-ganglia calcifications
    that are the main imaging clue, and that MRI shows less reliably; MRI shows
    the leukoencephalopathy, ventriculomegaly and cortical malformations.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Head CT scan, performed in eight individuals, revealed bilateral intracranial
      calcifications (ICCs) in all of them (9/9).
    explanation: CT detected calcification in every individual scanned.
- name: Exclusion of Congenital Infection
  description: >-
    Because periventricular calcification with microcephaly suggests congenital
    CMV or other TORCH infection, infection screening precedes or accompanies
    genetic testing.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both affected siblings of family 5 and in individual 6-2, a screening
      for infections of the TORCH spectrum was performed with negative results and
      also the fetus was tested negative for CMV.
    explanation: TORCH and CMV testing were part of the work-up and were negative.
differential_diagnoses:
- name: Congenital cytomegalovirus infection
  description: >-
    Congenital CMV and other TORCH infections are the main acquired cause of
    microcephaly with periventricular calcifications and must be excluded; TORCH
    screening was negative where performed in the PPFIBP1 cohort.
  disease_term:
    preferred_term: fetal cytomegalovirus syndrome
    term:
      id: MONDO:0017409
      label: fetal cytomegalovirus syndrome
  distinguishing_features:
  - Negative CMV PCR or serology in the newborn.
  - Homozygous PPFIBP1 loss-of-function variants, usually with parental consanguinity
    and affected siblings.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both affected siblings of family 5 and in individual 6-2, a screening
      for infections of the TORCH spectrum was performed with negative results and
      also the fetus was tested negative for CMV.
    explanation: Infection was excluded in several affected individuals with calcifications.
- name: Aicardi-Goutieres syndrome
  description: >-
    Type I interferonopathies, Aicardi-Goutieres syndrome above all, cause
    congenital or infantile intracranial calcifications, white-matter disease and
    microcephaly that mimic congenital TORCH infection.
  disease_term:
    preferred_term: Aicardi-Goutieres syndrome
    term:
      id: MONDO:0018866
      label: Aicardi-Goutieres syndrome
  distinguishing_features:
  - Elevated CSF interferon-alpha and interferon signature, and CSF lymphocytosis.
  - Biallelic or dominant variants in TREX1, RNASEH2A/B/C, SAMHD1, ADAR, IFIH1 or
    related genes rather than PPFIBP1.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: genetic disorders such as interferonopathies represent important differential
      diagnoses for congenital ICCs and some conditions significantly overlap with
      the symptomatic spectrum of congenital TORCH-infections.
    explanation: The PPFIBP1 cohort paper names interferonopathies as the genetic
      mimics of its intracranial calcifications.
- name: MICPCH syndrome (CASK)
  description: >-
    CASK binds the liprin-alpha/liprin-beta1 complex, and CASK loss of function
    causes microcephaly with pontine and cerebellar hypoplasia with an
    overlapping picture of ID, progressive microcephaly, hearing and eye
    involvement, tone abnormalities and seizures.
  disease_term:
    preferred_term: MICPCH syndrome
    term:
      id: MONDO:0010417
      label: syndromic X-linked intellectual disability Najm type
  distinguishing_features:
  - X-linked rather than autosomal recessive inheritance, with affected females.
  - Pontine and cerebellar hypoplasia rather than periventricular calcifications.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because the phenotype is overlapping with the clinical signs found in
      this cohort, it seems possible that PPFIBP1 and CASK are involved in similar biological
      functions such as protein assembly in the presynaptic active zone.
    explanation: The authors draw the clinical comparison with CASK-related MICPCH.

      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All individuals except for individual 7 and individual 9 are offspring
      of consanguineous parents.
    explanation: Recurrent consanguinity across the cohort is consistent with recessive
      inheritance.
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, there were no homozygous LoF variants observed in gnomAD.
    explanation: Absence of homozygous null carriers in a population database supports
      recessive loss of function as the disease mechanism.

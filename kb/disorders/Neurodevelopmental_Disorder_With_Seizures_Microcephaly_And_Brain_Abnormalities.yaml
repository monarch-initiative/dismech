genetic:
- name: PPFIBP1
  gene_term:
    preferred_term: PPFIBP1
    term:
      id: hgnc:9249
      label: PPFIBP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    PPFIBP1 (liprin-beta1; MIM 603141) lies at 12p11.22. Reported alleles are
    homozygous nonsense (p.Arg135*, p.Gln156*, p.Gln434*, p.Gln490*, p.Arg805*,
    p.Arg877*), frameshift (p.Glu456Aspfs*3, p.Ala473Lysfs*20, p.Tyr885Leufs*4)
    and canonical splice-site (c.1146+1G>A, c.2158+2T>C) variants, plus the
    fetal SAM-domain missense p.Gly726Val (NM_003622.4). p.Gln434* is classified
    by the authors as of uncertain significance because it may allow in-frame
    skipping of its exon. p.Glu456Aspfs*3 and
    p.Gln490* and p.Tyr885Leufs*4 each recur in two unrelated families.
    Heterozygous parents are unaffected.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the affected individuals of the families 2-12, we detected eight different
      homozygous protein-truncating variants.
    explanation: Protein-truncating alleles dominate the variant spectrum.
  - reference: PMID:36527195
    reference_title: A novel homozygous truncating variant in PPFIBP1 further delineates
      PPFIBP1-associated neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing (WES) followed by bidirectional Sanger sequencing
      techniques identified a homozygous nonsense variant (c.466C > T; p.Gln156*)
      in the PPFIBP1 gene (NM_003622.4) that segregated with the disease phenotype.
    explanation: A further homozygous nonsense allele in an independent family.
animal_models:
- name: C. elegans hlb-1(syb4896) knockout
  species: Caenorhabditis elegans
  genotype: hlb-1(syb4896)
  publication: PMID:35830857
  description: >-
    CRISPR deletion removing all exons of hlb-1, the worm ortholog of PPFIBP1,
    phenotyped by automated behavioural tracking and cholinergic drug assays.
  modeled_mechanisms:
  - target: Presynaptic Transmission Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Aldicarb resistance with levamisole sensitivity shows reduced presynaptic
      acetylcholine release, and light-evoked head movements overlap with worm
      seizure models.
    limitations: >-
      The worm has no brain comparable to the human cortex, so microcephaly,
      cortical malformation and calcification cannot be modelled; the mutant has
      no developmental delay or growth defect. An earlier hlb-1 study reported
      levamisole resistance (a postsynaptic change) that this strain does not show.
    readouts:
    - name: Aldicarb resistance
      target: Presynaptic Transmission Defect
      direction: ALTERED
      interpretation: Slower acetylcholine accumulation at the neuromuscular junction
        indicates reduced presynaptic release.
      evidence:
      - reference: PMID:35830857
        reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
          disorder with microcephaly, epilepsy, and periventricular calcifications.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These findings provide evidence that a defect arises in the presynaptic,
          but not postsynaptic, apparatus of C. elegans as a result of hlb-1 LoF.
        explanation: Direct readout of the presynaptic defect in the knockout.
datasets: []
notes: >-
  GeneReviews baseline: no GeneReviews chapter on PPFIBP1 or this disorder was
  found (PubMed search "PPFIBP1 AND genereviews[book]" returned no results), so
  phenotype coverage was cross-referenced against Table 1 and the cohort
  frequencies of the founding series (PMID:35830857) and the later family
  (PMID:36527195). Frequencies are from the 16 postnatal individuals of the
  founding cohort. PPFIBP1 is also a common fusion partner of ALK and ROS1 in
  somatic tumours; that literature concerns a different (oncogenic) mechanism and
  is deliberately not used here.
discussions:
- discussion_id: gap_ppfibp1_calcification_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Periventricular Calcification and White Matter Injury
  - phenotypes#Microcephaly
  prompt: >-
    How does loss of liprin-beta1 cause periventricular calcification,
    white-matter injury and microcephaly?
  rationale: >-
    The only mechanistic data are presynaptic defects in a worm and synapse
    growth defects in a fly, neither of which has a brain that can show these
    tissue phenotypes. Nonsense-mediated decay and loss of liprin-beta1 protein
    have not been tested in patient cells, and there is no vertebrate model.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The biological function of liprin-β1 and its molecular mechanisms are
      still largely unstudied.
    explanation: The cohort authors state the mechanism is unstudied.

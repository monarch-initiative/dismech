pathophysiology:
- name: Biallelic PPFIBP1 Loss of Function
  description: >-
    Homozygous nonsense, frameshift and canonical splice-site variants in
    PPFIBP1 (12p11.22; NM_003622.4) are predicted to cause nonsense-mediated
    decay and loss of liprin-beta1. Nine distinct variants were found in the 12
    founding families, three of them recurrent; a later Pakistani family carried
    a further homozygous nonsense variant, c.466C>T p.(Gln156*). The most
    upstream truncating variant (p.Arg135*) and a canonical splice-site variant
    were associated with milder courses, possibly through alternative transcripts
    or residual splicing. A homozygous SAM-domain missense variant,
    p.(Gly726Val), in a fetus with intracranial calcifications is predicted to
    destabilize the SAM2-SAM3 interface.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: PPFIBP1
    term:
      id: hgnc:9249
      label: PPFIBP1

name: Neurodevelopmental Disorder with Seizures, Microcephaly, and Brain Abnormalities
creation_date: '2026-10-15T00:00:00Z'
category: Mendelian
synonyms:
- NEDMISBA
- PPFIBP1-related neurodevelopmental disorder
- PPFIBP1-associated neurodevelopmental disorder
description: >-
  Neurodevelopmental disorder with seizures, microcephaly, and brain
  abnormalities (OMIM 620024) is an ultra-rare autosomal recessive disorder
  caused by biallelic loss-of-function variants in PPFIBP1, which encodes
  liprin-beta1, a SAM-domain scaffold protein that heterodimerizes with the
  liprin-alpha proteins of the presynaptic active zone. The founding cohort
  comprised 16 individuals from 12 mostly consanguineous families, all
  homozygous for protein-truncating or canonical splice-site variants, plus a
  fetus homozygous for a SAM-domain missense variant. The core phenotype is
  severe to profound global developmental delay with absent speech, early-onset
  and usually drug-resistant epilepsy (median onset at 2 months, often with
  epileptic spasms and West syndrome), and primary and/or progressive
  microcephaly. Neuroimaging shows periventricular leukoencephalopathy,
  ventriculomegaly, hypoplasia of the corpus callosum, cortical malformations
  (pachygyria, increased cortical thickness, polymicrogyria) and, most
  distinctively, bilateral periventricular and basal-ganglia calcifications
  that mimic congenital infection. Spasticity or hypotonia, nystagmus and optic
  atrophy, hearing impairment, congenital heart defects, intrauterine and
  postnatal growth restriction and feeding difficulties are frequent, and a
  quarter of the founding cohort died in childhood. Loss of the C. elegans
  ortholog hlb-1 produces aldicarb resistance indicating a presynaptic
  transmission defect, and loss of Drosophila Liprin-beta disrupts axon
  targeting and neuromuscular synapse growth, pointing to a synaptic
  pathomechanism; how loss of liprin-beta1 produces the calcifications and
  white-matter disease is unknown. No disease-modifying therapy exists.

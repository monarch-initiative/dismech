    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both received antiepileptic polytherapy including valproate.
    explanation: The two drug-responsive individuals were on valproate-containing

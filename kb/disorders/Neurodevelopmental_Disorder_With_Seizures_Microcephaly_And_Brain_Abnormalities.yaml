inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous loss-of-function variants were found in every affected
    individual, and all but two of the founding families were consanguineous.
    PPFIBP1 loss-of-function variants are uncommon in the general population and
    no homozygous loss-of-function carrier is recorded in gnomAD.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:

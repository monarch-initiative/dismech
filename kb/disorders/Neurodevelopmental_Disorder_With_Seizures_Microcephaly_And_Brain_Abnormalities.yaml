    snippet: By exome and genome sequencing, we detected nine ultra-rare homozygous
      loss-of-function variants in 16 individuals from 12 unrelated families.
    explanation: Founding genotype, homozygous loss-of-function variants in all affected
      individuals.
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a fetus with intracranial calcifications, we identified a rare homozygous
      missense variant that by structural analysis was predicted to disturb the topology
      of the SAM domain region that is essential for protein-protein interaction.
    explanation: A SAM-domain missense allele extends the allelic spectrum beyond truncating
      variants; its pathogenicity rests on structural prediction and phenotype overlap.
  - reference: PMID:36527195
    reference_title: A novel homozygous truncating variant in PPFIBP1 further delineates
      PPFIBP1-associated neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing (WES) followed by bidirectional Sanger sequencing
      techniques identified a homozygous nonsense variant (c.466C > T; p.Gln156*)
      in the PPFIBP1 gene (NM_003622.4) that segregated with the disease phenotype.
    explanation: Independent replication in an unrelated family with a further truncating
      allele.
- name: Loss of Liprin-beta1 Scaffold Complexes
  description: >-
    Liprin-beta1 homodimerizes and heterodimerizes with the liprin-alpha proteins
    through its C-terminal SAM domains. Liprin-alpha proteins are presynaptic
    active-zone scaffolds, and liprin-alpha2 binds liprin-beta1 and the
    neurodevelopmental scaffold CASK simultaneously, forming a ternary complex.
    Loss of liprin-beta1 is therefore expected to impair liprin-mediated assembly
    of synaptic protein complexes. That the complex is disrupted in patient
    cells has not been shown.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Impaired Synapse Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Presynaptic Transmission Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: Liprin-β1 has the ability to homodimerize and to heterodimerize with
      the homologous α-liprins.
    explanation: Background statement, citing earlier biochemistry, of the binding
      partners that make liprin-beta1 a scaffold component.
  - reference: PMID:21855798
    reference_title: Liprin-mediated large signaling complex organization revealed
      by the liprin-α/CASK and liprin-α/liprin-β complex structures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, formation of the CASK/liprin-α/liprin-β ternary complex suggests
      that liprins can mediate assembly of target proteins into large protein complexes
      capable of regulating numerous cellular activities.
    explanation: Structural and biochemical evidence that liprin-beta joins CASK and
      liprin-alpha in one complex.
- name: Impaired Synapse Formation
  description: >-
    Null mutants of Drosophila Liprin-beta, the single fly ortholog, show R7
    photoreceptor axons that overshoot their target layer and reduced larval
    neuromuscular junction size, acting through the exchange factor Trio. The
    corresponding defect in the human brain has not been studied.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
  evidence:
  - reference: PMID:21084592
    reference_title: Three Drosophila liprins interact to control synapse formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Larval neuromuscular junction size is reduced in both Liprin-α and Liprin-β
      mutants, and further reduced in double mutants, suggesting independent functions
      for these Liprins.
    explanation: Liprin-beta loss reduces synapse growth in the fly.
  - reference: PMID:21084592
    reference_title: Three Drosophila liprins interact to control synapse formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Liprin-β mutant R7 axons grow beyond their target layer.
    explanation: Liprin-beta is required for correct synaptic target selection.
- name: Presynaptic Transmission Defect
  description: >-
    C. elegans hlb-1 (PPFIBP1 ortholog) mutants mislocalize the synaptic vesicle
    marker SNB-1, have enlarged synaptic sites, reduced pharyngeal pumping and
    altered locomotion, and are resistant to the acetylcholinesterase inhibitor
    aldicarb while remaining levamisole-sensitive, indicating reduced presynaptic
    acetylcholine release. A light-evoked increase in head-tip acceleration in a
    knockout strain overlaps with existing worm seizure models. How this
    presynaptic defect produces human epilepsy has not been shown.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by the cohort authors from the worm data and the role of synaptic
      transmission in seizure onset; the intermediate network-level steps have
      not been studied and no vertebrate model exists.
    evidence:
    - reference: PMID:35830857
      reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
        disorder with microcephaly, epilepsy, and periventricular calcifications.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Thus, this finding indirectly suggests some elements of a mild epileptic
        phenotype may be present in hlb-1(syb4896).
      explanation: A seizure-like behavioural readout in the hlb-1 knockout links the
        presynaptic defect to an epileptic phenotype, by the authors' own account indirectly.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These findings provide evidence that a defect arises in the presynaptic,
      but not postsynaptic, apparatus of C. elegans as a result of hlb-1 LoF.
    explanation: Aldicarb resistance with levamisole sensitivity localizes the defect
      to the presynaptic side.
  - reference: PMID:19290026
    reference_title: HLB-1 functions as a new regulator for the organization and function
      of neuromuscular junctions in nematode Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of HLB-1 function did not result in defects in neuronal outgrowth
      or neuronal loss, but caused obvious defects of SNB-1::GFP and UNC-49::GFP puncta
      localization, suggesting the altered presynaptic and postsynaptic structures.
    explanation: An earlier independent hlb-1 study shows synaptic disorganization
      without neuronal loss; it also reported a postsynaptic change that the 2022 study
      did not reproduce.
- name: Periventricular Calcification and White Matter Injury
  description: >-
    Bilateral calcifications in the periventricular white matter, and often the
    basal ganglia, were present in every individual who had a CT scan, together
    with periventricular leukoencephalopathy and white-matter loss that
    progressed on serial imaging in two individuals. Fetal autopsy showed
    macrocalcification and rare necrotic foci calcifying in the germinative and
    periventricular zones. The mechanism linking loss of liprin-beta1 to this
    tissue injury is unknown, so the node has no upstream edge.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Periventricular calcification
    causal_link_type: DIRECT
    description: The imaging finding is the calcified periventricular tissue itself.
  - target: Basal ganglia calcification
    causal_link_type: DIRECT
    description: The same calcifying process extends to the basal ganglia in about half.
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
    description: Periventricular white-matter injury is seen on MRI as leukoencephalopathy.
  evidence:
  - reference: PMID:35830857
    reference_title: Bi-allelic loss-of-function variants in PPFIBP1 cause a neurodevelopmental
      disorder with microcephaly, epilepsy, and periventricular calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the histopathological examination of the brain revealed predominant
      macrocalcification and rare necrotic foci in the process of calcification in
      the germinative and periventricular areas around the 3rd ventricle and occipital
      horns
    explanation: Fetal neuropathology shows the calcifications arise in germinative
      and periventricular zones with necrosis.

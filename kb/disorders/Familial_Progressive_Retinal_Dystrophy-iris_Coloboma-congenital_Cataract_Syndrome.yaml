genetic:
- name: MIR204
  association: Causal heterozygous seed-region variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MIR204
    term:
      id: hgnc:31582
      label: MIR204
  notes: >-
    One variant, n.37C>T, accounts for every reported family: the original
    five-generation family, a Czech family shown by haplotype analysis to be
    unrelated to it, and a Chinese family. No other MIR204 variant has been
    reported with this phenotype. No ClinGen gene-disease validity record for
    MIR204 was found in the local ClinGen cache, so no validity tier is
    recorded.
  evidence:
  - reference: PMID:37321975
    reference_title: MIR204 n.37C>T variant as a cause of chorioretinal dystrophy variably associated with iris coloboma, early-onset cataracts and congenital glaucoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis excluded relatedness with the original family reported to harbour the n.37C>T variant in MIR204.
    explanation: >-
      An independent family carries the same variant.
  - reference: PMID:38867642
    reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this third independent and the first Asian family, the existence of a miR-204 variant associated with RP accompanied by iris coloboma was confirmed.
    explanation: >-
      A third independent family.
  variants:
  - name: n.37C>T
    description: >-
      Seed-region substitution in the miR-204 precursor, found heterozygous in
      all three reported families.
    evidence:
    - reference: PMID:26056285
      reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By linkage analysis and exome sequencing, we identified a previously undescribed heterozygous mutation, n.37 C > T, in the seed region of microRNA-204 (miR-204), which segregates with the disease in all affected individuals.
      explanation: >-
        The variant segregates with disease in the original family.

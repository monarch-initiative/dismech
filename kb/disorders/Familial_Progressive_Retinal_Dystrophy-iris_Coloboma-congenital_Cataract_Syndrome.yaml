    reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo injection, in medaka fish (Oryzias latipes), of the mutated miR-204 caused a phenotype consistent with that observed in the family, including photoreceptor alterations with reduced numbers of both cones and rods as a result of increased apoptosis
    explanation: >-
      Rods and cones are both lost through apoptosis in the fish model.
  - reference: PMID:38867642
    reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fundus examination showed classic RP signs, including bone spicule-like pigmentation in the peripheral retina and attenuated arterioles
    explanation: >-

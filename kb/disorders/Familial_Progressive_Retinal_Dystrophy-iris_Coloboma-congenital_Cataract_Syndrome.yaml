      reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fundus examination showed classic RP signs, including bone spicule-like pigmentation in the peripheral retina and attenuated arterioles
      explanation: >-
        Photoreceptor and RPE loss is seen clinically as the pigmentary
        retinal degeneration that defines the dystrophy.
  - target: Abnormal light- and dark-adapted electroretinogram
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38867642
      reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ffERG presenting extinguished waves under both scotopic and photopic conditions.
      explanation: >-

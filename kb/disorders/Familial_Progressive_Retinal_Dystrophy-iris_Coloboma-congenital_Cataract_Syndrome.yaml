      Loss of miR-204 impairs RPE function and retinal responses.
    limitations: >-
      A homozygous null allele, whereas patients carry one altered-target
      allele interpreted as gain of function. The defect is primarily in the
      RPE rather than a primary photoreceptor apoptosis.
    evidence:
    - reference: PMID:31332443
      reference_title: Regulation of phagolysosomal activity by miR-204 critically influences structure and function of retinal pigment epithelium/retina.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These structural, molecular and cellular outcomes were accompanied by decreased light-evoked electrical responses from the retina and RPE.
      explanation: >-
        miR-204 loss reduces retinal and RPE function in mice.
discussions:
- discussion_id: mir204_gain_versus_loss_of_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does MIR204 n.37C>T cause disease by repressing new targets, by losing
    repression of normal miR-204 targets, or both, and which targets drive
    photoreceptor death and coloboma?
  attaches_to:
  - pathophysiology#MIR204 Seed-Region n.37C>T Variant
  - pathophysiology#Photoreceptor Apoptosis and Retinal Degeneration
  rationale: >-
    The defining study interprets the mechanism as gain of function, based on
    altered targeting in vitro and photoreceptor apoptosis after injecting
    the mutant microRNA into fish. Loss of miR-204 also damages the eye:
    knockdown in fish causes coloboma and abnormal lens formation, and
    knockout mice have RPE dysfunction. A seed change can do both at once, and
    the coloboma and cataract arms of the disease have only loss-of-function
    model evidence. The specific targets that matter have not been
    identified.
  evidence:
  - reference: PMID:26056285
    reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, knockdown assays in medaka fish demonstrated that miR-204 is necessary for normal photoreceptor function.
    explanation: >-
      Loss of miR-204 also impairs photoreceptors, so loss of normal
      targeting may contribute.
  proposed_experiments:
  - experiment_id: mir204_seed_knock_in
    experiment_design: TARGETED_PERTURBATION
    name: Heterozygous MIR204 n.37C>T knock-in
    description: >-
      Introduce the seed variant at the endogenous locus in mice or human
      retinal organoids, and compare its retinal, RPE and optic fissure
      phenotypes and repressed transcripts with a heterozygous null allele.
    decision_criterion: >-
      A phenotype in the knock-in that the heterozygous null lacks, together
      with repression of new targets, would support gain of function.
    would_support:
    - pathophysiology#MIR204 Seed-Region n.37C>T Variant
datasets: []
notes: >-
  Three families with the same variant are the whole human evidence base;
  no prevalence figure exists. The original family's abstract describes the
  retinal dystrophy and bilateral coloboma only as present "in varying
  degrees"; ages at onset and ERG data come from the later Czech and Chinese
  reports. Congenital glaucoma has been reported in the Czech family only.
  Four members of the Czech family also have albinism from biallelic OCA2
  variants (PMID:37321975), so reduced acuity and fundus findings in that
  family cannot all be attributed to MIR204.
  This disease is distinct from progressive retinal dystrophy due to
  retinol transport defect (MONDO:0014060, curated as
  Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect), whose
  MONDO synonyms include "retinal dystrophy, iris coloboma, and comedogenic
  acne syndrome".

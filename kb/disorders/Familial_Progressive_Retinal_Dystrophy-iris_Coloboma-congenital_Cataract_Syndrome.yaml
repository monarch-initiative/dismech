phenotypes:
- name: Retinal dystrophy
  category: Ophthalmologic
  diagnostic: true
  description: >-
    Progressive retinal dystrophy, reported as retinal dystrophy in the
    original family, early-onset chorioretinal dystrophy in the Czech family
    and retinitis pigmentosa in the Chinese family. Age at onset varies: the
    Chinese proband had poor vision since childhood, while his mother began
    losing vision in her 30s. The retinal disease may appear with age: the
    proband's 2-year-old son had coloboma and photophobia but a normal
    fundus, which the authors attribute, tentatively, to his young age.
  phenotype_term:
    preferred_term: Retinal dystrophy
    term:
      id: HP:0000556
      label: Retinal dystrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26056285
    reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we investigated the genetic cause of an autosomal dominantly inherited condition of retinal dystrophy and bilateral coloboma, present in varying degrees in a large, five-generation family
    explanation: >-
      Retinal dystrophy in the defining family.
  - reference: PMID:37321975
    reference_title: MIR204 n.37C>T variant as a cause of chorioretinal dystrophy variably associated with iris coloboma, early-onset cataracts and congenital glaucoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four members of a three-generation Czech family with early-onset chorioretinal dystrophy were shown to be heterozygous carriers of the n.37C>T in MIR204.
    explanation: >-
      Early-onset chorioretinal dystrophy in a second family.
  - reference: PMID:38867642
    reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His mother, who started losing vision in her 30s, was also diagnosed with RP.
    explanation: >-
      Adult onset of vision loss in one carrier, against childhood symptoms
      in her son, shows variable age at onset.
  - reference: PMID:38867642
    reference_title: Retinitis pigmentosa with iris coloboma due to miR-204 gene variant in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband's young son, aged 2, presented with strabismus, photophobia, and iris coloboma, yet exhibited a normal fundus, possibly due to his early age.
    explanation: >-
      A young carrier without visible retinal disease; the authors suggest,
      without testing it, that his age explains this.

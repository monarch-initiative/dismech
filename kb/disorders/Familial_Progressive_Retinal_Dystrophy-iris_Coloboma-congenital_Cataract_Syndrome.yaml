name: Familial progressive retinal dystrophy-iris coloboma-congenital cataract syndrome
creation_date: "2026-10-21T14:00:00Z"
category: Mendelian
synonyms:
- retinal dystrophy and iris coloboma with or without cataract
- MIR204-associated retinal dystrophy with coloboma
- RDICC
description: >-
  An autosomal dominant eye disorder caused by the heterozygous n.37C>T
  variant in the seed region of microRNA-204 (MIR204), the only reported
  disease variant. It combines a progressive retinal dystrophy, described in
  later families as retinitis pigmentosa or chorioretinal dystrophy with
  extinguished full-field ERG responses, with bilateral iris coloboma and, in
  some carriers, early-onset cataract or congenital glaucoma. Severity varies
  within families. Three unrelated families have been reported: a
  five-generation family in which the variant was found, a Czech family that
  haplotype analysis showed to be independent, and a Chinese family. The
  variant changes the set of mRNAs that miR-204 represses. Injecting the
  mutant microRNA into medaka fish reproduces photoreceptor loss through
  apoptosis, and the original authors interpret the mechanism as gain of
  function, while loss of miR-204 in fish and mice also damages eye
  development and the retinal pigment epithelium. There is no
  disease-specific treatment.

pathophysiology:
- name: MIR204 Seed-Region n.37C>T Variant
  biological_scale: MOLECULAR
  description: >-
    A single-nucleotide change in the seed region of mature miR-204, the
    sequence that selects target mRNAs. The mutant microRNA represses an
    altered set of transcripts; in silico analysis predicts hundreds of new
    targets. The original authors interpret the effect as gain of function.
    Whether loss of repression of normal miR-204 targets also contributes is
    not settled (see the discussion).
  genes:
  - preferred_term: MIR204
    term:
      id: hgnc:31582
      label: MIR204
  molecular_functions:
  - preferred_term: miR-204 base-pairing repression of target mRNAs
    term:
      id: GO:1903231
      label: mRNA base-pairing post-transcriptional repressor activity
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing, with altered target specificity
    modifier: DYSREGULATED
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:26056285
    reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By linkage analysis and exome sequencing, we identified a previously undescribed heterozygous mutation, n.37 C > T, in the seed region of microRNA-204 (miR-204), which segregates with the disease in all affected individuals.
    explanation: >-
      Identifies the seed-region variant and its segregation.
  - reference: PMID:26056285
    reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that this mutation determines significant alterations of miR-204 targeting capabilities via in vitro assays, including transcriptome analysis.
    explanation: >-
      The variant changes which transcripts miR-204 represses.
  - reference: PMID:37321975
    reference_title: MIR204 n.37C>T variant as a cause of chorioretinal dystrophy variably associated with iris coloboma, early-onset cataracts and congenital glaucoma.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico analysis of the n.37C>T variant revealed 713 novel targets.
    explanation: >-
      Prediction of new targets supports a change in target specificity.
  downstream:
  - target: Photoreceptor Apoptosis and Retinal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The mutant microRNA causes photoreceptor loss through apoptosis when
      injected into medaka fish. Which mis-repressed targets drive this is
      unknown.
    evidence:
    - reference: PMID:26056285
      reference_title: MiR-204 is responsible for inherited retinal dystrophy associated with ocular coloboma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In vivo injection, in medaka fish (Oryzias latipes), of the mutated miR-204 caused a phenotype consistent with that observed in the family, including photoreceptor alterations with reduced numbers of both cones and rods as a result of increased apoptosis
      explanation: >-
        The patient allele causes photoreceptor apoptosis in vivo.
  - target: Iris coloboma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      miR-204 regulates dorsoventral patterning of the developing retina, and
      its loss in medaka causes optic fissure coloboma through elevated
      Meis2. How the seed variant disturbs optic fissure closure in patients
      has not been tested; the fish result is from knockdown, not from the
      patient allele.
    evidence:
    - reference: PMID:20713703
      reference_title: miR-204 is required for lens and retinal development via Meis2 targeting.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Morpholino-mediated ablation of miR-204 expression resulted in an eye phenotype characterized by microphthalmia, abnormal lens formation, and altered dorsoventral (D-V) patterning of the retina, which is associated with optic fissure coloboma.
      explanation: >-
        Links miR-204 to optic fissure closure, through loss rather than the
        patient's altered-target allele.
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      miR-204 is required for lens development in medaka. The link from the
      seed variant to early-onset cataract has not been studied.
    evidence:
    - reference: PMID:20713703
      reference_title: miR-204 is required for lens and retinal development via Meis2 targeting.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Morpholino-mediated ablation of miR-204 expression resulted in an eye phenotype characterized by microphthalmia, abnormal lens formation, and altered dorsoventral (D-V) patterning of the retina, which is associated with optic fissure coloboma.
      explanation: >-
        Abnormal lens formation after miR-204 loss in fish; indirect for the
        patient allele.

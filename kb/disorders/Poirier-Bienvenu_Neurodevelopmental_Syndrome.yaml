      reference_title: "Disruption of CK2beta in embryonic neural stem cells compromises proliferation and oligodendrogenesis in the mouse telencephalon."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of CK2beta leads to defects in proliferation and differentiation of embryonic NSCs."
      explanation: Conditional knockout in embryonic neural progenitors; complete loss rather than the heterozygous human state.

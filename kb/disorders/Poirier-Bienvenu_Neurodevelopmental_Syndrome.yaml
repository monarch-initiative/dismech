pathophysiology:
- name: CSNK2B Heterozygous Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo, CSNK2B variant: most often nonsense,
    frameshift, canonical splice or start-loss, or a deletion of the gene.
    Splice and frameshift alleles studied in patient cells produce abnormal
    transcripts that are reduced in amount.
  genes:
  - preferred_term: CSNK2B
    term:
      id: hgnc:2460
      label: CSNK2B
  genetic_context:
    allele_type: predicted loss of function (nonsense, frameshift, splice, start-loss, gene deletion)
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28585349
    reference_title: "CSNK2B splice site mutations in patients cause intellectual disability with or without myoclonic epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mRNA transcripts were abnormal and significantly reduced in affected fibroblasts and most likely produced truncated proteins."
    explanation: Patient fibroblasts show reduced and abnormal CSNK2B transcripts from the splice alleles.
  - reference: PMID:34041744
    reference_title: "CSNK2B: A broad spectrum of neurodevelopmental disability and epilepsy severity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterozygous predicted LoF variants in our patients suggest a haploinsufficiency mechanism."
    explanation: Inference of haploinsufficiency from the predominance of predicted loss-of-function alleles.
  downstream:
  - target: Reduced CK2beta Protein Abundance
    causal_link_type: DIRECT
    description: Loss-of-function alleles and destabilizing missense alleles lower the amount of CK2beta protein.
    evidence:
    - reference: PMID:36833176
      reference_title: "Haploinsufficiency as a Foreground Pathomechanism of Poirer-Bienvenu Syndrome and Novel Insights Underlying the Phenotypic Continuum of CSNK2B-Associated Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data prove that loss of the CK2beta protein, due to the instability of mutant CSNK2B mRNA and protein, resulting in a reduced amount of CK2 complex and affecting its kinase activity, may underlie the POBINDS phenotype."
      explanation: Functional study of a frameshift and a missense allele showing mRNA and protein instability lowering CK2beta.
    - reference: PMID:34370157
      reference_title: "Clinical and genetic analysis of six Chinese children with Poirier-Bienvenu neurodevelopmental syndrome caused by CSNK2B mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Western blot analysis showed that the frameshift variant resulted in decreased protein expression."
      explanation: A patient frameshift allele reduces CK2beta protein expression.
- name: CSNK2B Zinc-Finger Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Missense variants in the CK2beta zinc-finger domain (for example
    p.Arg111Pro, p.Cys137Phe) reduce protein stability, partly through
    proteasomal and lysosomal degradation, alter subcellular localization and
    reduce CK2beta homodimerization while sparing CK2alpha binding. In a
    literature analysis, individuals with zinc-finger missense variants had
    more manageable seizures and milder intellectual disability than those
    with missense variants elsewhere.
  genes:
  - preferred_term: CSNK2B
    term:
      id: hgnc:2460
      label: CSNK2B
  genetic_context:
    allele_type: missense in the zinc-finger domain
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: CK2beta homodimerization
    modifier: DECREASED
    term:
      id: GO:0042803
      label: protein homodimerization activity
  evidence:
  - reference: PMID:40317201
    reference_title: "Pathogenic missense variants of CSNK2B associated with Poirier-Bienvenu neurodevelopmental disorder impact differently on CK2 holoenzyme formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further show that homodimerization of these CK2β variants (p.Arg111Pro, p.Cys137Phe), localized within the Zinc-finger domain, is significantly reduced, while CK2α binding appears not affected."
    explanation: Cell-based assays of two patient zinc-finger variants show reduced homodimerization.
  - reference: PMID:35774559
    reference_title: "Splicing Interruption by Intron Variants in CSNK2B Causes Poirier-Bienvenu Neurodevelopmental Syndrome: A Focus on Genotype-Phenotype Correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with variants in the zinc finger domain had manageable seizures and milder ID"
    explanation: Genotype-phenotype analysis of published cases associating zinc-finger variants with a milder phenotype.
  downstream:
  - target: Reduced CK2beta Protein Abundance
    causal_link_type: DIRECT
    description: Zinc-finger variants destabilize CK2beta, acting like truncating alleles.
    evidence:
    - reference: PMID:40317201
      reference_title: "Pathogenic missense variants of CSNK2B associated with Poirier-Bienvenu neurodevelopmental disorder impact differently on CK2 holoenzyme formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that variants in the Zinc-finger region leads to reduced protein stability and altered subcellular localization."
      explanation: Direct demonstration of reduced CK2beta stability for zinc-finger missense variants.
  - target: Reduced CK2 Holoenzyme Assembly and Activity
    causal_link_type: DIRECT
    description: Reduced beta-subunit dimerization lowers the pool of assembled CK2 holoenzyme.
    evidence:
    - reference: PMID:40317201
      reference_title: "Pathogenic missense variants of CSNK2B associated with Poirier-Bienvenu neurodevelopmental disorder impact differently on CK2 holoenzyme formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We conclude that Zinc-finger domain variants appear to destabilize the protein and affect holoenzyme formation, effectively reducing the pool of competent holoCK2."
      explanation: Links zinc-finger variant destabilization to reduced holoenzyme formation.
- name: Reduced CK2beta Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    Lower steady-state level of the CK2beta regulatory subunit, from mRNA
    instability, absent translation or protein destabilization of the mutant
    allele.
  genes:
  - preferred_term: CSNK2B
    term:
      id: hgnc:2460
      label: CSNK2B
  evidence:
  - reference: PMID:40317201
    reference_title: "Pathogenic missense variants of CSNK2B associated with Poirier-Bienvenu neurodevelopmental disorder impact differently on CK2 holoenzyme formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the context of POBINDS, our findings suggest that Zinc-finger domain variants are likely to affect cells similarly to truncating and splicing variants with reduced translation of full-length CK2β."
    explanation: Places truncating, splicing and zinc-finger variants on a shared reduced-CK2beta mechanism.
  downstream:
  - target: Reduced CK2 Holoenzyme Assembly and Activity
    causal_link_type: DIRECT
    description: >-
      CK2beta dimers form the core of the CK2 heterotetramer, so less CK2beta
      yields fewer holoenzyme complexes and less CK2 kinase activity.
    evidence:
    - reference: PMID:34041744
      reference_title: "CSNK2B: A broad spectrum of neurodevelopmental disability and epilepsy severity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "As β subunit dimerization is required for CK2 holoenzyme formation, 1 reduced expression of CSNK2B may result in fewer complexes."
      explanation: Mechanistic inference linking reduced CK2beta to reduced holoenzyme formation.
    - reference: PMID:36833176
      reference_title: "Haploinsufficiency as a Foreground Pathomechanism of Poirer-Bienvenu Syndrome and Novel Insights Underlying the Phenotypic Continuum of CSNK2B-Associated Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data prove that loss of the CK2beta protein, due to the instability of mutant CSNK2B mRNA and protein, resulting in a reduced amount of CK2 complex and affecting its kinase activity, may underlie the POBINDS phenotype."
      explanation: Shows reduced CK2 complex and kinase activity downstream of CK2beta loss.
- name: Reduced CK2 Holoenzyme Assembly and Activity
  biological_scale: MOLECULAR
  description: >-
    Fewer assembled alpha2-beta2 CK2 holoenzymes and reduced CK2-dependent
    phosphorylation of its many substrates. CK2 is a constitutively active
    serine/threonine kinase that is abundant in the brain; CK2beta stabilizes
    the catalytic subunits and modulates substrate specificity. Reduced
    holoenzyme activity has been proposed as the unifying mechanism of the
    disorder.
  mechanism_confidence: PROVISIONAL

- name: CK2beta Asp32 Dominant-Negative Wnt Perturbation
  biological_scale: CELLULAR
  subtypes:
  - IDCS
  description: >-
    De novo p.Asp32His and p.Asp32Asn variants in the KEN box-like motif of
    CK2beta increased CSNK2B transcript and protein, impaired interaction of
    CK2beta with DVL3 and beta-catenin, and reduced phosphorylated and nuclear
    active beta-catenin in patient lymphoblastoid cells, with global
    dysregulation of canonical Wnt signaling. The authors interpret this as a
    dominant-negative effect underlying the craniodigital presentation.
    Shown in one study's lymphoblastoid lines only.
  mechanism_confidence: HYPOTHETICAL
  genes:
  - preferred_term: CSNK2B
    term:
      id: hgnc:2460
      label: CSNK2B
  genetic_context:
    allele_type: missense at codon Asp32 (KEN box-like motif)
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: DYSREGULATED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:35571680
    reference_title: "De novo variants of CSNK2B cause a new intellectual disability-craniodigital syndrome by disrupting the canonical Wnt signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both variants, NP_001311.3; p.Asp32His and NP_001311.3; p.Asp32Asn, lead to an upregulation of CSNK2B expression at transcript and protein level, along with global dysregulation of canonical Wnt signaling."
    explanation: Patient lymphoblastoid cell data for the Asp32 variants.
  - reference: PMID:35571680
    reference_title: "De novo variants of CSNK2B cause a new intellectual disability-craniodigital syndrome by disrupting the canonical Wnt signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variants compromise the kinase activity of CK2 as evident by a marked reduction of phosphorylated β-catenin and consequent absence of active β-catenin inside nuclei of the patient-derived lymphoblastoid cell lines (LCLs)."
    explanation: Reduced CK2-dependent beta-catenin phosphorylation and nuclear beta-catenin in patient cells.
  downstream:
  - target: Digital Anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The authors attribute the craniodigital features to perturbed canonical Wnt signaling.
    evidence:
    - reference: PMID:35571680

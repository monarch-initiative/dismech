  description: >-
    Epilepsy is managed with standard antiseizure medications, often in
    combination. Valproic acid is the medication most often reported to be
    effective; lamotrigine, zonisamide and levetiracetam have also been used.
    About 40% of individuals have medically refractory epilepsy.

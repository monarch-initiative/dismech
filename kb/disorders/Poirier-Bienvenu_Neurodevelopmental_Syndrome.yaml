inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. Almost all probands whose parents were tested have a
    de novo variant; rare familial cases with transmission from an affected
    parent and marked intrafamilial variability have been reported.
  evidence:
  - reference: PMID:39236211
    reference_title: "CSNK2B-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CSNK2B-NDD is an autosomal dominant disorder typically caused by a de novo pathogenic variant."
    explanation: GeneReviews statement of the mode of inheritance.
  - reference: PMID:37717460
    reference_title: "Refining of the electroclinical phenotype in familial and sporadic cases of CSNK2B-related Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three patients, a pathogenic variant was inherited from an affected parent."
    explanation: Documents parent-to-child transmission, confirming autosomal dominant inheritance beyond de novo cases.

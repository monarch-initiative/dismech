name: CSNK2B-Related Neurodevelopmental Disorder
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  CSNK2B-related neurodevelopmental disorder (Poirier-Bienvenu
  neurodevelopmental syndrome, POBINDS) is an autosomal dominant disorder caused
  by heterozygous, usually de novo, pathogenic variants in CSNK2B, which encodes
  CK2beta, the regulatory beta subunit of the serine/threonine protein kinase
  CK2. Most individuals have developmental delay or intellectual disability,
  ranging from borderline to profound, and early-onset epilepsy, most often
  generalized tonic-clonic or myoclonic seizures beginning in the first two
  years of life. Epilepsy ranges from pharmacoresponsive to intractable with
  recurrent refractory status epilepticus. Speech delay, motor delay,
  hypotonia, ataxia or impaired coordination, autistic features and behavioral
  problems are common, and short stature, sometimes with growth hormone
  deficiency, and minor dysmorphic or digital anomalies occur in a subset. The
  predominant allelic class is predicted loss of function (nonsense,
  frameshift, splice and start-loss variants, and whole-gene 6p21.33
  deletions), and patient-derived and cell studies show reduced CK2beta
  protein and reduced CK2 holoenzyme, supporting haploinsufficiency; some
  missense variants in the zinc-finger domain destabilize CK2beta and impair
  its homodimerization. A Csnk2b heterozygous mouse shows seizures, cortical
  thinning and a deficit of cortical parvalbumin interneurons that are rescued
  by early postnatal gene replacement.
disease_term:
  preferred_term: Poirier-Bienvenu neurodevelopmental syndrome
  term:
    id: MONDO:0032889
    label: Poirier-Bienvenu neurodevelopmental syndrome
synonyms:
- Poirier-Bienvenu neurodevelopmental syndrome
- POBINDS
- CSNK2B-NDD
parents:
- Mendelian Neurodevelopmental Disorder
notes: >-
  OMIM #618732. The entry name follows the GeneReviews chapter title,
  CSNK2B-Related Neurodevelopmental Disorder (PMID:39236211), which covers the
  same single-gene condition as the MONDO term; the MONDO and OMIM label,
  Poirier-Bienvenu neurodevelopmental syndrome, and the GeneReviews
  abbreviation CSNK2B-NDD are kept as synonyms. The file slug keeps the MONDO
  label. A subset of individuals with de novo missense variants at CSNK2B
  codon Asp32 were proposed to have a distinct intellectual
  disability-craniodigital syndrome (PMID:35571680); later reports describe a
  continuous CSNK2B phenotype spectrum (PMID:36833176), and GeneReviews lists
  digital anomalies among the less consistent features of CSNK2B-NDD, so that
  presentation is recorded here as a subtype rather than a separate entry.
  This entry is distinct from Okur-Chung neurodevelopmental syndrome, caused by
  variants in CSNK2A1, the CK2alpha catalytic subunit
  (Okur_Chung_neurodevelopmental_syndrome).
has_subtypes:
- name: IDCS
  display_name: Intellectual disability-craniodigital presentation (CSNK2B p.Asp32 variants)
  description: >-
    Three unrelated individuals with de novo missense variants affecting CSNK2B
    codon Asp32 (p.Asp32His, p.Asp32Asn) in the KEN box-like motif had
    intellectual disability, epilepsy, a shared facial gestalt and digital
    anomalies of the hands and feet (brachydactyly, syndactyly, clinodactyly),
    and were proposed to have a distinct intellectual disability-craniodigital
    syndrome; a further child with p.Asp32Tyr had a similar presentation. In
    patient lymphoblastoid cells these variants increased CSNK2B
    expression and perturbed canonical Wnt signaling, interpreted as a
    dominant-negative effect. Whether this is a separate disorder or part of
    the CSNK2B spectrum is unsettled: a later study found that p.Asp32Asn did
    not affect CK2beta stability or CK2alpha binding.
  evidence:
  - reference: PMID:35571680
    reference_title: "De novo variants of CSNK2B cause a new intellectual disability-craniodigital syndrome by disrupting the canonical Wnt signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report five unrelated individuals: two of them manifesting POBINDS, while three are identified to segregate a new intellectual disability-craniodigital syndrome (IDCS), distinct from POBINDS. The three IDCS individuals carried two different de novo missense variants affecting the same codon of CSNK2B."
    explanation: Defines the Asp32 craniodigital presentation and its proposed distinction from POBINDS.
  - reference: PMID:36833176
    reference_title: "Haploinsufficiency as a Foreground Pathomechanism of Poirer-Bienvenu Syndrome and Novel Insights Underlying the Phenotypic Continuum of CSNK2B-Associated Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "might suggest the existence of a continuous spectrum of CSNK2B-associated phenotypes rather than a sharp distinction between them"
    explanation: A later report with deep phenotyping of a KEN box-like variant carrier argues for a continuum rather than a separate syndrome.
  - reference: PMID:40317201
    reference_title: "Pathogenic missense variants of CSNK2B associated with Poirier-Bienvenu neurodevelopmental disorder impact differently on CK2 holoenzyme formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Other variants, p.Asp32Asn and p.Arg86Cys, did not affect stability or CK2β/α binding."
    explanation: Functional data showing the Asp32 variant does not share the destabilizing effect of zinc-finger variants, so its mechanism differs from haploinsufficiency.
  - reference: PMID:34983633
    reference_title: "Two different presentations of de novo variants of CSNK2B: two case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 2 is a 5-year-old male, Latino patient with craniodigital intellectual disability syndrome subjacent to a de novo, likely pathogenic variant c.94G>T (p.Asp32Tyr)."
    explanation: An independent case with a third substitution at codon 32 and the craniodigital presentation.

diagnosis:
- name: Molecular genetic testing
  description: >-
    The diagnosis is established by finding a heterozygous CSNK2B pathogenic
    variant on molecular genetic testing, usually exome or genome sequencing or
    a multigene epilepsy or neurodevelopmental panel, with parental testing to
    establish de novo status.
  diagnosis_term:
    preferred_term: CSNK2B sequencing (exome, genome or multigene panel)

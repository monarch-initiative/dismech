    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of CSNK2B-NDD is established in a proband with suggestive findings and a heterozygous CSNK2B pathogenic variant identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:34041744
    reference_title: "CSNK2B: A broad spectrum of neurodevelopmental disability and epilepsy severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSNK2B variants were identified by research or clinical exome sequencing, and investigators from different centers were connected via GeneMatcher."
    explanation: In the largest single cohort, variants were found by exome sequencing.
- name: Copy-number analysis for 6p21.33 deletions
  description: >-
    Deletions of 6p21.33 that include CSNK2B cause the same phenotype, so
    copy-number analysis (chromosomal microarray, or copy-number calling from
    exome or genome data) belongs in the workup when sequencing finds no
    CSNK2B variant. In the two reported Chinese patients the deletions were
    identified from next-generation sequencing data.
  diagnosis_term:
    preferred_term: copy-number analysis for 6p21.33 deletions
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39493709
    reference_title: "Case report: Novel deletions in the 6p21.33 involving the CSNK2B gene in patients with Poirier-Bienvenu neurodevelopmental syndrome and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that the CSNK2B variant or 6p21.33 deletion should be considered in patients with intellectual disability and epilepsy, especially those characterized by biphasic patterns and digital anomalies."
    explanation: Authors recommend considering 6p21.33 deletion as well as sequence variants, which requires a copy-number test.

animal_models:
- name: Csnk2b heterozygous mouse
  species: Mouse
  genotype: Csnk2b+/-
  description: >-
    Csnk2b haploinsufficient mice show social and cognitive deficits,
    anxiety-like behavior, spontaneous myoclonic and generalized tonic-clonic
    seizures, cortical thinning, fewer cortical parvalbumin interneurons,
    growth impairment and reduced survival. Early postnatal AAV-PHP.eB
    delivery of human CSNK2B improved survival and rescued structural,
    behavioral and seizure phenotypes.
  publication: PMID:42190665
  modeled_mechanisms:
  - target: Reduced Cortical Parvalbumin Interneurons
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Shows the interneuron deficit; it has not been examined in human tissue, so fidelity cannot be judged.
    limitations: >-
      The interneuron deficit is described only in the mouse; no human
      neuropathology is available for comparison.
    evidence:
    - reference: PMID:42190665
      reference_title: "CSNK2B gene replacement rescues autism-related phenotypes and establishes translational EEG biomarkers."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generate Csnk2b haploinsufficient mice that recapitulate key disease features, including social and cognitive deficits, anxiety-like behavior, spontaneous seizures, cortical abnormalities, and reduced inhibitory interneurons."
      explanation: Model carries the human genetic state and shows the interneuron deficit.
  - target: Seizure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Spontaneous myoclonic and generalized tonic-clonic seizures with ECoG discharges, as in patients.
    limitations: Seizures were studied in adult mice, whereas human onset is usually in infancy.
    evidence:
    - reference: PMID:42190665
      reference_title: "CSNK2B gene replacement rescues autism-related phenotypes and establishes translational EEG biomarkers."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A subset of adult Csnk2b+/− mice (7 out of 10) displayed overt behavioral features of epileptic seizures, including wild running, myoclonic seizures, and generalized tonic-clonic seizures"
      explanation: Spontaneous seizures in the model.
  - target: Abnormal Cortical Development
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Reduced cortical thickness with fewer upper-layer and layer 6 neurons.
    limitations: >-
      Brain MRI is normal in most patients, so whether the cortical thinning
      seen in the mouse occurs in humans is not established.
    evidence:
    - reference: PMID:42190665
      reference_title: "CSNK2B gene replacement rescues autism-related phenotypes and establishes translational EEG biomarkers."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a significant reduction in cortical thickness in Csnk2b+/− mice compared with WT littermates"
      explanation: Histological measurement of cortical thinning in the model.
  - target: Cortical Network Hyperexcitability and Desynchronization
    relationship: RESCUES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Postnatal CSNK2B gene replacement restores neuronal and circuit deficits
      and normalizes ECoG activity signatures. CK2 activity itself was not
      reported as measured, so restoration of the holoenzyme is inferred.
    evidence:
    - reference: PMID:42190665
      reference_title: "CSNK2B gene replacement rescues autism-related phenotypes and establishes translational EEG biomarkers."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Early postnatal adeno-associated virus (AAV)-mediated CSNK2B gene replacement restored neuronal and circuit deficits, normalized electrophysiological signatures, improved survival, and ameliorated behavioral phenotypes."
      explanation: Gene replacement rescue supports reduced CSNK2B dosage as the cause of the phenotypes.

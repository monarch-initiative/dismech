  - reference: PMID:34862840
    reference_title: A homozygous CAP2 pathogenic variant in a neonate presenting with rapidly progressive cardiomyopathy and nemaline rods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Both parents were heterozygous for the same variant but have no history of heart or muscle disease.
    explanation: Unaffected heterozygous parents of a homozygous affected infant support recessive inheritance.
  - reference: PMID:42344352
    reference_title: '"Double-hit" precipitates fulminant cardiac dysfunction in a child with homozygous CAP2 variant: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Segregation analysis confirmed autosomal recessive inheritance, with both parents identified as obligate heterozygous carriers (Figure 2B).
    explanation: Trio segregation in a consanguineous family with a homozygous nonsense variant.
  - reference: PMID:30518548
    reference_title: CAP2 mutation leads to impaired actin dynamics and associates with supraventricular tachycardia and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: This is the first report of a recessive deleterious mutation in CAP2 and its association with DCM in humans.
    explanation: The founding report describes the variant as recessive in two consanguineous Bedouin children.
pathophysiology:
- name: Biallelic CAP2 Loss-of-Function Variants
  description: Reported alleles are an exon 7 donor splice-site variant causing skipping of exons 6 and 7, two nonsense variants (p.Tyr316Ter as summarized by panel curation, and c.551G>A p.Trp184Ter) and a frameshift (c.1288delT, p.Cys430fs), all homozygous. The splice and frameshift alleles were shown to reduce or abolish CAP2 protein in patient cells; the nonsense alleles are predicted loss of function.

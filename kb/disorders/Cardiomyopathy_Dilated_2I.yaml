discussions:
- discussion_id: few_families_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How secure is the CAP2-CMD2I gene-disease relationship, and what is the full phenotypic spectrum?
  attaches_to:
  - genetic#CAP2
  rationale: The human evidence is five genotyped patients in four families, all homozygous for truncating or splice alleles, without a ClinGen classification. Extracardiac features (nemaline rods, hypotonia, abnormal scarring, atrial septal defect) were each seen in a single patient, and supraventricular tachycardia is documented only in the title of the founding report. Penetrance, carrier risk, the frequency of each feature and long-term prognosis cannot be estimated.
  evidence:
  - reference: PMID:30762586
    reference_title: Targeting MRTF/SRF in CAP2-dependent dilated cardiomyopathy delays disease onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: Comparison of the CAP2-KO and CAP2-CKO mice with human CAP2-DCM is in the early stages because only 2 patients have been described with homozygous CAP2 mutations (21).
    explanation: In 2019 the human evidence was two patients; it has since grown only to five.
- discussion_id: mouse_human_extracardiac_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why do Cap2 knockout mice show male-biased lethality, microphthalmia and growth failure that are not reported in patients?
  attaches_to:
  - animal_models#Cap2 whole-body knockout mouse
  - animal_models#Cap2 gene-trap mouse
  rationale: Whole-body knockout mice resemble the contiguous 6p22 deletion syndrome, whereas the founding patients reproduce the cardiac features only. Some mouse extracardiac features may reflect species differences or background effects. Human sex differences cannot be assessed with five patients.
  evidence:
  - reference: PMID:30518548
    reference_title: CAP2 mutation leads to impaired actin dynamics and associates with supraventricular tachycardia and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: The clinical phenotype recapitulates the damaging effects on the heart observed in Cap2 knockout mice including DCM and cardiac conduction disease, but not the other effects on growth, viability, wound healing and eye development.
    explanation: Direct comparison of patient and mouse phenotypes.
  - reference: PMID:26616005
    reference_title: CAP2 in cardiac conduction, sudden cardiac death and eye development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: CAP2 knockouts resembled patients with 6p22 syndrome in that mice were smaller and they developed microphthalmia and cardiac disease.
    explanation: Mouse extracardiac phenotype.
- discussion_id: cardiomyocyte_autonomy_of_dcm
  kind: CONTROVERSY
  status: OPEN
  prompt: Is dilated cardiomyopathy a cardiomyocyte-autonomous consequence of CAP2 loss, or does it require loss in other cell types?
  attaches_to:
  - animal_models#Cardiomyocyte-specific Cap2 knockout mouse
  - pathophysiology#Impaired Myocardial Contractility
  rationale: The 2015 study found that cardiomyocyte-specific knockout mice die of complete heart block before significant DCM, whereas the 2019 study from the same group reports robust DCM in the conditional line and used it for the SRF-inhibitor experiment. The difference may reflect timing, background or how DCM was assessed.
  evidence:
  - reference: PMID:26616005
    reference_title: CAP2 in cardiac conduction, sudden cardiac death and eye development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: We found that the mice developed CCD, leading to sudden cardiac death from complete heart block, but no longer developed DCM or the other phenotypes, including sex bias.
    explanation: 2015 conditional-knockout result.
  - reference: PMID:30762586
    reference_title: Targeting MRTF/SRF in CAP2-dependent dilated cardiomyopathy delays disease onset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: However, CAP2-CKO mice develop a robust DCM, so we used CAP2-CKO mice to test the functional importance of SRF in CAP2 DCM.
    explanation: 2019 conditional-knockout result.
- discussion_id: srf_direction_cell_type
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does CAP2 loss activate or suppress MRTF-SRF signaling in human cardiomyocytes?
  attaches_to:
  - pathophysiology#MRTF-SRF Pathway Activation
  rationale: Knockout mouse hearts show MRTFB nuclear accumulation and SRF target activation, whereas knockout mouse embryonic fibroblasts show reduced nuclear MRTF-A and SRF activity. No measurement exists in patient cardiomyocytes or iPSC-derived cardiomyocytes, although such cells have been generated from one patient.
  evidence:
  - reference: PMID:33637797
    reference_title: Cyclase-associated protein 2 (CAP2) controls MRTF-A localization and SRF activity in mouse embryonic fibroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: In summary, our data revealed that in MEFs CAP2 controls basal MRTF-A localization and SRF activity, while it was dispensable for serum-induced nuclear MRTF-A translocation and SRF stimulation.
    explanation: Opposite direction of effect in fibroblasts.
- discussion_id: infection_second_hit
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: Do intercurrent infections precipitate decompensation in CMD2I, and should prevention be part of management?
  attaches_to:
  - pathophysiology#Intercurrent Viral Infection as Decompensation Trigger
  rationale: The proposal comes from one child presenting with heart failure during rhinovirus pneumonia, without myocardial viral testing. The authors note that fever, tachycardia and systemic inflammation could explain decompensation without direct myocardial injury.
  evidence:
  - reference: PMID:42344352
    reference_title: '"Double-hit" precipitates fulminant cardiac dysfunction in a child with homozygous CAP2 variant: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: In addition, fever-induced tachycardia, increased myocardial oxygen demand, and systemic inflammatory responses related to infection may have independently or synergistically contributed to acute cardiac decompensation, beyond direct viral myocardial injury.
    explanation: The authors' own alternative explanation.
  - reference: PMID:42344352
    reference_title: '"Double-hit" precipitates fulminant cardiac dysfunction in a child with homozygous CAP2 variant: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: First, although rhinovirus infection was identified as the “second hit” in our double-hit model, we did not perform endomyocardial biopsy with viral PCR or serial serum viral load measurements to confirm direct myocardial invasion.
    explanation: The authors' own limitation on the proposed trigger.
notes: CMD2I (MONDO:0957545; OMIM 620462) is caused by biallelic CAP2 (hgnc:20039; gene MIM 618385) variants and is distinct from other recessive CMD2 subtypes. No ClinGen gene-disease validity record for CAP2 exists in the repository's cache, so gene_disease_validity is left empty. `just check-genereviews --online` returned NO_CHAPTER for both GeneReviews and StatPearls (Bookshelf index snapshot 2026-09-10 plus live PubMed search). The full texts of the founding Bedouin report and the neonatal nemaline-rod report were not retrievable, so the exact splice HGVS and the supraventricular tachycardia details are not quoted. Treatment entries other than heart transplantation and the inotropes used in one patient are general pediatric heart-failure guidance, not CAP2-specific evidence. A GenCC-derived record seen during deep research lists CAP2 with familial isolated dilated cardiomyopathy as autosomal dominant (Supportive); it is not cached here and conflicts with the recessive inheritance in every reported family, where heterozygous parents are unaffected. An implantable cardioverter-defibrillator is not listed, because no source evaluates it in CMD2I despite the sudden-death phenotype of conditional knockout mice.

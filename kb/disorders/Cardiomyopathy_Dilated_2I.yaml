      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: RNA sequencing analysis of CAP2-KO hearts and isolated cardiomyocytes revealed overactivation of fetal genes, including serum response factor-regulated (SRF-regulated) genes such as Myl9 and Acta2 prior to the emergence of cardiac disease.

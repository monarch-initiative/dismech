genetic:
- name: CAP2
  gene_term:
    preferred_term: CAP2
    term:
      id: hgnc:20039
      label: CAP2
  variant_origin: GERMLINE
  association: Autosomal recessive cause of pediatric dilated cardiomyopathy supported by homozygous loss-of-function variants in four families (five genotyped patients), patient-cell loss-of-function studies and concordant mouse models. The human evidence is limited to a few families, and there is no ClinGen gene-disease validity classification.
  notes: Reported alleles (NM_006366) are an exon 7 donor splice-site variant (Bedouin family; exact HGVS not in the cached abstract), a homozygous nonsense allele in a Pakistani family (reported as p.Tyr316Ter in panel curation; not stated in the cached text), c.1288delT p.Cys430fs, and c.551G>A p.Trp184Ter. The symbol CAP2 was formerly also used for SERPINB8, and "CAP2" is also the name of an unrelated left atrial appendage closure registry; this entry refers only to cyclase-associated protein 2 (hgnc:20039). relationship_type is left unset because no ClinGen or other external tier classifies CAP2 for this disease, and the schema reserves CAUSATIVE for Definitive or Strong relationships.
  evidence:
  - reference: PMID:30518548
    reference_title: CAP2 mutation leads to impaired actin dynamics and associates with supraventricular tachycardia and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Using exome sequencing and searching for rare homozygous variations, we identified a nucleotide change in the donor splice consensus sequence of exon 7 in CAP2 as the causative mutation.
    explanation: Founding family.
  - reference: PMID:33083013
    reference_title: Genomic testing in 1019 individuals from 349 Pakistani families results in high diagnostic yield and clinical utility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Taking both studies into account, these findings strongly suggest a role of CAP2 in DCM and the importance of this gene for normal function of the human heart.
    explanation: Independent replication in a second family.
  - reference: PMID:34862840
    reference_title: A homozygous CAP2 pathogenic variant in a neonate presenting with rapidly progressive cardiomyopathy and nemaline rods.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Whole exome sequencing identified a c.1288 delT (homozygous pathogenic variant) in the CAP2 gene (NM_006366), yielding a CAP2 protein (NP_006357.1) with a p.C430fs.
    explanation: Third family.
  - reference: PMID:42344352
    reference_title: '"Double-hit" precipitates fulminant cardiac dysfunction in a child with homozygous CAP2 variant: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Exome sequencing (ES) identified a novel homozygous variant in CAP2 c.551G > A (p.W184*; NM_006366.3).
    explanation: Fourth family.

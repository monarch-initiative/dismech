genetic:
- name: GFI1B
  gene_term:
    preferred_term: GFI1B
    term:
      id: hgnc:4238
      label: GFI1B
  association: Heterozygous dominant-negative zinc-finger variants, or recessive isoform-selective loss of GFI1B-p37
  relationship_type: CAUSATIVE
  features: >-
    GFI1B encodes a six-zinc-finger transcriptional repressor with an N-terminal
    SNAG repression domain, paralogous to GFI1 and mapping to 9q34.13. The
    dominant alleles reported so far (including a nonsense variant and the
    frameshift p.Gly272fsX274) all disrupt the essential DNA-binding domain,
    abolish consensus-site recognition, fail to repress a reporter gene, and act
    dominant-negatively over wild-type protein. A mechanistically separate
    recessive form arises from a homozygous insertion (p.Ser185Leufs*3) that
    truncates only the full-length p37 isoform, sparing the shorter p32 variant
    produced by alternative splicing of exon 9.
  evidence:
  - reference: PMID:27122003
    reference_title: "Functional characterization of a novel GFI1B mutation causing congenital macrothrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.G272fsX274 and the previous two mutations all predicted disruption of an
      essential DNA-binding domain in GFI1B.
    explanation: >-
      Establishes that the reported dominant alleles converge on the same
      functional domain.
  - reference: PMID:28401061
    reference_title: "Transcription Factor GFI1B in Health and Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both GFI1 and GFI1B have six C-terminal C2H2 zinc fingers and an N-terminal
      SNAG (SNAIL/GFI1) transcriptional repression domain.
    explanation: Describes the protein architecture the pathogenic variants disrupt.

    Homozygous Gfi1b deletion in mice is embryonically lethal through failure to
    produce mature enucleated erythrocytes, yet human GFI1B disease presents as a
    platelet disorder with largely preserved erythropoiesis. How far does the
    mouse null actually model the human erythroid requirement for GFI1B?
  rationale: >-
    The mouse knockout is the main evidence that GFI1B is required for erythroid
    development, and it is unambiguous: the animals die in utero from failed
    erythrocyte maturation. Human patients do not reproduce that. The
    isoform-selective kindred explains its own case cleanly, since the erythroid
    isoform p32 is retained there, but it does not explain why the dominant
    negative alleles, which disrupt both isoforms, also present as
    macrothrombocytopenia rather than as anaemia. Either the human erythroid
    lineage tolerates partial GFI1B disruption in a way the mouse null cannot
    test, or a human-specific compensatory factor operates downstream of the
    megakaryocyte-erythroid progenitor. Until this is settled, the mouse null
    should not be cited as evidence for a human erythroid phenotype in this
    disorder, and this entry does not curate one.
  proposed_experiments:
  - experiment_id: exp_gfi1b_isoform_selective_lineage_output
    name: Isoform-selective depletion in human MEP-stage progenitors
    description: >-
      Selectively deplete p37 versus p32 versus both in human CD34-positive
      progenitors and compare erythroid differentiation, enucleation efficiency
      and megakaryocyte maturation, testing directly whether the lineage split
      inferred from one kindred is a general property of the human
      megakaryocyte-erythroid progenitor.
    decision_criterion: >-
      A clean split, with p37 depletion giving a megakaryocyte defect and p32
      depletion an erythroid one, would establish isoform-specific lineage
      commitment in humans and retire the mouse null as the reference model for
      the erythroid arm. A shared defect would instead mean the kindred's
      preserved erythropoiesis needs a different explanation.
  - experiment_id: exp_gfi1b_erythroid_indices_across_allele_classes
    name: Red-cell phenotyping across dominant-negative and isoform-selective alleles
    description: >-
      Compare red cell indices, reticulocyte counts and marrow erythroid
      morphology between patients carrying dominant-negative zinc-finger alleles,
      which affect both isoforms, and those carrying the isoform-selective p37
      lesion, controlling for iron status, splenic function and any
      thrombopoietin receptor agonist exposure.
    decision_criterion: >-
      A subclinical erythroid phenotype confined to the dominant-negative group
      would make the human requirement real but milder than the mouse predicts.
      Normal indices in both groups would place the species difference itself, not
      allele dosage, as the thing needing explanation.

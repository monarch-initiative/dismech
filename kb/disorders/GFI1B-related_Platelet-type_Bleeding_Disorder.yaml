name: GFI1B-related platelet-type bleeding disorder
creation_date: "2026-08-24T22:35:00Z"
category: Mendelian
description: >-
  Platelet-type bleeding disorder 17 (BDPLT17) is an inherited
  macrothrombocytopenia with a grey-platelet-like phenotype, caused by variants
  in GFI1B, the zinc-finger transcriptional repressor required for megakaryocyte
  and erythrocyte development. Platelets are large, deficient in alpha granules
  (often with a delta-granule defect as well), stain poorly on
  May-Grunwald-Giemsa, function abnormally, and ectopically express the
  progenitor marker CD34 — a marker that is normally lost as megakaryocytes
  mature and that has been proposed as a screening test. Bleeding ranges from
  cutaneous petechiae and epistaxis to fatal cerebral haemorrhage. Two genetically
  distinct routes are documented and are not interchangeable: heterozygous
  zinc-finger variants act as dominant negatives over wild-type GFI1B, while a
  recessive form arises from isoform-selective loss of the full-length p37
  protein with the shorter p32 isoform retained. The disorder
  is distinct from classic NBEAL2 grey platelet syndrome despite the shared
  platelet appearance.
disease_term:
  preferred_term: platelet-type bleeding disorder 17
  term:
    id: MONDO:0008553
    label: platelet-type bleeding disorder 17
parents:
- inherited bleeding disorder, platelet-type
synonyms:
- platelet-type bleeding disorder 17
- BDPLT17
- GFI1B-related thrombocytopenia
- autosomal dominant gray platelet syndrome
- GFI1B-related macrothrombocytopenia
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The originally described and most common form. Heterozygous variants
    disrupting the zinc-finger DNA-binding region produce a mutant protein that
    inhibits wild-type GFI1B, so a single allele suffices.
  evidence:
  - reference: PMID:24325358
    reference_title: "A dominant-negative GFI1B mutation in the gray platelet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected a nonsense mutation in the gene encoding the transcription
      factor GFI1B (growth factor independent 1B) that causes autosomal dominant
      gray platelet syndrome.
    explanation: Establishes autosomal dominant transmission for the founding variant.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A separate recessive form was reported in a consanguineous kindred whose
    affected members carry a homozygous insertion creating a premature stop codon
    in the full-length p37 isoform only; heterozygous carriers, including both
    parents, are clinically unaffected. This is a different molecular lesion from
    the dominant-negative alleles, not a dosage variant of them.
  evidence:
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, the index patient's husband (II.4), her parents (I.1 and I.2)
      and the children of the deceased brother (III.1, III.2, III.3) were
      clinically unaffected.
    explanation: >-
      Unaffected heterozygous carriers including both parents establish recessive
      transmission in this kindred.
notes: >-
  **The two inheritance patterns here are two different molecular lesions, and
  the entry keeps them apart.** This is not the same situation as a contested
  mode of inheritance. The dominant alleles are zinc-finger variants whose
  product actively inhibits wild-type GFI1B — demonstrated in reporter assays,
  and accompanied by abolished consensus-site binding in gel shift. The
  recessive family instead carries an isoform-selective stop codon that removes
  only the full-length p37 protein, leaving the shorter p32 isoform expressed,
  with heterozygous carriers unaffected. Collapsing these into one "GFI1B
  loss-of-function" claim would erase the dominant-negative mechanism, which is
  the reason a single allele is sufficient in most reported patients. The
  pathophysiology therefore carries two trigger nodes, and the `genetic` entry
  uses `functional_impact_category: DOMINANT_NEGATIVE` for the dominant arm.

  **Ectopic platelet CD34 is curated as a phenotype, not as a mechanism.** It is
  reproducible across independent reports and has been proposed as a screening
  test, but no source cited here shows that CD34 expression itself contributes
  to the bleeding. It is curated as a laboratory phenotype of arrested
  megakaryocyte maturation.

  **Two cached records carry no abstract.** `PMID:28096094` and `PMID:28580815`
  are both directly relevant by title, but the cached PubMed records hold
  metadata only, so there is no quotable text and nothing is cited from them.
  Per the evidence SOP a title is not a finding, so they are omitted entirely
  rather than cited on their titles.

  **Naming.** MONDO's OMIM xref for this entity is 187900, while PMID:28550182
  writes "BDPLT17 (MIM 604383)" — 604383 is the GFI1B *gene* MIM number. The
  entry makes no OMIM claim to avoid propagating that conflation.

  Research input: `research/Platelet-type_Bleeding_Disorder_17-deep-research-perplexity.md`,
  NEC preflight PASS against MONDO:0008553 (GFI1B mentioned 178 times). It
  returned no PMIDs in its body; all references were located independently in
  PubMed.
pathophysiology:
- name: Dominant-Negative GFI1B Zinc-Finger Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous variants disrupting the essential DNA-binding zinc-finger region
    yield a protein that cannot bind its consensus site, cannot repress
    transcription, and actively interferes with the wild-type allele's activity.
    The dominant-negative behaviour has been shown for three independent
    patient-derived alleles.
  genes:
  - preferred_term: GFI1B
    term:
      id: hgnc:4238
      label: GFI1B
  molecular_functions:
  - preferred_term: "DNA-binding transcription repressor activity, RNA polymerase II-specific"
    term:
      id: GO:0001227
      label: "DNA-binding transcription repressor activity, RNA polymerase II-specific"
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:24325358
    reference_title: "A dominant-negative GFI1B mutation in the gray platelet syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The GFI1B mutant protein inhibited nonmutant GFI1B transcriptional activity
      in a dominant-negative manner.
    explanation: >-
      Direct functional demonstration of the dominant-negative effect on wild-type
      GFI1B.
  - reference: PMID:27122003
    reference_title: "Functional characterization of a novel GFI1B mutation causing congenital macrothrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with the previous studies, the three patient-derived mutants were
      unable to repress the expression of the reporter gene and had a
      dominant-negative effect over wild-type GFI1B. In addition, the three
      mutations abolished recognition of a consensus-binding site in gel shift
      assays.
    explanation: >-
      Replicates the dominant-negative effect across three alleles and adds the
      loss of DNA binding that explains it.
  downstream:
  - target: Impaired GFI1B-Dependent Megakaryocyte Maturation
    description: >-
      Loss of GFI1B repressor activity in megakaryocytes derails the
      transcriptional programme those cells depend on.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24325358
      reference_title: "A dominant-negative GFI1B mutation in the gray platelet syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, the megakaryocytes had dysplastic features, and they were
        abnormally distributed in the bone marrow.
      explanation: >-
        Documents the megakaryocyte abnormality in patients carrying the
        dominant-negative allele.
- name: Isoform-Selective Loss of Full-Length GFI1B-p37
  biological_scale: MOLECULAR
  description: >-
    Alternative splicing of exon 9 produces two GFI1B isoforms: the full-length
    p37 protein with all six zinc fingers, and a shorter p32 isoform lacking the
    first two zinc fingers, which is the one necessary for human erythropoiesis.
    In a consanguineous kindred with severe recessive bleeding, a homozygous
    insertion creates a premature stop codon that affects only the longer p37
    transcript, leaving p32 intact. GFI1B protein was undetectable in the index
    patient's megakaryocytes. Because the retained p32 covers the erythroid
    requirement, these patients have a platelet disease with essentially
    unaffected erythropoiesis, which is what makes this family evidence for
    isoform-specific lineage commitment at the megakaryocyte-erythroid
    progenitor stage rather than simply a milder GFI1B deficiency.
  genes:
  - preferred_term: GFI1B
    term:
      id: hgnc:4238
      label: GFI1B
  evidence:
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, alternative splicing of exon 9 leads to the formation of a
      shorter isoform of GFI1B (p32; NP_001128503). This isoform lacks the first
      two zinc fingers as compared to the p37 full length protein (NP_004179) and
      is implicated in erythropoiesis.
    explanation: >-
      Defines the two isoforms and assigns the erythroid role to the shorter p32,
      which is the isoform retained in these patients.
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the insertion variant identified in this family results in a premature stop
      codon (p.Ser185Leufs*3) that only affects the longer p37 isoform
    explanation: >-
      Establishes that the lesion is isoform-selective, removing p37 while leaving
      p32 expressed.
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GFI1B was present in most HC megakaryocytes (left column), but absent in the
      index patient's megakaryocytes
    explanation: >-
      Demonstrates absence of GFI1B protein in the patient's megakaryocytes,
      distinguishing this from the dominant-negative mechanism.
  downstream:
  - target: Impaired GFI1B-Dependent Megakaryocyte Maturation
    description: >-
      Loss of the p37 isoform removes GFI1B function from the megakaryocyte
      lineage while sparing the erythroid lineage that p32 serves.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28550182
      reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        abrogating the complete GFI1B-p37 isoform results in autosomal-recessive
        macrothrombocytopenia with diminished platelet function as seen in the
        presented trait
      explanation: >-
        States the causal consequence of losing p37 specifically.
- name: Impaired GFI1B-Dependent Megakaryocyte Maturation
  biological_scale: CELLULAR
  description: >-
    GFI1B is a SNAG-domain transcriptional repressor that recruits histone
    deacetylases and histone methyltransferases, and mouse knockouts establish
    that it is required for both megakaryocytic and erythroid development. When
    its repressor function is lost, megakaryocytes become dysplastic, are
    abnormally distributed in the marrow, retain the progenitor marker CD34 that
    maturing megakaryocytes normally lose, and produce enlarged proplatelet tips
    in reduced numbers.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: megakaryocyte differentiation
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
    modifier: ABNORMAL
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28401061
    reference_title: "Transcription Factor GFI1B in Health and Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, knockout mice have demonstrated that Gfi1b is required for
      development of both erythroid and megakaryocytic lineages.
    explanation: >-
      Establishes the lineage requirement for GFI1B in a model system, underlying
      the human phenotype.
  - reference: PMID:27122003
    reference_title: "Functional characterization of a novel GFI1B mutation causing congenital macrothrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant-transduced megakaryocytes produced enlarged proplatelet tips which
      were reduced in number.
    explanation: >-
      Links the transcriptional defect to the cell-biological step that produces
      few, large platelets.
  downstream:
  - target: Large Granule-Deficient Dysfunctional Platelets
    description: >-
      Abnormal proplatelet formation yields a reduced number of enlarged platelets
      lacking normal granule content.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24325358
      reference_title: "A dominant-negative GFI1B mutation in the gray platelet syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both gray platelets and megakaryocytes had abnormal marker expression.
      explanation: >-
        Connects the megakaryocyte defect to the abnormal platelets it produces.
- name: Large Granule-Deficient Dysfunctional Platelets
  biological_scale: CELLULAR
  description: >-
    Circulating platelets are reduced in number, enlarged, and stain poorly with
    May-Grunwald-Giemsa. Alpha-granule markers von Willebrand factor and
    P-selectin are reduced, and a delta-granule defect is often present as well,
    giving a combined alpha-delta storage pool deficiency. Aggregation and
    activation responses to ADP, collagen, TRAP-6 and arachidonic acid are
    impaired, so the bleeding tendency reflects both a low count and defective
    function.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  cellular_components:
  - preferred_term: platelet alpha granule
    term:
      id: GO:0031091
      label: platelet alpha granule
    modifier: DECREASED
  evidence:
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      decreased immunofluorescence staining for alpha-granule markers von
      Willebrand factor and P-selectin, suggesting an alpha storage pool
      deficiency
    explanation: Documents the alpha-granule deficiency directly.
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Platelet function testing by flow cytometry and aggregometry revealed
      reduced responses to ADP, collagen, TRAP-6 and arachidonic acid
    explanation: >-
      Establishes the functional defect independent of the reduced platelet count.
  downstream:
  - target: Bleeding Diathesis
    description: >-
      Reduced numbers of functionally defective platelets produce a clinically
      significant bleeding tendency.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28401061
      reference_title: "Transcription Factor GFI1B in Health and Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Consistent with this, human mutations of GFI1B produce bleeding disorders
        with low platelet count and abnormal function.
      explanation: >-
        States both components of the bleeding phenotype, count and function.
- name: Bleeding Diathesis
  biological_scale: ORGANISM
  description: >-
    Clinical severity ranges widely. In the reported recessive kindred it was
    life-threatening: the index patient had petechiae and haematoma from
    childhood and repeated emergency surgery for intra-abdominal bleeding, and
    her brother died at 33 of spontaneous cerebral haemorrhage. Milder
    presentations with cutaneous bleeding and epistaxis are also described. The
    disorder is misdiagnosable as immune thrombocytopenia, and the index patient
    had been splenectomised and treated with a thrombopoietin receptor agonist
    without improvement before the genetic diagnosis was made.
  evidence:
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index patient's brother (II.2) had also suffered from a severe bleeding
      diathesis with thrombocytopenia, and had died at age 33 due to a spontaneous
      cerebral hemorrhage.
    explanation: >-
      Documents the fatal end of the severity range in a genetically confirmed
      family.

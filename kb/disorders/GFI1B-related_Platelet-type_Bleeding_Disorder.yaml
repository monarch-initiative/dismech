  description: >-
    Immunofluorescence for platelet CD34 has been proposed as a screening test:
    the marker is ectopically present in this disorder and absent from normal
    mature platelets. It is a screening aid rather than a confirmatory test, and
    the diagnosis rests on sequencing.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:27122003
    reference_title: "Functional characterization of a novel GFI1B mutation causing congenital macrothrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An immunofluorescence analysis of the platelet CD34 expression can be useful
      as a screening test.
    explanation: The authors' own proposal of CD34 as a screening test.

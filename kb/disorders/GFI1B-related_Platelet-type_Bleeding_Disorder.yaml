    explanation: Establishes the smear appearance that prompts further testing.
- name: Distinction from Immune Thrombocytopenia
  description: >-
    An inherited macrothrombocytopenia is readily mistaken for immune
    thrombocytopenia, with real consequences: the reported index patient had been
    splenectomised and started on a thrombopoietin receptor agonist under a
    working diagnosis of hepatitis C-associated ITP, without improvement in the
    bleeding phenotype.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:28550182
    reference_title: "Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence of the splice isoform GFI1B-p37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      she was splenectomized and being treated with eltrombopag (according to a
      working diagnosis of hepatitis C-associated immune thrombocytopenia), but
      the bleeding phenotype had not improved
    explanation: >-
      A documented case of the misdiagnosis and of the ineffective treatment that

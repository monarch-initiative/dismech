- name: Ectopia Lentis
  description: >
    Subluxation or frank dislocation of the ocular lens is the characteristic
    extraneurological feature of ISOD and may be the presenting sign in the milder
    late-onset form, sometimes with otherwise minimal neurological involvement. It
    typically becomes evident after the newborn period. The mechanism is presumed to
    involve sulfite-mediated damage to the disulfide-rich zonular fibres that suspend
    the lens, but this remains a hypothesis rather than a demonstrated step (see
    discussions).

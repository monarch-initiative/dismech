- name: Late-onset ISOD
  display_name: Late-onset (mild) ISOD
  description: >
    Milder form manifesting between six and 18 months of age with variably present
    ectopia lentis, developmental delay or regression, a movement disorder of
    dystonia and choreoathetosis, ataxia and rarely metabolic stroke. The course may
    be progressive or episodic. Biallelic missense genotypes are enriched in this
    presentation.
  genes:
  - preferred_term: SUOX

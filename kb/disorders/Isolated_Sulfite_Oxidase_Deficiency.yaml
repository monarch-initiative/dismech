      evidence_source: IN_VITRO
      snippet: "demonstrated that it acts as an N-methyl D-aspartate receptor (NMDA-R) agonist, leading to calcium influx and downstream cell signaling events and neurotoxicity"
      explanation: >-
        Demonstrates SSC agonism at the NMDA receptor with calcium influx and
        neurotoxicity. Shown for SSC accumulating in molybdenum cofactor deficiency,

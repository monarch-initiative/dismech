    reference_title: "S-sulfocysteine/NMDA receptor-dependent signaling underlies neurodegeneration in molybdenum cofactor deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SSC treatment activated the protease calpain, and calpain-dependent degradation of the inhibitory synaptic protein gephyrin subsequently exacerbated SSC-mediated excitotoxicity and promoted loss of GABAergic synapses."
    explanation: >-
      Establishes loss of GABAergic synapses as the endpoint of the calpain-gephyrin
      arm and shows that it feeds back to exacerbate the excitotoxicity.
  downstream:
  - target: Neonatal Epileptic Encephalopathy
    description: >
      The excitation/inhibition imbalance manifests clinically as intractable
      neonatal seizures with rapidly progressive encephalopathy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31001109
      reference_title: "S-Sulfocysteine Induces Seizure-Like Behaviors in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Seizure-like movements were fully revertible upon removal of SSC or could be alleviated by a glutamatergic receptor antagonist."
      explanation: >-
        Demonstrates that the seizure phenotype is directly attributable to SSC acting
        at glutamatergic receptors and is reversible when that drive is removed.
- name: Loss of Protein S-Persulfidation and Hydrogen Sulfide Release
  description: >
    A second, more recently defined arm of the pathophysiology: accumulating sulfite
    strips persulfide groups from cysteine residues across the proteome, releasing
    hydrogen sulfide and abolishing a redox-relevant post-translational modification
    on enzymes of amino acid and fatty acid metabolism and of cytosolic iron-sulfur
    cluster biogenesis. This connects ISOD to the wider hydrogen sulfide disorders
    (compare ETHE1 deficiency) and provides a mechanistic rationale for sulfite
    scavenging as therapy.
  role: amplifier
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:41178722
    reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mass spectrometry analysis of total protein persulfidome identified a major loss of S-persulfidation in 20% of the proteome, affecting enzymes in amino acids, fatty acid metabolism, and cytosolic iron-sulfur cluster biogenesis."
    explanation: Quantifies the proteome-wide loss of persulfidation in the SOX-knockout mouse.
  downstream:
  - target: Mitochondrial Dysfunction and Metabolic Rewiring
    description: >
      Loss of persulfidation across metabolic enzymes is accompanied by an altered
      urinary amino acid profile indicating metabolic rewiring and mitochondrial
      dysfunction.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41178722
      reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Urinary amino acid profiles indicated metabolic rewiring and mitochondrial dysfunction, thus identifying an altered H2S metabolism and persulfidation in SOXD."
      explanation: Links the persulfidation defect to mitochondrial dysfunction and metabolic rewiring.
- name: Mitochondrial Dysfunction and Metabolic Rewiring
  description: >
    Secondary bioenergetic failure. Human neuropathology in ISOD — cortical necrosis
    with extensive cavitating leukoencephalopathy resembling perinatal asphyxia — has
    long been read as evidence that an energy-deficiency component contributes
    alongside excitotoxicity.
  role: amplifier
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:9050047
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathological findings of cortical necrosis and extensive cavitating leukoencephalopathy were reminiscent of those seen in severe perinatal asphyxia suggesting an etiology of energy deficiency."
    explanation: >-
      Human autopsy findings interpreted by the authors as indicating an
      energy-deficiency contribution to the brain injury.
  downstream:
  - target: Excitotoxic Neuronal Death and Cystic Encephalomalacia
    description: >
      Bioenergetic compromise lowers the threshold for excitotoxic injury and
      contributes to the cavitating pattern of destruction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:9050047
      reference_title: "Isolated sulfite oxidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neuropathological findings of cortical necrosis and extensive cavitating leukoencephalopathy were reminiscent of those seen in severe perinatal asphyxia suggesting an etiology of energy deficiency."
      explanation: >-
        Supports the association of energy deficiency with the cavitating necrotic
        lesion, but the causal intermediates between bioenergetic failure and the
        specific lesion pattern are not established.

    explanation: Links the milder/atypical presentations to biallelic missense genotypes.
mechanistic_hypotheses:
- hypothesis_group_id: zonular_disulfide_reduction
  hypothesis_label: Sulfite-Mediated Zonular Disulfide Reduction
  status: EMERGING
  description: >-
    The widely repeated explanation for ectopia lentis in ISOD is that sulfite, a
    nucleophilic anion, reduces the disulfide bonds cross-linking the fibrillin-rich
    zonular fibres that suspend the lens, weakening them until the lens subluxes. It
    is chemically plausible and would explain the phenotypic convergence with
    homocystinuria and Marfan syndrome, where zonular integrity also fails. However,
    no primary study demonstrating the step in ISOD (or SUOX-deficient) zonular tissue
    was identified during curation, so the causal edge from Sulfite Accumulation to
    Ectopia Lentis is typed INDIRECT_UNKNOWN_INTERMEDIATES and opted into this group
    rather than presented as established. See the `ectopia_lentis_mechanism_unresolved`
    discussion for the experiments that would resolve it.
  notes: >-
    Status EMERGING rather than CANONICAL deliberately: the clinical association is
    solid, the mechanism is not.
pathophysiology:
- name: SUOX Sulfite Oxidase Deficiency
  description: >
    Biallelic loss-of-function variants in SUOX abolish the activity of sulfite
    oxidase, the molybdenum-cofactor- and heme-containing homodimeric enzyme of the
    mitochondrial intermembrane space that catalyses the terminal, irreversible step
    of sulfur amino acid catabolism — oxidation of sulfite to sulfate. Because the
    lesion is confined to SUOX itself, the other molybdenum-cofactor-dependent
    enzymes (notably xanthine dehydrogenase) remain intact, which is the biochemical
    basis for distinguishing ISOD from molybdenum cofactor deficiency.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SUOX
    term:
      id: hgnc:11460
      label: SUOX
  molecular_functions:
  - preferred_term: sulfite oxidase activity
    term:
      id: GO:0008482
      label: sulfite oxidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: sulfur amino acid catabolic process
    term:
      id: GO:0000098
      label: sulfur amino acid catabolic process
    modifier: DECREASED
  - preferred_term: L-cysteine catabolic process
    term:
      id: GO:0019448
      label: L-cysteine catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:33335014
    reference_title: "Isolated sulfite oxidase deficiency: a founder mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated sulfite oxidase deficiency is a rare autosomal recessive inborn error of sulfur metabolism."
    explanation: Establishes ISOD as a recessive inborn error of sulfur metabolism.
  - reference: PMID:9050047
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver sulfite oxidase activity was not detectable but xanthine dehydrogenase activity was normal."
    explanation: >-
      Demonstrates the defining enzymatic signature of the isolated form — absent
      sulfite oxidase activity with preserved xanthine dehydrogenase, i.e. an intact
      molybdenum cofactor.
  - reference: PMID:41178722
    reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sulfite oxidase (SOX) deficiency is a rare inborn error of cysteine metabolism resulting in severe neurological damage."
    explanation: >-
      Places the enzymatic lesion within cysteine catabolism and links it to the
      neurological outcome. Tagged MODEL_ORGANISM because this is the framing
      sentence of a full-body SOX-knockout mouse study rather than a human
      observation; the human evidence for the same claim is the preceding two
      items.
  downstream:
  - target: Sulfite Accumulation
    description: >
      Loss of the terminal oxidative step leaves sulfite, generated continuously from
      dietary and endogenous cysteine catabolism, without a route to sulfate, so it
      accumulates to toxic concentrations.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28933809
      reference_title: "Isolated Sulfite Oxidase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory findings that suggest the diagnosis of ISOD are dipstick positive for urinary sulfite, elevated urinary thiosulfate and S-sulfocysteine, low urinary organic sulfate, and markedly reduced plasma levels of total homocysteine."
      explanation: >-
        Human evidence that the enzymatic block leaves sulfite accumulating —
        urinary sulfite is dipstick positive and its secondary disposal products
        (thiosulfate, S-sulfocysteine) are elevated while organic sulfate output
        falls.
    - reference: PMID:41178722
      reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In patients, sulfite accumulates to toxic levels, causing a rise in the downstream products S-sulfocysteine, which mediates excitotoxicity, and thiosulfate, a catabolic intermediate/product of hydrogen sulfide (H2S) metabolism."
      explanation: >-
        States that loss of sulfite oxidase causes toxic sulfite accumulation.
        Tagged MODEL_ORGANISM because the sentence is introductory framing in a
        SOX-knockout mouse study, not data generated in human patients.
- name: Sulfite Accumulation
  description: >
    Sulfite, a reactive nucleophilic anion, accumulates in tissues and body fluids.
    It is disposed of by two secondary routes that generate the diagnostic
    metabolites of ISOD: reaction with cystine to form S-sulfocysteine, and
    conversion to thiosulfate. The diversion of cystine into S-sulfocysteine also
    contributes to the paradoxical fall in plasma cystine, and organic sulfate output
    falls because the oxidative route to sulfate is blocked.
  role: amplifier
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: sulfite
    term:
      id: CHEBI:17359
      label: sulfite
    modifier: INCREASED
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings that suggest the diagnosis of ISOD are dipstick positive for urinary sulfite, elevated urinary thiosulfate and S-sulfocysteine, low urinary organic sulfate, and markedly reduced plasma levels of total homocysteine."
    explanation: >-
      Documents the full biochemical consequence of the block — sulfite, thiosulfate
      and S-sulfocysteine accumulation with low organic sulfate and low total
      homocysteine.
  downstream:
  - target: S-Sulfocysteine Accumulation
    description: >
      Sulfite reacts with cystine to generate S-sulfocysteine, which is elevated in
      plasma and urine of every reported patient.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16140720
      reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma or urinary S-sulfocysteine levels were elevated in all cases."
      explanation: Establishes S-sulfocysteine accumulation as an invariant consequence across all published cases.
  - target: Ectopia Lentis
    description: >
      Accumulating sulfite is presumed to reach the ocular zonule and compromise the
      disulfide-rich fibrillin microfibrils that suspend the lens. The intermediates
      are unknown and no primary study establishes the step in ISOD tissue, so the
      edge is typed INDIRECT_UNKNOWN_INTERMEDIATES and assigned to the
      `zonular_disulfide_reduction` hypothesis group rather than asserted as an
      evidenced mechanism. Its evidence is the clinical co-occurrence only.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - zonular_disulfide_reduction
    evidence:
    - reference: PMID:36303223
      reference_title: "Mutation analysis of SUOX in isolated sulfite oxidase deficiency with ectopia lentis as the presenting feature: insights into genotype-phenotype correlation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Isolated sulfite oxidase deficiency (ISOD) caused by sulfite oxidase gene (SUOX) mutations is a rare neurometabolic disease associated with ectopia lentis (EL)."
      explanation: >-
        Supports the disease-level association between SUOX deficiency and ectopia
        lentis. Classified PARTIAL because it establishes that the two co-occur, not
        that sulfite accumulation causes zonular failure.
  - target: Loss of Protein S-Persulfidation and Hydrogen Sulfide Release
    description: >
      Accumulating sulfite reacts with protein persulfides, releasing hydrogen
      sulfide and stripping the persulfide post-translational modification from a
      large fraction of the proteome.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41178722
      reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistently, we found increased plasma H2S, which was derived from sulfite-induced release from persulfides, as demonstrated in vitro and in vivo."
      explanation: Demonstrates that accumulated sulfite liberates H2S from protein persulfides in the SOX-knockout mouse.
- name: S-Sulfocysteine Accumulation
  description: >
    S-sulfocysteine (SSC) is a structural analog of glutamate. Its accumulation
    converts the metabolic block into a neurochemical lesion, because SSC is not an
    inert marker but an agonist at ionotropic glutamate receptors.
  role: amplifier
  biological_scale: MOLECULAR

- name: NMDA Receptor Overactivation and Calcium Influx
  description: >
    SSC, a structural analog of glutamate, acts as an agonist at the NMDA receptor.
    The resulting receptor overactivation opens the associated cation conductance and
    loads the neuron with calcium — the proximal molecular event of the excitotoxic
    arm. Receptor activation and the calcium entry it gates are curated as one node
    because they are a single pharmacologically inseparable step: blocking either the
    receptor or the calcium influx abolishes the toxicity equally.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: INCREASED

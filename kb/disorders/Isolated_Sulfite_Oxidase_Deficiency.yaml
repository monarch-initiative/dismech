treatments:
- name: Anticonvulsant therapy for seizures
  description: >
    Anti-seizure medication is the mainstay of symptomatic management, although the
    neonatal seizures of classic ISOD are characteristically pharmacoresistant —
    consistent with the mechanism, in which glutamatergic drive is increased and
    GABAergic inhibitory synapses are actively degraded.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Neonatal seizure
    term:
      id: HP:0032807
      label: Neonatal seizure
  notes: >-
    Deliberately carries no `target_mechanisms` edge. Most anti-seizure medications
    act by potentiating GABAergic inhibitory transmission, but in ISOD those
    inhibitory synapses are themselves being destroyed by calpain-dependent gephyrin
    degradation ("Loss of GABAergic Inhibition") — the drug class is aimed at a node
    whose substrate is disappearing, which is the mechanistic account of the
    characteristic pharmacoresistance. Asserting a therapeutic edge here would
    overstate an effect the literature reports as absent.
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic treatment can include: anti-seizure medication (ASM) for seizures; medications to reduce spasticity; and early consideration of gastrostomy tube placement to manage difficulties with swallowing, assure adequate caloric intake, and reduce risk of aspiration."
    explanation: Documents anti-seizure medication as recommended symptomatic management.
- name: Gastrostomy tube placement
  description: >
    Early gastrostomy is recommended to manage swallowing difficulty, secure caloric
    intake and reduce aspiration risk.
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic treatment can include: anti-seizure medication (ASM) for seizures; medications to reduce spasticity; and early consideration of gastrostomy tube placement to manage difficulties with swallowing, assure adequate caloric intake, and reduce risk of aspiration."
    explanation: Documents early gastrostomy as recommended management of feeding difficulty.
- name: Methionine- and cysteine-restricted diet
  description: >
    Dietary restriction of the sulfur amino acids methionine and cysteine aims to
    reduce the substrate load entering the blocked pathway. Reported benefit is
    limited and confined to late-presenting, milder patients: in a literature review
    of all published cases, clinical improvement on dietary therapy was seen in only
    two patients, both presenting after six months of age with relatively mild
    developmental delay. It is not effective in classic neonatal-onset disease.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Sulfite Accumulation
    treatment_effect: INHIBITS
    description: >-
      Restricting dietary methionine and cysteine lowers the flux of sulfur amino
      acids entering catabolism upstream of the blocked step, reducing the rate at
      which sulfite is generated. The effect is inherently partial because cysteine
      is also supplied endogenously by protein turnover, which is the mechanistic
      reason dietary therapy helps only the mildest, later-presenting patients.
  evidence:
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical improvement with dietary therapy was seen in only 2 patients, both of whom presented after the age of 6 months and had relatively mild developmental delays."
    explanation: >-
      Supports a limited benefit of dietary therapy restricted to milder,
      later-presenting patients; classified PARTIAL because benefit was seen in only
      2 of the reviewed cases.
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient began a low-methionine and low-cysteine diet and was treated with thiamine and dextromethorphan."
    explanation: Documents the composition of the dietary intervention used in ISOD.
- name: Dextromethorphan
  description: >
    Dextromethorphan is a non-competitive NMDA-receptor antagonist and is the
    clinical counterpart of the central excitotoxic mechanism: if S-sulfocysteine
    injures neurons by agonising the NMDA receptor, blocking that receptor should be
    protective. It has been given to ISOD patients alongside diet and thiamine, and a
    glutamatergic-receptor antagonist alleviates the SSC-induced seizure phenotype in
    zebrafish. No controlled human efficacy data exist, and the HUMAN_MODEL_MISMATCH
    discussion records a dissenting in-vitro report in which glutamate-receptor
    blockade failed to rescue SSC toxicity — so this is curated as a
    mechanism-motivated, unproven intervention rather than an effective therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dextromethorphan
      term:
        id: CHEBI:4470
        label: dextromethorphan
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: NMDA Receptor Overactivation and Calcium Influx
    treatment_effect: INHIBITS
    description: >-
      NMDA-receptor antagonism is intended to block the proximal excitotoxic step —
      SSC-driven receptor overactivation and the calcium influx it gates — upstream
      of calpain activation and neuronal death.
  evidence:
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient began a low-methionine and low-cysteine diet and was treated with thiamine and dextromethorphan."
    explanation: >-
      Documents clinical use of dextromethorphan in ISOD. Classified PARTIAL because
      the report establishes that the drug was administered but not that it altered
      the disease course.
  - reference: PMID:31001109
    reference_title: "S-Sulfocysteine Induces Seizure-Like Behaviors in Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Seizure-like movements were fully revertible upon removal of SSC or could be alleviated by a glutamatergic receptor antagonist."
    explanation: >-
      Provides the in vivo rationale — glutamatergic-receptor antagonism alleviates
      the SSC-induced seizure phenotype in zebrafish larvae.
  - reference: PMID:39749013
    reference_title: "S-Sulfocysteine's toxic effects on HT-22 cells are not triggered by glutamate receptors, nor do they involve apoptotic or genotoxicity mechanisms."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "The cytotoxic effects of SSC were not reversed by glutamate receptor blocker administration."
    explanation: >-
      Directly challenges the rationale for receptor antagonism by showing a
      receptor-independent route to SSC cytotoxicity in HT-22 hippocampal cells.
      Retained so the therapeutic hypothesis is not presented as settled.
- name: Sulfite scavenging (investigational)
  description: >
    The first mechanism-based therapeutic concept for ISOD. Because the disease is
    driven by what accumulates rather than by what fails to be made, chemically
    removing sulfite should be disease-modifying regardless of the enzyme defect.
    Oxidized glutathione and glutathione trisulfide scavenge sulfite in vitro and in
    vivo and extend the lifespan of SOX-knockout mice. This is preclinical only — no
    human data exist — and is curated to record the mechanistic target, not an
    available therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glutathione disulfide (oxidized glutathione)
      term:
        id: CHEBI:17858
        label: glutathione disulfide
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Sulfite Accumulation
    treatment_effect: INHIBITS
    description: >-
      Scavengers react with sulfite directly, lowering its tissue concentration and
      therefore the formation of both downstream toxic products — S-sulfocysteine
      (the excitotoxic arm) and sulfite-driven persulfide stripping (the H2S arm).
      This is the one node at which a single intervention addresses both arms of the
      pathograph.
  evidence:
  - reference: PMID:41178722
    reference_title: "Sulfite oxidase deficiency causes persulfidation loss and hydrogen sulfide release."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "oxidized glutathione and glutathione trisulfide were able to scavenge sulfite in vitro and in vivo, extending the lifespan of SOXD mice and providing a mechanistic concept of sulfite scavenging for the treatment of this severe metabolic disorder of cysteine catabolism."
    explanation: >-
      Demonstrates sulfite scavenging and a survival benefit in the SOX-knockout
      mouse, establishing the mechanistic concept. Model-organism evidence only — no
      human efficacy is claimed.

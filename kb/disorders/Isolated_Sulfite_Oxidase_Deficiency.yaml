genetic:
- name: SUOX deficiency
  gene_term:
    preferred_term: SUOX
    term:
      id: hgnc:11460
      label: SUOX
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    description: Biallelic pathogenic SUOX variants are required; heterozygous carriers are asymptomatic.
    evidence:
    - reference: PMID:28933809
      reference_title: "Isolated Sulfite Oxidase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ISOD is inherited in an autosomal recessive manner."
      explanation: States the autosomal recessive mode of inheritance.
  features: >
    SUOX encodes sulfite oxidase, a homodimeric molybdenum-cofactor- and
    heme-containing enzyme; the carboxy-terminal third of the protein carries most of
    the contacts required for dimerization, so truncating variants in that region
    abolish activity. Reported alleles span truncating and missense classes: a
    homozygous 4-bp deletion (c.1347_1350delTTGT) segregates as a founder allele in
    an Indigenous genetic isolate in Manitoba, Canada, and missense alleles have been
    described in the milder, ectopia-lentis-predominant presentation. A published
    systematic review realigned all reported SUOX variants to the reference sequence
    NM_000456.2.
  evidence:
  - reference: PMID:33335014
    reference_title: "Isolated sulfite oxidase deficiency: a founder mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients have a homozygous 4-bp deletion, 1347-1350delTTGT in the sulfite oxidase gene (SUOX), predicting a premature termination of the sulfite oxidase protein leading to absence of the carboxy-terminal third portion of the protein."
    explanation: Describes the Manitoba founder truncating allele and its predicted protein consequence.
  - reference: PMID:33335014
    reference_title: "Isolated sulfite oxidase deficiency: a founder mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This domain contains most of the contact sites essential for enzyme dimerization."
    explanation: Explains why loss of the carboxy-terminal third abolishes enzyme function.
  - reference: PMID:9050047
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A point mutation that resulted in a truncated protein missing the molybdenum-binding site has been identified."
    explanation: Documents an early truncating allele removing the molybdenum-binding site.
  - reference: PMID:28980090
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also aligned the published SUOX gene mutations to the reference sequence NM_000456.2."
    explanation: Records the systematic realignment of published SUOX variants to a single reference transcript.
  - reference: PMID:36303223
    reference_title: "Mutation analysis of SUOX in isolated sulfite oxidase deficiency with ectopia lentis as the presenting feature: insights into genotype-phenotype correlation."
    supports: SUPPORT

diagnosis:
- name: Urinary sulfite dipstick screening
  description: >-
    A bedside dipstick positive for urinary sulfite is the fastest pointer to ISOD in
    a neonate with intractable seizures. It is a screening test only: sulfite is
    unstable and oxidises on standing, so a fresh sample is required and a negative
    result does not exclude the diagnosis. A positive dipstick does not distinguish
    ISOD from molybdenum cofactor deficiency, which produces the same secondary
    sulfite oxidase block.
  diagnosis_term:
    preferred_term: laboratory test
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Dipstick positive for urinary sulfite in a fresh specimen supports ISOD or
    molybdenum cofactor deficiency.
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings that suggest the diagnosis of ISOD are dipstick positive for urinary sulfite, elevated urinary thiosulfate and S-sulfocysteine, low urinary organic sulfate, and markedly reduced plasma levels of total homocysteine."
    explanation: GeneReviews lists a positive urinary sulfite dipstick among the laboratory findings that suggest ISOD.
- name: Sulfur metabolite panel (thiosulfate, S-sulfocysteine, organic sulfate, total homocysteine)
  description: >-
    The biochemical signature of ISOD is a paired pattern: the sulfite disposal
    products rise while the oxidative end product and the transsulfuration pool fall.
    Elevated urinary thiosulfate and S-sulfocysteine with LOW urinary organic sulfate
    and markedly LOW plasma total homocysteine is close to specific. The low total
    homocysteine is the discriminating feature against the neighbouring sulfur amino
    acid disorders (CBS-deficient homocystinuria raises it), and is easy to misread as
    a normal or reassuring result.
  diagnosis_term:
    preferred_term: laboratory test
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Elevated urinary thiosulfate and S-sulfocysteine with low urinary organic sulfate
    and markedly reduced plasma total homocysteine.
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings that suggest the diagnosis of ISOD are dipstick positive for urinary sulfite, elevated urinary thiosulfate and S-sulfocysteine, low urinary organic sulfate, and markedly reduced plasma levels of total homocysteine."
    explanation: Specifies the full suggestive metabolite panel, including the counterintuitive low organic sulfate and low total homocysteine.
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma or urinary S-sulfocysteine levels were elevated in all cases."
    explanation: Establishes S-sulfocysteine elevation as an invariant finding across published cases, supporting its diagnostic sensitivity.
- name: Discrimination from molybdenum cofactor deficiency
  description: >-
    Because MoCD produces an identical secondary sulfite oxidase block, the metabolite
    panel alone cannot separate the two. The distinguishing test exploits the fact
    that ISOD spares the other molybdenum-cofactor-dependent enzymes: xanthine
    dehydrogenase activity and purine handling are normal in ISOD, so plasma uric acid
    and urinary xanthine/hypoxanthine are normal, whereas MoCD gives low uric acid
    with elevated xanthine. This distinction changes management, since MoCD type A is
    treatable with fosdenopterin and ISOD is not.
  diagnosis_term:
    preferred_term: laboratory test
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Normal uric acid and normal urinary oxypurines indicate isolated sulfite oxidase
    deficiency rather than molybdenum cofactor deficiency.
  evidence:
  - reference: PMID:9050047
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver sulfite oxidase activity was not detectable but xanthine dehydrogenase activity was normal."
    explanation: >-
      Demonstrates the enzymatic pattern that defines the isolated form — absent
      sulfite oxidase with preserved xanthine dehydrogenase, i.e. an intact
      molybdenum cofactor.
- name: SUOX molecular genetic testing
  description: >-
    Identification of biallelic pathogenic SUOX variants is the confirmatory test and
    the basis for subsequent carrier, prenatal and preimplantation genetic testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic SUOX variants confirm the diagnosis.
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is confirmed by identification of biallelic pathogenic variants in SUOX by molecular genetic testing."
    explanation: GeneReviews states that molecular genetic testing provides diagnostic confirmation.
  - reference: PMID:36303223
    reference_title: "Mutation analysis of SUOX in isolated sulfite oxidase deficiency with ectopia lentis as the presenting feature: insights into genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated sulfite oxidase deficiency (ISOD) caused by sulfite oxidase gene (SUOX) mutations is a rare neurometabolic disease associated with ectopia lentis (EL)."
    explanation: >-
      Supports SUOX sequencing as the route to diagnosis in patients ascertained
      through ectopia lentis rather than neonatal encephalopathy — the late-onset
      presentation most likely to be missed.
- name: Brain MRI
  description: >-
    Neuroimaging is abnormal in every ISOD patient imaged in the largest published
    review, typically showing diffuse cerebral atrophy, cystic encephalomalacia and
    ventriculomegaly. The pattern strongly resembles hypoxic-ischaemic injury, so
    imaging supports but does not establish the diagnosis and is a recognised route to
    misattributing ISOD to perinatal asphyxia.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Cerebral atrophy with cystic encephalomalacia and ventriculomegaly; mimics
    hypoxic-ischaemic encephalopathy.
  evidence:
  - reference: PMID:28980090
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients in whom brain magnetic resonance imaging/computed tomography (MRI/CT) was performed, brain abnormalities were found."
    explanation: Establishes that structural brain abnormality is an invariant imaging finding in ISOD.
differential_diagnoses:
- name: Molybdenum cofactor deficiency
  description: >
    MoCD produces an identical secondary sulfite oxidase deficiency plus loss of
    xanthine dehydrogenase and aldehyde oxidase, and is clinically very similar at
    the bedside. The distinction is critical because MoCD type A is treatable whereas
    ISOD is not.
  distinguishing_features:
  - >-
    Plasma uric acid and urinary oxypurines are normal in ISOD but abnormal in MoCD,
    reflecting the additional loss of xanthine dehydrogenase in MoCD.
  - >-
    Direct liver enzyme assay shows absent sulfite oxidase with normal xanthine
    dehydrogenase activity in ISOD.
  evidence:
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main alternative in the differential diagnosis of isolated sulfite oxidase deficiency is molybdenum cofactor deficiency."
    explanation: Identifies MoCD as the principal differential diagnosis.
  - reference: PMID:28980090
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As no long-term effective treatment is available, distinction from other treatable diseases, such as molybdenum cofactor deficiency (MoCD) type A, should be made."
    explanation: States why the distinction matters clinically — MoCD type A is treatable and ISOD is not.
  - reference: PMID:9050047
    reference_title: "Isolated sulfite oxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver sulfite oxidase activity was not detectable but xanthine dehydrogenase activity was normal."
    explanation: Documents the enzymatic pattern that distinguishes ISOD from MoCD.
discussions:
- discussion_id: ssc_nmda_evidence_from_mocd
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does S-sulfocysteine drive NMDA-receptor-dependent excitotoxicity in human
    isolated sulfite oxidase deficiency to the same degree demonstrated in molybdenum
    cofactor deficiency models?
  attaches_to:
  - "pathophysiology#NMDA Receptor Overactivation and Calcium Influx"
  - "pathophysiology#Calpain Activation and Gephyrin Degradation"
  - "pathophysiology#Loss of GABAergic Inhibition"
  rationale: >-
    The mechanistic chain curated here — SSC acting as an NMDA-receptor agonist,
    calcium influx, calpain activation, calpain-dependent gephyrin degradation and
    loss of GABAergic synapses — was demonstrated in primary murine neurons and in a
    tungstate-induced molybdenum cofactor deficiency mouse, not in ISOD patients or
    ISOD-derived human neurons. The transfer is biologically reasonable because MoCD
    causes a secondary sulfite oxidase block and therefore the same accumulating
    metabolite, and because a full SUOX-knockout mouse now exists. But the two
    disorders are not metabolically identical: MoCD additionally loses xanthine
    dehydrogenase and aldehyde oxidase, so MoCD models carry purine and aldehyde
    perturbations that ISOD does not. A dissenting in-vitro report in HT-22
    hippocampal cells further found that glutamate-receptor blockade did NOT reverse
    SSC cytotoxicity, implying at least one receptor-independent death pathway.
    Whether NMDA-receptor antagonism would be neuroprotective in human ISOD is
    therefore genuinely open, and it matters directly because it is the only
    mechanism-based therapeutic hypothesis currently on the table for a disorder with
    no disease-modifying treatment.
  proposed_experiments:
  - experiment_id: isod_nmda_antagonism_suox_ko
    name: NMDA-receptor antagonism in the SUOX-knockout mouse
    description: >-
      Test whether memantine or another NMDA-receptor antagonist is neuroprotective in
      the SUOX-knockout mouse, in which the metabolic lesion is isolated, rather than
      in the tungstate-induced MoCD model where xanthine dehydrogenase and aldehyde
      oxidase are also inhibited.
    decision_criterion: >-
      Significant improvement in survival and in seizure/neurobehavioural endpoints
      versus vehicle would support translating the MoCD mechanism to ISOD; absence of
      benefit would indicate the excitotoxic arm is not rate-limiting in isolated SUOX
      loss.
  - experiment_id: isod_ipsc_neuron_ssc_challenge
    name: ISOD patient iPSC-derived neuron challenge
    description: >-
      Differentiate neurons from ISOD-patient iPSCs and isogenic corrected controls and
      measure SSC-driven calcium influx, calpain activation and gephyrin loss.
    decision_criterion: >-
      Reproduction of the calcium/calpain/gephyrin cascade in human ISOD neurons would
      close the species and disease-context gap in the current evidence.
  - experiment_id: isod_ht22_discrepancy_resolution
    name: Reconciliation of the HT-22 negative result
    description: >-
      Compare SSC cytotoxicity with and without glutamate-receptor blockade across
      primary neurons, HT-22 cells and human iPSC-derived neurons under matched SSC
      concentrations and exposure times.
    decision_criterion: >-
      Consistent receptor-independent toxicity across models would establish a second,
      parallel death pathway (oxytosis/necrosis) that the current pathograph does not
      represent.
  evidence:
  - reference: PMID:29106383
    reference_title: "S-sulfocysteine/NMDA receptor-dependent signaling underlies neurodegeneration in molybdenum cofactor deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the NMDA-R antagonist memantine was protective against the manifestation of symptoms in a tungstate-induced MoCD mouse model"
    explanation: >-
      The therapeutic proof-of-concept was obtained in a tungstate-induced MoCD mouse,
      not in an ISOD model, which is the source of the translational uncertainty.
  - reference: PMID:39749013
    reference_title: "S-Sulfocysteine's toxic effects on HT-22 cells are not triggered by glutamate receptors, nor do they involve apoptotic or genotoxicity mechanisms."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "The cytotoxic effects of SSC were not reversed by glutamate receptor blocker administration."
    explanation: >-
      A direct in-vitro challenge to the receptor-dependent model: in HT-22
      hippocampal cells, glutamate-receptor blockade did not rescue SSC toxicity,
      indicating at least one receptor-independent death pathway.
- discussion_id: ectopia_lentis_mechanism_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does sulfite accumulation dislocate the ocular lens in ISOD?
  attaches_to:
  - "pathophysiology#Ectopia Lentis"
  rationale: >-
    Ectopia lentis is the one consistent extraneurological feature of ISOD and can be
    the presenting sign of the late-onset form, yet the pathograph has no evidenced
    step connecting sulfite accumulation to zonular failure. The widely repeated
    explanation — that sulfite, a nucleophile, cleaves the disulfide bonds that
    cross-link the fibrillin-rich zonular fibres suspending the lens — is mechanically
    plausible and would explain the phenotypic overlap with homocystinuria and Marfan
    syndrome, but no primary study establishing it in ISOD tissue was identified
    during curation. The node is therefore curated as a consequence carrying a
    clinical association only, and the proposed zonular mechanism is deliberately
    excluded from the evidenced causal chain.
  proposed_experiments:
  - experiment_id: isod_zonule_fibrillin_analysis
    name: Zonular fibre analysis in SUOX-deficient tissue
    description: >-
      Histological and biochemical analysis of zonular fibres from SUOX-knockout mice
      or from ISOD autopsy/lensectomy material, assaying fibrillin-1 disulfide
      integrity against age-matched controls.
    decision_criterion: >-
      Demonstration of reduced disulfide cross-linking or fragmented fibrillin
      microfibrils in SUOX-deficient zonules would convert the hypothesis into an
      evidenced pathograph step.
  - experiment_id: isod_sulfite_microfibril_challenge
    name: In-vitro sulfite challenge of fibrillin microfibrils
    description: >-
      Expose purified fibrillin microfibrils to pathophysiological sulfite
      concentrations and measure disulfide reduction and mechanical failure.
    decision_criterion: >-
      Concentration-dependent disulfide reduction and loss of tensile integrity at
      patient-range sulfite levels would establish chemical plausibility.
  - experiment_id: isod_genotype_lens_onset_correlation
    name: Genotype-stratified age at lens dislocation
    description: >-
      Correlate age at lens subluxation with residual SUOX activity (or genotype
      class) across the published patient spectrum.
    decision_criterion: >-
      A dose-dependent relationship between residual enzyme activity and later
      dislocation would support a cumulative sulfite-exposure mechanism.
notes: >
  ISOD is best understood as a "toxic-metabolite excitotoxicity" disorder rather than
  a classical deficiency state: the harm comes from what accumulates (sulfite and
  especially S-sulfocysteine), not from what fails to be made (sulfate). That framing
  explains several otherwise odd features of the entry. First, plasma total
  homocysteine and cystine are LOW rather than high, which is diagnostically valuable
  precisely because it is the opposite of the pattern in the neighbouring sulfur
  amino acid disorders such as CBS-deficient homocystinuria. Second, the seizures are
  pharmacoresistant not by accident but by mechanism — S-sulfocysteine increases
  glutamatergic drive while calpain simultaneously degrades gephyrin and dismantles
  the inhibitory synapses that many anti-seizure drugs act through — which is why the
  "Loss of GABAergic Inhibition" node conforms to
  `epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance` while
  being reached through a chain that also raises excitation, i.e. the balance is
  shifted from both directions at once. Third, the near-total absence of therapy follows from the
  block being terminal and irreversible: there is no cofactor to replace (unlike MoCD
  type A) and dietary substrate restriction only marginally slows a pathway that is
  also fed endogenously.

  Two curation caveats should be read alongside the pathograph. (i) The
  excitotoxicity mechanism is evidenced chiefly from molybdenum cofactor deficiency
  models and primary murine neurons rather than from ISOD patients, and one in-vitro
  study directly contradicts the receptor-dependent account — see the
  HUMAN_MODEL_MISMATCH discussion, which carries that REFUTE evidence. (ii) The
  persulfidation/H2S arm (Fu et al. 2025) comes entirely from the new SUOX-knockout
  mouse; it is mechanistically important because it connects ISOD to the hydrogen
  sulfide disorders such as ETHE1 deficiency and supplies the rationale for sulfite
  scavenging with oxidized glutathione, but it has not yet been demonstrated in
  patients.

  Death in infancy is modeled as a pathophysiology consequence node rather than as a
  `phenotypes` entry because HP:0001522 (Death in infancy) sits outside the
  Phenotypic abnormality subtree that the `PhenotypeTerm` dynamic enum draws from.

  Ectopia lentis is reached from Sulfite Accumulation by a deliberately weak edge —
  `INDIRECT_UNKNOWN_INTERMEDIATES`, opted into the `zonular_disulfide_reduction`
  hypothesis group, and evidenced only by the clinical co-occurrence (`PARTIAL`).
  This keeps the pathograph a single connected component without asserting the
  unsourced zonular-disulfide mechanism as fact; the gap itself is recorded in the
  `ectopia_lentis_mechanism_unresolved` KNOWLEDGE_GAP discussion.

  Two frequency bands were deliberately omitted. Axial hypotonia and Neonatal seizure
  both draw on PMID:28980090, but the 100% figure there covers the disjunction "axial
  hypotonia and/or peripheral hypertonia" and the 84% figure counts seizures at any
  age (neonatal onset was 57%). Neither number quantifies the specific term used
  here, so per `docs/frequency-evidence-guidelines.md` no band is asserted. Global
  developmental delay keeps `VERY_FREQUENT` because its 97% is a clean single figure
  for that phenotype.

  Anti-seizure medication carries no `target_mechanisms` edge on purpose. Most such
  drugs act by potentiating GABAergic transmission, and in ISOD those synapses are
  the ones being destroyed — the absence of a therapeutic edge is the mechanistic
  statement, and asserting one would overstate an effect the literature reports as
  absent.

  Relationship to other dismech entries: ETHE1-deficiency `Ethylmalonic
  Encephalopathy` is the closest mechanistic neighbour (both are disorders of
  sulfur-containing amino acid and hydrogen sulfide metabolism, curated in the same
  IEMbase package WP-002), and molybdenum cofactor deficiency is the principal
  differential diagnosis but is a distinct, not-yet-curated entity because its lesion
  is in cofactor biosynthesis rather than in SUOX itself.

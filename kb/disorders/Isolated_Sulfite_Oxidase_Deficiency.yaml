name: Isolated Sulfite Oxidase Deficiency
category: Mendelian
creation_date: '2026-07-31T00:00:00Z'
synonyms:
- ISOD
- Sulfocysteinuria
- SUOX deficiency
- Sulfite oxidase deficiency, isolated
description: >
  Isolated sulfite oxidase deficiency (ISOD) is an ultra-rare, autosomal recessive
  inborn error of sulfur (cysteine) catabolism caused by biallelic loss-of-function
  variants in SUOX. SUOX encodes sulfite oxidase, the molybdenum-cofactor- and
  heme-dependent enzyme of the mitochondrial intermembrane space that catalyses the
  terminal step of sulfur amino acid degradation, oxidising sulfite to sulfate. When
  the enzyme is lost, sulfite accumulates and is shunted into two diagnostic
  metabolites: S-sulfocysteine, formed by reaction of sulfite with cystine, and
  thiosulfate. S-sulfocysteine is a structural analog of glutamate and behaves as an
  NMDA-receptor agonist, so the accumulating metabolite is not merely a marker but
  the proximate neurotoxin — it drives calcium influx, calpain activation and
  calpain-dependent degradation of the inhibitory postsynaptic scaffold gephyrin,
  simultaneously raising excitatory drive and stripping GABAergic inhibition. The
  resulting excitotoxic injury produces the characteristic clinical picture: classic
  ISOD presents in the first hours to days of life with pharmacoresistant seizures,
  feeding difficulty and rapidly progressive encephalopathy with opisthotonus and
  spastic quadriplegia, followed by progressive microcephaly, profound intellectual
  disability, cerebral atrophy with cystic encephalomalacia, and death in infancy. A
  milder late-onset form manifests between six and 18 months with ectopia lentis, a
  dystonic-choreoathetotic movement disorder and developmental regression, and is
  associated with biallelic missense genotypes that retain residual activity. Lens
  subluxation or dislocation is a hallmark at any severity. Because the same
  metabolic block occurs downstream of molybdenum cofactor deficiency (MoCD), which
  additionally impairs xanthine dehydrogenase, distinguishing ISOD from MoCD by uric
  acid and urinary oxypurines is diagnostically essential — MoCD type A is treatable
  whereas no disease-modifying therapy exists for ISOD.

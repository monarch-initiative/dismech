biochemical:
- name: Urinary sulfite
  presence: INCREASED
  context: >
    Sulfite is detectable in fresh urine by dipstick and is the direct marker of the
    enzymatic block. The test is unreliable if the sample is not fresh, which is a
    documented cause of missed diagnosis.
  biomarker_term:
    preferred_term: sulfite
    term:
      id: CHEBI:17359
      label: sulfite
  evidence:
  - reference: PMID:28933809
    reference_title: "Isolated Sulfite Oxidase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings that suggest the diagnosis of ISOD are dipstick positive for urinary sulfite, elevated urinary thiosulfate and S-sulfocysteine, low urinary organic sulfate, and markedly reduced plasma levels of total homocysteine."
    explanation: Documents dipstick-positive urinary sulfite as a diagnostic laboratory finding.
  - reference: PMID:33335014
    reference_title: "Isolated sulfite oxidase deficiency: a founder mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missed diagnosis is not unusual because of variability in the sensitivity of the urinary sulfite and thiosulfate screening test."
    explanation: Documents the limited sensitivity of the urinary sulfite screening test as a cause of missed diagnosis.
- name: S-sulfocysteine
  presence: INCREASED
  context: >
    Elevated plasma and/or urinary S-sulfocysteine is the most consistent biochemical
    abnormality in ISOD, reported in every published case, and is simultaneously the
    proximate neurotoxin.
  biomarker_term:
    preferred_term: S-sulfo-L-cysteine
    term:
      id: CHEBI:62225
      label: S-sulfo-L-cysteinate(1-)
  evidence:
  - reference: PMID:16140720
    reference_title: "Isolated sulfite oxidase deficiency: a case report with a novel mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma or urinary S-sulfocysteine levels were elevated in all cases."
    explanation: Establishes S-sulfocysteine elevation as present in 100% of published cases.
- name: Urinary thiosulfate
  presence: INCREASED
  context: >
    Thiosulfate is the second sulfite disposal product and is elevated in urine. In
    the SUOX-knockout mouse it accumulates 45-fold and is the major excreted sulfur
    metabolite.

    snippet: "demonstrated that it acts as an N-methyl D-aspartate receptor (NMDA-R) agonist, leading to calcium influx and downstream cell signaling events and neurotoxicity"
    explanation: >-
      Establishes SSC agonism at the NMDA receptor and the calcium influx it gates.
  downstream:
  - target: Calpain Activation and Gephyrin Degradation
    description: >
      Calcium loading activates the calcium-dependent protease calpain, which
      proteolyses the inhibitory postsynaptic scaffold gephyrin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29106383
      reference_title: "S-sulfocysteine/NMDA receptor-dependent signaling underlies neurodegeneration in molybdenum cofactor deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pharmacological blockade of NMDA-R, calcium influx, or calpain activity abolished SSC and glutamate neurotoxicity in primary murine neurons."
      explanation: >-
        Blocking the receptor, the calcium influx, or calpain each abolishes the
        toxicity, establishing that calpain activation lies causally downstream of
        NMDA-R-gated calcium entry rather than merely accompanying it.
  - target: Excitotoxic Neuronal Death and Cystic Encephalomalacia
    description: >
      Sustained excitotoxic calcium loading kills neurons; in the neonatal brain the
      resulting injury is severe enough to cavitate, producing cortical necrosis and
      cystic white matter change.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31001109
      reference_title: "S-Sulfocysteine Induces Seizure-Like Behaviors in Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "SSC induces increased swimming, seizure-like movements, and increased cell death in the central nervous system of zebrafish larvae"
      explanation: >-
        Shows in vivo that SSC alone is sufficient to cause both seizure-like
        behaviour and CNS cell death.
- name: Calpain Activation and Gephyrin Degradation
  description: >
    Calcium-activated calpain degrades gephyrin, the scaffold protein that clusters
    and anchors glycine and GABA-A receptors at inhibitory postsynapses. This is the
    step that converts a glutamatergic insult into an inhibitory-synapse lesion, and
    is why the excitation/inhibition shift in ISOD is two-directional rather than
    purely excitatory.
  role: amplifier
  biological_scale: MOLECULAR
  molecular_functions:

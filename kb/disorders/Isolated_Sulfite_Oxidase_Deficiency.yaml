      evidence_source: IN_VITRO
      snippet: "calpain-dependent degradation of the inhibitory synaptic protein gephyrin subsequently exacerbated SSC-mediated excitotoxicity and promoted loss of GABAergic synapses"
      explanation: >-
        Links gephyrin proteolysis directly to loss of GABAergic synapses and to
        amplification of the excitotoxicity.
- name: Loss of GABAergic Inhibition
  description: >
    Destruction of inhibitory synapses lowers GABAergic tone. Combined with the
    raised glutamatergic drive upstream, ISOD shifts the excitation/inhibition
    balance from both directions at once — increased excitation plus actively
    destroyed inhibition — which is a mechanistic explanation for the
    pharmacoresistance of the neonatal seizures, since most anti-seizure medications
    act by potentiating the very GABAergic synapses that are being lost.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:

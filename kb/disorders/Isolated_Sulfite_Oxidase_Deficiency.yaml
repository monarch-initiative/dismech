    evidence_source: IN_VITRO
    snippet: "SSC treatment activated the protease calpain, and calpain-dependent degradation of the inhibitory synaptic protein gephyrin subsequently exacerbated SSC-mediated excitotoxicity and promoted loss of GABAergic synapses."
    explanation: >-
      Demonstrates calpain activation by SSC and calpain-dependent proteolysis of
      gephyrin.
  downstream:
  - target: Loss of GABAergic Inhibition
    description: >
      Loss of the gephyrin scaffold disperses GABA-A receptor clusters and destroys
      inhibitory synapses, reducing GABAergic signalling.
    causal_link_type: DIRECT

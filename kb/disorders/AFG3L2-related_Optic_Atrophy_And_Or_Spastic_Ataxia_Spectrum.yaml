- name: Impaired Mitochondrial Inner-Membrane Proteostasis
  biological_scale: MOLECULAR
  description: >-
    AFG3L2 is the ATP-dependent metallopeptidase subunit of the m-AAA protease of the
    inner mitochondrial membrane, acting as a homo-oligomer or as a hetero-oligomer
    with paraplegin (SPG7). Reduced protease activity impairs degradation of damaged or
    unassembled mitochondrial proteins and maturation of selected substrates, causing
    accumulation of mitochondria-encoded proteins.
  molecular_functions:

name: AFG3L2-related Optic Atrophy And/Or Spastic Ataxia Spectrum
creation_date: "2026-10-30T10:55:17Z"
category: Mendelian
description: >-
  A dosage-sensitive, semidominant mitochondrial neurodegenerative spectrum caused by
  germline pathogenic variants in AFG3L2, which encodes a subunit of the m-AAA
  ATP-dependent metalloprotease of the mitochondrial inner membrane. One damaging
  (monoallelic) allele most often produces optic-nerve-predominant disease (optic
  atrophy 12, OPA12) or an adult-onset cerebellar syndrome (spinocerebellar ataxia
  type 28, SCA28), whereas biallelic hypomorphic/null genotypes shift the phenotype
  toward early, multisystem spastic ataxia, myoclonic epilepsy and
  neurodevelopmental degeneration (spastic ataxia type 5, SPAX5). The converging
  mechanism is failure of mitochondrial inner-membrane proteostasis with dysregulated
  OPA1 processing, mitochondrial fragmentation, calcium dyshomeostasis and
  bioenergetic failure in vulnerable neurons.
synonyms:
- AFG3L2-Related Neurologic Disorders
- optic atrophy 12
- OPA12
- spastic ataxia 5
- SPAX5
- spinocerebellar ataxia type 28
- SCA28
- AFG3L2-related optic atrophy and/or ataxia
parents:
- hereditary disease
- mitochondrial disease
- neurodegenerative disorder

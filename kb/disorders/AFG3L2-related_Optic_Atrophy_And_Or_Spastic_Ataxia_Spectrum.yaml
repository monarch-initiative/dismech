- name: AFG3L2 Biallelic Hypomorphic or Null Variants (SPAX5)
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic (e.g. p.Tyr616Cys) and/or null AFG3L2 genotypes severely
    reduce m-AAA protease activity and complex assembly, producing the recessive
    SPAX5 phenotype. The hypomorphic Y616C product shows impaired oligomerization with
    itself and, more so, with paraplegin.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS

pathophysiology:
- name: AFG3L2 ATPase-Domain Loss of Function (OPA12)
  biological_scale: MOLECULAR
  description: >-
    Heterozygous AFG3L2 missense variants clustered in the ATPase domain reduce m-AAA
    protease function and alter OPA1 processing in patient fibroblasts, a mechanism
    distinct from the SCA28 proteolytic-domain variants. This is the dominant,
    optic-atrophy-predominant arm of the spectrum.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: AFG3L2
    term:
      id: hgnc:315
      label: AFG3L2
  downstream:

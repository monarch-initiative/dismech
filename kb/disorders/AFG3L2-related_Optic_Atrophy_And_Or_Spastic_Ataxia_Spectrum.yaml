notes: >-
  Evidence is sparse: most phenotype assertions derive from case reports and small
  families rather than population cohorts, so reported frequencies describe published
  patients, not population-level probabilities (per the GeneReviews chapter
  PMID:21595125 and the deep-research synthesis). GeneReviews frames four
  AFG3L2-related phenotypes - SCA28, OPA12, SPAX5, and a rarer late-onset autosomal
  recessive ataxia (AFG3L2-SCAR) resembling SCA28; a severe biallelic developmental
  and epileptic encephalopathy (null-null genotypes) has since been delineated
  (PMID:42412416). This entry models the shared AFG3L2/m-AAA mechanism and the three
  named subtypes requested for MONDO:0700372. The SPAX5 subtype is modelled in depth
  as a subtype of the broader "Spastic Ataxia" entry
  (kb/disorders/Spasticity-Ataxia-Gait_Anomalies_Syndrome.yaml, MONDO:0017845), which
  carries its white-matter and integrated-stress-response pathophysiology; the SPAX5
  row here is kept lightweight and points there to avoid duplication. ClinGen
  classified the AFG3L2 gene-disease relationship as Definitive with semidominant
  inheritance (approved 2024-05-16); that external validity call is recorded here in
  prose rather than as a structured gene_disease_validity assertion.
inheritance:
- name: Semidominant inheritance
  inheritance_term:
    preferred_term: semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  description: >-
    ClinGen classifies the AFG3L2 relationship as semidominant: one damaging allele
    can cause dominant optic atrophy or a cerebellar syndrome, while two damaging
    alleles usually cause more severe recessive spastic-ataxia / neurodevelopmental
    disease. Some heterozygous carriers of recessive-family alleles are asymptomatic,
    while others show subtle optic or cerebellar findings.
  evidence:
  - reference: PMID:37804316
    reference_title: "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Heterozygous AFG3L2 mutations cause spinocerebellar ataxia type 28 (SCA28) or
      dominant optic atrophy type 12 (DOA12), while biallelic AFG3L2 mutations result
      in the rare and severe spastic ataxia type 5 (SPAX5).
    explanation: >-
      States the dosage relationship (monoallelic dominant disease vs biallelic severe
      recessive disease) that underlies the semidominant classification.
  - reference: PMID:21595125
    reference_title: "AFG3L2-Related Neurologic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heterozygous family members of an individual with an autosomal recessive
      AFG3L2-related neurologic disorder are typically asymptomatic and the risk of
      developing an AFG3L2-related neurologic disorder appears to be low.
    explanation: GeneReviews states that heterozygous relatives in recessive families are usually unaffected.
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA28 and OPA12 are inherited in an autosomal dominant manner; de novo variants
    occur.
  evidence:
  - reference: PMID:21595125
    reference_title: "AFG3L2-Related Neurologic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SCA28 and OPA12 are inherited in an autosomal dominant manner. AFG3L2-SCAR and
      SPAX5 are inherited in an autosomal recessive manner.
    explanation: GeneReviews states the autosomal dominant inheritance of SCA28 and OPA12.
  - reference: PMID:21595125
    reference_title: "AFG3L2-Related Neurologic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with an autosomal dominant AFG3L2-related neurologic
      disorder has a 50% risk of inheriting the pathogenic variant.
    explanation: GeneReviews gives the 50% transmission risk under the dominant model.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SPAX5 and the late-onset AFG3L2-SCAR phenotype are inherited in an autosomal
    recessive manner, requiring biallelic pathogenic variants.
  evidence:
  - reference: PMID:21595125
    reference_title: "AFG3L2-Related Neurologic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SCA28 and OPA12 are inherited in an autosomal dominant manner. AFG3L2-SCAR and
      SPAX5 are inherited in an autosomal recessive manner.
    explanation: GeneReviews states the autosomal recessive inheritance of SPAX5 and AFG3L2-SCAR.
  - reference: PMID:21595125
    reference_title: "AFG3L2-Related Neurologic Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of inheriting
      biallelic pathogenic variants and being affected
    explanation: GeneReviews gives the 25% recurrence risk for sibs under the recessive model.

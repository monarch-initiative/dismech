animal_models:
- name: Afg3l2-null mouse
  species: Mouse
  genotype: Afg3l2 null (homozygous loss of function)
  publication: PMID:18337413
  description: >-
    Homozygous Afg3l2-deficient mice show impaired axonal development, delayed
    myelination, poor axonal radial growth and death by about postnatal day 16,
    modelling the severe biallelic neurologic phenotype; Purkinje-neuron rescue by
    integrated-stress-response potentiation has been shown in this background.
  modeled_mechanisms:
  - target: Purkinje Cell and Corticospinal Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the axonal and neuronal degeneration that drives the motor phenotype
      of biallelic AFG3L2 disease.
    limitations: >-
      Perinatal lethality by P16 limits chronic-treatment and late-onset studies, and
      the complete-null genotype is more severe than most human hypomorphic SPAX5
      genotypes.
    evidence:
    - reference: PMID:18337413
      reference_title: "The mitochondrial protease AFG3L2 is essential for axonal development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Afg3l2 models display a marked impairment of axonal development with delayed
        myelination and poor axonal radial growth leading to lethality at P16.
      explanation: Establishes the Afg3l2-null mouse as a model of the severe neurologic degeneration.

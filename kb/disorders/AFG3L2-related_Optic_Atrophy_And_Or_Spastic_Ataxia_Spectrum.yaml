    explanation: Establishes AFG3L2 as the m-AAA protease subunit whose dysfunction impairs mitochondrial proteostasis.
- name: Dysregulated OPA1 Processing and Mitochondrial Fragmentation
  biological_scale: CELLULAR
  description: >-
    Loss of AFG3L2 function leads to overactivation of the stress-sensitive protease
    OMA1, which over-processes the fusion GTPase OPA1 to its short, fission-promoting
    isoforms, fragmenting the mitochondrial network and disturbing mitochondrial
    distribution in neuronal axons and dendrites. In OPA12 fibroblasts this
    overprocessing is the proposed basis of the optic-nerve phenotype.
  biological_processes:
  - preferred_term: mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  downstream:
  - target: Retinal Ganglion Cell and Optic Nerve Degeneration
    causal_link_type: DIRECT
  - target: Purkinje Cell and Corticospinal Neuron Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32219868
    reference_title: "ATPase Domain AFG3L2 Mutations Alter OPA1 Processing and Cause Optic Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patients' fibroblasts showed abnormal OPA1 processing, with accumulation of the
      fission-inducing short forms leading to mitochondrial network fragmentation, not
      observed in SCA28 patients' cells.
    explanation: Demonstrates AFG3L2-dependent OPA1 overprocessing and fragmentation in patient fibroblasts.
- name: OMA1-DELE1-HRI Integrated Stress Response
  biological_scale: CELLULAR
  description: >-
    Mitochondrial proteotoxicity on loss of AFG3L2 activates the OMA1-DELE1-HRI axis,
    eliciting the integrated stress response (eIF2alpha phosphorylation, ATF4 and
    downstream targets). This is a compensatory, cytoprotective branch rather than a
    driver of degeneration: silencing DELE1/HRI impairs SPAX5-fibroblast growth, and
    pharmacological potentiation of the response rescues cells and model mice.
  biological_processes:
  - preferred_term: integrated stress response signaling
    term:
      id: GO:0140467
      label: integrated stress response signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:37804316
    reference_title: "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      pharmacological potentiation of integrated stress response via Sephin-1, a drug
      that selectively inhibits the stress-induced eIF2alpha phosphatase GADD34
      (encoded by Ppp1r15a), improved cell growth of SPAX5 fibroblasts
    explanation: Shows the integrated stress response is protective in SPAX5 patient fibroblasts.
  - reference: PMID:37804316
    reference_title: "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sephin-1 treatment in vivo extended the lifespan of Afg3l2-/- mice, improved
      Purkinje neuron morphology, mitochondrial ultrastructure and respiratory capacity.
    explanation: Shows potentiating the integrated stress response is protective in Afg3l2-null mice.
- name: MCU-Mediated Mitochondrial Calcium Overload
  biological_scale: CELLULAR
  description: >-
    Failure to clear unassembled mitochondrial calcium-uniporter regulatory subunits
    deregulates the MCU channel, causing excessive mitochondrial calcium uptake and
    susceptibility to calcium-induced neuronal death; shown in AFG3L2 compound-
    heterozygous patient-derived iPSCs.
  biological_processes:
  - preferred_term: mitochondrial calcium ion transmembrane transport
    term:
      id: GO:0006851
      label: mitochondrial calcium ion transmembrane transport
    modifier: INCREASED
  downstream:

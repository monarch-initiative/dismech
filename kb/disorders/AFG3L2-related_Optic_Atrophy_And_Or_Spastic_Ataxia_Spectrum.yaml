genetic:
- name: AFG3L2 heterozygous ATPase-domain variants (OPA12)
  gene_term:
    preferred_term: AFG3L2
    term:
      id: hgnc:315
      label: AFG3L2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: OPA12
  notes: >-
    Heterozygous AFG3L2 missense variants, clustered in the ATPase domain, cause
    dominant optic atrophy (OPA12) through altered OPA1 processing. Half of cases are
    familial dominant and the rest sporadic, including de novo variants. Biallelic
    variants can act as recessive or phenotype-modifier alleles in severe syndromic
    optic neuropathy.
  variants:
  - name: p.Thr355Met
    description: >-
      c.1064C>T (NM_006796.3) heterozygous missense; reported as pathogenic in a
      father-daughter nonsyndromic optic-atrophy family diagnosed by exome reanalysis.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36974169
      reference_title: "Identification of AFG3L2 dominant optic atrophy following reanalysis of clinical exome sequencing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reanalysis of the sequencing data revealed an autosomal dominant pathogenic
        variant in AFG3L2, c.1064C>T (p.Thr355Met), a gene that was recently identified
        to be associated with non-syndromic optic atrophy.
      explanation: Reports the pathogenic p.Thr355Met variant causing dominant optic atrophy.
  evidence:
  - reference: PMID:32219868
    reference_title: "ATPase Domain AFG3L2 Mutations Alter OPA1 Processing and Cause Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Half of cases were familial with a dominant inheritance, whereas the others were
      sporadic, including de novo mutations.
    explanation: Documents the dominant and de novo inheritance of OPA12-causing AFG3L2 variants.
- name: AFG3L2 heterozygous proteolytic-domain variants (SCA28)
  gene_term:
    preferred_term: AFG3L2
    term:
      id: hgnc:315
      label: AFG3L2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: SCA28
  notes: >-
    Heterozygous AFG3L2 variants, mostly affecting the proteolytic domain, cause
    autosomal dominant SCA28, as distinct from the ATPase-domain OPA12 variants.
    PMID:22022284 describes the SCA28 variants as loss-of-function.
  evidence:
  - reference: PMID:32219868
    reference_title: "ATPase Domain AFG3L2 Mutations Alter OPA1 Processing and Cause Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve cases (4%) were found to carry novel variants in AFG3L2, a gene that has
      been associated with autosomal dominant spinocerebellar ataxia 28 (SCA28).
    explanation: Confirms AFG3L2 as the autosomal dominant SCA28 gene.
- name: AFG3L2 biallelic variants (SPAX5)
  gene_term:
    preferred_term: AFG3L2
    term:
      id: hgnc:315
      label: AFG3L2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: SPAX5
  notes: >-
    Biallelic hypomorphic and/or null AFG3L2 genotypes cause the recessive SPAX5
    phenotype; the foundational allele is homozygous p.Tyr616Cys. The per-gene molecular
    spectrum and SPAX5 pathophysiology are curated in depth in the Spastic Ataxia entry
    (Spasticity-Ataxia-Gait_Anomalies_Syndrome).
  variants:
  - name: p.Y616C
    description: >-
      c.1847G>A (p.Y616C) homozygous missense; the foundational SPAX5 allele, a
      hypomorphic variant with impaired m-AAA complex oligomerization.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22022284
      reference_title: "Whole-exome sequencing identifies homozygous AFG3L2 mutations in a spastic ataxia-neuropathy syndrome linked to mitochondrial m-AAA proteases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing identified a homozygous missense mutation (c.1847G>A;
        p.Y616C) in AFG3L2, encoding a subunit of an m-AAA protease.
      explanation: Reports the foundational homozygous p.Y616C SPAX5 variant.
  evidence:
  - reference: PMID:42412416
    reference_title: "Loss of Function of AFG3L2 Leading to Developmental and Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with spastic ataxia 5-usually involving null-missense or
      missense-missense genotypes-DEE predominantly features null-null combinations.
    explanation: Describes the biallelic genotype spectrum of SPAX5 relative to the more severe null-null encephalopathy.

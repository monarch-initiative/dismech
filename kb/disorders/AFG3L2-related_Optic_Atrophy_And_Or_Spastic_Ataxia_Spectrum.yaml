    term:
      id: hgnc:315
      label: AFG3L2
  description: >-
    Dominant optic atrophy from heterozygous AFG3L2 variants, which cluster in the
    ATPase domain and act through abnormal OPA1 processing - a mechanism distinct from
    the proteolytic-domain SCA28 variants. Presents with decreased visual acuity,
    photophobia, impaired color vision, optic-disc pallor and markedly reduced retinal
    nerve fiber layer; brain MRI is often normal. Some individuals additionally have
    sensorineural hearing loss, dystonia or spasticity.
  evidence:
  - reference: PMID:32219868
    reference_title: "ATPase Domain AFG3L2 Mutations Alter OPA1 Processing and Cause Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the DOA-associated AFG3L2 mutations were clustered in the ATPase domain,
      whereas SCA28-associated mutations mostly affect the proteolytic domain.
    explanation: >-
      Establishes OPA12 as an ATPase-domain-variant phenotype mechanistically distinct
      from SCA28.

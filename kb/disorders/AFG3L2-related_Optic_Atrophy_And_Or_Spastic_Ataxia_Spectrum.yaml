      label: AFG3L2
  description: >-
    The most common AFG3L2 phenotype: an adult-onset, very slowly progressive
    cerebellar ataxia from heterozygous (usually proteolytic-domain, loss-of-function)
    variants, with pyramidal signs emerging over long disease duration. Optic atrophy
    is characteristically absent, which is the main reason the ClinGen/MONDO
    optic-atrophy / spastic-ataxia lump (MONDO:0700372) treats SCA28 as adjacent
    rather than core; it is included here as a named subtype of the AFG3L2 spectrum.

    causal_link_type: DIRECT
    description: ATPase-domain loss of function impairs m-AAA-mediated inner-membrane protein quality control.
  evidence:
  - reference: PMID:32219868
    reference_title: "ATPase Domain AFG3L2 Mutations Alter OPA1 Processing and Cause Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the DOA-associated AFG3L2 mutations were clustered in the ATPase domain,
      whereas SCA28-associated mutations mostly affect the proteolytic domain.
    explanation: Localizes the OPA12-causing variants to the ATPase domain, distinct from SCA28.

  - target: Elevated circulating alpha-fetoprotein concentration
    description: >-
      Persistent AFP elevation is strongly associated with A-T after early
      childhood, although its mechanistic link to ATM loss is unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27884168

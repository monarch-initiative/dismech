    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The result is genomic instability which can lead to the development of
      cancers [6].
    explanation: >-
      This directly links the defective ATM stress response to genomic
      instability and cancer.
  - reference: PMID:39521281
    reference_title: Prevalence and outcomes of cancer and treatment-associated toxicities for patients with ataxia telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-four (16.5%) of 508 individuals were diagnosed with a primary
      cancer, of whom 62 (74%) were hematologic in origin and 22 (26%) were
      solid-organ cancers.
    explanation: >-
      A large contemporary cohort quantifies the cancer burden and spectrum.
  downstream:

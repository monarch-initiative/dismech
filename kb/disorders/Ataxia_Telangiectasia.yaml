- name: Intra-erythrocyte dexamethasone sodium phosphate (EryDex)
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    EryDex is an investigational erythrocyte-delivered corticosteroid for
    neurologic symptoms. The published ATTeST phase 3 trial did not meet its
    primary efficacy endpoint overall, although safety was acceptable and an
    age-defined subgroup signal was explored. The separate NEAT phase 3 trial
    (NCT06193200) is completed; no disease-modifying efficacy should be inferred
    until results are available.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  target_mechanisms:
  - target: Progressive cerebellar and peripheral neurodegeneration
    treatment_effect: MODULATES
    description: The clinical program tests symptomatic neurologic modulation rather than proven ATM restoration.
  evidence:
  - reference: PMID:39152028
    reference_title: "Safety and efficacy of intra-erythrocyte dexamethasone sodium phosphate in children with ataxia telangiectasia (ATTeST): a multicentre, randomised, double-blind, placebo-controlled phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there were no safety concerns, the primary efficacy endpoint was
      not met, possibly related to delays in treatment reducing the number of
      participants who received treatment as outlined in the protocol, and
      potentially different treatment effects according to age.
    explanation: >-
      The phase 3 result supports continued investigation but not established
      efficacy.
- name: Triheptanoin
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Triheptanoin is investigational anaplerotic therapy studied in a 31-person
    phase 2a/b dose-escalation trial. Respiratory epithelial-cell death and
    selected neurologic, speech, and swallowing measures improved, but 38% of
    participants had gastrointestinal adverse events and dosing was capped.
    These early outcomes do not establish routine use.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:40616902
    reference_title: "Phase 2a/b randomised placebo-controlled dose-escalation trial of triheptanoin for ataxia-telangiectasia: treating mitochondrial dysfunction with anaplerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events including abdominal pain, nausea, vomiting, and diarrhoea,

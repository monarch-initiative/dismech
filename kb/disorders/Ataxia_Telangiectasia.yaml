      label: cell cycle checkpoint signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:30685876
    reference_title: "Ataxia-telangiectasia: A review of clinical features and molecular pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The principal role of nuclear ATM is the coordination of cellular
      signaling pathways in response to DNA double-strand breaks, oxidative
      stress, and cell cycle checkpoint.
    explanation: >-
      The review defines the central DNA-damage and stress-signaling role of ATM.
  - reference: PMID:30888062
    reference_title: "Two novel variants in the ATM gene causing ataxia-telangiectasia, including a duplication of 90 kb: Utility of targeted next-generation sequencing in detection of copy number variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical A-T is caused by biallelic variants on ATM (ataxia
      telangiectasia mutated) gene, leading to a loss of function of the protein
      kinase ATM, involved in DNA damage repair.
    explanation: >-
      Human molecular diagnoses link biallelic ATM loss of function to classic
      A-T.
  downstream:
  - target: Genomic instability, radiosensitivity, and cancer predisposition
    description: >-
      Failure of ATM-dependent double-strand-break signaling impairs repair and
      checkpoints, permitting chromosomal instability and hypersensitivity to
      DNA-break-inducing radiation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27884168
      reference_title: "Ataxia telangiectasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In the absence of the ATM protein, the signaling network that responds
        to DNA DSBs is defective, and responses to other types of genotoxic
        stress are reduced to various degrees.
      explanation: >-
        This directly links ATM absence to defective double-strand-break
        signaling and genotoxic-stress responses.
  - target: Adaptive immune-development and antibody-production defects
    description: >-
      ATM-dependent repair is required when lymphocyte antigen-receptor and
      class-switch recombination create programmed DNA breaks.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Impaired repair of programmed DNA breaks during V(D)J and class-switch recombination.
    evidence:
    - reference: PMID:27884168
      reference_title: "Ataxia telangiectasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: |-
        As lymphocytes develop they undergo gene rearrange-
        ments to generate clonal diversity and class switch
        recombination, processes which generate DSBs. In the
        absence of ATM, the effective repair of these DSBs is
        difficult [111 – 113].
      explanation: >-
        The review supplies the known recombination intermediate between ATM
        loss and adaptive immune dysfunction.
  - target: Progressive cerebellar and peripheral neurodegeneration
    description: >-
      ATM deficiency ultimately causes selective progressive neurologic injury,
      but the necessary molecular intermediates are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27884168
      reference_title: "Ataxia telangiectasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The cause of this cell death is not known, though many hypotheses have
        been proposed (reviewed in [11]).
      explanation: >-
        The review explicitly supports modeling this causal bridge as indirect
        with unknown intermediates.
  - target: Oxidative stress and microglial neuroinflammation
    description: >-
      ATM loss is associated with oxidative stress and an inflammatory
      microglial state, a plausible contributor to neuronal injury rather than
      an established sole cause.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38159274
      reference_title: ATM-deficiency-induced microglial activation promotes neurodegeneration in ataxia-telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        While ATM loss of function has long been identified as the genetic cause

- name: Genomic instability, radiosensitivity, and cancer predisposition
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Defective double-strand-break repair and checkpoint signaling permit
    spontaneous and induced chromosome breaks and rearrangements. Ionizing
    radiation and radiomimetic agents therefore cause disproportionate
    cytotoxicity. Genomic instability also promotes malignancy, especially
    lymphoid cancers in children; solid tumors comprise a larger share in
    adults and in variant A-T.
  biological_processes:

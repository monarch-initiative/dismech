    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ionizing radiation (x-ray and gamma ray) is contraindicated, due to
      increased sensitivity
    explanation: Current GeneReviews explicitly advises avoidance in affected individuals.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radiation therapy is contraindicated because increased radiosensitivity

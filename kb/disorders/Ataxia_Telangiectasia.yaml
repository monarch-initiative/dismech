      label: Neoplasm
  - preferred_term: Lymphoma
    term:
      id: HP:0002665
      label: Lymphoma
  evidence:
  - reference: PMID:38917355
    reference_title: ATM germ line pathogenic variants affect outcomes in children with ataxia-telangiectasia and hematological malignancies.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with A-T and leukemia/lymphoma may benefit from deescalated
      therapy for patients with absent ATM kinase activity and near-standard

review_notes: >-
  Comprehensive re-review completed 2026-07-20. Scope was narrowed to the
  biallelic ATM disease spectrum: classic and variant A-T remain subtypes,
  whereas MRE11-, APTX-, SETX-, PCNA-, and TDP1-related disorders are not A-T
  subtypes. Key supported phenocopies are represented as differential
  diagnoses; the differential list is intentionally not exhaustive. The causal
  graph now distinguishes established ATM/DNA-break, immune, pulmonary,
  radiosensitivity, and cancer mechanisms from provisional microglial evidence
  and explicitly unknown causal bridges. Supportive and preventive management
  is separated from investigational EryDex, triheptanoin, HSCT, and
  mutation-specific atipeksen. ClinicalTrials.gov recruitment states were
  checked on 2026-07-20. The prior broad top-level reference ledger was removed;
  the tagged GeneReviews record is retained for discoverability. Unsupported
  clinical placement of pioglitazone and alpha-ketoglutarate was also removed.
datasets:
- accession: geo:GSE282079
  title: NETSseq Reveals Inflammatory and Aging Mechanisms in Distinct Cell Types Driving Cerebellar Decline in Ataxia Telangiectasia
  description: The cellular and molecular changes driving the neurological abnormalities associated with the loss or functional deficiency of the ataxia–telangiectasia mutated (ATM) protein are not well understood. In this study, we applied our proprietary Nuclear Enriched Transcript Sort sequencing (NETSseq) platform to investigate changes in cell type composition and gene expression patterns in human cerebellar post-mortem tissue from ataxia–telangiectasia (A-T) donors and non-neurodegenerative disease control donors. Compared to single-cell technologies, NETSseq provided a more robust detection of lowly expressed and differentially expressed genes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 318
  publication: PMID:40959764
  notes: Identified by GEO DataSets index search for Ataxia-telangiectasia (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

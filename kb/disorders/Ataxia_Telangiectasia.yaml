    evidence_source: OTHER
    snippet: including discussion of potential risks to offspring and reproductive options
    explanation: GeneReviews explicitly includes offspring risk and reproductive options in counseling.
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      Genetic counseling: Genetic counseling can help family members of a patient with A-T understand when genetic
      testing for A-T is feasible, and how the test results should be interpreted.

      function of the protein kinase ATM, involved in DNA damage repair.
    explanation: The human genetic report supports the biallelic ATM requirement.
- name: Clinical and laboratory evaluation for suspected A-T
  description: >-
    Progressive ataxia and abnormal eye movements raise suspicion. Supporting
    clues include telangiectasia, recurrent sinopulmonary infection, elevated
    AFP after age two, immunoglobulin deficiency, and lymphopenia. No single
    supporting clue substitutes for molecular confirmation.
  results: A convergent neurologic, immunologic, and laboratory pattern supports targeted ATM testing.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of A-T is usually suspected by the combination of neurologic
      clinical features (ataxia, abnormal control of eye movement, and postural
      instability) with one or more of the following which may vary in their
      appearance: telangiectasia, frequent sinopulmonary infections and specific
      laboratory abnormalities (e.g. IgA deficiency, lymphopenia especially
      affecting T lymphocytes and increased alpha-fetoprotein levels).
    explanation: The review defines the clinical and laboratory suspicion pattern.
- name: ATM protein and kinase functional testing
  description: >-
    When molecular findings are incomplete or phenotype classification matters,
    specialized laboratories can assess ATM protein abundance and kinase
    activity in cultured cells. Cellular radiosensitivity and chromosome-break
    assays can support the diagnosis but are not substitutes for variant
    interpretation.
  results: Absent or deficient ATM protein or kinase activity supports A-T and helps distinguish classic from variant disease.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A diagnosis of A-T can be confirmed by the finding of an absence or
      deficiency of the ATM protein or its kinase activity in cultured cell
      lines, and/or identification of the pathological mutations in the ATM
      gene.
    explanation: The review identifies specialized protein and kinase assays as confirmatory tests.
- name: SCID newborn-screen signal
  description: >-
    TREC-based newborn screening for severe combined immunodeficiency can detect
    lymphopenic classic A-T before neurologic manifestations, but sensitivity is
    incomplete and a positive screen requires specialist evaluation and
    molecular diagnosis.
  results: Reduced T-cell receptor excision circles can trigger evaluation for A-T among causes of neonatal lymphopenia.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      newborn screening (NBS) for severe combined immunodeficiency (SCID) that
      relies on the identification of reduced T-cell receptor excision circle
      (TREC) levels in blood spots most likely identifies about 50% of children
      with classic A-T
    explanation: GeneReviews quantifies the incomplete sensitivity of TREC screening for classic A-T.
differential_diagnoses:
- name: Ataxia-telangiectasia-like disorder 1
  disease_term:
    preferred_term: ataxia-telangiectasia-like disorder 1
    term:
      id: MONDO:0024557
      label: ataxia-telangiectasia-like disorder 1
  description: >-
    Biallelic MRE11 deficiency can produce progressive ataxia, oculomotor
    abnormalities, cerebellar atrophy, and cellular radiosensitivity that
    resemble A-T.
  distinguishing_features:
  - Telangiectasia, immunodeficiency, elevated AFP, and cancer predisposition are absent or less prominent than in classic A-T.
  - Molecular testing identifies biallelic MRE11 rather than ATM variants.
  evidence:
  - reference: PMID:30888062
    reference_title: "Two novel variants in the ATM gene causing ataxia-telangiectasia, including a duplication of 90 kb: Utility of targeted next-generation sequencing in detection of copy number variation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Atypical presentations can be found in A-T-like disease or in Nijmegen
      breakage syndrome, caused by deficiency of mre11 or nibrin proteins,
      respectively.
    explanation: The review identifies MRE11-deficient A-T-like disease as a phenocopy.
- name: Nijmegen breakage syndrome
  disease_term:
    preferred_term: Nijmegen breakage syndrome
    term:
      id: MONDO:0009623
      label: Nijmegen breakage syndrome
  description: >-
    Biallelic NBN deficiency overlaps through immunodeficiency,
    radiosensitivity, chromosome instability, growth failure, and cancer risk.
  distinguishing_features:
  - Progressive microcephaly and characteristic facies are typical, whereas progressive cerebellar neurodegeneration is not.
  - Molecular testing identifies biallelic NBN rather than ATM variants.
  evidence:
  - reference: PMID:30888062
    reference_title: "Two novel variants in the ATM gene causing ataxia-telangiectasia, including a duplication of 90 kb: Utility of targeted next-generation sequencing in detection of copy number variation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Atypical presentations can be found in A-T-like disease or in Nijmegen
      breakage syndrome, caused by deficiency of mre11 or nibrin proteins,
      respectively.
    explanation: The review identifies nibrin deficiency as the basis of this overlapping disorder.
- name: Ataxia with oculomotor apraxia type 1
  disease_term:
    preferred_term: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
    term:
      id: MONDO:0008842
      label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
  description: >-
    Biallelic APTX disease overlaps through childhood-onset ataxia, oculomotor
    apraxia, and axonal neuropathy.
  distinguishing_features:
  - Hypoalbuminemia and hypercholesterolemia favor AOA1.
  - AFP is generally normal, and telangiectasia, immunodeficiency, radiosensitivity, and cancer predisposition are not typical.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These include: ataxia oculomotor apraxia type 1 (AOA1), ataxia oculomotor
      apraxia type 2 (AOA2, also known as SCAR1), ataxia telangiectasia like
      disorder (ATLD) and Nijmegen breakage syndrome (NBS).
    explanation: The clinical review explicitly includes AOA1 in the A-T differential.
- name: Ataxia with oculomotor apraxia type 2
  disease_term:
    preferred_term: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
    term:
      id: MONDO:0018996
      label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
  description: >-
    Biallelic SETX disease overlaps through progressive ataxia, axonal
    sensorimotor neuropathy, occasional oculomotor apraxia, and elevated AFP.
  distinguishing_features:
  - Onset is usually later than classic A-T and immunodeficiency, telangiectasia, radiosensitivity, and cancer predisposition are not typical.
  - Molecular testing identifies biallelic SETX rather than ATM variants.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These include: ataxia oculomotor apraxia type 1 (AOA1), ataxia oculomotor
      apraxia type 2 (AOA2, also known as SCAR1), ataxia telangiectasia like
      disorder (ATLD) and Nijmegen breakage syndrome (NBS).
    explanation: The clinical review explicitly includes AOA2 in the A-T differential.
- name: Friedreich ataxia
  disease_term:
    preferred_term: Friedreich ataxia
    term:
      id: MONDO:0100339
      label: Friedreich ataxia
  description: >-
    Biallelic FXN disease is a common recessive childhood or adolescent ataxia
    and can overlap through progressive gait and peripheral nerve dysfunction.
  distinguishing_features:
  - Telangiectasia and oculomotor apraxia are absent; AFP is normal.
  - Early areflexia, sensory proprioceptive loss, scoliosis, and cardiomyopathy favor Friedreich ataxia.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In FRDA, ataxia typically appears between 10 and 15 years of age, and
      differs from A-T by the absence of telangiectasia and oculomotor apraxia,
      the early absence of tendon reflexes, a normal AFP , the frequent presence
      of scoliosis, and abnormal features on the EKG.
    explanation: The review provides direct distinguishing features for Friedreich ataxia.
discussions:
- discussion_id: gap_at_selective_neurodegeneration
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ATM kinase deficiency and defective DNA-damage signaling
  - pathophysiology#Oxidative stress and microglial neuroinflammation
  - pathophysiology#Progressive cerebellar and peripheral neurodegeneration
  prompt: >-
    Which ATM-dependent failure is necessary and sufficient for selective
    Purkinje and granule neuron degeneration in human A-T, and how much is
    driven by neuronal DNA-damage responses versus oxidative, mitochondrial,
    epigenetic, or microglial pathways?
  rationale: >-
    Human cerebellar single-nucleus data and patient-derived co-cultures support
    microglial involvement, but the ATM-to-selective-neuron causal chain remains
    unresolved and multiple hypotheses may coexist. The graph therefore marks
    the microglial branch provisional and the root-to-neurodegeneration edge as
    indirect with unknown intermediates.
  evidence:
  - reference: PMID:38159274
    reference_title: ATM-deficiency-induced microglial activation promotes neurodegeneration in ataxia-telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While ATM loss of function has long been identified as the genetic cause
      of ataxia-telangiectasia (A-T), how it leads to selective and progressive
      degeneration of cerebellar Purkinje and granule neurons remains unclear.
    explanation: The recent human study explicitly states the unresolved causal problem.
- discussion_id: gap_at_neurologic_disease_modification
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Intra-erythrocyte dexamethasone sodium phosphate (EryDex)
  - treatments#Triheptanoin
  - treatments#Atipeksen for ATM c.7865C>T
  prompt: >-
    Which intervention can produce durable, clinically meaningful slowing of
    neurologic decline across age and ATM-function strata rather than a
    short-term scale or biomarker change?
  rationale: >-
    ATTeST missed its overall primary endpoint, the triheptanoin study was small
    and dose-limited, and atipeksen is mutation-specific and just entering
    first-in-human evaluation. No therapy is yet established to arrest the
    neurodegenerative course.
  evidence:
  - reference: PMID:39152028
    reference_title: "Safety and efficacy of intra-erythrocyte dexamethasone sodium phosphate in children with ataxia telangiectasia (ATTeST): a multicentre, randomised, double-blind, placebo-controlled phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there were no safety concerns, the primary efficacy endpoint was
      not met
    explanation: The largest published phase 3 neurologic study did not establish overall efficacy.
  - reference: clinicaltrials:NCT07215416
    reference_title: A Phase 1/2 Study of Antisense Oligonucleotide Therapy for Treatment of Ataxia-Telangiectasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The investigators will conduct a clinical trial to study the safety and
      efficacy of intrathecal administration of atipeksen, a targeted genetic
      therapy that restores ATM gene function in A-T individuals bearing the
      recurrent ATM c.7865C\>T variant.
    explanation: The registry shows both the early trial stage and narrow genotype eligibility.
- discussion_id: gap_at_hsct_net_benefit
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Hematopoietic stem cell transplantation
  - pathophysiology#Adaptive immune-development and antibody-production defects
  - pathophysiology#Progressive cerebellar and peripheral neurodegeneration
  prompt: >-
    Which individuals, if any, obtain a net survival benefit from pre-emptive
    allogeneic HSCT once immune reconstitution, malignancy risk, conditioning
    toxicity, and continued neurodegeneration are considered together?
  rationale: >-
    Small reports show immune reconstitution, but they cannot establish
    prevention of malignancy or neurologic benefit and conditioning is
    especially consequential in a DNA-repair disorder. HSCT is therefore
    retained as investigational, not standard preventive care.
  evidence:
  - reference: PMID:30420857
    reference_title: Pre-emptive Allogeneic Hematopoietic Stem Cell Transplantation in Ataxia Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is a matter of discussion whether pre-emptive allogeneic hematopoietic
      stem cell transplantation (alloHSCT) using a reduced intensity
      conditioning regimen would be an option to restore immune-competence and
      prevent malignancy
    explanation: The proof-of-concept report itself frames the indication as unsettled.

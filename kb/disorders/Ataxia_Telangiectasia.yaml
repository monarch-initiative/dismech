    explanation: GeneReviews separately identifies therapeutic radiation as contraindicated.
- name: ATM-activity-adapted treatment of hematologic malignancy
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Cancer therapy requires an A-T-experienced oncology team and avoidance of
    standard radiotherapy. A 2024 international cohort suggests de-escalated
    leukemia or lymphoma therapy when ATM kinase activity is absent and
    near-standard regimens when residual activity is present; this is
    risk-adapted evidence, not a universal protocol.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Neoplasm

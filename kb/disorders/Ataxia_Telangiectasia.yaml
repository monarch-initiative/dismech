genetic:
- name: ATM
  gene_term:
    preferred_term: ATM
    term:
      id: hgnc:795
      label: ATM
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Biallelic germline pathogenic variants in ATM cause A-T. Truncating alleles
    are commonly associated with absent kinase activity and classic disease;
    hypomorphic missense or splice variants can preserve activity and produce
    variant A-T. These are probabilistic genotype-phenotype correlations:
    residual kinase activity is more informative than variant class alone, and
    cancer risk remains increased across the spectrum.
  evidence:
  - reference: CGGV:assertion_02a69e27-77dc-41bd-83d2-dda9c224ee43-2021-07-27T205239.729Z
    reference_title: "ATM / ataxia telangiectasia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ATM | HGNC:795 | ataxia telangiectasia | MONDO:0008840 | AR | Definitive
    explanation: ClinGen classifies the autosomal-recessive ATM-A-T relationship as definitive.
  - reference: PMID:30888062
    reference_title: "Two novel variants in the ATM gene causing ataxia-telangiectasia, including a duplication of 90 kb: Utility of targeted next-generation sequencing in detection of copy number variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical A-T is caused by biallelic variants on ATM (ataxia
      telangiectasia mutated) gene, leading to a loss of function of the protein
      kinase ATM, involved in DNA damage repair.
    explanation: Human molecular diagnosis supports biallelic ATM loss of function.
  - reference: PMID:22213089
    reference_title: "Presence of ATM protein and residual kinase activity correlates with the phenotype in ataxia-telangiectasia: a genotype-phenotype study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genotypes of severely affected patients generally included truncating
      mutations resulting in total absence of ATM kinase activity, while
      patients with milder phenotypes harbored at least one missense or splice
      site mutation resulting in expression of ATM with some kinase activity.
    explanation: >-
      The genotype-phenotype cohort supports, but does not make absolute, the
      relationship between residual kinase activity and milder disease.
treatments:
- name: Multidisciplinary rehabilitation
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physical, occupational, and speech-language therapy, together with
    rehabilitation medicine, are supportive care. They aim to preserve safe
    mobility, communication, participation, and independence but have not been
    shown to stop neurodegeneration.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  - preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care to improve quality of life, maximize function, and reduce
      complications ideally involves multidisciplinary care
    explanation: >-
      Current GeneReviews recommends multidisciplinary supportive care rather
      than claiming a disease-modifying rehabilitation effect.
  - reference: PMID:34107524
    reference_title: "Effectiveness of Physical Therapy on Ataxia-Telangiectasia: A Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive changes were observed in the TCMS, PBBS, GMFM, and motor
      performance, participation, and quality of life.
    explanation: >-
      A single-child case report provides low-certainty evidence of functional
      benefit and is therefore marked PARTIAL.
- name: Immunology-guided infection prevention and immunoglobulin replacement
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Vaccination, antimicrobial prophylaxis, and intravenous or subcutaneous
    immunoglobulin are individualized according to immunoglobulin levels,
    vaccine responses, lymphocyte status, and infection history. Live rubella
    vaccine should be avoided in severe immunodeficiency; management should be
    directed by an immunodeficiency specialist.
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  target_mechanisms:
  - target: Adaptive immune-development and antibody-production defects
    treatment_effect: BYPASSES
    description: >-
      Replacement immunoglobulin supplies antibody function without correcting
      the underlying ATM-dependent lymphocyte-development defect.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      The need for additional im-
      munizations (especially with pneumococcal and influenza
      vaccines), antibiotics to provide prophylaxis from infec-
      tions, and/or gamma globulin therapy should be deter-
      mined by an expert in the field of immunodeficiency or
      infectious diseases.
    explanation: >-
      The review recommends individualized specialist-directed preventive and
      replacement therapy.
- name: Airway clearance and pulmonary care
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Pulmonary follow-up addresses secretion retention, infection, weak cough,
    aspiration, and restrictive or interstitial disease. Manual chest therapy,
    oscillating devices, or a chest physiotherapy vest can be used when
    secretions are increased, with cough-assist support when needed.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  target_mechanisms:
  - target: Multifactorial chronic pulmonary injury
    treatment_effect: MODULATES
    description: Airway-clearance techniques reduce retained secretions and secondary airway injury.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      Children and adults with increased bronchial secre-
      tions may benefit from routine chest therapy using the
      manual method, and a cappella device or a chest physio-
      therapy vest.
    explanation: The review supports airway-clearance therapy when secretions are increased.
- name: Swallowing and nutritional support
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Speech-language and nutrition teams adapt food texture, meal support, and
    caloric intake. Gastrostomy is considered when oral intake cannot sustain
    growth or weight, aspiration is problematic, or meals are excessively long
    and stressful.
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_phenotypes:
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      A gastrostomy tube (G-tube or feeding tube) is recom-
      mended when any of the following occur: a child cannot
      eat enough to grow or a person of any age cannot eat
      enough to maintain weight; aspiration is problematic;
      mealtimes are stressful or too long, interfering with
      other activities [161].
    explanation: >-
      The review states clinical thresholds for escalation to gastrostomy rather
      than recommending it universally.
- name: Malignancy surveillance
  action_category: SCREENING
  description: >-
    Lifelong clinical and laboratory surveillance is required because cancer
    can occur in childhood or adulthood. Evaluation is symptom- and
    age-directed, and imaging choices should minimize ionizing radiation.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Eval for clinical manifestations of malignancy (e.g., lymphadenopathy)
    explanation: >-
      GeneReviews includes malignancy assessment in recommended evaluation and
      surveillance; the record does not imply a validated universal imaging
      protocol.
- name: Avoidance of ionizing radiation and radiotherapy
  description: >-
    Diagnostic x-rays and CT should be limited to medically necessary
    situations and non-ionizing alternatives used when suitable. Therapeutic
    radiation is contraindicated in affected individuals because severe
    radiosensitivity can cause major complications. This restriction does not
    automatically apply to heterozygous relatives.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Increased sensitivity to ionizing radiation
    term:
      id: HP:0011133

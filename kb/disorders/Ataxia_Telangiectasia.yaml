name: Ataxia-telangiectasia
creation_date: '2026-03-15T23:04:29Z'
category: Mendelian
synonyms:
- Louis-Bar syndrome
- A-T
description: >-
  Ataxia-telangiectasia (A-T) is a rare autosomal recessive multisystem
  disorder caused by biallelic pathogenic variants in ATM. Deficient ATM
  kinase signaling impairs the response to DNA double-strand breaks and other
  cellular stresses, producing progressive neurologic disease, variable
  immunodeficiency and pulmonary disease, cellular radiosensitivity, and a
  high risk of malignancy. The phenotype is a continuum from childhood-onset
  classic A-T, usually associated with absent ATM kinase activity, to
  later-onset variant A-T, often associated with residual activity. The
  mechanisms connecting ATM loss to selective neurodegeneration,
  telangiectasia, and elevated alpha-fetoprotein remain incompletely resolved.
disease_term:
  preferred_term: Ataxia-telangiectasia
  term:
    id: MONDO:0008840
    label: ataxia telangiectasia
parents:
- Combined immunodeficiency
- Hereditary cerebellar ataxia
- DNA repair disorder
has_subtypes:
- name: Classic ataxia-telangiectasia
  description: >-
    The severe end of the ATM-related spectrum. Progressive cerebellar ataxia
    begins in early childhood and is followed by extrapyramidal involvement,
    sensorimotor neuropathy, variable combined immunodeficiency, pulmonary
    disease, and early malignancy risk. ATM kinase activity is usually absent
    or extremely low, but clinical severity should not be inferred from variant
    class alone.
  genes:
  - preferred_term: ATM
    term:
      id: hgnc:795
      label: ATM
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      childhood onset of progressive
      neurologic manifestations (initially cerebellar ataxia, followed
      typically by extrapyramidal involvement and peripheral sensorimotor
      neuropathy), immunodeficiency (variably associated with abnormalities of
      humoral immunity, cellular immunity, or combined immune deficiency),
      pulmonary disease (resulting from recurrent infections, immune
      deficiency, aspiration, interstitial lung disease, and neurologic
      abnormalities), and increased risk of malignancy.
    explanation: >-
      The current GeneReviews revision defines the principal manifestations of
      classic A-T without treating every feature as universal.
  - reference: PMID:22213089
    reference_title: "Presence of ATM protein and residual kinase activity correlates with the phenotype in ataxia-telangiectasia: a genotype-phenotype study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients without ATM kinase activity showed the classical phenotype.
    explanation: >-
      A human genotype-phenotype cohort links absent kinase activity to classic
      disease while leaving room for individual variability.
- name: Variant ataxia-telangiectasia
  description: >-
    The milder end of the ATM-related spectrum, commonly associated with
    residual ATM kinase activity. Onset and neurologic progression are later or
    slower; dystonia, tremor, or axonal neuropathy may dominate and cerebellar
    ataxia can be absent. Immune and pulmonary manifestations are generally
    less prominent, but malignancy risk remains increased and may present in
    adulthood.
  genes:
  - preferred_term: ATM
    term:
      id: hgnc:795
      label: ATM
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While cerebellar ataxia can be absent, extrapyramidal movement disorders are common
      (typically dystonia and dystonic tremor) and most individuals have
      manifestations of axonal sensorimotor polyneuropathy.
    explanation: >-
      GeneReviews defines variant A-T as part of the same ATM-related continuum
      and describes its distinguishing neurologic pattern.
  - reference: PMID:22213089
    reference_title: "Presence of ATM protein and residual kinase activity correlates with the phenotype in ataxia-telangiectasia: a genotype-phenotype study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Residual kinase activity correlated with a milder and essentially
      different neurological phenotype, absence of telangiectasia, normal
      endocrine and pulmonary function, normal immunoglobulins, significantly
      lower X-ray hypersensitivity in lymphocytes, and extended lifespan.
    explanation: >-
      Human data associate residual kinase activity with a milder phenotype;
      this is a correlation rather than an absolute genotype rule.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A-T results from biallelic pathogenic ATM variants. When both parents are
    heterozygous, each pregnancy has a 25% probability of an affected child, a
    50% probability of a heterozygous child, and a 25% probability of a child
    who inherited neither familial variant.
  evidence:
  - reference: PMID:30888062
    reference_title: "Two novel variants in the ATM gene causing ataxia-telangiectasia, including a duplication of 90 kb: Utility of targeted next-generation sequencing in detection of copy number variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Ataxia-telangiectasia (A-T) is a rare autosomal recessive neurodegenerative
      disorder characterized by progressive cerebellar ataxia, ocular apraxia,
      immunodeficiency, telangiectasia, elevated serum α-fetoprotein concentration,
      radiosensitivity and cancer predisposition. Classical A-T is caused by biallelic
      variants on ATM (ataxia telangiectasia mutated) gene, leading to a loss of
      function of the protein kinase ATM, involved in DNA damage repair.
    explanation: >-
      The human case report's background directly states both autosomal
      recessive inheritance and the biallelic ATM requirement.
prevalence:
- population: Global live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 1.0
  rate_high: 2.5
  notes: >-
    The frequently cited worldwide birth-prevalence estimate is one in 40,000
    to one in 100,000, equivalent to 1.0-2.5 per 100,000 live births. Founder
    populations can have higher local frequencies, and ascertainment is
    incomplete.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      EPIDEMIOLOGY: The world-wide prevalence of A-T is estimated to be between
      1 in 40,000 and 1 in 100,000 live births.
    explanation: >-
      The clinical review supplies the standard worldwide range, normalized
      here to cases per 100,000 live births.
progression:
- phase: Classic A-T - early childhood onset
  subtype: Classic ataxia-telangiectasia
  age_range: Infancy to early childhood
  notes: >-
    Postural instability and progressive ataxia usually become apparent when a
    child begins sitting or walking; telangiectasia can emerge later, so its
    absence early does not exclude A-T.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurological symptoms most often first appear in early childhood when
      children begin to sit or walk.
    explanation: The review places typical neurologic onset in early childhood.
- phase: Classic A-T - progressive neurologic disability
  subtype: Classic ataxia-telangiectasia
  age_range: School age through adolescence
  notes: >-
    Gait, eye-movement, speech, extrapyramidal, and peripheral nerve
    abnormalities progress. Many affected children require a wheelchair around
    the beginning of the second decade; dysphagia commonly emerges during that
    decade.
  evidence:
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Around the beginning of their second decade children with classic A-T
      start using a wheelchair in the community setting [4].
    explanation: >-
      This gives a representative functional milestone for classic A-T, not an
      invariant deadline.
  - reference: PMID:27884168
    reference_title: "Ataxia telangiectasia: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      Dysphagia is common in A-T and typically appears
      during the second decade of life because of the neuro-
    explanation: >-
      The clinical review describes dysphagia as a later neurologic
      complication.
- phase: Classic A-T - later multisystem morbidity
  subtype: Classic ataxia-telangiectasia
  age_range: Childhood through adulthood
  notes: >-
    Cancer, chronic lung disease, and infection drive premature mortality.
    Improved supportive care has extended survival, so adult pulmonary,
    metabolic, hepatic, and solid-tumor complications are increasingly
    encountered.
  evidence:
  - reference: PMID:21665257
    reference_title: Morbidity and mortality from ataxia-telangiectasia are associated with ATM genotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cancer (hazard ratio, 2.7; 95% CI, 1.6-4.5) and respiratory tract
      infections (hazard ratio, 2.3; 95% CI, 1.4-3.8) were independently
      associated with mortality.
    explanation: >-
      A 240-patient cohort identifies cancer and respiratory infection as major
      mortality determinants.
- phase: Variant A-T - slower and later course
  subtype: Variant ataxia-telangiectasia
  age_range: Childhood to adulthood
  notes: >-
    Neurologic decline is generally slower and life expectancy longer than in
    classic A-T. Immunodeficiency and pulmonary disease may be absent, whereas
    cancer risk persists and malignancy can precede recognition of A-T.
  evidence:
  - reference: PMID:22213089
    reference_title: "Presence of ATM protein and residual kinase activity correlates with the phenotype in ataxia-telangiectasia: a genotype-phenotype study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the phenotypic manifestations in A-T show a continuous spectrum
      from severe classical childhood-onset A-T to a relatively mild adult-onset
      disorder, depending on the presence of ATM protein and kinase activity.
    explanation: >-
      This cohort supports a continuum rather than sharply separated diseases.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Classic A-T causes progressive loss of motor independence together with
    recurrent infection, chronic pulmonary morbidity, feeding impairment,
    marked treatment-related radiosensitivity, and early cancer risk. Variant
    A-T can be substantially milder, but no part of the spectrum is free of
    malignancy risk or the need for lifelong multidisciplinary surveillance.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK26468/
    reference_title: Ataxia-Telangiectasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Life expectancy is significantly reduced due to cancer, pulmonary
      disease, and infections.
    explanation: >-
      GeneReviews directly identifies the major life-limiting complications of
      classic A-T.
pathophysiology:
- name: ATM kinase deficiency and defective DNA-damage signaling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic pathogenic ATM variants reduce or abolish ATM kinase function.
    ATM normally coordinates signaling after DNA double-strand breaks and
    oxidative or genotoxic stress, including checkpoint activation and repair.
    Its deficiency is the established proximal lesion; downstream tissue
    selectivity is not explained by the DNA-damage response alone.
  genes:
  - preferred_term: ATM
    term:
      id: hgnc:795
      label: ATM
  molecular_functions:

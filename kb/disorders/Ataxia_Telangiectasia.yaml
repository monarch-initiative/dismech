    explanation: >-
      The phase 2 trial documents tolerability limitations; efficacy remains
      preliminary.
- name: Hematopoietic stem cell transplantation
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic HSCT can reconstitute hematopoietic immunity in selected
    individuals, but experience is limited to single cases and small series,
    neurologic outcomes are divergent, and transplant conditioning is hazardous
    in a radiosensitive DNA-repair disorder. It remains investigational rather
    than standard preventive therapy.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_phenotypes:

name: Meningeal tuberculosis
creation_date: "2026-09-30T03:19:40Z"
description: >-
  Meningeal tuberculosis is central nervous system tuberculosis caused by
  Mycobacterium tuberculosis, in which inhaled bacilli establish a primary
  pulmonary or disseminated focus, seed the meninges hematogenously, and trigger
  rupture of a caseating Rich focus into the subarachnoid space, basal
  granulomatous exudate, vasculitic infarction, hydrocephalus, and subacute
  meningitis with high mortality and neurologic morbidity.
category: Infectious Disease
disease_term:
  preferred_term: meningeal tuberculosis
  term:
    id: MONDO:0006042
    label: meningeal tuberculosis
parents:
- Bacterial meningitis
- Tuberculosis
synonyms:
- tuberculous meningitis
- TB meningitis
- tuberculosis meningitis
notes: >-
  Seeded from `research/Meningeal_Tuberculosis-deep-research-openscientist.md`
  (OpenScientist, fallback from Falcon). Each claim is supported by its own
  evidence items, which quote primary studies, cohort meta-analyses and reviews
  of tuberculous meningitis.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    Mycobacterium tuberculosis is the acid-fast intracellular bacterium that
    causes pulmonary tuberculosis and meningeal tuberculosis after dissemination
    to the central nervous system.
  evidence:
  - reference: PMID:36795648
    reference_title: "Microbiological diagnosis and mortality of tuberculosis meningitis: Systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Tuberculosis (TB) which is caused by Mycobacterium tuberculosis poses a
      significant public health global treat.
    explanation: >-
      Establishes M. tuberculosis as the bacterial cause of tuberculosis, of
      which tuberculous meningitis is the CNS form.
agent_life_cycle:
  description: >-
    M. tuberculosis transmits between humans by airborne droplet nuclei, enters
    alveolar macrophages in the lung, persists in granulomatous foci, and can
    disseminate hematogenously to seed the meninges.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    Humans acquire M. tuberculosis through inhalation of airborne bacilli; later
    dissemination from the primary infection can seed the central nervous
    system.
prevalence:
- population: Active tuberculosis cases
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Tuberculous meningitis is reported as about 1% of active tuberculosis cases.
    This is a share of TB cases rather than a population prevalence or incidence
    rate, so no rate_per_100000 is asserted.
  evidence:
  - reference: PMID:36795648
    reference_title: "Microbiological diagnosis and mortality of tuberculosis meningitis: Systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Tuberculosis meningitis (TBM) accounts for approximately 1% of all active
      TB cases.
    explanation: >-
      Reports the approximate TBM share among active tuberculosis cases.
environmental:
- name: HIV co-infection
  description: >-
    HIV infection increases progression to active tuberculosis and CNS
    involvement, and TBM patients with HIV co-infection have higher mortality.
  influences_mechanisms:
  - target: Hematogenous CNS Tuberculous Seeding
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV infection increases the risk of active TB and CNS involvement among
      people with TB, but the cited sources do not pin the intervening steps to
      a single node in this graph.
    evidence:
    - reference: PMID:30611205
      reference_title: Mortality in hospitalized patients with tuberculous meningitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        HIV infection significantly increases the risk of developing active TB,
        the rate of progression from latent to active disease, and TB-associated
        morbidity and mortality
      explanation: >-
        Supports HIV infection as a risk factor for active tuberculosis and
        progression from latent infection.
  evidence:
  - reference: PMID:30611205
    reference_title: Mortality in hospitalized patients with tuberculous meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When multivariable analysis was applied, significant associations with
      in-hospital mortality were seen among patients with HIV (RR 2.06;
      Confidence Interval 95% (95% CI) 1.44-2.94)
    explanation: >-
      Quantifies HIV co-infection as a predictor of in-hospital mortality in a
      Peruvian adult TBM cohort.
  - reference: PMID:36795648
    reference_title: "Microbiological diagnosis and mortality of tuberculosis meningitis: Systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      the pooled case fatality rate among HIV positive and HIV negative TBM
      individuals was 53.39% (95%CI; 40.55-66.24) and 21.65%
      (95%CI;4.27-39.03) respectively.
    explanation: >-
      A systematic review found higher pooled case fatality in HIV-positive TBM
      than in HIV-negative TBM.
pathophysiology:
- name: Pulmonary Mycobacterium tuberculosis entry
  role: trigger
  description: >-
    Inhaled bacilli reach alveolar macrophages and establish a pulmonary or
    disseminated tuberculous focus.
  biological_scale: ORGANISM
  downstream:
  - target: Hematogenous CNS Tuberculous Seeding
    causal_link_type: DIRECT
    description: >-
      Bacilli disseminate from the primary site through the bloodstream toward
      meningeal or subependymal foci.
- name: Hematogenous CNS Tuberculous Seeding
  description: >-
    Bloodborne M. tuberculosis seeds the meninges or adjacent ependymal surfaces
    and creates a caseating subpial or subependymal Rich focus.
  biological_scale: ORGANISM
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  downstream:
  - target: Rich Focus Rupture Into CSF
    causal_link_type: DIRECT
    description: >-
      A caseating focus at a meningeal or ependymal surface can rupture into the
      subarachnoid space.
  evidence:
  - reference: PMID:7610242
    reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms and the changes described herein typically begin with a
      dense basal meningeal exudate often resulting from a "Rich focus" along
      the basal surface of the cerebrum or ventricular ependyma.
    explanation: >-
      Places the Rich focus at the basal cerebral or ventricular ependymal
      surface upstream of the basal meningeal exudate.
- name: Rich Focus Rupture Into CSF
  description: >-
    Rupture of the caseating Rich focus releases bacilli and mycobacterial
    antigens into cerebrospinal fluid and the basal subarachnoid space.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  evidence:
  - reference: PMID:7610242
    reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms and the changes described herein typically begin with a
      dense basal meningeal exudate often resulting from a "Rich focus" along
      the basal surface of the cerebrum or ventricular ependyma.
    directness: INDIRECT
    explanation: >-
      Places a Rich focus upstream of the basal meningeal exudate. The abstract
      does not itself state that the focus ruptures into the subarachnoid
      space; that step is inferred from the focus-to-exudate sequence.
  downstream:
  - target: Basal Granulomatous Meningeal Exudate
    causal_link_type: DIRECT
    description: >-
      Bacilli and antigens in CSF elicit dense granulomatous inflammation around
      the basal cisterns.
- name: Basal Granulomatous Meningeal Exudate
  description: >-
    Mycobacterial antigens drive an epithelioid-macrophage-rich basal meningeal
    exudate around cranial nerves, basal cisterns, and cerebral vessels.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0002150
      label: epithelioid macrophage
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  evidence:
  - reference: PMID:7610242
    reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This exudate is made up of small and large mononuclear cells, including
      epithelioid cells, which also act as macrophages and may fuse to form
      Langhans' giant cells.
    explanation: >-
      Defines the cellular composition of the basal granulomatous exudate in
      tuberculous meningitis.
  downstream:
  - target: Tuberculous Cerebral Arteritis
    causal_link_type: DIRECT
    description: >-
      Basal exudate entraps and inflames adjacent cerebral arteries.
  - target: Obstructive Tuberculous Hydrocephalus
    causal_link_type: DIRECT
    description: >-
      Dense exudate blocks basal subarachnoid cisterns and obstructs CSF flow.
  - target: CSF MMP-9 Elevation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Neutrophilic meningeal inflammation is accompanied by raised MMP-9 in
      cerebrospinal fluid.
  - target: CSF pleocytosis
    causal_link_type: DIRECT
    description: >-
      The leukocytic meningeal inflammatory infiltrate is sampled as a
      lymphocyte-predominant CSF pleocytosis.
    evidence:
    - reference: PMID:28281443
      reference_title: Central Nervous System Tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        The CSF formula typically shows a lymphocytic pleocytosis, and low glucose
        and high protein concentrations.
      explanation: >-
        Reports the lymphocytic CSF pleocytosis that reflects the mononuclear
        meningeal exudate described in PMID:7610242.
  - target: Cranial nerve paralysis
    causal_link_type: DIRECT
    description: >-
      Basal exudate encases cranial nerve trunks crossing the basal cisterns,
      producing cranial nerve palsies, most often of the abducens nerve.
    evidence:
    - reference: PMID:32118118
      reference_title: "The current global situation for tuberculous meningitis: epidemiology, diagnostics, treatment and outcomes."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Third, exudates encase cranial nerves, resulting in cranial nerve
        palsies.
      explanation: >-
        States that the basal exudate encasing cranial nerves is the cause of
        cranial nerve palsies in tuberculous meningitis.
  - target: Nuchal rigidity
    causal_link_type: DIRECT
    description: >-
      Inflammation of the meninges produces meningeal irritation, seen
      clinically as neck stiffness.
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Meningeal inflammation produces the headache of the meningitic prodrome.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The granulomatous inflammatory response is accompanied by systemic fever.
- name: Tuberculous Cerebral Arteritis
  description: >-
    Basal exudate entraps large arteries and perforators, producing arteritis
    and arterial occlusion.
  biological_scale: TISSUE
  locations:
  - preferred_term: middle cerebral artery
    term:
      id: UBERON:0001627
      label: middle cerebral artery
  evidence:
  - reference: PMID:7610242
    reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Entrapment and occasional arteritic occlusion of larger arteries, such as
      the middle cerebral in the Sylvian fissures, results in infarction.
    explanation: >-
      Links tuberculous basal exudate to arteritic occlusion of large arteries
      such as the middle cerebral artery.
  downstream:
  - target: Ischemic Cerebral Infarction
    causal_link_type: DIRECT
    description: >-
      Arteritic occlusion causes ischemic infarction in the supplied territory.
    evidence:
    - reference: PMID:28281443
      reference_title: Central Nervous System Tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Vasculitis leading to infarcts in the basal ganglia occurs commonly and
        is a major determinant of morbidity and mortality.
      explanation: >-
        States that vasculitis leads to basal ganglia infarcts in CNS
        tuberculosis.
- name: Ischemic Cerebral Infarction
  description: >-
    Ischemic infarction downstream of tuberculous arteritis, most commonly in
    the basal ganglia, is a major determinant of morbidity and mortality.
  biological_scale: TISSUE
  locations:
  - preferred_term: collection of basal ganglia
    term:
      id: UBERON:0010011
      label: collection of basal ganglia
  evidence:
  - reference: PMID:28281443
    reference_title: Central Nervous System Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Vasculitis leading to infarcts in the basal ganglia occurs commonly and
      is a major determinant of morbidity and mortality.
    explanation: >-
      Places tuberculous infarcts in the basal ganglia and links them to
      morbidity.
  downstream:
  - target: Hemiparesis
    causal_link_type: DIRECT
    description: >-
      Infarction of the basal ganglia and internal capsule produces focal
      motor weakness, most often hemiparesis.
    evidence:
    - reference: PMID:36048445
      reference_title: "Global Frequency and Clinical Features of Stroke in Patients With Tuberculous Meningitis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Moreover, patients with TBM experiencing stroke were more likely to
        present with focal weakness, which was found in 62% of patients in our
        analysis.
      explanation: >-
        Pooled analysis finds focal weakness in 62% of patients with
        tuberculous-meningitis stroke. Focal weakness is broader than
        hemiparesis, so the link to this phenotype is an inference.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Late seizures in tuberculous meningitis are associated with cerebral
      infarction, as well as with tuberculoma and hyponatremia.
    evidence:
    - reference: PMID:30396007
      reference_title: Seizures in tuberculous meningitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Early seizures were associated with meningeal irritation and late
        seizures with tuberculoma, infarction and hyponatremia (P = 0.01).
      explanation: >-
        Reports an association between infarction and late seizures in a TBM
        cohort; the causal direction is inferred from the association.
  - target: Cognitive impairment
    causal_link_type: DIRECT
    description: >-
      Ischemic brain injury contributes to the neurodisability seen in
      survivors, including cognitive impairment.
    evidence:
    - reference: PMID:32118118
      reference_title: "The current global situation for tuberculous meningitis: epidemiology, diagnostics, treatment and outcomes."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        Ischaemia, hydrocephalus and raised intracranial pressure frequently
        result, leading to extensive brain injury and neurodisability.
      explanation: >-
        States that ischemia leads to brain injury and neurodisability in TBM.
        Neurodisability is broader than cognitive impairment, so the link to
        this phenotype is an inference.
- name: Obstructive Tuberculous Hydrocephalus
  description: >-
    Basal exudate or tuberculoma-associated narrowing of the aqueduct and third
    ventricle blocks CSF pathways and causes hydrocephalus.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  evidence:
  - reference: PMID:7610242
    reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blockage of the basal subarachnoid cisterns around the midbrain and pons
      by the dense basal exudate or narrowing of aqueduct and third ventricle by
      a small tuberculoma causes consequent hydrocephalus.
    explanation: >-
      Connects basal exudate and ventricular obstruction to hydrocephalus.
  downstream:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: >-
      Obstructed CSF pathways produce clinically and radiologically apparent
      hydrocephalus.
    evidence:
    - reference: PMID:7610242
      reference_title: Pathology and pathogenetic mechanisms in neurotuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Blockage of the basal subarachnoid cisterns around the midbrain and pons
        by the dense basal exudate or narrowing of aqueduct and third ventricle by
        a small tuberculoma causes consequent hydrocephalus.
      explanation: >-
        States that cisternal or aqueductal obstruction causes hydrocephalus.
  - target: Coma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Progressive hydrocephalus raises intracranial pressure, and patients
      deteriorate in consciousness until CSF is diverted.
    evidence:
    - reference: PMID:35102984
      reference_title: Hydrocephalus in Tuberculous Meningitis - Pearls and Nuances.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        Progressive hydrocephalus, clinically manifests with a potentially
        life-threatening high intracranial pressure. Patients with deteriorating
        vision loss and deteriorating consciousness, often need a surgical CSF
        diversion procedure
      explanation: >-
        Links progressive hydrocephalus to raised intracranial pressure and
        deteriorating consciousness. Coma is the endpoint of that decline, so
        the link to this phenotype is an inference.
  - target: Cognitive impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hydrocephalus and raised intracranial pressure contribute to brain
      injury and lasting neurodisability, including cognitive impairment.
    evidence:
    - reference: PMID:32118118
      reference_title: "The current global situation for tuberculous meningitis: epidemiology, diagnostics, treatment and outcomes."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        Ischaemia, hydrocephalus and raised intracranial pressure frequently
        result, leading to extensive brain injury and neurodisability.
      explanation: >-
        States that hydrocephalus and raised intracranial pressure lead to
        brain injury and neurodisability. Neurodisability is broader than
        cognitive impairment, so the link to this phenotype is an inference.
- name: CSF MMP-9 Elevation
  description: >-
    Matrix metalloproteinase-9 rises in cerebrospinal fluid early in
    tuberculous meningitis and tracks the CSF neutrophil count.
  biological_scale: MOLECULAR
  cell_types:

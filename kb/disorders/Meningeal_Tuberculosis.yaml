  downstream:
  - target: Blood-Brain Barrier Disruption
    causal_link_type: DIRECT
    description: >-
      MMP-9 degrades extracellular matrix around the blood-brain barrier. The
      causal step is shown in a mouse CNS-TB model, not in patients.
    evidence:
    - reference: PMID:39536643
      reference_title: "Modulating sonic hedgehog (SHH) pathway to create a rapid CNS-TB model: Facilitating drug discovery."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further analysis revealed that CYC upregulated Matrix
        Metalloproteinase-9 (MMP-9) secretion, a key contributor to BBB
        disruption.
      explanation: >-
        Links raised MMP-9 secretion to blood-brain barrier disruption in a
        mouse CNS-TB model.
  evidence:
  - reference: PMID:19789647
    reference_title: Dexamethasone, cerebrospinal fluid matrix metalloproteinase concentrations and clinical outcomes in tuberculous meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strong correlation between CSF MMP-9 and neutrophil count suggests
      that polymorphonuclear leukocytes may play a central role in the early
      pathogenesis of TBM.
    explanation: >-
      Links neutrophilic inflammation to CSF MMP-9 during early tuberculous
      meningitis pathogenesis.
- name: Blood-Brain Barrier Disruption
  description: >-
    Loss of blood-brain barrier integrity during CNS tuberculosis, accompanied

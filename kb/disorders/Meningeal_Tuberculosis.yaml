    term:
      id: UBERON:0000120
      label: blood brain barrier
  evidence:
  - reference: PMID:39536643
    reference_title: "Modulating sonic hedgehog (SHH) pathway to create a rapid CNS-TB model: Facilitating drug discovery."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

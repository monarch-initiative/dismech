      (59.6%), vomiting 19 (36.5%) and focal weakness 10 (19.2%).
    explanation: >-
      Neck stiffness was present in 85% of 52 confirmed tuberculous
      meningitis cases.
- name: Vomiting
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: PMID:23757980
    reference_title: "Clinical course, complications and predictors of mortality in patients with tuberculous meningitis--an experience of fifty two cases at Civil Hospital Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The presenting complaints were fever 51 (98.1%), neck-stiffness 44
      (84.61%), and altered level of consciousness 40 (76.9%), headache 31
      (59.6%), vomiting 19 (36.5%) and focal weakness 10 (19.2%).
    explanation: >-
      Vomiting was a presenting complaint in 37% of 52 confirmed cases.
  - reference: PMID:34100953
    reference_title: Tuberculous meningitis in the elderly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      however, headache (38.2% vs. 67.1%, P = 0.001), vomiting (18.2% vs.
      35.6%, P = 0.030) and fever (80.0% vs. 91.8%, P = 0.052) were less
      common.
    explanation: >-
      Vomiting was present in 36% of young adults and 18% of older adults
      with tuberculous meningitis in a prospective cohort.
- name: Cranial nerve paralysis
  phenotype_term:
    preferred_term: Cranial nerve palsy
    term:
      id: HP:0006824
      label: Cranial nerve paralysis
  description: >-
    Around a quarter to a third of patients have a cranial nerve palsy. The
    abducens nerve is the most often affected.
  evidence:
  - reference: PMID:41799630
    reference_title: "Incidence of cranial and ophthalmic nerve palsy and associated risk factors in tuberculous meningitis: A systematic review and meta-regression analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled prevalence of CNP in TBM patients was 26.5 % (95 % CI:
      22.4-31.1 %), while ONP prevalence was 23.9 % (95 % CI: 18.7-30.0 %).
    explanation: >-
      Meta-analysis of 47 studies gives a pooled cranial nerve palsy
      prevalence of 26.5% in tuberculous meningitis.
  - reference: PMID:21570650
    reference_title: "Incidence, predictors and prognostic value of cranial nerve involvement in patients with tuberculous meningitis: a retrospective evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Abducent nerve was the most frequently (32.3%) affected cranial nerve.
    explanation: >-
      Identifies the abducens nerve as the cranial nerve most often involved
      in a cohort of 158 adults, 38% of whom had cranial neuropathy.
- name: Seizure
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:30396007
    reference_title: Seizures in tuberculous meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seizures occurred in 34% patients with TBM and were associated with poor
      outcome at six months.
    explanation: >-
      Seizures occurred in about a third of a prospective adult cohort.
- name: Hemiparesis
  phenotype_term:
    preferred_term: Hemiparesis
    term:
      id: HP:0001269
      label: Hemiparesis
  evidence:
  - reference: PMID:15206503
    reference_title: Tuberculous meningitis in adults--experience from Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hemiparesis (35.7%), cranial nerve palsy (30.9%), and altered
      consciousness (26.9%) were the most common neurological deficits.
    explanation: >-
      Hemiparesis was the most common neurological deficit in a 42-patient
      adult cohort.
- name: Hyponatremia
  phenotype_term:
    preferred_term: Hyponatremia
    term:
      id: HP:0002902
      label: Hyponatremia
  evidence:
  - reference: PMID:34752323
    reference_title: "Hyponatremia in tuberculous meningitis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The prevalence rate of hyponatremia among TBM patients was 52% and the
      rate of death among those patients was 29%.
    explanation: >-
      Meta-analysis of 42 studies gives a pooled hyponatremia prevalence of
      52% in tuberculous meningitis.
progression:
- phase: MRC grade I
  notes: >-
    Modified British Medical Research Council grade I: Glasgow Coma Scale
    score 15 with no focal neurological signs. The MRC grade at presentation is
    the standard staging of tuberculous meningitis severity.
  evidence:
  - reference: PMID:29029055
    reference_title: Prognostic Models for 9-Month Mortality in Tuberculous Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      grade I (GCS score 15; no focal neurological signs), grade II (GCS score
      11–14 or 15 with focal neurological signs), or grade III (GCS score ≤10)
    explanation: >-
      Defines the three modified MRC grades of tuberculous meningitis.
- phase: MRC grade II
  notes: >-
    Glasgow Coma Scale score 11-14, or 15 with focal neurological signs such as
    cranial nerve palsy.
  evidence:
  - reference: PMID:29029055
    reference_title: Prognostic Models for 9-Month Mortality in Tuberculous Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      grade I (GCS score 15; no focal neurological signs), grade II (GCS score
      11–14 or 15 with focal neurological signs), or grade III (GCS score ≤10)
    explanation: >-
      Defines MRC grade II.
- phase: MRC grade III
  notes: >-
    Glasgow Coma Scale score 10 or below. Mortality rises with grade; in a
    Peruvian inpatient cohort, grade III carried about three times the risk of
    in-hospital death.
  evidence:
  - reference: PMID:29029055
    reference_title: Prognostic Models for 9-Month Mortality in Tuberculous Meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      grade I (GCS score 15; no focal neurological signs), grade II (GCS score
      11–14 or 15 with focal neurological signs), or grade III (GCS score ≤10)
    explanation: >-
      Defines MRC grade III.
  - reference: PMID:30611205
    reference_title: Mortality in hospitalized patients with tuberculous meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      significant associations with in-hospital mortality were seen among
      patients with HIV (RR 2.06; Confidence Interval 95% (95% CI) 1.44-2.94),
      BMRC II (RR 1.78; 95% CI 1.07-2.97), BMRC III (RR 3.11; 95% CI
      1.78-5.45) and positive CSF cultures (RR 1.95; 95% CI 1.39-2.74).
    explanation: >-
      Higher BMRC grade at admission predicts in-hospital death.
diagnosis:
- name: Composite CSF and Neuroimaging Diagnosis
  description: >-
    TBM diagnosis combines CSF acid-fast smear or culture, nucleic-acid
    amplification such as Xpert Ultra, CSF inflammatory chemistry, and
    CT/MRI evidence of basal meningeal enhancement, hydrocephalus, infarction,
    or tuberculoma, because a negative molecular or culture result does not
    exclude disease.
  evidence:
  - reference: PMID:31924549
    reference_title: "Xpert MTB/RIF Ultra for the diagnosis of HIV-associated tuberculous meningitis: a prospective validation study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Xpert Ultra detected tuberculous meningitis with higher sensitivity than
      Xpert and MGIT culture in this HIV-positive population.
    explanation: >-
      Supports Xpert Ultra as a more sensitive CSF molecular assay than the
      earlier Xpert and MGIT culture comparators in suspected TBM.
  - reference: PMID:28281443
    reference_title: Central Nervous System Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a patient with compatible clinical features, the combination of
      meningeal enhancement and any degree of hydrocephalus is strongly
      suggestive of TBM.
    explanation: >-
      Supports the diagnostic use of basal meningeal enhancement and
      hydrocephalus on neuroimaging.
treatments:
- name: Initial Four-Drug Antituberculous Therapy
  description: >-
    Initial TBM therapy uses isoniazid, rifampicin, pyrazinamide, and ethambutol
    to kill M. tuberculosis in the CSF and cover possible resistance while
    susceptibility testing is pending.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazide
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Basal Granulomatous Meningeal Exudate
    treatment_effect: INHIBITS
    description: >-
      Bactericidal antituberculous therapy kills susceptible bacilli in the
      subarachnoid space, removing the antigenic drive of the basal exudate.
  evidence:
  - reference: PMID:28281443
    reference_title: Central Nervous System Tuberculosis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The initial 4 drug regimen (isoniazid, rifampin, pyrazinamide, ethambutol)
      covers the possibility of infection with a resistant strain, maximizes
      antimicrobial impact, and reduces the likelihood of emerging resistance on
      therapy.
    explanation: >-
      Supports initial four-drug tuberculosis therapy for CNS tuberculosis.
- name: Adjunctive Dexamethasone
  description: >-
    Dexamethasone is recommended as adjunctive host-directed therapy and lowers
    early CSF MMP-9, but its survival benefit is modest and heterogeneous. A
    phase 3 trial in HIV-negative adults stratified by LTA4H genotype found no
    benefit over placebo in CC and CT genotypes and no better outcome in TT
    genotype, so genotype-guided steroid use is not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: CSF MMP-9 Elevation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroid treatment lowers early CSF MMP-9 concentrations and dampens
      the inflammatory barrier injury branch.
  evidence:
  - reference: PMID:19789647
    reference_title: Dexamethasone, cerebrospinal fluid matrix metalloproteinase concentrations and clinical outcomes in tuberculous meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dexamethasone significantly reduced CSF MMP-9 concentrations in early
      follow up samples (median 5 days (range 3-8) of treatment), but had no
      significant influence on other MMPs/TIMPs.
    explanation: >-
      Mechanistically links dexamethasone to lower early MMP-9 in CSF during
      tuberculous meningitis treatment.
  - reference: PMID:41540106
    reference_title: "Genotype-stratified adjunctive dexamethasone for tuberculous meningitis in HIV-negative adults: a randomized controlled phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Leukotriene A4 hydrolase (LTA4H) genotypes associate with distinct
      intracerebral inflammatory phenotypes and may determine corticosteroid
      response in tuberculous meningitis, with benefit observed in
      hyperinflammatory TT genotype but uncertain benefit in lower inflammation
      CC and CT genotypes.
    explanation: >-
      The trial's framing of the LTA4H hypothesis it set out to test, based on
      earlier work. It is the rationale for the trial, not its result; the
      result is recorded under effect_modifiers.
  effect_modifiers:
  - effect_modifier_type: GENOTYPE
    stratum: LTA4H TT genotype (open-label dexamethasone)
    comparator_stratum: LTA4H CC or CT genotype
    modified_outcome: all-cause death or new neurological event over 12 months
    effect_in_stratum: NO_DIFFERENCE
    modification_analysis: CROSS_STRATUM_COMPARISON
    description: >-
      HIV-negative Vietnamese adults. TT-genotype participants were not
      randomized and all received dexamethasone, so this compares outcomes
      across genotype strata within one trial rather than a randomized
      treatment-by-genotype interaction. Among randomized CC and CT
      participants, dexamethasone and placebo outcomes did not differ, and no
      prespecified subgroup showed benefit or heterogeneity (NCT03100786).
    evidence:
    - reference: PMID:41540106
      reference_title: "Genotype-stratified adjunctive dexamethasone for tuberculous meningitis in HIV-negative adults: a randomized controlled phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Outcomes were not significantly better in TT-genotype participants
        versus CC- or CT-genotype participants.
      explanation: >-
        Reports no outcome advantage for the hyperinflammatory TT genotype
        under dexamethasone.
    - reference: PMID:41540106
      reference_title: "Genotype-stratified adjunctive dexamethasone for tuberculous meningitis in HIV-negative adults: a randomized controlled phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Benefit or heterogeneity of effect was not observed by any prespecified
        subgroup.
      explanation: >-
        Reports no treatment-effect heterogeneity across the trial's
        prespecified subgroups.
- name: BCG Vaccination
  description: >-
    Bacillus Calmette-Guerin vaccination in infants and young children reduces
    progression to disseminated meningeal or miliary tuberculosis.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: BCG vaccine
      term:
        id: NCIT:C298
        label: BCG Vaccine
  target_mechanisms:
  - target: Hematogenous CNS Tuberculous Seeding
    treatment_effect: INHIBITS
    description: >-
      BCG-induced antituberculous immunity reduces progression to meningeal and
      miliary dissemination in early life.
  evidence:
  - reference: PMID:24336911
    reference_title: "Protection by BCG vaccine against tuberculosis: a systematic review of randomized controlled trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Protection against meningeal and miliary tuberculosis was also high in
      infants (RR, 0.1; 95% CI, .01-.77) and children stringently tuberculin
      tested (RR, 0.08; 95% CI, .03-.25).
    explanation: >-
      Quantifies strong BCG protection against meningeal and miliary
      tuberculosis in infants and tuberculin-tested children.
animal_models:
- name: Zebrafish Mycobacterium marinum LTA4H inflammation model
  species: Zebrafish
  description: >-
    The zebrafish M. marinum model links LTA4H-controlled eicosanoid balance to
    both inadequate and excessive mycobacterial inflammation. It motivated the
    LTA4H genotype hypothesis for steroid response in human TBM, which a later
    genotype-stratified phase 3 trial (PMID:41540106) did not confirm. It is a
    systemic mycobacterial infection model, not a CNS model.
  evidence:
  - reference: PMID:22304914
    reference_title: Host genotype-specific therapies can optimize the inflammatory response to mycobacterial infections.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish, we find that susceptibility to Mycobacterium marinum can
      result from either inadequate or excessive acute inflammation.
    explanation: >-
      Supports use of the zebrafish-M. marinum model for the inverted-U host
      inflammation branch relevant to TBM.
- name: Mouse sonic-hedgehog CNS tuberculosis model
  species: Mouse
  description: >-
    Sonic-hedgehog-pathway modulation in BALB/c mice with M. tuberculosis CNS
    infection models MMP-9-associated blood-brain-barrier injury and rapid brain
    bacillary expansion.
  modeled_mechanisms:
  - target: Blood-Brain Barrier Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Infected mice develop blood-brain barrier breakdown with MMP-9 secretion
      when SHH signalling is pharmacologically blocked.
    limitations: >-
      Barrier breakdown is produced under cyclopamine antagonism of SHH, an
      artificial accelerant with no counterpart in human TBM, in mice rather
      than humans; the basal exudate, arteritis and hydrocephalus are not
      reported.
    evidence:
    - reference: PMID:39536643
      reference_title: "Modulating sonic hedgehog (SHH) pathway to create a rapid CNS-TB model: Facilitating drug discovery."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Immunohistochemistry demonstrated that CYC caused severe BBB breakdown
        and reactive gliosis, while PUR partially attenuated this response.
      explanation: >-
        Documents barrier breakdown in the infected-mouse model.
  evidence:
  - reference: PMID:39536643
    reference_title: "Modulating sonic hedgehog (SHH) pathway to create a rapid CNS-TB model: Facilitating drug discovery."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further analysis revealed that CYC upregulated Matrix
      Metalloproteinase-9 (MMP-9) secretion, a key contributor to BBB
      disruption.
    explanation: >-
      Links SHH antagonism to MMP-9-associated BBB disruption in a mouse CNS-TB
      model.

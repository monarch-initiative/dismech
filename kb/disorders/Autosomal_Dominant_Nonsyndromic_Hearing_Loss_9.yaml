name: Autosomal Dominant Nonsyndromic Hearing Loss 9
creation_date: "2026-09-28T20:00:00Z"
category: Mendelian
synonyms:
- DFNA9
- deafness, autosomal dominant 9
- autosomal dominant deafness 9
- autosomal dominant nonsyndromic deafness 9
- COCH-related autosomal dominant nonsyndromic hearing loss
- COCH autosomal dominant nonsyndromic deafness
description: >-
  DFNA9 is an autosomal dominant, usually adult-onset progressive sensorineural hearing loss with variable vestibular
  dysfunction caused by heterozygous COCH variants. Most are missense or in-frame variants, but a terminal frameshift
  associated with abnormal cochlin multimer formation has also been reported. Childhood and occasionally prelingual
  presentations occur in some families. Cochlin is a secreted extracellular matrix protein with an LCCL domain and
  two von Willebrand factor A domains. Variant-dependent abnormalities include altered folding, oligomerization
  with recruitment of wild-type cochlin, intracellular retention, defective proteolytic processing, abnormal matrix
  deposition and cytotoxicity. These findings come largely from recombinant proteins and cultured cells; no single
  mechanism has been demonstrated for every allele. Human temporal bones show cochlin-containing deposits, fibrocyte
  loss and cochlear or vestibular neural degeneration. Biallelic loss-of-function variants cause the distinct recessive
  disorder DFNB110. Hearing aids and cochlear implantation provide auditory rehabilitation. Vestibular implants
  are investigational, and allele-specific antisense knockdown of p.Pro51Ser has been demonstrated in cultured cells.

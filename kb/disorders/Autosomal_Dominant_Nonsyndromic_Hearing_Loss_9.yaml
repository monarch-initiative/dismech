  - reference: PMID:34369417
    reference_title: "Genotype-Phenotype Correlation Study in a Large Series of Patients Carrying the p.Pro51Ser (p.P51S) Variant in COCH (DFNA9) Part II: A Prospective Cross-Sectional Study of the Vestibular Phenotype in 111 Carriers."
    supports: REFUTE

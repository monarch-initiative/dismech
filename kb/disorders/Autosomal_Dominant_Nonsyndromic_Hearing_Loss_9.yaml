- name: Impaired Cochlin Proteolytic Processing
  description: >-
    Proteolytic processing of cochlin is impaired for selected variants. The C-terminal fragment was almost undetectable
    for Gly403Cys, Gly447Asp and Phe527Cys in transfected-cell media. Other variants, including Phe230Leu, retained
    cleavage. Occlusion of aggrecanase cleavage sites by altered protein conformation is proposed but was not directly
    tested. These experiments do not establish immune dysregulation as a DFNA9 mechanism.
  biological_scale: MOLECULAR
  biological_processes:

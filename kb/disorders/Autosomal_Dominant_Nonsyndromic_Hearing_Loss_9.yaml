- category: Vestibular
  name: Progressive bilateral vestibular hypofunction
  description: >-
    Bilaterally reduced vestibular responses progressing to bilateral vestibulopathy by
    Bárány criteria, predicted at about 53 years (caloric) and 47-57 years (canal-specific
    head impulse gains) in p.Pro51Ser carriers. The degree of vestibular involvement depends
    on the variant: LCCL-domain variants usually cause it, while vWFA-domain variants cause
    predominantly hearing loss. COCH was the most frequent non-idiopathic cause in a series
    of 315 patients with bilateral vestibulopathy.
  phenotype_term:
    preferred_term: Bilateral vestibular hypofunction
    term:
      id: HP:0001756
      label: Vestibular hyporeflexia
    clinical_course: PROGRESSIVE

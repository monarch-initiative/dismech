    explanation: States why this single bone is informative about early rather than end-stage events.
- name: Vestibular End-Organ Dysfunction
  description: >-
    Loss of vestibular end-organ function. In p.Pro51Ser carriers otolith (saccular) responses
    decline first, then caloric responses, then head-impulse VOR gain, ending in bilateral
    vestibulopathy. In G88E knock-in mice vestibular evoked potentials are abnormal months
    before auditory thresholds rise, as earlier p.Pro51Ser studies reported in people.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: equilibrioception
    term:
      id: GO:0050957
      label: equilibrioception
    modifier: DECREASED
  locations:
  - preferred_term: crista ampullaris
    term:
      id: UBERON:0004721
      label: crista ampullaris
  downstream:
  - target: Progressive bilateral vestibular hypofunction
    causal_link_type: DIRECT
    description: The end-organ failure is measured clinically as bilaterally reduced vestibular responses.
    evidence:
    - reference: PMID:34369417
      reference_title: "Genotype-Phenotype Correlation Study in a Large Series of Patients Carrying the p.Pro51Ser (p.P51S) Variant in COCH (DFNA9) Part II: A Prospective Cross-Sectional Study of the Vestibular Phenotype in 111 Carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Estimated age of onset showed that the deterioration began with C-VEMP activity (31 years), followed by caloric responses (water irrigation) (35 years) and ended with vHIT VOR-gains (48-57 years)."
      explanation: The order in which end-organ responses fail in 111 p.Pro51Ser carriers.
  - target: Vestibular areflexia
    causal_link_type: DIRECT
    description: Continued decline ends in absent responses.
  - target: Oscillopsia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the vestibulo-ocular reflex removes gaze stabilization during head movement;
      oscillopsia is head-movement dependent in the reported patient.
    evidence:
    - reference: PMID:10891988
      reference_title: Familial progressive vestibulocochlear dysfunction caused by a COCH mutation (DFNA9).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He suffered from instability in the dark, head movement-dependent oscillopsia, paroxysmal positional vertigo, and vertigo with and without nausea."
      explanation: >-
        Single p.Pro51Ser patient; co-occurrence with vestibular areflexia, not a separate
        test of mechanism.
      directness: INDIRECT
  - target: Postural instability in the dark
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Without vestibular input, balance depends on vision and proprioception and fails when
      vision is removed.
    evidence:
    - reference: PMID:10891988
      reference_title: Familial progressive vestibulocochlear dysfunction caused by a COCH mutation (DFNA9).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He suffered from instability in the dark, head movement-dependent oscillopsia, paroxysmal positional vertigo, and vertigo with and without nausea."
      explanation: Single patient; the symptom accompanies documented vestibular areflexia.
      directness: INDIRECT
  - target: Episodic vertigo
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attacks of vertigo arise from the diseased labyrinth, but why some carriers have

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At about 48 to 50 years of age on average, the majority of DFNA9 patients may need conventional hearing aids (PTA ≥ 40 dB HL), whereas this is about 56 to 59 years for cochlear implants (PTA ≥ 70 dB HL)."
    explanation: Predicted timing of amplification and implant candidacy from audiometric thresholds.
- name: Cochlear implantation
  description: >-
    For severe to profound loss. In a retrospective comparison of 56 p.Pro51Ser recipients with matched postlingually
    deafened controls, speech perception and quality of life improved similarly and remained stable to five years;
    better preoperative aided speech perception predicted better outcome, which the authors read as favouring earlier
    implantation. The association with preoperative performance does not prove that earlier implantation causes
    better outcomes.

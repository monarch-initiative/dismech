- name: Intracellular Retention of Mutant Cochlin
  description: >-
    Intracellular retention is observed for a subset of variants. Val104del, Ile109Thr and Phe121Ser were retained
    as dimers; Cys162Tyr and Ala487Pro failed ER-to-Golgi trafficking in transfected cells. For Phe527Cys, large
    covalent complexes were retained while monomeric protein was secreted. Phe230Leu secretion was comparable to
    wild type, so its cytotoxicity is not evidence for retention. The reported association between retained protein
    and earlier clinical onset is a cross-variant correlation, not a prospective predictor.
  biological_scale: CELLULAR

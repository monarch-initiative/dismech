    snippet: In all patients, the electrodes could be implanted in the semicircular canal ampullae.
    explanation: Three selected DFNA9 patients with semicircular-canal obstruction; the full text distinguishes electrode placement from variable evoked responses.
animal_models:
- name: Coch G88E knock-in mouse
  species: Mouse
  genotype: Coch G88E/G88E and Coch G88E/+
  genes:
  - preferred_term: COCH
    term:
      id: hgnc:2180
      label: COCH
  publication: PMID:18697796
  description: >-
    The G88E knock-in develops age-dependent vestibular and auditory dysfunction. Otolith vestibular evoked potentials
    were abnormal at 11 months in the original study and from seven months in follow-up testing, while auditory
    deficits emerged much later. Heterozygous late auditory findings were based on only three mice. Cochlin-containing
    interossicular deposits occur, but the characteristic human inner-ear eosinophilic deposits were not reproduced
    even in aged mice.
  modeled_mechanisms:
  - target: Vestibular End-Organ Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Vestibular dysfunction precedes auditory dysfunction in this model; human sequence varies by cohort and test.
    limitations: >-
      Onset is compressed into the second year of mouse life and was characterized mainly in
      homozygotes, whereas human disease is heterozygous and develops over decades.
    evidence:
    - reference: PMID:21073934
      reference_title: "Hearing and vestibular deficits in the Coch(-/-) null mouse model: comparison to the Coch(G88E/G88E) mouse and to DFNA9 hearing and balance disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that in both mouse models, vestibular function is compromised before cochlear function."
      explanation: Vestibular-before-cochlear sequence in the knock-in (and null) mice.
  - target: Cochlin Aggregate Deposition in the Ear
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Middle ear interossicular deposits form as in humans; tympanic membrane thickening was not
      seen at the age examined.
    limitations: >-
      Middle-ear joint deposits were reproduced, but human-like inner-ear deposits were not found in aged knock-in
      mice; tympanic-membrane thickening was not consistently reproduced.
    evidence:
    - reference: PMID:25049087
      reference_title: Cochlin in normal middle ear and abnormal middle ear deposits in DFNA9 and Coch (G88E/G88E) mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings reveal accumulation of acellular deposits in the incudomalleal and incudostapedial joints in Coch (G88E/G88E) mice, similar to those found in human DFNA9-affected temporal bones."
      explanation: Reproduces the human middle ear deposits.
  evidence:
  - reference: PMID:18697796
    reference_title: "A targeted Coch missense mutation: a knock-in mouse model for DFNA9 late-onset hearing loss and vestibular dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At 21 months, four of eight Coch(G88E/G88E) mice had absent ABRs at all frequencies tested and two of three Coch(G88E)(/+) mice had absent ABRs at three of four frequencies tested."
    explanation: Late-onset hearing loss in homozygous and heterozygous knock-in mice.
- name: Acute intracochlear mutant-cochlin conditioned-medium exposure
  species: Mouse
  description: >-
    Concentrated mutant-cochlin conditioned medium was delivered into the cochlea of young C57BL/6 mice. Auditory
    thresholds rose and strial or spiral-ligament fibrocyte injury was observed, with relative sparing of the spiral
    limbus. The acute exposure and high local concentration differ from heterozygous endogenous expression over
    decades.
  publication: PMID:20228067
  modeled_mechanisms:
  - target: Mutant Cochlin Cytotoxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Acute local exposure reproduces cochlear toxicity.
    limitations: Conditioned medium contains a nonphysiological exposure; this is not a knock-in model or a demonstrated patient disease time course.
    evidence:
    - &id001
      reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2865277/
      reference_title: Role of Protein Misfolding in DFNA9 Hearing Loss - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: appears to exhibit some selective cytotoxicity toward the stria vascularis and fibrocytes in the spiral ligament.
      explanation: Acute intracochlear mutant conditioned-medium exposure caused spiral-ligament fibrocyte damage in mice. Spiral-limbus fibrocytes were largely spared; extension to the broader human lesion is incomplete.
      directness: INDIRECT
  evidence:
  - *id001
notes: >-
  Night blindness and memory loss in one p.Phe121Ser family have uncertain attribution to COCH and are not established
  DFNA9 phenotypes. Corneal striae were associated with carrier status in some families (PMID:17368553), but occurred
  in noncarriers and were largely absent in other examined cohorts (PMID:35204720). Canal obstruction, contrast
  enhancement and endolymphatic hydrops also require distinction: hydrops was absent in one small MRI series but
  present in a later single case, so it is not a universal substrate of DFNA9 vertigo.
histopathology:
- name: Cochlin-positive acellular eosinophilic inner-ear deposits
  description: >-
    Homogeneous acellular deposits in cochlear and vestibular connective tissues stain for cochlin and occur with
    loss of the resident fibrocytes. Eosinophilic or amyloid-like morphology does not by itself establish conventional
    amyloid composition.
  evidence:
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9 is an inner ear disorder with a unique histopathology showing loss of cellularity and aggregation of abundant homogeneous acellular eosinophilic deposits in the cochlear and vestibular labyrinths, similar to protein aggregation in well-known neurodegenerative disorders."
    explanation: Describes the characteristic deposits in a p.Pro51Ser temporal bone.
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high-level expression and stability of cochlin in the inner ear, even in the absence and severe atrophy of the fibrocytes that normally express COCH, are shown through these studies"
    explanation: Records fibrocyte atrophy in a p.Pro51Ser temporal bone together with persistent cochlin.
  notes: No specific ontology binding is assigned for cochlin-positive extracellular deposits; this finding is not equated with conventional amyloid.
- name: Peripheral cochlear and vestibular neuronal degeneration
  description: >-
    The bilateral temporal bones from one p.Leu114Pro carrier with residual hearing showed prominent distal cochlear
    and vestibular dendritic degeneration with reduced spiral and vestibular ganglion cells. This single-patient
    observation is not a universal quantitative estimate.
  evidence:
  - reference: PMID:27023102
    reference_title: Histopathology of the Human Inner Ear in the p.L114P COCH Mutation (DFNA9).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A quantitative cytologic analysis of atrophy in this specimen and immunostaining using anti-neurofilament and anti-myelin protein zero antibodies confirmed that the principal histopathologic correlate of hearing loss was degeneration of the dendritic fibers of spiral ganglion cells in the osseous spiral lamina."
    explanation: Histological correlation in bilateral temporal bones from one patient, not an experimental demonstration of causality.
    directness: INDIRECT
  - reference: PMID:27023102
    reference_title: Histopathology of the Human Inner Ear in the p.L114P COCH Mutation (DFNA9).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Degeneration of distal vestibular dendritic fibers at the base of the neuroepithelium was demonstrated using anti-neurofilament immunostaining
    explanation: Human histological evidence for distal vestibular neuronal degeneration.
  notes: The specific distal dendritic lesion is described directly rather than bound to a nonspecific neurodegenerative-disease term.
experimental_models:

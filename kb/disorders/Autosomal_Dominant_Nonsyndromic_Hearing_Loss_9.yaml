    explanation: Variant-specific Western blot evidence for reduced proteolytic processing; the proposed structural explanation remains indirect.
- name: Mutant Cochlin Cytotoxicity
  description: >-
    Selected mutant cochlins reduce viability or induce cell death in experimental systems. Secreted Phe230Leu conditioned
    medium reduced NIH3T3 viability despite normal secretion and cleavage. In a separate study, mutant murine cochlin
    induced death and caspase-3 activation in UB/UE1 inner-ear cells, and mutant conditioned medium reduced primary
    cochlear fibrocyte viability. Effects depended on the cell system: HeLa and 293T cells did not show the same
    death response. An acute intracochlear exposure model caused spiral-ligament fibrocyte loss and transiently
    elevated auditory thresholds; it does not reproduce lifelong endogenous expression.
  biological_scale: CELLULAR

- category: Imaging
  name: Semicircular canal sclerosis and narrowing
  description: >-
    Focal sclerosis or narrowing of one or more semicircular canals on CT and loss of fluid
    signal on T2-weighted MRI, most often in the posterior canal and in advanced disease.
    Figures come from p.Pro51Ser cohorts: 8 of 9 patients in the first report, 91% of ears on
    CT in a 45-patient series, and MRI canal signal loss in 97.7% of 45 cochlear implant
    recipients. Only about two thirds of MRI lesions are visible on CT, which the authors read
    as fibrosis without calcification.
  phenotype_term:
    preferred_term: Semicircular canal sclerosis and narrowing
    term:
      id: HP:0011380
      label: Abnormal semicircular canal morphology

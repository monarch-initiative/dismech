    snippet: "The phoneme scores significantly improved from 35% (IQR 11-50) pre-implantation to 84% (IQR 76-90) one year post-implantation."
    explanation: 45 DFNA9 recipients (49 ears).
- name: Allele-specific antisense oligonucleotide knockdown of p.Pro51Ser COCH
  description: >-
    Experimental RNase H1 gapmer antisense oligonucleotides reduced mutant COCH transcripts in inducible Flp-In
    T-REx293 minigene cell lines. At 25 nM the lead mutation-targeting AON reduced mutant transcript by 60% without
    a significant wild-type reduction; specificity decreased at higher doses. Intronic haplotype markers were alternative
    allele-selective targets, not pathogenic regulatory variants. No hearing rescue was measured. Inner-ear delivery,
    durability and safety remain unresolved; preserved hearing in heterozygous null animals does not guarantee preserved
    vestibular function after knockdown.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: COCH
      term:
        id: hgnc:2180
        label: COCH
    target_transcript: mutant COCH mRNA carrying c.151C>T (p.Pro51Ser)
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Heterozygous COCH Variant
    description: >-
      Allele-selective transcript degradation aims to reduce production of mutant cochlin. This is a preclinical
      intervention on the initiating genetic mechanism, not a demonstrated human treatment.
  evidence:
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The most potent AON, directed against the c.151C>T mutation, was able to induce a 60% decrease in mutant COCH transcripts without affecting wild-type COCH transcript levels."
    explanation: Minigene-expressing cells only.
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Allele specificity decreased when increasing concentrations of AON were delivered to the cells."
    explanation: Dose-dependent loss of selectivity, a limitation of the approach.
  - reference: PMID:38218018
    reference_title: "Rational design of a genomically humanized mouse model for dominantly inherited hearing loss, DFNA9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We established a genomically humanized mouse model for the Dutch/Belgian c.151C>T founder mutation in COCH."
    explanation: >-
      A genomically humanized p.Pro51Ser model intended for sequence-specific therapy testing; the cited study describes
      model construction and normal hearing through nine months, not treatment efficacy.
    directness: INDIRECT
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At 25 nM, the levels of mutant COCH transcripts were decreased to 40% of the levels of mutant COCH in control cells, without reducing the number of wild-type COCH transcripts.
    explanation: Matched-expression experiment establishing the concentration-specific selectivity result.

  - reference: PMID:38234975
    reference_title: "Practical tips by peer support in chronic vestibular hypofunction: an exploratory survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They described the importance of ensuring minimal light intensity for visibility (i.e., installing light sources in dark places).
    explanation: Environmental adaptation reported by patients with chronic vestibular hypofunction.
- name: Investigational combined vestibular and cochlear implantation
  description: >-
    Combined implantation is being studied for severe peripheral bilateral vestibulopathy with implant-eligible
    hearing loss. In three DFNA9 participants, surgical probing, removal or bypass of canal obstruction enabled
    electrode placement. Two patients had electrically evoked vertical vestibulo-ocular responses and perception;
    one had perception without measurable vestibulo-ocular reflex responses. This supports feasibility in selected patients, not established
    benefit for all DFNA9.
  therapeutic_modality: DEVICE
  treatment_term:

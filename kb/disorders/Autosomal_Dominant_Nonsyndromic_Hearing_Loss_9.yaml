name: Autosomal Dominant Nonsyndromic Hearing Loss 9
creation_date: "2026-09-28T20:00:00Z"
category: Mendelian
synonyms:
- DFNA9
- deafness, autosomal dominant 9
- autosomal dominant deafness 9
- autosomal dominant nonsyndromic deafness 9
- COCH-related autosomal dominant nonsyndromic hearing loss
- COCH autosomal dominant nonsyndromic deafness
description: >-
  DFNA9 is an autosomal dominant, adult-onset, progressive sensorineural hearing loss with
  variable vestibular dysfunction, caused by heterozygous missense or in-frame variants in
  COCH. COCH encodes cochlin, a secreted extracellular matrix protein with an N-terminal
  LCCL domain and two von Willebrand factor A (vWFA) domains; it is the most abundant protein
  detected in the inner ear and is made by the fibrocytes of the spiral ligament and spiral
  limbus and by the stroma beneath the vestibular sensory epithelium.

  Dominant variants misfold the domain they sit in. Depending on the allele, mutant cochlin
  is either retained inside the cell as dimers and aggregates or secreted but fails to
  integrate normally into the extracellular matrix. Affected temporal bones show loss of the
  COCH-expressing fibrocytes and acellular eosinophilic deposits that immunostain for
  cochlin, in the cochlear and vestibular labyrinths and also in the middle ear. The principal
  histological correlate of hearing loss in the one bone examined before profound deafness
  was degeneration of the spiral ganglion dendrites in the osseous spiral lamina. Heterozygous
  Coch-null mice hear normally and a heterozygous human truncating variant did not segregate
  with hearing loss, so the dominant disease is not haploinsufficiency; biallelic
  loss-of-function variants instead cause a separate recessive, prelingual disorder (DFNB110).

  Hearing loss typically begins in the third to fifth decade, is often most marked at high
  frequencies early, and progresses to severe or profound loss. Vestibular function declines
  alongside it, reaching bilateral vestibulopathy with oscillopsia and instability in the
  dark; earlier p.Pro51Ser studies found vestibular decline starting first, while a larger
  2021 series found hearing decline starting first in female carriers. Menière-like attacks
  of vertigo, tinnitus and aural fullness occur in a substantial minority. The p.Pro51Ser
  founder allele is a frequent cause in the Dutch/Belgian population, and COCH was the
  commonest non-idiopathic cause in a three-centre bilateral vestibulopathy series.
  Management is amplification followed by cochlear implantation, which gives outcomes
  comparable to other postlingual implant recipients; allele-specific antisense knockdown of
  the p.Pro51Ser transcript has been demonstrated only in cultured cells.

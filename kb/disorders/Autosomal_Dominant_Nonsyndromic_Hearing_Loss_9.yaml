      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A quantitative cytologic analysis of atrophy in this specimen and immunostaining using anti-neurofilament and anti-myelin protein zero antibodies confirmed that the principal histopathologic correlate of hearing loss was degeneration of the dendritic fibers of spiral ganglion cells in the osseous spiral lamina."

- name: Balance rehabilitation and environmental adaptations
  description: >-
    Supportive care addresses mobility, visual compensation and fall hazards. A mixed vestibular-hypofunction survey,
    including 56 respondents reporting DFNA9 among 122 who specified an etiology, described assistive devices, improved
    lighting and activity adaptations. These patient-reported strategies and physiotherapy context support individualized
    rehabilitation planning, not a demonstrated DFNA9-specific treatment effect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation

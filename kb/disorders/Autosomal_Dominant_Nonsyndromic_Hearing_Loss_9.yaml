phenotypes:
- category: Auditory
  name: Adult-onset progressive sensorineural hearing loss
  description: >-
    Bilateral sensorineural hearing loss beginning in adulthood and progressing over decades,
    often asymmetrically in an individual. In 111 p.Pro51Ser carriers hearing decline began at
    about 38 years in women and 46 in men on regression against age-referenced norms; the
    authors attribute the sex difference mainly to stricter male reference limits. Onset is
    allele dependent (second or third decade for p.Phe121Ser). Variants outside the LCCL
    domain were associated with more severe hearing loss earlier in life in a combined East
    Asian and European audioprofile analysis, whereas a meta-analysis found LCCL variants to
    progress more.
  phenotype_term:
    preferred_term: Adult onset progressive sensorineural hearing impairment
    term:
      id: HP:0008615
      label: Adult onset sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9 is an autosomal dominant, nonsyndromic, progressive sensorineural hearing loss with vestibular pathology."
    explanation: Defining clinical feature.
  - reference: PMID:34369416
    reference_title: "Genotype-phenotype Correlation Study in a Large Series of Patients Carrying the p.Pro51Ser (p.P51S) Variant in COCH (DFNA9): Part I-A Cross-sectional Study of Hearing Function in 111 Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing dysfunction in p.P51S carriers begins at about 38 years of age (ranging from 28 to 43 years) on average in female and 46 years (ranging from 42 to 49 years) in male carriers"
    explanation: Onset ages from 111 Belgian and Dutch p.Pro51Ser carriers.
  - reference: PMID:11843927
    reference_title: "Hereditary cochleovestibular dysfunction due to a COCH gene mutation (DFNA9): a follow-up study of a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pure-tone thresholds deteriorated by about 2-7 dB per year (mean 3.8 dB per year) in a variable, often asymmetrical, fashion."
    explanation: Rate of progression in a longitudinally followed Dutch family (14 genotyped).
  - reference: PMID:21046548
    reference_title: A novel mutation in COCH-implications for genotype-phenotype correlations in DFNA9 hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of the hearing loss, in the 2nd or 3rd decade of life, is earlier than in most DFNA9 families."
    explanation: An earlier-onset LCCL allele (p.Phe121Ser) in an American family.
  - reference: PMID:34529116
    reference_title: "COCH-related autosomal dominant nonsyndromic hearing loss: a phenotype-genotype study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deafness-associated variants in non-LCCL domains of cochlin were associated with hearing loss that was more severe earlier in life than hearing loss caused by variants in the LCCL domain"
    explanation: Domain-dependent severity across 8 Korean, 9 East Asian and 38 European-descent families.
  - reference: PMID:35204720
    reference_title: "Genotype-Phenotype Correlations of Pathogenic COCH Variants in DFNA9: A HuGE Systematic Review and Audiometric Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants affecting the LCCL domain of cochlin generally lead to more progression of hearing loss when compared to variants affecting the other domains."
    explanation: >-
      Meta-analysis of 27 variants; reports faster progression for LCCL variants, a different
      measure from the earlier-severity finding above rather than a contradiction of it.
    quote_role: REVIEW_SYNTHESIS
- category: Auditory
  name: High-frequency predominant hearing loss
  description: >-
    Early hearing loss is typically most marked at high frequencies before spreading to all

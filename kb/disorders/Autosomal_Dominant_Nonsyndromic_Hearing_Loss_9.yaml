- name: Cochlin Domain Misfolding
  description: >-
    Selected DFNA9 substitutions destabilize an isolated LCCL or vWFA2 domain. In the recombinant LCCL study, human
    p.Pro51Ser, p.Val66Gly and p.Gly88Glu equivalents misfolded, but the p.Trp117Arg equivalent folded normally.
    The isolated construct numbers residues 26 positions earlier than full-length cochlin. Domain misfolding is
    therefore an allele-dependent observation, not a demonstrated common property of every dominant variant.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:

differential_diagnoses:
- name: Menière disease
  description: >-
    Episodic vertigo, tinnitus and aural fullness in DFNA9 can satisfy Menière criteria, but
    DFNA9 is familial and progresses to bilateral vestibular loss, and no COCH exon 4 or 5
    variants were found in 30 patients with sporadic definite Menière disease.
  distinguishing_features:
  - Autosomal dominant family history and a heterozygous COCH variant.
  - Progression to bilateral vestibular hypofunction or areflexia.
  - Semicircular canal sclerosis or signal loss on imaging in advanced DFNA9.
  evidence:
  - reference: PMID:14704763
    reference_title: Absence of COCH mutations in patients with Meniere disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with definite MD have a low prevalence of mutations in exons 4 and 5 of the COCH gene."
    explanation: Thirty patients with definite sporadic Menière disease; only exons 4 and 5 sequenced.
- name: Autosomal recessive nonsyndromic hearing loss 110 (DFNB110)
  description: >-
    Biallelic inactivating COCH variants usually cause prelingual DFNB110; vestibular involvement is variable. Some
    coding variants alter splicing. Heterozygous loss-of-function carriers may hear normally, whereas dominant DFNA9
    often involves an abnormal protein product. Early onset can occur in either disorder, and a terminal frameshift
    associated with DFNA9 should not be equated with simple loss of function.
  distinguishing_features:
  - Biallelic loss-of-function or splice-altering COCH variants versus a heterozygous disease-associated abnormal-protein allele.
  - Usually congenital or prelingual onset in DFNB110, but age of onset alone is insufficient.
  evidence:
  - reference: PMID:29449721
    reference_title: Bi-allelic inactivating variants in the COCH gene cause autosomal recessive prelingual hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two brothers with congenital prelingual deafness and a homozygous nonsense c.292C>T(p.Arg98*) COCH variant, suggesting a loss-of-function effect."
    explanation: First recessive COCH family.
  - reference: PMID:32562050
    reference_title: Novel loss-of-function mutations in COCH cause autosomal recessive nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms the involvement of loss-of-function mutations in COCH in autosomal recessive nonsyndromic hearing loss, expands the mutational landscape of DFNB110 to include coding variants that alter RNA splicing, and highlights the need to investigate the effect of coding variants on RNA splicing."
    explanation: Independent confirmation in a multi-ethnic cohort.
genetic:
- name: COCH
  association: Causal
  gene_term:
    preferred_term: COCH
    term:
      id: hgnc:2180
      label: COCH
  notes: >-
    COCH (14q12-q13) encodes cochlin: signal peptide, LCCL domain, two short intervening domains and two vWFA domains.
    Most dominant variants are LCCL-domain missense changes; p.Pro51Ser (c.151C>T) is a Dutch/Belgian founder allele.
    vWFA-domain variants include p.Phe527Cys (Korean family) and p.Ile541Phe (single case with external canal aggregates).
    Biallelic loss-of-function variants cause the separate recessive DFNB110. A terminal frameshift can encode an
    abnormal multimerizing product; variant class alone cannot distinguish dominant from recessive disease. No validated
    clinical modifier or universal domain-based prognostic rule is established.
  evidence:
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three missense mutations in human COCH (previously described as Coch5b2), a novel cochlear gene, in three unrelated kindreds with DFNA9."
    explanation: Gene discovery.
  - reference: PMID:9931344
    reference_title: A Pro51Ser mutation in the COCH gene is associated with late onset autosomal dominant progressive sensorineural hearing loss with vestibular defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis revealed a 208C-->T mutation in the COCH gene, resulting in a Pro51Ser substitution in the predicted protein in all affected individuals of the family but not in unaffected family members and 200 control individuals."
    explanation: Segregation and control absence for the p.Pro51Ser allele.
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The c.151C>T founder mutation in COCH is a frequent cause of late-onset, dominantly inherited hearing impairment and vestibular dysfunction (DFNA9) in the Dutch/Belgian population."
    explanation: >-
      Founder status of p.Pro51Ser; background sentence in an in vitro therapy paper. The
      cDNA numbering (c.151C>T) and the older 208C>T refer to the same variant.

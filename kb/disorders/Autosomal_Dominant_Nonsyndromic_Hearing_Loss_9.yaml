    label: autosomal dominant nonsyndromic hearing loss 9
parents:
- autosomal dominant nonsyndromic hearing loss
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous COCH missense and in-frame variants segregate with progressive hearing loss
    and vestibular dysfunction in multigenerational pedigrees. Penetrance is age dependent and
    the onset age varies with the allele. A homozygous carrier in a Belgian family had earlier
    onset than most heterozygous relatives. Biallelic truncating COCH variants cause
    a distinct recessive prelingual disorder (DFNB110), not DFNA9.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9 is an autosomal dominant, nonsyndromic, progressive sensorineural hearing loss with vestibular pathology."
    explanation: The gene-discovery paper's statement of the inheritance mode of the DFNA9 kindreds.
  - reference: PMID:10400989
    reference_title: "High prevalence of symptoms of Menière's disease in three families with a mutation in the COCH gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the patients, who had an earlier age of onset in comparison with most of the affected family members, was shown to be homozygous for the mutation."
    explanation: >-
      A single homozygous carrier with earlier onset than heterozygous relatives; this is one
      individual and does not establish a general dosage effect.
pathophysiology:
- name: Heterozygous COCH Missense or In-Frame Variant
  description: >-
    The initiating lesion is a heterozygous germline missense or in-frame variant in COCH,
    clustered in the LCCL domain (for example p.Pro51Ser, p.Gly88Glu, p.Phe121Ser) and less
    often in the vWFA domains (for example p.Phe527Cys, p.Ile541Phe). Mouse and human
    evidence argue against haploinsufficiency: heterozygous Coch-null mice have normal
    hearing while heterozygous G88E knock-in mice do not, and a heterozygous human frameshift
    allele (p.Cys50Leufs*8) was carried by a parent with normal hearing. Whether dominant alleles act
    by interfering with wild-type cochlin or by a toxic property of the mutant protein is not
    resolved, and may differ between alleles, so `functional_impact_category` is left unset.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: COCH
    term:
      id: hgnc:2180
      label: COCH
  molecular_functions:
  - preferred_term: collagen binding (cochlin vWFA2 domain)
    term:
      id: GO:0005518
      label: collagen binding
  downstream:
  - target: Cochlin Domain Misfolding
    causal_link_type: DIRECT
    description: >-
      LCCL-domain substitutions disrupt the domain fold; a vWFA2 substitution destabilizes
      that domain.
    evidence:
    - reference: PMID:11574466
      reference_title: NMR structure of the LCCL domain and implications for DFNA9 deafness disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Except for the Trp91Arg mutant, expression of these four LCCL mutants resulted in misfolded proteins."
      explanation: >-
        Recombinant LCCL domains carrying DFNA9 substitutions misfold; one of the four
        (Trp91Arg) folds normally, so misfolding is not universal across alleles.
    - reference: PMID:22610276
      reference_title: A novel COCH mutation associated with autosomal dominant nonsyndromic hearing loss disrupts the structural stability of the vWFA2 domain.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the mutation increases propensity of the protein to form covalent disulfide-bonded dimers and affects the structural stability but not the collagen-affinity of the vWFA2 domain"
      explanation: The vWFA2 counterpart of the LCCL result, for p.Phe527Cys.
  evidence:
  - reference: PMID:21052762
    reference_title: Extralabyrinthine manifestations of DFNA9.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "the second von Willebrand domain within cochlin has been shown to interact with extracellular matrix proteins, collagen in particular"
    explanation: >-
      Grounds the molecular-function binding: cochlin's vWFA2 domain binds collagen. The
      sentence restates earlier binding work (the cited paper is a temporal-bone study), and
      no modifier is set because whether DFNA9 alleles reduce this binding is not established.
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three missense mutations in human COCH (previously described as Coch5b2), a novel cochlear gene, in three unrelated kindreds with DFNA9."
    explanation: Identifies heterozygous COCH missense variants as the cause of DFNA9.
  - reference: PMID:21073934
    reference_title: "Hearing and vestibular deficits in the Coch(-/-) null mouse model: comparison to the Coch(G88E/G88E) mouse and to DFNA9 hearing and balance disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly Coch(-/+) mice do not show hearing deficits, in contrast to Coch(G88E/+), which demonstrate elevated ABR thresholds similar to homozyotes."
    explanation: >-
      Heterozygous loss of one Coch allele is tolerated while one missense allele is not,
      which is the mouse evidence against a dosage mechanism.
  - reference: PMID:16078052
    reference_title: Targeted disruption of mouse Coch provides functional evidence that DFNA9 hearing loss is not a COCH haploinsufficiency disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data provide functional evidence that DFNA9 is probably not caused by COCH haploinsufficiency, but via a dominant negative or gain-of-function effect, in nonsensory regions of the inner ear."
    explanation: >-
      The authors' conclusion from normal ABRs in Coch-null mice; it leaves the choice
      between dominant-negative and gain-of-function open.
    directness: INDIRECT
  - reference: PMID:26631968
    reference_title: A novel frameshift variant of COCH supports the hypothesis that haploinsufficiency is not a cause of autosomal dominant nonsyndromic deafness 9.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His mother also carried the mutation but had normal hearing."
    explanation: >-
      A heterozygous human truncating variant without hearing loss in the carrier parent; a
      single family, so it is supportive rather than decisive.
- name: Cochlin Domain Misfolding
  description: >-
    DFNA9 substitutions disrupt the fold of the LCCL domain, which is a disulfide-containing
    module sensitive even to changes at solvent-exposed residues, or destabilize a vWFA
    domain and promote disulfide-bonded dimers. The consequence for trafficking differs by
    allele (next nodes).
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  downstream:
  - target: Intracellular Retention and Aggregation of Mutant Cochlin
    causal_link_type: DIRECT
    description: >-
      For a subset of alleles (two vWFA and three LCCL mutants in the cited survey) misfolded
      cochlin is not secreted and accumulates as dimers or high-molecular-weight aggregates.
    evidence:
    - reference: PMID:25230692
      reference_title: "Identification of pathogenic mechanisms of COCH mutations, abolished cochlin secretion, and intracellular aggregate formation: genotype-phenotype correlations in DFNA9 deafness and vestibular disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our studies revealed that five mutants were not secreted into the media: two von Willebrand factor A (vWFA) domain mutants, which were not transported from the endoplasmic reticulum to Golgi complex and formed high-molecular-weight aggregates in cell lysates, and three LCCL domain mutants, which were detected as intracellular dimeric cochlins."
      explanation: Transfected-cell evidence that misfolded mutants of both domains can be retained.
  - target: Defective Cochlin Incorporation into the Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Other alleles are secreted normally, but the secreted mutant protein is deposited
      abnormally or not at all into the extracellular matrix of cultured cells.
    evidence:
    - reference: PMID:12928864
      reference_title: Mutations in COCH that result in non-syndromic autosomal dominant deafness (DFNA9) affect matrix deposition of cochlin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "wild-type cochlin accumulates in extracellular deposits that closely parallel the matrix component fibronectin, whereas mutant cochlins vary in the amount and pattern of extracellular material"
      explanation: The five LCCL mutants tested were secreted but differed from wild type in matrix deposition.
  evidence:
  - reference: PMID:11574466
    reference_title: NMR structure of the LCCL domain and implications for DFNA9 deafness disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The unexpected sensitivity of the fold with respect to mutations of solvent-accessible residues might be attributed to interference with the folding pathway of this disulfide-containing domain."
    explanation: >-
      Structural explanation for why surface substitutions in the LCCL domain still misfold
      it; stated by the authors as a possibility.
    directness: INDIRECT
  - reference: PMID:9931344
    reference_title: A Pro51Ser mutation in the COCH gene is associated with late onset autosomal dominant progressive sensorineural hearing loss with vestibular defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant serine at position 51 is situated between cysteines and possibly interferes with proper COCH protein folding or its interaction with extracellular matrix proteins."
    explanation: An early proposal, before structural data, for the founder allele; hedged by its authors.
    directness: INDIRECT
- name: Intracellular Retention and Aggregation of Mutant Cochlin
  description: >-
    Retained mutants stay in the endoplasmic reticulum or ER/Golgi, form covalent dimers and
    larger aggregates, and in one vWFA1 allele (p.Phe230Leu) were cytotoxic in culture. This
    mechanism is allele dependent: several LCCL mutants tested in earlier studies were secreted
    in normal amounts and processed normally. Retention correlates with earlier onset of hearing
    loss in the genotype-phenotype survey that established it.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  downstream:
  - target: Cochlin Aggregate Deposition in the Ear
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How intracellular aggregates relate to the extracellular deposits seen in temporal bones
      has not been shown; the authors propose that cochlin trafficking defects underlie the
      characteristic pathology.
    evidence:
    - reference: PMID:33421658
      reference_title: "On the pathophysiology of DFNA9: Effect of pathogenic variants in the COCH gene on inner ear functioning in human and transgenic mice."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "It is believed that COCH mutations affect the intracellular trafficking of cochlin which could explain the characteristic pathology seen in temporal bones of DFNA9 patients."
      explanation: A review's hypothesis linking the trafficking defect to the temporal bone deposits.
      directness: INDIRECT
  - target: Loss of Spiral Ligament and Spiral Limbus Fibrocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A cytotoxic effect of one retained allele in culture suggests a route to death of the
      cochlin-producing cells; whether this operates in vivo is not established.
    evidence:
    - reference: PMID:34529116
      reference_title: "COCH-related autosomal dominant nonsyndromic hearing loss: a phenotype-genotype study."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "a cytotoxic effect was observed for the p.Phe230Leu variant, which is located in the vWFA1 domain"
      explanation: Cytotoxicity of one vWFA1 allele in transfected cells; not shown for LCCL alleles or in tissue.
      directness: INDIRECT
  evidence:
  - reference: PMID:22610276
    reference_title: A novel COCH mutation associated with autosomal dominant nonsyndromic hearing loss disrupts the structural stability of the vWFA2 domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Results of immunocytochemistry analysis demonstrated localization of the cochlin mutant in the endoplasmic reticulum/Golgi complex, whereas western blot analyses of cell lysates revealed that the mutant cochlin tends to form covalent complexes that are retained in the cell."
    explanation: Retention and covalent complex formation for the vWFA2 allele p.Phe527Cys.
  - reference: PMID:25230692
    reference_title: "Identification of pathogenic mechanisms of COCH mutations, abolished cochlin secretion, and intracellular aggregate formation: genotype-phenotype correlations in DFNA9 deafness and vestibular disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutant cochlins that were not secreted and accumulated in cells result in earlier age of onset of hearing defects."
    explanation: >-
      The clinical side of the genotype-phenotype correlation, drawn from published patient
      data for all 21 then-known alleles against the cell findings.
  - reference: PMID:12843317
    reference_title: "Subcellular localisation, secretion, and post-translational processing of normal cochlin, and of mutants causing the sensorineural deafness and vestibular disorder, DFNA9."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We detected that mutated cochlins are not retained intracellularly, and are able to be secreted adequately by the cells, through the Golgi/ER secretory pathway, and also undergo proteolytic cleavage and glycosylation."
    explanation: >-
      For the three LCCL alleles tested here, intracellular retention does not occur; this
      limits the node to a subset of alleles rather than refuting it for those shown to be
      retained.
- name: Defective Cochlin Incorporation into the Extracellular Matrix
  description: >-
    Secreted mutant cochlins differ from wild type in how much, and in what pattern, they are
    deposited into cell-derived extracellular matrix; some are deposited almost normally and
    some not at all. The authors propose impaired self-assembly or impaired complex formation
    with other matrix components.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  downstream:
  - target: Cochlin Aggregate Deposition in the Ear
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than shown: secreted mutant cochlin may aggregate in vivo over a long
      time course, consistent with late onset.
    evidence:
    - reference: PMID:12843317
      reference_title: "Subcellular localisation, secretion, and post-translational processing of normal cochlin, and of mutants causing the sensorineural deafness and vestibular disorder, DFNA9."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It is also possible that the mutations may result in aggregation of cochlin in vivo over a longer time course, as supported by the late onset and progressive nature of this disorder."
      explanation: The authors' hypothesis; the cell experiments themselves showed normal secretion.
      directness: INDIRECT
  evidence:
  - reference: PMID:12928864
    reference_title: Mutations in COCH that result in non-syndromic autosomal dominant deafness (DFNA9) affect matrix deposition of cochlin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that DFNA9 results from gene products that fail to integrate correctly into the extracellular matrix."
    explanation: The authors' conclusion from abnormal matrix deposition of secreted LCCL mutants.
    directness: INDIRECT
- name: Cochlin Aggregate Deposition in the Ear
  description: >-
    The histological hallmark of DFNA9: acellular, homogeneous eosinophilic deposits in the
    spiral ligament, spiral limbus, distal osseous spiral lamina and the stroma beneath the
    vestibular neuroepithelium, which immunostain for cochlin. All examined DFNA9 temporal
    bones also carried deposits in the tympanic membrane and the incudomalleal and
    incudostapedial joints, and one patient with a vWFA2 variant had cochlin aggregates in both
    external auditory canals. The composition of deposits varies with site.
  biological_scale: TISSUE
  locations:
  - preferred_term: spiral ligament
    term:
      id: UBERON:0006725
      label: spiral ligament
  - preferred_term: osseous spiral lamina
    term:
      id: UBERON:0006724
      label: osseus spiral lamina
  - preferred_term: crista ampullaris
    term:
      id: UBERON:0004721
      label: crista ampullaris
  downstream:
  - target: Loss of Spiral Ligament and Spiral Limbus Fibrocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deposits occupy the regions from which the COCH-expressing fibrocytes are lost. The
      temporal bones show the two together; which comes first is not established.
    evidence:
    - reference: PMID:11709536
      reference_title: "Inner ear localization of mRNA and protein products of COCH, mutated in the sensorineural deafness and vestibular disorder, DFNA9."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The fibrocytes expressing mRNA and protein products of COCH are the very cell types which are either absent or markedly reduced and replaced by eosinophilic acellular material in temporal bone sections of individuals affected with DFNA9."
      explanation: Co-localization of deposits and cell loss; it does not show the order of events.
      directness: INDIRECT
  - target: Degeneration of Spiral Ganglion Dendrites in the Osseous Spiral Lamina
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deposits extend into the distal osseous spiral lamina, where the afferent dendrites
      degenerate; a direct mechanical or toxic effect on the dendrites has not been shown.
    evidence:
    - reference: PMID:27023102
      reference_title: Histopathology of the Human Inner Ear in the p.L114P COCH Mutation (DFNA9).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "degeneration of the spiral ligament with deposition of an eosinophilic acellular material, which was also found in the distal osseous spiral lamina, at the base of the spiral limbus, and in mesenchymal tissue at the base of the vestibular neuroepithelium"
      explanation: Places the deposits in the lamina where the dendrites run; single temporal bone.
      directness: INDIRECT
  - target: Vestibular End-Organ Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deposits in the stroma beneath the vestibular neuroepithelium accompany the vestibular
      failure; the intervening steps are not known.
    evidence:
    - reference: PMID:16481359
      reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By immunohistochemistry on the DFNA9 temporal bone sections, we have shown cochlin staining of the characteristic cochlear and vestibular deposits, indicating aggregation of cochlin in the same structures in which it is normally expressed."
      explanation: Establishes that the vestibular as well as cochlear deposits are cochlin aggregates.
      directness: INDIRECT
  - target: Middle ear ossicular joint deposits
    causal_link_type: DIRECT
    description: The same deposition process extends to the incudomalleal and incudostapedial joints.
    evidence:
    - reference: PMID:25049087
      reference_title: Cochlin in normal middle ear and abnormal middle ear deposits in DFNA9 and Coch (G88E/G88E) mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cochlin immunostaining of Coch (G88E/G88E) and DFNA9-affected middle ears showed mutant cochlin localization within areas of aggregates."
      explanation: >-
        Cochlin is present in the middle ear aggregates of affected people (and of knock-in
        mice); the item is graded on the human temporal bone observation.
  - target: Tympanic membrane deposits
    causal_link_type: DIRECT
    description: Deposits are also found in the pars tensa of the tympanic membrane.
    evidence:
    - reference: PMID:21052762
      reference_title: Extralabyrinthine manifestations of DFNA9.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All temporal bones with DFNA9 had abnormal deposits within the tympanic membrane, incudomalleal joint, and incudostapedial joint."
      explanation: Twelve temporal bones from seven affected individuals, compared with age-matched controls.
  - target: External auditory canal stenosis from cochlin aggregates
    causal_link_type: DIRECT
    description: >-
      In one reported patient, cochlin aggregates with amyloid-like foci thickened the
      subcutaneous tissue of both external auditory canals.
    evidence:
    - reference: PMID:31493294
      reference_title: 'First Report of Bilateral External Auditory Canal Cochlin Aggregates ("Cochlinomas") with Multifocal Amyloid-Like Deposits, Associated with Sensorineural Hearing Loss and a Novel Genetic Variant in COCH Encoding Cochlin.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cochlin immunohistochemical staining showed positivity throughout the aggregates."
      explanation: Single case report; the canal narrowing was excised and shown to be cochlin aggregates.
  - target: Semicircular canal sclerosis and narrowing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The radiological canal lesions appear late and are proposed to be the end stage of
      protein deposition or low-grade inflammation; this is a hypothesis.
    evidence:
    - reference: PMID:24662630
      reference_title: "Focal sclerosis of semicircular canals with severe DFNA9 hearing impairment caused by a P51S COCH-mutation: is there a link?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These radiologic abnormalities occurred in more advanced stages of the otovestibular deterioration, supporting the hypothesis that these lesions might represent the end phase of a low-grade chronic inflammation or protein deposition."
      explanation: The authors offer protein deposition as one of two possible explanations.
      directness: INDIRECT
  evidence:
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9 is an inner ear disorder with a unique histopathology showing loss of cellularity and aggregation of abundant homogeneous acellular eosinophilic deposits in the cochlear and vestibular labyrinths, similar to protein aggregation in well-known neurodegenerative disorders."
    explanation: Describes the characteristic deposits in a p.Pro51Ser temporal bone.
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These areas correspond to human inner ear structures which show histopathological findings of acidophilic ground substance in DFNA9 patients."
    explanation: Links the sites of COCH expression to the sites of the deposits.
- name: Loss of Spiral Ligament and Spiral Limbus Fibrocytes
  description: >-
    The fibrocytes of the spiral ligament and spiral limbus, and the stromal cells of the
    crista ampullaris, are where COCH is expressed. In affected temporal bones these cells are
    absent or markedly reduced. Cochlin remains abundant in the tissue even where the fibrocytes
    that made it have atrophied. The functional consequence of fibrocyte loss for cochlear
    homeostasis in DFNA9 has not been measured, so no edge is drawn from this node to the
    hearing phenotype.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: spiral ligament fibrocyte
    term:
      id: CL:0020005
      label: spiral ligament fibrocyte
  locations:
  - preferred_term: spiral ligament
    term:
      id: UBERON:0006725
      label: spiral ligament
  evidence:
  - reference: PMID:11709536
    reference_title: "Inner ear localization of mRNA and protein products of COCH, mutated in the sensorineural deafness and vestibular disorder, DFNA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By in situ hybridization of mouse and human inner ear sections, we find high-level expression of COCH mRNA in the fibrocytes of the spiral limbus and of the spiral ligament in the cochlea, and in the fibrocytes of the connective tissue stroma underlying the sensory epithelium of the crista ampullaris of the semicircular canals."
    explanation: Identifies the COCH-expressing cell populations.
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high-level expression and stability of cochlin in the inner ear, even in the absence and severe atrophy of the fibrocytes that normally express COCH, are shown through these studies"
    explanation: Records fibrocyte atrophy in a p.Pro51Ser temporal bone together with persistent cochlin.
- name: Degeneration of Spiral Ganglion Dendrites in the Osseous Spiral Lamina
  description: >-
    In the only DFNA9 temporal bone studied while residual hearing remained (p.Leu114Pro),
    quantitative analysis showed that the principal correlate of the hearing loss was
    degeneration of the peripheral (dendritic) processes of spiral ganglion neurons in the
    osseous spiral lamina. This is a single specimen, so it indicates rather than establishes
    the neural locus of early hearing loss.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  locations:
  - preferred_term: osseous spiral lamina
    term:
      id: UBERON:0006724
      label: osseus spiral lamina
  downstream:
  - target: Adult-onset progressive sensorineural hearing loss

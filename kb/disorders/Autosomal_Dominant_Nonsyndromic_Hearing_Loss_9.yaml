  experimental_model_type: CELL_LINE
  cell_source: Immortalized 293T producer cells and UB/UE1 inner-ear cells; NIH3T3 recipient cells in the Phe230Leu study.
  description: >-
    Cochlin coexpression assays distinguish mutant/wild-type oligomerization from secretion and cytotoxicity. Producer-cell
    retention and recipient-cell viability are separate endpoints; cell-line susceptibility differs and does not
    directly quantify human fibrocyte injury.

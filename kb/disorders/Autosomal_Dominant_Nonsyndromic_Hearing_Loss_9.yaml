    reference_title: Correlations Between Vestibular Function and Imaging of the Semicircular Canals in DFNA9 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All tested ears had narrowing or signal loss in at least one SCC on T2-weighted MRI."
    explanation: Imaging yield in 45 p.Pro51Ser patients.
  - reference: PMID:31998212
    reference_title: Correlations Between Vestibular Function and Imaging of the Semicircular Canals in DFNA9 Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT abnormalities correlated with hypofunction of caloric responses."
    explanation: Relation of imaging to vestibular function.
- name: COCH sequencing
  description: >-
    Diagnosis is confirmed by a heterozygous pathogenic COCH variant. Clinical suspicion
    arises from combined progressive cochlear and vestibular impairment, or hereditary
    Menière-like disease, from around middle age. Loss-of-function variants need care in
    counselling because biallelic ones cause recessive DFNB110 and a heterozygous frameshift
    has been found in a normally hearing parent.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11843927
    reference_title: "Hereditary cochleovestibular dysfunction due to a COCH gene mutation (DFNA9): a follow-up study of a family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9/COCH should be considered as a possible cause in patients developing combined progressive cochlear and vestibular impairment, or suspected hereditary Ménière-like disease, from around middle age."
    explanation: The clinical presentation that should prompt COCH testing.
  - reference: PMID:32939038
    reference_title: Homozygote loss-of-function variants in the human COCH gene underlie hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This data have a dramatic impact on the accuracy of genetic counseling for both heterozygote and homozygote carriers of LOF variants in COCH."
    explanation: Counselling implication of the recessive loss-of-function mechanism.
    directness: INDIRECT
differential_diagnoses:
- name: Menière disease
  description: >-
    Episodic vertigo, tinnitus and aural fullness in DFNA9 can satisfy Menière criteria, but
    DFNA9 is familial and progresses to bilateral vestibular loss, and no COCH exon 4 or 5
    variants were found in 30 patients with sporadic definite Menière disease.
  distinguishing_features:
  - Autosomal dominant family history and a heterozygous COCH variant.
  - Progression to bilateral vestibular hypofunction or areflexia.
  - Semicircular canal sclerosis or signal loss on imaging in advanced DFNA9.
  evidence:
  - reference: PMID:14704763
    reference_title: Absence of COCH mutations in patients with Meniere disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with definite MD have a low prevalence of mutations in exons 4 and 5 of the COCH gene."
    explanation: Thirty patients with definite sporadic Menière disease; only exons 4 and 5 sequenced.
- name: Autosomal recessive nonsyndromic hearing loss 110 (DFNB110)
  description: >-
    The allelic recessive disorder: biallelic loss-of-function COCH variants cause
    prelingual deafness with early vestibular dysfunction, whereas heterozygous carriers hear
    normally.
  distinguishing_features:
  - Biallelic truncating or splice-altering COCH variants rather than a heterozygous missense variant.
  - Congenital or prelingual rather than adult onset.
  evidence:
  - reference: PMID:29449721
    reference_title: Bi-allelic inactivating variants in the COCH gene cause autosomal recessive prelingual hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two brothers with congenital prelingual deafness and a homozygous nonsense c.292C>T(p.Arg98*) COCH variant, suggesting a loss-of-function effect."
    explanation: First recessive COCH family.
  - reference: PMID:32562050
    reference_title: Novel loss-of-function mutations in COCH cause autosomal recessive nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms the involvement of loss-of-function mutations in COCH in autosomal recessive nonsyndromic hearing loss, expands the mutational landscape of DFNB110 to include coding variants that alter RNA splicing, and highlights the need to investigate the effect of coding variants on RNA splicing."
    explanation: Independent confirmation in a multi-ethnic cohort.
genetic:
- name: COCH
  association: Causal
  gene_term:
    preferred_term: COCH
    term:
      id: hgnc:2180
      label: COCH
  notes: >-
    COCH (14q12-q13) encodes cochlin: signal peptide, LCCL domain, two short intervening
    domains and two vWFA domains. Most dominant variants are LCCL-domain missense changes;
    p.Pro51Ser (c.151C>T) is a Dutch/Belgian founder allele. vWFA-domain variants include
    p.Phe527Cys (Korean family) and p.Ile541Phe (single case with external canal aggregates).
    Biallelic loss-of-function variants cause the separate recessive DFNB110.
  evidence:
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report three missense mutations in human COCH (previously described as Coch5b2), a novel cochlear gene, in three unrelated kindreds with DFNA9."
    explanation: Gene discovery.
  - reference: PMID:9931344
    reference_title: A Pro51Ser mutation in the COCH gene is associated with late onset autosomal dominant progressive sensorineural hearing loss with vestibular defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis revealed a 208C-->T mutation in the COCH gene, resulting in a Pro51Ser substitution in the predicted protein in all affected individuals of the family but not in unaffected family members and 200 control individuals."
    explanation: Segregation and control absence for the p.Pro51Ser allele.
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The c.151C>T founder mutation in COCH is a frequent cause of late-onset, dominantly inherited hearing impairment and vestibular dysfunction (DFNA9) in the Dutch/Belgian population."
    explanation: >-
      Founder status of p.Pro51Ser; background sentence in an in vitro therapy paper. The
      cDNA numbering (c.151C>T) and the older 208C>T refer to the same variant.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence has been measured. Published patients are concentrated in
    Belgian and Dutch p.Pro51Ser families.
  evidence:
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevalence of COCH mutations worldwide is unknown, as there is no systematic screening effort for late-onset hearing disorders"
    explanation: States that no prevalence estimate exists.
treatments:
- name: Hearing aids
  description: >-
    Conventional amplification for mild to moderate loss. In p.Pro51Ser carriers most reach
    the usual hearing-aid threshold (PTA of 40 dB HL or more) at about 48 to 50 years.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_phenotypes:
  - preferred_term: Adult onset sensorineural hearing impairment
    term:
      id: HP:0008615
      label: Adult onset sensorineural hearing impairment
  evidence:
  - reference: PMID:34369416
    reference_title: "Genotype-phenotype Correlation Study in a Large Series of Patients Carrying the p.Pro51Ser (p.P51S) Variant in COCH (DFNA9): Part I-A Cross-sectional Study of Hearing Function in 111 Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At about 48 to 50 years of age on average, the majority of DFNA9 patients may need conventional hearing aids (PTA ≥ 40 dB HL), whereas this is about 56 to 59 years for cochlear implants (PTA ≥ 70 dB HL)."
    explanation: Predicted timing of amplification and implant candidacy from audiometric thresholds.
- name: Cochlear implantation
  description: >-
    For severe to profound loss. In a retrospective comparison of 56 p.Pro51Ser recipients
    with matched postlingually deafened controls, speech perception and quality of life
    improved similarly and remained stable to five years; better preoperative aided speech
    perception predicted better outcome, which the authors read as favouring earlier
    implantation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:42259506
    reference_title: Performance Results and Timing of Cochlear Implantation in Patients With DFNA9 (p.Pro51Ser).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CI provides durable, noninferior outcomes in DFNA9 patients compared with controls."
    explanation: Retrospective cohort, 56 DFNA9 recipients versus matched controls.
  - reference: PMID:39271588
    reference_title: "Evaluating cochlear implant outcomes in DFNA9 subjects: a comprehensive study on cerebral white matter lesions and vestibular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phoneme scores significantly improved from 35% (IQR 11-50) pre-implantation to 84% (IQR 76-90) one year post-implantation."
    explanation: 45 DFNA9 recipients (49 ears).
- name: Allele-specific antisense oligonucleotide knockdown of p.Pro51Ser COCH
  description: >-
    Experimental. RNase H gapmer antisense oligonucleotides against the c.151C>T variant or
    allele-specific intronic variants degraded mutant COCH minigene transcripts in cultured
    cells; the best reduced mutant transcript by 60% without lowering wild-type transcript,
    but allele specificity fell at higher concentrations. The rationale rests on the
    non-haploinsufficiency mechanism. The cited work is in cultured cells only; a genomically
    humanized c.151C>T mouse was built for testing sequence-specific therapies in vivo.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: COCH
      term:
        id: hgnc:2180
        label: COCH
    target_transcript: mutant COCH mRNA carrying c.151C>T (p.Pro51Ser)
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Heterozygous COCH Missense or In-Frame Variant
    description: >-
      Removing the mutant transcript prevents synthesis of the misfolding protein while
      sparing the wild-type allele, which the dosage evidence indicates is sufficient.
  evidence:
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The most potent AON, directed against the c.151C>T mutation, was able to induce a 60% decrease in mutant COCH transcripts without affecting wild-type COCH transcript levels."
    explanation: Minigene-expressing cells only.
  - reference: PMID:33815940
    reference_title: "AON-based degradation of c.151C>T mutant COCH transcripts associated with dominantly inherited hearing impairment DFNA9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Allele specificity decreased when increasing concentrations of AON were delivered to the cells."
    explanation: Dose-dependent loss of selectivity, a limitation of the approach.
  - reference: PMID:38218018
    reference_title: "Rational design of a genomically humanized mouse model for dominantly inherited hearing loss, DFNA9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, our approach proved beneficial in eliminating potential adverse events of genomic humanization of mouse genes, and provides us with a model in which sequence-specific therapies directed against the human mutant COCH alle can be investigated."
    explanation: >-
      A model for testing such therapies in vivo; at 9 months the humanized mice had normal
      hearing, so no efficacy data exist yet.
    directness: INDIRECT
animal_models:
- name: Coch G88E knock-in mouse
  species: Mouse
  genotype: Coch G88E/G88E and Coch G88E/+
  genes:
  - preferred_term: COCH
    term:
      id: hgnc:2180
      label: COCH
  publication: PMID:18697796
  description: >-
    Knock-in of the human DFNA9 p.Gly88Glu allele. Vestibular evoked potential thresholds are
    raised at all ages tested while auditory thresholds rise only at 21 months, when four of
    eight homozygotes had absent ABRs at all frequencies tested and two of three heterozygotes
    at three of four frequencies. Acellular cochlin-containing deposits form in the interossicular joints, as in
    human temporal bones.
  modeled_mechanisms:
  - target: Vestibular End-Organ Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Vestibular dysfunction precedes cochlear dysfunction, as in human p.Pro51Ser carriers.
    limitations: >-
      Onset is compressed into the second year of mouse life and was characterized mainly in
      homozygotes, whereas human disease is heterozygous and develops over decades.
    evidence:
    - reference: PMID:21073934
      reference_title: "Hearing and vestibular deficits in the Coch(-/-) null mouse model: comparison to the Coch(G88E/G88E) mouse and to DFNA9 hearing and balance disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that in both mouse models, vestibular function is compromised before cochlear function."
      explanation: Vestibular-before-cochlear sequence in the knock-in (and null) mice.
  - target: Cochlin Aggregate Deposition in the Ear
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Middle ear interossicular deposits form as in humans; tympanic membrane thickening was not
      seen at the age examined.
    limitations: >-
      The cited study examined the middle ear; tympanic membrane changes found in human bones
      were not reproduced at the evaluated age.
    evidence:
    - reference: PMID:25049087
      reference_title: Cochlin in normal middle ear and abnormal middle ear deposits in DFNA9 and Coch (G88E/G88E) mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings reveal accumulation of acellular deposits in the incudomalleal and incudostapedial joints in Coch (G88E/G88E) mice, similar to those found in human DFNA9-affected temporal bones."
      explanation: Reproduces the human middle ear deposits.
  evidence:
  - reference: PMID:18697796
    reference_title: "A targeted Coch missense mutation: a knock-in mouse model for DFNA9 late-onset hearing loss and vestibular dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At 21 months, four of eight Coch(G88E/G88E) mice had absent ABRs at all frequencies tested and two of three Coch(G88E)(/+) mice had absent ABRs at three of four frequencies tested."
    explanation: Late-onset hearing loss in homozygous and heterozygous knock-in mice.
notes: >-
  No GeneReviews chapter names DFNA9 or COCH-related hearing loss; `just check-genereviews
  --online` against the 2026-09-10 Bookshelf index returned NO_CHAPTER for the name and the
  synonyms listed above. Night blindness and memory loss, reported in the American
  p.Phe121Ser family (PMID:21046548) and described there as not previously reported in DFNA9,
  are not curated as phenotypes of the disease.

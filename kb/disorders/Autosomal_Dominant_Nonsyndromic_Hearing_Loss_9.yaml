inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous COCH variants segregate with progressive hearing loss and variable vestibular dysfunction in multigenerational
    pedigrees. Most are missense or in-frame variants; a terminal frameshift with experimental multimer formation
    has also been reported. Penetrance is age dependent and onset varies between and within alleles. A homozygous
    p.Pro51Ser carrier had earlier onset than most heterozygous relatives. Biallelic inactivating variants usually
    cause prelingual recessive DFNB110.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9806553
    reference_title: "Mutations in a novel cochlear gene cause DFNA9, a human nonsyndromic deafness with vestibular dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA9 is an autosomal dominant, nonsyndromic, progressive sensorineural hearing loss with vestibular pathology."
    explanation: The gene-discovery paper's statement of the inheritance mode of the DFNA9 kindreds.
  - reference: PMID:10400989
    reference_title: "High prevalence of symptoms of Menière's disease in three families with a mutation in the COCH gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the patients, who had an earlier age of onset in comparison with most of the affected family members, was shown to be homozygous for the mutation."
    explanation: >-
      A single homozygous carrier with earlier onset than heterozygous relatives; this is one
      individual and does not establish a general dosage effect.
pathophysiology:
- name: Heterozygous COCH Variant
  description: >-
    The initiating lesion is a heterozygous germline COCH variant, usually missense or in-frame. The terminal p.Asp544Valfs*3
    variant also segregated with hearing loss and produced abnormal multimers in cells despite preserved overall
    secretion and cell viability. Dominant DFNA9 is not explained by simple haploinsufficiency: heterozygous null
    mice retained hearing and a human p.Cys50Leufs*8 carrier parent had normal hearing. This auditory dosage evidence
    does not establish the safety of reducing cochlin for all vestibular functions. Dominant interference and toxic
    effects have experimental support for selected variants; a universal functional-impact category is not assigned.

      snippet: While its secretion and cleavage are comparable to wild-type cochlin, p.Phe230Leu is cytotoxic.
      explanation: Mechanistic distinction from retained or poorly cleaved mutants.
  - name: COCH p.Phe527Cys
    gene:
      preferred_term: COCH
      term:
        id: hgnc:2180
        label: COCH
    description: >-
      A vWFA2 variant destabilizing the domain and promoting covalent complexes. Large complexes were retained while
      monomeric protein was secreted. Collagen II binding persisted; another assay found reduced C-terminal cleavage.
    evidence:
    - reference: PMID:22610276
      reference_title: A novel COCH mutation associated with autosomal dominant nonsyndromic hearing loss disrupts the structural stability of the vWFA2 domain.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Results of immunocytochemistry analysis demonstrated localization of the cochlin mutant in the endoplasmic reticulum/Golgi complex, whereas western blot analyses of cell lysates revealed that the mutant cochlin tends to form covalent complexes that are retained in the cell."
      explanation: Phe527Cys covalent complexes were retained in ER/Golgi; full-text secretion assays distinguish retained complexes from normally secreted monomer.
    - reference: PMID:22610276
      reference_title: A novel COCH mutation associated with autosomal dominant nonsyndromic hearing loss disrupts the structural stability of the vWFA2 domain.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the mutant monomeric protein bound to collagen type II immobilized on the surface of the sensor chip
      explanation: Surface plasmon resonance demonstrates collagen II binding by recombinant F527C vWFA2 protein. The mutation does not eliminate binding; heterogeneous binding kinetics do not justify a uniform activity modifier.
    - reference: PMID:34529116
      reference_title: "COCH-related autosomal dominant nonsyndromic hearing loss: a phenotype-genotype study."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Secreted and cleaved cochlin in culture medium differed among variants, with the C-terminal fragment being almost undetectable with p.Gly403Cys, p.Gly447Asp, and p.Phe527Cys (vWFA2 domain), indicating impaired cleavage of these variants by aggrecanase
      explanation: Variant-specific Western blot evidence for reduced proteolytic processing; the proposed structural explanation remains indirect.
  - name: COCH p.Asp544Valfs*3
    gene:
      preferred_term: COCH
      term:
        id: hgnc:2180
        label: COCH
    description: >-
      A terminal frameshift reported in a Chinese family with hearing loss and limited vestibular findings. The
      mutant protein formed multimers in HEK293T cells without significant loss of overall secretion or cell viability.
      Predicted effects on cleavage were not measured; a general loss-of-function mechanism is not established.
    evidence:
    - reference: PMID:38255649
      reference_title: "A Novel COCH p.D544Vfs*3 Variant Associated with DFNA9 Sensorineural Hearing Loss Causes Pathological Multimeric Cochlin Formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The proband presented mild vestibular symptoms and normal functional assessment results in almost every test, while the variant co-segregated with hearing impairment in the pedigree.
      explanation: Family segregation and clinical observations.
    - reference: PMID:38255649
      reference_title: "A Novel COCH p.D544Vfs*3 Variant Associated with DFNA9 Sensorineural Hearing Loss Causes Pathological Multimeric Cochlin Formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Notably, in the overexpressing study, by transient transfecting the HEK 293T cells, we found that the p.D544Vfs*3 variant increased the formation of multimeric cochlin.
      explanation: Cell experiments demonstrate multimer formation; no nonsense-mediated decay mechanism is assumed.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Population prevalence remains uncertain. Published cohorts are enriched for Belgian and Dutch p.Pro51Ser families;
    proportions from hearing-loss referral clinics or vestibular clinics are not population estimates.
  evidence:
  - reference: PMID:16481359
    reference_title: Cochlin immunostaining of inner ear pathologic deposits and proteomic analysis in DFNA9 deafness and vestibular dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevalence of COCH mutations worldwide is unknown, as there is no systematic screening effort for late-onset hearing disorders"
    explanation: States that no prevalence estimate exists.
treatments:
- name: Hearing aids
  description: >-
    Conventional amplification provides auditory rehabilitation. Cross-sectional p.Pro51Ser audiograms predict when
    threshold-based candidacy may arise, but decisions also depend on aided speech performance and individual needs;
    a modeled age is not a treatment rule.
  therapeutic_modality: DEVICE
  treatment_term:

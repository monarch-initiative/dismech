- name: Abnormal Cochlin Dimerization and Oligomerization
  description: >-
    Selected mutant cochlins form stable dimers and subsequently oligomers in transfected cells. Coexpression experiments
    show recruitment of wild-type cochlin into these complexes, providing an experimentally supported route to dominant
    interference. Murine P53S, V68G, G90E and W119R correspond to human P51S, V66G, G88E and W117R. Dimer formation
    varies by allele; Phe230Leu did not form dimers in a separate assay. Biochemical oligomers are not equivalent
    to histologically visible patient deposits.
  biological_scale: MOLECULAR
  biological_processes:

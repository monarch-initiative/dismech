      reference_title: "Cerebellar and hepatic alterations in ACBD5-deficient mice are associated with unexpected, distinct alterations in cellular lipid homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Liver did not exhibit pathologic changes but increased peroxisome
        abundance and drastically reduced peroxisome-ER contacts.
      explanation: Direct measurement of the contact defect in the model.
discussions:
- discussion_id: acbd5_tether_vs_vlcfa_contribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the retinal and white matter disease comes from loss of the
    peroxisome-ER tether (ether lipid supply, peroxisome positioning, calcium),
    and how much from loss of very-long-chain acyl-CoA capture?
  attaches_to:
  - "pathophysiology#Loss of Peroxisome-ER Membrane Contacts"
  - "pathophysiology#Impaired Peroxisomal Very-Long-Chain Fatty Acid Beta-Oxidation"
  - "pathophysiology#Disturbed Ether Lipid Synthesis"
  rationale: >-
    ACBD5 does both jobs, and patient disease cannot separate them. In cultured
    cells the tether is not strictly required for VLCFA oxidation, and plasma
    VLCFA in patients is only mildly raised, while X-linked adrenoleukodystrophy,
    with much higher VLCFA, has a different clinical picture. The tether's
    contribution to plasmalogen supply, which myelin depends on, has not been
    measured in patient neural cells.
  evidence:
  - reference: PMID:37414147
    reference_title: "Differential roles for ACBD4 and ACBD5 in peroxisome-ER interactions and lipid metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overall, our findings suggest that ACBD5 may act as a primary tether and
      VLCFA recruitment factor, whereas ACBD4 may have regulatory functions in
      peroxisomal lipid metabolism at the peroxisome-ER interface.
    explanation: ACBD5 is both a tether and a VLCFA recruitment factor.
  proposed_experiments:
  - experiment_id: acbd5_separation_of_function_ipsc
    name: Separation-of-function ACBD5 alleles in patient iPSC-derived neural cells
    description: >-
      In ACBD5-null patient iPSC-derived oligodendrocytes, neurons and retinal
      organoids, re-express wild-type ACBD5, an FFAT-motif mutant that cannot bind
      VAPB, or an acyl-CoA binding domain mutant. Measure peroxisome-ER contacts
      and organelle signatures by multispectral imaging, plasmalogen and VLCFA
      lipidomics, myelin protein expression and synapse number.
    would_support:
    - "pathophysiology#Disturbed Ether Lipid Synthesis"
    supporting_outcome:
    - >-
      The FFAT mutant fails to restore plasmalogens, myelination or synapses
      while restoring VLCFA oxidation.
    refuting_outcome:
    - >-
      The acyl-CoA binding mutant alone reproduces the neural defects and the
      FFAT mutant rescues them.

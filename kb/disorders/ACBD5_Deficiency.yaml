- name: Very-Long-Chain Fatty Acid Accumulation in Membrane Lipids
  biological_scale: CELLULAR
  description: >-
    Unoxidized very-long-chain fatty acids, including C26:0, ultra-long species
    above C32 and very-long-chain polyunsaturated fatty acids, are built into
    phospholipids. In ACBD5-deficient mice the pattern is tissue-specific:
    ultra-long species rise in cerebellar phosphatidylcholines but not liver, and
    in the retina VLC-PUFA build up in the plexiform (synaptic) layers rather than
    in photoreceptor outer segments.
  evidence:
  - reference: PMID:33244184
    reference_title: "Cerebellar and hepatic alterations in ACBD5-deficient mice are associated with unexpected, distinct alterations in cellular lipid homeostasis."

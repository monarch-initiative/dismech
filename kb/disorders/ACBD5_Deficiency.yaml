treatments:
- name: AAV-mediated ACBD5 gene delivery (preclinical)
  description: >-
    No disease-modifying treatment exists for patients; care is supportive. In
    the Acbd5 Gly357* mouse, adeno-associated virus delivery of Acbd5 improved
    gait, reduced giant axonopathy, and improved myelination and astrocyte
    reactivity. This has not been tested in humans.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CNS Demyelination and Giant Axonopathy
    treatment_effect: INHIBITS
    description: Gene delivery reduced axonopathy and improved myelination in mice.
    evidence:
    - reference: PMID:38066620
      reference_title: "Ataxia with giant axonopathy in Acbd5-deficient mice halted by adeno-associated virus gene therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We also show that an adeno-associated virus-mediated gene delivery
        ameliorated the gait phenotypes and the giant axonopathy, also improving
        myelination and astrocyte reactivity.
      explanation: Preclinical rescue in the mouse model.

    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, VLC-PUFAs in ACBD5-deficient mice consistently accumulated in
      the inner retinal region from the outer (OPL) to inner plexiform layer
      (IPL).
    explanation: VLC-PUFA accumulate in the synaptic layers of the retina.

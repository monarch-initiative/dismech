- name: Impaired Peroxisomal Very-Long-Chain Fatty Acid Beta-Oxidation
  biological_scale: MOLECULAR
  description: >-
    Without ACBD5 to capture very-long-chain acyl-CoAs (such as C26:0-CoA) on the
    cytosolic face of the peroxisome, their transfer into the peroxisome and
    beta-oxidation slow. The defect is moderate, which fits the mildly raised or
    normal plasma VLCFA seen in patients. The tethering function is not strictly
    required for this step in cultured cells, so this branch is modelled
    separately from the contact-site branch.
  biological_processes:
  - preferred_term: very long-chain fatty acid catabolic process
    modifier: DECREASED
    term:
      id: GO:0042760
      label: very long-chain fatty acid catabolic process
  evidence:

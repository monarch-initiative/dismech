- name: ACBD5-deficient mouse
  species: Mouse
  genotype: Acbd5 knockout
  publication: PMID:33244184
  description: >-
    Loss-of-function mouse showing raised VLCFA, progressive cerebellar pathology,
    sharply reduced peroxisome-ER contacts in liver, and retinal degeneration
    with VLC-PUFA accumulation in the plexiform layers.
  modeled_mechanisms:
  - target: Loss of Peroxisome-ER Membrane Contacts
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Contacts are measured directly in liver.
    limitations: Contact loss was quantified in liver, not in brain or retina where disease occurs.
    evidence:

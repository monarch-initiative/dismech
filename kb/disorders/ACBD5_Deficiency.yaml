    reference_title: "ACBD5 deficiency causes a defect in peroxisomal very long-chain fatty acid metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our studies showed that ACBD5 deficiency leads to accumulation of very
      long-chain fatty acids (VLCFAs) due to impaired peroxisomal β-oxidation.
    explanation: Patient material and knockout cells show impaired VLCFA beta-oxidation.
  - reference: PMID:27899449
    reference_title: "Deficiency of a Retinal Dystrophy Protein, Acyl-CoA Binding Domain-containing 5 (ACBD5), Impairs Peroxisomal β-Oxidation of Very-long-chain Fatty Acids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrate that ACBD5 deficiency causes a moderate but significant
      defect in peroxisomal β-oxidation of very-long-chain fatty acids (VLCFAs)
    explanation: Patient fibroblasts and knockout HeLa cells show a moderate oxidation defect.
  - reference: PMID:37414147
    reference_title: "Differential roles for ACBD4 and ACBD5 in peroxisome-ER interactions and lipid metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the tethering function of ACBD5 is not absolutely required for
      efficient peroxisomal β-oxidation of VLCFAs.
    explanation: >-
      Supports treating VLCFA oxidation as a branch distinct from tethering: the

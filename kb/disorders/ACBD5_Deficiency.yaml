pathophysiology:
- name: ACBD5 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants remove ACBD5 from the peroxisomal
    membrane. The protein does two separable things there, so its loss starts two
    branches: loss of very-long-chain acyl-CoA capture, and loss of the
    peroxisome-ER tether.

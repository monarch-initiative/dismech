    evidence_source: MODEL_ORGANISM
    snippet: >-
      In line with the neurological pathology, unusual ultra-long chain fatty
      acids (C > 32) were elevated in phosphocholines from cerebelli but not
      liver indicating an organ-specific imbalance in fatty acid degradation and
      elongation pathways.
    explanation: Ultra-long fatty acids accumulate in cerebellar membrane lipids.
  - reference: PMID:41324649

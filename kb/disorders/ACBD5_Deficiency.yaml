name: ACBD5 Deficiency
creation_date: "2026-10-23T14:30:00Z"
category: Mendelian
synonyms:
- Retinal dystrophy with leukodystrophy
- RDLKD
- Acyl-CoA binding domain containing protein 5 deficiency
description: >-
  Autosomal recessive peroxisomal disorder caused by biallelic loss-of-function
  variants in ACBD5. ACBD5 is a tail-anchored peroxisomal membrane protein with
  two jobs: its cytosolic acyl-CoA binding domain captures very-long-chain
  acyl-CoAs for peroxisomal beta-oxidation, and its FFAT-like motif binds the ER
  proteins VAPA and VAPB to tether peroxisomes to the endoplasmic reticulum.
  ACBD5 was the first peroxisomal tether found to cause human disease. Patients
  present in infancy or childhood with nystagmus, photophobia and cone-rod or
  rod-dominant retinal dystrophy progressing to blindness, followed by
  progressive leukodystrophy with spasticity, cerebellar ataxia and
  psychomotor regression. Plasma very-long-chain fatty acids are only mildly
  raised and can be normal. About fourteen patients have been reported.
parents:
- Peroxisomal disorder
- Inborn error of metabolism
- Leukodystrophy
- Retinal dystrophy
notes: >-
  Two MONDO classes describe this disease. MONDO:0100112 sits under the
  peroxisomal-disorder classes and is the term ClinGen classifies; MONDO:0030026
  (retinal dystrophy with leukodystrophy) is the OMIM:618863 import and has only
  a generic "hereditary disease" parent. ClinGen states that it lumped the
  retinal-dystrophy and ACBD5-deficiency reports into MONDO:0100112, so this entry
  binds that term and maps MONDO:0030026 as an exact match. No GeneReviews chapter
  names the disease (PubMed search of genereviews[book] for ACBD5 and for retinal
  dystrophy with leukodystrophy, 2026-10-23).

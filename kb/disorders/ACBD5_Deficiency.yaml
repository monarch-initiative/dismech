- name: Disturbed Ether Lipid Synthesis
  conforms_to: "membrane_contact_site_dysfunction#Organelle Membrane Lipid Imbalance"
  biological_scale: CELLULAR
  description: >-
    Ether lipid (plasmalogen) synthesis starts in the peroxisome and is finished
    in the ER, so it depends on the two organelles being in contact. Loss of the
    ACBD5 tether lowers plasmalogen synthesis in cultured cells and shifts ether
    lipid intermediates in ACBD5-deficient mouse liver. Patient fibroblasts with
    VLCFA oxidation defects, ACBD5-deficient lines among them, have reduced ether
    phospholipids. Whether this deficit contributes to the leukodystrophy has not
    been tested (see discussions).
  biological_processes:
  - preferred_term: plasmalogen (ether lipid) biosynthesis
    modifier: DYSREGULATED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process

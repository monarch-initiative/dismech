  title: Mesothelioma Genomics Study - WGS tumour/normal pairs
  description: Malignant mesothelioma (MM) is an incurable and aggressive tumour that occurs principally in the pleura as a consequence of inhaling asbestos fibres. There are >15,000 cases per annum worldwide, the incidence is increasing and Australia has one of the world's highest incidence rates. Surgery, chemotherapy and radiotherapy (or their combinations) all feature in the clinical management but do not impact significantly on overall survival. This study uses whole genome sequencing (WGS) with the aim of identifying mesothelioma-related genomic alterations and potentially identifying novel treatment strategies.

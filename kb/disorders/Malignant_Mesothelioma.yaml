    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to these somatic mutations found in sporadic mesotheliomas, germline mutation of BAP1 has been identified in rare patients with malignant mesothelioma as part of the BAP1 tumor predisposition syndrome (OMIM 603089), which in addition to mesothelioma includes increased incidence of uveal melanoma, meningioma, renal cell carcinoma, and other tumors."
    explanation: Confirms both somatic BAP1 inactivation in sporadic mesothelioma and germline autosomal-dominant BAP1 tumor predisposition.
  notes: >-
    Germline BAP1 mutations define the BAP1 tumor predisposition syndrome with
    increased risk of mesothelioma (pleural and peritoneal), uveal melanoma,
    cutaneous melanoma, and renal cell carcinoma. Somatic BAP1 loss occurs
    frequently across sporadic pleural and peritoneal mesotheliomas.

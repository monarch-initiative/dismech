biochemical:
- name: Mesothelin
  biomarker_term:
    preferred_term: Mesothelin
    term:
      id: NCIT:C20887
      label: Mesothelin
  notes: >-
    Serum mesothelin and megakaryocyte potentiating factor (MPF) are elevated
    in mesothelioma and can be used for diagnosis and monitoring. Sensitivity
    is approximately 60% for epithelioid subtype but lower for sarcomatoid.
- name: BAP1 Immunohistochemistry
  notes: >-
    Loss of nuclear BAP1 staining by immunohistochemistry indicates BAP1
    inactivation and supports the diagnosis of mesothelioma over reactive
    mesothelial proliferation.
diagnosis:
- name: Chest Computed Tomography
  description: >-
    Contrast-enhanced chest and abdominal computed tomography evaluates pleural
    or peritoneal thickening, effusion, chest wall or diaphragmatic invasion,
    and nodal involvement for initial diagnosis and staging.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: Diffuse nodular serosal thickening, unilateral pleural effusion, and local intrathoracic or peritoneal invasion.
  evidence:
  - reference: DOI:10.3390/jcm13195837
    reference_title: "Malignant Pleural Mesothelioma: A Comprehensive Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accurate diagnosis and assessment usually require the use of chest computed tomography (CT) scans, magnetic resonance imaging (MRI), and positron emission tomography (PET)."
    explanation: Confirms chest computed tomography as a primary imaging modality in mesothelioma diagnosis and staging.
- name: Diagnostic Videothoracoscopy with Biopsy
  description: >-
    Thoracoscopic visualization of the pleural cavity with deep tissue biopsy
    provides definitive histologic material for subtyping and ancillary
    immunophenotyping.
  diagnosis_term:
    preferred_term: Diagnostic Videothoracoscopy
    term:
      id: NCIT:C64949
      label: Diagnostic Videothoracoscopy
  results: Histologic demonstration of invasive epithelioid, sarcomatoid, or biphasic mesothelial proliferation.
  evidence:
  - reference: PMID:23743993
    reference_title: "[Regional treatment of malignant pleural mesothelioma: results from the tumor centre Regensburg]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the patients 87 (74 %) underwent at least one surgical procedure: diagnostic thoracoscopy with biopsy (n = 37, 43 %)"
    explanation: Documents diagnostic thoracoscopy with biopsy as a standard invasive diagnostic procedure in pleural mesothelioma.
- name: BAP1 and MTAP Immunohistochemistry
  description: >-
    Immunohistochemical staining for nuclear BAP1 and cytoplasmic MTAP on
    biopsy or cytology specimens distinguishes malignant mesothelioma from
    benign reactive mesothelial hyperplasia and histologic mimics.
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  markers: BAP1, MTAP
  results: Loss of nuclear BAP1 staining and/or loss of cytoplasmic MTAP expression (surrogate for 9p21 deletion).
  evidence:
  - reference: PMID:27813512
    reference_title: "Genomic profiling of malignant peritoneal mesothelioma reveals recurrent alterations in epigenetic regulatory genes BAP1, SETD2, and DDX3X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 11 of these cases demonstrated loss of BAP1 nuclear staining by immunohistochemistry, whereas two tumors without BAP1 alteration and all 42 cases of histologic mimics in peritoneum (8 multilocular peritoneal inclusion cyst, 6 well-differentiated papillary mesothelioma of the peritoneum, 16 adenomatoid tumor, and 12 low-grade serous carcinoma of the ovary) demonstrated intact BAP1 nuclear staining."
    explanation: Demonstrates high specificity of loss of nuclear BAP1 immunohistochemical staining for distinguishing malignant mesothelioma from benign and malignant mimics.
  - reference: DOI:10.3390/diagnostics15111323
    reference_title: "Molecular Insights into Pleural Mesothelioma: Unveiling Pathogenic Mechanisms and Therapeutic Opportunities"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasizing the significance of the immunohistochemical markers BAP1 and MTAP, with the latter serving as an almost ideal surrogate for the gold-standard diagnostic approach, FISH p16/CDKN2A deletion."
    explanation: Confirms combined BAP1 and MTAP immunohistochemistry in diagnostic pathology of mesothelioma.

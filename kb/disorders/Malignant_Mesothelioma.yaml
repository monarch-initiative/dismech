        label: pemetrexed
  target_mechanisms:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    treatment_effect: INHIBITS
    description: DNA crosslinking by cisplatin and folate-pathway inhibition by pemetrexed arrest dividing mesothelioma cells
  evidence:
  - reference: PMID:22104079
    reference_title: Diffuse malignant peritoneal mesothelioma--an update on treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most promising non-surgical approach today in the management of peritoneal mesothelioma is the use of the combination chemotherapy regime of an antifolate (pemetrexed and raltitrexed) and a platinum based (cisplatin) agent with a median survival of about 12-14 months."
    explanation: Supports platinum plus pemetrexed combination chemotherapy and its 12-14 month median survival benchmark.
  - reference: DOI:10.3390/cancers15245787
    reference_title: "Current State-of-the-Art Therapy for Malignant Pleural Mesothelioma and Future Options Centered on Immunotherapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of chemotherapy based on platinum and antifolate is the standard treatment, and the addition of bevacizumab adds two months to median survival."
    explanation: Confirms platinum-plus-antifolate chemotherapy as standard systemic therapy in pleural mesothelioma.
- name: Immune Checkpoint Inhibition
  description: >-
    Dual immune checkpoint blockade with nivolumab (anti-PD-1) plus ipilimumab
    (anti-CTLA-4) is approved for first-line unresectable pleural mesothelioma
    based on the CheckMate 743 trial, improving overall survival compared with
    chemotherapy, particularly in non-epithelioid subtypes.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:

    Accumulation of exudative fluid in the pleural space occurs in the vast
    majority of pleural mesothelioma patients at presentation.
  phenotype_term:
    preferred_term: Pleural effusion
    term:
      id: HP:0002202
      label: Pleural effusion
  sequelae:

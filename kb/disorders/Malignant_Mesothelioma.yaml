  evidence:
  - reference: DOI:10.3390/diagnostics15111323
    reference_title: "Molecular Insights into Pleural Mesothelioma: Unveiling Pathogenic Mechanisms and Therapeutic Opportunities"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasizing the significance of the immunohistochemical markers BAP1 and MTAP, with the latter serving as an almost ideal surrogate for the gold-standard diagnostic approach, FISH p16/CDKN2A deletion."
    explanation: Identifies FISH detection of p16/CDKN2A deletion as a gold-standard ancillary diagnostic test in pleural mesothelioma.

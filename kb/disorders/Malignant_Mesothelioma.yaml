        id: CHEBI:231679
        label: ipilimumab
  target_mechanisms:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    treatment_effect: INHIBITS
    description: Dual PD-1 and CTLA-4 blockade restores antitumor T-cell cytotoxicity against mesothelioma cells
  evidence:
  - reference: DOI:10.3390/cancers15245787
    reference_title: "Current State-of-the-Art Therapy for Malignant Pleural Mesothelioma and Future Options Centered on Immunotherapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, in first-line treatment, immunotherapy combining nivolumab with
      ipilimumab has been shown to be superior to chemotherapy in the
      CheckMate-743 study in terms of overall survival (18.1 months), leading to
      its approval by the FDA and EMA.
    explanation: >-
      This review summarizes CheckMate-743 survival benefit and regulatory
      approval for nivolumab plus ipilimumab in first-line malignant pleural
      mesothelioma.
- name: Surgical Resection
  description: >-
    Extended pleurectomy/decortication (EPD), extrapleural pneumonectomy (EPP),
    or cytoreductive surgery with HIPEC (in peritoneal mesothelioma) may be
    considered in carefully selected early-stage patients with epithelioid
    histology within multidisciplinary care, though randomized pleural trials
    (MARS/MARS 2) underscore substantial morbidity and strict selection needs.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    treatment_effect: INHIBITS
    description: Macroscopic cytoreduction removes bulk serosal tumor burden in selected resectable patients
  evidence:
  - reference: DOI:10.3390/cancers17193199
    reference_title: "Perioperative Treatments in Pleural Mesothelioma: State of the Art and Future Directions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retrospective studies indicate that multimodal treatment, incorporating surgical resection with perioperative chemotherapy, can enhance overall survival (OS), especially in favorable prognostic subsets. However, significant randomized trials, notably the MARS and MARS 2 trials, revealed that the addition of aggressive surgical strategies like extrapleural pneumonectomy (EPP) did not confer survival benefits and was accompanied by heightened morbidity."
    explanation: Summarizes both the selective multimodal role of surgical cytoreduction in favorable subsets and the randomized MARS/MARS 2 evidence against indiscriminate radical resection.
- name: Radiation Therapy
  description: >-
    Used for palliation of chest wall pain and compressive symptoms, or as
    adjuvant intensity-modulated radiation therapy (IMRT) within multimodality
    pleural protocols.

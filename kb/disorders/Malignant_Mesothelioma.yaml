    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In pleural mesothelioma, radiotherapy is used as a palliative treatment and as part of a complex radical treatment together with surgery and chemotherapy."
    explanation: Supports both palliative and multimodal adjuvant roles of radiotherapy in pleural mesothelioma.

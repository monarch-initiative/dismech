name: Malignant Mesothelioma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Malignant mesothelioma is an aggressive cancer arising from mesothelial cells
  lining the pleural, peritoneal, or pericardial cavities. It is strongly
  associated with asbestos exposure, with a long latency period of 20-50 years
  between exposure and disease onset. The disease is characterized by diffuse
  growth along serosal surfaces, making complete surgical resection difficult.
  Germline BAP1 mutations define a hereditary cancer syndrome with increased
  susceptibility to mesothelioma, uveal melanoma, and other malignancies.
category: Neoplastic
categories:
- Thoracic Malignancy
- Environmental Cancer
- Occupational Disease
synonyms:
- malignant mesothelial tumor
- malignant neoplasm of mesothelium
- malignant tumor of mesothelium
- mesothelioma, malignant
disease_term:
  preferred_term: malignant mesothelioma
  term:
    id: MONDO:0006292
    label: malignant mesothelioma
classifications:
  icdo_morphology:
    classification_value: Mesothelial Neoplasm
    notes: >-
      Reassigned from ``Carcinoma``. Mesothelioma is its own morphology
      family, not a carcinoma: NCIT:C4456 (Malignant Mesothelioma, ICD-O-3
      9050/3) has parents Malignant Neoplasm and NCIT:C3786 (Mesothelial
      Neoplasm), which sits directly under NCIT's Neoplasm by Morphology axis
      and is the term this enum value is bound to. This was one of the
      misassignments recorded on monarch-initiative/dismech#7548.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
  ilo_agent_category:
  - classification_value: cancer_asbestos
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 3.1.1 "Cancer
      caused by asbestos", under section 3 (occupational cancer). Contrast
      Asbestosis, which takes item 2.1.1 under the target-organ-system section
      from the same exposure — the ILO list routes the malignant and
      non-malignant consequences of asbestos through different sections.
      Roughly 80% of mesothelioma cases are occupationally attributable, but the
      assignment records that an occupational form is recognised, not that every
      case is occupational.
  eu_occupational_category:
  - classification_value: mesothelioma_inhalation_asbestos_dust
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC as amended), Annex I item 301.22 "Mesothelioma following the
      inhalation of asbestos dust", a sub-item of 301 (diseases of the
      respiratory system and cancers). Peritoneal mesothelioma is covered by the
      same item, which names the exposure rather than the serosal site.
parents:
- mesothelial neoplasm
prevalence:
- population: Regensburg regional cancer registry, Germany
  measure_type: ANNUAL_INCIDENCE
  rate_per_100000: 0.8
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Annual incidence of malignant pleural mesothelioma was 0.8 per 100,000
    inhabitants in regional German tumor-registry surveillance, with marked
    geographic variation tracking historical occupational asbestos exposure.
  evidence:
  - reference: PMID:23743993
    reference_title: "[Regional treatment of malignant pleural mesothelioma: results from the tumor centre Regensburg]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of MPM at the tumor centre Regensburg was 0.8/100,000 inhabitants with obvious regional differences depending on asbestos exposure."
    explanation: Regional cancer-registry cohort reports an annual incidence of 0.8 per 100,000 inhabitants.
has_subtypes:
- name: Epithelioid Mesothelioma
  description: >-
    The most common histologic subtype (50-70%), characterized by polygonal
    cells arranged in tubulopapillary, trabecular, or solid patterns and
    carrying the most favorable prognosis among mesothelioma subtypes.
  evidence:
  - reference: DOI:10.5603/ocp.100725
    reference_title: Diagnosis and treatment of pleural mesothelioma. State of the art 2024
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are three pathomorphological types of PM: epithelioid (55%), mixed (30%) and sarcomatoid (15%). The worst prognosis histological type is the sarcomatoid type. The median survival time for patients diagnosed with the epithelioid type is approximately 17 months, while the sarcomatoid type is less than 7 months [4]."
    explanation: Establishes epithelioid mesothelioma as the predominant histologic subtype (~55%) with the longest median survival.
- name: Sarcomatoid Mesothelioma
  description: >-
    Accounts for 10-20% of cases, composed of malignant spindle cells arranged
    in fascicles resembling fibrosarcoma, and carries the worst prognosis with
    median survival under one year.
  evidence:
  - reference: DOI:10.5603/ocp.100725
    reference_title: Diagnosis and treatment of pleural mesothelioma. State of the art 2024
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are three pathomorphological types of PM: epithelioid (55%), mixed (30%) and sarcomatoid (15%). The worst prognosis histological type is the sarcomatoid type. The median survival time for patients diagnosed with the epithelioid type is approximately 17 months, while the sarcomatoid type is less than 7 months [4]."
    explanation: Confirms sarcomatoid mesothelioma frequency (~15%) and its poorest survival among histologic subtypes.
- name: Biphasic Mesothelioma
  description: >-
    Mixed-histology mesothelioma containing both epithelioid and sarcomatoid
    components, with prognosis intermediate between pure epithelioid and pure
    sarcomatoid disease.
  evidence:
  - reference: DOI:10.5603/ocp.100725
    reference_title: Diagnosis and treatment of pleural mesothelioma. State of the art 2024
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are three pathomorphological types of PM: epithelioid (55%), mixed (30%) and sarcomatoid (15%)."
    explanation: Identifies mixed (biphasic) mesothelioma as one of the three principal histopathologic subtypes.
environmental:
- name: Asbestos Exposure
  description: >-
    Asbestos fibers, when inhaled or ingested, become lodged in mesothelial
    tissues where they cause chronic inflammation, oxidative stress, and DNA
    damage. The fibers persist indefinitely in tissue and promote chromosomal
    abnormalities and mesothelial cell transformation. Occupational exposure
    accounts for approximately 80% of pleural cases.
  exposure_term:
    preferred_term: exposure to asbestos
    term:
      id: ECTO:9000033
      label: exposure to asbestos
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: CHRONIC
    iarc_carcinogen_group:
      classification_value: GROUP_1
    ghs_health_hazard_class:
    - classification_value: CARCINOGENICITY
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  evidence:
  - reference: PMID:23743993
    reference_title: "[Regional treatment of malignant pleural mesothelioma: results from the tumor centre Regensburg]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malignant pleural mesothelioma (MPM) is an aggressive, malignant tumor of the pleural surface and is strongly associated with asbestos exposure."
    explanation: "Supports the strong causal association between mesothelioma and asbestos exposure."
  influences_mechanisms:
  - target: Asbestos-Induced Mesothelial Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Fibers reaching and lodging in mesothelial tissue set off the repeated
      injury-and-regeneration cycle; because the fibers persist indefinitely,
      the insult is ongoing rather than a single hit.
    evidence:
    - reference: PMID:23743993
      reference_title: "[Regional treatment of malignant pleural mesothelioma: results from the tumor centre Regensburg]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Malignant pleural mesothelioma (MPM) is an aggressive, malignant tumor of the pleural surface and is strongly associated with asbestos exposure."
      explanation: >-
        Ties asbestos exposure specifically to tumors of the pleural surface,
        the mesothelial tissue in which the fiber-induced injury cycle occurs.
pathophysiology:
- name: Asbestos-Induced Mesothelial Injury
  description: >-
    Asbestos fibers penetrate the mesothelium and induce a chronic cycle of
    mesothelial injury, macrophage activation, and tissue regeneration.
    Deposited fibers stimulate mutagenic reactive oxygen and nitrogen species
    and HMGB1/TNF-alpha-mediated chronic inflammation that promote DNA damage
    and clonal tumor-suppressor loss.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  locations:
  - preferred_term: pleura
    term:
      id: UBERON:0000977
      label: pleura
  evidence:
  - reference: PMID:21412769
    reference_title: "Malignant mesothelioma: facts, myths, and hypotheses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asbestos induces DNA alterations mostly by inducing mesothelial cells and reactive macrophages to secrete mutagenic oxygen and nitrogen species. In addition, asbestos carcinogenesis is linked to the chronic inflammatory process caused by the deposition of a sufficient number of asbestos fibers"
    explanation: Establishes mutagenic ROS/RNS generation and chronic fiber-induced serosal inflammation as the initiating injury cascade in mesothelial carcinogenesis.
  downstream:
  - target: BAP1 Tumor Suppressor Inactivation
    description: Mutagenic oxidative DNA damage and clonal selection drive biallelic BAP1 loss
  - target: NF2/Merlin Inactivation
    description: Fiber-induced chromosomal and mutational damage selects for somatic NF2 inactivation
  - target: CDKN2A/p16 Loss
    description: Genotoxic chromosomal Deletions at 9p21 eliminate CDKN2A/ARF tumor suppressor function
- name: BAP1 Tumor Suppressor Inactivation
  description: >-
    BAP1 (BRCA1-associated protein 1) is a nuclear deubiquitinase that regulates
    chromatin remodeling, DNA damage response, and cell cycle progression. BAP1
    is one of the most frequently inactivated tumor suppressors in mesothelioma,
    affected through germline or somatic loss-of-function alterations that
    predispose to malignant transformation and disrupt global gene expression.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  evidence:
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cyclin-dependent kinase inhibitor 2A/alternative reading frame (CDKN2A/ARF), neurofibromatosis type 2 (NF2) and BRCA1-associated protein-1 (BAP1) genes are the most frequently mutated tumor suppressor genes detected in MM cells"
    explanation: >-
      Sekido's molecular pathogenesis review of malignant mesothelioma identifies
      BAP1 as one of the most frequently mutated tumor suppressor genes in MM,
      supporting the claim that BAP1 inactivation is a recurrent driver event.
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BAP1 is involved in histone modification and its inactivation induces the disturbance of global gene expression profiling"
    explanation: >-
      Same review establishes the mechanistic role of BAP1 in chromatin
      regulation/histone modification, supporting the description of BAP1 as a
      chromatin-remodeling tumor suppressor whose loss disrupts gene expression.
  genes:
  - preferred_term: BAP1
    term:
      id: hgnc:950
      label: BAP1
  molecular_functions:
  - preferred_term: deubiquitinase activity
    modifier: DECREASED
    term:
      id: GO:0101005
      label: deubiquitinase activity
  biological_processes:
  - preferred_term: DNA damage response
    modifier: DECREASED
    term:
      id: GO:0006974
      label: DNA damage response
  downstream:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    description: Chromatin dysregulation and impaired DNA damage response promote malignant mesothelial expansion
- name: NF2/Merlin Inactivation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  description: >-
    The NF2 gene encoding the cytoskeletal scaffolding tumor suppressor merlin
    is frequently inactivated in mesothelioma. Loss of merlin actin-cytoskeletal
    scaffolding disrupts Hippo and mTOR pathway restraint, activating YAP/TAZ
    signaling and abolishing contact-dependent growth arrest.
  evidence:
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cyclin-dependent kinase inhibitor 2A/alternative reading frame (CDKN2A/ARF), neurofibromatosis type 2 (NF2) and BRCA1-associated protein-1 (BAP1) genes are the most frequently mutated tumor suppressor genes detected in MM cells"
    explanation: >-
      Sekido's molecular pathogenesis review of malignant mesothelioma identifies
      NF2 as one of the most frequently mutated tumor suppressor genes in MM,
      supporting the claim that NF2 inactivation is a recurrent driver event.
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Merlin, which is encoded by NF2, regulates multiple cell signaling cascades including the Hippo and mammalian target of rapamycin pathways, which regulate cell proliferation and growth"
    explanation: >-
      Same review establishes the mechanistic link between NF2/merlin loss and
      dysregulated Hippo (and mTOR) signaling that drives mesothelioma cell
      proliferation.
  genes:
  - preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  molecular_functions:
  - preferred_term: actin binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003779
      label: actin binding
  biological_processes:
  - preferred_term: Hippo signaling
    modifier: DECREASED
    term:
      id: GO:0035329
      label: hippo signaling
  downstream:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    description: Derepressed Hippo-YAP/TAZ and mTOR signaling drives uncontrolled mesothelial proliferation
- name: CDKN2A/p16 Loss
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  description: >-
    Homozygous deletion of CDKN2A at 9p21, encoding p16INK4a and p14ARF, is one
    of the most frequent somatic genetic alterations in mesothelioma. Loss of
    p16INK4a cyclin-dependent kinase inhibitor activity removes CDK4/6
    restraint on G1/S cell-cycle progression, while p14ARF loss compromises p53
    stabilization.
  evidence:
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cyclin-dependent kinase inhibitor 2A/alternative reading frame (CDKN2A/ARF), neurofibromatosis type 2 (NF2) and BRCA1-associated protein-1 (BAP1) genes are the most frequently mutated tumor suppressor genes detected in MM cells"
    explanation: >-
      Sekido's molecular pathogenesis review identifies CDKN2A/ARF as one of
      the most frequently mutated tumor suppressor genes in mesothelioma,
      supporting the claim that CDKN2A inactivation is a recurrent driver
      event.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  molecular_functions:
  - preferred_term: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  biological_processes:
  - preferred_term: negative regulation of G1/S transition
    modifier: DECREASED
    term:
      id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
  downstream:
  - target: Malignant Mesothelial Proliferation and Serosal Invasion
    description: Unchecked G1/S cell-cycle progression accelerates malignant mesothelial growth
- name: Malignant Mesothelial Proliferation and Serosal Invasion
  description: >-
    Transformed mesothelial cells grow diffusely along pleural or peritoneal
    serosal surfaces, encasing underlying viscera, infiltrating the parietal
    serosa and chest wall, and promoting exudative serosal fluid accumulation
    and systemic cancer cachexia.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  locations:
  - preferred_term: pleura
    term:
      id: UBERON:0000977
      label: pleura
  evidence:
  - reference: PMID:23677068
    reference_title: "Molecular pathogenesis of malignant mesothelioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malignant mesothelioma (MM) is an aggressive tumor arising primarily from the pleural or peritoneal cavities. It develops by asbestos exposure after a long latency, which is characterized by insidious growth and clinical presentation at an advanced stage of disease."
    explanation: Supports insidious diffuse tumor growth along pleural and peritoneal serosal cavities leading to locally advanced clinical disease.
  downstream:
  - target: Pleural Effusion
    description: Serosal tumor infiltration and impaired lymphatic drainage cause exudative pleural fluid accumulation
  - target: Dyspnea
    description: Lung encasement by diffuse pleural tumor restricts lung expansion and causes dyspnea
  - target: Chest Pain
    description: Direct tumor invasion of the parietal pleura, ribs, and intercostal nerves causes chest wall pain
  - target: Weight Loss
    description: Progressive tumor burden and systemic catabolic signaling drive unintentional weight loss
  - target: Fatigue
    description: Systemic tumor burden, chronic inflammation, and cardiopulmonary restriction cause asthenia and fatigue

treatments:
- name: Platinum-Based Chemotherapy
  description: >-
    Systemic combination chemotherapy pairing cisplatin (or carboplatin) with
    the antifolate pemetrexed is a standard backbone regimen for unresectable
    mesothelioma, improving median survival to approximately 12-16 months (and
    further when combined with bevacizumab).
  therapeutic_modality: SMALL_MOLECULE

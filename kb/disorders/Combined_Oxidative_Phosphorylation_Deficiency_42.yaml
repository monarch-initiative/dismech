- name: Deficient Mitochondrial Protein Synthesis
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Pulse labelling with radiolabelled methionine in the presence of emetine, to
    silence cytoplasmic translation, showed a strong and generalized defect in
    mtDNA-encoded protein synthesis in the GATC patient's fibroblasts. Because
    glutamine codons occur throughout the thirteen mtDNA-encoded proteins, the
    defect is general rather than selective for one complex - this is the reason
    the disease is a combined rather than an isolated respiratory chain
    deficiency.

    A subtlety worth preserving: the reduction in newly synthesized protein was
    not accompanied by reduced steady-state levels of assembled OXPHOS subunits
    in fibroblasts. Chloramphenicol chase experiments showed the explanation is
    increased stability of the existing subunits, which together with residual
    GatCAB activity masks the defect in that cell type. A chloramphenicol block
    and release experiment made the kinetics visible: translation resumes at a
    near-normal rate for a few hours on accumulated charged tRNA, then falls
    behind as charging fails to keep up with demand.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      revealed a strong and generalized mtDNA-encoded protein synthesis defect
      after a 90-min pulse in P4B (GATC) and in P3A (QRSL1) patients' fibroblasts
    explanation: >-
      Direct measurement of the translation defect in the GATC patient's cells.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, during continued translation, the rate of charging mt-tRNAGln with
      glutamine cannot keep up with the demand, and translation efficiency
      decreases
    explanation: >-
      Establishes that the defect is one of charging throughput under sustained
      demand rather than an absolute block.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      It is remarkable that this impairment of mitochondrial DNA-encoded protein

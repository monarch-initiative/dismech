- name: Tissue-Selective Bioenergetic Failure of the Myocardium
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The translation defect is not expressed equally across tissues. It is most
    pronounced in heart, less so in skeletal muscle, and nearly absent in
    fibroblasts - a gradient that tracks oxidative demand and explains why a
    cardiomyopathy rather than a multisystem encephalopathy is the presenting
    disease. Post-mortem cardiac tissue from a GATC patient shows the
    morphological signature of the compensation attempted: massive mitochondrial
    proliferation displacing the contractile elements on electron microscopy, and
    a corresponding increase in mitochondrial mass by SDHB immunostaining.

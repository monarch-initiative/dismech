- name: Combined Respiratory Chain Enzyme Deficiency
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    All patients showed a combined deficiency with decreased activities of
    complexes I and IV and low or borderline-low complex III, varying between
    tissues. The pattern is exactly what a general mitochondrial translation
    defect predicts: complexes I, III, IV and V contain mtDNA-encoded subunits and
    are affected, while complex II, which is entirely nuclear-encoded, is not.
    Incompletely assembled complex I subcomplexes are demonstrable, and are more
    prominent when glutamine is withdrawn.

    Conformance note: this node conforms to the module's central bioenergetic
    node, but only in part. The module pairs decreased oxidative phosphorylation
    with increased reactive oxygen species. Decreased oxidative phosphorylation
    is directly evidenced in these patients; the reactive oxygen species arm is
    evidenced only in a mouse-cell GatA knockdown, not in GATC patients, and is
    curated on that model rather than asserted here. The module's upstream node -
    age-related mitochondrial damage and mtDNA mutation - does not apply to a
    primary nuclear-gene translation defect, which is why conformance is declared
    at this node alone.

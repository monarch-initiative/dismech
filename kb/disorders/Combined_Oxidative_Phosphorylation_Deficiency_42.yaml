- category: Neonatal
  name: Infantile Onset with Death Before Seven Months
  description: >-
    Onset between two and 5.5 months and death by 6.5 months in all five reported
    patients. This is the feature that separates COXPD42 from the GATB and QRSL1
    disorders in the same series, whose families had prenatal onset with hydrops
    or intrauterine growth restriction and died within days. Hydrops,
    intrauterine growth restriction and prematurity were absent from the GATC
    families.
  phenotype_term:
    preferred_term: Infantile onset
    onset:
      onset_category: INFANTILE
  notes: >-
    No `term:` is bound. The candidate HPO terms for onset timing (HP:0003593
    Infantile onset) and for early death (HP:0001522 Death in infancy) sit under
    Clinical modifier and Age of death respectively, outside the `PhenotypeTerm`
    dynamic enum, which is reachable only from the phenotypic-abnormality root.
    The structured `onset` descriptor carries the timing instead.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of symptoms was either prenatal (families 1 and 3) or infantile at
      2–5 months (families 2, 4, and 5), and no child survived beyond 6.5 months.
    explanation: >-
      Dates onset and death, with families 4 and 5 being the GATC families.
progression:
- phase: Lethal infantile course
  notes: >-
    Onset at two to 5.5 months with cardiomyopathy and lactic acidosis, death by
    6.5 months in every reported patient. No treatment altered the course. The
    prognosis is not specific to GATC - mitochondrial cardiomyopathy in children
    carries a markedly worse survival than mitochondrial disease without
    cardiomyopathy, with ten-year survival of 18 percent against 67 percent in
    one 137-patient cohort, and defects in the sibling gene QRSL1 appear among the
    deaths within the first year in that cohort.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of symptoms was either prenatal (families 1 and 3) or infantile at
      2–5 months (families 2, 4, and 5), and no child survived beyond 6.5 months.
    explanation: >-
      The course in the reported patients.
  - reference: PMID:30642647
    reference_title: "Cardiomyopathy in children with mitochondrial disease: Prognosis and genetic background."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten-year Kaplan-Meier estimates of overall survival were 18 and 67%,
      respectively.
    explanation: >-
      Curated as PARTIAL: this cohort contains no GATC patients, so it supplies
      the general prognosis of paediatric mitochondrial cardiomyopathy as context
      rather than a COXPD42-specific survival estimate.
biochemical:
- name: Respiratory Chain Enzyme Activities
  notes: >-
    Combined deficiency of complexes I and IV with low or borderline-low complex
    III, varying by tissue. The diagnostic trap is the tissue chosen: clear
    deficiencies were seen in the fibroblasts of the GatB patients but not in
    those of the GatA and GatC patients, so a normal fibroblast respiratory chain
    panel does not exclude COXPD42. Heart and skeletal muscle are the informative
    tissues.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the fibroblasts of the GatA and GatC patients, clear
      respiratory chain enzyme deficiencies were observed in the fibroblasts of
      the GatB patients.
    explanation: >-
      The subunit-specific difference in fibroblast expressivity that makes
      fibroblast testing unreliable for GATC.
- name: Blood Lactate
  notes: >-
    Lactic acidosis is present in every reported patient and is the finding that
    prompts investigation for mitochondrial disease.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      infants predominantly exhibiting severe cardiomyopathy and fatal lactic
      acidosis, which raised suspicion of mitochondrial disease
    explanation: >-
      Establishes lactic acidosis as the trigger for mitochondrial investigation.
genetic:
- name: GATC
  gene_term:
    preferred_term: GATC
    term:
      id: hgnc:25068
      label: GATC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    GATC encodes GatC, the smallest of the three subunits of the mitochondrial
    glutamyl-tRNA(Gln) amidotransferase. Unlike GatA (QRSL1) and GatB (GATB), it
    has no catalytic activity of its own: in the bacterial complex it is the
    stabilizing linker holding the amidase and kinase subunits together. That
    architecture is why a GATC lesion is not a milder version of the others but
    an equivalent one - loss of GatC depletes GatA and GatB too.

    Only one pathogenic GATC allele is reported: homozygous c.233T>G
    (p.Met78Arg), in two families from adjacent villages. The entire clinical
    description of COXPD42 therefore rests on one variant in five patients, and
    the allelic and phenotypic range of the disorder is unknown.

    GATC sits within a coherent gene group. QRSL1 (GatA) and GATB (GatB) cause
    the two sibling COXPD entities in the same report; upstream, EARS2 performs
    the first, mischarging step of the same two-step pathway. A COXPD42-like
    presentation should prompt sequencing of all three GatCAB genes rather than
    GATC alone, since they are clinically indistinguishable at presentation.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This latter conversion is performed by GatCAB, the glutamyl-tRNAGln
      amidotransferase protein complex, that consists of three subunits: GatA
      encoded by QRSL1, GatB encoded by GATB, and GatC encoded by GATC
    explanation: >-
      Establishes the subunit-to-gene mapping of the complex.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe nine patients from five families with genetic defects in a
      GatCAB complex subunit, including QRSL1, GATB, and GATC, each showing a
      lethal metabolic cardiomyopathy syndrome.
    explanation: >-
      Establishes that all three subunit genes produce the same clinical
      syndrome, which is the basis for testing them together.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it is first charged with glutamic acid (Glu) by mitochondrial glutamyl-tRNA
      synthetase (EARS2), after which the Glu-mt-tRNAGln is transamidated into
      Gln-mt-tRNAGln, using free glutamine as an amide donor
    explanation: >-
      Places EARS2 upstream of GatCAB in the same pathway.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five patients from two families, all homozygous for the same GATC allele and
    all reported in a single 2018 paper. No population estimate exists and none
    can be derived. The two families reside in adjacent villages, so even the
    published count may reflect a single local founder allele rather than the
    disorder's true distribution.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In families 4 and 5, which are reportedly not related but reside in adjacent
      villages, we identified a homozygous missense variant in GATC: c.233T>G;
      p.Met78Arg.
    explanation: >-
      The two families that constitute the entire published series, and their
      geographic proximity.
experimental_models:
- name: GATC patient primary dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from patient P4B, homozygous for GATC p.Met78Arg.
    They are the system in which nearly all the mechanism in this entry was
    established, and they are also the clearest illustration of why fibroblasts
    are a poor diagnostic tissue for this disorder: under standard culture
    conditions their respiratory chain enzymes and steady-state OXPHOS subunit
    levels are normal, and the defect appears only when glutamine is withdrawn or
    translational demand is sustained.
  modeled_mechanisms:
  - target: GatCAB Trimer Destabilization
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The system in which GatC depletion to 20 percent of control, the parallel
      loss of GatA and GatB, and the unchanged transcript levels were measured.
    limitations: >-
      Fibroblast is not the affected tissue. Whether the same degree of subunit
      depletion occurs in cardiomyocytes has not been measured.
    readouts:
    - name: GatC steady-state protein level
      target: GatCAB Trimer Destabilization
      direction: DECREASED
      interpretation: >-
        Reduction to about a fifth of control, with GatA and GatB falling in
        parallel, is the measurement establishing trimer destabilization.
      evidence:
      - reference: PMID:30283131
        reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Western blot analysis of control and patient P4B fibroblasts showed a
          strong reduction in GatC protein, and also reduced levels of GatA and
          GatB protein, with porin as loading control.
        explanation: >-
          The western blot measurement underlying this readout.
    evidence:
    - reference: PMID:30283131
      reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In subject P4B with mutations in GATC, the steady state level of GatC in
        fibroblasts was decreased to 20% of controls
      explanation: >-
        Establishes the model as informative for the trimer-destabilization node.
  - target: Impaired Transamidation of Glu-mt-tRNA(Gln)
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the charging defect, but conditionally: mt-tRNA(Gln) charging is
      similar to control in glutamine-replete medium and falls only after three
      days of glutamine withdrawal.
    limitations: >-
      The conditionality is the limitation. A negative result in glutamine-replete
      medium says nothing about the genotype, so this model must be run under
      glutamine restriction to be informative.
    readouts:
    - name: mt-tRNA(Gln) aminoacylation by northern blot
      target: Impaired Transamidation of Glu-mt-tRNA(Gln)
      direction: DECREASED
      interpretation: >-
        Reduced charging under glutamine withdrawal, against normal charging in
        replete medium.
      evidence:
      - reference: PMID:30283131
        reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          After 3 days in culture medium without glutamine, fibroblasts from P1A,
          P3A, and P4B show decreased glutamine charging of mt-tRNAGln compared to
          control fibroblasts.
        explanation: >-
          The northern blot measurement underlying this readout.
    evidence:
    - reference: PMID:30283131
      reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        While aminoacylation of mt-tRNAGln appears to show only minor changes in
        comparison to controls when patient cells are grown under standard
        conditions with high concentrations of the GatCAB substrate glutamine in
        the culture medium
      explanation: >-
        Curated as PARTIAL because the model reproduces the defect only under
        glutamine restriction.
  - target: Deficient Mitochondrial Protein Synthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Radiolabelled-methionine pulse labelling under emetine block showed a strong
      generalized mtDNA-encoded translation defect in these cells, and a
      chloramphenicol block-and-release experiment resolved its kinetics.
    limitations: >-
      The translation defect does not translate into reduced steady-state OXPHOS
      subunit levels in this cell type, because the existing subunits are
      stabilised - so the model reproduces the primary defect but not its usual
      downstream readout.
    readouts:
    - name: De novo mtDNA-encoded protein synthesis
      target: Deficient Mitochondrial Protein Synthesis
      direction: DECREASED
      interpretation: >-
        Reduced incorporation of labelled methionine into mitochondrially
        translated peptides.
      evidence:
      - reference: PMID:30283131
        reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          a Decrease in newly synthesized peptides in GATA and GATC patient
          fibroblasts compared to control as determined by pulse labeling.
        explanation: >-
          The pulse-labelling measurement underlying this readout. Note the figure
          legend writes "GATA" where the gene is QRSL1 (GatA); the GATC arm is the
          one relevant here.
    evidence:
    - reference: PMID:30283131
      reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        revealed a strong and generalized mtDNA-encoded protein synthesis defect
        after a 90-min pulse in P4B (GATC) and in P3A (QRSL1) patients' fibroblasts
      explanation: >-
        Establishes the model as informative for the translation node.
- name: mouse GatA (Qrsl1) RNA interference cell model
  experimental_model_type: CELL_LINE
  description: >-
    Knockdown of mouse GatA in mouse cells, published four years before the human
    disorder was described. It is the source of two claims that the patient data
    do not supply: that GatCAB loss raises reactive oxygen species, and that
    mischarged Glu-mt-tRNA(Gln) is rejected by the translation apparatus rather
    than being incorporated as glutamate.
  modeled_mechanisms:
  - target: Deficient Mitochondrial Protein Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown produces a strong mitochondrial translation defect without
      affecting the stability of newly synthesized proteins, and mass spectrometry
      found no glutamate substituted at glutamine positions - so the failure mode
      is loss of translation, not mistranslation.
    limitations: >-
      Different subunit (GatA, not GatC), different species, and an acute
      knockdown rather than a hypomorphic germline missense allele. It cannot
      speak to the residual-activity question that governs severity in patients.
    readouts:
    - name: Reactive oxygen species level
      target: Deficient Mitochondrial Protein Synthesis
      direction: INCREASED
      interpretation: >-
        The only evidence in this entry for an oxidative-stress component; it is
        from mouse cells with a different subunit knocked down, not from GATC
        patients.
      evidence:
      - reference: PMID:24579914
        reference_title: "Glutamyl-tRNAGln amidotransferase is essential for mammalian mitochondrial translation in vivo."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          As a result, interfered cells present an impairment of the oxidative
          phosphorylation system and a significant increase in ROS (reactive oxygen
          species) levels.
        explanation: >-
          The measurement underlying this readout.
    evidence:
    - reference: PMID:24579914
      reference_title: "Glutamyl-tRNAGln amidotransferase is essential for mammalian mitochondrial translation in vivo."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we demonstrate that mgatA (mouse GatA) interference in mouse cells produces
        a strong defect in mitochondrial translation without affecting the
        stability of the newly synthesized proteins
      explanation: >-
        Establishes the translation defect on knockdown of a GatCAB subunit.
diagnosis:
- name: Sequencing of the Three GatCAB Subunit Genes
  description: >-
    Molecular diagnosis is the practical route, because the three GatCAB
    disorders are clinically indistinguishable and the biochemical workup in
    fibroblasts can be normal. All five families in the defining series were
    solved by whole-exome sequencing. A targeted panel should include QRSL1,
    GATB and GATC together, and EARS2 as the upstream step of the same pathway.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) analysis in these families uncovered rare
      pathogenic variants in the three genes encoding the GatCAB complex subunits,
      in-line with autosomal recessive inheritance
    explanation: >-
      Documents exome sequencing as the diagnostic route in every reported family.
- name: Respiratory Chain Analysis in Heart or Skeletal Muscle
  description: >-
    If a tissue enzyme assay is done, the tissue matters. Deficiencies were clear
    in the fibroblasts of GatB patients but not of GatA or GatC patients, so a
    normal fibroblast panel cannot exclude COXPD42; heart and skeletal muscle
    carry the deficit. Where only fibroblasts are available, glutamine withdrawal
    unmasks the defect.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the fibroblasts of the GatA and GatC patients, clear
      respiratory chain enzyme deficiencies were observed in the fibroblasts of
      the GatB patients.
    explanation: >-
      The basis for preferring heart or muscle over fibroblasts in this disorder.
differential_diagnoses:
- name: QRSL1-related and GATB-related combined oxidative phosphorylation deficiency
  description: >-
    The two sibling disorders, caused by defects in the other two subunits of the
    same complex and described in the same report. They present with the same
    lethal metabolic cardiomyopathy and are not separable clinically; the reported
    difference is timing, with the GATB and QRSL1 families having prenatal onset
    and neonatal death against infantile onset in the GATC families. That
    difference is attributed to residual activity and residue conservation rather
    than to which subunit is affected, so it should not be used as a rule for
    predicting the gene.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe nine patients from five families with genetic defects in a
      GatCAB complex subunit, including QRSL1, GATB, and GATC, each showing a
      lethal metabolic cardiomyopathy syndrome.
    explanation: >-
      Establishes that all three subunit disorders share one clinical syndrome.
- name: Other mitochondrial aminoacylation and translation defects
  description: >-
    COXPD42 is the last entry in a decade-long series of mitochondrial
    aminoacylation disorders that began with DARS2, and it sits inside a larger
    group of paediatric mitochondrial cardiomyopathies caused by defects in
    mtDNA-encoded protein translation. Members of that group are separated by
    genotype rather than by phenotype; the presence of cardiomyopathy with lactic
    acidosis in infancy narrows the search to the group but not within it.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our study completes a decade of investigations on mitochondrial
      aminoacylation disorders, starting with DARS2 and ending with the GatCAB
      complex.
    explanation: >-
      Places COXPD42 within the aminoacylation-disorder group.
  - reference: PMID:29440775
    reference_title: "Genetic defects in mtDNA-encoded protein translation cause pediatric, mitochondrial cardiomyopathy with early-onset brain disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Defects in mtDNA-encoded protein translation lead to severe pediatric
      cardiomyopathy and brain disease with OXPHOS abnormalities.
    explanation: >-
      Establishes the wider group of mtDNA-translation defects presenting as
      paediatric cardiomyopathy, within which COXPD42 must be distinguished
      genetically. Note this series' patients also had early-onset brain disease,
      which was not reported in the GATC patients.
discussions:
- discussion_id: coxpd42_glutamine_supplementation_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Could raising glutamine availability compensate for reduced GatCAB activity in
    a patient, as it appears to in patient fibroblasts?
  attaches_to:
  - "pathophysiology#Impaired Transamidation of Glu-mt-tRNA(Gln)"
  rationale: >-
    This is the most obvious therapeutic idea the biology suggests, and it is
    entirely untested. The observation behind it is robust: patient fibroblasts
    charge mt-tRNA(Gln) at near-normal levels in glutamine-rich medium and fail
    only when glutamine is withdrawn, and complex I subassemblies become more
    prominent under withdrawal. Glutamine is the amide donor for the reaction, so
    substrate concentration plausibly compensates for reduced enzyme.

    Three things stand between that and a treatment, and this entry curates no
    treatment for exactly these reasons. First, the experiments show that
    supraphysiological culture glutamine masks the defect - not that
    physiologically achievable plasma glutamine would. Second, the cells in which
    the rescue is seen are fibroblasts, the tissue least affected in the disease;
    the heart is the tissue that must be rescued, and no cardiac model exists.
    Third, and most limiting, the chloramphenicol block-and-release experiment
    showed that translation keeps pace only briefly before charging falls behind
    sustained demand, which suggests the constraint is enzymatic throughput rather
    than substrate supply once demand is high. A cardiomyocyte never stops
    translating.
  proposed_experiments:
  - experiment_id: exp_coxpd42_glutamine_dose_response
    name: Glutamine dose-response across the physiological range
    description: >-
      Titrate glutamine across the physiological plasma range rather than
      comparing replete against absent, in patient fibroblasts and in
      cardiomyocytes differentiated from patient-derived induced pluripotent stem
      cells, with mt-tRNA(Gln) charging and mitochondrial translation as readouts.
      The question is whether any achievable concentration restores function, not
      whether an artificially high one does.
  - experiment_id: exp_coxpd42_cardiomyocyte_model
    name: A cardiac model of GatC deficiency
    description: >-
      Every mechanistic result in this disorder comes from fibroblasts, which are
      the least affected tissue and can look normal. Generate GATC p.Met78Arg
      cardiomyocytes, by editing or from patient cells, and determine whether the
      tissue gradient seen in post-mortem tissue is reproduced in vitro and
      whether the glutamine conditionality holds in a cell with high and
      continuous translational demand.
- discussion_id: coxpd42_single_allele_single_report
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does COXPD42 have a phenotypic range, or is everything known about it a
    property of one founder allele?
  attaches_to:
  - "pathophysiology#Biallelic GATC Missense Variant"
  rationale: >-
    Everything in this entry describes five patients from two families in
    adjacent villages, all homozygous for the same GATC allele, reported in one
    paper. That is not a phenotype; it is one genotype observed several times.

    The distinction matters because the paper's own severity model predicts a
    range. It proposes that clinical severity tracks residual GatCAB activity, and
    that residual activity tracks the conservation of the mutated residue - which
    is how it explains the prenatal onset of the GATB and QRSL1 families against
    the infantile onset of the GATC ones. If that model is right, a GATC allele at
    a more conserved residue should produce a more severe, possibly prenatally
    lethal, disease, and a milder allele should produce something that survives
    infancy and has never been recognised as COXPD42. Neither has been reported.
    Nothing in the current literature can distinguish "COXPD42 is uniformly lethal
    in infancy" from "the one known GATC allele is lethal in infancy".
  proposed_experiments:
  - experiment_id: coxpd42_allelic_series_functional_assay
    name: Functional assay for an allelic series of GATC variants
    description: >-
      Build a quantitative assay of GatCAB activity - mt-tRNA(Gln) charging in a
      GATC-null background complemented with variant constructs - and use it to
      calibrate residual activity against the p.Met78Arg benchmark for GATC
      variants of unknown significance found in diagnostic sequencing. This would
      test the residual-activity model and make future GATC variants
      interpretable.
notes: >-
  Scope. This entry covers COXPD42 (MONDO:0030008), the GATC-related disorder.
  The two sibling GatCAB disorders caused by QRSL1 and GATB are curated here only
  as differential diagnoses; they are separate MONDO entities and their evidence
  should not be imported into this entry's pathograph even though it comes from
  the same paper.

  Read the patient labels. The defining paper reports nine patients across three
  genes in shared tables and figures, and its summary counts - cardiomyopathy 9/9,
  anaemia 7/7 - are for all nine, not for the five GATC patients. Wherever this
  entry states a GATC-specific count it is derived by reading the per-patient
  columns for P4A, P4B, P4C, P5A and P5B, and the evidence snippets attached are
  the sentences that name families 4 and 5 or the patients within them. No
  `frequency:` band is assigned anywhere in this entry: with five patients sharing
  one allele, a percentage would imply a precision the series cannot support.

  Where the mechanism is and is not from patients. The trimer-destabilization,
  charging, translation and respiratory-chain nodes all rest on measurements in
  the GATC patient's own fibroblasts, which is unusually good for a five-patient
  disorder. Two claims do not: the increase in reactive oxygen species and the
  finding that mischarged Glu-mt-tRNA(Gln) is rejected rather than mistranslated
  both come from a mouse-cell GatA knockdown, and are curated on that model with
  its species and subunit differences stated rather than folded into the human
  pathograph.

  No treatments block, deliberately. There is no treatment for COXPD42 and none
  was reported. The glutamine-conditional biochemistry invites a supplementation
  hypothesis, and that hypothesis is recorded as an open discussion with its three
  specific obstacles rather than curated as a treatment. Curating glutamine as a
  therapy on the strength of a culture-medium experiment in the least-affected
  tissue would be exactly the kind of over-reach the discussion exists to prevent.

  Conformance. The entry declares conformance to
  `mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress` at the
  combined respiratory chain node only. The module is built around age-related
  mitochondrial damage, so its upstream nodes do not apply to a primary
  nuclear-gene translation defect, and its reactive-oxygen-species arm is not
  evidenced in these patients. None of the existing nuclear mitochondrial-disease
  entries in this knowledge base declare conformance to that module; this one does
  because the module's own text names that node as the state disease-specific
  mitochondrial lesions converge on.

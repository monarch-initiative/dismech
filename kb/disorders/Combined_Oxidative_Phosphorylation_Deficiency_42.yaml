name: Combined oxidative phosphorylation deficiency 42
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Combined oxidative phosphorylation deficiency 42 (COXPD42) is a lethal
  infantile mitochondrial cardiomyopathy caused by biallelic variants in GATC.
  GATC encodes GatC, the smallest subunit of the mitochondrial glutamyl-tRNA(Gln)
  amidotransferase GatCAB. Mitochondria have no glutaminyl-tRNA synthetase, so
  glutaminyl mt-tRNA cannot be charged directly: it is first mischarged with
  glutamate by EARS2 and then transamidated to Gln-mt-tRNA(Gln) by GatCAB, using
  free glutamine as the amide donor. GatCAB is the sole route, so its failure
  compromises the translation of all thirteen mtDNA-encoded proteins and produces
  a combined respiratory chain deficiency rather than a single-complex one.

  Two features distinguish COXPD42 from a generic mitochondrial translation
  defect. The biochemical phenotype is conditional on glutamine supply - patient
  fibroblasts charge mt-tRNA(Gln) almost normally in standard glutamine-rich
  medium and fail only when glutamine is withdrawn or when translational demand
  is sustained - which is both a diagnostic trap and the origin of an untested
  therapeutic idea. And the tissue distribution is steeply skewed: the heart is
  devastated, skeletal muscle less so, and cultured fibroblasts look almost
  normal. All five reported GATC patients came from two families in adjacent
  villages, carried the same homozygous p.Met78Arg allele, and died by 6.5
  months.
category: Mendelian
parents:
- hereditary disease
synonyms:

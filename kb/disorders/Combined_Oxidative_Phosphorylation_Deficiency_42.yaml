  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of symptoms was either prenatal (families 1 and 3) or infantile at
      2–5 months (families 2, 4, and 5), and no child survived beyond 6.5 months.
    explanation: >-
      Dates onset and death. Families 4 and 5 are the GATC families, so the
      infantile arm of this statement is the COXPD42 course.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."

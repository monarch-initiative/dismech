- name: Lethal Infantile Cardiomyopathy with Lactic Acidosis
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint. All five GATC patients presented between two and 5.5
    months with cardiomyopathy and lactic acidosis, and none survived beyond 6.5
    months. Anaemia accompanied the presentation in every GATC patient in whom it
    was assessed, which is notable because anaemia is a rare feature of
    mitochondrial disease; bone marrow examination showed no ringed sideroblasts.
    Liver dysfunction and mildly elevated creatine kinase were present in four of
    the five.

    The onset timing separates COXPD42 from its GatCAB siblings: the GATB and
    QRSL1 families in the same report had prenatal onset with hydrops or growth
    restriction and died within days, whereas the GATC families presented in
    infancy.

- name: GatCAB Trimer Destabilization
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    In the bacterial complex GatA carries the amidase function and GatB the
    kinase function, while GatC serves as a stabilizing linker between them. The
    patient data show that this architectural role is what fails. In GATC patient
    fibroblasts GatC protein falls to about 20 percent of control, and GatA and
    GatB fall by a comparable amount - even though neither of their genes is
    mutated. The likely explanation is that the individual subunits are unstable
    when not incorporated into the trimer.

    Crucially this is post-transcriptional: mRNA levels of QRSL1, GATB and GATC
    were unchanged in patient fibroblasts, so the loss of GatA and GatB is
    protein instability rather than a transcriptional response. A GATC lesion
    therefore behaves as a lesion of the whole amidotransferase, which is why a
    subunit with no catalytic activity of its own produces the same disease as
    the catalytic subunits.
  evidence:
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In subject P4B with mutations in GATC, the steady state level of GatC in
      fibroblasts was decreased to 20% of controls (Fig. 3e), and the GatA and
      GatB protein levels were equally substantially decreased (Fig. 3e),
      probably due to the instability of the individual subunits when they are not
      incorporated in the GatCAB trimer.
    explanation: >-
      The central observation: a GATC variant depletes all three subunits, with
      the authors' own hedged explanation.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we analyzed their mRNA levels in exponentially growing fibroblasts from
      patients P3A and P4B and found no significant changes in the transcriptional
      rate of the three genes compared to controls
    explanation: >-
      Excludes a transcriptional explanation and localises the effect to protein
      stability.
  - reference: PMID:30283131
    reference_title: "Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal mitochondrial cardiomyopathy disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the bacterial GatCAB complex, GatA and GatB possess the catalytic amidase
      and kinase functions, respectively, while GatC serves as a stabilizing
      linker between them.
    explanation: >-
      Establishes GatC's structural rather than catalytic role, which is what
      makes trimer destabilization the mechanism.
  downstream:
  - target: Impaired Transamidation of Glu-mt-tRNA(Gln)
    causal_link_type: DIRECT
- name: Impaired Transamidation of Glu-mt-tRNA(Gln)
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Mitochondria have no glutaminyl-tRNA synthetase. Glutaminyl mt-tRNA is
    therefore charged indirectly in two steps: EARS2 mischarges it with
    glutamate, and GatCAB transamidates the Glu-mt-tRNA(Gln) to Gln-mt-tRNA(Gln)
    using free glutamine as amide donor. The same paper closed the obvious
    escape route - cytoplasmic QARS had been reported in some databases as
    dual-localised, but QARS-GFP did not co-localise with TOM20, cellular
    fractionation showed no mitochondrial enrichment, and the trace that did
    fractionate with mitochondria was proteinase-K sensitive. Mitochondria depend
    exclusively on GatCAB.

    The defect is conditional on substrate supply, which is the single most
    important practical fact about this disorder. In standard glutamine-rich
    culture medium patient fibroblasts charge mt-tRNA(Gln) similarly to controls;
    only after three days without glutamine does charging fall. A normal-looking
    fibroblast assay run under standard conditions is therefore not evidence
    against the diagnosis.

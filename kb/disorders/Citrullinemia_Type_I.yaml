progression:
- subtype: Acute neonatal
  phase: Neonatal hyperammonemic crisis
  age_range: First days of life
  notes: 'Normal appearance at birth followed within days by hyperammonemia, progressive lethargy, poor feeding, vomiting, and rising intracranial pressure that advances to increased neuromuscular tone, spasticity, ankle clonus, seizures, loss of consciousness and death if untreated.

    '
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Without prompt intervention, hyperammonemia and the accumulation of other toxic metabolites (e.g., glutamine) result in increased ICP, increased neuromuscular tone, spasticity, ankle clonus, seizures, loss of consciousness, and death.
    explanation: GeneReviews sets out the untreated neonatal crisis sequence.
- subtype: Acute neonatal
  phase: Post-crisis survival with neurologic sequelae
  notes: 'Children with the severe form treated promptly may survive for an indeterminate period, but usually with significant neurologic deficits. Even on chronic protein restriction and scavenger therapy, long-term complications including liver failure remain possible - treatment controls but does not eliminate the disease.

    '
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Children with the severe form who are treated promptly may survive for an indeterminate period of time, but usually with significant neurologic deficits.
    explanation: Establishes that survival of the neonatal form is typically with deficits rather than intact.
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Even with chronic protein restriction and scavenger therapy, long-term complications such as liver failure and other (rarely reported) organ system manifestations are possible.
    explanation: Documents that standard chronic therapy does not abolish long-term risk.
- subtype: Late-onset
  phase: Later-onset intermittent hyperammonemia
  age_range: Childhood to adulthood
  notes: 'Hyperammonemic episodes comparable to the neonatal form but starting later, with more subtle initial neurologic findings owing to the older age at onset. Registry data across urea cycle disorders show late-onset presentations carry substantially lower mortality than early-onset ones (7.1% versus 35.8%).

    '
  evidence:
  - reference: PMID:40218931
    reference_title: "Understanding the Natural History and the Effects of Current Therapeutic Strategies on Urea Cycle Disorders: Insights from the UCD Spanish Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EO cases presented a higher mortality rate (35.8%) than late-onset (LO) cases (7.1%)
    explanation: Class-level registry data quantifying the early-versus-late-onset mortality difference.
- subtype: Pregnancy or postpartum onset
  phase: Pregnancy or postpartum decompensation
  notes: 'Severe symptoms including acute hepatic decompensation may first appear during pregnancy or in the postpartum period in women with no earlier metabolic history. The physiological catabolic stress of delivery and the postpartum period unmasks marginal residual ureagenic capacity.

    '
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Women with onset of severe symptoms including acute hepatic decompensation during pregnancy or in the postpartum period have been reported.
    explanation: GeneReviews documents this presentation as part of the CTLN1 spectrum.
  - reference: PMID:36859323
    reference_title: "Rare Adult-onset Citrullinemia Type 1 in the Postpartum Period: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Urea cycle disorders are typically diagnosed on neonatal screening but rarely can lie dormant until a metabolic stressor causes initial onset of symptoms in adulthood.
    explanation: States the dormant-until-stressor mechanism underlying adult and peripartum first presentations.
  - reference: PMID:36859323
    reference_title: "Rare Adult-onset Citrullinemia Type 1 in the Postpartum Period: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The low incidence makes these treatable disorders easy to overlook leading to potentially significant morbidity and mortality.
    explanation: Documents the recognition failure risk that makes this phase clinically important despite its rarity.
- subtype: Asymptomatic
  phase: Persistent asymptomatic biochemical phenotype
  notes: 'Some individuals with biallelic ASS1 variants remain free of symptoms and of hyperammonemia, documented to at least age ten and possibly lifelong.

    '
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: previously asymptomatic and non-pregnant individuals have been described who remained asymptomatic up to at least age ten years, with the possibility that they could remain asymptomatic lifelong
    explanation: Documents the asymptomatic course as a genuine outcome, not merely a pre-symptomatic interval.

notes: 'CTLN1 is among the most common urea cycle disorders. The Spanish UCD registry (PMID:40218931) names ornithine transcarbamylase deficiency and argininosuccinate synthetase deficiency as its two commonest defects, and the UCDC longitudinal study (PMID:25135652) puts ASSD plus ASLD at about 30% of urea cycle disorders; the specific rank varies by cohort and ascertainment, so no fixed ordinal is asserted here. The Alshaya et al. 2018 review (DOI:10.1007/s40138-018-0174-5) provides additional detail on the astrocyte glutamine-osmotic injury mechanism but was not indexed in PubMed. The GeneReviews entry (PMID:20301631) serves as a comprehensive clinical reference for classic and non-classic CTLN1 management.

  Epidemiological framing, deliberately kept out of the prevalence block: the estimated overall US birth prevalence of urea cycle disorders AS A CLASS is 1 in 35,000 (PMID:25135652), and ASSD plus ASLD together comprise about 30% of urea cycle disorders. The class figure is often quoted alongside CTLN1 - it was the entry''s only prevalence content before this review - but it describes the whole class and must not be read as a CTLN1 rate. It is recorded here rather than as a prevalence record precisely so that no consumer reading rate_per_100000 picks it up as this disease''s rate.

  No CTLN1-specific prevalence record exists in this entry, and that is a real gap rather than an oversight: the closest available figure is the ASSD-plus-ASLD combined newborn-screening frequency of 1 in 117,000, recorded as an upper bound. Orphanet ORPHA:247525 (citrullinemia type I) carries no Epidemiology section - only definition and cross-references - so it cannot supply a disease-scoped row.

  '

treatments:
- name: Protein-restricted diet with essential amino acid supplementation
  description: 'Long-term dietary management centers on restriction of protein intake to reduce nitrogen load while providing essential amino acids via specialized formula. This is the cornerstone of chronic CTLN1 management. Liver transplantation eliminates the need for protein restriction.

    '
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:

- name: Genotype-to-phenotype correlation through residual ASS1 activity
  description: 'The severity spectrum of CTLN1 (classic neonatal, late-onset, pregnancy-triggered, asymptomatic) is determined by residual ASS1 enzyme activity. Pathogenic variants affect the citrulline-binding site, oligomerization helix stability, protein expression levels, or cause premature truncation. Variants with less than 2% of wild-type activity typically produce classic neonatal presentations, while hypomorphic variants may allow milder or late-onset disease. A biallelic expression system measuring residual activity across 71 individuals and 48 ASS1 variants established a quantitative threshold: residual activity of 8% or less predicts more frequent and more severe hyperammonemic events and lower cognitive function than activity above 8%, making residual activity a usable severity-stratification tool rather than only a retrospective explanation.

    '
  biological_processes:
  - preferred_term: protein tetramerization
    term:
      id: GO:0051262
      label: protein tetramerization
  genes:
  - preferred_term: ASS1
    term:
      id: hgnc:758
      label: ASS1
  molecular_functions:
  - preferred_term: argininosuccinate synthase activity
    term:
      id: GO:0004055
      label: argininosuccinate synthase activity
  evidence:
  - reference: PMID:39649700
    reference_title: "Visualization of argininosuccinate synthetase by in silico analysis: novel insights into citrullinemia type I disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: the C- terminal helix domain of the mutant protein structure, which was an important structure for ASS1 protein to form protein tetramers, was indeed more unstable than that of the wild-type protein structure.
    explanation: In silico analysis showing C-terminal helix instability disrupts ASS1 tetramerization.
  - reference: PMID:38927689
    reference_title: "Rare Pathogenic Variants in Pooled Whole-Exome Sequencing Data Suggest Hyperammonemia as a Possible Cause of Dementia Not Classified as Alzheimer's Disease or Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The p.Arg265Cys variant leads to enzyme deficiency, whereas p.Gly390Arg renders the enzyme inactive.
    explanation: Demonstrates that different ASS1 variants produce different degrees of enzyme impairment.
  - reference: PMID:31469252
    reference_title: Early prediction of phenotypic severity in Citrullinemia Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with 8% of residual enzymatic ASS1 activity or less had more frequent and more severe hyperammonemic events and lower cognitive function than those above 8%, highlighting that residual enzymatic ASS1 activity allows reliable severity prediction.

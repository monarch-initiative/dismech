    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LTx enabled metabolic stability without further need of protein restriction or nitrogen-scavenging therapy
    explanation: Confirms that protein restriction is standard pre-transplant medical management for UCDs.
  target_mechanisms:

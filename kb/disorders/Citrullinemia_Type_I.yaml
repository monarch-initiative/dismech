  description: >-
    Hyperammonemic episodes resemble those of the neonatal form but begin later
    in life for reasons that are not fully understood. Initial neurologic
    findings are often more subtle because of the older age at presentation -
    intense headache, scotomas, migraine-like episodes, ataxia, slurred speech,
    lethargy and drowsiness - which delays recognition. Serious raised
    intracranial pressure may still occur.
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The episodes of hyperammonemia are similar to those seen in the acute neonatal form, but the initial neurologic findings may be more subtle because of the older age of the affected individuals.
    explanation: GeneReviews characterises the late-onset form and the subtlety that delays its recognition.
- name: Pregnancy or postpartum onset
  classification: clinical_severity
  review_notes: >-
    No subtype_term is bound: MONDO has no class for the pregnancy/postpartum-onset
    presentation, whose only MONDO descendants of citrullinemia type I
    (MONDO:0008988) are the acute neonatal and adult-onset forms. This is an
    ontology gap, not a curation omission - do not substitute the adult-onset term,
    which does not carry the pregnancy trigger.
  description: >-
    Women with no prior symptoms may present with severe symptoms including acute
    hepatic decompensation during pregnancy or in the postpartum period. This is
    the presentation most likely to be missed, because the patient has no
    metabolic history and the differential in an obstetric setting rarely includes
    a urea cycle disorder.
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Women with onset of severe symptoms including acute hepatic decompensation during pregnancy or in the postpartum period have been reported.
    explanation: GeneReviews documents the pregnancy/postpartum-onset presentation as a distinct form.
  - reference: PMID:36859323
    reference_title: "Rare Adult-onset Citrullinemia Type 1 in the Postpartum Period: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A 23-year-old female presented four days postpartum to the emergency department (ED) obtunded and declined to the point of requiring intubation.
    explanation: Worked example of the postpartum presentation - undiagnosed until an acute obtunded presentation four days after delivery.
- name: Asymptomatic
  classification: clinical_severity
  review_notes: >-
    No subtype_term is bound: MONDO has no class for the asymptomatic
    biochemical phenotype. Ontology gap, not an omission.
  description: >-
    Biallelic ASS1 variants with sufficient residual activity may produce no
    symptoms and no hyperammonemia. Previously asymptomatic, non-pregnant
    individuals have remained asymptomatic to at least age ten, and may remain so
    for life. Relevant to newborn-screening interpretation: a positive screen does
    not by itself predict a symptomatic course.
  evidence:
  - reference: PMID:20301631
    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: previously asymptomatic and non-pregnant individuals have been described who remained asymptomatic up to at least age ten years, with the possibility that they could remain asymptomatic lifelong
    explanation: GeneReviews documents a genuinely asymptomatic form, important for screening interpretation.

    reference_title: Citrullinemia Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Infants with the acute neonatal form appear normal at birth.
    explanation: GeneReviews establishes the normal-at-birth then rapid-deterioration pattern of the classic form.

treatments:
- name: Six-week parenteral antimicrobial therapy
  description: >-
    Most published spinal pneumococcal infections were treated with about six
    weeks of parenteral antimicrobial therapy, with the specific drug selected
    from pneumococcal susceptibility results and infection severity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

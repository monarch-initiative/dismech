agent_life_cycle:
  description: >-
    S. pneumoniae is carried and transmitted from the human nasopharynx; discitis
    represents an invasive sterile-site complication after pneumococcal
    bloodstream invasion rather than a separate non-human reservoir cycle.
  hosts:
  - preferred_term: Homo sapiens
    role: Nasopharyngeal carrier and clinically affected host.
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Human nasopharyngeal carriage
    description: >-
      Pneumococci colonize the upper airway mucosa, which is the reservoir for
      person-to-person transmission and the source for later invasive disease.
    evidence:
    - reference: PMID:29599457
      reference_title: "Streptococcus pneumoniae: transmission, colonization and invasion."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        their main reservoir on the mucosal surface of the upper airways of
        carriers enables transmission
      explanation: >-
        Identifies upper-airway carriage as the pneumococcal reservoir.
  - name: Sterile-site pneumococcal invasion
    description: >-
      The same organism can pass from mucosal carriage into blood and sterile
      tissues during invasive disease, providing the systemic phase in which
      rare pneumococcal spinal infections occur.
    evidence:
    - reference: PMID:21734248
      reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        During invasive disease, pneumococcal epithelial adhesion is followed by
        bloodstream invasion
      explanation: >-
        Supports bloodstream invasion as the sterile-site transition upstream of
        hematogenous spinal seeding.
  notes: >-
    No vector or non-human reservoir is recorded: pneumococcal disease is
    maintained by human upper-airway carriage.
transmission:
- name: Person-to-person pneumococcal spread upstream of invasive disease
  description: >-
    Pneumococci spread between humans from the upper airway; discitis occurs only
    after the colonizing organism causes invasive sterile-site infection.
  evidence:
  - reference: PMID:29599457
    reference_title: "Streptococcus pneumoniae: transmission, colonization and invasion."
    supports: SUPPORT
    evidence_source: OTHER

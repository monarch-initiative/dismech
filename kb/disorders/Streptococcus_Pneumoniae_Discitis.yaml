progression:
- phase: Carriage to invasive bacteremia
  notes: >-
    Human nasopharyngeal carriage can precede bloodstream invasion in invasive
    pneumococcal disease, seeding distant sterile sites.
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During invasive disease, pneumococcal epithelial adhesion is followed by
      bloodstream invasion
    explanation: >-
      Supports a bacteremic phase upstream of distant pneumococcal infection.
- phase: Lumbar spondylodiscitis with epidural or paraspinal extension
  notes: >-
    Pneumococcal disc/endplate infection can extend to epidural or paraspinal
    sites, including psoas abscesses, and epidural abscess or phlegmon raises
    the risk of neurologic deficit and mortality.
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The majority of patients with neurologic deficits had spinal epidural
      abscess or phlegmon, and had a higher mortality.
    explanation: >-
      Links epidural abscess or phlegmon with neurologic deficit and higher
      mortality in the pooled human spinal pneumococcal infection review.
- phase: Multifocal invasive pneumococcal disease
  notes: >-
    Pneumococcal discitis may occur as part of multifocal invasive pneumococcal
    disease. Published cases pair vertebral discitis/spondylodiscitis with
    meningitis, pneumonia, or endocarditis, so those concurrent foci should be
    looked for rather than treated as separate mechanisms in this leaf entry.
  evidence:
  - reference: PMID:29721239
    reference_title: Meningitis, spondylodiscitis, pneumonia and septic shock with Streptococcus pneumoniae in a previously healthy woman with isolated IgG2-, IgG3-, IgA-deficiency and monoclonal gammopathy of undetermined significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 66 years old Caucasian woman with pneumococcal meningitis was treated
      and discharged after an uncomplicated course. Five months later she was
      readmitted with fever and right side abdominal pain and diagnosed with
      pneumococcal spondylodiscitis.
    explanation: >-
      Documents recurrent invasive pneumococcal disease with meningitis before
      pneumococcal spondylodiscitis.
  - reference: PMID:40490099
    reference_title: A case of infectious endocarditis and vertebral discitis caused by Streptococcus pneumoniae serotype 23A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we report a case of pneumococcal infectious endocarditis and
      vertebral discitis diagnosed concurrently.
    explanation: >-
      Documents vertebral discitis diagnosed concurrently with pneumococcal
      infective endocarditis.
diagnosis:
- name: Spine MRI for spondylodiscitis and abscess extent
  description: >-
    MRI is the preferred imaging modality for pyogenic spondylodiscitis because
    it detects disc/endplate infection and maps epidural or paraspinal soft-tissue
    extension.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:40429472
    reference_title: "Evaluation and Management of Pyogenic Spondylodiscitis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Magnetic resonance imaging (MRI) is the imaging modality of choice in the
      evaluation of PSD.
    explanation: >-
      Supports MRI as the preferred imaging test for pyogenic spondylodiscitis.
- name: Culture of blood or spinal biopsy material
  description: >-
    Pneumococcal discitis is diagnosed etiologically by culturing S. pneumoniae
    from blood, aspirate from the spinal infection site, or CT-guided vertebral
    biopsy when blood cultures are negative.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pneumococcus was most frequently isolated from material obtained at the
      site of the infection; blood cultures were a less common source.
    explanation: >-
      Identifies the two culture sources used to confirm pneumococcal spinal
      infection.
  - reference: PMID:29721239
    reference_title: Meningitis, spondylodiscitis, pneumonia and septic shock with Streptococcus pneumoniae in a previously healthy woman with isolated IgG2-, IgG3-, IgA-deficiency and monoclonal gammopathy of undetermined significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A CT guided biopsy of the involved spinal segment was performed and the
      bone biopsy showed growth of Streptococcus pneumoniae.
    explanation: >-
      Documents bone-biopsy culture confirmation in a pneumococcal
      spondylodiscitis case with negative blood cultures.
treatments:
- name: Susceptibility-guided antimicrobial therapy
  description: >-
    Most published spinal pneumococcal infections were treated with about six
    weeks of parenteral antimicrobial therapy, with the specific drug selected
    from pneumococcal susceptibility results and infection severity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
    - preferred_term: linezolid
      term:
        id: CHEBI:63607
        label: linezolid
    - preferred_term: levofloxacin
      term:
        id: CHEBI:63598
        label: levofloxacin
  target_mechanisms:
  - target: Pneumococcal Disc-Endplate Pyogenic Infection
    treatment_effect: INHIBITS
    description: >-
      Antimicrobials active against the isolate reduce pneumococcal viability in
      the infected disc-endplate complex.
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients were treated with 6 weeks of parenteral antimicrobials
    explanation: >-
      Review-level summary of antimicrobial duration in published spinal
      pneumococcal infections.
  - reference: PMID:38680822
    reference_title: "Disseminated Penicillin-Resistant Streptococcus pneumoniae Infection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vancomycin was continued at increasing doses up to 1,750 mg twice a day
      until hospital day 23
    explanation: >-
      Documents vancomycin use in a disseminated penicillin-resistant
      pneumococcal case with progressive lumbar spondylodiscitis.
  - reference: PMID:38680822
    reference_title: "Disseminated Penicillin-Resistant Streptococcus pneumoniae Infection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LZD 600 mg twice a day was administered until hospital day 35. In
      addition, oral LVFX 500 mg once a day was administered
    explanation: >-
      Documents linezolid and levofloxacin use in the same disseminated case.
- name: Lumbar laminectomy/fenestration for epidural compression
  description: >-
    Laminectomy/fenestration evacuated epidural pus and decompressed the thecal
    sac in a published disseminated penicillin-resistant pneumococcal lumbar
    spondylodiscitis case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Neural Element Compression
    treatment_effect: INHIBITS
    description: >-

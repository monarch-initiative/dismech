name: Streptococcus Pneumoniae Discitis
creation_date: "2026-11-14T11:25:00Z"
category: Infectious Disease
description: >-
  Streptococcus pneumoniae discitis is a rare invasive pneumococcal infection in
  which pneumococci involve the normally sterile vertebral endplate and
  intervertebral-disc space, producing pyogenic spondylodiscitis that presents
  with localized back pain, elevated inflammatory markers, and a broader
  spectrum that can include epidural or paraspinal abscesses.
disease_term:
  preferred_term: streptococcus pneumoniae discitis
  term:
    id: MONDO:8000003
    label: streptococcus pneumoniae discitis
parents:
- Bacterial arthritis
- Pneumococcal infection
synonyms:
- Pneumococcal discitis
- Pneumococcal spondylodiscitis
references:
- reference: PMID:24481748
  title: Spinal and paraspinal pneumococcal infections-a review.
  found_in:
  - Streptococcus_Pneumoniae_Discitis-literature-sweep-codex.md
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Spinal and paraspinal pneumococcal infections are rare and published cases
      include vertebral osteomyelitis, epidural abscess, and paraspinal abscess.
    supporting_text: >-
      Spinal and paraspinal infections caused by Streptococcus pneumoniae remain
      a rare event.
  - statement: >-
      Localized back pain with elevated inflammatory markers is nearly universal
      among reported spinal pneumococcal infection cases.
    supporting_text: >-
      persistent localized back pain with an elevation in inflammatory markers
      was almost universal.
  - statement: >-
      The lumbar spine was the most common spinal region involved in the pooled
      pneumococcal spinal and paraspinal infection review.
    supporting_text: The lumbar spine was the most commonly involved.
- reference: PMID:38680822
  title: "Disseminated Penicillin-Resistant Streptococcus pneumoniae Infection: A Case Report."
  found_in:
  - Streptococcus_Pneumoniae_Discitis-literature-sweep-codex.md
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Penicillin-resistant S. pneumoniae can produce lumbar spondylodiscitis as
      part of disseminated invasive pneumococcal disease with multiple abscesses.
    supporting_text: >-
      an adult male with SCJ septic arthritis, lumbar spondylodiscitis, and
      multiple abscesses
- reference: PMID:21734248
  title: Pathogenesis and pathophysiology of pneumococcal meningitis.
  found_in:
  - Streptococcus_Pneumoniae_Discitis-literature-sweep-codex.md
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Pneumococcal mucosal adherence can be followed by bloodstream invasion,
      providing a bacteremic phase upstream of disseminated sterile-site
      infection.
    supporting_text: >-
      During invasive disease, pneumococcal epithelial adhesion is followed by
      bloodstream invasion and activation of the complement and coagulation
      systems.
- reference: PMID:29599457
  title: "Streptococcus pneumoniae: transmission, colonization and invasion."
  found_in:
  - Streptococcus_Pneumoniae_Discitis-literature-sweep-codex.md
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      S. pneumoniae has an obligate human carriage phase in the upper-airway
      mucosa, from which pneumococci can transmit and sometimes invade sterile
      sites.
    supporting_text: >-
      their main reservoir on the mucosal surface of the upper airways of
      carriers enables transmission
- reference: PMID:40429472
  title: "Evaluation and Management of Pyogenic Spondylodiscitis: A Review."
  found_in:
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Pyogenic spondylodiscitis risk contexts include older age, diabetes,
      immunocompromise, end-stage renal disease, liver disease, alcoholism,
      obesity, recent invasive spine procedures, and intravenous drug use.
    supporting_text: >-
      Some conditions that increase the risk of PSD include older age, diabetes,
      immunocompromised states, end-stage renal disease, liver disease,
      alcoholism, obesity, recent invasive spine procedures, and intravenous drug
      abuse.
  - statement: >-
      MRI, blood cultures, and image-guided aspiration/biopsy are central tools
      for diagnosing and microbiologically confirming pyogenic spondylodiscitis.
    supporting_text: >-
      Magnetic resonance imaging (MRI) is the imaging modality of choice in the
      evaluation of PSD.
  - statement: >-
      Epidural abscess, phlegmon, or infected disc tissue can compress neural
      elements and produce neurological deficits in pyogenic spondylodiscitis.
    supporting_text: >-
      Compression of the neural elements may cause neurological deficits from the
      associated abscess, phlegmon, infected intervertebral disc, spinal
      deformity/instability, and bony fragments in the setting of a pathological
      fracture due to the infection.
- reference: PMID:29721239
  title: Meningitis, spondylodiscitis, pneumonia and septic shock with Streptococcus pneumoniae in a previously healthy woman with isolated IgG2-, IgG3-, IgA-deficiency and monoclonal gammopathy of undetermined significance.
  found_in:
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Published invasive pneumococcal disease can include spondylodiscitis with
      prior meningitis and later pneumonias, and recurrent unusual pneumococcal
      disease should prompt evaluation for occult immune deficiency.
    supporting_text: >-
      Streptococcus pneumoniae is a common pathogen, but pneumococcal meningitis
      followed by pneumococcal spondylodiscitis has been described rarely.
  - statement: >-
      CT-guided bone biopsy can confirm pneumococcal spondylodiscitis when blood
      cultures are negative.
    supporting_text: >-
      A CT guided biopsy of the involved spinal segment was performed and the
      bone biopsy showed growth of Streptococcus pneumoniae.
- reference: PMID:40490099
  title: A case of infectious endocarditis and vertebral discitis caused by Streptococcus pneumoniae serotype 23A.
  found_in:
  - Streptococcus_Pneumoniae_Discitis-deep-research-codex.md
  findings:
  - statement: >-
      Pneumococcal vertebral discitis has been diagnosed concurrently with
      pneumococcal infectious endocarditis.
    supporting_text: >-
      Herein, we report a case of pneumococcal infectious endocarditis and
      vertebral discitis diagnosed concurrently.
notes: >-
  Lump/split decision: this entry keeps the MONDO:8000003 pneumococcal discitis
  leaf separate from the open broad Infectious_Discitis stub and from the
  existing Pneumococcal Pneumonia and Pneumococcal Meningitis entries. The
  pneumococcal entry is an organism/site subtype of invasive pneumococcal
  disease, and its disc-space, vertebral, and epidural/paraspinal abscess
  mechanisms match Staphylococcus_Discitis more closely than they match the
  lung- or meninges-localized pneumococcal entries.

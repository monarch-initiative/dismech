prevalence:
- population: Published spinal and paraspinal pneumococcal infections, through 2013
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2014 review combined two institutional cases with 50 published cases of
    spinal pneumococcal infection; it included vertebral osteomyelitis, spinal
    epidural abscess, and paraspinal abscess rather than pneumococcal discitis
    alone.
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We present two cases from our institution, discuss the pathophysiology, and
      present a literature review of an additional 50 cases
    explanation: >-
      Provides a cases-in-literature count for the broader spinal pneumococcal
      infection spectrum containing discitis/spondylodiscitis.
pathophysiology:
- name: Pneumococcal Bloodstream Invasion
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Colonizing pneumococci invade the bloodstream during invasive pneumococcal
    disease, creating systemic bacteremia that can disseminate pneumococci to
    multiple sterile sites.
  downstream:
  - target: Disseminated Pneumococcal Lumbar Disc Involvement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Systemic bacteremia and disseminated abscesses transmit pneumococci to
      lumbar disc tissue.
    description: >-
      Bloodstream invasion is the systemic phase upstream of disseminated
      pneumococcal abscesses and lumbar disc involvement.
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During invasive disease, pneumococcal epithelial adhesion is followed by
      bloodstream invasion
    explanation: >-
      Establishes pneumococcal bloodstream invasion as an invasive-disease phase.
- name: Disseminated Pneumococcal Lumbar Disc Involvement
  biological_scale: TISSUE
  description: >-
    During disseminated invasive pneumococcal infection, S. pneumoniae can
    involve lumbar disc/endplate tissue either directly from systemic bacteremia
    or through nearby abscesses; the available case report does not resolve
    those alternatives.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: bony vertebral centrum
    term:
      id: UBERON:0001075
      label: bony vertebral centrum
  downstream:
  - target: Pneumococcal Disc-Endplate Pyogenic Infection
    causal_link_type: DIRECT
    description: >-
      Pneumococci involving the disc/endplate region produce local
      spondylodiscitis.
  evidence:
  - reference: PMID:38680822
    reference_title: "Disseminated Penicillin-Resistant Streptococcus pneumoniae Infection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abscesses formed throughout the body as a result of systemic bacteremia,
      and the mechanism is assumed to be that S. pneumoniae was transmitted to
      the SCJ and lumbar discs either through these abscesses or directly from
      the systemic bacteremia
    explanation: >-
      The case report discusses both direct systemic bacteremia and extension
      through disseminated abscesses as possible routes into lumbar discs.
- name: Pneumococcal Disc-Endplate Pyogenic Infection
  biological_scale: TISSUE
  description: >-
    Local pneumococcal growth inflames the disc/endplate complex and adjacent
    vertebrae, manifesting as spondylodiscitis or vertebral osteomyelitis.
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  - preferred_term: bony vertebral centrum
    term:
      id: UBERON:0001075
      label: bony vertebral centrum
  downstream:
  - target: Back Pain
    causal_link_type: DIRECT
    description: Local disc and vertebral inflammation produces focal back pain.
  - target: Elevated C-reactive protein
    causal_link_type: DIRECT
    description: Pyogenic spinal infection raises systemic inflammatory markers.
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      persistent localized back pain with an elevation in inflammatory markers
      was almost universal
    explanation: >-
      Supports local pain and systemic inflammation as core clinical consequences
      of spinal pneumococcal infection.

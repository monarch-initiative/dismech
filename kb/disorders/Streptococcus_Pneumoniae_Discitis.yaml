prevalence:
- population: Published spinal and paraspinal pneumococcal infections, through 2013
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2014 review combined two institutional cases with 50 published cases of
    spinal pneumococcal infection; it included vertebral osteomyelitis, spinal
    epidural abscess, and paraspinal abscess rather than pneumococcal discitis
    alone.
  evidence:
  - reference: PMID:24481748
    reference_title: Spinal and paraspinal pneumococcal infections-a review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We present two cases from our institution, discuss the pathophysiology, and
      present a literature review of an additional 50 cases
    explanation: >-
      Provides a cases-in-literature count for the broader spinal pneumococcal
      infection spectrum containing discitis/spondylodiscitis.

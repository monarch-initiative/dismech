      Most patients were treated with 6 weeks of parenteral antimicrobials
    explanation: >-
      Review-level summary of antimicrobial duration in published spinal
      pneumococcal infections.
- name: Lumbar laminectomy/fenestration in progressive disseminated PRSP spondylodiscitis
  description: >-
    Laminectomy/fenestration decompressed progressive lumbar spondylodiscitis in
    a published disseminated penicillin-resistant pneumococcal infection case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pneumococcal Disc-Endplate Pyogenic Infection
    treatment_effect: INHIBITS
    description: >-
      Lumbar laminectomy/fenestration can decompress a progressive
      spondylodiscitis focus in the reported disseminated PRSP case.
  evidence:
  - reference: PMID:38680822
    reference_title: "Disseminated Penicillin-Resistant Streptococcus pneumoniae Infection: A Case Report."

progression:
- phase: Infancy to early childhood
  notes: >-
    Presentation is with short stature and difficulty walking, typically between 2
    and 4 years of age, with progressive lower-limb deformity noted from around age
    2 to 4.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had difficulty walking at an early age (2−4 years) and short stature as the
      presenting symptoms.
    explanation: Establishes the typical age and mode of clinical presentation.
- phase: Childhood onwards
  notes: >-
    The vertebral and epimetaphyseal changes worsen with age, which is what makes
    the dysplasia "progressive"; walking distance becomes limited by pain.
  evidence:
  - reference: PMID:38562122

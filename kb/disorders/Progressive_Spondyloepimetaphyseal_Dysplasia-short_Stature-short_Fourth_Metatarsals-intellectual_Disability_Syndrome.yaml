      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        RSPRY1, a secreted protein with RING and SPRY domains, has been implicated in
        bone development, yet its exact role remains to be determined.
      explanation: >-
        The authors themselves state that the role of RSPRY1 in bone remains
        undetermined, so this edge is curated as indirect with unknown intermediates.
- name: Disrupted Endochondral Ossification at the Growth Plate
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Convergence node: impaired endochondral bone formation at the vertebral,
    epiphyseal and metaphyseal growth plates. This is the tissue-level lesion
    implied by the radiographic phenotype — small and cone-shaped epiphyses,
    metaphyseal cupping and fraying, platyspondyly, coxa vara and genu valgum —
    and by RSPRY1 expression in osteoblasts and periosteal cells during primary
    endochondral ossification. It is curated as PROVISIONAL because it is inferred
    from expression and radiology rather than measured in human or model growth
    plate tissue.
  cell_types:

experimental_models:
- name: RSPRY1-knockout and RSPRY1/SMAD3 double-knockout dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  culture_system: 2D monolayer dermal fibroblast culture
  cell_source: >-
    Dermal fibroblasts from two SEMDFA patients with homozygous RSPRY1 mutations,
    plus CRISPR-Cas9/RNP-engineered RSPRY1 knockout, SMAD3 knockout and
    RSPRY1+SMAD3 double-knockout lines.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:39940902
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  description: >-
    The only functional model system published for RSPRY1 to date. Transcriptomics
    on patient fibroblasts identified TGF-beta regulation of the ECM as the
    dominant dysregulated pathway; CRISPR knockout lines were then used to show
    that the resulting hypermotility is SMAD3-dependent and that the pathway is
    constitutively active. It is a 2D dermal fibroblast system, not a
    skeletal-lineage or whole-organism model, so it does not reproduce the
    dysplasia itself.
  findings:
  - statement: >-
      456 genes were downregulated and 545 upregulated in patient versus control
      fibroblasts.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A comparison of dermal fibroblast samples from two SEMDFA patients with
        homozygous RSPRY1 mutations versus controls showed there were 456 genes with a
        decreased expression and 545 genes with an increased expression
      explanation: Reports the differential-expression counts.
  - statement: >-
      TGF-beta regulation of the extracellular matrix was the most strongly enriched
      pathway.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The pathway enrichment analysis of DEGs showed there were several
        significantly enriched pathways, with TGF-β regulation of the ECM pathway
        being the most prominent.
      explanation: Reports the pathway-enrichment ranking.
  - statement: SMAD2, SMAD3 and JUNB were the most enriched transcription factors.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This analysis showed that SMAD2, SMAD3, and JUNB were the most significantly
        enriched TFs
      explanation: Reports the transcription-factor enrichment result.
  - statement: >-
      RSPRY1 knockout cells closed a scratch wound faster than controls, an effect
      abolished by concurrent SMAD3 knockout.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional wound healing assays showed that RSPRY1 knockout fibroblasts

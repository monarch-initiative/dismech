name: Progressive Spondyloepimetaphyseal Dysplasia-short Stature-short Fourth Metatarsals-intellectual Disability Syndrome
creation_date: "2026-08-20T07:30:00Z"
category: Mendelian
description: >-
  An ultra-rare autosomal recessive skeletal dysplasia syndrome caused by
  biallelic loss-of-function or destabilizing missense variants in RSPRY1
  (16q13), first delineated by Faden, Alkuraya and colleagues in 2015 in a
  consanguineous Saudi family and therefore also known as spondyloepimetaphyseal
  dysplasia, Faden-Alkuraya type (SEMDFA, OMIM #616723). The core phenotype is a
  progressive spondyloepimetaphyseal dysplasia — mild spondylar dysplasia with
  platyspondyly, epimetaphyseal dysplasia of the long bones with coxa vara and
  genu valgum, and cono-brachydactyly — combined with severe short stature,
  characteristic facial dysmorphism, short fourth metatarsals, and intellectual
  disability, with craniosynostosis in a substantial subset. RSPRY1 encodes a
  576-amino-acid RING- and B30.2/SPRY-domain protein whose physiological
  function was unknown at the time of gene discovery; it localizes strongly to
  murine embryonic osteoblasts and periosteal cells during primary endochondral
  ossification. Transcriptomic and CRISPR-knockout work in patient-derived
  dermal fibroblasts subsequently showed that RSPRY1 deficiency produces
  constitutive, SMAD3-dependent overactivation of TGF-beta signalling with
  enrichment of extracellular-matrix pathways, positioning RSPRY1 as an upstream
  restraint on TGF-beta-driven ECM regulation. Fewer than ~15 molecularly
  confirmed individuals have been reported, from consanguineous families in
  Saudi Arabia, Peru, Turkey and India.

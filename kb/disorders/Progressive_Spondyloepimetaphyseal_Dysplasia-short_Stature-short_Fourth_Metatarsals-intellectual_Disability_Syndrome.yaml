    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a clinically recognizable autosomal-recessive disorder in four
      affected siblings from a consanguineous Saudi family, comprising progressive
      spondyloepimetaphyseal dysplasia, short stature, facial dysmorphism, short
      fourth metatarsals, and intellectual disability.
    explanation: >-

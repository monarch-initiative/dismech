discussions:
- discussion_id: fibroblast_to_growth_plate_extrapolation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Endochondral Ossification at the Growth Plate
  prompt: >-
    Does constitutive TGF-beta/SMAD3 activation, demonstrated in patient-derived
    dermal fibroblasts, actually occur in growth-plate chondrocytes and osteoblasts
    — the cells whose failure produces the spondyloepimetaphyseal phenotype?
  rationale: >-
    The entire mechanistic account of this disorder rests on a 2D dermal fibroblast
    system: transcriptomics from two patients plus CRISPR knockout lines. Dermal
    fibroblasts are not a skeletal lineage, and TGF-beta signalling in cartilage
    and bone is strongly context-dependent — the same pathway can be
    growth-promoting or growth-suppressing depending on cell type and
    differentiation stage. The clinical lesion is at the vertebral, epiphyseal and
    metaphyseal growth plates, where no measurement has been made. The mismatch is
    not that the fibroblast result is doubtful, but that its translation to the
    affected tissue is untested, which is why the growth-plate node is curated as
    PROVISIONAL rather than ESTABLISHED.
  proposed_experiments:
  - experiment_id: exp_skeletal_lineage_tgfbeta
    name: iPSC-derived chondrocyte and osteoblast TGF-beta pathway assay
    description: >-
      Differentiate patient-derived or RSPRY1-knockout iPSCs into chondrocytes and
      osteoblasts and test whether constitutive SMAD2/3 phosphorylation and the blunted
      response to exogenous TGF-beta are reproduced in the skeletal lineage.
  - experiment_id: exp_conditional_rspry1_mouse
    name: Chondrocyte/osteoblast-conditional Rspry1 knockout mouse
    description: >-
      Generate a conditional Rspry1 knockout mouse targeting the chondrocyte and
      osteoblast lineages and determine whether a spondyloepimetaphyseal phenotype
      develops, with SMAD2/3 readouts in growth-plate tissue.
  - experiment_id: exp_growth_plate_tissue_assay
    name: Direct TGF-beta pathway assay on patient growth-plate tissue
    description: >-
      Assay TGF-beta pathway activity directly in growth-plate or periosteal tissue
      obtained at orthopedic surgery from an affected individual.
- discussion_id: rspry1_ubiquitination_substrate
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of RSPRY1 Restraint on TGF-beta/SMAD Signalling
  prompt: >-
    Does RSPRY1 restrain TGF-beta signalling by ubiquitinating a pathway component,
    and if so which one?
  rationale: >-
    The proposed brake on TGF-beta signalling is attributed to RSPRY1's C3HC4-type
    RING finger domain, which in other proteins confers E3 ubiquitin ligase
    activity. No RSPRY1 ubiquitination substrate has been identified, and no direct
    ligase assay has been published. Without it, "RSPRY1 ubiquitinates a TGF-beta
    pathway component" is a domain-based inference rather than a measured
    mechanism, and the intervening step between gene loss and SMAD3-dependent
    hypermotility remains unfilled. This also matters therapeutically: the
    substrate would be the actual node any intervention would have to address.
  proposed_experiments:
  - experiment_id: exp_rspry1_interactome
    name: RING-domain-dependent RSPRY1 interactome by AP-MS
    description: >-
      Affinity-purification mass spectrometry or proximity labelling in
      RSPRY1-expressing cells to identify RING-domain-dependent interactors within the
      TGF-beta pathway.
  - experiment_id: exp_rspry1_ubiquitination_assay
    name: In vitro RSPRY1 ubiquitination assay, wild type versus p.Cys551Tyr
    description: >-
      In vitro ubiquitination assay with recombinant RSPRY1, testing wild type against
      the RING-domain p.Cys551Tyr variant on candidate SMAD and receptor substrates.
- discussion_id: rspry1_subcellular_localization
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#RSPRY1 Biallelic Loss of Function
  prompt: >-
    Is RSPRY1 a secreted, extracellular-acting protein or a cytoplasmic one?
  rationale: >-
    The two most recent primary sources disagree. The 2025 mechanistic study
    describes RSPRY1 as "a secreted protein with RING and SPRY domains", consistent
    with BioGRID/UniProt annotation, and builds an extracellular-matrix-facing model
    on that basis. The 2024 clinical report instead states, citing the original
    characterization of the protein, that RSPRY1 is a glycoprotein present in the
    cytoplasm of skeletal muscle cells. The two are not reconcilable as stated, and
    the answer changes whether RSPRY1 acts on ECM components extracellularly or on
    intracellular signalling intermediates — the ubiquitin-ligase model requires the
    latter. No dedicated localization study of RSPRY1 has been published.
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RSPRY1, a secreted protein with RING and SPRY domains, has been implicated in
      bone development, yet its exact role remains to be determined.
    explanation: States the secreted-protein position.
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RSPRY1 protein is a glycoprotein present in the cytoplasm of skeletal muscle
      cells.
    explanation: States the cytoplasmic position, contradicting the secreted annotation.
  proposed_experiments:
  - experiment_id: exp_rspry1_localization
    name: Subcellular localization and secretion assay for endogenous RSPRY1
    description: >-
      Subcellular fractionation and immunofluorescence of endogenous RSPRY1 in
      osteoblasts, chondrocytes and fibroblasts, with conditioned-medium immunoblotting
      to test for secretion.
- discussion_id: no_animal_model_of_the_dysplasia
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Spondyloepimetaphyseal Skeletal Dysplasia
  prompt: >-
    Can the spondyloepimetaphyseal dysplasia be recapitulated in an animal model?
  rationale: >-
    No Rspry1 knockout animal with a published skeletal phenotype exists. The only
    in vivo data are wild-type murine expression localization from the 2015 gene
    discovery paper, which shows where RSPRY1 is present but not what its absence
    does. Without a model that reproduces the dysplasia, the causal chain from gene
    loss to growth-plate failure cannot be tested in a whole organism, and no
    preclinical platform exists for the TGF-beta-directed therapeutic hypothesis the
    2025 study raises. Targeted Rspry1 knockout alleles are catalogued in the
    KOMP/IMPC mouse resources, so the reagents exist; what is missing is a published
    skeletal phenotype from them.
  proposed_experiments:
  - experiment_id: exp_rspry1_knockout_mouse_skeleton
    name: Constitutive and conditional Rspry1 knockout mouse skeletal phenotyping
    description: >-
      Generate a constitutive and a chondrocyte/osteoblast-conditional Rspry1 knockout
      mouse and phenotype the axial skeleton, growth plates and cranial sutures by
      micro-CT and histology across postnatal development.
  - experiment_id: exp_zebrafish_rspry1
    name: Zebrafish rspry1 loss-of-function cartilage and craniofacial screen
    description: >-
      Assess zebrafish rspry1 loss of function as a rapid screen for cartilage and
      craniofacial patterning defects.
- discussion_id: tgfbeta_directed_therapy_untested
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of RSPRY1 Restraint on TGF-beta/SMAD Signalling
  prompt: >-
    Could pharmacological attenuation of TGF-beta signalling modify the skeletal
    phenotype in RSPRY1-related spondyloepimetaphyseal dysplasia?
  rationale: >-
    If RSPRY1 loss causes constitutive TGF-beta/SMAD3 activation, TGF-beta pathway
    modulation is a mechanistically motivated target, and the authors of the 2025
    study raise it explicitly. Nothing beyond that has been done: no compound has
    been tested in RSPRY1-deficient cells, no animal model exists in which to test
    one, and the analogy to TGF-beta-directed strategies in other connective-tissue
    disorders is inference from a shared pathway, not from a shared lesion. This is
    recorded as a hypothesis so it is not mistaken for a therapy; no treatment entry
    asserts it.
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      An improvement in our understanding of the molecular roles of RSPRY1 might
      yield novel therapeutic strategies that target TGF-β signaling in patients with
      SEMD and other skeletal dysplasias.
    explanation: >-
      The authors frame TGF-beta targeting as a prospective strategy contingent on
      further mechanistic work, not as an established one.
- discussion_id: intellectual_disability_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Intellectual Disability
  prompt: >-
    Why does biallelic RSPRY1 loss cause intellectual disability — is there a direct
    neuronal requirement for RSPRY1, or is the cognitive phenotype secondary?
  rationale: >-
    Intellectual disability is one of the four features named in the syndrome's own
    title and was present in every patient of the largest cohort, yet nothing in the
    published mechanism addresses it. The entire molecular account — constitutive
    TGF-beta/SMAD3 activation and ECM dysregulation — was developed in dermal
    fibroblasts and framed around skeletal biology. Orphanet records asymmetry of the
    cerebral hemispheres and mild thinning of the corpus callosum on brain imaging,
    which suggests a structural developmental substrate rather than a purely
    secondary effect, but no study has examined RSPRY1 in neural tissue. Until this
    is addressed the pathograph has no edge from the molecular lesion to the
    neurodevelopmental phenotype, and that absence is deliberate rather than an
    oversight.
  proposed_experiments:
  - experiment_id: exp_rspry1_neural_expression
    name: RSPRY1 expression and requirement in developing human neural tissue
    description: >-
      Characterize RSPRY1 expression across human fetal brain single-cell atlases and
      in iPSC-derived cortical neurons and organoids, and test whether RSPRY1
      knockout perturbs neuronal differentiation, migration or TGF-beta/SMAD
      signalling in that lineage.
  - experiment_id: exp_neuroimaging_case_series
    name: Systematic neuroimaging and cognitive phenotyping case series
    description: >-
      Collect standardized brain MRI and formal cognitive assessment across all
      identifiable RSPRY1 patients to establish whether the corpus callosum and
      hemispheric-asymmetry findings are consistent, and whether cognitive severity
      tracks with allele type or with craniosynostosis.
notes: >-
  No GeneReviews chapter exists for RSPRY1-related spondyloepimetaphyseal dysplasia
  or for the Faden-Alkuraya type; PubMed searches for "RSPRY1 GeneReviews" and
  "Faden-Alkuraya GeneReviews" return no results, so no GeneReviews phenotype
  baseline was available for this entry. ClinGen has not published a gene-disease
  validity classification for RSPRY1, so no CGGV record is cited. The entry is not
  linked to the aortopathy_tgfbeta_dysregulation module: that module models
  TGF-beta dysregulation downstream of a fibrillin/receptor lesion in the aortic
  wall, whereas the RSPRY1 mechanism is a putative ubiquitin-ligase-mediated brake
  acting in skeletal tissue, and forcing conformance would assert a shared chain
  that the evidence does not support.

      platyspondyly, mild scoliosis, lumbar lordosis, small carpals bones, short
      femoral neck, short fourth metatarsal bone, wind-swept deformity, small
      epiphyses, metaphyseal cupping, and fraying in both siblings.
    explanation: Enumerates the radiographic findings that define the diagnosis.

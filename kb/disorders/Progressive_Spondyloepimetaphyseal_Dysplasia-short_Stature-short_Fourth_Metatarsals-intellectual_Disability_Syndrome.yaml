  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, we detect strong RSPRY1 protein localization in murine embryonic
      osteoblasts and periosteal cells during primary endochondral ossification,
      consistent with a role in bone development.
    explanation: >-
      Places RSPRY1 in the cell types that build endochondral bone, supporting a
      growth-plate locus of disease.
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The radiographic evaluation indicated a copper-beaten appearance of a skull,
      platyspondyly, mild scoliosis, lumbar lordosis, small carpals bones, short
      femoral neck, short fourth metatarsal bone, wind-swept deformity, small
      epiphyses, metaphyseal cupping, and fraying in both siblings.
    explanation: >-
      The epiphyseal and metaphyseal radiographic signs are the clinical readout of
      disturbed endochondral ossification.
  downstream:
  - target: Progressive Spondyloepimetaphyseal Skeletal Dysplasia
    causal_link_type: DIRECT
    description: >-
      Cumulative growth-plate failure produces the progressive vertebral and
      epimetaphyseal deformity and the disproportionate short stature.
    evidence:
    - reference: PMID:38562122
      reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The severity of vertebral deformities increases with age.

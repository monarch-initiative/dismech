  - target: Premature Cranial Suture Fusion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Craniosynostosis is part of the recognizable phenotype in a substantial subset
      of patients, but no mechanism connecting RSPRY1 loss to suture biology has been
      reported.
    evidence:
    - reference: PMID:30063090
      reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The skeletal hallmarks include (a) mild spondylar dysplasia, (b) epimetaphyseal
        dysplasia of the long bones associated with coxa vara and genu valgum, (c)
        brachymesophalangy with cone-shaped epiphyses, and (d) craniosynostosis.
      explanation: >-
        Lists craniosynostosis alongside the epimetaphyseal changes as a skeletal
        hallmark of the syndrome.
- name: Premature Cranial Suture Fusion
  role: consequence
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Premature fusion of one or more cranial sutures, reported in all five patients
    of the two Turkish families and emphasized as a defining feature in the
    delineation paper, although the same cohort noted that all but one patient
    were normocephalic. Later series describe craniosynostosis in only a subset,
    and the syndrome's OMIM title carries the qualifier "with or without
    craniosynostosis". No mechanistic link to RSPRY1 or to TGF-beta signalling in
    the suture has been investigated.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  evidence:
  - reference: PMID:30063090
    reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the previously reported clinical findings, all patients except one are
      normocephalic, and all share the clinical findings including craniosynostosis,
      varying degrees of intellectual disability, facial dysmorphism, and skeletal
      findings including pes planus, prominent heels, and pectus deformity.
    explanation: >-
      Reports craniosynostosis in every patient of this cohort while noting that head
      circumference was normal in all but one.
  notes: >-
    The apparent tension between "craniosynostosis in all patients" here and "in some
    cases craniosynostosis" in later reviews reflects small-cohort ascertainment; no
    frequency band is asserted on the corresponding phenotype entry.
- name: Progressive Spondyloepimetaphyseal Skeletal Dysplasia
  role: outcome
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The integrated organism-level outcome: a progressive dysplasia of vertebrae,
    epiphyses and metaphyses producing severe disproportionate short stature,
    lower-limb deformity with pain on walking, cono-brachydactyly with short fourth
    metatarsals, and a recognizable facial gestalt, accompanied by intellectual
    disability.
  evidence:
  - reference: PMID:30063090
    reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we provide further evidence that Spondyloepimetaphyseal dysplasia Faden-Alkuraya
      type is a RSPRY1-associated skeletal dysplasia with a distinctive phenotype
      composed of spondyloepimetaphyseal dysplasia, cono-brachydactyly, and
      craniosynostosis along with recognizable facial features and intellectual
      disability.
    explanation: Summarizes the composite clinical outcome that defines the entity.
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had difficulty walking at an early age (2−4 years) and short stature as the
      presenting symptoms.
    explanation: >-
      Documents the functional impact and typical age of presentation of the skeletal
      outcome.

genetic:
- name: RSPRY1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RSPRY1
    term:
      id: hgnc:29420
      label: RSPRY1
  notes: >-
    RSPRY1 (Ring finger and SPRY domain containing 1) at 16q13 is the sole
    established cause of this syndrome. It encodes a 576-amino-acid protein with a
    B30.2/SPRY protein-interaction domain (residues 359-479) and a C3HC4-type RING
    finger domain (residues 526-565). Every reported family carries biallelic
    variants: homozygous frameshift alleles triggering nonsense-mediated decay, a
    homozygous canonical splice-site allele, and homozygous missense alleles
    including one in the RING domain. All reported probands come from
    consanguineous unions, and no compound heterozygote has yet been described.
  features: >-
    Autosomal recessive and biallelic; frameshift, canonical splice-site and missense
    alleles all reported; consanguinity in every reported family.
  review_notes: >-
    The cDNA and protein designations of the two index alleles from Faden et al. 2015
    (a homozygous 1-bp duplication in the Saudi family and a homozygous missense
    variant in the Peruvian proband) appear only in that paper's full text, which is
    not open access; the PMC record refuses full-text download and the cached
    reference is abstract-only. Both deep-research providers reported specific
    designations for them, sourced to OMIM #616723, but these could not be verified
    against a cached primary source and are therefore deliberately not curated as
    Variant records here. A curator with journal access should add them.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined autozygome/exome analysis identified a homozygous frameshift mutation
      in RSPRY1 with resulting nonsense-mediated decay.
    explanation: Establishes RSPRY1 as the causative gene in the index family.
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a gene-centric "matchmaking" system, we were able to identify a Peruvian
      simplex case subject whose phenotype is strikingly similar to the original Saudi
      family and whose exome sequencing had revealed a likely pathogenic homozygous
      missense variant in the same gene.
    explanation: >-
      A second, unrelated family with a homozygous missense allele in the same gene
      provided the independent replication needed to establish causality.
  - reference: PMID:39706863
    reference_title: Genetic and allelic heterogeneity in 248 Indians with skeletal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We expand the phenotypic and genotypic spectrum of rarely reported conditions
      (RAB33B, TRIP11, NEPRO, RPL13, COL27A1, PTHR1, EXOC6B, PRKACA, FUZ and RSPRY1)
      and noted novel gene-disease relationships for PISD, BNIP1, TONSL, CCN2 and
      SCUBE3 related skeletal dysplasia.
    explanation: >-
      A 248-patient skeletal dysplasia cohort places RSPRY1 among the rarely reported
      but established skeletal dysplasia genes.

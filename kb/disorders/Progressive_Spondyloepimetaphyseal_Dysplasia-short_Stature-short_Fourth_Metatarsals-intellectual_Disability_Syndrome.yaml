pathophysiology:
- name: RSPRY1 Biallelic Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic RSPRY1 variants abolish or destabilize a 576-amino-acid protein
    carrying a B30.2/SPRY protein-interaction domain and a C3HC4-type RING finger
    domain of the kind that typically confers E3 ubiquitin ligase activity.
    Reported alleles include frameshift variants that trigger nonsense-mediated
    decay of the transcript, a canonical splice-site variant, and missense
    substitutions in the RING domain. Because both null and missense alleles
    produce the same recognizable syndrome, the mechanism is reduction or absence
    of RSPRY1 activity rather than a gain-of-function or dominant-negative effect.
  genes:
  - preferred_term: RSPRY1
    term:
      id: hgnc:29420
      label: RSPRY1
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant transcript
    modifier: INCREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  genetic_context:
    gene:
      preferred_term: RSPRY1
      term:
        id: hgnc:29420
        label: RSPRY1
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous frameshift, canonical splice-site, and RING-domain missense alleles
      have each been reported in consanguineous families.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined autozygome/exome analysis identified a homozygous frameshift mutation
      in RSPRY1 with resulting nonsense-mediated decay.
    explanation: >-
      Establishes a null allele acting through nonsense-mediated decay as the
      founding molecular lesion.
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RSPRY1 encodes a hypothetical RING and SPRY domain-containing protein of
      unknown physiological function.
    explanation: >-
      Records the domain architecture that underpins the inferred ubiquitin-ligase
      function, and that the function was undefined at gene discovery.
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It has B.30/SPRY domain (359−479 aa) and C3HC4-type RING finger domain (526−565 aa).
    explanation: Specifies the two functional domains of the 576-residue RSPRY1 protein.
  downstream:
  - target: Loss of RSPRY1 Restraint on TGF-beta/SMAD Signalling
    causal_link_type: DIRECT
    description: >-
      Loss of functional RSPRY1 removes an upstream brake on TGF-beta signal
      transduction in patient cells.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptome analysis of fibroblasts from patients with homozygous RSPRY1
        mutations showed there was significant enrichment of transforming growth
        factor beta (TGF-β) signaling and ECM-related pathways.
      explanation: >-
        Patient-derived fibroblasts carrying biallelic RSPRY1 mutations show
        transcriptomic enrichment of TGF-beta signalling, linking the genetic lesion
        to pathway dysregulation.
  - target: Disrupted Endochondral Ossification at the Growth Plate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      RSPRY1 is expressed in osteoblasts and periosteal cells during primary
      endochondral ossification, so its loss is expected to act cell-autonomously in
      the developing skeleton; the intervening steps in bone have not been defined.
    evidence:
    - reference: PMID:26365341
      reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, we detect strong RSPRY1 protein localization in murine embryonic
        osteoblasts and periosteal cells during primary endochondral ossification,
        consistent with a role in bone development.
      explanation: >-
        Expression localization in the relevant cell types during endochondral
        ossification supports, but does not by itself demonstrate, a direct skeletal
        role.
- name: Loss of RSPRY1 Restraint on TGF-beta/SMAD Signalling
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In dermal fibroblasts from SEMDFA patients with homozygous RSPRY1 mutations,
    TGF-beta regulation of the extracellular matrix is the single most strongly
    enriched pathway, with SMAD2, SMAD3 and JUNB the most enriched transcription
    factors. RSPRY1-knockout fibroblasts respond only weakly to exogenous
    TGF-beta, indicating that the pathway is already constitutively active rather
    than merely sensitized. The proposed mechanism is that RSPRY1 normally
    restrains TGF-beta/SMAD signalling — plausibly through ubiquitination of
    pathway components given its RING domain — and that biallelic loss removes
    that brake. The ubiquitination step itself remains inferred rather than
    demonstrated, which is why this node is curated as PROVISIONAL.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: TGF-beta receptor signalling
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  - preferred_term: SMAD protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The observed limited response to exogenous TGF-β in RSPRY1-deficient cells
      indicated that there was constitutive pathway activation.
    explanation: >-
      A blunted response to added ligand is the direct experimental basis for calling
      the pathway constitutively active in RSPRY1-deficient cells.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Essential genes enriched in this pathway included SMAD3, COL1A1, WISP1, and
      RUNX2, highlighting the central role of TGF-β signaling in ECM regulation and
      remodeling.
    explanation: >-
      Names the SMAD3/COL1A1/RUNX2 effectors that connect the dysregulated pathway to
      matrix and osteoblast biology.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This analysis showed that SMAD2, SMAD3, and JUNB were the most significantly
      enriched TFs
    explanation: >-
      Identifies the SMAD transcription factors as the dominant regulatory nodes
      downstream of RSPRY1 loss.
  downstream:
  - target: Extracellular Matrix Dysregulation and Increased Cell Motility
    causal_link_type: DIRECT
    description: >-
      The motility phenotype of RSPRY1-knockout fibroblasts is abolished by
      concurrent SMAD3 knockout, establishing that it is transduced through SMAD3.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional wound healing assays showed that RSPRY1 knockout fibroblasts
        exhibited enhanced motility, a phenotype that was abrogated in RSPRY1 + SMAD3
        double knockout fibroblasts, highlighting the SMAD3-dependence of RSPRY1's
        effects.
      explanation: >-
        The double-knockout rescue is the epistasis experiment that places SMAD3
        downstream of RSPRY1 loss.
- name: Extracellular Matrix Dysregulation and Increased Cell Motility
  role: effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Differential expression in RSPRY1-mutant patient fibroblasts is concentrated in
    extracellular-matrix organization, cartilage development and chondrocyte
    differentiation, and RSPRY1-knockout cells close a scratch wound faster than
    controls. The cellular readout available today is fibroblast motility and
    matrix gene expression; the corresponding measurements have not been made in
    growth-plate chondrocytes or osteoblasts.
  cell_types:
  - preferred_term: patient-derived dermal fibroblast

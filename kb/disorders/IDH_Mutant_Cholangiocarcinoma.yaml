biochemical:
- name: Serum 2-HG
  notes: >-
    D-2-hydroxyglutarate can be measured in plasma and tumor tissue by liquid
    chromatography-tandem mass spectrometry and serves as a pharmacodynamic biomarker
    for mutant IDH1 inhibition, decreasing to near-normal levels during ivosidenib therapy.
  evidence:
  - reference: DOI:10.1007/s00280-023-04633-5
    reference_title: "Pharmacokinetics/pharmacodynamics of ivosidenib in advanced IDH1-mutant cholangiocarcinoma: findings from the phase III ClarIDHy study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma ivosidenib and D-2-hydroxyglutarate (2-HG) were measured using liquid chromatography-tandem mass spectrometry."
    explanation: Confirms plasma 2-HG quantification as a pharmacodynamic biomarker in IDH1-mutant cholangiocarcinoma.
- name: Tumor PD-L1 Expression and Mutational Burden
  presence: Decreased relative to IDH-wild-type intrahepatic cholangiocarcinoma
  notes: >-
    IDH1/2-altered intrahepatic cholangiocarcinomas exhibit significantly lower rates
    of PD-L1 positivity, high tumor mutational burden (>=10 mut/Mb), and microsatellite
    instability than IDH-wild-type tumors, resulting in an immunologically non-inflamed
    profile relevant to frontline chemoimmunotherapy response.
  evidence:
  - reference: DOI:10.1200/po.23.00544
    reference_title: "Comprehensive Immunogenomic Profiling of <i>IDH1-</i>/<i>2</i>-Altered Cholangiocarcinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSI-High ( P = .009), TMB ≥10 mut/Mb ( P < .0001), and PD-L1 positivity were lower in IDH1/2+ versus IDHwt iCCA."
    explanation: Demonstrates lower MSI-High, high TMB, and PD-L1 positivity in IDH1/2-mutated intrahepatic cholangiocarcinoma compared with IDH-wild-type disease.
  - reference: DOI:10.1200/po.23.00544
    reference_title: "Comprehensive Immunogenomic Profiling of <i>IDH1-</i>/<i>2</i>-Altered Cholangiocarcinoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IDH1-/2-mutated tumors appear immunologically cold without gLOH."
    explanation: Summarizes the immunologically cold biomarker profile of IDH1/2-mutated intrahepatic cholangiocarcinoma.
- name: CA 19-9
  notes: >-
    Carbohydrate antigen 19-9 is often elevated in cholangiocarcinoma but is not specific.
    Useful for monitoring treatment response when elevated at baseline.
- name: Liver Function Tests
  notes: >-
    Elevated alkaline phosphatase, GGT, and bilirubin may indicate biliary obstruction.
    Transaminases may be elevated with hepatic involvement.

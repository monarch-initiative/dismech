- name: 2-HG Accumulation and Dioxygenase Inhibition
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases"
  description: >-
    D-2-hydroxyglutarate is structurally homologous to 2-oxoglutarate (alpha-ketoglutarate)
    and competitively occupies the catalytic site of 2-oxoglutarate-dependent dioxygenases,
    including TET family 5-methylcytosine hydroxylases and Jumonji-domain histone
    demethylases, driving widespread epigenetic and metabolic reprogramming.
  evidence:
  - reference: PMID:24569570
    reference_title: "Mutations of isocitrate dehydrogenase 1 and 2 in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations result in elevated levels of an oncometabolite, 2-hydroxyglutarate, which is associated with higher DNA CpG methylation and altered histone methylation that accompany a block in cellular differentiation."
    explanation: "Links mutant IDH1/2-mediated 2-hydroxyglutarate accumulation directly to impaired DNA and histone demethylation and differentiation arrest in intrahepatic cholangiocarcinoma."
  - reference: PMID:21251613
    reference_title: "Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we demonstrate that 2-HG is a competitive inhibitor of multiple α-KG-dependent dioxygenases, including histone demethylases and the TET family of 5-methlycytosine (5mC) hydroxylases."
    explanation: "Demonstrates the direct biochemical competitive inhibition of TET DNA hydroxylases and Jumonji histone demethylases by 2-HG."

pathophysiology:
- name: IDH1/2 Neomorphic Mutation
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
  description: >-
    Somatic hotspot mutations in IDH1 (codon R132, predominantly R132C) or IDH2 (codons R172
    or R140) in intrahepatic cholangiocytes confer a neomorphic NADPH-dependent enzymatic
    activity that reduces alpha-ketoglutarate (2-oxoglutarate) to the oncometabolite
    D-2-hydroxyglutarate (2-HG), which accumulates to high concentrations in tumor tissue
    and plasma.
  evidence:
  - reference: PMID:25536104
    reference_title: "Mutation profiling in cholangiocarcinoma: prognostic and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Commonly occurring GAs in intrahepatic CCA were TP53 (35%), KRAS (24%), ARID1A (20%), IDH1 (18%), MCL1 (16%) and PBRM1 (11%)."
    explanation: "Next-generation sequencing of intrahepatic cholangiocarcinoma identifies recurrent somatic IDH1 mutations in 18% of cases."
  - reference: PMID:24569570
    reference_title: "Mutations of isocitrate dehydrogenase 1 and 2 in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hotspot mutations in IDH isoforms 1 or 2 occur in approximately 15% of intrahepatic cholangiocarcinomas."
    explanation: "Establishes somatic IDH1 and IDH2 hotspot mutations as a recurrent initiating driver event in intrahepatic cholangiocarcinoma."

treatments:
- name: Ivosidenib
  description: >-
    Selective oral small-molecule inhibitor of mutant IDH1 approved for adult patients
    with previously treated, locally advanced or metastatic IDH1-mutant cholangiocarcinoma
    based on improved progression-free survival over placebo in the phase 3 ClarIDHy trial,
    lowering plasma 2-HG concentrations to near-healthy levels.
  notes: >-
    Ivosidenib selectively inhibits mutant IDH1 (codon R132 variants) and does not target
    IDH2-mutant cholangiocarcinomas (~4% of iCCA), even though both isoforms share the
    upstream IDH1/2 Neomorphic Mutation lesion node in the pathograph.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ivosidenib
      term:
        id: CHEBI:145430
        label: ivosidenib
  target_mechanisms:
  - target: IDH1/2 Neomorphic Mutation
    treatment_effect: INHIBITS
    description: Selectively inhibits mutant IDH1 (not IDH2) catalytic conversion of alpha-ketoglutarate to D-2-hydroxyglutarate.
    evidence:
    - reference: DOI:10.1007/s00280-023-04633-5
      reference_title: "Pharmacokinetics/pharmacodynamics of ivosidenib in advanced IDH1-mutant cholangiocarcinoma: findings from the phase III ClarIDHy study"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An average 2-HG inhibition of 75.0% was observed at steady state. No plasma 2-HG decreases were seen with placebo."
      explanation: "Demonstrates direct pharmacodynamic inhibition of mutant IDH1 neomorphic 2-HG production in ClarIDHy."
  - target: 2-HG Accumulation and Dioxygenase Inhibition
    treatment_effect: INHIBITS
    description: Depletes plasma and intratumoral 2-HG in IDH1-mutant tumors, relieving competitive inhibition of 2-oxoglutarate-dependent dioxygenases.
    evidence:
    - reference: DOI:10.1007/s00280-023-04633-5
      reference_title: "Pharmacokinetics/pharmacodynamics of ivosidenib in advanced IDH1-mutant cholangiocarcinoma: findings from the phase III ClarIDHy study"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma 2-HG reductions were observed in ivosidenib-treated patients irrespective of best overall response (progressive disease, or partial response and stable disease)."
      explanation: "Confirms sustained suppression of 2-HG accumulation in ivosidenib-treated IDH1-mutant cholangiocarcinoma."
  evidence:

animal_models:
- name: Alb-Cre; LSL-IDH2-R172K; KrasG12D mouse
  species: Mouse
  genotype: Alb-Cre; LSL-IDH2-R172K; LSL-KrasG12D
  publication: PMID:25043045
  description: >-
    Genetically engineered mouse model co-expressing mutant human IDH2-R172K and
    endogenous KrasG12D in the liver under Alb-Cre control, driving hepatic oval/progenitor
    cell expansion, biliary intraepithelial neoplasia-like precursor lesions, and
    fully penetrant CK19-positive metastatic intrahepatic cholangiocarcinoma with
    elevated intratumoral 2-HG.
  evidence:
  - reference: PMID:25043045
    reference_title: "Mutant IDH inhibits HNF-4α to block hepatocyte differentiation and promote biliary cancer."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intercrossing LSL-R172K, KrasG12D and Alb-Cre mice revealed dramatic oncogenic cooperation, with 6/6 Alb-Cre; LSL-R172K; KrasG12D animals developing poor body condition and palpable liver tumours between 33 and 58 weeks (mean 47.3 weeks; Fig. 4a). Multifocal liver masses with splenic invasion and peritoneal metastases were observed and demonstrated to be IHCC by histopathologic analysis, CK19 staining, and lack of reactivity for the hepatocyte/HCC marker, Hep Par1 (Fig. 4b)."
    explanation: "Establishes the Alb-Cre; LSL-R172K; KrasG12D mouse model and its 100% penetrant CK19+ intrahepatic cholangiocarcinoma phenotype."
  modeled_mechanisms:
  - target: Hepatocyte Differentiation Block and Biliary Progenitor Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Recapitulates 2-HG-driven HNF4alpha suppression, impaired hepatocyte lineage
      restoration, and Sox9+/CK19+ progenitor and BilIN-like expansion in vivo.
    limitations: >-
      Requires cooperating KrasG12D activation for invasive tumor progression and uses
      the IDH2-R172K allele rather than the more common human IDH1-R132C allele.
    evidence:
    - reference: PMID:25043045
      reference_title: "Mutant IDH inhibits HNF-4α to block hepatocyte differentiation and promote biliary cancer."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Notably, in all Alb-Cre; LSL-R172K; KrasG12D mice analyzed (N=6), the adjacent liver exhibited oval cell expansion and a graded series of BilIN-like lesions, which were Sox9+/CK19+, and expressed the IDH2-R172K transgene at physiologic levels (Fig. 4c, Extended Data Fig. 9a–b, 10a)."
      explanation: "Demonstrates progenitor expansion and graded biliary precursor lesions preceding invasive iCCA in the mouse model."
  - target: Intrahepatic Tumor Mass Growth
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Produces multifocal CK19+ intrahepatic cholangiocarcinoma liver masses with
      human-comparable intratumoral 2-HG levels and peritoneal metastasis.
    evidence:
    - reference: PMID:25043045
      reference_title: "Mutant IDH inhibits HNF-4α to block hepatocyte differentiation and promote biliary cancer."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Multifocal liver masses with splenic invasion and peritoneal metastases were observed and demonstrated to be IHCC by histopathologic analysis, CK19 staining, and lack of reactivity for the hepatocyte/HCC marker, Hep Par1 (Fig. 4b)."
      explanation: "Confirms histopathologically verified multifocal intrahepatic cholangiocarcinoma mass formation in vivo."

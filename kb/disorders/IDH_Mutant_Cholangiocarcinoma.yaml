- name: Hepatocyte Differentiation Block and Biliary Progenitor Expansion
  biological_scale: CELLULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Oncometabolite-Driven Tumorigenesis with Differentiation Block"
  description: >-
    2-HG-driven DNA and histone methylation changes epigenetically silence HNF4A, a
    master transcriptional regulator of hepatocyte identity and quiescence, blocking
    bipotential hepatic progenitors from undergoing hepatocyte differentiation and
    maintaining an expanded biliary progenitor pool primed for malignant transformation.
  evidence:
  - reference: PMID:25043045
    reference_title: "Mutant IDH inhibits HNF-4α to block hepatocyte differentiation and promote biliary cancer."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that mutant IDH blocks liver progenitor cells from undergoing hepatocyte differentiation through the production of 2HG and suppression of HNF-4α, a master regulator of hepatocyte identity and quiescence."
    explanation: "Establishes HNF-4alpha suppression by mutant IDH and 2-HG as the cellular mechanism blocking hepatocyte differentiation in liver progenitors."
  - reference: PMID:25043045
    reference_title: "Mutant IDH inhibits HNF-4α to block hepatocyte differentiation and promote biliary cancer."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, IDH and Kras mutations, genetic alterations that co-exist in a subset of human IHCCs, cooperate to drive the expansion of liver progenitor cells, development of premalignant biliary lesions, and progression to metastatic IHCC."
    explanation: "Demonstrates expansion of liver progenitor cells and progression to premalignant biliary lesions and intrahepatic cholangiocarcinoma."
  - reference: PMID:24569570
    reference_title: "Mutations of isocitrate dehydrogenase 1 and 2 in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations result in elevated levels of an oncometabolite, 2-hydroxyglutarate, which is associated with higher DNA CpG methylation and altered histone methylation that accompany a block in cellular differentiation."
    explanation: "Confirms the cellular differentiation block associated with 2-HG-driven DNA and histone methylation in human IDH-mutant intrahepatic cholangiocarcinoma."

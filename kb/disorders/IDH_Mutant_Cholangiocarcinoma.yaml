- name: Histone Methylation Alterations
  biological_scale: CELLULAR
  description: >-
    2-HG inhibits Jumonji domain-containing histone demethylases, leading to accumulation
    of repressive histone methylation marks (including H3K9me3 and H3K27me3) and
    cooperating with frequent co-occurring chromatin-remodeling alterations (such as ARID1A
    and BAP1 inactivation) to lock cells in an undifferentiated chromatin state.
  evidence:
  - reference: PMID:24569570
    reference_title: "Mutations of isocitrate dehydrogenase 1 and 2 in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations result in elevated levels of an oncometabolite, 2-hydroxyglutarate, which is associated with higher DNA CpG methylation and altered histone methylation that accompany a block in cellular differentiation."
    explanation: "Supports altered histone methylation accompanying the differentiation block in IDH-mutant intrahepatic cholangiocarcinoma."
  - reference: PMID:36528236
    reference_title: "Charting co-mutation patterns associated with actionable drivers in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a negative selection of RTK/RAS/ERK pathway co-alterations, and an enrichment of epigenetic modifiers such as ARID1A and BAP1 in patients with IDH1/2 and FGFR2 alterations."
    explanation: "Shows selective enrichment of cooperating chromatin-modifier mutations (ARID1A, BAP1) in IDH1/2-mutant intrahepatic cholangiocarcinoma."

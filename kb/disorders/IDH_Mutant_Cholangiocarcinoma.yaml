- name: Epigenetic Dysregulation and DNA Hypermethylation
  biological_scale: CELLULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation"
  description: >-
    2-HG inhibition of TET enzymes impairs conversion of 5-methylcytosine to
    5-hydroxymethylcytosine, establishing CpG island hypermethylation across cholangiocyte
    differentiation regulators and antigen-presentation genes, which silences lineage
    maturation and contributes to an immunologically non-inflamed tumor microenvironment.
  evidence:
  - reference: PMID:24569570
    reference_title: "Mutations of isocitrate dehydrogenase 1 and 2 in intrahepatic cholangiocarcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations result in elevated levels of an oncometabolite, 2-hydroxyglutarate, which is associated with higher DNA CpG methylation and altered histone methylation that accompany a block in cellular differentiation."
    explanation: "Confirms elevated DNA CpG methylation downstream of 2-hydroxyglutarate in IDH-mutant intrahepatic cholangiocarcinoma."
  - reference: DOI:10.1159/000534443
    reference_title: "Genetic/Epigenetic Alteration and Tumor Immune Microenvironment in Intrahepatic Cholangiocarcinoma: Transforming the Immune Microenvironment with Molecular-Targeted Agents"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cause an increase in DNA methylation, are associated with the downregulation and hypermethylation of antigen processing and presentation machinery, which may contribute to the establishment of a non-inflamed TME."
    explanation: "Documents that IDH1/2-driven DNA hypermethylation also silences antigen processing and presentation genes, shaping a non-inflamed tumor immune microenvironment."

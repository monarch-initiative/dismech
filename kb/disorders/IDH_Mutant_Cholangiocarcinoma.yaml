    snippet: "KRAS and PIK3CA mutations were more frequent in the large duct type, while IDH1/2 mutations and FGFR2 fusions were more common in the small duct type."
    explanation: "Confirms small-duct intrahepatic cholangiocarcinoma tissue pathology for IDH1/2-mutant tumors."

name: Enterobiasis
creation_date: '2026-11-14T00:00:00Z'
category: Infectious Disease
description: >-
  Enterobiasis, or pinworm infection, is a fecal-orally transmitted intestinal
  nematode infection caused by Enterobius vermicularis. Ingested infective eggs
  hatch in the small intestine, adult worms establish in the cecum and adjacent
  large intestine, and gravid females migrate to the perianal skin at night to
  deposit adhesive eggs that become infective within hours. That nocturnal
  perianal oviposition drives the characteristic perianal pruritus,
  scratch-mediated contamination of hands and fomites, autoinfection, and
  recurrent household spread.
disease_term:
  preferred_term: enterobiasis
  term:
    id: MONDO:0005746
    label: enterobiasis
parents:
- Helminth infection
- Gastrointestinal infection
synonyms:
- Pinworm infection
- Oxyuriasis
- Enterobius vermicularis infection
- Threadworm infection
notes: >-
  Lump/split decision: this entry covers the named human disease caused by the
  human pinworm E. vermicularis. It is separate from Dientamoebiasis, where
  E. vermicularis eggs are only recorded as a proposed Dientamoeba fragilis
  carriage vehicle, and from broader Rhabditida infectious disease and
  helminthiasis concepts that group many nematode diseases with different
  reservoirs and mechanisms.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Due to its widespread prevalence in children—and occasional occurrence
        in adults—symptomatic pinworm infection (enterobiasis) remains a
        relevant problem in Germany, despite the fact that infection rates have
        declined since the reunification.
      explanation: >-
        Places enterobiasis as a pinworm infection affecting humans, supporting
        classification under infectious diseases.
definitions:
- name: Enterobius vermicularis intestinal infection
  definition_type: CASE_DEFINITION
  description: >-
    Human enterobiasis is infection with E. vermicularis, a directly
    transmitted pinworm whose infective eggs are ingested and whose adult worms
    live in the gastrointestinal lumen.
  scope: Clinical root for human pinworm infection
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      E. vermicularis has a simple direct life cycle (Figure) (13), which takes
      place in the gastrointestinal lumen. Infection occurs via oral ingestion
      of infective eggs—the larvae contained in the eggs become infective within
      as little as 4–6 h following oviposition.
    explanation: >-
      Defines the entry scope as a direct gastrointestinal pinworm infection
      acquired by ingesting infective eggs.
infectious_agent:
- name: Enterobius vermicularis
  infectious_agent_term:
    preferred_term: Enterobius vermicularis
    term:
      id: NCBITaxon:51028
      label: Enterobius vermicularis
  description: Human pinworm whose adult females deposit eggs on perianal skin.
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Enterobiasis (pinworm infection), caused by the nematode Enterobius
      vermicularis, remains among the most common helminth infections worldwide
      and disproportionately affects children and caregivers in households and
      institutional settings.
    explanation: >-
      Names E. vermicularis as the nematode causing enterobiasis.
agent_life_cycle:
  description: >-
    E. vermicularis completes a direct life cycle in humans. Infective eggs are
    ingested orally; larvae hatch in the small intestine and mature into adult
    worms in the cecum, appendix, or ascending colon; after copulation, gravid
    females actively migrate to the anal canal and deposit adhesive eggs on
    perianal tissue at night. The eggs mature outside the gut and can seed
    autoinfection, contact infection, or fomite-mediated household spread.
  hosts:
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: definitive host and only natural reservoir of clinical importance
  life_cycle_stages:
  - name: Infective embryonated egg on perianal skin or fomites
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Eggs deposited on perianal tissue become infective within hours outside
      the gastrointestinal lumen and then infect a new or the same host when
      ingested.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Infection occurs via oral ingestion of infective eggs—the larvae
        contained in the eggs become infective within as little as 4–6 h
        following oviposition.
      explanation: >-
        Identifies the egg as the infective stage and gives the short interval
        from oviposition to infectivity.
  - name: Larval hatching and intestinal maturation
    description: >-
      Ingested eggs soften in the upper gastrointestinal tract, hatch in the
      small intestine, and the larvae molt twice before maturing into adult
      worms of the lower large intestine.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        After passing through the pylorus, the pinworm larvae hatch in the small
        intestine. After molting twice, the worms copulate and then migrate
        downwards to the large intestine, where they can be found in large
        numbers particularly in the cecum, appendix, or ascending colon.
      explanation: >-
        Supports larval hatching in the small intestine followed by maturation
        in the cecal and adjacent colonic lumen.
  - name: Gravid female adult migration and perianal oviposition
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      After copulation, gravid adult females migrate to the anal canal,
      especially at night, leave the anus, and fix eggs to perianal tissue with
      an adhesive matrix.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Oviposition occurs primarily while the host is resting, i.e.,
        predominantly at night while they sleep. It involves the females leaving
        the anus and fixing their eggs to tissue in the perianal area with an
        adhesive matrix.
      explanation: >-
        Describes the gravid adult female migration and egg-deposition stage
        that distinguishes enterobiasis clinically.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since E. vermicularis is a strictly human-pathogenic parasite, domestic
      pets do not play a role as natural reservoirs of infection.
    explanation: >-
      Supports recording humans as the only reservoir of clinical importance
      and omitting a non-human host or vector.
  notes: >-
    No non-human reservoir or arthropod vector is recorded. E. vermicularis is
    directly transmitted among humans, and domestic pets are not natural
    reservoirs of infection.
transmission:
- name: Fecal-oral egg ingestion, autoinfection, and fomite spread
  description: >-
    Adhesive E. vermicularis eggs are carried from nocturnally itchy perianal
    skin to hands, fingernails, toys, clothing, bedding, and other surfaces;
    oral ingestion of those infective eggs maintains autoinfection and
    person-to-person or fomite-mediated spread in households and classrooms.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The considerable potential for E. vermicularis transmission is explained
      by the tenacity and adhesive property of the eggs, which adhere
      particularly well to hands and under fingernails (16, 25), thereby easily
      maintaining the chain of infection (continuous exposure, contact
      infection, autoinfection).
    explanation: >-
      Connects adhesive eggs on hands and fingernails with autoinfection and
      contact spread.
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Following nocturnal oviposition in the perianal mucosa, eggs become
      infectious within hours and can persist on skin, clothing, bedding, and
      nearby surfaces for days, facilitating rapid spread through hand-to-mouth
      behavior ( 3 ).
    explanation: >-
      Supports fomite and hand-to-mouth spread after perianal egg deposition.
pathophysiology:
- name: Nocturnal perianal oviposition and itch-scratch contamination
  description: >-
    Gravid female pinworms leave the anus at night and attach adhesive eggs to
    perianal tissue. Their migration produces itch; scratching breaks worms and
    spreads eggs to hands, fingernails, underwear, bedding, and nearby surfaces,
    closing the autoinfection loop.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The migratory movements of the worms during this process often cause
      uncomfortable pruritus, as a result of which children in particular tend
      to relieve the itching by using their fingers to scratch the perianal
      region.
    explanation: >-
      Links female worm migration during oviposition to the perianal itching
      and scratching that drive symptoms and egg dispersal.
  downstream:
  - target: Perianal Pruritus
    causal_link_type: DIRECT
  - target: Sleep Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Perianal Pruritus
  category: Dermatologic
  description: >-
    Perianal itching is the main and characteristic symptom and is most
    prominent at night during female worm migration and egg deposition.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main symptom of infection is pronounced (peri-)anal pruritus, which
      occurs primarily at nighttime while the affected individual sleeps.
    explanation: >-
      Identifies nocturnal perianal pruritus as the main symptom of
      enterobiasis.
- name: Sleep Disturbance
  category: Neurologic
  description: Nocturnal itch can disrupt sleep in symptomatic infection.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Classic features include nocturnal perianal pruritus, sleep disturbance,
      and occasionally visible small white worms near the anus or in stool ( 3
      ).
    explanation: >-
      Lists sleep disturbance among the classic features of pinworm infection.
diagnosis:
- name: Early-morning perianal adhesive-tape microscopy
  description: >-
    Tape applied to the anal and perianal region before the first bowel movement
    or washing collects eggs that can be inspected microscopically; collecting
    specimens on three separate mornings markedly increases sensitivity.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since oviposition occurs on the anal folds, the worm eggs that are
      invisible to the naked eye can be swabbed using commercially available
      adhesive cellulose tape (“Scotch tape”) in the morning prior to defecation
      and before washing the genital area (Scotch tape test).
    explanation: >-
      Supports the perianal Scotch-tape sampling method.
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Microscopic detection of the characteristic worm eggs (Figure 3) confirms
      infection.
    explanation: >-
      Establishes microscopy of eggs on the tape preparation as confirmatory.
treatments:
- name: Two-dose mebendazole, albendazole, or pyrantel therapy
  description: >-
    Uncomplicated enterobiasis is treated with a single oral dose of an
    anthelmintic and repeat dosing 14 days later, usually with mebendazole,
    albendazole, or pyrantel pamoate, together with same-day household
    treatment and hygiene measures to prevent reinfection.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mebendazole
      term:
        id: CHEBI:6704
        label: mebendazole
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: pyrantel
      term:
        id: CHEBI:8654
        label: pyrantel
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In practice, three agents are used interchangeably with high clinical
      success when the schedule is respected and reinfection is prevented.
      Mebendazole is typically given as 100 mg orally once and repeated 2 weeks
      later; pyrantel pamoate is dosed at 11 mg/kg (to a maximum of 1 g) with
      the same two-week repetition and, in many settings, is available over the
      counter; albendazole is administered as 400 mg orally once on an empty
      stomach and repeated on Day 14 ( 3 ).
    explanation: >-
      Names mebendazole, pyrantel pamoate, and albendazole as interchangeable
      two-dose options for uncomplicated pinworm infection.
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The index case and all household members should be treated on the same
      day, regardless of symptoms.
    explanation: >-
      Supports synchronized same-day household treatment rather than treating
      the symptomatic person alone.
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the case of chronic recurrent infection, simultaneously treating all
      (including asymptomatic) members of a household (parents, siblings,
      grandparents, fellow occupants) has proved a successful approach.
    explanation: >-
      Supports treating household contacts together when recurrence is a
      concern.

  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In practice, three agents are used interchangeably with high clinical
      success when the schedule is respected and reinfection is prevented.
      Mebendazole is typically given as 100 mg orally once and repeated 2 weeks
      later; pyrantel pamoate is dosed at 11 mg/kg (to a maximum of 1 g) with
      the same two-week repetition and, in many settings, is available over the
      counter; albendazole is administered as 400 mg orally once on an empty
      stomach and repeated on Day 14 ( 3 ).
    explanation: >-
      Names mebendazole, pyrantel pamoate, and albendazole as interchangeable
      two-dose options for uncomplicated pinworm infection.

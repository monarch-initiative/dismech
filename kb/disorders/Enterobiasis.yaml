- name: Abnormal Vaginal Discharge
  category: Genitourinary
  description: >-
    Occasional vulvovaginal migration of female pinworms can produce
    vulvovaginitis with vaginal discharge.
  phenotype_term:
    preferred_term: Abnormal vaginal discharge
    term:
      id: HP:0034269
      label: Abnormal vaginal discharge
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Occasional migration to the vulva/vagina may cause vulvovaginitis,
      discharge, or dysuria in girls
    explanation: >-
      The practice-oriented review lists discharge alongside vulvovaginitis and
      dysuria as an occasional manifestation of ectopic vulvovaginal migration.
diagnosis:
- name: Early-morning perianal adhesive-tape microscopy
  description: >-
    Tape applied to the anal and perianal region before the first bowel movement
    or washing collects eggs that can be inspected microscopically; collecting
    specimens on three separate mornings markedly increases sensitivity.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since oviposition occurs on the anal folds, the worm eggs that are
      invisible to the naked eye can be swabbed using commercially available
      adhesive cellulose tape (“Scotch tape”) in the morning prior to defecation
      and before washing the genital area (Scotch tape test).
    explanation: >-
      Supports the perianal Scotch-tape sampling method.
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Microscopic detection of the characteristic worm eggs (Figure 3) confirms
      infection.
    explanation: >-
      Establishes microscopy of eggs on the tape preparation as confirmatory.
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This diagnostic technique should be performed on three different days in
      order to increase its sensitivity (from around 50% in the case of a
      one-off Scotch tape test to approximately 90% if performed on three
      separate days
    explanation: >-
      Supports the three-morning sampling schedule and the sensitivity gain
      relative to one tape test.
- name: Stool ova-and-parasite microscopy
  description: >-
    Routine stool microscopy is an insensitive test for E. vermicularis because
    pinworm eggs are deposited on perianal folds rather than reliably shed into
    stool.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Stool microscopy is not a helpful diagnostic tool, since the worm eggs are
      deposited outside the intestine.
    explanation: >-
      Explains why routine stool ova-and-parasite microscopy is insensitive for
      pinworm diagnosis.
treatments:
- name: Two-dose benzimidazole therapy
  description: >-
    Mebendazole or albendazole binds parasite beta-tubulin, inhibits tubulin
    polymerization, and depletes worm glycogen reserves. Both agents are
    adulticidal and ovicidal; standard therapy repeats a single dose to clear
    larvae emerging after the first dose.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mebendazole
      term:
        id: CHEBI:6704
        label: mebendazole
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
  target_mechanisms:
  - target: Adult Cecal and Colonic Colonization
  evidence:
  - reference: PMID:31064642

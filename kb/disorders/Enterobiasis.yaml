name: Enterobiasis
creation_date: '2026-11-14T00:00:00Z'
category: Infectious Disease
description: >-
  Enterobiasis, or pinworm infection, is a fecal-orally transmitted intestinal
  nematode infection caused by Enterobius vermicularis. Ingested infective eggs
  hatch in the small intestine, adult worms establish in the cecum and adjacent
  large intestine, and gravid females migrate to the perianal skin at night to
  deposit adhesive eggs that become infective within hours. That nocturnal
  perianal oviposition drives the characteristic perianal pruritus,
  scratch-mediated contamination of hands and fomites, autoinfection, and
  recurrent household spread.
disease_term:
  preferred_term: enterobiasis
  term:
    id: MONDO:0005746
    label: enterobiasis
parents:
- Helminth infection
- Gastrointestinal infection
synonyms:
- Pinworm infection
- Oxyuriasis
- Enterobius vermicularis infection
- Threadworm infection
notes: >-
  Lump/split decision: this entry covers the named human disease caused by the
  human pinworm E. vermicularis. It is separate from Dientamoebiasis, where
  E. vermicularis eggs are only recorded as a proposed Dientamoeba fragilis
  carriage vehicle, and from broader Rhabditida infectious disease and
  helminthiasis concepts that group many nematode diseases with different
  reservoirs and mechanisms.

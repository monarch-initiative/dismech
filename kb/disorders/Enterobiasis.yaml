definitions:
- name: Enterobius vermicularis intestinal infection
  definition_type: CASE_DEFINITION
  description: >-
    Human enterobiasis is infection with E. vermicularis, a directly
    transmitted pinworm whose infective eggs are ingested and whose adult worms
    live in the gastrointestinal lumen.
  scope: Clinical root for human pinworm infection
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      E. vermicularis has a simple direct life cycle (Figure) (13), which takes
      place in the gastrointestinal lumen. Infection occurs via oral ingestion
      of infective eggs—the larvae contained in the eggs become infective within
      as little as 4–6 h following oviposition.
    explanation: >-
      Defines the entry scope as a direct gastrointestinal pinworm infection
      acquired by ingesting infective eggs.
infectious_agent:
- name: Enterobius vermicularis
  infectious_agent_term:
    preferred_term: Enterobius vermicularis
    term:
      id: NCBITaxon:51028
      label: Enterobius vermicularis
  description: Human pinworm whose adult females deposit eggs on perianal skin.
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Enterobiasis (pinworm infection), caused by the nematode Enterobius
      vermicularis, remains among the most common helminth infections worldwide
      and disproportionately affects children and caregivers in households and
      institutional settings.
    explanation: >-
      Names E. vermicularis as the nematode causing enterobiasis.
agent_life_cycle:
  description: >-
    E. vermicularis completes a direct life cycle in humans. Infective eggs are
    ingested orally; larvae hatch in the small intestine and mature into adult
    worms in the cecum, appendix, or ascending colon; after copulation, gravid
    females actively migrate to the anal canal and deposit adhesive eggs on
    perianal tissue at night. The eggs mature outside the gut and can seed
    autoinfection, contact infection, or fomite-mediated household spread.
  hosts:
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: definitive host and only natural reservoir of clinical importance
  life_cycle_stages:
  - name: Infective embryonated egg on perianal skin or fomites
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Eggs deposited on perianal tissue become infective within hours outside
      the gastrointestinal lumen and then infect a new or the same host when
      ingested.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Infection occurs via oral ingestion of infective eggs—the larvae
        contained in the eggs become infective within as little as 4–6 h
        following oviposition.
      explanation: >-
        Identifies the egg as the infective stage and gives the short interval
        from oviposition to infectivity.
  - name: Larval hatching and intestinal maturation
    description: >-
      Ingested eggs soften in the upper gastrointestinal tract, hatch in the
      small intestine, and the larvae molt twice before maturing into adult
      worms of the lower large intestine.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        After passing through the pylorus, the pinworm larvae hatch in the small
        intestine. After molting twice, the worms copulate and then migrate
        downwards to the large intestine, where they can be found in large
        numbers particularly in the cecum, appendix, or ascending colon.
      explanation: >-
        Supports larval hatching in the small intestine followed by maturation
        in the cecal and adjacent colonic lumen.
  - name: Gravid female adult migration and perianal oviposition
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      After copulation, gravid adult females migrate to the anal canal,
      especially at night, leave the anus, and fix eggs to perianal tissue with
      an adhesive matrix.
    evidence:
    - reference: PMID:31064642
      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Oviposition occurs primarily while the host is resting, i.e.,
        predominantly at night while they sleep. It involves the females leaving
        the anus and fixing their eggs to tissue in the perianal area with an
        adhesive matrix.
      explanation: >-
        Describes the gravid adult female migration and egg-deposition stage
        that distinguishes enterobiasis clinically.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since E. vermicularis is a strictly human-pathogenic parasite, domestic
      pets do not play a role as natural reservoirs of infection.
    explanation: >-
      Supports recording humans as the only reservoir of clinical importance
      and omitting a non-human host or vector.
  notes: >-
    No non-human reservoir or arthropod vector is recorded. E. vermicularis is
    directly transmitted among humans, and domestic pets are not natural
    reservoirs of infection.
transmission:
- name: Fecal-oral egg ingestion, autoinfection, and fomite spread
  description: >-
    Adhesive E. vermicularis eggs are carried from nocturnally itchy perianal
    skin to hands, fingernails, toys, clothing, bedding, and other surfaces;
    oral ingestion of those infective eggs maintains autoinfection and
    person-to-person or fomite-mediated spread in households and classrooms.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The considerable potential for E. vermicularis transmission is explained
      by the tenacity and adhesive property of the eggs, which adhere
      particularly well to hands and under fingernails (16, 25), thereby easily
      maintaining the chain of infection (continuous exposure, contact
      infection, autoinfection).
    explanation: >-
      Connects adhesive eggs on hands and fingernails with autoinfection and
      contact spread.
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Following nocturnal oviposition in the perianal mucosa, eggs become
      infectious within hours and can persist on skin, clothing, bedding, and
      nearby surfaces for days, facilitating rapid spread through hand-to-mouth
      behavior ( 3 ).
    explanation: >-
      Supports fomite and hand-to-mouth spread after perianal egg deposition.
progression:
- phase: Oligosymptomatic or asymptomatic intestinal colonization
  notes: >-
    A large minority of infected people have few or no symptoms while adult
    worms remain in the intestinal lumen.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Approximately 40% of affected individuals are oligo- or asymptomatic
    explanation: >-
      Supports a minimally symptomatic or asymptomatic intestinal phase.
- phase: Nocturnal perianal oviposition with autoinfection loop
  notes: >-
    Symptomatic disease centers on nocturnal female migration and perianal egg
    deposition; scratching and ingestion of the adhesive eggs can maintain
    autoinfection and recurrent household spread.
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If autoinfection does not occur, pinworm infection is self-limiting due to
      the short life span of adult worms
    explanation: >-
      Supports a course in which persistence and recurrence depend on
      autoinfection rather than long survival of a single generation of adult
      worms.
pathophysiology:
- name: Adult Cecal and Colonic Colonization
  description: >-
    After larval hatching and two molts, adult E. vermicularis worms establish
    in the lower large intestine, especially the cecum, appendix, and ascending
    colon.
  biological_scale: ORGANISM
  downstream:
  - target: Nocturnal Female Migration and Perianal Oviposition
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      migrate downwards to the large intestine, where they can be found in large
      numbers particularly in the cecum, appendix, or ascending colon
    explanation: >-
      The pinworm life-cycle review localizes adult worms to the cecal and
      adjacent colonic lumen.
- name: Nocturnal Female Migration and Perianal Oviposition
  description: >-
    Gravid female pinworms actively migrate to the anal canal at night, leave
    the anus, and attach eggs to perianal tissue with an adhesive matrix.
  biological_scale: ORGANISM
  downstream:
  - target: Perianal Pruritus
    causal_link_type: DIRECT
  - target: Sleep Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nocturnal Enuresis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Diminished Daytime Concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Scratch-Mediated Egg Dispersal and Autoinfection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ectopic Vulvovaginal Pinworm Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oviposition occurs primarily while the host is resting, i.e.,
      predominantly at night while they sleep. It involves the females leaving
      the anus and fixing their eggs to tissue in the perianal area with an
      adhesive matrix.
    explanation: >-
      Supports the nocturnal female migration and egg-deposition step.
- name: Scratch-Mediated Egg Dispersal and Autoinfection
  description: >-
    Perianal scratching ruptures migrating females and moves adhesive eggs to
    hands, fingernails, underwear, bedding, and nearby surfaces, allowing
    anus-finger-mouth autoinfection and contact spread to maintain the chain of
    infection.
  biological_scale: ORGANISM
  downstream:
  - target: Adult Cecal and Colonic Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Perianal Dermatitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The disintegration of the worm cuticle caused by fingers and finger nails
      leads to a massive release and spreading of eggs into underwear and the
      surrounding area. The contaminated hands of the host play an important role
      in maintaining the chain of infection (autoinfection)
    explanation: >-
      Supports the link from pruritus-driven scratching to egg dispersal on
      textiles and contaminated hands that preserve autoinfection.
- name: Ectopic Vulvovaginal Pinworm Migration
  description: >-
    Female pinworms can occasionally migrate from the perianal region to the
    vulvovaginal or urethral region in girls, producing local irritation,
    discharge, or dysuria.
  biological_scale: ORGANISM
  downstream:
  - target: Dysuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Vaginal Discharge
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Occasional migration to the vulva/vagina may cause vulvovaginitis,
      discharge, or dysuria in girls
    explanation: >-
      Supports a rare ectopic female-genital migration branch that can cause
      dysuria or vulvovaginal symptoms.
phenotypes:
- name: Perianal Pruritus
  category: Dermatologic
  description: >-
    Perianal itching is the main and characteristic symptom and is most
    prominent at night during female worm migration and egg deposition.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main symptom of infection is pronounced (peri-)anal pruritus, which
      occurs primarily at nighttime while the affected individual sleeps.
    explanation: >-
      Identifies nocturnal perianal pruritus as the main symptom of
      enterobiasis.
- name: Sleep Disturbance
  category: Neurologic
  description: Nocturnal itch can disrupt sleep in symptomatic infection.
  phenotype_term:
    preferred_term: Sleep disturbance
    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Classic features include nocturnal perianal pruritus, sleep disturbance,
      and occasionally visible small white worms near the anus or in stool ( 3
      ).
    explanation: >-
      Lists sleep disturbance among the classic features of pinworm infection.
- name: Nocturnal Enuresis
  category: Genitourinary
  description: >-
    Bedwetting can accompany symptomatic childhood enterobiasis with nocturnal
    pruritus and sleep disturbance.
  phenotype_term:
    preferred_term: Nocturnal enuresis
    term:
      id: HP:0010677
      label: Enuresis nocturna
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This can lead to disturbed sleep, childhood enuresis (in up to 53% of
      cases) and impaired concentration during the day
    explanation: >-
      The clinical review lists enuresis among downstream effects of nocturnal
      perianal pruritus.
- name: Diminished Daytime Concentration
  category: Neurobehavioral
  description: >-
    Children with symptomatic nocturnal pruritus can have impaired daytime
    concentration.
  phenotype_term:
    preferred_term: Diminished ability to concentrate
    term:
      id: HP:0031987
      label: Diminished ability to concentrate
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This can lead to disturbed sleep, childhood enuresis (in up to 53% of
      cases) and impaired concentration during the day
    explanation: >-
      The clinical review lists impaired daytime concentration among downstream
      effects of nocturnal perianal pruritus.
- name: Perianal Dermatitis
  category: Dermatologic
  description: >-
    Scratching the itchy perianal region can produce excoriation with bacterial
    superinfection, anal dermatitis, perianal folliculitis, or abscess.
  phenotype_term:
    preferred_term: Perianal dermatitis
    term:
      id: HP:0011131
      label: Perianal dermatitis
  evidence:
  - reference: PMID:31064642
    reference_title: The Diagnosis and Treatment of Pinworm Infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scratching in the perianal region can cause ulceration (excoriation) that
      shows a tendency toward bacterial superinfection. Anal dermatitis,
      perianal folliculitis, or ischiorectal abscess may develop.
    explanation: >-
      Supports perianal excoriation, dermatitis, and bacterial superinfection as
      consequences of scratching the pruritic perianal region.
- name: Dysuria
  category: Genitourinary
  description: >-
    Occasional ectopic vulvovaginal pinworm migration in girls can produce local
    vulvovaginitis, discharge, or dysuria.
  phenotype_term:
    preferred_term: Dysuria
    term:
      id: HP:0100518
      label: Dysuria
  evidence:
  - reference: PMID:42267275
    reference_title: >-
      Pinworm (Enterobius vermicularis) in children and adults: a
      practice-oriented narrative review and household-school algorithm.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Occasional migration to the vulva/vagina may cause vulvovaginitis,
      discharge, or dysuria in girls
    explanation: >-
      The 2026 review records dysuria and vulvovaginal inflammation among

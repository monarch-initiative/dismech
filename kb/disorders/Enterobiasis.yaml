      reference_title: The Diagnosis and Treatment of Pinworm Infection.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Due to its widespread prevalence in children—and occasional occurrence
        in adults—symptomatic pinworm infection (enterobiasis) remains a
        relevant problem in Germany, despite the fact that infection rates have
        declined since the reunification.
      explanation: >-
        Places enterobiasis as a pinworm infection affecting humans, supporting

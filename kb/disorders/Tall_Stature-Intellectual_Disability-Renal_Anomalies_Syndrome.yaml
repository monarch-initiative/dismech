    snippet: "Herein, two new cases of Thauvin-Robinet-Faivre syndrome are reported with overgrowth, intellectual disability, typical dysmorphic signs in one dysplastic kidney, and a novel homozygous FIBP gene variant."
    explanation: Documents congenital renal dysplasia in biallelic FIBP deficiency.
  - reference: PMID:27183861
    reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
    supports: SUPPORT

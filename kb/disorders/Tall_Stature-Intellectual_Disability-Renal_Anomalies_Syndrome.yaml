name: Thauvin-Robinet-Faivre Syndrome
creation_date: "2026-04-23T00:00:00Z"
category: Mendelian
synonyms:
- Tall stature-intellectual disability-renal anomalies syndrome
- TROFAS
- FIBP-related syndromic overgrowth
description: >-
  Thauvin-Robinet-Faivre syndrome (TROFAS; OMIM 617107, ORPHA:500095) is an
  ultra-rare autosomal recessive multiple congenital anomaly and overgrowth
  syndrome caused by biallelic loss-of-function variants in FIBP on chromosome
  11q13.1, encoding the acidic fibroblast growth factor (FGF1) intracellular
  binding protein. Affected individuals present with prenatal and postnatal
  overgrowth (proportionate tall stature, macrocephaly, large hands and feet),
  global developmental delay and intellectual disability, characteristic facial
  dysmorphism, ocular anomalies including retinal coloboma, sensorineural
  hearing impairment, congenital cardiac malformations or conduction defects
  (ventricular septal defect, mitral valve prolapse, complete atrioventricular
  block), and a variable spectrum of congenital renal and urinary tract
  anomalies (renal dysplasia, multicystic kidney dysplasia, nephromegaly, renal
  malrotation, and bifid ureter) with predisposition to nephroblastoma (Wilms
  tumor). Patient-derived skin fibroblasts show degradation or conformational
  disruption of FIBP and increased proliferative capacity, linking altered
  intracellular FGF signaling to somatic overgrowth and embryonal tumor
  predisposition.

- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than ten genetically confirmed individuals have been reported across
    four publications: one proband in Thauvin-Robinet et al. 2016
    (PMID:26660953), three siblings in Akawi et al. 2016 (PMID:27183861), two
    siblings in Kilic and Kosukcu 2024 (PMID:37876348), and an additional case
    with literature review in Cosentino et al. 2026
    (DOI:10.1007/s13353-025-00984-2).
  evidence:
  - reference: PMID:37876348
    reference_title: New cases of recently described Thauvin-Robinet-Faivre syndrome with a novel homozygous FIBP gene variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only four patients have been reported with this disorder. Herein, two new cases of Thauvin-Robinet-Faivre syndrome are reported with overgrowth, intellectual disability, typical dysmorphic signs in one dysplastic kidney, and a novel homozygous FIBP gene variant."
    explanation: Documents six cumulative reported cases through 2024.
  - reference: DOI:10.1007/s13353-025-00984-2
    reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with genetically confirmed TROFAS who presented with novel clinical features, including non-ossifying fibromas, subglottic tracheal stenosis, intermediate uveitis, and complete atrioventricular block requiring pacemaker implantation."
    explanation: Documents an additional genetically confirmed individual reported in 2025/2026.
pathophysiology:
- name: Biallelic FIBP Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous nonsense, frameshift,
    splice-duplication, or in-frame indel variants in FIBP cause transcript
    degradation or disrupt the conformation of the acidic fibroblast growth
    factor (FGF1) intracellular binding protein, abolishing or impairing its
    direct intracellular FGF1-binding activity.
  genes:
  - preferred_term: FIBP
    term:
      id: hgnc:3705
      label: FIBP
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic germline nonsense, frameshift, splice-region duplication, and conformation-disrupting indel alleles in FIBP.
  molecular_functions:
  - preferred_term: FGF1 intracellular growth factor binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0019838
      label: growth factor binding
  evidence:
  - reference: PMID:26660953
    reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The acidic fibroblast growth factor (FGF) intracellular binding protein (FIBP) interacts directly with the fibroblast growth factor FGF1."
    explanation: Establishes direct FGF1 growth-factor binding as the normal molecular function of FIBP.
  - reference: PMID:26660953
    reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patient's fibroblasts exhibit FIBP cDNA degradation and an increased proliferation capacity compared with controls."
    explanation: Demonstrates transcript loss (loss of function) in fibroblasts carrying a homozygous nonsense FIBP variant.
  - reference: PMID:27183861
    reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting indel (p.H59LN) was predicted to change the protein conformation with likely deleterious effect on its function as one of the fibroblast growth factor signaling mediators."
    explanation: Supports loss or disruption of FIBP's FGF-signaling mediator role across independent mutant alleles.
  downstream:
  - target: Dysregulated Intracellular FGF Signaling
    causal_link_type: DIRECT
    description: Loss of functional FIBP perturbs intracellular modulation of FGF1/FGFR pathway signaling.
- name: Dysregulated Intracellular FGF Signaling
  biological_scale: CELLULAR
  description: >-
    Loss of FIBP alters intracellular FGF/FGFR pathway regulation in developing
    and somatic cells, perturbing downstream proliferation control and
    embryonic tissue morphogenesis.
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
  evidence:
  - reference: PMID:26660953
    reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The different clinical features can be explained by the alteration of the FGFR pathway."
    explanation: Links FIBP loss to altered FGFR pathway signaling.
  - reference: PMID:27183861
    reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting indel (p.H59LN) was predicted to change the protein conformation with likely deleterious effect on its function as one of the fibroblast growth factor signaling mediators."
    explanation: Places FIBP deficiency directly within intracellular FGF pathway mediation.
  downstream:
  - target: Increased Cellular Proliferation
    causal_link_type: DIRECT
    description: Altered intracellular FGF signaling derepresses somatic cellular proliferation.
  - target: Disrupted Embryonic Renal Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Perturbed FGF-pathway modulation during nephrogenesis leads to variable renal and ureteric malformations.
  - target: Disrupted Embryonic Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Perturbed FGF-pathway modulation during embryonic brain development impairs neurogenesis and cognitive development.
- name: Increased Cellular Proliferation
  biological_scale: CELLULAR
  description: >-
    Skin fibroblasts from two independent affected families exhibit elevated
    proliferative capacity in vitro compared with control cells, providing a
    cellular basis for prenatal and postnatal somatic overgrowth and
    contributing to embryonal tumor susceptibility.

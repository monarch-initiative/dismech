      label: Electrocardiography
  evidence:
  - reference: DOI:10.1007/s13353-025-00984-2
    reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with genetically confirmed TROFAS who presented with novel clinical features, including non-ossifying fibromas, subglottic tracheal stenosis, intermediate uveitis, and complete atrioventricular block requiring pacemaker implantation."
    explanation: Identification of life-threatening complete atrioventricular block supports cardiac rhythm evaluation in TROFAS.
treatments:
- name: Cardiac Pacemaker Implantation
  description: >-
    Permanent cardiac pacemaker placement is indicated in TROFAS patients who
    develop complete (third-degree) atrioventricular conduction block.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Complete Atrioventricular Block
    treatment_effect: BYPASSES
    description: Restores ventricular pacing across complete atrioventricular nodal conduction failure.
  evidence:
  - reference: DOI:10.1007/s13353-025-00984-2
    reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with genetically confirmed TROFAS who presented with novel clinical features, including non-ossifying fibromas, subglottic tracheal stenosis, intermediate uveitis, and complete atrioventricular block requiring pacemaker implantation."
    explanation: Directly documents pacemaker implantation for complete atrioventricular block in TROFAS.
- name: Multidisciplinary Supportive Care and Surveillance
  description: >-
    Coordinated long-term follow-up across nephrology/oncology (for renal
    dysplasia and Wilms tumor risk), cardiology, ophthalmology, audiology,
    orthopedics, and developmental pediatrics.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: DOI:10.1007/s13353-025-00984-2
    reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings significantly broaden the phenotypic landscape of TROFAS and underscore the need for multidisciplinary management and long-term follow-up."
    explanation: Directly supports multidisciplinary management and longitudinal surveillance in TROFAS.
- name: Genetic Counseling
  description: >-
    Autosomal recessive family and carrier counseling (25% sibling recurrence
    risk in families with heterozygous carrier parents).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27183861
    reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we have identified the genetic etiology and the pathogenetic mechanism underlying a rare autosomal recessive overgrowth syndrome in three affected siblings."
    explanation: Autosomal recessive sibling recurrence underpins family genetic counseling and carrier testing.
differential_diagnoses:
- name: 15q overgrowth syndrome
  disease_term:
    preferred_term: 15q overgrowth syndrome
    term:
      id: MONDO:0017806
      label: 15q overgrowth syndrome
  description: >-
    Chromosomal distal 15q trisomy or tetrasomy syndrome (ORPHA:314585) that
    closely mimics the clinical triad of tall stature, learning difficulties,
    and congenital renal anomalies (renal agenesis, horseshoe kidney,
    hydronephrosis).
  distinguishing_features:
  - Caused by chromosomal copy-number gain of distal 15q26 encompassing IGF1R (detected on chromosomal microarray) rather than biallelic germline sequence variants in FIBP on 11q13.1.
  - Characteristic long, thin face with prominent nose and chin, without retinal coloboma.
  evidence:
  - reference: DOI:10.1002/ajmg.a.32534
    reference_title: "15q overgrowth syndrome: A newly recognized phenotype associated with overgrowth, learning difficulties, characteristic facial appearance, renal anomalies and increased dosage of distal chromosome 15q"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the overgrowth and learning difficulties, all five had a characteristic facial appearance and three had renal anomalies."
    explanation: Demonstrates the overlapping triad of overgrowth, learning difficulties, and renal anomalies in distal 15q dosage gain.
- name: Sotos syndrome
  disease_term:
    preferred_term: Sotos syndrome
    term:
      id: MONDO:0019349
      label: Sotos syndrome
  description: >-
    Autosomal dominant overgrowth syndrome with macrocephaly, tall stature,
    learning disability, and occasional renal anomalies.
  distinguishing_features:
  - Heterozygous NSD1 loss-of-function variants or 5q35 microdeletions with autosomal dominant inheritance, distinct from autosomal recessive FIBP deficiency.
- name: Weaver syndrome
  disease_term:
    preferred_term: Weaver syndrome
    term:
      id: MONDO:0010193
      label: Weaver syndrome
  description: >-
    EZH2-related overgrowth syndrome overlapping clinically with tall stature,
    macrocephaly, camptodactyly, and intellectual disability.
  distinguishing_features:
  - Heterozygous EZH2 pathogenic variants with autosomal dominant inheritance and characteristic accelerated bone maturation.
- name: Simpson-Golabi-Behmel syndrome type 1
  disease_term:
    preferred_term: Simpson-Golabi-Behmel syndrome type 1
    term:
      id: MONDO:0020602
      label: Simpson-Golabi-Behmel syndrome type 1
  description: >-
    X-linked overgrowth syndrome sharing prenatal and postnatal macrosomia,
    renal dysplasia/nephromegaly, congenital heart defects, and Wilms tumor
    predisposition.
  distinguishing_features:
  - Hemizygous or heterozygous GPC3/GPC4 alterations with X-linked inheritance, coarse facial features, supernumerary nipples, and polydactyly/syndactyly.
- name: Beckwith-Wiedemann syndrome
  disease_term:
    preferred_term: Beckwith-Wiedemann syndrome
    term:
      id: MONDO:0007534
      label: Beckwith-Wiedemann syndrome
  description: >-
    11p15.5 imprinting overgrowth disorder sharing macrosomia, macroglossia,
    nephromegaly/renal anomalies, and embryonal Wilms tumor predisposition.
  distinguishing_features:
  - Chromosome 11p15.5 methylation, copy-number, or CDKN1C alterations, lateralized overgrowth, abdominal wall defects, and neonatal hypoglycemia, generally without intellectual disability.
notes: >-
  MONDO:0014918 ("tall stature-intellectual disability-renal anomalies
  syndrome") maps 1:1 to OMIM:617107 and Orphanet:500095, carries MONDO exact
  synonyms "Thauvin-robinet-Faivre syndrome" and "TROFAS", and is defined in
  MONDO, OMIM, and Orphanet exclusively by biallelic germline loss-of-function
  variants in FIBP (HGNC:3705). Chromosomal distal 15q trisomy/tetrasomy
  overgrowth ("15q overgrowth syndrome", MONDO:0017806, Orphanet:314585) shares
  the descriptive clinical triad of tall stature, learning disability, and
  congenital renal anomalies but is a distinct chromosomal disorder and is
  therefore curated under differential_diagnoses rather than lumped into this
  monogenic entry. The entry's display name is set to Thauvin-Robinet-Faivre
  Syndrome with the MONDO label retained in synonyms so the title matches the
  FIBP-defined scope of MONDO:0014918 while keeping the file slug unchanged.

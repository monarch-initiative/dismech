- name: Disrupted Embryonic Neurodevelopment
  biological_scale: TISSUE
  description: >-
    Fibp is prominently expressed in the embryonic mouse brain, where FGF
    signaling governs neurogenesis and neural progenitor proliferation; loss of
    FIBP during early brain development underlies global developmental delay,
    intellectual disability, and specific learning disabilities. Organ-specific
    mechanisms for extra-neural, extra-renal congenital anomalies in TROFAS
    (craniofacial, ocular, auditory, cardiovascular, skeletal, airway, and
    hematologic features) remain uncharacterized.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: neurogenesis
    modifier: ABNORMAL
    term:
      id: GO:0022008
      label: neurogenesis
  evidence:
  - reference: PMID:27183861

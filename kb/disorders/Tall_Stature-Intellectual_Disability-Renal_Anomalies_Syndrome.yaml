genetic:
- name: FIBP
  gene_term:
    preferred_term: FIBP
    term:
      id: hgnc:3705
      label: FIBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic germline loss-of-function variants in FIBP
  features: >-
    Reported pathogenic alleles include a homozygous nonsense variant c.652C>T
    (p.Gln218*) causing FIBP cDNA degradation (PMID:26660953), a homozygous
    in-frame insertion c.175_176insTAA (p.H59LN) predicted to disrupt protein
    conformation (PMID:27183861), a homozygous splice-junction duplication
    c.412-3_415dupCAGTTTG (PMID:37876348), and compound heterozygous truncating
    variants c.1003C>T (p.Arg335*) and c.497_498del (p.Ser166*)
    (DOI:10.1007/s13353-025-00984-2).
  variants:
  - name: c.652C>T (p.Gln218*)
    description: Homozygous nonsense variant in FIBP identified in the index proband with overgrowth, macrocephaly, retinal coloboma, varicose veins, and FIBP cDNA degradation.
    evidence:
    - reference: PMID:26660953
      reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a unique case from a consanguineous union presenting with overgrowth, macrocephaly, retinal coloboma, large thumbs, severe varicose veins and learning disabilities, exome sequencing identified a homozygous nonsense FIBP variant."
      explanation: Reports the homozygous nonsense FIBP variant in the index patient.
    - reference: DOI:10.1007/s13353-025-00984-2
      reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "FIBP gene variant c.1003C>T, c.497_498del c.652C>T c.175_176insTTA c.412-3_415dupCAGTTTG"
      explanation: Literature comparison table recording c.652C>T as the Thauvin-Robinet et al. 2016 allele alongside subsequent FIBP variants.
  - name: c.175_176insTAA (p.H59LN)
    description: Homozygous in-frame insertion in FIBP segregating in three siblings with intellectual disability, overgrowth, renal dysplasia, and Wilms tumor predisposition.
    evidence:
    - reference: PMID:27183861
      reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The disease was mapped to 3p21.1-p14.2 and 11q13.1-q13.4, where an in-frame insertion (c.175_176insTAA) in FIBP gene was revealed."
      explanation: Identifies the homozygous c.175_176insTAA FIBP variant in three affected siblings.
  - name: c.412-3_415dupCAGTTTG
    description: Homozygous splice-acceptor/coding duplication in FIBP identified in two affected siblings with overgrowth, intellectual disability, and unilateral renal dysplasia.
    evidence:
    - reference: PMID:37876348
      reference_title: New cases of recently described Thauvin-Robinet-Faivre syndrome with a novel homozygous FIBP gene variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing analysis showed that both affected siblings share the same homozygous c. 412-3_415dupCAGTTTG FIBP gene variant."
      explanation: Identifies the homozygous c.412-3_415dupCAGTTTG variant in two siblings.
  - name: c.1003C>T and c.497_498del
    description: Compound heterozygous nonsense and frameshift variants in FIBP inherited in trans from unaffected heterozygous parents.
    evidence:
    - reference: DOI:10.1007/s13353-025-00984-2
      reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the mother is heterozygous for the c.497_498del mutation, while the father is heterozygous for the c.1003C>T mutation."
      explanation: Confirms biparental trans inheritance of c.497_498del and c.1003C>T in the proband.
  evidence:
  - reference: ORPHA:500095
    reference_title: "Tall stature-intellectual disability-renal anomalies syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FIBP | FGF1 intracellular binding protein | hgnc:3705 | Disease-causing germline mutation(s) (loss of function) in"
    explanation: Orphanet maps ORPHA:500095 (MONDO:0014918) exclusively to biallelic germline loss-of-function variants in FIBP.
  - reference: PMID:26660953
    reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a unique case from a consanguineous union presenting with overgrowth, macrocephaly, retinal coloboma, large thumbs, severe varicose veins and learning disabilities, exome sequencing identified a homozygous nonsense FIBP variant."
    explanation: Original gene-discovery report implicating biallelic FIBP loss of function.
  - reference: DOI:10.1007/s13353-025-00984-2
    reference_title: "Expanding the knowledge about Thauvin-Robinet-Faivre syndrome: a case report with novel clinical findings and review of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case report expands the phenotypic spectrum of Thauvin-Robinet-Faivre syndrome (TROFAS, OMIM #617107), a rare autosomal recessive disorder caused by biallelic loss-of-function mutations in the FIBP gene."
    explanation: Confirms biallelic loss-of-function variants in FIBP as the sole molecular cause of TROFAS.
experimental_models:
- name: Patient-derived FIBP-mutant skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:27183861
  description: >-
    Primary dermal fibroblasts cultured from TROFAS patients carrying
    homozygous FIBP variants (nonsense allele in PMID:26660953 and
    c.175_176insTAA in PMID:27183861), exhibiting FIBP cDNA degradation and
    elevated proliferative capacity relative to control fibroblasts.
  modeled_mechanisms:
  - target: Increased Cellular Proliferation
    relationship: MEASURES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Directly measures enhanced cellular proliferation and FIBP transcript reduction in patient-derived somatic cells.
    limitations: >-
      Dermal fibroblasts demonstrate the somatic hyperproliferation underlying
      overgrowth, whereas renal, neural, and cardiac developmental defects are
      not directly modeled in fibroblast monolayer culture.
    evidence:
    - reference: PMID:27183861
      reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The patients' skin fibroblasts showed an increased proliferation capacity compared to the controls' explaining the observed overgrowth phenotype."
      explanation: Demonstrates increased fibroblast proliferation in patient cells.
    - reference: PMID:26660953
      reference_title: "Homozygous FIBP nonsense variant responsible of syndromic overgrowth, with overgrowth, macrocephaly, retinal coloboma and learning disabilities."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The patient's fibroblasts exhibit FIBP cDNA degradation and an increased proliferation capacity compared with controls."
      explanation: Independently confirms FIBP transcript loss and hyperproliferation in fibroblasts from the first reported patient.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Caused by homozygous or compound heterozygous germline loss-of-function
    variants in FIBP, typically ascertained in consanguineous pedigrees or
    affected sibling pairs with unaffected heterozygous parents.
  evidence:
  - reference: PMID:27183861
    reference_title: "A recessive syndrome of intellectual disability, moderate overgrowth, and renal dysplasia predisposing to Wilms tumor is caused by a mutation in FIBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we have identified the genetic etiology and the pathogenetic mechanism underlying a rare autosomal recessive overgrowth syndrome in three affected siblings."
    explanation: Autosomal recessive segregation across three affected siblings with biallelic FIBP mutation.
  - reference: PMID:37876348
    reference_title: New cases of recently described Thauvin-Robinet-Faivre syndrome with a novel homozygous FIBP gene variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by homozygous or compound heterozygous FIBP gene mutations."
    explanation: Confirms biallelic (homozygous or compound heterozygous) inheritance in FIBP.

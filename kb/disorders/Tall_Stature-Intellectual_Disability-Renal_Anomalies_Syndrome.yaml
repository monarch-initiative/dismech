    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, we detected Fibp expression most notably in the brains of mice embryos suggesting a possible effect on cognitive functions early in development."
    explanation: Embryonic mouse brain expression of Fibp supports a developmental role in cognitive phenotypes.
  - reference: PMID:37876348
    reference_title: New cases of recently described Thauvin-Robinet-Faivre syndrome with a novel homozygous FIBP gene variant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "FGF signaling is required for neurogenesis and neuronal precursor proliferation. The FGF controls cell proliferation, differentiation, and migration in embryonic development and in adult life."
    explanation: Summarizes the developmental requirement for FGF signaling in neurogenesis.
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT

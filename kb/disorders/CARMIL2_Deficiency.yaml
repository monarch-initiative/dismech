name: CARMIL2 Deficiency
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: CARMIL2 deficiency
  term:
    id: MONDO:0029134
    label: severe combined immunodeficiency due to CARMIL2 deficiency
synonyms:
- severe combined immunodeficiency due to CARMIL2 deficiency
- RLTPR deficiency
- CARMIL2 (RLTPR) deficiency
- IMD58
- immunodeficiency 58
description: >-
  CARMIL2 deficiency is an autosomal recessive combined immunodeficiency caused
  by biallelic loss-of-function variants in CARMIL2 (16q22.1, previously RLTPR),
  which encodes the capping protein regulator and myosin 1 linker 2. CARMIL2 is
  the cytosolic scaffold that bridges the CD28 co-stimulatory receptor to the
  CARD11/CARMA1 adaptor, and through it to canonical NF-kB. Losing it therefore
  breaks the second signal of the two-signal model of T cell activation from the
  inside: the receptor is present and the T cell receptor arm is intact, but
  CD28 engagement no longer activates NF-kB. The consequences are a striking
  deficit of regulatory T cells, of CD4+ and CD8+ memory T cells and of the Th1
  and Th17 fates, together with poor T cell proliferation on CD3/CD28
  stimulation.

  Clinically this produces recalcitrant viral warts and molluscum contagiosum,
  mucocutaneous candidiasis, a broad burden of bacterial, mycobacterial and
  fungal infection, atopic and psoriasiform dermatitis, inflammatory bowel
  disease with failure to thrive, and a characteristic predisposition to
  Epstein-Barr-virus-positive smooth muscle tumours. It is fully penetrant by
  the age of 10 years.

  The entry is best read against Immunodeficiency_123_With_HPV-related_Verrucosis,
  the CD28-deficiency entry, which is its mechanistic near-twin and its closest
  differential. The two share a broken CD28 axis and share recalcitrant warts and
  low memory T cell and Treg counts. They diverge sharply everywhere else: CD28
  deficiency turns out to be almost entirely restricted to skin papillomaviruses,
  whereas CARMIL2 deficiency is a full combined immunodeficiency with low NK and
  memory B cell counts, weak antibody responses, tumours and gut inflammation.
  That divergence is the argument, made by the study that assembled 89 patients,
  that CARMIL2 governs immunological pathways beyond CD28 - and it is why this
  entry carries two mechanism branches that hang off the genetic lesion directly
  rather than off the co-stimulation node: a B-cell-intrinsic B cell receptor
  signalling defect, and a cytoskeletal defect.

  Two things are recorded rather than asserted. The cytoskeletal branch is
  contested - the original description reported perturbed cytoskeletal
  organization with T cell polarity and migration defects, while a later
  prospective cohort found normal morphology in a three-dimensional migration
  assay - so it is curated as a node carrying both the supporting and the
  refuting observation and is not given a downstream edge. And although CARMIL2
  is an actin-uncapping protein, that activity is dispensable for CD28
  co-stimulation; it is the scaffolding function that the disease turns on, so
  the pathograph runs through scaffolding rather than through actin.

  Allogeneic haematopoietic cell transplantation is the one disease-modifying
  treatment, and a 17-patient multicentre series reports it as curative across
  infection, inflammation and treatment-refractory EBV+ smooth muscle tumours.
parents:
- Combined immunodeficiency
- Inborn error of immunity
- Primary immunodeficiency
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      CARMIL2 deficiency is an inborn error of immunity, curated under disorders
      of the immune system.
    evidence:
    - reference: PMID:28112205
      reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human CARMIL2-deficiency is therefore an autosomal recessive primary
        immunodeficiency disorder associated with defective CD28-mediated TCR
        co-signalling and impaired cytoskeletal dynamics.
      explanation: >-
        Establishes the condition as a primary immunodeficiency, which places it
        in the immunology/rheumatology grouping.
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      Assigned to the IUIS combined-immunodeficiency table on the strength of the
      published characterization of the disease as a combined immunodeficiency
      affecting T, B and NK compartments. The IUIS 2024 classification tables
      themselves are not present in the retrievable text of the cached IUIS
      reference, so the table assignment is supported here from the primary
      disease literature rather than quoted from IUIS.
    evidence:
    - reference: PMID:27647349
      reference_title: "Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human RLTPR deficiency is a CID affecting at least the CD28-responsive
        pathway in T cells and the BCR-responsive pathway in B cells.
      explanation: >-
        States the combined-immunodeficiency classification and names both the
        cellular and the humoral arm, which is what the IUIS combined
        immunodeficiency table covers.
    - reference: PMID:32625199
      reference_title: "A Novel Pathogenic Variant in CARMIL2 (RLTPR) Causing CARMIL2 Deficiency and EBV-Associated Smooth Muscle Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CARMIL2 deficiency is a rare combined immunodeficiency (CID)
        characterized by defective CD28-mediated T cell co-stimulation, altered
        cytoskeletal dynamics, and susceptibility to Epstein Barr Virus smooth
        muscle tumors (EBV-SMTs).
      explanation: >-
        Independent statement of the same classification, from a later case
        report.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0029134
      label: severe combined immunodeficiency due to CARMIL2 deficiency
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0029134 is the CARMIL2-deficiency concept, xrefed to OMIM:618131,
      Orphanet:542301, MEDGEN:1648422 and UMLS:C4748304, with synonyms IMD58 and
      immunodeficiency 58. The MONDO label calls the condition a severe combined
      immunodeficiency; the primary literature consistently calls it a combined
      immunodeficiency (CID) rather than SCID, since autologous T cells are
      present in normal numbers and the defect is functional. The entry name
      follows the literature, and the MONDO label is retained as a synonym so the
      mapping stays exact rather than being weakened to a close match.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic loss-of-function CARMIL2 variants; affected
    individuals are typically homozygous in consanguineous kindreds, and a
    minority are compound heterozygous. Several recurrent alleles show founder
    effects in Norwegian, Saudi, Turkish and Mexican populations.
  penetrance: COMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:28112205
    reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human CARMIL2-deficiency is therefore an autosomal recessive primary
      immunodeficiency disorder associated with defective CD28-mediated TCR
      co-signalling and impaired cytoskeletal dynamics.
    explanation: States the autosomal recessive mode of inheritance directly.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2 deficiency is fully penetrant by the age of 10 yr and is
      characterized by numerous infections, EBV+ smooth muscle tumors, and
      mucocutaneous inflammation, including inflammatory bowel disease.
    explanation: >-
      The basis for `penetrance: COMPLETE`, which is asserted by age 10 rather
      than from birth. `expressivity: VARIABLE` is carried separately by the
      observation that patients with somatic reversion have milder phenotypes.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with somatic reversions of a mutant allele in CD4+ T cells have
      milder phenotypes.
    explanation: >-
      Documents one identified source of variable expressivity within the same
      recessive genotype.
pathophysiology:
- name: Biallelic CARMIL2 Loss of Function
  description: >-
    Biallelic loss-of-function variants in CARMIL2 are the initiating lesion.
    Across the largest published cohort the alleles are diverse - missense,
    nonsense, frameshift, in-frame deletion, splice and even synonymous variants
    that disrupt splicing - but converge on absent or non-functional protein.
    This node captures the single concept of the genetic lesion.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: CARMIL2
    term:
      id: hgnc:27089
      label: CARMIL2
  evidence:
  - reference: PMID:28112205
    reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show four human patients with EBV+ disseminated smooth muscle
      tumours that carry two homozygous loss-of-function mutations in the CARMIL2
      (RLTPR) gene encoding the capping protein regulator and myosin 1 linker 2.
    explanation: >-
      The original description of the biallelic loss-of-function lesion and of
      the protein it removes.
  - reference: PMID:27647349
    reference_title: "Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report six patients from three unrelated families with
      biallelic loss-of-function mutations in RLTPR, the mouse orthologue of
      which is essential for CD28 signaling.
    explanation: >-
      Independent identification of the same biallelic lesion, under the gene's
      former symbol.
  downstream:
  - target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
    causal_link_type: DIRECT
    description: >-
      Without CARMIL2 protein the CD28-to-CARD11 bridge cannot be assembled.
  - target: B Cell Receptor-Proximal NF-kB Signaling Failure
    causal_link_type: DIRECT
    description: >-
      A second, CD28-independent consequence of the same lesion: patient B cells
      fail to activate NF-kB on B cell receptor stimulation, so the humoral
      defect is not solely downstream of the T cell defect.
  - target: Perturbed T Cell Cytoskeletal Organization
    causal_link_type: DIRECT
    description: >-
      CARMIL2 is also a capping-protein regulator and actin-uncapping protein,
      and its loss was reported to perturb cytoskeletal organization. See that
      node for the contradicting observation.
- name: Loss of CARMIL2 Scaffolding of CD28 to CARD11
  description: >-
    CARMIL2 acts as a scaffold that bridges CD28 to the CARD11/CARMA1 cytosolic
    adaptor and onward to the NF-kB pathway; in T cells expressing mutant
    CARMIL2 the connection between CD28 and its two key effectors, protein
    kinase C-theta and CARD11/Carma1, is abrogated. It is the scaffolding role,
    not the actin-uncapping activity, that CD28 co-stimulation requires. This
    node captures the single concept of the lost molecular bridge.
  role: mediator
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: CD28-to-CARD11 scaffolding activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27647348
    reference_title: "The scaffolding function of the RLTPR protein explains its essential role for CD28 co-stimulation in mouse and human T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, using affinity purification followed by mass spectrometry analysis,
      we showed that RLTPR acts as a scaffold, bridging CD28 to the CARD11/CARMA1
      cytosolic adaptor and to the NF-κB signaling pathway, and identified
      proteins not found before within the CD28 signaling pathway.
    explanation: >-
      Identifies the scaffolding function this node stands for, and the two
      partners it bridges.
  - reference: PMID:27647348
    reference_title: "The scaffolding function of the RLTPR protein explains its essential role for CD28 co-stimulation in mouse and human T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although RLTPR is thought to function as an actin-uncapping protein, this
      property was dispensable for CD28 co-stimulation in both mouse and human.
    explanation: >-
      The reason the pathograph routes co-stimulation failure through scaffolding
      rather than through the actin-uncapping activity, and the reason the
      cytoskeletal node is kept off this chain.
  - reference: PMID:23793062
    reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, the connection between CD28 and protein kinase C-θ and Carma1, two
      key effectors of CD28 costimulation, was abrogated in T cells expressing
      mutant Rltpr, and CD28 costimulation did not occur in those cells.
    explanation: >-
      The mouse experiment that established the broken connection, at the level
      of the specific effectors. Human confirmation is carried by the two
      preceding items.
  downstream:
  - target: Failure of CD28-Dependent Canonical NF-kB Activation
    causal_link_type: DIRECT
    description: >-
      With the bridge gone, CD28 engagement no longer reaches NF-kB.
- name: Failure of CD28-Dependent Canonical NF-kB Activation
  description: >-
    Mutant CARMIL2 alleles impair canonical NF-kB activation in T cells
    stimulated via CD28, while AP-1 and NFAT activation are preserved - so the
    lesion is a selective failure of one CD28-triggered transcriptional arm
    rather than a general block on T cell activation. Patient CD4+ T cells do not
    respond to CD28 stimulation and proliferate poorly on CD3/CD28
    co-stimulation. This node is the central effector and the branch point from
    which the T cell compartment defects separate.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell costimulation
    term:
      id: GO:0031295
      label: T cell costimulation
    modifier: LOSS_OF_FUNCTION
  - preferred_term: CD28-dependent canonical NF-kB activation
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Tested mutant CARMIL2 alleles from 89 patients and 52 families impair
      canonical NF-κB but not AP-1 and NFAT activation in T cells stimulated via
      CD28.
    explanation: >-
      Establishes both halves of this node across the whole allelic series: the
      canonical NF-kB arm fails, and the AP-1 and NFAT arms do not.
  - reference: PMID:27647349
    reference_title: "Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their CD4+ T cells do not respond to CD28 stimulation."
    explanation: The functional readout in patient cells.
  - reference: PMID:29479355
    reference_title: "Novel CARMIL2 Mutations in Patients with Variable Clinical Dermatitis, Infections, and Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD3/CD28 signaling impairment was evidenced by reduced proliferative
      response to stimulation.
    explanation: >-
      Independent replication of the co-stimulation defect as a proliferation
      readout in a separate cohort.
  downstream:
  - target: Regulatory T Cell Deficit
    causal_link_type: DIRECT
    description: >-
      Regulatory T cell generation is one of the CD28-dependent programmes that
      the NF-kB arm carries.
  - target: Memory T Cell Deficit
    causal_link_type: DIRECT
    description: >-
      CD4+ and CD8+ memory T cell generation and survival depend on the same
      co-stimulatory signal.
  - target: Th1 and Th17 Differentiation Failure
    causal_link_type: DIRECT
    description: >-
      Differentiation toward the Th1 and Th17 fates fails without functional
      CARMIL2, in both human and mouse CD4+ T cells.
  - target: Impaired Humoral Memory and Antibody Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Antibody responses are T-cell-dependent, so loss of CD4+ helper output is
      one route to the humoral defect. It is not the only one - see the B cell
      receptor node.
- name: Regulatory T Cell Deficit
  description: >-
    Circulating regulatory T cells are markedly reduced or absent, without
    organ-specific autoimmunity of the IPEX kind. FOXP3+ Treg counts fall and
    CD25 expression within the residual Treg compartment is itself reduced. This
    node captures the single concept of the missing regulatory compartment, and
    it is the arm through which the inflammatory rather than the infectious half
    of the disease runs.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: FOXP3+ regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:28112205
    reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients lack regulatory T cells without evidence of organ-specific
      autoimmunity, and have defective CD28 co-signalling associated with
      impaired T-cell activation, differentiation and function, as well as
      perturbed cytoskeletal organization associated with T-cell polarity and
      migration disorders.
    explanation: >-
      Establishes the Treg deficit and, importantly, its dissociation from
      organ-specific autoimmunity.
  - reference: PMID:32625199
    reference_title: "A Novel Pathogenic Variant in CARMIL2 (RLTPR) Causing CARMIL2 Deficiency and EBV-Associated Smooth Muscle Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FOXP3+ regulatory T cells (Treg) were also quantitatively decreased, and
      furthermore CD25 expression within the Treg subset was substantially
      reduced.
    explanation: >-
      Adds the qualitative defect within the surviving Treg compartment to the
      quantitative one.
  - reference: PMID:23793062
    reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Rltpr was a lymphoid cell-specific, actin-uncapping protein
      essential for costimulation via CD28 and the development of regulatory T
      cells.
    explanation: >-
      The mouse genetics that predicted the human Treg deficit; kept distinct
      from the two human observations above by `evidence_source`.
  downstream:
  - target: Mucocutaneous and Intestinal Immune Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of regulatory T cells is the standing explanation for the dermatitis
      and inflammatory bowel disease, but the intermediate steps between the Treg
      deficit and the specific tissue inflammation have not been dissected in this
      disease.
- name: Memory T Cell Deficit
  description: >-
    Blood counts of CD4+ and CD8+ memory T cells are low, with central memory
    CD4+ and CD8+ and effector memory CD4+ subsets most affected and naive CD4+
    cells correspondingly increased. This node captures the single concept of the
    failed memory T cell compartment.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: memory T cell
    term:
      id: CL:0000813
      label: memory T cell
  biological_processes:
  - preferred_term: memory T cell differentiation
    term:
      id: GO:0043379
      label: memory T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like CD28-deficient patients, CARMIL2-deficient patients display
      recalcitrant warts and low blood counts of CD4+ and CD8+ memory T cells and
      CD4+ TREGs.
    explanation: >-
      Quantifies the memory T cell deficit and, in the same sentence, marks it as
      one of the features shared with CD28 deficiency.
  - reference: PMID:29479355
    reference_title: "Novel CARMIL2 Mutations in Patients with Variable Clinical Dermatitis, Infections, and Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping revealed that patient Treg counts were significantly
      depressed, and that CD4+ T cells were heavily skewed towards the naïve
      status.
    explanation: >-
      The naive skew is the mirror image of the memory deficit, measured in an
      independent cohort.
  downstream:
  - target: Failure of Cell-Mediated Control of Chronic Viral and Fungal Infection
    causal_link_type: DIRECT
    description: >-
      Chronic viral and fungal control depends on the memory T cell compartment
      this node is missing.
- name: Th1 and Th17 Differentiation Failure
  description: >-
    CD4+ T cells lacking functional CARMIL2 do not differentiate toward the Th1
    and Th17 fates, and are biased instead toward Th2, with a paucity of T
    follicular helper cells. This node captures the single concept of the skewed
    helper T cell repertoire; it is a separate claim from the memory deficit,
    because it is about which effector programmes are available rather than how
    many memory cells there are.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:27647348
    reference_title: "The scaffolding function of the RLTPR protein explains its essential role for CD28 co-stimulation in mouse and human T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Along that line, the lack of functional RLTPR molecules impeded the
      differentiation toward Th1 and Th17 fates of both human and mouse CD4+ T
      cells.
    explanation: >-
      Directly establishes the differentiation failure, and does so in human as
      well as mouse cells.
  - reference: PMID:27647349
    reference_title: "Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their CD4+ T cells exhibit a "Th2" cell bias ex vivo and when cultured in
      vitro, contrasting with the paucity of "Th1," "Th17," and T follicular
      helper cells.
    explanation: >-
      Documents the reciprocal Th2 bias and the T follicular helper deficit in
      patient cells.
  downstream:
  - target: Failure of Cell-Mediated Control of Chronic Viral and Fungal Infection
    causal_link_type: DIRECT
    description: >-
      Th1 and Th17 responses are the arms that control mycobacterial and mucosal
      fungal infection.
  - target: Mucocutaneous and Intestinal Immune Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The reciprocal Th2 bias is the standing explanation for the allergic and
      atopic half of the mucocutaneous phenotype; the intermediate steps have not
      been established in this disease.
- name: Failure of Cell-Mediated Control of Chronic Viral and Fungal Infection
  description: >-
    The composite immunological consequence: with the memory compartment depleted
    and the Th1/Th17 programmes unavailable, cell-mediated control of chronic
    viral and fungal pathogens fails. Clinically this is the broad infection
    burden - bacterial, mycobacterial and fungal - on which the tissue-specific
    outcomes below sit. This node captures the single concept of failed
    cell-mediated antimicrobial control.
  role: mediator
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: T cell mediated immunity
    term:
      id: GO:0002456
      label: T cell mediated immunity
    modifier: DECREASED
  evidence:
  - reference: PMID:27647349
    reference_title: "Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients have cutaneous and pulmonary allergy, as well as a variety of
      bacterial and fungal infectious diseases, including invasive tuberculosis
      and mucocutaneous candidiasis.
    explanation: >-
      Sets out the breadth of the infection burden, including the mycobacterial
      and mucosal-fungal infections that mark a Th1/Th17 defect.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2 deficiency is fully penetrant by the age of 10 yr and is
      characterized by numerous infections, EBV+ smooth muscle tumors, and
      mucocutaneous inflammation, including inflammatory bowel disease.
    explanation: >-
      The cohort-scale statement of the infection burden, alongside the two other
      defining manifestations.
  downstream:
  - target: Uncontrolled Cutaneous Papillomavirus and Poxvirus Replication
    causal_link_type: DIRECT
    description: >-
      Keratinocyte-level control of papillomavirus and of molluscum contagiosum
      virus depends on this cell-mediated arm.
  - target: Uncontrolled EBV Infection of Smooth Muscle
    causal_link_type: DIRECT
    description: >-
      EBV control likewise depends on it, and its failure permits the
      characteristic EBV-driven smooth muscle tumours.
  - target: Recurrent Mucocutaneous Candidiasis
    causal_link_type: DIRECT
    description: >-
      Mucosal Candida control is the classic Th17-dependent response.
  - target: Recurrent Infections
    causal_link_type: DIRECT
    description: >-
      The general infection burden is the direct clinical expression of this
      node.
- name: Uncontrolled Cutaneous Papillomavirus and Poxvirus Replication
  description: >-
    Cutaneous control of human papillomavirus and of molluscum contagiosum virus
    is lost in the keratinocyte compartment, producing warts and molluscum that
    resist treatment and persist from early childhood. This is the point at which
    the immunological lesion becomes visible skin disease. This node captures the
    single concept of failed cutaneous viral control.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:27896283

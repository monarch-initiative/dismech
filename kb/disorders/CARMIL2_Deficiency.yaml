    quote_role: PRIMARY_RESULT
    snippet: It therefore appears important to screen CARMIL2-deficient individuals for the presence of EBV+ SMTs by whole-body imaging techniques, ideally full-body magnetic resonance imaging, because blood tests are unable to detect these tumors.

  description: Glutamine improved NF-kB and mTOR signaling in stimulated patient CD4 T cells and increased IL17A RNA. Proliferation improved in two patients with abolished baseline responses, but not in two with partially preserved responses; secreted IL-17 was not significantly increased. No patient-treatment efficacy was established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Glutamine Supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

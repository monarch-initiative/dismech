genetic:
- name: CARMIL2
  gene_term:
    preferred_term: CARMIL2
    term:
      id: hgnc:27089
      label: CARMIL2
  relationship_type: CAUSATIVE
  notes: >-
    CARMIL2 loss of function causes autosomal recessive combined immunodeficiency. The 89-person cohort
    contained 49 germline variants across 52 families, including compound heterozygotes. Predominant functional
    leukocyte isoform 3 must be distinguished from the previously annotated isoform 1; minor isoform 2
    is also functional in complementation assays. A synonymous or missense annotation on one transcript
    may conceal a splice defect on the relevant transcript. Somatic reversion in selected T-cell compartments
    can lessen disease severity without correcting all immune lineages.
  evidence:
  - reference: PMID:28112205
    reference_title: A human immunodeficiency syndrome caused by mutations in CARMIL2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show four human patients with EBV+ disseminated smooth muscle tumours that carry two homozygous
      loss-of-function mutations in the CARMIL2 (RLTPR) gene encoding the capping protein regulator and
      myosin 1 linker 2.
    explanation: >-
      Establishes the causal gene, its product, and the biallelic loss-of-function mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Transcript 3 was expressed in HD cells, but RT-PCR and Sanger sequencing identified only transcript 1 in P42 T cell blasts, with the retention of 108 nucleotides of intron 14 (Fig. 1 K).
    explanation: RNA analysis explains the isoform-dependent splice consequence.
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Two individuals displayed a heterozygous reversion to the WT allele (P53, P57), and P1 had a heterozygous somatic missense variant at the site of the mutation (c.1578C>G, p.Cys526Trp) restoring normal splicing and CD28 signaling (Fig. 8, A and B; and Fig.
    explanation: Somatic repair can restore function in selected T-cell lineages.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_0055cbc0-64df-4f38-9074-495f4ac74e1c-2024-03-12T160000.000Z
    notes: ClinGen Primary Immune Regulatory Disorders Expert Panel classified this autosomal recessive association as Definitive on 12 March 2024.
    evidence:
    - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_0055cbc0-64df-4f38-9074-495f4ac74e1c-2024-03-12T160000.000Z

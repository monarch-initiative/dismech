diagnosis:
- name: Molecular Diagnosis
  description: Identify biallelic pathogenic CARMIL2 variants with sequencing and segregation analysis, interpreting splice consequences against the functional leukocyte transcript. Functional studies are useful for uncertain alleles.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29479355
    reference_title: Novel CARMIL2 Mutations in Patients with Variable Clinical Dermatitis, Infections, and Combined Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through the use of whole exome sequencing and autozygome-guided analysis, we uncovered two mutations
      not previously reported (p.R50T and p.L846Sfs) in CARMIL2.
    explanation: >-
      Establishes exome sequencing, with autozygosity mapping in consanguineous families, as the diagnostic
      route.
    quote_role: PRIMARY_RESULT
- name: Immune Phenotyping and Functional Confirmation
  description: Measure memory T cells, Tregs, memory B cells, NK cells, immunoglobulins and vaccine-specific antibodies. CARMIL2 protein expression and stimulated T-cell proliferation or NF-kB assays can establish functional impairment; normal total counts or IgG do not exclude disease.
  diagnosis_term:
    preferred_term: Flow Cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We analyzed the impact of this defect on B cell function and found that serum IgG concentrations were within the normal range in most CARMIL2-deficient individuals, as only 12/80 (15%) presented hypogammaglobulinemia (Fig. 6 A and Table S4).
    explanation: Most patients had normal serum IgG despite immune dysfunction.
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Despite generally normal Ig concentrations, CARMIL2-deficient individuals displayed abnormally weak-specific Ab responses to protein-based booster vaccines, as 23/32 (72%) and 15/15 (100%) of the patients had low titers or no Abs against tetanus and diphtheria toxoid, respectively (Fig. 6 B and Table S4).
    explanation: Specific vaccine responses reveal defects missed by routine immunoglobulin quantification.
  - reference: PMID:31115454
    reference_title: CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The T cell proliferation and activation assays confirmed defective responses to CD28 costimulation,
      consistent with CARMIL2 deficiency.
    explanation: >-
      Establishes the functional confirmation step that follows the genetic finding.
    quote_role: PRIMARY_RESULT
- name: Consider CARMIL2 Deficiency in Very Early Onset Inflammatory Bowel Disease
  description: >-
    Children presenting with very early onset inflammatory bowel disease should be evaluated for an underlying
    inborn error of immunity, because the immunological diagnosis changes management. CARMIL2 deficiency
    is one of the monogenic causes reached this way, and the intestinal disease may precede recognition
    of the immunodeficiency.
  evidence:
  - reference: PMID:31115454
    reference_title: CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This example illustrates that early diagnosis of underlying PID is crucial for the treatment and
      prognosis of children with VEO-IBD.
    explanation: >-
      States the diagnostic recommendation this entry records, in the setting where CARMIL2 deficiency
      is most likely to be missed.
    quote_role: PRIMARY_RESULT

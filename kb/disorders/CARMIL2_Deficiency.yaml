differential_diagnoses:
- name: CD28 deficiency
  description: >-
    Isolated CD28 deficiency shares impaired costimulation, warts and low memory T-cell and Treg counts.
    The reported human phenotype is substantially narrower than CARMIL2 deficiency.
  distinguishing_features:
  - CARMIL2 deficiency has a broader infection and inflammatory phenotype in reported cohorts.
  - Reduced NK and memory B-cell compartments and poor vaccine responses favor CARMIL2 deficiency, although no single laboratory abnormality is obligatory.
  - EBV-positive smooth-muscle tumors and intestinal inflammation are characteristic concerns in CARMIL2 deficiency.
  evidence:
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like CD28-deficient patients, CARMIL2-deficient patients display recalcitrant warts and low blood
      counts of CD4+ and CD8+ memory T cells and CD4+ TREGs.
    explanation: The shared features that make the two easy to confuse.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike CD28-deficient patients, they have low counts of NK cells and memory B cells, and their antibody
      responses are weak.
    explanation: The discriminating laboratory features.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      numerous infections, EBV+ smooth muscle tumors, and mucocutaneous inflammation, including inflammatory
      bowel disease.
    explanation: >-
      The discriminating clinical features, absent from CD28 deficiency.
    quote_role: PRIMARY_RESULT
- name: Very early onset inflammatory bowel disease of other monogenic cause
  description: >-
    Very early onset colitis may reflect several monogenic immune disorders. CARMIL2 testing is particularly
    relevant when immune dysregulation, viral skin disease or impaired costimulation accompanies intestinal
    disease.
  distinguishing_features:
  - Failed T cell proliferation and activation specifically on CD3/CD28 co-stimulation points to the CD28 axis rather than to another monogenic IBD gene
  - Absent or reduced CARMIL2 protein on immunoblot or flow cytometry
  - Accompanying recalcitrant warts, molluscum contagiosum and dermatitis
  evidence:
  - reference: PMID:31115454
    reference_title: CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant number of described VEO-IBD-causing monogenic disorders can be attributed to defects
      in immune-related genes.
    explanation: >-
      Background establishes monogenic immune disease as a differential for very early onset colitis.
    quote_role: BACKGROUND
  - reference: PMID:31115454
    reference_title: CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The T cell proliferation and activation assays confirmed defective responses to CD28 costimulation,
      consistent with CARMIL2 deficiency.
    explanation: The functional test that resolves the differential.
    quote_role: PRIMARY_RESULT
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest published characterization assembled 89 individuals from 52 unrelated families originating
    from 23 countries; a 2026 transplantation series puts the cumulative literature count at an estimated
    120 patients. No population rate has been estimated, and the disease is reported almost entirely from
    consanguineous kindreds, so the numbers reflect ascertainment as much as occurrence.
  evidence:
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We established biological and clinical phenotypes of CARMIL2 deficiency by studying 89 individuals
      from 52 unrelated families (Table S1) originating from 23 countries.
    explanation: >-
      Gives the individual and family count of the largest published series. No normalized population
      rate is asserted.
    quote_role: PRIMARY_RESULT
animal_models:
- name: Rltpr bas L432P Mouse
  species: Mouse
  genotype: Homozygous Rltpr bas L432P missense allele
  publication: PMID:23793062
  description: >-
    ENU-derived L432P mice show defective CD28 costimulation, reduced Tregs and impaired T-dependent antibody
    responses. Reduced protein dosage alone does not explain the phenotype because heterozygous-null mice
    with similar protein abundance retain responses.
  evidence:
  - reference: PMID:23793062
    reference_title: The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Rltpr was a lymphoid cell-specific, actin-uncapping protein essential for costimulation
      via CD28 and the development of regulatory T cells.
    explanation: >-
      Establishes the model as informative for both the co-stimulation and the regulatory T cell nodes.
    quote_role: PRIMARY_RESULT
  modeled_mechanisms:
  - target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mutant protein reaches the synapse with CD28 but fails to connect it to protein kinase C-theta
      and Carma1, which is precisely the scaffolding failure this node describes.
    limitations: >-
      The allele is a point mutant from a mutagenesis screen rather than one of the human disease alleles,
      and the human disease is caused by absent or degraded protein at least as often as by a hypomorphic
      one. The scaffolding conclusion was subsequently confirmed directly in human T cells, so the model
      is not the sole support for this node.
    readouts:
    - name: CD28 connection to protein kinase C-theta and Carma1
      target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
      description: >-
        Whether CD28 engagement at the immunological synapse recruits its two key downstream effectors
        in mutant versus wild-type T cells.
      direction: ABOLISHED
      interpretation: >-
        Loss of the connection with preserved colocalization is the observation that identifies the lesion
        as scaffolding rather than localization.
      evidence:
      - reference: PMID:23793062
        reference_title: The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, the connection between CD28 and protein kinase C-θ and Carma1, two key effectors of
          CD28 costimulation, was abrogated in T cells expressing mutant Rltpr, and CD28 costimulation
          did not occur in those cells.
        explanation: Reports the measurement behind this readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:23793062
      reference_title: The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the connection between CD28 and protein kinase C-θ and Carma1, two key effectors of CD28
        costimulation, was abrogated in T cells expressing mutant Rltpr, and CD28 costimulation did not
        occur in those cells.
      explanation: >-
        Supports treating this model as informative for the scaffolding node.
      quote_role: PRIMARY_RESULT
  - target: Regulatory T Cell Deficit
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model has reduced Treg development; residual Tregs are present.
    limitations: >-
      The mouse does not reproduce the mucocutaneous and intestinal inflammation that the human Treg deficit
      is invoked to explain, so it supports the cellular node without testing the edge that runs from
      it to tissue disease.
    evidence:
    - reference: PMID:23793062
      reference_title: The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Rltpr was a lymphoid cell-specific, actin-uncapping protein essential for costimulation

      explanation: >-
        Supports treating the model as informative for the regulatory T cell node.
      quote_role: PRIMARY_RESULT
  - target: B Cell Receptor-Proximal NF-kB Signaling Failure
    relationship: FAILS_TO_RECAPITULATE

- name: Carmil2QE gain-of-function knock-in mouse
  species: Mouse
  genotype: Carmil2QE knock-in, modelling a CARMIL2 substitution found in human T cell malignancies
  publication: PMID:40402149
  description: >-
    Carmil2 QE gain-of-function mice form preassembled CARMIL2-CARD11 complexes and can restore many antigen-dependent
    functions in Cd28-null mice. This is a pathway perturbation, not an autosomal recessive deficiency
    model.
  evidence:
  - reference: PMID:40402149
    reference_title: A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Such ready-made CARMIL2QE-CARD11 complexes also formed in CD28-deficient mice where they unexpectedly
      induced most of the functions that normally result from CD28 engagement in a manner that remains
      antigen-dependent.
    explanation: >-
      The epistasis result that makes the model informative for the scaffolding node.
    quote_role: PRIMARY_RESULT
  modeled_mechanisms:
  - target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      A gain-of-function perturbation of the same node the disease loses. It does not model the disease
      state; it tests, in the opposite direction, whether the CARMIL2-CARD11 complex is the operative
      element of CD28 co-stimulation.
    limitations: >-
      Treg numbers were restored more fully than suppressive activity, which remained about twofold reduced;
      iNKT development was not rescued. Mouse NK counts were restored, but this does not explain all differences
      between human CD28 and CARMIL2 deficiencies. Solid-tumor assays did not model EBV-positive smooth-muscle
      tumors.
    evidence:
    - reference: PMID:40402149
      reference_title: A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, we uncovered the overarching role played by CARMIL2-CARD11 signals among those
        triggered by CD28 and exploited them to induce potent solid tumor-specific T cell responses in
        the absence of CD28 ligands and immune checkpoint inhibitors.
      explanation: >-
        The authors' conclusion that CARMIL2-CARD11 is the dominant arm of CD28 signalling, which is the
        claim this entry's central chain depends on.
      quote_role: PRIMARY_RESULT
  - target: Regulatory T Cell Deficit
    relationship: RESCUES
    fidelity: MODERATE
    description: The gain-of-function allele restores regulatory-cell numbers in Cd28-null mice.
    limitations: Suppressive function remained about twofold reduced, and iNKT development was not restored.
    evidence:
    - reference: PMID:40402149
      reference_title: A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: They had, however, a twofold reduced suppressive activity as compared to those of WT and Carmil2QE mice (Fig. 5 C).
      explanation: Cell numbers and suppressive function did not recover equivalently.
    - reference: PMID:40402149
      reference_title: A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Consistent with these results, the lack of CARMIL2 had no deleterious effect on iNKT cell development and the expression of CARMIL2QE molecules in Carmil2QECd28−/− thymi failed to restore iNKT cell development (Fig. 3, I and J).
      explanation: Some CD28-dependent outputs remain CARMIL2-independent.
  - target: Reduced Natural Killer Cell Count
    relationship: RESCUES
    fidelity: MODERATE
    description: The QE allele restores splenic NK counts in Cd28-null mice.
    limitations: Human CD28-deficient patients can have normal NK counts; a mouse homeostasis result does not establish the human NK mechanism.

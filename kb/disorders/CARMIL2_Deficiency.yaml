- name: Immunoglobulin Replacement Therapy
  description: Immunoglobulin replacement was given to 7/15 patients in a longitudinal cohort because of infections and impaired antibody responses, even when total IgG was not low. Combined prophylaxis and replacement reduced infection frequency observationally. After HCT, no patient in the transplant cohort required replacement beyond 24 months; earlier post-transplant support may still be needed.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Replacement Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  evidence:
  - reference: PMID:34287962
    reference_title: Evolution and long-term outcomes of combined immunodeficiency due to CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Because of recurrent infections and dysgammaglobulinemia with poor antibody responses, five patients (33%, P3, P4, P6, P7, P15) received prophylactic antibiotics and seven patients (47%, P3, P6, P7, P9–11, P15) were commenced on immunoglobulin replacement therapy (IgRT) with one receiving via subcutaneous and six via intravenous routes.
    explanation: The primary cohort directly documents intravenous and subcutaneous replacement.
  - reference: PMID:42529607
    reference_title: Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Similarly, CD19+ B cell deficiency (<200/μl) was reported only in P14 (+26 mo), and no patient required immunoglobulin replacement therapy (IGRT) beyond 24 mo after HCT.
    explanation: The full results specify the post-transplant timing.

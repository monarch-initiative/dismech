  description: >-
    Biallelic loss-of-function variants cause disease, usually in homozygous individuals but also in compound
    heterozygotes. In the 89-person ascertained cohort, the Results section reported 95% penetrance by
    age 10 and symptom onset from birth to age 22; this qualifies the abstract statement of full penetrance
    by age 10. Somatic reversion can modify severity.

    reference_title: "https://ronharellab.technion.ac.il/wp-content/uploads/sites/450/2026/01/2025-J-Allergy-Clin-Immunol.pdf"
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Glutamine supplementation improv ed proliferation only in T cells in which proliferati ve ca - pacity was completely abolished before the treatment (patients 1 and 4) ( Fig 4 , H ).
    explanation: Authors’ full-text copy of PMID:40738287, CARMIL2 deficiency disrupts activation-induced metabolic reprogramming in T cells and is partially rescued by glutamine supplementation. Proliferation rescue was confined to two severely impaired patient cultures.

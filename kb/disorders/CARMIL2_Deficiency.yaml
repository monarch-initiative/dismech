    reference_title: "Evolution and long-term outcomes of combined immunodeficiency due to CARMIL2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2-deficient T cells exhibited reduced T-cell proliferation and
      cytokine production following CD28 co-stimulation and normal morphology
      when migrating in a high-density 3D collagen gel matrix.
    explanation: >-
      Adds reduced proliferation and cytokine production to the functional
      picture, from a prospective cohort with long follow-up.
genetic:
- name: CARMIL2
  gene_term:
    preferred_term: CARMIL2
    term:
      id: hgnc:27089
      label: CARMIL2
  relationship_type: CAUSATIVE
  notes: >-
    CARMIL2 (16q22.1), previously symbolised RLTPR and aliased LRRC16C, encodes
    the capping protein regulator and myosin 1 linker 2. Disease requires
    biallelic loss-of-function alleles. The largest published series identified 49
    germline variants across 89 individuals from 52 families - missense, nonsense,
    frameshift, in-frame deletion, splice and synonymous variants that disrupt
    splicing - with founder effects for recurrent alleles in Norwegian, Saudi,
    Turkish and Mexican populations. Note that the isoform picture matters for
    variant interpretation: the predominant and functional leukocyte isoform is
    not the one annotated as canonical in Ensembl, so a variant's predicted
    consequence depends on which transcript it is read against.
  evidence:
  - reference: PMID:28112205
    reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show four human patients with EBV+ disseminated smooth muscle
      tumours that carry two homozygous loss-of-function mutations in the CARMIL2
      (RLTPR) gene encoding the capping protein regulator and myosin 1 linker 2.
    explanation: >-
      Establishes the causal gene, its product, and the biallelic
      loss-of-function mechanism.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that only one of three CARMIL2 isoforms is produced and functional
      across leukocyte subsets.
    explanation: >-
      The isoform finding behind the variant-interpretation caveat in the notes
      above. Evidence source is IN_VITRO because the claim rests on the
      transcript and complementation experiments rather than on patient
      observation.
diagnosis:
- name: Exome Sequencing with CD28 Co-stimulation Functional Testing
  description: >-
    The diagnosis is made by exome sequencing, typically in a consanguineous
    kindred presenting with an unexplained combined immunodeficiency, and
    confirmed functionally by absent or reduced CARMIL2 protein and by a failed
    proliferative and NF-kB response to CD3/CD28 co-stimulation. Routine
    lymphocyte counts are unhelpful for the T cell compartment, whose total counts
    are normal; the informative subsets are memory T cells, regulatory T cells,
    memory B cells and NK cells.
  diagnosis_term:
    preferred_term: whole exome sequencing with confirmatory CD28 co-stimulation testing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29479355
    reference_title: "Novel CARMIL2 Mutations in Patients with Variable Clinical Dermatitis, Infections, and Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through the use of whole exome sequencing and autozygome-guided analysis,
      we uncovered two mutations not previously reported (p.R50T and p.L846Sfs)
      in CARMIL2.
    explanation: >-
      Establishes exome sequencing, with autozygosity mapping in consanguineous
      families, as the diagnostic route.
  - reference: PMID:31115454
    reference_title: "CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The T cell proliferation and activation assays confirmed defective
      responses to CD28 costimulation, consistent with CARMIL2 deficiency.
    explanation: >-
      Establishes the functional confirmation step that follows the genetic
      finding.
- name: Consider CARMIL2 Deficiency in Very Early Onset Inflammatory Bowel Disease
  description: >-
    Children presenting with very early onset inflammatory bowel disease should be
    evaluated for an underlying inborn error of immunity, because the immunological
    diagnosis changes management. CARMIL2 deficiency is one of the monogenic
    causes reached this way, and the intestinal disease may precede recognition of
    the immunodeficiency.
  evidence:
  - reference: PMID:31115454
    reference_title: "CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This example illustrates that early diagnosis of underlying PID is crucial
      for the treatment and prognosis of children with VEO-IBD.
    explanation: >-
      States the diagnostic recommendation this entry records, in the setting where
      CARMIL2 deficiency is most likely to be missed.
treatments:
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The only disease-modifying treatment. A multicentre retrospective series of 17
    patients undergoing 19 transplants reported improvement across every major
    disease manifestation, including EBV-positive smooth muscle tumours that had
    been refractory to other treatment, with 82.4 per cent overall survival, no
    continuing need for immunoglobulin replacement, and no harm from mixed
    chimerism. The authors conclude transplantation should be offered at
    diagnosis.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic CARMIL2 Loss of Function
    description: >-
      Transplantation replaces the CARMIL2-deficient haematopoietic compartment
      with donor cells carrying functional CARMIL2, correcting the lesion at its
      source rather than treating any individual downstream manifestation.
    evidence:
    - reference: PMID:42529607
      reference_title: "Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Despite limitations due to cohort size and high pre-transplant morbidity
        in individual patients, HCT improved all major disease manifestations,
        including infections, inflammatory disease, and previously
        treatment-refractory EBV+ SMTs.
      explanation: >-
        Improvement across every downstream branch simultaneously is what supports
        transplantation acting on the shared upstream lesion rather than on any one
        mechanism.
  evidence:
  - reference: PMID:42529607
    reference_title: "Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic HCT is therefore a curative option for patients with CARMIL2
      deficiency, which should be offered upon diagnosis.
    explanation: The authors' conclusion and recommendation.
  - reference: PMID:42529607
    reference_title: "Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients died during the early posttransplant period (overall
      survival, 82.4%), and two required a second HCT for graft failure.
    explanation: >-
      The counterweight to the recommendation, recorded here so the risk is not
      lost: early transplant-related mortality and graft failure are both real in
      this cohort.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Immunoglobulin replacement is used as supportive treatment for the humoral
    defect before transplantation. Its status as a pre-transplant requirement is
    documented indirectly, by the observation that no patient needed it after
    transplantation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired Humoral Memory and Antibody Response
    description: >-
      Replacement immunoglobulin substitutes for the antibody the patient's own
      memory B cell compartment cannot make. It does not correct the underlying
      B cell signalling defect.
    evidence:
    - reference: PMID:42529607
      reference_title: "Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No patient required immunoglobulin replacement after HCT, and no
        detrimental effects of mixed chimerism were noted.
      explanation: >-
        Establishes that immunoglobulin replacement is part of pre-transplant care
        for this disease, and that correcting the humoral node removes the need for
        it. The evidence is indirect - the sentence reports the post-transplant
        state rather than the pre-transplant indication - which is recorded in the
        treatment description rather than overstated here.
  evidence:
  - reference: PMID:42529607
    reference_title: "Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patient required immunoglobulin replacement after HCT, and no
      detrimental effects of mixed chimerism were noted.
    explanation: >-
      The only quotable evidence found for immunoglobulin replacement in this
      disease; it establishes the practice by reporting its discontinuation.
- name: Interleukin-2 Supplementation
  description: >-
    Investigational, not established practice. Exogenous interleukin-2 restored
    CD25 and interferon-gamma production, and in one patient T cell proliferation,
    in CARMIL2-deficient cells in vitro, in a dose-dependent manner. The authors
    propose it should be studied further as a therapeutic modality; no clinical
    trial has tested it. No `therapeutic_agent` is bound: the source used generic
    exogenous interleukin-2 rather than a named product, and the pharmacologic
    NCIT and CHEBI terms available here name specific recombinant products
    (aldesleukin and its relatives), so binding one would assert a specificity
    the study does not have.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: interleukin-2 supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Failure of CD28-Dependent Canonical NF-kB Activation
    description: >-
      Interleukin-2 supplies downstream of the failed co-stimulatory signal what
      CD28 engagement would normally elicit, bypassing rather than repairing the
      broken scaffold.
    evidence:
    - reference: PMID:32201938
      reference_title: "Exogenous interleukin-2 can rescue in-vitro T cell activation and proliferation in patients with a novel capping protein regulator and myosin 1 linker 2 mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When cells derived from CARMIL2-deficient patients were treated with
        IL-2, CD25 and IFN-γ production increased in a dose-dependent manner.
      explanation: >-
        The dose-dependent rescue of activation markers in patient cells is the
        basis for treating interleukin-2 as acting on the co-stimulation node.
  evidence:
  - reference: PMID:32201938
    reference_title: "Exogenous interleukin-2 can rescue in-vitro T cell activation and proliferation in patients with a novel capping protein regulator and myosin 1 linker 2 mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, we found that IL-2 rescued T cell activation and
      proliferation in CARMIL2-deficient patients. Thus, IL-2 should be further
      studied as a potential therapeutic modality for these patients.
    explanation: >-
      The authors' own framing, which is a proposal for study rather than a
      clinical result. Evidence source is IN_VITRO because the rescue was
      demonstrated in cultured patient cells, not in treated patients.
differential_diagnoses:
- name: CD28 deficiency
  description: >-
    The mechanistic near-twin and the informative differential: CD28 deficiency
    (immunodeficiency 123, curated here as
    Immunodeficiency_123_With_HPV-related_Verrucosis) removes the receptor that
    CARMIL2 scaffolds, so the two share a broken co-stimulatory axis, recalcitrant
    warts and low memory T cell and regulatory T cell counts. They diverge
    everywhere else, and that divergence is the argument that CARMIL2 does more
    than serve CD28.
  distinguishing_features:
  - CD28 deficiency is essentially restricted to skin papillomaviruses; CARMIL2 deficiency carries a broad bacterial, mycobacterial and fungal infection burden
  - NK cell and memory B cell counts are normal in CD28 deficiency and low in CARMIL2 deficiency
  - CD28-deficient patients make virus-specific antibody; CARMIL2-deficient patients have weak antibody responses
  - EBV-positive smooth muscle tumours and inflammatory bowel disease occur in CARMIL2 deficiency and not in CD28 deficiency
  evidence:
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like CD28-deficient patients, CARMIL2-deficient patients display
      recalcitrant warts and low blood counts of CD4+ and CD8+ memory T cells and
      CD4+ TREGs.
    explanation: The shared features that make the two easy to confuse.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike CD28-deficient patients, they have low counts of NK cells and memory
      B cells, and their antibody responses are weak.
    explanation: The discriminating laboratory features.
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2 deficiency is fully penetrant by the age of 10 yr and is
      characterized by numerous infections, EBV+ smooth muscle tumors, and
      mucocutaneous inflammation, including inflammatory bowel disease.
    explanation: >-
      The discriminating clinical features, absent from CD28 deficiency.
- name: Very early onset inflammatory bowel disease of other monogenic cause
  description: >-
    A child presenting with refractory very early onset inflammatory bowel disease
    has a substantial prior probability of a monogenic immune defect, of which
    CARMIL2 deficiency is only one. The differential matters because identifying
    which one changes management, and because in CARMIL2 deficiency the gut
    disease can arrive before the immunodeficiency is recognised.
  distinguishing_features:
  - Failed T cell proliferation and activation specifically on CD3/CD28 co-stimulation points to the CD28 axis rather than to another monogenic IBD gene
  - Absent or reduced CARMIL2 protein on immunoblot or flow cytometry
  - Accompanying recalcitrant warts, molluscum contagiosum and dermatitis
  evidence:
  - reference: PMID:31115454
    reference_title: "CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant number of described VEO-IBD-causing monogenic disorders can be
      attributed to defects in immune-related genes.
    explanation: >-
      Establishes the size of this differential. Evidence source is HUMAN_CLINICAL
      because the statement introduces a patient study of the same question.
  - reference: PMID:31115454
    reference_title: "CARMIL2 Deficiency Presenting as Very Early Onset Inflammatory Bowel Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The T cell proliferation and activation assays confirmed defective
      responses to CD28 costimulation, consistent with CARMIL2 deficiency.
    explanation: The functional test that resolves the differential.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest published characterization assembled 89 individuals from 52
    unrelated families originating from 23 countries; a 2026 transplantation
    series puts the cumulative literature count at an estimated 120 patients. No
    population rate has been estimated, and the disease is reported almost
    entirely from consanguineous kindreds, so the numbers reflect ascertainment
    as much as occurrence.
  evidence:
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tested mutant CARMIL2 alleles from 89 patients and 52 families impair
      canonical NF-κB but not AP-1 and NFAT activation in T cells stimulated via
      CD28.
    explanation: >-
      Gives the patient and family count of the largest published series. No
      normalized population rate is asserted.
animal_models:
- name: Rltpr point-mutant mouse (ENU-derived allele)
  species: Mouse
  genotype: Rltpr point mutation recovered from an ENU mutagenesis screen
  publication: PMID:23793062
  description: >-
    The founding model. An ENU mutagenesis screen recovered an Rltpr mutation
    whose homozygotes fail CD28 co-stimulation and do not develop regulatory T
    cells. Mechanistically the mutant protein still colocalizes with CD28 at the
    immunological synapse but no longer connects it to protein kinase C-theta and
    Carma1, which is what identified CARMIL2 as the scaffold rather than as a
    receptor-proximal signalling component in its own right.
  evidence:
  - reference: PMID:23793062
    reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Rltpr was a lymphoid cell-specific, actin-uncapping protein
      essential for costimulation via CD28 and the development of regulatory T
      cells.
    explanation: >-
      Establishes the model as informative for both the co-stimulation and the
      regulatory T cell nodes.
  modeled_mechanisms:
  - target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mutant protein reaches the synapse with CD28 but fails to connect it to
      protein kinase C-theta and Carma1, which is precisely the scaffolding
      failure this node describes.
    limitations: >-
      The allele is a point mutant from a mutagenesis screen rather than one of
      the human disease alleles, and the human disease is caused by absent or
      degraded protein at least as often as by a hypomorphic one. The scaffolding
      conclusion was subsequently confirmed directly in human T cells, so the
      model is not the sole support for this node.
    readouts:
    - name: CD28 connection to protein kinase C-theta and Carma1
      target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
      description: >-
        Whether CD28 engagement at the immunological synapse recruits its two key
        downstream effectors in mutant versus wild-type T cells.
      direction: ABOLISHED
      interpretation: >-
        Loss of the connection with preserved colocalization is the observation
        that identifies the lesion as scaffolding rather than localization.
      evidence:
      - reference: PMID:23793062
        reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, the connection between CD28 and protein kinase C-θ and Carma1,
          two key effectors of CD28 costimulation, was abrogated in T cells
          expressing mutant Rltpr, and CD28 costimulation did not occur in those
          cells.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:23793062
      reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the connection between CD28 and protein kinase C-θ and Carma1,
        two key effectors of CD28 costimulation, was abrogated in T cells
        expressing mutant Rltpr, and CD28 costimulation did not occur in those
        cells.
      explanation: >-
        Supports treating this model as informative for the scaffolding node.
  - target: Regulatory T Cell Deficit
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Regulatory T cell development fails in the mutant mouse, as it does in
      patients.
    limitations: >-
      The mouse does not reproduce the mucocutaneous and intestinal inflammation
      that the human Treg deficit is invoked to explain, so it supports the
      cellular node without testing the edge that runs from it to tissue disease.
    evidence:
    - reference: PMID:23793062
      reference_title: "The lymphoid lineage-specific actin-uncapping protein Rltpr is essential for costimulation via CD28 and the development of regulatory T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Rltpr was a lymphoid cell-specific, actin-uncapping protein
        essential for costimulation via CD28 and the development of regulatory T
        cells.
      explanation: >-
        Supports treating the model as informative for the regulatory T cell node.
- name: Carmil2QE gain-of-function knock-in mouse
  species: Mouse
  genotype: Carmil2QE knock-in, modelling a CARMIL2 substitution found in human T cell malignancies
  publication: PMID:40402149
  description: >-
    The reciprocal experiment, and the strongest available test of the mechanism
    this entry asserts. A gain-of-function CARMIL2 allele produces preformed
    CARMIL2-CARD11 complexes without CD28 engagement, and in CD28-deficient mice
    those ready-made complexes induce most of the functions CD28 engagement
    normally produces. If forcing the scaffold complex substitutes for the
    receptor, then the receptor's contribution runs through the scaffold - which
    is why loss of the scaffold reproduces so much of losing the receptor.
  evidence:
  - reference: PMID:40402149
    reference_title: "A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Such ready-made CARMIL2QE-CARD11 complexes also formed in CD28-deficient
      mice where they unexpectedly induced most of the functions that normally
      result from CD28 engagement in a manner that remains antigen-dependent.
    explanation: >-
      The epistasis result that makes the model informative for the scaffolding
      node.
  modeled_mechanisms:
  - target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      A gain-of-function perturbation of the same node the disease loses. It does
      not model the disease state; it tests, in the opposite direction, whether
      the CARMIL2-CARD11 complex is the operative element of CD28 co-stimulation.
    limitations: >-
      This is a mouse gain-of-function allele derived from a somatic substitution
      found in human T cell malignancies, not a loss-of-function disease model, so
      it says nothing about the clinical phenotype, the B cell defect, or the
      tumour susceptibility. Most of the functions is also not all of them, and
      the paper does not resolve which CD28 outputs remain scaffold-independent.
    evidence:
    - reference: PMID:40402149
      reference_title: "A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, we uncovered the overarching role played by CARMIL2-CARD11
        signals among those triggered by CD28 and exploited them to induce potent
        solid tumor-specific T cell responses in the absence of CD28 ligands and
        immune checkpoint inhibitors.
      explanation: >-
        The authors' conclusion that CARMIL2-CARD11 is the dominant arm of CD28
        signalling, which is the claim this entry's central chain depends on.
datasets: []
discussions:
- discussion_id: gap_carmil2_beyond_cd28
  prompt: >-
    Which of CARMIL2's non-CD28 functions accounts for the parts of the phenotype
    that CD28 deficiency does not have - the low NK cell counts, the low memory B
    cells, the weak antibody responses, and the EBV-positive smooth muscle
    tumours?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#B Cell Receptor-Proximal NF-kB Signaling Failure
  - pathophysiology#Impaired Humoral Memory and Antibody Response
  - pathophysiology#Uncontrolled EBV Infection of Smooth Muscle
  rationale: >-
    The comparison with CD28 deficiency is the cleanest natural experiment
    available, and it says that CARMIL2 is doing something beyond scaffolding
    CD28. What that something is has been narrowed but not identified. One piece
    is in hand: patient B cells fail to activate NF-kB on B cell receptor
    stimulation, so at least part of the humoral defect is B-cell-intrinsic. The
    NK cell deficit has no proposed mechanism at all. The tumour susceptibility is
    the most consequential unknown, because it is the manifestation that has been
    refractory to treatment short of transplantation, and it is not obviously
    explained by the T cell deficits, which CD28-deficient patients share without
    developing tumours. A single unifying answer has been proposed - that CARMIL2
    controls NF-kB downstream of several protein kinase C-dependent receptors
    rather than of CD28 alone - but it is a hypothesis, not a demonstrated
    mechanism for any of these three findings.
  proposed_experiments:
  - experiment_id: exp_carmil2_nk_cell_intrinsic_requirement
    name: Cell-intrinsic requirement for CARMIL2 in NK cells
    description: >-
      Determine whether the NK cell deficit is NK-cell-intrinsic by testing
      CARMIL2-dependent receptor signalling in patient NK cells directly, and by
      comparing NK reconstitution kinetics after transplantation with those of the
      T cell compartment.
  - experiment_id: exp_carmil2_pkc_receptor_panel
    name: Which protein kinase C-coupled receptors need CARMIL2
    description: >-
      Test NF-kB activation in patient T, B and NK cells across a panel of
      receptors that signal through protein kinase C to CARD11, to establish
      whether CARMIL2 is a general requirement for that route or is specific to a
      subset of receptors.
  evidence:
  - reference: PMID:36515678
    reference_title: "Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study suggests that CARMIL2 governs immunological pathways beyond CD28."
    explanation: >-
      The authors state the conclusion and, in stating it as a suggestion, mark
      the mechanism as unresolved. That is the gap.
- discussion_id: gap_carmil2_cytoskeletal_defect_contested
  prompt: >-
    Do CARMIL2-deficient human T cells actually have a migration defect, and does
    any such defect contribute to disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Perturbed T Cell Cytoskeletal Organization
  rationale: >-
    The original description of the human disease reported perturbed cytoskeletal
    organization with T cell polarity and migration disorders, and the
    cytoskeletal claim has been repeated as a defining feature ever since - it
    appears in the framing sentence of later case reports. But a prospective
    cohort that set out to test it with a three-dimensional collagen migration
    assay found normal morphology in migrating CARMIL2-deficient T cells, in the
    same patients whose CD28 co-stimulation and cytokine production were clearly
    abnormal. The two results are not formally incompatible - different assays,
    different readouts, cell shape is not the same as migration velocity - but
    they have not been reconciled, and the disease narrative has continued to
    carry the cytoskeletal claim without acknowledging the negative result. The
    question matters beyond bookkeeping: the actin-uncapping activity is
    dispensable for CD28 co-stimulation, so if there is no migration defect either,
    then CARMIL2's capping-protein biology may be irrelevant to this disease
    despite giving the protein its name.
  proposed_experiments:
  - experiment_id: exp_carmil2_migration_assay_reconciliation
    name: Head-to-head migration assays in CARMIL2-deficient T cells
    description: >-
      Run the assays behind both results side by side on the same patient cells -
      interstitial and transendothelial migration, polarity and uropod formation,
      and the three-dimensional collagen assay - reporting velocity and
      directionality as well as morphology, to establish whether the discrepancy
      is assay-dependent or patient-dependent.
  evidence:
  - reference: PMID:34287962
    reference_title: "Evolution and long-term outcomes of combined immunodeficiency due to CARMIL2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2-deficient T cells exhibited reduced T-cell proliferation and
      cytokine production following CD28 co-stimulation and normal morphology
      when migrating in a high-density 3D collagen gel matrix.
    explanation: >-
      The negative migration result that stands against the widely repeated
      cytoskeletal claim, from the same cells in which the co-stimulation defect
      was confirmed.
- discussion_id: gap_carmil2_metabolic_rescue_translation
  prompt: >-
    Can bypassing the broken co-stimulatory signal downstream - with interleukin-2
    or with glutamine - do anything useful for patients who cannot be transplanted?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of CD28-Dependent Canonical NF-kB Activation
  - treatments#Interleukin-2 Supplementation
  rationale: >-
    Two independent ex vivo rescues of CARMIL2-deficient T cells have been
    reported, and neither has been tested in a patient. Exogenous interleukin-2
    restored CD25 expression and interferon-gamma production dose-dependently, and
    proliferation in one patient. Separately, CARMIL2-deficient CD4+ T cells were
    shown to fail activation-induced metabolic reprogramming, with glutamine
    metabolism among the depressed pathways, and glutamine supplementation restored
    NF-kB and mTOR activity and raised IL17A expression. Both act downstream of the
    broken scaffold rather than repairing it, and both were demonstrated in
    cultured cells from small numbers of patients. Whether either produces clinical
    benefit is untested; transplantation is curative and now recommended at
    diagnosis, which sets a high bar and also narrows the population in which a
    bypass strategy would be worth trialling - patients ineligible for transplant,
    or awaiting it.
  proposed_experiments:
  - experiment_id: exp_carmil2_bypass_agent_comparison
    name: Compare the two ex vivo rescues on common readouts
    description: >-
      Test interleukin-2 and glutamine supplementation, alone and together, on the
      same panel of patient cells with common readouts - NF-kB and mTOR activity,
      proliferation, Th1 and Th17 cytokine output - to establish whether they act
      on the same bottleneck and whether either restores the Th17 arm that the
      mucosal fungal phenotype depends on.
  evidence:
  - reference: PMID:32201938
    reference_title: "Exogenous interleukin-2 can rescue in-vitro T cell activation and proliferation in patients with a novel capping protein regulator and myosin 1 linker 2 mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, we found that IL-2 rescued T cell activation and
      proliferation in CARMIL2-deficient patients. Thus, IL-2 should be further
      studied as a potential therapeutic modality for these patients.
    explanation: >-
      The proposal, stated by its authors as requiring further study, which is the
      open end this gap records.
  - reference: PMID:40738287
    reference_title: "CARMIL2 deficiency disrupts activation-induced metabolic reprogramming in T cells and is partially rescued by glutamine supplementation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CARMIL2 deficiency disrupts T-cell metabolic reprogramming and was partially
      rescued ex vivo with glutamine supplementation.
    explanation: >-
      The second, independent ex vivo rescue, explicitly qualified as partial and
      ex vivo.
notes: >-
  Naming. The MONDO label calls this "severe combined immunodeficiency due to
  CARMIL2 deficiency"; the primary literature calls it a combined immunodeficiency
  (CID) without the "severe", and the distinction is substantive rather than
  stylistic. SCID is defined by the absence of autologous T cells; CARMIL2-deficient
  patients have normal total CD3+, CD4+ and CD8+ counts and a functional defect in
  the memory and regulatory subsets. The entry is therefore named CARMIL2
  Deficiency, the MONDO label is retained as a synonym, and the mapping is kept as
  an exact match because it is the same concept under a label this entry disputes.

  Phenotype term choices worth a second look. Three bindings are broader than the
  finding they carry, and in each case the alternative was worse. The EBV-positive
  smooth muscle tumour is bound to HP:0031459 Soft tissue neoplasm: HPO has no
  smooth-muscle-tumour term that leaves malignant potential open, and the
  available alternatives either assert benignity (HP:0031460 Benign muscle
  neoplasm) or name a specific site or malignancy the disease does not have.
  Inflammatory bowel disease is bound to HP:0002583 Colitis, HPO having no generic
  IBD term. Dermatitis is bound to HP:0001047 Atopic dermatitis although the
  reported range runs from atopic and seborrhoeic through to psoriasiform; the
  cohort does not report the subtypes separately, so splitting into three
  phenotypes would manufacture a breakdown the source does not give. In all three
  cases `preferred_term` carries the more accurate name.

  Not curated for want of a citable quantitative source: peripheral eosinophilia
  and raised IgE are both described in CARMIL2 deficiency and would fit the Th2
  bias this entry does curate, but the papers cached here state them only in
  passing or in patient tables rather than in a quotable propositional sentence.

  Frequency bands are all taken from one prospective 15-patient cohort
  (PMID:34287962), which is the only source found that reports per-manifestation
  rates. A cohort of 15 gives wide confidence intervals on every band, and the
  same cohort's skin figure of 93 per cent aggregates warts, molluscum and
  dermatitis, so the individual skin phenotypes are banded conservatively. The
  89-patient series does not report manifestation frequencies in its abstract.

  Model coverage is uneven and deliberately so. There is a good mouse model of the
  molecular lesion and of the regulatory T cell deficit, and a striking
  gain-of-function mouse that tests the scaffolding claim in the opposite
  direction, but no model curated here reproduces the EBV-driven tumours, the
  inflammatory bowel disease, or the cutaneous viral phenotype - which is to say,
  no model reproduces anything a patient actually presents with. This is not a
  gap in the curation; it is the state of the field, and it is why the
  `gap_carmil2_beyond_cd28` discussion proposes no experiment in an animal.

    quote_role: PRIMARY_RESULT
    snippet: T cells deri ve d from 2 other patients (patients 8 and 9) maintained partial proliferati v e capacity , which was not improv ed by glutamine supplementation ( Fig 4 , H ; Fig E3 , D ).

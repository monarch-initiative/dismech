pathophysiology:
- name: CARMIL2 Coding Substitutions
  description: Biallelic coding substitutions include missense alleles and premature termination variants. Their effects must be interpreted using the relevant transcript and cellular assay.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:27647349
    reference_title: Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A1, A2, and A3 carry a homozygous nucleotide substitution (T>G) at position 1,115 in exon 14 of RLTPR, resulting in the replacement of a highly conserved leucine residue by an arginine (L372R) in the leucine-rich repeat (LRR) domain (Fig. 1, d and e; and Fig.
    explanation: The founding kindred carried a homozygous coding missense substitution.
  - reference: PMID:27647349
    reference_title: Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: B1 and B2 carry a nucleotide substitution (C>T) at position 2,557 in exon 25, resulting in the replacement of a glutamine residue by a stop codon (Q853X; Fig. 1, d and e).
    explanation: A separate coding substitution introduces a premature stop.

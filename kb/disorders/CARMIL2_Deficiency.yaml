- discussion_id: gap_carmil2_metabolic_rescue_translation
  prompt: >-
    Can bypassing the broken co-stimulatory signal downstream - with interleukin-2 or with glutamine -
    do anything useful for patients who cannot be transplanted?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Stimulated T Cell Proliferation
  - pathophysiology#Reduced Activated T Cell mTOR Signaling
  - treatments#Interleukin-2 Supplementation
  - treatments#Glutamine Supplementation
  rationale: >-
    IL-2 and glutamine improve selected patient-cell readouts in culture, but response depends on baseline
    impairment, stimulus and endpoint. Glutamine increased signaling and IL17A RNA without a significant
    secreted IL-17 increase, and proliferation improved in only two of four assayed patients. Neither
    intervention has established clinical efficacy or safety in CARMIL2 deficiency. Controlled studies
    would need endpoints beyond acute signaling rescue.
  proposed_experiments:
  - experiment_id: exp_carmil2_bypass_agent_comparison
    name: Compare the two ex vivo rescues on common readouts
    description: >-
      Test interleukin-2 and glutamine supplementation, alone and together, on the same panel of patient
      cells with common readouts - NF-kB and mTOR activity, proliferation, Th1 and Th17 cytokine output
      - to establish whether they act on the same bottleneck and whether either restores the Th17 arm
      that the mucosal fungal phenotype depends on.
  evidence:
  - reference: PMID:32201938
    reference_title: Exogenous interleukin-2 can rescue in-vitro T cell activation and proliferation in patients with a novel capping protein regulator and myosin 1 linker 2 mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In conclusion, we found that IL-2 rescued T cell activation and proliferation in CARMIL2-deficient patients.
    explanation: The primary authors propose further study of IL-2.
  - reference: PMID:40738287
    reference_title: CARMIL2 deficiency disrupts activation-induced metabolic reprogramming in T cells and is partially rescued by glutamine supplementation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Glutamine supplementation restored NF-κB and mTOR activity, as measured by p-65 and RPS6 phosphorylation, respectively, and upregulated the expression of IL17A in CARMIL2-mutated CD4+ T cells.
    explanation: The glutamine study reports cellular signaling rescue.

treatments:
- name: Allogeneic Hematopoietic Cell Transplantation
  description: A retrospective series of 17 patients receiving 19 transplants reported 82.4% survival at a median follow-up of 37 months and 61.8% event-free survival. Immune and inflammatory manifestations improved in survivors, but three patients died early and two required repeat HCT for graft failure. Among five patients with EBV-positive tumors, one had complete remission, two partial remission, one stable disease and one progression. Residual immune defects occurred with mixed chimerism. These data support early specialist transplant assessment, while benefit and risk remain individualized.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Allogeneic Hematopoietic Cell Transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  evidence:
  - reference: PMID:42529607
    reference_title: Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Three patients died during the early posttransplant period (overall survival, 82.4%), and two required a second HCT for graft failure.
    explanation: The series reports both survival and transplant failures.
  - reference: PMID:42529607
    reference_title: Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After HCT, one patient achieved complete remission (P13, 20%), two showed a partial remission (P5 and P7, 40%), one had stable disease (P8, 20%), and one suffered from progressive disease (P1, 20%), contributing to an early multifactorial respiratory failure and subsequent death 1 mo after HCT.
    explanation: Tumor responses were variable, not universal cure.
  - reference: PMID:42529607
    reference_title: Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Overall event-free survival (EFS) was 61.8% (Fig. 1 A), with events defined as death of any cause or graft failure.
    explanation: Event-free survival accounts for death or graft failure.
  - reference: PMID:42529607
    reference_title: Allogeneic hematopoietic cell transplantation is curative in CARMIL2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Still, our data indicate proper immune reconstitution in patients exhibiting full donor chimerism, whereas P9, with mixed chimerism, shows reduced counts of Treg and CD4+ memory T cells and an impaired T cell proliferation upon CD28 co-stimulation after HCT.
    explanation: Full versus mixed donor chimerism had different immune readouts.

    reference_title: The scaffolding function of the RLTPR protein explains its essential role for CD28 co-stimulation in mouse and human T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although RLTPR is thought to function as an actin-uncapping protein, this property was dispensable
      for CD28 co-stimulation in both mouse and human.
    explanation: >-
      The reason the pathograph routes co-stimulation failure through scaffolding rather than through
      the actin-uncapping activity, and the reason the cytoskeletal node is kept off this chain.

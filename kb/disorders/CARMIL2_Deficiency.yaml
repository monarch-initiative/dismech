name: CARMIL2 Deficiency
creation_date: '2026-09-03T00:00:00Z'
category: Mendelian
disease_term:
  preferred_term: CARMIL2 deficiency
  term:
    id: MONDO:0029134
    label: severe combined immunodeficiency due to CARMIL2 deficiency
synonyms:
- severe combined immunodeficiency due to CARMIL2 deficiency
- RLTPR deficiency
- CARMIL2 (RLTPR) deficiency
- IMD58
- immunodeficiency 58
description: >-
  CARMIL2 deficiency is an autosomal recessive combined immunodeficiency caused by biallelic loss-of-function
  variants in CARMIL2 (formerly RLTPR). Defective CARMIL2-dependent signaling impairs CD28 costimulation,
  T cell activation and immune memory; additional B cell and natural killer cell abnormalities broaden
  the phenotype beyond isolated CD28 deficiency. Recurrent respiratory and mucocutaneous infections, dermatitis,
  intestinal inflammation, growth failure and EBV-positive smooth muscle tumors occur with variable severity.
  Symptoms usually begin in infancy, but later onset occurs. Allogeneic hematopoietic cell transplantation
  can restore immunity and improve inflammatory disease and some tumors, with substantial transplant risks.
parents:
- Combined immunodeficiency
- Inborn error of immunity
- Primary immunodeficiency
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      CARMIL2 deficiency is an inborn error of immunity, curated under disorders of the immune system.
    evidence:
    - reference: PMID:28112205
      reference_title: A human immunodeficiency syndrome caused by mutations in CARMIL2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human CARMIL2-deficiency is therefore an autosomal recessive primary immunodeficiency disorder
        associated with defective CD28-mediated TCR co-signalling and impaired cytoskeletal dynamics.
      explanation: >-
        Establishes the condition as a primary immunodeficiency, which places it in the immunology/rheumatology
        grouping.
      quote_role: PRIMARY_RESULT
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      Combined immunodeficiency affecting cellular immunity and specific antibody responses; total lymphocyte
      counts and serum immunoglobulins may be preserved.
    evidence:
    - reference: PMID:27647349
      reference_title: Dual T cell- and B cell-intrinsic deficiency in humans with biallelic RLTPR mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human RLTPR deficiency is a CID affecting at least the CD28-responsive pathway in T cells and
        the BCR-responsive pathway in B cells.
      explanation: >-
        States the combined-immunodeficiency classification and names both the cellular and the humoral
        arm, which is what the IUIS combined immunodeficiency table covers.
      quote_role: PRIMARY_RESULT
    - reference: PMID:32625199
      reference_title: A Novel Pathogenic Variant in CARMIL2 (RLTPR) Causing CARMIL2 Deficiency and EBV-Associated Smooth Muscle Tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CARMIL2 deficiency is a rare combined immunodeficiency (CID) characterized by defective CD28-mediated
        T cell co-stimulation, altered cytoskeletal dynamics, and susceptibility to Epstein Barr Virus
        smooth muscle tumors (EBV-SMTs).
      explanation: >-
        Independent statement of the same classification, from a later case report.
      quote_role: PRIMARY_RESULT

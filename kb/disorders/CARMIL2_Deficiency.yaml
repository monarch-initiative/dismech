    limitations: The measured mouse endpoints do not reproduce the human selective BCR defect; normal proliferation is not a direct measurement of every NF-kB component.
    evidence:
    - reference: PMID:27647348
      reference_title: The scaffolding function of the RLTPR protein explains its essential role for CD28 co-stimulation in mouse and human T cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Mice deprived of functional RLTPR molecules had normal numbers of B cells, and cross-linking of the BCR of such B cells induced their proliferation to the same extent as WT B cells.
      explanation: Anti-IgM proliferation was preserved.

discussions:
- discussion_id: gap_carmil2_beyond_cd28
  prompt: >-
    Which of CARMIL2's non-CD28 functions accounts for the parts of the phenotype that CD28 deficiency
    does not have - the low NK cell counts, the low memory B cells, the weak antibody responses, and the
    EBV-positive smooth muscle tumours?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#B Cell Receptor-Proximal NF-kB Signaling Failure
  - pathophysiology#Impaired Specific Antibody Production
  - pathophysiology#Uncontrolled EBV Infection of Smooth Muscle
  - phenotypes#Reduced Natural Killer Cell Count
  - phenotypes#Decreased Memory B Cell Proportion
  rationale: >-
    Patient B-cell assays establish a selective BCR-to-NF-kB defect. NK degranulation can also be impaired,
    and 2025 mouse genetics implicates CARMIL2/CD28 signaling in NK homeostasis. However, normal NK counts
    in human CD28 deficiency, variable NK lymphopenia in CARMIL2 deficiency, and the absence of direct
    EBV-smooth-muscle tumor killing assays leave the human tumor-surveillance mechanism unresolved.
  proposed_experiments:
  - experiment_id: exp_carmil2_nk_cell_intrinsic_requirement
    name: Cell-intrinsic requirement for CARMIL2 in NK cells
    description: >-
      Determine whether the NK cell deficit is NK-cell-intrinsic by testing CARMIL2-dependent receptor
      signalling in patient NK cells directly, and by comparing NK reconstitution kinetics after transplantation
      with those of the T cell compartment.
  - experiment_id: exp_carmil2_pkc_receptor_panel
    name: Which protein kinase C-coupled receptors need CARMIL2
    description: >-
      Test NF-kB activation in patient T, B and NK cells across a panel of receptors that signal through
      protein kinase C to CARD11, to establish whether CARMIL2 is a general requirement for that route
      or is specific to a subset of receptors.
  evidence:
  - reference: PMID:36515678
    reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype than CD28 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Unlike CD28-deficient patients, they have low counts of NK cells and memory B cells, and their antibody responses are weak.
    explanation: Human phenotypes extend beyond isolated CD28 deficiency.
  - reference: PMID:40402149
    reference_title: A CARMIL2 gain-of-function mutation suffices to trigger most CD28 costimulatory functions in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The spleen of Cd28−/− and Carmil2−/− mice contained 1.5-fold reduced numbers of the NK cell as compared to the WT spleen, whereas the Carmil2QECd28−/− spleen expressed normal NK cell numbers (Fig. 4 G).
    explanation: Mouse genetics provides a partial mechanism for NK-cell homeostasis.
- discussion_id: gap_carmil2_cytoskeletal_defect_contested
  prompt: >-
    Do CARMIL2-deficient human T cells actually have a migration defect, and does any such defect contribute
    to disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Perturbed T Cell Cytoskeletal Organization
  rationale: >-
    The earlier study measured cytoskeletal organization, speed, directionality and chemotaxis, whereas
    the later high-density collagen assay reported normal morphology. These are different readouts under
    different matrix conditions. The evidence supports context dependence rather than a universal contradiction;
    clinical consequences remain unproven.

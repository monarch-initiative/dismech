notes: >-
  Naming. The MONDO label calls this "severe combined immunodeficiency due to CARMIL2 deficiency"; the primary literature calls it a combined immunodeficiency (CID) without the "severe", and the distinction is substantive rather than stylistic. SCID is defined by the absence of autologous T cells; CARMIL2-deficient patients have normal total CD3+, CD4+ and CD8+ counts and a functional defect in the memory and regulatory subsets. The entry is therefore named CARMIL2 Deficiency, the MONDO label is retained as a synonym, and the mapping is kept as an exact match because it is the same concept under a label this entry disputes.

  Phenotype term choices worth a second look. Three bindings are broader than the finding they carry, and in each case the alternative was worse. The EBV-positive smooth muscle tumour is bound to HP:0031459 Soft tissue neoplasm: HPO has no smooth-muscle-tumour term that leaves malignant potential open, and the available alternatives either assert benignity (HP:0031460 Benign muscle neoplasm) or name a specific site or malignancy the disease does not have. Inflammatory bowel disease is bound to HP:0002583 Colitis, HPO having no generic IBD term. Dermatitis is bound to HP:0001047 Atopic dermatitis although the reported range runs from atopic and seborrhoeic through to psoriasiform; the cohort does not report the subtypes separately, so splitting into three phenotypes would manufacture a breakdown the source does not give. In all three cases `preferred_term` carries the more accurate name.

  Not curated for want of a citable quantitative source: peripheral eosinophilia and raised IgE are both described in CARMIL2 deficiency and would fit the Th2 bias this entry does curate, but the papers cached here state them only in passing or in patient tables rather than in a quotable propositional sentence.

  Frequency bands are all taken from one prospective 15-patient cohort (PMID:34287962), which is the only source found that reports per-manifestation rates. A cohort of 15 gives wide confidence intervals on every band, and the same cohort's skin figure of 93 per cent aggregates warts, molluscum and dermatitis, so the individual skin phenotypes are banded conservatively. The 89-patient series does not report manifestation frequencies in its abstract.

  Model coverage is uneven and deliberately so. There is a good mouse model of the molecular lesion and of the regulatory T cell deficit, and a striking gain-of-function mouse that tests the scaffolding claim in the opposite direction, but no model curated here reproduces the EBV-driven tumours, the inflammatory bowel disease, or the cutaneous viral phenotype - which is to say, no model reproduces anything a patient actually presents with. This is not a gap in the curation; it is the state of the field, and it is why the `gap_carmil2_beyond_cd28` discussion proposes no experiment in an animal. Full-text evidence also cites the authors’ deposited PDF at https://ronharellab.technion.ac.il/wp-content/uploads/sites/450/2026/01/2025-J-Allergy-Clin-Immunol.pdf; DOI:10.1016/j.jaci.2025.07.018 identifies the same article. Full-text quotations also cite the publisher HTML at https://all-imm.com/index.php/aei/article/view/1595/2445; this is the same article.

- name: Perturbed T Cell Cytoskeletal Organization
  description: >-
    CARMIL2 is a capping-protein regulator, and the original description of the
    human disease reported perturbed cytoskeletal organization with T cell
    polarity and migration defects. This node is deliberately curated without a
    downstream edge, because the claim is contested: a later prospective cohort
    that ran a three-dimensional collagen migration assay found normal morphology
    in CARMIL2-deficient T cells. Both observations are recorded on this node.
    Note also that the actin-uncapping activity is dispensable for CD28
    co-stimulation, so even on the supporting reading this branch is parallel to
    the co-stimulation defect rather than upstream of it.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28112205
    reference_title: "A human immunodeficiency syndrome caused by mutations in CARMIL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients lack regulatory T cells without evidence of organ-specific
      autoimmunity, and have defective CD28 co-signalling associated with
      impaired T-cell activation, differentiation and function, as well as
      perturbed cytoskeletal organization associated with T-cell polarity and
      migration disorders.
    explanation: >-
      The original report of the cytoskeletal and migration abnormality this node
      stands for.
  - reference: PMID:34287962
    reference_title: "Evolution and long-term outcomes of combined immunodeficiency due to CARMIL2 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CARMIL2-deficient T cells exhibited reduced T-cell proliferation and
      cytokine production following CD28 co-stimulation and normal morphology
      when migrating in a high-density 3D collagen gel matrix.
    explanation: >-
      The same sentence confirms the co-stimulation defect and contradicts the
      migration defect. It is entered as REFUTE against this node specifically,
      which is why the node carries no downstream edge.

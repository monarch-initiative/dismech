- name: Nek8-null mouse
  species: Mouse
  genotype: Nek8 targeted null allele, homozygous
  publication: PMID:23274954
  description: >-
    Homozygous Nek8-null mice die at birth with randomized left-right
    asymmetry, cardiac anomalies and glomerular kidney cysts.
  modeled_mechanisms:
  - target: Defective Nodal Left-Right Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces the laterality and cardiac features of RHPD2.
    limitations: >-
      Kidney involvement is glomerular cysts at birth rather than the enlarged
      cystic dysplasia of human fetuses; liver and pancreatic lesions are not
      described in the abstract.
    evidence:
    - reference: PMID:23274954
      reference_title: "Loss of the ciliary kinase Nek8 causes left-right asymmetry defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "homozygous mutant mice die at birth and exhibit randomization of left-right asymmetry, cardiac anomalies, and glomerular kidney cysts"
      explanation: Phenotype of the null mouse.
- name: jck mouse
  species: Mouse
  genotype: Nek8 G448V (jck) homozygous
  publication: PMID:12421721
  description: >-
    Spontaneous recessive juvenile cystic kidney mutant carrying a Nek8
    missense variant in the RCC1 domain.
  modeled_mechanisms:
  - target: Hippo Pathway YAP/TAZ Dysregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Cystic jck kidneys show nuclear YAP accumulation.
    limitations: >-
      jck is a missense allele that may encode a gain-of-function protein
      (Manning et al. 2013) and gives juvenile polycystic kidney disease, not
      the multiorgan perinatal dysplasia of RHPD2 null alleles.
    evidence:
    - reference: PMID:26967905
      reference_title: "Novel NEK8 Mutations Cause Severe Syndromic Renal Cystic Dysplasia through YAP Dysregulation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "YAP imbalance was also observed in enlarged spheroids of Nek8-invalidated renal epithelial cells grown in 3D culture, as well as in cystic kidneys of Jck mice."
      explanation: YAP imbalance in jck kidneys.
notes: >-
  Lump/split. NEK8 disease appears in three dismech records. (1) This entry:
  autosomal recessive RHPD2 (MONDO:0014174, OMIM:615415), the severe perinatal
  multiorgan end, with its own ClinGen Definitive AR assertion. (2) The
  NEK8-related (nephronophthisis 9) subtype of Nephronophthisis, based on three
  missense alleles in a 588-patient NPHP screen (Otto et al. 2008,
  PMID:18199800). ClinGen's RHPD2 curation lumps NPHP9 into RHPD2, but MONDO
  and OMIM keep separate terms, so this entry does not absorb that subtype. (3)
  The PKD8 (NEK8-related) subtype of Autosomal Dominant Polycystic Kidney
  Disease, from heterozygous missense alleles, with a different inheritance
  and mechanism. RHPD1 (NPHP3) has no dismech entry; NPHP3 appears as a
  Nephronophthisis subtype and as MKS7 in Meckel Syndrome. Conformance: the
  renal node conforms to the ciliopathy_dysfunction cystic kidney node. The
  module's upstream basal body/transition zone node does not fit NEK8, which
  acts in the inversin compartment and is not required for ciliogenesis
  (PMID:23274954), so no upstream conformance is declared.

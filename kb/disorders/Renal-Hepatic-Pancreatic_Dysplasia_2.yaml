      explanation: ClinGen gene-disease validity record classifying this pair as Definitive (AR).
  notes: >-
    Reported alleles include a homozygous nonsense variant with complete loss
    of NEK8 expression through nonsense-mediated decay (Frank et al. 2013),
    missense, nonsense and splice variants in five cases from a ciliopathy
    sequencing cohort (Grampa et al. 2016), and a compound heterozygous c.2069_2070insC
    (p.Ter693LeufsTer86) / c.1043C>T (p.Thr348Met) genotype in two brothers
    (Rajagopalan et al. 2016). Grampa et al. report a genotype-phenotype
    correlation in which missense alleles associate with hypodysplasia and
    nonsense alleles with enlarged cystic organs, and propose a likely
    gain-of-function effect for some missense alleles. The ClinGen curation
    lumps NEK8 nephronophthisis (NPHP9) into this disease entity and states the
    mechanism as biallelic loss of function.

name: Renal-Hepatic-Pancreatic Dysplasia 2
creation_date: "2026-11-03T19:15:04Z"
category: Mendelian
description: >-
  Renal-hepatic-pancreatic dysplasia 2 (RHPD2) is an autosomal recessive
  ciliopathy caused by biallelic NEK8 variants. NEK8 is a NIMA-related
  serine/threonine kinase of the ciliary inversin compartment. The disease
  was first described in fetuses carrying a homozygous NEK8 nonsense variant,
  with enlarged cystic kidneys, liver and pancreas and developmental heart
  disease (an Ivemark II-like picture). Later reports added renal
  hypodysplasia, situs inversus, cardiomegaly with septal hypertrophy, bile
  duct paucity, narrow thorax and short bowed femurs. Most reported patients
  die before or around birth or in the first year of life. A minority survive
  into childhood with progressive kidney and liver failure.

- name: Renal Cystic Dysplasia
  conforms_to: "ciliopathy_dysfunction#Renal Tubular Cystic and Fibrotic Disease"
  description: >-
    The kidneys show cystic dysplasia with incomplete corticomedullary
    differentiation, primitive tubules, metaplastic cartilage and diffuse
    interstitial fibrosis. Nonsense genotypes give enlarged multicystic
    kidneys; missense genotypes give asymmetric hypodysplasia with one kidney
    absent or very small. This specializes the ciliopathy module's cystic
    kidney arm to a developmental dysplasia rather than the later
    tubulointerstitial degeneration of nephronophthisis.

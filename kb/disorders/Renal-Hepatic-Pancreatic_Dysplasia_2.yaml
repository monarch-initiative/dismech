- name: Hippo Pathway YAP/TAZ Dysregulation
  description: >-
    NEK8 binds the Hippo effector TAZ and drives nuclear delivery of the
    TAZ/NEK8 complex. Patient NEK8 variants alter YAP regulation and YAP target
    gene expression in patient fibroblasts and renal cells; YAP imbalance is
    also seen in Nek8-invalidated renal spheroids and in cystic jck mouse
    kidneys. The YAP inhibitor verteporfin partly rescued spheroid and
    zebrafish defects. Missense and null alleles affect YAP differently.

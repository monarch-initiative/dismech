- name: Replication Stress and DNA Damage
  description: >-
    NEK8 acts in the ATR-mediated replication stress response by limiting
    cyclin A-associated CDK activity. Cells lacking NEK8 accumulate DNA
    double-strand breaks, and Nek8 mutant mouse kidneys accumulate DNA damage.
    This branch is shown in cells and mice; its contribution to human RHPD2
    has not been tested.

- name: Inversin Compartment NEK8 Kinase Signaling Failure
  description: >-
    NEK8 sits in the ciliary inversin compartment in a module with ANKS6, INVS
    and NPHP3. In mice, loss of NEK8 kinase activation within the compartment
    gives heterotaxy, cardiopulmonary malformation and cystic kidneys. The
    evidence for this node is from mouse models and cell systems, not from
    patient tissue.

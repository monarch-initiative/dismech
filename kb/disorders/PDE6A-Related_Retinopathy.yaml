name: PDE6A-Related Retinopathy
creation_date: "2026-07-22T22:10:00Z"
category: Mendelian
description: >-
  PDE6A-related retinopathy is an autosomal recessive retinitis pigmentosa
  (historically RP43) caused by biallelic pathogenic variants in PDE6A, encoding
  the alpha catalytic subunit of rod cGMP phosphodiesterase-6 (PDE6). PDE6 is a
  heterotetramer of alpha (PDE6A), beta (PDE6B), and two gamma (PDE6G) subunits
  that hydrolyzes cGMP during phototransduction; this entry is the direct
  mechanistic complement to AIPL1-Related_Retinopathy, whose chaperone product
  folds and assembles this same holoenzyme rather than forming part of it. PDE6A
  mutations disrupt the catalytic domain directly and also destabilize the
  entire PDE6 holoenzyme (loss of PDE6A secondarily depletes PDE6B and PDE6G),
  abolishing cGMP hydrolysis. The resulting cGMP accumulation keeps
  cyclic-nucleotide-gated channels open, sustaining Na+/Ca2+ influx and driving
  rod photoreceptor apoptosis, followed by progressive outer retinal
  degeneration. PDE6A accounts for roughly 3-4% of autosomal recessive RP
  families in North America. A completed PDE6A gene supplementation trial did
  not improve visual function and showed a safety signal (central retinal
  thinning), despite favorable preclinical mouse and canine data -- a notably
  more cautionary translational story than those preclinical results predicted.
  (For the chaperone-defect counterpart see AIPL1-Related_Retinopathy; this
  entry cites no AIPL1 trial and makes no claim about its outcome.)
disease_term:
  preferred_term: PDE6A-related retinopathy
  term:
    id: MONDO:0700224
    label: PDE6A-related retinopathy
synonyms:
- Retinitis pigmentosa 43
- RP43
- PDE6A-related retinitis pigmentosa
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  Do not conflate PDE6A with the classic naturally-occurring rd1 ("retinal
  degeneration 1") mouse, one of the oldest and most widely used inherited
  retinal degeneration models -- rd1 is caused by a defect in PDE6B (the beta
  subunit), not PDE6A. PDE6A and PDE6B are homologous genes encoding the two
  distinct catalytic subunits of the same rod PDE6 holoenzyme and both cause
  clinically similar autosomal recessive RP, but they are genetically distinct
  loci; this entry covers PDE6A specifically. No gene-specific citable evidence
  was found for nyctalopia (night blindness) or spicular/bone-spicule fundus
  pigmentation in PDE6A-RP despite these being classic hallmarks of RP as a
  disease class generally -- rather than support these phenotypes with a
  non-gene-specific citation, they are omitted here; the phenotypes below are
  restricted to findings with direct PDE6A-cohort quantitative support.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PDE6A-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in PDE6A.
  evidence:
  - reference: PMID:7493036
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the alpha subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we examined the gene encoding the alpha subunit of cGMP phosphodiesterase (PDEA) in 340 unrelated patients with RP. We found three point mutations in PDEA in affected members of two pedigrees with recessive RP."
    explanation: >-
      This original gene-discovery paper establishes autosomal recessive
      inheritance for PDE6A-related retinitis pigmentosa.
pathophysiology:
- name: PDE6 Alpha Subunit Loss-of-Function
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic PDE6A variants alter essential functional domains of
    the alpha catalytic subunit of rod cGMP phosphodiesterase and are therefore
    inferred to disrupt its catalytic function; the gene-discovery study made
    that inference from the domain location of the variants rather than from a
    functional assay. PDE6A mutations affecting the catalytic
    domain produce variable biochemical outcomes and degeneration rates,
    indicating allelic heterogeneity.
  gene:
    preferred_term: PDE6A
    modifier: DECREASED
    term:
      id: hgnc:8785
      label: PDE6A
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  molecular_functions:
  - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
    modifier: DECREASED
    term:
      id: GO:0047555
      label: 3',5'-cyclic-GMP phosphodiesterase activity
  downstream:
  - target: Impaired PDE6 Holoenzyme Assembly and cGMP Hydrolysis
    description: >-
      Loss of functional PDE6A destabilizes the entire heterotetrameric PDE6
      holoenzyme, not only its own catalytic contribution.
    evidence:
    - reference: PMID:18775863
      reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the affected retinas also lacked the other PDE6 subunits, suggesting expression of PDE6A is essential for normal expression of PDE6B and PDE6G"
      explanation: >-
        This canine model directly demonstrates that PDE6A loss secondarily
        depletes the other PDE6 holoenzyme subunits.
  evidence:
  - reference: PMID:7493036
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the alpha subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each mutation alters an essential functional domain of the encoded protein and likely disrupts its catalytic function."
    explanation: >-
      This original gene-discovery paper proposes the loss-of-function
      mechanism of PDE6A pathogenic variants. The catalytic consequence is the
      authors' inference from domain location ("likely disrupts") -- no
      functional assay was performed in this study.
  - reference: PMID:18849587
    reference_title: New mouse models for recessive retinitis pigmentosa caused by mutations in the Pde6a gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "significantly different biochemical outcomes and rates of degeneration of murine photoreceptor cells were observed, indicating allelic variation and previously unrecognized structure-function relationships"
    explanation: >-
      This mouse model study of two distinct Pde6a catalytic-domain missense
      alleles establishes an allelic severity gradient.
- name: Impaired PDE6 Holoenzyme Assembly and cGMP Hydrolysis
  biological_scale: MOLECULAR
  description: >-
    The heterotetrameric PDE6 complex (alpha, beta, and two gamma subunits)
    hydrolyzes cGMP in response to light activation of the phototransduction
    cascade. Loss of PDE6A prevents assembly of a functional holoenzyme, and
    affected retinas lack PDE6 enzymatic activity entirely, not merely a
    partial reduction.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: cGMP Accumulation and CNG Channel Constitutive Opening
    description: >-
      Absent PDE6 catalytic activity prevents light-triggered cGMP hydrolysis,
      causing cGMP to accumulate in rod outer segments instead of falling as
      it normally would upon light exposure.
    evidence:
    - reference: PMID:31207907
      reference_title: "The cGMP Pathway and Inherited Photoreceptor Degeneration: Targets, Compounds, and Biomarkers."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PDE6, which is located to the membranous disks within photoreceptor OS, hydrolyses cGMP, leading to the closure of CNGC and a hyperpolarization of the OS due to continued activity of NCKX."
      explanation: >-
        Establishes the normal step this edge removes: PDE6 hydrolyzes outer
        segment cGMP on light activation, so absent PDE6 catalytic activity
        leaves cGMP unhydrolyzed. The same review states elsewhere that
        disease-causing mutations in the PDE6 alpha and beta genes explain
        excessive photoreceptor cGMP levels (that sentence spans an inline
        citation marker and so cannot be quoted verbatim under this
        repository's snippet matcher).
  evidence:
  - reference: PMID:18849587
    reference_title: New mouse models for recessive retinitis pigmentosa caused by mutations in the Pde6a gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The heterotetrameric phosphodiesterase (PDE) 6 complex, made up of alpha, beta and two gamma subunits, regulates intracellular cGMP levels by hydrolyzing cGMP in response to light activation of G protein coupled receptors in cones and rods, making it an essential component of the visual phototransduction cascade"
    explanation: >-
      This establishes the PDE6 holoenzyme composition and its role in cGMP
      hydrolysis during phototransduction.
  - reference: PMID:18775863
    reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Affected retinas lacked PDE6 enzymatic activity."
    explanation: >-
      This canine model directly confirms complete loss of PDE6 enzymatic
      activity as the biochemical consequence of the PDE6A mutation.
- name: cGMP Accumulation and CNG Channel Constitutive Opening
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: CELLULAR
  description: >-
    Excessive accumulation of cGMP in photoreceptors is a common downstream
    mechanism shared by many inherited retinal degeneration genes, including
    PDE6A. Elevated cGMP keeps cyclic-nucleotide-gated channels open, sustaining
    Na+/Ca2+ influx into the outer segment; protein kinase G is the other
    proposed extra-phototransduction target of excess cGMP in photoreceptor
    death, and this entry models the CNG-channel arm only. Plasma cGMP was
    about twice control levels in one PDE6A family, which the authors report as
    indicating a possible role for cGMP as a diagnostic measure, not as a
    measurement of retinal cGMP: it is a single pedigree (seven homozygous
    siblings), seven family members also carry an ABCA4 variant, and no cited
    source proposes a route by which photoreceptor cGMP would raise plasma
    levels. It is treated here as a candidate biomarker observation rather than
    human confirmation of the retinal mechanism.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Rod Photoreceptor Apoptosis and Progressive Retinal Degeneration
    description: >-
      Sustained ion influx and excessive cGMP-dependent signaling in rods
      drives rod photoreceptor apoptosis and halts photoreceptor outer segment
      development.
    evidence:
    - reference: PMID:18775863
      reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Development of photoreceptor outer segments stopped, and rod cells were lost by apoptosis."
      explanation: >-
        This canine model directly demonstrates rod photoreceptor apoptosis
        and arrested outer segment development as the consequence of PDE6A
        loss.
  evidence:
  - reference: PMID:31207907
    reference_title: "The cGMP Pathway and Inherited Photoreceptor Degeneration: Targets, Compounds, and Biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Excessive accumulation of cGMP in photoreceptors is a common denominator in cell death caused by a variety of different gene mutations."
    explanation: >-
      This review establishes cGMP accumulation as a shared final mechanistic
      step across many inherited retinal degeneration genes, including PDE6A.
  - reference: PMID:31207907
    reference_title: "The cGMP Pathway and Inherited Photoreceptor Degeneration: Targets, Compounds, and Biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CNGC opening allows for an influx of Na+ and Ca2+ into the OS, yet, at the same time K+ and Ca2+ ions are constantly extruded via the Na+/Ca2+/K+ exchanger (NCKX)."
    explanation: >-
      Sources the CNG-channel opening and Na+/Ca2+ influx step named in this
      node, which neither of the node's other evidence items mentions. The
      preceding sentence of the same review states that cGMP binds to and opens
      the CNG channel in the photoreceptor outer segment.
  - reference: PMID:27820873
    reference_title: Increased Plasma cGMP in a Family With Autosomal Recessive Retinitis Pigmentosa Due to Homozygous Mutations in the PDE6A Gene.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, patients showed increased plasma levels of cGMP, indicating a possible role for cGMP measurements as part of the clinical tests for this and, after further investigations, maybe other forms of RP."
    explanation: >-
      The authors' own conclusion: raised plasma cGMP in this single family
      indicates a "possible role" for cGMP as a clinical measure, pending
      further investigation. Plasma is a systemic proxy, not retinal outer
      segment cGMP, and seven family members also carried an ABCA4 variant, so
      this is partial, hypothesis-generating support for the node rather than
      human confirmation of the retinal mechanism.
  - reference: PMID:27820873
    reference_title: Increased Plasma cGMP in a Family With Autosomal Recessive Retinitis Pigmentosa Due to Homozygous Mutations in the PDE6A Gene.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean plasma cGMP in patients was approximately twice that in controls."
    explanation: >-
      The measurement itself: plasma cGMP roughly doubled in the seven affected
      siblings of one PDE6A family relative to controls.
- name: Rod Photoreceptor Apoptosis and Progressive Retinal Degeneration
  biological_scale: TISSUE
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    Rod photoreceptor apoptosis begins early and produces progressive,
    rod-predominant retinal degeneration with secondary cone dysfunction,
    consistent with typical retinitis pigmentosa. Full-field electroretinography
    is frequently non-recordable at the time of clinical assessment, and
    cystoid macular edema is a common secondary structural finding.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dark-adapted and light-adapted full-field electroretinography showed no responses in 88 of 108 eyes (81.5%)."
    explanation: >-
      This 57-patient natural history cohort quantifies the frequency of
      non-recordable ERG responses at time of clinical assessment.
  - reference: PMID:18775863
    reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant puppies failed to develop normal rod-mediated ERG responses and had reduced light-adapted a-wave amplitudes from an early age. The residual ERG waveforms originated primarily from cone-driven responses."
    explanation: >-
      This canine model confirms the rod-predominant functional deficit with
      relative cone preservation early in the disease course.
phenotypes:
- category: Ophthalmological
  name: Reduced visual acuity
  frequency: VERY_FREQUENT
  description: >-
    Visual acuity is reduced in the great majority of patients, with mild or
    moderate rather than severe loss in most: mean best-corrected visual acuity
    in a 57-patient cohort was 0.43 logMAR (Snellen 20/50), and impairment was
    mild or moderate in 90% of those patients.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disease was highly symmetrical between the right and left eyes and visual impairment was mild or moderate in 90% of patients, providing a window of opportunity for gene therapy."
    explanation: >-
      This 57-patient natural history cohort gives the severity distribution:
      impairment was mild or moderate in 90% of patients. It describes how
      severe the impairment is, not how often it occurs -- see the next item
      for the basis of the frequency band.
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) best-corrected visual acuity was 0.43 (0.48) logMAR (Snellen equivalent, 20/50)."
    explanation: >-
      A cohort mean best-corrected acuity of 0.43 logMAR (20/50) implies
      reduced acuity across most of the 57 patients, which is the basis for the
      VERY_FREQUENT band; no source reports an explicit proportion of patients
      with reduced acuity, so the band remains a clinical estimate under
      docs/frequency-evidence-guidelines.md.

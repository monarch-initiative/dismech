    term:
      id: CL:0000604
      label: retinal rod cell
  molecular_functions:
  - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
    modifier: DECREASED
    term:
      id: GO:0047555
      label: 3',5'-cyclic-GMP phosphodiesterase activity
  downstream:
  - target: Impaired PDE6 Holoenzyme Assembly and cGMP Hydrolysis
    description: >-
      Loss of functional PDE6A destabilizes the entire heterotetrameric PDE6
      holoenzyme, not only its own catalytic contribution.
    evidence:
    - reference: PMID:18775863
      reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the affected retinas also lacked the other PDE6 subunits, suggesting expression of PDE6A is essential for normal expression of PDE6B and PDE6G"
      explanation: >-
        This canine model directly demonstrates that PDE6A loss secondarily
        depletes the other PDE6 holoenzyme subunits.
  evidence:
  - reference: PMID:7493036
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the alpha subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each mutation alters an essential functional domain of the encoded protein and likely disrupts its catalytic function."
    explanation: >-
      This original gene-discovery paper establishes the loss-of-function
      mechanism of PDE6A pathogenic variants.
  - reference: PMID:18849587
    reference_title: New mouse models for recessive retinitis pigmentosa caused by mutations in the Pde6a gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "significantly different biochemical outcomes and rates of degeneration of murine photoreceptor cells were observed, indicating allelic variation and previously unrecognized structure-function relationships"
    explanation: >-
      This mouse model study of two distinct Pde6a catalytic-domain missense
      alleles establishes an allelic severity gradient.
- name: Impaired PDE6 Holoenzyme Assembly and cGMP Hydrolysis
  biological_scale: MOLECULAR
  description: >-
    The heterotetrameric PDE6 complex (alpha, beta, and two gamma subunits)
    hydrolyzes cGMP in response to light activation of the phototransduction
    cascade. Loss of PDE6A prevents assembly of a functional holoenzyme, and
    affected retinas lack PDE6 enzymatic activity entirely, not merely a
    partial reduction.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: cGMP Accumulation and CNG Channel Constitutive Opening
    description: >-
      Absent PDE6 catalytic activity prevents light-triggered cGMP hydrolysis,
      causing cGMP to accumulate in rod outer segments instead of falling as
      it normally would upon light exposure.
    evidence:
    - reference: PMID:31207907
      reference_title: "The cGMP Pathway and Inherited Photoreceptor Degeneration: Targets, Compounds, and Biomarkers."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "provided an explanation for excessive photoreceptor cGMP levels"
      explanation: >-
        This review directly links PDE6 subunit loss-of-function mutations to
        excessive photoreceptor cGMP accumulation.
  evidence:
  - reference: PMID:18849587
    reference_title: New mouse models for recessive retinitis pigmentosa caused by mutations in the Pde6a gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The heterotetrameric phosphodiesterase (PDE) 6 complex, made up of alpha, beta and two gamma subunits, regulates intracellular cGMP levels by hydrolyzing cGMP in response to light activation of G protein coupled receptors in cones and rods, making it an essential component of the visual phototransduction cascade"
    explanation: >-
      This establishes the PDE6 holoenzyme composition and its role in cGMP
      hydrolysis during phototransduction.
  - reference: PMID:18775863
    reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Affected retinas lacked PDE6 enzymatic activity."
    explanation: >-
      This canine model directly confirms complete loss of PDE6 enzymatic
      activity as the biochemical consequence of the PDE6A mutation.
- name: cGMP Accumulation and CNG Channel Constitutive Opening
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: CELLULAR
  description: >-
    Excessive accumulation of cGMP in photoreceptors is a common downstream
    mechanism shared by many inherited retinal degeneration genes, including
    PDE6A. Elevated cGMP keeps cyclic-nucleotide-gated channels open, sustaining
    Na+/Ca2+ influx. Directly measured plasma cGMP is elevated in PDE6A-RP
    patients, providing human biomarker evidence for this mechanism in vivo,
    not just in animal models.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Rod Photoreceptor Apoptosis and Progressive Retinal Degeneration
    description: >-
      Sustained ion influx and excessive cGMP-dependent signaling in rods
      drives rod photoreceptor apoptosis and halts photoreceptor outer segment
      development.
    evidence:
    - reference: PMID:18775863
      reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Development of photoreceptor outer segments stopped, and rod cells were lost by apoptosis."
      explanation: >-
        This canine model directly demonstrates rod photoreceptor apoptosis
        and arrested outer segment development as the consequence of PDE6A
        loss.
  evidence:
  - reference: PMID:31207907
    reference_title: "The cGMP Pathway and Inherited Photoreceptor Degeneration: Targets, Compounds, and Biomarkers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Excessive accumulation of cGMP in photoreceptors is a common denominator in cell death caused by a variety of different gene mutations."
    explanation: >-
      This review establishes cGMP accumulation as a shared final mechanistic
      step across many inherited retinal degeneration genes, including PDE6A.
  - reference: PMID:27820873
    reference_title: Increased Plasma cGMP in a Family With Autosomal Recessive Retinitis Pigmentosa Due to Homozygous Mutations in the PDE6A Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean plasma cGMP in patients was approximately twice that in controls."
    explanation: >-
      This is direct human biomarker evidence of cGMP elevation in PDE6A-RP
      patients, confirming the mechanism proposed from animal models applies
      in vivo in humans.
- name: Rod Photoreceptor Apoptosis and Progressive Retinal Degeneration
  biological_scale: TISSUE
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    Rod photoreceptor apoptosis begins early and produces progressive,
    rod-predominant retinal degeneration with secondary cone dysfunction,
    consistent with typical retinitis pigmentosa. Full-field electroretinography
    is frequently non-recordable at the time of clinical assessment, and
    cystoid macular edema is a common secondary structural finding.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dark-adapted and light-adapted full-field electroretinography showed no responses in 88 of 108 eyes (81.5%)."
    explanation: >-
      This 57-patient natural history cohort quantifies the frequency of
      non-recordable ERG responses at time of clinical assessment.
  - reference: PMID:18775863
    reference_title: Characterization of a canine model of autosomal recessive retinitis pigmentosa due to a PDE6A mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant puppies failed to develop normal rod-mediated ERG responses and had reduced light-adapted a-wave amplitudes from an early age. The residual ERG waveforms originated primarily from cone-driven responses."
    explanation: >-
      This canine model confirms the rod-predominant functional deficit with
      relative cone preservation early in the disease course.

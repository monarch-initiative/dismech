classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of PDE6A confirms the diagnosis and classifies the allele as
    a known severe (e.g., c.998+1G>A splice) or comparatively milder (e.g.,
    c.304C>A) variant, informing prognosis and clinical trial eligibility.
  results: >-
    Identification of biallelic pathogenic PDE6A variants confirms the
    diagnosis. Homozygosity for the c.998+1G>A splice variant predicts a more
    severe course than homozygosity for c.304C>A.
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant c.998 + 1G>A;p.? led to a more severe phenotype when compared with the variant c.304C>A;p.(R102S)."
    explanation: >-
      This natural history cohort establishes molecular genotyping as
      informative for prognosis in PDE6A-RP.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Dark-adapted and light-adapted full-field ERG characterizes the severity
    of rod and cone dysfunction and is frequently non-recordable at the time
    of clinical presentation.
  results: >-
    No recordable responses in the majority of eyes tested; when present,
    residual waveforms are predominantly cone-driven, reflecting relative
    early preservation of cones over rods.
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dark-adapted and light-adapted full-field electroretinography showed no responses in 88 of 108 eyes (81.5%)."
    explanation: >-
      This directly quantifies the high frequency of non-recordable ERG
      responses at time of clinical assessment.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Fundus autofluorescence (FAF) and optical coherence tomography (OCT) track
    hyperautofluorescent ring area, ellipsoid zone width, and cystoid macular
    edema as structural progression biomarkers, used both diagnostically and
    for clinical trial candidacy assessment.
  results: >-
    A hyperautofluorescent ring is commonly observed on FAF; ellipsoid zone
    width and hyperautofluorescent ring area both decrease over follow-up,
    tracking disease progression. Cystoid macular edema is a frequent
    additional OCT finding.
  evidence:
  - reference: PMID:39218074
    reference_title: PDE6A-Associated Retinitis Pigmentosa, Clinical Characteristics, Genetics, and Natural History.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were statistically significant changes during the follow-up period in terms of BCVA, hyperautofluorescent ring area, and the EZW."
    explanation: >-
      This longitudinal cohort establishes multimodal imaging biomarkers as
      sensitive to disease progression over time.
epidemiology:
- name: Contribution to autosomal recessive retinitis pigmentosa
  description: >-
    PDE6A accounts for approximately 3% to 4% of families with autosomal
    recessive retinitis pigmentosa in North America.
  evidence:
  - reference: PMID:10393062
    reference_title: Frequency of mutations in the gene encoding the alpha subunit of rod cGMP-phosphodiesterase in autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PDE6A gene appears to account for roughly 3% to 4% of families with recessive RP in North America."
    explanation: >-
      This mutation-screening study of 164 unrelated arRP patients establishes
      the population contribution of PDE6A to recessive RP.
progression:
- phase: Presentation with established visual impairment
  age_range: Adulthood (cohort mean baseline age approximately 35 years)
  notes: >-
    Natural history cohorts of PDE6A-RP patients (mean baseline age
    approximately 35 years in the longitudinal cohort cited below) show disease
    highly symmetrical between the two eyes, with mild or moderate visual
    impairment in the great majority of patients at baseline.
  evidence:
  - reference: PMID:39218074
    reference_title: PDE6A-Associated Retinitis Pigmentosa, Clinical Characteristics, Genetics, and Natural History.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age (± standard deviation, range) was 34.8 years (± 17.4, 12-76) at baseline, with a mean follow-up time of 4.8 years."
    explanation: >-
      Sources the baseline age of this phase: mean 34.8 years (range 12-76) at
      first assessment in the longitudinal cohort.
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients were homozygous for disease-causing alleles. Twenty-seven patients were heterozygous for 2 different PDE6A variants each."
    explanation: >-
      Gives the size of the other natural history cohort drawn on in this
      phase: 30 homozygous plus 27 compound heterozygous = 57 patients. (The
      abstract's "Fifty-seven patients ... from 44 families were included"
      sentence carries an inline bracketed standard deviation that this
      repository's snippet matcher strips, so it cannot be quoted verbatim.)
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disease was highly symmetrical between the right and left eyes and visual impairment was mild or moderate in 90% of patients, providing a window of opportunity for gene therapy."
    explanation: >-
      Sources the interocular symmetry and mild-to-moderate severity claims in
      this phase's notes.
- phase: Slow progressive decline
  age_range: Adulthood, over multi-year follow-up
  notes: >-
    Over a mean follow-up of approximately 5 years, best-corrected visual
    acuity, hyperautofluorescent ring area, and ellipsoid zone width all show
    statistically significant decline, confirming PDE6A-RP as slowly but
    measurably progressive.
  evidence:
  - reference: PMID:39218074
    reference_title: PDE6A-Associated Retinitis Pigmentosa, Clinical Characteristics, Genetics, and Natural History.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were statistically significant changes during the follow-up period in terms of BCVA, hyperautofluorescent ring area, and the EZW."
    explanation: >-
      Sources the three progression measures asserted in this phase's notes:
      best-corrected visual acuity, hyperautofluorescent ring area, and
      ellipsoid zone width all changed significantly over follow-up.
  - reference: PMID:39218074
    reference_title: PDE6A-Associated Retinitis Pigmentosa, Clinical Characteristics, Genetics, and Natural History.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age (± standard deviation, range) was 34.8 years (± 17.4, 12-76) at baseline, with a mean follow-up time of 4.8 years."
    explanation: >-
      Sources the baseline age and the approximately 5-year mean follow-up
      duration quoted in this phase.
  - reference: PMID:39218074
    reference_title: PDE6A-Associated Retinitis Pigmentosa, Clinical Characteristics, Genetics, and Natural History.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients in this cohort had mild BCVA loss, and slowly progressive disease, based on FAF and OCT measurements."
    explanation: >-
      The authors' own characterization of the course as slowly progressive,
      which is the basis for this phase's name and notes.

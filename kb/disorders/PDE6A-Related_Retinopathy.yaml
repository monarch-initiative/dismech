name: PDE6A-Related Retinopathy
creation_date: "2026-07-22T22:10:00Z"
category: Mendelian
description: >-
  PDE6A-related retinopathy is an autosomal recessive retinitis pigmentosa
  (historically RP43) caused by biallelic pathogenic variants in PDE6A, encoding
  the alpha catalytic subunit of rod cGMP phosphodiesterase-6 (PDE6). PDE6 is a
  heterotetramer of alpha (PDE6A), beta (PDE6B), and two gamma (PDE6G) subunits
  that hydrolyzes cGMP during phototransduction; this entry is the direct
  mechanistic complement to AIPL1-Related_Retinopathy, whose chaperone product
  folds and assembles this same holoenzyme rather than forming part of it. PDE6A
  mutations disrupt the catalytic domain directly and also destabilize the
  entire PDE6 holoenzyme (loss of PDE6A secondarily depletes PDE6B and PDE6G),
  abolishing cGMP hydrolysis. The resulting cGMP accumulation keeps
  cyclic-nucleotide-gated channels open, sustaining Na+/Ca2+ influx and driving
  rod photoreceptor apoptosis, followed by progressive outer retinal
  degeneration. PDE6A accounts for roughly 3-4% of autosomal recessive RP
  families in North America. Unlike AIPL1, where a first-in-human gene therapy
  trial showed substantial benefit, a completed PDE6A gene supplementation trial
  did not improve visual function and showed a safety signal (central retinal
  thinning), despite favorable preclinical mouse and canine data -- a notably
  more cautionary translational story.
disease_term:
  preferred_term: PDE6A-related retinopathy
  term:
    id: MONDO:0700224
    label: PDE6A-related retinopathy
synonyms:
- Retinitis pigmentosa 43
- RP43
- PDE6A-related retinitis pigmentosa
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  Do not conflate PDE6A with the classic naturally-occurring rd1 ("retinal
  degeneration 1") mouse, one of the oldest and most widely used inherited
  retinal degeneration models -- rd1 is caused by a defect in PDE6B (the beta
  subunit), not PDE6A. PDE6A and PDE6B are homologous genes encoding the two
  distinct catalytic subunits of the same rod PDE6 holoenzyme and both cause
  clinically similar autosomal recessive RP, but they are genetically distinct
  loci; this entry covers PDE6A specifically. No gene-specific citable evidence
  was found for nyctalopia (night blindness) or spicular/bone-spicule fundus
  pigmentation in PDE6A-RP despite these being classic hallmarks of RP as a
  disease class generally -- rather than support these phenotypes with a
  non-gene-specific citation, they are omitted here; the phenotypes below are
  restricted to findings with direct PDE6A-cohort quantitative support.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PDE6A-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in PDE6A.
  evidence:
  - reference: PMID:7493036
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the alpha subunit of rod cGMP phosphodiesterase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we examined the gene encoding the alpha subunit of cGMP phosphodiesterase (PDEA) in 340 unrelated patients with RP. We found three point mutations in PDEA in affected members of two pedigrees with recessive RP."
    explanation: >-
      This original gene-discovery paper establishes autosomal recessive
      inheritance for PDE6A-related retinitis pigmentosa.
pathophysiology:
- name: PDE6 Alpha Subunit Loss-of-Function
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic PDE6A variants alter essential functional domains of
    the alpha catalytic subunit of rod cGMP phosphodiesterase, directly
    disrupting its catalytic function. PDE6A mutations affecting the catalytic
    domain produce variable biochemical outcomes and degeneration rates,
    indicating allelic heterogeneity.
  gene:
    preferred_term: PDE6A
    modifier: DECREASED
    term:
      id: hgnc:8785
      label: PDE6A
  cell_types:

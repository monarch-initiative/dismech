genetic:
- name: PDE6A pathogenic variants
  gene_term:
    preferred_term: PDE6A
    term:
      id: hgnc:8785
      label: PDE6A
  association: Causative
  features: >-
    Biallelic PDE6A variants include missense, nonsense, and splice-site
    changes affecting the catalytic and cGMP-binding domains. In the largest
    reported cohort the most frequently observed alleles were c.304C>A
    (p.R102S), c.998+1G>A (a splice-donor variant), and c.2053G>A (p.V685M);
    the c.998+1G>A splice variant produces a more severe phenotype than
    c.304C>A when homozygous, indicating an allelic severity gradient
    consistent with mouse model data showing variable biochemical outcomes
    across different catalytic-domain alleles.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:7493036
      reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the alpha subunit of rod cGMP phosphodiesterase.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found three point mutations in PDEA in affected members of two pedigrees with recessive RP."
      explanation: >-
        Confirms autosomal recessive inheritance for PDE6A-related RP.
  evidence:
  - reference: PMID:33057649
    reference_title: Clinical Phenotype and Course of PDE6A-Associated Retinitis Pigmentosa Disease, Characterized in Preparation for a Gene Supplementation Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant c.998 + 1G>A;p.? led to a more severe phenotype when compared with the variant c.304C>A;p.(R102S)."
    explanation: >-
      This 57-patient cohort directly compares the clinical severity of the
      two most common PDE6A alleles.
  - reference: PMID:18849587
    reference_title: New mouse models for recessive retinitis pigmentosa caused by mutations in the Pde6a gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these new models reveal that the mutations not only affect the function of the PDE6A protein itself, but also the level of PDE6B within the retina"
    explanation: >-
      This mouse model study confirms that distinct PDE6A catalytic-domain
      alleles have secondary effects on PDE6B levels, supporting an allelic
      severity gradient.
treatments:
- name: AAV8.hPDE6A Gene Supplementation Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal delivery of an adeno-associated viral vector expressing human
    PDE6A cDNA. Preclinical studies in a Pde6a-mutant mouse model and a
    naturally-occurring PDE6A-null canine model both showed favorable
    structural and functional rescue. However, a subsequent non-randomised
    controlled Phase I/IIa human trial in adults with biallelic PDE6A variants
    did NOT improve visual function over 1 year and showed a safety signal
    (central retinal thinning and visual acuity decline in a subset of
    treated eyes), a notably more cautionary outcome than the preclinical data
    predicted.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:29212391
    reference_title: Gene Therapy Successfully Delays Degeneration in a Mouse Model of PDE6A-Linked Retinitis Pigmentosa (RP43).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the ERG analysis confirmed a restoration of retinal function in a group of treated mice"
    explanation: >-
      This mouse model study demonstrates preclinical proof-of-concept for
      AAV-mediated PDE6A gene supplementation.
  - reference: PMID:28676737
    reference_title: Gene Therapy in a Large Animal Model of PDE6A-Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment resulted in improvement in dim light vision and evidence of rod function on electroretinographic examination."
    explanation: >-
      This canine large-animal model further supported preclinical efficacy
      of PDE6A gene supplementation prior to human trials.
  - reference: PMID:40825661
    reference_title: "Safety and vision outcomes of subretinal gene supplementation therapy in PDE6A-associated retinitis pigmentosa: a non-randomised controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Subretinal gene therapy with AAV8.hPDE6A did not improve visual function over 1 year and posed risks, including central retinal thinning and visual acuity decline. This is in contrast to the safety and efficacy profile established in preclinical models."
    explanation: >-
      This completed Phase I/IIa human trial (9 patients) directly reports
      lack of efficacy and a safety signal, materially diverging from the
      favorable preclinical results.
- name: Avoidance of PDE5 Inhibitors (Counseling Caution)
  therapeutic_modality: OTHER
  description: >-
    PDE5 inhibitors (sildenafil, vardenafil) have only 10- to 15-fold lower
    specificity for retinal PDE6 than for PDE5, owing to close structural and
    kinetic similarity between the two enzyme families. This cross-reactivity
    can cause transient visual disturbances in the general population, and
    regulatory agencies including the FDA specifically caution about the lack
    of controlled safety data for these drugs in patients with retinitis
    pigmentosa or a family history of the disease. Animal evidence suggests
    carriers of some recessive retinal-dystrophy alleles may be more sensitive
    to sildenafil toxicity, making this a relevant counseling point for
    PDE6A-RP patients and carriers.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33809319
    reference_title: "Visual Side Effects Linked to Sildenafil Consumption: An Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sildenafil and vardenafil, for example, have shown only 10 and 15 times lower specificity for PDE6 than for PDE5, respectively"
    explanation: >-
      This review quantifies the structural cross-reactivity between PDE5
      inhibitors and retinal PDE6, the mechanistic basis for the counseling
      caution.
  - reference: PMID:33809319
    reference_title: "Visual Side Effects Linked to Sildenafil Consumption: An Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Important regulatory agencies such as the U.S. Food and Drug Administration (FDA, www.fda.gov, accessed on 20 December 2020) and the European Medicines Agency (EMA, www.ema.europa.eu, accessed on 20 December 2020), and associations of eye physicians and surgeons such as the American Academy of Ophthalmology (www.aao.org, accessed on 20 December 2020) warn about the lack of controlled clinical data on the safety of sildenafil in patients with retinitis pigmentosa or with a family history of the disease."
    explanation: >-
      Sources the regulatory-caution claim in this treatment's description,
      which the other two snippets did not cover.
  - reference: PMID:33809319
    reference_title: "Visual Side Effects Linked to Sildenafil Consumption: An Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "caution should be taken in patients with a family history of retinal dystrophy because available evidence in animal research supports the hypothesis that carriers of some recessive alleles are more sensitive to sildenafil toxicity"
    explanation: >-
      This directly supports the clinical counseling recommendation for
      patients and carriers of PDE6A and other recessive retinal dystrophy
      alleles.
- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling is indicated given the autosomal recessive inheritance
    pattern, and molecular allele classification is prognostically relevant
    given the demonstrated allelic severity gradient.
  treatment_term:

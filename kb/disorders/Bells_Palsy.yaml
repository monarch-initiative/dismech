- name: Facial function and synkinesis grading
  description: >-
    House-Brackmann and Sunnybrook scores document baseline severity and recovery. For persistent synkinesis,
    Sunnybrook or eFACE assessment and the Synkinesis Assessment Questionnaire capture clinician and patient
    perspectives; a global facial score alone can miss the pattern or impact of involuntary movements.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4150706/
    reference_title: 'Management of Bell palsy: clinical practice guideline - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Commonly used facial grading instruments (e,g., House–Brackmann and Sunnybrook scales) quantify the severity

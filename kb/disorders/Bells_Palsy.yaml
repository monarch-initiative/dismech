    reference_title: 'Pathogenesis, diagnosis and therapy of facial synkinesis: A systematic review and clinical practice recommendations by the international head and neck scientific group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Many patients with Bell's palsy fortunately only develop neurapraxia, i.e., a transient blockage of facial
      nerve conduction without axonal damage
    explanation: >-

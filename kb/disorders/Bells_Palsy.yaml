- name: Misguided facial motor axon regeneration
  description: >-
    Regenerating motor axons may send collateral sprouts into inappropriate facial nerve branches, coupling
    muscles that should move independently. This established regeneration model explains post-paralytic synkinesis;
    ephaptic transmission and central remodeling are additional proposed contributors with different levels

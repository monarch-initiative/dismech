epidemiology:
- name: Age and clinical risk-factor distribution
  description: >-
    Bell's palsy can occur at any age, but incidence rises with age and is
    increased in people with diabetes, hypertension, obesity, pregnancy, and
    recent upper respiratory tract infection.
  factors:
  - age
  - diabetes
  - hypertension
  - pregnancy
  - obesity
  - upper respiratory tract infection
  evidence:
  - reference: PMID:36397921
    reference_title: "Bell's Palsy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both sexes are equally affected, and though no age is immune, its incidence rises with increasing age."
    explanation: This supports the age distribution of Bell's palsy as a disorder that can occur broadly but becomes more common with increasing age.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36397921
    reference_title: "Bell's Palsy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk is high in diabetics, hypertensives, women who are pregnant, obese, and people with upper respiratory tract infections."
    explanation: This supports several commonly cited clinical risk groups and comorbidity associations.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Migraine-associated risk enrichment
  description: >-
    A Korean insurance cohort associated migraine with a small increase in subsequent Bell's palsy risk: adjusted
    hazard ratio 1.16 (95% CI 1.01-1.33). Administrative diagnoses and treatment-based case selection do not
    establish a causal effect of migraine. The publication's abstract gives an inconsistent P value, so the
    effect estimate and confidence interval are the interpretable summary.
  factors:
  - migraine
  evidence:
  - reference: PMID:31124964
    reference_title: 'Increased risk of Bell palsy in patient with migraine: A longitudinal follow-up study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The adjusted HR of Bell palsy was 1.16 in the migraine group compared with the control group
    explanation: >-
      This is a modest observational association in matched insurance records, not proof of a shared causal
      mechanism.
    quote_role: PRIMARY_RESULT
- name: Recurrence burden
  description: >-
    Recurrence is recognized in a minority of patients. Published estimates vary; a narrative review summarizes
    a 4-14% range. Recurrent or otherwise atypical palsy warrants reconsideration of alternative diagnoses.
  evidence:
  - reference: PMID:36397921
    reference_title: "Bell's Palsy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Four to 14 percent of patients may experience recurrence, with 36 percent suffering from palsy on the
      same side
    explanation: >-
      This is a review-level range, not a uniform prospective recurrence estimate.
    quote_role: REVIEW_SYNTHESIS
progression:
- phase: Acute onset phase
  notes: >-
    Facial weakness typically appears suddenly and progresses to maximal
    deficit over the first 48 hours.
  evidence:
  - reference: PMID:36397921
    reference_title: "Bell's Palsy: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bell's palsy, also known as \"acute facial palsy of unknown cause\", is a common cranial neuropathy leading to facial muscle paresis or complete paralysis characteristically on one side, occurring suddenly and may progress over 48 hours."
    explanation: This supports the typical abrupt onset and short early progression window.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Recovery and sequelae phase
  notes: >-
    Recovery develops over weeks to months and varies with initial severity. Early improvement is distinct
    from complete recovery. Adult trials assess complete recovery at three to twelve months; in the pediatric
    BellPIC trial, 57% of placebo recipients had complete recovery at one month and 93% at six months. Persistent
    weakness, synkinesis and psychosocial distress can remain. These trial-specific estimates should not be
    generalized to every age or severity group.
  evidence:
  - reference: PMID:36008143
    reference_title: 'Efficacy of Prednisolone for Bell Palsy in Children: A Randomized, Double-Blind, Placebo-Controlled, Multicenter Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At 1 month, the proportions of patients who had recovered facial function were 49% (n = 43/87) in the
      prednisolone group compared with 57% (n = 50/87) in the placebo group
    explanation: >-
      The pediatric trial distinguishes one-month recovery from later improvement.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37752723
    reference_title: 'Psychosocial functioning in patients with altered facial expression: a scoping review in five neurological diseases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Bell's palsy, myotonic dystrophy type 1, and Parkinson's disease patients more often experienced some
      degree of psychosocial distress than healthy controls.
    explanation: >-
      The Bell's palsy subgroup supports psychosocial morbidity without assigning a psychiatric diagnosis or
      prevalence.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34640384
    reference_title: Clinical Prognostic Factors Associated with Good Outcomes in Pediatric Bell's Palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our results showed that the most important factor influencing the complete recovery of Bell's palsy in
      children was the lower initial H-B grade at initial presentation.
    explanation: >-
      The 88-child retrospective cohort associated milder initial palsy with recovery; its nonrandomized treatment
      comparisons do not establish treatment efficacy.
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Putative herpesvirus reactivation
  description: >-
    Reactivation of latent HSV-1 is one proposed initiating event, not an established cause in every idiopathic
    case. A small prospective study detected HSV-1 DNA in endoneurial fluid or posterior auricular muscle from
    11 of 14 Bell's palsy patients, compared with none of nine Ramsay Hunt patients and twelve other controls.
    Detection in selected clinical samples supports the hypothesis but does not establish timing, causal sufficiency
    or population prevalence.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:7503474
    reference_title: 'Bell palsy and herpes simplex virus: identification of viral DNA in endoneurial fluid and muscle.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Herpes simplex virus type 1 genomes were detected in 11 of 14 patients (79%) with Bell palsy but not
      in patients with the Ramsay-Hunt syndrome or in other controls.
    explanation: >-
      This human molecular observation is evidence for a viral hypothesis, not proof that all Bell's palsy
      is infectious.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Facial nerve inflammation
    description: >-
      Proposed viral initiation of local inflammation; causality is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4150706/
      reference_title: 'Management of Bell palsy: clinical practice guideline - PMC'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The major cause of Bell palsy is believed to be an infection of the facial nerve by the herpes simplex
        virus.
      explanation: >-
        The phrase 'believed' denotes an etiologic model; the small PCR study supports, but does not settle,
        that model.
      quote_role: REVIEW_SYNTHESIS
    hypothesis_groups:
    - VIRAL_REACTIVATION
  locations:

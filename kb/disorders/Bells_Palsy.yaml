genetic:
- name: Common susceptibility locus at 6p21.1
  association: SUSCEPTIBILITY
  notes: >-
    The common intergenic rs9357446-A allele at 6p21.1 was associated with Bell's palsy in 4,714 cases and
    1,011,520 controls from Iceland, the UK, Denmark and Finland (OR 1.23). The risk allele was common, not
    a high-penetrance Mendelian cause. Linked variants were noncoding; no correlated coding or structural variant
    was identified. Blood/adipose and 18 other expression datasets did not nominate an expression target, and
    4,792 plasma-protein measurements did not establish a protein effect. Nearby CDC5L and SLC35B2 remain speculative
    candidates, not proven causal genes. Noncoding location alone does not establish enhancer disruption or
    a regulatory target.
  evidence:
  - reference: PMID:33602968
    reference_title: "A meta-analysis uncovers the first sequence variant conferring risk of Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report findings from a meta-analysis of genome-wide association studies uncovering the first unequivocal association with Bell's palsy (rs9357446-A; P = 6.79 × 10-23, OR = 1.23; Ncases = 4714, Ncontrols = 1,011,520)."
    explanation: This supports a reproducible common-genetic susceptibility signal for Bell's palsy.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:33602968
    reference_title: A meta-analysis uncovers the first sequence variant conferring risk of Bell's palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The variant is not correlated (r2 < 0.2) with any known coding or structural variants.
    explanation: >-
      This restricts the associated locus to an unresolved noncoding signal.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33602968
    reference_title: A meta-analysis uncovers the first sequence variant conferring risk of Bell's palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We examined cis-eQTL in blood and adipose tissue in Iceland and did not find an association between rs9357446
      and expression of nearby genes (Supplementary Note).
    explanation: >-
      Negative expression analyses do not support naming a regulatory target gene.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Clinical history and neurologic physical examination
  description: >-
    Diagnosis requires acute peripheral facial weakness and a focused history, full neurologic examination,
    ear/skin examination and assessment of eye closure. Forehead involvement supports a peripheral pattern
    but is not sufficient to exclude every stroke. Typical new-onset Bell's palsy does not require routine
    laboratory tests or imaging; targeted investigation follows exposure history, systemic signs, progression
    or other atypical findings.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:39939082
    reference_title: "Bell's Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on a thorough history and physical examination, with careful attention to exclude other causes of facial weakness, such as stroke or Lyme disease."
    explanation: This directly supports diagnosis by focused clinical evaluation and exclusion of key mimics.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should not obtain routine laboratory testing in patients with new-onset Bell's palsy
    explanation: >-
      The recommendation applies to a typical clinical presentation, not to a patient with features suggesting
      another cause.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should not routinely perform diagnostic imaging for patients with new-onset Bell's palsy
    explanation: >-
      Routine imaging is unnecessary in otherwise typical new-onset disease.
    quote_role: REVIEW_SYNTHESIS
- name: Selective electromyography
  description: >-
    AAO-HNSF guidance advises against electrodiagnostic testing for typical incomplete facial paresis and permits
    it in complete paralysis. Needle EMG can assess axonal degeneration, reinnervation and established synkinesis;
    denervation changes may not appear until 10-14 days, with testing most informative from about two to three
    weeks. The 2020 international electrodiagnostic guideline notes that some national guidelines recommend
    broader testing.
  diagnosis_term:
    preferred_term: electromyography procedure
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should not perform electrodiagnostic testing in Bell's palsy patients with incomplete facial
      paralysis
    explanation: >-
      This prevents routine EMG recommendations based only on a trial's testing protocol.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:32270328
    reference_title: 'Facial nerve electrodiagnostics for patients with facial palsy: a clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Signs of muscle degeneration cannot be seen by EMG before 10–14 days.
    explanation: >-
      An early normal EMG does not exclude evolving axonal injury.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:32270328
    reference_title: 'Facial nerve electrodiagnostics for patients with facial palsy: a clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In contrast, the German and the Spanish guidelines recommend electrodiagnostics for all patients with
      Bell’s palsy
    explanation: >-
      Specialty guidance differs on the breadth of testing; the AAO-HNSF recommendation is identified by source.
    quote_role: REVIEW_SYNTHESIS
- name: Electroneuronography in complete paralysis
  description: >-
    Electroneuronography compares evoked facial-muscle responses between affected and unaffected sides to estimate
    degeneration. In complete palsy it can inform prognosis, interpreted together with EMG and clinical severity.
    Responses may remain normal during the first 72 hours; the useful acute window is approximately 72 hours
    to 21 days. Severe degeneration is a prognostic finding, not proof that decompression surgery will improve
    outcome.
  diagnosis_term:
    preferred_term: nerve conduction study
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:32270328
    reference_title: 'Facial nerve electrodiagnostics for patients with facial palsy: a clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      ENoG can show completely normal results during this 72-h window.
    explanation: >-
      Wallerian degeneration has not necessarily reached the distal stimulation segment immediately after an
      intratemporal lesion.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:32270328
    reference_title: 'Facial nerve electrodiagnostics for patients with facial palsy: a clinical practice guideline.'

- name: Eye lubrication and eyelid protection
  description: >-
    Protect the cornea whenever eye closure or blinking is incomplete. Lubricating drops during the day and
    lubricating ointment with assisted eyelid closure at night reduce exposure. Eye pain, redness or visual
    symptoms require reassessment. Eye care remains necessary regardless of whether corticosteroids or antivirals
    are used.

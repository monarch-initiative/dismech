      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The synkinesis is a result of misguided nerve regeneration following axonal damage.
      explanation: >-
        This supports aberrant regeneration as the principal explanatory process for synkinesis.
      quote_role: REVIEW_SYNTHESIS
  locations:

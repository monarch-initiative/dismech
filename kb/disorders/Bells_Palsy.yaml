differential_diagnoses:
- name: Stroke
  disease_term:
    preferred_term: stroke disorder
    term:
      id: MONDO:0005098
      label: stroke disorder
  description: >-
    Acute facial weakness from stroke can mimic Bell's palsy, but Bell's
    palsy produces a peripheral facial weakness pattern and is diagnosed only
    after alternative causes are excluded.
  distinguishing_features:
  - Typical Bell's palsy affects the upper and lower ipsilateral face. Forehead sparing suggests a supranuclear lesion, but forehead involvement alone cannot exclude a brainstem lesion.
  - Additional limb weakness, ataxia, diplopia or other neurologic deficits require urgent evaluation for an alternative diagnosis.
  evidence:
  - reference: PMID:39939082
    reference_title: "Bell's Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on a thorough history and physical examination, with careful attention to exclude other causes of facial weakness, such as stroke or Lyme disease."
    explanation: This directly supports stroke as an important alternative diagnosis that must be excluded.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.rch.org.au/clinicalguide/guideline_index/Facial_weakness_and_Bells_palsy/
    reference_title: 'Clinical Practice Guidelines : Facial weakness and Bell palsy'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Other neurological features such as severe headache, blurred vision, double vision, weakness/numbness
      in arms or extremities, ataxia
    explanation: >-
      Associated neurologic signs are red flags rather than part of uncomplicated Bell's palsy.
    quote_role: REVIEW_SYNTHESIS
- name: Lyme disease
  disease_term:
    preferred_term: Lyme disease
    term:
      id: MONDO:0019632
      label: Lyme disease
  description: >-
    Lyme neuroborreliosis can present with acute facial palsy and should be
    considered in the appropriate epidemiologic setting.
  distinguishing_features:
  - Lyme disease is suggested by tick exposure, compatible geography, systemic symptoms, or other evidence of Borrelia infection.
  - Bell's palsy remains idiopathic after focused evaluation and exclusion of alternative infectious causes.
  evidence:
  - reference: PMID:39939082
    reference_title: "Bell's Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on a thorough history and physical examination, with careful attention to exclude other causes of facial weakness, such as stroke or Lyme disease."
    explanation: This directly supports Lyme disease as a clinically important differential diagnosis for Bell's palsy.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Melkersson-Rosenthal syndrome
  disease_term:
    preferred_term: Melkersson-Rosenthal syndrome
    term:
      id: MONDO:0007969
      label: Melkersson-Rosenthal syndrome
  description: >-
    Melkersson-Rosenthal syndrome can include facial paralysis, but it is
    distinguished by recurrent disease together with lip or facial edema and a
    fissured tongue.
  distinguishing_features:
  - Melkersson-Rosenthal syndrome includes additional recurrent orofacial edema and fissured tongue rather than isolated acute idiopathic facial weakness.
  - Bell's palsy is typically an isolated acute peripheral facial palsy without the classic granulomatous syndrome features.
  evidence:
  - reference: PMID:40255708
    reference_title: "Cheilitis Granulomatosa: A Case Report of a Sarcoid Mimic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CG can occur as an isolated condition or as part of Melkersson-Rosenthal syndrome, which also includes facial paralysis and a fissured tongue."
    explanation: >-
      The case-report background describes the Melkersson-Rosenthal syndrome triad; the reported patient did
      not establish a Bell's palsy mechanism.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Ramsay Hunt syndrome and other otologic causes
  description: >-
    Varicella-zoster-associated peripheral facial palsy, otitis media, mastoiditis and other ear disease require
    a different etiologic diagnosis. Ear or oral vesicles, severe otalgia, hearing or vestibular symptoms,
    or abnormal otoscopy should prompt targeted assessment.
  distinguishing_features:
  - Ramsay Hunt syndrome can produce ear-canal or facial vesicles with peripheral facial palsy.
  - Severe pain or local ear findings favor a specific otologic or infectious cause over uncomplicated idiopathic palsy.
  evidence:
  - reference: url:https://www.rch.org.au/clinicalguide/guideline_index/Facial_weakness_and_Bells_palsy/
    reference_title: 'Clinical Practice Guidelines : Facial weakness and Bell palsy'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Skin lesions or vesicles on the face or in the ear canal (Ramsay Hunt Syndrome)
    explanation: >-
      The pediatric guideline identifies vesicles as a discriminator.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.rch.org.au/clinicalguide/guideline_index/Facial_weakness_and_Bells_palsy/
    reference_title: 'Clinical Practice Guidelines : Facial weakness and Bell palsy'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Severe pain (may indicate mastoiditis, VZV)
    explanation: >-
      Severe otalgia is a red flag for an alternative otologic or infectious cause.
    quote_role: REVIEW_SYNTHESIS
- name: Structural facial nerve lesions
  description: >-
    Facial nerve schwannoma, skull-base neoplasm or parotid pathology may cause progressive or nonrecovering
    facial weakness. Persistent progression requires reassessment and imaging rather than indefinite attribution
    to Bell's palsy.
  distinguishing_features:
  - Progressive weakness or failure to improve prompts investigation of the facial nerve course.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4150706/
    reference_title: 'Management of Bell palsy: clinical practice guideline - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Referral to a specialist may avoid missed diagnoses of malignant skull-base neoplasms
    explanation: >-
      The guideline highlights structural mimics in patients who fail to improve.
    quote_role: REVIEW_SYNTHESIS

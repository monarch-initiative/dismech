      explanation: >-
        Review-level mechanistic rationale for corticosteroid treatment.
      quote_role: REVIEW_SYNTHESIS
- name: Adjunctive antiviral therapy
  description: >-
    Acyclovir or valacyclovir may be offered with corticosteroids within 72 hours, with discussion of uncertain
    additional recovery benefit; antiviral monotherapy is not recommended. The 2019 Cochrane analysis restricted
    to trials at lower risk of bias found no clear improvement in incomplete recovery (RR 0.81, 95% CI 0.38-1.74),
    including an imprecise severe-palsy subgroup. Combination treatment probably reduces the composite late
    outcome of synkinesis or crocodile tears. A small 50-patient trial reported better recovery with add-on
    acyclovir, but this does not override the larger trials or pooled uncertainty.
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: acyclovir
      term:
        id: CHEBI:2453
        label: acyclovir
    - preferred_term: valacyclovir
      term:
        id: CHEBI:35854
        label: valacyclovir
  evidence:
  - reference: PMID:31486071
    reference_title: Antiviral treatment for Bell's palsy (idiopathic facial paralysis).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The combination of antivirals and corticosteroids may have little or no effect on rates of incomplete
      recovery in comparison to corticosteroids alone in Bell's palsy of various degrees of severity, or in
      people with severe Bell's palsy, but the results were very imprecise.
    explanation: >-
      The synthesis separates uncertain facial recovery benefit from sequelae reduction.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31486071
    reference_title: Antiviral treatment for Bell's palsy (idiopathic facial paralysis).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The combination of antivirals and corticosteroids probably reduced the late sequelae of Bell's palsy
      compared with corticosteroids alone.
    explanation: >-
      The pooled composite of motor synkinesis or crocodile tears favored combination therapy (RR 0.56, 95%
      CI 0.36-0.87, two trials with 469 participants); it is not a separate estimate for each component.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27689547
    reference_title: "Steroid/Antiviral for the treatment of Bell's palsy: Double blind randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At the end of the 3rd month, 17 patients (68%) had good recovery and 8 patients (32%) had poor recovery
      in the steroid group compared with 23 patients (92%) and 2 (8%) respectively in the steroid and antiviral
      group
    explanation: >-
      The small trial reports a positive comparison that must be considered alongside larger studies and risk-of-bias-sensitive
      synthesis.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should not prescribe oral antiviral therapy alone for patients with new-onset Bell's palsy
    explanation: >-
      Antivirals alone are not a recommended substitute for corticosteroids.
    quote_role: REVIEW_SYNTHESIS
  therapeutic_modality: SMALL_MOLECULE

description: >-
  Bell's palsy is an acute idiopathic peripheral facial neuropathy, usually producing unilateral weakness of
  the upper and lower face. Inflammatory swelling and compression of cranial nerve VII in the facial canal
  form the leading mechanistic model, while the initiating cause remains uncertain. Viral reactivation and
  common genetic susceptibility are proposed contributors. Most patients improve over weeks to months, but
  axonal injury can leave persistent weakness or synkinesis.

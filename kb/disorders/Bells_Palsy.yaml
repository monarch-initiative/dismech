- name: Facial nerve conduction impairment
  description: >-
    Reduced conduction through affected facial nerve fibers produces lower motor neuron facial weakness and
    can disturb facial-nerve-associated taste, stapedius function and tear secretion. In neurapraxia, conduction
    block occurs without axonal disruption and can recover without the regeneration required for synkinesis.
  biological_scale: TISSUE
  evidence:

    explanation: >-
      Persistent or progressive dysfunction changes the investigation threshold.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Early oral corticosteroids in adults
  description: >-
    Oral corticosteroids improve recovery in adults when started within 72 hours; the AAO-HNSF recommendation
    applies to patients aged 16 years and older. Two large placebo-controlled factorial trials support prednisolone.
    In the 2007 study, complete recovery at three months was 83.0% with prednisolone versus 63.6% without it,
    and at nine months 94.4% versus 81.6%. These are factorial comparisons, not a comparison of combination
    therapy with double placebo. Contraindications and individual risks still require clinical assessment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  evidence:
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should prescribe oral steroids within 72 hours of symptom onset for Bell's palsy patients
      16 years and older
    explanation: >-
      This provides the treatment window and age scope.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:17942873
    reference_title: Early treatment with prednisolone or acyclovir in Bell's palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In patients with Bell's palsy, early treatment with prednisolone significantly improves the chances of
      complete recovery at 3 and 9 months.
    explanation: >-
      The 551-participant randomized factorial trial supports adult steroid benefit.
    quote_role: PRIMARY_RESULT
  - reference: PMID:18849193
    reference_title: "Prednisolone and valaciclovir in Bell's palsy: a randomised, double-blind, placebo-controlled, multicentre trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Prednisolone shortened the time to complete recovery in patients with Bell's palsy, whereas valaciclovir
      did not affect facial recovery.
    explanation: >-
      An independent multicenter trial randomized 839 adults and analyzed 829, corroborating prednisolone benefit.
    quote_role: PRIMARY_RESULT
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Facial nerve edema within the facial canal
    description: >-
      Anti-inflammatory therapy is intended to reduce swelling; efficacy trials establish recovery benefit,
      not direct measurement of local nerve edema.
    evidence:
    - reference: PMID:36397921
      reference_title: "Bell's Palsy: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Prednisone and other oral corticosteroids reduce nerve swelling and may speed up the recovery of facial

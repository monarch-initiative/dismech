- name: 'Prednisolone in children: uncertain benefit'
  description: >-
    Adult corticosteroid efficacy should not be assumed in younger children. BellPIC randomized 187 children
    aged six months to under 18 years within 72 hours, rather than the planned 540. Ten days of prednisolone
    did not improve complete recovery at one month (49% versus 57% with placebo); the study was underpowered
    and cannot exclude important benefit or harm. Most children recovered by six months. Pediatric guidance
    therefore describes insufficient evidence for routine early prednisolone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:36008143
    reference_title: 'Efficacy of Prednisolone for Bell Palsy in Children: A Randomized, Double-Blind, Placebo-Controlled, Multicenter Trial.'

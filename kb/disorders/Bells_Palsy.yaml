- name: Facial nerve axonal injury
  description: >-
    More severe lesions include axonal degeneration rather than isolated neurapraxia. Wallerian degeneration
    reaches distal segments after a delay, explaining why early distal electrical responses may remain intact.
    Axonal injury increases the possibility of incomplete recovery and creates the substrate for abnormal reinnervation.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:36438936
    reference_title: 'Pathogenesis, diagnosis and therapy of facial synkinesis: A systematic review and clinical practice recommendations by the international head and neck scientific group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Only those patients with Bell's palsy and axonal damage can develop facial synkinesis.
    explanation: >-
      The synkinesis review identifies axonal damage as a prerequisite, not a universal feature of Bell's palsy.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Misguided facial motor axon regeneration
    description: >-
      Regeneration after axonal injury may be misdirected; this does not occur after pure neurapraxia.

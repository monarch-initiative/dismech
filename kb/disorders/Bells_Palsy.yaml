    explanation: >-
      The participant-flow groups are oral standard care, standard care plus injection and injection alone,
      respectively. The extreme imbalance precludes a reliable comparative treatment estimate.
    quote_role: PRIMARY_RESULT
- name: 'Laser acupuncture and photobiomodulation: investigational'
  description: >-
    A single-center randomized trial in 84 adults with persistent palsy reported better facial grading and
    electrophysiologic outcomes with combined laser acupuncture/photobiomodulation than with lower-intensity
    laser exposure. Treating physicians were unblinded and the comparator delivered laser energy. Inconsistent
    duration and follow-up reporting and lack of independent replication limit interpretation; this is not
    established routine treatment or evidence for a specific molecular mechanism. The trial excluded complete
    paralysis and marked electrophysiologic degeneration, limiting applicability to the most severe cases.
  therapeutic_modality: DEVICE
  treatment_term:

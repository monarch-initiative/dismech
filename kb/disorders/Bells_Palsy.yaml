notes: >-
  The CMAJ full-text guideline is PMID:24934895; the generated PMC URL supplies its full recommendations because
  the PMID cache contains metadata only. The James Cook University PDF is the author manuscript of BellPIC
  (PMID:36008143); final PubMed abstract estimates are used where numerical details differ. The common-risk
  GWAS DOI identifies a publication, not a separately accessioned dataset. No single causal gene has been established
  at the 6p21.1 locus.
mechanistic_hypotheses:
- hypothesis_group_id: VIRAL_REACTIVATION
  hypothesis_label: Herpesvirus reactivation as a possible initiating event
  status: ALTERNATIVE
  description: >-
    HSV-1 reactivation is a plausible initiating hypothesis supported by viral-DNA detection in selected clinical
    samples. It is not a demonstrated universal cause, and trials of antiviral treatment do not provide consistent
    evidence for added complete-recovery benefit.
  evidence:
  - reference: PMID:7503474
    reference_title: 'Bell palsy and herpes simplex virus: identification of viral DNA in endoneurial fluid and muscle.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Herpes simplex virus type 1 genomes were detected in 11 of 14 patients (79%) with Bell palsy but not
      in patients with the Ramsay-Hunt syndrome or in other controls.
    explanation: >-
      This human molecular observation is evidence for a viral hypothesis, not proof that all Bell's palsy
      is infectious.
    quote_role: PRIMARY_RESULT
discussions:
- discussion_id: INFLAMMATORY_PROTEOMICS
  prompt: Which inflammatory protein associations contribute causally to idiopathic facial nerve injury?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  rationale: >-
    A 2025 Mendelian-randomization and protein-network study nominated JAK/STAT-related inflammatory candidates.
    It used relaxed instrument thresholds, nominal testing and computational network hubs without direct facial-nerve
    experiments. The table reports low shared-variant posterior probabilities for CCL19, VCAM1, IL27RA and
    OSM (approximately 0.007-0.022), despite stronger claims in the discussion. These findings do not establish
    a causal edge from JAK/STAT activation to facial nerve edema or a clinical role for JAK inhibitors.
  evidence:
  - reference: PMID:40299566
    reference_title: Exploring the Role of Inflammation and Metabolites in Bell's Palsy and Potential Treatment Strategies.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: DIRECT
    snippet: >-
      Four proteins, VCAM-1 (PP.H4: 0.022), CCL19 (PP.H4: 0.007), OSM (PP.H4: 0.011), and IL27RA (PP.H4: 0.02)
    explanation: >-
      The reported low PP.H4 values do not constitute strong support for a shared causal variant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40299566
    reference_title: Exploring the Role of Inflammation and Metabolites in Bell's Palsy and Potential Treatment Strategies.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: DIRECT
    snippet: >-
      composed of six hub proteins: JAK2, IL27RA, OSM, CCL19, SELL, and VCAM-1.
    explanation: >-
      Protein-network analysis nominated these hubs; it did not measure pathway activation in an affected human
      facial nerve.
    quote_role: PRIMARY_RESULT
- discussion_id: SLIT2_REPAIR
  prompt: Does SLIT2-ROBO signaling modify repair in human idiopathic facial palsy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    A 2025 study combined Bell's palsy genetic associations with single-cell profiling and SLIT2 immunofluorescence
    in rat facial motor nuclei after mechanical nerve crush. Nominal plasma-protein MR associations and altered
    expression generate a repair hypothesis. Its PPH3+PPH4 threshold combines distinct-variant and shared-variant
    hypotheses and therefore does not by itself prove colocalization. CellChat and pseudotime are computational
    inferences; no SLIT2 perturbation or therapeutic rescue was performed. The rat lesion and central nuclear
    response do not reproduce the unknown initiating cause of human Bell's palsy.
  evidence:
  - reference: PMID:41099890
    reference_title: 'A Multi-omics Exploration Revealing SLIT2 as a Prime Therapeutic Target for Peripheral Facial Paralysis: Integrating Single-Cell Transcriptomics and Plasma Proteome Data.'
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: DIRECT
    snippet: >-
      Due to the limited power of colocalization analysis, we focused on genes with a combined posterior probability
      (PPH3 + PPH4) ≥ 0.8
    explanation: >-
      A sum including PPH3 cannot establish that exposure and disease share a single causal variant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41099890
    reference_title: 'A Multi-omics Exploration Revealing SLIT2 as a Prime Therapeutic Target for Peripheral Facial Paralysis: Integrating Single-Cell Transcriptomics and Plasma Proteome Data.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Immunofluorescence experiments further confirmed that SLIT2 protein expression in facial-nerve nucleus
      samples from the facial-nerve injury group was significantly higher than that in the control group
    explanation: >-
      Increased expression after a mechanical rat nerve injury is not proof of a causal or therapeutic SLIT2
      effect in human idiopathic disease.
    quote_role: PRIMARY_RESULT
animal_models:
- name: Mechanical facial nerve crush in Sprague-Dawley rats
  species: Rattus norvegicus
  description: >-
    Adult male rats underwent unilateral facial nerve crush near the stylomastoid foramen (50 g for 90 seconds),
    with sham surgery as control. Facial motor nuclei were sampled at 30 days for single-cell analysis; SLIT2
    expression was also examined by tissue immunofluorescence. This is an injury-and-repair analogue, not an
    etiologic model of idiopathic Bell's palsy.
  publication: PMID:41099890
  evidence:
  - reference: PMID:41099890
    reference_title: 'A Multi-omics Exploration Revealing SLIT2 as a Prime Therapeutic Target for Peripheral Facial Paralysis: Integrating Single-Cell Transcriptomics and Plasma Proteome Data.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      A custom-made stainless-steel peripheral nerve clamp was used to damage the main trunk of the facial
      nerve. The clamp was applied with a pressure of 50 g for 90 s
    explanation: >-
      The intervention is mechanical nerve injury, not viral reactivation or spontaneous Bell's palsy.
    quote_role: PRIMARY_RESULT
  notes: >-
    Cell-type expression, inferred ligand-receptor communication and pseudotime do not demonstrate temporal
    lineage transitions or functional rescue. The paper did not intervene on SLIT2 or ROBO, and the response
    was measured in the central facial nucleus rather than the peripheral lesion.
  modeled_mechanisms:
  - target: Facial nerve axonal injury
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Mechanical nerve crush produces a peripheral injury with a subsequent central facial-nucleus response.
    fidelity: LOW
    limitations: >-
      Unknown human initiating etiology, peripheral inflammatory anatomy and species-specific motor-nucleus
      biology are not reproduced. No targeted rescue of SLIT2 signaling was tested.
    evidence:
    - reference: PMID:41099890
      reference_title: 'A Multi-omics Exploration Revealing SLIT2 as a Prime Therapeutic Target for Peripheral Facial Paralysis: Integrating Single-Cell Transcriptomics and Plasma Proteome Data.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        A custom-made stainless-steel peripheral nerve clamp was used to damage the main trunk of the facial
        nerve. The clamp was applied with a pressure of 50 g for 90 s
      explanation: >-
        The intervention is mechanical nerve injury, not viral reactivation or spontaneous Bell's palsy.
      quote_role: PRIMARY_RESULT

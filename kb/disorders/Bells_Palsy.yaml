    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The results of these secondary outcomes suggest caution in interpreting the primary outcome result in
      isolation as evidence that prednisolone provides no clinical benefit in the management of Bell’s palsy
      in children.
    explanation: >-
      The full manuscript explicitly cautions against an absolute no-benefit conclusion.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.rch.org.au/clinicalguide/guideline_index/Facial_weakness_and_Bells_palsy/
    reference_title: 'Clinical Practice Guidelines : Facial weakness and Bell palsy'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      There is not enough evidence that early treatment with prednisolone improves complete recovery in children
    explanation: >-
      The pediatric guideline distinguishes child evidence from adult treatment recommendations.
    quote_role: REVIEW_SYNTHESIS
- name: 'Facial nerve decompression: uncertain benefit'
  description: >-
    Decompression has been studied for severe paralysis with substantial electrophysiologic degeneration but
    is not routine care. Canadian guidance recommends against routine decompression because evidence is weak
    and surgery can cause hearing loss, further nerve injury or cerebrospinal fluid leak. A retrospective comparison
    of 15 operated and 30 conservatively treated severe cases found no significant added benefit from transmastoid
    surgery at 21-70 days. It does not establish whether other surgical timing or approaches benefit selected
    patients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical decompression of the facial nerve
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4150706/
    reference_title: 'Management of Bell palsy: clinical practice guideline - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We suggest against the routine use of surgical decompression.
    explanation: >-
      The guideline recommendation reflects uncertain benefit and operative risks.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35160337
    reference_title: Comparison of Medical and Surgical Treatment in Severe Bell's Palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Although we found that surgical decompression (performed 21–70 days after symptom onset) in severe Bell’s
      palsy improved functional outcomes, the functional improvement was not statistically different from that
      of the control group at the 6-month follow-up.
    explanation: >-
      The controlled observational comparison does not show added benefit; spontaneous recovery and treatment
      selection constrain inference.
    quote_role: PRIMARY_RESULT
  notes: >-
    The paper reports inconsistent recovery percentages and counts between its abstract and Table 2; the consistent
    finding is the nonsignificant comparison. A precise unbound intervention descriptor avoids conflating this
    operation with spinal decompression.
- name: 'Intratympanic dexamethasone: investigational'
  description: >-
    Local dexamethasone injection has been studied as an adjunct or alternative when oral steroids cannot be
    given. NCT03508440 is a completed phase II/III study with only ten participants: one received oral steroids
    alone, nine received oral steroids plus injection, and none received injection alone. This extreme imbalance
    does not establish comparative efficacy.

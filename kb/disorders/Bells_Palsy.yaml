    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The Synkinesis Assessment Questionnaire (SAQ) is a specific PROM for the evaluation of synkinesis
    explanation: >-
      A dedicated patient-reported measure complements facial movement examination.
    quote_role: REVIEW_SYNTHESIS
- name: Reassessment and targeted imaging for atypical or persistent palsy
  description: >-
    Reassess or refer for new or worsening neurologic findings, ocular symptoms at any time, or incomplete
    facial recovery at three months. Persistent progressive weakness requires evaluation along the facial nerve
    course for structural causes, using specialist-directed MRI or high-resolution CT as appropriate. This
    is distinct from routine imaging of typical acute Bell's palsy.
  evidence:
  - reference: PMID:24189771
    reference_title: "Clinical practice guideline: Bell's palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      clinicians should reassess or refer to a facial nerve specialist those Bell's palsy patients with (1)
      new or worsening neurologic findings at any point, (2) ocular symptoms developing at any point, or (3)
      incomplete facial recovery 3 months after initial symptom onset.
    explanation: >-
      The guideline defines concrete reassessment triggers.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4150706/
    reference_title: 'Management of Bell palsy: clinical practice guideline - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We recommend imaging to rule out neoplasms or alternative diagnoses for patients with no improvement

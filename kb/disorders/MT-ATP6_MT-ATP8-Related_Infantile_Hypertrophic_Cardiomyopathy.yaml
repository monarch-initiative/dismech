variants:
- name: m.8528T>C
  description: >-
    Mitochondrial DNA substitution in the 46-nucleotide MT-ATP8/MT-ATP6 overlap.
    It changes the MT-ATP6 initiation codon so that threonine replaces the start
    methionine and, in the other reading frame, substitutes arginine for the
    conserved tryptophan at MT-ATP8 position 55. Heteroplasmic; identified in
    four unrelated infants with isolated hypertrophic cardiomyopathy, and
    subsequently reported at 90% cardiac heteroplasmy in a child who died at two
    months.
  gene:
    preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all four, a novel mitochondrial m.8528T-->C mutation was identified.
    explanation: >-
      Identifies the variant in all four probands of the defining series.
- name: m.8529G>A (MT-ATP8 p.Trp55X)
  description: >-
    Homoplasmic MT-ATP8 nonsense variant one nucleotide downstream of m.8528,
    truncating the same tryptophan residue. Reported in a 16-year-old with
    apical hypertrophic cardiomyopathy and neuropathy rather than in infantile
    disease, so it is curated here as allelic mechanistic context rather than as
    a variant of this entity.
  gene:
    preferred_term: MT-ATP8
    term:
      id: hgnc:7415
      label: MT-ATP8
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:17954552
    reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homoplasmic nonsense mutation m.8529G-->A (p.Trp55X) was found in the
      mitochondrial ATP8 gene in the patient's fibroblasts and muscle tissue.
    explanation: >-
      Establishes the adjacent MT-ATP8 nonsense variant and its homoplasmic
      state.
diagnosis:
- name: Mitochondrial Genome Sequencing
  description: >-
    Whole mitochondrial genome sequencing is the diagnostic test that identifies
    this entity, and is explicitly recommended in infants with hypertrophic
    cardiomyopathy. Because the variant is heteroplasmic and cardiac-predominant,
    a negative or low-level result in blood does not exclude it; heteroplasmy is
    best assessed in affected tissue, and dried blood spots have been used to
    demonstrate a high mutant load in severe infantile cardiomyopathy.
  evidence:
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial genome sequencing should be considered in patients with
      infantile hypertrophic cardiomyopathy.
    explanation: >-
      The defining study's own diagnostic recommendation.
- name: Respiratory Chain Enzymology with Complex V Assembly Analysis
  description: >-
    Measurement of complex V activity in muscle or fibroblasts, with blue native
    PAGE to assess holoenzyme assembly and detect free F1-ATPase, distinguishes
    an ATP synthase assembly defect from other respiratory chain lesions.
  evidence:
  - reference: PMID:17954552
    reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting after blue native polyacrylamide gel electrophoresis showed
      a lack of holocomplex V and increased amounts of mitochondrial ATP
      synthase subcomplexes.
    explanation: >-
      Describes the assay pattern that identifies an ATP synthase assembly
      defect.
treatments:
- name: Supportive Heart Failure Management
  description: >-
    No disease-modifying therapy exists. Management is the standard supportive
    care of infantile cardiomyopathy - anticongestive therapy, nutritional
    support, and avoidance of catabolic stress - together with genetic
    counselling for maternal relatives.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:33718303
    reference_title: "Hypertrophic Cardiomyopathy in Children: Pathophysiology, Diagnosis, and Treatment of Non-sarcomeric Causes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, the only mitochondrial disorders with an etiologic treatment are
      those caused by CoQ10 deficiency and thiamine-responsive disorders
    explanation: >-
      Establishes that no etiologic therapy is available for mitochondrial
      disorders outside the CoQ10 and thiamine-responsive groups, which is why
      management here is supportive.
- name: Heart Transplantation
  description: >-
    Cardiac transplantation is feasible in children with mitochondrial disease
    and isolated or dominant cardiac involvement. Post-transplant survival is
    comparable to that of other paediatric cardiomyopathy recipients, though
    with higher rates of stroke, prolonged ventilation and longer intensive care
    stays, so mitochondrial disease is not by itself an absolute
    contraindication. Extracardiac disease burden governs candidacy.
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:31711761
    reference_title: Heart Transplantation in Children with Mitochondrial Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that the presence of mitochondrial disease should
      not be an absolute contraindication to heart transplantation in the
      appropriate clinical setting.
    explanation: >-
      Directly supports transplantation as an option in this population.
  - reference: PMID:31711761
    reference_title: Heart Transplantation in Children with Mitochondrial Disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with mitochondrial disease were more likely to have a stroke
      after heart transplantation (11% vs 3%; P = .009)
    explanation: >-
      Quantifies the excess perioperative morbidity that qualifies the
      recommendation.
- name: Genetic Counselling for Maternal Relatives
  description: >-
    Because transmission is exclusively maternal and heteroplasmy levels vary
    between offspring, counselling addresses recurrence risk for all children of
    a carrier mother and the limited predictive value of blood heteroplasmy
    measurement.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testing of the relatives of one patient indicated that the mutation is
      heteroplasmic and correlated with disease.
    explanation: >-
      Family testing that established heteroplasmic maternal transmission is the
      basis for counselling maternal relatives.
differential_diagnoses:
- name: TMEM70-Related Nuclear ATP Synthase Deficiency
  description: >-
    The commonest nuclear cause of isolated complex V deficiency. It produces
    the same enzymatic lesion by a different route - loss of an assembly factor
    rather than of a structural subunit - and presents with neonatal hypertrophic
    cardiomyopathy, lactic acidosis and 3-methylglutaconic aciduria. Inheritance
    is autosomal recessive, so the pedigree pattern and the 3-methylglutaconic
    aciduria distinguish it.
  evidence:
  - reference: PMID:22986587
    reference_title: "TMEM70: a mutational hot spot in nuclear ATP synthase deficiency with a pivotal role in complex V biogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the clinical and molecular findings in three patients presenting
      lactic acidosis, 3-methylglutaconic aciduria, and hypertrophic
      cardiomyopathy.
    explanation: >-
      Describes the nuclear complex V deficiency phenotype that most closely
      mimics this entity.
- name: Non-Mitochondrial Non-Sarcomeric Infantile Hypertrophic Cardiomyopathy
  description: >-
    Inborn errors of metabolism (glycogen and lysosomal storage diseases, fatty
    acid oxidation defects), RASopathies and neuromuscular disease together
    account for the majority of hypertrophic cardiomyopathy presenting under one
    year of age, and must be excluded before an mtDNA cause is assumed.
  evidence:
  - reference: PMID:33718303
    reference_title: "Hypertrophic Cardiomyopathy in Children: Pathophysiology, Diagnosis, and Treatment of Non-sarcomeric Causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      childhood HCM includes a high prevalence of non-sarcomeric causes,
      including inherited errors of metabolism (i.e., glycogen storage diseases,
      lysosomal storage diseases, and fatty acid oxidation disorders),
      malformation syndromes, neuromuscular diseases, and mitochondrial disease,
      which globally represent up to 35% of children with HCM
    explanation: >-
      Enumerates the differential for non-sarcomeric paediatric hypertrophic
      cardiomyopathy and its collective size.
discussions:
- discussion_id: atp6_vs_atp8_driver
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the infantile cardiomyopathy of m.8528T>C driven by loss of the MT-ATP6
    initiation codon, by the MT-ATP8 p.Trp55Arg substitution, or does it require
    both?
  attaches_to:
  - pathophysiology#m.8528T>C Substitution in the MT-ATP6/MT-ATP8 Overlap
  rationale: >-
    The variant's two consequences fall in different genes and are not
    separable in patients, because the overlapping reading frames make it
    impossible for a natural allele to carry one without the other. The current
    best inference, stated in the 2024 ATP synthase review, is that loss of
    subunit a is the primary driver of the assembly defect - and the natural
    experiment supports it, since the adjacent m.8529G>A variant truncates only
    A6L, spares subunit a, and produces later-onset (about four years),
    substantially milder disease at comparably high heteroplasmy. But the review
    reaches that conclusion by analogy to a different MT-ATP6 variant rather
    than by measurement, and it immediately notes that the A6L-only lesion still
    destabilises the complex. No cybrid or transmitochondrial study of m.8528T>C
    itself has been reported, so the relative contribution of the two arms
    remains an inference.
  evidence:
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      one would expect that the lack of subunit a is the primary driver of
      diminished assembly/stability of complex V in the case of m.8528T>C
      substitution.
    explanation: >-
      The review states the leading hypothesis in explicitly hypothetical terms
      ("one would expect"), which is why this remains an open knowledge gap
      rather than a curated mechanism.
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      m.8529G>A variant exhibited a high degree of heteroplasmy (over 90 %), yet
      the disease course was rather milder, with later onset at 4 years of age.
    explanation: >-
      The allelic comparison at matched heteroplasmy is the strongest available
      argument that the ATP6/subunit a arm accounts for the infantile severity
      of m.8528T>C.
  proposed_experiments:
  - experiment_id: exp_cmih_m8528_cybrids
    name: Transmitochondrial cybrids carrying m.8528T>C
    description: >-
      Generate cybrid clones spanning a range of m.8528T>C heteroplasmy and
      measure complex V assembly by blue native PAGE, ATP synthesis rate, and
      steady-state ATP6 and ATP8 protein levels, to establish which subunit is
      lost and at what mutant load the defect appears.
  - experiment_id: exp_cmih_separated_frames
    name: Separated-frame expression of the two consequences
    description: >-
      Express the ATP6 start-codon change and the ATP8 p.Trp55Arg substitution
      independently in a recoded or heterologous system to attribute the
      assembly defect to one arm, the other, or their combination.
- discussion_id: cardiac_restriction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the phenotype of m.8528T>C cardiac-restricted when the mutant genome
    is present in every tissue?
  attaches_to:
  - pathophysiology#Cardiac Heteroplasmy Threshold
  rationale: >-
    The index series described isolated hypertrophic cardiomyopathy without the
    encephalopathy, myopathy or optic involvement typical of other MT-ATP6
    disease, and the one variant carrier with tissue data had 90% cardiac
    heteroplasmy. Whether the restriction reflects tissue-specific segregation
    of mutant genomes, a lower threshold in a tissue with extreme ATP demand, or
    both has not been determined, and no systematic multi-tissue heteroplasmy
    survey of this variant exists.
  evidence:
  - reference: PMID:40112238
    reference_title: Natural History of Patients With Mitochondrial ATPase Deficiency Due to Pathogenic Variants of MT-ATP6 and MT-ATP8.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The CNS was the most frequently affected tissue (93%), followed by the
      muscle (75%), eye (46%), and heart (18%).
    explanation: >-
      Across MT-ATP6/MT-ATP8 deficiency the heart is the least often involved of
      the four main tissues, which is what makes a cardiac-restricted
      presentation for m.8528T>C a question worth posing rather than the
      expected default.
  proposed_experiments:
  - experiment_id: exp_cmih_multitissue_heteroplasmy
    name: Multi-tissue heteroplasmy mapping in autopsy material
    description: >-
      Quantify m.8528T>C heteroplasmy across heart, skeletal muscle, brain,
      liver and blood in the same individuals to test whether the cardiac
      predominance is a segregation effect or a threshold effect.
notes: >-
  Named Entity Confusion preflight. MONDO:0010777 records no causal-gene
  relationship, so the automated gene-frequency check cannot adjudicate this
  entity. Identity was anchored manually on the OMIM xref: MONDO:0010777 maps to
  OMIM:500006, a phenotype number in the 500000 (mitochondrial inheritance)
  series, and the MedGen record for the same concept (MedGen 412660) lists
  OMIM 516060 (MT-ATP6) and 516070 (MT-ATP8) as the gene entries carrying the
  same phenotype name. The literature entry point for OMIM 500006 is Ware et al.
  2009 (PMID:19188198), whose four infants with isolated hypertrophic
  cardiomyopathy carry m.8528T>C in the MT-ATP6/MT-ATP8 overlap. This entry is
  therefore the mtDNA complex V entity, not any of the nuclear-gene mitochondrial
  cardiomyopathies already in this knowledge base.

  `just preflight-dr` on the Edison/falcon report returns SKIP, as expected for a
  MONDO term with no recorded causal gene, but its gene census is strongly
  confirmatory: MT-ATP6 is mentioned 45 times and MT-ATP8 22 times, with no rival
  gene above two mentions. The report cites OMIM 516060 (the MT-ATP6 gene entry
  that MedGen ties to this phenotype name) but not 500006 itself, and also
  discusses OMIM 256000 and 551500 as the broader Leigh/NARP context; that
  broader material was read as context and not curated into this entry, which is
  restricted to the overlap-region cardiac phenotype.

  No GeneReviews chapter exists for this disorder. A PubMed search returned the
  general "Primary Mitochondrial Disorders Overview" (PMID:20301403), whose
  abstract states only the chapter's purpose and carries no disease-specific
  clinical characteristics, so it was deliberately not cited as a phenotype
  baseline.

  Two reference records used here, PMID:26803244 (Imai 2016, the second primary
  report of loss of ATPase 6 and 8 protein in infantile cardiomyopathy) and
  PMID:27409572 (Imai 2016, dried blood spots and heteroplasmy), cache as
  metadata with no abstract. They are listed under top-level `references` for
  discoverability but are deliberately not used as evidence items, since the only
  quotable text in those records is the title.

inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    The causal variant lies in mitochondrial DNA and is therefore transmitted
    exclusively through the maternal line. It is heteroplasmic, so the
    proportion of mutant genomes varies between family members and between
    tissues, and clinical expression tracks that proportion rather than
    following a Mendelian segregation ratio.
  evidence:
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testing of the relatives of one patient indicated that the mutation is
      heteroplasmic and correlated with disease.
    explanation: >-
      Family testing establishing heteroplasmy that correlates with disease
      status is the direct evidence for maternal, heteroplasmy-dependent
      mitochondrial inheritance.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Onset is prenatal to five months, progression to heart failure and metabolic
    crisis can be measured in weeks, two of the small number of reported infants
    died within months of birth, and no disease-modifying therapy exists. The
    burden falls on the family as well as the child, since maternal transmission
    puts every subsequent pregnancy at an unpredictable risk.
  evidence:
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      feeding difficulties, developed, and two patients died within a few months
      of life.
    explanation: >-
      Records fatal outcome in infancy among the small reported m.8528T>C
      cohort.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six patients carrying m.8528T>C had been described as of the 2021 report
    that added a seventh. The entity is known only from individual case reports
    and small series; no population-based frequency has been estimated, and none
    should be inferred from these counts.
  evidence:
  - reference: PMID:33180048
    reference_title: ATP synthase deficiency due to m.8528T>C mutation - a novel cause of severe neonatal hyperammonemia requiring hemodialysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far six patients with this mutation have been described but none of
      them was reported to need hemodialysis in the first days of life.
    explanation: >-
      Gives the published case count for m.8528T>C at the time of that report.
progression:
- phase: Prenatal-to-infantile onset with rapid cardiac progression
  age_range: Prenatal to 5 months
  notes: >-
    Onset of the cardiac phenotype ranges from prenatal detection to five months
    of age, and progression from hypertrophy through heart failure and metabolic
    crisis can be rapid; two of the reported infants died within months of
    birth. In the broader MT-ATP6/MT-ATP8 deficiency cohort, cardiomyopathy is
    concentrated in the infantile-onset group and becomes progressively less
    frequent with later onset, which is consistent with cardiac involvement
    being a marker of the most severe end of the spectrum.
  evidence:
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biventricular hypertrophy was found in almost all patients, with an early
      onset from prenatal to five months of life.
    explanation: >-
      Defines the onset window for the cardiac phenotype of m.8528T>C.
  - reference: PMID:40112238
    reference_title: Natural History of Patients With Mitochondrial ATPase Deficiency Due to Pathogenic Variants of MT-ATP6 and MT-ATP8.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cardiomyopathy was more prevalent in the infantile-onset group and
      progressively reduced in pediatric and adult patients
    explanation: >-
      Places cardiac involvement at the infantile, most severe end of the
      MT-ATP6/MT-ATP8 spectrum; PARTIAL because the cohort is the whole
      MT-ATP6/MT-ATP8 spectrum rather than this entity.
pathophysiology:
- name: m.8528T>C Substitution in the MT-ATP6/MT-ATP8 Overlap
  biological_scale: MOLECULAR
  description: >-
    MT-ATP8 and MT-ATP6 are transcribed as a bicistronic message whose reading
    frames overlap by 46 nucleotides. Position 8528 falls inside that overlap.
    The m.8528T>C substitution therefore has two simultaneous consequences in
    two different proteins: it converts the ATP6 initiation codon (ATG) so that
    the encoded residue is threonine rather than methionine, and it replaces
    tryptophan 55 of ATP8, a strictly conserved hydrophobic residue, with the
    strongly basic arginine. This is the defining molecular lesion of the
    entity, and the first reported mutation to hit both mtDNA-encoded complex V
    subunits at once.
  genes:
  - preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  - preferred_term: MT-ATP8
    term:
      id: hgnc:7415
      label: MT-ATP8
  evidence:
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This results in a change of the initiation codon in ATPase 6 to threonine
      and a concurrent change from a highly conserved hydrophobic amino acid,
      tryptophan, at position 55 of ATPase 8 to a highly basic arginine.
    explanation: >-
      States both consequences of the single substitution, which is the whole
      basis for treating this as one lesion affecting two gene products.
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, this is the first report of a mutation affecting both
      mitochondrial genome-encoded complex V subunit proteins.
    explanation: >-
      Confirms that both mtDNA-encoded complex V subunits are affected by the
      same variant.
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients carry m.8528T>C missense variant of
      MT-ATP8/MT-ATP6 overlapping region, which affects both subunits.
    explanation: >-
      A 2024 review of isolated ATP synthase defects identifies m.8528T>C as the
      dominant reported MT-ATP8/MT-ATP6 overlap allele and restates the
      dual-subunit consequence.
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant replaces highly conserved tryptophan 55 to arginine in A6L
      subunit and methionine 1 to threonine in the case of subunit a
    explanation: >-
      Independent restatement of the two protein-level consequences, naming the
      affected subunits by their structural designations (A6L and subunit a).
  downstream:
  - target: Failure to Insert ATP6 and ATP8 into the ATP Synthase Membrane Domain
    description: >-
      Loss of the ATP6 start codon and a charge-reversing substitution in the
      membrane-embedded ATP8 protein both act on the availability and
      integrability of the two mtDNA-encoded Fo subunits.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29440398
      reference_title: Assembly of the membrane domain of ATP synthase in human mitochondria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This intermediate provides the template for insertion of ATP6 and ATP8,
        which are synthesized on mitochondrial ribosomes.
      explanation: >-
        Establishes that ATP6 and ATP8 are inserted as translated mitochondrial
        gene products into a pre-formed assembly intermediate, so a lesion in
        their mtDNA genes acts at exactly this step.
- name: Failure to Insert ATP6 and ATP8 into the ATP Synthase Membrane Domain
  biological_scale: MOLECULAR
  description: >-
    Human ATP synthase is an assembly of 29 subunits of 18 kinds, of which only
    ATP6 and ATP8 are encoded in mitochondrial DNA. Assembly proceeds through a
    nuclear-encoded intermediate - the F1-c8 complex attached to the peripheral
    stalk with subunits e, f and g - into which ATP6 and ATP8, translated on
    mitochondrial ribosomes, are inserted last; the 6.8 proteolipid then locks
    them in place and only at that point is the complex coupled to ATP
    synthesis. A lesion that removes or destabilises either mtDNA-encoded
    subunit therefore arrests assembly at the final, coupling-conferring step
    rather than preventing formation of the F1 head.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: mitochondrial ATP synthase complex assembly
    modifier: DECREASED
    term:
      id: GO:0033615
      label: mitochondrial proton-transporting ATP synthase complex assembly
  evidence:
  - reference: PMID:29440398
    reference_title: Assembly of the membrane domain of ATP synthase in human mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All but two membrane components are encoded in nuclear genes, synthesized
      on cytoplasmic ribosomes, and imported into the matrix of the organelle,
      where they are assembled into the complex with ATP6 and ATP8, the products
      of overlapping genes in mitochondrial DNA.
    explanation: >-
      Identifies ATP6 and ATP8 as the only mtDNA-encoded membrane components and
      names the overlapping-gene arrangement that makes a single substitution
      able to hit both.
  - reference: PMID:29440398
    reference_title: Assembly of the membrane domain of ATP synthase in human mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Their association with the complex is stabilized by addition of the 6.8
      proteolipid, and the complex is coupled to ATP synthesis at this point.
    explanation: >-
      Places ATP6/ATP8 incorporation at the step that confers coupling, so
      failure here leaves an uncoupled or incomplete enzyme rather than merely a
      smaller one.
  downstream:
  - target: Complex V Holoenzyme Deficiency with Accumulation of Subcomplexes
    description: >-
      Without stable incorporation of the mtDNA-encoded subunits the holoenzyme
      cannot be completed, and the partially assembled species persist.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17954552
      reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Immunoblotting after blue native polyacrylamide gel electrophoresis
        showed a lack of holocomplex V and increased amounts of mitochondrial
        ATP synthase subcomplexes.
      explanation: >-
        Direct demonstration in patient tissue and cybrids that loss of ATP8
        blocks holoenzyme formation and leaves subcomplexes behind.
- name: Complex V Holoenzyme Deficiency with Accumulation of Subcomplexes
  biological_scale: MOLECULAR
  description: >-
    The biochemical consequence is an isolated deficiency of assembled,
    catalytically competent ATP synthase. In the closest characterised human
    model - a homoplasmic MT-ATP8 nonsense variant one base away, at m.8529 -
    patient fibroblasts, muscle and transmitochondrial cybrids all showed
    reduced complex V activity, absent holocomplex V, an excess of ATP synthase
    subcomplexes, and in-gel activity of free F1-ATPase, i.e. an unattached
    catalytic head no longer coupled to a proton channel.
  protein_complexes:
  - preferred_term: proton-transporting ATP synthase complex
    modifier: DECREASED
    term:
      id: GO:0045259
      label: proton-transporting ATP synthase complex
  molecular_functions:
  - preferred_term: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
  evidence:
  - reference: PMID:17954552
    reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reduced complex V activity was measured in the patient's fibroblasts and
      muscle tissue, and was confirmed in cybrid clones containing
      patient-derived mitochondrial DNA.
    explanation: >-
      Cybrid transfer assigns the complex V defect to the patient's mitochondrial
      DNA rather than to nuclear background, which is the key control for an
      mtDNA-encoded subunit lesion.
  - reference: PMID:17954552
    reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An in-gel activity assay of ATP hydrolysis showed activity of free
      F(1)-ATPase in the patient's muscle tissue and in the cybrid clones.
    explanation: >-
      Free F1-ATPase is the signature of a catalytic head that was never joined
      to an intact Fo domain, confirming where assembly stalls.
  notes: >-
    The mechanistic evidence quoted here is from m.8529G>A (p.Trp55X), a
    homoplasmic MT-ATP8 nonsense variant in an adolescent with apical
    hypertrophic cardiomyopathy and neuropathy, not from m.8528T>C itself. It is
    cited because it is the best-characterised demonstration that loss of an
    mtDNA-encoded complex V subunit in this overlap region produces an assembly
    defect; the corresponding cellular experiments have not been reported for
    m.8528T>C.
  downstream:
  - target: Impaired Proton-Coupled Mitochondrial ATP Synthesis
    description: >-
      A holoenzyme that cannot be completed cannot use the proton-motive force
      to make ATP.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33600551
      reference_title: The pathogenic m.8993 T > G mutation in mitochondrial ATP6 gene prevents proton release from the subunit c-ring rotor of ATP synthase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Subunit a, together with an oligomeric ring of c-subunit (c-ring), forms
        the proton pathway responsible for the transport of protons through the
        mitochondrial inner membrane, coupled to rotation of the c-ring and ATP
        synthesis.
      explanation: >-
        Defines the function that ATP6 (subunit a) contributes, so its loss
        directly severs proton translocation from ATP synthesis.
  - target: Disrupted ATP Synthase Dimerisation and Cristae Architecture
    description: >-
      ATP synthase monomers dimerise through contacts between ATP6 subunits, so
      a defect in ATP6 incorporation also removes the oligomerisation that
      shapes the inner membrane.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29440398
      reference_title: Assembly of the membrane domain of ATP synthase in human mitochondria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The human 6.8 proteolipid (yeast j subunit) locks ATP6 and ATP8 into the
        membrane assembly, and the monomeric complexes then dimerize via
        interactions between ATP6 subunits and between 6.8 proteolipids (j
        subunits).
      explanation: >-
        ATP6-ATP6 contacts are the dimerisation interface, so failure to
        incorporate ATP6 removes the structural basis for dimer and oligomer
        formation.
- name: Impaired Proton-Coupled Mitochondrial ATP Synthesis
  biological_scale: CELLULAR
  description: >-
    Loss of a functional Fo proton channel uncouples the respiratory-chain
    proton gradient from phosphorylation, so oxidative ATP output falls even
    though electron transport upstream of complex V may be intact. This is an
    isolated complex V lesion rather than a combined respiratory chain defect.
  biological_processes:
  - preferred_term: proton motive force-driven mitochondrial ATP synthesis
    modifier: DECREASED
    term:
      id: GO:0042776
      label: proton motive force-driven mitochondrial ATP synthesis
  - preferred_term: proton transmembrane transport
    modifier: DECREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  evidence:
  - reference: PMID:33600551
    reference_title: The pathogenic m.8993 T > G mutation in mitochondrial ATP6 gene prevents proton release from the subunit c-ring rotor of ATP synthase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We previously showed that the equivalent mutation (aL173R) dramatically
      compromises respiratory growth of Saccharomyces cerevisiae and causes a
      90% drop in the rate of mitochondrial ATP synthesis.
    explanation: >-
      Quantifies how severely a single pathogenic ATP6 substitution can suppress
      mitochondrial ATP synthesis in a tractable model of the same subunit.
  downstream:
  - target: Cardiomyocyte Energy Deficit
    description: >-
      Cardiac muscle sustains continuous contractile work and is among the most
      ATP-dependent tissues, so a fall in oxidative ATP supply is felt there
      first.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33718303
      reference_title: "Hypertrophic Cardiomyopathy in Children: Pathophysiology, Diagnosis, and Treatment of Non-sarcomeric Causes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Because cardiac muscle is one of the high-energy-demanding tissues, the
        myocardial involvement (i.e., mitochondrial cardiomyopathy) occurs in
        about 20-40% of children with mitochondrial disease
      explanation: >-
        States the energetic reason the heart is the organ that declares this
        class of defect, and quantifies how often it does so.
- name: Disrupted ATP Synthase Dimerisation and Cristae Architecture
  biological_scale: CELLULAR
  description: >-
    Beyond catalysis, ATP synthase dimers and their oligomeric rows along the
    cristae edges impose the curvature of the inner mitochondrial membrane.
    Failure to incorporate ATP6 therefore has a structural consequence as well
    as a bioenergetic one, degrading the cristae surface on which the whole
    respiratory chain is organised. This arm is inferred from the assembly and
    membrane-shaping literature rather than from ultrastructural study of
    m.8528T>C hearts.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: cristae formation
    modifier: DECREASED
    term:
      id: GO:0042407
      label: cristae formation
  evidence:
  - reference: PMID:11823415
    reference_title: The ATP synthase is involved in generating mitochondrial cristae morphology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The present data show that there is a link between dimerization of the
      mitochondrial ATP synthase and cristae morphology.
    explanation: >-
      Establishes the dimerisation-to-cristae link in yeast, which is the basis
      for expecting a membrane-architecture consequence when ATP6 incorporation
      fails.
  notes: >-
    Curated as a mechanistically expected parallel arm, not as an observed
    finding in this disorder. No ultrastructural study of myocardium carrying
    m.8528T>C has been published, so this node should not be read as an
    established human phenotype.
  downstream:
  - target: Cardiomyocyte Energy Deficit
    description: >-
      Loss of cristae surface reduces the membrane area available for oxidative
      phosphorylation, compounding the direct catalytic deficit.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced inner-membrane surface area available for oxidative phosphorylation
    - Disorganised respiratory-chain supercomplex packing along the cristae
- name: Cardiomyocyte Energy Deficit
  biological_scale: CELLULAR
  description: >-
    Cardiomyocytes carrying a high burden of mutant genomes cannot meet
    contractile ATP demand from oxidative phosphorylation. The shortfall is
    partly offset by glycolysis, at the cost of lactate production, and drives
    the compensatory responses that produce the hypertrophic phenotype.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: ATP biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006754
      label: ATP biosynthetic process
  evidence:
  - reference: PMID:33718303
    reference_title: "Hypertrophic Cardiomyopathy in Children: Pathophysiology, Diagnosis, and Treatment of Non-sarcomeric Causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCM is the most common form of mitochondrial cardiomyopathy; however,
      other forms of cardiomyopathies are possible.
    explanation: >-
      Links the mitochondrial energy defect in cardiomyocytes to a
      predominantly hypertrophic, rather than dilated, cardiac phenotype.
  downstream:
  - target: Compensatory Cardiomyocyte Hypertrophy
    description: >-
      The failing myocardium responds with cell growth and remodelling.
    causal_link_type: DIRECT
  - target: Systemic Lactate Accumulation
    description: >-
      Glycolytic compensation for the oxidative shortfall raises lactate output.
    causal_link_type: DIRECT
- name: Compensatory Cardiomyocyte Hypertrophy
  biological_scale: TISSUE
  description: >-
    Energy-deficient cardiomyocytes enlarge, and the ventricular wall thickens.
    In this disorder the hypertrophy is not a response to abnormal loading -
    outflow obstruction or hypertension - but to an intrinsic metabolic defect,
    which is why the entity is classified as a non-sarcomeric, secondary
    hypertrophic cardiomyopathy.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    modifier: INCREASED
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
  evidence:
  - reference: PMID:33718303
    reference_title: "Hypertrophic Cardiomyopathy in Children: Pathophysiology, Diagnosis, and Treatment of Non-sarcomeric Causes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertrophic cardiomyopathy (HCM) is a myocardial disease characterized by
      left ventricular hypertrophy not solely explained by abnormal loading
      conditions.
    explanation: >-
      Defines the hypertrophy as load-independent, which is what a primary
      metabolic cause implies.
  downstream:
  - target: Progressive Heart Failure of Infancy
    description: >-
      Hypertrophic remodelling in a myocardium that cannot generate ATP
      progresses to pump failure rather than stabilising.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30642647
      reference_title: "Cardiomyopathy in children with mitochondrial disease: Prognosis and genetic background."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After a median follow-up of 35 months, the overall survival rate was
        significantly lower in patients with cardiomyopathy than in those
        without (p < 0.001).
      explanation: >-
        Cardiomyopathy in paediatric mitochondrial disease is progressive and
        mortality-defining rather than an incidental finding.
- name: Systemic Lactate Accumulation
  biological_scale: ORGANISM
  description: >-
    Reliance on glycolysis where oxidative phosphorylation is blocked raises
    circulating lactate. Elevated lactate is the classic, though neither
    sensitive nor specific, systemic marker of a primary mitochondrial disorder,
    and in an infant with unexplained hypertrophic cardiomyopathy it is one of
    the findings that redirects investigation toward mitochondrial DNA.
  evidence:
  - reference: PMID:40112238
    reference_title: Natural History of Patients With Mitochondrial ATPase Deficiency Due to Pathogenic Variants of MT-ATP6 and MT-ATP8.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced citrulline levels and increased alanine and lactate levels were
      reported in 56%, 49%, and 71% of patients, respectively, suggesting their
      role as potential biomarkers.
    explanation: >-
      Lactate elevation is the commonest laboratory abnormality across
      MT-ATP6/MT-ATP8 deficiency. Marked PARTIAL because the cohort spans the
      whole spectrum, which is dominated by neurological m.8993 disease rather
      than by this cardiac entity.
  notes: >-
    Hyperlactataemia is curated as the expected systemic consequence of blocked
    oxidative phosphorylation, quantified only at the level of the whole
    MT-ATP6/MT-ATP8 spectrum. The index m.8528T>C series describes the cardiac
    phenotype as isolated and does not report lactate values, so lactic acidosis
    is not curated as a frequency-bearing phenotype of this entry.
- name: Cardiac Heteroplasmy Threshold
  biological_scale: CELLULAR
  description: >-
    Because the variant is heteroplasmic, each tissue carries a mixture of
    mutant and wild-type mitochondrial genomes and expresses a biochemical
    defect only once the mutant load passes a tissue-specific threshold. This
    is what makes the phenotype cardiac-predominant despite a genome present in
    every cell, and it accounts for the variable expression seen among maternal
    relatives. In a fatal infantile case the cardiac heteroplasmy level of
    m.8528T>C was 90%.
  evidence:
  - reference: PMID:30642647
    reference_title: "Cardiomyopathy in children with mitochondrial disease: Prognosis and genetic background."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the three patients with mitochondrial DNA mutations whose cardiac
      tissues were available, high heteroplasmy rates in the cardiac tissue were
      observed for m.8528T>C (90%, died at 2 months of age)
    explanation: >-
      Directly quantifies cardiac mutant load for this variant and ties a very
      high level to fatal infantile disease.
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testing of the relatives of one patient indicated that the mutation is
      heteroplasmic and correlated with disease.
    explanation: >-
      Establishes that clinical status within a kindred tracks mutant load
      rather than mere presence of the variant.
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant is typically present at a high heteroplasmy level, exceeding 90 %
    explanation: >-
      Gives the mutant-load range at which m.8528T>C is typically found in
      affected individuals.
  - reference: PMID:30763462
    reference_title: "MT-ATP6 mitochondrial disease variants: Phenotypic and biochemical features analysis in 218 published cases and cohort of 14 new cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite extensive overlap in the heteroplasmy levels of MT-ATP6 variant
      carriers with and without a wide range of clinical symptoms, previously
      reported symptomatic subjects had significantly higher heteroplasmy load
    explanation: >-
      Establishes the threshold relationship across MT-ATP6 disease while
      explicitly recording that carrier heteroplasmy distributions overlap, so
      no single cut-off separates affected from unaffected. Marked PARTIAL
      because the analysis covers MT-ATP6 variants generally rather than
      m.8528T>C.
  notes: >-
    Heteroplasmy is not a clean switch. A mother carrying 82% m.8528T>C in blood
    was reported as an asymptomatic carrier, and one affected infant with
    hypertrophic cardiomyopathy had only 59% mutant load in blood, so blood
    heteroplasmy neither predicts nor excludes cardiac disease and the
    cardiac-tissue level is the meaningful measurement.
  downstream:
  - target: Cardiomyocyte Energy Deficit
    description: >-
      The biochemical defect becomes manifest in cardiomyocytes only above the
      threshold mutant load.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30763462
      reference_title: "MT-ATP6 mitochondrial disease variants: Phenotypic and biochemical features analysis in 218 published cases and cohort of 14 new cases."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common findings were reduced ATP synthesis rate, preserved ATP
        hydrolysis capacity, and abnormally increased mitochondrial membrane
        potential.
      explanation: >-
        Names reduced ATP synthesis as the commonest measured consequence in
        symptomatic MT-ATP6 variant carriers, linking mutant load to the
        bioenergetic deficit. PARTIAL because it is measured across MT-ATP6
        disease rather than in m.8528T>C myocardium.
- name: Progressive Heart Failure of Infancy
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint is a rapidly progressive infantile cardiomyopathy with
    high mortality. In a large paediatric mitochondrial disease cohort, children
    with cardiomyopathy had markedly worse survival than those without, and a
    child with the m.8528T>C variant died at two months of age.
  evidence:
  - reference: PMID:30642647
    reference_title: "Cardiomyopathy in children with mitochondrial disease: Prognosis and genetic background."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten-year Kaplan-Meier estimates of overall survival were 18 and 67%,
      respectively.
    explanation: >-
      Quantifies the survival gap between paediatric mitochondrial disease with
      and without cardiomyopathy.
  - reference: PMID:19188198
    reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial ATPase 6 and 8 genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infantile cardiomyopathy is a genetically heterogeneous disorder with
      significant morbidity and mortality.
    explanation: >-
      States the clinical severity of the presentation this entity falls within.

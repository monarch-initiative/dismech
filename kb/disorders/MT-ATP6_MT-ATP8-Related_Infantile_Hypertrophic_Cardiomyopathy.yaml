biochemical:
- name: Decreased Mitochondrial ATP Synthase (Complex V) Activity
  context: >-
    Isolated reduction of assembled complex V activity is the enzymological
    signature. It is measurable in skeletal muscle and in cultured fibroblasts,
    and can be assigned to the mitochondrial genome by cybrid transfer.
  biomarker_term:
    preferred_term: Decreased activity of mitochondrial ATP synthase complex
    term:
      id: HP:0011925
      label: Decreased activity of mitochondrial ATP synthase complex
  evidence:
  - reference: PMID:17954552
    reference_title: A novel mitochondrial ATP8 gene mutation in a patient with apical hypertrophic cardiomyopathy and neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reduced complex V activity was measured in the patient's fibroblasts and
      muscle tissue, and was confirmed in cybrid clones containing
      patient-derived mitochondrial DNA.
    explanation: >-
      Demonstrates the measurable enzymatic deficit and its mtDNA origin.
  notes: >-
    Quantified for the adjacent MT-ATP8 nonsense variant m.8529G>A rather than
    for m.8528T>C; see the knowledge-gap discussion on this entry.
- name: Reduced Synthesis of ATP6 and ATP8 and Reduced Complex V Levels
  context: >-
    Pulse-labelling and complex-level measurements in patients carrying
    m.8528T>C show markedly reduced synthesis of both mtDNA-encoded subunits and
    correspondingly low amounts of fully assembled ATP synthase, which is the
    biochemical demonstration that the variant acts through the subunits it
    encodes rather than through some indirect route.
  evidence:
  - reference: PMID:39016153
    reference_title: Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This pathogenic variant was shown to cause impaired synthesis of both
      subunits a and A6L, with low levels of complete ATP synthase detected in
      patient samples.
    explanation: >-
      Reports the two biochemical consequences - loss of both subunits and loss
      of assembled complex V - specifically for m.8528T>C.
- name: Elevated Plasma Lactate
  context: >-
    Raised lactate is the commonest laboratory abnormality across MT-ATP6/MT-ATP8
    deficiency and reflects glycolytic compensation for blocked oxidative
    phosphorylation. The figure quoted is for the whole MT-ATP6/MT-ATP8 cohort,
    which is dominated by m.8993 neurological disease, not for m.8528T>C
    specifically.
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:

name: MT-ATP6/MT-ATP8-Related Infantile Hypertrophic Cardiomyopathy
creation_date: "2026-08-19T15:00:00Z"
category: Mendelian
synonyms:
- Cardiomyopathy, infantile hypertrophic
- Infantile hypertrophic cardiomyopathy, mitochondrial
- Maternally inherited infantile hypertrophic cardiomyopathy
- Mitochondrial complex V (ATP synthase) deficiency, mitochondrial type, infantile cardiomyopathy
description: >-
  Maternally inherited, infantile-onset hypertrophic cardiomyopathy caused by
  pathogenic point mutations in the overlapping reading frames of the two
  mitochondrial DNA-encoded subunits of ATP synthase (complex V), MT-ATP6 and
  MT-ATP8 (OMIM 500006). The reference lesion is m.8528T>C, reported by Ware and
  colleagues in four unrelated infants who presented with isolated hypertrophic
  cardiomyopathy: because ATP6 and ATP8 are read in overlapping frames, this
  single nucleotide substitution simultaneously destroys the ATP6 initiation
  codon and replaces a strictly conserved tryptophan at ATP8 position 55 with
  arginine, so one base change compromises both mtDNA-encoded subunits of the
  enzyme at once. ATP6 and ATP8 are the only two components of the 29-subunit
  human ATP synthase encoded by mitochondrial rather than nuclear DNA, and they
  are inserted last into the membrane (Fo) domain; without them the holoenzyme
  cannot be completed and the terminal, ATP-producing step of oxidative
  phosphorylation fails in a tissue whose energy demand is among the highest in
  the body. The mutation is heteroplasmic and segregates with disease within
  maternal kindreds, and very high cardiac heteroplasmy has been documented in a
  fatal infantile case.

  This entry is deliberately distinct from the several nuclear-gene mitochondrial
  disorders in this knowledge base that also present with infantile hypertrophic
  cardiomyopathy (COX15-related COX deficiency, MRPL44 deficiency, MTO1
  deficiency, cardiomyopathy-hypotonia-lactic acidosis syndrome/SLC25A3,
  mitochondrial DNA depletion syndrome 14B/OPA1). Those are autosomal recessive
  nuclear defects of complex IV assembly, mitochondrial translation, phosphate
  supply, or mtDNA maintenance. The entity curated here is mitochondrially
  encoded and maternally transmitted, its defect is in complex V itself, and its
  distinguishing molecular feature - a single base altering two proteins through
  overlapping open reading frames - has no counterpart in the nuclear entries.

- name: Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
  biological_scale: CELLULAR
  description: >-
    The convergent cellular lesion of the cytoskeletal CFEOM subtypes. Axons of
    the oculomotor nerve, and most consistently those of its superior division

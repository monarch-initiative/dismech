has_subtypes:
- name: CFEOM1
  display_name: CFEOM1 (KIF21A, classic bilateral CFEOM)
  classification: genetic
  subtype_term:
    preferred_term: congenital fibrosis of extraocular muscles type 1
    term:
      id: MONDO:0021083
      label: congenital fibrosis of extraocular muscles type 1
  genes:
  - preferred_term: KIF21A
    term:
      id: hgnc:19349
      label: KIF21A
  description: >-
    The classic and most common form. Autosomal dominant, fully penetrant, and
    bilateral: both eyes are fixed in a downward (infraducted) position with
    severe bilateral ptosis and inability to elevate either eye above the
    horizontal midline. Caused by heterozygous missense variants in the kinesin
    KIF21A, with recurrent hotspots in the third coiled-coil stalk domain
    (p.R954W is by far the commonest allele, recurring across ancestries).
  evidence:
  - reference: PMID:14595441
    reference_title: "Heterozygous mutations of the kinesin KIF21A in congenital fibrosis of the extraocular muscles type 1 (CFEOM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that individuals with CFEOM1 harbor heterozygous missense
      mutations in a kinesin motor protein encoded by KIF21A. We identified six
      different mutations in 44 of 45 probands.
    explanation: >-
      Establishes heterozygous KIF21A missense variants as the cause of CFEOM1
      in nearly all probands tested.
  - reference: PMID:16365788
    reference_title: "Recurrent mutation of the KIF21A gene in Japanese patients with congenital fibrosis of the extraocular muscles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, each patient had congenital bilateral ptosis, an infraducted
      primary position of each eye, and the inability to raise either eye above
      midline.
    explanation: >-
      Defines the stereotyped bilateral CFEOM1 clinical picture in KIF21A
      p.R954W carriers.
- name: CFEOM2
  display_name: CFEOM2 (PHOX2A/ARIX, autosomal recessive)
  classification: genetic
  subtype_term:
    preferred_term: fibrosis of extraocular muscles, congenital, 2
    term:
      id: MONDO:0011181
      label: fibrosis of extraocular muscles, congenital, 2
  genes:
  - preferred_term: PHOX2A
    term:
      id: hgnc:691
      label: PHOX2A
  description: >-
    Autosomal recessive form, described mainly in consanguineous Middle Eastern
    families. Affected individuals have bilateral ptosis with the eyes fixed in
    an exotropic (outward) rather than infraducted position and severe
    limitation of all extraocular movements. Caused by biallelic loss of
    PHOX2A/ARIX, a homeodomain transcription factor required for specification of
    the oculomotor and trochlear motor nuclei.
  evidence:
  - reference: PMID:11600883
    reference_title: "Homozygous mutations in ARIX(PHOX2A) result in congenital fibrosis of the extraocular muscles type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report three mutations in ARIX (also known as PHOX2A) in four
      CFEOM2 pedigrees.
    explanation: >-
      Identifies PHOX2A/ARIX as the CFEOM2 disease gene across four pedigrees.
  - reference: PMID:14597037
    reference_title: "A novel PHOX2A/ARIX mutation in an Iranian family with congenital fibrosis of extraocular muscles type 2 (CFEOM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two affected siblings had bilateral ptosis and exotropia and severe
      limitation of all extraocular movements.
    explanation: >-
      Documents the distinguishing exotropic primary position of CFEOM2.
- name: CFEOM3A
  display_name: CFEOM3A (TUBB3, with or without extraocular involvement)
  classification: genetic
  subtype_term:
    preferred_term: fibrosis of extraocular muscles, congenital, 3A, with or without extraocular involvement
    term:
      id: MONDO:0010912
      label: fibrosis of extraocular muscles, congenital, 3A, with or without extraocular involvement
  genes:
  - preferred_term: TUBB3
    term:
      id: hgnc:20772
      label: TUBB3
  description: >-
    Autosomal dominant, more variable and often asymmetric or unilateral form
    caused by heterozygous missense variants in TUBB3, the neuron-specific
    beta-tubulin isotype III. Unlike CFEOM1, the eyes are not always infraducted
    and one eye may be spared. Some TUBB3 alleles add extraocular features -
    intellectual and behavioural impairment, facial weakness, and a later-onset
    axonal sensorimotor polyneuropathy - together with commissural and
    corticospinal tract dysgenesis on neuroimaging. See the separate
    TUBB3-related Tubulinopathy entry for the wider TUBB3 syndrome spectrum.
  evidence:
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation causes the ocular motility disorder CFEOM3, whereas some
      also result in intellectual and behavioral impairments, facial paralysis,
      and/or later-onset axonal sensorimotor polyneuropathy.
    explanation: >-
      Defines CFEOM3 as the constant ocular phenotype of TUBB3 missense variants
      with variable additional neurological features.
- name: CFEOM3B
  display_name: CFEOM3B (KIF21A)
  classification: genetic
  subtype_term:
    preferred_term: fibrosis of extraocular muscles, congenital, 3b
    term:
      id: MONDO:0800209
      label: fibrosis of extraocular muscles, congenital, 3b
  genes:
  - preferred_term: KIF21A
    term:
      id: hgnc:19349
      label: KIF21A
  description: >-
    A CFEOM3-pattern (variable, potentially unilateral or asymmetric, eyes not
    obligately infraducted) phenotype caused by KIF21A variants rather than
    TUBB3, showing that the same KIF21A allele can produce either the classic
    CFEOM1 pattern or a CFEOM3 pattern within and between families.
  evidence:
  - reference: PMID:27513105
    reference_title: "KIF21A mutation in two Chinese families with congenital fibrosis of the extraocular muscles type 1 and 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results indicated that, in the patients with CFEOM1 and CFEOM3, the
      disease was caused by the same KIF21A gene mutation.
    explanation: >-
      Demonstrates that a single recurrent KIF21A allele underlies both the
      CFEOM1 and CFEOM3 clinical patterns.
- name: CFEOM3C
  display_name: CFEOM3C (13q12.11-linked)
  classification: genetic
  subtype_term:
    preferred_term: fibrosis of extraocular muscles, congenital, 3c
    term:
      id: MONDO:0012262
      label: fibrosis of extraocular muscles, congenital, 3c
  description: >-
    A locus-defined CFEOM3 subtype mapped by linkage in a family without a
    KIF21A or TUBB3 variant. It is retained here as a distinct nosological
    entity because the causal gene at the locus is not established, so the
    subtype cannot yet be folded into a gene-defined class.
- name: CFEOM5
  display_name: CFEOM5 (COL25A1, autosomal recessive)
  classification: genetic
  subtype_term:
    preferred_term: fibrosis of extraocular muscles, congenital, 5
    term:
      id: MONDO:0014538
      label: fibrosis of extraocular muscles, congenital, 5
  genes:
  - preferred_term: COL25A1
    term:
      id: hgnc:18603
      label: COL25A1
  description: >-
    Autosomal recessive CCDD with a CFEOM ophthalmic phenotype caused by
    biallelic COL25A1 variants that reduce protein stability or level. COL25A1
    encodes CLAC-P, a transmembrane collagen implicated in oculomotor neuron
    development, placing this subtype outside the cytoskeletal and
    transcription-factor mechanisms of the other subtypes.
  evidence:
  - reference: PMID:25500261
    reference_title: "Recessive mutations in COL25A1 are a cause of congenital cranial dysinnervation disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that lack of COL25A1 might interfere with molecular
      pathways involved in oculomotor neuron development, leading to CCDD
      phenotypes.
    explanation: >-
      Assigns the COL25A1 subtype to the same oculomotor-neuron developmental
      mechanism as the rest of the CFEOM spectrum.
- name: Tukel syndrome
  display_name: Tukel syndrome (CFEOM with postaxial ulnar hand anomalies)
  classification: genetic
  subtype_term:
    preferred_term: Tukel syndrome
    term:
      id: MONDO:0012270
      label: Tukel syndrome
  description: >-
    An autosomal recessive syndromic variant in which non-progressive
    restrictive ophthalmoplegia with blepharoptosis is accompanied by postaxial
    (ulnar) oligodactyly or oligosyndactyly of the hands. Described in a large
    consanguineous Turkish family and mapped by linkage to chromosome 21qter;
    the causal gene remains unidentified. The co-occurrence of a cranial
    dysinnervation phenotype with a posterior limb-patterning defect is the
    feature that distinguishes it from isolated CFEOM.
  evidence:
  - reference: PMID:15863670
    reference_title: "A new syndrome, congenital extraocular muscle fibrosis with ulnar hand anomalies, maps to chromosome 21qter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The postaxial oligodactyly/oligosyndactyly of the hands was more severe on
      the right side.
    explanation: >-
      Defines the ulnar hand anomaly that distinguishes Tukel syndrome from
      isolated CFEOM.
  - reference: PMID:15863670
    reference_title: "A new syndrome, congenital extraocular muscle fibrosis with ulnar hand anomalies, maps to chromosome 21qter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genome-wide scan established linkage of this new autosomal recessive
      syndrome to a locus on chromosome 21qter.
    explanation: >-
      Establishes the recessive inheritance and 21qter locus of Tukel syndrome.
pathophysiology:
- name: KIF21A Kinesin Autoinhibition Loss
  biological_scale: MOLECULAR
  description: >-
    KIF21A is an anterograde kinesin whose motor activity is normally restrained
    by an intramolecular autoinhibitory interaction between its third coiled-coil
    stalk and its motor domain. The recurrent CFEOM1 missense variants cluster in
    exactly these two elements and attenuate that autoinhibition, so the motor is
    inappropriately active. This is a gain-of-function lesion, not haploinsufficiency,
    which is why heterozygous missense variants are pathogenic while KIF21A null
    alleles are not a recognised cause of CFEOM.
  molecular_functions:
  - preferred_term: KIF21A microtubule motor activity
    term:
      id: GO:0003777
      label: microtubule motor activity
    modifier: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: oculomotor alpha motor neuron
    term:
      id: CL:0008038
      label: alpha motor neuron
  evidence:
  - reference: PMID:24656932
    reference_title: "Human CFEOM1 mutations attenuate KIF21A autoinhibition and cause oculomotor axon stalling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We establish a gain-of-function mechanism and find that human motor or
      stalk mutations attenuate Kif21a autoinhibition, providing in vivo
      evidence for mammalian kinesin autoregulation.
    explanation: >-
      Establishes attenuated KIF21A autoinhibition as the gain-of-function
      molecular lesion in CFEOM1.
  - reference: PMID:14595441
    reference_title: "Heterozygous mutations of the kinesin KIF21A in congenital fibrosis of the extraocular muscles type 1 (CFEOM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary mutational hotspots are in the stalk domain, highlighting an
      important new role for KIF21A and its stalk in the formation of the
      oculomotor axis.
    explanation: >-
      Localises the CFEOM1 variants to the stalk domain that mediates
      autoinhibition.
  downstream:
  - target: Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
    causal_link_type: DIRECT
    description: >-
      A disinhibited KIF21A motor perturbs the axonal cytoskeleton of the
      developing oculomotor nerve, and its superior-division axons fail to
      advance normally.
    evidence:
    - reference: PMID:24656932
      reference_title: "Human CFEOM1 mutations attenuate KIF21A autoinhibition and cause oculomotor axon stalling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate that Kif21a knockin mice harboring the most common human
        mutation develop CFEOM. The developing axons of the oculomotor nerve's
        superior division stall in the proximal nerve; the growth cones enlarge,
        extend excessive filopodia, and assume random trajectories.
      explanation: >-
        A knockin mouse carrying the common human allele shows the stalling and
        growth-cone disorganisation this edge asserts.
- name: PHOX2A-Dependent Oculomotor and Trochlear Nucleus Specification Failure
  biological_scale: CELLULAR
  description: >-
    PHOX2A (ARIX) is a homeodomain transcription factor required to specify the
    midbrain oculomotor (nIII) and trochlear (nIV) motor nuclei. Biallelic
    loss-of-function variants remove that determinant, so the motor neuron pools
    that should innervate the extraocular muscles are never properly formed. This
    is the CFEOM2 route into the shared downstream lesion, and it is upstream of
    axon guidance rather than a guidance defect itself.
  molecular_functions:
  - preferred_term: PHOX2A homeodomain transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: oculomotor nerve development
    term:
      id: GO:0021557
      label: oculomotor nerve development
    modifier: DECREASED
  - preferred_term: trochlear nerve development
    term:
      id: GO:0021558
      label: trochlear nerve development
    modifier: DECREASED
  cell_types:
  - preferred_term: oculomotor and trochlear alpha motor neuron
    term:
      id: CL:0008038
      label: alpha motor neuron
  evidence:
  - reference: PMID:11600883
    reference_title: "Homozygous mutations in ARIX(PHOX2A) result in congenital fibrosis of the extraocular muscles type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ARIX encodes a homeodomain transcription factor protein previously shown
      to be required for nIII/nIV development in mouse and zebrafish.
    explanation: >-
      Identifies the developmental role of PHOX2A/ARIX in the oculomotor and
      trochlear nuclei that biallelic loss removes.
  - reference: PMID:11600883
    reference_title: "Homozygous mutations in ARIX(PHOX2A) result in congenital fibrosis of the extraocular muscles type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings confirm the hypothesis that CFEOM2 results from the
      abnormal development of nIII/nIV (ref. 7) and emphasize a critical role
      for ARIX in the development of these midbrain motor nuclei.
    explanation: >-
      Directly attributes CFEOM2 to abnormal development of the nIII/nIV motor
      nuclei.
  - reference: PMID:34081534
    reference_title: "Axonal Growth Abnormalities Underlying Ocular Cranial Nerve Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These disorders can arise through one of two mechanisms: (a) defective
      motor neuron specification, usually by loss of a transcription factor
      necessary for brainstem patterning, or (b) axon growth and guidance
      abnormalities of the oculomotor, trochlear, and abducens nerves.
    explanation: >-
      Places the PHOX2A lesion in the transcription-factor specification arm of
      the two recognised CCDD mechanisms.
  downstream:
  - target: Hypoplasia of the Oculomotor and Trochlear Nerves
    causal_link_type: DIRECT
    description: >-
      Motor nuclei that are never specified cannot send out a normal nerve, so
      the nIII and nIV trunks are absent or hypoplastic.
    evidence:
    - reference: PMID:11600883
      reference_title: "Homozygous mutations in ARIX(PHOX2A) result in congenital fibrosis of the extraocular muscles type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neuropathologic studies indicate that these disorders may result from
        the maldevelopment of the oculomotor (nIII), trochlear (nIV) and
        abducens (nVI) cranial nerve nuclei.
      explanation: >-
        Links nuclear maldevelopment to the cranial nerve lesion that defines
        the congenital fibrosis syndromes.
- name: Beta-Tubulin Microtubule Dysfunction in Cranial Motor Neurons
  biological_scale: MOLECULAR
  description: >-
    TUBB3 and TUBB2B encode neuron-enriched beta-tubulin isotypes that
    heterodimerise with alpha-tubulin to build the dynamic microtubules of the
    growing axon and its growth cone. The CFEOM3-causing missense variants
    impair heterodimer formation, alter microtubule dynamic instability, and in a
    subset also disrupt the interface through which kinesin motors engage the
    microtubule lattice. The convergence of this arm with the KIF21A arm on the
    same clinical phenotype - one lesion in the track, the other in the motor -
    is the strongest mechanistic argument that CFEOM is a disorder of axonal
    transport and guidance.
  molecular_functions:
  - preferred_term: beta-tubulin structural constituent of the neuronal microtubule
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
    modifier: DYSREGULATED
  - preferred_term: microtubule-kinesin interaction
    term:
      id: GO:0019894
      label: kinesin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: tubulin heterodimer formation
    term:
      id: GO:0007021
      label: tubulin complex assembly
    modifier: DECREASED
  cell_types:
  - preferred_term: cranial motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Modeling each mutation in yeast tubulin demonstrates that all alter
      dynamic instability whereas a subset disrupts the interaction of
      microtubules with kinesin motors.
    explanation: >-
      Establishes altered microtubule dynamics in every allele and disrupted
      microtubule-kinesin interaction in a subset.
  - reference: PMID:23001566
    reference_title: "An inherited TUBB2B mutation alters a kinesin-binding site and causes polymicrogyria, CFEOM and axon dysinnervation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TUBB2B-E421K αβ-heterodimers are incorporated into the microtubule
      network where they alter microtubule dynamics and can reduce kinesin
      localization.
    explanation: >-
      Shows the CFEOM-causing TUBB2B allele acts through the same
      dynamics-and-kinesin mechanism as the TUBB3 alleles.
  downstream:
  - target: Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
    causal_link_type: DIRECT
    description: >-
      Microtubules whose dynamics and kinesin engagement are perturbed cannot
      support normal growth-cone steering in the developing ocular motor nerves.
    evidence:
    - reference: PMID:20074521
      reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A knock-in disease mouse model reveals axon guidance defects without
        evidence of cortical cell migration abnormalities.
      explanation: >-
        The knock-in model isolates axon guidance, not neuronal migration, as
        the consequence of the TUBB3 lesion.
  - target: Commissural and Corticospinal Axon Guidance Failure
    causal_link_type: DIRECT
    description: >-
      The same tubulin lesion also perturbs guidance of callosal and other
      long-range projection axons, which is why some TUBB3 and TUBB2B alleles

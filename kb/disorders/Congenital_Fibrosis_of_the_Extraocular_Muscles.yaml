diagnosis:
- name: High-resolution orbital MRI
  description: >-
    Thin-section orbital MRI demonstrates hypoplasia of the affected extraocular
    muscles together with hypoplasia and misdirection of the motor nerves that
    supply them. This is the modality that established the neurogenic basis of
    CFEOM, and so is the imaging counterpart of the causal direction this entry
    models: the nerve lesion is visible alongside the muscle lesion it causes.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34081534
    reference_title: "Axonal Growth Abnormalities Underlying Ocular Cranial Nerve Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of fourteen individuals with CFEOM1 and KIF21A mutations from six families demonstrated profound hypoplasia of the SR and LPS muscles, and hypoplasia and misdirection of all the motor nerves in the orbit"
    explanation: >-
      Establishes orbital MRI as the investigation that shows both the muscle
      hypoplasia and the nerve hypoplasia and misdirection underlying it.
- name: Brain MRI for associated central malformations
  description: >-
    Brain imaging identifies the central nervous system malformations that
    accompany the tubulinopathy forms, and so contributes to distinguishing
    CFEOM3 from the more restricted CFEOM1 phenotype.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging reveals a spectrum of abnormalities including hypoplasia of oculomotor nerves and dysgenesis of the corpus callosum, anterior commissure, and corticospinal tracts"
    explanation: >-
      Names the central malformations neuroimaging detects in the TUBB3 forms,
      which is what makes brain imaging diagnostically informative here.
- name: Exome or genome sequencing
  description: >-
    Molecular diagnosis rests on sequencing the known CFEOM genes; broader exome
    or genome sequencing is used for the substantial fraction of ocular
    congenital cranial dysinnervation disorders that remain genetically
    unsolved after targeted testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39033378
    reference_title: "Expanding the genetics and phenotypes of ocular congenital cranial dysinnervation disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We coupled phenotyping with exome or genome sequencing of 467 probands"
    explanation: >-
      Documents exome or genome sequencing as the strategy applied to
      genetically unsolved ocular CCDD probands, the group CFEOM sits within.

treatments:
- name: Inferior Rectus Recession (Strabismus Surgery)
  description: >-
    Bilateral recession of the tight, fibrotic inferior recti to raise the eyes
    towards the horizontal midline and relieve the compensatory chin-up head
    posture. Surgery rebalances the globes mechanically; it does not restore
    innervation or ocular motility. A secondary exotropia, often A-pattern,
    emerges after inferior rectus recession because adduction is further
    weakened, so horizontal surgery is deliberately staged until the vertical
    result has declared itself.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: strabismus surgery
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_mechanisms:
  - target: Denervation-Driven Extraocular Muscle Maldevelopment and Fibrosis
    treatment_effect: MODULATES
    description: >-
      Recession lengthens the restrictive fibrotic muscle and so relieves the
      mechanical tether, without addressing the upstream dysinnervation.
    evidence:
    - reference: PMID:31848785
      reference_title: "Surgical management of pediatric patients with congenital fibrosis of the extraocular muscles."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bilateral IR recession in pediatric patients with CFEOM was effective in
        improving AHP, but postoperative exotropia appeared to be inevitable
        owing to the diminished adducted function caused by IR recession.
      explanation: >-
        Documents both the benefit on head posture and the mechanical trade-off
        of recessing the fibrotic muscle.
  evidence:
  - reference: PMID:31848785
    reference_title: "Surgical management of pediatric patients with congenital fibrosis of the extraocular muscles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, horizontal strabismus surgery should be planned after the results of
      IR recession become evident.
    explanation: >-
      Supports the staged surgical strategy recorded in this treatment entry.
  - reference: PMID:31313749
    reference_title: "Congenital fibrosis of the extraocular muscles: review of recent literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical management of patients with CFEOM continues to be challenging.
    explanation: >-
      A contemporary review qualifies the expected benefit of strabismus surgery
      in CFEOM.
- name: Frontalis Suspension for Ptosis
  description: >-
    Suspension of the eyelid to the frontalis muscle, typically with a silicone
    sling, to lift the ptotic lid when levator function is too poor for levator
    surgery. Lid elevation must be judged against the risk of exposure
    keratopathy, since the immobile, infraducted globe and absent Bell phenomenon
    leave the cornea vulnerable once the lid is raised.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: frontalis suspension ptosis surgery
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_mechanisms:
  - target: Bilateral Congenital Ptosis
    treatment_effect: BYPASSES
    description: >-
      The sling substitutes frontalis action for the denervated levator
      palpebrae superioris, mechanically bypassing rather than correcting the
      dysinnervation.
    evidence:
    - reference: PMID:37364855
      reference_title: "Outcome of silicone sling frontalis suspension in children with simple congenital and complex ptosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Complex cases included blepharophimosis epicanthus inversus syndrome (n
        = 35), Marcus Gunn jaw-winking syndrome (n = 12), oculomotor palsy (n =
        8), congenital fibrosis of extraocular muscles (n = 3), chronic
        progressive external ophthalmoplegia (n = 3), and others.
      explanation: >-
        Places CFEOM among the complex ptosis indications treated by silicone
        sling frontalis suspension in this cohort.
  evidence:
  - reference: PMID:37364855
    reference_title: "Outcome of silicone sling frontalis suspension in children with simple congenital and complex ptosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Silicone sling FS has a favourable outcome in 70% of pediatric patients.
    explanation: >-
      Quantifies the expected outcome of the procedure in the paediatric
      population that includes CFEOM.
- name: Amblyopia and Refractive Management
  description: >-
    Spectacle correction of refractive error together with occlusion or
    penalization of the better-seeing eye. Because the motility deficit is
    static and surgically irreversible, protecting visual development is the
    part of management with the greatest effect on final acuity.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: refractive correction and amblyopia therapy
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Amblyopia
    treatment_effect: MODULATES
    description: >-
      Correcting refractive error and forcing use of the amblyopic eye addresses
      the deprivational and refractive contributions to visual loss, which are
      independent of the dysinnervation itself.
    evidence:
    - reference: PMID:7724178
      reference_title: "Congenital fibrosis of the vertically acting extraocular muscles. A new group of dominantly inherited ocular fibrosis with radiologic findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Refractive error and amblyopia also were variable.
      explanation: >-
        Establishes refractive error and amblyopia as variable, and therefore
        individually assessable and treatable, features.
- name: Genetic Counseling
  description: >-
    Molecular testing distinguishes the autosomal dominant KIF21A, TUBB3, and
    TUBB2B subtypes from the autosomal recessive PHOX2A and COL25A1 subtypes,
    which carry very different recurrence risks, and identifies the TUBB3 and
    TUBB2B genotypes that warrant surveillance for the extraocular neurological
    features.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation causes the ocular motility disorder CFEOM3, whereas some
      also result in intellectual and behavioral impairments, facial paralysis,
      and/or later-onset axonal sensorimotor polyneuropathy.
    explanation: >-
      Allele-dependent extraocular features are the reason genotype changes
      counselling and surveillance in CFEOM.
discussions:
- discussion_id: gap_cfeom_selective_oculomotor_vulnerability
  prompt: >-
    Why do ubiquitously expressed lesions in KIF21A, TUBB3, TUBB2B, and COL25A1
    produce a phenotype largely restricted to the oculomotor and trochlear
    nerves rather than a generalised axonopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KIF21A Kinesin Autoinhibition Loss
  - pathophysiology#Beta-Tubulin Microtubule Dysfunction in Cranial Motor Neurons
  - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
  rationale: >-
    KIF21A and the beta-tubulins are expressed far more widely than the ocular
    motor nuclei, yet CFEOM1 is a clinically isolated eye movement disorder. The
    mouse work names this as a selective vulnerability of the developing
    oculomotor nerve to cytoskeletal perturbation but does not explain what
    confers it, and the TUBB3 alleles that do add extraocular features show the
    restriction is allele-dependent rather than absolute. Without a mechanism
    for the selectivity, genotype-phenotype prediction across the spectrum
    remains descriptive.
  evidence:
  - reference: PMID:24656932
    reference_title: "Human CFEOM1 mutations attenuate KIF21A autoinhibition and cause oculomotor axon stalling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      highlights a selective vulnerability of the developing oculomotor nerve to
      perturbations of the axon cytoskeleton
    explanation: >-
      Names the selective vulnerability that this gap asks to be explained.
  - reference: PMID:34081534
    reference_title: "Axonal Growth Abnormalities Underlying Ocular Cranial Nerve Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Study of these disorders highlights the complexities of axon guidance and
      how each population of neurons uses a unique but overlapping set of axon
      guidance pathways.
    explanation: >-
      Frames the population-specific guidance repertoire that a mechanism for
      the selectivity would have to explain.
  proposed_experiments:
  - experiment_id: exp_cfeom_ocular_motor_neuron_specific_profiling
    name: Developmental-stage profiling of ocular motor versus spinal motor neurons
    description: >-
      Compare the transcriptome, cytoskeletal composition, and kinesin cargo
      complement of developing oculomotor, trochlear, abducens, and spinal motor
      neurons at the stage at which CFEOM axons stall, in wild-type and in
      Kif21a and Tubb3 knockin animals, to identify features that distinguish
      the vulnerable from the spared pools.
    decision_criterion: >-
      Identification of a factor whose loss or supplementation shifts the
      stalling phenotype between ocular motor and spared motor neuron
      populations.
    would_support:
    - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
- discussion_id: gap_cfeom_mondo_myopathy_classification
  prompt: >-
    Should CFEOM continue to be classified ontologically as a myopathy of
    extraocular muscle and a progressive muscular dystrophy when the evidence
    establishes it as a non-progressive neurogenic dysinnervation disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hypoplasia of the Oculomotor and Trochlear Nerves
  - pathophysiology#Denervation-Driven Extraocular Muscle Maldevelopment and Fibrosis
  rationale: >-
    MONDO:0007614 is currently placed under both myopathy of extraocular muscle
    and progressive muscular dystrophy. Human neuropathology and genotyped
    orbital MRI both establish that the neuronal lesion is primary and the
    myopathy secondary, and every characterisation of the disorder describes it
    as non-progressive. The ontology placement therefore asserts two things the
    curated mechanism contradicts. This entry records the discrepancy rather
    than silently reclassifying; resolving it belongs upstream in MONDO.
  evidence:
  - reference: PMID:15671279
    reference_title: "Magnetic resonance imaging evidence for widespread orbital dysinnervation in congenital fibrosis of extraocular muscles due to mutations in KIF21A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that neuronal disease is primary in CFEOM1, with
      myopathy arising secondary to abnormal innervation and minimal rectus
      pulley abnormality secondary to reduced EOM forces.
    explanation: >-
      States the primary-neurogenic, secondary-myopathic ordering that conflicts
      with a myopathy or dystrophy classification.
- discussion_id: gap_cfeom_genetically_unsolved_probands
  prompt: >-
    What accounts for the majority of CFEOM and related ocular congenital
    cranial dysinnervation disorder probands who remain genetically unsolved
    after exome and genome sequencing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
  - pathophysiology#Hypoplasia of the Oculomotor and Trochlear Nerves
  rationale: >-
    The named CFEOM subtypes account for only part of the clinical spectrum.
    A large sequencing study of previously unsolved ocular CCDD pedigrees
    resolved fewer than one in ten probands and left most of the cohort without
    a pathogenic variant, so the curated gene list here is a floor rather than a
    complete account of the disorder. The locus-defined CFEOM3C subtype and the
    unmapped Tukel syndrome gene are the same gap visible from the nosological
    side.
  evidence:
  - reference: PMID:39033378
    reference_title: "Expanding the genetics and phenotypes of ocular congenital cranial dysinnervation disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses elucidated phenotypic subgroups, identified pathogenic/likely
      pathogenic variant(s) in 43 of 467 probands (9.2%), and prioritized
      variants of uncertain significance in 70 of 467 additional probands
      (15.0%).
    explanation: >-
      Quantifies how much of the previously unsolved ocular CCDD cohort remains
      without an established genetic cause.
  - reference: PMID:39033378
    reference_title: "Expanding the genetics and phenotypes of ocular congenital cranial dysinnervation disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study suggests that unsolved oCCDDs are clinically and genetically
      heterogeneous disorders often overlapping other Mendelian conditions and
      nominates many candidates for future replication and functional studies.
    explanation: >-
      States that the residual cohort is heterogeneous and overlaps other
      Mendelian conditions, which is why the gap is not closed by one gene.
  proposed_experiments:
  - experiment_id: exp_cfeom_noncoding_and_functional_replication
    name: Non-coding and functional replication of prioritized oCCDD candidates
    description: >-
      Extend sequencing of unsolved CFEOM pedigrees beyond protein-coding
      regions to regulatory and structural variation affecting the established
      axon-guidance genes, and functionally test prioritized candidate variants
      in ocular motor neuron models for the stalling and misrouting phenotype.
    decision_criterion: >-
      Replication of a candidate gene or regulatory variant in independent
      pedigrees together with a reproducible ocular motor axon phenotype in a
      model system.
    would_support:
    - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance

- name: Aberrant Reinnervation of Extraocular Muscles
  biological_scale: TISSUE
  description: >-
    Denervated extraocular muscles are secondarily and inappropriately
    reinnervated by misrouted branches of the surviving oculomotor nerve, most
    characteristically the lateral rectus. Because the aberrantly supplied muscle
    now fires with its new parent nerve rather than with its normal partner, the
    eye makes paradoxical, synkinetic movements - upshoots and downshoots on
    attempted adduction, A-pattern deviation, and in the rarest form synergistic
    divergence, in which attempted adduction produces abduction of both eyes.
    This is the same aberrant-reinnervation logic that produces globe retraction
    in Duane retraction syndrome.

    the orbit; axons of the inferior division reach the orbit but branch
    ectopically. This selective vulnerability of the developing oculomotor nerve
    to perturbations of the axon cytoskeleton is what makes an otherwise
    ubiquitously expressed motor or tubulin lesion present as an isolated eye
    movement disorder.

name: Congenital Fibrosis of the Extraocular Muscles
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital fibrosis of extraocular muscles
  term:
    id: MONDO:0007614
    label: congenital fibrosis of extraocular muscles
description: >-
  Congenital fibrosis of the extraocular muscles (CFEOM) is a congenital,
  non-progressive restrictive ophthalmoplegia with blepharoptosis, in which the
  eyes are held in a fixed, usually infraducted position and cannot be elevated
  above the horizontal midline. Despite the name, CFEOM is not a primary
  myopathy: it is a congenital cranial dysinnervation disorder (CCDD). The
  primary lesion lies in the developing oculomotor (cranial nerve III) and
  trochlear (cranial nerve IV) nuclei and their axons; neuropathology and
  high-resolution orbital MRI show absent or hypoplastic ocular motor nerves and
  loss of the corresponding alpha motor neurons, with the extraocular muscle
  atrophy and "fibrosis" that gives the disorder its name arising secondarily
  from denervation. Aberrant reinnervation of denervated muscles by misrouted
  branches of the surviving oculomotor nerve produces the synkinetic and
  paradoxical residual eye movements that are characteristic of the disorder.
  Four principal molecular routes converge on this lesion: gain-of-function
  missense variants in the anterograde kinesin KIF21A that attenuate its
  autoinhibition and stall superior-division oculomotor axons (CFEOM1, and the
  dominant CFEOM3B); recessive loss of the homeodomain transcription factor
  PHOX2A/ARIX, which is required to specify the nIII/nIV motor nuclei (CFEOM2);
  heterozygous missense variants in the neuron-specific beta-tubulins TUBB3 and
  TUBB2B that alter microtubule dynamics and microtubule-kinesin interaction
  (CFEOM3, with variable CNS involvement); and recessive loss of COL25A1
  (CFEOM5). CFEOM sits in the CCDD family alongside Duane retraction syndrome,
  Moebius syndrome, and horizontal gaze palsy with progressive scoliosis, all of
  which arise from maldevelopment or miswiring of ocular motor cranial nerves
  rather than from a primary muscle defect. Management is supportive and
  surgical - inferior rectus recession to correct the chin-up head posture,
  ptosis suspension surgery, refractive correction, and amblyopia therapy - and
  does not restore normal ocular motility.
parents:
- ocular motility disease
- congenital nervous system disorder
- hereditary neurological disease
- disorder of development or morphogenesis
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    CFEOM1 and CFEOM3 (KIF21A, TUBB3, TUBB2B) are inherited in an autosomal
    dominant manner; affected individuals are heterozygous for a missense
    variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:14595441
    reference_title: "Heterozygous mutations of the kinesin KIF21A in congenital fibrosis of the extraocular muscles type 1 (CFEOM1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital fibrosis of the extraocular muscles type 1 (CFEOM1; OMIM
      #135700) is an autosomal dominant strabismus disorder associated with
      defects of the oculomotor nerve.
    explanation: >-
      Establishes CFEOM1, the commonest form, as an autosomal dominant disorder
      of the oculomotor nerve.
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report that eight heterozygous missense mutations in TUBB3, encoding
      the neuron-specific beta-tubulin isotype III, result in a spectrum of
      human nervous system disorders that we now call the TUBB3 syndromes.
    explanation: >-
      Heterozygous TUBB3 missense variants are sufficient to cause CFEOM3,
      supporting autosomal dominant transmission of that subtype.
- name: Autosomal recessive inheritance
  description: >-
    CFEOM2 (PHOX2A/ARIX), CFEOM5 (COL25A1), and the Tukel syndrome variant are
    inherited in an autosomal recessive manner, and have been described mainly in
    consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:14597037
    reference_title: "A novel PHOX2A/ARIX mutation in an Iranian family with congenital fibrosis of extraocular muscles type 2 (CFEOM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents and the unaffected siblings were heterozygous,and the two
      affected siblings were homozygous for this mutation.
    explanation: >-
      Homozygous affected siblings with heterozygous unaffected parents
      establishes autosomal recessive transmission of CFEOM2.
  - reference: PMID:25500261
    reference_title: "Recessive mutations in COL25A1 are a cause of congenital cranial dysinnervation disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified three mutations in collagen, type XXV, alpha 1 (COL25A1) in
      individuals with autosomal-recessive inheritance of CCDD ophthalmic
      phenotypes.
    explanation: >-
      Establishes autosomal recessive inheritance for the COL25A1 (CFEOM5) form.

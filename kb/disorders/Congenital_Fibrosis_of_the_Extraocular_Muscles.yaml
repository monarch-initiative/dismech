  phenotype_term:
    preferred_term: Compensatory head posture
    term:
      id: HP:0031705
      label: Compensatory head posture
  evidence:
  - reference: PMID:31848785
    reference_title: "Surgical management of pediatric patients with congenital fibrosis of the extraocular muscles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the cases showed bilateral ptosis and a chin-up abnormal head posture
      (AHP).
    explanation: >-
      Documents the chin-up compensatory head posture in a paediatric CFEOM
      surgical series.
- name: Refractive Error
  category: Ophthalmologic
  description: >-
    Refractive error occurs in CFEOM and is reported as variable in severity
    across affected individuals. It is curated because it is one of the two
    amblyogenic factors this entry already treats, and because the anomalous
    globe position and chronic head posture that follow the dysinnervation
    plausibly contribute to it -- though no source curated here demonstrates
    that causal step, so no downstream edge is asserted.
  phenotype_term:
    preferred_term: Refractive error
    term:
      id: HP:0000539
      label: Abnormality of refraction
  evidence:
  - reference: PMID:7724178
    reference_title: "Congenital fibrosis of the vertically acting extraocular muscles. A new group of dominantly inherited ocular fibrosis with radiologic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Refractive error and amblyopia also were variable"
    explanation: >-
      Documents refractive error in the reported CFEOM cohort. No frequency band
      is asserted: "variable" describes spread, not a proportion, and per the
      frequency SOP that does not support a FrequencyEnum value.
- name: Amblyopia
  description: >-
    Amblyopia is a recognised and variable complication, driven by the
    combination of ptotic lid occlusion, ocular misalignment, and associated
    refractive error, and is a target of occlusion or penalization therapy.
  phenotype_term:
    preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:7724178
    reference_title: "Congenital fibrosis of the vertically acting extraocular muscles. A new group of dominantly inherited ocular fibrosis with radiologic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Refractive error and amblyopia also were variable.
    explanation: >-
      Reports amblyopia, of variable degree, in a dominantly inherited
      congenital ocular fibrosis pedigree.
- name: Corneal Scarring from Exposure Keratopathy
  description: >-
    An immobile, infraducted globe with an absent Bell phenomenon and poor lid
    closure leaves the cornea chronically exposed, producing superficial
    keratopathy and, in many patients, corneal scarring. This is a preventable
    cause of visual loss that is independent of the motility deficit itself.
  phenotype_term:
    preferred_term: Corneal scarring
    term:
      id: HP:0000559
      label: Corneal scarring
  evidence:
  - reference: PMID:7724178
    reference_title: "Congenital fibrosis of the vertically acting extraocular muscles. A new group of dominantly inherited ocular fibrosis with radiologic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected members showed superficial keratopathy, many with corneal
      scarring.
    explanation: >-
      Documents superficial keratopathy in all affected members and corneal
      scarring in many.
- name: Optic Nerve Hypoplasia
  description: >-
    Subclinical but statistically robust reduction in optic nerve size on orbital
    MRI in CFEOM1, indicating that the dysinnervation extends to the sensory as
    well as the motor apparatus of the orbit.

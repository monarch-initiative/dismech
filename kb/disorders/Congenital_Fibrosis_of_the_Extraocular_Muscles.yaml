- name: Denervation-Driven Extraocular Muscle Maldevelopment and Fibrosis
  biological_scale: TISSUE
  description: >-
    Deprived of their motor innervation during development, the affected
    extraocular muscles - most consistently the levator palpebrae superioris and
    superior rectus - are hypoplastic and atrophic, show increased internal
    nuclei and central mitochondrial clumping, and are progressively replaced by
    fibrous connective tissue. The muscles become mechanically restrictive, which
    is why forced duction testing is positive and why the ophthalmoplegia is
    restrictive rather than simply paralytic. Because the fibrosis is a

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects with CFEOM1 exhibited subclinical but highly significant
      reduction from normal in mean optic nerve size (P < 0.001).
    explanation: >-
      Quantifies the reduction in optic nerve size that this phenotype records.
- name: Abnormal Corpus Callosum Morphology
  subtype: CFEOM3A
  description: >-
    Dysgenesis of the corpus callosum, together with the anterior commissure and
    corticospinal tracts, on neuroimaging in the TUBB3 subtype. The finding is
    dysgenesis rather than frank agenesis, and reflects misrouting of commissural
    projection axons by the same tubulin lesion that misroutes the ocular motor
    axons.
  phenotype_term:
    preferred_term: Abnormal corpus callosum morphology
    term:
      id: HP:0001273
      label: Abnormal corpus callosum morphology
  evidence:
  - reference: PMID:20074521
    reference_title: "Human TUBB3 mutations perturb microtubule dynamics, kinesin interactions, and axon guidance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging reveals a spectrum of abnormalities including hypoplasia of
      oculomotor nerves and dysgenesis of the corpus callosum, anterior
      commissure, and corticospinal tracts.
    explanation: >-
      Reports corpus callosum dysgenesis on neuroimaging in TUBB3 disease.
- name: Polymicrogyria
  description: >-
    Cortical malformation seen with the TUBB2B E421K allele, which segregates
    with CFEOM in the same family. It marks the boundary between the pure
    dysinnervation phenotype and the wider tubulinopathy spectrum.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Every reported individual has a central-nervous-system presentation and
      essentially nothing else that determines outcome: global developmental delay,
      early-onset refractory epilepsy, microcephaly, and cortical and cerebellar
      atrophy on imaging. The non-neurological findings that recur - feeding
      difficulty, transient transaminase elevation, one ventricular septal defect -
      are either secondary to the neurological state or isolated observations, so
      unlike the SARS1 entry there is no competing organ system with a claim on the
      chapter assignment.
    evidence:
    - reference: PMID:30755602
      reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subjects present with a range of global developmental delay, epileptic encephalopathy and primary or progressive microcephaly."
      explanation: Enumerates the presenting features as exclusively neurological, which is the basis for the NEUROLOGIC chapter assignment.
  icimd_category:
  - classification_value: non_mitochondrial_trna_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) places cytoplasmic aminoacyl-tRNA
      synthetase defects under "Disorders of non-mitochondrial tRNA metabolism". This
      is the slot where the VARS1 / VARS2 distinction becomes machine-visible: VARS2,
      the mitochondrial valyl-tRNA synthetase, takes the separate ICIMD group
      "Disorders of mitochondrial aminoacyl-tRNA synthetases" and causes a different
      disease (mitochondrial encephalomyopathy). Different gene, different
      compartment, different tRNA pool.
    evidence:
    - reference: PMID:33340416
      reference_title: An international classification of inherited metabolic disorders (ICIMD).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The ICIMD aims to include any primary genetic condition in which alteration of a biochemical pathway is intrinsic to specific biochemical, clinical, and/or pathophysiological features."
      explanation: >-
        Establishes the inclusion criterion under which a cytoplasmic aminoacyl-tRNA
        synthetase deficiency is an inherited metabolic disorder and therefore takes an
        ICIMD group at all. `evidence_source` is OTHER because this is a consensus
        classification paper, not a study reporting data.
notes: >-
  Entity verification, run before any content was written. `runoak -i sqlite:obo:mondo
  info MONDO:0060621 -O obo` returns name "neurodevelopmental disorder with
  microcephaly, seizures, and cortical atrophy", synonym NDMSCA, xrefs OMIM:617802,
  MEDGEN:1615361, EFO:0009644, UMLS:C4540493, parent MONDO:0100500 (Mendelian
  neurodevelopmental disorder), and `relationship: RO:0004003 HGNC:12651 ! VARS1`.
  `runoak -i sqlite:obo:mondo relationships --direction down -p RO:0004003 HGNC:12651`
  returns exactly one disease, MONDO:0060621, so MONDO has not split the VARS1
  germline phenotype and this entry is the whole gene's disease space. `runoak -i
  sqlite:obo:hgnc info hgnc:12651 -O obo` confirms symbol VARS1, name "valyl-tRNA
  synthetase 1", Entrez 7407, Ensembl ENSG00000204394, UniProt P26640, EC 6.1.1.9,
  gene MIM 192150, with exact synonyms "valyl-tRNA synthetase" and "valine tRNA
  ligase 1, cytoplasmic". The alias list matters for reading the literature: every
  paper before the 2019 nomenclature change calls the gene VARS, not VARS1, and the
  protein ValRS.

  Named Entity Confusion - three traps for this entity, all checked with OAK before
  anything was written. (1) VARS2, the MITOCHONDRIAL valyl-tRNA synthetase, is a
  different gene causing mitochondrial encephalomyopathy; HGNC records it separately
  and the Friedman paper explicitly contrasts the two, so a literature search on
  "VARS" collides with it. (2) The neighbouring MONDO entity MONDO:0060577,
  "neurodevelopmental disorder with microcephaly, ataxia, and seizures" (NEDMAS,
  OMIM:617709), differs from this one by a single word in a nearly identical
  descriptive name and is caused by a DIFFERENT gene, SARS1 (HGNC:10537). It is
  already curated in this KB as `SARS1-Related_Neurodevelopmental_Disorder`. The two
  entries must not be conflated, and any deep-research report on either must be
  gene-checked before use. (3) The literature search term "VARS" also returns the
  Visual Aura Rating Scale for migraine (PMID:16162257), which is unrelated; it was
  excluded by inspection rather than by assuming the search was clean.

  Deep research. Two providers were run for this entry: `claude_code` and
  `openscientist`. `falcon` was attempted first, as the repository default, and
  failed with HTTP 402 Payment Required from the Edison API - the account has no
  credit - so no falcon report exists for this disorder. Every reference cited in
  this entry was located through PubMed E-utilities and fetched with `just
  fetch-reference` independently of any deep-research output, and every snippet was
  checked against the local reference cache.

  GeneReviews. No GeneReviews chapter exists for VARS1 or NDMSCA. PubMed E-utilities
  searches for VARS1 GeneReviews, valyl-tRNA synthetase GeneReviews and NDMSCA
  GeneReviews all returned zero records on 2026-08-18, so there is no expert-curated
  clinical baseline to cross-reference the phenotype list against. The phenotype
  section is therefore built from the primary cohort reports and the ARS1 scoping
  review rather than from a consensus chapter, and its coverage should be re-checked
  if a chapter is published.

  Case counting. A total published case count is deliberately not asserted. The
  cohorts overlap in reported variants (F1072L, R404W, R1058Q and T1068M each appear
  in more than one paper), the 2026 series recruited through GeneMatcher and so may
  share individuals with earlier reports, and that same series is internally
  inconsistent about its own denominator - the results text says "7 males and 4
  females from 10 different families" while reporting 13 affected individuals and
  quoting per-feature fractions out of 13. That paper carries a published corrigendum
  (PMID:41820113) whose content is not available in any cached full text, so which of
  its numbers the correction touches cannot be determined here. Per-feature fractions
  quoted in this entry are attributed to their specific cohort rather than pooled.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Every reported family is recessive: homozygous variants in the consanguineous
    kindreds of the founding report and of several later families, and compound
    heterozygous variants in the non-consanguineous families. Carrier parents are
    obligate heterozygotes and are not reported as affected in any cached paper. The
    class-level explanation offered for the recessive ARS deficiencies is that one
    functional allele supplies enough aminoacylation capacity, so disease requires
    both alleles to be damaged while still leaving residual activity - complete loss
    of a cytoplasmic aminoacyl-tRNA synthetase is presumed incompatible with life. No
    VARS1 paper measures the enzyme activity of a carrier parent's cells against a
    clinical phenotype, so the carrier statement is inherited from the class rather
    than demonstrated for VARS1. Note, however, that Friedman and colleagues did
    assay carrier-parent fibroblasts alongside patient cells, and Stephen and
    colleagues reported one allele that is a true null through nonsense-mediated
    decay - so at least one reported genotype is null-over-hypomorph rather than
    hypomorph-over-hypomorph.

    Penetrance is recorded as UNKNOWN rather than COMPLETE. Every reported biallelic
    individual is affected, but every one of them was ascertained because they were
    affected; no population-scale genotype-first study of VARS1 biallelic carriers
    exists, so the denominator needed for a penetrance statement is missing.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  evidence:
  - reference: PMID:41672381
    reference_title: Novel VARS1 variants define new clinical and molecular subtypes of a rare neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all affected individuals who presented with a neurodevelopmental syndrome with progressive microcephaly, seizures, and intellectual disability, we identified biallelic disease-causing variants in VARS1."
    explanation: States that disease in this cohort is associated with biallelic (two-allele) VARS1 genotypes, consistent with autosomal recessive inheritance.
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified novel compound heterozygous mutations in VARS that segregated with the proband: a missense (c.3192G>A; p.Met1064Ile) and a splice site mutation (c.1577-2A>G)."
    explanation: Documents biallelic compound heterozygous transmission segregating with disease in a non-consanguineous family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate has been published for NDMSCA, and
    MONDO:0060621 carries no Orphanet xref, so there is no source to band and
    `rate_per_100000` is deliberately left empty. `NOT_YET_DOCUMENTED` is used rather
    than a qualitative ultra-rare band for that reason. What can be said, and is
    quoted below, is that individual reports are small: the largest single series is
    13 individuals from 10 unrelated families, and it was assembled through
    international collaboration and GeneMatcher - a recruitment route that is itself
    evidence of rarity. Reported families are drawn from Indian, Egyptian, Turkish,
    Canadian, US, French, Brazilian and Cypriot ancestries, several of them
    consanguineous, which reflects ascertainment enriched for autosomal recessive
    disease rather than a true population distribution. See the entry-level notes for
    why the reports cannot be summed into a case count.
  evidence:
  - reference: PMID:41672381
    reference_title: Novel VARS1 variants define new clinical and molecular subtypes of a rare neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, this study reports, for the first time, individuals with biallelic VARS1 variants in French, Brazilian, and Cypriot populations, broadening the global scope of the disorder."
    explanation: >-
      Establishes that as recently as 2026 whole national populations had no reported
      case, which is the qualitative rarity statement available in place of a
      prevalence estimate.
pathophysiology:
- name: Biallelic Damaging VARS1 Alleles
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is damage to both copies of VARS1 at 6p21.33, reported against
    transcript NM_006295.2. The published allelic series is dominated by missense
    changes distributed across the aminoacylation (tRNA-synt_1) and anticodon-binding
    domains, with a minority of true null alleles - a canonical splice-acceptor change
    that triggers nonsense-mediated decay, and premature termination codons. Two
    positional observations are worth keeping apart. Hiz and colleagues showed that a
    quarter of reported variants cluster within a 15-residue helix-turn-helix stretch
    of the anticodon-binding domain, which suggests a shared structural failure mode
    for that subset; but Friedman and colleagues found reduced aminoacylation activity
    irrespective of where in the protein the variant fell. Position therefore explains
    how particular alleles fail, while the functional convergence is what defines the
    disorder.
  genes:
  - preferred_term: VARS1
    term:
      id: hgnc:12651
      label: VARS1
  mechanism_confidence: ESTABLISHED
  notes: >-
    No individual with two complete null alleles has been reported. Every genotype in
    the literature retains some residual charging capacity - a null allele is always
    paired with a hypomorphic missense allele, or both alleles are missense. This is
    the expected pattern if complete cytoplasmic ValRS loss is embryonic-lethal, and
    it is the reason the disorder is best read as a quantitative deficiency rather than
    an absence of the enzyme. It is an inference from the observed allelic series, not
    a measurement: no VARS1 null-null embryo has been examined.
  evidence:
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified novel compound heterozygous mutations in VARS that segregated with the proband: a missense (c.3192G>A; p.Met1064Ile) and a splice site mutation (c.1577-2A>G)."
    explanation: Documents the two-allele lesion, one missense and one splice-site, that constitutes the primary molecular defect.
  - reference: PMID:37529793
    reference_title: VARS1 mutations associated with neurodevelopmental disorder are located on a short amino acid stretch of the anticodon-binding domain.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "we uncovered that p.T1068M is clustered with three other pathogenic mutations in a 15 amino acid long stretch of the VARS1 anticodon-binding domain"
    explanation: Establishes the positional clustering of a subset of pathogenic alleles within the anticodon-binding domain.
  - reference: PMID:41672381
    reference_title: Novel VARS1 variants define new clinical and molecular subtypes of a rare neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two variants were predicted to induce premature protein truncation leading to loss of VARS1 function."
    explanation: Confirms that the allelic series includes truncating as well as missense alleles.
  downstream:
  - target: Reduced VARS1 Transcript and ValRS Protein Abundance
    description: >-
      The abundance arm. A splice-acceptor allele degraded by nonsense-mediated decay,
      or a premature termination codon, removes enzyme from the cell before any question
      of per-molecule catalytic competence arises.
  - target: Reduced Specific Activity of Assembled ValRS
    description: >-
      The catalytic arm. Missense alleles reduce the valylation rate of the enzyme that
      is present, independently of how much of it there is.
- name: Reduced VARS1 Transcript and ValRS Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    In the family reported by Stephen and colleagues, the splice-acceptor allele was
    shown by cDNA analysis of patient fibroblasts to be degraded by nonsense-mediated
    decay - a true null - and quantitation showed markedly reduced VARS1 mRNA and
    protein in those cells. This is a loss of enzyme, not a loss of enzyme quality, and
    it is one of the two routes by which patient cells arrive at insufficient charging
    capacity.
  genes:
  - preferred_term: VARS1
    term:
      id: hgnc:12651
      label: VARS1
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  mechanism_confidence: ESTABLISHED
  notes: >-
    This node and the specific-activity node are genotype-dependent alternatives, not
    universal features. Friedman and colleagues explicitly found the opposite pattern -
    retained VARS1 protein with reduced activity - in their cohort. Do not assert
    reduced protein abundance as a general property of NDMSCA.
  evidence:
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cDNA analysis on patient derived fibroblasts revealed that the splice site acceptor variant allele led to nonsense mediated decay, thus resulting in a null allele."
    explanation: Demonstrates that one allele is functionally absent through transcript decay.
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further quantitation of the expression of VARS showed remarkably reduced levels of mRNA and protein in skin derived fibroblasts."
    explanation: Measures the reduction in enzyme abundance directly in patient-derived cells.
  downstream:
  - target: Deficient Valylation of tRNA-Val
    description: >-
      Less enzyme present means less valine charged per unit time regardless of the
      intrinsic competence of each remaining molecule.
- name: Reduced Specific Activity of Assembled ValRS
  biological_scale: MOLECULAR
  description: >-
    The second and more commonly documented route. In the Friedman cohort, western
    blotting showed intact VARS1 protein in patient fibroblasts while the aminoacylation
    assay showed specifically reduced valylation activity, with leucyl- and arginyl-tRNA
    synthetase activities preserved in the same lysates - the internal control that
    makes this a ValRS-specific defect rather than a general sickness of the cells.
    Structural modelling supplies a mechanism for the anticodon-domain cluster:
    destabilised contacts between the anticodon-binding and catalytic domains impair the
    interdomain coordination needed for efficient tRNA charging without abolishing
    catalysis outright.
  genes:
  - preferred_term: VARS1
    term:
      id: hgnc:12651
      label: VARS1
  molecular_functions:
  - preferred_term: valine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004832
      label: valine-tRNA ligase activity
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient primary cells show intact VARS protein but reduced enzymatic activity, suggesting partial loss of function."
    explanation: Separates the specific-activity defect from any change in enzyme abundance, in patient-derived cells.
  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, irrespective of where the mutation occurred, we found reduced aminoacylation activity, suggesting that transferase activity reflects both the ability to bind tRNA as well as transfer the charged valine to the tRNA."
    explanation: >-
      The key functional-convergence observation: alleles in different domains all
      converge on reduced charging, which is what licenses treating charging capacity as
      the rate-limiting quantity.
  - reference: PMID:37529793
    reference_title: VARS1 mutations associated with neurodevelopmental disorder are located on a short amino acid stretch of the anticodon-binding domain.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Here, we propose that these clustered mutations can destabilize the interactions between the anticodon-binding and the tRNA synthetase domains and thus hindering the optimal enzymatic activity of VARS1."
    explanation: Supplies a structural mechanism for the loss of specific activity in the anticodon-domain allele cluster; explicitly a proposal from modelling, not a measurement.
  downstream:
  - target: Deficient Valylation of tRNA-Val
    description: >-
      A lower catalytic rate per enzyme molecule reduces the steady-state pool of charged
      tRNA-Val by the same final common route as reduced enzyme abundance.
- name: Deficient Valylation of tRNA-Val
  biological_scale: MOLECULAR
  description: >-
    The convergence point of both upstream arms and the rate-limiting quantity of the
    disorder. Cytoplasmic ValRS is the only enzyme that charges valine onto tRNA-Val,
    so there is no cytoplasmic paralogue to buffer the deficit - VARS2, the
    mitochondrial enzyme, serves a separate tRNA pool in a separate compartment and
    does not compensate. Measured aminoacylation activity is reduced in patient
    fibroblasts across independent cohorts.
  genes:
  - preferred_term: VARS1
    term:
      id: hgnc:12651
      label: VARS1
  biological_processes:
  - preferred_term: valyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006438
      label: valyl-tRNA aminoacylation
  chemical_entities:
  - preferred_term: L-valine
    term:
      id: CHEBI:16414
      label: L-valine
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  mechanism_confidence: ESTABLISHED
  notes: >-
    Aminoacylation has been measured in patient-derived skin fibroblasts, not in neural
    tissue. The inference that the same deficit obtains in developing brain is a
    tissue-extrapolation, and it is the step in the chain with the least direct support
    - see the `ndmsca-no-neural-measurement` discussion.
  evidence:
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Aminoacylation experiments on patient derived cells showed markedly reduced enzyme activity of ValRS suggesting the mutations to be loss of function."
    explanation: Direct measurement of reduced valylation activity in patient cells.
  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VARS encodes the only known valine cytoplasmic-localized aminoacyl-tRNA synthetase."
    explanation: Establishes the absence of a cytoplasmic paralogue, which is why the deficit cannot be buffered.
  - reference: PMID:30755616
    reference_title: Biallelic VARS variants cause developmental encephalopathy with microcephaly that is recapitulated in vars knockout zebrafish.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In silico, in vitro, and yeast complementation assays demonstrate that the underlying pathomechanism of these mutations is most likely a loss of protein function."
    explanation: Independent orthogonal assays in a second cohort reach the same loss-of-function conclusion.
  downstream:
  - target: Insufficient Cytoplasmic Translation Capacity for Developmental Demand
    description: >-
      A smaller pool of charged tRNA-Val sets a ceiling on the rate at which the
      cytoplasmic ribosome can elongate valine-containing nascent chains.
- name: Insufficient Cytoplasmic Translation Capacity for Developmental Demand
  biological_scale: CELLULAR
  description: >-
    The threshold step, and the premise the whole ARS-deficiency family rests on:
    residual charging capacity is adequate for most cells most of the time, and becomes
    limiting only where and when protein-synthesis demand is highest. In this disorder
    that means the brain during its period of maximal growth - proliferating neural
    progenitors and newly post-mitotic neurons - which is why an enzyme expressed in
    every cell in the body produces a phenotype that is almost entirely neurological,
    and why carrier parents with one functional allele are unaffected.
  biological_processes:
  - preferred_term: cytoplasmic translation
    modifier: DECREASED
    term:
      id: GO:0002181
      label: cytoplasmic translation
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    `mechanism_confidence` is HYPOTHETICAL, not ESTABLISHED, and the distinction is
    deliberate. Reduced valylation is measured; a resulting reduction in global or
    neuron-specific translation rate has not been measured in any VARS1 patient
    material or model. The threshold model is the standard explanatory frame for
    recessive ARS deficiencies and it accounts for the tissue selectivity, but for VARS1
    it remains an inference from enzymology plus phenotype rather than an observation.
    No polysome profiling, ribosome profiling or nascent-chain labelling study in a
    VARS1-deficient neural system has been published.
  evidence:
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The VARS gene encodes cytoplasmic valyl-tRNA synthetase (ValRS), an enzyme that is essential during eukaryotic translation."
    explanation: >-
      Supports the link from the enzyme to translation in principle. Marked PARTIAL
      because it states the enzyme's role in translation generally and does not measure
      translational output in patient cells.
  - reference: PMID:30755616
    reference_title: Biallelic VARS variants cause developmental encephalopathy with microcephaly that is recapitulated in vars knockout zebrafish.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ARSs have emerged as a cause of recessive, often complex neurological disease traits."
    explanation: >-
      Places the disorder in the recessive ARS class whose shared premise this node
      encodes. PARTIAL because it is a class-level statement, not a VARS1 translation
      measurement.
  downstream:
  - target: Impaired Brain Growth with Neural Cell Loss
    description: >-
      A translational ceiling during the period of maximal brain growth limits progenitor
      expansion and neuronal survival, which is the developmental arm of the phenotype.
  - target: White Matter Hypomyelination with Preserved Axons
    description: >-
      The parallel white-matter arm, drawn from the translational ceiling directly rather
      than through neuronal loss. The autopsy pattern is what forces this topology: myelin
      is deficient while axons are PRESERVED, so hypomyelination cannot be the end-stage
      of neuronal death. It is a sibling consequence, in the cell whose protein-synthesis
      burden during myelination is highest and which the threshold model therefore
      predicts should fail first.
- name: Impaired Brain Growth with Neural Cell Loss
  biological_scale: TISSUE
  description: >-
    The organ-level reading of the translational ceiling. Head growth in most reported
    children is normal or near-normal at birth and then falls away, typically slowing by
    one year of age, so the microcephaly is characteristically acquired and progressive
    rather than congenital - although congenital microcephaly at the severe end has been
    reported. The cellular correlate has been observed in the zebrafish vars knockout
    rather than in human tissue.

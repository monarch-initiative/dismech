name: Neurodevelopmental Disorder with Microcephaly, Seizures, and Cortical Atrophy
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder with microcephaly, seizures, and cortical atrophy
  term:
    id: MONDO:0060621
    label: neurodevelopmental disorder with microcephaly, seizures, and cortical atrophy
description: >-
  Neurodevelopmental disorder with microcephaly, seizures, and cortical atrophy
  (NDMSCA, OMIM 617802) is the single MONDO entity for germline disease caused by
  biallelic variants in VARS1, the gene encoding the CYTOPLASMIC valyl-tRNA
  synthetase (ValRS). ValRS is a class I aminoacyl-tRNA synthetase that esterifies
  valine onto tRNA-Val in the standard two-step reaction - valine plus ATP to an
  enzyme-bound valyl-adenylate, then transfer of the valyl moiety to the tRNA - and
  it is the only cytoplasmic enzyme that performs this step, so there is no
  cytoplasmic paralogue to compensate for its loss. The disorder therefore belongs
  to the recessive aminoacyl-tRNA-synthetase (ARS) deficiency family, whose proposed
  unifying premise is that residual charging capacity suffices at baseline but not
  in the tissues and life periods with the highest protein-synthesis demand - which
  in this disorder means the brain during its period of maximal growth.
  Presentation is early: severe global developmental delay, drug-refractory
  early-onset epilepsy (frequently myoclonic, with infantile spasms and
  hypsarrhythmia in some), profound or absent speech, axial hypotonia with limb
  hypertonia and brisk reflexes, feeding difficulties, and microcephaly that is
  usually acquired and progressive rather than congenital.

  The name is a trap, and this entry treats it as one. "Cortical atrophy" is in the
  disease label because the founding series found it, and longitudinal imaging in
  the Friedman cohort did demonstrate progressive loss of cortical volume with
  collapse of subcortical white matter. But the two largest subsequent reports
  contradict it as an obligate feature: Okur and colleagues described two siblings
  with biallelic VARS1 variants, intellectual disability and microcephaly but no
  seizures and no cortical atrophy at all, and the 2026 multi-family series states
  outright that progressive cortical atrophy, though considered a hallmark, was
  absent in several of their cases - and describes two siblings with a milder,
  explicitly non-progressive presentation with preserved speech and independent
  ambulation. Neither of the two features that name the disorder besides
  microcephaly is therefore required to have it. Both the atrophy node and the
  seizure node in this entry are curated as frequent-but-not-obligatory
  consequences, and the mismatch between the label and the entity is recorded as an
  open discussion rather than smoothed away.

  Mechanistically the entry rests on measurements rather than on inference from
  gene function. Patient-derived fibroblasts across independent cohorts show
  specifically reduced valyl-tRNA aminoacylation activity, and the two published
  routes to it are distinct: Stephen and colleagues found a null allele from
  nonsense-mediated decay together with a missense allele and markedly reduced VARS1
  mRNA and protein, whereas Friedman and colleagues found intact VARS1 protein with
  reduced enzymatic activity - i.e. loss of specific activity rather than loss of
  enzyme. Both converge on the same downstream quantity, a smaller pool of charged
  tRNA-Val, and the observation that reduced aminoacylation was found irrespective
  of where in the protein the variant fell is the strongest single argument that
  charging capacity, not any particular domain, is the rate-limiting quantity. The
  disorder is ultra-rare: the entire published clinical literature consists of single
  case reports and small multi-family series, the largest of which is thirteen
  individuals from ten unrelated families assembled through GeneMatcher. Those cohorts
  overlap in reported alleles and cannot be summed into a case count; see the
  entry-level notes.

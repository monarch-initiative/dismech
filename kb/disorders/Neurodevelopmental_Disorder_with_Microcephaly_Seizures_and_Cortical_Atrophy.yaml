- name: Progressive Postnatal Loss of Cerebral Volume
  biological_scale: TISSUE
  description: >-
    The feature that names the disorder, and the one whose status is genuinely
    contested. Longitudinal imaging in the Friedman cohort - the same child scanned in
    infancy and again years later - demonstrated progressive loss of cerebral cortical
    volume with collapse of subcortical white matter, which is the strongest evidence
    that this is a degenerative process superimposed on a developmental one rather than
    a static malformation. Thinning of the corpus callosum, reduced white-matter volume,
    delayed myelination and cerebellar atrophy accompany it in a subset. But it is not
    obligatory: the 2026 series states that progressive cortical atrophy, though
    considered a hallmark, was absent in several of their cases, and the two siblings
    reported by Okur and colleagues had biallelic VARS1 variants with no cortical
    atrophy at all.

- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    Seizures begin early - days to months of life in most reported children - and are
    characteristically drug-refractory, with myoclonic, focal and generalised types,
    infantile spasms with hypsarrhythmia in a subset, and multifocal epileptiform
    discharges on EEG. The proximate substrate is presumed to be the malformed and
    depleted cortical network of the preceding node rather than a direct effect of
    ValRS on neuronal excitability; no channel-level or synaptic mechanism has been
    proposed or tested for VARS1. The zebrafish knockout independently exhibits
    epileptiform activity, which is the only experimental support that the excitability
    phenotype follows from loss of the enzyme rather than from something incidental to
    the human genotypes.

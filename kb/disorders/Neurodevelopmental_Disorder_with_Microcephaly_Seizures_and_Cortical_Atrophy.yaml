    evidence_source: HUMAN_CLINICAL
    snippet: "Although our patients have no history of seizures or cortical atrophy, we suggest that the biallelic variants in VARS p.Ala22Asp and p.Phe1072Leu in this family are likely pathogenic and associated with NDMSCA, expanding the clinical phenotype of the condition."
    explanation: >-
      Marked PARTIAL because it is evidence about the boundary of the phenotype rather
      than for the phenotype: it documents biallelic VARS1 disease without seizures,
      which is why no frequency band is asserted here.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "especially frequent in AARS1‐, LARS1‐, NARS1‐, QARS1‐, SARS1‐, and VARS1‐deficiencies (67%–86%)"
    explanation: Cross-cohort quantitative statement on seizure frequency, quoted rather than banded because the range spans six genes.
- name: Epileptic Encephalopathy
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Not merely seizures, but seizures that themselves contribute to the developmental
    impairment - the distinction the term epileptic encephalopathy carries. Hypsarrhythmia
    on EEG, infantile spasms, and multifocal epileptiform discharges are all reported,
    and several children remained refractory to triple antiseizure therapy.

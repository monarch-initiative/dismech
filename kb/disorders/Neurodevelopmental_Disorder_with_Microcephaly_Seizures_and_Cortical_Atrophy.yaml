  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation in the first weeks to months of life with severe epilepsy despite aggressive anticonvulsant treatment, and association with hypsarrhythmia on electroencephalogram can be a clue."
    explanation: Describes the refractory, early-onset epilepsy with hypsarrhythmia that constitutes the encephalopathy.
- name: Cerebral Cortical Atrophy
  category: Neurologic
  description: >-
    Diffuse, symmetric cortical volume loss on MRI, documented as progressive on serial
    imaging in the Friedman cohort. Despite naming the disorder, it is neither universal
    nor required for the diagnosis: it was absent in several individuals of the 2026
    series and absent entirely in the two siblings reported by Okur and colleagues.
    Curated here as a frequent and characteristic finding, not a diagnostic criterion.
  phenotype_term:
    preferred_term: Cerebral cortical atrophy
    term:
      id: HP:0002120
      label: Cerebral cortical atrophy
  notes: >-
    No FrequencyEnum band asserted. The founding cohorts report it in most or all
    imaged individuals, whereas the 2026 series reports progressive cortical and
    cerebellar atrophy in five of thirteen (38%). Those two readings fall in different
    bands, and the discrepancy is itself substantive - see the discussion
    `ndmsca-atrophy-not-obligate` - so it is recorded rather than averaged away.

- name: Global Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: profound global developmental delay and intellectual
    disability, absent or severely limited speech, axial hypotonia with limb hypertonia
    and brisk reflexes, extrapyramidal movements, feeding difficulty often requiring
    tube feeding, and, in the more severely affected, death in early childhood from
    respiratory complications. The severity spectrum is wide and is not yet explained by
    genotype: at one end are infants who never acquire milestones and die before three
    years, at the other the two siblings of the 2026 series with preserved speech,
    independent ambulation and a non-progressive course.

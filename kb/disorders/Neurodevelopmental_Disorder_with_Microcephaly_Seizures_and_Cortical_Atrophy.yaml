genetic:
- name: VARS1
  association: >-
    Biallelic missense, splice-site, synonymous and nonsense variants cause autosomal
    recessive NDMSCA; no dominant or de novo monoallelic VARS1 disease has been reported.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: VARS1
    term:
      id: hgnc:12651
      label: VARS1
  notes: >-
    Nomenclature and identity. HGNC:12651 is symbol VARS1, "valyl-tRNA synthetase 1",
    Entrez 7407, Ensembl ENSG00000204394, UniProt P26640, EC 6.1.1.9, gene MIM 192150
    (OAK, `runoak -i sqlite:obo:hgnc info hgnc:12651 -O obo`, 2026-08-18). The
    cytogenetic location 6p21.33 is not in the HGNC record OAK returns and comes
    separately from NCBI Gene 7407 (E-utilities esummary, 2026-08-18).
    The former approved symbol was VARS, which is how the gene appears in every paper
    before 2019 including all three founding clinical reports, and the protein is
    universally called ValRS. Do not confuse with VARS2 (the mitochondrial enzyme), a
    different gene in a different compartment causing a different disease.

    Allelic series, as published. Karaca and colleagues first reported c.2653C>T
    (p.Leu885Phe) and c.3173G>A (p.Arg1058Gln) in two consanguineous families with
    epileptic encephalopathy, as part of a large exome study rather than a dedicated
    clinical report. Stephen and colleagues reported compound heterozygous c.3192G>A
    (p.Met1064Ile) with the splice-acceptor c.1577-2A>G in an Indian family. Friedman
    and colleagues reported five further biallelic missense genotypes in seven
    individuals from five families; Siekierska and colleagues reported an allelic series
    of seven novel plus two previously reported variants in ten patients. Okur and
    colleagues reported c.65C>A (p.Ala22Asp) with c.3214T>C (p.Phe1072Leu). Hiz and
    colleagues added p.Thr1068Met. The 2026 series added ten further novel variants,
    including the synonymous c.1893G>C (p.Leu631=) and the nonsense c.2370G>A
    (p.Trp790*).

    Recurrent alleles matter for reading the literature: p.Phe1072Leu, p.Arg404Trp,
    p.Arg1058Gln and p.Thr1068Met each appear in more than one report, which is why the
    cohorts cannot simply be summed into a case count. Note also that the same residue
    can carry different substitutions with different severity - Arg404 is reported as
    both Trp and Gln - so allele-level rather than residue-level reasoning is required.
  evidence:
  - reference: PMID:26539891
    reference_title: Genes that Affect Brain Structure and Function Identified by Rare Variant Analyses of Mendelian Neurologic Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the candidate genes identified, we found PRUNE, VARS, and DHX37 in multiple families and homozygous loss-of-function variants in AGBL2, SLC18A2, SMARCA1, UBQLN1, and CPLX1."
    explanation: >-
      The original identification of VARS1 as a candidate disease gene in multiple
      families with neurogenetic disease. Recurrence across families is the genetic
      argument that first implicated the gene.
  - reference: PMID:30755616
    reference_title: Biallelic VARS variants cause developmental encephalopathy with microcephaly that is recapitulated in vars knockout zebrafish.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an allelic series consisting of seven novel and two previously reported biallelic variants in valyl-tRNA synthetase (VARS) in ten patients with a developmental encephalopathy with microcephaly, often associated with early-onset epilepsy."
    explanation: Establishes the allelic series and the biallelic gene-disease relationship in an independent multi-family cohort.
  - reference: PMID:41672381
    reference_title: Novel VARS1 variants define new clinical and molecular subtypes of a rare neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together with prior reports, our results provide strong additional evidence supporting VARS1 as a recurrent cause of autosomal recessive neurodevelopmental disorders and expand the known clinical and allelic spectrum."
    explanation: The most recent independent confirmation of the gene-disease relationship, with an expanded allelic spectrum.
phenotypes:
- name: Microcephaly
  category: Neurologic
  diagnostic: true
  description: >-
    Microcephaly names the disorder and is its most consistent feature. It is usually
    acquired: head circumference is normal or only mildly reduced at birth in most
    reported children and falls away over the first year, reaching around minus 5
    standard deviations in the Friedman cohort. Congenital microcephaly at the severe
    end has also been reported, so both primary and secondary patterns occur. It is not
    strictly obligate - one child in the Friedman cohort had head circumference tracking
    normal percentiles at last examination.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  notes: >-
    No FrequencyEnum band is asserted, deliberately. The best available quantitative
    statement is the ARS1-deficiency scoping review, which reports microcephaly as very
    frequent at 77%-96% - but that range is quoted across five ARS1 deficiencies
    together (IARS1, NARS1, QARS1, VARS1, YARS1), so VARS1's own value is somewhere
    inside it and could fall on either side of the FREQUENT/VERY_FREQUENT boundary at
    80%. Per the repository frequency guidance, an ambiguous band is omitted rather than
    guessed. In the 2026 series specifically, seven of thirteen individuals had
    progressive microcephaly and an eighth had a disproportionately small head without
    progression.
  evidence:
  - reference: PMID:29691655
    reference_title: Loss of function mutations in VARS encoding cytoplasmic valyl-tRNA synthetase cause microcephaly, seizures, and progressive cerebral atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe two siblings presented with progressive microcephaly, brain atrophy and seizures."
    explanation: Reports microcephaly as a presenting feature in the family whose report gave the disorder its name.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in IARS1‐, NARS1‐, QARS1, VARS1‐, and YARS1‐deficiency, microcephaly is a very frequent symptom (77%–96%)"
    explanation: >-
      The only cross-cohort quantitative statement available for microcephaly in VARS1
      deficiency. Quoted rather than converted to a band because the percentage range
      spans several genes, not VARS1 alone.
- name: Progressive Microcephaly
  category: Neurologic
  description: >-
    The postnatal-deceleration pattern, curated separately from microcephaly itself
    because it is the feature that distinguishes this disorder from the primary
    microcephaly syndromes of centrosome and spindle biology. Head growth slows after
    the first months of life, tracking the loss of cerebral volume. The 2026 series
    reported it in seven of thirteen individuals and explicitly identified a
    non-progressive counterpart in one, so the progressive pattern is common but not
    universal.
  phenotype_term:
    preferred_term: Progressive microcephaly
    term:
      id: HP:0000253
      label: Progressive microcephaly
  evidence:
  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects present with a range of global developmental delay, epileptic encephalopathy and primary or progressive microcephaly."
    explanation: Names both the primary and the progressive pattern as occurring within the same disorder.
  - reference: PMID:30755602
    reference_title: Biallelic mutations in valyl-tRNA synthetase gene VARS are associated with a progressive neurodevelopmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another clue is acquired microcephaly, in the range of minus 5 SDs, observed in all but one subjects after 6 months of age."
    explanation: Quantifies the acquired, postnatal-onset character of the head-size deficit.
- name: Seizure
  category: Neurologic
  diagnostic: true
  description: >-
    Early-onset and characteristically drug-refractory. Reported onsets range from the
    second day of life to a few months; the 2026 series gives an average onset of three
    to six months. Semiologies reported include generalised myoclonic, focal and tonic
    seizures, and infantile spasms. Many children remain refractory on two- or
    three-drug regimens, though a minority are well controlled on monotherapy. Seizures
    are not obligate: the two siblings reported by Okur and colleagues had no history of
    seizures, and the two mildly affected siblings of the 2026 series had later-onset
    seizures than is typical.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  notes: >-
    No FrequencyEnum band is asserted. Eleven of thirteen individuals in the 2026 series
    had early-onset seizures (85%), which alone would read VERY_FREQUENT; but the two
    seizure-free siblings of the Okur report sit outside that cohort, and the ARS1
    scoping review's 67%-86% figure is quoted across six ARS1 deficiencies rather than
    for VARS1 alone. The two readings straddle the 80% boundary, so the band is omitted
    and the counts are recorded here instead.
  evidence:
  - reference: PMID:41672381
    reference_title: Novel VARS1 variants define new clinical and molecular subtypes of a rare neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all affected individuals who presented with a neurodevelopmental syndrome with progressive microcephaly, seizures, and intellectual disability, we identified biallelic disease-causing variants in VARS1."
    explanation: Names seizures as part of the presenting syndrome in the largest reported cohort.
  - reference: PMID:30275004
    reference_title: "Biallelic variants in VARS in a family with two siblings with intellectual disability and microcephaly: case report and review of the literature."

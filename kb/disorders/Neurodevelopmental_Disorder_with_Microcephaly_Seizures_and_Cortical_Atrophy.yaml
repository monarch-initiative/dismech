- name: White Matter Hypomyelination with Preserved Axons
  biological_scale: TISSUE
  description: >-
    The single autopsy reported in the VARS1 literature is mechanistically load-bearing
    and is curated as its own node rather than folded into cortical volume loss. In the
    child from family GB31, hemispheric white matter was intensely gliotic with minimal
    myelination but PRESERVED AXONAL DENSITY, with no cavitation or necrosis. Preserved
    axons with deficient myelin is the signature of a myelination disorder, not of
    axonal degeneration - which matters because it points the deficit at the
    oligodendrocyte, a cell with an exceptionally high protein-synthesis burden during
    myelination and therefore exactly the cell type the translational-threshold model
    predicts should fail first. Radiologically the same arm shows as hypomyelination or
    delayed myelination, reported in four of ten patients by Siekierska and colleagues,
    and as reduced white-matter volume with a thin corpus callosum.

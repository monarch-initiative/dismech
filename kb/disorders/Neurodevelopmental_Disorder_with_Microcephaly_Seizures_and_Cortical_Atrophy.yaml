- name: Abnormal Myelination
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Hypomyelination or delayed myelination on brain MRI, reported in four of ten
    patients by Siekierska and colleagues, and corroborated at autopsy by white matter
    with minimal myelination but preserved axonal density. Curated as a phenotype in its
    own right rather than left inside the cortical-atrophy finding, because the

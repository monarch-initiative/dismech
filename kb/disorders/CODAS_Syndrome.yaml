animal_models:
- name: Lonp1 heterozygous knockout mouse
  species: Mouse
  genotype: Lonp1 wt/- (heterozygous null)
  publication: PMID:32521756
  description: >-
    Lonp1 heterozygous-null mice have no gross growth or histological abnormalities. Enterocytes show
    enlarged, swollen mitochondria. Embryonic fibroblasts have reduced Lonp1, Tfam and mtDNA and lower
    basal oxygen consumption, but the tissue mtDNA measurements do not show a corresponding generalized
    depletion. Homozygous-null pups were not obtained.
  evidence:
  - reference: PMID:32521756
    reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The homozygous Lonp-/- mouse was not vital, while the heterozygous Lonp1wt/- showed
      similar growth rate, weight, length, life-span and histologic features as wild type.
    explanation: Establishes the viability and gross phenotype of the model.
  - reference: PMID:32521756
    reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The levels of mtDNA were similar in wt and het animals and changed considerably on the basis of
      the tissue taken into account, with the highest levels in heart and the lowest in the colon.
    explanation: >-
      Tissue mtDNA was preserved; mtDNA reduction was measured in cultured embryonic fibroblasts.
  modeled_mechanisms:
  - target: Abnormal Mitochondrial Ultrastructure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Enterocyte mitochondria are swollen and enlarged. In embryonic fibroblasts, the detailed quantitative
      results instead report slightly reduced mitochondrial size and perimeter; these cell types should
      not be conflated.
    limitations: >-
      The heterozygous-null genotype does not reproduce biallelic CODAS missense disease. Lonp1 protein
      is maintained near wild-type levels in many tissues, with reductions in adult colon and heart and
      in embryonic fibroblasts; deletion of one allele does not uniformly halve protein dosage.
    evidence:
    - reference: PMID:32521756
      reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Conversely, ultrastructural analysis of heterozygous enterocytes evidenced profound
        morphological alterations of mitochondria, which appeared increased in number, swollen
        and larger, with a lower complexity.
      explanation: Mitochondrial swelling in the model parallels the patient cell findings.
    - reference: PMID:32521756
      reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        Quantitative analysis indicated a slight reduction in mitochondrial size and perimeter, without
        significant changes in aspect ratio and form factor (Figure 5C).
      explanation: >-
        Detailed results for mouse embryonic fibroblasts qualify the abstract description of swollen,
        enlarged mitochondria.
  - target: Reduced Mitochondrial Respiratory Capacity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Heterozygous embryonic fibroblasts have lower basal oxygen consumption and fewer respiratory
      complexes.
    limitations: >-
      Measured in embryonic fibroblasts from a heterozygous null, not a CODAS missense allele;
      reduced mtDNA in the model contrasts with the absence of consistent mtDNA depletion
      in patient blood.
    evidence:
    - reference: PMID:32521756
      reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        From the functional point of view, mitochondria from heterozygous MEF showed a lower
        oxygen consumption rate in basal conditions, either in the presence of glucose or
        galactose, and a reduced expression of mitochondrial complexes than wild type.
      explanation: >-
        Reduced respiration in the model parallels reduced spare capacity in patient cells.

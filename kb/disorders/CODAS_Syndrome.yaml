- name: Spondyloepimetaphyseal Dysplasia
  description: >-
    A developmental skeletal dysplasia with hypoplastic, late-ossifying epiphyses, metaphyseal
    dysplasia most evident at the hips, and vertebral coronal clefts, followed by early scoliosis,
    genu valgum, pes valgus and short stature.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: DECREASED
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skeletal radiographs showed metaphyseal dysplasia (most evident at hip joints) and both
      hypoplasia and delayed ossification of epiphyses
    explanation: >-
      Radiographic description of the spondyloepimetaphyseal skeletal dysplasia in affected
      children.

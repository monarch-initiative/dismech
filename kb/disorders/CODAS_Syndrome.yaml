discussions:
- discussion_id: codas_developmental_specificity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a defect in a ubiquitous mitochondrial matrix protease produce lens, dental,
    middle-ear and skeletal malformations that are atypical of mitochondrial disease?
  attaches_to:
  - pathophysiology#Reduced Mitochondrial Respiratory Capacity
  - pathophysiology#Spondyloepimetaphyseal Dysplasia
  rationale: >-
    Patient-derived lymphoblastoid cells show selective MT-CO2 insolubility, altered PDK4 turnover and
    reduced respiratory reserve, but these cells are not the principally affected developmental tissues.
    The roles of Lon proteolysis, chaperone activity and other functions in lens, dental, skeletal and
    neural development remain unresolved. Structural variant clustering suggests phenotype associations
    without establishing a deterministic genotype-severity rule. Normal basal respiration and preserved
    blood mtDNA in the founder series also limit extrapolation from other LONP1 disorders.
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several CODAS manifestations, including postnatal cataracts, skeletal and dental abnormalities,
      and conductive hearing loss, are atypical of mitochondrial disease
    explanation: >-
      The discovery paper notes that the lens, skeletal, dental and middle-ear features are
      not typical mitochondrial disease features, so the steps between Lon dysfunction and
      these developmental anomalies remain unexplained.
  - reference: PMID:40931319
    reference_title: LONP1 Variants Are Associated With Clinically Diverse Phenotypes.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Structural mapping of disease-associated missense variants revealed phenotype-specific
      clustering, with CODAS variants enriched in the proteolytic chamber and NDD variants
      more broadly distributed.
    explanation: >-
      Variant position correlates with phenotype, suggesting allele-specific effects on Lon
      function.

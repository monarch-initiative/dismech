- name: Impaired PDK4 Turnover
  description: >-
    Recombinant R721G Lon poorly degrades PDK4. In a patient-derived R721G lymphoblastoid line, PDK4 abundance
    is higher and its persistence after protein synthesis inhibition is greater than in a wild-type comparison
    line. PDH binding protects PDK4 from proteolysis in reconstituted assays. These experiments establish
    altered substrate handling, without demonstrating PDH inhibition or altered metabolic flux in CODAS
    tissues.
  biological_scale: MOLECULAR
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix

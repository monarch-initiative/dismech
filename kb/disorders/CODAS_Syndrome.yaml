    recoverable with urea, supporting aggregation rather than simple loss of total protein. Lon knockdown
    in other cell lines increases MT-CO2 abundance. Impaired degradation or chaperone-mediated complex
    IV assembly are proposed explanations; direct cleavage of purified MT-CO2 was not measured.

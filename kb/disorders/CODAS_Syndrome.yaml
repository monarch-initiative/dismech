      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected children had hypotonia, developmental delay, and variable intellectual
      disability, some of which was remediable.
    explanation: >-
      In the largest molecularly confirmed series (ten individuals), every affected child
      had hypotonia, developmental delay and variable intellectual disability.
  - reference: PMID:1887855
    reference_title: >-
      Newly recognized syndrome of cerebral, ocular, dental, auricular, skeletal anomalies:
      CODAS syndrome--a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These consist of developmental delay; craniofacial abnormalities, including bilateral
      cataracts, ptosis, median nasal groove, malformed ears with associated neurosensory
      hearing loss
    explanation: Developmental delay was part of the index case.

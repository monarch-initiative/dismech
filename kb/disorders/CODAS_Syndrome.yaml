- name: Impaired Mitochondrial Protein Quality Control
  description: >-
    CODAS-associated Lon proteins show substrate-specific proteolytic defects. Recombinant p.Pro676Ser
    and p.Arg721Gly degrade StAR less effectively while retaining TFAM degradation. Patient-derived p.Arg721Gly
    lymphoblastoid cells have altered handling of MT-CO2 and PDK4; degradation and chaperone contributions
    need to be distinguished.
  biological_scale: CELLULAR

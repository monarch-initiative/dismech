name: CODAS Syndrome
creation_date: "2026-09-23T19:10:03Z"
category: Mendelian
description: >-
  CODAS syndrome (cerebral, ocular, dental, auricular and skeletal anomalies) is a rare autosomal
  recessive multisystem developmental disorder caused by biallelic LONP1 variants that impair
  the ATP-dependent mitochondrial matrix Lon protease. It presents in infancy with hypotonia,
  developmental delay and variable intellectual disability, rapidly developing bilateral nuclear
  cataracts, ptosis, a midline nasal groove, delayed tooth eruption with anomalous cusp morphology,
  hypoplastic crumpled helices with conductive or mixed hearing loss, and a spondyloepimetaphyseal
  dysplasia with short stature, delayed epiphyseal ossification, hip dysplasia, scoliosis
  and vertebral coronal clefts. Vocal cord paresis with airway obstruction causes substantial
  perinatal mortality. Other biallelic LONP1 genotypes cause infantile cataract with few extraocular
  findings or a classical mitochondrial encephalomyopathy without CODAS skeletal and dental
  features.
synonyms:
- cerebrooculodentoauriculoskeletal syndrome
- cerebro-oculo-dento-auriculo-skeletal syndrome
- cerebral, ocular, dental, auricular, and skeletal anomalies syndrome
disease_term:
  preferred_term: CODAS syndrome
  term:
    id: MONDO:0010879
    label: CODAS syndrome
notes: >-
  No GeneReviews chapter names this disease (just check-genereviews --online returned NO_CHAPTER
  for GeneReviews on 2026-09-23), so the phenotype baseline is the molecular discovery series
  (PMID:25574826, PMID:25808063) and the index case report (PMID:1887855). Orphanet:1458 and
  OMIM:600373 are the MONDO cross-references; no Orphanet structured record was cached.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CODAS syndrome requires biallelic (homozygous or compound heterozygous) LONP1 variants.
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome and Sanger sequencing, we identified four LONP1 mutations inherited
      as homozygous or compound-heterozygous combinations among ten individuals with CODAS
      syndrome.
    explanation: >-
      Homozygous and compound heterozygous LONP1 genotypes in all ten affected individuals
      establish recessive inheritance.
  - reference: PMID:25808063
    reference_title: Mutations in LONP1, a mitochondrial matrix protease, cause CODAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous or homozygous mutations in LONP1 were found in all (8 separate
      mutations; 6 missense, 1 nonsense, 1 small in-frame deletion) thus establishing the
      genetic basis of CODAS and the pattern of inheritance (autosomal recessive).
    explanation: >-
      Independent cohort confirms biallelic LONP1 variants and autosomal recessive inheritance.
pathophysiology:
- name: LONP1 Biallelic Loss of Function
  description: >-
    Biallelic LONP1 variants, mostly missense substitutions clustering at the ATP-binding
    AAA+ domain and the proteolytic domain, reduce the ATP-dependent peptidase activity of
    the homohexameric mitochondrial Lon protease. The Old Order Amish founder variant p.Arg721Gly
    also impairs homo-oligomerization.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LONP1
    term:
      id: hgnc:9479
      label: LONP1
  molecular_functions:
  - preferred_term: ATP-dependent peptidase activity
    term:
      id: GO:0004176
      label: ATP-dependent peptidase activity
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four pathogenic amino acid substitutions cluster within the AAA+ domain at residues
      near the ATP-binding pocket.
    explanation: Localizes the pathogenic substitutions to the ATP-binding module of Lon.
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Arg721Gly might thus destabilize the Lon complex and explain reduced homo-oligomerization,
      ATPase activity, and peptidase activity of this variant
    explanation: >-
      Biochemical assay of recombinant protein shows the founder variant disrupts hexamer
      assembly.
  - reference: PMID:34228963
    reference_title: >-
      A structure and function relationship study to identify the impact of the R721G mutation
      in the human mitochondrial lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Km values for the intrinsic as well as protein-stimulated ATPase were increased
      whereas the kcat value for ATP-dependent peptidase activity was decreased in the R721G
      mutant.
    explanation: >-
      Steady-state kinetics of the recombinant Amish founder enzyme show reduced ATP-dependent
      peptidase activity.
  - reference: PMID:25808063
    reference_title: Mutations in LONP1, a mitochondrial matrix protease, cause CODAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutations cluster at the ATP-binding and proteolytic domains of the enzyme.
    explanation: >-
      Second independent cohort places the variants in the ATP-binding and proteolytic domains.
  - reference: PMID:40931319
    reference_title: LONP1 Variants Are Associated With Clinically Diverse Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CODAS is caused by biallelic variants and CDH by monoallelic variants, both of which
      are predicted to act through loss-of-function mechanisms.
    explanation: >-
      Recent multi-cohort analysis classifies CODAS as a biallelic loss-of-function disorder.
  downstream:
  - target: Impaired Mitochondrial Protein Quality Control
    description: >-
      Reduced ATP-dependent proteolysis by mutant Lon leaves specific matrix substrates undegraded.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25574826
      reference_title: >-
        CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+
        Lon protease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In biochemical assays, pathogenic Lon proteins show substrate-specific defects in
        ATP-dependent proteolysis.
      explanation: Directly links the pathogenic variants to defective substrate proteolysis.
- name: Impaired Mitochondrial Protein Quality Control
  description: >-
    Mutant Lon fails to degrade a subset of its substrates. In patient lymphoblastoid cells
    the mtDNA-encoded cytochrome c oxidase subunit MT-CO2, identified as a natural Lon substrate,
    becomes insoluble and aggregates, while other respiratory-chain subunits are unaffected.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial protein quality control
    term:
      id: GO:0141164
      label: mitochondrial protein quality control
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In CODAS cells, we observed insolubility and aggregation of MT-CO2 (Figure 7A) but not
      MT-CO1, which is similarly hydrophobic.
    explanation: >-
      Patient-derived lymphoblastoid cells show selective aggregation of a respiratory-chain
      subunit.
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Taken together, these results suggest that MT-CO2 is a natural Lon substrate
    explanation: >-
      Knockdown experiments identify MT-CO2 as a Lon substrate, explaining its accumulation
      when Lon is defective.
  - reference: PMID:34228963
    reference_title: >-
      A structure and function relationship study to identify the impact of the R721G mutation
      in the human mitochondrial lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R721G did not degrade the endogenous mitochondrial Lon substrate pyruvate dehydrogenase
      kinase isoform 4 (PDK4) effectively like WT hLon.
    explanation: >-
      A second natural Lon substrate, PDK4, is poorly degraded by the founder variant enzyme.
  downstream:
  - target: Mitochondrial Structural and Respiratory Dysfunction
    description: >-
      Defective matrix proteostasis is followed by abnormal inner-membrane morphology and
      reduced respiratory reserve.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25574826
      reference_title: >-
        CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+
        Lon protease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        reduced spare respiratory capacity, leading to impaired mitochondrial proteostasis
        and function
      explanation: >-
        The discovery paper links the cellular findings to impaired mitochondrial proteostasis
        and function.
- name: Mitochondrial Structural and Respiratory Dysfunction
  description: >-
    Patient lymphoblastoid cells contain enlarged, swollen mitochondria with vesiculated cristae
    and electron-dense inclusions and have reduced spare respiratory capacity. Heterozygous
    Lonp1 knockout mice show swollen mitochondria, reduced mtDNA and lower oxygen consumption,
    while homozygous loss is embryonic lethal. mtDNA copy number was not consistently reduced
    in patient blood.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lymphoblastoid cell lines generated from affected children have (1) swollen mitochondria
      with electron-dense inclusions and abnormal inner-membrane morphology; (2) aggregated
      MT-CO2, the mtDNA-encoded subunit II of cytochrome c oxidase; and (3) reduced spare
      respiratory capacity
    explanation: Patient-derived cells show the ultrastructural and bioenergetic defects.
  - reference: PMID:32521756
    reference_title: Impaired Mitochondrial Morphology and Functionality in Lonp1(wt/-) Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, the presence of one functional copy of the Lonp1 gene leads to impairment
      of mitochondrial ultrastructure and functions in vivo.
    explanation: >-
      Mouse model with reduced Lonp1 dosage reproduces mitochondrial ultrastructural and functional
      impairment.
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Quantitative PCR showed no consistent difference of mtDNA copy number between probands
      and parents (Figure 5B).
    explanation: >-
      Qualifies the node: unlike Lon-null models and the non-CODAS mitochondrial presentation,
      CODAS patient blood did not show mtDNA depletion.
  downstream:
  - target: Spondyloepimetaphyseal Dysplasia
    description: >-
      Lon dysfunction disturbs skeletal development through steps that are not yet defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25574826
      reference_title: >-
        CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+
        Lon protease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        several CODAS manifestations, including postnatal cataracts, skeletal and dental abnormalities,
        and conductive hearing loss, are atypical of mitochondrial disease
      explanation: >-
        The discovery paper notes that the lens, skeletal, dental and middle-ear features
        are not typical mitochondrial disease features, so the steps between Lon dysfunction
        and these developmental anomalies remain unexplained.
  - target: Laryngeal and Vocal Cord Dysfunction
    description: >-
      Lon dysfunction is followed by paretic, atrophic vocal cords by an unknown mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

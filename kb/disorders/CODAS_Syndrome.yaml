name: CODAS Syndrome
creation_date: "2026-09-23T19:10:03Z"
category: Mendelian
description: >-
  CODAS syndrome (cerebral, ocular, dental, auricular and skeletal anomalies) is a rare autosomal recessive
  developmental disorder caused by biallelic LONP1 variants affecting the mitochondrial Lon protease.
  Classical findings include developmental delay, cataracts, ptosis, a midline nasal groove, delayed tooth
  eruption with anomalous cusps, malformed external ears, hearing impairment, and epiphyseal or metaphyseal
  dysplasia with variable spinal involvement. Expression varies: molecularly confirmed skeletal-ocular
  presentations can have normal development, intelligence, dentition and hearing. Cataracts often appear
  in infancy but have also been detected later in childhood. Severe neonatal laryngeal obstruction is
  particularly documented in the Amish p.Arg721Gly series. Other LONP1-associated neurological, mitochondrial
  and diaphragmatic phenotypes overlap but do not by themselves establish classical CODAS syndrome.
synonyms:
- cerebrooculodentoauriculoskeletal syndrome
- cerebro-oculo-dento-auriculo-skeletal syndrome
- cerebral, ocular, dental, auricular, and skeletal anomalies syndrome
disease_term:
  preferred_term: CODAS syndrome
  term:
    id: MONDO:0010879
    label: CODAS syndrome
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CODAS syndrome requires biallelic (homozygous or compound heterozygous) LONP1 variants.
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome and Sanger sequencing, we identified four LONP1 mutations inherited
      as homozygous or compound-heterozygous combinations among ten individuals with CODAS
      syndrome.
    explanation: >-
      Homozygous and compound heterozygous LONP1 genotypes in all ten affected individuals
      establish recessive inheritance.
  - reference: PMID:25808063
    reference_title: Mutations in LONP1, a mitochondrial matrix protease, cause CODAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous or homozygous mutations in LONP1 were found in all (8 separate
      mutations; 6 missense, 1 nonsense, 1 small in-frame deletion) thus establishing the
      genetic basis of CODAS and the pattern of inheritance (autosomal recessive).
    explanation: >-
      Independent cohort confirms biallelic LONP1 variants and autosomal recessive inheritance.
pathophysiology:
- name: LONP1 Protease Dysfunction
  description: >-
    Biallelic LONP1 variants impair selected functions of the mitochondrial Lon protease. The four initial
    CODAS missense proteins retain substrate-dependent residual activity, and the p.Arg721Gly founder
    variant has impaired oligomer assembly and ATP-dependent proteolysis. These findings do not imply
    complete loss of Lon protein or identical biochemical defects for every allele.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LONP1
    term:
      id: hgnc:9479
      label: LONP1
  molecular_functions:
  - preferred_term: ATP-dependent peptidase activity
    term:
      id: GO:0004176
      label: ATP-dependent peptidase activity
    modifier: DECREASED
  locations:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:25574826
    reference_title: >-
      CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon
      protease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four pathogenic amino acid substitutions cluster within the AAA+ domain at residues
      near the ATP-binding pocket.
    explanation: Localizes the pathogenic substitutions to the ATP-binding module of Lon.
  - reference: PMID:25574826
    reference_title: CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Co-immunoprecipitation of p.Arg721GlyV5 by p.Arg721GlyFLAG was barely detected, suggesting impaired
      homo-oligomeric assembly of p.Arg721Gly or disassembly of an unstable complex during the experimental
      procedure.
    explanation: >-
      Tagged proteins were coexpressed in HEK293T cells. The experiment supports impaired assembly or
      instability, rather than directly proving the proposed salt-bridge mechanism.
  - reference: PMID:34228963
    reference_title: >-
      A structure and function relationship study to identify the impact of the R721G mutation
      in the human mitochondrial lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Km values for the intrinsic as well as protein-stimulated ATPase were increased
      whereas the kcat value for ATP-dependent peptidase activity was decreased in the R721G
      mutant.
    explanation: >-
      Steady-state kinetics of the recombinant Amish founder enzyme show reduced ATP-dependent
      peptidase activity.
  - reference: PMID:25808063
    reference_title: Mutations in LONP1, a mitochondrial matrix protease, cause CODAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutations cluster at the ATP-binding and proteolytic domains of the enzyme.
    explanation: >-
      Second independent cohort places the variants in the ATP-binding and proteolytic domains.
  - reference: PMID:40931319
    reference_title: LONP1 Variants Are Associated With Clinically Diverse Phenotypes.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      CODAS and CDH variants are hypothesized to cause loss-of-function effects, while NDD variants may
      act through dominant-negative mechanisms.
    explanation: >-
      The cross-phenotype analysis proposes different mechanisms; it does not functionally establish a
      uniform null mechanism for CODAS.
  - reference: PMID:25574826
    reference_title: CODAS syndrome is associated with mutations of LONP1, encoding mitochondrial AAA+ Lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      These results suggest that in CODAS syndrome, Lon-mediated degradation of some but not all protein
      substrates is impaired.
    explanation: >-
      Recombinant p.Pro676Ser and p.Arg721Gly retain TFAM degradation despite impaired StAR degradation.
  - reference: PMID:34228963
    reference_title: A structure and function relationship study to identify the impact of the R721G mutation in the human mitochondrial lon protease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Conversely, a mixture of hexamers (Fig. 2E) and pentamers (Fig. 2F) were observed with R721G hLon,
      and fewer hexamers were present.
    explanation: >-
      Negative-stain electron microscopy of recombinant protein supports heterogeneous assembly of R721G;
      some functional hexamers remain.

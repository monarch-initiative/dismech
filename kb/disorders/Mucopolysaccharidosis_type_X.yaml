    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:38634625
    reference_title: "Further characterization of ARSK-related mucopolysaccharidosis type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, all patients showed metaphyseal striation of the long bones, a crucial diagnostic clue to identify ARSK-related MPS type 10."
    explanation: >-
      Identifies metaphyseal striation as the consistent radiographic marker of
      the chondro-osseous arm across an independent patient series.
  - reference: PMID:38634625
    reference_title: "Further characterization of ARSK-related mucopolysaccharidosis type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, vertebral involvement regressed during follow-up. On the other hand, hip dysplasia progressed in all patients."
    explanation: >-
      Supports the divergent natural history annotated here: regressing
      vertebral disease with progressive hip disease.
  - reference: PMID:38634625
    reference_title: "Further characterization of ARSK-related mucopolysaccharidosis type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While typical dysostosis multiplex findings were not observed, mild platyspondyly with anterior beaking of some vertebral bodies, irregular vertebral endplates, wide ribs, inferior tapering of the ilea with a poorly developed acetabulum, irregularity of the central part of the femoral head, delayed ossification of the carpals were noted."
    explanation: >-
      Enumerates the skeletal findings and states explicitly that classic
      dysostosis multiplex is absent, which is the discriminating feature of
      this node relative to the other mucopolysaccharidoses.
  downstream:
  - target: Hip dysplasia
    causal_link_type: DIRECT
    description: Progressive acetabular and femoral head dysplasia is the dominant skeletal burden.
  - target: Avascular necrosis of the capital femoral epiphysis
    causal_link_type: DIRECT
    description: >-
      Femoral head involvement presents as a Legg-Calve-Perthes-like
      osteonecrosis, usually bilateral.
  - target: Metaphyseal striations
    causal_link_type: DIRECT
    description: Vertical metaphyseal striation of the long bones is the consistent radiographic marker.
  - target: Platyspondyly
    causal_link_type: DIRECT
    description: Vertebral body flattening with anterior beaking and irregular endplates.
  - target: Arthralgia
    causal_link_type: DIRECT
    description: Hip, knee, and back pain is the usual presenting complaint.
  - target: Waddling gait
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Hip disease produces the waddling gait that typically brings the child to attention.
  - target: Delayed ossification of carpal bones
    causal_link_type: DIRECT
    description: Carpal bones are unossified or small for age.
  - target: Disproportionate short-trunk short stature
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Vertebral involvement produces short-trunk disproportion, but only in
      older patients; younger children are of normal stature and proportion.
- name: Cardiac valve storage involvement
  biological_scale: TISSUE
  description: >-
    A mild and late arm of the disease, found only on deliberate targeted
    assessment after the genetic diagnosis is made. Reported findings are an
    aortic or mitral murmur, valve thickening with regurgitation, mild aortic
    valve stenosis, and mild left ventricular hypertrophy suggesting early
    storage cardiomyopathy. Curated separately from the ocular arm below because
    the two have different evidence: the later series that found normal eye
    examinations throughout did not report absent cardiac involvement, so a
    single bundled node would leave it ambiguous which half its refuting
    evidence applied to.
  locations:
  - preferred_term: cardiac valve
    term:
      id: UBERON:0000946
      label: cardiac valve
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heart abnormalities in S1 and S2 included cardiac murmur (aortic or mitral), valve disease, thickened leaflets and regurgitation."
    explanation: >-
      Documents the valvular connective-tissue involvement that defines this node.
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild aortic valve stenosis and mild left ventricular hypertrophy were noted in cardiac ultrasound in S1 and S2."
    explanation: >-
      Documents the stenotic and ventricular findings of this node on
      echocardiography.
  downstream:
  - target: Abnormal mitral valve morphology
    causal_link_type: DIRECT
    description: Valve leaflet thickening with regurgitation.
  - target: Aortic valve stenosis
    causal_link_type: DIRECT
    description: Mild aortic valve stenosis on echocardiography.
- name: Ocular connective-tissue involvement
  biological_scale: TISSUE
  description: >-
    The most variable arm of the disease, and the one with directly conflicting
    evidence. The index family showed mild lens and vitreous opacity, with loss
    of the retinal interdigitation zone temporal to the macula on optical
    coherence tomography in one patient. Two independent later series reported
    normal eye examinations throughout. This arm is therefore genuinely
    inconsistent between kindreds rather than merely under-ascertained, which is
    why it is recorded with both supporting and refuting evidence rather than
    being asserted or dropped. It remains the basis for offering
    ophthalmological surveillance once MPS X is diagnosed.
  locations:
  - preferred_term: eye
    term:
      id: UBERON:0000970
      label: eye
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "reverse phenotyping revealed mild opacity of the lens and vitreous body"
    explanation: Documents the ocular finding in the index family.
  - reference: PMID:38634625
    reference_title: "Further characterization of ARSK-related mucopolysaccharidosis type 10."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed normal intelligence, normal hearing and eye examinations, and none had organomegaly."
    explanation: >-
      Cuts directly against this node: an independent series found normal eye
      examinations in every patient. Now that the ocular arm is its own node,
      this REFUTE is unambiguous about what it refutes.
  downstream:
  - target: Abnormal lens morphology
    causal_link_type: DIRECT
    description: Mild lens and vitreous opacity found on slit-lamp examination.

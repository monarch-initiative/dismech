  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucuronate-2-O-sulfation occurs in HS, DS and CS and, during degradation, is selectively removed by ARSK"
    explanation: >-
      Establishes which GAG species carry the ARSK-dependent modification, and
      hence which are stalled when the enzyme is lost.
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild elevation of dermatan sulfate was detected in the two subjects investigated by LC-MS/MS."
    explanation: >-
      Dermatan sulfate is the GAG species measurably elevated in patients,
      supporting the restricted, dermatan-biased character of the storage.
  - reference: PMID:40742107
    reference_title: "ARSK-Related Mucopolysaccharidosis Type 10."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analyses reveal variable dermatan sulfate (DS) excretion in urine, with some patients showing increased DS, while others had normal urinary glycosaminoglycans (GAGs), suggesting that a normal GAG profile does not exclude this condition."
    explanation: >-
      Identifies dermatan sulfate as the affected species. Marked INDIRECT
      because the quote reports urinary excretion, from which lysosomal storage
      follows only by inference, and because it simultaneously establishes that
      the signal is inconsistent and can be undetectable by routine assays - the
      qualification this node depends on.
  downstream:
  - target: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Storage in cartilage and bone-forming tissue disturbs epiphyseal and
      metaphyseal development, producing the skeletal disease that dominates
      MPS X. The intermediate steps between fragment accumulation and disturbed
      endochondral ossification have not been worked out in this disorder, so
      the link is annotated as indirect.
    evidence:
    - reference: PMID:34916232
      reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The main radiological abnormalities in all four subjects were thickened calvaria, platyspondyly, anterior inferior beaking of the thoracolumbar vertebrae, broadening of clavicles and ribs, narrowing of lower parts of iliac bones, small epiphyses, metaphysial striae, and hypoplastic carpal bones"
      explanation: >-
        Documents the chondro-osseous consequence of ARSK deficiency as a
        consistent epiphyseal, metaphyseal, and vertebral dysplasia.
  - target: Cardiac valve storage involvement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dermatan-sulfate-biased storage in valvular connective tissue produces the
      mild, late cardiac findings of MPS X.
    evidence:
    - reference: PMID:34916232
      reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reverse phenotyping in two of the four individuals revealed additional cardiac and ophthalmological abnormalities."
      explanation: >-
        Establishes that cardiac and ocular involvement occurs, and that it is
        subclinical enough to require deliberate targeted assessment.
  - target: Ocular connective-tissue involvement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dermatan-sulfate-biased storage in ocular connective tissue produces the
      lens and vitreous opacity reported in the index family.
    evidence:
    - reference: PMID:34916232
      reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Reverse phenotyping in two of the four individuals revealed additional cardiac and ophthalmological abnormalities."
      explanation: >-
        Establishes that ophthalmological involvement occurs and is subclinical
        enough to require deliberate targeted assessment.
- name: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
  biological_scale: TISSUE
  description: >-
    The dominant and near-universal disease arm of MPS X. Cartilage and
    bone-forming tissue develop an epiphyseal, metaphyseal, and vertebral
    dysplasia that presents clinically as hip and knee pain with a waddling gait
    in mid-childhood, and radiographically as metaphyseal striation of the long
    bones, platyspondyly with anterior vertebral beaking, delayed carpal
    ossification, small epiphyses, and inferior tapering of the ilia with a
    poorly formed acetabulum. Two features of its natural history distinguish it
    from the other mucopolysaccharidoses: the vertebral changes regress with
    time rather than progressing, while the hip dysplasia progresses in every
    reported patient, so the hip rather than the spine is the long-term burden.
    The picture is close enough to spondyloepiphyseal dysplasia, multiple
    epiphyseal dysplasia, and bilateral Legg-Calve-Perthes disease that every
    published patient carried one of those labels before sequencing.
  locations:
  - preferred_term: hip joint
    term:
      id: UBERON:0001486
      label: hip joint
  - preferred_term: epiphysis
    term:
      id: UBERON:0001437
      label: epiphysis

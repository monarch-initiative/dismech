biochemical:
- name: Urinary dermatan sulfate
  presence: Elevated
  context: >-
    The biochemical hallmark of MPS X, and the one that most distinguishes it
    from the other mucopolysaccharidoses in practice: it is small enough to be
    missed. Sensitive LC-MS/MS disaccharide quantification shows a threefold to
    fourfold elevation of dermatan-sulfate-derived disaccharides, with heparan
    and keratan sulfate generally normal. Routine dimethylmethylene blue
    total-GAG screening, by contrast, is normal or only borderline in most
    patients, and thin-layer chromatography shows a normal GAG profile. A normal
    urinary GAG screen therefore does not exclude MPS X - the practical
    consequence is that this diagnosis is reached by sequencing, not by
    biochemistry, and the biochemistry serves to confirm it afterwards.
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild elevation of dermatan sulfate was detected in the two subjects investigated by LC-MS/MS."
    explanation: Establishes the dermatan sulfate elevation detectable by LC-MS/MS.
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed a threefold and fourfold elevation of specific DS-derived disaccharides in a morning urine sample, respectively"
    explanation: Quantifies the magnitude of the dermatan sulfate elevation on LC-MS/MS.
  - reference: PMID:40742107
    reference_title: "ARSK-Related Mucopolysaccharidosis Type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analyses reveal variable dermatan sulfate (DS) excretion in urine, with some patients showing increased DS, while others had normal urinary glycosaminoglycans (GAGs), suggesting that a normal GAG profile does not exclude this condition."
    explanation: >-
      Supports both the dermatan sulfate signal and, critically, that its
      absence does not exclude the diagnosis.
  - reference: PMID:38292179
    reference_title: "A novel homozygous missense variant in ARSK causes MPS X, a new subtype of mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the urine GAG levels measured by a standard dimethyl methylene blue test in our patient at the initial evaluation were within normal ranges"
    explanation: >-
      A worked instance of the false-negative routine screen in a
      molecularly confirmed patient.
- name: Lysosomal enzyme activities for the established MPS subtypes
  presence: Normal
  context: >-
    Normal, by design of the diagnostic workup. Because the skeletal picture
    suggests MPS IVA or IVB, patients are routinely assayed for
    galactosamine-6-sulfatase and beta-galactosidase, and in the index family a
    full panel of GAG-degrading lysosomal hydrolases was measured in
    fibroblasts. All were normal. There is no clinically available ARSK enzyme
    assay; the published functional assays use a synthetic 2-sulfoglucuronate
    disaccharide substrate in a research setting.
  evidence:
  - reference: PMID:35959767
    reference_title: "Phenotypic expansion of ARSK-related mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morquio disease, MPS type IVA, was suspected, but both children had normal serum levels of galactose‐6‐sulfatase and beta‐galactosidase."
    explanation: >-
      Documents the normal MPS IV enzyme assays that leave the diagnosis to
      sequencing.
genetic:
- name: ARSK pathogenic variants
  gene_term:
    preferred_term: ARSK
    term:
      id: hgnc:25239
      label: ARSK
  association: Causative
  inheritance:
  - name: Autosomal recessive
    description: >-
      Biallelic ARSK variants, homozygous in every family reported to date.
    evidence:
    - reference: PMID:34916232
      reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we report four affected individuals of two unrelated consanguineous families with homozygous variants c.250C>T, p.(Arg84Cys) and c.560T>A, p.(Leu187Ter) in ARSK, respectively."
      explanation: Homozygous variants in affected members of consanguineous families.
  features: >-
    ARSK (hgnc:25239, chromosome 5q15) encodes arylsulfatase K. The variants
    reported to date span both nonsense and missense classes and all converge on
    loss of catalytic activity: c.250C>T p.(Arg84Cys) and c.560T>A p.(Leu187Ter)
    in the two founding families, c.1251C>G p.(Tyr417Ter) in a Norwegian family,
    and c.1067C>A p.(Ser356Tyr) in a patient of Syrian ancestry. The alleles are
    rare or absent in gnomAD, and no homozygous loss-of-function individuals are
    represented there. Reference transcript NM_198150.

      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Glycosaminoglycan
      degradation" under category "Disorders of complex molecule degradation".
      MPS X postdates the 2021 ICIMD publication, so it is assigned here by
      mechanism rather than by explicit listing - ARSK is a
      glycosaminoglycan-degrading lysosomal sulfatase in exactly the sense that
      places IDS, SGSH, GNS, GALNS, and ARSB in this group.

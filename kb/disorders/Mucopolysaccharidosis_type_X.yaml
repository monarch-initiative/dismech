name: Mucopolysaccharidosis type X
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Mucopolysaccharidosis type X (MPS X, MPS 10) is an autosomal recessive
  lysosomal storage disorder caused by biallelic loss-of-function variants in
  ARSK, which encodes the lysosomal sulfatase arylsulfatase K (also called
  glucuronate 2-sulfatase, GDS). ARSK removes the 2-O-sulfate group from
  2-sulfoglucuronate, an obligate step in the stepwise exolytic degradation of
  heparan sulfate, dermatan sulfate, and chondroitin sulfate. It is the most
  recently defined mucopolysaccharidosis: the human phenotype was first
  delineated in 2022, more than twenty years after the previous new MPS subtype.
  MPS X is the mildest and most narrowly skeletal of the mucopolysaccharidoses.
  Affected individuals present in mid-childhood with hip and knee pain, a
  waddling gait, and progressive hip dysplasia, and are typically first
  diagnosed with bilateral Legg-Calve-Perthes disease, spondyloepiphyseal
  dysplasia, or multiple epiphyseal dysplasia rather than with a storage
  disorder. Metaphyseal striation of the long bones is the most consistent
  radiographic clue. Coarse facial features, short stature, and mild cardiac
  and ophthalmological involvement are variable and emerge late; classical
  dysostosis multiplex, hepatosplenomegaly, hearing loss, and cognitive
  impairment are characteristically absent. The biochemical signal is
  correspondingly weak - routine dimethylmethylene blue urinary
  glycosaminoglycan screening is frequently normal, and only sensitive
  LC-MS/MS disaccharide quantification reveals the modest dermatan sulfate
  elevation. MPS X is therefore a mucopolysaccharidosis that the standard MPS
  diagnostic pathway systematically misses, and it is likely underdiagnosed
  among children carrying a skeletal-dysplasia label. No disease-modifying
  therapy exists; management is orthopaedic, analgesic, and surveillance-based.

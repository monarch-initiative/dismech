diagnosis:
- name: Exome or genome sequencing in undiagnosed skeletal dysplasia
  description: >-
    The route by which every published MPS X patient was diagnosed. Children are
    referred with a skeletal-dysplasia phenotype, targeted skeletal gene panels
    and known-MPS-gene analysis are negative, and exome sequencing identifies
    biallelic ARSK variants. In the index family, homozygosity mapping in a
    consanguineous pedigree narrowed the search; in the Norwegian family the
    diagnosis was reached only after re-interpreting the exome data under a
    corrected assumption about which parent was affected.
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted variant analysis of known MPS-associated genes in the exome data set of S1 did not reveal pathogenic or likely pathogenic variants in GALNS, GLB1, GNS, GUSB, HYAL1, IDUA, ARSB, HGSNAT, NAGLU, SGSH and IDS."
    explanation: >-
      Shows that the established MPS gene set is negative, which is why MPS X
      requires unbiased sequencing to reach.
- name: LC-MS/MS urinary glycosaminoglycan disaccharide quantification
  description: >-
    The confirmatory biochemical test, and the only one that reliably detects
    the MPS X signal. Enzymatic digestion followed by LC-MS/MS quantification of
    heparan, dermatan, and keratan sulfate disaccharides shows the dermatan
    sulfate elevation that dimethylmethylene blue screening misses. It should be
    used specifically when MPS is suspected on skeletal grounds and routine
    screening is normal.
  evidence:
  - reference: PMID:40742107
    reference_title: "ARSK-Related Mucopolysaccharidosis Type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analyses reveal variable dermatan sulfate (DS) excretion in urine, with some patients showing increased DS, while others had normal urinary glycosaminoglycans (GAGs), suggesting that a normal GAG profile does not exclude this condition."
    explanation: >-
      Establishes both the value of sensitive disaccharide quantification and
      the limits of routine total-GAG screening.
treatments:
- name: Supportive orthopaedic and analgesic care
  description: >-
    No disease-modifying therapy exists for MPS X. There is no approved or
    investigational enzyme replacement therapy, no substrate reduction therapy,
    and no reported use of hematopoietic stem cell transplantation. Management
    is orthopaedic care for progressive hip dysplasia and femoral head
    osteonecrosis, analgesia for joint pain, and physiotherapy. Because the
    disease is chondro-osseous and the reported burden is pain and disability
    rather than organ failure, the authors of the fourth-patient report
    explicitly identify enzyme replacement therapy development as the unmet need.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38292179
    reference_title: "A novel homozygous missense variant in ARSK causes MPS X, a new subtype of mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It will be very important to develop enzyme replacement therapy and potentially other treatments, given the pain and disability associated with this disorder."
    explanation: >-
      States that no disease-modifying therapy is available and identifies
      enzyme replacement therapy as the unmet need.
- name: Cardiac, ophthalmological and audiological surveillance
  description: >-
    Once ARSK-related MPS is molecularly confirmed, targeted surveillance is
    warranted even in an asymptomatic child, because the cardiac and ocular
    involvement documented in the index family was found only on deliberate
    reverse phenotyping and was clinically silent. Surveillance also
    substantiates genetic counselling for the family.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35959767
    reference_title: "Phenotypic expansion of ARSK-related mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MPS type X allows for tailored cardiac, ophthalmologic and audiological surveillance, and can inform genetic counseling."
    explanation: >-
      States the clinical utility of the diagnosis, which is surveillance and
      counselling rather than treatment.
differential_diagnoses:
- name: Morquio syndrome
  description: >-
    MPS IVA and IVB are the differential that has been actively pursued in
    essentially every reported MPS X patient, because the short-trunk skeletal
    phenotype, platyspondyly, joint hypermobility, and enamel defects all
    overlap. Normal galactosamine-6-sulfatase and beta-galactosidase activity
    excludes MPS IV and leaves MPS X reachable only by sequencing.
  distinguishing_features:
  - Normal GALNS and GLB1 enzyme activity excludes Morquio syndrome.
  - Metaphyseal striation of the long bones favors MPS X.
  - Progressive femoral head osteonecrosis with a Legg-Calve-Perthes appearance favors MPS X.
  - Corneal clouding and marked keratan sulfate excretion favor Morquio syndrome.
  disease_term:
    preferred_term: Morquio syndrome
    term:
      id: MONDO:0018938
      label: mucopolysaccharidosis type 4
  evidence:
  - reference: PMID:35959767
    reference_title: "Phenotypic expansion of ARSK-related mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morquio disease, MPS type IVA, was suspected, but both children had normal serum levels of galactose‐6‐sulfatase and beta‐galactosidase."
    explanation: >-
      A worked instance of MPS IV being suspected and excluded enzymatically
      before MPS X was found.
- name: Legg-Calve-Perthes disease
  description: >-
    Bilateral Legg-Calve-Perthes disease is the single most common
    misclassification of MPS X. Idiopathic Legg-Calve-Perthes disease is
    usually unilateral; bilateral disease, particularly with metaphyseal
    striation, vertebral changes, or delayed carpal ossification, should prompt
    consideration of a mucopolysaccharidosis including MPS X.
  distinguishing_features:
  - Bilaterality favors a storage or dysplasia diagnosis over idiopathic Legg-Calve-Perthes disease.
  - Metaphyseal striation, platyspondyly, and delayed carpal ossification are extrinsic to Legg-Calve-Perthes disease.
  evidence:
  - reference: PMID:35959767
    reference_title: "Phenotypic expansion of ARSK-related mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral LCPD should result in considering the possibility of MPS type X as well as other MPS subtypes"
    explanation: Directly states the discriminating rule annotated here.
- name: Spondyloepiphyseal dysplasia
  description: >-
    The radiographic label most often applied to MPS X before molecular
    diagnosis, on the basis of platyspondyly with small epiphyses. Multiple
    epiphyseal dysplasia and Meyer dysplasia have also been proposed in reported
    patients. None of these is excluded radiographically; the discriminator is
    the finding of biallelic ARSK variants.
  distinguishing_features:
  - Metaphyseal striation of the long bones is atypical for spondyloepiphyseal dysplasia and favors MPS X.
  - Elevated urinary dermatan sulfate on LC-MS/MS favors MPS X.
  - Biallelic ARSK variants are definitive.
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both families, parents were consanguineous and had two affected children with skeletal dysplasia, resembling spondyloepiphysial dysplasia."
    explanation: >-
      Documents that the presenting radiographic impression in both founding
      families was spondyloepiphyseal dysplasia.
animal_models:
- name: Arsk knockout mouse
  species: Mouse
  genotype: Constitutive Arsk knockout
  publication: PMID:32856704
  description: >-
    The constitutive Arsk-knockout mouse established the biochemical consequence
    of ARSK loss two years before any human patient was described, and it is the
    reason ARSK was already a candidate MPS gene when the first families were
    sequenced. It reproduces the biochemistry faithfully and the disease poorly.
  modeled_mechanisms:
  - target: Lysosomal accumulation of 2-O-sulfoglucuronate-capped GAG fragments
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Complete loss of glucuronate desulfation with organ-specific accumulation
      of heparan and chondroitin sulfate metabolites bearing 2-O-sulfated
      glucuronate at their non-reducing ends, which is precisely the predicted
      biochemical lesion.
    readouts:
    - name: Non-reducing-end 2-O-sulfated glucuronate GAG metabolites in tissue
      target: Lysosomal accumulation of 2-O-sulfoglucuronate-capped GAG fragments
      direction: INCREASED
      interpretation: >-
        Direct biochemical readout of the blocked degradation step in the
        storage node.
      evidence:
      - reference: PMID:32856704
        reference_title: "Arylsulfatase K inactivation causes mucopolysaccharidosis due to deficient glucuronate desulfation of heparan and chondroitin sulfate."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Arsk-deficient mice show, in an organ-specific manner, a moderate accumulation of HS and CS metabolites characterized by 2-O-sulfated glucuronate moieties at their non-reducing ends."
        explanation: Reports the measured accumulation of the expected metabolites.
    evidence:
    - reference: PMID:32856704
      reference_title: "Arylsulfatase K inactivation causes mucopolysaccharidosis due to deficient glucuronate desulfation of heparan and chondroitin sulfate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Recently, we identified and characterized the lysosomal enzyme arylsulfatase K (Arsk) exhibiting glucuronate-2-sulfatase activity as needed for the degradation of heparan sulfate (HS), chondroitin sulfate (CS) and dermatan sulfate (DS)."
      explanation: >-
        Establishes that the mouse model targets the same enzymatic step that is
        lost in human MPS X, making it informative for the storage node.
  - target: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse does not develop the skeletal disease that defines human MPS X.
      This is a substantive negative result rather than a gap: it means the
      mouse cannot serve as a preclinical efficacy model for the outcome that
      matters clinically, and any enzyme replacement therapy programme would need
      a different readout or a different species.
    limitations: >-
      No bone abnormalities or prominent lysosomal storage pathology develop,
      despite complete loss of glucuronate desulfation and measurable metabolite
      accumulation. The mouse phenotype is limited to behavioural changes, which
      is close to the inverse of the human picture, where skeletal disease is
      universal and cognition is normal. The species divergence most likely
      reflects differences in glucuronate-2-O-sulfation abundance or in the
      growth-plate load carried by the affected chains; it has not been resolved
      experimentally.
    evidence:
    - reference: PMID:32856704
      reference_title: "Arylsulfatase K inactivation causes mucopolysaccharidosis due to deficient glucuronate desulfation of heparan and chondroitin sulfate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pathophysiological studies reflect a rather mild phenotype including behavioral changes. Interestingly, no prominent lysosomal storage pathology like bone abnormalities were detected."
      explanation: >-
        States explicitly that bone abnormalities are absent in the knockout,
        which is the failure to recapitulate annotated here.
discussions:
- discussion_id: mpsx_mouse_skeletal_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
  prompt: >-
    Why does the Arsk-knockout mouse accumulate the predicted GAG metabolites
    yet develop no skeletal disease, when skeletal disease is essentially the
    entire human phenotype?
  rationale: >-
    The mismatch is not a failure of the model to reproduce a subtle feature; it
    is close to an inversion. The mouse has the biochemistry without the
    skeletal pathology and a behavioural phenotype instead, while humans have
    the skeletal pathology with normal cognition. Because the storage burden in
    MPS X is small in both species, the human skeletal phenotype is unlikely to
    be a simple dose effect of accumulated substrate. A more plausible reading
    is that glucuronate-2-O-sulfation is differentially abundant on the specific
    chondroitin and dermatan sulfate chains that carry load in the human growth
    plate and epiphysis, so the same enzymatic block has a tissue-specific
    consequence in humans that it does not have in mice. Resolving this matters
    practically: the mouse is the only available model, and it lacks the outcome
    an enzyme replacement therapy would need to move.
  proposed_experiments:
  - experiment_id: exp_mpsx_species_sulfation_comparison
    name: Compare glucuronate-2-O-sulfation abundance in human and murine growth-plate GAGs
    description: >-
      Quantify the fraction of chondroitin, dermatan, and heparan sulfate chains
      bearing 2-O-sulfated glucuronate in human versus murine epiphyseal and
      growth-plate cartilage by LC-MS/MS disaccharide analysis, to test whether
      differential substrate abundance in the relevant tissue explains the
      species divergence.
    would_support:
    - pathophysiology#Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
    supporting_outcome:
    - >-
      Human growth-plate and epiphyseal cartilage carries a substantially higher
      fraction of 2-O-sulfated glucuronate than the murine equivalent, matching
      the tissue distribution of human disease.
    refuting_outcome:
    - >-
      The modification is present at comparable abundance in both species'
      cartilage, indicating that the species difference lies downstream of
      substrate abundance, in how chondrocytes tolerate the stalled fragments
      rather than in how many are produced.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients from six families had been reported as of the 2025 review, with
    a median age at presentation of 9.5 years. The true frequency is unknown and
    probably understated: the phenotype is mild, routine urinary GAG screening
    is often normal, and the skeletal picture is readily absorbed into a
    spondyloepiphyseal-dysplasia or Legg-Calve-Perthes label. gnomAD carries
    roughly 386 unique ARSK missense, in-frame, and truncating variants, over
    95 percent of them below an allele frequency of 1 in 10,000, which is
    consistent with a low but non-zero incidence.
  evidence:
  - reference: PMID:40742107
    reference_title: "ARSK-Related Mucopolysaccharidosis Type 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 10 ARSK-related MPS10 patients from six families have been reported, with a median age at presentation of 9.5 years."
    explanation: Supports the reported case count and typical age at presentation.

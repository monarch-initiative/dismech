notes: >-
  Three things make MPS X unusual among the mucopolysaccharidoses and are worth
  keeping in view when reading this entry.

  First, the phenotype is defined largely by its absences. The systemic storage
  burden that dominates MPS I, II, VI, and VII - organomegaly,
  neurodegeneration, corneal clouding, hearing loss, classic dysostosis
  multiplex - is not present. What remains is a chondro-osseous disease of the
  hip and spine. This entry deliberately annotates that restriction rather than
  padding the phenotype list with generic MPS features that the primary reports
  explicitly did not observe.

  Second, MPS X is the counterexample to "MPS is excluded by a normal urine
  GAG". Routine dimethylmethylene blue screening was normal or borderline in
  most reported patients, and in one the standard assay was normal while
  LC-MS/MS on the same patient showed a marked dermatan sulfate elevation. The
  diagnosis in every published case was reached by exome sequencing in a child
  being worked up for skeletal dysplasia, with the biochemistry confirmed
  afterwards.

  Third, the substrate logic is unlike the other MPS types. ARSK acts on
  glucuronate-2-O-sulfate, a rare modification of heparan, dermatan, and
  chondroitin sulfate rather than a backbone-defining one. Blocking its removal
  therefore stalls only the minority of GAG chains that carry the modification,
  which is the most parsimonious explanation for both the mild storage burden
  and the fact that the Arsk-knockout mouse shows measurable HS/CS metabolite
  accumulation with no skeletal pathology at all. The mouse work proposed the
  designation "MPS type IIB" for this entity; the human reports established
  "MPS X", which is the name MONDO, OMIM, and Orphanet carry and which this
  entry uses.

  Nomenclature caution for curators and readers: ARSK (arylsulfatase K, MPS X)
  and ARSG (arylsulfatase G) are adjacent in name and in biology - both are
  lysosomal sulfatases acting on heparan sulfate - but are different diseases.
  ARSG deficiency is MPS IIIE in mouse and Usher syndrome type 4 in humans; see
  the Usher Syndrome Type 4 entry.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    MPS X is autosomal recessive. Every reported family has had homozygous
    ARSK variants with heterozygous, unaffected parents; the two founding
    families were consanguineous, and homozygosity mapping contributed to gene
    identification in both.
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report four affected individuals of two unrelated consanguineous families with homozygous variants c.250C>T, p.(Arg84Cys) and c.560T>A, p.(Leu187Ter) in ARSK, respectively."
    explanation: >-
      Homozygous ARSK variants in affected children of two consanguineous
      families establish autosomal recessive inheritance.
  - reference: PMID:35959767
    reference_title: "Phenotypic expansion of ARSK-related mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children were homozygous, and both parents heterozygous, for a predicted stop variant in ARSK"
    explanation: >-
      Affected homozygous siblings with unaffected heterozygous parents is the
      direct segregation demonstration of autosomal recessive inheritance.
pathophysiology:
- name: ARSK glucuronate 2-sulfatase deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in ARSK abolish or severely reduce the
    activity of arylsulfatase K, the lysosomal sulfatase that removes the
    2-O-sulfate group from 2-sulfoglucuronate. Reported variants act through two
    distinct routes to the same end point. Nonsense alleles (p.Leu187Ter,
    p.Tyr417Ter) yield no detectable protein, consistent with nonsense-mediated
    decay. Missense alleles are catalytically dead while remaining stably
    expressed: p.Arg84Cys disrupts the conserved sulfatase signature 80-CCPSR-84
    that is required to convert the active-site cysteine to formylglycine, and
    p.Ser356Tyr abolishes activity within the sulfatase domain without
    destabilizing the protein. Because sulfatases show high substrate
    specificity and no functional redundancy, no other human sulfatase
    compensates for the lost step.

    Term-binding note: the molecular function below is bound to GO:0008484
    (sulfuric ester hydrolase activity), a broad parent, deliberately. GO has no
    term for glucuronate 2-O-sulfatase (glucuronate 2-sulfatase, GDS) activity,
    and no sibling sulfatase term fits - ARSK is specific for the 2-O-sulfate of
    2-sulfoglucuronate and does not share substrates with the other lysosomal
    sulfatases. Binding a narrower but wrong term would misstate the enzymology,
    so the accurate parent is preferred over a manufactured match. A GO term
    request for the specific activity is the way to improve this.
  genes:
  - preferred_term: ARSK
    term:
      id: hgnc:25239
      label: ARSK
  molecular_functions:
  - preferred_term: glucuronate 2-O-sulfatase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008484
      label: sulfuric ester hydrolase activity
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arylsulfatase K (ARSK) is a recently characterised lysosomal hydrolase involved in GAG degradation that removes the 2-O-sulfate group from 2-sulfoglucuronate."
    explanation: >-
      Defines the enzymatic step that is lost in MPS X: lysosomal removal of the
      2-O-sulfate from 2-sulfoglucuronate during glycosaminoglycan degradation.
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human HT1080 cells expressing the ARSK-Leu187Ter construct exhibited absent protein levels by western blot, and cells with the ARSK-Arg84Cys construct showed markedly reduced enzyme activity in an ARSK-specific enzymatic assay against 2-O-sulfoglucuronate-containing disaccharides as analysed by C18-reversed-phase chromatography followed by MS."
    explanation: >-
      Functional proof that the two founding variants cause loss of ARSK
      activity, by absent protein and by loss of catalytic activity respectively.
  - reference: PMID:34916232
    reference_title: "Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The arginine at amino acid position 84 in ARSK is part of the highly conserved sulfatase signature 80-CCPSR-84"
    explanation: >-
      Locates the p.Arg84Cys missense lesion in the sulfatase signature motif,
      explaining why a stably expressed protein is catalytically inactive.
  - reference: PMID:38292179
    reference_title: "A novel homozygous missense variant in ARSK causes MPS X, a new subtype of mucopolysaccharidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ARSK-S356Y completely abolished the ARSK enzyme activity compared with the wild-type (ARSK-WT)"
    explanation: >-
      A second, independently identified missense allele is also catalytically
      null, supporting loss of enzyme activity as the shared molecular lesion.
  downstream:
  - target: Lysosomal accumulation of 2-O-sulfoglucuronate-capped GAG fragments
    causal_link_type: DIRECT
    description: >-
      With the 2-O-desulfation step blocked, exolytic degradation stalls at
      every chain terminus bearing a 2-O-sulfated glucuronate, and the partially
      degraded fragments accumulate in the lysosome.
    evidence:
    - reference: PMID:32856704
      reference_title: "Arylsulfatase K inactivation causes mucopolysaccharidosis due to deficient glucuronate desulfation of heparan and chondroitin sulfate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Arsk-deficient mice show, in an organ-specific manner, a moderate accumulation of HS and CS metabolites characterized by 2-O-sulfated glucuronate moieties at their non-reducing ends."
      explanation: >-
        Directly demonstrates that loss of ARSK causes accumulation of GAG
        metabolites capped by the very modification ARSK removes, establishing
        the causal link from enzyme loss to substrate storage.
- name: Lysosomal accumulation of 2-O-sulfoglucuronate-capped GAG fragments
  conforms_to: "mps_gag_storage#Lysosomal GAG Accumulation"
  biological_scale: CELLULAR
  description: >-
    Partially degraded heparan sulfate, dermatan sulfate, and chondroitin
    sulfate fragments terminating in 2-O-sulfoglucuronate accumulate in
    lysosomes. This is the GAG-accumulation hub of the mps_gag_storage module,
    but the storage burden is far smaller than in the other mucopolysaccharidoses
    and is engaged in a highly restricted way. Glucuronate-2-O-sulfation is an
    uncommon modification rather than a backbone-defining one, so only the
    minority of chains carrying it are blocked; the bulk of heparan, dermatan,
    and chondroitin sulfate is still catabolized normally. The module's
    heparan-sulfate neuronopathic arm and its keratan-sulfate skeletal arm are
    therefore not engaged - keratan sulfate is not an ARSK substrate, and no
    reported patient has CNS disease. Only the dermatan-sulfate
    connective-tissue arm is engaged, and even that partially: dermatan sulfate
    is the one GAG species reproducibly elevated in patient urine, and the
    downstream disease is confined to chondro-osseous and cardiac connective
    tissue rather than the generalized visceral storage of MPS I or VI.

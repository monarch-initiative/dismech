discussions:
- discussion_id: cardiac_substrate_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which GET3-dependent substrates connect the insertion defect to cardiac failure?
  attaches_to:
  - pathophysiology#Reduced Cardiac Tail-Anchored Protein Abundance
  - pathophysiology#Altered Vesicular Transport
  rationale: The patient study nominated cardiomyopathy-associated tail-anchored proteins, but emerin localization appeared normal. The mouse study subsequently demonstrated selective changes in substrate abundance with developmental differences. No individual substrate rescue establishes the indispensable causal link.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Emerin correctly localized to the nuclear membrane.
    explanation: Normal localization in the examined patient tissue does not rule out other defects in emerin or other substrates.
  - reference: PMID:41370295
    reference_title: ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While these findings support a role for ASNA1 in regulating trafficking of a subset of TA proteins, they are based on expression data and remain correlative.
    explanation: The authors explicitly limit inference from protein abundance to trafficking function.
    directness: INDIRECT
- discussion_id: cardiac_selectivity_and_er_stress
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Why does GET3 dysfunction predominantly affect the heart in the reported family, and when might other cellular stress responses occur?
  attaches_to:
  - pathophysiology#Altered Vesicular Transport
  rationale: The siblings died too young to define a lifelong organ spectrum. Other model tissues show additional effects, but these cannot be assigned as human CMD2H phenotypes. In developing knockout hearts, the measured ER-stress, UPR, ERAD and autophagy/lysosome transcripts were not increased; generic ER-stress activation is therefore not established as the cardiac mechanism.
  evidence:
  - reference: PMID:41370295
    reference_title: ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These results indicate that the loss of ASNA1 does not lead to the immediate activation of ER stress or related adaptive pathways during the early to mid-stage of heart development.
    explanation: Negative findings delimit the developmental mouse mechanism.
- discussion_id: heterozygous_get3_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Could heterozygous GET3 variants modify another genetic cardiomyopathy?
  attaches_to:
  - genetic#GET3
  rationale: The index report described a separate adolescent with an established LMNA variant and heterozygous GET3 Val183Met. The proposed modifier role was speculative, several predictors favored tolerance, and no second GET3 allele was found. This is neither another CMD2H case nor a demonstrated modifier of CMD2H.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: it cannot be excluded that this ASNA1 variant acted as a modifier of the LMNA-related cardiomyopathy
    explanation: The source raises a possibility rather than demonstrating modification.
    directness: INDIRECT
- discussion_id: human_model_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: How does residual allelic function alter human disease relative to complete cardiac or whole-organism knockout?
  attaches_to:
  - genetic#GET3
  - animal_models#Zebrafish
  - animal_models#Embryonic cardiomyocyte-specific Asna1 knockout mouse
  - animal_models#Adult inducible cardiomyocyte-specific Asna1 knockout mouse
  rationale: The human genotype includes an insertion-defective missense allele with a folded functional fraction, whereas the animal models delete asna1/Asna1. Species and developmental timing differ; lethality of both patients and models does not quantify their relative severity or establish a human genotype-prognosis rule.
notes: GET3 is the HGNC-approved symbol for ASNA1/TRC40. CMD2H (MONDO:0859358; OMIM:620203) is distinct from RPL3L-related CMD2D and GATAD1-related CMD2B. The clinical description is anchored to the 2019 sibling report and must not be broadened using unrelated cardiomyopathy cohorts. The GeneReviews Dilated Cardiomyopathy Overview provides general family-assessment guidance; the ISHLT 2025 guideline provides general pediatric heart-failure guidance, with age and hemodynamic constraints. Neither establishes GET3-specific treatment efficacy. The 2020 correction to the index article changes its licence to CC BY and does not report a correction to clinical or experimental results.

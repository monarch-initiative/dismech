name: Cardiomyopathy Dilated 2H
creation_date: '2026-09-01T00:00:00Z'
category: Mendelian
synonyms:
- CMD2H
- ASNA1-related cardiomyopathy
- GET3-related dilated cardiomyopathy
parents:
- hereditary disease
- familial isolated dilated cardiomyopathy
disease_term:
  preferred_term: cardiomyopathy, dilated, 2H
  term:
    id: MONDO:0859358
    label: cardiomyopathy, dilated, 2H
description: Dilated cardiomyopathy 2H (CMD2H) is an early-infantile cardiomyopathy associated with biallelic GET3 variants; GET3 was previously named ASNA1 and is also called TRC40. The founding report describes two siblings with rapidly progressive cardiac dysfunction and death in infancy. GET3 is an ATP-dependent targeting factor for tail-anchored membrane proteins. Patient tissue, recombinant-protein assays, zebrafish rescue, and cardiac knockout mice support a defect in protein targeting, but the precise substrate-to-heart-failure pathway remains unresolved. ClinGen classifies the autosomal recessive GET3-CMD2H relationship as Limited. The small clinical evidence base does not establish phenotype frequencies, penetrance, or inevitable lethality for every allele combination.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: The reported siblings carried the paternal Cys289Trp/Gln305Ter allele in trans with maternal Val163Ala. Unaffected parents and the older brother had normal cardiac screening at the reported ages; this is family-specific evidence, not a lifetime carrier-risk estimate.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2 variants c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis configuration on the paternal allele, and a missense variant c.488T>C p.(Val163Ala) on the maternal allele
    explanation: Three substitutions form two inherited alleles in the reported family.
  - reference: CGGV:assertion_605f9805-5af1-445a-911a-d31ebff15125-2026-03-04T170000.000Z
    reference_title: GET3 / cardiomyopathy, dilated, 2H (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: GET3 | HGNC:752 | cardiomyopathy, dilated, 2H | MONDO:0859358 | AR | Limited
    explanation: ClinGen classifies the recessive CMD2H relationship as Limited; model support does not substitute for additional clinical replication.
pathophysiology:
- name: Biallelic GET3 Dysfunction
  biological_scale: MOLECULAR
  description: The reported genotype pairs paternal Cys289Trp and Gln305Ter in cis with maternal Val163Ala. The missense allele impairs folding and tail-anchored protein insertion. Similar amounts of wild-type and mutant RNA were detected, so nonsense-mediated decay was not demonstrated; persistence of RNA alone does not establish the abundance of a truncated protein. The ATP hydrolysis annotation describes the normal protein function; variant-specific ATPase activity was not measured.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2 variants c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis configuration on the paternal allele, and a missense variant c.488T>C p.(Val163Ala) on the maternal allele
    explanation: Three substitutions form two inherited alleles in the reported family.
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Reverse transcription-polymerase chain reaction analysis showed equal amounts of wild-type and mutant products. Hence, no evidence was found for nonsense-mediated decay.
    explanation: RNA analysis provides a negative result for the proposed decay mechanism.

diagnosis:
- name: Negative targeted cardiomyopathy gene panel followed by exome sequencing
  description: >-
    Clinically actionable and stated outright in the source: a 48-gene targeted
    cardiomyopathy panel returned no deleterious variants, and the diagnosis was
    made only on subsequent trio exome sequencing. A negative panel in infantile
    dilated cardiomyopathy should therefore prompt exome or genome sequencing
    rather than closing the workup.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted next-generation sequencing of 48 genes implicated in cardiomyopathy revealed no potentially deleterious variants."
    explanation: Establishes that the standard cardiomyopathy panel does not detect this disorder.


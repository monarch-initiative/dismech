biochemical:
- name: Serum transferrin and apolipoprotein C-III isoelectric focusing
  biomarker_term:
    preferred_term: combined N-linked and O-linked glycosylation defect
    term:
      id: HP:0003642
      label: Type I transferrin isoform profile
  presence: Slightly abnormal
  notes: >-
    Both siblings had slightly abnormal transferrin and apolipoprotein C-III
    isoelectric focusing profiles, indicating a combined N- and O-linked
    glycosylation defect. This is not an incidental laboratory finding: it is a
    biochemical readout of the same lesion the pathograph describes, since
    several glycosylation machinery components are trafficking tail-anchored
    proteins that depend on GET3 for membrane insertion. It also means a CDG
    workup can be triggered by this disorder.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "slightly abnormal serum transferrin and apolipoprotein C-III isoelectric focusing profiles, indicative of a combined defect in N-linked and O-linked glycosylation"
    explanation: Reports the glycosylation abnormality in both siblings.


genetic:
- name: GET3
  notes: >-
    Biallelic variants in GET3 (HGNC-approved symbol; long known as ASNA1 and
    also called TRC40), encoding the central ATP-dependent targeting factor of
    the GET/TRC tail-anchored protein insertion pathway. The reported genotype is
    compound heterozygous: c.913C>T p.(Gln305*) on the paternal allele and
    c.488T>C p.(Val163Ala) on the maternal allele. Note that the entire published
    human literature uses the ASNA1 symbol.
  gene_term:
    preferred_term: GET3
    term:
      id: hgnc:752
      label: GET3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.488T>C variant on the maternal allele results in a valine to alanine substitution at residue 163 (p.Val163Ala)."
    explanation: Specifies the maternal missense allele in the index sibship.

- name: GET3 heterozygous modifier candidate
  notes: >-
    A single heterozygous c.547G>A p.(Val183Met) ASNA1 variant was found in an
    unrelated patient with LMNA-related dilated cardiomyopathy who needed
    transplantation at 16. In-silico predictors call it tolerated or likely
    benign and no second allele was found, so this is not a second case of
    CMD2H. The authors raise it only as a possible modifier of the LMNA disease,
    and it is recorded here at that strength and no more.
  gene_term:
    preferred_term: GET3
    term:
      id: hgnc:752
      label: GET3
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "it cannot be excluded that this ASNA1 variant acted as a modifier of the LMNA-related cardiomyopathy"
    explanation: >-
      The authors' own hedged statement. Indirect and deliberately weak - the
      variant is predicted benign and the claim is a non-exclusion, not a
      finding.

animal_models:
- name: asna1 loss-of-function zebrafish
  species: Zebrafish
  genotype: asna1 loss of function
  publication: PMID:31461301
  description: >-
    Loss of asna1 in zebrafish, used both to establish that the gene is required
    for cardiac function and, through mRNA rescue, to prove that the patient
    alleles are functionally deficient.
  modeled_mechanisms:
  - target: Impaired Cardiac Contractility and Ventricular Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the reduced cardiac contractility and lethality of the human
      disorder, and discriminates patient alleles from wild type: wild-type mRNA
      rescues the phenotype while either mutant mRNA fails to.
    limitations: >-
      A whole-organism knockdown/knockout rather than the human compound
      heterozygous state, and the zebrafish heart is two-chambered, so ventricular
      dilatation as seen in human DCM is not directly modeled.
    readouts:
    - name: Cardiac contractility after mutant versus wild-type mRNA injection
      target: Impaired Cardiac Contractility and Ventricular Remodeling
      direction: DECREASED
      interpretation: >-
        Wild-type mRNA rescues contractility and lethality; neither patient
        allele does, which is the functional evidence that both alleles are
        pathogenic.
      evidence:
      - reference: PMID:31461301
        reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to wild-type mRNA, injection of either mutant mRNA failed to rescue this phenotype."
        explanation: Reports the rescue experiment discriminating patient alleles from wild type.
    evidence:
    - reference: PMID:31461301
      reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of asna1 in zebrafish resulted in reduced cardiac contractility and early lethality."
      explanation: Establishes the zebrafish model as informative for the cardiac contractility node.

- name: Cardiomyocyte-specific Asna1 knockout mouse
  species: Mouse
  genotype: Cardiomyocyte-specific Asna1 knockout (constitutive and inducible)
  publication: PMID:41370295
  description: >-
    Constitutive and inducible cardiomyocyte-restricted Asna1 deletion. The pair
    separates a developmental requirement from a maintenance requirement:
    constitutive deletion causes perinatal lethality with ventricular myocardial
    thinning by E16.5, while inducible deletion in the adult heart causes rapid
    dilation and functional decline.
  modeled_mechanisms:
  - target: Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes the cell-autonomous cardiomyocyte mechanism — destabilized
      pre-targeting complex, depleted tail-anchored substrates, impaired
      trafficking — that patient tissue could not resolve.
    limitations: >-
      A complete cardiomyocyte-restricted null rather than the human compound
      heterozygous genotype, one allele of which is a hypomorphic missense, so
      the model is more severe than the human lesion and says nothing about
      residual GET3 function.
    readouts:
    - name: Ventricular myocardial wall thickness at E16.5
      target: Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
      direction: DECREASED
      interpretation: >-
        Marked ventricular myocardial thinning during embryogenesis shows the
        pathway is required for normal myocardial development.
      evidence:
      - reference: PMID:41370295
        reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Constitutive Asna1 deletion during embryogenesis caused perinatal lethality with marked ventricular myocardial thinning by embryonic day 16.5"
        explanation: Reports the developmental myocardial measurement in the constitutive knockout.
    evidence:
    - reference: PMID:41370295
      reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated constitutive and inducible cardiomyocyte-specific Asna1 knockout mouse models"
      explanation: Identifies the model system used to establish the cardiomyocyte-autonomous mechanism.

treatments:
- name: Supportive Heart Failure Management
  description: >-
    No disease-directed therapy exists. Management is the standard supportive
    care of infantile dilated cardiomyopathy - diuretics, inotropes and
    mechanical support. Both reported patients died in early infancy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Extracorporeal Membrane Oxygenation
  description: >-
    The proband was transferred for ECMO after rapid deterioration with brief
    circulatory arrest. It did not alter the course: left ventricular function
    remained poor, a refractory intracardiac thrombus developed, and she died at
    seven weeks. Recorded because it was actually administered and because its
    failure is part of the prognosis.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_mechanisms:
  - target: Impaired Cardiac Contractility and Ventricular Remodeling
    description: >-
      Mechanical circulatory support substitutes for failing contractility; it
      does not address the underlying targeting defect.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she was transferred to a tertiary referral hospital for extracorporeal membrane oxygenation. LV function remained poor without any signs of improvement"
    explanation: Records that ECMO was administered and that ventricular function did not improve on it.

discussions:
- discussion_id: which_ta_substrate_drives_the_heart_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which tail-anchored protein substrates, among the many depleted by GET3
    loss, actually account for the cardiac phenotype?
  attaches_to:
  - pathophysiology#Impaired Tail-Anchored Protein Insertion
  - pathophysiology#Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
  rationale: >-
    The index paper narrows this considerably: inspecting the predicted human
    tail-anchored proteome it names seven already associated with human
    cardiomyopathy - DMPK, DYSF, EMD, JPH2, PLN, SYNE1 and SYNE2. So the gap is
    not that no candidates exist but which of that shortlist is rate-limiting.
    There is also a partial negative result to work against: emerin localized
    correctly to the nuclear membrane in patient myocardium, though nuclei were
    irregularly shaped, which argues against emerin mislocalization being the
    proximate lesion. Tail-anchored proteins are roughly 5% of integral membrane
    proteins and the mouse work reports reduced expression of multiple substrates
    collectively, so the shortlist is where the question becomes tractable.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed 7 proteins of interest that have been associated with cardiomyopathy in humans: DMPK"
    explanation: Names the candidate tail-anchored substrates, which is what makes this gap actionable rather than open-ended.
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Emerin correctly localized to the nuclear membrane."
    explanation: Refutes emerin mislocalization as the proximate lesion, narrowing the candidate shortlist.

- discussion_id: cardiac_selectivity_of_a_ubiquitous_chaperone
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of a ubiquitously expressed chaperone present as isolated
    dilated cardiomyopathy rather than a multisystem disorder?
  attaches_to:
  - pathophysiology#Biallelic GET3 Loss of Function
  rationale: >-
    Only two patients, siblings, have been reported, and both died in early
    infancy — so the apparent cardiac selectivity may be real tissue
    vulnerability or may simply reflect that the heart fails first. There is a
    concrete mechanistic proposal to test: the endoplasmic reticulum membrane
    complex provides an alternative insertion route for moderately hydrophobic
    tail-anchored substrates, so tissues could differ in how much they depend on
    GET3 specifically. Against pure cardiac selectivity, model organisms show
    extra-cardiac deficits including visual, touch, otoferlin-dependent hearing
    and insulin-secretion phenotypes; the two siblings passed newborn hearing
    screening, but neither survived long enough for later-onset deficits to
    declare themselves. Additional patients surviving longer would resolve it.

- discussion_id: human_model_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do complete-null animal models over-represent the severity of the human
    compound heterozygous genotype, in which one allele is a missense that
    leaves misfolded protein present?
  attaches_to:
  - animal_models#Mouse
  - animal_models#Zebrafish
  - pathophysiology#Biallelic GET3 Loss of Function
  rationale: >-
    Both the zebrafish and mouse models are effectively null and both are
    lethal, whereas the human genotype pairs a nonsense allele with a
    p.(Val163Ala) missense allele that still produces protein, albeit misfolded
    and insertion-deficient. Whether residual hypomorphic activity modifies the
    human course cannot be addressed in a null model, and no patient with a
    milder allele combination has been reported to test it against.

notes: >-
  Do not confuse CMD2H with CMD2D. Both are autosomal recessive,
  neonatal/infantile-onset, rapidly progressive dilated cardiomyopathies with
  early death, and their OMIM numbers sit one letter apart, but they are
  different diseases with different genes:

    CMD2H  OMIM:620203  MONDO:0859358  GET3 (ASNA1)  Verhagen et al. 2019
    CMD2D  OMIM:619371  MONDO:0030300  RPL3L         Ganapathi et al. 2020

  This entry is CMD2H (GET3). The openscientist deep-research report generated
  for this entry, committed alongside it as
  research/Cardiomyopathy_Dilated_2H-deep-research-openscientist.md, is
  substantively a report about CMD2D: it names RPL3L as the causal gene 44
  times, never mentions ASNA1 or GET3, and builds its whole mechanism section
  on muscle-specific ribosome biogenesis. Nothing was taken from it. It is
  retained for provenance only, and CMD2D is separately queued for curation as
  stubs/Cardiomyopathy_Dilated_2D.yaml, where the report's content would
  actually apply.

  Naming: HGNC has renamed ASNA1 to GET3, and this entry binds hgnc:752 (GET3)
  accordingly, but every published human report uses ASNA1 — search both symbols
  when looking for further cases. TRC40 is a third name for the same protein.


name: Cardiomyopathy Dilated 2H
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Dilated cardiomyopathy 2H (CMD2H) is an autosomal recessive, early
  infantile-onset cardiomyopathy caused by biallelic variants in GET3 (long
  known as ASNA1, and also called TRC40). It is mechanistically unlike most
  familial dilated cardiomyopathy: the causal gene encodes no sarcomeric or
  cytoskeletal protein but the central ATP-dependent chaperone of the GET/TRC
  pathway, which inserts tail-anchored proteins post-translationally into the
  endoplasmic reticulum membrane. Loss of that targeting factor destabilizes the
  pre-targeting complex, depletes a broad set of tail-anchored substrates, and
  disrupts membrane trafficking and cardiomyocyte proteostasis. The clinical
  course is rapidly progressive dilated cardiomyopathy with death in early
  infancy. It was the first evidence that the tail-anchored protein insertion
  pathway causes human disease.
synonyms:
- CMD2H
- ASNA1-related cardiomyopathy
- GET3-related dilated cardiomyopathy
parents:
- hereditary disease
- familial isolated dilated cardiomyopathy
disease_term:
  preferred_term: cardiomyopathy, dilated, 2H
  term:
    id: MONDO:0859358
    label: cardiomyopathy, dilated, 2H

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Compound heterozygous GET3 variants inherited in trans, identified in a
    sibling pair by family-based exome sequencing.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified compound heterozygous variants in the highly conserved ASNA1 gene (arsA arsenite transporter, ATP-binding, homolog), which encodes an ATPase required for post-translational membrane insertion of tail-anchored proteins."
    explanation: Compound heterozygous inheritance of two GET3/ASNA1 alleles establishes the recessive mode.

pathophysiology:
- name: Biallelic GET3 Loss of Function
  description: >-
    Three variants across two alleles, not two. The paternal allele carries
    c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis; the maternal allele
    carries c.488T>C p.(Val163Ala). The cis pairing matters mechanistically:
    Cys289 is part of an essential zinc-binding site, so the paternal allele is
    doubly compromised rather than simply truncated. Reduced protein abundance
    was demonstrated directly in patient myocardium and skin fibroblasts. The
    maternal missense allele leaves protein present but misfolded. Notably the
    premature stop codon does not trigger nonsense-mediated decay - wild-type
    and mutant transcripts were present in equal amounts - so the truncated
    protein is made.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Tail-Anchored Protein Insertion
    causal_link_type: DIRECT
    description: >-
      Both alleles converge on the same functional endpoint, which was measured
      directly in an in vitro tail-anchored protein insertion assay.
    evidence:
    - reference: PMID:31461301
      reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies showed that this variant leads to protein misfolding as well as less effective tail-anchored protein insertion."
      explanation: Directly links the patient missense allele to reduced tail-anchored protein insertion in a functional assay.
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.913C>T variant on the paternal allele is predicted to result in a premature stop codon p.(Gln305*), and likely explains the decreased protein expression observed in myocardial tissue and skin fibroblasts."
    explanation: Documents reduced GET3/ASNA1 protein in patient heart and fibroblasts attributable to the nonsense allele.
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 variants c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis configuration on the paternal allele, and a missense variant c.488T>C p.(Val163Ala) on the maternal allele"
    explanation: Establishes that the paternal allele carries two variants in cis, not one, which the earlier description omitted.
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reverse transcription-polymerase chain reaction analysis showed equal amounts of wild-type and mutant products. Hence, no evidence was found for nonsense-mediated decay."
    explanation: A non-obvious negative result given a premature stop codon - the truncated transcript escapes decay, so truncated protein is produced.

- name: Impaired Tail-Anchored Protein Insertion
  description: >-
    GET3/ASNA1 is the central ATP-dependent chaperone that receives tail-anchored
    proteins from the BAG6/UBL4A/TRC35 pre-targeting complex and delivers them to
    the WRB/CAML receptor in the endoplasmic reticulum membrane. Losing it both
    destabilizes that pre-targeting complex and reduces the expression of
    multiple tail-anchored substrates. Tail-anchored proteins are roughly 5% of
    integral membrane proteins, which is why a single chaperone defect has such
    broad downstream consequences.
  biological_scale: MOLECULAR
  downstream:
  - target: Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
    causal_link_type: DIRECT
    description: >-
      Depletion of tail-anchored substrates impairs the vesicular transport
      machinery those substrates constitute.
    evidence:
    - reference: PMID:41370295
      reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ASNA1 deficiency destabilized the pre-targeting complex and reduced the expression of multiple TA protein substrates, impairing membrane trafficking and protein transport."
      explanation: States the causal step from lost targeting factor to impaired membrane trafficking.
  biological_processes:
  - preferred_term: tail-anchored membrane protein insertion into ER membrane
    term:
      id: GO:0071816
      label: tail-anchored membrane protein insertion into ER membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:41370295
    reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ASNA1 (also known as TRC40 or GET3) serves as the central ATP-dependent chaperone delivering TA proteins to the endoplasmic reticulum (ER) membrane."
    explanation: Identifies the specific molecular role that is lost.

- name: Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
  description: >-
    In cardiomyocytes the consequence is disrupted vesicular transport and
    proteostasis, with compensatory transcriptional upregulation of protein
    trafficking and Golgi-to-ER transport genes — a maladaptive response rather
    than a successful rescue.
  biological_scale: CELLULAR
  downstream:
  - target: Cardiomyocyte Structural Disorganization
    causal_link_type: DIRECT
    description: >-
      Failure to insert tail-anchored proteins is expressed structurally, at the
      intercalated disc and the myofibrillar apparatus.
    evidence:
    - reference: PMID:31461301
      reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in both patients, intercalated discs were irregular in appearance and intercellular space was increased"
      explanation: The structural lesion observed in patient myocardium, downstream of the trafficking defect.
  - target: Impaired Cardiac Contractility and Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Loss of cardiomyocyte proteostasis translates into contractile failure and
      pathological chamber remodeling.
    evidence:
    - reference: PMID:41370295
      reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "inducible deletion in adult cardiomyocytes led to rapid ventricular dilation, impaired cardiac function, pathological remodeling, and early mortality"
      explanation: Cardiomyocyte-restricted deletion is sufficient to produce dilation and contractile failure, establishing the cell-autonomous link.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: intracellular protein transport
    term:
      id: GO:0006886
      label: intracellular protein transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41370295
    reference_title: "ASNA1 is essential for cardiac development and function by regulating tail-anchored protein stability and vesicular transport in cardiomyocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptomic analyses revealed compensatory upregulation of genes involved in protein trafficking and Golgi-to-ER transport, reflecting maladaptive responses to disrupted vesicular transport."
    explanation: Documents the disrupted vesicular transport and the maladaptive compensatory response in cardiomyocytes.

- name: Cardiomyocyte Structural Disorganization
  description: >-
    The tissue-level correlate of the trafficking defect, and the step the
    entry previously asserted without one. Intercalated discs are irregular with
    increased intercellular space on N-cadherin labelling and electron
    microscopy, desmin staining shows myofibrillar disorganization, and the
    myocardium carries prominent subendothelial fibrosis. The authors tie the
    intercalated disc lesion to the same finding in wrb-deficient models and in
    phospholamban disease, which is what makes it mechanistically specific
    rather than a non-specific end-stage change.
  biological_scale: TISSUE
  downstream:
  - target: Impaired Cardiac Contractility and Ventricular Remodeling
    causal_link_type: DIRECT
    description: >-
      Disorganized intercalated discs and myofibrils are the structural basis of
      the contractile failure.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmin staining confirmed myofibrillar disorganization"
    explanation: Documents myofibrillar disorganization in patient myocardium.
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopic examination of the myocardium showed prominent subendothelial fibrosis."
    explanation: Documents the fibrotic change accompanying the structural disorganization.

- name: Impaired Cardiac Contractility and Ventricular Remodeling
  description: >-
    Ventricular dilatation with impaired systolic function. In the mouse,
    constitutive cardiomyocyte deletion produces marked ventricular myocardial
    thinning by embryonic day 16.5 and perinatal lethality, indicating the
    pathway is required for cardiac development as well as for maintenance.
  biological_scale: ORGANISM
  downstream:
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of asna1 in zebrafish resulted in reduced cardiac contractility and early lethality."
    explanation: Establishes reduced cardiac contractility as the organ-level consequence of losing the gene.


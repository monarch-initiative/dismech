genetic:
- name: GET3
  gene_term:
    preferred_term: GET3
    term:
      id: hgnc:752
      label: GET3
  variant_origin: GERMLINE
  association: Reported autosomal recessive cardiomyopathy gene with Limited ClinGen validity
  notes: The paternal allele carries Cys289Trp and Gln305Ter in cis, in trans with maternal Val163Ala (NM_004317.2). The independent effects of the two paternal substitutions were not separated in the rescue experiment. RNA persisted despite the premature stop; this does not establish normal protein abundance. The recombinant maternal variant impairs folding and insertion while its folded fraction retains substrate capture. Additional unrelated clinical families are needed to strengthen gene-disease validity.
  gene_disease_validity:
  - validity_classification: LIMITED
    classified_by: CLINGEN
    external_id: CGGV:assertion_605f9805-5af1-445a-911a-d31ebff15125-2026-03-04T170000.000Z
    evidence:
    - reference: CGGV:assertion_605f9805-5af1-445a-911a-d31ebff15125-2026-03-04T170000.000Z
      reference_title: GET3 / cardiomyopathy, dilated, 2H (Limited)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: GET3 | HGNC:752 | cardiomyopathy, dilated, 2H | MONDO:0859358 | AR | Limited
      explanation: ClinGen classifies the recessive CMD2H relationship as Limited; model support does not substitute for additional clinical replication.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2 variants c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis configuration on the paternal allele, and a missense variant c.488T>C p.(Val163Ala) on the maternal allele
    explanation: Three substitutions form two inherited alleles in the reported family.
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: properly folded mutant ASNA1, while competent for TA protein interaction, is inefficient in facilitating TA protein insertion into the ER membrane.
    explanation: The recombinant Val163Ala protein separates substrate capture from the subsequent insertion defect.

    quote_role: REVIEW_SYNTHESIS
- name: Extracorporeal membrane oxygenation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Extracorporeal Membrane Oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  description: ECMO was used in the proband after circulatory arrest; ventricular function did not recover and an LV thrombus developed. This single outcome does not establish futility of mechanical support in every GET3 genotype.
  target_mechanisms:
  - target: Heart Failure
    description: Supports systemic circulation during severe pump failure.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: she was transferred to a tertiary referral hospital for extracorporeal membrane oxygenation. LV function remained poor without any signs of improvement
    explanation: Observed treatment and outcome in the proband.
- name: Advanced heart-failure and transplantation evaluation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  description: Early referral to a pediatric advanced-heart-failure team may allow assessment for mechanical support and transplantation. Neither index sibling underwent transplantation, and GET3-specific transplant outcomes are unestablished; candidacy is individualized.
  target_mechanisms:
  - target: Heart Failure
    description: Evaluates replacement of the failing heart for otherwise refractory disease.
  evidence:
  - reference: url:https://www.ishlt.org/docs/default-source/standards-guidelines/2025_guideline_ishlt_pedshfmanagement.pdf
    reference_title: https://www.ishlt.org/docs/default-source/standards-guidelines/2025_guideline_ishlt_pedshfmanagement.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In patients with severe acute HF, it is reasonable to initiate transfer to a center with pediatric HF specialists who have the expertise and ability to optimize medical therapy, evaluate for heart transplantation, and provide mechanical support
    explanation: The pediatric guideline supports evaluation by an expert team; it does not establish CMD2H-specific transplant benefit.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic counseling
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: Discuss segregation, uncertainty in the gene-disease evidence, reproductive testing and family assessment. For the confirmed parental genotypes, Mendelian segregation predicts a 25% chance of inheriting both familial alleles in each pregnancy. This is a genotype calculation, not a measured penetrance estimate.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2 variants c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis configuration on the paternal allele, and a missense variant c.488T>C p.(Val163Ala) on the maternal allele
    explanation: Confirmed phase and parental segregation provide the premise for the Mendelian recurrence calculation.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/pdf/Bookshelf_NBK1309.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is appropriate to clarify the clinical and genetic status of asymptomatic family members at risk for DCM prior to the onset of manifestations
    explanation: General family-assessment guidance.
    quote_role: REVIEW_SYNTHESIS
- name: Experimental GET3 mRNA rescue
  therapeutic_modality: MRNA_THERAPY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  description: Wild-type human ASNA1 mRNA injection partly and transiently rescued knockout zebrafish, whereas the paternal double-mutant and maternal missense constructs did not. This establishes experimental rescue, not an available infant treatment or evidence for AAV therapy.
  target_mechanisms:
  - target: Reduced GET3 Protein Abundance
    description: Supplies wild-type GET3 in the experimental model.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Injection of wild-type human ASNA1 mRNA into asna1Δ7/Δ7 zebrafish embryos significantly rescued the phenotype at each time point examined
    explanation: Wild-type rescue supports gene specificity; its effect waned over time and is not a clinical treatment result.

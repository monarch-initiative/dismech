name: Spermatogenic Failure 16
creation_date: "2026-10-31T12:00:00Z"
category: Mendelian
synonyms:
- SPGF16
- spermatogenic failure type 16
- SUN5 azoospermia
- azoospermia caused by mutation in SUN5
- SUN5-related acephalic spermatozoa syndrome
description: >-
  Spermatogenic failure 16 (SPGF16) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in SUN5, a testis-specific SUN
  domain protein of the sperm nuclear envelope. Affected men are otherwise
  healthy and present with acephalic spermatozoa syndrome: the ejaculate
  contains mostly headless flagella, a minority of tail-less heads, and a few
  intact spermatozoa with an abnormal head-tail junction. SUN5 sits in the
  posterior nuclear envelope at the implantation fossa, where it is thought to
  form a LINC (linker of nucleoskeleton and cytoskeleton) bridge that holds the
  head-tail coupling apparatus against the nucleus. Without it, the coupling
  apparatus separates from the nucleus during spermatid elongation and the
  break lies between the nucleus and the proximal centriole. Nonsense,
  frameshift, splice-site, missense and whole-gene deletion alleles are
  reported, and SUN5 is the most frequently mutated gene in acephalic
  spermatozoa syndrome, with a founder splice-site duplication common in men
  of North African origin. Intracytoplasmic sperm injection (ICSI) with the
  detached heads has mostly given good fertilization and pregnancy rates.
disease_term:
  preferred_term: spermatogenic failure 16
  term:
    id: MONDO:0014961
    label: spermatogenic failure 16
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 617187 and records SUN5 as its
  causal gene. MONDO's text definition calls the disease an azoospermia, but
  every reported patient produces spermatozoa; the defect is sperm
  decapitation, not absent sperm. No GeneReviews chapter or ClinGen
  gene-disease validity assertion for SUN5 is in the committed Bookshelf index
  or the cached ClinGen export, so no validity tier is recorded. Sun5 knockout
  mouse sperm look round-headed on light microscopy, but these are headless
  tails with a retained cytoplasmic droplet, not globozoospermia.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires two SUN5 loss-of-function alleles, either homozygous
    (often in consanguineous families or with a founder allele) or compound
    heterozygous, including a point variant in trans with a deletion of the
    whole gene.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27640305
    reference_title: "Biallelic SUN5 Mutations Cause Autosomal-Recessive Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, these results demonstrate that biallelic SUN5 mutations cause male infertility due to autosomal-recessive acephalic spermatozoa syndrome."
    explanation: Biallelic variants in eight unrelated men establish recessive inheritance.
  - reference: PMID:34159570
    reference_title: "Novel Mutation and Deletion in SUN5 Cause Male Infertility with Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one compound heterozygous including one reported missense mutation (c.1043A>T; p.N348I) and a large deletion that contains partial EFCAB8 ( NM_001143967 .1) and BPIFB2 ( NM_025227 ) and complete SUN5 ( NM_080675 )"
    explanation: A point variant in trans with a whole-gene deletion is the compound heterozygous form of recessive inheritance.
pathophysiology:
- name: Loss of SUN5 Protein
  description: >-
    Nonsense, frameshift and splice-site alleles truncate SUN5 or remove its
    transcript, a 5-kb deletion-insertion removes exon 8, and a large deletion
    removes the whole gene. Several missense variants in the SUN domain alter
    folding and localization, and patient sperm carrying them also lack the
    protein. SUN5 is a testis-specific inner nuclear membrane protein that, in
    mature sperm, sits at the implantation fossa where the tail attaches to the
    head.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SUN5
    term:
      id: hgnc:16252
      label: SUN5
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:

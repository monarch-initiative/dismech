    explanation: Systematic review ranking SUN5 among the two best-established acephalic spermatozoa genes.
animal_models:
- name: Sun5 knockout mouse
  species: Mouse
  genotype: Sun5 -/-
  publication: PMID:28945193
  description: >-
    Male Sun5-null mice are infertile and produce mostly headless sperm, with
    the coupling apparatus detaching from the nucleus during spermatid
    elongation. Healthy offspring were obtained by injecting the tail-less
    heads into oocytes. Independent knockout lines reproduce the phenotype.
  modeled_mechanisms:
  - target: Defective Sperm Head-Tail Coupling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout reproduces the human acephalic phenotype and shows when and where the junction fails.
    limitations: >-
      Most mouse acephalic sperm retain a large cytoplasmic droplet and look
      round-headed, a feature not emphasized in patient reports, and the mouse
      lines are complete nulls whereas some human alleles are missense.
    evidence:
    - reference: PMID:34268309
      reference_title: "SUN5 Interacting With Nesprin3 Plays an Essential Role in Sperm Head-to-Tail Linkage: Research on Sun5 Gene Knockout Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we generated Sun5 knockout mice and found that the head-to-tail linkage was broken in Sun5-/- mice, which was similar to human acephalic spermatozoa syndrome."
      explanation: An independent knockout line reproduces the human phenotype.
  - target: Disrupted SUN5 Nuclear Envelope Anchoring Complex
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Knockout testis was used to identify the LaminB1, Septin12 and Nesprin3 partners of SUN5.
    limitations: >-
      Partner interactions were mapped in mouse testis and transfected cells;
      only Nesprin3 and ODF1 mislocalization has been checked in patient sperm.
    evidence:
    - reference: PMID:38870534
      reference_title: "SUN5 interacts with nuclear membrane LaminB1 and cytoskeletal GTPase Septin12 mediating the sperm head-and-tail junction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the present study, we generated Sun5 knockout mice, which presented the phenotype of ASS."
      explanation: A third knockout line reproduces the phenotype and was used to map partners.
diagnosis:
- name: Semen analysis and sperm electron microscopy
  description: >-
    Semen analysis shows mostly headless flagella with a few tail-less heads.
    Transmission electron microscopy locates the break between the nucleus and
    the proximal centriole, and in North African patients showed a conserved
    flagellar structure and slightly decondensed chromatin.
  diagnosis_term:
    preferred_term: transmission electron microscopy of spermatozoa
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:33671757
    reference_title: "Identification and Characterization of the Most Common Genetic Variant Responsible for Acephalic Spermatozoa Syndrome in Men Originating from North Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission electron microscopy showed a conserved flagellar structure and a slightly decondensed chromatin."
    explanation: Ultrastructural findings in SUN5 patient sperm.
- name: Whole-exome sequencing
  description: >-
    Most SUN5 cases were found by exome sequencing confirmed by Sanger
    sequencing. For men of North African origin, targeted genotyping of the
    c.211+1_211+2dup founder variant is a cheap first test.
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:27640305
    reference_title: "Biallelic SUN5 Mutations Cause Autosomal-Recessive Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing in two unrelated infertile men and subsequent variant filtering identified one homozygous"
    explanation: Exome sequencing found the first SUN5 variants.
  - reference: PMID:33671757
    reference_title: "Identification and Characterization of the Most Common Genetic Variant Responsible for Acephalic Spermatozoa Syndrome in Men Originating from North Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, a simple and inexpensive genotyping of the 211+1_211+2dup variant could be beneficial for affected men of North African origin before resorting to more exhaustive genetic analyses."
    explanation: Recommends founder-variant genotyping before broader sequencing.
- name: Screening for SUN5 genomic deletion
  description: >-
    A single heterozygous SUN5 variant calls for copy-number analysis of the
    other allele, because a whole-gene deletion can be in trans.
  diagnosis_term:
    preferred_term: whole-genome sequencing for copy-number analysis
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:34159570
    reference_title: "Novel Mutation and Deletion in SUN5 Cause Male Infertility with Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommended a clinical diagnostic strategy for SUN5 genomic deletion to screen heterozygous deletions and indicated that the diagnostic value of screening for SUN5 mutations and deletions in infertile men with ASS."
    explanation: Authors recommend deletion screening in acephalic spermatozoa.
  - reference: PMID:34159570
    reference_title: "Novel Mutation and Deletion in SUN5 Cause Male Infertility with Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing (WGS) was performed to detect heterozygous deletion."
    explanation: Whole-genome sequencing detected the deleted allele.
differential_diagnoses:
- name: TSGA10-related acephalic spermatozoa (SPGF26)
  disease_term:
    preferred_term: spermatogenic failure 26
    term:
      id: MONDO:0054730
      label: spermatogenic failure 26
  distinguishing_features:
  - >-
    The same semen phenotype, but the break lies between the distal centriole
    and the midpiece rather than between the nucleus and the proximal
    centriole, and the tails show a disorganized mitochondrial sheath.
  - >-
    Break site matters for ICSI: sperm from the SUN5 break subtype gave better
    ICSI outcomes than other subtypes.
  evidence:
  - reference: PMID:32104701
    reference_title: "Beyond Acephalic Spermatozoa: The Complexity of Intracytoplasmic Sperm Injection Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the breakage of TSGA10 associated with AS sperms is located between the distal centriole and the midpiece"
    explanation: Review placing the TSGA10 break at a different site from SUN5.
  - reference: PMID:32104701
    reference_title: "Beyond Acephalic Spermatozoa: The Complexity of Intracytoplasmic Sperm Injection Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Interestingly, all AS sperm of subtype II achieved better ICSI outcomes than other subtypes, resulting in clinical pregnancies and live births."
    explanation: The SUN5 subtype has the better ICSI outcomes.
- name: PMFBP1-related acephalic spermatozoa (SPGF31)
  disease_term:
    preferred_term: spermatogenic failure 31
    term:
      id: MONDO:0020852
      label: spermatogenic failure 31
  distinguishing_features:
  - >-
    Clinically indistinguishable from SPGF16 and in the same ultrastructural
    subtype; genetic testing separates them. In knockout mice the two proteins
    end up on opposite fragments: without SUN5 the tail-side partners stay on
    the decapitated tail, while without PMFBP1 SUN5 stays on the detached head.
  evidence:
  - reference: PMID:34389728
    reference_title: "The missing linker between SUN5 and PMFBP1 in sperm head-tail coupling apparatus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that lack of Sun5 results in CENTLEIN and PMFBP1 left in the decapitated tail, while disruption of Pmfbp1 results in SUN5 and CENTLEIN left on the detached sperm head."
    explanation: SUN5 and PMFBP1 act on opposite sides of the coupling apparatus.
  - reference: PMID:32104701
    reference_title: "Beyond Acephalic Spermatozoa: The Complexity of Intracytoplasmic Sperm Injection Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on electron microscopic observations, broken points of the sperm neck are AS defects that are based on various genes that can be classified into three subtypes: HOOK1, SUN5, and PMFBP1 genes of subtype II"
    explanation: SUN5 and PMFBP1 share an ultrastructural subtype.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI with the detached heads or the rare intact sperm is the only route to
    biological paternity. A retrospective cohort reported high fertilization,
    good embryo quality and pregnancy in all five treated SUN5 patients, and
    healthy children have been born; one later family had two failed cycles.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Acephalic spermatozoa
    description: Injecting a detached head into the oocyte bypasses the need for an intact sperm.
  evidence:
  - reference: PMID:29329387
    reference_title: "Patients with acephalic spermatozoa syndrome linked to SUN5 mutations have a favorable pregnancy outcome from ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rates of fertilization, good-quality embryos and pregnancy for five patients with SUN5 mutations following ICSI were 81.5%, 81.8% and 100%, respectively."
    explanation: Good ICSI outcomes in a SUN5 cohort.
  - reference: PMID:28945193
    reference_title: "Essential role for SUN5 in anchoring sperm head to the tail."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we found that healthy heterozygous offspring could be obtained via intracytoplasmic injection of Sun5-mutated sperm heads for both male mice and patients."
    explanation: Healthy offspring from ICSI with SUN5-mutant sperm heads in patients.
  - reference: PMID:33671757
    reference_title: "Identification and Characterization of the Most Common Genetic Variant Responsible for Acephalic Spermatozoa Syndrome in Men Originating from North Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH did not highlight a higher rate of chromosome aneuploidy in spermatozoa from SUN5 patients compared to controls, indicating that intra-cytoplasmic sperm injection (ICSI) can be proposed for patients carrying the c.211+1_211+2dup variant."
    explanation: No excess sperm aneuploidy, supporting ICSI.
  - reference: PMID:40977202
    reference_title: "Whole-exome sequencing reveals a novel mutation in the SUN5 gene causing acephalic spermatozoa syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted two intracytoplasmic sperm injections (ICSI) cycles for the proband, however, the treatment did not result in his partner achieving pregnancy."
    explanation: ICSI did not succeed for one SUN5 patient.
- name: Genetic Counseling
  description: >-
    Counseling on autosomal recessive inheritance and on the share of
    acephalic spermatozoa explained by SUN5, which differs between
    populations.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29331481
    reference_title: "Genetic contribution of SUN5 mutations to acephalic spermatozoa in Fujian China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results will help in the genetic counseling of patients with acephalic spermatozoa."
    explanation: Authors note the relevance of SUN5 frequency estimates for counseling.

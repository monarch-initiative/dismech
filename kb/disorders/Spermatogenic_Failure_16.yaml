genetic:
- name: SUN5
  association: Causal
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SUN5
    term:
      id: hgnc:16252
      label: SUN5
  notes: >-
    SUN5 was previously named SPAG4L and TSARG4. Reported alleles include
    c.381delA (p.Val128Serfs*7), recurrent in Chinese patients; the founder
    splice variant c.211+1_211+2dup in men of North African origin; c.340G>A
    (p.Gly114Arg) and c.425+1G>A, which disrupt splicing; nonsense alleles
    c.88C>T (p.Arg30*), c.216G>A (p.Trp72*), c.475C>T (p.Arg159*), c.675C>A
    (p.Tyr225*), c.829C>T (p.Gln277*) and c.851C>G (p.Ser284*); a 5-kb
    deletion-insertion removing exon 8; a whole-gene deletion; and missense
    alleles including p.Thr275Met, p.Asn348Ile, p.Arg356Cys, p.Gly259Ser and
    p.Arg358Gln. No ClinGen gene-disease validity assertion for SUN5 is in the
    cached ClinGen export.
  case_fractions:
  - population: Chinese acephalic spermatozoa cohort (17 unrelated men)
    case_fraction_percent: 47.06
    cohort_size: 17
    notes: Eight of 17 men carried biallelic SUN5 variants.
    evidence:
    - reference: PMID:27640305
      reference_title: "Biallelic SUN5 Mutations Cause Autosomal-Recessive Acephalic Spermatozoa Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These 10 SUN5 variants were found in 8 of 17 unrelated men, explaining the genetic defect in 47.06% of the affected individuals in our cohort."
      explanation: SUN5 share of acephalic spermatozoa cases in the founding cohort.
  - population: Fujian, China acephalic spermatozoa cohort (15 unrelated men)
    case_fraction_percent: 33.33
    cohort_size: 15
    notes: All five solved cases carried the same homozygous c.381delA allele.
    evidence:
    - reference: PMID:29331481
      reference_title: "Genetic contribution of SUN5 mutations to acephalic spermatozoa in Fujian China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five of the 15 (33.33%) subjects were found to carry the same homozygous mutation in the SUN5 gene c.381delA (p.V128Sfs*7)."
      explanation: SUN5 share of cases in a second Chinese cohort.
  - population: Acephalic spermatozoa cohort of North African origin (France and Tunisia)
    case_fraction_percent: 78
    cohort_size: 9
    notes: Seven of nine men were homozygous for the c.211+1_211+2dup founder variant.
    evidence:
    - reference: PMID:33671757
      reference_title: "Identification and Characterization of the Most Common Genetic Variant Responsible for Acephalic Spermatozoa Syndrome in Men Originating from North Africa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variant filtering permitted us to identify the same SUN5 homozygous frameshift variant (c.211+1_211+2dup) in 7/9 individuals (78%)."
      explanation: SUN5 share of cases in men of North African origin.
  evidence:
  - reference: PMID:27640305
    reference_title: "Biallelic SUN5 Mutations Cause Autosomal-Recessive Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing in two unrelated infertile men and subsequent variant filtering identified one homozygous ... SUN5 (also named TSARG4) variants."
    explanation: First gene-disease report.
  - reference: PMID:28541472
    reference_title: "Homozygous deletion of SUN5 in three men with decapitated spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore present the second case where the acephalic spermatozoa syndrome is associated with two LOF alleles of SUN5."
    explanation: Independent replication in a North African family.
  - reference: PMID:33848337
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by SUN5 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we performed whole-exome sequencing in 10 unrelated ASS and identified 2 homozygous variants ... in SUN5 in 4 patients."
    explanation: Further nonsense and frameshift alleles in an unrelated cohort.
  - reference: PMID:33452591
    reference_title: "Genetic basis of acephalic spermatozoa syndrome, and intracytoplasmic sperm injection outcomes in infertile men: a systematic scoping review."
    supports: SUPPORT
    evidence_source: OTHER

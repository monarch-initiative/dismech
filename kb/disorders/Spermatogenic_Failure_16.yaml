      snippet: "In Sun5-knockout mice ( Sun5 -/-), poly(A) + RNA accumulates in the nuclei of germ cells, leading to reduced sperm counts, decreased sperm motility and disrupted sperm head-to-tail junctions."
      explanation: Loss of Sun5 in mice causes nuclear retention of germ-cell mRNA.
  evidence:
  - reference: PMID:27640305
    reference_title: "Biallelic SUN5 Mutations Cause Autosomal-Recessive Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SUN5 variants lead to absent, significantly reduced, or truncated SUN5, and certain variants altered SUN5 distribution in the head-tail junction of the sperm."
    explanation: Patient variants abolish, reduce or truncate SUN5 in sperm.

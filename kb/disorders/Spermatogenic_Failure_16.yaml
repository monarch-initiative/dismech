    reference_title: "Homozygous deletion of SUN5 in three men with decapitated spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found all three men to be homozygous for a deletion-insertion variant (GRCh38 - chr20:32995761_32990672delinsTGGT) that removes 5090 base pairs including exon 8 of SUN5, predicting the frameshift, p.(Leu143Serfs*30), and the inactivation of SUN5."
    explanation: A second family with two clear loss-of-function alleles.
  - reference: PMID:28541472
    reference_title: "Homozygous deletion of SUN5 in three men with decapitated spermatozoa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also show that the p.Gly114Arg variant has a strong inhibitory effect on splicing in HeLa cells, evidence that homozygozity for p.Gly114Arg causes acephalic spermatozoa syndrome through loss of SUN5 function."
    explanation: A variant first read as missense acts by disrupting splicing.
  - reference: PMID:29298896
    reference_title: "Mechanistic insights into acephalic spermatozoa syndrome-associated mutations in the human SUN5 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we observed that many SUN5 mutations affect the secondary structure of the protein and influence its folding and cellular localization."
    explanation: Missense variants act by misfolding and mislocalizing SUN5.
  - reference: PMID:33671757
    reference_title: "Identification and Characterization of the Most Common Genetic Variant Responsible for Acephalic Spermatozoa Syndrome in Men Originating from North Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence assays performed on sperm cells from three mutated subjects revealed a total absence of SUN5, thus demonstrating the deleterious impact of the identified variant on protein expression."
    explanation: The North African founder splice variant abolishes SUN5 in sperm.
  - reference: PMID:34159570
    reference_title: "Novel Mutation and Deletion in SUN5 Cause Male Infertility with Acephalic Spermatozoa Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results showed that SUN5 could not be detected in the patients' spermatozoa and the exogenous expression level of the mutant protein was decreased in transfected HEK-293T cells."
    explanation: Missense, splice and deletion genotypes all leave sperm without SUN5.
- name: Disrupted SUN5 Nuclear Envelope Anchoring Complex
  description: >-
    At the posterior nuclear envelope SUN5 binds partners on both sides of the
    envelope: lamin B1 inside the nucleus, and the KASH protein Nesprin3, the
    centriole-associated septin SEPTIN12, ODF1 and the linker CENTLEIN outside
    it. Cryo-electron tomography of mammalian sperm shows a regular hexagonal
    protein lattice in the nuclear envelope at the base of the head, proposed
    to be formed by these LINC complexes. Losing SUN5 dissolves this complex
    and Nesprin3 loses its posterior localization. The partner data come
    mainly from Sun5 knockout mice and transfected cells, with altered
    Nesprin3 and ODF1 staining confirmed in patient sperm.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: posterior nuclear envelope (implantation fossa)
    term:
      id: GO:0005635
      label: nuclear envelope
  downstream:
  - target: Defective Sperm Head-Tail Coupling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38870534
      reference_title: "SUN5 interacts with nuclear membrane LaminB1 and cytoskeletal GTPase Septin12 mediating the sperm head-and-tail junction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The disruption of the LaminB1/SUN5/Septin12 complex by Sun5 deficiency caused separation of the Septin12-proximal centriole from the nucleus, leading to the breakage of the head-to-tail junction."
      explanation: Loss of the SUN5-anchored complex separates the proximal centriole from the nucleus.
    - reference: PMID:33848337
      reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by SUN5 variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When gene variants resulted in a loss of SUN5, the 'triplet' structure disappears and then the head-tail junction becomes fragile, leading to the occurrence of ASS."
      explanation: Proposed model in which loss of the SUN5-Nesprin3-ODF1 complex weakens the junction.
  evidence:
  - reference: PMID:34268309
    reference_title: "SUN5 Interacting With Nesprin3 Plays an Essential Role in Sperm Head-to-Tail Linkage: Research on Sun5 Gene Knockout Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further coimmunoprecipitation (Co-IP) and immunofluorescence assays confirmed that Sun5 and Nesprin3 were indeed bona fide interaction partners that formed the linker of the nucleoskeleton and cytoskeleton (LINC) complex participating in the connection of the head and tail of spermatozoa."
    explanation: SUN5 and Nesprin3 form a LINC complex at the head-tail junction.
  - reference: PMID:34268309
    reference_title: "SUN5 Interacting With Nesprin3 Plays an Essential Role in Sperm Head-to-Tail Linkage: Research on Sun5 Gene Knockout Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nesprin3 was located posterior and anterior to the nucleus during spermiogenesis in wild-type mice, whereas it lost its localization at the implantation fossa of the posterior region in Sun5-/- mice."
    explanation: Without Sun5, Nesprin3 is lost from the posterior nuclear envelope.
  - reference: PMID:38870534
    reference_title: "SUN5 interacts with nuclear membrane LaminB1 and cytoskeletal GTPase Septin12 mediating the sperm head-and-tail junction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further studies demonstrated that SUN5 connected the nucleus by interacting with LaminB1 and connected the proximal centriole by interacting with Septin12."
    explanation: SUN5 bridges the nuclear lamina and the proximal centriole.
  - reference: PMID:34389728
    reference_title: "The missing linker between SUN5 and PMFBP1 in sperm head-tail coupling apparatus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that CENTLEIN directly interacts with both SUN5 and PMFBP1, two proteins localized in the HTCA and related with acephalic spermatozoa syndrome."
    explanation: CENTLEIN links SUN5 on the head side to PMFBP1 on the tail side.
  - reference: PMID:29298896
    reference_title: "Mechanistic insights into acephalic spermatozoa syndrome-associated mutations in the human SUN5 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that SUN5 interacts with the coupling apparatus protein DnaJ heat shock protein family (Hsp40) member B13 (DNAJB13) during spermatogenesis, and the substitutions in the SUN5 SUN domain impair its interaction with DNAJB13."
    explanation: SUN domain substitutions weaken binding to a coupling apparatus protein.
  - reference: PMID:41855266
    reference_title: "SUN5 forms a regular protein lattice reinforcing the sperm head-tail junction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By applying in situ cryoelectron tomography, we find an extensive hexagonal lattice in the nuclear envelope in this region."
    explanation: >-
      Cryo-electron tomography of isolated human, mouse and boar sperm shows a
      lattice in the posterior nuclear envelope where SUN5 sits.
- name: Defective Sperm Head-Tail Coupling
  description: >-
    The head-tail coupling apparatus assembles normally early in
    spermiogenesis, but without SUN5 it detaches with the basal plate from the
    implantation fossa as the spermatid elongates. The centrosome and coupling
    apparatus drift away from the nucleus, and head and tail separate once the
    manchette disappears. The break lies between the nucleus and the proximal
    centriole, so the headless tails keep both centrioles and the heads lack an
    implantation fossa and basal plate.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: elongating spermatid
    term:
      id: CL:0000018
      label: spermatid
  biological_processes:
  - preferred_term: spermatid development
    modifier: DECREASED
    term:
      id: GO:0007286
      label: spermatid development
  cellular_components:
  - preferred_term: sperm head-tail coupling apparatus
    term:
      id: GO:0120212
      label: sperm head-tail coupling apparatus
  downstream:
  - target: Acephalic spermatozoa
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28945193
      reference_title: "Essential role for SUN5 in anchoring sperm head to the tail."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additional studies revealed that SUN5 was located in the neck of the spermatozoa, anchoring sperm head to the tail, and without functional SUN5 the sperm head to tail coupling apparatus was detached from nucleus during spermatid elongation."
      explanation: Detachment of the coupling apparatus is the step that produces headless sperm in Sun5-null mice.
  - target: Abnormal sperm neck morphology
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28945193
    reference_title: "Essential role for SUN5 in anchoring sperm head to the tail."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ultrastructural studies of spermatogenesis in Sun5−/− male mice revealed that the sperm head-tail coupling apparatus could be successfully assembled during the early stage of spermiogenesis, but without functional SUN5, the coupling apparatus together with the basal plate disassociated from the implantation fossa during the elongation of the spermatids."
    explanation: Timing and site of the coupling failure in Sun5-null spermatids.
  - reference: PMID:34268309
    reference_title: "SUN5 Interacting With Nesprin3 Plays an Essential Role in Sperm Head-to-Tail Linkage: Research on Sun5 Gene Knockout Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, ultrastructural imaging revealed that the head-tail coupling apparatus (HTCA) and the centrosome were distant from the nucleus at steps 9-10 during spermatid elongation. With the manchette disappearing at steps 13-14, the head and the tail segregated."
    explanation: An independent knockout line shows the same coupling failure and its timing.
  - reference: PMID:28541472
    reference_title: "Homozygous deletion of SUN5 in three men with decapitated spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results, together with those of the previous study, show that SUN5 is required for the formation of the sperm head-tail junction and male fertility."
    explanation: Human genetic conclusion that SUN5 is required for the head-tail junction.
  - reference: PMID:32104701
    reference_title: "Beyond Acephalic Spermatozoa: The Complexity of Intracytoplasmic Sperm Injection Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The separation in subtype II is located between the nucleus and proximal centriole"
    explanation: >-
      Review placing SUN5-related acephalic sperm in subtype II, where the
      break lies between the nucleus and the proximal centriole.
- name: Impaired Germ Cell Nuclear mRNA Export
  description: >-
    In Sun5 knockout mice SUN5 also interacts with the mRNA export factor NXF1
    and the nucleoporin NUP93, and germ cells retain poly(A) RNA in the nucleus.
    The authors link this to lower sperm counts and motility in the mice.
    Whether it contributes to the human phenotype has not been studied, and
    reported patients are not described as oligozoospermic, so this node has no
    phenotype edge.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: male germ cell

    reference_title: "SUN5, a testis-specific nuclear membrane protein, participates in recruitment and export of nuclear mRNA in spermatogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Sun5 -/- mice, the binding of Nxf1 and Nup93 decreases due to loss of Sun5 function, and the process of submitting Nxf1-binding mRNPs to Nup93 is inhibited, resulting in abnormal spermatogenesis."
    explanation: Mouse evidence for an mRNA export role of SUN5 in germ cells.

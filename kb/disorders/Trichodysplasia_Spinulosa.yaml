name: Trichodysplasia Spinulosa
creation_date: "2026-11-25T00:00:00Z"
synonyms:
- Virus-associated trichodysplasia spinulosa
- Viral-associated trichodysplasia
- Pilomatrix dysplasia
- Cyclosporine-induced folliculodystrophy
description: >-
  Trichodysplasia spinulosa (TS) is a rare folliculocentric skin disease of
  immunosuppressed patients caused by productive infection with the
  trichodysplasia spinulosa-associated polyomavirus (TSPyV). When cell-mediated
  immune control of this near-ubiquitous virus is lost, TSPyV replicates to very
  high loads in the inner root sheath keratinocytes of hair follicles; its early
  tumour (T) antigens drive those cells through the cell cycle (large T antigen
  binds and inactivates the retinoblastoma protein; middle T antigen activates
  MEK/ERK via PP2A), producing a hyperproliferative, abnormally differentiating
  follicle that extrudes a keratin spicule instead of a normal hair shaft. The
  result is follicular papules with protruding keratin spines, centred on the
  face, with alopecia of the eyebrows and eyelashes, progressing to facial
  thickening and a leonine appearance if untreated. It is not a neoplasm;
  reducing immunosuppression or giving antivirals lowers viral load and resolves
  the lesions.
disease_term:
  preferred_term: Trichodysplasia spinulosa
  term:
    id: MONDO:0016455
    label: virus-associated trichodysplasia spinulosa
review_notes: >-
  A single named clinical entity (one virus, TSPyV; one folliculocentric
  syndrome), curated at the named-clinical-entity level with no taxonomic or
  clinical subtypes. Distinct from Merkel cell polyomavirus disease, the other
  cutaneous human polyomavirus condition, which is a carcinoma rather than a
  follicular dysplasia. TS is a hyperproliferative dysplasia driven by polyomavirus
  T antigens, not a cancer, so it is deliberately not modelled as a neoplasm and
  does not conform to viral_oncogenesis.
infectious_agent:
- name: Trichodysplasia spinulosa-associated polyomavirus
  description: >-
    A small circular double-stranded DNA polyomavirus (TSPyV, human polyomavirus
    8) whose early region encodes the large, small and middle tumour antigens
    that drive follicular-cell proliferation. It is near-ubiquitous, latently
    infecting most healthy adults, and causes disease only under immunosuppression.
  infectious_agent_term:
    preferred_term: Trichodysplasia spinulosa-associated polyomavirus
    term:
      id: NCBITaxon:862909
      label: Trichodysplasia spinulosa-associated polyomavirus
  evidence:
  - reference: PMID:20686659
    reference_title: Discovery of a new human polyomavirus associated with trichodysplasia spinulosa in an immunocompromized patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we report the identification of a new human polyomavirus in plucked facial spines of a heart transplant patient with trichodysplasia spinulosa, a rare skin disease exclusively seen in immunocompromized patients."
    explanation: Identifies TSPyV in TS facial spines as the associated agent.
  - reference: PMID:22196870
    reference_title: Trichodysplasia spinulosa is characterized by active polyomavirus infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Seroepidemiological studies indicate that TSPyV is ubiquitous and latently infects 70% of the healthy individuals."
    explanation: Establishes the near-ubiquitous, latent nature of TSPyV infection in the healthy population.
transmission:
- name: Frequent subclinical acquisition (route not established)
  description: >-
    TSPyV is acquired commonly and early in life, producing subclinical, probably
    latent infection in most people; the specific transmission route has not been
    established.
  evidence:
  - reference: PMID:20686659
    reference_title: Discovery of a new human polyomavirus associated with trichodysplasia spinulosa in an immunocompromized patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The presence of TSV also in clinically unaffected individuals suggests frequent virus transmission causing subclinical, probably latent infections."
    explanation: Establishes frequent transmission producing subclinical latent infection.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Only a few dozen clinical cases had been reported in the literature by 2020.
  evidence:
  - reference: PMID:33559344
    reference_title: "Trichodysplasia spinulosa: a comprehensive review of the disease and its treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date (until end of April 2020), 60 clinical cases and their treatments have been described in published literature"
    explanation: Gives the published case count, establishing the disease as ultra-rare.
progression:
- phase: Onset under immunosuppression
  age_range: months to about a year after immunosuppression begins
  notes: Follicular papules and spicules appear on the central face after immunosuppression is established.
  evidence:
  - reference: PMID:32995002
    reference_title: "Trichodysplasia spinulosa in a renal transplant patient: A case report of successful treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These lesions appeared 1 year after transplant and were progressing for the past 2 years."
    explanation: Illustrates onset within about a year of transplant immunosuppression and subsequent progression.
- phase: Progression to leonine facies
  notes: Untreated, confluent facial disease thickens the skin into a disfiguring leonine appearance.
  evidence:
  - reference: PMID:32748541
    reference_title: Recent developments in trichodysplasia spinulosa disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TS is characterized by uncontrolled inner root sheath cell proliferation and folliculocentric papular eruption that can progress to disfiguring leonine facies when left untreated."
    explanation: Defines the progressive course to leonine facies.
pathophysiology:
- name: Loss of Immune Control of TSPyV
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Immunosuppression (solid-organ transplantation, chemotherapy for leukaemia,
    JAK inhibitors) removes the cell-mediated control that normally keeps
    near-ubiquitous TSPyV latent, permitting productive infection. Disease
    follows either primary infection in a never-exposed host or reactivation.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Productive TSPyV Infection of Inner Root Sheath Keratinocytes
    description: Loss of immune control permits high-level viral replication in the follicle.
  evidence:
  - reference: PMID:35482045
    reference_title: "[Human polyomavirus-associated skin diseases]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In immunocompromised individuals, primary infection with trichodysplasia spinulosa-associated polyomavirus (TSPyV) can cause the very rare skin disease trichodysplasia spinulosa (TS)."
    explanation: Establishes that disease arises in the immunocompromised, when immune control is lost.
- name: Productive TSPyV Infection of Inner Root Sheath Keratinocytes
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Freed from immune control, TSPyV replicates to very high loads (about
    10^5-10^6 genome copies per cell) in the inner root sheath keratinocytes of
    hair follicles, with capsid protein expression restricted to those cells.
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  cell_types:
  - preferred_term: inner root sheath cell
    term:
      id: CL:0002560
      label: inner root sheath cell
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: T-Antigen-Driven Inner Root Sheath Hyperproliferation
    description: Viral T antigens expressed during replication drive the infected cells to proliferate.
  evidence:
  - reference: PMID:22196870
    reference_title: Trichodysplasia spinulosa is characterized by active polyomavirus infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "TSPyV DNA detection was significantly associated with disease (P<0.001), with 100% positivity of the lesional and 2% of the control samples."
    explanation: Establishes active TSPyV infection as specific to lesional skin.
  - reference: PMID:22196870
    reference_title: Trichodysplasia spinulosa is characterized by active polyomavirus infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "TSPyV VP1 protein expression was detected only in lesional TS samples, restricted to the nuclei of inner root sheath cells over-expressing trichohyalin."
    explanation: Localizes productive infection (capsid expression) to inner root sheath cells.
- name: T-Antigen-Driven Inner Root Sheath Hyperproliferation
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The TSPyV early tumour antigens drive the infected follicular cells through
    the cell cycle to create a proliferating pool that supports viral DNA
    replication. Large T antigen binds and inactivates the retinoblastoma protein
    (pRB), releasing E2F for S-phase entry; middle T antigen hyperactivates the
    MEK/ERK cascade through PP2A. Biopsies show intense Ki-67 staining
    colocalizing with large T antigen at the follicle margins.
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  cell_types:
  - preferred_term: inner root sheath cell
    term:
      id: CL:0002560
      label: inner root sheath cell
  downstream:
  - target: Dysplastic Follicle and Keratin Spicule Formation
    description: The hyperproliferating, abnormally differentiating follicle makes a spicule.
  evidence:
  - reference: PMID:31787742
    reference_title: Functional Analysis of Trichodysplasia Spinulosa-Associated Polyomavirus-Encoded Large T Antigen.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Immunoprecipitation assays revealed that TSPyV LT bound to retinoblastoma 1, but not to p53 in transfected cells."
    explanation: Establishes large T antigen binding retinoblastoma protein, the cell-cycle-releasing interaction.
  - reference: PMID:25291363
    reference_title: "Polyomavirus-associated Trichodysplasia spinulosa involves hyperproliferation, pRB phosphorylation and upregulation of p16 and p21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Intense Ki-67 staining was detected especially in the margins of TS hair follicles, which colocalized with TSPyV LT-antigen detection."
    explanation: In-patient evidence linking large T antigen to follicular-cell proliferation.
  - reference: PMID:28500640
    reference_title: Dysregulation of the MEK/ERK/MNK1 signalling cascade by middle T antigen of the trichoydsplasia spinulosa polyomavirus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We describe a novel mechanism of action for mT antigen that involves hyperactivation of MEK, ERK and MNK1."
    explanation: Establishes the middle T antigen MAPK-activating pro-proliferative branch.
- name: Dysplastic Follicle and Keratin Spicule Formation
  role: consequence
  biological_scale: TISSUE
  description: >-
    The hyperproliferating inner root sheath cells, overloaded with trichohyalin
    granules, distend and abnormally differentiate the hair follicle so that it
    extrudes a keratin spicule in place of a normal hair shaft, giving the
    characteristic follicular papules with protruding spines and the associated
    alopecia.
  biological_processes:
  - preferred_term: keratinization
    modifier: INCREASED
    term:
      id: GO:0031424
      label: keratinization
  cell_types:
  - preferred_term: inner root sheath cell
    term:
      id: CL:0002560
      label: inner root sheath cell
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Follicular papules with keratin spicules
    description: The dysplastic follicle extrudes the keratin spicule.
  - target: Alopecia of eyebrows and eyelashes
    description: Follicular dysplasia replaces hair shafts, causing hair loss.
  - target: Leonine facies
    description: Confluent facial follicular disease thickens the skin.
  - target: Pruritus
    description: The papular eruption is sometimes itchy.
  evidence:
  - reference: PMID:32748541
    reference_title: Recent developments in trichodysplasia spinulosa disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TS presents with distinct histological features including the presence of large eosinophilic, trichohyaline granules within hyperproliferating inner root sheath cells of the hair bulb."
    explanation: Describes the trichohyalin-rich hyperproliferating inner root sheath cells that form the dysplastic follicle.
  - reference: PMID:20686659
    reference_title: Discovery of a new human polyomavirus associated with trichodysplasia spinulosa in an immunocompromized patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histologically, TS is characterized by distended and abnormally maturated hair follicles with high numbers of inner root sheath cells containing excessive amounts of trichohyalin"
    explanation: Establishes the distended, abnormally differentiated follicle from which the keratin spicule arises.
phenotypes:
- name: Follicular papules with keratin spicules
  category: Clinical
  description: Folliculocentric papules extruding keratin spines (spicules), centred on the face (nose, eyebrows, ears).
  phenotype_term:
    preferred_term: Follicular papules with keratin spicules
    term:
      id: HP:0007502
      label: Follicular hyperkeratosis
  evidence:
  - reference: PMID:35482045
    reference_title: "[Human polyomavirus-associated skin diseases]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Keratin spines (spicules), mainly in the center of the face, clinically characterize this disease."
    explanation: Establishes the defining keratin-spine phenotype.
- name: Alopecia of eyebrows and eyelashes
  category: Clinical
  description: Loss of eyebrow and eyelash (and sometimes scalp) hair as follicles become dysplastic.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  evidence:
  - reference: PMID:10674379
    reference_title: Trichodysplasia spinulosa--a newly described folliculocentric viral infection in an immunocompromised host.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "an immunocompromised individual who presented with progressive alopecia, friable follicular spinous processes, and erythematous, indurated papules."
    explanation: First description documenting alopecia with the follicular spines.
- name: Leonine facies
  category: Clinical
  description: Facial skin thickening producing a disfiguring leonine appearance in advanced untreated disease.
  phenotype_term:
    preferred_term: Coarse facial features
    term:
      id: HP:0000280
      label: Coarse facial features
  evidence:
  - reference: PMID:32748541
    reference_title: Recent developments in trichodysplasia spinulosa disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "folliculocentric papular eruption that can progress to disfiguring leonine facies when left untreated."
    explanation: Establishes progression to leonine facies.
- name: Pruritus
  category: Clinical
  description: Itching accompanies the papular eruption in some patients.
  phenotype_term:
    preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:32995002
    reference_title: "Trichodysplasia spinulosa in a renal transplant patient: A case report of successful treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "some slightly pruritic pink papules on the trunk and extremities."
    explanation: Documents pruritic papules in a TS case.
treatments:
- name: Reduction of immunosuppression
  description: >-
    Reducing or modifying the patient's immunosuppressive regimen, where the
    graft or disease allows, restores immune control of TSPyV and can resolve the
    lesions.
  treatment_term:
    preferred_term: reduction of immunosuppressive therapy
  evidence:
  - reference: PMID:32995002
    reference_title: "Trichodysplasia spinulosa in a renal transplant patient: A case report of successful treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "we present a biopsy-proven trichodysplasia spinulosa case in a kidney transplant recipient who rapidly responded to a reduction of his immunosuppressive therapy."
    explanation: A case resolving on reduced immunosuppression.
- name: Topical cidofovir
  description: Topical cidofovir (1-3%) lowers viral load and clears the follicular lesions, with hair regrowth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cidofovir
      term:
        id: CHEBI:3696
        label: cidofovir anhydrous
  evidence:
  - reference: PMID:20686659
    reference_title: Discovery of a new human polyomavirus associated with trichodysplasia spinulosa in an immunocompromized patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "After topical cidofovir treatment, the lesions largely resolved coinciding with a reduction in TSV load."
    explanation: Lesions resolved with topical cidofovir as viral load fell.
  - reference: PMID:33559344
    reference_title: "Trichodysplasia spinulosa: a comprehensive review of the disease and its treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The few treatments reported in case reports to be effective include topical cidofovir 3%, reduction of immunosuppression and oral valganciclovir."
    explanation: Review naming the effective treatments, including topical cidofovir.
- name: Oral valganciclovir
  description: Oral valganciclovir is among the treatments reported effective for TS, often with reduced immunosuppression or topical cidofovir.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valganciclovir
      term:
        id: CHEBI:63635
        label: valganciclovir
  evidence:
  - reference: PMID:33559344
    reference_title: "Trichodysplasia spinulosa: a comprehensive review of the disease and its treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The few treatments reported in case reports to be effective include topical cidofovir 3%, reduction of immunosuppression and oral valganciclovir."
    explanation: Review naming oral valganciclovir among effective treatments.

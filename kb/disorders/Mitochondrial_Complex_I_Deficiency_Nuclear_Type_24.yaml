phenotypes:
- category: Metabolic
  name: Decreased Activity of Mitochondrial Complex I
  description: >-
    The only phenotype this entry curates, and the only one the accessible
    literature attributes to the NDUFB9 patient. Both the amount and the activity
    of complex I were reduced, and both were restored by wild-type NDUFB9.

    The deliberate absence of any other phenotype is explained in `notes:` and in
    an open discussion. Complex I deficiency as a class presents as Leigh
    syndrome, leukoencephalopathy, fatal infantile lactic acidosis, hypertrophic
    cardiomyopathy or exercise intolerance. The defining paper's own tables do
    record which features the NDUFB9 patient had, but that table is behind a
    paywall and not in the reference cache, so no snippet can be verified against
    it. Importing the class spectrum instead would attribute findings to this
    entity on the strength of its class membership rather than an observation.

    NDUFB9 is a nuclear-encoded, autosomally located gene at 8q13, and the entity
    sits within the nuclear-encoded complex I deficiencies, which are recessive.
    Note the distinction between what is *reported* and what is *citable here*.
    The evidence items on this block are the only snippet-verifiable support

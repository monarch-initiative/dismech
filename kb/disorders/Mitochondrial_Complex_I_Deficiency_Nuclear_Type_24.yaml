prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One patient, found in a screen of 152 patients with complex I deficiency, and
    no further case published since 2012. No population estimate exists. For
    context on the denominator rather than on this entity: complex I deficiency is
    the most frequent childhood mitochondrial disorder, accounting for up to 30
    percent of cases, and in the screen that found this patient a molecular
    diagnosis was reached in only 18 percent - so NDUFB9 is one gene among many in
    a class where most patients still go unsolved.

    One further rarity datum, recorded as an uncited lead: the deep-research
    report states that the defining paper reports no NDUFB9 mutations in an
    Australian cohort of 103 complex I deficiency patients. That is a second
    ascertained cohort returning zero, which corroborates the rarity above. It is
    second-hand within the primary report and not snippet-verifiable here, so it
    is a lead rather than evidence.
  evidence:
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."

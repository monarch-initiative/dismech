biochemical:
- name: Complex I Enzyme Activity and Assembled Amount
  notes: >-
    The diagnostic and mechanistic measurement in one. Reduced activity alone is
    the entry criterion for complex I deficiency; the informative addition in
    NDUFB9 disease is that the assembled amount falls too, which points at an
    assembly or stability defect rather than a catalytic one and is consistent
    with NDUFB9 being an accessory rather than a core subunit. The complementation
    assay - restoring both measures by expressing wild-type NDUFB9 - is what turns
    a candidate variant into a causal one, and is the model for interpreting future
    NDUFB9 variants of uncertain significance.
  evidence:
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The causal role of a new disease allele was confirmed by functional
      complementation assays.
    explanation: >-
      Describes the complementation approach used to establish causality.
genetic:
- name: NDUFB9
  gene_term:
    preferred_term: NDUFB9
    term:
      id: hgnc:7704
      label: NDUFB9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NDUFB9 sits at chromosome 8q13, within the 1-megabase region that also
    contains EYA1, and encodes an accessory subunit of the complex I membrane
    arm. Its four coding exons were characterised in 1999, when it was screened
    without result as a candidate for branchio-oto-renal syndrome in families
    without EYA1 mutations - a historical note worth keeping, because it means the
    gene was excluded from a deafness phenotype long before it was linked to
    complex I deficiency, and a reader encountering the 8q13 association should
    not infer a BOR-related phenotype.

    Under a second name, LYRM3, NDUFB9 belongs to the LYR-motif protein family and
    anchors mitochondrial acyl carrier protein to complex I. Searching the
    literature under "NDUFB9" alone will therefore miss the mechanistic work,
    which is published under LYRM3 and in a yeast system.

    Only one causal NDUFB9 allele has been reported. It IS described, just not
    quotably here: the deep-research report committed with this entry, which had
    full-text access to the defining paper, records it as c.191T>C (p.Leu64Pro),
    homozygous in two affected brothers (patients 35838 and 46986) with both
    parents heterozygous carriers. That is recorded as an uncited lead rather
    than as evidence, because the cached record for the paper is abstract-only
    and a deep-research report is a lead, not a citable source. A curator with
    journal access should promote it to a cited genetic_context.

    The same report names a second, NON-causal NDUFB9 variant worth knowing when
    interpreting a new one: c.140G>T (p.Arg47Leu), found heterozygous, which did
    not segregate with disease and was not rescued by complementation, and which
    the paper concludes is not causal. Also an uncited lead, for the same reason.

    Every statement about this disorder's genetics rests on that one family.

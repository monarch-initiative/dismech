- name: Impaired Respirasome Oligomerization
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A second, structurally motivated role that has never been tested in a
    patient. Two independent cryo-electron microscopy structures of the porcine
    heart respirasome - the 1.7-megadalton supercomplex of one complex I, a
    complex III dimer and one complex IV - place NDUFB9 among the accessory
    subunits that directly mediate the oligomerization of the individual
    complexes into the supercomplex. Losing NDUFB9 should therefore impair
    supercomplex formation as well as complex I assembly.

    This node is HYPOTHETICAL in the strict sense: it is an inference from a
    static structure to a functional consequence, with no supporting measurement
    in any NDUFB9-deficient cell. It is curated rather than omitted because it is
    a testable prediction that distinguishes this subunit from most other complex
    I accessory subunits, and because a respirasome assay is an obvious next
    experiment that nobody appears to have run.
  evidence:
  - reference: PMID:27912063
    reference_title: "Structure of Mammalian Respiratory Supercomplex I(1)III(2)IV(1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Several accessory or supernumerary subunits of CI, such as NDUFA11, NDUFB4,
      NDUFB8, and NDUFB9, directly contribute to the oligomerization of CI, CIII,
      and CIV.
    explanation: >-
      Places NDUFB9 at the interfaces that hold the respirasome together.
  - reference: PMID:27654917
    reference_title: "The architecture of the mammalian respirasome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The NDUFA11 and NDUFB9 supernumerary subunits of CI contribute to the
      oligomerization of CI and CIII.
    explanation: >-
      Independent structural determination reaching the same conclusion about
      NDUFB9's interface role.
  downstream:
  - target: Reduced Complex I Amount and Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Complex I Amount and Activity
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The measured endpoint, and the best-evidenced statement in this entry. Tagged
    MOLECULAR rather than CELLULAR on the schema's own terms: the substrate is an
    enzyme complex and the claim is that it is functionally deficient and reduced
    in abundance, which is the MOLECULAR definition verbatim ("an enzyme is
    functionally deficient ... substrate is a molecule, complex, or genetic
    element"). The measurement happens in cells, but the thing measured is the
    complex. both the amount and the activity of complex I are reduced in the
    patient, and both are restored by expressing wild-type NDUFB9 in the
    patient's fibroblasts. That both fall together is the signature of an
    assembly or stability defect rather than a catalytic one - a defective core
    subunit would be expected to reduce activity while leaving a normal or
    near-normal amount of assembled enzyme.

    Conformance note: the module pairs decreased oxidative phosphorylation with
    increased reactive oxygen species. Decreased complex I amount and activity is
    directly evidenced here; the reactive-oxygen-species arm is not measured in
    this patient and is not asserted. The module's upstream node, age-related
    mitochondrial damage and mtDNA mutation, does not apply to a primary
    nuclear-gene subunit defect, so conformance is declared at this node alone -
    which is the substitution the module's own description invites for primary
    nuclear respiratory-chain defects.

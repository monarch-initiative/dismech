name: Mitochondrial Complex I Deficiency, Nuclear Type 24
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 24 (MC1DN24) is the complex I
  deficiency caused by variants in NDUFB9, an accessory subunit of the complex I
  membrane arm. It was defined by a single family found in a 152-patient mutation
  screen - one index case with an affected brother: NDUFB9 protein was reduced,
  both the amount and the activity of complex I were reduced, and expressing
  wild-type NDUFB9 in the patient's fibroblasts restored both.

  The mechanism by which an accessory subunit loss destabilizes the whole enzyme
  is unusually well characterised for a disorder this rare, but not in human
  cells. NDUFB9 is LYRM3, a leucine-tyrosine-arginine motif protein whose job is
  to anchor a copy of mitochondrial acyl carrier protein to the membrane arm;
  work in the yeast Yarrowia lipolytica showed that this particular module is
  required for complex I assembly and stability, as distinct from the sister
  ACP-LYRM6 module required for activity. Structural work adds a second role,
  with NDUFB9 among the accessory subunits that mediate the oligomerization of
  complex I with complexes III and IV into the respirasome.

  What this entry cannot supply is the patient's clinical phenotype. The defining
  paper does report per-patient clinical data in its tables, but it is not open
  access, so no quotable passage exists in the reference cache and its abstract
  carries only the molecular and biochemical findings. No further NDUFB9 patient
  has been published in the fourteen years since. MC1DN24 is therefore a
  molecularly defined entity whose clinical description exists but is not citable
  here, and this entry curates only what can be quoted rather than importing the
  clinical spectrum of complex I deficiency as a class.
category: Mendelian

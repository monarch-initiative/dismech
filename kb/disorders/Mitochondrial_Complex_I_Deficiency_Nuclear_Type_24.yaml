experimental_models:
- name: NDUFB9 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Patient-derived fibroblasts transduced with wild-type NDUFB9. This is the
    experiment that made MC1DN24 a disease rather than a candidate association,
    and it is the only functional work published in cells from a patient with
    this disorder. Note the deliberate narrowness of that claim: NDUFB9 has been
    studied functionally in human cells elsewhere, in breast-cancer and
    adipogenesis models, but none of that work involves a patient or bears on the
    disease.
  modeled_mechanisms:
  - target: Reduced Complex I Amount and Activity
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Restoring wild-type NDUFB9 restored both the amount and the activity of
      complex I in the patient's own cells, which excludes a coincidental variant
      and localises the deficit to this gene.
    limitations: >-
      Fibroblasts are not the affected tissue, and no affected tissue was studied.
      The rescue establishes causality; it says nothing about which organ fails in
      the patient or why.
    readouts:
    - name: Complex I amount and activity after wild-type NDUFB9 expression
      target: Reduced Complex I Amount and Activity
      direction: RESTORED
      interpretation: >-
        Both measures returning towards normal on complementation is the criterion
        the authors used to call the variant causal.
      evidence:
      - reference: PMID:22200994
        reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          These features were rescued by expression of wild-type NDUFB9 in
          patient-derived fibroblasts.
        explanation: >-
          The rescue measurement underlying this readout.
    evidence:
    - reference: PMID:22200994
      reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The causal role of a new disease allele was confirmed by functional
        complementation assays.
      explanation: >-
        Establishes complementation as the method by which causality was assigned.
diagnosis:
- name: Complex I Enzyme Assay Followed by Genome-Wide Sequencing
  description: >-
    Biochemical demonstration of complex I deficiency comes first; the genetic
    diagnosis follows. The authors of the defining screen drew an explicit
    conclusion about how to reach it: candidate-gene screening is inadequate for
    this disorder class because most patients carry mutations in genes not yet
    associated with complex I function, so unbiased genome-wide strategies are
    warranted. That conclusion is what found NDUFB9's successors, and it is the
    reason a patient with unexplained complex I deficiency should have exome or
    genome sequencing rather than a panel.
  evidence:
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors conclude that the high degree of genetic heterogeneity in
      complex I disorders warrants the implementation of unbiased genome-wide
      strategies for the complete molecular dissection of mitochondrial complex I
      deficiency.
    explanation: >-
      The authors' own diagnostic recommendation, made on the basis of this
      screen's 18 percent yield.
- name: Functional Complementation for Variant Interpretation
  description: >-
    Because only one *pathogenic* NDUFB9 variant has been reported in this
    disorder, any new NDUFB9 variant found in a patient with complex I deficiency
    will be one of uncertain significance with very little disease-specific
    precedent to lean on. There is more than none, though: the defining paper
    also rejected an allele - a heterozygous c.140G>T (p.Arg47Leu) that failed
    both segregation and complementation - so there is a worked negative as well
    as a worked positive. Both are recorded as uncited leads in the genetic
    notes.
    Complementation in patient fibroblasts is the assay that resolved the first
    one and remains the practical route.
  evidence:
  - reference: PMID:22200994
    reference_title: "Mutation screening of 75 candidate genes in 152 complex I deficiency cases identifies pathogenic variants in 16 genes including NDUFB9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The causal role of a new disease allele was confirmed by functional
      complementation assays.
    explanation: >-
      Establishes complementation as the method used to interpret a novel allele
      in this gene.
differential_diagnoses:
- name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
  description: >-
    MC1DN24 is one of a large family of nuclear complex I deficiencies, and it
    cannot be separated from its siblings clinically or biochemically - only by
    genotype. The class spans 38 nuclear-encoded subunits and a growing list of
    assembly factors, and this knowledge base already carries several members
    (NDUFS8, NDUFA1, TIMMDC1). A structural distinction that may eventually
    matter: NDUFB9 is an accessory subunit whose loss reduces the assembled amount
    of complex I, whereas a core-subunit defect would be expected to reduce
    activity with the enzyme still assembled. That distinction is visible on a
    combined amount-and-activity assay but has not been shown to have any clinical
    correlate.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Causative genetic defects may involve the seven mitochondrial-encoded or 38
      nuclear-encoded subunits of the enzyme, or any of an increasing number of
      assembly factors implicated in the correct biosynthesis of complex I within
      the inner mitochondrial membrane.
    explanation: >-
      Establishes the size of the differential.
- name: Mitochondrial-DNA-encoded complex I deficiency
  description: >-
    About a quarter of complex I deficiency is caused by mitochondrial DNA
    mutations, which carry maternal inheritance, heteroplasmy and consequent
    recurrence-risk implications entirely different from a nuclear recessive
    disorder. Distinguishing them changes the counselling more than it changes the
    management.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 25% of cases have mitochondrial DNA mutations, while a further
      ∼25% have mutations in a nuclear subunit or in one of nine known assembly
      factors.
    explanation: >-
      Quantifies the mitochondrial-genome arm of the differential.
discussions:
- discussion_id: mc1dn24_clinical_phenotype_undocumented
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the clinical phenotype of MC1DN24? Fourteen years after the entity was
    defined, the primary record of it is a table in a paywalled paper, reachable
    only second-hand.
  attaches_to:
  - "pathophysiology#Reduced Complex I Amount and Activity"
  rationale: >-
    This is the gap that shapes the whole entry. MC1DN24 has an OMIM number, a
    MONDO term and a defined molecular basis, and no citable clinical
    description. The defining paper is not open access; its abstract reports that
    clinical phenotypes were documented using a standardised questionnaire but
    does not reproduce the NDUFB9 patient's, and no further NDUFB9 patient has
    been published since 2012.

    The consequence is that this entry curates exactly one phenotype - decreased
    complex I activity - and no others. That is not an oversight and should not be
    "fixed" by importing the clinical spectrum of complex I deficiency as a class.
    That class spans Leigh syndrome, leukoencephalopathy, fatal infantile lactic
    acidosis, hypertrophic cardiomyopathy and exercise intolerance; attaching any
    of those to MC1DN24 would assert something no one has observed in an NDUFB9
    patient, and a reader would have no way to tell the borrowed annotation from
    an observed one.

    Where the answer actually lives, and why it is still not curated here. Table 2
    of the defining paper carries per-patient clinical data for the NDUFB9 case.
    The paper is paywalled, the table is not in the reference cache, and the
    abstract does not reproduce it, so nothing from it can be quoted as a verified
    snippet - which is the standard this knowledge base holds evidence to.

    A note on the deep-research report committed with this entry, which did read
    that table from an image. Its first artifact listed hypertrophic
    cardiomyopathy among the findings supported for the patient, which conflicts
    with its own body recording hypertrophic cardiomyopathy and leukodystrophy as
    dashes that "should not be entered as positive findings". The report resolves
    this itself: a second artifact is captioned as superseding the first and
    aligning the phenotype rows with the directly inspected table image, and its
    row for this patient records hypertrophic cardiomyopathy as a dash. So the
    dash reading is the report's settled one, and it agrees with this entry's
    decision not to curate a cardiac phenotype.

    What that superseding artifact records POSITIVELY for this patient, and which
    belongs here as an uncited lead rather than being left out: onset under six
    months, raised blood lactate present, and a progressive course. Recording only
    the dashes would leave a reader with the impression the table yielded nothing
    for this patient, which is false - it yielded three positive findings and two
    negative ones. None is curated as a phenotype, for the reason below.

    The reason the table's contents are still not curated is not that the report
    is self-contradictory - it is that a deep-research report is a lead and the
    paper's cached record is abstract-only, so nothing from the table is
    snippet-verifiable regardless of how confident the extraction is. Recording a
    lead in prose is not asserting it; that is the same argument this entry makes
    for the genetic leads, and it applies equally here.

    The gap is cheap to close for anyone with journal access: transcribing that
    table row, or publishing a single case report, would supply it.
  proposed_experiments:
  - experiment_id: exp_mc1dn24_case_ascertainment
    name: Re-ascertain and publish the index patient's phenotype
    description: >-
      Retrieve the clinical description of the NDUFB9 patient from the original
      cohort and publish it, and query diagnostic laboratories and mitochondrial
      disease registries for further NDUFB9 cases identified by exome sequencing
      since 2012 but never reported.
- discussion_id: mc1dn24_mechanism_is_yeast_and_structure
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the yeast ACPM2-LYRM3 assembly module, and the structural role of NDUFB9
    at the respirasome interfaces, actually operate that way in human cells?
  attaches_to:
  - "pathophysiology#Loss of the NDUFB9-Acyl Carrier Protein Module"
  - "pathophysiology#Impaired Respirasome Oligomerization"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the evidence
    is not missing - it is good evidence from systems whose relationship to human
    NDUFB9 disease is untested.

    The acyl carrier protein module comes from Yarrowia lipolytica, whose complex I
    carries two ACPMs where the mammalian enzyme carries one; the assignment of
    ACPM2-LYRM3 to assembly and stability and ACPM1-LYRM6 to activity is a
    property of that two-ACPM architecture, and its transfer to a single-ACPM
    enzyme is an assumption. The prediction it generates - that NDUFB9 loss should
    cost complex I amount rather than only activity - does match what was measured
    in the patient, which is encouraging but is a single point of agreement.

    The respirasome role is weaker still: two cryo-electron microscopy structures
    of porcine heart supercomplex place NDUFB9 at the interfaces between complexes
    I, III and IV, and the functional consequence of removing it has never been
    measured in any system. A static structure showing a subunit at an interface
    is not evidence that losing the subunit disrupts the interface.

    Both nodes are marked HYPOTHETICAL for these reasons, and the edges from them
    to the measured cellular endpoint are typed as having unknown intermediates.
  proposed_experiments:
  - experiment_id: exp_mc1dn24_human_acp_anchoring
    name: Test ACP anchoring in NDUFB9-deficient human cells
    description: >-
      Determine, in NDUFB9-knockout or patient human cells, whether mitochondrial
      acyl carrier protein remains associated with the complex I membrane arm, and
      whether reducing acyl-chain loading on ACP phenocopies NDUFB9 loss. This
      tests the yeast module assignment in the single-ACPM mammalian enzyme.
  - experiment_id: exp_mc1dn24_respirasome_assay
    name: Blue-native analysis of supercomplex formation in NDUFB9 deficiency
    description: >-
      Compare respirasome assembly by blue-native gel electrophoresis and
      in-gel activity in NDUFB9-deficient against control cells, to convert the
      structural inference into a measurement. If supercomplex formation is
      disproportionately affected relative to free complex I, that would separate
      NDUFB9 from accessory subunits with no interface role.
notes: >-
  What this entry deliberately does not contain. The `phenotypes:` block holds a
  single entry - decreased activity of mitochondrial complex I - and there is no
  `progression:` and no `treatments:` block, because no accessible source reports
  any *quotable* clinical finding, course or therapy for MC1DN24. The single
  defining paper is not open access, its abstract gives only molecular and
  biochemical findings, and no further NDUFB9 patient has been published since
  2012. Its Table 2 does hold per-patient clinical data, but that table is not in
  the reference cache and nothing in it can be verified as a snippet. Do not fill
  these gaps from the complex I deficiency literature as a class either: an
  annotation borrowed from Leigh syndrome or from infantile lactic acidosis would
  be indistinguishable in the exported graph from one observed in an NDUFB9
  patient. The gap, and the specific place the answer sits, are recorded in an
  open discussion instead.

  Where the mechanism comes from. Only two things are measured in the patient:
  reduced NDUFB9 protein, and reduced complex I amount and activity restored by
  wild-type NDUFB9. Everything between them - the acyl carrier protein anchoring
  module, the respirasome interface role - is inferred from a yeast enzyme with a
  different ACP stoichiometry and from static porcine structures. Those two nodes
  are marked HYPOTHETICAL, their outgoing edges are typed
  INDIRECT_UNKNOWN_INTERMEDIATES, and the mismatch is curated as a
  HUMAN_MODEL_MISMATCH discussion rather than smoothed over.

  GeneReviews was checked and deliberately not tagged. `PMID:26425749` (Nuclear
  Gene-Encoded Leigh Syndrome Spectrum Overview) is the chapter the sibling
  entries MC1DN2 and MC1DN6 tag; MC1DN12 and MC1DN31 do not, so repo practice is
  split. Two reasons not to here: its cached record is a purpose statement naming
  no genes and no clinical content, so there is nothing to mine without producing
  a title-as-finding snippet; and MC1DN24 has no documented Leigh phenotype, so
  tagging a Leigh overview would import exactly the class membership this entry
  declines to assume. Recorded so the absence reads as a decision, not an
  oversight.

  Search under LYRM3 as well as NDUFB9. The mechanistic literature on this protein
  is published under its LYR-motif family name, and a search restricted to NDUFB9
  returns mostly cancer-transcriptomics papers in which the gene appears as one
  member of an expression signature. None of those bear on this disorder.

  The 8q13 map position is a historical trap. NDUFB9 lies in the branchio-oto-renal
  syndrome region and was screened as a BOR candidate in 1999 without result. That
  negative is curated in the genetic section so a reader who encounters the
  chromosomal association does not infer a deafness or renal phenotype for this
  disorder.

      explanation: >-
        Reports the sphingolipid and myelination changes together in mouse
        cortex.
- name: Increased Oligodendrogenesis and Myelination
  description: >-
    Dip2c mutant mouse cortex shows increased oligodendrocyte generation and
    myelination alongside the sphingolipid change. Homozygous mutants were
    more severely affected than heterozygotes, which showed only mild
    cognitive impairment. Not yet examined in patients.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: INCREASED
    term:
      id: GO:0042552
      label: myelination
  evidence:
  - reference: PMID:41054236
    reference_title: DIP2C Deficiency Leads to Abnormal Sphingolipid Metabolism in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings identify DIP2C as a critical regulator of
      myelination and sphingolipid metabolic homeostasis during
      neurodevelopment, offering novel insight into neurodevelopmental
      disorders.
    explanation: The mouse study concludes that DIP2C regulates myelination.
  downstream:
  - target: Mild intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not shown: heterozygous Dip2c mice have mild cognitive
      impairment, but the link from the myelination change to cognition has
      not been tested.
    evidence:
    - reference: PMID:41054236
      reference_title: DIP2C Deficiency Leads to Abnormal Sphingolipid Metabolism in Mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mutant mice exhibited weight loss, hyperlocomotion,
        cognitive impairment, and abnormal lipid metabolism, whereas
        heterozygous mutant mice displayed only mild cognitive impairment,
        recapitulating the dosage-sensitive phenotype observed in human 10p15.3
        microdeletion syndrome.
      explanation: >-
        Heterozygous mice, the genotype matching the human disease, show mild
        cognitive impairment alongside the lipid phenotype.
- name: Altered Brain Neurotransmitter Receptor Gene Expression
  description: >-
    Brain RNA-seq of homozygous Dip2c knockout mice found 838 differentially expressed
    genes, enriched for memory and neuroactive ligand-receptor interaction and
    including several glutamate and GABA receptor subunit genes. How DIP2C
    regulates these genes, and whether the same changes occur in heterozygous
    human brain, is unknown.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:32707302
    reference_title: Brain transcriptome study through CRISPR/Cas9 mediated mouse Dip2c gene knock-out.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In total, 838 genes were found differentially regulated, with 252 up and
      586 down.
    explanation: >-
      Quantifies the brain transcriptional change caused by Dip2c loss in mice.
- name: Impaired Cardiac Looping
  description: >-
    Morpholino knockdown of zebrafish dip2ca disrupts cardiac looping, with a
    linear heart tube, pericardial oedema and arrhythmia, and is partly rescued
    by wild-type dip2ca mRNA. The study proposed DIP2C as the gene behind
    congenital heart defects in 10p15.3 microdeletions; structural heart
    defects also occur in a minority of patients with intragenic DIP2C
    variants.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: heart looping
    modifier: DECREASED
    term:
      id: GO:0001947
      label: heart looping
  evidence:
  - reference: PMID:40915331
    reference_title: The deficiency of DIP2C leads to congenital heart defects in patients with 10p15.3 microdeletion syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Coinjection of wild-type dip2ca mRNA with dip2ca-MO partially rescued
      these detects.
    explanation: >-
      Partial rescue by wild-type mRNA indicates the cardiac defects are
      specific to dip2ca knockdown.

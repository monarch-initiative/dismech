name: DIP2C-related Developmental Disorder With Speech Delay
creation_date: '2026-10-16T22:15:00Z'
category: Mendelian
synonyms: []
description: >-
  DIP2C-related developmental disorder with speech delay is a dominant
  neurodevelopmental disorder caused by heterozygous variants in DIP2C, most of
  them predicted loss-of-function alleles (nonsense, frameshift and canonical
  splice-site variants). The defining cohort of 23 individuals all had
  developmental delay that falls hardest on expressive language and speech
  articulation, usually with mild developmental delay or intellectual disability
  and with measured IQ ranging into the typical range. Behavioural differences
  (hyperactivity and attention problems, anxiety), autism, hypotonia, feeding
  difficulties, seizures, and minor facial anomalies such as a high anterior
  hairline are variable; structural cardiac defects occur in a minority. In
  about half of the patients the variant was inherited, often from a parent
  with milder speech or learning difficulties, so expressivity is variable and
  penetrance may be incomplete. DIP2C encodes
  disco-interacting protein 2 homolog C, which carries a DMAP1-binding domain and
  acyl-CoA synthetase / AMP-binding domains and is expressed most highly in the
  prenatal neocortex. Its molecular function in the human brain is not
  established; current mechanistic evidence comes from mouse knockouts
  (altered cortical sphingolipid metabolism, myelination and neurotransmitter
  receptor gene expression) and zebrafish knockdown (cardiac looping defects).
  DIP2C lies next to ZMYND11 at 10p15.3, and contiguous 10p15.3 microdeletions
  removing both genes are a related but separate condition.
disease_term:
  preferred_term: DIP2C-related developmental disorder with speech delay
  term:
    id: MONDO:0700356
    label: DIP2C-related developmental disorder with speech delay
parents:
- Neurodevelopmental Disorder
notes: >-
  No GeneReviews chapter covers DIP2C; the Bookshelf index was checked with
  `just check-genereviews`. The 10p15.3 microdeletion literature (for example
  PMID:22847950) is cited only for context, because those deletions usually
  remove ZMYND11 as well, and ZMYND11 haploinsufficiency is itself an
  established cause of intellectual disability; phenotypes from deletion
  carriers are not attributed to DIP2C in this entry.
inheritance:
- name: Autosomal dominant with variable expressivity
  description: >-
    Heterozygous DIP2C variants arise de novo or are inherited from a parent.
    In the defining cohort, ten patients had de novo variants and nine had
    inherited ones, several of whom had milder speech or learning difficulties,
    which the authors interpret as variable expressivity and incomplete
    penetrance.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38421105
    reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight patients had de novo variants predicting loss-of-function in the
      DIP2C gene, two patients had de novo missense variants, three had
      paternally inherited loss of function variants and six had maternally
      inherited loss-of-function variants, while inheritance was unknown for
      four variants.
    explanation: >-
      Heterozygous variants arising de novo or transmitted from either parent
      establish dominant inheritance.
- name: Variable expressivity and incomplete penetrance
  description: >-
    Inherited variants were transmitted from parents with milder features, and
    other variants or copy-number changes in some
    probands may modify the phenotype.
  inheritance_term:
    preferred_term: incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:
  - reference: PMID:38421105
    reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several of the patients in this paper had inherited DIP2C variants with
      variable penetrance, and the clinical manifestations associated with this
      gene are likely to prove variable, with incomplete penetrance for some
      individuals that suggest a role for genetic modifiers or environmental
      influences.
    explanation: >-
      The authors state incomplete penetrance and variable expressivity for
      inherited DIP2C variants.
pathophysiology:
- name: DIP2C Haploinsufficiency
  description: >-
    Most disease alleles are nonsense, frameshift or canonical splice-site
    variants predicted to undergo nonsense-mediated decay or to disrupt
    splicing, so the proposed lesion is loss of one functional DIP2C copy. Two
    de novo missense variants were also reported and their effect is unknown.
    DIP2C is expressed most highly in the human neocortex in mid-gestation,
    which places the dosage loss in the period of cortical development.
    Across the conserved DIP2 family, the acyl-CoA synthetase (fatty
    acyl-AMP ligase-like) domains regulate a specific subset of
    diacylglycerols; whether DIP2C does this in human neurons has not been
    tested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DIP2C
    term:
      id: hgnc:29150
      label: DIP2C
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:38421105
    reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of the DIP2C variants were de novo loss of function variants,
      suggesting haploinsufficiency as a mechanism, and several variants were
      inherited with variable expressivity.
    explanation: >-
      The recurrence of de novo loss-of-function alleles is the basis for
      haploinsufficiency as the disease mechanism.
  - reference: PMID:38421105
    reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Brainspan analysis showed elevated DIP2C expression in the human
      neocortex at 10-24 weeks after conception.
    explanation: >-
      Bioinformatic expression analysis places DIP2C activity in the prenatal
      neocortex, consistent with a neurodevelopmental effect of reduced dosage.
  - reference: PMID:35766356
    reference_title: DIP2 is a unique regulator of diacylglycerol lipid homeostasis in eukaryotes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we uncover the role of a conserved eukaryotic protein family,
      DISCO-interacting protein 2 (DIP2) as a homeostatic regulator of a
      chemically distinct subset of DAGs using yeast, fly, and mouse models.
    explanation: >-
      Assigns a lipid-regulatory function to the DIP2 family that DIP2C
      belongs to; indirect for human DIP2C because the work is mainly in yeast.
  downstream:
  - target: Expressive language delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38421105
      reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

  - target: Increased Cortical Sphingolipid Synthesis
    causal_link_type: DIRECT
    description: >-
      In Dip2c mutant mice, loss of Dip2c changes cortical sphingolipid
      metabolism and myelination. The human relevance of this step is
      inferred from the mouse.
    evidence:
    - reference: PMID:41054236
      reference_title: DIP2C Deficiency Leads to Abnormal Sphingolipid Metabolism in Mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pathway enrichment analysis revealed a significant upregulation of
        sphingolipid metabolism in the cortex, accompanied by elevated
        oligodendrogenesis and myelination.
      explanation: >-
        Shows in mouse that Dip2c deficiency produces the sphingolipid and
        myelination change; indirect for the human heterozygous disease.
  - target: Altered Brain Neurotransmitter Receptor Gene Expression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32707302
      reference_title: Brain transcriptome study through CRISPR/Cas9 mediated mouse Dip2c gene knock-out.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        DEGs Grid2ip, Grin2a, Grin2c, Grm4, Gabbr2, Gabra5, Gabre, Gabrq,
        Gabra6 and Gabrr2 are among the highly regulated genes by Dip2C.
      explanation: >-
        Brain RNA-seq of a Dip2c knockout mouse identifies glutamate and GABA
        receptor genes among those most changed by loss of Dip2c.
  - target: Impaired Cardiac Looping
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40915331
      reference_title: The deficiency of DIP2C leads to congenital heart defects in patients with 10p15.3 microdeletion syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MO-mediated knockdown of dip2ca in zebrafish resulted in developmental
        defects consistent with the range of 10p15.3-associated human
        phenotypes include decreased body length, craniofacial malformations,
        and heart defects, including pericardial edema, a linear heart tube,
        looping defects, and arrhythmia.
      explanation: >-
        Knockdown of the zebrafish orthologue causes cardiac looping defects,
        linking reduced DIP2C dosage to abnormal heart development.
- name: Increased Cortical Sphingolipid Synthesis
  description: >-
    In Dip2c mutant mouse cortex, expression of a key subunit of serine
    palmitoyltransferase, the rate-limiting enzyme of sphingolipid synthesis,
    is raised and sphingolipid metabolism is upregulated. This fits the
    acyl-CoA synthetase domain of DIP2C but has not been examined in patients.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
  evidence:
  - reference: PMID:41054236
    reference_title: DIP2C Deficiency Leads to Abnormal Sphingolipid Metabolism in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This effect was likely due to increased expression of a key subunit of
      serine palmitoyltransferase, the rate-limiting enzyme in sphingolipid
      biosynthesis.
    explanation: >-
      Identifies the proposed enzymatic basis of the sphingolipid change in
      Dip2c mutant mouse cortex.
  downstream:
  - target: Increased Oligodendrogenesis and Myelination
    causal_link_type: DIRECT
    description: >-
      The authors attribute the myelination change to the raised sphingolipid

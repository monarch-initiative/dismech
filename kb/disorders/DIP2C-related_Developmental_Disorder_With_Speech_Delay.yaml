animal_models:
- name: Dip2c mutant mouse (heterozygous and homozygous)
  species: Mouse
  genotype: Dip2c(+/-) and Dip2c(-/-)
  publication: PMID:41054236
  description: >-
    Germline Dip2c mutant mice studied at both dosages. Homozygotes show weight
    loss, hyperlocomotion, cognitive impairment and abnormal lipid metabolism;
    heterozygotes, the genotype matching the human disease, show only mild
    cognitive impairment.
  modeled_mechanisms:
  - target: Increased Oligodendrogenesis and Myelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Source of the cortical sphingolipid and myelination finding.
    limitations: >-
      The abstract does not say which genotype carried the lipidomic and
      myelination changes, and no patient tissue or biomarker data test them,
      so it is unknown whether the change occurs in heterozygous humans.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse cortex and myelination timing differ from human, and the
        defining human phenotype, expressive language, has no mouse
        counterpart.
    evidence:
    - reference: PMID:41054236
      reference_title: DIP2C Deficiency Leads to Abnormal Sphingolipid Metabolism in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pathway enrichment analysis revealed a significant upregulation of
        sphingolipid metabolism in the cortex, accompanied by elevated
        oligodendrogenesis and myelination.
      explanation: The model shows the sphingolipid and myelination change.
- name: Dip2c CRISPR knockout mouse (Dip2c delta 2bp)
  species: Mouse
  genotype: Dip2c delta 2bp frameshift
  publication: PMID:32707302
  description: >-
    CRISPR/Cas9 Dip2c knockout used for brain RNA-seq. The defining human
    cohort paper reports that the RNA-seq compared homozygous Dip2c delta 2bp
    male mice at postnatal day 10 with wild-type controls.
  modeled_mechanisms:
  - target: Altered Brain Neurotransmitter Receptor Gene Expression
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      Transcriptome only, with no behavioural or electrophysiological readout,
      in homozygous knockouts rather than the heterozygous state of patients.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Patients lose one DIP2C copy; the mice lack both, so the receptor gene
        changes may be larger than, or absent from, the heterozygous human
        brain.
    evidence:
    - reference: PMID:32707302
      reference_title: Brain transcriptome study through CRISPR/Cas9 mediated mouse Dip2c gene knock-out.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In total, 838 genes were found differentially regulated, with 252 up
        and 586 down.
      explanation: Brain RNA-seq of the knockout measures the transcriptional change.
- name: dip2ca morpholino knockdown zebrafish
  species: Zebrafish
  genotype: dip2ca morpholino knockdown
  publication: PMID:40915331
  description: >-
    Transient antisense morpholino knockdown of the zebrafish DIP2C orthologue
    dip2ca, with partial rescue by wild-type mRNA.
  modeled_mechanisms:
  - target: Impaired Cardiac Looping
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Morpholino knockdown is transient and prone to off-target effects, and
      zebrafish have duplicated dip2c paralogues. The study was motivated by
      10p15.3 microdeletions, not intragenic variants.
    evidence:
    - reference: PMID:40915331
      reference_title: The deficiency of DIP2C leads to congenital heart defects in patients with 10p15.3 microdeletion syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MO-mediated knockdown of dip2ca in zebrafish resulted in developmental
        defects consistent with the range of 10p15.3-associated human
        phenotypes include decreased body length, craniofacial malformations,
        and heart defects, including pericardial edema, a linear heart tube,
        looping defects, and arrhythmia.
      explanation: Knockdown produces cardiac looping defects.
discussions:
- discussion_id: dip2c_molecular_function_gap
  prompt: >-
    What does DIP2C do in the developing human cortex, and does halving it
    change sphingolipid metabolism or myelination in patients as it does in
    mice?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Increased Cortical Sphingolipid Synthesis
  - pathophysiology#Increased Oligodendrogenesis and Myelination
  - pathophysiology#Altered Brain Neurotransmitter Receptor Gene Expression
  rationale: >-
    Every mechanistic step after the loss of one DIP2C copy is known only from
    mouse knockouts or zebrafish knockdown. Homozygous mice were more severely
    affected than heterozygotes, while patients are heterozygous, and the
    defining human feature, expressive language and articulation, has no
    direct rodent counterpart. Neither the lipid change nor the receptor gene
    expression change has been measured in patient cells or brain imaging.
- discussion_id: dip2c_penetrance_gap
  prompt: >-
    How penetrant are inherited DIP2C loss-of-function variants, and what
    explains the milder or absent features in transmitting parents?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Variable expressivity and incomplete penetrance
  rationale: >-
    Nine of the 19 patients with known inheritance in the defining cohort had
    an inherited variant, several from parents with milder speech or learning
    difficulties, and
    some probands carried a second variant or copy-number change. Penetrance
    has not been estimated in an unselected population.

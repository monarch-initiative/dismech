genetic:
- name: DIP2C
  gene_term:
    preferred_term: DIP2C
    term:
      id: hgnc:29150
      label: DIP2C
  presence: PRESENT
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous DIP2C variants are the defining cause. In the 23-patient
    cohort the variants were nonsense, frameshift and canonical splice-site
    alleles predicted to cause loss of function, plus two de novo missense
    variants; ten patients had de novo variants and nine had inherited ones. Earlier
    reports include a de novo canonical splice-acceptor variant in a child
    ascertained for childhood apraxia of speech (later included as patient 14
    of the 23-patient cohort), and a de novo splice-site variant in an infant with focal
    epilepsy. A high-impact DIP2C frameshift was also prioritized in a
    Swedish cohort with severe developmental language disorder. A 67.6 kb mosaic deletion removing at least two DIP2C exons, classed as a
    variant of uncertain significance, was found in two children with
    hemiplegic cerebral palsy, one of whom also had a middle cerebral artery
    infarction. No ClinGen gene-disease validity record exists
    for DIP2C.
  evidence:
  - reference: PMID:38421105
    reference_title: De novo variants predicting haploinsufficiency for DIP2C are associated with expressive speech delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the cases presented herein, we provide phenotypic and genotypic data
      supporting the association between loss-of-function variants in DIP2C
      with a neurocognitive phenotype.
    explanation: The defining cohort links DIP2C loss-of-function variants to the disorder.
  - reference: PMID:38300321
    reference_title: Whole exome sequencing and polygenic assessment of a Swedish cohort with severe developmental language disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also prioritized additional variants for future studies for their
      role in DLD, including high-impact variants in PARD3 and DIP2C.
    explanation: >-
      A high-impact DIP2C variant in a proband with severe developmental
      language disorder, prioritized but not yet classed as diagnostic.
  - reference: PMID:28771244
    reference_title: De novo and rare inherited copy-number variations in the hemiplegic form of cerebral palsy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cases F and G each have a de novo 67.6 kb deletion impacting at least
      two exons in the DIP2C gene (Figure 1).
    explanation: >-
      Intragenic DIP2C deletions in two children with hemiplegic cerebral
      palsy, one with ADHD, are consistent with partial loss of DIP2C
      contributing to neurodevelopmental disease. Indirect because the
      authors classed both as variants of uncertain significance, the
      deletion is reported as mosaic, and one child also had a middle cerebral
      artery infarction that could explain the hemiplegia.

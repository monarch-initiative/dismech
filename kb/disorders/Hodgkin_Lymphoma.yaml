diagnosis:
- name: Open Lymph Node Biopsy
  description: >-
    Tissue diagnosis is preferably established with open lymph node biopsy.
  evidence:
  - reference: PMID:31894937
    reference_title: "Lymphoma: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An open lymph node biopsy is preferred for diagnosis."
    explanation: States that open lymph node biopsy is the preferred diagnostic procedure for lymphoma.
- name: Immunophenotyping to distinguish CHL from NLPHL
  description: >-
    Classic Hodgkin lymphoma has a characteristic
    CD30+/CD15+/PAX5+ CD45- immunophenotype; a subset shows atypical B-lineage
    marker expression. NLPHL, by contrast, retains B-lineage markers (e.g.
    CD20), which is central to separating the two entities.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  markers: CD30, CD15, PAX5, CD45, CD20
  evidence:
  - reference: PMID:26839195
    reference_title: "Atypical Phenotypes in Classical Hodgkin Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Classical Hodgkin lymphoma has a characteristic immunophenotype in most cases, with expression of CD30, CD15, and PAX-5, and absence of CD45 and T-lineage markers."
    explanation: Supports the diagnostic immunophenotypic profile that anchors classic Hodgkin lymphoma and, by its inverse, the B-lineage phenotype used to identify NLPHL.
- name: PET/CT-Based Lugano Staging
  description: >-
    PET/CT is integrated into Lugano staging to define disease extent and guide
    treatment selection.
  evidence:
  - reference: PMID:31894937
    reference_title: "Lymphoma: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The Lugano classification system incorporates symptoms and the extent of the disease as shown on positron emission tomography/computed tomography to stage lymphoma, which is then used to determine treatment."
    explanation: Supports PET/CT-based Lugano staging as a standard part of lymphoma diagnosis and management.
differential_diagnoses:
- name: Primary mediastinal large B-cell lymphoma
  disease_term:
    preferred_term: primary mediastinal large B-cell lymphoma
    term:
      id: MONDO:0020323
      label: primary mediastinal large B-cell lymphoma
  description: >-
    PMBCL shares B-cell lineage features and overlapping immune-evasion biology
    (including 9p24.1/PD-L1 and CIITA lesions) with classic Hodgkin lymphoma,
    especially in mediastinal presentations, and lies on a biological continuum
    with it.
  distinguishing_features:
  - PMBCL typically presents as a rapidly enlarging anterior mediastinal mass with preserved B-cell surface marker expression.
  - Classic Hodgkin lymphoma is defined by Hodgkin/Reed-Sternberg cells in an inflammatory background rather than a diffuse large B-cell phenotype.
  evidence:
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, recurrent cHL alterations, including B2M, TNFAIP3, STAT6, GNA13, and XPO1 mutations and 2p/2p15, 6p21.32, 6q23.3, and 9p/9p24.1 copy number alterations, were also identified in >20% of primary mediastinal B-cell lymphomas, highlighting shared pathogenetic mechanisms in these diseases."
    explanation: Supports the shared pathogenetic mechanisms that place PMBCL as a key biological differential of classic Hodgkin lymphoma.
prevalence:
- population: United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.3
  rate_low: 2.2
  rate_high: 2.4
  notes: >-
    United States age-adjusted incidence rate (AAIR) for Hodgkin lymphoma,
    ~2.3 per 100,000 population, consistent with SEER Cancer Stat Facts
    (~2.5 per 100,000 per year).
  evidence:
  - reference: PMID:30978153
    reference_title: "Non-Hodgkin Lymphoma in the Middle East Is Characterized by Low Incidence Rates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HL AAIR was 1.8 (1.6 to 2.0) for Iraq, 1.8 (1.4 to 2.2) for Jordan, 2.1 (1.9 to 2.2) for Saudi Arabia, and 2.3 (2.2 to 2.4) for the United States"
    explanation: Reports the United States age-adjusted Hodgkin lymphoma incidence rate as 2.3 per 100,000 population.
genetic:
- name: TNFAIP3
  association: Somatic Loss-of-Function Mutation
  gene_term:
    preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  notes: >-
    TNFAIP3 encodes the NF-kappaB negative regulator A20. Destructive somatic
    lesions contribute to constitutive NF-kappaB activation in HRS cells (classic HL).
  evidence:
  - reference: PMID:27221964
    reference_title: "NF-κB deregulation in Hodgkin lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This includes interaction with other cells in the lymphoma microenvironment through CD30, CD40, BCMA and other receptors, but also recurrent somatic genetic lesions in various factors of the NF-κB pathway, including destructive mutations in negative regulators of NF-κB signaling (e.g. TNFAIP3, NFKBIA), and copy number gains of genes encoding positive regulators (e.g. REL, MAP3K14)."
    explanation: Identifies TNFAIP3 as a recurrently mutated negative regulator of NF-kappaB signaling in Hodgkin lymphoma.
- name: B2M
  association: Somatic Mutation
  gene_term:
    preferred_term: B2M
    term:
      id: hgnc:914
      label: B2M
  notes: >-
    B2M mutations disrupt MHC class I antigen presentation and contribute to
    immune evasion by HRS cells (classic HL).
  evidence:
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, recurrent cHL alterations, including B2M, TNFAIP3, STAT6, GNA13, and XPO1 mutations and 2p/2p15, 6p21.32, 6q23.3, and 9p/9p24.1 copy number alterations, were also identified in >20% of primary mediastinal B-cell lymphomas, highlighting shared pathogenetic mechanisms in these diseases."
    explanation: Identifies recurrent B2M mutations among the characteristic immune-evasion lesions of classic Hodgkin lymphoma.
- name: 9p24.1 Copy Gain
  association: Somatic Copy-Number Gain
  notes: >-
    Recurrent copy gain of the 9p24.1 locus increases PD-1 ligand expression and
    is a hallmark of classic Hodgkin lymphoma immune evasion.
  evidence:
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRS cells exhibit near-universal somatic copy gains of chromosome 9p/9p24.1, which increase expression of the programmed cell death protein 1 (PD-1) ligands."
    explanation: Supports recurrent 9p24.1 copy gain as a defining genetic immune-evasion lesion in classic Hodgkin lymphoma.
treatments:
- name: ABVD-Based Chemotherapy
  description: >-
    Combination chemotherapy with ABVD remains a standard systemic treatment
    backbone for Hodgkin lymphoma.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: doxorubicin
      term:
        id: CHEBI:28748
        label: doxorubicin
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: vinblastine
      term:
        id: CHEBI:27375
        label: vincaleukoblastine
    - preferred_term: dacarbazine
      term:
        id: CHEBI:4305
        label: dacarbazine
  regimen_term:
    preferred_term: ABVD regimen
    term:
      id: NCIT:C9509
      label: ABVD Regimen
  evidence:
  - reference: NCIT:C411
    reference_title: "Dacarbazine (NCIT)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dacarbazine | Accepted_Therapeutic_Use_For | - | - | Carcinoid cancer; Hodgkins disease; Islet cell carcinoma; Melanoma; Neuroblastoma; Soft tissue sarcoma"
    explanation: >-
      NCI Thesaurus asserts accepted therapeutic use of dacarbazine for Hodgkin's
      disease; it is the dacarbazine component of the ABVD regimen.
  - reference: PMID:31894937
    reference_title: "Lymphoma: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hodgkin lymphoma is treated with combined chemotherapy with ABVD (doxorubicin, bleomycin, vinblastine, and dacarbazine), Stanford V (a chemotherapy regimen consisting of mechlorethamine, doxorubicin, vinblastine, vincristine, bleomycin, etoposide, and prednisone), or BEACOPP (bleomycin, etoposide, doxorubicin, cyclophosphamide, vincristine, procarbazine, and prednisone) with radiotherapy."
    explanation: Identifies ABVD-containing combination chemotherapy as a standard treatment approach for Hodgkin lymphoma.

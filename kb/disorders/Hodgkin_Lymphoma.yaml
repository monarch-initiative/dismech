    reference_title: "Lymphoma: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hodgkin lymphoma is treated with combined chemotherapy with ABVD (doxorubicin, bleomycin, vinblastine, and dacarbazine), Stanford V (a chemotherapy regimen consisting of mechlorethamine, doxorubicin, vinblastine, vincristine, bleomycin, etoposide, and prednisone), or BEACOPP (bleomycin, etoposide, doxorubicin, cyclophosphamide, vincristine, procarbazine, and prednisone) with radiotherapy."
    explanation: States that radiotherapy is used in combination treatment regimens for Hodgkin lymphoma.
- name: Brentuximab Vedotin
  description: >-
    CD30-directed antibody-drug conjugate therapy, active in classic Hodgkin
    lymphoma (which expresses CD30), often combined with chemotherapy.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: brentuximab vedotin
      term:
        id: NCIT:C66944
        label: Brentuximab Vedotin
  evidence:
  - reference: PMID:39039881
    reference_title: "[Analysis of 10 cases of brentuximab vedotin combined with chemotherapy in the treatment of children with refractory and or relapsed classic Hodgkin lymphoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brentuximab vedotin has demonstrated efficacy and a tolerable safety profile in the treatment of refractory and relapsed CD30-positive Hodgkin's lymphoma in children."
    explanation: Supports brentuximab vedotin as an active CD30-targeted therapy in relapsed or refractory classic Hodgkin lymphoma.
- name: PD-1 Blockade (Nivolumab)
  description: >-
    PD-1 blockade is an established option in previously treated classic Hodgkin
    lymphoma and is tightly aligned to the disease's 9p24.1-driven checkpoint
    biology.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
  evidence:
  - reference: clinicaltrials:NCT02181738
    reference_title: "Non-Comparative, Multi-Cohort, Single Arm, Open-Label, Phase 2 Study of Nivolumab (BMS-936558) in Classical Hodgkin Lymphoma (cHL) Subjects"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The purpose of this study is to evaluate the efficacy and safety of Nivolumab in previously treated (cohorts, A, B & C) or newly diagnosed (cohort D) classical Hodgkin Lymphoma participants.
    explanation: Supports nivolumab as an active therapeutic strategy in classical Hodgkin lymphoma.
  target_mechanisms:
  - target: PD-1 Ligand-Mediated Immune Evasion
    treatment_effect: INHIBITS
    description: >-
      PD-1 blockade counteracts 9p24.1-driven checkpoint-ligand-mediated
      suppression of anti-tumor T-cell activity in classic Hodgkin lymphoma.
    evidence:
    - reference: clinicaltrials:NCT02181738
      reference_title: "Non-Comparative, Multi-Cohort, Single Arm, Open-Label, Phase 2 Study of Nivolumab (BMS-936558) in Classical Hodgkin Lymphoma (cHL) Subjects"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The purpose of this study is to evaluate the efficacy and safety of Nivolumab in previously treated (cohorts, A, B & C) or newly diagnosed (cohort D) classical Hodgkin Lymphoma participants.
      explanation: The trial objective supports nivolumab targeting the PD-1 axis that drives immune evasion in classical Hodgkin lymphoma.
clinical_trials:
- name: NCT02181738
  phase: PHASE_II
  status: COMPLETED
  description: >-
    CheckMate 205 - a non-comparative, multi-cohort, single-arm, open-label
    Phase 2 study of nivolumab (anti-PD-1) in classical Hodgkin lymphoma,
    including previously treated (cohorts A, B, C) and newly diagnosed (cohort D)
    participants. Establishes PD-1 blockade activity that leverages the disease's
    9p24.1-driven PD-1 ligand overexpression.
  target_phenotypes:
  - preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: clinicaltrials:NCT02181738
    reference_title: "Non-Comparative, Multi-Cohort, Single Arm, Open-Label, Phase 2 Study of Nivolumab (BMS-936558) in Classical Hodgkin Lymphoma (cHL) Subjects"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The purpose of this study is to evaluate the efficacy and safety of Nivolumab in previously treated (cohorts, A, B & C) or newly diagnosed (cohort D) classical Hodgkin Lymphoma participants.
    explanation: Confirms the CheckMate 205 trial evaluates nivolumab efficacy and safety in classical Hodgkin lymphoma.

infectious_agent:
- name: Epstein-Barr Virus
  infectious_agent_term:
    preferred_term: Human gammaherpesvirus 4
    term:
      id: NCBITaxon:10376
      label: Human gammaherpesvirus 4
  description: >-
    Epstein-Barr virus is associated with a subset of classic Hodgkin lymphoma,
    with the strength of association varying with host immune context. NLPHL is
    generally EBV-negative.
  evidence:
  - reference: PMID:29799516
    reference_title: "Epstein Barr Virus-Associated Hodgkin Lymphoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The variable association of cHL with EBV infection is probably related to the different levels of patient immunosuppression, both locally in the tumour tissue and at the systemic level."
    explanation: Supports EBV as a relevant but non-universal cofactor in classic Hodgkin lymphoma, contingent on host immune status.
pathophysiology:
- name: Neoplastic Hodgkin/Reed-Sternberg Cell Origin (Classic HL)
  description: >-
    In classic Hodgkin lymphoma the malignant Hodgkin/Reed-Sternberg cell is
    derived from a germinal center B cell but loses most typical B-cell features
    during transformation.
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The hallmark of this disease is the neoplastic Hodgkin/Reed-Sternberg (HRS) cell, which is favored to be derived from germinal center B-cells but has lost many of the B-cell markers."
    explanation: Directly supports germinal-center-B-cell derivation of the malignant HRS cell.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: Transformed HRS cells recruit and shape a supportive inflammatory niche.
- name: Neoplastic Lymphocyte-Predominant (LP) Cell Origin (NLPHL)
  description: >-
    In NLPHL the neoplastic lymphocyte-predominant (LP) cell is an infrequent
    large germinal-center-derived B cell that, unlike the HRS cell, retains a
    functional B-cell program and sits in a lymphocyte- and histiocyte-rich
    microenvironment.
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  evidence:
  - reference: PMID:9256483
    reference_title: "Hodgkin and Reed-Sternberg cells in lymphocyte predominant Hodgkin disease represent clonal populations of germinal center-derived tumor B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This shows that HRS cells in LP HD are a clonal tumor population derived from germinal center B cells."
    explanation: Single-cell micromanipulation and immunoglobulin gene analysis of patient LP cells establishes their clonal germinal-center B-cell origin.
  - reference: PMID:40517549
    reference_title: "Nodular Lymphocyte-Predominant Hodgkin Lymphoma: Update on Biology and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast to classic HL (cHL), the malignant cells in NLPB/HL lack CD30 expression but maintain a complete phenotype of mature B-cells including CD20 and IgG, but occasionally show IgD expression."
    explanation: Establishes that the LP cell retains a complete mature B-cell program (CD20+, CD30-), the near-inverse of the HRS immunophenotype of classic HL.
  - reference: PMID:34208705
    reference_title: "Pitfalls in the Diagnosis of Nodular Lymphocyte Predominant Hodgkin Lymphoma: Variant Patterns, Borderlines and Mimics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both diagnoses are established using morphology and immunophenotype and share similarities, including the infrequent large tumor B-cells and the lymphocyte and histiocyte-rich microenvironment."
    explanation: Supports the LP cell being an infrequent large tumor B cell set within a lymphocyte- and histiocyte-rich microenvironment (the features NLPHL shares with T-cell/histiocyte-rich large B-cell lymphoma).
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: >-
      Like the HRS cell, the LP cell actively manipulates and depends on its
      supportive lymphocyte- and histiocyte-rich microenvironment.
    evidence:
    - reference: DOI:10.1200/jco.2010.32.8401
      reference_title: "Molecular Pathogenesis of Hodgkin's Lymphoma: Increasing Evidence of the Importance of the Microenvironment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The malignant HRS and LP cells manipulate the microenvironment, permitting them to develop their malignant phenotype fully and evade host immune attack."
      explanation: Supports the LP cell, like the HRS cell, actively remodeling its microenvironment to sustain its malignant phenotype and evade host immunity.
- name: Mutation-Driven JAK/STAT Activation (Classic HL)
  description: >-
    Recurrent somatic lesions in classic Hodgkin lymphoma activate JAK/STAT
    signaling that supports HRS-cell survival and cytokine-responsive growth.
  genes:
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  evidence:
  - reference: PMID:29340061
    reference_title: "Analysis of the mutational landscape of classic Hodgkin lymphoma identifies disease heterogeneity and potential therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, several variants were consistently detected in genes related to relevant signaling pathways, such as GM-CSF/IL-3, CBP/EP300, JAK/STAT, NF-kappaB, and numerous variants of genes affecting the B-cell receptor (BCR) pathway, such as BTK, CARD11, BCL10, among others."
    explanation: Supports recurrent genetic lesions affecting JAK/STAT signaling in classic Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: JAK/STAT signaling supports inflammatory niche formation.
- name: Mutation-Driven NF-kappaB Activation (Classic HL)
  description: >-
    Destructive lesions in NF-kappaB negative regulators and gains in positive
    regulators drive constitutive NF-kappaB survival signaling in HRS cells.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:27221964
    reference_title: "NF-κB deregulation in Hodgkin lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This includes interaction with other cells in the lymphoma microenvironment through CD30, CD40, BCMA and other receptors, but also recurrent somatic genetic lesions in various factors of the NF-κB pathway, including destructive mutations in negative regulators of NF-κB signaling (e.g. TNFAIP3, NFKBIA), and copy number gains of genes encoding positive regulators (e.g. REL, MAP3K14)."
    explanation: Supports recurrent somatic lesions in NF-kappaB regulators (TNFAIP3, NFKBIA) as a core survival mechanism in Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: NF-kappaB signaling sustains the inflammatory tumor niche.
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: Constitutive NF-kappaB signaling cooperates with checkpoint-ligand upregulation to promote immune escape.
- name: EBV LMP1-Mediated NF-kappaB Activation (EBV-positive Classic HL)
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  description: >-
    In Epstein-Barr-virus-positive classic Hodgkin lymphoma, viral latent
    membrane protein 1 mimics an active CD40 receptor and drives NF-kappaB
    activation in HRS cells.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:27221964
    reference_title: "NF-κB deregulation in Hodgkin lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In Epstein-Barr virus-positive cases of classical HL, the virus-encoded latent membrane protein 1 causes NF-κB activation by mimicking an active CD40 receptor."
    explanation: Supports EBV LMP1 as a mechanism of NF-kappaB activation in EBV-positive classic Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: EBV-driven NF-kappaB activation reinforces the inflammatory tumor niche.
- name: Cytokine and Chemokine-Mediated Microenvironment Remodeling
  conforms_to: "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory Microenvironment"
  description: >-
    Neoplastic Hodgkin cells persist within a dense inflammatory infiltrate that
    they actively recruit and shape through cytokine and chemokine signaling,
    the defining tissue architecture of Hodgkin lymphoma.
  biological_processes:
  - preferred_term: chemokine production
    modifier: INCREASED
    term:
      id: GO:0032602
      label: chemokine production
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HRS cells are scattered within a dense inflammatory infiltrate, and through a network of cytokines and chemokines they shape their microenvironment, evade immune response, survive, and grow."
    explanation: Supports the dependence of Hodgkin lymphoma on cytokine- and chemokine-mediated microenvironmental remodeling.
  downstream:
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: The inflammatory niche is coupled to ineffective anti-tumor immunity.
  - target: Lymphadenopathy
    description: The tumor-supported inflammatory niche contributes to nodal enlargement.
  - target: Fever
    description: Cytokine-rich tumor inflammation contributes to B symptoms including fever.
  - target: Night Sweats
    description: Cytokine-rich tumor inflammation contributes to B symptoms including night sweats.
  - target: Weight Loss
    description: Cytokine-rich tumor inflammation contributes to systemic B symptoms including weight loss.
- name: PD-1 Ligand-Mediated Immune Evasion
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  description: >-
    Near-universal 9p24.1 copy gain in classic Hodgkin lymphoma HRS cells
    increases PD-1 ligand expression and contributes to immune escape, the basis
    for the disease's marked sensitivity to PD-1 blockade.
  biological_processes:
  - preferred_term: Negative Regulation of T Cell Mediated Immunity
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
    modifier: INCREASED
  evidence:
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRS cells exhibit near-universal somatic copy gains of chromosome 9p/9p24.1, which increase expression of the programmed cell death protein 1 (PD-1) ligands."
    explanation: Links recurrent 9p24.1 gains in HRS cells to elevated PD-1 ligand expression and immune evasion.
  - reference: PMID:20628145
    reference_title: "Integrative analysis reveals selective 9p24.1 amplification, increased PD-1 ligand expression, and further induction via JAK2 in nodular sclerosing Hodgkin lymphoma and primary mediastinal large B-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we integrate high-resolution copy number data with transcriptional profiles and identify the immunoregulatory genes, PD-L1 and PD-L2, as key targets at the 9p24.1 amplification peak in HL and MLBCL cell lines"
    explanation: >-
      Green et al. identified PD-L1 and PD-L2 as the immunoregulatory targets of
      the 9p24.1 amplification peak, the foundational discovery underlying this
      immune-evasion node.
  - reference: PMID:20628145
    reference_title: "Integrative analysis reveals selective 9p24.1 amplification, increased PD-1 ligand expression, and further induction via JAK2 in nodular sclerosing Hodgkin lymphoma and primary mediastinal large B-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JAK2 amplification increased protein expression and activity, specifically induced PD-1 ligand transcription and enhanced sensitivity to JAK2 inhibition"
    explanation: >-
      Documents the co-amplified JAK2 locus within 9p24.1 driving PD-1 ligand
      transcription, coupling JAK-STAT signaling to checkpoint-ligand-mediated
      immune evasion.

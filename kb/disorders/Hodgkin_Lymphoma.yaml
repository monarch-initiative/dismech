  - preferred_term: B2M
    term:
      id: hgnc:914
      label: B2M
  - preferred_term: CIITA
    term:
      id: hgnc:7067
      label: CIITA
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Classic Hodgkin lymphoma (CHL) accounts for 15-25% of all lymphomas in the Western world."
    explanation: Establishes classic Hodgkin lymphoma as the dominant form and quantifies its share of all lymphomas in the Western world.
- name: NLPHL
  display_name: Nodular lymphocyte-predominant Hodgkin lymphoma (NLPHL)
  subtype_term:
    preferred_term: nodular lymphocyte predominant Hodgkin lymphoma
    term:
      id: MONDO:0044778
      label: nodular lymphocyte predominant Hodgkin lymphoma
  subtype_frequency: '~5%'
  description: >-
    A biologically distinct, uncommon form of Hodgkin lymphoma driven by
    lymphocyte-predominant (LP; "popcorn") cells that retain a functional B-cell
    program (CD20+, CD45+, BCL6+; CD15- and CD30-, i.e. the near-inverse of the
    classic HRS immunophenotype) set within nodular meshworks of follicular
    dendritic cells and a lymphocyte/histiocyte-rich background. It typically
    affects children and young adults, is usually indolent with a favorable
    prognosis, is generally EBV-negative, and can progress to
    T-cell/histiocyte-rich large B-cell lymphoma or diffuse large B-cell lymphoma.
  evidence:
  - reference: PMID:34208705
    reference_title: "Pitfalls in the Diagnosis of Nodular Lymphocyte Predominant Hodgkin Lymphoma: Variant Patterns, Borderlines and Mimics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nodular lymphocyte predominant Hodgkin lymphoma (NLPHL) represents approximately 5% of Hodgkin lymphoma and typically affects children and young adults."
    explanation: Establishes NLPHL as an uncommon (~5%) subtype of Hodgkin lymphoma with a characteristic young-age distribution.
  - reference: PMID:40517549
    reference_title: "Nodular Lymphocyte-Predominant Hodgkin Lymphoma: Update on Biology and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast to classic HL (cHL), the malignant cells in NLPB/HL lack CD30 expression but maintain a complete phenotype of mature B-cells including CD20 and IgG, but occasionally show IgD expression."
    explanation: Supports the LP cell retaining a complete mature B-cell program (CD20+) and lacking CD30/CD15, the near-inverse of the classic HRS immunophenotype.
  - reference: PMID:34208705
    reference_title: "Pitfalls in the Diagnosis of Nodular Lymphocyte Predominant Hodgkin Lymphoma: Variant Patterns, Borderlines and Mimics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "variant growth patterns in NLPHL correlate with disease recurrence and progression to T-cell/histiocyte-rich large B-cell lymphoma or frank diffuse large B-cell lymphoma (DLBCL)."
    explanation: Supports the potential for NLPHL to progress or transform to T-cell/histiocyte-rich large B-cell lymphoma or DLBCL.

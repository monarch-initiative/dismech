description: >-
  Hodgkin lymphoma is a B-cell-derived lymphoid malignancy defined by rare
  neoplastic cells embedded in a dense reactive inflammatory microenvironment.
  It comprises two biologically distinct disease classes: classic Hodgkin
  lymphoma (CHL), driven by Hodgkin/Reed-Sternberg (HRS) cells that have lost
  most of the B-cell program, and nodular lymphocyte-predominant Hodgkin
  lymphoma (NLPHL), driven by lymphocyte-predominant (LP) cells that retain a
  B-cell program. CHL accounts for the great majority of cases; NLPHL is
  uncommon and indolent. Both derive from germinal center B cells.
definitions:
- name: Pathologic definition of Hodgkin lymphoma
  definition_type: CASE_DEFINITION
  description: >-
    Hodgkin lymphoma is a germinal-center-B-cell-derived lymphoma in which sparse
    neoplastic cells (Hodgkin/Reed-Sternberg cells in classic Hodgkin lymphoma;
    lymphocyte-predominant cells in NLPHL) sit within an extensive, functionally
    ineffective inflammatory/immune infiltrate.
  scope: >-
    General pathologic and molecular definition spanning classic Hodgkin
    lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma.
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The hallmark of this disease is the neoplastic Hodgkin/Reed-Sternberg (HRS) cell, which is favored to be derived from germinal center B-cells but has lost many of the B-cell markers."
    explanation: Supports the germinal-center-B-cell derivation and the defining neoplastic HRS cell of the classic (majority) form of Hodgkin lymphoma.
has_subtypes:
- name: Classic HL
  display_name: Classic Hodgkin lymphoma (CHL)
  subtype_term:
    preferred_term: classic Hodgkin lymphoma
    term:
      id: MONDO:0009348
      label: classic Hodgkin lymphoma
  subtype_frequency: '~95%'
  description: >-
    The great majority of Hodgkin lymphoma. Defined by Hodgkin/Reed-Sternberg
    cells with a characteristic CD30+ CD15+ PAX5(weak) CD45- immunophenotype in a
    dense inflammatory background, constitutive NF-kappaB and JAK/STAT signaling,
    near-universal 9p24.1 copy gain driving PD-1 ligand expression, and an
    Epstein-Barr-virus-associated subset. WHO recognizes four histologic variants:
    nodular sclerosis, mixed cellularity, lymphocyte-rich, and lymphocyte-depleted.
    Fully curated as a distinct dismech entry (kb/disorders/Classic_Hodgkin_Lymphoma.yaml),
    where it conforms to the tumor_promoting_inflammation, viral_oncogenesis (EBV LMP1),
    and immune_checkpoint_blockade modules.
  genes:
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6

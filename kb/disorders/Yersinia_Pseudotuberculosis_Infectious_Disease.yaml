name: Yersinia Pseudotuberculosis Infectious Disease
creation_date: '2026-09-27T22:04:24Z'
updated_date: '2026-09-27T22:04:24Z'
category: Infectious Disease
description: >-
  Yersinia pseudotuberculosis infectious disease is a zoonotic foodborne
  infection in which ingestion of psychrotrophic Yersinia pseudotuberculosis
  from contaminated refrigerated food or animal reservoirs can cause
  self-limited gastroenteritis, Peyer's-patch invasion with mesenteric
  lymphadenitis and hepatosplenic dissemination, and, in Far Eastern
  YPMa-positive strains, Far East scarlet-like fever driven by superantigenic
  CD4-positive T-cell activation.
disease_term:
  preferred_term: Yersinia pseudotuberculosis infectious disease
  term:
    id: MONDO:0007024
    label: Yersinia pseudotuberculosis infectious disease
parents:
- Yersinia infectious disease
- Bacterial enteritis
synonyms:
- Yersinia pseudotuberculosis infection
- pseudotuberculosis
- Far East scarlet-like fever
- FESLF
definitions:
- name: Yersinia pseudotuberculosis disease spectrum
  definition_type: CASE_DEFINITION
  description: >-
    Y. pseudotuberculosis disease spans the self-limited gastroenteritis caused
    by most enteric strains and the severe systemic inflammatory Far East
    scarlet-like fever caused by Far Eastern superantigen-producing strains.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Far East scarlet-like fever is caused by Yersinia pseudotubuclosis
      infection, an organism that typically causes self-limiting gastroenteritis
      in Europe.
    explanation: >-
      The review defines the ordinary gastroenteritis presentation and the Far
      East scarlet-like fever variant as the two central human presentations.
infectious_agent:
- name: Yersinia pseudotuberculosis
  infectious_agent_term:
    preferred_term: Yersinia pseudotuberculosis
    term:
      id: NCBITaxon:633
      label: Yersinia pseudotuberculosis
  description: >-
    Y. pseudotuberculosis is an enteropathogenic, psychrotrophic Yersinia
    species whose pYV virulence plasmid encodes the LcrF-regulated Ysc type III
    secretion system and Yop effector proteins; Far Eastern epidemic strains can
    additionally produce the YPMa superantigen.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Geographical heterogeneity exists between virulence factors produced by
      European and Far Eastern Y pseudotuberculosis strains, implicating
      superantigen Y pseudotuberculosis-derived mitogen A (YPMa) in the
      pathogenesis of FESLF.
    explanation: >-
      The review identifies Y. pseudotuberculosis and YPMa-positive Far Eastern
      strains as the bacterial basis of the genotype-branched disease spectrum.
transmission:
- name: Refrigerated foodborne zoonotic transmission
  description: >-
    Human infection is acquired by ingesting fecally contaminated food or water;
    the organism's cold tolerance permits persistence in refrigerated food.
  evidence:
  - reference: PMID:20088683
    reference_title: Adaptation of enteropathogenic Yersinia to low growth temperature.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica and Yersinia pseudotuberculosis are important
      foodborne pathogens that cause infections through contaminated
      refrigerated food.
    explanation: >-
      The review supports contaminated refrigerated food as an exposure vehicle
      for Y. pseudotuberculosis.
  - reference: PMID:19835774
    reference_title: "Pathogenic Yersinia enterocolitica 2/O:9 and Yersinia pseudotuberculosis 1/O:1 strains isolated from human and non-human sources in the Plateau State of Nigeria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All human Y. pseudotuberculosis 1/O:1 strains were indistinguishable from
      pig, sheep or food strains.
    explanation: >-
      Molecular identity between human, livestock, and food isolates supports
      food-chain zoonotic transmission.
progression:
- phase: Localized enteric yersiniosis
  notes: >-
    In Europe and much of the world, infection is often a sporadic,
    self-limited gastroenteritis or a terminal-ileal/mesenteric-lymph-node
    syndrome that can mimic acute appendicitis.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In Europe, human Y pseudotuberculosis infection typically occurs
      sporadically, in the form of a self-limiting gastroenteritis.
    explanation: >-
      The review supports a localized, self-limited enteric presentation.
- phase: Far East scarlet-like fever
  notes: >-
    Far Eastern YPMa-producing lineages can cause outbreaks of a severe systemic
    inflammatory disease called Far East scarlet-like fever.
  evidence:
  - reference: PMID:26819960
    reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In Russia and Japan, outbreaks of Y pseudotuberculosis infection cause
      severe systemic inflammatory symptoms.
    explanation: >-
      The FESLF review describes systemic inflammatory outbreak disease as the
      Far Eastern branch of Y. pseudotuberculosis infection.

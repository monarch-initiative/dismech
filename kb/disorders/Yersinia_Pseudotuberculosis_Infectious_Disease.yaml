  evidence:
  - reference: PMID:20088683
    reference_title: Adaptation of enteropathogenic Yersinia to low growth temperature.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Their cold tolerance mechanisms are therefore of special interest.
    explanation: >-
      The review connects the organism's low-temperature biology to its food
      safety relevance.
- name: Domestic-animal and food-chain reservoirs
  description: >-
    Pathogenic Y. pseudotuberculosis strains can circulate between livestock or
    food reservoirs and humans.
  influences_mechanisms:
  - target: Refrigerated Foodborne Yersinia pseudotuberculosis Ingestion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Animal and food reservoirs seed contaminated food before human ingestion.
    evidence:
    - reference: PMID:19835774
      reference_title: "Pathogenic Yersinia enterocolitica 2/O:9 and Yersinia pseudotuberculosis 1/O:1 strains isolated from human and non-human sources in the Plateau State of Nigeria."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        All human Y. pseudotuberculosis 1/O:1 strains were indistinguishable
        from pig, sheep or food strains.
      explanation: >-
        The strain-comparison study supports food and animal reservoirs as
        sources of human Y. pseudotuberculosis strains.
  evidence:
  - reference: PMID:19835774
    reference_title: "Pathogenic Yersinia enterocolitica 2/O:9 and Yersinia pseudotuberculosis 1/O:1 strains isolated from human and non-human sources in the Plateau State of Nigeria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inv-positive Y. pseudotuberculosis were isolated in Plateau state of
      Nigeria from several samples of human and non-human origin.
    explanation: >-
      The survey isolated pathogenic Y. pseudotuberculosis from both human and
      non-human samples.
pathophysiology:
- name: Refrigerated Foodborne Yersinia pseudotuberculosis Ingestion
  description: >-
    Infection begins when cold-tolerant Y. pseudotuberculosis reaches the small
    intestine after ingestion of contaminated refrigerated food, water, or
    animal-derived material.
  downstream:
  - target: Invasin-Mediated M-Cell and Peyer's Patch Entry
    description: >-
      Organisms in the ileal lumen use invasin to engage beta-1 integrins on
      follicle-associated epithelium and M cells over Peyer's patches.
    evidence:
    - reference: PMID:12755365
      reference_title: "Interaction of Yersinia enterocolitica with epithelial cells: invasin beyond invasion."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        The chromosomally encoded inv gene product is an outer membrane protein
        that is functionally expressed in the enteropathogenic Yersinia species
        Yersinia enterocolitica and Yersinia pseudotuberculosis.
      explanation: >-
        The review establishes invasin as a chromosomal outer-membrane adhesin
        expressed by Y. pseudotuberculosis.
  evidence:
  - reference: PMID:20088683
    reference_title: Adaptation of enteropathogenic Yersinia to low growth temperature.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica and Yersinia pseudotuberculosis are important
      foodborne pathogens that cause infections through contaminated
      refrigerated food.
    explanation: >-
      The review supports foodborne ingestion as the initiating exposure.
- name: Invasin-Mediated M-Cell and Peyer's Patch Entry
  description: >-
    Chromosomal invasin binds host beta-1 integrins to promote early
    Yersinia translocation across M cells into Peyer's-patch lymphoid tissue.
  cell_types:
  - preferred_term: M cell of gut
    term:
      id: CL:0000682
      label: M cell of gut
  locations:
  - preferred_term: small intestine Peyer's patch
    term:
      id: UBERON:0003454
      label: small intestine Peyer's patch
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Intestinal Replication and Hepatosplenic Dissemination
    description: >-
      Peyer's-patch entry and intestinal replication generate the organism pool
      that later seeds mesenteric lymph nodes, spleen, and liver.
    evidence:
    - reference: PMID:16754724
      reference_title: Yersinia pseudotuberculosis disseminates directly from a replicating bacterial pool in the intestine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Replication of bacteria in the intestine before translocation appeared
        critical for dissemination
      explanation: >-
        Oral mouse infection shows that intestinal replication is upstream of
        later organ dissemination.
  evidence:
  - reference: PMID:12755365
    reference_title: "Interaction of Yersinia enterocolitica with epithelial cells: invasin beyond invasion."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Invasin protein is a high-affinity ligand for beta1 integrins and
      especially important in the early phase of intestinal infection for
      efficient translocation through the M cells located in the
      follicle-associated epithelium overlying the Peyer's patches.
    explanation: >-
      The review connects beta-1 integrin binding by invasin to M-cell
      translocation during early intestinal infection.
- name: Intestinal Replication and Hepatosplenic Dissemination
  description: >-
    After mucosal entry, Y. pseudotuberculosis establishes an intestinal
    replicating pool that can disseminate to mesenteric lymph nodes and deeper
    reticuloendothelial organs.
  locations:
  - preferred_term: mesenteric lymph node
    term:
      id: UBERON:0002509
      label: mesenteric lymph node
  downstream:
  - target: LcrF Temperature-Gated pYV Type III Secretion
    description: >-
      Host body temperature relieves YmoA/RNA-thermometer repression and
      increases LcrF, the activator of the pYV-encoded ysc and yop genes.
    evidence:
    - reference: PMID:22359501
      reference_title: Concerted actions of a thermo-labile regulator and a unique intergenic RNA thermosensor control Yersinia virulence.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a protein- and RNA-dependent hierarchy of thermosensors induce LcrF
        synthesis at body temperature.
      explanation: >-
        The RNA-thermometer study identifies body temperature as the input that
        induces the LcrF virulence regulator.
  - target: Diarrhea
    description: >-
      Local enteric infection produces self-limited gastroenteritis.
    evidence:
    - reference: PMID:26819960
      reference_title: "Far East Scarlet-Like Fever: A Review of the Epidemiology, Symptomatology, and Role of Superantigenic Toxin: Yersinia pseudotuberculosis-Derived Mitogen A."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        In Europe, human Y pseudotuberculosis infection typically occurs
        sporadically, in the form of a self-limiting gastroenteritis.
      explanation: >-
        The review supports a diarrheal gastroenteritis phenotype in localized
        Y. pseudotuberculosis infection.
  - target: Lymphadenitis
    description: >-
      Regional lymphoid infection causes mesenteric lymphadenitis and an
      appendicitis-mimicking presentation.
    evidence:
    - reference: PMID:32498317
      reference_title: Far Eastern Scarlet-Like Fever is a Special Clinical and Epidemic Manifestation of Yersinia pseudotuberculosis Infection in Russia.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Pseudotuberculosis in humans until the 1950s was found in different
        countries of the world as a rare sporadic disease that occurred in the
        form of acute appendicitis and mesenteric lymphadenitis.
      explanation: >-
        The review explicitly describes mesenteric lymphadenitis in human
        pseudotuberculosis.
  evidence:
  - reference: PMID:16754724
    reference_title: Yersinia pseudotuberculosis disseminates directly from a replicating bacterial pool in the intestine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Y. pseudotuberculosis translocated to organs such as the liver and spleen
      shortly after oral inoculation, but was quickly cleared.
    explanation: >-
      The oral mouse infection study demonstrates that intestinal infection can
      seed hepatosplenic sites.
- name: LcrF Temperature-Gated pYV Type III Secretion
  description: >-
    Body-temperature induction of LcrF activates the pYV-encoded ysc type III
    secretion genes and yop effector program.
  biological_processes:
  - preferred_term: protein secretion by the type III secretion system
    term:
      id: GO:0030254
      label: protein secretion by the type III secretion system
  downstream:
  - target: YopJ-Driven Toll-Like Receptor Signaling Blockade
    description: >-
      Activated type III secretion delivers Yop effectors, including YopJ, into
      host innate immune cells.
    evidence:
    - reference: PMID:22359501
      reference_title: Concerted actions of a thermo-labile regulator and a unique intergenic RNA thermosensor control Yersinia virulence.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression of all Yersinia pathogenicity factors encoded on the
        virulence plasmid, including the yop effector and the ysc type III
        secretion genes, is controlled by the transcriptional activator LcrF in
        response to temperature.
      explanation: >-
        LcrF sits upstream of both the Ysc secretion apparatus and the Yop
        effector genes.
  evidence:
  - reference: PMID:22359501
    reference_title: Concerted actions of a thermo-labile regulator and a unique intergenic RNA thermosensor control Yersinia virulence.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      two different Y. pseudotuberculosis patient isolates expressing a
      stabilized thermometer variant were strongly reduced in their ability to
      disseminate into the Peyer's patches, liver and spleen and have fully lost
      their lethality
    explanation: >-
      The mouse infection experiment shows that proper RNA-thermometer
      derepression of LcrF is required for dissemination and lethality.
- name: YopJ-Driven Toll-Like Receptor Signaling Blockade
  description: >-
    The YopJ type III effector blocks innate NF-kappaB, MAPK, and IRF3 signaling
    downstream of Toll-like receptors by acting at TRAF3, TRAF6, and TAK1.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: effector-mediated suppression of host innate immune response
    term:
      id: GO:0140403
      label: effector-mediated suppression of host innate immune response
  evidence:
  - reference: PMID:17608743
    reference_title: "YopJ targets TRAF proteins to inhibit TLR-mediated NF-kappaB, MAPK and IRF3 signal transduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      YopJ inhibited TLR-mediated NF-kappaB and MAP kinase activation, as
      suggested by previous studies.
    explanation: >-
      Cell-signaling assays support YopJ-mediated blockade of innate NF-kappaB
      and MAPK signaling.
- name: YPMa Superantigen CD4 T-Cell Activation
  description: >-
    Far Eastern strains can produce YPMa, a superantigen that expands Vbeta3
    T cells in human infection and drives CD4-positive Vbeta7/Vbeta8-dependent
    TNF-alpha/IFN-gamma shock in mice.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
  downstream:
  - target: Renal insufficiency
    description: >-
      Systemic YPM-driven T-cell activation is associated with the systemic
      inflammatory form that includes transient renal dysfunction.
    evidence:
    - reference: PMID:9109426
      reference_title: Clinical role for a superantigen in Yersinia pseudotuberculosis infection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with systemic symptoms such as lymphadenopathy, transient renal
        dysfunction, and arthritis had significantly higher titers of anti-YPM
        than patients with gastrointestinal tract symptoms alone.
      explanation: >-
        The patient serology study associates systemic manifestations, including
        transient renal dysfunction, with stronger anti-YPM responses.
  evidence:
  - reference: PMID:9109426
    reference_title: Clinical role for a superantigen in Yersinia pseudotuberculosis infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      20 out of 33 patients (61%) had an elevated antibody titer compared with
      healthy controls (P = 0.0001).
    explanation: >-
      Anti-YPM IgG in acute patients supports in-vivo YPM exposure during human
      infection.
  - reference: PMID:9159409
    reference_title: Identification of murine T cells reactive with the bacterial superantigen Yersinia pseudotuberculosis-derived mitogen (YPM) and factors involved in YPM-induced toxicity in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that YPM-induced shock requires the presence of
      CD4+ T cells bearing TCR Vbeta7 and Vbeta8, and that endogenous TNF-alpha
      and IFN-gamma mediate the lethal effects.
    explanation: >-
      Antibody-blocking experiments in mice support CD4-positive T cells and
      TNF-alpha/IFN-gamma as mediators of YPM shock.

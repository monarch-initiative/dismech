diagnosis:
- name: Direct detection and PsaA-based species-discriminating serology
  description: >-
    Acute Y. pseudotuberculosis infection can be diagnosed by direct bacterial
    detection, while chronic or post-infectious disease requires serology that
    distinguishes Y. pseudotuberculosis antigens from Y. enterocolitica
    antigens.
  evidence:
  - reference: PMID:30238343
    reference_title: Novel diagnostic ELISA test for discrimination between infections with Yersinia enterocolitica and Yersinia pseudotuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whereas early infections can be diagnosed by direct detection of bacteria,
      chronic infections can only be identified by serological tests.
    explanation: >-
      The diagnostic ELISA paper distinguishes direct detection in acute
      infection from serology in chronic or post-infectious yersiniosis.
  - reference: PMID:30238343
    reference_title: Novel diagnostic ELISA test for discrimination between infections with Yersinia enterocolitica and Yersinia pseudotuberculosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      discrimination between the two types of infection is based on two
      recombinant bacterial proteins, MyfA and PsaA (specific for Y.
      enterocolitica and Y. pseudotuberculosis, respectively)
    explanation: >-
      PsaA is identified as the Y. pseudotuberculosis-specific antigen in a
      species-discriminating serologic assay.
animal_models:
- name: Oral Yersinia pseudotuberculosis mouse infection
  species: Mus musculus
  publication: PMID:22359501
  description: >-
    Oral infection in mice models the intestinal-to-hepatosplenic dissemination
    axis and demonstrates that proper RNA-thermometer regulation of LcrF is
    required for lethal disseminated disease.
  modeled_mechanisms:
  - target: LcrF Temperature-Gated pYV Type III Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Patient isolates carrying a stabilized thermosensor lose Peyer's-patch,
      liver, and spleen dissemination and lose lethality after oral mouse
      infection.
    limitations: >-
      The model reads out murine dissemination and lethality rather than the
      full human Far East scarlet-like fever clinical spectrum.
  evidence:
  - reference: PMID:22359501
    reference_title: Concerted actions of a thermo-labile regulator and a unique intergenic RNA thermosensor control Yersinia virulence.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      two different Y. pseudotuberculosis patient isolates expressing a
      stabilized thermometer variant were strongly reduced in their ability to

  - target: Refrigerated Foodborne Yersinia pseudotuberculosis Ingestion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Eating contaminated refrigerated food delivers viable organisms into the
      ileocecal lumen.
    evidence:

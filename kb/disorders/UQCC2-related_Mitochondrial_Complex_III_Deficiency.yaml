discussions:
- discussion_id: gap_uqcc2_allele_severity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#UQCC2 Loss of Function
  - genetic#UQCC2
  prompt: >-
    Does the small amount of wild-type UQCC2 made from the c.214-3C>G splice
    allele explain why that patient survived infancy while the missense patient
    died at 33 days?
  rationale: >-
    PMID:28804536 proposes this, and the 2% residual wild-type transcript
    measured in PMID:24385928 is consistent with it, but there is one patient per
    allele and the second patient was also born eight weeks preterm, so the
    difference in outcome cannot be attributed to the allele from these data.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She had profound lactic acidosis and elevated urinary pyruvate."
      explanation: Lactic acidosis with raised pyruvate accompanies the respiratory chain defect.
  - target: Proximal renal tubular acidosis
    description: >-
      The proximal tubule is highly dependent on oxidative metabolism; tubulopathy

name: UQCC2-related mitochondrial complex III deficiency
creation_date: "2026-10-30T23:43:00Z"
category: Mendelian
description: >-
  Mitochondrial complex III deficiency, nuclear type 7 (MC3DN7) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in UQCC2, an
  assembly factor for respiratory chain complex III. UQCC2 forms a complex with
  UQCC1 that binds the newly translated, mtDNA-encoded cytochrome b subunit, and
  the two proteins depend on each other for stability. Without UQCC2, UQCC1 is
  lost, cytochrome b is not produced or not stabilized, and complex III fails to
  assemble; because assembled complex III is needed for respiratory
  supercomplexes, complex I is secondarily reduced as well. Two unrelated
  consanguineous families have been reported. Both children had intrauterine
  growth retardation and severe neonatal lactic acidosis. One, with a
  hypomorphic splice-site allele, survived infancy with proximal renal tubular
  acidosis, seizures, severe developmental delay, absent speech, autistic
  features and mild sensorineural hearing loss; the other, homozygous for two
  missense variants that removed nearly all UQCC2 protein, had status
  epilepticus and died of respiratory failure on day 33. There is no
  disease-modifying therapy.

genetic:
- name: UQCC2
  gene_term:
    preferred_term: UQCC2
    term:
      id: hgnc:21237
      label: UQCC2
  association: Biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  features: >-
    Two alleles are known, each homozygous in one family: the splice-acceptor
    variant c.214-3C>G, which leaves about 2% wild-type transcript, and the
    in-cis missense pair c.[23G>C;28C>T] p.[Arg8Pro;Leu10Phe], which removes
    nearly all UQCC2 protein.
  evidence:
  - reference: PMID:28804536
    reference_title: "Combined Respiratory Chain Deficiency and UQCC2 Mutations in Neonatal Encephalomyopathy: Defective Supercomplex Assembly in Complex III Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed two homozygous missense variants in UQCC2, leading to a severe reduction of UQCC2 protein."
    explanation: The second family's allele and its effect on protein.
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a causative homozygous UQCC2 (MIM 614461) splicing mutation in a patient with severe intrauterine growth retardation, neonatal lactic acidosis and renal tubular dysfunction associated with complex III deficiency."
    explanation: The first family's allele.
  notes: >-
    No ClinGen gene-disease validity record for UQCC2 is cached in
    references_cache/, so gene_disease_validity is left absent.

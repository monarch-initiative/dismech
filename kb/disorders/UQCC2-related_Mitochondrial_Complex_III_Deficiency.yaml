    snippet: "(B) SDS-PAGE and western blotting of mitochondrial lysates from patient fibroblasts demonstrate a marked deficiency of UQCC2 and UQCC1, a mild deficiency in the UQCRC2 subunit of complex III, and a more pronounced deficiency of the UQCRC1 and UQCRFS1 subunits of complex III."

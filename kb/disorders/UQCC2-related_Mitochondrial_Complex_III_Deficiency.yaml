- name: Loss of Complex III-Containing Supercomplexes
  biological_scale: MOLECULAR
  description: >-
    Both patients had reduced complex I as well as complex III. In muscle from
    the second patient, complex III-containing supercomplexes were lost and
    complex I-containing supercomplexes reduced. Knockdown of the partner UQCC1
    in HEK293 cells reproduces a milder complex I reduction while leaving the
    subunits of other complexes intact, and UQCC1 and UQCC2 co-evolve with
    complex III rather than complex I, which is why the complex I defect is read
    as secondary.

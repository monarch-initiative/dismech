    preferred_term: respiratory chain enzymology on muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:28804536
    reference_title: "Combined Respiratory Chain Deficiency and UQCC2 Mutations in Neonatal Encephalomyopathy: Defective Supercomplex Assembly in Complex III Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A review of the literature on genetically distinct complex III defects revealed that, except TTC19 deficiency, the biochemical pattern was very often a combined respiratory chain deficiency."
    explanation: Supports reading a combined pattern as compatible with a complex III assembly defect.

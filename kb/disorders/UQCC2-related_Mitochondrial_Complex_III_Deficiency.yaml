- name: Impaired Mitochondrial Electron Transport
  biological_scale: CELLULAR
  description: >-
    With complex III, and secondarily complex I, deficient, electron flow
    through the respiratory chain and oxidative ATP production are impaired.
    Pyruvate is diverted to lactate, which is the source of the persistent
    lactic acidosis, and tissues with high energy demand, here the kidney
    proximal tubule and the brain, bear the clinical consequences.
  biological_processes:

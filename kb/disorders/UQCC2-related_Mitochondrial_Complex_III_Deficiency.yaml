      label: Autosomal recessive inheritance
  description: >-
    Both reported patients were homozygous for UQCC2 variants and were born to
    consanguineous parents: a splice-site variant in a Lebanese family and a
    pair of in-cis missense variants in the second family.
  evidence:
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we used Massively Parallel Sequencing to identify a homozygous splicing mutation in the gene encoding Ubiquinol-Cytochrome c Reductase Complex Assembly Factor 2 (UQCC2) in a consanguineous Lebanese patient"
    explanation: Homozygous variant in a child of consanguineous parents.
  - reference: PMID:28804536
    reference_title: "Combined Respiratory Chain Deficiency and UQCC2 Mutations in Neonatal Encephalomyopathy: Defective Supercomplex Assembly in Complex III Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNP analysis confirmed consanguinity of the patients' parents and revealed a large homozygosity-by-descent (HBD) region of about 54 Mb including almost the entire p-arm of chromosome 6"
    explanation: The second family is also consanguineous, with UQCC2 inside a homozygous-by-descent region.
notes: >-
  **The clinical picture rests on two patients.** Every phenotype below comes
  from one or both of the two published families (PMID:24385928 and
  PMID:28804536), so no frequency is recorded. PubMed searches run on
  2026-10-31 found no further patients: `UQCC2` (19 records),
  `UQCC2[tiab] AND (patient*[tiab] OR mutation*[tiab] OR variant*[tiab])` (10),
  `"complex III deficiency" AND UQCC2` (5), `"mitochondrial complex III
  deficiency nuclear type 7"` (1), `MNF1[tiab] AND complex III` (1) and
  `C6orf125` (0). The only patient reports among them are the two cited here;
  the remaining records are cancer and tissue expression studies, a
  candidate-gene list for attention deficit hyperactivity disorder, reports on
  other complex III genes (TTC19, UQCC3, and a UQCRB patient that the
  nuclear-type-7 phrase search returned), mechanistic UQCC2/M19 studies, and
  for the MNF1 query an unrelated livestock paper. The features shared by both are
  intrauterine growth retardation, neonatal lactic acidosis and seizures; renal
  tubular acidosis, dysmorphism, developmental and behavioural features and
  hearing loss were seen only in the longer-surviving first patient, and the
  second patient was ventilated and sedated for her whole life, so their absence
  there is not informative. The second report itself says that further
  speculation about a distinctive clinical pattern was impossible for that
  reason. The second patient's death on day 33 is recorded in the description
  of the respiratory phenotype, because the HPO term Neonatal death
  (HP:0003811) lies outside the phenotypic-abnormality branch this slot accepts.

  **The biochemical defect is combined, not isolated.** The first report
  regarded its patient as a primary complex III defect because complex III
  activity (9% of control in muscle) was far lower than complex I and IV, but
  complex I was also reduced in both patients. The entry curates the complex I
  reduction as a secondary consequence of losing complex III-containing
  supercomplexes, which is how PMID:28804536 interprets it, and keeps it a
  separate node so that the inference is visible.

  **Allele severity is a hypothesis.** PMID:28804536 suggests that the c.214-3C>G
  splice allele may let a little wild-type UQCC2 through and so explain the
  first patient's survival; the measured 2% residual wild-type transcript fits
  that, but with one patient per allele it is not established, and the entry
  records it as a knowledge gap rather than as a genotype-phenotype rule.

  The first patient's father shared his facial appearance and had a cleft
  palate, so the mild dysmorphism may not belong to the disease; it is curated
  because it was reported in the patient, with that caveat in its description.
pathophysiology:
- name: UQCC2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic UQCC2 variants remove almost all functional UQCC2. The splice-site
    allele c.214-3C>G uses cryptic acceptor sites and leaves about 2% of
    wild-type transcript, with no stable aberrant protein; the homozygous
    p.[Arg8Pro;Leu10Phe] allele causes near-complete loss of UQCC2 protein in
    muscle and fibroblasts. Lentiviral re-expression of UQCC2 in patient
    fibroblasts corrects the complex III defect, which establishes causality.
    No catalytic activity is known for UQCC2; the only molecular activity shown
    for it is binding to UQCC1, which is why the molecular function bound here
    is the broad protein binding term rather than anything more specific.
  genes:
  - preferred_term: UQCC2
    term:
      id: hgnc:21237
      label: UQCC2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: binding to the assembly factor UQCC1
    term:
      id: GO:0005515
      label: protein binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblasts had only 2% residual wild-type UQCC2 expression (Figure 2D), as determined by qRT-PCR, suggesting the c.214-3C>G mutation almost completely abolishes wild-type splicing."
    explanation: Quantifies the residual wild-type transcript from the splice allele.
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent SDS-PAGE and western blot analysis of the UQCC2-TAP purification revealed efficient co-isolation of UQCC1 (Figure 6C)."
    explanation: Affinity purification shows UQCC2 binds UQCC1, the molecular activity bound on this node.
  - reference: PMID:28804536
    reference_title: "Combined Respiratory Chain Deficiency and UQCC2 Mutations in Neonatal Encephalomyopathy: Defective Supercomplex Assembly in Complex III Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost complete loss of UQCC2 protein was present in the muscle and fibroblasts of the affected individual"
    explanation: The missense allele removes UQCC2 protein in patient tissue.
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results prove that the complex III deficiency is due to a lack of UQCC2, and that the mutations in other candidate genes in the patient, TYMP and MTCH1, are not causative."
    explanation: Lentiviral correction in patient fibroblasts establishes UQCC2 loss as the cause.
  downstream:
  - target: Loss of the UQCC1-UQCC2 Assembly Complex
    description: >-
      UQCC2 and UQCC1 are mutually dependent, so losing UQCC2 also removes its
      binding partner UQCC1.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24385928
      reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The UQCC2 binding partner, UQCC1, was barely detectable by western blot, suggesting UQCC2 is required for its stability."
      explanation: UQCC1 is lost in UQCC2-deficient patient fibroblasts.
- name: Loss of the UQCC1-UQCC2 Assembly Complex
  biological_scale: MOLECULAR
  description: >-
    UQCC2 and UQCC1 are the human orthologs of the yeast cytochrome b assembly
    factors Cbp6p and Cbp3p. They interact, each needs the other to be stable,
    and together with the membrane anchor C16orf91 they form the COMA complex
    that facilitates translation of cytochrome b. In UQCC2-deficient cells the
    complex is absent.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest that UQCC1 and UQCC2 are interacting and interdependent proteins, with the stability of UQCC2 depending on UQCC1, and vice versa."
    explanation: Establishes the interaction and mutual dependence of the two factors.
  - reference: PMID:35977508
    reference_title: "Mitochondrial microproteins link metabolic cues to respiratory chain biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The COMA complex, consisting of UQCC1/2 and membrane anchor C16ORF91, facilitates translation of CIII enzymatic core subunit CYTB."
    explanation: Places UQCC1 and UQCC2 in the complex that supports cytochrome b translation.
  downstream:
  - target: Defective Cytochrome b Synthesis
    description: >-
      Without the UQCC1-UQCC2 complex, newly made cytochrome b is not produced
      or is not stabilized, while the other mtDNA-encoded subunits are made
      normally.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24385928
      reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that UQCC1 binds the newly synthesized mtDNA-encoded cytochrome b subunit of complex III and that UQCC2 patient fibroblasts have specific defects in the synthesis or stability of cytochrome b."
      explanation: Links the assembly factors to newly synthesized cytochrome b and shows the patient defect.
- name: Defective Cytochrome b Synthesis
  biological_scale: MOLECULAR
  description: >-
    Pulse labelling of mitochondrial translation products in patient fibroblasts
    shows almost no cytochrome b, even with no chase, although cytochrome b mRNA
    is normal and the other mtDNA-encoded subunits are present. Cytochrome b is
    the first subunit incorporated into complex III, so its absence blocks
    assembly at the earliest step.
  biological_processes:
  - preferred_term: mitochondrial translation of cytochrome b
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Even at zero hours chase, a striking and specific defect in cytochrome b protein levels was observed; other mtDNA-encoded subunits were present in normal amounts or, in the case of COX2 and COX3, an increased amount (Figure 8A)."
    explanation: Shows the defect is specific to cytochrome b among mtDNA-encoded products.
  - reference: PMID:24385928
    reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "(B) qRT-PCR shows normal expression of cytochrome b (MTCYB) mRNA in patient fibroblasts."
    explanation: The defect is at the protein level, not in transcription of MT-CYB.
  downstream:
  - target: Complex III Assembly Failure
    description: >-
      Without cytochrome b the complex III holoenzyme cannot be built, and its
      nuclear-encoded subunits are destabilized.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24385928
      reference_title: "Mutations in the UQCC1-interacting protein, UQCC2, cause human complex III deficiency associated with perturbed cytochrome b protein expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We established the role of UQCC2 as a complex III assembly factor that cooperates with UQCC1 (MIM 611797) to mediate cytochrome b protein expression and subsequent complex III assembly."
      explanation: Connects cytochrome b expression to subsequent complex III assembly.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SETX variants are required. Sibling recurrence risk is 25%, and carrier and
    prenatal testing are available once the familial alleles are known. Apparent
    pseudodominant transmission has been reported where a carrier parent has children with
    an affected partner, and consanguinity is a common context.

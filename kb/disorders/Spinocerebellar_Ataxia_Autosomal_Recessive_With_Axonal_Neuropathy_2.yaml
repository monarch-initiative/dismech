name: Spinocerebellar Ataxia Autosomal Recessive With Axonal Neuropathy 2
creation_date: "2026-09-09T20:30:00Z"
category: Mendelian
disease_term:
  preferred_term: ataxia with oculomotor apraxia type 2
  term:
    id: MONDO:0018996
    label: "spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2"
description: >-
  An autosomal recessive cerebellar ataxia caused by biallelic loss of function at SETX,
  which encodes senataxin - a large DEAxQ-box RNA/DNA helicase, the human ortholog of yeast
  Sen1p. The clinical entity, defined molecularly in 2004, is a triad of adolescent-onset
  progressive cerebellar ataxia, a severe axonal sensorimotor polyneuropathy, and a raised
  serum alpha-fetoprotein, with oculomotor apraxia in only about half of patients despite
  the name AOA2 by which it is usually known.

  Three things make it worth curating as its own entry rather than as a variation on the
  other DNA-repair ataxias. First, the neuropathy is not incidental: it is present in
  essentially every patient, is more consistent than the eye sign, and comes to dominate
  the picture, which is why the MONDO-preferred name places it in the spinocerebellar
  ataxia with axonal neuropathy series rather than with the oculomotor apraxias. Second,
  the biochemical marker is unusually well behaved - elevated alpha-fetoprotein appears at
  or before onset and then stays put, so it works as a screening test rather than only as
  a diagnostic curiosity, and a threshold of 7 microg/l has been validated for selecting
  patients for SETX sequencing.

  Third, and least settled, is the mechanism. Senataxin resolves co-transcriptional
  RNA:DNA hybrids (R-loops) at G-rich pause sites and hands the transcript to Xrn2 for
  termination, and patient cells show defective double-strand break repair and constitutive
  oxidative DNA damage. It is tempting to read the neurodegeneration straight off that
  chain, but the one study that looked directly found no R-loop accumulation in the brains
  of Setx-disrupted mice, only in proliferating tissue. What kills cerebellar Purkinje cells
  and dorsal root ganglion neurons in this disease is therefore not established, and the
  entry models that gap explicitly rather than papering over it.

  The same gene causes a second, entirely separate disease by a different mechanism:
  heterozygous gain-of-function SETX missense alleles cause ALS4, juvenile amyotrophic
  lateral sclerosis, which dismech curates separately under Juvenile Amyotrophic Lateral
  Sclerosis.
parents:
- Autosomal Recessive Cerebellar Ataxia
- DNA Repair Disease


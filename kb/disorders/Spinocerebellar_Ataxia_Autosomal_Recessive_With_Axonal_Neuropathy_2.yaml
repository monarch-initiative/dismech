biochemical:

- name: Serum alpha-fetoprotein
  presence: Elevated
  context: >-
    The defining biochemical abnormality and the practical screening test. Unlike the
    albumin and cholesterol abnormalities of AOA1, which drift with disease duration,
    alpha-fetoprotein here is elevated at or before onset and then stable, so a single
    measurement at any point in the illness is informative.
  biomarker_term:
    preferred_term: Alpha-fetoprotein measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  reference_ranges:
  - lower_bound: 0.5
    upper_bound: 17.2
    unit: microg/L
    population: non-ataxic reference individuals
    notes: >-
      Reported as a normal median of 3.4 microg/l with a range of 0.5 to 17.2 microg/l in
      the comparison group of the 90-patient AOA2 cohort. No LOINC code is bound: LOINC is
      not among the ontologies this repository can validate, and the contract forbids
      writing an identifier that cannot be looked up.
    evidence:
    - reference: PMID:19696032
      reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        itself higher than the normal level (3.4 microg/l, range from 0.5 to 17.2
        microg/l)
      explanation: Source of the normal alpha-fetoprotein interval recorded here.
  notes: >-
    A screening threshold rather than a reference-range boundary: sequencing SETX in
    non-Friedreich, non-ataxia-telangiectasia ataxic patients whose alpha-fetoprotein is at
    or above 7 microg/l was validated as a diagnostic strategy in the 90-patient cohort,
    with a 0.23% probability of missing a case. That threshold sits inside the quoted
    normal range because it is tuned for sensitivity in a preselected ataxic population,
    which is why it is recorded here and not as an interpretation band.
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, selection of patients with an AFP level above 7 microg/l for senataxin
      gene sequencing is a good strategy for AOA2 diagnosis.
    explanation: Establishes the validated screening threshold described in the notes.

genetic:

- name: SETX
  gene_term:
    preferred_term: SETX
    term:
      id: hgnc:445
      label: SETX
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in SETX cause
    this disease. Allelic heterogeneity is extensive - 25 new mutations were added by the
    90-patient cohort alone - and most reported alleles are truncating. Missense alleles
    inside the helicase domain behave as partial-loss alleles clinically, giving a milder
    course than truncating or out-of-domain missense alleles.
  features: >-
    A compound heterozygous nonsense-plus-deletion genotype in a Taiwanese patient
    illustrates the usual allelic architecture: SETX c.6859C > T (p.R2287X) with
    c.7034-7036del.
  notes: >-
    The same gene causes a mechanistically distinct dominant disease. Heterozygous
    gain-of-function SETX missense alleles cause amyotrophic lateral sclerosis type 4
    (ALS4), curated in dismech as Juvenile Amyotrophic Lateral Sclerosis; carriers of a
    single recessive loss-of-function allele do not develop ALS.
  evidence:
  - reference: PMID:14770181
    reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of the fifteen mutations cause premature termination of a large DEAxQ-box
      helicase, the human ortholog of yeast Sen1p, involved in RNA maturation and
      termination.
    explanation: >-
      Original gene identification and the basis for the predominantly truncating allele
      spectrum.
  - reference: PMID:35203940
    reference_title: "A Novel SETX Mutation in a Taiwanese Patient with Autosomal Recessive Cerebellar Ataxia Detected by Targeted Next-Generation Sequencing, and a Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A compound heterozygous mutation of SETX c.6859C > T (p.R2287X) and c.7034-7036del
      was identified.
    explanation: Source of the worked compound-heterozygous genotype quoted in features.
  - reference: PMID:34922620
    reference_title: De novo pathogenic variant in SETX causes a rapidly progressive neurodegenerative disorder of early childhood-onset with severe axonal polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in SETX cause two distinct neurological diseases, a
      loss-of-function recessive disorder, ataxia with oculomotor apraxia type 2 (AOA2),
      and a dominant gain-of-function motor neuron disorder, amyotrophic lateral sclerosis
      type 4 (ALS4).
    explanation: >-
      Supports the note that this recessive loss-of-function disease and dominant ALS4 are
      separate SETX disorders with opposite variant mechanisms.


animal_models:

- name: Setx-disrupted mouse
  species: Mus musculus
  genotype: Setx gene disruption (homozygous)
  publication: PMID:24637776
  description: >-
    The mouse in which the R-loop hypothesis for this disease was tested directly. Setx
    disruption does produce the expected molecular lesion - R-loop accumulation, failed
    meiotic recombination and infertility - but only where cells divide. The same study
    looked in brain and found nothing, in Setx, Atm, Tdp1 and Aptx models alike. It is
    included here because a negative result in the tissue that degenerates is the most
    informative thing any model has said about this disease.
  modeled_mechanisms:
  - target: Failure of Co-Transcriptional R-Loop Resolution
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Reproduces senataxin-dependent R-loop accumulation, but only in proliferating tissue.
    limitations: >-
      The R-loop phenotype is confined to dividing cells. No R-loop accumulation was
      detectable in brain, so the model does not demonstrate the lesion in the post-mitotic
      neurons that degenerate in patients, and its authors concluded that R-loop
      accumulation does not contribute to the neurodegenerative phenotype of these
      recessive ataxias.
    readouts:
    - name: R-loop abundance in proliferating tissue
      target: Failure of Co-Transcriptional R-Loop Resolution
      direction: INCREASED
      interpretation: >-
        Confirms that loss of senataxin leaves co-transcriptional hybrids unresolved where
        the assay can see them.
      evidence:
      - reference: PMID:24637776
        reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Depletion of Setx led to high basal levels of R-loops and these were enhanced
          further by DNA damage both in vitro and in vivo in tissues with proliferating
          cells.
        explanation: The positive arm of the readout, in dividing tissue.
    - name: R-loop abundance in brain
      target: Failure of Co-Transcriptional R-Loop Resolution
      direction: UNCHANGED
      interpretation: >-
        A real negative result, not an unmeasured one - the assay was applied to brain and
        found no accumulation.
      evidence:
      - reference: PMID:24637776
        reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          There was no evidence for accumulation of R-loops in the brains of mice where
          Setx, Atm, Tdp1 or Aptx genes were disrupted.
        explanation: The negative arm of the readout, in the tissue that degenerates.
    evidence:
    - reference: PMID:24637776
      reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Disruption of the Setx gene, defective in ataxia oculomotor apraxia type 2 (AOA2)
        leads to the accumulation of DNA/RNA hybrids (R-loops), failure of meiotic
        recombination and infertility in mice.
      explanation: >-
        Establishes that this model is informative for the senataxin R-loop node, which is
        what makes its negative brain result meaningful.
  notes: >-
    The model's overt phenotype is infertility from failed meiotic recombination, not
    ataxia or neuropathy, so it is not a phenotypic model of the human disease and no
    phenotype-level link is asserted.
  evidence:
  - reference: PMID:24637776
    reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disruption of the Setx gene, defective in ataxia oculomotor apraxia type 2 (AOA2)
      leads to the accumulation of DNA/RNA hybrids (R-loops), failure of meiotic
      recombination and infertility in mice.
    explanation: Describes the model and its reported phenotype.

differential_diagnoses:

- name: Ataxia with oculomotor apraxia type 1
  description: >-
    The other oculomotor-apraxia ataxia, caused by biallelic APTX variants. It shares
    cerebellar ataxia, oculomotor apraxia and axonal neuropathy, and its own biochemical
    markers overlap enough to matter.
  distinguishing_features:
  - Earlier onset - a mean of 7.7 years in the largest AOA1 series, against a mean of 15.1 years here.
  - Hypoalbuminaemia is characteristic of AOA1 and is not a feature here.
  - >-
    Alpha-fetoprotein does not separate the two cleanly. It is raised in only 41% of AOA1
    patients but the elevation is real, and in AOA1 it correlates with disease duration
    whereas here it is stable from onset. Use the magnitude and the albumin, not the
    presence or absence of an elevation.
  - Molecular testing identifies biallelic APTX rather than SETX.
  evidence:
  - reference: PMID:29356829
    reference_title: "Clinical, Biomarker, and Molecular Delineations and Genotype-Phenotype Correlations of Ataxia With Oculomotor Apraxia Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of α-fetoprotein (AFP) were found in 33 patients (41%);
      hypoalbuminemia, in 50 (63%).
    explanation: >-
      Quantifies both discriminators - the partial alpha-fetoprotein overlap and the
      hypoalbuminaemia that AOA1 has and this disease does not.

- name: Spinocerebellar ataxia with axonal neuropathy type 1
  description: >-
    SCAN1, caused by a single recurrent homozygous TDP1 missense variant. The clinical
    picture overlaps closely - the MONDO-preferred name of this entry places the two in the
    same series - but the molecular lesion is in single-strand-break repair rather than
    R-loop resolution.
  distinguishing_features:
  - Caused by the recurrent TDP1 p.H493R variant rather than by biallelic SETX loss.
  - >-
    The variant mechanism differs in kind. SCAN1 is not a simple loss of function: Tdp1-null
    mice are normal, and the H493R protein retains residual activity and becomes covalently
    trapped on DNA, so SCAN1 behaves as a recessive neomorphic allele. This disease is
    straightforward biallelic loss of senataxin.
  - >-
    The primary repair defect is in single-strand-break repair; AOA2 cells show a
    double-strand-break rejoining defect with normal single-strand-break repair.
  - >-
    Alpha-fetoprotein does not discriminate the two, despite being the marker that drives
    the diagnostic pathway here. An Omani SCAN1 series found elevated serum alpha-fetoprotein
    in 3 of 4 patients and hypercholesterolaemia in 2 of 4, on a background of progressive
    ataxia, cerebellar atrophy and disabling axonal sensorimotor neuropathy - clinically and
    biochemically almost superimposable. Separation is molecular.
  - >-
    SCAN1 is far rarer, having been reported in a single Saudi family and subsequently in
    Omani families sharing a probable founder haplotype.
  evidence:
  - reference: PMID:20687496
    reference_title: Spinocerebellar ataxia with axonal neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Spinocerebellar ataxia with axonal neuropathy (SCAN 1) is an autosomal recessive
      disorder caused by a specific point mutation (c.1478A>G, p.H493R) in the
      tyrosyl-DNA phosphodiesterase (TDP1) gene.
    explanation: Establishes the distinct causal gene and variant of the SCAN1 differential.
  - reference: PMID:31182267
    reference_title: Spinocerebellar ataxia with axonal neuropathy type 1 revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In keeping with the initial description, our patients demonstrated progressive ataxia,
      cerebellar atrophy and disabling axonal sensori-motor neuropathy (n = 4),
      hypercholesterolemia (n = 2) and elevated serum alpha fetoprotein (n = 3).
    explanation: >-
      Shows that elevated alpha-fetoprotein occurs in SCAN1 too, which is why it is recorded
      here as a non-discriminating feature rather than as a distinguishing one.
  - reference: PMID:17948061
    reference_title: "Spinocerebellar ataxia with axonal neuropathy: consequence of a Tdp1 recessive neomorphic mutation?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This result provides a direct demonstration that Tdp1 repairs Topo I covalent lesions
      in vivo and suggests that SCAN1 arises from the recessive neomorphic mutation H493R.
    explanation: >-
      Establishes the neomorphic character of the SCAN1 allele, which is the mechanistic
      distinction from this disease's plain loss of function.

- name: Amyotrophic lateral sclerosis type 4
  description: >-
    The dominant SETX disease. It is not a differential in the usual clinical sense - the
    phenotypes barely overlap - but it is the one that matters when a SETX variant is
    reported, because the variant mechanism is opposite and a single heterozygous
    loss-of-function allele causes neither disease.
  distinguishing_features:
  - Heterozygous gain-of-function SETX missense alleles, not biallelic loss of function.
  - Motor neuron disease with pyramidal signs and distal wasting rather than cerebellar ataxia with sensory neuropathy.
  - Alpha-fetoprotein is not a feature.
  - Curated separately in dismech as Juvenile Amyotrophic Lateral Sclerosis.
  evidence:
  - reference: PMID:29725819
    reference_title: Senataxin mutations elicit motor neuron degeneration phenotypes and yield TDP-43 mislocalization in ALS4 mice and human patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dominant, gain-of-function mutations in the senataxin gene (SETX) cause ALS4, but
      the mechanistic basis for motor neuron toxicity is unknown.
    explanation: >-
      States the dominant gain-of-function mechanism that separates ALS4 from this
      recessive loss-of-function disease.

- name: Ataxia-telangiectasia
  description: >-
    The paradigm DNA-repair ataxia and the diagnosis that has to be excluded before the
    alpha-fetoprotein-guided SETX pathway is used, since it too raises alpha-fetoprotein.
  distinguishing_features:
  - Telangiectasia, immunodeficiency, radiosensitivity and cancer predisposition are features of ataxia-telangiectasia and not of this disease.
  - >-
    Cellular radiosensitivity discriminates: AOA2 cells are sensitive to hydrogen peroxide,
    camptothecin and mitomycin C but not to ionising radiation.
  - Earlier onset, typically in early childhood.
  evidence:
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AOA2 cells are sensitive to H2O2, camptothecin, and mitomycin C, but not to ionizing
      radiation, and sensitivity was rescued with full-length SETX cDNA.
    explanation: >-
      The cellular discriminator against ataxia-telangiectasia, in which radiosensitivity
      is the defining laboratory abnormality.

discussions:

- discussion_id: r_loop_neuronal_relevance
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    R-loop resolution is senataxin's best-characterised activity and is lost in this
    disease, but Setx-disrupted mice accumulate R-loops only in proliferating tissue and
    not in brain. Is R-loop accumulation the operative lesion in the post-mitotic neurons
    that actually degenerate, or is the neurodegeneration driven by a different senataxin
    function?
  attaches_to:
  - pathophysiology#Failure of Co-Transcriptional R-Loop Resolution
  - pathophysiology#Defective Double-Strand Break Repair and Oxidative Genome Damage
  - animal_models#Setx-disrupted mouse
  rationale: >-
    This is not a gap in the evidence but a conflict within it. The R-loop mechanism is
    solidly established in cycling cells and in vitro, and the double-strand-break repair
    defect is measured in patient-derived lines - both are proliferating systems. The one
    study that looked for R-loops in the tissue that degenerates found none, in Setx, Atm,
    Tdp1 and Aptx models alike, and its authors concluded that R-loop accumulation does not
    explain the neurodegenerative phenotype of these ataxias. The entry keeps the R-loop
    chain because it is what senataxin does and because nothing better has replaced it, but
    the edges from it to the two degeneration nodes are marked INDIRECT_UNKNOWN_INTERMEDIATES
    for this reason, and a curator reading the pathograph should not take the chain as
    settled.
  evidence:
  - reference: PMID:24637776
    reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      They also suggest that R-loop accumulation does not contribute to the
      neurodegenerative phenotype in these autosomal recessive ataxias.
    explanation: >-
      The authors' own conclusion, which is the mismatch this discussion records.
  - reference: PMID:24637776
    reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disruption of the Setx gene, defective in ataxia oculomotor apraxia type 2 (AOA2)
      leads to the accumulation of DNA/RNA hybrids (R-loops), failure of meiotic
      recombination and infertility in mice.
    explanation: >-
      Establishes that the mouse model does accumulate R-loops where cells divide, which
      is what makes the negative brain result a mismatch rather than a null model.

- discussion_id: afp_elevation_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does biallelic senataxin loss raise serum alpha-fetoprotein? No step between the
    helicase defect and hepatic alpha-fetoprotein regulation has been identified, and the
    marker is used diagnostically without being understood.
  attaches_to:
  - pathophysiology#Elevated Serum Alpha-Fetoprotein
  - biochemical#Serum alpha-fetoprotein
  rationale: >-
    The elevation is one of the most reliable features of the disease - present in every
    family in the first phenotypic series, stable across the illness, and validated as a
    screening trigger - which makes the absence of any mechanistic account conspicuous
    rather than merely incomplete. The same marker is raised in ataxia-telangiectasia and
    in a minority of AOA1 patients, so any explanation probably has to be common to the
    DNA-repair ataxias rather than specific to senataxin. The causal edge from the SETX
    node to this one is recorded as INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.

notes: >-
  Relative frequency. Among adults with non-Friedreich autosomal recessive cerebellar
  ataxia, this disease accounted for about 8% of the first large European/North African
  series - more than ataxia-telangiectasia or AOA1 in that cohort - and a later review
  ranks it the third most common recessive ataxia after Friedreich ataxia and
  ataxia-telangiectasia. Those are proportions among ataxia patients, not population
  occurrence, so they are recorded here rather than as prevalence records; the one
  population figure available is in the prevalence section.

  Ontology bindings. Every CURIE in this entry was selected against the repository's term
  caches and OAK rather than taken from the deep-research report. The Perplexity report's
  term validation flagged 9 of 19 checked labels as naming a different term than the report
  claimed - CL:0000103 offered as "dorsal root ganglion neuron" when CL calls it bipolar
  neuron, UBERON:0001898 offered as "brainstem" when it is hypothalamus, and six NCIT
  clinical-action codes naming unrelated concepts - plus one invented HP identifier, so
  none of its suggestions were used. The report also gave two different HGNC identifiers
  for SETX across two runs (HGNC:10761 and HGNC:10740), neither of which is correct; the
  binding here is hgnc:445, read from MONDO's own RO:0004003 relation and the repository
  HGNC cache.

  No LOINC code is bound to the alpha-fetoprotein reference range. LOINC has no adapter in
  conf/oak_config.yaml, so a LOINC identifier could not be looked up, and writing one from
  memory is exactly what the ontology contract forbids.


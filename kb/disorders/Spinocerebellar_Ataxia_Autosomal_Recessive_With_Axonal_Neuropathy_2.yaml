pathophysiology:

- name: Biallelic SETX Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Senataxin is a 2,677-residue nuclear protein whose C-terminal region carries a
    superfamily-1 DEAxQ-box helicase domain homologous to yeast Sen1p. Disease alleles are
    biallelic and predominantly truncating - two-thirds of the mutations in the original
    fifteen families caused premature termination - with missense changes distributed both
    inside and outside the helicase domain. The distinction is not cosmetic: helicase-domain
    missense alleles track with a milder course than truncating alleles, which is the
    clearest genotype-phenotype signal in the disease and the main argument that the
    phenotype is graded by residual senataxin function rather than by an all-or-nothing loss.
  molecular_functions:
  - preferred_term: senataxin RNA/DNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Co-Transcriptional R-Loop Resolution
    causal_link_type: DIRECT
    description: >-
      Loss of helicase activity is the direct molecular consequence of the biallelic
      truncating and missense alleles, and R-loop resolution is the best-characterised
      activity that is lost.
    evidence:
    - reference: PMID:21700224
      reference_title: Human senataxin resolves RNA/DNA hybrids formed at transcriptional pause sites to promote Xrn2-dependent termination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Senataxin, a helicase protein associated with AOA2/ALS4 neurodegenerative
        disorders, acts to resolve these R-loop structures and by so doing allows access
        of the 5'-3' exonuclease Xrn2 at 3' cleavage poly(A) sites.
      explanation: >-
        Attributes R-loop resolution to senataxin specifically, so loss of the helicase
        is the direct cause of the failure modelled by the downstream node.
  - target: Elevated Serum Alpha-Fetoprotein
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Raised alpha-fetoprotein is a constant accompaniment of biallelic SETX loss, but no
      intermediate step between the helicase defect and hepatic AFP regulation has been
      identified, so the link is asserted only as an association with unknown intermediates.
  evidence:
  - reference: PMID:14770181
    reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of the fifteen mutations cause premature termination of a large DEAxQ-box
      helicase, the human ortholog of yeast Sen1p, involved in RNA maturation and
      termination.
    explanation: >-
      The gene-identification paper, establishing both the causal gene and the
      predominantly truncating character of the disease alleles.
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyramidal signs and dystonia were more frequent and disease was less severe with
      missense mutations in the helicase domain of senataxin gene than with missense
      mutations out of helicase domain and deletion and nonsense mutations
    explanation: >-
      Supports the graded relationship between allele class and severity described on
      this node.

- name: Failure of Co-Transcriptional R-Loop Resolution
  biological_scale: MOLECULAR
  description: >-
    Nascent transcripts anneal back to the template behind elongating RNA polymerase II,
    forming RNA:DNA hybrids that are especially prevalent over G-rich pause sites downstream
    of poly(A) signals. Senataxin unwinds these hybrids, which is what lets the 5'-3'
    exonuclease Xrn2 reach the cleaved 3' transcript and terminate transcription. Without
    senataxin the hybrids persist. Note that the evidence for this step is biochemical and
    from cycling cells; whether it is the operative lesion in post-mitotic neurons is the
    open question modelled in the discussions section.
  biological_processes:
  - preferred_term: R-loop resolution at transcriptional pause sites
    term:
      id: GO:0062176
      label: R-loop processing
    modifier: DECREASED
  downstream:
  - target: Defective Double-Strand Break Repair and Oxidative Genome Damage
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persistent hybrids are converted into double-strand breaks through
      replication-transcription conflict and processing of the displaced strand. In
      Setx-disrupted mice R-loops co-localise with high basal double-strand-break levels,
      but only in proliferating tissue.
    evidence:
    - reference: PMID:24637776
      reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        R-loops were coincident in cells showing high basal levels of DNA double strand
        breaks and in those cells undergoing apoptosis.
      explanation: >-
        Links R-loop persistence to double-strand-break burden and cell death, but in
        proliferating tissue - hence INDIRECT for the neuronal claim.
    - reference: PMID:24637776
      reference_title: "R-loops in proliferating cells but not in the brain: implications for AOA2 and other autosomal recessive ataxias."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There was no evidence for accumulation of R-loops in the brains of mice where
        Setx, Atm, Tdp1 or Aptx genes were disrupted.
      explanation: >-
        Directly contradicts the R-loop step operating in the tissue that degenerates in
        this disease; recorded here rather than omitted so the weakness of the edge is
        visible on the graph.
  evidence:
  - reference: PMID:21700224
    reference_title: Human senataxin resolves RNA/DNA hybrids formed at transcriptional pause sites to promote Xrn2-dependent termination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that nascent transcripts form RNA/DNA hybrid structures (R-loops) behind
      elongating Pol II and are especially prevalent over G-rich pause sites positioned
      downstream of gene poly(A) signals.
    explanation: >-
      Establishes where the hybrids that senataxin resolves are formed, which is the
      substrate of this node.
  - reference: PMID:29916023
    reference_title: "Senataxin, A Novel Helicase at the Interface of RNA Transcriptome Regulation and Neurobiology: From Normal Function to Pathological Roles in Motor Neuron Disease and Cerebellar Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies of yeast Sen1p and mammalian SETX protein have revealed a range of important
      RNA regulatory functions, including resolution of R-loops to permit transcription
      termination, and RNA splicing.
    explanation: >-
      Review statement of the coupling between R-loop resolution and transcription
      termination that this node describes.

- name: Defective Double-Strand Break Repair and Oxidative Genome Damage
  biological_scale: CELLULAR
  description: >-
    Patient-derived AOA2 cells carry a measurable DNA-damage-response defect. They are
    hypersensitive to hydrogen peroxide, camptothecin and mitomycin C but, unlike
    ataxia-telangiectasia cells, not to ionising radiation; they show constitutive oxidative
    DNA damage and chromosomal instability after oxidative challenge; and they rejoin
    peroxide-induced double-strand breaks poorly while repairing single-strand breaks
    normally. Complementation with full-length SETX cDNA reverses both the sensitivity and
    the repair defect, which is what makes this a senataxin-dependent phenotype rather than
    a property of the cell lines. The single-strand-break result is the discriminating one:
    it separates this disease mechanistically from AOA1 and SCAN1, where single-strand-break
    repair is the primary lesion.
  biological_processes:
  - preferred_term: rejoining of oxidative DNA double-strand breaks
    term:
      id: GO:0006302
      label: double-strand break repair
    modifier: DECREASED
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  downstream:
  - target: Cerebellar Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic genotoxic stress in a long-lived, transcriptionally active post-mitotic
      neuron is the standard explanation offered for cerebellar vulnerability across the
      DNA-repair ataxias, but the intermediate steps have not been demonstrated for
      senataxin specifically.
  - target: Sensory Neuron and Length-Dependent Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same argument is applied to dorsal root ganglion neurons and their long
      peripheral axons, and rests on the same untested intermediates.
  evidence:
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Rejoining of H2O2-induced DNA double-strand breaks (DSBs) was significantly reduced
      in AOA2 cells compared to controls, and there was no evidence for a defect in DNA
      single-strand break repair.
    explanation: >-
      The measurement behind this node, including the negative single-strand-break result
      that distinguishes it from AOA1 and SCAN1.
  - reference: PMID:17562789
    reference_title: "Senataxin, defective in ataxia oculomotor apraxia type 2, is involved in the defense against oxidative DNA damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AOA2 cells exhibited constitutive oxidative DNA damage and enhanced chromosomal
      instability in response to H2O2.
    explanation: Supports the oxidative-damage component of this node.

- name: Cerebellar Purkinje Cell Degeneration
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    Progressive cerebellar degeneration is the imaging-visible endpoint: cerebellar atrophy
    is present in 96% of genetically confirmed patients and, like the alpha-fetoprotein
    elevation, is already established at or near symptom onset rather than accruing
    gradually over the illness. The cellular substrate is inferred from the cerebellar
    syndrome and from the shared pathology of the recessive DNA-repair ataxias rather than
    from AOA2 autopsy series, which are scarce.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Progressive cerebellar ataxia
    causal_link_type: DIRECT
  - target: Cerebellar atrophy
    causal_link_type: DIRECT
  - target: Gait ataxia
    causal_link_type: DIRECT
  - target: Oculomotor apraxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Saccade initiation failure is grouped with the cerebellar syndrome here because it
      appears in the same patients and evolves with them, but the lesion responsible for
      oculomotor apraxia has not been localised in this disease, and the sign is absent in
      roughly half of patients, so the edge is explicitly indirect.
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increased AFP level as well as cerebellar atrophy seem to be stable in the course
      of the disease and to occur mostly at or before the onset of the disease.
    explanation: >-
      Supports the timing claim on this node - cerebellar atrophy is established at or
      before onset rather than accruing later.

- name: Sensory Neuron and Length-Dependent Axonal Degeneration
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    A severe axonal sensorimotor polyneuropathy is the most consistent feature of the
    disease, present in 97.5% of confirmed patients - more consistent than cerebellar
    atrophy and far more consistent than the oculomotor sign. It is length-dependent, so it
    presents distally as weakness, wasting and sensory loss, and in the later course it can
    dominate the examination to the point of masking cerebellar and pyramidal findings.
  cell_types:
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  locations:
  - preferred_term: dorsal root ganglion
    term:
      id: UBERON:0000044
      label: dorsal root ganglion
  - preferred_term: peripheral nerve
    term:
      id: UBERON:0001021
      label: nerve
  downstream:
  - target: Axonal sensorimotor polyneuropathy
    causal_link_type: DIRECT
  - target: Distal muscle weakness
    causal_link_type: DIRECT
  - target: Areflexia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of pyramidal signs in most patients may be explained by masking due to
      severe motor neuropathy.
    explanation: >-
      Supports the claim that the neuropathy is severe enough to mask other neurological
      findings in the later course.
  - reference: PMID:14770181
    reference_title: "Senataxin, the ortholog of a yeast RNA helicase, is mutant in ataxia-ocular apraxia 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have now identified causative mutations in 15 families, which allows us to
      clinically define this entity by onset between 10 and 22 years, cerebellar atrophy,
      axonal sensorimotor neuropathy, oculomotor apraxia and elevated alpha-fetoprotein
      (AFP).
    explanation: >-
      Establishes axonal sensorimotor neuropathy as part of the defining phenotype of the
      molecularly confirmed entity.

- name: Elevated Serum Alpha-Fetoprotein
  biological_scale: ORGANISM
  description: >-
    Serum alpha-fetoprotein is raised in essentially all patients and, unlike the
    hypoalbuminaemia of AOA1, does not drift with disease duration - it is present at or
    before onset and then stable. The median at diagnosis in the 90-patient cohort was 31.0
    microg/l against a normal median of 3.4 microg/l. No mechanism connecting senataxin loss
    to hepatic alpha-fetoprotein regulation has been established; the marker is used
    clinically without being understood, which is recorded as a knowledge gap below.
  downstream:
  - target: Elevated circulating alpha-fetoprotein concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with AOA2, median AFP serum level was 31.0 microg/l at diagnosis
    explanation: Quantifies the alpha-fetoprotein elevation in the largest published cohort.
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AFP levels were elevated in 100% of the families, making it a useful biological
      marker.
    explanation: >-
      Supports treating the elevation as a near-constant feature and a usable biological
      marker.

phenotypes:

- name: Progressive cerebellar ataxia
  category: Neurological
  frequency: VERY_FREQUENT
  description: >-
    Progressive gait and limb incoordination beginning after normal early development,
    usually in the second decade. Onset in the 90-patient series and in the original
    fifteen families clusters between 10 and 22 years, with a mean of 15.1 years in the
    first detailed phenotypic study.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301333
    reference_title: Ataxia with Oculomotor Apraxia Type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ataxia with oculomotor apraxia type 2 (AOA2) is characterized by onset of ataxia
      between age three and 30 years after initial normal development, axonal sensorimotor
      neuropathy, oculomotor apraxia, cerebellar atrophy, and elevated serum concentration
      of alpha-fetoprotein (AFP).
    explanation: >-
      GeneReviews clinical-characteristics statement establishing ataxia as a defining
      feature and giving the onset window.
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mean age at onset was 15.1 +/- 3.8 years.
    explanation: Quantifies the adolescent onset described for this phenotype.

- name: Gait ataxia
  category: Neurological
  frequency: VERY_FREQUENT
  description: >-
    Unsteady, wide-based gait is the presenting complaint in most patients and the feature
    that defines the syndrome shared by the three families in which the locus was mapped.
  phenotype_term:
    preferred_term: Gait ataxia
    term:
      id: HP:0002066
      label: Gait ataxia
  evidence:
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ataxia with oculomotor apraxia type 2 (AOA2) is a newly described autosomal
      recessive cerebellar ataxia (ARCA) defined by genetic location to 9q34 of three
      families sharing gait ataxia, oculomotor apraxia and/or elevated alpha-foetoprotein
      (AFP) levels.
    explanation: Names gait ataxia as one of the defining features of the mapped entity.

- name: Cerebellar atrophy
  category: Imaging
  frequency: VERY_FREQUENT
  description: >-
    Cerebellar atrophy on MRI, present in 96% of the 90-patient cohort. No patient in that
    series lacked both neuropathy and cerebellar atrophy, so the pair together is
    effectively obligate even though neither alone is.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polyneuropathy was found in 97.5% of AOA2 patients, cerebellar atrophy in 96%,
      occasional oculomotor apraxia in 51%, pyramidal signs in 20.5%, head tremor in 14%,
      dystonia in 13.5%, strabismus in 12.3% and chorea in 9.5%.
    explanation: >-
      Gives the 96% frequency of cerebellar atrophy in the largest genetically confirmed
      series, supporting the VERY_FREQUENT band.
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No patient was lacking both peripheral neuropathy and cerebellar atrophy.
    explanation: Supports the claim that the neuropathy/atrophy pair is jointly constant.

- name: Axonal sensorimotor polyneuropathy
  category: Neurological
  frequency: VERY_FREQUENT
  description: >-
    Length-dependent axonal sensorimotor polyneuropathy on clinical examination and nerve
    conduction studies, found in 97.5% of the 90-patient cohort and in 92% of the earlier
    18-patient series. It is the single most consistent feature of the disease.
  phenotype_term:
    preferred_term: Axonal sensorimotor polyneuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:19696032
    reference_title: "Ataxia with oculomotor apraxia type 2: clinical, biological and genotype/phenotype correlation study of a cohort of 90 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polyneuropathy was found in 97.5% of AOA2 patients, cerebellar atrophy in 96%,
      occasional oculomotor apraxia in 51%, pyramidal signs in 20.5%, head tremor in 14%,
      dystonia in 13.5%, strabismus in 12.3% and chorea in 9.5%.
    explanation: >-
      Gives the 97.5% frequency supporting the VERY_FREQUENT band for the neuropathy.
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensory motor neuropathy (92%) and choreic or dystonic movements (44%) were
      frequent.
    explanation: >-
      Independent cohort estimate of the sensorimotor neuropathy frequency.

- name: Oculomotor apraxia
  category: Neurological
  frequency: FREQUENT
  description: >-
    Failure to initiate voluntary horizontal saccades, compensated by head thrusts.
    Oculographically it is a lengthening of horizontal saccade latency with hypometria. The
    disease is named for this sign, but it is present in only about half of patients (51% in
    the 90-patient cohort, 56% in the 18-patient series), and a literature review of
    non-European cohorts found it rarer still in East Asian patients. It should not be
    treated as a required feature.
  phenotype_term:
    preferred_term: Oculomotor apraxia
    term:
      id: HP:0000657
      label: Oculomotor apraxia
  evidence:
  - reference: PMID:14736755
    reference_title: "Frequency and phenotypic spectrum of ataxia with oculomotor apraxia 2: a clinical and genetic study in 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oculomotor apraxia was observed in 56% of patients and characterized by increased
      horizontal saccade latencies and hypometria.
    explanation: >-
      Gives both the frequency supporting the FREQUENT band and the oculographic
      description used here.
  - reference: PMID:35203940
    reference_title: "A Novel SETX Mutation in a Taiwanese Patient with Autosomal Recessive Cerebellar Ataxia Detected by Targeted Next-Generation Sequencing, and a Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The literature review shows that ataxia, polyneuropathy, and elevated AFP are common
      features and ocular motor apraxia (OMA) is a variable sign of AOA2 from different
      populations.
    explanation: >-
      Supports the caution that oculomotor apraxia is variable rather than obligate
      despite naming the disease.

- name: Nystagmus
  category: Neurological
  description: >-
    Reported as a common eye finding in East Asian patients, in whom oculomotor apraxia is
    correspondingly uncommon. Frequency is deliberately left unset - the source is a
    literature review of case reports, not a frequency study.

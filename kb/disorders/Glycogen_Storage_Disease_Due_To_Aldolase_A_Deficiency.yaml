- name: Erythrocyte ATP Depletion and Membrane Instability
  biological_scale: CELLULAR
  description: >-
    Red cells have no mitochondria, so glycolysis is their only ATP source and
    an aldolase block is not survivable by any alternative route. The result is
    oxidative stress, membrane instability and shortened red cell lifespan.
  cell_types:
  - preferred_term: erythrocyte

    reference_title: "Beyond the Usual Suspects: Unexplained Childhood Hemolytic Anemia with Myopathy Unveiled as Glycogen Storage Disease Type XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient remains on intermittent transfusion support, folate supplementation, and physiotherapy."
    explanation: Documents ongoing transfusion support as the management of the anaemia.
  target_mechanisms:
  - target: Chronic Non-Spherocytic Hemolytic Anemia
    treatment_effect: RESTORES
    description: >-
      Transfusion replaces the red cell mass the haemolysis removes, without
      acting on the enzymatic lesion that causes it.
- name: Splenectomy
  description: >-
    Considered for transfusion-dependent haemolysis. In the one detailed report
    it ended transfusion dependence, though the patient's muscle disease
    continued to progress and was ultimately fatal.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  evidence:
  - reference: PMID:14615364
    reference_title: "Hemolytic anemia and severe rhabdomyolysis caused by compound heterozygous mutations of the gene for erythrocyte/muscle isozyme of aldolase, ALDOA(Arg303X/Cys338Tyr)."

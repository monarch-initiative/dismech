name: Glycogen Storage Disease Due To Aldolase A Deficiency
creation_date: "2026-09-05T10:00:00Z"
category: Mendelian
synonyms:
- GSD XII
- GSD12
- aldolase A deficiency
- ALDOA deficiency
- glycogen storage disease type XII
description: >-
  Glycogen storage disease type XII is an autosomal recessive glycolytic
  enzymopathy caused by biallelic ALDOA variants. Aldolase A is the only
  fructose-bisphosphate aldolase isozyme in erythrocytes and skeletal muscle, so
  one enzymatic lesion produces a two-organ disease: chronic non-spherocytic
  haemolytic anaemia and episodic rhabdomyolysis, classically triggered by
  fever.

  The mechanism that makes this disease distinctive is thermolability rather
  than simple loss of activity. Aldolase A is an unusually stable homotetramer,
  and the tetramer is what confers both thermal stability and the loop dynamics
  catalysis needs. Destabilizing missense alleles do not abolish catalysis; the
  crystal structure of a mimic of the clinical Asp128 mutation is a catalytically
  active dimer that has simply lost one of the tetramer's two subunit
  interfaces. The enzyme therefore works at normal body temperature and fails
  when the patient has a fever, which is why the episodes are triggered rather
  than continuous.

  That temperature dependence is also tissue-selective. In one family a
  thermolabile allele caused fever-induced rhabdomyolysis with no haemolytic
  anaemia at all, because the thermolability affected myoblasts and not
  erythrocytes. So the two-organ picture is a tendency of the disease, not a
  requirement of it, and an entry that treats haemolysis as obligatory would
  mis-describe the reported spectrum.

  The name is a historical artifact worth flagging: this is an enzymopathy of
  glycolysis rather than of glycogen breakdown, and it is grouped with the
  glycogen storage diseases because glycogen accumulates in muscle downstream of
  the block.

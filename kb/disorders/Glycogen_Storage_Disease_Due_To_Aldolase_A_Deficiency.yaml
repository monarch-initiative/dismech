    snippet: "We show that the underlying mechanism involves an exacerbation of aldolase A deficiency at high temperatures that affected myoblasts but not erythrocytes."
    explanation: Demonstrates the temperature dependence directly, and that it can be restricted to one of the two affected tissues.
  downstream:

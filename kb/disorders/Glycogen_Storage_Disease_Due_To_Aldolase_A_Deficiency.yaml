    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations included transfusion-dependent anemia until splenectomy at age 3 and increasing muscle weakness, with death at age 4 associated with rhabdomyolysis and hyperkalemia."
    explanation: Transfusion-dependent anaemia and its response to splenectomy in a molecularly confirmed patient.
  - reference: PMID:25392908
    reference_title: "A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis without hemolytic anemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a deleterious homozygous mutation in the ALDOA gene in 3 siblings with episodic rhabdomyolysis without hemolytic anemia."
    explanation: Three siblings with molecularly confirmed disease and no haemolytic anaemia, which refutes treating this phenotype as obligatory.

notes: >-
  Deep-research provenance. Curated alongside an OpenScientist report
  (research/Glycogen_Storage_Disease_Due_To_Aldolase_A_Deficiency-deep-research-openscientist.md),
  whose structural-biology thread was its most useful contribution: the crystal
  structure of the D128V dimer variant and the normal-mode analysis of aldolase
  oligomeric states together explain why a substitution away from the active
  site produces a thermolabile enzyme, which is the mechanistic core of this
  entry. The report's causal chain was otherwise consistent with the primary
  literature.

  Two things in the report were not carried across. It cites Lowry and Hanson
  1977 (PMID:890096), the earliest clinical description, for the developmental
  and dysmorphic features. That record has no abstract available in PubMed, so
  no evidence item is drawn from it here and the subset features are evidenced
  from PMID:41199518 instead. The report also devotes a finding to ALDOA
  overexpression in cancer under HIF-1alpha; that is a gain-of-expression
  context in the opposite direction from this loss-of-function disease and is
  deliberately absent from the entry.

  Ontology labels. The report suggested HP:0003236 under the label "Elevated
  circulating creatine kinase activity". HPO now names that term "Elevated
  circulating creatine kinase concentration", and the current label is used
  here. Several of its other suggested HPO labels were table column values such
  as "Lab / clinical sign" rather than term names, which is why its own term
  validation reported ten label mismatches without any of the CURIEs being
  wrong.

  The febrile trigger is deliberately left unbound. ECTO's temperature terms
  describe ambient exposure rather than endogenous fever, and binding one would
  assert the wrong exposure; the reasoning is recorded on the environmental
  entry itself.

  Related work. ALDOA appears in the IEMbase WP-007 package tracked in
  monarch-initiative/dismech#5562, whose repository audit in
  monarch-initiative/dismech#7801 lists it among the rows genuinely absent from
  the knowledge base. This entry covers that row.

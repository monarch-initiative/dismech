pathophysiology:
- name: Biallelic ALDOA Loss-of-Function or Destabilizing Variants
  biological_scale: MOLECULAR
  description: >-
    Two classes of allele converge on the same disease. Null alleles such as the
    active-site nonsense Arg303X remove the enzyme outright, while destabilizing
    missense alleles leave a catalytically competent but conformationally fragile
    protein. The second class is the more informative one, because it is what
    produces the triggered, episodic clinical course.
  gene:
    preferred_term: ALDOA
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:414
      label: ALDOA
  molecular_functions:
  - preferred_term: fructose-bisphosphate aldolase activity
    modifier: DECREASED
    term:
      id: GO:0004332
      label: fructose-bisphosphate aldolase activity
  evidence:
  - reference: PMID:14615364
    reference_title: "Hemolytic anemia and severe rhabdomyolysis caused by compound heterozygous mutations of the gene for erythrocyte/muscle isozyme of aldolase, ALDOA(Arg303X/Cys338Tyr)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The paternal allele encoded a nonsense mutation, Arg303X, in the enzyme-active site. The maternal allele encoded a missense mutation, Cys338Tyr, predicted to cause enzyme instability."
    explanation: One patient carrying one allele of each class, which is what shows the two classes converge.
  downstream:
  - target: Aldolase A Tetramer Destabilization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18453690
      reference_title: "Structure of a rabbit muscle fructose-1,6-bisphosphate aldolase A dimer variant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The D128V mutation causes aldolase to lose intermolecular contacts with the neighboring subunit at one of the two interfaces of the tetramer."
      explanation: A crystal structure showing the substitution acting on the tetramer interface rather than on the active site.
- name: Aldolase A Tetramer Destabilization
  biological_scale: MOLECULAR
  description: >-
    Aldolase A is normally an unusually stable tetramer of TIM-barrel subunits.
    A destabilizing substitution at the subunit interface yields a dimer that
    still turns substrate over, so the primary consequence is a loss of assembly
    rather than of chemistry. That matters because oligomerization is what
    stabilizes the enzyme and preserves the mobility of the catalytic loops, so
    losing an interface costs stability first and dynamics second.
  molecular_functions:
  - preferred_term: fructose-bisphosphate aldolase activity
    term:
      id: GO:0004332
      label: fructose-bisphosphate aldolase activity
  biological_processes:
  - preferred_term: protein homotetramerization
    modifier: DECREASED
    term:
      id: GO:0051289
      label: protein homotetramerization
  evidence:
  - reference: PMID:2335208
    reference_title: "The crystal structure of human muscle aldolase at 3.0 A resolution."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The active protein is a tetramer of 4 identical subunits each of which is composed of an eight-stranded alpha/beta-barrel structure."
    explanation: Establishes the normal quaternary structure that the destabilizing alleles disrupt.
  - reference: PMID:18453690
    reference_title: "Structure of a rabbit muscle fructose-1,6-bisphosphate aldolase A dimer variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The turnover of substrate to produce the product ligand demonstrates the retention of catalytic activity by the dimeric aldolase."
    explanation: The dimer is catalytically competent, which is why the defect presents as instability rather than as a constant enzymatic block.
  - reference: PMID:25982518
    reference_title: "Aldolases Utilize Different Oligomeric States To Preserve Their Functional Dynamics."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "oligomerization not only stabilizes the aldolase structures, showing fewer fluctuations at the subunit interfaces, but also allows the enzyme to achieve the required dynamics for its functional loops"
    explanation: Normal-mode analysis giving the general principle that links interface loss to both instability and impaired loop dynamics. It is indirect because the simulations are of bacterial class II aldolases, not of the human disease protein.
  downstream:
  - target: Thermolability of Residual Aldolase A Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2229018
      reference_title: "Human aldolase A of a hemolytic anemia patient with Asp-128----Gly substitution: characteristics of an enzyme generated in E. coli transfected with the expression plasmid pHAAD128G."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Conversion of Asp to Gly at the 128th position in the enzyme rendered the enzyme thermolabile and susceptible to tryptic digestion."
      explanation: Recombinant expression of the patient allele demonstrating that the substitution is what makes the enzyme thermolabile.
- name: Thermolability of Residual Aldolase A Activity
  biological_scale: MOLECULAR
  description: >-
    The mutant enzyme is functional at normal body temperature and destabilizes
    as temperature rises. This is the node that converts a constitutive genetic
    lesion into an episodic clinical disease, and it is why the triggers are
    febrile rather than dietary.
  molecular_functions:
  - preferred_term: fructose-bisphosphate aldolase activity
    modifier: DECREASED
    term:
      id: GO:0004332
      label: fructose-bisphosphate aldolase activity
  biological_processes:

    evidence_source: HUMAN_CLINICAL
    snippet: "transfusion-dependent anemia until splenectomy at age 3"
    explanation: Records the point at which transfusion dependence ended.
  target_mechanisms:
  - target: Chronic Non-Spherocytic Hemolytic Anemia
    treatment_effect: INHIBITS
    description: >-
      Removing the spleen removes the site at which the fragile red cells are
      preferentially destroyed.
- name: Ketogenic Diet
  description: >-
    Proposed as a way to supply an energy substrate that bypasses the glycolytic
    block for muscle and brain. The evidence is a single patient, in whom it was
    combined with antiepileptic treatment and followed by no further episodes,
    so the two interventions cannot be separated.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  evidence:
  - reference: PMID:35246226
    reference_title: "A new phenotype of aldolase a deficiency in a 14 year-old boy with epilepsy and rhabdomyolysis - case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "we propose a new therapeutic approach based on ketogenic diet in order to supply an energetic substrate for skeletal muscle and neurons"
    explanation: The proposal and its rationale. It is indirect because the reported outcome follows a combined dietary and antiepileptic regimen in one patient, so the diet's own contribution is not isolated.
  - reference: PMID:35246226
    reference_title: "A new phenotype of aldolase a deficiency in a 14 year-old boy with epilepsy and rhabdomyolysis - case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This led to a deceleration of the disease with no other acute episodes of seizures and rhabdomyolysis, without any side effects observed."
    explanation: The reported outcome, which the entry describes as attributable to the combined regimen rather than the diet alone.
  target_mechanisms:
  - target: Skeletal Myocyte Energy Failure Under Catabolic Stress
    treatment_effect: BYPASSES
    description: >-
      Ketone bodies enter energy metabolism downstream of the aldolase step, so
      they are proposed as a substrate that does not require the blocked
      reaction.
- name: Exercise Adaptation and Caution With Pre-Exercise Carbohydrate
  description: >-
    Lifestyle adaptation with carefully titrated exercise. The point worth
    flagging is that immediate pre-exercise carbohydrate, which helps in the
    glycogenolytic defects such as McArdle disease, can make glycolytic defects
    worse, and aldolase A deficiency is a glycolytic defect. The intuitive
    advice for a glycogen storage disease is the wrong advice here.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:30397902
    reference_title: "Myopathies Related to Glycogen Metabolism Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Immediate pre-exercise carbohydrate improves symptoms in the glycogenolytic defects (i.e., PYGM), but can exacerbate symptoms in glycolytic defects (i.e., PFK)."
    explanation: The review states the principle for glycolytic defects using PFK as its example rather than ALDOA, so applying it here is an inference from the shared class of lesion.
  - reference: PMID:30397902
    reference_title: "Myopathies Related to Glycogen Metabolism Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy for glycogen storage diseases that result in exercise-induced symptoms includes lifestyle adaptation and carefully titrated exercise."
    explanation: The general management principle for this disease group.
  target_mechanisms:
  - target: Skeletal Myocyte Energy Failure Under Catabolic Stress
    treatment_effect: INHIBITS
    description: >-
      Titrating exertion keeps demand below the point at which the residual
      glycolytic capacity fails.
diagnosis:
- name: Molecular sequencing of ALDOA
  description: >-
    Definitive diagnosis. The erythrocyte aldolase activity assay exists but is
    not widely available, so in practice a metabolic-myopathy or
    hereditary-anaemia panel or exome sequencing is the route.
  evidence:
  - reference: PMID:34171939
    reference_title: "Glycogen storage disease type XII; an ultra rare cause of hemolytic anemia and rhabdomyolysis: one new case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis should be confirmed by the mutation analysis of ALDOA gene."
    explanation: States that molecular confirmation is required.
  - reference: PMID:41199518
    reference_title: "Beyond the Usual Suspects: Unexplained Childhood Hemolytic Anemia with Myopathy Unveiled as Glycogen Storage Disease Type XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing revealed compound heterozygous pathogenic mutations in the ALDOA gene"
    explanation: Exome sequencing as the route that reached the diagnosis in practice.
- name: Recognizing the anaemia-plus-myopathy combination
  description: >-
    The diagnostic problem is that each half is unremarkable on its own. In one
    reported patient years passed under a working diagnosis of inflammatory
    myositis, treated with steroids and methotrexate, before the combination was
    read as a single metabolic disease.
  evidence:
  - reference: PMID:41199518
    reference_title: "Beyond the Usual Suspects: Unexplained Childhood Hemolytic Anemia with Myopathy Unveiled as Glycogen Storage Disease Type XII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With a provisional diagnosis of inflammatory myositis, she was given a trial treatment of steroids and methotrexate, but the symptoms persisted."
    explanation: The misdiagnosis and its cost, which is what makes recognizing the combination a diagnostic step in its own right.

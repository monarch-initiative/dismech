environmental:
- name: Febrile illness
  description: >-
    The characteristic trigger. Fever raises tissue temperature past the point
    at which the thermolabile enzyme holds together, so an intercurrent
    infection converts a compensated metabolic state into an acute crisis. This
    is why antipyresis is treatment rather than comfort care here.
  exposure_term:
    preferred_term: febrile illness
  influences_mechanisms:
  - target: Thermolability of Residual Aldolase A Activity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure acts on the temperature-dependence node directly, by
      supplying the temperature.
    evidence:
    - reference: PMID:25392908
      reference_title: "A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis without hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Myoglobinuria was always triggered by febrile illnesses."
      explanation: In three siblings every episode followed a febrile illness, which is as close to a controlled trigger as this literature offers.
  evidence:
  - reference: PMID:34171939
    reference_title: "Glycogen storage disease type XII; an ultra rare cause of hemolytic anemia and rhabdomyolysis: one new case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Episodes of rhabdomyolysis can be triggered by febrile illnesses and catabolic processes."
    explanation: An independent report naming febrile illness as a trigger.
  notes: >-
    Left unbound to an ontology term deliberately. ECTO models exposures to
    things in the environment, and its temperature terms (for example
    ECTO:4000001, exposure to increased temperature) describe ambient
    temperature rather than endogenous fever. Binding one of those here would
    assert the wrong exposure.

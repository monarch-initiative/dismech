treatments:
- name: Aggressive Antipyresis and Trigger Avoidance
  description: >-
    The mechanistically motivated intervention. Because the enzyme fails as
    temperature rises, keeping temperature down during an intercurrent illness
    acts on the lesion rather than only on symptoms.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34171939
    reference_title: "Glycogen storage disease type XII; an ultra rare cause of hemolytic anemia and rhabdomyolysis: one new case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment includes management of hemolytic anemia and administration of antipyretics during febrile episodes to avoid hemolysis and rhabdomyolysis."
    explanation: States antipyresis during fever as the preventive measure for both arms of the disease.
  target_mechanisms:
  - target: Thermolability of Residual Aldolase A Activity
    treatment_effect: INHIBITS
    description: >-
      Lowering body temperature removes the condition under which the residual
      enzyme unfolds.
- name: Blood Transfusion
  description: >-
    Supportive management of the haemolytic anaemia, which is transfusion
    dependent in a substantial share of reported patients.
  therapeutic_modality: OTHER
  treatment_term:

      label: protein stabilization
  evidence:
  - reference: PMID:2825199
    reference_title: "Human aldolase A deficiency associated with a hemolytic anemia: thermolabile aldolase due to a single base mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results of E. coli expression of the mutated aldolase A enzyme confirmed the thermolabile nature of the abnormal enzyme."
    explanation: Recombinant confirmation that the thermolability belongs to the mutant protein rather than to the patient's cellular context.
  - reference: PMID:25392908
    reference_title: "A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis without hemolytic anemia."
    supports: SUPPORT

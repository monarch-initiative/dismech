    Often present from infancy and frequently transfusion-dependent, with
    reticulocytosis, indirect hyperbilirubinaemia and raised lactate
    dehydrogenase. It is not obligatory: one reported family had thermolabile
    disease with no haemolysis at all.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Chronic non-spherocytic hemolytic anemia
    term:

differential_diagnoses:
- name: Other glycolytic and glycogenolytic myopathies
  description: >-
    Phosphofructokinase deficiency, phosphoglycerate mutase deficiency and
    beta-enolase deficiency share the exercise-induced rhabdomyolysis, and
    McArdle disease shares it from the glycogenolytic side. The discriminator
    that matters clinically is the response to pre-exercise carbohydrate, which
    separates the two halves of the group in opposite directions.
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the glycogen metabolism disorders that affect skeletal muscle involve enzymes in glycogenolysis"
    explanation: Places ALDOA within a group defined by shared clinical presentation but split by which half of the pathway is affected.
- name: Inflammatory myositis
  description: >-
    The label a patient with unexplained myopathy and raised creatine kinase
    receives by default, and the one that delayed a molecular diagnosis by years
    in a reported case.

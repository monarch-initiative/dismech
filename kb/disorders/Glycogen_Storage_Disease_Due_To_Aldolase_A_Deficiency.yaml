    explanation: Documents the misdiagnosis this differential exists to prevent.
discussions:
- discussion_id: gsd12_arginine_rescue_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does arginine rescue aldolase A deficiency in patient
    myoblasts, and does it work in patients?
  attaches_to:
  - pathophysiology#Thermolability of Residual Aldolase A Activity
  rationale: >-
    Arginine restored aldolase A activity in patient myoblasts while three other
    established chemical chaperones did not, which the authors take as evidence
    that it is not acting as a chaperone. What it is doing instead is unknown,
    and the result has not been tested in a patient. This is the only reported
    lead toward a mechanism-directed therapy for the disease, so the gap is
    worth naming rather than folding into supportive care.
  evidence:
  - reference: PMID:25392908
    reference_title: "A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis without hemolytic anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The aldolase A deficiency was rescued by arginine supplementation in vitro but not by glycerol, betaine or benzylhydantoin, three other known chaperones, suggesting that arginine-mediated rescue operated by a mechanism other than protein chaperoning."
    explanation: The rescue, the negative controls, and the authors' own statement that the mechanism is not chaperoning.
- discussion_id: gsd12_tissue_selective_thermolability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the thermolability of a mutant aldolase A tissue-selective, sparing
    erythrocytes in some families?
  attaches_to:
  - pathophysiology#Thermolability of Residual Aldolase A Activity
  rationale: >-
    The same protein is expressed in both affected tissues, so a purely
    intrinsic thermodynamic defect should affect both. One family had
    thermolability that affected myoblasts but not erythrocytes, which implies
    that something about the cellular context modulates the mutant enzyme's
    stability. Nothing in the reported literature identifies what. Until it is
    known, an entry cannot predict from genotype which of the two organs a given
    patient will present with.
  evidence:
  - reference: PMID:25392908
    reference_title: "A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis without hemolytic anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results expand the clinical spectrum of aldolase A deficiency to isolated temperature-dependent rhabdomyolysis, and suggest that thermolability may be tissue specific."
    explanation: The authors state the tissue specificity as a suggestion, which is the uncertainty this gap records.

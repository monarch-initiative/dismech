      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ALDOA is a glycolytic enzyme that catalyzes the reversible conversion of fructose-1,6-bisphosphate to glyceraldehyde 3-phosphate"
      explanation: Names the reaction that the destabilized enzyme fails to sustain.
- name: Block at Step Four of Glycolysis
  biological_scale: CELLULAR
  description: >-
    Loss of aldolase A activity halts the cleavage of fructose-1,6-bisphosphate
    into dihydroxyacetone phosphate and glyceraldehyde-3-phosphate, cutting
    glycolytic ATP output in the two tissues that have no other aldolase
    isozyme. The consequences then split by tissue, because erythrocytes have no
    alternative to glycolysis at all while muscle depends on it only under
    stress.
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:14615364
    reference_title: "Hemolytic anemia and severe rhabdomyolysis caused by compound heterozygous mutations of the gene for erythrocyte/muscle isozyme of aldolase, ALDOA(Arg303X/Cys338Tyr)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "converts fructose-1,6-bisphosphate to dihydroxyacetone phosphate and glyceraldehyde-3-phosphate"
    explanation: The reaction that the block interrupts.
  downstream:
  - target: Erythrocyte ATP Depletion and Membrane Instability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41199518
      reference_title: "Beyond the Usual Suspects: Unexplained Childhood Hemolytic Anemia with Myopathy Unveiled as Glycogen Storage Disease Type XII."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Its deficiency leads to oxidative stress, membrane instability, and chronic non-spherocytic hemolytic anemia due to impaired ATP production in erythrocytes"
      explanation: States the erythrocyte arm from the enzymatic block to the anaemia.
  - target: Skeletal Myocyte Energy Failure Under Catabolic Stress
    causal_link_type: DIRECT

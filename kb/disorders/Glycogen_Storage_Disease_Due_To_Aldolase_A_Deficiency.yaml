- name: Skeletal Myocyte Energy Failure Under Catabolic Stress
  biological_scale: CELLULAR
  description: >-
    Muscle tolerates reduced aldolase activity at rest and fails when demand
    rises, which is why the episodes are provoked by fever or exertion rather
    than being continuous. Patient myoblasts also accumulate lipid droplets, and
    that accumulation is increased by cytokines and reduced by dexamethasone,
    which places the inflammatory context of a febrile illness inside the
    mechanism rather than beside it.

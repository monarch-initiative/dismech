name: Hereditary Sensory and Autonomic Neuropathy Type 1A
creation_date: "2026-09-24T16:18:15Z"
category: Mendelian
description: >-
  HSAN1A is the SPTLC1 form of hereditary sensory and autonomic neuropathy type
  1, and the most common dominantly inherited degenerative disorder of
  peripheral sensory neurons. It is a slowly progressive, length-dependent
  axonal neuropathy that begins, usually in the second or third decade, with
  loss of pain and temperature sensation in the feet, followed by lancinating
  pain, distal wasting and weakness, painless injuries and chronic acral ulcers
  that lead to osteomyelitis and distal amputation. Despite the name, motor
  involvement is common and autonomic involvement is usually mild.

  Heterozygous missense variants in SPTLC1, the LCB1 subunit of serine
  palmitoyltransferase (SPT), shift the enzyme's amino acid preference from
  L-serine towards L-alanine and glycine. The enzyme then condenses
  palmitoyl-CoA with those amino acids to make the atypical sphingoid bases
  1-deoxysphinganine and 1-deoxymethylsphinganine, which lack the C1 hydroxyl
  group, cannot be converted into complex sphingolipids or degraded by the
  canonical route, accumulate in plasma and tissue, and are toxic to sensory
  and motor neurons. Because the pathogenic step is a new product rather than
  the loss of the normal one, oral L-serine, the enzyme's canonical substrate,
  competes the reaction back towards normal products. It lowers plasma
  1-deoxysphingolipids and slowed neuropathy progression in a
  placebo-controlled trial. The same metabolites are linked to macular
  telangiectasia type 2, which most examined HSAN1 patients also have.

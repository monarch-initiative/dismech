progression:
- phase: Sequential symptom onset
  age_range: first symptom median 20 years (range 14-54)
  notes: >-
    The order of events is unusually predictable. Sensory symptoms come first at
    a median age of 20, weakness follows about 7.6 years later, ulcers about
    8.1, pain about 9.5 and balance difficulty about 11.4 years after the first
    symptom. Men were affected earlier than women in the natural-history cohort.
    Because subtle sensory symptoms often begin in the early teens, the authors
    argue this is a paediatric-onset disease and that treatment is best started
    in childhood.
  evidence:
  - reference: PMID:25042817
    reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of weakness, ulcers, pain, and balance problems followed sensory problems sequentially on average 7.6, 8.1, 9.5, and 11.4 years later, respectively"
    explanation: The measured intervals between the milestones.
  - reference: PMID:25042817
    reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at symptom onset was less in men than it was in women (21 years vs. 30 years, P = 0.04)."
    explanation: The sex difference in onset age in the same cohort.
treatments:
- name: Oral L-Serine Supplementation
  description: >-
    Substrate competition rather than enzyme replacement: supplying the
    canonical substrate in excess pushes the mutant enzyme back towards serine
    and away from alanine and glycine, lowering production of the neurotoxic
    deoxysphingolipids. It is the only disease-modifying treatment tested in a
    randomised trial in this disease. At 400 mg/kg/day for a year the treated
    group improved on the Charcot-Marie-Tooth Neuropathy Score relative to
    placebo while deoxysphinganine fell, with no serious treatment-related
    adverse effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral L-serine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: 1-Deoxysphingolipid Accumulation
    description: >-
      Excess dietary L-serine competes with L-alanine and glycine at the mutant
      enzyme, reducing formation of the neurotoxic metabolites.
    evidence:
    - reference: PMID:30626650
      reference_title: "Randomized trial of l-serine in patients with hereditary sensory and autonomic neuropathy type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Concomitantly, deoxysphinganine levels dropped in l-serine-treated but not placebo-treated participants"
      explanation: >-
        Randomised evidence that the treatment lowers the mechanistic
        metabolite, which is the specific claim this link makes.
  evidence:
  - reference: PMID:30626650
    reference_title: "Randomized trial of l-serine in patients with hereditary sensory and autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSION: High-dose oral l-serine supplementation appears safe in patients with HSAN1 and is potentially effective at slowing disease progression."
    explanation: >-
      The trial's own conclusion, stated with the hedge the authors used. The
      trial enrolled 18 participants, so this is a small Class I result rather
      than a definitive one.
  - reference: PMID:30626650
    reference_title: "Randomized trial of l-serine in patients with hereditary sensory and autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 1 year, the l-serine group experienced improvement in CMTNS relative to the placebo group"
    explanation: >-
      The clinical outcome, which is what separates this from the earlier
      metabolite-only evidence.
  - reference: PMID:22045570
    reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, a 10% L-alanine–enriched diet increased dSL levels and led to severe peripheral neuropathy."
    explanation: >-
      The reciprocal alanine arm in the C133W mouse moves both the metabolite
      and the phenotype in the opposite direction, which is the strongest test
      that substrate competition is the operative mechanism.
  - reference: PMID:22045570
    reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a pilot study with 14 HSAN1 patients, L-serine supplementation similarly reduced dSL levels."
    explanation: >-
      The open-label pilot that preceded the randomised trial, quoted for the
      human arm of the paper only.

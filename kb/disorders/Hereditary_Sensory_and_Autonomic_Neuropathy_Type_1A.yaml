biochemical:
- name: Plasma 1-deoxysphingolipids
  presence: INCREASED
  notes: >-
    Measured by mass spectrometry of plasma or serum. Elevated across several
    SPTLC1 genotypes, it is both the mechanistic marker and the pharmacodynamic
    endpoint used to show that L-serine engages the mechanism. It is not
    specific to this disease: the same metabolites are elevated in metabolic
    syndrome, type 2 diabetes and in macular telangiectasia type 2 without an
    SPT variant, so the measurement supports a genotype rather than replacing
    it.
  evidence:
  - reference: PMID:20097765
    reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated DSB levels were also found in the plasma of HSAN1 patients and confirmed in three groups of HSAN1 patients with different SPTLC1 mutations."
    explanation: >-
      The plasma elevation, replicated across three SPTLC1 genotypes, which is
      what makes it usable as a marker rather than a single-family observation.
  - reference: PMID:30626650
    reference_title: "Randomized trial of l-serine in patients with hereditary sensory and autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concomitantly, deoxysphinganine levels dropped in l-serine-treated but not placebo-treated participants"
    explanation: >-
      The marker moving with treatment in a randomised comparison, which is what
      makes it a pharmacodynamic endpoint.

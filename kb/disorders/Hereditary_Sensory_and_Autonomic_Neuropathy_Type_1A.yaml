- name: Allele-Specific Antisense Oligonucleotide Silencing of Mutant SPTLC1
  description: >-
    Preclinical only. Because the disease is caused by a product the mutant
    allele makes rather than by loss of the normal one, silencing the mutant
    transcript and leaving the wild-type allele intact is mechanistically the
    right target. GalNAc-conjugated locked-nucleic-acid gapmer antisense
    oligonucleotides against the p.S331F allele achieved over 90% mutant
    transcript silencing in liver and dorsal root ganglia of S331F mice, lowered
    blood 1-deoxysphingoid bases and reversed the aberrant dorsal-root-ganglion
    gene expression. No human study has been performed, and the construct is
    allele specific, so it would have to be remade for each variant.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: SPTLC1
      term:
        id: hgnc:11277
        label: SPTLC1
    target_transcript: mutant SPTLC1 p.S331F transcript
    oligonucleotide_chemistry: LOCKED_NUCLEIC_ACID
  delivery_system:
    delivery_platform: CONJUGATE
    targeting_ligand: GALNAC
  treatment_term:
    preferred_term: allele-specific antisense oligonucleotide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: 1-Deoxysphingolipid Accumulation
    description: >-
      Removing the mutant transcript removes the enzyme subunit that makes the
      atypical products, which lowers the metabolite itself rather than
      competing with it.
    evidence:
    - reference: PMID:41124364
      reference_title: "Antisense oligonucleotides reverse SPTLC1-related hereditary sensory neuropathy in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GalNAc-LNA-ASOs also resulted in significantly reduced blood levels of 1-deoxysphingoid bases (1-deoxySL), neurotoxic metabolites used as biomarkers in HSN1A patients."
      explanation: >-
        The metabolite falls on treatment in the mouse, which is the specific
        claim this link makes.
  evidence:
  - reference: PMID:41124364
    reference_title: "Antisense oligonucleotides reverse SPTLC1-related hereditary sensory neuropathy in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Single subcutaneous injection of ASOs into neonatal or adult S331F mice achieved over 90% mutant transcript silencing in liver and dorsal root ganglia (DRG)."
    explanation: >-
      The silencing result in the tissue that matters for this disease. It is a
      mouse result throughout; nothing here has been tested in patients.
  - reference: PMID:41124364
    reference_title: "Antisense oligonucleotides reverse SPTLC1-related hereditary sensory neuropathy in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data provide necessary in vivo evidence as proof of concept for ASO-mediated mutant-allele-specific silencing as a therapeutic approach for SPTLC1-related HSN1."
    explanation: >-
      The authors' own statement of what the work establishes, which is proof of
      concept rather than efficacy.
animal_models:
- name: tgSPTLC1(C133W) transgenic mouse
  species: Mouse
  genotype: transgenic overexpression of human SPTLC1 p.C133W
  publication: PMID:16210380
  description: >-
    Mice ubiquitously overexpressing the human C133W mutant subunit develop an
    age-dependent sensory and motor phenotype with loss of large myelinated
    axons in dorsal and ventral roots, and at later ages a distal small-fibre
    neuropathy. Crossing them with mice overexpressing wild-type SPTLC1 largely
    reverses the phenotype, and heterozygous Sptlc1 knockout mice with reduced
    SPT activity are normal, so the model supports a toxic product rather than
    lost enzyme activity. It is the model in which dietary serine and alanine
    were shown to move the metabolite and the phenotype in opposite directions.
  evidence:
  - reference: PMID:16210380
    reference_title: "Mutant SPTLC1 dominantly inhibits serine palmitoyltransferase activity in vivo and confers an age-dependent neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report here that SPTLC1(C133W) mice develop age-dependent weight loss and mild sensory and motor impairments."
    explanation: >-
      Establishes that the transgenic mouse develops a relevant phenotype,
      which is what makes it informative for the human mechanism.
  modeled_mechanisms:
  - target: Sensory and Motor Neuron Toxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Age-dependent degeneration of sensory and motor axons on the background of
      a disease-causing human allele, with the small-fibre component apparent
      only at later ages.
    limitations: >-
      The model overexpresses a human transgene rather than carrying a
      heterozygous endogenous variant, so the mutant dose is not the human one.
      The impairments were described as mild at the age first reported, and the
      mouse does not reproduce the acral ulceration and amputation that dominate
      human morbidity.
    readouts:
    - name: Large myelinated axon content of spinal roots
      target: Sensory and Motor Neuron Toxicity
      direction: DECREASED
      interpretation: >-
        Structural correlate of the axonal degeneration node in this model.
      evidence:
      - reference: PMID:16210380
        reference_title: "Mutant SPTLC1 dominantly inhibits serine palmitoyltransferase activity in vivo and confers an age-dependent neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Aged SPTLC1(C133W) mice lose large myelinated axons in the ventral root of the spinal cord and demonstrate myelin thinning."
        explanation: The histological measurement behind this readout.
    - name: Sensory phenotype after wild-type SPTLC1 co-overexpression
      target: Sensory and Motor Neuron Toxicity
      direction: RESTORED
      interpretation: >-
        Rescue by excess wild-type subunit, which is the model's evidence that
        the mutant protein is not itself toxic.
      evidence:
      - reference: PMID:19923297
        reference_title: "Overexpression of the wild-type SPT1 subunit lowers desoxysphingolipid levels and rescues the phenotype of HSAN1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This phenotype is largely reversed when these mice are crossed with transgenic mice overexpressing wild-type SPTLC1 showing that the mutant SPTLC1 protein is not inherently toxic."
        explanation: The rescue result behind this readout.
  - target: 1-Deoxysphingolipid Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The mouse makes the same atypical deoxysphingoid bases as patients, and
      they respond to dietary substrate in the expected direction.
    readouts:
    - name: Plasma deoxysphingolipid level on L-serine-enriched diet
      target: 1-Deoxysphingolipid Accumulation
      direction: DECREASED
      interpretation: >-
        Substrate competition lowers the metabolite in vivo, alongside improved
        motor and sensory performance.
      evidence:
      - reference: PMID:22045570
        reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mice bearing a transgene expressing the C133W SPTLC1 mutant linked to HSAN1, a 10% L-serine–enriched diet reduced dSL levels. L-serine supplementation also improved measures of motor and sensory performance as well as measures of male fertility."
        explanation: >-
          The dietary arm of the mouse experiment, measuring both the metabolite
          and function.
differential_diagnoses:
- name: Hereditary sensory and autonomic neuropathy type 1C
  description: >-
    The SPTLC2 form. Clinically indistinguishable from HSAN1A and
    mechanistically identical at the level of deoxysphingolipid production, so
    the distinction is made by which SPT subunit carries the variant. Curated
    separately as Hereditary_Sensory_and_Autonomic_Neuropathy_Type_1C.
- name: Amyotrophic lateral sclerosis 27, juvenile
  description: >-
    Also caused by heterozygous SPTLC1 variants, but a different disease: those
    variants impair homeostatic restraint of the enzyme and drive excess
    canonical sphingolipid synthesis without raising deoxysphingolipids, and
    they present as childhood motor neuron disease with sensory sparing. Serum
    deoxysphingolipid measurement separates the two. Curated separately as
    Amyotrophic_Lateral_Sclerosis_27_Juvenile.
- name: Diabetic sensory neuropathy
  description: >-
    Presents very similarly, and plasma deoxysphingolipids are also elevated in
    type 2 diabetes and metabolic syndrome, so the biomarker does not by itself
    separate the two. Genotype and family history do.
- name: Charcot-Marie-Tooth disease type 2B
  description: >-
    RAB7-related axonal neuropathy with prominent sensory loss and ulceromutilating
    complications, and the other dominant cause screened alongside SPTLC1 in
    adult-onset ulceromutilating neuropathy.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.2
  notes: >-
    Quoted as 1 in 500,000 for hereditary sensory neuropathy type 1 as a whole,
    which includes the SPTLC2 form, so it is an upper bound on HSAN1A rather
    than a figure for it. The statement is a background sentence in a mouse
    therapy paper citing earlier work, not an epidemiological survey of its own,
    and no source consulted gives a rate for the SPTLC1 form specifically.
  evidence:
  - reference: PMID:41124364
    reference_title: "Antisense oligonucleotides reverse SPTLC1-related hereditary sensory neuropathy in a mouse model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary sensory neuropathy type I (HSN1) is a neurodegenerative disorder, affecting 1 in 500 000 individuals in the general population."
    explanation: >-
      The only population figure found for this disease group. Quoted from the
      paper's introduction, where it cites earlier work rather than reporting a
      measurement of its own.
    quote_role: BACKGROUND
discussions:
- discussion_id: hsan1a_lof_versus_neomorph
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#SPTLC1 Variant Shifts Serine Palmitoyltransferase Substrate Preference
  prompt: >-
    Do HSAN1A-associated SPTLC1 variants reduce canonical serine
    palmitoyltransferase activity, or only add the alanine- and
    glycine-condensing activity?
  rationale: >-
    Early work reported reduced SPT activity for C133W, C133Y and V144D, and the
    first transgenic mouse paper was titled on dominant inhibition of the
    enzyme. A later uniform isotope-labelling re-assay of eleven SPTLC1 and six
    SPTLC2 mutants found canonical serine activity was not reduced in any of
    them, and that the Ser331 variants, which cause the most severe disease,
    showed increased canonical activity. The two accounts are not reconciled in
    the literature. The difference is not cosmetic: it decides whether this is a
    neomorphic or a loss-of-function disease, and therefore whether substrate
    competition alone is the right therapeutic principle. This entry follows the
    later uniform re-assay, supported by the mouse genetics, in which halving
    SPT activity produces no neuropathy and excess wild-type subunit rescues the
    mutant phenotype.
- discussion_id: hsan1a_serine_trial_size
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Oral L-Serine Supplementation
  prompt: >-
    How much of the neuropathy is arrested by lowering deoxysphingolipids, and
    how early must treatment start?
  rationale: >-
    The randomised trial enrolled 18 participants and 16 completed it, so a
    1.5-unit CMTNS difference at one year is a real but small result in a
    disease measured in decades. Two questions follow. First, the natural
    history places the first symptoms at a median age of 20 with subtle
    symptoms years earlier, and the authors of that study argue the optimal
    window for intervention is childhood, which no trial has tested. Second,
    intraepidermal nerve fibre density at the thigh is the biomarker proposed
    for future trials, and it was a secondary outcome here rather than a
    demonstrated responder. Whether the treatment arrests, slows or merely
    delays the degeneration is not settled by the existing data.
  proposed_experiments:
  - experiment_id: hsan1a_early_serine_ienfd
    name: Early L-serine intervention with skin-biopsy endpoint
    description: >-
      Treat genetically confirmed but minimally symptomatic young carriers with
      oral L-serine and follow thigh intraepidermal nerve fibre density
      alongside plasma deoxysphingolipids and the Charcot-Marie-Tooth
      Neuropathy Score, with untreated carriers of similar age as comparators.
    would_support:
    - treatments#Oral L-Serine Supplementation
    supporting_outcome:
    - >-
      Preserved thigh intraepidermal nerve fibre density and stable neuropathy
      scores in treated carriers against decline in untreated ones, which would
      show the treatment protects innervation rather than only lowering a
      metabolite.
    would_refute:
    - treatments#Oral L-Serine Supplementation
    refuting_outcome:
    - >-
      Plasma deoxysphingolipid falls as expected while nerve fibre density
      declines at the untreated rate, which would show the metabolite is a
      marker of a lesion already established rather than its ongoing driver.
- discussion_id: hsan1a_macular_telangiectasia_ascertainment
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Macular Telangiectasia
  prompt: >-
    How often do people with SPTLC1-related HSAN1 have macular telangiectasia
    type 2, and does treatment change it?
  rationale: >-
    The single study that examined HSAN1 patients ophthalmologically found the
    retinal phenotype in 9 of 13, against a population rate near 1 in 5000, so
    the association is not in doubt. The rate is another matter: the series is
    small, the patients were examined because the link was suspected, and the
    four without a definite diagnosis were all under 50 and taking serine
    supplements, which the authors suggest may delay onset. That last point
    makes the frequency and the treatment question the same question, and
    neither has been addressed prospectively.
notes: >-
  This entry is a separate Disease rather than a subtype row on
  Hereditary_Sensory_and_Autonomic_Neuropathy. That parent entry carries an
  HSAN1 subtype scoped to SPTLC1, and the corpus already splits HSAN1C, HSN1D,
  HSAN1E, HSAN2 and HSAN6 into their own entries, so a separate 1A entry follows
  the established pattern. The parent's SPTLC1 mechanism node is the same
  mechanism seen from the group level; a conforms_to link is deliberately not
  asserted, because conformance targets a kb/modules/ module and the parent is a
  disease entry.

  SPTLC1 causes two distinct diseases and this entry is only one of them.
  HSAN1A variants shift the enzyme's amino acid preference and raise
  deoxysphingolipids; the variants that cause juvenile ALS27 sit in a
  transmembrane region, impair ORMDL feedback restraint of the enzyme, and drive
  excess canonical sphingolipid synthesis without raising deoxysphingolipids.
  The two are curated as separate entries and listed as differentials of each
  other. The line between them is not perfectly clean at Ser331: S331F and S331Y
  are curated here as severe HSAN1A alleles, and S331Y has also been reported in
  the juvenile ALS series, which is why the differential entry describes an
  overlap rather than a partition.

  Two phenotypes are deliberately left unbound, with the searches recorded in
  their own notes fields: painless injury of insensate limbs, and surgical
  amputation for neuropathic infection. In both cases HPO has terms that look
  close and assert something the sources do not say, which is a worse error than
  an absent binding.

  No prevalence record is curated. GeneReviews gives no figure, and none of the
  sources consulted reports a population frequency for SPTLC1-related HSAN1
  specifically. The one rate quoted in the entry, roughly 1 in 5000, is the
  population rate of macular telangiectasia type 2 and belongs to that
  phenotype's evidence rather than to this disease.

  Frequency bands come from the 23-patient natural-history cohort, whose
  patients are 20 C133Y and 3 C133W carriers from two families. That is the best
  systematic phenotype data available, and it is two founder alleles in two
  kindreds, so the bands should be read as this genotype's picture rather than
  the whole allelic spectrum's. The Ser331 variants in particular cause a
  markedly more severe, earlier-onset disease than the cohort describes.

  quote_role marks two kinds of quotation here. REVIEW_SYNTHESIS marks every
  quote from the GeneReviews chapter, which synthesises work it did not perform.
  BACKGROUND marks two sentences taken from paper introductions: the clinical
  consequence of losing pain sensation, quoted from the SPTLC1 gene-discovery
  paper whose own result is a mutation screen, and the population rate of
  macular telangiectasia type 2, quoted from a study whose own results are the
  exome and organoid work.

      reference_title: "SPTLC1-Related Hereditary Sensory Neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ankle/foot orthotics for foot drop; arthrodesis for Charcot joints"
      explanation: >-
        The GeneReviews management recommendation naming arthrodesis for Charcot
        joints. The quote carries the neighbouring orthotics recommendation with
        it because the source lists both in one clause.

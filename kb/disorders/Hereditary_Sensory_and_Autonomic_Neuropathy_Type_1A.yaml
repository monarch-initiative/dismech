inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous SPTLC1 missense variants segregate with disease in large
    multigenerational kindreds. Most probands have an affected parent, and
    offspring of an affected person have a 50% chance of inheriting the variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301564
    reference_title: "SPTLC1-Related Hereditary Sensory Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTLC1-related HSN is inherited in an autosomal dominant manner. Most probands have an affected parent."
    explanation: >-
      The GeneReviews statement of the inheritance pattern for SPTLC1-related
      hereditary sensory neuropathy.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:11242114
    reference_title: "Mutations in SPTLC1, encoding serine palmitoyltransferase, long chain base subunit-1, cause hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening revealed 3 different missense mutations resulting in changes to 2 amino acids in all affected members of 11 HSN1 families."
    explanation: >-
      Heterozygous SPTLC1 variants were present in all affected members of
      eleven families, which is the segregation evidence for dominant
      transmission.
  - reference: PMID:16364956
    reference_title: "Clinical, pathological and genetic characterization of hereditary sensory and autonomic neuropathy type 1 (HSAN I)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including lack of penetrance of the SPTLC1 mutation in some individuals, variability in age of onset along with an earlier age of onset in younger generations"
    explanation: >-
      Qualifies the dominant pattern: penetrance is incomplete and onset age
      varies within and between families, with apparently earlier onset in
      younger generations. The inheritance is dominant, but carrying the variant
      does not fix when, or whether, the carrier becomes symptomatic.
genetic:
- name: SPTLC1
  gene_term:
    preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense variants. The founding alleles C133Y, C133W and V144D
    lie in exons 5 and 6, and C133Y and C133W are the recurrent founder
    alleles. Variants at Ser331 cause an early-onset severe form with prominent
    weakness. The originally reported G387A variant was later shown not to be
    disease associated. SPTLC1 variants that instead cause excess canonical
    sphingolipid synthesis produce a different disease, juvenile ALS27, which is
    curated separately as Amyotrophic_Lateral_Sclerosis_27_Juvenile.
  evidence:
  - reference: PMID:11242114
    reference_title: "Mutations in SPTLC1, encoding serine palmitoyltransferase, long chain base subunit-1, cause hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found two mutations to be located in exon 5 (C133Y and C133W) and one mutation to be located in exon 6 of SPTLC1 (V144D)."
    explanation: Names the founding causative SPTLC1 alleles and their exons.
  - reference: PMID:11242106
    reference_title: "SPTLC1 is mutated in hereditary sensory neuropathy, type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here that the gene encoding a subunit of serine palmitoyltransferase is located within the HSN1 locus, expressed in dorsal root ganglia (DRG) and mutated in HSN1."
    explanation: >-
      Independent simultaneous identification of SPTLC1 as the HSN1 gene, noting
      its expression in the dorsal root ganglia that degenerate in this disease.
  - reference: PMID:19132419
    reference_title: "A systematic comparison of all mutations in hereditary sensory neuropathy type I (HSAN I) reveals that the G387A mutation is not disease associated."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This indicates that the G387A mutation is most likely not directly associated with HSAN I."
    explanation: >-
      Removes G387A from the causative allele set, so the gene-disease claim
      rests on the functionally confirmed variants rather than on all four
      originally reported ones.
  - reference: PMID:24247255
    reference_title: "Early-onset severe hereditary sensory and autonomic neuropathy type 1 with S331F SPTLC1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In accordance with previous reports, a mutation in Ser331 in the present patient was associated with early-onset and a severe phenotype."
    explanation: >-
      Records the Ser331 genotype-phenotype correlation within SPTLC1.
  - reference: PMID:36964315
    reference_title: "Spectrum of SPTLC1-related disorders: a novel case of 'Ser331 syndrome' that expand the phenotype of hereditary sensory and autonomic neuropathy type 1A and motor neuron diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report adds to the growing evidence of the existence of an overlap between hereditary neuropathy and motor neuron disease caused by pathogenic p.S331Y variant in SPTLC1 gene."
    explanation: >-
      Evidence that Ser331 sits on the boundary between this disease and the
      SPTLC1 motor neuron disease: the same variant is reported with features of
      both, which is why the entry describes an overlap rather than a clean
      split by variant position.
  - reference: PMID:22302274
    reference_title: "Frequency of mutations in the genes associated with hereditary sensory and autonomic neuropathy in a UK cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Cys133Trp mutation in SPTLC1 is the most common cause of HSAN in the UK population and should be screened first in all patients with sporadic or autosomal dominant HSAN."
    explanation: >-
      Gives SPTLC1 C133W its place in the genetic differential: in a 140-patient
      UK cohort screened across six HSAN genes, it was the single commonest
      cause, which is why it is sequenced first there.
  - reference: PMID:11479835
    reference_title: "Hereditary sensory neuropathy type I: haplotype analysis shows founders in southern England and Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Australian and English families may therefore have a common founder who, on the basis of historical information, has been determined to have lived in southern England prior to 1800."
    explanation: >-
      Haplotype evidence that the recurrent C133W allele is a founder mutation
      rather than a recurrent mutation hotspot, which is why it dominates
      British and Australian series in particular.
pathophysiology:
- name: SPTLC1 Variant Shifts Serine Palmitoyltransferase Substrate Preference
  biological_scale: MOLECULAR
  description: >-
    Serine palmitoyltransferase catalyses the condensation of palmitoyl-CoA with
    L-serine, the first and rate-limiting step of de novo sphingolipid
    synthesis. HSAN1A variants in the SPTLC1 subunit enhance the enzyme's
    activation of L-alanine and of glycine as alternative substrates, so the
    mutant enzyme makes products the wild-type enzyme makes only in trace
    amounts. Kinetic work on C133W found wild-type and mutant enzymes to have
    similar affinities for both serine and alanine, locating the defect in
    activation of alanine rather than in substrate binding, which is why the
    variant is curated as neomorphic rather than as a loss of function.
  molecular_functions:
  - preferred_term: serine C-palmitoyltransferase activity
    term:
      id: GO:0004758
      label: serine C-palmitoyltransferase activity
    modifier: DYSREGULATED
  genetic_context:
    gene:
      preferred_term: SPTLC1
      term:
        id: hgnc:11277
        label: SPTLC1
    functional_impact_category: NEOMORPHIC
  evidence:
  - reference: PMID:20097765
    reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that the HSAN1 mutations induce a shift in the substrate specificity of SPT, which leads to the formation of the two atypical deoxy-sphingoid bases (DSBs) 1-deoxy-sphinganine and 1-deoxymethyl-sphinganine."
    explanation: >-
      The substrate-shift result itself, naming both atypical products, which is
      the claim this node makes.
  - reference: PMID:20504773
    reference_title: "A disease-causing mutation in the active site of serine palmitoyltransferase causes catalytic promiscuity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, the enzymes also had similar affinities for alanine, indicating that the major affect of the C133W mutation is to enhance activation of alanine for condensation with the acyl-CoA substrate."
    explanation: >-
      Kinetic evidence that the defect is in activating alanine rather than in
      binding it or in losing serine affinity, which is the specific basis for
      the neomorphic grading.
  - reference: PMID:26681808
    reference_title: "HSAN1 mutations in serine palmitoyltransferase reveal a close structure-function-phenotype relationship."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite earlier reports, canonical activity with l-serine was not reduced in any of the investigated SPT mutants."
    explanation: >-
      A uniform isotope-labelling re-assay of eleven SPTLC1 and six SPTLC2
      mutants finds canonical serine activity intact, the evidence against
      reading these variants as loss of function.
  - reference: PMID:19923297
    reference_title: "Overexpression of the wild-type SPT1 subunit lowers desoxysphingolipid levels and rescues the phenotype of HSAN1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Simple loss of SPT activity also cannot account for the HSAN1 phenotype, since heterozygous SPTLC1 knock-out mice have reduced SPT activity but are otherwise normal."
    explanation: >-
      The in vivo counterpart of the same argument: halving SPT activity in mice
      produces no neuropathy, so reduced activity is not the pathogenic step.
  downstream:
  - target: 1-Deoxysphingolipid Accumulation
    description: >-
      Condensation of palmitoyl-CoA with L-alanine yields 1-deoxysphinganine and
      with glycine yields 1-deoxymethylsphinganine.
    evidence:
    - reference: PMID:20097765
      reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consequently, they accumulate in the cell, as demonstrated in HEK293 cells overexpressing mutant SPTLC1 and lymphoblasts of HSAN1 patients."
      explanation: >-
        Links the enzymatic shift to accumulation of the products, in cells
        expressing the mutant subunit and in patient lymphoblasts.
- name: 1-Deoxysphingolipid Accumulation
  biological_scale: MOLECULAR
  description: >-
    1-deoxysphinganine and 1-deoxymethylsphinganine lack the C1 hydroxyl group
    of a canonical sphingoid base. That hydroxyl is required both for conversion
    into complex sphingolipids and for entry into the normal degradation route,
    so these metabolites accumulate rather than turning over. They are elevated
    in the plasma of patients carrying several different SPTLC1 alleles, which
    makes this node the disease's accessible biomarker as well as its mechanism.
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
    modifier: DYSREGULATED
  chemical_entities:
  - preferred_term: 1-deoxysphinganine
    term:
      id: CHEBI:67106
      label: 1-deoxysphinganine
    modifier: INCREASED
  evidence:
  - reference: PMID:20097765
    reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both metabolites lack the C(1) hydroxyl group of sphinganine and can therefore neither be converted to complex sphingolipids nor degraded."
    explanation: >-
      The chemical reason the products accumulate instead of being metabolised,
      which is what this node asserts.
  - reference: PMID:20097765
    reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated DSB levels were also found in the plasma of HSAN1 patients and confirmed in three groups of HSAN1 patients with different SPTLC1 mutations."
    explanation: >-
      Confirms the accumulation in patients rather than only in transfected
      cells, across three SPTLC1 genotypes.
  - reference: PMID:21618344
    reference_title: "Characterization of two mutations in the SPTLC1 subunit of serine palmitoyltransferase associated with hereditary sensory and autonomic neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the SPTLC1 mutations p.S331F and p.A352V result in a reduction of SPT activity in vitro and are associated with increased levels of the deoxysphingoid bases 1-deoxy-sphinganine and 1-deoxymethyl-sphinganine in patients' plasma samples"
    explanation: >-
      Extends the plasma elevation to two further SPTLC1 alleles. The same
      sentence reports reduced in vitro activity, which the later uniform
      re-assay contradicts; see the attached discussion.
  downstream:
  - target: Sensory and Motor Neuron Toxicity
    description: >-
      The accumulated deoxysphingoid bases are directly toxic to cultured
      sensory and motor neurons.
    evidence:
    - reference: PMID:20097765
      reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The DSBs show pronounced neurotoxic effects on neurite formation in cultured sensory neurons."
      explanation: >-
        Direct demonstration that the metabolites harm sensory neurons, which is
        the causal claim this edge makes.
  - target: Retinal Deoxysphingolipid Toxicity
    description: >-
      The same metabolites reach the retina, where they cause photoreceptor
      death in human retinal organoids.
    evidence:
    - reference: PMID:31509666
      reference_title: "Serine and Lipid Metabolism in Macular Disease and Peripheral Neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Deoxysphingolipids caused photoreceptor-cell death in retinal organoids, but not in the presence of regulators of lipid metabolism."
      explanation: >-
        Shows the accumulated metabolites are toxic in retinal tissue as well as
        in peripheral neurons, which is the link to the ocular phenotype.
- name: Sensory and Motor Neuron Toxicity
  biological_scale: CELLULAR
  description: >-
    Deoxysphingoid bases are toxic to primary sensory and motor neurons in a
    dose- and time-dependent way, with disturbed endoplasmic-reticulum and
    mitochondrial calcium handling and early loss of mitochondrial membrane
    potential as proximate cellular effects, and with disturbed neurofilament
    structure in neurites. Degeneration is length-dependent, so the longest
    axons in the lower limbs fail first, which is why the clinical picture
    begins in the feet and why epidermal innervation is lost at the distal leg
    before the thigh.
  cell_types:
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: dorsal root ganglion
    term:
      id: UBERON:0000044
      label: dorsal root ganglion
  evidence:
  - reference: PMID:29778900
    reference_title: "Hereditary sensory neuropathy type 1-associated deoxysphingolipids cause neurotoxicity, acute calcium handling abnormalities and mitochondrial dysfunction in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that exogenous application of these deoxysphingoid bases causes dose- and time-dependent neurotoxicity in primary mammalian neurons, as determined by analysis of cell survival and neurite length"
    explanation: >-
      The dose-response demonstration that the accumulated metabolites kill
      neurons, in both motor and sensory primary cultures.
  - reference: PMID:29778900
    reference_title: "Hereditary sensory neuropathy type 1-associated deoxysphingolipids cause neurotoxicity, acute calcium handling abnormalities and mitochondrial dysfunction in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The changes in intracellular Ca2+ handling are accompanied by an early loss of mitochondrial membrane potential in deoxysphingoid base-treated motor and sensory neurons."
    explanation: Names the proximate subcellular mechanism this node asserts.
  - reference: PMID:20097765
    reference_title: "Hereditary sensory neuropathy type 1 is caused by the accumulation of two neurotoxic sphingolipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The neurotoxicity co-occurs with a disturbed neurofilament structure in neurites when cultured in the presence of DSBs."
    explanation: >-
      A second, independent cellular correlate of the toxicity, in the paper
      that first identified the metabolites.
  - reference: PMID:27016021
    reference_title: "1-Deoxysphingolipid-induced neurotoxicity involves N-methyl-d-aspartate receptor signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, blocking NMDAR activation by MK-801 or memantine significantly prevented 1-deoxySA neurotoxicity."
    explanation: >-
      A pharmacological test of the toxicity's route: blocking NMDA receptors
      prevents it, which implicates glutamate-receptor signalling alongside the
      calcium and mitochondrial changes.
  - reference: PMID:34337561
    reference_title: "An iPSC model of hereditary sensory neuropathy-1 reveals L-serine-responsive deficits in neuronal ganglioside composition and axoglial interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HSN1 iPSC-derived sensory neurons (iPSCdSNs) endogenously produce neurotoxic DSBs."
    explanation: >-
      Moves the claim from exogenous application to endogenous production:
      patient-derived sensory neurons make the metabolites themselves, so the
      toxicity is not an artefact of adding lipid to the medium.
  - reference: PMID:34337561
    reference_title: "An iPSC model of hereditary sensory neuropathy-1 reveals L-serine-responsive deficits in neuronal ganglioside composition and axoglial interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complex gangliosides, which are essential for membrane micro-domains and signaling, are reduced, and neurotrophin signaling is impaired, resulting in reduced neurite outgrowth."
    explanation: >-
      Names a further consequence in patient-derived neurons: the sphingolipid
      products the cell should be making are depleted downstream, not only the
      atypical ones added.
  downstream:
  - target: Distal Sensory Impairment
    description: >-
      Degeneration of the longest sensory axons produces the length-dependent
      distal sensory deficit that opens the clinical picture.
    evidence:
    - reference: PMID:25042817
      reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sensory problems were universal and appeared first."
      explanation: >-
        Establishes that the sensory deficit is the first and universal clinical
        consequence in a genotyped HSAN1 cohort.
  - target: Impaired Pain and Temperature Sensation
    description: >-
      Small-fibre loss removes protective pain and temperature perception.
  - target: Neuropathic Pain
    description: >-
      Degenerating sensory neurons also generate positive sensory phenomena,
      the characteristic shooting or lancinating pains.
  - target: Reduced Intraepidermal Nerve Fiber Density
    description: >-
      Loss of the distal-most sensory terminals, measurable on skin biopsy, is
      the histological correlate of the small-fibre deficit.
    evidence:
    - reference: PMID:25042817
      reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "None of the 6 patients who underwent skin biopsies of the distal leg and thigh had any epidermal innervation remaining at the distal leg site, whereas some epidermal innervation always remained at the thigh site, consistent with the known length-dependent pattern of the neuropathy"
      explanation: >-
        The skin-biopsy measurement, and the distal-versus-thigh gradient that
        makes it length-dependent degeneration rather than a global deficit.
  - target: Sensory Axonal Neuropathy
    description: >-
      Loss of large myelinated sensory fibres is what abolishes sensory nerve
      action potentials on nerve conduction studies.
  - target: Distal Muscle Weakness
    description: >-
      Motor axons degenerate as well, which is why weakness follows the sensory
      deficit in most patients despite the disease's name.
    evidence:
    - reference: PMID:25042817
      reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Motor axonopathy was severe as assessed by symptoms, signs, and electrophysiological study, whereas autonomic neuropathy was scant."
      explanation: >-
        The authors' summary of their own cohort data, which is the basis for
        modelling motor involvement as a core consequence rather than a rarity.
  - target: Distal Amyotrophy
    description: Denervation of distal limb muscles produces wasting.
- name: Retinal Deoxysphingolipid Toxicity
  biological_scale: TISSUE
  description: >-
    Deoxysphingolipids also affect the macula. Lowering serine in mice raised
    retinal deoxysphingolipid levels and compromised visual function, and the
    metabolites killed photoreceptors in human retinal organoids. Most HSAN1
    patients examined ophthalmologically have macular telangiectasia type 2,
    which is otherwise an orphan disease, so the ocular phenotype is part of the
    SPT substrate-shift syndrome rather than a coincidence.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: macula lutea
    term:
      id: UBERON:0000053
      label: macula lutea
  evidence:
  - reference: PMID:31509666
    reference_title: "Serine and Lipid Metabolism in Macular Disease and Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Reduction of serine levels in mice led to increases in levels of retinal deoxysphingolipids and compromised visual function."
    explanation: >-
      Shows that raising retinal deoxysphingolipids is sufficient to impair
      vision in an animal, which is the mechanism this node asserts.
  - reference: PMID:31509666
    reference_title: "Serine and Lipid Metabolism in Macular Disease and Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated levels of atypical deoxysphingolipids, caused by variant SPTLC1 or SPTLC2 or by low serine levels, were risk factors for macular telangiectasia type 2, as well as for peripheral neuropathy."
    explanation: >-
      The authors' conclusion tying the same metabolite to both the retinal and
      the peripheral-nerve phenotype.
  downstream:
  - target: Macular Telangiectasia
    description: >-
      Retinal deoxysphingolipid toxicity is the proposed basis of the macular
      telangiectasia type 2 seen in most examined HSAN1 patients.
phenotypes:
- category: Neurological
  name: Distal Sensory Impairment
  description: >-
    Length-dependent distal sensory loss in a stocking-glove distribution,
    beginning in the feet and spreading proximally, with the hands involved on
    average a decade later. It is the presenting feature in every reported
    cohort.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:25042817
    reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first symptoms were universally sensory and occurred at a median age of 20 years (range 14-54 years)."
    explanation: >-
      Sensory symptoms were universal and first in 23 genotyped patients, which
      is the basis for the OBLIGATE frequency and for the onset figure.
  - reference: PMID:25042817
    reference_title: "Natural history and biomarkers in hereditary sensory neuropathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among those with sensory loss, all described a stocking-glove distribution, and more reported impaired temperature perception than light touch or pressure."
    explanation: Records the distribution and the small-fibre predominance.
  sequelae:
  - target: Painless Injury
    description: >-
      Sensory loss removes the warning that would prevent injury to the feet and
      hands.
- category: Neurological
  name: Impaired Pain and Temperature Sensation
  description: >-
    Loss of nociception and thermal sensation, predominating over light touch
    and pressure. This is the deficit that makes the injuries painless.
  phenotype_term:
    preferred_term: Impaired pain sensation
    term:
      id: HP:0007328
      label: Impaired pain sensation
  evidence:
  - reference: PMID:11242114
    reference_title: "Mutations in SPTLC1, encoding serine palmitoyltransferase, long chain base subunit-1, cause hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of pain sensation leads to chronic skin ulcers and distal amputations."
    explanation: >-
      States the loss of pain sensation and its consequence in the paper
      reporting the founding SPTLC1 families. The sentence introduces the
      disease rather than reporting this study's own measurement.
    quote_role: BACKGROUND
  sequelae:
  - target: Painless Injury
    description: >-
      Unperceived trauma and burns to insensate extremities.
- category: Neurological
  name: Neuropathic Pain
  description: >-
    Positive sensory phenomena appearing later than the sensory loss:
    dysesthesia and the characteristic lightning or shooting pains, reported by
    every patient in the natural-history cohort and often refractory to
    medication.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Neuropathic pain
    term:

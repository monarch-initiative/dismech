    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic (severe) PEX7-RCDP is characterized by proximal shortening of the
      humerus (rhizomelia) and to a lesser degree the femur, punctate
      calcifications in cartilage with epiphyseal and metaphyseal abnormalities
      (chondrodysplasia punctata, or CDP), coronal clefts of the vertebral
      bodies, and cataracts that are usually present at birth or appear in the
      first few months of life.
    explanation: >-
      Supports the characteristic clinical and radiographic findings that prompt
      PEX7-RCDP diagnostic evaluation.
- name: Plasmalogen and Phytanic-Acid Biochemical Testing
  description: >-
    Laboratory evaluation supports RCDP1 by showing severe plasmalogen deficiency
    together with the PTS2-import biochemical tetrad, including impaired
    phytanic-acid alpha-oxidation and loss of peroxisomal thiolase import.
  diagnosis_term:
    preferred_term: biomarker analysis
    term:
      id: NCIT:C63333
      label: Biomarker Analysis
  evidence:
  - reference: PMID:36914043
    reference_title: Quantitative analysis of ethanolamine plasmalogen species in red blood cells using liquid chromatography tandem mass spectrometry for diagnosing peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Particularly, severe plasmalogen deficiency is the biochemical hallmark of
      rhizomelic chondrodysplasia punctata (RCDP).
    explanation: >-
      Supports plasmalogen quantification as a diagnostic biochemical marker for
      RCDP.
  - reference: PMID:36914043
    reference_title: Quantitative analysis of ethanolamine plasmalogen species in red blood cells using liquid chromatography tandem mass spectrometry for diagnosing peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We developed a liquid-chromatography/tandem mass-spectrometry (LC-MS/MS)
      method to quantify eighteen phosphoethanolamine plasmalogens in RBCs to
      diagnose PBD patients, especially RCDP.
    explanation: >-
      Supports RBC plasmalogen LC-MS/MS as a diagnostic assay for RCDP.
  - reference: PMID:9090382
    reference_title: Rhizomelic chondrodysplasia punctata is a peroxisomal protein targeting disease caused by a non-functional PTS2 receptor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells from CG11 show a tetrad of biochemical abnormalities: a deficiency
      of i) dihydroxyacetonephosphate acyltransferase, ii)
      alkyldihydroxyacetonephosphate synthase, iii) phytanic acid
      alpha-oxidation and iv) inability to import peroxisomal thiolase.
    explanation: >-
      Defines the PEX7/CG11 biochemical signature that distinguishes RCDP1 from
      isolated plasmalogen-enzyme defects and generalized Zellweger-spectrum
      disease.

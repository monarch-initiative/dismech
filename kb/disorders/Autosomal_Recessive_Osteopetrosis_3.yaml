  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: Intracranial mineral deposition is directly observed on imaging, commonly involving basal ganglia, thalami and the frontal grey-white junction. It can progress during childhood and can be absent at a particular assessment. The lesion is established; the causal intermediates connecting CA II deficiency to deposition and cognitive outcomes remain unresolved. A small clinical series found no significant association between calcium burden and developmental measures.

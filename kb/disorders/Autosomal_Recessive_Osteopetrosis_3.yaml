inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: Biallelic CA2 variants may be homozygous or compound heterozygous. Clinical expression varies within and between families; the available clinical and enzyme series do not establish population-wide penetrance. Asymptomatic obligate heterozygotes had approximately half-normal erythrocyte CA II in the founding biochemical study.
  evidence:
  - reference: PMID:36709914
    reference_title: Carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The etiology is bi-allelic loss-of-function mutations of CA2 that encodes CA II.
    explanation: States the biallelic loss-of-function etiology directly.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:6405388
    reference_title: Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Levels of CA II in erythrocyte hemolysates from asymptomatic obligate heterozygotes are about half of normal.
    explanation: Gene-dosage behaviour of the enzyme in asymptomatic carriers, consistent with recessive inheritance and the basis for biochemical carrier testing.
  - reference: PMID:9453381
    reference_title: Nephrocalcinosis and urolithiasis in carbonic anhydrase II deficiency syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: highlight the inter-/intra-familial variability of the disease in this part of the world despite the overwhelming prevalence of the same
    explanation: 'Supports VARIABLE expressivity: clinical severity differs within and between families carrying the same founder allele.'
prevalence:
- population: Worldwide, cumulative case reports
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: More than 100 affected individuals reported as of 2023, concentrated in the Middle East and Mediterranean basin, which reflects consanguinity and the intron 2 founder allele rather than a true regional prevalence estimate. No population-based prevalence or incidence figure has been published.
  evidence:
  - reference: PMID:36709914
    reference_title: Carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: CA II deficiency now describes >100 affected individuals encountered predominantly from the Middle East and Mediterranean region.
    explanation: Cumulative reported-case count and geographic concentration.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- population: North African and Middle Eastern countries
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: A 1992 tally of the then-39 reported cases found 72% from North African and Middle Eastern countries. This is a proportion among ascertained cases, not a population rate, and is reported here only to document the geographic skew.
  evidence:
  - reference: PMID:1301935
    reference_title: A splice junction mutation in intron 2 of the carbonic anhydrase II gene of osteopetrosis patients from Arabic countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 39 reported cases of the carbonic anhydrase II deficiency syndrome, 72% were patients from North African and Middle Eastern countries, most, if not all, of whom were of Arabic descent.
    explanation: Quantifies the geographic distribution of ascertained cases.
progression:
- phase: Presentation in late infancy to early childhood
  age_range: late infancy to early childhood
  notes: Onset is insidious rather than acute. Diagnosis is usually prompted by fracture, failure to thrive, developmental concern, or an incidental radiograph.
  evidence:
  - reference: PMID:36709914
    reference_title: Carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The disorder presents late in infancy or early in childhood with fracturing, developmental delay, weakness, short stature, and/or cranial nerve compression and palsy.
    explanation: Gives both the age window and the presenting features.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- phase: Progressive accrual of intracranial calcification through childhood
  age_range: childhood
  notes: Serial imaging over up to 10 years in a 23-patient cohort showed progressive, regionally patterned calcification. Absence of calcification in childhood does not exclude the diagnosis.
  evidence:
  - reference: PMID:22120147
    reference_title: The neurology of carbonic anhydrase type II deficiency syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain calcification was generally progressive and followed a distinct distribution, involving predominantly basal ganglia and thalami and grey-white matter junction in frontal regions more than posterior regions.
    explanation: Longitudinal imaging establishing the progressive course and its distribution.
  - reference: PMID:22120147
    reference_title: The neurology of carbonic anhydrase type II deficiency syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At least one child had no brain calcification at age 9 years, indicating that brain calcification may not always be present in carbonic anhydrase type II deficiency syndrome during childhood.
    explanation: 'Bounds the claim: the calcification arm is age-dependent and not obligate in childhood, which matters for using imaging as a diagnostic criterion.'
- phase: Skeletal improvement in adult life
  age_range: adulthood
  notes: The skeletal arm tends to stabilise or improve with age, which is why this is classed an intermediate rather than malignant osteopetrosis. The renal tubular acidosis persists.
  evidence:
  - reference: PMID:36709914
    reference_title: Carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The skeletal findings may improve by adult life, and CA II deficiency can be associated with a normal life-span.
    explanation: States the favourable skeletal trajectory and lifespan directly.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
pathophysiology:
- name: Biallelic CA2 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Biallelic splice, nonsense, frameshift or missense variants reduce CA II abundance or activity. Erythrocyte CA II was virtually absent in the founding biochemical series, with CA I preserved, but this does not establish complete loss of activity in every tissue for every allele. Recombinant His107Tyr retains greatly reduced activity. The exon 7 frameshift produces an inactive, unstable truncated protein that accumulates in insoluble aggregates; p.Trp123Ter is a truncating nonsense allele, not a full-length missense product.
  genetic_context:
    gene:
      preferred_term: CA2
      term:
        id: hgnc:1373
        label: CA2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Both homozygous and compound-heterozygous genotypes occur; the index American siblings carried His107Tyr in trans with an intron 5 splice-acceptor variant.
  molecular_functions:
  - preferred_term: carbonic anhydrase II (cytosolic CO2 hydratase) activity
    modifier: DECREASED
    term:
      id: GO:0004089
      label: carbonate dehydratase activity
  cell_types:

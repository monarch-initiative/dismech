- name: Cranial Foramen and Optic Canal Narrowing
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Unremodelled bone encroaches on the cranial foramina. Optic canal narrowing
    is the best-quantified instance: in a 23-patient cohort optic nerve
    involvement was present in half of eyes and correlated statistically with
    the degree of canal narrowing, which locates the lesion in the bony canal
    rather than in a primary optic neuropathy. Internal auditory canals in the
    same cohort were of normal size.

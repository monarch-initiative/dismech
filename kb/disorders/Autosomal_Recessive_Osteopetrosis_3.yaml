name: Autosomal Recessive Osteopetrosis 3
creation_date: '2026-09-10T00:00:00Z'
category: Mendelian
description: >
  Autosomal recessive osteopetrosis 3 (ARO3, OPTB3) is carbonic anhydrase II
  deficiency, historically described as the syndrome of osteopetrosis with renal
  tubular acidosis and cerebral calcification ("marble brain disease",
  Guibaud-Vainsel syndrome; OMIM 259730). Biallelic loss-of-function variants in
  CA2 abolish the cytosolic carbonic anhydrase isoenzyme that hydrates CO2 to
  H+ and HCO3-. This distinguishes ARO3 mechanistically from the other recessive
  osteopetroses: TCIRG1 and CLCN7 disable the acid-secreting machinery of the
  osteoclast ruffled border, whereas CA2 loss removes the supply of protons that
  machinery pumps. Because the same enzyme serves the renal tubule and the
  brain, one enzymatic lesion fans out into three organ phenotypes - an
  osteoclast-rich osteopetrosis in which morphologically present osteoclasts
  cannot acidify the resorption lacuna, a renal tubular acidosis that is most
  often of mixed proximal and distal type, and intracranial parenchymal
  calcification whose mechanism remains the least settled arm. Presentation is
  in late infancy or early childhood with fractures, developmental delay, short
  stature and cranial nerve compression; unlike the severe TCIRG1 "malignant"
  infantile form this is an intermediate osteopetrosis compatible with a normal
  lifespan, and hematopoietic stem cell transplantation - which replaces only
  the osteoclast lineage - corrects the bone arm while leaving the renal and
  central nervous system arms intact.
disease_term:
  preferred_term: autosomal recessive osteopetrosis 3
  term:
    id: MONDO:0009818
    label: autosomal recessive osteopetrosis 3
synonyms:
- Carbonic anhydrase II deficiency syndrome
- CA2 deficiency syndrome
- Osteopetrosis with renal tubular acidosis and cerebral calcification
- Marble brain disease
- Guibaud-Vainsel syndrome
- OPTB3
parents:
- Sclerosing Bone Dysplasias
notes: >-
  Lump/split: curated as a single DISEASE. One enzymatic lesion (biallelic CA2
  loss) produces a conserved three-arm pathograph, and gene-disease specificity
  is near-absolute in both directions (PMID:15300855; PMID:12566520), so there
  is no grouping to build and no parent entry to attach this to as a subtype.

  Relationship to existing dismech osteopetrosis entries: at the time of
  curation neither `Osteopetrosis` (MONDO:0017198) nor
  `Autosomal_Recessive_Osteopetrosis` (MONDO:0009816, ARO2) nor either
  autosomal dominant entry mentioned CA2, carbonic anhydrase, or renal tubular
  acidosis, and no `kb/` file bound hgnc:1373 - verified by grep over the
  working tree and over origin/main. This entry is therefore a gap fill rather
  than a re-curation. A `kb/groupings/` Grouping over the osteopetroses, keyed
  on failure of osteoclast-mediated bone resorption, is the right follow-up and
  is deliberately not built here.

  No `conforms_to` target was used. `osteoporosis_bone_resorption` is the
  mechanistic inverse (excess resorption producing low bone mass) and
  `defective_skeletal_mineralization` covers hypomineralization, so neither
  fits; `nephrolithiasis_crystal_nucleation` covers an occasional complication
  rather than this entry's core chain. The mechanism shared by CA2, TCIRG1,
  CLCN7 and OSTM1 - failure to acidify the osteoclast resorption lacuna - has no
  module in `kb/modules/` yet, and creating one is the natural companion to the
  grouping above.

  No ISDS group assignment was recorded beyond the one below: the cached 2023
  nosology record (PMID:36779427) does not name CA2 or carbonic anhydrase, and
  the full group table was not available, so the assignment rests on the group's
  own stated scope rather than on an entry in its list.

  No GeneReviews chapter exists for CA2-related osteopetrosis. PubMed carries
  GeneReviews chapters for TCIRG1-Related Osteopetrosis (PMID:40875877) and
  CLCN7-Related Osteopetrosis (PMID:20301306) only, so the GeneReviews
  phenotype baseline could not be applied here.

  No `datasets:` block. A GEO search for carbonic anhydrase II deficiency and
  for CA2 returned nothing, and the whole `gds` database holds only eight
  osteopetrosis records. Three of those are human (GSE133937, GSE133938,
  GSE153885) but they are urine-derived iPSC studies of autosomal dominant
  osteopetrosis type 2 - CLCN7, a different gene and a different disease - so
  citing them here would be the dataset-search form of Named Entity Confusion
  the dataset-curation guidance warns about. The deep-research report
  independently found no transcriptomic, proteomic, metabolomic, single-cell or
  CRISPR-screen dataset specific to this disease.

  Deliberately omitted: interferon-gamma, and vitamin D/calcium supplementation.
  These appear in general osteopetrosis treatment reviews (PMID:42096006) but
  are not reported as therapy for CA2 deficiency, and importing the malignant
  infantile osteopetrosis treatment narrative into an intermediate,
  non-marrow-failure disease would misrepresent it.

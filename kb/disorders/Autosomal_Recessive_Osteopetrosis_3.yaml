genetic:
- name: CA2
  gene_term:
    preferred_term: CA2
    term:
      id: hgnc:1373
      label: CA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic disease-associated CA2 variants
  notes: CA2 encodes cytosolic carbonic anhydrase II. Splice-site, nonsense, frameshift and missense variants have been reported. Homozygous and compound-heterozygous genotypes occur. A predicted truncation or splice disruption does not by itself demonstrate absent protein in every tissue; His107Tyr retains residual activity in recombinant assays. Coexistent osteopetrosis and renal tubular acidosis can also result from coinherited defects in other genes.
  variants:
  - name: c.232+1G>A (intron 2 founder splice-donor variant)
    type: splice site
    clinical_significance: PATHOGENIC
    description: The recurrent intron 2 splice-donor allele is explicitly reported as NM_000067.3:c.232+1G>A in the Jordanian case and as c.232+1G>A in other primary clinical reports. Earlier series associated it with developmental impairment and fewer fractures, but the 2024 boy had age-appropriate development and recurrent low-trauma fractures. The Iranian transplant abstract instead reports c.232+1G>T; that discordant substitution should not be silently equated with c.232+1G>A.
    evidence:
    - reference: PMID:1301935
      reference_title: A splice junction mutation in intron 2 of the carbonic anhydrase II gene of osteopetrosis patients from Arabic countries.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We have analyzed DNAs from members of six unrelated Arabic kindreds and found five to be homozygous and one heterozygous for a novel splice junction (donor site) mutation at the 5' end of intron 2.
      explanation: Original description of the intron 2 splice-junction variant.
    - reference: PMID:7959703
      reference_title: A unique mutation underlying carbonic anhydrase II deficiency syndrome in patients of Arab descent.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This mutation is found exclusively in patients with an Arabic background and thus may be confined to this ethnic group.
      explanation: Describes the population distribution observed in that historical series, not proof that the allele is exclusive to an ancestry today.
    - reference: PMID:35035649
      reference_title: 'Blessing in disguise: when head trauma solves the riddle of carbonic anhydrase II deficiency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Whole exome sequencing confirms the diagnosis of CA II deficiency with homozygous mutation (CA2 NM_000067.3:c.232+1G>A) inherited in an autosomal recessive manner.
      explanation: The full clinical report supplies explicit transcript-level nomenclature for the recurrent splice allele.
    - reference: PMID:38328522
      reference_title: 'Carbonic Anhydrase II Deficiency: Unusual Presentation of the Arabic Mutation. A Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Psychomotor development is appropriate for chronological age.
      explanation: The reported 11-year-old with homozygous c.232+1G>A did not have developmental impairment at assessment; the allele does not determine intellectual disability.
  - name: His107Tyr (p.H107Y)
    type: missense
    clinical_significance: PATHOGENIC
    description: C-to-T transition substituting tyrosine for the invariant histidine at position 107, disrupting hydrogen bonding to Glu-117 and Tyr-194 and destabilising the protein. Unusually among CA2 alleles it leaves detectable residual activity, which has been proposed as the explanation for the milder phenotype and absent cognitive impairment in the families that carry it.
    evidence:
    - reference: PMID:1928091
      reference_title: 'Carbonic anhydrase II deficiency syndrome in a Belgian family is caused by a point mutation at an invariant histidine residue (107 His----Tyr): complete structure of the normal human CA II gene.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The change is a C-to-T transition which results in the substitution of Tyr (TAT) for His (CAT) at position 107.
      explanation: Original identification of the variant in a consanguineous Belgian family.
    - reference: PMID:1542674
      reference_title: Molecular basis of human carbonic anhydrase II deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show that the mutant enzyme expressed in bacteria from the cDNA containing the His-107----Tyr mutation has detectable, though greatly reduced, activity.
      explanation: Recombinant expression establishing that this allele is hypomorphic rather than null.
    - reference: PMID:1542674
      reference_title: Molecular basis of human carbonic anhydrase II deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The three affected siblings from this family are compound heterozygotes, each having inherited two different mutations in the structural gene for carbonic anhydrase II.
      explanation: Documents compound heterozygosity (His107Tyr with an intron 5 splice acceptor variant) in the index American family.
  - name: Exon 7 single-base deletion (frameshift)
    type: frameshift
    clinical_significance: PATHOGENIC
    description: Single-base deletion in exon 7 producing a frameshift and premature termination, homozygous in seven unrelated Hispanic families of Caribbean ancestry. The truncated 27-kD product is inactive, aggregates, and is rapidly degraded.
    evidence:
    - reference: PMID:8128957
      reference_title: 'Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: She proved to be homozygous for a single-base deletion in the coding region of exon 7 that produces a frameshift that changes the next 12 amino acids before leading to chain termination
      explanation: Molecular description of the Caribbean Hispanic founder allele.
  - name: c.368G>A p.W123X (nonsense)
    type: nonsense
    clinical_significance: PATHOGENIC
    description: Homozygous c.368G>A, p.Trp123Ter was reported in a Chinese proband. The study combined structural analysis with a transfected HEK293T expression model. The abstract does not separate all modeled zinc-binding predictions from experimental protein-expression findings, so the specific structural mechanism remains qualified.
    evidence:
    - reference: PMID:33555497
      reference_title: A novel homozygous nonsense mutation in the CA2 gene (c.368G>A, p.W123X) linked to carbonic anhydrase II deficiency syndrome in a Chinese family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Sequencing and genetic analysis have revealed the homozygous nonsense mutation of CA2 gene (c.368G > A, p.W123X) in the exon 4 of chromosome 8 of the proband
      explanation: Identification of the variant in the proband and its absence in unaffected relatives.
    - reference: PMID:33555497
      reference_title: A novel homozygous nonsense mutation in the CA2 gene (c.368G>A, p.W123X) linked to carbonic anhydrase II deficiency syndrome in a Chinese family.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Properties and structure of mutated CA2 proteins changed after mutation, especially in change of protein modification and hindrance of zinc ions binding
      explanation: Used for the structural-analysis hypothesis about zinc binding, not as a direct zinc-binding assay or a quantitative protein-expression result. The connection to enzyme dysfunction is inferential.
      directness: INDIRECT
  - name: c.753delG, p.Asn252Thrfs*14
    type: frameshift
    clinical_significance: LIKELY_PATHOGENIC
    description: Homozygous exon 7 deletion reported in the Brazilian woman with generalized hypoplastic enamel and other CA II-deficiency findings. Her mother was heterozygous; the father was unavailable for testing. The report notes prior observation in two Mexican siblings.
    evidence:
    - reference: PMID:37662627
      reference_title: Carbonic anhydrase II deficiency syndrome with amelogenesis imperfecta linked to a homozygous CA2 deletion.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Molecular analysis revealed a CA2 homozygous deletion (c.753delG, p.Asn252Thrfs*14) and confirmed the clinical diagnosis.
      explanation: The molecularly characterized Brazilian dental case carried this homozygous frameshift; the full report classified it as likely pathogenic.
  evidence:
  - reference: PMID:15300855
    reference_title: 'Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: With one exception, all patients with osteopetrosis and renal tubular acidosis examined have proven to have CA II deficiency. All CA II-deficient patients analyzed have been found to have mutations in the CA2 gene.
    explanation: The bidirectional gene-disease specificity statement, and the reason this is curated as a single disease rather than a grouping.
  - reference: PMID:6410391
    reference_title: 'Polymorphic gene for human carbonic anhydrase II: a molecular disease marker located on chromosome 8.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Segregation analysis of the molecular marker and chromosomes in cell hybrids indicated a clear correlation between the presence of chromosome 8 and the human CA II gene (CA2).
    explanation: Somatic cell hybrid mapping of CA2 to chromosome 8, the step that made molecular diagnosis possible.
  - reference: PMID:15300855
    reference_title: 'Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These mutations were scattered over the genome from exon 2 to 7.
    explanation: Establishes that pathogenic variants are distributed across the gene rather than clustering in one domain, which is why diagnostic sequencing covers all seven exons.
  - reference: PMID:31542996
    reference_title: Molecular modelling and dynamics of CA2 missense mutations causative to carbonic anhydrase 2 deficiency syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Free energy dynamics of tertiary structure models of CA2 mutants with DUET, mCSM, and SDM based consensus methods predicted only 50% of the variants as destabilizing.
    explanation: 'Bounds what in silico prediction can do for the missense class: consensus free-energy methods called only half of already-known disease-causing CA2 missense variants destabilizing, so a non-destabilizing prediction is not evidence against pathogenicity in this gene.'
  - reference: PMID:31542996
    reference_title: Molecular modelling and dynamics of CA2 missense mutations causative to carbonic anhydrase 2 deficiency syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Superimposition of native and mutant CA2 models revealed the minor structural fluctuations at the amino acid residue level but not at the whole protein structure level.
    explanation: 'Gives the reason the free-energy methods underperform: the perturbation is residue-local rather than global, which is the signal whole-protein stability scores are least able to see.'
biochemical:
- name: Erythrocyte carbonic anhydrase II
  biomarker_term:
    preferred_term: carbonic anhydrase II (erythrocyte isoenzyme II)
    term:
      id: NCIT:C183174
      label: Carbonic Anhydrase 2
  presence: Virtually absent in affected individuals by HPLC peak, esterase activity, CO2 hydratase activity and immunoprecipitation; approximately half-normal in asymptomatic obligate heterozygotes; carbonic anhydrase I unaffected.
  specificity: Isoenzyme-specific. CA I levels are normal, so the assay distinguishes this disorder from a general carbonic anhydrase deficiency.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  readouts:
  - target: pathophysiology#Biallelic CA2 Loss of Function
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: Absence of erythrocyte CA II establishes the enzymatic diagnosis; the half-normal carrier level makes the same assay a carrier test.
    description: The erythrocyte is not an affected tissue in this disease, but it is the accessible one, and the enzyme is the same gene product.
    evidence:
    - reference: PMID:6405388
      reference_title: Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We report here biochemical and immunological evidence for the virtual absence of CA II in erythrocytes of patients affected with this condition, whereas CA I level is not reduced.
      explanation: The measurement behind this readout, and the isoenzyme specificity that makes an absent result interpretable.
  evidence:
  - reference: PMID:3925334
    reference_title: Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Reduced levels of isozyme II were found in obligate heterozygotes.
    explanation: Supports the carrier-detection use of the assay.
  - reference: PMID:3925334
    reference_title: Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Virtual absence of the carbonic anhydrase II peak on high-performance liquid chromatography, of the esterase and carbon dioxide hydratase activities of carbonic anhydrase II, and of immunoprecipitable isozyme II was demonstrated on extracts of erythrocyte hemolysates from all patients studied.
    explanation: Establishes absence of the enzyme by four concordant measurements in all patients studied.
animal_models:
- name: Car-2 null mouse (ENU-induced)
  species: Mouse
  genotype: Car-2 null (ENU-induced, homozygous)
  background: (C57BL/6J x DBA/2J)F1-derived
  publication: PMID:3126501
  description: ENU-induced Car2-null mice lack detectable CA II, develop growth restriction and renal tubular acidosis, and did not show osteopetrosis even in aged homozygotes. This establishes a model of selected renal and growth findings with an important skeletal divergence.
  modeled_mechanisms:
  - target: Systemic Hyperchloremic Metabolic Acidosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Homozygous null mice develop renal tubular acidosis, as humans with the same enzyme defect do.
    limitations: Renal tubular acidosis is reproduced, but the founding phenotype does not by itself resolve the proximal and distal contributions. Later kidney studies show collecting-duct cellular and transporter changes whose extent in human CA2 deficiency remains unestablished.
    readouts:
    - name: Renal tubular acidosis in homozygous null mice
      target: Systemic Hyperchloremic Metabolic Acidosis
      direction: ALTERED
      interpretation: The acid-base phenotype of the model matches the human renal arm.
      evidence:
      - reference: PMID:3126501
        reference_title: 'N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Like humans with the same inherited enzyme defect, animals homozygous for the new null allele are runted and have renal tubular acidosis.
        explanation: Reports the renal tubular acidosis in the null mouse.
    evidence:
    - reference: PMID:3126501
      reference_title: 'N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The CA II protein, which is normally expressed in most tissues, could not be detected by immunodiffusion analysis in any tissues of the CA II-deficient mice
      explanation: Confirms the model is a true protein null, so it is informative for the consequences of losing the enzyme.
  - target: Impaired Distal Tubular Proton Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Collecting-duct cellular and transporter changes support disruption of distal acid-base transport in Car2-null mice.
    limitations: Intercalated-cell markers and transporter abundance are proxy readouts, not direct measurements of proton secretion. The same cellular depletion has not been established in human kidney.
    readouts:
    - name: Collecting-duct intercalated cell depletion
      target: Impaired Distal Tubular Proton Secretion
      direction: DECREASED
      interpretation: Beyond loss of enzyme activity, the acid-secreting cell population itself is depleted and replaced by principal cells - a cell-population phenotype, not only an enzymatic one.
      evidence:
      - reference: PMID:8594870
        reference_title: Depletion of intercalated cells from collecting ducts of carbonic anhydrase II-deficient (CAR2 null) mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These results suggest that intercalated cells are severely depleted and are replaced by principal cells in CAII-deficient mice.
        explanation: Immunocytochemical quantification of intercalated-cell loss in the CAR2-null collecting duct.
    - name: Collecting-duct bicarbonate transporter expression
      target: Impaired Distal Tubular Proton Secretion
      direction: DECREASED
      interpretation: Pendrin, Slc26a7 and AE1 expression all fall, consistent with loss of the intercalated-cell phenotype rather than an isolated enzyme deficit.
      evidence:
      - reference: PMID:18209476
        reference_title: Decreased expression of Slc26a4 (Pendrin) and Slc26a7 in the kidneys of carbonic anhydrase II-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: CAII deficiency results in a significant decrease in the gene and protein expression of bicarbonate transport proteins from Slc26 gene family - Slc26a4 (pendrin) and Slc26a7.
        explanation: Quantifies the transporter expression changes in the null kidney.
    evidence:
    - reference: PMID:8594870
      reference_title: Depletion of intercalated cells from collecting ducts of carbonic anhydrase II-deficient (CAR2 null) mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These results suggest that intercalated cells are severely depleted and are replaced by principal cells in CAII-deficient mice.
      explanation: Immunocytochemical quantification of intercalated-cell loss in the CAR2-null collecting duct.
    - reference: PMID:18209476
      reference_title: Decreased expression of Slc26a4 (Pendrin) and Slc26a7 in the kidneys of carbonic anhydrase II-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: CAII deficiency results in a significant decrease in the gene and protein expression of bicarbonate transport proteins from Slc26 gene family - Slc26a4 (pendrin) and Slc26a7.
      explanation: Quantifies the transporter expression changes in the null kidney.
  - target: Accumulation of Unresorbed Sclerotic Bone with Preserved Osteoclast Number
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: The defining human phenotype is absent from the mouse null. Osteopetrosis could not be detected even in very old homozygotes.
    limitations: The model does not reproduce overt human osteopetrosis, limiting its use for that skeletal endpoint. This negative organism-level finding does not demonstrate normality of every osteoclast process; the basis of the species difference remains unresolved.
    readouts:
    - name: Skeletal density in aged homozygous null mice
      target: Accumulation of Unresorbed Sclerotic Bone with Preserved Osteoclast Number
      direction: UNCHANGED
      interpretation: 'A genuine negative result: no osteopetrosis at any age examined.'
      evidence:
      - reference: PMID:3126501
        reference_title: 'N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: However, the prominent osteopetrosis found in humans with CA II deficiency could not be detected even in very old homozygous null mice.
        explanation: Direct statement of the negative skeletal finding.
    evidence:
    - reference: PMID:3126501
      reference_title: 'N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome.'
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: However, the prominent osteopetrosis found in humans with CA II deficiency could not be detected even in very old homozygous null mice.
      explanation: The negative skeletal finding demonstrates non-recapitulation of overt osteopetrosis, not exclusion of all mechanistic value of the model.
  evidence:
  - reference: PMID:2495727
    reference_title: Mice carrying a CAR-2 null allele lack carbonic anhydrase II immunohistochemically and show vascular calcification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The CA II-deficient mice differed from controls in evidencing an age dependent medial calcification of small arteries in a number of organs.
    explanation: The model does develop an age-dependent ectopic calcification, though arterial rather than cerebral. Recorded here as a characterised feature of the model, not as a model of the human brain phenotype - see the cerebral calcification discussion.
- name: CA II-deficient mice in recombinant growth hormone studies
  species: Mouse
  publication: PMID:9688969
  description: CA II-deficient acidotic mice were studied for growth-hormone/IGF physiology and randomized recombinant growth hormone response. Reduced GH secretion was observed in males, not females. Treatment increased growth despite persistent acidosis, and the follow-up time-course analysis showed a progressively increasing response. These experiments do not establish human GH deficiency or justify clinical efficacy claims.
  evidence:
  - reference: PMID:9688969
    reference_title: Disturbances of growth hormone-insulin-like growth factor axis and response to growth hormone in acidosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Randomized administration of rGH from approximately 5 to approximately 12 wk to CAD mice improved food efficiency and increased serum IGF-I levels, final length, and weight compared with placebo without affecting blood pH.
    explanation: Mouse intervention improves growth without correcting acidosis; it is not human treatment evidence.
  - reference: PMID:9688969
    reference_title: Disturbances of growth hormone-insulin-like growth factor axis and response to growth hormone in acidosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Thus growth failure in CAD mice is associated with a decrease in GH secretion in males but not in females.
    explanation: Sex-specific finding limits extrapolation to a universal endocrine mechanism.
  - reference: PMID:10975300
    reference_title: Time course of the response to recombinant growth hormone in acidotic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Administration of GH increased standardized growth progressively up to 5-9 weeks.
    explanation: Follow-up analysis emphasizes duration of exposure in the mouse experiment.
treatments:
- name: Oral alkali therapy
  description: Oral bicarbonate or citrate treats the acid-base disturbance. In the child reported with obstructive sleep apnea, sodium bicarbonate and potassium citrate improved blood acidosis and bicarbonate. Earlier treatment was proposed to explain milder outcomes in a separate cohort, but that comparison does not establish a disease-modifying neurological effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  target_mechanisms:
  - target: Systemic Hyperchloremic Metabolic Acidosis
    treatment_effect: MODULATES
    description: Exogenous alkali can improve systemic acidosis without correcting the underlying genotype.
    evidence:
    - reference: PMID:30109220
      reference_title: 'Carbonic Anhydrase II Deficiency: A Rare Case of Severe Obstructive Sleep Apnea.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Oral therapy with sodium bicarbonate and potassium citrate was started with improvement of blood acidosis (Table 1) and blood HCO3-.
      explanation: Direct clinical response supports correction of acidosis; it does not establish normalization of all disease manifestations.
  evidence:
  - reference: PMID:36709914
    reference_title: Carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Several mouse models of CA II deficiency have shown growth hormone deficiency, yet currently there is no standard pharmacologic therapy for patients.
    explanation: Establishes that no pharmacologic therapy is standardised for this disease - the reason alkali therapy is described here as the mainstay for one arm rather than as a protocol.

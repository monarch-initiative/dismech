- name: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cytosolic carbonic anhydrase II supplies protons for secretion and
    bicarbonate for basolateral exit in the proximal tubule, and the same
    activity in collecting-duct alpha-intercalated cells supports distal proton
    secretion. Its loss impairs both bicarbonate reclamation and distal
    acidification, which is why the renal phenotype is most often mixed rather
    than purely distal. Two observations qualify the cellular picture. First,
    CA II-deficient patients still respond to intravenous acetazolamide with a
    rise in urinary pH and bicarbonate excretion, so a separate
    acetazolamide-sensitive carbonic anhydrase - most plausibly the membrane-bound
    luminal isoenzyme, which is a different gene product - remains active in
    their kidneys. Second, in the mouse null the intercalated cell population
    itself is depleted, so part of the renal defect may be a cell-population
    phenotype rather than a purely enzymatic one.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  - preferred_term: collecting-duct alpha-intercalated cell
    term:
      id: CL:0005011
      label: renal alpha-intercalated cell
  biological_processes:
  - preferred_term: tubular bicarbonate reclamation
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport
  - preferred_term: tubular proton secretion
    modifier: DECREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Systemic Hyperchloremic Metabolic Acidosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36709914
      reference_title: "Carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In CA II deficiency, OPT is uniquely accompanied by renal tubular acidosis (RTA) of proximal, distal, or combined type featuring hyperchloremic metabolic acidosis, rarely with hypokalemia and paralysis."
      explanation: >-
        Names the tubular defect and the systemic acid-base consequence it
        produces, together with the range of tubular segments involved.
  evidence:
  - reference: PMID:12566520
    reference_title: "A phenocopy of CAII deficiency: a novel genetic explanation for inherited infantile osteopetrosis with distal renal tubular acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most often, the RTA is of mixed proximal and distal type, but kindreds are reported in which either distal or proximal RTA predominates."
    explanation: >-
      The direct statement that the renal defect is usually mixed, with
      kindred-level variation - the reason this entry does not assert a single
      RTA tier.
  - reference: PMID:3932950
    reference_title: "Positive renal response to intravenous acetazolamide in patients with carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that CA II-deficient patients, who lack detectable CA II in their erythrocytes, still expressed an acetazolamide-inhibitable CA activity in their kidneys."
    explanation: >-
      Qualifies the node: carbonic anhydrase activity is not wholly absent from
      the CA II-deficient kidney, so the renal defect is a partial rather than a
      total loss of tubular carbonic anhydrase function.
- name: Systemic Hyperchloremic Metabolic Acidosis
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Net acid retention from the tubular defect produces a chronic
    hyperchloremic, normal-anion-gap metabolic acidosis, occasionally with
    hypokalemia. It is the arm that alkali therapy addresses and the one that
    transplantation does not, and it is the feature that separates this
    osteopetrosis from every other recessive form.
  downstream:
  - target: Renal tubular acidosis
    causal_link_type: DIRECT
  - target: Hyperchloremic metabolic acidosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35035649
    reference_title: "Blessing in disguise: when head trauma solves the riddle of carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The suspicion of carbonic anhydrase II deficiency was confirmed by arterial blood gases revealing a marked metabolic acidosis fulfilling the diagnostic triad."
    explanation: >-
      A worked clinical instance of the systemic acidosis being the measurable
      expression of this node.
- name: Intracranial Parenchymal Calcium Deposition
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Calcium deposits accumulate in the brain parenchyma from early childhood,
    predominantly in basal ganglia and thalami and at the frontal grey-white
    matter junction, and progress over years. This is the arm that named the
    disease and the one whose mechanism is least settled: it is not explained by
    the osteoclast or tubular defects, it does not track neurodevelopmental
    severity, and no demonstrated intervening step links CA II loss to mineral
    deposition at these sites. The node is therefore marked HYPOTHETICAL and
    carries a knowledge-gap discussion rather than a mechanism.
  locations:
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  downstream:
  - target: Cerebral calcification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral calcification uniquely appears in early childhood."
    explanation: >-
      Establishes that the calcification is an early-childhood feature specific
      to this osteopetrosis.
  - reference: PMID:39667299
    reference_title: "The correlation of intracranial parenchymal calcium score and the severity of neurological clinical presentation in carbonic anhydrase deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intraparenchymal calcifications in CAII-D are common but unrelated to developmental delay and neuropsychiatric symptoms, suggesting complex pathophysiology."
    explanation: >-
      Supports the node's existence and simultaneously supports marking it
      HYPOTHETICAL: the authors' own reading of their negative correlation is
      that the pathophysiology is not understood.

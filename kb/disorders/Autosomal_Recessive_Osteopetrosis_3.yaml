  description: Renal bicarbonate loss and/or impaired net acid excretion produce metabolic acidosis, commonly hyperchloremic, sometimes with hypokalemia. Oral alkali can improve the acid-base disturbance. The combination with osteopetrosis is a strong diagnostic clue but can also occur with coinherited TCIRG1 and ATP6V1B1 disease.

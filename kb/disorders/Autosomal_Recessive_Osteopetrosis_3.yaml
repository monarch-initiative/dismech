    Bound to the parent HP term deliberately. The literature most often
    describes a mixed proximal and distal defect, with kindreds in which either
    predominates, so neither HP:0002049 (proximal) nor HP:0008341 (distal) is
    the correct single binding for the disease as a whole. Individual reports
    have described purely distal disease, type 2 (proximal) disease, and one
    proband with osteopetrosis and cerebral calcification but no detectable RTA
    at all.

    term:
      id: CHEBI:29105
      label: zinc(2+)
  downstream:
  - target: Reduced CA II-Dependent Proton and Bicarbonate Generation
    causal_link_type: DIRECT
    description: Reduced CA II activity slows the enzyme-catalyzed hydration of CO2; it does not abolish all cellular production of protons or bicarbonate.
    evidence:
    - reference: PMID:6405388
      reference_title: Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we postulated a defect in carbonic anhydrase II (CA II), the only one of the three soluble isozymes of carbonic anhydrase that is known to be synthesized in kidney and brain
      explanation: The founding study identifies deficiency of this isoenzyme; it does not establish absence of every compensating activity in all tissues.
  - target: Intracranial Parenchymal Calcium Deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cerebral calcification is an observed component of CA2 deficiency, but the intermediate route from enzyme dysfunction to regional mineral deposition is unresolved.
    evidence:
    - reference: PMID:36709914
      reference_title: Carbonic anhydrase II deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Although this enzymopathy reveals how CA II is important for the skeleton and kidney tubule, the pathogenesis of the mental subnormality and cerebral calcification is less well understood.
      explanation: Supports the association while explicitly stating that the pathogenesis of the cerebral arm is not understood, which is why the edge is typed as indirect with unknown intermediates.
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
  evidence:
  - reference: PMID:3925334
    reference_title: Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Virtual absence of the carbonic anhydrase II peak on high-performance liquid chromatography, of the esterase and carbon dioxide hydratase activities of carbonic anhydrase II, and of immunoprecipitable isozyme II was demonstrated on extracts of erythrocyte hemolysates from all patients studied.
    explanation: Demonstrates absence of the enzyme by three independent methods across 18 patients from 11 unrelated families.
  - reference: PMID:6405388
    reference_title: Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report here biochemical and immunological evidence for the virtual absence of CA II in erythrocytes of patients affected with this condition, whereas CA I level is not reduced.
    explanation: The founding observation, and establishes that the deficiency is isoenzyme-specific rather than a general carbonic anhydrase failure.
  - reference: PMID:8128957
    reference_title: 'Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The 27-kD truncated enzyme produced when the mutant cDNA was expressed in COS cells was enzymatically inactive, present mainly in insoluble aggregates, and detectable immunologically at only 5% the level of the 29-kD normal carbonic anhydrase II
    explanation: Expression study showing one route to loss of function - truncation with aggregation and accelerated degradation.
  - reference: PMID:1928091
    reference_title: 'Carbonic anhydrase II deficiency syndrome in a Belgian family is caused by a point mutation at an invariant histidine residue (107 His----Tyr): complete structure of the normal human CA II gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His-107 appears to have a stabilizing function in the structure of all CA molecules, and its substitution by Tyr apparently disrupts the critical hydrogen bonding of His-107 to two other similarly invariant residues, Glu-117 and Tyr-194, resulting in an unstable CA II molecule.
    explanation: A second route to loss of function - destabilisation of a full-length protein by substitution of an invariant residue.
  - reference: PMID:31778702
    reference_title: Effect of disease-linked mutations on the structure, function, stability and aggregation of human carbonic anhydrase II.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Studies suggest that the mutant proteins undergo local structural perturbations and have compromised native state stability.
    explanation: Purified-protein biophysics confirming reduced native-state stability for two disease-linked missense substitutions.
  - reference: PMID:1542674
    reference_title: Molecular basis of human carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that the mutant enzyme expressed in bacteria from the cDNA containing the His-107----Tyr mutation has detectable, though greatly reduced, activity.
    explanation: Direct residual-activity measurement prevents interpreting all CA2 alleles as complete catalytic nulls.

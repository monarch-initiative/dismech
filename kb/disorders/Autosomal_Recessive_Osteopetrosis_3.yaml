diagnosis:
- name: Clinical and radiographic recognition
  description: Osteopetrosis, renal tubular acidosis and cerebral calcification form the classic clinical pattern. The complete triad is not required at assessment, and the pattern alone is not fully gene-specific. Skeletal imaging, acid-base studies and brain imaging characterize the presentation.
  evidence:
  - reference: PMID:30109220
    reference_title: 'Carbonic Anhydrase II Deficiency: A Rare Case of Severe Obstructive Sleep Apnea.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The deficiency of carbonic anhydrase II causes a moderate form, presenting classically as a triad of osteopetrosis, renal tubular acidosis (RTA), and cerebral calcification.
    explanation: States the classical triad.
  - reference: PMID:8128957
    reference_title: 'Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband was a 2 1/2-year-old Hispanic girl of Puerto Rican ancestry who was unique clinically, in that she had no evidence of renal tubular acidosis, even though she did have osteopetrosis, developmental delay, and cerebral calcification.
    explanation: The clinical triad is incomplete in this molecularly confirmed patient, so all three features are not required for recognition.
- name: Molecular confirmation
  description: Identify biallelic disease-causing CA2 variants and interpret them with the clinical findings. Published methods include sequencing all seven exons and whole-exome sequencing; splice and truncating alleles require variant-specific assessment.
  evidence:
  - reference: PMID:15300855
    reference_title: 'Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we amplified all seven exons by PCR from genomic DNA and directly sequenced the amplified products
    explanation: The molecular confirmation method, covering all seven exons.
  - reference: PMID:1542674
    reference_title: Molecular basis of human carbonic anhydrase II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The three affected siblings from this family are compound heterozygotes, each having inherited two different mutations in the structural gene for carbonic anhydrase II.
    explanation: Molecular diagnosis includes compound heterozygosity, not only homozygous variants.
- name: Erythrocyte CA II assay
  description: Marked reduction of CA II protein and activity with preserved CA I supports the enzymatic diagnosis. Erythrocyte measurements do not establish enzyme activity in every tissue.
  evidence:
  - reference: PMID:6405388
    reference_title: Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report here biochemical and immunological evidence for the virtual absence of CA II in erythrocytes of patients affected with this condition, whereas CA I level is not reduced.
    explanation: The measurement behind this readout, and the isoenzyme specificity that makes an absent result interpretable.

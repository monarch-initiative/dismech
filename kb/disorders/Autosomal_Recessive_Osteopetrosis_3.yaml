inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Biallelic (homozygous or compound heterozygous) CA2 loss-of-function
    variants. Penetrance is recorded as COMPLETE for the biochemical enzyme
    defect, which is the claim the erythrocyte assay supports; clinical
    expressivity is variable even between siblings sharing one genotype.
    Obligate heterozygotes are asymptomatic with about half-normal erythrocyte
    CA II levels.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology is bi-allelic loss-of-function mutations of CA2 that encodes CA II."
    explanation: States the biallelic loss-of-function etiology directly.
  - reference: PMID:6405388
    reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of CA II in erythrocyte hemolysates from asymptomatic obligate heterozygotes are about half of normal."
    explanation: >-
      Gene-dosage behaviour of the enzyme in asymptomatic carriers, consistent
      with recessive inheritance and the basis for biochemical carrier testing.
  - reference: PMID:9453381
    reference_title: "Nephrocalcinosis and urolithiasis in carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "highlight the inter-/intra-familial variability of the disease in this part of the world despite the overwhelming prevalence of the same"
    explanation: >-
      Supports VARIABLE expressivity: clinical severity differs within and
      between families carrying the same founder allele.
prevalence:
- population: Worldwide, cumulative case reports
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    More than 100 affected individuals reported as of 2023, concentrated in the
    Middle East and Mediterranean basin, which reflects consanguinity and the
    intron 2 founder allele rather than a true regional prevalence estimate. No
    population-based prevalence or incidence figure has been published.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CA II deficiency now describes >100 affected individuals encountered predominantly from the Middle East and Mediterranean region."
    explanation: Cumulative reported-case count and geographic concentration.
- population: North African and Middle Eastern countries
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 1992 tally of the then-39 reported cases found 72% from North African and
    Middle Eastern countries. This is a proportion among ascertained cases, not
    a population rate, and is reported here only to document the geographic
    skew.
  evidence:
  - reference: PMID:1301935
    reference_title: "A splice junction mutation in intron 2 of the carbonic anhydrase II gene of osteopetrosis patients from Arabic countries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 39 reported cases of the carbonic anhydrase II deficiency syndrome, 72% were patients from North African and Middle Eastern countries, most, if not all, of whom were of Arabic descent."
    explanation: Quantifies the geographic distribution of ascertained cases.
progression:
- phase: Presentation in late infancy to early childhood
  age_range: late infancy to early childhood
  notes: >-
    Onset is insidious rather than acute. Diagnosis is usually prompted by
    fracture, failure to thrive, developmental concern, or an incidental
    radiograph.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder presents late in infancy or early in childhood with fracturing, developmental delay, weakness, short stature, and/or cranial nerve compression and palsy."
    explanation: Gives both the age window and the presenting features.
- phase: Progressive accrual of intracranial calcification through childhood
  age_range: childhood
  notes: >-
    Serial imaging over up to 10 years in a 23-patient cohort showed
    progressive, regionally patterned calcification. Absence of calcification in
    childhood does not exclude the diagnosis.
  evidence:
  - reference: PMID:22120147
    reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain calcification was generally progressive and followed a distinct distribution, involving predominantly basal ganglia and thalami and grey-white matter junction in frontal regions more than posterior regions."
    explanation: Longitudinal imaging establishing the progressive course and its distribution.
  - reference: PMID:22120147
    reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least one child had no brain calcification at age 9 years, indicating that brain calcification may not always be present in carbonic anhydrase type II deficiency syndrome during childhood."
    explanation: >-
      Bounds the claim: the calcification arm is age-dependent and not obligate
      in childhood, which matters for using imaging as a diagnostic criterion.
- phase: Skeletal improvement in adult life
  age_range: adulthood
  notes: >-
    The skeletal arm tends to stabilise or improve with age, which is why this
    is classed an intermediate rather than malignant osteopetrosis. The renal
    tubular acidosis persists.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal findings may improve by adult life, and CA II deficiency can be associated with a normal life-span."
    explanation: States the favourable skeletal trajectory and lifespan directly.
pathophysiology:
- name: Biallelic CA2 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both CA2 alleles carry loss-of-function variants - splice-junction, nonsense,
    frameshift or missense - and carbonic anhydrase II protein is absent or
    catalytically dead in every tissue that normally expresses it. The
    erythrocyte is the accessible readout: the isoenzyme II peak, its esterase
    and CO2 hydratase activities, and immunoprecipitable enzyme are all
    essentially absent, while CA I is spared. Reported mechanisms of loss
    include abolished splicing (the intron 2 founder allele), premature
    termination with accelerated degradation and insoluble aggregation (the exon
    7 frameshift), and destabilisation or disrupted zinc coordination of an
    otherwise full-length protein (His107Tyr, p.W123X).
  genetic_context:
    gene:
      preferred_term: CA2
      term:
        id: hgnc:1373
        label: CA2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in most reported families, including all patients carrying the
      intron 2 founder allele; compound heterozygosity is reported in the index
      American family.
  molecular_functions:
  - preferred_term: carbonic anhydrase II (cytosolic CO2 hydratase) activity
    modifier: ABSENT
    term:
      id: GO:0004089
      label: carbonate dehydratase activity
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  chemical_entities:
  - preferred_term: zinc(2+) (catalytic metal of carbonic anhydrase II)
    term:
      id: CHEBI:29105
      label: zinc(2+)
  downstream:
  - target: Loss of Cytosolic Proton and Bicarbonate Supply
    causal_link_type: DIRECT
    description: >-
      Absence of the enzyme removes the cytosolic reaction that generates H+ and
      HCO3- from CO2 and water.
    evidence:
    - reference: PMID:6405388
      reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we postulated a defect in carbonic anhydrase II (CA II), the only one of the three soluble isozymes of carbonic anhydrase that is known to be synthesized in kidney and brain"
      explanation: >-
        Identifies CA II as the only soluble isoenzyme in the affected organs,
        which is why its loss removes the supply rather than being buffered by a
        sibling isoenzyme.
  evidence:
  - reference: PMID:3925334
    reference_title: "Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virtual absence of the carbonic anhydrase II peak on high-performance liquid chromatography, of the esterase and carbon dioxide hydratase activities of carbonic anhydrase II, and of immunoprecipitable isozyme II was demonstrated on extracts of erythrocyte hemolysates from all patients studied."
    explanation: >-
      Demonstrates absence of the enzyme by three independent methods across 18
      patients from 11 unrelated families.
  - reference: PMID:6405388
    reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here biochemical and immunological evidence for the virtual absence of CA II in erythrocytes of patients affected with this condition, whereas CA I level is not reduced."
    explanation: >-
      The founding observation, and establishes that the deficiency is
      isoenzyme-specific rather than a general carbonic anhydrase failure.
  - reference: PMID:8128957
    reference_title: "Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 27-kD truncated enzyme produced when the mutant cDNA was expressed in COS cells was enzymatically inactive, present mainly in insoluble aggregates, and detectable immunologically at only 5% the level of the 29-kD normal carbonic anhydrase II"
    explanation: >-
      Expression study showing one route to loss of function - truncation with
      aggregation and accelerated degradation.
  - reference: PMID:1928091
    reference_title: "Carbonic anhydrase II deficiency syndrome in a Belgian family is caused by a point mutation at an invariant histidine residue (107 His----Tyr): complete structure of the normal human CA II gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His-107 appears to have a stabilizing function in the structure of all CA molecules, and its substitution by Tyr apparently disrupts the critical hydrogen bonding of His-107 to two other similarly invariant residues, Glu-117 and Tyr-194, resulting in an unstable CA II molecule."
    explanation: >-
      A second route to loss of function - destabilisation of a full-length
      protein by substitution of an invariant residue.
  - reference: PMID:31778702
    reference_title: "Effect of disease-linked mutations on the structure, function, stability and aggregation of human carbonic anhydrase II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies suggest that the mutant proteins undergo local structural perturbations and have compromised native state stability."
    explanation: >-
      Purified-protein biophysics confirming reduced native-state stability for
      two disease-linked missense substitutions.
- name: Loss of Cytosolic Proton and Bicarbonate Supply
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Carbonic anhydrase II catalyses the reversible hydration of CO2 to
    bicarbonate and a proton, and it does so fast enough to supply transporters
    working at physiological rates. Its loss removes the rapid intracellular
    source of both ions simultaneously. This single molecular deficit is the
    branch point of the disease: the osteoclast loses the protons its
    ruffled-border pump secretes, the renal tubule loses both the protons it
    secretes and the bicarbonate it reclaims, and the brain loses the same
    activity for reasons that remain less well defined.
  molecular_functions:
  - preferred_term: cytosolic CO2 hydration to proton and bicarbonate
    modifier: ABSENT
    term:
      id: GO:0004089
      label: carbonate dehydratase activity
  biological_processes:
  - preferred_term: one-carbon (CO2/bicarbonate) interconversion
    modifier: DECREASED
    term:
      id: GO:0006730
      label: one-carbon metabolic process
  chemical_entities:
  - preferred_term: carbon dioxide
    term:
      id: CHEBI:16526
      label: carbon dioxide
  - preferred_term: bicarbonate
    term:
      id: CHEBI:17544
      label: hydrogencarbonate
  - preferred_term: proton
    term:
      id: CHEBI:24636
      label: proton
  downstream:
  - target: Osteoclast Resorption Lacuna Acidification Failure
    causal_link_type: DIRECT
    description: >-
      The osteoclast arm: without cytosolic protons the ruffled-border pump has
      nothing to secrete into the sealed resorption compartment.
    evidence:
    - reference: PMID:36709914
      reference_title: "Carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CA II deficiency is the paradigm OPT featuring failure of osteoclasts to resorb bone due to inability to acidify their pericellular milieu."
      explanation: >-
        States the causal step from enzyme loss to failed pericellular
        acidification in the osteoclast.
  - target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
    causal_link_type: DIRECT
    description: >-
      The renal arm: the same enzyme serves proton secretion and bicarbonate
      reclamation in proximal tubule and collecting-duct intercalated cells.
    evidence:
    - reference: PMID:6405388
      reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "clarify the role of renal CA II in urinary acidification and bicarbonate reabsorption"
      explanation: >-
        The founding paper's own statement of what the human deficiency reveals
        about renal CA II function.
  - target: Intracranial Parenchymal Calcium Deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cerebral arm. CA II is expressed in brain and its loss is uniquely
      associated with early-childhood intracranial calcification, but the
      intervening steps are not established - this edge is recorded as indirect
      with unknown intermediates rather than as a mechanism.
    evidence:
    - reference: PMID:36709914
      reference_title: "Carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although this enzymopathy reveals how CA II is important for the skeleton and kidney tubule, the pathogenesis of the mental subnormality and cerebral calcification is less well understood."
      explanation: >-
        Supports the association while explicitly stating that the pathogenesis
        of the cerebral arm is not understood, which is why the edge is typed as
        indirect with unknown intermediates.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carbonic anhydrase II deficiency (OMIM # 259730), initially called \"osteopetrosis with renal tubular acidosis and cerebral calcification syndrome\", reveals an important role for the enzyme carbonic anhydrase II (CA II) in osteoclast and renal tubule function."
    explanation: >-
      Establishes that the one enzyme's loss is what couples the osteoclast and
      renal tubule phenotypes.
- name: Osteoclast Resorption Lacuna Acidification Failure
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The osteoclast seals a resorption lacuna against the bone surface and
    acidifies it to roughly pH 4.5 by pumping protons across the ruffled border
    with the V-ATPase, with CLCN7 supplying the counter-ion chloride. Carbonic
    anhydrase II generates those protons in the cytosol. Without it the
    osteoclast is present, multinucleated and attached but cannot lower the pH
    of the compartment it has sealed. This is the defining contrast with TCIRG1
    and CLCN7 disease, where the pump and the counter-ion conductance
    themselves fail: the lesion here is upstream of the transport machinery, in
    the substrate it transports.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: acidification of the sealed resorption lacuna
    modifier: DECREASED
    term:
      id: GO:0045851
      label: pH reduction
  - preferred_term: proton secretion across the osteoclast ruffled border
    modifier: DECREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  locations:
  - preferred_term: bone tissue
    term:
      id: UBERON:0002481
      label: bone tissue
  downstream:
  - target: Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
    causal_link_type: DIRECT
    description: >-
      Hydroxyapatite dissolution is acid-dependent, so a lacuna that is not
      acidified does not release bone mineral.
    evidence:
    - reference: PMID:36709914
      reference_title: "Carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CA II deficiency is the paradigm OPT featuring failure of osteoclasts to resorb bone due to inability to acidify their pericellular milieu."
      explanation: >-
        The same sentence carries the next step as well: failed acidification is
        given as the reason resorption fails.
  evidence:
  - reference: PMID:6405388
    reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provide genetic evidence implicating CA II in osteoclast function and bone resorption"
    explanation: >-
      Human genetic evidence that CA II is required for osteoclast function -
      the inference the naturally occurring null makes available.
  - reference: PMID:6405388
    reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "explain previous observations that carbonic anhydrase inhibitors block the normal parathyroid hormone-induced release of calcium from bone"
    explanation: >-
      Pharmacological corroboration: inhibiting carbonic anhydrase
      phenocopies the resorption block. Indirect because it argues from
      inhibitor data rather than from the patients' osteoclasts.
- name: Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    With the resorption compartment at near-neutral pH the mineral phase is not
    dissolved and the organic matrix beneath it is not exposed to the
    osteoclast's proteolytic enzymes, so bone resorption fails at the tissue
    level while bone formation continues unchecked.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclastic bone resorption
    modifier: DECREASED
    term:
      id: GO:0045453
      label: bone resorption
  - preferred_term: bone remodeling
    modifier: DECREASED
    term:
      id: GO:0046849
      label: bone remodeling
  downstream:
  - target: Accumulation of Unresorbed Sclerotic Bone with Preserved Osteoclast Number
    causal_link_type: DIRECT
- name: Accumulation of Unresorbed Sclerotic Bone with Preserved Osteoclast Number
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Resorption fails while formation continues, so dense, poorly remodelled,
    mechanically brittle bone accumulates. Osteoclasts remain present and are
    not reduced in number - this is an osteoclast-rich osteopetrosis, the
    category shared with TCIRG1, CLCN7, OSTM1 and SNX10 disease and distinct
    from the osteoclast-poor RANKL/RANK forms, in which osteoclasts fail to be
    generated at all. The practical consequence is that supplying normal
    osteoclast precursors can rescue this arm, which is why transplantation
    works on the bone and on nothing else.
  biological_processes:
  - preferred_term: ossification continuing without matched resorption
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  locations:
  - preferred_term: bone element
    term:
      id: UBERON:0001474
      label: bone element
  downstream:
  - target: Cranial Foramen and Optic Canal Narrowing
    causal_link_type: DIRECT
  - target: Craniofacial Disproportion and Upper Airway Narrowing
    causal_link_type: DIRECT
  - target: Osteopetrosis
    causal_link_type: DIRECT
  - target: Recurrent fractures
    causal_link_type: DIRECT
    description: >-
      Dense bone in this disease is brittle rather than strong, and fracture is
      a presenting feature.
    evidence:
    - reference: PMID:15300855
      reference_title: "Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Other features include developmental delay, short stature, cognitive defects, and a history of multiple fractures by adolescence."
      explanation: Records repeated fracture as a consequence of the skeletal disease.

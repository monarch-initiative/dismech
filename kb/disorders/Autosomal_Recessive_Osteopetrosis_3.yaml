  description: A proximal, distal or mixed tubular acidification defect can occur; different clinical series report different predominant components. Some molecularly confirmed patients lacked detectable acidosis at assessment.
  diagnostic: true
  notes: Renal tubular acidosis may be proximal, distal or mixed. The Puerto Rican exon 7 frameshift proband had no detectable acidosis, whereas six later patients with the same allele did. A missing renal component does not exclude CA2 deficiency.
  evidence:
  - reference: PMID:12566520
    reference_title: 'A phenocopy of CAII deficiency: a novel genetic explanation for inherited infantile osteopetrosis with distal renal tubular acidosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most often, the RTA is of mixed proximal and distal type, but kindreds are reported in which either distal or proximal RTA predominates.
    explanation: The basis for binding the parent term rather than a proximal or distal child term.
  - reference: PMID:8128957
    reference_title: 'Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Six subsequent Hispanic patients of Caribbean ancestry, all of whom had osteopetrosis and renal tubular acidosis but who varied widely in clinical severity, were found to be homozygous for the same mutation.
    explanation: Supports the association while the same paper documents absence of detectable RTA in its index patient.

    Bilateral recurrent stones with hypercalciuria in one patient, whose
    affected siblings had neither stones nor nephrocalcinosis.
  notes: >-
    HP:0000787 is returned as "Kidney stone" by the OLS HPO endpoint and as
    "Nephrolithiasis" by the cache that term validation reads, which is a
    build-lag divergence rather than a different term. The cached form is bound
    here because that is what the validator compares against and what the rest
    of the knowledge base uses.
  evidence:
  - reference: PMID:9453381
    reference_title: "Nephrocalcinosis and urolithiasis in carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient from family 2, who had two previously reported affected siblings, developed bilateral recurrent renal stones and hypercalciuria but no nephrocalcinosis."
    explanation: >-
      Documents stones and hypercalciuria, and the intrafamilial discordance that
      keeps the frequency low.
- category: Respiratory
  name: Obstructive sleep apnea
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  description: >-
    Severe obstructive sleep apnea attributable to craniofacial dysmorphism
    rather than to adenotonsillar hypertrophy alone, reported in one child and
    successfully managed with CPAP.
  evidence:
  - reference: PMID:30109220
    reference_title: "Carbonic Anhydrase II Deficiency: A Rare Case of Severe Obstructive Sleep Apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we report a case of osteopetrosis with RTA associated with severe OSAS successfully treated with continuous positive airway pressure (CPAP)."
    explanation: The single reported case linking this syndrome to severe OSA.
- category: Audiologic
  name: Hearing impairment
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  description: >-
    Genuinely inconsistent across cohorts, and recorded here with evidence on
    both sides rather than as a settled feature. Conductive hearing impairment
    appears in descriptions of the Guibaud-Vainsel phenotype, progressive
    hearing loss was a stated indication for transplantation in two Irish
    families, and deafness is reported in an individual case; but in the largest
    single cohort all internal auditory canals were of normal size and no patient
    had clinically significant hearing loss.
  notes: >-
    No `frequency` is recorded: the cohort data are directly discordant, so any
    enum value here would be an invention. Bound to the parent HP:0000365 rather
    than to HP:0000405 (conductive) because the mechanism is not established
    across reports.
  evidence:
  - reference: PMID:12566520
    reference_title: "A phenocopy of CAII deficiency: a novel genetic explanation for inherited infantile osteopetrosis with distal renal tubular acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations of this autosomal recessive syndrome comprise increased bone density, growth failure, intracerebral calcification, facial dysmorphism, mental retardation, and conductive hearing impairment."
    explanation: >-
      Lists conductive hearing impairment among the syndrome's clinical
      manifestations.
  - reference: PMID:11264157
    reference_title: "Bone marrow transplantation corrects osteopetrosis in the carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two children, one from each family, have undergone allogeneic bone marrow transplantation because of severe progressive visual and hearing loss."
    explanation: >-
      Progressive hearing loss severe enough to be a transplantation indication
      in two related Irish families.
  - reference: PMID:22120147
    reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "All internal auditory canals were normal in size, and no patient had clinically significant hearing loss."
    explanation: >-
      Contradicts hearing impairment as a general feature: none of 23 patients
      had clinically significant hearing loss and no internal auditory canal was
      narrowed.
- category: Craniofacial
  name: Broad forehead
  phenotype_term:
    preferred_term: Broad forehead with large cranial vault
    term:
      id: HP:0000337
      label: Broad forehead
  description: >-
    Part of the craniofacial disproportion present in all 23 patients of the
    largest cohort, and the visible expression of skull overgrowth.
  evidence:
  - reference: PMID:22120147
    reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had osteopetrosis, renal tubular acidosis, developmental delay, short stature and craniofacial disproportion with large cranial vault and broad forehead."
    explanation: Craniofacial disproportion with broad forehead in 23/23 patients.
genetic:
- name: CA2
  gene_term:
    preferred_term: CA2
    term:
      id: hgnc:1373
      label: CA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants in all reported patients
  notes: >-
    CA2 (carbonic anhydrase 2, HGNC:1373, chromosome 8q21.2) encodes the
    cytosolic zinc metalloenzyme carbonic anhydrase II. The gene-disease
    relationship is near-absolute in both directions: patients with coexistent
    osteopetrosis and renal tubular acidosis have proven CA II deficient with one
    documented exception, and every CA II-deficient patient analysed has had a
    CA2 mutation. The gene was localised to chromosome 8 by somatic cell hybrid
    segregation analysis in 1983, the same year the enzyme defect was identified.
    Reported variant classes are splice-junction, nonsense, frameshift and
    missense, all acting by loss of function. The recurring alleles are the
    intron 2 5' splice-site "Arabic" founder variant (c.232+1G>T), the exon 7
    single-base deletion homozygous in Caribbean Hispanic families, and His107Tyr
    (found in the index American and a Belgian family), which retains greatly
    reduced but detectable activity.

    The gene CURIE was verified in both directions against the HGNC REST API
    before binding: symbol CA2 resolves to HGNC:1373, and HGNC:1373 resolves to
    symbol CA2 ("carbonic anhydrase 2", 8q21.2). This check was done because
    hgnc:1373 is easily confused with hgnc:13733, which is CDH23 - a different
    gene entirely. The stub's pre-filled `genes` value (hgnc:1373 / CA2) is
    correct.
  variants:
  - name: c.232+1G>T (intron 2 5' splice site; the "Arabic" founder allele)
    type: splice site
    clinical_significance: PATHOGENIC
    description: >-
      Splice donor-site variant at the 5' end of intron 2. The predominant cause
      of CA II deficiency in North African and Middle Eastern patients, found
      homozygously in all ten Tunisian patients of one series and in the Iranian
      patient who underwent transplantation. Associated with cognitive
      impairment and with relatively infrequent fractures.
    evidence:
    - reference: PMID:1301935
      reference_title: "A splice junction mutation in intron 2 of the carbonic anhydrase II gene of osteopetrosis patients from Arabic countries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have analyzed DNAs from members of six unrelated Arabic kindreds and found five to be homozygous and one heterozygous for a novel splice junction (donor site) mutation at the 5' end of intron 2."
      explanation: Original description of the intron 2 splice-junction variant.
    - reference: PMID:7959703
      reference_title: "A unique mutation underlying carbonic anhydrase II deficiency syndrome in patients of Arab descent."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation is found exclusively in patients with an Arabic background and thus may be confined to this ethnic group."
      explanation: Establishes the founder-allele character of the variant.
    - reference: PMID:38655726
      reference_title: "Allogenic hematopoietic stem cell transplantation in an Iranian patient with osteopetrosis caused by carbonic anhydrase II deficiency: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing revealed a pathogenic homozygous variant in intron 2 of the carbonic anhydrase 2 gene (CA2) gene (c.232 + 1 G>T)."
      explanation: >-
        Gives the HGVS form of the founder allele as reported by exome
        sequencing.
  - name: His107Tyr (p.H107Y)
    type: missense
    clinical_significance: PATHOGENIC
    description: >-
      C-to-T transition substituting tyrosine for the invariant histidine at
      position 107, disrupting hydrogen bonding to Glu-117 and Tyr-194 and
      destabilising the protein. Unusually among CA2 alleles it leaves
      detectable residual activity, which has been proposed as the explanation
      for the milder phenotype and absent cognitive impairment in the families
      that carry it.
    evidence:
    - reference: PMID:1928091
      reference_title: "Carbonic anhydrase II deficiency syndrome in a Belgian family is caused by a point mutation at an invariant histidine residue (107 His----Tyr): complete structure of the normal human CA II gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The change is a C-to-T transition which results in the substitution of Tyr (TAT) for His (CAT) at position 107."
      explanation: Original identification of the variant in a consanguineous Belgian family.
    - reference: PMID:1542674
      reference_title: "Molecular basis of human carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that the mutant enzyme expressed in bacteria from the cDNA containing the His-107----Tyr mutation has detectable, though greatly reduced, activity."
      explanation: >-
        Recombinant expression establishing that this allele is hypomorphic
        rather than null.
    - reference: PMID:1542674
      reference_title: "Molecular basis of human carbonic anhydrase II deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The three affected siblings from this family are compound heterozygotes, each having inherited two different mutations in the structural gene for carbonic anhydrase II."
      explanation: >-
        Documents compound heterozygosity (His107Tyr with an intron 5 splice
        acceptor variant) in the index American family.
  - name: Exon 7 single-base deletion (frameshift)
    type: frameshift
    clinical_significance: PATHOGENIC
    description: >-
      Single-base deletion in exon 7 producing a frameshift and premature
      termination, homozygous in seven unrelated Hispanic families of Caribbean
      ancestry. The truncated 27-kD product is inactive, aggregates, and is
      rapidly degraded.
    evidence:
    - reference: PMID:8128957
      reference_title: "Carbonic anhydrase II deficiency: single-base deletion in exon 7 is the predominant mutation in Caribbean Hispanic patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She proved to be homozygous for a single-base deletion in the coding region of exon 7 that produces a frameshift that changes the next 12 amino acids before leading to chain termination"
      explanation: Molecular description of the Caribbean Hispanic founder allele.
  - name: c.368G>A p.W123X (nonsense)
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous nonsense variant in exon 4 identified in a five-generation
      Chinese family; minigene and structural work attributed the effect to
      altered protein modification, impaired zinc binding, and reduced CA2
      protein expression.
    evidence:
    - reference: PMID:33555497
      reference_title: "A novel homozygous nonsense mutation in the CA2 gene (c.368G>A, p.W123X) linked to carbonic anhydrase II deficiency syndrome in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing and genetic analysis have revealed the homozygous nonsense mutation of CA2 gene (c.368G > A, p.W123X) in the exon 4 of chromosome 8 of the proband"
      explanation: Identification of the variant in the proband and its absence in unaffected relatives.
    - reference: PMID:33555497
      reference_title: "A novel homozygous nonsense mutation in the CA2 gene (c.368G>A, p.W123X) linked to carbonic anhydrase II deficiency syndrome in a Chinese family."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Properties and structure of mutated CA2 proteins changed after mutation, especially in change of protein modification and hindrance of zinc ions binding, which may lead to decreased protein expression level of CA2."
      explanation: >-
        Minigene and structural analysis of the functional consequence, performed
        in HEK293T cells.
  evidence:
  - reference: PMID:15300855
    reference_title: "Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With one exception, all patients with osteopetrosis and renal tubular acidosis examined have proven to have CA II deficiency. All CA II-deficient patients analyzed have been found to have mutations in the CA2 gene."
    explanation: >-
      The bidirectional gene-disease specificity statement, and the reason this
      is curated as a single disease rather than a grouping.
  - reference: PMID:6410391
    reference_title: "Polymorphic gene for human carbonic anhydrase II: a molecular disease marker located on chromosome 8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Segregation analysis of the molecular marker and chromosomes in cell hybrids indicated a clear correlation between the presence of chromosome 8 and the human CA II gene (CA2)."
    explanation: >-
      Somatic cell hybrid mapping of CA2 to chromosome 8, the step that made
      molecular diagnosis possible.
  - reference: PMID:15300855
    reference_title: "Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations were scattered over the genome from exon 2 to 7."
    explanation: >-
      Establishes that pathogenic variants are distributed across the gene
      rather than clustering in one domain, which is why diagnostic sequencing
      covers all seven exons.
biochemical:
- name: Erythrocyte carbonic anhydrase II
  biomarker_term:
    preferred_term: carbonic anhydrase II (erythrocyte isoenzyme II)
    term:
      id: NCIT:C183174
      label: Carbonic Anhydrase 2
  presence: >-
    Virtually absent in affected individuals by HPLC peak, esterase activity, CO2
    hydratase activity and immunoprecipitation; approximately half-normal in
    asymptomatic obligate heterozygotes; carbonic anhydrase I unaffected.
  specificity: >-
    Isoenzyme-specific. CA I levels are normal, so the assay distinguishes this
    disorder from a general carbonic anhydrase deficiency.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  readouts:
  - target: pathophysiology#Biallelic CA2 Loss of Function
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: >-
      Absence of erythrocyte CA II establishes the enzymatic diagnosis; the
      half-normal carrier level makes the same assay a carrier test.
    description: >-
      The erythrocyte is not an affected tissue in this disease, but it is the
      accessible one, and the enzyme is the same gene product.
    evidence:
    - reference: PMID:6405388
      reference_title: "Carbonic anhydrase II deficiency identified as the primary defect in the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report here biochemical and immunological evidence for the virtual absence of CA II in erythrocytes of patients affected with this condition, whereas CA I level is not reduced."
      explanation: >-
        The measurement behind this readout, and the isoenzyme specificity that
        makes an absent result interpretable.
  evidence:
  - reference: PMID:3925334
    reference_title: "Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced levels of isozyme II were found in obligate heterozygotes."
    explanation: Supports the carrier-detection use of the assay.
  - reference: PMID:3925334
    reference_title: "Carbonic anhydrase II deficiency in 12 families with the autosomal recessive syndrome of osteopetrosis with renal tubular acidosis and cerebral calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virtual absence of the carbonic anhydrase II peak on high-performance liquid chromatography, of the esterase and carbon dioxide hydratase activities of carbonic anhydrase II, and of immunoprecipitable isozyme II was demonstrated on extracts of erythrocyte hemolysates from all patients studied."
    explanation: >-
      Establishes absence of the enzyme by four concordant measurements in all
      patients studied.
definitions:
- name: Clinical triad of carbonic anhydrase II deficiency
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The historical clinical definition: osteopetrosis plus renal tubular
    acidosis plus cerebral calcification. Confirmation is by absent erythrocyte
    carbonic anhydrase II activity and by CA2 sequencing of all seven exons;
    prenatal diagnosis is molecular.
  scope: Clinical diagnosis of carbonic anhydrase II deficiency in a child with osteopetrosis
  attaches_to:
  - phenotypes#Osteopetrosis
  - phenotypes#Renal tubular acidosis
  - phenotypes#Cerebral calcification
  inclusion_criteria:
  - preferred_term: Osteopetrosis
    term:
      id: HP:0011002
      label: Osteopetrosis
    description: Radiographically increased, generalised bone density.
  - preferred_term: Renal tubular acidosis
    term:
      id: HP:0001947
      label: Renal tubular acidosis
    description: >-
      Hyperchloremic, normal-anion-gap metabolic acidosis of renal tubular
      origin; proximal, distal or mixed.
  - preferred_term: Intracranial parenchymal calcification
    term:
      id: HP:0002514
      label: Cerebral calcification
    description: >-
      Calcification on CT, typically basal ganglia and thalami. Age-dependent,
      so absence in a young child does not exclude the diagnosis.
  - preferred_term: Absent erythrocyte carbonic anhydrase II activity
    description: >-
      Biochemical confirmation; carbonic anhydrase I is unaffected, and obligate
      heterozygotes sit at about half-normal.
  - preferred_term: Biallelic pathogenic CA2 variants
    description: >-
      Molecular confirmation by sequencing of all seven CA2 exons. This is the
      criterion that settles the diagnosis.
  notes: >-
    Two caveats for applying the triad in a young child. Cerebral calcification
    is age-dependent and has been absent at 9 years in a genetically confirmed
    patient, and at least one confirmed patient had no detectable renal tubular
    acidosis. The triad is a strong clinical trigger, not a set of necessary
    conditions - which is why the molecular criterion is the one that settles the
    diagnosis.
  evidence:
  - reference: PMID:30109220
    reference_title: "Carbonic Anhydrase II Deficiency: A Rare Case of Severe Obstructive Sleep Apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deficiency of carbonic anhydrase II causes a moderate form, presenting classically as a triad of osteopetrosis, renal tubular acidosis (RTA), and cerebral calcification."
    explanation: States the classical triad.
  - reference: PMID:15300855
    reference_title: "Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we amplified all seven exons by PCR from genomic DNA and directly sequenced the amplified products"
    explanation: The molecular confirmation method, covering all seven exons.
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal diagnosis requires mutational analysis of CA2."
    explanation: Establishes that prenatal diagnosis is molecular rather than biochemical.
animal_models:
- name: Car-2 null mouse (ENU-induced)
  species: Mouse
  genotype: Car-2 null (ENU-induced, homozygous)
  background: (C57BL/6J x DBA/2J)F1-derived
  publication: PMID:3126501
  description: >-
    An N-ethyl-N-nitrosourea-induced null allele at the mouse Car-2 locus on
    chromosome 3, with no detectable CA II protein in any tissue. This is the
    reference model for the disease and it splits the human phenotype cleanly in
    two: it reproduces the renal tubular acidosis and the growth failure, and it
    does not reproduce the osteopetrosis at any age. That dissociation is the
    single most important thing to know before using the model for the bone arm.
  modeled_mechanisms:
  - target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Homozygous null mice develop renal tubular acidosis, as humans with the
      same enzyme defect do.
    limitations: >-
      The mouse renal defect has not been segment-resolved against the mixed
      proximal-and-distal pattern typical of human disease, and the mouse shows
      an additional intercalated-cell population phenotype whose human
      counterpart is unknown.
    readouts:
    - name: Renal tubular acidosis in homozygous null mice
      target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
      direction: ALTERED
      interpretation: >-
        The acid-base phenotype of the model matches the human renal arm.
      evidence:
      - reference: PMID:3126501
        reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Like humans with the same inherited enzyme defect, animals homozygous for the new null allele are runted and have renal tubular acidosis."
        explanation: Reports the renal tubular acidosis in the null mouse.
    - name: Collecting-duct intercalated cell depletion
      target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
      direction: DECREASED
      interpretation: >-
        Beyond loss of enzyme activity, the acid-secreting cell population itself
        is depleted and replaced by principal cells - a cell-population
        phenotype, not only an enzymatic one.
      evidence:
      - reference: PMID:8594870
        reference_title: "Depletion of intercalated cells from collecting ducts of carbonic anhydrase II-deficient (CAR2 null) mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These results suggest that intercalated cells are severely depleted and are replaced by principal cells in CAII-deficient mice."
        explanation: >-
          Immunocytochemical quantification of intercalated-cell loss in the
          CAR2-null collecting duct.
    - name: Collecting-duct bicarbonate transporter expression
      target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
      direction: DECREASED
      interpretation: >-
        Pendrin, Slc26a7 and AE1 expression all fall, consistent with loss of
        the intercalated-cell phenotype rather than an isolated enzyme deficit.
      evidence:
      - reference: PMID:18209476
        reference_title: "Decreased expression of Slc26a4 (Pendrin) and Slc26a7 in the kidneys of carbonic anhydrase II-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CAII deficiency results in a significant decrease in the gene and protein expression of bicarbonate transport proteins from Slc26 gene family - Slc26a4 (pendrin) and Slc26a7."
        explanation: Quantifies the transporter expression changes in the null kidney.
    evidence:
    - reference: PMID:3126501
      reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The CA II protein, which is normally expressed in most tissues, could not be detected by immunodiffusion analysis in any tissues of the CA II-deficient mice"
      explanation: >-
        Confirms the model is a true protein null, so it is informative for the
        consequences of losing the enzyme.
  - target: Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The defining human phenotype is absent from the mouse null. Osteopetrosis
      could not be detected even in very old homozygotes.
    limitations: >-
      A negative result in this model is not evidence against the human
      mechanism. The most economical explanation is redundancy among carbonic
      anhydrase isoenzymes in mouse osteoclasts that human osteoclasts do not
      have, but that has not been demonstrated, so the species difference itself
      is unexplained. The model cannot be used to study the bone arm or to test
      bone-directed therapy.
    readouts:
    - name: Skeletal density in aged homozygous null mice
      target: Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result: no osteopetrosis at any age examined.
      evidence:
      - reference: PMID:3126501
        reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, the prominent osteopetrosis found in humans with CA II deficiency could not be detected even in very old homozygous null mice."
        explanation: Direct statement of the negative skeletal finding.
    evidence:
    - reference: PMID:3126501
      reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "However, the prominent osteopetrosis found in humans with CA II deficiency could not be detected even in very old homozygous null mice."
      explanation: >-
        Refutes the claim that this model is informative for the human skeletal
        mechanism, which is the substantive negative claim this link makes.
  evidence:
  - reference: PMID:2495727
    reference_title: "Mice carrying a CAR-2 null allele lack carbonic anhydrase II immunohistochemically and show vascular calcification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The CA II-deficient mice differed from controls in evidencing an age dependent medial calcification of small arteries in a number of organs."
    explanation: >-
      The model does develop an age-dependent ectopic calcification, though
      arterial rather than cerebral. Recorded here as a characterised feature of
      the model, not as a model of the human brain phenotype - see the cerebral
      calcification discussion.
  notes: >-
    Listed under `animal_models` rather than `experimental_models`: this is a
    whole-organism model. The arterial calcification finding is deliberately not
    linked to the Intracranial Parenchymal Calcium Deposition node, because
    medial arterial calcification in mouse viscera and parenchymal basal-ganglia
    calcification in children are different lesions in different tissues, and no
    source connects them.
treatments:
- name: Oral alkali therapy
  description: >-
    Oral bicarbonate or citrate to correct the hyperchloremic metabolic acidosis.
    This is the mainstay for the renal arm and the only arm-directed therapy that
    is not a transplant. It is worth being precise about its standing: there is
    no standardised pharmacologic regimen for this disease, and the strongest
    statement available is an inference from a cohort whose overall phenotype was
    milder than historical series, whose authors raised the possibility that
    early bicarbonate treatment was responsible. Alkali therapy does not affect
    the skeletal or cerebral arms.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  target_mechanisms:
  - target: Systemic Hyperchloremic Metabolic Acidosis
    treatment_effect: MODULATES
    description: >-
      Exogenous base offsets retained acid. It substitutes for the missing
      tubular function rather than restoring it, so the tubular defect itself is
      untouched.
    evidence:
    - reference: PMID:22120147
      reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "raising the possibility that early treatment of systemic acidosis with bicarbonate may be crucial in the outcome of this uncommon autosomal recessive problem"
      explanation: >-
        The authors' own inference from a cohort milder than historical series.
        Indirect because it is a hypothesis raised by a cross-cohort comparison,
        not a measured treatment effect.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several mouse models of CA II deficiency have shown growth hormone deficiency, yet currently there is no standard pharmacologic therapy for patients."
    explanation: >-
      Establishes that no pharmacologic therapy is standardised for this disease
      - the reason alkali therapy is described here as the mainstay for one arm
      rather than as a protocol.
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    Transplantation supplies CA II-competent osteoclast precursors, which are
    hematopoietic in origin, and can resolve the osteopetrosis histologically and
    radiologically. It is an arm-specific therapy by construction: the renal
    tubule and the brain are not hematopoietic, keep their own enzyme defect, and
    are unaffected. Reported indications have been severe progressive visual and
    hearing loss rather than marrow failure. This is emphatically not the default
    management of CA2 deficiency the way it is for TCIRG1 malignant infantile
    osteopetrosis: this is an intermediate osteopetrosis whose skeletal phenotype
    often improves with age and which is compatible with a normal lifespan, so
    transplantation is reserved.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Osteoclast Resorption Lacuna Acidification Failure
    treatment_effect: RESTORES
    description: >-
      Donor-derived osteoclasts carry functional CA II and can acidify the
      resorption lacuna, so this node is the one the transplant actually
      corrects.
    evidence:
    - reference: PMID:11264157
      reference_title: "Bone marrow transplantation corrects osteopetrosis in the carbonic anhydrase II deficiency syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Allogeneic bone marrow stem cell replacement cures the osteoclast component of CAII deficiency and retards the development of cerebral calcification, but it appears to have little or no effect on the renal lesions."
      explanation: >-
        States precisely which arm the transplant corrects and which it does not,
        which is what makes this an arm-specific mechanism link.
  evidence:
  - reference: PMID:11264157
    reference_title: "Bone marrow transplantation corrects osteopetrosis in the carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-transplantation evaluation at 2 and 3 years demonstrates histologic and radiologic resolution of their osteopetrosis with stabilization of hearing and vision."
    explanation: Documents resolution of the skeletal disease after transplantation.
  - reference: PMID:11264157
    reference_title: "Bone marrow transplantation corrects osteopetrosis in the carbonic anhydrase II deficiency syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children remain developmentally delayed and continue to have RTA, and the older child has now developed cerebral calcification."
    explanation: >-
      Contradicts any reading of transplantation as a cure for the disease: the
      renal and cerebral arms progressed afterwards. Recorded as a separate
      REFUTE item because the same report carries both claims.
  - reference: PMID:38655726
    reference_title: "Allogenic hematopoietic stem cell transplantation in an Iranian patient with osteopetrosis caused by carbonic anhydrase II deficiency: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He Engrafted on day +13, and 95% chimerism was achieved."
    explanation: >-
      A recent worked case with matched related donor engraftment, confirming
      feasibility in this specific genotype.
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although CA II deficiency is an "osteoclast-rich" OPT, and therefore transplantation of healthy osteoclasts can improve the skeletal disease, the RTA and central nervous system difficulties persist.'
    explanation: >-
      Gives the mechanistic reason transplantation works here (osteoclast-rich,
      so supplying competent precursors suffices) and the reason it is limited to
      the one arm.
  notes: >-
    The general osteopetrosis literature calls transplantation "the treatment of
    choice for most forms of osteopetrosis" (PMID:42096006). That statement is
    about osteopetrosis as a group, dominated by the malignant infantile forms,
    and is not a recommendation for CA II deficiency - which is why it is cited
    here as context in `notes` rather than as evidence for this treatment.
- name: Continuous positive airway pressure for obstructive sleep apnea
  description: >-
    CPAP for craniofacial obstructive sleep apnea. Reported in a single child in
    whom adherence built up gradually from a minimal starting pressure. Relevant
    because the airway obstruction in this disease is skeletal in origin, so
    adenotonsillectomy alone may not resolve it - in the reported family the twin
    had a severe respiratory complication after that surgery.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: continuous positive airway pressure
    term:
      id: NCIT:C124040
      label: Continuous Positive Airway Pressure
  target_phenotypes:
  - preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  evidence:
  - reference: PMID:30109220
    reference_title: "Carbonic Anhydrase II Deficiency: A Rare Case of Severe Obstructive Sleep Apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we report a case of osteopetrosis with RTA associated with severe OSAS successfully treated with continuous positive airway pressure (CPAP)."
    explanation: The single report of CPAP use in this disease.
- name: Genetic counseling, carrier testing and prenatal diagnosis
  description: >-
    The only available primary prevention. Relevant in high-consanguinity
    families and in communities carrying the intron 2 founder allele, where
    cascade testing is tractable because the variant is known. Carrier detection
    is possible biochemically (about half-normal erythrocyte CA II) and
    definitively by CA2 genotyping; prenatal diagnosis is molecular and has been
    performed on both cultured amniocytes and chorionic villus material.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal diagnosis requires mutational analysis of CA2."
    explanation: Establishes that prenatal diagnosis is molecular.
  - reference: PMID:15300855
    reference_title: "Carbonic anhydrase II deficiency syndrome (osteopetrosis with renal tubular acidosis and brain calcification): novel mutations in CA2 identified by direct sequencing expand the opportunity for genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two opportunities for prenatal diagnosis, one from cultured amniocytes and one from chorionic villus biopsy, we demonstrated the general utility of the direct sequencing method for prenatal DNA diagnosis."
    explanation: Documents prenatal diagnosis on both sample types.
  - reference: PMID:9580777
    reference_title: "Clinical and molecular heterogeneity in carbonic anhydrase II deficiency and prenatal diagnosis in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of the mutation in this family provided the opportunity for prenatal diagnosis in a subsequent pregnancy."
    explanation: A worked instance of family-specific prenatal diagnosis.
discussions:
- discussion_id: ca2_cerebral_calcification_mechanism
  prompt: >-
    By what route does loss of cytosolic carbonic anhydrase II produce
    parenchymal calcium deposition in basal ganglia and thalami, and why does the
    calcium burden not track neurodevelopmental outcome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Intracranial Parenchymal Calcium Deposition
  - phenotypes#Cerebral calcification
  - phenotypes#Intellectual disability
  rationale: >-
    The bone and kidney arms of this disease are mechanistically closed: the
    enzyme supplies protons, the pump secretes them, the mineral dissolves or the
    urine acidifies. The cerebral arm is not. Nothing demonstrated connects CA II
    loss to mineral deposition at these specific sites, the authoritative review
    states outright that the pathogenesis of the cerebral calcification and the
    cognitive impairment is less well understood, and the one study to quantify
    the calcium burden found it unrelated to developmental quotient,
    neurodevelopmental symptoms, neuropsychiatric symptoms or optic canal
    diameter. Two further observations keep the question open rather than
    narrowing it. Calcification is age-dependent and was absent at 9 years in one
    confirmed patient, so it is accrued rather than congenital. And cognitive
    outcome varies markedly between siblings sharing the intron 2 founder allele,
    which the cohort's authors read as implying additional genetic or epigenetic
    influences. Practically, this means imaging calcium burden should not be used
    as a prognostic surrogate, and a curated edge from the enzyme defect to
    cognition would be an invention.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although this enzymopathy reveals how CA II is important for the skeleton and kidney tubule, the pathogenesis of the mental subnormality and cerebral calcification is less well understood."
    explanation: >-
      The explicit statement that this arm is the unexplained one, contrasted
      with the two arms that are explained.
  - reference: PMID:39667299
    reference_title: "The correlation of intracranial parenchymal calcium score and the severity of neurological clinical presentation in carbonic anhydrase deficiency type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Correlation analysis revealed no significant associations between intracranial parenchymal calcium score and age, DQ score, or optic canal diameter."
    explanation: >-
      The negative correlation that blocks the obvious inference from calcium
      burden to cognitive outcome.
  - reference: PMID:22120147
    reference_title: "The neurology of carbonic anhydrase type II deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variability of brain calcification, cognitive disturbance and optic nerve involvement may imply additional genetic or epigenetic influences affecting the course of the disease."
    explanation: >-
      Genotype-identical patients diverge on exactly the features in question,
      which is what makes this a mechanism gap rather than a sampling problem.
- discussion_id: ca2_mouse_null_lacks_osteopetrosis
  prompt: >-
    Why does the Car-2 null mouse reproduce the renal and growth arms of
    carbonic anhydrase II deficiency but not the osteopetrosis, and what model is
    therefore valid for studying the human bone arm?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Osteoclast Resorption Lacuna Acidification Failure
  - pathophysiology#Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
  - animal_models#Mouse
  rationale: >-
    This is a mismatch rather than a knowledge gap: the evidence exists, in a
    true protein-null mouse, and it is negative for the defining human phenotype.
    Homozygous Car-2 null mice are runted and acidotic like patients, but
    osteopetrosis could not be detected even in very old animals. The usual
    explanation offered is redundancy among carbonic anhydrase isoenzymes in
    mouse osteoclasts that human osteoclasts lack, which is plausible and
    undemonstrated. Two consequences follow for curation and for experimental
    design. First, the negative mouse skeletal result must not be read as
    evidence against the human osteoclast mechanism, which rests on human
    genetics, human enzyme assays, and the pharmacological phenocopy produced by
    carbonic anhydrase inhibitors. Second, no validated model exists for the
    human bone arm, so preclinical testing of bone-directed therapy has no
    substrate - patient-derived or CA2-knockout human osteoclast systems would be
    the way to close this, and none is reported.
  evidence:
  - reference: PMID:3126501
    reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the prominent osteopetrosis found in humans with CA II deficiency could not be detected even in very old homozygous null mice."
    explanation: >-
      The negative skeletal result in a confirmed protein null, which is the
      mismatch itself.
  - reference: PMID:3126501
    reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Like humans with the same inherited enzyme defect, animals homozygous for the new null allele are runted and have renal tubular acidosis."
    explanation: >-
      The same animal reproduces the renal and growth arms, so the failure is
      specific to bone rather than a failed model overall.
- discussion_id: ca2_growth_failure_attribution
  prompt: >-
    Is the short stature of carbonic anhydrase II deficiency caused by chronic
    metabolic acidosis, by the skeletal disease, or by growth hormone deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Short stature
  - pathophysiology#Systemic Hyperchloremic Metabolic Acidosis
  rationale: >-
    Short stature is near-universal - 23 of 23 patients in the largest cohort -
    but its mechanism is not assigned, which is why no pathograph edge points at
    it in this entry. Three candidates are live and none is excluded. Chronic
    metabolic acidosis impairs growth generally, and the null mouse is both
    acidotic and runted, which is suggestive but is co-occurrence in a single
    genotype rather than a demonstrated causal chain. The sclerosing skeletal
    disease is an obvious alternative. And growth hormone deficiency has been
    reported in several mouse models of CA II deficiency, which would place the
    lesion in a third, endocrine compartment that nothing in this entry currently
    models. Resolving this matters clinically: it determines whether correcting
    acidosis early is expected to protect growth, which is the implicit
    justification for treating the acidosis in childhood.
  evidence:
  - reference: PMID:36709914
    reference_title: "Carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several mouse models of CA II deficiency have shown growth hormone deficiency, yet currently there is no standard pharmacologic therapy for patients."
    explanation: >-
      Introduces the growth-hormone candidate, and in the same sentence records
      that no therapy is standardised.
  - reference: PMID:3126501
    reference_title: "N-ethyl-N-nitrosourea-induced null mutation at the mouse Car-2 locus: an animal model for human carbonic anhydrase II deficiency syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Like humans with the same inherited enzyme defect, animals homozygous for the new null allele are runted and have renal tubular acidosis."
    explanation: >-
      Runting and acidosis co-occur in the null mouse, which is the observation
      behind the acidosis hypothesis - but it is co-occurrence, not a
      demonstrated mechanism.
- discussion_id: ca2_residual_renal_carbonic_anhydrase
  prompt: >-
    If CA II is the only soluble carbonic anhydrase isoenzyme in the kidney, why
    do CA II-deficient patients still respond to intravenous acetazolamide with a
    rise in urinary pH and bicarbonate excretion?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
  rationale: >-
    Patients with undetectable erythrocyte CA II nevertheless show a normal renal
    response to acetazolamide. The original authors set out three explanations -
    that the deficiency is not expressed in kidney, that another
    acetazolamide-sensitive soluble isoenzyme is expressed there in these
    patients, or that the response reflects the membrane-bound luminal carbonic
    anhydrase, a different gene product unaffected by the CA2 mutation - and
    favoured the third. This is recorded as an open question rather than settled
    because the entry's renal node depends on it: if luminal membrane-bound
    activity is intact, the human renal defect is a partial loss of tubular
    carbonic anhydrase function, not a total one, and the residual activity is a
    potential target. It also bears on the interpretation of acetazolamide
    challenge as a diagnostic test, which would be uninformative here.
  evidence:
  - reference: PMID:3932950
    reference_title: "Positive renal response to intravenous acetazolamide in patients with carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following acetazolamide infusion, the CA II-deficient patients exhibited a prompt rise in urinary pH and HCO3- excretion similar to the response seen in control subjects."
    explanation: The observation that creates the question.
  - reference: PMID:3932950
    reference_title: "Positive renal response to intravenous acetazolamide in patients with carbonic anhydrase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that CA II-deficient patients, who lack detectable CA II in their erythrocytes, still expressed an acetazolamide-inhibitable CA activity in their kidneys."
    explanation: >-
      The authors' inference that residual acetazolamide-sensitive activity
      persists in the CA II-deficient kidney.
- discussion_id: ca2_osteopetrosis_rta_phenocopy
  prompt: >-
    Does the combination of osteopetrosis and renal tubular acidosis always mean
    CA II deficiency, given that coinherited TCIRG1 and ATP6V1B1 defects can
    reproduce it?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - phenotypes#Osteopetrosis
  - phenotypes#Renal tubular acidosis
  - genetic#CA2
  rationale: >-
    The clinical triad is a very strong pointer to CA2 and is often treated as
    diagnostic, but it is not pathognomonic, and the documented exception is
    instructive rather than merely pedantic. One kindred with osteopetrosis and
    distal renal tubular acidosis had normal CA II levels and no CA2 defect;
    instead two separate recessive disorders were segregating, a TCIRG1 deletion
    producing the osteopetrosis and an ATP6V1B1 mutation producing the distal
    RTA. Both genes encode subunits of the same proton pump, in
    tissue-specific isoforms. The practical consequence is that the triad
    justifies CA2 testing and the enzyme assay, but a negative CA2 result in a
    patient with the full phenotype should prompt a search for coinherited pump
    subunit defects rather than a presumption of a cryptic CA2 variant.
  evidence:
  - reference: PMID:12566520
    reference_title: "A phenocopy of CAII deficiency: a novel genetic explanation for inherited infantile osteopetrosis with distal renal tubular acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this kindred, two separate recessive disorders are penetrant, each affecting a different, tissue specific subunit of the vacuolar proton pump (H(+)-ATPase), providing a highly unusual, novel genetic explanation for the coexistence of osteopetrosis and dRTA."
    explanation: The documented genetic phenocopy of the CA II deficiency phenotype.
  - reference: PMID:12566520
    reference_title: "A phenocopy of CAII deficiency: a novel genetic explanation for inherited infantile osteopetrosis with distal renal tubular acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, there have been no exceptions to the finding of CAII deficiency in patients with coexistent osteopetrosis and RTA."
    explanation: >-
      The prior expectation the same paper then breaks - which is why this is
      recorded as an interpretation question rather than as a settled rule in
      either direction.

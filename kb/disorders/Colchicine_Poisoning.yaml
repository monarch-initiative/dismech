progression:
- phase: Gastrointestinal phase
  duration: approximately 10 to 24 hours after ingestion
  notes: >-
    Vomiting, abdominal pain and diarrhoea, indistinguishable from gastroenteritis.
    This is where the diagnosis is missed, and the review notes the phase can be
    absent altogether after intravenous administration - so its absence does not
    exclude the poisoning.
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      10-24 h after ingestion - gastrointestinal phase mimicking gastroenteritis
      may be absent after intravenous administration
    explanation: >-
      Gives the timing of this phase, the gastroenteritis resemblance, and the
      route-dependent exception.
- phase: Multi-organ dysfunction
  duration: 24 hours to 7 days after ingestion
  notes: >-
    The dangerous phase, and the one that follows an apparent improvement in the
    gastrointestinal symptoms. Marrow failure, cytopenias, sepsis, cardiac and
    renal injury. Death here is from multi-organ failure and sepsis rather than
    from any single organ.
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      24 h to 7 days after ingestion - multi-organ dysfunction. Death results from
      rapidly progressive multi-organ failure and sepsis.
    explanation: >-
      Gives the interval and the mode of death for this phase.
- phase: Recovery
  duration: within a few weeks of ingestion
  notes: >-
    Recovery in survivors is generally complete, which is a meaningful feature of
    this poisoning: the lesion is a reversible binding event, not a permanent
    structural one, so a patient supported through the cytopenic phase can be
    expected to recover fully.
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recovery typically occurs within a few weeks of ingestion, and is generally
      a complete recovery barring complications of the acute illness.
    explanation: >-
      States the timing and completeness of recovery.
- phase: Chronic-accumulation neuromyopathy
  duration: median 21 days to resolution after the drug is stopped
  notes: >-
    A separate time course belonging to the chronic route rather than to acute
    overdose. The systematic review found a mean total daily dose of 1.25 mg -
    that is a therapeutic dose - and 48 percent had been taking colchicine for
    more than twelve months before the neuromyopathy declared. Stopping the drug
    resolved symptoms completely in 70 percent, at a median of 21 days.
  evidence:
  - reference: PMID:36512928
    reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean total daily dose was 1.25±0.60 mg and 48% had been taking
      colchicine for more than 12 months before presenting with neuromyopathy.
    explanation: >-
      Gives the dose and the exposure duration this phase is defined by.
  - reference: PMID:36512928
    reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cessation of colchicine generally led to complete resolution of symptoms in
      70% of cases within a median of 21 days.
    explanation: >-
      Gives the resolution proportion and the median time this phase's duration is
      taken from.
environmental:
- name: Colchicine exposure above the therapeutic window
  description: >-
    Exposure by two routes that differ in tempo but not in mechanism: an acute
    ingestion in self-harm or in error, and slow accumulation at prescribed doses
    when clearance falls. The second route is the one that catches clinicians out,
    because the prescription is correct and the patient is poisoned anyway.
  exposure_term:
    preferred_term: exposure to colchicine
    term:
      id: ECTO:0000509
      label: exposure to drug
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
  influences_mechanisms:
  - target: Colchicine Exposure Exceeding the Therapeutic Window
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingestion is what establishes the systemic burden the rest of the pathograph
      follows from.
    evidence:
    - reference: PMID:20586571
      reference_title: "Colchicine poisoning: the dark side of an ancient drug."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        High fatality rate was reported after acute ingestions exceeding 0.5
        mg/kg. The lowest reported lethal doses of oral colchicine are 7-26 mg.
      explanation: >-
        Ties ingested dose to outcome, which is the exposure-to-burden step this
        link asserts.
  evidence:
  - reference: PMID:36512928
    reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal and hepatic dysfunction and medications that inhibit cytochrome P450
      3A4 isozyme (CYP3A4) and P-glycoprotein (P-gp) appear to be the most
      significant risk factors.
    explanation: >-
      Establishes the accumulation route - impaired clearance and interacting
      drugs - as the dominant risk setting for toxicity at ordinary doses.
  notes: >-
    Bound to ECTO:0000509 exposure to drug. ECTO was searched through this
    repository's own adapter (sqlite:obo:ecto) for a colchicine-specific exposure
    class and none exists; ECTO:9000271 exposure to alkaloid resolves and is
    chemically accurate, but it describes the wrong exposure context, since the
    poisoning is a medicinal one. A term resolving in OLS would not be sufficient
    here, because dismech does not validate ECTO against OLS.
treatments:
- name: Granulocyte colony-stimulating factor
  description: >-
    G-CSF is given to shorten the neutropenic phase. It does not oppose the
    tubulin lesion and it cannot restart a progenitor that is arrested; it acts on
    the marrow's output once the drug is clearing, which is why it is described as
    supportive rather than as an antidote. It is the one pharmacological measure
    here that is aimed at a specific node of this pathograph.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    treatment_effect: MODULATES
    description: >-
      Stimulates granulopoiesis to shorten the period of neutropenia. Recorded as
      MODULATES rather than RESTORES because the cited reports describe recovery
      of counts under treatment, not a demonstrated reversal of the marrow lesion
      against a control.
    evidence:
    - reference: PMID:1384817
      reference_title: "Use of granulocyte colony-stimulating factor in the treatment of pancytopenia secondary to colchicine overdose."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        His pancytopenia resolved after subcutaneous administration of one
        300-micrograms dose of G-CSF.
      explanation: >-
        Reports resolution of the cytopenia after G-CSF in a single case. A single
        uncontrolled case cannot separate the drug's effect from spontaneous
        marrow recovery, which is why the effect is graded MODULATES.
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive treatments including administration of granulocyte
      colony-stimulating factor are the mainstay of treatment.
    explanation: >-
      Establishes G-CSF within supportive care as the mainstay, which is the role
      this entry gives it.
  - reference: PMID:7530779
    reference_title: "Colchicine toxicity--clinical features and treatment. Massive overdose case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pancytopenia responded to granulocyte colony-stimulating factor 300
      micrograms on days 4, 5, 6, and 8.
    explanation: >-
      A second case reporting response of the pancytopenia to G-CSF, with the
      dosing schedule.
  notes: >-
    therapeutic_modality is OTHER rather than SMALL_MOLECULE: filgrastim is a
    recombinant protein, and the schema has no cytokine or growth-factor value.
- name: Activated charcoal
  description: >-
    Gastrointestinal decontamination. Colchicine undergoes significant
    enterohepatic recirculation, which is a specific argument for charcoal here
    beyond the generic one, though the cited review recommends it on timing
    grounds without invoking that.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: activated charcoal
      term:
        id: CHEBI:91090
        label: charcoal
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Timely gastrointestinal decontamination should be considered with activated
      charcoal, and very large, recent (<60 min) ingestions may warrant gastric
      lavage.
    explanation: >-
      States the decontamination recommendation and its timing constraint.
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colchicine and its metabolites undergo significant enterohepatic
      re-circulation which may further lead to its retention in the body
    explanation: >-
      Documents the enterohepatic recirculation this entry names as an additional
      argument for charcoal. The source states the recirculation, not that
      charcoal interrupts it.
- name: Withdrawal of colchicine and of interacting drugs
  description: >-
    For the chronic-accumulation neuromyopathy this is the treatment, and it
    works: symptoms resolved completely in 70 percent of reviewed cases at a
    median of 21 days. Rechallenge at a reduced dose was usually tolerated, which
    matters clinically for patients with familial Mediterranean fever who have few
    alternatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Colchicine Exposure Exceeding the Therapeutic Window
    treatment_effect: INHIBITS
    description: >-
      Stopping the drug removes the exposure at the head of the pathograph, which
      is why the downstream neuromyopathy reverses.
    evidence:
    - reference: PMID:36512928
      reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cessation of colchicine generally led to complete resolution of symptoms
        in 70% of cases within a median of 21 days.
      explanation: >-
        Demonstrates that removing the exposure reverses the downstream syndrome,
        which is the claim of this link.
  evidence:
  - reference: PMID:19078054
    reference_title: "Colchicine neuromyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is important to be aware of this entity, as the discontinuation of
      colchicine will allow a prompt remission.
    explanation: >-
      States discontinuation as the effective intervention for the myopathy.
- name: Intensive supportive care
  description: >-
    Mechanical ventilation, vasopressors, renal replacement therapy, transfusion
    and antimicrobial cover for the neutropenic phase. In a poisoning with no
    antidote and a reversible lesion, keeping the patient alive through the
    cytopenic window is the whole of the treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there are currently no specific antidotes for colchicine poisoning
    explanation: >-
      Establishes the absence of an antidote, which is why supportive care carries
      the treatment.
  - reference: PMID:7530779
    reference_title: "Colchicine toxicity--clinical features and treatment. Massive overdose case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although anticolchicine monoclonal antibody administration is the only
      specific therapy described, intensive supportive care including granulocyte
      colony-stimulating factor administration can facilitate recovery from severe
      colchicine intoxication.
    explanation: >-
      States that intensive supportive care can carry a patient through severe
      poisoning.
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although a specific experimental treatment (Fab fragment antibodies) for
      colchicine poisoning has been used, it is not commercially available.
    explanation: >-
      Records that the one specific therapy described is unavailable in practice,
      which is why this entry curates supportive care rather than an antidote.
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      its Vd can even reach up to 21 L/kg in overdose
    explanation: >-
      Gives the volume of distribution in overdose. A distribution volume of this
      size is the reason extracorporeal removal is not curated here as a means of
      clearing colchicine.
  notes: >-
    Colchicine-specific Fab fragments are not curated as a treatment of this
    disease because they are not commercially available, per the cited systematic
    review. Extracorporeal removal is likewise not curated as a means of clearing
    the drug: the volume of distribution cited above makes colchicine a poor
    dialysis candidate, and the renal replacement therapy used in the reported
    cases was for the acute kidney injury rather than for drug removal.

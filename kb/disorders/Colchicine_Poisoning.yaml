name: Colchicine Poisoning
creation_date: '2026-09-01T22:30:00Z'
description: >-
  Colchicine poisoning follows exposure to a drug with a narrow therapeutic index
  and no clear boundary between a therapeutic, a toxic and a lethal dose. It
  arrives by two quite different routes: acute overdose taken in self-harm or in
  error, and slow accumulation at ordinary prescribed doses when renal or hepatic
  clearance falls or a CYP3A4 or P-glycoprotein inhibitor is co-prescribed. Both
  routes converge on one molecular lesion. Colchicine binds tubulin and prevents
  microtubule assembly, and every downstream injury is an extension of that
  binding. The cells that depend most on the mitotic spindle fail first, so the
  gut mucosa and then the bone marrow give way, and it is the resulting
  pancytopenia with neutropenic sepsis that kills. The cells that depend on
  microtubule-based transport rather than on mitosis fail far more slowly,
  producing the proximal myopathy and accompanying peripheral neuropathy that
  characterise the chronic-accumulation route. One lesion, two tissues, two clocks. There is no
  antidote in routine clinical use.
categories:
- Toxic Exposure Disorder
- Treatment Toxicity
category: Complex
parents:
- Poisoning
disease_term:
  preferred_term: colchicine poisoning
  term:
    id: MONDO:0017859
    label: colchicine poisoning
pathophysiology:
- name: Colchicine Exposure Exceeding the Therapeutic Window
  description: >-
    Systemic colchicine burden above what the patient can tolerate, reached either
    by a single large ingestion or by accumulation at ordinary doses. The drug has
    no clear-cut boundary between nontoxic, toxic and lethal doses, which is why
    the two routes are not usefully separated at the level of the exposure - the
    determinant is the concentration reached, not the size of any one dose.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It has a narrow therapeutic index, with no clear-cut distinction between
      nontoxic, toxic, and lethal doses, causing substantial confusion among
      clinicians.
    explanation: >-
      States the narrow index and the absence of a dose boundary, which is the
      claim this node rests on.
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      High fatality rate was reported after acute ingestions exceeding 0.5 mg/kg.
      The lowest reported lethal doses of oral colchicine are 7-26 mg.
    explanation: >-
      Gives the acute-ingestion thresholds reported in the systematic review.
  downstream:
  - target: Colchicine-Tubulin Binding and Microtubule Assembly Failure
    causal_link_type: DIRECT
    description: >-
      The systemic burden is what delivers colchicine to intracellular tubulin.
      Colchicine distributes very widely and binds intracellular elements, so the
      tissue concentration follows the systemic one closely.
    evidence:
    - reference: PMID:36028733
      reference_title: "Progress in the management of acute colchicine poisoning in adults."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Colchicine can spread rapidly and widely to all tissues shortly after oral
        administration, accumulating in bone marrow, kidney, heart, liver,
        intestinal mucosa, and brain
      explanation: >-
        Documents the wide tissue distribution, including to the bone marrow and
        intestinal mucosa this entry models as the first-affected tissues.
- name: Impaired Colchicine Clearance via CYP3A4 and P-Glycoprotein Inhibition
  description: >-
    Colchicine is metabolised by CYP3A4 and effluxed by P-glycoprotein, so a drug
    that inhibits either raises the concentration reached at an unchanged
    prescribed dose. Renal or hepatic impairment does the same thing by a
    different route. This is the mechanism behind the toxicity that appears at
    ordinary doses, and it is the reason a patient can be poisoned without ever
    taking an overdose.
  role: modifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: CYP3A4-mediated colchicine oxidation
    term:
      id: GO:0004497
      label: monooxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colchicine is metabolized to 2- and 3-demethylcolchicine by the CYP 3A4
      isoform of cytochrome P450 in hepatocytes, followed by biliary excretion
    explanation: >-
      Establishes CYP3A4 as the metabolic route whose inhibition raises exposure.
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CYP 3A4 and P-glycoprotein inhibitors, such as clarithromycin,
      erythromycin, ketoconazole, ciclosporin, and natural grapefruit juice can
      increase colchicine concentrations.
    explanation: >-
      Names the interacting inhibitors and states that they raise colchicine
      concentrations.
  - reference: PMID:36688283
    reference_title: "Drugs That Interact With Colchicine Via Inhibition of Cytochrome P450 3A4 and P-Glycoprotein: A Signal Detection Analysis Using a Database of Spontaneously Reported Adverse Events (FAERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strongest ROR signal was for colchicine + atazanavir and
      rhabdomyolysis/myopathy (ROR = 35.4, 95% CI: 12.8-97.6)
    explanation: >-
      Pharmacovigilance disproportionality signal linking a CYP3A4/P-gp inhibitor
      co-exposure to the myopathy this entry models downstream. A FAERS signal is
      a reporting association, not an incidence.
  downstream:
  - target: Colchicine Exposure Exceeding the Therapeutic Window
    causal_link_type: DIRECT
    description: >-
      Reduced clearance raises the concentration reached at an unchanged dose, so
      the interaction produces the exposure node rather than acting beside it.
    evidence:
    - reference: PMID:36688283
      reference_title: "Drugs That Interact With Colchicine Via Inhibition of Cytochrome P450 3A4 and P-Glycoprotein: A Signal Detection Analysis Using a Database of Spontaneously Reported Adverse Events (FAERS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Colchicine has a narrow therapeutic index. Its toxicity can be increased
        due to concomitant exposure to drugs inhibiting its metabolic pathway
      explanation: >-
        States that inhibiting the metabolic pathway increases toxicity, which is
        the direction of this edge.
  notes: >-
    Modelled as a modifier feeding the exposure node rather than as a second
    trigger, because the interaction does not injure anything by itself - it acts
    entirely by raising the concentration the patient reaches.
- name: Colchicine-Tubulin Binding and Microtubule Assembly Failure
  description: >-
    Colchicine binds tubulin dimers in roughly equimolar fashion and prevents them
    polymerising into microtubules. This is the same binding that makes the drug
    therapeutic at low dose, and the entire toxicity is a continuation of it - not
    a separate off-target effect. Microtubules serve both the mitotic spindle and
    intracellular transport, which is why one lesion produces two clinically
    distinct syndromes.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: tubulin binding
    term:
      id: GO:0015631
      label: tubulin binding
  biological_processes:
  - preferred_term: microtubule polymerization
    term:
      id: GO:0046785
      label: microtubule polymerization
    modifier: DECREASED
  evidence:
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colchicine's toxicity is an extension of its mechanism of action - binding
      to tubulin and disrupting the microtubular network.
    explanation: >-
      States both the binding target and that the toxicity is continuous with the
      therapeutic mechanism, which is the framing of this node.
  - reference: PMID:20661070
    reference_title: "Colchicine myopathy and neuromyopathy: two cases with different characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Colchicine, a long established anti-inflammatory agent now used in several
      rheumatologic conditions, acts by inhibiting microtubular polymerization,
      as it binds equimolarly to tubulin molecules.
    explanation: >-
      Gives the stoichiometry and the polymerisation block underlying this node.
  - reference: PMID:34229452
    reference_title: "The Ugly Side of Colchicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary mechanism of action is binding to tubulins blocking the
      production and lengthening of microtubules, which make up the skeleton of
      cells.
    explanation: >-
      Independent statement of the same binding and assembly block.
  downstream:
  - target: Mitotic Arrest in Rapidly Proliferating Tissue
    causal_link_type: DIRECT
    description: >-
      Without assembling microtubules there is no mitotic spindle, so cells
      attempting division arrest. Tissues with the highest proliferative fraction
      therefore declare first.
    evidence:
    - reference: PMID:36028733
      reference_title: "Progress in the management of acute colchicine poisoning in adults."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        colchicine can impair mitosis by inhibiting microtubule devices which are
        necessary for the maintenance of cellular homeostasis and thereby causing
        cell injury
      explanation: >-
        Connects the microtubule block to mitotic impairment and cell injury.
  - target: Cardiac Myocyte Conduction and Contractility Failure
    causal_link_type: DIRECT
    description: >-
      The same microtubule collapse interrupts conduction and contractility in
      cardiac myocytes. This arm depends on neither mitosis nor axonal length, so
      it runs on the fast clock alongside the gut and marrow rather than with the
      neuromyopathy.
    evidence:
    - reference: PMID:20586571
      reference_title: "Colchicine poisoning: the dark side of an ancient drug."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        affected cells experience impaired protein assembly, decreased
        endocytosis and exocytosis, altered cell morphology, decreased cellular
        motility, arrest of mitosis, and interrupted cardiac myocyte conduction
        and contractility
      explanation: >-
        Names interrupted cardiac myocyte conduction and contractility as a direct
        cellular consequence of the microtubule lesion.
  - target: Microtubule-Dependent Intracellular Transport Failure
    causal_link_type: DIRECT
    description: >-
      The same assembly block removes the tracks for microtubule-based transport.
      This arm is independent of cell division, which is why it can affect
      post-mitotic muscle and nerve.
    evidence:
    - reference: PMID:20586571
      reference_title: "Colchicine poisoning: the dark side of an ancient drug."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        affected cells experience impaired protein assembly, decreased
        endocytosis and exocytosis, altered cell morphology, decreased cellular
        motility, arrest of mitosis, and interrupted cardiac myocyte conduction
        and contractility
      explanation: >-
        Lists the non-mitotic cellular consequences alongside mitotic arrest,
        establishing that the transport arm is a separate consequence of the same
        lesion.
- name: Mitotic Arrest in Rapidly Proliferating Tissue
  description: >-
    Cells attempting division without a spindle arrest and die. The tissues with
    the highest proliferative fraction - gut mucosa, bone marrow, hair follicle -
    are therefore the ones that declare first, and in that order clinically.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors"
  biological_processes:
  - preferred_term: mitotic cell cycle
    term:
      id: GO:0000278
      label: mitotic cell cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the organs with active cell proliferation, such as the gastrointestinal
      tract, bone marrow, and hair follicles, are often the most susceptible to
      the toxic effects of colchicine
    explanation: >-
      Names the proliferative tissues that this node predicts will be affected
      first, and states the reason as their proliferation.
  downstream:
  - target: Gastrointestinal Mucosal Injury
    causal_link_type: DIRECT
    description: >-
      The intestinal epithelium turns over faster than any other tissue here, so
      it fails earliest - within the first day, before the marrow.
  - target: Hepatic and Renal Injury
    causal_link_type: DIRECT
    description: >-
      The review attributes the hepatic and renal dysfunction to the same
      inhibition of mitosis, which is why this injury is placed downstream of the
      arrest node rather than treated as a separate toxic mechanism.
    evidence:
    - reference: PMID:36028733
      reference_title: "Progress in the management of acute colchicine poisoning in adults."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        colchicine overdose can lead to multiple organ dysfunction by inhibiting
        cell mitosis progress, particularly in the liver and kidneys
      explanation: >-
        Names the liver and kidneys specifically as organs injured through the
        mitotic mechanism, which is the direction of this edge.
  - target: Bone Marrow Hematopoietic Suppression
    causal_link_type: DIRECT
    description: >-
      Haematopoietic progenitors arrest, and the marrow's output falls. The delay
      before this becomes visible in the blood is the transit time of the
      circulating cells already made, not a delay in the injury itself.
    evidence:
    - reference: PMID:7530779
      reference_title: "Colchicine toxicity--clinical features and treatment. Massive overdose case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She developed multiple organ failure and bone marrow suppression after
        the suicidal ingestion of 50 (1 mg) colchicine tablets.
      explanation: >-
        Reports marrow suppression following a quantified colchicine ingestion.
  notes: >-
    Conformance is asserted on the shared step of a cytotoxic insult acting on
    dividing haematopoietic progenitors. The module's trigger is written for
    chemotherapy and radiation; colchicine reaches the same node by spindle
    poisoning rather than by DNA damage, which is a mechanistically different
    insult with the same target population of cells.
- name: Gastrointestinal Mucosal Injury
  description: >-
    Injury to the rapidly renewing intestinal epithelium, producing the vomiting,
    abdominal pain and profuse diarrhoea that open the illness. Clinically this is
    the phase that looks like gastroenteritis, and it is where the poisoning is
    most often missed.
  role: intermediate
  biological_scale: TISSUE
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute colchicine poisoning can lead to original gastrointestinal disorders,
      shock, progressive multiple organ failure, and myelosuppression.
    explanation: >-
      Places the gastrointestinal disturbance first in the sequence this node
      occupies.
  downstream:
  - target: Neutropenic Sepsis and Progressive Multi-Organ Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fluid and electrolyte loss from the mucosal injury produces hypovolaemia and
      shock, which is one of the components of the terminal multi-organ picture.
      The intermediates are volume depletion and hypoperfusion.
    evidence:
    - reference: PMID:36028733
      reference_title: "Progress in the management of acute colchicine poisoning in adults."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Acute colchicine poisoning can lead to original gastrointestinal
        disorders, shock, progressive multiple organ failure, and myelosuppression.
      explanation: >-
        Places gastrointestinal disturbance, shock and multi-organ failure in the
        sequence this edge asserts. The source lists them in order; it does not
        separately demonstrate that the gastrointestinal fluid loss is what causes
        the shock.
- name: Bone Marrow Hematopoietic Suppression
  description: >-
    Failure of marrow output across all three lineages once dividing progenitors
    are arrested. This is the step that makes colchicine poisoning lethal rather
    than merely severe, and it is why the second phase of the illness is the
    dangerous one even when the patient looks better than they did on day one.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "myelosuppression#Bone Marrow Hematopoietic Suppression"
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute colchicine poisoning can lead to original gastrointestinal disorders,
      shock, progressive multiple organ failure, and myelosuppression.
    explanation: >-
      Names myelosuppression as a consequence of acute colchicine poisoning.
  downstream:
  - target: Multilineage Peripheral Cytopenias
    causal_link_type: DIRECT
    description: >-
      Marrow failure shows in the blood as the existing circulating cells are
      consumed and not replaced, so the cytopenia lags the marrow injury by
      roughly the lifespan of each lineage.
    evidence:
    - reference: PMID:1384817
      reference_title: "Use of granulocyte colony-stimulating factor in the treatment of pancytopenia secondary to colchicine overdose."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A 19-year-old man developed pancytopenia four days after ingestion of
        approximately 50-60 0.6-mg colchicine tablets in a suicide attempt.
      explanation: >-
        Documents pancytopenia and its several-day delay after a quantified
        ingestion, which is the lag this edge describes.
- name: Multilineage Peripheral Cytopenias
  description: >-
    Pancytopenia, with neutropenia the component that matters. Anaemia and
    thrombocytopenia follow on their own slower timescales, and the coagulopathy
    seen in severe cases is not purely a platelet problem - disseminated
    intravascular coagulation is reported alongside it.
  role: intermediate
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Multilineage Peripheral Cytopenias"
  evidence:
  - reference: PMID:34229452
    reference_title: "The Ugly Side of Colchicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He developed progressive multiple organ failure with shock, acute kidney
      failure, troponemia, pancytopenia, absolute neutropenia, disseminated
      intravascular coagulation, acute liver failure, rhabdomyolysis, and lactic
      acidosis.
    explanation: >-
      Documents pancytopenia with absolute neutropenia, and the disseminated
      intravascular coagulation this node's description separates from
      thrombocytopenia.
  downstream:
  - target: Neutropenic Sepsis and Progressive Multi-Organ Failure
    causal_link_type: DIRECT
    description: >-
      Loss of neutrophils removes the defence against infection in a patient
      whose gut mucosal barrier is already injured, so the two arms of the
      poisoning compound each other. Positive blood cultures were recorded in 5 of
      20 patients in the cited series; the route of entry was not established
      there, so no claim of bacterial translocation is made.
    evidence:
    - reference: PMID:20586571
      reference_title: "Colchicine poisoning: the dark side of an ancient drug."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        24 h to 7 days after ingestion - multi-organ dysfunction. Death results
        from rapidly progressive multi-organ failure and sepsis.
      explanation: >-
        States that death follows multi-organ failure and sepsis in the phase
        this edge covers.
- name: Neutropenic Sepsis and Progressive Multi-Organ Failure
  description: >-
    The terminal phase: sepsis in a patient with no neutrophils, on a background
    of shock, acute kidney injury, hepatic failure, rhabdomyolysis and lactic
    acidosis. Reported case-fatality in acute poisoning runs to a quarter of
    patients.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Cytopenia-Related Clinical Complications"
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the fatality rate of acute colchicine poisoning may range from 14.3 to
      25.6%
    explanation: >-
      Gives the reported case-fatality range this node states.
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The culmination of these mechanisms leads to multi-organ dysfunction and
      failure.
    explanation: >-
      States multi-organ failure as the endpoint of the mechanisms above.
- name: Microtubule-Dependent Intracellular Transport Failure
  description: >-
    Loss of the microtubule tracks on which intracellular cargo moves. In muscle
    and in long peripheral axons this matters more than mitosis does, because
    those cells are post-mitotic and depend on transport over distances no other
    mechanism can cover. This arm is slower than the marrow arm and is what
    dominates the chronic-accumulation route.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Axonal Transport Impairment and Mitochondrial Dysfunction"
  biological_processes:
  - preferred_term: microtubule-based transport
    term:
      id: GO:0099111
      label: microtubule-based transport
    modifier: DECREASED
  evidence:
  - reference: PMID:20661070
    reference_title: "Colchicine myopathy and neuromyopathy: two cases with different characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytoskeletal microtubules are crucial in processes of cell viability, such
      as mitosis and intracellular vesicle motility.
    explanation: >-
      Names intracellular vesicle motility alongside mitosis as a microtubule
      function, which is the division this node depends on. The statement is
      about microtubule function generally rather than about axons specifically.
  downstream:
  - target: Colchicine Neuromyopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Transport failure in myocytes and in peripheral axons produces the vacuolar
      myopathy and the accompanying axonal neuropathy. The intermediates -
      lysosomal accumulation in the vacuolar myopathy, distal axonal degeneration
      in the neuropathy - are described in the clinical literature, so the link is
      not direct.
    evidence:
    - reference: PMID:19078054
      reference_title: "Colchicine neuromyopathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Definitive diagnosis usually requires histologic examination where a
        characteristic vacuolar myopathy is typically present.
      explanation: >-
        Establishes the vacuolar histology that this edge names as the muscle
        endpoint.
  notes: >-
    Conformance to the module's axonal-transport node is asserted on the transport
    arm only. The module node also carries mitochondrial dysfunction; this entry
    makes no mitochondrial claim for colchicine, because none of the cited human
    sources reports one. Note also the direction of the evidence here: the cited
    statements are about microtubule function in general, and the specifically
    axonal reading is inference from the clinical neuropathy, not a direct
    measurement of axonal transport in a poisoned patient.
- name: Colchicine Neuromyopathy
  description: >-
    Proximal myopathy with elevated creatine kinase, accompanied in about half of
    reported cases by a peripheral neuropathy. It is characteristically insidious,
    arises at ordinary therapeutic doses rather than in overdose, and resolves on
    stopping the drug - which is what separates it from the acute poisoning
    syndrome and makes recognising it worthwhile.
  role: outcome
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  evidence:
  - reference: PMID:36512928
    reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 143 cases of neuromyopathy from 99 articles were identified as
      having a "definite" or "probable" association with colchicine usage
    explanation: >-
      Establishes the entity and its size in the published literature by
      systematic review.
  - reference: PMID:36512928
    reference_title: "Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of these cases presented with features of both neuropathy and myopathy
    explanation: >-
      Supports the combined neuropathy-and-myopathy presentation this node
      describes. It establishes co-occurrence only; it does not characterise the
      fibre pathology as axonal, and the node notes record that limit.
  - reference: PMID:19078054
    reference_title: "Colchicine neuromyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colchicine myopathy can complicate standard treatment of gout, especially
      in those patients with underlying renal insufficiency.
    explanation: >-
      States that the myopathy arises during standard treatment and is
      potentiated by renal impairment, which is the chronic-accumulation route.
  notes: >-
    Conformance is asserted at the level of a toxic peripheral neuromyopathy
    reaching the module's degeneration node. The module node names axonal
    degeneration and demyelination; the sources cited here establish a
    colchicine-associated neuropathy co-occurring with myopathy but do not
    themselves classify the fibre pathology, and the predominant finding in the
    systematic review is myopathic rather than neuropathic. The conformance should
    be read as partial on that basis.
- name: Hepatic and Renal Injury
  description: >-
    Injury to the two organs that clear colchicine. This node matters less for the
    organ failure it names than for what it does to the rest of the pathograph:
    hepatic elimination carries most of the drug's clearance, so damaging the liver
    slows removal of the poison doing the damage. The loop is why late presentation
    and pre-existing hepatic or renal impairment carry a worse prognosis.
  role: intermediate
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:36028733
    reference_title: "Progress in the management of acute colchicine poisoning in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colchicine and its metabolites are mainly eliminated through the liver. The
      kidneys contribute only 10–20% of the total colchicine clearance
    explanation: >-
      Establishes that clearance is predominantly hepatic, which is what makes
      liver injury a rate-limiting step for elimination rather than only an organ
      failure.
  - reference: PMID:20586571
    reference_title: "Colchicine poisoning: the dark side of an ancient drug."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Delayed presentation, pre-existing renal or liver impairment are associated
      with poor prognosis.
    explanation: >-
      Links pre-existing hepatic and renal impairment to worse outcome, which is
      the prognostic consequence of this node.
  downstream:
  - target: Colchicine Exposure Exceeding the Therapeutic Window
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Injury to the clearing organs slows elimination and so raises the systemic
      burden, closing a positive feedback loop back onto the head of the
      pathograph. The intermediate is reduced hepatic metabolism and biliary
      excretion.
    evidence:
    - reference: PMID:34229452
      reference_title: "The Ugly Side of Colchicine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With our patient having both liver and kidneys impairment, this could
        have led to his progression of MOF
      explanation: >-
        The authors propose that combined hepatic and renal impairment drove
        progression in their case. Note the hedge in the source - "could have led
        to" - so this is an author's mechanistic proposal about one patient, not a
        measured demonstration of impaired clearance.
- name: Cardiac Myocyte Conduction and Contractility Failure
  description: >-
    Interruption of conduction and contractility in cardiac muscle, giving
    arrhythmia and depressed contractility. This is the organ dysfunction most
    frequently recorded in the published adult case series, and it is not a

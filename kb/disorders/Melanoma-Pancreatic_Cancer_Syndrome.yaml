animal_models:
- name: Ink4a-deficient mice with melanocyte-specific activated H-ras
  species: Mouse
  genotype: Melanocyte-specific H-rasG12V transgene on an ink4a-null or ink4a-heterozygous background
  publication: PMID:9353252
  description: >-
    Melanocyte-specific expression of activated H-ras on an Ink4a-deficient background
    produces spontaneous cutaneous melanoma with short latency and high penetrance, with loss
    of the wild-type Ink4a allele in tumors from heterozygous mice. The model addresses the
    melanoma arm only.
  evidence:
  - reference: PMID:9353252
    reference_title: Cooperative effects of INK4a and ras in melanoma susceptibility in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice with melanocyte-specific expression of activated H-rasG12V on an ink4a-deficient background develop spontaneous cutaneous melanomas after a short latency and with high penetrance"
    explanation: Ink4a deficiency plus Ras activation produces melanoma in vivo.
  modeled_mechanisms:
  - target: Somatic Second-Hit Inactivation of CDKN2A
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Requires a melanocyte-targeted activated H-ras transgene; mouse and human skin differ,
      and the model does not address the pancreatic arm.
    evidence:
    - reference: PMID:9353252
      reference_title: Cooperative effects of INK4a and ras in melanoma susceptibility in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent loss of the wild-type ink4a allele was observed in tumors arising in ink4a heterozygous transgenic mice."
      explanation: The model reproduces second-allele loss on a heterozygous background.
differential_diagnoses:
- name: Melanoma and neural system tumor syndrome
  disease_term:
    preferred_term: melanoma and neural system tumor syndrome
    term:
      id: MONDO:0007967
      label: melanoma and neural system tumor syndrome
  description: >-
    The CDKN2A presentation with melanoma and nervous-system tumors (astrocytoma, glioma,
    nerve-sheath tumors), curated as its own entry. GeneReviews includes gliomas and
    astrocytomas in CDKN2A cancer predisposition; nervous-system tumor surveillance applies
    to carriers of variants affecting p14ARF with a family history of such tumors.
  distinguishing_features:
  - Co-segregating astrocytoma or other nervous-system tumors favors melanoma and neural system tumor syndrome.
  - A variant affecting only p14ARF has not been associated with pancreatic cancer.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "full-body and brain MRI in those with a CDKN2A pathogenic variant affecting the p14ARF isoform in the setting of a family history of nervous system tumors"
    explanation: The nervous-system tumor arm and its surveillance are specific to p14ARF-affecting variants.
- name: CDK4-related hereditary melanoma (CMM3)
  disease_term:
    preferred_term: melanoma, cutaneous malignant, susceptibility to, 3
    term:
      id: MONDO:0012183
      label: melanoma, cutaneous malignant, susceptibility to, 3
  description: >-
    Germline activating CDK4 variants at Arg24 render CDK4 insensitive to INK4 inhibitors and
    cause hereditary melanoma, a genocopy of the p16INK4A arm. Whether CDK4 carriers share
    the pancreatic cancer risk was not established by the sources reviewed here.
  distinguishing_features:
  - A germline CDK4 exon 2 (Arg24) variant with no CDKN2A variant indicates CDK4-related melanoma.
  evidence:
  - reference: PMID:16462187
    reference_title: "Melanoma genetics: a review of genetic factors and clinical phenotypes in familial melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The familial melanoma syndromes are associated with germline mutations in three highly penetrant gene products: p16, alternate reading frame, and cyclin-dependent kinase 4."
    explanation: CDK4 is the third high-penetrance familial melanoma gene.
  - reference: PMID:17505264
    reference_title: "CDKN2A and CDK4 variants in Latvian melanoma patients: analysis of a clinic-based population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Germline mutations of the CDKN2A and CDK4 genes explain a significant proportion of familial melanoma."
    explanation: CDK4 as an alternative explanation of familial melanoma.
- name: Familial melanoma without an identified CDKN2A variant
  disease_term:
    preferred_term: familial melanoma
    term:
      id: MONDO:0018961
      label: familial melanoma
  description: >-
    Most familial melanoma clustering occurs without an identifiable CDKN2A variant, so a
    multiple-case melanoma family is not by itself evidence of this syndrome.
  distinguishing_features:
  - Absence of a germline CDKN2A pathogenic variant on testing.
  evidence:
  - reference: PMID:16234564
    reference_title: Lifetime risk of melanoma in CDKN2A mutation carriers in a population-based sample.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The preponderance of familial clustering of melanoma occurs in families without identifiable mutations in CDKN2A."
    explanation: Familial melanoma is usually not CDKN2A-related.
discussions:
- discussion_id: mpcs_arf_contribution_to_pancreatic_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of p14ARF contribute to pancreatic cancer risk in germline CDKN2A carriers,
    or is the pancreatic arm of the syndrome attributable to p16INK4A loss alone?
  attaches_to:
  - pathophysiology#Loss of p14ARF Function
  - phenotypes#Pancreatic Ductal Adenocarcinoma
  rationale: >-
    Most pathogenic exon 2 variants affect both reading frames, so in most carrier families
    the two arms cannot be separated. The one series cited here that compares them found no
    pancreatic cancer among nine families carrying a p14ARF-only variant, against PDAC in more
    than half of families with p16INK4A-affecting variants; nine families and twenty carriers
    is a small denominator, and the question decides which carriers are offered pancreatic
    surveillance.
  evidence:
  - reference: PMID:32482799
    reference_title: Genotype-phenotype correlations for pancreatic cancer risk in Dutch melanoma families with pathogenic CDKN2A variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDAC developed in 95 of 163 families (58%, including 373 of 629 proven carriers) harbouring a variant with an effect on the p16INK4a protein, whereas PDAC did not occur in the 9 families (20 proven carriers) with a variant affecting only p14ARF."
    explanation: The comparison on which the open question rests.
- discussion_id: mpcs_cdkn2a_spectrum_lump_split
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should CDKN2A cancer predisposition be curated as one entity, as GeneReviews treats it,
    or as the separate MONDO presentations (melanoma-pancreatic cancer, melanoma-neural system
    tumor, familial melanoma) this knowledge base currently follows?
  attaches_to:
  - disease#Melanoma-Pancreatic Cancer Syndrome
  rationale: >-
    The presentations share one gene, one mechanism and one surveillance protocol, and the
    tumor mix varies within families; the split rests mainly on which arm of the locus a
    variant damages. ClinGen files its Definitive CDKN2A assertion against this MONDO term
    while summarising evidence from the whole CDKN2A melanoma spectrum.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A cancer predisposition is characterized by an increased risk of developing multiple cutaneous melanomas, pancreatic cancer, and other tumors including gliomas and astrocytomas."
    explanation: GeneReviews treats the melanoma, pancreatic and nervous-system tumor risks as one entity.

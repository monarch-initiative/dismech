    snippet: "Certain variants in a low-penetrance gene, MC1R, the melanocortin 1 receptor gene, increase melanoma risk to a lesser extent and act as a genetic modifier when cosegregating with a deleterious p16 gene."
    explanation: MC1R as a modifier of melanoma risk in CDKN2A carriers.
diagnosis:
- name: Molecular confirmation of germline CDKN2A variant
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The diagnosis rests on a heterozygous germline CDKN2A pathogenic variant in a person with
    a suggestive personal or family history of melanoma and pancreatic cancer. CDKN2A
    variants are rare in unselected melanoma patients, so family history drives testing.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDKN2A cancer predisposition is established in a proband by identification of a heterozygous germline pathogenic variant in CDKN2A by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:17505264
    reference_title: "CDKN2A and CDK4 variants in Latvian melanoma patients: analysis of a clinic-based population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No disease-related CDKN2A germline mutations were identified in any of the melanoma patients analysed"
    explanation: Germline CDKN2A variants are rare in consecutive unselected melanoma patients.
treatments:
- name: Melanoma Surveillance
  description: >-
    Dermatologic examination for melanoma every six months with monthly self-skin
    examination for carriers. At-risk relatives whose genetic status is unknown, including
    children, should have skin examinations at well-child or health maintenance visits.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Cutaneous Melanoma
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologic examination for melanoma every six months; monthly self-skin examinations"
    explanation: GeneReviews skin surveillance recommendation for carriers.
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At-risk family members whose genetic status is unknown should undergo skin exams at their well child / health maintenance visits."
    explanation: Pediatric surveillance of at-risk relatives of unknown genotype.
- name: Pancreatic Cancer Surveillance
  description: >-
    Annual surveillance alternating MRCP and endoscopic ultrasound from age 40 years, or 10
    years younger than the earliest exocrine pancreatic cancer in the family if earlier.
    The CAPS Consortium recommends surveillance for CDKN2A carriers from age 40 irrespective
    of family history of pancreatic cancer. In the Leiden program (annual MRI with optional
    EUS), most screen-detected PDACs were resectable and surveillance was cost-effective.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Pancreatic Ductal Adenocarcinoma
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "annual alternating magnetic resonance cholangiopancreatography and endoscopic ultrasound starting at age 40 years or 10 years younger than the earliest exocrine pancreatic cancer diagnosis in the family, whichever is earlier"
    explanation: GeneReviews pancreatic surveillance modality and start age.
  - reference: PMID:31672839
    reference_title: "Management of patients with increased risk for familial pancreatic cancer: updated recommendations from the International Cancer of the Pancreas Screening (CAPS) Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surveillance for CDKN2A and STK11 (Peutz-Jegher syndrome) mutation carriers is recommended irrespective of patients’ family history of pancreatic cancer, because of their high lifetime risk."
    explanation: Expert consensus recommends pancreatic surveillance for CDKN2A carriers regardless of family history.
  - reference: PMID:31672839
    reference_title: "Management of patients with increased risk for familial pancreatic cancer: updated recommendations from the International Cancer of the Pancreas Screening (CAPS) Consortium."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "surveillance from age 40 is recommended for CDKN2A mutation carriers"
    explanation: Expert consensus start age for CDKN2A carriers.
  - reference: PMID:36785917
    reference_title: "Cost-effectiveness of pancreas surveillance: The CDKN2A-p16-Leiden cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 347 mutation carriers participated in the surveillance program. PDAC was detected in 31 patients (8.9%) and the tumor could be resected in 22 patients (71.0%). Long-term cure among patients with resected PDAC was estimated at 47.1% (p < 0.001)."
    explanation: Outcome of annual surveillance in p16-Leiden carriers.
- name: Resection of Screen-Detected Pancreatic Cancer
  description: >-
    Surgical resection of surveillance-detected pancreatic ductal adenocarcinoma, the only
    route to cure; otherwise standard tumor-specific treatment applies to melanoma and
    pancreatic cancer.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pancreatic Ductal Adenocarcinoma
  evidence:
  - reference: PMID:36785917
    reference_title: "Cost-effectiveness of pancreas surveillance: The CDKN2A-p16-Leiden cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumor could be resected in most patients with a screen-detected PDAC. These patients had considerably better survival and as a result annual surveillance was found to be cost-effective."
    explanation: Resection of screen-detected PDAC improves survival in carriers.
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard treatment for melanoma, pancreatic cancer, and other cancers."

      label: CDKN2A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous germline loss-of-function variants in CDKN2A cause melanoma-pancreatic
    cancer syndrome; pancreatic cancer risk is associated with variants that affect
    p16INK4A.
  gene_disease_validity:
  - validity_classification: DEFINITIVE

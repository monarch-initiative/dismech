name: Melanoma-Pancreatic Cancer Syndrome
creation_date: "2026-11-05T18:57:38Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: melanoma-pancreatic cancer syndrome
  term:
    id: MONDO:0011713
    label: melanoma-pancreatic cancer syndrome
synonyms:
- pancreatic cancer-melanoma syndrome
- PCMS
description: >-
  Melanoma-pancreatic cancer syndrome is an autosomal dominant hereditary cancer
  predisposition syndrome caused by heterozygous germline loss-of-function variants in
  CDKN2A (9p21.3). Carriers are at increased risk of cutaneous melanoma, often early in
  adult life and as multiple primaries, and of pancreatic ductal adenocarcinoma, usually in
  the sixth decade; some have a high total nevus count with clinically atypical nevi. CDKN2A
  encodes two tumor suppressors from overlapping reading frames: p16INK4A, which inhibits
  the CDK4/6-cyclin D kinases that inactivate RB, and p14ARF, which restrains MDM2 and so
  stabilizes p53. The pancreatic arm of the risk tracks variants that damage p16INK4A; in the
  Dutch national series no pancreatic cancer occurred in families whose variant affected only
  p14ARF. Tumors follow the two-hit model, with loss of p16INK4A expression and, in a
  minority of pancreatic tumors studied, loss of heterozygosity of the wild-type allele,
  together with somatic KRAS activation in the pancreas. Penetrance is incomplete and strongly
  dependent on ascertainment and environment: melanoma penetrance estimated from
  population-based carriers is far lower than from dense melanoma kindreds, and tobacco
  smoking amplifies the risk of pancreatic, respiratory and upper aerodigestive cancers in
  carriers. Management is surveillance-based (dermatologic examination; annual pancreatic
  MRCP/EUS from age 40, or earlier by family history), with avoidance of UV exposure and
  tobacco, and cascade testing of relatives. This entry is the germline predisposition
  syndrome; the somatic tumors it predisposes to are curated separately
  (Cutaneous_Melanoma, Pancreatic_Ductal_Adenocarcinoma).
notes: >-
  Lump/split. GeneReviews (PMID:40674536) treats CDKN2A cancer predisposition as one entity
  spanning multiple cutaneous melanomas, pancreatic cancer, and nervous-system tumors
  (gliomas, astrocytomas). MONDO splits that spectrum: familial atypical multiple mole
  melanoma syndrome (MONDO:0018453) is the parent of this term, melanoma and neural system
  tumor syndrome (MONDO:0007967) is a separate entry in this knowledge base, and familial
  melanoma (MONDO:0018961) is a broader melanoma-only class. This entry follows MONDO and
  curates MONDO:0011713, scoped to the melanoma plus pancreatic cancer presentation of germline
  CDKN2A; the nervous-system tumor arm is left to Melanoma_And_Neural_System_Tumor_Syndrome.
  The split is not clean in the sources: ClinGen's Definitive CDKN2A assertion is filed
  against MONDO:0011713, but its evidence summary describes CDKN2A-related melanoma
  generally, including p14ARF-disrupting variants with nerve-sheath tumors; and MONDO itself
  carries "FAMM-PC syndrome" and "familial atypical multiple mole melanoma-pancreatic
  carcinoma syndrome" as exact synonyms of the parent MONDO:0018453 (Orphanet-sourced, from
  ORPHA:404560) while recording "melanoma-pancreatic cancer syndrome" there only as a broad
  synonym. Whether the CDKN2A spectrum should be one entry (the GeneReviews view) or
  several (the MONDO view) is undecided here. CDK4 (CMM3, MONDO:0012183) is a separate
  hereditary melanoma locus whose activating R24 variants make CDK4 insensitive to p16INK4A;
  it is recorded as a differential, not as a gene of this entry, because MONDO and ClinGen
  name CDKN2A alone for MONDO:0011713, and none of the sources cited here establishes
  pancreatic cancer risk for CDK4 carriers. No prevalence figure specific to this
  presentation was found in the sources reviewed, so no prevalence record is given. The
  GeneReviews chapter is cached as abstract only; its age-specific risk tables and its
  discussion of testing minors were not available to quote, so neither is recorded.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous germline CDKN2A pathogenic variants segregate as an autosomal dominant
    trait; each child of a carrier has a 50% chance of inheriting the variant, and most
    probands inherited it from a parent who may or may not have had cancer.
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A cancer predisposition is inherited in an autosomal dominant manner."
    explanation: GeneReviews statement of the inheritance pattern for CDKN2A-related predisposition.
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A parent with a CDKN2A pathogenic variant may or may not have had a cancer diagnosis."
    explanation: Transmitting parents can be unaffected, reflecting incomplete penetrance.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Incomplete, ascertainment-dependent penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Penetrance is incomplete and depends heavily on how carriers were ascertained. Among
    carriers identified through population-based melanoma probands, melanoma risk was about
    14% by age 50, 24% by 70 and 28% by 80, against 58% (Europe) to 91% (Australia) by 80
    in multiple-case families. In the Dutch p16-Leiden founder population the lifetime risks
    are about 70% for melanoma and 15-20% for pancreatic cancer.
  evidence:
  - reference: PMID:16234564
    reference_title: Lifetime risk of melanoma in CDKN2A mutation carriers in a population-based sample.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of melanoma in CDKN2A mutation carriers was approximately 14% (95% CI = 8% to 22%) by age 50 years, 24% (95% CI = 15% to 34%) by age 70 years, and 28% (95% CI = 18% to 40%) by age 80 years."
    explanation: Population-based kin-cohort estimate of age-dependent melanoma penetrance.
  - reference: PMID:16234564
    reference_title: Lifetime risk of melanoma in CDKN2A mutation carriers in a population-based sample.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Previous studies of multiple-case families have indicated that the lifetime risk (i.e., penetrance) of melanoma in CDKN2A mutation carriers is very high, ranging from 58% in Europe to 91% in Australia by age 80 years."
    explanation: The higher family-based estimates, which the population-based study contrasts with its own.
  - reference: PMID:31203567
    reference_title: Assessing a single SNP located at TERT/CLPTM1L multi-cancer risk region as a genetic modifier for risk of pancreatic cancer and melanoma in Dutch CDKN2A mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Carriers of pathogenic variants in CDKN2A have a 70% life-time risk of developing melanoma and 15-20% risk of developing pancreatic cancer (PC)."
    explanation: Lifetime melanoma and pancreatic cancer risks as stated for Dutch p16-Leiden carriers.
pathophysiology:
- name: Germline CDKN2A Locus Alteration
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    The constitutional first hit: a heterozygous germline loss-of-function variant in
    CDKN2A, carried by every somatic cell. Founder alleles include the Dutch p16-Leiden
    19-bp exon 2 deletion (c.225_243del) and the Swedish p.Arg112dup; in-frame deletions
    and missense variants that impair p16INK4A folding and CDK4 binding are also reported.
    Exon 2 variants can also alter the overlapping p14ARF reading frame.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline CDKN2A pathogenic variants; the pancreatic cancer risk is
      associated with variants that affect the p16INK4A protein.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  downstream:
  - target: Somatic Second-Hit Inactivation of CDKN2A
    causal_link_type: DIRECT
  - target: Atypical Melanocytic Nevi
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Carrier status is associated with clinically atypical nevi, though carriers often do
      not meet atypical mole syndrome criteria; the intervening mechanism is not established.
    evidence:
    - reference: PMID:20526219
      reference_title: Swedish CDKN2A mutation carriers do not present the atypical mole syndrome phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A positive mutation status (CDKN2A) was correlated to one or more CAN (P=0.007) but neither to blue eyes, red hair colour, heavy freckling nor high number of nevi."
      explanation: Germline CDKN2A carrier status correlates with clinically atypical nevi (CAN).
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDKN2A cancer predisposition is established in a proband by identification of a heterozygous germline pathogenic variant in CDKN2A by molecular genetic testing."
    explanation: The heterozygous germline CDKN2A variant is the defining lesion.
  - reference: PMID:10956390
    reference_title: Risk of developing pancreatic cancer in families with familial atypical multiple mole melanoma associated with a specific 19 deletion of p16 (p16-Leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A p16-Leiden mutation was identified in 19 families. These families included 86 patients with melanoma. The second most frequent cancer was pancreatic cancer, which was observed in 15 patients from 7 families."
    explanation: A single germline CDKN2A founder allele segregating with both melanoma and pancreatic cancer.
  - reference: PMID:32941720
    reference_title: A novel CDKN2A in-frame deletion associated with pancreatic cancer-melanoma syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By segregation analysis, the c.52_57delACGGCC was proven to segregate in kindred with cutaneous melanoma (CM), in kindred with CM and pancreatic cancer, and in a single case presenting only with pancreatic cancer."
    explanation: Segregation of a germline CDKN2A in-frame deletion with melanoma and pancreatic cancer in a PCMS family.
- name: Somatic Second-Hit Inactivation of CDKN2A
  biological_scale: MOLECULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    In the tumor, p16INK4A function is lost from the remaining allele. In pancreatic
    carcinomas from p16-Leiden carriers, p16 immunostaining was absent in every tumor
    tested, but loss of heterozygosity of the wild-type allele was demonstrated in only 2 of
    7, so the mechanism of second-allele inactivation is not established for most
    pancreatic tumors (promoter methylation and intragenic mutation were not reported in the
    cited study). In melanoma, consistent loss of the wild-type allele is seen in the
    Ink4a-heterozygous mouse model, and somatic inactivation of the wild-type allele has
    been documented in a human melanoma from a germline ARF-variant kindred.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic loss of the wild-type CDKN2A allele (loss of heterozygosity, deletion or
      intragenic mutation) on the germline background.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  downstream:
  - target: Loss of p16INK4A Function
    causal_link_type: DIRECT
  - target: Loss of p14ARF Function
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:14506146
    reference_title: Pancreatic carcinoma in carriers of a specific 19 base pair deletion of CDKN2A/p16 (p16-leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of heterozygosity of the wild-type allele was present in 2 of 7 tumors analyzed. Immunostaining for p16 was negative in 10 of 10."
    explanation: Second-allele loss in pancreatic carcinomas of germline carriers, with uniform loss of p16 protein.
  - reference: PMID:12019208
    reference_title: Germline mutation of ARF in a melanoma kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the melanoma from one individual revealed a 62 bp deletion in exon 3 of the wildtype allele and loss of the mutant allele; these somatic changes would affect both CDKN2A and ARF."
    explanation: Somatic inactivation of the wild-type allele in a melanoma from a germline-variant kindred.
  - reference: PMID:9353252
    reference_title: Cooperative effects of INK4a and ras in melanoma susceptibility in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent loss of the wild-type ink4a allele was observed in tumors arising in ink4a heterozygous transgenic mice."
    explanation: Mouse evidence that melanomas on an Ink4a-heterozygous background lose the wild-type allele.
- name: Somatic KRAS Activation in Pancreatic Precursor Lesions
  biological_scale: MOLECULAR
  description: >-
    In pancreatic carcinomas from p16-Leiden carriers, KRAS codon 12 mutations were present
    in nearly all tumors and already in precursor lesions, in one case before loss of p16
    expression; TP53 mutation and SMAD4 loss were present in a subset. These are the
    cooperating somatic lesions through which a carrier's pancreatic ductal epithelium
    progresses to conventional ductal adenocarcinoma.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
    description: Somatic activating KRAS codon 12 mutation in pancreatic precursor lesions and carcinoma.
  genes:
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  cell_types:
  - preferred_term: pancreatic ductal cell
    term:
      id: CL:0002079
      label: pancreatic ductal cell
  downstream:
  - target: Pancreatic Ductal Adenocarcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:14506146
    reference_title: Pancreatic carcinoma in carriers of a specific 19 base pair deletion of CDKN2A/p16 (p16-leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "K-ras codon 12 mutations were present in 9 of 10 and in three precursor lesions even before abrogation of p16 protein expression was seen (one of three)."
    explanation: Somatic KRAS activation in carrier pancreatic tumors and their precursor lesions.
  - reference: PMID:14506146
    reference_title: Pancreatic carcinoma in carriers of a specific 19 base pair deletion of CDKN2A/p16 (p16-leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p16-Leiden deletion was associated with progression toward conventional ductal adenocarcinomas in all cases but one."
    explanation: The tumors arising on this background are conventional ductal adenocarcinomas.
- name: Loss of p16INK4A Function
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    p16INK4A binds CDK4 and CDK6 and blocks their activation by cyclin D. Pathogenic
    variants destabilize the protein or abolish its binding partners. Loss of p16INK4A is
    the arm of the locus that carries the pancreatic cancer risk.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  molecular_functions:
  - preferred_term: cyclin-dependent protein kinase inhibitor activity
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Unrestrained CDK4/6-Cyclin D Kinase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The p16INK4a tumor suppressor protein functions as an inhibitor of CDK4 and CDK6, the D-type cyclin-dependent kinases that initiate the phosphorylation of the retinoblastoma tumor suppressor protein, RB."
    explanation: States the p16INK4A to CDK4/6 inhibitory function whose loss this node describes.
  - reference: PMID:32482799
    reference_title: Genotype-phenotype correlations for pancreatic cancer risk in Dutch melanoma families with pathogenic CDKN2A variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDAC developed in 95 of 163 families (58%, including 373 of 629 proven carriers) harbouring a variant with an effect on the p16INK4a protein, whereas PDAC did not occur in the 9 families (20 proven carriers) with a variant affecting only p14ARF."
    explanation: Pancreatic cancer in carrier families tracks loss of p16INK4A rather than p14ARF.
  - reference: PMID:32941720
    reference_title: A novel CDKN2A in-frame deletion associated with pancreatic cancer-melanoma syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A computational approach for studying the effect of mutational changes over p16 protein structure showed that both the deletion and the duplication of the c.52_57 nucleotides result in protein misfolding and loss of interactors' binding."
    explanation: In silico evidence that a PCMS-associated variant misfolds p16 and abolishes its binding to partners.
  - reference: PMID:12009890
    reference_title: Structural consequences of tumor-derived mutations in p16INK4a probed by limited proteolysis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results show that the N-terminal half of p16 is significantly more sensitive to proteolysis in both tumor-derived mutant proteins than in the wild type, suggesting that this region is particularly unstable."
    explanation: Biochemical evidence that tumor-derived p16 mutations destabilize the CDK-binding half of the protein.
- name: Unrestrained CDK4/6-Cyclin D Kinase Activity
  biological_scale: MOLECULAR
  description: >-
    Without p16INK4A, CDK4/6-cyclin D complexes are constitutively active and phosphorylate
    the retinoblastoma protein. The same state is reached by INK4-insensitive CDK4 variants
    in the CDK4 hereditary melanoma genocopy.
  molecular_functions:
  - preferred_term: cyclin-dependent protein kinase activity
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
    modifier: INCREASED
  downstream:
  - target: RB Inactivation and Unchecked G1/S Transition
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The p16INK4a tumor suppressor protein functions as an inhibitor of CDK4 and CDK6, the D-type cyclin-dependent kinases that initiate the phosphorylation of the retinoblastoma tumor suppressor protein, RB."
    explanation: Describes the CDK4/6 kinase activity that p16 normally restrains; its loss leaves that activity unrestrained.
  - reference: PMID:11726500
    reference_title: Wide spectrum of tumors in knock-in mice carrying a Cdk4 protein insensitive to INK4 inhibitors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "This mutation (replacement of Arg24 by Cys) was first found in patients with hereditary melanoma and renders Cdk4 insensitive to INK4 inhibitors."
    explanation: The CDK4 R24C hereditary-melanoma allele produces the same INK4-insensitive kinase state by the reciprocal route.
- name: RB Inactivation and Unchecked G1/S Transition
  biological_scale: CELLULAR
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    Hyperphosphorylated RB releases E2F, driving the G1-to-S transition independently of
    normal mitogenic control.
  biological_processes:
  - preferred_term: negative regulation of G1/S transition of mitotic cell cycle
    term:
      id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
    modifier: DECREASED
  downstream:
  - target: Escape from Cellular Senescence and Clonal Expansion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15460900
    reference_title: "The p16INK4a-RB pathway: molecular link between cellular senescence and tumor suppression."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Thus, p16INK4a has the capacity to arrest cells in the G1-phase of the cell cycle and its probable physiological role is in the implementation of irreversible growth arrest termed cellular senescence."
    explanation: The G1 arrest p16 normally imposes; loss of that brake is the unchecked G1/S transition this node describes.
- name: Loss of p14ARF Function
  biological_scale: MOLECULAR
  description: >-
    p14ARF, encoded from exon 1beta and an alternative reading frame of exon 2, sequesters
    MDM2. Many exon 2 variants affect both proteins. ARF haploinsufficiency has been
    associated with melanoma predisposition, but in the Dutch series variants affecting only
    p14ARF were not associated with pancreatic cancer, so this arm is not linked to the
    pancreatic phenotype here.
  downstream:
  - target: Enhanced MDM2-Mediated p53 Degradation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15878778
    reference_title: "INK4a/ARF: a multifunctional tumor suppressor locus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The INK4a/ARF locus encodes two physically linked tumor suppressor proteins, p16(INK4a) and ARF, which regulate the RB and p53 pathways, respectively."
    explanation: Identifies ARF as the p53-pathway arm of the locus.
  - reference: PMID:12019208
    reference_title: Germline mutation of ARF in a melanoma kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the data suggest a direct role for ARF haploinsufficiency in melanoma predisposition and co-operation between ARF and CDKN2A in tumour formation"
    explanation: Supports a contribution of ARF loss to melanoma predisposition.
  - reference: PMID:32482799
    reference_title: Genotype-phenotype correlations for pancreatic cancer risk in Dutch melanoma families with pathogenic CDKN2A variants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no clinical evidence that impairment of only the p14ARF protein leads to an increased PDAC risk."
    explanation: Argues against ARF loss alone conferring the pancreatic cancer component of this syndrome.
- name: Enhanced MDM2-Mediated p53 Degradation
  biological_scale: MOLECULAR
  description: >-
    Unopposed MDM2 ubiquitinates p53 and targets it for proteasomal degradation.
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: INCREASED
  downstream:
  - target: Escape from Cellular Senescence and Clonal Expansion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29665672
    reference_title: Regulatory Network of ARF in Cancer Development.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "As a factor that induces senescence, the role of ARF as a tumor suppressor is closely linked to the p53-MDM2 axis, which is a key process that restrains tumor formation."
    explanation: Establishes the ARF-MDM2-p53 axis; loss of ARF releases MDM2 onto p53.
- name: Escape from Cellular Senescence and Clonal Expansion
  biological_scale: CELLULAR
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >-
    With the p16INK4A-RB brake lost, melanocytes held in oncogene-induced senescence in nevi
    can bypass that arrest and expand clonally toward melanoma. Whether the same senescence
    bypass is the operative step in the pancreatic duct is inferred from the shared p16-RB
    mechanism rather than shown in carrier tissue.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: DECREASED
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  downstream:
  - target: Cutaneous Melanoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pancreatic Ductal Adenocarcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27872202
    reference_title: Genome-Wide Overexpression Screen Identifies Genes Able to Bypass p16-Mediated Senescence in Melanoma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Malignant melanomas often arise from nevi, which result from initial oncogene-induced hyperproliferation of melanocytes that are maintained in a CDKN2A/p16-mediated senescent state."
    explanation: States the CDKN2A/p16-mediated senescent barrier in melanocytes whose bypass this node describes.
  - reference: PMID:9353252
    reference_title: Cooperative effects of INK4a and ras in melanoma susceptibility in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results show that loss of ink4a and activation of Ras can cooperate to accelerate the development of melanoma"
    explanation: In vivo evidence that Ink4a loss cooperates with Ras activation to drive melanoma.
phenotypes:
- category: Neoplastic
  name: Cutaneous Melanoma
  description: >-
    Cutaneous malignant melanoma, often multiple primaries and earlier in life than sporadic
    melanoma; median age at diagnosis was 36 years among Swedish p.Arg112dup carriers.
    Lifetime risk is strongly ascertainment-dependent (see inheritance), so no single
    frequency band is given.
  phenotype_term:
    preferred_term: Cutaneous melanoma, often multiple primary
    term:
      id: HP:0012056
      label: Cutaneous melanoma
    onset:
      onset_category: YOUNG_ADULT
  evidence:
  - reference: PMID:40674536
    reference_title: CDKN2A Cancer Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A cancer predisposition is characterized by an increased risk of developing multiple cutaneous melanomas, pancreatic cancer, and other tumors including gliomas and astrocytomas."
    explanation: GeneReviews baseline naming multiple cutaneous melanomas as a cardinal feature.
  - reference: PMID:16462187
    reference_title: "Melanoma genetics: a review of genetic factors and clinical phenotypes in familial melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Familial melanoma patients develop melanomas earlier and are prone to developing multiple primary melanomas."
    explanation: Earlier onset and multiple primaries in familial melanoma.
  - reference: PMID:20526219
    reference_title: Swedish CDKN2A mutation carriers do not present the atypical mole syndrome phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "29 invasive melanomas in 16 patients were recorded, all in the 38 verified CDKN2A mutation carriers. Median age at diagnosis was 36 years."
    explanation: Multiple invasive melanomas per patient and the median age at diagnosis in carriers.
- category: Neoplastic
  name: Pancreatic Ductal Adenocarcinoma
  description: >-
    Pancreatic carcinoma, conventional ductal adenocarcinoma in nearly all studied cases, at
    a mean age of 58 years (range 38-77) in Dutch p16-Leiden families; cumulative risk to age
    75 was 17% in putative p16-Leiden carriers and 19% in c.67G>C carriers. The risk is
    associated with variants affecting p16INK4A.
  phenotype_term:
    preferred_term: Pancreatic ductal adenocarcinoma
    term:
      id: HP:0006725
      label: Pancreatic adenocarcinoma
    onset:
      onset_category: MIDDLE_AGE
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:10956390
    reference_title: Risk of developing pancreatic cancer in families with familial atypical multiple mole melanoma associated with a specific 19 deletion of p16 (p16-Leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at diagnosis of pancreatic cancer was 58 years (range 38-77 years). The estimated cumulative risk of developing pancreatic cancer in putative mutation carriers by age 75 years was 17%."
    explanation: Age at diagnosis and cumulative pancreatic cancer risk in p16-Leiden carriers.
  - reference: PMID:32482799
    reference_title: Genotype-phenotype correlations for pancreatic cancer risk in Dutch melanoma families with pathogenic CDKN2A variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The standardised incidence ratio was 19.1 (95% CI 8.3 to 33.6) and the cumulative PDAC incidence at age 75 years (lifetime risk) was 19% (95% CI 7.5% to 30.1%)."
    explanation: Lifetime PDAC risk for carriers of a second, non-founder p16-affecting variant.
  - reference: PMID:14506146
    reference_title: Pancreatic carcinoma in carriers of a specific 19 base pair deletion of CDKN2A/p16 (p16-leiden).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology was considered as conventional ductal adenocarcinoma in 11 of 12 and neuroendocrine carcinoma (1 of 12)."
    explanation: The pancreatic tumors in carriers are conventional ductal adenocarcinomas.

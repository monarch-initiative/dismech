environmental:
- name: Tobacco smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  description: >-
    Tobacco smoking amplifies the risk of pancreatic, respiratory and upper digestive cancers
    in carriers, a gene-environment interaction that is the basis for counselling carriers to
    abstain from smoking.
  influences_mechanisms:
  - target: Pancreatic Ductal Adenocarcinoma
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Ever-smoking carriers had markedly higher odds of pancreatic, respiratory or upper digestive cancers than never-smoking carriers.
    evidence:
    - reference: PMID:24935963
      reference_title: High risk of tobacco-related cancers in CDKN2A mutation-positive melanoma families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In ever-smoking carriers compared with never-smoking carriers, the odds ratio (OR) of cancers in pancreas, respiratory or upper digestive tissues was 9.3 (95% CI 1.9 to 44.7)."
      explanation: Smoking increases tobacco-related cancer risk within carriers (combined end point including pancreas).
  - target: Lung Neoplasm
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Respiratory cancers in carriers were concentrated in ever-smokers.
    evidence:
    - reference: PMID:24935963
      reference_title: High risk of tobacco-related cancers in CDKN2A mutation-positive melanoma families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In ever-smoking carriers compared with never-smoking carriers, the odds ratio (OR) of cancers in pancreas, respiratory or upper digestive tissues was 9.3 (95% CI 1.9 to 44.7)."
      explanation: Smoking increases respiratory cancer risk within carriers (combined end point).
  - target: Head and Neck Squamous Cell Carcinoma
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The tobacco-related cancers in carriers, including head and neck carcinoma, occurred mainly in ever-smokers.
    evidence:
    - reference: PMID:24935963
      reference_title: High risk of tobacco-related cancers in CDKN2A mutation-positive melanoma families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These cancers were mainly seen in ever-smoking carriers. Germline CDKN2A mutations may confer an increased sensitivity to carcinogens in tobacco smoke."
      explanation: The tobacco-related cancers occurred mainly in smoking carriers.
  evidence:
  - reference: PMID:24935963
    reference_title: High risk of tobacco-related cancers in CDKN2A mutation-positive melanoma families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A mutation carriers should be counselled to abstain from smoking."
    explanation: Clinical consequence of the tobacco gene-environment interaction.
- name: Ultraviolet radiation exposure
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  description: >-
    Ultraviolet exposure modifies melanoma penetrance across geographic latitude, although
    studies conflict on which patterns of sun exposure, including childhood and adolescent
    exposure, raise risk in familial melanoma.
  influences_mechanisms:
  - target: Cutaneous Melanoma
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: UV exposure raises melanoma penetrance on the CDKN2A carrier background.
    evidence:
    - reference: PMID:16462187
      reference_title: "Melanoma genetics: a review of genetic factors and clinical phenotypes in familial melanoma."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The penetrance of these melanoma-predisposing genes is largely influenced by ultraviolet exposure across geographic latitude."
      explanation: Review synthesis of UV-dependent penetrance.
  evidence:
  - reference: PMID:16462187
    reference_title: "Melanoma genetics: a review of genetic factors and clinical phenotypes in familial melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Yet cumulative studies are conflicting on whether ultraviolet radiation, including sunburns, early childhood and adolescent sun exposure, and chronic exposure, increases melanoma risk in familial melanoma."
    explanation: Records that the specific exposure pattern responsible, including childhood exposure, is unsettled.
genetic:
- name: CDKN2A
  gene_term:
    preferred_term: CDKN2A
    term:

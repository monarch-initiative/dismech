    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Across multiple studies, germline mutations in the INK4a antioncogene encoding p16 protein were found on average in approximately 40% of the FAMMM syndrome."

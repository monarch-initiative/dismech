- name: Disrupted Neuronal Maturation and Dendritic Arborization
  biological_scale: CELLULAR
  description: >
    Downstream of the chromatin lesion the affected cell type is the neuron, and
    the defect is one of maturation rather than survival. In the A140V knock-in
    mouse, cortical and hippocampal neurons are packed more densely and their
    dendritic trees are significantly less complex than wild type. Cultured
    hippocampal and cerebellar granule neurons from the same model have smaller
    somata, and this size deficit is cell-autonomous: in heterozygous females
    carrying a wild-type allele marked with eGFP, only the neurons expressing the
    mutant allele are small. The size phenotype tracks with down-regulation of
    mTOR signalling and is rescued in vitro by IGF-1.

    Note that all of the cellular evidence at this node is from the mouse
    knock-in or from cultures derived from it. No human neuropathology or
    patient-derived neuronal model of p.Ala140Val has been published, and the
    mouse is described by its makers as a Rett syndrome / XLMR model rather than a
    PPM-X model - see the HUMAN_MODEL_MISMATCH discussion.

      absent from the other A140V pedigrees, so 50% would overstate it at the
      entity level.
- name: Cognitive Impairment In Heterozygous Females
  category: Neurologic
  description: >
    Heterozygous females are usually normal or mildly affected, with mild cognitive
    impairment and speech difficulties. This is the diagnostically important
    inversion relative to Rett syndrome, where MECP2 variants produce a severe
    female phenotype, and it is the reason A140V pedigrees present as X-linked
    semidominant intellectual disability rather than as Rett families.

    "Mildly affected" should not be read as "cognitively affected only". The
    female range is wider than the modal description: two of the six symptomatic
    relatives in the Siena pedigree were women, and they shared the pyramidal
    signs and distal leg atrophy of their affected male relatives, while a
    separately reported heterozygous female developed the full neuropsychiatric
    picture with adolescent regression, parkinsonism and bipolar symptoms. What is
    consistently milder in females is severity, not the range of systems involved.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
    severity: MILD
  evidence:
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurologic features of six symptomatic relatives (two women and four men) carrying the mutation were compiled."
    explanation: >
      Marked PARTIAL because it qualifies the phenotype rather than simply
      supporting it: the Siena denominators used throughout this entry are four
      men plus two women, and the two heterozygous women were symptomatic
      neurologically, not merely cognitively.
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Females present with mild cognitive impairment and speech difficulties."
    explanation: Direct description of the carrier-female phenotype.
  - reference: PMID:11007980
    reference_title: MECP2 mutation in male patients with non-specific X-linked mental
      retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here on a novel mutation (A140V) in the MECP2 gene detected in one female with mild mental retardation."
    explanation: The index observation of the allele, made in a mildly affected
      heterozygous female.
  - reference: PMID:17296936
    reference_title: Interaction between chromatin proteins MECP2 and ATRX is disrupted
      by mutations that cause inherited mental retardation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The A140V phenotype is evidently less severe than that of mutations causing RTT, because heterozygous females are either normal or occasionally suffer mild mental retardation."
    explanation: States the attenuated-female pattern explicitly and contrasts it
      with Rett syndrome.
- name: Developmental Regression
  category: Neurologic
  description: >
    Late-onset cognitive regression, reported in the first described affected
    heterozygous female, who regressed in adolescence alongside emerging pyramidal
    signs, parkinsonism and bipolar symptoms. A single case, so no frequency is
    asserted, but it is curated because it is the clearest human evidence that the
    disorder has a progressive as well as a developmental component.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:24328834
    reference_title: Adolescent onset cognitive regression and neuropsychiatric symptoms
      associated with the A140V MECP2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the first female with the A140V MECP2 mutation presenting with late onset cognitive regression, pyramidal symptoms, parkinsonism, and bipolar symptoms."
    explanation: Sole primary source for the regression phenotype.
- name: Abnormal Facial Shape
  category: Craniofacial
  description: >
    Mild, non-specific dysmorphism. This entry is curated chiefly for its negative
    content: the founding paper states explicitly that there are no characteristic
    dysmorphic facial features, and the Siena family had only mild dysmorphism.
    There is no recognisable facial gestalt for this syndrome, which is why the
    diagnosis is molecular rather than clinical.
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
    severity: MILD
  evidence:
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild dysmorphic features were present in all cases."
    explanation: Documents the presence of mild dysmorphism in all six affected
      family members.
  - reference: PMID:8651288
    reference_title: 'PPM-X: a new X-linked mental retardation syndrome with psychosis,
      pyramidal signs, and macroorchidism maps to Xq28.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype also includes pyramidal signs, Parkinsonian features, and macroorchidism, but there are no characteristic dysmorphic facial features."
    explanation: >
      Marked PARTIAL because it qualifies rather than supports the phenotype: any
      dysmorphism present is mild and non-specific, with no diagnostic gestalt.
genetic:
- name: MECP2
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  notes: >
    MECP2 (Xq28) encodes methyl-CpG-binding protein 2, a methylated-DNA reader
    that couples DNA methylation to chromatin state, in part by recruiting the
    SWI2/SNF2 remodeller ATRX to methylated heterochromatin. For this entity the
    allele spectrum is a single recurrent missense substitution, c.419C>T
    p.(Ala140Val), in the alpha-1 helix of the methyl-CpG-binding domain.

    Scope caution. MECP2 is a highly pleiotropic disease gene and this is only one
    of several distinct MECP2 entities curated in dismech - Rett syndrome
    (`Rett_Syndrome`), MECP2 duplication syndrome (`MECP2_Duplication_Syndrome`),
    and X-linked autism susceptibility 3 (`Autism_Susceptibility_to_X-Linked_3`).
    Evidence must not be pooled across them. In particular the mechanism of PPM-X
    is a loss of a specific protein-protein interaction, whereas Rett-causing MBD
    substitutions typically abolish methyl-CpG binding itself and duplication
    syndrome is a dosage-gain mechanism. Screening studies also matter for scope:
    A140V is recurrent in male intellectual-disability pedigrees but was not found
    at all in a Brazilian series of 363 males ascertained for intellectual
    disability or psychiatric disease, so it is a recurrent but numerically minor
    cause of X-linked intellectual disability.
  evidence:
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A140V mutation was found in all affected males and all carrier females in the family."
    explanation: >
      Complete cosegregation of the allele with disease status in the founding
      PPM-X pedigree - the gene-disease validity evidence for this entry.
  - reference: PMID:11007980
    reference_title: MECP2 mutation in male patients with non-specific X-linked mental
      retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family study, the A140V mutation was found to segregate in the affected daughter and in four adult sons with severe mental retardation."
    explanation: >
      The index report of the Siena pedigree, supplying the original segregation
      observation. Note that this is the SAME family later characterised
      neurologically in PMID:11805248 (shared authors and institution; that paper
      back-references this one as "an Italian family with X-linked semidominant
      mental retardation"), so the two must be counted as one pedigree, not two.
  - reference: PMID:11007980
    reference_title: MECP2 mutation in male patients with non-specific X-linked mental
      retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that MECP2 mutations are not necessarily lethal in males and that they can be causative of non-specific X-linked mental retardation."
    explanation: >
      The conceptual shift this allele forced - MECP2 lesions had until then been
      assumed lethal in hemizygous males.
  - reference: PMID:11309367
    reference_title: MECP2 is highly mutated in X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we screened MECP2 in a cohort of 185 patients found negative for the expansions across the FRAXA CGG repeat and reported the identification of mutations in four sporadic cases of MR. One of the mutations, A140V, which we found in two patients, has been described previously"
    explanation: >
      Places the allele in its cohort-screening context and supplies the two
      sporadic A140V cases counted in the prevalence derivation. The cohort was
      explicitly fragile-X-negative, which is a second, independent line of
      evidence that A140V disease is not fragile X.
  - reference: PMID:15814190
    reference_title: The A140V mutation in the MECP2 gene is not a common etiological
      factor among Brazilian mentally retarded males.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA samples from 363 male individuals with syndromic and non-syndromic mental retardation and other psychiatric diseases were screened for A140V (419C>T) mutation in the MECP2 gene, considered the most frequent MECP2 mutation in males. No 419C>T was found suggesting that the A140V mutation in the MECP2 gene is not a common cause of mental retardation in males."
    explanation: >
      Marked PARTIAL because it is a negative screening result: it does not refute
      pathogenicity of the allele in the reported families, but it bounds the
      claim, showing that A140V explains none of 363 Brazilian males ascertained
      for intellectual disability or psychiatric disease and is therefore not a
      numerically important cause in an unenriched clinical cohort.
variants:
- name: MECP2 c.419C>T p.(Ala140Val)
  description: >
    The single recurrent allele of this disorder. It substitutes valine for
    alanine at codon 140, in the alpha-1 helix of the methyl-CpG-binding domain,
    within a region where the MBD and the ATRX-interacting domain overlap. It is
    the defining separation-of-function allele of MeCP2: methylated-DNA binding
    and heterochromatic targeting are preserved, ATRX recruitment is lost. It has
    been reported in multiple unrelated multiplex X-linked pedigrees (the
    Newcastle PPM-X family, the Siena family, MRX79, and a Belgian
    four-generation family) as well as in sporadic males, and it accounts for
    approximately 0.6% of all reported MeCP2 variants. It is not a Rett syndrome
    allele.
  gene:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  type: MISSENSE
  evidence:
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A140V mutation was found in all affected males and all carrier females in the family."
    explanation: Identifies the allele and its complete cosegregation in the PPM-X
      family.
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, descriptions have been published of two patients with independent familial mental retardation (MR) and two patients with sporadic MR who harbor this specific mutation in the MECP2 gene."
    explanation: Documents recurrence across familial and sporadic cases at the time
      of gene assignment.
  - reference: PMID:12325019
    reference_title: 'Identification of a family with nonspecific mental retardation
      (MRX79) with the A140V mutation in the MECP2 gene: is there a need for routine
      screening?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a new non-syndromic X-linked family (MRX79) to the chromosomal region Xq27.3-Xq28 and identified an A140V mutation in the MEPC2 gene in all patients with the disease haplotype."
    explanation: >
      Cosegregation with the disease haplotype in a fourth family, and the basis on
      which the historical MRX79 designation was merged into this entity. (The
      abstract contains the typographical error "MEPC2"; it is quoted verbatim.)
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Ala140Val mutation is recurrent, as it was already described in 4 families with X-linked mental retardation and in three sporadic male patients with intellectual disability."
    explanation: Tallies the reported recurrence of the allele up to 2016.
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "located in the a1 helix of the MBD"
    explanation: >
      Sources the structural localisation of the substitution to the alpha-1 helix
      of the methyl-CpG-binding domain. Tagged OTHER because the statement is a
      structural/literature summary in the discussion of that paper rather than an
      experimental result of it.
  - reference: PMID:17296936
    reference_title: Interaction between chromatin proteins MECP2 and ATRX is disrupted
      by mutations that cause inherited mental retardation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A140V is not an RTT mutation but has been reported in hemizygous males of several independent XLMR families"
    explanation: >
      Explicit statement that this is not a Rett allele, which is the key
      allele-level boundary between this entry and Rett_Syndrome.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    The pattern is X-linked but is best described as semidominant rather than
    cleanly recessive or dominant, and the sources genuinely disagree on the
    label. Hemizygous males are consistently and more severely affected; carrier
    females are frequently not normal but mildly affected, with mild cognitive
    impairment and speech difficulties, and at least one heterozygous female has
    developed the full neuropsychiatric picture with regression, pyramidal signs
    and parkinsonism. Dotti and colleagues therefore described the index family as
    X-linked semidominant. OMIM/MedGen annotate MONDO:0010235 as X-linked dominant,
    while the MONDO synonym list also carries an X-linked recessive designation
    inherited from the MRXS13 nomenclature. The generic HP:0001417 term is used
    here deliberately rather than forcing a choice between HP:0001419 and
    HP:0001423, with the semidominant reality described in prose. Expressivity is
    recorded as VARIABLE on the strength of the explicit intrafamilial variability
    reported in the Belgian family, and penetrance as INCOMPLETE because carrier
    females range from unaffected to fully symptomatic.
  evidence:
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors recently described a novel A140V MECP2 missense mutation in an Italian family with X-linked semidominant mental retardation."
    explanation: The explicit semidominant characterisation that this block is built
      on.
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurologic disorder associated with A140V MECP2 mutation is not necessarily lethal in men, but they are more severely affected than women of the same family."
    explanation: >
      Establishes the sex-severity gradient within a single pedigree, the core
      empirical observation the inheritance model rests on.
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We further delineate the phenotype associated with the p.Ala140Val mutation, illustrating a variable expressivity even within a given family"
    explanation: Direct support for the VARIABLE expressivity annotation.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 disorders are inherited in an X-linked manner."
    explanation: The GeneReviews inheritance statement for the MECP2 disorder group
      that PPM-X belongs to.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published for PPM-X,
    so only a literature case count is recorded and no rate is asserted. As of the
    2016 review of the allele, p.Ala140Val had been reported in four families with
    X-linked intellectual disability plus three sporadic males, to which that
    report added a four-generation Belgian family with seven carriers (4 males, 3
    females). The one usable population-level number is not a disease rate but an
    allele share: A140V accounts for approximately 0.6% of all reported MeCP2
    variants, ranking 21st by frequency. The Orphanet prevalence class for
    ORPHA:3077 could not be cited because that record is not present in
    `references_cache/` and refreshing Orphadata currently fails on a MANIFEST
    checksum mismatch.
  evidence:
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Ala140Val mutation is recurrent, as it was already described in 4 families with X-linked mental retardation and in three sporadic male patients with intellectual disability."
    explanation: Supplies the pre-2016 case tally used in the derivation.
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on the identification of the p.Ala140Val mutation in the MECP2 gene in 4 males and 3 females of a large Caucasian family affected with X-linked intellectual disability."
    explanation: Supplies the additional seven carriers added by that report.
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One of these mutations, A140V, is a common, recurring missense mutation accounting for about 0.6% of all MeCP2 mutations and ranking 21st by frequency."
    explanation: Supplies the allele-share figure, which is the only quantitative
      population-level statement available for this entity.
diagnosis:
- name: MECP2 Sequencing
  description: >
    There is no clinical gestalt for this disorder - there are no characteristic
    dysmorphic facial features - so the diagnosis is molecular. Targeted MECP2
    sequencing, an X-linked intellectual disability gene panel, or exome/genome
    sequencing is the appropriate route in a male with unexplained intellectual
    disability plus spastic paraparesis, particularly with an X-linked family
    history. Because the entity is a single recurrent allele, targeted A140V
    testing is unusually informative: the gene-assignment paper reported a simple
    PCR prescreen for exactly this purpose. The same testing should be considered
    in females with non-classic Rett phenotypes and intellectual disability with
    neuropsychiatric features.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A simple and reliable PCR approach has been developed for detection of the hot spot A140V mutation to prescreen any other unexplained cases of MR before further extensive mutation analyses."
    explanation: Direct support for targeted A140V prescreening as a diagnostic
      strategy in unexplained intellectual disability.
  - reference: PMID:24328834
    reference_title: Adolescent onset cognitive regression and neuropsychiatric symptoms
      associated with the A140V MECP2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding emphasizes the need to consider MECP2 sequencing in females with non-classic Rett phenotypes, particularly those with intellectual disability and neuropsychiatric features."
    explanation: Extends the testing indication to symptomatic heterozygous females.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a MECP2 disorder is established by molecular genetic testing in a female proband with suggestive findings and a heterozygous MECP2 pathogenic variant, and in a male proband with suggestive findings and a hemizygous MECP2 pathogenic variant."
    explanation: The GeneReviews diagnostic standard for the MECP2 disorder group.
- name: Multidisciplinary Surveillance Including QTc Monitoring
  description: >
    GeneReviews recommends periodic multidisciplinary review with regular QTc and
    scoliosis assessment across MECP2 disorders. This is included here for one
    specific, practical reason: the psychiatric phenotype of PPM-X is treated with
    antipsychotics, many of which prolong the QT interval, and the same chapter
    lists QT-prolonging drugs among the agents to avoid. It is group-level rather
    than PPM-X-specific guidance - no cardiac or scoliosis phenotype has been
    reported in any A140V pedigree - so it is a precaution attached to the
    treatment, not evidence of an intrinsic cardiac risk in this entity.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Periodic evaluation by the multidisciplinary team; regular assessment of QTc for evidence of prolongation; regular assessment for scoliosis."
    explanation: >
      Marked PARTIAL: GeneReviews surveillance guidance for MECP2 disorders as a
      group; the QTc recommendation derives from Rett syndrome data, not from
      PPM-X.
differential_diagnoses:
- name: Fragile X syndrome
  disease_term:
    preferred_term: fragile X syndrome
    term:
      id: MONDO:0010383
      label: fragile X syndrome
  description: >
    The single most important differential for this entry, and the reason the
    curation of this disorder requires deliberate care. Intellectual disability
    plus macroorchidism in a male with an X-linked family history is the classic
    fragile X presentation, fragile X is orders of magnitude commoner, and any
    literature search on "X-linked intellectual disability" plus "macroorchidism"
    returns overwhelmingly fragile X material. The two are nevertheless
    unambiguously distinct: fragile X is caused by CGG repeat expansion and
    methylation silencing of FMR1 at Xq27.3, PPM-X by a point mutation in MECP2 at
    Xq28. The founding PPM-X paper anticipated the confusion and excluded fragile X
    formally before naming the syndrome, testing both for cytogenetic fragile sites
    and for repeat expansion at FRAXA, FRAXE and FRAXF. Clinically, PPM-X adds
    progressive spastic paraparesis, parkinsonism and affective psychosis, and
    lacks the characteristic fragile X facial gestalt of a long face with prominent
    ears. Fragile X testing is normal in PPM-X and must not be treated as
    excluding this diagnosis.
  evidence:
  - reference: PMID:8651288
    reference_title: 'PPM-X: a new X-linked mental retardation syndrome with psychosis,
      pyramidal signs, and macroorchidism maps to Xq28.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected males do not show fragile sites at distal Xq on cytogenetic analysis, nor do they have expansions of the CGG repeats at the FRAXA, FRAXE, or FRAXF loci."
    explanation: >
      The formal exclusion of fragile X in the founding family. This is the primary
      evidence that PPM-X is a separate entity from fragile X syndrome despite the
      shared intellectual-disability-plus-macroorchidism presentation, and it is
      why this disorder is curatable as a standalone dismech entry.
  - reference: PMID:8651288
    reference_title: 'PPM-X: a new X-linked mental retardation syndrome with psychosis,
      pyramidal signs, and macroorchidism maps to Xq28.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a maximal LOD score of 3.311 at theta = .0 was observed with the microsatellite marker DXS1123 in Xq28"
    explanation: >
      Independent positional evidence separating the two: the PPM-X locus maps to
      Xq28, whereas FMR1 is at Xq27.3.
- name: Rett syndrome
  disease_term:
    preferred_term: Rett syndrome
    term:
      id: MONDO:0010726
      label: Rett syndrome
  description: >
    The same-gene differential. Rett syndrome and PPM-X are both MECP2 disorders
    but sit at opposite corners of the allele-by-sex space. Classic Rett affects
    females and follows a stereotyped course of normal early development,
    stagnation, rapid regression with loss of purposeful hand use and hand
    stereotypies, and acquired microcephaly; the causative MBD substitutions
    typically abolish methyl-CpG binding, and in hemizygous males they usually
    cause fatal neonatal encephalopathy. PPM-X affects males, spares methyl-CpG
    binding, produces no hand stereotypies and no Rett regression sequence, and
    leaves heterozygous females normal or only mildly affected. A140V is explicitly
    not a Rett allele. Evidence must never be pooled between this entry and
    `Rett_Syndrome`, and the Rett-specific clinical features of the shared
    GeneReviews chapter do not belong in this entry.
  evidence:
  - reference: PMID:17296936
    reference_title: Interaction between chromatin proteins MECP2 and ATRX is disrupted
      by mutations that cause inherited mental retardation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A140V is not an RTT mutation but has been reported in hemizygous males of several independent XLMR families"
    explanation: Explicit allele-level separation of PPM-X from Rett syndrome.
  - reference: PMID:11007980
    reference_title: MECP2 mutation in male patients with non-specific X-linked mental
      retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the preponderance of affected males in families with X-linked mental retardation, Rett syndrome (RTT) is a neurological disorder occurring almost exclusively in females."
    explanation: States the sex distribution that separates the two entities.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the spectrum in males ranges from severe neonatal encephalopathy to pyramidal signs, parkinsonism, and macroorchidism (PPM-X) syndrome to severe syndromic/nonsyndromic intellectual disability"
    explanation: >
      The GeneReviews framing that places PPM-X and Rett syndrome as separate points
      on one gene's phenotypic spectrum.
- name: Severe neonatal-onset encephalopathy with microcephaly (male MECP2 encephalopathy)
  disease_term:
    preferred_term: severe neonatal-onset encephalopathy with microcephaly
    term:
      id: MONDO:0010397
      label: severe neonatal-onset encephalopathy with microcephaly
  description: >
    The other male MECP2 phenotype, and the one that makes PPM-X surprising. Most
    hemizygous males with a Rett-causing MECP2 variant develop a relentless
    neonatal-onset encephalopathy with abnormal tone, involuntary movements, severe
    seizures and breathing abnormalities, and die before age two. PPM-X males
    survive into adulthood with moderate intellectual disability. The distinction
    is allelic: it is the specific separation-of-function character of
    p.Ala140Val, which spares methyl-CpG binding, that permits survival. A male
    with a MECP2 variant and a survivable, slowly progressive phenotype should
    prompt attention to which variant it is.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is characterized by a relentless clinical course that follows a metabolic-degenerative type of pattern, abnormal tone, involuntary movements, severe seizures, and breathing abnormalities."
    explanation: The GeneReviews description of the phenotype that must be
      distinguished from PPM-X in a male with a MECP2 variant.
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MECP2 mutations, originally described in a high percentage of patients with classic Rett syndrome, were considered lethal in men."
    explanation: >
      States the prior expectation of male lethality that this allele violates,
      which is the clinical reason the two male phenotypes must be told apart.
- name: Alpha-thalassemia X-linked intellectual disability syndrome (ATR-X)
  disease_term:
    preferred_term: alpha thalassemia-X-linked intellectual disability syndrome
    term:
      id: MONDO:0010519
      label: alpha thalassemia-X-linked intellectual disability syndrome
  description: >
    A mechanistically motivated differential rather than a purely clinical one.
    ATR-X syndrome is caused by mutation of ATRX itself - the very protein that
    MeCP2 p.Ala140Val fails to recruit - so the two disorders are predicted to
    converge on a shared chromatin defect approached from opposite sides of one
    interaction. They share intellectual disability, microcephaly, spasticity and
    mild dysmorphism. They are separated by the features unique to ATR-X:
    alpha-thalassemia, genital and urogenital anomalies, and growth deficiency,
    none of which are part of PPM-X. The overlap is the empirical basis of the
    ATRX-mislocalisation hypothesis recorded in `mechanistic_hypotheses`, and the
    non-overlap is why that hypothesis is at best a partial phenocopy model.
  evidence:
  - reference: PMID:17296936
    reference_title: Interaction between chromatin proteins MECP2 and ATRX is disrupted
      by mutations that cause inherited mental retardation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report that MeCP2 interacts with ATRX, a SWI2/SNF2 DNA helicase/ATPase that is mutated in ATRX syndrome (alpha-thalassemia/mental retardation, X-linked)."
    explanation: >
      Establishes the shared molecular node - ATRX - that makes this differential
      mechanistically interesting rather than merely phenotypically similar.
treatments:
- name: Psychotropic Management of Psychosis and Affective Symptoms
  description: >
    The psychiatric component is the most treatable part of this syndrome and the
    one most likely to be missed, because it emerges in adolescence or adult life
    against a stable background of developmental disability. Management is
    symptomatic and follows general practice for affective psychosis in
    intellectual disability; GeneReviews notes risperidone for agitation in MECP2
    disorders. There is no PPM-X-specific trial evidence and no disease-modifying
    therapy. One important safety constraint carries over from the MECP2 disorders
    literature: drugs known to prolong the QT interval should be avoided, which is
    directly relevant here because several antipsychotics do exactly that.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: risperidone
      term:
        id: CHEBI:8871
        label: risperidone
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Psychosis
    term:
      id: HP:0000709
      label: Psychosis
  - preferred_term: Bipolar affective disorder
    term:
      id: HP:0007302
      label: Bipolar affective disorder
  notes: >
    Deliberate mismatch flagged for future curation: the only agent with a
    citable source in this disorder group is an antipsychotic (risperidone, from
    GeneReviews, and directed at agitation), whereas the psychiatric phenotype
    actually reported in PPM-X is manic-depressive, which would ordinarily call
    for mood stabilisation. No mood stabiliser has been reported in any A140V
    pedigree, so none is curated here rather than inventing one; both psychosis
    and bipolar affective disorder are listed as target phenotypes to make the
    gap visible.
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Risperidone may help in treating agitation; melatonin can ameliorate sleep disturbances."
    explanation: >
      Marked PARTIAL: this is expert-consensus management guidance for MECP2
      disorders as a group, directed at agitation rather than at the affective
      psychosis specific to PPM-X, and it is not efficacy evidence in this entity.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Drugs known to prolong the QT interval."
    explanation: >
      Marked PARTIAL: this is the GeneReviews drug-safety warning for MECP2
      disorders as a group, and the QTc prolongation that motivates it is
      documented in Rett syndrome, not in PPM-X - no cardiac phenotype has been
      reported in any A140V pedigree. It is carried here as a precautionary,
      group-level warning because antipsychotics used for the psychiatric
      phenotype are themselves a common source of QT prolongation, not because
      PPM-X is known to carry a baseline QTc risk.
  - reference: PMID:8651288
    reference_title: 'PPM-X: a new X-linked mental retardation syndrome with psychosis,
      pyramidal signs, and macroorchidism maps to Xq28.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the six moderately retarded males have had episodes of manic-depressive psychosis."
    explanation: Establishes the treatment indication - the affective psychosis this
      management is directed at.
- name: Spasticity Management
  description: >
    The slowly progressive spastic paraparesis is the main driver of motor
    disability in adults and is managed per standard care for spasticity -
    physiotherapy, stretching and gait work, with antispastic pharmacotherapy and
    orthotics as required. No PPM-X-specific outcome data exist; this is recorded
    because spasticity is near-universal in the reported families and progressive.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Spastic paraparesis
    term:
      id: HP:0002313
      label: Spastic paraparesis
  evidence:
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of seizures, constipation, gastroesophageal reflux, scoliosis, prolonged QTc, and spasticity per standard care."
    explanation: >
      Marked PARTIAL: GeneReviews directs spasticity management to standard care
      for MECP2 disorders generally; it is not efficacy evidence in PPM-X.
  - reference: PMID:11805248
    reference_title: A Rett syndrome MECP2 mutation that causes mental retardation in
      men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic features included slowly progressive spastic paraparesis/pyramidal signs (6/6), distal atrophy of the legs (6/6), ataxia (2/6), and postural tremor of the hands (3/6)."
    explanation: Establishes the treatment indication and its progressive character.
- name: Developmental and Educational Intervention
  description: >
    Management of the developmental phenotype is supportive and generic: early
    intervention, special education, and speech and language therapy directed at
    the impaired language development seen in affected males and the speech
    difficulties seen in carrier females. There is no disease-specific evidence
    base.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Males have moderate intellectual disability, impaired language development, friendly behavior, slowly progressive spastic paraparesis and dystonic movements of the hands."
    explanation: >
      Marked PARTIAL: this establishes the universal need for developmental and
      language intervention but is not evidence for the efficacy of any specific
      therapy in this disorder.
- name: Genetic Counselling
  description: >
    Counselling must be framed around the semidominant X-linked pattern rather
    than a simple recessive model, because carrier females are frequently mildly
    affected and can occasionally be fully symptomatic. Carrier mothers have a 50%
    risk of transmitting the allele to each child; sons who inherit it will be
    affected, daughters who inherit it may be mildly affected. Because the
    disorder is caused by one recurrent allele, targeted testing of at-risk
    relatives is straightforward once the proband is diagnosed. The reported
    pedigrees are multiplex three- and four-generation families, so the recurrence
    risk conversation is often not hypothetical.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The A140V mutation was found in all affected males and all carrier females in the family."
    explanation: >
      Establishes the multiplex familial transmission and the existence of
      identifiable carrier females that the counselling model rests on.
  - reference: PMID:20301670
    reference_title: MECP2 Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the mother is a known heterozygote, the risk to her offspring of inheriting the MECP2 variant is 50%."
    explanation: The GeneReviews recurrence-risk figure for MECP2 disorders.
animal_models:
- species: Mus musculus
  genotype: Mecp2 A140V knock-in (Jentarra et al. 2010 line)
  category: KNOCKIN
  genes:
  - preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  description: >
    The only animal model of this disorder, and an allele-matched one - it carries
    the same A140V substitution found in patients rather than a null allele. This
    matters, because Mecp2-null mice model the severe end of the MECP2 spectrum
    while the A140V knock-in has a normal lifespan, normal weight gain, and none of
    the seizures, tremors, breathing difficulties or kyphosis that confound
    interpretation of the null models. It therefore isolates the cognitive and
    structural consequences of the allele.

    Three phenotypes have been characterised: increased cell packing density with
    reduced dendritic complexity; reduced neuronal soma size that is
    cell-autonomous, tracks with down-regulated mTOR signalling, and is rescued in
    vitro by IGF-1; and an age-dependent electrophysiological progression from
    hippocampal hyperexcitability in young mice to combined hyperexcitability plus
    short- and long-term potentiation deficits in aged mice.

    Translational caveat: the model's authors describe it as a Rett
    syndrome/X-linked mental retardation model, and it has not been shown to
    reproduce the two features that define PPM-X clinically - psychosis and
    macroorchidism. See the HUMAN_MODEL_MISMATCH discussion.
  evidence:
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report the construction and initial characterization of a mouse model expressing the A140V MeCP2 mutation."
    explanation: Establishes that the model carries the patient allele.
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to some MeCP2 mutation mouse models, the A140V mouse has an apparently normal lifespan and normal weight gain patterns with no obvious seizures, tremors, breathing difficulties or kyphosis."
    explanation: >
      Documents the mild, survivable character of the model, which parallels the
      survivable human male phenotype and is what makes it informative.
  - reference: PMID:24750778
    reference_title: Electrophysiological phenotypes of MeCP2 A140V mutant mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results clearly illustrate the age-dependent abnormalities of neuronal and synaptic function in the MeCP2 A140V mutant mouse model"
    explanation: The electrophysiological characterisation of the same line.
discussions:
- discussion_id: ppmx_macroorchidism_mechanism
  prompt: >
    What causes macroorchidism in PPM-X syndrome, and is it actually a consistent
    feature of the MECP2 p.Ala140Val phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
  rationale: >
    Macroorchidism is one of the four letters of the syndrome acronym, but it is
    the weakest-evidenced component of the entity. It appears in the 1996 founding
    description and is retained in the GeneReviews characterisation, yet none of
    the four subsequently reported A140V families - Siena, MRX79, the Belgian
    four-generation family, or the sporadic cases - reports testicular volumes or
    counts affected males with macroorchidism, and the allele-matched mouse model
    has not been examined for a testicular phenotype. No mechanism has been
    proposed linking loss of MeCP2-ATRX recruitment to testicular enlargement.
    Because macroorchidism is simultaneously the feature that names the syndrome
    and the feature that drives confusion with fragile X, the gap matters for both
    entity definition and differential diagnosis. It is the reason no frequency
    band is asserted for this phenotype.
  proposed_experiments:
  - experiment_id: exp_ppmx_orchidometry_pedigree_survey
    name: Systematic testicular volume survey across MECP2 A140V pedigrees
    description: >-
      Measure testicular volume by orchidometry or ultrasound in all postpubertal
      males from the known MECP2 p.Ala140Val pedigrees (Newcastle PPM-X, Siena,
      MRX79, Belgian four-generation family) and in reported sporadic carriers,
      reporting against age- and ancestry-matched normative data. This converts the
      qualitative founding observation into a countable phenotype with a
      denominator, which is what a frequency band would require.
    readouts:
    - name: Testicular volume relative to age-matched norms
      target: pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
      phenotype_term:
        preferred_term: Macroorchidism
        term:
          id: HP:0000053
          label: Macroorchidism
      assays:
      - preferred_term: orchidometry
      - preferred_term: scrotal ultrasonography
      direction: POSITIVE
  - experiment_id: exp_ppmx_mouse_testicular_phenotype
    name: Testicular phenotyping of the Mecp2 A140V knock-in mouse
    description: >-
      Compare testis weight, seminiferous tubule histology and Sertoli-cell counts
      in adult male Mecp2 A140V knock-in mice against wild-type littermates. The
      line has a normal lifespan, so adult reproductive phenotyping is feasible;
      no testicular readout has been reported for it.
    readouts:
    - name: Testis weight and seminiferous tubule histology
      target: pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
      phenotype_term:
        preferred_term: Macroorchidism
        term:
          id: HP:0000053
          label: Macroorchidism
      assays:
      - preferred_term: histopathology
      direction: POSITIVE
  evidence:
  - reference: PMID:8651288
    reference_title: 'PPM-X: a new X-linked mental retardation syndrome with psychosis,
      pyramidal signs, and macroorchidism maps to Xq28.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype also includes pyramidal signs, Parkinsonian features, and macroorchidism, but there are no characteristic dysmorphic facial features."
    explanation: >
      The only primary clinical description of the testicular phenotype, and it is
      qualitative - no volumes, no counts.
- discussion_id: ppmx_entity_boundary_vs_nonsyndromic_xlid
  prompt: >
    Is PPM-X a distinct syndrome, or simply the most fully ascertained end of a
    single MECP2 p.Ala140Val phenotype that is otherwise reported as nonsyndromic
    X-linked intellectual disability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cognitive and Neuropsychiatric Dysfunction
  rationale: >
    The same allele has been reported under three different nosological labels:
    PPM-X (a named syndrome), MRX79 (nonsyndromic X-linked intellectual
    disability), and "X-linked intellectual disability with spasticity". MONDO has
    already folded MRX79 into MONDO:0010235 as a synonym, which implicitly
    settles the question by lumping - but the lumping was nomenclatural rather
    than the result of a systematic phenotypic reassessment.

    A caution on the MONDO synonym list, which is itself a same-gene blending
    trap: MONDO:0010235 also carries "mental retardation, X-linked 16" (MRX16),
    but the MRX16 family does NOT carry A140V - Couvert and colleagues identified
    a different MECP2 allele, E137G, in that family (PMID:11309367). MRX16 was
    merged into this MONDO entity by nomenclature, not on allelic grounds, and it
    is deliberately excluded from the A140V pedigree counts and from the proposed
    experiments below. The defining psychiatric and testicular features come almost
    entirely from the single founding pedigree, while the motor phenotype
    replicates robustly across families. It is therefore unresolved whether
    psychosis and macroorchidism are allele-level features that were simply not
    looked for in the families ascertained as nonsyndromic, or genuine
    family-specific modifiers. This is a live curation question, because if the
    former is true the entity is well defined and underdiagnosed, and if the latter
    is true the honest entity is "MECP2 p.Ala140Val-related X-linked intellectual
    disability with spasticity" and PPM-X is a historically privileged pedigree.
  proposed_experiments:
  - experiment_id: exp_ppmx_blinded_psychiatric_reassessment
    name: Protocolised psychiatric reassessment of A140V pedigrees ascertained as
      nonsyndromic
    description: >-
      Apply a structured diagnostic interview for affective and psychotic episodes,
      adapted for intellectual disability, to all adult carriers in the MRX79
      family and in other A140V pedigrees originally ascertained as
      nonsyndromic, with raters blind to the historical syndrome label. If
      psychosis is found at rates comparable to the founding family, the entity is
      confirmed as underdiagnosed rather than pedigree-specific.
    readouts:
    - name: Lifetime prevalence of affective psychotic episodes
      target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
      phenotype_term:
        preferred_term: Psychosis
        term:
          id: HP:0000709
          label: Psychosis
      direction: POSITIVE
  - experiment_id: exp_ppmx_genotype_first_biobank_phenotyping
    name: Genotype-first ascertainment of MECP2 A140V carriers from sequencing biobanks
    description: >-
      Identify MECP2 c.419C>T carriers in large population and clinical sequencing
      biobanks and phenotype them prospectively, blind to the PPM-X literature.
      Genotype-first ascertainment removes the referral bias that produced the
      original syndrome definition and is the only design that can estimate the
      true penetrance of the psychiatric and testicular features.
    readouts:
    - name: Penetrance of psychosis, macroorchidism and spastic paraparesis in
        unselected carriers
      target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
      direction: POSITIVE
  evidence:
  - reference: PMID:12325019
    reference_title: 'Identification of a family with nonspecific mental retardation
      (MRX79) with the A140V mutation in the MECP2 gene: is there a need for routine
      screening?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped a new non-syndromic X-linked family (MRX79) to the chromosomal region Xq27.3-Xq28 and identified an A140V mutation in the MEPC2 gene in all patients with the disease haplotype."
    explanation: >
      The same allele described as causing explicitly non-syndromic intellectual
      disability, which is the crux of the boundary question.
  - reference: PMID:27465203
    reference_title: Expanding phenotype of p.Ala140Val mutation in MECP2 in a 4 generation
      family with X-linked intellectual disability and spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We further delineate the phenotype associated with the p.Ala140Val mutation, illustrating a variable expressivity even within a given family, and we compare our patients with previous reported cases in the literature."
    explanation: >
      Documents variable expressivity within a family, which is the mechanism by
      which one allele could plausibly generate both the syndromic and the
      nonsyndromic presentations.
- discussion_id: ppmx_mouse_model_translational_validity
  prompt: >
    Does the Mecp2 A140V knock-in mouse model PPM-X syndrome, or does it model the
    mild end of Rett syndrome? Neither of the two features that define PPM-X
    clinically - psychosis and macroorchidism - has been demonstrated in it, and
    ATRX localisation, the proposed mechanism, has never been assayed in it.
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Neuronal Maturation and Dendritic Arborization
  - pathophysiology#Hippocampal Network Hyperexcitability and Impaired Synaptic Plasticity
  rationale: >
    All cellular and circuit-level evidence in this entry comes from one mouse
    line, and that line is consistently framed by its own creators as a model of
    "Rett syndrome/X-linked mental retardation", with PPM-X mentioned only as one
    of the human phenotypes the allele can produce. The reported phenotypes -
    increased cell packing density, reduced dendritic complexity, reduced soma
    size, hippocampal hyperexcitability, aged-onset LTP deficits - are generic
    MeCP2-dysfunction readouts shared with null models, not PPM-X-specific ones. No
    published work has looked for a behavioural correlate of affective psychosis in
    the line, nor for a testicular phenotype, and its spastic-paraparesis status is
    not reported either. The mismatch is mechanistically meaningful rather than
    pedantic: the whole argument that PPM-X is separable from Rett rests on the
    ATRX-recruitment selectivity of the allele, which has been demonstrated only in
    vitro and in fibroblasts, and the mouse work does not test whether ATRX
    mislocalisation is what produces the phenotypes observed. Any claim in this
    entry sourced from the mouse is therefore marked MODEL_ORGANISM and is not used
    to support a human phenotype on its own.
  proposed_experiments:
  - experiment_id: exp_ppmx_atrx_localisation_in_vivo
    name: ATRX subnuclear localisation in Mecp2 A140V knock-in brain
    description: >-
      Assay ATRX localisation to pericentric heterochromatin in neurons from
      Mecp2 A140V knock-in mouse brain by immunofluorescence and chromatin
      fractionation, versus wild-type littermates. This tests whether the in vitro
      and cultured-fibroblast recruitment defect that the entire mechanistic model
      rests on actually holds in vivo in the allele-matched animal.
    readouts:
    - name: Fraction of neurons with ATRX at heterochromatic foci
      target: pathophysiology#Selective Loss of ATRX Recruitment with Preserved Methyl-CpG
        Binding
      biological_processes:
      - preferred_term: heterochromatin organization
        term:
          id: GO:0070828
          label: heterochromatin organization
        modifier: ABNORMAL
      direction: NEGATIVE
  - experiment_id: exp_ppmx_mouse_neurobehavioural_battery
    name: Psychosis-relevant and motor phenotyping of the Mecp2 A140V line
    description: >-
      Run a neurobehavioural battery on the A140V line covering (a)
      psychosis-relevant endophenotypes - prepulse inhibition, amphetamine
      sensitivity, circadian activity cycling - which have never been reported for
      this model, and (b) corticospinal motor function - rotarod, gait analysis,
      hindlimb clasping, with corticospinal tract histology - to test whether the
      mouse reproduces the most robustly replicated human feature, progressive
      spastic paraparesis. Together these determine whether the line is a PPM-X
      model or only a generic mild MeCP2 model.
    readouts:
    - name: Prepulse inhibition and amphetamine-induced hyperlocomotion
      target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
      direction: NEGATIVE
    - name: Age-dependent gait and hindlimb motor decline
      target: pathophysiology#Progressive Corticospinal and Extrapyramidal Dysfunction
      phenotype_term:
        preferred_term: Spastic paraparesis
        term:
          id: HP:0002313
          label: Spastic paraparesis
      direction: POSITIVE
  evidence:
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We have identified various neurological abnormalities in this mouse model of Rett syndrome/X-linked mental retardation which may help to elucidate the manner in which MECP2 mutations cause neuronal changes resulting in mental retardation without the confounding effects of seizures, chronic hypoventilation, or other Rett syndrome associated symptoms."
    explanation: >
      Marked PARTIAL: the authors frame the line as a Rett/XLMR model and restrict
      their claim to generic MECP2-related neuronal changes, not to PPM-X-specific
      features.
  - reference: PMID:24750778
    reference_title: Electrophysiological phenotypes of MeCP2 A140V mutant mouse model.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "which provides new insights into the understanding of the pathogenesis of Rett syndrome"
    explanation: >
      Marked PARTIAL: the electrophysiology paper explicitly frames its
      contribution as insight into Rett syndrome pathogenesis, not PPM-X, despite
      using the PPM-X allele.

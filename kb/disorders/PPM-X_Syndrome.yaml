- name: Progressive Corticospinal and Extrapyramidal Dysfunction
  biological_scale: ORGANISM
  description: >
    The motor arm of the syndrome and the "PP" of the acronym. All six
    symptomatic relatives in the Siena A140V family - four men AND two women -
    had slowly progressive spastic paraparesis/pyramidal signs together with
    distal atrophy of the legs, with ataxia and postural hand tremor in a subset
    and dysarthria in the oldest affected brothers. That the two heterozygous
    women were also affected motorically is important: the motor syndrome is not
    male-restricted, only male-predominant in severity.
    The independently ascertained Belgian four-generation
    family reproduced the same picture - slowly progressive spastic paraparesis
    with dystonic hand movements - which is the strongest available evidence that
    the motor syndrome is an allele property and not a single-family peculiarity.
    Parkinsonian features were part of the founding description and remain in the
    syndrome definition, though they are less consistently reported in the later
    families than the pyramidal findings.

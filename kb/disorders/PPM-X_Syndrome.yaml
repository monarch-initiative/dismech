description: >
  PPM-X syndrome (MRXS13; OMIM 300055; ORPHA:3077) is a rare X-linked syndromic
  intellectual disability caused by the recurrent MECP2 missense variant
  c.419C>T p.(Ala140Val), which lies in the alpha-1 helix of the
  methyl-CpG-binding domain (MBD) at Xq28. The acronym encodes the founding
  tetrad: Psychosis, Pyramidal signs, Macroorchidism, and X-linked intellectual
  disability. It was delineated by Lindsay and colleagues in 1996 in a
  three-generation family in which four of six moderately affected males had
  episodes of manic-depressive psychosis, and was assigned to MECP2 by Klauck and
  colleagues in 2002 in that same family.

  The molecular lesion is unusually well characterised and unusually specific.
  p.Ala140Val leaves methyl-CpG binding and heterochromatic targeting of MeCP2
  intact while abolishing recruitment of the SWI/SNF-family chromatin remodeller
  ATRX to those sites. It is not the only MBD substitution that spares
  methyl-CpG binding - the Rett allele R133C does too - but it is the cleanest
  separation-of-function allele, because loss of the ATRX interaction is its only
  measurable defect, whereas R133C additionally acquires binding to
  non-methylated DNA. The allele therefore uncouples the DNA-binding and
  ATRX-binding functions of MeCP2, which is the mechanistic explanation for why it
  produces a survivable, comparatively mild, non-Rett phenotype in hemizygous
  males rather than the neonatal encephalopathy that most male MECP2 lesions cause.

  Clinically the male phenotype is a slowly progressive spastic paraparesis with
  distal leg wasting, tremor, ataxia and dysarthria layered on moderate
  intellectual disability, with parkinsonian features and adult-onset affective
  psychosis in a subset. Heterozygous females are usually normal or mildly
  affected - a further contrast with Rett syndrome, where MECP2 variants act in
  the opposite direction with respect to sex.

  Named-entity caution. PPM-X is NOT fragile X syndrome. The pairing of
  intellectual disability with macroorchidism is the fragile X clinical signature,
  and fragile X dominates any literature search on those two terms, but the
  founding PPM-X family was explicitly shown to be negative for fragile sites at
  distal Xq and for CGG expansion at FRAXA, FRAXE and FRAXF before the syndrome
  was named. The gene is MECP2, not FMR1; see the differential_diagnoses section.

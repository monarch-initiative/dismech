notes: >
  Named Entity Confusion (NEC) preflight, run 2026-08-01 before any deep-research
  content was used. MONDO:0010235 has no MONDO definition text, so the identity
  anchors used were: (1) the MONDO gene relationship `RO:0004003 HGNC:6990 !
  MECP2`; (2) the OMIM xref `OMIM:300055`, matching the OMIM number asserted in
  MedGen 163232 and quoted inside PMID:20163734 and PMID:27465203; and (3) the
  synonym list, which carries PPM-X, Lindsay-Burn syndrome and MRXS13. All three
  converge on MECP2 p.Ala140Val. The predicted NEC attractor for this entity is
  fragile X syndrome (FMR1), because intellectual disability plus macroorchidism
  is the fragile X signature; the founding paper (PMID:8651288) rules fragile X
  out explicitly and that exclusion is curated as evidence on the fragile X
  differential rather than left implicit.

  Two further NEC traps were checked and avoided. First, PMID:9222958 (Pai et al.,
  "A new X linked recessive syndrome of mental retardation and mild dysmorphism
  maps to Xq28") is returned by a PubMed search for "PPM-X syndrome" and maps to
  the same Xq28 interval, but it describes a DIFFERENT family and states that none
  of its patients had features of the PPM-X syndrome. It is deliberately not cited
  anywhere in this entry. Second, the MONDO synonym list folds in the historical
  nonsyndromic designations MRX16 and MRX79; MRX79 (PMID:12325019) is included
  here because it was shown to carry the same A140V allele. MRX16, by contrast,
  carries a DIFFERENT MECP2 allele (E137G; PMID:11309367) and was merged into
  MONDO:0010235 on nomenclatural grounds only - it is excluded from every A140V
  pedigree count in this entry, and the entity-boundary discussion says so
  explicitly.

  Deep research. One Edison/falcon run was performed
  (`research/PPM-X_Syndrome-deep-research-falcon.md`, 640 s, 20 citations). It
  passed the NEC gene-frequency check decisively (MECP2 mentioned 70 times, FMR1
  once) and its framing is sound - it explicitly separates direct PPM-X evidence
  from MECP2-spectrum and Rett evidence, and it independently confirms that no
  PPM-X-specific prevalence estimate, diagnostic guideline, biomarker or
  interventional trial exists. However it contributed no usable primary evidence
  and all three of its "key primary publications" were wrong on verification:
  (a) PMID:11951158, given as Klauck et al. AJHG 2002, is in fact a German-language
  COPD exercise-training paper in Pneumologie - a fabricated PMID attribution (the
  DOI it supplied, 10.1086/339553, is correct and resolves to PMID:11885030);
  (b) PMID:11309367 is labelled the "original syndrome report" but is Couvert et al.
  2001, "MECP2 is highly mutated in X-linked mental retardation" - the actual
  founding report is PMID:8651288 (Lindsay et al. 1996), which the report never
  cites; (c) PMID:16966553 is offered as an A140V phenotypic expansion but reports
  a different MECP2 allele (964C>T) and is not cited here. The report also missed
  the central mechanism of this disorder entirely - it speculates about
  NCoR/SMRT and states that no variant-specific mechanism is established for
  A140V, whereas the A140V-specific ATRX-recruitment defect (PMID:17296936) is well
  documented. This entry is therefore built from primary literature retrieved
  directly from PubMed, with the DR report used only as a negative control and as
  corroboration of the evidence gaps. It is retained in `research/` for
  provenance.

  GeneReviews baseline: there is no GeneReviews chapter titled for PPM-X. The
  applicable chapter is "MECP2 Disorders" (PMID:20301670, updated 2025-12-04),
  which covers PPM-X explicitly as one point on the male MECP2 spectrum and is
  tagged in the top-level `references:` block. Its Clinical Characteristics
  section is written around classic Rett syndrome in females and severe neonatal
  encephalopathy in males; the only PPM-X-specific content in the cached abstract
  is the single spectrum sentence, which is curated on the macroorchidism
  phenotype and the Rett differential. Its Management content (risperidone for
  agitation, spasticity per standard care) and its Agents-to-Avoid warning
  (QT-prolonging drugs) are carried into the treatments section. Rett-specific
  features from that chapter (hand stereotypies, apnea/hyperpnea, acquired
  microcephaly as part of classic Rett regression) are deliberately NOT curated
  here: they belong to the female Rett phenotype, not to PPM-X, and importing them
  would be exactly the kind of same-gene entity blending this entry is trying to
  avoid.

  Frequency bands. Denominators are small and come from single pedigrees, so
  several phenotypes carry no `frequency:` at all.

  CRITICAL denominator caveat, which applies to every band derived from the Siena
  family (PMID:11805248): the "/6" denominator is SIX SYMPTOMATIC RELATIVES - four
  men and two women - not six carriers and not six males. Bands derived from it
  therefore describe the distribution of features among affected individuals in
  one pedigree, not penetrance among carriers, and they are not male-specific.
  Notably, the two heterozygous women in that family shared the pyramidal signs
  and distal leg atrophy, which is why the female phenotype in this entry is
  described as milder in severity rather than restricted in system involvement.

  Bands asserted, each from an explicitly quoted count: psychosis 4/6 affected
  males in the founding Newcastle family (66.7%, FREQUENT); pyramidal signs 6/6
  and spastic paraparesis 6/6 in the Siena family (100%, VERY_FREQUENT, retained
  because both are independently replicated in the Belgian family); postural
  tremor 3/6 (50%, FREQUENT); ataxia 2/6 (33.3%, FREQUENT); dysarthria 2/6
  (33.3%, FREQUENT). Microcephaly is reported as "Two of them" among four affected
  males in the Belgian family but is absent from the other pedigrees, so it is
  recorded as OCCASIONAL rather than at the literal 50%.

  Two phenotypes are deliberately left WITHOUT a band despite having a quotable
  count. Distal amyotrophy is 6/6 in the Siena family but has never been reported
  in any other A140V pedigree, so a VERY_FREQUENT band would generalise a single
  unreplicated observation. Macroorchidism is in the syndrome name and in the
  founding description, but no A140V series reports a testicular-volume count at
  all, so no band is defensible; that gap is recorded as a KNOWLEDGE_GAP
  discussion.

  Pedigree accounting. The distinct A140V pedigrees are: Newcastle/PPM-X
  (PMID:8651288, PMID:11885030 - one family across both papers), Siena
  (PMID:11007980 and PMID:11805248 - ALSO one family across both papers; Dotti
  back-references Orrico's "Italian family with X-linked semidominant mental
  retardation", and the author lists overlap), MRX79 (PMID:12325019), and the
  Belgian four-generation family (PMID:27465203), plus sporadic cases including
  the two in PMID:11309367. Paper count must not be mistaken for pedigree count.

  Structured-source citations were NOT used. ORPHA:3077 is not present in
  `references_cache/`, and `just refresh-orphadata` fails on a checksum mismatch
  against the pinned `data/orphadata/MANIFEST.yaml` (upstream Orphadata has been
  republished since the pin). Repinning the manifest would rewrite all 328 cached
  ORPHA files and is out of scope for a curation PR. Consequently no Orphanet
  prevalence class and no Orphanet HPO frequency row is cited, and `prevalence`
  records only a literature case count.

  Deliberately out of scope: the very large Rett syndrome and MECP2 duplication
  literatures (curated in `Rett_Syndrome.yaml` and `MECP2_Duplication_Syndrome.yaml`),
  the male MECP2 severe neonatal encephalopathy phenotype (a separate MONDO
  entity, curated here only as a differential), and the general MECP2 structural
  biology literature that does not address p.Ala140Val specifically. Several
  phenotypes suggested by the deep-research report (anxiety, social withdrawal,
  rigidity, specific learning disability) are omitted because that report itself
  flags them as extrapolated from broader male MECP2 case literature rather than
  validated PPM-X features, and no A140V-specific source for them was found.
pathophysiology:
- name: MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
  biological_scale: MOLECULAR
  description: >
    The lesion is a single recurrent missense allele, c.419C>T p.(Ala140Val), in
    the MECP2 gene at Xq28. Unlike most Mendelian entries this disorder has
    effectively an allele series of one: every reported PPM-X or A140V family
    carries the same substitution, which sits in the alpha-1 helix of the
    methyl-CpG-binding domain. It is a genuine recurrent mutation rather than a
    rare polymorphism - it segregates with the disease haplotype in multiple
    unrelated multiplex pedigrees and is enriched in male intellectual-disability
    cohorts - and it accounts for roughly 0.6% of all reported MeCP2 variants.
    Hemizygous males are affected; heterozygous females are normal or mildly
    affected.
  gene:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2
  evidence:
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here the genetic cause of the X-linked syndrome of psychosis, pyramidal signs, and macro-orchidism (PPM-X) in a three-generation family manifesting the disorder as a mutation in the methyl-CpG binding-protein 2 (MECP2) gene in Xq28."
    explanation: >
      The gene-assignment paper and the strongest identity anchor for this entry:
      it binds the PPM-X acronym directly to MECP2 at Xq28, and it did so in the
      same family that Lindsay and colleagues used to define the syndrome.
  - reference: PMID:11885030
    reference_title: A mutation hot spot for nonspecific X-linked mental retardation
      in the MECP2 gene causes the PPM-X syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This strongly suggests that A140V is a hot spot of mutation resulting in moderate to severe MR in males."
    explanation: Establishes A140V as a recurrent hot-spot allele rather than a
      private family variant.
  - reference: PMID:12325019
    reference_title: 'Identification of a family with nonspecific mental retardation
      (MRX79) with the A140V mutation in the MECP2 gene: is there a need for routine
      screening?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to data published by others, this suggests that A140V is a recurrent mutation (and not a polymorphism) found in patients with X-linked mental retardation."
    explanation: >
      Independent confirmation of recurrence and, importantly, an explicit
      statement that the allele is pathogenic rather than a benign variant - the
      question that dominated the early A140V literature.
  - reference: PMID:20163734
    reference_title: Abnormalities of cell packing density and dendritic complexity
      in the MeCP2 A140V mouse model of Rett syndrome/X-linked mental retardation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One of these mutations, A140V, is a common, recurring missense mutation accounting for about 0.6% of all MeCP2 mutations and ranking 21st by frequency."
    explanation: Sources the 0.6% allele-frequency statement in the description.
  downstream:
  - target: Selective Loss of ATRX Recruitment with Preserved Methyl-CpG Binding
    hypothesis_groups:
    - atrx_mislocalization_model
- name: Selective Loss of ATRX Recruitment with Preserved Methyl-CpG Binding
  biological_scale: MOLECULAR
  description: >
    This is the discriminating node of the entry and the reason PPM-X is
    mechanistically separable from Rett syndrome despite sharing a gene. MeCP2
    normally binds methylated CpG dinucleotides and, in a
    DNA-methylation-dependent manner, recruits ATRX - a SWI2/SNF2 helicase/ATPase
    chromatin remodeller, itself the ATR-X syndrome gene - to heterochromatic
    foci. The ATRX-interacting domain of MeCP2 overlaps the methyl-CpG-binding
    domain, and MBD point mutations causing either Rett syndrome or X-linked
    intellectual disability inhibit the ATRX interaction. What is distinctive
    about p.Ala140Val is not that it spares methyl-CpG binding - the Rett allele
    R133C does that too - but that loss of the ATRX interaction is its ONLY
    measurably altered property: it binds methylated DNA normally, targets
    heterochromatin efficiently, and, unlike R133C, does not acquire aberrant
    binding to non-methylated DNA. That makes it the cleanest natural
    separation-of-function allele in MeCP2.

    Two consequences follow. Mechanistically, the phenotype of PPM-X can be
    attributed largely to mislocalised ATRX rather than to failed methyl-CpG
    reading. Clinically, this hypomorphic, function-selective character is the
    most plausible explanation for the sex-reversed severity pattern relative to
    Rett syndrome - hemizygous males survive with moderate intellectual disability
    instead of dying of neonatal encephalopathy, while heterozygous females are
    normal or only mildly affected instead of having classic Rett syndrome.
  gene:
    preferred_term: MECP2
    term:
      id: hgnc:6990
      label: MECP2

- name: Cognitive and Neuropsychiatric Dysfunction
  biological_scale: ORGANISM
  description: >
    The cognitive and psychiatric arm, and the "P" and "X" of the acronym.
    Intellectual disability is present in every reported hemizygous male and is
    typically moderate, with impaired language development; carrier females are
    normal or have mild cognitive impairment and speech difficulties. Layered on
    this is an episodic affective psychosis: four of the six affected males in the
    founding family had episodes of manic-depressive psychosis, which is the
    feature that gave the syndrome its first letter and distinguishes it from
    nonsyndromic X-linked intellectual disability.

    The psychiatric component is age-dependent rather than congenital - it emerges
    in adolescence or adult life on a background of stable developmental
    disability - and it has now been described in a heterozygous female as well,
    who presented with late-onset cognitive regression alongside pyramidal signs,
    parkinsonism and bipolar symptoms.

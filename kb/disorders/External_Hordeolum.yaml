name: External Hordeolum
creation_date: "2026-09-29T22:26:54Z"
description: >-
  External hordeolum is an acute localized staphylococcal infection at the
  eyelid lash line in which bacteria seed a gland of Zeis or Moll and trigger
  neutrophilic suppuration around an eyelash follicle.
category: Infectious Disease
disease_term:
  preferred_term: hordeolum externum
  term:
    id: MONDO:0001642
    label: hordeolum externum
parents:
- eye infectious disorder
- skin disease caused by bacterial infection
- staphylococcal infection
synonyms:
- External hordeolum
- External stye
notes: >-
  Sterile systemic-drug-associated hordeolum or chalazion reports and
  meibomian-gland internal-hordeolum material are kept out of the bacterial
  mechanism; this entry focuses on acute staphylococcal infection of the Zeis
  and Moll glands at the lash line.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus commonly seeds lash-associated eyelid glands in
    acute external hordeolum.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The usual cause of an acute hordeolum is the Staphylococcus aureus
      bacterium
    explanation: >-
      Identifies S. aureus as the classic bacterial agent for acute hordeola,
      including external hordeola.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Local Lash-Line Eyelid Gland Inoculation
  description: >-
    Staphylococci from local periocular skin seed the sebaceous or apocrine
    gland openings that drain beside an eyelash follicle at the eyelid margin.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Localizes external hordeolum to infection of lash-associated Zeis or
      Moll glands rather than a systemic or vector-borne route.
progression:
- phase: Acute abscess formation
  notes: >-
    The lesion begins acutely as a red, painful, localized inflammation that
    forms an abscess at the eyelid margin.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is an acute, red, painful, and localized inflammation with abscess
      formation, usually caused by obstructed orifices of the sebaceous glands
      of the eyelid.
    explanation: >-
      Describes the acute abscess-forming phase of hordeolum.
- phase: Spontaneous drainage and resolution
  notes: >-
    Most episodes are self-limited and resolve within about a week as the
    abscess drains spontaneously.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The onset of hordeolum is usually self limited, and may resolve in about
      a week with spontaneous drainage of the abscess.
    explanation: >-
      Gives the usual self-limited course with spontaneous drainage.
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The majority of these lesions resolve spontaneously over time.
    explanation: >-
      States that most hordeola resolve spontaneously.
- phase: Recurrence
  notes: >-
    Recurrences are common; in patients with Demodex eyelash infestation,
    recurrent lesions appear sooner after incision and curettage of the
    primary lesion.
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the inflammation can spread to other ocular glands or tissues (i.e.,
      cellulitis), and recurrences are common.
    explanation: >-
      States that hordeolum recurrences are common.
  - reference: PMID:34725365
    reference_title: >-
      Clinical characteristics of Demodex-associated recurrent hordeola: an
      observational, comparative study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients with Demodex infestations were also more likely to develop
      recurrent lesions within a shorter period of time from the primary
      incision and curettage.
    explanation: >-
      Links Demodex infestation to earlier recurrence after surgical
      treatment.
- phase: Local spread and tissue necrosis
  notes: >-
    Rarely, an undrained or neglected lesion spreads into the eyelid soft
    tissue as preseptal cellulitis and can progress to eyelid necrosis or
    periorbital necrotizing fasciitis.
  evidence:
  - reference: PMID:34054469
    reference_title: "Upper Eyelid Necrosis Secondary to Hordeolum: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The present study describes a case of an untreated hordeolum that
      became a preseptal cellulitis with an abscess. Shortly, the abscess
      progressed to extensive eyelid necrosis.
    explanation: >-
      Documents the progression from untreated hordeolum to preseptal
      cellulitis and eyelid necrosis.
  - reference: PMID:41787906
    reference_title: >-
      Necrotizing fasciitis of the face triggered by a neglected hordeolum: a
      case report and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Furthermore, progression of a hordeolum to orbital cellulitis and
      subsequently to facial NF is exceedingly rare
    explanation: >-
      Indicates that progression to facial necrotizing fasciitis is
      exceedingly rare.
pathophysiology:
- name: Chronic Blepharitis and Meibomian Gland Dysfunction
  role: predisposing
  description: >-
    Chronic eyelid-margin inflammation, including blepharitis and meibomian
    gland dysfunction, is an underlying condition associated with hordeolum
    and raises the risk of developing one.
  biological_scale: TISSUE
  locations:
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  downstream:
  - target: Lash-Line Gland Orifice Obstruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic lid-margin disease predisposes to hordeolum; the cited sources
      report the association and the increased risk rather than the step by
      which it produces gland obstruction.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They can occur in association with underlying diseases causing
      Meibomian gland dysfunction and/or chronic blepharitis.
    explanation: >-
      Names meibomian gland dysfunction and chronic blepharitis as underlying
      diseases associated with hordeolum.
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Individuals with poor eyelid hygiene, inflammatory diseases of the
      eyelid (e.g. blepharitis, meibomitis, or rosacea), and stress, or who
      are experiencing hormonal changes are at greater risk of developing a
      hordeolum than the general population
    explanation: >-
      States that blepharitis, meibomitis and poor eyelid hygiene increase
      the risk of hordeolum.
- name: Demodex Eyelash Infestation
  role: predisposing
  description: >-
    Demodex mites colonizing the eyelash follicles are associated with
    recurrent hordeola, and in Demodex-positive patients recurrent lesions are
    most often external hordeola.
  biological_scale: TISSUE
  locations:
  - preferred_term: eyelash
    term:
      id: UBERON:0001702
      label: eyelash
  downstream:
  - target: Lash-Line Gland Orifice Obstruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Demodex infestation is associated with recurrent, predominantly
      external, hordeola; the mechanism linking the mites to the lash-line
      lesion has not been established.
  evidence:
  - reference: PMID:34725365
    reference_title: >-
      Clinical characteristics of Demodex-associated recurrent hordeola: an
      observational, comparative study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Demodex was detected in 91 (59.5%) and 17 (17.5%) patients in the
      recurrent hordeolum and control groups (p < 0.001), respectively.
    explanation: >-
      Demodex was detected far more often in patients with recurrent hordeola
      than in controls.
  - reference: PMID:34725365
    reference_title: >-
      Clinical characteristics of Demodex-associated recurrent hordeola: an
      observational, comparative study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common presentation of Demodex-associated recurrent lesions was
      external hordeola (67%) (p = 0.002).
    explanation: >-
      Ties the Demodex association specifically to the external form.

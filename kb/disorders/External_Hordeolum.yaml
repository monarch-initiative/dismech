name: External Hordeolum
creation_date: "2026-09-29T22:26:54Z"
description: >-
  External hordeolum is an acute localized staphylococcal infection at the
  eyelid lash line in which bacteria seed a gland of Zeis or Moll and trigger
  neutrophilic suppuration around an eyelash follicle.
category: Infectious Disease
disease_term:
  preferred_term: hordeolum externum
  term:
    id: MONDO:0001642
    label: hordeolum externum
parents:
- eye infectious disorder
- skin disease caused by bacterial infection
- staphylococcal infection
synonyms:
- External hordeolum
- External stye
notes: >-
  The Falcon deep-research request fell back to OpenScientist and all 31
  reported references resolved. The report's term validation flagged
  HP:0025421 and HP:0000198 as mislabeled, so they were not used. Sterile
  systemic-drug-associated hordeolum or chalazion reports and meibomian-gland
  internal-hordeolum material were kept out of the bacterial mechanism; this
  entry instead focuses on acute staphylococcal infection of the Zeis and Moll
  glands at the lash line. preflight-dr skipped automated gene identity checks
  because MONDO:0001642 records no causal gene; manual review confirmed the
  report covered hordeolum externum, external hordeolum, and external stye.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus commonly seeds lash-associated eyelid glands in
    acute external hordeolum.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The usual cause of an acute hordeolum is the Staphylococcus aureus
      bacterium
    explanation: >-
      Identifies S. aureus as the classic bacterial agent for acute hordeola,
      including external hordeola.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Local Lash-Line Eyelid Gland Inoculation
  description: >-
    Staphylococci from local periocular skin seed the sebaceous or apocrine
    gland openings that drain beside an eyelash follicle at the eyelid margin.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Localizes external hordeolum to infection of lash-associated Zeis or
      Moll glands rather than a systemic or vector-borne route.
pathophysiology:
- name: Lash-Associated Staphylococcal Gland Seeding
  role: trigger
  description: >-
    Bacteria enter lash-line sebaceous or apocrine gland ducts and seed the
    glands of Zeis or Moll adjacent to the eyelash follicle.
  biological_scale: TISSUE
  locations:
  - preferred_term: gland of Zeis
    term:
      id: UBERON:0018233
      label: gland of Zeis
  - preferred_term: gland of Moll
    term:
      id: UBERON:0013228
      label: sweat gland of eyelid
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  downstream:
  - target: Acute Suppurative Lash-Line Inflammation
    causal_link_type: DIRECT
    description: >-
      Staphylococcal growth within a lash-associated eyelid gland drives
      acute local suppurative inflammation.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Defines the external-hordeolum trigger site as the glands of Zeis or
      Moll associated with eyelash follicles.
- name: Acute Suppurative Lash-Line Inflammation
  description: >-
    The infected eyelid gland recruits neutrophils and forms a painful,
    localized abscess at the anterior eyelid margin.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: gland of Zeis
    term:
      id: UBERON:0018233
      label: gland of Zeis
  - preferred_term: gland of Moll
    term:
      id: UBERON:0013228
      label: sweat gland of eyelid
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  downstream:
  - target: Hordeolum Externum
    causal_link_type: DIRECT
    description: >-
      Lash-line suppuration produces the external stye centered at the eyelid
      margin.
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A hordeolum is a common inflammation of the eyelid margin. It presents
      as a red, painful, swollen furuncle with an acute onset, and is usually
      caused by a staphylococcal infection
    explanation: >-
      Frames hordeolum as an acute eyelid-margin furuncle caused by
      staphylococcal infection; the same review distinguishes external lesions
      as those affecting the glands of Zeis or Moll.
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is an acute, red, painful, and localized inflammation with abscess
      formation, usually caused by obstructed orifices of the sebaceous glands
      of the eyelid.
    explanation: >-
      Supports localized abscess formation as the tissue-level lesion in
      hordeolum.
phenotypes:
- name: Hordeolum Externum
  description: >-
    Acute infection of a gland of Zeis or Moll presents as a painful external
    stye at the eyelash-bearing eyelid margin.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hordeolum externum
    term:
      id: HP:0010607
      label: Hordeolum externum
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Defines the phenotype as external eyelid hordeolum centered on the
      lash-associated glands of Zeis or Moll.
diagnosis:
- name: Clinical eyelid examination
  description: >-
    Typical morphology, eyelid-margin pain and swelling, and an acute course
    usually establish the diagnosis clinically.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the typical morphological features and clinical course, the
      diagnosis can mostly be clinically established.
    explanation: >-
      Supports clinical examination and course as the main diagnostic approach
      for typical hordeolum or chalazion.
- name: Biopsy of persistent or atypical eyelid nodules
  description: >-
    Persistent, recurrent, or atypical lesions should be excised and examined
    histopathologically to exclude masquerading eyelid malignancy.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In persistent, recurrent or clinically atypical cases malignant tumors
      must be excluded as a differential diagnosis by excisional biopsy and
      histopathological assessment.
    explanation: >-
      Defines when biopsy is used: to rule out a malignant eyelid tumor rather
      than to diagnose routine acute hordeolum.
differential_diagnoses:
- name: Internal Hordeolum
  description: >-
    Internal hordeolum affects the tarsal-plate meibomian gland, whereas
    external hordeolum affects the glands of Zeis or Moll associated with
    eyelash follicles.
  distinguishing_features:
  - Internal lesions are meibomian-gland centered rather than lash-follicle associated.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Separates internal meibomian-gland disease from external Zeis or Moll
      gland infection.
- name: Chalazion
  description: >-
    Chalazion is a chronic meibomian-gland granuloma rather than an acute
    bacterial infection of the lash-line glands of Zeis or Moll.
  distinguishing_features:
  - Chronic induration without the acute painful purulence of a bacterial hordeolum.
  evidence:
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chalazion, a chronic meibomian gland granuloma, and hordeolum, an acute
      bacterial infection of eyelid glands, are among the most common
      ophthalmic conditions.
    explanation: >-
      Distinguishes chronic chalazion from acute bacterial hordeolum.
- name: Eyelid malignancy
  description: >-
    Persistent, recurrent, or morphologically atypical hordeolum-like nodules
    can represent malignant eyelid tumors and require excisional biopsy.
  distinguishing_features:
  - Persistence, recurrence, or atypical appearance should prompt histopathology.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In persistent, recurrent or clinically atypical cases malignant tumors
      must be excluded as a differential diagnosis by excisional biopsy and
      histopathological assessment.
    explanation: >-
      Supports malignancy as a differential diagnosis when a presumed
      hordeolum is recurrent, persistent, or atypical.
treatments:
- name: Warm compresses and lid hygiene
  description: >-
    Warm compresses and lid hygiene are used as conservative measures to
    promote drainage and clear the eyelid margin; formal randomized evidence
    remains limited for acute hordeolum treatment.
  target_mechanisms:
  - target: Acute Suppurative Lash-Line Inflammation
    treatment_effect: MODULATES
    description: >-
      Local heat and lid cleansing aim to soften obstructed secretions and help
      the lash-associated abscess drain.
  evidence:
  - reference: PMID:42367702
    reference_title: Local Injections of Fluorouracil for Eyelid Hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, treatment methods for hordeolum mainly include local warm
      compresses, local or systemic antibiotic therapy, and abscess incision
      and drainage.
    explanation: >-
      Lists warm compresses among current hordeolum treatment methods.
  - reference: PMID:40267992
    reference_title: >-
      Management Practice for Hordeolum and Chalazion: A Survey of the Korean
      Society of Ophthalmic Plastic and Reconstructive Surgery (KSOPRS)
      Members.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most (62 respondents, 77.6%) pursue nonsurgical treatment for 5 to 14
      days before considering incision and curettage.
    explanation: >-
      Captures surveyed specialist practice favoring a nonsurgical interval
      before incision and curettage for hordeolum.
- name: Local or systemic antibiotic therapy
  description: >-
    Antibiotics are used locally or systemically to suppress staphylococcal
    infection, with systemic therapy reserved for severe, nonlocal, or
    topical-treatment-resistant disease.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Lash-Associated Staphylococcal Gland Seeding
    treatment_effect: INHIBITS
    description: >-
      Antibiotic therapy reduces the S. aureus burden that initiates the focal
      Zeis or Moll gland infection.
  evidence:
  - reference: PMID:40267992
    reference_title: >-
      Management Practice for Hordeolum and Chalazion: A Survey of the Korean
      Society of Ophthalmic Plastic and Reconstructive Surgery (KSOPRS)
      Members.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For hordeolum, topical antibiotics are preferred by 59 respondents
      (73.8%), with 49 (83.7%) considering them effective.
    explanation: >-
      Records that surveyed oculoplastic specialists commonly use topical
      antibiotics for hordeolum.
  - reference: PMID:42367702
    reference_title: Local Injections of Fluorouracil for Eyelid Hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, treatment methods for hordeolum mainly include local warm
      compresses, local or systemic antibiotic therapy, and abscess incision
      and drainage.
    explanation: >-
      Lists local and systemic antibiotic therapy among current hordeolum
      treatment methods.
- name: Incision and drainage
  description: >-
    Incision and drainage evacuates a persistent or severe eyelid abscess when
    conservative and medical therapy are insufficient.
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Acute Suppurative Lash-Line Inflammation
    treatment_effect: INHIBITS
    description: >-
      Drainage decompresses the localized abscess produced by lash-line gland
      suppuration.
  evidence:
  - reference: PMID:42367702
    reference_title: Local Injections of Fluorouracil for Eyelid Hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, treatment methods for hordeolum mainly include local warm
      compresses, local or systemic antibiotic therapy, and abscess incision
      and drainage.
    explanation: >-
      Identifies abscess incision and drainage as a standard procedural option
      for hordeolum.
epidemiology:
- name: Japanese invasive hordeolum procedure distribution
  description: >-
    A 2014-2022 Japanese nationwide-claims study counted 638,699 invasive
    hordeolum procedures, corresponding to an annual average of 56.2 invasive
    hordeolum treatments per 100,000 person-years; these procedure rates
    capture surgically treated external and internal hordeola rather than total
    external hordeolum incidence.
  evidence:
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 1 104 078 procedures (ITC: 465 379; ITH: 638 699) were
      recorded over the 9-year study period.
    explanation: >-
      Quantifies invasive hordeolum procedures in Japan, which are useful for
      epidemiology of treated severe hordeola but not for true population
      incidence.
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ITH (K208): Incision of hordeolum (external or internal).
    explanation: >-
      Shows that the hordeolum procedure code pooled external and internal
      hordeola.

name: X-linked Mendelian Susceptibility to Mycobacterial Diseases due to CYBB Deficiency
creation_date: "2026-09-03T15:25:00Z"
category: Mendelian
synonyms:
- X-linked MSMD due to CYBB deficiency
- XR-MSMD-2
- immunodeficiency 34
- IMD34
- atypical mycobacteriosis, familial, X-linked 2
- CYBB X-linked Mendelian susceptibility to mycobacterial diseases
description: >
  This disorder is the cleanest natural demonstration in human immunology that the
  macrophage respiratory burst, specifically, is what protects against tuberculous
  mycobacteria. CYBB encodes gp91phox, the catalytic subunit of the phagocyte NADPH oxidase,
  and null alleles abolish the burst in every phagocyte lineage and cause X-linked chronic
  granulomatous disease. The two alleles that cause this disorder, Q231P and T178P, do
  something different: they leave the burst intact in blood neutrophils and monocytes and
  abolish it in monocyte-derived macrophages.

  The consequence is a phenotype narrower than CGD rather than milder than it. Affected
  males get BCG disease and tuberculous mycobacterial disease and nothing else - no
  staphylococcal disease, which is CGD's leading pathogen, even in affected adults of
  advanced age. The authors verified this negatively as well as positively: patient
  granulocytes killed Staphylococcus aureus normally, and neutrophil and monocyte superoxide
  and hydrogen peroxide output was normal across several independent assays including the
  ones that diagnose CGD.

  The mechanism is cell-type-restricted failure of NADPH oxidase *assembly*, not reduced
  expression of the subunit. That is why it is a distinct disease from CGD and not a
  hypomorphic point on the same axis, and it is the reason this entry exists separately from
  the CYBB subtype already curated on the chronic granulomatous disease entry. Curators
  should note that a CGD-directed diagnostic workup misses it by design: the
  dihydrorhodamine and nitroblue tetrazolium tests are run on neutrophils, where these
  patients are normal.

  One nosological point is worth stating because it is easy to miss. MSMD is defined as a
  set of inborn errors of interferon-gamma immunity, and the large majority of cases carry
  mutations in the IL-12/interferon-gamma signalling axis - 61 per cent of 830 reported
  patients have IL12RB1 or IFNGR1 defects. This disorder is not one of those. The lesion is
  at the effector end, in the oxidase the interferon-gamma-primed macrophage uses, which is
  why it sits inside MSMD as a mechanistic exception rather than as another signalling
  defect. It is also why interferon-gamma is a plausible therapy here despite the pathway
  being intact.

  Two limits on the evidence are worth carrying. All of it comes from two French kindreds,
  seven patients, one paper and its follow-up review. And the macrophage defect was measured
  in monocyte-derived macrophages differentiated in vitro, because tissue macrophages were
  not obtainable - the authors say so explicitly. The inference from the in vitro macrophage
  to the tissue macrophage that actually harbours the mycobacterium is the load-bearing step
  in the whole account, and it has not been tested directly.

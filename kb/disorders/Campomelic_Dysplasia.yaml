diagnosis:
- name: Clinical and Radiographic Diagnosis
  description: >-
    Campomelic dysplasia is usually diagnosed by the combination of characteristic
    clinical findings and skeletal radiographs, including distinctive facies,
    Pierre Robin sequence with cleft palate, shortening and bowing of long bones,
    clubfeet, and thoracic or airway involvement.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:20301724
    reference_title: "Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CD is usually based on clinical and radiographic findings.
    explanation: >-
      GeneReviews explicitly defines clinical and radiographic assessment as the
      usual diagnostic basis for campomelic dysplasia.
- name: Molecular Genetic Confirmation
  description: >-
    Molecular genetic testing can confirm campomelic dysplasia by identifying a
    heterozygous pathogenic SOX9 variant. Because disease can also result from
    chromosome 17q rearrangements affecting SOX9 regulation, testing strategy
    should consider structural or copy-number evaluation when sequence testing is
    unrevealing but the clinical/radiographic pattern is compelling.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301724
    reference_title: "Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a heterozygous pathogenic variant in SOX9 by molecular
      genetic testing can confirm the diagnosis if clinical and radiographic
      features are inconclusive.
    explanation: >-
      GeneReviews supports SOX9 molecular testing as confirmatory when clinical
      and radiographic findings are not definitive.
  - reference: PMID:36741086
    reference_title: "Case report: A de novo Non-sense SOX9 mutation (p.Q417*) located in transactivation domain is Responsible for Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants of SOX9 or rearrangement involving the
      long arm of chromosome 17 are the causes of disease.
    explanation: >-
      Supports molecular confirmation strategies that consider both SOX9
      sequence variants and chromosome 17 rearrangements.
- name: Karyotype Assessment in 46,XY Sex Reversal
  description: >-
    Chromosome analysis can clarify sex chromosome complement when external
    genitalia are ambiguous or female-appearing, because many affected
    individuals with a 46,XY karyotype have undermasculinization or sex reversal.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:17185244
    reference_title: "Novel SOX9 gene mutation in campomelic dysplasia with autosomal sex reversal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The karyotype was 46,XY despite female external genitalia. SOX9 gene
      analysis revealed frameshift mutation (at nucleotide position 1095G-->AT)
      in the open reading frame, resulting in a frameshift with 211 new amino
      acids.
    explanation: >-
      This case illustrates the combined role of karyotype assessment and SOX9
      analysis in campomelic dysplasia with sex reversal.
- name: Prenatal Genetic Testing in At-Risk Pregnancies
  description: >-
    Prenatal genetic testing can be offered for pregnancies at increased risk
    when the familial pathogenic variant is known, and fetal genomic testing can
    identify a pathogenic SOX9 variant in a fetus diagnosed with campomelic
    dysplasia.
  diagnosis_term:
    preferred_term: prenatal genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301724
    reference_title: "Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal testing for a pregnancy at increased risk is possible if the
      pathogenic variant in the family is known.
    explanation: >-
      GeneReviews supports variant-informed prenatal testing for at-risk
      pregnancies.
  - reference: PMID:36741086
    reference_title: "Case report: A de novo Non-sense SOX9 mutation (p.Q417*) located in transactivation domain is Responsible for Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected fetus was selected for whole-exome sequencing to identify the
      pathogenic mutations in this family.
    explanation: >-
      Supports prenatal molecular evaluation of an affected fetus when
      campomelic dysplasia is suspected.
treatments:
- name: Neonatal Respiratory Support
  description: >
    Early supportive respiratory management (including mechanical ventilation
    when needed) is critical in severe neonatal presentations.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  evidence:
  - reference: PMID:17185244
    reference_title: "Novel SOX9 gene mutation in campomelic dysplasia with autosomal sex reversal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory distress and cyanosis were noted at birth, and endotracheal
      intubation with mechanical ventilation was performed due to respiratory
      failure.
    explanation: >-
      This directly supports respiratory supportive care as a key acute
      management intervention in severe CD.

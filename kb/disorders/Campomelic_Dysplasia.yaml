  evidence:
  - reference: PMID:11754051
    reference_title: "Acampomelic campomelic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Campomelia (bowed limbs) is seen in most but not all patients, defining a so-called acampomelic campomelic dysostosis (ACD)."
    explanation: >-
      This directly supports bowed long bones as a characteristic phenotype.
      Author wording "most but not all patients" maps to the FREQUENT band
      (30-79%) under the default qualitative-term mapping in
      docs/frequency-evidence-guidelines.md; no quantitative figure in this
      source supports the >=80% floor required for VERY_FREQUENT.
  - reference: PMID:11754051
    reference_title: "Acampomelic campomelic syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Half of the CD cases with 17q rearrangements have no or mild campomelia.
    explanation: >-
      Bounds the frequency band from above: in the 17q-rearrangement subgroup
      half of cases lack or only mildly show campomelia, which is incompatible
      with a VERY_FREQUENT (80-99%) reading and is the strongest available
      evidence for keeping this at FREQUENT.

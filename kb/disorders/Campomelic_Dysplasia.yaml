name: Campomelic Dysplasia
synonyms:
- Campomelic dysplasia (CD), SOX9-related
creation_date: '2026-03-04T07:35:50Z'
category: Mendelian
description: >
  Campomelic dysplasia is a severe SOX9-related skeletal dysplasia with abnormal
  chondrogenesis, bowed long bones, axial skeletal dysplasia, frequent
  respiratory insufficiency, and sex reversal in many affected 46,XY
  individuals.
disease_term:
  preferred_term: campomelic dysplasia
  term:
    id: MONDO:0007251
    label: campomelic dysplasia
parents:
- Skeletal Dysplasia
inheritance:
- name: Autosomal Dominant
  description: >
    Campomelic dysplasia is associated with heterozygous pathogenic variation in
    SOX9, follows an autosomal dominant pattern, and is commonly caused by de
    novo variants.
  evidence:
  - reference: PMID:36741086
    reference_title: "Case report: A de novo Non-sense SOX9 mutation (p.Q417*) located in transactivation domain is Responsible for Campomelic Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Campomelic dysplasia (CD) is an autosomal dominant skeletal dysplasia
      syndrome characterized by shortness and bowing of lower extremities, and
      often accompanied by XY sex reversal.
    explanation: >-
      This abstract directly supports dominant inheritance and core clinical
      manifestations of campomelic dysplasia.
  - reference: PMID:17185244
    reference_title: "Novel SOX9 gene mutation in campomelic dysplasia with autosomal sex reversal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most CD cases have heterozygous de novo mutations in the coding region of
      the transcription factor gene SOX9
    explanation: >-
      This report supports de novo SOX9 variants as a frequent genetic origin of
      CD.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian skeletal dysplasia (ISDS bent-bone group). The 46,XY sex
      reversal and the respiratory insufficiency are prominent, but both are
      curated as mechanism and phenotype of the single SOX9 disorder rather
      than as additional Harrison's Parts.
  isds_skeletal_category:
  - classification_value: bent_bone_dysplasia
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group",
      entry NOS 20-0010, listed there as "Campomelic dysplasia (CD),
      SOX9-related" (AD, SOX9, MIM 114290). In the 2019 revision (Mortier et
      al., PMID:31633310) the same group was numbered 18 and the entry was
      listed as "Campomelic dysplasia (CD)"; this assignment was originally
      made from that table and has been re-verified against the 2023 one.

      Lumping: NOS 20-0010 explicitly folds acampomelic campomelic dysplasia
      (ACD), mild campomelic dysplasia (MIM 602196), so-called
      ischio-pubic-patellar dysplasia, and some cases of isolated Pierre-Robin
      sequence into this single entry. dismech follows that call — this entry
      covers the whole SOX9 campomelic spectrum, and ACD in particular is
      curated here as a phenotypic variant rather than as a separate entry.
prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.5
  rate_high: 0.9
  percentage: 0.05-0.09 per 10,000
  notes: >-
    Reported baseline incidence in the literature is 0.05-0.09 per 10,000 live
    births. A Norwegian single-center series observed a substantially higher
    local rate and suggested that campomelic dysplasia may be underdiagnosed.
  evidence:
  - reference: PMID:8482284
    reference_title: "Campomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Campomelic dysplasia (CD) is a rare skeletal dysplasia. The incidence, reported in the literature, is 0.05-0.09 per 10,000 live births."
    explanation: >-
      This case series provides an explicit literature-based incidence estimate
      for campomelic dysplasia. The source words it as an incidence per live
      births, which is recorded here as BIRTH_PREVALENCE (cases per live birth),
      the equivalent structured measure.
pathophysiology:
- name: SOX9-Mediated Chondrogenesis Disruption
  description: >
    Pathogenic SOX9 variation impairs transcriptional programs required for
    cartilage differentiation and skeletal patterning, resulting in dysplastic
    axial and appendicular skeletal development.
  genes:
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Cartilage Development
    term:
      id: GO:0051216
      label: cartilage development
  - preferred_term: Endochondral Ossification
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:39854231
    reference_title: "Variants in the SOX9 transactivation middle domain induce axial skeleton dysplasia and scoliosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SOX9 is a crucial transcriptional regulator of cartilage development and
      homeostasis. Dysregulation of SOX9 is associated with a wide spectrum of
      skeletal disorders, including campomelic dysplasia, acampomelic campomelic
      dysplasia, and scoliosis.
    explanation: >-
      Background statement (not primary clinical data, hence OTHER) placing
      campomelic dysplasia within the spectrum of disorders caused by
      dysregulated SOX9 control of cartilage development.
  downstream:
  - target: Bowing of the Long Bones
  - target: Bell-Shaped Thorax
  - target: 11 Pairs of Ribs
  - target: Hypoplastic Scapulae
  - target: Hip Dislocation
  - target: Clubfoot
  - target: Pierre-Robin Sequence
  - target: Cleft Palate
  - target: Micrognathia
  - target: Short Stature
  - target: Cervical Spine Instability
  - target: Scoliosis
  - target: Hearing Impairment
- name: SOX9 Dosage Insufficiency and Matrix Defects
  description: >
    Reduced SOX9 dosage impairs chondrogenesis and downstream cartilage matrix
    output. A CRISPR-engineered human iPSC model of a campomelic dysplasia SOX9
    splice-site mutation shows that SOX9-heterozygous chondrocytes have
    significant chondrogenic defects with altered BMP-SMAD signaling (noggin
    upregulation), and that raising SOX9 improves sulfated GAG accumulation and
    COL2A1 expression. A separate line of work on milder SOX9 transactivation
    middle (TAM) domain variants shows that reduced SOX9 protein stability is one
    route to lowered dosage; that work is drawn from a congenital vertebral
    malformation cohort with mild skeletal dysplasia and scoliosis rather than
    from campomelic dysplasia patients, so the stability route is reported here
    as a spectrum-level mechanism rather than an established CD-specific one.
  biological_processes:
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: Cartilage Development
    term:
      id: GO:0051216
      label: cartilage development
    modifier: DECREASED
  evidence:
  - reference: PMID:40025280
    reference_title: "SOX9 haploinsufficiency reveals SOX9-Noggin interaction in BMP-SMAD signaling pathway in chondrogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This hiPSCs-derived chondrocytes from heterozygotes (HT) and homozygotes
      (HM) SOX9 mutation carriers showed significant defects in chondrogenesis.
    explanation: >-
      Disease-specific evidence: a human iPSC model built on a reported
      campomelic dysplasia SOX9 splice-site mutation shows chondrogenic failure
      at the heterozygous dosage relevant to CD.
  - reference: PMID:40025280
    reference_title: "SOX9 haploinsufficiency reveals SOX9-Noggin interaction in BMP-SMAD signaling pathway in chondrogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of SOX9 showed promising results with improved sulfated
      glycosaminoglycans (GAGs) aggregation and COL2A1 expression following
      differentiation.
    explanation: >-
      Restoring SOX9 dosage rescues cartilage matrix output, supporting dosage
      insufficiency as the operative mechanism behind the matrix defect.
  - reference: PMID:39854231
    reference_title: "Variants in the SOX9 transactivation middle domain induce axial skeleton dysplasia and scoliosis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      both the human missense and the mouse microdeletion mutations resulted in
      reduced SOX9 protein stability in cell culture, while Sox9Asp272del mutant
      mice show decreased SOX9 expression in the growth plate and annulus
      fibrosus tissues of the spine.
    explanation: >-
      Supports reduced SOX9 protein stability as a route to lowered SOX9 dosage.
      Marked PARTIAL because the human variant studied was identified in a
      congenital vertebral malformation cohort and is described by the authors as
      causing mild skeletal dysplasia and scoliosis, not campomelic dysplasia;
      the mechanism is inferred to generalize across the SOX9 dosage spectrum.
  - reference: PMID:39854231
    reference_title: "Variants in the SOX9 transactivation middle domain induce axial skeleton dysplasia and scoliosis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We isolated a Sox9 mutant mouse with an in-frame microdeletion in the TAM
      domain (Sox9Asp272del), which exhibits skeletal dysplasia including kinked
      tails, rib cage anomalies, and scoliosis in homozygous mutants.
    explanation: >-
      Mouse model linking SOX9 dysfunction to axial skeletal dysplasia including
      rib cage anomalies and scoliosis. PARTIAL for the same reason: this is the
      milder TAM-domain allele series, not a campomelic dysplasia model.
  downstream:
  - target: Bell-Shaped Thorax
  - target: 11 Pairs of Ribs
  - target: Hypoplastic Scapulae
  - target: Cervical Spine Instability
  - target: Scoliosis

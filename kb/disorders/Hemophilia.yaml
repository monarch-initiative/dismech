name: Hemophilia
creation_date: '2026-08-20T00:00:00Z'
category: Genetic
description: >
  Hemophilia is the family of X-linked inherited coagulation factor deficiencies in
  which a pathogenic variant in F8 or F9 removes one of the two subunits of the
  intrinsic tenase complex. Factor VIIIa is the cofactor and factor IXa the protease
  of that single complex, so losing either one disables the same enzymatic step:
  factor X activation on the activated platelet surface, and with it the
  propagation-phase burst of thrombin that converts a fragile primary platelet plug
  into a durable fibrin clot. This is why hemophilia A and hemophilia B were regarded
  as one disease until Christmas disease was separated from it in 1952, and why they
  remain clinically indistinguishable at the bedside: the presenting picture in both
  is bleeding into joints and deep muscle, prolonged or delayed bleeding after injury
  and surgery, and a severity that tracks residual factor activity rather than which
  factor is missing.

  Three features hold across the family and are curated here rather than in each
  member entry. First, the shared lesion is a complex, not a protein — the mechanism
  chain is symmetric from either side. Second, severity is graded by residual
  activity on the same thresholds for both factors (severe under 1%, moderate 1-5%,
  mild 5-40%), so the family is stratified along an axis that is quantitative and
  factor-agnostic. Third, the dominant iatrogenic complication of both is the same in
  kind — a neutralizing alloantibody response to the infused replacement factor that
  makes replacement therapy fail — although it differs sharply in degree and
  character between the two factors, and that difference is one of the few places
  where hemophilia A and B genuinely diverge.

  This root entry deliberately carries only what holds for hemophilia as a family. The
  gene-specific molecular pathology, variant spectra, product-specific pharmacology,
  epidemiology and management are not re-derived here: hemophilia A is fully curated
  in `Hemophilia_A.yaml` and hemophilia B in `Hemophilia_B.yaml`, and both already
  declare `Coagulation Disorder` and `Bleeding Disorder` as parents. Hemophilia B
  Leyden has no entry of its own and is represented here as a subtype only.
disease_term:
  preferred_term: hemophilia
  term:
    id: MONDO:0018660
    label: hemophilia
synonyms:
- haemophilia
- congenital hemophilia
- inherited coagulation factor VIII or IX deficiency
parents:
- Bleeding Disorder
- Coagulation Disorder
has_subtypes:
- name: Hemophilia A
  display_name: Hemophilia A (Factor VIII Deficiency, Classic Hemophilia)
  classification: deficient coagulation factor
  description: >-
    Deficiency of the intrinsic tenase *cofactor*, factor VIII, from pathogenic
    variants in F8 at Xq28. The more common of the two, and the one for which
    inhibitor formation against replacement factor is a major and frequent
    complication. Fully curated in `Hemophilia_A.yaml`, which carries the severity
    strata, the F8 variant spectrum including the intron 22 inversion, and the
    FVIII-specific therapeutic landscape.
  subtype_term:
    preferred_term: hemophilia A
    term:
      id: MONDO:0010602
      label: hemophilia A
  genes:
  - preferred_term: F8
    term:
      id: hgnc:3546
      label: F8
- name: Hemophilia B
  display_name: Hemophilia B (Factor IX Deficiency, Christmas Disease)
  classification: deficient coagulation factor
  description: >-
    Deficiency of the intrinsic tenase *protease*, factor IX, from pathogenic
    variants in F9 at Xq27.1. Clinically indistinguishable from hemophilia A at
    equivalent residual activity, but distinguished by a much lower inhibitor
    incidence that carries a disproportionate risk of anaphylaxis and nephrotic
    syndrome. Fully curated in `Hemophilia_B.yaml`.
  subtype_term:
    preferred_term: hemophilia B
    term:
      id: MONDO:0010604
      label: hemophilia B
  genes:
  - preferred_term: F9
    term:
      id: hgnc:3551
      label: F9
- name: Hemophilia B Leyden
  display_name: Hemophilia B Leyden (Androgen-Responsive F9 Promoter Variant)
  classification: deficient coagulation factor
  description: >-
    A cis-regulatory form of hemophilia B in which the lesion lies in the F9
    promoter rather than the coding sequence, so the defect is one of transcription
    rather than of protein structure. Factor IX activity is severely reduced in
    childhood and then rises around puberty, leaving a phenotype that attenuates with
    age — the clearest demonstration in this family that the severity axis is a
    property of residual activity and not a fixed property of the genotype. Has no
    dismech entry of its own; represented here as a subtype only.
  subtype_term:
    preferred_term: hemophilia B leyden
    term:
      id: MONDO:0850054
      label: hemophilia B leyden
  genes:
  - preferred_term: F9
    term:
      id: hgnc:3551
      label: F9
  evidence:
  - reference: PMID:28168417
    reference_title: "First case report of hemophilia B Leyden in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia B Leyden is a unique subtype of hemophilia B, characterized by increasing factor IX activity (FIX:C) after puberty and a lower normal range of FIX:C throughout adulthood."
    explanation: >-
      Establishes Leyden as a distinct subtype of hemophilia B defined by an
      age-dependent rise in factor IX activity rather than by a fixed severity band.
  - reference: PMID:24138812
    reference_title: "Hemophilia B Leyden and once mysterious cis-regulatory mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations, which are clustered at discrete transcription factor binding sites, dynamically alter the developmental expression of F9 in different ways."
    explanation: >-
      Identifies the Leyden lesions as cis-regulatory promoter variants acting on F9
      transcription, which is what separates this subtype mechanistically from
      coding-sequence hemophilia B.
inheritance:
- name: X-linked recessive
  description: >-
    Both F8 (Xq28) and F9 (Xq27.1) are X-linked, so hemophilia manifests
    predominantly in hemizygous males. Heterozygous females are not uniformly
    unaffected: skewed X-inactivation can leave a carrier with factor activity in the
    symptomatic range, and carriers additionally face the reproductive risk of an
    affected son.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:34197690
    reference_title: "Hemophilic arthropathy: Current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia A and B are rare X-linked inherited bleeding disorders caused by complete or partial deficiency in or the absence of coagulation factors VIII and IX."
    explanation: >-
      States the shared X-linked inheritance and the two-factor scope of the family in
      a single sentence, which is the defining claim of this root entry.
  - reference: PMID:36800851
    reference_title: "Von Willebrand Disease, Hemophilia, and Other Inherited Bleeding Disorders in Pregnancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hemophilia carriers are unique in that they are at risk of giving birth to a severely affected male neonate"
    explanation: >-
      Supports the reproductive consequence of X-linked carriership that distinguishes
      hemophilia carriers from carriers of the autosomal bleeding disorders.
pathophysiology:
- name: Intrinsic Tenase Subunit Deficiency
  biological_scale: MOLECULAR
  description: >
    A pathogenic variant in F8 or in F9 reduces or abolishes functional factor VIII or
    factor IX. The two proteins are not redundant partners in separate pathways: they
    are the cofactor and the protease of one complex, so a lesion in either gene
    removes one subunit of the same enzyme. This is the point at which hemophilia A
    and hemophilia B are distinct diseases, and it is the last point at which they are
    distinct — everything downstream of this node is shared.
  biological_processes:
  - preferred_term: intrinsic pathway of blood coagulation
    term:
      id: GO:0007597
      label: blood coagulation, intrinsic pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:34197690
    reference_title: "Hemophilic arthropathy: Current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia A and B are rare X-linked inherited bleeding disorders caused by complete or partial deficiency in or the absence of coagulation factors VIII and IX."
    explanation: >-
      Establishes deficiency of either factor VIII or factor IX as the initiating
      lesion shared by both members of the family.
  downstream:
  - target: Intrinsic Tenase Complex Failure
    causal_link_type: DIRECT
    description: >-
      Loss of either subunit prevents assembly of a functional factor VIIIa-factor IXa
      complex on the activated platelet membrane.
- name: Intrinsic Tenase Complex Failure
  biological_scale: MOLECULAR
  description: >
    Without a functional factor VIIIa-factor IXa complex, factor X activation on the
    activated platelet surface proceeds at a small fraction of its normal rate. The
    node is reached symmetrically: hemophilia A removes the cofactor that accelerates
    the reaction, hemophilia B removes the protease that performs it. Because the
    initiation phase of coagulation is driven by tissue factor and is intact, the
    defect is specifically one of amplification rather than of starting a clot at all.
  biological_processes:
  - preferred_term: assembly of the factor VIIIa-factor IXa intrinsic tenase complex
    term:
      id: GO:0007597
      label: blood coagulation, intrinsic pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:19563500
    reference_title: "Thrombin generation and bleeding in haemophilia A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of factor VIIIa (as in hemophilia A), the intrinsic tenase complex (factor VIIIa-factor IXa) is unable to generate the additional factor Xa that is required for the burst (propagation) of thrombin generation through the prothrombinase complex (factor Va-factor Xa)"
    explanation: >-
      Names the complex and its two subunits explicitly, and gives the factor VIII arm
      of the symmetric mechanism this node asserts.
  - reference: PMID:32809627
    reference_title: "Hemophilia B."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Factor IX serves as a critical component of the intrinsic coagulation pathway, and its deficiency disrupts normal fibrin clot formation, predisposing affected individuals to prolonged or spontaneous bleeding."
    explanation: >-
      Gives the factor IX arm of the same mechanism, so the shared node is supported
      from both sides rather than generalized from hemophilia A alone.
  downstream:
  - target: Loss of the Propagation-Phase Thrombin Burst
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19563500
      reference_title: "Thrombin generation and bleeding in haemophilia A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the intrinsic tenase complex (factor VIIIa-factor IXa) is unable to generate the additional factor Xa that is required for the burst (propagation) of thrombin generation"
      explanation: >-
        Links failure of the tenase complex directly to loss of the propagation-phase
        thrombin burst.
- name: Loss of the Propagation-Phase Thrombin Burst
  biological_scale: MOLECULAR
  description: >
    Reduced factor Xa output starves the prothrombinase complex and abolishes the
    large, rapid second wave of thrombin generation that normally follows initiation.
    The consequence is a clot that forms but does not hold: too little thrombin to
    build a dense, mechanically stiff and lysis-resistant fibrin network, hence
    bleeding that is characteristically delayed or recurrent rather than immediate.
    That this step is shared, rather than inferred from one member, is shown by whole
    blood studies in which hemophilia A and hemophilia B behave alike.
  biological_processes:
  - preferred_term: propagation-phase thrombin generation by the prothrombinase complex
    term:
      id: GO:0072377
      label: blood coagulation, common pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:11806995
    reference_title: "Mechanism of factor VIIa-dependent coagulation in hemophilia blood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "pharmacologic concentrations of factor VIIa cannot restore normal thrombin generation in hemophilia A and hemophilia B blood in vitro."
    explanation: >-
      Treats hemophilia A and hemophilia B blood as one experimental group with the
      same thrombin-generation defect, which is the evidence that this node is shared
      rather than extrapolated.
  downstream:
  - target: Residual Factor Activity-Graded Hemostatic Reserve
    causal_link_type: DIRECT
    description: >-
      How much thrombin can still be generated is set by how much functional factor
      remains, which is what makes severity a continuous quantity.
  - target: Hemarthrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure to stabilize hemostasis in the synovial vasculature under joint loading
    evidence:
    - reference: PMID:27890816
      reference_title: "Pathophysiology of hemophilic arthropathy and potential targets for therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Spontaneous bleeding shows a predilection for joints, and repeated hemarthroses lead to a disabling condition called hemophilic arthropathy."
      explanation: >-
        Identifies the joint as the preferential site of the bleeding that follows the
        hemostatic defect, stated for hemophilia as a whole.
  - target: Intramuscular Hematoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - unchecked bleeding into deep muscle compartments after minor or unrecognized trauma
  - target: Persistent Bleeding After Trauma
    causal_link_type: DIRECT
- name: Residual Factor Activity-Graded Hemostatic Reserve
  biological_scale: ORGANISM
  description: >
    Hemophilia is graded, not binary. The same activity thresholds are applied to
    factor VIII and to factor IX — under 1% severe, 1-5% moderate, 5-40% mild — and
    they predict phenotype well enough to be the basis of classification and of
    treatment decisions in both members. This is what makes severity a family-level
    axis rather than a per-gene one, and it is the reason non-factor therapies and
    gene therapy are evaluated against a target activity level rather than against
    restoration of the specific missing protein. Hemophilia B Leyden is the instructive
    exception that proves the rule: the same patient moves up the severity scale with
    age as promoter activity rises.
  evidence:
  - reference: PMID:30129541
    reference_title: "Consensus Statement of the Indian Academy of Pediatrics in Diagnosis and Management of Hemophilia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specific factor assays confirm diagnosis and classify hemophilia according to residual factor activity (mild 5-40%, moderate 1-5%, severe <1%)."
    explanation: >-
      States the severity classification in terms of residual factor activity for
      hemophilia generically, giving the thresholds that apply to both members.
  - reference: PMID:32809627
    reference_title: "Hemophilia B."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The severity of bleeding correlates closely with residual factor IX activity, making accurate laboratory assessment essential for disease classification, treatment planning, and long-term risk stratification."
    explanation: >-
      Confirms that the activity-severity relationship, and the use of activity for
      classification, holds on the factor IX side as well as the factor VIII side.
  downstream:
  - target: Persistent Bleeding After Trauma
    causal_link_type: DIRECT
    description: >-
      Reserve sufficient to survive daily life but not surgery or major trauma is the
      mild end of the axis; absent reserve is the severe end, with spontaneous bleeding.
- name: Alloimmune Inhibitor Response to Replacement Factor
  biological_scale: ORGANISM
  description: >
    Infused factor concentrate is a foreign protein to a patient whose own gene makes
    little or none of it, and in a substantial minority it provokes neutralizing IgG
    that inactivates the infused factor. This is the shared iatrogenic complication of
    the family and the principal reason replacement therapy fails, but it is also the
    sharpest point of divergence between the two members: inhibitors arise in roughly
    a third of severe hemophilia A, and in only a small percentage of hemophilia B,
    where they instead carry a characteristic risk of anaphylaxis and of nephrotic
    syndrome during immune tolerance induction. The asymmetry is why this node is
    curated at the root as a shared *kind* of complication while its frequency and
    management remain member-specific.
  biological_processes:
  - preferred_term: neutralizing anti-factor IgG alloantibody response
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
  evidence:
  - reference: PMID:29482894
    reference_title: "Review of immune tolerance induction in hemophilia A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most important complication in the treatment of hemophilia A is the development of neutralizing antibodies (inhibitors) against exogenous administered factor VIII (FVIII), which occurs in approximately 30% of all patients with severe hemophilia A"
    explanation: >-
      Establishes the alloimmune inhibitor response, and its frequency, on the
      hemophilia A side of the family.
  - reference: PMID:25851415
    reference_title: "Hemophilia B: molecular pathogenesis and mutation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these individuals are also at risk of anaphylaxis, and nephrotic syndrome if they receive immune tolerance induction"
    explanation: >-
      Gives the hemophilia B side, where the inhibitor complication is rarer but
      carries anaphylaxis and nephrotic syndrome as distinctive hazards.
  downstream:
  - target: Refractoriness to Factor Replacement
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29482894
      reference_title: "Review of immune tolerance induction in hemophilia A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This antibody response renders FVIII replacement therapy ineffective, thereby increasing the risk for uncontrollable bleeding and morbidity, decreasing quality of life and increasing healthcare costs."
      explanation: >-
        Links the neutralizing antibody response directly to loss of efficacy of
        replacement therapy and to worse bleeding outcomes.
- name: Refractoriness to Factor Replacement
  biological_scale: ORGANISM
  description: >-
    Once a high-titer inhibitor is present, infused factor is neutralized before it can
    participate in tenase assembly, so the patient reverts to the untreated hemostatic
    phenotype despite treatment. Management shifts to bypassing agents, immune
    tolerance induction, or non-factor prophylaxis that does not present the missing
    factor to the immune system at all.
  evidence:
  - reference: PMID:29482894
    reference_title: "Review of immune tolerance induction in hemophilia A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This antibody response renders FVIII replacement therapy ineffective, thereby increasing the risk for uncontrollable bleeding and morbidity, decreasing quality of life and increasing healthcare costs."
    explanation: >-
      Describes the refractory state that follows inhibitor development and its
      clinical consequences.
  downstream:
  - target: Residual Factor Activity-Graded Hemostatic Reserve
    causal_link_type: DIRECT
    description: >-
      Neutralization of the infused factor returns effective circulating activity to
      the patient's untreated baseline, so an inhibitor moves the patient back down
      the same severity axis that replacement therapy moves them up. This is why the
      inhibitor arm is not a separate disease process but a reversible re-entry into
      the shared one.
    evidence:
    - reference: PMID:29482894
      reference_title: "Review of immune tolerance induction in hemophilia A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This antibody response renders FVIII replacement therapy ineffective, thereby increasing the risk for uncontrollable bleeding and morbidity"
      explanation: >-
        Loss of efficacy of replacement therapy, with a consequent rise in bleeding
        risk, is the return to the untreated hemostatic reserve this edge asserts.
phenotypes:
- name: Hemarthrosis
  category: Musculoskeletal
  diagnostic: true
  description: >-
    Bleeding into the synovial joint space, the single most characteristic
    manifestation of severe hemophilia of either type, and the driver of the
    progressive hemophilic arthropathy that dominates long-term morbidity.
  phenotype_term:
    preferred_term: Joint hemorrhage
    term:
      id: HP:0005261
      label: Joint hemorrhage
  evidence:
  - reference: PMID:34197690
    reference_title: "Hemophilic arthropathy: Current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent joint bleeding (hemarthrosis) is the most frequent clinical manifestation of severe hemophilia."
    explanation: >-
      Stated for severe hemophilia as a whole rather than for one member, which is what
      makes it a root-level phenotype.
- name: Intramuscular Hematoma
  category: Musculoskeletal
  description: >-
    Deep bleeding into muscle compartments, classically iliopsoas, quadriceps and calf,
    which can compress nerves or produce compartment syndrome. Together with joint
    bleeding it defines the deep-tissue bleeding pattern that distinguishes a
    coagulation-factor defect from a platelet or vessel-wall defect.
  phenotype_term:
    preferred_term: Intramuscular hematoma
    term:
      id: HP:0012233
      label: Intramuscular hematoma
  evidence:
  - reference: PMID:20301578
    reference_title: "Hemophilia A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "individuals may average up to two to five spontaneous bleeding episodes each month including spontaneous joint bleeds or deep-muscle hematomas"
    explanation: >-
      GeneReviews documents deep-muscle hematoma alongside joint bleeding as the
      characteristic spontaneous bleeding pattern of severe disease.
- name: Persistent Bleeding After Trauma
  category: Hematologic
  description: >-
    Prolonged, delayed or recurrent bleeding after injury, tooth extraction or surgery.
    Because the initiation phase of coagulation is intact and only propagation fails,
    bleeding characteristically stops and then restarts rather than failing to stop at
    all, which is why mild disease can go unrecognized until a surgical challenge.
  phenotype_term:
    preferred_term: Persistent bleeding after trauma
    term:
      id: HP:0001934
      label: Persistent bleeding after trauma
  evidence:
  - reference: PMID:27890816
    reference_title: "Pathophysiology of hemophilic arthropathy and potential targets for therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia is a congenital clotting factor deficiency characterized by spontaneous and trauma-related bleeding."
    explanation: >-
      Characterizes hemophilia generically by spontaneous and trauma-related bleeding.
  - reference: PMID:20301578
    reference_title: "Hemophilia A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "prolonged bleeding after injuries, tooth extractions, or surgery, and delayed or recurrent bleeding prior to complete wound healing"
    explanation: >-
      Describes the delayed and recurrent character of the bleeding, which is the
      clinical signature of a propagation-phase rather than an initiation-phase defect.

treatments:
- name: Prophylactic Clotting Factor Replacement
  description: >-
    Scheduled infusion of the deficient factor to hold trough activity above the
    spontaneous-bleeding threshold, rather than treating bleeds as they occur. This is
    the shared standard of care across the family: the same recommendation, from the
    same guideline, is issued for severe and moderately severe disease of both types,
    which is a direct consequence of severity being defined by residual activity.
  treatment_term:
    preferred_term: Protein Replacement Therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Residual Factor Activity-Graded Hemostatic Reserve
    treatment_effect: RESTORES
    description: >-
      Replacement raises circulating factor activity, moving the patient up the same
      severity axis that defines the family.
  evidence:
  - reference: PMID:39043543
    reference_title: "International Society on Thrombosis and Haemostasis clinical practice guideline for treatment of congenital hemophilia A and B based on the Grading of Recommendations Assessment, Development, and Evaluation methodology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strong recommendations were issued for prophylactic over episodic treatment for severe and moderately severe hemophilia A and B."
    explanation: >-
      A single GRADE-based guideline issues the same strong prophylaxis recommendation
      for both members, which is why this treatment belongs at the family level.
- name: Gene Therapy
  description: >-
    A single infusion of an AAV vector directing hepatocyte expression of the missing
    factor, developed in parallel for both members of the family and evaluated in both
    against achieved factor activity. Product-specific detail belongs to the member
    entries.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: Intrinsic Tenase Subunit Deficiency
    treatment_effect: RESTORES
    description: >-
      Supplies a functional transgene copy so the deficient subunit is synthesized
      endogenously, addressing the initiating lesion rather than its consequences.
  evidence:
  - reference: PMID:36103998
    reference_title: "Adeno-Associated Virus Gene Therapy for Hemophilia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For almost three decades, hemophilia A (HA) and hemophilia B (HB) have served as model disorders for the development of gene therapy."
    explanation: >-
      Confirms that gene therapy has been developed for both members in parallel, which
      is what makes it a family-level rather than a member-specific treatment.
- name: Hemostatic Rebalancing Prophylaxis
  description: >
    Subcutaneous prophylaxis that restores thrombin generation by lowering a natural
    anticoagulant rather than by supplying the missing factor: fitusiran, a small
    interfering RNA that knocks down antithrombin, and concizumab and marstacimab,
    monoclonal antibodies against tissue factor pathway inhibitor.

    This class belongs at the root rather than on either member, and the reason is the
    same lumping logic that justifies this entry. Emicizumab is correctly curated on
    `Hemophilia_A.yaml` because it is a bispecific FVIIIa *mimetic* — it substitutes for
    the missing cofactor and therefore cannot help a patient missing the protease
    instead. Rebalancing agents act downstream of the intrinsic tenase step entirely,
    on the anticoagulant side of the hemostatic balance, so they are indifferent to
    which subunit is absent. Their pivotal trials enrolled hemophilia A and hemophilia
    B together, and separately enrolled patients with and without inhibitors, which is
    an experimental design only a genuinely factor-agnostic mechanism permits.

    Because they do not present the deficient factor to the immune system, they also
    remain effective once an inhibitor has made replacement therapy fail — which is
    what gives this entry's `Refractoriness to Factor Replacement` node a therapy at
    all. The class is not free of risk: rebalancing narrows the margin in the
    prothrombotic direction, and thromboembolic events have been reported in both
    programmes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fitusiran
      term:
        id: NCIT:C169984
        label: Fitusiran
    - preferred_term: concizumab
      term:
        id: NCIT:C166914
        label: Concizumab
    - preferred_term: marstacimab
      term:
        id: NCIT:C166436
        label: Marstacimab
  therapeutic_modality: SIRNA
  target_mechanisms:
  - target: Loss of the Propagation-Phase Thrombin Burst
    treatment_effect: RESTORES
    description: >-
      Lowering antithrombin or TFPI shifts the procoagulant-anticoagulant balance so
      that the thrombin generated by an intact extrinsic route is no longer quenched,
      recovering hemostatic thrombin output without repairing the tenase complex.
    evidence:
    - reference: PMID:40584300
      reference_title: "Marstacimab for the Treatment of Hemophilia A or B."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Marstacimab restores thrombin generation via the extrinsic pathway, bypassing intrinsic pathway deficiencies and offering prophylactic benefit independent of inhibitor status."
      explanation: >-
        States exactly the mechanism this edge asserts, and states that it operates by
        bypassing rather than repairing the intrinsic defect.
  - target: Refractoriness to Factor Replacement
    treatment_effect: BYPASSES
    description: >-
      Because no exogenous factor VIII or factor IX is administered, a neutralizing
      inhibitor has nothing to neutralize, so hemostatic benefit survives the state
      that abolishes the benefit of replacement therapy.
    evidence:
    - reference: PMID:37003287
      reference_title: "Efficacy and safety of fitusiran prophylaxis in people with haemophilia A or haemophilia B with inhibitors (ATLAS-INH): a multicentre, open-label, randomised phase 3 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subcutaneous fitusiran prophylaxis resulted in statistically significant reductions in annualised bleeding rate in participants with haemophilia A or haemophilia B with inhibitors, with two-thirds of participants having zero bleeds."
      explanation: >-
        Demonstrates efficacy specifically in the inhibitor population, i.e. in exactly
        the patients for whom factor replacement has been rendered ineffective.
  evidence:
  - reference: PMID:37003287
    reference_title: "Efficacy and safety of fitusiran prophylaxis in people with haemophilia A or haemophilia B with inhibitors (ATLAS-INH): a multicentre, open-label, randomised phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fitusiran, a subcutaneous investigational small interfering RNA therapeutic, targets antithrombin to rebalance haemostasis in people with haemophilia A or haemophilia B, irrespective of inhibitor status."
    explanation: >-
      Names the modality, the molecular target, and the rebalancing mechanism, and
      states the factor-agnostic and inhibitor-agnostic scope that makes this a
      family-level rather than a member-level therapy.
  - reference: PMID:37003278
    reference_title: "Fitusiran prophylaxis in people with severe haemophilia A or haemophilia B without inhibitors (ATLAS-A/B): a multicentre, open-label, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fitusiran prophylaxis shows haemostatic efficacy in both haemophilia A and haemophilia B, and therefore has the potential to be transformative in the management of all people with haemophilia."
    explanation: >-
      The companion trial in the non-inhibitor population, establishing that efficacy
      spans both members independently of inhibitor status rather than only in the
      inhibitor setting.
  - reference: PMID:37646676
    reference_title: "Phase 3 Trial of Concizumab in Hemophilia with Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concizumab is an anti-tissue factor pathway inhibitor monoclonal antibody designed to achieve hemostasis in all hemophilia types, with subcutaneous administration."
    explanation: >-
      Establishes the second molecular route into the same class, and its explicit
      design intent of working across all hemophilia types.
  - reference: PMID:37646676
    reference_title: "Phase 3 Trial of Concizumab in Hemophilia with Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with hemophilia A or B with inhibitors, the annualized bleeding rate was lower with concizumab prophylaxis than with no prophylaxis."
    explanation: >-
      The explorer7 primary result, in a population spanning both members with
      inhibitors.
  notes: >-
    `therapeutic_modality` is single-valued and is set to SIRNA for the fitusiran arm;
    concizumab and marstacimab are MONOCLONAL_ANTIBODY. They are curated as one
    treatment because the mechanistic claim this root makes is about the shared
    rebalancing strategy rather than about either molecule, and splitting them would
    duplicate the family-level rationale twice. Split into two treatments if a curator
    later needs modality-precise querying. No `aso_details` block is present because
    fitusiran is an siRNA, not an antisense oligonucleotide.

discussions:
- discussion_id: hemophilia_root_scope_fxi_and_acquired
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should factor XI deficiency and acquired hemophilia be curated as members of this
    root, given that MONDO places both beneath MONDO:0018660?
  attaches_to:
  - pathophysiology#Intrinsic Tenase Subunit Deficiency
  rationale: >
    MONDO's is_a descendants of MONDO:0018660 include congenital factor XI deficiency
    (MONDO:0012897 / MONDO:0020587, historically "hemophilia C") and acquired
    hemophilia (MONDO:0019139, with its A and B forms), but the MONDO textual
    definition of the same term restricts it to disease "due to factor VIII or IX
    deficiency". The ontology's hierarchy and its own definition therefore disagree,
    and this entry follows the definition.

    The exclusions are mechanistically motivated rather than merely conventional.
    Factor XI is upstream of the intrinsic tenase complex, not part of it, so factor XI
    deficiency does not instantiate this root's central mechanism node; it is
    autosomal rather than X-linked, so it fails the inheritance claim; and its bleeding
    phenotype is notoriously poorly correlated with factor level, so it fails the
    severity-by-residual-activity axis that is the second thing this root asserts.
    Acquired hemophilia fails a different test: its mechanism downstream of factor
    neutralization is genuinely this root's mechanism, but it is an autoantibody
    disease of adults with no germline lesion, so it is not an inherited coagulation
    factor deficiency at all. Notably, acquired hemophilia is closer to the
    "Alloimmune Inhibitor Response to Replacement Factor" node of this entry than to
    its trigger node.

    Recording rather than silently resolving this, because a future curator adding
    either entity will find MONDO asserting a parentage this entry declines.
  notes: >-
    If acquired hemophilia is curated later, the natural attachment is a shared
    mechanism module over factor-neutralization-mediated tenase failure, not
    membership in this root.
- discussion_id: hemophilia_b_leyden_mondo_placement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    MONDO:0850054 (hemophilia B leyden) is not a descendant of hemophilia B or of
    hemophilia — should the ontology placement be reported upstream?
  attaches_to:
  - pathophysiology#Residual Factor Activity-Graded Hemostatic Reserve
  rationale: >
    MONDO:0850054 is asserted only as is_a MONDO:0002243 (hemorrhagic disease), so it
    sits outside the MONDO:0018660 subtree entirely, even though Orphanet classifies
    ORPHA:617930 as a subtype of a disorder and every clinical source treats Leyden as
    a form of hemophilia B. This entry curates it as a subtype on the strength of the
    clinical literature and flags the ontology gap rather than working around it by
    choosing a different term.

    The same subtree is missing the two symptomatic-female-carrier terms in a different
    way: MONDO:0015787 and MONDO:0015788 are descendants of MONDO:0018660, but dismech
    has no entry for either, and this root treats symptomatic carriership as part of
    the inheritance claim rather than as a subtype.
  notes: >-
    Candidate upstream report to MONDO: add is_a MONDO:0010604 (hemophilia B) to
    MONDO:0850054.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemophilia A and B are rare X-linked inherited bleeding disorders caused by complete or partial deficiency in or the absence of coagulation factors VIII and IX."
    explanation: >-

animal_models:
- name: Fbn1 conditional knockout in non-pigmented ciliary epithelium (Jones et al.)
  species: Mouse
  genotype: Fbn1 conditional deletion targeted to the non-pigmented ciliary epithelium
  publication: PMID:30642872
  description: >-
    Fbn1 was deleted from either the lens or the non-pigmented ciliary
    epithelium. Only the ciliary-epithelium deletion affected the zonule: its
    fibres were thinner and weaker, ruptured by 3 months, and the mice developed
    ectopia lentis, later followed by cataract and enlarged eyes.
  modeled_mechanisms:
  - target: Defective Fibrillin-1 Microfibrils of the Ciliary Zonule
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the zonular lesion and the resulting lens dislocation by
      removing fibrillin-1 from the cells that make the zonule.
    limitations: >-
      The model removes fibrillin-1 rather than carrying a heterozygous
      cysteine-missense or in-frame splice allele, so it shows that zonular
      fibrillin-1 is required, not how the dominant human alleles act. The
      deletion is confined to the eye by design, so it cannot address why the
      human alleles spare the aorta.
    evidence:
    - reference: PMID:30642872
      reference_title: "Targeted deletion of fibrillin-1 in the mouse eye results in ectopia lentis and other ocular phenotypes associated with Marfan syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By 3 months, zonular fibers invariably ruptured and mice developed ectopia lentis, a hallmark of Marfan syndrome."
      explanation: >-
        Zonular rupture and ectopia lentis follow fibrillin-1 loss from the
        non-pigmented ciliary epithelium.
diagnosis:
- name: Ophthalmic examination
  description: >-
    Slit-lamp examination with full mydriasis establishes lens position and the
    direction of displacement, together with refraction, axial length,
    intraocular pressure, gonioscopy and fundus examination for the secondary
    complications.
  presence: Ectopia lentis
  diagnosis_term:
    preferred_term: slit-lamp examination
    term:
      id: NCIT:C75583
      label: Slit-lamp Examination
  evidence:
  - reference: PMID:22950452
    reference_title: "Ophthalmic findings in a family with early-onset isolated ectopia lentis and the p.Arg62Cys mutation of the fibrillin-1 gene (FBN1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detailed ocular examinations included visual acuity, anterior chamber depth, pupil size, lens location, optometry, central corneal thickness, keratometry, slitlamp examination, fundus examination, axial length, ocular B-ultrasound, gonioscope checking, ultrasound biomicroscopy (UBM) and intraocular pressure (IOP; Goldmann applanation tonometer)."
    explanation: >-
      The ophthalmic work-up used to characterize a family with isolated
      ectopia lentis.
- name: Cardiovascular and skeletal assessment to exclude Marfan syndrome
  description: >-
    The diagnosis requires that the revised Ghent criteria for Marfan syndrome
    are not met, so echocardiography of the aortic root and a systemic
    (skeletal) examination are part of the work-up.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:25900864
    reference_title: "Early onset ectopia lentis due to a FBN1 mutation with non-penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His echocardiogram was normal and he did not meet the revised Ghent criteria for Marfan syndrome."
    explanation: >-
      A normal echocardiogram and failure to meet the Ghent criteria are what
      separate the isolated diagnosis from Marfan syndrome.
  - reference: PMID:22736615
    reference_title: "A genotype-phenotype comparison of ADAMTSL4 and FBN1 in isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography and skeletal examination revealed no sign of systemic disorders associated with EL, in particular Marfan syndrome (MFS)."
    explanation: >-
      Echocardiography and skeletal examination used to establish that ectopia
      lentis is isolated.
- name: Molecular genetic testing
  description: >-
    Panel or exome sequencing identifies the FBN1 variant and distinguishes the
    dominant FBN1 form from recessive ADAMTSL4-related ectopia lentis and from
    the LTBP2, ADAMTS and CBS disorders. Whether the variant has been reported
    with aortic dilation or dissection then decides between ectopia lentis
    syndrome and Marfan syndrome under the revised Ghent nosology.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34818515
    reference_title: "Combination of Panel-based Next-Generation Sequencing and Clinical Findings in Congenital Ectopia Lentis Diagnosed in Chinese Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within this group of patients harboring FBN1 mutations, 16.44% (19 of 141) probands were diagnosed with EL syndrome and 2.13% (3 of 141) were diagnosed with Marfan syndrome."
    explanation: >-
      Panel sequencing combined with clinical findings assigns FBN1 carriers to
      ectopia lentis syndrome or Marfan syndrome.
  - reference: PMID:37107549
    reference_title: "The Role of Genetic Testing in Children Requiring Surgery for Ectopia Lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, in this retrospective cohort study, panel-based genetic testing pointed to a molecular diagnosis in >90% of paediatric ectopia lentis cases requiring surgery."
    explanation: >-
      Panel testing gives a high molecular diagnostic yield in paediatric
      ectopia lentis.
  - reference: PMID:20564469
    reference_title: "Role of ADAMTSL4 mutations in FBN1 mutation-negative ectopia lentis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of a causative mutation in ADAMTSL4 may allow the exclusion of Marfan syndrome in these families and guide the clinical management, of particular relevance in young children affected by EL."
    explanation: >-
      Genotype separates the recessive ADAMTSL4 form, which excludes Marfan
      syndrome, from FBN1-related ectopia lentis.
treatments:
- name: Pars plana vitreolensectomy with secondary intraocular lens
  description: >-
    Removal of the dislocated lens by pars plana vitreolensectomy, followed by
    optical rehabilitation of the aphakic eye. In one FBN1 pedigree, secondary
    iris-claw intraocular lenses gave better visual outcomes than aphakic contact
    lenses.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: vitrectomy
    term:
      id: NCIT:C50837
      label: Vitrectomy
  target_mechanisms:
  - target: Ectopia lentis
    treatment_effect: INHIBITS
    description: >-
      Removing the displaced lens eliminates the source of lenticular refractive
      error and of lens-induced pupillary block.
  evidence:
  - reference: PMID:32685406
    reference_title: "Surgical management of non-syndromic ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight affected individuals had pars plana vitreolensectomy for bilateral ectopia lentis (EL)."
    explanation: >-
      Vitreolensectomy as the surgical treatment of FBN1-related non-syndromic
      ectopia lentis.
  - reference: PMID:32685406
    reference_title: "Surgical management of non-syndromic ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort, refractive management with iris-claw IOLs provided superior outcomes to contact lenses and the authors recommend this as the optimal refractive correction in EL patients."
    explanation: >-
      Supports secondary iris-claw intraocular lens implantation after lens
      removal; the comparison involved eight patients from one pedigree.
- name: Echocardiographic aortic surveillance
  description: >-
    Because a substantial share of FBN1 variants reported in isolated ectopia
    lentis have also been seen with aortic dilation or dissection, and the
    phenotype forms a clinical continuum with Marfan syndrome, affected
    individuals warrant follow-up echocardiographic imaging of the aortic root
    rather than discharge after the eye is treated. No surveillance interval
    specific to this disorder has been published.
  treatment_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:24635535
    reference_title: "The revised ghent nosology; reclassifying isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, 57/123 probands (46.3%) are now classified as MFS according to the revised Ghent nosology and 37/96 mutations (38.5%) reported to cause isolated EL have also been found in patients with aortic dilation/dissection."
    explanation: >-
      Over a third of variants reported in isolated ectopia lentis also occur
      with aortic disease, the basis for cardiovascular follow-up.
  - reference: PMID:19353630
    reference_title: "Pathogenic FBN1 mutations in 146 adults not meeting clinical diagnostic criteria for Marfan syndrome: further delineation of type 1 fibrillinopathies and focus on patients with an isolated major criterion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of recurrent mutations and affected family members of propositi with only one major clinical criterion argue for a clinical continuum between such phenotypes and classical MFS."
    explanation: >-
      A clinical continuum with Marfan syndrome in relatives and recurrent
      variants supports continued systemic surveillance.
differential_diagnoses:
- name: Marfan syndrome
  description: >-
    The same gene and the same ocular lesion. Under the revised Ghent nosology an
    FBN1 carrier with ectopia lentis is diagnosed with Marfan syndrome once aortic
    root dilation or dissection is present, or once the variant has been reported
    with aortic disease; the isolated diagnosis applies only on the ectopia lentis
    syndrome side of that line.
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  distinguishing_features:
  - Aortic root dilation or dissection, the second cardinal Ghent feature
  - An FBN1 variant previously reported with aortic dilation or dissection
  - A systemic score reaching the Ghent threshold
  evidence:
  - reference: PMID:20591885
    reference_title: "The revised Ghent nosology for the Marfan syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "aortic root aneurysm and ectopia lentis are the cardinal clinical features"
    explanation: >-
      Ectopia lentis is one of the two cardinal Marfan features, so the aortic
      root decides between the two diagnoses.
  - reference: PMID:24635535
    reference_title: "The revised ghent nosology; reclassifying isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, patients with EL and a FBN1 mutation are now categorically diagnosed with MFS, if their mutation has previously been described with aortic dilation/dissection."
    explanation: >-
      The variant-history rule that moves an FBN1 ectopia lentis patient into
      Marfan syndrome.
- name: Ectopia lentis 2, isolated, autosomal recessive (ADAMTSL4)
  description: >-
    The main non-FBN1 cause of isolated ectopia lentis, recessive and caused by
    biallelic ADAMTSL4 variants. It presents earlier and with longer axial length
    than the FBN1 form, and its diagnosis excludes Marfan syndrome.
  disease_term:
    preferred_term: ectopia lentis 2, isolated, autosomal recessive
    term:
      id: MONDO:0009152
      label: ectopia lentis 2, isolated, autosomal recessive
  distinguishing_features:
  - Autosomal recessive inheritance with biallelic ADAMTSL4 variants
  - Earlier diagnosis (median 2 versus 35 years in one series)
  - Increased axial length
  evidence:
  - reference: PMID:22736615
    reference_title: "A genotype-phenotype comparison of ADAMTSL4 and FBN1 in isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ADAMTSL4 appear to cause earlier manifestation of EL and are associated with increased axial length as compared to FBN1."
    explanation: >-
      Earlier onset and longer axial length distinguish ADAMTSL4-related from
      FBN1-related isolated ectopia lentis.
- name: Weill-Marchesani syndrome
  description: >-
    A fibrillin-microfibril disorder with ectopia lentis, including a dominant
    FBN1 form, but with microspherophakia, short stature, brachydactyly and joint
    stiffness. Recessive LTBP2 variants can also present as isolated ectopia
    lentis with glaucoma.
  disease_term:
    preferred_term: Weill-Marchesani syndrome
    term:
      id: MONDO:0018096
      label: Weill-Marchesani syndrome
  distinguishing_features:
  - Microspherophakia
  - Short stature, brachydactyly and joint stiffness
  - Biallelic ADAMTS10, ADAMTS17 or LTBP2 variants in the recessive forms
  evidence:
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Weill-Marchesani syndrome (WMS) is a connective tissue disorder characterized by abnormalities of the lens of the eye, short stature, brachydactyly, joint stiffness, and cardiovascular defects."
    explanation: >-
      The short stature, brachydactyly and joint stiffness that are absent in
      isolated ectopia lentis.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ocular problems, typically recognized in childhood, include microspherophakia (small spherical lens), myopia secondary to the abnormal shape of the lens, ectopia lentis (abnormal position of the lens), and glaucoma, which can lead to blindness."
    explanation: >-
      Microspherophakia alongside ectopia lentis is the ocular distinction.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADAMTS10-, ADAMTS17-, and LTPBP2-related WMS are inherited in an autosomal recessive manner."
    explanation: >-
      The recessive genes that genotyping separates from dominant FBN1 ectopia
      lentis.
  - reference: PMID:20301293
    reference_title: "Weill-Marchesani Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBN1-related WMS is inherited in an autosomal dominant manner."
    explanation: >-
      A dominant FBN1 form of WMS exists, so the gene alone does not separate
      the two diagnoses; the skeletal phenotype does.
  - reference: PMID:38190127
    reference_title: "Clinical and Genetic Landscape of Ectopia Lentis Based on a Cohort of Patients From 156 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Likely pathogenic variants in three genes were identified in 156 unrelated families with EL from the in-house cohort, of which 97.4% resulted from variants in FBN1, whereas the remaining were caused by variants in ADAMTSL4 (1.3%) and LTBP2 (1.3%)."
    explanation: >-
      LTBP2, a Weill-Marchesani gene, is among the non-FBN1 causes of ectopia
      lentis that genotyping must separate.
- name: Classic homocystinuria
  description: >-
    Cystathionine beta-synthase (CBS) deficiency is among the genetic causes
    of congenital ectopia lentis identified on panel testing; biallelic CBS
    variants separate it from the dominant FBN1 form.
  disease_term:
    preferred_term: classic homocystinuria
    term:
      id: MONDO:0009352
      label: classic homocystinuria
  distinguishing_features:
  - Biallelic CBS variants
  evidence:
  - reference: PMID:34818515
    reference_title: "Combination of Panel-based Next-Generation Sequencing and Clinical Findings in Congenital Ectopia Lentis Diagnosed in Chinese Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, 92.57% (162 of 175) of disease-related variants were detected in FBN1 (83.43%), CPAMD8 (1.71%), COL4A5 (0.57%), ADAMTSL4 (3.43%), LTBP2 (1.71%), and CBS (2.29%)."
    explanation: >-
      CBS variants are among the causes of congenital ectopia lentis found by
      panel testing, so homocystinuria is part of the differential.

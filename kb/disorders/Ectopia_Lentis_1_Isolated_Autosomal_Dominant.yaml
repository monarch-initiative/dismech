    reference_title: "Early onset ectopia lentis due to a FBN1 mutation with non-penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA analysis revealed that she has the same FBN1 mutation. Seven other maternal family members also have ectopia lentis."
    explanation: >-
      A variant carrier without ectopia lentis in a family where the phenotype
      segregates with the variant.
  - reference: PMID:25900864
    reference_title: "Early onset ectopia lentis due to a FBN1 mutation with non-penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child's mother presumably represents a rare case of nonpenetrance."

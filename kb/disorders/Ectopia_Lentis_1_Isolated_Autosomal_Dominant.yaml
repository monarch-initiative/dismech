genetic:
- name: FBN1
  gene_term:
    preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    FBN1 is the defining gene of this entry. Within ectopia lentis as a whole it
    is the predominant cause: FBN1 variants explained 23 of 36 probands with
    ectopia lentis who did not meet the Ghent criteria for Marfan syndrome in a
    British series (PMID:20564469), and 97.4% of 156 Chinese ectopia lentis
    families (PMID:38190127, a cohort not restricted to non-syndromic cases).
    Reported isolated-ectopia-lentis variants are mostly missense changes that
    introduce or remove a cysteine; truncating variants have not been found in
    the isolated phenotype (PMID:19353630). Splice variants causing in-frame
    skipping of exon 11 (the hinge region) also cause it (PMID:39939800). No
    ClinGen gene-disease validity classification exists for FBN1 and this MONDO
    disease, so gene_disease_validity is left empty.
  evidence:
  - reference: PMID:20564469
    reference_title: "Role of ADAMTSL4 mutations in FBN1 mutation-negative ectopia lentis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Causative FBN1 mutations were identified in 23/36 (64%) of probands while homozygous or compound heterozygous ADAMTSL4 mutations were identified in 6/12 (50%) of the remaining probands."
    explanation: >-
      FBN1 is the commonest cause of ectopia lentis in patients who do not meet
      the Marfan syndrome criteria.
  - reference: PMID:20564469
    reference_title: "Role of ADAMTSL4 mutations in FBN1 mutation-negative ectopia lentis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant disorder can be caused by mutations in FBN1, at the milder end of the type-1 fibrillinopathies spectrum."
    explanation: >-
      Places dominant FBN1-related ectopia lentis at the mild end of the type 1
      fibrillinopathy spectrum.
  - reference: PMID:16765689
    reference_title: "Recurrent FBN1 mutation (R62C) in a Chinese family with isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent mutation of FBN1 gene resulted in an arginine-to-cysteine residue (p.R62C), is responsible for the patients with isolated ectopia lentis in a Chinese family."
    explanation: >-
      A family segregation study attributing isolated ectopia lentis to a
      cysteine-introducing FBN1 missense variant.
  - reference: PMID:22539873
    reference_title: "A novel FBN1 mutation in a Chinese family with isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel mutation of FBN1 results in an arginine to cysteine residue (p.R974C) substitution, which is responsible for the patients with isolated EL in this Chinese family."
    explanation: >-
      A second cysteine-introducing FBN1 missense variant segregating with
      isolated ectopia lentis, in a family with sixteen affected members.
  - reference: PMID:33576469
    reference_title: "Genotype variant screening and phenotypic analysis of FBN1 in Chinese patients with isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seven pathogenic variants were identified in 8/12 (66.7%) probands with IEL."
    explanation: >-
      FBN1 variants explain two-thirds of an isolated ectopia lentis proband
      series without extraocular findings.
  - reference: PMID:41409312
    reference_title: "Identification of Novel and Recurrent FBN1 Gene Mutations in Two Unrelated Turkish Families with Isolated Ectopia Lentis: A Case Report with Insights from a Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis demonstrated that both variants co-segregated with the ectopia lentis phenotype and were completely absent in unaffected family members as well as in WES data from 200 ophthalmologically normal in-house controls."
    explanation: >-
      Co-segregation of heterozygous FBN1 missense variants with isolated
      ectopia lentis in two further families.
pathophysiology:
- name: Germline Heterozygous FBN1 Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline FBN1 variant, most often a missense change that
    introduces or removes a cysteine in a calcium-binding EGF-like or TB domain,
    or a splice variant that skips an exon in frame. Variants in exons 24-32 are
    under-represented and premature-truncation variants have not been reported,
    which distinguishes the allelic spectrum from classical Marfan syndrome.
  genes:
  - preferred_term: FBN1
    term:
      id: hgnc:3603
      label: FBN1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  genetic_context:
    variant_origin: GERMLINE
    description: >-
      Heterozygous; predominantly cysteine-involving missense, with in-frame
      exon-skipping splice variants also reported.
  evidence:
  - reference: PMID:19353630
    reference_title: "Pathogenic FBN1 mutations in 146 adults not meeting clinical diagnostic criteria for Marfan syndrome: further delineation of type 1 fibrillinopathies and focus on patients with an isolated major criterion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with isolated EL, missense mutations involving a cysteine were predominant, mutations in exons 24-32 were underrepresented, and no mutations leading to a premature truncation were found."
    explanation: >-
      Defines the allelic spectrum of FBN1 variants in adults with isolated
      ectopia lentis within a 1,009-proband international study.
  - reference: PMID:41409312
    reference_title: "Identification of Novel and Recurrent FBN1 Gene Mutations in Two Unrelated Turkish Families with Isolated Ectopia Lentis: A Case Report with Insights from a Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our study focused review of the literature on FBN1-associated IEL revealed that approximately 66.7% of reported variants involve missense substitutions affecting cysteine residues"
    explanation: >-
      A literature review quantifying the cysteine-missense predominance among
      reported isolated ectopia lentis variants.
  - reference: PMID:39939800
    reference_title: "Novel FBN1 intron variant causes isolated ectopia lentis via in-frame exon skipping."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The causality of the variant in the skipping of exon 11, which results in an in-frame deletion of 60 amino acids corresponding to the \"hinge\" region of FBN1 protein, was confirmed in a minigene experiment."
    explanation: >-
      A minigene assay shows an isolated-ectopia-lentis splice variant acts by
      in-frame exon skipping rather than by truncation.
  downstream:
  - target: Defective Fibrillin-1 Microfibrils of the Ciliary Zonule
    description: >-
      The variant fibrillin-1 is incorporated into, or reduces, the microfibrils
      that make up the zonular fibres suspending the lens.
- name: Defective Fibrillin-1 Microfibrils of the Ciliary Zonule
  biological_scale: TISSUE
  description: >-
    Fibrillin-1 microfibrils are the structural element of the zonular fibres
    (suspensory ligament of the lens). Defective microfibril assembly leaves the
    zonule stretched, weak or disrupted, so it no longer holds the lens centred
    behind the iris. In this disorder the defect is clinically confined to the
    eye: the aortic wall and skeleton are spared, a tissue restriction for which
    no mechanism has been established.
  biological_processes:
  - preferred_term: microfibril assembly
    term:
      id: GO:0160054
      label: microfibril assembly
    modifier: DECREASED
  locations:
  - preferred_term: suspensory ligament of lens
    term:
      id: UBERON:0006762
      label: suspensory ligament of lens
  cell_types:
  - preferred_term: non-pigmented ciliary epithelial cell
    term:
      id: CL:0002304
      label: non-pigmented ciliary epithelial cell
  evidence:
  - reference: PMID:36670079
    reference_title: "Clinical and genetic findings in Chinese families with congenital ectopia lentis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The fibrillin-1 protein encoded by the FBN1 gene is an essential component of the lens zonules."
    explanation: >-
      Background statement that fibrillin-1 is a structural component of the
      zonule. Graded OTHER because the sentence states tissue composition
      rather than an observation in patients.
  - reference: PMID:36670079
    reference_title: "Clinical and genetic findings in Chinese families with congenital ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Congenital ectopia lentis (EL) refers to the congenital dysplasia or weakness of the lens suspensory ligament, resulting in an abnormal position of the crystalline lens"
    explanation: >-
      Defines the human clinical entity, congenital ectopia lentis, as a
      consequence of suspensory-ligament weakness. Graded as Marfan_Syndrome
      grades the full sentence.
  - reference: PMID:30642872
    reference_title: "Targeted deletion of fibrillin-1 in the mouse eye results in ectopia lentis and other ocular phenotypes associated with Marfan syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional knockout of Fbn1 in NPCE, but not lens, profoundly affected the ciliary zonule, the system of fibrillin-rich fibers that centers the lens in the eye."
    explanation: >-
      Deleting Fbn1 from the non-pigmented ciliary epithelium, but not from the
      lens, disrupts the zonule, identifying the non-pigmented ciliary
      epithelial cell as the source of zonular fibrillin-1 in the mouse.
  - reference: PMID:30642872
    reference_title: "Targeted deletion of fibrillin-1 in the mouse eye results in ectopia lentis and other ocular phenotypes associated with Marfan syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The tensile strength of the fibrillin-depleted zonule was reduced substantially, due to a shift toward production of smaller caliber fibers."
    explanation: >-
      Fibrillin-1 depletion weakens the zonule mechanically, the step between
      the microfibril defect and lens displacement.
  - reference: PMID:23493297
    reference_title: "Development, composition, and structural arrangements of the ciliary zonule of the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fbn2 expression by nonpigmented ciliary epithelial cells diminished postnatally and there was a concomitant increase in Fbn1 expression, especially in cells located in valleys between the ciliary folds."
    explanation: >-
      In situ hybridization places postnatal zonular Fbn1 expression in the
      non-pigmented ciliary epithelium.
  downstream:
  - target: Ectopia lentis
    description: >-
      A weakened zonule allows the lens to subluxate or dislocate from its
      normal position.
    causal_link_type: DIRECT
phenotypes:
- name: Ectopia lentis
  category: Ophthalmologic
  description: >-
    Displacement of the crystalline lens, typically bilateral. The defining
    feature of the disorder. Age at recognition varies widely: a median of three
    years in one Chinese series and 35 years in a British series of FBN1
    carriers, and late-onset dislocation is also reported.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Ectopia lentis
    term:
      id: HP:0001083
      label: Ectopia lentis
  evidence:
  - reference: PMID:33576469
    reference_title: "Genotype variant screening and phenotypic analysis of FBN1 in Chinese patients with isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic clinical examination of the twelve probands indicated that all had bilateral EL with a median age at diagnosis of three years."
    explanation: >-
      Bilateral ectopia lentis in every proband of an isolated ectopia lentis
      series, with early median age at diagnosis.
  - reference: PMID:22736615
    reference_title: "A genotype-phenotype comparison of ADAMTSL4 and FBN1 in isolated ectopia lentis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age of diagnosis of EL was 35 years in patients with FBN1 mutations and 2 years in patients with ADAMTSL4 mutations (P < 0.01)."
    explanation: >-
      FBN1-related isolated ectopia lentis can be diagnosed late, later than the
      recessive ADAMTSL4 form.
  - reference: PMID:18615205
    reference_title: "Late-onset bilateral lens dislocation and glaucoma associated with a novel mutation in FBN1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four members in three generations were affected by late-onset lens dislocation and secondary glaucoma but had no signs of cardiovascular abnormality or abnormal skeletal features"
    explanation: >-
      A family with late-onset bilateral dislocation and no cardiovascular or
      skeletal features.
  sequelae:
  - target: High myopia
    description: >-
      The displaced lens produces refractive error that, in children, converts
      to axial myopia through the defocus it introduces.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38190127
      reference_title: "Clinical and Genetic Landscape of Ectopia Lentis Based on a Cohort of Patients From 156 Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Early-stage EL manifests refractive error but gradually converts to axial myopia through defocus introduced by lens dislocation."
      explanation: >-
        Attributes the myopia in ectopia lentis to lens dislocation, in a
        cohort in which 97.4% of families carried FBN1 variants.
  - target: Astigmatism
    description: >-
      Lens tilt and decentration produce irregular astigmatism.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38190127
      reference_title: "Clinical and Genetic Landscape of Ectopia Lentis Based on a Cohort of Patients From 156 Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Aberrant astigmatism is a suggestive sign of EL."
      explanation: >-
        Aberrant astigmatism accompanies ectopia lentis often enough to be a
        diagnostic sign.
  - target: Glaucoma
    description: >-
      An anteriorly displaced lens can block the pupil and close the angle,
      producing secondary glaucoma.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36946977
      reference_title: "Zonule-Associated Gene Variants in Isolated Ectopia Lentis and Glaucoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All 3 probands presented with EL and pupillary-blocking glaucoma."
      explanation: >-
        Pupillary-block glaucoma in isolated ectopia lentis probands, two of
        them carrying FBN1 variants.
  - target: Rhegmatogenous retinal detachment
    description: >-
      Retinal detachment is a sight-threatening complication of ectopia lentis,
      frequent after lens removal in at least one FBN1 pedigree.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33576469
      reference_title: "Genotype variant screening and phenotypic analysis of FBN1 in Chinese patients with isolated ectopia lentis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Isolated ectopia lentis (IEL) can lead to blindness as result of severe complications, such as retinal detachment and secondary glaucoma."
      explanation: >-

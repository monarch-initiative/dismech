name: Ectopia Lentis 1, Isolated, Autosomal Dominant
creation_date: "2026-10-29T18:16:38Z"
description: >-
  Ectopia lentis 1 (ECTOL1) is the autosomal dominant form of isolated ectopia
  lentis caused by heterozygous germline FBN1 variants: the crystalline lens is
  displaced because the fibrillin-1 microfibrils of the ciliary zonule are
  defective, while the aortic and systemic features required for a diagnosis of
  Marfan syndrome are absent. The disorder is usually bilateral and familial,
  with age at recognition ranging from early childhood to late adulthood. Its
  morbidity follows from the displaced lens: high myopia and irregular
  astigmatism, pupillary-block or secondary glaucoma, and retinal detachment.
  The causal variants are predominantly cysteine-involving missense changes
  rather than truncating alleles. Because many FBN1 variants reported in isolated
  ectopia lentis have also been found in patients with aortic dilation or
  dissection, the revised Ghent nosology treats FBN1-related ectopia lentis as
  part of the type 1 fibrillinopathy continuum with Marfan syndrome, and
  affected individuals warrant cardiovascular follow-up.
category: Mendelian
parents:
- Isolated Ectopia Lentis
- Type 1 Fibrillinopathy
synonyms:
- ECTOL1
- FBN1 isolated ectopia lentis
- ectopia lentis, familial
- isolated ectopia lentis caused by mutation in FBN1
- ectopia lentis syndrome
disease_term:
  preferred_term: ectopia lentis 1, isolated, autosomal dominant
  term:
    id: MONDO:0007514
    label: ectopia lentis 1, isolated, autosomal dominant
notes: >-
  Lump/split decision: recorded as a separate disease entry rather than as a
  has_subtypes row of Marfan_Syndrome. MONDO and OMIM (129600) keep FBN1-related
  isolated ectopia lentis as its own concept, and the revised Ghent nosology
  (PMID:20591885) treats it separately as ectopia lentis syndrome (ELS), which
  covers ectopia lentis in a person whose FBN1 variant is not known to be
  associated with aortic dilation or dissection. That summary of the category
  is a reading of the nosology paper, whose cached abstract does not state it.
  The variant-history rule itself is quoted, with evidence, in the Marfan
  syndrome differential: a patient moves into Marfan syndrome once the variant
  has been reported with aortic dilation or dissection, and a review of
  published cases found that this reclassifies close to half of the previously
  reported probands (PMID:24635535). The entry therefore covers the ELS side of that boundary and
  records the continuum explicitly; the boundary is defined by the variant's
  reported associations rather than by a mechanism unique to this disease, so a
  diagnosis can move to Marfan syndrome as variant knowledge accumulates. No
  existing mechanism module fits the zonular fibrillin-1 failure modelled here
  (aortopathy_tgfbeta_dysregulation covers the aortic wall, which this entry
  excludes), so no node declares conforms_to.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous FBN1 variants segregate with ectopia lentis in multigeneration
    families; one Indian pedigree had 27 affected members in four generations.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:18079676
    reference_title: "A recurrent FBN1 mutation in an autosomal dominant ectopia lentis family of Indian origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To identify the genetic defect in an autosomal dominant ectopia lentis (EL) family having 27 affected members in four generations."
    explanation: >-
      A four-generation pedigree with dominant transmission of isolated ectopia
      lentis.
  - reference: PMID:18079676
    reference_title: "A recurrent FBN1 mutation in an autosomal dominant ectopia lentis family of Indian origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A maximum LOD score of 5.74 at theta=0.0 was obtained with marker D15S1024 in close proximity to FBN1 at 15q21."
    explanation: >-
      Linkage of the dominant ectopia lentis phenotype to the FBN1 locus.
  - reference: PMID:25900864
    reference_title: "Early onset ectopia lentis due to a FBN1 mutation with non-penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated ectopia lentis is usually autosomal dominant and commonly due to the mutations of FBN1 gene."
    explanation: >-
      States the usual dominant inheritance of FBN1-related isolated ectopia
      lentis.
- name: Incomplete penetrance
  description: >-
    Non-penetrance has been reported: the mother of an affected child carried his
    FBN1 variant without ectopia lentis, while seven other maternal relatives were
    affected. No penetrance figure has been estimated.
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:

genetic:
- name: BRWD3
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: BRWD3
    term:
      id: hgnc:17342
      label: BRWD3
  notes: >-
    BRWD3 (bromodomain and WD repeat domain containing 3) maps to Xq21.1 and
    encodes an 1802-residue protein with eight WD40 repeats and two
    bromodomains. All disease alleles in the largest series are null (stop-gain,
    frameshift, canonical splice) or partial gene deletions, and none is in
    gnomAD. The founding screen found truncating BRWD3 variants in 2 of 250
    XLID families (about 1%); a missense variant (p.K1596E) segregating in a
    third family without macrocephaly was of uncertain significance and is not
    counted here.

    ClinGen's Intellectual Disability and Autism expert panel classifies BRWD3
    as Definitive for X-linked syndromic intellectual disability
    (MONDO:0020119), a broader MONDO term than this entry's disease_term, so the
    classification is cited as evidence but not recorded as a
    gene_disease_validity assertion for MONDO:0010393.

    A Chinese epilepsy cohort reported maternally inherited BRWD3 missense and
    near-splice variants in five individuals with idiopathic partial epilepsy
    and normal intellect, and proposed that truncating alleles cause
    intellectual disability while WD40/bromodomain missense alleles cause
    epilepsy. That association rests on a single cohort and on case-control
    allele counting without functional data; it is not modelled as a subtype of
    this entry.
  evidence:
  - reference: PMID:17668385
    reference_title: "Mutations in the BRWD3 gene cause X-linked mental retardation associated with macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In the course of systematic screening of the X-chromosome coding sequences in 250 families with nonsyndromic X-linked mental retardation (XLMR), two families were identified with truncating mutations in BRWD3, a gene encoding a bromodomain and WD-repeat domain-containing protein."
    explanation: The founding gene discovery in two XLID families.
  - reference: PMID:17668385
    reference_title: "Mutations in the BRWD3 gene cause X-linked mental retardation associated with macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No truncating variants were found in 520 control X chromosomes."
    explanation: Absence of truncating variants in controls.
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report the largest BRWD3 patient series to date, comprising 17 males with 12 distinct null variants and 2 partial gene deletions."
    explanation: The largest single series, all null alleles or deletions.
  - reference: CGGV:assertion_b8a924e2-e76b-4363-bf38-d95fd53d6141-2018-07-18T100000.000Z
    reference_title: "BRWD3 / X-linked syndromic intellectual disability (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BRWD3 | HGNC:17342 | X-linked syndromic intellectual disability | MONDO:0020119 | XL | Definitive"
    explanation: >-
      The expert-panel classification, keyed to the broader X-linked syndromic
      intellectual disability term rather than to MONDO:0010393.
  - reference: PMID:36514184
    reference_title: "Variants in BRWD3 associated with X-linked partial epilepsy without intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Further analysis demonstrated that all previously reported destructive variants of BRWD3 caused intellectual disability, while missense variants located in WD40 repeat domains and bromodomains of BRWD3 were associated with epilepsy."
    explanation: >-
      Literature synthesis that truncating BRWD3 alleles are the ones associated
      with intellectual disability; the epilepsy half of the sentence is the
      separate, unconfirmed allelic proposal discussed in notes.

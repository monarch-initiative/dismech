name: Intellectual Disability X-linked 93
creation_date: "2026-10-01T14:46:12Z"
description: >-
  Intellectual disability, X-linked 93 (MRX93, XLID93) is the X-linked
  neurodevelopmental disorder caused by loss-of-function variants in BRWD3, a
  bromodomain and WD40-repeat protein encoded at Xq21.1. Affected individuals
  are overwhelmingly hemizygous males carrying stop-gain, frameshift or
  canonical splice variants or partial or whole-gene deletions, most often
  inherited from an unaffected carrier mother and less often de novo.

  Although MONDO files it under non-syndromic X-linked intellectual disability,
  the published series describe a recognisable syndrome: mild-to-moderate
  intellectual disability with speech delay, postnatal macrocephaly (mean head
  circumference about +2.8 SD), a tendency to obesity, behavioural difficulties
  (aggression, attention deficit, autism spectrum features, shyness), and a
  shared face with a prominent or broad forehead, large or cupped ears, a tall
  or pointed chin, prognathism and prominent supraorbital ridges. Because of the
  macrocephaly and mild tall stature it is now discussed within the
  overgrowth-intellectual disability (OGID) group.

  The molecular mechanism in human neurons is not established. BRWD3 is a
  substrate receptor of the CUL4-DDB1 (CRL4) E3 ubiquitin ligase and a chromatin
  reader; in Drosophila cells it targets the H3K4 demethylase KDM5 for
  degradation, and fly dBRWD3 mutants accumulate histone H3.3 through
  HIRA/Yemanuclein, with transcriptome and dendrite defects that are suppressed
  by reducing H3.3 deposition. dBRWD3 was also identified as a positive
  regulator of JAK/STAT signalling in a Drosophila RNAi screen. None of these
  links has been tested in a mammalian model of the disease, and the route from
  BRWD3 loss to macrocephaly and obesity is unexplained.
category: Mendelian

animal_models:
- name: Drosophila dBRWD3 mutant
  species: Drosophila melanogaster
  genotype: dBRWD3 (ramshackle, CG31132) loss-of-function mutants
  category: Loss-of-function
  description: >-
    The only in vivo model bearing on the disease mechanism. dBRWD3 mutants
    show increased H3.3 levels, global transcriptome changes, and defects of
    dendritic morphogenesis and sensory organ differentiation, all suppressed by
    inactivating yem or H3.3. There is no fly readout corresponding to
    macrocephaly or obesity, and no mammalian Brwd3 knockout has been reported.
  modeled_mechanisms:
  - target: Excess Histone H3.3 Deposition
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    limitations: >-
      Invertebrate model; the H3.3 mechanism has not been tested in mammalian
      neurons or patient cells.
    evidence:
    - reference: PMID:25666827
      reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In dBRWD3 mutants, increased H3.3 levels disrupt gene expression, dendritic morphogenesis, and sensory organ differentiation."
      explanation: The model shows the H3.3 excess this node describes.
  - target: Impaired Dendrite Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      Dendrite and sensory-organ defects in fly neurons stand in for human
      cognitive impairment; no behavioural or learning readout was reported.
    evidence:
    - reference: PMID:25666827
      reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In dBRWD3 mutants, increased H3.3 levels disrupt gene expression, dendritic morphogenesis, and sensory organ differentiation."
      explanation: The dendritic morphogenesis defect in the model.
  evidence:
  - reference: PMID:25666827
    reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Here, we report that dBRWD3, the Drosophila ortholog of the intellectual disability gene BRWD3, regulates gene expression through H3.3, HIRA, and its associated chaperone Yemanuclein (YEM), the fly ortholog of mammalian Ubinuclein1."
    explanation: Establishes dBRWD3 as the fly orthologue and the pathway studied.
discussions:
- discussion_id: brwd3_macrocephaly_obesity_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of BRWD3 produce macrocephaly and a tendency to obesity?
  attaches_to:
  - phenotypes#Macrocephaly
  - phenotypes#Obesity
  - pathophysiology#Neuronal Transcriptional Dysregulation
  - pathophysiology#Impaired Dendrite Morphogenesis
  rationale: >-
    The growth phenotype is what makes this disorder recognisable, and nothing
    explains it. The only proposed route is the fly H3.3/chromatin mechanism,
    which its proponents state as a possibility. The obesity is harder still:
    in mouse adipogenesis work, DDB1 binds BRWD3 to recruit it to acetylated
    histones and promote the adipogenic transcriptional cascade, and Ddb1
    heterozygous mice resist diet-induced obesity, which would predict that
    losing BRWD3 reduces rather than increases adiposity. Whether the human
    obesity is central (hypothalamic), a consequence of reduced activity, or an
    adipocyte-autonomous effect of a different BRWD3 function is untested.
  evidence:
  - reference: PMID:34161765
    reference_title: "DDB1 binds histone reader BRWD3 to activate the transcriptional cascade in adipogenesis and promote onset of obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Here, we show that DDB1 binds the histone reader BRWD3 to promote adipogenesis and diet-induced obesity."
    explanation: >-
      The mammalian BRWD3 adipogenesis finding whose direction does not obviously
      fit the human obesity phenotype.
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "However, further work is required to investigate this and establish the specific mechanism by which BRWD3 haploinsufficiency leads to overgrowth and intellectual disability."
    explanation: The human series' authors state that the mechanism is not established.
- discussion_id: brwd3_no_mammalian_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the Drosophila BRWD3 mechanisms (KDM5 degradation, restraint of H3.3
    deposition, JAK/STAT regulation) operate in human or mouse neurons, and does
    any of them account for the human phenotype?
  attaches_to:
  - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
  - pathophysiology#Excess Histone H3.3 Deposition
  - pathophysiology#Reduced JAK-STAT Pathway Signaling
  - animal_models#Drosophila melanogaster
  rationale: >-
    Every mechanistic node below BRWD3 loss comes from Drosophila mutants or
    Drosophila cultured cells. The fly null is a developmental lethal with eye
    and dendrite phenotypes, whereas hemizygous human loss is viable and causes
    mild-to-moderate intellectual disability with overgrowth, so the two may
    not share the limiting pathway. A mammalian Brwd3 knockout, or patient iPSC
    neurons measuring KDM5 levels, H3K4me3, H3.3 occupancy and dendrite
    morphology, would test whether any of the fly mechanisms carries over.
  proposed_experiments:
  - experiment_id: brwd3_mammalian_knockout
    name: Mammalian Brwd3 knockout phenotyping
    description: >-
      Generate a hemizygous Brwd3 null mouse and measure brain and body growth,
      adiposity, learning and behaviour, together with neuronal KDM5 protein
      levels, H3K4me3 and H3.3 occupancy, and dendrite morphology.
    decision_criterion: >-
      Macrocephaly or adiposity with altered KDM5, H3K4me3 or H3.3 in neurons
      would support the fly-derived nodes; normal chromatin readouts despite a
      phenotype would refute them as the limiting mechanism.
    would_support:
    - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
    - pathophysiology#Excess Histone H3.3 Deposition
  - experiment_id: brwd3_patient_ipsc_neurons
    name: Patient iPSC-derived neuron chromatin and morphology study
    description: >-
      Derive cortical neurons from iPSCs of hemizygous BRWD3-null patients and
      isogenic corrected controls; measure KDM5 protein stability, H3K4me3 and
      H3K4me1 profiles, H3.3 deposition, transcriptome, and dendrite
      arborization.
    decision_criterion: >-
      KDM5 stabilisation or H3.3 excess in patient neurons that is reversed by
      correction would support carry-over of the fly mechanisms to human
      neurons.
    would_support:
    - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
    - pathophysiology#Excess Histone H3.3 Deposition
    - pathophysiology#Impaired Dendrite Morphogenesis
  evidence:
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Relatively little is known about the biology of the BRWD3 phenotype, and to our knowledge, there have been no reports of knockout models or functional studies in mammalian models."
    explanation: Absence of mammalian functional work as of the largest series.
notes: >-
  Evidence for this entry is thin by construction: about 45 affected
  individuals, three case series and a handful of case reports, and no
  mammalian functional study. Phenotype frequencies come from the 2023 pooled
  analysis (up to 41 males per feature) and the 17-male 2019 series, and
  denominators vary by feature because not every report records every feature.
  The mechanistic chain below the loss-of-function node rests on Drosophila
  work and is graded INDIRECT throughout.

  MONDO places MONDO:0010393 under non-syndromic X-linked intellectual
  disability, while the published phenotype is reproducibly syndromic
  (macrocephaly, obesity tendency, shared face), and ClinGen curates the gene
  against X-linked syndromic intellectual disability. The entry curates the
  syndromic phenotype the literature reports.

  No GeneReviews chapter covers this disorder. The BRWD3 cytoband is Xq21.1
  (HGNC); the 2019 series text gives Xp21.1, which is a typographical error in
  that paper.

inheritance:
- name: X-linked recessive
  description: >-
    Hemizygous BRWD3 null variants or deletions in males. In the largest single
    series every sequence variant with inheritance data (12 patients) was
    maternally inherited, while both partial gene deletions arose de novo;
    across the pooled literature 19 of 28 variants with segregation data came
    from unaffected mothers and 9 were de novo, so a negative family history
    does not exclude the diagnosis. Carrier females are usually unaffected, and
    in the founding family the three tested carriers preferentially inactivated
    the mutant X. A small number of affected heterozygous females have been
    reported, all milder than males and with skewed X inactivation in each one
    tested.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Inheritance data were available for 12 patients with sequence variants; all were maternally inherited."
    explanation: Maternal transmission of every sequence variant with segregation data in the 17-male series.
  - reference: PMID:36414205
    reference_title: "Further clinical and molecular characterization of an XLID syndrome associated with BRWD3 variants, a gene implicated in the leukemia-related JAK-STAT pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Among the 28 variants with available segregation reported, 19 were inherited from unaffected mothers and 9 were de novo."
    explanation: Pooled segregation across the literature, showing both carrier-mother transmission and de novo occurrence.
  - reference: PMID:17668385
    reference_title: "Mutations in the BRWD3 gene cause X-linked mental retardation associated with macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In all three carriers, it is the chromosome carrying the BRWD3 c.3325+1G→T mutation that is preferentially inactivated (data not shown)."
    explanation: Skewed inactivation of the mutant X in unaffected carrier females of the founding family.
  - reference: PMID:42298746
    reference_title: "X-Linked Intellectual Developmental Disorder-93 Caused by BRWD3 Mutation in Females: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "with the overall clinical manifestations being milder than those in the male population"
    explanation: Affected heterozygous females exist and are milder than hemizygous males.
pathophysiology:
- name: BRWD3 Loss of Function
  description: >-
    The initiating lesion. Reported pathogenic alleles are stop-gain,
    frameshift and canonical splice variants and partial or whole-gene
    deletions, predicted to abolish BRWD3 function. A 586 kb Xq21.1 deletion
    whose only disease-associated gene is BRWD3 reproduces the phenotype, which
    supports loss of function as sufficient to cause the disorder. BRWD3 contains eight N-terminal WD40 repeats and two C-terminal
    bromodomains. Its best-characterised molecular activity is as a
    substrate-recognition subunit of the CUL4-DDB1-ROC1 (CRL4) E3 ubiquitin
    ligase, shown biochemically for Drosophila BRWD3 with human CRL4 components;
    the molecular function binding records that activity as lost.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BRWD3
    term:
      id: hgnc:17342
      label: BRWD3
  molecular_functions:
  - preferred_term: CRL4 ubiquitin ligase substrate receptor activity
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    modifier: DECREASED
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: null (stop-gain, frameshift, canonical splice, partial or whole-gene deletion)
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
  downstream:
  - target: KDM5 Stabilization and H3K4 Methylation Imbalance
    causal_link_type: DIRECT
    description: >-
      Shown in Drosophila cultured cells: BRWD3 depletion stabilises KDM5 and
      shifts H3K4 methylation. Not tested in human or mammalian neurons.
  - target: Excess Histone H3.3 Deposition
    causal_link_type: DIRECT
    description: >-
      Shown in Drosophila dBRWD3 mutants, where H3.3 levels rise. Not tested in
      a mammalian system.
  - target: Reduced JAK-STAT Pathway Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Based on a Drosophila genome-wide RNAi screen hit and fly in vivo
      epistasis, where dBRWD3 is required for JAK/STAT pathway activity; how
      dBRWD3 acts on the pathway was not determined. Whether BRWD3 loss alters JAK-STAT signalling in human cells
      relevant to this disorder is unknown.
  evidence:
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The 12 BRWD3 sequence variants included six stop-gain, four frameshift and two canonical splice site variants (predicted to disrupt normal splicing), which were predicted to result in haploinsufficiency of a gene which exhibits a high degree of loss-of-function constraint (pLI 1.00, haploinsufficiency index 28.62%, PVS1)."
    explanation: The allele spectrum of the largest series is entirely null, in a constrained gene.
  - reference: PMID:38813790
    reference_title: "[X-linked intellectual disability syndrome with macrocephaly due to BRWD3 gene deletion]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Our patient confirms that the haploinsufficiency due to BRWD3 deletion is a causal genetic mechanism of the BRWD3-related syndromic X-linked intellectual disability."
    explanation: A whole-gene deletion produces the same syndrome, supporting loss of function as the mechanism.
  - reference: PMID:17668385
    reference_title: "Mutations in the BRWD3 gene cause X-linked mental retardation associated with macrocephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Analysis of cDNA isolated from a lymphoblastoid cell line derived from III-6 demonstrates that this mutation leads to complete skipping of exon 29 and the introduction of a premature stop codon"
    explanation: Transcript analysis in patient cells confirming that a splice allele truncates the protein.
  - reference: PMID:23479607
    reference_title: "Ramshackle (Brwd3) promotes light-induced ubiquitylation of Drosophila Cryptochrome by DDB1-CUL4-ROC1 E3 ligase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Indeed, when BRWD3 was expressed in human HEK293T cells and immunopurified, DDB1, CUL4A, CUL4B, and ROC1 copurified with it, indicating that BRWD3 is a substrate receptor for a CRL4 E3 ligase"
    explanation: >-
      Biochemical basis for the ubiquitin ligase substrate adaptor activity
      bound here. INDIRECT because the BRWD3 used was the Drosophila protein and
      the substrate studied (Cryptochrome) is not implicated in the human
      disorder. The paper also calls fly BRWD3 the homolog of human WDR9
      (BRWD1), a BRWD3 paralog, so assigning the activity to human BRWD3 relies
      on family-level orthology.
  - reference: PMID:23479607
    reference_title: "Ramshackle (Brwd3) promotes light-induced ubiquitylation of Drosophila Cryptochrome by DDB1-CUL4-ROC1 E3 ligase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Thus, we conclude that dCRY is ubiquitylated by a CRL4 E3 ligase with BRWD3 as a substrate receptor and in a light-dependent manner"
    explanation: >-
      The authors' conclusion that BRWD3 is a CRL4 substrate receptor. Same
      orthology caveat as above: the paper names fly BRWD3 the homolog of human
      WDR9/BRWD1.
  - reference: PMID:37722046
    reference_title: "BRWD3 promotes KDM5 degradation to maintain H3K4 methylation levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "BRWD3 functions as a substrate receptor of the Cul4 E3 ubiquitin ligase complex"
    explanation: Restates the CRL4 substrate-receptor role as established background.
- name: KDM5 Stabilization and H3K4 Methylation Imbalance
  description: >-
    In Drosophila cultured cells BRWD3 binds the H3K4 demethylase KDM5 (Lid),
    co-localises with it genome-wide, and promotes its K48-linked
    polyubiquitination and Cul4-dependent degradation. BRWD3 depletion raises
    H3K4me1 and lowers H3K4me3, and depleting KDM5 restores H3K4me3, placing
    KDM5 accumulation between BRWD3 loss and the methylation change. This is the
    best-characterised BRWD3 substrate relevant to chromatin, but it has not been
    examined in human cells or neurons.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: CRL4-BRWD3-dependent KDM5 degradation
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: KDM5 histone H3K4 demethylase activity
    term:
      id: GO:0034647
      label: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:37722046
    reference_title: "BRWD3 promotes KDM5 degradation to maintain H3K4 methylation levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "We show that BRWD3 promotes K48-linked polyubiquitination and degradation of KDM5 and that KDM5 degradation is dependent on both BRWD3 and Cul4."
    explanation: >-
      KDM5 as a CRL4-BRWD3 substrate. INDIRECT because the work is in
      Drosophila cultured cells, not human tissue.
  - reference: PMID:37722046
    reference_title: "BRWD3 promotes KDM5 degradation to maintain H3K4 methylation levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Critically, depleting KDM5 fully restores altered H3K4me3 levels and partially restores H3K4me1 levels upon BRWD3 depletion."
    explanation: Epistasis placing KDM5 accumulation upstream of the H3K4 methylation change.
- name: Excess Histone H3.3 Deposition
  description: >-
    Drosophila dBRWD3 negatively regulates replication-independent deposition of
    the histone variant H3.3 by HIRA and its chaperone Yemanuclein (the fly
    orthologue of Ubinuclein1). In dBRWD3 mutants H3.3 levels rise, and
    inactivating yem or H3.3 suppresses the global transcriptome changes and the
    developmental defects, which places excess H3.3 deposition causally between
    dBRWD3 loss and the downstream phenotypes in the fly.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: HIRA/YEM-mediated H3.3 nucleosome assembly
    term:
      id: GO:0006334
      label: nucleosome assembly
    modifier: INCREASED
  downstream:
  - target: Neuronal Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Shown in Drosophila: reducing yem or H3.3 suppresses the global
      transcriptome changes of dBRWD3 mutants.
  - target: Impaired Dendrite Morphogenesis
    causal_link_type: DIRECT
    description: >-
      Shown in Drosophila: increased H3.3 in dBRWD3 mutants disrupts dendritic
      morphogenesis, and reducing yem or H3.3 suppresses the developmental
      defects.
  evidence:
  - reference: PMID:25666827
    reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "In dBRWD3 mutants, increased H3.3 levels disrupt gene expression, dendritic morphogenesis, and sensory organ differentiation."
    explanation: >-
      Excess H3.3 after dBRWD3 loss. INDIRECT because the evidence is from
      Drosophila.
  - reference: PMID:25666827
    reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Inactivation of yem or H3.3 remarkably suppresses the global transcriptome changes and various developmental defects caused by dBRWD3 mutations."
    explanation: Genetic suppression placing H3.3 deposition upstream of the transcriptional and developmental defects.
- name: Neuronal Transcriptional Dysregulation
  description: >-
    The proposed molecular consequence of BRWD3 loss. In Drosophila dBRWD3
    mutants, excess H3.3 disrupts gene expression genome-wide. The authors of
    the largest human series propose this chromatin-level effect on
    transcription as a possible mechanism for the overgrowth-intellectual
    disability phenotype, while noting that no mammalian knockout or functional
    study exists.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed. The link from chromatin-driven transcriptional change in flies
      to human cognitive impairment is an inference by analogy; no human or
      mammalian neuronal data exist.
  - target: Macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Speculative. The human series' authors suggest the H3.3/chromatin
      mechanism as a possible basis for the overgrowth component, without data
      on brain growth.
  evidence:
  - reference: PMID:25666827
    reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Inactivation of yem or H3.3 remarkably suppresses the global transcriptome changes and various developmental defects caused by dBRWD3 mutations."
    explanation: Global transcriptome changes in the fly model, dependent on H3.3 deposition.
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "However, a possible mechanism of pathogenesis of the OGID phenotype is suggested by experiments in Drosophila, which found that loss of the BRWD3 homologue leads to increased histone H3.3 levels and wide-ranging effects on gene transcription mediated through histone-dependent chromatin regulation"
    explanation: The human series' authors propose the fly chromatin mechanism for the human phenotype, explicitly as a possibility.
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Relatively little is known about the biology of the BRWD3 phenotype, and to our knowledge, there have been no reports of knockout models or functional studies in mammalian models."
    explanation: Records that no mammalian evidence bears on this node; the chain rests on Drosophila work.
- name: Impaired Dendrite Morphogenesis
  description: >-
    In Drosophila dBRWD3 mutants, increased H3.3 disrupts dendritic
    morphogenesis and sensory organ differentiation. This is the only neuronal
    morphology readout for BRWD3 loss; it has not been examined in mammalian
    neurons.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by analogy. Dendrite defects in fly sensory neurons are taken as
      a cellular correlate of cognitive impairment; no human or mammalian
      neuronal data exist.
  evidence:
  - reference: PMID:25666827
    reference_title: "Intellectual disability-associated dBRWD3 regulates gene expression through inhibition of HIRA/YEM-mediated chromatin deposition of histone H3.3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "In dBRWD3 mutants, increased H3.3 levels disrupt gene expression, dendritic morphogenesis, and sensory organ differentiation."
    explanation: Dendritic morphogenesis defects in the fly model.
- name: Reduced JAK-STAT Pathway Signaling
  description: >-
    A genome-wide RNAi screen in Drosophila haemocyte-like cells identified
    dBRWD3 as required for JAK/STAT pathway activity, and in vivo disruption of
    dBRWD3 suppressed leukaemia-like blood cell tumours driven by the pathway.
    The relevance of this to the neurodevelopmental disorder is not established;
    the node is recorded because BRWD3 was first characterised through it and it
    is the signalling pathway most often cited for the gene, but no edge to a
    clinical feature is asserted.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:16094372
    reference_title: "Identification of JAK/STAT signalling components by genome-wide RNA interference."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "In addition to multiple human disease gene homologues, we have found the tyrosine phosphatase Ptp61F and the Drosophila homologue of BRWD3, a bromo-domain-containing protein disrupted in leukaemia."
    explanation: dBRWD3 identified as a JAK/STAT pathway component in a cell-based RNAi screen.
  - reference: PMID:16094372
    reference_title: "Identification of JAK/STAT signalling components by genome-wide RNA interference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Moreover, in vivo analysis demonstrates that disrupted dBRWD3 and overexpressed Ptp61F function as suppressors of leukaemia-like blood cell tumours."
    explanation: In vivo fly evidence that dBRWD3 loss dampens a JAK/STAT-driven phenotype.
  - reference: PMID:31714006
    reference_title: "Null variants and deletions in BRWD3 cause an X-linked syndrome of mild-moderate intellectual disability, macrocephaly, and obesity: A series of 17 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "BRWD3 was initially described as a putative transcription factor, and the Drosophila homologue was found to be a positive regulator of the JAK/STAT pathway"
    explanation: The human series summarises dBRWD3 as a positive JAK/STAT regulator.

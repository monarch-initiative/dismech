name: Fragile X Syndrome
creation_date: '2026-01-07T17:31:51Z'
description: >-
  Fragile X syndrome is the most common inherited cause of intellectual disability
  and a leading monogenic cause of autism. It results from expansion of a CGG
  trinucleotide repeat in the 5' untranslated region of the FMR1 gene; full
  mutations (>200 repeats) trigger promoter hypermethylation and transcriptional
  silencing, abolishing the fragile X messenger ribonucleoprotein (FMRP). Loss of
  FMRP dysregulates synaptic protein translation, causing intellectual disability,
  behavioral abnormalities, and characteristic physical features.

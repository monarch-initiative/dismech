- accession: ega:EGAS50000000647
  title: Transcriptomic profiling of fragile X syndrome unmethylated full mutation carriers
  description: Total RNA sequencing of fibroblasts from two unrelated FMR1 unmethylated full mutation carriers, a fragile X patient and a control individual. The existence of rare, unmethylated full mutation carriers who carry the mutation that causes fragile X syndrome but do not gain methylation at the locus offers a rare opportunity to study the mechanisms underlying fragile X syndrome. This study aims to compare the transcriptomes of these four individuals in order to elucidate the mechanism behind the methylation a the FMR1 CGG repeat expansion that causes Fragile X syndrome.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Fragile X Syndrome"); description-level mentions were not accepted. EGA study_type: RNASeq. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000000648
  title: Genomic profiling of fragile X syndrome unmethylated full mutation carriers
  description: Whole genome sequencing of two unrelated FMR1 unmethylated full mutation carriers. The existence of rare, unmethylated full mutation carriers who carry the mutation that causes fragile X syndrome but do not gain methylation at the locus offers a rare opportunity to study the mechanisms underlying fragile X syndrome. This study aims to investigate the genomic variants in these individuals alongside transcriptomic data to elucidate underlying genomic variants behind transcriptomic differences observed in UFM individuals.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WGS
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Fragile X Syndrome"); description-level mentions were not accepted. EGA study_type: Whole Genome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000081061
  title: De Novo Proteome in Fragile X Syndrome
  description: Elevated translation has been reported in multiple models of fragile X syndrome (FXS) and in FXS individuals, however, whether it is limited to fragile X mental retardation protein (FMRP) target mRNAs or neuronal activity-derived conditions remains unclear. We examined this question by measuring the de novo proteome of the Fmr1 knockout (KO) mouse hippocampus compared to normal littermates in steady-state and mGluR-stimulated conditions.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Fragile X Syndrome"). Retrieved 2026-08-02.

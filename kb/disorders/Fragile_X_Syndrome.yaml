  - mechanistic_hypotheses#canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model
  - clinical_trials#NCT02920892
  rationale: >-
    The mGluR theory's one testable clinical prediction has now failed twice
    over: two phase 2b mavoglurant trials in adolescents and adults missed their
    behavioral primary endpoints, and the later FXLEARN phase 3 trial in 3 to 6
    year olds missed its primary language outcome. Yet mavoglurant did move
    biobehavioral measures in the same patients, so the drug was reaching its
    target. Nothing published so far separates the two explanations, and the
    distinction matters for what this entry asserts: whether the synaptic
    translation node is the therapeutically relevant driver of the cognitive
    and behavioral phenotype, or one arm among several. Expert reviews attribute
    the gap to trial design rather than to the model, but that is opinion rather
    than a result and should not be curated as a finding.
  proposed_experiments:
  - experiment_id: fxs_early_intervention_eeg_endpoint_trial
    name: Early-intervention trial with EEG biomarkers as co-primary endpoints
    description: >-
      Randomized controlled trial of an mGluR5 modulator, with or without a
      GABA-B agonist, in children aged 2 to 6, using auditory inter-trial phase
      coherence and resting gamma power as co-primary endpoints alongside
      adaptive behavioral measures. Both EEG measures are abnormal in Fmr1
      knockout mice from early postnatal ages and have human counterparts, which
      makes them candidate pharmacodynamic markers for a population in whom
      behavioral rating scales perform poorly.
    would_support:
    - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
    supporting_outcome: >-
      EEG measures normalize and developmental trajectory improves, indicating
      that treatment timing rather than model validity explains the earlier
      failures.
    refuting_outcome: >-
      EEG measures normalize while behavior does not, indicating that correcting
      the synaptic translation arm is insufficient and that the parallel
      effector arms carry a substantial part of the clinical phenotype.
  evidence:
  - reference: PMID:30451888
    reference_title: "Mavoglurant in Fragile X Syndrome: Results of two open-label, extension trials in adults and adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mavoglurant, a selective metabotropic glutamate receptor subtype-5 antagonist, has shown positive neuronal and behavioral effects in preclinical studies, but failed to demonstrate any behavioral benefits in two 12-week, randomized, placebo-controlled, double-blind, phase IIb studies in adults and adolescents with FXS.
    explanation: >-
      Documents the failure of the mGluR theory's central therapeutic
      prediction in the age group tested, and the mismatch with the preclinical
      result that motivated the trials.
  - reference: PMID:30653533
    reference_title: "Effects of mavoglurant on visual attention and pupil reactivity while viewing photographs of faces in Fragile X Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study shows that negative modulation of mGluR5 activity improves eye gaze behavior and alters sympathetically-driven reactivity to faces in patients with FXS, providing preliminary evidence of this drug's impact on behavior in humans with the disorder.
    explanation: >-
      An eye-tracking biobehavioral probe embedded in the same trials did detect
      a drug effect, which is why the endpoint explanation for the failure
      cannot be dismissed.
- discussion_id: fxs_nonsynaptic_effector_arms
  prompt: >-
    Are the nuclear genome-protection and glutaminase-dependent metabolic
    consequences of FMRP loss independent contributors to the fragile X
    phenotype, or downstream of, or incidental to, the cytoplasmic translational
    defect?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FMRP loss of translational repression
  - pathophysiology#Excess translation of chromatin regulators
  rationale: >-
    FMRP loss has documented consequences that this entry's pathograph does not
    connect to any phenotype. Patient fibroblasts accumulate twice the
    double-strand breaks of controls, with breaks colocalizing with R-loop
    forming sequences under replication stress; patient iPSC-derived neurons
    show reduced glutaminolysis and impaired anaplerotic supply to the TCA
    cycle. Both are measured in patient-derived cells, so neither is a model
    artifact, but neither has been traced to a neural or clinical outcome, and
    no experiment has separated nuclear from cytoplasmic FMRP function. Until
    that is done, the entry curates these as observations rather than as arms of
    the causal chain, and the astrocytic and chromatin arms are curated as nodes
    only because each has an intervention that reverses a downstream phenotype.
  proposed_experiments:
  - experiment_id: fxs_nuclear_vs_cytoplasmic_fmrp_rescue
    name: Compartment-restricted FMRP rescue
    description: >-
      Express nuclear-localization-tagged FMRP against nuclear-export-tagged
      FMRP in FMRP-null cells and neurons, then measure protein synthesis rate,
      mGluR-dependent long-term depression, double-strand breaks, R-loops,
      chromatin marks, and glutaminolysis in each condition.
    would_support:
    - pathophysiology#FMRP loss of translational repression
    supporting_outcome: >-
      Cytoplasmic FMRP alone corrects the genome-instability and metabolic
      readouts, showing they are downstream of the translational defect and need
      no separate arm in the model.
    refuting_outcome: >-
      Only nuclear FMRP corrects the genome-instability readouts, establishing an
      effector arm that the synaptic translation formulation cannot account for.
  evidence:
  - reference: PMID:32966779
    reference_title: "Replication Stress Induces Global Chromosome Breakage in the Fragile X Genome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report that the genomes of FXS cells are inherently unstable and accumulate twice as many DSBs as those from an unaffected control.
    explanation: >-
      Establishes the genome-instability observation in patient-derived cells.
      The study does not link it to any neural or clinical phenotype, which is
      the gap.
  - reference: PMID:41557506
    reference_title: "Metabolic reprogramming during human neuron differentiation indicates glutaminase as a key determinant in Fragile X syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Metabolic tracing in FXS neurons demonstrates a dearth of glutamine deamidation to glutamate, which reduces anaplerosis into the TCA cycle, potentially hindering the bioenergetic and biosynthetic functions of mitochondria.
    explanation: >-
      Establishes the metabolic observation in patient iPSC-derived neurons. The
      authors themselves hedge the disease link, and no causal test of it has
      been reported.
- discussion_id: fxs_mglur_ltd_age_and_condition_dependence
  prompt: >-
    Is exaggerated mGluR-dependent long-term depression a general property of
    FMRP loss, or an artifact of a narrow mouse age window and the
    pharmacological and metabolic conditions of the slice recording?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
  rationale: >-
    Exaggerated mGluR-LTD is the signature electrophysiological phenotype of the
    canonical model, but in the Fmr1 knockout mouse it appears only between P30
    and P60, and only when NMDA receptors are pharmacologically blocked; the
    same study concludes that hyperactive GluN2B-containing NMDA receptors, not
    the mGluR arm alone, underlie the difference. The phenotype has never been
    demonstrated in human brain tissue or human neuronal preparations. So the
    entry's mGluR node rests on a mouse measurement whose scope is narrower than
    the claim usually made from it, and the translational status of the
    phenotype is the open question rather than its existence.
  proposed_experiments:
  - experiment_id: fxs_human_mglur_ltd_organoid_test
    name: mGluR-dependent long-term depression in human FXS neural tissue
    description: >-
      Test for exaggerated mGluR-dependent long-term depression in patient
      iPSC-derived brain organoids and, where available, acute human cortical
      tissue, under both standard and NMDA-receptor-blocked conditions and
      across differentiation stages matched to the mouse age window.
    would_support:
    - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
    supporting_outcome: >-
      Human FXS neural tissue shows exaggerated mGluR-dependent long-term
      depression without requiring NMDA-receptor blockade, confirming the
      phenotype translates.
    refuting_outcome: >-
      No difference in human tissue, or a difference only under the same
      pharmacological conditions required in mouse, confining the phenotype to
      the model system.
  evidence:
  - reference: PMID:27656021
    reference_title: "Dysregulated NMDA-Receptor Signaling Inhibits Long-Term Depression in a Mouse Model of Fragile X Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As expected, in the presence of APV, we found more LTD in the mouse KO than in WT. This, however, was only observed in the p30-60 age group.
    explanation: >-
      States both limits on the phenotype in one sentence pair: it requires
      NMDA-receptor blockade and it is confined to a single postnatal window.

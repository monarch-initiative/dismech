- name: Neuronal hyperexcitability
  description: >-
    A subset of individuals with fragile X syndrome develop seizures. FMRP
    deficiency is proposed to increase neuronal excitability and susceptibility
    to epilepsy, often with childhood-onset focal seizure patterns.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      Increased neuronal excitability increases susceptibility to epilepsy and
      seizure manifestations.
  evidence:
  - reference: PMID:12418611
    reference_title: "Epilepsy in fragile X syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deficiency of FMRP (fragile X mental retardation protein) appears to lead to increased neuronal excitability and susceptibility to epilepsy, but particularly seems to facilitate mechanisms leading to the BFEC pattern.
    explanation: >-
      This clinical review explicitly connects FMRP deficiency to neuronal
      excitability and epilepsy susceptibility in fragile X syndrome.
  - reference: PMID:31880363
    reference_title: "Partial FMRP expression is sufficient to normalize neuronal hyperactivity in Fragile X neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data demonstrate that restoration of greater than 5% of overall FMRP expression levels or greater than 20% FMRP-expressing neurons in a mosaic pattern is sufficient to normalize a FMRP-dependent, hyperactive phenotype in FXS iPSC-derived neurons.
    explanation: >-
      Titrating FMRP back into patient-derived excitatory neurons shows the
      hyperactive phenotype at this node is FMRP dependent and reversible, and
      sets a low restoration threshold (above 5% of normal FMRP, or above 20% of
      neurons expressing it) for correcting it in that model system.
- name: Astrocytic GABA transport dysregulation
  biological_scale: CELLULAR
  description: >-
    FMRP is lost in astrocytes as well as neurons. Human FXS iPSC-derived and
    mouse Fmr1 knockout astrocytes accumulate GABA and the GABA-synthesizing
    enzymes GAD65/67, and deleting Fmr1 in astrocytes alone reduces inhibitory
    connectivity and degrades the fidelity of cortical temporal processing.
    This is a non-neuronal effector arm of FMRP loss that the synaptic
    translation branch does not cover. Blocking astrocytic GABA transport in the
    conditional knockout restores parvalbumin expression, EEG responses and
    exploratory behavior, which is what makes this a mechanism rather than a
    correlation. Evidence is currently one conditional-knockout study with a
    human cellular arm, so the node is model derived and awaits replication.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: gamma-aminobutyric acid transport
    term:

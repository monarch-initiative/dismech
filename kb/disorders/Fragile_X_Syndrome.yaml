  - target: Neurodevelopmental circuit dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cortical inhibitory connectivity
    description: >-
      Loss of astrocytic control over inhibition degrades cortical temporal
      processing and produces abnormal exploratory behavior in
      astrocyte-specific knockout mice.
  evidence:
  - reference: PMID:41443375
    reference_title: "Astrocytic GABA controls fidelity of temporal cortical processing in Fragile X Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our astrocyte-specific Fmr1 KO (cKO) mouse model reveals reduced inhibitory connectivity and impaired cortical responses to sound.
    explanation: >-
      Restricting the Fmr1 deletion to astrocytes still produces the inhibitory
      and cortical-processing deficit, establishing that this arm does not
      require neuronal FMRP loss.
  - reference: PMID:41443375
    reference_title: "Astrocytic GABA controls fidelity of temporal cortical processing in Fragile X Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Blocking astrocyte GABA transport enables higher PV expression, improves EEG responses to frequency-modulated sound, and corrects aberrant exploratory behavior.
    explanation: >-
      The rescue arm identifies astrocytic GABA transport specifically, rather
      than astrocyte dysfunction generally, as the step that carries the
      circuit-level and behavioral consequences.
  - reference: PMID:41443375
    reference_title: "Astrocytic GABA controls fidelity of temporal cortical processing in Fragile X Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human FXS astrocytes derived from patient-specific induced pluripotent stem cells and mouse Fmr1 knockout (KO) astrocytes display a significant increase in levels of GABA and GABA-synthesizing enzyme GAD65/67.
    explanation: >-
      The cell-culture arm shows the same GABA and GAD65/67 elevation in
      patient-derived human astrocytes as in mouse, which is the only human
      evidence currently attached to this node.
- name: Excess translation of chromatin regulators
  biological_scale: MOLECULAR
  description: >-
    Most characterized FMRP targets encode synaptic proteins, but FMRP also
    represses transcripts encoding transcriptional and chromatin-associated
    regulators, among them the BET protein BRD4. Losing that repression produces
    widespread chromatin misregulation and aberrant gene expression, and BET
    inhibition reverses several fragile X phenotypes in mice. This arm runs in
    parallel to the synaptic translation branch and is the best
    pharmacologically supported of the non-synaptic effector arms, but the
    evidence is currently mouse based and the intermediates between chromatin
    misregulation and circuit dysfunction are unresolved.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: INCREASED
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DYSREGULATED
  downstream:
  - target: Neurodevelopmental circuit dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aberrant chromatin-driven gene expression contributes to the
      neurodevelopmental phenotype, but the steps between chromatin
      misregulation and circuit-level dysfunction have not been mapped.
  evidence:
  - reference: PMID:28823556
    reference_title: "Excess Translation of Epigenetic Regulators Contributes to Fragile X Syndrome and Is Alleviated by Brd4 Inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of FMRP in mice results in widespread changes in chromatin regulation and aberrant gene expression.
    explanation: >-
      Establishes the chromatin consequence of FMRP loss as a distinct outcome
      from the synaptic one, arising from a different set of FMRP target
      transcripts.
  - reference: PMID:28823556
    reference_title: "Excess Translation of Epigenetic Regulators Contributes to Fragile X Syndrome and Is Alleviated by Brd4 Inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inhibition of Brd4 function alleviated many of the phenotypes associated with FXS.
    explanation: >-
      Pharmacological reversal through a chromatin reader, rather than through
      the mGluR pathway, is what supports treating this as a causal arm rather
      than an incidental transcriptional signature.

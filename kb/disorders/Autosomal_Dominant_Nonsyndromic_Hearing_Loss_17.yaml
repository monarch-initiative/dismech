genetic:
- name: MYH9
  features: >-
    Non-muscle myosin heavy chain IIA. Head-domain (motor) variants including
    p.Arg705His and p.Arg702Cys/His are associated with more progressive hearing
    loss than tail-domain (coiled-coil) variants. p.Arg702Cys and p.Arg702His
    were found only in the syndromic phenotypes, marking that region as critical
    to the combined macrothrombocytopenia/nephritis/deafness presentation, while
    the immediately adjacent p.Arg705His was the DFNA17 allele - a striking
    genotype-phenotype boundary within three residues, and one that the 2015
    reassessment calls into question.
  gene_term:
    preferred_term: MYH9
    term:
      id: hgnc:7579
      label: MYH9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:11023810
    reference_title: "Human nonsyndromic hereditary deafness DFNA17 is due to a mutation in nonmuscle myosin MYH9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the importance of myosins in hearing, MYH9 was tested as a candidate gene for DFNA17."
    explanation: >-
      Records how the gene was identified for this locus.
  - reference: PMID:11590545
    reference_title: "Nonmuscle myosin heavy chain IIA mutations define a spectrum of autosomal dominant macrothrombocytopenias: May-Hegglin anomaly and Fechtner, Sebastian, Epstein, and Alport-like syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R702C and R702H mutations were only associated with FTNS, EPS, or APSM, thus defining a region of MYHIIA critical in the combined pathogenesis of macrothrombocytopenia, nephritis, and deafness."
    explanation: >-
      Establishes the neighbouring-residue genotype-phenotype contrast.
  - reference: PMID:41751538
    reference_title: "The Clinical Details of MYH9-Related Disease and DFNA17 in a Large Japanese Hearing Loss Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss is more likely to progress in patients with myosin head domain variants than in patients with myosin tail domain variants"
    explanation: >-
      Domain-level genotype-phenotype correlation for hearing progression.
  - reference: PMID:25505834
    reference_title: "c.G2114A MYH9 mutation (DFNA17) causes non-syndromic autosomal dominant hearing loss in a Brazilian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation identified in our study is the same described in the prior report."
    explanation: >-
      A third, Brazilian kindred carrying the identical c.G2114A p.R705H allele,
      independently ascertained - which is what makes the allele recurrent
      rather than private.
  - reference: PMID:25505834
    reference_title: "c.G2114A MYH9 mutation (DFNA17) causes non-syndromic autosomal dominant hearing loss in a Brazilian family."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the MYH9 variant segregated with the phenotype in all affected members, except the three individuals with different phenotype."
    explanation: >-
      The segregation caveat, curated rather than dropped: three family members
      with a high-frequency-only phenotype did not carry the variant, so
      segregation in this kindred was not complete across everyone labelled
      affected. Graded PARTIAL for that reason.
animal_models:
- name: Heterozygous gene-trap Myh9 mouse (BayGenomics ES cell line)
  species: Mouse
  genotype: Myh9 gene-trap, heterozygous (homozygotes embryonic lethal)
  publication: PMID:16630581
  description: >-
    A gene-trap knockout allele, so this models *loss* of Myh9 rather than the
    human missense change. Its negative result is exactly what makes it
    informative: half-normal inner-ear Myh9 mRNA produced no hearing loss and no
    cochleosaccular degeneration even in aged animals.
  modeled_mechanisms:
  - target: Cochleosaccular Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Heterozygous Myh9 loss does not reproduce the human inner-ear lesion,
      which argues that DFNA17 is not caused by simple haploinsufficiency and
      that the p.Arg705His protein must do something a missing protein does not.
    limitations: >-
      The decisive limitation is allelic, not species: this is a null/gene-trap
      allele and the human disease is a missense change, so the model tests
      dosage rather than the mutant protein's behaviour. A knock-in of the
      orthologous missense residue would be the matching experiment and has not
      been reported. Species divergence in cochlear ageing is a secondary
      caveat, and homozygous lethality forecloses the higher-dose test.
    readouts:
    - name: Auditory function in heterozygous Myh9 mice
      target: Cochleosaccular Degeneration
      direction: UNCHANGED
      interpretation: >-
        No hearing loss despite reduced Myh9 - a genuine negative result, not a
        missing measurement.
      evidence:
      - reference: PMID:16630581
        reference_title: "Absence of hearing loss in a mouse model for DFNA17 and MYH9-related disease: the use of public gene-targeted ES cell resources."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hearing loss however was not observed in heterozygous Myh9 mice in contrast to human Myh9-related diseases."
        explanation: >-
          The negative auditory result, stated by the authors as a contrast with
          the human disease.
    - name: Cochleosaccular histology in aged heterozygous Myh9 mice
      target: Cochleosaccular Degeneration
      direction: UNCHANGED
      interpretation: >-
        The structural lesion that names the locus is also absent, so the
        negative is not merely a functional-testing artefact.
      evidence:
      - reference: PMID:16630581
        reference_title: "Absence of hearing loss in a mouse model for DFNA17 and MYH9-related disease: the use of public gene-targeted ES cell resources."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Aged heterozygous Myh9 mice also did not show signs of cochleosaccular degeneration common in DFNA17."
        explanation: >-
          Histological confirmation of the negative result in aged animals.
    evidence:
    - reference: PMID:16630581
      reference_title: "Absence of hearing loss in a mouse model for DFNA17 and MYH9-related disease: the use of public gene-targeted ES cell resources."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although inheritance of Myh9 mutations in humans is dominant, we conclude that heterozygous loss of Myh9 is not critical to hearing function in mice by itself."
      explanation: >-
        The authors' own conclusion, which is the reason this model is curated
        as informative despite - because of - its negative result.
    - reference: PMID:16630581
      reference_title: "Absence of hearing loss in a mouse model for DFNA17 and MYH9-related disease: the use of public gene-targeted ES cell resources."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We provide evidence that adult heterozygous Myh9 mouse inner ears contain half wild-type levels of Myh9 mRNA."
      explanation: >-
        Confirms the allele did reduce inner-ear Myh9, so the negative auditory
        result is not explained by a failed knockdown.
treatments:
- name: Cochlear Implantation
  description: >
    Direct electrical stimulation of the cochlear nerve for severe-to-profound
    loss, the endpoint most DFNA17/MYH9 patients reach. Outcome is reported as
    discordant between the only two DFNA17 kindreds published at the time:
    excellent in the Australian family, "poor" in the original American family,
    despite the identical p.Arg705His allele. The authors nevertheless concluded
    that implantation should be strongly considered. That discordance is
    curated rather than averaged away - with n=2 families it is as likely to
    reflect implantation era, duration of deafness, or measurement differences
    as anything biological.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:17146397
    reference_title: "Cochlear implants for DFNA17 deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, cochlear implants should be strongly considered for clinical management of patients with DFNA17 deafness."
    explanation: >-
      The authors' explicit management recommendation for this disease.
  - reference: PMID:17146397
    reference_title: "Cochlear implants for DFNA17 deafness."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "One important point of clinical relevance is the excellent outcome with cochlear implants in the Australian family compared with a \"poor\" response in the American family."
    explanation: >-
      The discordance itself. Graded PARTIAL because it qualifies the
      recommendation rather than supporting it uniformly.
  - reference: PMID:20301740
    reference_title: "MYH9-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with severe/profound deafness benefit from cochlear implantation"
    explanation: >-
      GeneReviews management statement for MYH9-RD deafness, independent of the
      two DFNA17 kindreds.
- name: Avoidance of Ototoxic, Nephrotoxic and Antiplatelet Agents
  description: >
    A drug-safety measure rather than a therapy, taken from the MYH9-RD
    GeneReviews *Agents/Circumstances to Avoid* section. It is curated here
    because it is the practical consequence of the unresolved lump/split
    question: if a DFNA17 patient is in fact within the MYH9-RD spectrum, then
    antiplatelet drugs carry bleeding risk on top of the ototoxicity concern
    that a progressive hearing loss already implies. Hazardous noise exposure
    and high-injury-risk activities are named in the same section.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301740
    reference_title: "MYH9-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Drugs that inhibit platelet function or reduce platelet count, and drugs that are ototoxic, nephrotoxic, or hepatotoxic should be used only after assessment of risk-to-benefit ratio."
    explanation: >-
      The GeneReviews agents-to-avoid statement, quoted directly.
  - reference: PMID:20301740
    reference_title: "MYH9-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hazardous noise and activities with high risk of injury should be avoided."
    explanation: >-
      The circumstances half of the same recommendation.
prevalence:
- population: Japanese hearing loss patients undergoing next-generation sequencing
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    24 patients from 18 families with MYH9-associated hearing loss were
    identified among 15,684 Japanese hearing-loss patients sequenced - roughly
    0.15% of that cohort. That figure is a diagnostic yield within an
    ascertained deafness population, NOT a population rate, so it is
    deliberately left out of rate_per_100000; it also counts all
    MYH9-associated hearing loss (MYH9-RD and DFNA17 together) rather than
    DFNA17 alone. Filling the numeric slot with it would have put ~1 in 650 in
    a structured field alongside a `prevalence_class` of ULTRA_RARE (<1 in
    1,000,000) - a three-order-of-magnitude contradiction inside one record,
    which any consumer reading the numeric slot would get wrong. The counts
    survive in this note and in the two evidence items below. No population
    prevalence for DFNA17 has been published.
  evidence:
  - reference: PMID:41751538
    reference_title: "The Clinical Details of MYH9-Related Disease and DFNA17 in a Large Japanese Hearing Loss Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we identified 24 patients from 18 families with MYH9-associated hearing loss."
    explanation: >-
      The numerator.
  - reference: PMID:41751538
    reference_title: "The Clinical Details of MYH9-Related Disease and DFNA17 in a Large Japanese Hearing Loss Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed next-generation sequencing analysis for 15,684 hearing loss patients and identified MYH9-associated hearing loss patients"
    explanation: >-
      The denominator, which is what makes the rate interpretable and also what
      limits it to a diagnostic yield.
discussions:
- discussion_id: dfna17_separate_entity_or_myh9_rd_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is DFNA17 a distinct nonsyndromic disease, or is it MYH9-related disease in
    which the haematological features were never systematically looked for?
  attaches_to:
  - "pathophysiology#MYH9 p.Arg705His Variant in the SH1 Helix"
  - "pathophysiology#Neutrophil NMMHC-IIA Inclusions"
  rationale: >-
    This is a live disagreement about whether the entity this entry describes
    exists, and it is the most important open question here. The case for
    lumping is strong and specific: Verver, Pecci and colleagues found the same
    p.Arg705His allele in two unrelated families whose affected members had
    thrombocytopenia, giant platelets, leukocyte inclusions and raised liver
    enzymes, and concluded that DFNA17 "should not be a separate genetic entity
    but part of the wide phenotypic spectrum of MYH9-RD". Because the
    haematological features of MYH9-RD are congenital and universal by
    GeneReviews' account, while the extrahaematological ones have variable
    penetrance, a kindred ascertained through an ENT clinic could easily be
    reported as nonsyndromic without anyone examining a blood film. The case for
    splitting rests mainly on the original reports and on the neighbouring-codon
    contrast, where p.Arg702Cys/His gave syndromic disease and the adjacent
    p.Arg705His did not - but that contrast was drawn before the 2015 families
    were described. Resolving this is not academic: a patient labelled DFNA17
    and not screened haematologically may have unrecognised bleeding risk, and
    the GeneReviews agents-to-avoid list would apply to them.
  proposed_experiments:
  - experiment_id: dfna17_systematic_haematology_in_reported_kindreds
    name: Systematic haematological phenotyping of all reported p.Arg705His carriers
    description: >-
      Re-examine every published p.Arg705His kindred, including the original
      American and Australian families, with platelet count, mean platelet
      volume/blood film for macrothrombocytopenia, and immunofluorescence for
      NMMHC-IIA granulocyte inclusions - the last being the pathognomonic and
      most sensitive marker. Absence of inclusions in a properly examined
      carrier would be the strongest evidence that a truly nonsyndromic
      p.Arg705His phenotype exists.
    readouts:
    - name: NMMHC-IIA granulocyte inclusions by immunofluorescence
      target: Neutrophil NMMHC-IIA Inclusions
      direction: INCREASED
      interpretation: >-
        Inclusions present in the original kindreds would settle the question in
        favour of lumping; their reproducible absence would support a genuinely
        nonsyndromic subtype.
- discussion_id: dfna17_no_knockin_missense_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any animal model reproduce what the p.Arg705His protein does, as
    opposed to what losing MYH9 does?
  attaches_to:
  - "pathophysiology#Cochleosaccular Degeneration"
  - "pathophysiology#Impaired Myosin Motility with Reduced Cross-Bridge Stiffness"
  rationale: >-
    The only reported mouse model is a gene-trap null, and it is negative: half
    the normal inner-ear Myh9 mRNA produced neither hearing loss nor
    cochleosaccular degeneration. That negative is informative - it excludes
    haploinsufficiency - but it cannot test the missense allele, because a
    missing protein cannot exhibit reduced cross-bridge stiffness or thermal
    aggregation. Meanwhile the biophysical characterisation of the mutation was
    done in *Dictyostelium* myosin II (R689H), an amoebal orthologue studied in
    vitro, and the cellular characterisation in human cancer cell lines whose
    response was itself cell-type-dependent (MDA-MB-231 responded, HeLa did
    not). So there is a chain of model systems, none of which is a mammalian
    cochlea expressing the mutant protein at endogenous levels.
  proposed_experiments:
  - experiment_id: myh9_r705h_knockin_mouse_cochlea
    name: Myh9 p.Arg705His knock-in mouse with longitudinal auditory and haematological phenotyping
    description: >-
      Generate a knock-in of the orthologous missense residue and follow ABR
      thresholds, cochleosaccular histology, platelet count and volume, and
      granulocyte NMMHC-IIA inclusions over the lifespan. Because the model
      would carry the mutant protein rather than lack it, it tests both the
      mechanism and, incidentally, the lump/split question: a knock-in with
      macrothrombocytopenia and deafness would be MYH9-RD, not DFNA17.
    readouts:
    - name: ABR threshold shift over the lifespan in knock-in mice
      target: Cochleosaccular Degeneration
      direction: INCREASED
      interpretation: >-
        Progressive threshold elevation absent from the gene-trap heterozygote
        would confirm that the missense protein, not reduced dosage, drives the
        phenotype.
differential_diagnoses:
- name: MYH9-related disease (macrothrombocytopenia and granulocyte inclusions spectrum)
  description: >-
    Not merely a differential but a candidate identity: this is the entity into
    which some authors would fold DFNA17 entirely. MYH9-RD absorbed the
    historical May-Hegglin anomaly and the Fechtner, Sebastian, Epstein and
    Alport-like syndromes once all were found to be MYH9. Its haematological
    features are congenital and universal; its hearing loss, nephropathy,
    cataract and liver-enzyme elevation are variably penetrant lifetime
    manifestations. The discriminating test is not the audiogram but the blood
    film and granulocyte immunofluorescence.
  disease_term:
    preferred_term: MYH9-related disease
    term:
      id: MONDO:0015912
      label: macrothrombocytopenia and granulocyte inclusions with or without nephritis or sensorineural hearing loss
  distinguishing_features:
  - Congenital macrothrombocytopenia with NMMHC-IIA granulocyte inclusions is universal in MYH9-RD; DFNA17 is defined by its absence - but that absence has been asserted rather than systematically excluded in the original kindreds.
  - The same p.Arg705His allele has now been reported with full MYH9-RD haematology, so the allele itself does not discriminate.
  - p.Arg702Cys and p.Arg702His, three residues away, were found only in the syndromic phenotypes - the historical basis for treating 705 as a nonsyndromic position.
  - Glomerular nephropathy and presenile cataract are MYH9-RD lifetime manifestations with variable penetrance; neither was reported in the p.Arg705His families, so they discriminate MYH9-RD from DFNA17 as currently reported - and are the features whose appearance in a DFNA17 patient would settle the lump/split question against a separate entity.
  evidence:
  - reference: PMID:20301740
    reference_title: "MYH9-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including sensorineural hearing loss, renal disease (manifesting initially as glomerular nephropathy), presenile cataracts, and/or elevation of liver enzymes"
    explanation: >-
      GeneReviews enumerates the extrahematologic manifestations that develop
      over a lifetime in MYH9-RD. Curated on the differential rather than as
      DFNA17 phenotypes: nephropathy and presenile cataract have not been
      reported in p.Arg705His carriers, so asserting them in this entry's
      `phenotypes:` would export an unsupported disease-phenotype claim.
  - reference: PMID:24890873
    reference_title: "R705H mutation of MYH9 is associated with MYH9-related disease and not only with non-syndromic deafness DFNA17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that DFNA17 should not be a separate genetic entity but part of the wide phenotypic spectrum of MYH9-RD characterized by congenital hematological manifestations and variable penetrance and expressivity of the extra-hematological features."
    explanation: >-
      The explicit argument that this entry's subject is not a separate entity,
      curated in the entry it argues against.
  - reference: PMID:11590545
    reference_title: "Nonmuscle myosin heavy chain IIA mutations define a spectrum of autosomal dominant macrothrombocytopenias: May-Hegglin anomaly and Fechtner, Sebastian, Epstein, and Alport-like syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, our data suggest that MHA, SBS, FTNS, EPS, and APSM comprise a phenotypic spectrum of disorders, all caused by MYH9 mutations."
    explanation: >-
      The earlier lumping event that created MYH9-RD out of five named
      syndromes - the precedent for lumping DFNA17 into it as well.
notes: >-
  Lump/split status: UNRESOLVED, and deliberately left so. MONDO and OMIM both
  keep DFNA17 (MONDO:0011350, OMIM:603622) distinct from MYH9-RD
  (MONDO:0015912, OMIM:155100), which is why this entry exists under its own
  term. But PMID:24890873 argues directly that it should not, and that argument
  is curated as a `KNOWLEDGE_GAP` discussion and as the leading differential
  diagnosis rather than being resolved by curator preference. The MYH9-RD
  spectrum phenotypes that are directly evidenced in p.Arg705His carriers
  (macrothrombocytopenia, raised liver enzymes) are curated on this entry, so
  that if the lumping view prevails it converts to a `has_subtypes` entry on an
  MYH9-RD parent without the evidence having to be re-gathered. Nephropathy and
  presenile cataract are NOT curated here - they are carried on the MYH9-RD
  differential instead, because they rest only on GeneReviews statements about
  MYH9-RD and have not been reported in carriers of this allele. On the
  differential they do more work anyway: they are the features whose appearance
  in a DFNA17 patient would settle the lump/split question. If a curator
  later creates an MYH9-RD entry, the two should be reconciled deliberately
  rather than left to drift.

  A lesson this entry paid for, worth keeping because it generalizes. The
  prevalence record originally carried `rate_per_100000: 153.0` next to
  `prevalence_class: ULTRA_RARE`, three orders of magnitude apart, with a note
  beside the slot that already said "a rate per 100,000 in this slot invites
  being read as a population prevalence, which it is not" - and the slot was
  populated anyway. **Prose disclaiming a structured value does not neutralise
  it; the structured value is what exports.** The same test is what moved
  nephropathy and cataract off `phenotypes:` and onto the differential.

  The same reasoning was applied to two phenotypes on the reviewer's
  suggestion. `Nephropathy` and `Presenile cataract` were supported only by
  GeneReviews statements about MYH9-RD and have not been reported in
  p.Arg705His carriers, so their `phenotypes:` entries asserted something the
  evidence did not support however carefully the descriptions hedged. Both are
  now carried on the MYH9-RD differential, where they do real work - they are
  the features whose appearance in a DFNA17 patient would settle the lump/split
  question. Macrothrombocytopenia and elevated liver enzymes stay as
  phenotypes, being directly evidenced in carriers of this allele.

  `Bilateral profound hearing loss` is bound to HP:0011476 (Profound
  sensorineural hearing impairment) and carries no `severity:` qualifier: the
  term already encodes *profound*, and `SeverityQualifierEnum` tops out at
  `SEVERE`, which HPO grades as the adjacent *lower* band (HP:0012828 vs
  HP:0012829). Adding it would have made the record say two slightly different
  things. Laterality drops out of the structured slot in that swap but survives
  in the phenotype name, the snippet, and the first phenotype's description;
  severity was the real discriminator between the two.

  GeneReviews baseline. There is no GeneReviews chapter for DFNA17. The
  MYH9-Related Disease chapter (PMID:20301740) was used as the phenotype
  baseline and is tagged `GeneReviews` in `references:`, on the reasoning that
  the lumping argument makes it the relevant expert source. Its
  *Agents/Circumstances to Avoid* section is curated as a treatment entry rather
  than left in prose, because the antiplatelet-drug warning is exactly what a
  patient mislabelled as nonsyndromic would not receive. Its Clinical
  Characteristics list was cross-referenced and all four extrahaematologic
  manifestations it names are represented as phenotypes.

  Evidence-source tagging. The biophysical mechanism (PMID:16901894) was
  measured on *Dictyostelium* myosin II carrying R689H, the orthologous residue,
  in single-molecule and biochemical assays - tagged IN_VITRO rather than
  MODEL_ORGANISM because the experiments are on purified protein and in vitro
  motility rather than in a living organism. Cochlear MYH9 immunolocalization
  (PMID:11023810, PMID:41751538) is rat/rodent and tagged MODEL_ORGANISM.

  Deep-research ontology suggestions were checked, not copied. The report
  suggested CL:0002167 and CL:0002165 for the cochlear hair cells; OAK resolves
  those to *olfactory epithelial cell* and *phalangeal cell* respectively.
  Neither is a hair cell. The terms used here are CL:0000589 (cochlear inner
  hair cell) and CL:0000601 (cochlear outer hair cell). Note also that a plain
  lookup of "hair cell" resolves to CL:0000374 *trichogen cell*, an insect
  hair-forming cell - a trap for anyone binding auditory hair cells by label
  alone. This is the second entry in this curation batch where a deep-research
  report proposed a real-but-wrong ontology identifier, which is worth flagging
  as a pattern: the suggested identifiers resolve, so nothing but a lookup
  catches them.

  The report's one unresolved reference is a parsing artifact, not a
  fabrication. Its `reference_validation` block sets `needs_review: true` on a
  single unresolved identifier,
  `DOI:10.3390/genes17020154)](https://pmc.ncbi.nlm.nih.gov/articles/PMC12941242/`
  - a DOI with a markdown link tail glued onto it. The underlying DOI
  10.3390/genes17020154 is Genes (Basel) 2026, i.e. PMID:41751538, which this
  entry already cites directly and correctly. `just preflight-dr` returned PASS
  (MYH9 mentioned 56 times, report OMIM 603622 matching the MONDO xref).

  Kindred count. PMID:17146397 (2006) described its Australian family as "only
  the second DFNA17 family to be reported". A third, Brazilian kindred with the
  identical allele was published in 2014 (PMID:25505834), so that count is
  superseded - and in that family the variant did not segregate with three
  relatives who had a high-frequency-only phenotype, which is curated as a
  PARTIAL evidence item rather than smoothed over.

  Not curated. PMID:9915977 (the 1999 locus-mapping paper naming
  cochleosaccular degeneration) and PMID:12408071 (Auditory phenotype of
  DFNA17) both cache with no retrievable content, so neither could supply a
  quotable snippet despite being directly on topic; they are recorded here as
  leads for a curator with full-text access. The cochleosaccular-degeneration
  claim is instead carried by PMID:11023810, which names the lesion in its
  abstract.

  Prevalence caution. The one `prevalence` record is a diagnostic yield among
  sequenced Japanese hearing-loss patients and covers all MYH9-associated
  hearing loss, not DFNA17 alone. It is entered with `measure_type:
  CASES_IN_LITERATURE` and a note saying so, because a rate per 100,000 in this
  slot invites being read as a population prevalence, which it is not.

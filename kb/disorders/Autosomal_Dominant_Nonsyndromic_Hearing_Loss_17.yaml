inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous MYH9 allele co-segregates with hearing impairment.
    Note that heterozygous *loss* of Myh9 does not reproduce the phenotype in
    mice, so dominance here is not simple haploinsufficiency.
  evidence:
  - reference: PMID:11023810
    reference_title: "Human nonsyndromic hereditary deafness DFNA17 is due to a mutation in nonmuscle myosin MYH9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of MYH9 in a family with DFNA17 identified, at nucleotide 2114, a G-->A transposition that cosegregated with the inherited autosomal dominant hearing impairment."
    explanation: >-
      Co-segregation of a heterozygous allele with dominant hearing impairment.
pathophysiology:
- name: MYH9 p.Arg705His Variant in the SH1 Helix
  biological_scale: MOLECULAR
  description: >-
    A heterozygous c.2114G>A missense change converting an invariant arginine at
    codon 705 to histidine, within the highly conserved SH1 linker of non-muscle
    myosin heavy chain IIA. The SH1 helix is the joint connecting the converter
    subdomain to the rest of the motor domain, which is why a substitution here
    was expected to affect motor function rather than expression level.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:11023810
    reference_title: "Human nonsyndromic hereditary deafness DFNA17 is due to a mutation in nonmuscle myosin MYH9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation changes codon 705 from an invariant arginine (R) to histidine (H), R705H, within a highly conserved SH1 linker region."
    explanation: >-
      Identifies the variant and locates it in the SH1 linker.
  - reference: PMID:16901894
    reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SH1 helix is the joint that connects the converter subdomain to the other domains, and is thought to play an important role in arrangements of the converter relative to the motor."
    explanation: >-
      Establishes what the SH1 helix does, which is the structural basis for
      expecting a mechanical rather than expression-level defect.
  downstream:
  - target: Impaired Myosin Motility with Reduced Cross-Bridge Stiffness
    causal_link_type: DIRECT
    description: >-
      Substituting the SH1-helix arginine degrades the motor's mechanical
      output.
    evidence:
    - reference: PMID:16901894
      reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutation resulted in a significant impairment in motile activities, whereas actin-activated ATPase activity was only slightly affected."
      explanation: >-
        The defining dissociation: motility fails while catalysis is nearly
        intact, so this is not a simple loss of enzyme activity.
  - target: NMMHC-IIA Thermal Destabilization and Aggregation
    causal_link_type: DIRECT
    description: >-
      The same substitution lowers the protein's thermal stability, a separate
      consequence from the mechanical one.
    evidence:
    - reference: PMID:16901894
      reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the mutation was also shown to reduce thermal stability and induce thermal aggregation of the protein, which might be implicated in the disease process"
      explanation: >-
        Reports the stability/aggregation arm, with the authors' own hedge that
        it "might be" implicated.
- name: Impaired Myosin Motility with Reduced Cross-Bridge Stiffness
  biological_scale: MOLECULAR
  description: >-
    Single-molecule optical-trap measurements on the equivalent Dictyostelium
    myosin II mutation show that step size is preserved but cross-bridge
    stiffness falls, so the motor is less stiff rather than less powerful. The
    authors interpret the slower motility as altered kinetics and infer that the
    SH1 helix modulates myosin elasticity through converter flexibility.
  molecular_functions:
  - preferred_term: microfilament motor activity
    modifier: DECREASED
    term:
      id: GO:0000146
      label: microfilament motor activity
  evidence:
  - reference: PMID:16901894
    reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Single molecule mechanical measurements using optical trap showed that the step size was not shortened by the mutation, suggesting that the slower motility is caused by altered kinetics."
    explanation: >-
      Distinguishes a kinetic/elastic defect from a shortened working stroke.
  - reference: PMID:16901894
    reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The single molecule measurements demonstrated that the mutation significantly reduced cross-bridge stiffness."
    explanation: >-
      The direct measurement this node is named for.
  downstream:
  - target: Cytokinesis Failure and Altered Cell Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Non-muscle myosin IIA drives the cytokinetic ring, so a motility defect is
      the plausible route to the cytokinesis failure observed on expressing the
      mutant allele. The intervening steps were not established.
    evidence:
    - reference: PMID:20416459
      reference_title: "In vitro expression and characterization of MYH9 mutant alleles linked to hereditary hearing loss."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "MDA-MB-231 cells transfected with MYH9(R705H) but not MYH9(R702C) were found to have a greater than two-fold increase in cells with filopodia and a ten-fold increase in proportion of cells with multiple nuclei, indicating inhibition of cytokinesis, relative to the control cells transfected with wild type MYH9."
      explanation: >-
        Documents the cellular phenotype. Graded PARTIAL because the study shows
        the allele causes it, not that the stiffness defect specifically does.
  - target: Cochleosaccular Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The proposed route from the molecular defect to the inner-ear lesion. The
      founding study was explicit that this step is not understood.
    evidence:
    - reference: PMID:11023810
      reference_title: "Human nonsyndromic hereditary deafness DFNA17 is due to a mutation in nonmuscle myosin MYH9."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Both the precise role of MYH9 in the cochlea and the mechanism by which the R705H mutation leads to the DFNA17 phenotype (progressive hearing impairment and cochleosaccular degeneration) remain to be elucidated."
      explanation: >-
        Cited as an explicit statement that the link is unresolved - PARTIAL
        because it names the gap rather than filling it.
- name: NMMHC-IIA Thermal Destabilization and Aggregation
  biological_scale: MOLECULAR
  description: >-
    The variant protein is thermally less stable and aggregates. This matters
    because aggregation of NMMHC-IIA is the pathognomonic cellular lesion of
    MYH9-related disease, where mutant protein forms visible inclusions in
    neutrophil cytoplasm - the same physical behaviour, seen in a different
    cell type.
  biological_processes:
  - preferred_term: protein-containing complex assembly
    modifier: INCREASED
    term:
      id: GO:0065003
      label: protein-containing complex assembly
  evidence:
  - reference: PMID:16901894
    reference_title: "A point mutation in the SH1 helix alters elasticity and thermal stability of myosin II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutation was also shown to reduce thermal stability and induce thermal aggregation of the protein, which might be implicated in the disease process"
    explanation: >-
      The biophysical measurement behind this node.
  - reference: PMID:24890873
    reference_title: "R705H mutation of MYH9 is associated with MYH9-related disease and not only with non-syndromic deafness DFNA17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH9-RD patients have macrothrombocytopenia and granulocyte inclusions (pathognomonic sign of the disease) containing wild-type and mutant NMMHC-IIA."
    explanation: >-
      Shows that NMMHC-IIA aggregation is an observed lesion in patients
      carrying MYH9 variants, and that the inclusions contain wild-type protein
      too - consistent with the mutant sequestering the normal product.
  downstream:
  - target: Neutrophil NMMHC-IIA Inclusions
    causal_link_type: DIRECT
    description: >-
      In granulocytes the aggregated protein is visible as cytoplasmic
      inclusions, the pathognomonic sign of MYH9-RD - present in the
      p.Arg705His families reported by Verver and colleagues.
    evidence:
    - reference: PMID:24890873
      reference_title: "R705H mutation of MYH9 is associated with MYH9-related disease and not only with non-syndromic deafness DFNA17."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified the same mutation in two unrelated families, whose four affected individuals had not only hearing impairment but also thrombocytopenia, giant platelets, leukocyte inclusions, as well as mild to moderate elevation of some liver enzymes."
      explanation: >-
        Documents leukocyte inclusions in p.Arg705His carriers specifically.
- name: Cytokinesis Failure and Altered Cell Morphology
  biological_scale: CELLULAR
  description: >-
    Expressing the mutant allele produces multinucleate cells and excess
    filopodia. The effect is cell-type-dependent: MDA-MB-231 cells respond,
    HeLa cells are refractory, and the actin cytoskeleton itself is unaffected.
    That selectivity is worth preserving, because it is the sort of context
    dependence that could explain why one variant produces an organ-restricted
    phenotype.
  biological_processes:
  - preferred_term: cytokinesis
    modifier: DECREASED
    term:
      id: GO:0000910
      label: cytokinesis
  evidence:
  - reference: PMID:20416459
    reference_title: "In vitro expression and characterization of MYH9 mutant alleles linked to hereditary hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike MDA-MB-231 cells, HeLa cells were refractory to MYH9(R705H) and MYH9(R702C)."
    explanation: >-
      The cell-type dependence, curated so it is not lost when the positive
      result is quoted alone.
  - reference: PMID:20416459
    reference_title: "In vitro expression and characterization of MYH9 mutant alleles linked to hereditary hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Actin cytoskeleton configuration within MDA-MB-231 cells was unaffected by expression of MYH9(R702C) or MYH9(R705H)."
    explanation: >-
      A negative result that narrows the defect: the motor is affected, the
      actin scaffold is not.
- name: Cochleosaccular Degeneration
  biological_scale: TISSUE
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult"
  description: >-
    Degeneration of the cochlear and saccular sensory epithelia. This was the
    lesion the DFNA17 locus was named for at mapping, before the gene was known.
    NMMHC-IIA is expressed in the organ of Corti, the subcentral region of the
    spiral ligament and the Reissner membrane, giving the protein a plausible
    site of action; in rodent inner ear it is reported in stereocilia hair
    cells, spiral ligament and spiral limbus. Conformance is asserted at the
    module's sensory-epithelium-insult node, not at hair-cell mechanotransduction
    death, because no study has shown hair-cell mechanotransduction failure for
    this variant.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:11023810
    reference_title: "Human nonsyndromic hereditary deafness DFNA17 is due to a mutation in nonmuscle myosin MYH9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MYH9 was immunolocalized in the organ of Corti, the subcentral region of the spiral ligament, and the Reissner membrane."
    explanation: >-
      Localizes the protein to the structures that degenerate. Rat cochlea, so
      tagged MODEL_ORGANISM.
  - reference: PMID:41751538
    reference_title: "The Clinical Details of MYH9-Related Disease and DFNA17 in a Large Japanese Hearing Loss Cohort."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "According to studies using rodent inner ears, NMMHC-IIA is also expressed predominantly in the hair cells of the stereocilia, spiral ligament, and spiral limbus."
    explanation: >-
      Independent statement of inner-ear expression, again in rodent.
  - reference: PMID:16862555
    reference_title: "Expression of Myh9 in the mammalian cochlea: localization within the stereocilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Confocal microscopy of cochlear surface preparations, identified Myh9 within the inner and outer hair cells and their stereocilia."
    explanation: >-
      Subcellular localization to hair cells and their stereocilia, which is the
      basis for the two hair-cell CL annotations on this node.
  - reference: PMID:16862555
    reference_title: "Expression of Myh9 in the mammalian cochlea: localization within the stereocilia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Localization of Myh9 within the stereocilia raises the possibility that mutations of MYH9 may effect hearing loss though disruption of the stereocilia structure."
    explanation: >-
      The stereocilia-disruption hypothesis, curated with the authors' own hedge
      intact - graded PARTIAL because "raises the possibility" is a proposal,
      not a demonstration.
  - reference: PMID:16862555
    reference_title: "Expression of Myh9 in the mammalian cochlea: localization within the stereocilia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The Myh9 antibody cross-reacts with the rat but not the human orthologue."
    explanation: >-
      Graded PARTIAL because this *limits* the localization evidence rather
      than supporting the node: the reagent underlying every localization claim
      here does not recognize human MYH9, so all of this anatomy is rodent.
  downstream:
  - target: Progressive sensorineural hearing loss
    causal_link_type: DIRECT
    description: >-
      Loss of the cochlear sensory epithelium produces the sensorineural
      deficit and its progression.
    evidence:
    - reference: PMID:41751538
      reference_title: "The Clinical Details of MYH9-Related Disease and DFNA17 in a Large Japanese Hearing Loss Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hearing loss is more likely to progress in patients with myosin head domain variants than in patients with myosin tail domain variants, but hearing loss in each set of patients finally deteriorates to bilateral profound hearing loss."
      explanation: >-
        Documents progression to profound loss, and the head-versus-tail domain
        correlation that places p.Arg705His (a head-domain variant) in the
        faster-progressing group.
- name: Neutrophil NMMHC-IIA Inclusions
  biological_scale: CELLULAR
  description: >-
    Cytoplasmic aggregates of NMMHC-IIA in granulocytes, historically called
    Doehle body-like inclusions, containing both mutant and wild-type protein.
    They are pathognomonic of MYH9-related disease, and their presence in
    p.Arg705His carriers is the single strongest argument that DFNA17 is not
    nonsyndromic. This node exists precisely so the entry can carry that
    evidence rather than define it away.
  cell_types:

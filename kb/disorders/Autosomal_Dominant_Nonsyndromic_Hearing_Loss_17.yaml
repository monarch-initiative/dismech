name: Autosomal Dominant Nonsyndromic Hearing Loss 17
creation_date: "2026-08-22T15:00:00Z"
category: Genetic
description: >
  DFNA17 is autosomal dominant, adult-onset, progressive sensorineural hearing
  loss caused by the MYH9 missense variant p.Arg705His, which sits in the SH1
  helix of non-muscle myosin heavy chain IIA (NMMHC-IIA). It was defined as a
  *nonsyndromic* entity: hearing loss with none of the haematological or
  systemic features that accompany MYH9 variants elsewhere in the gene.

  **Whether DFNA17 is a distinct disease is genuinely disputed, and this entry
  does not settle it.** MYH9 variants also cause MYH9-related disease (MYH9-RD),
  a spectrum absorbing the historical May-Hegglin, Sebastian, Fechtner, Epstein
  and Alport-like syndromes, in which congenital macrothrombocytopenia with
  neutrophil NMMHC-IIA inclusions is universal and hearing loss, nephropathy,
  cataract and raised liver enzymes appear over a lifetime. In 2015 Verver,
  Pecci and colleagues found the *same* p.Arg705His allele in two unrelated
  families whose affected members had not only hearing impairment but also
  thrombocytopenia, giant platelets, leukocyte inclusions and raised liver
  enzymes, and argued explicitly that DFNA17 "should not be a separate genetic
  entity" but part of the MYH9-RD spectrum. On that reading the original
  families were not nonsyndromic; their haematology was never looked at closely
  enough. The entry is curated under its own MONDO term because MONDO and OMIM
  keep it distinct, but the lumping argument is recorded as an open discussion
  rather than buried, and the MYH9-RD features are curated as phenotypes so an
  entry that turns out to be a subtype does not have to be rebuilt.

  The mechanism is not haploinsufficiency. Heterozygous gene-trap Myh9 mice
  carrying half the normal Myh9 mRNA in the inner ear have *no* hearing loss and
  no cochleosaccular degeneration, so losing one working copy is not what
  produces the human phenotype. What p.Arg705His does instead, studied in the
  Dictyostelium myosin II equivalent (R689H), is impair motility while barely
  touching actin-activated ATPase, reduce cross-bridge stiffness, and reduce
  thermal stability to the point of inducing protein aggregation - a
  mechanoelastic and stability defect rather than a loss of catalytic power.

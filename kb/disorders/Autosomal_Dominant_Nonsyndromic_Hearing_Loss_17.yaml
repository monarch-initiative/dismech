    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aggregates of the MYH9 protein in the cytoplasm of neutrophil granulocytes"
    explanation: >-
      GeneReviews states the inclusion as a universal feature of MYH9-RD.
  - reference: PMID:24890873
    reference_title: "R705H mutation of MYH9 is associated with MYH9-related disease and not only with non-syndromic deafness DFNA17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leukocyte inclusions, as well as mild to moderate elevation of some liver enzymes"
    explanation: >-
      Reports leukocyte inclusions in p.Arg705His carriers.

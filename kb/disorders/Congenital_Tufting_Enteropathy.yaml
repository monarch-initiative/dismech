treatments:
- name: Parenteral Nutrition
  description: >-
    Parenteral nutrition is the mainstay of supportive care, required because
    enteral feeding worsens the diarrhea and the epithelium cannot absorb
    adequately. The degree of dependence varies: some patients require total
    parenteral nutrition indefinitely while others need only limited parenteral
    support. It carries the usual burden of long-term intravenous nutrition -
    liver disease, infection and vascular complications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Loss of Absorptive and Ion-Transport Function
    treatment_effect: BYPASSES
    description: >-
      Intravenous nutrition bypasses the failed absorptive epithelium; it does
      not act on EpCAM loss or restore junctional integrity.
    evidence:
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These findings provide a rationale as to why parenteral nutrition is
        often the only reliable source of nutrients in these patients and the
        clinical observation that enteral feeding has been shown to worsen CTE
      explanation: >-
        Explains why parenteral nutrition is required and ties that requirement
        to the absorptive and disaccharidase defects of this node.
- name: Intestinal Transplantation
  description: >-
    Small-bowel transplantation is the only accepted cure, but is not a
    first-line treatment: the natural history is variable and some patients
    improve substantially over time, so the decision must weigh transplant
    morbidity against that possibility.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Loss of Absorptive and Ion-Transport Function
    treatment_effect: RESTORES
    description: >-
      Donor intestine carrying functional EPCAM restores an intact epithelium
      with normal junctions and absorptive capacity.
    evidence:
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Although small bowel transplantation is the only accepted cure for CTE to
        date, transplantation should not be the first line of treatment given the
        varied natural history of the disease, with some patients showing
        significant improvement over time.
      explanation: >-
        States both that transplantation is the only cure and the clinical
        caveat against using it first-line.

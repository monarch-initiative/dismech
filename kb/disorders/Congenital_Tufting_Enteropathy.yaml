has_subtypes:
- name: EPCAM form
  display_name: EPCAM-associated tufting enteropathy (non-syndromic)
  genes:
  - preferred_term: EPCAM
    term:
      id: hgnc:11529
      label: EPCAM
  review_notes: >-
    No subtype_term is bound. MONDO has no term for the EPCAM form distinct from
    the entry's own disease_term (MONDO:0013184, whose causal gene is EPCAM), so
    binding one would be circular. Per the project's term guidance, no term beats
    a bad one; the subtype is identified by its gene instead.
  description: >-
    The commoner form, accounting for about three-quarters of reported cases.
    Intestinal disease predominates; extraintestinal features, when present, are
    more often arthritis and other systemic manifestations.
- name: SPINT2 syndromic form
  display_name: SPINT2-associated syndromic tufting enteropathy
  genes:
  - preferred_term: SPINT2
    term:
      id: hgnc:11247
      label: SPINT2
  review_notes: >-
    No subtype_term is bound. MONDO's nearest term, MONDO:0034204 syndromic
    congenital sodium diarrhea, is a different disease that happens to share the
    SPINT2 gene and some extraintestinal features; binding it here would assert a
    false identity. Left unbound deliberately rather than forced.
  description: >-
    About a quarter of reported cases. Intestinal pathology is indistinguishable
    from the EPCAM form, but extraintestinal features are prominent -
    ophthalmological disease (punctate keratitis, corneal erosion, cataract) and
    atresias (anal, intestinal, choanal). Mechanistically it converges on EpCAM
    loss via unrestrained matriptase activity.
diagnosis:
- name: Duodenal biopsy with histology
  description: >-
    Esophagogastroduodenoscopy with duodenal biopsy is the diagnostic mainstay,
    showing villous atrophy, crypt hyperplasia and focal epithelial tufts. EpCAM
    immunohistochemistry showing reduced or mislocalized protein supports the
    diagnosis.
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CTE is generally diagnosed by esophagogastroduodenoscopy, noting duodenal
      histological abnormalities.
    explanation: >-
      States the diagnostic procedure and the tissue on which the diagnosis
      rests.
- name: EPCAM and SPINT2 sequencing
  description: >-
    Molecular confirmation by sequencing EPCAM and SPINT2. With broader access to
    genomic testing, patients may now be identified genetically before mucosal
    findings are available.
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Given the recent advancement in genetic technologies and improved access to
      whole-genome testing, patients may be identified by genetics even prior to
      the identification of mucosal findings.
    explanation: >-
      Supports genomic testing as an increasingly primary diagnostic route.
treatments:
- name: Parenteral Nutrition
  description: >-
    Parenteral nutrition is the mainstay of supportive care, required because
    enteral feeding worsens the diarrhea and the epithelium cannot absorb
    adequately. The degree of dependence varies: some patients require total
    parenteral nutrition indefinitely while others need only limited parenteral
    support. It carries the usual burden of long-term intravenous nutrition -
    liver disease, infection and vascular complications.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Total Parenteral Nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Loss of Absorptive and Ion-Transport Function
    treatment_effect: BYPASSES
    description: >-
      Intravenous nutrition bypasses the failed absorptive epithelium; it does
      not act on EpCAM loss or restore junctional integrity.
    evidence:
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These findings provide a rationale as to why parenteral nutrition is
        often the only reliable source of nutrients in these patients and the
        clinical observation that enteral feeding has been shown to worsen CTE
      explanation: >-
        Explains why parenteral nutrition is required and ties that requirement
        to the absorptive and disaccharidase defects of this node.
- name: Intestinal Transplantation
  description: >-
    Small-bowel transplantation is the only accepted cure, but is not a
    first-line treatment: the natural history is variable and some patients
    improve substantially over time, so the decision must weigh transplant
    morbidity against that possibility.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Small Bowel Transplantation
    term:
      id: NCIT:C157985
      label: Small Bowel Transplantation
  target_mechanisms:
  - target: Loss of Absorptive and Ion-Transport Function
    treatment_effect: RESTORES
    description: >-
      Donor intestine carrying functional EPCAM restores an intact epithelium
      with normal junctions and absorptive capacity.
    evidence:
    - reference: PMID:33374714
      reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Although small bowel transplantation is the only accepted cure for CTE to
        date, transplantation should not be the first line of treatment given the
        varied natural history of the disease, with some patients showing
        significant improvement over time.
      explanation: >-
        States both that transplantation is the only cure and the clinical
        caveat against using it first-line.

name: Congenital Tufting Enteropathy
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- CTE
- intestinal epithelial dysplasia
- congenital diarrhea 5 with tufting enteropathy
- familial enteropathy
description: >-
  Congenital tufting enteropathy (CTE) is a rare autosomal recessive congenital
  enteropathy of infancy and, with microvillus inclusion disease, one of the two
  prototypes of the "defective enterocyte trafficking and polarity" class of
  congenital diarrheas and enteropathies (CODEs). Biallelic variants in EPCAM,
  encoding the epithelial cell adhesion molecule, account for roughly
  three-quarters of reported cases; variants in SPINT2, encoding the serine
  protease inhibitor HAI-2, cause a syndromic form and act through the same final
  pathway, since loss of functional HAI-2 permits unrestrained matriptase
  activity that in turn destroys EpCAM. EpCAM is required to recruit claudin-7
  to the tight junction, so its loss disassembles the apical junctional complex,
  degrades barrier function and disorganises epithelial polarity. The
  histological signature is focal crowding of disorganised enterocytes at the
  villus tips - the "tufts" - on a background of villous atrophy and crypt
  hyperplasia without an inflammatory infiltrate. Affected infants have profuse
  watery diarrhea with both secretory and osmotic components, electrolyte
  disturbance and impaired growth, leading to intestinal failure and dependence
  on parenteral nutrition; most never achieve enteral autonomy. Extraintestinal
  features segregate with genotype: arthritis and other systemic features are
  more common with EPCAM variants, whereas ophthalmological disease (punctate
  keratitis, corneal erosions, cataract) and atresias (anal, intestinal,
  choanal) are more common with SPINT2 variants.

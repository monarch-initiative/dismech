phenotypes:
- name: Intractable Watery Diarrhea
  category: Gastrointestinal
  description: >-
    Profuse watery, sodium-losing diarrhea that usually begins between birth and
    three months of age, with both secretory and osmotic components. It persists
    whether the infant is fed or fasted, but is generally much worse with enteral
    intake, and fasting improves stool output in some cases. It is the defining
    presenting feature of the disease.
  phenotype_term:
    preferred_term: Intractable watery diarrhea
    term:
      id: HP:0002041
      label: Intractable diarrhea
    temporality: CHRONIC
    onset:
      min_age_years: 0.0
      max_age_years: 0.25
      notes: >-
        Usually presents from birth to 3 months of life; this range spans the
        HPO neonatal and infantile onset categories, so no single category is
        assigned.
  frequency: OBLIGATE
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Watery diarrhea is abundant in CTE patients irrespective of whether the
      infant is fed or fasted
    explanation: >-
      Documents the feeding-independent diarrhea that distinguishes CTE from the
      substrate-dependent diet-induced congenital diarrheas.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CTE, also known as intestinal epithelial dysplasia, is a rare, autosomal

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    CTE is inherited in an autosomal recessive manner. Affected individuals are
    homozygous or compound heterozygous; parents are unaffected carriers, and
    consanguinity is common in reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:

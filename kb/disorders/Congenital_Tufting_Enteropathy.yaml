    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CTE is generally diagnosed by esophagogastroduodenoscopy, noting duodenal
      histological abnormalities.
    explanation: >-
      States the diagnostic procedure and the tissue on which the diagnosis
      rests.

notes: >-
  CTE belongs to the defective enterocyte trafficking and polarity class of
  congenital diarrheas and enteropathies, with microvillus inclusion disease, and
  is curated as a conformer of the enterocyte_polarity_trafficking_failure
  module. CTE enters that module through its junctional-adhesion arm (EpCAM
  loss), microvillus inclusion disease through its apical-trafficking arm
  (MYO5B/STX3); the two arms converge on loss of a functionally polarized
  absorptive surface but are molecularly distinct and histologically
  distinguishable, so each entry substitutes its own lesion. It
  deliberately does NOT conform to the diet_induced_osmotic_diarrhea module:
  although CTE has an osmotic component, the module requires a normal
  villus-to-crypt ratio and substrate-dependent diarrhea remitting on dietary
  withdrawal, whereas CTE has villous atrophy and diarrhea that persists when the
  infant is fasted. The osmotic component here is a downstream consequence of
  junctional and transporter loss, not a primary substrate-specific digestive
  defect. The prevalence figure is recorded with rate_low/rate_high because the
  source gives a range; the prevalence_class band is assigned from the upper end
  of the reported range.

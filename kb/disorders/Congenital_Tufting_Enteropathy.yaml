    Esophagogastroduodenoscopy with duodenal biopsy is the diagnostic mainstay,
    showing villous atrophy, crypt hyperplasia and focal epithelial tufts. EpCAM
    immunohistochemistry showing reduced or mislocalized protein supports the
    diagnosis.
  evidence:
  - reference: PMID:33374714

pathophysiology:
- name: Loss of Functional EpCAM at the Epithelial Cell Surface
  conforms_to: "enterocyte_polarity_trafficking_failure#Loss of Apical Delivery or Junctional Adhesion Machinery"
  description: >-
    The initiating lesion. EpCAM is a transmembrane glycoprotein localized to the
    tight junctions, adherens junctions and lateral membrane of intestinal
    epithelial cells. Biallelic EPCAM variants reduce its abundance or mislocalize
    it, and the syndromic SPINT2 form reaches the same endpoint indirectly:
    without HAI-2 to restrain matriptase, EpCAM is proteolytically depleted. The
    node is therefore defined by loss of functional EpCAM at the cell surface,
    not by the identity of the mutated gene - which is why the two genotypes
    produce indistinguishable intestinal histology.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Homotypic cell-cell adhesion
    term:
      id: GO:0034109
      label: homotypic cell-cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:18572020
    reference_title: "Identification of EpCAM as the gene for congenital tufting enteropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry and Western blot of patient intestinal tissue revealed
      decreased expression of EpCAM.
    explanation: >-
      Demonstrates reduced EpCAM protein in patient intestinal tissue, the
      protein-level lesion defining this node.
  downstream:
  - target: Apical Junctional Complex Disassembly and Barrier Failure
    causal_link_type: DIRECT
- name: Apical Junctional Complex Disassembly and Barrier Failure
  conforms_to: "enterocyte_polarity_trafficking_failure#Loss of a Functionally Polarized Absorptive Epithelial Surface"
  description: >-
    The rate-limiting step. EpCAM's transmembrane and intracellular regions
    recruit claudin-7 to the tight junction, so loss of EpCAM substantially
    reduces claudin-7 at the junction and prevents normal tight-junction
    formation. Other claudins (2, 3, 15) and the tight-junction proteins ZO-1 and
    occludin are also reduced. Because adherens junctions govern tight-junction
    assembly, the whole apical junctional complex is destabilised, and with it
    epithelial barrier function and the apical-basal polarity that the complex
    maintains. Claudin-15 loss is of particular functional consequence: it
    mediates paracellular sodium permeability, whose failure impairs the
    sodium-coupled glucose absorption that normally drives fluid uptake.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Tight junction assembly
    term:
      id: GO:0120192
      label: tight junction assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: Tight junction
    term:
      id: GO:0070160
      label: tight junction
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In CTE, the absence of EpCAM substantially reduces the recruitment of
      claudin-7 to TJs, leading to loss of TJ formation.
    explanation: >-
      States the mechanism of this node directly: EpCAM loss removes claudin-7
      from the tight junction and tight-junction formation fails. Evidence source
      is OTHER because this is a review.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Another study using mutant EpCAM mice, based on a CTE patient mutation,
      demonstrated growth retardation and CTE-like pathology, including impaired
      barrier function and decreases in the tight junction proteins zonula
      occludins-1 (ZO-1) and occludin
    explanation: >-
      Model-organism evidence that a patient-derived EpCAM mutation is sufficient
      to impair barrier function and reduce tight-junction proteins in vivo.
  downstream:
  - target: Epithelial Dysplasia and Focal Tuft Formation
    causal_link_type: DIRECT
  - target: Loss of Absorptive and Ion-Transport Function
    causal_link_type: DIRECT
- name: Epithelial Dysplasia and Focal Tuft Formation
  conforms_to: "enterocyte_polarity_trafficking_failure#Abnormal Villus Architecture"
  description: >-
    The morphological signature that names the disease. Loss of EpCAM-dependent
    adhesion at bicellular junctions shifts the mechanical balance of the
    epithelium: myosin IIa/IIb accumulates at tricellular junctions, which become
    hypercontractile, while the apical domain of individual cells expands
    abnormally. The result is focal crowding of disorganised enterocytes at the
    villus tips forming teardrop-shaped "tufts", on a background of partial or
    total villous atrophy and crypt hyperplasia, characteristically without
    inflammatory infiltration. Basement-membrane abnormalities (increased
    heparan sulfate proteoglycan and collagen IV, decreased laminin) and
    abnormal alpha-2-beta-1 integrin distribution accompany the dysplasia.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The loss of EpCAM-dependent cell-cell adhesion at bicellular junctions in
      CTE leads to tricellular junction hypercontractility due to accumulation of
      myosin IIa/IIb.
    explanation: >-
      Gives the mechanical mechanism by which adhesion loss produces the tuft
      lesion, linking this node to its upstream junctional cause.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tufts are composed of disorganized enterocytes with focal crowding at
      villous tips and basement membrane abnormalities resulting in teardrop-like
      configurations.
    explanation: >-
      Describes the histological appearance of the tuft lesion that defines this
      node.
  downstream:
  - target: Intractable Diarrhea and Intestinal Failure
    causal_link_type: DIRECT
- name: Loss of Absorptive and Ion-Transport Function
  conforms_to: "enterocyte_polarity_trafficking_failure#Feeding-Independent Intractable Diarrhea"
  description: >-
    The functional arm, running in parallel with the morphological one and
    explaining why the diarrhea of CTE has both a secretory and an osmotic
    component. Ion transporters are differentially affected - NKCC1 is
    mislocalized and reduced while CFTR is unchanged, and NHE3 is affected in
    murine models - which together with tight-junction loss accounts for the
    secretory component. Separately, the glucose transporters SGLT1 and GLUT2 and
    the brush-border glycoside hydrolases (maltase, sucrase, lactase) are
    disrupted, which accounts for the osmotic component and for the compromised
    caloric uptake driving weight loss. This dual mechanism is why enteral
    feeding worsens CTE and why parenteral nutrition is usually the only reliable
    route.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Small-intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Intestinal absorption
    term:
      id: GO:0050892
      label: intestinal absorption
    modifier: DECREASED
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alteration in expression and localization of ion transporters and tight
      junction proteins explains the secretory nature of diarrhea found in CTE,
      whereas changes in glucose transporters explain osmotic diarrhea seen in
      these patients
    explanation: >-
      States the dual secretory-plus-osmotic mechanism this node models and
      attributes each component to a distinct transporter defect.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The combined effect of decreased glucose transporters and disaccharidase
      expression result in compromised caloric uptake in this disease, which may
      contribute to weight loss and failure to thrive
    explanation: >-
      Links the transporter and disaccharidase defects to the nutritional
      consequences, connecting this node to the downstream clinical outcome.
  downstream:
  - target: Intractable Diarrhea and Intestinal Failure
    causal_link_type: DIRECT
- name: Intractable Diarrhea and Intestinal Failure
  conforms_to: "enterocyte_polarity_trafficking_failure#Intestinal Failure and Parenteral Nutrition Dependence"
  description: >-
    The clinical output. Profuse watery diarrhea, present whether the infant is
    fed or fasted, produces electrolyte imbalance, dehydration, weight loss and
    impaired growth, progressing to intestinal failure that requires parenteral
    nutrition and in some cases intestinal transplantation. Severity is
    heterogeneous - some patients need total parenteral nutrition while others
    need little parenteral support, and some improve substantially over time -
    but most never achieve enteral autonomy.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: Small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital tufting enteropathy (CTE) is an autosomal recessive disease of
      infancy that causes severe intestinal failure with electrolyte imbalances
      and impaired growth.
    explanation: >-
      States the clinical output of the chain - intestinal failure with
      electrolyte imbalance and impaired growth.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Moreover, most patients never achieve enteral autonomy
    explanation: >-
      Documents the long-term dependence on parenteral support that characterises
      the outcome.

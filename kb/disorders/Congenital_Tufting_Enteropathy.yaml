    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Analysis of the family history of CTE patients reveals that, as expected,
      siblings or cousins of CTE patients may be affected though
      parents/ancestors of the patients are often unaffected with no similar
      family history
    explanation: >-
      Describes the sibling-recurrence-with-unaffected-parents pattern
      characteristic of recessive inheritance. Evidence source is OTHER because
      this is a review.
genetic:
- name: EPCAM loss-of-function variants
  gene_term:
    preferred_term: EPCAM
    term:
      id: hgnc:11529
      label: EPCAM
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic EPCAM variants are the primary cause of CTE. Reported variants
    include deletions, splice-site changes, frameshifts, truncations and
    missense substitutions; the originally described variant was a homozygous
    donor-splice-site change in exon 4. Most produce a mutant or truncated EpCAM
    protein that is reduced in abundance and/or mislocalized rather than absent.
    Frameshift and truncating variants are associated with a more severe
    phenotype.
  evidence:
  - reference: PMID:18572020
    reference_title: "Identification of EpCAM as the gene for congenital tufting enteropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the gene for EpCAM are responsible for CTE.
    explanation: >-
      The gene-discovery report establishing EPCAM as the cause of congenital
      tufting enteropathy.
  - reference: PMID:18572020
    reference_title: "Identification of EpCAM as the gene for congenital tufting enteropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct sequencing of genes in this region revealed homozygous G>A
      substitution at the donor splice site of exon 4 in epithelial cell adhesion
      molecule (EpCAM) of affected patients.
    explanation: >-
      Specifies the original causative variant and its homozygous state,
      supporting the recessive coding-level lesion described in this block.
- name: SPINT2 variants (syndromic form)
  gene_term:
    preferred_term: SPINT2
    term:
      id: hgnc:11247
      label: SPINT2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    SPINT2 encodes HAI-2, an inhibitor of the membrane serine protease
    matriptase. Biallelic SPINT2 variants cause a syndromic form of CTE with
    intestinal pathology indistinguishable from the EPCAM form plus
    extraintestinal features. Mechanistically this is not a parallel disease but
    the same pathway entered one step upstream: loss of HAI-2 inhibition allows
    matriptase to cleave and deplete EpCAM, so the SPINT2 form converges on
    EpCAM loss.
  evidence:
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutant HAI-2 results in the decrease/loss of EpCAM through matriptase
      activity
    explanation: >-
      States the mechanistic convergence of the SPINT2 form onto EpCAM loss via
      unrestrained matriptase activity. Evidence source is OTHER because this is
      a review summarising model-system studies.
  - reference: PMID:33374714
    reference_title: "Congenital Tufting Enteropathy: Biology, Pathogenesis and Mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a recent review suggests 74% of those reported have mutations in EPCAM,
      while 26% have mutations in SPINT2
    explanation: >-
      Quantifies the relative contribution of the two loci to reported CTE cases.
  case_fractions:

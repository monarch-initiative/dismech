      and CK20.
    explanation: >-
      The second case demonstrates a distinct triple-negative/SOX10-positive
      profile.
- name: HER2 Protein Overexpression in Metastatic EMPD
  presence: Positive in a reported metastatic scrotal EMPD case
  notes: >-
    HER2 overexpression was demonstrated in tumor and bone-marrow metastasis

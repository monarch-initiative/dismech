epidemiology:
- name: Relative share of uncommon vulvar carcinoma histologies
  description: >-
    Adenocarcinomas are among the uncommon histologic variants that collectively
    comprise less than 5% of vulvar cancer diagnoses worldwide. This is a
    relative histology share, not a population prevalence or incidence estimate
    for vulvar adenocarcinoma.
  unit: percent of vulvar cancer diagnoses
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Uncommon histological variants of vulvar carcinoma, including
      adenocarcinomas, comprise less than 5% of all vulvar cancer diagnoses
      worldwide.
    explanation: >-
      The systematic review places adenocarcinomas within a combined group of
      uncommon histologies accounting for less than 5% of vulvar diagnoses; it
      does not estimate adenocarcinoma-specific population occurrence.

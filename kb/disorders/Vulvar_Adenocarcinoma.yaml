- name: HER2-Positive EMPD Signaling (Cross-Site Case Evidence)
  description: >-
    A single metastatic scrotal EMPD case showed HER2 protein overexpression
    and WGS pathway enrichment involving FGFR1 and TGF-beta signaling. This is
    a hypothesis-generating therapeutic axis for vulvar Paget-associated
    disease, not established vulvar-specific molecular prevalence or causality.
  role: modifier
  evidence:
  - reference: PMID:38831459
    reference_title: "Whole genome sequencing of HER2-positive metastatic extramammary Paget's disease: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical staining on the scrotal wall tumor and bone marrow
      metastasis demonstrated HER2 overexpression.
    explanation: >-
      The evidence is direct for a metastatic scrotal EMPD case but only
      extrapolative for vulvar EMPD.
  - reference: PMID:38831459
    reference_title: "Whole genome sequencing of HER2-positive metastatic extramammary Paget's disease: a case report."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Enrichment in pathways associated with transforming growth factor-beta
      (TGFβ) (FDR = 0.0376, Enrichment Ratio = 8.12) and fibroblast growth
      factor receptor (FGFR1) signaling (FDR = 0.0082, Enrichment Ratio = 2.3)
      was detected.
    explanation: >-
      Computational enrichment in one cross-site EMPD case does not establish a
      recurrent vulvar mechanism.

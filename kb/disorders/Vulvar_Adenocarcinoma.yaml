      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lymph node metastases were present in about 31.5% of cases.
      explanation: >-
        The systematic review directly quantifies nodal metastasis in reported
        intestinal-type cases.
- name: Mammary-Like Glandular Differentiation
  description: >-
    Vulvar adenocarcinoma of mammary gland type can reproduce ductal,
    cribriform, papillary, or infiltrative breast-carcinoma-like architecture.
    Its immunophenotype is heterogeneous rather than uniformly hormone-receptor
    positive.
  role: central_effector
  evidence:
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histological types in the vulva appear to be similar to those
      described for the breast, such as ductal lobular, mixed and mucinous
      carcinomas.
    explanation: >-
      The case report describes the breast-like morphologic spectrum.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although ER and PR expression is considered a diagnostic criterion for
      these neoplasms, here we report a case of an AMGT with a triple-negative
      profile, mimicking its breast counterpart.
    explanation: >-
      The two-case report establishes clinically important immunophenotypic
      heterogeneity.

discussions:
- discussion_id: vulvar_adeno_subtype_evidence_gap
  prompt: >-
    What are the subtype-specific incidence, molecular drivers, natural
    history, and comparative treatment outcomes across the officially grouped
    primary vulvar adenocarcinoma descendants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Primary Vulvar Glandular Malignancy
  - pathophysiology#Regional Nodal Spread or Late Recurrence
  rationale: >-
    The MONDO umbrella also groups rare sebaceous, eccrine (including
    porocarcinoma), apocrine, Skene-gland, clear-cell hidradenocarcinoma, and
    Bartholin adenoid-cystic branches. Those descendants are represented here
    so that scope is explicit, but remain under-curated because disease-specific
    evidence was not established in this review. A multi-institutional registry
    with centralized pathology review and subtype-resolved outcomes is needed
    before broad vulvar-cancer treatment evidence can be treated as
    adenocarcinoma-specific.
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the extremely low incidence of VAIt, individual case reports and
      small case series represent the only source of information about this
      condition in the literature, which inherently limits the power of
      definitive conclusions and uniform treatment protocols.
    explanation: >-
      The current systematic review explicitly identifies the evidence-design
      limitation for one major subtype.
- discussion_id: vulvar_empd_cross_site_molecular_gap
  prompt: >-
    How often are HER2 overexpression and FGFR1/TGF-beta pathway alterations
    present and therapeutically predictive in vulvar, rather than non-vulvar,
    EMPD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HER2-Positive EMPD Signaling (Cross-Site Case Evidence)
  rationale: >-
    The available WGS and treatment-response evidence in this entry comes from
    one metastatic scrotal EMPD case. Vulvar-specific cohorts with standardized
    IHC, copy-number, sequencing, treatment, and outcome data are needed before
    estimating prevalence or predictive value.
  evidence:
  - reference: PMID:38831459
    reference_title: "Whole genome sequencing of HER2-positive metastatic extramammary Paget's disease: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical staining on the scrotal wall tumor and bone marrow
      metastasis demonstrated HER2 overexpression.
    explanation: >-
      The specimen site makes the cross-site generalizability gap explicit.
notes: >-
  Falcon deep research was performed on 2026-05-09 and the entry was reviewed
  on 2026-08-08. Vulvar adenocarcinoma evidence remains sparse and
  subtype-specific; broad vulvar-cancer or mixed-histology evidence and
  cross-site EMPD evidence are therefore annotated as partial when applied to
  this disease category.

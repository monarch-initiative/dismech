- name: Cervicovaginal Paget Cell Extension
  description: >-
    Cervical or vaginal extension is a late complication of vulvar EMPD that
    may be clinically silent and is often first detected by abnormal glandular
    cytology before biopsy confirmation.
  role: consequence
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall nine patients developed CV involvement from EMPD, with a
      cumulative incidence of 2.5% (95% CI: 0.5-8.0%) at 5 years, 6.5% (95% CI:
      1.9-15.1%) at 10 years and 14.0% (95% CI: 4.8-27.8%) at 15 years,
      respectively.
    explanation: >-
      The 94-patient cohort quantifies increasing cumulative incidence of
      cervicovaginal extension over long follow-up.
  downstream:
  - target: Abnormal Glandular Cytology in Paget Spread
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

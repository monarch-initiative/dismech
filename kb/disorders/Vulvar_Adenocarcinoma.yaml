histopathology:
- name: Villo-Glandular Mucinous Colorectal-Like Morphology
  context: Intestinal-Type
  diagnostic: true
  description: >-
    Intestinal-type vulvar adenocarcinoma forms villo-glandular structures with
    goblet or Paneth cells and intracytoplasmic mucin, closely resembling
    mucinous colorectal adenocarcinoma.
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VAIt is defined as a mucinous, villo-glandular adenocarcinoma of the vulva
      showing intestinal differentiation. Macroscopically, VAIt may exhibit a
      polypoid appearance, while histologically, it displays features akin to
      mucinous colorectal adenocarcinomas, including the presence of goblet
      cells or Paneth cells with abundant intracellular mucin.
    explanation: >-
      The systematic review directly describes the defining microscopic
      architecture and cell types.
- name: Heterogeneous Mammary-Like Ductal Architecture
  context: Mammary Gland Type
  diagnostic: true
  description: >-
    Reported tumors range from expansile cribriform and papillary architecture
    to infiltrative ductular, glandular, nest, and cord patterns, illustrating
    substantial within-subtype morphologic heterogeneity.
  evidence:
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumour mass presented a nodular configuration, with expansile growth,
      with a cribiform and papillary architecture, occasionally with solid
      areas.
    explanation: >-
      This is the microscopic pattern of the first mammary-like case.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumour mass presented an infiltrative growth, being arranged in a
      ductular and glandular architecture or in small nests and cords.
    explanation: >-
      The second case demonstrates a distinct infiltrative ductal pattern.
- name: Mucin-Producing Bartholin Adenocarcinoma
  context: Bartholin Gland Adenocarcinoma
  description: >-
    Bartholin gland adenocarcinoma is commonly mucin-producing and can show
    papillary, mucoepidermoid, or mucinous architecture with intracytoplasmic
    mucin and deep perineal infiltration.
  evidence:
  - reference: PMID:41375020
    reference_title: "Bartholin Gland Carcinoma: A State-of-the-Art Review of Epidemiology, Histopathology, Molecular Testing, and Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor cells often contain intracytoplasmic mucin and may show papillary
      architecture and CEA positivity. These tumors tend to infiltrate deep
      perineal tissues along nerves, with frequent ischioanal fossa involvement.
    explanation: >-
      The review directly describes the morphology and infiltrative pattern of
      Bartholin adenocarcinoma.
- name: Paget Cells in Epithelium or Stroma
  context: Paget-Associated
  diagnostic: true
  description: >-
    Cervical or vaginal extension from vulvar EMPD is confirmed by identifying
    Paget cells within epithelium or stroma on biopsy.
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cervical and/or vaginal biopsies were always performed for
      histopathological diagnosis by identification of Paget cells in the
      epithelium or stroma.
    explanation: >-
      This directly states the biopsy finding used to diagnose extension.

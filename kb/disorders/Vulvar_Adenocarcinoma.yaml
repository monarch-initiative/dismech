- name: Mammary-Like Hormone-Receptor and Lineage-Marker Profiles
  presence: Subtype-variable
  notes: >-
    The two reported cases were molecularly distinct: one was ER-high and
    CK7/CAM5.2/GATA3-positive, while the other was triple-negative with
    CK7/SOX10 positivity. A single invariant mammary-like panel should not be
    assumed.
  readouts:
  - target: Mammary-Like Glandular Differentiation
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Morphology and a panel of breast-lineage and hormone-receptor markers,
      interpreted together, support mammary-like differentiation.
    evidence:
    - reference: PMID:35672058
      reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The triple-negative immunohistochemical (IHC) profile of one of the
        cases represented a diagnostic challenge.
      explanation: >-
        The report directly shows that IHC profile interpretation is part of
        mammary-like subtype diagnosis and can be heterogeneous.
  evidence:
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The immunohistochemistry (IHC) study demonstrated positivity for
      oestrogen receptors (ER) (90%–100%), cytokeratin (CK) 7, CAM5.2 and GATA3.
    explanation: >-
      This is the ER-high breast-lineage profile of one mammary-like case.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IHC study demonstrated positivity for CK7, SOX10, p53 and E-cadherin. The

progression:
- phase: Reported FIGO-stage distribution in intestinal-type disease
  subtype: Intestinal-Type
  notes: >-
    In the 40-case systematic review, Stage IA was reported in 19 cases (47.5%);
    the remaining reported cases spanned Stage IB through IVB. This is a
    cohort distribution within intestinal-type disease, not a stage definition
    and not a distribution estimate for every vulvar adenocarcinoma subtype.
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stage IA emerged as the most frequently reported classification,
      encompassing 19 cases (47.5%).
    explanation: >-
      The review directly reports the most frequent stage and count in the
      intestinal-type case literature.
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6 cases were categorized as Stage IB, (15%); 2 cases (5%) were noted as
      Stage IIB; 4 cases were classified as Stage IIIA (10%); Stage IIIB was
      identified in 1 case (2.5%), and Stage IIIC in 2 cases (5%). Beyond
      these, one case (2.5%) presented as the more advanced Stage IVB.
    explanation: >-
      The review enumerates the remaining reported stages in intestinal-type
      disease without redefining the FIGO categories.
- phase: Regional nodal spread in intestinal-type disease
  subtype: Intestinal-Type
  notes: >-
    Nodal status was reported for 32 of 40 cases; 10 of those 32 were node
    positive. The denominator is reported explicitly to avoid treating missing
    nodal data as negative.
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymph node metastasis status, however, was available for 32 cases (80%).
      Among these, 22 cases (68.8% of those with known status) were reported as
      negative for lymph node metastasis, while 10 cases (31.2% of those with
      known status) were positive.
    explanation: >-
      The systematic review provides the known-status denominator and nodal
      metastasis count.
- phase: Delayed recurrence risk in intestinal-type disease
  subtype: Intestinal-Type
  notes: >-
    Late recurrence is possible even after apparently successful local therapy,
    supporting extended follow-up; its frequency remains uncertain.
  evidence:
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sometimes, VAIt behavior can be unpredictable, with relapses even after
      many years, so more experiences and longer follow-up periods are needed
      to elucidate the best therapeutic management and its long-term prognosis.
    explanation: >-
      The review explicitly describes the possibility of late relapse and the
      need for longer follow-up.
- phase: Persistent or recurrent vulvar extramammary Paget disease
  subtype: Paget-Associated
  notes: >-
    Persistence or recurrence occurred in 86% of the referral-center cohort
    and commonly required repeated surgery (median two surgical procedures;
    range zero to 11). This estimate applies to vulvar EMPD in the reported
    cohort, not to every vulvar adenocarcinoma subtype.
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Persistence or recurrence was very common, taking place in 86% of cases
      and, thus, often requiring multiple surgical instances (median: 2;
      range: 0–11).
    explanation: >-
      The longitudinal vulvar EMPD cohort directly reports the recurrence or
      persistence proportion and repeated-surgery burden.
- phase: Five-year overall survival in vulvar extramammary Paget disease
  subtype: Paget-Associated
  notes: >-
    Five-year overall survival was 90.5% (95% CI 81.8–95.1%) after excluding
    one patient whose death date was unknown. This is a cohort-specific
    overall-survival estimate rather than adenocarcinoma-specific survival
    across the entire umbrella disorder.
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After excluding one patient with an unknown death date, the 5 year
      overall survival was 90.5% (95% CI: 81.8–95.1%), as shown in Figure 1.
    explanation: >-
      The cohort directly reports the five-year overall-survival estimate,
      confidence interval, and exclusion.
- phase: Long-term cervicovaginal extension of vulvar Paget disease
  subtype: Paget-Associated
  notes: >-
    Cervicovaginal involvement accumulated over 15 years and was often
    asymptomatic, supporting lifelong surveillance in long-standing disease.
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall nine patients developed CV involvement from EMPD, with a
      cumulative incidence of 2.5% (95% CI: 0.5-8.0%) at 5 years, 6.5% (95% CI:
      1.9-15.1%) at 10 years and 14.0% (95% CI: 4.8-27.8%) at 15 years,
      respectively.
    explanation: >-
      The 94-patient longitudinal cohort quantifies the late, accumulating
      cervicovaginal complication.
- phase: Recurrent Bartholin gland adenocarcinoma
  subtype: Bartholin Gland Adenocarcinoma
  notes: >-
    The only adenocarcinoma in a 13-case Bartholin carcinoma cohort recurred and
    contributed to the two disease-specific deaths, so this is a single-case
    signal rather than a frequency estimate.
  evidence:
  - reference: PMID:29406447
    reference_title: "Bartholin Gland Carcinoma: Clinicopathologic Features, Including p16 Expression and Clinical Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recurrence occurred in 3 cases, with death due to disease in 2 of the
      patients with recurrence, including the single patient with
      adenocarcinoma.
    explanation: >-
      This directly establishes recurrence and fatal outcome in the cohort's
      single adenocarcinoma case without implying a population rate.
environmental:
- name: Broader Vulvar Cancer Risk Context (Not Subtype-Specific)
  description: >-
    Increasing age, HPV infection, smoking, inflammatory vulvar disease, and
    immunodeficiency are recognized vulvar cancer risk factors. Their
    adenocarcinoma-subtype specificity is limited, so this is annotated as
    contextual rather than definitive adenocarcinoma causation.
  evidence:
  - reference: PMID:38503056
    reference_title: "Vulvar Cancer, Version 3.2024, NCCN Clinical Practice Guidelines in Oncology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Known risk factors for vulvar cancer include increasing age, infection
      with human papillomavirus, cigarette smoking, inflammatory conditions
      affecting the vulva, and immunodeficiency.
    explanation: >-
      This supports the general vulvar cancer risk context, but the evidence is
      partial for vulvar adenocarcinoma because many data are dominated by
      squamous carcinoma.
diagnosis:
- name: Biopsy of Suspicious Vulvar Lesion
  description: >-
    Suspicious vulvar lesions require biopsy to establish invasion and
    histologic subtype. Vulvoscopy and imaging can help target biopsy and plan
    preoperative staging.
  results: Histopathologic confirmation of invasive glandular vulvar malignancy.
  evidence:
  - reference: PMID:34669204
    reference_title: "Cancer of the vulva: 2021 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, any suspicious vulvar lesion should be biopsied to exclude
      invasion.
    explanation: >-
      This directly supports biopsy for suspicious vulvar lesions.
  - reference: PMID:38791925
    reference_title: "Current Preoperative Management of Vulvar Squamous Cell Carcinoma: An Overview."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis relies on biopsy during vulvoscopy, plus imaging such as
      ultrasonography (USG), magnetic resonance imaging (MRI) and positron
      emission tomography (PET).
    explanation: >-
      This supports biopsy, vulvoscopy, and imaging in vulvar carcinoma
      diagnosis; it is partial for adenocarcinoma because the review focuses on
      squamous carcinoma.
  - reference: PMID:41375020
    reference_title: "Bartholin Gland Carcinoma: A State-of-the-Art Review of Epidemiology, Histopathology, Molecular Testing, and Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because diagnostic delay is common and incidence increases with age,
      biopsy should be performed in patients with a persistent or progressive
      BG mass, solid masses or solid components within a presumed “cystic
      lesion,” or lesions invading surrounding tissues, and should be
      generously considered in peri- and postmenopausal patients.
    explanation: >-
      The Bartholin review specifies high-risk mass features that warrant
      tissue diagnosis.
- name: Subtype Immunohistochemistry and Primary-Site Exclusion
  description: >-
    Intestinal-type and mammary-like vulvar adenocarcinomas require
    immunohistochemistry and clinicoradiologic exclusion of metastatic
    gastrointestinal or breast primaries.
  results: Primary vulvar origin and histologic subtype assignment.
  evidence:
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, immunohistochemical workup, with different tumor markers
      including CK20, CDX2, and CK7 staining, is needed.
    explanation: >-
      This supports CK20, CDX2, and CK7 immunohistochemistry for VAIt.
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis must be substantiated by the exclusion of other primary
      tumors, in particular primary gastrointestinal neoplasias.
    explanation: >-
      The current systematic review directly requires exclusion of a
      gastrointestinal primary before assigning primary vulvar origin.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological patterns are considered essential for diagnosis.
    explanation: >-
      This supports histopathology for AMGT diagnosis.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, it is necessary to exclude metastasis disease from
      orthotopic breast carcinoma or other organs.
    explanation: >-
      The mammary-like report directly states the primary-site exclusion
      requirement.
- name: Paget Disease Cytology and Biopsy Follow-Up
  description: >-
    For long-standing vulvar EMPD, liquid-based cytology with
    immunocytochemistry can detect clinically silent cervico-vaginal spread,
    with biopsy confirmation when abnormal cytology is found.
  results: Detection of cervico-vaginal EMPD involvement.
  evidence:
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cervical and/or vaginal biopsies were always performed for
      histopathological diagnosis by identification of Paget cells in the
      epithelium or stroma.
    explanation: >-
      This supports biopsy confirmation of cervico-vaginal EMPD.
  - reference: PMID:36766569
    reference_title: "Tips and Tricks for Early Diagnosis of Cervico-Vaginal Involvement from Extramammary Paget's Disease of the Vulva: A Referral Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liquid-based cytology with immunocytochemistry represents a valuable tool
      for early diagnosis and should be routinely performed during the required
      lifelong follow-up.
    explanation: >-
      This supports cytology with immunocytochemistry during lifelong EMPD
      follow-up.
- name: Clinical Staging and Imaging
  description: >-
    Clinical assessment is combined with selected imaging to evaluate local
    extent, regional nodes, and distant metastases. Imaging recommendations are
    heterogeneous and most evidence is for vulvar cancer overall rather than
    adenocarcinoma-specific cohorts.
  results: Clinical extent and suspected local, nodal, or distant disease.
  evidence:
  - reference: PMID:38927973
    reference_title: "Imaging in Vulval Cancer."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Various imaging modalities are widely used in conjunction with clinical
      assessment in the diagnosis and staging of vulval cancers; however, there
      is significant heterogeneity in which modalities are recommended in
      international guidelines, reflecting the paucity of evidence in this
      area.
    explanation: >-
      This supports the combined clinical/imaging framework while preserving
      the limited and histology-mixed evidence base.
  - reference: PMID:38927973
    reference_title: "Imaging in Vulval Cancer."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For distant metastases, CT CAP and FDG-PET/CT have the most evidence to
      support their use.
    explanation: >-
      The imaging review supports CT chest/abdomen/pelvis and FDG-PET/CT for
      distant-disease assessment in vulvar cancer overall.
- name: Regional Nodal Staging or Assessment
  description: >-
    Regional nodal assessment is considered for intestinal-type tumors larger
    than 2 cm or with suspicious nodes and for mammary-like adenocarcinoma;
    reported methods include sentinel-node biopsy and lymphadenectomy.
  results: Regional lymph-node status for staging and treatment planning.
  evidence:
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymph node staging is an option advised if the tumor size is >2 cm or if
      lymph node metastases are suspected on imaging.
    explanation: >-
      This states the size- and imaging-based indications described for
      intestinal-type tumors.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphatic involvement may be assessed by sentinel lymph node biopsy or
      lymphadenectomy.
    explanation: >-
      This directly identifies nodal-assessment approaches for mammary-like
      disease.
differential_diagnoses:
- name: Metastatic Colorectal or Other Gastrointestinal Adenocarcinoma
  description: >-
    A colorectal or other gastrointestinal primary can closely mimic
    intestinal-type vulvar adenocarcinoma morphologically and by CK20/CDX2
    immunophenotype.
  distinguishing_features:
  - Establish whether a gastrointestinal primary is present by directed clinical, endoscopic, and radiologic evaluation.
  - Interpret CK7, CK20, CDX2, and related markers as a panel; intestinal differentiation alone does not prove vulvar origin.
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis must be substantiated by the exclusion of other primary
      tumors, in particular primary gastrointestinal neoplasias.
    explanation: >-
      The systematic review directly requires gastrointestinal-primary
      exclusion for an intestinal-type vulvar diagnosis.
- name: Metastatic Breast Carcinoma
  description: >-
    Vulvar adenocarcinoma of mammary gland type can reproduce breast-carcinoma
    morphology and immunophenotype, so a metastatic orthotopic breast primary
    must be excluded.
  distinguishing_features:
  - Correlate vulvar histology and immunohistochemistry with breast examination and breast imaging.
  - Look for adjacent in situ carcinoma or non-neoplastic mammary-like vulvar tissue when present, while recognizing these features may be absent.
  evidence:
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, it is necessary to exclude metastasis disease from
      orthotopic breast carcinoma or other organs.
    explanation: >-
      The case report directly states the metastatic breast-primary exclusion
      requirement.
- name: Bartholin Gland Cyst or Abscess
  description: >-
    Bartholin gland carcinoma is commonly first labeled as a benign cyst or
    abscess, delaying diagnosis and allowing stage progression.
  distinguishing_features:
  - Biopsy a persistent, progressive, solid, or partly solid Bartholin-region mass, particularly in peri- or postmenopausal patients.
  - Obtain tissue deep enough to assess invasion and, when possible, the transition from normal Bartholin gland to tumor.
  evidence:
  - reference: PMID:41375020
    reference_title: "Bartholin Gland Carcinoma: A State-of-the-Art Review of Epidemiology, Histopathology, Molecular Testing, and Clinical Management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 50% of cases are diagnosed at an advanced stage due to
      misclassification as benign cysts or abscesses.
    explanation: >-
      The mixed-histology Bartholin carcinoma review directly documents the
      mimic and diagnostic delay; applicability to the adenocarcinoma subset is
      marked partial.
treatments:
- name: Surgical Local Excision or Vulvectomy
  description: >-
    Surgery is the principal local-control strategy for primary vulvar
    adenocarcinoma subtypes when technically feasible, with margin goals and
    nodal evaluation tailored to histology, size, and stage.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Primary Vulvar Glandular Malignancy
    treatment_effect: INHIBITS
    description: Surgical removal aims to eliminate the local malignant glandular tumor.
    evidence:
    - reference: PMID:36291953
      reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The gold standard of treatment for VAIt is surgery, with local excision
        with tumor-free margins.
      explanation: >-
        The subtype review directly links excision with tumor-free margins to
        local tumor control.
  evidence:
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gold standard of treatment for VAIt is surgery, with local excision
      with tumor-free margins.
    explanation: >-
      This directly supports surgery with tumor-free margins for
      intestinal-type vulvar adenocarcinoma.
  - reference: PMID:35672058
    reference_title: "Diagnosis and management of primary vulvar adenocarcinoma of mammary gland type: report of two distinct cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical procedures include radical vulvectomy or radical local excision.
    explanation: >-
      This supports radical vulvectomy or local excision for AMGT cases.
- name: Adjuvant or Advanced-Disease Chemotherapy
  description: >-
    Chemotherapy is used selectively for advanced, recurrent, or
    histology-specific vulvar cancers, with many adenocarcinoma decisions
    extrapolated from limited case literature.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Regional Nodal Spread or Late Recurrence
    treatment_effect: INHIBITS
    description: Cytotoxic approaches aim to reduce residual or advanced malignant tumor burden.
    evidence:
    - reference: PMID:36291953
      reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a good response to adjuvant chemotherapy treatments has been described
        in both advanced and recurrent diseases.
      explanation: >-
        The review supplies limited reported response evidence in advanced or
        recurrent intestinal-type disease.
  evidence:
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the other hand, the role of neoadjuvant therapy is still in doubt, but
      a good response to adjuvant chemotherapy treatments has been described in
      both advanced and recurrent diseases.
    explanation: >-
      This supports a limited, subtype-specific role for adjuvant chemotherapy
      in advanced or recurrent VAIt while preserving uncertainty.
- name: Radiation or Concurrent Chemoradiation
  description: >-
    Radiation, including concurrent chemoradiation, is an option for selected
    advanced vulvar cancers. Applicability to adenocarcinoma remains indirect
    because the supporting evidence is histology-mixed and dominated by
    squamous carcinoma.
  action_category: THERAPEUTIC
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Regional Nodal Spread or Late Recurrence
    treatment_effect: INHIBITS
    description: >-
      Local or regional radiation is intended to reduce advanced or residual
      malignant tumor burden, alone or with concurrent chemotherapy.
    evidence:
    - reference: PMID:34669204
      reference_title: "Cancer of the vulva: 2021 update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment is predominantly surgical, particularly for squamous cell
        carcinoma, although concurrent chemoradiation is an effective alternative,
        particularly for advanced tumors.
      explanation: >-
        The review supports a radiation-containing regimen for advanced vulvar
        cancer, but only indirectly for adenocarcinoma.
  evidence:
  - reference: PMID:34669204
    reference_title: "Cancer of the vulva: 2021 update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is predominantly surgical, particularly for squamous cell
      carcinoma, although concurrent chemoradiation is an effective alternative,
      particularly for advanced tumors.
    explanation: >-
      This supports concurrent chemoradiation in advanced vulvar cancer
      generally; it is partial for adenocarcinoma because the evidence base is
      histology-mixed and dominated by squamous carcinoma.
- name: HER2-Directed Pharmacotherapy
  description: >-
    HER2-directed systemic therapy may be relevant in selected HER2-positive
    metastatic EMPD or Paget-associated adenocarcinoma settings.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY

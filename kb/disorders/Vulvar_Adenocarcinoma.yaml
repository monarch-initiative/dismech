- name: Bartholin Gland Adenocarcinoma
  description: >-
    Bartholin gland adenocarcinomas commonly produce mucin and can show
    papillary, mucoepidermoid, or mucinous architecture with deep perineal and
    perineural infiltration.
  role: central_effector
  evidence:
  - reference: PMID:41375020
    reference_title: "Bartholin Gland Carcinoma: A State-of-the-Art Review of Epidemiology, Histopathology, Molecular Testing, and Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most are mucin-producing, with patterns ranging from papillary to
      mucoepidermoid or mucinous.
    explanation: >-
      The review describes the principal Bartholin adenocarcinoma morphologies.
  locations:
  - preferred_term: Bartholin gland
    term:
      id: UBERON:0000460
      label: major vestibular gland
  downstream:
  - target: Vulvar Lump or Mass
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bartholin gland carcinoma commonly presents as a painful mass.
    evidence:
    - reference: PMID:41375020
      reference_title: "Bartholin Gland Carcinoma: A State-of-the-Art Review of Epidemiology, Histopathology, Molecular Testing, and Clinical Management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The leading symptom is a painful vulvar mass in the BG area; other
        commonly observed symptoms include bleeding, pruritus, skin
        discoloration, and dyspareunia.
      explanation: >-
        This is mixed-histology Bartholin gland carcinoma evidence and is
        therefore partial for its adenocarcinoma subset.
  - target: Regional Nodal Spread or Late Recurrence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bartholin gland adenocarcinoma can recur and be fatal.
    evidence:

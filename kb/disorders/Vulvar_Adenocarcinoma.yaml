- name: Intestinal-Type Glandular Differentiation
  description: >-
    Intestinal-type vulvar adenocarcinoma has villo-glandular, mucin-producing
    morphology with goblet or Paneth cells and an intestinal immunophenotype.
    Cloacal-remnant origin is proposed but is not established.
  role: central_effector
  evidence:
  - reference: PMID:41463238
    reference_title: "Intestinal-Type Adenocarcinoma Is a Rare Histotype of Vulvar Neoplasm: Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VAIt is defined as a mucinous, villo-glandular adenocarcinoma of the vulva
      showing intestinal differentiation.
    explanation: >-
      The review states the contemporary morphologic definition of the subtype.
  - reference: PMID:36291953
    reference_title: "\"Intestinal-Type\" Vulvar Adenocarcinoma: A Review of the MITO Rare Tumors Group."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears frequently localized to epithelial glands in the vulvar
      region, and it probably derives from cloacal remnants persisting in the
      adult.
    explanation: >-
      This supports a proposed, rather than proven, cloacal-remnant origin.
  cell_types:
  - preferred_term: intestinalized vulvar glandular epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: vulva
    term:
      id: UBERON:0000997
      label: mammalian vulva
  downstream:

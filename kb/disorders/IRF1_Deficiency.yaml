    preferred_term: Non-tuberculous mycobacterial infection
    term:
      id: HP:5210115
      label: Non-tuberculous mycobacterial infection
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens"
    explanation: Describes the environmental mycobacterial disease seen in IRF1-deficient children.
- category: Immunological
  name: Unusual Salmonella infection
  description: >-
    Non-typhoidal salmonellosis is the commonest non-mycobacterial infection in
    MSMD, reflecting the shared requirement for IFN-gamma-activated macrophages
    against intramacrophagic organisms. Reported for the MSMD group as a whole;
    the size of the published IRF1 cohort does not establish its frequency in
    this specific etiology.
  phenotype_term:
    preferred_term: Unusual Salmonella infection
    term:
      id: HP:5210093
      label: Unusual Salmonella infection
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "about half of them might develop non-typhoidal salmonellosis"
    explanation: Reports non-typhoidal salmonellosis across MSMD; the entry's description scopes this to the group rather than to IRF1 specifically.
genetic:
- name: IRF1
  association: Causal
  gene_term:
    preferred_term: IRF1
    term:
      id: hgnc:6116
      label: IRF1
  notes: >-
    Biallelic loss-of-function IRF1 variants causing complete deficiency were
    described in unrelated children by Rosain et al. IRF1 acts downstream of
    the IFN-gamma receptor as an induced transcription factor, so upstream
    receptor and JAK-STAT components are intact; the defect is in the response
    to IFN-gamma rather than its production.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe unrelated children with inherited complete IRF1 deficiency and early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens."
    explanation: Establishes IRF1 as the causal gene by linking complete deficiency to the mycobacterial phenotype in unrelated kindreds.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    IRF1 deficiency was described in 2023 and is one of the rarest MSMD
    etiologies; only a small number of unrelated children have been reported.
    MSMD as a whole comprises 36 disorders across 20 genes.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mendelian susceptibility to mycobacterial diseases (MSMD) is the most characterized of these IEIs, with 36 different disorders found in 20 distinct genes"
    explanation: Gives the size of the MSMD genetic landscape within which IRF1 deficiency is one recently described etiology.
treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Because the defect is an abolished cellular response to IFN-gamma rather
    than impaired IFN-gamma production, replacing the hematopoietic compartment
    is the therapeutic route that addresses the mechanism. Reviews of MSMD
    identify transplantation, with gene therapy as a prospect, as the option
    for patients whose response to the cytokine is abolished.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    description: >-
      Donor-derived mononuclear phagocytes carry functional IRF1 and can mount
      the IFN-gamma-induced antimycobacterial programme.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for patients with abolished response to this cytokine, hematopoietic stem cell transplantation (HSCT) and promising gene therapy are the only current therapeutic options"
    explanation: States that transplantation is the option for the abolished-response group, which is where an IRF1 defect sits.
  notes: >-
    Recombinant IFN-gamma is deliberately not listed as a treatment for this
    entry. It benefits MSMD patients whose defect is impaired IFN-gamma
    production; an IRF1 defect lies downstream of the receptor, so supplying
    more of the cytokine has no mechanistic route to restore the missing
    transcriptional response.
- name: Avoidance of BCG Vaccination
  description: >-
    Live attenuated BCG vaccine causes disseminated disease in MSMD and should
    be avoided once the diagnosis is known or suspected in a sibling. This is
    the agents-and-circumstances-to-avoid consideration for the disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of BCG vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    description: >-
      Withholding the live vaccine removes a mycobacterial challenge the
      defective macrophage cannot contain.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSMD confers a selective susceptibility to infections with weakly virulent mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines"
    explanation: Identifies BCG as a specific hazard for this patient group, which is the basis for avoiding it.

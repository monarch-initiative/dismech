- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    IRF1 deficiency was described in 2023 in two unrelated children, from
    consanguineous Argentinian and Turkish kindreds. It is among the rarest
    MSMD etiologies.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied two unrelated children, P1 and P2."
    explanation: The complete published case count for this etiology at the time of description.
- population: Worldwide

  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of MSMD is about 10−5."
    explanation: Group-level occurrence estimate for MSMD; the notes scope it explicitly so it is not read as an IRF1-specific rate.
treatments:
- name: Broad-Spectrum Antimycobacterial Pharmacotherapy
  description: >-
    The actual day-to-day management in both reported patients, and the
    treatment that keeps them alive while the underlying defect persists. Its
    limitation is instructive: mycobacterial disease recurred despite multiple
    antimycobacterial drugs, because the drugs act on the organism while the
    macrophage remains unable to mount the IFN-gamma-induced killing programme
    that normally clears it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Non-tuberculous mycobacterial infection
    description: >-
      The drugs act on the organism rather than on the host defect, so they
      suppress the infection without restoring the macrophage killing programme
      - which is why disease recurred on treatment.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "despite treatment with multiple antimycobacterial drugs, and even treatment with recombinant IFN-γ in the case of P1"
      explanation: Records both that the drugs are directed at the mycobacterial disease and that they do not resolve it.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were receiving broad-spectrum antimycobacterial drugs and P1 was also receiving recombinant IFN-γ."
    explanation: Documents the antimicrobial regimen both patients were maintained on.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "despite treatment with multiple antimycobacterial drugs, and even treatment with recombinant IFN-γ in the case of P1"
    explanation: Records that disease recurred on this therapy, which is why it is management rather than cure.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Because the defect is an abolished cellular response to IFN-gamma rather
    than impaired IFN-gamma production, replacing the hematopoietic compartment
    is the therapeutic route that addresses the mechanism. Reviews of MSMD
    identify transplantation, with gene therapy as a prospect, as the option
    for patients whose response to the cytokine is abolished.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    description: >-
      Donor-derived mononuclear phagocytes carry functional IRF1 and can mount
      the IFN-gamma-induced antimycobacterial programme.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "for patients with abolished response to this cytokine, hematopoietic stem cell transplantation (HSCT) and promising gene therapy are the only current therapeutic options"
    explanation: States that transplantation is the option for the abolished-response group, which is where an IRF1 defect sits.
  notes: >-
    Recombinant IFN-gamma is deliberately not listed as a treatment for this
    entry. It benefits MSMD patients whose defect is impaired IFN-gamma
    production; an IRF1 defect lies downstream of the receptor, so supplying
    more of the cytokine has no mechanistic route to restore the missing
    transcriptional response.

    Recorded so a future editor does not "correct" this omission without the
    argument: P1 was in fact receiving recombinant IFN-gamma, and mycobacterial
    disease recurred anyway. The clinical course is therefore consistent with
    the mechanistic reasoning rather than against it, and the drug is cited on
    the antimycobacterial pharmacotherapy entry above as part of the regimen
    that failed rather than as a treatment this entry endorses.
- name: Avoidance of BCG Vaccination
  description: >-
    Live attenuated BCG vaccine causes disseminated disease in MSMD and should
    be avoided once the diagnosis is known or suspected in a sibling. This is
    the agents-and-circumstances-to-avoid consideration for the disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of BCG vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    description: >-

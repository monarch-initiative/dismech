inheritance:
- name: Autosomal recessive
  description: >-
    Complete IRF1 deficiency arises from biallelic loss-of-function IRF1
    variants in unrelated children; the disease is classified among the
    autosomal recessive inborn errors of transcription factors governing
    IFN-gamma immunity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36867972
    reference_title: "Inborn errors of human transcription factors governing IFN-γ antimycobacterial immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IEI mainly affecting myeloid and/or lymphoid function (AR and AD STAT1 LOF, AD STAT1 GOF, AR IRF1, and AD NFKB1 deficiencies)"
    explanation: Classifies IRF1 deficiency as autosomal recessive within the transcription-factor MSMD group.
pathophysiology:
- name: IRF1 Loss of Function
  description: >-
    Biallelic loss-of-function IRF1 variants abolish the transcription factor
    entirely. IRF1 is not itself an interferon receptor or a signalling kinase;
    it is the induced transcriptional effector through which interferon
    signalling is converted into a change in gene expression, so its loss
    leaves upstream receptor and JAK-STAT signalling intact while removing the
    transcriptional output that depends on it.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of the IFN-gamma-Induced Transcriptional Programme
    causal_link_type: DIRECT
    description: >-
      With no IRF1 protein, the IFN-gamma-induced genes that require it are not
      transcribed.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In leukocytes or fibroblasts stimulated in vitro, IRF1-dependent responses to IFN-γ are, both quantitatively and qualitatively, much stronger than those to IFN-α/β."
      explanation: Establishes that the transcriptional response IRF1 carries is predominantly the IFN-gamma-driven one, so its loss removes that programme specifically.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe unrelated children with inherited complete IRF1 deficiency and early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens."
    explanation: Identifies complete IRF1 deficiency in unrelated children as the cause of the disease.
- name: Failure of the IFN-gamma-Induced Transcriptional Programme
  description: >-
    IFN-gamma binds an intact receptor and signals normally, but the
    IRF1-dependent arm of the induced transcriptional response is absent. The
    defect is therefore in the response to the cytokine rather than in its
    production - a distinction that separates this disease from the MSMD
    etiologies caused by impaired IL-12/IL-23-driven IFN-gamma output, and that
    determines which treatments can work.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Type II interferon-mediated signaling
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: Cellular response to interferon-gamma
    term:
      id: GO:0071346
      label: cellular response to type II interferon
    modifier: DECREASED
  downstream:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    causal_link_type: DIRECT
    description: >-
      The IRF1-dependent genes are the ones that arm the mononuclear phagocyte
      against intracellular mycobacteria, so their absence disarms the cell.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens normally when stimulated with IFN-γ."
      explanation: Directly couples the transcriptional failure to loss of pathogen control in the effector cell, under IFN-gamma stimulation.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)"
    explanation: Places this disease within the MSMD group defined by disruption of IFN-gamma-mediated immunity.
- name: Loss of Macrophage Antimycobacterial Effector Function
  description: >-
    The mononuclear phagocyte is the cell in which weakly virulent mycobacteria
    live and the cell that IFN-gamma normally activates to kill them. Without
    the IRF1-dependent programme, IFN-gamma-stimulated macrophages fail to
    control mycobacteria and related intramacrophagic organisms, so an
    ordinarily self-limiting exposure - a BCG vaccination, an environmental
    mycobacterium - becomes a progressive, disseminating infection.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Mononuclear phagocyte
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  - preferred_term: Antibacterial defense response
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: BCGosis
    causal_link_type: DIRECT
    description: >-
      Live BCG vaccine strains are controlled by IFN-gamma-activated
      macrophages; without that control they disseminate.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MSMD confers a selective susceptibility to infections with weakly virulent mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines"
      explanation: States the causal relation between the MSMD immune defect and BCG disease.
  - target: Non-tuberculous mycobacterial infection
    causal_link_type: DIRECT
    description: >-
      Environmental mycobacteria, normally cleared without incident, cause
      progressive infection for the same reason.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens"
      explanation: Reports the clinical consequence of the macrophage defect in IRF1-deficient children.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens normally when stimulated with IFN-γ."
    explanation: The direct cellular demonstration that defines this node.
mechanistic_hypotheses:
- hypothesis_group_id: irf1_interferon_arm_asymmetry
  hypothesis_label: IRF1 is essential for the IFN-gamma arm and redundant for the IFN-alpha/beta arm despite being induced by both
  status: CANONICAL
  description: >-
    IRF1 is induced by both type I and type II interferons, which predicts a
    combined antiviral and antimycobacterial defect. The observed phenotype
    contradicts that prediction: mycobacterial disease is severe and
    early-onset, while antiviral immunity is essentially preserved. Two
    independent lines of evidence support the asymmetry rather than
    ascertainment - the clinical course (no severe viral disease despite
    documented exposure to many viruses, including SARS-CoV-2, which is
    life-threatening in impaired type I interferon immunity) and the cellular
    phenotype (intrinsic immunity to nine viruses almost normal in
    IRF1-deficient fibroblasts). The interpretation is that IRF1 carries a much
    larger share of the IFN-gamma-induced response than of the IFN-alpha/beta
    response, so other effectors cover for its loss in the type I arm but not
    the type II arm. This is recorded as CANONICAL rather than EMERGING because
    the negative antiviral result is experimentally demonstrated across nine
    viruses rather than merely unobserved.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These children have no history of severe viral disease, despite exposure to many viruses, including SARS-CoV-2, which is life-threatening in individuals with impaired IFN-α/β immunity."
    explanation: The clinical half of the asymmetry - preserved antiviral immunity in vivo, with an explicit positive control in the comparison to type I interferon defects.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IFN-α/β-dependent intrinsic immunity to nine viruses, including SARS-CoV-2, is almost normal in IRF1-deficient fibroblasts."
    explanation: The cellular half - a demonstrated negative result across nine viruses, not an absence of observation.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human IRF1 is essential for IFN-γ-dependent macrophagic immunity to mycobacteria, but largely redundant for IFN-α/β-dependent antiviral immunity."
    explanation: The authors' own statement of the asymmetry that this hypothesis records.
phenotypes:
- category: Immunological
  name: BCGosis
  description: >-
    Disseminated disease caused by the live attenuated BCG vaccine strain, the
    defining presentation of MSMD in BCG-vaccinating countries.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:

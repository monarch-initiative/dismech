name: IRF1 Deficiency
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 117
- IMD117
- autosomal recessive complete IRF1 deficiency
- IRF1-related Mendelian susceptibility to mycobacterial disease
description: >-
  IRF1 deficiency (immunodeficiency 117) is an autosomal recessive inborn error
  of immunity that presents as Mendelian susceptibility to mycobacterial disease
  (MSMD): early-onset, multiple, life-threatening infection with weakly virulent
  mycobacteria - BCG vaccine strains and environmental mycobacteria - and other
  intramacrophagic pathogens, in children with otherwise unremarkable
  resistance to infection.

  IRF1 is a transcription factor induced downstream of both type I and type II
  interferons, which made it a plausible candidate for a combined antiviral and
  antimycobacterial defect. The finding that defines this disease is that it is
  not one. IRF1-dependent responses to IFN-gamma are far stronger than those to
  IFN-alpha/beta, and complete IRF1 deficiency abolishes the IFN-gamma-driven
  macrophage programme that normally restricts intracellular mycobacteria while
  leaving IFN-alpha/beta-dependent intrinsic antiviral immunity almost intact.
  The reported children had no history of severe viral disease despite
  documented exposure to many viruses including SARS-CoV-2, which is
  life-threatening in people with impaired type I interferon immunity. Human
  IRF1 is therefore essential for one interferon arm and largely redundant for
  the other, even though both induce it.

  The lesion sits downstream of the IFN-gamma receptor, in the response to the
  cytokine rather than its production. That placement is what determines
  management: recombinant IFN-gamma, which benefits MSMD patients whose defect
  is impaired IFN-gamma production, has no mechanistic rationale here, and
  hematopoietic stem cell transplantation is the therapeutic option that
  remains.
disease_term:
  preferred_term: IRF1 deficiency
  term:
    id: MONDO:0958011
    label: immunodeficiency 117
parents:
- inborn error of immunity
- autosomal recessive disease
references:
- reference: PMID:36736301
  title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
inheritance:
- name: Autosomal recessive
  description: >-
    Complete IRF1 deficiency arises from biallelic loss-of-function IRF1
    variants in unrelated children; the disease is classified among the
    autosomal recessive inborn errors of transcription factors governing
    IFN-gamma immunity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36867972
    reference_title: "Inborn errors of human transcription factors governing IFN-γ antimycobacterial immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IEI mainly affecting myeloid and/or lymphoid function (AR and AD STAT1 LOF, AD STAT1 GOF, AR IRF1, and AD NFKB1 deficiencies)"
    explanation: Classifies IRF1 deficiency as autosomal recessive within the transcription-factor MSMD group.
pathophysiology:
- name: IRF1 Loss of Function
  description: >-
    Biallelic loss-of-function IRF1 variants abolish the transcription factor
    entirely. IRF1 is not itself an interferon receptor or a signalling kinase;
    it is the induced transcriptional effector through which interferon
    signalling is converted into a change in gene expression, so its loss
    leaves upstream receptor and JAK-STAT signalling intact while removing the
    transcriptional output that depends on it.
  biological_scale: MOLECULAR
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Both reported patients are homozygous for a germline nonsense allele from
      a consanguineous kindred, and no truncated protein is detectable, so the
      functional consequence is complete loss of function rather than a
      hypomorphic effect.
  downstream:
  - target: Failure of the IFN-gamma-Induced Transcriptional Programme
    causal_link_type: DIRECT
    description: >-
      With no IRF1 protein, the IFN-gamma-induced genes that require it are not
      transcribed.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In leukocytes or fibroblasts stimulated in vitro, IRF1-dependent responses to IFN-γ are, both quantitatively and qualitatively, much stronger than those to IFN-α/β."
      explanation: Establishes that the transcriptional response IRF1 carries is predominantly the IFN-gamma-driven one, so its loss removes that programme specifically.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe unrelated children with inherited complete IRF1 deficiency and early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens."
    explanation: Identifies complete IRF1 deficiency in unrelated children as the cause of the disease.
- name: Failure of the IFN-gamma-Induced Transcriptional Programme
  description: >-
    IFN-gamma binds an intact receptor and signals normally, but the
    IRF1-dependent arm of the induced transcriptional response is absent. The
    defect is therefore in the response to the cytokine rather than in its
    production - a distinction that separates this disease from the MSMD
    etiologies caused by impaired IL-12/IL-23-driven IFN-gamma output, and that
    determines which treatments can work.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Cellular response to interferon-gamma
    term:
      id: GO:0071346
      label: cellular response to type II interferon
    modifier: DECREASED
  downstream:
  - target: Loss of Macrophage Antimycobacterial Effector Function
    causal_link_type: DIRECT
    description: >-
      The IRF1-dependent genes are the ones that arm the mononuclear phagocyte
      against intracellular mycobacteria, so their absence disarms the cell.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens normally when stimulated with IFN-γ."
      explanation: Directly couples the transcriptional failure to loss of pathogen control in the effector cell, under IFN-gamma stimulation.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)"
    explanation: Places this disease within the MSMD group defined by disruption of IFN-gamma-mediated immunity.
- name: Loss of Macrophage Antimycobacterial Effector Function
  description: >-
    The mononuclear phagocyte is the cell in which weakly virulent mycobacteria
    live and the cell that IFN-gamma normally activates to kill them. Without
    the IRF1-dependent programme, IFN-gamma-stimulated macrophages fail to
    control mycobacteria and related intramacrophagic organisms, so an
    ordinarily self-limiting exposure - a BCG vaccination, an environmental
    mycobacterium - becomes a progressive, disseminating infection.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Mononuclear phagocyte
    term:
      id: CL:0000113
      label: mononuclear phagocyte
  biological_processes:
  - preferred_term: Macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  - preferred_term: Antibacterial defense response
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: BCGosis
    causal_link_type: DIRECT
    description: >-
      Live BCG vaccine strains are controlled by IFN-gamma-activated
      macrophages; without that control they disseminate.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MSMD confers a selective susceptibility to infections with weakly virulent mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines"
      explanation: States the causal relation between the MSMD immune defect and BCG disease.
  - target: Unusual Salmonella infection
    causal_link_type: DIRECT
    description: >-
      Non-typhoidal Salmonella is an intramacrophagic organism controlled by the
      same IFN-gamma-activated macrophage programme, which is why it recurs
      across MSMD etiologies.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "about half of them might develop non-typhoidal salmonellosis"
      explanation: Establishes salmonellosis as a consequence of the shared MSMD macrophage defect; the edge is group-level, as the phenotype description states.
  - target: Unusual Histoplasma capsulatum infection
    causal_link_type: DIRECT
    description: >-
      Histoplasma is likewise intramacrophagic. In this disease the link is
      strengthened by a second, IRF1-specific route - impaired IL-12p70
      induction in response to IFN-gamma.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Impaired IL-12p70 induction probably contributed to the disseminated histoplasmosis observed in P1"
      explanation: The authors' proposed mechanistic route from the IRF1 defect to the observed histoplasmosis.
  - target: Non-tuberculous mycobacterial infection
    causal_link_type: DIRECT
    description: >-
      Environmental mycobacteria, normally cleared without incident, cause
      progressive infection for the same reason.
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens"
      explanation: Reports the clinical consequence of the macrophage defect in IRF1-deficient children.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens normally when stimulated with IFN-γ."
    explanation: The direct cellular demonstration that defines this node.
mechanistic_hypotheses:
- hypothesis_group_id: irf1_interferon_arm_asymmetry
  hypothesis_label: IRF1 is essential for the IFN-gamma arm and redundant for the IFN-alpha/beta arm despite being induced by both
  status: CANONICAL
  description: >-
    IRF1 is induced by both type I and type II interferons, which predicts a
    combined antiviral and antimycobacterial defect. The observed phenotype
    contradicts that prediction: mycobacterial disease is severe and
    early-onset, while antiviral immunity is essentially preserved. Two
    independent lines of evidence support the asymmetry rather than
    ascertainment - the clinical course (no severe viral disease despite
    documented exposure to many viruses, including SARS-CoV-2, which is
    life-threatening in impaired type I interferon immunity) and the cellular
    phenotype (intrinsic immunity to nine viruses almost normal in
    IRF1-deficient fibroblasts). The interpretation is that IRF1 carries a much
    larger share of the IFN-gamma-induced response than of the IFN-alpha/beta
    response, so other effectors cover for its loss in the type I arm but not
    the type II arm. This is recorded as CANONICAL rather than EMERGING because
    the negative antiviral result is experimentally demonstrated across nine
    viruses rather than merely unobserved.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These children have no history of severe viral disease, despite exposure to many viruses, including SARS-CoV-2, which is life-threatening in individuals with impaired IFN-α/β immunity."
    explanation: The clinical half of the asymmetry - preserved antiviral immunity in vivo, with an explicit positive control in the comparison to type I interferon defects.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IFN-α/β-dependent intrinsic immunity to nine viruses, including SARS-CoV-2, is almost normal in IRF1-deficient fibroblasts."
    explanation: The cellular half - a demonstrated negative result across nine viruses, not an absence of observation.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human IRF1 is essential for IFN-γ-dependent macrophagic immunity to mycobacteria, but largely redundant for IFN-α/β-dependent antiviral immunity."
    explanation: The authors' own statement of the asymmetry that this hypothesis records.
phenotypes:
- category: Immunological
  name: BCGosis
  description: >-
    Disseminated disease caused by the live attenuated BCG vaccine strain, the
    defining presentation of MSMD in BCG-vaccinating countries.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MSMD confers a selective susceptibility to infections with weakly virulent mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines"
    explanation: Establishes BCG disease as a defining feature of the MSMD group to which IRF1 deficiency belongs.
- category: Immunological
  name: Non-tuberculous mycobacterial infection
  description: >-
    Infection with environmental mycobacteria, which are of low virulence in
    immunocompetent hosts, occurs early and may be multiple and
    life-threatening.
  phenotype_term:
    preferred_term: Non-tuberculous mycobacterial infection
    term:
      id: HP:5210115
      label: Non-tuberculous mycobacterial infection
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens"
    explanation: Describes the environmental mycobacterial disease seen in IRF1-deficient children.
- category: Immunological
  name: Unusual Histoplasma capsulatum infection
  description: >-
    Disseminated histoplasmosis was the only non-mycobacterial infection
    observed in the reported patients, occurring in P1. Histoplasma is an
    intramacrophagic fungus, and the authors attribute the susceptibility partly
    to impaired IL-12p70 induction in response to IFN-gamma - a second,
    IRF1-specific consequence beyond the macrophage effector defect. Unlike the
    Salmonella entry below, this phenotype was directly observed in an
    IRF1-deficient patient.
  phenotype_term:
    preferred_term: Unusual Histoplasma capsulatum infection
    term:
      id: HP:0032256
      label: Unusual Histoplasma capsulatum infection
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the only other infection observed, histoplasmosis, is caused by an intramacrophagic fungus"
    explanation: Records histoplasmosis as observed in the reported IRF1-deficient patients and explains why an intramacrophagic organism is expected.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired IL-12p70 induction probably contributed to the disseminated histoplasmosis observed in P1"
    explanation: Gives the IRF1-specific mechanistic route the authors propose for this susceptibility.
- category: Immunological
  name: Unusual Salmonella infection
  description: >-
    Non-typhoidal salmonellosis is the commonest non-mycobacterial infection in
    MSMD, reflecting the shared requirement for IFN-gamma-activated macrophages
    against intramacrophagic organisms. Reported for the MSMD group as a whole;
    the size of the published IRF1 cohort does not establish its frequency in
    this specific etiology.
  phenotype_term:
    preferred_term: Unusual Salmonella infection
    term:
      id: HP:5210093
      label: Unusual Salmonella infection
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "about half of them might develop non-typhoidal salmonellosis"
    explanation: Reports non-typhoidal salmonellosis across MSMD; the entry's description scopes this to the group rather than to IRF1 specifically.
genetic:
- name: IRF1
  association: Causal
  gene_term:
    preferred_term: IRF1
    term:
      id: hgnc:6116
      label: IRF1
  notes: >-
    Biallelic loss-of-function IRF1 variants causing complete deficiency were
    described in unrelated children by Rosain et al. IRF1 acts downstream of
    the IFN-gamma receptor as an induced transcription factor, so upstream
    receptor and JAK-STAT components are intact; the defect is in the response
    to IFN-gamma rather than its production.
  variant_origin: GERMLINE
  variants:
  - name: c.385C>T (p.R129*)
    description: >-
      Homozygous nonsense variant carried by P1, an eight-year-old girl born to
      consanguineous parents in Argentina. No truncated IRF1 protein was
      detectable in patient fibroblasts even after IFN-gamma pretreatment and
      prolonged immunoblot exposure, establishing complete loss of function
      rather than a hypomorphic effect.
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 1 (P1, kindred A) is an eight-year-old girl born to consanguineous parents originating from and living in Argentina"
      explanation: Establishes the consanguineous kindred in which this allele is homozygous.
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "no truncated IRF1 protein was detected in SV40-fibroblasts from P1 after pretreatment with IFN-γ"
      explanation: Demonstrates complete absence of protein, which is what makes this loss of function rather than partial.
  - name: c.103C>T (p.Q35*)
    description: >-
      Homozygous nonsense variant carried by P2, a seven-year-old girl born to
      consanguineous parents in Turkey - an independent kindred, which is what
      makes the gene-disease relationship rest on more than a single family.
    type: nonsense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36736301
      reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 2 (P2, kindred B) is a seven-year-old girl born to consanguineous parents originating from and living in Turkey"
      explanation: Establishes the second, independent consanguineous kindred.
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe unrelated children with inherited complete IRF1 deficiency and early-onset, multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic pathogens."
    explanation: Establishes IRF1 as the causal gene by linking complete deficiency to the mycobacterial phenotype in unrelated kindreds.
diagnosis:
- name: Whole-Exome Sequencing
  description: >-
    The route by which both patients were diagnosed. IRF1 deficiency
    phenocopies the upstream IFN-gamma receptor and STAT1 defects on clinical
    grounds, so sequencing rather than clinical pattern is what identifies it.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome sequencing (WES) on the two patients."
    explanation: The diagnostic method used in both reported kindreds.
- name: IRF1 Protein Detection with Preserved Upstream Signaling
  description: >-
    The discriminating functional workup. Absent IRF1 protein on immunoblot
    after IFN-gamma pretreatment, combined with normal STAT1 phosphorylation on
    interferon stimulation, localises the defect below the receptor and below
    STAT1 - separating IRF1 deficiency from the IFNGR1, IFNGR2 and STAT1 defects
    it resembles clinically. The preserved upstream signal is what makes the
    result specific rather than merely abnormal.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "no truncated IRF1 protein was detected in SV40-fibroblasts from P1 after pretreatment with IFN-γ"
    explanation: The absent-protein half of the discriminating result.
  - reference: PMID:36736301
    reference_title: "Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "assessed by evaluating STAT1 phosphorylation after 20 minutes of stimulation with IFN-α2b and IFN-β, was normal in both patients"
    explanation: The preserved-upstream-signalling half, which localises the lesion below STAT1.

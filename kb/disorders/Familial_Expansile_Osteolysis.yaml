treatments:
- name: Bisphosphonate Therapy
  description: >-
    Nitrogen-containing bisphosphonates are the mainstay. Intravenous
    zoledronic acid or pamidronate, or oral alendronate, suppress the
    biochemical markers of turnover for prolonged periods and in the allelic
    disorders have mineralised early lesions and improved bone density;
    the first-generation agents etidronate and clodronate gave only transient
    responses, which is why aminobisphosphonates are preferred. Whether
    treatment changes the natural history of established lesions, deafness
    or tooth loss is uncertain: in early-onset Paget disease the biochemical
    response was not matched by clinical benefit for deformity, deafness or
    tooth loss, and the strongest argument for early treatment is a single
    child with a 12-bp duplication who developed no focal lesions on
    alendronate. In the 75dup27 mouse, zoledronic acid completely prevented
    lesion development. The specific hazard is prolonged hypocalcaemia after
    potent intravenous dosing in a high-turnover skeleton, so calcium and
    vitamin D are replete before treatment and calcium is monitored after
    it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: alendronate
      term:
        id: CHEBI:2567
        label: alendronic acid
  target_mechanisms:
  - target: Constitutive Osteoclast Formation, Survival and Activation
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonates act on the osteoclast directly, inducing its apoptosis
      and inhibiting resorption downstream of RANK, so they bypass the
      question of whether the receptor's signalling is ligand-dependent.
    evidence:
    - reference: PMID:33724536
      reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Treatment of these mice with zoledronic acid completely prevented the development of lesions."
      explanation: >-
        Prevention of focal lesions by an osteoclast-targeted drug in the
        knock-in mouse; indirect because the allele is the PDB2 duplication.
    - reference: PMID:30756140
      reference_title: "Rare Inherited forms of Paget's Disease and Related Syndromes."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Bisphosphonates have been successfully used to gain control of elevated bone remodelling but as yet, no effective treatment exists for the treatment of the muscle and neurological manifestations of MSP syndromes."
      explanation: >-
        Review conclusion that bisphosphonates control the elevated
        remodelling in these disorders. Evidence source is OTHER because
        this is a review.
  evidence:

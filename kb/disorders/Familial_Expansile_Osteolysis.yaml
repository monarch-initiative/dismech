prevalence:
- population: Worldwide, reported kindreds and cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. In 2006 the disease had been observed
    world-wide in only three kinships and two unrelated American individuals;
    since then families or cases have been added from Spain, Iran, the Czech
    Republic, Australia and elsewhere, and the 2023 literature describes the
    TNFRSF11A duplication disorders collectively as ultra-rare. The Northern
    Irish kindred alone accounts for over 40 affected members across five
    generations.
  evidence:
  - reference: PMID:16470392
    reference_title: "Familial expansile osteolysis--not exclusively an adult disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial expansile osteolysis (FEO, MIM174810) is a rare syndrome which was observed world-wide in only three kinships and in two unrelated American individuals."
    explanation: >-
      The 2006 world count of known kindreds and cases.
  - reference: PMID:17447113
    reference_title: "Intragenic SNP haplotypes associated with 84dup18 mutation in TNFRSF11A in four FEO pedigrees suggest three independent origins for this mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 18-bp duplication in the first exon of the TNFRSF11A gene encoding RANK has been previously identified in four FEO pedigrees."
    explanation: >-
      Four molecularly confirmed pedigrees by 2007, before the Iranian
      family was added.
  - reference: PMID:36740137
    reference_title: "Early identification of a 12-bp tandem duplication in TNFRSF11A encoding receptor activator of nuclear factor-kappa B (RANK): Clinical characterization and response to bisphosphonate therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultra-rare mendelian osteolytic disorders caused by different length in-frame activating duplications within exon 1 of TNFRSF11A encoding receptor activator of nuclear factor-kappa B (RANK) comprise familial expansile osteolysis (FEO), expansile skeletal hyperphosphatasia (ESH), early-onset familial Paget's disease of bone (PDB2), juvenile Paget's disease 2 (JPD2), and panostotic expansile bone disease (PEBD)."
    explanation: >-
      The ultra-rare designation for the whole allelic series.
  - reference: PMID:3346299
    reference_title: "Familial expansile osteolysis. A new dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 40 cases in one family of an autosomal dominant bone dysplasia, which, though similar in some aspects to Paget's disease, seems unique in some features and in its natural history."
    explanation: >-

    alkaline phosphatase and urinary hydroxyproline are variably elevated
    while other biochemical indices stay normal, and the skeleton as a whole
    is osteopenic. The focal osteolytic lesions of the limbs, the ossicular
    resorption of the middle ear and the external root resorption of the

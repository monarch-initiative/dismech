pathophysiology:
- name: TNFRSF11A Exon 1 Signal-Peptide Tandem Duplication
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion. A heterozygous in-frame 18-base-pair tandem
    duplication in exon 1 of TNFRSF11A, the gene encoding receptor activator
    of NF-kappaB (RANK), inserts six amino acids into the signal peptide of
    the receptor. The classic allele is 84dup18; a second 18-bp duplication
    one base proximal to it adds the same six residues. Intragenic haplotypes
    show that the identical duplication has arisen independently at least
    three times, and the exon 1 sequence can form a stable secondary
    structure that may favour tandem duplication, which is why the same
    lesion recurs in unrelated families. The allelic 27-, 15- and 12-bp
    duplications in the same signal peptide cause the related disorders
    described in the notes.
  genes:
  - preferred_term: TNFRSF11A
    term:
      id: hgnc:11908
      label: TNFRSF11A
  genetic_context:
    genes:
    - preferred_term: TNFRSF11A
      term:
        id: hgnc:11908
        label: TNFRSF11A
    allele_type: in-frame 18-bp tandem duplication in exon 1 (signal peptide)
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Classified as gain of function on the basis of the original functional
      characterisation, in which both signal-peptide duplications increased
      RANK-mediated NF-kappaB signalling in vitro, and on the heterozygous
      disease phenotype of excessive osteoclast activity. The category is held
      with the caveat recorded in the knowledge gap below: the mutant
      receptor by itself cannot be activated by ligand, and how one mutant
      allele overactivates osteoclasts in heterozygous cells is unresolved.
  evidence:
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two heterozygous insertion mutations in exon 1 of TNFRSF11A in affected members of four families with FEO or familial Paget disease of bone (PDB)."
    explanation: >-
      The discovery of the causal lesion: heterozygous exon 1 insertions in
      affected members of four families.
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One was a duplication of 18 bases and the other a duplication of 27 bases, both of which affected the signal peptide region of the RANK molecule."
    explanation: >-
      Identifies the 18-bp duplication as the FEO allele and locates both
      duplications in the signal peptide.
  - reference: PMID:12568416
    reference_title: "Identification of a novel tandem duplication in exon 1 of the TNFRSF11A gene in two unrelated patients with familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analysis of the TNFRSF11A gene in our patients demonstrated an 18 base pair tandem duplication, one base proximal to the duplications previously reported."
    explanation: >-
      The second 18-bp allele, shifted by one base, in two unrelated
      patients.
  - reference: PMID:12568416
    reference_title: "Identification of a novel tandem duplication in exon 1 of the TNFRSF11A gene in two unrelated patients with familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This novel mutation results in addition of the same six amino acids to the RANK signal peptide that has been observed previously."
    explanation: >-
      Both 18-bp alleles produce the same six-residue extension of the
      signal peptide, which is why they are one disorder.
  - reference: PMID:12568416
    reference_title: "Identification of a novel tandem duplication in exon 1 of the TNFRSF11A gene in two unrelated patients with familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analysis of the exon 1 sequence demonstrated that it has the ability to form a stable secondary structure that may facilitate the generation of tandem duplications."
    explanation: >-
      Offers a reason for the recurrence of the same duplication in
      unrelated families.
  - reference: PMID:17447113
    reference_title: "Intragenic SNP haplotypes associated with 84dup18 mutation in TNFRSF11A in four FEO pedigrees suggest three independent origins for this mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the mutation in the Iranian and four of the previously described FEO pedigrees was the same, haplotypes based on the intragenic SNPs suggest that the mutations do not share a common descent."
    explanation: >-
      Haplotype evidence that the recurrent 18-bp duplication arose
      independently rather than from a founder.
  - reference: PMID:7911698
    reference_title: "Genetic linkage of familial expansile osteolysis to chromosome 18q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene which causes the disease shows tight linkage with several polymorphic markers on chromosome 18q with a maximum lod score of 11.53 at a recombination fraction of 0.00 with D18S64."
    explanation: >-
      The linkage result that placed the disease at 18q, where TNFRSF11A
      maps, before the gene was identified.
  downstream:
  - target: Failure of RANK Signal-Peptide Cleavage and Endoplasmic Reticulum Retention
    causal_link_type: DIRECT
    description: >-
      Lengthening the signal peptide prevents its cleavage, so the
      receptor is not processed through the secretory pathway normally.
    evidence:
    - reference: PMID:10615125
      reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of recombinant forms of the mutant RANK proteins revealed perturbations in expression levels and lack of normal cleavage of the signal peptide."
      explanation: >-
        The first demonstration that the duplication abolishes normal
        signal-peptide cleavage, which is the step this edge asserts.
- name: Failure of RANK Signal-Peptide Cleavage and Endoplasmic Reticulum Retention
  biological_scale: MOLECULAR
  description: >-
    The elongated signal peptide is not removed. In two independent in vitro
    translation systems the mutant proteins fail signal-peptide cleavage,
    and when expressed in cells mutant RANK does not reach the plasma
    membrane but accumulates in extensive areas of organised smooth
    endoplasmic reticulum, where wild-type RANK is found at the membrane and
    in the Golgi. Reviews describe the consequence as the protein translated
    from the mutant allele being trapped in the endoplasmic reticulum. The
    mutant receptor that does accumulate cannot be activated by RANK ligand,
    so whatever it does to the cell, it does not do it by responding to
    ligand in the ordinary way.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: retention of mutant RANK in the endoplasmic reticulum
    term:
      id: GO:0035437
      label: maintenance of protein localization in endoplasmic reticulum
    modifier: INCREASED
  evidence:
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This intracellular accumulation of the mutant proteins is probably the result of lack of signal peptide cleavage because, using two in vitro translation systems, we demonstrate that the mutations in RANK prevent cleavage of the signal peptide."
    explanation: >-
      Direct demonstration that the duplications prevent signal-peptide
      cleavage, and the authors' link from that failure to intracellular
      accumulation.
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When overexpressed, mutant RANK did not localize to the plasma membrane but localized to extensive areas of organized smooth endoplasmic reticulum, whereas, as expected, wild-type RANK was detected at the plasma membrane and in the Golgi apparatus."
    explanation: >-
      The localisation result behind the endoplasmic-reticulum retention in
      this node's name.
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, only cells expressing wild-type RANK demonstrated ligand-dependent activation of NF-κB."
    explanation: >-
      The retained mutant receptor is not ligand-responsive, which
      constrains every downstream explanation of the disease.
  - reference: PMID:20458572
    reference_title: "New knowledge on critical osteoclast formation and activation pathways from study of rare genetic diseases of osteoclasts: focus on the RANK/RANKL axis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These prevent signal peptide cleavage, trapping the protein translated from the mutated allele in the endoplasmic reticulum."
    explanation: >-
      Review summary of the cleavage failure and ER trapping. Evidence source
      is OTHER because this is a review.
  downstream:
  - target: Ligand-Independent RANK Signalling and NF-kappaB Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step that is inferred rather than demonstrated. The retained,
      ligand-unresponsive mutant receptor is nonetheless associated with
      increased NF-kappaB signalling in the discovery study and with
      overactive osteoclasts in patients; the route, whether self-association
      of misfolded receptor, an unfolded-protein response, or an effect of the
      mutant allele on the wild-type receptor in the same cell, is
      unresolved.
- name: Ligand-Independent RANK Signalling and NF-kappaB Activation
  biological_scale: MOLECULAR
  description: >-
    RANK signalling that is no longer under the control of RANK ligand. In
    the discovery study, recombinant mutant RANK increased RANK-mediated
    NF-kappaB signalling in vitro relative to wild type, and the mutations
    were read as activating; reviews state the mechanism as osteoclast
    activation through NF-kappaB independent of ligand. The later study of
    stably transfected cells found that constitutive activation occurred only
    with overexpression, of wild-type as well as mutant RANK, and not at low
    expression levels, and concluded that the disease cannot be explained by
    the mutant receptor alone. The modifier is recorded as GAIN_OF_FUNCTION
    rather than INCREASED because the claim is qualitative: the pathway has
    escaped its ligand, not merely risen above its normal level. The
    disagreement about how it escaped is the entry's knowledge gap.
  biological_processes:
  - preferred_term: ligand-independent RANK-mediated NF-kappaB signalling
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: GAIN_OF_FUNCTION
  - preferred_term: tumour necrosis factor receptor superfamily (RANK) signalling
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both mutations caused an increase in RANK-mediated nuclear factor-kappaB (NF-kappaB) signalling in vitro, consistent with the presence of an activating mutation."
    explanation: >-
      The original activating-mutation interpretation on which the gain of
      function classification rests.
  - reference: PMID:30756140
    reference_title: "Rare Inherited forms of Paget's Disease and Related Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutations interfere with normal processing of RANK and cause osteoclast activation through activation of nuclear factor kappa B (NFκB) independent of RANK ligand stimulation."
    explanation: >-
      A review states the ligand-independent NF-kappaB activation that names
      this node. Evidence source is OTHER because this is a review.
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We show here that constitutive activation of NF-κB occurred in HEK293 cells overexpressing wild-type or mutant RANK but not in stably transfected cell lines expressing low levels of each RANK gene."
    explanation: >-
      Recorded as REFUTE of the simple constitutive-activation model: at
      physiological expression levels the mutant receptor did not activate
      NF-kappaB, and overexpression activated it regardless of mutation.
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Previous studies have shown that overexpression of these mutant proteins causes constitutive activation of NF-κB signaling in vitro, and it has been assumed that this accounts for the focal osteolytic lesions that are seen in vivo."
    explanation: >-
      States the assumption the field had made, and that this study set out
      to test, which is the position this node records.
  downstream:
  - target: Constitutive Osteoclast Formation, Survival and Activation
    causal_link_type: DIRECT
    description: >-
      RANK signalling into NF-kappaB is the pathway that instructs osteoclast
      differentiation, survival and activity, so signalling that has escaped
      ligand control produces osteoclasts that are not under the skeleton's
      normal regulation.
    evidence:
    - reference: PMID:21472776
      reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Familial expansile osteolysis and related disorders are caused by heterozygous tandem duplication mutations in the signal peptide region of the gene encoding receptor activator of NF-κB (RANK), a receptor critical for osteoclast formation and function."
      explanation: >-
        Names RANK as the receptor critical for osteoclast formation and
        function, which is why altered RANK signalling lands on the osteoclast.
- name: Constitutive Osteoclast Formation, Survival and Activation
  biological_scale: CELLULAR
  conforms_to: "osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis"
  description: >-
    Osteoclasts form, persist and resorb in excess of what the skeleton has
    asked for. Affected bone shows increased osteoclast and osteoblast
    activity, and the mouse carrying the allelic 75dup27 duplication shows
    what the heterozygous state does to the lineage: RANKL-induced osteoclast
    formation and signalling in marrow cells is impaired, yet osteoclast
    survival is increased independently of RANKL, and the animals develop
    focal osteolytic lesions. The same allele in homozygous form abolishes
    osteoclasts altogether and causes osteopetrosis, which shows that the
    mutant receptor is not simply hyperactive but that one mutant allele
    beside a wild-type one changes osteoclast behaviour in a way that neither
    allele alone explains. This node conforms to the module's RANKL-driven
    osteoclastogenesis step with the substitution that the driver is a
    receptor escaped from ligand control rather than an excess of ligand.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  - preferred_term: osteoclast survival (reduced apoptosis)
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The osteolytic lesions, which develop usually in the long bones during early adulthood, show increased osteoblast and osteoclast activity."
    explanation: >-
      The histological observation in patients that both osteoclast and
      osteoblast activity are increased in lesions, which is why this is a
      high-turnover rather than a formation-deficient disease.
  - reference: PMID:33724536
    reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "This intriguing study has shown that in heterozygous form, the 75dup27 mutation causes focal osteolytic lesions in vivo reminiscent of the human disorder and extends osteoclast survival independently of RANKL signaling."
    explanation: >-
      The clearest cellular statement of what a heterozygous signal-peptide
      duplication does to osteoclasts: it extends their survival without
      RANKL. Indirect because the allele is the PDB2 27-bp duplication, not
      the FEO 18-bp one.
  - reference: PMID:33724536
    reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In homozygous form, however, the mutation causes osteopetrosis due to failure of osteoclast formation and insensitivity to RANKL stimulation."
    explanation: >-
      The homozygous result that rules out a simple hyperactive receptor and
      makes the heterozygous interaction the object of the mechanism.

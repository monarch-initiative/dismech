notes: >-
  Scope and lump/split decision. This entry is the 18-bp duplication disorder
  (84dup18 and the one-base-shifted equivalent) that carries the name familial
  expansile osteolysis and MONDO:0008275. The allelic TNFRSF11A signal-peptide
  disorders are described here but are not curated as subtypes: early-onset
  familial Paget disease of bone (PDB2, MONDO:0011183; 27-bp duplications
  75dup27, 77dup27, 78dup27, 72dup27), expansile skeletal hyperphosphatasia
  (ESH; 15-bp duplication 84dup15; no MONDO term was found), juvenile Paget
  disease 2 (87dup15) and panostotic expansile bone disease (PEBD; 12-bp
  duplication). They share the molecular lesion, the deafness and the tooth
  loss, and differ in the skeletal pattern: ESH has hyperostotic widening of
  the long bones with painful phalangeal lesions and episodic hypercalcaemia
  rather than large cortical-thinning osteolytic lesions; PDB2 has a Paget-like
  lytic-sclerotic picture with striking jaw and skull involvement; PEBD has
  panostotic disease with massive jaw tumours. Evidence from these allelic
  disorders is used here only where it bears on the shared mechanism or on the
  treatment class, and is marked directness INDIRECT when it does. Juvenile
  Paget disease (TNFRSF11B, osteoprotegerin loss) and classic Paget disease of
  bone (SQSTM1 and others; see Paget_Disease_of_Bone) are different genes and
  different entries; both are cross-referenced because the middle of the
  causal chain, unrestrained RANK signalling into osteoclasts, is common to all
  of them.

  Module conformance. Two nodes conform to osteoporosis_bone_resorption. The
  osteoclast node conforms to RANKL-Driven Osteoclastogenesis with the
  disorder-specific substitution that the module's driver, a raised RANKL/OPG
  ratio, is replaced here by a constitutively mis-signalling RANK receptor;
  the ligand is not in excess, the receptor is out of ligand control. The focal
  osteolysis node conforms to Increased Osteoclastic Bone Resorption. The
  entry deliberately does not conform to the module's Impaired Osteoblastic
  Bone Formation node, because FEO is a high-turnover disease in which
  osteoblast activity is increased alongside osteoclast activity rather than
  deficient; the bone is lost because resorption outruns a formation arm that
  is itself working hard, not because formation has failed.

  Animal model. No mouse carrying the FEO 18-bp duplication has been reported.
  The only knock-in model of a TNFRSF11A signal-peptide duplication carries the
  PDB2 allele 75dup27, and it is curated as a partial model with that caveat.
  Earlier whole-animal work referred to in reviews is not curated because the
  primary reports with quotable methods were not found.

  Provenance. Built from an Edison (Falcon) deep-research report,
  research/Familial_Expansile_Osteolysis-deep-research-falcon.md, which
  passed the Named-Entity-Confusion preflight against MONDO:0008275. Falcon
  cites by DOI and by corpus key; every source used here was resolved to its
  PubMed record and quoted from the cached abstract, and the primary papers
  the report did not carry (the 1988 and 1989 Northern Irish descriptions,
  the 1990 dental studies, the 1994 linkage paper, the 2003 and 2007
  mutation papers, the 2005 ossicle study and the 2025 denosumab case) were
  found through PubMed directly. Three papers the brief asked for, the 2002
  American kindred description in Medicine, the 2002 Spanish kindred paper and
  the 1996 incus necrosis study, have no abstract in PubMed and are listed as
  references without quoted evidence. The Schafer 2014 paper named in the
  brief as a denosumab report is the panostotic expansile bone disease case
  and describes alendronate and pamidronate, not denosumab; it is cited for
  what it says. No GeneReviews chapter exists for this disorder.

    childhood, preservation of teeth where feasible, prosthodontic
    replacement of lost teeth, and caution with orthodontic force and
    invasive dental surgery. Root resorption is often the presenting finding
    in a child and is a prognosticator of later bone disease, so unexplained
    multiple external root resorption should prompt genetic testing. Whether
    antiresorptive drugs slow root resorption is unproven; alendronate was
    proposed for that purpose in the allelic ESH family before the gene was
    known.

name: Familial Expansile Osteolysis
creation_date: "2026-09-04T23:23:40Z"
description: >-
  Familial expansile osteolysis (FEO) is an ultra-rare autosomal dominant
  disorder of osteoclast regulation in which a heterozygous in-frame tandem
  duplication in exon 1 of TNFRSF11A lengthens the signal peptide of RANK, the
  receptor that drives osteoclast formation. The mutant receptor is not
  processed normally: its signal peptide is not cleaved, most of the protein
  is retained in the endoplasmic reticulum, and osteoclast lineage cells that
  carry one copy of it form more osteoclasts, keep them alive longer and
  resorb more bone than RANK ligand alone would instruct. The result is a
  skeleton in which remodelling runs fast everywhere and, at scattered sites
  in the limb bones, runs away entirely.

  The clinical sequence is stereotyped and is the basis of recognition. The
  first sign is usually hearing loss in early childhood, conductive at first
  and later mixed, reflecting resorption and in some patients complete loss of
  the middle-ear ossicles. The permanent teeth then undergo idiopathic
  external root resorption and are lost prematurely in adolescence. From the
  second decade, focal osteolytic lesions appear in the long bones of the
  limbs, particularly the tibia, and advance along the shaft, thinning the
  cortex and expanding the medullary cavity until the bone is deformed,
  painful and liable to pathological fracture. Serum alkaline phosphatase and
  urinary hydroxyproline are variably raised, and the end stage of a lesion is
  fat-filled bone rather than the sclerosis of Paget disease.

  What organises this entry is the unresolved question of how a misprocessed
  receptor produces overactive osteoclasts. The original discovery study found
  that the mutant proteins increased NF-kappaB signalling in vitro and
  treated them as activating mutations; a later study showed that this
  constitutive activation appears only with overexpression, that mutant RANK
  cannot be activated by its ligand, and that the phenotype must arise from
  something the mutant allele does to signalling in heterozygous cells. The
  chain below records the demonstrated steps, marks the inferred one, and
  carries the disagreement as a knowledge gap rather than settling it.

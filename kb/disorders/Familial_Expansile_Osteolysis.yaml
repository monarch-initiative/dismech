- name: Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption"
  description: >-
    The defining skeletal lesion. From the second decade, focal osteolytic
    lesions arise mainly in the limb bones, the tibia above all, and advance
    along the shaft. Progressive osteoclastic resorption is accompanied by
    medullary expansion and cortical thinning, so the bone widens as it
    weakens; the sequence ends in pain, severe deformity and pathological
    fracture. Unlike Paget disease, the lesion does not pass into a sclerotic
    phase: osteolysis progresses to fat-filled bone. Extensive peripheral and
    even skull involvement has been described in childhood-onset disease.
    Conforms to the module's central resorption effector with the caveat
    that here the resorption is focal and expansile rather than the diffuse
    trabecular loss of osteoporosis.

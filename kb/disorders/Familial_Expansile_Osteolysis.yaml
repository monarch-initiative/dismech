animal_models:
- name: Tnfrsf11a 75dup27 heterozygous knock-in mouse
  species: Mouse
  genotype: Tnfrsf11a 75dup27 heterozygous (Tnfrsf11a75dup27/-)
  publication: PMID:33724536
  description: >-
    A knock-in mouse carrying the human 27-bp signal-peptide duplication that
    causes early-onset familial Paget disease of bone, the allelic disorder
    of FEO. Heterozygotes develop age-dependent focal osteolytic lesions of
    the hind limbs, and zoledronic acid prevents them. Marrow cells show
    impaired RANKL-induced osteoclast formation and signalling but increased
    osteoclast survival independent of RANKL. It is the only knock-in model
    of a TNFRSF11A signal-peptide duplication; no mouse carrying the FEO
    18-bp allele has been reported.
  modeled_mechanisms:
  - target: Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces age-dependent focal osteolytic lesions of the limb bones
      from a heterozygous signal-peptide duplication, which is the defining
      lesion of this node.
    limitations: >-
      The allele is the PDB2 27-bp duplication, not the FEO 18-bp one, so
      the model speaks to the shared signal-peptide mechanism rather than to
      FEO specifically; the human 27-bp phenotype is Paget-like with
      lytic-sclerotic lesions and jaw involvement rather than purely lytic,
      expansile limb disease. The lesions appear with age in a mouse, not
      from the second decade of a human life, and the abstract reports no
      hearing or dental phenotype.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Murine long bones and remodelling rates differ from human, and the
        mouse does not report the deafness and dental disease that precede
        skeletal disease in patients.
    readouts:
    - name: Focal osteolytic lesions of the hind limbs
      target: Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
      direction: INCREASED
      interpretation: >-
        Age-dependent focal osteolysis in heterozygotes is the tissue-level
        correlate of the human lesion in this model.
      evidence:
      - reference: PMID:33724536
        reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This intriguing study has shown that in heterozygous form, the 75dup27 mutation causes focal osteolytic lesions in vivo reminiscent of the human disorder and extends osteoclast survival independently of RANKL signaling."
        explanation: >-
          Reports the focal osteolytic lesions that constitute this readout.
    - name: Lesion development under zoledronic acid
      target: Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
      direction: ABOLISHED
      interpretation: >-
        Complete prevention of lesions by an osteoclast-targeted drug shows
        that the lesion is osteoclast-driven and drug-preventable in this
        model.
      evidence:
      - reference: PMID:33724536
        reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment of these mice with zoledronic acid completely prevented the development of lesions."
        explanation: >-
          The prevention result behind this readout.
    evidence:
    - reference: PMID:33724536
      reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Early onset familial Paget's disease of bone (EoPDB), familial expansile osteolysis, and expansile skeletal hyperphosphatasia are related disorders caused by insertion mutations in exon 1 of the TNFRSF11A gene, which encodes receptor activator of nuclear factor κB (RANK) protein."
      explanation: >-
        The authors' own framing of the model as informative for the whole
        family of signal-peptide duplication disorders, FEO included.
  - target: Constitutive Osteoclast Formation, Survival and Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows the heterozygous osteoclast phenotype: RANKL-driven formation is
      impaired, yet survival is prolonged without RANKL and lesions form in
      vivo, which is the paradox this node carries.
    limitations: >-
      Same allelic caveat as above. In addition, the model shows impaired
      rather than enhanced RANKL-induced osteoclast formation in marrow
      culture, so it recapitulates the survival component of the node and
      the in vivo outcome but not the increased differentiation the module
      target asserts.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse marrow osteoclastogenesis assays are a proxy for the human
        osteoclast lineage; no patient osteoclast data exist for comparison.
    readouts:
    - name: Osteoclast survival in the absence of RANKL
      target: Constitutive Osteoclast Formation, Survival and Activation
      direction: INCREASED
      interpretation: >-
        Prolonged osteoclast survival independent of ligand is the cellular
        signature of the mutant allele in this model.
      evidence:
      - reference: PMID:33724536
        reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Studies in vitro showed that RANK ligand (RANKL)-induced osteoclast formation and signaling was impaired in bone marrow cells from Tnfrsf11a75dup27/- animals, but that osteoclast survival was increased independent of RANKL stimulation."
        explanation: >-
          Reports both the impaired formation recorded in the limitations
          and the increased survival that is this readout.
    evidence:
    - reference: PMID:33724536
      reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This intriguing study has shown that in heterozygous form, the 75dup27 mutation causes focal osteolytic lesions in vivo reminiscent of the human disorder and extends osteoclast survival independently of RANKL signaling."
      explanation: >-
        Supports treating the heterozygous model as informative for the
        osteoclast node.
- name: Tnfrsf11a 75dup27 homozygous knock-in mouse
  species: Mouse
  genotype: Tnfrsf11a 75dup27 homozygous (Tnfrsf11a75dup27/75dup27)
  publication: PMID:33724536
  description: >-
    The same allele in homozygous form. Rather than a more severe osteolytic
    disease, homozygotes have osteopetrosis at birth with complete absence
    of osteoclasts, and their marrow cells fail to form osteoclasts in
    response to RANKL and M-CSF. The result is curated because it is the
    single most informative negative finding about the mechanism: a
    receptor that was simply constitutively active would not abolish
    osteoclasts when present in two copies.
  modeled_mechanisms:
  - target: Constitutive Osteoclast Formation, Survival and Activation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Two copies of the mutant allele produce the opposite of the human
      disease at the osteoclast: no osteoclasts at all.
    limitations: >-
      No homozygous human exists, so the model tests a state the disease
      never occupies; its value is mechanistic, not phenotypic. It shows that
      the mutant receptor alone cannot drive osteoclastogenesis and that the
      human heterozygous phenotype depends on the co-presence of wild-type
      RANK, which is the content of the knowledge gap.
    evidence:
    - reference: PMID:33724536
      reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, Tnfrsf11a75dup27/75dup27 homozygotes had osteopetrosis at birth, with complete absence of osteoclasts."
      explanation: >-
        The homozygous osteopetrosis that is the failure to recapitulate.
    - reference: PMID:33724536
      reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bone marrow cells from these mice failed to form osteoclasts in response to RANKL and macrophage colony-stimulating factor (M-CSF) stimulation."
      explanation: >-
        The cellular basis: the mutant receptor alone cannot support
        osteoclast formation.
discussions:
- discussion_id: feo_constitutive_activation_versus_misprocessing
  prompt: >-
    Does the heterozygous TNFRSF11A signal-peptide duplication cause
    osteoclast overactivity through constitutive, ligand-independent
    NF-kappaB signalling by the mutant receptor, or through an effect of the
    misprocessed, ER-retained protein on the wild-type receptor or on the
    cell, such as an unfolded-protein response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of RANK Signal-Peptide Cleavage and Endoplasmic Reticulum Retention
  - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
  rationale: >-
    The two positions are both in the literature and are not reconciled. The
    discovery study found increased NF-kappaB signalling from recombinant
    mutant RANK and called the mutations activating, and reviews still state
    the mechanism as ligand-independent NF-kappaB activation. The 2011 study
    found that constitutive activation occurred only with overexpression and
    of wild-type RANK as much as mutant, that at low expression the mutant
    receptor neither activated NF-kappaB constitutively nor responded to
    ligand, and that the mutant protein sits in the endoplasmic reticulum
    rather than at the membrane; it concluded that the disease cannot be
    explained by the mutant receptor alone. The knock-in mouse then showed
    that two mutant alleles abolish osteoclasts while one mutant allele
    beside a wild-type one prolongs osteoclast survival without RANKL, which
    is compatible with either a dominant effect of the misfolded protein on
    the cell or an interaction with wild-type receptor, and with neither
    simple model. Reviews have proposed an unfolded-protein-response route to
    NF-kappaB, which has not been tested in osteoclasts. The question matters
    for treatment: if signalling is truly ligand-independent, RANKL blockade
    should be ineffective, and the single denosumab response argues the other
    way. Every functional study to date has used the 27-bp or heterologous
    overexpression systems; no patient-derived osteoclast study of the 18-bp
    allele has been published.
  evidence:
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results strongly suggest that the increased osteoclast formation/activity caused by these mutations cannot be explained by studying the homozygous phenotype alone but requires further detailed investigation of the heterozygous expression of the mutant RANK proteins."
    explanation: >-
      The authors' own statement of the gap: the heterozygous state, not the
      mutant receptor alone, holds the explanation.
  - reference: PMID:20458572
    reference_title: "New knowledge on critical osteoclast formation and activation pathways from study of rare genetic diseases of osteoclasts: focus on the RANK/RANKL axis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whole animal studies replicate the hyperactive osteoclast phenotype associated with these disorders and present only with heterozygous expression of the mutation, suggesting an as yet unexplained effect of the mutant allele on normal RANK function."
    explanation: >-
      A review names the unexplained effect of the mutant allele on normal
      RANK function as the open question. Evidence source is OTHER.
  - reference: PMID:33724536
    reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In homozygous form, however, the mutation causes osteopetrosis due to failure of osteoclast formation and insensitivity to RANKL stimulation."
    explanation: >-
      The homozygous result that excludes a simply hyperactive receptor and
      keeps the gap open.
  proposed_experiments:
  - experiment_id: feo_patient_osteoclast_84dup18_signalling
    name: NF-kappaB and unfolded-protein-response signalling in heterozygous 84dup18 osteoclasts
    description: >-
      Differentiate osteoclasts from peripheral blood monocytes or
      iPSC-derived precursors of FEO patients carrying 84dup18, and from
      isogenic corrected controls, and measure basal and RANKL-stimulated
      NF-kappaB activity, osteoclast survival without RANKL, and
      unfolded-protein-response markers. A cell that shows basal NF-kappaB
      activity with UPR induction and no RANKL dose-response supports the
      misprocessing model; one that shows a shifted RANKL dose-response
      supports an interaction of mutant with wild-type receptor.
    would_support:
    - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
    supporting_outcome:
    - >-
      Basal NF-kappaB activity in heterozygous patient osteoclasts at
      endogenous expression levels, absent in isogenic controls.
    refuting_outcome:
    - >-
      No basal NF-kappaB activity, with prolonged survival explained by a
      pathway other than NF-kappaB.
  - experiment_id: feo_84dup18_knock_in_mouse
    name: Knock-in mouse carrying the FEO 18-bp duplication
    description: >-
      Generate a Tnfrsf11a 84dup18 knock-in and compare the heterozygous
      skeletal, ossicular and dental phenotype with the 75dup27 line, to
      test whether the length of the signal-peptide extension determines the
      lytic versus Paget-like pattern and whether the homozygous
      osteopetrosis is general to the allelic series.
- discussion_id: feo_denosumab_ligand_dependence
  prompt: >-
    Does RANKL blockade with denosumab control the osteoclast overactivity of
    FEO, and if so what does that say about the ligand dependence of
    signalling from the mutant receptor?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Denosumab
  - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
  rationale: >-
    The mechanism curated above is described as ligand-independent, and the
    ER-retained mutant receptor cannot be activated by ligand in vitro, which
    would predict that neutralising RANKL does little. Against that, one
    adult with FEO treated with denosumab in 2025 showed radiological
    improvement, better quality of life and enough control to permit limb
    salvage. A response to ligand blockade implies that osteoclast activity
    in FEO retains a RANKL-dependent component, most plausibly through the
    wild-type receptor in the same heterozygous cell. One case cannot settle
    it, and the knock-in mouse's osteoclasts survived without RANKL, which
    predicts a partial rather than complete response. The question is
    practical: bisphosphonates act on the osteoclast regardless of the
    receptor's state, denosumab does not.
  evidence:
  - reference: PMID:41264685
    reference_title: "A Novel Approach to the Treatment of Familial Expansile Osteolysis: A Rare Genetic Bone Pathology: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of denosumab for FEO displays improvement in radiological appearances of the affected bone, increased quality of life and may prevent the development of further lesions."
    explanation: >-
      The single response that raises the question.
  - reference: PMID:21472776
    reference_title: "Signal peptide mutations in RANK prevent downstream activation of NF-κB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, signal peptide mutations lead to accumulation of RANK in the endoplasmic reticulum and prevent direct activation by RANK ligand."
    explanation: >-
      The in vitro finding that predicts ligand blockade should not act on
      the mutant receptor itself.
  proposed_experiments:
  - experiment_id: feo_denosumab_turnover_marker_series
    name: Prospective turnover-marker response to denosumab in FEO
    description: >-
      Treat a small series of adults with molecularly confirmed FEO with
      denosumab under a hypocalcaemia protocol and measure bone resorption
      markers and lesion scintigraphic activity before and after, comparing
      the depth of suppression with that achieved by zoledronic acid in the
      same patients. Complete suppression implies fully ligand-dependent
      osteoclast activity; partial suppression quantifies the
      ligand-independent component.
- discussion_id: feo_mouse_allele_mismatch
  prompt: >-
    How far does the Tnfrsf11a 75dup27 knock-in mouse, which carries the
    early-onset Paget allele, model the lytic, expansile, appendicular
    disease and the ossicular and dental resorption of the human 18-bp
    duplication?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
  - pathophysiology#Middle-Ear Ossicular Resorption
  - pathophysiology#External Root Resorption of Permanent Teeth
  rationale: >-
    The model reproduces focal, age-dependent, drug-preventable osteolysis
    from a heterozygous signal-peptide duplication, which is strong evidence
    for the shared mechanism. What it does not do is carry the FEO allele:
    the 27-bp duplication produces a Paget-like lytic-sclerotic disease with
    jaw and skull involvement in humans, where the 18-bp duplication produces
    purely lytic limb lesions that end in fat-filled bone. Duplication length
    appears to matter to phenotype in the human allelic series, so an
    inference from one allele to another is an inference across the very
    variable that separates the disorders. The abstract reports no hearing or
    dental phenotype, so the two earliest human manifestations are unmodelled.
    This is recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP
    because the model evidence exists and is good; what is open is its
    transfer to the specific human allele.
  evidence:
  - reference: PMID:33724536
    reference_title: "Insertion Mutation in Tnfrsf11a Causes a Paget's Disease-Like Phenotype in Heterozygous Mice and Osteopetrosis in Homozygous Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To understand the mechanisms underlying these disorders, we developed a mouse model carrying the 75dup27 mutation which causes EoPDB."
    explanation: >-
      Identifies the allele modelled as the early-onset Paget one.
  - reference: PMID:12929927
    reference_title: "Phenotypic characterization of early onset Paget's disease of bone caused by a 27-bp duplication in the TNFRSF11A gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the 75dup27 mutation of RANK causes a Paget's disease of bone-like phenotype that is distinct from, but which overlaps with, FEO and ESH."
    explanation: >-
      The human phenotype of the modelled allele is distinct from FEO, which
      is the substance of the mismatch.
  proposed_experiments:
  - experiment_id: feo_75dup27_mouse_ossicle_and_tooth_phenotyping
    name: Ossicular and dental phenotyping of the 75dup27 heterozygous mouse
    description: >-
      Micro-CT of the auditory ossicles and molar roots in heterozygous
      75dup27 mice across age, with auditory brainstem responses, to test
      whether the earliest human manifestations of the signal-peptide
      duplication are present in the existing model before an 18-bp line is
      made.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Transmitted as an autosomal dominant trait through five generations of the
    original Northern Irish kindred and in every family reported since. The
    heterozygous duplication is highly penetrant, but expression varies
    markedly between and within families carrying the identical allele: some
    relatives have deafness and tooth loss with few or no osteolytic lesions,
    others have extensive limb and even skull disease from childhood. Sporadic
    cases with no family history occur. Penetrance is recorded as complete on
    the strength of the kindred descriptions; no formal penetrance estimate
    has been published.
  evidence:
  - reference: PMID:3346299
    reference_title: "Familial expansile osteolysis. A new dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 40 cases in one family of an autosomal dominant bone dysplasia, which, though similar in some aspects to Paget's disease, seems unique in some features and in its natural history."
    explanation: >-
      The original description of the Northern Irish kindred establishes the
      autosomal dominant pattern from 40 affected members of one family.
  - reference: PMID:7911698
    reference_title: "Genetic linkage of familial expansile osteolysis to chromosome 18q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial expansile osteolysis is a rare bone dysplasia which is transmitted as an autosomal dominant trait in a large kindred in Northern Ireland."
    explanation: >-
      The linkage study restates the dominant transmission on which the
      18q mapping depended.
  - reference: PMID:17447113
    reference_title: "Intragenic SNP haplotypes associated with 84dup18 mutation in TNFRSF11A in four FEO pedigrees suggest three independent origins for this mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite having the identical mutation, phenotypic variations among affected individuals of the same and different pedigrees were noted."
    explanation: >-
      Supports variable expressivity: the same 18-bp duplication produces
      different phenotypes within and between pedigrees.
  - reference: PMID:12568416
    reference_title: "Identification of a novel tandem duplication in exon 1 of the TNFRSF11A gene in two unrelated patients with familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One had no family history of FEO, but presented with bilateral hearing loss at an early age, deterioration of teeth, and severe pain and swelling in the distal tibia before the age of 20."
    explanation: >-
      Documents a sporadic case without family history, so the dominant
      pattern includes new occurrences and not only inherited ones.

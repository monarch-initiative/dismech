genetic:
- name: TNFRSF11A
  gene_term:
    preferred_term: TNFRSF11A
    term:
      id: hgnc:11908
      label: TNFRSF11A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Encodes RANK (receptor activator of NF-kappaB), the TNF receptor
    superfamily member on osteoclast precursors that binds RANKL (TNFSF11,
    hgnc:11926) and is essential for osteoclast formation. Mutation spectrum
    in FEO: a heterozygous in-frame 18-bp tandem duplication in exon 1,
    84dup18, in every FEO kindred reported, plus a second 18-bp duplication
    one base proximal in two unrelated patients; both add the same six
    residues to the signal peptide. Intragenic haplotypes show at least three
    independent origins for the recurrent duplication. The allelic
    signal-peptide duplications, 27-bp (PDB2), 15-bp (ESH, and JPD2 at
    87dup15) and 12-bp (PEBD), cause the related disorders described in the
    entry notes; a 2023 report of the 12-bp duplication arising de novo shows
    that these duplications can occur without family history. The
    duplications are activating in the sense of producing a heterozygous
    high-turnover phenotype and increased NF-kappaB signalling on
    overexpression; biallelic loss of function of the same gene causes
    osteoclast-poor osteopetrosis, so the disease is not a dosage effect of
    the receptor but a consequence of the misprocessed protein. No ClinGen
    gene-disease validity assertion for TNFRSF11A and FEO was found in the
    cached ClinGen records.
  evidence:
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two heterozygous insertion mutations in exon 1 of TNFRSF11A in affected members of four families with FEO or familial Paget disease of bone (PDB)."
    explanation: >-
      The gene discovery in affected members of four families.
  - reference: PMID:10615125
    reference_title: "Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RANK is essential in osteoclast formation."
    explanation: >-
      The function of the gene product that makes the lesion an osteoclast
      disease.
  - reference: PMID:12568416
    reference_title: "Identification of a novel tandem duplication in exon 1 of the TNFRSF11A gene in two unrelated patients with familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identical insertional mutations in the first exon of RANK have been identified in all published FEO kindreds."
    explanation: >-
      The recurrence of the same mutation across all kindreds published to
      2003.
  - reference: PMID:36740137
    reference_title: "Early identification of a 12-bp tandem duplication in TNFRSF11A encoding receptor activator of nuclear factor-kappa B (RANK): Clinical characterization and response to bisphosphonate therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 18-bp duplication in TNFRSF11A has been reported in all kindreds with FEO, whereas a 12-bp duplication was found in the young man with PEBD complicated by a massive jaw tumor."
    explanation: >-
      A 2023 restatement that the 18-bp duplication defines FEO, contrasted
      with the 12-bp allele of the panostotic disorder.
  - reference: PMID:25063546
    reference_title: "Juvenile Paget's disease with heterozygous duplication within TNFRSF11A encoding RANK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients with autosomal dominant accelerated bone remodeling have familial expansile osteolysis, early-onset Paget's disease of bone, expansile skeletal hyperphosphatasia, or panostotic expansile bone disease due to heterozygous 18-, 27-, 15-, and 12-bp insertional duplications, respectively, within exon 1 of TNFRSF11A that encodes the signal peptide of RANK."
    explanation: >-
      The allelic series in one sentence, mapping duplication length to
      disorder.
  - reference: PMID:11771666
    reference_title: "Expansile skeletal hyperphosphatasia is caused by a 15-base pair tandem duplication in TNFRSF11A encoding RANK and is allelic to familial expansile osteolysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, ESH and FEO are allelic diseases and ESH, like FEO, probably reflects increased activity in the skeleton of the RANK target, nuclear factor-kappaB (NF-kappaB)."
    explanation: >-
      Establishes ESH as allelic to FEO and records the shared inference of
      increased NF-kappaB activity.
  - reference: PMID:17447113
    reference_title: "Intragenic SNP haplotypes associated with 84dup18 mutation in TNFRSF11A in four FEO pedigrees suggest three independent origins for this mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 18-bp duplication in the first exon of the TNFRSF11A gene encoding RANK has been previously identified in four FEO pedigrees."
    explanation: >-

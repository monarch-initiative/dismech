- name: Denosumab
  description: >-
    The anti-RANKL monoclonal antibody, reported in a single adult with FEO in
    2025, in whom it improved the radiological appearance of affected bone
    and quality of life and permitted limb-salvage surgery in place of
    amputation. Its use is mechanistically interesting rather than
    established: if the mutant receptor signals independently of ligand,
    blocking the ligand should do little, so a response implies that
    osteoclast activity in FEO retains a RANKL-dependent component. The
    same hypocalcaemia caution as for bisphosphonates applies, and rebound
    turnover on withdrawal is a known property of the drug in other
    settings.

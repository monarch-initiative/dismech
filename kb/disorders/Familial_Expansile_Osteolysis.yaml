- name: Middle-Ear Ossicular Resorption
  biological_scale: TISSUE
  description: >-
    The auditory ossicles are resorbed. Hereditary incus necrosis was the
    first ossicular lesion described in the Northern Irish family; a later
    family showed total absence of the middle-ear ossicles on temporal-bone
    CT and at exploratory surgery, with the hearing loss dating from
    childhood. Because the ossicles are among the smallest bones in the body,
    the same osteoclast overactivity that takes decades to hollow a tibia can
    remove them in the first years of life, which is why deafness is usually
    the first sign of the disease. The loss is conductive; a mixed component
    develops in some patients. Ossicular reconstruction has been reported not
    to improve thresholds.

- name: External Root Resorption of Permanent Teeth
  biological_scale: TISSUE
  description: >-
    Cervical and apical external resorption of the roots of the permanent
    teeth, with premature deposition of irregular secondary dentine that
    narrows the pulp and of cellular cementum that narrows the periodontal
    ligament. Root resorption is an early manifestation, present in 16 of 20
    family members with skeletal disease in the Northern Irish study, and may
    precede bone involvement; the deciduous teeth are largely spared. The
    teeth loosen, fracture and are lost in adolescence. It is the dental
    expression of the same resorptive overactivity, and in a child it can be
    the presenting finding.

- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The measured biochemical endpoint, and the phenotype the entity is named for. The
    founding patient's deficiency was expressed in both skin fibroblasts and muscle, and it
    was isolated - the other respiratory chain complexes were spared, which is what a
    subunit dedicated to complex I predicts and what distinguishes this from the combined
    deficiencies caused by defects of mitochondrial gene expression. Transducing the
    patient's cells with a baculovirus expressing wild-type NDUFA2 partially restored
    complex I expression and activity, which is the experiment that makes the gene causal
    rather than merely associated.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  notes: >-
    Conformance note, following the sibling entries MC1DN24 and MC1DN34. The module node
    pairs decreased oxidative phosphorylation with increased reactive oxygen species. Only
    the first half is evidenced here - no reactive-oxygen measurement has been reported in
    an NDUFA2 patient - and the ROS arm is not asserted. The module's upstream node,
    age-related mitochondrial damage and mtDNA mutation, does not apply to a primary
    nuclear-gene subunit defect, so conformance is declared at this node alone.
  evidence:
  - reference: PMID:18513682
    reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with an isolated complex I deficiency expressed in skin fibroblasts as well as muscle tissue."
    explanation: >-
      The deficiency, its isolation to complex I, and the two tissues in which it was
      demonstrated.
  - reference: PMID:28857146
    reference_title: "Recessive mutations in NDUFA2 cause mitochondrial leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 2 patients with cystic leukoencephalopathy and complex I deficiency with recessive mutations in NDUFA2, an accessory subunit of complex I."
    explanation: >-
      Confirms the biochemical phenotype in the second and third patients, and names
      NDUFA2's role as an accessory rather than a core subunit.
  downstream:
  - target: Mitochondrial Membrane Depolarisation
    causal_link_type: DIRECT
  - target: Decreased Activity of Mitochondrial Complex I
- name: Mitochondrial Membrane Depolarisation
  biological_scale: CELLULAR
  description: >-
    The consequence measured in the founding patient's fibroblasts. Complex I is one of the
    proton pumps that build the inner membrane potential, so an enzyme that cannot oxidise
    NADH cannot pump, and the membrane depolarises. The depolarisation was corrected along
    with the enzyme when wild-type NDUFA2 was supplied, which ties it to the genotype rather
    than to the culture.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:18513682
    reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, the mutation is associated with a mitochondrial depolarization."
    explanation: The cellular consequence, measured in patient fibroblasts.
  downstream:
  - target: Bioenergetic Failure in Brain and Heart
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Bioenergetic Failure in Brain and Heart
  biological_scale: TISSUE
  description: >-
    The tissues that fail are the ones with the least metabolic reserve. In the founding
    patient this was brain and heart - Leigh disease with hypertrophic cardiomyopathy,
    ending in cardiovascular arrest before the age of one. In the three later patients it
    was brain alone, presenting as white matter disease rather than as the symmetrical
    brainstem and basal ganglia lesions of Leigh syndrome. Which of the two patterns a
    patient gets is unexplained, and the correlation with allele class is discussed rather
    than asserted.
  locations:
  - preferred_term: brain
    term:

- name: Destabilisation of the NDUFA2-NDUFS1 Contact
  biological_scale: MOLECULAR
  description: >-
    NDUFA2 binds the matrix arm through a single interface. It has exclusive contacts with
    the core subunit NDUFS1, made mostly through the flat four-stranded beta-sheet of its
    thioredoxin-like fold, and it sits at least 40 angstroms from any iron-sulfur cluster -
    so it cannot be doing chemistry, and what it can be doing is holding NDUFS1 in place.
    Both patient missense residues map to that interface: Lys45 contacts several NDUFS1
    residues directly, and Glu57 makes a probable ion pair with NDUFS1 Arg382. The reading
    is that these alleles weaken the contact rather than remove the protein.
  genes:
  - preferred_term: NDUFA2
    term:
      id: hgnc:7685
      label: NDUFA2
  - preferred_term: NDUFS1
    term:
      id: hgnc:7707
      label: NDUFS1
  mechanism_confidence: PROVISIONAL
  notes: >-
    The interface itself is established from cryo-EM structures of mammalian complex I. The
    step from a patient residue to a destabilised contact is a structural inference and is
    stated as one by the source, which says the binding is "likely" destabilised. Nobody has
    measured NDUFA2-NDUFS1 binding, NDUFA2 abundance or complex I assembly for either
    missense allele in a patient cell. That is why the node is PROVISIONAL and why the
    genetic_context keeps LOSS_OF_FUNCTION rather than claiming a partial one.
  evidence:
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This subunit is bound to the matrix arm in a unique fashion, with exclusive contacts to core subunit NDUFS1."
    explanation: >-
      The architectural fact the node rests on: a single binding partner, so a variant at
      that interface has one thing it can disrupt.
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Lys45 is found at the interface with NDUFS1 and has close contacts with several NDUFS1 residues, including Gly376, Asp380, and Ser672."
    explanation: >-
      The structural placement of the recurrent missense residue. Graded COMPUTATIONAL
      because it is an analysis of published structures rather than a measurement on
      patient material.
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "It is likely that the binding of NDUFA2 to NDUFS1 is destabilized."
    explanation: >-

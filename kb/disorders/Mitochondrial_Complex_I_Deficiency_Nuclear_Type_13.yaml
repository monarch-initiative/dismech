  notes: >-
    No neuropathology, imaging correlate or tissue biochemistry has been published for any
    of these four patients beyond the fibroblast and muscle assays. The step from a
    depolarised mitochondrion to selective white-matter and myocardial injury is the
    standard mitochondrial-disease account applied to this genotype, not something measured
    in it.
  evidence:

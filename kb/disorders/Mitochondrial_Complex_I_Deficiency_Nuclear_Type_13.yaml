    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 2 patients with cystic leukoencephalopathy and complex I deficiency with recessive mutations in NDUFA2, an accessory subunit of complex I."
    explanation: The same finding in the two 2018 patients.

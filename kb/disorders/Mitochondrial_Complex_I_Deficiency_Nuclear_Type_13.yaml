phenotypes:
- name: Decreased Activity of Mitochondrial Complex I
  category: Metabolism
  description: >-
    The defining biochemical finding, demonstrated in fibroblasts and in muscle in the
    founding patient and in the two leukoencephalopathy patients. It is isolated, meaning
    the other respiratory chain complexes are normal.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex I
    term:
      id: HP:0011923
      label: Decreased activity of mitochondrial complex I
  notes: >-
    OBLIGATE because the deficiency is what defines the entity and was demonstrated in
    every patient in whom it was assayed. The denominator is four patients. Note that the
    fourth patient was reported as having no systemic biochemical abnormalities of
    mitochondrial disorders, which is a statement about blood chemistry rather than about
    enzyme assay and does not contradict this.
  evidence:
  - reference: PMID:18513682
    reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with an isolated complex I deficiency expressed in skin fibroblasts as well as muscle tissue."
    explanation: The finding in the founding patient, in two tissues.

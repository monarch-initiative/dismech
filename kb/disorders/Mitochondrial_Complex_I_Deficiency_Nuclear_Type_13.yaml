inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two NDUFA2 alleles: homozygous in the consanguineous
    family of the founding case and in two of the leukoencephalopathy patients, compound
    heterozygous in the third. NDUFA2 is nuclear-encoded and autosomal, so this is a
    nuclear recessive mitochondrial disease, with the 25 percent sibling recurrence risk
    and absence of maternal transmission that distinguishes it from the
    mitochondrial-genome forms of complex I deficiency.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18513682
    reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the parents were consanguineous, we performed homozygosity mapping to identify homozygous regions containing candidate genes such as NDUFA2 on chromosome 5."
    explanation: >-
      Consanguinity and homozygosity mapping are how the gene was found, which is the
      recessive model in operation rather than merely asserted.
  - reference: PMID:28857146
    reference_title: "Recessive mutations in NDUFA2 cause mitochondrial leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Review of a biorepository of patients with unsolved genetic leukoencephalopathies who underwent whole-exome or genome sequencing allowed us to identify a second patient with compound heterozygous mutations in NDUFA2 (c.134A>C, p.Lys45Thr; c.225del, p.Asn76Metfs*4)."
    explanation: >-
      The compound heterozygous configuration, which together with the homozygous cases
      establishes biallelic recessive inheritance rather than homozygosity alone.
pathophysiology:
- name: Biallelic NDUFA2 Variant
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of NDUFA2. Four patients and four alleles are known and they fall
    into two classes. The founding case is homozygous for the splice variant c.208+5G>A,
    which causes most transcripts to skip exon 2 with a frameshift; no protein or
    transcript was detected, so it behaves as a null. The three later patients carry
    missense alleles at residues that contact NDUFS1 - p.Lys45Thr, homozygous in one and
    in trans with the frameshift p.Asn76Metfs*4 in another, and p.Glu57Ala homozygous in
    the fourth.
  genes:
  - preferred_term: NDUFA2
    term:
      id: hgnc:7685
      label: NDUFA2
  genetic_context:
    genes:
    - preferred_term: NDUFA2
      term:
        id: hgnc:7685
        label: NDUFA2
    allele_type: splice variant causing exon 2 skipping, interface missense variants, and a frameshift
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Three of the four patients are homozygous, which is the value recorded here; the
      fourth is compound heterozygous for p.Lys45Thr and the frameshift p.Asn76Metfs*4,
      and is described in the notes because the slot is single-valued.
    notes: >-
      LOSS_OF_FUNCTION covers the whole allelic set under this schema's definition,
      "complete or partial reduction of normal gene product function", but the set is not
      homogeneous and the difference may be the most interesting thing about the disease.
      The splice allele is a demonstrated null - neither protein nor transcript was
      detected. The two interface missense alleles are a different kind of lesion: Lys45
      and Glu57 both sit at the contact surface with NDUFS1, and the structural reading is
      that the NDUFA2-NDUFS1 binding is destabilised rather than that the protein is
      absent. No residual NDUFA2 protein has been quantified for any missense patient, so
      PARTIAL_LOSS_OF_FUNCTION would be a plausible reading of those two alleles that
      nothing has actually measured. The single value is set for the block; the allelic
      distinction is carried by the description here and by the open discussion.

  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This residue is at the interface with NDUFS1 and makes a possible ion pair with Arg382 of NDUFS1."
    explanation: >-
      The second missense residue, mapped to the same interface, which is what makes the
      two independent patient alleles a converging argument rather than two isolated
      predictions.
  downstream:
  - target: Failure of Complex I N-Module Assembly
    causal_link_type: DIRECT
- name: Failure of Complex I N-Module Assembly
  biological_scale: MOLECULAR
  description: >-
    Losing NDUFA2 does not just weaken complex I, it prevents part of it from being built.
    In knockout cell lines, blue native electrophoresis shows the N-module only partly
    assembled, with the core subunits NDUFS1, NDUFV1 and NDUFV2 lost along with the
    accessory subunits NDUFS4, NDUFS6, NDUFA7 and NDUFV3. The N-module carries the NADH
    binding site, which is why activity falls further than the amount of residual complex
    would suggest. In the founding patient the same effect was described as disturbed
    assembly of complex I.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An individual with Leigh syndrome and hypertrophic cardiomyopathy was discovered to be homozygous with a mutation, c.208 + 5 G > A, in the NDUFA2 gene that caused a reduction in correct splicing"

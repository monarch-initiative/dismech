genetic:
- name: NDUFA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NDUFA2
    term:
      id: hgnc:7685
      label: NDUFA2
  notes: >-
    NDUFA2 is on chromosome 5 and encodes a 99-residue, roughly 10.9 kDa accessory subunit
    of complex I, also known as B8. It is not catalytic: it has a compact thioredoxin-like
    fold with a flat four-stranded beta-sheet, sits on the matrix arm, and lies at least 40
    angstroms from any iron-sulfur cluster. Two cysteines sit in the loops of the sheet but
    are not oxidised in the available mammalian complex I structures, so the thioredoxin
    resemblance is structural rather than functional.

    A caution for anyone extending this entry from the gene rather than from the disease. A
    homozygous NDUFA2 p.Asp50Asn was reported in one individual in a breast cancer screen;
    the residue is not at the NDUFS1 interface and the significance is explicitly
    uncertain. It is not a mitochondrial disease allele and is not curated here.
  evidence:
  - reference: PMID:18513682
    reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation in this accessory subunit causes reduced activity and disturbed assembly of complex I."
    explanation: >-
      The gene-disease relationship as first established, and the mechanism class it
      belongs to.
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gene for NDUFA2 is located on chromosome 5. The protein contains 99 amino acids with a mass of about 10.9 kDa before the processing of the amino-terminal methionine."
    explanation: The gene's location and the protein's size, from a structural review of the subunit.
diagnosis:
- name: Complex I enzymology followed by nuclear gene sequencing
  description: >-
    The diagnostic route in every reported case has been biochemical first and genetic
    second: an isolated complex I deficiency demonstrated in fibroblasts or muscle, then a
    nuclear gene identified by homozygosity mapping in the founding case and by exome or
    genome sequencing since. The practical point the 2020 case adds is a negative one -
    that patient had no systemic biochemical abnormality of mitochondrial disease, so
    normal blood lactate and amino acids do not exclude the diagnosis in a child with a
    cavitating leukodystrophy.
  evidence:
  - reference: PMID:28857146
    reference_title: "Recessive mutations in NDUFA2 cause mitochondrial leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analysis confirmed a complex I deficiency, and whole-exome sequencing revealed a homozygous mutation in NDUFA2 (c.134A>C, p.Lys45Thr)."
    explanation: The two-step route, in the order it was actually taken.
  - reference: PMID:32154054
    reference_title: "Cavitating and tigroid-like leukoencephalopathy in a case of NDUFA2-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting with cavitating and tigroid-like pattern of leukodystrophy and without systemic biochemical abnormalities of mitochondrial disorders"
    explanation: >-
      The negative that matters diagnostically: the systemic markers usually used to raise
      suspicion of mitochondrial disease were absent in this patient.
experimental_models:
- name: Baculovirus complementation of patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    The rescue experiment from the founding study. Patient fibroblasts carrying the
    homozygous splice allele were transduced with a baculovirus expressing wild-type
    NDUFA2, and complex I expression, complex I activity and the mitochondrial membrane
    potential all improved. The rescue is described as partial, which the entry keeps -
    complementation establishes causality without establishing that the defect is fully
    correctable.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type NDUFA2 to the patient's own cells restores what the variant took
      away, which is the standard demonstration that a candidate variant is causal.
    limitations: >-
      The rescue is partial rather than complete, and the reason is not resolved -
      transduction efficiency, expression level and the possibility of an irreversible
      component are all consistent with the result. The system is a patient fibroblast, so
      it says nothing about brain or heart, and only the null allele has been tested; the
      three missense patients have had no complementation experiment. Baculovirus-driven
      expression is also non-physiological in level and timing.
    readouts:
    - name: Complex I expression, complex I activity and mitochondrial membrane potential
      target: Isolated Complex I Deficiency
      direction: RESTORED
      interpretation: >-
        All three measures improve when wild-type NDUFA2 is supplied, and the source
        qualifies the restoration as partial.
      evidence:
      - reference: PMID:18513682
        reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The expression and activity of complex I and the depolarization was (partially) rescued with a baculovirus system expressing the NDUFA2 gene."
        explanation: The three readouts and the qualifier the authors put on them.
    evidence:
    - reference: PMID:18513682
      reference_title: "NDUFA2 complex I mutation leads to Leigh disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation in this accessory subunit causes reduced activity and disturbed assembly of complex I."
      explanation: >-
        The defect the rescue reverses, which is what makes this model informative for the
        node. Graded HUMAN_CLINICAL rather than IN_VITRO because the sentence attributes the
        activity and assembly deficit to the patient's mutation and the deficiency was
        demonstrated in muscle as well as in cultured fibroblasts; the rescue experiment
        itself, quoted on the readout, is the in-vitro half.
discussions:
- discussion_id: mc1dn13_allele_class_and_phenotype
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Destabilisation of the NDUFA2-NDUFS1 Contact"
  - "pathophysiology#Bioenergetic Failure in Brain and Heart"
  prompt: >-
    Does the null allele give Leigh disease and the interface missense alleles give
    leukodystrophy, or is the difference something else?
  rationale: >-
    Four patients, two phenotypes, and a suspiciously tidy correspondence with allele class.

    The one patient with Leigh disease and hypertrophic cardiomyopathy, who died at eleven
    months, is homozygous for a splice allele in which neither protein nor transcript was
    detectable - a demonstrated null. The three patients with leukodystrophy who survived
    into childhood carry missense alleles at the NDUFS1 interface, or one such allele in
    trans with a frameshift, and the structural reading of those is a weakened contact
    rather than an absent protein. Residual function explaining severity is the obvious
    hypothesis and it is consistent with everything published.

    Three things stop it being an answer. Nobody has quantified residual NDUFA2 protein or
    residual complex I activity in the missense patients, so "hypomorphic" is a structural
    inference and not a measurement; the one patient with a compound heterozygous genotype
    carries a frameshift on the other allele, which should place her closer to the null end
    than her phenotype does; and four patients across three laboratories and twelve years
    are not a genotype-phenotype series. It is also worth noting that the review from which
    the structural argument comes describes the p.Lys45Thr patient's course in detail while
    the primary report's abstract does not, so the clinical and structural claims here rest
    partly on a secondary source.

    What would settle it is unglamorous and cheap: complex I activity, assembled complex I
    and NDUFA2 abundance measured in one laboratory in fibroblasts from a null patient and
    a missense patient side by side.
  evidence:
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No protein or transcript was found, making it a null mutation."
    explanation: The severe end of the proposed relationship - a demonstrated null.
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "It is likely that the binding of NDUFA2 to NDUFS1 is destabilized."
    explanation: >-
      The milder end, and its status: a structural inference with the hedge intact. Graded
      COMPUTATIONAL because it is drawn from a structure rather than measured.
  proposed_experiments:
  - experiment_id: exp_mc1dn13_residual_function
    name: Side-by-side biochemistry across the two allele classes
    description: >-
      Measure complex I activity, assembled complex I by blue native electrophoresis,
      complexome profile and NDUFA2 abundance in one laboratory, in fibroblasts from the
      splice-allele patient and from at least one interface-missense patient. If residual
      NDUFA2 and residual complex I track the phenotype, the genotype-phenotype reading
      becomes a mechanism; if they do not, the difference lies somewhere else and the
      entity needs a different explanation for its two poles.
- discussion_id: mc1dn13_carnitine_is_a_second_diagnosis
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - phenotypes#
  prompt: >-
    Why is decreased circulating carnitine not curated as a phenotype of this disorder?
  rationale: >-
    Because it belongs to a different disease in the same patient.

    The first of the two 2018 patients was initially diagnosed with primary systemic
    carnitine deficiency on the strength of a homozygous SLC22A5 variant, and the complex I
    deficiency was suspected only afterwards, when her developmental regression and cystic
    leukoencephalopathy did not fit. She therefore has two molecular diagnoses, and her low
    carnitine is attributable to the first.

    This matters because the HPO annotation set for OMIM:618235 includes decreased
    circulating carnitine concentration, sourced to that patient. Curating it from the HPOA
    row would import a dual-diagnosis confound into the knowledge base as an NDUFA2
    phenotype, and it would then be indistinguishable from an observed feature of the
    disease in any export. It is not curated here.

    The general point is worth keeping: in a four-patient entity, one patient's second
    diagnosis is a quarter of the apparent phenotype. Any future NDUFA2 phenotype claim
    that traces to this individual needs the SLC22A5 caveat stated in the same breath.
  evidence:
  - reference: PMID:28857146
    reference_title: "Recessive mutations in NDUFA2 cause mitochondrial leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first patient was initially diagnosed with a primary systemic carnitine deficiency associated with a homozygous variant in SLC22A5, but also exhibited developmental regression and cystic leukoencephalopathy, and an additional diagnosis of complex I deficiency was suspected."
    explanation: >-
      Both diagnoses in one sentence, in the order they were made, which is what makes the
      attribution unambiguous.
- discussion_id: mc1dn13_no_treatment_or_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - progression#Childhood leukodystrophic course
  prompt: >-
    Is there anything to curate under treatments, and what is actually known about the
    course?
  rationale: >-
    No, and very little.

    Nothing disease-modifying exists for NDUFA2 deficiency, no treatment or response is
    reported for any of the four patients, and no trial is registered for the gene or the
    disorder. The one intervention in the literature, baculovirus complementation of
    patient fibroblasts, is an experiment establishing causality and is curated where it
    belongs, under experimental_models with a RESCUES link and its limitations attached.
    This entry therefore has no treatments block.

    Supportive management of mitochondrial disease, and the management recommendations in
    the GeneReviews Leigh syndrome spectrum chapter, are both ready-made content that would
    look right here. Importing either would assert of four NDUFA2 patients an experience
    recorded only of other people with other genotypes, and in an exported graph the
    borrowed annotation would be indistinguishable from an observed one.

    Natural history is thinner than the progression block may suggest. What exists is three
    single-patient courses and one death, and two of the three are known only as an age at
    last evaluation. There is no age-of-onset distribution, no survival estimate and no
    imaging series. Closing that needs no new science - a follow-up report on the four
    published patients would do it.
  evidence:
  - reference: PMID:32154054
    reference_title: "Cavitating and tigroid-like leukoencephalopathy in a case of NDUFA2-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in nuclear gene NDUFA2 have been reported so far in only three children with variable presentations including Leigh syndrome or leukoencephalopathy."
    explanation: >-
      The size of the published series, which is the reason there is no natural history to
      curate.
notes: >-
  Scope decision: curated as a DISEASE, a standalone entry, consistent with MC1DN types 2,
  6, 12, 23, 24, 31 and 34 already in kb/disorders/. The stub is deleted by this change.

  The Leigh question, checked for this term rather than assumed from MC1DN1.
  MONDO:0032618 has exactly one superclass, MONDO:0100223 mitochondrial complex I
  deficiency nuclear type. MONDO does not place it under Leigh syndrome, so the MC1DN1
  precedent transfers and this does not become a has_subtypes entry on Leigh_Syndrome.
  Separately, kb/disorders/Leigh_Syndrome.yaml does not bind NDUFA2: its genetic block
  binds NDUFS4, NDUFV1, SURF1, LRPPRC, MT-ATP6 and PDHA1, so there is no existing
  gene-level overlap to resolve either.

  There is a real tension underneath that structural answer and it is not smoothed over.
  Only one of the four reported patients had Leigh disease; the modal published phenotype
  is a leukodystrophy. So the MONDO placement, the OMIM label and the founding paper's
  title all point one way and the accumulated case series points another. The entry curates
  both, with Leigh syndrome as an OCCASIONAL phenotype and leukoencephalopathy as the
  FREQUENT one - three of the four patients, which is 75 percent and so below the 80
  percent floor of VERY_FREQUENT - and records the allele-class hypothesis that might
  reconcile them as an open question rather than as a mechanism.

  On the review as a source. PMID:33233646, a structural review of complex I supernumerary
  subunits, carries a good deal of this entry's clinical and structural detail - the null
  status of the founding allele, the cardiomyopathy and the age at death, the course of the
  p.Lys45Thr patient, the placement of Lys45 and Glu57 at the NDUFS1 interface, and the
  knockout cell line assembly data. The three primary reports are cached as abstracts only
  and none of that is in them. Evidence taken from the review is graded OTHER where it
  restates another paper's patients or experiments and COMPUTATIONAL where it is the
  review's own analysis of published structures; in neither case is it graded as though the
  review had made the observation. A reader should treat those items as second-hand, which
  is why they are marked rather than blended in.

  What is deliberately not curated. There is no treatments block; the reasoning is in
  mc1dn13_no_treatment_or_natural_history. There is no biochemical block: the complex I
  enzymology is the disease's defining measurement and is curated as a phenotype and a
  pathophysiology node, and no other analyte has been reported except the carnitine that
  belongs to a second diagnosis. There are no clinical trials, no datasets and no animal
  models - none exists for this gene. Decreased circulating carnitine is excluded for the
  reason given in mc1dn13_carnitine_is_a_second_diagnosis, and the NDUFA2 p.Asp50Asn allele
  from a breast cancer screen is excluded as not a mitochondrial disease allele.

  On the fourth patient's identity. The structural review describes "In 2020, another
  individual" with a homozygous p.Glu57Ala allele, white matter abnormality, microcephaly,
  seizures and movement disorders, and PMID:32154054 reports "a further female child" with a
  cavitating and tigroid-like leukodystrophy in the same year. This entry treats them as the
  same patient. That identification is an inference from the year, the count and the
  phenotype; neither source names the other, and the review's numbered reference list is not
  in the cached record. If they are two different individuals the series is five rather than
  four, which would not change any mechanism in this entry but would change every frequency
  in it.

  On the deep-research report.
  research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_13-deep-research-falcon.md is
  committed with this entry. Its Named Entity Confusion preflight passes: NDUFA2 is
  mentioned 62 times against 6 for SLC22A5, which is the dual-diagnosis gene rather than a
  competing cause, and the report correctly identifies it as such. Its OMIM number matches
  MONDO's cross-reference. It counts three patients rather than four - it did not retrieve
  PMID:32154054 and treats the p.Glu57Ala allele as unestablished - so its denominator is
  narrower than this entry's, which is the one place the two disagree.

  The report had full-text access to the two papers the reference cache holds only as
  abstracts, and records clinical and biochemical detail that is therefore not quotable
  here. Recorded as uncited leads, in prose only, never in an evidence snippet or a
  structured slot: for the founding patient, a Turkish boy of first-cousin parents with
  hypertrophic cardiomyopathy from day five, cerebral atrophy and corpus callosum
  hypoplasia on MRI at four months, optic atrophy, decompensation at 7.5 months after
  vomiting and varicella, and complex I activity at 20 percent of the lowest control value
  in muscle and 36 percent in fibroblasts, with NDUFA2 protein markedly reduced, NDUFA9
  reduced with it, and inactive subcomplexes accumulating. For the two 2018 patients,
  periventricular and deep white matter change with cystic involvement of the corpus
  callosum, radiologically stable at twelve years in one; and in the other a magnetic
  resonance spectroscopy lipid-lactate peak with low N-acetylaspartate, microcephaly and
  walker-assisted ambulation at four years, with an approximately 750 kDa complex I
  subcomplex in fibroblasts. The report also notes that the two families carrying
  p.Lys45Thr share a surrounding haplotype, suggesting common ancestry rather than
  recurrent mutation, and that febrile illness, vomiting and varicella preceded
  decompensation in more than one patient. None of that is curated as content, and the
  catabolic-stress observation in particular is not curated as an environmental entry,
  because a deep-research report is a lead rather than a citable source.

  On GeneReviews. PMID:26425749, Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview, is
  the applicable chapter for the Leigh pole of this disease and is tagged in the top-level
  references block, following the sibling entries MC1DN2, MC1DN6 and MC1DN34. It is
  deliberately not cited as evidence: its cached record carries the chapter header and
  author list and no clinical content, so any snippet from it would attest to the chapter's
  existence rather than to a fact about NDUFA2 disease.

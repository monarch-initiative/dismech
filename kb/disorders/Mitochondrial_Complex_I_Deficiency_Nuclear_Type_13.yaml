prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four patients in three reports over twelve years, and no further patient found in a
    literature search to 2026. No population estimate exists and none could be made from
    four cases ascertained through three different routes - homozygosity mapping in a
    consanguineous family, a leukodystrophy biorepository, and a single diagnostic case.
    The prevalence_class is the numeric floor tier rather than the qualitative ULTRA_RARE
    one, following the reasoning that four published patients worldwide over more than a
    decade cannot be consistent with anything above one per million; no rate_per_100000 is
    given because none has been reported.

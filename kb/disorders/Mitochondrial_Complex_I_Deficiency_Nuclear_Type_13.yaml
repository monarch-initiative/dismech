name: Mitochondrial Complex I Deficiency, Nuclear Type 13
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- MC1DN13
- NDUFA2-related mitochondrial complex I deficiency
- NDUFA2 deficiency
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 13
  term:
    id: MONDO:0032618
    label: mitochondrial complex I deficiency, nuclear type 13
description: >-
  MC1DN13 is the isolated complex I deficiency caused by biallelic variants in NDUFA2.
  NDUFA2 is an accessory subunit, not a catalytic one: a 99-residue protein with a
  thioredoxin-like fold that sits on the matrix arm of complex I and touches only one
  other subunit, the core subunit NDUFS1. That single contact is what makes the gene
  matter. Knocking NDUFA2 out of a cell line does not merely lower complex I activity, it
  leaves the N-module unassembled - NDUFS1, NDUFV1 and NDUFV2 go with it, and with them
  the NADH binding site. So the lesion is a failure to build one arm of the enzyme rather
  than a failure of catalysis at a preserved active site.

  Four patients have been reported, in three papers, and the striking thing about them is
  that only one had the disease the entity is named after. The first, described in 2008,
  had Leigh disease and hypertrophic cardiomyopathy and died at eleven months; his allele
  is a splice variant that skips exon 2 and leaves no protein or transcript detectable,
  which is as close to a null as this gene gets. The three since - two in 2018 and one in
  2020 - have had cystic, cavitating or tigroid-like leukoencephalopathy and have survived
  into childhood, and their alleles are missense changes at the NDUFS1 interface, or a
  missense in trans with a frameshift. The published phenotype of NDUFA2 disease is
  therefore predominantly a leukodystrophy, while the MONDO and OMIM label places it in
  the complex I deficiency series and the founding case gave it a Leigh syndrome
  reputation. Both framings are in the literature and this entry keeps them apart rather
  than smoothing them together.

  A genotype-phenotype reading suggests itself and is worth stating carefully. The null
  allele produced the fatal infantile presentation; the interface missense alleles, which
  are predicted to destabilise the NDUFA2-NDUFS1 contact rather than abolish the protein,
  produced the slower leukodystrophic one. Nobody has measured residual NDUFA2 protein or
  residual complex I activity side by side across the four patients, so the correlation is
  a pattern in four cases and not a demonstrated dose relationship.

  One published finding must not be attributed to this gene. The first of the two 2018
  patients also carried a homozygous SLC22A5 variant and a separate diagnosis of primary
  systemic carnitine deficiency, so her low carnitine belongs to that second diagnosis. It
  nevertheless appears in the HPO annotation set for this disorder, and it is not curated
  here.

- name: Leigh Syndrome
  category: Nervous System
  description: >-
    The presentation of the founding patient, and the reason the entity entered the
    literature as a Leigh syndrome gene. It has not recurred in any patient since.
  frequency: OCCASIONAL
  notes: >-
    No phenotype_term is bound. Leigh syndrome is a disease concept, MONDO:0009723, rather
    than an HPO phenotype, and this follows the sibling entry MC1DN34, which curates it the
    same way. The frequency is OCCASIONAL because it is one of four reported patients -
    which is also the tension this entry is careful about, since the disorder's MONDO and
    OMIM identity sits in the complex I deficiency series while its best-known presentation
    is the one that has not recurred.

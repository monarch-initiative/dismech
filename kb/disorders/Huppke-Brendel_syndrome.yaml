differential_diagnoses:
- name: Wilson disease
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  description: >-
    Low ceruloplasmin and elevated urinary copper can lead to misdiagnosis as
    Wilson disease, especially in attenuated adult cases; absence of ATP7B
    variants distinguishes Huppke-Brendel syndrome.
  distinguishing_features:
  - Causative biallelic ATP7B variants with hepatic copper overload rather than SLC33A1 variants
  evidence:
  - reference: PMID:36119696
    reference_title: "Case report: Huppke-Brendel syndrome in an adult, mistaken for and treated as Wilson disease for 25 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With neurologic involvement and ceruloplasmin deficiency, it may mimic Wilson disease (WD).
    explanation: >-
      This directly supports Wilson disease as an important differential
      diagnosis.
- name: Menkes disease
  disease_term:
    preferred_term: Menkes disease
    term:
      id: MONDO:0010651
      label: Menkes disease
  description: >-
    Menkes disease also presents in infancy with hypotonia, neurodegeneration,
    and low serum copper and ceruloplasmin, but is X-linked and caused by ATP7A
    variants with systemic copper deficiency.
  distinguishing_features:
  - X-linked ATP7A variants, pili torti (kinky hair), and true systemic copper deficiency rather than isolated ceruloplasmin secretion failure
  evidence:
  - reference: PMID:22243965
    reference_title: Mutations in SLC33A1 cause a lethal autosomal-recessive disorder with congenital cataracts, hearing loss, and low serum copper and ceruloplasmin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low copper and ceruloplasmin in serum are the diagnostic hallmarks for Menkes disease, Wilson disease, and aceruloplasminemia.
    explanation: >-
      This directly identifies Menkes disease as part of the biochemical
      differential diagnosis.
- name: Aceruloplasminemia
  disease_term:
    preferred_term: aceruloplasminemia
    term:
      id: MONDO:0011426
      label: aceruloplasminemia
  description: >-
    Aceruloplasminemia shares markedly low or absent serum ceruloplasmin and low
    serum copper, but results from CP ferroxidase mutations with systemic iron
    accumulation rather than congenital cataracts and infantile AT-1 deficiency.
  distinguishing_features:
  - Biallelic CP variants with retinal degeneration, diabetes mellitus, and brain/hepatic iron overload rather than biallelic SLC33A1 variants
  evidence:
  - reference: PMID:22243965
    reference_title: Mutations in SLC33A1 cause a lethal autosomal-recessive disorder with congenital cataracts, hearing loss, and low serum copper and ceruloplasmin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low copper and ceruloplasmin in serum are the diagnostic hallmarks for Menkes disease, Wilson disease, and aceruloplasminemia.
    explanation: >-
      Identifies aceruloplasminemia alongside Menkes and Wilson diseases in the
      differential diagnosis of low serum copper and ceruloplasmin.
references:
- reference: PMID:31194315
  title: Huppke-Brendel Syndrome.
  tags:
  - GeneReviews
  findings:
  - statement: >-
      GeneReviews establishes the clinical, neuroimaging, biochemical, and
      molecular diagnostic baseline for Huppke-Brendel syndrome across 11
      reported individuals (10 children and 1 adult), and outlines supportive
      management including early cataract extraction, enteral tube feeding,
      physical therapy, developmental intervention, and autosomal recessive
      genetic counseling.

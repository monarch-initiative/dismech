progression:
- phase: Onset
  age_range: Infancy
  notes: >-
    Classic disease presents in the first months of life with axial hypotonia,
    absent head control, paucity of limb movement, bilateral congenital
    cataracts, and sensorineural hearing loss; all reported children with the
    classic infantile form died between age ten months and six years, while a
    single attenuated adult case has been described.
  evidence:
  - reference: PMID:31194315
    reference_title: "Huppke-Brendel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All children presented in infancy with axial hypotonia; motor delay was apparent in the first few months of life with a lack of head control and paucity of limb movement."
    explanation: >-
      Documents infantile onset and early motor presentation in affected
      children.
  - reference: PMID:31194315

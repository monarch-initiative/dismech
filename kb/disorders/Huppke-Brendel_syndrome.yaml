      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Lethal neurodegenerative disorder due to copper transport defect"
      explanation: >-
        Places SLC33A1-related Huppke-Brendel syndrome among inherited copper
        transport and copper homeostasis disorders.
    - reference: PMID:22243965
      reference_title: "Mutations in SLC33A1 cause a lethal autosomal-recessive disorder with congenital cataracts, hearing loss, and low serum copper and ceruloplasmin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Furthermore, AT-1 defects are a new and important differential diagnosis in patients with low copper and ceruloplasmin in serum."
      explanation: >-
        Links SLC33A1/AT-1 deficiency to the inherited disorders of copper and
        ceruloplasmin metabolism.

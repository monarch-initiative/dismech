name: Huppke-Brendel syndrome
creation_date: '2026-04-14T12:05:00Z'
category: Mendelian
description: >-
  Huppke-Brendel syndrome is a severe autosomal recessive SLC33A1-related
  neurodevelopmental disorder caused by deficiency of the endoplasmic reticulum
  acetyl-CoA transporter AT-1. The syndrome is characterized by congenital
  cataracts, hearing loss, developmental delay, low serum copper and
  ceruloplasmin, and a characteristic neuroimaging pattern of cerebellar
  hypoplasia and hypomyelination.
disease_term:
  preferred_term: Huppke-Brendel syndrome
  term:
    id: MONDO:0013772
    label: Huppke-Brendel syndrome
synonyms:
- acetyl CoA transporter deficiency
- congenital cataract-deafness-severe developmental delay syndrome
- congenital cataract-hearing loss-severe developmental delay syndrome
- congenital cataracts, hearing loss, and neurodegeneration
- lethal neurodegenerative disorder due to copper transport defect
- CCHLND
parents:
- hereditary disease
- inborn error of metabolism
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:31194315
      reference_title: "Huppke-Brendel Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Huppke-Brendel syndrome (HBS) is characterized by bilateral congenital cataracts, sensorineural hearing loss, and severe developmental delay."
      explanation: >-
        Places Huppke-Brendel syndrome within neurologic disorders on the basis
        of severe neurodevelopmental delay, hypotonia, cerebellar hypoplasia,
        and CNS hypomyelination.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: ORPHA:300313
      reference_title: "Congenital cataract-hearing loss-severe developmental delay syndrome"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Congenital cataract-hearing loss-severe developmental delay syndrome is a rare, genetic, lethal, neurometabolic disease characterized by congenital cataracts, sensorineural hearing loss, severe psychomotor developmental delay, severe, generalized muscular hypotonia, and central nervous system abnormalities (incl. cerebellar and cerebral hypoplasia, hypomyelination, wide subarachnoid spaces), in the presence of low serum copper and ceruloplasmin."
      explanation: >-
        Classifies Huppke-Brendel syndrome as an inherited neurometabolic
        disorder with systemic ceruloplasmin and copper abnormalities.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:22243965
      reference_title: "Mutations in SLC33A1 cause a lethal autosomal-recessive disorder with congenital cataracts, hearing loss, and low serum copper and ceruloplasmin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on five patients from four unrelated families with these biochemical findings who presented with a lethal autosomal-recessive syndrome of congenital cataracts, hearing loss, and severe developmental delay."
      explanation: >-
        Establishes Huppke-Brendel syndrome as an autosomal recessive monogenic
        disorder caused by biallelic SLC33A1 mutations.
  icimd_category:

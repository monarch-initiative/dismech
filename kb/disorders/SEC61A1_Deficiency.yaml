- name: Defective Sec61 Cotranslational Protein Translocation
  biological_scale: MOLECULAR
  description: >-
    Reduced or defective Sec61 channel limits the cotranslational transport of
    signal-peptide-bearing secretory and membrane proteins into the
    endoplasmic reticulum. Substrates differ in their sensitivity: in cellular
    models of the kidney variants, transport of renin was impaired, and the
    polycystic liver variant reduced polycystin-2 biosynthesis. Substrate
    selectivity is a proposed reason why different variants give different
    clinical presentations.

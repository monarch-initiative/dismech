diagnosis:
- name: Monitoring of kidney function in all variant carriers
  description: >-
    Kidney disease may appear later than the immune or hematologic
    presentation, so carriers identified through antibody deficiency or
    neutropenia should be followed for kidney dysfunction.
  evidence:
  - reference: PMID:32325141
    reference_title: Defective Sec61α1 underlies a novel cause of autosomal dominant severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering that clinically evident renal disease in patients with mutations in SEC61A1 occurred later in life, we propose that patients with mutations in SEC61A1 be serially monitored for renal dysfunction, regardless of the initial clinical phenotype."
    explanation: Authors' recommendation for renal follow-up.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the Sec61 complexes that are present in the ER membrane of nucleated cells form calcium leak channels that may play a crucial role in calcium homeostasis."
    explanation: Establishes the Sec61 complex as an endoplasmic reticulum calcium leak channel.

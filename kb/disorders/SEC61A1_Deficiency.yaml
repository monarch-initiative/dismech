- name: Tubulointerstitial and Glomerulocystic Kidney Injury
  biological_scale: TISSUE
  description: >-
    Kidneys are small and dysplastic, with tubular atrophy, interstitial
    fibrosis, cystic dilatation of Bowman's spaces with rudimentary glomerular
    tufts, and secondary glomerulosclerosis. Proteinuria is absent or minimal
    and urinary sediment is bland. Function declines slowly from childhood,
    and kidney failure has been reported from the first year of life to late
    adulthood.

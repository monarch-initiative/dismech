pathophysiology:
- name: Heterozygous SEC61A1 Variants
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous missense and nonsense variants in SEC61A1. Missense
    variants in the plug and pore ring regions (p.Val67Gly, p.Thr185Ala,
    p.Val85Asp, p.Gln92Arg) reduce protein stability or mislocalize the
    protein to the Golgi; the nonsense variant p.Glu381* acts by
    haploinsufficiency. Some missense variants are proposed to act in a
    dominant-negative way on calcium leak, so the net effect is a functional
    haploinsufficiency of the translocon.
  molecular_functions:
  - preferred_term: protein-conducting channel activity of Sec61 alpha
    modifier: DECREASED
    term:
      id: GO:0008320
      label: transmembrane protein transporter activity
  genes:
  - preferred_term: SEC61A1
    term:
      id: hgnc:18276
      label: SEC61A1
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline heterozygous variants, inherited or de novo. Missense variants
      predominate; one nonsense variant is reported.
    allelic_events:
    - MISSENSE_VARIANT
    - NONSENSE_VARIANT
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27392076
    reference_title: Heterozygous Loss-of-Function SEC61A1 Mutations Cause Autosomal-Dominant Tubulo-Interstitial and Glomerulocystic Kidney Disease with Anemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both transiently expressed SEC6A1A variants are delocalized to the Golgi, a finding confirmed in a renal biopsy from an affected individual."
    explanation: >-
      The two kidney-disease missense variants mislocalize the protein. The
      typo "SEC6A1A" is in the source.
  - reference: PMID:32325141
    reference_title: Defective Sec61α1 underlies a novel cause of autosomal dominant severe congenital neutropenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structural predictions and transient in vitro expression of other reported missense mutations indicate that these other mutations also have a detrimental impact on protein stability, further implicating haploinsufficiency as a disease mechanism."
    explanation: Reduced protein stability across reported missense variants supports haploinsufficiency.
  - reference: PMID:28782633
    reference_title: Plasma cell deficiency in human subjects with heterozygous mutations in Sec61 translocon alpha 1 subunit (SEC61A1).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, a dominant negative mutation in SEC61A1 resulting in a functional haploinsufficiency in combination with a dominant negative disturbance of the calcium homeostasis may be responsible for the fully penetrant PAD in Family I ranging from transient hypogammaglobulinemia and specific antibody deficiency to CVID."
    explanation: Proposed dominant-negative action of the p.Val85Asp missense variant, giving functional haploinsufficiency.

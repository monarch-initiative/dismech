    Heterozygous variants segregate with disease in multigenerational families
    (kidney and antibody deficiency presentations) or arise de novo (several
    kidney and neutropenia cases). Penetrance of the nonsense allele p.Glu381*
    for the antibody deficiency was incomplete, with variable expressivity, in
    the family that carried it.

- name: Increased Endoplasmic Reticulum Calcium Leak
  biological_scale: CELLULAR
  description: >-
    The open Sec61 channel is permeable to calcium and is a passive leak
    pathway from the endoplasmic reticulum to the cytosol. Patient variants in
    the pore ring and plug increase this leak, and cellular models of the
    kidney variants show reduced SERCA2. The resulting imbalance in
    endoplasmic reticulum calcium is one of the two proposed routes to
    endoplasmic reticulum stress.
  biological_processes:

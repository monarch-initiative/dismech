- name: Impaired Renin Biosynthesis in Juxtaglomerular Cells
  biological_scale: CELLULAR
  description: >-
    Renin is a signal-peptide-dependent secretory protein made by the granular
    cells of the juxtaglomerular apparatus. The kidney variants impair its
    translocation in cellular models, and a patient biopsy lacked renin
    staining in juxtaglomerular cells. Low renin and aldosterone explain the
    hyperkalemia and hypotension seen in some patients, which corrected with
    a mineralocorticoid. The chemical chaperone phenylbutyrate restored renin
    transport in cellular models, but has not been tested in patients.

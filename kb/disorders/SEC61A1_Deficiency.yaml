name: SEC61A1 Deficiency
creation_date: "2026-10-22T20:30:00Z"
category: Mendelian
synonyms:
- SEC61A1-related disease
disease_term:
  preferred_term: SEC61A1 deficiency
  term:
    id: MONDO:0100337
    label: SEC61A1 deficiency
parents:
- Autosomal Dominant Tubulointerstitial Kidney Disease
- Inborn Error of Immunity
- Severe Congenital Neutropenia
description: >-
  SEC61A1 deficiency is an autosomal dominant disorder caused by heterozygous,
  often de novo, variants in SEC61A1, which encodes the pore-forming alpha
  subunit of the Sec61 translocon in the endoplasmic reticulum membrane. The
  Sec61 channel moves nascent secretory and membrane proteins into the
  endoplasmic reticulum and also acts as a passive calcium leak channel.
  Reported variants reduce protein abundance, impair cotranslational
  translocation, and disturb endoplasmic reticulum calcium homeostasis, which
  pushes highly secretory cells into a terminal unfolded protein response.
  Three clinical presentations have been described, sometimes overlapping
  within a family or a patient: autosomal dominant tubulointerstitial kidney
  disease with glomerular cysts, hyperuricemia and congenital anemia
  (ADTKD-SEC61A1, also familial juvenile hyperuricemic nephropathy type 4); a
  primary antibody deficiency with an intrinsic failure of B cells to become
  plasma cells (common variable immunodeficiency 15); and severe congenital
  neutropenia with maturation arrest of granulopoiesis. Neutropenia, growth
  retardation, cleft palate and cognitive impairment have been reported with
  the kidney form. A single family with polycystic liver disease carries a
  further missense variant, and one child had epilepsy, microcephaly and
  hypomagnesemia. Fewer than thirty patients have been published.
notes: >-
  ClinGen lumped the kidney, antibody deficiency and neutropenia presentations
  into one entity, autosomal dominant SEC61A1 deficiency (MONDO:0100337), and
  classified the gene-disease relationship as Moderate; this entry follows that
  decision and carries the three presentations as subtypes. Common variable
  immunodeficiency 15 is also listed as a subtype of
  Common_Variable_Immunodeficiency, because MONDO files that term under both
  parents.

  The polycystic liver disease family (p.Arg236Cys, PMID:36478640) is recorded
  as a phenotype rather than a subtype: it is one family, and it has no
  separate MONDO term.

  No GeneReviews chapter covers SEC61A1 or ADTKD-SEC61A1.

  Frequencies are omitted throughout. The literature is a set of single
  families and case reports, and no series gives a denominator.

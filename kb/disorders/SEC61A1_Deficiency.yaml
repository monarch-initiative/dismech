animal_models:
- name: Zebrafish sec61al2 knockdown and CRISPR deletion
  species: Zebrafish
  genotype: sec61al2 morpholino knockdown or F0 CRISPR/Cas9 deletion
  publication: PMID:27392076
  modeled_mechanisms:
  - target: Tubulointerstitial and Glomerulocystic Kidney Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Loss of the ortholog disturbs convolution of the pronephric tubules.
    limitations: >-
      Embryonic pronephros only; fibrosis and gout cannot be modeled at this
      stage, and the model is a knockdown rather than a heterozygous patient
      allele.
    evidence:
    - reference: PMID:27392076
      reference_title: Heterozygous Loss-of-Function SEC61A1 Mutations Cause Autosomal-Dominant Tubulo-Interstitial and Glomerulocystic Kidney Disease with Anemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Suppression or CRISPR-mediated deletions of sec61al2 in zebrafish embryos induced convolution defects of the pronephric tubules but not the pronephric ducts, consistent with the tubular atrophy observed in the affected individuals."
      explanation: Tubular phenotype in the zebrafish model.
    - reference: PMID:27392076
      reference_title: Heterozygous Loss-of-Function SEC61A1 Mutations Cause Autosomal-Dominant Tubulo-Interstitial and Glomerulocystic Kidney Disease with Anemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Some of the pathologies observed in the affected individuals, such as fibrosis and gout, cannot be modeled reliably in early development."
      explanation: Authors' own statement of the model's limits.

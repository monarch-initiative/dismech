name: RDH12-Related Dominant Retinopathy
category: Mendelian
description: >-
  RDH12-related dominant retinopathy is a rare, late-onset and comparatively
  mild rod-cone dystrophy (autosomal dominant retinitis pigmentosa) caused by a
  single heterozygous frameshift in the penultimate coding exon of RDH12. It is
  allelic to, and clinically very different from, the recessive RDH12 disease
  (Leber congenital amaurosis 13 / early-onset severe retinal dystrophy). Four
  families have been published, carrying three single-base deletions within 20
  nucleotides of one another (c.759del, c.763del and c.778del, the last first
  reported as 776delG). Affected people present with night blindness and
  peripheral field loss, mid-peripheral bone-spicule pigmentation, attenuated
  vessels and disc pallor, while central acuity and macular structure are
  relatively preserved; expressivity varies within a family, and one carrier
  was recognised as affected only by adaptive optics imaging.

  RDH12 is an NADPH-dependent retinal reductase of the photoreceptor inner
  segment that clears all-trans-retinal and other aldehydes. Heterozygous
  carriers of recessive loss-of-function alleles are unaffected, so simple
  haploinsufficiency does not explain the dominant disease. All three dominant
  frameshifts are predicted to escape nonsense-mediated decay and to produce a
  truncated protein ending in the same novel C-terminal peptide. Whether that
  protein acts by a toxic gain of function or by dominant-negative interference
  with wild-type RDH12 is not settled; both are recorded here as alternative
  hypotheses, and neither has been tested directly. Patient iPSC-derived
  retinal organoids show fewer, shorter photoreceptors late in differentiation,
  with reduced RDH12 expression and disrupted vitamin A pathway and cone
  phototransduction gene expression.

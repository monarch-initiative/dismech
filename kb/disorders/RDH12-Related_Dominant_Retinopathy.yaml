- name: Dominant-Negative Interference With Wild-Type RDH12
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Hypothesis: the truncated protein binds or sequesters wild-type RDH12 and
    lowers total retinal reductase activity in the inner segment below the
    level one normal allele supplies. It rests on the suggestion, from the
    Drosophila photoreceptor ortholog, that RDH12 may act as a dimer; RDH12
    dimerisation and mutant-wild-type interaction have not been shown.

    Normal RDH12 function, which this hypothesis would reduce, is well
    characterised: the purified human enzyme has its highest catalytic
    efficiency for all-trans-retinal, and in rod inner segments it protects
    organelles against aldehyde toxicity from all-trans-retinal leaking out of
    the outer segment and from other aldehydes.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous RDH12 frameshift segregates with disease through
    several generations in each published family. Expressivity is highly
    variable within a family: in the four-generation British pedigree one
    carrier with a normal fundus was recognised as affected only by adaptive
    optics imaging and autofluorescence, which the authors read as variable
    expressivity rather than non-penetrance.
  evidence:
  - reference: PMID:18779497
    reference_title: "Association of a novel mutation in the retinol dehydrogenase 12 (RDH12) gene with autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A frameshift mutation (776delG) was detected in all affected family members and was not detected in 158 control subjects."
    explanation: Cosegregation of the heterozygous frameshift with disease in the founding dominant pedigree.
  - reference: PMID:18779497
    reference_title: "Association of a novel mutation in the retinol dehydrogenase 12 (RDH12) gene with autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutations in RDH12 can cause autosomal dominant RP with a late onset and relatively mild severity."
    explanation: The founding study's conclusion that a heterozygous RDH12 variant causes dominant disease.
  - reference: PMID:34031043
    reference_title: "Novel disease-causing variant in RDH12 presenting with autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This novel heterozygous variant RDH12 c.763delG is associated with a rod-cone dystrophy with variable expression."
    explanation: Dominant transmission with variable expression in a second, four-generation family.
  - reference: PMID:34031043
    reference_title: "Novel disease-causing variant in RDH12 presenting with autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings are more in keeping with highly variable expressivity rather than non-penetrance of the disease."
    explanation: The minimally symptomatic carrier is interpreted as variable expressivity.
prevalence:
- population: Worldwide (published families)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population estimate exists. Four families have been published: one
    six-generation American family (Fingert 2008), two unrelated families
    sharing c.759del (Sarkar 2020) and one four-generation British family
    (Muthiah 2022). A Chinese cohort of 27 families with RDH12 retinopathy found
    no dominant case.
  evidence:
  - reference: PMID:35994252
    reference_title: "Clinical and Genetic Analysis of RDH12-Associated Retinopathy in 27 Chinese Families: A Hypomorphic Allele Leads to Cone-Rod Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, four families of RDH12-associated adRP have been reported."
    explanation: A 2022 literature count of published dominant families.
  - reference: PMID:35994252
    reference_title: "Clinical and Genetic Analysis of RDH12-Associated Retinopathy in 27 Chinese Families: A Hypomorphic Allele Leads to Cone-Rod Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, no heterozygous variants associated with adRP were identified in our cohort."
    explanation: No dominant case in a 27-family RDH12 cohort, consistent with the rarity of the dominant form.
mechanistic_hypotheses:
- hypothesis_group_id: rdh12_ad_toxic_c_terminal_gain
  hypothesis_label: Toxic gain of function of the aberrant C-terminal peptide
  status: ALTERNATIVE
  description: >-
    The NMD-escaping frameshift protein carries a novel C-terminal peptide that
    is itself toxic to photoreceptors, independently of RDH12 catalytic
    activity. Proposed by the authors of the British family and adopted by the
    ClinGen curation as gain of function; not tested experimentally.
  evidence:
  - reference: PMID:34031043
    reference_title: "Novel disease-causing variant in RDH12 presenting with autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This rare and specific heterozygous (dominant) variant is predicted to result in a gain of function"
    explanation: The gain-of-function interpretation is a prediction, not a measurement.
  - reference: CGGV:assertion_958d5e41-ea0c-4497-af02-56d6ed3cd341-2023-03-02T170000.000Z
    reference_title: "RDH12 / RDH12-related dominant retinopathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is reported to be gain-of-function, most likely due to the creation of an alternate reading frame predicted to escape NMD and lead to a truncated protein with altered C-terminus."
    explanation: ClinGen records gain of function as the reported mechanism.
- hypothesis_group_id: rdh12_ad_dominant_negative
  hypothesis_label: Dominant-negative interference with wild-type RDH12
  status: ALTERNATIVE
  description: >-
    The truncated protein retains the cofactor-binding and catalytic regions and
    interferes with the wild-type enzyme, for example by sequestering it if
    RDH12 acts as a dimer, lowering total RDH12 activity below what one normal
    allele provides. Proposed from protein modelling and the organoid data; not
    tested experimentally.
  evidence:
  - reference: PMID:40365019
    reference_title: "Dominant RDH12-retinitis pigmentosa impairs photoreceptor development and implicates cone involvement in retinal organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The alternative C-terminus may function as a dominant-negative protein, sequestering WT protein to reduce its activity."
    explanation: Stated as a possibility in the organoid study's discussion.
  - reference: PMID:32322264
    reference_title: "Novel Heterozygous Deletion in Retinol Dehydrogenase 12 (RDH12) Causes Familial Autosomal Dominant Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This C-terminal peptide sequence produced by the dominant variants may be responsible for a protein interaction resulting in gain of function or a dominant negative effect, which may account for the milder phenotype."
    explanation: The authors leave both mechanisms open.
- hypothesis_group_id: rdh12_ad_haploinsufficiency
  hypothesis_label: Haploinsufficiency
  status: DEPRECATED
  description: >-
    Loss of one functional RDH12 allele is not sufficient for disease:
    heterozygous parents of LCA13 patients are unaffected, heterozygous Rdh12
    mice have no retinal phenotype, and other truncating variants that also
    escape NMD but do not create the shared C-terminal peptide have not been
    linked to dominant disease. No causal edge in this entry belongs to this
    hypothesis; it is recorded so that the reason for excluding it is visible.
  evidence:

pathophysiology:
- name: Heterozygous RDH12 Penultimate-Exon Frameshift
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is one of three single-base deletions clustered in the
    penultimate coding exon of RDH12: c.759del p.(Phe254Leufs*24), c.763del
    p.(Val255Serfs*23) and c.778del p.(Glu260Argfs*18). Each was found
    heterozygous and segregating with disease. The frameshifts lie downstream of
    the conserved cofactor-binding (residues 46 to 52) and catalytic (200 to
    204) regions, which are left intact.

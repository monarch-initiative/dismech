diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on finding one of the penultimate-exon frameshifts in a
    patient with dominant-pattern rod-cone dystrophy, usually on a retinal gene
    panel or genome sequencing. Because RDH12 is mainly a recessive gene, a
    single heterozygous RDH12 variant needs to be interpreted with its position
    and predicted gain-of-function effect in mind, and with segregation in the
    family.
  diagnosis_term:
    preferred_term: Genetic Testing

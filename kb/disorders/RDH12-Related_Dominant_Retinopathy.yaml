  description: >-
    The allelic recessive RDH12 disease, curated as Leber_Congenital_Amaurosis_13.
    It is caused by biallelic loss-of-function variants and presents in early
    childhood with severe visual loss and early macular atrophy, whereas the
    dominant disease is caused by one penultimate-exon frameshift and spares
    central vision until late.
  distinguishing_features:
  - One heterozygous penultimate-exon frameshift with dominant transmission, against two loss-of-function alleles.
  - Late onset with good acuity, against early-onset severe visual impairment.
  - A typical retinitis pigmentosa autofluorescence ring around a residual foveal island, against variegated, petal-shaped macular atrophy.

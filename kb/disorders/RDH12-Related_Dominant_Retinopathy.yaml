- name: Late-Onset Rod-Cone Degeneration
  biological_scale: TISSUE
  role: outcome
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical retinal disease: a rod-cone dystrophy that is milder and later
    in onset than recessive RDH12 disease. Rod function is affected first on
    electroretinography, and degeneration starts in the periphery, with bone
    spicules and vessel attenuation, while an island of central photoreceptors
    and good acuity persist. In the founding family the mean age at diagnosis
    was 28.5 years; in the British family the index patient had signs at about
    age 10. The circular autofluorescence ring around a residual foveal island
    resembles typical retinitis pigmentosa rather than the variegated macular
    atrophy of LCA13.

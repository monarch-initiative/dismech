notes: >-
  Variant nomenclature differs across reports for the founding allele: Fingert
  et al. 2008 wrote 776delG, and later reports on NM_152443 write c.778del
  p.(Glu260Argfs*18). No GeneReviews chapter is specific to RDH12 dominant
  disease; the Nonsyndromic Retinitis Pigmentosa Overview covers RDH12 among
  many genes, and its cached abstract carries no RDH12-specific phenotype, so
  the phenotype baseline here comes from the four family reports and the
  ClinGen curation. MONDO also has a retinitis pigmentosa 53 class
  (MONDO:0800348) with no gene axiom; MedGen (C3150208) lists RP53 as an entry
  term of OMIM 612712, which MONDO maps to Leber congenital amaurosis 13
  (MONDO:0012990), so RP53 is not mapped to this dominant entry.

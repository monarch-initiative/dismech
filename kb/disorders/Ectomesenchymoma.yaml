genetic:
- name: HRAS somatic activating mutations
  gene_term:
    preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:40629179
    reference_title: >-
      Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients with HRAS mutation and phenotypic features of neurocutaneous epidermal nevus syndrome
      and nevus sebaceous syndrome had the pathogenic HRAS variant in a spectrum of biological materials
      including healthy tissues with different varying allele frequency (VAF). The molecular genetic
      findings indicate a post-zygotic origin of the pathogenic mutation in HRAS, associated with the
      mosaic phenotype, in both cases.
    explanation: >-
      Bears on whether the variant can be anything other than tumour-restricted, which the genomic
      series could not test. In two children with a neurocutaneous phenotype the variant was present in healthy
      tissue as well as tumour, at different allele fractions, which is post-zygotic mosaicism and not a
      germline variant. It is also not a counter-example to the somatic typing of this record: a
      post-zygotic variant is somatic, just earlier than the tumour.
  - reference: PMID:40629179
    reference_title: >-
      Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These are the first descriptions of ME against a somatic mosaicism background.
    explanation: >-
      The authors' own statement of how new this is: the first descriptions of this tumour arising on a
      background of somatic mosaicism. Cited so the mosaic arm is read as two reported cases rather than
      as an established subtype.
  - &id001
    reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 6 of 7 (86%) MEMs harbored HRAS mutations, 4 with p.G13R mutation and 2 with p.Q61L.
    explanation: The frequency and the two hotspots, from the genomic series.
  - &id002
    reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: RAS mutations were detected in 3 cases (HRAS mutation in 1 case and NRAS mutations in 2 cases).
    explanation: >-
      The much lower RAS rate in the larger series, recorded rather than averaged with the other. The
      two series are not reconciled here.
  notes: >-
    The two largest cited series disagree sharply on how often RAS is mutated - 86% of 7 against 3
    of 17 - and they are not averaged. Neither paper discusses the discrepancy. The caches are not
    symmetric about it either: the genomic series names its hotspot panel gene by gene, while the
    larger series is cached as an abstract that states no genotyping method at all, so the
    methodological difference is visible but unexplained. Two smaller cited series sit with the
    genomic one: HRAS mutations typical of the entity in 4 of 5 cases in a Russian series, and RAS
    pathway mutations in both tumours of a methylation study. Neither is big enough to settle the
    question, and both are counted here so the disagreement is not read as evenly divided.
  frequency: the commonest alteration in one series and an uncommon one in the other
  case_fractions:
  - population: Seven tumours from two institutions, whole-transcriptome sequencing plus a hotspot screen
    case_fraction_percent: 85.7
    cohort_size: 7
    notes: 6 of 7 tumours carried an HRAS mutation; 4 p.G13R and 2 p.Q61L.
    evidence:
    - *id001
  - population: Seventeen tumours from one Chinese centre, 2021-2025
    case_fraction_percent: 5.9
    cohort_size: 17
    notes: >-
      1 of 17 carried an HRAS mutation; 2 more carried NRAS, for 3 of 17 with any RAS mutation. The cached
      record is an abstract and names no genotyping method.
    evidence:
    - *id002

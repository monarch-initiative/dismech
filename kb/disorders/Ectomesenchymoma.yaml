diagnosis:
- name: Immunohistochemical confirmation of both components
  description: >-
    Desmin, MyoD1 and myogenin for the rhabdomyosarcomatous half; S-100 and SOX10 for the Schwann cell
    half; synaptophysin, NSE, chromogranin A and CD56 for the neuroblastic half. The larger series makes
    the point that absent synaptophysin does not exclude neuroectodermal differentiation, and that S-100
    and SOX10 are the reliable markers.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroblastoma component was mostly positive for synaptophysin (SYN), neuron-specific enolase
      (NSE), chromogranin A (CgA), and CD56, whereas the Schwann cell differentiation expressed only S-100
      and/or SOX10.
    explanation: The neuroectodermal marker panel and its variability.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-100 and SOX10 are key and reliable markers for confirming the neuroectodermal component, while
      negativity of neuroendocrine markers such as SYN does not exclude this differentiation.
    explanation: The authors' own conclusion about which markers to rely on.
- name: FOXO1 rearrangement testing to exclude alveolar rhabdomyosarcoma
  description: >-
    The rhabdomyosarcomatous component can show a dense round cell pattern that mimics alveolar rhabdomyosarcoma,
    including strong diffuse desmin and myogenin. Both cached series tested for the fusion and both were
    negative.
  diagnosis_term:

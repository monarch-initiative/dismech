    description: The two differentiating populations make up the mass that presents.
    evidence:
    - reference: PMID:26872011
      reference_title: >-
        Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
        Embryonal Rhabdomyosarcoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The diagnosis of MEM was confirmed by the presence of a biphasic tumor, with histologic evidence
        of RMS and neuroectodermal elements 6 , 9 .
      explanation: >-
        The mass is biphasic by definition here, which is the step from two differentiating populations
        to one tumour. Indirect for the edge: the sentence is a case-selection criterion rather than an
        observation that differentiation produced the mass.
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The mesenchymal component was predominantly embryonal rhabdomyosarcoma (ERMS, 16/17).
    explanation: The mesenchymal half, in the larger of the two cached series.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroectodermal component encompassed the spectrum of neural crest differentiation, including
      neuroblastoma in 12 cases, ganglioneuroma/ganglion cells in 2 cases, composite ganglioneuroblastoma
      in 1 case, and Schwann cell differentiation in 2 cases.
    explanation: >-
      The neuroectodermal half and its range, which is why this node binds a neuron and a Schwann cell
      rather than one lineage.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The mesenchymal component uniformly expressed desmin, MyoD1, and Myogenin.
    explanation: The markers that identify the mesenchymal half as rhabdomyoblastic.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The unsupervised hierarchical clustering using the RNAseq dataset of a large panel of >100 different
      soft tissue tumors showed MEM and RMS tightly grouped together, separate from all other tumor types
    explanation: >-
      The tumour's overall expression profile sits with rhabdomyosarcoma and apart from every other sarcoma
      in that panel. It says nothing about the relative weight of the two programmes inside a tumour -
      the same paper reports that the neuronal genes are what distinguish this entity from rhabdomyosarcoma
      in the same dataset.
  notes: >-
    The neuroblastic and the ganglionic halves of the neuroectodermal component are bound separately because
    CL does not make a neuroblast a kind of neuron: CL:0000031 sits on the precursor branch and its ancestors
    do not include CL:0000540, so one term could not have covered both. CL:0002676 is the same term Neuroblastoma
    binds for this cell.

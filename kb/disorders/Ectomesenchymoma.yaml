    label: ectomesenchymoma
pathophysiology:
- name: HRAS Hotspot Mutation
  description: >-
    An activating hotspot mutation in HRAS, found in six of the seven tumours of the cached genomic series.
    Four carried p.G13R and two p.Q61L. Transcriptome sequencing of its two index cases found no fusion
    gene, and instead recurrent HRAS and PTPRD hotspot mutations in both; what singled HRAS out was the
    screen across the remaining five tumours, in which no further PTPRD or FBXW7 mutation appeared.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: pluripotential neural crest remnant (ectomesenchyme)
    term:
      id: CL:0011012
      label: neural crest cell
  molecular_functions:
  - preferred_term: HRAS G protein switch activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003925
      label: G protein activity
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  genes:
  - preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  downstream:
  - target: Divergent Rhabdomyoblastic and Neuroectodermal Differentiation
    description: >-
      The one driver sits in a tumour that then differentiates two ways at once. No cached source demonstrates
      that the mutation causes the divergence; what they show is that both components share the tumour
      and that it carries the mutation.
    evidence:
    - reference: PMID:26872011
      reference_title: >-
        Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
        Embryonal Rhabdomyosarcoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Microscopically, the RMS and neuroectodermal components were intimately intermixed in all cases.
      explanation: >-
        The two components are intermixed in every case rather than being two collided tumours, which
        is what makes one driver's relation to both an open question rather than a category error.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 6 of 7 (86%) MEMs harbored HRAS mutations, 4 with p.G13R mutation and 2 with p.Q61L.
    explanation: The mutation and its frequency in the cached series, with the two hotspots named.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: No fusion candidate was identified in the 2 index cases by the FusionSeq algorithm.
    explanation: >-
      Excludes a fusion as the driver event. It does not by itself single out HRAS: the same paragraph
      reports PTPRD hotspot mutations in both index cases too, and it is the five-case screen in the next
      item that separates them.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No additional PTPRD or FBWX7 mutations were identified in the remaining MEM or the control RMSs.
    explanation: >-
      The screen that leaves HRAS as the recurrent event: neither of the two other mutations found in
      the index cases recurred in the remaining tumours.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal
      Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MEM nomenclature derives from its possible tumorigenesis from the pluripotential neural crest
      remnants, the so-called ectomesenchyme
    explanation: >-
      The source of the neural crest cell binding on this node. The paper presents the origin from pluripotential
      neural crest remnants as possible and as the derivation of the name, not as a finding, so the binding
      is a hypothesis this entry records rather than a demonstrated lineage.
  notes: >-
    The somatic call is the tumour-level one and the cached series could not confirm it for every case:
    three of the four p.G13R mutations showed a nearly homozygous pattern and no normal DNA was available
    to establish whether they were germline. A germline HRAS G13R would be Costello syndrome, which itself
    predisposes to rhabdomyosarcoma, so that is a real alternative and not a formality. The molecular
    function is graded GAIN_OF_FUNCTION and the process INCREASED on purpose - a RAS hotspot substitution
    takes the switch outside its normal regulatory control, which is the qualitative claim, while what
    the cached series observes is a pathway running above normal. Neither cached source describes the
    hydrolysis defect itself, so nothing is asserted about it. The neural crest cell binding carries the
    entity's name rather than a demonstrated lineage; see the BACKGROUND evidence item above.
- name: Divergent Rhabdomyoblastic and Neuroectodermal Differentiation
  description: >-
    The defining event: one tumour running a skeletal muscle programme and a neural crest programme at
    once. The mesenchymal component was embryonal rhabdomyosarcoma in 16 of 17 tumours in the larger cached
    series and in all seven of the genomic one. The neuroectodermal component is not one thing - the same
    series found neuroblastoma, ganglioneuroma or ganglion cells, composite ganglioneuroblastoma and Schwann
    cell differentiation across its cases.
  biological_scale: CELLULAR
  cell_types:

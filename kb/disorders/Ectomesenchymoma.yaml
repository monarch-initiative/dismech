    The tumour that presents. The two series this node's locations are bound from both put the
    pelvic and genitourinary region first, to different degrees: all but one of seven in the genomic
    series, and 8 of 17 - a plurality, not a majority - in the larger one. A third cited series puts
    the head and neck first at 45.6%, which is why the phenotype row downstream of this node is
    bound site-agnostically and this node's locations should be read as the commonest sites rather
    than the only ones.

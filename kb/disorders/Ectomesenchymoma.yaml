name: Ectomesenchymoma
creation_date: '2026-11-11T20:30:00Z'
description: >-
  A rare biphasic sarcoma of infants and young children in which a rhabdomyosarcomatous mesenchymal component
  and a neuroectodermal component are intimately intermixed in one tumour. The mesenchymal half is almost
  always embryonal rhabdomyosarcoma; the neuroectodermal half runs the whole spectrum of neural crest
  differentiation, from neuroblastoma through ganglioneuroblastoma and ganglioneuroma to scattered mature
  ganglion cells and Schwann cell areas. The pelvic and genitourinary region is the commonest site in
  both cached series, though in the larger one it accounts for fewer than half the cases. How often a
  RAS pathway gene is mutated is unsettled: one series found HRAS in six of seven tumours, the other a
  RAS mutation in three of seventeen. Where the entity belongs nosologically is also unsettled; see review_notes.
categories:
- Pediatric Cancer
- Soft Tissue Sarcoma
- Sarcoma
parents:
- sarcoma
- nervous system cancer
synonyms:
- malignant ectomesenchymoma
- MEM
- embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation
- embryonal rhabdomyosarcoma with heterologous neuroectodermal differentiation
- ERMS-HND

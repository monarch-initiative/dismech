discussions:
- discussion_id: ems_foxo1_status
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - diagnosis#FOXO1 rearrangement testing to exclude alveolar rhabdomyosarcoma
  prompt: >-
    Does a FOXO1 rearrangement exclude ectomesenchymoma, or can an ectomesenchymoma whose mesenchymal
    component is alveolar rhabdomyosarcoma carry one?
  rationale: >-
    The two genomic series this entry was first built on were both FOXO1-negative, and the diagnostic
    row reads as though a rearrangement rules the diagnosis out. Two other series say otherwise. A
    six-case series reports the first demonstration of FOXO1 rearrangement in ectomesenchymoma with an
    alveolar rhabdomyosarcoma component, and an eleven-case single-centre series reports two
    fusion-positive children, both of whom died. Whether those cases are ectomesenchymomas with an
    alveolar component or alveolar rhabdomyosarcomas with entrapped ganglion cells is what is at issue,
    and no cited source settles it. The practical consequence is recorded rather than resolved: a
    positive test does not by itself close the question, and in the one series that followed them up it
    marked the worse outcome.
  evidence:
  - reference: PMID:28994342
    reference_title: >-
      Malignant Ectomesenchymoma: Series Analysis of a Histologically and Genetically Heterogeneous
      Tumor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study is also the first to demonstrate FOXO1 gene rearrangements in malignant ectomesenchymoma
      with alveolar rhabdomyosarcoma subtype.
    explanation: >-
      The side of the dispute the entry did not carry: this series reports FOXO1 rearrangement in
      ectomesenchymoma whose mesenchymal component is alveolar, which is exactly the finding a
      rule-out reading of the test would forbid.
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, children with FOXO1(+) tumors had lower survival rates than those with FOXO1(-)
      tumors (0/2 vs. 7/8).
    explanation: >-
      A second series with fusion-positive cases diagnosed as this tumour, and the only cited source
      that follows them up: neither of the two survived, against seven of eight fusion-negative. Two
      patients is not a prognostic claim, and the row records it as the reason the question matters
      rather than as an answer.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: NO_EVIDENCE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumor cells were all negative for FOXO1, PAX3 and PAX7.
    explanation: >-
      All seventeen cases in the largest cited series were negative for FOXO1 and for both PAX
      partners. This cannot bear on the question above, and the reason is in the series' own
      inclusion criterion: it is a series of embryonal rhabdomyosarcoma with neuroectodermal
      differentiation, sixteen of seventeen of them embryonal, so FOXO1 negativity is substantially
      built into who was enrolled. A cohort selected for embryonal morphology cannot say whether a
      tumour with an alveolar component carries the fusion. Recorded as NO_EVIDENCE rather than left
      out, because the sentence is the one a reader would otherwise take as the answer.
notes: >-
  Eight sources are cited. One of them, the genomic series, is cached as full text; the other seven
  are cached as abstracts alone, which is why several claims are attributed to a named series rather
  than to the literature. None of them is a study of presentation: the phenotype rows record what
  the tumour is made of and where it sits, which is what the sources do report, and no cited source
  gives the symptom a child presents with.


  The series are kept apart rather than pooled. The two largest disagree on the RAS mutation rate (6
  of 7 against 3 of 17) and on the commonest neuroectodermal component (ganglioneuroma in the
  genomic series, neuroblastoma in the larger one), and no paper discusses either difference. Two
  smaller cited series sit on the high side of the mutation question - 4 of 5 in one, both tumours
  in another - which is not enough to settle it and is enough that the dispute should not be
  described as two-sided.
review_notes: >-
  Where this entity belongs is unsettled, and this entry takes no side beyond binding MONDO's own class.
  MONDO:0002855 has the parents sarcoma and nervous system cancer, not any rhabdomyosarcoma class, and
  carries the ICD-O morphology code ICDO:8921/3, which is why this is its own entry under the cancer granularity
  ladder rather than a subtype row on Embryonal_Rhabdomyosarcoma.


  The three positions in the cached literature are these. The genomic series concludes a closer genetic
  link to rhabdomyosarcoma than to malignant peripheral nerve sheath tumour, on shared HRAS mutation,
  on unsupervised clustering that puts the two together and apart from every other sarcoma, and on a nerve
  sheath tumour signature that does not cluster with it at all. The same paper records that the WHO classification
  of soft tissue and bone tumours of the day placed the entity under nerve sheath tumours, and that a
  genomic study of a single intracranial case found an expression profile closer to malignant peripheral
  nerve sheath tumour. The larger series names the entity embryonal rhabdomyosarcoma with divergent neuroectodermal
  differentiation, which asserts the rhabdomyosarcoma placement in the title.


  Nothing is added to Embryonal_Rhabdomyosarcoma. A reader coming from that entry is a real
  concern, but the link belongs in its differential_diagnoses rather than in its has_subtypes: a
  pointer subtype would assert that ectomesenchymoma is a subtype of embryonal rhabdomyosarcoma,
  which is exactly the placement this entry argues the literature has not settled.

      The claim this row makes, in the series' own words: the mesenchymal element was
      rhabdomyosarcoma in every one of six cases, and the dominant component in five of them.
- category: Neoplasm
  name: Neuroectodermal Component
  description: >-
    The neuroectodermal half: most often a neuroblastic tumour, but spanning the range of
    neural-crest differentiation, from neuroblastoma through ganglioneuroma and ganglion cells to
    Schwann-cell differentiation. The binding is at the neuroblastic parent term, which is the
    commonest form and the only part of that range HPO subsumes under one concept; the ganglionic
    and Schwann-cell forms fall outside it and are carried by the row's description and by the cell
    types on the upstream pathophysiology node. HPO files this term under malignant neoplasm of the
    central nervous system, which this tumour is not - a closure query over that parent will pick
    this entry up wrongly, and the entry has no better anchor to offer.
  phenotype_term:
    preferred_term: neuroectodermal component of a biphasic tumour
    term:
      id: HP:0004376
      label: Neuroblastic tumor
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroectodermal component encompassed the spectrum of neural crest differentiation, including
      neuroblastoma in 12 cases, ganglioneuroma/ganglion cells in 2 cases, composite ganglioneuroblastoma
      in 1 case, and Schwann cell differentiation in 2 cases.
    explanation: >-
      Names the spectrum this row binds coarsely, and gives its distribution in seventeen cases:
      neuroblastoma in twelve, then ganglioneuroma or ganglion cells in two, a composite
      ganglioneuroblastoma in one, and Schwann-cell differentiation in two. That spread is why
      coarse_binding_basis is VARIABLE_SPECTRUM, and it is also what the bound term does not cover:
      four of the seventeen are outside it.
- category: Clinical
  name: Mass at a Neural Crest Migration Site
  description: >-
    The presenting finding. The tumour arises along the paths the neural crest takes, so the site
    varies widely; the pelvis and perineum are the commonest in one series and the head and neck in
    another, and the pelvic or genitourinary region in a third. Every HPO mass term names a body
    site - abdominal, pelvic, mediastinal and so on - and those are siblings of one another rather
    than a general and a specific form of one thing, so binding any of them would assert a site this
    tumour does not keep to. The binding is therefore to soft tissue neoplasm, which two cited
    sources state in terms and which carries no site.
  phenotype_term:
    preferred_term: soft tissue mass at a site of neural crest migration
    term:
      id: HP:0031459
      label: Soft tissue neoplasm
  evidence:
  - reference: PMID:28994342
    reference_title: >-
      Malignant Ectomesenchymoma: Series Analysis of a Histologically and Genetically Heterogeneous
      Tumor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ectomesenchymoma manifests in various sites given the wide migration of neural crest cells during
      development, though the pelvis/perineum is most often involved.
    explanation: >-
      States both halves of this row: the site varies because the neural crest migrates widely, and the
      pelvis and perineum are the commonest. BACKGROUND because the sentence is the paper's introduction
      summarising what is established rather than its own result.
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly affected sites were the head and neck (45.6%), followed by the limbs (27.2%) and
      the pelvis/abdomen (27.2%).
    explanation: >-
      A different commonest site in a different series, which is the point of recording the site as
      variable rather than as pelvic. Cited beside the sentence above so the two are read together
      rather than one standing for the disease.
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (MEM) is an extremely rare soft tissue tumor typical of young children,
      currently included in the category of skeletal muscle malignancies and characterized by a
      neuroblastic component.
    explanation: >-
      The source of this row's binding: the entity is a soft tissue tumour, stated without a site.
      BACKGROUND because the sentence is the paper's framing of what it studied rather than its
      result.
  - reference: PMID:40629179
    reference_title: >-
      Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (ME), a rare tumor of soft tissues, has a neuroectodermal component of
      neuroblasts and/or ganglion cells, and a mesenchymal component mostly often represented by
      rhabdomyoblasts.
    explanation: >-
      The same statement from a second series, and the reason the binding does not rest on one
      paper's phrasing.
diagnosis:
- name: PHOX2B immunohistochemistry on the neuroblastic component
  description: >-
    PHOX2B is the marker that would be expected to confirm a neuroblastic component, and in the largest
    cited series it is mostly absent: only two of seventeen cases showed focal positivity. The authors
    read low PHOX2B expression as a differential-diagnostic marker rather than as evidence against the
    component, and name S-100 and SOX10 as the reliable confirmatory markers instead.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 2 cases showed focal PHOX2B positivity.
    explanation: >-
      The measurement: two of seventeen, and focal at that. It matters because a pathologist expecting
      PHOX2B to mark the neuroblastic component would read its absence as excluding one.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low PHOX2B expression in the neuroblastoma component may serve as an important marker for the
      differential diagnosis.
    explanation: >-
      The authors' own reading, hedged as they hedge it: low expression may be a marker for telling this
      tumour from others rather than a reason to doubt the component. The row records the finding and
      their reading of it, and makes no claim about which differential it separates.
- name: Immunohistochemical confirmation of both components
  description: >-
    Desmin, MyoD1 and myogenin for the rhabdomyosarcomatous half; S-100 and SOX10 for the Schwann cell
    half; synaptophysin, NSE, chromogranin A and CD56 for the neuroblastic half. The larger series makes
    the point that absent synaptophysin does not exclude neuroectodermal differentiation, and that S-100
    and SOX10 are the reliable markers.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroblastoma component was mostly positive for synaptophysin (SYN), neuron-specific enolase
      (NSE), chromogranin A (CgA), and CD56, whereas the Schwann cell differentiation expressed only S-100
      and/or SOX10.
    explanation: The neuroectodermal marker panel and its variability.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-100 and SOX10 are key and reliable markers for confirming the neuroectodermal component, while
      negativity of neuroendocrine markers such as SYN does not exclude this differentiation.
    explanation: The authors' own conclusion about which markers to rely on.
- name: FOXO1 rearrangement testing to exclude alveolar rhabdomyosarcoma
  description: >-
    The rhabdomyosarcomatous component can show a dense round cell pattern that mimics alveolar
    rhabdomyosarcoma, including strong diffuse desmin and myogenin. Three cited series tested for
    the fusion and found none. Two others report fusion-positive cases diagnosed as this tumour, so
    a positive result does not by itself exclude the diagnosis; the attached discussion records why
    the question is open and what a positive result meant in the one series that followed those
    children up.
  diagnosis_term:
    preferred_term: fluorescence in situ hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 MEMs with a dense/round cell component were negative for FOXO1 gene rearrangements by fluorescence
      in situ hybridization (data not shown).
    explanation: The test and its result in the genomic series.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The tumor cells were all negative for FOXO1, PAX3 and PAX7.
    explanation: >-
      The same negative result in the larger series. That series states no method for it, so this is the
      same finding rather than necessarily the same assay.
- name: H3K27me3 immunohistochemistry to exclude malignant peripheral nerve sheath tumour
  description: >-
    Most malignant peripheral nerve sheath tumours lose H3K27me3 through PRC2 inactivation, so retention
    is evidence against that diagnosis. The genomic series reports it retained in all seven tumours, in
    both components. The larger series reports it for one case, in Schwann cell areas, and generalises
    it in its conclusions against malignant triton tumour specifically rather than against malignant peripheral
    nerve sheath tumour at large.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: All cases retained H3K27me3 expression in both RMS and neuroectodermal regions.
    explanation: Retention across the genomic series, in both components.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike malignant triton tumors, Schwann cell differentiation in this tumor does not exhibit loss
      of H3K27me3.
    explanation: The same discriminator stated as a conclusion by the larger series, against the closest
      mimic.
treatments:
- name: Rhabdomyosarcoma-protocol chemotherapy
  description: >-
    Most patients in the cached genomic series were treated on a rhabdomyosarcoma protocol rather than

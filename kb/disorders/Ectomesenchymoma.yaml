    snippet: >-
      Mesenchymal elements, represented by rhabdomyosarcoma in all instances, were the dominant component
      in the majority of cases (5/6).
    explanation: >-
      The claim this row makes, in the series' own words: the mesenchymal element was
      rhabdomyosarcoma in every one of six cases, and the dominant component in five of them.
- category: Neoplasm
  name: Neuroectodermal Component
  description: >-
    The neuroectodermal half: most often a neuroblastic tumour, but spanning the range of
    neural-crest differentiation, from neuroblastoma through ganglioneuroma and ganglion cells to
    Schwann-cell differentiation. The binding is at the neuroblastic parent term, which is the
    commonest form and the only part of that range HPO subsumes under one concept; the ganglionic
    and Schwann-cell forms fall outside it and are carried by the row's description and by the cell
    types on the upstream pathophysiology node. HPO files this term under malignant neoplasm of the
    central nervous system, which this tumour is not - a closure query over that parent will pick
    this entry up wrongly, and the entry has no better anchor to offer.
  phenotype_term:
    preferred_term: neuroectodermal component of a biphasic tumour
    term:
      id: HP:0004376
      label: Neuroblastic tumor
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroectodermal component encompassed the spectrum of neural crest differentiation, including
      neuroblastoma in 12 cases, ganglioneuroma/ganglion cells in 2 cases, composite ganglioneuroblastoma
      in 1 case, and Schwann cell differentiation in 2 cases.
    explanation: >-
      Names the spectrum this row binds coarsely, and gives its distribution in seventeen cases:
      neuroblastoma in twelve, then ganglioneuroma or ganglion cells in two, a composite
      ganglioneuroblastoma in one, and Schwann-cell differentiation in two. That spread is why
      coarse_binding_basis is VARIABLE_SPECTRUM, and it is also what the bound term does not cover:
      four of the seventeen are outside it.
- category: Clinical
  name: Mass at a Neural Crest Migration Site
  description: >-
    The presenting finding. The tumour arises along the paths the neural crest takes, so the site
    varies widely; the pelvis and perineum are the commonest in one series and the head and neck in
    another, and the pelvic or genitourinary region in a third. Every HPO mass term names a body
    site - abdominal, pelvic, mediastinal and so on - and those are siblings of one another rather
    than a general and a specific form of one thing, so binding any of them would assert a site this
    tumour does not keep to. The binding is therefore to soft tissue neoplasm, which two cited
    sources state in terms and which carries no site.
  phenotype_term:
    preferred_term: soft tissue mass at a site of neural crest migration
    term:
      id: HP:0031459
      label: Soft tissue neoplasm
  evidence:
  - reference: PMID:28994342
    reference_title: >-
      Malignant Ectomesenchymoma: Series Analysis of a Histologically and Genetically Heterogeneous
      Tumor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ectomesenchymoma manifests in various sites given the wide migration of neural crest cells during
      development, though the pelvis/perineum is most often involved.
    explanation: >-
      States both halves of this row: the site varies because the neural crest migrates widely, and the
      pelvis and perineum are the commonest. BACKGROUND because the sentence is the paper's introduction
      summarising what is established rather than its own result.
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly affected sites were the head and neck (45.6%), followed by the limbs (27.2%) and
      the pelvis/abdomen (27.2%).
    explanation: >-
      A different commonest site in a different series, which is the point of recording the site as
      variable rather than as pelvic. Cited beside the sentence above so the two are read together
      rather than one standing for the disease.
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (MEM) is an extremely rare soft tissue tumor typical of young children,
      currently included in the category of skeletal muscle malignancies and characterized by a
      neuroblastic component.
    explanation: >-
      The source of this row's binding: the entity is a soft tissue tumour, stated without a site.
      BACKGROUND because the sentence is the paper's framing of what it studied rather than its
      result.
  - reference: PMID:40629179
    reference_title: >-
      Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (ME), a rare tumor of soft tissues, has a neuroectodermal component of
      neuroblasts and/or ganglion cells, and a mesenchymal component mostly often represented by
      rhabdomyoblasts.
    explanation: >-
      The same statement from a second series, and the reason the binding does not rest on one
      paper's phrasing.
diagnosis:
- name: PHOX2B immunohistochemistry on the neuroblastic component
  description: >-
    PHOX2B is the marker that would be expected to confirm a neuroblastic component, and in the largest
    cited series it is mostly absent: only two of seventeen cases showed focal positivity. The authors
    read low PHOX2B expression as a differential-diagnostic marker rather than as evidence against the
    component, and name S-100 and SOX10 as the reliable confirmatory markers instead.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 2 cases showed focal PHOX2B positivity.
    explanation: >-
      The measurement: two of seventeen, and focal at that. It matters because a pathologist expecting
      PHOX2B to mark the neuroblastic component would read its absence as excluding one.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low PHOX2B expression in the neuroblastoma component may serve as an important marker for the
      differential diagnosis.
    explanation: >-
      The authors' own reading, hedged as they hedge it: low expression may be a marker for telling this
      tumour from others rather than a reason to doubt the component. The row records the finding and
      their reading of it, and makes no claim about which differential it separates.
- name: Immunohistochemical confirmation of both components
  description: >-
    Desmin, MyoD1 and myogenin for the rhabdomyosarcomatous half; S-100 and SOX10 for the Schwann cell
    half; synaptophysin, NSE, chromogranin A and CD56 for the neuroblastic half. The larger series makes
    the point that absent synaptophysin does not exclude neuroectodermal differentiation, and that S-100
    and SOX10 are the reliable markers.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neuroblastoma component was mostly positive for synaptophysin (SYN), neuron-specific enolase
      (NSE), chromogranin A (CgA), and CD56, whereas the Schwann cell differentiation expressed only S-100
      and/or SOX10.
    explanation: The neuroectodermal marker panel and its variability.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-100 and SOX10 are key and reliable markers for confirming the neuroectodermal component, while
      negativity of neuroendocrine markers such as SYN does not exclude this differentiation.
    explanation: The authors' own conclusion about which markers to rely on.
- name: FOXO1 rearrangement testing to exclude alveolar rhabdomyosarcoma
  description: >-
    The rhabdomyosarcomatous component can show a dense round cell pattern that mimics alveolar
    rhabdomyosarcoma, including strong diffuse desmin and myogenin. Three cited series tested for
    the fusion and found none. Two others report fusion-positive cases diagnosed as this tumour, so
    a positive result does not by itself exclude the diagnosis; the attached discussion records why
    the question is open and what a positive result meant in the one series that followed those
    children up.
  diagnosis_term:
    preferred_term: fluorescence in situ hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 MEMs with a dense/round cell component were negative for FOXO1 gene rearrangements by fluorescence
      in situ hybridization (data not shown).
    explanation: The test and its result in the genomic series.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The tumor cells were all negative for FOXO1, PAX3 and PAX7.
    explanation: >-
      The same negative result in the larger series. That series states no method for it, so this is the
      same finding rather than necessarily the same assay.
- name: H3K27me3 immunohistochemistry to exclude malignant peripheral nerve sheath tumour
  description: >-
    Most malignant peripheral nerve sheath tumours lose H3K27me3 through PRC2 inactivation, so retention
    is evidence against that diagnosis. The genomic series reports it retained in all seven tumours, in
    both components. The larger series reports it for one case, in Schwann cell areas, and generalises
    it in its conclusions against malignant triton tumour specifically rather than against malignant peripheral
    nerve sheath tumour at large.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: All cases retained H3K27me3 expression in both RMS and neuroectodermal regions.
    explanation: Retention across the genomic series, in both components.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike malignant triton tumors, Schwann cell differentiation in this tumor does not exhibit loss
      of H3K27me3.
    explanation: The same discriminator stated as a conclusion by the larger series, against the closest
      mimic.
differential_diagnoses:
- name: Embryonal rhabdomyosarcoma
  disease_term:
    preferred_term: embryonal rhabdomyosarcoma
    term:
      id: MONDO:0009993
      label: embryonal rhabdomyosarcoma
  description: >-
    The differential this entry is most often resolved against, and the one it is most often mistaken
    for: in the European series, seven of ten tumours carried an initial local diagnosis of
    rhabdomyosarcoma. The mesenchymal component of an ectomesenchymoma usually is embryonal
    rhabdomyosarcoma, the two share HRAS hotspot mutations, and methylation profiling places
    ectomesenchymoma inside the embryonal rhabdomyosarcoma superfamily. The neuroectodermal component
    is what separates them, and little else does.
  distinguishing_features:
  - Ectomesenchymoma requires morphologic neuroectodermal differentiation beside the rhabdomyosarcomatous
    component; embryonal rhabdomyosarcoma carries the muscle component alone.
  - Neural-marker immunohistochemistry without morphologic neural or neuronal differentiation was treated
    as insufficient for the diagnosis in the genomic series, so a positive stain on its own does not move
    a tumour across this line.
  - Methylation profiling does not adjudicate it. The one cited methylation-profiling study aligns
    ectomesenchymoma with the embryonal rhabdomyosarcoma superfamily, so it argues for the relationship
    rather than for a way of telling the two apart.
  evidence:
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 10 cases, seven had an initial local diagnosis of rhabdomyosarcoma.
    explanation: >-
      Quantifies how often this entity is first called rhabdomyosarcoma in practice. The source says
      rhabdomyosarcoma without a subtype, so the figure covers the whole family rather than this row
      alone.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical staining for neural markers alone without morphologic evidence of neural /
      neuronal differentiation was considered insufficient for diagnosis
    explanation: >-
      States what does not establish the neuroectodermal component, which is the trap in applying the
      criterion that separates the two. The sentence restates a standard the series adopted from an
      earlier paper rather than a finding of its own.
  - reference: PMID:42504917
    reference_title: >-
      DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal Rhabdomyosarcoma-Like
      Epigenetic Identity.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methylation analysis, including microdissected components, consistently aligned ectomesenchymoma
      with the embryonal rhabdomyosarcoma superfamily, revealing a shared myogenic epigenetic program
      despite neural differentiation.
    explanation: >-
      The quote asserts alignment; that methylation therefore cannot be used to tell the two apart is one
      inference step on from it, so this is graded INDIRECT.
- name: Alveolar rhabdomyosarcoma
  disease_term:
    preferred_term: alveolar rhabdomyosarcoma
    term:
      id: MONDO:0009994
      label: alveolar rhabdomyosarcoma
  description: >-
    Reached through the mesenchymal component rather than the neuroectodermal one. Round or
    undifferentiated areas inside the rhabdomyosarcomatous component raise alveolar rhabdomyosarcoma, and
    the genomic series tested every such case by FOXO1 FISH to exclude it. Whether a rearrangement
    actually excludes ectomesenchymoma is unsettled and is curated as an open controversy rather than
    decided here.
  distinguishing_features:
  - Round or undifferentiated sheets inside a fusion-negative rhabdomyosarcoma are a recognised mimic of
    alveolar rhabdomyosarcoma, designated the dense pattern of embryonal rhabdomyosarcoma, so morphology
    alone does not settle the question.
  - FOXO1 FISH is the test the genomic series used to exclude a fusion-positive alveolar
    rhabdomyosarcoma when such areas were present.
  - A positive FOXO1 result does not by itself close the question. Rearrangements have since been
    reported in ectomesenchymoma with an alveolar component. See the ems_foxo1_status discussion, which
    carries both sides and is not restated here.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cases with round/undifferentiated areas resembling solid or classic ARMS were tested by
      fluorescence in situ hybridization for FOXO1 gene rearrangements, to exclude a fusion positive ARMS.
    explanation: >-
      Records the test applied, and the morphologic trigger for applying it, as the series' own procedure.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These compact sheet-like areas of round to undifferentiated cells within a fusion-negative RMS have
      been recently recognized by Children's Oncology Group as potential pitfall with ARMS and designated
      as 'dense pattern' of ERMS
    explanation: >-
      Names the morphologic mimic, which is why the FISH test is needed rather than optional. The sentence
      restates a Children's Oncology Group designation rather than a finding of this series.
- name: Malignant peripheral nerve sheath tumor
  disease_term:
    preferred_term: malignant peripheral nerve sheath tumor
    term:
      id: MONDO:0017827
      label: malignant peripheral nerve sheath tumor
  description: >-
    Raised by the neuroectodermal component, and by the neural crest derivation this entity is
    attributed to. The genomic series tested the relationship on two independent axes and separated the
    two on both.
    Malignant triton tumour, which carries rhabdomyoblastic differentiation inside a nerve sheath tumour
    and so mimics the biphasic appearance directly, is the subtype that matters here and is covered by
    the same marker.
  distinguishing_features:
  - H3K27me3 is typically lost in malignant peripheral nerve sheath tumour and was retained in every case
    of the genomic series, so the marker runs the opposite way in the two entities.
  - Expression profiling showed no significant overlap with malignant peripheral nerve sheath tumour,
    placing ectomesenchymoma closer to rhabdomyosarcoma than to a nerve sheath tumour.
  - Malignant triton tumour is the closest mimic, since it also pairs rhabdomyoblastic with Schwannian
    differentiation; the same H3K27me3 reading separates it, with loss in triton tumour and retention in
    the Schwann cell areas here. The cited series states that generally but observed it in the one of
    its seventeen tumours that was worked up for it.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trimethylation at lysine 27 of histone H3 (H3K27me3) expression, typically lost in MPNST, was
      retained in all cases.
    explanation: >-
      The immunohistochemical discriminator, with the direction it runs in each entity.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expression profiling of MEM showed upregulation of skeletal muscle and neuronal genes, with no
      significant overlap with MPNST.
    explanation: >-
      A second, independent axis separating the two, so the distinction does not rest on one marker.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike malignant triton tumors, Schwann cell differentiation in this tumor does not exhibit loss of
      H3K27me3.
    explanation: >-
      Extends the same marker to the triton tumour mimic. The series reports this of a tumour it designates
      embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation, which this entry carries
      as a synonym.
  notes: >-
    Malignant triton tumour is folded into this row rather than given one of its own, because the KB
    models it as a subtype of malignant peripheral nerve sheath tumour rather than as a separate disease,
    and because H3K27me3 is cited against both the parent and the subtype.
treatments:
- name: Rhabdomyosarcoma-protocol chemotherapy
  description: >-
    Most patients in the cached genomic series were treated on a rhabdomyosarcoma protocol rather than
    on anything specific to this entity. That is a description of practice, not a comparative result:
    no cached source compares regimens.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients received chemotherapy, following the RMS regimen protocols in 5, including COG ARST0531
      (3), EpSSG2005 (1), RMS96 (1), and MSKCC P6 protocol, developed for high-risk Ewing sarcoma in the
      remaining patient.
    explanation: What was given, and under which protocols.
  notes: >-
    No cached source reports a trial or a comparison between regimens, so neither is recorded. Two
    report something adjacent and neither is a regimen comparison: the German cooperative-group
    series reports that three of four evaluable tumours responded well to induction chemotherapy,
    which is a response rate in four patients on an unstated set of regimens, and the Chinese
    single-centre series compares chemotherapy alone against chemotherapy with radiotherapy, which
    is a comparison of local treatment and is recorded on the radiotherapy row. The survival figures
    sit in progression.
- name: Surgical resection
  description: >-
    Gross resection of the primary tumour. The German cooperative-group series describes it as the
    local treatment its patients received alongside chemotherapy; the European series' cached
    abstract names chemotherapy and radiotherapy and does not mention surgery at all. No cited
    source isolates resection's effect: the series report what was done and what happened, not a
    comparison against not resecting.
  treatment_term:
    preferred_term: tumour resection
    term:
      id: NCIT:C164212
      label: Tumor Resection
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Biphasic Intermixed Tumour Mass
    description: >-
      Resection removes the mass itself. It acts on no step upstream of it: the HRAS lesion and the
      divergent differentiation are not addressed. No cited source attributes a relapse to that, so
      the entry records the scope of the treatment and not a cause of recurrence.
    evidence:
    - reference: PMID:22535600
      reference_title: >-
        Malignant ectomesenchymoma in children and adolescents: report from the Cooperative
        Weichteilsarkom Studiengruppe (CWS).
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The tumors of 4/5 patients with localized MEM were at least grossly resected at best surgery;
        the patient without gross resection was additionally irradiated.
      explanation: >-
        Records that the local treatment acted on the tumour mass, which is this link's target. INDIRECT
        because the series reports what was done rather than measuring the resection's effect on the
        mass against an alternative.
  evidence:
  - reference: PMID:22535600
    reference_title: >-
      Malignant ectomesenchymoma in children and adolescents: report from the Cooperative
      Weichteilsarkom Studiengruppe (CWS).
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors of 4/5 patients with localized MEM were at least grossly resected at best surgery; the
      patient without gross resection was additionally irradiated.
    explanation: >-
      Four of the five localized cases in this cooperative-group series were at least grossly resected,
      and the one that was not had radiotherapy instead. That is the practice this row records.
  notes: >-
    No cited source runs an independent prognostic-factor analysis on resection: the two
    cooperative-group series are six and ten patients and report what was done beside what happened.
    Two cited sources do make the general claim - the Chinese single-centre series concludes that
    combining chemotherapy with local treatments such as surgery and radiotherapy can improve the
    prognosis, which is the conclusion of a comparison of eleven children. Read that as the authors'
    reading of their own series rather than as a measured effect of resection, which is what an
    independent analysis would give.


    Neither local-treatment link carries a treatment_effect. The enum's values describe acting on a
    process - inhibiting, activating, modulating, bypassing or restoring it - and neither removing a mass
    nor irradiating its bed is any of those. The slot is left absent rather than filled with the nearest
    value.
- name: Radiotherapy
  description: >-
    Radiotherapy was given to four of the ten patients in the European series. The Chinese
    single-centre series reports a lower relapse rate in its irradiated group, which is the only
    comparative result in any cited source on local treatment. Its own abstract gives two
    irreconcilable counts for how many of its children were irradiated - four of the nine who had
    surgery in one sentence, six in the relapse comparison - and the entry quotes both rather than
    choosing between them.
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Biphasic Intermixed Tumour Mass
    description: >-
      Local control of the tumour mass. As with surgery, nothing upstream of the mass is addressed.
      No cited source states the sequence relative to resection, and the one that describes a
      sequence gives the opposite one: its unresected patient was the one who was irradiated.
    evidence:
    - reference: PMID:40221922
      reference_title: >-
        A single-center retrospective study of malignant ectomesenchymoma in children.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Children who received both radiotherapy and chemotherapy had a significantly lower relapse rate
        compared to those treated with chemotherapy alone (2/6 vs. 5/5, P = 0.046).
      explanation: >-
        The only comparative result in any cited source on local treatment: relapse in two of six who
        had radiotherapy with chemotherapy against five of five who had chemotherapy alone. INDIRECT
        because relapse is an outcome of the disease rather than a measurement on the mass itself, and
        because the arms were not randomised.
  evidence:
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children who received both radiotherapy and chemotherapy had a significantly lower relapse rate
      compared to those treated with chemotherapy alone (2/6 vs. 5/5, P = 0.046).
    explanation: >-
      Relapse in two of six who had radiotherapy with chemotherapy against five of five who had
      chemotherapy alone, at p = 0.046. Read the denominators before using it: these are
      single-figure arms in one retrospective single-centre series, not randomised ones, and the six
      does not reconcile with the same abstract's count of how many were irradiated.
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients received chemotherapy according to rhabdomyosarcoma strategy, four had radiotherapy.
    explanation: >-
      The European series' own account of what its ten patients received: chemotherapy on a
      rhabdomyosarcoma strategy for all, radiotherapy for four. It records practice and makes no
      comparison, which is why the comparative claim in this row rests on the other series.
progression:
- phase: Metastatic disease at diagnosis
  notes: >-
    The clearest adverse factor in the cited series, and the only one on which two cooperative
    groups agree. Neither states that its cohort is disjoint from the other's, and both are European
    registries of overlapping eras, so read the agreement as two reports rather than as two
    independent samples. In the German series the one patient with metastatic disease was the only
    one who died; in the European series the patient with an initially metastatic tumour was likewise the
    only death. Both are single patients, so this is a consistent direction across small series rather
    than a measured hazard.
  evidence:
  - reference: PMID:22535600
    reference_title: >-
      Malignant ectomesenchymoma in children and adolescents: report from the Cooperative
      Weichteilsarkom Studiengruppe (CWS).
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individual with metastatic MEM did not survive, but all five patients with localized MEM are
      currently alive in CR with a median follow-up of 5 years (range: 2.1-13.7).
    explanation: >-
      One metastatic patient, who died, against five localized ones alive in complete remission at a
      median of five years. The denominators are what keep this a direction rather than a rate.
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, six patients were alive in first remission, two in second remission and one after second
      tumor. Only the patient with initially metastatic tumor died of disease.
    explanation: >-
      The same pattern in a second group of ten: nine alive, and the one death was the initially
      metastatic patient. Two series agreeing on which patient died is the reason this phase is
      recorded at all; neither says whether its patients overlap the other's.
- phase: Relapse and long-term survival
  notes: >-
    The two outcome figures from the Chinese single-centre series read oddly together and should be
    quoted together: five-year overall survival 79% against event-free survival 14%. Most children
    were alive at five years, and most had had an event before then. No cited source states why for
    that cohort, but the pattern that produces such a gap - relapse followed by survival after
    salvage - is reported in both European series, which between them record two patients alive in
    second remission and three recurrences in a group where every localized patient survived.
    Neither European series' cached abstract gives an event-free survival figure to compare, so the
    pair is recorded as one series' numbers rather than as the entity's prognosis.
  evidence:
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year overall survival rate was 79%, while the event-free survival rate was 14%.
    explanation: >-
      Both rates from eleven children at one centre. The row quotes them as a pair because either alone
      misleads: 79% reads as a good outcome and 14% as a bad one, and they are the same cohort.
- phase: Follow-up after treatment
  duration: median 5.4 years
  notes: >-
    Six of the seven patients in the cached genomic series had follow-up and none recurred or metastasised
    over a median of 5.4 years. That is seven patients from two institutions, so it describes that series
    and is not a prognosis for the entity.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No recurrence or metastasis occurred in 6 cases with available follow-up data during a median period
      of 5.4 years (range, 0.9–16.7).
    explanation: The outcome, with its denominator and period.
prevalence:
- population: Cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No cited source gives a rate. Two of the eight count the published literature instead: about 64
    cases as of 2016, mostly single case reports, and 50 as of 2013. Five of the eight call the
    entity rare, exceedingly rare or extremely rare and the other three use no frequency word at
    all, and the two that count sit one in each of those groups rather than beside them. The class
    recorded here rests on the counts rather than on the adjectives.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 64 cases of MEM have been so far documented in the literature, mostly as single case
      reports 3 , 4 .
    explanation: The larger and more recent of the two literature counts the cited sources give.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (MEM) is an exceedingly rare pediatric sarcoma with a predilection for
      infants and young children and is composed of dual malignant mesenchymal and neuroectodermal components.
    explanation: >-
      A statement of rarity without a number, from the series that supplies the count above. Four other
      cited sources say the same thing in the same way, so this is the form rather than the only
      instance.
mechanistic_hypotheses:
- hypothesis_group_id: erms_myogenic_identity
  hypothesis_label: One myogenic tumour, with the neural component as divergent differentiation within it
  status: CANONICAL
  description: >-
    The field's current reading. Both components belong to one myogenic tumour, and the neural
    tissue is a divergent differentiation within it rather than the tumour's other half. Two quotes
    below carry it: methylation profiling that included microdissected components aligns the tumour
    with the embryonal rhabdomyosarcoma superfamily and finds a myogenic programme on both sides of
    the histological divide, and the genomic series' own conclusion that a skeletal-muscle gene
    signature with retained H3K27me3, alongside the HRAS mutations, reads as a closer relationship
    to rhabdomyosarcoma than to malignant peripheral nerve sheath tumour. That series' unsupervised
    clustering of whole-transcriptome data groups ectomesenchymoma tightly with rhabdomyosarcoma as
    well, and is quoted on the Divergent Rhabdomyoblastic and Neuroectodermal Differentiation node
    rather than here. The 2026 WHO classification removed ectomesenchymoma as a separate entity,
    which is the nosological counterpart of this reading rather than evidence for it, and is cited on
    the `ems_entity_status` controversy where that question belongs. The genomic series' expression
    profile is not myogenic alone, though: it reports upregulation of skeletal muscle and neuronal
    genes together, which is what a tumour with two components would show. On this reading the driver
    mutation acts in a myogenic progenitor and the neuroectodermal component is what that lineage
    does under it.
  evidence:
  - reference: PMID:42504917
    reference_title: >-
      DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal
      Rhabdomyosarcoma-Like Epigenetic Identity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methylation analysis, including microdissected components, consistently aligned ectomesenchymoma
      with the embryonal rhabdomyosarcoma superfamily, revealing a shared myogenic epigenetic program
      despite neural differentiation.
    explanation: >-
      A myogenic epigenetic programme on both sides of the divide, which is this hypothesis's central
      claim. Two cases, and the authors say aligned rather than shown, so the hypothesis is recorded
      as the field's reading rather than as a demonstrated cell of origin.
  - reference: PMID:26872011
    reference_title: "Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal Rhabdomyosarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high frequency of HRAS mutations identified in MEM, corroborated with a skeletal
      muscle-related gene signature and retained H3K27me3 expression, suggest a closer relationship
      to RMS than MPNST.
    explanation: >-
      The expression and epigenetic argument for a rhabdomyosarcoma affiliation. INDIRECT because the
      comparison the authors draw is with malignant peripheral nerve sheath tumour rather than with a
      neural-crest origin, so a closer relationship to rhabdomyosarcoma does not by itself place the
      cell of origin in muscle.
  notes: >-
    The nosological half of this question - whether the entry should exist separately at all - is the
    separate `ems_entity_status` controversy. This hypothesis group is about where the tumour starts,
    not about how it should be classified.

    One consequence to read deliberately: the entry's derived cancer cell of origin is the neural
    crest cell bound on the HRAS node, because that is the node carrying the somatic lesion, so the
    pathograph encodes the alternative account rather than this one. It is left that way because no
    cited source names a myogenic progenitor as this tumour's cell of origin, and binding one to
    carry the canonical reading would manufacture a specificity the sources do not have. A reader of
    the cell-of-origin derivation should take it as the alternative hypothesis's cell, not as settled.
- hypothesis_group_id: neural_crest_ectomesenchyme_origin
  hypothesis_label: The driver event occurs no later than the migrating neural-crest ectomesenchyme
  status: ALTERNATIVE
  description: >-
    The older account, and the one the tumour's name encodes: a pluripotent neural-crest remnant, the
    ectomesenchyme, gives rise to both components because it can make both. Its strongest support is
    not the nomenclature but a mosaic finding - in two patients with a neurocutaneous syndrome the
    HRAS variant was present at different variant allele fractions in several tissues including
    healthy ones, which times the driver event no later than the migrating ectomesenchyme. It is
    recorded as ALTERNATIVE rather than as a rival because it is not exclusive of the myogenic
    reading above - a neural-crest-derived progenitor may run a myogenic programme - and because the
    timing evidence comes from two mosaic patients rather than from sporadic tumours.
  evidence:
  - reference: PMID:40629179
    reference_title: "Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of cases harbored HRAS gene variants in ME samples, 2 patients with neurocutaneous
      syndrome had the pathogenic HRAS variant with different VAF in various biological material
      including healthy tissues, that exposed the driver event as postzygotic, occurring not later
      than the stage of migrating ectomesenchyme originating from the neural crest.
    explanation: >-
      The authors' own timing of the driver event to the migrating ectomesenchyme, from variant
      allele fractions across tissues. It is the only statement in this entry's cited set that ties a
      neural-crest progenitor to the tumour's own data rather than to its name, and it rests on the
      two mosaic patients.
  - reference: PMID:22535600
    reference_title: "Malignant ectomesenchymoma in children and adolescents: report from the Cooperative Weichteilsarkom Studiengruppe (CWS)."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant ectomesenchymoma (MEM) is a soft tissue tumor with heterologous rhabdomyoblastic
      components believed to arise from pluripotent migratory neural crest cells.
    explanation: >-
      The hypothesis as the field stated it, quoted with its hedge. BACKGROUND because it is the
      framing sentence of a case series rather than that series' own result, and INDIRECT because
      believed to arise is a report of a belief and not a demonstration.
discussions:
- discussion_id: ems_entity_status
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is ectomesenchymoma a disease in its own right, or a subtype of embryonal rhabdomyosarcoma?
  rationale: >-
    The sixth edition of the WHO soft tissue and bone classification removed it as a separate entity
    and recognises it as a subtype of embryonal rhabdomyosarcoma with divergent neuroectodermal
    differentiation. MONDO has not followed: MONDO:0002855 is live, its parents are sarcoma and
    nervous system cancer rather than any rhabdomyosarcoma class, and it carries its own ICD-O
    morphology code. This entry binds the MONDO class and so exists as a separate entry, which means
    the repository and the current classification disagree. The disagreement is recorded rather than
    resolved here, because resolving it is a MONDO question before it is a dismech one.
  attaches_to:
  - disease#
  evidence:
  - reference: PMID:42839882
    reference_title: >-
      The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Ectomesenchymoma, an extremely rare and predominantly pediatric tumor, was removed as a
      separate entity from the classification; this lesion is now recognized as a subtype of
      embryonal rhabdomyosarcoma and referred to as "embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation" based on the presence of intermixed neuroblastic elements.
    explanation: >-
      The current classification's own statement, and the one side of this controversy that was not
      in the entry's cited set until now. Quoted through the naming clause rather than stopped
      before it, because the name it gives is one this entry already carries as a synonym.
- discussion_id: ems_foxo1_status
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - diagnosis#FOXO1 rearrangement testing to exclude alveolar rhabdomyosarcoma
  prompt: >-
    Does a FOXO1 rearrangement exclude ectomesenchymoma, or can an ectomesenchymoma whose mesenchymal
    component is alveolar rhabdomyosarcoma carry one?
  rationale: >-
    The two genomic series this entry was first built on were both FOXO1-negative, and the diagnostic
    row reads as though a rearrangement rules the diagnosis out. Two other series say otherwise. A
    six-case series reports the first demonstration of FOXO1 rearrangement in ectomesenchymoma with an
    alveolar rhabdomyosarcoma component, and an eleven-case single-centre series reports two
    fusion-positive children, both of whom died. Whether those cases are ectomesenchymomas with an
    alveolar component or alveolar rhabdomyosarcomas with entrapped ganglion cells is what is at issue,
    and no cited source settles it. The practical consequence is recorded rather than resolved: a
    positive test does not by itself close the question, and in the one series that followed them up it
    marked the worse outcome.
  evidence:
  - reference: PMID:28994342
    reference_title: >-
      Malignant Ectomesenchymoma: Series Analysis of a Histologically and Genetically Heterogeneous
      Tumor.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study is also the first to demonstrate FOXO1 gene rearrangements in malignant ectomesenchymoma
      with alveolar rhabdomyosarcoma subtype.
    explanation: >-
      The side of the dispute the entry did not carry: this series reports FOXO1 rearrangement in
      ectomesenchymoma whose mesenchymal component is alveolar, which is exactly the finding a
      rule-out reading of the test would forbid.
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, children with FOXO1(+) tumors had lower survival rates than those with FOXO1(-)
      tumors (0/2 vs. 7/8).
    explanation: >-
      A second series with fusion-positive cases diagnosed as this tumour, and the only cited source
      that follows them up: neither of the two survived, against seven of eight fusion-negative. Two
      patients is not a prognostic claim, and the row records it as the reason the question matters
      rather than as an answer.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: NO_EVIDENCE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumor cells were all negative for FOXO1, PAX3 and PAX7.
    explanation: >-
      All seventeen cases in the largest cited series were negative for FOXO1 and for both PAX
      partners. This cannot bear on the question above, and the reason is in the series' own
      inclusion criterion: it is a series of embryonal rhabdomyosarcoma with neuroectodermal
      differentiation, sixteen of seventeen of them embryonal, so FOXO1 negativity is substantially
      built into who was enrolled. A cohort selected for embryonal morphology cannot say whether a
      tumour with an alveolar component carries the fusion. Recorded as NO_EVIDENCE rather than left
      out, because the sentence is the one a reader would otherwise take as the answer.
- discussion_id: ems_no_experimental_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Divergent Rhabdomyoblastic and Neuroectodermal Differentiation
  prompt: >-
    Is there any experimental model of this tumour in which the step from the HRAS mutation to
    divergent differentiation could be tested rather than inferred?
  rationale: >-
    Not one of the nine references this entry cites reports a cell line, a xenograft, a mouse or any
    other experimental model of ectomesenchymoma, and none asks for one. Searching all nine cached
    records for cell line, xenograft, mouse, mice, murine, in vitro, in vivo, model system, animal
    model, preclinical, organoid and PDX returns a single hit, and it is the phrase dendritic cell
    lineages inside a classification review. Every study in the set works on patient tissue, by
    morphology, immunohistochemistry, Sanger or next-generation sequencing, RNA sequencing,
    expression microarray or methylation array. That is why the entry's central causal edge rests on
    the mutation and the two components being found in the same tumours, as the edge's own
    description says, and why the two hypothesis groups above cannot be separated experimentally on
    the evidence this entry holds. They are not rivals, as the neural-crest group records, so what a
    model would settle is which progenitor the driver acts in, not which group is right. The claim here is about this entry's cited set, which is what was
    searched; it is not a claim that no model exists anywhere.
- discussion_id: ems_ras_mutation_rate_spread
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#HRAS Hotspot Mutation
  - genetic#HRAS somatic activating mutations
  prompt: >-
    What share of ectomesenchymomas carries a RAS-pathway mutation, and why do the reported shares
    differ so widely between series?
  rationale: >-
    Four of the cited sources report a share: 6 of 7, 4 of 5, 2 of 2 and 3 of 17. No cited source
    compares them or offers a reason for the spread, and three of the four cannot be pooled with the
    others as they stand. The 17-case series does not say, in the abstract this entry cites, how many
    of its 17 were sequenced. Two of the four positives in the 5-case series are post-zygotic mosaic
    rather than tumour-restricted somatic events, so whether they belong in a somatic-mutation rate
    is a question in itself. And the numerators are not the same quantity: two of the four count HRAS
    alone where the others count any RAS-pathway mutation. The 2-of-2 report is two cases selected
    for a methylation study and is not a rate at all. The only between-series comparison in the cited
    set is between embryonal rhabdomyosarcoma series rather than between these, although one source
    does compare its own HRAS share with the RAS share of its age-matched rhabdomyosarcoma controls.
    Until a source states its own testing denominator, the entry records the figures and not a pooled
    rate. As with the model gap, the claim here is about this entry's cited set, which is what was
    searched.
  evidence:
  - reference: PMID:26872011
    reference_title: "Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With Embryonal Rhabdomyosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 6 of 7 (86%) MEMs harbored HRAS mutations, 4 with p.G13R mutation and 2 with p.Q61L.
    explanation: >-
      The highest reported share, from the seven-tumour series, with the two hotspots it found.
  - reference: PMID:40629179
    reference_title: "Somatic and mosaic HRAS mutations in pediatric malignant ectomesenchymoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4 out of 5 cases, mutations in HRAS typical for ME were detected.
    explanation: >-
      The second figure. Two of these four are the mosaic patients described elsewhere in this entry,
      which is why this series cannot simply be added to the somatic counts.
  - reference: PMID:42851199
    reference_title: "[Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation: an analysis of 17 cases]."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RAS mutations were detected in 3 cases (HRAS mutation in 1 case and NRAS mutations in 2 cases).
    explanation: >-
      The lowest figure, 3 of 17, and the only one in which NRAS outnumbers HRAS. The abstract does
      not say how many of the 17 were tested, so the denominator of this share is not stated.
  - reference: PMID:42504917
    reference_title: "DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal Rhabdomyosarcoma-Like Epigenetic Identity."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both tumors harbored RAS-pathway mutations (HRAS p.Gly13Arg; NRAS p.Gln61His).
    explanation: >-
      Two of two, and the clearest statement that the pathway rather than the gene is what recurs,
      since one tumour carried HRAS and the other NRAS. Two cases selected for a methylation study,
      so it is not a rate.
- discussion_id: ems_no_ras_directed_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Has any RAS-pathway-directed treatment been reported in this tumour, whose commonest driver is an
    activating HRAS mutation?
  rationale: >-
    No cited source names a MEK inhibitor, a farnesyltransferase inhibitor or any other
    RAS-pathway-directed drug in this tumour - not as given, not as proposed, and not as ruled out.
    Searching all nine cached records for MEK, trametinib, selumetinib, cobimetinib, farnesyl,
    tipifarnib, lonafarnib, inhibitor, targeted therapy and druggable returns no hit at all. The
    nearest thing in the cited set is a proposal to use the RAS pathway diagnostically, quoted below.
    So the gap is not that the literature
    reports a negative result; it is that the question appears not to have been asked in the cited
    set, while every treatment row in this entry is conventional chemotherapy, surgery or
    radiotherapy on a rhabdomyosarcoma protocol.
  evidence:
  - reference: PMID:42504917
    reference_title: "DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal Rhabdomyosarcoma-Like Epigenetic Identity."
    supports: NO_EVIDENCE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, our data support a close biological relationship between ectomesenchymoma and
      embryonal rhabdomyosarcoma and indicate that RAS-pathway testing and methylation profiling can
      significantly refine diagnostic precision.
    explanation: >-
      The only proposal in the cited set to act on the RAS pathway in this tumour, and it is
      diagnostic rather than therapeutic. Graded NO_EVIDENCE rather than left out, because it is the
      sentence a reader searching for pathway-directed treatment would otherwise take as the answer:
      a recommendation to test for a mutation says nothing about treating it. No `directness` is set,
      because an item that does not bear on the claim has no inferential distance from it to grade.
  - reference: PMID:36440693
    reference_title: "Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group experience."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients received chemotherapy according to rhabdomyosarcoma strategy, four had
      radiotherapy.
    explanation: >-
      What was actually given in the largest cooperative-group series in the cited set: a
      rhabdomyosarcoma protocol. The sentence records the treatment, not the absence of another.
notes: >-
  Nine sources are cited. Two of them, the genomic series and the WHO classification, are cached as
  full text; the other seven
  are cached as abstracts alone, which is why several claims are attributed to a named series rather
  than to the literature. None of them is a study of presentation: the phenotype rows record what
  the tumour is made of and where it sits, which is what the sources do report, and no cited source
  gives the symptom a child presents with.


  The series are kept apart rather than pooled. The two largest report very different fractions, and
  not of the same quantity: HRAS in 6 of 7 against any RAS-pathway mutation in 3 of 17. They also
  describe the neuroectodermal component differently: the larger series names neuroblastoma as the
  commonest, in 12 of 17, while the genomic series lists scattered ganglion cells, ganglioneuroma and
  ganglioneuroblastoma without ranking them, so the two cannot be compared on that axis. No paper
  discusses either difference. A five-case series
  found HRAS in 4, and a two-case methylation report found a RAS-pathway mutation in both, which is a
  count rather than a fraction. None of this settles the question, and it is enough that the dispute
  should not be described as two-sided. None of the four is treated here as a rate for the disease: the
  `ems_ras_mutation_rate_spread` gap records why, including an unstated testing denominator in the
  17-case series and two post-zygotic mosaic positives among the 4 of 5.
review_notes: >-
  Where this entity belongs is contested, and this entry takes no side on that nosological question
  beyond binding MONDO's own class. On the separate question of where the tumour starts it does take
  a position, in `mechanistic_hypotheses`, which records the myogenic reading as canonical and the
  neural-crest one as an alternative that is not exclusive of it.
  Contested is not the same as open: the current WHO classification has taken a side, and the third
  paragraph below records which.
  MONDO:0002855 has the parents sarcoma and nervous system cancer, not any rhabdomyosarcoma class, and
  carries the ICD-O morphology code ICDO:8921/3, which is why this is its own entry under the cancer granularity
  ladder rather than a subtype row on Embryonal_Rhabdomyosarcoma.


  The positions in the cached literature are these. The genomic series concludes a closer genetic
  link to rhabdomyosarcoma than to malignant peripheral nerve sheath tumour, on shared HRAS mutation,
  on unsupervised clustering that puts the two together and apart from every other sarcoma, and on a nerve
  sheath tumour signature that does not cluster with it at all. The same paper records that the WHO classification
  of soft tissue and bone tumours of the day placed the entity under nerve sheath tumours, and that a
  genomic study of a single intracranial case found an expression profile closer to malignant peripheral
  nerve sheath tumour. The larger series names the entity embryonal rhabdomyosarcoma with divergent neuroectodermal
  differentiation, which asserts the rhabdomyosarcoma placement in the title.


  The sixth edition of the WHO classification of soft tissue and bone tumours then went further than any
  of those: it removed ectomesenchymoma as a separate entity and recognises it as a subtype of embryonal
  rhabdomyosarcoma, under a name this entry already carried as a synonym. That is the current position
  of the field's own classification. The synonym list predates this citation and is not derived from
  it: of the three rhabdomyosarcoma-shaped synonyms here, only "divergent neuroectodermal
  differentiation" appears in the classification, while "heterologous neuroectodermal
  differentiation" and ERMS-HND come from the larger clinical series, whose own abstract uses those
  two throughout and reserves "divergent" for its title. It is recorded here
  as a controversy rather than acted on, for a reason that is about this repository rather than about the
  biology: MONDO:0002855 is live, is not filed under any rhabdomyosarcoma class, and is what this entry
  binds. Keeping a separate entry is therefore a decision taken against a current authority rather than in
  the absence of one, which is a different thing from the literature being unsettled, and a reader should
  know which of the two this is.


  Nothing is added to Embryonal_Rhabdomyosarcoma. A reader coming from that entry is a real
  concern, but the link belongs in its differential_diagnoses rather than in its has_subtypes: a
  pointer subtype would assert that ectomesenchymoma is a subtype of embryonal rhabdomyosarcoma.
  That is the placement the current WHO classification takes and the one MONDO has not followed, so
  adding the pointer would act on the WHO position while this entry's own binding still reflects
  MONDO's. Acting on it is a larger decision than recording it, and it belongs in whichever change
  settles the binding.

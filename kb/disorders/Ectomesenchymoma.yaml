name: Ectomesenchymoma
creation_date: '2026-11-11T20:30:00Z'
description: >-
  A rare biphasic sarcoma of infants and young children in which a rhabdomyosarcomatous mesenchymal component
  and a neuroectodermal component are intimately intermixed in one tumour. The mesenchymal half is almost
  always embryonal rhabdomyosarcoma; the neuroectodermal half runs the whole spectrum of neural crest
  differentiation, from neuroblastoma through ganglioneuroblastoma and ganglioneuroma to scattered mature
  ganglion cells and Schwann cell areas. The pelvic and genitourinary region is the commonest site in
  both cached series, though in the larger one it accounts for fewer than half the cases. How often a
  RAS pathway gene is mutated is unsettled: one series found HRAS in six of seven tumours, the other a
  RAS mutation in three of seventeen. Where the entity belongs nosologically is also unsettled; see review_notes.
categories:
- Pediatric Cancer
- Soft Tissue Sarcoma
- Sarcoma
parents:
- sarcoma
- nervous system cancer
synonyms:
- malignant ectomesenchymoma
- MEM
- embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation
- embryonal rhabdomyosarcoma with heterologous neuroectodermal differentiation
- ERMS-HND
disease_term:
  preferred_term: ectomesenchymoma
  term:
    id: MONDO:0002855
    label: ectomesenchymoma
pathophysiology:
- name: HRAS Hotspot Mutation
  description: >-
    An activating hotspot mutation in HRAS, found in six of the seven tumours of the cached genomic series.
    Four carried p.G13R and two p.Q61L. Transcriptome sequencing of its two index cases found no fusion
    gene, and instead recurrent HRAS and PTPRD hotspot mutations in both; what singled HRAS out was the
    screen across the remaining five tumours, in which no further PTPRD or FBXW7 mutation appeared.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: pluripotential neural crest remnant (ectomesenchyme)
    term:
      id: CL:0011012
      label: neural crest cell
  molecular_functions:
  - preferred_term: HRAS G protein switch activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003925
      label: G protein activity
  biological_processes:
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  genes:
  - preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  downstream:
  - target: Divergent Rhabdomyoblastic and Neuroectodermal Differentiation
    description: >-
      The one driver sits in a tumour that then differentiates two ways at once. No cached source demonstrates
      that the mutation causes the divergence; what they show is that both components share the tumour
      and that it carries the mutation.
    evidence:
    - reference: PMID:42504917
      reference_title: >-
        DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal
        Rhabdomyosarcoma-Like Epigenetic Identity.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Shared copy-number profiles across distinct histological regions supported a monoclonal origin.
      explanation: >-
        Regions of different histology shared their copy-number profile, which is what a single clone
        diverging into two lineages predicts. The authors say supported, not shown, and the abstract
        does not say which alterations were shared; the entry keeps their hedge. INDIRECT because a
        monoclonal origin is an inference step away from this edge's claim that the mutation precedes
        the divergence, and because it is two cases.
    - reference: PMID:42504917
      reference_title: >-
        DNA Methylation Profiling of Pediatric Ectomesenchymoma Supports Embryonal
        Rhabdomyosarcoma-Like Epigenetic Identity.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Methylation analysis, including microdissected components, consistently aligned ectomesenchymoma
        with the embryonal rhabdomyosarcoma superfamily, revealing a shared myogenic epigenetic program
        despite neural differentiation.
      explanation: >-
        Both components carry a myogenic epigenetic programme even where the tissue is neural, which
        says the divergence is a programme running on one lineage rather than two lineages meeting.
        INDIRECT because a methylation class is a classification result and the inference to divergence
        is a step beyond it.
    - reference: PMID:26872011
      reference_title: >-
        Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities
        With Embryonal Rhabdomyosarcoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Microscopically, the RMS and neuroectodermal components were intimately intermixed in all cases.
      explanation: >-
        The two components are intermixed in every case rather than being two collided tumours, which
        is what makes one driver's relation to both an open question rather than a category error.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 6 of 7 (86%) MEMs harbored HRAS mutations, 4 with p.G13R mutation and 2 with p.Q61L.
    explanation: The mutation and its frequency in the cached series, with the two hotspots named.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: No fusion candidate was identified in the 2 index cases by the FusionSeq algorithm.
    explanation: >-
      Excludes a fusion as the driver event. It does not by itself single out HRAS: the same paragraph
      reports PTPRD hotspot mutations in both index cases too, and it is the five-case screen in the next
      item that separates them.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No additional PTPRD or FBWX7 mutations were identified in the remaining MEM or the control RMSs.
    explanation: >-
      The screen that leaves HRAS as the recurrent event: neither of the two other mutations found in
      the index cases recurred in the remaining tumours.
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With
      Embryonal Rhabdomyosarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MEM nomenclature derives from its possible tumorigenesis from the pluripotential neural crest
      remnants, the so-called ectomesenchyme
    explanation: >-
      The source of the neural crest cell binding on this node. The paper presents the origin from pluripotential
      neural crest remnants as possible and as the derivation of the name, not as a finding, so the binding
      is a hypothesis this entry records rather than a demonstrated lineage.
  notes: >-
    The somatic call is the tumour-level one, and the series that first reported these mutations could
    not confirm it for every case: three of its four p.G13R mutations showed a nearly homozygous
    pattern and no normal DNA was available to establish whether they were germline. That same paper
    reports two things about Costello syndrome and they pull in opposite directions: the HRAS
    mutations seen in this tumour are different from the ones described in Costello syndrome, and
    Costello syndrome predisposes to both rhabdomyosarcoma and neuroblastoma, which are the two
    components of this tumour. The paper compares mutation spectra and does not exclude a germline
    variant; it says in the same sentence that no normal DNA was available. So a germline Costello
    allele is not what the observed spectrum points to, and it is not ruled out either. What the
    pattern does point to is reported elsewhere: in two children with a neurocutaneous phenotype the
    variant was
    present in healthy tissue as well as tumour, at differing allele fractions, which is
    post-zygotic mosaicism. A post-zygotic variant is still somatic, so the record's typing stands;
    what changes is that the untested cases have a named alternative to a tumour-restricted event,
    and it is not a germline syndrome. The molecular
    function is graded GAIN_OF_FUNCTION and the process INCREASED on purpose - a RAS hotspot substitution
    takes the switch outside its normal regulatory control, which is the qualitative claim, while what
    the cached series observes is a pathway running above normal. Neither cached source describes the
    hydrolysis defect itself, so nothing is asserted about it. The neural crest cell binding carries the
    entity's name rather than a demonstrated lineage; see the BACKGROUND evidence item above.
- name: Divergent Rhabdomyoblastic and Neuroectodermal Differentiation
  description: >-
    The defining event: one tumour running a skeletal muscle programme and a neural crest programme at
    once. The mesenchymal component was embryonal rhabdomyosarcoma in 16 of 17 tumours in the larger cached
    series and in all seven of the genomic one. The neuroectodermal component is not one thing - the same
    series found neuroblastoma, ganglioneuroma or ganglion cells, composite ganglioneuroblastoma and Schwann
    cell differentiation across its cases.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rhabdomyoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  - preferred_term: neuroblast
    term:
      id: CL:0002676
      label: neural crest derived neuroblast
  - preferred_term: ganglion cell
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: skeletal muscle cell differentiation
    term:
      id: GO:0035914
      label: skeletal muscle cell differentiation
  - preferred_term: neural crest cell differentiation
    term:
      id: GO:0014033
      label: neural crest cell differentiation
  downstream:
  - target: Rhabdomyosarcomatous Component
    description: >-
      The skeletal muscle arm of the divergence is what the rhabdomyosarcomatous half of the tumour
      is. The edge is constitutive rather than sequential: the differentiation programme and the
      component it produces are the same event described at two scales, and no cited source times
      one against the other.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42851199
      reference_title: >-
        [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
        divergent neuroectodermal differentiation: an analysis of 17 cases].
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: The mesenchymal component uniformly expressed desmin, MyoD1, and Myogenin.
      explanation: >-
        The myogenic transcription factors are expressed in every case, which is the differentiation
        programme of this edge's source node read out in the component it produces.
  - target: Neuroectodermal Component
    description: >-
      The neural crest arm of the same divergence. Unlike the muscle arm it does not settle on one
      cell type, which is why the component it produces is recorded as a spectrum rather than as a
      diagnosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42851199
      reference_title: >-
        [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
        divergent neuroectodermal differentiation: an analysis of 17 cases].
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The neuroectodermal component encompassed the spectrum of neural crest differentiation, including
        neuroblastoma in 12 cases, ganglioneuroma/ganglion cells in 2 cases, composite ganglioneuroblastoma
        in 1 case, and Schwann cell differentiation in 2 cases.
      explanation: >-
        Names the component as the span of neural crest differentiation, which is this edge: the
        source node is that differentiation and the target is what it leaves behind in the tumour.
  - target: Biphasic Intermixed Tumour Mass
    description: The two differentiating populations make up the mass that presents.
    evidence:
    - reference: PMID:26872011
      reference_title: >-
        Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities
        With Embryonal Rhabdomyosarcoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The diagnosis of MEM was confirmed by the presence of a biphasic tumor, with histologic evidence
        of RMS and neuroectodermal elements 6 , 9 .
      explanation: >-
        The mass is biphasic by definition here, which is the step from two differentiating populations
        to one tumour. Indirect for the edge: the sentence is a case-selection criterion rather than an
        observation that differentiation produced the mass.
  evidence:
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The mesenchymal component was predominantly embryonal rhabdomyosarcoma (ERMS, 16/17).

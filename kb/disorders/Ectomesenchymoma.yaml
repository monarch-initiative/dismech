    snippet: >-
      Malignant ectomesenchymoma (MEM) is an exceedingly rare pediatric sarcoma with a predilection for
      infants and young children and is composed of dual malignant mesenchymal and neuroectodermal components.
    explanation: The only statement of rarity in either cache.
notes: >-
  Neither cached source reports presenting symptoms, so this entry carries no phenotypes. The genomic
  series is cached as full text and the larger series as an abstract alone, which is why several claims
  are attributed to one of the two rather than to both.


  The two series are kept apart rather than pooled. They disagree on the RAS mutation rate (6 of 7 against
  3 of 17) and on the commonest neuroectodermal component (ganglioneuroma in the genomic series, neuroblastoma
  in the larger one). Neither paper discusses either difference.
review_notes: >-
  Where this entity belongs is unsettled, and this entry takes no side beyond binding MONDO's own class.
  MONDO:0002855 has the parents sarcoma and nervous system cancer, not any rhabdomyosarcoma class, and
  carries the ICD-O morphology code ICDO:8921/3, which is why this is its own entry under the cancer granularity
  ladder rather than a subtype row on Embryonal_Rhabdomyosarcoma.


  The three positions in the cached literature are these. The genomic series concludes a closer genetic
  link to rhabdomyosarcoma than to malignant peripheral nerve sheath tumour, on shared HRAS mutation,
  on unsupervised clustering that puts the two together and apart from every other sarcoma, and on a nerve
  sheath tumour signature that does not cluster with it at all. The same paper records that the WHO classification
  of soft tissue and bone tumours of the day placed the entity under nerve sheath tumours, and that a
  genomic study of a single intracranial case found an expression profile closer to malignant peripheral
  nerve sheath tumour. The larger series names the entity embryonal rhabdomyosarcoma with divergent neuroectodermal
  differentiation, which asserts the rhabdomyosarcoma placement in the title.


  A pointer subtype on Embryonal_Rhabdomyosarcoma carries curated_in for this entry, so a reader of that
  entry still finds this one. The pointer is a separate PR, after this entry merges.

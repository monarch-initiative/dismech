    explanation: >-
      The neuroectodermal half and its range, which is why this node binds a neuron and a Schwann cell
      rather than one lineage.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with
      divergent neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The mesenchymal component uniformly expressed desmin, MyoD1, and Myogenin.

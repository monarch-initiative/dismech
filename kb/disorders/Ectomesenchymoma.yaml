    explanation: The test and its result in the genomic series.
  - reference: PMID:42851199
    reference_title: >-
      [Clinicopathological and molecular genetic characteristics of embryonal rhabdomyosarcoma with divergent
      neuroectodermal differentiation: an analysis of 17 cases].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The tumor cells were all negative for FOXO1, PAX3 and PAX7.

progression:
- phase: Metastatic disease at diagnosis
  notes: >-
    The clearest adverse factor in the cited series, and the only one on which two cooperative
    groups agree. Neither states that its cohort is disjoint from the other's, and both are European
    registries of overlapping eras, so read the agreement as two reports rather than as two
    independent samples. In the German series the one patient with metastatic disease was the only
    one who died; in the European series the patient with an initially metastatic tumour was likewise the
    only death. Both are single patients, so this is a consistent direction across small series rather
    than a measured hazard.
  evidence:
  - reference: PMID:22535600
    reference_title: >-
      Malignant ectomesenchymoma in children and adolescents: report from the Cooperative
      Weichteilsarkom Studiengruppe (CWS).
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individual with metastatic MEM did not survive, but all five patients with localized MEM are
      currently alive in CR with a median follow-up of 5 years (range: 2.1-13.7).
    explanation: >-
      One metastatic patient, who died, against five localized ones alive in complete remission at a
      median of five years. The denominators are what keep this a direction rather than a rate.
  - reference: PMID:36440693
    reference_title: >-
      Malignant ectomesenchymoma in children: The European pediatric Soft tissue sarcoma Study Group
      experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, six patients were alive in first remission, two in second remission and one after second
      tumor. Only the patient with initially metastatic tumor died of disease.
    explanation: >-
      The same pattern in a second group of ten: nine alive, and the one death was the initially
      metastatic patient. Two series agreeing on which patient died is the reason this phase is
      recorded at all; neither says whether its patients overlap the other's.
- phase: Relapse and long-term survival
  notes: >-
    The two outcome figures from the Chinese single-centre series read oddly together and should be
    quoted together: five-year overall survival 79% against event-free survival 14%. Most children
    were alive at five years, and most had had an event before then. No cited source states why for
    that cohort, but the pattern that produces such a gap - relapse followed by survival after
    salvage - is reported in both European series, which between them record two patients alive in
    second remission and three recurrences in a group where every localized patient survived.
    Neither European series' cached abstract gives an event-free survival figure to compare, so the
    pair is recorded as one series' numbers rather than as the entity's prognosis.
  evidence:
  - reference: PMID:40221922
    reference_title: >-
      A single-center retrospective study of malignant ectomesenchymoma in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year overall survival rate was 79%, while the event-free survival rate was 14%.
    explanation: >-
      Both rates from eleven children at one centre. The row quotes them as a pair because either alone
      misleads: 79% reads as a good outcome and 14% as a bad one, and they are the same cohort.
- phase: Follow-up after treatment
  duration: median 5.4 years
  notes: >-
    Six of the seven patients in the cached genomic series had follow-up and none recurred or metastasised
    over a median of 5.4 years. That is seven patients from two institutions, so it describes that series
    and is not a prognosis for the entity.
  evidence:
  - reference: PMID:26872011
    reference_title: >-
      Frequent HRAS Mutations in Malignant Ectomesenchymoma: Overlapping Genetic Abnormalities With

  description: >-
    Counsel on the 50% transmission probability from a heterozygous affected
    parent per pregnancy, and on the complete penetrance observed in the
    founding kindred -- unlike many other, incompletely penetrant DFNA loci,
    essentially all gene-carriers in this family were eventually affected.
    Because no causal gene is cloned, predictive testing in a new family
    would rely on linkage/segregation analysis rather than a direct variant
    test, and is only informative in a sufficiently large, multigenerational
    pedigree.

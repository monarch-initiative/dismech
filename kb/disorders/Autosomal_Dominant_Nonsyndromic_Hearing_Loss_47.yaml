genetic:
- name: DFNA47 locus (9p21-22) -- causal gene not identified
  notes: >-
    No causal gene has been cloned for DFNA47 despite the locus having been
    mapped by linkage analysis in 2003 (multipoint LOD 4.26; a critical
    interval of approximately 9 cM flanked by markers D9S268 and D9S942,
    with peak two-point LOD 3.67 at marker D9S162). MYO1A, a
    cochlear-expressed unconventional myosin gene reported in 2003 to carry
    multiple mutations in Italian hearing-loss patients, is NOT the DFNA47
    gene: MYO1A maps to the separate DFNA48 locus (15q22-q25), and its
    proposed association with nonsyndromic deafness has itself since been
    refuted by an independent genotypic-ascertainment study that found no
    bilateral moderate-or-greater sensorineural hearing loss among carriers
    of the implicated MYO1A variants. This entry should not be bound to
    MYO1A. A separate recessive locus, DFNB83, was mapped to 9p23-p21.2 in a
    consanguineous Palestinian family and overlaps the DFNA47 cytogenetic
    band; whether the two represent allelic disorders of one still-uncloned
    gene is an unconfirmed hypothesis based only on the two loci's
    proximity, not a demonstrated fact -- no shared causal variant has been
    published for either locus.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:12634859
    reference_title: "A new locus (DFNA47) for autosomal dominant non-syndromic inherited hearing loss maps to 9p21-22 in a large Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A maximum lod score of 3.14 was obtained with marker D9S157 (at theta=0) after a genome wide search. The study of additional markers allowed us to confirm this region with positive lod scores of 3.58 (at theta=0 from D9S285) and of 3.67 (at theta=0 from D9S162). Recombinants define a region of approximately 9 cM flanked by markers D9S268 and D9S942. Multipoint linkage analysis showed a Lod score of 4.26."
    explanation: The founding linkage evidence establishing the 9p21-22 locus and its critical interval.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:12634859
    reference_title: "A new locus (DFNA47) for autosomal dominant non-syndromic inherited hearing loss maps to 9p21-22 in a large Italian family."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Few known genes map to the region, and those possibly related by function to hearing are being screened for disease-causing mutations."
    explanation: >-
      The founding paper itself had not identified a causal gene at
      publication; no subsequent report has done so either.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA47 | 9p21-p22 | Unknown | Unknown. | Adulthood (2nd-3rd decade) | Sloping | Progressive | HL is initially limited to high frequencies but progressively involves all frequencies, reaching the moderate-to-severe range by the 5th decade of life"
    explanation: >-
      A 2023 comprehensive narrative review's own summary table
      independently reconfirms, two decades after the original mapping,
      that DFNA47's gene remains unknown, and corroborates the founding
      family's audiometric natural history from a second source.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:12736868
    reference_title: "Multiple mutations of MYO1A, a cochlear-expressed gene, in sensorineural hearing loss."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "MYO1A, which is located within the DFNA48 locus, is the first myosin I family member found to be involved in causing deafness and may be a major contributor to autosomal dominant-hearing loss."
    explanation: >-
      The paper's own text places MYO1A within DFNA48, a different locus
      from DFNA47; cited to document why MYO1A must not be bound as this
      entry's causal gene.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27759032
    reference_title: "A genotypic ascertainment approach to refute the association of MYO1A variants with non-syndromic deafness."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the participants had bilateral sensorineural hearing loss of moderate or greater severity. These data do not support a causal relationship of variants in MYO1A to sensorineural hearing loss."
    explanation: >-
      An independent genotypic-ascertainment study refutes the proposed
      MYO1A-deafness association entirely, reinforcing that MYO1A is not a
      usable candidate gene for any DFNA locus, including DFNA47.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:19888295
    reference_title: "Five novel loci for inherited hearing loss mapped by SNP-based homozygosity profiles in Palestinian families."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "In six families, we identified five genomic regions likely to harbor novel genes for human hearing loss on chromosomes 1p13.3 (DFNB82), 9p23-p21.2/p13.3-q21.13 (DFNB83), 12q14.3-q21.2 (DFNB84; two families), 14q23.1-q31.1, and 17p12-q11.2 (DFNB85)."
    explanation: >-
      Reports the recessive DFNB83 locus at 9p23-p21.2, cytogenetically
      overlapping the DFNA47 interval; cited only for the locus mapping
      itself. The abstract does not claim allelism with DFNA47, and none is
      asserted here beyond the cytogenetic proximity.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
diagnosis:
- name: Audiometric and Exclusion-Based Genetic Diagnosis
  description: >-
    Because no causal gene is known, there is no positive molecular test for
    "DFNA47." Diagnosis rests on the clinical/audiometric pattern (autosomal
    dominant, postlingual, progressive, high-frequency-first bilateral
    sensorineural hearing loss with no syndromic features), combined with a
    comprehensive hearing-loss gene panel or exome/genome sequencing to
    exclude the more than 100 known nonsyndromic deafness genes, and, where a
    sufficiently large and informative pedigree exists, linkage/segregation
    analysis to the 9p21-22 interval. A diagnosis of DFNA47 in an isolated
    case or small family is not currently possible on genetic grounds alone.
  evidence:
  - reference: PMID:12634859
    reference_title: "A new locus (DFNA47) for autosomal dominant non-syndromic inherited hearing loss maps to 9p21-22 in a large Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Few known genes map to the region, and those possibly related by function to hearing are being screened for disease-causing mutations."
    explanation: >-
      Confirms that even candidate-gene screening within the mapped interval
      had not yielded a causal gene at the time of the founding report.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

name: Autosomal Dominant Nonsyndromic Hearing Loss 47
category: Mendelian
creation_date: "2026-09-24T00:00:00Z"
synonyms:
- DFNA47
- deafness, autosomal dominant 47
- autosomal dominant nonsyndromic deafness type 47
- autosomal dominant nonsyndromic deafness 47
description: >-
  DFNA47 is a mapped-but-gene-unidentified locus (9p21-22) for autosomal
  dominant, postlingual, progressive, nonsyndromic sensorineural hearing
  loss, reported in a single large Italian kindred in 2003. No causal gene
  has been cloned in the two decades since. This entry is deliberately
  narrow: it records the locus mapping, the clinical/audiometric natural
  history reported in the founding family, and why the candidate gene MYO1A
  is excluded (MYO1A is the gene for a different locus, DFNA48, and its
  disease association has itself since been refuted) rather than attributing
  a molecular mechanism, cell type, or targeted treatment the literature
  does not support.
disease_term:
  preferred_term: autosomal dominant nonsyndromic hearing loss 47
  term:
    id: MONDO:0012090
    label: autosomal dominant nonsyndromic hearing loss 47
parents:
- Autosomal Dominant Nonsyndromic Hearing Loss
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant with complete penetrance in the single reported
    Italian kindred -- a notable feature relative to most other adult-onset
    DFNA loci, which more commonly show age-dependent incomplete penetrance.
    A heterozygous affected parent has a 50% probability of transmitting the
    disease haplotype per pregnancy.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:12634859
    reference_title: "A new locus (DFNA47) for autosomal dominant non-syndromic inherited hearing loss maps to 9p21-22 in a large Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the mapping of a novel locus for autosomal dominant non-syndromic hearing loss, DFNA47, to chromosome 9p21-22 in a large multigenerational Italian family with progressive hearing impairment."
    explanation: >-
      Establishes the dominant mode of transmission and the founding
      linkage mapping to the 9p21-22 locus.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
pathophysiology:
- name: Progressive Cochlear Dysfunction at an Unidentified Molecular Target
  description: >-
    No causal gene, transcript, or protein has been identified for DFNA47
    despite the locus having been mapped by linkage analysis in 2003, so no
    molecular pathway, cellular process, or protein-level mechanism can be
    attributed to it. The only mechanistic inference available is drawn from
    the clinical audioprofile itself: hearing loss in the founding family
    began after the teenage years and progressed gradually to a
    moderate-to-severe loss, a pattern generally associated in other,
    better-characterized dominant progressive sensorineural hearing loss
    genes with basal (high-frequency-encoding) cochlear injury spreading
    apically over time. This is pattern-matching drawn from the phenotype
    alone, not a demonstrated cochlear-cell-biology finding specific to this
    locus, and no histopathological or model-organism data exist to test it.
  biological_scale: TISSUE
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  downstream:
  - target: Progressive Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The causal chain from the unidentified 9p21-22 variant to hearing
      loss is entirely inferred; no intermediate molecular or cellular step
      has been demonstrated for this locus.
  evidence:
  - reference: PMID:12634859
    reference_title: "A new locus (DFNA47) for autosomal dominant non-syndromic inherited hearing loss maps to 9p21-22 in a large Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals noticed hearing impairment after their teens with subsequent gradual progression to a moderate-severe loss. There were no obvious vestibular dysfunction and other associated abnormalities."
    explanation: >-
      The clinical natural history is the only evidence available for this
      node, in the absence of any molecular or cellular data.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  mechanism_confidence: HYPOTHETICAL
phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral, postlingual, progressive sensorineural hearing loss, first
    noticed after the teenage years in the founding Italian kindred, with
    gradual progression to a moderate-to-severe loss. No vestibular
    dysfunction or other systemic abnormality is present; hearing is the
    sole affected domain, consistent with a nonsyndromic classification.

name: Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome 2
creation_date: "2026-09-13T00:00:00Z"
category: Mendelian
synonyms:
- MMIHS2
- MYH11-related megacystis-microcolon-intestinal hypoperistalsis syndrome
- autosomal recessive MMIHS
- MYH11-related visceral myopathy
- Berdon syndrome, MYH11-related
description: >-
  Megacystis-microcolon-intestinal hypoperistalsis syndrome 2 (MMIHS2) is the
  autosomal recessive, MYH11-related form of MMIHS. MYH11 encodes smooth muscle
  myosin heavy chain, the motor of the visceral smooth muscle contractile
  apparatus. Biallelic loss-of-function alleles leave bladder and bowel smooth
  muscle unable to generate force, so both hollow organs fail functionally while
  remaining anatomically patent: a hugely distended bladder with no outlet
  obstruction, an unused and therefore microscopic colon, and intestine that does
  not propel.

  MMIHS as a clinical syndrome is genetically heterogeneous. Most cases are
  dominant and caused by de novo ACTG2 variants; the recessive forms implicate
  LMOD1, MYLK, MYL9, MYH9 and MYH11. What these genes share is the contractile
  apparatus, which is the evidence for a myopathic rather than a neuropathic basis
  for the syndrome. This entry covers the MYH11 form specifically.

  Two things make the MYH11 form worth curating in its own right. First, MYH11 is
  already a disease gene for thoracic aortic aneurysm and dissection - but through
  dominant-negative missense alleles, not biallelic nulls. The same gene produces
  a vascular disease one way and a visceral disease the other, which is a
  statement about how the lesion works rather than about which organ the gene is
  expressed in. Second, the severity is allele-dependent in a legible way: a
  hypomorphic allele in trans with a whole-gene deletion has produced a
  visceral myopathy presenting in adulthood rather than the neonatal syndrome.

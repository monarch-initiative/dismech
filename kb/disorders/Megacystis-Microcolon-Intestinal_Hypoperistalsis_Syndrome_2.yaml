    explanation: Cohort frequency for rotational anomalies alongside the other structural and hepatobiliary complications.
- category: Renal
  name: Hydronephrosis and renal dysplasia
  description: >-
    Upper tract changes secondary to the failing bladder. In the late-onset family one
    sibling reached end-stage kidney disease.
  phenotype_term:
    preferred_term: Hydronephrosis
    term:
      id: HP:0000126
      label: Hydronephrosis
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other features may also be present, including omphalocele and umbilical hernia, hydronephrosis and renal dysplasia, maldevelopment of the abdominal musculature and abdominal laxity (the so-called prune belly abnormality)"
    explanation: Lists hydronephrosis and renal dysplasia among the syndrome's associated features.
- category: Musculoskeletal
  name: Prune belly phenotype
  description: >-
    Deficient abdominal wall musculature with abdominal laxity, present in the index
    MYH11 case. Notably, sequencing MYH11 in twenty cases of isolated prune belly
    syndrome found no variants, so this is a feature of MMIHS rather than evidence
    that MYH11 causes prune belly syndrome generally.
  phenotype_term:
    preferred_term: Abdominal distention
    term:
      id: HP:0003270
      label: Abdominal distention
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A classic prune belly (MIM 100100) phenotype was noted at birth."
    explanation: Records the abdominal wall phenotype in the index patient.
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of the MYH11 sequence of 3 additional cases with MMIHS and of 20 cases with prune belly syndrome did not reveal any splicing, truncating or novel nonsynonymous variants."
    explanation: >-
      Evidence against MYH11 being a general cause of prune belly syndrome, and against
      it being a common cause of MMIHS - three further MMIHS cases were also negative.
- category: Ophthalmological
  name: Tonically dilated pupil with accommodation deficit
  description: >-
    Iris and ciliary smooth muscle are smooth muscle too. One patient with biallelic
    MYH11 loss had a tonically dilated pupil and an accommodation deficit alongside
    growth hormone deficiency and central hypothyroidism, which led the authors to
    describe the presentation as multisystemic smooth muscle dysfunction rather than a
    two-organ syndrome.
  phenotype_term:
    preferred_term: Tonic pupil
    term:
      id: HP:0012074
      label: Tonic pupil
  evidence:
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a girl with MMIHS in addition to growth hormone deficiency, central hypothyroidism and a tonically dilated pupil with accommodation deficit."
    explanation: >-
      The extended phenotype in a genotyped patient. This is a single case, so the
      endocrine features in the same sentence are not curated as separate phenotypes.
genetic:
- name: MYH11
  association: Causal
  gene_term:
    preferred_term: MYH11
    term:
      id: hgnc:7569
      label: MYH11
  notes: >-
    Biallelic loss-of-function MYH11 variants cause the recessive form of MMIHS.
    Reported alleles include homozygous c.3598A>T (p.Lys1200Ter) in a consanguineous
    Algerian family, compound heterozygous c.2051G>A (p.R684H) and
    c.3540_3541delinsTT in a Chinese family, a 1.3 Mb 16p13.11 deletion encompassing
    MYH11 in trans with c.379C>T (p.Pro127Ser), and a 1.2 Mb deletion in trans with
    the in-frame c.2578_2580del (p.Glu860del) in the late-onset family. Two of the
    four involve a copy-number event, so sequencing alone can miss the diagnosis and
    copy-number analysis is needed alongside it. MYH11 accounted for 2 of 19
    molecularly diagnosed patients in the largest contemporary cohort, behind ACTG2.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All together, these observations strongly suggest that loss-of-function variants in MYH11 cause MMIHS."
    explanation: The causal claim for MYH11 in this disease.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTG2 (15/19) was the most common causative gene variant, followed by MYH11 (2/19), MYLK (1/19), and LMOD1 (1/19)."
    explanation: Places MYH11's contribution in the context of the syndrome's genetic heterogeneity.
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we recommend genetic testing both for MYH11 sequence alterations and copy number imbalances in individuals with MMIHS and smooth muscle cell-associated abnormalities in additional organs, that is, multisystemic smooth muscle dysfunction."
    explanation: The testing recommendation that follows from copy-number events being a common half of the genotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    762 cases of MMIHS as a whole reported in the literature between 1976 and 2023,
    predominantly as case reports. This is the syndrome-level figure across all
    causative genes, not the MYH11 subset, which is a small minority of it.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the first description of MMIHS in five female neonates in 1976 by Berdon et al., only 762 cases have been reported predominantly in case reports worldwide (1976–2023)."
    explanation: The cumulative reported case count and the period it covers.
histopathology:
- name: Normal or non-specific intestinal histopathology
  description: >-
    A negative finding with real diagnostic weight. Intestinal tissue from patients with
    MYH11-variant visceral myopathy shows nothing diagnostic: routine histology and
    electron microscopy find only non-specific changes attributable to distension, and
    immunohistochemistry against a panel of smooth muscle proteins including MYH11 is
    indistinguishable from controls.

    Two things follow. Clinically, tissue is often taken before mutational analysis, so
    a normal biopsy is the expected result in this disease and does not exclude it -
    the authors' own recommendation is to go to molecular genetics when pseudo-obstruction
    has normal or non-specific pathology. Mechanistically, MYH11 immunoreactivity being
    preserved says the defect is functional rather than one of protein absence in these
    patients, which sits alongside the Western blot showing reduced protein in a
    different patient and is not obviously reconcilable with it. Both are recorded.
  finding_term:
    preferred_term: normal muscularis propria morphology and smooth muscle immunophenotype
  evidence:
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apart from non-specific changes (e.g., muscle hypertrophy and distension-related muscularis propria necrosis), no alterations were identified by routine histopathological evaluation or electron microscopy."
    explanation: The primary negative result across light microscopy and electron microscopy.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry with antibodies against a battery of smooth muscle proteins, including MYH11, revealed indistinguishable patterns of immunoreactivity in the muscularis propria of both patients and controls."
    explanation: >-
      MYH11 immunoreactivity is preserved, which is the finding that makes the biopsy
      non-diagnostic and which bears on whether the lesion is loss of protein or loss of
      function.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathic morphological or immunohistochemical changes may not be present in intestinal specimens from patients with MYH11-variant visceral myopathy."
    explanation: The authors' conclusion, which is the one a pathologist reporting such a specimen needs.
diagnosis:
- name: Prenatal ultrasonography
  description: >-
    Megacystis is detected prenatally in essentially every case, typically with
    polyhydramnios or normal amniotic fluid volume - which distinguishes it from
    obstructive megacystis, where oligohydramnios is the rule. Fetal urine biochemistry
    helps separate MMIHS from posterior urethral valves.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common prenatal finding of MMIHS is a large, progressive distended bladder associated with polyhydramnios or normal amniotic fluid volume detected by ultrasonography."
    explanation: The prenatal sonographic picture and the amniotic fluid finding that distinguishes it from obstruction.
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal urine biochemical markers can be helpful for the differentiation of MMIHS from posterior urethral valves or other megacystis"
    explanation: The adjunct that separates a functional from an obstructive cause of fetal megacystis.
- name: Sequencing with parallel copy-number analysis
  description: >-
    Molecular diagnosis needs both. Two of the four reported MYH11 genotypes involve a
    whole-gene deletion in trans with a point variant, so a sequencing-only workflow
    sees a single heterozygous variant and stops.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing and arrayCGH uncovered the novel heterozygous missense variant c.379C>T in MYH11 and a heterozygous 1.3 Mb deletion in 16q13.11 encompassing MYH11, respectively."
    explanation: >-
      The two-technology diagnosis, showing that each method found only half the
      genotype. Quoted as written; the source says 16q13.11 here and 16p13.11 in its
      title.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic studies should be considered for patients with chronic intestinal pseudo-obstruction and normal or non-specific pathology findings."
    explanation: >-
      The reason genetics rather than tissue is the diagnostic route here: a normal
      biopsy is the expected result and does not argue against the diagnosis.
treatments:
- name: Parenteral Nutrition and Ostomy
  description: >-
    The mainstay, and not a benign one. Eighty-five per cent of patients in the
    largest cohort required both, and the authors identify them as key determinants of
    unfavourable outcome rather than as neutral support - intestinal-failure-associated
    liver disease reached 58 per cent and cholelithiasis 65 per cent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: total parenteral nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Intestinal Hypoperistalsis and Microcolon
    description: >-
      Parenteral nutrition bypasses the failed bowel rather than improving it, so it
      acts on the consequence of the hypoperistalsis node and not on the node itself.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients experienced clinical (sub)ileus, with 85% requiring ostomy and parenteral nutrition, key determinants of unfavorable outcome."
    explanation: >-
      Both the frequency of the intervention and the authors' judgement that needing it
      marks a worse course.
- name: Multivisceral Transplantation
  description: >-
    Offered to survivors who cannot be maintained on parenteral nutrition. It replaces
    the diseased smooth muscle organs, which is the only intervention in this entry
    that addresses the contractile failure at all - by removing the tissue that cannot
    contract.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Failure of Visceral Smooth Muscle Contraction
    description: >-
      Transplantation substitutes tissue with a functioning contractile apparatus for
      tissue without one.
  evidence:
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, there is no specific treatment for MMIHS, and management for affected newborns remains a challenge for doctors and parents. The survivors were either maintained by TPN or had undergone multivisceral transplantation."
    explanation: >-
      States both the absence of disease-specific therapy and the two routes open to
      survivors.
notes: >-
  Scope. This entry covers the MYH11 form of MMIHS, which is what MONDO:0025708
  names. MMIHS as a clinical syndrome is genetically heterogeneous - dominant ACTG2
  accounts for most cases, with recessive LMOD1, MYLK, MYL9, MYH9 and MYH11 making up
  the rest - and several statements curated here (cohort frequencies, the 762 reported
  cases, the management data) are syndrome-level rather than MYH11-specific. Each is
  flagged as such in its own notes or explanation. The mechanistic chain, by contrast,
  is MYH11-specific from the gene lesion down to the contractile failure node, where
  it converges with the other genes.

  Relationship to the MYH11 aortic entries. MYH11 appears on main in
  Familial_Thoracic_Aortic_Aneurysm_and_Aortic_Dissection and related entries, and as
  the fusion partner in CBFB-MYH11 acute myeloid leukemia. None of those is the same
  disease as this one, and the first is the subject of a mechanistic_hypotheses block
  here because the allelic mechanism dichotomy between them is a substantive open
  question rather than a curation artefact.

  On copy-number variants. Two of the four reported MYH11 genotypes pair a point
  variant with a whole-gene deletion. Any diagnostic workflow that does not look for
  copy-number change will report these patients as heterozygous carriers, which is the
  practical reason the diagnosis section carries a separate entry for it.

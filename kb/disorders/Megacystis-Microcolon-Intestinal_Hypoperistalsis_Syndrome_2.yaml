    preferred_term: Hydronephrosis
    term:
      id: HP:0000126
      label: Hydronephrosis
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other features may also be present, including omphalocele and umbilical hernia, hydronephrosis and renal dysplasia, maldevelopment of the abdominal musculature and abdominal laxity (the so-called prune belly abnormality)"
    explanation: Lists hydronephrosis among the syndrome's associated features.
- category: Renal
  name: Renal dysplasia
  description: >-
    Curated separately from the hydronephrosis above because the two are different
    claims. Hydronephrosis is obstructive back-pressure on a normally formed kidney;
    dysplasia is abnormal renal development. Both appear in the same list of associated
    features and the sources do not separate which patients had which, so the split is
    made here on the concepts rather than on a cohort.
  phenotype_term:
    preferred_term: Renal dysplasia
    term:
      id: HP:0000110
      label: Renal dysplasia
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hydronephrosis and renal dysplasia, maldevelopment of the abdominal musculature and abdominal laxity"
    explanation: Names renal dysplasia among the associated features.
- category: Musculoskeletal
  name: Prune belly phenotype
  description: >-
    Deficient abdominal wall musculature with abdominal laxity, present in the index
    MYH11 case. Notably, sequencing MYH11 in twenty cases of isolated prune belly
    syndrome found no variants, so this is a feature of MMIHS rather than evidence
    that MYH11 causes prune belly syndrome generally.
  phenotype_term:
    preferred_term: Deficient abdominal wall musculature
    term:
      id: HP:0010318
      label: Aplasia/Hypoplasia of the abdominal wall musculature
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A classic prune belly (MIM 100100) phenotype was noted at birth."
    explanation: Records the abdominal wall phenotype in the index patient.
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of the MYH11 sequence of 3 additional cases with MMIHS and of 20 cases with prune belly syndrome did not reveal any splicing, truncating or novel nonsynonymous variants."
    explanation: >-
      Evidence against MYH11 being a general cause of prune belly syndrome, and against
      it being a common cause of MMIHS - three further MMIHS cases were also negative.
- category: Ophthalmological
  name: Tonically dilated pupil with accommodation deficit
  description: >-
    Iris and ciliary smooth muscle are smooth muscle too. One patient with biallelic
    MYH11 loss had a tonically dilated pupil and an accommodation deficit alongside
    growth hormone deficiency and central hypothyroidism, which led the authors to
    describe the presentation as multisystemic smooth muscle dysfunction rather than a
    two-organ syndrome.
  phenotype_term:
    preferred_term: Tonic pupil
    term:
      id: HP:0012074
      label: Tonic pupil
  evidence:
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a girl with MMIHS in addition to growth hormone deficiency, central hypothyroidism and a tonically dilated pupil with accommodation deficit."
    explanation: >-
      The extended phenotype in a genotyped patient. This is a single case, so the
      endocrine features in the same sentence are not curated as separate phenotypes.
genetic:
- name: MYH11
  association: Causal
  gene_term:
    preferred_term: MYH11
    term:
      id: hgnc:7569
      label: MYH11
  notes: >-
    Biallelic loss-of-function MYH11 variants cause the recessive form of MMIHS.
    Reported alleles include homozygous c.3598A>T (p.Lys1200Ter) in a consanguineous
    Algerian family, compound heterozygous c.2051G>A (p.R684H) and
    c.3540_3541delinsTT in a Chinese family, a 1.3 Mb 16p13.11 deletion encompassing
    MYH11 in trans with c.379C>T (p.Pro127Ser), and a 1.2 Mb deletion in trans with
    the in-frame c.2578_2580del (p.Glu860del) in the late-onset family. Two of the
    four involve a copy-number event, so sequencing alone can miss the diagnosis and
    copy-number analysis is needed alongside it. MYH11 accounted for 2 of 19
    molecularly diagnosed patients in the largest contemporary cohort, behind ACTG2.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All together, these observations strongly suggest that loss-of-function variants in MYH11 cause MMIHS."
    explanation: The causal claim for MYH11 in this disease.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTG2 (15/19) was the most common causative gene variant, followed by MYH11 (2/19), MYLK (1/19), and LMOD1 (1/19)."
    explanation: Places MYH11's contribution in the context of the syndrome's genetic heterogeneity.
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we recommend genetic testing both for MYH11 sequence alterations and copy number imbalances in individuals with MMIHS and smooth muscle cell-associated abnormalities in additional organs, that is, multisystemic smooth muscle dysfunction."
    explanation: The testing recommendation that follows from copy-number events being a common half of the genotype.
epidemiology:
- name: Female predominance
  description: >-
    Roughly seven in ten reported MMIHS patients are female, and the figure is stable
    across independent systematic reviews two decades apart: 70.6 per cent of 227 cases
    reviewed to 2011, 73 per cent of 121 to 2016, and 16 of 19 in the Japanese national
    survey. Berdon's original 1976 description was of five female neonates.

    This is a syndrome-level figure across all causative genes, not a MYH11-specific
    one, and it is drawn from published case reports rather than from a population
    denominator, so ascertainment bias cannot be excluded. It is recorded because a
    skew this large and this reproducible is not what an autosomal recessive mechanism
    predicts; the open question that raises is curated in `discussions`.
  minimum_value: 70.6
  maximum_value: 84.2
  unit: percent of reported cases that are female
  evidence:
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clear preponderance for female infants was found (female 70.6 vs. male 29.4%)."
    explanation: The largest systematic review, covering 227 cases from 1976 to 2011.
  - reference: PMID:27421821
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: Case series and updated review of the literature with an emphasis on urologic management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "73% (88/121) of the patients were female, 65% underwent diagnostic biopsy (64/99), and 63% (66/106) were identified with prenatal imaging."
    explanation: An independent review over a later period, reproducing the skew.
  - reference: PMID:26413901
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: A report of a nationwide survey in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 28 patients registered as having a certain diagnosis of MMIHS, 19 (male/female, 3/16) patients were analyzed."
    explanation: >-
      A national survey rather than a literature review, so it is not subject to the same
      publication bias, and it reproduces the skew at 16 of 19.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the first description of MMIHS in five female neonates in 1976 by Berdon et al."
    explanation: The original description was of five female neonates, which is where the observation starts.
- name: Reported survival
  description: >-
    Survival figures for MMIHS range widely and the range is the honest statement.
    The oldest and largest systematic review reported 19.7 per cent of 218 patients
    surviving; the Japanese national survey reported 63 per cent at five years and 57
    per cent at ten; a later literature review reported 57 per cent; and a recent
    26-patient cohort reported 88 per cent. The trend is real - parenteral nutrition,
    intestinal rehabilitation and transplantation have improved outcomes, and patients
    now live into the second decade - but the highest figure comes from the smallest
    and most recent series and should not be read as the expected outcome.
  minimum_value: 19.7
  maximum_value: 88.0
  unit: percent surviving
  notes: >-
    All syndrome-level, across causative genes. The denominators differ (218, 19, 121,
    26) and so do the follow-up intervals, so these are not directly comparable.
  evidence:
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival rate was 19.7% (survivors: n = 43, non-survivors: n = 175), the oldest survivor being 24 years old."
    explanation: The lowest and largest-denominator figure, covering 1976 to 2011.
  - reference: PMID:26413901
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: A report of a nationwide survey in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The five- and ten-year survival rates were 63% and 57%, respectively."
    explanation: Time-anchored survival from a national survey, which the other figures are not.
  - reference: PMID:27421821
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: Case series and updated review of the literature with an emphasis on urologic management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The survival rate was 57% (68/121)."
    explanation: An intermediate figure from a 1996-2016 review.
  - reference: PMID:41591435
    reference_title: "Imaging of megacystis-microcolon-intestinal hypoperistalsis syndrome before, during, and after the neonatal period: a pictorial review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Historically associated with a poor prognosis, recent advances in the use of total parenteral nutrition (TPN), intestinal rehabilitation, and multi-visceral transplantation have led to improvements in survival in patients with MMIHS, with patients now living into the second decade of life."
    explanation: >-
      The reason the figures move over time, which is what makes the range a trend rather
      than simple disagreement between cohorts.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With this treatment approach, the overall long-term prognosis in our cohort was good, with long-term survival in 23 patients (88%)"
    explanation: >-
      The source for `maximum_value`, lifted into this block so the record is
      self-contained. Note the denominator: 26 patients, the smallest and most recent of
      the four series, which is why the record presents it as the top of a range rather
      than as the current figure.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    762 cases of MMIHS as a whole reported in the literature between 1976 and 2023,
    predominantly as case reports. This is the syndrome-level figure across all
    causative genes, not the MYH11 subset, which is a small minority of it.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the first description of MMIHS in five female neonates in 1976 by Berdon et al., only 762 cases have been reported predominantly in case reports worldwide (1976–2023)."
    explanation: The cumulative reported case count and the period it covers.
histopathology:
- name: Normal or non-specific intestinal histopathology
  description: >-
    A negative finding with real diagnostic weight. Intestinal tissue from patients with
    MYH11-variant visceral myopathy shows nothing diagnostic: routine histology and
    electron microscopy find only non-specific changes attributable to distension, and
    immunohistochemistry against a panel of smooth muscle proteins including MYH11 is
    indistinguishable from controls.

    Two things follow. Clinically, tissue is often taken before mutational analysis, so
    a normal biopsy is the expected result in this disease and does not exclude it -
    the authors' own recommendation is to go to molecular genetics when pseudo-obstruction
    has normal or non-specific pathology. Mechanistically, MYH11 immunoreactivity being
    preserved says the defect is functional rather than one of protein absence in these
    patients, which sits alongside the Western blot showing reduced protein in a
    different patient and is not obviously reconcilable with it. Both are recorded.
  finding_term:
    preferred_term: normal muscularis propria morphology and smooth muscle immunophenotype
  evidence:
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apart from non-specific changes (e.g., muscle hypertrophy and distension-related muscularis propria necrosis), no alterations were identified by routine histopathological evaluation or electron microscopy."
    explanation: The primary negative result across light microscopy and electron microscopy.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry with antibodies against a battery of smooth muscle proteins, including MYH11, revealed indistinguishable patterns of immunoreactivity in the muscularis propria of both patients and controls."
    explanation: >-
      MYH11 immunoreactivity is preserved, which is the finding that makes the biopsy
      non-diagnostic and which bears on whether the lesion is loss of protein or loss of
      function.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathic morphological or immunohistochemical changes may not be present in intestinal specimens from patients with MYH11-variant visceral myopathy."
    explanation: The authors' conclusion, which is the one a pathologist reporting such a specimen needs.
- name: Ganglion cells present, excluding Hirschsprung disease
  description: >-
    The differential-diagnostic finding, and the reason a rectal suction biopsy is
    usually the first tissue taken. MMIHS presents as neonatal functional bowel
    obstruction, which is Hirschsprung disease until proven otherwise - and what proves
    otherwise is the presence of ganglion cells in the biopsy. MMIHS is formally
    classified among the "variants of Hirschsprung's disease", a group defined by
    clinically resembling it *despite* normal ganglion cells, and the classification
    lists it explicitly as a congenital smooth muscle cell disorder within that group.

    The point is that the negative here is doing diagnostic work in a way the negative
    in the entry above is not. A normal muscularis propria does not exclude MMIHS and is
    the expected result; present ganglion cells do exclude the main alternative. The two
    findings are usually reported from the same specimen and are easily conflated.
  finding_term:
    preferred_term: ganglion cells present in rectal suction biopsy
  notes: >-
    `finding_term` is deliberately left unbound, and the reason is the shape of the
    finding rather than a gap in the search. What is being recorded is the *presence* of
    a normal cell population, and the ontologies this slot draws on describe
    abnormalities: HP codes aganglionosis and abnormal enteric nervous system morphology,
    NCIT's histopathology branch codes morphologic findings rather than their absence,
    and CL:0007011 names the enteric neuron as a cell type rather than as a biopsy
    result. Binding any of those would assert an abnormality where the whole point is
    that there is none. Searched HP, NCIT and CL; no term beats a wrong one.
  evidence:
  - reference: PMID:23943250
    reference_title: "Classification and diagnostic criteria of variants of Hirschsprung's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "\"Variants of Hirschsprung's disease\" are conditions that clinically resemble Hirschsprung's disease (HD), despite the presence of ganglion cells in rectal suction biopsies."
    explanation: >-
      The definition of the category, which carries the ganglion-cell criterion inside
      it: membership requires the cells to be present.
  - reference: PMID:23943250
    reference_title: "Classification and diagnostic criteria of variants of Hirschsprung's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants of HD include intestinal neuronal dysplasia, intestinal ganglioneuromatosis, isolated hypoganglionosis, immature ganglia, absence of the argyrophil plexus, internal anal sphincter achalasia and congenital smooth muscle cell disorders such as megacystis microcolon intestinal hypoperistalsis syndrome."
    explanation: >-
      Places MMIHS in that category by name, and alongside the other conditions a
      pathologist has to separate it from once Hirschsprung disease is excluded.
  - reference: PMID:26413901
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: A report of a nationwide survey in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A histopathology assessment of the full-thickness of intestinal specimens showed no pathological abnormalities in all patients."
    explanation: >-
      Independent confirmation from a national survey that full-thickness specimens are
      unremarkable in every patient, which is the finding the ganglion-cell result sits
      inside.
diagnosis:
- name: Prenatal ultrasonography
  description: >-
    Megacystis is detected prenatally in essentially every case, typically with
    polyhydramnios or normal amniotic fluid volume - which distinguishes it from
    obstructive megacystis, where oligohydramnios is the rule. Fetal urine biochemistry
    helps separate MMIHS from posterior urethral valves.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common prenatal finding of MMIHS is a large, progressive distended bladder associated with polyhydramnios or normal amniotic fluid volume detected by ultrasonography."
    explanation: The prenatal sonographic picture and the amniotic fluid finding that distinguishes it from obstruction.
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal urine biochemical markers can be helpful for the differentiation of MMIHS from posterior urethral valves or other megacystis"
    explanation: The adjunct that separates a functional from an obstructive cause of fetal megacystis.
- name: Sequencing with parallel copy-number analysis
  description: >-
    Molecular diagnosis needs both. Two of the four reported MYH11 genotypes involve a
    whole-gene deletion in trans with a point variant, so a sequencing-only workflow
    sees a single heterozygous variant and stops.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing and arrayCGH uncovered the novel heterozygous missense variant c.379C>T in MYH11 and a heterozygous 1.3 Mb deletion in 16q13.11 encompassing MYH11, respectively."
    explanation: >-
      The two-technology diagnosis, showing that each method found only half the
      genotype. Quoted as written; the source says 16q13.11 here and 16p13.11 in its
      title.
  - reference: PMID:36571289
    reference_title: "Histopathological, Ultrastructural, and Immunohistochemical Findings in MYH11-Variant Visceral Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic studies should be considered for patients with chronic intestinal pseudo-obstruction and normal or non-specific pathology findings."
    explanation: >-
      The reason genetics rather than tissue is the diagnostic route here: a normal
      biopsy is the expected result and does not argue against the diagnosis.
animal_models:
- name: Myh11 heterozygous knockout mouse
  species: Mouse
  genotype: Myh11+/- heterozygous knockout
  publication: PMID:41797110
  description: >-
    The first purpose-built MMIHS model for this gene, and the one thing to read
    carefully about it is the genotype. Human MMIHS2 is recessive: patients carry two
    damaged MYH11 alleles and their unaffected parents carry one. This mouse is a
    heterozygote. It nonetheless develops a markedly enlarged bladder, a thickened
    smooth muscle layer, collagen deposition, reduced voiding frequency, increased
    post-void residual volume and slowed bladder contraction, which is the human
    megacystis phenotype in miniature.

    So the model reproduces the phenotype through a dose that does not produce disease
    in humans. That is worth stating plainly rather than smoothing over: it makes the
    mouse a good readout of what losing Myh11 does to a bladder, and a poor model of the
    human genotype-phenotype relationship. The intestinal arm is mild in the mouse -
    prolonged transit and raised faecal water content - where in patients it is the
    lethal half of the disease, so the microcolon and the functional obstruction are
    not modelled here at all.
  modeled_mechanisms:
  - target: Bladder Failure with Megacystis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Enlarged bladder volume, raised bladder-to-body weight ratio, thickened smooth
      muscle, collagen deposition, and the functional counterpart - reduced voiding
      frequency with raised residual volume.
    limitations: >-
      The mouse is heterozygous where the human disease is biallelic, so the allele dose
      that produces the phenotype here is the carrier dose in patients. Bladder wall
      thickening with collagen deposition and active proliferation is also a remodelling
      response that human MMIHS bladders are not reported to share in this form.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Human obligate carriers of a single MYH11 loss-of-function allele are
        unaffected - the mother in the late-onset family had a normal assessment - while
        the model's whole phenotype arises at exactly that dose. The comparison the model
        supports is Myh11-low versus Myh11-normal bladder, not patient versus carrier.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Microcolon is absent from the model and the intestinal phenotype is mild
        dysmotility. The gastrointestinal failure that determines survival in patients
        is outside the boundary of what this mouse reproduces, so it cannot speak to
        parenteral nutrition dependence or its complications. Recorded as a boundary
        omission because ModelDivergenceTypeEnum has no value for an incomplete
        phenotype, which is the more exact description.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model observes tissue - bladder wall thickness, collagen content, muscle
        tension, void volumes - while this node is an organism-level claim about a
        failing bladder in a patient. One step of upward extrapolation, so the organ
        failure is inferred from the tissue measurements rather than observed. Recorded
        explicitly to agree with `model_scale: TISSUE` against the node's
        `biological_scale: ORGANISM`.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse and human visceral smooth muscle differ in ways this model cannot
        control for, and the human disease is defined partly by a prenatal presentation -
        megacystis on antenatal ultrasound with polyhydramnios or normal fluid - that a
        mouse study does not assess at all. A second, independent gap alongside the
        allele-dose one above.
    readouts:
    - name: Post-void residual urine volume
      target: Bladder Failure with Megacystis
      direction: INCREASED
      interpretation: >-
        The functional measure of the failure to empty, rather than the anatomical one -
        a bladder can be large without being a failing bladder.
      evidence:
      - reference: PMID:41797110
        reference_title: "Myh11 haploinsufficiency recapitulates megacystis and voiding dysfunction in a mouse model of MMIHS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Myh11+/- mice displayed reduced urinary frequency and total urine output (P < 0.05), an increased residual urine volume (P < 0.001), a slowed bladder contraction (P < 0.01), along with mild intestinal dysmotility (prolonged time to first black stool, P < 0.05) and an elevated fecal water content (P < 0.05)."
        explanation: The full functional readout set, including the mild intestinal arm.
  - target: Failure of Visceral Smooth Muscle Contraction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Muscle tension assays showed slowed bladder contraction, which is a direct
      measurement of the contractile defect this node names rather than an inference
      from organ size.
    limitations: >-
      Measured in bladder, not in bowel. The node covers visceral smooth muscle
      generally, and the intestinal contractile apparatus is assessed only indirectly
      here, through transit time.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The intestinal half of this node is represented by whole-gut transit time, which
        is an outcome of contraction rather than a measurement of it. The bladder half is
        measured directly by muscle tension assay; the two are not equivalent evidence.
  evidence:
  - reference: PMID:41797110
    reference_title: "Myh11 haploinsufficiency recapitulates megacystis and voiding dysfunction in a mouse model of MMIHS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Myh11+/- mice successfully recapitulate the core bladder phenotypes of MMIHS, including megacystis and voiding dysfunction."
    explanation: The authors' own statement of what the model does and does not cover - bladder phenotypes, not the whole syndrome.
  - reference: PMID:41797110
    reference_title: "Myh11 haploinsufficiency recapitulates megacystis and voiding dysfunction in a mouse model of MMIHS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemical staining revealed that Myh11 was predominantly expressed in the bladder smooth muscle, and a significant reduction in its expression level was observed in the bladders of Myh11+/- mice (P < 0.01)."
    explanation: >-
      Confirms the model does what it claims at the protein level, which matters here
      because a heterozygote reducing rather than abolishing expression is the whole
      design.
  - reference: PMID:41797110
    reference_title: "Myh11 haploinsufficiency recapitulates megacystis and voiding dysfunction in a mouse model of MMIHS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Myh11+/- mice exhibited a markedly enlarged bladder volume (P < 0.05), an increased bladder-to-body weight ratio (P < 0.01), a thickened smooth muscle layer (P < 0.01), and enhanced collagen deposition (P < 0.01)."
    explanation: The structural phenotype, including the wall remodelling that the human disease is not reported to share.
treatments:
- name: Total Parenteral Nutrition
  description: >-
    The mainstay, and not a benign one. Eighty-five per cent of patients in the largest
    contemporary cohort required it alongside an ostomy, and the authors identify the
    pair as key determinants of unfavourable outcome rather than as neutral support -
    intestinal-failure-associated liver disease reached 58 per cent and cholelithiasis
    65 per cent. Curated separately from the enterostomy below because they are
    different interventions with different complications: parenteral nutrition damages
    the liver and the venous access, an ostomy does not.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: total parenteral nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Intestinal Hypoperistalsis and Microcolon
    description: >-
      Parenteral nutrition bypasses the failed bowel rather than improving it, so it
      acts on the consequence of the hypoperistalsis node and not on the node itself.
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients experienced clinical (sub)ileus, with 85% requiring ostomy and parenteral nutrition, key determinants of unfavorable outcome."
    explanation: >-
      Both the frequency of the intervention and the authors' judgement that needing it
      marks a worse course.
- name: Multivisceral Transplantation
  description: >-
    Offered to survivors who cannot be maintained on parenteral nutrition. It replaces
    the diseased smooth muscle organs, which is the only intervention in this entry
    that addresses the contractile failure at all - by removing the tissue that cannot
    contract.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: multivisceral transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Failure of Visceral Smooth Muscle Contraction
    description: >-
      Transplantation substitutes tissue with a functioning contractile apparatus for
      tissue without one.
  evidence:
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, there is no specific treatment for MMIHS, and management for affected newborns remains a challenge for doctors and parents. The survivors were either maintained by TPN or had undergone multivisceral transplantation."
    explanation: >-
      States both the absence of disease-specific therapy and the two routes open to
      survivors.
- name: Decompressive Enterostomy
  description: >-
    A stoma to decompress bowel that will not propel its contents. The site varies with
    where the obstruction is functionally worst - jejunostomy, ileostomy and colostomy
    are all reported, and the Japanese national survey created jejunal stomas in eleven
    patients and colonic in five. It is drainage, not restoration: the bowel below the
    stoma remains aperistaltic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: decompressive enterostomy
    term:
      id: NCIT:C52005
      label: Enterostomy
  target_mechanisms:
  - target: Intestinal Hypoperistalsis and Microcolon
    description: >-
      The stoma relieves the consequence of the failed propulsion by providing an exit
      the bowel does not have to generate. It does not act on the contractile defect.
  evidence:
  - reference: PMID:26413901
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: A report of a nationwide survey in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Drainage stomas were created in the jejunum (n=11) and colon (n=5)."
    explanation: The stoma sites actually used, from a national survey rather than a literature review.
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One or more surgical interventions were reported in 115 patients (including gastrostomy, ileostomy, jejunostomy, segmental resections of small bowel, adhesiolysis and internal sphincter myectomy)."
    explanation: >-
      The full range of gastrointestinal operations reported, which is also the source
      for the gastrostomy entry below.
- name: Gastrostomy
  description: >-
    For gastric decompression and, where any enteral feeding is tolerated, a route for
    it. Reported as part of the standard management alongside parenteral nutrition and
    a stoma rather than as an alternative to them.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  target_mechanisms:
  - target: Intestinal Hypoperistalsis and Microcolon
    description: >-
      Decompresses the stomach proximal to the functional obstruction. As with the
      enterostomy, it manages the consequence rather than the contractile failure.
  evidence:
  - reference: PMID:27421821
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: Case series and updated review of the literature with an emphasis on urologic management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients were treated with TPN as well as gastrostomy or ileostomy and CIC, however 15% (18/116) received multivisceral or intestinal transplant, and 30% (22/73) had a vesicostomy."
    explanation: >-
      The composite management statement, and the source for the three urological and
      gastrointestinal interventions curated around it.
- name: Cutaneous Vesicostomy
  description: >-
    Bladder drainage by a stoma, performed in about three in ten patients in the
    largest urological review and in 41 patients in the earlier systematic review. For
    a disease whose name begins with megacystis this is the intervention aimed
    squarely at the eponymous organ, and it exists because the bladder cannot generate
    the pressure to empty itself.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cutaneous vesicostomy
    term:
      id: NCIT:C15218
      label: Cystostomy
  target_mechanisms:
  - target: Bladder Failure with Megacystis
    description: >-
      Provides the outflow the detrusor cannot produce, which decompresses the bladder
      and protects the upper tracts from the back-pressure that produces the
      hydronephrosis curated above.
  evidence:
  - reference: PMID:27421821
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: Case series and updated review of the literature with an emphasis on urologic management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "30% (22/73) had a vesicostomy"
    explanation: The frequency in the largest review focused on urological management.
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For decompression of the megacystis, vesicostomy was performed in 41 patients."
    explanation: The indication stated explicitly - decompression of the megacystis - in the earlier review.
- name: Clean Intermittent Catheterisation
  description: >-
    The non-surgical counterpart of the vesicostomy, and the one intervention in this
    entry that the sources describe as permanent. Even survivors who come off parenteral
    nutrition and recover gastric emptying continue to require catheterisation, because
    the bladder dysfunction does not remit. That asymmetry is worth recording: the
    gastrointestinal half of this disease can improve with time and transplantation,
    and the urological half so far does not.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: clean intermittent catheterisation
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  review_notes: >-
    Bound deliberately broadly. NCIT has an exact concept, NCIT:C38045 Catheterization,
    and it is not reachable from NCIT:C25218 Clinical Intervention or Procedure, so it
    cannot fill a TreatmentTerm slot - `just validate-terms` rejects it as outside the
    TreatmentActionTerm dynamic enum. The alternatives NCIT offers under a searchable
    name are devices (Foley catheter, indwelling urinary catheter, suprapubic catheter),
    and a device is not a clinical action; the CLAUDE.md cochlear-implant carve-out
    covers exactly that distinction. The specificity is carried in `preferred_term`
    rather than manufactured from a term that does not fit.
  target_mechanisms:
  - target: Bladder Failure with Megacystis
    description: >-
      Empties the bladder mechanically in place of the contraction it cannot generate.
  evidence:
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, intermittent catheterisation remains obligatory due to persistent bladder dysfunction."
    explanation: >-
      The permanence, stated against the improvement seen in the same sentence's
      gastrointestinal counterpart.
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the survivors are reported to be free of parenteral nutrition and show improving gastric emptying."
    explanation: The contrast that makes the previous item's "obligatory" meaningful.
- name: Isolated Intestinal Transplantation
  description: >-
    Distinguished from the multivisceral operation above because the indication is
    different, not merely the extent. Multivisceral transplantation including the liver
    is used where parenteral nutrition has already destroyed the liver; an isolated
    intestinal graft is an option in selected patients whose liver is still sound. The
    reported case was an eight-year-old who achieved completely oral intake over four
    years of follow-up.

    Reported in single cases, which is the honest description of the evidence: this is a
    case report suggesting an indication, not a series establishing one.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: isolated intestinal transplantation
    term:
      id: NCIT:C157985
      label: Small Bowel Transplantation
  target_mechanisms:
  - target: Failure of Visceral Smooth Muscle Contraction
    description: >-
      Substitutes bowel with a working contractile apparatus for bowel without one, in
      the gastrointestinal compartment only.
  evidence:
  - reference: PMID:23167913
    reference_title: "Isolated intestinal transplantation for megacystis microcolon intestinal hypoperistalsis syndrome: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an eight-yr-old patient with MMIHS who was treated with isolated intestinal transplantation. She had completely oral intake during the four yr of follow-up."
    explanation: The outcome in the reported case, with the follow-up interval.
  - reference: PMID:23167913
    reference_title: "Isolated intestinal transplantation for megacystis microcolon intestinal hypoperistalsis syndrome: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivisceral transplantation including stomach, duodenum, intestine, and liver has been used for the treatment of patients with MMIHS because these patients often have liver failure."
    explanation: >-
      Why the multivisceral operation is the usual one, and therefore why an isolated
      graft is a selected-patient option rather than a default.
  - reference: PMID:18280270
    reference_title: "Combined living-related segmental liver and bowel transplantation for megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first case of a patient affected by MMIHS and cholestatic liver failure treated by a combined living-related liver and intestinal transplant (CLRLITx)."
    explanation: >-
      The third graft configuration reported in this disease, combining a living-related
      segmental liver with bowel. Recorded here rather than as a fourth treatment entry
      because it is a variant of the transplant decision this entry already models: which
      organs, determined by whether parenteral nutrition has taken the liver.
discussions:
- discussion_id: mmihs_female_predominance_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - epidemiology#Female predominance
  - disease#Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome 2
  prompt: >-
    Why are roughly seven in ten reported MMIHS patients female, when the causative
    genes are autosomal and the MYH11 form is recessive?
  rationale: >-
    An autosomal recessive mechanism predicts an even sex distribution. The observed
    skew is large, it holds at 70.6 per cent across 227 literature cases, 73 per cent
    across 121, and 16 of 19 in a national survey that is not subject to publication
    bias, and it was present in the original 1976 description of five female neonates.

    Three readings are available from the evidence curated here and none is settled.
    It may be ascertainment: most of these figures come from published case reports,
    and a male infant with a distended bladder is more likely to be worked up for
    posterior urethral valves and classified there. It may be sex-specific modification
    of a common pathway - the syndrome is genetically heterogeneous and is dominated by
    ACTG2 rather than MYH11, so the skew may not belong to this gene at all. Or it may
    be survival: if affected males die earlier or in utero, the reported series are the
    survivors.

    Nothing in the curated sources distinguishes these. It is recorded as an open
    question rather than curated into the pathograph because a sex effect with no
    proposed mechanism is not a mechanism, and because the honest thing to say about
    the most reproducible epidemiological fact in this disease is that it is unexplained.
  evidence:
  - reference: PMID:21792650
    reference_title: "Megacystis microcolon intestinal hypoperistalsis syndrome: systematic review of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clear preponderance for female infants was found (female 70.6 vs. male 29.4%)."
    explanation: The observation the question is about.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTG2 (15/19) was the most common causative gene variant, followed by MYH11 (2/19), MYLK (1/19), and LMOD1 (1/19)."
    explanation: >-
      Why the skew may not be a fact about MYH11 at all. The cohorts it is measured in
      are dominated by ACTG2, and no source separates the sex distribution by gene.
notes: >-
  On gnomAD constraint. The deep-research report gives MYH11 constraint metrics -
  pLI approximately 1.0, observed/expected LoF 0.32, LOEUF approximately 0.39, LoF Z
  of 9.0, missense Z of 3.29 - and they would sit naturally in the genetic section.
  They are not curated, because there is no way to cite them here. gnomAD is not a
  reference prefix this repository can fetch, so a constraint figure can only be
  entered as an uncited number in prose, which is the failure mode the evidence SOP
  exists to prevent. The claim they support - that MYH11 is strongly intolerant of
  loss of function, which is why one damaged allele is enough for the aortic phenotype
  and two are needed for this one - is made in the mechanistic_hypotheses block from
  cited sources instead.

  Scope. This entry covers the MYH11 form of MMIHS, which is what MONDO:0025708
  names. MMIHS as a clinical syndrome is genetically heterogeneous - dominant ACTG2
  accounts for most cases, with recessive LMOD1, MYLK, MYL9, MYH9 and MYH11 making up
  the rest - and several statements curated here (cohort frequencies, the 762 reported
  cases, the management data) are syndrome-level rather than MYH11-specific. Each is
  flagged as such in its own notes or explanation. The mechanistic chain, by contrast,
  is MYH11-specific from the gene lesion down to the contractile failure node, where
  it converges with the other genes.

  Relationship to the MYH11 aortic entries. MYH11 appears on main in
  Familial_Thoracic_Aortic_Aneurysm_and_Aortic_Dissection and related entries, and as
  the fusion partner in CBFB-MYH11 acute myeloid leukemia. None of those is the same
  disease as this one, and the first is the subject of a mechanistic_hypotheses block
  here because the allelic mechanism dichotomy between them is a substantive open
  question rather than a curation artefact.

  On copy-number variants. Two of the four reported MYH11 genotypes pair a point
  variant with a whole-gene deletion. Any diagnostic workflow that does not look for
  copy-number change will report these patients as heterozygous carriers, which is the
  practical reason the diagnosis section carries a separate entry for it.

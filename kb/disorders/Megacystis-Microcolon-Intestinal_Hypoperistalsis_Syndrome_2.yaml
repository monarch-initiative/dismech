inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic MYH11 variants. Reported genotypes include homozygosity for a
    nonsense allele in a consanguineous family, compound heterozygosity in a
    non-consanguineous family, and compound heterozygosity for a whole-gene
    deletion with a point variant in trans. Heterozygous parents are unaffected for
    the visceral phenotype.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31427716
    reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study's results confirmed that MYH11 is a candidate gene for MMIHS with autosomal recessive (AR) inheritance and expanded the mutation spectrum for this clinical condition."
    explanation: States the inheritance mode for the MYH11 form specifically, against the dominant ACTG2 background.
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis using Sanger sequencing revealed that the father and the mother of the proband are heterozygous for the c.3598A>T (p.Lys1200Ter) variant."
    explanation: Segregation in unaffected heterozygous parents, which is what establishes recessiveness rather than a de novo dominant event.
pathophysiology:
- name: Biallelic MYH11 Loss of Function
  description: >-
    The initiating lesion. Both MYH11 alleles are disabled, by nonsense variants,
    whole-gene deletion, or missense changes that destroy motor function. The
    reported missense allele p.Pro127Ser is instructive: Pro127 forms part of the
    ATP-binding pocket of the motor domain, so the substitution is loss of function
    by disabling the nucleotide chemistry the motor runs on rather than by
    destabilising the protein.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Loss of Smooth Muscle Myosin Heavy Chain Protein
    causal_link_type: DIRECT
    description: >-
      Null and deletion alleles remove the transcript or truncate the protein, so the
      gene lesion appears directly as reduced protein in patient tissue.
    evidence:
    - reference: PMID:31427716
      reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Western blotting showed a marked decrease in MYH11 protein in the proband's umbilical cord tissue compared with the control sample."
      explanation: Direct measurement of the protein consequence in the patient's own tissue rather than in a heterologous system.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a homozygous variant (c.3598A>T: p.Lys1200Ter) in MYH11, which codes for the smooth muscle myosin heavy chain"
    explanation: The founding homozygous nonsense allele.
  - reference: PMID:31044419
    reference_title: "16p13.11 microdeletion uncovers loss-of-function of a MYH11 missense variant in a patient with megacystis-microcolon-intestinal-hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Proline 127 is crucial for the formation of the Adenosine triphosphate binding pocket of the MYH11 motor domain and molecular modeling indicated that p.Pro127Ser alters nucleotide binding properties."
    explanation: >-
      The structural basis for calling a missense allele loss of function. Graded
      COMPUTATIONAL because the claim rests on molecular modelling, not on a
      biochemical assay.
- name: Loss of Smooth Muscle Myosin Heavy Chain Protein
  description: >-
    Smooth muscle myosin heavy chain is the force-generating motor of visceral smooth
    muscle. Without it the thick filament has no head to cycle against actin, so the
    contractile apparatus is structurally present but cannot do work. This is why the
    downstream failure is functional rather than obstructive.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  cellular_components:
  - preferred_term: muscle myosin complex
    term:
      id: GO:0005859
      label: muscle myosin complex
    modifier: DECREASED
  downstream:
  - target: Failure of Visceral Smooth Muscle Contraction
    causal_link_type: DIRECT
    description: >-
      The motor protein is the thing that contracts; removing it removes contraction.
    evidence:
    - reference: PMID:25407000
      reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Previous studies showed that loss of Myh11 function in mice causes a bladder and intestinal phenotype that is highly reminiscent of MMIHS."
      explanation: >-
        The mouse result is what closes the gap between losing the protein and
        producing this specific two-organ phenotype, which a human case report alone
        cannot establish.
- name: Failure of Visceral Smooth Muscle Contraction
  description: >-
    The cellular and tissue-level defect that unifies every MMIHS gene. Smooth muscle
    in the bladder wall and bowel wall cannot generate or sustain force. Note what
    this is not: there is no mechanical obstruction, no aganglionosis, and no
    inflammatory lesion. The organs are patent and innervated and simply do not move,
    which is what "functional obstruction" means here and why the syndrome is
    classified as a myopathy.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: enteric smooth muscle cell
    term:
      id: CL:0002504
      label: enteric smooth muscle cell
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: DECREASED
  downstream:
  - target: Bladder Failure with Megacystis
    causal_link_type: DIRECT
    description: >-
      A bladder that cannot contract cannot empty, so it distends without any outlet
      lesion.
  - target: Intestinal Hypoperistalsis and Microcolon
    causal_link_type: DIRECT
    description: >-
      Bowel that cannot generate a propulsive wave does not transit; an unused distal
      colon never expands to normal calibre.
    evidence:
    - reference: PMID:31427716
      reference_title: "Compound heterozygous variants in MYH11 underlie autosomal recessive megacystis-microcolon-intestinal hypoperistalsis syndrome in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These five genes related to MMIHS are involved in the smooth muscle contraction, and the functional study of proteins supports a myopathic basis for this clinical condition."
      explanation: >-
        The convergence argument - every gene implicated in the syndrome acts on
        contraction - which is what makes contractile failure the shared node rather
        than one gene's idiosyncrasy.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The documentation of variants in ACTG2 and MYH11 thus points to the involvement of the contractile apparatus of the smooth muscle in MMIHS."
    explanation: States the mechanistic conclusion this node represents.
  - reference: PMID:42094517
    reference_title: "Vascular Smooth Muscle Myosin 2 Filaments Dynamically Assemble and Stabilize During Induced Contractility."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Smooth muscle myosin 2 (SMII) is the dominant motor protein driving SMC contraction. To function, SMII monomers dynamically assemble into filaments, which associate with the actin cytoskeleton to drive contractility."
    explanation: >-
      The physiology the node depends on - that this protein is the dominant motor and
      that it must assemble into filaments to work. Graded INDIRECT because the work is
      in vascular smooth muscle cells, not visceral, and is not about MMIHS; it
      establishes the requirement rather than the disease.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Megacystis-Microcolon-Intestinal Hypoperistalsis syndrome (MMIHS) is an extremely rare and severe genetic smooth muscle myopathy that primarily affects the bladder and intestine"
    explanation: The contemporary cohort's framing of the disease as a smooth muscle myopathy of these two organs.
- name: Bladder Failure with Megacystis
  description: >-
    The urinary arm. The bladder distends massively in utero and is anuric or
    non-emptying after birth, with a wall of normal thickness - the absence of
    hypertrophy being the point, since a bladder straining against an obstruction
    would thicken. Severe oligohydramnios follows from the fetus not voiding, and with
    it pulmonary hypoplasia, which is a major contributor to neonatal death.
  biological_scale: ORGANISM
  downstream:
  - target: Neonatal Respiratory Failure from Pulmonary Hypoplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A fetus that does not void produces no amniotic fluid; without amniotic fluid the
      lungs do not develop. The intermediate - oligohydramnios - is known and is
      documented in the same case.
    evidence:
    - reference: PMID:25407000
      reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Antenatal ultrasound performed during the second trimester of gestation revealed the presence of megacystitis as well as severe oligohydramnios."
      explanation: Documents megacystis and oligohydramnios together in the same fetus, which is the step this edge asserts.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrasound confirmed the presence of megacystitis with normal wall thickness."
    explanation: >-
      Normal wall thickness is the finding that distinguishes a failing bladder from an
      obstructed one, which is why it is quoted rather than the distension alone.
- name: Intestinal Hypoperistalsis and Microcolon
  description: >-
    The gastrointestinal arm. Meconium is never passed; contrast studies show no
    opacification beyond the duodenum and a filiform distal colon that has never been
    used. Intestinal hypoperistalsis is present in every patient in the largest
    contemporary cohort, while microcolon - the feature the syndrome is named for - is
    present in only about half, which is worth knowing before using the name as a
    diagnostic criterion.
  biological_scale: ORGANISM
  downstream:
  - target: Parenteral Nutrition Dependence and Its Complications
    causal_link_type: DIRECT
    description: >-
      Bowel that does not transit cannot absorb enteral feed, so nutrition has to be
      given intravenously, and the complications that follow are complications of that
      dependence rather than of the myopathy itself.
    evidence:
    - reference: PMID:41387873
      reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients experienced clinical (sub)ileus, with 85% requiring ostomy and parenteral nutrition, key determinants of unfavorable outcome."
      explanation: Quantifies the dependence and identifies it as an outcome determinant rather than a neutral supportive measure.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the third week of life, transit studies showed lack of opacification of the bowel distal to the duodenum, whereas barium enema showed filiform opacification of the distal colon with no opacification of the cecum consistent with microcolon."
    explanation: The radiological demonstration of both the failed transit and the microcolon.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Megacystis was present in 96% (all detected prenatally), intestinal hypoperistalsis in 100%, and microcolon in 57%."
    explanation: >-
      Cohort frequencies for the three eponymous features, and the finding that
      microcolon is the least consistent of them.
- name: Neonatal Respiratory Failure from Pulmonary Hypoplasia
  description: >-
    Not every patient reaches this node - it follows the severe oligohydramnios
    sequence rather than the myopathy directly - but where it occurs it is what kills
    the newborn before the gastrointestinal disease can be managed.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of severe lung hypoplasia, the proband was put on high-frequency oscillation shortly after birth."
    explanation: Documents the pulmonary hypoplasia and the ventilatory support it required in the index MYH11 case.
- name: Parenteral Nutrition Dependence and Its Complications
  description: >-
    The chronic phase, and where most of the long-term morbidity now sits. Patients
    depend on parenteral nutrition and usually an ostomy; the cohort data show high
    rates of intestinal-failure-associated liver disease and cholelithiasis alongside
    proximal intestinal stenosis and rotational anomalies. Survival is now
    substantially better than the syndrome's historical reputation suggests.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High rates of proximal intestinal stenosis (35%), mal-/non-rotation (39%), IFALD (58%), and Cholelithiasis (65%) were observed."
    explanation: The complication profile of the chronic phase, quantified in a 26-patient cohort.
  - reference: PMID:41387873
    reference_title: "Genotype-phenotype correlation and management of Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome: a descriptive cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall long-term survival in our cohort was 88%."
    explanation: >-
      The survival figure, which is materially different from the syndrome's historical
      mortality and is why the entry does not describe it as uniformly lethal.
mechanistic_hypotheses:
- hypothesis_group_id: myh11_allelic_mechanism_dichotomy
  hypothesis_label: Whether the mechanism of MYH11 disruption, not the gene, determines vascular versus visceral disease
  status: EMERGING
  description: >-
    MYH11 is a disease gene twice over. Dominant-negative missense alleles cause
    familial thoracic aortic aneurysm and dissection; biallelic null alleles cause
    this visceral myopathy. The two phenotypes barely overlap, and the mother in the
    late-onset family - an obligate carrier of a hypomorphic allele - had a normal
    cardiac and vascular assessment.

    The proposal is that this is a statement about mechanism rather than about
    expression: a poisoned motor incorporated into an otherwise intact filament is a
    different lesion from an absent motor, and vascular and visceral smooth muscle
    apparently tolerate the two differently. The authors of the founding MYH11 MMIHS
    report state this directly.

    What is not established is why. Both tissues express MYH11, so the explanation
    cannot be that one is spared. Candidate accounts - differences in isoform usage,
    in the mechanical demands placed on the filament, or in compensation by other
    myosins - are not tested in the literature curated here. The practical
    consequence is that carrier relatives of a visceral case should not be assumed to
    carry aortic risk, and vice versa; that inference is exactly what this hypothesis
    leaves open.
  evidence:
  - reference: PMID:25407000
    reference_title: "A homozygous loss-of-function variant in MYH11 in a case with megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, dominant-negative variants in MYH11 have previously been shown to cause thoracic aortic aneurism and dilatation. Different mechanisms of MYH11 disruption may thus lead to distinct patterns of smooth muscle dysfunction."
    explanation: >-
      The hypothesis in the authors' own words, framed as a possibility. Quoted as
      written, including the source's spelling of aneurysm.
  - reference: PMID:38625590
    reference_title: "Genome-wide analysis identifies MYH11 compound heterozygous variants leading to visceral myopathy corresponding to late-onset form of megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac and vascular assessment of the mother was normal."
    explanation: >-
      A single obligate carrier of the hypomorphic allele without vascular disease. One
      person is not a cohort, which is why this is recorded under a hypothesis rather
      than as a claim about carrier risk.
- hypothesis_group_id: residual_function_sets_onset
  hypothesis_label: Whether residual MYH11 function sets age of onset along a continuum
  status: EMERGING
  description: >-
    MMIHS is defined as a congenital disease, but a family carrying a whole-gene
    deletion in trans with an in-frame hypomorphic allele presented in adulthood - a
    brother with severe bladder dysfunction and intestinal obstruction at 38, a sister
    with end-stage kidney disease, neurogenic bladder and recurrent sigmoid volvulus
    at 30. If that is the same disease with more residual motor function, then
    "congenital MMIHS" and "adult visceral myopathy" are two points on one dose-response
    curve rather than two entities, and adults with unexplained visceral myopathy are
    an under-tested group.

    The evidence is one family, described by its authors as the second such report.
    An alternative reading - that the in-frame allele produces a qualitatively
    different protein rather than less of the same function - is not excluded by the
    data available.
  evidence:
  - reference: PMID:38625590
    reference_title: "Genome-wide analysis identifies MYH11 compound heterozygous variants leading to visceral myopathy corresponding to late-onset form of megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 38 years-old brother had severe bladder dysfunction and intestinal obstruction, whereas the 30 years-old sister suffered from end-stage kidney disease with neurogenic bladder and recurrent sigmoid volvulus."
    explanation: The late-onset presentation in two siblings, decades after the congenital syndrome would have declared itself.
  - reference: PMID:38625590
    reference_title: "Genome-wide analysis identifies MYH11 compound heterozygous variants leading to visceral myopathy corresponding to late-onset form of megacystis-microcolon-intestinal hypoperistalsis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous variants of MYH11 gene were identified, associating a deletion of 1.2 Mb encompassing MYH11 inherited from the father and an in-frame variant c.2578_2580del, p.Glu860del inherited from the mother."
    explanation: >-
      The genotype the hypothesis rests on - a null in trans with an in-frame allele
      that presumably retains some function.

treatments:
- name: Presymptomatic Surveillance and Genetic Testing of At-Risk Relatives
  description: >-
    Because the constitutional allele is present from birth and second hits
    accumulate over decades, the intervention with the clearest rationale in MEN1
    is early identification of carriers followed by biochemical and imaging
    surveillance, so that tumors are detected before they metastasize.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_mechanisms:
  - target: MEN1 Tumor Spectrum and Reduced Life Expectancy
    treatment_effect: INHIBITS
    description: >-
      Surveillance does not alter the germline lesion or prevent second hits; it
      acts on the consequence node by shifting detection earlier in the natural
      history of the tumors that second hits initiate.
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis for MEN1 patients might be improved by presymptomatic tumor
      detection and undertaking treatment specific for MEN1 tumors.
    explanation: >-
      The guideline's own statement of the rationale for presymptomatic
      detection, which is what this entry curates as the intervention. Note the
      guideline states this as a prospect ("might be improved"), and this entry
      does not assert a demonstrated mortality benefit.
- name: Multidisciplinary Specialist Care
  description: >-
    Management of MEN1 differs from management of the same tumors occurring
    sporadically, because lesions are multiple and recurrence in retained primed
    tissue is expected; the guideline therefore recommends care by teams
    experienced in endocrine tumors.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, it is recommended that MEN1 patients and their families should be
      cared for by multidisciplinary teams comprising relevant specialists with
      experience in the diagnosis and treatment of patients with endocrine
      tumors.
    explanation: >-
      Direct guideline recommendation for the model of care curated here.

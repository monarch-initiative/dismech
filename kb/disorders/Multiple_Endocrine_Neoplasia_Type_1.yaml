name: Multiple Endocrine Neoplasia Type 1
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Endocrine Neoplasia
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: multiple endocrine neoplasia type 1
  term:
    id: MONDO:0007540
    label: multiple endocrine neoplasia type 1
synonyms:
- MEN1
- MEN1 syndrome
- Wermer syndrome
- multiple endocrine adenomatosis type 1
description: >-
  Multiple endocrine neoplasia type 1 (MEN1, Wermer syndrome) is an autosomal
  dominant hereditary cancer syndrome caused by germline loss-of-function
  variants in MEN1 at 11q13, which encodes the 610-amino-acid nuclear scaffold
  protein menin. It is defined clinically by the combination of parathyroid,
  enteropancreatic neuroendocrine, and anterior pituitary tumors, with a wider
  spectrum that includes thymic and bronchial carcinoid tumors, adrenocortical
  tumors, meningiomas, and the cutaneous lesions (facial angiofibromas,
  collagenomas, lipomas) that often precede endocrine presentation.
  Mechanistically MEN1 is a textbook Knudson two-hit tumor suppressor syndrome:
  the constitutional variant is carried by every cell, and tumors arise where a
  somatic event — usually loss of heterozygosity across 11q13 — removes the
  retained wild-type allele. This was in fact demonstrated for MEN1 before the
  gene itself was cloned, by comparing constitutional with tumour genotypes in
  insulinomas from affected brothers. Two clinical consequences follow directly
  from the two-hit architecture and distinguish MEN1 management from the
  management of the same tumors occurring sporadically: lesions are multiple and
  multicentric rather than solitary, because independent second hits occur across
  a whole primed endocrine tissue; and they present earlier. Primary
  hyperparathyroidism from multigland parathyroid disease is the usual first
  manifestation and is near-fully penetrant by middle age. Life expectancy is
  reduced, with metastatic pancreatic neuroendocrine tumors and thymic carcinoid
  the principal causes of disease-specific death.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    MEN1 segregates as an autosomal dominant predisposition; first-degree
    relatives of an affected individual have a 50% risk. Penetrance for at least
    one MEN1-associated tumor is high by middle age, but which tumors develop,
    and when, varies widely between and within families — expected under a model
    in which the inherited allele fixes susceptibility while stochastic somatic
    second hits fix the phenotype.
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the finding of MEN1 in a patient has important implications for
      family members because first-degree relatives have a 50% risk of
      developing the disease and can often be identified by MEN1 mutational
      analysis.
    explanation: >-
      States the autosomal dominant transmission risk to first-degree relatives
      that defines the inheritance pattern of this entry.
pathophysiology:
- name: Germline MEN1 First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous loss-of-function variant in MEN1 at 11q13 is present in every
    nucleated cell of the carrier. MEN1 encodes menin, a nuclear scaffold protein
    with no similarity to previously characterized proteins, which acts as a
    tumor suppressor in endocrine tissue. The heterozygous state is compatible
    with normal endocrine function, so the constitutional lesion is a
    susceptibility rather than a disease state — what it changes is that every
    parathyroid, islet, and pituitary cell now sits one event away from complete
    menin loss.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: MEN1
    modifier: DECREASED
    term:
      id: hgnc:7010
      label: MEN1
  genetic_context:
    gene:
      preferred_term: MEN1
      term:
        id: hgnc:7010
        label: MEN1
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous MEN1 loss of function; frameshift, nonsense,
      missense and in-frame deletion alleles were all identified in the original
      mutation-positive families.
  evidence:
  - reference: PMID:9103196
    reference_title: Positional cloning of the gene for multiple endocrine neoplasia-type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing from a previously identified minimal interval on chromosome
      11q13 identified several candidate genes, one of which contained 12
      different frameshift, nonsense, missense, and in-frame deletion mutations
      in 14 probands from 15 families.
    explanation: >-
      Identifies the germline MEN1 lesion at 11q13 and its mutational spectrum
      in affected families, which is the constitutional first hit this node
      asserts.
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN1 is an autosomal dominant disorder that is due to mutations in the
      tumor suppressor gene MEN1, which encodes a 610-amino acid protein, menin.
    explanation: >-
      Establishes MEN1 as a tumor suppressor gene, which is what places this
      disorder in the two-hit rather than the proto-oncogene class of
      predisposition syndromes.
  downstream:
  - target: Somatic MEN1 Second-Hit Inactivation
    description: >-
      With one allele already inactivated constitutionally, a single somatic
      event at 11q13 completes menin loss and becomes the rate-limiting step.

- name: Somatic MEN1 Second-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  description: >-
    A somatic event removes the retained wild-type MEN1 allele in a single
    endocrine cell, most often as loss of heterozygosity across the 11q13 region.
    This was demonstrated for MEN1 a decade before the gene was cloned, by
    comparing constitutional with tumour genotypes in insulinomas from two
    brothers who had inherited MEN1 from their mother — the tumours showed
    unmasking of the recessive mutation at the locus. Because the second hit is
    stochastic and every cell of the target tissue is equally primed, hits occur
    independently many times over, which is the direct mechanistic reason MEN1
    parathyroid and islet disease is multiglandular and multicentric rather than
    solitary.
  role: amplifier
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: MEN1
      term:
        id: hgnc:7010
        label: MEN1
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    allelic_events:
    - LOSS_OF_HETEROZYGOSITY
    - DELETION
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Acquired inactivation of the retained wild-type MEN1 allele in tumor
      tissue, predominantly by loss of heterozygosity at 11q13.
  evidence:
  - reference: PMID:2894610
    reference_title: Multiple endocrine neoplasia type 1 gene maps to chromosome 11 and is lost in insulinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparing constitutional and tumour tissue genotypes of insulinomas
      from a pair of brothers who had inherited MEN-1 from their mother, we have
      shown that oncogenesis in these cases involves unmasking of a recessive
      mutation at this locus.
    explanation: >-
      The constitutional-versus-tumour genotype comparison that establishes the
      somatic second hit in MEN1 tumors, and the direct evidence that the
      cellular lesion is recessive.
  downstream:
  - target: Biallelic Menin Loss in Endocrine Tissue
    description: >-
      Completion of the second hit leaves the affected endocrine cell with no
      functional menin.

- name: Biallelic Menin Loss in Endocrine Tissue
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    A parathyroid chief cell, pancreatic islet cell, or anterior pituitary cell
    now carries no functional MEN1 allele. Menin is a nuclear scaffold with no
    catalytic activity of its own; the tumor-suppressive function it provides in
    these lineages is lost as a whole rather than as a single enzymatic step,
    which is why no one pathway substitutes for it and why the tumors that follow
    are lineage-defined rather than pathway-defined.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: negative regulation of cell population proliferation
    term:
      id: GO:0008285
      label: negative regulation of cell population proliferation
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:2894610
    reference_title: Multiple endocrine neoplasia type 1 gene maps to chromosome 11 and is lost in insulinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By comparing constitutional and tumour tissue genotypes of insulinomas
      from a pair of brothers who had inherited MEN-1 from their mother, we have
      shown that oncogenesis in these cases involves unmasking of a recessive
      mutation at this locus.
    explanation: >-
      Unmasking of a recessive mutation in tumour but not constitutional tissue
      is the biallelic state this node asserts; without it the node would rest
      only on the menin-structure evidence below, which does not establish it.
  - reference: PMID:9103196
    reference_title: Positional cloning of the gene for multiple endocrine neoplasia-type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predicted 610-amino acid protein product, termed menin, exhibits no
      apparent similarities to any previously known proteins.
    explanation: >-
      Establishes menin as a novel protein without an assignable enzymatic
      family, which is the basis for describing its loss as loss of a scaffold
      function rather than of a single catalytic step.
  downstream:
  - target: Multicentric Endocrine Tumorigenesis
    description: >-
      Menin-null endocrine cells gain a selective advantage and expand clonally
      within their gland.

- name: Multicentric Endocrine Tumorigenesis
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  description: >-
    Menin-null cells expand clonally within parathyroid, enteropancreatic and
    anterior pituitary tissue. Because initiation events are independent, MEN1
    parathyroid disease is characteristically an asynchronous multigland process
    and MEN1 pancreatic neuroendocrine disease is multicentric — a distinction
    with direct surgical consequence, since resecting one apparently causative
    lesion leaves the remaining primed tissue behind.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN1 is characterized by the occurrence of parathyroid, pancreatic islet,
      and anterior pituitary tumors.
    explanation: >-
      Defines the three tissues in which clonal expansion of menin-null cells
      produces the disease's cardinal tumors.
  downstream:
  - target: MEN1 Tumor Spectrum and Reduced Life Expectancy
    description: >-
      Accumulating tumors across several endocrine organs produce the syndrome's
      hormonal and oncological burden.

- name: MEN1 Tumor Spectrum and Reduced Life Expectancy
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical signature: parathyroid, pancreatic islet and anterior pituitary
    tumors, with carcinoid, adrenocortical, meningeal and cutaneous lesions in a
    substantial minority. Tumors in MEN1 carriers behave worse than their
    sporadic counterparts not because the histology differs but because they are
    multiple, larger, more often metastatic, and less amenable to the operations
    that cure the solitary sporadic lesion — the direct clinical expression of
    the two-hit architecture. Life expectancy is reduced accordingly.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some patients may also develop carcinoid tumors, adrenocortical tumors,
      meningiomas, facial angiofibromas, collagenomas, and lipomas.
    explanation: >-
      Documents the wider tumor spectrum beyond the three defining endocrine
      organs, which this consequence node asserts.
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with MEN1 have a decreased life expectancy, and the outcomes of
      current treatments, which are generally similar to those for the
      respective tumors occurring in non-MEN1 patients, are not as successful
      because of multiple tumors, which may be larger, more aggressive, and
      resistant to treatment, and the concurrence of metastases.
    explanation: >-
      States both the reduced life expectancy and the reason for it — tumor
      multiplicity and aggressiveness — which is the clinical consequence of the
      multicentric mechanism curated upstream.
phenotypes:
- category: Endocrine
  name: Primary Hyperparathyroidism
  description: >-
    Usually the earliest manifestation of MEN1 and the most penetrant, arising
    from asynchronous multigland parathyroid involvement rather than a single
    adenoma.
  phenotype_term:
    preferred_term: Primary hyperparathyroidism
    term:
      id: HP:0008200
      label: Primary hyperparathyroidism
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN1 is characterized by the occurrence of parathyroid, pancreatic islet,
      and anterior pituitary tumors.
    explanation: >-
      Parathyroid tumors are named as a defining feature of the syndrome by the
      clinical practice guideline.
- category: Endocrine
  name: Parathyroid Adenoma
  description: >-
    Multiple, often asynchronous parathyroid adenomas — the structural lesion
    underlying MEN1 hyperparathyroidism.
  phenotype_term:
    preferred_term: Parathyroid adenoma
    term:
      id: HP:0002897
      label: Parathyroid adenoma
  evidence:
  - reference: PMID:22723327
    reference_title: Clinical practice guidelines for multiple endocrine neoplasia type 1 (MEN1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEN1 is characterized by the occurrence of parathyroid, pancreatic islet,
      and anterior pituitary tumors.
    explanation: >-
      Establishes parathyroid tumor as a cardinal feature.
- category: Metabolic
  name: Hypercalcemia
  description: >-
    Biochemical consequence of parathyroid hormone excess, typically the finding
    that brings an asymptomatic carrier to attention.
  phenotype_term:
    preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  notes: >-
    No evidence block is attached to this phenotype. Hypercalcaemia from MEN1
    hyperparathyroidism is not in dispute, but neither cited source states it in
    a quotable sentence, and per the evidence SOP a description without evidence
    is preferable to an unrelated snippet carrying a disclaimer. The upstream
    Primary Hyperparathyroidism phenotype carries the cited association.
- category: Endocrine
  name: Pancreatic Neuroendocrine Tumor
  description: >-
    Multicentric enteropancreatic neuroendocrine tumors, including gastrinoma
    and insulinoma; the principal cause of MEN1-specific mortality.
  phenotype_term:
    preferred_term: Pancreatic endocrine tumor
    term:
      id: HP:0030405
      label: Pancreatic endocrine tumor
  evidence:
  - reference: PMID:2894610
    reference_title: Multiple endocrine neoplasia type 1 gene maps to chromosome 11 and is lost in insulinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple endocrine neoplasia type 1 (MEN-1) is a predisposition to
      hyperplasia of the parathyroid glands, and to hyperplasia or tumours of
      the anterior pituitary and the endocrine pancreas, and is inherited as an
      autosomal dominant trait.
    explanation: >-
      Names endocrine pancreatic tumors as a defining component of the MEN1
      phenotype.
- category: Endocrine
  name: Pituitary Adenoma
  description: >-
    Anterior pituitary adenoma, most commonly prolactin-secreting; part of the
    defining triad.
  phenotype_term:
    preferred_term: Pituitary adenoma
    term:
      id: HP:0002893
      label: Pituitary adenoma
  evidence:
  - reference: PMID:9103196
    reference_title: Positional cloning of the gene for multiple endocrine neoplasia-type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple endocrine neoplasia-type 1 (MEN1) is an autosomal dominant
      familial cancer syndrome characterized by tumors in parathyroids,
      enteropancreatic endocrine tissues, and the anterior pituitary.
    explanation: >-
      Names anterior pituitary tumor as one of the three defining tumor sites.
- category: Dermatologic

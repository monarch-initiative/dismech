    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple episodes of acute photosensitivity may lead to chronic changes of sun-exposed skin (lichenification, leathery pseudovesicles, grooving around the lips) and loss of lunulae of the nails."
    explanation: >-
      GeneReviews documents the characteristic chronic lichenified and scarred

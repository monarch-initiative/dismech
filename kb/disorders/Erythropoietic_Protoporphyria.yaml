- name: NCT05308472
  phase: PHASE_II
  status: COMPLETED
  description: >-
    AURORA: a randomized, double-blind, placebo-controlled study of oral
    bitopertin, a glycine transporter-1 (GlyT1) inhibitor that limits glycine
    supply to the first step of heme biosynthesis, aiming to reduce protoporphyrin
    IX at its source (a substrate-reduction, potentially disease-modifying
    strategy distinct from the melanocortin photoprotective agents).
  target_phenotypes:
  - preferred_term: Cutaneous photosensitivity
    term:
      id: HP:0000992
      label: Cutaneous photosensitivity
  evidence:
  - reference: clinicaltrials:NCT05308472
    reference_title: "(AURORA) A Randomized, Double-blind, Placebo-Controlled Study of Bitopertin to Evaluate the Safety, Tolerability, Efficacy, and Protoporphyrin IX (PPIX) Concentrations in Participants With Erythropoietic Protoporphyria (EPP)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a Phase 2, multi-center, double-blind, placebo-controlled, parallel group study of bitopertin to evaluate the safety, tolerability, efficacy, and PPIX concentration change in participants with EPP."
    explanation: >-
      A completed phase 2 randomized trial of the oral GlyT1 inhibitor bitopertin
      targeting protoporphyrin IX reduction in EPP.

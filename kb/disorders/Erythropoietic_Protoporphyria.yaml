    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients have severe burning pain, typically on the hands and face, and this pain is often followed by swelling and redness."
    explanation: >-
      Swelling of light-exposed skin follows the phototoxic burning pain.
- category: Cutaneous
  name: Photo-induced Erythema

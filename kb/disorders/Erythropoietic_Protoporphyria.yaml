    term:
      id: hgnc:3647
      label: FECH
  notes: >-
    Loss-of-function mutations in FECH reduce ferrochelatase activity. Most
    patients carry one severe FECH mutation in trans to the common hypomorphic
    IVS3-48C low-expression allele.
  subtype: EPP
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Around 96% of patients with EPP have a loss of function FECH mutation in trans with a second low-expression pathogenic variant"
    explanation: >-
      Defines the classic FECH two-allele genotype of EPP.
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "creates a cryptic upstream acceptor site in intron 3 that modulates the alternative splicing of the normal FECH mRNA, resulting in FECH activity <30% of normal"
    explanation: >-
      Explains how the low-expression allele lowers ferrochelatase activity below
      the disease threshold.

name: Erythropoietic Protoporphyria
creation_date: "2026-07-21T00:00:00Z"
category: Mendelian
synonyms:
- EPP
- Erythrohepatic protoporphyria
- Protoporphyria
description: >-
  Erythropoietic protoporphyria (EPP) is an inherited disorder of heme
  biosynthesis caused by deficient activity of ferrochelatase (FECH), the
  terminal enzyme that inserts ferrous iron into protoporphyrin IX to form heme.
  Reduced ferrochelatase activity causes metal-free protoporphyrin IX to
  accumulate, chiefly in bone-marrow reticulocytes and circulating erythrocytes,
  and to distribute into plasma, skin, and the hepatobiliary system.
  Photoexcitation of protoporphyrin IX in dermal blood vessels by violet light
  generates reactive oxygen species that injure the vascular endothelium,
  producing the cardinal feature of acute, painful, non-blistering
  photosensitivity that begins in early childhood. Because protoporphyrin IX is
  lipophilic and excreted only in bile, it can also accumulate in hepatocytes
  and precipitate a cholestatic protoporphyric liver disease that, in a minority
  of patients, progresses to acute liver failure. Most classic EPP results from
  a loss-of-function FECH mutation in trans to the common hypomorphic
  low-expression allele IVS3-48C; a phenotypically identical X-linked form
  (X-linked protoporphyria) is caused by gain-of-function mutations in the
  erythroid-specific 5-aminolevulinate synthase ALAS2, which overproduce the
  protoporphyrin precursor pool despite normal ferrochelatase.

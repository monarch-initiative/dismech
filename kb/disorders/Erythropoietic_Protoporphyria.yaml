has_subtypes:
- name: EPP
  display_name: Autosomal Erythropoietic Protoporphyria (FECH-related)
  description: >-
    The classic and most common form (~90% of cases), caused by deficient
    ferrochelatase activity. Overt disease usually requires a loss-of-function
    FECH allele in trans to the common hypomorphic IVS3-48C low-expression
    allele, so that total ferrochelatase activity falls below the threshold
    (roughly 30% of normal) for protoporphyrin accumulation.
- name: XLP
  display_name: X-linked Protoporphyria (ALAS2-related)
  description: >-
    A phenotypically similar form caused by gain-of-function mutations
    (typically C-terminal frameshifts) in the erythroid-specific
    5-aminolevulinate synthase ALAS2. Increased ALAS2 activity overproduces the
    protoporphyrin precursor pool, so protoporphyrin IX accumulates despite
    normal ferrochelatase, with a characteristically higher zinc-protoporphyrin
    fraction than FECH-related EPP.
inheritance:
- name: Autosomal recessive
  description: >-
    FECH-related EPP is inherited as an autosomal recessive trait with a common
    hypomorphic modifier allele: clinically overt disease typically requires a
    severe loss-of-function FECH mutation on one allele together with the
    low-expression IVS3-48C polymorphism on the other allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPP is autosomal recessive in inheritance"
    explanation: >-
      This review states the autosomal recessive inheritance of FECH-related EPP.
  - reference: PMID:10068685
    reference_title: "Inheritance in erythropoietic protoporphyria: a common wild-type ferrochelatase allelic variant with low expression accounts for clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPP may thus be considered as an inherited disorder that does not strictly follow recessive or dominant rules."
    explanation: >-
      The two-hit model (severe FECH mutation in trans to a low-expression
      allele) explains why EPP does not follow simple Mendelian rules.
  - reference: PMID:23016163
    reference_title: "Erythropoietic Protoporphyria, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In about  96% of cases an affected individual inherits a loss-of-function FECH allele from  one parent and a low-expression FECH allele from the other parent."
    explanation: >-
      GeneReviews genetic-counseling section quantifies the two-allele
      transmission model underlying autosomal recessive EPP.
- name: X-linked
  description: >-
    X-linked protoporphyria is caused by gain-of-function ALAS2 mutations on the
    X chromosome.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:18760763
    reference_title: "C-terminal deletions in the ALAS2 gene lead to gain of function and cause X-linked dominant protoporphyria without anemia or iron overload."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These gain-of-function mutations cause a previously unrecognized form of porphyria, X-linked dominant protoporphyria"
    explanation: >-
      Gain-of-function ALAS2 mutations define the X-linked form of protoporphyria.
  - reference: PMID:23409301
    reference_title: "X-Linked Protoporphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected males transmit the pathogenic variant to all of their daughters and  none of their sons. Women with an ALAS2 pathogenic variant have a 50% chance of  transmitting the variant to each child."
    explanation: >-
      GeneReviews genetic-counseling section describes the X-linked transmission
      pattern of XLP.
pathophysiology:
- name: Ferrochelatase Enzymatic Deficiency
  description: >-
    Ferrochelatase (FECH), the terminal enzyme of heme biosynthesis, catalyzes
    insertion of ferrous iron into protoporphyrin IX to form heme. In FECH-related
    EPP, one severe loss-of-function allele in trans to the low-expression
    IVS3-48C allele reduces total ferrochelatase activity below roughly 30% of
    normal, the threshold needed to keep pace with protoporphyrin production.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: heme biosynthesis
    term:
      id: GO:0006783
      label: heme biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPP results from the deficient activity of ferrochelatase, the final enzyme in the heme-biosynthetic pathway"
    explanation: >-
      Establishes ferrochelatase deficiency as the primary lesion of EPP.
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When FECH is deficient to <30% enzyme activity, there is an increased accumulation of PPIX"
    explanation: >-
      Quantifies the ferrochelatase activity threshold below which protoporphyrin
      accumulates.
  - reference: PMID:10068685
    reference_title: "Inheritance in erythropoietic protoporphyria: a common wild-type ferrochelatase allelic variant with low expression accounts for clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "coinheritance of a FECH gene defect and a wild-type low-expressed allele is generally involved in the clinical expression of EPP"
    explanation: >-
      Documents the two-allele requirement that drives ferrochelatase activity
      below the disease threshold.
  downstream:
  - target: Erythroid Protoporphyrin IX Accumulation
    causal_link_type: DIRECT
    description: >-
      Failure to consume protoporphyrin IX allows the substrate to accumulate.
- name: ALAS2 Gain-of-Function Precursor Overproduction
  description: >-
    In X-linked protoporphyria, gain-of-function C-terminal mutations in the
    erythroid-specific 5-aminolevulinate synthase ALAS2 increase the rate of the
    first, committed step of heme biosynthesis. The resulting excess flux through
    the pathway overwhelms normal ferrochelatase capacity, so protoporphyrin IX
    (with a relatively higher zinc-protoporphyrin fraction) still accumulates.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: porphyrin biosynthesis
    term:
      id: GO:0006779
      label: porphyrin-containing compound biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:18760763
    reference_title: "C-terminal deletions in the ALAS2 gene lead to gain of function and cause X-linked dominant protoporphyria without anemia or iron overload."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Prokaryotic expression studies show that both mutations markedly increase ALAS2 activity."
    explanation: >-
      In vitro expression demonstrates the gain-of-function increase in ALAS2
      enzymatic activity.
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the rate of ALA formation is increased, and the insertion of iron into PPIX by FECH becomes rate-limiting for heme synthesis in erythroid tissues resulting in accumulation of protoporphyrin"
    explanation: >-
      Increased precursor flux makes normal ferrochelatase rate-limiting, so
      protoporphyrin accumulates in XLP.
  downstream:
  - target: Erythroid Protoporphyrin IX Accumulation
    causal_link_type: DIRECT
    description: >-
      Precursor overproduction drives protoporphyrin IX beyond ferrochelatase
      capacity.
- name: Erythroid Protoporphyrin IX Accumulation
  description: >-
    Whether from deficient ferrochelatase or excess precursor supply, metal-free
    protoporphyrin IX accumulates. It is generated chiefly by bone-marrow
    reticulocytes and late erythroid precursors, then loaded into circulating
    erythrocytes and released into plasma, from which it distributes to skin and
    the hepatobiliary system.
  cell_types:
  - preferred_term: reticulocyte
    term:
      id: CL:0000558
      label: reticulocyte
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protoporphyrin is released from the bone marrow into the circulating erythrocytes and plasma where it is taken up by the liver and vascular endothelium including the superficial skin vasculature."
    explanation: >-
      Describes the erythroid origin and distribution of accumulated
      protoporphyrin to skin and liver.
  downstream:
  - target: Cutaneous Photoexcitation of Protoporphyrin IX
    causal_link_type: DIRECT
    description: >-
      Protoporphyrin IX distributed to dermal blood absorbs light.
  - target: Hepatobiliary Protoporphyrin Loading
    causal_link_type: DIRECT
    description: >-
      Plasma protoporphyrin IX is taken up by hepatocytes for biliary excretion.
- name: Cutaneous Photoexcitation of Protoporphyrin IX
  description: >-
    Protoporphyrin IX circulating in dermal blood vessels absorbs visible violet
    light near its 400-410 nm Soret band. The photoexcited porphyrin transfers
    energy to molecular oxygen, so that light exposure of the skin converts an
    otherwise inert accumulated pigment into a localized photochemical source.
  cell_types:
  - preferred_term: dermal microvascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: response to light
    term:
      id: GO:0009416
      label: response to light stimulus
  evidence:
  - reference: PMID:26132941
    reference_title: "Afamelanotide for Erythropoietic Protoporphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the skin is exposed to sun or visible light, the accumulated phototoxic protoporphyrin in superficial vessels is activated by blue light (400 to 410 nm), triggering singlet oxygen free-radical reactions"
    explanation: >-
      Identifies the 400-410 nm blue-light activation of protoporphyrin as the
      initiating photochemical event.
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The protoporphyrin molecules are photodynamic and absorb light radiation in visible blue-violet light in the Soret band"
    explanation: >-
      Confirms the photodynamic light absorption of protoporphyrin in the Soret
      band.
  downstream:
  - target: Phototoxic Reactive Oxygen Species Dermal Injury
    causal_link_type: DIRECT
    description: >-
      Photoexcited protoporphyrin IX transfers energy to oxygen, generating
      reactive oxygen species.
- name: Phototoxic Reactive Oxygen Species Dermal Injury
  description: >-
    Energy transfer from photoexcited protoporphyrin IX to oxygen generates
    singlet oxygen and other reactive oxygen species in and around dermal
    capillaries. These oxidize endothelial membranes, activate complement, and
    release histamines and chemotactic factors, producing perivascular tissue and
    vessel damage that is experienced as immediate burning pain, and clinically as
    erythema and edema.
  cell_types:
  - preferred_term: dermal microvascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: reactive oxygen species production
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This energy is presumably released as fluorescence and by formation of singlet oxygen and other oxygen radicals that can produce tissue and vessel damage secondary to activation of the complement system."
    explanation: >-
      Singlet oxygen and radicals cause the complement-associated vascular tissue
      damage underlying the phototoxic reaction.
- name: Hepatobiliary Protoporphyrin Loading
  description: >-
    Protoporphyrin IX is lipophilic and cannot be excreted by the kidney; its
    only elimination route is biliary. Hepatocytes take up the excess
    protoporphyrin IX from plasma and concentrate it for biliary excretion, and
    when biliary excretion cannot keep pace with the load the pigment
    progressively accumulates in the liver.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive accumulation of protoporphyrin may occur in the liver when the biliary excretion does not keep pace with the load being presented to the liver."
    explanation: >-
      Biliary-only excretion and hepatic uptake set up progressive hepatic
      protoporphyrin loading.
  downstream:
  - target: Cholestatic Protoporphyric Hepatopathy
    causal_link_type: DIRECT
    description: >-
      Precipitated protoporphyrin IX impairs bile flow and injures hepatocytes.
- name: Cholestatic Protoporphyric Hepatopathy
  description: >-
    Precipitated protoporphyrin IX is choleotoxic and cholestatic: it impairs
    bile flow, which in turn reduces the biliary excretion of protoporphyrin and
    drives further hepatic accumulation in a self-amplifying cycle. Progressive
    cholestatic injury causes hepatocellular damage and, in a minority of
    patients, cirrhosis and acute protoporphyric liver failure.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accumulated hepatic protoporphyrin can precipitate in hepatocytes and bile canaliculi, causing hepatotoxicity, decreased bile formation and flow, and cholestatic liver failure in some patients"
    explanation: >-
      Hepatic protoporphyrin precipitation causes cholestasis, hepatotoxicity,
      and liver failure.
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When hepatocellular damage reaches a critical stage, protoporphyrin accumulation will rapidly accelerate due to marked impairment of biliary excretion"
    explanation: >-
      Documents the self-amplifying cholestatic cycle in which liver injury
      further impairs protoporphyrin excretion.
phenotypes:
- category: Cutaneous
  name: Acute Photosensitivity
  description: >-
    Immediate, painful, non-blistering photosensitivity is the cardinal feature,
    beginning in infancy or childhood. Within minutes of sun exposure patients
    feel tingling, burning, pain, and itching of exposed skin, followed by
    erythema and edema.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Cutaneous photosensitivity
    term:
      id: HP:0000992
      label: Cutaneous photosensitivity
  evidence:
  - reference: PMID:23016163
    reference_title: "Erythropoietic Protoporphyria, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cutaneous photosensitivity (usually beginning in infancy or childhood) that results in tingling, burning, pain, and itching within 30 minutes after exposure to sun or ultraviolet light and may be accompanied by swelling and redness."
    explanation: >-
      GeneReviews identifies acute cutaneous photosensitivity as the defining,
      near-universal feature of EPP.
  - reference: PMID:26132941
    reference_title: "Afamelanotide for Erythropoietic Protoporphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Photosensitivity in patients with erythropoietic protoporphyria usually manifests in early childhood; it occurs 1 to 20 minutes after direct exposure to the sun."
    explanation: >-
      Confirms early-childhood onset and rapid (minutes) reaction to sun exposure.
- category: Cutaneous
  name: Photo-induced Edema
  description: >-

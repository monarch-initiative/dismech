treatments:
- name: Afamelanotide
  description: >-
    Afamelanotide is a synthetic alpha-melanocyte-stimulating hormone
    (alpha-MSH) analog and melanocortin-1 receptor agonist that increases
    epidermal eumelanin, providing photoprotection and increasing pain-free
    sunlight tolerance in EPP.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: afamelanotide
      term:
        id: CHEBI:136034
        label: afamelanotide
  target_mechanisms:
  - target: Cutaneous Photoexcitation of Protoporphyrin IX
    treatment_effect: INHIBITS
    description: >-
      Increased epidermal eumelanin absorbs and scatters incident light, reducing
      the visible light that reaches and photoexcites dermal protoporphyrin.
  target_phenotypes:
  - preferred_term: Cutaneous photosensitivity
    term:
      id: HP:0000992
      label: Cutaneous photosensitivity
  evidence:
  - reference: PMID:26132941
    reference_title: "Afamelanotide for Erythropoietic Protoporphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pain-free time in direct sunlight was 70% longer among patients who received afamelanotide than among patients who received placebo"
    explanation: >-
      Randomized-trial evidence that afamelanotide increases pain-free sun
      exposure.
  - reference: PMID:23016163
    reference_title: "Erythropoietic Protoporphyria, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This medication increases pain-free sun exposure and has improved quality of life in those with EPP."
    explanation: >-
      Afamelanotide improves pain-free sun exposure and quality of life.
- name: Sunlight Avoidance and Photoprotection
  description: >-
    Strict avoidance of sunlight and use of visible-light-blocking (reflectant)
    physical sunscreens and protective clothing remain foundational management.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:23016163
    reference_title: "Erythropoietic Protoporphyria, Autosomal Recessive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current management centers on prevention of the painful attacks by avoidance of sun/light"
    explanation: >-
      Sun/light avoidance is the foundational management strategy.
- name: Bile Acid Sequestrant Therapy
  description: >-
    Bile acid sequestrants such as cholestyramine (and ursodeoxycholic acid) are
    used to increase fecal excretion of protoporphyrin and interrupt its
    enterohepatic circulation in protoporphyric liver disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Hepatobiliary Protoporphyrin Loading
    treatment_effect: INHIBITS
    description: >-
      Interrupting the enterohepatic circulation of protoporphyrin promotes its
      fecal excretion, lowering the hepatic protoporphyrin load.
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bile acid sequestrants such as cholestyramine and other drugs such as ursodeoxycholelic acid have been used to increase the excretion of protoporphyrin through the biliary system"
    explanation: >-
      Bile acid sequestrants promote protoporphyrin excretion in hepatic disease.
- name: Vitamin D Supplementation
  description: >-
    Because strict sun avoidance predisposes to vitamin D deficiency, routine
    vitamin D supplementation is recommended in EPP and XLP.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPP and XLP patients can develop vitamin D deficiency secondary to sun avoidance"
    explanation: >-
      Sun avoidance causes vitamin D deficiency, the rationale for supplementation.
- name: Liver Transplantation
  description: >-
    Liver transplantation treats end-stage protoporphyric liver disease but is
    not curative, because the bone marrow remains the source of protoporphyrin;
    intraoperative light filters blocking wavelengths below 470 nm are used to
    prevent phototoxic tissue burns.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: MAXO:0001175
      label: liver transplantation
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "liver transplant is not curative as the primary source of protoporphyrin production is the bone marrow and liver transplant does not correct the underlying genetic defect"
    explanation: >-
      Liver transplant treats hepatic failure but does not correct the erythroid
      source of protoporphyrin.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Hematopoietic (bone marrow) stem cell transplantation can correct the
    erythroid source of protoporphyrin overproduction and is potentially
    curative; sequential liver and bone marrow transplantation has cured
    protoporphyric liver disease.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: MAXO:0000747
      label: hematopoietic stem cell transplantation
  target_mechanisms:
  - target: Erythroid Protoporphyrin IX Accumulation
    treatment_effect: INHIBITS
    description: >-
      Replacing the patient's erythron with donor hematopoietic cells removes the
      bone-marrow source of protoporphyrin overproduction.
  evidence:
  - reference: PMID:30704898
    reference_title: "Erythropoietic Protoporphyria and X-Linked Protoporphyria: pathophysiology, genetics, clinical manifestations, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow transplant can be curative and sequential liver and bone marrow transplant has been successful in curing protoporphyric liver disease"
    explanation: >-
      Bone marrow transplantation corrects the erythroid protoporphyrin source
      and can cure protoporphyric liver disease.

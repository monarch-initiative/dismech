  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Most pilocytic astrocytomas are initiated by tandem-duplication-mediated
    KIAA1549-BRAF fusion or related RAF1/BRAF fusions and activating point
    mutations that remove N-terminal RAF autoinhibition and create
    ligand-independent upstream MAPK kinase kinase activity.

- accession: ega:EGAS00001002149
  title: RNA-sequencing of six Pilocytic astrocytoma tumors
  description: Pilocytic astrocytoma (PA) is the most common pediatric brain tumor. A recurrent feature of PA is deregulation of the mitogen activated protein kinase (MAPK) pathway most often through KIAA1549-BRAF fusion, but also by other BRAF- or RAF1-gene fusions and point mutations (e.g. BRAFV600E). These features may serve as diagnostic and prognostic markers, and also facilitate development of targeted therapy. The aim of this study was to characterize the genetic alterations underlying the development of PA tumor in six cases, and evaluate methods for fusion oncogene detection.

  - reference: NCIT:C106254
    reference_title: "Tovorafenib (NCIT)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tovorafenib | Accepted_Therapeutic_Use_For | - | - | for patients 6 months of age and older with relapsed or refractory pediatric low-grade glioma (LGG) harboring a BRAF fusion or rearrangement, or BRAF V600 mutation."
    explanation: >-
      NCI Thesaurus asserts accepted therapeutic use of tovorafenib for relapsed
      or refractory pediatric low-grade glioma with BRAF alteration; pilocytic
      astrocytoma is the prototypical BRAF-fusion pediatric low-grade glioma.
  - reference: PMID:39412085
    reference_title: "Type II RAF inhibitor tovorafenib for the treatment of pediatric low-grade glioma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      On 23 April 2024, the U.S. FDA approved a new type II RAF inhibitor,
      tovorafenib (OJEMDATM), previously known as DAY101, for the treatment of
      patients aged 6 months and older with relapsed or refractory (R/R) pLGG
      harboring a BRAF fusion or rearrangement, or BRAF V600E mutation.
    explanation: >-
      Review-level evidence supports current clinical use of tovorafenib in
      recurrent BRAF-altered pediatric low-grade glioma, a setting directly
      relevant to many recurrent PA cases.

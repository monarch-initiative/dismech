- accession: ega:EGAS00001006388
  title: Detection and genomic analysis of BRAF fusions in Juvenile Pilocytic Astrocytoma through the combination and integration of multi-omic data
  description: Juvenile Pilocytic Astrocytoma (JPAs) are highly vascular tumors and show pervasive immune infiltration, which can lead to low tumor cell purity in clinical samples. In some instances, this results in gene fusions that are difficult to detect with conventional omics approaches including RNA-Seq. To this effect, we applied RNA-Seq as well as linked-read whole-genome sequencing and in situ Hi-C as new approaches to detect and characterize low-frequency gene fusions at the genomic, transcriptomic and spatial level. Overall, we demonstrate the power of integrating multi-omic datasets to identify low frequency fusions and characterize the JPA genome at high resolution.

      label: MAP kinase kinase kinase activity
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:28448514
    reference_title: "A new GTF2I-BRAF fusion mediating MAPK pathway activation in pilocytic astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A recurrent feature of PA is deregulation of the mitogen activated protein
      kinase (MAPK) pathway most often through KIAA1549-BRAF fusion, but also by
      other BRAF- or RAF1-gene fusions and point mutations (e.g. BRAFV600E).
    explanation: >-
      Human tumor profiling supports BRAF and RAF1 fusion or activating
      point-mutation formation as the dominant somatic initiating event in PA.
  - reference: PMID:36786200
    reference_title: "Pilocytic astrocytoma harboring a novel GNAI3-BRAF fusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Among the several fusion partner genes identified in PAs, KIAA1549-BRAF
      fusion is notably the most common detectable genetic alteration, especially
      in the cerebellar PAs.
    explanation: >-
      Corroborates KIAA1549-BRAF fusion as the predominant oncogenic fusion
      driver in pilocytic astrocytoma.
  - reference: ORPHA:251612
    reference_title: "Pilocytic astrocytoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecularly, it exhibits alterations in genes of the MAPK signaling
      pathway, most commonly <i>KIAA1549::BRAF</i> fusion.
    explanation: >-
      Orphanet disease definition confirms KIAA1549::BRAF fusion as the canonical
      MAPK-activating molecular lesion in pilocytic astrocytoma.
  downstream:
  - target: Constitutive MAPK Cascade Activation
    causal_link_type: DIRECT
    description: Constitutively active RAF fusion and mutant RAF kinases directly phosphorylate MEK to sustain MAPK pathway output.
- name: NF1 Tumor Suppressor Inactivation
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE_AND_SOMATIC
  description: >-
    In neurofibromatosis type 1-associated pilocytic astrocytoma (predominantly
    optic pathway glioma), constitutional NF1 mutation followed by somatic
    second-hit NF1 inactivation eliminates neurofibromin Ras-GAP activity and
    uncouples Ras-MAPK signaling from negative feedback.

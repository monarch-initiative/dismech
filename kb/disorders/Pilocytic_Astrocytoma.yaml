genetic:
- name: BRAF
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  association: Somatic activating fusion or mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:28448514
    reference_title: "A new GTF2I-BRAF fusion mediating MAPK pathway activation in pilocytic astrocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A recurrent feature of PA is deregulation of the mitogen activated protein
      kinase (MAPK) pathway most often through KIAA1549-BRAF fusion, but also by
      other BRAF- or RAF1-gene fusions and point mutations (e.g. BRAFV600E).
    explanation: >-
      Supports BRAF as the dominant somatic driver locus in PA through fusion and
      point-mutation mechanisms.
  notes: >-
    KIAA1549-BRAF fusion is the dominant alteration in childhood and cerebellar PA,
    while BRAFV600E is a less common alternative driver.

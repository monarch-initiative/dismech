    Tovorafenib is an FDA-approved type II RAF inhibitor for relapsed or
    refractory pediatric low-grade glioma with BRAF fusion, rearrangement, or
    V600E mutation, making it directly relevant to recurrent BRAF-altered PA.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: tovorafenib
      term:
        id: NCIT:C106254
        label: Tovorafenib
  target_mechanisms:
  - target: Constitutive MAPK Cascade Activation
    treatment_effect: INHIBITS
    description: Type II RAF inhibition targets the upstream RAF/MAPK dependency in BRAF-altered PA without paradoxical MAPK activation.
    evidence:
    - reference: PMID:39412085
      reference_title: "Type II RAF inhibitor tovorafenib for the treatment of pediatric low-grade glioma."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        As the first and only FDA-approved medicine for children with BRAF fusions
        or rearrangements, which are the most common molecular alteration in pLGG,
        tovorafenib shows superior central nervous system penetration without the
        paradoxical activation of the MAPK pathway reported for type I BRAF
        inhibitors.
      explanation: >-
        Supports type II RAF inhibition of BRAF-fusion-driven MAPK signaling
        without paradoxical pathway activation.

    term:
      id: hgnc:7765
      label: NF1
  association: Germline tumor predisposition with biallelic tumor inactivation context
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE_AND_SOMATIC
  evidence:
  - reference: PMID:35945463
    reference_title: "Multiplatform molecular analyses refine classification of gliomas arising in patients with neurofibromatosis type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The first harbored biallelic NF1 inactivation only, occurred primarily during
      childhood, followed a more indolent clinical course, and had a unique
      epigenetic signature for which we propose the terminology "pilocytic
      astrocytoma, arising in the setting of NF1".
    explanation: >-
      Supports NF1-associated PA as a predisposition-context subset with biallelic
      NF1 inactivation converging on the same piloid disease program.
  notes: >-
    NF1-associated optic pathway gliomas are usually pilocytic and often follow a
    childhood-onset, indolent course.

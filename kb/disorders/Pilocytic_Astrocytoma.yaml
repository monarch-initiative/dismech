diagnosis:
- name: Neuroimaging
  description: >-
    Brain neuroimaging identifies the classic radiological appearance of a
    well-circumscribed low-grade tumor, localizing lesions within the
    cerebellum, optic pathways, hypothalamus, brainstem, or cerebral
    hemispheres to guide surgical planning.
  diagnosis_term:
    preferred_term: neuroimaging
    term:
      id: NCIT:C173635
      label: Neuroimaging
  evidence:
  - reference: PMID:36786200
    reference_title: "Pilocytic astrocytoma harboring a novel GNAI3-BRAF fusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      This low-grade tumor is well recognized for its classic radiological and
      morphological features; however, some unique molecular findings have been
      unveiled by the application of next-generation sequencing (NGS).
    explanation: >-
      Supports characteristic radiological features on neuroimaging as a primary
      diagnostic pillar for pilocytic astrocytoma.
- name: Histopathologic Examination
  description: >-
    Histopathologic evaluation of resected or biopsied tumor tissue confirms the
    classic biphasic piloid and microcystic architecture with Rosenthal fibers
    and eosinophilic granular bodies, and identifies vascular surrogate features
    in atypical cases.
  diagnosis_term:
    preferred_term: histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:16998597
    reference_title: "Neuropathological spectrum of pilocytic astrocytoma: an Indian series of 120 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      On histopathology, biphasic pattern (89.2%) along with Rosenthal fibers
      (66.7%) and eosinophilic granular bodies (60%) were present in the majority
      of cases.
    explanation: >-
      Establishes histopathologic identification of biphasic architecture,
      Rosenthal fibers, and eosinophilic granular bodies across a 120-case PA
      series.
- name: Molecular Genetic Profiling
  description: >-
    Molecular testing (including next-generation sequencing and fusion panels)
    identifies KIAA1549-BRAF or alternative BRAF/RAF1 fusions, BRAF V600E
    mutations, or NF1 inactivation to confirm diagnosis and guide RAF/MEK
    targeted therapy.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36786200
    reference_title: "Pilocytic astrocytoma harboring a novel GNAI3-BRAF fusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of note, NGS detected a novel GNAI3-BRAF fusion, which results in an
      in-frame fusion protein containing the kinase domain of BRAF. This finding
      expands the knowledge of BRAF fusions in the tumorigenesis of PAs, provides
      an additional molecular signature for diagnosis, and a target for future
      therapy.
    explanation: >-
      Demonstrates molecular fusion profiling by NGS as both a diagnostic
      signature and a predictive biomarker for targeted therapy in PA.
treatments:
- name: Gross Total Resection
  description: >-
    Gross total resection is preferred for surgically accessible tumors and remains
    the core first-line treatment for most cerebellar PA.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gross total resection
    term:
      id: NCIT:C131672
      label: Gross Total Resection
  target_mechanisms:
  - target: Circumscribed Low-Grade Glioma Growth
    treatment_effect: INHIBITS
    description: Complete neurosurgical removal eliminates the circumscribed low-grade tumor mass.
    evidence:
    - reference: PMID:37021292
      reference_title: "Cerebellar pilocytic astrocytoma. Retrospective cohort study assessing postoperative functional outcome, cerebellar mutism and hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Early treatment with the intention of GTR should be considered, opting, if
        this is not possible, to leave a tumor residue over neurological damage.
      explanation: >-
        Supports surgical resection of the circumscribed cerebellar tumor mass
        while sparing eloquent neural tissue.
  - target: Local Mass Effect and Anatomic Compression
    treatment_effect: INHIBITS
    description: Surgical removal of the tumor mass relieves local posterior-fossa compression and obstructive hydrocephalus.
    evidence:
    - reference: PMID:37021292
      reference_title: "Cerebellar pilocytic astrocytoma. Retrospective cohort study assessing postoperative functional outcome, cerebellar mutism and hydrocephalus."
      supports: SUPPORT

  evidence:
  - reference: PMID:35945463
    reference_title: "Multiplatform molecular analyses refine classification of gliomas arising in patients with neurofibromatosis type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The first harbored biallelic NF1 inactivation only, occurred primarily during
      childhood, followed a more indolent clinical course, and had a unique
      epigenetic signature for which we propose the terminology "pilocytic
      astrocytoma, arising in the setting of NF1".
    explanation: >-
      Genomic and methylation profiling of human NF1-associated gliomas defines
      biallelic NF1 inactivation as the sole initiating molecular lesion in the
      childhood pilocytic astrocytoma subgroup.
  - reference: PMID:38837168
    reference_title: "An Overview of Optic Pathway Glioma With Neurofibromatosis Type 1: Pathogenesis, Risk Factors, and Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      First, the loss of the NF1 gene activates 3 distinct Ras effector pathways,
      including the PI3K/AKT/mTOR pathway, the MEK/ERK pathway, and the cAMP
      pathway, which mediate glioma tumorigenesis.
    explanation: >-
      Loss of neurofibromin Ras-GAP activity derepresses Ras effector signaling,
      including the MEK/ERK MAPK cascade, in NF1-associated pilocytic astrocytoma.
  downstream:
  - target: Constitutive MAPK Cascade Activation
    causal_link_type: DIRECT
    description: Loss of neurofibromin Ras-GAP activity maintains active GTP-bound Ras and drives constitutive MEK/ERK MAPK cascade activation.

- accession: dbgap:phs000563
  title: Pilocytic Astrocytoma in NF1
  description: Neurofibromatosis type 1 (NF1) inherited cancer predisposition syndrome is one of the most common autosomal dominant tumor predisposition syndromes in which affected individuals develop brain tumors. These low-grade glial neoplasms (pilocytic astrocytomas) typically arise in children younger than 7 years of age and are hypothesized to result from a combination of germline and acquired somatic NF1 tumor suppressor gene mutations.

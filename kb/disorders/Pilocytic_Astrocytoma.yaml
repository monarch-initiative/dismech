    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
  target_mechanisms:
  - target: Circumscribed Low-Grade Glioma Growth
    treatment_effect: INHIBITS
    description: Cytotoxic chemotherapy provides multi-year disease control (event-free survival) for residual, progressive, or unresectable low-grade gliomas.
    evidence:
    - reference: PMID:22665535
      reference_title: "Randomized study of two chemotherapy regimens for treatment of low-grade glioma in young children: a report from the Children's Oncology Group."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The 5-year EFS rates were 39% ± 4% for CV and 52% ± 5% for TPCV
        (stratified log-rank test P = .10; cure model analysis P = .007).
      explanation: >-
        Demonstrates 5-year event-free survival disease control with carboplatin
        and vincristine (CV) in progressive or residual pediatric low-grade gliomas.

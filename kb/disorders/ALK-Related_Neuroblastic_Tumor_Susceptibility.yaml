phenotypes:
- category: Neoplasm
  name: Neuroblastoma
  description: >-
    The dominant manifestation and the reason the syndrome is clinically
    important. Risk is highest in infancy and falls through childhood.
    Multifocal and bilateral primary tumors are the hallmark that should raise
    suspicion of a germline ALK variant: all three germline variants in the
    French series arose in multifocal cases, against a background rate of 3-4%
    bilateral or multifocal primaries among neuroblastoma patients generally.
    There is no HPO term for multifocal primary neuroblastoma, so that feature
    is carried here rather than bound.
  phenotype_term:
    preferred_term: Neuroblastoma
    term:
      id: HP:0003006
      label: Neuroblastoma
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ALK-related neuroblastic tumor susceptibility is characterized by increased risk for neuroblastic tumors including neuroblastomas, ganglioneuroblastomas, and ganglioneuromas."

  penetrance: INCOMPLETE
  penetrance_percentage: '50'
  expressivity: VARIABLE
  de_novo_rate: unknown
  description: >-
    Transmitted as a dominant trait with reduced penetrance, so a variant is
    frequently inherited from a clinically unaffected parent. Each child of a
    carrier has a 50% chance of inheriting the variant; the chance that an
    inheriting child develops a tumor is about 50% again. Penetrance for any
    neuroblastic tumor is approximately 50%, age-dependent and highest in
    infancy. Expressivity is highly variable within a single family: tumor type
    (neuroblastoma versus ganglioneuroma), site, number of foci, stage and
    outcome all differ between carriers of the same allele, and obligate
    carriers who never develop a tumor are common. GeneReviews states
    explicitly that the proportion of probands with a de novo variant has not
    been established.
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ALK-related neuroblastic tumor susceptibility is inherited in an autosomal dominant manner."
    explanation: States the mode of inheritance bound here.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because of reduced penetrance, a parent may have a germline ALK activating pathogenic variant without having developed a neuroblastic tumor."
    explanation: Source for the reduced penetrance and the unaffected transmitting parent.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood."
    explanation: Source for the 50% penetrance figure and its age dependence.
  - reference: PMID:22071890
    reference_title: "ALK germline mutations in patients with neuroblastoma: a rare and weakly penetrant syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two mutations (T1151R and R1192P) were inherited and shared by several unaffected patients, thus illustrating an incomplete penetrance."
    explanation: Primary observation of incomplete penetrance in transmitting families.
pathophysiology:
- name: Germline ALK Kinase Domain Activating Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense substitution in the ALK tyrosine kinase domain is
    present in every cell from conception. The recurrent alleles reported in
    neuroblastoma families - R1275Q, G1128A, R1192P and T1151M/T1151R - all lie
    in the kinase domain. No germline truncating, frameshift, splice or
    whole-gene deletion allele causes this syndrome: the mechanism is gain of
    function, so loss-of-function alleles are not causal.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous activating missense variant in the ALK kinase domain,
      inherited from a frequently unaffected parent or arising de novo.
  genes:
  - preferred_term: ALK
    term:
      id: hgnc:427
      label: ALK
  molecular_functions:
  - preferred_term: ALK receptor tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
  evidence:
  - reference: PMID:18724359
    reference_title: Identification of ALK as a major familial neuroblastoma predisposition gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resequencing of regional candidate genes identified three separate germline missense mutations in the tyrosine kinase domain of ALK that segregated with the disease in eight separate families."
    explanation: The founding linkage and resequencing study placing the causal lesion in the ALK kinase domain.
  - reference: PMID:18923523
    reference_title: Somatic and germline activating mutations of the ALK kinase receptor in neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations were observed in two neuroblastoma families, indicating that ALK is a neuroblastoma predisposition gene."
    explanation: Independent concurrent identification of ALK as the predisposition gene.
  downstream:
  - target: Constitutive Ligand-Independent ALK Kinase Activation
    causal_link_type: DIRECT
    description: >-
      The substitution destabilises the autoinhibited conformation of the
      kinase, so the receptor signals without its ALKAL ligands.
    evidence:
    - reference: PMID:18724359
      reference_title: Identification of ALK as a major familial neuroblastoma predisposition gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations resulted in constitutive phosphorylation"
      explanation: Directly links the kinase-domain substitutions to constitutive receptor phosphorylation.
- name: Constitutive Ligand-Independent ALK Kinase Activation
  biological_scale: MOLECULAR
  description: >-
    The mutant receptor autophosphorylates and signals continuously, bypassing
    the normal activation route in which ALKAL1 and ALKAL2 binding rearranges
    the extracellular region to bring two receptors together at the membrane.

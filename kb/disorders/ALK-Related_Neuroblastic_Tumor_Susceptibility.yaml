genetic:
- name: ALK
  gene_term:
    preferred_term: ALK
    term:
      id: hgnc:427
      label: ALK
  association: Germline activating missense variants in the tyrosine kinase domain
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ba9f692d-9b6d-4d46-8bfa-009ec20ae538-2022-12-30T180000.000Z
    evidence:
    - reference: CGGV:assertion_ba9f692d-9b6d-4d46-8bfa-009ec20ae538-2022-12-30T180000.000Z
      reference_title: "ALK / neuroblastoma, susceptibility to, 3 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ALK | HGNC:427 | neuroblastoma, susceptibility to, 3 | MONDO:0013083 | AD | Definitive"
      explanation: ClinGen classifies the ALK relationship with this exact MONDO disease as definitive.
  notes: >-
    ALK lies at 2p23, immediately centromeric to MYCN at 2p24, and encodes a
    single-pass receptor tyrosine kinase of the insulin-receptor superfamily.
    Every disease-associated germline allele reported to date is a heterozygous
    missense substitution in the kinase domain; there is no germline truncating,
    splice or whole-gene deletion mechanism, because the disease mechanism is
    gain of function. The same residues recur far more often as somatic events
    in sporadic neuroblastoma, so allele fraction is the practical discriminator
    on tumor-only sequencing: a germline variant sits at about 50% in every
    cell. Not every kinase-domain substitution is activating, and establishing
    that a given variant activates the kinase is part of making the diagnosis
    rather than an assumption that follows from its position.
  variants:
  - name: p.Arg1275Gln
    description: >-
      The most frequent germline allele and, after F1174, the most frequent
      somatic hotspot. It is the allele most often reported as crizotinib
      sensitive.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18724359
      reference_title: Identification of ALK as a major familial neuroblastoma predisposition gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Resequencing of regional candidate genes identified three separate germline missense mutations in the tyrosine kinase domain of ALK that segregated with the disease in eight separate families."
      explanation: The linkage study in which this and the other founding germline alleles were identified.
  - name: p.Arg1192Pro
    description: >-
      A segregating family allele, also found inherited by several unaffected
      relatives in a French multifocal series - one of the two variants that
      directly demonstrate incomplete penetrance.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22071890
      reference_title: "ALK germline mutations in patients with neuroblastoma: a rare and weakly penetrant syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two mutations (T1151R and R1192P) were inherited and shared by several unaffected patients, thus illustrating an incomplete penetrance."
      explanation: Documents inheritance of this allele by unaffected carriers.
  - name: p.Thr1151Arg
    description: >-
      The second of the two inherited alleles shared with unaffected relatives
      in the French series. The related substitution T1151M was reported in the
      original linkage work.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22071890
      reference_title: "ALK germline mutations in patients with neuroblastoma: a rare and weakly penetrant syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two mutations (T1151R and R1192P) were inherited and shared by several unaffected patients, thus illustrating an incomplete penetrance."
      explanation: Documents inheritance of this allele by unaffected carriers.
  evidence:
  - reference: PMID:18724359
    reference_title: Identification of ALK as a major familial neuroblastoma predisposition gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "germline mutations in the anaplastic lymphoma kinase (ALK) gene explain most hereditary neuroblastomas"
    explanation: Establishes ALK as the principal familial neuroblastoma gene.
  - reference: PMID:18923523
    reference_title: Somatic and germline activating mutations of the ALK kinase receptor in neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations were observed in two neuroblastoma families, indicating that ALK is a neuroblastoma predisposition gene."
    explanation: Independent identification of ALK as a predisposition gene.
  - reference: PMID:38860978
    reference_title: Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "several groups determined that activating GPVs in ALK accounted for a substantial number of familial NB"
    explanation: Consensus statement that germline ALK variants account for much of familial neuroblastoma.
- name: MYCN
  gene_term:
    preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  association: Somatic amplification cooperating with the germline ALK allele
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  notes: >-
    MYCN is not a second predisposition gene here. Its role is as the
    cooperating somatic lesion whose acquisition converts the permissive
    carrier state into a tumor, and the cooperation is bidirectional: activated
    ALK raises MYCN protein dosage through PI3K-AKT-mTOR and suppresses its
    pro-apoptotic arm, while MYCN overexpression supplies the hyperplasia and
    the apoptotic trigger that ALK then blocks.
  evidence:
  - reference: PMID:22439933
    reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Amplification of the MYCN oncogene in childhood neuroblastoma is often accompanied by mutational activation of ALK (anaplastic lymphoma kinase), suggesting their pathogenic cooperation."
    explanation: >-
      States the human tumor co-occurrence this record encodes. The sentence is
      the framing statement of a zebrafish paper, so it reports human genetics
      rather than that paper's own experiment.
  - reference: PMID:22789543
    reference_title: The ALK(F1174L) mutation potentiates the oncogenic activity of MYCN in neuroblastoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "co-expression of these two oncogenes led to the development of neuroblastomas with earlier onset, higher penetrance, and enhanced lethality"
    explanation: In vivo demonstration of the cooperative effect on penetrance and onset.
prevalence:
- population: Neuroblastoma patients, worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population frequency of germline ALK carriers has been measured, and no
    unselected cohort estimate exists. What is quantified is the familial
    fraction of neuroblastoma, 1-2%, of which activating germline ALK variants
    account for a substantial part. Carrier frequency is therefore recorded as
    not yet documented rather than estimated from that fraction.
  evidence:
  - reference: PMID:38860978
    reference_title: Neuroblastoma Predisposition and Surveillance-An Update from the 2023 AACR Childhood Cancer Predisposition Workshop.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only 1% to 2% of patients have a family history of NB, 3% to 4% of cases present with bilateral or multifocal primary tumors, and occasional patients have syndromes that are associated with increased NB risk."
    explanation: The familial fraction against which the rarity of this syndrome is judged.
diagnosis:
- name: Germline ALK sequencing
  description: >-
    The diagnosis requires two things, and the second is what makes it harder
    than most: a heterozygous germline ALK kinase-domain variant, plus evidence
    that the variant activates the kinase. A variant of uncertain significance
    in the kinase domain is not a diagnosis. Single-gene ALK sequencing is the
    test for at-risk relatives once the familial variant is known; a wider
    panel is the route when the differential is open, and ALK, PHOX2B and BARD1
    are the three genes the neuroblastoma predisposition literature cited here
    establishes, which is a statement about those genes rather than about any
    particular commercial panel's content. Chromosomal microarray, karyotype
    and FISH have no role in making this diagnosis, because there is no
    germline copy-number mechanism.
  diagnosis_term:
    preferred_term: germline ALK sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ALK-related neuroblastic tumor susceptibility is established by identification of a heterozygous germline ALK activating pathogenic variant in the tyrosine kinase domain that is known or suspected to cause altered kinase function by molecular genetic testing."
    explanation: The diagnostic definition, including the requirement that the variant be activating.
  - reference: PMID:25517749
    reference_title: ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutated variants also showed differential in vitro crizotinib sensitivities."
    explanation: >-
      The biochemical work behind distinguishing activating from non-activating
      kinase-domain substitutions, which the diagnostic definition requires.
  notes: >-
    Who to test: any patient with bilateral or multifocal primary neuroblastic
    tumors, any family history of a neuroblastic tumor, congenital
    neuroblastoma with encephalopathy or brainstem malformation, and any
    tumor-only finding of an ALK mutation at roughly 50% allele fraction. Young
    age at onset on its own is not a useful selection criterion.
- name: Carrier surveillance for neuroblastic tumors
  description: >-
    The core actionable content of the entry. Asymptomatic carriers, and
    carriers already treated for a neuroblastic tumor, undergo abdominal
    ultrasound and urine catecholamine metabolite measurement every three
    months with physical examination and chest radiograph every six months from
    birth to age six, then the same tests six-monthly to age ten. The stated
    rationale is stage shift - detecting a tumor before it becomes high risk or
    causes end-organ damage.
  diagnosis_term:
    preferred_term: surveillance abdominal ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "abdominal ultrasound and urine catecholamine metabolite levels (homovanillic acid and vanillylmandelic acid) every three months and physical examination and chest radiograph every six months between birth and age six years"
    explanation: The surveillance schedule for the first six years.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Screening beyond age ten years is not indicated."
    explanation: The stated upper age boundary of the protocol.
  notes: >-
    Whether the age-ten boundary is right is disputed; see the knowledge gap
    recorded in discussions. Population-based newborn screening for
    neuroblastoma by urinary catecholamines is a different proposition and was
    abandoned after large trials, so this protocol is targeted at known carriers
    and should not be read as a population measure.
treatments:
- name: Lorlatinib
  description: >-
    A third-generation ALK inhibitor and the current targeted agent of choice
    for ALK-driven neuroblastoma. The first-in-child trial established a
    paediatric recommended phase 2 dose of 115 mg/m2 with and without
    chemotherapy, with single-agent responses in about a third of children, and
    moved lorlatinib into phase 3 for newly diagnosed high-risk ALK-driven
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lorlatinib
      term:
        id: CHEBI:143117
        label: lorlatinib
  target_mechanisms:
  - target: Constitutive Ligand-Independent ALK Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Lorlatinib is an ATP-competitive inhibitor of the ALK kinase and acts
      directly on the node that the germline variant creates, including on
      variants resistant to crizotinib.
    evidence:
    - reference: clinicaltrials:NCT03107988
      reference_title: "Phase 1 Study of Lorlatinib (PF-06463922), an Oral Small Molecule Inhibitor of ALK/ROS1, for Patients With ALK-Driven Relapsed or Refractory Neuroblastoma"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Lorlatinib is a novel inhibitor across ALK variants, including those resistant to crizotinib."
      explanation: >-
        The trial registration states the drug's target and its coverage of
        crizotinib-resistant variants.
  evidence:
  - reference: PMID:37012551
    reference_title: "Lorlatinib with or without chemotherapy in ALK-driven refractory/relapsed neuroblastoma: phase 1 trial results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RP2D of lorlatinib with and without chemotherapy in children was 115 mg/m2."
    explanation: The paediatric recommended phase 2 dose from the first-in-child study.
  - reference: PMID:37012551
    reference_title: "Lorlatinib with or without chemotherapy in ALK-driven refractory/relapsed neuroblastoma: phase 1 trial results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The single-agent response rate (complete/partial/minor) for <18 years was 30%"
    explanation: Single-agent activity in children with relapsed or refractory ALK-driven neuroblastoma.
  notes: >-
    Common adverse events in the trial were hypertriglyceridemia,
    hypercholesterolemia and weight gain, with neurobehavioral events mainly in
    adults and reversible on dose hold or reduction.
- name: Crizotinib
  description: >-
    The first-generation ALK inhibitor. Activity in unselected neuroblastoma in
    the paediatric phase 1 study was limited, and the F1174L allele is
    intrinsically resistant, which is why lorlatinib displaced it. Which allele
    a carrier has therefore predicts inhibitor sensitivity - an unusual case in
    which the predisposition allele and the drug-response allele are the same
    variant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: crizotinib
      term:
        id: CHEBI:64310
        label: crizotinib
  target_mechanisms:
  - target: Constitutive Ligand-Independent ALK Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Crizotinib inhibits the activated kinase, but with sensitivity that
      differs sharply between kinase-domain variants.
    evidence:
    - reference: PMID:25517749
      reference_title: ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutated variants also showed differential in vitro crizotinib sensitivities."
      explanation: Establishes variant-dependent crizotinib sensitivity at the kinase.
  evidence:
  - reference: PMID:22789543
    reference_title: The ALK(F1174L) mutation potentiates the oncogenic activity of MYCN in neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The ALK(F1174L) mutation is associated with intrinsic and acquired resistance to crizotinib and cosegregates with MYCN in neuroblastoma."
    explanation: >-
      States the crizotinib resistance of the F1174L allele. The sentence opens
      a mouse study but reports the clinical and tumor-genetic observation it
      set out to explain.
- name: Surgical resection
  description: >-
    Resection is the treatment of a ganglioneuroma in its entirety and part of
    risk-stratified therapy for neuroblastoma. Carriers are treated with the
    same standard risk-stratified protocols as any other neuroblastoma patient;
    the germline finding does not by itself escalate therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: resection of a neuroblastic tumor
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ganglioneuromas are typically removed by surgical resection and require no further therapy."
    explanation: Resection alone is sufficient for the benign end of the spectrum.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment for individuals with neuroblastomas and ganglioneuroblastomas who have a germline ALK activating pathogenic variant is the same standard risk-stratified therapy used to treat all neuroblastoma."
    explanation: States that carriers receive the standard risk-stratified protocols.
- name: Genetic counseling and cascade testing
  description: >-
    Counseling covers dominant inheritance with a 50% transmission risk,
    approximately 50% penetrance so that a carrier child may never develop a
    tumor, the possibility of an unaffected transmitting parent, variable
    expressivity, and the burden of the surveillance schedule. Testing of
    at-risk relatives is explicitly recommended, and prenatal and
    preimplantation testing are available once the familial variant is known.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Once the germline ALK activating pathogenic variant has been identified in an affected family member, genetic testing of at-risk asymptomatic relatives and prenatal/preimplantation genetic testing are possible."
    explanation: Source for cascade and reproductive testing options.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the proportion of probands who have a de novo pathogenic variant is unknown"
    explanation: A counseling-relevant uncertainty stated by the source.
animal_models:
- name: TH-ALK(F1174L) transgenic mouse
  species: Mouse
  genotype: Neural-crest targeted expression of ALK(F1174L)
  publication: PMID:22764207
  description: >-
    Targeted expression of the most frequent and aggressive ALK variant is
    tumorigenic on its own in the mouse, and the tumors reproduce human
    neuroblastoma histology, metastatic pattern, expression profile and
    ultrastructure, together with syntenic 17q gain and MYCN amplification.
    Tumors regress completely on ALK inhibition.
  modeled_mechanisms:
  - target: Constitutive Ligand-Independent ALK Kinase Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      An activating ALK kinase-domain substitution is sufficient to initiate
      neuroblastoma in this lineage, and the resulting tumors are addicted to
      that kinase activity.
    limitations: >-
      Expression is promoter-driven and supraphysiological rather than a single
      mutant allele at the endogenous locus, so the model carries a higher ALK
      dose than a human germline carrier does, and it reaches near-complete
      penetrance where the human syndrome is about 50% penetrant.
    evidence:
    - reference: PMID:22764207
      reference_title: Targeted expression of mutated ALK induces neuroblastoma in transgenic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that targeted expression of the most frequent and aggressive variant, ALK(F1174L), is tumorigenic in mice."
      explanation: Establishes that the activating kinase variant alone initiates the tumor in vivo.
    readouts:
    - name: Tumor regression on ALK inhibition
      target: Constitutive Ligand-Independent ALK Kinase Activation
      direction: ABOLISHED
      interpretation: >-
        Complete regression on a selective ALK inhibitor shows that the tumors
        depend on the activated kinase rather than on a downstream lesion
        acquired along the way.
      evidence:
      - reference: PMID:22764207
        reference_title: Targeted expression of mutated ALK induces neuroblastoma in transgenic mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment of ALK(F1174L) transgenic mice with the ALK inhibitor TAE-684 induced complete tumor regression"
        explanation: The measured response behind this readout.
  - target: Somatic MYCN Amplification in an ALK-Activated Neuroblast
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      ALK-initiated mouse tumors acquire MYCN amplification and 17q gain as
      secondary events, matching the secondary lesions of human neuroblastoma.
    limitations: >-
      The initiating ALK lesion here is a transgene rather than a germline
      allele, so the model shows that MYCN amplification follows ALK activation
      without speaking to the frequency with which it does so in carriers.
    evidence:
    - reference: PMID:22764207
      reference_title: Targeted expression of mutated ALK induces neuroblastoma in transgenic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Chromosomal aberrations were syntenic to those in human neuroblastoma, including 17q gain and MYCN oncogene amplification."
      explanation: Documents the acquired MYCN amplification in this model.
- name: Alk knock-in mouse (F1178L and R1279Q at the endogenous locus)
  species: Mouse
  genotype: Alk F1178L or Alk R1279Q knocked in at the endogenous locus (orthologs
    of human F1174L and R1275Q)
  publication: PMID:24811913
  description: >-
    The closest genetic model of this syndrome: one activating allele at the
    endogenous locus, which is what a human carrier has, rather than a
    promoter-driven transgene. The F1178L line shows enlarged sympathetic
    ganglia from embryonic life into adulthood with raised neuroblast
    proliferation before birth, and in a MYCN transgenic background F1178L
    gives a shorter tumor latency than R1279Q. R1279Q is the ortholog of
    R1275Q, the commonest human germline allele, and its tumors respond to
    crizotinib - matching the allele-specific inhibitor sensitivity recorded on
    the crizotinib treatment.
  modeled_mechanisms:
  - target: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the permissive state this entry turns on, from a single
      activating allele at physiological dosage and with no cooperating
      transgene: the sympathetic ganglia are enlarged and neuroblast
      proliferation is raised.
    limitations: >-
      The ganglion enlargement is reported for F1178L, the ortholog of human
      F1174L, rather than for R1279Q; residue numbering differs from the human
      alleles by four, which is a trap for automated cross-species annotation.
      Mouse sympathoadrenal development does not reproduce human adrenal
      medulla ontogeny, and the model says nothing about what becomes of the
      pool in an unaffected carrier.
    evidence:
    - reference: PMID:24811913
      reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a therapeutic target in ALK-mutated neuroblastoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5 to birth."
      explanation: Reports the enlargement and the raised proliferation this link claims.
    readouts:
    - name: Sympathetic ganglion size and neuroblast proliferation
      target: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
      direction: INCREASED
      interpretation: >-
        Ganglion enlargement persisting into adulthood, with the proliferative
        increase measured between E14.5 and birth, which is the developmental
        window the permissive state occupies.
      evidence:
      - reference: PMID:24811913
        reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a therapeutic target in ALK-mutated neuroblastoma.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5 to birth."
        explanation: The two measurements behind this readout.
  - target: Somatic MYCN Amplification in an ALK-Activated Neuroblast
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Puts an endogenous activating Alk allele together with a MYCN transgene
      and shows that the two cooperate to produce tumors, with the latency
      depending on which allele is present.
    limitations: >-
      MYCN arrives as a transgene rather than as a somatic amplification
      acquired in one neuroblast, so the model reproduces the cooperation
      without reproducing how the second lesion is acquired or how often. It
      also compares the two alleles only for latency.
    evidence:
    - reference: PMID:24811913
      reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a therapeutic target in ALK-mutated neuroblastoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In a MYCN transgenic context, the F1178L mutation displays a higher oncogenic potential than the R1279Q mutation as evident from a shorter latency of tumor onset."
      explanation: >-
        Establishes the cooperation in a knock-in background and shows that
        the germline allele's identity changes the outcome.
- name: MYCN transgenic zebrafish with activated ALK
  species: Zebrafish
  genotype: MYCN transgenic, with and without coexpressed activated ALK
  publication: PMID:22439933
  description: >-
    The model that best explains the incomplete penetrance of the human
    syndrome. MYCN alone produces sympathoadrenal hyperplasia that is then
    culled by a developmentally timed apoptotic response; adding activated ALK
    supplies prosurvival signals that block the cull, triples penetrance and
    accelerates onset.
  modeled_mechanisms:
  - target: Block of Developmentally Timed Neuroblast Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Directly demonstrates the convergence this node encodes: the apoptotic
      response triggered in hyperplastic sympathoadrenal cells, and its
      suppression by activated ALK.
    limitations: >-
      Zebrafish sympathoadrenal development does not reproduce human adrenal
      medulla ontogeny, including the contribution of Schwann cell precursors
      and the human timing of sympathoadrenal commitment, and both oncogenes
      are transgenes rather than one endogenous germline allele.
    evidence:
    - reference: PMID:22439933
      reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Coexpression of activated ALK with MYCN provides prosurvival signals that block this apoptotic response and allow continued expansion and oncogenic transformation of hyperplastic neuroblasts, thus promoting progression to neuroblastoma."
      explanation: The result this link cites.
    readouts:
    - name: Disease penetrance on ALK coexpression
      target: Block of Developmentally Timed Neuroblast Apoptosis
      direction: INCREASED
      interpretation: >-
        Tripled penetrance is the quantitative expression of the apoptotic
        block, and is the closest experimental analogue of the incomplete
        penetrance seen in carriers.
      evidence:
      - reference: PMID:22439933
        reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Coexpression of activated ALK with MYCN in this model triples the disease penetrance and markedly accelerates tumor onset."
        explanation: The measurement behind this readout.
- name: ALK kinase-domain knockout mouse
  species: Mouse
  genotype: Homozygous deletion of the ALK tyrosine kinase domain
  publication: PMID:17487225
  description: >-
    An inverse model, listed because it establishes what ALK is dispensable
    for rather than because it reproduces anything in this entry's pathograph.
    Homozygotes reach adulthood, with altered hippocampal progenitor
    proliferation, behavioural changes and raised frontal cortex dopaminergic
    signalling; that viability is the safety rationale for inhibiting ALK
    pharmacologically. It deliberately declares no modeled_mechanisms: deleting
    the kinase domain is the opposite of the disease lesion, so the model was
    never built to recapitulate the activation node, and labelling it as
    failing to do so would misstate what it was for. A loss-of-function allele
    also cannot speak to the congenital brainstem phenotype of the strongest
    activating germline alleles, which is a gain-of-function effect.
  evidence:
  - reference: PMID:17487225
    reference_title: Behavioral and neurochemical alterations in mice deficient in anaplastic lymphoma kinase suggest therapeutic potential for psychiatric indications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Evaluation of adult ALK homozygotes (HOs) revealed an age-dependent increase in basal hippocampal progenitor proliferation and alterations in behavioral tests consistent with a role for this receptor in the adult brain."
    explanation: >-
      The existence of adult homozygotes with a measurable but non-lethal
      phenotype establishes that ALK kinase activity is dispensable for
      viability.

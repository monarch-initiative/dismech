      kinase-domain variant makes unnecessary.
  downstream:
  - target: Sustained RAS-MAPK and PI3K-AKT-mTOR Signaling
    causal_link_type: DIRECT
    description: >-
      The continuously phosphorylated receptor drives its downstream cascades
      with no physiological ligand cue.
    evidence:
    - reference: PMID:22789543
      reference_title: The ALK(F1174L) mutation potentiates the oncogenic activity of MYCN in neuroblastoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ALK(F1174L)/MYCN tumors exhibited increased MYCN dosage due to ALK(F1174L)-induced activation of the PI3K/AKT/mTOR and MAPK pathways, coupled with suppression of MYCN pro-apoptotic effects."
      explanation: Shows activated ALK driving both cascades in vivo.
  - target: Disrupted Brainstem Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Where the germline allele is one of the strongest activators, constitutive
      ALK signalling during central nervous system development produces a
      congenital neurological phenotype alongside the tumor risk. Reported in
      two unrelated de novo cases; the intermediate steps in human brainstem
      morphogenesis are not established.
    evidence:
    - reference: PMID:21972109
      reference_title: Germline gain-of-function mutations of ALK disrupt central nervous system development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report a novel syndromic presentation associating congenital NB with severe encephalopathy and abnormal shape of the brainstem on brain MRI in two unrelated sporadic cases harboring de novo, germline, heterozygous ALK gene mutations."
      explanation: The two cases that define this germline-specific developmental branch.
- name: Sustained RAS-MAPK and PI3K-AKT-mTOR Signaling
  biological_scale: MOLECULAR
  description: >-
    Downstream of the constitutively active receptor, the RAS-MAPK and
    PI3K-AKT-mTOR cascades run continuously. The mTOR arm raises MYCN protein
    dosage and suppresses its pro-apoptotic activity, closing a feed-forward
    loop with any cooperating MYCN lesion.
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:22789543
    reference_title: The ALK(F1174L) mutation potentiates the oncogenic activity of MYCN in neuroblastoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ALK(F1174L)/MYCN tumors exhibited increased MYCN dosage due to ALK(F1174L)-induced activation of the PI3K/AKT/mTOR and MAPK pathways, coupled with suppression of MYCN pro-apoptotic effects."
    explanation: Names both cascades and the MYCN dosage consequence.
  downstream:
  - target: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In the developing sympathoadrenal lineage the sustained proliferative
      signal expands the neuroblast pool and delays its differentiation. An
      activating Alk allele at the endogenous mouse locus does this on its own,
      with no MYCN transgene: sympathetic ganglia are enlarged from embryonic
      life onward and sympathetic neuroblast proliferation is raised.
    evidence:
    - reference: PMID:24811913
      reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a therapeutic target in ALK-mutated neuroblastoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5 to birth."
      explanation: >-
        The observation this edge needs, and the only one here made without a
        MYCN transgene: a single activating Alk allele knocked in at the
        endogenous locus enlarges sympathetic ganglia and raises neuroblast
        proliferation. Mouse F1178L is the ortholog of human F1174L, so the
        residue numbering differs from the human allele by four; the paper
        reports the enlargement for F1178L rather than for R1279Q, the
        ortholog of the commonest human germline allele.
  - target: Block of Developmentally Timed Neuroblast Apoptosis
    causal_link_type: DIRECT
    description: >-
      The prosurvival arm of ALK signalling is what blocks the apoptotic cull
      that would otherwise remove the hyperplastic cells.
    evidence:
    - reference: PMID:22439933
      reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Coexpression of activated ALK with MYCN provides prosurvival signals that block this apoptotic response and allow continued expansion and oncogenic transformation of hyperplastic neuroblasts, thus promoting progression to neuroblastoma."
      explanation: Attributes the apoptotic block to ALK-derived prosurvival signalling.
- name: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
  biological_scale: TISSUE
  description: >-
    Sympathetic ganglia and the adrenal medulla carry an enlarged, persistently
    undifferentiated neuroblast population beyond the normal developmental
    window. An activating Alk allele at the endogenous mouse locus produces
    this on its own, and MYCN overexpression drives the same hyperplasia, so
    the germline allele and the cooperating somatic lesion both feed it. It is
    the permissive state of the carrier rather than a tumor: about half of
    carriers never develop a neuroblastic tumor at all, and tumor risk falls
    through childhood. What becomes of the pool in an unaffected human carrier
    is not reported - no study follows sympathoadrenal tissue in carriers - so
    this entry states the penetrance and the age gradient and does not claim
    that the hyperplasia regresses.
  cell_types:
  - preferred_term: neural crest derived neuroblast
    term:
      id: CL:0002676
      label: neural crest derived neuroblast

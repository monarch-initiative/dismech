  description: >-
    A rare germline-specific branch. In two unrelated children with de novo
    germline ALK variants, congenital neuroblastoma occurred together with
    severe encephalopathy and an abnormally shaped brainstem on MRI. The same
    observation is the proposed explanation for why the strongest activating
    alleles are under-represented in the germline relative to the somatic
    spectrum.

name: ALK-Related Neuroblastic Tumor Susceptibility
creation_date: "2026-10-22T17:46:42Z"
description: >-
  An autosomal dominant, incompletely penetrant cancer predisposition syndrome
  caused by a heterozygous germline activating missense variant in the tyrosine
  kinase domain of ALK. It is the principal genetic cause of familial
  neuroblastoma. Carriers are at raised risk of the whole neuroblastic tumor
  spectrum - neuroblastoma, ganglioneuroblastoma and ganglioneuroma - with risk
  concentrated in infancy and falling through childhood, and with a
  characteristic tendency to multifocal and bilateral primary tumors. The entry
  describes the susceptibility state, not the tumor: the germline variant is
  necessary but not sufficient, and transformation requires a cooperating
  somatic lesion, most often MYCN amplification. Roughly half of carriers never
  develop a neuroblastic tumor, and an unaffected transmitting parent is
  common.
synonyms:
- ALK-related neuroblastic tumour susceptibility
- Neuroblastoma, susceptibility to, 3
- NBLST3
- ALK-related familial neuroblastoma
categories:
- Hereditary cancer predisposition syndrome

    reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a therapeutic target in ALK-mutated neuroblastoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5 to birth."
    explanation: >-
      Characterises the state this node records, from an activating Alk allele
      alone at the endogenous locus: enlarged sympathetic ganglia persisting
      into adulthood, with raised neuroblast proliferation before birth.
  - reference: PMID:22439933
    reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MYCN overexpression induces adrenal sympathetic neuroblast hyperplasia, blocks chromaffin cell differentiation, and ultimately triggers a developmentally-timed apoptotic response in the hyperplastic sympathoadrenal cells."
    explanation: >-
      The same state reached from the cooperating lesion rather than from the
      germline allele, with blocked chromaffin differentiation named
      explicitly. The sentence attributes the hyperplasia to MYCN, which is why
      the MYCN node carries its own edge into this one.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood."
    explanation: >-
      The penetrance figure is the clinical evidence that this state is
      permissive rather than sufficient.
  downstream:
  - target: Block of Developmentally Timed Neuroblast Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The expanded pool supplies the cells in which the apoptotic block
      operates; without the hyperplasia there is nothing for a cooperating
      lesion to transform.
    evidence:
    - reference: PMID:22439933
      reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Coexpression of activated ALK with MYCN provides prosurvival signals that block this apoptotic response and allow continued expansion and oncogenic transformation of hyperplastic neuroblasts, thus promoting progression to neuroblastoma."
      explanation: Places the apoptotic block within the hyperplastic neuroblast population.
- name: Somatic MYCN Amplification in an ALK-Activated Neuroblast
  biological_scale: MOLECULAR
  description: >-
    The cooperating somatic lesion. MYCN amplification acquired in a neuroblast
    that already carries the germline ALK allele is the commonest route from
    the permissive state to a tumor, and the two oncogenes are repeatedly shown
    to synergise in vivo. This is the transforming event, and the cell in which
    it occurs is the cell of origin recorded for this entry.
  genetic_context:
    variant_origin: SOMATIC
    description: >-
      Somatically acquired MYCN amplification in a sympathoadrenal neuroblast
      of a germline ALK carrier.

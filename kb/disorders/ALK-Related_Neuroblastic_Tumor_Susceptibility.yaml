discussions:
- discussion_id: alk_nbts_surveillance_upper_age_bound
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the risk of a new neuroblastic tumor in a germline ALK carrier end in
    late childhood, as the current surveillance protocol assumes, or does it
    continue through adult life?
  attaches_to:
  - diagnosis#Carrier surveillance for neuroblastic tumors
  - pathophysiology#Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
  rationale: >-
    The surveillance protocol stops at age ten, on the reasoning that the
    permissive sympathoadrenal progenitor pool involutes and that risk falls
    through childhood. Against that, Mosse and colleagues report a carrier who
    developed bilateral adrenal neuroblastoma at 36 after an asymptomatic
    childhood, and argue for surveillance through adulthood using circulating
    tumor DNA and whole-body MRI. The disagreement is not about the penetrance
    figure but about whether the mechanism has a true endpoint: if a residual
    progenitor population persists in adults, the second-hit model predicts a
    lifelong hazard rather than a childhood-limited one. The dissenting evidence
    is a single kindred, so neither position is settled. Note that the
    JCO Precision Oncology report has no abstract in the reference cache, so it
    is listed as a reference rather than quoted as evidence here.
  status: OPEN
  posed_by: "dismech curation (neuroblastoma project, issue #15238)"
  evidence:
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Screening beyond age ten years is not indicated."
    explanation: The current guidance position, which the open question challenges.
- discussion_id: alk_nbts_models_engineer_away_penetrance
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Every available animal model of this syndrome reaches far higher penetrance
    than the human carrier state, so do these models tell us anything about
    risk, as opposed to about tumor formation once a second hit has occurred?
  attaches_to:
  - pathophysiology#Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
  - pathophysiology#Block of Developmentally Timed Neuroblast Apoptosis
  rationale: >-
    The defining clinical property of this syndrome is that about half of
    carriers never develop a tumor. The models invert that property. Compound
    MYCN and activated-ALK systems are selected and reported for high
    penetrance, and the transgenic lines drive supraphysiological,
    promoter-controlled expression rather than carrying one mutant allele at
    the endogenous locus. What the models therefore establish well is the
    mechanism of transformation given cooperation; what they cannot establish
    is why one carrier of the same allele is affected and a sibling is not.
    Human-specific sympathoadrenal development, including the contribution of
    Schwann cell precursors and the timing of commitment, is a plausible part
    of that answer and is exactly what the fish and mouse systems do not
    reproduce. The gap is not that evidence is missing but that the available
    evidence comes from systems built to remove the variable of interest.
  status: OPEN
  posed_by: "dismech curation (neuroblastoma project, issue #15238)"
  evidence:
  - reference: PMID:22439933
    reference_title: Activated ALK collaborates with MYCN in neuroblastoma pathogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Coexpression of activated ALK with MYCN in this model triples the disease penetrance and markedly accelerates tumor onset."
    explanation: >-
      The model's penetrance is a designed property of the compound genotype,
      not a measurement of risk in a carrier.
  - reference: PMID:20301782
    reference_title: ALK-Related Neuroblastic Tumor Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood."
    explanation: The human figure the models do not reproduce.
notes: >-
  Scope. This entry is the germline susceptibility state, kept separate from the
  somatic tumor entries it predisposes to, in line with the rule that germline
  predisposition syndromes stay distinct from the cancers they cause.
  Neuroblastoma and Ganglioneuroblastoma already record that MONDO files the
  numbered neuroblastoma susceptibility classes under hereditary neoplastic
  syndrome rather than under neuroblastoma, and this entry is the curation of
  one of them. MONDO:0013083 is held here as the entry's disease_term and by no
  other entry.

  The entity is a susceptibility, not a tumor, and the distinction is load
  bearing: being a carrier is not a disease state, roughly half of carriers
  never develop a tumor, and prognosis is set by the tumor event rather than by
  the genotype. For that reason no survival, staging or risk-stratification
  content is curated here - carriers are staged and risk-stratified identically
  to every other neuroblastoma patient, and no ALK-predisposition-specific
  staging system exists.

  Negatives worth recording rather than leaving blank. No environmental risk or
  protective factor has been shown to modify risk in carriers, and none has been
  studied in a germline-ALK population, so no environmental section and no ECTO
  binding appear here. No gene-environment interaction is documented; the
  interaction that governs this disease is gene-gene. No naturally occurring
  ALK-driven neuroblastic tumor has been described in another species - every
  model is engineered. There is no measured carrier frequency, no published
  survival estimate for carriers as a group, no reported germline mosaicism or
  founder effect, and no disease-specific quality-of-life data.

  Terms deliberately not bound. The congenital neurological branch is bound to
  abnormal brainstem morphology (HP:0002363) rather than to abnormal brainstem
  MRI signal intensity (HP:0012747), because the source describes abnormal shape
  on MRI, not signal change. Congenital central hypoventilation syndrome is a
  PHOX2B phenotype and is not attributed to ALK here. Multifocal and bilateral
  presentation, which is the clinical trigger for germline testing, has no HPO
  term and is carried in the neuroblastoma phenotype description rather than
  bound to a near-miss term. LOINC codes for urinary homovanillic and
  vanillylmandelic acid were not resolved, so the analytes are carried as HPO
  phenotypes and as a named surveillance test without a measurement binding.
review_notes: >-
  Built from research/ALK-Related_Neuroblastic_Tumor_Susceptibility-deep-research-claude_code.md,
  which passed just preflight-dr against MONDO:0013083. Claims the report
  flagged as unverified leads were left out rather than curated down: the
  G1128A variant-specific penetrance figure, which reached the report only
  through a search-engine rendering of GeneReviews body text; the F1174V and
  F1245V residue assignments in the congenital encephalopathy cases, which the
  retrieved abstract does not name; and the 2026 preprint on Schwann cell
  precursor expansion, whose content was unread. The Alk knock-in models are
  curated: the report's quotes for them came from a secondary summary, but the
  primary abstract is cached as PMID:24811913, so the ganglion-enlargement and
  MYCN-cooperation claims are quoted from it directly. The RET upregulation
  arm is stated in that same abstract and is still left out, because a parallel
  effector arm downstream of the activated kinase is not part of the chain from
  germline allele to tumor that this entry models; it would be a node to add
  alongside a RET-directed treatment, not a correction to this one.

    snippet: "Two loci reached genome-wide significance, including a regulatory region near the atypical chemokine receptor 3 gene (ACKR3) on chromosome 2."
    explanation: The genome-wide significant association.
  - reference: PMID:41001447
    reference_title: "Complex Genetics and Regulatory Drivers of Hypermobile Ehlers-Danlos Syndrome: Insights from Genome-Wide Association Study Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional annotation supports ACKR3 risk alleles colocalize with eQTLs in tibial nerve, alter enhancer activity, and generate a de novo AHR transcription factor regulatory site, implicating neuroimmune and pain signaling pathways."
    explanation: Functional annotation pointing the locus at peripheral nerve and neuroimmune pathways rather than structural collagen.
mechanistic_hypotheses:
- hypothesis_group_id: heds_central_sensitization_pain_model
  hypothesis_label: Central sensitization (nociplastic) model of hEDS pain
  status: EMERGING
  description: >-
    Persistent nociceptive input from unstable joints sensitizes dorsal horn
    nociceptive processing, producing generalized hyperalgesia and widespread
    chronic pain that outruns the mechanical injury. Supported by quantitative
    sensory testing in adults, adolescents and children; the trigger step is
    inferred and the model does not by itself explain the neuropathic component.
  evidence:
  - reference: PMID:26919608
    reference_title: "Central sensitization as the mechanism underlying pain in joint hypermobility syndrome/Ehlers-Danlos syndrome, hypermobility type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the lack of somatosensory nervous system damage is incompatible with neuropathic pain as the mechanism underlying pain in JHS/EDS-HT, the lowered cold and heat pain thresholds and increased wind-up ratio imply that pain in JHS/EDS-HT might arise through central sensitization."
    explanation: The study that framed the model, including its argument against a neuropathic alternative in that cohort.
- hypothesis_group_id: heds_small_fiber_neuropathy_model
  hypothesis_label: Small fiber neuropathy model of hEDS pain and dysautonomia
  status: EMERGING
  description: >-
    An intrinsic non-length-dependent loss of somatic and autonomic small
    fibers supplies the neuropathic component of hEDS pain and a primary
    peripheral contribution to dysautonomia. Supported by skin biopsy and
    sudomotor testing in neuropathy- and autonomic-clinic cohorts; its prevalence
    in unselected hEDS and the cause of the fiber loss are unknown, and one
    consecutive series found no somatosensory damage. Not exclusive of the
    central sensitization model.
  evidence:
  - reference: PMID:42399338
    reference_title: "Distinct sensory and autonomic involvement in hypermobile Ehlers-Danlos syndrome compared with idiopathic small fiber neuropathy: a multimodal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study identifies a non–length-dependent small fiber neuropathy in hEDS, characterized by widespread sensory and autonomic symptoms, and converging functional and structural evidence of both somatic and autonomic fiber pathology."
    explanation: The multimodal study proposing small fiber involvement as a core feature.
- hypothesis_group_id: heds_vessel_laxity_venous_pooling_model
  hypothesis_label: Vessel-wall laxity and venous pooling model of hEDS postural tachycardia
  status: EMERGING
  description: >-
    Lax venous walls distend under hydrostatic pressure on standing, reducing
    preload and provoking compensatory tachycardia. Proposed from a case series,
    repeated in reviews, never measured in hEDS, and contradicted as a general
    POTS mechanism by strain-gauge plethysmography, which attributed pooling to
    blunted arterial vasoconstriction instead.
  evidence:
  - reference: PMID:10518084
    reference_title: "Orthostatic intolerance and chronic fatigue syndrome associated with Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We propose that the occurrence of these syndromes together can be attributed to the abnormal connective tissue in dependent blood vessels of those with EDS, which permits veins to distend excessively in response to ordinary hydrostatic pressures."
    explanation: The originating proposal.
  - reference: PMID:12010910
    reference_title: "Pooling in chronic orthostatic intolerance: arterial vasoconstrictive but not venous compliance defects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Volume-pressure relations of controls and POTS patients with normal P(v) and high P(v) were not different and were unchanged by orthostasis."
    explanation: Venous compliance measured normal in postural tachycardia; not an hEDS cohort.
- hypothesis_group_id: heds_klk15_protease_ecm_model
  hypothesis_label: KLK15 protease-ECM-immune model
  status: EMERGING
  description: >-
    A dominant-negative KLK15 variant displaces KLK15 and lysyl oxidase from the
    insoluble extracellular matrix, impairing collagen cross-linking and matrix
    integrity in tendon and valve while perturbing cytokine signalling. One study
    with a knock-in mouse; two families; unreplicated.
  evidence:
  - reference: PMID:40949095
    reference_title: "KLK15 alters connective tissues in hypermobile Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A KLK15 knock-in mouse model recapitulated hEDS features in tendons and cardiac valves and exhibited dysregulated cytokine profiles."
    explanation: The model-organism result that carries the hypothesis from gene to tissue.
- hypothesis_group_id: heds_neuroimmune_stromal_model
  hypothesis_label: Neuroimmune-stromal dysregulation model
  status: EMERGING
  description: >-
    hEDS is a complex, oligogenic or polygenic disorder in which common
    regulatory variants acting in peripheral nerve and immune tissue, and
    systemic complement and cytokine dysregulation, sit alongside the
    connective tissue phenotype rather than beneath it. Drawn from a 2025 GWAS
    meta-analysis preprint and a serum proteomics study; neither names the
    mechanism by which the immune findings produce any clinical feature.
  evidence:
  - reference: PMID:41001447
    reference_title: "Complex Genetics and Regulatory Drivers of Hypermobile Ehlers-Danlos Syndrome: Insights from Genome-Wide Association Study Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results establish the first evidence of common variant contributions to hEDS, supporting a complex, multisystem model involving neuroimmune-stromal dysregulation."
    explanation: The framing statement of the model.
  - reference: PMID:40972649
    reference_title: "Proteomic discoveries in hypermobile Ehlers-Danlos syndrome reveal insights into disease pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate a systemic immune dysregulation, particularly involving the complement system and profibrotic cytokines, as a common feature in hEDS pathophysiology."
    explanation: The proteomic half of the model.
- hypothesis_group_id: heds_neuroconnective_model
  hypothesis_label: Neuroconnective model of anxiety in hEDS
  status: EMERGING
  description: >-
    Anxiety in hEDS is proposed to arise through autonomic dysfunction,
    heightened interoceptive signalling and reduced proprioception, or
    alternatively through a shared neural trait: healthy hypermobile volunteers
    show larger bilateral amygdala volume and higher interoceptive sensitivity
    without being more anxious, which would make anxiety a parallel expression
    of the phenotype rather than a downstream consequence. The two readings are
    not separated by any existing study.
  evidence:
  - reference: PMID:28186381
    reference_title: "Psychiatric and psychological aspects in the Ehlers-Danlos syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The underlying mechanisms behind this association include genetic risks, autonomic nervous system dysfunction, increased exteroceptive and interoceptive mechanisms and decreased proprioception."
    explanation: The review's statement of the downstream mechanisms.
  - reference: PMID:22539777
    reference_title: "Brain structure and joint hypermobility: relevance to the expression of psychiatric symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Strikingly, bilateral amygdala volume distinguished those with from those without hypermobility. The hypermobility group scored higher for interoceptive sensitivity yet were not significantly more anxious."
    explanation: >-
      The shared-substrate alternative: a structural brain difference tracking
      hypermobility in healthy volunteers without anxiety; indirect because the
      participants were not hEDS patients.


  notes: >-
    Kept separate from general sleep disturbance; no causal edge from chronic pain to apnea is asserted.
genetic:
- name: KLK15 (candidate, unreplicated)
  gene_term:
    preferred_term: KLK15
    term:
      id: hgnc:20453
      label: KLK15
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >-
    A recurrent KLK15 p.Gly226Asp missense variant segregating in two
    multigenerational families among 200 exome-sequenced hEDS patients, with a
    knock-in mouse reproducing tendon and valve features. One study, no
    replication, no ClinGen or GenCC classification; the variant is not a
    diagnostic marker and hEDS remains a clinical diagnosis with no causal gene.
    Recorded as UNKNOWN rather than CAUSATIVE or RISK_FACTOR because neither
    sufficiency nor a population effect size has been shown.
  evidence:

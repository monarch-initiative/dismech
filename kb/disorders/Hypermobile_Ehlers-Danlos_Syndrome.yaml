- name: Functional heartburn and dyspeptic symptoms (disorder of gut-brain interaction)
  description: >-
    Foregut symptoms in hEDS are predominantly functional. In 229 patients with
    reflux symptoms studied by 24-hour pH-impedance, Rome IV functional heartburn
    was the commonest diagnosis and pathological reflux was no more frequent than
    in non-hypermobile patient controls; high-resolution manometry found hEDS not
    associated with esophageal dysmotility. The gastroenterology society frames
    the hEDS gut phenotype as disorders of gut-brain interaction. The sensory or
    central process behind the functional symptoms has not been identified in
    hEDS, and whether it shares a mechanism with somatic central sensitization is
    untested.

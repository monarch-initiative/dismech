    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In hEDS and HSD cells, the αvβ3 integrin was shown to be involved in the fibroblast-to-myofibroblast transition by a transduction pathway involving ILK that signals to the transcription factor Snail1"
    explanation: >
      The review of patient-cell experiments supports the integrin/ILK/Snail1 branch.
  - reference: PMID:29587413
    reference_title: "Multifaced Roles of the αvβ3 Integrin in Ehlers-Danlos and Arterial Tortuosity Syndromes' Dermal Fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "hEDS and HSD cells exhibit a peculiar in vitro myofibroblast-like phenotype characterized by organization of the α-smooth muscle actin (α-SMA) cytoskeleton, expression of the cadherin-11, and enhanced migratory capability, probably because they synthesize high levels of MMP9, a collagenase also able to digest FN into proteolytic fragments"
    explanation: >
      Patient fibroblasts show the α-SMA/cadherin-11 myofibroblast markers and
      high MMP9 collagenase, supporting a candidate ECM-degrading mechanism; the
      initiating extracellular factor remains unidentified.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
- name: Generalized connective tissue laxity and fragility
  description: >-
    The tissue-level substrate by which hEDS is recognized and diagnosed: lax
    ligaments and joint capsules, hyperextensible and fragile skin, and lax
    pelvic, abdominal-wall, valvular and vascular connective tissue. Skin
    biopsies from hEDS families show flower-like collagen fibrils and altered
    elastic fibers, irrespective of Beighton score, so an extracellular matrix
    abnormality is documented in human tissue even though its molecular cause
    is unknown and the candidate molecular lesions remain hypothetical.
  notes: >-
    The two process bindings rest on a single transmission electron microscopy
    series of 17 hEDS families, which is the only ultrastructural study of
    criteria-era hEDS skin found. Ligament, joint-capsule, pelvic-floor and
    vessel-wall laxity are clinical inferences from the Beighton score and the
    diagnostic criteria; no histological study of those tissues in hEDS was
    found, so the location binding is dermis alone.
  mechanism_confidence: ESTABLISHED
  biological_scale: TISSUE

    Candidate molecular lesion from one 2025 study. Whole-exome sequencing of
    200 hEDS patients found rare variants across the kallikrein gene family,
    including a recurrent KLK15 p.Gly226Asp missense variant segregating in two
    multigenerational families. KLK15 is a secreted serine protease that binds
    fibronectin and lysyl oxidase (LOX); in a knock-in mouse the variant acted
    as a dominant negative, displacing KLK15 and LOX from insoluble extracellular
    matrix compartments, with ultrastructural collagen fibril alteration in
    tendon, valve abnormality and a changed cytokine profile. Unreplicated;
    the variant is not a diagnostic marker and explains a minority of cases at
    most.

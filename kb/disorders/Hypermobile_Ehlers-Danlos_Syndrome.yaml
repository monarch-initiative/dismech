    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean COMPASS-31 score was 54.45 (range 18.79-80.93), indicating severe autonomic dysfunction, which was significantly higher than in patients with multiple sclerosis, diabetic neuropathy, scleroderma, and psoriatic arthritis as shown in prior studies."

  - reference: PMID:42399338
    reference_title: "Distinct sensory and autonomic involvement in hypermobile Ehlers-Danlos syndrome compared with idiopathic small fiber neuropathy: a multimodal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hEDS/SFN patients had earlier symptom onset (19.5 ± 5.9 years vs. 35.2 ± 8.7 years, p < 0.001), more generalized distribution, and higher COMPASS-31 scores (54.3 ± 16.9 vs. 33.9 ± 19.4 p < 0.01), particularly in orthostatic intolerance, gastrointestinal, and urinary domains."
    explanation: Instrumented cohort confirming the domains of autonomic involvement; the patients were selected for small fiber neuropathy and then found to meet hEDS criteria.
  downstream:
  - target: Orthostatic tachycardia
    causal_link_type: DIRECT
    description: Postural tachycardia is the commonest cardiovascular presentation of the dysautonomia.
    evidence:
    - reference: PMID:28160388
      reference_title: "Cardiovascular autonomic dysfunction in Ehlers-Danlos syndrome-Hypermobile type."

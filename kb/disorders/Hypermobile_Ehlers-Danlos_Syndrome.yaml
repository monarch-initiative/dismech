      (hEDS 54.6%, HSD 59.5%) and constipation (hEDS 53.0%, HSD 57.2%).
    explanation: >-
      The 2017-criteria hEDS group comprised 423 patients; nausea was
      self-reported at clinic intake. The HSD comparison rates are not assigned to
      hEDS.
  notes: >-
    Symptoms were self-reported and not independently verified; referral-cohort
    percentages are not assigned as disease-wide frequency bands.

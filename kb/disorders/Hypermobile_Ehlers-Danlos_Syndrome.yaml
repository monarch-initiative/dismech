  evidence:
  - reference: PMID:20301456
    reference_title: "Hypermobile Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypermobile Ehlers-Danlos syndrome (hEDS) is characterized by generalized
      joint hypermobility, joint instability, pain, soft and hyperextensible skin
      with atrophic scars and easy bruising, dental crowding, abdominal hernias,
      pelvic organ prolapse, marfanoid body habitus, mitral valve prolapse, and
      aortic root dilatation.
    explanation: GeneReviews identifies generalized joint hypermobility as a core hEDS feature.
  sequelae:
  - target: Joint instability and recurrent soft-tissue injury
    causal_link_type: DIRECT
    description: >-
      Generalized joint laxity can be accompanied by instability and increases
      susceptibility to joint and soft-tissue injury; instability is not inevitable
      in every hypermobile joint.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1279/
      reference_title: Hypermobile Ehlers-Danlos Syndrome - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Joint laxity with instability, with or without reduced proprioception,
        increases the risk of the following complications: ...
        soft tissue injury ... that can last for hours or days after an event.
      explanation: >-
        GeneReviews places joint laxity with instability upstream of injury risk.
        This clinical sequela does not identify the molecular cause of joint laxity.

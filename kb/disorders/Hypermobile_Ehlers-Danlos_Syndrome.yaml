      explanation: Names postural tachycardia as a presentation of the cardiovascular autonomic dysfunction.
  - target: Gastrointestinal dysmotility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Autonomic dysregulation of gut motility is the proposed route to the

- name: Myofibroblast-like fibroblast transition
  description: >
    hEDS/HSD patient fibroblasts can acquire a migrating myofibroblast-like
    phenotype with alpha-smooth muscle actin stress fibers, cadherin-11, MMP9,
    and inflammatory mediator changes through alpha-v-beta-3
    integrin/ILK/Snail1 signaling. This remains model evidence rather than a
    validated diagnostic biomarker.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:31409039
    reference_title: "Cellular and Molecular Mechanisms in the Pathogenesis of Classical, Vascular, and Hypermobile Ehlers-Danlos Syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our in vitro studies confirmed the phenotypic conversion of hEDS/HSD fibroblasts into migrating myofibroblast-like cells"
    explanation: >
      This review summarizes patient-cell evidence for a candidate
      myofibroblast-like transition in hEDS/HSD.
  - reference: PMID:29587413
    reference_title: "Multifaced Roles of the αvβ3 Integrin in Ehlers-Danlos and Arterial Tortuosity Syndromes' Dermal Fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In hEDS and HSD cells, the αvβ3 integrin was shown to be involved in the fibroblast-to-myofibroblast transition by a transduction pathway involving ILK that signals to the transcription factor Snail1"
    explanation: >
      The primary cell-model paper supports the integrin/ILK/Snail1 branch.
  - reference: PMID:29587413
    reference_title: "Multifaced Roles of the αvβ3 Integrin in Ehlers-Danlos and Arterial Tortuosity Syndromes' Dermal Fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "hEDS and HSD cells exhibit a peculiar in vitro myofibroblast-like phenotype characterized by organization of the α-smooth muscle actin (α-SMA) cytoskeleton, expression of the cadherin-11, and enhanced migratory capability, probably because they synthesize high levels of MMP9, a collagenase also able to digest FN into proteolytic fragments"
    explanation: >
      Patient fibroblasts show the α-SMA/cadherin-11 myofibroblast markers and
      high MMP9 collagenase, providing a candidate ECM-degrading mechanism that
      generates fibronectin fragments driving the transition.

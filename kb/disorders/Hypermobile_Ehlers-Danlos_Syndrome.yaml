    evidence:
    - reference: PMID:31075184
      reference_title: "Pain in hypermobile Ehlers-Danlos syndrome: New insights using new criteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Neuropathic pain was frequent in the most painful joint and associated with heat hypoesthesia."
      explanation: >-
        Heat hypoesthesia with neuropathic pain is the sensory signature of small
        fiber loss at the painful site; the study used quantitative sensory
        testing without skin biopsy, so the small-fiber attribution is inferred.
  - target: Cardiovascular and gastrointestinal autonomic dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - heds_small_fiber_neuropathy_model
    description: >-
      Loss of postganglionic autonomic fibers is proposed as a primary
      peripheral contribution to dysautonomia in hEDS, complementary to the
      vessel-laxity route; the autonomic symptom score tracked sudomotor fiber
      impairment.
    evidence:

discussions:
- discussion_id: gap_heds_causal_architecture
  prompt: >-
    Is hEDS a locus-heterogeneous Mendelian disorder, a common-variant complex
    trait, or a composite of both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  - inheritance#Autosomal dominant inheritance pattern
  rationale: >-
    The entry records autosomal dominant transmission, but no causal gene has
    been validated. Exome sequencing of diagnostically unresolved EDS found
    candidate loci without genome-wide significance, a GWAS meta-analysis found
    common-variant contributions, and a KLK15 missense variant segregated in two
    families with a supporting knock-in mouse. These three results are
    compatible with very different disease architectures, and the choice between
    them determines whether diagnostic sequencing is even the right instrument.
  proposed_experiments:
  - experiment_id: exp_heds_joint_architecture_partition
    name: Joint rare-variant and common-variant architecture partition
    description: >-
      Partition hEDS liability across rare and common variation in a single
      analysis rather than in separate studies. Combine the HEDGE whole-genome
      cohort with published GWAS summary statistics to estimate SNP-based
      heritability, gene-level rare-variant burden, and the fraction of familial
      recurrence each explains. Include an explicit replication arm for KLK15
      and the wider kallikrein family in unrelated probands.
    experiment_type:
      preferred_term: statistical genetics architecture partition
    decision_criterion: >-
      Whether rare-variant burden or common-variant polygenic score explains the
      larger share of liability, and whether kallikrein-family burden replicates
      outside the discovery cohort. A monogenic or oligogenic architecture is
      indicated if replicated rare-variant burden dominates and segregates in
      families; a complex-trait architecture if SNP-based heritability dominates
      and no gene reaches exome-wide significance, which would also remove the
      expectation that a single validated causal gene is the endpoint of hEDS
      genetics.
    would_support:
    - inheritance#Autosomal dominant inheritance pattern
    would_refute:
    - inheritance#Autosomal dominant inheritance pattern
  evidence:
  - reference: PMID:37813462
    reference_title: Genetic complexity of diagnostically unresolved Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic burden analysis revealed a number of novel loci, although none
      reached the threshold for genome-wide significance.
    explanation: >-
      Exome sequencing of unresolved EDS patients failed to identify a
      significant locus, which is the primary evidence that hEDS is not a
      simple monogenic disorder.
  - reference: PMID:41001447
    reference_title: >-
      Complex Genetics and Regulatory Drivers of Hypermobile Ehlers-Danlos
      Syndrome: Insights from Genome-Wide Association Study Meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to other EDS subtypes with defined genetic causes, the
      molecular basis of hEDS has remained elusive.
    explanation: >-
      The GWAS meta-analysis states the unresolved molecular basis that motivates
      this gap, and supplies the common-variant arm of the competing hypotheses.
  - reference: PMID:38947032
    reference_title: Variants in the Kallikrein Gene Family and Hypermobile Ehlers-Danlos Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense variant in Kallikrein-15 (KLK15 p. Gly226Asp), segregated with
      disease in two families
    explanation: >-
      The human-genetic arm of the monogenic hypothesis: KLK15 segregates with
      disease in two families. Partial rather than full support because the
      finding is unreplicated outside the discovery cohort.
  - reference: PMID:38947032
    reference_title: Variants in the Kallikrein Gene Family and Hypermobile Ehlers-Danlos Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic burden analyses of 197 sporadic hEDS patients revealed enrichment
      of variants within the Kallikrein gene family
    explanation: >-
      Extends the single-family signal to a sporadic cohort, which is the
      observation the proposed replication arm of the architecture-partition
      experiment would test.
  - reference: PMID:38947032
    reference_title: Variants in the Kallikrein Gene Family and Hypermobile Ehlers-Danlos Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with our clinical cohort, Klk15G224D/+ mice displayed
      structural and functional connective tissue defects within multiple organ
      systems.
    explanation: >-
      Knock-in mouse recapitulates multisystem connective tissue defects. Kept
      as a separate MODEL_ORGANISM item so the animal evidence is not scored as
      human genetic support for the monogenic arm.
- discussion_id: gap_heds_hsd_boundary
  prompt: >-
    Is the 2017 criteria-based split between hEDS and hypermobility spectrum
    disorder biologically real, or an artifact of a threshold-based checklist?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  - pathophysiology#Myofibroblast-like fibroblast transition
  rationale: >-
    Two independent molecular datasets from the same group point the same way:
    dermal fibroblast RNA-seq across 20 hEDS and 20 HSD patients found a shared
    cellular phenotype, and plasma ECM-fragmentation profiling found a shared
    fibronectin and collagen-I signature. If no molecular boundary exists, the
    dismech decision to keep separate hEDS and HSD framing needs an explicit
    justification, and cohort assembly for every other hEDS question is affected.
  proposed_experiments:
  - experiment_id: exp_heds_hsd_blinded_molecular_classifier
    name: Blinded molecular classifier for the hEDS/HSD boundary
    description: >-
      Train a classifier on GSE218012 dermal fibroblast RNA-seq to separate hEDS
      from HSD, with healthy donors as a positive-control contrast, using nested
      cross-validation and label permutation to establish the null. Repeat on
      plasma ECM-fragment profiles from an independent cohort.
    experiment_type:
      preferred_term: supervised classification of transcriptomic profiles
    decision_criterion: >-
      Whether hEDS-versus-HSD classification accuracy exceeds the permuted null,
      given that the same pipeline separates patients from healthy donors. A
      real biological boundary is indicated if hEDS and HSD separate above the
      null; a single-entity model if the two are inseparable while both separate
      from controls, which would mean the 2017 criteria threshold does not track
      a molecular distinction and that these nodes describe one shared substrate
      rather than an hEDS-specific one.
    would_support:
    - pathophysiology#Candidate extracellular matrix remodeling abnormalities
    - pathophysiology#Myofibroblast-like fibroblast transition
    would_refute:
    - pathophysiology#Candidate extracellular matrix remodeling abnormalities
    - pathophysiology#Myofibroblast-like fibroblast transition
  evidence:
  - reference: PMID:39225014
    reference_title: >-
      Bridging the Diagnostic Gap for Hypermobile Ehlers-Danlos Syndrome and
      Hypermobility Spectrum Disorders: Evidence of a Common Extracellular
      Matrix Fragmentation Pattern in Patient Plasma as a Potential Biomarker.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      supporting their classification as a single disorder and prompting
      reconsideration of the hEDS criteria
    explanation: >-
      The plasma biomarker study explicitly argues that hEDS and HSD should be
      treated as one entity, which is the controversy recorded here.
  - reference: PMID:36552803
    reference_title: >-
      RNA-Seq of Dermal Fibroblasts from Patients with Hypermobile Ehlers-Danlos
      Syndrome and Hypermobility Spectrum Disorders Supports Their
      Categorization as a Single Entity with Involvement of Extracellular Matrix
      Degrading and Proinflammatory Pathomechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that both cell types show a common cellular trait, i.e.,
      generalized extracellular matrix (ECM) disarray, myofibroblast
      differentiation, and dysregulated gene expression.
    explanation: >-
      Independent transcriptomic evidence that hEDS and HSD fibroblasts share
      the same cellular phenotype.
- discussion_id: gap_heds_criterion3_exclusion_boundary
  prompt: >-
    What is the minimum sufficient genetic workup before criterion 3 of the 2017
    criteria (exclusion of alternative diagnoses) can be considered satisfied?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  rationale: >-
    hEDS is a diagnosis of exclusion, but the exclusion set is undefined. In a
    single-center series, a quarter of patients who already met all three 2017
    criteria were found on genetic testing to have an alternative or additional
    diagnosis with different management. Without a specified panel, criterion 3
    is unfalsifiable and cohort purity varies by center, which contaminates every
    downstream hEDS study including the genetic ones.
  proposed_experiments:
  - experiment_id: exp_heds_exclusion_panel_yield_curve
    name: Diagnostic-yield curve for a defined hEDS exclusion panel
    description: >-
      Assemble a candidate exclusion gene set from the EDS, Loeys-Dietz,
      heritable thoracic aortic disease, and EDS-mimicking Mendelian disorder
      panels, annotated with ClinGen gene-disease validity and dosage
      sensitivity. Apply it retrospectively to consecutive criteria-positive
      hEDS cohorts and plot reclassification yield against panel size to find
      where the curve flattens.
    experiment_type:
      preferred_term: retrospective diagnostic yield analysis
    decision_criterion: >-
      The panel size at which incremental reclassification yield falls below a
      pre-specified threshold. A bounded minimum panel that makes criterion 3
      operational is indicated if the curve flattens; a high sustained
      reclassification yield would instead mean criteria-positive cohorts are
      substantially contaminated by alternative diagnoses, undermining the
      cohort basis on which this node's mechanism evidence rests.
    would_support:
    - pathophysiology#Candidate extracellular matrix remodeling abnormalities
    would_refute:
    - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  evidence:
  - reference: PMID:40428350
    reference_title: >-
      Hypermobile Ehlers-Danlos Syndrome: Diagnostic Challenges and the Role of
      Genetic Testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing identified an alternative or additional diagnosis in 47 of
      these individuals (26.4%), with clinical implications requiring distinct
      management strategies.
    explanation: >-
      Quantifies how often criteria-positive hEDS patients carry an alternative
      diagnosis, establishing that criterion 3 is currently under-enforced.
- discussion_id: gap_heds_dysautonomia_mechanism
  prompt: >-
    What mechanisms connect hEDS to peripheral neuropathy, orthostatic tachycardia,
    and gastrointestinal dysmotility, and do they differ between clinical subgroups?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  - pathophysiology#Small fiber neuropathy with autonomic fiber loss
  - pathophysiology#Venous pooling from distensible dependent vessels
  - pathophysiology#Cardiovascular and gastrointestinal autonomic dysfunction
  - phenotypes#Orthostatic tachycardia
  - phenotypes#Peripheral neuropathy
  - phenotypes#Gastrointestinal dysmotility
  rationale: >-
    The referred autonomic-testing cohort documents substantial neurologic and
    autonomic morbidity, but it is not an unselected hEDS population and POTS was
    present in 33%, not most patients. Gastroenterology guidance describes
    biological links as limited and evolving. No causal edge from the cultured ECM
    or myofibroblast nodes to these clinical features is established by those
    association data. Two candidate routes to the dysautonomia are drawn as
    hypothetical and provisional nodes, loss of postganglionic autonomic small
    fibers and venous pooling from lax vessel walls. Neither has been measured
    against the other in hEDS; the one direct venous-compliance measurement in
    postural tachycardia, in a cohort not selected for hEDS, was normal, and
    standard autonomic testing does not separate hEDS-associated postural
    tachycardia from postural tachycardia of other cause. The route from any
    mechanism to gut dysmotility rests on a consensus listing, not a study.
  proposed_experiments:
  - experiment_id: exp_heds_neuroimmune_locus_to_nerve_bridge
    name: Genotype-anchored small-fiber neuropathy stratification
    description: >-
      Stratify a deeply phenotyped hEDS cohort with skin biopsy intraepidermal
      nerve fiber density, autonomic function testing, and transcranial Doppler
      cerebral blood flow by genotype at the GWAS-implicated regulatory locus,
      using GTEx tibial nerve as the eQTL reference tissue. Test whether risk
      allele carriers show greater fiber loss or cerebral hypoperfusion than
      non-carriers with equivalent joint phenotypes.
    experiment_type:
      preferred_term: genotype-stratified deep phenotyping study
    decision_criterion: >-
      Whether neuropathic and cerebrovascular measures differ by genotype after
      adjustment for joint-phenotype severity. A replicated genotype effect would
      motivate testing a neuroimmune mechanism. A null result would not establish
      a purely mechanical explanation or exclude other mechanisms.
    would_support:
    - phenotypes#Orthostatic tachycardia
    - phenotypes#Peripheral neuropathy
    would_refute:
    - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  evidence:
  - reference: PMID:40387691
    reference_title: >-
      AGA Clinical Practice Update on GI Manifestations and Autonomic or Immune
      Dysfunction in Hypermobile Ehlers-Danlos Syndrome: Expert Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      while theoretical explanations exist, experimental evidence of the
      biological mechanisms that explain relationships is limited and evolving
    explanation: >-
      A society expert review stating directly that the mechanism behind the
      hEDS/POTS/MCAS association is unestablished.
  - reference: PMID:40843452
    reference_title: >-
      Hypermobile Ehlers-Danlos Syndrome: Cerebrovascular, Autonomic and
      Neuropathic Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small fiber neuropathy using structural criteria was detected in 64%, and
      using combined structural and functional criteria in 82%.
    explanation: >-
      Documents small-fiber neuropathy in the selected 270-patient
      autonomic-testing cohort; selection and differing diagnostic definitions
      limit generalization.
  - reference: PMID:40843452
    reference_title: >-
      Hypermobile Ehlers-Danlos Syndrome: Cerebrovascular, Autonomic and
      Neuropathic Features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthostatic cerebral blood flow velocity was reduced in 79% of hEDS and
      correlated with orthostatic dizziness.
    explanation: >-
      Provides the cerebrovascular readout that a mechanistic model would need
      to explain.
- discussion_id: gap_heds_fascia_versus_dermis_substrate
  prompt: >-
    Is fascia, rather than dermis, the primary affected tissue in hEDS, and is
    the dermal fibroblast phenotype a proxy for it?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Myofibroblast-like fibroblast transition
  - pathophysiology#Joint instability and recurrent soft-tissue injury
  rationale: >-
    Every molecular dataset in this entry is derived from dermal fibroblasts,
    because skin is what is easy to biopsy. A fascia-centered model proposes that
    the clinically relevant substrate is deep fascia, where thickness,
    interfascial gliding, and stiffness abnormalities have been reported. If
    correct, the dermal fibroblast phenotype the pathophysiology nodes rest on is
    an accessible surrogate rather than the affected tissue, and no public
    fascia-specific omics dataset exists to test this.
  proposed_experiments:
  - experiment_id: exp_heds_paired_fascia_dermis_transcriptome
    name: Paired fascia and dermis transcriptomic comparison
    description: >-
      Collect paired deep fascia and dermis biopsies from the same hEDS patients
      and matched controls, with ultrasound measurement of fascial thickness and
      interfascial gliding at the biopsy site. Compare the ECM-remodeling and
      myofibroblast signatures between tissues within each patient, so that
      tissue effect is estimated independently of between-patient variation.
    experiment_type:
      preferred_term: paired-tissue transcriptomic comparison
    decision_criterion: >-
      Whether the disease signature is stronger in fascia than in paired dermis
      from the same individual, and whether it tracks the imaging measures.
      Concordance between the two tissues validates dermal fibroblasts as a
      surrogate and leaves these nodes standing; a signature confined to or
      much stronger in fascia indicates a fascia-primary model, and would mean
      the dermal fibroblast findings cannot be read directly as the
      tissue-level mechanism of joint instability.
    would_support:
    - pathophysiology#Myofibroblast-like fibroblast transition
    - pathophysiology#Joint instability and recurrent soft-tissue injury
    would_refute:
    - pathophysiology#Myofibroblast-like fibroblast transition
  evidence:
  - reference: PMID:40565051
    reference_title: >-
      Fascial Pathophysiology in Hypermobility Spectrum Disorders and Hypermobile
      Ehlers-Danlos Syndrome: A Review of Emerging Evidence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      By reframing hEDS and HSD as disorders of pathological fascial remodeling,
      this review offers an integrated model that connects molecular mechanisms
      with clinical expression.
    explanation: >-
      States the competing tissue-level model that this open question is about.
  - reference: PMID:40565051
    reference_title: >-
      Fascial Pathophysiology in Hypermobility Spectrum Disorders and Hypermobile
      Ehlers-Danlos Syndrome: A Review of Emerging Evidence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It underscores the urgent need for multidisciplinary research to define
      diagnostic biomarkers, clarify therapeutic targets
    explanation: >-
      The review itself frames these as unresolved research needs rather than
      established findings.
- discussion_id: gap_heds_sex_ratio
  prompt: >-
    Why is hEDS diagnosed in women several times more often than in men despite
    apparently autosomal dominant transmission?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal dominant inheritance pattern
  rationale: >-
    Clinic series report female-to-male ratios of roughly 7:1 for hEDS and higher
    still for HSD, which is irreconcilable with autosomal dominant inheritance
    unless sex modifies penetrance, expressivity, or ascertainment. The competing
    explanations (hormonal modulation of connective tissue, sex differences in
    pain reporting, referral and diagnostic bias) have different consequences:
    one is disease biology that belongs in the pathograph, the others are study
    design artifacts that would bias every hEDS cohort assembled to date.
  proposed_experiments:
  - experiment_id: exp_heds_sex_ratio_ascertainment_decomposition
    experiment_design: HUMAN_OBSERVATIONAL
    name: Ascertainment-controlled sex ratio decomposition
    description: >-
      Compare the hEDS sex ratio between referral-based clinic cohorts and
      population-based sampling frames such as biobank or national registry
      cohorts ascertained on diagnosis codes rather than specialist referral.
      Within families, compare penetrance in male versus female first-degree
      relatives of affected probands, which holds genotype risk approximately
      constant across sexes.
    experiment_type:
      preferred_term: ascertainment bias decomposition
    decision_criterion: >-
      Whether the sex ratio persists in population-based and within-family
      sampling after removing referral-based ascertainment. Persistence within
      families indicates sex-modified penetrance as real disease biology, which
      would qualify the plain autosomal dominant model recorded here; a ratio
      collapsing toward 1:1 under population sampling indicates a purely
      ascertainment-driven explanation and leaves the inheritance model intact.
    would_support:
    - inheritance#Autosomal dominant inheritance pattern
    would_refute:
    - inheritance#Autosomal dominant inheritance pattern
  evidence:
  - reference: PMID:41993759
    reference_title: >-
      Females with hypermobile Ehlers-Danlos syndrome self-report more sexual
      problems than chronic pain controls without hypermobility, males, or
      patients with hypermobile spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although hEDS and HSD are autosomal-dominant conditions and would be
      expected to display a 1:1 sex ratio, studies report higher prevalence in
      women.
    explanation: >-
      States the inheritance-versus-observation contradiction that defines this
      gap.
- discussion_id: gap_heds_myofibroblast_causal_dependency
  prompt: >-
    Is the alpha-v-beta-3/ILK/Snail1 myofibroblast transition a causal driver of
    extracellular matrix failure in hEDS, a passenger of the disease state, or a
    mechanotransduction artifact of culture on rigid plastic?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Myofibroblast-like fibroblast transition
  - pathophysiology#Candidate extracellular matrix remodeling abnormalities
  rationale: >-
    The myofibroblast-like transition is the most mechanistically detailed node
    in this entry, but every observation supporting it comes from patient
    fibroblasts grown on tissue-culture plastic, and the node's own description
    already concedes it is model evidence rather than a validated biomarker.
    Substrate rigidity is an independent and sufficient inducer of myofibroblast
    differentiation in disease fibroblasts, so the reported hEDS phenotype is
    confounded by the culture format at the point of measurement. Three outcomes
    are live: the transition is a causal dependency of ECM failure, a passenger
    that tracks disease without driving it, or a stiffness artifact that a soft
    substrate abolishes in patient and control cells alike. The node currently
    carries no downstream causal edges, which is the honest reflection of that
    uncertainty; only the first outcome would justify drawing one, and only the
    first makes the axis a therapeutic target.
  proposed_experiments:
  - experiment_id: exp_heds_myofibroblast_stiffness_controlled_perturbation
    experiment_design: TARGETED_PERTURBATION
    name: Stiffness-controlled perturbation screen of the myofibroblast transition
    description: >-
      Culture a panel of hEDS, HSD, and control dermal fibroblasts across a
      substrate-stiffness series spanning soft matrix and rigid tissue-culture
      plastic, crossed with a bounded perturbation set targeting the proposed
      axis (alpha-v-beta-3 integrin blockade, ILK inhibition, SNAI1 knockdown,
      TGF-beta pathway modulation, MMP9 inhibition). Score alpha-smooth muscle
      actin stress-fiber organization, fibronectin matrix assembly, MMP9
      secretion, and migration by high-content imaging, with the perturbation
      set chosen from the differentially expressed genes in GSE218012. The
      stiffness arm is the control the existing literature lacks, and the
      plate-based readouts make this the one gap in this entry with a protocol
      an autonomous laboratory could compile and run.
    experiment_type:
      preferred_term: high-content perturbation screen
    model_systems:
    - name: Patient-derived dermal fibroblast panel on defined-stiffness substrates
      description: >-
        Primary hEDS, HSD, and control dermal fibroblasts cultured on hydrogels
        of controlled elastic modulus alongside conventional rigid plastic.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    decision_criterion: >-
      Whether the hEDS-versus-control difference in myofibroblast conversion and
      matrix assembly survives on soft substrate, and whether perturbing the
      alpha-v-beta-3/ILK/Snail1 axis rescues matrix assembly rather than only
      reducing the alpha-smooth muscle actin marker. A causal dependency is
      indicated if axis perturbation restores matrix assembly and the
      patient-control difference persists on soft substrate; a passenger role if
      perturbation removes the marker without restoring matrix assembly; and a
      rigid-culture mechanotransduction artifact rather than hEDS biology if the
      patient-control difference disappears on soft substrate.
    would_support:
    - pathophysiology#Myofibroblast-like fibroblast transition
    would_refute:
    - pathophysiology#Myofibroblast-like fibroblast transition
  evidence:
  - reference: PMID:29587413
    reference_title: >-
      Multifaced Roles of the αvβ3 Integrin in Ehlers-Danlos and Arterial
      Tortuosity Syndromes' Dermal Fibroblasts.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In hEDS and HSD cells, the αvβ3 integrin was shown to be involved in the
      fibroblast-to-myofibroblast transition
    explanation: >-
      Establishes the specific signaling axis this gap proposes to test as a
      causal dependency.
  - reference: PMID:31409039
    reference_title: >-
      Cellular and Molecular Mechanisms in the Pathogenesis of Classical,
      Vascular, and Hypermobile Ehlers-Danlos Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our in vitro studies confirmed the phenotypic conversion of hEDS/HSD
      fibroblasts into migrating myofibroblast-like cells
    explanation: >-
      Confirms the observation is reproducible in vitro, which is what makes the
      culture-format confound worth resolving rather than dismissing.
  - reference: PMID:40343813
    reference_title: >-
      Matrix Softness Induces an Afibrogenic Lipofibroblast Phenotype in
      Fibroblasts from Patients with Idiopathic Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      culture in soft microenvironments (as spheroids or on soft
      collagen-coated substrate) redirects myofibroblasts to a
      lipofibroblast-like phenotype
    explanation: >-
      Demonstrates in disease-derived fibroblasts that substrate stiffness alone
      controls myofibroblast identity, establishing the confound that motivates
      the stiffness-controlled arm of the proposed experiment.
  - reference: PMID:40343813
    reference_title: >-
      Matrix Softness Induces an Afibrogenic Lipofibroblast Phenotype in
      Fibroblasts from Patients with Idiopathic Pulmonary Fibrosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The fibrogenic effects of TGF-β1 are prevented in fibroblasts cultured in
      soft settings.
    explanation: >-
      Shows that a canonical pro-fibrotic stimulus loses its effect on soft
      substrate, so a stiffness arm is required before any hEDS fibroblast
      phenotype can be called disease biology.
- discussion_id: gap_heds_clinical_phenotype_mechanisms
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which mechanisms account for migraine, dental crowding, high narrow palate,
    depression and acrocyanosis in hEDS, the manifestations for which no source
    states a route from the disease, and is clinical myalgia produced by central
    sensitization or by myofascial response to joint instability?
  attaches_to:
  - phenotypes#Migraine
  - phenotypes#Dental crowding
  - phenotypes#High, narrow palate
  - phenotypes#Depression
  - phenotypes#Acrocyanosis
  - phenotypes#Myalgia
  rationale: >-
    The literature reviewed here offers mechanistic routes, of graded confidence,
    for the cutaneous, structural, pain, fatigue, autonomic, gastrointestinal and
    sleep manifestations. It offers none for five. Migraine is the commonest
    primary headache in hypermobile populations; the headache review attributes
    the excess to secondary headaches from spontaneous intracranial hypotension,
    craniocervical instability and temporomandibular dysfunction, none of which
    is a curated phenotype here, and proposes no chain to primary migraine.
    Dental crowding and high narrow palate are listed craniofacial features
    without a morphometric study, and the one cohort to phenotype faces found no
    craniofacial difference from controls. Depression is associated at a modest
    odds ratio; the neuroconnective review treats it beside anxiety without a
    depression-specific mechanism, and pain, fatigue and disability are the
    obvious but untested downstream route. Acrocyanosis is a vasomotor sign of
    orthostatic pooling in postural tachycardia generally, but no EDS study
    links it to the dysautonomia, so it is left unwired. Myalgia has a
    hypothetical edge from central sensitization, measured as muscle-site
    hyperalgesia, while myofascial spasm as a response to joint instability is
    explicitly not systematically studied. Marfanoid habitus remains in the cited clinical
    summary without a new disproportionate-tall-stature annotation, which would
    imply height detail not established by the general descriptor.
  evidence:
  - reference: PMID:42640494
    reference_title: "Headache in patients with joint hypermobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In hypermobile populations, migraine is the most common primary headache phenotype; however, secondary causes, including spontaneous intracranial hypotension, craniocervical instability, temporomandibular dysfunction, Chiari malformation, and vascular complications, occur with increased frequency and require systematic consideration."
    explanation: Names the secondary headache mechanisms the field attributes to laxity, and leaves primary migraine without one.
  - reference: PMID:28073822
    reference_title: "Obstructive sleep apnoea and quality of life in Ehlers-Danlos syndrome: a parallel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of a difference between the two study groups in terms of craniofacial phenotypes."
    explanation: The only controlled craniofacial phenotyping in EDS found no difference, which leaves the palate and dental findings without a demonstrated craniofacial basis.
  - reference: PMID:41432355
    reference_title: "Comprehensive Risk Profile of Gastrointestinal and Extra Articular Comorbidities in Ehlers-Danlos Syndrome: A Propensity-Matched Analysis of 118,256 Individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychiatric conditions showed heightened prevalence of anxiety (26.1%, OR 1.8, 95% CI 1.7-1.8, p < 0.001) and depression (18.7%, OR 1.3, 95% CI 1.2-1.3, p < 0.001)."
    explanation: The depression association is modest; the psychiatric review cited for anxiety mentions depression without a depression-specific mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1279/
    reference_title: Hypermobile Ehlers-Danlos Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myofascial spasm possibly occurs in response to chronic joint instability,
      but this has not been systematically studied.
    explanation: >-
      The proposed joint-instability-to-myalgia bridge remains uncertain even in the clinical review.
  - reference: PMID:31409039
    reference_title: >-
      Cellular and Molecular Mechanisms in the Pathogenesis of Classical,
      Vascular, and Hypermobile Ehlers-Danlos Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      specific molecular pathways or mediators of pain are still unknown.
    explanation: >-
      The review distinguishes clinical pain from unestablished molecular
      mediators; cultured-cell findings cannot explain all clinical manifestations
      by default. OTHER classifies this statement about the state of knowledge,
      whereas IN_VITRO classifies the same review's cultured-cell findings above.

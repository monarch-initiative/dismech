      reference_title: "Distinct sensory and autonomic involvement in hypermobile Ehlers-Danlos syndrome compared with idiopathic small fiber neuropathy: a multimodal study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings suggest the existence of a primary dysfunction of the peripheral autonomic nervous system as a complementary mechanism contributing to POTS in hEDS."
      explanation: The authors' stated inference from greater autonomic fiber loss to the dysautonomia, framed as complementary to venous pooling.
- name: Venous pooling from distensible dependent vessels
  description: >-
    Proposed hemodynamic intermediate: lax venous walls distend excessively under
    ordinary hydrostatic pressure on standing, pooling blood in the splanchnic
    and lower-limb veins, reducing venous return and preload and provoking
    compensatory tachycardia. First proposed from a case series of adolescents
    with chronic fatigue syndrome, orthostatic intolerance and EDS, and
    described in the 2026 small fiber study as what many authors speculate. A
    PubMed search in November 2026 for Ehlers-Danlos with venous compliance,
    distensibility or pooling returned five records and no measurement of venous
    compliance in hEDS; the only direct measurement is in postural tachycardia
    of other cause, where compliance was normal, and autonomic testing in
    hEDS-associated POTS has not differed from POTS of other cause.
  mechanism_confidence: HYPOTHETICAL
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: vascular process in circulatory system
    modifier: ABNORMAL
    term:
      id: GO:0003018
      label: vascular process in circulatory system
  locations:
  - preferred_term: dependent peripheral veins
    term:
      id: UBERON:0001638
      label: vein
  evidence:
  - reference: PMID:10518084
    reference_title: "Orthostatic intolerance and chronic fatigue syndrome associated with Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "This in turn leads to increased venous pooling and its hemodynamic and symptomatic consequences."
    explanation: The proposal of venous pooling as the intermediate; a hypothesis offered to explain the case series, not a measurement.
  - reference: PMID:42399338
    reference_title: "Distinct sensory and autonomic involvement in hypermobile Ehlers-Danlos syndrome compared with idiopathic small fiber neuropathy: a multimodal study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "many authors speculated that the primary mechanism for such an association is an abnormal venous blood pooling due to an intrinsic laxity of the peripheral vessels"
    explanation: Records that the route is the field's prevailing speculation, in the words of a study that then proposes a complementary one.
  - reference: PMID:12010910
    reference_title: "Pooling in chronic orthostatic intolerance: arterial vasoconstrictive but not venous compliance defects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Volume-pressure relations of controls and POTS patients with normal P(v) and high P(v) were not different and were unchanged by orthostasis."
    explanation: >-
      The one direct measurement of venous compliance in postural tachycardia,
      by strain-gauge plethysmography in 15 adolescents, found it normal and
      attributed pooling to blunted arterial vasoconstriction. The cohort was
      not selected for hEDS, so this refutes the route as a general POTS
      mechanism and leaves the hEDS-specific claim unmeasured rather than
      disproved.
  - reference: PMID:28986003
    reference_title: "Postural tachycardia in hypermobile Ehlers-Danlos syndrome: A distinct subtype?"
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "While autonomic testing results were not significantly different between groups, patients with POTS+hEDS took more medications and had greater markers of healthcare utilization, with chronic pain likely playing a prominent role."
    explanation: >-
      Standard autonomic testing cannot distinguish hEDS-associated POTS from
      other POTS, so it neither supports nor refutes a vessel-laxity mechanism;
      recorded so the node is not read as having been tested.
  downstream:
  - target: Orthostatic tachycardia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced venous return and cardiac preload
    - baroreflex-mediated compensatory tachycardia
    hypothesis_groups:
    - heds_vessel_laxity_venous_pooling_model
    description: >-
      Reduced preload on standing is proposed to drive the excessive heart-rate
      rise; every patient in the originating case series had postural tachycardia
      or neurally mediated hypotension on orthostatic testing.
    evidence:
    - reference: PMID:10518084
      reference_title: "Orthostatic intolerance and chronic fatigue syndrome associated with Ehlers-Danlos syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Twelve patients (11 female), median age 15.5 years, met diagnostic criteria for CFS and EDS, and all had either postural tachycardia or neurally mediated hypotension in response to orthostatic stress."
      explanation: The clinical observation the venous-pooling proposal was made to explain; the pooling itself was not measured.
- name: Cardiovascular and gastrointestinal autonomic dysfunction
  description: >-
    Dysautonomia is one of the most consistent extra-articular features of hEDS:
    orthostatic intolerance presenting as postural tachycardia, orthostatic
    hypotension or neurally mediated hypotension, with gastrointestinal, bladder,
    sudomotor and thermoregulatory symptoms. Autonomic symptom burden by
    COMPASS-31 is severe, higher than in idiopathic small fiber neuropathy and
    concentrated in the orthostatic, gastrointestinal and urinary domains. Two
    upstream routes are proposed and neither is established: venous pooling from
    lax vessels, and loss of postganglionic autonomic fibers.
  mechanism_confidence: PROVISIONAL
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: regulation of heart rate
    modifier: ABNORMAL

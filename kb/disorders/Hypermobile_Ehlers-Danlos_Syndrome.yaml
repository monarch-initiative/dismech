- name: Impaired proprioception and muscle weakness
  description: >-
    Women with hEDS show impaired knee joint position sense and knee extensor and
    flexor strength and endurance reduced by 30-49% against matched controls,
    with normal muscle mass, so the weakness reflects muscle dysfunction rather
    than atrophy. Proprioceptive inacuity confounds the relation between strength
    and activity limitation. Whether the deficits arise from lax capsular
    mechanoreceptors, from pain-related disuse, or from a primary neuromuscular
    process is not established.
  notes: >-
    Joint position sense and muscle strength are kept on one node because the
    two deficits were measured in the same patient population, the strength
    study found them confounded with each other, and both feed the same
    clinical consequences; a study separating their contributions would justify
    splitting them.

    (reduced or absent gyri), reflecting a neuronal migration defect. Present in
    all reported affected individuals.
  phenotype_term:
    preferred_term: Lissencephaly
    term:
      id: HP:0001339
      label: Lissencephaly
  frequency: VERY_FREQUENT
  evidence:

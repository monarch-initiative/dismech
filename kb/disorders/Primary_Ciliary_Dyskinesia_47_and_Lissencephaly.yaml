animal_models:
- species: Mouse
  genotype: Trp73-null (p73-/-) and TAp73 isoform-specific knockout
  category: Engineered knockout
  description: >-
    p73-null (Trp73-/-) mice are the dominant mechanistic model for this entry.
    They show reduced and shortened airway motile cilia with chronic respiratory
    infection, plus CNS phenotypes (hydrocephalus, hippocampal dysgenesis) and
    sterility; TAp73 isoform-specific knockouts phenocopy the airway defect,
    establishing TAp73 as the multiciliogenesis regulator whose loss underlies the
    human disease. The mouse shows prominent hydrocephalus that is largely absent
    in the human cohort (see the HUMAN_MODEL_MISMATCH discussion).
  genes:
  - preferred_term: TP73
    term:
      id: hgnc:12003
      label: TP73
  evidence:
  - reference: PMID:26947080
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes
      observed in p73 knockout mice including hydrocephalus; hippocampal
      dysgenesis; sterility; and chronic inflammation/infection of lung, middle
      ear, and sinus.
    explanation: >-
      Documents the p73-null mouse multi-organ phenotype attributed to loss of the
      ciliary program.
    reference_title: p73 Is Required for Multiciliogenesis and Regulates the Foxj1-Associated Gene Network.
  - reference: PMID:27257214
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      identify TAp73 as the conserved central transcriptional integrator of
      multiciliogenesis
    explanation: >-
      TAp73 isoform-specific analysis in mouse airway cells establishes TAp73 as
      the central multiciliogenesis regulator.
    reference_title: TAp73 is a central transcriptional regulator of airway multiciliogenesis.

discussions:
- discussion_id: cild47-mouse-hydrocephalus-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Cortical Neuronal Migration
  prompt: >-
    Does the p73-null mouse ependymal/hydrocephalus phenotype faithfully model the
    human cortical malformation, given that overt hydrocephalus is largely absent
    in the reported human cohort (only transient prenatal ventriculomegaly in one
    individual)?
  rationale: >-
    The unifying cilia/cytoskeletal hypothesis for the human lissencephaly rests
    substantially on the p73-null mouse CNS phenotype, which is dominated by
    hydrocephalus. Because overt hydrocephalus is largely absent in humans, the
    translational validity of the mouse ependymal phenotype to the human cortical
    malformation is an open question.
  evidence:
  - reference: PMID:26947080
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes
      observed in p73 knockout mice including hydrocephalus; hippocampal
      dysgenesis; sterility; and chronic inflammation/infection of lung, middle
      ear, and sinus.
    explanation: >-
      Documents the prominent hydrocephalus of the p73-null mouse, the model
      phenotype whose human correlate is largely absent.
    reference_title: p73 Is Required for Multiciliogenesis and Regulates the Foxj1-Associated Gene Network.


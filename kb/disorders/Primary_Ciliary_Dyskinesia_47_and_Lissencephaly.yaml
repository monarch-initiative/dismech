treatments:
- name: Airway Clearance and Respiratory Infection Management
  description: >-
    As for other forms of primary ciliary dyskinesia, management is supportive and
    directed at the mucociliary clearance defect: airway clearance physiotherapy,
    prompt and often prophylactic antibiotics for recurrent respiratory infections,
    and surveillance for bronchiectasis. There is no disease-modifying therapy that
    restores multiciliated cell differentiation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autosomal-recessive deleterious variants in the TP53 family member TP73
      cause a mucociliary clearance disorder due to a defect in MCC differentiation
    explanation: >-
      The disorder is a mucociliary clearance disorder, the target of supportive
      airway-clearance management analogous to other primary ciliary dyskinesias.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
- name: Genetic Counseling
  description: >-
    Genetic counseling for an autosomal-recessive condition, with recurrence-risk
    discussion and carrier/cascade testing, is indicated — especially given the
    consanguinity common in reported families.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Neurodevelopmental Rehabilitation and Physical Therapy
  description: >-
    Supportive management of the neurodevelopmental phenotype (physical,
    occupational, and speech therapy) addresses hypotonia and developmental delay.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
mechanistic_hypotheses:
- hypothesis_group_id: reelin_cajal_retzius
  hypothesis_label: Cajal-Retzius / Reelin Migration Model
  status: EMERGING
  description: >-
    TP73 (p73) is coexpressed with reelin in Cajal-Retzius neurons of the
    developing cortex and hippocampus. Under this model, loss of TP73 depletes or
    dysregulates Reelin-producing Cajal-Retzius cells, impairing the
    Reelin-dependent radial-migration signal that guides cortical lamination and
    thereby producing the lissencephaly.
  evidence:
  - reference: PMID:15054064
    reference_title: p73 and Reelin in Cajal-Retzius cells of the developing human hippocampal formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the fetal human hippocampus, Cajal-Retzius (CR) cells coexpress p73, a
      p53-family member involved in cell survival and apoptosis, and the
      glycoprotein reelin, crucial for radial migration.
    explanation: >-
      Establishes the p73-Reelin coupling in human Cajal-Retzius cells that
      underlies this migration model.
- hypothesis_group_id: cilia_migration_unifying
  hypothesis_label: Unifying Cilia/Cytoskeletal Program Model
  status: EMERGING
  description: >-
    An alternative, non-exclusive model holds that the single TAp73-driven
    multiciliogenesis/cytoskeletal transcriptional program that builds airway and
    ependymal motile cilia also underlies neuronal migration, so its loss provides
    one unifying mechanism for the airway, ependymal (hydrocephalus), and cortical
    (lissencephaly, hippocampal dysgenesis) phenotypes seen in p73-null mice and
    in affected individuals. The two models are not mutually exclusive.
  evidence:
  - reference: PMID:26947080
    reference_title: p73 Is Required for Multiciliogenesis and Regulates the Foxj1-Associated Gene Network.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes
      observed in p73 knockout mice including hydrocephalus; hippocampal
      dysgenesis; sterility; and chronic inflammation/infection of lung, middle
      ear, and sinus.
    explanation: >-
      Frames a single loss-of-ciliary-program mechanism unifying the CNS and
      airway phenotypes of p73 loss.

diagnosis:
- name: Genetic Testing (Whole-Exome Sequencing / TP73)
  description: >-
    Whole-exome sequencing, or a PCD/ciliopathy gene panel including TP73, is the
    definitive diagnostic approach. The combination of PCD-like airway disease with
    lissencephaly should specifically prompt TP73 testing.
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Utilizing whole-exome sequencing analysis in a cohort of individuals with a
      mucociliary clearance disorder and cortical malformation, we identified
      homozygous loss-of-function variants in TP73
    explanation: >-
      Whole-exome sequencing on the combined airway + cortical-malformation
      phenotype was the diagnostic route to the TP73 variants.
    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
- name: Ciliary Cell-Biology Workup (immunofluorescence, HSVM, TEM)
  description: >-
    The airway phenotype is characterized with high-speed video microscopy,
    immunofluorescence, and transmission electron microscopy of respiratory
    epithelial cells to assess ciliary function, ciliary length, and the number of
    multiciliated cells (MCCs). CRITICAL PITFALL: unlike classic axonemal PCD, the
    axonemal ultrastructure on TEM is essentially normal in CILD47, so standard
    TEM-based PCD screening is falsely reassuring; the diagnostic signal is a
    reduced number and length of MCCs by immunofluorescence, not an axonemal defect.
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed high-speed video microscopy, immunofluorescence analyses, and
      transmission electron microscopy in respiratory epithelial cells after
      spheroid or air liquid interface culture to analyze ciliary function, ciliary
      length, and number of multiciliated cells (MCCs).
    explanation: Defines the cellular diagnostic workup used to characterize the ciliary phenotype.
    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
  notes: >-
    The normal-axonemal-ultrastructure ("normal TEM") pitfall is detailed in the
    Wallmeier et al. 2021 full text; it is the key point distinguishing this RGMC
    disorder from axonemal PCD and is summarized here rather than snippet-quoted
    from the abstract.


    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals exhibit a chronic airway disease as well as a brain
      malformation consistent with lissencephaly.
    explanation: All affected individuals had a brain malformation consistent with lissencephaly.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
- name: Chronic airway disease

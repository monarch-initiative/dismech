  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals exhibit a chronic airway disease as well as a brain
      malformation consistent with lissencephaly.
    explanation: Chronic airway disease from the mucociliary clearance defect was present in all affected individuals.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
- name: Abnormal ciliary motility
  category: Cellular

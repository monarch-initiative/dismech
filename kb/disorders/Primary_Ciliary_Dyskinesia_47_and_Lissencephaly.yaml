name: Primary Ciliary Dyskinesia 47 and Lissencephaly
creation_date: "2026-07-31T20:30:00Z"
category: Genetic
disease_term:
  preferred_term: ciliary dyskinesia, primary, 47, and lissencephaly
  term:
    id: MONDO:0030346
    label: ciliary dyskinesia, primary, 47, and lissencephaly
description: >-
  Primary ciliary dyskinesia 47 with lissencephaly (CILD47, OMIM 619466) is a
  rare autosomal-recessive motile ciliopathy caused by biallelic loss-of-function
  variants in TP73. Unlike classic primary ciliary dyskinesia, which arises from
  structural axonemal defects that leave an assembled cilium unable to beat, CILD47
  belongs to the "reduced generation of multiple motile cilia" (RGMC) subgroup
  (alongside MCIDAS-, CCNO-, and FOXJ1-related disease): TP73, a member of the TP53
  transcription-factor family, is the master transcriptional regulator of
  multiciliated cell (MCC) differentiation, acting upstream of FOXJ1 and RFX
  factors. Loss of TP73 severely reduces the number of MCCs and produces fewer,
  shorter motile cilia with basal bodies mislocalized in the cytoplasm, impairing
  mucociliary clearance and causing chronic airway disease. On mechanistic
  grounds, laterality defects (situs inversus) would not be expected in an RGMC
  disorder, because embryonic nodal monocilia are not products of the
  multiciliated-cell differentiation program that TP73 governs — a conceptual
  contrast with classic axonemal PCD, where the same axonemal machinery drives
  both airway cilia and nodal monocilia. TP73 is also expressed in Cajal-Retzius neurons where it is coupled
  to the Reelin pathway that guides radial neuronal migration; its loss produces a
  cortical malformation consistent with lissencephaly. The combination of a
  mucociliary clearance disorder with lissencephaly distinguishes CILD47 from other
  forms of primary ciliary dyskinesia.
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
inheritance:
- name: Autosomal recessive
  description: >-
    All reported affected individuals carry homozygous (autosomal-recessive)
    loss-of-function variants in TP73, identified in consanguineous and unrelated
    families by whole-exome sequencing.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified homozygous loss-of-function variants in TP73 in seven
      individuals from five unrelated families
    explanation: >-
      Establishes autosomal-recessive inheritance with homozygous TP73
      loss-of-function variants across five unrelated families.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
genetic:
- name: TP73
  gene_term:
    preferred_term: TP73
    term:
      id: hgnc:12003
      label: TP73
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in TP73 (tumor protein p73), a member of
    the TP53 transcription-factor family, are the cause of CILD47. TP73 is the
    master transcriptional regulator of multiciliated cell differentiation and is
    also required for normal corticogenesis. Variant spectrum (Wallmeier et al.
    2021, full text): all reported alleles are null / loss-of-function and were
    homozygous — a multi-exon deletion, a canonical splice-donor variant, and
    frameshift and nonsense variants across the five families; all disrupt both the
    TAp73 and the DeltaNp73 isoform classes. Penetrance is complete in reported
    homozygotes, consanguinity is the dominant ascertainment factor, and no genetic
    modifiers have been established. Exact cDNA/protein coordinates live in the
    primary full text and are not quotable from the indexed abstract, so they are
    summarized here at the variant-class level rather than asserted as
    snippet-verified evidence.
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that autosomal-recessive deleterious variants in the
      TP53 family member TP73 cause a mucociliary clearance disorder due to a
      defect in MCC differentiation.
    explanation: >-
      Identifies TP73 as the causal gene and defines the mechanism as a defect
      in multiciliated cell differentiation.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
pathophysiology:
- name: TP73 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish the transcriptional activity of
    TP73 (particularly the transactivation-domain-containing TAp73 isoforms). TP73
    belongs to the TP53 family of transcription factors; its non-oncogenic role as
    the master regulator of multiciliogenesis was first revealed in knockout mice.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TP73 belongs to the TP53 family of transcription factors and has therefore
      been well studied in cancer research. Studies in mice, however, have
      revealed non-oncogenic activities related to multiciliogenesis.
    explanation: >-
      Identifies TP73 as a TP53-family transcription factor with a
      multiciliogenesis role, the activity abolished by loss-of-function variants.
    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
  downstream:
  - target: Impaired Multiciliated Cell Differentiation
    description: Loss of TP73 transcriptional activity blocks the multiciliogenesis program.
  - target: Defective Cortical Neuronal Migration
    description: >-
      Loss of TP73 in Cajal-Retzius neurons disrupts Reelin-dependent radial
      migration during corticogenesis.

- name: Impaired Multiciliated Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    TAp73 acts upstream of the ciliogenic transcription factors FOXJ1 and RFX2 to
    drive differentiation of multiciliated cells. In TP73-deficient respiratory
    epithelium the number of MCCs is severely reduced, mirrored by a reduced number
    of cells expressing FOXJ1 and RFX2. In mouse models, TAp73 regulates ~50 genes
    required for ciliary formation and motility and its target FOXJ1 rescues the
    ciliary defect when re-expressed.
  cell_types:
  - preferred_term: multiciliated epithelial cell
    term:
      id: CL:0005012
      label: multiciliated epithelial cell
  biological_processes:
  - preferred_term: multi-ciliated epithelial cell differentiation
    term:
      id: GO:1903251
      label: multi-ciliated epithelial cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The number of MCCs is severely reduced, consistent with a reduced number of
      cells expressing the transcription factors crucial for multiciliogenesis
      (FOXJ1, RFX2).
    explanation: >-
      Directly demonstrates that TP73 loss reduces multiciliated cell
      differentiation via loss of FOXJ1/RFX2-expressing cells.
    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
  - reference: PMID:27257214
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      identify TAp73 as the conserved central transcriptional integrator of
      multiciliogenesis
    explanation: >-
      Establishes TAp73 as the central transcription factor controlling airway
      multiciliogenesis, the program lost in CILD47.
    reference_title: TAp73 is a central transcriptional regulator of airway multiciliogenesis.
  - reference: PMID:26947080
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that p73 is expressed in multiciliated cells (MCCs), is required
      for MCC differentiation, and directly regulates transcriptional modulators
      of multiciliogenesis.
    explanation: >-
      Demonstrates in murine cells that p73 (TP73) is required for multiciliated
      cell differentiation and directly regulates the FOXJ1-associated
      multiciliogenesis gene network.
    reference_title: p73 Is Required for Multiciliogenesis and Regulates the Foxj1-Associated Gene Network.
  downstream:
  - target: Motile Cilia Deficiency and Basal Body Mislocalization
    description: Failure of MCC differentiation yields fewer, shorter, mislocalized motile cilia.

- name: Motile Cilia Deficiency and Basal Body Mislocalization
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  description: >-
    TP73-deficient respiratory epithelial cells display reduced ciliary length and
    basal bodies that are mislocalized within the cytoplasm rather than docked at
    the apical membrane, together with a severely reduced number of multiciliated
    cells. This is a motile-cilia-arm ciliopathy mechanism, but distinct from
    classic PCD: the defect is a failure to generate normal numbers of motile cilia
    (a differentiation/docking defect) rather than an axonemal dynein-arm defect in
    an otherwise assembled cilium.
  cell_types:
  - preferred_term: multiciliated columnar cell of tracheobronchial tree
    term:
      id: CL:0002145
      label: multiciliated columnar cell of tracheobronchial tree
  biological_processes:
  - preferred_term: cilium movement
    term:
      id: GO:0003341
      label: cilium movement
    modifier: ABNORMAL
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The respiratory epithelial cells studied display reduced ciliary length and
      basal bodies mislocalized within the cytoplasm.
    explanation: >-
      Documents the cellular ciliary phenotype: shortened cilia and mislocalized
      basal bodies in patient respiratory epithelium.
    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
  downstream:
  - target: Impaired Mucociliary Clearance
    description: Deficient and dysfunctional motile cilia cannot clear airway mucus.
  - target: Abnormal ciliary motility
    description: >-
      Reduced ciliary length and number is observed clinically as abnormal ciliary
      function on high-speed video microscopy.

- name: Impaired Mucociliary Clearance
  biological_scale: TISSUE
  description: >-
    The reduced number and length of motile cilia on airway epithelium impairs
    mucociliary clearance, the coordinated ciliary transport of mucus and trapped
    particles out of the respiratory tract. The resulting mucus stasis drives
    chronic and recurrent upper and lower airway infection.
  cell_types:
  - preferred_term: multiciliated columnar cell of tracheobronchial tree
    term:
      id: CL:0002145
      label: multiciliated columnar cell of tracheobronchial tree
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: mucociliary clearance
    term:
      id: GO:0120197
      label: mucociliary clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:34077761
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals exhibit a chronic airway disease as well as a brain
      malformation consistent with lissencephaly.
    explanation: >-
      Links the ciliary defect to the clinical mucociliary clearance disorder
      (chronic airway disease) in all affected individuals.

    reference_title: Mutations in TP73 cause impaired mucociliary clearance and lissencephaly.
  downstream:
  - target: Chronic airway disease
    description: Mucus stasis drives chronic and recurrent airway infection.
  - target: Bronchiectasis
    description: Sustained infection and airway damage lead to bronchiectasis.
  - target: Otitis media
    description: Impaired clearance in the middle ear causes recurrent otitis media.
  - target: Neonatal respiratory distress
    description: Early-onset airway disease presents as neonatal respiratory distress in a subset.
- name: Defective Cortical Neuronal Migration
  biological_scale: TISSUE
  description: >-
    Beyond the airway, TP73 is expressed in Cajal-Retzius neurons of the developing
    cortex, where it is coexpressed with reelin, the glycoprotein that is crucial
    for radial neuronal migration and cortical lamination. The mechanism linking
    TP73 loss to lissencephaly is not established; two non-exclusive hypotheses are
    proposed. (1) A Cajal-Retzius/Reelin arm: loss of TP73 in Reelin-coexpressing
    Cajal-Retzius neurons disrupts Reelin-dependent radial migration. (2) A unifying
    cilia/cytoskeletal arm: the same TAp73-driven multiciliogenesis/cytoskeletal
    program that builds airway and ependymal motile cilia also underlies neuronal
    migration, so its loss provides a single mechanism for the airway, ependymal,
    and cortical phenotypes of p73-null mice (which show hydrocephalus and
    hippocampal dysgenesis). Either route disrupts radial neuronal migration,
    producing the cortical malformation (lissencephaly / agyria-pachygyria,
    anterior-predominant, often with a corpus callosum abnormality) seen in
    affected individuals.
  cell_types:
  - preferred_term: Cajal-Retzius cell
    term:
      id: CL:0000695
      label: Cajal-Retzius cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: ABNORMAL
  - preferred_term: cerebral cortex radially oriented cell migration
    term:
      id: GO:0021799
      label: cerebral cortex radially oriented cell migration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15054064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the fetal human hippocampus, Cajal-Retzius (CR) cells coexpress p73, a
      p53-family member involved in cell survival and apoptosis, and the
      glycoprotein reelin, crucial for radial migration.
    explanation: >-
      Couples TP73 (p73) to the Reelin radial-migration pathway in human
      Cajal-Retzius cells (human fetal-tissue immunohistochemistry), the basis of
      the Reelin hypothesis for the lissencephaly.
    reference_title: p73 and Reelin in Cajal-Retzius cells of the developing human hippocampal formation.
  - reference: PMID:26947080
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes
      observed in p73 knockout mice including hydrocephalus; hippocampal
      dysgenesis; sterility; and chronic inflammation/infection of lung, middle
      ear, and sinus.
    explanation: >-
      Supports the unifying cilia/cytoskeletal hypothesis, in which loss of the
      p73-driven ciliary program accounts for the CNS (hydrocephalus, hippocampal
      dysgenesis) as well as airway phenotypes of p73-null mice.
    reference_title: p73 Is Required for Multiciliogenesis and Regulates the Foxj1-Associated Gene Network.
  downstream:
  - target: Lissencephaly
    description: >-
      Disrupted radial neuronal migration produces a smooth-cortex malformation
      (mechanism unresolved; see mechanistic_hypotheses).
    hypothesis_groups:
    - reelin_cajal_retzius
    - cilia_migration_unifying
  - target: Global developmental delay
    description: >-
      The diffuse cortical malformation causes global developmental delay and
      intellectual disability.
  - target: Intellectual disability
    description: The cortical malformation results in intellectual disability.
  - target: Pachygyria
    description: Anterior-predominant pachygyria is part of the cortical malformation spectrum.
  - target: Abnormal corpus callosum morphology
    description: Corpus callosum hypoplasia/agenesis accompanies the migration defect.
  - target: Axial hypotonia
    description: Cortical malformation is associated with central (axial) hypotonia.


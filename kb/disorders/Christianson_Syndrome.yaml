animal_models:
- name: Nhe6-null mouse
  species: Mouse
  genotype: Slc9a6 knockout
  publication: PMID:29349289
  description: >-
    The principal model, and unusual in reproducing both halves of the human
    disease. Brain volume changes reflect undergrowth and tissue loss together,
    with Purkinje cell loss confirmed in two independent knockout lines.
  evidence:
  - reference: PMID:29349289
    reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
      Christianson Syndrome.

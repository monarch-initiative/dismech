genetic:
- name: SLC9A6
  gene_term:
    preferred_term: SLC9A6
    term:
      id: hgnc:11079
      label: SLC9A6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Loss of Function, X-linked
  notes: >-
    Loss of function is the usual mechanism, but not the only one. A de novo
    missense variant in the ion translocation domain, p.Gly218Arg, behaves as a
    potential gain of function: it alkalinises rather than acidifies the endosome
    and still causes the core phenotype, while sparing the motor deterioration
    usually seen after the first decade. The gene is therefore better described as
    setting endosomal pH than as acidifying or alkalinising it.
  evidence:
  - reference: PMID:29334451
    reference_title: Christianson Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of CS is established in a male proband by identification of a hemizygous
      pathogenic variant in SLC9A6 on the X chromosome and in a female proband by identification
      of a heterozygous SLC9A6 pathogenic variant on molecular genetic testing.'
    explanation: States the causal relationship and the molecular diagnostic criterion.
  - reference: PMID:30296617
    reference_title: A potential gain-of-function variant of SLC9A6 leads to endosomal alkalinization and
      neuronal atrophy associated with Christianson Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The patient manifested several core symptoms typical of CS, including pronounced
      cognitive impairment, mutism, epilepsy, ataxia and microcephaly; however, deterioration
      of motor function often observed after the first decade of life in CS children with total
      loss of SLC9A6/NHE6 function was not evident.'
    explanation: Documents the gain-of-function allele producing the core phenotype without the
      later motor deterioration, which is the basis for the allelic nuance in these notes.

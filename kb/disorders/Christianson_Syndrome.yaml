disease_term:
  preferred_term: Christianson syndrome
  term:
    id: MONDO:0010278
    label: Christianson syndrome
notes: >-
  Why the pathograph branches. This disorder is both neurodevelopmental and
  neurodegenerative in the same patient, and the two arms are modelled separately
  because they have different timing, different cellular substrates and different
  clinical consequences. The developmental arm runs through impaired arborisation
  and synaptogenesis to postnatal microcephaly and intellectual disability, and is
  fixed early. The degenerative arm runs through lysosomal failure and storage to
  Purkinje cell loss, progressive ataxia and regression, and continues through
  life. Collapsing them into one chain would lose the fact that a child can be
  developmentally static for a decade and then begin losing skills.

  Direction of the pH defect. NHE6 exports protons from the endosomal lumen, so
  losing it makes the compartment more acidic, not less. This is worth stating
  explicitly because the intuition runs the other way. The point is sharpened by
  p.Gly218Arg, a probable gain-of-function allele that alkalinises the endosome
  and still causes the core syndrome while sparing the later motor deterioration.
  Both directions are pathogenic, so the node is framed as loss of pH control.

  Where the chain stands. The BDNF-TrkB link is graded PROVISIONAL rather than
  HYPOTHETICAL, on the strength of a rescue experiment: the selective TrkB agonist
  7,8-dihydroxyflavone restores dendritic spine density and both functional and
  structural long-term potentiation in Nhe6-null hippocampal neurons. Rescue is
  much stronger evidence than the correlation available from the organ-of-Corti
  study, and it supplies the forebrain evidence that study could not. The edge
  onward to arborisation is still graded INDIRECT_UNKNOWN_INTERMEDIATES, because
  spine density and arborisation are related but not the same measurement.

  A second, pH-independent route. NHE6 also acts as a scaffold that recruits
  CDK5 and its activator p35 to endosomal and plasma membranes, raising cell
  surface accumulation of TRPV1. This matters because it means not every
  consequence of losing NHE6 needs to run through endosomal pH, and it supplies
  the mechanism for the pain phenotype specifically: Nhe6-null mice show reduced
  surface TRPV1 in nociceptors and blunted responses to noxious thermal,
  mechanical and chemical stimuli. The pain edge was initially graded UNKNOWN in
  this entry for want of any mechanism, and was upgraded once that work was
  found.

  Relationship to Angelman syndrome. The behavioural overlap is close enough that
  this disorder was originally described as X-linked Angelman-like syndrome, and
  the practical route to diagnosis is often a molecularly negative Angelman
  workup. Angelman syndrome is curated separately here; the two are distinct
  diseases with distinct genes and are not modelled as subtypes of one another.

  On prevalence. No quotable prevalence or incidence figure was found in the
  cached sources, and the deep-research report independently reached the same
  conclusion, describing precise prevalence and incidence as undefined and the
  condition as an under-recognised cause of X-linked intellectual disability. The
  absence is therefore recorded as a property of the literature rather than as a
  gap in this curation.

  Known extension points: AAV-mediated SLC9A6 gene replacement, which rescues
  motor and molecular phenotypes in the shaker rat and is the leading
  disease-modifying candidate; TrkB agonists and autophagy enhancers as further
  preclinical directions; the reported genotype-phenotype gradient in which null
  variants carry refractory epilepsy and loop-region missense variants a
  seizure-free course; a progression section, which the longitudinal data would
  support well given the documented age-dependence of microcephaly, ataxia, pain
  threshold and hyperkinesis; corticospinal tract involvement, present in over
  half of those older than ten and not yet modelled as a phenotype; hearing loss,
  demonstrated in the mouse but not established as a human feature in these
  sources; and mortality, which the longitudinal study records without a rate that
  can be quoted usefully.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check, recorded at
  research/Christianson_Syndrome-deep-research-openscientist.md. Four of the ten
  cached references are full text rather than abstracts, and the content_type
  field in the cache frontmatter was checked before writing rather than after;
  the natural-history figures throughout come from reading those full texts.

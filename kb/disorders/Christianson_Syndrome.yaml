    explanation: Replication across two independent lines, which is why the finding is not treated
      as model-specific.
  modeled_mechanisms:
  - target: Progressive Neurodegeneration with Purkinje Cell Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces progressive Purkinje cell loss beginning in the cerebellum, with
      wider cortical, hippocampal and striatal volume loss appearing later.
    limitations: >-
      Mice do not accumulate insoluble endogenous tau or amyloid-beta, so this
      model cannot address the tau deposition reported in human post-mortem
      material. That is what the rat model below was made for.
    evidence:
    - reference: PMID:29349289
      reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
        Christianson Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Reductions in volume are first apparent at 2 mo, particularly in the cerebellum,
        which demonstrates progressive loss of Purkinje cells (PCs).'
      explanation: Gives the timing and regional onset of the degeneration this link records.
  - target: Impaired Endosomal Maturation and Lysosomal Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the selective neuronal glycolipid and cholesterol storage with
      loss of beta-hexosaminidase activity, closely resembling a lysosomal storage
      disorder.
    limitations: >-
      The storage is regionally selective rather than global, so the model does not
      explain why particular neuronal populations are vulnerable.
    evidence:
    - reference: PMID:21964919
      reference_title: X-linked Angelman-like syndrome caused by Slc9a6 knockout in mice exhibits evidence of
        endosomal-lysosomal dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'we found that sodium-hydrogen exchanger 6 depletion leads to abnormal accumulation
        of GM2 ganglioside and unesterified cholesterol within late endosomes and lysosomes of

name: Christianson Syndrome
creation_date: '2026-09-04T17:00:00Z'
description: >-
  An X-linked disorder caused by loss of function of SLC9A6, which encodes NHE6,
  the sodium-hydrogen exchanger of early and recycling endosomes. NHE6 supplies
  the proton leak that keeps endosomal pH from falling too far, so its loss
  over-acidifies the endosome and derails endosomal maturation, trafficking and
  the lysosomal system downstream of it. The clinical picture is unusual in being
  both neurodevelopmental and neurodegenerative in the same patient: impaired
  neuronal arborisation and synaptogenesis produce postnatal microcephaly,
  non-verbal status and severe intellectual disability, while progressive
  Purkinje cell loss and glycolipid storage produce a worsening ataxia and, in
  many, frank regression from the second decade. Affected males meet a tight set
  of core criteria; heterozygous females range from asymptomatic to mildly
  affected, in proportion to X-inactivation.
categories:
- X-linked Intellectual Disability
- Endosomal Trafficking Disorder
- Neurodevelopmental and Neurodegenerative Disorder
parents:
- X-linked syndromic intellectual disability
synonyms:
- X-linked Angelman-like syndrome
- MRXSCH
- intellectual disability, X-linked syndromic, Christianson type
epidemiology:
- name: Core diagnostic criteria
  description: >-
    Six core features are present in over 85% of affected males, and universally
    present between ages 6 and 16: non-verbal status, intellectual disability,
    epilepsy, postnatal microcephaly, ataxia and hyperkinesia. High pain
    tolerance was added as a seventh core feature at 91%.
  evidence:
  - reference: PMID:37987014
    reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
      Adolescents, and Adults.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Previously defined core diagnostic criteria for CS (present in >85%) - namely nonverbal
      status, intellectual disability, epilepsy, postnatal microcephaly, ataxia, hyperkinesia
      - were universally present in age 6 to 16; however, an additional core feature of high
      pain tolerance was added (present in 91%)'
    explanation: Enumerates the core criteria with their frequencies and the age window in which
      they are fully penetrant.
- name: Cohort size and allelic diversity
  description: >-
    The largest prospective series followed 44 individuals carrying 31 distinct
    NHE6 mutations from age 2 to 32, which is the basis for most of what is known
    about the adult phenotype.
  evidence:
  - reference: PMID:37987014
    reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
      Adolescents, and Adults.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Forty-four individuals with 31 unique NHE6 mutations, age 2 to 32 years, were followed
      prospectively, herein reporting baseline, 1-year follow-up, and retrospective natural
      history.'
    explanation: Gives the cohort size and the allelic heterogeneity behind the natural history
      data used throughout this entry.
pathophysiology:
- name: SLC9A6 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A hemizygous loss-of-function variant in SLC9A6
    eliminates NHE6 from early and recycling endosomes. Thirty-one distinct
    mutations are documented in the largest cohort, with no single recurrent
    allele.
  genes:
  - preferred_term: SLC9A6
    term:
      id: hgnc:11079
      label: SLC9A6
  evidence:
  - reference: PMID:29334451
    reference_title: Christianson Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of CS is established in a male proband by identification of a hemizygous
      pathogenic variant in SLC9A6 on the X chromosome and in a female proband by identification
      of a heterozygous SLC9A6 pathogenic variant on molecular genetic testing.'
    explanation: States the causal gene and the zygosity requirement in each sex.
  downstream:
  - target: Endosomal Over-Acidification
    causal_link_type: DIRECT
    description: NHE6 exchanges luminal protons for cations, supplying the leak that limits
      endosomal acidification. Without it the compartment over-acidifies.
    evidence:
    - reference: PMID:30296617
      reference_title: A potential gain-of-function variant of SLC9A6 leads to endosomal alkalinization and
        neuronal atrophy associated with Christianson Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Loss-of-function mutations in the recycling endosomal (Na+,K+)/H+ exchanger gene
        SLC9A6/NHE6 result in overacidification and dysfunction of endosomal-lysosomal
        compartments, and cause a neurodevelopmental and degenerative form of X-linked
        intellectual disability called Christianson Syndrome (CS).'
      explanation: States the direction of the pH change and names it as the cause of the
        endosomal-lysosomal dysfunction downstream.
- name: Endosomal Over-Acidification
  biological_scale: MOLECULAR
  description: >-
    Endosomal pH falls below its set point. The direction matters and is easy to
    get backwards: NHE6 removes protons from the lumen, so losing it acidifies
    rather than alkalinises. A rare gain-of-function variant produces the opposite
    derangement, and causes disease too, which indicates the compartment is tuned
    rather than simply requiring acidity.
  biological_processes:
  - preferred_term: regulation of intracellular pH
    modifier: ABNORMAL
    term:
      id: GO:0051453
      label: regulation of intracellular pH
  molecular_functions:
  - preferred_term: sodium:proton antiporter activity
    modifier: DECREASED
    term:
      id: GO:0015385
      label: sodium:proton antiporter activity
  evidence:
  - reference: PMID:30296617
    reference_title: A potential gain-of-function variant of SLC9A6 leads to endosomal alkalinization and
      neuronal atrophy associated with Christianson Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Compared to wild-type, G218R-containing endosomes were atypically alkaline and showed
      impaired uptake of recycling endosomal cargo.'
    explanation: The mirror-image experiment. A gain-of-function allele alkalinises the endosome
      and still impairs cargo uptake, which is why this node is framed as loss of pH control
      rather than as acidification alone.
  downstream:
  - target: Impaired Endosomal Maturation and Lysosomal Function
    causal_link_type: DIRECT
    description: Mis-set luminal pH disrupts the maturation and trafficking steps that depend on
      it, and the lysosomal system downstream inherits the defect.
    evidence:
    - reference: PMID:34928329
      reference_title: Early lysosome defects precede neurodegeneration with amyloid-β and tau aggregation in
        NHE6-null rat brain.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'We have recently shown that loss of NHE6 causes defects in endosome maturation
        and trafficking underlying lysosome deficiency in primary mouse neurons in vitro.'
      explanation: States the maturation and trafficking defect and its lysosomal consequence,
        which is what this edge asserts.
- name: Impaired Endosomal Maturation and Lysosomal Function
  biological_scale: CELLULAR
  description: >-
    Endosome maturation and trafficking fail, and the lysosome is left deficient.
    In the mouse this looks like a lysosomal storage disorder in miniature and
    confined to particular neuronal populations: GM2 ganglioside and unesterified
    cholesterol accumulate, and beta-hexosaminidase activity becomes undetectable
    in exactly those neurons.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: endosomal transport
    modifier: DECREASED
    term:
      id: GO:0016197
      label: endosomal transport
  - preferred_term: lysosome organization
    modifier: ABNORMAL
    term:
      id: GO:0007040
      label: lysosome organization
  evidence:
  - reference: PMID:21964919
    reference_title: X-linked Angelman-like syndrome caused by Slc9a6 knockout in mice exhibits evidence of
      endosomal-lysosomal dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'we found that sodium-hydrogen exchanger 6 depletion leads to abnormal accumulation
      of GM2 ganglioside and unesterified cholesterol within late endosomes and lysosomes of
      neurons in selective brain regions'
    explanation: Documents the storage material and its selective regional distribution.
  - reference: PMID:21964919
    reference_title: X-linked Angelman-like syndrome caused by Slc9a6 knockout in mice exhibits evidence of
      endosomal-lysosomal dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'In these select neuronal populations, histochemical staining for β-hexosaminidase
      activity, a lysosomal enzyme involved in the degradation of GM2 ganglioside, was
      undetectable.'
    explanation: Gives the enzymatic correlate of the storage, tying the accumulation to failed
      lysosomal degradation rather than to overproduction.
  downstream:
  - target: Reduced BDNF-TrkB Endosomal Signalling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: TrkB signals from endosomes and depends on Rab-mediated trafficking, which is
      disrupted here.
    evidence:
    - reference: PMID:32107410
      reference_title: 'Sodium-hydrogen exchanger 6 (NHE6) deficiency leads to hearing loss, via reduced endosomal
        signalling through the BDNF/Trk pathway.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'We found no change in Rab5, significantly lower Rab7, and higher Rab11 levels in
        the Nhe6 KO OC, compared to WT littermates. Because Rabs mediate TrkB endosomal
        signalling, we evaluated TrkB phosphorylation in the OCs of both strains.'
      explanation: Names the Rab intermediates that connect the trafficking defect to TrkB
        signalling, which is why this edge is graded as having known intermediates.
  - target: Progressive Neurodegeneration with Purkinje Cell Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Storage and lysosomal failure precede the degenerative phase. The steps between
      them are not established, and the temporal ordering is the main evidence for the direction.
    evidence:
    - reference: PMID:34928329
      reference_title: Early lysosome defects precede neurodegeneration with amyloid-β and tau aggregation in
        NHE6-null rat brain.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'NHE6-null rats demonstrated an early and rapid loss of Purkinje cells in the
        cerebellum, as well as a more protracted neurodegenerative course in the cerebrum.'
      explanation: Establishes the ordering, with lysosomal defects preceding the
        neurodegeneration this edge terminates in.
- name: Reduced BDNF-TrkB Endosomal Signalling
  biological_scale: CELLULAR
  description: >-
    TrkB and Akt phosphorylation fall. This is the arm that plausibly links a
    housekeeping trafficking defect to a specifically neuronal phenotype, since
    BDNF-TrkB signalling drives arborisation and synapse formation. It was
    demonstrated in the cochlea rather than in the forebrain, so its extension to
    the cognitive phenotype was, until recently, inference. A TrkB agonist rescue in
    hippocampal neurons has since supplied the forebrain evidence that was missing.
  biological_processes:
  - preferred_term: neurotrophin TRK receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048011
      label: neurotrophin TRK receptor signaling pathway
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:32107410
    reference_title: 'Sodium-hydrogen exchanger 6 (NHE6) deficiency leads to hearing loss, via reduced endosomal
      signalling through the BDNF/Trk pathway.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Nhe6 KO mice showed significant reductions in TrkB and Akt phosphorylation in the
      OC.'
    explanation: Direct measurement of reduced TrkB and Akt phosphorylation, in the organ of
      Corti.
  - reference: PMID:39341363
    reference_title: Impaired hippocampal plasticity associated with loss of recycling endosomal SLC9A6/NHE6
      is ameliorated by the TrkB agonist 7,8-dihydroxyflavone.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Significantly, the selective TrkB agonist 7,8-dihydroxyflavone restored spine density
      as well as functional and structural LTP in KO neurons.'
    explanation: A rescue experiment, and much stronger than correlation. Restoring TrkB signalling
      restores spine density and long-term potentiation in the hippocampus, which is the forebrain
      evidence the organ-of-Corti study could not provide.
  - reference: PMID:39341363
    reference_title: Impaired hippocampal plasticity associated with loss of recycling endosomal SLC9A6/NHE6
      is ameliorated by the TrkB agonist 7,8-dihydroxyflavone.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'We uncovered significant reductions in dendritic spines density, AMPA receptor (AMPAR)
      expression, and AMPAR-mediated neurotransmission in CA1 pyramidal neurons.'
    explanation: Locates the synaptic deficit in hippocampal CA1 neurons, connecting this node to
      the arborisation and synaptogenesis node downstream.
  downstream:
  - target: Impaired Neuronal Arborisation and Synaptogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced neurotrophin signalling is the proposed route to the arborisation and
      synaptogenesis defect, but the two were shown in different tissues and were not linked
      experimentally.
    evidence:
    - reference: PMID:29349289
      reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
        Christianson Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Neuronal development is impaired in CS, involving defects in neuronal arborization
        and synaptogenesis, likely underlying diminished brain growth postnatally.'
      explanation: States the arborisation and synaptogenesis defect and its proposed link to
        brain undergrowth, using the authors' own hedge.
- name: Impaired Neuronal Arborisation and Synaptogenesis
  biological_scale: CELLULAR
  description: >-
    The neurodevelopmental arm. Defective dendritic arborisation and synapse
    formation limit brain growth after birth, which is why the microcephaly is
    postnatal rather than congenital.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29349289
    reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
      Christianson Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Neuronal development is impaired in CS, involving defects in neuronal arborization
      and synaptogenesis, likely underlying diminished brain growth postnatally.'
    explanation: Names the cellular defect and its consequence for brain growth.
  downstream:
  - target: Postnatal Microcephaly
    causal_link_type: DIRECT
    description: Failure of postnatal brain growth produces a head circumference that falls away
      from the centiles after birth.
    evidence:
    - reference: PMID:29349289
      reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
        Christianson Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'We report trajectories of volume changes in the mutant that likely reflect both
        brain undergrowth as well as tissue loss.'
      explanation: Separates undergrowth from tissue loss as contributors to the volume deficit,
        which is the distinction this edge depends on.
  - target: Severe Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The cognitive phenotype is attributed to the same developmental defect, though
      no experiment connects the two directly.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Males with CS typically present with developmental delay, later meeting criteria
        for severe intellectual disability (ID).'
      explanation: Establishes the cognitive endpoint; the causal attribution to arborisation is
        inference, which is why the edge is graded as having unknown intermediates.
  - target: Absent Speech
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Non-verbal status is part of the same developmental outcome, and is among the
      most consistent features of the syndrome.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Males with CS typically present with developmental delay, later meeting criteria
        for severe intellectual disability (ID).'
      explanation: Places non-verbal status within the same developmental trajectory; no source
        here dissects speech from general cognitive outcome, hence the grading.
  - target: Autistic Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Autistic features and hyperactivity emerge from the same abnormal circuit
      development.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Behaviorally, autism spectrum disorder and hyperactivity are common, and may resemble
        the behaviors observed in Angelman syndrome.'
      explanation: Names the behavioural phenotype attributed to this arm.
  - target: Hyperkinetic Movements
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hyperkinesia belongs to the same developmental picture and, unlike the
      degenerative features, becomes less prominent with age.
    evidence:
    - reference: PMID:37987014
      reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
        Adolescents, and Adults.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'postnatal microcephaly, ataxia and high pain threshold were often not apparent prior
        to age 6, and hyperkinesis decreased after age 16'
      explanation: The decline after sixteen distinguishes this from the progressive degenerative
        features and is why it is placed on the developmental arm.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Epilepsy arises on the abnormally developed cortex, beginning before age three.
      The specific circuit basis is not established in these sources.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Seizures, typically beginning before age three years, can include infantile spasms
        and tonic, tonic-clonic, myoclonic, and atonic seizures.'
      explanation: Gives the early onset consistent with a developmental rather than degenerative
        origin, while the mechanism itself is unestablished.
  - target: Pain Insensitivity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: NHE6 is expressed in nociceptors, and its loss reduces cell-surface TRPV1,
      blunting responses to noxious thermal, mechanical and chemical stimuli. This is a separate
      route from the cognitive arm and reaches the sensory neuron directly.
    evidence:
    - reference: PMID:37987014
      reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
        Adolescents, and Adults.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'an additional core feature of high pain tolerance was added (present in 91%)'
      explanation: Establishes the human feature and its frequency.
    - reference: PMID:32569089
      reference_title: Loss of SLC9A6/NHE6 impairs nociception in a mouse model of Christianson syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Behaviourally, Nhe6 KO mice have decreased nocifensive responses to acute noxious
        thermal, mechanical, and chemical (ie, capsaicin) stimuli. The reduced capsaicin sensitivity
        in the KO mice correlates with a decreased expression of the transient receptor potential
        channel TRPV1 at the plasma membrane'
      explanation: Supplies the mechanism - reduced surface TRPV1 in nociceptors - that this edge
        was previously graded UNKNOWN for lack of.
  - target: Oropharyngeal Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hypotonia and bulbar dysfunction in infancy impair swallowing.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Hypotonia and oropharyngeal dysphagia in infancy may result in failure to thrive.'
      explanation: Names the dysphagia in the infantile period alongside the hypotonia it
        accompanies.
- name: Progressive Neurodegeneration with Purkinje Cell Loss
  biological_scale: TISSUE
  description: >-
    The degenerative arm, and what makes this disorder unusual. Purkinje cells are
    lost early and rapidly, with a more protracted cerebral course behind it. In
    the rat this proceeds to amyloid-beta and tau aggregation, matching the tau
    deposition reported in human post-mortem material. Cerebellar atrophy is
    documented in 30 to 60% of patients.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:34928329
    reference_title: Early lysosome defects precede neurodegeneration with amyloid-β and tau aggregation in
      NHE6-null rat brain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'NHE6-null rats demonstrated an early and rapid loss of Purkinje cells in the
      cerebellum, as well as a more protracted neurodegenerative course in the cerebrum.'
    explanation: Gives the two-speed course, cerebellar first and cerebral later.
  - reference: PMID:29349289
    reference_title: Mixed Neurodevelopmental and Neurodegenerative Pathology in Nhe6-Null Mouse Model of
      Christianson Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'We report PC loss in two distinct Nhe6-null mouse models.'
    explanation: Independent replication of Purkinje cell loss across two separate mouse models,
      which is why this node is not treated as a single-model finding.
  downstream:
  - target: Ataxia
    causal_link_type: DIRECT
    description: Purkinje cell loss produces the progressive truncal ataxia that dominates the
      motor phenotype.
    evidence:
    - reference: PMID:37987014
      reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
        Adolescents, and Adults.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'While neurologic exams were consistent with cerebellar dysfunction, importantly,
        a majority of individuals (>50% older than 10) also had corticospinal tract
        abnormalities.'
      explanation: Confirms cerebellar dysfunction on examination, and qualifies it by noting
        corticospinal involvement in the majority over age 10, so the motor picture is not purely
        cerebellar.
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    description: Purkinje cell loss is visible on imaging as cerebellar atrophy, reported in 30
      to 60% of patients.
    evidence:
    - reference: PMID:37987014
      reference_title: 'Christianson Syndrome across the Lifespan: An International Longitudinal Study in Children,
        Adolescents, and Adults.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: cerebellar degeneration in patients (atrophy in 30-60% of cases)
      explanation: Gives the imaging correlate and its frequency.
  - target: Developmental Regression
    causal_link_type: DIRECT
    description: Continuing tissue loss produces loss of previously acquired skills, including
      ambulation and independent feeding.
    evidence:
    - reference: PMID:29334451
      reference_title: Christianson Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Subsequently, regression (e.g., loss of ambulation and ability to feed
        independently) may occur.'
      explanation: Names the specific skills lost, which is what distinguishes regression from
        static disability here.

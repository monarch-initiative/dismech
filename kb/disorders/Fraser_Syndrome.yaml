    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Based on the present results we suggest an adaptation of diagnostic criteria for FS,
      including adding airway tract and urinary tract anomalies as major criteria.

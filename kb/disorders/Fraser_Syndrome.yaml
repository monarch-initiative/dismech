- name: Impaired Pulmonary Lobe Septation and Capillary Organization
  biological_scale: TISSUE
  description: >-
    In Fras1-null mouse embryos, pulmonary lobes fail to separate and terminal air-sac
    capillaries are disorganized. A corresponding human lung phenotype has not been
    systematically characterized.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: lung lobe development
    term:
      id: GO:0060462
      label: lung lobe development
    modifier: DECREASED
  evidence:
  - reference: PMID:15623520
    reference_title: "Basement membrane distortions impair lung lobation and capillary organization in the mouse model for fraser syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Embryos homozygous for a targeted mutation of Fras1 exhibited fused pulmonary lobes
      resulting from incomplete separation during development as well as a profound
      disarrangement of blood capillaries in the terminal air sacs.
    explanation: Mouse evidence for the lung lobation defect.
- name: Impaired Epithelial-Mesenchymal Interactions in Organogenesis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Review-level synthesis attributes the malformations of Fraser syndrome to disturbed
    epithelial-mesenchymal interactions during embryogenesis. Unlike the epidermal and renal
    steps, organ-specific mechanisms for the laryngeal, genital, anorectal, auricular, nasal
    and other malformations have not been demonstrated, so this node is not linked to
    individual phenotypes (see the knowledge-gap discussion).
  evidence:
  - reference: PMID:31982235
    reference_title: "Fraser syndrome: review of the literature illustrated by a historical adult case."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The syndrome is related to mutations in three different genes (FRAS1, FREM2, and GRIP1)
      resulting in failure of the apoptosis program and disruption of the
      epithelial-mesenchymal interactions during embryonic development.
    explanation: Review statement of the proposed general mechanism.
  - reference: PMID:22510445
    reference_title: "Mutations in GRIP1 cause Fraser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Both FRAS1 and FREM2 encode extracellular matrix proteins that are essential for the
      adhesion between epidermal basement membrane and the underlying dermal connective tissues
      during embryonic development.
    explanation: Background statement of the adhesion role underlying the developmental defects.

  - preferred_term: FRAS1
    term:
      id: hgnc:19185
      label: FRAS1
  publication: PMID:12766770
  description: >-
    Fras1-deficient embryos develop subepidermal hemorrhagic blisters, fused eyelids and digits,
    and unilateral or bilateral renal agenesis; on a C57BL6J background renal agenesis is
    consistent, whereas some mutants on mixed backgrounds survive with two kidneys.
  evidence:
  - reference: PMID:12766770
    reference_title: "Fras1 deficiency results in cryptophthalmos, renal agenesis and blebbed phenotype in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The defects observed in Fras1-/- mice phenocopy those of the existing bl (blebbed) mouse
      mutants, which have been considered a model for the human genetic disorder Fraser
      syndrome.
    explanation: Establishes the Fras1-null and bl mice as Fraser syndrome models.
  modeled_mechanisms:
  - target: Epidermal-Dermal Detachment and Embryonic Blistering
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Embryonic blistering is directly observed in mouse; the corresponding human fetal
      blistering stage is inferred rather than documented in the cited human reports.
    evidence:
    - reference: PMID:12766770
      reference_title: "Fras1 deficiency results in cryptophthalmos, renal agenesis and blebbed phenotype in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Loss of Fras1 function results in the formation of subepidermal hemorrhagic blisters as
        well as unilateral or bilateral renal agenesis during mouse embryogenesis.
      explanation: Direct recapitulation of the blistering step.
  - target: Defective Ureteric Bud Invasion of Metanephric Mesenchyme

pathophysiology:
- name: Biallelic FRAS1 or FREM2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic, predominantly truncating germline variants in FRAS1 or FREM2 abolish one of the
    two large basement-membrane extracellular matrix proteins of the FRAS/FREM complex. The
    blebbed mouse, which carries a premature termination codon in Fras1, lacks Fras1 protein.
  genes:
  - preferred_term: FRAS1
    term:
      id: hgnc:19185
      label: FRAS1
  - preferred_term: FREM2
    term:
      id: hgnc:25396
      label: FREM2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous frameshift, nonsense and splice variants predominate;
      missense FREM2 alleles also occur.
  evidence:
  - reference: PMID:12766769
    reference_title: "Fraser syndrome and mouse blebbed phenotype caused by mutations in FRAS1/Fras1 encoding a putative extracellular matrix protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Mutation analysis identified five frameshift mutations in FRAS1"
    explanation: Truncating FRAS1 alleles in Fraser syndrome families indicate loss of function.
  - reference: PMID:12766770
    reference_title: "Fras1 deficiency results in cryptophthalmos, renal agenesis and blebbed phenotype in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "We show that bl/bl homozygous embryos are devoid of Fras1 protein"
    explanation: The blebbed mouse lesion abolishes Fras1 protein, a null model of the human lesion.
  - reference: PMID:24700879
    reference_title: "Mild recessive mutations in six Fraser syndrome-related genes cause isolated congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results also indicate that biallelic missense mutations in the Fraser/MOTA/BNAR
      spectrum genes cause isolated CAKUT, whereas truncating mutations are found in the
      multiorgan form of Fraser syndrome.
    explanation: >-
      Supports full loss of function (truncating alleles) as the lesion underlying the
      multiorgan syndrome, with missense alleles giving a kidney-restricted phenotype.
  downstream:
  - target: Collapse of the FRAS1-FREM1-FREM2 Basement Membrane Complex
    causal_link_type: DIRECT
    description: >-
      Loss of any one complex member removes the reciprocal stabilization of the others at the
      basement membrane.
    evidence:
    - reference: PMID:16880404
      reference_title: "Breakdown of the reciprocal stabilization of QBRICK/Frem1, Fras1, and Frem2 at the basement membrane provokes Fraser syndrome-like defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        In Frem2 mutant mice, not only Frem2 but Fras1 and QBRICK/Frem1 were depleted from the
        basement membrane zone.
      explanation: Frem2 loss depletes all three complex members from the basement membrane in the mouse.
- name: Biallelic GRIP1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic GRIP1 splice, frameshift or nonsense variants remove the multi-PDZ scaffold
    GRIP1. The first two PDZ domains of GRIP1 bind the FRAS1 C-terminal tail as a tandem
    supramodule.

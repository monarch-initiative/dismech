name: Fraser Syndrome
creation_date: "2026-09-25T10:34:21Z"
description: >-
  Fraser syndrome (cryptophthalmos-syndactyly syndrome) is a rare autosomal recessive multiple
  congenital malformation disorder defined by cryptophthalmos, cutaneous syndactyly, and
  malformations of the respiratory (laryngeal) and urogenital tracts, frequently with renal
  agenesis, ear and nasal dysplasia, and anorectal anomalies. It is caused by biallelic
  loss-of-function variants in FRAS1 (Fraser syndrome 1), FREM2 (Fraser syndrome 2) or GRIP1
  (Fraser syndrome 3). FRAS1 and FREM2 are large extracellular matrix proteins that, together
  with FREM1, form a mutually stabilizing ternary complex beneath the lamina densa of embryonic
  epithelial basement membranes; GRIP1 is a cytoplasmic PDZ scaffold required to deliver FRAS1
  to the basal cell surface. In mouse models, loss of the complex detaches embryonic epidermis
  from dermis, producing subepidermal blisters (the "bleb" phenotype) whose sequelae include
  fused eyelids and digits, and disrupts ureteric bud-metanephric mesenchyme interactions,
  causing renal agenesis. Severity ranges from termination, stillbirth or early death (bilateral
  renal agenesis, laryngeal atresia with congenital high airway obstruction) to survival into
  adult life. Diagnosis rests on major and minor clinical criteria, revised by van Haelst and
  colleagues in 2007, supported by molecular testing, which does not identify a variant in
  every clinically diagnosed family. Management is supportive and surgical (airway and eyelid
  reconstruction).
category: Mendelian

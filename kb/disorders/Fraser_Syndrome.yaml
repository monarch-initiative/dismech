prevalence:
- population: Europe (EUROCAT registries, 1990-2008)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.2
  notes: >-
    26 cases among 12,886,464 monitored births (minimal estimate 0.20 per 100,000, 1 in
    495,633 births), counting terminations and stillbirths, so this is a total (not live-birth-only) birth
    prevalence; prevalence was higher in western Europe (1 in 230,695) than elsewhere
    (1 in 1,091,175).
  evidence:
  - reference: PMID:23532946
    reference_title: "Fraser syndrome: epidemiological study in a European population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Between January 1990 and December 2008, we identified 26 cases of Fraser syndrome in the
      monitored population of 12,886,464 births (minimal estimated prevalence of 0.20 per
      100,000 or 1:495,633 births).
    explanation: Population-based registry estimate of birth prevalence.
  - reference: PMID:23532946
    reference_title: "Fraser syndrome: epidemiological study in a European population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the European population, a high proportion (82%) of pregnancies is terminated, thus
      reducing the live birth prevalence to a third of the total prevalence rate.
    explanation: Distinguishes live-birth prevalence from total prevalence.
treatments:
- name: Surgical Correction of Cryptophthalmos
  description: >-
    Staged oculoplastic surgery - dissection of corneal adhesions, mucous membrane grafting,
    eyelid switch flaps and fornix reconstruction - aims to protect the cornea and optimize
    limited visual potential, mainly in abortive cryptophthalmos. Postoperative acuity is poor
    (perception of light to 20/200) in the largest reported series.
  treatment_term:
    preferred_term: eyelid reconstruction
    term:
      id: NCIT:C157852
      label: Eyelid Reconstruction
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Cryptophthalmos
    term:
      id: HP:0001126
      label: Cryptophthalmos
  evidence:
  - reference: PMID:19643480
    reference_title: "A surgical strategy for the correction of Fraser syndrome cryptophthalmos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Surgical steps included dissection of corneal adhesions from keratinized cornea, mucous
      membrane graft, Mustarde eyelid switch flap with subsequent division, and further lower
      lid augmentation as required (n = 10).
    explanation: Describes the surgical approach in a 7-patient, 13-eye retrospective series.
  - reference: PMID:19643480
    reference_title: "A surgical strategy for the correction of Fraser syndrome cryptophthalmos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Postoperative acuities ranged from perception of light to 20/200. Good outcomes in terms
      of corneal health were achieved in 6 of the 10 eyes operated on for incomplete
      cryptophthalmos.
    explanation: Outcomes are limited; corneal health was preserved in 6 of 10 operated eyes.
- name: Airway Management and Tracheostomy
  description: >-
    Glottic stenosis and laryngeal webs make intubation difficult or impossible; anesthesia
    requires planning for a difficult airway, and tracheostomy may be needed emergently.
  treatment_term:
    preferred_term: tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Laryngeal stenosis
    term:
      id: HP:0001602
      label: Laryngeal stenosis
  evidence:
  - reference: PMID:25230075
    reference_title: "Delivery of anesthesia and complications for children with Fraser syndrome: a review of 125 anesthetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      One child was a difficult intubation requiring an ID 2.5 mm oral endotracheal tube (ETT),
      and one child was an impossible intubation that required an emergency tracheostomy to
      secure the airway.
    explanation: Airway complications and emergency tracheostomy in a 125-anesthetic series.
  - reference: PMID:25230075
    reference_title: "Delivery of anesthesia and complications for children with Fraser syndrome: a review of 125 anesthetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There were a total of ten anesthetic complications in the review, all related to management of the airway."
    explanation: All anesthetic complications were airway-related.
- name: Fetoscopic Tracheal Decompression for CHAOS
  description: >-
    Experimental fetal intervention: percutaneous fetoscopic and ultrasound-guided tracheal

mappings:
  ncit_mappings:
  - term:
      id: NCIT:C118436
      label: Fraser Syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: NCIT:C118436 is an xref of MONDO:0009046 and names the same syndrome.
notes: >-
  Entry lumps the three genetic forms (FRAS1, FREM2, GRIP1) as subtypes of one disease because
  they share one mechanism, the FRAS/FREM basement-membrane complex, and are clinically
  indistinguishable. FREM1-related disorders (MOTA and BNAR syndromes) are allelic members of the
  same complex but are distinct, milder diseases and are handled as differential diagnoses. Not
  to be confused with "Melnick-Fraser syndrome", an older name for branchio-oto-renal syndrome.
  Only the eyelid, digit and renal malformations (and fetal hydrops secondary to laryngeal
  atresia) carry sourced mechanism edges; no organ-specific mechanism has been demonstrated
  for the other malformations, which is recorded as a knowledge gap. No GeneReviews chapter is dedicated to Fraser syndrome in the committed Bookshelf index;
  the FREM1 chapter (PMID:20301721) is cited only for the MOTA differential.
discussions:
- discussion_id: gap_fraser_extracutaneous_malformation_mechanisms
  prompt: >-
    How does loss of the FRAS1-FREM1-FREM2 complex produce the laryngeal, genital, anorectal,
    auricular, nasal and abdominal-wall malformations of Fraser syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Epithelial-Mesenchymal Interactions in Organogenesis
  - phenotypes#Laryngeal Atresia
  - phenotypes#Laryngeal Stenosis
  - phenotypes#Ambiguous Genitalia
  - phenotypes#Anal Atresia
  - phenotypes#Ear Malformation
  - phenotypes#Bifid Nasal Tip
  - phenotypes#Omphalocele
  rationale: >-
    Mouse bleb models establish the chain from complex loss to embryonic blistering (fused
    eyelids and digits) and to failed ureteric bud invasion (renal agenesis). For the other
    recurrent malformations the cited literature offers only a general appeal to disrupted
    epithelial-mesenchymal interactions; no organ-specific step has been shown, so these
    phenotypes carry no mechanism edge in this entry.
  evidence:
  - reference: PMID:31982235
    reference_title: "Fraser syndrome: review of the literature illustrated by a historical adult case."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In vivo and in vitro research models are available to better understand the underlying
      aetiology.
    explanation: The review frames the aetiology of the malformations as still to be understood.

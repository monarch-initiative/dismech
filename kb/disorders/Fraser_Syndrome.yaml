  description: >-
    All three genetic forms are autosomal recessive; affected individuals are homozygous or
    compound heterozygous, and parental consanguinity is common in reported series.
  evidence:
  - reference: PMID:22510445
    reference_title: "Mutations in GRIP1 cause Fraser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In three unrelated families with parental consanguinity, GRIP1 mutations were found to
      segregate with the disease in an autosomal recessive manner
    explanation: >-
      Segregation of biallelic GRIP1 variants in consanguineous families demonstrates autosomal
      recessive inheritance for Fraser syndrome 3.
  - reference: PMID:23532946
    reference_title: "Fraser syndrome: epidemiological study in a European population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Consanguinity was present in 7/26 (27%) families."
    explanation: >-
      Population-based EUROCAT registry data show a high rate of parental consanguinity,
      consistent with recessive inheritance.

  reports_on:
  - target: Abnormal coronary artery-to-chamber or vessel shunt
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    description: >-
      Flow across the fistula continues through both systole and diastole
      because the pressure gradient never reverses, so the continuous murmur
      heard at the chest wall is an auscultatory readout of the shunt itself
      rather than a consequence of it.
treatments:
- name: Transcatheter fistula closure
  description: >-
    Percutaneous transcatheter closure is used increasingly for suitable CAF
    anatomy, while balancing risks such as myocardial infarction, device
    embolization, and recanalization.
  treatment_term:
    preferred_term: Embolization Therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  evidence:
  - reference: PMID:34238550
    reference_title: "Coronary Artery Fistulas: Indications, Techniques, Outcomes, and Complications of Transcatheter Fistula Closure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the advancement of transcatheter equipment and techniques, CAFs have been increasingly closed using a percutaneous approach.
    explanation: This supports transcatheter closure as a contemporary CAF intervention.
  target_mechanisms:
  - target: Abnormal coronary artery-to-chamber or vessel shunt
    treatment_effect: INHIBITS
    description: >-
      Coils or an occluder deployed in the fistulous track abolish the abnormal
      communication, ending the runoff and returning coronary flow to the
      myocardial capillary bed.
    evidence:
    - reference: PMID:34238550
      reference_title: "Coronary Artery Fistulas: Indications, Techniques, Outcomes, and Complications of Transcatheter Fistula Closure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With the advancement of transcatheter equipment and techniques, CAFs have been increasingly closed using a percutaneous approach.
      explanation: This supports transcatheter closure as a contemporary CAF intervention.
- name: Surgical correction for at-risk fistulas
  description: >-
    Symptomatic patients and selected asymptomatic patients at risk for future
    complications may undergo closure by surgical correction when anatomy is
    better suited to an operative approach.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:16125261
    reference_title: "Coronary artery fistulas: clinical and therapeutic considerations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is advocated for symptomatic patients and for those asymptomatic patients who are at risk for future complications.
    explanation: This supports intervention in symptomatic or high-risk asymptomatic patients.
  target_mechanisms:
  - target: Abnormal coronary artery-to-chamber or vessel shunt
    treatment_effect: INHIBITS
    description: >-
      Surgical ligation or patch closure of the fistulous connection removes the
      abnormal shunt directly, and is chosen over the percutaneous route when the
      anatomy is unsuitable for a catheter-delivered device.
    evidence:
    - reference: PMID:16125261
      reference_title: "Coronary artery fistulas: clinical and therapeutic considerations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment is advocated for symptomatic patients and for those asymptomatic patients who are at risk for future complications.
      explanation: This supports intervention in symptomatic or high-risk asymptomatic patients.

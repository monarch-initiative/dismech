    explanation: This directly supports myocardial ischemia as a clinical sequela of untreated medium or large CAFs.
  sequelae:
  - target: Angina
    causal_link_type: DIRECT
    description: >-
      Steal-mediated hypoperfusion of the distal myocardium is felt as ischemic
      chest pain, typically on exertion when demand rises.
  - target: Myocardial infarction
    causal_link_type: DIRECT
    description: >-
      When the perfusion deficit is severe or prolonged, the ischemic myocardium
      infarcts, which is why infarction appears among the presentations of this
      disease.
- category: Cardiovascular
  name: Congestive heart failure
  description: Significant shunting can produce volume overload and heart-failure symptoms.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:16125261
    reference_title: "Coronary artery fistulas: clinical and therapeutic considerations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients with coronary fistulas may present with dyspnea, congestive heart failure, angina, endocarditis, arrhythmias, or myocardial infarction.
    explanation: This review lists congestive heart failure among CAF presentations.
  sequelae:

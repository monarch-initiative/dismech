discussions:
- discussion_id: ctnnb1_dopaminergic_deficit
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the reduced midbrain dopaminergic neurogenesis seen in Ctnnb1 knockout
    mouse models translate into a dopaminergic deficit in human CTNNB1-NDD that
    is sufficient to make levodopa a rational therapy?
  attaches_to:
  - pathophysiology#Progressive Corticospinal and Extrapyramidal Motor Dysfunction
  rationale: >-
    Animal models show severe reduction in dopaminergic neurogenesis when Ctnnb1
    is lost, and this is the stated rationale for an ongoing levodopa pilot
    trial. In humans, however, the only supporting data are anecdotal: in the
    single systematically assessed cohort levodopa was helpful in only 1 of 4
    treated patients, whereas botulinum toxin helped 5 of 6. No human imaging or
    CSF evidence of presynaptic dopaminergic deficiency in CTNNB1-NDD has been
    published. The mismatch is mechanistically meaningful because it determines
    whether the movement disorder is primarily an extrapyramidal
    neurotransmitter-deficiency state or a developmental corticospinal/circuit
    lesion.
  proposed_experiments:
  - experiment_id: ctnnb1_dopaminergic_imaging
    name: Presynaptic dopaminergic imaging in CTNNB1-NDD
    description: >-
      DaTscan or FDOPA PET in individuals with molecularly confirmed CTNNB1-NDD
      and dystonia, compared with age-matched reference data, to test whether a
      presynaptic nigrostriatal dopaminergic deficit is present in humans.
    decision_criterion: >-
      Reduced striatal tracer binding relative to reference values would support
      a human dopaminergic deficit and strengthen the levodopa rationale; normal
      binding would refute it.
  - experiment_id: ctnnb1_csf_neurotransmitters
    name: CSF neurotransmitter metabolite profiling in CTNNB1-NDD
    description: >-
      Measurement of CSF homovanillic acid and 5-hydroxyindoleacetic acid in a
      CTNNB1-NDD cohort to detect a biochemical dopaminergic deficiency.
    decision_criterion: >-
      Low CSF homovanillic acid would provide biochemical support for the
      dopaminergic-deficit model.
  - experiment_id: ctnnb1_levodopa_pilot
    name: Completion of the NCT07614126 levodopa pilot
    description: >-
      Completion and blinded analysis of the open-label levodopa/carbidopa pilot
      in children with CTNNB1-related dystonia, with GMFM-88 as the primary
      motor endpoint.
    decision_criterion: >-
      A clinically meaningful GMFM-88 improvement would support the dopaminergic
      hypothesis; absence of response would argue for a primarily developmental
      circuit lesion.
  evidence:
  - reference: PMID:39067319
    reference_title: "Movement disorder phenotype in CTNNB1-syndrome: A complex but recognizable phenomenology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment efficacy was variable: botulinum toxin was (at least partially) effective in 5/6, levodopa in 1 of 4 treated patients."
    explanation: Human treatment-response data are weak for levodopa relative to botulinum toxin, tempering the model-derived dopaminergic hypothesis.

discussions:
- discussion_id: ctnnb1_dopaminergic_deficit
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does the reduced midbrain dopaminergic neurogenesis seen in Ctnnb1 knockout mouse models translate into a dopaminergic deficit in human CTNNB1-NDD that is sufficient to make levodopa a rational therapy?
  attaches_to:
  - pathophysiology#Progressive Corticospinal and Extrapyramidal Motor Dysfunction
  rationale: Conditional Ctnnb1 mouse models motivate a dopaminergic hypothesis, but a specific presynaptic deficit has not been established by the cited human studies. In a selected movement-disorder series levodopa helped 1/4 treated patients and botulinum toxin 5/6. These uncontrolled responses cannot determine which neuronal pathway causes the motor phenotype.
  proposed_experiments:
  - experiment_id: ctnnb1_dopaminergic_imaging
    name: Presynaptic dopaminergic imaging in CTNNB1-NDD
    description: DaTscan or FDOPA PET in individuals with molecularly confirmed CTNNB1-NDD and dystonia, compared with age-matched reference data, to test whether a presynaptic nigrostriatal dopaminergic deficit is present in humans.
    decision_criterion: Reduced tracer measures would support a presynaptic abnormality. Normal measures would weaken that specific hypothesis without excluding altered dopamine signaling or a symptomatic levodopa benefit.
  - experiment_id: ctnnb1_csf_neurotransmitters
    name: CSF neurotransmitter metabolite profiling in CTNNB1-NDD
    description: Measurement of CSF homovanillic acid and 5-hydroxyindoleacetic acid in a CTNNB1-NDD cohort to detect a biochemical dopaminergic deficiency.
    decision_criterion: Low CSF homovanillic acid would provide biochemical support for the dopaminergic-deficit model.
  - experiment_id: ctnnb1_levodopa_pilot
    name: Completion of the NCT07614126 levodopa pilot
    description: Completion and prespecified analysis of the open-label levodopa/carbidopa pilot, with GMFM-88 as the primary motor endpoint. The registered study is unblinded.
    decision_criterion: Improvement would support symptomatic benefit for further controlled testing; either response or nonresponse is insufficient by itself to establish or refute a specific dopaminergic mechanism.
  evidence:
  - reference: PMID:39067319
    reference_title: 'Movement disorder phenotype in CTNNB1-syndrome: A complex but recognizable phenomenology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Treatment efficacy was variable: botulinum toxin was (at least partially) effective in 5/6, levodopa in 1 of 4 treated patients.'
    explanation: Human treatment-response data are weak for levodopa relative to botulinum toxin, tempering the model-derived dopaminergic hypothesis.

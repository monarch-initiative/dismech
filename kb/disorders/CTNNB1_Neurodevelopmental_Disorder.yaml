diagnosis:
- name: Molecular Genetic Testing for CTNNB1
  description: Diagnosis requires a heterozygous pathogenic or likely pathogenic CTNNB1 variant in an individual with compatible findings. Exome/genome or panel sequencing and deletion/duplication analysis address sequence variants and copy-number changes; a variant of uncertain significance does not establish the diagnosis. A clinical cerebral palsy or autism diagnosis can coexist and can be an entry point for molecular testing.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:35593792
    reference_title: CTNNB1 Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of CTNNB1-NDD is established in a proband with suggestive findings and a heterozygous pathogenic variant in CTNNB1 identified by molecular genetic testing
    explanation: GeneReviews states the molecular diagnostic criterion.
  - reference: PMID:36083290
    reference_title: Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NEDSDV is a clinically homogeneous disorder irrespective of initial clinical diagnoses, including CP, or entry points for genetic testing.
    explanation: Supports testing individuals whose entry diagnosis was cerebral palsy, since the molecular entity is the same.
- name: Ultra-Widefield Fluorescein Angiography
  description: Retinal vascular disease in CTNNB1 syndrome is frequently occult on routine office ophthalmoscopy. Ultra-widefield fluorescein angiography, if necessary under anaesthesia, detects treatment-requiring FEVR in children with previously normal examinations and should be considered at diagnosis.
  presence: Abnormal in a substantial minority with normal office examination
  diagnosis_term:
    preferred_term: fluorescein angiography
    term:
      id: NCIT:C190541
      label: Fluorescein Angiography
  evidence:
  - reference: PMID:39145965
    reference_title: Vitreoretinopathy in Asymptomatic Children With CTNNB1 Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings support consideration of ultra-widefield fluorescein angiography among individuals with CTNNB1 syndrome when feasible, including the use of sedation if such an assessment is not possible in the office setting.
    explanation: Directly recommends ultra-widefield fluorescein angiography, including under sedation, in CTNNB1 syndrome.
  - reference: PMID:39145965
    reference_title: Vitreoretinopathy in Asymptomatic Children With CTNNB1 Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, ophthalmoscopy may not be sufficient to detect vision-threatening vitreoretinopathy in all patients.
    explanation: States the diagnostic limitation of ophthalmoscopy that motivates angiography.
differential_diagnoses:
- name: Cerebral Palsy
  description: CTNNB1-NDD can meet clinical criteria for cerebral palsy. Molecular testing identifies an underlying genetic cause rather than necessarily invalidating the clinical motor diagnosis. Progressive or additional findings warrant individualized reassessment.
- name: Familial Exudative Vitreoretinopathy (NDP, FZD4, LRP5, TSPAN12)
  description: The ocular phenotype of CTNNB1-NDD is indistinguishable from classic FEVR caused by the Norrin receptor-complex genes; the accompanying neurodevelopmental and motor features distinguish CTNNB1-NDD.
- name: Autism Spectrum Disorder
  description: Autism can coexist with CTNNB1-NDD. Relative visuospatial and adaptive weaknesses were described in small comparison cohorts but are not a validated diagnostic discriminator; molecular testing establishes the genetic diagnosis.
- name: Hereditary Spastic Paraplegia
  description: Progressive lower-limb spasticity overlaps, but CTNNB1-NDD adds intellectual disability, microcephaly, facial gestalt and retinal vascular disease.
- name: Hyperekplexia (GLRA1, GLRB, SLC6A5)
  description: The exaggerated startle of CTNNB1-NDD corresponds to atypical hyperekplexia and can prompt consideration of the classic glycinergic hyperekplexia genes.
treatments:
- name: Multidisciplinary Supportive Care
  description: No established curative or disease-modifying treatment is supported by the cited clinical literature. Multidisciplinary care addresses motor, communication, feeding, visual, behavioral and family needs. Gene addition is in early clinical testing; GSK3 inhibition has preclinical mouse evidence. Neither constitutes proven human disease modification.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35593792
    reference_title: CTNNB1 Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There is no curative treatment. Supportive care by a multidisciplinary team often includes a neurologist, speech-language pathologist, physiatrist, occupational therapist, physical therapist, feeding team, pediatric ophthalmologist, audiologist, and developmental pediatrician.
    explanation: GeneReviews defines the standard of care as multidisciplinary supportive management in the absence of curative treatment.
  - reference: PMID:39833474
    reference_title: CTNNB1 syndrome mouse models.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: There is currently no effective treatment option available for patients with CTNNB1 syndrome, with support largely focused on the management of symptoms and physiotherapy
    explanation: Confirms the absence of disease-modifying therapy and the symptom-management/physiotherapy focus of current care.
- name: Physical Therapy and Motor Rehabilitation
  description: Physical therapy, stretching, positioning and individualized mobility aids address hypotonia, weakness, spasticity and gait limitations. Occupational therapy addresses fine motor and adaptive tasks. These are expert supportive-care recommendations rather than CTNNB1-specific controlled efficacy results.

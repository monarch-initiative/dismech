    There is no curative or disease-modifying therapy. Management is supportive
    and multidisciplinary, typically involving neurology, speech-language
    pathology, physiatry, occupational therapy, physical therapy, a feeding team,
    paediatric ophthalmology, audiology and developmental paediatrics, with
    surveillance for emerging neurological, developmental, behavioural and
    ophthalmological problems.

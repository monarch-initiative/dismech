- name: AAV9-Mediated CTNNB1 Gene Replacement (Investigational)
  description: >-
    Urbagen is a single-stranded AAV9 vector carrying human CTNNB1, delivered
    once by bilateral intracerebroventricular infusion with prophylactic
    methylprednisolone and sirolimus, now in a first-in-human phase I/II trial
    (NCT07270549). It is the first candidate disease-modifying therapy and
    directly addresses the beta-catenin dosage deficit. No human safety or
    efficacy results are available. Because beta-catenin is dosage-sensitive and
    its stabilisation is oncogenic in the somatic setting, expression level,
    tissue targeting, and long-term surveillance are central safety questions.

    snippet: Moreover, LiCl treatment partially rescued the defects in CTNNB1-KD HRECs and EC-specific Ctnnb1 heterozygous knockout mice.
    explanation: Demonstrates partial pharmacological rescue of the retinal vascular phenotype by beta-catenin stabilisation in the endothelial-specific knockout model.
- species: Mouse
  genotype: Germline heterozygous Ctnnb1 exon 2-6 deletion generated using E2a-Cre, with Cre bred out
  description: This model has approximately half-normal beta-catenin abundance, impaired associative learning, grip strength and rotarod performance, altered N-cadherin association, lower DKK1/EN2 and ATPase alpha2/alpha3 protein, and altered dentate-granule-cell excitability. General locomotion was unchanged. Short BRD0320 treatment improved several outcomes after symptom onset; chronic safety and human translation were not tested.

    evidence_source: MODEL_ORGANISM
    snippet: In parallel, characterization of a chemically mutagenized mouse line that displays features similar to those of human patients with β-catenin mutations enabled us to investigate the consequences of β-catenin dysfunction through development and into adulthood.
    explanation: The original paper establishes phenotypic overlap, with distinct molecular and anatomical limitations documented in its full text.
- species: Mouse
  genotype: Endothelial-cell-specific (Cre-mediated) heterozygous Ctnnb1 knockout
  genes:

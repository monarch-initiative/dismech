    explanation: The germline heterozygous mouse supplies in vivo evidence of reduced Wnt target proteins. LEF1 abundance was unchanged.
- name: Impaired Cadherin-Catenin Adherens Junction Adhesion
  biological_scale: MOLECULAR
  description: Beta-catenin participates in cadherin-associated adhesion complexes. The batface Thr653Lys allele reduces cadherin binding despite normal beta-catenin abundance and enhanced Wnt activity; it is not a simple dosage-loss model. A separate germline heterozygous deletion model also shows reduced beta-catenin association with N-cadherin. These results support an adhesion contribution while leaving its relative importance in individual human alleles unresolved.

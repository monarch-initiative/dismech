  evidence:
  - reference: PMID:25326669
    reference_title: 'De novo mutations in beta-catenin (CTNNB1) appear to be a frequent cause of intellectual disability: expanding the mutational and clinical spectrum.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report on 16 additional individuals from 15 families in whom we newly identified de novo loss-of-function CTNNB1 mutations (six nonsense, five frameshift, one missense, two splice mutation, and one whole gene deletion).
    explanation: Documents the loss-of-function variant spectrum (nonsense, frameshift, splice, missense and whole-gene deletion) underlying the haploinsufficiency mechanism.
  - reference: PMID:24668549
    reference_title: A new intellectual disability syndrome caused by CTNNB1 haploinsufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Array CGH karyotyping showed a 333 kb de novo microdeletion on 3p22 covering the entire genomic sequence of a single gene, CTNNB1, which codes for β-catenin.
    explanation: The deletion encompasses the entire CTNNB1 gene and supports dosage sensitivity. The abstract describes a single complete gene; this does not exclude partial neighboring-gene involvement.
  - reference: PMID:40684264
    reference_title: Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified 88 different variants of the CTNNB1 gene, 87 of which were predicted to lead to loss of CTNNB1 function
    explanation: The 2025 cohort reports 88 distinct variants and predicts loss of function for 87. This prediction does not establish an identical molecular mechanism for every allele.
  - reference: PMID:24614104
    reference_title: Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This was observed in 2 of the 4 individuals using allele-specific cDNA amplification of EBV-treated patient lympho- cytes in the presence or absence of cycloheximide
    explanation: Nonsense-mediated decay was tested in patient-derived lymphocytes, not in the batface mouse. The finding supports haploinsufficiency for the tested human alleles.
- name: Variant-Specific Dominant-Negative Wnt Inhibition
  biological_scale: MOLECULAR
  description: 'Selected variants inhibit Wnt reporter activity when coexpressed with wild-type CTNNB1. HEK293T experiments identified Leu388Pro and Leu424Arg missense alleles; SK-N-MC experiments identified four truncating protein variants in eleven participants: Tyr333*, Gln193*, Ala317Valfs8* and Ser352fs*. The 2025 abstract refers to eleven variants, whereas the body distinguishes four protein variants. Overexpressed cDNA does not demonstrate escape from endogenous nonsense-mediated decay. These assays do not define a clinically validated subtype.'
  downstream:
  - target: Canonical Wnt/Beta-Catenin Transcriptional Deficit
    causal_link_type: DIRECT
    description: Wild-type cotransfection assays demonstrate reduced reporter output for this subset.
  evidence:
  - reference: PMID:36083290
    reference_title: Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Two CTNNB1 missense variants were dominant negative regulators of WNT signaling, highlighting the utility of the TOPFlash assay to functionally assess variants.
    explanation: TOPFlash reporter assays demonstrate reduced/dominant-negative WNT signalling output for disease-associated CTNNB1 missense variants.
  - reference: PMID:40684264
    reference_title: Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, four variants (p.Y333∗, p.Q193∗, p.A317Vfs8∗, and p.S352fs∗) showed reduced levels of TOPFlash-luciferase activity suggesting a dominant negative mechanism
    explanation: The full-text cotransfection experiment identifies four truncating variants, rather than eleven distinct dominant-negative protein variants.
- name: Canonical Wnt/Beta-Catenin Transcriptional Deficit
  biological_scale: MOLECULAR
  description: 'Reduced beta-catenin-mediated transcription is demonstrated by Wnt-responsive reporter assays for many patient variants and by lower DKK1 and EN2 protein levels in a germline heterozygous mouse. It is not universal across every variant or assay: Gly575Arg had normal, reduced or increased reporter activity in three experimental contexts. Reporter activity alone cannot classify an allele or predict clinical severity.'

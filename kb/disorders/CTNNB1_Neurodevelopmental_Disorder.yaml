name: CTNNB1 Neurodevelopmental Disorder
creation_date: "2026-07-31T00:00:00Z"
description: >-
  CTNNB1 neurodevelopmental disorder (CTNNB1-NDD; CTNNB1 syndrome; also catalogued
  as severe intellectual disability-progressive spastic diplegia syndrome,
  neurodevelopmental disorder with spastic diplegia and visual defects [NEDSDV],
  and autosomal dominant intellectual disability 19 [MRD19]) is a rare autosomal
  dominant neurodevelopmental disorder caused by heterozygous, almost always de
  novo, loss-of-function variants in CTNNB1 at 3p22.1. CTNNB1 encodes beta-catenin,
  a dual-function protein that is both the transcriptional effector of the
  canonical Wnt signalling pathway and a structural component of the
  cadherin-catenin adherens junction complex. Affected individuals show
  mild-to-profound cognitive impairment with markedly limited speech, truncal
  hypotonia with distal (predominantly lower-limb) spasticity that is progressive,
  dystonia and an exaggerated startle response, microcephaly, subtle craniofacial
  dysmorphism (broad nasal tip, small alae nasi, long/flat philtrum, thin upper
  lip vermilion), and a distinctive ophthalmological phenotype of exudative
  vitreoretinopathy indistinguishable from familial exudative vitreoretinopathy
  (FEVR) together with strabismus and refractive errors. Because the motor
  phenotype is non-progressive-appearing in early childhood, CTNNB1-NDD is the
  most frequent recurrent monogenic cause of a cerebral palsy diagnosis. This
  entry covers the germline neurodevelopmental disorder; it is explicitly NOT the
  somatic CTNNB1 gain-of-function/Wnt-activating oncogenesis seen in
  hepatoblastoma, adamantinomatous craniopharyngioma and other tumours, which is
  a mechanistically opposite (stabilising) lesion.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: >-
  Scope and disambiguation. CTNNB1 is heavily represented in the cancer literature,
  where SOMATIC exon-3 missense variants stabilise beta-catenin and drive
  constitutive Wnt/TCF target-gene transcription (hepatoblastoma, adamantinomatous
  craniopharyngioma, endometrioid carcinomas). CTNNB1-NDD is the mechanistic
  mirror image: GERMLINE de novo loss-of-function variants that reduce beta-catenin
  dosage/activity. No cancer predisposition is part of CTNNB1-NDD, and the
  oncogenic literature was deliberately excluded from this curation.
  Module conformance. No mechanism module in kb/modules/ currently captures a
  canonical Wnt/beta-catenin developmental-signalling-loss chain, and the existing
  neurodevelopmental modules
  (microtubule_dependent_neuronal_migration_failure,
  reelin_terminal_translocation_lamination_failure,
  neural_progenitor_centrosome_spindle_dysfunction,
  interneuron_specification_tangential_migration_failure) each specify a node chain
  (microtubule motor/lamination/centrosome/interneuron-fate machinery) that
  CTNNB1-NDD evidence does not support. No `conforms_to` is therefore declared.
  A future `wnt_beta_catenin_developmental_signalling` module would be the natural
  home for the shared node chain with the FEVR/Norrin genes (NDP, FZD4, LRP5,
  TSPAN12) and with other Wnt-pathway neurodevelopmental disorders.
  Term choice. MONDO:0014035 was chosen over its parent MONDO:0100571
  ("CTNNB1-related neurodevelopmental disorder and/or vitreoretinopathy") because
  the issue and the clinical literature target the neurodevelopmental entity
  (OMIM 615075 / NEDSDV / MRD19), which carries the FEVR arm as one of its own
  features. The parent term additionally subsumes isolated CTNNB1-FEVR without
  neurodevelopmental involvement, which is out of scope here.
  Known gap. Sleep disturbance is reported at appreciable frequency in the
  CTNNB1 community and is a Dragonfly-study outcome, but no quotable
  frequency statement was found in an abstract available to this curation, so
  it is deliberately omitted rather than asserted without evidence.

      label: adherens junction
  downstream:
  - target: Impaired Dendritic Arborization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced adhesion and abnormal dendritic maturation coexist in batface neurons; a contribution is supported, but exclusive mediation is not established.
  evidence:
  - reference: PMID:24614104
    reference_title: Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The mouse mutant, designated batface (Bfc), carries a Thr653Lys substitution in the C-terminal armadillo repeat of β-catenin and displayed a reduced affinity for membrane-associated cadherins.
    explanation: Demonstrates in vivo that a disease-modelling beta-catenin substitution reduces binding to membrane cadherins, the adhesion arm of the mechanism.
  - reference: DOI:10.1038/s44321-024-00110-5
    reference_title: Inhibition of GSK3α,β rescues cognitive phenotypes in a preclinical mouse model of CTNNB1 syndrome
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: β-cat association with N-cadherin is reduced in β-cat het mice, relative to littermate controls
    explanation: Co-immunoprecipitation demonstrates reduced association in the germline haploinsufficient mouse independently of the batface allele.
- name: Reduced Neural Progenitor Expansion
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Conditional neural beta-catenin knockout models show reduced progenitor proliferation and increased apoptosis. These severe tissue-specific perturbations suggest a developmental route to reduced brain growth but do not demonstrate neuronal loss in living patients. Human microcephaly can be congenital or acquired, and no single timing or mechanism explains every case.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced developmental brain growth is a plausible contributor; congenital and postnatal microcephaly both occur.
  evidence:
  - reference: PMID:39833474
    reference_title: CTNNB1 syndrome mouse models.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Lower proliferation and increased apoptosis
    explanation: The mouse-model review describes neural conditional knockout experiments. The evidence is a secondary summary of models, not direct human histology.
- name: Impaired Dendritic Arborization
  biological_scale: CELLULAR
  description: Batface cortical cultures develop reduced dendritic branching at later culture stages, despite initially increased neurite outgrowth. Separately, siRNA reduction of Ctnnb1 in wild-type mouse cortical cultures reduces neurite extension. These model observations support impaired neuronal maturation; they do not establish an identical defect in every human neuron.
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Altered dendritic development offers a model-supported contribution to cognitive impairment; the intervening human circuit effects are unresolved.
  evidence:
  - reference: PMID:24614104
    reference_title: Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In association with this decreased cadherin interaction, we found that the mutation results in decreased intrahemispheric connections, with deficits in dendritic branching, long-term potentiation, and cognitive function.
    explanation: The batface model links reduced cadherin interaction with dendritic, connectivity and plasticity deficits; it does not establish those defects in human neurons.
  - reference: PMID:24614104
    reference_title: Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Transfection of this siRNA decreased β-catenin expression by 54% in WT cultures
    explanation: A separate knockdown experiment in wild-type mouse cultures approximates a dosage reduction. The measurement was gene expression; it should not be described as a protein assay.
- name: Impaired Hippocampal Synaptic Potentiation
  biological_scale: CELLULAR
  description: Hippocampal slices from batface heterozygous mice show reduced long-term potentiation after tetanic or theta-burst stimulation. Basal transmission and paired-pulse measures were not significantly changed. This supports a selective plasticity defect in an adhesion-impaired, Wnt-activating mouse allele, rather than a direct measurement of human cognition.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The mouse plasticity deficit provides a possible contribution to learning impairment, without proving its prevalence or magnitude in humans.
  evidence:
  - reference: PMID:24614104
    reference_title: Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: long-term potentiation (LTP) induced by either tetanic (Figure 8F) or θ-burst (Figure 8G) stimulation was significantly reduced in slices from Bfc/+ animals
    explanation: Direct ex vivo electrophysiology in batface mice demonstrates impaired potentiation.
- name: Reduced Brain Sodium-Potassium ATPase Abundance
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: In germline Ctnnb1 heterozygous mice, hippocampal and frontal cortical ATPase alpha2 and alpha3 protein levels are reduced, whereas alpha1 is unchanged. Their role in the excitability phenotype is plausible but not isolated by a pump-specific rescue, and this molecular finding has not been established in patients.
  downstream:
  - target: Altered Hippocampal Neuronal Excitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced activity-dependent ion-gradient regulation is proposed to contribute to the electrophysiological changes; parallel rescue by GSK3 inhibition is not proof of exclusive mediation.
  evidence:
  - reference: DOI:10.1038/s44321-024-00110-5
    reference_title: Inhibition of GSK3α,β rescues cognitive phenotypes in a preclinical mouse model of CTNNB1 syndrome
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Na/K ATPases α2 and α3 catalytic subunit levels are reduced, whereas Na/K ATPase α1 catalytic subunit levels are not altered in the β-cat het hippocampus and frontal cortex, compared to wild-type littermates
    explanation: The primary mouse study directly reports reduced alpha2 and alpha3 abundance; alpha1 is unchanged in the full figure legend.
- name: Altered Hippocampal Neuronal Excitability
  biological_scale: CELLULAR
  description: Dentate gyrus granule cells in germline heterozygous mice have a depolarized resting potential and lower firing threshold, but lower maximal firing rates under strong current injection. This mixed phenotype should not be summarized as uniformly increased or decreased excitability. Dual GSK3 inhibition improves several measures without normalizing the resting potential. Equivalent electrophysiological changes have not been established in patients.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The mouse functional changes offer a potential route to altered learning and memory; the human intermediates remain unresolved.
  evidence:
  - reference: DOI:10.1038/s44321-024-00110-5
    reference_title: Inhibition of GSK3α,β rescues cognitive phenotypes in a preclinical mouse model of CTNNB1 syndrome
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taken together, the functional changes suggest reduced threshold for excitability and potential depolarization block.
    explanation: The authors interpret patch-clamp recordings as a reduced threshold with possible depolarization block, not a simple global hyperexcitability state.
- name: Disorganization of Callosal Midline Guidance Cells
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: In Lmx1a-lineage mouse models, biallelic beta-catenin loss or constitutive stabilization disrupts the glial wedge, indusium griseum glia and midline guidance-neuron organization. The similar gain- and loss-of-function phenotypes leave the relative roles of transcription and adhesion unresolved. Midline heterozygous deletion did not produce a callosal defect, limiting direct extrapolation to human haploinsufficiency.
  downstream:
  - target: Failure of Callosal Axon Midline Crossing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Disorganized midline guidance populations contribute to failed crossing and Probst bundles in the conditional mouse models.
  evidence:

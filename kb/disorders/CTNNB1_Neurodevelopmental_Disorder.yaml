genetic:
- name: CTNNB1
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  association: Causal - heterozygous germline loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: Positive
  notes: >-
    Heterozygous, usually de novo, loss-of-function variants in CTNNB1 (3p22.1)
    cause CTNNB1-NDD. The spectrum includes nonsense, frameshift and splice-site
    variants, whole-gene deletions, and a minority of missense variants, some of
    which act as dominant negatives while one has been reported as
    gain-of-function. Missense variants and variants in the C-terminal region
    (exons 13-15) are associated with a milder phenotype, including earlier
    independent walking and better communication. This is the mechanistic opposite
    of the SOMATIC exon-3 stabilising CTNNB1 variants that drive Wnt-activated
    tumours.
  evidence:
  - reference: PMID:36083290
    reference_title: "Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline loss-of-function variants in CTNNB1 cause neurodevelopmental disorder with spastic diplegia and visual defects (NEDSDV; OMIM 615075)"
    explanation: Establishes germline CTNNB1 loss of function as the cause of the disorder and confirms the OMIM identity (615075) matching the MONDO xref.
  - reference: PMID:40684264
    reference_title: "Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "those with missense variants presented a milder phenotype, including earlier achievement of independent walking, fewer motor impairments, better conceptual and social skills, improved communication, and fewer feeding difficulties"
    explanation: Documents the genotype-phenotype relationship in which missense variants confer a milder phenotype than truncating variants.
  - reference: PMID:36293418
    reference_title: "Correlation between Phenotype and Genotype in CTNNB1 Syndrome: A Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While mutations cannot be more generally categorized by location, it is generally observed that the C-terminal protein region (exons 13, 14, 15) correlates with a milder phenotype."
    explanation: Systematic review documenting the milder phenotype associated with C-terminal (exon 13-15) variants.
diagnosis:
- name: Molecular Genetic Testing for CTNNB1
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic CTNNB1
    variant on exome/genome or multigene panel sequencing, or a 3p22.1 deletion
    involving CTNNB1 on chromosomal microarray, in an individual with suggestive
    findings. Because the phenotype is frequently labelled cerebral palsy or
    autism spectrum disorder, genetic testing should be considered in those
    settings.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:35593792
    reference_title: "CTNNB1 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CTNNB1-NDD is established in a proband with suggestive findings and a heterozygous pathogenic variant in CTNNB1 identified by molecular genetic testing"
    explanation: GeneReviews states the molecular diagnostic criterion.
  - reference: PMID:36083290
    reference_title: "Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NEDSDV is a clinically homogeneous disorder irrespective of initial clinical diagnoses, including CP, or entry points for genetic testing."
    explanation: Supports testing individuals whose entry diagnosis was cerebral palsy, since the molecular entity is the same.
- name: Ultra-Widefield Fluorescein Angiography
  description: >-
    Retinal vascular disease in CTNNB1 syndrome is frequently occult on routine
    office ophthalmoscopy. Ultra-widefield fluorescein angiography, if necessary
    under anaesthesia, detects treatment-requiring FEVR in children with
    previously normal examinations and should be considered at diagnosis.
  presence: Abnormal in a substantial minority with normal office examination
  diagnosis_term:
    preferred_term: fluorescein angiography
    term:
      id: NCIT:C190541
      label: Fluorescein Angiography
  evidence:

  associated_phenotypes:
  - Intellectual disability
  - Reduced intrahemispheric connectivity
  - Impaired long-term potentiation
  description: Batface is an ENU-induced Thr653Lys allele with normal protein abundance, reduced cadherin affinity and enhanced Wnt activity. Heterozygotes show altered dendritic development, connectivity, plasticity and cognitive behavior, with increased brain volume; it does not model simple dosage loss or human microcephaly. Acoustic startle magnitude was normal despite impaired prepulse inhibition. Homozygotes are nonviable.

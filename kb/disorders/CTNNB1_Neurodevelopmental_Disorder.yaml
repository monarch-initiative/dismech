inheritance:
- name: Autosomal dominant, typically de novo
  expressivity: VARIABLE
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CTNNB1-NDD is autosomal dominant and in the great majority of cases results
    from a de novo heterozygous loss-of-function variant. Inheritance from a
    mildly affected or apparently asymptomatic parent has been documented, so
    parental testing is indicated before counselling recurrence risk as
    negligible; germline mosaicism is an additional consideration. Penetrance for
    unambiguous loss-of-function variants appears high, while expressivity is
    markedly variable, ranging from a near-normal neurodevelopmental outcome with
    isolated eye disease to profound impairment.
  evidence:
  - reference: PMID:35593792
    reference_title: "CTNNB1 Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTNNB1-NDD is an autosomal dominant disorder typically caused by a de novo pathogenic variant. Rarely, individuals diagnosed with CTNNB1-NDD inherited a CTNNB1 pathogenic variant from a parent."
    explanation: GeneReviews states the autosomal dominant, predominantly de novo inheritance and the rare inherited exception.
  - reference: PMID:36790797
    reference_title: "Familial Exudative Vitreoretinopathy and Systemic Abnormalities in Patients With CTNNB1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the eight families with CTNNB1 mutations, seven were de novo mutations, and one proband inherited the mutation from his asymptomatic mother."
    explanation: Documents both the predominance of de novo variants and a transmitted variant from an asymptomatic parent, supporting variable expressivity/reduced penetrance in counselling.
pathophysiology:
- name: CTNNB1 Loss-of-Function and Beta-Catenin Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous nonsense, frameshift, splice-site and whole-gene deletion variants
    in CTNNB1, plus a minority of missense variants, truncate or destabilise
    beta-catenin and reduce the pool of functional protein. In the largest
    functionally characterised cohort, 87 of 88 distinct variants were predicted
    loss of function, and a subset of missense alleles act as dominant negatives
    that suppress signalling beyond simple haploinsufficiency. Complete deletion of
    the single gene CTNNB1 is sufficient to produce the syndrome, establishing
    dosage sensitivity as the core lesion.
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  downstream:
  - target: Canonical Wnt/Beta-Catenin Transcriptional Deficit
    causal_link_type: DIRECT
    description: >-
      Reduced functional beta-catenin lowers the nuclear pool available to
      co-activate TCF/LEF target genes.
  - target: Impaired Cadherin-Catenin Adherens Junction Adhesion
    causal_link_type: DIRECT
    description: >-
      Reduced or structurally altered beta-catenin weakens the cadherin-to-actin
      linkage at adherens junctions, a signalling-independent structural role.
  - target: Cardiac Developmental Wnt Signalling Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced beta-catenin dosage in the developing heart, where CTNNB1 is also
      expressed, is the proposed route to the congenital cardiac anomalies; the
      intermediates are not established for CTNNB1 specifically.
  evidence:
  - reference: PMID:25326669
    reference_title: "De novo mutations in beta-catenin (CTNNB1) appear to be a frequent cause of intellectual disability: expanding the mutational and clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on 16 additional individuals from 15 families in whom we newly identified de novo loss-of-function CTNNB1 mutations (six nonsense, five frameshift, one missense, two splice mutation, and one whole gene deletion)."
    explanation: Documents the loss-of-function variant spectrum (nonsense, frameshift, splice, missense and whole-gene deletion) underlying the haploinsufficiency mechanism.
  - reference: PMID:24668549
    reference_title: "A new intellectual disability syndrome caused by CTNNB1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Array CGH karyotyping showed a 333 kb de novo microdeletion on 3p22 covering the entire genomic sequence of a single gene, CTNNB1, which codes for β-catenin."
    explanation: A whole-gene deletion of CTNNB1 alone reproduces the syndrome, establishing haploinsufficiency rather than a variant-specific gain of function.
  - reference: PMID:40684264
    reference_title: "Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 88 different variants of the CTNNB1 gene, 87 of which were predicted to lead to loss of CTNNB1 function"
    explanation: Confirms that essentially the entire disease-associated variant spectrum is loss of function.
- name: Canonical Wnt/Beta-Catenin Transcriptional Deficit
  biological_scale: MOLECULAR
  description: >-
    Beta-catenin is the obligate transcriptional co-activator of the canonical Wnt
    pathway: on Wnt/Norrin receptor engagement it escapes destruction-complex
    phosphorylation, accumulates, and enters the nucleus to partner TCF/LEF
    transcription factors. Reduced beta-catenin dosage lowers Wnt-responsive
    reporter output (TOPFlash/SuperTopFlash) and target-gene transcription in
    patient-derived and transfected systems. A subset of missense variants further
    suppresses signalling in a dominant-negative fashion, and one gain-of-function
    missense allele has been described as an outlier.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: regulation of canonical Wnt signaling pathway
    term:
      id: GO:0060828
      label: regulation of canonical Wnt signaling pathway
  downstream:
  - target: Disrupted Cortical Neurodevelopment and Connectivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced Wnt target-gene output in neural progenitors and neurons perturbs
      proliferation, differentiation and circuit assembly in the developing brain.
  - target: Retinal Vascular Norrin/Beta-Catenin Signalling Failure
    causal_link_type: DIRECT
    description: >-
      Norrin-FZD4-LRP5-TSPAN12 signalling in retinal endothelium converges on
      beta-catenin; reduced beta-catenin lowers Norrin target-gene transcription.
  evidence:
  - reference: PMID:25326669
    reference_title: "De novo mutations in beta-catenin (CTNNB1) appear to be a frequent cause of intellectual disability: expanding the mutational and clinical spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Beta-catenin is a key downstream component of the canonical Wnt signaling pathway."
    explanation: Background statement establishing beta-catenin as the downstream effector of canonical Wnt signalling; the substantive functional claims for this node rest on the two IN_VITRO items below.
  - reference: PMID:36083290
    reference_title: "Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two CTNNB1 missense variants were dominant negative regulators of WNT signaling, highlighting the utility of the TOPFlash assay to functionally assess variants."
    explanation: TOPFlash reporter assays demonstrate reduced/dominant-negative WNT signalling output for disease-associated CTNNB1 missense variants.
  - reference: PMID:40684264
    reference_title: "Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays demonstrated reduced Wnt signaling activity, including 11 variants that also exhibited a dominant-negative effect."
    explanation: Directly measures reduced Wnt signalling activity across patient variants and identifies a dominant-negative subset.
- name: Impaired Cadherin-Catenin Adherens Junction Adhesion
  biological_scale: CELLULAR
  description: >-
    Independently of transcription, beta-catenin bridges the cytoplasmic tail of
    classical cadherins to alpha-catenin and the actin cytoskeleton at adherens
    junctions. In the batface mouse a substitution in the C-terminal armadillo
    repeat reduces affinity for membrane-associated cadherins (this specific
    structure-function result comes from the mouse allele, not a human patient
    variant), and CTNNB1 knockdown in
    primary human endothelial cells compromises junctional integrity. This
    adhesion arm explains why the disorder is not simply a Wnt-signalling
    phenocopy and contributes to both neuronal connectivity and vascular barrier
    phenotypes.
  biological_processes:
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: DECREASED
  molecular_functions:
  - preferred_term: cadherin binding
    term:
      id: GO:0045296
      label: cadherin binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: adherens junction
    term:
      id: GO:0005912
      label: adherens junction
  downstream:
  - target: Disrupted Cortical Neurodevelopment and Connectivity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Weakened cadherin-catenin adhesion reduces dendritic branching and
      intrahemispheric connectivity in the batface mouse model.
  evidence:
  - reference: PMID:24614104
    reference_title: "Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mouse mutant, designated batface (Bfc), carries a Thr653Lys substitution in the C-terminal armadillo repeat of β-catenin and displayed a reduced affinity for membrane-associated cadherins."
    explanation: Demonstrates in vivo that a disease-modelling beta-catenin substitution reduces binding to membrane cadherins, the adhesion arm of the mechanism.
  - reference: PMID:24614104
    reference_title: "Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study provides in vivo evidence that dominant mutations in β-catenin underlie losses in its adhesion-related functions, which leads to severe consequences, including intellectual disability, childhood hypotonia, progressive spasticity of lower limbs, and abnormal craniofacial features in adults."
    explanation: Links loss of beta-catenin adhesion function directly to the human-matching phenotype set (ID, hypotonia, progressive lower-limb spasticity, craniofacial anomalies).
  - reference: PMID:39833474
    reference_title: "CTNNB1 syndrome mouse models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, these mutations impair the formation of cell junctions, adversely affecting tissue architecture."
    explanation: Review of CTNNB1 mouse models states the junction-formation (adhesion) arm of the mechanism alongside Wnt signalling.
- name: Disrupted Cortical Neurodevelopment and Connectivity
  biological_scale: CELLULAR
  description: >-
    Combined loss of Wnt transcriptional output and cadherin-mediated adhesion in
    neural progenitors and post-mitotic neurons impairs neuronal differentiation,
    dendritic arborisation and long-range intrahemispheric connectivity, with
    measurable deficits in long-term potentiation. Postnatal (rather than
    congenital) microcephaly and a progressive rather than static neurological
    course in some individuals indicate that the lesion affects continuing
    neuronal maturation and maintenance, not only early patterning.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced cortical connectivity and impaired synaptic plasticity underlie the
      cognitive impairment.
  - target: Progressive Corticospinal and Extrapyramidal Motor Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same developmental lesion affects descending motor and basal-ganglia
      circuits, producing the characteristic motor phenotype.
  - target: Secondary Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired postnatal neuronal growth and maturation produces acquired
      microcephaly rather than a congenitally small head.
  evidence:
  - reference: PMID:24614104
    reference_title: "Dominant β-catenin mutations cause intellectual disability with recognizable syndromic features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In association with this decreased cadherin interaction, we found that the mutation results in decreased intrahemispheric connections, with deficits in dendritic branching, long-term potentiation, and cognitive function."
    explanation: Direct in vivo demonstration of reduced intrahemispheric connectivity, dendritic branching and LTP with consequent cognitive impairment.
  - reference: PMID:24668549
    reference_title: "A new intellectual disability syndrome caused by CTNNB1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thus, CTNNB1 haploinsufficiency causes neuronal loss, craniofacial anomalies and hair follicle defects in both humans and mice."
    explanation: Author conclusion combining the human case and mouse knockout data; tagged OTHER because it mixes human and model-organism evidence in one statement.
- name: Progressive Corticospinal and Extrapyramidal Motor Dysfunction
  biological_scale: TISSUE
  description: >-
    The motor phenotype has a characteristic biphasic structure: early truncal
    hypotonia and muscle weakness give way to progressive distal, predominantly
    lower-limb hypertonia/spasticity, frequently without overt pyramidal signs,
    with an exaggerated startle response resembling atypical hyperekplexia. In the
    second decade a subset develop upper-body (prominently cervical) dystonia with
    or without bradykinesia, indicating additional extrapyramidal/basal-ganglia
    involvement. The early static appearance leads many individuals to be given a
    cerebral palsy diagnosis.
  downstream:
  - target: Spastic Diplegia
    causal_link_type: DIRECT
    description: Progressive lower-limb hypertonia manifests as spastic diplegia.
  - target: Dystonia
    causal_link_type: DIRECT
    description: >-
      Extrapyramidal involvement produces cervical/upper-body dystonia, typically
      emerging in the second decade.
  - target: Exaggerated Startle Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Brainstem/reticular startle-circuit dysregulation produces an atypical
      hyperekplexia phenotype with injurious falls.
  evidence:
  - reference: PMID:39067319
    reference_title: "Movement disorder phenotype in CTNNB1-syndrome: A complex but recognizable phenomenology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "13 patients presented progressive lower limbs hypertonia without overt pyramidal signs. Five patients reported exaggerated startle, three developed upper body (prominently cervical) dystonia in the second decade, with or without bradykinesia (2/13)."
    explanation: Systematic movement-disorder phenotyping of 14 patients establishing the progressive lower-limb hypertonia, startle and later dystonia/bradykinesia components.
  - reference: PMID:39067319
    reference_title: "Movement disorder phenotype in CTNNB1-syndrome: A complex but recognizable phenomenology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTNNB1-syndrome is associated with a peculiar, but recognizable movement disorder phenotype, encompassing complex gait disorders with progressive lower limb hypertonia, exaggerated startle, and possible occurrence in the second decade of life of upper body dystonia with or without bradykinesia."
    explanation: Summarises the composite corticospinal-plus-extrapyramidal motor phenotype and its temporal evolution.
  - reference: PMID:36083290
    reference_title: "Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline loss-of-function variants in CTNNB1 cause neurodevelopmental disorder with spastic diplegia and visual defects (NEDSDV; OMIM 615075) and are the most frequent, recurrent monogenic cause of cerebral palsy (CP)."
    explanation: Establishes that the CTNNB1 motor phenotype is the commonest recurrent monogenic cause of a cerebral palsy diagnosis.
- name: Retinal Vascular Norrin/Beta-Catenin Signalling Failure
  biological_scale: TISSUE
  description: >-
    Retinal vascular development and blood-retina barrier maturation depend on
    Norrin (NDP) signalling through FZD4/LRP5/TSPAN12 to beta-catenin in retinal
    microvascular endothelium. Truncating CTNNB1 variants reduce Norrin/beta-catenin
    signalling activity, and CTNNB1 knockdown in primary human retinal
    microvascular endothelial cells lowers Norrin target-gene transcription,
    reduces endothelial proliferation and compromises junctional integrity;
    endothelial-specific heterozygous Ctnnb1 deletion in mouse reproduces
    FEVR-like retinopathy. This places CTNNB1 in the same signalling module as the
    classical FEVR genes and explains an ocular phenotype clinically
    indistinguishable from FEVR.
  cell_types:
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: retinal blood vessel morphogenesis
    term:
      id: GO:0061304
      label: retinal blood vessel morphogenesis
    modifier: ABNORMAL
  - preferred_term: establishment of blood-retinal barrier
    term:
      id: GO:1990963
      label: establishment of blood-retinal barrier
    modifier: DECREASED
  downstream:
  - target: Exudative Vitreoretinopathy
    causal_link_type: DIRECT
    description: >-
      Incomplete peripheral retinal vascularisation and leaky vessels produce
      exudative vitreoretinopathy that can progress to retinal detachment.
  evidence:
  - reference: PMID:35361685
    reference_title: "Novel truncating variants in CTNNB1 cause familial exudative vitreoretinopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These variants caused truncation and degradation of β-catenin that reduced Norrin/β-catenin signalling activity. Additionally, knockdown (KD) of CTNNB1 in HRECs led to diminished mRNA levels of Norrin/β-catenin targeted genes, reduced cell proliferation and compromised junctional integrity."
    explanation: Mechanistically links CTNNB1 truncating variants to reduced Norrin/beta-catenin signalling, endothelial proliferation and junctional integrity in human retinal microvascular endothelial cells.
  - reference: PMID:35361685
    reference_title: "Novel truncating variants in CTNNB1 cause familial exudative vitreoretinopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Cre-mediated heterozygous deletion of Ctnnb1 in mouse endothelial cells (ECs) resulted in FEVR-like phenotypes."
    explanation: Endothelial-specific heterozygous Ctnnb1 loss is sufficient to produce FEVR-like retinopathy in vivo.
  - reference: PMID:36790797
    reference_title: "Familial Exudative Vitreoretinopathy and Systemic Abnormalities in Patients With CTNNB1 Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared to wild-type CTNNB1, the CTNNB1 mutants failed to induce luciferase reporter activity in SuperTopFlash (STF) cells."
    explanation: Patient CTNNB1 variants fail to activate a beta-catenin-responsive reporter, confirming signalling loss in the FEVR context.
- name: Cardiac Developmental Wnt Signalling Disruption
  biological_scale: TISSUE
  description: >-
    CTNNB1 is expressed in the developing heart in addition to brain, and
    beta-catenin-dependent Wnt signalling contributes to second-heart-field and
    outflow-tract/valve development. A dedicated cardiac phenotyping series found
    congenital heart anomalies (absent pulmonary valve with intact ventricular
    septum, atrioventricular canal with hypoplastic aortic arch, tetralogy of
    Fallot, mitral valve prolapse) at a higher rate than previously appreciated.
    This node is supported by clinical association plus tissue expression rather
    than by a CTNNB1-specific cardiac developmental experiment, and is curated at
    correspondingly lower mechanistic confidence.
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Congenital Heart Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted beta-catenin-dependent cardiac development produces outflow-tract,
      valve and septal anomalies.
  evidence:
  - reference: PMID:37455656
    reference_title: "Congenital heart defects in CTNNB1 syndrome: Raising clinical awareness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CTNNB1 is highly expressed in brain as well as in other tissues, including heart."
    explanation: Background statement of cardiac CTNNB1 expression; it makes a heart-development contribution plausible but does not demonstrate it, consistent with the PROVISIONAL mechanism confidence of this node.
  - reference: PMID:37455656
    reference_title: "Congenital heart defects in CTNNB1 syndrome: Raising clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, five patients showed congenital heart anomalies including absent pulmonary valve with intact ventricular septum, atrioventricular canal with hypoplastic aortic arch, tetralogy of Fallot, and mitral valve prolapse."
    explanation: Documents the spectrum of congenital heart defects observed in a dedicated CTNNB1 cardiac series.
phenotypes:
- category: Cognitive
  name: Intellectual Disability
  description: >-
    Cognitive impairment is present in every reported individual and ranges from
    mild to profound. Performance is relatively better on verbal than on
    visuospatial and logical-reasoning tasks.
  frequency: OBLIGATE
  diagnostic: true
  phenotype_term:
    preferred_term: Intellectual disability

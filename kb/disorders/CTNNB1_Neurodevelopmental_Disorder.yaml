  description: Urbagen is an investigational single-stranded AAV9 vector carrying human CTNNB1, administered once by bilateral intracerebroventricular infusion in the open-label phase I/II GAIN study (NCT07270549). Twelve participants aged 2-12 years are planned, with part A restricted to 6-12 years. Prophylaxis includes methylprednisolone followed by prednisolone and sirolimus. The registry excludes selected predicted gain-of-function and dominant-negative alleles, including Gly575Arg and four truncating variants. Gene addition aims to increase functional dosage; no human safety or efficacy results are posted. Its benefit and long-term safety remain unestablished.

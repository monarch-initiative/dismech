inheritance:
- name: Autosomal dominant, typically de novo
  expressivity: VARIABLE
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: CTNNB1-NDD is autosomal dominant and usually results from a de novo heterozygous pathogenic variant. Familial transmission and presumed parental germline mosaicism are documented. Apparently unaffected relatives can have subtle retinal vascular findings, so absence of reported symptoms does not establish absence of disease. Parental testing informs recurrence counseling; disease severity cannot be predicted reliably from that of another family member.
  evidence:
  - reference: PMID:35593792
    reference_title: CTNNB1 Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CTNNB1-NDD is an autosomal dominant disorder typically caused by a de novo pathogenic variant. Rarely, individuals diagnosed with CTNNB1-NDD inherited a CTNNB1 pathogenic variant from a parent.
    explanation: GeneReviews states the autosomal dominant, predominantly de novo inheritance and the rare inherited exception.
  - reference: PMID:36790797
    reference_title: Familial Exudative Vitreoretinopathy and Systemic Abnormalities in Patients With CTNNB1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among the eight families with CTNNB1 mutations, seven were de novo mutations, and one proband inherited the mutation from his asymptomatic mother.
    explanation: Seven of eight probands had de novo variants. The transmitting mother and sister in the remaining family had no visual complaints but showed mild retinal vascular abnormalities on detailed examination, demonstrating variable expressivity.
  - reference: PMID:36790797
    reference_title: Familial Exudative Vitreoretinopathy and Systemic Abnormalities in Patients With CTNNB1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His mother and elder sister were asymptomatic with bilateral best corrected visual acuity of 20/20; however, supernumerary branches were detected in scanning laser ophthalmoscope (SLO) and fundus fluorescein angiography (FFA).
    explanation: Detailed examination detected retinal findings despite normal visual acuity and no reported symptoms.
pathophysiology:
- name: CTNNB1 Loss-of-Function and Beta-Catenin Haploinsufficiency
  biological_scale: MOLECULAR
  description: Heterozygous truncating, splice-disrupting and deletion alleles commonly reduce functional beta-catenin dosage. Nonsense-mediated RNA decay was demonstrated in lymphocyte-derived cells from two patients; it must not be assumed for every truncation. Missense variants and some expressed truncations can instead alter specific functions or inhibit wild-type protein. The 2025 cohort contained 88 distinct variants, 87 predicted to reduce function, but prediction, protein abundance and reporter activity are different measurements.
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  downstream:
  - target: Canonical Wnt/Beta-Catenin Transcriptional Deficit
    causal_link_type: DIRECT
    description: Reduced functional beta-catenin can lower Wnt-responsive transcription; the effect depends on allele and tissue.
  - target: Impaired Cadherin-Catenin Adherens Junction Adhesion
    causal_link_type: DIRECT
    description: Lower beta-catenin abundance reduces N-cadherin association in a germline heterozygous mouse.
  - target: Reduced Neural Progenitor Expansion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Conditional knockout models support a developmental consequence of beta-catenin loss; the magnitude in human heterozygotes remains uncertain.
  - target: Reduced Brain Sodium-Potassium ATPase Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Germline heterozygous mice have lower ATPase alpha2 and alpha3 protein levels; the intervening regulatory mechanism remains unresolved.
  - target: Disorganization of Callosal Midline Guidance Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Midline-restricted biallelic loss disrupts guidance populations in mice; translation to human heterozygosity is provisional.
  - target: Cardiac Developmental Wnt Signalling Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A developmental cardiac contribution is proposed from the clinical association, not established by a disease-specific experiment.
  - target: Retinal Vascular Norrin/Beta-Catenin Signalling Failure
    causal_link_type: DIRECT
    description: Endothelial beta-catenin deficiency reduces Norrin-responsive transcription.
  - target: Compromised Retinal Endothelial Junction Integrity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: CTNNB1 knockdown produces junctional defects in human retinal endothelial cells.

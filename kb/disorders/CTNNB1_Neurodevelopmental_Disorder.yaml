name: CTNNB1 Neurodevelopmental Disorder
creation_date: '2026-07-31T00:00:00Z'
description: CTNNB1 neurodevelopmental disorder (CTNNB1-NDD; CTNNB1 syndrome; NEDSDV; MRD19) is an autosomal dominant disorder usually caused by a de novo heterozygous loss-of-function variant in CTNNB1, encoding beta-catenin. Beta-catenin mediates canonical Wnt transcription and cadherin-dependent cell adhesion. Developmental and speech delay, variable cognitive impairment, axial hypotonia, limb hypertonia, dystonia, microcephaly, behavioral difficulties and visual abnormalities characterize the disorder. Motor impairment can meet clinical criteria for cerebral palsy; its course varies between individuals. Retinal vascular disease may remain undetected on routine ophthalmoscopy. Most pathogenic alleles reduce beta-catenin function, but selected variants have dominant-negative or assay-dependent activating effects. This entry covers the germline neurodevelopmental disorder, including its ocular manifestations.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: CTNNB1-related disease spans syndromic neurodevelopmental presentations and isolated vitreoretinopathy. MONDO:0014035 identifies the neurodevelopmental entity corresponding to OMIM 615075; its broader parent also includes isolated eye disease. A young child presenting with retinal disease may develop recognizable neurodevelopmental findings later. Somatic CTNNB1 variants driving tumors represent a distinct clinical setting. GeneReviews reports no evidence of increased cancer risk with germline loss-of-function variants; this is not a lifetime risk estimate for every variant class. Published cohorts differ in recruitment, age and assessments and may overlap, so their counts and phenotype percentages are not pooled. The Bookshelf PDF cited by URL is the full text of GeneReviews, CTNNB1 Neurodevelopmental Disorder (PMID:35593792), not a separate study. Detailed ClinicalTrials.gov API references document eligibility, enrollment and result availability alongside the brief trial records.

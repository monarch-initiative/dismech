- species: Mouse
  genotype: Lmx1aCre-targeted biallelic Ctnnb1 exon 2-6 deletion or heterozygous exon 3 stabilization
  description: Both conditional manipulations disrupt callosal midline guidance populations and crossing. The loss model deletes both copies; a midline heterozygous deletion had no callosal phenotype. Only male embryos were analyzed because the Cre transgene is X-linked. These are mechanistic models with a substantial genotype and severity gap from human disease.

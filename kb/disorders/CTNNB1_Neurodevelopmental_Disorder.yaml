  description: Cre-mediated heterozygous deletion of Ctnnb1 restricted to endothelial cells produces FEVR-like retinal phenotypes, isolating the retinal vascular arm of the disorder. Lithium chloride, a GSK-3beta inhibitor that stabilises beta-catenin, partially rescued the defect in this model and in CTNNB1-knockdown human retinal endothelial cells.

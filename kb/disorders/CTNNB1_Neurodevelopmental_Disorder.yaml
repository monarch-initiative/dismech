genetic:
- name: CTNNB1
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  association: Causal - heterozygous germline variants, predominantly loss of function
  relationship_type: CAUSATIVE
  presence: Positive
  notes: The common mechanism is heterozygous loss of function, usually de novo, with transmitted alleles and presumed parental germline mosaicism also documented. Deletions and an inversion disrupting CTNNB1 occur as well as sequence variants. Missense variants are not uniformly mild or functionally equivalent. The 2025 clinical missense subgroup contained only four individuals; the earlier C-terminal severity association was exploratory and included isolated FEVR. Gly575Arg showed normal activity in a 2022 HEK293T reporter, reduced activity in 2023 SuperTopFlash cells, and increased activity and thermal stability in 2025 SK-N-MC experiments. Reporter context and protein tags matter; no general genotype-based prognosis or validated molecular subtype follows from these results.
  evidence:
  - reference: PMID:36083290
    reference_title: Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Germline loss-of-function variants in CTNNB1 cause neurodevelopmental disorder with spastic diplegia and visual defects (NEDSDV; OMIM 615075)
    explanation: Establishes germline CTNNB1 loss of function as the cause of the disorder and confirms the OMIM identity (615075) matching the MONDO xref.
  - reference: PMID:40684264
    reference_title: Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: those with missense variants presented a milder phenotype, including earlier achievement of independent walking, fewer motor impairments, better conceptual and social skills, improved communication, and fewer feeding difficulties
    explanation: This exploratory association concerns only four individuals with missense variants and is not a general prediction for future patients.
  - reference: PMID:36293418
    reference_title: 'Correlation between Phenotype and Genotype in CTNNB1 Syndrome: A Systematic Review of the Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While mutations cannot be more generally categorized by location, it is generally observed that the C-terminal protein region (exons 13, 14, 15) correlates with a milder phenotype.
    explanation: The systematic review used a small, heterogeneous subset including isolated FEVR; the positional association is exploratory and not sufficient to assign a clinical subtype.
  - reference: PMID:40684264
    reference_title: Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, four variants (p.Y333∗, p.Q193∗, p.A317Vfs8∗, and p.S352fs∗) showed reduced levels of TOPFlash-luciferase activity suggesting a dominant negative mechanism
    explanation: The full-text cotransfection experiment identifies four truncating variants, rather than eleven distinct dominant-negative protein variants.
  - reference: PMID:40684264
    reference_title: Genotypic, functional, and phenotypic characterization in CTNNB1 neurodevelopmental syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a subgroup, we did not find evidence that variants with a dominant negative effect led to clear genotype-phenotype correlations
    explanation: The experimentally defined dominant-negative subset did not establish a distinct clinical subtype.

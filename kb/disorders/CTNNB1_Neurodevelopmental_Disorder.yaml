differential_diagnoses:
- name: Cerebral Palsy
  description: >-
    The commonest misdiagnosis. Spastic diplegia with early hypotonia in CTNNB1-NDD
    is clinically indistinguishable from cerebral palsy in early childhood; CTNNB1
    is the most frequent recurrent monogenic cause of a cerebral palsy diagnosis,
    and molecular testing resolves the distinction.
- name: Familial Exudative Vitreoretinopathy (NDP, FZD4, LRP5, TSPAN12)
  description: >-
    The ocular phenotype of CTNNB1-NDD is indistinguishable from classic FEVR
    caused by the Norrin receptor-complex genes; the accompanying
    neurodevelopmental and motor features distinguish CTNNB1-NDD.
- name: Autism Spectrum Disorder
  description: >-
    Many individuals receive an ASD diagnosis before molecular testing;
    CTNNB1 syndrome patients differ in showing disproportionate visuospatial and
    logical-reasoning weakness and greater adaptive-functioning impairment.
- name: Hereditary Spastic Paraplegia
  description: >-
    Progressive lower-limb spasticity overlaps, but CTNNB1-NDD adds intellectual
    disability, microcephaly, facial gestalt and retinal vascular disease.
- name: Hyperekplexia (GLRA1, GLRB, SLC6A5)
  description: >-
    The exaggerated startle of CTNNB1-NDD corresponds to atypical hyperekplexia
    and can prompt consideration of the classic glycinergic hyperekplexia genes.

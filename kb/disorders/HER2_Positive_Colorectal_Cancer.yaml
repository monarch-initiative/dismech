biochemical:
- name: HER2 Immunohistochemistry
  loinc_term:
    id: LOINC:18474-7
    label: HER2 Ag [Presence] in Tissue by Immune stain
  notes: >-
    IHC scoring uses the same criteria as gastric cancer (modified from breast cancer):
    0/1+ negative, 2+ equivocal requiring FISH confirmation, 3+ positive. Colorectal-specific
    scoring criteria have been proposed (HERACLES criteria) with stricter requirements.
    Bound the tissue-generic IHC presence code: this row's own text names
    colorectal-specific HERACLES criteria distinct from breast (the cited
    evidence below separately confirms that CRC lacks a single standardized
    HER2 scoring system, motivating that distinct criteria), so a code
    whose own label names a breast specimen would misstate the specimen.
    No `interpretation_bands` are recorded for the 0/1+/2+/3+ scoring
    stated above: LOINC has no distinct ordinal-score code for the IHC
    grading in any specimen.
  evidence:
  - reference: DOI:10.1007/s00432-022-04230-8
    reference_title: "HER2 overexpression/amplification status in colorectal cancer: a comparison between immunohistochemistry and fluorescence in situ hybridization using five different immunohistochemical scoring criteria"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a unified and standard HER2 scoring system was still not established in CRC"
    explanation: Confirms HER2 immunohistochemistry scoring in colorectal cancer lacks a single standardized system, motivating CRC-specific IHC criteria.
- name: HER2 FISH/ISH
  loinc_term:
    id: LOINC:49683-6
    label: ERBB2 gene copy number/Chromosome 17 copy number in Tissue by FISH
  notes: >-
    Fluorescence in situ hybridization or other in situ hybridization methods detect
    ERBB2
    gene amplification. HER2/CEP17 ratio greater than 2.0 or HER2 copy number greater
    than 6
    indicates amplification. Required for IHC 2+ cases.
    Bound the tissue-generic FISH ratio code: its own LOINC label names
    "Tissue" rather than a specific organ. No `interpretation_bands` are
    recorded for the "ratio greater than 2.0 or ... copy number greater
    than 6" cutoffs stated above: the cited evidence below confirms the
    method (FISH) but does not quote either numeric threshold.
  evidence:
  - reference: DOI:10.3390/cancers16183145
    reference_title: "Prognostic and Predictive Roles of HER2 Status in Non-Breast and Non-Gastroesophageal Carcinomas"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "gene amplification using fluorescence in situ hybridization"
    explanation: Confirms HER2 gene amplification is assessed by fluorescence in situ hybridization.
- name: Next-Generation Sequencing
  loinc_term:
    id: LOINC:42783-1
    label: ERBB2 gene mutations found [Identifier] in Blood or Tissue by Molecular genetics method Nominal
  notes: >-
    NGS can detect ERBB2 amplification through copy number analysis and may identify
    activating ERBB2 mutations as alternative mechanisms of HER2 pathway activation.
    Bound the specimen-generic ("Blood or Tissue") molecular-genetics code,
    matching this row's own lack of specimen commitment. This code covers
    only the mutation-identification half of this row's own claim: its
    label is "mutations found," not amplification or copy number, so it
    does not cover the copy-number-analysis route to detecting ERBB2
    amplification stated above.
  evidence:
  - reference: DOI:10.3390/cancers16183145
    reference_title: "Prognostic and Predictive Roles of HER2 Status in Non-Breast and Non-Gastroesophageal Carcinomas"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "gene mutation using next-generation sequencing"
    explanation: Confirms ERBB2 mutation is detected by next-generation sequencing, complementing IHC/FISH for HER2 pathway assessment.
genetic:
- name: ERBB2 (HER2)
  gene_term:
    preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  association: Somatic Amplification
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    ERBB2 amplification occurs in 3-5% of metastatic CRC, enriched in RAS/BRAF wild-type
    tumors where it may represent 5-14%. Amplification is the primary mechanism, though
    activating mutations also occur rarely. Copy number correlates with response to
    HER2-targeted therapy.
  evidence:
  - reference: DOI:10.1038/s41598-024-62096-x
    reference_title: "RAS/RAF mutations and microsatellite instability status in primary colorectal cancers according to HER2 amplification"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER2 amplifications were found in 41 (4.1%) of 992 primary CRCs"
    explanation: Quantifies somatic HER2/ERBB2 amplification frequency (4.1%) in a primary colorectal cancer cohort, consistent with the 3-5% estimate.
- name: ERBB2 Activating Mutations
  gene_term:
    preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  association: Somatic Activating Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Activating mutations in ERBB2 (e.g., S310F, L755S, V777L) occur in approximately
    2%
    of CRC and may respond to HER2-targeted therapies. These are distinct from amplification
    and can co-occur with RAS mutations.
  evidence:
  - reference: DOI:10.6004/jnccn.2023.7022
    reference_title: "Real-World Treatment Patterns in Patients With HER2-Amplified Metastatic Colorectal Cancer: A Clinical-Genomic Database Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "31 (21.8%) patients with ERBB2 amplifications also had ERBB2 mutations"
    explanation: Real-world mCRC cohort documents co-occurring ERBB2 mutations alongside amplification, supporting ERBB2 activating mutations as an additional alteration in HER2-positive CRC.
- name: RAS/BRAF Wild-Type
  association: Enrichment Context
  notes: >-
    HER2 amplification is strongly associated with RAS wild-type status and is typically
    mutually exclusive with BRAF V600E. This makes HER2-positive CRC a distinct molecular
    subgroup within RAS/BRAF wild-type tumors.
  evidence:
  - reference: DOI:10.1093/jncics/pkad082
    reference_title: "Systematic literature review and meta-analysis of HER2 amplification, overexpression, and positivity in colorectal cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER2+ rates were statistically higher in RAS wild-type (6.1%, 95% CI = 5.4% to 6.9%) vs RAS mutant CRC"
    explanation: Meta-analysis shows HER2 positivity is enriched in RAS wild-type colorectal cancer, supporting the RAS/BRAF wild-type enrichment context.

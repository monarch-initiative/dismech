    snippet: "immunohistochemistry with a score of 2+ and in situ hybridization+, or 3) next-generation sequencing positive."
    explanation: Establishes next-generation sequencing positivity as a diagnostic route for identifying HER2-positive colorectal cancer.
treatments:
- name: Trastuzumab plus Lapatinib
  description: >-
    Dual HER2 blockade with trastuzumab (anti-HER2 antibody) and lapatinib (HER1/HER2
    TKI).
    HERACLES trial demonstrated 30% objective response rate in chemotherapy-refractory,
    HER2-positive, RAS wild-type metastatic CRC.
  notes: >-
    Combines an extracellular anti-HER2 monoclonal antibody (trastuzumab) with
    an oral small-molecule HER1/HER2 tyrosine kinase inhibitor (lapatinib), so
    the single-valued therapeutic_modality slot is intentionally left unset.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: trastuzumab
      term:
        id: CHEBI:231601
        label: trastuzumab
    - preferred_term: lapatinib
      term:
        id: CHEBI:49603
        label: lapatinib
  target_mechanisms:
  - target: ERBB2 (HER2) Amplification and Overexpression
    treatment_effect: INHIBITS
    description: >-
      Blocks overexpressed cell-surface HER2 receptor extracellular signaling
      and intracellular tyrosine kinase activity rather than reversing ERBB2
      gene amplification.
  evidence:
  - reference: PMID:27108243
    reference_title: "Dual-targeted therapy with trastuzumab and lapatinib in treatment-refractory, KRAS codon 12/13 wild-type, HER2-positive metastatic colorectal cancer (HERACLES): a proof-of-concept, multicentre, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight (30%, 95% CI 14-50) of 27 patients had achieved an objective response"
    explanation: HERACLES phase 2 trial demonstrated a 30% objective response rate to dual HER2 blockade with trastuzumab and lapatinib in HER2-positive, KRAS wild-type refractory mCRC.
- name: Trastuzumab plus Pertuzumab
  description: >-
    Dual HER2 antibody blockade with trastuzumab and pertuzumab, which block different
    HER2 epitopes and prevent HER2/HER3 heterodimerization. MyPathway basket trial
    showed
    activity in HER2-amplified CRC.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy

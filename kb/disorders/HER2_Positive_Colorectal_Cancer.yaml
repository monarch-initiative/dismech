  presence: IHC score of 3+ (positive) or 2+ (equivocal, requiring ISH confirmation) in colorectal tumor tissue.
  description: >-
    Immunohistochemical staining of tumor tissue assesses cell-surface HER2 protein
    overexpression and serves as a primary diagnostic screen for HER2-positive colorectal
    cancer.
  diagnosis_term:
    preferred_term: HER2 immunohistochemical test
    term:
      id: NCIT:C51944
      label: Immunohistochemical Test
  evidence:
  - reference: DOI:10.1093/jncics/pkad082
    reference_title: "Systematic literature review and meta-analysis of HER2 amplification, overexpression, and positivity in colorectal cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER2+ was defined as 1) immunohistochemistry with a score of 3+"
    explanation: Meta-analysis of FDA-approved HER2 testing in CRC establishes IHC 3+ as a standard diagnostic criterion for HER2 positivity.
- name: HER2 Fluorescence In Situ Hybridization
  presence: ERBB2 gene amplification (ISH+) confirming equivocal IHC 2+ staining or primary amplification status.
  description: >-
    Fluorescence or other in situ hybridization detects ERBB2 gene copy-number
    amplification and is required to confirm HER2 positivity in IHC 2+ colorectal tumors.
  diagnosis_term:
    preferred_term: fluorescence in situ hybridization
    term:
      id: NCIT:C17563

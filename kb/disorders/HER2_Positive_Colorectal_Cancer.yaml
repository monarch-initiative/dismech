  evidence:
  - reference: DOI:10.1093/jncics/pkad082
    reference_title: "Systematic literature review and meta-analysis of HER2 amplification, overexpression, and positivity in colorectal cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunohistochemistry with a score of 2+ and in situ hybridization+, or 3) next-generation sequencing positive."
    explanation: Establishes ISH positivity alongside IHC 2+ as a standard diagnostic route for HER2-positive colorectal cancer.
  - reference: DOI:10.3390/cancers16183145
    reference_title: "Prognostic and Predictive Roles of HER2 Status in Non-Breast and Non-Gastroesophageal Carcinomas"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "gene amplification using fluorescence in situ hybridization"
    explanation: Confirms fluorescence in situ hybridization is used to assess ERBB2 gene amplification.
- name: ERBB2 Next-Generation Sequencing
  presence: Detection of somatic ERBB2 copy-number amplification or activating sequence mutations.
  description: >-

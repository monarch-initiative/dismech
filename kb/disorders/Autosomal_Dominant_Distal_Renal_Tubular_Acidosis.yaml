genetic:
- name: SLC4A1
  gene_term:
    preferred_term: SLC4A1
    term:
      id: hgnc:11027
      label: SLC4A1
  association: Heterozygous dominant-negative pathogenic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
  features: >-
    Heterozygous SLC4A1 variants cause autosomal dominant dRTA by a
    dominant-negative trafficking mechanism. The Arg589 residue is a mutational
    hotspot (p.Arg589His, p.Arg589Cys, p.Arg589Ser); other recurrent alleles
    include p.Ser613Phe, p.Gly609Arg, the p.Arg901X C-terminal truncation,
    p.Met909Thr and p.Arg388Cys. Both de novo and familial cases are described;
    the dominant alleles usually spare the red cell.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: "CGGV:assertion_6b158156-1985-4647-9e0e-01e7fb4a6739-2021-06-02T040000.000Z"
    evidence:
    - reference: "CGGV:assertion_6b158156-1985-4647-9e0e-01e7fb4a6739-2021-06-02T040000.000Z"
      reference_title: "SLC4A1 / autosomal dominant distal renal tubular acidosis (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SLC4A1 | HGNC:11027 | autosomal dominant distal renal tubular acidosis | MONDO:0008368 | AD | Definitive"
      explanation: >-
        ClinGen Tubulopathy GCEP classifies the SLC4A1-AD-dRTA gene-disease
        relationship as Definitive.
  evidence:
  - reference: PMID:9312167
    reference_title: "Familial distal renal tubular acidosis is associated with mutations in the red cell anion exchanger (Band 3, AE1) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation Arg589--> His was present in two families, while Arg589--> Cys and Ser613--> Phe changes were found in the other families."
    explanation: Identifies the recurrent dominant SLC4A1 alleles in the founding AD-dRTA families.
  - reference: PMID:36776909
    reference_title: "Mutations and clinical characteristics of dRTA caused by SLC4A1 mutations: Analysis based on published patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations in Arg589 were the most frequently observed in AD mutations and the most common in all mutations."
    explanation: Establishes Arg589 as the dominant mutational hotspot.
  variants:
  - name: p.Arg589His
    clinical_significance: PATHOGENIC
    description: The prototype and most common dominant allele; an ER-retained, dominant-negative missense change in the intracellular loop between transmembrane segments 6 and 7.
    evidence:
    - reference: PMID:9497368
      reference_title: Autosomal dominant distal renal tubular acidosis is associated in three families with heterozygosity for the R589H mutation in the AE1 (band 3) Cl-/HCO3- exchanger.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found in three unrelated families with autosomal dominant dRTA that all clinically affected individuals were heterozygous for a single missense mutation encoding the mutant AE1 polypeptide R589H."
      explanation: Identifies R589H as the dominant allele segregating in three AD-dRTA families.
  - name: p.Arg589Cys
    clinical_significance: PATHOGENIC
    description: A hotspot substitution at the same residue; reported de novo and shown to impair cell-surface targeting of kAE1.
    evidence:
    - reference: PMID:42862495
      reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Parental Sanger sequencing demonstrated that the variant was absent in both parents, confirming its de novo origin."
      explanation: Documents a de novo p.Arg589Cys variant causing AD-dRTA.
  - name: p.Ser613Phe
    clinical_significance: PATHOGENIC
    description: An ER-retained dominant missense allele reported in the founding AD-dRTA families.
    evidence:
    - reference: PMID:16420521
      reference_title: Dominant and recessive distal renal tubular acidosis mutations of kidney anion exchanger 1 induce distinct trafficking defects in MDCK cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the dominant mutants (kAE1 R589H and S613F) were retained in the endoplasmic reticulum (ER) in MDCK cells"
      explanation: Shows S613F is an ER-retained dominant trafficking mutant.
  - name: p.Gly609Arg
    clinical_significance: PATHOGENIC
    description: A worldwide hotspot in the seventh transmembrane domain; the mutant retains anion transport but is mistargeted, with a dominant-negative effect on basolateral AE1 expression.
    evidence:
    - reference: PMID:32632909
      reference_title: A different clinical manifestation in a Japanese family with autosomal dominant distal renal tubular acidosis caused by SLC4A1 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The genetic test revealed a heterozygous mutation c.1825G > A (p.Gly609Arg) in SLC4A1 that directed his diagnosis of autosomal dominant dRTA."
      explanation: Documents the p.Gly609Arg dominant allele causing AD-dRTA.
  - name: p.Arg901Ter
    clinical_significance: PATHOGENIC
    description: A C-terminal truncation removing the basolateral targeting motif; the most common truncating dominant allele, mis-sorted apically and endocytosed faster than wild type.
    evidence:
    - reference: PMID:26984737
      reference_title: The carboxyl-terminally truncated kidney anion exchanger 1 R901X dRTA mutant is unstable at the plasma membrane.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We investigated the fate of the most common truncated dominant dRTA mutant kAE1 R901X."
      explanation: Identifies R901X as the most common truncating dominant dRTA allele.
  - name: p.Met909Thr
    clinical_significance: PATHOGENIC
    description: A C-terminal missense allele that gains an apical-targeting (PDZ-ligand) motif, so the exchanger is mislocalised to both apical and basolateral membranes.
    evidence:
    - reference: PMID:22518001
      reference_title: Mutation conferring apical-targeting motif on AE1 exchanger causes autosomal dominant distal RTA.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we studied a family exhibiting dominant inheritance and defined a mutation (AE1-M909T) that affects the C terminus of AE1"
      explanation: Documents the p.Met909Thr dominant allele.
  - name: p.Arg388Cys
    clinical_significance: PATHOGENIC
    description: An N-terminal amphipathic-helix allele presenting with an atypical, late/mild adult phenotype; the mutant is impaired in trafficking to the cell surface.
    evidence:
    - reference: PMID:30554219
      reference_title: A Family with Autosomal Dominant Distal Renal Tubular Acidosis Presents with Atypical Phenotype Caused by a Missence Mutation (R388C) of the Human Kidney Anion Exchanger.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We find a heterozygous mutation (c.1162C>T, p.Arg388Cys) located in exon 11 of SLC4A1 gene by utilization of next-generation sequencing technology."
      explanation: Documents the p.Arg388Cys dominant allele.
diagnosis:
- name: Acid-base and electrolyte testing
  description: >-
    Venous blood gas and serum electrolytes show a hyperchloremic,
    normal-anion-gap metabolic acidosis with hypokalemia - the biochemical signature of dRTA.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:42862495
    reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "venous blood gas analysis was performed and revealed metabolic acidosis (pH 7.197, HCO3- 11.5 mmol/L"
    explanation: Venous blood gas establishing the metabolic acidosis.
- name: Urinalysis with urine pH and anion gap
  description: >-
    Urine pH remains inappropriately high (> 5.5) despite systemic acidosis, and
    the urine anion gap is positive, reflecting impaired ammonium excretion.
  diagnosis_term:
    preferred_term: urinalysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:42862495
    reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinalysis showed highly alkaline urine (pH 7.5), hypocitraturia (urine citrate < 20 mg/L), hypercalciuria with a urine calcium-to-creatinine ratio of 0.64 mg/mg, and a positive urinary anion gap of 16.1 mEq/L"
    explanation: Documents the diagnostic urine findings.
- name: Renal ultrasonography
  description: Renal ultrasound detects nephrocalcinosis and stones and is used for surveillance.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Annual renal ultrasound to evaluate for nephrocalcinosis, urolithiasis, and cysts in asymptomatic individuals."
    explanation: GeneReviews recommends annual renal ultrasound surveillance.
- name: Molecular genetic testing
  description: >-
    Single-gene SLC4A1 testing or a hereditary-tubulopathy gene panel establishes
    the diagnosis; a heterozygous pathogenic SLC4A1 variant with the dRTA
    phenotype confirms the dominant form.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of hereditary dRTA is established in a proband with dRTA and biallelic pathogenic variants in ATP6V0A4, ATP6V1B1, FOXI1, or WDR72, a heterozygous or biallelic pathogenic variants in SLC4A1, or specific heterozygous pathogenic variants in ATP6V1B1 (affecting codon p.Arg394) identified by molecular genetic testing."
    explanation: The GeneReviews diagnostic criterion, including the heterozygous SLC4A1 route for the dominant form.
treatments:
- name: Oral alkali replacement
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  description: >-
    Lifelong oral alkali - sodium bicarbonate and/or potassium citrate, with
    additional potassium chloride as needed - corrects the systemic acidosis and
    hypokalemia. Potassium citrate does double duty, since urinary citrate is the
    inhibitor of calcium precipitation depleted in this disease. It replaces the
    buffer the kidney cannot regenerate; it does not repair the kAE1 defect, and
    the urine stays inappropriately alkaline.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
    - preferred_term: potassium chloride
      term:
        id: CHEBI:32588
        label: potassium chloride
  target_mechanisms:
  - target: Hyperchloremic Normal-Anion-Gap Metabolic Acidosis
    treatment_effect: BYPASSES
    description: Oral alkali replaces systemic base and corrects the acidosis rather than repairing the exchanger defect.
    evidence:
    - reference: PMID:42862495
      reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Alkali therapy with potassium sodium citrate was initiated immediately after diagnosis at a dose of 1 mEq/kg/day and gradually increased to 4 mEq/kg/day"
      explanation: Documents the alkali regimen used to correct the acidosis.
  evidence:
  - reference: PMID:42862495
    reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "substantial catch-up growth occurred during 5 years of follow-up, with the height standard deviation score improving from - 4.1 to - 2.3"
    explanation: Documents catch-up growth after correction of the acidosis with alkali in one patient.
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Oral alkaline therapy to correct metabolic acidosis and hypokalemia with additional potassium chloride as needed."
    explanation: The GeneReviews first-line management statement.
- name: ADV7103 (prolonged-release potassium citrate and bicarbonate)
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  description: >-
    A combination controlled-release potassium bicarbonate and potassium citrate
    preparation approved in Europe. Its value is adherence rather than a new
    mechanism: conventional alkali must be taken several times a day to hold the
    correction, and this formulation allows less frequent dosing.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: potassium citrate
      term:
        id: CHEBI:64733
        label: potassium citrate (anhydrous)
    - preferred_term: potassium bicarbonate
      term:
        id: CHEBI:81862
        label: potassium hydrogencarbonate
  target_mechanisms:
  - target: Hyperchloremic Normal-Anion-Gap Metabolic Acidosis
    treatment_effect: BYPASSES
    description: Same buffer replacement as conventional alkali, on a schedule patients can sustain.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "ADV7103 is a combination controlled-release potassium bicarbonate and potassium citrate medication approved in Europe that allows less frequent dosing."
    explanation: The GeneReviews statement naming the product, its composition and its practical advantage.
- name: Avoidance of potassium-sparing diuretics
  therapeutic_modality: OTHER
  action_category: THERAPEUTIC
  description: >-
    GeneReviews lists potassium-sparing diuretics among the agents to use with
    caution or avoid in hereditary dRTA.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Collecting-Duct Proton Secretion
    treatment_effect: MODULATES
    description: Avoidance is aimed at not further impairing distal proton secretion; it does not correct the lesion.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Agents/circumstances to avoid: Potassium-sparing diuretics should be used with caution or avoided."
    explanation: The GeneReviews Agents/Circumstances to Avoid statement.
- name: Genetic counseling
  therapeutic_modality: OTHER
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling for the 50% transmission risk, including the availability of
    prenatal and preimplantation testing once the familial variant is known, and
    cascade testing of at-risk relatives to start alkali therapy early.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Once the hereditary dRTA-causing pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: The GeneReviews Genetic Counseling statement on reproductive options.
animal_models:
- name: Ae1 R607H knockin mouse
  species: Mouse
  genotype: Slc4a1 R607H knockin (orthologous to human R589H)
  publication: PMID:27932475
  description: >-
    A knockin mouse carrying the murine equivalent of the most common human
    dominant dRTA variant R589H. It reproduces an incomplete dRTA and the
    intercalated-cell loss seen in human disease while, notably, the mutant
    protein is still targeted basolaterally - so the in vivo phenotype is driven
    by intercalated-cell depletion and V-ATPase mistargeting rather than simple
    basolateral mislocalisation.
  modeled_mechanisms:
  - target: Progressive Alpha-Intercalated Cell Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The knockin mouse reproduces the loss of Ae1-expressing type A intercalated cells.
    limitations: >-
      Heterozygous and homozygous knockins show only incomplete dRTA with
      compensatory NBCn1 upregulation, and basolateral targeting of the mutant
      was preserved, so the murine mechanism diverges from the
      basolateral-mistrafficking model established in human cell systems.
    evidence:
    - reference: PMID:27932475
      reference_title: Intercalated Cell Depletion and Vacuolar H(+)-ATPase Mistargeting in an Ae1 R607H Knockin Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To test this hypothesis in vivo, we generated an Ae1 R607H knockin mouse, which corresponds to the most common dominant dRTA mutation in human AE1, R589H."
      explanation: Establishes the knockin as a model of the common human dominant allele.
  - target: Impaired Renal Net Acid Excretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The knockin reproduces an incomplete, compensated distal acidification defect.
    limitations: >-
      The acidosis is incomplete and compensated by NBCn1 upregulation rather
      than the overt metabolic acidosis of the human disease.
    evidence:
    - reference: PMID:27932475
      reference_title: Intercalated Cell Depletion and Vacuolar H(+)-ATPase Mistargeting in an Ae1 R607H Knockin Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous and homozygous R607H knockin mice displayed incomplete dRTA characterized by compensatory upregulation of the Na+/HCO3- cotransporter NBCn1."
      explanation: Documents the incomplete dRTA phenotype in the knockin.
- name: Slc4a1 (AE1) knockout mouse
  species: Mouse
  genotype: slc4a1-/- (AE1 null)
  publication: PMID:17409310
  description: >-
    An AE1-null mouse that develops complete dRTA. It models the acidification
    consequence of losing distal AE1 but is a loss-of-function null rather than a
    dominant-negative model - heterozygous null mice are unaffected, unlike human
    dominant disease - so it captures the transport-loss endpoint and not the
    dominant mechanism.
  modeled_mechanisms:
  - target: Impaired Renal Net Acid Excretion
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The null mouse reproduces complete dRTA with low net acid excretion and alkaline urine.
    limitations: >-
      This is a complete AE1 null, not the human dominant-negative heterozygous
      state: heterozygous AE1-deficient mice have no apparent defect, so the
      model does not capture the dominant inheritance or the heterodimer
      retention mechanism.
    evidence:
    - reference: PMID:17409310
      reference_title: Distal renal tubular acidosis in mice lacking the AE1 (band3) Cl-/HCO3- exchanger (slc4a1).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice that were heterozygous for the AE1-deficient allele had no apparent defect."
      explanation: Shows the null allele is recessive in the mouse, unlike the human dominant disease, which is the key limitation.
experimental_models:
- name: Polarized MDCK kidney epithelial cells expressing mutant kAE1
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: dog
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
  description: >-
    Madin-Darby canine kidney (MDCK) monolayers stably expressing wild-type or
    mutant kAE1, the principal system in which the dominant dRTA trafficking
    mechanism was worked out.
  publication: PMID:16420521
  modeled_mechanisms:
  - target: Mistrafficking of kAE1 with Dominant-Negative Retention of Wild-Type kAE1
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Polarized MDCK cells reproduce the ER retention of dominant mutants and the intracellular retention of co-expressed wild-type kAE1.
    limitations: >-
      Overexpression in a canine kidney line may not reproduce native
      intercalated-cell stoichiometry, and basolateral mislocalisation in human
      tissue is inferred from this system.
    evidence:
    - reference: PMID:16420521
      reference_title: Dominant and recessive distal renal tubular acidosis mutations of kidney anion exchanger 1 induce distinct trafficking defects in MDCK cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When coexpressed, the dominant mutants retained kAE1 WT intracellularly, while the recessive mutants did not."
      explanation: The dominant-negative retention observed in the MDCK model.
differential_diagnoses:
- name: Distal renal tubular acidosis 4 with hemolytic anemia (recessive SLC4A1)
  description: >-
    The autosomal recessive SLC4A1 form, curated separately. It is caused by
    biallelic variants, presents earlier and more severely, is enriched in
    Southeast Asian populations, and - unlike the dominant form - couples the
    renal defect with hemolytic anemia and abnormal red-cell morphology.
  disease_term:
    preferred_term: renal tubular acidosis, distal, 4, with hemolytic anemia
    term:
      id: MONDO:0012700
      label: renal tubular acidosis, distal, 4, with hemolytic anemia
  distinguishing_features:
  - >-
      Biallelic SLC4A1 variants; hemolytic anemia and spherocytosis/ovalocytosis;
      earlier onset, more severe acidosis and lower serum potassium; Asian
      predominance.
  evidence:
  - reference: PMID:36776909
    reference_title: "Mutations and clinical characteristics of dRTA caused by SLC4A1 mutations: Analysis based on published patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only 11(10.89%) patients presented with hematological abnormalities in 101 patients with AD dRTA."
    explanation: >-
      Hematological abnormalities are uncommon in the dominant form, separating
      it from the recessive hemolytic-anemia disease.
- name: ATP6V1B1- and ATP6V0A4-related recessive dRTA with sensorineural hearing loss
  description: >-
    Recessive dRTA caused by variants in the vacuolar H+-ATPase subunit genes,
    distinguished by sensorineural hearing loss, which is characteristic of the
    ATP6V genes and generally absent in SLC4A1 disease.
  distinguishing_features:
  - >-
      Autosomal recessive; sensorineural hearing loss (very frequent in ATP6V1B1);
      H+-ATPase subunit genes rather than the anion exchanger.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "sensorineural hearing loss (in ATP6V0A4-, ATP6V1B1-, and FOXI1-related dRTA)"
    explanation: Assigns sensorineural hearing loss to the ATP6V/FOXI1 genes, not to SLC4A1.
- name: Acquired distal renal tubular acidosis
  description: >-
    Secondary dRTA from autoimmune disease (notably Sjögren syndrome), drugs
    (amphotericin B, lithium) or obstructive uropathy, which must be excluded
    before attributing dRTA to a Mendelian cause.
  distinguishing_features:
  - Later onset without family history; an identifiable autoimmune, drug or obstructive cause; no causal SLC4A1 variant.
  evidence:
  - reference: PMID:37016093
    reference_title: The pathophysiology of distal renal tubular acidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Acquired forms of dRTA are caused by various types of autoimmune diseases or adverse effects of some drugs."
    explanation: Names the acquired causes that are the main differential for hereditary dRTA.
notes: >-
  Scope: this entry is the autosomal dominant, SLC4A1-caused form of distal
  (type 1) RTA. The recessive SLC4A1 form with hemolytic anemia is curated at
  Renal_Tubular_Acidosis_Distal_4_with_Hemolytic_Anemia and is listed here as a
  differential. SLC4A1 is pleiotropic - the same gene causes hereditary
  spherocytosis and Southeast Asian ovalocytosis - and the dominant renal
  alleles usually spare the red cell. ClinGen (Tubulopathy GCEP) classifies the
  SLC4A1-AD-dRTA gene-disease relationship as Definitive (CGGV assertion cited in
  the genetic section). GeneReviews has no AD-specific chapter; the hereditary
  dRTA chapter (PMID:31600044) covers all genes and is tagged as the baseline.

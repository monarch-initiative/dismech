- name: Acidosis-Driven Calciopenic Mineralization Defect
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  description: >-
    Chronic uncorrected metabolic acidosis places dRTA on the calciopenic arm of
    the defective skeletal mineralization module. Urinary calcium loss reduces
    the calcium reaching the mineralization front, and net renal generation of
    1,25-dihydroxyvitamin D falls even though 25-hydroxyvitamin D supply is
    intact. That the limiting step is the acidosis is what alkali therapy
    demonstrates: correcting the acidosis alone raises serum calcitriol and
    heals the bone disease.
  biological_processes:
  - preferred_term: impaired skeletal mineralization
    modifier: DECREASED
    term:
      id: GO:0030282
      label: bone mineralization
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  locations:
  - preferred_term: bone element
    term:
      id: UBERON:0001474
      label: bone element
  evidence:
  - reference: PMID:16110243
    reference_title: "Distal renal tubular acidosis: alkali heals osteomalacia and increases net production of 1,25-dihydroxyvitamin D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2 women with distal renal tubular acidosis and osteomalacia, alkali treatment cured the bone disease and was accompanied by marked increases in the serum 1,25 dihydroxyvitamin D concentration, without a significant change in the 25-hydroxyvitamin D concentration."
    explanation: >-
      Alkali alone raised calcitriol while 25-hydroxyvitamin D was unchanged,
      locating the defect at calcitriol generation rather than vitamin D
      substrate supply - the calciopenic arm. This is an n=2 adult osteomalacia
      study, not a paediatric rickets cohort, so the arm assignment rests on the
      demonstrated mechanism rather than on cohort size.
  notes: >-
    Arm assignment is calciopenic rather than phosphopenic, following the
    SLC4A1-dRTA and CKD-MBD conformers: the distal RTA skeletal lesion is driven
    by hypercalciuric calcium loss and secondary reductions in calcitriol, not
    by tubular phosphate wasting. The calcitriol evidence (PMID:16110243) is n=2
    adults with osteomalacia.
  downstream:
  - target: Rickets
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced calcium and calcitriol supply at the growing-bone mineralization front
    description: >-
      In growing bone the calciopenic mineralization defect presents as rickets;
      in the mature skeleton the same defect presents as osteomalacia.
    evidence:
    - reference: PMID:42862495
      reference_title: Early-onset autosomal dominant distal renal tubular acidosis caused by a de novo SLC4A1 R589C variant with growth failure and rickets.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Knee radiographs demonstrated characteristic rachitic changes, including cupping, fraying, and splaying of the metaphyses"
      explanation: Documents radiographic rickets in an SLC4A1 AD-dRTA child.
  - target: Osteomalacia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - undermineralized bone matrix in the mature skeleton
    description: In the closed-growth-plate skeleton the mineralization defect presents as osteomalacia.
    evidence:
    - reference: PMID:16110243
      reference_title: "Distal renal tubular acidosis: alkali heals osteomalacia and increases net production of 1,25-dihydroxyvitamin D."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 2 women with distal renal tubular acidosis and osteomalacia, alkali treatment cured the bone disease"
      explanation: Documents osteomalacia in adults with distal RTA.
  - target: Growth delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic metabolic acidosis buffered by bone and impaired skeletal mineralization
    description: The combined acidosis and skeletal disease impair childhood growth.
    evidence:
    - reference: PMID:36776909
      reference_title: "Mutations and clinical characteristics of dRTA caused by SLC4A1 mutations: Analysis based on published patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The metabolic acidosis is mainly buffered by the bone, and bone demineralization leads to failure to thrive and rickets."
      explanation: Links the acidosis and bone disease to growth failure.
- name: Alpha-Intercalated Cell Intracellular Alkalinization and Impaired Autophagy
  biological_scale: CELLULAR
  description: >-
    Reduced kAE1 anion exchange raises the alpha-intercalated cell's cytosolic
    pH and lowers ATP synthesis, which attenuates autophagosome-lysosome fusion
    and lysosomal degradation. This is a cell-intrinsic consequence of the
    transport loss, distinct from the lumen-side acidification defect.
  cell_types:
  - preferred_term: alpha-intercalated cell
    term:
      id: CL:0005011
      label: renal alpha-intercalated cell
  biological_processes:
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:41778592
    reference_title: SLC4A1 mutations that cause distal renal tubular acidosis alter cytoplasmic pH and cellular autophagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced transport activity of the kAE1 variants correlated with increased cytosolic pH, reduced ATP synthesis, attenuated downstream autophagic pathways"
    explanation: Directly links reduced kAE1 transport to raised cytosolic pH and impaired autophagy.
  downstream:
  - target: Progressive Alpha-Intercalated Cell Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - accumulation of ubiquitin and p62-positive material in intercalated cells with impaired degradative flux
    description: Impaired autophagy and degradation underlie the loss of intercalated cells seen in vivo.
    evidence:
    - reference: PMID:41778592
      reference_title: SLC4A1 mutations that cause distal renal tubular acidosis alter cytoplasmic pH and cellular autophagy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "in vivo studies in kAE1 R607H dRTA mice and humans have revealed a complex pathophysiology implicating a loss of kAE1-expressing intercalated cells and intracellular relocation of the H+-ATPase in the remaining type-A intercalated cells."
      explanation: >-
        Background statement that intercalated cells expressing kAE1 are lost
        in vivo. The sentence pools R607H knockin mouse and human data, so it is
        graded by its human component and does not on its own show which
        species the cell loss was measured in.
    - reference: PMID:27932475
      reference_title: Intercalated Cell Depletion and Vacuolar H(+)-ATPase Mistargeting in an Ae1 R607H Knockin Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Accumulation of p62- and ubiquitin-positive material in A-ICs of knockin mice suggested a defect in the degradative pathway, which may explain the observed loss of A-ICs."
      explanation: >-
        In the knockin mouse, p62 and ubiquitin accumulate in type A
        intercalated cells, and the authors propose this degradative defect as
        the cause of the cell loss.

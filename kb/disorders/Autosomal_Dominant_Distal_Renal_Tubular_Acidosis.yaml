- name: Calcium Phosphate Supersaturation in Alkaline Tubular Fluid
  biological_scale: TISSUE
  conforms_to: "nephrolithiasis_crystal_nucleation#Urinary Supersaturation"
  description: >-
    The disease-specific supersaturation trigger of the nephrolithiasis module:
    in dRTA the lithogenic combination is persistently alkaline urine (which
    favours calcium phosphate) together with hypercalciuria and the loss of
    citrate, the normal inhibitor of calcium crystallisation. This raises
    urinary supersaturation with respect to calcium phosphate and drives crystal
    nucleation, producing nephrocalcinosis and nephrolithiasis - the latter
    disproportionately frequent in SLC4A1 disease.

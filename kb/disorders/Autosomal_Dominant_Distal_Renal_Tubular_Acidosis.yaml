name: Autosomal Dominant Distal Renal Tubular Acidosis
creation_date: '2026-10-28T00:00:00Z'
category: Mendelian
description: >-
  Autosomal dominant distal (type 1) renal tubular acidosis is a Mendelian
  renal tubulopathy caused by heterozygous variants in SLC4A1, the gene
  encoding the chloride/bicarbonate anion exchanger 1 (AE1, band 3). Its kidney
  isoform, kAE1, sits in the basolateral membrane of collecting-duct
  alpha-intercalated cells and recycles the bicarbonate generated by apical
  proton secretion. Dominant alleles (the Arg589 hotspot, Ser613Phe, Gly609Arg,
  the Arg901X truncation and others) act by a dominant-negative trafficking
  mechanism: the mutant protein retains much of its intrinsic anion-exchange
  function but is mistrafficked, and because kAE1 works as a dimer it drags the
  wild-type protein off the basolateral membrane. The result is a
  hyperchloremic, normal-anion-gap metabolic acidosis with inappropriately
  alkaline urine, hypokalemia, hypercalciuria with hypocitraturia,
  nephrocalcinosis and nephrolithiasis, and metabolic bone disease. The
  dominant form is typically later in onset and milder than the recessive
  SLC4A1 form, and - unlike that form - usually spares the red cell. The
  recessive SLC4A1 disease with hemolytic anemia is curated separately
  (Renal_Tubular_Acidosis_Distal_4_with_Hemolytic_Anemia).
synonyms:
- renal tubular acidosis, distal 1
- AD dRTA
- DRTA1
- autosomal dominant SLC4A1-associated distal renal tubular acidosis
- RTA, classic type
- RTA, gradient type

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Primary hereditary dRTA is a rare disorder; a precise prevalence is not
    established. In a systematic review of published SLC4A1-related dRTA, 100 of
    169 patients had autosomal dominant inheritance.
  evidence:
  - reference: PMID:36776909
    reference_title: "Mutations and clinical characteristics of dRTA caused by SLC4A1 mutations: Analysis based on published patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifteen mutations involving 100 patients were autosomal dominant inheritance, 21 mutations involving 61 patients were autosomal recessive inheritance."
    explanation: >-
      Provides the published-literature denominator and the dominant-case count
      for SLC4A1-related dRTA.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Caused by heterozygous SLC4A1 variants acting through a dominant-negative
    effect on wild-type kAE1. Penetrance is incomplete and expressivity
    variable: carriers of the same variant within one family can range from
    severe early-childhood disease to being clinically and biochemically normal.
  evidence:
  - reference: PMID:31600044
    reference_title: Hereditary Distal Renal Tubular Acidosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Autosomal dominant inheritance: Each child of an individual with autosomal dominant dRTA has a 50% chance of inheriting the pathogenic variant."
    explanation: >-
      The GeneReviews Genetic Counseling statement of the 50% transmission risk
      for autosomal dominant dRTA.
  - reference: PMID:32632909
    reference_title: A different clinical manifestation in a Japanese family with autosomal dominant distal renal tubular acidosis caused by SLC4A1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same mutation was also detected in his 6-year-old sister, though she had no clinical symptoms, no nephrocalcinosis, and no laboratory result abnormalities including metabolic acidosis."
    explanation: >-
      A variant carrier who is clinically and biochemically normal while her
      brother and mother are affected, documenting incomplete penetrance and
      variable expressivity within one family.
pathophysiology:
- name: Heterozygous SLC4A1 Variant Producing Mutant kAE1
  biological_scale: MOLECULAR
  description: >-
    A heterozygous pathogenic SLC4A1 variant produces a mutant kidney anion
    exchanger 1 (kAE1). The dominant alleles cluster at the Arg589 hotspot and
    at other transmembrane or C-terminal residues (Ser613Phe, Gly609Arg, the
    Arg901X truncation, Met909Thr). Importantly, the mutant protein usually
    retains much of its intrinsic chloride/bicarbonate exchange activity - the
    defect is where the protein goes, not whether it can transport.
  gene:
    preferred_term: SLC4A1
    term:
      id: hgnc:11027
      label: SLC4A1
  molecular_functions:
  - preferred_term: chloride:bicarbonate antiporter activity (kAE1)
    term:
      id: GO:0140900
      label: chloride:bicarbonate antiporter activity
  evidence:
  - reference: PMID:9312167
    reference_title: "Familial distal renal tubular acidosis is associated with mutations in the red cell anion exchanger (Band 3, AE1) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected patients in four families with autosomal dominant familial renal tubular acidosis (dRTA) were heterozygous for mutations in their red cell HCO3-/Cl- exchanger, band 3 (AE1, SLC4A1) genes, and these mutations were not found in any of the nine normal family members studied."
    explanation: >-
      The original demonstration that heterozygous SLC4A1 (band 3/AE1) variants
      segregate with autosomal dominant dRTA.
  - reference: PMID:14734552
    reference_title: A novel missense mutation in AE1 causing autosomal dominant distal renal tubular acidosis retains normal transport function but is mistargeted in polarized epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "They confirm that dominant dRTA is associated with non-polarized trafficking of the protein, with no significant effect on anion transport function in vitro, which remains an unusual mechanism of human disease."
    explanation: >-
      Establishes that intrinsic anion-exchange function of the dominant mutant
      is preserved and the lesion is trafficking, which is why the molecular
      function is bound without a decreased modifier.
  downstream:
  - target: Mistrafficking of kAE1 with Dominant-Negative Retention of Wild-Type kAE1
    causal_link_type: DIRECT
    description: The mutant protein is mistrafficked once synthesised.
    evidence:
    - reference: PMID:16420521
      reference_title: Dominant and recessive distal renal tubular acidosis mutations of kidney anion exchanger 1 induce distinct trafficking defects in MDCK cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast to wild-type (WT) kAE1 that was localized to the basolateral membrane, the dominant mutants (kAE1 R589H and S613F) were retained in the endoplasmic reticulum (ER) in MDCK cells, with a few cells showing in addition some apical localization."
      explanation: >-
        Directly shows the dominant mutant proteins are mislocalised rather than
        reaching the basolateral membrane.
- name: Mistrafficking of kAE1 with Dominant-Negative Retention of Wild-Type kAE1
  biological_scale: CELLULAR
  description: >-
    The mutant kAE1 is retained intracellularly (in the endoplasmic reticulum
    for Arg589His and Ser613Phe) or mis-sorted to the apical membrane (for the
    Arg901X truncation and Met909Thr, which lose a C-terminal basolateral
    targeting motif). Because kAE1 assembles as a dimer, the mutant forms
    heterodimers with the wild-type protein and holds it intracellularly too -
    the dominant-negative step that explains why one mutant allele impairs the
    product of the normal allele.
  cell_types:
  - preferred_term: alpha-intercalated cell
    term:
      id: CL:0005011
      label: renal alpha-intercalated cell
  biological_processes:
  - preferred_term: kAE1 localization to the basolateral plasma membrane
    modifier: DECREASED
    term:
      id: GO:1903361
      label: protein localization to basolateral plasma membrane
  evidence:
  - reference: PMID:16420521
    reference_title: Dominant and recessive distal renal tubular acidosis mutations of kidney anion exchanger 1 induce distinct trafficking defects in MDCK cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When coexpressed, the dominant mutants retained kAE1 WT intracellularly, while the recessive mutants did not."
    explanation: >-
      The defining dominant-negative observation: the dominant mutant drags
      wild-type kAE1 off the surface, whereas recessive mutants do not.
  - reference: PMID:19565014
    reference_title: Molecular mechanisms of autosomal dominant and recessive distal renal tubular acidosis caused by SLC4A1 (AE1) mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The dominant kAE1 mutants result in intracellular retention of the wild-type kAE1, the so called 'dominant-negative effect'"
    explanation: >-
      Review synthesis naming the dominant-negative heterodimer retention as the
      molecular basis of the dominant phenotype.
  downstream:
  - target: Loss of Basolateral Bicarbonate-Chloride Exchange in Alpha-Intercalated Cells
    causal_link_type: DIRECT
    description: Too little functional kAE1 reaches the basolateral membrane.
    evidence:
    - reference: PMID:14996906
      reference_title: "Regions of human kidney anion exchanger 1 (kAE1) required for basolateral targeting of kAE1 in polarised kidney cells: mis-targeting explains dominant renal tubular acidosis (dRTA)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In polarised cells, the mutant kAE1(R901Stop) was mis-targeted to the apical membrane, while the kAE1(R589H) and kAE1(S613F) mutants did not reach the cell surface."
      explanation: >-
        The mutant protein fails to reach the basolateral surface, removing
        functional basolateral exchange.
- name: Loss of Basolateral Bicarbonate-Chloride Exchange in Alpha-Intercalated Cells
  biological_scale: CELLULAR
  description: >-
    With insufficient kAE1 at the basolateral membrane, the alpha-intercalated
    cell can no longer export the bicarbonate it generates in exchange for
    chloride. Basolateral Cl-/HCO3- exchange is the obligatory exit step that
    the cell's acid-secretory machinery is coupled to.
  cell_types:
  - preferred_term: alpha-intercalated cell
    term:
      id: CL:0005011
      label: renal alpha-intercalated cell
  biological_processes:
  - preferred_term: basolateral bicarbonate transport
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport
  locations:
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  evidence:
  - reference: PMID:28509104
    reference_title: Autosomal dominant distal renal tubular acidosis caused by a mutation in the anion exchanger 1 gene in a Japanese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "α-ICs secrete protons into the tubular lumen through the apical H+-ATPase functionally coupled to the basolateral Cl−/HCO3 − exchanger AE1"
    explanation: >-
      States the functional coupling that makes loss of basolateral AE1 exchange
      impair apical proton secretion.
  downstream:
  - target: Impaired Collecting-Duct Proton Secretion
    causal_link_type: DIRECT
    description: >-
      The apical proton pump is coupled to basolateral bicarbonate exit, so
      losing the exchanger compromises secretion. Inferred coupling link,
      supported by the functional-coupling statement and by the knockin-mouse
      finding that reduced basolateral exchange impairs V-ATPase regulation.
    evidence:
    - reference: PMID:27932475
      reference_title: Intercalated Cell Depletion and Vacuolar H(+)-ATPase Mistargeting in an Ae1 R607H Knockin Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We propose that reduced basolateral anion-exchange activity in A-ICs inhibits trafficking and regulation of V-type ATPase, compromising luminal H+ secretion and possibly lysosomal acidification."
      explanation: >-
        In vivo evidence that reduced basolateral exchange compromises apical
        proton secretion.
  - target: Alpha-Intercalated Cell Intracellular Alkalinization and Impaired Autophagy
    causal_link_type: DIRECT
    description: >-
      Losing anion exchange raises the cell's cytosolic pH, a distinct
      consequence of the transport loss separate from the lumen-side
      acid-secretion defect.
    evidence:
    - reference: PMID:41778592
      reference_title: SLC4A1 mutations that cause distal renal tubular acidosis alter cytoplasmic pH and cellular autophagy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that reduced transport activity of the kAE1 variants correlated with increased cytosolic pH, reduced ATP synthesis, attenuated downstream autophagic pathways pertaining to the fusion of autophagosomes and lysosomes and/or lysosomal degradative activity."
      explanation: >-
        Links reduced kAE1 exchange activity to elevated cytosolic pH and
        impaired autophagy in collecting-duct cells.

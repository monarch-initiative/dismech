inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic UROC1 loss of function is required. Reported probands are
    homozygous or compound heterozygous, and carrier parents are biochemically
    and clinically unremarkable. Penetrance of the biochemical phenotype appears
    complete in biallelic individuals; penetrance of any clinical phenotype is
    not established, and the existence of phenotypically normal biallelic
    siblings shows it is not complete.
  evidence:
  - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
    reference_title: "UROC1 / urocanic aciduria (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UROC1 | HGNC:26444 | urocanic aciduria | MONDO:0010167 | AR | Limited"
    explanation: >-
      The ClinGen Aminoacidopathy Gene Curation Expert Panel records autosomal
      recessive inheritance for this gene-disease pair.
pathophysiology:
- name: Biallelic UROC1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  description: >-
    Two UROC1 alleles that cannot produce a functional enzyme. Reported alleles
    include missense changes that disrupt folding or abolish substrate binding
    and a recurrent nonsense allele; ClinGen's curation counts four unique
    missense variants and one nonsense variant across the reported human cases.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: UROC1
    term:
      id: hgnc:26444
      label: UROC1
  molecular_functions:
  - preferred_term: urocanate hydratase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016153
      label: urocanate hydratase activity
  evidence:
  - reference: PMID:19304569
    reference_title: Mutations in the urocanase gene UROC1 are associated with urocanic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes the first putative mutations, p.L70P and p.R450C, in
      the coding region of the UROC1 gene in a girl with urocanic aciduria
      presenting with mental retardation and intermittent ataxia.
    explanation: >-
      The first report of UROC1 coding variants in a proband with the
      biochemical phenotype.
  - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
    reference_title: "UROC1 / urocanic aciduria (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Four unique missense variants and one nonsense varaint have been reported
      in humans thus far.
    explanation: >-
      ClinGen's allele census for this gene-disease pair. The misspelling is the
      source's own and is quoted as written.
  downstream:
  - target: Loss of Urocanate Hydratase Activity
    causal_link_type: DIRECT
    description: >-
      Neither allele yields an enzyme capable of catalysis, so hepatocytes have
      no urocanate hydratase activity.
    evidence:
    - reference: PMID:19304569
      reference_title: Mutations in the urocanase gene UROC1 are associated with urocanic aciduria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Computed (in silico) predictions, protein expression studies and enzyme
        activity assays suggest that none of the mutations can produce a fully
        functional enzyme.
      explanation: >-
        Protein expression and enzyme activity assays establish that the
        reported alleles do not yield a functional enzyme.
- name: Loss of Urocanate Hydratase Activity
  biological_scale: MOLECULAR
  node_class: CATALYTIC_ACTIVITY
  description: >-
    Absent or non-functional urocanase in the hepatocyte cytosol. The enzyme
    normally hydrates trans-urocanate to an imidazolone-propanoate intermediate,
    the second step of histidine degradation.
  molecular_functions:
  - preferred_term: urocanate hydratase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016153
      label: urocanate hydratase activity
  cellular_components:
  - preferred_term: hepatocyte cytosol
    term:
      id: GO:0005829
      label: cytosol
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  notes: >-
    The modifier is LOSS_OF_FUNCTION rather than DECREASED deliberately: the
    reported alleles abolish catalysis rather than reduce a normally regulated
    activity, which is the qualitative case CLAUDE.md reserves the value for.
  evidence:
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urocanic aciduria is caused by a deficiency in the enzyme urocanase (E.C.
      4.2.1.49) encoded by the gene UROC1.
    explanation: States the enzyme defect that defines the disorder.
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The family of urocanases is highly conserved across multiple species and
      appears to be almost exclusively expressed in the liver
    explanation: >-
      Establishes the hepatic restriction that makes the hepatocyte the site of
      the block. Quoted from the paper's introduction, where it restates
      established expression data rather than a result of this study.
  downstream:
  - target: Hepatic Block of Histidine Catabolism
    causal_link_type: DIRECT
    description: >-
      With the second step absent, flux from histidine to glutamate cannot
      proceed past urocanate.
    evidence:
    - reference: PMID:30619714
      reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        urocanic aciduria is caused by defects in urocanase, which catalyzes the
        conversion of urocanic acid to imidazolonepropionic acid
      explanation: >-
        Names the blocked reaction, placing the lesion at the second step of the
        pathway.
- name: Hepatic Block of Histidine Catabolism
  biological_scale: CELLULAR
  node_class: METABOLIC_FLUX_BLOCK
  description: >-
    The histidine degradation route is interrupted at its second step. Histidine
    ammonia-lyase upstream continues to deaminate histidine to urocanate, so the
    block is a substrate trap rather than a simple loss of product.
  biological_processes:
  - preferred_term: L-histidine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006548
      label: L-histidine catabolic process
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
    reference_title: "UROC1 / urocanic aciduria (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism for disease is biallelic loss of function, with loss of
      enzyme activity resulting in a buildup of the prior metabolite in the
      histidine metabolic pathway, urocanic acid.
    explanation: >-
      ClinGen states the mechanism as a substrate buildup behind the enzyme
      block.
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, histidine levels were found to be within normal limits in all
      samples.
    explanation: >-
      The block does not back up to histidine. Measured directly in both
      biallelic siblings, in plasma and urine, which is why no causal edge runs
      from this node to a histidine elevation.
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a single, isolated defect without significant inhibition or enrichment of
      alternate pathways
    explanation: >-
      The authors' own characterisation of the lesion, which is what makes this
      node the end of the metabolic branch rather than the start of a wider
      derangement.
  downstream:
  - target: Urocanate Accumulation
    causal_link_type: DIRECT
    description: >-
      Urocanate produced upstream has no onward route and accumulates.
    evidence:
    - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
      reference_title: "UROC1 / urocanic aciduria (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        loss of enzyme activity resulting in a buildup of the prior metabolite
        in the histidine metabolic pathway, urocanic acid
      explanation: Names urocanic acid as the metabolite that accumulates.
- name: Urocanate Accumulation
  biological_scale: ORGANISM
  node_class: METABOLITE_ACCUMULATION
  description: >-
    Urocanate accumulates in hepatocytes and is released into the circulation
    and filtered into urine, producing the urocanic aciduria for which the
    disorder is named. This is the demonstrated and obligate consequence of the
    enzyme block.
  chemical_entities:
  - preferred_term: trans-urocanic acid
    modifier: INCREASED
    term:
      id: CHEBI:17771
      label: trans-urocanate
  - preferred_term: cis-urocanic acid
    modifier: INCREASED
    term:
      id: CHEBI:30819
      label: cis-urocanate
  notes: >-
    The metabolomic signature reported in PMID:30619714 is three compounds -
    "significantly elevated trans-urocanic acid, cis-urocanic acid and
    imidazole propionate". The first two are bound. Imidazole propionate is
    deliberately not bound: the paper gives no structure or identifier for it,
    and the name maps to several distinct CHEBI entries (CHEBI:27384
    3-(4-oxo-4,5-dihydro-1H-imidazol-5-yl)propanoic acid, which is the
    urocanase product and so should fall rather than rise behind this block;
    CHEBI:73087 dihydrourocanic acid; CHEBI:156055
    3-(1H-imidazol-1-yl)propanoic acid). Binding one would assert an identity
    the source does not give, so the compound is named in the quoted evidence
    and left unbound.
  evidence:
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two phenotypically normal siblings with compound
      heterozygous pathogenic variants in UROC1 and characteristic biochemical
      evidence of urocanase deficiency collected utilizing untargeted
      metabolomic analysis.
    explanation: >-
      The biochemical phenotype is present in biallelic individuals, and is
      present even when no clinical phenotype is.
  downstream:
  - target: Elevated urinary urocanic acid
    causal_link_type: DIRECT
    description: >-
      Circulating urocanate is filtered and appears in urine, where it is
      detected by organic-acid screening or untargeted metabolomics.
    evidence:
    - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
      reference_title: "UROC1 / urocanic aciduria (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        One family was asymptomatic except for the characteristic urocanic
        aciduria
      explanation: >-
        Names the urinary finding as the characteristic, and in that family the
        only, manifestation.
phenotypes:
- name: Elevated urinary urocanic acid
  category: Biochemical
  description: >-
    Excretion of urocanic acid in urine, the defining and obligate laboratory
    finding. Detected historically by urine paper chromatography on newborn
    screening specimens and now by untargeted metabolomic analysis of urine and
    plasma.
  phenotype_term:
    preferred_term: Elevated urinary urocanic acid
    term:
      id: HP:0033354
      label: Abnormal urine metabolite level
  notes: >-
    Bound to the general concept because HPO has no urocanate-specific term.
    Searching the HP label cache for "urine metabolite", "aminoaciduria" and
    "organic aciduria" returns HP:0001992 Organic aciduria, HP:0003355
    Aminoaciduria and relatives, none of which names urocanic acid; HP:0033354
    Abnormal urine metabolite level is the nearest accurate parent. The
    specificity is carried in preferred_term. The deep-research report offered
    HP:0033354 under the label "Elevated plasma urocanate", which is not this
    term's label and was not used.
  evidence:
  - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
    reference_title: "UROC1 / urocanic aciduria (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One family was asymptomatic except for the characteristic urocanic
      aciduria
    explanation: >-
      Establishes the urinary finding as the characteristic manifestation and as
      one that occurs without clinical features.
- name: Intellectual disability
  category: Clinical
  description: >-
    Reported in the ascertained probands through which the disorder entered the
    literature, including the 1971 index case and the 2009 proband in whom UROC1
    variants were first identified. Not attributed to the enzyme block here: no
    causal edge reaches this node, because the sources that report it decline to
    make that attribution and a biallelic sibpair with the same biochemical
    phenotype has normal cognition.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  notes: >-
    Ascertainment is the problem. Probands were found by screening the urine of
    children investigated for intellectual disability, so the association in the
    reported series cannot be separated from how the series was assembled.
  evidence:
  - reference: PMID:19304569
    reference_title: Mutations in the urocanase gene UROC1 are associated with urocanic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in a girl with urocanic aciduria presenting with mental retardation and
      intermittent ataxia
    explanation: >-
      Reports the feature in the proband in whom UROC1 variants were first
      identified. Supports that the feature was observed in this proband, not
      that the enzyme block caused it.
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that urocanic aciduria may represent an otherwise
      benign biochemical phenotype and that those individuals with concurrent
      developmental delay should continue to be evaluated for other underlying
      causes for their symptoms.
    explanation: >-
      Contradicts intellectual disability as a feature of the disorder itself,
      on the basis of biallelic siblings with the biochemical phenotype and
      normal development.
- name: Ataxia
  category: Clinical
  description: >-
    Intermittent ataxia was reported in the 2009 proband. As with intellectual
    disability, it is recorded as observed in an ascertained proband and is not
    wired to the mechanism.
  phenotype_term:
    preferred_term: Intermittent ataxia
    term:
      id: HP:0001251
      label: Ataxia
  notes: >-
    HP:0001251 Ataxia is bound and the intermittent course is carried in
    preferred_term and the description, because no more specific HPO term for an
    intermittent ataxia of this kind was read from a source here. Reported in a
    single proband.
  evidence:
  - reference: PMID:19304569
    reference_title: Mutations in the urocanase gene UROC1 are associated with urocanic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presenting with mental retardation and intermittent ataxia
    explanation: >-
      Reports intermittent ataxia in the proband in whom UROC1 variants were
      first identified.

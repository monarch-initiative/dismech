      those individuals with concurrent developmental delay should continue to
      be evaluated for other underlying causes for their symptoms
    explanation: >-
      States the counselling and diagnostic consequence of a biallelic UROC1
      result in a patient with developmental delay.
  notes: >-
    No disease-directed treatment is recorded. No dietary histidine restriction,
    supplement or other intervention for urocanase deficiency was found in the
    sources read here, and none is asserted. This is an absence of recorded
    evidence rather than a statement that no therapy exists.
discussions:
- discussion_id: uroc1_neurological_attribution
  kind: CONTROVERSY
  attaches_to:
  - phenotypes#Intellectual disability
  - phenotypes#Ataxia
  prompt: >-
    Does biallelic UROC1 loss of function cause a neurological phenotype, or is
    urocanic aciduria a benign biochemical phenotype whose association with
    intellectual disability is an artefact of how probands were ascertained?
  rationale: >-
    The two published positions are explicit and in conflict. The disorder was
    described from 1971 onward in probands investigated for intellectual
    disability, and OMIM still carries the synonym "encephalopathy due to
    urocanase deficiency"; the 2009 report that first identified UROC1 variants
    describes a proband with intellectual disability and intermittent ataxia.
    Against that, two compound-heterozygous siblings with the characteristic
    biochemical abnormality are reported as phenotypically normal, the 1971
    index patient is noted to have had tuberculous meningitis at 19 months with
    residual hemiplegia and seizures, and ClinGen states that the relationship
    of the reported phenotypes to the biochemical abnormality is unclear while
    classifying the pair Limited. The question matters for interpretation: a
    biallelic UROC1 result in a child with developmental delay is either a
    diagnosis or a distraction from one.
    One historical mechanism has already been argued down. Most work linking
    urocanic aciduria to developmental delay proposed altered folate metabolism
    as the route, and PMID:30619714 calls that explanation problematic on the
    grounds that glutamate formiminotransferase deficiency - a defect in
    tetrahydrofolate utilisation one step further down the same pathway -
    produces its own inconsistent phenotype. So the folate route is not
    available as a ready-made mechanism for the neurological features.
  evidence:
  - reference: CGGV:assertion_af2ff293-39ce-46b7-af58-01e3685f4334-2026-04-10T160000.000Z
    reference_title: "UROC1 / urocanic aciduria (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There have been a variety of phenotypes reported in association with
      urocanic aciduria, including intellectual disability and developmental
      delay, however the relationship of these phenotypes to the biochemical
      abnormality is unclear.
    explanation: >-
      ClinGen states the open question in its own words, which is why it is
      carried as a controversy rather than resolved in either direction.
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urocanic aciduria has been described in association with varying degrees
      of intellectual disability, though from very early on, this association
      has been somewhat tenuous
    explanation: >-
      The authors characterise the historical association as tenuous, framing
      the disagreement this discussion records.
- discussion_id: urocanate_downstream_effect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Urocanate Accumulation
  prompt: >-
    Is accumulated urocanate itself inert at the concentrations reached in
    urocanase deficiency, and is there any tissue in which it exerts an effect?
  rationale: >-
    The pathograph here stops at metabolite accumulation, and nothing in the
    sources read establishes a downstream consequence of that accumulation.
    Resolving the controversy above in either direction requires knowing whether
    urocanate has an effect anywhere at the concentrations biallelic individuals
    reach, which would need unbiased ascertainment of biallelic individuals with
    systematic neurological assessment rather than further case reports from
    cohorts selected for developmental delay.

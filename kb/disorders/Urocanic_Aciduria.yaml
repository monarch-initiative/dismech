name: Urocanic Aciduria
creation_date: "2026-11-20T14:20:00Z"
category: Mendelian
synonyms:
- urocanase deficiency
- urocanate hydratase deficiency
- UROC1 deficiency
- encephalopathy due to urocanase deficiency
- urocanic aciduria (disease)
description: >-
  Urocanic aciduria is an autosomal recessive block of the second step of
  histidine catabolism, caused by biallelic loss-of-function variants in UROC1,
  which encodes urocanate hydratase (urocanase, EC 4.2.1.49). Urocanase hydrates
  trans-urocanate to an imidazolone-propanoate intermediate in the cytosol of
  hepatocytes, and the enzyme is almost exclusively expressed in liver. When it
  is absent, urocanate produced by histidine ammonia-lyase upstream has no
  onward route, accumulates, and spills into urine and plasma. That biochemical
  phenotype is the obligate and well-established consequence of the enzyme
  block, and it is what the disease name describes.
  Whether the enzyme block produces a clinical phenotype is a separate and
  unsettled question, and this entry keeps the two apart. The disorder entered
  the literature in 1971 through a proband investigated for intellectual
  disability whose liver urocanase activity was deficient, and the first UROC1
  variants were reported in 2009 in a girl with intellectual disability and
  intermittent ataxia. The OMIM synonym "encephalopathy due to urocanase
  deficiency" preserves that reading. It has since been undermined from the
  other direction: two compound-heterozygous siblings with the characteristic
  biochemical abnormality were reported as phenotypically normal, one of them
  with a general cognitive score in the 83rd percentile, and the authors
  concluded that urocanic aciduria may be an otherwise benign biochemical
  phenotype whose carriers with developmental delay should still be worked up
  for another cause. ClinGen's Aminoacidopathy expert panel, re-evaluating the
  pair in 2026, classifies UROC1 for urocanic aciduria as Limited and states
  directly that the relationship of the reported neurological phenotypes to the
  biochemical abnormality is unclear. The entry therefore records the metabolite
  phenotype as demonstrated, records the neurological features as reported in
  ascertained probands without asserting a causal edge to them, and carries the
  attribution question as a discussion.
notes: >-
  Scope. This entry is anchored on MONDO:0010167 / OMIM 276880, the UROC1
  enzymopathy. The wider biology of urocanic acid - in particular its role as a
  UV-absorbing chromophore in skin, where cis-urocanic acid formed by
  photoisomerisation acts as an immunomodulator - is a large and separate
  literature that has nothing to do with this disease, and is not drawn on here.
  Searching the knowledge base for "urocanic" returns two ichthyosis entries for
  exactly that cutaneous reason; neither concerns UROC1.
  Why no causal edge reaches intellectual disability or ataxia. Writing one
  would assert what the cited sources decline to assert. Four reported probands
  carry UROC1 variants; one sibpair with the same biochemical phenotype is
  phenotypically normal; the 1971 index patient had tuberculous meningitis at 19
  months with residual hemiplegia and seizures, which PMID:30619714 names as a
  confound; and ClinGen states the relationship is unclear. The phenotype rows
  for intellectual disability and ataxia are therefore present, because they are
  what the probands were reported with, but they are not wired to the mechanism
  and each row says why.
  No GeneReviews chapter. Checked offline against the committed Bookshelf index
  (cache/bookshelf/genereviews.csv, snapshot 2026-09-10, 958 chapters) for
  "urocan", "histidin" and "UROC1": no current or retired chapter matches, and
  no gene-scoped UROC1 chapter exists. There is likewise no StatPearls article,
  which would not be a baseline in any case. Phenotype content here therefore
  comes from the primary reports rather than from a chapter.
  Histidine is not elevated, and the block is isolated. An earlier draft of this
  entry carried a "Secondary Histidine Elevation" node, inferred from the order
  of the pathway: urocanate accumulates, so histidine should back up behind
  histidine ammonia-lyase. PMID:30619714 measured it and it does not -
  "Notably, histidine levels were found to be within normal limits in all
  samples" - and the same paper reports normal plasma amino acids in its first
  case and concludes the lesion is "a single, isolated defect without
  significant inhibition or enrichment of alternate pathways". The node and its
  edge were removed and the measurement is now curated as a positive finding on
  the block itself. The inference came from the deep-research report's
  mechanistic model, which is also where the wrong HP:0500152 label came from
  (that identifier is Hypocystinemia, not Hyperhistidinaemia; confirmed against
  OLS on 2026-11-20). HPO has no hyperhistidinaemia term in any case: searching
  the HP label cache for "histidin" returns nothing.
  Deep-research provenance. The OpenScientist report in
  research/Urocanic_Aciduria-deep-research-openscientist.md assembled four
  further lines of argument that the biochemical phenotype is not accompanied by
  a clinical one: absence of loss-of-function constraint on UROC1 in gnomAD v4
  with pLoF homozygotes present, a common East Asian nonsense allele observed in
  the homozygous state, liver-restricted expression with near-absent brain
  expression in GTEx v8, and a viable, fertile IMPC Uroc1 knockout without a
  neurobehavioural phenotype. Those are database-derived findings rather than
  claims from a citable publication, and they were not independently re-derived
  in this curation session, so they are recorded here as deep-research output
  and are deliberately not used as evidence items. They agree with, and were not
  needed to reach, the position taken above.

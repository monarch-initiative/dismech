    relationship". The tier is copied from ClinGen into gene_disease_validity
    and the curator's reading is carried in the association slot and in the
    pathograph, which follows the treatment of other Limited-tier genes in this
    knowledge base.
    The tier moved recently. The committed cache/clingen/gene_validity.csv
    export of 2026-01-24 carries this pair as Moderate under SOP10
    (2024-04-26); the live export of 2026-11-20 carries it as Limited under
    SOP12 (2026-04-10). The Limited record is the one cited and cached here.
    A recurrent nonsense allele is reported, and this entry does not state its
    cDNA coordinate. ClinGen gives it as NM_144639.3(UROC1):c.855G>A
    (p.Trp285Ter); the deep-research report gives c.854G>A in its summary and
    c.855G>A in its mechanistic model. Both coordinates would produce a stop at
    Trp285, so the discrepancy cannot be resolved by inspection, and no
    coordinate is asserted rather than picking one.
diagnosis:
- name: Urine organic acid analysis
  description: >-
    Detection of urocanic acid in urine. Historically by paper chromatography
    with Pauly stain on newborn screening specimens; one reported proband was
    identified at 8 weeks of age by routine urine screening.
  evidence:
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine paper chromatography with special Pauly stain revealed a moderate
      amount of urocanic acid and unidentified related metabolites.
    explanation: Describes the historical detection method in a reported case.
- name: Untargeted metabolomic analysis
  description: >-
    Plasma and urine untargeted metabolomics identifies the signature
    perturbation of urocanase deficiency, and is the route by which
    biochemically affected but clinically normal individuals have been found.
  evidence:
  - reference: PMID:30619714
    reference_title: Untargeted metabolomics identifies unique though benign biochemical changes in patients with pathogenic variants in UROC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, global untargeted metabolomic analysis is able to identify
      signature metabolic perturbations in both plasma and urine which may aid
      in its future diagnosis.
    explanation: >-
      Establishes untargeted metabolomics as the current detection method.
treatments:

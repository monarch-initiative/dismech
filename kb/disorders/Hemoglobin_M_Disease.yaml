name: Hemoglobin M Disease, Beta Type
creation_date: "2026-11-05T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: hemoglobin M disease (beta-globin type)
  term:
    id: MONDO:0018023
    label: hemoglobin M disease
description: >
  Hemoglobin M disease, beta type (OMIM 617971, "methemoglobinemia, beta type")
  is a rare, autosomal dominant structural hemoglobinopathy caused by
  heterozygous germline missense variants in the beta-globin gene HBB that
  substitute a heme-coordinating residue of the beta-globin chain. The
  introduced residue (a tyrosine phenolate, or a glutamate carboxylate) bonds
  directly to the heme iron and stabilizes it in the oxidized ferric (Fe3+)
  state, so the mutant subunit is held as methemoglobin, which cannot
  reversibly bind oxygen and is resistant to reduction by the physiological
  cytochrome b5 reductase system and by therapeutic reducing agents (methylene
  blue, vitamin C). The clinical picture is lifelong central cyanosis with
  chocolate-brown blood and a pulse-oximetry "saturation gap", and the disorder
  is otherwise benign in most patients. Because beta-globin is absent from fetal
  hemoglobin, cyanosis in the beta type appears only after the perinatal
  fetal-to-adult (gamma-to-beta) hemoglobin switch, at roughly 3 to 6 months of
  age -- a pediatric timing that distinguishes it from the alpha-globin variants
  (symptomatic from birth) and the transient neonatal gamma-globin M-hemoglobins.
  The best-characterised beta variants fall into two mechanistic classes: distal
  (E7) histidine substitutions such as Hb M-Saskatoon (HBB:c.190C>T, beta63
  His>Tyr), which stabilize the deoxy (T) quaternary state and lower the oxygen
  affinity of the normal subunits, and proximal (F8) histidine substitutions
  such as Hb M-Hyde Park/Akita (beta92 His>Tyr, codon 92 CAC>TAC), which raise
  oxygen affinity, abolish cooperativity, and yield an unstable hemoglobin with
  mild hemolysis.
  SCOPE NOTE: this entry covers the HBB (beta-globin) form only. MONDO:0018023
  carries the broad label "hemoglobin M disease" and Orphanet (ORPHA:330041)
  lists HBA1, HBA2 and HBB as causal genes, but MONDO:0018023 is equivalentTo
  OMIM:617971 ("methemoglobinemia, beta type"), and ClinGen curates the HBB
  gene-disease relationship against this exact MONDO identifier (Definitive,
  autosomal dominant). The alpha-globin form is a separate concept
  (MONDO:0020835, methemoglobinemia alpha type, OMIM:617973; ClinGen Limited for
  HBA1/HBA2). The gamma-globin M-hemoglobins (e.g. Hb F-M-Fort Ripley) are
  transient neonatal and are curated in Cyanosis_Transient_Neonatal
  (MONDO:0013511). See the lump/split note below.

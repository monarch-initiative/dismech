    snippet: "Methemoglobinemia caused by hemoglobin M variants is a rare inherited hemoglobinopathy characterized by lifelong cyanosis and discordant oxygen measurements."
    explanation: Documents the discordant (saturation-gap) oxygen measurements characteristic of Hb M variants.

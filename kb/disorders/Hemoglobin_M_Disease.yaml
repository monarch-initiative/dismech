- category: Phenotype
  name: Saturation gap
  diagnostic: true
  description: >
    A discordance between a low pulse-oximetry oxygen saturation and a normal or
    high arterial oxygen tension, produced by methemoglobin's abnormal light
    absorption. It is the diagnostic hallmark that separates Hb M disease from
    true cardiopulmonary hypoxemia.
  phenotype_term:

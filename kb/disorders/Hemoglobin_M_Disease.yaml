  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: ORPHA:330041
      reference_title: "Hemoglobin M disease"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A rare hemoglobinopathy characterized by the presence of hemoglobin variants with structural abnormalities in the globin portion of the molecule which lead to auto-oxidation of heme iron, resulting in methemoglobinemia."
      explanation: Orphanet classifies this as a hemoglobinopathy, placing it in the hematology chapter.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    A single HBB allele carrying a heme-pocket missense variant produces an
    abnormal, dysfunctional hemoglobin that perturbs the tetramer, so the
    disease is dominant. Affected individuals are heterozygous; the homozygous
    beta state is not described and is thought to be incompatible with life.
    Variants arise by inheritance (vertical transmission with complete
    penetrance for the cyanosis phenotype) or de novo.
  evidence:
  - reference: PMID:26494721
    reference_title: "HbM methaemoglobinaemia as a rare case of early neonatal benign cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital methaemoglobinaemia due to haemoglobin M is an autosomal dominant disorder characterised by lifelong cyanosis."
    explanation: Establishes autosomal dominant inheritance and lifelong cyanosis for hemoglobin M disease.
  - reference: PMID:42381511
    reference_title: "Methaemoglobinaemia: From pathophysiology to contemporary clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Homozygous HbM has not been described and is probably not compatible with life, causing in utero death (α‐ and γ‐globin variants) or death in the first year of life (β‐globin variants)."
    explanation: Supports that affected individuals are heterozygous and the homozygous state is not viable.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >
    Ultra-rare; described only in isolated case reports and small kindreds, so
    no population prevalence or incidence estimate exists. Individual beta
    variants are private/family-level: Hb M-Saskatoon has been reported in fewer
    than ten cases worldwide.
  evidence:
  - reference: PMID:41116143
    reference_title: "The first Chinese hb m-saskatoon [HBB: c.190 c > t p.His64Tyr] case with low oxygen saturation in 50-year-old women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation has been reported worldwide in fewer than ten cases."
    explanation: Documents the ultra-rarity of the prototypical beta variant Hb M-Saskatoon.
genetic:
- name: HBB
  gene_term:
    preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_1165f12f-3e9d-41c6-b7c4-1a52037cf017-2024-03-28T160000.000Z
    evidence:
    - reference: CGGV:assertion_1165f12f-3e9d-41c6-b7c4-1a52037cf017-2024-03-28T160000.000Z
      reference_title: "HBB / hemoglobin M disease (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HBB | HGNC:4827 | hemoglobin M disease | MONDO:0018023 | AD | Definitive"
      explanation: ClinGen classifies the HBB-hemoglobin M disease relationship as Definitive (autosomal dominant) against this entry's disease_term.
  notes: >
    Heterozygous germline missense variants substituting a heme-contact residue
    of the beta-globin chain. Reported beta alleles fall into a distal (E7)
    histidine class (Hb M-Saskatoon, beta63 His>Tyr) and a proximal (F8)
    histidine class (Hb M-Hyde Park/Akita/Milwaukee-2, beta92 His>Tyr), with
    Hb M-Milwaukee-1 (beta67 Val>Glu, E11 pocket) and Hb Tubingen (beta106
    Leu>Gln) as further alleles. ClinGen records the mechanism as neomorphic
    (gain of a novel property: stabilization of the ferric state), not classical
    loss of function.
  variants:
  - name: Hb M-Saskatoon
    description: >
      HBB:c.190C>T, p.His64Tyr (beta63(E7) His>Tyr), the distal histidine. The
      introduced tyrosine stabilizes ferric heme and the deoxy (T) quaternary
      state. The prototypical beta distal Hb M variant.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41881274
      reference_title: "A laboratory puzzle in a \"blue\" adolescent: Cyanosis, discordant oxygen measurements, and interference in leukocyte differential analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hemoglobin electrophoresis and whole-genome sequencing identified a heterozygous HBB:c.190C > T (p.His64Tyr) mutation, confirming the diagnosis of Hb M Saskatoon-associated methemoglobinemia."
      explanation: Confirms the HBB genotype of Hb M-Saskatoon in a patient.
  - name: Hb M-Hyde Park
    description: >
      beta92(F8) His>Tyr (codon 92 CAC>TAC), the proximal histidine; also known
      as Hb M-Akita and Hb M-Milwaukee-2. Yields an unstable hemoglobin with
      raised oxygen affinity, loss of cooperativity, and mild hemolysis.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28096792
      reference_title: "First reported case of Haemoglobin-M Hyde Park in a Malay family living in Malaysia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hb-M Hyde Park, also known as Hb-M Akita is a rare type of hereditary Hb M due to autosomal dominant mutation of CAC>TAC on codon 92 of β globin gene resulting in the replacement of histidine by tyrosine on β globin chain."
      explanation: Establishes the HBB codon 92 proximal-histidine genotype of Hb M-Hyde Park.
    - reference: PMID:9494043
      reference_title: "DNA sequence analysis proves Hb M-Milwaukee-2 is due to beta-globin gene codon 92 (CAC-->TAC), the presumed mutation of Hb M-Hyde Park and Hb M-Akita."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation is identical with that presumed to be the cause of Hb M-Hyde Park and Hb M-Akita."
      explanation: Confirms that Hb M-Hyde Park, Hb M-Akita and Hb M-Milwaukee-2 share the codon 92 beta-globin mutation.
pathophysiology:
- name: HBB Heme-Pocket Missense Substitution
  biological_scale: MOLECULAR
  description: >
    A heterozygous germline HBB missense variant substitutes a residue that
    coordinates the heme iron of the beta-globin chain -- most commonly the
    distal (E7) or proximal (F8) histidine, replaced by tyrosine, or the E11
    valine replaced by glutamate. The introduced side chain forms a direct bond
    to the heme iron. This is a neomorphic, dominant structural change rather
    than loss of function.
  genes:
  - preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  genetic_context:
    gene:
      preferred_term: HBB
      term:
        id: hgnc:4827
        label: HBB
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: NEOMORPHIC
    description: >
      Heterozygous germline missense variant in a heme-contact residue of
      beta-globin, recorded as NEOMORPHIC because the mutant chain still
      assembles into hemoglobin but confers a novel deleterious property --
      stabilization of the ferric heme state -- absent from wild-type.
  downstream:
  - target: Ferric Heme Iron Stabilization
    causal_link_type: DIRECT
    description: >
      The substituted side chain bonds directly to the heme iron, holding it in
      the oxidized ferric state.
    evidence:
    - reference: PMID:4521212
      reference_title: "Structure of hemoglobin M Boston, a variant with a five-coordinated ferric heme."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "the ferric iron atoms in the abnormal alpha subunits are bonded to the phenolate side chains of the tyrosines that have replaced the distal histidines"
      explanation: X-ray structure of the alpha-chain distal prototype (Hb M-Boston) demonstrates the ferric-phenolate bond mechanism shared by the beta distal variant Hb M-Saskatoon; INDIRECT because the crystallographic proof is on the alpha analog.
  evidence:
  - reference: CGGV:assertion_1165f12f-3e9d-41c6-b7c4-1a52037cf017-2024-03-28T160000.000Z
    reference_title: "HBB / hemoglobin M disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These amino acid substitutions in the heme binding pocket cause structural alterations which stabilize the ferric state, resulting in extremely low oxygen affinity and resistance to reduction."
    explanation: ClinGen summary establishes the heme-pocket substitution mechanism for the HBB variants.
  - reference: CGGV:assertion_1165f12f-3e9d-41c6-b7c4-1a52037cf017-2024-03-28T160000.000Z
    reference_title: "HBB / hemoglobin M disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hemoglobin M variants have altered function, suggesting a neomorphic mechanism of pathogenicity, due to increased stabilization of the ferric state."
    explanation: Supports the neomorphic functional_impact_category recorded on this node.
- name: Ferric Heme Iron Stabilization
  biological_scale: MOLECULAR
  description: >
    The mutant beta subunit is locked with its heme iron in the ferric (Fe3+)
    state, i.e. as methemoglobin, which cannot reversibly bind oxygen. From this
    shared lesion the beta variants branch by which heme-contact residue is
    affected, and the ferric lock is also resistant to the normal reductive
    pathway.
  molecular_functions:
  - preferred_term: oxygen carrier activity
    term:
      id: GO:0005344
      label: oxygen carrier activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: heme b
    term:
      id: CHEBI:30413
      label: heme
    modifier: ABNORMAL
  downstream:
  - target: Distal Histidine Substitution and T-State Stabilization
    causal_link_type: DIRECT
    description: In distal (E7) variants the ferric lock co-occurs with stabilization of the deoxy quaternary state.
  - target: Proximal Histidine Substitution and Hemoglobin Instability
    causal_link_type: DIRECT
    description: In proximal (F8) variants the ferric lock co-occurs with an unstable, high-affinity tetramer.
  - target: Resistance to Methemoglobin Reduction
    causal_link_type: DIRECT
    description: The structurally stabilized ferric heme resists enzymatic and pharmacologic reduction.
  evidence:
  - reference: PMID:28096792
    reference_title: "First reported case of Haemoglobin-M Hyde Park in a Malay family living in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hb M variants have a tendency to form metHb, produced by the oxidation of ferrous (Fe2+) in haem to ferric (Fe3+)."
    explanation: Supports stabilization of heme iron in the ferric (methemoglobin) state in Hb M variants.
- name: Distal Histidine Substitution and T-State Stabilization
  biological_scale: MOLECULAR
  description: >
    In distal (E7) histidine variants such as Hb M-Saskatoon (beta63 His>Tyr),
    the tyrosine-ferric bond and the resulting tertiary change stabilize the
    hemoglobin tetramer in the deoxy (T) quaternary state, which lowers the
    oxygen affinity of the remaining normal subunits.
  molecular_functions:
  - preferred_term: oxygen carrier activity
    term:
      id: GO:0005344
      label: oxygen carrier activity
    modifier: DECREASED
  downstream:
  - target: Persistent Circulating Methemoglobin and Reduced Oxygen Delivery
    causal_link_type: DIRECT
    description: The distal class contributes a persistent methemoglobin fraction with lowered whole-tetramer oxygen affinity.
  evidence:
  - reference: PMID:4521212
    reference_title: "Structure of hemoglobin M Boston, a variant with a five-coordinated ferric heme."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The resulting changes in tertiary structure of the alpha subunits stabilize the hemoglobin tetramer in the quaternary deoxy structure, which lowers the oxygen affinity of the normal beta subunits and causes cyanosis."
    explanation: Demonstrates the distal-class T-state mechanism in the alpha prototype Hb M-Boston; INDIRECT for the beta distal variant Hb M-Saskatoon.
  - reference: PMID:3994720
    reference_title: "Hemoglobin M: effect of the proximal or distal histidine replacement on circular dichroism in the visible region."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the proximal histidine replaced Hbs M (Hb M Iwate and Hb M Hyde Park) showed considerably different CD spectra from those of the distal histidine replaced ones (Hb M Boston and Hb M Saskatoon)."
    explanation: Separates the distal class (including Hb M-Saskatoon) from the proximal class structurally.
- name: Proximal Histidine Substitution and Hemoglobin Instability
  biological_scale: MOLECULAR
  description: >
    In proximal (F8) histidine variants such as Hb M-Hyde Park (beta92 His>Tyr),
    the substitution raises oxygen affinity roughly three- to four-fold, abolishes
    cooperativity, and yields an unstable hemoglobin. The instability drives
    mild hemolysis in addition to the ferric lock.
  molecular_functions:
  - preferred_term: oxygen carrier activity
    term:
      id: GO:0005344
      label: oxygen carrier activity
    modifier: INCREASED
  downstream:
  - target: Persistent Circulating Methemoglobin and Reduced Oxygen Delivery
    causal_link_type: DIRECT
    description: The proximal class also carries a persistent methemoglobin fraction.
  - target: Hemolytic anemia
    causal_link_type: DIRECT
    description: Instability of the proximal-variant hemoglobin precipitates mild hemolysis.
  evidence:
  - reference: PMID:7390859
    reference_title: "Further studies on the functional properties of hemoglobin M Hyde Park."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The oxygen binding property of Hb M Hyde Park is characterized by 3 to 4 times higher oxygen affinity than that for normal hemoglobin, complete loss of cooperativity, and substantially preserved Bohr effect."
    explanation: Quantifies the raised oxygen affinity and loss of cooperativity of the proximal beta92 variant.
  - reference: PMID:28096792
    reference_title: "First reported case of Haemoglobin-M Hyde Park in a Malay family living in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The carriers of Hb-M Hyde Park usually presented with cyanosis and mild haemolysis"
    explanation: Links the proximal variant to mild hemolysis in carriers.
- name: Resistance to Methemoglobin Reduction
  biological_scale: MOLECULAR
  description: >
    The structurally stabilized ferric heme of the mutant beta subunit resists
    reduction both by the physiological NADH-cytochrome b5 reductase system and
    by therapeutic reducing agents (methylene blue, vitamin C). This is the key
    mechanistic distinction from the enzymatic (CYB5R3) and acquired forms of
    methemoglobinemia, in which methylene blue is effective.
  downstream:
  - target: Persistent Circulating Methemoglobin and Reduced Oxygen Delivery
    causal_link_type: DIRECT
    description: Because the ferric lock cannot be reversed, the methemoglobin fraction persists.
  evidence:
  - reference: PMID:42381511
    reference_title: "Methaemoglobinaemia: From pathophysiology to contemporary clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Methylene blue is ineffective at resolving cyanosis in patients with HbM disease due to structural changes in globin proteins."
    explanation: Establishes that the structural ferric lock resists reduction by methylene blue.
  - reference: PMID:42381511
    reference_title: "Methaemoglobinaemia: From pathophysiology to contemporary clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These structural changes also prevent CytB5R from effectively reducing MetHb, producing persistent methaemoglobinaemia."
    explanation: Supports resistance to the physiological cytochrome b5 reductase system.
- name: Persistent Circulating Methemoglobin and Reduced Oxygen Delivery
  biological_scale: ORGANISM
  description: >
    A persistent circulating methemoglobin fraction (typically ~10-35% in
    heterozygotes) reduces effective oxygen-carrying capacity and gives the blood
    its characteristic dark colour, producing lifelong central cyanosis and a
    pulse-oximetry saturation gap that is clinically benign in most patients.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
    description: Circulating methemoglobin produces central cyanosis once it reaches roughly 15% of total hemoglobin.
  - target: Methemoglobinemia
    causal_link_type: DIRECT
    description: The persistent ferric-locked fraction is the methemoglobinemia itself.
  - target: Chocolate brown blood
    causal_link_type: DIRECT
    description: Methemoglobin gives circulating blood a dark chocolate-brown colour.
  - target: Saturation gap
    causal_link_type: DIRECT
    description: Methemoglobin's abnormal light absorption lowers pulse-oximetry readings while arterial oxygen tension is normal.
  evidence:
  - reference: PMID:3537620
    reference_title: "Drug- and chemical-induced methaemoglobinaemia. Clinical features and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It has an intense dark blue colour; thus, clinical cyanosis becomes apparent at a concentration of about 15%."
    explanation: Supports the threshold at which circulating methemoglobin produces visible cyanosis.

    unstable hemoglobin, adding mild hemolysis to the cyanosis.
diagnosis:
- name: Co-oximetry and arterial blood gas
  diagnosis_term:
    preferred_term: clinical laboratory test
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >
    Co-oximetry quantifies the elevated methemoglobin fraction, and a normal
    arterial oxygen tension alongside a low pulse-oximetry saturation establishes
    the saturation gap. Chocolate-brown blood is a visual clue.
  evidence:
  - reference: PMID:41988351
    reference_title: "Saturation Gap During Anesthesia in Glucose-6-Phosphate Dehydrogenase Deficiency and Methemoglobinemia: A Case Report and Review of Perioperative Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methemoglobinemia results from the oxidation of hemoglobin iron to the ferric state, impairing oxygen delivery and altering light absorption, often leading to falsely low oxygen saturation values."
    explanation: Supports co-oximetry/saturation-gap recognition as the diagnostic approach.
- name: Hemoglobin electrophoresis, HPLC and isoelectric focusing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Globin studies detect the abnormal band, but can mislead: some Hb M variants
    are electrophoretically silent, and Hb Tubingen co-migrates with Hb F,
    falsely elevating the apparent HbF fraction unless corrected by HPLC.
  evidence:
  - reference: PMID:41918241
    reference_title: "Molecular and Clinical Characterization of the Hb Tübingen [β106(G8) Leu→ Gln, HBB: c.320 T>A] Associated With Congenital Methemoglobinemia in a Chinese Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this was proven to be a false elevation, as HPLC analysis demonstrated normal γ‐globin chain levels, indicating that the observed band was indeed Hb Tübingen comigrating with Hb F."
    explanation: Documents the electrophoretic co-migration pitfall corrected by HPLC.
- name: HBB molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    Sequencing of HBB (Sanger, whole-exome or whole-genome) is the definitive
    test, identifying the heme-pocket missense variant.
  evidence:
  - reference: PMID:41116143
    reference_title: "The first Chinese hb m-saskatoon [HBB: c.190 c > t p.His64Tyr] case with low oxygen saturation in 50-year-old women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene sequencing revealed that the missense mutation is located in the HBB gene (HBB: c.190 C > T p."
    explanation: Confirms HBB sequencing as the definitive diagnostic test.
differential_diagnoses:
- name: Recessive congenital methemoglobinemia (CYB5R3/CYB5A)
  disease_term:
    preferred_term: hereditary methemoglobinemia
    term:
      id: MONDO:0018963
      label: hereditary methemoglobinemia
  description: >
    The enzymatic form of congenital methemoglobinemia is autosomal recessive,
    caused by biallelic CYB5R3 (or CYB5A) variants, and -- unlike structural
    Hb M disease -- its methemoglobin is reducible, so cyanosis responds to
    methylene blue. Curated in Hereditary_Methemoglobinemia.
  distinguishing_features:
  - Autosomal recessive inheritance with biallelic CYB5R3/CYB5A variants, not a dominant HBB variant
  - Methemoglobin reducible by methylene blue, in contrast to the structural ferric lock of Hb M disease
  - Normal globin studies; the defect is enzymatic, not a structural hemoglobin variant
- name: Drug-induced methemoglobinemia
  disease_term:
    preferred_term: drug-induced methemoglobinemia
    term:
      id: MONDO:0018740
      label: drug-induced methemoglobinemia
  description: >
    Acquired methemoglobinemia follows exposure to oxidizing drugs or chemicals
    (benzocaine, dapsone, nitrites) and is methylene-blue responsive. It is
    acute/subacute and lacks the lifelong, congenital, dominantly inherited
    course of Hb M disease.
  distinguishing_features:
  - History of oxidant exposure with resolution after removal of the agent
  - Acute or subacute onset rather than lifelong congenital cyanosis
  - Methylene blue effective, unlike the structural Hb M fraction
- name: Transient neonatal cyanosis (gamma-globin M-hemoglobins)
  disease_term:
    preferred_term: cyanosis, transient neonatal
    term:
      id: MONDO:0013511
      label: cyanosis, transient neonatal
  description: >
    Gamma-globin M-hemoglobins (e.g. Hb F-M-Fort Ripley) cause neonatal cyanosis
    present from birth that resolves within the first months of life as fetal
    gamma-globin is replaced -- the opposite onset timing from the beta type,
    whose cyanosis appears only after the switch. Curated in
    Cyanosis_Transient_Neonatal.
  distinguishing_features:
  - Cyanosis present at birth and self-limited, versus beta-type onset after 3-6 months
  - Causal variant in the fetal gamma-globin gene HBG2, not HBB
- name: Congenital cyanotic heart disease
  description: >
    Cyanotic congenital heart disease is the most common misdiagnosis, especially
    in neonates. It is distinguished by a normal arterial oxygen tension and
    elevated methemoglobin in Hb M disease, and by normal echocardiography.
  distinguishing_features:
  - Normal cardiac anatomy on echocardiography
  - Normal arterial oxygen tension with elevated methemoglobin (saturation gap)
treatments:
- name: Observation and supportive care
  description: >
    Most patients require no specific treatment: the cyanosis is benign and the
    structurally locked methemoglobin cannot be reduced pharmacologically.
    Methylene blue and vitamin C are ineffective for the structural Hb M fraction
    and should not be relied upon.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28096792
    reference_title: "First reported case of Haemoglobin-M Hyde Park in a Malay family living in Malaysia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No specific treatment is required as patients are relatively asymptomatic."
    explanation: Supports observation/supportive care as the usual management.
  - reference: PMID:39854759
    reference_title: "Three cases of hemoglobin M disease in a family lineage: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment of vitamin C or methylene blue was ineffective."
    explanation: Supports the ineffectiveness of reducing agents in Hb M disease.
- name: Avoidance of oxidizing agents and perioperative precautions
  description: >
    Because oxidant exposure raises the total methemoglobin burden on top of the
    structural baseline, oxidizing drugs (local/topical anesthetics, dapsone,
    nitrites) are avoided, and perioperative management uses co-oximetry rather
    than pulse-oximetry monitoring with preoperative recognition. This is the
    principal clinical intervention, since the realistic risk is iatrogenic.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39224766
    reference_title: "Management of Congenital Methemoglobinemia in the Perioperative Setting: A Case Report and Review of Current Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its management involves preoperative recognition and optimization,"
    explanation: Supports preoperative recognition as the core of perioperative management.
  - reference: PMID:38159101
    reference_title: "Anesthetic Management of a Patient With Hemoglobin M Disease Undergoing Laparoscopic Uterine Myomectomy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As such, close attention should be paid during anesthesia."
    explanation: Supports perioperative/anesthetic caution in Hb M disease.
- name: Genetic counseling
  description: >
    Autosomal dominant transmission carries a 50% recurrence risk per pregnancy;
    counseling emphasizes the benign prognosis and offers cascade HBB testing of
    relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26494721
    reference_title: "HbM methaemoglobinaemia as a rare case of early neonatal benign cyanosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital methaemoglobinaemia due to haemoglobin M is an autosomal dominant disorder characterised by lifelong cyanosis."
    explanation: Establishes the autosomal dominant transmission that genetic counseling addresses.
notes: >
  LUMP/SPLIT: This entry is curated as the beta-globin (HBB) form of hemoglobin M
  disease, bound to MONDO:0018023. The MONDO label "hemoglobin M disease" is a
  genus-level name (Orphanet ORPHA:330041 lists HBA1, HBA2 and HBB as causal
  genes), but MONDO:0018023 is equivalentTo OMIM:617971 "methemoglobinemia, beta
  type", and ClinGen curates the HBB gene-disease relationship against exactly
  this MONDO identifier (Definitive, autosomal dominant, CGGV assertion
  1165f12f). The alpha form has its own MONDO concept (MONDO:0020835,
  methemoglobinemia alpha type, OMIM:617973; ClinGen Limited for HBA1 and HBA2),
  and the gamma-globin M-hemoglobins are transient neonatal and are curated in
  Cyanosis_Transient_Neonatal (MONDO:0013511). The entry is named "Hemoglobin M
  Disease, Beta Type" rather than the bare MONDO label to keep the name's scope
  equal to the entry's (the bare label would also cover the alpha and gamma
  forms). The two beta mechanistic classes -- distal (Hb M-Saskatoon, T-state
  stabilization, low oxygen affinity) and proximal (Hb M-Hyde Park, unstable,
  high affinity, mild hemolysis) -- are carried as has_subtypes and as the
  pathophysiology branch point.
  BASELINE: No GeneReviews chapter exists for hemoglobin M disease. The nearest
  Bookshelf reference is a StatPearls chapter, "Methemoglobinemia" (NBK537317),
  which is a point-of-care reference and not a phenotype baseline; the phenotypes
  here are drawn from primary case reports and the Orphanet record.

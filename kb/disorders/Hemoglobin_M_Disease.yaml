mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020835
      label: methemoglobinemia, alpha type
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >
      The alpha-globin counterpart of hemoglobin M disease (OMIM:617973,
      HBA1/HBA2) is a distinct MONDO concept that MONDO splits from
      MONDO:0018023. relatedMatch, not close/exact, because the alpha and beta
      forms are deliberately separate OMIM phenotypes with different onset
      timing (alpha: from birth; beta: after the gamma-to-beta switch). Recorded
      to make the alpha/beta split explicit and auditable; this entry curates
      the beta (HBB) form only.
  - term:
      id: MONDO:0013511
      label: cyanosis, transient neonatal
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >
      The gamma-globin M-hemoglobins (e.g. Hb F-M-Fort Ripley, HBG2 Ggamma92
      His>Tyr) cause transient neonatal cyanosis that resolves as fetal
      gamma-globin is replaced; they are curated in Cyanosis_Transient_Neonatal
      (MONDO:0013511) rather than here. relatedMatch records the chain-split
      relationship without asserting subsumption.

name: Methylmalonic Acidemia With Homocystinuria, Type cblJ
creation_date: '2026-09-06T08:15:00Z'
category: Mendelian
disease_term:
  preferred_term: methylmalonic acidemia with homocystinuria, type cblJ
  term:
    id: MONDO:0013925
    label: methylmalonic acidemia with homocystinuria, type cblJ
synonyms:
- cblJ
- cobalamin J disease
- ABCD4 deficiency
- methylmalonic aciduria and homocystinuria, cblJ type
description: 'An inborn error of intracellular cobalamin handling caused by biallelic ABCD4 variants.
  Cobalamin enters the cell by receptor-mediated endocytosis and arrives in the lysosome still bound to
  its carrier. Getting it out of the lysosome and into the cytosol is a discrete transport step, and it
  is that step that fails here. ABCD4 is an ATP-binding cassette transporter that performs it in complex
  with LMBD1, the protein lost in the cblF defect.

  The disease sits at a branch point in cobalamin metabolism, which is what gives it its biochemical
  signature. Downstream of the lysosome, cobalamin is processed into two different cofactors for two
  different enzymes in two different compartments - adenosylcobalamin for mitochondrial
  methylmalonyl-CoA mutase, and methylcobalamin for cytosolic methionine synthase. A block upstream of
  that split starves both. So cblJ presents with methylmalonic acidemia and homocystinuria together,
  where a defect in either downstream arm alone would produce only one of them. That combined pattern
  is the diagnostic fingerprint of the lysosomal export defects and of the early cytosolic processing
  defects, and it is what places this disease alongside the cblC, cblD, cblF and cblE/cblG entries
  rather than alongside isolated methylmalonic acidemia.

  Two things about the evidence base are worth stating up front. cblJ is clinically and biochemically
  indistinguishable from cblF, its partner in the same transport complex, so the two were separated by
  complementation and sequencing rather than by phenotype. And the described clinical picture comes
  almost entirely from symptomatic probands - roughly ten reported patients in total - while the one
  patient found by newborn screening and treated presymptomatically has stayed asymptomatic and
  neurotypical. The severity recorded in the literature is therefore in part a statement about how
  patients were found.'
parents:
- Inborn Disorder of Cobalamin Metabolism and Transport
- Inborn Error of Metabolism
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: Ultra-rare. Six cases were reported in the literature as of the 2021 newborn-screening report,
    and roughly ten are described in total. No population rate has been established.
  evidence:
  - reference: PMID:33729671
    reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
      neurodevelopmental course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only six cases of CblJ have been reported in the literature.
    explanation: An ascertained case count at a point in time. It is a count of published patients, not
      a rate in any population, which is why the record is CASES_IN_LITERATURE.
pathophysiology:
- name: ABCD4 Variants Disabling the Lysosomal Cobalamin Exporter
  role: trigger
  biological_scale: MOLECULAR
  description: 'Biallelic loss-of-function variation in ABCD4, an ATP-binding cassette transporter.
    Notably, ABCD4 was assumed to be a peroxisomal protein until this disease was described - the
    subfamily assignment predicted peroxisomal localisation, and the disease is what showed it acts at
    the lysosome. Several reported variants alter the ATPase domain, which is the part of the transporter
    that would supply the energy for the export step.'
  genetic_context:
    gene:
      preferred_term: ABCD4
      term:
        id: hgnc:68
        label: ABCD4
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Reported patients are homozygous or compound heterozygous. Both missense variants in
      the ATPase domain and frameshift variants have been described, and the missense alleles are the
      mechanistically informative ones because they identify which part of the protein the function
      depends on.
  downstream:
  - target: Failure of the ABCD4-LMBD1 Complex at the Lysosomal Membrane
    causal_link_type: DIRECT
    description: The variants act by preventing the transporter from assembling with, or being targeted
      alongside, its partner protein.
  evidence:
  - reference: PMID:22922874
    reference_title: Mutations in ABCD4 cause a new inborn error of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using microcell-mediated chromosome transfer and exome sequencing, we identified causal
      mutations in ABCD4, a gene that codes for an ABC transporter, which was previously thought to have
      peroxisomal localization and function.
    explanation: The gene-disease assignment from the study that made it, and the statement that the
      protein's localisation was reassigned as a result.
  - reference: PMID:22922874
    reference_title: Mutations in ABCD4 cause a new inborn error of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, we show that mutations altering the putative ATPase domain of ABCD4 affect its
      function, suggesting that the ATPase activity of ABCD4 may be involved in intracellular processing
      of vitamin B12.
    explanation: Locates the functional defect at the ATPase domain. Note the authors' own hedging -
      "suggesting" and "may be involved" - which is preserved rather than firmed up in the node
      description.
- name: Failure of the ABCD4-LMBD1 Complex at the Lysosomal Membrane
  role: central_effector
  biological_scale: MOLECULAR
  description: 'ABCD4 does not work alone. It interacts selectively with LMBD1, and its delivery to the
    lysosome depends on that interaction - without LMBD1 co-expression, ABCD4 is not targeted correctly.
    Patient missense variants reduce the interaction directly, measured by live-cell FRET. This
    interdependence is the mechanistic explanation for something clinicians had already noticed: cblJ
    and cblF are indistinguishable at the bedside because they are two ways of breaking one complex.'
  genes:
  - preferred_term: ABCD4
    term:
      id: hgnc:68
      label: ABCD4
  - preferred_term: LMBRD1
    term:
      id: hgnc:23038
      label: LMBRD1
  cellular_components:
  - preferred_term: lysosomal membrane
    term:
      id: GO:0005765
      label: lysosomal membrane
  downstream:
  - target: Failure of Lysosomal Cobalamin Export to the Cytosol
    causal_link_type: DIRECT
    description: The complex is the exporter, so a complex that does not assemble or does not reach the
      lysosome cannot export.
  evidence:
  - reference: PMID:28572511
    reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
      vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using a sensitive live-cell FRET assay, we demonstrated selective interaction between ABCD4
      and LMBD1 and decreased interaction when ABCD4 harbored the patient mutations p.Arg432Gln or
      p.Asn141Lys or when artificial mutations disrupted the ATPase domain.
    explanation: The direct measurement that patient variants reduce the protein-protein interaction.
      This is the mechanistic core of the node, and it is measured in a heterologous live-cell system
      rather than in patient tissue.
  - reference: PMID:28572511
    reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
      vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, we showed that ABCD4 lysosomal targeting depends on co-expression of, and
      interaction with, LMBD1.
    explanation: Establishes the directional dependence - ABCD4 needs LMBD1 to reach the lysosome at all,
      which is a stronger claim than mere partnership.
  - reference: PMID:22922874
    reference_title: Mutations in ABCD4 cause a new inborn error of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results show that ABCD4 colocalizes with the lysosomal proteins LAMP1 and LMBD1, the
      latter of which is deficient in the cblF defect.
    explanation: The colocalisation evidence placing ABCD4 on the lysosome next to the cblF protein,
      which is what put the two diseases in the same mechanism.
- name: Failure of Lysosomal Cobalamin Export to the Cytosol
  role: central_effector
  biological_scale: CELLULAR
  description: 'Cobalamin taken up by the cell is trapped in the lysosome. Everything downstream is
    starved of substrate even though total cellular cobalamin may be normal or high, which is why the
    biochemistry of this disease looks like severe B12 deficiency in a patient whose serum B12 can be
    unremarkable. Free cobalamin accumulates in the lysosome rather than reaching the cytosolic
    processing enzymes.'
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  biological_processes:
  - preferred_term: cobalamin transport
    term:
      id: GO:0015889
      label: cobalamin transport
    modifier: DECREASED
  downstream:
  - target: Depletion of Both Cobalamin Cofactors
    causal_link_type: DIRECT
    description: The cytosolic processing that generates both cofactors cannot start on cobalamin that
      never leaves the lysosome.
  evidence:
  - reference: PMID:22922874
    reference_title: Mutations in ABCD4 cause a new inborn error of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a new disease that results in failure to release vitamin B12 from lysosomes,
      which mimics the cblF defect caused by LMBRD1 mutations.
    explanation: States the defining cellular lesion and, in the same sentence, the phenocopy
      relationship with cblF that this entry treats as a curation boundary question.
  - reference: PMID:28572511
    reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
      vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The integral membrane proteins LMBD1 and ABCD4 are required for lysosomal release of Cbl,
      and mutations in the genes LMBRD1 and ABCD4 result in the cobalamin metabolism disorders cblF and
      cblJ.
    explanation: States the transport step and assigns each gene to its complementation group.
- name: Depletion of Both Cobalamin Cofactors
  role: central_effector
  biological_scale: MOLECULAR
  description: 'Adenosylcobalamin and methylcobalamin are both reduced, because both are made from
    cytosolic cobalamin downstream of the failed export step. This simultaneous depletion is the branch
    point that produces the combined biochemical phenotype, and it is the reason a single transport
    defect looks like two different enzyme deficiencies at once.'
  chemical_entities:
  - preferred_term: adenosylcobalamin
    term:
      id: CHEBI:18408
      label: cobamamide
    modifier: DECREASED
  - preferred_term: methylcobalamin
    term:
      id: CHEBI:28115
      label: methylcobalamin
    modifier: DECREASED
  downstream:
  - target: Methylmalonyl-CoA Mutase Substrate Accumulation
    causal_link_type: DIRECT
    description: Adenosylcobalamin is the cofactor of methylmalonyl-CoA mutase, so its depletion blocks
      that reaction.
  - target: Methionine Synthase Failure
    causal_link_type: DIRECT
    description: Methylcobalamin is the cofactor of methionine synthase, so its depletion blocks that
      reaction.
  evidence:
  - reference: PMID:28572511
    reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
      vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cbl cofactor forms are decreased in fibroblasts from this patient but could be rescued by
      overexpression of either ABCD4 or, unexpectedly, LMBD1.
    explanation: The direct measurement of cofactor depletion in patient cells, together with the rescue
      that confirms it is caused by the transport defect. The cross-rescue by LMBD1 is the surprising
      part, and it supports the complex model asserted on the node above.
  - reference: PMID:28572511
    reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
      vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Vitamin B12 (cobalamin (Cbl)), in the cofactor forms methyl-Cbl and adenosyl-Cbl, is
      required for the function of the essential enzymes methionine synthase and methylmalonyl-CoA
      mutase, respectively.'
    explanation: States the cofactor-to-enzyme assignments on which both downstream edges of this node
      depend.
- name: Methylmalonyl-CoA Mutase Substrate Accumulation
  role: consequence
  biological_scale: MOLECULAR
  description: Without adenosylcobalamin, mitochondrial methylmalonyl-CoA mutase cannot convert
    methylmalonyl-CoA to succinyl-CoA. Methylmalonic acid accumulates and is excreted.
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
    modifier: DECREASED
  downstream:
  - target: Methylmalonic aciduria
    causal_link_type: DIRECT
    description: The accumulated acid is excreted, and is what the newborn screen and the urine organic
      acid profile detect.
- name: Methionine Synthase Failure
  role: consequence
  biological_scale: MOLECULAR
  description: Without methylcobalamin, cytosolic methionine synthase cannot remethylate homocysteine to
    methionine. Homocysteine accumulates and methionine synthesis falls, so this arm is a remethylation
    defect rather than a transsulfuration one.
  molecular_functions:
  - preferred_term: methionine synthase activity
    term:
      id: GO:0008705
      label: methionine synthase activity
    modifier: DECREASED
  downstream:
  - target: Homocystinuria
    causal_link_type: DIRECT
    description: Accumulated homocysteine is excreted and raises plasma total homocysteine.
- name: Neurological and Haematological Consequences of Combined Cofactor Deficiency
  role: outcome
  biological_scale: ORGANISM
  description: The clinical layer. Feeding difficulty, failure to thrive, hypotonia, seizures and
    developmental delay together with haematological abnormality, presenting in the neonatal period or
    infancy. The entry does not attempt to route each of these to one or other biochemical arm, because
    no published study separates them - both arms are impaired simultaneously in every patient.
  evidence:
  - reference: PMID:33729671
    reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
      neurodevelopmental course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Described clinical features include feeding difficulties, failure to thrive, hypotonia,
      seizures, developmental delay, and hematological abnormalities.
    explanation: The summary of the reported clinical picture, drawn from the symptomatic probands that
      make up nearly all published cases.

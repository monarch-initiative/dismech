name: Methylmalonic Acidemia With Homocystinuria, Type cblJ
creation_date: '2026-09-06T08:15:00Z'
category: Mendelian
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: An inborn error of intracellular cobalamin metabolism, presenting as a combined
      methylmalonic acidemia and homocystinuria.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal recessive, caused by biallelic ABCD4 variants, with a documented
      25/50/25 recurrence risk and available prenatal and preimplantation testing.
  icimd_category:
  - classification_value: cobalamin_metabolism
    notes: 'ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of cobalamin
      (vitamin B12) metabolism" under category 21, "Disorders of vitamin and cofactor
      metabolism". The lesion is in lysosomal export of cobalamin itself, upstream of the
      branch point where it is routed to the two cofactor forms, so cobalamin metabolism is
      the group rather than either downstream consequence. It is deliberately not filed
      under the organic-aciduria group that sibling entry Methylmalonic_Acidemia carries:
      methylmalonic acidemia there is the primary enzymatic defect, whereas here it is one
      of two secondary consequences of a transport defect, and filing it as an organic
      aciduria would lose the homocystinuria arm entirely.'
disease_term:
  preferred_term: methylmalonic acidemia with homocystinuria, type cblJ
  term:
    id: MONDO:0013925
    label: methylmalonic acidemia with homocystinuria, type cblJ
synonyms:
- cblJ
- cobalamin J disease
- ABCD4 deficiency
- methylmalonic aciduria and homocystinuria, cblJ type
description: 'An inborn error of intracellular cobalamin handling caused by biallelic ABCD4 variants.
  Cobalamin enters the cell by receptor-mediated endocytosis and arrives in the lysosome still bound to
  its carrier. Getting it out of the lysosome and into the cytosol is a discrete transport step, and it
  is that step that fails here. ABCD4 is an ATP-binding cassette transporter that performs it in complex
  with LMBD1, the protein lost in the cblF defect.

  The disease sits at a branch point in cobalamin metabolism, which is what gives it its biochemical
  signature. Downstream of the lysosome, cobalamin is processed into two different cofactors for two
  different enzymes in two different compartments - adenosylcobalamin for mitochondrial
  methylmalonyl-CoA mutase, and methylcobalamin for cytosolic methionine synthase. A block upstream of
  that split starves both. So cblJ presents with methylmalonic acidemia and homocystinuria together,
  where a defect in either downstream arm alone would produce only one of them. That combined pattern
  is the diagnostic fingerprint of the lysosomal export defects and of the early cytosolic processing
  defects, and it is what places this disease alongside the cblC, cblD, cblF and cblE/cblG entries
  rather than alongside isolated methylmalonic acidemia.

  Two things about the evidence base are worth stating up front. cblJ is clinically and biochemically
  indistinguishable from cblF, its partner in the same transport complex, so the two were separated by
  complementation and sequencing rather than by phenotype. And the described clinical picture comes
  almost entirely from symptomatic probands - eight reported patients in total - while the one
  patient found by newborn screening and treated presymptomatically has stayed asymptomatic and
  neurotypical. The severity recorded in the literature is therefore in part a statement about how
  patients were found.'

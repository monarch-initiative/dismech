    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: cytopenias (including megaloblastic anemia), global developmental delay, encephalopathy,
      and neurologic signs such as hypotonia and seizures
    explanation: The GeneReviews group-level statement. It describes the intracellular cobalamin
      disorders as a class, with cblC as the prototype, so it supports the phenotype belonging to this
      disease group rather than establishing a cblJ-specific frequency.
- category: Gastrointestinal
  name: Recurrent abdominal pain attacks
  frequency: VARIABLE
  description: 'Episodic severe abdominal pain with hypotonia, pallor, nausea and vomiting, reported from
    the age of one year in a single patient who had none of the neurological features that define the
    usual presentation. It is curated because the diagnostic lesson is unusually sharp: seven years of
    inconclusive evaluation followed, and the disease was found only when anemia appeared.'
  phenotype_term:
    preferred_term: Recurrent abdominal pain attacks
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:41378236
    reference_title: 'Cobalamin J Disorder in a Teenage Boy with Recurrent Abdominal Pain Attacks: A Case
      Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient, a 15-year-old male of Azerbaijani descent, presented with severe abdominal pain
      beginning at the age of 1 year. These episodic pain attacks were accompanied by hypotonia, pallor,
      nausea, and vomiting.
    explanation: The presentation, with its age of onset and accompanying features. One patient, which is
      why the frequency is VARIABLE.
  - reference: PMID:41378236
    reference_title: 'Cobalamin J Disorder in a Teenage Boy with Recurrent Abdominal Pain Attacks: A Case
      Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pain attacks ceased during treatment but recurred whenever vitamin B12 levels dropped
      after discontinuation.
    explanation: A within-patient withdrawal and rechallenge. It is the strongest causal evidence in this
      entry that a clinical feature is driven by the cobalamin deficit rather than merely co-occurring
      with it, and it is n=1.
- category: Dermatologic
  name: Progressive skin hyperpigmentation
  frequency: VARIABLE
  description: Diffuse progressive hyperpigmentation, reported as the dominant presenting feature in one

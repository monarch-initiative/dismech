biochemical:
- name: Total plasma homocysteine
  presence: Increased
  context: >-
    Raised from the blocked methylcobalamin arm. One of the two mainstay measurements for the
    intracellular cobalamin disorders, and one of the two therapeutic targets.
  biomarker_term:
    preferred_term: homocysteine
    term:
      id: CHEBI:17230
      label: homocysteine
  readouts:
  - target: Methionine Synthase Failure
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Reports failure of methionine-synthase-dependent remethylation. Raised tHcy alongside
      raised methylmalonic acid is the combined pattern that separates this group from isolated
      methylmalonic acidemia.
    evidence:
    - reference: PMID:20301503
      reference_title: Disorders of Intracellular Cobalamin Metabolism.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total
        homocysteine (tHcy) level are the mainstays of biochemical testing.
      explanation: GeneReviews names tHcy as a mainstay analyte for this group, which is the basis for
        curating it as a biomarker rather than only as a phenotype.
    - reference: PMID:42231716
      reference_title: First Revision of the Guidelines for the Diagnosis and Management of Remethylation
        Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Total homocysteine, methionine (and methylmalonic acid) should be kept as close to normal
        values as achievable.
      explanation: The therapeutic target, stated as a direction rather than a cut-off. The guideline
        declines to name a threshold, so this entry does not invent one.
- name: Methylmalonic acid
  presence: Increased
  context: >-
    Raised in urine and blood from the blocked adenosylcobalamin arm. The second mainstay measurement
    and the second therapeutic target.
  biomarker_term:
    preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
  readouts:
  - target: Methylmalonyl-CoA Mutase Substrate Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Reports loss of adenosylcobalamin-dependent methylmalonyl-CoA mutase activity.
    evidence:
    - reference: PMID:20301503
      reference_title: Disorders of Intracellular Cobalamin Metabolism.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total
        homocysteine (tHcy) level are the mainstays of biochemical testing.
      explanation: The same sentence names both mainstays. It is cited on each readout because each is a
        separate measurement with a separate therapeutic target.
- name: Plasma methionine
  presence: Decreased
  context: >-
    Low or low-normal, because the blocked methionine synthase reaction is the step that makes it. It is
    the one analyte in the triad that moves downward, which is what makes it discriminating.
  biomarker_term:
    preferred_term: methionine
    term:
      id: CHEBI:16811
      label: methionine
  readouts:
  - target: Methionine Synthase Failure
    relationship: READOUT_OF
    direction: NEGATIVE
    interpretation: 'Low methionine with high homocysteine localises the lesion to remethylation rather
      than to transsulfuration: in classical homocystinuria, where cystathionine beta-synthase is the
      block, methionine is high instead. Keeping it in the normal range is an explicit management goal.'
    evidence:
    - reference: PMID:42231716
      reference_title: First Revision of the Guidelines for the Diagnosis and Management of Remethylation
        Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The disorders typically result in elevated homocysteine and often low methionine; combined
        cobalamin-related defects also affect mitochondrial methylmalonic acid clearance.
      explanation: States the direction of all three analytes in one sentence, and separates the
        remethylation disorders generally from the combined cobalamin-related subset this disease belongs
        to.
    - reference: PMID:20301503
      reference_title: Disorders of Intracellular Cobalamin Metabolism.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: maintaining plasma methionine concentrations within the normal range
      explanation: The management target for methionine, which is why it is curated as a monitored
        biomarker rather than only as a diagnostic finding.
- name: Serum vitamin B12
  presence: Normal
  context: >-
    Normal or unremarkable, and this is the most clinically consequential entry in the section. The
    lesion is in intracellular cobalamin handling, downstream of absorption and transport, so
    circulating B12 is not depleted and a normal value does not exclude the disease.
  biomarker_term:
    preferred_term: cobalamin
    term:
      id: CHEBI:30411
      label: cobalamin
  readouts:
  - target: Failure of Lysosomal Cobalamin Export to the Cytosol
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    interpretation: 'Measured to interpret the other three rather than to make the diagnosis: a normal
      serum B12 alongside raised tHcy and MMA is what points at an intracellular defect instead of
      dietary or absorptive deficiency. The worked case is the patient who had seven years of
      inconclusive evaluation for abdominal pain and was diagnosed only when megaloblastic anemia
      appeared.'
    evidence:
    - reference: PMID:42231716
      reference_title: First Revision of the Guidelines for the Diagnosis and Management of Remethylation
        Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Plasma total homocysteine, methionine, methylmalonic acid, serum vitamin B12 (and folates)
        should be assessed in suspected cases.
      explanation: Places serum B12 in the diagnostic panel alongside the three analytes it is used to
        interpret.
genetic:
- name: ABCD4
  gene_term:
    preferred_term: ABCD4
    term:
      id: hgnc:68
      label: ABCD4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: An ATP-binding cassette transporter of the D subfamily. Its assignment to the lysosome rather
    than the peroxisome came out of this disease rather than preceding it, which is a good example of a
    rare disease correcting a protein annotation. Reported alleles include ATPase-domain missense
    variants (p.Arg432Gln, p.Asn141Lys) and frameshifts.
  evidence:
  - reference: PMID:23141461
    reference_title: 'Late onset of symptoms in an atypical patient with the cblJ inborn error of vitamin
      B12 metabolism: diagnosis and novel mutation revealed by exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By this approach, a homozygous mutation, c.423C>G, in the ABCD4 gene was identified.
    explanation: A causal variant identified in an individual patient, from the report that also
      established that the presentation can be late-onset.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic ABCD4 variants, homozygous or compound heterozygous.
  evidence:
  - reference: PMID:33729671
    reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
      neurodevelopmental course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cobalamin J disease (CblJ) is an ultra-rare autosomal recessive disorder of intracellular
      cobalamin metabolism
    explanation: States the mode of inheritance.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50%
      chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: The recurrence risk for genetic counselling. Graded INDIRECT because the chapter states
      it for the autosomal recessive members of the group as a class; it follows for cblJ because cblJ
      is autosomal recessive, which the item above establishes.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: carrier testing for at-risk relatives, molecular genetic prenatal testing for a pregnancy at
      increased risk, and preimplantation genetic testing are possible
    explanation: The reproductive options available once the family variants are known. Same class-level
      caveat as the recurrence risk above.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: If the pathogenic variants in the family are known, at-risk sibs may be tested prenatally to
      allow initiation of treatment in utero or as soon as possible after birth.
    explanation: 'Why prenatal testing here is not only reproductive information: it changes when
      treatment starts, and the one cblJ patient with a normal neurodevelopmental course is the one who
      was treated presymptomatically.'
treatments:
- name: Pharmacological Cobalamin Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: 'Pharmacological cobalamin is the mainstay of treatment for the combined cobalamin
    disorders. The mechanistic rationale is that raising cobalamin availability drives enough of it past
    an impaired - rather than absent - lysosomal export step to supply the downstream cofactors.

    The evidence in this specific disease is thin, and this record says so rather than importing the
    confidence that treating cblC would carry. What is published is that a presymptomatically treated
    patient stayed well, which is an outcome under treatment rather than a demonstration of effect, and
    that one late-presenting patient given oral cobalamin showed metabolic correction.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Failure of Lysosomal Cobalamin Export to the Cytosol
    description: Raises the cobalamin concentration presented to a transport step that is impaired rather
      than absent, which is the rationale for pharmacological rather than physiological dosing.
  evidence:
  - reference: PMID:33729671
    reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
      neurodevelopmental course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: With early detection and initiation of treatment, this patient has remained asymptomatic
      with normal growth parameters and neurodevelopmental function.
    explanation: A single patient followed to 17 months. It is an outcome under early treatment with no
      comparator, so it supports treatment being compatible with a normal course rather than
      demonstrating that treatment caused it.
  - reference: PMID:25234635
    reference_title: Progressive hyperpigmentation in a Taiwanese child due to an inborn error of vitamin
      B12 metabolism (cblJ).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment with oral cobalamin (3 mg daily) led to metabolic correction and some reduction
      in the skin hyperpigmentation at the 3-month follow-up.
    explanation: Records a biochemical and clinical response in a single patient, and notably by the oral
      route rather than parenterally. The route matters mechanistically and this is the only report of
      it, so it is not generalised in the description above.
  - reference: PMID:42231716
    reference_title: First Revision of the Guidelines for the Diagnosis and Management of Remethylation
      Disorders.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Betaine as first-line therapy for methylenetetrahydrofolate reductase deficiency and
      parenteral hydroxocobalamin for cobalamin-related defects have reduced mortality and morbidity.
    explanation: 'The statement that actually supports the therapeutic_agent binding: neither
      cblJ-specific snippet above names hydroxocobalamin, and this one does. Graded INDIRECT because it
      is class-level guidance for cobalamin-related defects rather than a cblJ result, and OTHER because
      it is consensus guideline text rather than a study.'
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Early institution of injectable hydroxocobalamin improves survival and may reduce but not
      completely prevent primary manifestations.
    explanation: The GeneReviews management statement, and the reason this entry treats early treatment
      as the intervention that matters. Note the hedge the chapter itself carries - reduce but not
      completely prevent - which is consistent with the one cblJ patient who stayed well and the several
      who did not.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: 'Agents/circumstances to avoid: Prolonged fasting (longer than overnight without
      dextrose-containing intravenous fluids); dietary protein intake below the recommended dietary
      allowance for age or more than that prescribed by a metabolic specialist; methionine restriction
      including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide.'
    explanation: 'The agents and circumstances to avoid. Nitrous oxide is the one worth reading twice: it
      inactivates cobalamin directly, so a routine anaesthetic is a specific hazard in a patient whose
      cobalamin handling is already the lesion.'
  notes: 'Betaine and carnitine are used in the combined cobalamin disorders generally, betaine to
    provide an alternative homocysteine remethylation route and carnitine to conjugate accumulated
    organic acids. Neither is curated as a separate treatment record here.

    The reasoning was revisited in review and is worth stating precisely, because it is not the same
    argument for both. The 2026 remethylation-disorder guideline is class-level guidance covering
    cobalamin-related defects, so it is not a sibling-disease import and it is now cited on this record
    for the hydroxocobalamin statement. But what it recommends betaine for first-line is MTHFR
    deficiency, which is a folate-cycle disorder and not this one; it does not make a betaine
    recommendation for the cobalamin-related defects that would carry to cblJ. Carnitine appears in
    neither cited source at all. So the position is: hydroxocobalamin is now evidenced at class level and
    cited, and betaine and carnitine remain uncurated because the class-level sources do not recommend
    them for this class of defect either.'
diagnosis:
- name: Newborn screening for combined methylmalonic acidemia and homocystinuria
  description: Detection through the newborn screen, followed by biochemical, molecular and
    complementation confirmation. This is the only route by which a patient has been identified before
    symptoms.
  evidence:
  - reference: PMID:33729671
    reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
      neurodevelopmental course.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a now 17-month-old male with CblJ detected by newborn screening and confirmed
      by biochemical, molecular, and complementation studies.
    explanation: States the diagnostic route and the three confirmatory modalities used.
  - reference: PMID:20301503
    reference_title: Disorders of Intracellular Cobalamin Metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Diagnosis is confirmed by identification of biallelic pathogenic variants in one of the
      following genes (associated complementation groups indicated in parentheses): MMACHC (cblC),
      MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4
      (cblJ)'
    explanation: Names ABCD4 as the confirmatory gene for cblJ, in the sentence that assigns each
      complementation group to its gene. This is the GeneReviews statement that is specifically about
      this disease rather than about the group.
  - reference: PMID:42231716
    reference_title: First Revision of the Guidelines for the Diagnosis and Management of Remethylation
      Disorders.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Early detection through newborn screening is associated with improved clinical outcomes.
    explanation: The guideline statement for remethylation disorders as a class. Graded INDIRECT because
      it is a class-level association, and it is the only external support for the presymptomatic-case
      argument this entry makes from a single patient.
- name: Complementation analysis
  description: Cell fusion complementation assigns a patient's fibroblasts to a complementation group,
    and it is what separates cblJ from cblF when the biochemistry cannot. It has a documented failure
    mode - a patient with near-normal fibroblast substrate incorporation cannot be complementation-typed
    at all, and needs sequencing instead.
  evidence:
  - reference: PMID:23141461
    reference_title: 'Late onset of symptoms in an atypical patient with the cblJ inborn error of vitamin
      B12 metabolism: diagnosis and novel mutation revealed by exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: were within reference ranges and thus too high to allow for complementation analysis
    explanation: Documents the specific circumstance in which the classical assay cannot be run - the
      quoted clause is the tail of a sentence about radiolabelled propionate and methyltetrahydrofolate
      incorporation in patient fibroblasts, trimmed to avoid bracketed isotope labels that the snippet
      matcher strips. It is
      why this entry records sequencing as the fallback rather than treating complementation as
      definitive.
- name: Exome sequencing
  description: The route that resolves cases the functional assays cannot, and the method by which the
    gene was found in the first place.
  evidence:
  - reference: PMID:23141461
    reference_title: 'Late onset of symptoms in an atypical patient with the cblJ inborn error of vitamin
      B12 metabolism: diagnosis and novel mutation revealed by exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report the successful application of exome sequencing for diagnosis of a rare
      inborn error of vitamin B(12) metabolism in a patient whose unusual presentation precluded
      diagnosis using standard biochemical and genetic approaches.
    explanation: States the diagnostic role of sequencing precisely where the standard approaches fail.
experimental_models:
- name: Patient fibroblast complementation and rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: 'Cultured skin fibroblasts from affected patients, used both to assign the complementation
    group and to test whether restoring the transporter restores the cofactors. There is no animal model
    of this disease, so this is the model system in which its mechanism was established.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:28572511
  modeled_mechanisms:
  - target: Failure of Lysosomal Cobalamin Export to the Cytosol
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient fibroblasts show the cofactor depletion that defines the disease, and the defect
      is corrected by restoring either ABCD4 or LMBD1.
    limitations: A fibroblast is not a neuron or a haematopoietic precursor, so the model establishes the
      cellular lesion and says nothing about why the clinical consequences fall where they do. It also
      has a documented failure mode - one patient's fibroblasts had near-normal substrate incorporation
      and could not be complementation-typed at all.
    readouts:
    - name: Cobalamin cofactor levels in patient fibroblasts
      target: Failure of Lysosomal Cobalamin Export to the Cytosol
      direction: RESTORED
      interpretation: 'The rescue arm is what makes this a mechanistic result rather than a correlation:
        the depletion is reversed by supplying the transporter, so the transporter defect causes it. The
        cross-rescue by LMBD1 is the part that argues for a complex rather than for ABCD4 acting alone.'
      evidence:
      - reference: PMID:28572511
        reference_title: Clinical or ATPase domain mutations in ABCD4 disrupt the interaction between the
          vitamin B(12)-trafficking proteins ABCD4 and LMBD1.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Cbl cofactor forms are decreased in fibroblasts from this patient but could be rescued
          by overexpression of either ABCD4 or, unexpectedly, LMBD1.
        explanation: Both the deficit and its rescue in one sentence, including the cross-rescue.
    evidence:
    - reference: PMID:33729671
      reference_title: 'Cobalamin J disease detected on newborn screening: Novel variant and normal
        neurodevelopmental course.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We describe a now 17-month-old male with CblJ detected by newborn screening and confirmed
        by biochemical, molecular, and complementation studies.
      explanation: Establishes complementation analysis in patient cells as a confirmatory modality in
        clinical practice, which is what makes this model system diagnostic as well as mechanistic.
- name: Proteoliposome reconstitution of ABCD4 transport activity
  experimental_model_type: OTHER
  description: 'Purified ABCD4, and ABCD4-ABCD1 chimeras, reconstituted into proteoliposomes so that
    cobalamin transport can be measured directly and separately from ATPase activity. It is the only
    system in which the transport step itself is the readout rather than an inference from downstream
    cofactor levels.'
  publication: PMID:38069516
  modeled_mechanisms:
  - target: Failure of Lysosomal Cobalamin Export to the Cytosol
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Measures cobalamin transport activity of ABCD4 variants directly, and separates loss of
      substrate recognition from loss of ATP hydrolysis.
    limitations: A purified protein in a synthetic bilayer has no LMBD1, no lysosome and no trafficking
      step, so it cannot report the chaperone-dependent half of the mechanism this entry curates. It also
      tests chimeric constructs rather than patient variants, so the residues it implicates are
      structurally informative rather than clinically validated.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: LMBD1 and the trafficking step are outside the model. Since ABCD4 reaches the lysosome
        only as LMBD1 cargo, the reconstituted system omits the step that a substantial share of patient
        variants are thought to disrupt.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: The variants tested are ABCD1 helix chimeras and engineered lysine substitutions, not
        the missense variants found in patients. The measured quantity is transport activity of a
        designed construct; the quantity of interest is transport activity of a patient allele.
    readouts:
    - name: Cobalamin transport activity with TM helix 6 replaced
      target: Failure of Lysosomal Cobalamin Export to the Cytosol
      direction: ABOLISHED
      interpretation: 'Transport is lost while ATPase activity is preserved, which localises the lesion
        to substrate recognition rather than to the energising step. This is the cleanest available
        dissection of what ABCD4 has to do in order to work.'
      evidence:
      - reference: PMID:38069516
        reference_title: Transmembrane helix 6 of ABCD4 is indispensable for cobalamin transport.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In the proteoliposome with chimeric ABCD4 replacing TM helix 6, the cobalamin transport
          activity disappeared without a reduction in ATPase activity, indicating that TM helix 6
          contributes to substrate recognition.
        explanation: The dissociation between transport and ATPase activity, which is what makes the
          result interpretable as a substrate-recognition defect.
  notes: 'No animal model of cblJ has been reported. These two systems - patient fibroblasts and
    reconstituted proteoliposomes - are the whole experimental basis for the mechanism this entry
    curates, and they sit at different scales: the fibroblast reports the cellular consequence, the
    proteoliposome reports the transport step itself. Neither addresses why the clinical consequences
    are neurological and haematological.'
discussions:
- discussion_id: cblj_ascertainment_shapes_severity
  kind: INTERPRETATION
  prompt: How much of the severe neurodevelopmental phenotype attributed to cblJ is a property of the
    disease, and how much is a property of how the patients were found?
  attaches_to:
  - phenotypes#Developmental delay
  - pathophysiology#Neurological and Haematological Consequences of Combined Cofactor Deficiency
  rationale: 'The published clinical picture - seizures, developmental delay, failure to thrive - comes
    from patients who were found because they were unwell. Two reports break that pattern in opposite
    ways and both matter. One patient came to attention at twelve years old with progressive skin
    hyperpigmentation and no neurological signs at all. Another was found on the newborn screen, treated
    from birth, and remained asymptomatic and neurotypical at 17 months.

    With eight patients in total, three atypical or presymptomatic cases are a large fraction of the
    evidence base, and they suggest the severity in the literature is at least partly an ascertainment
    effect. This is recorded rather than resolved. Seventeen months of follow-up is not enough to say
    that early treatment prevents the neurological phenotype, and one late-presenting patient does not
    establish a mild end of the spectrum. What can be said is that the frequencies attached to the
    neurological phenotypes in this entry describe symptomatic probands, not all people with biallelic
    ABCD4 variants.'
  proposed_experiments:
  - experiment_id: cblj_nbs_cohort_followup
    name: Long-term neurodevelopmental follow-up of screen-detected cblJ
    description: Follow newborn-screen-detected, presymptomatically treated cblJ patients to school age
      with formal neurodevelopmental assessment, and compare against the symptomatic-proband literature.
    readouts:
    - name: Neurodevelopmental outcome at school age in screen-detected patients
      target: phenotypes#Developmental delay
      direction: UNCHANGED
      interpretation: Normal development at school age in screen-detected patients would establish that
        the reported severity is substantially an ascertainment and treatment-timing effect rather than
        the natural course of biallelic ABCD4 loss.
- discussion_id: cblj_cblf_phenocopy_boundary
  kind: KNOWLEDGE_GAP
  prompt: Is there any clinical or biochemical feature that distinguishes cblJ from cblF, given that the
    two genes encode partners in one lysosomal export complex?
  attaches_to:
  - pathophysiology#Failure of the ABCD4-LMBD1 Complex at the Lysosomal Membrane
  - pathophysiology#Failure of Lysosomal Cobalamin Export to the Cytosol
  rationale: 'cblJ was described as mimicking cblF, and the mechanism explains why. The two proteins form
    one complex, ABCD4 needs LMBD1 to reach the lysosome, and overexpressing either one rescues the
    cofactor deficit in ABCD4-mutant fibroblasts. Nothing published separates the two groups on
    phenotype, and the separation is made by complementation or sequencing.

    That leaves a real question rather than a settled answer. If ABCD4 supplies the ATPase activity and
    LMBD1 the targeting, the two defects need not be functionally identical, and a difference might show
    up in the degree of residual export or in response to pharmacological cobalamin. Nobody has looked
    with enough patients to tell. Until someone does, the two diseases should be curated as separate
    entries with a shared mechanism rather than merged, because the genes are distinct and the
    complementation groups are established.'
  proposed_experiments:
  - experiment_id: cblj_cblf_matched_comparison
    name: Matched biochemical and clinical comparison of cblJ and cblF cohorts
    description: Assemble the published and unpublished cblJ and cblF patients and compare age at
      presentation, metabolite levels, response to pharmacological cobalamin and neurodevelopmental
      outcome, with genotype held in view.
    readouts:
    - name: Residual lysosomal cobalamin export in cblJ versus cblF fibroblasts
      target: pathophysiology#Failure of Lysosomal Cobalamin Export to the Cytosol
      direction: DECREASED
      interpretation: A consistent difference in residual export between the two groups would predict a
        difference in cobalamin responsiveness, and would justify separating them clinically as well as
        genetically.
notes: 'Boundary with the sibling cobalamin entries. This knowledge base curates the intracellular
  cobalamin disorders per complementation group - Methylmalonic_Aciduria_cblA_Type,
  MMACHC-related_Methylmalonic_Aciduria_and_Homocystinuria_cblC_Type,
  MMADHC-related_Disorder_of_Cobalamin_Metabolism_cblD_Type, Methylcobalamin_Deficiency_Type_cblE and
  Methylcobalamin_Deficiency_Type_cblG - and this entry fills the cblJ gap in that series. ABCD4 and cblJ
  were previously mentioned only inside the umbrella entry
  Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport, which is the grouping-level treatment.

  cblF (LMBRD1) does not currently have its own entry. It is the closest relative of this disease, the
  other half of the same transport complex, and if it is curated later the two entries should share this
  mechanism rather than each re-deriving it.

  On what is deliberately not claimed. The entry does not assign individual clinical features to the
  methylmalonic or the homocystinuria arm, because both arms are impaired simultaneously in every patient
  and no published study dissociates them. It does not curate betaine or carnitine as treatments, because
  no cblJ-specific evidence exists for either and importing them from the sibling diseases would create
  an entry-level claim with no source behind it. And it records the ATPase-domain mechanism with the
  original authors'' hedging intact, since that paper says the ATPase activity "may be involved" rather
  than demonstrating the transport reaction directly.

  On the reference set. Four references fetched during screening were pruned rather than cited, because
  none of them is about this disease and forcing a citation would have been worse than dropping them.
  PMID:23546813 reports an unassigned intracellular cobalamin defect presenting as diabetic ketoacidosis
  - MMACHC was sequenced and negative, and the paper lists cblC, cblD, cblF and cblJ as the remaining
  possibilities without resolving which. PMID:23751581 follows 58 Chinese patients with combined
  methylmalonic acidemia and homocystinuria, a population that is predominantly cblC. PMID:34655177 is a
  cblC prenatal-diagnosis report whose only cblJ content is the gene list in its background paragraph.
  PMID:35013307 is an Hcfc1/Ronin mouse model of a cblX-like disorder, a different complementation group
  with a different mechanism. Recorded here so the pruning is a decision on the record rather than an
  omission.'

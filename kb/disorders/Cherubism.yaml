pathophysiology:
- name: SH3BP2 Gain-of-Function Stabilization
  description: >-
    Recurrent missense mutations cluster in exon 9 of SH3BP2, within the peptide
    that binds the ubiquitin-ligase adaptor Tankyrase. The mutations abolish
    Tankyrase-directed poly-ADP-ribosylation and RNF146-mediated ubiquitination
    of SH3BP2, so the adaptor protein escapes proteasomal degradation and
    accumulates to abnormally high levels in myeloid cells.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: protein stabilization
    term:
      id: GO:0050821
      label: protein stabilization
    modifier: INCREASED
  evidence:
  - reference: PMID:11381256
    reference_title: "Mutations in the gene encoding c-Abl-binding protein SH3BP2 cause cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "seven mutations in the SH3-binding protein SH3BP2 (MIM 602104) on chromosome 4p16.3 that cause cherubism"
    explanation: >-
      Identifies SH3BP2 missense mutations as the cause of cherubism.
  - reference: PMID:20301316
    reference_title: "Cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 80% of affected individuals have the disorder as the result of a heterozygous gain-of-function pathogenic variant in SH3BP2."
    explanation: >-
      Confirms the SH3BP2 lesion is gain-of-function.
  - reference: PMID:22153076
    reference_title: "Loss of Tankyrase-mediated destruction of 3BP2 is the underlying pathogenic mechanism of cherubism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that Tankyrase, a member of the  poly(ADP-ribose)polymerase (PARP) family, regulates 3BP2 stability through  ADP-ribosylation and subsequent ubiquitylation by the E3-ubiquitin ligase RNF146  in osteoclasts."
    explanation: >-
      Establishes the keystone mechanism: Tankyrase and RNF146 normally target
      SH3BP2/3BP2 for degradation, so cherubism mutations that disrupt this cause
      pathogenic accumulation.

treatments:
- name: Observation and Watchful Waiting
  description: >-
    Because cherubism is usually self-limiting and lesions tend to fill with bone
    and remodel after puberty, conservative observation with surveillance is the
    mainstay for mild and stable disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301316
    reference_title: "Cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression of the lesions occurs as they become filled with bone and remodel during the second and third decade of life."
    explanation: >-
      Spontaneous regression justifies conservative observation for stable
      disease.
- name: Surgical Contouring and Curettage
  description: >-
    Surgical curettage, with or without bone grafting, and contouring of lesional
    bone are used for severe, disfiguring, or functionally compromising disease,
    generally after the active growth phase to limit recurrence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301316
    reference_title: "Cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgical interventions include curettage with or without bone grafting"
    explanation: >-
      Curettage with or without bone grafting is the standard surgical option.
- name: Denosumab
  description: >-
    Denosumab is an anti-RANKL monoclonal antibody that blocks osteoclast
    formation and activity; because cherubism lesions are giant-cell/osteoclast
    rich, high-dose denosumab has been used off-label with positive outcomes,
    though pediatric use requires monitoring for rebound hypercalcemia.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Enhanced Osteoclastogenesis
    treatment_effect: INHIBITS
    description: >-
      RANKL blockade prevents differentiation and activation of the osteoclasts
      that drive the lesion.
  evidence:
  - reference: PMID:39830148
    reference_title: "Successful treatment of adult cherubism with a 60 mg denosumab 6-monthly regimen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high-dose denosumab has  also been trialed in children with cherubism with positive outcomes"
    explanation: >-
      Anti-RANKL denosumab has been used in cherubism with reported benefit.
- name: Tacrolimus
  description: >-
    Tacrolimus, a calcineurin inhibitor, blocks the calcineurin-NFATc1 axis
    required for osteoclast differentiation and has produced clinical and
    radiologic improvement in aggressive pediatric cherubism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tacrolimus
      term:
        id: CHEBI:61049
        label: tacrolimus (anhydrous)
  target_mechanisms:
  - target: Enhanced Osteoclastogenesis
    treatment_effect: INHIBITS
    description: >-
      Calcineurin inhibition suppresses NFATc1-driven osteoclast differentiation.
  evidence:
  - reference: PMID:25491283
    reference_title: "The calcineurin inhibitor tacrolimus as a new therapy in severe cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After tacrolimus  therapy, the patient showed significant clinical improvement, including  stabilization of jaw size and intraosseous osteogenesis."
    explanation: >-
      Tacrolimus produced clinical and radiologic improvement in aggressive
      cherubism.

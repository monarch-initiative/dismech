discussions:
- discussion_id: gap_cherubism_mouse_systemic_vs_human_jaw_restricted
  prompt: >-
    Why is human cherubism anatomically restricted to the mandible and maxilla
    and self-limiting after puberty, whereas the Sh3bp2 knock-in mouse develops
    TNF-alpha-dependent systemic inflammation with generalized trabecular bone
    loss and cortical erosion? What jaw-specific and age-dependent factors confine
    the human disease and drive its spontaneous regression?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Macrophage TNF-alpha Overproduction
  - pathophysiology#Excessive Osteoclastic Bone Resorption
  rationale: >-
    The Sh3bp2 knock-in mouse faithfully reproduces the SH3BP2 gain-of-function,
    macrophage TNF-alpha overproduction, and osteoclast-driven bone loss, but its
    phenotype is systemic rather than jaw-restricted and does not spontaneously
    regress, unlike human cherubism. This mismatch is mechanistically important:
    the local factors that restrict human disease to the tooth-bearing jaws
    (e.g., dental development and eruption, jaw-specific RANKL or inflammatory
    signals) and the pubertal changes that trigger regression are not captured by
    the systemic mouse model, so the model may not predict organ-restricted human
    behavior or the natural history that is central to management.
  proposed_experiments:
  - experiment_id: exp_cherubism_jaw_local_factors
    name: Jaw-restriction and regression factor analysis in SH3BP2 models
    description: >-
      Compare tooth-eruption-associated local RANKL, inflammatory cytokine, and
      osteoclastogenic signaling in the developing jaw versus long bones of
      Sh3bp2 knock-in mice and, where available, human cherubism lesion tissue
      across ages, to identify jaw-specific amplifiers and pubertal changes that
      could explain anatomic restriction and spontaneous regression.
  evidence:
  - reference: PMID:17218256
    reference_title: "Increased myeloid cell responses to M-CSF and RANKL cause bone loss and inflammation in SH3BP2 \"cherubism\" mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sh3bp2 \"cherubism\"  mice exhibit trabecular bone loss, TNF-alpha-dependent systemic inflammation,  and cortical bone erosion."
    explanation: >-
      The mouse model exhibits systemic, TNF-dependent inflammation and
      generalized bone loss, in contrast to the jaw-restricted human disease.
  - reference: PMID:20301316
    reference_title: "Cherubism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "proliferative fibroosseous lesions limited to the mandible and maxilla"
    explanation: >-
      Human cherubism lesions are anatomically restricted to the jaws.

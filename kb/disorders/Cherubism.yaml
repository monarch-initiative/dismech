name: Cherubism
creation_date: "2026-07-22T00:00:00Z"
category: Mendelian
synonyms:
- CRBM
- Familial fibrous dysplasia of the jaws
- Cherubism, SH3BP2-related
description: >-
  Cherubism is a rare childhood-onset autoinflammatory fibro-osseous disease of
  the jaws, in most cases caused by autosomal dominant gain-of-function mutations
  in SH3BP2. The mutations lie in the binding region for the ubiquitin-ligase
  adaptor Tankyrase, so the mutant SH3BP2 protein escapes normal degradation and
  accumulates in myeloid cells. Stabilized SH3BP2 hyperactivates SYK-ERK
  signaling in macrophages, driving overproduction of TNF-alpha and enhanced
  RANKL-dependent osteoclastogenesis. Excessive osteoclastic resorption of
  mandibular and maxillary bone, with replacement by fibrovascular tissue rich in
  multinucleated giant cells, produces progressive, typically symmetric bilateral
  jaw expansion that gives affected children a cherubic facial appearance. The
  disease usually appears in early childhood, progresses until puberty, and then
  stabilizes and regresses in adulthood. A rare autosomal recessive form is
  caused by biallelic loss-of-function variants in OGFRL1.

name: Combined Immunodeficiency Due To ZAP70 Deficiency
creation_date: "2026-08-27T01:46:49Z"
category: Genetic
synonyms:
- selective T-cell defect
- severe combined immunodeficiency due to ZAP70 deficiency
- STCD
- ZAP-70 deficiency
- IMD48
- immunodeficiency 48
- zeta-associated-protein 70 deficiency
description: >-
  Combined immunodeficiency due to ZAP70 deficiency is an autosomal recessive
  inborn error of immunity caused by biallelic loss-of-function variants in
  ZAP70, which encodes the Syk-family protein tyrosine kinase ZAP-70 that docks
  on phosphorylated T-cell receptor (TCR) zeta chains and propagates TCR
  signaling. Loss of ZAP-70 kinase activity blocks positive selection of CD8
  single-positive thymocytes and leaves peripheral CD4+ T cells unable to
  signal through the TCR, producing the pathognomonic immunophenotype of absent
  or profoundly decreased CD8+ T cells together with normal numbers of
  nonfunctional CD4+ T cells, often with normal or elevated total lymphocyte
  counts. Affected infants typically present in the first year of life with
  recurrent bacterial, viral, and opportunistic infections, chronic diarrhea,
  and failure to thrive; immune dysregulation and autoimmunity also occur, and
  a distinct combination of a hypomorphic and an activating ZAP70 allele causes
  a severe early-onset autoimmune syndrome that IUIS lists as a separate
  entity. Without immune reconstitution, classically affected children usually
  do not survive early childhood; allogeneic hematopoietic stem cell
  transplantation is the only curative therapy.

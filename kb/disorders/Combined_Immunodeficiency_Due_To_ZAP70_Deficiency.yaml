classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      ZAP70 deficiency is an inborn error of immunity (combined
      immunodeficiency), best classified under disorders of the immune system.
    evidence:
    - reference: PMID:32431715
      reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Zeta-Chain Associated Protein Kinase 70 kDa (ZAP-70) deficiency is a rare combined immunodeficiency (CID) caused by recessive homozygous/compound heterozygous loss-of-function mutations in the ZAP70 gene."
      explanation: >-
        Establishes ZAP-70 deficiency as a combined immunodeficiency, an immune
        system disorder under the immunology/rheumatology grouping.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive Mendelian disorder caused by biallelic
      ZAP70 loss-of-function variants.
    evidence:
    - reference: ORPHA:911
      reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A very rare, severe, genetic, combined immunodeficiency disorder characterized by lymphocytosis, decreased peripheral CD8+ T-cells, and presence of normal circulating CD4+ T-cells, leading to immune dysfunction."
      explanation: >-
        Orphanet characterizes the disorder as a very rare genetic (Mendelian)
        immunodeficiency, supporting the genetics grouping.
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      IUIS 2022 classification (Tangye et al., PMID:35748970), Table 1
      (immunodeficiencies affecting cellular and humoral immunity) lists
      "ZAP-70 deficiency (ZAP70 LOF)" (OMIM 269840) with low CD8 number and
      normal but poorly functional CD4 cells. The distinct entry "ZAP-70
      combined hypomorphic and activating mutations" (OMIM 617006) is listed
      separately in the same table and is not the disease modeled here.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ZAP-70 deficiency (ZAP70 LOF) ZAP70 AR 269840 Low CD8 number, normal CD4 number but with poor function"
      explanation: >-
        The IUIS 2022 Table 1 row places ZAP-70 deficiency (ZAP70 LOF) among
        the combined immunodeficiencies affecting cellular and humoral
        immunity.
inheritance:

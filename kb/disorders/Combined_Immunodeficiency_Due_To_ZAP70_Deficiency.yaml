genetic:
- name: ZAP70
  gene_term:
    preferred_term: ZAP70
    term:
      id: hgnc:12858
      label: ZAP70
  association: CAUSATIVE
  notes: >-
    ZAP70 deficiency is caused by biallelic (homozygous or compound
    heterozygous) germline loss-of-function variants in ZAP70; reported
    variants occur throughout the gene without a mutational hotspot, but most
    are located in the kinase domain. The splice-site variant c.1624-11G>A is a
    founder allele in Mennonite kindreds, in whom the disease was first
    described. A distinct genotype combining a hypomorphic allele (R192W, with
    reduced binding to phosphorylated zeta chain) and a weakly activating
    allele (R360P, with disrupted autoinhibition) causes a separate early-onset
    autoimmune syndrome (OMIM 617006) rather than classic combined
    immunodeficiency.
  evidence:
  - reference: PMID:8202713
    reference_title: "ZAP-70 deficiency in an autosomal recessive form of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three siblings are described with an autosomal recessive form of severe combined immunodeficiency disease (SCID) in which ZAP-70, a non-Src PTK, is absent as a result of mutations in the ZAP-70 gene."
    explanation: >-
      Original identification of biallelic ZAP70 mutations abolishing ZAP-70
      expression in affected siblings.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Zeta-Chain Associated Protein Kinase 70 kDa (ZAP-70) deficiency is a rare combined immunodeficiency (CID) caused by recessive homozygous/compound heterozygous loss-of-function mutations in the ZAP70 gene."
    explanation: >-
      The systematic review confirms recessive homozygous or compound
      heterozygous loss-of-function ZAP70 variants as the cause across 49
      reported patients.
  - reference: ORPHA:911
    reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZAP70 | zeta chain of T-cell receptor associated protein kinase 70 | hgnc:12858 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet records ZAP70 as the disease-causing gene with germline
      mutations.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation R192W in the C-SH2 domain exhibited reduced binding to phosphorylated ζ-chain, whereas mutation R360P in the N lobe of the catalytic domain disrupted an autoinhibitory mechanism, producing a weakly hyperactive ZAP-70 protein."
    directness: INDIRECT
    explanation: >-
      Indirect: documents the allelic spectrum boundary, where a
      hypomorphic-plus-activating allele combination produces the distinct
      autoimmune syndrome instead of classic loss-of-function combined
      immunodeficiency.
treatments:
- name: Hematopoietic stem cell transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the only curative
    therapy. Successful transplants have used matched sibling, haploidentical,
    and unrelated cord blood donors, both with and without conditioning;
    long-term single-center follow-up reported 8/8 survivors with normalization
    of mitogen responses and resolution of infectious and autoimmune
    complications.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of ZAP-70 Kinase Activity in TCR Signaling
    treatment_effect: RESTORES
    description: >-
      Transplantation replaces the ZAP-70-deficient lymphoid compartment with
      donor-derived cells carrying intact ZAP70, restoring TCR
      signaling-competent T-cell immunity.
    evidence:
    - reference: PMID:20301777
      reference_title: "ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The only curative therapy for ZAP70 deficiency is allogeneic HSCT."
      explanation: >-
        GeneReviews identifies allogeneic HSCT as the only curative therapy,
        i.e., the intervention that corrects the underlying defect.
  - target: Failed Positive Selection of CD8 Thymocytes
    treatment_effect: RESTORES
    description: >-
      Donor-derived progenitors with intact ZAP70 undergo normal thymic
      selection, restoring the CD8+ T-cell compartment in most transplanted
      patients.
    evidence:
    - reference: PMID:27438785
      reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CD8 T cell count is normal in 5/8, high in 1/8, and low in 2/8."
      explanation: >-
        Long-term follow-up shows normalization of CD8 T-cell counts in most
        transplanted patients.
  - target: Defective Peripheral CD4+ T-Cell Activation
    treatment_effect: RESTORES
    description: >-
      Donor-derived T cells signal normally through the TCR, restoring mitogen
      responses after transplantation.
    evidence:
    - reference: PMID:27438785
      reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mitogen proliferation to phytohemagglutinin was normal after HSCT in 8/8 patients."
      explanation: >-
        Long-term follow-up documents restoration of mitogen-induced T-cell
        proliferation in all transplanted patients.
  evidence:
  - reference: PMID:27438785
    reference_title: "Long-Term Outcomes of Hematopoietic Stem Cell Transplantation for ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT using a variety of graft sources and approaches, including unconditioned matched sibling donor transplant, is a life-saving therapy for ZAP70 deficiency, providing excellent long-term immune function and resolution of clinical problems."
    explanation: >-
      Single-center long-term outcome series (8/8 alive at median 13.5 years)
      establishes HSCT as life-saving therapy.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation (HSCT) was applied as the major curative treatment in 25 (51%) of the patients, 18 patients survived transplantation, while two patients died and three required a second transplant in order to achieve full remission."
    explanation: >-
      The systematic review confirms HSCT as the major curative treatment
      across the reported cohort.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children who present in their first year of life with severe infections are expected to have a declining quality of life and usually do not survive past their second year without allogeneic hematopoietic stem cell transplantation (HSCT)."
    explanation: >-
      GeneReviews underscores that early transplantation is life-saving in the
      classic infantile presentation.
- name: Immunoglobulin replacement therapy
  description: >-
    IgG replacement therapy is used as supportive care, and as part of a
    conservative management approach when transplantation is not an option;
    patients managed this way remain at high risk for severe infections,
    autoimmunity, and lymphoproliferation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Combined Cellular and Humoral Immune Failure
    treatment_effect: MODULATES
    description: >-
      Immunoglobulin replacement compensates for the defective specific
      antibody production but does not correct the underlying T-cell signaling
      defect.
    evidence:
    - reference: PMID:20301777
      reference_title: "ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Supportive care: IgG replacement therapy; antibacterial, antifungal, antiviral, and Pneumocystis jiroveci prophylaxis to control and reduce the occurrence of infections."
      explanation: >-
        GeneReviews lists IgG replacement as supportive care that mitigates the
        humoral consequences of the immune failure.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care: IgG replacement therapy; antibacterial, antifungal, antiviral, and Pneumocystis jiroveci prophylaxis to control and reduce the occurrence of infections."
    explanation: Identifies IgG replacement as a mainstay of supportive care.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals on these therapies remain at high risk for severe infections as well as autoimmunity and lymphoproliferative manifestations."
    explanation: >-
      Qualifies immunoglobulin replacement as non-curative: patients on
      conservative therapy remain at high risk of severe complications.
- name: Antimicrobial prophylaxis
  description: >-
    Antibacterial, antifungal, antiviral, and Pneumocystis jirovecii
    prophylaxis are used to control and reduce infections pending definitive
    treatment, and long-term when transplantation is not possible.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antimicrobial prophylaxis
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Combined Cellular and Humoral Immune Failure
    treatment_effect: MODULATES
    description: >-
      Prophylaxis does not act on the signaling defect; it reduces the
      infectious consequences of the combined immune failure while it
      persists.
    evidence:
    - reference: PMID:20301777
      reference_title: "ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Supportive care: IgG replacement therapy; antibacterial, antifungal, antiviral, and Pneumocystis jiroveci prophylaxis to control and reduce the occurrence of infections."
      explanation: >-
        GeneReviews frames prophylaxis as controlling the infectious
        consequences of the immune failure pending definitive treatment.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care: IgG replacement therapy; antibacterial, antifungal, antiviral, and Pneumocystis jiroveci prophylaxis to control and reduce the occurrence of infections."
    explanation: >-
      GeneReviews lists antimicrobial and Pneumocystis prophylaxis among the
      mainstays of supportive care.
- name: Protective exposure avoidance pending definitive treatment
  description: >-
    Until immune reconstitution, exposure avoidance is itself treatment: only
    irradiated, leukoreduced, CMV-safe blood products (transfusion-associated
    graft-versus-host disease risk); no live viral vaccines for the infant or
    household contacts (disseminated vaccine-strain disease); formula feeding
    in place of breast milk until maternal CMV status is known; and avoidance
    of sick contacts, crowded enclosed spaces, and construction or soil
    disturbance (fungal exposure).
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: infection-exposure avoidance and protective isolation
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Combined Cellular and Humoral Immune Failure
    treatment_effect: MODULATES
    description: >-
      Removes the exposures the failed immune system cannot handle while the
      underlying defect persists.
    evidence:
    - reference: PMID:20301777
      reference_title: "ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "live viral vaccines for the infant and household contacts; transfusion of non-irradiated blood products; and areas of construction or soil manipulation, as they increase the risk for fungal exposure."
      explanation: >-
        GeneReviews' agents-to-avoid list names the exposures this
        behavioral treatment removes.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional considerations include using only irradiated, leukoreduced, cytomegalovirus (CMV)-safe blood products, delaying immunizations until immune reconstitution is confirmed, and considering use of formula feeding in place of breast feeding until the CMV status of the mother is known."
    explanation: >-
      GeneReviews management guidance for blood products, immunization timing,
      and CMV-safe feeding pending immune reconstitution.
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "breastfeeding and breast milk until maternal CMV status is established by CMV serologies; exposure to young children, sick contacts, or individuals with cold sores; crowded enclosed spaces"
    explanation: >-
      The remainder of the agents-to-avoid list: CMV-risk feeding and
      infectious-contact exposures.
diagnosis:
- name: Molecular genetic testing
  description: >-
    The diagnosis is established by identifying biallelic pathogenic ZAP70
    variants in a proband with suggestive findings — selective CD8
    lymphopenia with normal-count but nonfunctional CD4+ T cells.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ZAP70 deficiency is established in a proband with suggestive findings and biallelic pathogenic variants in ZAP70 identified by molecular genetic testing."
    explanation: >-
      GeneReviews states the diagnostic criterion: suggestive findings plus
      biallelic ZAP70 pathogenic variants on molecular testing.
- name: Newborn screening caveat (TREC assay can be normal)
  description: >-
    ZAP70 deficiency acts after V(D)J recombination, so T-cell receptor
    excision circles can be normal on dried-blood-spot newborn screening — a
    recognized false-negative class. A normal TREC screen therefore does not
    exclude the diagnosis in an infant with suggestive findings.
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  evidence:
  - reference: PMID:32181275
    reference_title: "Genetics of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal TREC levels can be seen in defects of lymphocyte maturation beyond VDJ recombination steps such as ZAP70 defect and MHC class II deficiency"
    explanation: >-
      Names ZAP70 deficiency explicitly as a post-V(D)J defect in which TREC
      newborn screening can be normal.

      label: Autosomal recessive inheritance
  description: >-
    ZAP70 deficiency is inherited in an autosomal recessive pattern; affected
    individuals carry homozygous or compound heterozygous loss-of-function
    variants in ZAP70, and heterozygous carriers are healthy.
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZAP70 deficiency is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the autosomal recessive inheritance directly.
  - reference: PMID:8202713
    reference_title: "ZAP-70 deficiency in an autosomal recessive form of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three siblings are described with an autosomal recessive form of severe combined immunodeficiency disease (SCID) in which ZAP-70, a non-Src PTK, is absent as a result of mutations in the ZAP-70 gene."
    explanation: >-
      The original sibling kindred established the autosomal recessive
      transmission of ZAP-70 deficiency.
pathophysiology:
- name: Loss of ZAP-70 Kinase Activity in TCR Signaling
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline ZAP70 variants,
      most located in the kinase domain, abolish ZAP-70 protein expression or
      catalytic activity.
  description: >-
    ZAP-70 is a Syk-family, non-receptor protein tyrosine kinase that is
    recruited to phosphorylated zeta chains of the T-cell receptor and couples
    receptor engagement to downstream signal transduction. Biallelic
    loss-of-function ZAP70 variants abolish this kinase activity, so TCR
    engagement no longer triggers the tyrosine-phosphorylation cascade. This
    molecular lesion is the initiating event for both the thymic selection
    defect and the peripheral CD4+ T-cell signaling failure.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  molecular_functions:
  - preferred_term: ZAP-70 protein tyrosine kinase activity
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show here that STD patients carry a mutation of zap-70, resulting in loss of the activity of this kinase."
    explanation: >-
      Demonstrates loss of ZAP-70 kinase activity as the molecular lesion in
      patients with selective T-cell deficiency.
  - reference: PMID:8202712
    reference_title: "Human severe combined immunodeficiency due to a defect in ZAP-70, a T cell tyrosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous mutation in the kinase domain of ZAP-70, a T cell receptor-associated protein tyrosine kinase, produced a distinctive form of human severe combined immunodeficiency."
    explanation: >-
      Identifies a homozygous kinase-domain mutation of the TCR-associated
      kinase ZAP-70 as the cause of this immunodeficiency.
  - reference: PMID:8202713
    reference_title: "ZAP-70 deficiency in an autosomal recessive form of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This absence is associated with defects in TCR signal transduction, suggesting an important functional role for ZAP-70."
    explanation: >-
      Links absence of ZAP-70 to defective TCR signal transduction in patient T
      cells.
  downstream:
  - target: Failed Positive Selection of CD8 Thymocytes
    causal_link_type: DIRECT
    description: >-
      Without ZAP-70 kinase activity, TCR signals required for positive
      selection into the CD8 lineage are not transmitted, so CD8
      single-positive thymocytes fail to develop.
    evidence:
    - reference: PMID:8124727
      reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Zap-70 kinase appears to be indispensable for the development of CD8 single-positive T cells as well as for signal transduction and function of single-positive CD4 T cells."
      explanation: >-
        Directly attributes the failure of CD8 single-positive T-cell
        development to loss of ZAP-70 kinase activity.
  - target: Defective Peripheral CD4+ T-Cell Activation
    causal_link_type: DIRECT
    description: >-
      CD4+ T cells develop and reach the periphery, presumably supported by
      residual Syk expression in thymocytes, but without ZAP-70 they cannot
      propagate TCR signals and are refractory to activation.
    evidence:
    - reference: PMID:8124727
      reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Peripheral CD4+ T cells from the zap-70-/- patients exhibit markedly reduced tyrosine phosphorylation, fail to produce interleukin-2, and do not proliferate in response to T cell receptor stimulation by mitogens or antigens."
      explanation: >-
        Shows that peripheral CD4+ T cells lacking ZAP-70 cannot signal through
        the TCR.
- name: Failed Positive Selection of CD8 Thymocytes
  biological_scale: CELLULAR
  description: >-
    In ZAP-70-deficient thymi, CD4+CD8+ double-positive thymocytes are present
    in the cortex, but only CD4 single-positive cells reach the medulla:
    positive selection of the CD8 lineage fails because it depends on
    ZAP-70-transduced TCR signals. The result is an absence of CD8
    single-positive T cells leaving the thymus.
  cell_types:
  - preferred_term: CD4+CD8+ double-positive thymocyte
    term:
      id: CL:0000809
      label: double-positive, alpha-beta thymocyte
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: positive thymic T cell selection
    term:
      id: GO:0045059
      label: positive thymic T cell selection
    modifier: DECREASED
  - preferred_term: CD8-positive, alpha-beta T cell differentiation
    term:
      id: GO:0043374
      label: CD8-positive, alpha-beta T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The thymi of zap-70-/- patients show the presence of CD4+CD8+ cells in the cortex; however, only CD4, not CD8, single-positive cells are present in the medulla."
    explanation: >-
      Direct histologic demonstration that CD8 single-positive thymocytes fail
      to develop in patient thymus.
  downstream:
  - target: Absence of CD8-positive T cells
    causal_link_type: DIRECT
    description: >-
      Failure to generate CD8 single-positive thymocytes produces the absent or
      profoundly decreased circulating CD8+ T cells that define the
      immunophenotype.
    evidence:
    - reference: PMID:8202712
      reference_title: "Human severe combined immunodeficiency due to a defect in ZAP-70, a T cell tyrosine kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Manifestations of this disorder included profound immunodeficiency, absence of peripheral CD8+ T cells, and abundant peripheral CD4+ T cells that were refractory to T cell receptor-mediated activation."
      explanation: >-
        Connects the developmental block to the absence of peripheral CD8+ T
        cells in patients.
- name: Defective Peripheral CD4+ T-Cell Activation
  biological_scale: CELLULAR
  description: >-
    Circulating CD4+ T cells are present in normal or even elevated numbers but
    are functionally inert: after TCR engagement they show markedly reduced
    tyrosine phosphorylation, fail to produce interleukin-2, and do not
    proliferate in response to mitogens or antigens. The T-cell compartment is
    therefore numerically preserved but functionally deficient.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: DECREASED
  - preferred_term: interleukin-2 production
    term:
      id: GO:0032623
      label: interleukin-2 production
    modifier: DECREASED
  - preferred_term: T cell proliferation
    term:
      id: GO:0042098
      label: T cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:8124727
    reference_title: "Defective T cell receptor signaling and CD8+ thymic selection in humans lacking zap-70 kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral CD4+ T cells from the zap-70-/- patients exhibit markedly reduced tyrosine phosphorylation, fail to produce interleukin-2, and do not proliferate in response to T cell receptor stimulation by mitogens or antigens."
    explanation: >-
      Documents the signaling, IL-2 production, and proliferation defects of
      patient CD4+ T cells.
  - reference: PMID:8202712
    reference_title: "Human severe combined immunodeficiency due to a defect in ZAP-70, a T cell tyrosine kinase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Manifestations of this disorder included profound immunodeficiency, absence of peripheral CD8+ T cells, and abundant peripheral CD4+ T cells that were refractory to T cell receptor-mediated activation."
    explanation: >-
      Independently documents abundant but activation-refractory peripheral
      CD4+ T cells.
  downstream:
  - target: Combined Cellular and Humoral Immune Failure
    causal_link_type: DIRECT
    description: >-
      Because the numerically preserved CD4+ T cells cannot respond through the
      TCR, both cell-mediated immunity and T-cell help for antibody responses
      collapse, producing a combined immunodeficiency.
    evidence:
    - reference: PMID:20301777
      reference_title: "ZAP70 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ZAP70 deficiency is a profound T-cell immunodeficiency caused by abnormal T-cell receptor (TCR) signaling due to the loss of ZAP70 kinase activity, resulting in diminished CD8+ T-cell counts and functional deficits in CD4+ T cells."
      explanation: >-
        GeneReviews summarizes how the CD4+ functional deficit and CD8+
        deficiency together produce profound T-cell immunodeficiency.
  - target: Decreased mitogen-induced T-cell proliferation
    causal_link_type: DIRECT
    description: >-
      The TCR-proximal signaling block is measured clinically as absent or
      markedly decreased lymphocyte proliferation to mitogens such as
      phytohemagglutinin.
    evidence:
    - reference: PMID:32431715
      reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunologic profiling showed defective antibody production (57%) and decreased lymphocyte responses to mitogenic stimuli such as phytohemagglutinin (PHA) (95%)."
      explanation: >-
        The systematic review quantifies decreased mitogen responses in 95% of
        evaluable patients, the clinical readout of the activation defect.
- name: Combined Cellular and Humoral Immune Failure
  biological_scale: ORGANISM
  description: >-
    The absence of cytotoxic CD8+ T cells combined with nonfunctional CD4+ T
    cells abolishes effective antigen-specific cellular immunity and deprives B
    cells of T-cell help, so specific antibody production is also defective in
    a majority of patients despite mostly normal immunoglobulin levels. The
    resulting combined cellular and humoral failure underlies the
    susceptibility to bacterial, viral, fungal, and opportunistic pathogens and
    the growth failure of affected infants.
  biological_processes:
  - preferred_term: adaptive immune response
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: DECREASED
  - preferred_term: specific antibody production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: DECREASED
  evidence:
  - reference: PMID:20301777
    reference_title: "ZAP70 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZAP70 deficiency is a profound T-cell immunodeficiency caused by abnormal T-cell receptor (TCR) signaling due to the loss of ZAP70 kinase activity, resulting in diminished CD8+ T-cell counts and functional deficits in CD4+ T cells."
    explanation: >-
      GeneReviews frames the disorder as a profound T-cell immunodeficiency
      arising from the combined CD8+ and CD4+ defects.
  - reference: PMID:32431715
    reference_title: "Clinical, Immunological, and Genetic Features in 49 Patients With ZAP-70 Deficiency: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunologic profiling showed defective antibody production (57%) and decreased lymphocyte responses to mitogenic stimuli such as phytohemagglutinin (PHA) (95%)."
    explanation: >-
      Documents defective specific antibody production alongside the cellular
      defect, establishing the combined (cellular plus humoral) nature of the
      immunodeficiency.
  downstream:
  - target: Recurrent bacterial infections
    causal_link_type: DIRECT
    description: >-
      Loss of T-cell help and effector function impairs clearance of bacterial
      pathogens, producing recurrent bacterial infections in nearly all
      patients.
    evidence:
    - reference: ORPHA:911
      reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0002718 | Recurrent bacterial infections | Very frequent (99-80%)"
      explanation: >-
        Orphanet annotates recurrent bacterial infections as very frequent in
        this disorder.
  - target: Recurrent viral infections
    causal_link_type: DIRECT
    description: >-
      Absent CD8+ cytotoxic T cells and nonfunctional CD4+ T cells cripple
      antiviral defense, so severe and recurrent viral infections are a
      hallmark.
    evidence:
    - reference: ORPHA:911
      reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0004429 | Recurrent viral infections | Very frequent (99-80%)"
      explanation: >-
        Orphanet annotates recurrent viral infections as very frequent in this
        disorder.
  - target: Recurrent opportunistic infections
    causal_link_type: DIRECT
    description: >-
      The profound T-cell defect permits infections by opportunistic pathogens
      such as Pneumocystis and Candida, as in other severe combined
      immunodeficiencies.
    evidence:
    - reference: ORPHA:911
      reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0005390 | Recurrent opportunistic infections | Very frequent (99-80%)"
      explanation: >-
        Orphanet annotates recurrent opportunistic infections as very frequent
        in this disorder.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic and recurrent infections, including gastrointestinal infections
      with chronic diarrhea, drive the growth failure typical of infants with
      combined immunodeficiency.
    evidence:
    - reference: ORPHA:911
      reference_title: "Combined immunodeficiency due to ZAP70 deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0001508 | Failure to thrive | Frequent (79-30%)"
      explanation: >-
        Orphanet annotates failure to thrive as frequent, consistent with
        growth failure secondary to the infectious burden.

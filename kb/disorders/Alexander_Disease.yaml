histopathology:
- name: Astrocytic Rosenthal fibers
  description: >
    Cytoplasmic astrocyte inclusions containing GFAP and small heat-shock proteins
    are the pathological hallmark of all forms, but their presence should be
    interpreted with clinical, imaging, and molecular findings.
  diagnostic: false
  context: Hallmark neuropathologic finding that is not independently pathognomonic because Rosenthal fibers can occur in other neoplastic and chronic reactive conditions.
  evidence:
  - reference: PMID:11138011
    reference_title: "Mutations in GFAP, encoding glial fibrillary acidic protein, are associated with Alexander disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathological hallmark of all forms of Alexander disease is the presence of Rosenthal fibers, cytoplasmic inclusions in astrocytes that contain the intermediate filament protein GFAP in association with small heat-shock proteins"
    explanation: Human neuropathology establishes the characteristic inclusion, its astrocytic location, and its composition.
biochemical:
- name: Cerebrospinal-fluid and plasma GFAP
  presence: INCREASED
  context: Elevated across the clinical spectrum; concentrations are higher in the cerebral phenotype and rise over time in young children.
  readouts:
  - target: Mutant GFAP Proteotoxicity
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Elevated soluble GFAP in CSF or plasma reports the abnormal GFAP burden but is not independently diagnostic of Alexander disease.
    evidence:
    - reference: PMID:41513585
      reference_title: "Characterization of Clinical Phenotype to Glial Fibrillary Acidic Protein Concentrations in Alexander Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GFAP concentrations were significantly elevated at baseline in both AxD CSF (N = 44) compared to controls (N = 46, p < 0.0001) and AxD plasma (N = 96) compared to other leukodystrophy plasma controls (N = 67, p < 0.0001)."
      explanation: The human cohort directly links elevated CSF and plasma GFAP to Alexander disease relative to control groups.
  evidence:
  - reference: PMID:41513585
    reference_title: "Characterization of Clinical Phenotype to Glial Fibrillary Acidic Protein Concentrations in Alexander Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GFAP concentrations are higher in the cerebral phenotype and increase over time in young children."
    explanation: This supports phenotype and age dependence, preventing overgeneralization of a single reference range across the disease spectrum.
  - reference: PMID:38558318
    reference_title: "Plasma concentrations of glial fibrillary acidic protein, neurofilament light, and tau in Alexander disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that GFAP is elevated in plasma of all age groups afflicted by AxD, including those with adult onset."
    explanation: The plasma study supports biomarker elevation across age groups, including adult-onset disease.
diagnosis:
- name: Clinical and MRI assessment with molecular confirmation
  description: >
    Suggestive age-dependent clinical and neuroimaging findings prompt testing;
    identification of a heterozygous pathogenic GFAP variant establishes the
    diagnosis.
  evidence:
  - reference: PMID:20301351
    reference_title: "Alexander Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Alexander disease is established in a proband with suggestive clinical and neuroimaging findings and a heterozygous pathogenic variant in GFAP identified by molecular genetic testing."
    explanation: GeneReviews defines the integrated clinical, imaging, and molecular route to diagnosis and the definitive molecular finding.
  - reference: PMID:21533827
    reference_title: "Nationwide survey of Alexander disease in Japan and proposed new guidelines for diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To ensure correct diagnosis of AxD, the physician should understand the importance of the process of GFAP genetic testing, which provides definitive diagnosis."
    explanation: The nationwide diagnostic guideline independently identifies GFAP testing as definitive.
genetic:
- name: GFAP Gain-of-Function Mutations
  gene_term:
    preferred_term: GFAP
    term:
      id: hgnc:4235
      label: GFAP
  association: Causative
  notes: >
    Heterozygous missense mutations in GFAP account for the vast majority of cases.
    Hotspot mutations at R79 and R239 are most common, accounting for 16.6% and
    20.3% of the 2011 cohort respectively. R239 variants as a group are associated
    with early, severe disease, but age at onset differs among substitutions at
    that residue. Most cases are de novo, although familial disease occurs. The
    mutations cause a toxic gain of function leading to protein aggregation rather
    than haploinsufficiency.
  inheritance:
  - name: Autosomal Dominant
  variants:
  - name: GFAP R79 missense hotspot
    description: >
      Recurrent heterozygous GFAP R79 substitutions, especially R79H, are a
      common Alexander disease hotspot. They enter the canonical toxic
      gain-of-function path from mutant GFAP through Rosenthal fiber formation,
      astrocyte dysfunction, white matter injury, and subtype-specific neurologic
      phenotypes.
    gene:
      preferred_term: GFAP
      term:
        id: hgnc:4235
        label: GFAP
    type: missense
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: toxic gain-of-function
      description: Missense substitution in the GFAP rod domain promotes dominant astrocyte intermediate-filament pathology.
    evidence:
    - reference: PMID:11567214
      reference_title: "Infantile Alexander disease: spectrum of GFAP mutations and genotype-phenotype correlation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nine patients carried arginine mutations (four had R79H; four had R239C; and one had R239H)"
      explanation: "Documents R79H among recurrent arginine hotspot mutations in infantile Alexander disease."
    - reference: PMID:21917775
      reference_title: "GFAP mutations, age at onset, and clinical subtypes in Alexander disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "R79 and R239 GFAP mutations were most common (16.6% and 20.3% of all cases, respectively)"
      explanation: "Large cohort analysis identifies R79 as one of the two most common GFAP mutation sites."
  - name: GFAP R239 missense hotspot
    description: >
      Recurrent heterozygous GFAP R239 substitutions, including R239C and R239H,
      are the most common hotspot group and are associated with a more aggressive
      clinical course, while R239H has earlier onset than R239C. R239 variants
      follow the toxic GFAP path through aggregation,
      Rosenthal fibers, astrocyte dysfunction, and severe Type I-weighted
      neurologic phenotypes.
    gene:
      preferred_term: GFAP
      term:
        id: hgnc:4235
        label: GFAP
    type: missense
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: toxic gain-of-function
      description: Missense substitution at GFAP Arg239 promotes dominant GFAP aggregation and severe astrocyte pathology.
    evidence:
    - reference: PMID:11567214
      reference_title: "Infantile Alexander disease: spectrum of GFAP mutations and genotype-phenotype correlation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nine patients carried arginine mutations (four had R79H; four had R239C; and one had R239H)"
      explanation: "Identifies R239C and R239H among recurrent GFAP hotspot mutations."
    - reference: PMID:21917775
      reference_title: "GFAP mutations, age at onset, and clinical subtypes in Alexander disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These common mutations predicted distinct clinical outcomes, with R239 predicting the most aggressive course"
      explanation: "Links the R239 hotspot to the most aggressive clinical trajectory."
    - reference: PMID:40520824
      reference_title: "Genotype-Phenotype Association for 14 GFAP Variants in Alexander Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pairwise comparison results found that R239H was associated with significantly earlier onsets than R239C."
      explanation: A newer variant-level analysis qualifies the hotspot association by demonstrating heterogeneity among R239 substitutions.
    - reference: PMID:41581419
      reference_title: "Natural History and Prognostic Factors in Pediatric Alexander Disease: A Cohort Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients with variants of R239 had a greater incidence of poor outcome than other variants did"
      explanation: The pediatric cohort supports poorer outcome for R239 variants while keeping the inference scoped to pediatric patients.
  - name: GFAP cysteine-generating aggregation-prone variants
    description: >
      Cysteine-generating GFAP variants, represented in Alexander disease cohorts
      by R239C and R88C, provide a variant-specific path into abnormal GFAP
      oxidation and crosslinking before aggregate and Rosenthal fiber formation.
    gene:
      preferred_term: GFAP
      term:
        id: hgnc:4235
        label: GFAP
    type: missense
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: abnormal GFAP oxidation and crosslinking
      description: Cysteine-generating substitutions promote GFAP crosslinking, defective assembly, and decreased filament solubility.
    evidence:
    - reference: PMID:11567214
      reference_title: "Infantile Alexander disease: spectrum of GFAP mutations and genotype-phenotype correlation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "mutations, of which two affect arginine (2R88C and 1R88S) and two affect nonarginine residues (1L76F and 1N77Y)"
      explanation: "Clinical cohort identifies R88C as another cysteine-generating GFAP arginine substitution."
    - reference: PMID:38782207
      reference_title: "Glial fibrillary acidic protein is pathologically modified in Alexander disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro and cell-based studies demonstrate that cystine-generating mutations promote GFAP crosslinking by cysteine-dependent oxidation"
      explanation: "Functional evidence provides a variant-specific mechanism from cysteine-generating GFAP mutations to crosslinking and aggregation."
  evidence:
  - reference: CGGV:assertion_1da6d658-360e-4097-95a9-0b6838638e31-2024-01-10T170000.000Z
    reference_title: "GFAP / Alexander disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GFAP | HGNC:4235 | Alexander disease | MONDO:0008752 | AD | Definitive"
    explanation: ClinGen classifies the GFAP-Alexander disease gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:11138011
    reference_title: "Mutations in GFAP, encoding glial fibrillary acidic protein, are associated with Alexander disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alexander disease therefore represents the first example of a primary genetic disorder of astrocytes, one of the major cell types in the vertebrate CNS"
    explanation: "Landmark paper establishing GFAP mutations as causative for Alexander disease."
  - reference: PMID:21917775
    reference_title: "GFAP mutations, age at onset, and clinical subtypes in Alexander disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R79 and R239 GFAP mutations were most common (16.6% and 20.3% of all cases, respectively). These common mutations predicted distinct clinical outcomes, with R239 predicting the most aggressive course"
    explanation: "Identifies mutation hotspots and genotype-phenotype correlations in a large cohort."
  - reference: PMID:11567214
    reference_title: "Infantile Alexander disease: spectrum of GFAP mutations and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense, heterozygous, de novo GFAP mutations were found in exons 1 or 4 for 14 of the 15 patients analyzed"
    explanation: "Confirms de novo missense mutations in GFAP rod domain as reliable molecular marker."
  - reference: PMID:39420046
    reference_title: "A systematic review and meta-analysis of GFAP gene variants in Alexander disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The genotype-phenotype correlation remains elusive due to the variable expressivity of clinical manifestations."
    explanation: The systematic review cautions against treating hotspot associations as deterministic because expressivity remains variable.
treatments:
- name: Supportive Care
  description: >
    Management is primarily supportive, including anti-epileptic drugs for
    seizures, physical therapy, and nutritional support. No disease-modifying
    therapy is currently approved.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301351
    reference_title: "Alexander Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is supportive and focuses on management by multidisciplinary specialists to manage general care, feeding, and nutrition; anti-seizure medication; physical and occupational therapy; speech and language therapy; and appropriate educational services."
    explanation: GeneReviews directly supports multidisciplinary symptomatic management and the specific care domains summarized here.
- name: Zilganersen (ION373; investigational GFAP antisense oligonucleotide)
  description: >
    Antisense oligonucleotides targeting GFAP mRNA have shown efficacy in
    mouse and rat models, achieving near-complete elimination of GFAP protein
    with reversal of Rosenthal fibers, white matter deficits, and motor
    impairment. Zilganersen is being evaluated in humans, but the trial registry
    does not establish clinical efficacy.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: GFAP
      term:
        id: hgnc:4235
        label: GFAP
    target_transcript: GFAP mRNA
  treatment_term:
    preferred_term: antisense oligonucleotide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Zilganersen
      term:
        id: NCIT:C186394
        label: Zilganersen
  target_mechanisms:
  - target: Mutant GFAP Proteotoxicity
    treatment_effect: INHIBITS
    description: GFAP-targeted antisense oligonucleotides lower GFAP protein, interrupting the aggregation/Rosenthal fiber mechanism upstream of astrocyte stress and white matter injury.
    evidence:
    - reference: PMID:29226998
      reference_title: "Antisense suppression of glial fibrillary acidic protein as a treatment for Alexander disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nearly complete and long-lasting elimination of GFAP occurred in brain and spinal cord following single bolus intracerebroventricular injections, with a striking reversal of Rosenthal fibers and downstream markers of microglial and other stress-related responses"
      explanation: "ASO-mediated GFAP suppression targets the upstream aggregation mechanism and reverses downstream stress markers in animal models."
  evidence:
  - reference: PMID:29226998
    reference_title: "Antisense suppression of glial fibrillary acidic protein as a treatment for Alexander disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nearly complete and long-lasting elimination of GFAP occurred in brain and spinal cord following single bolus intracerebroventricular injections, with a striking reversal of Rosenthal fibers and downstream markers of microglial and other stress-related responses"
    explanation: "Antisense oligonucleotides effectively suppress GFAP and reverse pathology in AxD mouse models."
  - reference: PMID:29226998
    reference_title: "Antisense suppression of glial fibrillary acidic protein as a treatment for Alexander disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "GFAP protein was also cleared from cerebrospinal fluid, demonstrating its potential utility as a biomarker in future clinical applications"
    explanation: "CSF GFAP clearance provides a potential biomarker for monitoring treatment response."
  - reference: PMID:34788075
    reference_title: "Antisense therapy in a rat model of Alexander disease reverses GFAP pathology, white matter deficits, and motor impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a single treatment with Gfap-targeted ASO provides long-lasting suppression, reverses GFAP pathology, and, depending on age of treatment, prevents or mitigates white matter deficits and motor impairment"
    explanation: "Rat model with myelin pathology demonstrates ASO therapy can both prevent and reverse disease features."
  - reference: clinicaltrials:NCT04849741
    reference_title: "A Phase 1-3, Double-Blind, Randomized, Placebo-Controlled Study to Evaluate the Efficacy, Safety, Pharmacokinetics and Pharmacodynamics of Intrathecally Administered ION373 in Patients With Alexander Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the safety and efficacy of zilganersen (ION373) in improving or stabilizing gross motor function across the full range of affected domains in patients with AxD."
    explanation: The registry supports ongoing human evaluation of zilganersen and its motor-function objective, not a claim of demonstrated benefit.
animal_models:
- species: Mus musculus
  genotype: Gfap R76H/+ and Gfap R236H/+ knock-in
  description: >
    Knock-in mice carrying GFAP-R76H and -R236H mutations (homologous to
    human R79H and R239H) develop Rosenthal fibers in hippocampus, corpus
    callosum, olfactory bulbs, subpial, and periventricular regions. Mice
    show elevated GFAP, white matter stress response, and increased seizure
    susceptibility but have normal lifespan, resembling adult-onset disease.
  evidence:
  - reference: PMID:17065456
    reference_title: "Alexander disease-associated glial fibrillary acidic protein mutations in mice induce Rosenthal fiber formation and a white matter stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice with GFAP-R76H and -R236H mutations develop Rosenthal fibers, the hallmark protein aggregates observed in astrocytes in AxD, in the hippocampus, corpus callosum, olfactory bulbs, subpial, and periventricular regions"
    explanation: "Knock-in mice recapitulate Rosenthal fiber formation in disease-relevant brain regions."
  - reference: PMID:17065456
    reference_title: "Alexander disease-associated glial fibrillary acidic protein mutations in mice induce Rosenthal fiber formation and a white matter stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies provide formal proof linking GFAP mutations with Rosenthal fibers and oxidative stress, and correlate gliosis and GFAP protein levels to the severity of the disease"
    explanation: "Provides formal proof of causality between GFAP mutations and Rosenthal fiber pathology."
- species: Rattus norvegicus
  genotype: Gfap R239H/+ knock-in
  description: >
    Knock-in rat carrying the GFAP R239H mutation exhibits hallmark
    pathology including Rosenthal fibers, widespread astrogliosis, and
    white matter deficits. Animals develop normally in early postnatal weeks
    but fail to thrive after weaning, developing severe motor deficits
    with approximately 14% dying between 6 and 12 weeks. This model
    recapitulates myelin pathology and motor impairment seen in human disease,
    unlike the milder mouse models.
  evidence:
  - reference: PMID:34788075
    reference_title: "Antisense therapy in a rat model of Alexander disease reverses GFAP pathology, white matter deficits, and motor impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we introduce a rat model of AxD that exhibits hallmark pathology with GFAP aggregation in the form of Rosenthal fibers, widespread astrogliosis, and white matter deficits"
    explanation: "Rat AxD model with clinically relevant myelin pathology and motor impairment."
  - reference: PMID:34788075
    reference_title: "Antisense therapy in a rat model of Alexander disease reverses GFAP pathology, white matter deficits, and motor impairment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These animals develop normally during the first postnatal weeks but fail to thrive after weaning and develop severe motor deficits as they mature, with about 14% dying of unknown cause between 6 and 12 weeks of age"
    explanation: "Characterizes the time course of disease progression in the rat model."
- species: Drosophila melanogaster
  genotype: Glial expression of human GFAP R79H and R239H
  description: >
    Transgenic Drosophila expressing disease-linked mutant human GFAP
    in fly glia develop inclusions bearing hallmarks of authentic
    Rosenthal fibers. The model demonstrates non-cell-autonomous
    neurodegeneration mediated by protein aggregation and oxidative
    stress, with neuronal apoptosis dependent on glial glutamate transport.
  evidence:
  - reference: PMID:21414908
    reference_title: "Protein misfolding and oxidative stress promote glial-mediated neurodegeneration in an Alexander disease model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find aggregation of mutant human GFAP into inclusions bearing the hallmarks of authentic Rosenthal fibers"
    explanation: "Drosophila model recapitulates Rosenthal fiber formation from mutant human GFAP."
  - reference: PMID:21414908
    reference_title: "Protein misfolding and oxidative stress promote glial-mediated neurodegeneration in an Alexander disease model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Toxicity of mutant GFAP to glial cells induces a non-cell-autonomous stress response and subsequent apoptosis in neurons, which is dependent on glial glutamate transport"
    explanation: "Demonstrates non-cell-autonomous neurodegeneration mechanism via glutamate-dependent pathway."
clinical_trials:
- name: NCT04849741
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >
    Intrathecal zilganersen (ION373) interventional study evaluating safety,
    pharmacokinetics, pharmacodynamics, and whether gross motor function improves
    or stabilizes. The ClinicalTrials.gov record was checked on 2026-08-04; the
    registry describes evaluation and does not report efficacy results.
  evidence:
  - reference: clinicaltrials:NCT04849741
    reference_title: "A Phase 1-3, Double-Blind, Randomized, Placebo-Controlled Study to Evaluate the Efficacy, Safety, Pharmacokinetics and Pharmacodynamics of Intrathecally Administered ION373 in Patients With Alexander Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the safety and efficacy of zilganersen (ION373) in improving or stabilizing gross motor function across the full range of affected domains in patients with AxD."
    explanation: The trial registry supports the investigational agent, disease population, and motor-function objective without supporting clinical efficacy.
- name: NCT02714764
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >
    Observational natural-history study collecting functional outcomes and CSF
    and blood GFAP measurements to define outcome metrics for future Alexander
    disease treatment trials. Status was checked on 2026-08-04.
  evidence:
  - reference: clinicaltrials:NCT02714764
    reference_title: "Evaluation of Outcome Metrics in Alexander Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to define the natural history of Alexander Disease, a leukodystrophy that causes neurological dysfunction. Investigators will obtain clinical outcome assessments to measure how the disease affects a patient's gross motor, fine motor, speech and language function, swallowing, and quality of life. Specimens are collected to measure glial fibrillary acidic protein (GFAP) levels in cerebrospinal fluid (CSF) and blood. The data obtained from this study will be used for the design of future treatment trials."
    explanation: The registry directly supports the observational outcome domains and GFAP specimen collection used for trial-readiness research.
discussions:
- discussion_id: gap_axd_preclinical_mechanism_translation
  prompt: >
    Do STAT3 inhibition, P2Y12-dependent microglial protection, and GFAP antisense
    suppression reproduce their model-system effects in people with Alexander
    disease, and which biomarkers reliably demonstrate target engagement?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#STAT3-Driven GFAP Upregulation
  - pathophysiology#P2Y12-Dependent Protective Microglial Response
  - treatments#Zilganersen (ION373; investigational GFAP antisense oligonucleotide)
  rationale: >
    Causal STAT3 and P2Y12 evidence is presently derived from mouse models, while
    GFAP antisense reversal of pathology and functional deficits is preclinical.
    Human tissue establishes STAT3 activation and human studies establish GFAP as
    a biomarker and zilganersen as an investigational intervention, but neither
    proves that these model-derived causal effects translate into clinical benefit.
  evidence:
  - reference: PMID:37048051
    reference_title: "STAT3 Drives GFAP Accumulation and Astrocyte Pathology in a Mouse Model of Alexander Disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Astrocyte-specific Stat3 knockout in adult mice with existing pathology reversed GFAP accumulation and aggregation."
    explanation: The intervention supports STAT3 causality in mice, leaving efficacy and causal direction in human disease unresolved.
  - reference: PMID:37955589
    reference_title: "Microglia sense astrocyte dysfunction and prevent disease progression in an Alexander disease model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Clopidogrel significantly exacerbated pathological markers in AxD model mice and attenuated the morphological features of microglia, suggesting that microglia play a protective role against AxD pathology via P2Y12 receptors."
    explanation: Pharmacologic perturbation supports a protective P2Y12-dependent response in mice, not yet in people with Alexander disease.
  - reference: clinicaltrials:NCT04849741
    reference_title: "A Phase 1-3, Double-Blind, Randomized, Placebo-Controlled Study to Evaluate the Efficacy, Safety, Pharmacokinetics and Pharmacodynamics of Intrathecally Administered ION373 in Patients With Alexander Disease"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the safety and efficacy of zilganersen (ION373) in improving or stabilizing gross motor function across the full range of affected domains in patients with AxD."
    explanation: The registry establishes human evaluation of zilganersen but does not provide results that resolve translation of preclinical efficacy.

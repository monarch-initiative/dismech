      explanation: Reversal of GFAP accumulation after Stat3 deletion supports a direct regulatory link in the disease model.
- name: P2Y12-Dependent Protective Microglial Response
  description: >
    Microglia detect excess extracellular ATP arising from dysfunctional
    Alexander disease astrocytes through P2Y12 receptors. Pharmacologic P2Y12
    blockade worsened pathological markers in mice, supporting a compensatory,
    protective microglial response rather than a disease-driving inflammatory step.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:37955589
    reference_title: "Microglia sense astrocyte dysfunction and prevent disease progression in an Alexander disease model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clopidogrel significantly exacerbated pathological markers in AxD model mice and attenuated the morphological features of microglia, suggesting that microglia play a protective role against AxD pathology via P2Y12 receptors."
    explanation: P2Y12 inhibition worsened disease-model pathology, supporting a protective role for P2Y12-dependent microglial activity.

- name: White-Matter Oxidative Stress
  description: >
    GFAP mutations induce an antioxidant/oxidative stress response in
    white matter, with iron accumulation in corpus callosum. Knock-in mice
    with GFAP mutations show a distinct pattern of stress response gene
    induction particularly prominent in white matter regions.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: Oxidative Stress Response
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:17065456
    reference_title: "Alexander disease-associated glial fibrillary acidic protein mutations in mice induce Rosenthal fiber formation and a white matter stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "when crossed with an antioxidant response element reporter line, the mutant mice show a distinct pattern of reporter-gene induction that is especially prominent in the corpus callosum, and histochemical staining reveals accumulation of iron in the same region"
    explanation: "GFAP mutant mice show oxidative stress response and iron accumulation in white matter."
  downstream:
  - target: Oxidative GFAP Crosslinking
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - astrocyte oxidant exposure
    - oxidative modification of GFAP cysteine residues
    description: Oxidant stress modifies GFAP and promotes disulfide-linked oligomerization, closing a model-supported cycle between mutant GFAP proteotoxicity and oxidative injury.
    evidence:
    - reference: PMID:41830670
      reference_title: "Alexander disease mutations differentially sensitize glial fibrillary acidic protein (GFAP) to posttranslational modifications and network disruption by oxidants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cellular expression of certain GFAP AxD mutants can provoke oxidative stress and contribute to a pathogenic cycle, as GFAP itself is an important oxidant target."
      explanation: Cell and in-vitro data support a reciprocal route from oxidant stress to modification of mutant GFAP; the white-matter tissue context remains model-derived.
  - target: Frontal-Predominant Leukoencephalopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - corpus callosum and frontal white matter stress response

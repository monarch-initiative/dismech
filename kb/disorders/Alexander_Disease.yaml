    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:37048051
    reference_title: "STAT3 Drives GFAP Accumulation and Astrocyte Pathology in a Mouse Model of Alexander Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we show that STAT3 is also activated in the human disease."
    explanation: Patient tissue establishes that STAT3 activation is present in human Alexander disease, while not by itself establishing causal direction.
  - reference: PMID:37048051
    reference_title: "STAT3 Drives GFAP Accumulation and Astrocyte Pathology in a Mouse Model of Alexander Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Astrocyte-specific Stat3 knockout in adult mice with existing pathology reversed GFAP accumulation and aggregation."
    explanation: Conditional knockout after disease pathology had developed provides intervention evidence that STAT3 drives GFAP accumulation in the mouse model.
  downstream:
  - target: Mutant GFAP Proteotoxicity
    causal_link_type: DIRECT
    description: STAT3-dependent elevation of GFAP increases the protein burden that accumulates and aggregates in Alexander disease astrocytes.

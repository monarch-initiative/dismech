genetic:
- name: ADA2 biallelic loss of function
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ADA2
    term:
      id: hgnc:1839
      label: ADA2
  relationship_type: CAUSATIVE
  association: Pathogenic Variants
  inheritance:
  - name: Autosomal recessive
  notes: >-
    CECR1 is the former HGNC symbol for ADA2. ClinGen Antibody Deficiencies
    GCEP classifies ADA2 and deficiency of adenosine deaminase 2 as Definitive
    under MONDO:0100317, which was obsoleted as an exact duplicate merged into
    MONDO:0014306 (mondo#9413).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e05f1338-6a58-4991-af3b-6433bd165a9f-2023-05-30T170000.000Z
    evidence:
    - reference: CGGV:assertion_e05f1338-6a58-4991-af3b-6433bd165a9f-2023-05-30T170000.000Z
      reference_title: "ADA2 / deficiency of adenosine deaminase 2 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ADA2 | HGNC:1839 | deficiency of adenosine deaminase 2 | MONDO:0100317 | AR | Definitive"
      explanation: ClinGen Antibody Deficiencies GCEP Definitive gene-disease validity assertion for ADA2 in deficiency of adenosine deaminase 2.
  evidence:
  - reference: PMID:24552285
    reference_title: "Mutant adenosine deaminase 2 in a polyarteritis nodosa vasculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all the families, vasculitis was caused by recessive mutations in CECR1, the gene encoding adenosine deaminase 2 (ADA2)."
    explanation: >
      Establishes recessive (biallelic) CECR1/ADA2 loss-of-function variants
      as the cause of DADA2. CECR1 is the former symbol for ADA2.
  - reference: PMID:24552284
    reference_title: "Early-onset stroke and vasculopathy associated with mutations in ADA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nine patients carried recessively inherited mutations in CECR1 (cat eye syndrome chromosome region, candidate 1), encoding adenosine deaminase 2 (ADA2), that were predicted to be deleterious; these mutations were rare or absent in healthy controls."
    explanation: Independent confirmation of recessive deleterious CECR1/ADA2 variants in patients.
diagnosis:
- name: Plasma or Serum ADA2 Catalytic Activity Assay
  description: >-
    Biochemical measurement of adenosine deaminase 2 catalytic activity in
    plasma or serum establishes functional ADA2 deficiency when activity is low
    (<5% of normal) or undetectable, including in patients carrying noncoding,
    structural, or uncertain-significance ADA2 alleles.
  diagnosis_term:
    preferred_term: plasma or serum ADA2 enzyme activity assay
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  evidence:
  - reference: PMID:31393689
    reference_title: "Adenosine Deaminase 2 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DADA2 is established in a proband with suggestive clinical and laboratory findings and biallelic loss-of-function ADA2 pathogenic variants identified by molecular testing and/or low (<5% of normal) or undetectable ADA2 catalytic activity in plasma or serum."
    explanation: GeneReviews diagnostic criterion establishing low (<5% of normal) or undetectable plasma/serum ADA2 catalytic activity as diagnostic.
  - reference: PMID:24552284
    reference_title: "Early-onset stroke and vasculopathy associated with mutations in ADA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had a marked reduction in the levels of ADA2 and ADA2-specific enzyme activity in the blood."
    explanation: Founding cohort demonstration of markedly reduced blood ADA2 protein levels and enzyme activity.
- name: Molecular Genetic Testing of ADA2
  description: >-
    Targeted sequencing, multigene panel testing, or copy-number / genome
    analysis of ADA2 (formerly CECR1) to identify biallelic loss-of-function
    pathogenic variants in probands and to clarify carrier or presymptomatic
    biallelic status in at-risk relatives.
  diagnosis_term:
    preferred_term: ADA2 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31393689
    reference_title: "Adenosine Deaminase 2 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DADA2 is established in a proband with suggestive clinical and laboratory findings and biallelic loss-of-function ADA2 pathogenic variants identified by molecular testing and/or low (<5% of normal) or undetectable ADA2 catalytic activity in plasma or serum."
    explanation: GeneReviews diagnostic criterion establishing identification of biallelic ADA2 loss-of-function pathogenic variants by molecular testing.
  - reference: PMID:32845415
    reference_title: "The Many Faces of a Monogenic Autoinflammatory Disease: Adenosine Deaminase 2 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis is through detection of reduced activity level of the adenosine deaminase 2 (ADA2) enzyme and/or identification of bi-allelic mutations in the ADA2 gene."
    explanation: Review confirming combined enzymatic and biallelic ADA2 genetic diagnostic standard.
treatments:
- name: Anti-TNF Therapy
  description: >
    Anti-tumor necrosis factor (TNF) agents (etanercept, adalimumab, golimumab,
    infliximab, certolizumab) are the drugs of choice for symptomatic and
    asymptomatic individuals with biallelic ADA2 pathogenic variants. They
    prevent and eliminate autoinflammatory/vasculitic manifestations and reduce
    the risk of ischemic stroke. Hematologic and immune features respond more
    variably, and anti-TNF agents have little effect on severe bone marrow
    failure.
  therapeutic_modality: OTHER
  notes: >-
    Typed as OTHER because first-line DADA2 TNF blockade combines anti-TNF
    monoclonal antibodies (adalimumab, infliximab, golimumab, certolizumab)
    with the dimeric soluble TNFR2-Fc fusion protein etanercept.
  treatment_term:
    preferred_term: anti-TNF therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
  evidence:
  - reference: PMID:35095905
    reference_title: "The Spectrum of the Deficiency of Adenosine Deaminase 2: An Observational Analysis of a 60 Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We significantly extended our experience using anti-TNF agents, with no strokes observed in 2026 patient months on TNF inhibitors."
    explanation: >
      Cohort evidence that anti-TNF therapy prevents stroke in DADA2, the
      mainstay of treatment.
  - reference: PMID:33420503
    reference_title: "Anti-tumour necrosis factor treatment for the prevention of ischaemic events in patients with deficiency of adenosine deaminase 2 (DADA2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-TNF treatment significantly reduced the incidence of ischaemic events and other vasculitic manifestations of DADA2, but was not effective for immunodeficiency or bone marrow failure."
    explanation: >
      Multicenter retrospective study quantifying that anti-TNF therapy
      prevents ischemic events and vasculitis but not the hematologic/immune
      phenotype, consistent with anti-TNF as first-line disease-modifying
      therapy.
  target_mechanisms:
  - target: Myeloid Inflammatory Dysregulation
    treatment_effect: INHIBITS
    description: Neutralizes excess myeloid-derived TNF-alpha signaling that drives systemic autoinflammation and endothelial injury.
    evidence:
    - reference: PMID:33420503
      reference_title: "Anti-tumour necrosis factor treatment for the prevention of ischaemic events in patients with deficiency of adenosine deaminase 2 (DADA2)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Anti-TNF treatment significantly reduced the incidence of ischaemic events and other vasculitic manifestations of DADA2, but was not effective for immunodeficiency or bone marrow failure."
      explanation: Demonstrates clinical suppression of TNF-driven inflammatory and vasculitic disease activity.
  - target: Endothelial Damage and Vasculopathy
    treatment_effect: INHIBITS
    description: Prevents vasculitic endothelial injury and CNS/systemic ischemic events.
    evidence:
    - reference: PMID:35095905
      reference_title: "The Spectrum of the Deficiency of Adenosine Deaminase 2: An Observational Analysis of a 60 Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We significantly extended our experience using anti-TNF agents, with no strokes observed in 2026 patient months on TNF inhibitors."
      explanation: Demonstrates elimination of recurrent ischemic strokes on TNF blockade.
- name: Hematopoietic Stem Cell Transplantation
  description: >
    Allogeneic hematopoietic cell transplantation (HCT) can correct severe
    hematologic and immunologic DADA2 disease that is refractory to anti-TNF
    therapy; transplanted patients in the NIH cohort discontinued anti-TNF
    therapy after engraftment.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:35095905
    reference_title: "The Spectrum of the Deficiency of Adenosine Deaminase 2: An Observational Analysis of a 60 Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All transplanted patients are still alive and have discontinued anti-TNF therapy."
    explanation: >
      Cohort evidence that allogeneic HCT can be curative for DADA2 hematologic
      / immune disease, allowing discontinuation of anti-TNF therapy.
  - reference: PMID:34324127
    reference_title: "Hematopoietic Cell Transplantation Cures Adenosine Deaminase 2 Deficiency: Report on 30 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCT was an effective treatment for DADA2, successfully reversing the refractory cytopenia, as well as the vasculopathy and immunodeficiency."
    explanation: >-
      International 30-patient series showing HCT reverses refractory
      cytopenia, vasculopathy, and immunodeficiency, establishing HCT as a
      definitive cure for DADA2.
  target_mechanisms:
  - target: ADA2 Loss of Function
    treatment_effect: RESTORES
    description: Donor hematopoietic engraftment reconstitutes circulating myeloid-derived plasma ADA2 enzyme activity.
    evidence:
    - reference: PMID:34324127
      reference_title: "Hematopoietic Cell Transplantation Cures Adenosine Deaminase 2 Deficiency: Report on 30 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hematological and immunological phenotypes resolved, and there were no new vascular events. Plasma ADA2 enzyme activity normalized in 16/17 patients tested."
      explanation: Demonstrates normalization of plasma ADA2 enzyme activity after allogeneic HCT.
    - reference: PMID:32845415
      reference_title: "The Many Faces of a Monogenic Autoinflammatory Disease: Adenosine Deaminase 2 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Hematopoietic stem cell transplantation can lead to normalization of enzyme activity, as well as resolution of vasculitic, hematologic, and immunologic manifestations, although treatment-related adverse effects are not uncommon."
      explanation: Confirms restoration of ADA2 enzyme activity and multisystem resolution following HSCT.
  - target: Hematologic Manifestations
    treatment_effect: RESTORES
    description: Replaces defective host hematopoietic and myeloid progenitors, resolving refractory cytopenias, bone marrow failure, and immunodeficiency.
    evidence:
    - reference: PMID:34324127
      reference_title: "Hematopoietic Cell Transplantation Cures Adenosine Deaminase 2 Deficiency: Report on 30 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HCT was an effective treatment for DADA2, successfully reversing the refractory cytopenia, as well as the vasculopathy and immunodeficiency."
      explanation: Demonstrates reversal of refractory cytopenia and immunodeficiency after HCT.
  - target: Endothelial Damage and Vasculopathy
    treatment_effect: INHIBITS
    description: Eliminates recurrent vascular and ischemic events after restoration of donor ADA2-competent myeloid cells.
    evidence:
    - reference: PMID:34324127
      reference_title: "Hematopoietic Cell Transplantation Cures Adenosine Deaminase 2 Deficiency: Report on 30 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hematological and immunological phenotypes resolved, and there were no new vascular events. Plasma ADA2 enzyme activity normalized in 16/17 patients tested."
      explanation: Demonstrates cessation of vascular events following HCT.

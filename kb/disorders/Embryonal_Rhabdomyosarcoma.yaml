    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The standard chemotherapy regimen for patients with rhabdomyosarcoma
      is the combination of vincristine, actinomycin, and
      cyclophosphamide/ifosfamide.

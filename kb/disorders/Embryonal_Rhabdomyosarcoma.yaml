name: Embryonal Rhabdomyosarcoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Embryonal rhabdomyosarcoma (ERMS) is the most common subtype of rhabdomyosarcoma,
  accounting for approximately 60-70% of cases. It typically affects children under
  10 years of age with favorable primary sites including orbit, head and neck, and
  genitourinary tract. ERMS is characterized by loss of heterozygosity at 11p15,
  the locus containing IGF2 and other imprinted genes. Unlike alveolar rhabdomyosarcoma,
  ERMS lacks characteristic fusion genes and instead harbors a variety of mutations
  in RAS pathway genes. ERMS generally has a better prognosis than fusion-positive
  alveolar rhabdomyosarcoma, with 5-year survival rates exceeding 70% for localized
  disease.
categories:
- Pediatric Cancer
- Soft Tissue Sarcoma
- Sarcoma
parents:
- rhabdomyosarcoma
has_subtypes:
- name: Botryoid Embryonal Rhabdomyosarcoma
  description: >-
    A variant that grows as grape-like polypoid masses in mucosal-lined hollow
    organs such as the bladder, vagina, and nasopharynx. Has the best prognosis
    among ERMS variants.
- name: Spindle Cell Embryonal Rhabdomyosarcoma
  description: >-
    A variant with elongated spindle-shaped cells. When arising in paratesticular
    region, has excellent prognosis. Some cases harbor MYOD1 mutations.
  genes:
  - preferred_term: MYOD1
    term:
      id: hgnc:7611
      label: MYOD1
- name: Anaplastic Embryonal Rhabdomyosarcoma
  description: >-
    A variant with marked nuclear pleomorphism and anaplasia. Associated with
    TP53 mutations and carries a worse prognosis.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
pathophysiology:
- name: Loss of Heterozygosity at 11p15
  description: >-
    Loss of heterozygosity (LOH) at chromosome 11p15.5 is the hallmark genetic
    event in ERMS. This region contains the imprinted IGF2 gene, and LOH results
    in loss of the maternal allele with duplication of the paternal allele,
    leading to biallelic IGF2 expression and growth factor pathway activation.
    No frequency is stated here: the sources cited on this node establish that
    the lesion is characteristic and that it commonly takes the form of paternal
    uniparental disomy, but none of them reports a share of ERMS tumours
    carrying it.
  genetic_context:
    variant_origin: SOMATIC
    allele_type: Loss of heterozygosity across the imprinted 11p15.5 interval
    functional_impact_category: UNKNOWN
    description: >-
      The transforming lesion is a somatic, region-level allelic loss with
      duplication of the paternal allele rather than a coding variant, so no
      single functional impact category describes it. It is recorded as the
      somatic event of this entry so the cell of origin derives from this
      node's cell type.
    genes:
    - preferred_term: IGF2
      term:
        id: hgnc:5466
        label: IGF2
  evidence:
  - reference: PMID:10095436
    reference_title: "[Evidence of genetic alterations in chromosome 11 in embryonal and alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    snippet: "Allelic losses of 11p15.5 are characteristic of embryonal RMS (eRMS), whereas an increase in the expression of the Igf2 gene located on 11p15.5 has regularly been observed in eRMS and alveolar RMS (aRMS)."
    explanation: "Supports characteristic 11p15.5 LOH and IGF2 dysregulation in ERMS."
  - reference: PMID:27589201
    reference_title: >-
      Paternal uniparental disomy with segmental loss of heterozygosity of
      chromosome 11 are hallmark characteristics of syndromic and sporadic
      embryonal rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a second primary ERMS tumor showed UPD limited to 11p15.5, the classical
      hallmark for ERMS
    explanation: >-
      Independent statement that 11p15.5 uniparental disomy is the classical
      hallmark lesion of embryonal rhabdomyosarcoma, and the source for the
      paternal-uniparental-disomy form of it described above.

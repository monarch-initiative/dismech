- name: MYOD1 p.Leu122Arg neomorphic mutation
  association: Oncogenic Driver Mutation defining a poor-outcome ERMS subset
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Spindle Cell Embryonal Rhabdomyosarcoma
  gene_term:
    preferred_term: MYOD1
    term:
      id: hgnc:7611
      label: MYOD1
  notes: >-
    A single recurrent somatic substitution, p.Leu122Arg, in the basic domain of
    the myogenic transcription factor MYOD1. It is neomorphic rather than a
    simple loss: the substituted residue is the one that differs between the
    myogenic and the MYC-family bHLH factors, so the mutant both blocks
    wild-type MYOD1 function and binds MYC consensus sites - a switch from
    differentiation to proliferation. The tumours are frequently spindle-cell in
    morphology, which is why this entry keys the record to that subtype, and
    they co-occur with PI3K-AKT pathway mutations.
  case_fractions:
  - population: ERMS tumours genotyped for MYOD1 Leu122Arg (Kohsaka et al.)
    case_fraction_percent: 10.0
    cohort_size: 104
    notes: 10 of 104 ERMS carried the p.Leu122Arg substitution.
    evidence:
    - reference: PMID:24793135
      reference_title: >-
        A recurrent neomorphic mutation in MYOD1 defines a clinically aggressive
        subset of embryonal rhabdomyosarcoma associated with PI3K-AKT pathway
        mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutation was detected in 8 additional cases (and confirmed as
        somatic in 6 cases with available normal DNA), resulting in an overall
        prevalence of approximately 10% (10/104)
      explanation: Gives the cohort size and the MYOD1-mutant share of ERMS.
  evidence:
  - reference: PMID:24793135
    reference_title: >-
      A recurrent neomorphic mutation in MYOD1 defines a clinically aggressive
      subset of embryonal rhabdomyosarcoma associated with PI3K-AKT pathway
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the discovery, through whole-exome sequencing, of a
      recurrent somatic mutation encoding p.Leu122Arg in the myogenic
      transcription factor MYOD1 in a distinct subset of ERMS tumors with poor
      outcomes that also often contain mutations altering PI3K-AKT pathway
      components.
    explanation: >-
      Establishes MYOD1 p.Leu122Arg as a recurrent somatic ERMS driver, its
      prognostic significance, and its co-occurrence with PI3K-AKT alterations.
  - reference: PMID:24793135
    reference_title: >-
      A recurrent neomorphic mutation in MYOD1 defines a clinically aggressive
      subset of embryonal rhabdomyosarcoma associated with PI3K-AKT pathway
      mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ERMS harboring the MYOD1 Leu122Arg mutation displayed high
      cellularity and frequent spindle cell morphology with strong positivity
      for MYOD1 by immunohistochemistry (IHC)
    explanation: >-
      Supports keying this record to the spindle cell ERMS subtype rather than
      to the entry as a whole.
  - reference: PMID:24793135
    reference_title: >-
      A recurrent neomorphic mutation in MYOD1 defines a clinically aggressive
      subset of embryonal rhabdomyosarcoma associated with PI3K-AKT pathway
      mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Previous mutagenesis studies had shown that MYOD1 with a p.Leu122Arg
      substitution can block wild-type MYOD1 function and bind to MYC consensus
      sequences, suggesting a possible switch from differentiation to
      proliferation.
    explanation: >-
      The neomorphic mechanism recorded in this record's note: the mutant both
      blocks wild-type MYOD1 and acquires MYC-like binding.

- name: IGF2 biallelic expression from 11p15 loss of imprinting
  association: Growth factor deregulated by the hallmark 11p15 lesion
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: IGF2
    term:
      id: hgnc:5466
      label: IGF2
  notes: >-
    IGF2 is bound here as a gene whose dosage is deregulated, not as a gene
    carrying a coding mutation: the lesion is loss of heterozygosity and loss of
    imprinting across 11p15.5, which converts monoallelic to biallelic IGF2
    expression. That is why the entry keeps a separate region-level record for
    the 11p15 event above and binds IGF2 to the consequence.
  evidence:
  - reference: PMID:10095436
    reference_title: "[Evidence of genetic alterations in chromosome 11 in embryonal and alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allelic losses of 11p15.5 are characteristic of embryonal RMS (eRMS),
      whereas an increase in the expression of the Igf2 gene located on
      11p15.5 has regularly been observed in eRMS and alveolar RMS (aRMS).
    explanation: >-
      Links the characteristic 11p15.5 allelic loss to increased IGF2
      expression in embryonal rhabdomyosarcoma.
- name: TP53 germline predisposition
  association: Germline predisposition, strongly enriched in the anaplastic variant
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  subtype: Anaplastic Embryonal Rhabdomyosarcoma
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: >-
    The TP53 association in ERMS is predominantly a germline predisposition
    rather than a recurrent somatic driver, and it is concentrated in the
    anaplastic variant. In the series below, every rhabdomyosarcoma arising in a
    TP53 germline carrier was nonalveolar and anaplastic, and germline TP53
    variants were found in 11 of 15 children with anaplastic rhabdomyosarcoma.
    The authors propose extending the Chompret criteria on that basis.

    Graded RISK_FACTOR rather than CAUSATIVE because a germline TP53 variant
    predisposes to a spectrum of malignancies and is neither necessary nor
    sufficient for this one. The predisposition syndrome itself is curated
    separately as Li-Fraumeni Syndrome, per the cancer-granularity rule that
    germline predisposition syndromes stay distinct from the somatic tumour
    entries they predispose to.
  evidence:
  - reference: PMID:24382691
    reference_title: "Anaplastic rhabdomyosarcoma in TP53 germline mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RMS tumors diagnosed in 11 TP53 germline mutation carriers all exhibited
      nonalveolar, anaplastic histology as evidenced by the presence of enlarged
      hyperchromatic nuclei with or without atypical mitotic figures.
    explanation: >-
      Ties germline TP53 status specifically to the anaplastic, nonalveolar
      histology this record is keyed to.
  - reference: PMID:24382691
    reference_title: "Anaplastic rhabdomyosarcoma in TP53 germline mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall frequency of TP53 germline mutations was 73% (11 of 15
      children) in pediatric patients with anRMS.
    explanation: >-
      Quantifies the germline TP53 frequency in paediatric anaplastic
      rhabdomyosarcoma.
- name: DICER1 germline predisposition
  association: Germline predisposition shared with pleuropulmonary blastoma
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE_AND_SOMATIC
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  notes: >-
    Embryonal rhabdomyosarcoma is part of the DICER1 tumour-predisposition
    spectrum, which it shares with pleuropulmonary blastoma. In the study
    below, germline DICER1 variants were present in all four children who had
    both familial pleuropulmonary blastoma and ERMS, while somatic DICER1
    variants appeared in a small minority of sporadic ERMS tumours.

    Recorded as GERMLINE_AND_SOMATIC because both allele states are reported in
    that single study, and as RISK_FACTOR rather than CAUSATIVE for the same
    reason as TP53: a germline DICER1 variant predisposes to a spectrum of
    tumours and is neither necessary nor sufficient for this one. The
    predisposition syndrome itself belongs in its own entry, not here.
  evidence:
  - reference: PMID:22180160
    reference_title: >-
      DICER1 mutations in embryonal rhabdomyosarcomas from children with and
      without familial PPB-tumor predisposition syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline DICER1 mutations were found in all four patients with familial
      PPB and 2 of 52 (3.8%) sporadic ERMS had somatic mutations.
    explanation: >-
      Gives both allele states behind this record: germline variants in the
      familial pleuropulmonary blastoma cases, somatic variants in a small
      minority of sporadic ERMS.
  - reference: PMID:22180160
    reference_title: >-
      DICER1 mutations in embryonal rhabdomyosarcomas from children with and
      without familial PPB-tumor predisposition syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Embryonal rhabdomyosarcoma (ERMS) is the most common childhood sarcoma
      and is a component of the familial pleuropulmonary blastoma
      (PPB)-predisposition syndrome.
    explanation: >-
      States the membership of ERMS in the pleuropulmonary blastoma
      predisposition spectrum, which is the framing of this record.
- name: NF1 germline predisposition
  association: Germline predisposition, observed in a small minority of treated patients
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  notes: >-
    Neurofibromatosis type 1 is named alongside TP53 and DICER1 in the standard
    list of germline predispositions to rhabdomyosarcoma. The quantitative
    evidence recorded here is an observed co-occurrence: 5 of 1,025 children
    enrolled in Intergroup Rhabdomyosarcoma Study IV had NF1.

    Read that as a share of a treatment cohort and not as a relative risk. The
    study reports no comparison against a general-population rate, so it
    establishes that the two co-occur and roughly how often among treated
    children, and not by how much NF1 raises the risk.

    PTCH1 appears in the same predisposition list but is not curated here. A
    PubMed search in September 2026 for rhabdomyosarcoma with nevoid basal cell
    carcinoma syndrome or Gorlin syndrome, and for PTCH1 germline mutation with
    rhabdomyosarcoma, returned a case report and a mouse model of Gorlin
    syndrome rather than a human series, which is thinner than the evidence
    behind the three records above.
  evidence:
  - reference: PMID:15127010
    reference_title: "Neurofibromatosis in children with Rhabdomyosarcoma: a report from the Intergroup Rhabdomyosarcoma study IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 1025 eligible patients, 5 (0.5 %) had NF1.
    explanation: >-
      The observed co-occurrence frequency of NF1 among children treated for
      rhabdomyosarcoma in a cooperative-group trial, and the whole quantitative
      basis of this record.
  - reference: PMID:24382691
    reference_title: "Anaplastic rhabdomyosarcoma in TP53 germline mutation carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In humans, genetic susceptibility to develop RMS has been linked to
      germline mutations in PTCH1, HRAS, NF1, DICER1, and TP53.
    explanation: >-
      Places NF1 in the established list of germline predispositions to
      rhabdomyosarcoma; quoted from this paper's introduction, where it
      restates established human genetics rather than reporting its own result.
- name: SLC22A18 (SLC67A1)
  association: Reported 11p15.5 candidate, not supported as an ERMS driver
  relationship_type: DISPUTED
  variant_origin: SOMATIC
  gene_term:
    preferred_term: SLC67A1
    term:
      id: hgnc:10964
      label: SLC22A18
  notes: >-
    Recorded here because MONDO asserts this gene as the somatic-mutation basis
    of embryonal rhabdomyosarcoma - `MONDO:0009993 RO:0004004 HGNC:10964` - and
    a reader comparing dismech with MONDO should find the claim addressed rather
    than absent. It is graded DISPUTED after investigation.

    What the assertion rests on is a single point mutation in a single
    rhabdomyosarcoma cell line, TE125-T, reported in 1998 in a paper whose
    subject was the transcriptional map of a 170 kb interval at 11p15.5 and
    whose own conclusion was the hedged "BWR1A may play a role in
    tumorigenesis". The same paper reports one further alteration, in a breast
    cancer cell line. There is no patient tumour series, no recurrence, and no
    functional demonstration in rhabdomyosarcoma.

    Two further considerations argue against reading it as a driver. The gene
    lies inside the 11p15.5 imprinted interval whose loss of heterozygosity is
    the hallmark somatic event of ERMS, so any alteration found there is a
    candidate for being a passenger of the regional lesion the entry already
    models. And the comprehensive rhabdomyosarcoma sequencing study of 147
    tumour/normal pairs names NRAS, KRAS, HRAS, FGFR4, PIK3CA, CTNNB1, FBXW7 and
    BCOR as the recurrently altered genes; this gene is not among them.

    Nomenclature note: HGNC renamed this gene from SLC22A18 to SLC67A1, which is
    why MONDO's axiom prints the newer symbol. The OBO build this repository
    validates against still carries SLC22A18, so `term.label` holds that value
    while `preferred_term` records the current HGNC symbol.
  evidence:
  - reference: PMID:9520460
    reference_title: >-
      Transcriptional map of 170-kb region at chromosome 11p15.5:
      identification and mutational analysis of the BWR1A gene reveals the
      presence of mutations in tumor samples.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we carried out a mutational analysis in tumor cell lines and
      Beckwith-Wiedemann syndrome samples that resulted in the identification of
      genetic alterations in the BWR1A gene: an insertion that introduced a stop
      codon in the breast cancer cell line BT549 and a point mutation in the
      rhabdomyosarcoma cell line TE125-T.
    explanation: >-
      The entirety of the primary observation behind the MONDO assertion: one
      point mutation in one rhabdomyosarcoma cell line.
  - reference: PMID:9520460
    reference_title: >-
      Transcriptional map of 170-kb region at chromosome 11p15.5:
      identification and mutational analysis of the BWR1A gene reveals the
      presence of mutations in tumor samples.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that BWR1A may play a role in tumorigenesis.
    explanation: >-
      The authors' own conclusion, which claims a possible role in tumorigenesis
      generally and not that the gene causes embryonal rhabdomyosarcoma.
  - reference: PMID:24436047
    reference_title: >-
      Comprehensive genomic analysis of rhabdomyosarcoma reveals a landscape of
      alterations affecting a common genetic axis in fusion-positive and
      fusion-negative tumors.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite a relatively low mutation rate, multiple genes were recurrently
      altered, including NRAS, KRAS, HRAS, FGFR4, PIK3CA, CTNNB1, FBXW7, and
      BCOR.
    explanation: >-
      The recurrently altered gene list from 147 rhabdomyosarcoma tumour/normal
      pairs does not include this gene, which is evidence against a recurrent
      driver role even though it is not a targeted test of the claim.

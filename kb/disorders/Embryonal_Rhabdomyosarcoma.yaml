- name: RAS Pathway Activation
  description: >-
    Activating mutations in RAS pathway genes (NRAS, KRAS, HRAS) occur in
    approximately 27% of ERMS cases. FGFR4 kinase-domain mutations were found in
    7 of 94 (7.5%) primary rhabdomyosarcoma tumours in the study that first
    reported them - note that denominator is rhabdomyosarcoma overall rather
    than ERMS specifically. These mutations drive proliferation through MAPK and
    PI3K pathway activation.
  genes:
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  - preferred_term: HRAS
    term:
      id: hgnc:5173
      label: HRAS
  - preferred_term: FGFR4
    term:
      id: hgnc:3691
      label: FGFR4
  - preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  evidence:
  - reference: PMID:34755412
    reference_title: >-
      Clinicopathologic and survival correlates of embryonal rhabdomyosarcoma
      driven by RAS/RAF mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, RAS mutations occur in 27% of ERMS, with NRAS mutations
      encompassing half of the cases.
    explanation: >-
      Directly supports activating RAS-family mutations (with NRAS
      predominating) as a common oncogenic driver subset in ERMS.
  - reference: PMID:19809159
    reference_title: >-

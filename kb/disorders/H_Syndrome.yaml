- name: Dermal histiocytic and mononuclear infiltration
  description: >-
    Skin biopsy shows hyperpigmentation of the basal layer with
    seborrheic-keratosis-like acanthosis, histiocytic infiltration, and a
    perivascular mononuclear infiltrate containing plasma cells and mast cells
    throughout the dermis and subcutaneous fat. The histiocytes are
    CD68/CD163-positive and CD1a-negative (non-Langerhans).
  diagnostic: true
  evidence:
  - reference: PMID:18410979
    reference_title: "The H syndrome: a genodermatosis characterized by indurated, hyperpigmented, and hypertrichotic skin with systemic manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cutaneous histopathologic examination showed hyperpigmentation of the
      basal layer with seborrheic-keratosis-like acanthosis, histiocytic
      infiltration, and a perivascular mononuclear infiltrate with plasma cells
      and mast cells throughout the dermis and subcutaneous fat.
    explanation: >-
      Defines the characteristic dermal histopathology of H syndrome from the
      founding clinical series.


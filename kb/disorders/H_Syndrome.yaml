discussions:
- discussion_id: openq_hsyndrome_transport_to_phenotype
  prompt: >-
    How does loss of hENT3-mediated lysosomal/mitochondrial nucleoside transport
    mechanistically produce the pleiotropic H-syndrome phenotype (histiocyte
    proliferation, dermal fibrosis, insulin-dependent diabetes, hypogonadism,
    and hearing loss)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#hENT3 (SLC29A3) Nucleoside Transporter Deficiency
  - pathophysiology#Histiocyte Activation and Tissue Infiltration
  - pathophysiology#Nucleoside-Sensing TLR Activation and MAPK/Interferon Signaling
  - pathophysiology#Impaired Autophagy and Adult Stem Cell Deficits
  rationale: >-
    Functional studies confirm that H-syndrome mutations abolish hENT3
    nucleoside transport and destabilize the protein, and hENT3 is localized to
    lysosomes and mitochondria, but the 2010 authors explicitly state that the
    precise connections between transporter dysfunction and the multiorgan
    pathophysiology remain unresolved. Two later mechanisms partially bridge
    this gap - lysosomal TLR7-driven type I interferon production (human) and
    AMPK-mTOR-ULK autophagy/adult-stem-cell deficits (mouse) - but how these
    unify the full endocrine, fibrotic, and sensorineural phenotype, and their
    relative contributions in human tissue, remain incompletely established.
  evidence:
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the precise connections between hENT3 and the pathophysiology of these
      disorders remain unresolved
    explanation: >-
      Explicitly identifies the gap between the molecular transport defect and
      the disease pathophysiology.
- discussion_id: hmm_hsyndrome_autophagy_stemcell_mouse
  prompt: >-
    Does the AMPK-mTOR-ULK autophagy defect and adult stem-cell deficit
    demonstrated in Slc29a3-null mice operate in human H syndrome, and does it
    account for the human multiorgan phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Autophagy and Adult Stem Cell Deficits
  rationale: >-
    The autophagy-regulated stem-cell-differentiation mechanism and its rescue
    by genetic/pharmacologic intervention are established in the Slc29a3-null
    mouse, but no human tissue confirmation exists. The mouse recapitulates the
    macrophage histiocytosis, yet whether the hematopoietic/mesenchymal
    stem-cell deficit drives the human endocrine, skeletal, and connective-tissue
    phenotype is unverified - evidence exists in a model, but translational
    validity to human disease is the open question.
  proposed_experiments:
  - experiment_id: exp_hsyndrome_patient_stemcell_autophagy
    name: Autophagic flux and AMPK-mTOR-ULK signaling in patient stem cells
    description: >-
      Assess autophagic flux and AMPK-mTOR-ULK pathway activity in
      patient-derived hematopoietic and mesenchymal stem/progenitor cells to
      test whether the mouse mechanism operates in human H syndrome.
  - experiment_id: exp_hsyndrome_ipsc_organoid_recapitulation
    name: Patient iPSC/organoid recapitulation of mouse stem-cell deficits
    description: >-
      Test whether the stem-cell-fate and tissue-integrity phenotypes reported
      in Slc29a3-null mice are reproduced in patient iPSC-derived organoid or
      stem-cell models.
  evidence:
  - reference: PMID:31270333
    reference_title: "Adult stem cell deficits drive Slc29a3 disorders in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we identify adult stem cell deficits that drive ENT3-related
      abnormalities in mice.
    explanation: >-
      The adult-stem-cell mechanism is demonstrated in mice; human translational
      validity is not yet established.


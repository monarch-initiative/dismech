name: H Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: H syndrome
  term:
    id: MONDO:0011273
    label: H syndrome
parents:
- Histiocytosis
- SLC29A3 spectrum disorder
description: >-
  H syndrome is a rare autosomal recessive inherited histiocytosis caused by
  biallelic loss-of-function mutations in SLC29A3, which encodes the human
  equilibrative nucleoside transporter 3 (hENT3), an intracellular
  (lysosomal/mitochondrial) nucleoside transporter that is highly expressed in
  cells of the monocyte-macrophage lineage. The syndrome is named for its
  cardinal clinical findings, most of which begin with the letter H:
  cutaneous hyperpigmentation, hypertrichosis, and induration (sclerodermatous
  plaques, classically over the medial thighs and shins while sparing the knees),
  hepatosplenomegaly, heart anomalies, hearing loss (sensorineural),
  hypogonadism (hypogonadotropic), short height (short stature/growth
  retardation), and hyperglycemia/insulin-dependent diabetes mellitus. Additional
  features include lymphadenopathy, exophthalmos/proptosis, gynecomastia, fixed
  flexion contractures of the fingers and toes (camptodactyly, hallux valgus),
  arthritis, and systemic autoinflammation. Histology shows infiltration of many
  tissues by CD68-positive, CD1a-negative (non-Langerhans) histiocytes admixed
  with lymphocytes and plasma cells and accompanied by dermal fibrosis, placing
  H syndrome in the R (Rosai-Dorfman/miscellaneous) group of the revised
  histiocytosis classification. Because of overlapping clinical and molecular
  features, H syndrome is now considered the prototype of the SLC29A3 spectrum
  disorder, which also encompasses pigmented hypertrichosis with insulin-dependent
  diabetes mellitus (PHID), Faisalabad histiocytosis (FHC), and familial
  (Rosai-Dorfman-like) sinus histiocytosis with massive lymphadenopathy.


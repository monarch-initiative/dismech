pathophysiology:
- name: hENT3 (SLC29A3) Nucleoside Transporter Deficiency
  description: >-
    Biallelic loss-of-function mutations in SLC29A3 abolish or impair the human
    equilibrative nucleoside transporter 3 (hENT3), a pH-dependent intracellular
    nucleoside/nucleobase transporter localized to lysosomal and mitochondrial
    membranes with affinity for adenosine. hENT3 normally moves nucleosides
    derived from lysosomal degradation of nucleic acids across the lysosomal
    membrane for salvage. Disease-associated mutations cause severe reductions
    or loss of nucleoside transport, compounded by mistrafficking and reduced
    stability of the mutant protein, most consequentially in the highly
    phagocytic, lysosome-rich monocyte-macrophage lineage where hENT3 is most
    abundantly expressed.
  biological_processes:
  - preferred_term: nucleoside transmembrane transport
    term:
      id: GO:1901642
      label: nucleoside transmembrane transport
    modifier: DECREASED
  - preferred_term: lysosomal transport
    term:
      id: GO:0007041
      label: lysosomal transport
    modifier: DECREASED
  evidence:
  - reference: PMID:18940313
    reference_title: "The H syndrome is caused by mutations in the nucleoside transporter hENT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping in five consanguineous families resulted in the
      identification of mutations in the SLC29A3 gene, which encodes the
      equilibrative nucleoside transporter hENT3.
    explanation: >-
      The founding study established that H syndrome is caused by SLC29A3
      mutations encoding the equilibrative nucleoside transporter hENT3.
  - reference: PMID:20140240
    reference_title: "Mutations in SLC29A3, encoding an equilibrative nucleoside transporter ENT3, cause a familial histiocytosis syndrome (Faisalabad histiocytosis) and familial Rosai-Dorfman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC29A3 encodes an intracellular equilibrative nucleoside transporter
      (hENT3) with affinity for adenosine.
    explanation: >-
      Identifies hENT3 as an intracellular equilibrative nucleoside transporter,
      the protein whose loss underlies H syndrome and related SLC29A3 disorders.
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report severe reductions/losses of hENT3 nucleoside transport functions
      of hENT3 syndrome mutants. In addition to transport alterations, we provide
      evidence for possible loss of hENT3 functions in all H and pigmented
      hypertrichotic dermatosis with insulin-dependent diabetes syndromes due to
      either mistrafficking or altered stability of mutant hENT3 proteins.
    explanation: >-
      Functional characterization shows disease mutations cause severe
      loss of nucleoside transport plus mistrafficking/instability of hENT3.
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      earlier studies identify hENT3 as a mitochondrial and a lysosomal
      nucleoside transporter
    explanation: >-
      Documents the intracellular (mitochondrial and lysosomal) localization of
      hENT3.
  downstream:
  - target: Histiocyte Activation and Tissue Infiltration
    evidence:
    - reference: PMID:37638031
      reference_title: "H syndrome treated with Tocilizumab: two case reports and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This disorder is due to loss-of-function mutations in SLC29A3 gene, which
        encode the equilibrative nucleoside transporter ENT3. This deficiency
        leads to abnormal function and proliferation of histiocytes.
      explanation: >-
        Directly links the SLC29A3/hENT3 loss-of-function defect to abnormal
        histiocyte function and proliferation.
  - target: Lysosomal TLR7 Activation and Type I Interferon Production
    evidence:
    - reference: PMID:38263041
      reference_title: "Rheumatological complaints in H syndrome: from inflammatory profiling to target treatment in a case study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SLC29A3 deficiency results in interferon production because of Toll-like
        Receptor 7 activation in lysosomes
      explanation: >-
        Links loss of hENT3-dependent lysosomal nucleoside handling to lysosomal
        TLR7 activation and type I interferon production.
  - target: Impaired Autophagy and Adult Stem Cell Deficits
    evidence:
    - reference: PMID:31270333
      reference_title: "Adult stem cell deficits drive Slc29a3 disorders in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The molecular pathogenesis stems from the loss of lysosomal adenosine
        transport, which impedes autophagy-regulated stem cell differentiation
        programs via misregulation of the AMPK-mTOR-ULK axis.
      explanation: >-
        In Slc29a3-null mice, loss of lysosomal adenosine transport impairs
        autophagy-regulated stem-cell differentiation through the AMPK-mTOR-ULK
        axis.

- name: Histiocyte Activation and Tissue Infiltration
  description: >-
    hENT3 deficiency drives abnormal function, proliferation, and survival of
    monocyte-derived macrophages/histiocytes. Affected tissues are infiltrated by
    CD68-positive, CD163-positive, S100-variable, CD1a-negative (non-Langerhans)
    histiocytes admixed with lymphocytes and plasma cells. This mononuclear
    infiltrate, together with systemic autoinflammation and elevated
    inflammatory cytokines, underlies the systemic (hepatosplenomegaly,
    lymphadenopathy, fever) and local (cutaneous, endocrine) manifestations and
    places H syndrome in the R group of histiocytoses.
  cell_types:
  - preferred_term: CD68-positive non-Langerhans histiocyte
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:37638031
    reference_title: "H syndrome treated with Tocilizumab: two case reports and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This deficiency leads to abnormal function and proliferation of
      histiocytes. H syndrome is part of the R-group of histiocytosis.
    explanation: >-
      Establishes histiocyte proliferation/dysfunction as the core cellular
      lesion and places H syndrome in the R group of histiocytoses.
  - reference: PMID:20140240
    reference_title: "Mutations in SLC29A3, encoding an equilibrative nucleoside transporter ENT3, cause a familial histiocytosis syndrome (Faisalabad histiocytosis) and familial Rosai-Dorfman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histiocytoses are a heterogeneous group of disorders characterised by
      an excessive number of histiocytes.
    explanation: >-
      Frames the SLC29A3 histiocytoses (including H syndrome) as disorders of
      excessive histiocyte accumulation.
  downstream:
  - target: Cutaneous Fibrosis and Multiorgan Involvement
    evidence:
    - reference: PMID:29041934
      reference_title: "H syndrome: 5 new cases from the United States with novel features and responses to therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        H Syndrome is an autosomal recessive disorder characterized by cutaneous
        hyperpigmentation, hypertrichosis, and induration with numerous systemic
        manifestations.
      explanation: >-
        Links the histiocytic-inflammatory process to the characteristic
        cutaneous induration and multisystem involvement.

- name: Cutaneous Fibrosis and Multiorgan Involvement
  description: >-
    Chronic histiocytic-lymphocytic infiltration of the dermis drives dermal
    fibrosis, producing the hallmark indurated, hyperpigmented, hypertrichotic
    sclerodermatous plaques over the inner thighs and lower legs. Analogous
    infiltration and inflammatory injury of endocrine tissues (pancreatic islets,
    gonads, pituitary), the inner ear, heart, and reticuloendothelial organs
    produces the multisystem H-syndrome phenotype, including
    insulin-dependent diabetes, hypogonadism, hearing loss, and organomegaly.
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: dermal extracellular matrix deposition
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      H syndrome, characterized by scleroderma, hyperpigmentation,
      hypertrichosis, hepatomegaly, cardiac abnormalities and musculoskeletal
      deformities
    explanation: >-
      Documents the sclerodermatous (fibrotic) cutaneous change alongside the
      multiorgan (hepatic, cardiac, musculoskeletal) involvement.

- name: Lysosomal TLR7 Activation and Type I Interferon Production
  description: >-
    Loss of hENT3-dependent lysosomal nucleoside handling leads to activation of
    Toll-like receptor 7 (TLR7) within the lysosome, driving type I interferon
    production. Affected patients show a high peripheral-blood interferon score,
    positioning H syndrome among the type I interferonopathies and providing the
    rationale for JAK-inhibitor (baricitinib) therapy directed at the
    interferon-driven autoinflammatory component.
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:38263041
    reference_title: "Rheumatological complaints in H syndrome: from inflammatory profiling to target treatment in a case study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      based on recent data showing that SLC29A3 deficiency results in interferon
      production because of Toll-like Receptor 7 activation in lysosomes
    explanation: >-
      Establishes lysosomal TLR7 activation and type I interferon production as
      a mechanism downstream of SLC29A3/hENT3 deficiency in H syndrome.
  - reference: PMID:38263041
    reference_title: "Rheumatological complaints in H syndrome: from inflammatory profiling to target treatment in a case study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a thorough assessment of her inflammatory profile showing a high
      interferon score, the girl received treatment with baricitinib.
    explanation: >-
      Documents a high interferon score in an H-syndrome patient and the
      resulting use of the JAK inhibitor baricitinib.

- name: Impaired Autophagy and Adult Stem Cell Deficits
  description: >-
    In Slc29a3-null mice, loss of lysosomal adenosine transport impedes
    autophagy-regulated stem-cell differentiation through misregulation of the
    AMPK-mTOR-ULK axis, altering hematopoietic and mesenchymal stem-cell fates
    (hematopoietic stem-cell exhaustion and breaches of mesodermal tissue
    integrity). This adult stem-cell deficit is proposed as a unifying primary
    driver of the ENT3 spectrum disorders beyond macrophage dysfunction, and
    genetic, pharmacologic, and stem-cell interventions ameliorate disease in
    the mouse model. Human translational validity remains to be established.
  cell_types:
  - preferred_term: Hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: Mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  - preferred_term: stem cell differentiation
    term:
      id: GO:0048863
      label: stem cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:31270333
    reference_title: "Adult stem cell deficits drive Slc29a3 disorders in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ENT3 deficiency alters hematopoietic and mesenchymal stem cell fates; the
      former leads to stem cell exhaustion, and the latter leads to breaches of
      mesodermal tissue integrity.
    explanation: >-
      Establishes that ENT3 loss alters hematopoietic and mesenchymal stem-cell
      fates in the mouse model.
  - reference: PMID:31270333
    reference_title: "Adult stem cell deficits drive Slc29a3 disorders in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic, pharmacologic and stem cell interventions ameliorate ENT3-disease
      pathologies and extend the lifespan of ENT3-deficient mice.
    explanation: >-
      Demonstrates that interventions targeting this mechanism rescue disease in
      the ENT3-deficient mouse model.


genetic:
- name: SLC29A3
  gene_term:
    preferred_term: SLC29A3
    term:
      id: hgnc:23096
      label: SLC29A3
  variant_origin: GERMLINE
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function mutations
    in SLC29A3, encoding hENT3, cause H syndrome. Inheritance is autosomal
    recessive. Reported variants span the coding sequence and include missense
    (e.g., the recurrent c.1088G>A / p.Arg363Gln allele), frameshift, nonsense,
    start-loss, and exon-level deletion classes; mutation sites concentrate in
    the C-terminal exons. Most families are consanguineous, with population
    founder alleles in Arab, North African, Middle Eastern, and South Asian
    populations. SLC29A3 is loss-of-function-tolerant in heterozygotes (gnomAD
    LOEUF approximately 1.05), consistent with the recessive model - carriers
    are healthy. Expressivity is highly variable and genotype-phenotype
    discordant: the identical homozygous c.1088G>A allele produced classic H
    syndrome in some family members and cutaneous familial Rosai-Dorfman disease
    in another, implicating unidentified genetic-background modifiers.
  evidence:
  - reference: PMID:34657628
    reference_title: "Phenotypic intrafamilial variability including H syndrome and Rosai-Dorfman disease associated with the same c.1088G > A mutation in the SLC29A3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report five new patients from a single family who present with
      phenotypes that associate features of H syndrome and Familial
      Rosai-Dorfman disease
    explanation: >-
      Documents marked intrafamilial phenotypic variability under the identical
      c.1088G>A SLC29A3 genotype, evidence for genetic-background modifiers.
  - reference: PMID:18940313
    reference_title: "The H syndrome is caused by mutations in the nucleoside transporter hENT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping in five consanguineous families resulted in the
      identification of mutations in the SLC29A3 gene, which encodes the
      equilibrative nucleoside transporter hENT3.
    explanation: >-
      Establishes SLC29A3 as the causative gene identified by homozygosity
      mapping in consanguineous families.
  - reference: PMID:19336477
    reference_title: "SLC29A3 gene is mutated in pigmented hypertrichosis with insulin-dependent diabetes mellitus syndrome and interacts with the insulin signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that PHID is allelic with a related syndrome without diabetes
      mellitus, H syndrome.
    explanation: >-
      Confirms H syndrome and PHID are allelic SLC29A3 disorders.


pathophysiology:
- name: hENT3 (SLC29A3) Nucleoside Transporter Deficiency
  description: >-
    Biallelic loss-of-function mutations in SLC29A3 abolish or impair the human
    equilibrative nucleoside transporter 3 (hENT3), a pH-dependent intracellular
    nucleoside/nucleobase transporter localized to lysosomal and mitochondrial
    membranes with affinity for adenosine. hENT3 normally moves nucleosides
    derived from lysosomal degradation of nucleic acids across the lysosomal
    membrane for salvage. Disease-associated mutations cause severe reductions
    or loss of nucleoside transport, compounded by mistrafficking and reduced
    stability of the mutant protein, most consequentially in the highly
    phagocytic, lysosome-rich monocyte-macrophage lineage where hENT3 is most
    abundantly expressed.
  biological_processes:
  - preferred_term: nucleoside transmembrane transport
    term:
      id: GO:1901642
      label: nucleoside transmembrane transport
    modifier: DECREASED
  - preferred_term: lysosomal transport
    term:
      id: GO:0007041
      label: lysosomal transport
    modifier: DECREASED
  evidence:
  - reference: PMID:18940313
    reference_title: "The H syndrome is caused by mutations in the nucleoside transporter hENT3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping in five consanguineous families resulted in the
      identification of mutations in the SLC29A3 gene, which encodes the
      equilibrative nucleoside transporter hENT3.
    explanation: >-
      The founding study established that H syndrome is caused by SLC29A3
      mutations encoding the equilibrative nucleoside transporter hENT3.
  - reference: PMID:20140240
    reference_title: "Mutations in SLC29A3, encoding an equilibrative nucleoside transporter ENT3, cause a familial histiocytosis syndrome (Faisalabad histiocytosis) and familial Rosai-Dorfman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLC29A3 encodes an intracellular equilibrative nucleoside transporter
      (hENT3) with affinity for adenosine.
    explanation: >-
      Identifies hENT3 as an intracellular equilibrative nucleoside transporter,
      the protein whose loss underlies H syndrome and related SLC29A3 disorders.
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report severe reductions/losses of hENT3 nucleoside transport functions
      of hENT3 syndrome mutants. In addition to transport alterations, we provide
      evidence for possible loss of hENT3 functions in all H and pigmented
      hypertrichotic dermatosis with insulin-dependent diabetes syndromes due to
      either mistrafficking or altered stability of mutant hENT3 proteins.
    explanation: >-
      Functional characterization shows disease mutations cause severe
      loss of nucleoside transport plus mistrafficking/instability of hENT3.
  - reference: PMID:20595384
    reference_title: "Human equilibrative nucleoside transporter-3 (hENT3) spectrum disorder mutations impair nucleoside transport, protein localization, and stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      earlier studies identify hENT3 as a mitochondrial and a lysosomal
      nucleoside transporter
    explanation: >-
      Documents the intracellular (mitochondrial and lysosomal) localization of
      hENT3.
  downstream:

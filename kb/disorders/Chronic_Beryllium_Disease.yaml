name: Chronic Beryllium Disease
creation_date: "2026-07-16T00:00:00Z"
category: Respiratory Disease
parents:
- Respiratory Disease
- Lung Disease
- Pneumoconiosis
disease_term:
  preferred_term: chronic beryllium disease
  term:
    id: MONDO:0015274
    label: chronic beryllium disease
description: >-
  Chronic beryllium disease (CBD, berylliosis) is a granulomatous interstitial
  lung disease caused by a beryllium-specific, cell-mediated (delayed-type,
  type IV) immune response to inhaled beryllium. It is the archetypal
  gene-environment disease: inhaled beryllium is presented by HLA-DP molecules
  carrying a glutamic acid at position 69 of the beta chain (HLA-DPB1 Glu69),
  which creates the acidic pocket that binds beryllium and displays a
  beryllium-modified self-peptide neoantigen to CD4+ T cells. The resulting
  beryllium-specific CD4+ T-helper-1 response (detected as beryllium
  sensitization by the beryllium lymphocyte proliferation test) drives
  interferon-gamma and TNF secretion, macrophage activation, and the assembly of
  non-caseating granulomas in the lung that progress to interstitial fibrosis.
  Beryllium sensitization precedes and is necessary but not sufficient for the
  organ disease; a subset of sensitized individuals progress to CBD. CBD is
  clinically and histologically nearly indistinguishable from sarcoidosis and is
  distinguished by a documented beryllium exposure plus a positive
  beryllium-specific lymphocyte response.
synonyms:
- berylliosis
- chronic berylliosis
- chronic beryllium lung disease
environmental:
- name: Occupational beryllium inhalation
  exposure_term:
    preferred_term: exposure to beryllium
    term:
      id: ECTO:9000941
      label: exposure to beryllium
  environment_context:
    preferred_term: beryllium-containing dust and fume
    term:
      id: ENVO:00002008
      label: dust
  chemicals:
  - beryllium
  description: >-
    Inhalation of airborne beryllium dust, fume, or particulate is the sole
    cause. At-risk work includes beryllium extraction and machining,
    aerospace and defense manufacturing, nuclear-weapons and reactor work,
    electronics, dental-alloy and ceramics fabrication, and metal recycling.
    Unlike the classic fibrogenic pneumoconioses, risk is not simply
    cumulative-dose dependent: even brief or low-level exposures can sensitize a
    genetically susceptible person, and particle size, solubility, and surface
    area modulate immunogenicity. Paraoccupational (take-home) and near-facility
    community exposures are also documented.
  evidence:
  - reference: PMID:25398119
    reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exposure to beryllium can lead to sensitization (BeS) and chronic beryllium disease (CBD)."
    explanation: >-
      The official ATS statement establishes inhaled-beryllium exposure as the
      cause of sensitization and CBD. Evidence source is OTHER because this is a
      professional-society consensus statement.
  influences_mechanisms:
  - target: Inhaled Beryllium Particle Deposition and Alveolar Macrophage Uptake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Airborne beryllium dust, fume, or particulate is the only route by which
      beryllium reaches the distal airways, so occupational inhalation is what
      places the persistent indigestible stimulus inside alveolar macrophages.
    evidence:
    - reference: PMID:25398119
      reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Exposure to beryllium can lead to sensitization (BeS) and chronic beryllium disease (CBD)."
      explanation: >-
        A professional-society consensus statement that beryllium exposure
        leads to sensitization and to chronic beryllium disease, which is the
        exposure arm this edge asserts. Evidence source is OTHER because the
        statement is consensus guidance rather than a primary study. No source
        cached for this entry documents the particle-deposition step itself.
pathophysiology:
- name: Inhaled Beryllium Particle Deposition and Alveolar Macrophage Uptake
  role: trigger
  conforms_to: "granuloma_formation#Persistent Indigestible Stimulus"
  description: >-
    Inhaled beryllium particles deposit in the distal airways and alveoli, where
    they are taken up by alveolar macrophages and dendritic cells. Beryllium is a
    poorly soluble, biopersistent metal that the macrophage cannot degrade or
    clear, so it acts as a persistent indigestible stimulus that sustains a
    chronic, rather than self-limited, macrophage response - the disease-specific
    substitution for the generic persistent stimulus of the granuloma module.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: chronic inflammatory response
    term:
      id: GO:0002544
      label: chronic inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:20356827
    reference_title: "Crystal structure of HLA-DP2 and implications for chronic beryllium disease."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Chronic beryllium disease (CBD) is a fibrotic lung disorder caused by beryllium (Be) exposure and is characterized by granulomatous inflammation and the accumulation of Be-responsive CD4(+) T cells in the lung."
    explanation: >-
      Establishes inhaled beryllium as the cause of the CBD granulomatous
      response, i.e. the persistent stimulus. Support is PARTIAL because the
      snippet identifies beryllium as the causal stimulus but does not itself
      document alveolar deposition or macrophage uptake; those specifics are
      standard particle-clearance biology. Evidence source is IN_VITRO because
      this is a structural/biochemical study of the HLA-DP2 molecule.
  downstream:
  - target: Beryllium-Modified Self-Peptide Neoantigen Formation
- name: Beryllium-Modified Self-Peptide Neoantigen Formation
  role: mechanism
  description: >-
    Within the antigen-presenting cell, ionic beryllium (Be2+) is incorporated
    into the peptide-binding groove of HLA-DP class II molecules, coordinating
    with acidic residues of the HLA-DP beta chain and a bound self-peptide. Rather
    than acting as a classical hapten that modifies a protein covalently,
    beryllium is buried at the interface between the HLA-DP molecule and the
    peptide, altering the surface chemistry and conformation of the peptide-MHC
    complex so that it is seen as a neoantigen. This creates the antigenic
    determinant that beryllium-specific T cells recognize.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
    modifier: INCREASED
  evidence:
  - reference: PMID:24995984
    reference_title: "Structural basis of chronic beryllium disease: linking allergic hypersensitivity and autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the T cell ligand is created when a Be(2+) cation becomes buried in an HLA-DP2/peptide complex, where it is coordinated by both MHC and peptide acidic amino acids."
    explanation: >-
      Directly demonstrates that beryllium forms a neoantigen by becoming buried
      in the HLA-DP2/peptide complex, coordinated by MHC and peptide acidic
      residues. Evidence source is IN_VITRO because it is a structural/biochemical
      study of the beryllium-loaded HLA-DP2 complex.
  - reference: PMID:24995984
    reference_title: "Structural basis of chronic beryllium disease: linking allergic hypersensitivity and autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the TCR does not interact with the Be(2+) itself, but rather with surface changes induced by the firmly bound Be(2+)"
    explanation: >-
      Shows the T-cell receptor recognizes surface changes induced by bound
      beryllium rather than the cation itself, defining the neoantigenic
      determinant. Evidence source is IN_VITRO (structural study).
  downstream:
  - target: HLA-DP Glu69-Restricted Antigen Presentation
- name: HLA-DP Glu69-Restricted Antigen Presentation
  role: mechanism
  description: >-
    Presentation of the beryllium-modified neoantigen is restricted to HLA-DP
    molecules whose beta chain carries a glutamic acid (a negatively charged
    residue) at position 69 (HLA-DPB1 Glu69, e.g. HLA-DPB1*02:01, *06:01, *17:01).
    The Glu69 residue lines an acidic pocket that is required to coordinate the
    positively charged beryllium cation; HLA-DP molecules lacking Glu69 cannot
    bind beryllium and do not present it. This single genetic feature explains the
    dominant heritable susceptibility to sensitization and disease and is the
    molecular basis of the gene-environment interaction.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
    modifier: INCREASED
  evidence:
  - reference: PMID:20356827
    reference_title: "Crystal structure of HLA-DP2 and implications for chronic beryllium disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an unusual solvent exposed acidic pocket formed between the peptide backbone and the HLA-DP2 beta-chain alpha-helix and containing three glutamic acids from the beta-chain, including betaGlu69"
    explanation: >-
      The HLA-DP2 crystal structure reveals the acidic pocket containing betaGlu69
      that is the proposed beryllium-coordination site. Evidence source is
      IN_VITRO (crystallographic study).
  - reference: PMID:20356827
    reference_title: "Crystal structure of HLA-DP2 and implications for chronic beryllium disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutation of any of the three glutamic acids in this pocket results in loss of the ability of DP2 to present Be to T cells."
    explanation: >-
      Mutating the pocket glutamic acids abolishes beryllium presentation,
      establishing the Glu69 acidic pocket as required for presentation. Evidence
      source is IN_VITRO (mutagenesis of the HLA-DP2 molecule).
  - reference: PMID:16272364
    reference_title: "Beryllium presentation to CD4+ T cells is dependent on a single amino acid residue of the MHC class II beta-chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a single amino acid residue of the MHC class II beta-chain dictates beryllium presentation and potentially, disease susceptibility."
    explanation: >-
      Demonstrates that a single MHC class II beta-chain residue (Glu69) governs
      beryllium presentation. Evidence source is IN_VITRO because presentation was
      dissected in fibroblasts expressing mutated HLA-DP molecules.
  downstream:
  - target: Beryllium-Specific CD4+ T Cell Sensitization
- name: Beryllium-Specific CD4+ T Cell Sensitization
  role: mechanism
  description: >-
    Recognition of the HLA-DP/Glu69-presented beryllium neoantigen by the T-cell
    receptor of naive CD4+ T cells drives their clonal expansion into a
    beryllium-specific memory/effector population. This antigen-driven expansion
    is beryllium sensitization (BeS), the immunological state that precedes organ
    disease and is measured clinically by the beryllium lymphocyte proliferation
    test (BeLPT), in which a patient's blood or lung lymphocytes proliferate on
    exposure to beryllium salts in vitro. Sensitization is necessary but not
    sufficient for CBD.
  cell_types:
  - preferred_term: beryllium-specific CD4+ T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell proliferation
    term:
      id: GO:0042098
      label: T cell proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:8105536
    reference_title: "HLA-DPB1 glutamate 69: a genetic marker of beryllium disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic beryllium disease (CBD) is a lung disorder related to beryllium exposure and is characterized by the accumulation in the lung of beryllium-specific CD4+ major histocompatibility complex (MHC) class II-restricted T lymphocytes."
    explanation: >-
      Documents accumulation of beryllium-specific, MHC-class-II-restricted CD4+
      T cells in the lung - the sensitized effector population. Evidence source is
      HUMAN_CLINICAL (CBD patient cohort).
  - reference: PMID:25398119
    reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The beryllium lymphocyte proliferation test is the cornerstone of both medical surveillance and the diagnosis of BeS and CBD"
    explanation: >-
      The beryllium lymphocyte proliferation test detects the beryllium-specific
      T-cell proliferation that defines sensitization. Evidence source is OTHER
      (professional-society consensus statement).
  - reference: PMID:26129650
    reference_title: "Metal-specific CD4+ T-cell responses induced by beryllium exposure in HLA-DP2 transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using HLA-DP2 transgenic (Tg) mice, we developed a model of CBD that replicates the major features of the human disease."
    explanation: >-
      An HLA-DP2 transgenic mouse model reproduces beryllium-specific CD4+ T-cell
      responses, recapitulating the sensitization step in vivo. Evidence source is
      MODEL_ORGANISM (HLA-DP2 transgenic mice).
  downstream:
  - target: Beryllium-Specific Th1 Cytokine Response
- name: Beryllium-Specific Th1 Cytokine Response
  role: amplifier
  description: >-
    On re-encounter with beryllium in the lung, the expanded beryllium-specific
    CD4+ T cells polarize to a T-helper-1 effector phenotype and secrete
    interferon-gamma, tumor necrosis factor, and interleukin-2. These are
    predominantly effector-memory Th1 cells that accumulate in the bronchoalveolar
    space, producing the compartmentalized, beryllium-driven Th1 cytokine milieu
    that licenses macrophage activation and granuloma formation. This cytokine
    output is the disease-specific engine upstream of the conserved
    granuloma-formation amplifier.
  cell_types:
  - preferred_term: beryllium-specific T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  biological_processes:
  - preferred_term: type II interferon production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: INCREASED
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  evidence:
  - reference: PMID:16272364
    reference_title: "Beryllium presentation to CD4+ T cells is dependent on a single amino acid residue of the MHC class II beta-chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HLA-DP Glu69- and HLA-DR Glu71-expressing molecules are capable of inducing beryllium-specific proliferation and IFN-gamma expression by lung CD4+ T cells."
    explanation: >-
      Beryllium presentation drives proliferation and interferon-gamma expression
      by lung CD4+ T cells, the Th1 cytokine output of this node. Evidence source
      is IN_VITRO (ex vivo lung CD4+ T cells stimulated in culture).
  downstream:
  - target: Th1 and TNF-Driven Macrophage Recruitment and Activation
- name: Th1 and TNF-Driven Macrophage Recruitment and Activation
  role: amplifier
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  description: >-
    Interferon-gamma and TNF from the beryllium-specific Th1 cells classically
    activate lung macrophages and recruit additional monocytes to the site.
    TNF is the non-redundant amplifier that organizes the granulomatous response.
    This activated, cytokine-rich macrophage compartment is the conserved
    amplifier step of the granuloma module, here driven specifically by the
    beryllium-antigen-specific T-cell response.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  evidence:
  - reference: PMID:16272364
    reference_title: "Beryllium presentation to CD4+ T cells is dependent on a single amino acid residue of the MHC class II beta-chain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by a CD4+ T cell alveolitis and granulomatous inflammation in the lung"
    explanation: >-
      Characterizes CBD as a CD4+ T-cell alveolitis with granulomatous
      inflammation, linking the beryllium-specific T-cell response to macrophage
      granulomatous activation. Evidence source is OTHER because this is a
      background disease characterization within an immunology study.
  downstream:
  - target: Epithelioid Transformation and Multinucleated Giant Cell Formation
- name: Epithelioid Transformation and Multinucleated Giant Cell Formation
  role: central_effector
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  description: >-
    In the activated milieu the lung macrophages undergo the defining
    transformations of the granulomatous response: they differentiate into
    interdigitated epithelioid cells and fuse into multinucleated giant cells
    (including the asteroid- and Schaumann-body-containing giant cells seen in
    beryllium and sarcoid granulomas). This converts a diffuse mononuclear
    infiltrate into the organized cellular core of a granuloma.
  cell_types:
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0002150
      label: epithelioid macrophage
  - preferred_term: multinucleated giant cell
    term:
      id: CL:0000647
      label: multinucleated giant cell
  biological_processes:
  - preferred_term: syncytium formation by cell-cell fusion
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
    modifier: INCREASED
  evidence:
  - reference: PMID:25007084
    reference_title: "Sarcoidosis and chronic beryllium disease: similarities and differences."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "granulomatous lung disease that may be pathologically and clinically indistinguishable from pulmonary sarcoidosis, except through use of immunologic testing, such as the beryllium lymphocyte proliferation test"
    explanation: >-
      CBD granulomas are histopathologically indistinguishable from sarcoidosis,
      i.e. compact epithelioid/giant-cell granulomas. Support is PARTIAL because
      the snippet establishes granulomatous histology but does not itself detail
      giant-cell fusion. Evidence source is OTHER (review).
  downstream:
  - target: Noncaseating Granuloma Assembly
- name: Noncaseating Granuloma Assembly
  role: effector
  conforms_to: "granuloma_formation#Organized Granuloma Assembly"
  description: >-
    The transformed macrophages assemble into compact, well-formed
    non-caseating granulomas - an epithelioid/giant-cell core cuffed by CD4+ T
    lymphocytes - distributed along the bronchovascular bundles and interlobular
    septa of the lung and in the hilar lymph nodes. Unlike the caseating
    granulomas of tuberculosis, CBD granulomas characteristically lack central
    caseous necrosis, matching the non-caseating pattern of sarcoidosis and making
    the two histologically indistinguishable.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: CD4+ T lymphocyte
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:25398119
    reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BeS with evidence of a granulomatous inflammatory response in the lung is diagnostic of CBD"
    explanation: >-
      A granulomatous inflammatory response in the lung defines CBD, the
      organized-granuloma effector of this chain. Evidence source is OTHER
      (professional-society consensus statement).
  - reference: PMID:25007084
    reference_title: "Sarcoidosis and chronic beryllium disease: similarities and differences."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "granulomatous lung disease that may be pathologically and clinically indistinguishable from pulmonary sarcoidosis"
    explanation: >-
      Confirms the mature CBD granuloma is a well-formed non-caseating granuloma
      matching sarcoidosis. Evidence source is OTHER (review).
  downstream:
  - target: Progressive Pulmonary Fibrosis and Restrictive Lung Disease
- name: Progressive Pulmonary Fibrosis and Restrictive Lung Disease
  role: consequence
  conforms_to: "granuloma_formation#Tissue Containment versus Destruction and Fibrosis"
  description: >-
    Because the beryllium stimulus cannot be cleared, the granulomatous response
    persists and, in a subset of patients, drives progressive interstitial
    fibrosis. Fibroblast recruitment and excessive collagen deposition around and
    between granulomas produce a restrictive ventilatory defect with impaired gas
    exchange, progressive dyspnea, and, in advanced disease, respiratory failure
    and cor pulmonale. This fibrotic end state is the pathological (destructive)
    arm of the granuloma module's containment-versus-destruction consequence.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  evidence:
  - reference: PMID:20356827
    reference_title: "Crystal structure of HLA-DP2 and implications for chronic beryllium disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Chronic beryllium disease (CBD) is a fibrotic lung disorder caused by beryllium (Be) exposure"
    explanation: >-
      Identifies CBD as a fibrotic lung disorder, the fibrotic end state of the
      granulomatous response. Evidence source is IN_VITRO (structural study whose
      abstract characterizes the disease).
  - reference: PMID:25398119
    reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Corticosteroid therapy is typically administered when a patient with CBD exhibits evidence of significant lung function abnormality or decline"
    explanation: >-
      Progressive lung-function abnormality/decline is the clinical correlate of
      the fibrotic consequence. Evidence source is OTHER (consensus statement).

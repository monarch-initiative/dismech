discussions:
- discussion_id: gap_cbd_sensitization_to_disease_progression
  prompt: >-
    What determines whether a beryllium-sensitized individual progresses to
    chronic beryllium disease? Beryllium sensitization is necessary but not
    sufficient for organ disease, yet the host, exposure, and immunologic
    factors that convert the sub-clinical beryllium-specific T-cell response
    into progressive granulomatous lung disease are not defined.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Beryllium-Specific CD4+ T Cell Sensitization
  - pathophysiology#Noncaseating Granuloma Assembly
  - pathophysiology#Progressive Pulmonary Fibrosis and Restrictive Lung Disease
  rationale: >-
    Roughly half of sensitized workers already have CBD at first evaluation, and
    in longitudinal follow-up a substantial minority of the remainder convert to
    disease over several years, with no consistent difference in age, sex,
    smoking, or measured exposure time between progressors and non-progressors.
    Because the beryllium-specific CD4+ Th1 response is present in both
    sensitization and disease, the step that tips a contained immune response
    into destructive, fibrosing granulomatous inflammation is the central
    unresolved question - relevant to whether early immunomodulation of sensitized
    but disease-free individuals could prevent CBD.
  proposed_experiments:
  - experiment_id: exp_cbd_progression_immune_biomarkers
    name: Longitudinal immunophenotyping of beryllium-sensitized workers to predict CBD conversion
    description: >-
      Prospectively follow a cohort of beryllium-sensitized but disease-free
      workers with serial bronchoalveolar lavage and blood sampling, tracking
      beryllium-specific CD4+ T-cell frequency, effector-memory/regulatory T-cell
      balance, IFN-gamma/TNF cytokine output, and HLA-DP Glu69 allele affinity, to
      identify immunologic determinants that predict progression to biopsy-proven
      granulomatous CBD versus stable sensitization.
  evidence:
  - reference: PMID:15374840
    reference_title: "Beryllium sensitization progresses to chronic beryllium disease: a longitudinal study of disease risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease developed in 17 sensitized individuals (31%) within an average follow-up period of 3.8 years (range, 1.0-9.5 years)."
    explanation: >-
      Longitudinal evidence that a substantial minority of beryllium-sensitized
      individuals progress to CBD over a few years, framing progression
      determinants as an open question. Evidence source is HUMAN_CLINICAL
      (longitudinal patient cohort).
  - reference: PMID:15374840
    reference_title: "Beryllium sensitization progresses to chronic beryllium disease: a longitudinal study of disease risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50% of individuals with beryllium sensitization have chronic beryllium disease at the time of their initial clinical evaluation"
    explanation: >-
      Documents that about half of sensitized individuals already have CBD at
      first evaluation, underscoring that sensitization precedes but does not
      guarantee disease. Evidence source is HUMAN_CLINICAL.
- discussion_id: mismatch_cbd_hla_dp2_transgenic_mouse_fibrosis
  prompt: >-
    Does the HLA-DP2 transgenic mouse model of chronic beryllium disease, which
    reproduces beryllium-specific CD4+ T-cell responses and granulomatous
    inflammation, also faithfully reproduce the progressive interstitial fibrosis
    that drives human CBD morbidity - or is the fibrotic end stage the point of
    divergence between the animal model and human disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Beryllium-Specific CD4+ T Cell Sensitization
  - pathophysiology#Noncaseating Granuloma Assembly
  - pathophysiology#Progressive Pulmonary Fibrosis and Restrictive Lung Disease
  rationale: >-
    The HLA-DP2 transgenic mouse is the flagship in-vivo model that links the
    HLA-DP Glu69 genetic lesion to a beryllium-specific CD4+ T-cell response and
    granulomatous lung inflammation, validating the upstream immunologic arm of
    the disease. However, the immunologic sensitization/granuloma steps are far
    better recapitulated in the model than the downstream, chronic fibrotic
    remodeling that determines long-term human outcome. Whether the fibrotic
    consequence node is model-faithful is therefore mechanistically important:
    if murine granulomas resolve or fail to progress to human-like fibrosis, the
    model is well suited to studying antigen recognition and early granuloma
    biology but a weaker platform for testing anti-fibrotic interventions in CBD.
  proposed_experiments:
  - experiment_id: exp_cbd_dp2_mouse_fibrosis_fidelity
    name: Longitudinal fibrosis phenotyping of beryllium-exposed HLA-DP2 transgenic mice versus human CBD
    description: >-
      Expose HLA-DP2 transgenic mice to beryllium oxide and follow them
      longitudinally with quantitative histologic fibrosis scoring, hydroxyproline
      collagen assays, and lung mechanics, benchmarking the trajectory against
      human CBD explant/biopsy fibrosis and pulmonary-function decline to
      determine whether and when the murine model diverges from the human fibrotic
      end stage.
  evidence:
  - reference: PMID:26129650
    reference_title: "Metal-specific CD4+ T-cell responses induced by beryllium exposure in HLA-DP2 transgenic mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using HLA-DP2 transgenic (Tg) mice, we developed a model of CBD that replicates the major features of the human disease."
    explanation: >-
      Establishes the HLA-DP2 transgenic mouse as a model that replicates the
      major (chiefly immunologic) features of CBD, making the fidelity of its
      downstream fibrotic phenotype the open translational question. Evidence
      source is MODEL_ORGANISM.

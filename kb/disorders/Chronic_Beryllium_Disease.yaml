genetic:
- name: HLA-DPB1
  gene_term:
    preferred_term: HLA-DPB1
    term:
      id: hgnc:4940
      label: HLA-DPB1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    HLA-DPB1 alleles encoding a glutamic acid at position 69 of the beta chain
    (HLA-DPB1 Glu69) are the dominant genetic risk factor for beryllium
    sensitization and chronic beryllium disease. The Glu69 acidic pocket
    coordinates the beryllium cation and is required to present the
    beryllium-modified neoantigen to CD4+ T cells. Higher-affinity Glu69 alleles
    (e.g. HLA-DPB1*17:01, *02:01) confer greater risk, and gene copy/expression
    level further modulates susceptibility. This is a susceptibility locus, not a
    Mendelian cause: exposure is required for disease.
  evidence:
  - reference: PMID:8105536
    reference_title: "HLA-DPB1 glutamate 69: a genetic marker of beryllium disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among CBD cases, 97 percent expressed the HLA-DPB1*0201-associated glutamic acid (unaffected population, 30 percent; P < 0.001) at residue 69"
    explanation: >-
      The founding case-control observation that HLA-DPB1 glutamate-69 is
      markedly over-represented in CBD (97% vs 30%), establishing it as the
      dominant genetic susceptibility marker. Evidence source is HUMAN_CLINICAL.
  - reference: PMID:31743304
    reference_title: "Lack of an Exposure Response and Interaction With HLA-DPb1 and DRb1 Polymorphisms in the Development of Beryllium Toxicity in a High Beryllium Exposure Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BES and CBD were significantly associated with presence of DPβE69"
    explanation: >-
      A later matched case-control study confirms the significant association of
      HLA-DP Glu69 with both sensitization and CBD. Evidence source is
      HUMAN_CLINICAL.
  - reference: PMID:16272364
    reference_title: "Beryllium presentation to CD4+ T cells is dependent on a single amino acid residue of the MHC class II beta-chain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic susceptibility to this disease has been linked with HLA-DP alleles, particularly those possessing a glutamic acid at position 69 (Glu69) of the beta-chain"
    explanation: >-
      Ties the genetic susceptibility to the Glu69-bearing HLA-DP alleles that
      present beryllium. Evidence source is IN_VITRO (mechanistic immunology
      study).
treatments:
- name: Beryllium exposure cessation
  description: >-
    Removal from further beryllium exposure is the essential first intervention
    for anyone sensitized or with CBD, limiting antigen re-exposure that drives
    the beryllium-specific T-cell response.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
- name: Systemic corticosteroid therapy
  description: >-
    Oral glucocorticoids (typically prednisone) are the mainstay pharmacotherapy
    for symptomatic or progressive CBD, suppressing the granulomatous
    inflammation and stabilizing or improving lung function.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  evidence:
  - reference: PMID:25398119
    reference_title: "An official American Thoracic Society statement: diagnosis and management of beryllium sensitivity and chronic beryllium disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Corticosteroid therapy is typically administered when a patient with CBD exhibits evidence of significant lung function abnormality or decline"
    explanation: >-
      The ATS statement identifies corticosteroid therapy as the standard
      treatment for CBD with significant lung-function abnormality or decline.
      Evidence source is OTHER (consensus statement).
- name: Steroid-sparing immunosuppression
  description: >-
    Methotrexate and other steroid-sparing immunosuppressants are used to reduce
    corticosteroid burden in patients requiring long-term therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
- name: TNF inhibitor therapy
  description: >-
    TNF-neutralizing biologics (e.g. infliximab) have been used in refractory
    granulomatous disease, targeting the TNF-driven macrophage activation that
    initiates and maintains the granuloma; benefit in CBD is less established than
    in sarcoidosis and infection risk is a concern.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-TNF monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Th1 and TNF-Driven Macrophage Recruitment and Activation
    treatment_effect: INHIBITS
    description: >-
      TNF neutralization removes the non-redundant amplifier of the granulomatous
      response, impairing granuloma initiation and maintenance.
  evidence:
  - reference: PMID:22974830
    reference_title: "Infliximab therapy modulates an antigen-specific immune response in chronic beryllium disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These changes suggest that infliximab therapy may decrease lung inflammation and the number of pathogenic, Be-responsive CD4+ cells recruited to the target organ."
    explanation: >-
      A pilot clinical trial of the TNF inhibitor infliximab in CBD showed
      reduced lung inflammation and fewer beryllium-responsive CD4+ T cells,
      supporting TNF blockade of the macrophage-activation node. Evidence source
      is HUMAN_CLINICAL (placebo-controlled trial in CBD patients).
- name: Lung transplantation
  description: >-
    Lung transplantation is an option for end-stage fibrotic CBD with respiratory
    failure refractory to medical therapy.
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
- name: Supportive care
  description: >-
    Supportive measures - supplemental oxygen for hypoxemia, pulmonary
    rehabilitation, and management of comorbidities and complications such as
    pulmonary hypertension - address symptoms and functional impairment in
    progressive CBD independent of immunosuppression.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

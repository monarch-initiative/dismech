- name: Impaired Myocardial Long-Chain Fatty Acid Utilization and Energy Failure
  biological_scale: CELLULAR
  description: >-
    Reduced intracellular release and washout of long-chain fatty acids in
    ATGL-deficient cardiomyocytes impairs myocardial fatty acid utilization and
    bioenergetics, promoting left ventricular dysfunction and electrical
    instability.
  notes: >-
    GO:0006635 (fatty acid beta-oxidation, DECREASED) captures the inferred
    downstream bioenergetic consequence of defective intracellular long-chain
    fatty acid release and washout from cytoplasmic triacylglycerol stores in
    ATGL-deficient cardiomyocytes rather than a primary defect of mitochondrial
    beta-oxidation enzymes.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:

pathophysiology:
- name: PNPLA2/ATGL Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic PNPLA2 variants reduce adipose triglyceride lipase (ATGL)
    catalytic activity on cytoplasmic lipid droplets, impairing the
    rate-limiting intracellular hydrolysis of triacylglycerol to release
    long-chain fatty acids as a major myocardial energy substrate.

  mondo_mappings:
  - term:
      id: MONDO:0035423
      label: primary triglyceride deposit cardiomyovasculopathy
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
parents:
- Neutral Lipid Storage Disease
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Primary TGCV presents clinically with adult-onset severe lipid-storage
      cardiomyopathy, diffuse concentric coronary artery disease, ventricular
      arrhythmias, and intractable heart failure.
    evidence:
    - reference: PMID:31186072
      reference_title: "Triglyceride deposit cardiomyovasculopathy: a rare cardiovascular disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The present first registry-based study showed that TGCV is an intractable, at least at the moment, and heterogeneous cardiovascular disorder."
      explanation: >-
        Establishes TGCV as a primary intractable cardiovascular disorder.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Primary TGCV is an inborn error of intracellular triacylglycerol
      lipolysis caused by biallelic PNPLA2 (adipose triglyceride lipase)
      variants.
    evidence:
    - reference: ORPHA:565612
      reference_title: "Primary triglyceride deposit cardiomyovasculopathy"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A rare inborn error of metabolism characterized by massive accumulation of triglycerides in the myocardium and coronary arteries, while plasma triglyceride levels are normal."
      explanation: >-
        Defines primary TGCV as an inborn error of triglyceride metabolism.
  icimd_category:
  - classification_value: glycerolipid_metabolism
    notes: >-
      ATGL (PNPLA2) catalyzes the rate-limiting initial hydrolysis of
      cytoplasmic triacylglycerol (a glycerolipid), placing P-TGCV in the ICIMD
      glycerolipid metabolism group alongside neutral lipid storage disease with
      myopathy.
    evidence:
    - reference: PMID:31186072
      reference_title: "Triglyceride deposit cardiomyovasculopathy: a rare cardiovascular disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Triglyceride deposit cardiomyovasculopathy (TGCV) is a phenotype primarily\nreported in patients carrying genetic mutations in PNPLA2 encoding adipose\ntriglyceride lipase (ATGL) which releases long chain fatty acid (LCFA) as a\nmajor energy source by the intracellular TG hydrolysis."
      explanation: >-
        Confirms defective intracellular triacylglycerol hydrolysis due to
        PNPLA2/ATGL mutations.

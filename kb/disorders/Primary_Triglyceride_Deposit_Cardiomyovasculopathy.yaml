treatments:
- name: Tricaprin (CNT-01)
  description: >-
    Investigational oral medium-chain triglyceride therapy (tricaprin; CNT-01)
    that facilitates intracellular myocardial and vascular triglyceride
    lipolysis, rescuing left ventricular dysfunction in Atgl-knockout mice and
    regressing diffuse triglyceride-deposit coronary atherosclerosis in
    reported TGCV cases.
  notes: >-
    Tricaprin (CNT-01) remains investigational without regulatory approval for
    primary TGCV; clinical trial reports exclusively enrolling idiopathic TGCV
    (without PNPLA2 variants) are intentionally excluded from primary TGCV
    evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tricaprin
      term:
        id: CHEBI:77388
        label: tricaprin
  target_mechanisms:
  - target: Myocardial and Coronary Triglyceride Accumulation
    treatment_effect: MODULATES
    description: >-
      Tricaprin facilitates intracellular lipolysis and reduces myocardial and
      coronary arterial triglyceride accumulation.
    evidence:
    - reference: PMID:30012901
      reference_title: "Tricaprin Rescues Myocardial Abnormality in a Mouse Model of Triglyceride Deposit Cardiomyovasculopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cardiac imaging tests showed that the tricaprin diet reduced TG accumulation, resulting from improvement of LCFA metabolism, and improved left ventricular function in Atgl KO mice compared to that in mice fed the control diet."
      explanation: >-
        Demonstrates reduction of myocardial triglyceride accumulation and
        improved LCFA metabolism with tricaprin in Atgl-knockout mice.
    - reference: DOI:10.7793/jcad.30.005
      reference_title: "Triglyceride Deposit Cardiomyovasculopathy Manifesting Coronary Artery Disease"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "However, the administration of tricaprin to facilitate myocardial lipolysis of TG has been reported to regress diffuse atherosclerotic lesions in some cases of TGCV."
      explanation: >-
        Supports tricaprin-facilitated myocardial triglyceride lipolysis and
        regression of diffuse coronary atherosclerotic lesions in TGCV patients.
  evidence:
  - reference: PMID:30012901
    reference_title: "Tricaprin Rescues Myocardial Abnormality in a Mouse Model of Triglyceride Deposit Cardiomyovasculopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "tricaprin improved myocardial abnormality in the TGCV\nmodel, thus, it may be useful for the treatment of patients with TGCV"
    explanation: Tricaprin improved the myocardial abnormality in a TGCV mouse model and is proposed for patient treatment.
  - reference: DOI:10.7793/jcad.30.005

    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Defective intracellular lipolysis of TG results in cellular steatosis and energy failure mainly in smooth muscle cells and cardiomyocytes."
    explanation: Demonstrates cardiomyocyte energy failure secondary to defective intracellular triglyceride lipolysis.
  - reference: PMID:31186072
    reference_title: "Triglyceride deposit cardiomyovasculopathy: a rare cardiovascular disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "adult-onset severe heart disease, including heart failure and coronary artery disease, associated with a\nmarked reduction in ATGL activity and myocardial washout rate of LCFA tracer, as\nsimilar to those with P-TGCV."
    explanation: Confirms markedly impaired myocardial long-chain fatty acid washout in P-TGCV patients via explicit comparison with P-TGCV.
  downstream:
  - target: Cardiomyopathy
    causal_link_type: DIRECT
    description: Cardiomyocyte bioenergetic failure directly impairs ventricular systolic and diastolic performance.
  - target: Ventricular arrhythmia
    causal_link_type: DIRECT
    description: Myocardial steatosis and bioenergetic failure create an arrhythmogenic substrate for ventricular arrhythmias.
    evidence:
    - reference: DOI:10.7793/jcad.30.005
      reference_title: "Triglyceride Deposit Cardiomyovasculopathy Manifesting Coronary Artery Disease"
      supports: SUPPORT
      evidence_source: OTHER

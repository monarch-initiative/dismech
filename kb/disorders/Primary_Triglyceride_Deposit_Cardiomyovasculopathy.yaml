      label: lipid droplet
  evidence:
  - reference: PMID:31186072
    reference_title: "Triglyceride deposit cardiomyovasculopathy: a rare cardiovascular disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Triglyceride deposit cardiomyovasculopathy (TGCV) is a phenotype primarily\nreported in patients carrying genetic mutations in PNPLA2 encoding adipose\ntriglyceride lipase (ATGL) which releases long chain fatty acid (LCFA) as a\nmajor energy source by the intracellular TG hydrolysis."
    explanation: PNPLA2/ATGL mutations impair intracellular triglyceride hydrolysis, the primary defect in P-TGCV.
  downstream:
  - target: Myocardial and Coronary Triglyceride Accumulation
    causal_link_type: DIRECT
    description: Impaired triglyceride hydrolysis causes cytoplasmic triglyceride droplet deposition in cardiomyocytes, coronary vascular smooth muscle cells, and skeletal muscle fibers.
    evidence:
    - reference: PMID:30012901
      reference_title: "Tricaprin Rescues Myocardial Abnormality in a Mouse Model of Triglyceride Deposit Cardiomyovasculopathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In TGCV, adipose triglyceride lipase (ATGL) deficiency results in the abnormal intracellular metabolism of long-chain fatty acid (LCFA) which leads to TG deposition."
      explanation: Directly links ATGL deficiency to intracellular triglyceride deposition.
  - target: Impaired Myocardial Long-Chain Fatty Acid Utilization and Energy Failure
    causal_link_type: DIRECT
    description: Loss of ATGL-mediated lipolysis deprives cardiomyocytes and vascular smooth muscle cells of intracellularly mobilized long-chain fatty acids, causing cellular energy failure.
    evidence:
    - reference: DOI:10.7793/jcad.30.005
      reference_title: "Triglyceride Deposit Cardiomyovasculopathy Manifesting Coronary Artery Disease"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Defective intracellular lipolysis of TG results in cellular steatosis and energy failure mainly in smooth muscle cells and cardiomyocytes."
      explanation: Establishes defective intracellular triglyceride lipolysis as the direct cause of cardiomyocyte and vascular smooth muscle energy failure.

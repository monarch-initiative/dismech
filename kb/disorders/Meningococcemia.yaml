    modify inherited susceptibility to meningococcal infection.
  evidence:
  - reference: PMID:16337490
    reference_title: Association between combined properdin and mannose-binding lectin deficiency and infection with Neisseria meningitidis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that a combined deficiency of both properdin and MBL
      increases the risk of infection with Neisseria meningitidis and stress the
      importance of epistatic genetic interactions in disease susceptibility.
    explanation: >-
      Supports MBL2 as a susceptibility modifier that increases meningococcal
      infection risk when combined with properdin deficiency.
environmental:
- name: Pharmacologic terminal complement blockade
  description: >-
    Anti-C5 monoclonal antibodies such as eculizumab and ravulizumab inhibit
    terminal complement activation and phenocopy terminal complement deficiency,
    raising invasive meningococcal susceptibility despite vaccination.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Complement-Gated Meningococcal Bacteremia
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Therapeutic C5 blockade prevents C5b-9 membrane-attack-complex formation,
      lowering serum bactericidal activity against N. meningitidis.
  evidence:
  - reference: PMID:42137634
    reference_title: "Meningococcal prophylaxis in neurological diseases treated with complement inhibitors: an expert consensus for Germany, Austria, and Switzerland."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Inhibition of terminal complement activation is an effective therapeutic
      strategy for acetylcholine receptor antibody-positive generalized
      myasthenia gravis (gMG) and aquaporin-4 antibody-positive neuromyelitis
      optica spectrum disorder (NMOSD), but it increases the risk of invasive
      meningococcal infections.
    explanation: >-
      Establishes pharmacologic terminal complement inhibition as an iatrogenic
      invasive-meningococcal-disease risk factor.
- name: Tobacco smoke exposure
  description: >-
    Active or passive tobacco smoke exposure increases meningococcal carriage
    odds, increasing opportunities for acquisition and transmission upstream of
    invasive disease.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Nasopharyngeal Meningococcal Acquisition and Invasion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoke exposure is associated with higher nasopharyngeal meningococcal
      carriage, raising exposure to the bloodstream-invasion gate.
  evidence:
  - reference: PMID:11399012
    reference_title: Carriage of Neisseria meningitidis among household contacts of patients with meningococcal disease in New Zealand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors associated with carriage were smoking, with personal smokers
      (odds ratio [OR] 2.5) and passive smokers (OR 1.6) having a higher
      carriage risk than those in smoke-free houses
    explanation: >-
      Quantifies the increased meningococcal-carriage risk associated with both
      active and passive smoking.
  - reference: PMID:27861618
    reference_title: "Meningococcal Carriage among Adolescents after Mass Meningococcal C Conjugate Vaccination Campaigns in Salvador, Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors associated with carriage were having only one, shared, bedroom in
      the household (PR, 2.02; 95% CI, 0.99-4.12, p = 0.05); the mother being
      the only smoker in the home (PR, 2.48; 95% CI, 1.16-5.29; p = 0.01);
      and going to pubs/parties more than 5 times/month (PR, 2.61; 95% CI,
      1.38-4.92; p = 0.02).
    explanation: >-
      Independently links household smoking to meningococcal carriage in an
      adolescent carriage survey.
- name: Household crowding and congregate social mixing
  description: >-
    Shared bedrooms, more people per bedroom, and frequent pub/party attendance
    mark crowded close-contact settings that increase meningococcal carriage.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  influences_mechanisms:
  - target: Nasopharyngeal Meningococcal Acquisition and Invasion
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Crowded or frequent close-contact settings increase nasopharyngeal
      carriage of N. meningitidis, the reservoir state preceding invasive
      meningococcemia.
  evidence:
  - reference: PMID:27861618
    reference_title: "Meningococcal Carriage among Adolescents after Mass Meningococcal C Conjugate Vaccination Campaigns in Salvador, Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors associated with carriage were having only one, shared, bedroom in
      the household (PR, 2.02; 95% CI, 0.99-4.12, p = 0.05); the mother being
      the only smoker in the home (PR, 2.48; 95% CI, 1.16-5.29; p = 0.01);
      and going to pubs/parties more than 5 times/month (PR, 2.61; 95% CI,
      1.38-4.92; p = 0.02).
    explanation: >-
      Links a shared household bedroom and frequent pub/party attendance to
      increased meningococcal carriage in adolescents.
  - reference: PMID:11057965
    reference_title: Carriage of N. lactamica in a population at high risk of meningococcal disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors associated with a significant (P < 0.05) increase in the
      likelihood of carriage included runny nose, the number of people per
      bedroom and youth.
    explanation: >-
      Supports people-per-bedroom as a household crowding measure tied to
      nasopharyngeal Neisseria carriage in contacts of meningococcal disease
      cases.
diagnosis:
- name: Blood and CSF culture or PCR confirmation
  description: >-
    Suspected meningococcemia requires immediate empirical treatment while
    microbiologic or molecular testing of blood and, when meningitis is
    suspected, cerebrospinal fluid confirms the invasive meningococcal etiology.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Suspected patients should receive early appropriate antimicrobial therapy
      concomitantly with confirmatory invasive diagnostic tests.
    explanation: >-
      Establishes confirmatory invasive testing as concurrent with immediate
      empirical treatment in suspected severe meningococcal infection.
- name: Early red-flag clinical recognition
  description: >-
    Confusion, leg pain, photophobia, non-blanching rash, and neck
    pain/stiffness can flag meningococcal disease early in febrile children and
    should prompt urgent face-to-face assessment.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:21375891
    reference_title: "Which early 'red flag' symptoms identify children with meningococcal disease in primary care?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five symptoms have clinically useful positive likelihood ratios (LR+) for
      meningococcal disease: confusion (LR+ = 24.2, 95% confidence interval [CI]
      = 11.5 to 51.3), leg pain (LR+ = 7.6, 95% CI = 4.9 to 11.9), photophobia
      (LR+ = 6.5, 95% CI = 3.8 to 11.0), rash (LR+ = 5.5, 95% CI = 4.3 to 7.1),
      and neck pain/stiffness (LR+ = 5.3, 95% CI = 3.5 to 8.3).
    explanation: >-
      Quantifies several symptoms that discriminate meningococcal disease in
      acutely febrile children in primary care.
treatments:
- name: Early parenteral antibiotic therapy
  description: >-
    Suspected meningococcemia is treated immediately with bactericidal
    parenteral antibiotics, with third-generation cephalosporins such as
    ceftriaxone or cefotaxime widely used in secondary care.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Complement-Gated Meningococcal Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Early bactericidal therapy clears viable bloodstream N. meningitidis and
      blocks further endotoxin release and endothelial seeding.
    evidence:
    - reference: PMID:23830646
      reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Suspected patients should receive early appropriate antimicrobial therapy
        concomitantly with confirmatory invasive diagnostic tests.
      explanation: >-
        Establishes early antimicrobial therapy as the urgent treatment step in
        suspected invasive meningococcal disease.
  evidence:
  - reference: PMID:34843604
    reference_title: "Antibiotic resistance among invasive Neisseria meningitidis isolates in England, Wales and Northern Ireland (2010/11 to 2018/19)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the UK, penicillin is administered to patients in primary care whilst
      third generation cephalosporins, cefotaxime and ceftriaxone, are administered
      in secondary care.
    explanation: >-
      Names the third-generation cephalosporins cefotaxime and ceftriaxone as
      secondary-care treatment for invasive meningococcal disease.
- name: Critical-care resuscitation for shock and Waterhouse-Friderichsen syndrome
  description: >-
    Fulminant meningococcemia with shock requires critical-care support,
    including fluid resuscitation, vasopressors, ventilatory or renal support as
    needed, and stress-dose corticosteroid replacement when bilateral adrenal
    hemorrhage causes Waterhouse-Friderichsen syndrome.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38408808
    reference_title: Waterhouse-Friderichsen syndrome, septic adrenal apoplexy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment consists of fluid resuscitation, corticosteroid replacement, and
      possibly surgery.
    explanation: >-
      Supports fluid resuscitation and corticosteroid replacement for
      Waterhouse-Friderichsen adrenal failure.
  - reference: PMID:38558654
    reference_title: "Ventricular Tachycardia Crisis: Assessing Norepinephrine vs. Stress Steroids in the Battle Against Waterhouse-Friderichsen Syndrome With Distributive Shock."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Managing WFS involves a delicate balance of steroids and vasopressors,
      necessitating a multidisciplinary approach.
    explanation: >-
      Supports pairing corticosteroid replacement with vasopressor support when
      Waterhouse-Friderichsen syndrome presents with distributive shock.
- name: MenACWY and MenB vaccination
  description: >-
    Capsular conjugate vaccines against serogroups A, C, W, and Y and
    protein-based serogroup B vaccines induce bactericidal antibodies that
    prevent invasive meningococcal disease before bloodstream invasion.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Complement-Gated Meningococcal Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Anti-meningococcal vaccination raises serum bactericidal antibodies
      against vaccine-covered strains, preventing the complement-evasion and
      bloodstream-survival step.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Vaccines have reduced the incidence of infection with certain non-B
      meningococcal serogroups, and new serotype B vaccines are on the horizon.
    explanation: >-
      Establishes incidence reduction after non-B meningococcal vaccination.
  - reference: PMID:31971676
    reference_title: Vaccination of Infants with Meningococcal Group B Vaccine (4CMenB) in England.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From September 2015 through August 2018, the incidence of meningococcal group
      B disease in England (average annual birth cohort, approximately 650,000
      infants) was significantly lower in vaccine-eligible cohorts than the expected
      incidence (63 observed cases as compared with 253 expected cases; incidence
      rate ratio, 0.25; 95% confidence interval [CI], 0.19 to 0.36), with a 75%
      reduction in age groups that were fully eligible for vaccination.
    explanation: >-
      Demonstrates population-level invasive MenB disease reduction in the
      infant cohorts eligible for 4CMenB vaccination.
- name: MenACWY and MenB vaccination plus antibiotic prophylaxis during anti-C5 therapy
  description: >-
    Patients receiving terminal-complement inhibitors need MenACWY and MenB
    vaccination with antibiotic prophylaxis around treatment initiation because
    pharmacologic C5 blockade leaves residual breakthrough meningococcal risk.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Complement-Gated Meningococcal Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Vaccination and antibiotic prophylaxis reduce meningococcal invasion in
      hosts whose serum bactericidal killing is pharmacologically impaired.
  review_notes: >-
    This prevention row is deliberately scoped to complement-inhibitor
    recipients. It reduces risk but does not completely reverse the
    terminal-complement defect created by anti-C5 therapy.
  evidence:
  - reference: PMID:42074848
    reference_title: "Beyond Vaccination: Persistent Meningococcal Risk in Anti-C5-Treated aHUS-Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Vaccination against meningococcal groups ACWY and B, along with temporary
      antibiotic prophylaxis, is therefore recommended before initiating
      anti-C5 therapy.
    explanation: >-
      States the combined MenACWY/MenB vaccination plus antibiotic prophylaxis
      prevention strategy before anti-C5 treatment.
  - reference: PMID:42074848
    reference_title: "Beyond Vaccination: Persistent Meningococcal Risk in Anti-C5-Treated aHUS-Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite complete meningococcal vaccination and a previous course of
      antibiotic prophylaxis, the patient developed meningitis during ongoing
      complement inhibitor therapy.
    explanation: >-
      Documents the residual breakthrough risk during complement-inhibitor
      therapy despite vaccination and a prior antibiotic prophylaxis course.
  - reference: PMID:42137634
    reference_title: "Meningococcal prophylaxis in neurological diseases treated with complement inhibitors: an expert consensus for Germany, Austria, and Switzerland."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Consequently, vaccination against meningococcal serogroups A, C, W, Y,
      and B is mandatory for all patients receiving complement inhibitors.
    explanation: >-
      Supports MenACWY plus MenB vaccination as the preventive counterpart to
      terminal-complement inhibitor exposure.
- name: Antibiotic chemoprophylaxis for close contacts
  description: >-
    Ciprofloxacin, with rifampicin as an alternative, is used to eradicate
    carriage in close contacts and prevent secondary invasive meningococcal
    cases.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34843604
    reference_title: "Antibiotic resistance among invasive Neisseria meningitidis isolates in England, Wales and Northern Ireland (2010/11 to 2018/19)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first-choice antibiotic for chemoprophylaxis of close contacts is
      ciprofloxacin, followed by rifampicin.
    explanation: >-
      Supports ciprofloxacin and rifampicin as agents for close-contact
      chemoprophylaxis after invasive meningococcal disease exposure.
animal_models:
- name: Human skin-graft SCID/Beige mouse meningococcemia model
  species: Mouse
  genotype: SCID/Beige mouse xenografted with human skin
  publication: PMID:23359320
  description: >-
    SCID/Beige mice bearing perfused human dermal microvessels after human
    skin xenografting support intravenous N. meningitidis adhesion to the human
    graft vasculature, local inflammation, thrombosis, vascular leakage, and
    purpura.
  modeled_mechanisms:
  - target: Type-IV-Pilus Dermal Endothelial Adhesion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the human-vessel adhesion step and the downstream local
      cutaneous vascular damage caused by type-IV-piliated meningococci.
    limitations: >-
      The model grafts human skin into an immunodeficient mouse, injects
      bacteria intravenously, omits nasopharyngeal acquisition, and uses mouse
      circulating immune and coagulation systems outside the graft.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        N. meningitidis contacts human endothelium in the graft but host blood,
        complement, and recruited leukocytes are murine.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Intravenous inoculation bypasses nasopharyngeal colonization and
        mucosal invasion, so the model only covers the vascular phase of
        meningococcemia.
    evidence:
    - reference: PMID:23359320
      reference_title: Adhesion of Neisseria meningitidis to dermal vessels leads to local vascular damage and purpura in a humanized mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The adhesive properties of the type IV pili of N. meningitidis were
        found to be the main mediator of association with the dermal
        microvessels in vivo.
      explanation: >-
        Shows that type IV pili mediate meningococcal attachment to human
        dermal microvessels in the skin-graft model.
  - target: Type-IV-Pilus Dermal Endothelial Adhesion
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A PilT pilus-retraction mutant in the same humanized model tests how
      type-IV-pilus dynamics release bacteria from colonized microvessels to
      sustain bacteremia.
    limitations: >-
      The PilT perturbation isolates bacterium-to-bacterium detachment within
      the graft model but still bypasses mucosal invasion and tests lethality in
      a mouse host.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The intravenous challenge begins after bloodstream entry and therefore
        cannot test whether PilT affects nasopharyngeal carriage or mucosal
        invasion.
    evidence:
    - reference: PMID:33592056
      reference_title: Type IV pilus retraction enables sustained bacteremia and plays a key role in the outcome of meningococcal sepsis in a humanized mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        TFP-retraction was necessary to promote the release of TFP-dependent
        contacts between bacteria and, in turn, the detachment from colonized
        microvessels. The resulting sustained bacteremia was directly correlated
        with lethality.
      explanation: >-
        Shows that pilus retraction controls release from colonized human graft
        microvessels, sustained bacteremia, and lethality in the humanized mouse.
  evidence:
  - reference: PMID:23359320
    reference_title: Adhesion of Neisseria meningitidis to dermal vessels leads to local vascular damage and purpura in a humanized mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we introduced human dermal microvessels into SCID/Beige mice by
      xenografting human skin.
    explanation: >-
      Defines the human skin-graft SCID/Beige mouse system.
experimental_models:
- name: 3D microfluidic human vessel model of meningococcal vascular colonization
  description: >-
    A laser-photoablation-generated three-dimensional human microfluidic vessel
    model that exposes endothelial vascular networks to N. meningitidis and
    measures microcolony growth, cytoskeletal rearrangement, E-selectin
    induction, and neutrophil responses with high spatiotemporal resolution.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  culture_system: Laser photoablation-generated 3D hydrogel microfluidic human vascular network
  publication: PMID:41406015
  modeled_mechanisms:
  - target: Type-IV-Pilus Dermal Endothelial Adhesion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces meningococcal vascular microcolony growth and host endothelial
      responses in a human three-dimensional vessel architecture.
    limitations: >-
      The microfluidic vessel isolates vascular colonization from nasopharyngeal
      entry, whole-blood bacteremia, complement pressure, and organism-level
      shock physiology.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The chip lacks the mucosal reservoir, bloodstream complement killing,
        and systemic shock compartments that frame the in vivo mechanism.
    evidence:
    - reference: PMID:41406015
      reference_title: An in vitro human vessel model to study Neisseria meningitidis colonization and vascular damages.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        By comparing with a human-skin xenograft mouse model, we show that the
        model system not only replicates in vivo key features of the infection,
        but also enables quantitative assessment with a higher spatiotemporal
        resolution of bacterial microcolony growth, endothelial cytoskeleton
        rearrangement, vascular E-selectin expression, and neutrophil response
        upon infection.
      explanation: >-
        Supports the 3D microfluidic human vessel as a model of meningococcal
        vascular colonization and endothelial injury.
  evidence:
  - reference: PMID:41406015
    reference_title: An in vitro human vessel model to study Neisseria meningitidis colonization and vascular damages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To overcome these limitations, we developed a laser
      photoablation-generated, three-dimensional microfluidic model of
      meningococcal vascular colonization, a human-specific bacterium that
      causes sepsis and meningitis.
    explanation: >-
      Defines the human 3D microfluidic vessel model and its meningococcal
      vascular-colonization use.

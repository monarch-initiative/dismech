genetic:
- name: C5
  gene_term:
    preferred_term: C5
    term:
      id: hgnc:1331
      label: C5
  association: Susceptibility
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Germline deficiency in terminal complement component C5 impairs
    membrane-attack-complex activity and predisposes exposed hosts to invasive
    meningococcal disease.
  evidence:
  - reference: PMID:25037634
    reference_title: "Are complement deficiencies really rare? Overview on prevalence, clinical importance and modern diagnostic approach."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The genetic deficiency of any early component of the classical pathway
      (C1q, C1r/s, C2, C4) is often associated with autoimmune diseases whereas
      individuals, deficient of properdin or of the terminal pathway components
      (C5 to C9), are highly susceptible to meningococcal disease.
    explanation: >-
      Names C5 within the terminal-complement interval whose deficiency confers
      high meningococcal susceptibility.

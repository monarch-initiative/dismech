name: Meningococcemia
creation_date: "2026-11-03T00:00:00Z"
category: Infectious Disease
description: >-
  Meningococcemia is the bloodstream and septicemic form of invasive
  Neisseria meningitidis disease. Meningococci acquired from human
  nasopharyngeal carriers invade the blood in a complement-susceptible host,
  evade serum bactericidal killing, adhere to human microvascular endothelium,
  release lipooligosaccharide-rich outer-membrane material, and drive sepsis,
  petechiae, purpura, disseminated intravascular coagulation, shock, distal
  ischemia, and other end-organ complications.
disease_term:
  preferred_term: meningococcemia
  term:
    id: MONDO:0042972
    label: meningococcemia
parents:
- Sepsis
synonyms:
- Meningococcal sepsis
- Meningococcal septicemia
- Acute meningococcemia
notes: >-
  Split decision: this entry covers the bloodstream/septicemic form of invasive
  meningococcal disease and treats meningococcal meningitis as a frequent
  overlap rather than part of the definition. Meningococcal_Meningitis
  separately curates blood-brain-barrier crossing, cerebrospinal-fluid
  inflammation, and purulent meningeal disease. This entry keeps the shared
  upstream nasopharyngeal acquisition and bacteremia gates, then emphasizes the
  microvascular adhesion, endothelial protein C receptor shedding, systemic
  cytokine, and coagulopathy branches that make meningococcemia clinically
  distinct.
infectious_agent:
- name: Neisseria meningitidis
  description: >-
    Encapsulated, Gram-negative diplococcus maintained in the human
    nasopharynx; invasive disease is caused predominantly by serogroups A, B,
    C, W, X, and Y.
  infectious_agent_term:
    preferred_term: Neisseria meningitidis
    term:
      id: NCBITaxon:487
      label: Neisseria meningitidis
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neisseria meningitidis, also known as meningococcus, is a relatively uncommon
      cause of invasive infection, but when it occurs it is frequently severe and
      potentially life threatening.
    explanation: >-
      Identifies Neisseria meningitidis as the meningococcus causing severe
      invasive disease.
agent_life_cycle:
  description: >-
    Neisseria meningitidis is an obligate human nasopharyngeal commensal that
    transmits between people through close exposure to respiratory droplets or
    secretions; humans are the only known reservoir and invasive blood disease
    is a rare outcome of carriage.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: obligate reservoir and definitive host
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:23830646
      reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Neisseria meningitidis, also known as meningococcus, is a relatively uncommon
        cause of invasive infection, but when it occurs it is frequently severe and
        potentially life threatening.
      explanation: >-
        Establishes meningococcemia as an invasive bacterial infectious disease.
transmission:
- name: Respiratory close-contact transmission from nasopharyngeal carriers
  description: >-
    Meningococci spread from the human nasopharyngeal reservoir through close
    person-to-person respiratory exposure, especially in households, and
    bloodstream invasion can follow acquisition in a susceptible host.
  evidence:
  - reference: PMID:11399012
    reference_title: Carriage of Neisseria meningitidis among household contacts of patients with meningococcal disease in New Zealand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong patient-contact clustering by meningococcal strain (chi-square1 =
      16.7, P=0.00004) suggested an important role for the household setting in
      transmission.
    explanation: >-
      Household clustering of patient and contact strains supports close-contact
      spread from nasopharyngeal carriers as the acquisition route upstream of
      invasive meningococcal disease.
prevalence:
- population: Invasive meningococcal disease cohorts
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Meningococcemia is an acute presentation within invasive meningococcal
    disease; its incidence depends on serogroup distribution, age, vaccination
    programs, and local transmission rather than a conserved global rate.
  evidence:
  - reference: PMID:23830646
    reference_title: "Severe meningococcal infection: a review of epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Vaccines have reduced the incidence of infection with certain non-B
      meningococcal serogroups, and new serotype B vaccines are on the horizon.
    explanation: >-
      Meningococcal vaccination can materially change invasive-disease incidence,
      so the entry does not assign a single intrinsic global rate.
progression:
- phase: Nasopharyngeal carriage and bloodstream invasion
  notes: >-
    After acquisition, meningococci colonize the nasopharynx and, in a subset
    of susceptible hosts, cross into blood to establish invasive bacteremia.
  evidence:
  - reference: PMID:27861618
    reference_title: "Meningococcal Carriage among Adolescents after Mass Meningococcal C Conjugate Vaccination Campaigns in Salvador, Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neisseria meningitidis is a commensal bacterium of the human nasopharynx. In
      rare cases, it penetrates the mucosa, entering the blood stream and causing
      various forms of disease.
    explanation: >-
      Places rare mucosal penetration and bloodstream entry downstream of
      nasopharyngeal carriage.
- phase: Acute meningococcal sepsis and thrombotic microangiopathy
  notes: >-
    Bloodstream organisms adhere to microvessels, release endotoxin, and trigger
    inflammatory and coagulation injury that can progress within hours to shock,
    DIC, purpura fulminans, distal ischemia, adrenal hemorrhage, multi-organ
    dysfunction, and death.
  evidence:
  - reference: PMID:25605282
    reference_title: "Outcomes of invasive meningococcal disease in adults and children in Canada between 2002 and 2011: a prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 868 individuals hospitalized with IMD, there were 73 deaths (8.4%) and
      157 (18%) developed complications. The most common complications were hearing
      loss (5.4%), skin scarring (5.4%), amputation (3.4%), renal dysfunction
      (2.6%), and seizures (2.5%).
    explanation: >-
      Documents mortality and major ischemic, renal, skin, auditory, and
      neurologic complications after invasive meningococcal disease.
pathophysiology:
- name: Nasopharyngeal Meningococcal Acquisition and Invasion
  description: >-
    Encapsulated N. meningitidis is acquired from another human carrier,
    colonizes the nasopharyngeal mucosa, and crosses epithelial and vascular
    barriers to seed the bloodstream.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    modifier: INCREASED
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  downstream:
  - target: Complement-Gated Meningococcal Bacteremia
    causal_link_type: DIRECT
    description: >-
      Organisms that escape the mucosa enter a complement-exposed vascular
      compartment.
  evidence:
  - reference: PMID:27861618
    reference_title: "Meningococcal Carriage among Adolescents after Mass Meningococcal C Conjugate Vaccination Campaigns in Salvador, Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neisseria meningitidis is a commensal bacterium of the human nasopharynx. In
      rare cases, it penetrates the mucosa, entering the blood stream and causing
      various forms of disease.
    explanation: >-
      Grounds the carriage-to-bloodstream-invasion step that seeds invasive
      meningococcemia.
- name: Complement-Gated Meningococcal Bacteremia
  description: >-
    Encapsulated meningococci survive in blood when bacterial complement
    evasion and a host with insufficient serum bactericidal activity permit
    escape from membrane-attack-complex killing, causing high-grade
    meningococcal bacteremia.
  role: amplifier
  biological_scale: TISSUE
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: LOS- and IL-10-Associated Systemic Inflammation
    causal_link_type: DIRECT
    description: >-
      A larger bloodstream meningococcal and lipooligosaccharide load drives a
      stronger systemic cytokine response.
  - target: Type-IV-Pilus Dermal Endothelial Adhesion
    causal_link_type: DIRECT
    description: >-
      Bacteremia exposes human dermal microvessels to type-IV-piliated
      meningococci.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Sustained bloodstream infection manifests clinically as meningococcal
      sepsis.
  evidence:
  - reference: PMID:31440263
    reference_title: Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study confirms the strong association of meningococcal infections with
      terminal pathway deficiency and highlights the risk of pneumococcal and
      auto-immune diseases in the classical and alternative pathways.
    explanation: >-
      Shows that failure of terminal complement killing is a major host gate for
      invasive meningococcal infection.
  - reference: PMID:16527897
    reference_title: Deficient alternative complement pathway activation due to factor D deficiency by 2 novel mutations in the complement factor D gene in a family with meningococcal infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This deficiency abolishes alternative-pathway dependent complement activation
      by N meningitidis, and leads to an increased susceptibility to invasive
      meningococcal disease.
    explanation: >-
      Factor D deficiency functionally places the alternative complement pathway
      upstream of meningococcal bloodstream susceptibility.
- name: LOS- and IL-10-Associated Systemic Inflammation
  description: >-
    High meningococcal and lipooligosaccharide burdens stimulate monocytes and
    other innate immune cells, producing a systemic cytokine response in which
    LPS and IL-10 concentrations track severe systemic meningococcal disease.
  role: central_effector
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: lipopolysaccharide-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0031663
      label: lipopolysaccharide-mediated signaling pathway
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Systemic inflammatory signaling during meningococcal sepsis produces
      acute fever.
  - target: Shock
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated systemic inflammation contributes to vasodilation, capillary
      leak, myocardial depression, and shock.
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cytokine-driven endothelial and coagulation activation amplifies
      consumptive coagulopathy during meningococcal sepsis.
  evidence:
  - reference: PMID:25233959
    reference_title: IL-10 immunodepletion from meningococcal sepsis plasma induces extensive changes in gene expression and cytokine release in stimulated human monocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The severity of systemic meningococcal disease (SMD) correlates to plasma
      concentrations of LPS and IL-10, with the highest levels detected in
      non-survivors.
    explanation: >-
      Links lipooligosaccharide and IL-10 abundance with the severity of
      systemic meningococcal disease.
- name: Type-IV-Pilus Dermal Endothelial Adhesion
  description: >-
    Circulating N. meningitidis uses type IV pili to adhere to human dermal
    microvascular endothelium, concentrating organisms on the vascular wall.
  role: amplifier
  biological_scale: CELLULAR
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: dermal microvascular endothelial cell
    term:
      id: CL:0011030
      label: dermal microvascular endothelial cell
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    modifier: INCREASED
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  downstream:
  - target: ADAM10-Mediated EPCR Shedding
    causal_link_type: DIRECT
    description: >-
      Pilus-mediated endothelial adhesion triggers ADAM10-dependent loss of the
      endothelial protein C receptor.
  - target: Petechiae
    causal_link_type: DIRECT
    description: >-
      Local dermal microvascular damage and leakage cause petechial hemorrhage.
  evidence:
  - reference: PMID:23359320
    reference_title: Adhesion of Neisseria meningitidis to dermal vessels leads to local vascular damage and purpura in a humanized mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The adhesive properties of the type IV pili of N. meningitidis were found
      to be the main mediator of association with the dermal microvessels in vivo.
    explanation: >-
      Shows that type IV pili mediate meningococcal attachment to human dermal
      microvessels in the humanized skin-graft model.
- name: ADAM10-Mediated EPCR Shedding
  description: >-
    Meningococcal adhesion to endothelial cells activates ADAM10 and sheds the
    endothelial protein C receptor from the endothelial surface, reducing local
    generation of activated protein C.
  role: central_effector
  biological_scale: CELLULAR
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: membrane protein ectodomain proteolysis
    modifier: INCREASED
    term:
      id: GO:0006509
      label: membrane protein ectodomain proteolysis
  downstream:
  - target: Protein C Anticoagulant Failure and Microvascular Thrombosis
    causal_link_type: DIRECT
    description: >-
      EPCR shedding impairs local protein C activation on meningococcus-colonized
      endothelium.
  evidence:
  - reference: PMID:29630665
    reference_title: An ADAM-10 dependent EPCR shedding links meningococcal interaction with endothelial cells to purpura fulminans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data demonstrate that meningococcal adhesion on endothelial cells
      impairs the activation of PC by inducing an ADAM10-mediated shedding of EPCR.
    explanation: >-
      Identifies ADAM10-dependent EPCR shedding as the endothelial consequence
      of meningococcal adhesion.
- name: Protein C Anticoagulant Failure and Microvascular Thrombosis
  description: >-
    Loss of endothelial protein C activation weakens anticoagulant and
    barrier-protective signaling at colonized microvessels, allowing local
    thrombosis, hemostasis, and leakage to progress toward purpura fulminans and
    systemic DIC.
  role: central_effector
  biological_scale: CELLULAR
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Disseminated Intravascular Coagulation
    causal_link_type: DIRECT
    description: >-
      Impaired protein-C anticoagulant signaling and systemic inflammation
      converge on consumptive coagulopathy.
  - target: Purpura
    causal_link_type: DIRECT
    description: >-
      Dermal thrombosis, hemostasis, and vascular leakage produce purpuric
      hemorrhage.
  - target: Gangrene
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe microvascular thrombosis and DIC can produce distal ischemic
      necrosis requiring amputation.
  - target: Acute adrenal insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe meningococcal sepsis can extend the thrombotic and hemorrhagic
      cascade to bilateral adrenal hemorrhage, producing acute primary adrenal
      insufficiency in Waterhouse-Friderichsen syndrome.
  evidence:
  - reference: PMID:29630665
    reference_title: An ADAM-10 dependent EPCR shedding links meningococcal interaction with endothelial cells to purpura fulminans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data demonstrate that meningococcal adhesion on endothelial cells
      impairs the activation of PC by inducing an ADAM10-mediated shedding of EPCR.
    explanation: >-
      Identifies the ADAM10-dependent EPCR shedding mechanism that reduces
      activated protein C generation after meningococcal endothelial adhesion.
  - reference: PMID:23359320
    reference_title: Adhesion of Neisseria meningitidis to dermal vessels leads to local vascular damage and purpura in a humanized mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, infection also led to local vascular damage with hemostasis,
      thrombosis, vascular leakage and finally purpura in the grafted skin,
      replicating the clinical presentation for the first time in an animal model.
    explanation: >-
      Connects meningococcal dermal-vessel infection to thrombosis, vascular
      leakage, and purpura in vivo.

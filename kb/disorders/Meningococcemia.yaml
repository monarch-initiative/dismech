  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Germline properdin deficiency weakens alternative-complement amplification
    and predisposes, sometimes with MBL2 deficiency as a modifier, to severe
    invasive meningococcal disease.
  evidence:
  - reference: PMID:10909851
    reference_title: "Molecular characterisation of 10 Dutch properdin type I deficient families: mutation analysis and X-inactivation studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Properdin deficiency is associated with increased susceptibility to severe
      meningococcal disease.
    explanation: >-
      Links X-linked properdin deficiency to severe meningococcal disease risk.
  - reference: PMID:16337490
    reference_title: Association between combined properdin and mannose-binding lectin deficiency and infection with Neisseria meningitidis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A splice site mutation in exon 10 (c.1487-2A>G) was found in the properdin
      gene and co segregated with biochemically measured properdin deficiency.
    explanation: >-
      Identifies a properdin-gene splice-site variant segregating with measured
      properdin deficiency in a family with meningococcal disease clustering.
  - reference: PMID:31421540
    reference_title: "Complement deficiencies and dysregulation: Pathophysiological consequences, modern analysis, and clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Whereas defects of early components of the classical pathway significantly
      increase the risk of autoimmune disorders, lack of components of the
      terminal pathway as well as of properdin are associated with an enhanced
      susceptibility to meningococcal infections.
    explanation: >-
      Synthesizes the enhanced meningococcal susceptibility associated with
      properdin deficiency.

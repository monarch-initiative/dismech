    snippet: >-
      Waterhouse-Friderichsen syndrome is a rare but potentially fatal disorder of
      the adrenal gland characterized by bilateral adrenal hemorrhage. It is
      classically a result of meningococcal sepsis and presents acutely with
      features of shock, petechial rashes, abdominal pain, and non-specific
      symptoms such as headache, fatigue, and vomiting.
    explanation: >-

environmental:
- name: Recreational freshwater or marine water contact
  description: >-
    Contact with freshwater or marine habitats containing schistosomatid
    cercariae exposes skin to the infectious cercarial stage.
  effect: Triggers cercarial skin penetration.
  influences_mechanisms:
  - target: Schistosomatid cercarial skin penetration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exposed skin in cercaria-containing water is the physical contact route by
      which cercariae penetrate the accidental human host.
    evidence:
    - reference: PMID:25567226
      reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Skin reactions to cercariae from freshwater or marine environments may
        resemble insect bites, bacterial dermatitis, contact dermatitis, or skin
        reactions against nematocysts of larval cnidarians
      explanation: >-
        Places freshwater and marine water contact as the exposure context for
        cercarial skin reactions.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anamnestic data (suggesting recent contact with water reservoirs) and
      maculopapular skin eruption on the body parts that were in contact with
      water are important indicators.
    explanation: >-
      Connects recent water-reservoir contact with the eruption on exposed skin.

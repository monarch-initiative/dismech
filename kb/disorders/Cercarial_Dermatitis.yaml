  downstream:
  - target: Pruritus
    description: Acute cutaneous inflammation causes intense itching.
  - target: Erythematous Papules
    description: Local inflammation creates erythematous papules.
  - target: Maculopapular Eruption
    description: Local inflammation can create small macules and maculopapules.
  - target: Local erythema
    description: Local inflammation causes transient erythema.
  - target: Local edema
    description: Local vascular leakage causes edema in the affected area.
  - target: Skin vesicles
    description: Vesicles can form on papules after cercarial penetration.
  - target: Residual hyperpigmented spots
    description: Resolving papules can leave pigmented spots for weeks.
  - target: Heavy-exposure generalized reaction
    description: >-
      Large cercarial burdens can be accompanied by generalized reactions beyond
      the skin lesions.
- name: Heavy-exposure generalized reaction
  description: >-
    Exposure to many cercariae can extend the inflammatory reaction beyond the
    contacted skin to lymph-node swelling and systemic symptoms.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An attack by many cercariae may be accompanied by generalized reactions,
      such as limb and lymph node swelling, nausea, diarrhea, and fever
    explanation: >-
      Lists generalized reactions reported after many cercarial penetrations.
  downstream:
  - target: Lymphadenopathy
    description: Generalized reactions can include lymph-node swelling.

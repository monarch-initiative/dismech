name: Cercarial Dermatitis
creation_date: '2026-11-14T00:00:00Z'
category: Infectious Disease
description: >-
  Cercarial dermatitis, or swimmer's itch, is an acute allergic dermatitis that
  follows skin penetration by cercariae of avian or non-human mammalian
  schistosomes of the family Schistosomatidae. The parasites require aquatic
  gastropod intermediate hosts and bird or mammalian definitive hosts; humans
  are accidental hosts exposed during aquatic contact, where invading cercariae
  enter the skin but fail to mature and usually die there, triggering an
  intensely pruritic papular eruption that is amplified by previous exposure.
disease_term:
  preferred_term: cercarial dermatitis
  term:
    id: MONDO:0001260
    label: cercarial dermatitis
parents:
- Schistosomiasis
- parasitic skin disorder
synonyms:
- Swimmer's itch
- Schistosome dermatitis
notes: >-
  Lump/split decision: this entry covers swimmer's itch from zoonotic avian and
  non-human mammalian schistosome cercariae that penetrate human skin but do not
  establish a productive infection. Schistosomiasis keeps the analogous
  transient cercarial dermatitis that can occur immediately after infection with
  human Schistosoma species, while this MONDO concept needs a separate entry for
  the accidental-host, skin-limited syndrome caused by schistosomatids whose
  normal definitive hosts are not humans.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:30302587
      reference_title: >-
        Cercarial dermatitis: a systematic follow-up study of human cases with
        implications for diagnostics.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cercarial dermatitis (CD) is an allergic skin disease that rises in
        consequence of infection by invasive stages (cercariae) of trematodes of
        the family Schistosomatidae.
      explanation: >-
        Establishes cercarial dermatitis as an infection-linked skin disease
        caused by invasive schistosomatid cercariae.
definitions:
- name: Allergic dermatitis after schistosomatid cercarial skin invasion
  definition_type: CASE_DEFINITION
  description: >-
    Cercarial dermatitis is the acute allergic skin disease caused when
    Schistosomatidae cercariae penetrate human skin during exposure to aquatic
    habitats containing infected gastropod intermediate hosts.
  scope: Clinical framing for swimmer's itch
  evidence:
  - reference: PMID:30302587
    reference_title: >-
      Cercarial dermatitis: a systematic follow-up study of human cases with
      implications for diagnostics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cercarial dermatitis (CD) is an allergic skin disease that rises in
      consequence of infection by invasive stages (cercariae) of trematodes of
      the family Schistosomatidae.
    explanation: >-
      Names the clinical syndrome and ties it to infection by schistosomatid
      cercariae.
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cercarial dermatitis (swimmer's itch) is a condition caused by infective
      larvae (cercariae) of a species-rich group of mammalian and avian
      schistosomes.
    explanation: >-
      Supports the swimmer's-itch synonym and the mammalian and avian
      schistosome scope of the entry.
infectious_agent:
- name: Zoonotic Schistosomatidae cercariae
  infectious_agent_term:
    preferred_term: Schistosomatidae
    term:
      id: NCBITaxon:31245
      label: Schistosomatidae
  description: >-
    Species-rich avian and non-human mammalian schistosomes whose cercariae
    can penetrate human skin and cause swimmer's itch without maturing in
    humans.
  evidence:
  - reference: PMID:35631108
    reference_title: >-
      Scratching the Itch: Updated Perspectives on the Schistosomes Responsible
      for Swimmer's Itch around the World.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although most studies of digenetic trematodes of the family
      Schistosomatidae dwell on representatives causing human schistosomiasis,
      the majority of the 130 identified species of schistosomes infect birds or
      non-human mammals.
    explanation: >-
      Establishes that the non-human schistosomes responsible for swimmer's itch
      fall within Schistosomatidae and usually use bird or non-human mammalian
      hosts.
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      avian schistosomes are responsible for the majority of reported dermatitis
      outbreaks around the world
    explanation: >-
      Places avian schistosomes as the dominant reported cause of outbreaks.
agent_life_cycle:
  description: >-
    Zoonotic schistosomatids cycle between aquatic gastropod intermediate hosts
    and avian or mammalian definitive hosts. Cercariae leave infected snails,
    seek warm-blooded hosts through the water, and penetrate skin; humans are
    accidental hosts in whom the parasites do not mature and usually die in the
    skin.
  hosts:
  - preferred_term: aquatic gastropods
    term:
      id: NCBITaxon:6448
      label: Gastropoda
    role: intermediate host
  - preferred_term: birds
    term:
      id: NCBITaxon:8782
      label: Aves
    role: definitive hosts for avian schistosomes
  - preferred_term: non-human mammals
    term:
      id: NCBITaxon:40674
      label: Mammalia
    role: definitive hosts for mammalian schistosomes
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental dead-end host
  life_cycle_stages:
  - name: Egg-producing adult worms in bird or mammalian definitive hosts
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      In normal avian or non-human mammalian definitive hosts, schistosomes
      migrate to the intravascular system, mature as adult worms, and produce
      eggs that leave the host.
    evidence:
    - reference: PMID:35631108
      reference_title: >-
        Scratching the Itch: Updated Perspectives on the Schistosomes
        Responsible for Swimmer's Itch around the World.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Once in their normal definitive host, they undertake a complex migration
        route to the intravascular system before they attain sexual maturity and
        produce eggs, which are passed in the feces, or occasionally by other
        routes.
      explanation: >-
        Closes the normal definitive-host stage that yields eggs before
        environmental miracidium and snail infection.
  - name: Schistosomatid development in aquatic snails
    description: >-
      The schistosomes that cause swimmer's itch require caenogastropod or
      heterobranch gastropod intermediate hosts before cercariae are released
      into aquatic habitats.
    evidence:
    - reference: PMID:35631108
      reference_title: >-
        Scratching the Itch: Updated Perspectives on the Schistosomes
        Responsible for Swimmer's Itch around the World.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Collectively, schistosomes exploit 16 families of caenogastropod or
        heterobranch gastropod intermediate hosts.
      explanation: >-
        Supports the gastropod intermediate-host phase for the diverse
        schistosomes responsible for swimmer's itch.
  - name: Cercarial skin-penetration stage
    life_cycle_stage_term:
      preferred_term: cercaria stage
      term:
        id: OPL:0000070
        label: cercaria stage
    description: >-
      Cercariae exit aquatic snails, search for warm-blooded definitive hosts,
      and invade skin through direct penetration from water.
    evidence:
    - reference: PMID:25567226
      reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Cercaria is the infective stage that, after leaving the snail, searches
        for and invades a warm-blooded vertebrate host via skin penetration.
      explanation: >-
        Identifies cercariae as the snail-shed infective stage that penetrates
        vertebrate skin.
  - name: Human accidental-host skin arrest
    description: >-
      Cercariae can enter human skin, but species adapted to avian or other
      mammalian definitive hosts do not mature there and typically die in the
      skin.
    evidence:
    - reference: PMID:25567226
      reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Although they infect humans, they do not mature and usually die in the
        skin.
      explanation: >-
        Constrains human swimmer's itch to an accidental-host invasion rather
        than productive maturation.
transmission:
- name: Aquatic cercarial skin penetration
  description: >-
    People acquire cercarial dermatitis when free-swimming schistosomatid
    cercariae in water penetrate exposed skin while searching for a
    warm-blooded definitive host.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cercaria is the infective stage that, after leaving the snail, searches
      for and invades a warm-blooded vertebrate host via skin penetration.
    explanation: >-
      Supports waterborne exposure followed by cercarial penetration through
      skin.
pathophysiology:
- name: Schistosomatid cercarial skin penetration
  description: >-
    Infective cercariae released by aquatic snails directly invade human skin
    during water contact.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cercaria is the infective stage that, after leaving the snail, searches
      for and invades a warm-blooded vertebrate host via skin penetration.
    explanation: >-
      Directly supports the initiating skin-penetration mechanism.
  downstream:
  - target: Cercarial sensitization and Th2-skewed re-exposure response
    description: >-
      Recurrent cercarial penetration elicits a stronger type-2 allergic
      response than primary penetration.
  - target: Acute allergic cutaneous inflammation
    description: >-
      Skin penetration by dead-end schistosomatid larvae exposes the host to
      larval antigens that initiate allergic dermatitis.
- name: Cercarial sensitization and Th2-skewed re-exposure response
  description: >-
    Prior cercarial dermatitis sensitizes the host so later cercarial exposure
    has faster onset and heavier symptoms with eosinophilia, increased IL-4, and
    a mast-cell and basophil type-I-hypersensitivity signal in mouse models.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  - preferred_term: basophil
    term:
      id: CL:0000767
      label: basophil
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: type I hypersensitivity
    term:
      id: GO:0016068
      label: type I hypersensitivity
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
  evidence:
  - reference: PMID:30302587
    reference_title: >-
      Cercarial dermatitis: a systematic follow-up study of human cases with
      implications for diagnostics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of CD was significantly faster, and the symptoms were heavier in
      participants with a history of CD if compared to naive ones
    explanation: >-
      Shows that human re-exposure accelerates and amplifies cercarial
      dermatitis.
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cercarial dermatitis in reinfected mice is therefore Th2 polarized, with a
      response comprised of an early type I hypersensitivity reaction and
      late-phase skin inflammation
    explanation: >-
      Supports a Th2 and type-I-hypersensitivity re-exposure mechanism in the
      mouse model.
  - reference: PMID:30302587
    reference_title: >-
      Cercarial dermatitis: a systematic follow-up study of human cases with
      implications for diagnostics.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      specific IgE response was not observed.
    explanation: >-
      Provides the human counterpoint to the mouse IgE-dependent model of
      mast-cell and basophil degranulation.
  downstream:
  - target: Acute allergic cutaneous inflammation
    description: >-
      Sensitization increases the intensity and speed of subsequent allergic
      cutaneous inflammation.
  - target: Eosinophilia
    description: Repeatedly exposed patients show elevated eosinophils.
- name: Acute allergic cutaneous inflammation
  description: >-
    Human cercarial dermatitis is an allergic cutaneous inflammatory reaction to
    invasive schistosomatid cercariae that produces local pruritic, erythematous,
    papular, vesicular, edematous, and pigmented skin lesions.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  biological_processes:
  - preferred_term: acute inflammatory response
    term:
      id: GO:0002526
      label: acute inflammatory response
  evidence:

- phase: Primary papular dermatitis
  duration: Papules usually regress by 4-10 days after cercarial penetration
  notes: >-
    Primary exposure may be clinically inapparent or may produce small transient
    macules, maculopapules, or papules 0.5 to 2 days after penetration.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      small and transient macules, maculopapules, or inconspicuous papules of
      about 1 to 2 mm after 0.5 to 2 days p.i.
    explanation: >-
      Places the small papular eruption in the delayed interval after primary
      exposure.
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Papules usually regress and disappear at 4 to 10 days p.i.
    explanation: >-
      Gives the usual interval by which papules resolve.
- phase: Re-exposure amplified dermatitis
  notes: >-
    Recurrent cercarial dermatitis produces faster onset and heavier symptoms,
    and the cutaneous reaction can include diffuse edema, erythematous papules
    and papulovesicles.
  evidence:
  - reference: PMID:30302587
    reference_title: >-
      Cercarial dermatitis: a systematic follow-up study of human cases with
      implications for diagnostics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of CD was significantly faster, and the symptoms were heavier in
      participants with a history of CD if compared to naive ones
    explanation: >-
      Demonstrates that previous cercarial dermatitis accelerates and amplifies
      subsequent disease in humans.
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Repeated infections cause a more pronounced cutaneous reaction followed by
      diffuse edema and development of erythematous papules or papulovesicles
    explanation: >-
      Describes the edema and erythematous papular or vesicular lesions of the
      stronger repeat-exposure response.
diagnosis:
- name: Exposure history and exposed-skin eruption pattern
  description: >-
    A recent water-reservoir exposure followed by maculopapular eruption on the
    exposed skin is an important clinical clue; the morphology overlaps with
    insect bites, bacterial dermatitis, contact dermatitis, and cnidarian
    nematocyst reactions.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anamnestic data (suggesting recent contact with water reservoirs) and
      maculopapular skin eruption on the body parts that were in contact with
      water are important indicators.
    explanation: >-
      Supports diagnosis from recent water contact plus eruption on exposed skin.
- name: Early papule skin biopsy
  description: >-
    Skin biopsy of a papule can directly demonstrate schistosome infection when
    performed no later than 48 hours after penetration.
  diagnosis_term:
    preferred_term: Skin Biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Direct proof of schistosome infection may be shown by skin biopsy of the
      papulae no later than 48 h p.i.
    explanation: >-
      Supports early papule biopsy as a direct diagnostic approach.
- name: Avian schistosome serology
  description: >-
    Historical serologic assays have been tested for avian schistosome
    penetration, but are not sufficiently specific or sensitive for reliable
    diagnosis.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      indirect fluorescent-antibody test [IFAT], enzyme-linked immunosorbent
      assay [ELISA], and complement fixation test) to detect penetration by avian
      schistosomes are not sufficiently specific or sensitive
    explanation: Documents the review's caution against available serologic tests.
treatments:
- name: Symptomatic antihistamine or mild corticosteroid therapy
  description: >-
    Serious cercarial dermatitis can be treated symptomatically with
    systemic antihistamines such as hydroxyzine or mild topical corticosteroids
    such as triamcinolone or hydrocortisone to reduce itching and local
    inflammation while the self-limited papular eruption resolves.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxyzine
      term:
        id: CHEBI:5818
        label: hydroxyzine
    - preferred_term: triamcinolone
      term:
        id: CHEBI:9667
        label: triamcinolone
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Acute allergic cutaneous inflammation
    treatment_effect: INHIBITS
    description: >-
      Antihistamines and corticosteroids reduce the local allergic inflammatory
      symptoms of serious cercarial dermatitis.
  - target: Cercarial sensitization and Th2-skewed re-exposure response
    treatment_effect: INHIBITS
    description: >-
      Antihistamines and corticosteroids dampen the mediator arm of amplified
      re-exposure reactions.
  evidence:
  - reference: PMID:25567226
    reference_title: Avian schistosomes and outbreaks of cercarial dermatitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In serious cases, application of systemic antihistamines (tablets or gels,
      e.g., hydroxyzine) or mild corticosteroids (e.g., 0.1% triamcinolon cream
      or 1% hydrocortisone ointment) may be considered
    explanation: >-
      Supports symptomatic antipruritic and topical anti-inflammatory therapy
      for more serious cases.

name: ECHS1 Deficiency
creation_date: '2026-07-02T00:00:00Z'
category: Mendelian
synonyms:
- Short-chain enoyl-CoA hydratase deficiency
- SCEH deficiency
- Mitochondrial short-chain enoyl-CoA hydratase 1 deficiency
- ECHS1D
description: 'ECHS1 deficiency is an autosomal-recessive mitochondrial disorder caused by biallelic pathogenic variants in ECHS1, which encodes short-chain enoyl-CoA hydratase (SCEH, crotonase), a multifunctional enzyme of the mitochondrial matrix. SCEH catalyzes the second step of the fatty-acid beta-oxidation spiral (hydration of 2-trans-enoyl-CoA to 3-hydroxyacyl-CoA) and also an early step of valine catabolism (hydration of methacrylyl-CoA and acryloyl-CoA). Affected individuals typically present in infancy with a Leigh syndrome / Leigh-like mitochondrial encephalopathy: bilateral symmetric basal ganglia (putaminal) lesions, developmental delay or regression, dystonia, hypotonia, and elevated lactate, often with sensorineural hearing loss, epilepsy, optic atrophy, and cardiomyopathy; a paroxysmal exercise-induced dyskinesia phenotype is also described.

  Although ECHS1 is a beta-oxidation-spiral enzyme, the prevailing view is that the neurotoxicity is driven mainly by accumulation of toxic valine-pathway intermediates — the highly reactive metabolites methacrylyl-CoA and acryloyl-CoA, which spontaneously react with sulfhydryl groups (cysteine, glutathione, cysteamine) and damage mitochondrial proteins including the pyruvate dehydrogenase complex — rather than by impaired fatty-acid oxidation flux. Mitochondrial fatty-acid beta-oxidation is largely preserved because of overlapping enzyme activities (palmitate loading of patient fibroblasts is typically normal, and routine serum acylcarnitine profiles are usually unremarkable), which distinguishes ECHS1 deficiency from classical fatty-acid oxidation disorders and explains why a valine-restricted diet is being explored therapeutically.

  '

pathophysiology:
- name: ECHS1 (short-chain enoyl-CoA hydratase) enzyme deficiency
  description: 'Biallelic pathogenic variants in ECHS1 markedly reduce short-chain enoyl-CoA hydratase (SCEH/crotonase) protein and enzyme activity in the mitochondrial matrix. SCEH is a multifunctional hydratase acting on substrates from several pathways, catalyzing the second step of the fatty-acid beta-oxidation spiral and an early hydration step of valine catabolism.

    '

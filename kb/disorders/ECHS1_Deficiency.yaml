treatments:
- name: Valine- and fat-restricted diet
  description: 'Because the neurotoxicity is attributed to accumulation of valine-pathway intermediates (methacrylyl-CoA and acryloyl-CoA), a valine-restricted (and fat-restricted) diet is being explored as a mechanism-directed, investigational therapy aimed at reducing production of the toxic metabolites. Reported outcomes are variable; in one pediatric case a valine- and fat-restricted diet was associated with improvement in dystonia and appeared to limit disease progression, but evidence remains limited to small case reports.

    '
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
    dietary_modifications:
    - action: RESTRICT
      description: Restriction of dietary valine (and branched-chain amino acids) to reduce toxic valine-pathway metabolite production.
    - action: RESTRICT
      description: Restriction of total and dairy fat intake as an adjunct in the reported regimen.
  evidence:
  - reference: PMID:36064416
    reference_title: Clinical improvements after treatment with a low-valine and low-fat diet in a pediatric patient with enoyl-CoA hydratase, short chain 1 (ECHS1) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A valine-restricted and total fat-restricted diet was considered as a therapeutic option after the genetic diagnosis.
    explanation: Documents the valine- and fat-restricted diet as a therapeutic approach in ECHS1 deficiency.
  - reference: PMID:36064416
    reference_title: Clinical improvements after treatment with a low-valine and low-fat diet in a pediatric patient with enoyl-CoA hydratase, short chain 1 (ECHS1) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After three years, the patient noticed an improvement in dystonia, especially in walking.
    explanation: Single-case improvement in dystonia after dietary therapy; supports an investigational benefit while highlighting the limited evidence base.
  - reference: PMID:31219693
    reference_title: Mitochondrial Short-Chain Enoyl-CoA Hydratase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Targeted therapies: Valine-restricted diet; N-acetylcysteine'
    explanation: GeneReviews synthesis identifying valine-restricted diet and N-acetylcysteine supplementation as targeted therapies for ECHS1 deficiency.
- name: N-Acetylcysteine Supplementation
  description: Oral N-acetylcysteine supplementation aimed at replenishing depleted cellular thiol/glutathione pools and conjugating toxic reactive valine-pathway intermediates (methacrylyl-CoA and acryloyl-CoA).
  notes: 'GeneReviews also highlights agents and circumstances to avoid in management: mitochondrial toxins (such as sodium valproate and prolonged propofol infusions), catabolic fasting stress, lactate-containing intravenous fluids, and ketogenic diet.'
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetyl-L-cysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  evidence:
  - reference: PMID:31219693
    reference_title: Mitochondrial Short-Chain Enoyl-CoA Hydratase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Targeted therapies: Valine-restricted diet; N-acetylcysteine'
    explanation: GeneReviews synthesis identifying N-acetylcysteine supplementation alongside valine-restricted diet as a targeted therapy for ECHS1 deficiency.
  - reference: PMID:31219693
    reference_title: Mitochondrial Short-Chain Enoyl-CoA Hydratase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Agents/circumstances to avoid: Mitochondrial toxins (e.g., sodium valproate, prolonged propofol infusions); anesthesia should be used with caution; prevent catabolism; avoid lactate-containing agents; ketogenic diet may be poorly tolerated.'
    explanation: Documents key pharmacological and metabolic precautions in managing patients with ECHS1 deficiency.
notes: 'Framing note: ECHS1 is included among fatty-acid beta-oxidation-spiral enzymes (it catalyzes the second, hydration step of the spiral), which is why it appears in beta-oxidation sweeps. However, functional studies indicate that ECHS1/SCEH is only of limited importance for mitochondrial fatty-acid oxidation flux (palmitate loading of patient fibroblasts is typically normal and routine serum acylcarnitines are usually unremarkable), while it is crucial for valine catabolism. The prevailing pathomechanistic model is that disease is driven mainly by accumulation of the toxic, highly reactive valine-pathway intermediates methacrylyl-CoA and acryloyl-CoA — which react with sulfhydryl groups and impair the pyruvate dehydrogenase complex and respiratory chain — producing a Leigh / Leigh-like basal ganglia encephalopathy, rather than by impaired fatty-acid oxidation.

  '

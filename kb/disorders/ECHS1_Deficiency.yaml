prevalence:
- population: Global published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: ECHS1 deficiency is a rare inborn error of metabolism. It was first described in 2014, and subsequent case series and reviews have reported a growing but still small number of patients worldwide; a precise population prevalence has not been established. Haack et al. identified ten unrelated individuals by exome sequencing across three diagnostic centers screening cohorts with suspected mitochondrial disease.
  evidence:
  - reference: PMID:26000322
    reference_title: Deficiency of ECHS1 causes mitochondrial encephalopathy with cardiac involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using exome sequencing, we identified ten unrelated individuals carrying compound heterozygous or homozygous mutations in ECHS1.
    explanation: Haack et al. report the size of the initial multi-center ECHS1-deficiency cohort, reflecting the rarity of the disorder.

- name: Reactive-metabolite mitochondrial and pyruvate dehydrogenase toxicity
  description: 'Reactive valine-pathway intermediates deplete cellular thiol pools and damage mitochondrial proteins, producing a secondary pyruvate dehydrogenase (PDH) deficiency and secondary respiratory-chain dysfunction. This bioenergetic failure links the primary enzyme defect to the Leigh-like neurodegeneration, mirroring other mitochondrial energy-metabolism disorders.

    '

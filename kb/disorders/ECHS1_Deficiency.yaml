    reference_title: ECHS1 mutations cause combined respiratory chain deficiency resulting in Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The human ECHS1 gene encodes the short-chain enoyl coenzyme A hydratase, the enzyme that catalyzes the second step of β-oxidation of fatty acids in the mitochondrial matrix.
    explanation: Defines the gene product and its localization to the mitochondrial matrix as the second-step beta-oxidation hydratase.
  - reference: PMID:25393721
    reference_title: ECHS1 mutations cause combined respiratory chain deficiency resulting in Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ECHS1 protein expression was severely depleted in the patient's skeletal muscle and patient-derived myoblasts; a marked decrease in enzyme activity was also evident in patient-derived myoblasts.
    explanation: Patient tissue and myoblast studies confirm loss of ECHS1 protein and enzyme activity.
  - reference: PMID:25125611
    reference_title: 'ECHS1 mutations in Leigh disease: a new inborn error of metabolism affecting valine metabolism.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ECHS1 activity was markedly decreased in cultured fibroblasts from both siblings, ECHS1 protein was undetectable by immunoblot analysis and transfection of patient cells with wild-type ECHS1 rescued ECHS1 activity.
    explanation: Loss of ECHS1 activity with wild-type rescue establishes pathogenicity of the enzyme deficiency.
  - reference: PMID:40446940
    reference_title: Deficiency in the conserved ECHS1 gene causes Leigh syndrome by impairing mitochondrial respiration efficiency and suppressing ADRB2-PKA signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The ECHS1 variants exhibit reduced 2-enoyl-CoA hydratase activity, resulting in a restricted ATP production rate, but the cellular ATP levels remains unchanged.
    explanation: Functional characterization confirms that pathogenic ECHS1 variants reduce 2-enoyl-CoA hydratase activity and restrict mitochondrial ATP production rate.

      label: lens fiber cell
  evidence:
  - reference: PMID:10603348
    reference_title: Regulation of mouse lens fiber cell development and differentiation by the Maf gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant Maf protein binds to T-MARE sites in the (alpha)A-, (beta)B2-, and (beta)A4-crystallin promoters but fails to bind to a point mutation in the (alpha)A-crystallin promoter that has been shown previously to be required for promoter function."
    explanation: MAF binds MAF recognition elements in crystallin promoters.
  - reference: PMID:25064449
    reference_title: Differential effect of cataract-associated mutations in MAF on transactivation of MAF target genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "K297R did not lead to a significant reduction in expression of any of the four constructs, although there was a tendency toward reduced expression especially for the CRYGA construct."
    explanation: The transactivation defect varies by allele; K297R has only a trend toward reduction.
  - reference: PMID:25064449
    reference_title: Differential effect of cataract-associated mutations in MAF on transactivation of MAF target genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that differential effects of mutations on the transactivation potential of c-MAF could be a molecular correlate of the striking genotype-phenotype correlations seen in cataract forms caused by mutations in the MAF gene."
    explanation: The authors relate allele-specific transactivation defects to the different cataract types.
  downstream:
  - target: Defective Lens Fiber Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      Loss of MAF in mice abolishes crystallin expression and blocks fiber
      cell elongation and differentiation. The link is shown for loss of
      Maf, not for the human heterozygous missense alleles.
    evidence:
    - reference: PMID:10097114
      reference_title: Requirement for the c-Maf transcription factor in crystallin gene regulation and lens development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Here we show that mice lacking the transcription factor c-Maf are microphthalmic secondary to defective lens formation, specifically from the failure of posterior lens fiber elongation."
      explanation: Homozygous Maf knockout mice fail to elongate posterior lens fiber cells; indirect because it is complete loss in mice.
    - reference: PMID:10603348
      reference_title: Regulation of mouse lens fiber cell development and differentiation by the Maf gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Our results indicate that Maf directly activates many if not all of the (beta)-crystallin genes, and suggest a model for coordinating cell cycle withdrawal with terminal differentiation."
      explanation: Ties MAF target-gene activation to fiber cell cell-cycle exit and terminal differentiation in Maf mutant mice.
  - target: Lens Cell Oxidative Stress and Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Shown for one N-terminal frameshift allele (c.177dup) in cultured cells.
    intermediate_mechanisms:
    - Reduced CRYAA and CRYGA transcription changes ME and G6PD expression and raises reactive oxygen species.
    evidence:
    - reference: PMID:36719481
      reference_title: Novel cataract-causing variant c.177dupC in c-MAF regulates the expression of crystallin genes for cell apoptosis via a mitochondria-dependent pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Further functional analyses suggested that the c-MAF mutant induces the transcriptional inhibition of CRYAA and CRYGA and subsequently influences ME and G6PD expression levels, ultimately resulting in ROS generation and further leading to cell apoptosis via mitochondria-dependent pathways."
      explanation: Cell-based study of the c.177dup allele links reduced crystallin transcription to oxidative stress and apoptosis.
- name: Defective Lens Fiber Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    MAF is strongly induced at the lens equator, where epithelial cells leave
    the cell cycle and become fiber cells. Without MAF, posterior lens cells
    fail to elongate, keep synthesizing DNA and do not express alpha-A and
    beta-crystallins; deleting Maf in adult mice also disrupts fiber cell
    differentiation and lens structure.
  cell_types:
  - preferred_term: lens fiber cell

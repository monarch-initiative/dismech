  description: >-
    Cataract is the defining feature and is usually bilateral, with onset at
    birth or in childhood. Severe early forms include dense bilateral
    nuclear and cortical cataract operated on at 7-8 weeks (K308E) and a
    total unilateral cataract that progressed rapidly in a 4-year-old
    (Y301H).
  phenotype_term:
    preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:24664492
    reference_title: "Identification of a novel missense mutation of MAF in a Japanese family with congenital cataract by whole exome sequencing: a clinical report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected members showed congenital cataracts."
    explanation: Congenital cataract in all six affected members of a Gln303 family.
  - reference: PMID:38487030
    reference_title: "Case report: Whole exome sequencing identified a novel mutation (p.Y301H) of MAF in a Chinese family with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected proband, a four-year-old boy was admitted to Hebei General Hospital and diagnosed as a total congenital cataract of the right eye"
    explanation: Total cataract in the Y301H proband.
  - reference: PMID:12642301
    reference_title: Pulverulent cataract with variably associated microcornea and iris coloboma in a MAF mutation family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five members of a three generation pedigree with progressive cataracts underwent detailed ophthalmic examination to characterise associated ocular phenotypic features."
    explanation: The cataract in the R288P family is progressive.
  sequelae:
  - target: Amblyopia
    description: >-
      A dense opacity in early infancy deprives the developing visual system
      of a formed image, causing deprivation amblyopia unless the lens is
      removed early.
    evidence:
    - reference: PMID:19084444
      reference_title: The critical period for surgical treatment of dense congenital bilateral cataracts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Deprivation amblyopia may be minimized with early surgery for dense congenital bilateral cataracts."
      explanation: >-
        Cohort of infants with dense bilateral congenital cataract of
        unspecified cause; indirect because it was not genotyped for MAF.

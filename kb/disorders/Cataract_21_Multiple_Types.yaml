inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous MAF variants segregate with cataract in multigenerational
    families, and de novo heterozygous variants are found in sporadic
    patients whose parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:16470690
    reference_title: "A novel mutation in the DNA-binding domain of MAF at 16q23.1 associated with autosomal dominant \"cerulean cataract\" in an Indian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This sequence change was considered pathogenic as it segregated in all affected family members, neither seen in unaffected family members nor in 106 unrelated controls."
    explanation: Heterozygous K297R segregates with cataract across three generations.
  - reference: PMID:30659945
    reference_title: A novel MAF missense mutation leads to congenital nuclear cataract by impacting the transactivation of crystallin and noncrystallin genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation is in highly conserved EHR region of MAF and co-segregates with the cataract in the family."
    explanation: V271E co-segregates with cataract in a three-generation family.
  - reference: PMID:38927621

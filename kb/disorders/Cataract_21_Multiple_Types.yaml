      snippet: "After tamoxifen injection, adult c-MafΔTAM mice showed successful deletion of c-Maf protein and developed severe cataracts; cataracts are also seen in human patients who have mutations in the c-MAF DNA binding domain."
      explanation: Loss of MAF with impaired fiber differentiation is followed by severe cataract in mice.

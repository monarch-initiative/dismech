    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All variants were missense, as in our patient, and either inherited in an autosomal dominant fashion or de novo (similar to our patient)"
    explanation: Literature review of seventeen C-terminal MAF variants finds dominant inheritance or de novo occurrence for all.
  - reference: PMID:38927621
    reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

genetic:
- name: MAF
  gene_term:
    preferred_term: MAF
    term:
      id: hgnc:6776
      label: MAF
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    MAF is also the gene for Ayme-Gripp syndrome; the published split is by
    domain, with C-terminal DNA-binding-domain variants causing isolated
    cataract and N-terminal transactivation-domain variants causing the
    syndrome. The c.177dup frameshift (transactivation domain, residue 60)
    was reported in a family described only as having congenital cataract.
    No ClinGen gene-disease validity record for MAF is cached in this
    repository, so gene_disease_validity is omitted.
  evidence:
  - reference: PMID:11772997
    reference_title: "Domain disruption and mutation of the bZIP transcription factor, MAF, associated with cataract, ocular anterior segment dysgenesis and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through mutation screening of a panel of patients with hereditary congenital cataract we identified a mutation in MAF in a three-generation family with cataract, microcornea and iris coloboma."
    explanation: First report of MAF as a cataract gene.
  - reference: PMID:38487030
    reference_title: "Case report: Whole exome sequencing identified a novel mutation (p.Y301H) of MAF in a Chinese family with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, we have documented a new MAF mutation within a Chinese family exhibiting isolated congenital cataracts."
    explanation: A further MAF basic-region allele in a family with isolated cataract.
  - reference: PMID:38927621
    reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Seventeen variants have been described in the literature associated with isolated, non-syndromic congenital cataracts (Table 1, Figure 2), similar to our patient."
    explanation: Literature count of C-terminal MAF variants with isolated cataract.
  variants:
  - name: R288P (c.863G>C)
    description: >-
      Basic region; pulverulent cataract with variable microcornea and iris
      coloboma. Abolishes transactivation on a crystallin promoter element
      and mislocalizes MAF to nuclear foci.
    evidence:
    - reference: PMID:11772997
      reference_title: "Domain disruption and mutation of the bZIP transcription factor, MAF, associated with cataract, ocular anterior segment dysgenesis and coloboma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation results in the substitution of an evolutionarily highly conserved arginine with a proline at residue 288 (R288P) in the basic region of the DNA-binding domain of MAF."
      explanation: Identification of R288P.
  - name: K297R (c.890A>G)
    description: Basic region; cerulean cataract with microcornea in some carriers.
    evidence:
    - reference: PMID:16470690
      reference_title: "A novel mutation in the DNA-binding domain of MAF at 16q23.1 associated with autosomal dominant \"cerulean cataract\" in an Indian family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation also results in substitution of highly conserved lysine 297 by arginine (K297R) that affects a residue that forms a part of a predicted DNA-interaction region of the protein."
      explanation: Identification of K297R.
  - name: R299S (c.895C>A)
    description: Basic region; congenital cataract-microcornea.
    evidence:
    - reference: PMID:17982426
      reference_title: Novel MAF mutation in a family with congenital cataract-microcornea syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation c.895C>A changes arginine 299 to a serine residue, and the substitution destroys the basic region of the DNA binding domain of MAF leucine-zipper."
      explanation: Identification of R299S.
  - name: V271E (c.812T>A)
    description: Extended homology region; nuclear and lamellar cataract; reduces transactivation of crystallin and non-crystallin genes.
    evidence:
    - reference: PMID:30659945
      reference_title: A novel MAF missense mutation leads to congenital nuclear cataract by impacting the transactivation of crystallin and noncrystallin genes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel MAF mutation (c.812 T > A, p.Val271Glu) was identified by targeted next-generation sequencing."
      explanation: Identification of V271E.
  - name: Y301H (c.901T>C)
    description: Basic region; total congenital cataract in a Chinese family.
    evidence:
    - reference: PMID:38487030
      reference_title: "Case report: Whole exome sequencing identified a novel mutation (p.Y301H) of MAF in a Chinese family with congenital cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Through whole exome sequencing and subsequent data filtration, a new mutation (NM_005360, c.901T>C/p.Y301H) in the MAF gene was detected."
      explanation: Identification of Y301H.
  - name: K308E (c.922A>G)
    description: Flanks the leucine zipper; de novo; bilateral nuclear and cortical congenital cataract without anterior segment anomalies.
    evidence:
    - reference: PMID:38927621
      reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "No syndromic findings or anterior segment abnormalities were identified."
      explanation: The K308E patient has isolated cataract.
  - name: Gln303 missense (reported as Q303L)
    description: >-
      Basic region; congenital cataract with microcornea in three and iris
      coloboma in one of six affected relatives. The abstract names Q303L;
      a later review tabulates the same family as c.908A>C (p.Gln303Pro).
    evidence:
    - reference: PMID:24664492
      reference_title: "Identification of a novel missense mutation of MAF in a Japanese family with congenital cataract by whole exome sequencing: a clinical report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The heterozygous MAF mutation Q303L detected in the present family occurs in a well conserved glutamine residue at the basic region of the DNA-binding domain."
      explanation: Identification of the Gln303 allele.
  - name: L316P (c.947T>C)
    description: Leucine zipper; congenital cataract.
    evidence:
    - reference: PMID:36097645
      reference_title: Broadening the genotypic and phenotypic spectrum of MAF in three Chinese Han congenital cataracts families.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified two novel (c.173C>A, p.Thr58Asn and c.947T>C, p. Leu316Pro) variants and one known (c.173C>T, p.Thr58Ile) MAF missense variant in three patients."
      explanation: Identification of L316P; the Thr58 variants in the same report are Ayme-Gripp alleles.
  - name: t(5;16)(p15.3;q23.2)
    description: >-
      Balanced and unbalanced translocation whose 16q23.2 breakpoint
      transects the MAF genomic-control domain; cataract, anterior segment
      dysgenesis and microphthalmia.
    evidence:
    - reference: PMID:11772997
      reference_title: "Domain disruption and mutation of the bZIP transcription factor, MAF, associated with cataract, ocular anterior segment dysgenesis and coloboma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cloning the 16q23.2 breakpoint demonstrated that it transected the genomic-control domain of MAF, a basic region leucine zipper (bZIP) transcription factor, first identified as an oncogene, which is expressed in vertebrate lens development and regulates the expression of the eye lens crystallins."
      explanation: Breakpoint mapping of the translocation.

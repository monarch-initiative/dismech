    explanation: A de novo heterozygous K308E variant in a sporadic patient.
pathophysiology:
- name: Pathogenic MAF Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline MAF alleles, nearly all missense changes at
    conserved residues of the C-terminal DNA-binding domain: the extended
    homology region (V271E), the basic region (R288P, K297R, R299S, Y301H,
    Gln303) and the leucine zipper and its flank (K308E, L316P). One family
    carries a t(5;16)(p15.3;q23.2) translocation whose 16q23.2 breakpoint
    transects the MAF genomic-control domain, and one family carries an
    N-terminal frameshift (c.177dup). How each allele changes MAF function
    differs (see the downstream nodes and the dominance discussion).
  genes:
  - preferred_term: MAF
    term:
      id: hgnc:6776
      label: MAF
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: ABNORMAL
    description: >-
      The alleles alter the DNA-binding transcription factor in ways that
      differ between variants (loss of transactivation, selective change in
      DNA-binding specificity), so the change is recorded as ABNORMAL rather
      than a uniform decrease.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:11772997
    reference_title: "Domain disruption and mutation of the bZIP transcription factor, MAF, associated with cataract, ocular anterior segment dysgenesis and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation results in the substitution of an evolutionarily highly conserved arginine with a proline at residue 288 (R288P) in the basic region of the DNA-binding domain of MAF."
    explanation: The founding R288P allele lies in the basic region of the DNA-binding domain.
  - reference: PMID:11772997
    reference_title: "Domain disruption and mutation of the bZIP transcription factor, MAF, associated with cataract, ocular anterior segment dysgenesis and coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cloning the 16q23.2 breakpoint demonstrated that it transected the genomic-control domain of MAF, a basic region leucine zipper (bZIP) transcription factor, first identified as an oncogene, which is expressed in vertebrate lens development and regulates the expression of the eye lens crystallins."
    explanation: A translocation breakpoint disrupting the MAF regulatory domain is a second, non-coding lesion type.
  - reference: PMID:16470690
    reference_title: "A novel mutation in the DNA-binding domain of MAF at 16q23.1 associated with autosomal dominant \"cerulean cataract\" in an Indian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation also results in substitution of highly conserved lysine 297 by arginine (K297R) that affects a residue that forms a part of a predicted DNA-interaction region of the protein."
    explanation: K297R alters a predicted DNA-contacting residue of the basic region.
  - reference: PMID:17982426
    reference_title: Novel MAF mutation in a family with congenital cataract-microcornea syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation c.895C>A changes arginine 299 to a serine residue, and the substitution destroys the basic region of the DNA binding domain of MAF leucine-zipper."
    explanation: R299S is a third basic-region allele.
  - reference: PMID:36097645
    reference_title: Broadening the genotypic and phenotypic spectrum of MAF in three Chinese Han congenital cataracts families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated associations of variants in the MAF C-terminal DNA-binding domain with CCs and associations of variants in the N-terminal transactivation domain of MAF with AYGRPS."
    explanation: Places isolated congenital cataract alleles in the C-terminal DNA-binding domain, distinct from the Ayme-Gripp transactivation-domain alleles.
  downstream:
  - target: Impaired MAF Transactivation of Crystallin and Lens Genes
    causal_link_type: DIRECT
    description: >-
      The DNA-binding-domain alleles reduce MAF-driven activation of
      crystallin and non-crystallin lens gene promoters, to an extent that
      differs by allele and by target.
    evidence:
    - reference: PMID:30659945
      reference_title: A novel MAF missense mutation leads to congenital nuclear cataract by impacting the transactivation of crystallin and noncrystallin genes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Dual luciferase activity assay shows the mutation significantly impair the transcriptional activity of four crystallin genes (CRYAA, CRYBA4, CRYBA1, and CRYGA) and two non-crystallin genes (HMOX1 and KDELR2)."
      explanation: V271E reduces MAF transactivation of crystallin and non-crystallin promoters in reporter assays.
    - reference: PMID:25064449
      reference_title: Differential effect of cataract-associated mutations in MAF on transactivation of MAF target genes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutation R288P significantly reduced the expression of the CRYGA and CRYBA1 constructs but had no significant effect on the other two constructs."
      explanation: R288P reduces activation of two of four crystallin promoters in HEK cell reporter assays.
    - reference: PMID:25064449
      reference_title: Differential effect of cataract-associated mutations in MAF on transactivation of MAF target genes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "R299S, which is associated with the most severe phenotype, congenital cataract, and microcornea syndrome, was associated with the most severe overall effect on the transactivation of the four crystallin expression constructs."
      explanation: R299S has the strongest effect on crystallin promoter activation.
    - reference: PMID:15199128
      reference_title: Synergistic transcription activation by Maf and Sox and their subnuclear localization are disrupted by a mutation in Maf that causes cataract.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A mutation in the ancillary DNA binding domain of Maf (R288P) that has been shown to cause cataract eliminated the transcriptional activity of Maf but had no detectable effect on DNA binding in vitro."
      explanation: R288P abolishes MAF transcriptional activity on a crystallin promoter element in a lens cell line.
    - reference: PMID:12620964
      reference_title: A dominant mutation within the DNA-binding domain of the bZIP transcription factor Maf causes murine cataract and results in selective alteration in DNA binding.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "We have demonstrated that this mutation results in a selective alteration in DNA binding affinities to target oligonucleotides containing variations in the core CRE and TRE elements."
      explanation: >-
        The mouse Ofl allele R291Q, at a basic-region residue near the human
        alleles, changes which target sites MAF binds; indirect because it is
        a mouse allele tested on oligonucleotides rather than a human variant
        on promoters.
  - target: Mutant MAF Sequestration in Nuclear Foci
    causal_link_type: DIRECT
    description: Shown only for R288P.
    evidence:
    - reference: PMID:15199128
      reference_title: Synergistic transcription activation by Maf and Sox and their subnuclear localization are disrupted by a mutation in Maf that causes cataract.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Whereas wild-type Maf was uniformly distributed in the nucleoplasm, R288P Maf was enriched in nuclear foci."
      explanation: R288P MAF mislocalizes to nuclear foci in transfected cells.
  - target: Abnormal Anterior Segment Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      MAF alleles and the MAF regulatory-domain translocation co-segregate
      with microcornea, iris coloboma, anterior segment dysgenesis and
      microphthalmia, and the authors infer a role for the lens in
      anterior segment development; the intermediate steps have not been
      studied.
    evidence:
    - reference: PMID:16470690
      reference_title: "A novel mutation in the DNA-binding domain of MAF at 16q23.1 associated with autosomal dominant \"cerulean cataract\" in an Indian family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The association of microcornea with congenital cataract in some affected individuals further underlines the role of the MAF transcription factor in lens and anterior ocular development."
      explanation: Inference from co-occurrence of microcornea with K297R cataract; the mechanism is not tested.
    - reference: PMID:12620964
      reference_title: A dominant mutation within the DNA-binding domain of the bZIP transcription factor Maf causes murine cataract and results in selective alteration in DNA binding.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, when bred onto a different genetic background Ofl heterozygotes also show anterior segment abnormalities."
      explanation: A heterozygous Maf DNA-binding-domain allele produces anterior segment abnormalities in mice, depending on genetic background.
- name: Mutant MAF Sequestration in Nuclear Foci
  biological_scale: CELLULAR
  description: >-
    R288P MAF accumulates in nuclear foci next to Cajal bodies instead of
    spreading through the nucleoplasm, and recruits Sox proteins and other
    partners there. The authors propose that this sequestration of normal
    partners explains why the allele is dominant. Shown only for R288P, in
    transfected cells.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:15199128
    reference_title: Synergistic transcription activation by Maf and Sox and their subnuclear localization are disrupted by a mutation in Maf that causes cataract.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type Maf formed complexes with Sox proteins in the nucleoplasm, whereas R288P Maf recruited Sox proteins as well as other interaction partners to the nuclear foci."
    explanation: R288P draws Sox partners into abnormal nuclear foci.
  downstream:
  - target: Impaired MAF Transactivation of Crystallin and Lens Genes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed: sequestering partners such as Sox proteins would lower
      crystallin promoter activation by the remaining wild-type MAF. Not
      tested directly.
    evidence:
    - reference: PMID:15199128
      reference_title: Synergistic transcription activation by Maf and Sox and their subnuclear localization are disrupted by a mutation in Maf that causes cataract.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "The mislocalization of normal cellular proteins to these foci provides a potential explanation for the dominant disease phenotype of the R288P mutation in Maf."
      explanation: The authors offer partner sequestration as a hypothesis for dominance; it was not tested.
- name: Impaired MAF Transactivation of Crystallin and Lens Genes
  biological_scale: MOLECULAR
  description: >-
    MAF binds MAF recognition elements in alpha-, beta- and gamma-crystallin
    promoters and activates them. Disease alleles reduce activation of
    crystallin genes (CRYAA, CRYBA1, CRYBA4, CRYGA) and of non-crystallin
    lens genes (HMOX1, KDELR2) to different degrees: in one comparison R299S
    had the largest effect, R288P reduced two of four promoters, and K297R
    caused no significant reduction.
  genes:
  - preferred_term: MAF
    term:
      id: hgnc:6776
      label: MAF
  molecular_functions:
  - preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
    term:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    modifier: DECREASED
  cell_types:
  - preferred_term: lens fiber cell
    term:

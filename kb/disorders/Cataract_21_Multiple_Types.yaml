name: Cataract 21 Multiple Types
creation_date: "2026-10-27T14:55:25Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- cataract 21, multiple types
- CTRCT21
- MAF early-onset non-syndromic cataract
- early-onset non-syndromic cataract caused by mutation in MAF
description: >-
  Autosomal dominant, usually non-syndromic early-onset cataract caused by
  heterozygous variants in MAF, which encodes c-MAF, a large-MAF basic leucine
  zipper (bZIP) transcription factor that drives crystallin gene expression and
  lens fiber cell differentiation. Disease alleles are almost all missense
  changes in the C-terminal DNA-binding domain (extended homology region,
  basic region and leucine zipper), inherited dominantly or arising de novo;
  the first family carried R288P, and a balanced and unbalanced
  t(5;16)(p15.3;q23.2) translocation that transects the MAF genomic-control
  domain has also been reported. Cataract morphology is unusually varied, even
  within one family: pulverulent (cortical or nuclear), cerulean, nuclear,
  lamellar and total opacities are all described, with onset from birth to
  juvenile age and variable progression. Microcornea and, less often, iris
  coloboma accompany the cataract in some relatives, and the translocation
  family also had anterior segment dysgenesis and microphthalmia. In reporter
  assays the disease alleles reduce MAF transactivation of crystallin and
  non-crystallin lens genes to different degrees, and Maf-deficient mice fail
  to elongate and differentiate lens fiber cells. The allelic Ayme-Gripp
  syndrome, caused by MAF transactivation-domain variants that impair GSK3
  phosphorylation, adds hearing loss, seizures and developmental delay.
  Management is surgical lens extraction with optical and amblyopia care.

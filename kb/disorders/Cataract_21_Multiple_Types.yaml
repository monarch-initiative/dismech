    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Maf is expressed in the lens vesicle after invagination, and becomes highly upregulated in the equatorial zone, the site at which self-renewing anterior epithelial cells withdraw from the cell cycle and terminally differentiate into posterior fiber cells."
    explanation: Places MAF at the epithelial-to-fiber transition.
  - reference: PMID:31969519
    reference_title: c-MAF deletion in adult C57BL/6J mice induces cataract formation and abnormal differentiation of lens fiber cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, adult c-MafΔTAM mice exhibited abnormal lens structure and impaired differentiation of lens fiber cells."
    explanation: Postnatal Maf deletion impairs fiber cell differentiation.
  downstream:

differential_diagnoses:
- name: Ayme-Gripp syndrome
  description: >-
    The allelic MAF disorder. It shares early bilateral cataract but is
    caused mainly by N-terminal transactivation-domain variants that impair
    GSK3 phosphorylation, and adds sensorineural hearing loss, seizures,
    developmental delay, short stature and a characteristic face. Where the
    variant lies in MAF is the main molecular discriminator.
  disease_term:
    preferred_term: Ayme-Gripp syndrome
    term:
      id: MONDO:0010992
      label: Ayme-Gripp syndrome
  distinguishing_features:
  - Sensorineural hearing loss, seizures, developmental delay and short stature are features of Ayme-Gripp syndrome and absent in cataract 21.
  - Ayme-Gripp variants are mostly in the N-terminal transactivation domain; cataract 21 variants are mostly in the C-terminal DNA-binding domain.
  evidence:
  - reference: PMID:36097645
    reference_title: Broadening the genotypic and phenotypic spectrum of MAF in three Chinese Han congenital cataracts families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated associations of variants in the MAF C-terminal DNA-binding domain with CCs and associations of variants in the N-terminal transactivation domain of MAF with AYGRPS."
    explanation: Domain-based genotype-phenotype split between the two MAF disorders.
  - reference: PMID:38927621
    reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aymé-Gripp syndrome is characterized by sensorineural hearing loss, seizures, distinct craniofacial features, short stature, and developmental delay in addition to congenital cataracts"
    explanation: Systemic features that distinguish Ayme-Gripp syndrome.
- name: Crystallin-, connexin- or other transcription-factor-related congenital cataract
  description: >-
    Most genetic congenital cataract is caused by crystallin or connexin
    genes, and other lens transcription factors such as PITX3 give similar
    phenotypes; morphology alone does not identify MAF, so a multigene panel
    or exome is needed.
  distinguishing_features:
  - Distinguished by molecular testing rather than by lens morphology.
  evidence:
  - reference: PMID:38927621
    reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The most commonly identified genetic causes include pathogenic variants in lens crystallins (45%), gap junction connexins (16%), and developmental transcription factors such as MAF (MIM #177075) and PITX3 (MIM #602669) (12%)"
    explanation: Introduction restating the published gene spectrum of congenital cataract.

  publication: PMID:10097114
  description: >-
    Homozygous null mice are microphthalmic, with failure of posterior lens
    fiber elongation and severely reduced crystallin expression;
    heterozygous null mice have no cataract.
  modeled_mechanisms:
  - target: Defective Lens Fiber Cell Differentiation
    relationship: PERTURBS
    fidelity: LOW
    limitations: >-
      Complete homozygous loss of Maf is far more severe than the human
      heterozygous missense disease, and heterozygous null mice have clear
      lenses, so the model shows that MAF is required rather than how the
      human alleles act.
    evidence:
    - reference: PMID:10097114
      reference_title: Requirement for the c-Maf transcription factor in crystallin gene regulation and lens development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we show that mice lacking the transcription factor c-Maf are microphthalmic secondary to defective lens formation, specifically from the failure of posterior lens fiber elongation."
      explanation: Lens fiber differentiation fails without Maf.
- name: Ofl (opaque flecks in lens) mouse
  species: Mouse
  genotype: Maf R291Q (heterozygous and homozygous)
  publication: PMID:12620964
  description: >-
    A dominant DNA-binding-domain allele giving mild pulverulent cataract in
    heterozygotes, and anterior segment abnormalities on another genetic
    background.
  modeled_mechanisms:
  - target: Lens Opacification
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      R291Q is a mouse allele, not one of the human variants, and
      homozygotes add renal disease absent from human cataract 21.
    evidence:
    - reference: PMID:12620964
      reference_title: A dominant mutation within the DNA-binding domain of the bZIP transcription factor Maf causes murine cataract and results in selective alteration in DNA binding.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The cataracts seen in Ofl heterozygotes and human MAF mutations are similar to one another, implying that Ofl may be a model of human pulverulent cortical cataract."
      explanation: Heterozygous Ofl cataract resembles the human R288P cataract.
  - target: Abnormal Anterior Segment Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: Anterior segment abnormalities appear only on some genetic backgrounds.
    evidence:
    - reference: PMID:12620964
      reference_title: A dominant mutation within the DNA-binding domain of the bZIP transcription factor Maf causes murine cataract and results in selective alteration in DNA binding.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, when bred onto a different genetic background Ofl heterozygotes also show anterior segment abnormalities."
      explanation: Background-dependent anterior segment phenotype.
- name: Adult inducible Maf knockout mouse
  species: Mouse
  genotype: Maf flox/flox; CAG-Cre-ER (tamoxifen-induced deletion in adults)
  publication: PMID:31969519
  description: Adult deletion of Maf causes severe cataract with abnormal lens structure and impaired fiber cell differentiation.
  modeled_mechanisms:
  - target: Defective Lens Fiber Cell Differentiation
    relationship: PERTURBS
    fidelity: MODERATE
    limitations: Whole-body deletion of both Maf alleles in adults, not a heterozygous developmental missense allele.
    evidence:
    - reference: PMID:31969519
      reference_title: c-MAF deletion in adult C57BL/6J mice induces cataract formation and abnormal differentiation of lens fiber cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, adult c-MafΔTAM mice exhibited abnormal lens structure and impaired differentiation of lens fiber cells."
      explanation: Fiber cell differentiation is impaired after adult Maf deletion.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction for visually significant cataract, from infancy for dense
    congenital opacities (lensectomy and anterior vitrectomy at 7-8 weeks
    with aphakic contact lenses in the K308E patient; extraction with
    posterior chamber intraocular lens at 4 years for Y301H). Follow-up
    includes amblyopia occlusion therapy, strabismus surgery and glaucoma
    monitoring. For dense bilateral congenital cataract the timing of
    surgery in the first weeks governs visual outcome; that evidence comes
    from cohorts not genotyped for MAF. No MAF-directed therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:38927621
    reference_title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient underwent sequential lensectomy and anterior vitrectomy of the right eye at 7 and left eye at 8 weeks of age and was subsequently fitted with aphakic contact lenses."
    explanation: Infant lensectomy in the K308E patient.
  - reference: PMID:38487030
    reference_title: "Case report: Whole exome sequencing identified a novel mutation (p.Y301H) of MAF in a Chinese family with congenital cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, the patient agreed to undergo surgery for cataract extraction and implantation for the posterior chamber intraocular lens, and the eye vision is gradually recovering."
    explanation: Cataract extraction with intraocular lens in the Y301H proband.
  - reference: PMID:19084444
    reference_title: The critical period for surgical treatment of dense congenital bilateral cataracts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "During weeks 0-14, mean visual acuity decreased by 1 line with each 3 weeks' delay in surgery."
    explanation: >-
      Prospective cohort of infants with dense bilateral congenital cataract
      of unspecified cause; indirect because the cohort was not genotyped
      for MAF.
discussions:
- discussion_id: maf_dominant_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Pathogenic MAF Variant
  - pathophysiology#Mutant MAF Sequestration in Nuclear Foci
  prompt: >-
    Do the dominant DNA-binding-domain alleles act by haploinsufficiency, by
    interfering with the wild-type protein, or by changing which targets
    MAF activates?
  rationale: >-
    Mice heterozygous for a Maf null allele have clear lenses while
    heterozygous R291Q (Ofl) mice have cataract, which argues against simple
    haploinsufficiency. R288P sequesters partner proteins in nuclear foci,
    Ofl selectively changes DNA-binding specificity, and a mouse
    transactivation-domain allele (D90V) increases rather than decreases
    target activation, so more than one mechanism may operate. None of
    these has been tested in human lens tissue.
  evidence:
  - reference: PMID:12620964
    reference_title: A dominant mutation within the DNA-binding domain of the bZIP transcription factor Maf causes murine cataract and results in selective alteration in DNA binding.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Since mice heterozygous for knockouts of Maf show no cataracts, this suggests that the Ofl R291Q mutant protein has a dominant effect."
    explanation: Heterozygous null mice lack cataract while the heterozygous missense allele causes it.
  - reference: PMID:17374726
    reference_title: A heterozygous c-Maf transactivation domain mutation causes congenital cataract and enhances target gene activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In reporter assays, D90V results in increased promoter activation, a situation similar to MTD mutations of NRL that also cause human disease."
    explanation: A cataract-causing mouse Maf allele increases transactivation.
- discussion_id: maf_anterior_segment_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Abnormal Anterior Segment Development
  - phenotypes#Microcornea
  - phenotypes#Iris coloboma
  prompt: >-
    How does a variant in a lens transcription factor produce a small cornea
    or iris coloboma, and why do these features vary between relatives with
    the same allele?
  rationale: >-
    Microcornea and coloboma recur in MAF families but affect only some
    carriers, and in mice the Ofl anterior segment phenotype depends on
    genetic background. The reports infer that the lens directs anterior
    segment development, but no study traces the steps from MAF to cornea or
    iris.
  evidence:
  - reference: PMID:24664492
    reference_title: "Identification of a novel missense mutation of MAF in a Japanese family with congenital cataract by whole exome sequencing: a clinical report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the six members showed microcornea and one showed iris coloboma."
    explanation: Anterior segment features affect only some carriers.
notes: >-
  No GeneReviews chapter covers this disorder (just check-genereviews
  returned NO_CHAPTER). No population prevalence has been estimated; reports
  are single families and case reports. Residue numbering follows
  NM_005360. The cortical pulverulent cataract term (HP:0007780) was not
  used because the R288P family had cortical and/or nuclear pulverulent
  opacities, so the broader Pulverulent cataract term is bound. Total
  cataract has no HPO term and is carried under Developmental cataract.
references:
- reference: PMID:38927621
  title: A Case of Non-Syndromic Congenital Cataracts Caused by a Novel MAF Variant in the C-Terminal DNA-Binding Domain-Case Report and Literature Review.

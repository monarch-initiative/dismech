diagnosis:
- name: Characteristic physical examination
  description: >-
    Examination identifies disproportionate short-limb stature with rhizomelic
    shortening, macrocephaly, frontal bossing and midface retrusion,
    brachydactyly, and trident hands.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  results: Characteristic disproportionate skeletal and craniofacial pattern.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with achondroplasia have short stature with rhizomelic shortening of the limbs, macrocephaly, characteristic facies with frontal bossing and midface retrusion, exaggerated lumbar lordosis, limitation of elbow extension and rotation, genu varum, brachydactyly, and trident appearance of the hands."
    explanation: The current review defines the characteristic examination pattern.
- name: Skeletal radiographic evaluation
  description: >-
    Characteristic clinical and radiographic findings establish the diagnosis
    in most individuals; radiographs define long-bone, hand, pelvic, and spinal
    morphology.
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  results: Rhizomelic long-bone shortening and characteristic spinal and pelvic pattern.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Achondroplasia can be diagnosed by characteristic clinical and radiographic findings in most affected individuals."
    explanation: The current review explicitly supports clinical-radiographic diagnosis.
- name: FGFR3 molecular confirmation
  description: >-
    Targeted testing for c.1138G>A and c.1138G>C is highly efficient because
    both produce p.Gly380Arg and account for nearly all typical cases.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Heterozygous pathogenic FGFR3 variant, usually c.1138G>A or c.1138G>C (p.Gly380Arg).
  evidence:
  - reference: PMID:9718331
    reference_title: Mutations in fibroblast growth-factor receptor 3 in sporadic cases of achondroplasia occur exclusively on the paternally derived chromosome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 97% of achondroplasia cases are caused by one of two mutations (G1138A and G1138C) in the fibroblast growth factor receptor 3 (FGFR3) gene, which results in a specific amino acid substitution, G380R."
    explanation: The study supports targeted testing for the two recurrent nucleotide substitutions.
  - reference: CGGV:assertion_0adafa1b-e609-4b99-8e90-f73473b70771-2023-09-28T040000.000Z
    reference_title: FGFR3 / achondroplasia (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR3 | HGNC:3690 | achondroplasia | MONDO:0007037 | AD | Definitive"
    explanation: ClinGen supports molecular confirmation through the definitive gene-disease relationship.

differential_diagnoses:
- name: Hypochondroplasia
  disease_term:
    preferred_term: hypochondroplasia
    term:
      id: MONDO:0007793
      label: hypochondroplasia
  description: >-
    A milder FGFR3 skeletal dysplasia that can overlap mild achondroplasia.
  distinguishing_features:
  - Skeletal and medical manifestations tend to be milder than in achondroplasia.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The skeletal features are very similar to those seen in achondroplasia but tend to be milder."
    explanation: The current review states the principal clinical distinction.
- name: Pseudoachondroplasia
  disease_term:
    preferred_term: pseudoachondroplasia
    term:
      id: MONDO:0008322
      label: pseudoachondroplasia
  description: >-
    A clinically and genetically distinct skeletal dysplasia whose similar name
    can cause diagnostic confusion.
  distinguishing_features:
  - It is genetically distinct from FGFR3 p.Gly380Arg achondroplasia.
  - The radiographic and craniofacial pattern should be assessed rather than relying on nomenclature.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is a clinically and genetically distinct skeletal dysplasia but the similar nomenclature may cause confusion with achondroplasia."
    explanation: GeneReviews explicitly warns that the similar name masks a distinct disorder.
- name: Thanatophoric dysplasia type 2
  disease_term:
    preferred_term: thanatophoric dysplasia type 2
    term:
      id: MONDO:0008547
      label: thanatophoric dysplasia type 2
  description: >-
    A much more severe, usually life-limiting FGFR3 short-limb skeletal dysplasia.
  distinguishing_features:
  - Severe, usually lethal short-limb skeletal dysplasia favors thanatophoric dysplasia.
  evidence:
  - reference: PMID:25800480
    reference_title: "A case of thanatophoric dysplasia type 2: a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thanatophoric dysplasia (TD) is a lethal form of skeletal dysplasia with short-limb dwarfism."
    explanation: The report supports the severe life-limiting short-limb phenotype.
- name: SADDAN
  disease_term:
    preferred_term: severe achondroplasia-developmental delay-acanthosis nigricans syndrome
    term:
      id: MONDO:0014658
      label: severe achondroplasia-developmental delay-acanthosis nigricans syndrome
  description: >-
    SADDAN is a severe FGFR3 allelic disorder in which developmental delay,
    structural brain abnormalities, hearing loss, and acanthosis nigricans
    accompany the skeletal dysplasia.
  distinguishing_features:
  - Marked developmental and neurologic abnormalities with acanthosis nigricans favor SADDAN.
  - SADDAN is associated with FGFR3 p.Lys650Met rather than p.Gly380Arg.
  evidence:
  - reference: PMID:24352917
    reference_title: Suppression of severe achondroplasia with developmental delay and acanthosis nigricans by the p.Thr651Pro mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe achondroplasia with developmental delay and acanthosis nigricans (SADDAN) is an extremely rare severe skeletal dysplasia characterized by significant developmental delay, brain structural abnormalities, hearing loss, and acanthosis nigricans."
    explanation: The report directly states the distinguishing multisystem phenotype.
  - reference: PMID:24352917
    reference_title: Suppression of severe achondroplasia with developmental delay and acanthosis nigricans by the p.Thr651Pro mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is the result of a single missense mutation at codon 650 (p.Lys650Met) in the fibroblast growth factor receptor 3 gene (FGFR3)."
    explanation: The report identifies the distinct SADDAN allele.

clinical_trials:
- name: NCT06164951
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    PROPEL 3 — the pivotal 52-week randomized, double-blind, placebo-controlled
    trial of once-daily oral infigratinib in children aged 3 to <18 years with
    achondroplasia. It is the first phase 3 result for a drug acting on the FGFR3
    receptor kinase itself rather than on the CNP counter-regulatory arm.
  target_phenotypes:
  - preferred_term: Limb undergrowth
    term:
      id: HP:0009826
      label: Limb undergrowth
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: clinicaltrials:NCT06164951
    reference_title: "A Phase 3, Multicenter, Double-Blind, Randomized, Placebo-Controlled Study to Evaluate the Efficacy and Safety of Infigratinib in Children 3 to <18 Years of Age With Achondroplasia: PROPEL 3"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a Phase 3, multicenter, double-blind, randomized, placebo-controlled study to evaluate the efficacy and safety of infigratinib in children and adolescents with achondroplasia (ACH)"
    explanation: The registry record establishes the trial's design and population.
  - reference: PMID:42370681
    reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this phase 3, multicenter, double-blind, placebo-controlled trial, we randomly assigned children with achondroplasia (3 to 17 years of age) in a 2:1 ratio to receive infigratinib (at a dose of 0.25 mg per kilogram of body weight) or placebo once daily for 52 weeks."
    explanation: The publication reporting this trial's results.

animal_models:
- species: Mouse
  genotype: Human FGFR3 G380R transgene under mouse Fgfr3 transcriptional control
  description: >-
    Mutant-receptor immunoreactivity extends across a larger growth-plate area,
    supporting impaired in vivo receptor down-regulation. This record does not
    claim an unsupported full phenotypic inventory.
  evidence:
  - reference: PMID:10611230
    reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples ligand-mediated receptor activation from down-regulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transgenic mice expressing the human G380R mutant receptor under the mouse receptor transcriptional control demonstrated a markedly expanded area of FGFR3 immunoreactivity within their epiphyseal growth plates, compatible with an in vivo defect in receptor down-regulation."
    explanation: The experiment directly supports the modeled receptor-persistence phenotype.
- species: Mouse
  genotype: Activated Fgfr3 achondroplasia model with chondrocyte CNP overexpression
  description: >-
    Targeted CNP overexpression counteracted dwarfism and corrected reduced
    matrix synthesis through MAPK inhibition, providing proof of concept for CNP
    analogues.
  associated_phenotypes:
  - Rescue of bone shortening
  - Restored extracellular matrix synthesis
  evidence:
  - reference: PMID:14702637
    reference_title: Overexpression of CNP in chondrocytes rescues achondroplasia through a MAPK-dependent pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "targeted overexpression of CNP in chondrocytes counteracts dwarfism in a mouse model of achondroplasia with activated fibroblast growth factor receptor 3 (FGFR-3) in the cartilage."
    explanation: The intervention directly demonstrates rescue of dwarfism.
  - reference: PMID:14702637
    reference_title: Overexpression of CNP in chondrocytes rescues achondroplasia through a MAPK-dependent pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CNP prevented the shortening of achondroplastic bones by correcting the decreased extracellular matrix synthesis in the growth plate through inhibition of the MAPK pathway of FGF signaling."
    explanation: The experiment supplies the matrix and MAPK mechanism.
- species: Mouse
  genotype: Constitutively active MEK1 driven by Col2a1 in chondrocytes
  description: >-
    Chondrocyte MEK1 activation produces achondroplasia-like dwarfism and
    inhibits skeletal overgrowth in Fgfr3-deficient mice, supporting MAPK as a
    downstream effector.
  associated_phenotypes:
  - Achondroplasia-like dwarfism
  evidence:
  - reference: PMID:14871928
    reference_title: Constitutive activation of MEK1 in chondrocytes causes Stat1-independent achondroplasia-like dwarfism and rescues the Fgfr3-deficient mouse phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated transgenic mice that express a constitutively active mutant of MEK1 in chondrocytes. These mice showed a dwarf phenotype similar to achondroplasia, the most common human dwarfism, caused by activating mutations in FGFR3."
    explanation: Directly demonstrates sufficiency of chondrocyte MAPK activation for an achondroplasia-like phenotype.
  - reference: PMID:14871928
    reference_title: Constitutive activation of MEK1 in chondrocytes causes Stat1-independent achondroplasia-like dwarfism and rescues the Fgfr3-deficient mouse phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of a constitutively active mutant of MEK1 in chondrocytes of Fgfr3-deficient mice inhibited skeletal overgrowth, strongly suggesting that regulation of bone growth by FGFR3 is mediated at least in part by the MAPK pathway."
    explanation: The epistasis experiment positions MAPK downstream of FGFR3.

notes: >-
  Intelligence is usually near normal, while motor and sometimes speech milestones
  can be delayed for physical, hearing, or airway-related reasons. Clinical care is
  lifelong and multidisciplinary. Current CNP analogues have demonstrated improved
  growth velocity; claims about final adult height and prevention of neurologic,
  respiratory, otologic, or orthopedic complications require separate evidence.

progression:
- phase: Infancy
  age_range: Birth through the first two years
  notes: >-
    Hypotonia and achondroplasia-specific motor delay are typical.
    Craniocervical-junction compression is a distinct high-acuity risk and
    increases the risk of death in infancy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In infancy, hypotonia is typical, and acquisition of developmental motor milestones is often both aberrant in pattern and delayed."
    explanation: The current clinical review describes the typical infant developmental course.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intelligence and life span are usually near normal, although craniocervical junction compression increases the risk of death in infancy."
    explanation: The current clinical review identifies the phase-specific mortality risk.
- phase: Early childhood
  age_range: Approximately two to ten years
  notes: >-
    Middle-ear dysfunction, sleep apnea, limb pain, and excess weight are common
    clinical burdens. Thoracolumbar kyphosis often improves after independent
    walking, although persistent deformity needs orthopedic follow-up.
  evidence:
  - reference: PMID:29972438
    reference_title: Natural history of 39 patients with Achondroplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical intercurrences were middle ear dysfunction, sleep apnea, limb pain and obesity from 2 to 9 years of age."
    explanation: A natural-history cohort identifies the principal early-childhood burdens.
  - reference: PMID:37493935
    reference_title: "Walking status and spinopelvic parameters in young children with achondroplasia: 10-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thoracolumbar kyphosis (TLK) is common in children with achondroplasia and resolves in 90% by 10 years of age."
    explanation: Longitudinal follow-up supports usual improvement of kyphosis in childhood.
- phase: Later childhood and adolescence
  age_range: Approximately ten years through skeletal maturity
  notes: >-
    Lower-limb bowing can persist as a complex deformity involving lateral
    bowing, differential tibial and fibular growth, internal tibial torsion,
    and dynamic knee instability.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '"Bowing" is actually a complex deformity arising from a combination of lateral bowing, differential growth between the tibia and fibula, internal tibial torsion, and dynamic instability of the knee'
    explanation: The current clinical review describes the interacting growth and mechanical components of lower-limb bowing.
- phase: Adulthood
  age_range: Skeletal maturity onward
  notes: >-
    Symptomatic spinal stenosis involving L1-L4 is the most common adult medical
    complaint. Imaging shows preferential upper-lumbar stenosis and disc
    degeneration.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common medical complaint in adulthood is symptomatic spinal stenosis involving L1-L4"
    explanation: The 2026 review identifies symptomatic upper-lumbar stenosis as the leading adult complaint.
  - reference: PMID:32170149
    reference_title: Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the general population, spinal stenosis and disc degeneration involve the upper part of the lumbar spine in adults with achondroplasia, associated with thoraco-lumbar kyphosis and loss of lumbar lordosis."
    explanation: Adult imaging data define the characteristic upper-lumbar distribution.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_fgfr3_gain_of_function_chondrocyte_model
  hypothesis_label: FGFR3 Growth-Plate Signaling Model
  status: CANONICAL
  description: >-
    Recurrent heterozygous FGFR3 p.Gly380Arg gain-of-function prolongs receptor
    signaling in growth-plate chondrocytes. Experiments support delayed receptor
    down-regulation while G380R activation remains predominantly ligand
    dependent. MAPK-mediated inhibition of hypertrophic differentiation and a
    qualified STAT-p21 branch impair endochondral ossification.
  notes: >-
    Strict constitutive activation is not asserted as the sole receptor-level
    mechanism. CNP-analogue growth-velocity responses support therapeutic
    counter-regulation but do not establish final-height or complication benefit.
  evidence:
  - reference: PMID:10611230
    reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples ligand-mediated receptor activation from down-regulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that dimerization and activation of the G380R mutant receptor are predominantly ligand dependent."
    explanation: Direct receptor experiments qualify strict constitutive-activation shorthand.
  - reference: PMID:10611230
    reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples ligand-mediated receptor activation from down-regulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Metabolic pulse-chase experiments, cell surface labeling, and kinetics of uptake of radiolabeled ligand demonstrated a selective delay in the down-regulation of the mutant receptor."
    explanation: Direct experiments identify delayed receptor down-regulation.
  - reference: DOI:10.1038/s41574-021-00595-x
    reference_title: International Consensus Statement on the diagnosis, multidisciplinary management and lifelong care of individuals with achondroplasia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The condition is caused by a common, recurring, gain-of-function mutation in FGFR3, the gene that encodes fibroblast growth factor receptor 3. This mutation leads to impaired endochondral ossification of the human skeleton."
    explanation: International consensus links FGFR3 gain of function to impaired endochondral ossification.

pathophysiology:
- name: FGFR3 p.Gly380Arg gain-of-function with impaired receptor down-regulation
  role: trigger
  conforms_to: "fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation"
  description: >-
    Nearly all individuals have one of two substitutions producing p.Gly380Arg.
    The receptor is gain of function, but experiments show predominantly
    ligand-dependent activation with delayed down-regulation and resistance to
    ligand-mediated internalization.
  gene:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:7847369
    reference_title: Achondroplasia is defined by recurrent G380R mutations of FGFR3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but one, an atypical case, were found to have a glycine-to-arginine substitution at codon 380. Of these, 150 had a G-to-A transition at nt 1138, and 3 had a G-to-C transversion at this same position."
    explanation: A 154-person series demonstrates the near-uniform recurrent p.Gly380Arg genotype.
  - reference: PMID:10611230
    reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples ligand-mediated receptor activation from down-regulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, this receptor was now resistant to ligand-mediated internalization, even at saturating ligand concentrations."
    explanation: Directly supports impaired internalization.
  - reference: CGGV:assertion_0adafa1b-e609-4b99-8e90-f73473b70771-2023-09-28T040000.000Z
    reference_title: FGFR3 / achondroplasia (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR3 | HGNC:3690 | achondroplasia | MONDO:0007037 | AD | Definitive"
    explanation: ClinGen classifies the autosomal-dominant FGFR3 relationship as definitive.
  downstream:
  - target: Prolonged FGFR3 signaling in growth-plate chondrocytes
    hypothesis_groups:
    - canonical_fgfr3_gain_of_function_chondrocyte_model
    causal_link_type: DIRECT
    description: Delayed down-regulation expands mutant-receptor signaling in growth plate.
    evidence:
    - reference: PMID:10611230
      reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples ligand-mediated receptor activation from down-regulation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transgenic mice expressing the human G380R mutant receptor under the mouse receptor transcriptional control demonstrated a markedly expanded area of FGFR3 immunoreactivity within their epiphyseal growth plates, compatible with an in vivo defect in receptor down-regulation."
      explanation: In vivo receptor distribution supports prolonged growth-plate signaling.


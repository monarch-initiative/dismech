    explanation: The randomized trial quantifies the placebo-adjusted growth-velocity result.

- name: Infigratinib (oral FGFR1-3 tyrosine kinase inhibitor)
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Once-daily oral ATP-competitive FGFR1-3 tyrosine kinase inhibitor, repurposed
    from oncology at roughly a hundredth of the oncology dose (0.25 mg/kg/day). It
    is mechanistically distinct from the approved CNP analogues: vosoritide and
    navepegritide act on a parallel counter-regulatory arm (NPR-B/cGMP braking
    MAPK downstream of the receptor), whereas infigratinib inhibits the mutant
    receptor's kinase output directly — the first drug in achondroplasia to do so.
    In the 52-week phase 3 PROPEL 3 trial (NCT06164951) it increased annualized
    height velocity by 1.74 cm/year over placebo, and it is oral rather than
    injected. Two caveats belong with the result: the upper-to-lower segment
    ratio, the measure of *disproportion* as opposed to height, did not change,
    and the drug is a pan-FGFR1-3 rather than FGFR3-selective inhibitor, so
    long-term off-target skeletal effects are not yet characterized in children.
    Not approved at time of curation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infigratinib
      term:
        id: CHEBI:63451
        label: BGJ-398
  target_phenotypes:
  - preferred_term: Limb undergrowth
    term:
      id: HP:0009826
      label: Limb undergrowth
  target_mechanisms:
  - target: Prolonged FGFR3 signaling in growth-plate chondrocytes
    treatment_effect: INHIBITS
    description: >-
      Infigratinib inhibits the FGFR kinase domain directly, reducing the
      sustained downstream signal from the constitutively active p.Gly380Arg
      receptor rather than opposing it from a parallel pathway.
    evidence:
    - reference: PMID:42370681
      reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Infigratinib, an oral FGFR1-3 tyrosine kinase inhibitor, down-regulates key pathways in the pathogenesis of achondroplasia."
      explanation: >-
        States the receptor-directed mechanism that distinguishes infigratinib
        from the CNP-analogue class.
  evidence:
  - reference: PMID:42370681
    reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children with achondroplasia, treatment with once-daily oral infigratinib for 52 weeks resulted in a significantly greater increase from baseline in the annualized height velocity than placebo."
    explanation: The phase 3 primary result.
  - reference: PMID:42370681
    reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The difference between infigratinib and placebo in the least-squares mean change from baseline to week 52 was 1.74 cm per year (95% confidence interval [CI], 1.31 to 2.17; P<0.001) for the annualized height velocity, 0.32 (96% CI, 0.23 to 0.41; P<0.001) for the height z score, and -0.02 (96% CI, -0.06 to 0.01) for the upper-to-lower body segment ratio."
    explanation: >-
      Quantifies the effect and records that the upper-to-lower segment ratio,
      the disproportion measure, was not improved.
  - reference: PMID:42370681
    reference_title: "Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Adverse events occurred in 71 of 74 patients (96%) in the infigratinib group and in 37 of 39 patients (95%) in the placebo group; serious adverse events occurred in 4 of 74 patients (5%) and 1 of 39 patients (3%), respectively."
    explanation: The 52-week safety comparison; longer-term skeletal safety is untested.


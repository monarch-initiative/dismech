genetic:
- name: FGFR3
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Achondroplasia is genetically homogeneous. Two substitutions at nucleotide
    1138 produce p.Gly380Arg in the FGFR3 transmembrane domain. Experimental
    evidence supports gain of function with impaired receptor down-regulation;
    strict ligand-independent activation is not required by this record.
  variants:
  - name: c.1138G>A (p.Gly380Arg)
    description: >-
      The predominant recurrent allele; 150 of 153 p.Gly380Arg-positive cases
      in one 154-person series carried c.1138G>A.
    evidence:
    - reference: PMID:7847369
      reference_title: Achondroplasia is defined by recurrent G380R mutations of FGFR3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All but one, an atypical case, were found to have a glycine-to-arginine substitution at codon 380. Of these, 150 had a G-to-A transition at nt 1138, and 3 had a G-to-C transversion at this same position."
      explanation: The large series directly supplies the allele counts.
  - name: c.1138G>C (p.Gly380Arg)
    description: >-
      A less common nucleotide substitution producing the same p.Gly380Arg
      protein change; three cases were observed in the same series.
    evidence:
    - reference: PMID:7847369
      reference_title: Achondroplasia is defined by recurrent G380R mutations of FGFR3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All but one, an atypical case, were found to have a glycine-to-arginine substitution at codon 380. Of these, 150 had a G-to-A transition at nt 1138, and 3 had a G-to-C transversion at this same position."
      explanation: The series directly documents the c.1138G>C minority allele.
  evidence:
  - reference: CGGV:assertion_0adafa1b-e609-4b99-8e90-f73473b70771-2023-09-28T040000.000Z
    reference_title: FGFR3 / achondroplasia (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR3 | HGNC:3690 | achondroplasia | MONDO:0007037 | AD | Definitive"
    explanation: ClinGen classifies the FGFR3-achondroplasia relationship as definitive.
  - reference: ORPHA:15
    reference_title: Achondroplasia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR3 | fibroblast growth factor receptor 3 | hgnc:3690 | Disease-causing germline mutation(s) (gain of function) in"
    explanation: Orphanet identifies germline FGFR3 gain of function.

treatments:
- name: Vosoritide (Voxzogo)
  action_category: THERAPEUTIC
  description: >-
    Daily CNP analogue indicated in the United States to increase linear growth
    in pediatric patients with achondroplasia and open epiphyses. Accelerated
    approval is based on annualized growth velocity; final adult height and
    prevention of non-growth complications are not established by the approval.
    A three-year external-control comparison estimated 5.75 cm additional
    height, explicitly not a three-year randomized comparison.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vosoritide
      term:
        id: NCIT:C152918
        label: Vosoritide
  target_phenotypes:

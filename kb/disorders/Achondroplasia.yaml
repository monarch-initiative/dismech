  - reference: ORPHA:15
    reference_title: Achondroplasia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0000238 | Hydrocephalus | Very rare (<4-1%)"
    explanation: Orphanet classifies hydrocephalus as very rare in achondroplasia.
  - reference: PMID:33579320
    reference_title: "Predictors of cervical myelopathy and hydrocephalus in young children with achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the size of the cranial base, which is formed by endochondral ossification, is smaller, and the jugular foramen is also smaller. This condition causes a partial obstruction of venous flow, which increases intracranial venous pressure and causes problems with the venous resorption of cerebrospinal fluid (CSF)"
    explanation: Describes the mechanistic basis of communicating hydrocephalus in achondroplasia—endochondral hypoplasia of the skull base narrows the jugular foramina, causing venous outflow obstruction, intracranial venous hypertension, and impaired CSF resorption.

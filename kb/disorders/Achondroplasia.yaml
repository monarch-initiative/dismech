- name: Cranial-base and vertebral synchondrosis dysplasia
  description: >-
    FGFR3-MAPK activation promotes premature closure in models and severe human
    FGFR3 dysplasias. CT in heterozygous achondroplasia documents skull-base
    fusion and age-associated craniofacial severity.
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  evidence:
  - reference: PMID:18923003
    reference_title: FGFR3 promotes synchondrosis closure and fusion of ossification centers through the MAPK pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrocyte-specific activation of Fgfr3 in mice induced premature synchondrosis closure and enhanced osteoblast differentiation around synchondroses."
    explanation: Chondrocyte-specific activation establishes a causal model mechanism.
  - reference: PMID:37072824
    reference_title: "Craniofacial growth and function in achondroplasia: a multimodal 3D study on 15 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with available CT-scan had premature fusion of skull base synchondroses."
    explanation: CT documents skull-base fusion in a clinical cohort.
  downstream:
  - target: Foramen magnum stenosis
    hypothesis_groups:
    - canonical_fgfr3_gain_of_function_chondrocyte_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Restricted endochondral growth of the skull base
    - Reduced bony dimensions of the foramen magnum
    description: Skull-base growth restriction contributes to narrowing.
    evidence:
    - reference: PMID:32883660
      reference_title: "Achondroplasia Foramen Magnum Score: screening infants for stenosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 36 infants (M:F, 18:18), 2 (5.6%) did not have FMS (AFMS0); 13 (36.1%) had FMS with preservation of the cerebrospinal fluid (CSF) spaces (AFMS1); 3 (8.3%) had FMS with loss of the CSF space but no spinal cord distortion (AFMS2); 13 (36.1%) had FMS with flattening of the cervical cord without signal change (AFMS3); and 5 (13.9%) had FMS resulting in cervical cord signal change (AFMS4)."
      explanation: MRI establishes the stenosis spectrum; the upstream link remains partly inferential.
  - target: Jugular-foramen venous outflow impairment
    hypothesis_groups:
    - canonical_fgfr3_gain_of_function_chondrocyte_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced skull-base dimensions
    - Jugular-foramen narrowing
    description: Skull-base undergrowth can narrow jugular foramina.

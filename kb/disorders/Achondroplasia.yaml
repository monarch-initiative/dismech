    term:
      id: HP:0009826
      label: Limb undergrowth
  target_mechanisms:
  - target: CNP-NPR2 counter-regulation of FGFR3-MAPK signaling
    treatment_effect: ACTIVATES
    description: Vosoritide activates the CNP-NPR2 counter-regulatory branch.
    evidence:

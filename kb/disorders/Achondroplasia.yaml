inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  de_novo_rate: approximately 80%
  parent_of_origin_effect: De novo variants are predominantly paternal in origin and associated with increased paternal age
  description: >-
    Achondroplasia has complete-penetrance autosomal-dominant inheritance. About
    80% of affected individuals have average-stature parents and a de novo FGFR3
    variant. In informative sporadic cases, the recurrent variant arose on the
    paternal chromosome; increased paternal age is an established association.
  evidence:
  - reference: PMID:8078586
    reference_title: "Mutations in the gene encoding fibroblast growth factor receptor-3 in achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are fertile and achondroplasia is transmitted as a fully penetrant autosomal dominant trait, accounting for rare familial forms of the disease (10%)."
    explanation: Establishes autosomal dominant inheritance with full penetrance for achondroplasia.
  - reference: PMID:8078586
    reference_title: "Mutations in the gene encoding fibroblast growth factor receptor-3 in achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 90% of cases are sporadic and there is an increased paternal age at the time of conception of affected individuals,"
    explanation: An older series documents a high sporadic fraction and paternal-age association; the structured estimate is calibrated to the current approximately 80% estimate.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1152/
    reference_title: Achondroplasia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately 80% of individuals with achondroplasia have parents of average stature and have achondroplasia as the result of a"
    explanation: The 2026 GeneReviews revision gives the current approximately 80% de novo estimate.
  - reference: PMID:9718331
    reference_title: Mutations in fibroblast growth-factor receptor 3 in sporadic cases of achondroplasia occur exclusively on the paternally derived chromosome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this population, the achondroplasia mutation occurred on the paternal chromosome in all 40 cases in which parental origin was unambiguous."
    explanation: Direct parental-origin analysis supports the paternal origin of recurrent de novo FGFR3 variants.
  - reference: ORPHA:15
    reference_title: Achondroplasia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant"
    explanation: Orphanet classifies achondroplasia inheritance as autosomal dominant.

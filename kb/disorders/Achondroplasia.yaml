name: Achondroplasia
synonyms:
- Achondroplasia, FGFR3-related
creation_date: '2026-02-02T00:16:36Z'
category: Mendelian
description: >-
  Achondroplasia is the most common cause of disproportionate short stature. It is
  caused by heterozygous gain-of-function variation in FGFR3, almost always
  p.Gly380Arg, which prolongs inhibitory FGFR3 signaling in growth-plate
  chondrocytes and impairs endochondral ossification. Rhizomelic limb shortening,
  macrocephaly, frontal bossing, midface retrusion, and trident hands are
  characteristic. Important complications include craniocervical-junction
  compression in infancy, sleep-disordered breathing, middle-ear dysfunction,
  limb bowing, obesity, and symptomatic spinal stenosis in adulthood. Daily
  vosoritide and once-weekly navepegritide increase growth velocity in eligible
  children with open epiphyses; both US indications use annualized growth
  velocity as an accelerated-approval endpoint, so final-height and
  complication-prevention benefits remain under study.
disease_term:
  preferred_term: achondroplasia
  term:

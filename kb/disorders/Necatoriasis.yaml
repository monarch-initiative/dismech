name: Necatoriasis
creation_date: "2026-11-15T00:00:00Z"
category: Infectious Disease
synonyms:
- Necator americanus hookworm infection
description: >-
  Necatoriasis is human hookworm disease caused by the soil-transmitted nematode
  Necator americanus. Infective third-stage larvae penetrate skin, migrate via
  the circulation to the lungs and pharynx, and mature in the small intestine.
  Adult worms persist in the small intestine, feed on host blood, and can cause
  iron-deficiency anemia, malnutrition, and childhood growth impairment;
  benzimidazole anthelmintics such as albendazole or mebendazole are used to
  clear soil-transmitted hookworm infections.
disease_term:
  preferred_term: necatoriasis
  term:
    id: MONDO:0005870
    label: necatoriasis
parents:
- helminthiasis
infectious_agent:
- name: Necator americanus
  infectious_agent_term:
    preferred_term: Necator americanus
    term:
      id: NCBITaxon:51031
      label: Necator americanus
  description: Predominant hookworm species infecting humans.
  evidence:
  - reference: PMID:27929101
    reference_title: "Hookworm infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Necator americanus is the predominant infecting species"
    explanation: >-
      Identifies Necator americanus as the predominant human hookworm species.
agent_life_cycle:
  description: >-
    Eggs shed in feces embryonate in soil and hatch into larvae that moult to
    infective third-stage larvae. Infective larvae penetrate human skin, migrate
    through blood and lymph to the lungs, ascend the trachea to the oropharynx,
    are swallowed, and mature into dioecious adult worms attached to the small-
    intestinal mucosa.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: definitive host
  life_cycle_stages:
  - name: Eggs shed in feces and larval development in soil
    description: >-
      N. americanus eggs leave the infected human host in feces, embryonate in
      soil, hatch, and progress through moults to the infective iL3 stage.
    evidence:
    - reference: PMID:24441737
      reference_title: Genome of the human hookworm Necator americanus.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Eggs embryonate in soil under favorable conditions, and then the first-stage larvae hatch, feed on environmental microbes and moult twice to reach the infective third-stage larvae (iL3)."
      explanation: >-
        Supports soil embryonation, hatching, and moulting to the infective N.
        americanus iL3 stage after eggs are shed.
  - name: Infective third-stage larvae
    description: >-
      Environmental larvae become infective third-stage larvae before entering a
      human host by skin penetration.
    evidence:
    - reference: PMID:24441737
      reference_title: Genome of the human hookworm Necator americanus.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "moult twice to reach the infective third-stage larvae (iL3)"
      explanation: >-
        Identifies the N. americanus iL3 stage as the infective stage.
  - name: Adult N. americanus worms in the small intestine
    life_cycle_stage_term:
      preferred_term: adult parasitic worm stage
      term:
        id: OPL:0000237
        label: adult parasitic worm stage
    description: >-
      Swallowed larvae reach the small intestine and develop into dioecious
      adult worms.
    evidence:
    - reference: PMID:24441737
      reference_title: Genome of the human hookworm Necator americanus.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "travel to the small intestine, where they develop to become dioecious adults"
      explanation: >-
        Supports development of N. americanus into adult worms in the small
        intestine.
transmission:
- name: Soil-transmitted hookworm infection
  description: >-
    Infective N. americanus iL3 larvae develop in contaminated soil, penetrate
    human skin, enter blood and lymph vessels, migrate through the lungs and
    oropharynx, and are swallowed before maturing in the small intestine.
  evidence:
  - reference: PMID:27929101
    reference_title: "Hookworm infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hookworms are soil-transmitted nematode parasites"
    explanation: >-
      Supports the soil-transmitted route for human hookworm infection.
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "These larvae infect the human host by skin penetration, enter subcutaneous blood and lymph vessels and travel via the circulation to the lungs."
    explanation: >-
      Describes N. americanus infective larvae penetrating skin and migrating
      from skin into the circulation.
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The iL3 break into the alveoli and migrate via the trachea to the oropharynx, after which they are swallowed and travel to the small intestine"
    explanation: >-
      Supports the post-skin-penetration pulmonary and oropharyngeal migration
      before larvae are swallowed and reach the small intestine.
pathophysiology:
- name: Adult Necator Small-Intestinal Persistence
  description: >-
    Adult N. americanus worms reside in the human small intestine for years.
  role: trigger
  evidence:
  - reference: PMID:27929101
    reference_title: "Hookworm infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "can reside for many years in the small intestine of their human hosts"
    explanation: >-
      Supports chronic small-intestinal persistence by adult hookworms.
  downstream:
  - target: Hookworm Blood Feeding
    causal_link_type: DIRECT
    description: Adult hookworms feed on host blood while attached in the gut.
    evidence:
    - reference: PMID:27929101
      reference_title: "Hookworm infection."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Adult worms feed on the blood of a host"
      explanation: >-
        Links adult hookworm infection to blood feeding.
- name: Hookworm Blood Feeding
  description: >-
    Adult N. americanus worms feed on host blood in the small intestine, causing
    chronic blood loss that can progress to iron-deficiency anemia.
  role: effector
  evidence:
  - reference: PMID:27929101
    reference_title: "Hookworm infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adult worms feed on the blood of a host and can cause iron deficiency anaemia"
    explanation: >-
      Connects adult hookworm blood feeding to iron-deficiency anemia.
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The adult worms (~1 cm long) attach to the mucosa, where they feed on blood (up to 30 μl per day per worm)"
    explanation: >-
      Supports attachment of adult N. americanus worms to the intestinal mucosa
      and blood feeding there.
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
    description: Chronic intestinal blood loss produces anemia.
phenotypes:
- name: Anemia
  description: >-
    Hookworm blood feeding can cause iron-deficiency anemia, especially in
    children and women of childbearing age.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:27929101
    reference_title: "Hookworm infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "can cause iron deficiency anaemia, especially in high-risk populations"
    explanation: >-
      Supports anemia as a hookworm-disease phenotype.
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Necator americanus represents ~85% of all hookworm infections 4 and causes necatoriasis, characterized clinically by anaemia"
    explanation: >-
      Names anemia as a clinical feature of N. americanus necatoriasis.
- name: Malnutrition
  description: >-
    N. americanus necatoriasis can contribute to malnutrition in pregnant women
    as part of hookworm morbidity.
  phenotype_term:
    preferred_term: Malnutrition
    term:
      id: HP:0004395
      label: Malnutrition
  evidence:
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Necator americanus represents ~85% of all hookworm infections 4 and causes necatoriasis, characterized clinically by anaemia, malnutrition in pregnant women"
    explanation: >-
      Identifies malnutrition in pregnant women as a clinical component of
      N. americanus necatoriasis.
- name: Growth delay
  description: >-
    Childhood N. americanus hookworm disease can impair physical growth.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:24441737
    reference_title: Genome of the human hookworm Necator americanus.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Necator americanus represents ~85% of all hookworm infections 4 and causes necatoriasis, characterized clinically by anaemia, malnutrition in pregnant women and an impairment of cognitive and/or physical development in children"
    explanation: >-
      Supports physical-development impairment in children as a morbidity of
      N. americanus necatoriasis.
treatments:
- name: Benzimidazole anthelmintic therapy
  description: Albendazole or mebendazole is used to remove hookworm infection.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
  target_mechanisms:
  - target: Adult Necator Small-Intestinal Persistence
    description: Benzimidazole anthelmintics clear adult hookworms from the intestine.
  evidence:
  - reference: PMID:16679166
    reference_title: "Soil-transmitted helminth infections: ascariasis, trichuriasis, and hookworm."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The benzimidazole anthelmintics, mebendazole and albendazole, are commonly used to remove these infections"
    explanation: >-
      Supports benzimidazole therapy for soil-transmitted hookworm infection.
  - reference: PMID:18430913
    reference_title: "Efficacy of current drugs against soil-transmitted helminth infections: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The efficacy of single-dose oral albendazole, mebendazole, and pyrantel pamoate against hookworm infections was 72% (95% CI, 59%-81%; 742 patients), 15% (95% CI, 1%-27%; 853 patients), and 31% (95% CI, 19%-42%; 152 patients), respectively."
    explanation: >-
      Quantifies pooled cure rates and supports albendazole as the most
      efficacious of the compared single-dose anthelmintics for hookworm
      infection.
notes: >-
  Necatoriasis is curated separately from Soil-transmitted helminthiases because
  it is the Necator americanus hookworm arm of that broader multi-agent
  helminthiasis overview.

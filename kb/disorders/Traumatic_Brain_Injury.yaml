      explanation: >-
        Places spreading depolarisations in injured grey matter after TBI.
  - target: Cytotoxic Brain Swelling and Raised Intracranial Pressure
    causal_link_type: DIRECT
    description: >-
      Expanding haematoma adds intracranial volume and can cause herniation.
    evidence:
    - reference: PMID:31623894
      reference_title: 'Effects of tranexamic acid on death, disability, vascular occlusive events and other morbidities in patients with acute traumatic brain injury (CRASH-3): a randomised, placebo-controlled trial.'
      supports: SUPPORT

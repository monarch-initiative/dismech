- name: PSD-95-nNOS Coupling
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PSD-95 couples neuronal nitric oxide synthase to NMDA receptor signaling.
    In mouse controlled cortical impact, ZL006 reduced this association and
    cortical neuronal injury markers. These pharmacological findings support
    involvement in secondary injury, but do not establish selective causality.
    In scratched mouse cortical cultures, Preso (FRMPD4) knockdown reduced
    PSD-95 association with NR2B and nNOS. Deleting the PSD-95-binding
    C-terminal region of Preso attenuated its effects on complex association,
    nitric oxide responses and injury. These are complex-association assays,
    not measurements of binding affinity. Preso abundance remained stable
    after injury in this model.

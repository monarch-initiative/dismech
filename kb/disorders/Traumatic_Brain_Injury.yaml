    - reference: PMID:31623894
      reference_title: 'Effects of tranexamic acid on death, disability, vascular occlusive events and other morbidities in patients with acute traumatic brain injury (CRASH-3): a randomised, placebo-controlled trial.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

    explanation: >-
      Documents the palliative trajectory typical of severe COQ4 disease.
discussions:
- discussion_id: coq4_neonatal_coq10_nonresponse
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does exogenous CoQ10 supplementation fail to rescue the neonatal COQ4
    phenotype when it can reverse renal disease in other primary CoQ10
    deficiencies?
  rationale: >-
    Oral CoQ10 is the only disease-directed therapy available, yet the neonatal
    COQ4 form responds poorly and children have died in early childhood despite
    high-dose CoQ10 from birth. Candidate explanations include inadequate tissue
    and mitochondrial delivery of the highly lipophilic molecule, irreversible
    antenatal injury already established at birth, and CoQ10-independent
    consequences of losing the COQ4 scaffold. Distinguishing these determines
    whether better-delivered analogues could help or whether the therapeutic
    window closes before birth.
  attaches_to:
  - "pathophysiology#Coenzyme Q10 Biosynthetic Failure"
  proposed_experiments:
  - experiment_id: coq4_mito_delivery_rescue
    name: Mitochondrial CoQ10 repletion with alternative formulations
    description: >-
      Measure mitochondrial CoQ10 repletion and respiratory-chain rescue in
      COQ4-patient fibroblasts and cardiomyocytes treated with conventional
      CoQ10 versus mitochondria-targeted or solubilised formulations.
  - experiment_id: coq4_prenatal_treatment_window
    name: Prenatal treatment window in a COQ4 model
    description: >-
      Determine in a COQ4 model whether prenatal initiation of CoQ10 or a
      bypass analogue prevents the cerebellar hypoplasia that is already present
      at birth in human patients.
  evidence:
  - reference: PMID:34656997
    reference_title: "Human COQ4 deficiency: delineating the clinical, metabolic and neuroimaging phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the insufficient clinical response to oral CoQ10 supplementation,
      alternative treatment strategies are warranted.
    explanation: >-
      The authors of the largest COQ4 cohort explicitly frame the treatment
      failure as an open problem.
- discussion_id: coq4_tissue_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a given COQ4 genotype produces a heart-dominant, a
    brain-dominant, or a milder later-onset phenotype?
  rationale: >-
    The same biosynthetic lesion yields strikingly different organ involvement
    and biochemical severity between patients, and respiratory-chain enzymology
    ranges from multiple defects to none at all. The proposed exon 1-4 versus
    exon 5-7 gradient is an observational rule that does not explain tissue
    selectivity, so the modifiers remain unknown.
  attaches_to:
  - "pathophysiology#Bioenergetic Failure of High-Energy-Demand Tissues"
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This biochemical diversity could be due to differences in individual
      adaptive responses to reduced CoQ10 availability or could reflect the
      striking tissue specificity observed in the clinical presentations, but at
      the moment, a mechanistic explanation for these observations is lacking.
    explanation: >-
      The authors state explicitly that a mechanistic explanation for the tissue
      selectivity is lacking.
- discussion_id: coq4_antenatal_developmental_lesion
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the antenatal cerebellar hypoplasia of COQ4 deficiency a developmental
    patterning failure, or simply prenatal bioenergetic degeneration of an
    already-formed cerebellum?
  rationale: >-
    The pathophysiology chain modelled in this entry is a postnatal bioenergetic
    cascade, but cerebellar malformation is detectable at the 20th week of
    gestation and autopsy shows olivopontocerebellar hypoplasia with
    microdysgenesis - findings suggesting disturbed development rather than
    degeneration alone. Whether CoQ10 has a developmental role in cerebellar
    morphogenesis beyond ATP supply is unresolved, and the answer bounds any
    therapeutic window, because a patterning failure completed in utero cannot
    be reversed by postnatal supplementation.

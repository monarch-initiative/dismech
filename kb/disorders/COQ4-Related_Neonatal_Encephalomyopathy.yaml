    explanation: >-
      Illustrates the failure of inotropic support in fulminant neonatal COQ4
      cardiac failure.
  - reference: PMID:28540186
    reference_title: "Novel recessive mutations in COQ4 cause severe infantile cardiomyopathy and encephalopathy associated with CoQ(10) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was discharged on palliative measures but was readmitted six days later

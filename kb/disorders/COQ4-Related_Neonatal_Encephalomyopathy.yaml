diagnosis:
- name: Whole exome sequencing
  description: >
    Molecular genetic testing, predominantly whole exome sequencing, is the
    principal route to diagnosis; twenty of twenty-four published
    neonatal-onset cases were diagnosed this way. Because the neonatal course is
    fulminant, a rapid genome-wide approach is required for the diagnosis to be
    actionable, and no pathognomonic blood, muscle or imaging biomarker exists.

pathophysiology:
- name: COQ4 Loss of Function and CoQ Synthome Destabilization
  biological_scale: MOLECULAR
  description: >
    Biallelic COQ4 variants reduce or abolish COQ4 protein. COQ4 has no
    demonstrated catalytic step of its own; the yeast orthologue acts as a
    structural scaffold stabilizing the multiheteromeric complex that assembles
    most of the CoQ biosynthetic enzymes, so loss of COQ4 destabilizes the whole
    biosynthetic machine. Missense, nonsense, frameshift and in-frame deletion
    alleles have all been reported, and patient fibroblasts show markedly
    reduced COQ4 protein levels. Note that the molecular-function term below is
    a curator inference: the cited source states that the precise catalytic
    function of human COQ4 is unknown and describes it as playing a structural,
    complex-stabilizing role, for which the adaptor-activity term is the closest
    available GO proxy.
  molecular_functions:
  - preferred_term: protein-macromolecule adaptor activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The precise function of human COQ4 is not known, but it seems to play a
      structural role in stabilizing a multiheteromeric complex that contains
      most of the CoQ10 biosynthetic enzymes.
    explanation: >-
      Establishes the scaffolding role of COQ4 in the CoQ10 biosynthetic
      complex, the function lost in COQ10D7.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a drastic decrease in the amount of COQ4 was detected by immunoblot
      analysis in S1, S4, and S5 fibroblasts
    explanation: >-
      Patient-derived fibroblasts show loss of COQ4 protein, confirming the
      variants are loss-of-function at the protein level.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      oxidative growth, strongly impaired in strains lacking COQ4, was corrected
      by expression of human wild-type COQ4 cDNA but failed to be corrected by
      expression of COQ4 cDNAs with any of the mutations identified in affected
      subjects
    explanation: >-
      Yeast complementation assays demonstrate that every patient allele causes
      loss of COQ4 function.
  downstream:
  - target: Coenzyme Q10 Biosynthetic Failure
    causal_link_type: DIRECT
    description: >
      Destabilization of the CoQ biosynthetic complex blocks endogenous CoQ10
      production.
- name: Coenzyme Q10 Biosynthetic Failure
  biological_scale: MOLECULAR
  description: >
    Loss of COQ4 collapses de novo CoQ10 synthesis. Because dietary contribution
    to cellular CoQ10 is negligible, tissue CoQ10 falls steeply: muscle and
    fibroblast CoQ10 are severely reduced in affected neonates. The pathway
    intermediate 6-demethoxyubiquinone accumulates in patient cells, a metabolic
    signature of COQ4 deficiency that localises the block within the pathway.
  biological_processes:
  - preferred_term: ubiquinone biosynthetic process
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All available specimens from affected subjects showed reduced amounts of
      CoQ10 and often displayed a decrease in CoQ10-dependent ETC complex
      activities.
    explanation: >-
      Directly documents reduced tissue CoQ10 as the biochemical consequence of
      COQ4 loss.
  - reference: PMID:34656997
    reference_title: "Human COQ4 deficiency: delineating the clinical, metabolic and neuroimaging phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Experiments revealed significantly decreased COQ4 protein levels, reduced
      levels of cellular CoQ10 and elevated levels of the metabolic intermediate
      6-demethoxyubiquinone.
    explanation: >-
      Patient fibroblast studies link COQ4 protein loss to reduced CoQ10 and
      accumulation of the upstream intermediate 6-demethoxyubiquinone.
  downstream:
  - target: Impaired CoQ10-Dependent Respiratory Chain Electron Transfer
    causal_link_type: DIRECT
    description: >
      Depletion of the mobile electron carrier interrupts electron flow from
      complexes I and II to complex III.
- name: Impaired CoQ10-Dependent Respiratory Chain Electron Transfer
  biological_scale: CELLULAR
  description: >
    CoQ10 is the lipophilic mobile carrier that shuttles electrons from complex
    I and complex II (and from other flavoprotein dehydrogenases) to complex
    III. Its depletion produces a combined, CoQ10-specific respiratory-chain
    lesion: the coupled complex I+III and complex II+III activities fall while
    the individual complexes are often preserved, which is the biochemical
    fingerprint that distinguishes a CoQ10 biosynthesis defect from an assembly
    defect of a single complex. Maximal respiratory rates are reduced in patient
    fibroblasts.
  biological_processes:
  - preferred_term: electron transport chain
    term:
      id: GO:0022900
      label: electron transport chain
    modifier: DECREASED
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CoQ10 is an essential component of the electron transport chain (ETC),
      where it shuttles electrons from complex I or II to complex III.
    explanation: >-
      Establishes the electron-carrier role of CoQ10 whose loss produces the
      combined respiratory-chain defect.
  - reference: PMID:28540186
    reference_title: "Novel recessive mutations in COQ4 cause severe infantile cardiomyopathy and encephalopathy associated with CoQ(10) deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the combined activities of CoQ10-dependent complexes i.e.,
      rotenone-sensitive NADH cytochrome c reductase (complex I + III) and
      succinate-cytochrome c reductase (complex II + III) were also found to be
      significantly reduced, whereas the activities of other complexes were
      essentially comparable to those found in normal controls
    explanation: >-
      Demonstrates the selective loss of coupled CoQ10-dependent segments with
      preserved individual complexes, the hallmark of CoQ10 deficiency.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we detected that maximal respiratory rates were lower in S1, S4, and S5
      fibroblasts than in control cells
    explanation: >-
      Respirometry in patient fibroblasts confirms a functional bioenergetic
      deficit.
  downstream:
  - target: Bioenergetic Failure of High-Energy-Demand Tissues
    causal_link_type: DIRECT
    description: >
      Loss of oxidative ATP synthesis preferentially injures tissues with the
      highest energy demand and CoQ10 content.
- name: Bioenergetic Failure of High-Energy-Demand Tissues
  biological_scale: TISSUE
  description: >
    Organs with the highest oxidative workload - in the cited source the heart,
    kidneys and brain - carry the highest CoQ10 concentrations and fail first.
    In the neonatal COQ4 phenotype the injury falls on heart, brain and skeletal
    muscle, with renal function repeatedly reported as spared, distinguishing
    COQ4 from the renal-predominant COQ2/COQ6/COQ8B forms. The fulminant course
    of the neonatal form can mask multisystem involvement, so individual infants
    may appear predominantly cardiac or predominantly neurological. The specific
    cardiac and neural tissue lesions produced are curated under
    `histopathology`.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      organs with the highest energy requirements, such as the heart, kidneys,
      and brain, have the highest CoQ10 concentrations
    explanation: >-
      Explains the tissue selectivity of CoQ10 deficiency towards
      high-energy-demand organs; this is a review-level background assertion in
      the discussion rather than a patient observation.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No evidence of hepatic or renal impairment was observed.
    explanation: >-
      Supports renal and hepatic sparing in the index neonate, the feature that
      separates COQ4 disease from the renal-predominant CoQ10 deficiencies.
  - reference: PMID:28540186
    reference_title: "Novel recessive mutations in COQ4 cause severe infantile cardiomyopathy and encephalopathy associated with CoQ(10) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no evidence of renal dysfunction, transaminitis or liver
      synthetic dysfunction.
    explanation: >-
      Independently confirms renal and hepatic sparing in a COQ4-deficient
      infant.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variable specificity of organ failure (e.g., heart versus brain) in
      the neonatal cases of our cohort could be due to the fulminant course of
      the disease, which prevented the deployment of multisystem involvement.
    explanation: >-
      Accounts for the apparently organ-restricted presentations within a
      systemic bioenergetic disorder.
  downstream:
  - target: Rapidly Progressive Lactic Acidosis and Multiorgan Failure
    causal_link_type: DIRECT
    description: >
      Blocked oxidative metabolism forces anaerobic glycolysis with lactate
      accumulation and precipitates multiorgan failure.
- name: Rapidly Progressive Lactic Acidosis and Multiorgan Failure
  biological_scale: ORGANISM
  description: >
    With oxidative phosphorylation blocked, pyruvate is shunted to lactate and
    blood lactate rises steeply in the first hours to days of life. Severe
    lactic acidosis in combination with cardiac and respiratory failure
    determines the fatal outcome of the classic neonatal presentation.
  biological_processes:
  - preferred_term: lactate metabolic process
    term:
      id: GO:0006089
      label: lactate metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rapidly progressive, severe lactic acidosis was a common feature in all
      four affected newborn subjects and is likely to have determined their
      fatal outcome.
    explanation: >-
      Directly links the lactic acidosis of the neonatal COQ4 phenotype to
      mortality.
  - reference: PMID:39398416
    reference_title: "The Spectrum of clinical manifestations in newborns with the COQ4 mutation: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperlactatemia was one of the most common manifestations, accounting for
      75% of cases (18/24).
    explanation: >-
      Quantifies hyperlactatemia across the published neonatal-onset COQ4
      cohort.
phenotypes:
- name: Neonatal Hypotonia
  category: Neurologic
  description: >
    Profound generalised hypotonia is present from the first day of life and was
    the single most consistent finding in the defining neonatal COQ4 cohort,
    seen in all six patients. Areflexia may accompany it.
  phenotype_term:
    preferred_term: Neonatal hypotonia
    term:
      id: HP:0001319
      label: Neonatal hypotonia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:26185144
    reference_title: "Mutations in COQ4, an essential component of coenzyme Q biosynthesis, cause lethal neonatal mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings included hypotonia (6/6), encephalopathy with EEG
      abnormalities (4/4), neonatal seizures (3/6), cerebellar atrophy (4/5),
      cardiomyopathy (5/6) and lactic acidosis (4/6).
    explanation: >-
      Hypotonia was present in 6/6 neonatal COQ4 patients, supporting a
      VERY_FREQUENT (80-100%) frequency band.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two unrelated individuals presented with severe hypotonia, bradycardia,
      respiratory insufficiency, and heart failure
    explanation: >-
      Independent cohort confirming severe neonatal hypotonia as a presenting
      feature.
- name: Encephalopathy
  category: Neurologic
  description: >
    Neonatal encephalopathy with EEG abnormalities is a defining feature and
    was present in all four patients in whom EEG was performed in the original
    cohort of six. It frequently evolves into an epileptic encephalopathy.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  frequency: FREQUENT
  evidence:
  - reference: PMID:26185144
    reference_title: "Mutations in COQ4, an essential component of coenzyme Q biosynthesis, cause lethal neonatal mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings included hypotonia (6/6), encephalopathy with EEG
      abnormalities (4/4), neonatal seizures (3/6), cerebellar atrophy (4/5),
      cardiomyopathy (5/6) and lactic acidosis (4/6).
    explanation: >-
      Encephalopathy with EEG abnormalities was found in 4/4 patients assessed
      by EEG. Because the denominator of the whole cohort is 6, the conservative
      intention-to-ascertain estimate is 4/6 (67%), which maps to FREQUENT
      rather than VERY_FREQUENT.
- name: Epileptic Encephalopathy
  category: Neurologic
  description: >
    A severe myoclonic epileptic encephalopathy can ensue within hours of birth,
    and the early-onset COQ4 pattern is characterised by neonatal brain
    anomalies with epileptic encephalopathy. Seizures are frequently
    pharmacoresistant.
  phenotype_term:
    preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two sisters showed antenatal cerebellar hypoplasia, neonatal
      respiratory-distress syndrome, and epileptic encephalopathy
    explanation: >-
      Documents neonatal epileptic encephalopathy in COQ4-mutant sisters.
  - reference: PMID:34656997
    reference_title: "Human COQ4 deficiency: delineating the clinical, metabolic and neuroimaging phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      type 1: early-onset phenotype with neonatal brain anomalies and epileptic
      encephalopathy
    explanation: >-
      The large COQ4 cohort defines the early-onset (neonatal) pattern by brain

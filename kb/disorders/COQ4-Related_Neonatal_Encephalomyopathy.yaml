- name: Reduced coupled complex I+III and II+III activities
  notes: >
    Spectrophotometric assay of the respiratory chain shows selective reduction
    of the CoQ10-dependent coupled reactions (rotenone-sensitive
    NADH-cytochrome c reductase, complex I+III; succinate-cytochrome c
    reductase, complex II+III) with relatively preserved activities of the
    individual complexes. Findings are variable between tissues and can be
    normal in some specimens, so a normal result does not exclude the diagnosis.
    The bound term is the generic decreased-respiratory-chain-activity concept;
    no ontology term distinguishes the coupled CoQ10-dependent segments
    (I+III, II+III) from the individual complexes, which is the pattern that
    actually discriminates a CoQ10 biosynthesis defect.
  biomarker_term:
    preferred_term: Decreased activity of mitochondrial respiratory chain
    term:
      id: HP:0008972
      label: Decreased activity of mitochondrial respiratory chain
  presence: DECREASED
  evidence:
  - reference: PMID:28540186
    reference_title: "Novel recessive mutations in COQ4 cause severe infantile cardiomyopathy and encephalopathy associated with CoQ(10) deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the combined activities of CoQ10-dependent complexes i.e.,
      rotenone-sensitive NADH cytochrome c reductase (complex I + III) and
      succinate-cytochrome c reductase (complex II + III) were also found to be
      significantly reduced, whereas the activities of other complexes were
      essentially comparable to those found in normal controls
    explanation: >-
      Demonstrates the selective coupled-activity defect diagnostic of CoQ10
      deficiency.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical heterogeneity was accompanied by an equally striking variability
      of the biochemical findings, which ranged from multiple (S1 and S5) to
      isolated (S2 and S3) ETC defects in muscle and fibroblasts to hardly any
      detectable defect at all (S4).
    explanation: >-
      Documents the variability of respiratory-chain findings, which limits the
      sensitivity of enzymology as a diagnostic test.

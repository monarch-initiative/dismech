biochemical:
- name: Reduced tissue coenzyme Q10
  notes: >
    CoQ10 is severely reduced in skeletal muscle and in cultured skin
    fibroblasts from affected neonates. This is the defining biochemical
    abnormality and is measured by reversed-phase HPLC with electrochemical
    detection. The bound term covers the skeletal-muscle measurement; the
    parallel reduction in cultured fibroblasts has no distinct ontology term.
  biomarker_term:
    preferred_term: Decreased level of coenzyme Q10 in skeletal muscle
    term:
      id: HP:0034369
      label: Decreased level of coenzyme Q10 in skeletal muscle
  presence: DECREASED

- name: Neonatal Intensive Supportive Care
  description: >
    Management of the neonatal presentation is otherwise supportive: mechanical
    ventilation for respiratory failure, inotropic support for cardiac failure
    (which was ineffective in the first reported COQ4 neonate, who died four
    hours after birth), management of lactic acidosis, and anti-epileptic
    therapy for often-refractory seizures. Given the very high mortality,
    palliative care and genetic counselling for recurrence risk are integral.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dobutamine infusion via an umbilical venous catheter was ineffective, and

name: COQ4-Related Neonatal Encephalomyopathy
category: Mendelian
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
- primary coenzyme Q10 deficiency-7
- COQ10D7
- COQ4-related neonatal encephalomyopathy
- COQ4 deficiency, neonatal-onset form
description: >
  Neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
  (primary coenzyme Q10 deficiency-7, COQ10D7; OMIM 616276) is the severe
  neonatal-onset form of primary coenzyme Q10 (CoQ10) deficiency caused by
  biallelic pathogenic variants in COQ4. COQ4 has no known catalytic activity;
  it is thought to act as a structural organizer that stabilizes the
  multiheteromeric CoQ biosynthetic complex, so its loss collapses endogenous
  CoQ10 synthesis rather than blocking one defined enzymatic step. Because
  CoQ10 is the mobile electron carrier shuttling electrons from complexes I and
  II to complex III, CoQ10 depletion produces combined deficiency of the
  CoQ10-dependent segments of the respiratory chain (measured as reduced
  coupled complex I+III and II+III activities) and failure of oxidative ATP
  synthesis in the highest-energy-demand tissues - brain, heart, and skeletal
  muscle. Newborns present on the first day of life with profound hypotonia,
  encephalopathy with EEG abnormalities and neonatal seizures, hypertrophic
  cardiomyopathy, respiratory distress or respiratory insufficiency, and
  rapidly progressive lactic acidosis; antenatal cerebellar hypoplasia and
  neonatal cerebellar atrophy are characteristic neuroimaging features.
  Mortality in the neonatal-onset form is very high, and unlike some other
  primary CoQ10 deficiencies (notably the renal forms), the neonatal COQ4
  phenotype responds poorly to high-dose oral CoQ10 supplementation. An
  exon-dependent genotype-phenotype gradient has been proposed, with variants
  in exons 5-7 associated with early onset, unresponsiveness to CoQ10 and early
  death. Founder alleles are recognised in the Ashkenazi Jewish population and
  in East Asian populations (c.370G>A, p.Gly124Ser).
disease_term:
  preferred_term: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
  term:
    id: MONDO:0014562
    label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
parents:
- Mendelian Disorder
- Mitochondrial Disorder
- Inborn Error of Metabolism
notes: >
  Scope and positioning. This entry is the gene- and onset-specific child of the
  existing umbrella entry Primary_Coenzyme_Q10_Deficiency (MONDO:0018151), which
  carries COQ4 only as a brief subtype stub alongside the other CoQ10
  biosynthesis genes. MONDO:0014562 is_a MONDO:0018151. Consistent with the
  project's umbrella-plus-per-type modelling, the mechanism and evidence
  specific to the neonatal COQ4 phenotype are curated here rather than blended
  into the umbrella graph.
  Scope anchor: the largest COQ4 cohort resolves the disorder into three
  patterns, and this entry is scoped to their type 1 - the early-onset
  phenotype with neonatal brain anomalies and epileptic encephalopathy (see the
  Epileptic Encephalopathy phenotype for the quoted definition). Type 2
  (intermediate, stroke-like lesions) and type 3 (moderate, stable course) sit
  in the broader COQ4 spectrum and belong with the umbrella entry, not here.
  Several survivor-phase features (developmental delay, dystonia, ataxia,
  spasticity, hearing and visual impairment) are curated because affected
  infants who survive the neonatal period develop them, but their supporting
  sources describe the whole COQ4 spectrum, so they carry PARTIAL evidence and
  no frequency band.
  Named Entity Confusion guard: MONDO:0014562 carries the structured gene
  relationship RO:0004003 -> HGNC:19693 (COQ4) and the xref OMIM:616276, both of
  which were verified with OAK before curation. The disease MIM number is
  616276; published papers cite differing MIM numbers for the COQ4 gene itself,
  so the disease number should be taken from the MONDO xref rather than from
  narrative text.
  This entry is mechanistically distinct from the other neonatal mitochondrial
  cardiomyopathies in or entering the knowledge base:
  Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome (SLC25A3) is a
  mitochondrial phosphate-carrier defect, and MTO1 and MRPL44 deficiency
  (curated concurrently in open pull requests, not yet merged at the time of
  writing) are defects of mitochondrial translation; COQ4 disease is a defect of
  coenzyme Q10 biosynthesis.
  Epidemiology sourcing: an Orphanet prevalence class was not used because the
  local Orphadata snapshot could not be refreshed (known repository issue), so
  the prevalence records below use qualitative bands.
inheritance:
- name: Autosomal Recessive
  description: >
    COQ10D7 is inherited in an autosomal recessive pattern; affected individuals
    carry homozygous or compound heterozygous COQ4 variants and heterozygous
    parents are unaffected. Heterozygous carriers of COQ4 nonsense alleles are
    healthy, arguing against haploinsufficiency as the disease mechanism.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26185144
    reference_title: "Mutations in COQ4, an essential component of coenzyme Q biosynthesis, cause lethal neonatal mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in COQ4 cause an autosomal recessive lethal neonatal
      mitochondrial encephalomyopathy associated with a founder mutation in the
      Ashkenazi Jewish population.
    explanation: >-
      States the autosomal recessive mode of inheritance for the neonatal COQ4
      phenotype.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these individuals carried homozygous or compound-heterozygous
      mutations, clearly indicating that the resulting disease is an
      autosomal-recessive trait.
    explanation: >-
      Biallelic (homozygous or compound heterozygous) genotypes in all affected
      subjects establish recessive inheritance.
  - reference: PMID:25658047
    reference_title: "COQ4 mutations cause a broad spectrum of mitochondrial disorders associated with CoQ10 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that the heterozygous parents carrying the nonsense mutations are
      alive and well, it is unlikely that COQ4 haploinsufficiency is pathogenic
    explanation: >-
      Healthy heterozygous parents argue that a single loss-of-function allele
      is insufficient to cause disease, supporting a strictly recessive model.
  - reference: PMID:28125198
    reference_title: "Primary Coenzyme Q(10) Deficiency Overview."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inform genetic counseling of family members of an individual with primary
      CoQ10 deficiency.
    explanation: >-
      The GeneReviews overview treats genetic counselling of family members as a
      core management task, which follows from the autosomal recessive
      inheritance and the 25% sibling recurrence risk; PARTIAL because the
      abstract states the counselling objective rather than the mode of
      inheritance directly.

      basis as cryptorchidism: it belongs to the malformation complex that defines the
      syndrome. No cited source connects Hedgehog signalling to umbilical closure in this
      disorder, and the source that records the feature predates the gene.
    evidence:
    - reference: PMID:8352858
      reference_title: Cerebral malformations in Carpenter syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acrocephalopolysyndactyly or Carpenter syndrome consists of craniosynostosis,
        short fingers, soft tissue syndactyly, preaxial polydactyly, congenital heart
        disease, hypogenitalism, obesity, and umbilical hernia.
      explanation: >-
        Establishes umbilical hernia as part of the defined syndrome, which is the whole
        basis for this edge.
      directness: INDIRECT
  - target: Obesity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Obesity is a cardinal feature, and the gene-discovery paper proposed the Hedgehog
      connection as a route into obesity biology. That proposal is the whole of the
      support: no cited source traces a step between the pathway and adiposity in this
      disorder, and none reports a metabolic or hypothalamic measurement in a patient.
      The edge is drawn because the syndrome's own discoverers drew it, and it is marked
      with unknown intermediates because they did not fill it in.
    evidence:
    - reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        provides a new molecular target for studies of obesity
      explanation: >-
        The proposal, in the authors' own deliberately weak phrasing. A target for study
        is not a mechanism, which is what this edge's link type records.
      directness: INDIRECT
  - target: Abnormal heart morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiac defects are a cardinal feature and are attributed here to the shared
      pathway lesion, on the same footing as cryptorchidism. There is one suggestive
      route rather than a demonstrated one: laterality defects are reported in RAB23
      patients, and left-right patterning is Hedgehog- and Nodal-dependent. No cited
      source connects the pathway to a specific cardiac malformation in this disorder.
    evidence:
    - reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the cardinal features of which include craniosynostosis, polysyndactyly, obesity,
        and cardiac defects
      explanation: >-
        Places cardiac defects among the cardinal features of the disorder whose cause is
        this pathway lesion.
      directness: INDIRECT
    - reference: PMID:21412941
      reference_title: "Carpenter syndrome: extended RAB23 mutation spectrum and analysis of nonsense-mediated mRNA decay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        but further evidence for laterality defects is reported
      explanation: >-
        The one mechanistically suggestive observation: RAB23 loss can disturb left-right
        patterning, which is a Hedgehog-dependent process and a recognised route to
        cardiac malformation.
      directness: INDIRECT
  - target: Limb Patterning Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hedgehog signalling patterns the anteroposterior axis of the limb bud, and the
      polysyndactyly of Carpenter syndrome is attributed to its de-repression. The
      intervening steps have not been demonstrated in this disorder.
    evidence:
    - reference: PMID:38760421
      reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Carpenter syndrome (CRPTS) is a rare autosomal recessive condition caused by
        biallelic variants in genes that encode negative regulators of hedgehog
        signalling
      explanation: >-
        Establishes that both Carpenter syndrome genes are Hedgehog negative regulators,
        which is the basis for attributing the limb phenotype to pathway de-repression.
        No source cited here measures Hedgehog activity in a patient limb bud.
      directness: INDIRECT
  evidence:
  - reference: PMID:17503333
    reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The discovery of RAB23 mutations in patients with Carpenter syndrome implicates
      HH signaling in cranial-suture biogenesis--an unexpected finding, given that
      craniosynostosis is not usually associated with mutations of other HH-pathway
      components
    explanation: >-
      The original inference, together with the authors' own reason for treating it as
      unexpected. That reservation is part of why a purely Hedgehog account of the
      craniosynostosis was later refined.
  - reference: PMID:29727300
    reference_title: Rab23 and developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rab23 was initially identified to act as an antagonist of Sonic hedgehog (Shh)
      signaling
    explanation: >-
      States the antagonist relationship this node depends on.
  - reference: PMID:20375059
    reference_title: "Differential role of Rab proteins in ciliary trafficking: Rab23 regulates smoothened levels."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of Rab23 or expression of dominant-negative Rab23 decreased the ciliary
      steady state specifically of Smoothened but not EB1 or Kim1
    explanation: >-
      Cited as REFUTE against reading this node as uniformly increased Hedgehog output.
      Losing RAB23 removes Smoothened from the cilium, and Smoothened is what transduces
      the signal, so in this system the effect on pathway activity is negative.
  - reference: PMID:40825043
    reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Rab23-KO neural progenitor cells show perturbed ciliation and desensitized to
      primary cilium-dependent activation of the Hedgehog signaling pathway
    explanation: >-
      A second result in the same direction and in a disease-relevant cell type:
      RAB23-null progenitors respond less to Hedgehog, not more. Together with the
      Smoothened result this is why the pathway modifier on this node is DYSREGULATED.
  - reference: PMID:34210780
    reference_title: Multifaceted Functions of Rab23 on Primary Cilium-Mediated and Hedgehog Signaling-Mediated Cerebellar Granule Cell Proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab23 represses the basal level of Shh signaling, while facilitating primary
      cilium-dependent extrinsic Shh signaling activation.
    explanation: >-
      The dual-function account that reconciles the de-repression evidence with the
      reduced-responsiveness evidence, rather than choosing between them. This is the
      claim the node's description now rests on.
  - reference: PMID:34210780
    reference_title: Multifaceted Functions of Rab23 on Primary Cilium-Mediated and Hedgehog Signaling-Mediated Cerebellar Granule Cell Proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab23-depleted GCPs were desensitized against Hh pathway activity stimulations by
      Shh ligand and Smoothened (Smo) agonist-SAG, and exhibited attenuated stimulation
      of Smo-localization on the primary cilium in response to SAG
    explanation: >-
      Ties the blunted ligand response directly to failed Smoothened delivery to the
      cilium, which is the link between this node and the trafficking node upstream of
      it.
- name: Elevated FGF10-FGFR1-ERK Signalling in the Cranial Suture
  biological_scale: CELLULAR
  description: >-
    In Rab23-null mouse sutures, FGF10-driven FGFR1 signalling is elevated, with
    downstream hyperactivation of the ERK1/2 arm of MAPK. This is the arm of the
    mechanism with the strongest causal evidence, because it was tested by
    intervention rather than only observed: inhibiting the raised pERK1/2 normalises
    osteoprogenitor proliferation and prevents the craniosynostosis.
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  downstream:
  - target: Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis
    causal_link_type: DIRECT
    description: >-
      Raised pERK1/2 drives the osteoprogenitor proliferation and osteogenic gene
      expression; blocking it reverses both.
    evidence:
    - reference: PMID:32662771
      reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Inhibition of elevated pERK1/2 signaling results in the normalization of
        osteoprogenitor proliferation with a concomitant reduction of osteogenic gene
        expression, and prevention of craniosynostosis.
      explanation: >-
        An interventional result, which is what makes this the best-supported causal
        step in the pathograph. It is a mouse experiment, so it establishes the
        mechanism in the model rather than in patients.
  evidence:
  - reference: PMID:32662771
    reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      FGF10-driven FGFR1 signaling is elevated in Rab23-/-sutures with a consequent
      imbalance in MAPK, Hedgehog signaling and RUNX2 expression.
    explanation: >-
      The measured signalling change in the affected tissue.
- name: Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis
  biological_scale: TISSUE
  description: >-
    Suture patency depends on mesenchymal cells at the centre of the suture remaining
    undifferentiated while progenitors at the osteogenic fronts proliferate and
    differentiate in a controlled way. In Rab23-null sutures that balance fails:
    osteoprogenitor proliferation is aberrant and osteogenesis in the suture is
    elevated, and multiple sutures fuse prematurely.
  cell_types:
  - preferred_term: suture osteoprogenitor
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: suture mesenchymal cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: INCREASED
  downstream:
  - target: Craniosynostosis
    causal_link_type: DIRECT
    description: >-
      Premature fusion of the sutures is the direct consequence of the excess
      osteogenesis within them.
    evidence:
    - reference: PMID:32662771
      reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        these mice exhibit premature fusion of multiple sutures resultant from aberrant
        osteoprogenitor proliferation and elevated osteogenesis in the suture
      explanation: >-
        States the cellular cause of the suture fusion, in the model.
  - target: Proptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Prominent eyes follow from the skull shape rather than from any ocular lesion: the
      altered calvarial growth that the suture fusion imposes leaves shallow orbits, and
      the globes sit forward in them. This is the one craniofacial feature in this entry
      with an intermediate that can be named, which is why it hangs off the osteogenic
      node rather than off the pathway node with the rest of the facies.
    evidence:
    - reference: PMID:34244844
      reference_title: "Complex craniosynostosis in the context of Carpenter's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a trefoil-like skull, flattened and receding forehead, bulging of temporal bones,
        hypertelorism, exorbitism, and polysyndactyly
      explanation: >-
        Lists the exorbitism in the same breath as the skull deformity that produces it,
        in one patient. The intermediate step - shallow orbits - is standard
        craniosynostosis anatomy rather than something this source measures, so the link
        is indirect with known rather than demonstrated intermediates.
      directness: INDIRECT
  evidence:
  - reference: PMID:32662771
    reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mesenchymal cells in the center of the suture must be kept in an undifferentiated
      state to maintain suture patency, while progenitor cells at the osteogenic fronts
      proliferate and differentiate to facilitate bone growth.
    explanation: >-
      The normal cell biology of the suture that this node describes the failure of.

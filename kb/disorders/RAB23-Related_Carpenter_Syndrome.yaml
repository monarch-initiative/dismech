- name: Impaired Ciliary Protein Trafficking
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_scale: CELLULAR
  description: >-
    RAB23 participates in protein delivery to the primary cilium, the organelle in
    which vertebrate Hedgehog signal transduction is organised. This places Carpenter
    syndrome adjacent to the ciliopathies, which it partly resembles clinically, though
    RAB23 also has functions independent of cilia and of Hedgehog.

    Two ciliary cargoes have been identified, and the specificity of the first is the
    informative part. Depleting RAB23 lowers the ciliary steady-state level of Smoothened
    - the Hedgehog transducer - while leaving the control proteins EB1 and Kim1
    untouched, so this is not a general collapse of ciliary import but a defect in
    turnover of a particular cargo. The second is Kif17, a kinesin-2 motor: RAB23 sits in
    a complex with Kif17 and importin beta-2, and Kif17 fails to reach the cilium in
    RAB23-depleted cells.

    Whether the cilium is affected at all depends on the cell type. Across a conditional
    knockout mouse, patient-derived iPSCs and zebrafish morphants, ciliary defects appear
    in chondrocytes, fibroblasts, neural progenitors and neocortical neurons but not in
    epithelial cells, cerebellar granule cells or hippocampal neurons - and the defect
    itself differs, being reduced ciliation frequency in patient-derived neurons but
    merely shortened cilia in the same patients' fibroblasts and progenitors. That
    cell-type dependence is a candidate explanation for why a lesion in a ubiquitous
    trafficking GTPase produces a phenotype concentrated in skull and limb.
  biological_processes:
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: DECREASED
  - preferred_term: cilium assembly

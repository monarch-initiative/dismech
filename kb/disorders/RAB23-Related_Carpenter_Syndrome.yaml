pathophysiology:
- name: RAB23 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic RAB23 variants abolish or impair a small GTPase that cycles between
    GDP-bound inactive and GTP-bound active states. The reported allele spectrum is
    dominated by truncating changes, with a recurrent founder nonsense allele; the
    point mutations that have been characterised structurally fall within the GTPase
    domain, and the Y79 deletion distorts the switch II region, which is the surface
    through which an activated Rab engages its effectors. The consequence is loss of
    function rather than a gain or a change of specificity.

    Three molecular routes to that loss have been demonstrated, and they are not
    variations on one theme. Most truncating alleles never make a protein at all: their
    transcripts are degraded by nonsense-mediated decay, shown experimentally rather than
    inferred from the premature stop codon. A frameshift late enough to escape that fate
    reaches the same endpoint differently, by deleting the C-terminal prenylatable
    cysteine, so a protein is made but cannot be lipid-anchored to the membranes it must
    work on. The missense and in-frame alleles leave a full-length, membrane-competent
    protein whose effector surface is distorted. All three converge on absent RAB23
    activity, which is why the entry treats the allele spectrum as functionally uniform
    despite its structural variety - and is consistent with the absence of any reported
    genotype-phenotype correlation.

  phenotype_term:
    preferred_term: Brachydactyly
    term:
      id: HP:0001156
      label: Brachydactyly
  frequency: FREQUENT
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with polydactyly, abnormalities of the middle phalanges and talipes also being

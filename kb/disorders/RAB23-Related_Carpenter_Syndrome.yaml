- name: Intellectual disability
  category: Clinical
  description: >-
    Intellectual impairment affects up to three-quarters of patients, but it is expressly
    not invariable, and the entry bands it accordingly rather than treating it as a
    defining feature.

    Its severity has a reported structural correlate: the most profound delay goes with
    cerebral malformations visible on MRI or CT, which makes neuroimaging prognostically
    informative rather than merely confirmatory. That relationship is not mirrored on the
    outside of the head - degree of craniofacial dysmorphology does not track brain
    dysmorphology - so the face does not predict the outcome.

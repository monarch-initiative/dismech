- name: Umbilical hernia
  category: Clinical
  description: >-
    Protrusion at the umbilicus, part of the malformation complex catalogued under the
    older name acrocephalopolysyndactyly. It is listed in the clinical descriptions of
    the syndrome but is not counted in any of the cited series, so the band reflects
    membership in the described phenotype rather than a measured frequency.
  phenotype_term:
    preferred_term: Umbilical hernia
    term:
      id: HP:0001537
      label: Umbilical hernia

    snippet: >-
      craniosynostosis, short fingers, soft tissue syndactyly, preaxial polydactyly,
      congenital heart disease, hypogenitalism, obesity, and umbilical hernia
    explanation: >-
      Umbilical hernia among the features defining the syndrome clinically. The source
      predates the gene, so it describes the clinical entity rather than the RAB23

diagnosis:
- name: Clinical recognition with RAB23 sequencing
  description: >-
    Carpenter syndrome is recognised clinically from craniosynostosis with
    polysyndactyly. Distinguishing CRPT1 from CRPT2 requires gene testing, but two
    clinical features shift the prior towards RAB23: multi-suture rather than single
    midline suture craniosynostosis, and the absence of laterality defects, which are
    common in CRPT2 and rare in CRPT1.
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, laterality defects are present in nearly half of those with
      MEGF8-associated CRPT2, but are rare in RAB23-associated CRPT1.
    explanation: >-
      The clinical discriminator, in the direction that favours RAB23 when laterality is
      normal.
- name: Prenatal ultrasound recognition
  description: >-
    Carpenter syndrome is hard to see before birth, and the cited experience says so
    plainly: in one fetus with a complex prenatal picture the diagnosis was still only
    made at birth, and it had been suggested on ultrasound in just one prior patient.
    Craniosynostosis and preaxial hexadactyly of the feet were visible on fetal CT only in
    retrospect.

    What the case yields is a prompt rather than a test. Bowed femora and a cardiac defect
    are both rare postnatal findings in this syndrome, so their appearance on a prenatal
    scan alongside an abnormal skull shape is a specific reason to consider the diagnosis.
    Cystic hygroma was also present in this fetus.
  evidence:
  - reference: PMID:25168863
    reference_title: Prenatal findings in carpenter syndrome and a novel mutation in RAB23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Carpenter syndrome should therefore be considered on prenatal
      imaging in cases of bowed femora and/or cardiac defect associated with abnormal
      skull shape.
    explanation: >-
      The authors' recommendation, which is the substance of this diagnosis entry.
  - reference: PMID:25168863
    reference_title: Prenatal findings in carpenter syndrome and a novel mutation in RAB23.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This observation illustrates the difficulty of prenatal ultrasound diagnosis of
      Carpenter syndrome.
    explanation: >-
      Cited as REFUTE against reading the entry above as a reliable prenatal test. The
      same paper that proposes the prompt records that the diagnosis was missed
      prenatally in this fetus and has been suggested on ultrasound in only one patient
      before.
treatments:
- name: Craniofacial surgical management
  description: >-
    Surgical management of the craniosynostosis. No disease-modifying therapy exists for
    the underlying signalling defect, so this is the treatment of the disease in practice.

    There is no established management algorithm - the disorder is too rare for one - but
    two things are agreed. Early release of the fused sutures with fronto-orbital
    advancement is indicated, and particularly so where intracranial pressure is raised.
    And correction is usually safe within the first 6 to 12 months, which is early by the
    standards of craniofacial surgery generally.

    The operative planning carries a specific hazard worth recording as part of the
    treatment rather than as a complication of it: abnormal venous drainage and ectatic
    emissary veins can cause serious bleeding, and the skull may be weak enough to
    fragment when cranial flaps are raised. Both are why imaging before operating - 3D CT
    for the bone, MR angiography for the veins - changes what the surgeon does.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  - preferred_term: Cutaneous syndactyly
    term:
      id: HP:0012725
      label: Cutaneous syndactyly
  target_mechanisms:
  - target: Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis
    description: >-
      Surgery acts on the product of this node rather than on the node itself. Releasing
      fused sutures and advancing the fronto-orbital segment undoes the anatomical
      consequence of the excess osteogenesis; it does not touch the FGF-ERK signalling
      that drove it, which is why the fusion can recur and why the pERK1/2 inhibition
      result is curated as a model rescue rather than as a therapy.
    evidence:
    - reference: PMID:25162549
      reference_title: "Carpenter syndrome: a review for the craniofacial surgeon."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        early release of craniosynostoses with fronto-orbital advancement is clearly
        indicated in the CS literature, particularly in cases of elevated intracranial
        pressure
      explanation: >-
        Names the intervention and the anatomical target it acts on.
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had presented during infancy with polysyndactyly and craniosynostosis, both
      treated surgically, and had a clinical diagnosis of CRPTS.
    explanation: >-
      Documents surgical management of both the craniosynostosis and the polysyndactyly
      in a patient with Carpenter syndrome. The individual described carries a MEGF8
      variant, so this supports the surgical approach to the shared phenotype rather
      than a RAB23-specific practice.
    directness: INDIRECT
  - reference: PMID:25162549
    reference_title: "Carpenter syndrome: a review for the craniofacial surgeon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      early release of craniosynostoses with fronto-orbital advancement is clearly
      indicated in the CS literature, particularly in cases of elevated intracranial
      pressure
    explanation: >-
      The one clearly indicated intervention, from a review written for the surgeons who
      perform it. Graded OTHER because it is a synthesis of selected case literature
      rather than a series with its own outcomes.
  - reference: PMID:25162549
    reference_title: "Carpenter syndrome: a review for the craniofacial surgeon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Given the scarcity of CS cases, an algorithm for CS management has not been
      established.
    explanation: >-
      States why this treatment entry describes agreed principles rather than a protocol:
      there are not enough patients to have built one.
  - reference: PMID:34244844
    reference_title: "Complex craniosynostosis in the context of Carpenter's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early correction of craniofacial deformity in Carpenter's syndrome is usually safe
      within 6 to 12 months.
    explanation: >-
      The timing, from a case with two years of follow-up after correction.
  - reference: PMID:34244844
    reference_title: "Complex craniosynostosis in the context of Carpenter's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Venous drainage abnormalities and ectatic emissary veins can lead to significant
      bleeding and may be detected on MR angiography.
    explanation: >-
      The operative hazard and the imaging that detects it beforehand. Recorded because
      it changes preoperative planning rather than being a general surgical caution.
- name: Cardiac surgical correction
  description: >-
    Surgical repair of the congenital cardiac defect. The one lesion named in the cited
    literature is Tetralogy of Fallot, and the reported outcome is the reason this is
    curated separately rather than folded into supportive care: patients reach adulthood
    after correction, but residual lesions progress, and that progression was the
    principal difficulty in the one reported pregnancy in this syndrome.

    So the treatment is not a closed episode. It changes what the cardiac phenotype is -
    from a neonatal malformation to a lifelong one requiring follow-up - rather than
    ending it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgical correction
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_phenotypes:
  - preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:23706836
    reference_title: Caesarean section in a parturient with Carpenter syndrome and corrected Tetralogy of Fallot.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the anaesthetic management for caesarean section of a parturient with
      Carpenter syndrome and corrected Tetralogy of Fallot.
    explanation: >-
      A patient with the syndrome whose cardiac defect had been surgically corrected and
      who survived to adulthood and pregnancy.
  - reference: PMID:23706836
    reference_title: Caesarean section in a parturient with Carpenter syndrome and corrected Tetralogy of Fallot.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even after surgical correction of cardiac abnormalities, intrapartum care of a
      parturient with this condition can be challenging because of progression of
      residual cardiac defects
    explanation: >-
      The limit of the intervention, stated by the authors: correction does not stop
      residual lesions progressing. This is why the treatment carries a follow-up
      implication rather than being recorded as definitive.
- name: Ventriculoperitoneal shunt
  description: >-
    Diversion of cerebrospinal fluid for hydrocephalus. It is curated because it is
    reported as actually performed in a patient with a confirmed RAB23 genotype, not
    because it is a general option for hydrocephalus: one of two siblings in the Emirati
    family had ventricular dilatation severe enough to require the shunt, while her
    brother had dilatation that did not.

    That pair is the useful part. The same allele, the same family, and one child shunted
    and the other not, which is a concrete instance of the variable expressivity this
    entry records elsewhere from craniosynostosis severity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_phenotypes:
  - preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  evidence:
  - reference: PMID:23599695
    reference_title: A Novel Aberrant Splice Site Mutation in RAB23 Leads to an Eight Nucleotide Deletion in the mRNA and Is Responsible for Carpenter Syndrome in a Consanguineous Emirati Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected child also had dilatation of the lateral ventricles which required a
      ventriculo-peritoneal shunt
    explanation: >-
      The intervention as performed, in a genotyped patient.
  - reference: PMID:23599695
    reference_title: A Novel Aberrant Splice Site Mutation in RAB23 Leads to an Eight Nucleotide Deletion in the mRNA and Is Responsible for Carpenter Syndrome in a Consanguineous Emirati Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was dilatation of the lateral ventricles. Ophthalmological examination was
      normal.
    explanation: >-
      The sibling with the same allele whose ventricular dilatation did not require
      shunting, which is why this treatment is not presented as a standard part of care.
- name: Genetic counselling
  description: >-
    Counselling for an autosomal recessive disorder with a one-in-four recurrence risk for
    the parents of an affected child. It is curated because the genetics here make it
    unusually actionable rather than routine: the causal variants are known and
    homozygous, carrier testing of the parents has been done in reported families, and
    much of the literature is consanguineous families with several affected children.

    Prenatal recognition is possible but unreliable - see the prenatal-imaging entry in
    the diagnosis section, which records both the recommendation and its documented
    failure rate - so counselling based on a known familial variant is the stronger
    offering.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33368989
    reference_title: Carpenter syndrome in a patient from Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents were demonstrated to be heterozygous carriers of this variant.
    explanation: >-
      Carrier testing of both parents, which is the concrete thing counselling rests on
      here: the recurrence risk is quantifiable because the variant is identified in the
      family.
  - reference: PMID:20358613
    reference_title: RAB23 mutation in a large family from Comoros Islands with Carpenter syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four relatives of Comorian origin with Carpenter syndrome
    explanation: >-
      Four affected children in one family, which is the situation recurrence-risk
      counselling exists to address.
experimental_models:
- name: Carpenter syndrome patient-derived iPSC neural lineage
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells from Carpenter syndrome patients, differentiated down
    the neural lineage. This is the only human-cell system in the entry, and it is what
    turns "Carpenter syndrome resembles a ciliopathy" into a measurement in patient cells
    rather than an inference from mouse work.

    Its most useful result is a dissociation within one genotype. Neurons differentiated
    from these lines show a marked drop in the proportion of ciliated cells, while the
    same patients' fibroblasts, undifferentiated iPSCs and neural progenitors keep a
    normal ciliation rate and show only shortened cilia. A study that had sampled
    fibroblasts alone would have concluded the ciliary defect was mild.
  modeled_mechanisms:
  - target: Impaired Ciliary Protein Trafficking
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient cells carrying patient alleles, assayed for the ciliary phenotype this node
      asserts, with the cell-type dependence measured rather than assumed.
    limitations: >-
      Differentiated cells in culture, not developing tissue. The lineages assayed are
      neural, so nothing here speaks to the cranial suture or limb bud, which are where
      the defining features of the disease arise.
    readouts:
    - name: Ciliation frequency in iPSC-derived neurons
      target: Impaired Ciliary Protein Trafficking
      direction: DECREASED
      interpretation: >-
        The proportion of ciliated cells falls in patient-derived neurons specifically.
      evidence:
      - reference: PMID:40825043
        reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          A profound reduction in ciliation frequency was observed specifically in neurons
          differentiated from CS patient iPSCs
        explanation: >-
          The measurement, in cells from patients with the disease this entry describes.
    - name: Cilium length in patient fibroblasts and neural progenitors
      target: Impaired Ciliary Protein Trafficking
      direction: DECREASED
      interpretation: >-
        In the non-neuronal patient cells the defect is a shorter cilium at a normal
        ciliation rate, which is a milder and qualitatively different abnormality.
      evidence:
      - reference: PMID:40825043
        reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the patients' fibroblasts, iPSCs and neural progenitor cells maintained normal
          ciliation percentages but shortened cilia length
        explanation: >-
          The contrasting result in the same patients' other cell types, which is what
          establishes the dependence on cell type rather than on genotype.
    evidence:
    - reference: PMID:40825043
      reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Through the use of patient-derived iPSCs differentiated cells, we present direct
        evidence of primary cilia anomalies in CS, thereby confirming CS as a ciliopathy
        disorder.
      explanation: >-
        The authors' statement of what this system establishes: that the ciliary defect is
        present in human patient cells and not only in animal models.
animal_models:
- name: Rab23 conditional knockout mouse
  species: Mouse
  genotype: Rab23 conditional knockout
  publication: PMID:40825043
  description: >-
    A conditional knockout that avoids the embryonic lethality of the classical null and
    was used to ask where in the body RAB23 loss actually disturbs the cilium. The answer
    is that it depends on the cell: chondrocytes, embryonic fibroblasts, neural
    progenitors and neocortical neurons are affected, while epithelial cells, cerebellar
    granule cells and hippocampal neurons are not.

    This is the model behind the entry's context-dependence claim, and it is also why the
    Hedgehog node's direction is left unasserted: Rab23-knockout neural progenitors
    respond less to Hedgehog rather than more.
  modeled_mechanisms:
  - target: Impaired Ciliary Protein Trafficking
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces ciliopathy-like developmental features in vivo and localises the ciliary
      defect to specific cell types.
    limitations: >-
      Murine, and conditional, so which cells lose Rab23 depends on the driver used. The
      species difference that dominates this entry still applies: mouse nulls are
      embryo-lethal where human nulls survive.
    readouts:
    - name: Hedgehog pathway responsiveness in neural progenitor cells
      target: Impaired Ciliary Protein Trafficking
      direction: DECREASED
      interpretation: >-
        Rab23-null progenitors are less responsive to cilium-dependent Hedgehog
        activation, which is the opposite direction to simple de-repression.
      evidence:
      - reference: PMID:40825043
        reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Rab23-KO neural progenitor cells show perturbed ciliation and desensitized to
          primary cilium-dependent activation of the Hedgehog signaling pathway
        explanation: >-
          The measured pathway response, in the cell type where it was assayed.
    evidence:
    - reference: PMID:40825043
      reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Rab23-CKO mutants exhibit multiple developmental and phenotypical traits
        recapitulating the clinical features of human ciliopathies and CS, indicating a
        causal link between the loss of Rab23 and ciliopathy.
      explanation: >-
        Establishes the model as informative for this disease, in the authors' own terms.
- name: Rab23 zebrafish morphant
  species: Zebrafish
  genotype: rab23 morpholino knockdown
  publication: PMID:40825043
  description: >-
    The third of the three vertebrate systems in which RAB23 loss was tested in parallel.
    Its value here is corroborative rather than independent: it is reported in the same
    study as the mouse and iPSC arms, and it is what allows the ciliary defect to be
    called consistent across vertebrates.
  modeled_mechanisms:
  - target: Impaired Ciliary Protein Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows the same perturbation of primary cilium formation as the other two systems.
    limitations: >-
      A morpholino knockdown rather than a genetic null, so residual protein and
      off-target effects are not excluded, and no Carpenter-specific skeletal readout is
      reported for this arm.
    evidence:
    - reference: PMID:40825043
      reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        all three different vertebrate mutant models consistently show a perturbation of
        primary cilia formation
      explanation: >-
        The consistency across systems that this arm contributes to. The same sentence's
        "context-dependent" qualifier is quoted on the trafficking node.
- name: Rab23-deficient mouse surviving to skeletal stages
  species: Mouse
  genotype: Rab23-/-
  publication: PMID:32662771
  description: >-
    A Rab23-deficient mouse engineered to survive past the embryonic lethality of the
    classical null, allowing skeletal development to be studied. It is the model in
    which the FGF10-pERK1/2 mechanism was established and pharmacologically tested.
  modeled_mechanisms:
  - target: Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model reproduces multi-suture premature fusion arising from the same cellular
      lesion this node describes, and localises it to the suture.
    limitations: >-
      The cellular measurements are murine; no equivalent suture histology or signalling
      measurement from a RAB23 patient is cited.
    readouts:
    - name: Osteoprogenitor proliferation in the cranial suture
      target: Aberrant Osteoprogenitor Proliferation and Premature Osteogenesis
      direction: INCREASED
      interpretation: >-
        The proliferative excess that drives the premature fusion.
      evidence:
      - reference: PMID:32662771
        reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          these mice exhibit premature fusion of multiple sutures resultant from aberrant
          osteoprogenitor proliferation and elevated osteogenesis in the suture
        explanation: >-
          Reports the proliferation and osteogenesis measurements behind this readout.
    evidence:
    - reference: PMID:32662771
      reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To understand how RAB23 regulates skull development, we generated Rab23-deficient
        mice that survive to an age where skeletal development can be studied.
      explanation: >-
        States the purpose and the design feature that makes this model informative for
        the skull phenotype at all.
  - target: Elevated FGF10-FGFR1-ERK Signalling in the Cranial Suture
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Pharmacological inhibition of pERK1/2 in this model normalised osteoprogenitor
      proliferation, reduced osteogenic gene expression and prevented the
      craniosynostosis, which is the interventional evidence that the ERK arm is causal
      rather than correlated.
    limitations: >-
      The rescue is preclinical and prophylactic in a mouse. Nothing is reported about
      whether the same inhibition would help after sutures have fused, and no
      corresponding human intervention exists.
    readouts:
    - name: Suture patency after pERK1/2 inhibition
      target: Elevated FGF10-FGFR1-ERK Signalling in the Cranial Suture
      direction: RESTORED
      interpretation: >-
        Prevention of craniosynostosis on inhibition of the raised ERK signal.
      evidence:
      - reference: PMID:32662771
        reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Inhibition of elevated pERK1/2 signaling results in the normalization of
          osteoprogenitor proliferation with a concomitant reduction of osteogenic gene
          expression, and prevention of craniosynostosis.
        explanation: >-
          The rescue result behind this readout.
    evidence:
    - reference: PMID:32662771
      reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        FGF10-driven FGFR1 signaling is elevated in Rab23-/-sutures with a consequent
        imbalance in MAPK, Hedgehog signaling and RUNX2 expression.
      explanation: >-
        Establishes that the pathway being rescued is the one elevated in the model.
- name: open brain (opb) spontaneous Rab23 nonsense mouse
  species: Mouse
  genotype: Rab23 nonsense (open brain), homozygous
  publication: PMID:17503333
  description: >-
    The classical spontaneous mouse mutant that first identified Rab23 as a Hedgehog
    antagonist. It is recorded here as a negative result: homozygotes die as embryos
    with neural tube defects, a phenotype humans with equivalent alleles do not have.
  modeled_mechanisms:
  - target: RAB23 Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The same class of allele produces recessive embryonic lethality with an open
      neural tube in mouse, whereas human RAB23 null homozygotes survive and present
      with Carpenter syndrome. The model therefore does not reproduce the human
      consequence of RAB23 loss.
    limitations: >-
      The divergence is at the level of viability, so this model cannot be used to study
      the postnatal skeletal, adipose or cognitive phenotypes of Carpenter syndrome at
      all. The reason for the species difference is unknown; the original authors
      described it as a species difference in the requirement for RAB23 during early
      development, which is a restatement of the observation rather than an explanation.
    evidence:
    - reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, nonsense mutations of Rab23 in open brain mice cause recessive
        embryonic lethality with neural-tube defects, suggesting a species difference in
        the requirement for RAB23 during early development.
      explanation: >-
        The discrepant model phenotype, and the authors' own reading of it as a species
        difference.
    - reference: PMID:29727300
      reference_title: Rab23 and developmental disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Interestingly, RAB23 null allele homozygosity in humans is not lethal, but
        instead causes the developmental disorder Carpenter's syndrome (CS)
      explanation: >-
        The human side of the same contrast, stated explicitly.
differential_diagnoses:
- name: MEGF8-related Carpenter syndrome
  description: >-
    Carpenter syndrome 2, the rarer form, caused by biallelic variants in the other
    Hedgehog negative regulator. The two share the core craniosynostosis,
    polysyndactyly and cryptorchidism, and are separated clinically by laterality
    defects (common in CRPT2, rare here) and by suture pattern (single midline in CRPT2,
    multi-suture here). They are curated as separate entries because the two proteins
    diverge mechanistically downstream, MEGF8 acting through BMP-SMAD and RAB23 through
    FGF-ERK.
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carpenter syndrome (CRPTS) is a rare autosomal recessive condition caused by
      biallelic variants in genes that encode negative regulators of hedgehog signalling
    explanation: >-
      Establishes that the two subtypes are defined by two genes in the same regulatory
      role.
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most common form of CRPTS (CRPT1; OMIM 201000) was shown in 2007 to be caused
      by biallelic pathogenic variants in RAB23
    explanation: >-
      Identifies this entry's disease as the common form, and dates the gene discovery.
discussions:
- discussion_id: rab23_mouse_human_viability_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is homozygous RAB23 nonsense mutation embryonic lethal with neural tube defects
    in mouse but compatible with survival and a postnatal skeletal syndrome in humans,
    and what does that divergence imply for using mouse Rab23 models to study Carpenter
    syndrome?
  attaches_to:
  - pathophysiology#RAB23 Loss of Function
  - animal_models#open brain (opb) spontaneous Rab23 nonsense mouse
  rationale: >-
    This is not a difference of severity but of outcome: the same class of allele kills
    the mouse embryo and produces a viable developmental syndrome in humans. It has a
    direct methodological consequence, which the field has already had to work around -
    the mouse used to establish the FGF10-pERK1/2 suture mechanism had to be engineered
    specifically to survive to skeletal stages, because the classical null does not. Any
    claim carried from that model into the human disease therefore rests on a system
    that has been modified precisely at the point where the species diverge. Nothing in
    the cited literature explains the divergence; the original description labels it a
    species difference in the developmental requirement for RAB23, which names the
    problem without resolving it.
  proposed_experiments:
  - experiment_id: rab23_cross_species_neurulation
    name: Compare RAB23 dependence in human and mouse neurulation-stage models
    description: >-
      Determine whether the divergence lies in RAB23 itself or in pathway redundancy, by
      comparing Hedgehog pathway output and neural tube closure between human
      iPSC-derived neural models carrying patient RAB23 null alleles and the equivalent
      mouse system.
    perturbations:
    - name: Biallelic RAB23 null allele
      target: pathophysiology#RAB23 Loss of Function
      description: >-
        Introduce a patient-equivalent RAB23 null genotype in both species' models.
    readouts:
    - name: Hedgehog pathway output
      target: pathophysiology#Hedgehog Signalling Dysregulation
      interpretation: >-
        Comparable de-repression in both species with divergent morphological outcome
        would locate the difference downstream of Hedgehog rather than in RAB23 itself.
    would_support:
    - pathophysiology#Hedgehog Signalling Dysregulation
  evidence:
  - reference: PMID:17503333
    reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, nonsense mutations of Rab23 in open brain mice cause recessive
      embryonic lethality with neural-tube defects
    explanation: >-
      The mouse phenotype that does not occur in humans.
  - reference: PMID:29727300
    reference_title: Rab23 and developmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is unique amongst the Rabs in terms of its implicated role in mammalian
      development, as originally illustrated by the embryonic lethality and open neural
      tube phenotype of a spontaneous mouse mutant
    explanation: >-
      Confirms the mouse phenotype is the defining one for this gene, which is what makes
      the human divergence notable rather than incidental.
  - reference: PMID:32662771
    reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated Rab23-deficient mice that survive to an age where skeletal development
      can be studied
    explanation: >-
      The workaround the mismatch forced on the field, and the reason model-derived
      mechanism in this disease needs the caveat attached.
- discussion_id: hedgehog_versus_fgf_arm
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the craniosynostosis of Carpenter syndrome primarily a Hedgehog de-repression
    phenotype, as inferred at gene discovery, or primarily an FGFR-ERK phenotype, as the
    interventional mouse work suggests?
  attaches_to:
  - pathophysiology#Hedgehog Signalling Dysregulation
  - pathophysiology#Elevated FGF10-FGFR1-ERK Signalling in the Cranial Suture
  rationale: >-
    The original inference from human genetics was that Hedgehog signalling must be
    involved in suture biogenesis, and the authors flagged this as unexpected because
    craniosynostosis is not usually caused by other Hedgehog pathway components. The
    later mouse work supplies a different emphasis: FGF10-FGFR1-pERK1/2 is elevated, and
    inhibiting it prevents the craniosynostosis, while Hedgehog appears as one arm of a
    broader imbalance. The two are not exclusive - RAB23 is proposed to restrain both
    pathways, and to regulate GLI1 non-canonically through pERK1/2 - but the pathograph
    currently records the FGF-ERK arm as the better-evidenced route to the suture
    phenotype, on the strength of the rescue experiment. That ordering rests on a single
    mouse study and should be revisited if the Hedgehog arm is tested by intervention.
  evidence:
  - reference: PMID:17503333
    reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      implicates HH signaling in cranial-suture biogenesis--an unexpected finding, given
      that craniosynostosis is not usually associated with mutations of other HH-pathway
      components
    explanation: >-
      The Hedgehog-first inference, together with the authors' own reason for doubting it
      is the whole account.
  - reference: PMID:32662771
    reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inhibition of elevated pERK1/2 signaling results in the normalization of
      osteoprogenitor proliferation with a concomitant reduction of osteogenic gene
      expression, and prevention of craniosynostosis.
    explanation: >-
      The interventional result that gives the FGF-ERK arm its precedence in this
      pathograph.
  - reference: PMID:32662771
    reference_title: RAB23 coordinates early osteogenesis by repressing FGF10-pERK1/2 and GLI1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a novel role for RAB23 as an upstream negative regulator of both FGFR and canonical
      Hh-GLI1 signaling, and additionally in the non-canonical regulation of GLI1 through
      pERK1/2
    explanation: >-
      States that the two arms are connected rather than competing, which is why this is
      recorded as a question of emphasis and not a contradiction.
- discussion_id: hedgehog_direction_of_effect
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does RAB23 loss raise or lower Hedgehog pathway output, and is the answer different
    in different cell types?
  attaches_to:
  - pathophysiology#Hedgehog Signalling Dysregulation
  - pathophysiology#Impaired Ciliary Protein Trafficking
  rationale: >-
    The classical genetics points one way: RAB23 is a Sonic hedgehog antagonist, mouse
    nulls have a ventralised neural tube, and losing an antagonist should de-repress the
    pathway. Two cell-biological results point the other
    way. Depleting RAB23 selectively lowers ciliary Smoothened - the transducer - while
    leaving control ciliary proteins alone. And RAB23-knockout neural progenitors respond
    less to cilium-dependent Hedgehog activation, not more.

    There is a proposed resolution, and it is better supported than "it depends on the
    cell type". Both directions were measured in the same cells: Rab23-depleted cerebellar
    granule cell precursors show a raised basal level of Shh pathway activity and, at the
    same time, a blunted response to Shh ligand and to a Smoothened agonist, together with
    reduced agonist-driven Smoothened localisation to the cilium. On that account RAB23
    has two separable jobs - it represses basal pathway activity, and it facilitates
    cilium-dependent activation by ligand - so losing it raises the floor and lowers the
    ceiling. The classical genetics reports the floor; the ciliary trafficking work
    reports the ceiling; neither is wrong.

    Two things keep this open rather than settled. It rests on one study in one cell type,
    and that cell type is one where a second study found no ciliary abnormality at all -
    a discrepancy the two papers do not address, and which may come down to the different
    conditional drivers used. And no Hedgehog measurement of either kind has been made in
    a Carpenter suture or limb bud, so the direction is asserted in the tissues that
    define the disease and measured only in tissues that do not.

    Until that gap closes the node carries DYSREGULATED rather than a direction, which on
    the dual-function reading is not a hedge but the accurate description: the pathway is
    deranged in two directions at once.
  evidence:
  - reference: PMID:20375059
    reference_title: "Differential role of Rab proteins in ciliary trafficking: Rab23 regulates smoothened levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of Rab23 in mice recapitulates the HH phenotype but its function in HH
      signaling is unknown.
    explanation: >-
      The authors state the gap this question is about: the genetic phenotype is
      established and the molecular direction of effect is not.
  - reference: PMID:20375059
    reference_title: "Differential role of Rab proteins in ciliary trafficking: Rab23 regulates smoothened levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of Rab23 or expression of dominant-negative Rab23 decreased the ciliary
      steady state specifically of Smoothened but not EB1 or Kim1
    explanation: >-
      The first of the two results pointing away from de-repression, with its own
      internal controls.
  - reference: PMID:40825043
    reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Rab23-KO neural progenitor cells show perturbed ciliation and desensitized to
      primary cilium-dependent activation of the Hedgehog signaling pathway
    explanation: >-
      The second, in a disease-relevant cell type and from a study designed around this
      disorder.
  - reference: PMID:40825043
    reference_title: RAB23 loss-of-function mutation causes context-dependent ciliopathy in Carpenter syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab23-CKO mutants reveal cell-type specific ciliary abnormalities in chondrocytes,
      mouse embryonic fibroblasts, neural progenitor cells and neocortical neurons, but
      not in epithelial cells, cerebellar granule cells and hippocampus neurons.
    explanation: >-
      The cell-type map. Note that this study places cerebellar granule cells among the
      cell types with no ciliary abnormality, which is where the study proposing the
      dual-function resolution found one.
  - reference: PMID:34210780
    reference_title: Multifaceted Functions of Rab23 on Primary Cilium-Mediated and Hedgehog Signaling-Mediated Cerebellar Granule Cell Proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab23 represses the basal level of Shh signaling, while facilitating primary
      cilium-dependent extrinsic Shh signaling activation.
    explanation: >-
      The proposed resolution, stated by its authors: two separable functions, so losing
      RAB23 raises basal activity and impairs ligand-driven activation at the same time.
  - reference: PMID:34210780
    reference_title: Multifaceted Functions of Rab23 on Primary Cilium-Mediated and Hedgehog Signaling-Mediated Cerebellar Granule Cell Proliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab23-depleted GCPs exhibited upregulated basal level of Shh pathway activities
      despite showing an abnormal ciliogenesis of primary cilia.
    explanation: >-
      Both directions measured in one cell population, which is what makes this a
      resolution rather than a third conflicting report.
- discussion_id: phenotype_expansion_single_cases
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are overgrowth with advanced bone age, epileptiform EEG changes, autistic features
    and chronic kidney disease part of the RAB23 phenotype, or coincidental findings in
    single patients?
  attaches_to:
  - phenotypes#Intellectual disability
  - genetic#RAB23 pathogenic variants
  rationale: >-
    Two recent reports propose extensions to the phenotype, each resting on one patient.
    One describes overgrowth with advanced bone age, epileptogenic EEG changes and
    autistic features in a patient with a novel missense allele, and attributes them to
    that allele. Another reports chronic kidney disease and calls the association
    unusual.

    None of these is curated as a phenotype here. Each rests on a single case; the
    overgrowth report explicitly contrasts its patient with a typical second patient from
    the same study, so the authors themselves treat it as atypical; and the disorder has
    no reported genotype-phenotype correlation, which makes attributing new features to a
    particular novel allele hard to sustain. Against that, the syndrome is rare enough
    that genuine features may only ever appear in single reports, so absence of
    replication is weak evidence of coincidence.

    What would settle it is systematic ascertainment - bone age, EEG and renal function
    in the assembled RAB23 cohort - rather than further case reports.
  evidence:
  - reference: PMID:34748996
    reference_title: Expansion of the phenotypic and mutational spectrum of Carpenter syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      overgrowth with advanced bone age, epileptogenic changes on electroencephalogram
      and autistic features
    explanation: >-
      The proposed new features, in the one patient they are reported in.
  - reference: PMID:34748996
    reference_title: Expansion of the phenotypic and mutational spectrum of Carpenter syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 presented with an atypical clinical presentation of Carpenter syndrome
    explanation: >-
      The authors' own framing of the case as atypical, which is why this is held open
      rather than curated.
  - reference: PMID:39040725
    reference_title: A Rare Case of Carpenter Syndrome and Its Unique Association With Chronic Kidney Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this case report highlights an unusual association of Carpenter syndrome with
      chronic kidney disease
    explanation: >-
      The renal claim, described by its own authors as unusual and as needing further
      exploration.
notes: >-
  Entity scope, and why this is a separate entry. Carpenter syndrome has two genetic
  forms, and this entry covers CRPT1 (RAB23), the common one. The repository already
  holds `MEGF8-Related_Carpenter_Syndrome` for CRPT2, whose own description states that
  MEGF8 acts through BMP-SMAD while RAB23 acts through FGF-ERK, "which is why CRPT1 and
  CRPT2 are curated separately". This entry fills the other half of that split and keeps
  the two pathographs mechanistically distinguishable rather than converging them on
  generic craniosynostosis nodes.

  Where the evidence comes from, and its limits. The gene-disease relationship and the
  phenotype frequencies are human. The suture mechanism - FGF10-FGFR1-pERK1/2, the
  osteoprogenitor proliferation, and the rescue - is entirely from one mouse study, and
  is graded MODEL_ORGANISM throughout. That matters more here than usual because of the
  viability mismatch recorded in the discussions: the mouse used had to be engineered to
  survive past the stage at which the classical null dies, so it is a modified system at
  exactly the point where mouse and human diverge.

  The ciliary arm rests on better-distributed evidence than the suture arm. It has two
  identified cargoes from independent cell-biological studies, and a study built around
  this disease that tests three vertebrate systems in parallel including patient-derived
  iPSCs. The human-cell result is the one worth knowing: within the same patients, neurons
  lose cilia while fibroblasts merely have shorter ones. Sampling the accessible cell type
  would have understated the defect.

  Phenotype frequencies. Counted frequencies (38/39 for cutaneous syndactyly) come from
  the 2024 CRPT2 series, which tabulates the cumulative CRPT1 literature as its
  comparator. Where only "almost universal" or "common" is available, the band follows
  that wording and each evidence explanation says so.

  Module conformance. Three nodes declare `conforms_to`. The Hedgehog node conforms to
  `ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction`, which independently
  carries the same GO:0007224 binding with the same DYSREGULATED modifier and for the same
  reason - the module describes the lesion as perturbing GLI activator/repressor balance
  rather than as a one-way change. The limb node conforms to
  `limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity
  Specification`, matching the sibling MEGF8 entry, which conforms its equivalent node to
  the same target.

  The ciliary node conforms to `ciliopathy_dysfunction#Basal Body and Transition Zone
  Dysfunction`, and that one needs a word because it is not an obvious fit. The module
  node's own list of gene classes - basal body, transition zone, BBSome, IFT components -
  does not include RAB23, which is a trafficking GTPase and not a structural component of
  any of them. What matches is the lesion the module node actually describes: a
  structurally present but functionally incompetent cilium that cannot correctly
  compartmentalize signalling machinery, bound to GO:0061512. That is precisely what the
  Smoothened and Kif17 results show for RAB23, so this is a substitution at the level of
  the component rather than a mismatch of mechanism.

  Pathograph connectivity, and what the edges into obesity, cardiac defects and umbilical
  hernia do and do not claim. Every phenotype is reachable from the RAB23 variant node,
  but three of those edges are weaker than the rest and are marked
  INDIRECT_UNKNOWN_INTERMEDIATES for a reason that goes beyond missing detail: no cited
  source traces any step between Hedgehog signalling and adiposity, cardiac morphology or
  umbilical closure in this disorder. What licenses the edges is that these are cardinal
  features of a syndrome whose cause is that pathway lesion - the same standard already
  applied to cryptorchidism. Read them as "belongs to this disease's malformation
  complex", not as "caused through this node by a known route".

  Obesity is the most pointed of the three. The gene-discovery paper offered RAB23 as "a
  new molecular target for studies of obesity", and on this literature that invitation has
  not been taken up: no metabolic or hypothalamic measurement in a RAB23 patient is
  reported anywhere in the sources cited here. The edge records the proposal, in the
  authors' own deliberately weak phrasing, and nothing more.

  Cardiac defects have one suggestive route rather than none: laterality defects are
  reported in RAB23 patients, and left-right patterning is Hedgehog- and Nodal-dependent.
  That is also the discriminator against MEGF8-related CRPT2, where laterality defects are
  frequent rather than rare.

  On whether obesity belongs on the ciliary node instead. The module this entry now
  conforms to has a node - `Hypothalamic Ciliary Signaling and Metabolic Dysfunction` -
  that is a properly specified route from a ciliary lesion to obesity, via leptin receptor
  trafficking in hypothalamic neurons. It is the mechanism Bardet-Biedl syndrome uses, and
  this entry does quote a study concluding that Carpenter syndrome is a ciliopathy. So the
  question is fair. The edge is nonetheless left on the Hedgehog node, because that is
  where the only citation puts it: the gene-discovery paper proposed the Hedgehog
  connection, and nothing in this literature reports a hypothalamic, leptin or metabolic
  measurement in a RAB23 patient. Moving the edge would swap a weakly cited attribution
  for an uncited but better-sounding one, which is the worse trade. If someone measures
  leptin signalling in these patients, the ciliary node is where the edge should go.

  Facies. Now curated as depressed nasal bridge, low-set ears and proptosis. An earlier
  version of this note declined to curate them, on the stated ground that "the only source
  in this entry that describes the face is a single case report". That was wrong, and
  wrong in a way worth recording: PMID:23599695 was already cached and already cited twice
  here, and its full text carries a disease-level statement of the facies plus two
  siblings examined individually. The survey behind the decision had missed a source the
  entry was already using, which is a worse failure than the omission it justified.

  Only proptosis has a nameable intermediate - shallow orbits following the altered
  calvarial growth - so it hangs off the osteogenic node. The nasal bridge and the ears
  sit with the rest of the malformation complex, on the pathway node with unknown
  intermediates.

  Terms where the specific one was wrong or absent. The corneal finding is bound to
  HP:0000481 Abnormal cornea morphology, not to HP:0007957 Corneal opacity: the source
  says "corneal anomaly" and nothing more, and the narrower term would assert an opacity
  nobody reported. That identifier came from the deep-research report's phenotype table,
  whose own Term Validation section had flagged the label as inconsistent - a third
  provider identifier defect after the wrong MONDO and HGNC IDs, and the quietest of the
  three, since this one is a real term for a real concept that is simply narrower than
  the claim.

  In the other direction, the craniofacial surgery treatment keeps the generic NCIT:C15329
  Surgical Procedure deliberately. NCIT has no term for suture release or fronto-orbital
  advancement, and NCIT:C15214 Craniotomy is a different operation. Recorded so the
  question is not re-raised.

  GeneReviews. There is no chapter for this disorder, so there is no `references:` block
  and nothing to tag. Searched `RAB23[TI] GeneReviews[TI]`, `Carpenter syndrome AND
  GeneReviews[book]` and `RAB23 AND GeneReviews[book]`, all zero. The craniosynostosis
  chapters that do exist are FGFR-related - Apert, Crouzon, Pfeiffer, Muenke and an FGFR
  Craniosynostosis Syndromes Overview - and none covers the RAB23 entity. Recorded so the
  search is not repeated.

  Not asserted. No mechanism is claimed for the adipose phenotype at any level. No
  clinical trials, datasets or disease-modifying treatment are recorded, because none is
  reported in this literature.
  The pERK1/2 inhibition result is deliberately curated as a model rescue rather than as
  a treatment: it is a prophylactic mouse experiment with no human counterpart.

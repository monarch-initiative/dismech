name: RAB23-related Carpenter Syndrome
creation_date: "2026-09-01T14:07:00Z"
description: >-
  RAB23-related Carpenter syndrome (Carpenter syndrome 1, CRPT1, acrocephalopolysyndactyly
  type II) is an autosomal recessive developmental disorder caused by biallelic
  loss-of-function variants in RAB23, a small GTPase that acts as a negative regulator
  of Hedgehog signalling and participates in protein traffic to the primary cilium. It
  is the common form of Carpenter syndrome; the rarer CRPT2 is caused by MEGF8, the
  other negative regulator of the same pathway. The cardinal features are multi-suture
  craniosynostosis, polysyndactyly, obesity, cardiac defects and intellectual
  disability. Mouse work locates the craniosynostosis mechanism more precisely than
  Hedgehog de-repression alone: Rab23-null sutures show elevated FGF10-driven FGFR1
  signalling with a consequent imbalance in MAPK, Hedgehog signalling and RUNX2
  expression, and pharmacological inhibition of the raised pERK1/2 normalises
  osteoprogenitor proliferation and prevents the craniosynostosis. A striking species
  difference frames the interpretation of any model: nonsense Rab23 alleles in mice
  are embryonic lethal with neural tube defects, whereas human RAB23 null homozygotes
  survive to present with Carpenter syndrome.

  Two further findings complicate the simple account. The ciliary defect is real but
  conditional: across a conditional knockout mouse, patient-derived iPSCs and zebrafish,
  cilia are disturbed in chondrocytes, fibroblasts, neural progenitors and neocortical
  neurons but not in epithelial cells, cerebellar granule cells or hippocampal neurons,
  and within one patient the neurons lose cilia while the fibroblasts merely have shorter
  ones. And the direction of the Hedgehog effect is unsettled: RAB23 depletion lowers
  ciliary Smoothened, and RAB23-null progenitors respond less to Hedgehog, not more. Both
  are reduced pathway output rather than release from repression, so this entry records
  the pathway as dysregulated instead of asserting a direction.

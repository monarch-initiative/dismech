    the one family where brain imaging was reported for every child. It is the finding
    with the most direct management consequence in this entry, since it is what a
    ventriculoperitoneal shunt is placed for, and it also bears on the interpretation of
    the intracranial pressure that drives the timing of craniofacial surgery.

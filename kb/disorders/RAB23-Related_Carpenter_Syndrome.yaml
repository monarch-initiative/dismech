- name: Abnormal heart morphology
  category: Clinical
  description: >-
    Congenital cardiac defects, listed among the cardinal features of the syndrome. Where
    a specific lesion is named in the cited literature it is Tetralogy of Fallot, and a
    complex heart defect has also been seen prenatally on ultrasound.

    The defects are surgically correctable and patients reach adulthood, but they are not
    thereby finished with: residual lesions progress, and in one reported pregnancy the
    combination of that progression with the haemodynamic load of pregnancy was the main
    difficulty in care. The phenotype is therefore lifelong rather than neonatal.
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  frequency: FREQUENT
  evidence:
  - reference: PMID:17503333
    reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      craniosynostosis, polysyndactyly, obesity, and cardiac defects
    explanation: >-
      Cardiac defects among the cardinal features.
  - reference: PMID:21412941
    reference_title: "Carpenter syndrome: extended RAB23 mutation spectrum and analysis of nonsense-mediated mRNA decay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      but further evidence for laterality defects is reported
    explanation: >-
      Laterality defects do occur in RAB23 patients, which matters here because
      left-right patterning is Hedgehog- and Nodal-dependent and is one route by which a
      Hedgehog regulator could reach cardiac morphology. Rare in RAB23 and frequent in
      MEGF8, so it is also the discriminator between the two Carpenter genotypes.

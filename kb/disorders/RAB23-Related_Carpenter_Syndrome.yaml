- name: Hedgehog Signalling Dysregulation
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_scale: CELLULAR
  description: >-
    RAB23 antagonises Sonic hedgehog signalling, so its loss releases the pathway from
    negative regulation. This was the first mechanism proposed for Carpenter syndrome
    and was itself surprising, because craniosynostosis is not typically caused by
    variants in other Hedgehog pathway components. Mouse work later showed that the
    Hedgehog change in the suture is one arm of a broader signalling imbalance rather
    than the whole story.

    The classical genetics says de-repression, and the cell biology does not
    straightforwardly agree. Two results point the other way: depleting RAB23 lowers
    ciliary Smoothened, and RAB23-knockout neural progenitors are desensitized to
    cilium-dependent Hedgehog activation. Smoothened is the pathway's transducer, so less
    of it in the cilium and a blunted response to ligand are reduced output, not release
    from repression. This node is named for the dysregulation rather than for a direction
    because of that: an earlier name asserting de-repression would have contradicted the
    node's own modifier.

    The proposed reconciliation is that RAB23 does two separable things. It represses
    basal pathway activity, and it also facilitates activation by ligand through the
    cilium. Both were measured in one cell population: Rab23-depleted cerebellar granule
    cell precursors have a raised basal Shh signal and a blunted response to Shh ligand
    and to a Smoothened agonist. Losing RAB23 therefore raises the floor and lowers the
    ceiling, and the classical genetics and the trafficking work are each reporting one of
    those.

    This is why the pathway modifier is DYSREGULATED rather than INCREASED. On the
    dual-function reading that is not a refusal to commit but the accurate description:
    the pathway is deranged in two directions at once, and which one dominates in the
    cranial suture has not been measured.
  biological_processes:
  - preferred_term: negative regulation of smoothened signaling pathway
    term:

      Because mental retardation is not an invariable feature of this syndrome or other
      craniosynostosis syndromes, neuroradiologic examination may help in predicting the
      intellectual outcome in these patients.
    explanation: >-
      Cited as REFUTE against treating intellectual disability as a constant of the
      syndrome. The same sentence carries the prognostic point: imaging, not the
      diagnosis, is what indicates the likely outcome.
  - reference: PMID:20358613
    reference_title: RAB23 mutation in a large family from Comoros Islands with Carpenter syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mental development was normal in all four children
    explanation: >-
      Four affected siblings homozygous for one allele, none with intellectual
      disability. The strongest single counterexample in this literature, because it
      holds genotype constant.
genetic:
- name: RAB23 pathogenic variants
  gene_term:
    preferred_term: RAB23
    term:
      id: hgnc:14263
      label: RAB23
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants, predominantly truncating. The original mapping study found five
    distinct alleles across fifteen families, four truncating and one missense, with the
    nonsense allele L145X homozygous in ten patients on a shared haplotype - a founder
    effect in individuals of northern European descent. Point mutations characterised
    since (M12K, C85R, Y79del) fall within the GTPase domain. Y79del has been solved
    crystallographically and distorts the switch II region, supporting loss of function
    as the mechanism for missense and in-frame alleles as well as for the truncating
    ones. No `functional_impact_category` is recorded on this entry because the schema
    places that slot on variant-level genetic context rather than on the gene-level
    record; the loss-of-function conclusion is stated here and evidenced below.
  evidence:
  - reference: PMID:17503333
    reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping, we found linkage to chromosome 6p12.1-q12 and, in 15
      independent families, identified five different mutations (four truncating and one
      missense) in RAB23
    explanation: >-
      The gene discovery and the allele spectrum in the founding series.
  - reference: PMID:39615683
    reference_title: Structural basis for Rab23 activation and a loss-of-function mutation in Carpenter syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Several clinical point mutations, for example, M12K, C85R, and Y79del, have been
      found to occur within the GTPase domain.
    explanation: >-
      Locates the characterised point mutations within the functional domain.
  - reference: PMID:39615683
    reference_title: Structural basis for Rab23 activation and a loss-of-function mutation in Carpenter syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      thus leading to a loss-of-function and the development of Carpenter syndrome
    explanation: >-
      The structural study's conclusion that the mechanism is loss of function.
  variants:
  - name: RAB23 p.Leu145X
    description: >-
      The founder nonsense allele, homozygous in ten of the patients in the original
      mapping study and carried on a shared haplotype, indicating a founder effect in
      individuals of northern European descent. It is the single commonest cause of
      Carpenter syndrome.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: NONSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling in cranial-suture development and obesity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 10 patients, the disease was caused by homozygosity for the same nonsense
        mutation, L145X, that resides on a common haplotype, indicative of a founder
        effect in patients of northern European descent.
      explanation: >-
        The allele, its recurrence, and the founder-effect interpretation.
  - name: RAB23 p.Tyr79del
    description: >-
      An in-frame deletion within the GTPase domain and the only clinical allele solved
      crystallographically. It distorts the switch II region, the surface through which an
      activated Rab engages its effectors, which is how a single-residue deletion produces
      loss of function without removing the protein.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: DELETION
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: RAB23 effector binding
      description: >-
        Structural distortion of the switch II region, predicted to disrupt binding to
        interacting partners.
    evidence:
    - reference: PMID:39615683
      reference_title: Structural basis for Rab23 activation and a loss-of-function mutation in Carpenter syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we demonstrated that the Y79 deletion mutant exhibited structural distortions in
        the switch II region relative to that of the WT.
      explanation: >-
        The crystallographic result establishing how this allele impairs the protein.
  - name: RAB23 c.482-1G>A (p.Val161LeufsX3)
    description: >-
      A splice-acceptor variant that activates a cryptic site inside exon 5, deleting
      eight nucleotides and shifting the frame. It is curated because of where the
      resulting stop falls: late enough that the transcript is not simply degraded, but
      early enough to remove the C-terminal prenylatable cysteine. The protein is made and
      cannot be lipid-anchored to the membranes a Rab GTPase works on, which is a
      different route to loss of function from the nonsense alleles.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: SPLICE_SITE
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: RAB23 membrane association
      description: >-
        Loss of the C-terminal prenylation site, so the truncated protein is predicted not
        to associate with target membranes.
    evidence:
    - reference: PMID:23599695
      reference_title: A Novel Aberrant Splice Site Mutation in RAB23 Leads to an Eight Nucleotide Deletion in the mRNA and Is Responsible for Carpenter Syndrome in a Consanguineous Emirati Family.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This mutation affects the authentic mRNA splicing and activates a cryptic acceptor
        site within exon 5.
      explanation: >-
        The splicing consequence, demonstrated at the transcript level rather than
        predicted.
  - name: RAB23 c.481G>C (p.Val161Leufs*16)
    description: >-
      A substitution at the last base of exon 6 that causes the exon to be skipped,
      shifting the frame and creating a premature stop. It is curated as the allele of the
      one case with a documented prenatal picture, and as a second example of a coding
      substitution whose real consequence is on splicing rather than on the amino acid it
      appears to change.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25168863
      reference_title: Prenatal findings in carpenter syndrome and a novel mutation in RAB23.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequencing of RAB23 identified a homozygous mutation leading to skipping of exon 6
        and premature termination codon
      explanation: >-
        The allele and its splicing consequence.
  - name: RAB23 c.82C>T (p.Arg28*)
    description: >-
      A nonsense allele reported homozygous in the first molecularly confirmed case of
      Carpenter syndrome from continental Africa, with both parents shown to be carriers.
      It is curated as evidence that the disorder is not confined to the populations the
      founder allele comes from.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: NONSENSE
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33368989
      reference_title: Carpenter syndrome in a patient from Tanzania.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a previously described homozygous variant c.82C>T p.(Arg28*) was detected that
        results in a premature stop codon
      explanation: >-
        The allele and its homozygous state, with parental carrier testing reported in the
        same paper.
  - name: RAB23 c.86dupA
    description: >-
      A frameshift allele homozygous in four affected children of one Comorian family.
      This is the entry's clearest evidence that genotype does not fix phenotype here:
      with one allele held constant within a single family, craniosynostosis ranged from a
      cloverleaf skull to an isolated metopic ridge, hydrocephalus was present in two of
      four, and mental development was normal in all four.
    gene:
      preferred_term: RAB23
      term:
        id: hgnc:14263
        label: RAB23
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:20358613
      reference_title: RAB23 mutation in a large family from Comoros Islands with Carpenter syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report here on a RAB23 mutation (c.86dupA) present in the homozygote state in
        four relatives of Comorian origin with Carpenter syndrome.
      explanation: >-
        The allele and the family it segregates in.
    - reference: PMID:20358613
      reference_title: RAB23 mutation in a large family from Comoros Islands with Carpenter syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        intrafamilial variability was observed with variable severity of craniosynostosis

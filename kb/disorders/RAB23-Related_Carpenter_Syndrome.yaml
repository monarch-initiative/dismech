phenotypes:
- name: Craniosynostosis
  category: Clinical
  description: >-
    Premature fusion of cranial sutures, characteristically involving multiple sutures.
    The multi-suture pattern is one of the two features that clinically separates CRPT1
    from MEGF8-related CRPT2, in which a single midline suture is typical.
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core features of craniosynostosis, polysyndactyly and (in males)
      cryptorchidism are almost universal in both CRPT1 and CRPT2.
    explanation: >-
      "Almost universal" is the basis for the VERY_FREQUENT band.
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Craniosynostosis in CRPT2 commonly involves a single midline suture in comparison
      to the multi-suture craniosynostosis characteristic of CRPT1.
    explanation: >-
      The suture pattern that characterises this form, stated as the contrast with
      CRPT2.
- name: Cutaneous syndactyly
  category: Clinical
  description: >-
    Soft-tissue fusion of the digits, present in all but one of the reported CRPT1
    patients.
  phenotype_term:
    preferred_term: Cutaneous syndactyly
    term:
      id: HP:0012725
      label: Cutaneous syndactyly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cutaneous syndactyly is a universal feature in all cases of MEGF8-associated CRPT2
      to date (15/15 individuals, Supplementary Table 2) and is also near-universal in
      RAB23-associated CRPT1 (38/39 individuals)
    explanation: >-
      A counted frequency, 38 of 39, which places the band unambiguously.
- name: Polydactyly
  category: Clinical
  description: >-
    Supernumerary digits, typically preaxial in the feet, combining with the syndactyly
    to give the polysyndactyly that names the older designation acrocephalopolysyndactyly.
  phenotype_term:
    preferred_term: Polydactyly
    term:
      id: HP:0010442
      label: Polydactyly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38760421
    reference_title: The phenotype of MEGF8-related Carpenter syndrome (CRPT2) is refined through the identification of eight new patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core features of craniosynostosis, polysyndactyly and (in males)
      cryptorchidism are almost universal in both CRPT1 and CRPT2.
    explanation: >-
      Polysyndactyly is among the almost universal core features.
  - reference: PMID:8352858
    reference_title: Cerebral malformations in Carpenter syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      craniosynostosis, short fingers, soft tissue syndactyly, preaxial polydactyly,
      congenital heart disease, hypogenitalism, obesity, and umbilical hernia
    explanation: >-
      Specifies the polydactyly as preaxial, which is the description this phenotype's
      text rests on. Bound to the general HP:0010442 rather than to HP:0100258 (Preaxial
      polydactyly) because the near-universal frequency band comes from sources that
      count "polysyndactyly" without splitting it by ray, so a preaxial-specific binding
      would carry a frequency it has not been shown to have.
- name: Brachydactyly
  category: Clinical
  description: >-

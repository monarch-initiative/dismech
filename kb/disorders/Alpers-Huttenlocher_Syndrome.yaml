  - target: Epilepsia Partialis Continua
    description: Continuous focal motor seizure activity is a characteristic possible manifestation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/

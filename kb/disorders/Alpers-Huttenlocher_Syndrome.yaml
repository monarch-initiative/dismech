- name: Rapid Molecular Evaluation When POLG Disease Is Suspected
  description: In a child with early-onset epilepsy and features suggesting POLG disease, arrange prompt comprehensive genetic evaluation before considering valproate. Testing strategy and seizure treatment proceed with specialist input; a negative small founder panel or common-variant result does not safely exclude Alpers.
  action_category: DIAGNOSTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Rapid Molecular Evaluation When POLG Disease Is Suspected
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38860231
    reference_title: 'Evidence for sodium valproate toxicity in mitochondrial diseases: a systematic analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: clinicians should consider requesting rapid genomic testing in children with early-onset epilepsies where POLG-mitochondrial disease is a differential diagnosis, prior to commencing VPA.
    explanation: Systematic-review recommendation focused on suspected POLG disease.
- name: Individualized Non-Valproate Antiseizure Therapy
  description: Use specialist-led treatment matched to seizure type and clinical condition. The 2024 consensus generally follows standard epilepsy guidance for children older than 28 days and adults, with the POLG valproate contraindication and other patient-specific restrictions. Levetiracetam and several other ASMs are not generally contraindicated by mitochondrial disease alone, but this does not establish comparative Alpers efficacy. Lamotrigine may worsen myoclonus; topiramate warrants caution with renal tubular acidosis.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Individualized Non-Valproate Antiseizure Therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - &id003
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Many ASMs may be effective; none has been demonstrated effective specifically for this disorder.
    explanation: GeneReviews distinguishes individualized treatment from proven Alpers-specific efficacy.
  - reference: PMID:38576261
    reference_title: 'Management of seizures in patients with primary mitochondrial diseases: consensus statement from the InterERNs Mitochondrial Working Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: It is not contraindicated to use levetiracetam in adults and children with PMDs
    explanation: Safety consensus is not a disease-specific efficacy trial.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Treatment of epilepsy is similar to non-mitochondrial disease w/seizures. Lamotrigine may worsen myoclonic seizures.
    explanation: Seizure-type precaution.
  - reference: PMID:38576261
    reference_title: 'Management of seizures in patients with primary mitochondrial diseases: consensus statement from the InterERNs Mitochondrial Working Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Topiramate should be used with caution in patients with PMD who are at particular risk for renal tubular acidosis.
    explanation: Patient-specific metabolic precaution.
  target_mechanisms:
  - target: Recurrent Seizure Activity
    treatment_effect: MODULATES
    description: Antiseizure treatment aims to reduce seizure activity without repairing the POLG defect.
    evidence:
    - *id003
- name: Emergency Status Epilepticus Management
  description: Treat convulsive status urgently using local specialist protocols, including benzodiazepines, subsequent non-valproate ASMs and intensive-care escalation when necessary. Anesthetic selection, respiratory support and metabolic monitoring are individualized. Prolonged propofol requires close monitoring for infusion syndrome. Retrospective multidrug use does not establish the efficacy of any one agent.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Emergency Status Epilepticus Management
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - &id004
    reference: PMID:38576261
    reference_title: 'Management of seizures in patients with primary mitochondrial diseases: consensus statement from the InterERNs Mitochondrial Working Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: If the patient develops generalized, convulsive status epilepticus, management and when needed escalation to intensive care setting should follow the local status epilepticus guidelines (e.g., NICE Clinical Guidelines, SIGN guidelines, EFNS guidelines), except sodium valproate which is contraindicated in POLG patients
    explanation: Expert consensus supports prompt standard escalation with the genotype-specific exception.
  - reference: PMID:38576261
    reference_title: 'Management of seizures in patients with primary mitochondrial diseases: consensus statement from the InterERNs Mitochondrial Working Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Propofol should be closely monitored for prolonged use in the context of refractory status epilepticus due to the risk of propofol infusion syndrome
    explanation: Precaution applies to prolonged use, not a blanket prohibition.
  target_mechanisms:

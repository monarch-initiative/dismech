- name: Developmental Regression
  category: Neurological
  description: Loss of acquired motor, language or cognitive skills has variable timing and can accelerate during illness or severe seizures. Prior development is not always normal.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:

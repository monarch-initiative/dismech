      explanation: Link denotes the intended clinical target and explicitly uncertain benefit.
- name: Hepatic and Metabolic Monitoring
  description: Assess liver enzymes and synthetic/metabolic function approximately every three months or as clinical circumstances require, with more frequent assessment during deterioration or after medication changes. GeneReviews suggests liver enzymes every 2–4 weeks after introducing a new ASM. Monitoring detects complications; it does not itself reverse hepatocyte injury.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Hepatic and Metabolic Monitoring
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

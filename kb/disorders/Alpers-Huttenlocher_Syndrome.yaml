      reference_title: DNA polymerase gamma mutations that impair holoenzyme stability cause catalytic subunit depletion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In contrast, mPOLγB was unable to efficiently block degradation of mPOLγAA449T and the levels of the mutant protein decreased significantly over the time of the experiment
      explanation: Direct proteolysis assay; free mutant and free wild-type proteins were degraded at similar rates.
  cellular_components:

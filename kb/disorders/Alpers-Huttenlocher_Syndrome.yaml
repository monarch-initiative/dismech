      directness: INDIRECT
      snippet: In some instances, the initial seizure type is epilepsia partialis continua (EPC), a classic motor seizure type that involves only one portion of the body (e.g., a limb) with constant and repetitive myoclonic jerking, continuing for hours or days with or without dramatic effects on consciousness.

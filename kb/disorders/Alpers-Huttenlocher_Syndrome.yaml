    explanation: Background acknowledges genetically heterogeneous historical clinical usage.
- name: Leigh syndrome
  description: Leigh syndrome can share developmental regression, motor signs and epilepsy. Brainstem and deep-gray involvement often precede cortical lesions, whereas Alpers commonly begins with cortical injury. Molecular testing resolves overlapping cases.
  distinguishing_features:
  - Typical lesion sequence and distribution differ, but neither pattern is fully specific.

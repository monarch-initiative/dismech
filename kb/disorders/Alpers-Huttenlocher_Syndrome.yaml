      label: Developmental regression
  notes: 'Live registry checked 2026-09-21: recruiting, estimated total enrollment 200 for the broader protocol. The 2026 POLG publication documents an amended upper age limit of 60 years and treatment duration up to 60 months; the cached brief registry summary still says children 0–18 years. The 2024 and 2026 papers are overlapping reports. One-tailed exploratory analyses, changing denominators, unblinded assessments, missing biomarker measurements, cointerventions and survivor selection constrain causal inference. GDF-15 is not a direct mtDNA-rescue measurement. Pediatric quality-of-life scores alone were not significantly improved in the 2026 report; its positive pooled result normalized different pediatric/adult instruments.'

      directness: INDIRECT
      snippet: As AHS evolves, neuroimaging shows gliosis (initially more pronounced in occipital lobe regions) and generalized brain atrophy.
      explanation: Anatomical inference combined with the separately documented visual phenotype.
  - target: Spasticity
    description: Progressive cortical/corticospinal dysfunction contributes to spasticity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

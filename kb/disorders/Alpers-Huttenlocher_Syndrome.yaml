- name: 'Deoxycytidine and Deoxythymidine: Clinical Investigation'
  description: Enteral deoxycytidine/deoxythymidine is being studied in recessive POLG disease. An initial 10-person report, including six Alpers participants, was followed by a 25-person mixed-POLG report from the same open-label program. Disease-scale and seizure improvements warrant further study, but unblinded assessment, cointerventions, missing observations and survival selection preclude a proven Alpers-specific benefit. Diarrhea sometimes required dose reduction; five deaths in the expanded cohort mean that absence of attributed serious drug toxicity is not proof of safety. This remains investigational for POLG disease, distinct from treatment of TK2 deficiency.

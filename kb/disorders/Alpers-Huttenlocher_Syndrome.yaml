  description: MIT-E was a randomized placebo-controlled phase 2/3 study of vatiquinone in mitochondrial disease with refractory epilepsy, including Alpers among eligible conditions. Sixty-eight participants were randomized (34 per arm). The posted 24-week primary motor-seizure analysis did not demonstrate a statistically significant benefit (P = 0.173; reported between-arm median difference -8.31 percentage points, 95% CI -31.3 to 16.4). These are mixed-disease results, not an Alpers-specific efficacy estimate. The trial was terminated by sponsor decision.

      snippet: Loss of neurologic function culminates in dementia, spastic quadriparesis from corticospinal tract involvement, visual loss, and death.
      explanation: Clinical-neuropathological synthesis; treatment sedation and seizures also affect function.
  - target: Cortical visual impairment
    description: Occipital cortical injury can compromise vision.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

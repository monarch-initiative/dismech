    term:
      id: GO:0005739
      label: mitochondrion
- name: Increased Degradation of Unprotected POLG
  description: LONP1 degrades unprotected catalytic polymerase gamma in an ATP-dependent assay. The mutant difference is incomplete protection by POLG2 in the assembled mixture, not intrinsically faster degradation of free mutant protein. Additional proteases may contribute in vivo.
  biological_scale: MOLECULAR
  evidence:

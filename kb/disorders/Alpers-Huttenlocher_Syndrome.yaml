notes: >-
  Scope. This entry models Alpers-Huttenlocher syndrome, the early-onset severe
  end of the POLG-related disease continuum. It does not model the juvenile and
  adult POLG phenotypes (ataxia-neuropathy spectrum, progressive external
  ophthalmoplegia, MEMSA), which share the same gene and much of the same
  molecular mechanism but differ in age, tempo, prognosis and organ involvement.
  Those are better served by their own entries or by a POLG grouping; the
  GeneReviews chapter cited here treats them all as one continuum, and this entry
  deliberately takes only the early-onset segment of it.

  Why a drug is in the pathograph. The node for valproate-precipitated liver
  failure is not a treatment complication filed under adverse effects. It is a
  causal path that this disease routinely takes, it is reached through ordinary
  competent care rather than through error, and it changes the outcome. Modelling
  it as a pathophysiology node makes the iatrogenic arm queryable alongside the
  intrinsic one, which is the point. The corresponding treatment record is an
  avoidance rather than an administration, which is unusual but correct here.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance, at the excitation-inhibition node and
  at the recurrent-seizure node. The first of those was added on evidence rather
  than by default, and the reasoning is worth recording because it was initially
  decided the other way. The obvious objection is that the proximal lesion here
  is replicative and bioenergetic, not a channel or synaptic defect, so an
  excitation-inhibition claim looked like a category error. Quantitative
  post-mortem work settles it: the respiratory chain deficiency falls
  preferentially on inhibitory GABAergic interneurons, and those cells are
  depleted. Losing inhibitory neurons selectively is an excitation-inhibition
  imbalance in the most literal sense; the route to it happens to be metabolic
  rather than electrical, and the module node does not require a particular
  route. Conformance is still not claimed at the module's
  ion-channel-and-synaptic-dysfunction node, because nothing here implicates a
  channel.

  Sourcing note. Drafted from the primary literature, then cross-checked against
  a deep-research report generated with the falcon provider (Edison Scientific),
  committed as research/Alpers-Huttenlocher_Syndrome-deep-research-falcon.md. It
  contributed no snippets, but unlike the other entries in this batch it changed
  the entry materially, by pointing at a paper the first draft had missed.

  The first draft said flatly that the occipital predominance had no accepted
  explanation. That was wrong, or at least out of date. The report surfaced a
  quantitative post-mortem study of thirteen Alpers brains showing that the
  respiratory chain deficiency is not uniform across cortex but concentrated in
  inhibitory interneurons and pyramidal neurons of occipital cortex and in
  Purkinje cells, with those populations depleted. Fetching and verifying that
  source changed three things: the cortical node was rewritten around the
  cellular selectivity rather than around generic degeneration, module
  conformance at the excitation-inhibition node was added where the draft had
  explicitly declined it, and the occipital knowledge gap was narrowed from why
  this lobe to why these cells in this lobe. The same source supplied the ataxia
  phenotype, via the Purkinje cell arm.

  Two figures the report gives that this entry does not assert: that more than
  90% of classic cases are attributed to biallelic POLG variants, and the
  status-epilepticus burden from a 195-patient multinational cohort. Both come
  from full-text tables rather than from anything quotable in the abstracts
  fetched here, so they are left out rather than paraphrased into evidence.

  A cross-reference worth keeping. The occipital predominance of the epileptiform
  activity in this disease is curated as a knowledge gap. Two other entries in
  this knowledge base, Childhood_Occipital_Visual_Epilepsy and
  Photosensitive_Occipital_Lobe_Epilepsy, model occipital-onset epilepsies with
  no shared etiology whatsoever. Whether occipital cortex has a general
  vulnerability that these unrelated diseases all expose is a question none of
  the three entries can answer alone, and it is raised in the discussion here
  because this is the entry where the vulnerability is least explicable by
  anything local.
inheritance:
  - name: Autosomal recessive
    description: >-
      Biallelic pathogenic variants in POLG. Both alleles must be affected;
      heterozygous carriers do not develop the syndrome, although heterozygous
      POLG variation is separately and importantly associated with susceptibility
      to valproate-induced liver injury in people who do not have the disease at
      all.
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Molecular studies revealed homozygous p.R597W or p.A467T mutations in
          two patients. The other two patients showed compound heterozygous
          mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
        explanation: >-
          Four patients, two homozygous and two compound heterozygous, which is
          the biallelic pattern of autosomal recessive inheritance.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          If both parents are known to be heterozygous for a POLG pathogenic
          variant, each sib of an affected individual has at conception a 25%
          chance of inheriting biallelic pathogenic variants and being affected,
          a 50% chance of being heterozygous, and a 25% chance of inheriting
          neither of the familial POLG pathogenic variants.
        explanation: >-
          The GeneReviews recurrence-risk statement, which is the practical
          content of the inheritance mode for a family. The 25/50/25 split is
          what autosomal recessive means at the bedside, and it is stated here
          rather than left to be inferred from the mode alone.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Heterozygous sibs of a proband with an autosomal recessive POLG-related
          disorder are typically asymptomatic.
        explanation: >-
          Confirms that carriers do not have the syndrome, which is the claim this
          block makes and which has to be stated carefully here, because
          heterozygous POLG variation is separately associated with valproate
          hepatotoxicity risk. Asymptomatic for the disease is not the same as
          free of drug risk.
genetic:
  - name: POLG
    gene_term:
      preferred_term: POLG
      term:
        id: hgnc:9179
        label: POLG
    relationship_type: CAUSATIVE
    notes: >-
      POLG encodes the catalytic subunit of DNA polymerase gamma, which is the
      only polymerase that replicates mitochondrial DNA. That exclusivity is what
      makes the gene so consequential: there is no redundant enzyme to
      compensate. Recurrent pathogenic variants include p.A467T and p.R597W,
      found homozygous in reported cases, with compound heterozygosity common;
      p.Q1236H is the common variant implicated separately in valproate
      hepatotoxicity risk. Variants have been found in every ethnic group
      examined, which matters practically because it removes ancestry as a reason
      not to test.
    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Rare mutations in POLG, which codes for the mitochondrial DNA
          polymerase γ (polγ), cause Alpers-Huttenlocher syndrome (AHS).
        explanation: >-
          States the gene-disease relationship directly and names the enzyme the
          gene encodes.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG mutations have been observed in every ethnic group studied to
          date
        explanation: >-
          Supports the absence of an ancestry restriction, which is the basis for
          the testing recommendation not being limited by population.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Molecular studies revealed homozygous p.R597W or p.A467T mutations in
          two patients. The other two patients showed compound heterozygous
          mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
        explanation: >-
          Names the specific recurrent variants observed in patients who went on
          to develop valproate hepatotoxicity.
pathophysiology:
  - name: Biallelic Loss of DNA Polymerase Gamma Function
    biological_scale: MOLECULAR
    description: >-
      The proximal lesion. Both POLG alleles carry pathogenic variants, so the
      catalytic subunit of polymerase gamma is impaired in fidelity, processivity
      or abundance. Because polymerase gamma is the sole replicative polymerase
      of the mitochondrial genome, there is no backup enzyme, and the consequence
      of the lesion falls entirely on mitochondrial DNA rather than being buffered
      by the nuclear replication machinery.
    genes:
      - preferred_term: POLG
        term:
          id: hgnc:9179
          label: POLG
    molecular_functions:
      - preferred_term: DNA-directed DNA polymerase activity
        term:
          id: GO:0003887
          label: DNA-directed DNA polymerase activity
        modifier: DECREASED
    downstream:
      - target: Failure of Mitochondrial DNA Replication
    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Rare mutations in POLG, which codes for the mitochondrial DNA
          polymerase γ (polγ), cause Alpers-Huttenlocher syndrome (AHS).
        explanation: >-
          Establishes the causal relationship between loss of this specific
          enzyme and the syndrome.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          This was principally due to the p.Q1236H substitution which compromised
          polγ function in yeast.
        explanation: >-
          Functional demonstration in a model system that a POLG substitution
          compromises the enzyme, supporting loss of function as the mechanism
          rather than a purely statistical association.
  - name: Failure of Mitochondrial DNA Replication
    biological_scale: MOLECULAR
    description: >-
      Mitochondrial DNA is not a static archive; it turns over and must be
      continually re-replicated even in cells that never divide. With polymerase
      gamma impaired, replication cannot keep pace with that turnover, which is
      why a replication defect produces a quantitative loss of genome copies
      rather than only a mutational burden.
    biological_processes:
      - preferred_term: mitochondrial DNA replication
        term:
          id: GO:0006264
          label: mitochondrial DNA replication
        modifier: DECREASED
    downstream:
      - target: Tissue Mitochondrial DNA Depletion
    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Rare mutations in POLG, which codes for the mitochondrial DNA
          polymerase γ (polγ), cause Alpers-Huttenlocher syndrome (AHS).
        explanation: >-
          Names the enzyme as the mitochondrial DNA polymerase, which is what
          makes replication of that genome the process this node describes.
  - name: Tissue Mitochondrial DNA Depletion
    biological_scale: CELLULAR
    description: >-
      Loss of mitochondrial genome copy number in affected tissues, most
      prominently brain and liver. This is the feature that places the disease in
      the mitochondrial DNA depletion syndromes and gives the MONDO entity its
      molecular name. The tissue selectivity is not fully explained by energy
      demand alone, but brain and liver are where the clinical disease appears.
    locations:
      - preferred_term: liver
        term:
          id: UBERON:0002107
          label: liver
    cell_types:
      - preferred_term: hepatocyte
        term:
          id: CL:0000182
          label: hepatocyte
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    downstream:
      - target: Respiratory Chain Deficiency and Cellular Energy Failure
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG-related disorders comprise a continuum of overlapping phenotypes
          that were clinically defined before the molecular basis was known.
        explanation: >-
          Supports that a single molecular lesion underlies phenotypes that were
          separately described clinically. Marked PARTIAL because it establishes
          the shared molecular basis without quantifying depletion in specific
          tissues.
  - name: Respiratory Chain Deficiency and Cellular Energy Failure
    biological_scale: CELLULAR
    description: >-
      Because the mitochondrial genome encodes core subunits of the respiratory
      chain, losing genome copies means losing the capacity to build those
      complexes, and oxidative phosphorylation falls. The cells that decompensate
      first are the ones with the least metabolic slack, which is the general
      explanation for why a systemic replication defect presents as a brain and
      liver disease.
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
      - preferred_term: hepatocyte
        term:
          id: CL:0000182
          label: hepatocyte
    downstream:
      - target: Selective Interneuron and Pyramidal Neuron Loss in Occipital Cortex
      - target: Hepatocellular Dysfunction and Failure
      - target: Progressive Developmental Regression
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG-related disorders can therefore be considered an overlapping
          spectrum of disease presenting from early childhood to late adulthood.
        explanation: >-
          Supports a shared underlying mechanism expressed across a range of
          severities and ages. Marked PARTIAL because the abstract does not
          itself measure respiratory chain function.
  - name: Selective Interneuron and Pyramidal Neuron Loss in Occipital Cortex
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    description: >-
      The energy failure does not fall evenly on the cortex, and quantitative
      post-mortem work says where it lands. In the largest series of Alpers
      brains examined this way, severe respiratory chain deficiency involving
      complex I, and to a lesser extent complex IV, was found in inhibitory
      interneurons and pyramidal neurons of the occipital cortex and in cerebellar
      Purkinje cells, with reduced densities of those same populations. That is
      the mechanistic content behind the syndrome's otherwise puzzling occipital
      emphasis, and it is why this node conforms to the module's
      excitation-inhibition node rather than only to a generic degeneration:
      losing inhibitory interneurons preferentially is an
      excitation-inhibition imbalance in the most literal sense, arrived at
      through bioenergetic failure instead of through a channel defect. The same
      finding accounts for the cerebellar signs, since Purkinje cells are the sole
      output of the cerebellar cortex. The classical description of the disease as
      a progressive sclerosing poliodystrophy refers to this grey-matter loss.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
      - preferred_term: cerebellar cortex
        term:
          id: UBERON:0002129
          label: cerebellar cortex
    cell_types:
      - preferred_term: inhibitory interneuron
        term:
          id: CL:0000099
          label: interneuron
      - preferred_term: GABAergic neuron
        term:
          id: CL:0000617
          label: GABAergic neuron
      - preferred_term: Purkinje cell
        term:
          id: CL:0000121
          label: Purkinje cell
    biological_processes:
      - preferred_term: mitochondrial ATP synthesis coupled electron transport
        term:
          id: GO:0042775
          label: mitochondrial ATP synthesis coupled electron transport
        modifier: DECREASED
    downstream:
      - target: Intractable Focal Epilepsy and Epilepsia Partialis Continua
    evidence:
      - reference: PMID:30021052
        reference_title: >-
          Dissecting the neuronal vulnerability underpinning Alpers' syndrome: a
          clinical and neuropathological study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Quantitative immunofluorescence showed severe respiratory chain
          deficiencies involving mitochondrial respiratory chain subunits of
          complex I and, to a lesser extent, complex IV in inhibitory interneurons
          and pyramidal neurons in the occipital cortex and in Purkinje cells of
          the cerebellum. Diminished densities of these neuronal populations were
          also observed.
        explanation: >-
          The quantitative post-mortem basis for every claim in this node: which
          complexes fail, which cell populations they fail in, that those
          populations include inhibitory interneurons, that the cortical site is
          occipital, and that the cells are actually lost rather than merely
          impaired.
      - reference: PMID:30021052
        reference_title: >-
          Dissecting the neuronal vulnerability underpinning Alpers' syndrome: a
          clinical and neuropathological study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We believe interneuron and Purkinje cell pathology underpins the
          clinical development of seizures and ataxia seen in Alpers' syndrome.
        explanation: >-
          The authors' own causal reading, which is what licenses this node's
          downstream edge to the epilepsy and its conformance to the
          excitation-inhibition node of the module. Their framing is a belief
          rather than a demonstration, which the discussion below preserves.
      - reference: PMID:30021052
        reference_title: >-
          Dissecting the neuronal vulnerability underpinning Alpers' syndrome: a

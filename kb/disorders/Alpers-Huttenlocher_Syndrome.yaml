- name: Careful Management of Refractory EPC
  description: Balance seizure reduction against sedation, aspiration and ventilatory failure. Persistent EPC can be impossible to abolish, so escalating medication indefinitely may impose greater burden than benefit.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Careful Management of Refractory EPC
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Refractory epilepsy, esp EPC, may be impossible to control w/any treatment. In persons w/EPC, use of high-dose ASM may control the clinical seizures, but assoc obtundation &#x00026; subsequent risk of aspiration &#x00026; ventilatory failure may outweigh the benefit.
    explanation: Alpers-specific risk-benefit guidance.
  target_mechanisms:
  - target: Epilepsia Partialis Continua
    treatment_effect: MODULATES
    description: Individualized symptomatic management accounts for both seizure burden and treatment toxicity.
    evidence:
    - *id003
- name: Selected Adjuncts for Refractory Epilepsy
  description: Ketogenic diet or neuromodulation may be considered by specialist teams where appropriate, but Alpers-specific efficacy is unproven. In the 2024 mixed POLG status cohort, only 2/13 diet-treated patients reported benefit and both had juvenile/adult-onset disease; VNS was not used. Late rescue use and confounding prevent a definitive negative efficacy conclusion. Immunomodulatory therapies likewise lack demonstrated benefit for Alpers status.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Selected Adjuncts for Refractory Epilepsy
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The use of other treatments for refractory epilepsy, such as corticotropin or prednisone, ketogenic diet, and intravenous immunoglobulin G, are unproven in the treatment of AHS.
    explanation: Review clearly separates investigational adjuncts from proven therapy.
  - reference: PMID:38822839
    reference_title: 'Status epilepticus in POLG disease: a large multinational study.'

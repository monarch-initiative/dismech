biochemical:
  - name: Blood and cerebrospinal fluid lactate
    presence: INCREASED
    context: >-
      Raised lactate is the expected consequence of a respiratory chain that
      cannot accept electrons fast enough, so pyruvate is shunted to lactate
      instead. It is useful as a pointer rather than as a test: it was elevated in
      blood in only about three-fifths of an early-onset cohort at presentation
      and in cerebrospinal fluid in fewer still, so a normal lactate does not
      exclude the disease. It is measured here as a marker of the bioenergetic
      node upstream, not as a diagnostic criterion.
    biomarker_term:
      preferred_term: lactate
      term:
        id: CHEBI:24996
        label: lactate
    evidence:
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Laboratory investigations at presentation revealed increased lactate in
          blood in 60% ( n = 12/20) and in cerebrospinal fluid in 40% ( n = 2/5).
        explanation: >-
          Quantifies the elevation and, just as importantly, its limits: 12 of 20
          in blood means a normal value is common enough that lactate cannot rule
          the disease out.
  - name: Hepatic aminotransferases
    presence: INCREASED
    context: >-
      Transaminase elevation is the laboratory face of the hepatic arm and was
      present in most of an early-onset cohort at presentation. It is also the
      measure that surveillance tracks, which is why it appears both here and in
      the liver-enzyme monitoring treatment record.
    evidence:
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hepatic aminotransferases were increased in 13/20 cases
        explanation: >-
          Gives the proportion with elevated transaminases at presentation in the
          early-onset cohort.
histopathology:
  - name: Characteristic Alpers liver histopathology
    description: >-
      Liver biopsy or post-mortem histology shows a recognized constellation
      rather than a single lesion: microvesicular steatosis, bile ductular
      proliferation, hepatocyte dropout, bridging fibrosis or cirrhosis, collapse
      of liver cell plates, disturbed lobular architecture, regenerative nodules,
      and oncocytic change in hepatocytes spared by the steatosis. Two of these
      features together form part of the diagnostic criteria for the syndrome,
      which is why this is curated as diagnostic rather than descriptive.
    diagnostic: true
    evidence:
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Diagnostic criteria for Alpers syndrome include characteristic liver
          histopathological changes, namely two of the following: microvesicular
          steatosis, bile ductular proliferation, hepatocyte dropout
        explanation: >-
          States the two-of-the-following rule and the first several features,
          which is what makes this a diagnostic criterion rather than an
          incidental finding. The quote stops short of the full list because the
          cached full text line-wraps cirrhosis across a hyphen, so the remaining
          features are given in the description rather than quoted.
prevalence:
  - population: Worldwide
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      No population rate is available for Alpers-Huttenlocher syndrome
      specifically in the sources cited here. Orphanet classifies the entity as
      rare. What the literature does establish is that POLG variants are not
      confined to any ancestry group, which bears on testing policy even though it
      does not give a rate. The prevalence_class is therefore the qualitative RARE
      tier rather than a numeric band.
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG mutations have been observed in every ethnic group studied to
          date
        explanation: >-
          Supports the absence of an ancestry restriction. Marked PARTIAL because
          it constrains the distribution without providing a rate.
progression:
  - phase: Onset with regression and intractable seizures
    age_range: Early childhood
    notes: >-
      The neurological presentation usually precedes the hepatic one. A previously
      normal child begins to lose skills and develops seizures that do not respond
      to medication, often escalating to epilepsia partialis continua.
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All were given VPA due to intractable partial seizures. Three of the
          patients had developed epilepsia partialis continua.
        explanation: >-
          Documents the seizure phenotype at the point of presentation, before
          liver involvement had declared itself.
  - phase: Hepatic failure, spontaneous or valproate-precipitated
    age_range: Weeks to months after the neurological presentation
    notes: >-
      Liver failure completes the triad. Where valproate has been given, the
      interval from exposure to failure has been two to three months. The early
      onset group carries the worst prognosis of the POLG continuum.
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The time from VPA exposure to liver failure was between 2 and 3 months.
          Liver failure was reversible in one patient.
        explanation: >-
          Gives the observed interval and the exceptional case of reversibility.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Early-onset disease (prior to age 12 years): Liver involvement, feeding
          difficulties, seizures, hypotonia, and muscle weakness are the most
          common clinical features. This group has the worst prognosis.
        explanation: >-
          Establishes that the early-onset group modelled here has the worst
          prognosis of the POLG spectrum.
  - phase: Death, usually in early childhood
    age_range: Median about sixteen months from birth, about five months from onset
    notes: >-
      The disease is fatal and it is fatal quickly. In an early-onset cohort the
      median age at death was under a year and a half, and the median interval
      from first symptom to death was about five months, with earlier onset
      predicting shorter survival. Liver failure is the leading cause of death,
      ahead of sepsis and status epilepticus, which is why an entry organized
      around an epilepsy carries its prognosis on the hepatic arm.
    evidence:
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Median age at death was 15.8 months (range 1.0 to 184.6 months), whereas
          median time from disease onset to death was 4.9 months (range 0.5 to
          181.2 months).
        explanation: >-
          Gives both survival measures. The very wide ranges are worth noting:
          the median describes the early-onset centre of the distribution, not
          every patient.
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The main causes of death were liver failure (13/22), sepsis (5/22), and
          status epilepticus (4/22).
        explanation: >-
          Ranks the causes of death, putting liver failure well ahead of the
          neurological one, which is the empirical basis for treating the hepatic
          arm as prognosis-determining.
      - reference: PMID:28471437
        reference_title: >-
          The clinical spectrum and natural history of early-onset diseases due to
          DNA polymerase gamma mutations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Median survival time of patients with disease onset ≤ 12 months was 3.6
          months ( range 0.5 –181) compared to 10 months (range 1.4–82) for those
          with disease onset
        explanation: >-
          Shows that earlier onset predicts shorter survival within the
          early-onset group itself, which sharpens the age-phenotype correlation
          the GeneReviews chapter states at spectrum level.
treatments:
  - name: Avoidance of Sodium Valproate
    description: >-
      The single most consequential management decision in this disease, and it
      is a decision not to treat with a particular drug rather than to treat with
      one. Valproate can precipitate fatal liver failure at any stage of the
      illness, so the avoidance is absolute rather than dose-limited or
      stage-limited. Because the seizures that prompt valproate are exactly the
      seizures this disease produces, the avoidance only works if the diagnosis is
      suspected before the prescription is written, which is what makes the
      testing question in the discussions a clinical rather than an academic one.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Valproate-Precipitated Fulminant Hepatic Failure
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          VPA dosing at any stage of Alpers-Huttenlocher syndrome can precipitate
          liver failure
        explanation: >-
          The direct basis for the avoidance, and for its being unconditional on
          disease stage.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Agents/circumstances to avoid: Valproic acid (Depakene®) and sodium
          divalproate (divalproex) (Depakote®) because of the risk of
          precipitating and/or accelerating liver disease.
        explanation: >-
          The GeneReviews agents-to-avoid statement, which names both the drug
          and its salt form and gives the reason. This is the formal management
          recommendation behind this record, and it says accelerating as well as
          precipitating, which covers the patient who already has liver disease
          when the drug is considered.
  - name: Liver Enzyme Surveillance
    description: >-
      Because the hepatic arm can move fast and can be triggered by a new
      medication, monitoring is scheduled rather than reactive. Liver enzymes are
      followed every three months or as clinically indicated, and liver function
      is rechecked specifically after any new antiseizure medication is
      introduced. That last clause is the one that matters most here: it converts
      the general valproate warning into a standing check on every subsequent
      drug decision, in a disease where seizure control keeps forcing new drug
      decisions.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Hepatocellular Dysfunction and Failure
        treatment_effect: MODULATES
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          monitoring of liver enzymes every three months or as clinically
          indicated; monitoring of epilepsy with repeat liver function tests
          after introduction of any new anti-seizure medication.
        explanation: >-
          Gives both the routine interval and the event-triggered recheck after
          any new antiseizure medication, which is the specific surveillance
          behaviour this record asserts.
  - name: POLG Genotyping Before Valproate Exposure
    description: >-
      Genetic testing used as a preventive intervention rather than only as a
      diagnostic one. Sequencing POLG before starting valproate in a child with
      intractable seizures identifies those in whom the drug is dangerous, and the
      same logic extends beyond this syndrome: heterozygous POLG variation carries
      a substantially increased risk of valproate liver injury, with a reported
      odds ratio of 23.6, even in people who do not have the disease.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    target_mechanisms:
      - target: Valproate-Precipitated Fulminant Hepatic Failure
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          prospective genetic testing of POLG will identify individuals at high
          risk of this potentially fatal consequence of treatment
        explanation: >-
          States the preventive value of prospective genotyping in the authors'
          own terms.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Heterozygous genetic variation in POLG was strongly associated with
          VPA-induced liver toxicity
        explanation: >-
          Establishes that the risk extends to heterozygous carriers, which is the
          basis for extending testing beyond suspected Alpers-Huttenlocher
          syndrome. The reported odds ratio of 23.6 appears in the same sentence
          of the source, inside a parenthetical that is omitted from the quote.
  - name: Non-Valproate Antiseizure Therapy and Supportive Care
    description: >-
      Seizure control is attempted with agents other than valproate, alongside
      supportive management of the hepatic and neurological disease. Control is
      characteristically poor, which is what the word intractable in the phenotype
      is doing, and no therapy modifies the underlying replication defect.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Intractable Focal Epilepsy and Epilepsia Partialis Continua
        treatment_effect: MODULATES
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All were given VPA due to intractable partial seizures.
        explanation: >-
          Establishes that the seizures are intractable, which is what
          necessitates alternative agents. Marked PARTIAL because the source
          documents the intractability and the valproate exposure rather than the
          efficacy of alternatives.
diagnosis:
  - name: POLG Sequencing
    description: >-
      Molecular diagnosis by sequencing POLG. In this disease the test is
      time-critical in an unusual way: its value is greatest before treatment
      rather than after, because a result that arrives after valproate has been
      started may arrive after the damage.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Molecular studies revealed homozygous p.R597W or p.A467T mutations in
          two patients. The other two patients showed compound heterozygous
          mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
        explanation: >-
          Demonstrates sequencing as the diagnostic modality and the biallelic
          results it yields.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Establishing the diagnosis of a POLG-related disorder relies on
          clinical findings and the identification of biallelic POLG pathogenic
          variants on molecular genetic testing
        explanation: >-
          The GeneReviews diagnostic statement. It is worth noting that the
          diagnosis is defined as clinical findings plus biallelic variants
          together, not by genotype alone, which is why this entry keeps the
          electroclinical and hepatic features as part of the diagnostic picture
          rather than treating sequencing as sufficient on its own.
  - name: Electroencephalography
    description: >-
      Recording is used both to characterize the seizures and as a diagnostic
      clue, since early predominance of epileptiform discharges over the occipital
      region is common in POLG-related epilepsy. The findings vary between
      patients and between stages, so the occipital pattern supports the diagnosis
      when present but does not exclude it when absent.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          early predominance of epileptiform discharges over the occipital region
          is common in POLG-induced epilepsy
        explanation: >-
          The diagnostic clue this record describes.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the EEG and MRI findings varying between patients and stages of the
          disease
        explanation: >-
          The caveat that limits the sensitivity of the finding, which is why the
          description says it supports but does not exclude.
differential_diagnoses:
  - name: MELAS Syndrome
    disease_term:
      preferred_term: MELAS syndrome
      term:
        id: MONDO:0010789
        label: MELAS syndrome
    description: >-
      The other mitochondrial disease that presents with seizures and posterior
      cortical involvement in a child, and which shares the occipital emphasis
      seen here. The distinction is mechanistic and inheritance-based: MELAS
      arises from a maternally inherited mitochondrial DNA point mutation, this
      syndrome from biallelic nuclear POLG variants causing depletion of the
      mitochondrial genome.
    distinguishing_features:
      - Maternally inherited mitochondrial DNA point mutation rather than autosomal recessive nuclear POLG variants.
      - Stroke-like episodes crossing vascular territories rather than epilepsia partialis continua.
      - Lactic acidosis and ragged-red fibres on muscle biopsy are characteristic.
      - Hepatic failure is not a defining feature.
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG-related disorders comprise a continuum of overlapping phenotypes
          that were clinically defined before the molecular basis was known.
        explanation: >-
          Supports that molecular definition is what separates these clinically
          overlapping mitochondrial presentations. Marked PARTIAL because the
          source addresses the POLG spectrum rather than comparing it with MELAS
          directly.
  - name: Rasmussen Subacute Encephalitis
    disease_term:
      preferred_term: Rasmussen subacute encephalitis
      term:
        id: MONDO:0016019
        label: Rasmussen subacute encephalitis
    description: >-
      The main non-metabolic cause of epilepsia partialis continua with cognitive
      decline in a child, and therefore the differential that matters at the
      bedside when a child presents with continuous focal seizures and is losing
      skills.
    distinguishing_features:
      - Unilateral hemispheric involvement with progressive hemiatrophy rather than a bilateral metabolic process.
      - Inflammatory histopathology with T-cell infiltrates and microglial nodules.
      - No hepatic involvement.
      - Immunotherapy and hemispherectomy are the treatment framework rather than avoidance of a hepatotoxic drug.
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG gene testing should be considered in any child or adolescent who
          presents or develops intractable seizures with or without status
          epilepticus or epilepsia partialis
        explanation: >-
          The recommendation is framed around exactly the presentation this
          differential shares, which is why POLG testing is proposed for the whole
          presenting syndrome rather than only for suspected cases.
  - name: Non-POLG Mitochondrial DNA Depletion Syndromes
    description: >-
      Hepatocerebral mitochondrial DNA depletion can also arise from variants in
      DGUOK, MPV17 and TWNK among others, producing a similar combination of
      liver and brain disease. Separation is by gene. No MONDO disease_term is
      bound because this names a group of separate entities rather than one.
    distinguishing_features:
      - Causative variants in a gene other than POLG.
      - Seizure phenotype is generally less prominent than in POLG disease, with liver disease often dominating.
      - Epilepsia partialis continua and the occipital electrographic predominance are not characteristic.
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG-related disorders can therefore be considered an overlapping
          spectrum of disease presenting from early childhood to late adulthood.
        explanation: >-
          Establishes the POLG-defined boundary of the spectrum this entry sits
          in. Marked PARTIAL because the source does not enumerate the other
          depletion-syndrome genes.
  - name: Juvenile and Adult POLG-Related Disorders
    description: >-
      The later-onset phenotypes caused by the same gene, including the
      ataxia-neuropathy spectrum, MEMSA, and progressive external
      ophthalmoplegia. These are not really a differential so much as the rest of
      the continuum this entry has carved a segment out of, and they are listed so
      the boundary is explicit. No MONDO disease_term is bound because several
      distinct entities are grouped here.
    distinguishing_features:
      - Onset after age 12 rather than in early childhood.
      - Peripheral neuropathy, ataxia and progressive external ophthalmoplegia dominate rather than the hepatocerebral triad.
      - Better prognosis than the early-onset group.
      - Hepatic failure is not a defining feature, though valproate sensitivity still applies.
    evidence:
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Juvenile/adult-onset form (age 12-40 years: Disease is typically
          characterized by peripheral neuropathy, ataxia, seizures, stroke-like
          episodes, and, in individuals with longer survival, progressive external
          ophthalmoplegia (PEO). This group generally has a better prognosis than
          the early-onset group.
        explanation: >-
          Describes the juvenile and adult phenotypes and their better prognosis,
          which is the boundary this entry's scope note draws.
discussions:
  - discussion_id: ahs_valproate_toxicity_mechanism
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      If valproate hepatotoxicity in POLG disease is not mediated through
      mitochondrial DNA depletion, mutation, or impaired fatty acid metabolism,
      what does mediate it, and is impaired liver regeneration sufficient to
      explain a fatal outcome?
    attaches_to:
      - "pathophysiology#Valproate-Precipitated Fulminant Hepatic Failure"
    rationale: >-
      The intuitive account of this toxicity is almost irresistible: the disease
      is a mitochondrial DNA depletion syndrome, valproate has known mitochondrial
      effects, so valproate must be making the depletion worse. That account was
      tested and it failed. Toxicity was found not to be mediated through
      mitochondrial DNA depletion, not through mutation, and not through a defect
      of fatty acid metabolism, which removes all three of the obvious routes at
      once. What was found instead was that valproate inhibits human cellular
      proliferation at therapeutic doses and causes non-apoptotic cell death at
      high ones, and the authors read this as implicating impaired liver
      regeneration. That is a coherent story but it leaves real gaps. It does not
      explain the tissue specificity, since valproate reaches many proliferating
      tissues and the liver is the one that fails. It does not obviously explain
      the two-to-three-month latency, which is long for a direct antiproliferative
      effect and might instead reflect the time taken to exhaust a regenerative
      reserve. And it sits awkwardly with the strength of the genetic association,
      an odds ratio above twenty for heterozygous variation, since a mechanism
      that is independent of the mitochondrial genome ought to explain why POLG
      genotype matters so much. Resolving this is not merely mechanistic
      housekeeping: if the mediator were identified, it might be possible to make
      valproate safe rather than merely to avoid it.
    proposed_experiments:
      - experiment_id: ahs_regeneration_challenge_model
        name: Regenerative challenge in a POLG-variant hepatocyte model
        description: >-
          Partial-hepatectomy-style regenerative challenge, or its in-vitro
          equivalent using proliferation after controlled injury, in hepatocyte
          models carrying the recurrent POLG variants against isogenic controls,
          with and without valproate at therapeutic concentrations, measuring
          regenerative capacity rather than baseline viability.
        decision_criterion: >-
          A selective failure of regeneration in POLG-variant cells under
          valproate, with preserved baseline viability, would confirm impaired
          regeneration as the mediator. Equivalent regenerative failure regardless
          of POLG genotype would indicate the genotype acts through something
          else.
      - experiment_id: ahs_tissue_specificity_comparison
        name: Comparison of valproate antiproliferative effect across tissue lineages
        description: >-
          Parallel measurement of valproate's antiproliferative effect in
          hepatocyte, intestinal epithelial and haematopoietic progenitor models
          carrying the same POLG variants, testing whether the liver is uniquely
          sensitive or merely uniquely exposed.
        decision_criterion: >-
          Selective hepatocyte sensitivity would support a liver-specific
          mechanism and direct the search there. Comparable sensitivity across
          lineages would indicate the clinical liver specificity comes from
          exposure, first-pass concentration, or regenerative demand rather than
          from cellular susceptibility.
      - experiment_id: ahs_latency_reserve_modelling
        name: Testing whether latency reflects exhaustion of regenerative reserve
        description: >-
          Serial measurement of hepatic regenerative and functional markers from
          the start of valproate exposure in children with known POLG variants who
          require the drug's continuation for compelling reasons, or in a suitable
          animal model, to determine whether the two-to-three-month interval
          corresponds to a progressive decline or to an abrupt threshold event.
        decision_criterion: >-
          A progressive measurable decline preceding failure would support
          reserve exhaustion and would identify a monitoring window. An abrupt
          transition without antecedent change would argue against the reserve
          model and against the feasibility of monitoring.
    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: >-
          Therapeutic doses of VPA inhibited human cellular proliferation and high
          doses caused nonapoptotic cell death, which was not mediated through
          mitochondrial DNA depletion, mutation, or a defect of fatty acid
          metabolism.
        explanation: >-
          The negative result that creates the controversy, excluding all three
          intuitive mechanisms in a single experiment.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          These findings implicate impaired liver regeneration in VPA toxicity
        explanation: >-
          The positive hypothesis put in place of the refuted ones, which the
          proposed experiments are designed to test directly.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Heterozygous genetic variation in POLG was strongly associated with
          VPA-induced liver toxicity
        explanation: >-
          The strength of the genotype effect, reported in the same sentence as an
          odds ratio of 23.6, is what a non-mitochondrial mechanism has to account
          for, and is the tension this discussion identifies.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The time from VPA exposure to liver failure was between 2 and 3 months.
          Liver failure was reversible in one patient.
        explanation: >-
          The latency the mechanism must explain, and the single reversible case
          that suggests the process is not instantaneously irreversible.
  - discussion_id: ahs_polg_testing_threshold
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Which children with intractable seizures should have POLG sequenced before
      valproate is started, and can a test that takes days be made to govern a
      decision that is often made in hours?
    attaches_to:
      - "pathophysiology#Valproate-Precipitated Fulminant Hepatic Failure"
    rationale: >-
      The proposal in the literature is broad: consider POLG testing in any child
      or adolescent who presents with or develops intractable seizures, with or
      without status epilepticus or epilepsia partialis continua. That is
      described as an emerging standard of care rather than an established one,
      and the gap between those two phrases is where the real question lives.
      Arguments for the broad threshold are strong. The consequence of missing the
      diagnosis is a preventable death, POLG variants occur in every ancestry
      group so no population can be excluded, and the risk extends beyond the
      syndrome itself because heterozygous variation alone carries a substantially
      elevated risk. Arguments against a universal rule are practical rather than
      principled. Intractable seizures are common and this disease is rare, so a
      broad rule tests very many children to find few; sequencing turnaround is
      usually days while the decision to start valproate is often made the same
      day; and variants of uncertain significance in a large gene will generate
      results that are themselves hard to act on. What is genuinely unresolved is
      not whether testing helps but what the operating policy should be, and no
      study has compared candidate thresholds against outcomes.
    proposed_experiments:
      - experiment_id: ahs_testing_yield_by_threshold
        name: Diagnostic yield and outcome by testing threshold
        description: >-
          Retrospective and then prospective evaluation across paediatric epilepsy
          centres of several candidate testing thresholds, from the broadest (all
          intractable seizures) to narrower ones (epilepsia partialis continua,
          occipital electrographic predominance, regression, or any combination),
          measuring diagnostic yield, number needed to test, and cases of
          valproate hepatotoxicity averted.
        decision_criterion: >-
          A threshold that captures nearly all cases at an acceptable number
          needed to test would justify a specific policy recommendation. If yield
          falls steeply as soon as the threshold is narrowed at all, that argues
          for the broad rule despite its cost.
      - experiment_id: ahs_rapid_targeted_genotyping
        name: Rapid targeted genotyping of recurrent variants as a pre-prescription test
        description: >-
          Development and evaluation of a same-day targeted assay for the
          recurrent POLG variants, including p.A467T, p.R597W and p.Q1236H,
          deployed as a pre-prescription check rather than as a diagnostic test,
          with sensitivity measured against full sequencing.
        decision_criterion: >-
          If a rapid targeted panel captures a large majority of clinically
          relevant genotypes, it can govern the prescribing decision in real time
          while full sequencing proceeds. Low sensitivity would mean the panel
          gives false reassurance and should not be used this way.
      - experiment_id: ahs_alternative_first_line_policy
        name: Outcome of a policy of avoiding valproate first-line in intractable childhood seizures
        description: >-
          Comparison of centres that avoid valproate as a first-line agent in
          undiagnosed intractable childhood seizures against those that do not,
          measuring both hepatotoxicity events and any cost in seizure control
          from the deferred use of an effective drug.
        decision_criterion: >-
          If avoidance prevents hepatotoxicity at little cost in seizure control,
          policy can sidestep the testing-turnaround problem entirely. A
          meaningful loss of seizure control would mean testing, not avoidance, is
          the right instrument.
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our data support an emerging proposal that POLG gene testing should be
          considered in any child or adolescent who presents or develops
          intractable seizures with or without status epilepticus or epilepsia
          partialis
        explanation: >-
          The broad threshold under discussion, stated by its proponents as an
          emerging proposal rather than as settled practice.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          POLG mutations have been observed in every ethnic group studied to
          date
        explanation: >-
          Removes ancestry as a legitimate basis for narrowing the testing
          threshold.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          prospective genetic testing of POLG will identify individuals at high
          risk of this potentially fatal consequence of treatment
        explanation: >-
          Supports prospective testing and, by covering heterozygotes without the
          syndrome, widens the population for whom testing has value beyond
          suspected Alpers-Huttenlocher syndrome.
  - discussion_id: ahs_occipital_predominance
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Post-mortem work shows the respiratory chain deficiency falls
      preferentially on inhibitory interneurons of the occipital cortex, but why
      those cells and why that lobe, when every neuron carries the same POLG
      genotype? And does occipital cortex have a general vulnerability that
      mechanistically unrelated epilepsies all expose?
    attaches_to:
      - "pathophysiology#Selective Interneuron and Pyramidal Neuron Loss in Occipital Cortex"
    rationale: >-
      This gap has moved rather than closed, and it is worth being precise about
      what part of it the evidence now answers. A systemic defect in replicating
      the mitochondrial genome should not have a lobe preference, yet the
      epileptiform activity of this disease has one. Quantitative neuropathology
      supplies the missing middle term: the deficiency is not uniform across
      cortex but concentrated in inhibitory interneurons and pyramidal neurons of
      occipital cortex and in Purkinje cells, and those populations are depleted.
      So the chain from a genome-maintenance defect to occipital seizures now has
      a cellular link in it, and the entry models that link rather than leaving a
      hole.

      What remains open is the selectivity itself, at two levels. Why
      interneurons: the usual explanation is that fast-spiking inhibitory cells
      carry the highest sustained metabolic load in cortex and so fail first under
      a shared energetic constraint, which is plausible and, in these sources,
      untested. Why occipital: nothing explains why the same cell class fails
      there rather than in frontal or temporal cortex, and the study did not
      compare regions within a brain in a way that would settle it. The authors
      themselves state their causal reading as a belief rather than a
      demonstration.

      There is also a caution against over-reading the regional claim. The
      electrographic and imaging findings vary between patients and between
      stages, which is not what a fixed metabolic gradient would produce.

      Finally, the company this observation keeps still matters. This knowledge
      base contains two other occipital-onset epilepsies, childhood occipital
      visual epilepsy and photosensitive occipital lobe epilepsy, which share no
      etiology with this disease or with each other beyond the location. The
      interneuron finding makes that convergence more interesting rather than
      less: if occipital inhibitory circuitry has a general fragility, a
      bioenergetic disease and two idiopathic epilepsies could be exposing the
      same weak point by different routes. No single-disease study can test that.
    proposed_experiments:
      - experiment_id: ahs_interneuron_metabolic_load
        name: Testing whether interneuron selectivity follows metabolic load
        description: >-
          Within the same post-mortem brains, comparison of respiratory chain
          subunit deficiency between fast-spiking parvalbumin-positive
          interneurons and lower-firing interneuron subtypes, against a measure of
          each population's baseline metabolic demand. This asks directly whether
          the vulnerable population is the one with the highest sustained energy
          requirement, which is the standard explanation and has not been tested
          here.
        decision_criterion: >-
          Deficiency tracking firing rate and metabolic demand across interneuron
          subtypes would establish energetic load as the selectivity mechanism.
          Uniform deficiency across subtypes, or selectivity that does not follow
          demand, would mean something other than metabolic load picks the
          vulnerable cells.
      - experiment_id: ahs_regional_mtdna_quantification
        name: Regional quantification of mitochondrial DNA depletion in post-mortem brain
        description: >-
          Quantification of mitochondrial DNA copy number and respiratory chain
          subunit expression across cortical regions in post-mortem tissue from
          patients with POLG disease, testing directly whether occipital cortex is
          more depleted or more functionally compromised than frontal and temporal
          cortex in the same brain.
        decision_criterion: >-
          Greater occipital depletion within the same brain would support a
          regional metabolic vulnerability. Uniform depletion across regions would
          mean the electrographic predominance arises from network properties
          rather than from where the molecular lesion bites hardest.
      - experiment_id: ahs_cross_mitochondrial_disease_eeg_survey
        name: Occipital predominance across mitochondrial diseases
        description: >-
          Systematic review of interictal electroencephalographic localization
          across mitochondrial diseases with differing molecular lesions, testing
          whether occipital predominance tracks mitochondrial dysfunction in
          general or is specific to POLG.
        decision_criterion: >-
          A shared occipital predominance across mitochondrial diseases would
          support a general energetic vulnerability of occipital cortex.
          Specificity to POLG would point to something about this lesion in
          particular.
      - experiment_id: ahs_cross_etiology_occipital_comparison
        name: Cross-etiology comparison of occipital epileptogenicity
        description: >-
          Comparison of occipital cortical excitability measures, such as the
          visual evoked response amplitude and after-discharge parameters already
          used in photosensitive occipital lobe epilepsy, across patients with
          POLG disease, the self-limited occipital epilepsies of childhood, and
          controls, to test whether a shared occipital excitability trait exists
          independent of etiology.
        decision_criterion: >-
          A shared excitability abnormality across etiologically unrelated
          occipital epilepsies would establish a general vulnerability worth
          modelling as such. Divergent physiology would mean the convergence on
          one lobe is coincidental and each disease reaches it by its own route.
    evidence:
      - reference: PMID:30021052
        reference_title: >-
          Dissecting the neuronal vulnerability underpinning Alpers' syndrome: a
          clinical and neuropathological study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Quantitative immunofluorescence showed severe respiratory chain
          deficiencies involving mitochondrial respiratory chain subunits of
          complex I and, to a lesser extent, complex IV in inhibitory interneurons
          and pyramidal neurons in the occipital cortex and in Purkinje cells of
          the cerebellum. Diminished densities of these neuronal populations were
          also observed.
        explanation: >-
          The evidence that moved this gap rather than closing it. It establishes
          the cellular selectivity and its occipital location, which is the part
          of the question that is now answered, and says nothing about why those
          cells or that lobe, which is the part that remains open.
      - reference: PMID:30021052
        reference_title: >-
          Dissecting the neuronal vulnerability underpinning Alpers' syndrome: a
          clinical and neuropathological study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Since our understanding of the mechanisms contributing the neurological
          features in Alpers' syndrome is rudimentary, we performed a detailed and
          quantitative neuropathological study on 13 patients with clinically and
          histologically-defined Alpers' syndrome with ages ranging from 2 months
          to 18 years.
        explanation: >-
          The authors' own characterization of mechanistic understanding in this
          disease as rudimentary, which is the state this gap records, together
          with the cohort size that bounds how much the study can settle.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          early predominance of epileptiform discharges over the occipital region
          is common in POLG-induced epilepsy
        explanation: >-
          The observation this gap is about, reported as common and useful enough
          to serve as a recognition feature.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the EEG and MRI findings varying between patients and stages of the
          disease
        explanation: >-
          The variability that a fixed regional-vulnerability explanation has to
          accommodate, and the reason the first proposed experiment measures
          depletion within individual brains rather than comparing across
          patients.

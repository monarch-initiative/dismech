      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Since interneurons often function as modulators of cortical neuron activity, the loss of any inhibitory activity could potentially lead to a lower seizure threshold and increase the probability of neuronal network becoming hyperexcitable.
      explanation: Hypothesized mechanistic contribution, not a proven sole driver.
- name: Recurrent Seizure Activity
  description: Epilepsy often begins focally and may progress to drug-resistant seizures, status epilepticus or epilepsia partialis continua. Initial control is possible in some children; refractory disease is not necessarily present from the first seizure.
  biological_scale: ORGANISM
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In some children, seizures are initially controllable with standard dosages of anti-seizure medications (ASM); in others, seizures, such as EPC, are refractory from the onset. Over time, seizures become increasingly resistant to ASMs.
    explanation: GeneReviews clinical synthesis.
  downstream:

  description: Increased mitochondrial ROS probe signals and altered antioxidant transcription were observed in Alpers-derived neural stem cells. This is experimental evidence from one donor, not proof that oxidative stress is the initiating event in patient brains.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:38385069
    reference_title: The NAD(+) Precursor Nicotinamide Riboside Rescues Mitochondrial Defects and Neuronal Loss in iPSC derived Cortical Organoid of Alpers' Disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: For Alpers' NSCs, a significant increase was observed in specific intracellular ROS (DCFDA/MTDR) and mitochondrial ROS at both total (MitoSOX Red) and specific level (MitoSOX Red/MTG) when compared to control NSCs
    explanation: Differentiated-cell result; pluripotent cells did not show the same ROS pattern.
  downstream:
  - target: Cortical Neuronal Loss
    description: Oxidative stress may contribute to neuronal injury; necessity or sufficiency was not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
      reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: The result is loss of normal ATP production and elevated free radical production and other mitochondrial functions, with resultant injury to neurons and other cells.
      explanation: Review synthesis supports a possible contribution, not an isolated rescue experiment.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
- name: Cortical Neuronal Loss
  description: Reduced densities of inhibitory interneurons and pyramidal neurons were observed in occipital cortex at autopsy, with gliosis and areas of laminar necrosis. Loss was similar between these two populations; respiratory-chain deficiency was more pronounced in interneurons. Regional specificity and a within-patient sequence from deficiency to cell loss were not demonstrated.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30021052
    reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Quantification revealed reduced densities of both interneurons (Figure 5A) and pyramidal neurons (Figure 5B) throughout patient cortical layers relative to controls suggestive of interneuron and pyramidal neuron loss.
    explanation: End-stage histology; cell-density measurements were descriptive because of small sample size.
  downstream:
  - target: Reduced Cortical Inhibition
    description: Dysfunction and loss of inhibitory interneurons may reduce inhibitory network control.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30021052
      reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Since interneurons often function as modulators of cortical neuron activity, the loss of any inhibitory activity could potentially lead to a lower seizure threshold and increase the probability of neuronal network becoming hyperexcitable.
      explanation: Authors' mechanistic interpretation; no electrophysiologic perturbation experiment in these patients.
  - target: Developmental Regression
    description: Progressive cortical dysfunction contributes to loss of acquired abilities.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

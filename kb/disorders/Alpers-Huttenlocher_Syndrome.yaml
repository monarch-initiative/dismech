      id: UBERON:0000956
      label: cerebral cortex
- name: Reduced Cortical Inhibition
  description: Reduced inhibitory interneuron function is a proposed contributor to cortical hyperexcitability. The human evidence is postmortem and the Alpers organoid evidence includes lower GAD65 staining and synaptic gene-set changes; neither directly measures the excitation-inhibition ratio in living patients.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:30021052
    reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Although loss of interneurons and pyramidal cells was similar, the magnitude of respiratory chain deficiency was more pronounced in interneurons raising the possibility that the loss of inhibitory neural networks plays a role in the seizure development in these patients.
    explanation: Explicit hypothesis based on the neuropathological association.
  downstream:
  - target: Recurrent Seizure Activity
    description: Reduced inhibitory control may lower seizure threshold.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

  - name: Intractable Focal Epilepsy and Epilepsia Partialis Continua
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Focal seizures that do not respond to medication, frequently escalating to
      epilepsia partialis continua, a state of continuous focal motor seizure
      activity that can persist for days or longer. In the reported series most
      children who went on to valproate hepatotoxicity had developed epilepsia
      partialis continua, which is the clinical reason the drug was reached for in
      the first place and is therefore the hinge between the two arms of this
      pathograph.
    downstream:
      - target: Valproate-Precipitated Fulminant Hepatic Failure
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All were given VPA due to intractable partial seizures. Three of the
          patients had developed epilepsia partialis continua.
        explanation: >-

- name: Respiratory Chain Deficiency
  description: Respiratory-chain impairment is prominent in vulnerable neurons. Postmortem Alpers tissue showed reduced complex I and, more variably, complex IV subunit immunoreactivity; those assays estimate dysfunction from protein abundance rather than directly measuring electron flux. Neural stem-cell experiments also showed complex I/IV protein loss.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:30021052
    reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We showed that occipital cortex GABAergic interneurons and pyramidal neurons, as well as Purkinje cells in the cerebellum, exhibited extensive respiratory chain defects as evidenced by significant downregulation of complex I subunit proteins and milder downregulation of complex IV subunit proteins.
    explanation: Postmortem study of 13 clinically defined cases, only five with confirmed POLG genotypes; examined regions were limited.
  downstream:

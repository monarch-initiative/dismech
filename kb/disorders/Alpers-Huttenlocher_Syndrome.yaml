    snippet: Although a fraction of patients met inclusion criteria for AHS (triad of refractory seizures, psychomotor regression, and hepatopathy), this seminal description is an imperfect fit for all the pediatric population reported here
    explanation: Primary cohort explicitly limits the Alpers label.
- name: MELAS Syndrome
  disease_term:
    preferred_term: MELAS syndrome
    term:
      id: MONDO:0010789
      label: MELAS syndrome
  description: MELAS can share seizures, cortical visual symptoms and stroke-like episodes. Mitochondrial DNA pathogenic variants and maternal inheritance distinguish typical MELAS from recessive nuclear POLG-related Alpers.
  distinguishing_features:
  - Stroke-like episodes can occur in both; they are not an exclusive discriminator.
  - Typical MELAS is associated with maternally inherited mtDNA variants.
  evidence:

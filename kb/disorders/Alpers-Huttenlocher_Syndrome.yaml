    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Significant sudden or rapid regression is often seen during infectious illnesses. The clinical manifestations may include somnolence, loss of concentration, loss of language skills (both receptive and expressive), irritability with loss of normal emotional responses, and memory deficits.
    explanation: Alpers-specific natural-history synthesis.

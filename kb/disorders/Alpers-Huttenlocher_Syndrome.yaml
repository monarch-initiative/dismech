diagnosis:
- name: Molecular diagnosis and parental phasing
  description: Confirm a compatible phenotype with biallelic pathogenic or likely pathogenic POLG variants. Variants of uncertain significance do not confirm or exclude disease. Sequence analysis should cover the whole gene; deletion/duplication testing, a mitochondrial/epilepsy panel or broader genomic testing may be needed. A small founder-variant screen can miss causal variants. Parental testing clarifies phase and recurrence risk.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301791
    reference_title: POLG-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Establishing the diagnosis of a POLG-related disorder relies on clinical findings and the identification of biallelic POLG pathogenic variants on molecular genetic testing
    explanation: GeneReviews molecular diagnosis.
  - reference: PMID:28471437
    reference_title: The clinical spectrum and natural history of early-onset diseases due to DNA polymerase gamma mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we demonstrate the need to perform full sequence analysis of the entire POLG gene rather than targeting common POLG mutations in patients with unexplained encephalopathy and multisystem disorders with or without epilepsy
    explanation: Clinical study conclusion; targeted variants are not a sufficient exclusion test.
- name: Electroencephalography and clinical seizure assessment
  description: EEG and video EEG characterize seizures and assess possible nonconvulsive status. Occipital discharges are an important clue but are not specific or invariably present; clinically apparent EPC can lack a clear EEG correlate.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:20138553
    reference_title: POLG DNA testing as an emerging standard of care before instituting valproic acid therapy for pediatric seizure disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: early predominance of epileptiform discharges over the occipital region is common in POLG-induced epilepsy
    explanation: Clinical recognition feature.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: EPC is not always apparent as an abnormality on EEG and can be mistaken for a conversion reaction. EEG may be normal or show only focal slowing of the background rhythm.
    explanation: Important diagnostic limitation.
- name: Neuroimaging
  description: Brain MRI may initially be normal. Evolving cortical or subcortical signal change, occipital-pulvinar involvement and cortical or cerebellar atrophy support the clinical assessment but do not replace molecular testing.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: CT or MRI of the brain may be normal early in the course of AHS. As the illness evolves, neuroimaging shows gliosis (initially more pronounced in the occipital lobe regions) and generalized cortical atrophy.
    explanation: Alpers imaging evolution.
- name: Hepatic, metabolic and tissue assessment
  description: Assess liver enzymes, synthetic function, glucose, ammonia and lactate alongside neurological findings. Tissue mtDNA measurement and respiratory-chain testing can be informative when needed, but normal muscle histology, enzyme activity or mtDNA content does not exclude disease. Do not delay appropriate genetic evaluation because a screening test is normal.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In muscle biopsy samples, ragged-red fibers, COX-negative fibers, excessive lipid deposits, and abnormal respiratory chain activities can be present. However, biochemical findings on muscle biopsy can be normal.
    explanation: Review explicitly limits muscle-biopsy sensitivity.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Depletion of mtDNA can be measured by comparing mtDNA to nuclear DNA content in an affected tissue (e.g., liver).
    explanation: Tissue measurement approach.
differential_diagnoses:
- name: Other early-onset POLG phenotypes
  description: Myocerebrohepatopathy and severe digestive-predominant presentations overlap with Alpers but can lack epilepsy, especially with rapidly fatal hepatic disease. Age categories and clinical syndromes are not equivalent.
  distinguishing_features:
  - Phenotypic classification depends on the full neurological and hepatic course, rather than the POLG genotype or age alone.

histopathology:
- name: Alpers liver injury pattern
  description: Steatosis, centrilobular necrosis, hepatocyte loss, architectural disorganization, fibrosis/cirrhosis, regenerative nodules and bile-duct proliferation form a variable constellation. Historical criteria used at least two characteristic features, but biopsy is not required when molecular and clinical findings establish the diagnosis; it may be unsafe in severe coagulopathy.
  diagnostic: false
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Liver histology may demonstrate macro- and microvesicular steatosis, centrilobular necrosis, disorganization of the normal lobular architecture, hepatocyte loss with or without bridging fibrosis or cirrhosis, regenerative nodules, bile duct proliferation, or mitochondrial proliferation with a vivid eosinophilic cytoplasm.
    explanation: Review synthesis of the characteristic but variable pattern.
  - reference: PMID:28471437
    reference_title: The clinical spectrum and natural history of early-onset diseases due to DNA polymerase gamma mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: liver biopsy is rarely performed in the neonatal and pediatric setting, because of the attendant risks of morbidity and mortality.
    explanation: Clinical discussion explains limited use of biopsy.
- name: Cortical neuronal loss and gliosis
  description: Laminar neuronal loss, spongiform change, astrocytosis and focal necrosis affect cortex, often with prominent occipital injury. Purkinje-cell loss can accompany cerebellar involvement. These are pathological observations rather than proof of a uniquely occipital initiating defect.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Early in the course of the disease, spongiosis, astrocytosis, and neuronal loss are prevalent in the superficial cortex. Later, the deeper laminae are affected.
    explanation: Review synthesis.
  - reference: PMID:30021052
    reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Quantification revealed reduced densities of both interneurons (Figure 5A) and pyramidal neurons (Figure 5B) throughout patient cortical layers relative to controls suggestive of interneuron and pyramidal neuron loss.
    explanation: Descriptive postmortem neuronal-density findings.
progression:
- phase: Variable childhood or later presentation
  age_range: Usually ages two to four years; reported range one month to 36 years
  notes: Children may initially develop normally, but developmental delay can precede recognized neurodegeneration. Seizures, visual symptoms, poor growth or hepatic disease may bring the child to attention; a fixed brain-then-liver sequence is not required.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Children with AHS appear healthy at birth and may develop normally over the first few weeks to years of life. Some have variable degrees of developmental delay prior to the initial recognition of neurodegeneration. Onset is usually between ages two and four years but ranges overall from one month to 36 years.
    explanation: Alpers-specific onset synthesis.
- phase: Progressive neurological and hepatic involvement
  notes: Seizures often become resistant to medication, and regression, spasticity, visual loss or ataxia can accumulate. Hepatic involvement has variable timing and can be precipitated or accelerated by valproate. Intercurrent illness may trigger abrupt decline.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In some children, seizures are initially controllable with standard dosages of anti-seizure medications (ASM); in others, seizures, such as EPC, are refractory from the onset. Over time, seizures become increasingly resistant to ASMs.
    explanation: Variable seizure progression.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Significant sudden or rapid regression is often seen during infectious illnesses.
    explanation: Stress-associated deterioration.
- phase: Variable survival with risk of fatal decompensation
  notes: The course is usually life limiting, but survival is variable and may include periods of stability. GeneReviews describes three months to 12 years from symptom onset. The 2017 Alpers subgroup had a median reported survival of four months (range 0.5–181 months); the pooled cohort's median age at death must not be treated as a universal Alpers prognosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The rate of neurodegeneration varies and is marked by periods of stability. The typical life expectancy from onset of first symptoms ranges from three months to 12 years.
    explanation: Review summary; not an individual prognostic prediction.
  - reference: PMID:28471437
    reference_title: The clinical spectrum and natural history of early-onset diseases due to DNA polymerase gamma mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Survival analysis by phenotype showed that the median survival time for patients with MCHS was 5 months (range 0.6 –22) and 4 months (range 0.5 –181) for Alpers.
    explanation: Retrospective subgroup estimate with wide variation and selected ascertainment.
treatments:
- name: Avoidance of Valproate and Divalproex
  description: Avoid valproate and divalproex in established POLG-related Alpers, including before hepatic dysfunction is apparent. This precaution is supported by clinical reports, GeneReviews and the 2024 mitochondrial-epilepsy consensus. The 2024 published-case review confirms severe outcomes but cannot estimate an unbiased individual risk.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Avoidance of Valproate and Divalproex
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - &id002
    reference: PMID:38576261
    reference_title: 'Management of seizures in patients with primary mitochondrial diseases: consensus statement from the InterERNs Mitochondrial Working Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Valproic acid is contraindicated in patients with pathogenic variants in POLG
    explanation: Consensus contraindication for POLG disease, not a claim about all common polymorphisms.
  - reference: PMID:38860231
    reference_title: 'Evidence for sodium valproate toxicity in mitochondrial diseases: a systematic analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: There was no pre-existing liver disease in 92/102 patients (90%).
    explanation: Selected published POLG cases exposed to valproate; absence of baseline liver disease does not eliminate risk.
  target_mechanisms:
  - target: Valproate-Associated Hepatocellular Injury
    treatment_effect: INHIBITS
    description: Avoidance removes the drug exposure that can trigger hepatic injury.
    evidence:

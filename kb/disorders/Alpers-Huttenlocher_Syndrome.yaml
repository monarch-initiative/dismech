phenotypes:
- name: Focal Seizures
  category: Neurological
  description: Focal seizures are characteristic and commonly become medication resistant. In the 2017 study, all 19 Alpers-classified patients had epilepsy; focal seizures were recorded in 14/19 and therapy resistance in 17/19. These selected retrospective data do not establish universal focal onset.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:28471437
    reference_title: The clinical spectrum and natural history of early-onset diseases due to DNA polymerase gamma mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Focal 14/19 (74%) Infantile spasm 1/19 (5%) Therapy-resistant epilepsy 17/19 (89%)
    explanation: Seizure-type denominator corresponds to the Alpers subgroup; phenotype binding describes focal onset, not medication resistance.
  frequency: FREQUENT
- name: Status Epilepticus
  category: Neurological
  description: Sustained seizure activity can be presenting or emerge during progression. The 2017 Alpers subgroup recorded status epilepticus in 13/19; broader POLG status cohorts are not used as Alpers frequency estimates.

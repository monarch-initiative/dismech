    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Myoclonic 13/19 (68%) Status epilepticus 13/19 (68%) Epilepsia partialis continua 11/19 (58%)
    explanation: Alpers seizure subgroup; retrospective ascertainment.
  frequency: FREQUENT
- name: Epilepsia Partialis Continua
  category: Neurological
  description: Continuous focal motor seizures may last hours or days. EEG can show only focal slowing or appear normal during clinically apparent EPC.

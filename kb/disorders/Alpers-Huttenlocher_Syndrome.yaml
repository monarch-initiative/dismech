- name: Mitochondrial DNA Depletion
  description: Reduced mitochondrial genome copy number occurs in affected tissues and in Alpers patient-derived neural stem cells. It is not uniformly detectable in all tissues or at every disease stage. TFAM staining in organoids is a proxy; the neural-stem-cell experiment also used mtDNA/nuclear-DNA qPCR.
  biological_scale: CELLULAR
  evidence:

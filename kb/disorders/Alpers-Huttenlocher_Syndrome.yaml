review_notes: 'Comprehensive review checked the original entry, matching falcon research narrative, all original references and genuine cached scientific bodies. Read the complete POLG GeneReviews chapter through diagnosis, clinical course, care, surveillance, counseling and molecular pathogenesis. Full scientific bodies consumed: PMID20138553, 28471437, 30021052, 38860231, 38822839, 38975049, 38385069 and 38576261. Independent full-source peers audited PMID21038416 and 33956154, with claim-local passages also checked here. PMID16024923 and 30255931 remain abstract-supported; inaccessible assay details are not invented. PMID30021052 was regenerated from abstract-only to full XML. The 2017 correction PMID30228318 was checked on the publisher site and corrects Table 2 identifiers/citations, not phenotype results; the current PDF is already corrected. Frequencies come from the explicit 19-person Alpers subgroup, with feature-specific denominators. Mixed early-onset and broad POLG cohorts are not treated as Alpers prevalence samples. Historical neuropathology includes cases without molecular confirmation. Experimental ATP abundance, respiratory protein staining and organoid markers are not
  renamed direct flux or lineage measurements. The 2026 metformin paper PMID41355579 was screened but not used because its main donor is a different POLG phenotype, rather than the Alpers donor in the nicotinamide-riboside paper. The complete consensus distinguishes not-contraindicated advice from proven efficacy. Valproate remains contraindicated; common-polymorphism uncertainty does not weaken this. Registry status was checked live on 2026-09-21 and design evidence is distinguished from outcomes. No reference cache was manually edited and the frozen shared accession blob was not accessed. Both 2024 and 2026 deoxynucleoside trial main bodies, methods, tables and discussions were read fully; the later study extends the same program rather than independently replicating it. In the initial report, 8/10 had no seizures in the preceding two months and one six-month disease-scale result was imputed; no uncontrolled EEG or seizure change is treated as an Alpers-specific causal effect. Baseline-to-follow-up changes are not randomized effects. Pediatric quality of life was nonsignificant when analyzed separately, and onset-to-death natural-history intervals cannot establish a survival advantage
  against enrollment-to-death follow-up in selected survivors. Posted vatiquinone registry results include a nonsignificant randomized primary endpoint and selected open-label safety data, without an Alpers-specific efficacy estimate.'


  relationship_type: CAUSATIVE
  notes: POLG encodes the catalytic subunit of mitochondrial DNA polymerase gamma. Pathogenic alleles can impair catalysis, processivity, DNA binding, proofreading or protein stability; effects differ between alleles and do not imply complete loss of all enzyme functions. Recurrent p.Ala467Thr is associated with several POLG phenotypes, so its presence alone does not determine Alpers severity. Common p.Gln1236His and p.Glu1143Gly substitutions are not equivalent to biallelic Alpers-causing variants.
  evidence:
  - reference: PMID:20138553
    reference_title: POLG DNA testing as an emerging standard of care before instituting valproic acid therapy for pediatric seizure disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Molecular studies revealed homozygous p.R597W or p.A467T mutations in two patients. The other two patients showed compound heterozygous mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
    explanation: Primary molecular diagnoses in the selected case series.
  - reference: PMID:16024923
    reference_title: The common A467T mutation in the human mitochondrial DNA polymerase (POLG) compromises catalytic efficiency and interaction with the accessory subunit.

notes: This entry covers POLG-related Alpers-Huttenlocher syndrome (mitochondrial DNA depletion syndrome 4A), rather than all early-onset POLG disease. Historical clinically defined Alpers cohorts may include individuals without molecular confirmation or with other genetic causes. Myocerebrohepatopathy and juvenile/adult POLG phenotypes overlap but are not interchangeable with this syndrome. Frequencies from mixed POLG cohorts are not assigned to Alpers phenotypes; the 2017 study explicitly identifies an Alpers subgroup of 19. Mechanistic experiments retain their allele, tissue and model limitations. The falcon deep-research report was checked against primary sources and the complete GeneReviews chapter.
inheritance:
- name: Autosomal recessive
  description: Alpers-Huttenlocher syndrome due to POLG is associated with biallelic pathogenic or likely pathogenic variants, usually inherited from asymptomatic heterozygous parents. Parental testing establishes phase and recurrence risk. If both parents carry one familial pathogenic variant, each pregnancy has a 25% chance of an affected child; severity can differ between siblings. Common POLG polymorphisms and dominant POLG-associated ophthalmoplegia require separate interpretation.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

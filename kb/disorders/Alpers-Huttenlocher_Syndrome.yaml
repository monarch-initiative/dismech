      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: The major motor manifestation is a progressive spastic paraparesis resulting from progressive loss of cortical neuronal function.
      explanation: Review explicitly connects cortical dysfunction with pyramidal motor signs.

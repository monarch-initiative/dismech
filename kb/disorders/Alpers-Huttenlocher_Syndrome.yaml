- name: Impaired Polymerase Gamma Holoenzyme Assembly
  description: Mouse A449T and corresponding human A467T impair productive interaction between catalytic POLG and accessory POLG2 subunits. Assembly is reduced, not absent. This allele-specific route is separate from the measured DNA-binding and long-template synthesis defects.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:33956154
    reference_title: DNA polymerase gamma mutations that impair holoenzyme stability cause catalytic subunit depletion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thus, the A449T mutation significantly reduces the interaction between POLγA and POLγB subunits.
    explanation: Reconstituted-protein assembly assay.
  downstream:
  - target: Increased Degradation of Unprotected POLG
    description: Reduced accessory-subunit protection permits LONP1-dependent degradation of the catalytic subunit.
    causal_link_type: DIRECT
    evidence:

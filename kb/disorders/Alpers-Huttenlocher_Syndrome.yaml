clinical_trials:
- name: NCT04802707
  description: Single-centre open-label phase 2 pyrimidine deoxynucleoside study across mitochondrial depletion disorders. The 2024 POLG interim report included 10 participants, six with Alpers; the 2026 report extends the same program to 25 participants with varied POLG phenotypes, including adults. Disease-scale scores improved among available follow-up observations, and 10/14 with uncontrolled epilepsy had reported seizure reductions over 50%. Five participants died and five withdrew. These uncontrolled mixed-phenotype findings do not establish Alpers-specific efficacy or a survival benefit.
  phase: PHASE_II
  status: RECRUITING
  target_phenotypes:

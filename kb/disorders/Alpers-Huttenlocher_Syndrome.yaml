- name: Hepatocellular Injury
  description: Intrinsic hepatic disease can develop independently of valproate exposure. Hepatocyte loss, steatosis and architectural disruption can lead to impaired metabolic and synthetic function. The specific sequence connecting POLG dysfunction to hepatic injury remains incompletely resolved.
  biological_scale: TISSUE
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/
    reference_title: POLG-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Liver histology may demonstrate macro- and microvesicular steatosis, centrilobular necrosis, disorganization of the normal lobular architecture, hepatocyte loss with or without bridging fibrosis or cirrhosis, regenerative nodules, bile duct proliferation, or mitochondrial proliferation with a vivid eosinophilic cytoplasm.
    explanation: Review of hepatic pathology.
  downstream:

discussions:
- discussion_id: alpers-valproate-mediator
  prompt: Which liver-specific mechanisms explain the severe valproate vulnerability of recessive POLG disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Valproate-Associated Hepatocellular Injury
  rationale: Clinical risk is well established, but the 2010 assays used yeast chimeras and primary muscle cells. Failure to observe extra mtDNA depletion there does not exclude mitochondrial-genome or fatty-acid pathways in liver. Impaired regeneration and an HDAC-mediated explanation were proposed, not directly demonstrated in human hepatocytes. Mechanistic research should use appropriate models without exposing affected children to a contraindicated drug.
  evidence:
  - reference: PMID:21038416
    reference_title: Polymerase γ gene POLG determines the risk of sodium valproate-induced liver toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Human hepatocyte cell lines from patients with POLG variants are not available.
    explanation: Explicit lineage limitation.
  - reference: PMID:21038416
    reference_title: Polymerase γ gene POLG determines the risk of sodium valproate-induced liver toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: but there was no further decrease in mtDNA content with the addition of 10mM VPA
    explanation: Negative result in the tested muscle-cell context.
- discussion_id: alpers-common-polymorphism-risk
  prompt: How should common POLG polymorphisms be interpreted separately from biallelic Alpers-causing variants?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#POLG
  rationale: The 2010 association in selected suspected valproate liver-injury cases used population controls and differs from a recessive molecular diagnosis. A later small monotherapy comparison did not reproduce increased toxicity for Q1236H/E1143G in the absence of other pathogenic variants. Neither study establishes universal heterozygote risk or relaxes the contraindication for established Alpers.
  evidence:
  - reference: PMID:21038416
    reference_title: Polymerase γ gene POLG determines the risk of sodium valproate-induced liver toxicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Heterozygous genetic variation in POLG was strongly associated with VPA-induced liver toxicity
    explanation: Selected association-study conclusion; variant classes and comparator population require separate interpretation.
  - reference: PMID:30255931
    reference_title: 'Variants p.Q1236H and p.E1143G in mitochondrial DNA polymerase gamma POLG1 are not associated with increased risk for valproate-induced hepatotoxicity or pancreatic toxicity: A retrospective cohort study of patients with epilepsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Transient liver dysfunction was identified in three (n = 33, 9.1%) variant group patients and in one (n = 28, 3.6%) nonvariant group patient (P = 0.62).
    explanation: Small available-abstract null comparison, not proof of zero risk.
- discussion_id: alpers-neural-selectivity
  prompt: Does early inhibitory-network dysfunction drive seizures, or does prolonged epilepsy amplify the observed neuronal injury?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Cortical Inhibition
  - pathophysiology#Cortical Neuronal Loss
  rationale: End-stage human tissue shows respiratory-chain protein deficiency and cell loss, but cannot order these events. Both interneuron and pyramidal-cell densities were reduced; respiratory-chain abnormalities were more pronounced in interneurons. Limited sampled regions do not establish occipital exclusivity. Longitudinal, appropriately controlled neural models are needed to separate intrinsic dysfunction from seizure-related injury.
  evidence:
  - reference: PMID:30021052
    reference_title: 'Dissecting the neuronal vulnerability underpinning Alpers'' syndrome: a clinical and neuropathological study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Although loss of interneurons and pyramidal cells was similar, the magnitude of respiratory chain deficiency was more pronounced in interneurons raising the possibility that the loss of inhibitory neural networks plays a role in the seizure development in these patients.
    explanation: Authors explicitly frame the causal network mechanism as a possibility.
- discussion_id: alpers-a449t-model-mismatch
  prompt: Why does the A449T knock-in mouse remain much milder than human Alpers and resist the tested valproate challenges?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Homozygous Polg A449T knock-in mouse
  - pathophysiology#Valproate-Associated Hepatocellular Injury
  rationale: The model recapitulates proximal biochemical defects and stress-dependent mtDNA recovery but not the severe human triad, shortened lifespan or tested valproate-associated hepatic damage. Compensatory processes, species biology and allele combinations remain unresolved. The negative mouse drug phenotype cannot establish safety in affected people.
  evidence:
  - reference: PMID:33956154
    reference_title: DNA polymerase gamma mutations that impair holoenzyme stability cause catalytic subunit depletion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We monitored the PolgA449T/A449T and WT littermates up to 2 years of age, but neither reduction of the lifespan nor the presence of obvious age-related phenotypes was observed.
    explanation: Explicit long-term mild phenotype.
  - reference: PMID:33956154
    reference_title: DNA polymerase gamma mutations that impair holoenzyme stability cause catalytic subunit depletion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Both WT and PolgA449T/A449T did not show any sign of hepatic failure or histological damage.
    explanation: Explicit negative result after the tested valproate protocols.
animal_models:
- name: Homozygous Polg A449T knock-in mouse
  species: Mus musculus
  category: Knock-in model
  genotype: Polg A449T/A449T
  description: The mouse ortholog of human A467T impairs mitochondrial genome maintenance and reduces catalytic-subunit abundance. Young mice showed reduced exercise/rearing performance and mild skeletal-muscle mtDNA depletion; spontaneous severe neurological or liver failure was not demonstrated. After carbon tetrachloride, residual liver necrosis was greater at day four despite similar early injury. This challenge does not establish ATP failure as the mediator of delayed recovery.
  publication: PMID:33956154
  notes: The homozygous Polg A449T mouse models one allele corresponding to human A467T. It had mild, tissue-dependent mtDNA changes, unchanged liver/muscle OXPHOS activities and no shortened lifespan through two years. It does not reproduce the severe human Alpers triad. Tested valproate exposures did not cause hepatic failure, so the model cannot establish human drug safety.

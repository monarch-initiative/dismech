name: Alpers-Huttenlocher Syndrome
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A severe childhood mitochondrial disease that kills a brain and a liver at the
  same time, from the same lesion. The gene is POLG, which encodes the only
  polymerase the mitochondrion has for copying its own small genome; when both
  copies fail, mitochondrial DNA is not replaced as it turns over, and the
  tissues that need the most mitochondria run out first. Clinically that shows up
  as a triad: a toddler or young child who had been developing normally starts
  losing skills, develops seizures that will not stop and often become epilepsia
  partialis continua, and then the liver fails. The epileptiform activity has an
  odd and consistent preference for the occipital region, which nobody has
  explained. And there is a trap built into the disease: sodium valproate, one of
  the drugs a neurologist would naturally reach for in intractable seizures, can
  precipitate fatal liver failure in these children at any stage of the illness.
  That is why this entry treats a drug as part of the pathophysiology rather than
  only as a treatment.
parents:
  - Epilepsy
  - Mitochondrial Disease
  - Neurological Disease
synonyms:
  - AHS
  - Alpers syndrome
  - Alpers disease
  - progressive sclerosing poliodystrophy
  - mitochondrial DNA depletion syndrome 4A

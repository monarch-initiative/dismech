    evidence:
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          AHS is a neurometabolic disorder associated with an increased risk of
          developing fatal VPA hepatotoxicity.
        explanation: >-
          Names the syndrome as neurometabolic and establishes the hepatic
          vulnerability that both this node and the one downstream of it depend
          on.
      - reference: PMID:20301791
        reference_title: POLG-Related Disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Early-onset disease (prior to age 12 years): Liver involvement, feeding
          difficulties, seizures, hypotonia, and muscle weakness are the most
          common clinical features. This group has the worst prognosis.
        explanation: >-
          Names liver involvement among the most common features of the
          early-onset group, alongside the seizures, which is the co-occurrence
          this pathograph models.
  - name: Valproate-Precipitated Fulminant Hepatic Failure
    biological_scale: ORGANISM
    description: >-
      The iatrogenic arm, and the reason this disease has to be recognized before
      it is treated. Sodium valproate is a reasonable choice for intractable
      focal seizures and is widely used; in a child with POLG disease it can
      precipitate liver failure at any stage of the illness, typically within two
      to three months of starting it, and it is often fatal. What the mechanism is
      not, is as informative as what it is: the toxicity was found not to be
      mediated through mitochondrial DNA depletion, through mutation, or through a
      defect in fatty acid metabolism, which rules out the intuitive explanation
      that valproate simply accelerates the underlying lesion. The finding instead
      implicates impaired liver regeneration, with valproate inhibiting cellular
      proliferation at therapeutic doses and causing non-apoptotic cell death at
      high ones.
    locations:
      - preferred_term: liver
        term:
          id: UBERON:0002107
          label: liver
    cell_types:
      - preferred_term: hepatocyte
        term:
          id: CL:0000182
          label: hepatocyte
    evidence:
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          VPA dosing at any stage of Alpers-Huttenlocher syndrome can precipitate
          liver failure
        explanation: >-
          The core clinical claim of this node, stated without qualification about
          disease stage, which is what makes the avoidance absolute rather than
          conditional.
      - reference: PMID:20138553
        reference_title: >-
          POLG DNA testing as an emerging standard of care before instituting
          valproic acid therapy for pediatric seizure disorders.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The time from VPA exposure to liver failure was between 2 and 3 months.
          Liver failure was reversible in one patient.
        explanation: >-
          Gives the latency from exposure to failure and records that reversal is
          possible but was the exception in this series.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: >-
          Therapeutic doses of VPA inhibited human cellular proliferation and high
          doses caused nonapoptotic cell death, which was not mediated through
          mitochondrial DNA depletion, mutation, or a defect of fatty acid
          metabolism.
        explanation: >-
          Marked REFUTE against the intuitive mechanism that valproate acts by
          worsening the mitochondrial DNA depletion. All three obvious routes were
          tested and excluded, which is why this node attributes the toxicity to
          impaired regeneration instead.
      - reference: PMID:21038416
        reference_title: >-
          Polymerase gamma gene POLG determines the risk of sodium
          valproate-induced liver toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          These findings implicate impaired liver regeneration in VPA toxicity
        explanation: >-
          The authors' positive conclusion about mechanism, which is what this
          node asserts in place of the refuted depletion explanation.

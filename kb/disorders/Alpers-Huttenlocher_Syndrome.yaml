    snippet: KD was administered during an SE episode in 13 patients, with only two with juvenile to adult-onset disease reporting some effect on seizure control.
    explanation: Retrospective mixed-POLG observation, not an Alpers controlled trial.
  target_mechanisms:
  - target: Recurrent Seizure Activity
    treatment_effect: MODULATES
    description: Selected adjuncts aim to improve seizure control, with uncertain Alpers-specific benefit.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK26471/

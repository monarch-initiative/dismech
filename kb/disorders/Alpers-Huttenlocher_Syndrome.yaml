    explanation: Primary mixed-cohort observation with incomplete testing.
- name: Hepatic synthetic and metabolic dysfunction
  presence: VARIABLE
  context: Aminotransferase elevation, low albumin, prolonged coagulation times, hypoglycemia or hyperammonemia can accompany hepatic involvement. Synthetic dysfunction can be clinically important even when isolated enzyme measurements are not striking.

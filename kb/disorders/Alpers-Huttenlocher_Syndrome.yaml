    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: To corroborate the reduction in the mtDNA levels as observed through the ND1/APP measurements in Alpers' NSCs, we performed qPCR (Figure 2P), which confirmed the same.
    explanation: Primary qPCR in neural stem cells from one A467T/P589L donor; no isogenic control.

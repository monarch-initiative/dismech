- name: Purkinje Cell Loss
  description: Reduced cerebellar Purkinje-cell density accompanies respiratory-chain protein deficiency in surviving cells. The study could not separate intrinsic mitochondrial injury from effects of seizures or treatment; loss did not correlate with residual-cell complex I/IV deficiency.

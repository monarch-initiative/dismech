- name: Valproate-Associated Hepatocellular Injury
  description: Valproate can precipitate or accelerate severe liver injury in POLG-related disease, including without pre-existing biochemical liver disease. The molecular mediator is unresolved. The 2010 muscle-cell and yeast experiments neither established hepatocyte regeneration failure nor excluded liver-specific mtDNA or fatty-acid mechanisms.
  biological_scale: TISSUE
  evidence:

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: MELAS is caused by pathogenic variants in mtDNA and is transmitted by maternal inheritance.
    explanation: Direct differential-diagnosis statement.
- name: Other hepatocerebral mitochondrial disorders
  description: DGUOK, MPV17 and other mitochondrial disorders can combine liver disease and neurological dysfunction. Historical Alpers-like encephalopathy also includes non-POLG genetic causes, so an unresolved molecular diagnosis warrants broader testing.
  distinguishing_features:
  - A different causal gene establishes a separate molecular disorder; liver and seizure findings can overlap.

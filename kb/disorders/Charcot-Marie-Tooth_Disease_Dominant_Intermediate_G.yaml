    evidence:
    - reference: PMID:40635134
      reference_title: Novel neurofilament light (Nefl) E397K mouse models of Charcot-Marie-tooth type 2E (CMT2E) present early and chronic axonal neuropathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Collectively, these results demonstrate an early and robust in vivo
        electrophysiological phenotype and axonal pathology, making
        Nefl+/E397K and NeflE397K/E397K mice ideal for the evaluation of
        therapeutic approaches.
      explanation: >-
        The authors' assessment of the model, in their own framing as an axonal

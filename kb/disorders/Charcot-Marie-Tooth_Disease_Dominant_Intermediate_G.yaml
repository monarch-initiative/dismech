prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Population prevalence specific to CMTDIG is not established by these studies. Intermediate
    neuropathy accounted for 17 of 58 classified NEFL kindreds in a literature review and
    24 of 37 NEFL patients from 8 of 17 families in a Korean cohort. These estimates have
    different denominators and ascertainment and should not be averaged or treated as contradictory
    population rates. The older less-than-1% estimate concerns NEFL-related CMT in selected
    large cohorts, not CMTDIG population prevalence.
  evidence:
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      it is a rare form of inherited neuropathy, accounting for less than 1% of all CMT cases
      in large cohorts
    explanation: >-
      Bounds the size of the parent set, NEFL-related CMT. Graded INDIRECT because it is a
      figure for the gene, not for the CMTDIG presentation.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      intermediate CMT or neuropathy with axonal and demyelinating features in 17 kindreds
      (29%)
    explanation: >-
      The share of NEFL-related CMT kindreds classified as intermediate in a pooled literature
      analysis.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Neurophysiologically, NEFL-related CMT was classified as demyelinating, axonal, and
      intermediate neuropathy in 24.3%, 10.8%, and 64.9% of cases, respectively.
    explanation: >-
      The Korean patient-level proportion is 24/37; this differs in denominator and ascertainment
      from the literature kindred-level proportion.
genetic:
- name: NEFL
  gene_term:
    preferred_term: NEFL
    term:
      id: hgnc:7739
      label: NEFL
  relationship_type: CAUSATIVE
  association: Heterozygous Missense Variants
  notes: >-
    Dominant NEFL-related CMT includes overlapping CMT1F, CMT2E and CMTDIG presentations.
    CMTDIG-associated missense variants include E396K, N98S, L312P and I384F; E396K also occurs
    in CMT1F. Early reports used Glu397Lys for human E396K, while E397K is also the orthologous
    residue in the mouse model. Unaffected heterozygous carriers in families with recessive
    rod-domain null alleles argue against simple haploinsufficiency as the dominant mechanism;
    this observation should not be generalized to every truncating NEFL allele.
  evidence:
  - reference: CGGV:assertion_57ec533a-b1cb-4d1d-b12a-61ee6ac6ab07-2023-01-10T170000.000Z
    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Based on the literature we differentiate between autosomal dominant NEFL CMT (MONDO:0015626),
      autosomal recessive NEFL CMT (MONDO:0018993).
    explanation: >-
      ClinGen's own statement of how it partitions NEFL disease — by inheritance, not by electrophysiological
      subtype.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Individuals who are heterozygous for the null allele are asymptomatic, indicating that
      there is no haploinsufficiency.
    explanation: >-
      Unaffected carriers of recessive null alleles support a toxic or dominant-negative mechanism
      for dominant missense disease; the statement is not a claim about every possible truncating
      allele.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Notably, the p.E396K mutation was found in both CMT1F and CMTDIG patients.
    explanation: >-
      The CMTDIG-defining variant does not map exclusively to the CMTDIG label, which is the
      central caveat this entry records.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the p.L312P, p.I384F, and p.E396K mutations were identified in patients with intermediate

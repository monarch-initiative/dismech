  downstream:
  - target: Failure of Neurofilament Delivery to Distal Axons
    causal_link_type: DIRECT
    description: >-
      Neurofilaments trapped in aggregates in the cell body and proximal axon do
      not travel down the axon.
  - target: Central Nervous System Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      NEFL is expressed in central as well as peripheral neurons, and the mouse

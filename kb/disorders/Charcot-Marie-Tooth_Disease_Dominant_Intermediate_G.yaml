name: Charcot-Marie-Tooth Disease Dominant Intermediate G
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease dominant intermediate G (CMTDIG) is the
  intermediate-conduction presentation of autosomal dominant NEFL-related
  neuropathy: heterozygous missense variants in the neurofilament light
  polypeptide gene produce upper-limb motor conduction velocities in the
  intermediate band (roughly 25-45 m/s) that fit neither the demyelinating
  (CMT1F) nor the axonal (CMT2E) category. The mechanism explains why. NEFL
  variants disrupt neurofilament co-assembly and cause the protein to
  misdistribute and aggregate in neuronal cell bodies and proximal axons, so
  neurofilaments never reach the distal axon. Because neurofilaments are the
  space-filling structures that drive radial axonal growth, the axon fails to
  expand to normal calibre — and conduction velocity depends on calibre as well
  as on myelin. Slowed conduction therefore arises without a primary myelin
  lesion, which is exactly what an intermediate electrophysiological picture
  looks like. Two further features recur in reported CMTDIG families and set the
  entity apart from the ordinary length-dependent CMT picture: central nervous
  system involvement, from abnormal evoked potentials and blink reflexes through
  to cerebellar ataxia with cerebellar atrophy; and early onset, with delayed
  motor milestones in the more severe pedigrees.

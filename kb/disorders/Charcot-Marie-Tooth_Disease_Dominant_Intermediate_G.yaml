prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been published for CMTDIG, and none can be
    derived, because the label is applied on an electrophysiological threshold
    rather than to a fixed set of variants. What is published is the size of the
    parent set and the share within it: NEFL accounts for under 1% of CMT in
    large cohorts, and within NEFL-related CMT the intermediate classification
    was applied to 29% of 58 kindreds in a pooled literature analysis and to
    64.9% of patients in a Korean national series. Those two shares are not
    reconcilable with each other, which is itself informative about how stable
    the category is.
  evidence:
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      it is a rare form of inherited neuropathy, accounting for less than 1% of
      all CMT cases in large cohorts
    explanation: >-
      Bounds the size of the parent set, NEFL-related CMT. Graded INDIRECT
      because it is a figure for the gene, not for the CMTDIG presentation.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      intermediate CMT or neuropathy with axonal and demyelinating features in
      17 kindreds (29%)
    explanation: >-
      The share of NEFL-related CMT kindreds classified as intermediate in a
      pooled literature analysis.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Neurophysiologically, NEFL-related CMT was classified as demyelinating,
      axonal, and intermediate neuropathy in 24.3%, 10.8%, and 64.9% of cases,
      respectively.
    explanation: >-
      A very different share in a single national cohort, quoted alongside the
      29% figure rather than averaged with it.
genetic:
- name: NEFL
  gene_term:
    preferred_term: NEFL
    term:
      id: hgnc:7739
      label: NEFL
  relationship_type: CAUSATIVE
  association: Heterozygous Missense Variants
  notes: >-
    ClinGen curates two separate NEFL gene-disease relationships and this entry
    sits under the dominant one: autosomal dominant NEFL CMT (MONDO:0015626,
    Definitive) and autosomal recessive NEFL CMT (MONDO:0018993, Definitive) are
    curated apart, and ClinGen does not recognize CMT1F, CMT2E and CMTDIG as
    separate gene-disease entities. Heterozygous carriers of NEFL null alleles
    are unaffected, so the dominant disease is not caused by haploinsufficiency.
    p.Glu396Lys is the variant of the pedigree the CMTDIG designation comes from;
    the same variant has also been reported in patients classified CMT1F.

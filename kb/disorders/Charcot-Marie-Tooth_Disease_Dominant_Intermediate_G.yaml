name: Charcot-Marie-Tooth Disease Dominant Intermediate G
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease dominant intermediate G (CMTDIG) is an autosomal dominant NEFL-related
  sensorimotor neuropathy classified by an intermediate nerve-conduction phenotype. Heterozygous
  missense variants include p.Glu396Lys, p.Asn98Ser, p.Leu312Pro and p.Ile384Phe. Distal weakness,
  sensory loss and foot deformity predominate; some patients have early motor delay, proximal
  weakness, hearing loss or central nervous system involvement. Neurofilament disorganization,
  abnormal axonal neurofilament content and reduced axonal calibre are supported by variant-specific
  experimental models. These findings do not establish a separate mechanism unique to CMTDIG,
  and neither aggregation nor a fixed 25–45 m/s velocity band is universal across variants
  and patients. Clinical and electrophysiological overlap with NEFL-related CMT1F and CMT2E
  is substantial.

pathophysiology:
- name: Heterozygous NEFL Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A single missense allele of NEFL, encoding neurofilament light polypeptide.
    Variants span the head, rod and tail domains, with recurrent hotspots at
    Pro8, Pro22 and Asn98; p.Glu396Lys, which lies just outside the rod domain
    and disrupts the heptad repeat that defines the coiled coil, is the variant
    reported in the pedigree on which the CMTDIG designation rests. ClinGen
    characterizes the pathogenic mechanism as a gain of function arising from
    misdistribution and aggregation of the protein — that is, the mutant subunit
    poisons the co-assembled network rather than simply being absent, which is
    consistent with the observation that heterozygous carriers of NEFL null
    alleles are unaffected.
  genetic_context:
    gene:
      preferred_term: NEFL
      term:
        id: hgnc:7739
        label: NEFL
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: CGGV:assertion_57ec533a-b1cb-4d1d-b12a-61ee6ac6ab07-2023-01-10T170000.000Z
    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT

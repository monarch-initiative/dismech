- name: Failure of Neurofilament Delivery to Distal Axons
  biological_scale: CELLULAR
  description: >-
    Neurofilaments are assembled in the cell body and delivered along the axon by
    microtubule-based transport. In the Nefl N98S mouse the sciatic nerve shows
    fewer neurofilaments, more microtubules, and smaller axons — the axonal
    content of the cytoskeleton is changed, not just its organization.
  cell_types:
  - preferred_term: peripheral nervous system neuron
    term:
      id: CL:2000032
      label: peripheral nervous system neuron

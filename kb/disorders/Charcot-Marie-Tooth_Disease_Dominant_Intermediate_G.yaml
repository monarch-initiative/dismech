treatments:
- name: Multidisciplinary Symptomatic Management
  description: >-
    No disease-modifying therapy exists for NEFL-related CMT. Management is the
    generic CMT package of rehabilitation, orthotics and orthopaedic care. No
    treatment study specific to CMTDIG was found.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk to offspring, but
    a high de novo rate — roughly half of NEFL families in one national series —
    so an isolated case does not exclude the diagnosis and parental testing is
    informative.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Eight de novo cases (FC549 in CMT1F; FC441, FC838, and FC984 in CMTDIG;
      and FC21, FC264, FC497, and FC930 in CMT2E) were identified at a rate of
      0.47 based on a trio-family analysis
    explanation: >-
      The de novo rate that genetic counselling has to communicate.
differential_diagnoses:
- name: NEFL-Related CMT2E and CMT1F
  description: >-
    The nearest differentials are the other two electrophysiological
    presentations of the same gene, and the boundary is a conduction-velocity
    threshold rather than a biological one. The same variant, including the
    CMTDIG-defining p.Glu396Lys, has been reported in patients classified CMT1F.
    dismech curates NEFL-related CMT2E as a subtype of Charcot-Marie-Tooth
    Disease Type 2.
  evidence:
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In fact, different individuals with the same mutation can be classified as
      having axonal, demyelinating, or dominant intermediate forms of the
      disease.
    explanation: >-
      States the overlap that makes these differentials inseparable on genotype.
- name: Hereditary Cerebellar Ataxia
  description: >-
    The N98S proband was worked up as sporadic early-onset cerebellar ataxia with
    peripheral neuropathy, and screened negative for SCA and autosomal recessive
    ataxia genes, before NEFL was found. A CMTDIG patient presenting with ataxia
    can therefore be missed for years.
  evidence:
  - reference: PMID:26645395
    reference_title: "NEFL N98S mutation: another cause of dominant intermediate Charcot-Marie-Tooth disease with heterogeneous early-onset phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      By then, a working diagnosis of sporadic early onset cerebellar ataxia with
      peripheral neuropathy was established. Screening of mutations associated
      with SCA and autosomal recessive cerebellar ataxias was negative.
    explanation: >-
      Documents the misdiagnosis actually occurring.
- name: Other Intermediate CMT Subtypes
  description: >-
    DI-CMTB (DNM2), DI-CMTC (YARS1), DI-CMTF (GNB4) and RI-CMTB (KARS1) are
    curated as has_subtypes entries on Intermediate Charcot-Marie-Tooth Disease.
    Unlike those, CMTDIG's gene also produces demyelinating and axonal
    presentations, so the intermediate label is less stable here than in the
    others.
discussions:
- discussion_id: cmtdig_is_a_presentation_not_an_entity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Charcot-Marie-Tooth Disease Dominant Intermediate G
  - pathophysiology#Intermediate-Range Nerve Conduction Slowing
  prompt: >-
    Is CMTDIG a distinct disease, or an electrophysiological presentation of one
    autosomal dominant NEFL neuropathy that also presents as CMT1F and CMT2E?
  rationale: >-
    Two independent authorities say the latter. A dedicated review of the NEFL
    clinical literature found no correlation between variant, protein domain and
    disease classification, found six variants each reported under more than one
    label, and concluded that all NEFL-related CMT is axonal in nature. ClinGen
    curates one autosomal dominant NEFL-CMT gene-disease relationship and does
    not recognize CMT1F, CMT2E or CMTDIG as separate entities. Against that,
    MONDO and OMIM both carry CMTDIG as its own concept, the label is in active
    clinical use — applied to 29% of kindreds in a pooled literature analysis and
    64.9% of patients in a Korean national cohort — and one cohort reports a leg
    MRI compartment pattern that differs between the three groups.

    This entry is curated as a Disease because the concept is real, uncurated and
    in use, and because the mechanism by which conduction becomes intermediate is
    worth stating explicitly. It should not be read as an assertion that CMTDIG
    is mechanistically distinct from CMT2E; the entry says the opposite. A
    curator who preferred to fold this into the NEFL subtype of
    Charcot-Marie-Tooth Disease Type 2 would be acting on the same evidence, and
    this discussion exists so that decision can be made from the record rather
    than made again from scratch.
- discussion_id: cmtdig_central_nervous_system_substrate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Central Nervous System Involvement
  prompt: >-
    What is the substrate of the central nervous system involvement in
    dominant-intermediate NEFL neuropathy?
  rationale: >-
    The defining pedigree has abnormal multimodal evoked potentials, an abnormal
    blink reflex and a spastic gait; a second pedigree has cerebellar ataxia with
    cerebellar atrophy. The Nefl N98S mouse shows neurofilament aggregation in
    cerebellum, cortex and pons, which is a plausible substrate, but no human
    neuropathology has been reported and no imaging or electrophysiological
    series has quantified central involvement in this group. The edge into the
    central node is therefore typed as having unknown intermediates.
- discussion_id: cmtdig_no_model_of_the_defining_feature
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  prompt: >-
    Does any animal model reproduce intermediate-range conduction slowing, the
    feature that defines this entity?
  rationale: >-
    Both available knock-in mice carry variants reported in
    dominant-intermediate pedigrees — N98S, and the murine equivalent of the
    CMTDIG-defining E396K — and both are characterized and published by their
    authors as models of CMT2E. The E397K longitudinal electrophysiology reports
    distal latency, CMAP amplitude and negative area, which is an axonal pattern;
    conduction velocity is not among the reported measures. So the models
    reproduce the neurofilament and calibre mechanism well and say nothing about
    the electrophysiological threshold that gives the entity its name. This is
    consistent with the view that the intermediate label reflects human
    presentation variability rather than a separate mechanism, but it has not
    been tested.
  proposed_experiments:
  - experiment_id: cmtdig_e397k_conduction_velocity
    name: Conduction velocity phenotyping of the Nefl E397K knock-in mouse
    description: >-
      Measure motor nerve conduction velocity longitudinally in Nefl(+/E397K)
      mice against wild-type littermates, and relate it to axon calibre
      distribution and myelin morphometry in the same nerves.
    would_support:
    - pathophysiology#Failure of Radial Axonal Growth
    supporting_outcome:
    - >-
      Conduction velocity falls in proportion to the loss of large-calibre axons
      while myelin thickness relative to a matched axon is preserved, confirming
      that reduced calibre alone produces the slowing.
    would_refute:
    - pathophysiology#Failure of Radial Axonal Growth
    refuting_outcome:
    - >-
      Conduction velocity is preserved despite reduced axon calibre, or falls
      only where myelin is abnormal, which would mean the calibre mechanism does
      not explain the human intermediate velocities.
notes: >-
  Entry type. Curated as a standalone Disease. MONDO:0036484 and OMIM 617882 both
  carry CMTDIG as a concept, no dismech entry binds it, and dismech's
  Intermediate Charcot-Marie-Tooth Disease entry lists DI-CMTB, DI-CMTC, DI-CMTF
  and RI-CMTB but not this one, so the intermediate compartment has a real gap
  here. The countervailing evidence — that the label is a presentation category
  within one dominant NEFL disease — is substantial and is recorded as a
  discussion rather than buried, together with the alternative disposition. No
  existing entry was modified; in particular the NEFL coverage on
  Charcot-Marie-Tooth Disease Type 2 (CMT2E subtype, NEFL genetic record,
  neurofilament assembly node, NEFL-targeting ASO treatment) is real and was left
  alone.

  Named entity confusion. NEFL is the hard case in this batch and gene-frequency
  preflight (PASS, 81 mentions) establishes nothing, because almost all of the
  literature it would pass is about something else. Three separate off-target
  bodies were excluded by hand:

  1. Serum neurofilament light as a biomarker. This is one of the most-measured
  proteins in neurology and dismech itself cites it that way in Frontotemporal
  Dementia. Not one biomarker paper is cited here. The one place NfL appears in
  this entry's sources is as a treatment-response measure in a mouse, and it is
  not curated.

  2. The other NEFL diseases. CMT1F and CMT2E are the same gene and frequently
  the same variant. Every clinical citation here was checked to be about a
  patient or cohort classified as dominant intermediate, or is explicitly labelled
  in its explanation as a NEFL-wide figure being used for context — the 70.3%
  ataxia frequency, the 21 sural biopsies and the under-1%-of-CMT figure are all
  marked that way and none of them sets a frequency band. Autosomal recessive
  NEFL CMT is a different ClinGen entity and is excluded.

  3. Giant axonal neuropathy. dismech's Giant_Axonal_Neuropathy_1 entry involves
  neurofilament biology but is caused by GAN, not NEFL. No source from it is used.

  Frequency bands. Only one phenotype carries a band, and it is OBLIGATE by
  definition rather than by observation: intermediate-range conduction slowing is
  the criterion for applying the label. Every other phenotype rests on two
  pedigrees totalling six patients, which is too few to band, so `frequency` is
  left absent and the description says what was actually observed in how many
  people. The 70.3% ataxia figure is curated but explicitly not used as a band,
  because it is a NEFL-wide figure spanning all three subgroups.

  The animal models are labelled CMT2E by their own authors. Both are curated
  anyway, because both carry variants reported in dominant-intermediate pedigrees
  and both measure the neurofilament and calibre steps this entry depends on. The
  mismatch is recorded structurally with a FAILS_TO_RECAPITULATE link and a
  HUMAN_MODEL_MISMATCH discussion rather than smoothed over. The
  FAILS_TO_RECAPITULATE readout carries `supports: NO_EVIDENCE`, not `REFUTE`:
  conduction velocity is absent from the reported measures, so this is a missing
  experiment, not a measured normal result.

  Tooling. `just clingen-refresh` exits non-zero on a drifted sha256 against the
  2026-08-13 pin, but it downloads gene_validity.csv before failing, and
  `just clingen-rebuild --id ...` then works against the file on disk. That is how
  the ClinGen record cited here was produced. The manifest was not repinned.

  Non-cell-autonomous myelin findings. Onion bulbs are curated as a phenotype and
  as a downstream consequence of the axonal node, not as evidence of primary
  demyelination. NEFL is a neuronal protein that Schwann cells do not express, so
  any myelin-range finding in this disease has to be secondary to the axon. This
  is the same argument as the calibre explanation of intermediate conduction,
  seen histologically instead of electrophysiologically.

  Not curated. No prevalence rate — none exists and none can be derived from a
  threshold-defined category, so the record is CASES_IN_LITERATURE with
  ULTRA_RARE and the two irreconcilable within-NEFL shares in its notes. No
  biochemical block. No datasets block. No treatments beyond supportive care and
  counselling: an NEFL-targeting antisense oligonucleotide and CRISPR haplotype
  editing are in preclinical development for dominant NEFL neuropathy, and
  dismech already carries the ASO on Charcot-Marie-Tooth Disease Type 2, but
  neither has been reported in a CMTDIG-classified patient and neither is curated
  here.

- name: Nefl E397K knock-in mouse
  species: Mouse
  genotype: Nefl(+/E397K)
  description: >-
    Knock-in of the murine E397K residue corresponding to human E396K. Heterozygous and homozygous
    mice show axonal morphometric and electrophysiological abnormalities. The heterozygote
    models the dominant human genotype; its time course must be distinguished from that of
    homozygotes.
  publication: PMID:40635134
  modeled_mechanisms:
  - target: Reduced Axonal Calibre
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Sciatic nerve axon area, diameter and g-ratio are reduced from P21. The study also measures
      distal latency, CMAP amplitude and negative area, with age- and genotype-dependent effects;
      these measurements do not establish a human intermediate conduction phenotype.
    limitations: >-
      A smaller g-ratio indicates a smaller axon relative to the whole myelinated fibre, not
      proof that all myelin properties are normal. In the longitudinal study distal latency
      increased from P90 in heterozygotes and P21 in homozygotes. Formal motor nerve conduction
      velocity was not measured, so failure to reproduce intermediate velocity cannot be inferred
      from this study or its CMT2E label.
    readouts:
    - name: Sciatic nerve axon area, diameter and g-ratio
      target: Reduced Axonal Calibre
      direction: DECREASED
      interpretation: >-
        The axon fails to reach normal calibre, the structural claim of this node.
      evidence:
      - reference: PMID:40635134
        reference_title: Novel neurofilament light (Nefl) E397K mouse models of Charcot-Marie-tooth type 2E (CMT2E) present early and chronic axonal neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          A significant reduction in the sciatic nerve axon area, diameter, and G-ratio was
          also present as early as P21.
        explanation: Reports the axonal morphometry.
    evidence:

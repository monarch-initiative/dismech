  name: Distal Sensory Impairment
  description: >-
    Length-dependent sensory loss accompanies the motor neuropathy. Vibration was more affected
    than pain in the Korean cohort, including its CMTDIG subgroup.
  phenotype_term:
    preferred_term: Distal sensory impairment

  - target: Distal Sensory Impairment
    causal_link_type: DIRECT
    description: Distal sensory involvement.
  - target: Pes Cavus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Foot deformity from imbalanced weakness of intrinsic and extrinsic foot muscles.
  - target: Proximal Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Ascending involvement of pelvic musculature in the more advanced reported patients.
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic neuromuscular impairment may contribute to spinal deformity; the cohort records

- name: Central Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    Central manifestations occur in some dominant-intermediate NEFL pedigrees. E396K carriers
    had abnormal multimodal evoked potentials, blink reflexes and spastic gait. An N98S proband
    had cerebellar ataxia, nystagmus, dysarthria and cerebellar atrophy. The Korean CMTDIG
    table also records dementia in two patients, without establishing a uniform cognitive
    syndrome or its neuropathological substrate. Gait ataxia can additionally have a peripheral
    sensory contribution.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Multimodal evoked potential and blink reflex studies revealed abnormalities indicative
      of central sensorimotor pathway dysfunction.
    explanation: >-
      Electrophysiological evidence of central involvement in the defining CMTDIG pedigree.
  - reference: PMID:26645395
    reference_title: "NEFL N98S mutation: another cause of dominant intermediate Charcot-Marie-Tooth disease with heterogeneous early-onset phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the proband, cranial magnetic resonance imaging (MRI) showed cerebellar atrophy,
      electromyography disclosed active denervation in tibialis anterior, and MRI of lower-limb
      musculature demonstrated widespread and distally accentuated muscle fatty atrophy
    explanation: >-
      Imaging evidence of cerebellar involvement in a second dominant-intermediate NEFL pedigree.
  downstream:
  - target: Ataxia
    causal_link_type: DIRECT
    description: Cerebellar ataxia in the reported severe phenotype.
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    description: The structural correlate on MRI.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: >-
      Part of the cerebellar syndrome in the same patient as the ataxia, not a bulbar consequence
      of the peripheral neuropathy.
  - target: Nystagmus
    causal_link_type: DIRECT
    description: >-
      Gaze-evoked nystagmus, recorded alongside the ataxia and dysarthria.
  - target: Spastic Gait
    causal_link_type: DIRECT
    description: Corticospinal involvement in the defining pedigree.
  - target: Dementia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported cognitive decline is consistent with central involvement, but its mechanism
      and attribution are incompletely characterized.
phenotypes:
- category: Neurological
  name: Intermediate-Range Motor Nerve Conduction Slowing
  description: >-
    Motor nerve conduction is typically intermediate, but measurements need not remain within
    25–45 m/s in every nerve or patient. The Korean CMTDIG median-nerve range was 32.9–49.0
    m/s. The N98S pedigree also showed demyelinating-range slowing when CMAPs were severely
    attenuated.
  phenotype_term:
    preferred_term: Intermediate-range motor nerve conduction slowing
    term:
      id: HP:0003431
      label: Decreased motor nerve conduction velocity
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Electrophysiology showed uniform nerve conduction slowing in the intermediate range,
      both in distal and proximal nerve segments.
    explanation: >-
      The defining electrophysiological finding.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The median MNCVs of CMTDIG patients were 39.7 ± 4.4 m/s (range 32.9–49.0 m/s).
    explanation: >-
      The observed CMTDIG subgroup includes values above 45 m/s.
- category: Neurological
  name: Distal Muscle Weakness
  description: >-
    Weakness predominantly affects distal lower-limb muscles, with variable distal upper-limb
    involvement. Severity varies between families and within families; the four patients in
    the E396K pedigree had moderate to severe CMT neuropathy scores.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      CMT neuropathy score ranged from 14 to 26 (moderate to severe disease).
    explanation: >-
      Quantifies overall neuropathy severity in the four-patient pedigree; the cohort evidence
      separately supports distal localization.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In all patients, muscle weakness and atrophy predominated in the distal parts of the
      lower extremities, and the proximal portions of the extremities were relatively preserved.
    explanation: >-
      Describes distal predominance in the cohort, which includes 24 CMTDIG patients; Table
      2 shows variation in atrophy and upper-limb weakness.

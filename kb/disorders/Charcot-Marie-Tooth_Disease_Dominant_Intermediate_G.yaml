inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous NEFL missense variants, transmitted dominantly. De novo variants are common:
    eight of 17 NEFL families in a Korean national series were de novo, three of them in the
    CMTDIG subgroup, so a negative family history does not argue against the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_57ec533a-b1cb-4d1d-b12a-61ee6ac6ab07-2023-01-10T170000.000Z
    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "NEFL | HGNC:7739 | Charcot-Marie-Tooth disease | MONDO:0015626 | AD | Definitive"
    explanation: >-
      ClinGen classifies autosomal dominant NEFL-related CMT as a definitive gene-disease
      relationship.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Eight de novo cases (FC549 in CMT1F; FC441, FC838, and FC984 in CMTDIG; and FC21, FC264,
      FC497, and FC930 in CMT2E) were identified at a rate of 0.47 based on a trio-family
      analysis
    explanation: >-
      Quantifies the de novo rate and names three CMTDIG families among the de novo cases.
pathophysiology:
- name: Heterozygous NEFL Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants in NEFL encode abnormal neurofilament light subunits. CMTDIG
    pedigrees include p.Glu396Lys near the rod–tail junction and p.Asn98Ser; p.Leu312Pro and
    p.Ile384Phe also occur in intermediate-classified families. ClinGen supports a gain-of-function
    mechanism for dominant NEFL-related CMT, but the consequences for filament assembly, localization
    and stability depend on the variant and experimental context. This dominant presentation
    is distinct from neuropathy due to biallelic truncating variants within the rod domain.
  genetic_context:
    gene:
      preferred_term: NEFL
      term:
        id: hgnc:7739
        label: NEFL
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: CGGV:assertion_57ec533a-b1cb-4d1d-b12a-61ee6ac6ab07-2023-01-10T170000.000Z
    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      The mechanism of pathogenicity appears to be a gain-of-function due to misdistribution
      and aggregate formations of NFL.
    explanation: >-
      ClinGen's mechanism statement, which is the basis for the functional_impact_category
      set on this node.
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The purpose of the study was to describe a pedigree with NEFL E396K mutation associated
      with a novel dominant intermediate Charcot-Marie-Tooth disease (DI-CMT) phenotype.
    explanation: >-
      Links the E396K allele to a dominant-intermediate pedigree.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Where the inheritance pattern of the mutations is known, it is always autosomal dominant
      for the in-frame deletion and missense mutations and autosomal recessive for the nonsense
      mutations located in the rod domain.
    explanation: >-
      Separates the dominant missense alleles relevant to CMTDIG from the recessive null alleles,
      which cause a different disease.
  downstream:
  - target: Abnormal Neurofilament Organization
    causal_link_type: DIRECT
    description: >-
      Variant-dependent perturbation of neurofilament organization; complete failure of co-assembly
      is not a universal effect.
  - target: Central Nervous System Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some NEFL pedigrees have central manifestations; the causal intermediates remain incompletely
      defined.
  - target: Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hearing loss occurs in several CMTDIG families; the lesion responsible is not localized
      by the cohort table.
  - target: Tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tremor occurs in CMTDIG, but its central versus peripheral origin is not established
      in the cohort.
- name: Abnormal Neurofilament Organization
  biological_scale: CELLULAR
  description: >-
    Abnormal neurofilament organization is a variant-dependent feature of dominant NEFL neuropathy.
    N98S mice have inclusions in neuronal cell bodies and proximal axons. Assembly assays
    are context dependent: the CMTDIG-associated I384F protein can still form filaments with
    alpha-internexin. Aggregation demonstrated for N98S therefore cannot be assumed for every
    CMTDIG allele.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neurofilament cytoskeleton organization
    term:
      id: GO:0060052
      label: neurofilament cytoskeleton organization
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: neurofilament
    term:
      id: GO:0005883
      label: neurofilament
  evidence:
  - reference: PMID:25552649
    reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Immunohistochemical analysis revealed multiple inclusions in the cell bodies and proximal
      axons of spinal cord neurons, disorganized processes in the cerebellum and abnormal
      processes in the cerebral cortex and pons.
    explanation: >-
      Shows the aggregation in vivo, and shows it in central as well as peripheral neurons.
  - reference: PMID:37848414
    reference_title: O-GlcNAcylation regulates neurofilament-light assembly and function and is perturbed by Charcot-Marie-Tooth disease mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Similarly, most of the CMT mutants we tested abrogated NF formation, whereas others
      (A149V, I384F, Y443N, K467N) were still able to form filaments with INA
    explanation: >-
      I384F retains filament formation in this cell assay, limiting any universal assembly-failure
      claim.
  downstream:
  - target: Reduced Axonal Neurofilament Content
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Somatic/proximal accumulation and reduced axonal content coexist in N98S mice; sequestration
      or impaired delivery is a proposed explanation, not a direct transport measurement.
  - target: Reduced Axonal Calibre
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered neurofilament organization may impair radial growth even without demonstrable
      depletion of axonal neurofilaments in every model.
- name: Reduced Axonal Neurofilament Content
  biological_scale: CELLULAR
  description: >-
    Sciatic axons in N98S knock-in mice contain fewer neurofilaments and more microtubules.
    This ultrastructural result measures altered axonal content; it does not by itself demonstrate
    complete failure of distal delivery. Neurofilament depletion is not established for every
    CMTDIG allele or experimental model.
  cell_types:
  - preferred_term: peripheral nervous system neuron
    term:
      id: CL:2000032
      label: peripheral nervous system neuron
  evidence:
  - reference: PMID:25552649
    reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Electron microscopic analysis of sciatic nerves showed a reduction in the number of
      neurofilaments, an increase in the number of microtubules and a decrease in the axonal
      diameters.
    explanation: >-
      Direct ultrastructural measurement of neurofilament loss from the peripheral axon and
      the accompanying loss of calibre.
  downstream:
  - target: Reduced Axonal Calibre
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced neurofilament content can impair radial growth and maintenance of axonal diameter.
- name: Reduced Axonal Calibre
  biological_scale: TISSUE
  description: >-
    Reduced axonal calibre is measured in N98S and E397K mouse models. Neurofilaments support
    radial growth and maintenance of axonal diameter, providing a mechanism by which abnormal
    filament organization or content can produce thin axons. This mechanism is shared across
    NEFL neuropathy models and does not uniquely explain assignment to the human intermediate
    category.
  biological_processes:
  - preferred_term: radial growth and maintenance of axon diameter
    term:
      id: GO:0031133
      label: regulation of axon diameter
    modifier: DECREASED
  evidence:
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Neurofilaments are neuron-specific intermediate filaments essential for the radial growth
      of axons during development and the maintenance of the axonal diameter.
    explanation: >-
      Establishes the normal function whose loss this node describes. Graded INDIRECT because
      it states the physiology rather than measuring the defect in CMTDIG patients.
  - reference: PMID:40635134
    reference_title: Novel neurofilament light (Nefl) E397K mouse models of Charcot-Marie-tooth type 2E (CMT2E) present early and chronic axonal neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      A significant reduction in the sciatic nerve axon area, diameter, and G-ratio was also
      present as early as P21.
    explanation: >-
      Measures reduced sciatic axonal calibre and g-ratio in E397K mice. A lower g-ratio denotes
      a smaller axon relative to total fibre diameter; it does not establish normal myelin
      in every respect.
  downstream:
  - target: Intermediate-Range Nerve Conduction Slowing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced calibre can contribute to slower conduction; its contribution relative to fibre
      loss and myelin changes in human CMTDIG is unresolved.
  - target: Length-Dependent Sensorimotor Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective cytoskeletal maintenance is a proposed contributor to progressive distal axonal
      degeneration.
- name: Intermediate-Range Nerve Conduction Slowing
  biological_scale: TISSUE
  description: >-
    Intermediate motor conduction slowing characterizes the presentation, commonly described
    using an approximate 25–45 m/s band. Reported CMTDIG values overlap adjacent categories:
    median motor velocities in the Korean cohort ranged from 32.9 to 49.0 m/s, and the N98S
    pedigree had demyelinating-range slowing where CMAPs were severely attenuated. Reduced
    axonal calibre and preferential loss of large fibres can contribute to slowing, while
    associated myelin abnormalities are not excluded.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Electrophysiology showed uniform nerve conduction slowing in the intermediate range,
      both in distal and proximal nerve segments.
    explanation: >-
      The electrophysiological finding that defines this entity, in the defining pedigree.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      although intermediate forms of CMT with MNCV of 25-45 m/s are also recognised
    explanation: >-
      Gives the conduction velocity band that defines the intermediate category.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      However, it is important to note that axonal conduction velocity is also influenced
      by other factors including axonal caliber (Waxman 1980). Thus, a widespread reduction
      in axonal caliber could also result in a reduction in NCV.
    explanation: >-
      The review identifies calibre as a potential contributor to conduction slowing; it does
      not establish the exclusive mechanism in CMTDIG.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The median MNCVs of CMTDIG patients were 39.7 ± 4.4 m/s (range 32.9–49.0 m/s).
    explanation: >-
      The observed CMTDIG subgroup includes values above 45 m/s.
  - reference: PMID:29940160
    reference_title: Myelinated axons fail to develop properly in a genetically authentic mouse model of Charcot-Marie-Tooth disease type 2E.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      The amplitude and the nerve conduction velocity of the caudal nerves were reduced in
      proportion with the diminished sizes of myelinated axons.
    explanation: >-
      N98S mice directly demonstrate reduced conduction velocity associated with small myelinated
      axons; this is not validation of a human numerical classification threshold.
  downstream:
  - target: Intermediate-Range Motor Nerve Conduction Slowing
    causal_link_type: DIRECT
    description: The measured electrophysiological abnormality.
- name: Length-Dependent Sensorimotor Axonal Degeneration
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The clinical neuropathy: distal-predominant weakness, wasting and sensory loss with foot
    deformity, which in the more severely affected reported families ascends to involve pelvic
    musculature and produces a waddling gait. Sural nerve biopsies in NEFL-related CMT show
    preferential loss of large myelinated fibres.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Their clinical picture was characterized by pes cavus, sensorimotor neuropathy and spastic
      gait. Both older patients showed ascending leg weakness to involve pelvic musculature.
    explanation: >-
      The clinical syndrome in the defining CMTDIG pedigree.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Although the reduced velocities may well be mainly explained by preferential loss of
      large-myelinated fibres confirmed in 21 sural nerve biopsies
    explanation: >-
      The nerve-biopsy correlate. Graded INDIRECT because the 21 biopsies come from NEFL-related
      CMT as a whole rather than from CMTDIG patients specifically.
  - reference: PMID:12566280
    reference_title: Mutations in the neurofilament light chain gene (NEFL) cause early onset severe Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      We report the first nerve biopsy of a CMT patient with a de novo missense mutation in
      NEFL, and found an axonal pathology with axonal regeneration clusters and onion bulb
      formations.
    explanation: >-
      Axonal pathology and onion bulbs coexist in NEFL neuropathy. This biopsy does not establish
      the relative primary or secondary contributions of axon and myelin abnormalities in
      all CMTDIG patients.
  downstream:
  - target: Onion Bulb Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Associated myelin remodelling may accompany chronic axonal neuropathy; the sequence
      is inferred.
  - target: Claw Hand Deformity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intrinsic hand muscle weakness with preserved long flexors produces the clawed posture.
  - target: Areflexia
    causal_link_type: DIRECT
    description: Loss of the afferent limb of the tendon reflex.
  - target: Delayed Ability to Walk
    causal_link_type: DIRECT
    description: >-
      In the early-onset pedigree the neuropathy is present before walking is acquired, so
      it delays the milestone rather than degrading a skill already gained. The mildly affected

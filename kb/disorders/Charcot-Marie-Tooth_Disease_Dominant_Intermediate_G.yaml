imaging_findings:
- name: Posterior-compartment-predominant lower-limb muscle fat infiltration
  description: >-
    In a Korean series that stratified leg MRI by electrophysiological subgroup,
    fat infiltration in the CMTDIG group predominated in the posterior
    compartment, whereas CMT2E patients showed anterior and anterolateral
    involvement and CMT1F patients were affected evenly. This is the only
    reported observation that separates the three NEFL presentations by
    something other than conduction velocity, and it rests on one cohort.
  evidence:
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All compartments were evenly affected in CMT1F patients. The anterior and
      anterolateral compartments were affected in CMT2E, and the posterior
      compartment was affected in CMTDIG.
    explanation: >-
      The compartment pattern reported for the CMTDIG subgroup.

  - target: Intermediate-Range Nerve Conduction Slowing
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The human pedigree carrying this variant is defined by uniform slowing of
      conduction velocity into the intermediate range. The mouse carrying the
      equivalent variant is reported with an axonal electrophysiological
      signature — distal latency and CMAP amplitude and negative area — and its

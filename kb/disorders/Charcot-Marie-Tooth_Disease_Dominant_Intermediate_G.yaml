- name: Central Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    CMTDIG is not confined to the peripheral nerve. In the defining pedigree,
    multimodal evoked potentials and blink reflex studies showed central
    sensorimotor pathway dysfunction, and the patients had a spastic gait. In a
    second dominant-intermediate pedigree the proband had cerebellar ataxia,
    nystagmus and dysarthria with cerebellar atrophy on MRI, and had been
    misdiagnosed as sporadic early-onset cerebellar ataxia. The route from NEFL
    aggregation to these findings is not established, which is why the edge into
    this node is typed as having unknown intermediates.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Multimodal evoked potential and blink reflex studies revealed
      abnormalities indicative of central sensorimotor pathway dysfunction.
    explanation: >-
      Electrophysiological evidence of central involvement in the defining
      CMTDIG pedigree.
  - reference: PMID:26645395
    reference_title: "NEFL N98S mutation: another cause of dominant intermediate Charcot-Marie-Tooth disease with heterogeneous early-onset phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the proband, cranial magnetic resonance imaging (MRI) showed cerebellar
      atrophy, electromyography disclosed active denervation in tibialis
      anterior, and MRI of lower-limb musculature demonstrated widespread and
      distally accentuated muscle fatty atrophy
    explanation: >-
      Imaging evidence of cerebellar involvement in a second
      dominant-intermediate NEFL pedigree.
  downstream:
  - target: Ataxia
    causal_link_type: DIRECT
    description: Cerebellar ataxia in the reported severe phenotype.
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
    description: The structural correlate on MRI.
  - target: Spastic Gait
    causal_link_type: DIRECT
    description: Corticospinal involvement in the defining pedigree.

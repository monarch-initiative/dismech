      - reference: PMID:40635134
        reference_title: Novel neurofilament light (Nefl) E397K mouse models of Charcot-Marie-tooth type 2E (CMT2E) present early and chronic axonal neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          A significant reduction in the sciatic nerve axon area, diameter, and
          G-ratio was also present as early as P21.

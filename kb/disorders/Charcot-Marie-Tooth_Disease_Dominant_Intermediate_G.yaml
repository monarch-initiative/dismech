- name: Nefl E397K knock-in mouse
  species: Mouse
  genotype: Nefl(+/E397K)
  description: >-
    Knock-in of the murine equivalent of human p.Glu396Lys, the variant of the
    pedigree that defines CMTDIG. It shows early and progressive axonal
    pathology, and it is the model that most directly tests whether the CMTDIG
    allele produces an intermediate phenotype.
  publication: PMID:40635134
  modeled_mechanisms:
  - target: Failure of Radial Axonal Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Sciatic axon area and diameter are significantly reduced from postnatal
      day 21 and worsen through twelve months, matching the failure of radial
      growth this entry places upstream of the conduction abnormality.
    limitations: >-
      The g-ratio falls together with the axon diameter, so the finding is a
      shrunken axon rather than a thinned sheath, and cannot be read as
      demyelination. More importantly, the authors characterize the model as
      CMT2E and report an axonal electrophysiological phenotype dominated by
      reduced CMAP amplitude, not the intermediate-range velocity slowing that
      the human carriers of this variant show.
    readouts:
    - name: Sciatic nerve axon area, diameter and g-ratio
      target: Failure of Radial Axonal Growth
      direction: DECREASED
      interpretation: >-
        The axon fails to reach normal calibre, the structural claim of this
        node.

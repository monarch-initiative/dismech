treatments:
- name: Multidisciplinary Symptomatic Management
  description: >-
    Management is symptomatic and individualized, following general CMT care: physical and
    occupational therapy, exercise within capacity, ankle-foot orthoses for foot drop, and
    orthopedic assessment for severe foot deformity. The recommendations are not based on
    a CMTDIG-specific treatment trial.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Treatment is symptomatic. Affected individuals are often evaluated and managed by a
      multidisciplinary team that includes neurologists, physiatrists, orthopedic surgeons,
      and physical and occupational therapists
    explanation: >-
      General CMT management guidance, extrapolated to this NEFL presentation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Affected individuals often require ankle/foot orthoses (AFOs) to correct foot drop and
      aid walking.
    explanation: >-
      Supports orthotic management for the shared CMT phenotype.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Exercise is encouraged within the individual's capability and many individuals remain
      physically active
    explanation: >-
      General CMT rehabilitation guidance.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Orthopedic surgery may be required to correct severe pes cavus foot deformity
    explanation: >-
      Supports individualized orthopedic management.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic Counseling
  description: >-
    For a constitutional heterozygous dominant NEFL variant, each child has a 50% chance of
    inheriting the variant; severity is variable. Parental testing can clarify apparent de
    novo disease. The eight de novo families in the Korean NEFL cohort are an ascertainment-specific
    observation, not a universal recurrence probability. Low-level parental mosaicism has
    been documented in wider NEFL neuropathy, so family-specific assessment remains important.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Eight de novo cases (FC549 in CMT1F; FC441, FC838, and FC984 in CMTDIG; and FC21, FC264,
      FC497, and FC930 in CMT2E) were identified at a rate of 0.47 based on a trio-family
      analysis
    explanation: >-
      Documents de novo occurrence in the ascertained cohort, including three CMTDIG families;
      this proportion is not the offspring transmission risk.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Each child of an individual with autosomal dominant CMT has a 50% chance of inheriting
      the pathogenic variant.
    explanation: >-
      Autosomal dominant transmission risk, applied to constitutional heterozygous NEFL disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38578900
    reference_title: Novel Genetic and Biochemical Insights into the Spectrum of NEFL-Associated Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A targeted Sanger sequencing revealed that the variant c.22C > T; p.(Pro8Ser) could
      be detected in the mildly affected father as a low-grade somatic mosaic (about 15% in
      peripheral blood).
    explanation: >-
      Parental mosaicism in a NEFL family, used as counseling context rather than a CMTDIG-specific
      frequency or a required somatic origin.
- name: Avoidance of neurotoxic medication exposure
  description: >-
    General CMT guidance identifies vincristine as particularly hazardous to peripheral nerves.
    Medication decisions require individualized assessment; this precaution is extrapolated
    to CMTDIG.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Chemotherapy for cancer that includes vincristine may be especially damaging to peripheral
      nerves and severely worsen CMT
    explanation: >-
      General CMT precaution rather than a CMTDIG-specific intervention study.
    quote_role: REVIEW_SYNTHESIS
- name: NEFL-targeting antisense oligonucleotide research
  description: >-
    An experimental antisense approach targeting the heterozygous N98S gain-of-function variant
    reduced axonal-degeneration biomarkers in patient-derived induced motor neurons. The donor
    was classified as CMT2E. This is preclinical evidence relevant to a shared NEFL allele,
    not demonstrated treatment efficacy in CMTDIG patients.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  evidence:
  - reference: PMID:39008620
    reference_title: Customized antisense oligonucleotide-based therapy for neurofilament-associated Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Our findings demonstrated a significant decrease in clinically relevant biomarkers of
      axonal degeneration
    explanation: >-
      The result comes from treated iPSC-derived motor neurons; biomarker reduction does not
      establish clinical benefit.
  oligonucleotide_details:
    target_gene:
      preferred_term: NEFL
      term:
        id: hgnc:7739
        label: NEFL
- name: Allele-selective NEFL genome editing research
  description: >-
    Cas9 disruption of the mutant N98S allele in patient-derived iPSCs ameliorated abnormal
    NF-L accumulation in subsequently differentiated motor neurons. Editing occurred before
    neuronal differentiation; the study does not demonstrate reversal in mature human nerves.
    The donor was classified as CMT2E, and application to CMTDIG remains preclinical.
  evidence:
  - reference: PMID:34485306
    reference_title: Allele-Specific Gene Editing Rescues Pathology in a Human Model of Charcot-Marie-Tooth Disease Type 2E.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      We selectively inactivated the disease NEFL allele in patient iPSCs using Cas9 enzymes
      to introduce a frameshift at the pathogenic N98S mutation. Motor neurons carrying this
      allele-specific frameshift demonstrated an amelioration of the disease phenotype comparable
      to that seen in an isogenic control with precise correction of the mutation.
    explanation: >-
      Allele-selective editing in a patient iPSC model, not a clinical treatment or demonstration
      of restored human conduction velocity.
  therapeutic_modality: GENE_EDITING
differential_diagnoses:
- name: NEFL-Related CMT2E and CMT1F
  description: >-
    The nearest differentials are the other two electrophysiological presentations of the
    same gene, and the boundary is a conduction-velocity threshold rather than a biological
    one. The same variant, including the CMTDIG-defining p.Glu396Lys, has been reported in
    patients classified CMT1F. dismech curates NEFL-related CMT2E as a subtype of Charcot-Marie-Tooth
    Disease Type 2.
  evidence:
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In fact, different individuals with the same mutation can be classified as having axonal,
      demyelinating, or dominant intermediate forms of the disease.
    explanation: >-
      States the overlap that makes these differentials inseparable on genotype.
- name: Hereditary Cerebellar Ataxia
  description: >-
    The N98S proband was worked up as sporadic early-onset cerebellar ataxia with peripheral
    neuropathy, and screened negative for SCA and autosomal recessive ataxia genes, before
    NEFL was found. A CMTDIG patient presenting with ataxia can therefore be missed for years.
  evidence:
  - reference: PMID:26645395
    reference_title: "NEFL N98S mutation: another cause of dominant intermediate Charcot-Marie-Tooth disease with heterogeneous early-onset phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      By then, a working diagnosis of sporadic early onset cerebellar ataxia with peripheral
      neuropathy was established. Screening of mutations associated with SCA and autosomal
      recessive cerebellar ataxias was negative.
    explanation: >-
      Documents the misdiagnosis actually occurring.
- name: Other Intermediate CMT Subtypes
  description: >-
    Other dominant intermediate CMT forms include DNM2-related DI-CMTB, YARS1-related DI-CMTC
    and GNB4-related DI-CMTF. Clinical overlap makes molecular diagnosis important; the intermediate
    electrophysiological label alone does not identify the causal gene.
  evidence:

      G-ratio was also present as early as P21.
    explanation: >-
      Measures reduced axonal calibre in a mouse carrying the murine equivalent
      of the CMTDIG variant p.Glu396Lys. Note the g-ratio falls together with
      axon diameter, meaning the axon shrank relative to its sheath; this is not
      a demyelination finding.
  downstream:
  - target: Intermediate-Range Nerve Conduction Slowing
    causal_link_type: DIRECT
    description: >-
      Conduction velocity scales with axonal calibre, so a thin axon conducts
      slowly even with an intact myelin sheath.
  - target: Length-Dependent Sensorimotor Axonal Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      An axon that cannot build or maintain its cytoskeleton eventually
      degenerates, longest fibres first.
- name: Intermediate-Range Nerve Conduction Slowing
  biological_scale: TISSUE
  description: >-
    Upper-limb motor conduction velocities fall in the intermediate band of
    roughly 25-45 m/s, in proximal as well as distal nerve segments, and this is
    what the CMTDIG label denotes. The important interpretive point is that a
    slow velocity is conventionally read as demyelination, but velocity also
    depends on axonal calibre — so a widespread reduction in calibre produces
    the same reading with normal myelin. NEFL is a neuronal protein and is not
    expressed in myelinating cells at all.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Electrophysiology showed uniform nerve conduction slowing in the
      intermediate range, both in distal and proximal nerve segments.
    explanation: >-
      The electrophysiological finding that defines this entity, in the
      defining pedigree.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      although intermediate forms of CMT with MNCV of 25-45 m/s are also
      recognised
    explanation: >-
      Gives the conduction velocity band that defines the intermediate category.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      However, it is important to note that axonal conduction velocity is also
      influenced by other factors including axonal caliber (Waxman 1980). Thus,
      a widespread reduction in axonal caliber could also result in a reduction
      in NCV.
    explanation: >-
      States the interpretive argument that links the calibre node to the
      conduction node without invoking demyelination.
  downstream:
  - target: Intermediate-Range Motor Nerve Conduction Slowing
    causal_link_type: DIRECT
    description: The measured electrophysiological abnormality.
- name: Length-Dependent Sensorimotor Axonal Degeneration
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The clinical neuropathy: distal-predominant weakness, wasting and sensory
    loss with foot deformity, which in the more severely affected reported
    families ascends to involve pelvic musculature and produces a waddling gait.
    Sural nerve biopsies in NEFL-related CMT show preferential loss of large
    myelinated fibres.
  evidence:
  - reference: PMID:25877835
    reference_title: NEFL E396K mutation is associated with a novel dominant intermediate Charcot-Marie-Tooth disease phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Their clinical picture was characterized by pes cavus, sensorimotor
      neuropathy and spastic gait. Both older patients showed ascending leg
      weakness to involve pelvic musculature.
    explanation: >-
      The clinical syndrome in the defining CMTDIG pedigree.
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Although the reduced velocities may well be mainly explained by
      preferential loss of large-myelinated fibres confirmed in 21 sural nerve
      biopsies
    explanation: >-
      The nerve-biopsy correlate. Graded INDIRECT because the 21 biopsies come
      from NEFL-related CMT as a whole rather than from CMTDIG patients
      specifically.
  - reference: PMID:12566280
    reference_title: Mutations in the neurofilament light chain gene (NEFL) cause early onset severe Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We report the first nerve biopsy of a CMT patient with a de novo missense
      mutation in NEFL, and found an axonal pathology with axonal regeneration
      clusters and onion bulb formations.
    explanation: >-
      Onion bulbs, the histological hallmark of demyelination and remyelination,
      appear in a nerve whose primary pathology is axonal and whose causal gene
      is not expressed by Schwann cells at all. This is the histological form of
      the entry's central claim: the myelin-range findings in NEFL neuropathy are
      secondary to the axon, not a primary Schwann-cell lesion.
  downstream:
  - target: Onion Bulb Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Repeated de- and remyelination around a failing axon produces onion bulbs
      without a primary myelin defect.
  - target: Claw Hand Deformity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intrinsic hand muscle weakness with preserved long flexors produces the
      clawed posture.
  - target: Areflexia
    causal_link_type: DIRECT
    description: Loss of the afferent limb of the tendon reflex.
  - target: Distal Muscle Weakness
    causal_link_type: DIRECT
    description: Distal motor involvement.
  - target: Distal Sensory Impairment
    causal_link_type: DIRECT
    description: Distal sensory involvement.
  - target: Pes Cavus

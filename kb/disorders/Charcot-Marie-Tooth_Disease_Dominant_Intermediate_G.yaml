diagnosis:
- name: Nerve conduction studies with NEFL sequencing
  description: >-
    Median or ulnar motor conduction velocity in the 25-45 m/s band in a patient
    with dominant or de novo sensorimotor neuropathy, confirmed by a heterozygous
    NEFL missense variant. Because the intermediate range is a threshold rather
    than a disease boundary, the same patient can be reclassified as CMT1F or
    CMT2E on a different study, and NEFL should be tested whichever band the
    velocity falls in.

  - reference: PMID:25552649
    reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Electron microscopic analysis of sciatic nerves showed a reduction in the
      number of neurofilaments, an increase in the number of microtubules and a
      decrease in the axonal diameters.
    explanation: >-
      Direct ultrastructural measurement of neurofilament loss from the
      peripheral axon and the accompanying loss of calibre.
  downstream:
  - target: Failure of Radial Axonal Growth
    causal_link_type: DIRECT
    description: >-
      Without axonal neurofilaments the axon cannot expand and maintain its
      diameter.
- name: Failure of Radial Axonal Growth
  biological_scale: TISSUE
  description: >-
    Neurofilaments are the structures responsible for radial growth of axons
    during development and for maintaining axonal diameter afterwards. Losing
    them from the axon leaves a thin axon. This is the step that makes CMTDIG
    intermediate rather than axonal or demyelinating, and it has been measured
    directly in the mouse carrying the CMTDIG variant, where sciatic axon area
    and diameter are reduced from postnatal day 21 onward.
  biological_processes:
  - preferred_term: radial growth and maintenance of axon diameter
    term:
      id: GO:0031133
      label: regulation of axon diameter
    modifier: DECREASED
  evidence:
  - reference: PMID:28501821
    reference_title: Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Neurofilaments are neuron-specific intermediate filaments essential for
      the radial growth of axons during development and the maintenance of the
      axonal diameter.

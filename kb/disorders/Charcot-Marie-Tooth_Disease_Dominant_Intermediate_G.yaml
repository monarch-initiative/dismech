    explanation: >-
      Establishes that the dominant disease is not a dosage effect, which is why
      the causal node is a missense allele rather than loss of the gene.
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Notably, the p.E396K mutation was found in both CMT1F and CMTDIG patients.

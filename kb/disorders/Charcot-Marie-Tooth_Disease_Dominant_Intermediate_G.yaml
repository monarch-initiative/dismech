    explanation: >-
      Identifies the alleles in the CMTDIG subgroup.
diagnosis:
- name: Nerve conduction studies with NEFL sequencing
  description: >-
    Clinical examination and nerve-conduction studies establish the sensorimotor neuropathy
    and characterize its electrophysiological presentation. Molecular testing identifies a
    pathogenic or likely pathogenic heterozygous NEFL variant; a variant of uncertain significance
    alone is not confirmation. Intermediate velocities support classification but do not form
    an absolute boundary, and NEFL is relevant to demyelinating and axonal presentations as
    well. Family testing informs inheritance and de novo assessment.
  evidence:
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the intermediate CMT subtype, which has median MNCVs of 25-45 m/s
    explanation: >-
      The conduction-velocity criterion by which the diagnosis is assigned.
  - reference: PMID:14733962
    reference_title: The novel neurofilament light (NEFL) mutation Glu397Lys is associated with a clinically and morphologically heterogeneous type of Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Thus, analysis of the neurofilament light gene should not be restricted to pure axonal
      neuropathies.
    explanation: >-
      The original family study supports considering NEFL despite slowed conduction.
imaging_findings:
- name: Posterior-compartment-predominant lower-limb muscle fat infiltration
  description: >-
    The Korean cohort showed posterior-calf-predominant muscle fat infiltration in CMTDIG,
    compared with anterior/anterolateral predominance in CMT2E and more even involvement in
    CMT1F. This observational pattern may aid phenotypic characterization but is not a validated
    diagnostic discriminator. Posterior muscle involvement also occurred in the E396K pedigree.
  evidence:
  - reference: PMID:35044100
    reference_title: Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All compartments were evenly affected in CMT1F patients. The anterior and anterolateral
      compartments were affected in CMT2E, and the posterior compartment was affected in CMTDIG.
    explanation: >-
      The compartment pattern reported for the CMTDIG subgroup.
animal_models:
- name: Nefl N98S knock-in mouse
  species: Mouse
  genotype: Nefl(N98S/+)
  description: >-
    Heterozygous N98S knock-in mice model an allele reported in both CMT2E and dominant-intermediate
    human neuropathy. Studies demonstrate neurofilament misdistribution, reduced axonal neurofilament
    content, small myelinated axons and reduced caudal nerve conduction velocity. Numerical
    human electrophysiological subtype thresholds are not validated in this mouse.
  publication: PMID:25552649
  modeled_mechanisms:
  - target: Abnormal Neurofilament Organization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Neurofilament inclusions appear in neuronal cell bodies and proximal axons, matching
      the misdistribution-and-aggregation mechanism ClinGen describes for the human disease.
    limitations: >-
      The model provides variant-specific mechanistic evidence. It does not establish that
      all CMTDIG alleles produce the same cellular phenotype or that mouse velocities map
      to the human intermediate band.
    readouts:
    - name: Neurofilament inclusions in neuronal cell bodies and proximal axons
      target: Abnormal Neurofilament Organization
      direction: INCREASED
      interpretation: >-
        Aggregated neurofilament protein accumulating where it is assembled rather than where
        it is needed.
      evidence:
      - reference: PMID:25552649
        reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          Immunohistochemical analysis revealed multiple inclusions in the cell bodies and
          proximal axons of spinal cord neurons, disorganized processes in the cerebellum
          and abnormal processes in the cerebral cortex and pons.
        explanation: Reports the inclusion measurement.
    evidence:
    - reference: PMID:25552649
      reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Immunohistochemical analysis revealed multiple inclusions in the cell bodies and proximal
        axons of spinal cord neurons, disorganized processes in the cerebellum and abnormal
        processes in the cerebral cortex and pons.
      explanation: Reports the inclusion measurement.
  - target: Reduced Axonal Neurofilament Content
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Sciatic nerve ultrastructure shows reduced neurofilament number and axonal diameter.
      These measurements establish altered axonal content, rather than directly measuring
      failure of neurofilament transport.
    limitations: >-
      The model provides variant-specific mechanistic evidence. It does not establish that
      all CMTDIG alleles produce the same cellular phenotype or that mouse velocities map
      to the human intermediate band.
    readouts:
    - name: Sciatic nerve neurofilament number and axonal diameter
      target: Reduced Axonal Neurofilament Content
      direction: DECREASED
      interpretation: >-
        Fewer neurofilaments and thinner axons, with microtubule number rising as the filaments
        are lost.
      evidence:
      - reference: PMID:25552649
        reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          Electron microscopic analysis of sciatic nerves showed a reduction in the number
          of neurofilaments, an increase in the number of microtubules and a decrease in the
          axonal diameters.
        explanation: Reports the ultrastructural measurements.
    evidence:
    - reference: PMID:25552649
      reference_title: Neurofilament light polypeptide gene N98S mutation in mice leads to neurofilament network abnormalities and a Charcot-Marie-Tooth Type 2E phenotype.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Electron microscopic analysis of sciatic nerves showed a reduction in the number of
        neurofilaments, an increase in the number of microtubules and a decrease in the axonal
        diameters.
      explanation: Reports the ultrastructural measurements.
  - target: Intermediate-Range Nerve Conduction Slowing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Caudal nerve conduction velocity and response amplitude were reduced in association
      with small myelinated axons.
    limitations: >-
      The study measures slowing in the N98S mouse, but does not establish equivalence to
      the human 25–45 m/s intermediate classification. Myelin sheaths were relatively thicker
      in mutant mice.
    readouts:
    - name: Caudal nerve conduction velocity
      target: Intermediate-Range Nerve Conduction Slowing
      direction: DECREASED
      interpretation: >-
        Direct evidence of reduced velocity, distinct from a distal latency measurement.
      evidence:

discussions:
- discussion_id: cmtdig_is_a_presentation_not_an_entity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Charcot-Marie-Tooth Disease Dominant Intermediate G
  - pathophysiology#Intermediate-Range Nerve Conduction Slowing
  prompt: >-
    Is CMTDIG a distinct disease, or an electrophysiological presentation of one autosomal
    dominant NEFL neuropathy that also presents as CMT1F and CMT2E?
  rationale: >-
    Clinical reviews document overlap between NEFL variants and electrophysiological classifications,
    and ClinGen distinguishes dominant from recessive NEFL neuropathy rather than separating
    the three conduction presentations. CMTDIG remains an established clinical and ontology
    concept, but a unique CMTDIG-specific mechanism has not been demonstrated. Cohort proportions
    depend on whether families or individuals are counted and on ascertainment. Posterior-calf
    MRI predominance is a reported phenotypic association whose diagnostic specificity remains
    uncertain.
- discussion_id: cmtdig_central_nervous_system_substrate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Central Nervous System Involvement
  prompt: >-
    What is the substrate of the central nervous system involvement in dominant-intermediate
    NEFL neuropathy?
  rationale: >-
    E396K and N98S pedigrees document central electrophysiological or cerebellar findings.
    The Korean cohort reports additional central-associated manifestations but no structural
    brain MRI lesions, showing that a uniform imaging substrate cannot be assumed. N98S mouse
    neurofilament abnormalities provide a candidate mechanism without establishing human neuropathology
    or the attribution of every gait or cognitive finding.
- discussion_id: cmtdig_model_conduction_comparability
  kind: KNOWLEDGE_GAP
  attaches_to:
  - animal_models#Nefl N98S knock-in mouse
  - animal_models#Nefl E397K knock-in mouse
  prompt: >-
    How do model-specific conduction abnormalities relate to the human intermediate classification?
  rationale: >-
    N98S mice have directly measured reduction of caudal nerve conduction velocity proportional
    to diminished myelinated axon size (PMID:29940160). The E397K study instead measures distal
    latency and CMAP amplitude/area; lack of a formal velocity measurement is an untested
    endpoint, not evidence of failure to recapitulate the phenotype. Species, nerves, ages
    and variant effects complicate comparison with human classification thresholds. Reduced
    calibre, loss of large fibres and associated myelin changes need joint assessment.
  proposed_experiments:
  - experiment_id: cmtdig_e397k_conduction_velocity
    experiment_design: TARGETED_PERTURBATION
    name: Conduction velocity phenotyping of the Nefl E397K knock-in mouse
    description: >-
      Measure motor nerve conduction velocity longitudinally in Nefl(+/E397K) mice against
      wild-type littermates, and relate it to axon calibre distribution and myelin morphometry
      in the same nerves.
    would_support:
    - pathophysiology#Reduced Axonal Calibre
    supporting_outcome:
    - >-
      Reduced velocity tracks smaller axonal calibre after accounting for fibre loss and myelin
      morphology, supporting a calibre contribution.
    would_refute:
    - pathophysiology#Reduced Axonal Calibre
    refuting_outcome:
    - >-
      Velocity does not track calibre, or is better explained by other measured nerve abnormalities,
      weakening the proposed calibre contribution in this model.
- discussion_id: cmtdig_variant_dependent_glycosylation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Abnormal Neurofilament Organization
  prompt: >-
    Does altered NF-L O-GlcNAcylation contribute to particular CMTDIG variants?
  rationale: >-
    Cell and biochemical experiments show that several CMT-associated variants alter NF-L
    O-GlcNAcylation and protein interactions, but glycosylation changes do not consistently
    predict filament assembly. I384F retains filament formation with alpha-internexin (PMID:37848414).
    Engineered glycosylation-site mutants and nonpatient neuronal experiments identify regulatory
    biology; they do not establish a universal CMTDIG mechanism or a clinically effective
    glycosylation-directed treatment.
notes: >-
  This entry describes the dominant intermediate presentation of NEFL neuropathy, with explicit
  overlap with CMT1F and CMT2E. Recessive NEFL null-allele neuropathy, primary muscle presentations
  and general circulating NfL biomarker studies do not define this phenotype. The GeneReviews
  PubMed overview abstract is a purpose statement rather than a subtype phenotype baseline;
  clinical features here derive from NEFL family studies and subtype-resolved cohort tables.
  The full GeneReviews overview supports general CMT care and inheritance counseling, not
  CMTDIG-specific penetrance. Cohort counts are not population frequency estimates. Experimental
  evidence is identified by variant and model, and therapeutic studies in N98S CMT2E-derived
  cells do not establish clinical efficacy in CMTDIG.

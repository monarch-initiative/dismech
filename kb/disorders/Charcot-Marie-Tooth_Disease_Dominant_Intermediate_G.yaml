      mutation associated with a novel dominant intermediate Charcot-Marie-Tooth
      disease (DI-CMT) phenotype.
    explanation: >-
      The pedigree that established the CMTDIG designation and its causal
      variant.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Where the inheritance pattern of the mutations is known, it is always
      autosomal dominant for the in-frame deletion and missense mutations and
      autosomal recessive for the nonsense mutations located in the rod domain.
    explanation: >-
      Separates the dominant missense alleles relevant to CMTDIG from the
      recessive null alleles, which cause a different disease.
  downstream:
  - target: Neurofilament Network Disruption and NFL Aggregation
    causal_link_type: DIRECT
    description: >-
      The mutant subunit co-assembles into the neurofilament network and
      disrupts it.
- name: Neurofilament Network Disruption and NFL Aggregation
  biological_scale: CELLULAR
  description: >-

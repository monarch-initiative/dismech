    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Based on the literature we differentiate between autosomal dominant NEFL
      CMT (MONDO:0015626), autosomal recessive NEFL CMT (MONDO:0018993).
    explanation: >-
      ClinGen's own statement of how it partitions NEFL disease — by inheritance,
      not by electrophysiological subtype.
  - reference: PMID:33993654
    reference_title: A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Individuals who are heterozygous for the null allele are asymptomatic,

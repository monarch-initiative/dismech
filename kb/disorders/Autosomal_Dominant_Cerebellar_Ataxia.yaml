    snippet: For the polyQ SCAs, the misfolded mutant polyQ proteins present a major challenge to cellular protein quality control systems.
    explanation: Misfolded expanded proteins challenge proteostasis; this is a synthesis across polyglutamine models.
  downstream:
  - target: Neuronal Polyglutamine Inclusions
    description: Misfolded expanded proteins can accumulate in inclusions.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

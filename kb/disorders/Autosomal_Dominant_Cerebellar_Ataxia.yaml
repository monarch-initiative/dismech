      id: hgnc:10549
      label: ATXN10
  evidence:
  - reference: PMID:11017075
    reference_title: Large expansion of the ATTCT pentanucleotide repeat in spinocerebellar ataxia type 10.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We found an expansion of a pentanucleotide (ATTCT) repeat in intron 9 of SCA10 in all patients in five Mexican SCA10 families.
    explanation: The discovery study locates the causal expansion in an intron of the gene now called ATXN10, in all affected members of five families.

- name: SCA10
  display_name: SCA10 (ATXN10 intronic ATTCT expansion)
  classification: molecular
  description: An intronic pentanucleotide (ATTCT) expansion in ATXN10, and therefore a noncoding-repeat rather than a polyglutamine disease. The reported syndrome combines slowly progressive cerebellar ataxia with seizures. MONDO parents this term under autosomal dominant cerebellar ataxia type IV, a Harding class this entry does not carry as a clinical row, so it is placed on the family entry rather than on the ADCA-I or ADCA-III entries.
  subtype_term:
    preferred_term: spinocerebellar ataxia type 10
    term:
      id: MONDO:0011330
      label: spinocerebellar ataxia type 10
  genes:
  - preferred_term: ATXN10

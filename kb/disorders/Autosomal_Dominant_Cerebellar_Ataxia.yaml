- name: ADCA-III
  display_name: ADCA Type III (pure cerebellar ataxia)
  classification: clinical
  description: Historical Harding type III describes a predominantly cerebellar syndrome, often slowly progressive and later in onset. SCA6 is a common example; the roster and degree of permitted extracerebellar involvement differ between clinical classifications. The Roman numeral III does not denote SCA3.
  evidence:
  - reference: PMID:7066668
    reference_title: The clinical features and classification of the late onset autosomal dominant cerebellar ataxias. A study of 11 families, including descendants of the 'the Drew family of Walworth'.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: a later onset (over 60 years) 'pure' cerebellar syndrome
    explanation: The original classification identifies a late-onset predominantly cerebellar presentation.
  - reference: PMID:30607747

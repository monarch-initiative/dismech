    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In the absence of available literature on palliative and end-of-life care in the ataxias specifically, these recommendations are derived in part from evidence of these interventions in other progressive neurodegenerative conditions
    explanation: The source explicitly states the extrapolated evidence base.
- name: Troriluzole investigational treatment
  description: In its November 4, 2025 complete-response letter, FDA concluded that the submitted trials and external-control analysis did not establish substantial evidence of efficacy for spinocerebellar ataxia. Concerns included a failed prespecified randomized primary endpoint, residual confounding, substantial missing data and nonprespecified analyses; the external-control result is not established disease modification. That decision did not approve the submitted SCA application; this dated regulatory conclusion does not assert a subsequent development outcome or established clinical benefit.

    explanation: Source for the dominant inheritance and the ataxia-with-seizures clinical description of this subtype.
- name: SCA44
  display_name: SCA44 (GRM1)
  classification: molecular
  description: 'Caused by heterozygous dominant variants in GRM1, which encodes the metabotropic glutamate receptor mGluR1. The reported alleles are not mechanistically uniform: gain-of-function missense variants segregated with adult-onset cerebellar ataxia in two families, while a de novo truncating variant acting as a dominant negative was associated with juvenile-onset ataxia and intellectual disability. A conventional-variant subtype, not a repeat expansion.'
  subtype_term:
    preferred_term: spinocerebellar ataxia 44
    term:
      id: MONDO:0033479
      label: spinocerebellar ataxia 44
  genes:
  - preferred_term: GRM1
    term:
      id: hgnc:4593
      label: GRM1
  evidence:
  - reference: PMID:28886343
    reference_title: Dominant Mutations in GRM1 Cause Spinocerebellar Ataxia Type 44.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Here, we describe heterozygous dominant mutations in GRM1, which encodes mGluR1, that are associated with distinct disease phenotypes: gain-of-function missense mutations, linked in two different families to adult-onset cerebellar ataxia, and a de novo truncation mutation resulting in a dominant-negative effect that is associated with juvenile-onset ataxia and intellectual disability.'
    explanation: Source for the GRM1 gene assignment and for the two distinct dominant allele mechanisms recorded in this row.
- name: SCA50
  display_name: SCA50 (NPTX1)
  classification: molecular
  description: 'Caused by heterozygous missense variants in NPTX1, which encodes the secreted protein neuronal pentraxin 1. The reported phenotype is a late-onset, slowly progressive cerebellar ataxia with downbeat nystagmus, cerebellar cognitive-affective features, myoclonic tremor and mild vermian atrophy. Note that the SCA50 designation has also been applied to GAA-FGF14 disease: the title of PMID:36493768 reads "An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14." This row is scoped to the NPTX1 disease that MONDO:0859334 denotes (OMIM:620158), resolved through that cross-reference rather than through the label.'
  subtype_term:
    preferred_term: spinocerebellar ataxia 50
    term:
      id: MONDO:0859334
      label: spinocerebellar ataxia 50
  genes:
  - preferred_term: NPTX1
    term:
      id: hgnc:7952
      label: NPTX1
  evidence:
  - reference: PMID:34788392
    reference_title: NPTX1 mutations trigger endoplasmic reticulum stress and cause autosomal dominant cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Our results establish NPTX1 as a new causative gene in autosomal dominant cerebellar ataxias.
    explanation: Source for the NPTX1 gene assignment in a dominant cerebellar ataxia.
  - reference: PMID:34788392
    reference_title: NPTX1 mutations trigger endoplasmic reticulum stress and cause autosomal dominant cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'The NPTX1-associated phenotype consists of a late-onset, slowly progressive, cerebellar ataxia, with downbeat nystagmus, cognitive impairment reminiscent of cerebellar cognitive affective syndrome, myoclonic tremor and mild cerebellar vermian atrophy on brain imaging.'
    explanation: Source for the clinical description recorded in this row.
- name: SCA51
  display_name: SCA51 (THAP11 CAG expansion)
  classification: molecular
  description: Caused by a coding CAG repeat expansion in THAP11, so a polyglutamine rather than a conventional-variant subtype. Reported expanded alleles carried 45 to 100 repeats against 20 to 38 in controls, and the length of the uninterrupted 3-prime CAG tract rather than the total repeat length tracked with polyglutamine toxicity. Detection has so far been concentrated in Chinese-ancestry pedigrees; a population survey of Genomics England, a UCL neurology cohort and UK Biobank concluded the expansion is rare in the British population. The gene symbol THAP11 (hgnc:23194) is not THAP1 (hgnc:20856), the DYT6 dystonia gene.
  subtype_term:
    preferred_term: spinocerebellar ataxia 51
    term:
      id: MONDO:0975800
      label: spinocerebellar ataxia 51
  genes:
  - preferred_term: THAP11
    term:
      id: hgnc:23194
      label: THAP11
  evidence:
  - reference: PMID:37148549
    reference_title: CAG Repeat Expansion in THAP11 Is Associated with a Novel Spinocerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'We identified THAP11 as the novel causative SCA gene with CAG repeats ranging from 45 to 100 in patients with ataxia and from 20 to 38 in healthy control subjects.'
    explanation: Source for the THAP11 gene assignment and for the patient and control repeat ranges quoted in this row.
  - reference: PMID:39651830
    reference_title: A Population-Wide Exploration of the THAP11 CAG Repeat Size and Structure in the 100,000 Genomes Project and UK Biobank.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'These results indicate that THAP11 expansions are rare in the British population and that sequence structures predisposed to expansions may be more common in non-British ancestries.'
    explanation: Population survey establishing that this subtype is rare outside the ancestries in which it was discovered. It qualifies the expected yield of testing rather than contradicting the gene-disease association.
- name: SCA52
  display_name: SCA52 (RAB3A)
  classification: molecular
  description: Caused by a heterozygous missense variant in RAB3A, a small GTPase of regulated exocytosis, reported in two families with adult-onset progressive cerebellar ataxia and cerebellar atrophy. The variant retains GTP binding but fails to bind the effectors RIM1 and Rabphilin-3A, so the proposed lesion is presynaptic rather than a repeat-expansion or protein-aggregation mechanism. A conventional-variant subtype.
  subtype_term:
    preferred_term: spinocerebellar ataxia 52
    term:
      id: MONDO:0981162
      label: spinocerebellar ataxia 52

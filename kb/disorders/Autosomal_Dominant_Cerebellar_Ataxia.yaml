    quote_role: PRIMARY_RESULT
    snippet: 'Here, we describe heterozygous dominant mutations in GRM1, which encodes mGluR1, that are associated with distinct disease phenotypes: gain-of-function missense mutations, linked in two different families to adult-onset cerebellar ataxia, and a de novo truncation mutation resulting in a dominant-negative effect that is associated with juvenile-onset ataxia and intellectual disability.'

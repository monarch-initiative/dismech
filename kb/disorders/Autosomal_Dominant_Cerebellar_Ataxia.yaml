  subtype: SCA51
  notes: 'THAP11 (hgnc:23194) must not be confused with THAP1 (hgnc:20856), the DYT6 dystonia gene. The pathogenic measure at this locus is the uninterrupted 3-prime CAG tract rather than total repeat length, so an assay reporting only total length can be misleading. Expansions have so far been found predominantly in Chinese-ancestry pedigrees.'
  evidence:
  - reference: PMID:37148549
    reference_title: CAG Repeat Expansion in THAP11 Is Associated with a Novel Spinocerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'We identified THAP11 as the novel causative SCA gene with CAG repeats ranging from 45 to 100 in patients with ataxia and from 20 to 38 in healthy control subjects.'
    explanation: Establishes THAP11 as causal and gives the patient and control repeat ranges.
  - reference: PMID:37148549
    reference_title: CAG Repeat Expansion in THAP11 Is Associated with a Novel Spinocerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Among the patients, the number of CAA interruptions within CAG repeats was decreased to 3 (up to 5-6 in controls), whereas the number of 3'' pure CAG repeats was up to 32 to 87 (4-16 in controls), suggesting that the toxicity of polyQ protein was length dependent on the pure CAG repeats.'
    explanation: Source for the claim that the uninterrupted CAG tract, not total repeat length, is the pathogenic measure at this locus.
  - reference: PMID:39651830
    reference_title: A Population-Wide Exploration of the THAP11 CAG Repeat Size and Structure in the 100,000 Genomes Project and UK Biobank.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'These results indicate that THAP11 expansions are rare in the British population and that sequence structures predisposed to expansions may be more common in non-British ancestries.'
    explanation: Population survey qualifying the expected yield of testing this locus outside the ancestries of discovery. It does not contradict the gene-disease association.
- name: RAB3A
  association: Causative heterozygous missense variant in SCA52
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RAB3A
    term:
      id: hgnc:9777
      label: RAB3A
  subtype: SCA52
  notes: One recurrent variant, p.Arg83Trp, in two families. The proposed lesion is a failure of effector binding rather than loss of GTP binding, which is why this is recorded as a conventional dominant variant and not as a null allele.
  evidence:
  - reference: PMID:41492970
    reference_title: An R83W mutation in Rab3A causes autosomal-dominant cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'In this study, we identified the c.247C > T p.(Arg83Trp) variant in RAB3A, encoding a small GTPase involved in membrane-associated regulated exocytosis, in two families with cerebellar ataxia.'
    explanation: Establishes RAB3A as causal in two families.
  - reference: PMID:41492970
    reference_title: An R83W mutation in Rab3A causes autosomal-dominant cerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although the mutant Rab3A R83W retained GTP-binding affinity, it failed to bind the key effector proteins RIM1 and Rabphilin-3A, highlighting the functional importance of R83 in effector complex formation, as supported by structural analysis.
    explanation: Source for the effector-binding rather than GTP-binding lesion recorded in this entry's notes.
treatments:
- name: Physical rehabilitation and mobility support
  description: Individualized balance, gait and strength training, mobility aids and fall-prevention adaptations support function. Goals and intensity depend on impairment and safety; rehabilitation is not established as a cure or proof of slowed molecular degeneration. A 62-person assessor-masked trial found greater SARA improvement with aerobic than dose-matched balance training; 43 participants had genetically confirmed SCA and the remainder had idiopathic ataxia or MSA-C. Selection required ambulatory function and safe cycling. This supports functional rehabilitation, not subtype-specific neuroprotection. In a separate uncontrolled seven-person SCA6/SCA31 cohort, annual intensive rehabilitation accompanied relative pre-session SARA stability through year six, while balance declined earlier; six-month follow-up SARA worsened from year three. Absence of a concurrent control prevents attributing long-term disease slowing to that regimen.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: PT (balance exercises, gait training, muscle strengthening) to maintain mobility &#x00026; function
    explanation: GeneReviews recommends physical rehabilitation to preserve functional mobility; this is broad hereditary-ataxia guidance.
  - reference: PMID:40946705
    reference_title: 'Home Training for Cerebellar Ataxias: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Compared to the balance group, the aerobic training group demonstrated significantly better improvements in SARA (time-by-group interaction, 6 months: β, −1.53; 95% CI, −2.44 to −0.61;'
    explanation: Primary randomized between-group SARA result; the full body establishes a mixed ataxia population and selected exercise eligibility.
  - reference: PMID:40946705
    reference_title: 'Home Training for Cerebellar Ataxias: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Most participants in the aerobic and balance groups had genetically confirmed spinocerebellar ataxia (21/31 and 22/31, respectively)
    explanation: The randomized cohort includes 43 genetically confirmed SCA participants, not 62 people with ADCA.
  - reference: PMID:40906249
    reference_title: 'Long-Term Effects of Annual Intensive Rehabilitation in Patients with Hereditary Pure Cerebellar Ataxia: A 7-year Follow-up Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Additionally, the absence of a control group prevents direct comparison with the natural history of the condition
    explanation: The seven-person retrospective cohort cannot establish a causal effect on long-term disease progression.

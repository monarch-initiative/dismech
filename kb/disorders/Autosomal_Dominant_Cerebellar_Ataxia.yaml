  evidence:
  - reference: PMID:41492970
    reference_title: An R83W mutation in Rab3A causes autosomal-dominant cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'In this study, we identified the c.247C > T p.(Arg83Trp) variant in RAB3A, encoding a small GTPase involved in membrane-associated regulated exocytosis, in two families with cerebellar ataxia.'
    explanation: Source for the RAB3A gene assignment and for the two-family basis of this subtype.
  - reference: PMID:41492970
    reference_title: An R83W mutation in Rab3A causes autosomal-dominant cerebellar ataxia.
    supports: SUPPORT

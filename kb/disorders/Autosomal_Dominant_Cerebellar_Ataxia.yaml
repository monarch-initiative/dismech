      id: hgnc:4593
      label: GRM1
  subtype: SCA44
  notes: 'Two dominant allele classes with different consequences were reported together: gain-of-function missense variants in adult-onset ataxia, and a de novo truncating variant acting as a dominant negative in juvenile-onset ataxia with intellectual disability. Recessive GRM1 variants cause a separate disease, SCAR13, which is not this entry.'
  evidence:

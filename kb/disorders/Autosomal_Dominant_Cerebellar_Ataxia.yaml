    explanation: Source for the clinical description recorded in this row.
pathophysiology:
- name: Coding Polyglutamine Repeat Expansion
  biological_scale: MOLECULAR
  description: Expanded coding CAG tracts cause the polyglutamine SCAs, including SCA1, SCA2, SCA3, SCA6, SCA7 and SCA17. Repeat thresholds and interruption effects are locus-specific.
  evidence:
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: These diseases are all caused by a CAG repeat expansion in the coding region of a gene.
    explanation: The review defines the six polyglutamine SCAs; this mechanism does not describe every ADCA.
  - reference: PMID:37148549
    reference_title: CAG Repeat Expansion in THAP11 Is Associated with a Novel Spinocerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'We identified THAP11 as the novel causative SCA gene with CAG repeats ranging from 45 to 100 in patients with ataxia and from 20 to 38 in healthy control subjects.'
    explanation: Adds THAP11 to this node as a coding CAG expansion identified after the 2019 review that defined the original six.

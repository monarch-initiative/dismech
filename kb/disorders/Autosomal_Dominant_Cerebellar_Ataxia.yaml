discussions:
- discussion_id: adca_harding_vs_molecular_axis
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Dominantly Inherited Cerebellar Neuron Insult"
  prompt: >-
    Should ADCA be curated along Harding's clinical axis, along the molecular SCA
    numbering, or both — and what is the dismech entry for a given patient?
  rationale: >-
    The two classifications cross-cut. A Harding class is a phenotype grouping that
    contains several molecularly unrelated loci, while an SCA number denotes one locus
    whose phenotype may span classes. The KB currently holds entries on both axes —
    `Autosomal_Dominant_Cerebellar_Ataxia_Type_I` and `_Type_III` on the clinical axis,
    `Machado_Joseph_Disease`, `Spinocerebellar_Ataxia_Type_17` and others on the
    molecular axis — so the same patient can satisfy two entries that are not related as
    parent and child. This entry models the Harding axis in `has_subtypes` because those
    are the entries that exist and because MONDO's own ADCA descendants are the numbered
    SCAs rather than the Harding classes, but that is a pragmatic choice and not a
    resolution. Bears on issue #5121 (the dismech-entry to MONDO-term relationship
    should be 1:1).
  evidence:
  - reference: PMID:30607747
    reference_title: >-
      Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar
      Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common spinocerebellar ataxias (SCAs) are 6 polyglutamine (polyQ) SCAs."
    explanation: >-
      Shows the molecular axis in use as the primary organising principle in the current
      literature, alongside the ADCA family name that Harding's classes subdivide.

- discussion_id: adca_subtype_frequency_is_population_specific
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Dominantly Inherited Cerebellar Neuron Insult"
  prompt: >-
    Can any single subtype-frequency distribution be curated for ADCA, or is subtype
    frequency only meaningful per population?
  rationale: >-
    Reported subtype frequencies differ so sharply between populations that a global
    ranking would misrepresent every one of them. SCA3 accounts for just over half of
    genetically confirmed ADCA in Singapore, whereas in Aomori, Japan, SCA6 accounts for
    more than three quarters and SCA1 for a single patient out of eighty. Founder
    effects, not ascertainment artefact, appear to drive this. The practical consequence
    is that per-subtype `subtype_frequency` values on this entry would need to be
    population-scoped to be honest, and none are asserted here.
  evidence:
  - reference: PMID:12485197
    reference_title: >-
      Prevalence and ethnic differences of autosomal-dominant cerebellar ataxia in
      Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA 3 was identified in 31 (53.4%) patients from 15 families, SCA 2 in 17 (29.3%) patients from 12 families and SCA 1 in four (6.9%) patients from four families."
    explanation: >-
      Gives the Singaporean subtype distribution, dominated by SCA3.
  - reference: PMID:21088341
    reference_title: >-
      Prevalence of autosomal dominant cerebellar ataxia in Aomori, the northernmost
      prefecture of Honshu, Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinocerebellar ataxia (SCA) type 6 was often observed (77.7% of cases), with SCA2 (10.6% of cases) being the next most common form."
    explanation: >-
      The contrasting Japanese distribution, dominated by SCA6 — the direct comparison
      that makes a single global ranking untenable.

notes: >
  Scope. A thin root over a partially populated subtree. It binds MONDO:0020380 and
  carries the family-level convergence on Purkinje neuron degeneration once, conforming
  to the `cerebellar_purkinje_degeneration` module at three nodes. Per-class and
  per-locus mechanism stays in the existing entries.

  Subtype axis. `has_subtypes` follows Harding's clinical classes because two of the
  three already exist as curated entries and the third (ADCA-II) is a coherent
  clinical concept. No MONDO terms are bound to the Harding classes: MONDO's ADCA
  descendants are the numbered SCAs, and binding a Harding class to an SCA term would
  assert an equivalence that does not hold, except arguably for ADCA-II and SCA7. This
  is recorded as an open question rather than resolved.

  Mechanism scope. The repeat-expansion claim on the trigger node is explicitly scoped
  to the polyglutamine class and is not asserted of the family as a whole; the family
  also contains non-coding repeat expansions and conventional alleles. Anticipation is
  likewise scoped to the repeat-expansion branch in the inheritance block rather than
  claimed for ADCA generally.

  No treatments section. There is no established disease-modifying therapy for any
  member, and symptomatic management is not ADCA-specific, so nothing is curated here.

- name: Purkinje-directed ATXN2-Q127 transgenic mouse
  species: Mouse
  background: B6;D2 hybrid background
  genotype: Pcp 2-driven full-length human ATXN2 with 127 CAG repeats
  publication: PMID:28405024
  description: The SCA2 model develops motor impairment and reduced Purkinje-cell firing. Intracerebroventricular ASO7 begun around motor-phenotype onset lowers human ATXN2 and partly lowers endogenous mouse Atxn2, improving rotarod performance. Subsequent acute-slice recordings show restoration of firing.
  notes: Cell-restricted transgene expression and a very long repeat differ from typical human heterozygosity. The study demonstrates preclinical target engagement and functional rescue, not human efficacy, a cure, lifespan extension in these SCA2 cohorts or recovery of lost neurons. Electrophysiological cell counts are nested within only one to four mice per genotype.

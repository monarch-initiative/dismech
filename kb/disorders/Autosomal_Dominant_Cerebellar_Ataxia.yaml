  description: Dominant sequence variants and rearrangements in genes such as ITPR1, SPTBN2, PRKCG and AFG3L2 affect different cellular functions. Variant-specific loss of function, altered regulation or dominant interference should be resolved in molecular subtype entries, rather than assigned uniformly here.

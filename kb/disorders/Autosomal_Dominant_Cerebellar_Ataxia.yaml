diagnosis:
- name: Neurological, family-history and acquired-cause assessment
  description: Establish the pattern and tempo of cerebellar dysfunction, obtain a multigeneration pedigree and evaluate additional neurological findings. Consider acquired, nutritional, immune, toxic and structural causes, particularly when onset or rapid progression is atypical. A negative family history does not exclude dominant ataxia.
  evidence:
  - reference: PMID:30786918
    reference_title: Guidelines on the diagnosis and management of the progressive ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The clinical context (speed of evolution, episodic/fluctuating versus progressive etc.) should determine the investigation of individual cases.
    explanation: The guideline prioritizes phenotype and tempo rather than a universal test sequence.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: A three-generation family history should be taken with attention to relatives with manifestations of hereditary ataxia
    explanation: The hereditary-ataxia chapter recommends a detailed multigeneration family history.
- name: MRI and functional baseline
  description: Brain MRI defines the distribution of atrophy and helps assess alternative causes. Document cerebellar and extracerebellar examination findings, using SARA or another appropriate scale for follow-up. Normal or minimally abnormal imaging does not exclude early or restricted FGF14-associated disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Brain MRI to evaluate presence &#x00026; severity of cerebellar atrophy
    explanation: GeneReviews recommends imaging to assess structural involvement.
  - reference: PMID:38507876
    reference_title: 'GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Brain MRI of eight patients showed cerebellar atrophy (13%; 8/60), which was limited to the vermis in three patients and extended to the hemispheres in five patients.
    explanation: Cerebellar atrophy may be visible on MRI, with variable regional and extracerebellar involvement. Its absence does not exclude a genetic cerebellar disorder, particularly early or in restricted FGF14 ocular presentations.
- name: Molecular testing that detects repeat expansions
  description: Testing must detect the relevant expansion classes as well as sequence and copy-number variants. The 2025 recommendations favor comprehensive testing, ideally genome sequencing with validated short-tandem-repeat sizing, sometimes complemented by repeat-primed PCR or long-read sequencing. A dedicated expansion panel followed by genome testing is an alternative. Standard sequence-only panels or exomes may miss expansions; familial targeted testing can be appropriate.
  evidence:
  - reference: PMID:40883955
    reference_title: Practice Recommendations for Genetic Testing of Ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The initial genetic test ordered should be as comprehensive as possible, include the most ataxia‐relevant genes, and reliably detect pathogenic repeat expansions.
    explanation: The consensus recommendation explicitly requires repeat detection.
  - reference: PMID:40883955
    reference_title: Practice Recommendations for Genetic Testing of Ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If WGS as a first approach is fiscally impossible or otherwise not feasible, then a dedicated repeat expansion panel with eventual reflex to WGS would be appropriate.
    explanation: The guideline provides an alternative pathway when comprehensive genome testing is unavailable.
- name: Interpretation and reassessment of unresolved results
  description: Interpret variants with phenotype, segregation, repeat structure and current classification; a variant of uncertain significance alone does not establish a molecular diagnosis. Negative testing may reflect assay limitations or an unresolved cause. Consider reanalysis after at least two years or new symptoms, including newly detectable repeat expansions where available.
  evidence:
  - reference: PMID:40883955
    reference_title: Practice Recommendations for Genetic Testing of Ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Reanalysis of previously negative genomic testing should be considered after a period of at least 2 years or a change in symptomology.
    explanation: The consensus recommends periodic reassessment rather than treating every negative result as final.
clinical_trials:
- name: NCT03347344
  status: COMPLETED
  description: ATRIL randomized 45 participants with moderately affected, genetically defined SCA2 to riluzole or placebo for 12 months. Improvement of at least one SARA point occurred in 7/22 versus 9/23; neither clinical nor MRI outcomes improved with riluzole. The result is specific to the enrolled SCA2 population.
  evidence:
  - reference: PMID:35063116
    reference_title: 'Safety and efficacy of riluzole in spinocerebellar ataxia type 2 in France (ATRIL): a multicentre, randomised, double-blind, placebo-controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Riluzole did not improve clinical or radiological outcomes in these patients.
    explanation: The randomized SCA2 trial did not meet the intended clinical efficacy goal.
  phase: PHASE_III
- name: NCT05002218
  status: COMPLETED
  description: Single-center assessor-masked randomized comparison of home aerobic versus balance training in 62 selected ambulatory adults with mixed cerebellar ataxias, including 43 genetically confirmed SCAs. At six months, the between-group SARA effect favored aerobic training by 1.53 points (95% CI 0.61–2.44 in the direction of improvement). Training support stopped after six months; 11/62 participants had dropped out by one year. Adherence subgroup comparisons were not randomized, missing-at-random assumptions limit inference, and structural MRI results were not reported in this paper.
  evidence:
  - reference: PMID:40946705
    reference_title: 'Home Training for Cerebellar Ataxias: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of 62 participants randomized, 31 were randomized to home aerobic training and 31 were randomized to home balance training.
    explanation: The primary report establishes the randomized comparator design.
  - reference: PMID:40946705
    reference_title: 'Home Training for Cerebellar Ataxias: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The inferences from analyses with missing data are valid under the missing-at-random assumption (ie, the missing mechanism does not depend on the value of the unobserved outcome), which is not testable in this study.
    explanation: The authors state the missing-data assumption explicitly.
  phase: NOT_APPLICABLE

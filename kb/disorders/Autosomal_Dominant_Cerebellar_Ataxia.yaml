progression:
- phase: Variable onset and progression
  notes: Age at onset ranges from childhood to late adulthood by gene, allele and family. The classic course is progressive, but episodes or ocular-motor symptoms may precede sustained ataxia. There is no family-wide rate of progression or survival estimate; slowly progressive SCA6 and FGF14-associated disease differ from severe childhood repeat-expansion presentations.
  evidence:
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Clinical features differ between patients with an adult onset and patients with an onset in infancy or early childhood with the disease starting in childhood showing a more rapid and aggressive progression within a few years. When disease symptoms first appear later in life, the disease progresses more slowly and the degree of disability will vary accordingly [103].
    explanation: The SCA7 section explicitly contrasts rapid childhood and slower adult courses.
  - reference: PMID:38507876
    reference_title: 'GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: episodic symptoms and oscillopsia preceded gait impairment in 1 of 10 (10%) and 3 of 28 (11%) patients for whom information on age at onset of these features was available, respectively.
    explanation: Selected FGF14-associated downbeat-nystagmus cases illustrate variable initial manifestations, not family-wide frequencies.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: May begin w/episodic ataxia, very slow progression; onset often after age 50 yrs; normal life span
    explanation: The SCA6 row supplies a subtype-specific counterexample to a universal early-onset or shortened-survival course.

epidemiology:
- name: Historical Singapore family estimate
  description: In the 2002 series, 204 people with ataxia underwent a nine-locus testing panel; 58 positive patients belonged to 36 families. The estimated lower bound was one affected family per 27,000 Singaporean families. This family-unit estimate is not a person-level prevalence or a contemporary comprehensive-panel yield.
  evidence:
  - reference: PMID:12485197
    reference_title: Prevalence and ethnic differences of autosomal-dominant cerebellar ataxia in Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'The estimated prevalence of ADCA in Singaporean families was at least 1 : 27,000.'
    explanation: The denominator is families, so conversion to persons per 100,000 is inappropriate.
- name: Regional subtype distributions
  description: SCA3 accounted for 31 of 58 molecularly classified Singaporean patients, whereas SCA6 accounted for 59 of 76 classified Aomori cases in the 2007–2009 Japanese series. Aomori enrolled 80 people, including 15 apparently sporadic cases. These selected, historically tested cohorts have different ascertainment and denominators; founder effects cannot be separated from referral and assay coverage by this comparison.
  evidence:
  - reference: PMID:12485197
    reference_title: Prevalence and ethnic differences of autosomal-dominant cerebellar ataxia in Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: SCA 3 was identified in 31 (53.4%) patients from 15 families, SCA 2 in 17 (29.3%) patients from 12 families and SCA 1 in four (6.9%) patients from four families.
    explanation: The proportions concern 58 positive patients, not all 204 tested individuals.
  - reference: PMID:21088341
    reference_title: Prevalence of autosomal dominant cerebellar ataxia in Aomori, the northernmost prefecture of Honshu, Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: SCA6 was found to be the most common form of SCA in Aomori Prefecture, with a polyglutamine expansion in the CACNA1A gene being found in 59 of the 80 cases analyzed (77.7% of cases).
    explanation: The prose establishes regional SCA6 predominance but incorrectly pairs 59 of 80 with 77.7%; Table 2 shows that 76 cases were molecularly classified. The description preserves the corrected denominator and source discrepancy.
genetic:
- name: Polyglutamine SCA genes
  association: Causative coding repeat expansions in a subset of ADCA
  notes: ATXN1, ATXN2, ATXN3, CACNA1A, ATXN7 and TBP are the six polyglutamine SCA genes covered by the mechanistic review. DRPLA is a related ATN1 expansion disorder. Repeat length, interruptions, penetrance and transmission behavior require locus-specific interpretation.
  evidence:
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: These diseases are all caused by a CAG repeat expansion in the coding region of a gene.
    explanation: The review defines the six polyglutamine SCAs; this mechanism does not describe every ADCA.
- name: Noncoding-repeat and conventional-variant causes
  association: Additional distinct dominant genetic mechanisms
  notes: FGF14 intronic GAA expansion is an important late-onset cause that may present with downbeat nystagmus before overt ataxia. Conventional dominant variants or rearrangements in ITPR1, SPTBN2, PRKCG, AFG3L2 and other genes are mechanistically heterogeneous. Coding sequencing alone cannot exclude these families of repeat disorders.
  evidence:
  - reference: PMID:38507876
    reference_title: 'GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: A dominantly inherited GAA repeat expansion in intron 1 of the fibroblast growth factor 14 (FGF14) gene has recently been identified as the cause of GAA-FGF14 disease/spinocerebellar ataxia 27B (SCA27B)
    explanation: The primary cohort introduces an established noncoding expansion cause, distinct from the polyglutamine group.
  - reference: PMID:20723845
    reference_title: 'Autosomal dominant cerebellar ataxias: polyglutamine expansions and beyond.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: All other SCAs are caused by either conventional mutations or large rearrangements in genes with different functions, including glutamate signalling (SCA5/SPTBN2) and calcium signalling (SCA15/16/ITPR1), channel function (SCA13/KCNC3, SCA14/PRKCG, SCA27/FGF14), tau regulation (SCA11/TTBK2), and mitochondrial activity (SCA28/AFG3L2) or RNA alteration (SCA31/BEAN-TK2).
    explanation: The historical review supports heterogeneous conventional-variant mechanisms; its old gene counts and inclusion of noncoding SCA31 are not treated as current exhaustive classification.

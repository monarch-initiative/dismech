- name: Genetic counseling and family testing
  description: Offer voluntary pre- and post-test counseling covering inheritance, variable penetrance, uncertain results, psychological implications and reproductive options. Test a known familial pathogenic variant when appropriate. Predictive testing for adult-onset disease in asymptomatic minors is generally deferred unless childhood actionability justifies it; symptomatic children warrant diagnostic evaluation.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40883955
    reference_title: Practice Recommendations for Genetic Testing of Ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: This does not obligate the person to proceed with testing but is recommended to better understand the risk of the familial condition and the potential impact of results should they proceed with testing.
    explanation: The predictive-testing recommendation preserves informed choice.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Genetic counseling and risk assessment depend on determination of the specific cause of an inherited ataxia in an individual.
    explanation: The broad chapter makes family counseling molecularly specific.
- name: Palliative and family support
  description: Advanced functional impairment may warrant coordinated palliative care, symptom relief, respite and support for caregivers. These services can accompany active rehabilitation and are individualized; the progressive-ataxia guideline bases much of this advice on other neurodegenerative disorders.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Palliative Therapy

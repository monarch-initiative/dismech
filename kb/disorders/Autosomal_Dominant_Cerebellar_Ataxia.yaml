- name: Riluzole evidence remains subtype-dependent
  description: Earlier mixed-etiology ataxia studies prompted consideration of off-label riluzole, with liver-enzyme monitoring. In ATRIL, 45 moderately affected SCA2 participants received riluzole or placebo for 12 months, without a clinical or MRI benefit. This does not establish routine efficacy across ADCA and does not prove absence of benefit in every other subtype.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

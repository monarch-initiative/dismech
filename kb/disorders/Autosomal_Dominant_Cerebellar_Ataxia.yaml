- Cerebellar degeneration
inheritance:
- name: Autosomal dominant
  description: 'Autosomal dominant transmission is characteristic. Each child of a heterozygous affected parent has a 50% probability of inheriting the disease allele, with clinical risk modified by penetrance and repeat structure. An apparently negative family history can reflect late onset, reduced penetrance, an unrecognized affected relative, de novo variation or parental mosaicism. Anticipation occurs in several unstable-repeat disorders but is not universal: SCA6 generally lacks anticipation and it is infrequent in SCA17.'
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
    reference_title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: hereditary ataxia has a 50% chance of inheriting the
    explanation: In the autosomal-dominant offspring section, the chapter specifies allele-transmission risk, not guaranteed age or severity of disease.
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Normal SCA17 alleles contain 25 to 40 repeats while alleles with 41 to 49 repeats have incomplete penetrance.
    explanation: The review illustrates allele-dependent penetrance; locus-specific interpretation is required.
has_subtypes:
- name: ADCA-I
  display_name: ADCA Type I (ataxia with extracerebellar features)
  classification: clinical
  description: Historical Harding type I describes cerebellar ataxia with extracerebellar neurological findings, such as pyramidal, extrapyramidal, cognitive or oculomotor abnormalities. Expression varies within families and across molecular causes; the clinical class is not a single genotype.
  evidence:
  - reference: PMID:7066668
    reference_title: The clinical features and classification of the late onset autosomal dominant cerebellar ataxias. A study of 11 families, including descendants of the 'the Drew family of Walworth'.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The clinical features of 11 families containing 73 individuals with dominantly inherited cerebellar ataxia of late onset are described.
    explanation: The original clinical classification was derived from 11 families and predates molecular subtype definitions.
  - reference: PMID:7066668
    reference_title: The clinical features and classification of the late onset autosomal dominant cerebellar ataxias. A study of 11 families, including descendants of the 'the Drew family of Walworth'.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Many of the patients had physical signs in addition to cerebellar ataxia, which included dementia, supranuclear ophthalmoplegia, extrapyramidal dysfunction, optic atrophy, pigmentary retinal degeneration, myoclonus and deafness.
    explanation: The original cohort documents the broader neurological spectrum.
  subtype_term:
    preferred_term: autosomal dominant cerebellar ataxia type I
    term:
      id: MONDO:0019792
      label: autosomal dominant cerebellar ataxia type I
- name: ADCA-II
  display_name: ADCA Type II (ataxia with pigmentary retinopathy)
  classification: clinical
  description: Historical Harding type II combines cerebellar ataxia with pigmentary retinal degeneration. ATXN7-related SCA7 is the major molecular example and can cause cone-rod dystrophy with progressive visual loss. MONDO carries the historical ADCA type II class name as a synonym of spinocerebellar ataxia 7 (MONDO:0016163), rather than providing a separate ADCA-II term.
  evidence:
  - reference: PMID:7066668
    reference_title: The clinical features and classification of the late onset autosomal dominant cerebellar ataxias. A study of 11 families, including descendants of the 'the Drew family of Walworth'.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: cerebellar ataxia with pigmentary retinal degeneration
    explanation: The original classification specifically identifies the retinal-associated presentation.
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Retinal degeneration is a distinctive feature of SCA7 with progressive cone-rod dystrophy leading to even- tual blindness [100].
    explanation: The review connects the retinal clinical class with SCA7.
  subtype_term:
    preferred_term: spinocerebellar ataxia 7
    term:
      id: MONDO:0016163
      label: spinocerebellar ataxia 7

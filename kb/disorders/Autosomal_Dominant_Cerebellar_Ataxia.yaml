discussions:
- discussion_id: adca_inclusion_toxicity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Neuronal Polyglutamine Inclusions
  prompt: Which expanded-protein species drive injury in each molecular subtype?
  rationale: Large inclusions are pathological observations but are not established as the universally toxic species. Soluble species, fragments, native-protein interactions and RNA-related processes can contribute differently. Therefore inclusion formation is a parallel observed endpoint, not a required bridge to neuronal death.
  evidence:
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Whether these large aggregates, a hallmark of all polyQ SCAs, are neurotox- ic or neuroprotective is still under debate [ 47].
    explanation: The review explicitly identifies unresolved direction of inclusion effects.
- discussion_id: adca_molecular_and_clinical_heterogeneity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cerebellar Network Dysfunction
  prompt: Which molecular and cellular abnormalities explain each subtype-specific clinical trajectory?
  rationale: Historical clinical classes cross molecular diagnoses, and similar ataxia can arise from different neuronal compartments and genetic lesions. Human SCA3 cortical sparing, episodic SCA6 and restricted FGF14 ocular presentations preclude a universal Purkinje-loss or fixed-progression model. Selected regional cohorts also cannot establish one worldwide subtype distribution.
  evidence:
  - reference: PMID:30607747
    reference_title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: SCA3 affects various different regions of the brain and spinal cord, although the cerebellar cortex and olivary nuclei Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias 265 are relatively spared. The brain weight of SCA3 patients is significantly reduced, and neuronal cell loss is most prominent in the cerebellar dentate nucleus and substantia nigra.
    explanation: Human SCA3 neuropathology demonstrates relative cerebellar-cortex sparing and dentate-nucleus involvement.
  - reference: PMID:38507876
    reference_title: 'GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: A dominantly inherited GAA repeat expansion in intron 1 of the fibroblast growth factor 14 (FGF14) gene has recently been identified as the cause of GAA-FGF14 disease/spinocerebellar ataxia 27B (SCA27B)
    explanation: The primary cohort introduces an established noncoding expansion cause, distinct from the polyglutamine group.
notes: 'Subtype placement rule used here. MONDO:0020380 has 64 hierarchical descendants (OLS4 hierarchicalDescendants endpoint). A numbered molecular SCA is carried on this family entry only when MONDO parents it directly on MONDO:0020380, or on a Harding class this entry does not itself carry as a clinical row. SCA44, SCA50, SCA51 and SCA52 are parented directly on MONDO:0020380; SCA10 is parented on autosomal dominant cerebellar ataxia type IV (MONDO:0019794), for which no dismech entry exists. Descendants parented on ADCA type I (MONDO:0019792) belong to Autosomal_Dominant_Cerebellar_Ataxia_Type_I, which already curates fifteen of them, and are not duplicated here.


  Claims left to the entries that own them. SCA27B / GAA-FGF14 disease is curated on Spinocerebellar_Ataxia_27B, which also records SCA27A (MONDO:0008654, OMIM:609307, the childhood-onset FGF14 coding-variant disease) as a differential; SCA27A is therefore not bound as a subtype row here. SCA1, SCA2, SCA6, SCA8, SCA15/16, SCA17, SCA23, SCA31, SCA36, SCA43 and SCA48 have their own dismech entries. The polyglutamine genes ATXN1, ATXN2, ATXN3, CACNA1A and TBP reach the pathograph as gene descriptors on the coding-expansion nodes rather than as separate causal-gene entries, because this entry is the family umbrella and their locus-specific thresholds belong in the molecular subtype entries.


  Nomenclature hazard. The SCA50 label has been used for two different diseases. MONDO:0859334 (OMIM:620158) denotes the NPTX1 disease curated here. PMID:36493768, already cited by Spinocerebellar_Ataxia_27B, is titled "An intronic GAA repeat expansion in FGF14 causes the autosomal-dominant adult-onset ataxia SCA50/ATX-FGF14" and so applies the same number to the FGF14 repeat disease. The subtype row was resolved through the OMIM cross-reference rather than through the label.


  This is a family-level entry. Molecular subtype entries carry detailed variant thresholds and allele-specific pathways. The reviewed graph separates measured or reviewed events and retains unknown intermediates where the evidence does not establish a unique sequence. GeneReviews is a broader hereditary-ataxia overview; only applicable dominant-ataxia and general supportive-care content is used. The 2019 polyglutamine review is not treated as current proof of clinical availability, and the 2025 FDA conclusion is explicitly dated.'
references:
- reference: PMID:40906249
  title: 'Long-Term Effects of Annual Intensive Rehabilitation in Patients with Hereditary Pure Cerebellar Ataxia: A 7-year Follow-up Study.'
  findings:
  - statement: Complete primary main body, Methods, Results, tables and Discussion read. Selected seven-person retrospective cohort (two SCA6, five SCA31), no concurrent control, differing pre/post/six-month trajectories and early balance deterioration preclude proof of disease slowing.
- reference: PMID:40946705
  title: 'Home Training for Cerebellar Ataxias: A Randomized Clinical Trial.'
  findings:
  - statement: Genuine full primary PMC HTML for PMID40946705 generated and read through Methods, Results, Tables 1–3, figures and Discussion. Sixty-two selected ambulatory adults,43 genetically confirmed SCAs; subtype efficacy not separately established. Missing-at-random assumption,17.7% one-year attrition, nonrandomized adherence comparison and unpublished MRI endpoints are retained. This entry now cites PMID:40946705, whose full-text HTML cache carries every quoted snippet.
- reference: PMID:12485197
  title: Prevalence and ethnic differences of autosomal-dominant cerebellar ataxia in Singapore.
  findings:
  - statement: Original and regenerated abstract reviewed; full primary body was not recovered. Singapore 2002 ascertained 204 tested people and 58 positive people from 36 families. Family-unit prevalence is retained only in epidemiology, without conversion to person-level frequency.
- reference: PMID:21088341
  title: Prevalence of autosomal dominant cerebellar ataxia in Aomori, the northernmost prefecture of Honshu, Japan.
  findings:
  - statement: Entire primary PDF, Methods, Results, tables, figures and Discussion reviewed. Aomori 76 classified/80 enrolled denominators, historical assay scope and unproven founder explanation are preserved.
- reference: PMID:30607747
  title: Genetics, Mechanisms, and Therapeutic Progress in Polyglutamine Spinocerebellar Ataxias.
  findings:
  - statement: Entire available full PDF main body, subtype sections and therapeutic/model tables reviewed. Human SCA3 cerebellar-cortex sparing, uncertain inclusion toxicity, interacting gain/loss effects and model-to-human treatment limits replace universal Purkinje and therapy claims.
- reference: PMID:7066668
  title: The clinical features and classification of the late onset autosomal dominant cerebellar ataxias. A study of 11 families, including descendants of the 'the Drew family of Walworth'.
  findings:
  - statement: Complete original classification abstract reviewed. Eleven families and 73 individuals establish the historical clinical framework; full primary article was not available in the generated cache.
- reference: PMID:20723845
  title: 'Autosomal dominant cerebellar ataxias: polyglutamine expansions and beyond.'
  findings:
  - statement: Complete review abstract reviewed. Used for broad mechanistic heterogeneity only; its historical gene count and mapped loci are not a current exhaustive catalogue.
- reference: PMID:30786918
  title: Guidelines on the diagnosis and management of the progressive ataxias.
  findings:
  - statement: Complete full guideline main body and all six included tables reviewed. Mostly good-practice recommendations and extrapolation from other neurological diseases; Friedreich-specific and other recessive/acquired-disease treatments are not applied to ADCA.
- reference: PMID:40883955
  title: Practice Recommendations for Genetic Testing of Ataxias.
  findings:
  - statement: Complete 2025 full main body, methods,20 recommendations and tables reviewed. U.S.-based consensus emphasizes comprehensive testing with explicit repeat-detection capability, informed choice and reassessment; no universal sensitivity is claimed.
- reference: PMID:35063116
  title: 'Safety and efficacy of riluzole in spinocerebellar ataxia type 2 in France (ATRIL): a multicentre, randomised, double-blind, placebo-controlled trial.'
  findings:
  - statement: Complete ATRIL abstract reviewed.45 moderate SCA2 participants,12-month randomized comparison and negative clinical/MRI result are kept subtype-specific; full primary body was not recovered.
- reference: PMID:38507876
  title: 'GAA-FGF14 disease: defining its frequency, molecular basis, and 4-aminopyridine response in a large downbeat nystagmus cohort.'
  findings:
  - statement: Entire regenerated full primary body, Methods, Results, Discussion,Table 1 and figures reviewed. The 170-person DBN-ascertained, mainlyEuropean single-center cohort does not provide general ADCA penetrance; 4-AP response is retrospective with only four post hoc genotype-positive crossover participants and phase/order limitations.
- reference: PMID:28405024
  title: Antisense oligonucleotide therapy for spinocerebellar ataxia type 2.
  findings:
  - statement: Entire cached main body, Methods and available extended-data captions reviewed. Two transgenic mouse models, motor versus ex-vivo firing assays, partial motor rescue, limited mouse-level physiology replication and non-allele-specific fibroblast RNA lowering are distinct. Main figure captions and separate supplementary discussion were not available in this representation; no missing denominators are inferred.
- reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1138/
  title: Hereditary Ataxia Overview - GeneReviews® - NCBI Bookshelf
  findings:
  - statement: Hereditary Ataxia Overview, updatedJuly 9,2026. Complete chapter clinical, genetic, diagnostic, management and counseling sections and relevant tables reviewed. This broader GeneReviews chapter supplies all four applicable baseline domains; subtype-specific prognosis and anticipation exceptions are retained.
  tags:
  - GeneReviews
- reference: url:https://download.open.fda.gov/crl/CRL_NDA210862_20251104.pdf
  title: https://download.open.fda.gov/crl/CRL_NDA210862_20251104.pdf
  findings:
  - statement: 'FDA complete-response letter for NDA210862, November 4,2025. Entire available substantive assessment reviewed: failed randomized primary endpoint and external-control confounding/missing-data limitations prevent treating the submitted analysis as established SCA disease modification.'
review_notes: Comprehensive source and claim review of the original three references, full GeneReviews overview, current genetic-testing guidance, progressive-ataxia care guideline and selected contemporary clinical/model sources. Related Harding-I manual report and Harding-III provider synthesis/report leads were inspected for family-level relevance; subtype-specific experimental or pharmacologic claims were not promoted without source verification. Human findings, clinical recommendations, experimental readouts and unresolved intermediates are separated. No family-wide phenotype frequency bands are inferred from subtype cohorts.

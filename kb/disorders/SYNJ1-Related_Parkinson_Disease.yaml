      id: hgnc:11503
      label: SYNJ1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic SYNJ1 variants; the recurrent homozygous p.Arg258Gln in the
      Sac1 phosphatase domain selectively abolishes Sac1 (PI4P/PI3P) activity
      while sparing the 5-phosphatase — a partial loss of function, distinct
      from the complete loss that causes the lethal encephalopathy.
  molecular_functions:

    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification, by homozygosity mapping and exome sequencing, of a SYNJ1 homozygous mutation (p.Arg258Gln) segregating with disease in an Italian consanguineous family with Parkinsonism, dystonia, and cognitive deterioration."
    explanation: Identifies the biallelic SYNJ1 variant that is the root lesion of PARK20.
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "SYNJ1 encodes synaptojanin 1, a phosphoinositide phosphatase protein with essential roles in the postendocytic recycling of synaptic vesicles."
    explanation: States the phosphoinositide-phosphatase function whose loss is the root lesion; restates established protein function, hence OTHER/BACKGROUND.
  - reference: PMID:23804563
    reference_title: "The Sac1 domain of SYNJ1 identified mutated in a family with early-onset progressive Parkinsonism with generalized seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "This mutation impaired the phosphatase activity of SYNJ1 against its Sac1 domain substrates in vitro."
    explanation: In vitro enzymatic assay confirms the Arg258Gln Sac1-domain variant is loss-of-function for phosphatase activity, the root lesion this node asserts.
  - reference: PMID:23804563
    reference_title: "The Sac1 domain of SYNJ1 identified mutated in a family with early-onset progressive Parkinsonism with generalized seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "they drastically inhibited the phosphatase activity against PI3P and PI4P"
    explanation: Pins the defect to the Sac1-domain substrates (PI3P/PI4P) rather than the 5-phosphatase substrate, which is why the node binds the PI4P-phosphatase activity.
  - reference: PMID:28231468
    reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "selectively abolishes the phosphatase activity of the Sac domain without affecting the activity of the 5-phosphatase domain"
    explanation: States explicitly that the R258Q allele spares the 5-phosphatase and selectively loses the Sac-domain activity; the sentence restates the Krebs in vitro result, hence IN_VITRO/BACKGROUND.

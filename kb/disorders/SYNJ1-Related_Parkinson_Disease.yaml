      snippet: "we report the identification, by homozygosity mapping and exome sequencing, of a SYNJ1 homozygous mutation (p.Arg258Gln) segregating with disease in an Italian consanguineous family with Parkinsonism, dystonia, and cognitive deterioration."
      explanation: The SYNJ1 endocytic defect produces the parkinsonian neurodegenerative phenotype (inference from the clinical presentation).

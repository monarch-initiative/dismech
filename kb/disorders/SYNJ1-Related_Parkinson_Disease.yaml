      label: dopaminergic neuron
  evidence:
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "SYNJ1 encodes synaptojanin 1, a phosphoinositide phosphatase protein with essential roles in the postendocytic recycling of synaptic vesicles."
    explanation: The postendocytic synaptic-vesicle recycling function impaired at this node.
  - reference: PMID:28231468
    reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Synapses of these mice displayed endocytic defects and a striking accumulation of clathrin-coated intermediates, strongly implicating Sac domain's activity in endocytic protein dynamics."
    explanation: The R258Q knock-in mouse directly demonstrates the synaptic endocytic defect and failed clathrin uncoating this node describes.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Chronic presynaptic endocytic failure disrupts dopaminergic terminals and drives degeneration of nigral dopaminergic neurons.
    evidence:

- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without synaptojanin-1 Sac1-domain dephosphorylation of PI4P, the clathrin
    coat and other endocytic factors are not shed, and synaptic-vesicle
    endocytosis and recycling into the releasable pool are impaired at the nerve
    terminal; the R258Q knock-in mouse shows an accumulation of clathrin-coated
    intermediates establishing the Sac domain's role in clathrin-coat dynamics.
    This is the presynaptic, endocytic mechanism SYNJ1 shares with DNAJC6
    (PARK19), whose auxilin product is itself recycled through the Sac1 pathway,
    as distinct from the mitochondrial-quality-control mechanism of PRKN and
    PINK1.
  biological_processes:
  - preferred_term: synaptic vesicle endocytosis
    term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    modifier: DECREASED
  - preferred_term: phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "SYNJ1 encodes synaptojanin 1, a phosphoinositide phosphatase protein with essential roles in the postendocytic recycling of synaptic vesicles."
    explanation: The postendocytic synaptic-vesicle recycling function impaired at this node.
  - reference: PMID:28231468
    reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Synapses of these mice displayed endocytic defects and a striking accumulation of clathrin-coated intermediates, strongly implicating Sac domain's activity in endocytic protein dynamics."
    explanation: The R258Q knock-in mouse directly demonstrates the synaptic endocytic defect and failed clathrin uncoating this node describes.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Chronic presynaptic endocytic failure disrupts dopaminergic terminals and drives degeneration of nigral dopaminergic neurons.
    evidence:
    - reference: PMID:23804577
      reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "we report the identification, by homozygosity mapping and exome sequencing, of a SYNJ1 homozygous mutation (p.Arg258Gln) segregating with disease in an Italian consanguineous family with Parkinsonism, dystonia, and cognitive deterioration."
      explanation: The SYNJ1 endocytic defect produces the parkinsonian neurodegenerative phenotype (inference from the clinical presentation).
  - target: Seizures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The endocytic defect falls more heavily on inhibitory synapses, shifting the excitatory/inhibitory balance toward epileptogenesis; this, not the dopaminergic chain, is the origin of the seizures.
    evidence:
    - reference: PMID:28231468
      reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "possibly explains the occurrence of epilepsy in mice and patients"
      explanation: The mouse study attributes the epilepsy to the inhibitory-synapse-predominant endocytic defect, locating the seizures on this node rather than the dopaminergic chain.

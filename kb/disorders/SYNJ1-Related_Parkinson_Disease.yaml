treatments:
- name: Levodopa
  description: >-
    Dopaminergic replacement with levodopa. In PARK20 the response is typically
    poor and limited by side effects, consistent with the less favourable
    levodopa response of the atypical monogenic parkinsonisms. The response is
    nonetheless variable: a substantial minority of patients derive benefit
    (MDSGene reports a levodopa response in 49% versus 93% of typical monogenic
    presentations).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_phenotypes:
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response to levodopa was poor, and limited by side effects."
    explanation: Documents the poor, side-effect-limited levodopa response in the index family.
  - reference: PMID:34396589
    reference_title: "Genotype-Phenotype Relations for the Atypical Parkinsonism Genes: MDSGene Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "levodopa response less favorable than in patients with monogenic typical presentations (49% vs 93%)"
    explanation: The less favourable levodopa response of the atypical monogenic parkinsonisms, SYNJ1 among them.

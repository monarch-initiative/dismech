name: SYNJ1-Related Parkinson Disease
creation_date: "2026-11-19T14:30:00Z"
category: Mendelian
description: >-
  SYNJ1-related Parkinson disease (PARK20; early-onset Parkinson disease 20) is
  an autosomal-recessive, early-onset neurodegenerative disorder caused by
  biallelic variants in SYNJ1, the gene encoding synaptojanin-1, a presynaptic
  phosphoinositide phosphatase required for the postendocytic recycling of
  synaptic vesicles. Synaptojanin-1 sheds the clathrin coat at the nerve
  terminal by sequentially removing the 5- and 4-phosphates of PI(4,5)P2
  through its 5-phosphatase and Sac1 domains. The recurrent PARK20 allele
  (p.Arg258Gln) sits in the Sac1 domain and selectively abolishes its
  PI4P/PI3P phosphatase activity while leaving the 5-phosphatase intact, so the
  Sac1 step of coat shedding fails and synaptic-vesicle endocytosis and
  recycling are impaired. It is a partial loss of function; complete
  synaptojanin-1 loss causes a distinct, lethal developmental and epileptic
  encephalopathy. This places the disease on the presynaptic, endocytic arm of
  Parkinson pathophysiology alongside DNAJC6 (PARK19) — whose auxilin product
  is itself recycled through the Sac1 pathway — rather than on the
  mitochondrial arm of PRKN/PINK1 or the proteasomal arm of FBXO7. The
  phenotype is an early-onset parkinsonism with dystonia, tremor and cognitive
  deterioration, often with seizures, and the parkinsonism is typically poorly
  levodopa-responsive. The distinct SYNJ1 developmental and epileptic
  encephalopathy is curated separately.
parents:
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism
synonyms:
- PARK20
- early-onset Parkinson disease 20
- SYNJ1 early-onset parkinsonism
- autosomal recessive early-onset parkinsonism-dystonia, SYNJ1-related

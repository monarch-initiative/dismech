pathophysiology:
- name: Synaptojanin-1 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is a biallelic Sac1-domain defect of synaptojanin-1, a
    presynaptic phosphoinositide phosphatase. The recurrent PARK20 allele
    (p.Arg258Gln) lies in the N-terminal Sac1 domain and selectively abolishes
    its PI4P/PI3P phosphatase activity while leaving the central 5-phosphatase
    (PI(4,5)P2) activity intact — a partial loss of function. Complete loss of
    synaptojanin-1 causes a distinct, lethal developmental and epileptic
    encephalopathy, so the node binds the Sac1 activity specifically rather than
    total enzyme loss.

notes: >-
  No GeneReviews chapter covers SYNJ1-related Parkinson disease (PARK20); the
  clinical baseline is drawn from the primary case series and the MDSGene
  atypical-parkinsonism systematic review (PMID:34396589).
pathophysiology:
- name: Synaptojanin-1 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of SYNJ1, which encodes synaptojanin-1, a
    presynaptic phosphoinositide phosphatase. Its 5-phosphatase domain
    dephosphorylates PI(4,5)P2 to disassemble the clathrin coat during
    synaptic-vesicle endocytosis. The index PARK20 allele is a homozygous
    missense variant (p.Arg258Gln) in the Sac1 phosphatase domain, consistent
    with loss of phosphatase function.
  genes:
  - preferred_term: SYNJ1
    term:
      id: hgnc:11503
      label: SYNJ1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic SYNJ1 variants; homozygous p.Arg258Gln in the Sac1 phosphatase
      domain in the index consanguineous family.
  molecular_functions:
  - preferred_term: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
    term:
      id: GO:0004439
      label: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  evidence:
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification, by homozygosity mapping and exome sequencing, of a SYNJ1 homozygous mutation (p.Arg258Gln) segregating with disease in an Italian consanguineous family with Parkinsonism, dystonia, and cognitive deterioration."
    explanation: Identifies the biallelic SYNJ1 variant that is the root lesion of PARK20.
  - reference: PMID:23804577
    reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "SYNJ1 encodes synaptojanin 1, a phosphoinositide phosphatase protein with essential roles in the postendocytic recycling of synaptic vesicles."
    explanation: States the phosphoinositide-phosphatase function whose loss is the root lesion; restates established protein function, hence OTHER/BACKGROUND.
  - reference: PMID:23804563
    reference_title: "The Sac1 domain of SYNJ1 identified mutated in a family with early-onset progressive Parkinsonism with generalized seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "This mutation impaired the phosphatase activity of SYNJ1 against its Sac1 domain substrates in vitro."
    explanation: In vitro enzymatic assay confirms the Arg258Gln Sac1-domain variant is loss-of-function for phosphatase activity, the root lesion this node asserts.
  downstream:
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    causal_link_type: DIRECT
    description: Loss of synaptojanin-1 PI(4,5)P2 phosphatase activity removes the clathrin-uncoating step needed for synaptic-vesicle endocytosis.
    evidence:
    - reference: PMID:23804577
      reference_title: "Mutation in the SYNJ1 gene associated with autosomal recessive, early-onset Parkinsonism."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "SYNJ1 encodes synaptojanin 1, a phosphoinositide phosphatase protein with essential roles in the postendocytic recycling of synaptic vesicles."
      explanation: The lost phosphatase function is required for the postendocytic vesicle recycling the next node describes.
- name: Impaired Synaptic Vesicle Endocytosis and Recycling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without synaptojanin-1 PI(4,5)P2 dephosphorylation, the clathrin coat is not
    shed and synaptic-vesicle endocytosis and recycling into the releasable pool
    are impaired at the nerve terminal. This is the presynaptic, endocytic
    mechanism SYNJ1 shares with DNAJC6 (PARK19), as distinct from the
    mitochondrial-quality-control mechanism of PRKN and PINK1.
  biological_processes:
  - preferred_term: synaptic vesicle endocytosis
    term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    modifier: DECREASED
  - preferred_term: phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: DECREASED
  cell_types:

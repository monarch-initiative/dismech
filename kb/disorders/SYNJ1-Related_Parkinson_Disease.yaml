animal_models:
- name: Synj1 R258Q knock-in mouse
  species: Mouse
  genotype: Synj1 R258Q homozygous knock-in (Sac1-domain mutation)
  publication: PMID:28231468
  description: >-
    Mouse carrying the human PARK20 Sac1-domain R258Q mutation in Synj1. The
    mice develop neurological manifestations resembling the human disease, with
    synaptic endocytic defects, accumulation of clathrin-coated intermediates,
    and dystrophic changes selective to dopaminergic axons in the dorsal
    striatum.
  modeled_mechanisms:
  - target: Impaired Synaptic Vesicle Endocytosis and Recycling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The knock-in reproduces the presynaptic endocytic defect: synapses show
      failed clathrin uncoating and accumulation of clathrin-coated endocytic
      intermediates, the cellular mechanism this node describes.
    readouts:
    - name: Clathrin-coated endocytic intermediate accumulation at synapses
      target: Impaired Synaptic Vesicle Endocytosis and Recycling
      direction: INCREASED
      interpretation: Accumulated clathrin-coated intermediates index the failed uncoating step of synaptic-vesicle endocytosis.
      evidence:
      - reference: PMID:28231468
        reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Synapses of these mice displayed endocytic defects and a striking accumulation of clathrin-coated intermediates, strongly implicating Sac domain's activity in endocytic protein dynamics."
        explanation: Reports the measured accumulation of clathrin-coated endocytic intermediates.
    evidence:
    - reference: PMID:28231468
      reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that mice carrying this mutation developed neurological manifestations similar to those of human patients."
      explanation: Establishes the knock-in as an informative model of the human SYNJ1 disease mechanism.
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model shows dystrophic terminal changes selective to dopaminergic
      axons in the dorsal striatum, a presynaptic correlate of the human
      nigrostriatal degeneration rather than frank loss of nigral dopaminergic
      neuron cell bodies.
    limitations: >-
      The reported pathology is dystrophic dopaminergic axon terminals in the
      dorsal striatum, not frank substantia nigra pars compacta neuron loss, so
      the model captures an earlier axonal stage rather than the full
      nigrostriatal cell-body degeneration of the human disease.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's measured quantity is dystrophic dopaminergic axon terminals
        in the dorsal striatum; the node's quantity is degeneration of
        substantia nigra pars compacta dopaminergic neuron cell bodies. Axonal
        dystrophy stands in for, and precedes, the cell-body loss.
    readouts:
    - name: Dystrophic dopaminergic axon terminals in dorsal striatum
      target: Nigrostriatal Dopaminergic Neurodegeneration
      direction: INCREASED
      interpretation: Selective dopaminergic axonal dystrophy, the model's presynaptic correlate of nigrostriatal degeneration.
      evidence:
      - reference: PMID:28231468
        reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "dystrophic axonal terminal changes were selectively observed in dopaminergic axons in the dorsal striatum."
        explanation: Reports the selective dopaminergic axonal dystrophy measured in the model.
    evidence:
    - reference: PMID:28231468
      reference_title: "Parkinson Sac Domain Mutation in Synaptojanin 1 Impairs Clathrin Uncoating at Synapses and Triggers Dystrophic Changes in Dopaminergic Axons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "dystrophic axonal terminal changes were selectively observed in dopaminergic axons in the dorsal striatum."
      explanation: The selective dopaminergic axonal pathology links the model to the nigrostriatal-degeneration node at an earlier axonal stage.
differential_diagnoses:
- name: DNAJC6-Related Parkinson Disease
  description: >-
    The other presynaptic, endocytic recessive parkinsonism (PARK19): DNAJC6
    encodes auxilin, the clathrin-uncoating co-chaperone required for the same
    postendocytic synaptic-vesicle recycling, and presents with early-onset
    parkinsonism, dystonia and poor levodopa response, as SYNJ1 does.
- name: PRKN and PINK1 Early-Onset Parkinson Disease
  description: >-
    The common recessive early-onset parkinsonisms, which act through
    mitochondrial quality control (mitophagy) rather than synaptic-vesicle
    endocytosis; they are typically more levodopa-responsive and lack the
    dystonia and cognitive features of SYNJ1 disease.
- name: SYNJ1-Related Developmental and Epileptic Encephalopathy
  description: >-
    The other, distinct disease caused by biallelic SYNJ1 variants: a severe
    early-infantile developmental and epileptic encephalopathy, a separate MONDO
    concept, which is not this PARK20 parkinsonism entry.

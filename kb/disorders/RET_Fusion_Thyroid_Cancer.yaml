- reference: DOI:10.1186/s12885-023-10852-z
  title: Highly sensitive droplet digital PCR for detection of RET fusion in papillary thyroid cancer
  found_in:
  - RET_Fusion_Thyroid_Cancer-deep-research-falcon.md
  findings:
  - statement: RET fusions are recurrent drivers of papillary thyroid carcinoma with CCDC6::RET representing approximately 60% of TCGA RET-rearranged cases.
    supporting_text: RET fusions were observed in 25 (6.2%) of the 402 TCGA samples, and 15 (60%) of the RET fusion-positive patients had the CCDC6::RET fusion.
    evidence:
    - reference: DOI:10.1186/s12885-023-10852-z
      reference_title: Highly sensitive droplet digital PCR for detection of RET fusion in papillary thyroid cancer
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RET fusions were observed in 25 (6.2%) of the 402 TCGA samples, and 15 (60%) of the RET fusion-positive patients had the CCDC6::RET fusion.
      explanation: Quantifies RET fusion frequency and CCDC6::RET predominance in TCGA papillary thyroid carcinoma.
- reference: DOI:10.1200/jco.23.02503
  title: 'Durability of Response With Selpercatinib in Patients With <i>RET</i>-Activated Thyroid Cancer: Long-Term Safety and Efficacy From LIBRETTO-001'
  found_in:
  - RET_Fusion_Thyroid_Cancer-deep-research-falcon.md
  findings:
  - statement: Long-term LIBRETTO-001 follow-up demonstrated high objective response rates and durable progression-free survival with selpercatinib in RET fusion-positive thyroid cancer.
    supporting_text: We present long-term safety and efficacy from LIBRETTO-001 in patients with RET-mutant medullary thyroid cancer (MTC; n = 324) and RET fusion-positive thyroid cancer encompassing different histological subtypes (TC; n = 66). At the data cutoff of January 2023, the objective response rate was 82.5% among patients with cabozantinib/vandetanib-naïve MTC and 95.8% among patients with treatment-naïve TC.
    evidence:
    - reference: DOI:10.1200/jco.23.02503
      reference_title: 'Durability of Response With Selpercatinib in Patients With <i>RET</i>-Activated Thyroid Cancer: Long-Term Safety and Efficacy From LIBRETTO-001'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We present long-term safety and efficacy from LIBRETTO-001 in patients with RET-mutant medullary thyroid cancer (MTC; n = 324) and RET fusion-positive thyroid cancer encompassing different histological subtypes (TC; n = 66). At the data cutoff of January 2023, the objective response rate was 82.5% among patients with cabozantinib/vandetanib-naïve MTC and 95.8% among patients with treatment-naïve TC.
      explanation: Reports long-term efficacy of selpercatinib in 66 patients with RET fusion-positive thyroid cancer.
- reference: DOI:10.1530/erc-23-0117
  title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
  found_in:
  - RET_Fusion_Thyroid_Cancer-deep-research-falcon.md
  findings:
  - statement: RET fusion-positive papillary thyroid carcinomas are enriched in pediatric/adolescent patients and show high rates of lymph node and distant metastases with favorable long-term disease-specific survival.
    supporting_text: RET fusion-positive carcinomas were associated with aggressive tumor behavior, including high rates of lymph node (75.2%) and distant metastases (18.6%), significantly higher than in NTRK fusion, BRAF V600E and RAS-positive carcinomas.
    evidence:
    - reference: DOI:10.1530/erc-23-0117
      reference_title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RET fusion-positive carcinomas were associated with aggressive tumor behavior, including high rates of lymph node (75.2%) and distant metastases (18.6%), significantly higher than in NTRK fusion, BRAF V600E and RAS-positive carcinomas.
      explanation: Characterizes cohort frequency and metastatic behavior of RET fusion-positive papillary thyroid carcinomas.
- reference: DOI:10.3389/fendo.2024.1346476
  title: Systemic treatments for radioiodine-refractory thyroid cancers
  found_in:
  - RET_Fusion_Thyroid_Cancer-deep-research-falcon.md
  findings:
  - statement: RTK rearrangements in differentiated thyroid cancer activate MAPK and PI3K signaling, causing follicular dedifferentiation, NIS dysfunction, and radioiodine refractoriness.
    supporting_text: These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs.
    evidence:
    - reference: DOI:10.3389/fendo.2024.1346476
      reference_title: Systemic treatments for radioiodine-refractory thyroid cancers
      supports: SUPPORT
      evidence_source: OTHER
      snippet: These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs.
      explanation: Summarizes the signaling mechanism linking RTK rearrangements to radioiodine-refractory differentiated thyroid cancer.
- reference: DOI:10.3390/cancers15164146
  title: RET-Altered Cancers—A Tumor-Agnostic Review of Biology, Diagnosis and Targeted Therapy Activity
  found_in:
  - RET_Fusion_Thyroid_Cancer-deep-research-falcon.md
  findings:
  - statement: RET fusions are optimally detected by DNA/RNA next-generation sequencing and effectively targeted by selective RET inhibitors selpercatinib and pralsetinib.
    supporting_text: RET alterations are best identified via comprehensive next-generation sequencing, preferably with DNA and RNA interrogation for fusions.
    evidence:
    - reference: DOI:10.3390/cancers15164146
      reference_title: RET-Altered Cancers—A Tumor-Agnostic Review of Biology, Diagnosis and Targeted Therapy Activity
      supports: SUPPORT
      evidence_source: OTHER
      snippet: RET alterations are best identified via comprehensive next-generation sequencing, preferably with DNA and RNA interrogation for fusions.
      explanation: Reviews optimal molecular diagnostic detection and selective RET inhibition in RET-altered malignancies.

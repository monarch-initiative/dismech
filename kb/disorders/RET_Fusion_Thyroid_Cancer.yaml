    reference_title: RET-Altered Cancers—A Tumor-Agnostic Review of Biology, Diagnosis and Targeted Therapy Activity
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RET alterations, such as fusions or mutations, drive the growth of multiple tumor types. These alterations are found in canonical (lung and thyroid) and non-canonical (e.g., gastrointestinal, breast, gynecological, genitourinary, histiocytic) cancers."
    explanation: "Establishes oncogenic RET fusions as primary oncogenic drivers in thyroid cancer."
  - reference: DOI:10.1530/erc-23-0117
    reference_title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusion genes were not detected in any low-risk neoplasm or benign thyroid tissue and were detected only in papillary thyroid carcinomas (PTCs), in 113/993 (11.4%) patients, three times more frequently in pediatric and adolescent patients (29.8%) than in adult patients (8.7%)."
    explanation: "Demonstrates across 1564 thyroid samples that somatic RET fusion genes were absent from benign or low-risk lesions and detected exclusively in papillary thyroid carcinomas."
  downstream:
  - target: RAS-MAPK Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Constitutively autophosphorylated chimeric RET kinases (via phosphorylated
      Y1062 adaptor docking) trigger RAS-RAF-MEK-ERK cascade activation.

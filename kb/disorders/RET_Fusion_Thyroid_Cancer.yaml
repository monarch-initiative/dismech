- name: Papillary Thyroid Tumorigenesis and Locoregional Metastasis
  biological_scale: TISSUE
  description: >-
    Transformed RET fusion-positive follicular cells form primary papillary thyroid
    carcinomas (frequently diffuse sclerosing, classic, or solid variants) with marked
    propensity for regional lymph node metastasis (75.2% in large surgical cohorts) and
    distant metastasis (18.6%), including in pediatric and adolescent patients.
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  locations:
  - preferred_term: thyroid gland
    term:
      id: UBERON:0002046
      label: thyroid gland
  evidence:
  - reference: DOI:10.1530/erc-23-0117
    reference_title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusion-positive carcinomas were associated with aggressive tumor behavior, including high rates of lymph node (75.2%) and distant metastases (18.6%), significantly higher than in NTRK fusion, BRAF V600E and RAS-positive carcinomas."
    explanation: "Quantifies the aggressive locoregional lymph node and distant metastatic behavior of RET fusion-positive papillary thyroid carcinomas."
  downstream:
  - target: Thyroid Nodule
    causal_link_type: DIRECT
    description: Primary clonal growth within the thyroid parenchyma presents clinically or ultrasonographically as a thyroid nodule.
  - target: Thyroid Carcinoma
    causal_link_type: DIRECT
    description: Malignant follicular-cell transformation produces histopathologically confirmed papillary thyroid carcinoma.
  - target: Cervical Lymphadenopathy
    causal_link_type: DIRECT
    description: Frequent lymphatic dissemination from the primary thyroid tumor produces metastatic cervical lymphadenopathy.

- name: RET Fusion and Constitutive Kinase Activation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  description: >-
    Somatic chromosomal inversions or translocations in thyroid follicular epithelial cells
    fuse the intracellular RET tyrosine kinase domain with 5' partner genes encoding
    oligomerization domains (such as CCDC6 or NCOA4), generating constitutively dimerized,
    ligand-independent oncogenic RET chimeric kinases.

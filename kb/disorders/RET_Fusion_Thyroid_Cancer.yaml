treatments:
- name: Thyroidectomy
  therapeutic_modality: SURGERY
  description: >-
    Surgical resection (total thyroidectomy with appropriate compartment lymph node
    dissection) is the primary curative treatment for localized and locoregionally
    metastatic differentiated thyroid carcinoma.
  treatment_term:
    preferred_term: Thyroidectomy
    term:
      id: NCIT:C51648
      label: Thyroidectomy
  evidence:
  - reference: DOI:10.3389/fendo.2024.1346476
    reference_title: Systemic treatments for radioiodine-refractory thyroid cancers
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Due to DTCs’ distinctive radioiodine (RAI) uptake mechanism, standard treatment involving surgery, with or without adjunctive therapy using RAI and levothyroxine inhibition, typically yields favorable prognoses for the majority of patients with DTCs."
    explanation: "Confirms surgical resection as standard primary therapy for differentiated thyroid cancers."
- name: Radioiodine Therapy
  therapeutic_modality: RADIOTHERAPY
  description: >-
    Adjuvant radioactive iodine (RAI) therapy is administered selectively after surgery for
    intermediate- or high-risk RET fusion-positive differentiated thyroid cancer that
    retains iodine avidity.
  treatment_term:
    preferred_term: Radioactive Iodine Therapy
    term:
      id: NCIT:C157968
      label: Radioactive Iodine Therapy
  evidence:
  - reference: DOI:10.3389/fendo.2024.1346476
    reference_title: Systemic treatments for radioiodine-refractory thyroid cancers
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Due to DTCs’ distinctive radioiodine (RAI) uptake mechanism, standard treatment involving surgery, with or without adjunctive therapy using RAI and levothyroxine inhibition, typically yields favorable prognoses for the majority of patients with DTCs."
    explanation: "Supports adjunctive radioactive iodine therapy in iodine-avid differentiated thyroid cancer."
- name: Selpercatinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Highly selective ATP-competitive small-molecule RET kinase inhibitor approved for
    advanced or metastatic RET fusion-positive thyroid cancer requiring systemic therapy and
    radioiodine-refractory if RAI is appropriate, achieving high and durable objective
    response rates in LIBRETTO-001.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: selpercatinib
      term:
        id: NCIT:C134987
        label: Selpercatinib
  target_mechanisms:
  - target: RET Fusion and Constitutive Kinase Activation
    treatment_effect: INHIBITS
    description: Directly inhibits constitutively active chimeric RET fusion tyrosine kinase signaling.
  evidence:
  - reference: DOI:10.1200/jco.23.02503
    reference_title: 'Durability of Response With Selpercatinib in Patients With <i>RET</i>-Activated Thyroid Cancer: Long-Term Safety and Efficacy From LIBRETTO-001'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present long-term safety and efficacy from LIBRETTO-001 in patients with RET-mutant medullary thyroid cancer (MTC; n = 324) and RET fusion-positive thyroid cancer encompassing different histological subtypes (TC; n = 66). At the data cutoff of January 2023, the objective response rate was 82.5% among patients with cabozantinib/vandetanib-naïve MTC and 95.8% among patients with treatment-naïve TC."
    explanation: "Demonstrates durable clinical activity (95.8% objective response rate in treatment-naive RET fusion-positive thyroid cancer) in LIBRETTO-001."
  - reference: DOI:10.1158/1078-0432.ccr-23-0459
    reference_title: 'FDA Approval Summary: Selpercatinib for the Treatment of Advanced <i>RET</i> Fusion-Positive Solid Tumors'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommendation for approval was supported by results from LIBRETTO-001 in patients with RET fusion-positive NSCLC and thyroid cancer, which formed the basis of prior approvals in these tumor types."
    explanation: "Confirms prior FDA approval of selpercatinib specifically for RET fusion-positive thyroid cancer."
- name: Pralsetinib

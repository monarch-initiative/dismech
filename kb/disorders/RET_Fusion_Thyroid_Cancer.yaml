genetic:
- name: RET
  gene_term:
    preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  association: Somatic Oncogenic Gene Fusions
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic RET fusions were detected in 6.2% of TCGA papillary thyroid
    carcinomas (DOI:10.1186/s12885-023-10852-z) and 11.4% of PTCs in a
    1564-sample surgical cohort—including 29.8% of pediatric/adolescent PTCs
    versus 8.7% of adult PTCs—spanning 20 distinct RET fusion types
    (DOI:10.1530/erc-23-0117), with CCDC6::RET (RET/PTC1) accounting for
    60% of TCGA RET-rearranged cases.

  findings:
  - statement: RTK rearrangements in differentiated thyroid cancer activate MAPK and PI3K signaling, causing follicular dedifferentiation, NIS dysfunction, and radioiodine refractoriness.
    supporting_text: These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs.

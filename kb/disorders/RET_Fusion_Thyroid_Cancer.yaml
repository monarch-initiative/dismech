    thyroid carcinoma.
  evidence:
  - reference: PMID:21221869
    reference_title: "Papillary thyroid carcinoma variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical staining with TTF-1 and thyroglobulin is very useful in confirming the diagnosis of papillary thyroid carcinoma especially in metastatic sites."
    explanation: "Supports thyroglobulin as a diagnostic marker of follicular-cell-derived papillary thyroid carcinoma."
genetic:
- name: RET
  gene_term:
    preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  association: Somatic Oncogenic Gene Fusions
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic RET fusions occur in roughly 6-20% of papillary thyroid carcinomas overall (and
    nearly 30% of pediatric/adolescent PTCs), with CCDC6::RET (RET/PTC1) accounting for
    approximately 60% of fusions alongside NCOA4::RET (RET/PTC3) and at least 18 additional
    partners.
  evidence:
  - reference: PMID:39502057
    reference_title: "[Correlations of Ultrasound Features With Gene Mutations and Pathologic Subtypes in Papillary Thyroid Carcinoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common gene mutations in PTC include BRAF V600E,RET/PTC rearrangement,and RAS mutations."
    explanation: "Identifies RET/PTC rearrangements among the principal somatic driver alterations in papillary thyroid carcinoma."
  - reference: DOI:10.1186/s12885-023-10852-z
    reference_title: Highly sensitive droplet digital PCR for detection of RET fusion in papillary thyroid cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusions were observed in 25 (6.2%) of the 402 TCGA samples, and 15 (60%) of the RET fusion-positive patients had the CCDC6::RET fusion."
    explanation: "Quantifies RET fusion prevalence in TCGA papillary thyroid carcinoma and establishes CCDC6::RET as the predominant fusion partner."

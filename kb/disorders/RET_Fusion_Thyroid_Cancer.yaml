has_subtypes:
- name: RET/PTC1 (CCDC6-RET)
  description: >-
    Most common RET rearrangement in sporadic papillary thyroid cancer,
    accounting for approximately 60% of RET fusions and associated with classic
    papillary histology. The CCDC6 partner provides a coiled-coil dimerization
    domain.
  evidence:
  - reference: DOI:10.1186/s12885-023-10852-z
    reference_title: Highly sensitive droplet digital PCR for detection of RET fusion in papillary thyroid cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusions were observed in 25 (6.2%) of the 402 TCGA samples, and 15 (60%) of the RET fusion-positive patients had the CCDC6::RET fusion."
    explanation: "Establishes CCDC6::RET (RET/PTC1) as accounting for 60% of RET fusions in TCGA papillary thyroid carcinoma."
  - reference: DOI:10.3389/pore.2023.1611138
    reference_title: RET rearrangements are relevant to histopathologic subtypes and clinicopathological features in Thai papillary thyroid carcinoma patients
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CCDC6 ::RET is more associated with sporadic thyroid cancer (8, 9) and with older patients and classic subtypes of papillary carcinoma"
    explanation: "Links CCDC6::RET to sporadic papillary thyroid carcinoma and classic subtype histology."
- name: RET/PTC3 (NCOA4-RET)
  description: >-
    Second most common RET rearrangement, strongly associated with ionizing
    radiation exposure, short radiation latency, solid and tall-cell PTC
    subtypes, angio/lymphatic invasion, and lymph node metastasis.
  evidence:
  - reference: DOI:10.3389/pore.2023.1611138
    reference_title: RET rearrangements are relevant to histopathologic subtypes and clinicopathological features in Thai papillary thyroid carcinoma patients
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The NCOA4 ::RET rearrangement correlates with a more aggressive phenotype and a more advanced stage of PTC. Those fusion genes are also strongly associated with short radiation latency and solid subtypes of PTC"
    explanation: "Documents the association of NCOA4::RET (RET/PTC3) with short radiation latency, solid PTC histology, and aggressive clinical stage."
  - reference: DOI:10.3389/pore.2023.1611138
    reference_title: RET rearrangements are relevant to histopathologic subtypes and clinicopathological features in Thai papillary thyroid carcinoma patients
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While NCOA4::RET was associated with the tall-cell subtype, and presence of angio/lymphatic invasion and lymph node metastasis"
    explanation: "Demonstrates clinicopathological association of NCOA4::RET with tall-cell histology, angio/lymphatic invasion, and nodal metastasis."
- name: Other RET Fusions
  description: >-
    Diverse rarer 5' fusion partners (including PRKAR1A in RET/PTC2 and at least
    17 other partners across 20 identified RET fusion types) fuse oligomerization
    domains to the RET kinase domain to drive constitutive RET activation.
  evidence:
  - reference: DOI:10.1530/erc-23-0117
    reference_title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 20 types of RET fusions were identified."
    explanation: "Confirms a broad spectrum of 20 distinct RET fusion types across papillary thyroid carcinomas beyond the two canonical rearrangements."

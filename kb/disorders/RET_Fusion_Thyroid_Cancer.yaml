notes: >-
  MONDO lacks a dedicated molecular-subtype class for RET fusion-positive thyroid carcinoma,
  so disease_term anchors via skos:broadMatch to the broader parent class MONDO:0005075
  (thyroid gland papillary carcinoma), while synonyms are restricted to RET-fusion-specific
  labels. The general papillary thyroid carcinoma StatPearls chapter covers the parent
  histologic class broadly rather than this RET-fusion-defined molecular subtype.

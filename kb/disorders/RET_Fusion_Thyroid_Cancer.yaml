name: RET Fusion-Positive Thyroid Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  RET fusion-positive thyroid cancer is a molecularly defined subset of differentiated
  thyroid carcinoma—occurring almost exclusively in papillary thyroid carcinoma (PTC)—that
  harbors somatic chromosomal rearrangements fusing the 3' intracellular tyrosine kinase
  domain of the RET proto-oncogene to 5' partner genes (most commonly CCDC6 in RET/PTC1 and
  NCOA4 in RET/PTC3) encoding coiled-coil dimerization domains. Ionizing radiation exposure
  (particularly in young children) strongly predisposes to RET rearrangements, especially
  NCOA4::RET. Ligand-independent chimeric kinase activation arises in thyroid follicular
  cells, separately activating downstream RAS-MAPK and PI3K-AKT pathways, driving primary
  papillary tumorigenesis as well as follicular dedifferentiation with sodium/iodide
  symporter (NIS) loss in advanced disease, and producing high rates of cervical lymph node
  (75.2%) and distant metastases (18.6%). Selective RET kinase inhibitors selpercatinib and
  pralsetinib achieve high, durable response rates in advanced or radioiodine-refractory RET
  fusion-positive thyroid carcinoma.
synonyms:
- RET-rearranged thyroid cancer
- RET/PTC-positive papillary thyroid carcinoma
- RET fusion thyroid carcinoma
categories:
- Endocrine Cancer
- Molecularly-Defined Cancer
parents:
- thyroid carcinoma
disease_term:
  preferred_term: RET fusion-positive papillary thyroid carcinoma
  term:

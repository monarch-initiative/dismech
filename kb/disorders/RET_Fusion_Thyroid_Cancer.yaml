  biological_scale: CELLULAR
  description: >-
    Constitutive RET fusion kinase signaling chronically activates mitogen-activated protein
    kinase (RAS-RAF-MEK-ERK) and phosphatidylinositol 3-kinase (PI3K-AKT) cascades in
    thyroid follicular cells, driving sustained proliferation and survival.

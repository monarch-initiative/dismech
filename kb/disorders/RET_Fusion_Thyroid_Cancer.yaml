    snippet: "A total of 392 patients with advanced RAI-RTCs were recruited in this study, and the primary endpoint was PFS. The PFS of the lenvatinib group (n=261) and the placebo group (n=131) were 18.3 and 3.6 months, respectively. The treatment response rate of the Lenvatinib group was 64.8% and four patients had complete responses (CR), while that of the control group was only 1.5% and all responses were partial ( 128)."

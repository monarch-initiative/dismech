      label: cell population proliferation
  evidence:
  - reference: DOI:10.3389/fendo.2024.1346476
    reference_title: Systemic treatments for radioiodine-refractory thyroid cancers
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent research has revealed that the genetic mutations and gene rearrangements affecting sites such as RTKs, RAS, BRAF and TERTp lead to structural and functional abnormalities in encoded proteins. These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs."
    explanation: "Links RTK gene rearrangements in differentiated thyroid cancer to aberrant activation of MAPK and PI3K signaling."
  downstream:
  - target: Follicular Cell Dedifferentiation and Sodium/Iodide Symporter Dysfunction
    causal_link_type: DIRECT
    description: Persistent oncogenic MAPK and PI3K signaling downregulates thyroid-specific differentiation genes and impairs sodium/iodide symporter expression in progressive disease.
  - target: Papillary Thyroid Tumorigenesis and Locoregional Metastasis
    causal_link_type: DIRECT
    description: Mitogenic MAPK and survival PI3K signaling drive clonal papillary tumor growth and lymphatic invasion.
- name: Follicular Cell Dedifferentiation and Sodium/Iodide Symporter Dysfunction
  biological_scale: CELLULAR
  description: >-
    In advanced or progressive RET-rearranged differentiated thyroid carcinomas, chronic
    MAPK and PI3K pathway activation suppresses thyroid follicular differentiation and
    impairs sodium/iodide symporter (NIS) function, reducing radioactive iodine avidity and
    producing radioiodine-refractory disease.
  cell_types:

      evidence_source: HUMAN_CLINICAL
      snippet: "Thyroid cancer is the most frequent malignancy of the endocrine system, of which papillary thyroid cancer (PTC) is the predominant form with a rapid increasing incidence worldwide. Rearranged during transfection (RET) fusions are common genetic drivers of PTC and the potent RET inhibitor selpercatinib has been recently approved for treating advanced or metastatic RET fusion-positive thyroid cancer."

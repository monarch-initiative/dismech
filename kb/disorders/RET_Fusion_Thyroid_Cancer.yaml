    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusions were observed in 25 (6.2%) of the 402 TCGA samples, and 15 (60%) of the RET fusion-positive patients had the CCDC6::RET fusion."
    explanation: "Quantifies RET fusion prevalence (6.2%) in TCGA papillary thyroid carcinoma and establishes CCDC6::RET as accounting for 60% of cases."
  - reference: DOI:10.1530/erc-23-0117
    reference_title: 'RET fusion genes in pediatric and adult thyroid carcinomas: cohort characteristics and prognosis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RET fusion genes were not detected in any low-risk neoplasm or benign thyroid tissue and were detected only in papillary thyroid carcinomas (PTCs), in 113/993 (11.4%) patients, three times more frequently in pediatric and adolescent patients (29.8%) than in adult patients (8.7%). A total of 20 types of RET fusions were identified."

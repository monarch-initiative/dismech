name: RET Fusion-Positive Thyroid Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  RET fusion-positive thyroid cancer is a molecularly defined subset of differentiated
  thyroid carcinoma—occurring almost exclusively in papillary thyroid carcinoma (PTC)—that
  harbors somatic chromosomal rearrangements fusing the 3' tyrosine kinase domain of the RET
  proto-oncogene to 5' partner genes (most commonly CCDC6 in RET/PTC1 and NCOA4 in RET/PTC3)
  encoding coiled-coil dimerization domains. Ligand-independent chimeric kinase activation
  arises in thyroid follicular cells, hyperactivating downstream MAPK and PI3K-AKT pathways,
  impairing follicular differentiation and sodium/iodide symporter function in advanced
  disease, and driving high rates of cervical lymph node and distant metastases, especially
  in pediatric, adolescent, and radiation-associated cohorts. Selective RET kinase inhibitors
  selpercatinib and pralsetinib achieve high, durable response rates in advanced or
  radioiodine-refractory RET fusion-positive thyroid carcinoma.
synonyms:
- RET-rearranged thyroid cancer
- RET/PTC-positive papillary thyroid carcinoma
- RET fusion thyroid carcinoma
categories:
- Endocrine Cancer
- Molecularly-Defined Cancer
parents:
- thyroid carcinoma

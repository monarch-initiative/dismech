mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005075
      label: thyroid gland papillary carcinoma
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      RET fusion-positive papillary thyroid carcinoma is a molecularly defined
      stratum of MONDO's thyroid gland papillary carcinoma class, not the
      class itself: MONDO has no term for the stratum, so disease_term anchors
      to the broader parent class while skos:broadMatch records that the object
      MONDO:0005075 is broader than this entry (design decisions section 3a).
      The parent class itself is claimed as an exactMatch by
      Papillary_Thyroid_Carcinoma.

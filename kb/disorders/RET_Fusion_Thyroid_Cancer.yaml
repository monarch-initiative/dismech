    evidence_source: OTHER
    snippet: "Targeted therapies for RET-dependent cancers have evolved from older multikinase inhibitors to selective inhibitors of RET such as selpercatinib and pralsetinib. Prospective basket trials and retrospective reports have demonstrated the activity of these drugs in a wide variety of RET-altered cancers, notably those with RET fusions."

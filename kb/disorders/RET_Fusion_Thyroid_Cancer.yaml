    snippet: "These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs."
    explanation: "Demonstrates that RTK-rearrangement-driven MAPK/PI3K activation causes follicular dedifferentiation, NIS dysfunction, and radioiodine refractoriness."
  downstream:

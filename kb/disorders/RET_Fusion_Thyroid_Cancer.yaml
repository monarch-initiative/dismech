    - reference: DOI:10.3389/pore.2023.1611138
      reference_title: RET rearrangements are relevant to histopathologic subtypes and clinicopathological features in Thai papillary thyroid carcinoma patients
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Both types of RET fusion have comparable levels of Y1062 phosphorylation but, MAPK phosphorylation is higher in NCOA4 ::RET than in CCDC6 :: RET (14)."
      explanation: "Links autophosphorylated RET fusions directly to downstream MAPK phosphorylation."
  - target: PI3K-AKT Pathway Activation
    causal_link_type: DIRECT
    description: >-
      Aberrant chimeric RTK fusion proteins recruit adaptor complexes that
      activate downstream PI3K-AKT survival and metabolic signaling.
    evidence:
    - reference: DOI:10.3389/fendo.2024.1346476
      reference_title: Systemic treatments for radioiodine-refractory thyroid cancers
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Recent research has revealed that the genetic mutations and gene rearrangements affecting sites such as RTKs, RAS, BRAF and TERTp lead to structural and functional abnormalities in encoded proteins. These abnormalities aberrantly activate signaling pathways like the mitogen-activated protein kinase (MAPK) and phosphatidylinositol-3-hydroxykinase (PI3K) signaling pathways, resulting in thyroid cells dedifferentiation, sodium/iodide symporter (NIS) dysfunction, and consequent the RAI-refractory nature of DTCs."

genetic:
- name: MNX1
  gene_term:
    preferred_term: MNX1
    term:
      id: hgnc:4979
      label: MNX1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  variants:
  - name: Intragenic MNX1 truncating and homeodomain missense variants
    description: >-
      More than a hundred different heterozygous intragenic MNX1 variants are
      reported. Frameshift and nonsense variants make up more than half,
      supporting haploinsufficiency; missense variants cluster in the
      homeodomain and replace highly conserved residues. No consistent
      genotype-phenotype correlation has been found among intragenic variants.
    type: frameshift, nonsense, splice-site and homeodomain missense
    evidence:
    - reference: PMID:18449898
      reference_title: Spectrum of HLXB9 gene mutations in Currarino syndrome and genotype-phenotype correlation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Truncating mutations (frameshifts or nonsense mutations) represent 57%
        of those identified, suggesting that haploinsufficiency is the basis
        of CS.
      explanation: Predominance of truncating variants in a 50-index-case series.
    - reference: PMID:10749657
      reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The other eight mutations were missense mutations that were
        significantly clustered in the homeodomain, resulting, in each patient,
        in nonconservative substitution of a highly conserved amino acid.
      explanation: Missense variants cluster in the DNA-binding homeodomain.
  - name: Whole MNX1 gene deletion
    description: >-
      A heterozygous 5.8 kb deletion removing the entire MNX1 gene and no
      other known gene causes typical Currarino syndrome in a Norwegian family,
      showing that loss of one copy is sufficient. Dosage analysis (MLPA or
      microarray) is needed when sequencing is negative.
    variant_type: deletion
    evidence:
    - reference: PMID:23370340
      reference_title: A 5.8 kb deletion removing the entire MNX1 gene in a Norwegian family with Currarino syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe a Norwegian family with typical CS in which a heterozygous
        deletion removes the entire MNX1 gene but no other known genes.
      explanation: A deletion of MNX1 alone reproduces the disease, consistent with haploinsufficiency.
  - name: 7q36 microdeletions including MNX1
    description: >-
      Terminal or interstitial deletions of 7q36 that include MNX1 cause the
      triad with additional features, chiefly developmental delay or
      intellectual disability, growth retardation and facial dysmorphism,
      attributed to other deleted genes. These patients should have
      chromosomal microarray first.
    variant_type: copy number variation
    evidence:
    - reference: PMID:25691298
      reference_title: Phenotype analysis impacts testing strategy in patients with Currarino syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Less frequently, a complex phenotype of Currarino syndrome can be
        caused by microdeletions of 7q containing MNX1.
      explanation: 7q microdeletions including MNX1 cause a complex form of the syndrome.
    - reference: PMID:10749657
      reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The only genotype-phenotype correlation appeared to be the occurrence
        of developmental delay in the case of three patients with
        microdeletions.
      explanation: Developmental delay distinguishes microdeletion carriers from intragenic variant carriers.
  evidence:
  - reference: PMID:9843207
    reference_title: "A homeobox gene, HLXB9, is the major locus for dominantly inherited sacral agenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We excluded several candidate genes before identifying patient-specific
      mutations in a homeobox gene, HLXB9, which was previously reported to
      map to 1q41-q42.1 and to be expressed in lymphoid and pancreatic tissues.
    explanation: Gene discovery in families with dominantly inherited sacral agenesis.
  - reference: PMID:10749657
    reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report an extensive mutation survey that has identified
      mutations in the HLXB9 gene in 20 of 21 patients tested with familial
      Currarino syndrome.
    explanation: MNX1 variants in nearly all familial cases.
  - reference: PMID:25691298
    reference_title: Phenotype analysis impacts testing strategy in patients with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant loss-of-function mutations in the MNX1 gene cause
      nearly all familial and 30% of sporadic cases.
    explanation: Loss-of-function mechanism and diagnostic yield by family history.
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, MNX1 mutation analysis was successful in only 57.4% of all CS
      patients investigated, with no mutation detected in 7.7% of the familial
      and 68% of the sporadic patients.
    explanation: Pooled diagnostic yield across more than 60 published studies.
  - reference: PMID:29401559
    reference_title: Spectrum of MNX1 Pathogenic Variants and Associated Clinical Features in Korean Patients with Currarino Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in MNX1 were detected in 28% of all CS cases and 25%
      of sporadic cases.
    explanation: Low diagnostic yield in a mostly sporadic Korean cohort.
  - reference: PMID:16498628
    reference_title: HLXB9 homeobox gene and caudal regression syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed that the HLXB9 gene is not involved in the pathogenesis of
      CRS, and to date is known as a causative gene only for CS.
    explanation: >-
      MNX1 variants were absent from 48 patients with caudal regression
      syndrome, so the gene is specific to Currarino syndrome among caudal
      malformations.
  notes: >-
    Heterozygous MNX1 loss of function is the established cause. Pooled across
    published series, an MNX1 variant or deletion is found in about 57% of
    patients: almost all familial cases but only about a third of sporadic
    ones. Proposed explanations for the MNX1-negative sporadic cases are
    somatic mosaicism (one adult woman with a mosaic MNX1 variant present in
    fewer than half of her cells has been reported), variants outside the
    coding region, other loci, and misdiagnosis; several MNX1-negative patients
    have subtly different phenotypes, and in a multicentre series MNX1-positive
    patients more often had the complete triad. MNX1 variants are not found in
    caudal regression syndrome without the Currarino features. Biallelic MNX1
    variants cause a different, recessive disorder, permanent neonatal
    diabetes, which is not part of this entry. No ClinGen gene-disease
    validity assertion for MNX1 was found in the ClinGen export, so no
    gene_disease_validity tier is recorded.
pathophysiology:
- name: MNX1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    MNX1 encodes HB9, a homeodomain transcription factor. In Currarino
    syndrome one copy is lost through truncating variants, homeodomain
    missense variants or deletions, halving the amount of functional HB9
    during early caudal development. Which targets HB9 regulates in the
    developing human caudal embryo is not known.
  genes:
  - preferred_term: MNX1
    term:
      id: hgnc:4979
      label: MNX1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline truncating, homeodomain missense or whole-gene
      deletion alleles of MNX1.
  molecular_functions:
  - preferred_term: HB9 homeodomain transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:18449898
    reference_title: Spectrum of HLXB9 gene mutations in Currarino syndrome and genotype-phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating mutations (frameshifts or nonsense mutations) represent 57%
      of those identified, suggesting that haploinsufficiency is the basis of
      CS.
    explanation: The variant spectrum points to haploinsufficiency.
  - reference: PMID:23370340
    reference_title: A 5.8 kb deletion removing the entire MNX1 gene in a Norwegian family with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a Norwegian family with typical CS in which a heterozygous
      deletion removes the entire MNX1 gene but no other known genes.
    explanation: Loss of one whole MNX1 copy is sufficient to cause the disease.
  downstream:
  - target: Caudal Notochord and Dorsal-Ventral Patterning Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How reduced HB9 dosage produces the caudal defect is unexplained; HB9
      expression has not been detected in the human tail bud notochord, and
      mouse knockouts do not reproduce the malformation.
    evidence:
    - reference: PMID:11528505
      reference_title: Spectrum of mutations and genotype-phenotype analysis in Currarino syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The triad of a presacral tumour, sacral agenesis and anorectal
        malformation constitutes the Currarino syndrome which is caused by
        dorsal-ventral patterning defects during embryonic development.
      explanation: >-
        Places the MNX1-associated syndrome in a dorsal-ventral patterning
        defect of the caudal embryo; the link from MNX1 dosage to that defect
        is inferred rather than demonstrated.
- name: Caudal Notochord and Dorsal-Ventral Patterning Defect
  biological_scale: TISSUE
  description: >-
    The favoured embryological model places the primary error at the caudal
    end of the developing notochord at about Carnegie stage 7 (16 days after
    ovulation), in the tail bud from which notochord, neural tube, somites and
    hindgut all arise. A caudal notochord defect is thought to disturb the
    separation of ventral gut endoderm from dorsal neuroectoderm, leaving
    abnormal connections between them, and to derange secondary neurulation
    and formation of the sacral vertebrae. The model explains why
    anorectal, sacral, presacral and spinal anomalies occur together, but it
    is inferred from the anatomy of the malformations rather than observed.
  locations:
  - preferred_term: notochord
    term:
      id: UBERON:0002328
      label: notochord
  biological_processes:
  - preferred_term: caudal notochord development
    term:
      id: GO:0030903
      label: notochord development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9843207
    reference_title: "A homeobox gene, HLXB9, is the major locus for dominantly inherited sacral agenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malformation at the caudal end of the developing notochord at
      approximately Carnegie stage 7 (16 post-ovulatory days), which results
      in aberrant secondary neurulation, can explain the observed pattern of
      anomalies.
    explanation: >-
      The gene discovery paper's embryological model; an explanatory
      hypothesis consistent with the anomaly pattern.
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      A primary defect in the caudal notochord may prevent some of these cells
      to migrate from the primitive node.
    explanation: Review synthesis of the caudal notochord model.
  downstream:
  - target: Sacral Vertebral Dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hindgut Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Aberrant Secondary Neurulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

name: Currarino Triad
creation_date: "2026-10-29T03:40:00Z"
description: >-
  Currarino triad (Currarino syndrome) is an autosomal dominant malformation of
  the caudal embryo defined by three features: a sacral bone defect (typically
  a sickle-shaped or scimitar sacrum, hemisacrum, or agenesis below S2), an
  anorectal malformation (most often anal or anorectal stenosis, sometimes an
  imperforate or anteriorly placed anus), and a presacral mass, which may be an
  anterior sacral meningocele, a mature teratoma, a dermoid or neurenteric
  cyst, or a combination. Occult spinal dysraphism (tethered cord, filum or
  conus lipoma, terminal syrinx) is present in more than half of patients,
  and Mullerian duct anomalies occur in up to 15%. Chronic constipation from
  early infancy is the most frequent presenting symptom and may be the only
  one. Heterozygous loss-of-function variants or whole-gene deletions of
  MNX1 (formerly HLXB9), a homeobox transcription factor gene at 7q36.3, are
  found in nearly all familial and about a third of sporadic cases. Penetrance
  is incomplete and expressivity varies widely, including between monozygotic
  twins, so many carriers are asymptomatic or have constipation alone. The
  malformations are thought to arise from a defect at the caudal end of the
  notochord early in embryogenesis that disturbs dorsal-ventral separation of
  gut and neural tissue and secondary neurulation. The main dangers are
  meningitis from a fistula between the rectum and an anterior meningocele,
  and rare malignant transformation of presacral teratoma. Treatment is
  surgical: resection of the presacral mass, correction of the anorectal
  malformation, and untethering of the spinal cord, often in one combined
  operation.
synonyms:
- Currarino syndrome
- ASP triad
- hereditary sacral agenesis
- autosomal dominant sacral agenesis
category: Mendelian
parents:
- Anorectal Malformation
- Sacral Agenesis
disease_term:
  preferred_term: Currarino triad
  term:
    id: MONDO:0008305
    label: Currarino triad
notes: >-
  Lump/split decision: DISEASE. MONDO:0008305 names one clinical entity whose
  defining triad and pathograph hold across its genetic causes. The three
  clinical grades used by surgeons (complete, mild and minimal, by how many
  triad features are present) are degrees of expressivity of one disease, not
  subtypes with separate mechanisms, and so are described in prose rather than
  as has_subtypes rows.

  Larger 7q36 deletions that remove MNX1 cause the triad together with
  developmental delay, growth retardation and facial dysmorphism attributable
  to neighbouring genes. They are recorded as a variant class of the MNX1
  record rather than as a subtype, because the Currarino component is the
  same MNX1 haploinsufficiency and the extra features belong to a contiguous
  gene deletion. Patients with no detectable MNX1 variant (most sporadic
  cases) are kept in this entry and described in the genetic notes; no source
  documents a mechanistic or clinical difference that would justify a separate
  subtype, and somatic mosaicism, non-coding variants, genetic heterogeneity
  and misdiagnosis are all proposed for them.

  No GeneReviews chapter exists for Currarino syndrome; the baseline is the
  primary literature, the comprehensive genetic review by Dworschak and
  colleagues (2021), and the Orphanet record. Hirschsprung disease, which
  co-occurs in some series, has its own entry; sacrococcygeal teratoma of the
  newborn is a different lesion with a different malignancy risk.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Familial Currarino syndrome is transmitted as an autosomal dominant trait
    with incomplete penetrance and very variable expressivity. In some
    families about half of the MNX1 variant carriers are clinically
    asymptomatic, although imaging often shows a sacral defect in carriers
    without symptoms. Monozygotic twins carrying the same MNX1 variant can
    differ in severity.
  evidence:
  - reference: PMID:23370340
    reference_title: A 5.8 kb deletion removing the entire MNX1 gene in a Norwegian family with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Inheritance is autosomal dominant, expression variable and penetrance incomplete.
    explanation: States the inheritance pattern, variable expression and incomplete penetrance.
  - reference: PMID:11528505
    reference_title: Spectrum of mutations and genotype-phenotype analysis in Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Highly variable phenotypes and a low penetrance with half of all carriers
      being clinically asymptomatic were found in three families, whereas
      affected members of one family showed almost identical phenotypes.
    explanation: Low clinical penetrance and variable expressivity in a 72-person family study.
  - reference: PMID:15088182
    reference_title: "[Currarino syndrome: variability of imaging findings in 22 molecular-genetically identified (HLXB9 mutation) patients from five families]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imaging investigations revealed concomitant phenotypic abnormalities in
      all and even nine clinically asymptomatic individuals with proven HLXB9
      mutations.
    explanation: >-
      Clinically asymptomatic carriers still show imaging abnormalities, so
      clinical penetrance understates anatomical penetrance.
  - reference: PMID:41871837
    reference_title: "Clinical Diversity in Currarino Syndrome: Insights From Monozygotic Twins and a Single-Center Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a pair of monozygotic twins, both with the MNX1: c.780C>G
      mutation, presenting with different clinical phenotypes of Currarino
      syndrome (CS).
    explanation: Variable expressivity even between genetically identical twins.
  - reference: PMID:19853743
    reference_title: MNX1 (HLXB9) mutations in Currarino patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variability of the CS phenotype among related or unrelated patients
      bearing the same mutation advocates for differences in the genetic
      background of each individual and invokes the implication of additional
      CS susceptibility genes.
    explanation: Same MNX1 variant, different phenotypes; the authors attribute this to genetic background.

  description: >-
    Partial agenesis of the sacrum, usually of S2 to S5, with the
    characteristic sickle-shaped (scimitar) sacrum or hemisacrum produced by
    a unilateral defect. A sacral defect is the most constant finding and is
    seen even in asymptomatic carriers, which is why plain sacral radiography
    is the usual screening test for relatives.

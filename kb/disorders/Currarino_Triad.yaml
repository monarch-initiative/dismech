- name: Aberrant Secondary Neurulation
  biological_scale: TISSUE
  description: >-
    The caudal spinal cord forms by secondary neurulation from the tail bud.
    Disturbance of this process is thought to underlie the occult spinal
    dysraphism found in about 60% of patients: a low-lying or tethered conus,
    fatty or thickened filum, intraspinal or conus lipoma, lipomyelomeningocele
    and terminal syrinx.

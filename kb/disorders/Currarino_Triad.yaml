    explanation: Meningitis is rare across the whole syndrome, though serious.
  - reference: PMID:19483525
    reference_title: "Treatment-resistant meningitis leading to the diagnosis of Currarino syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, a rectothecal fistula and sacral abnormalities were found,
      leading to the diagnosis of Currarino syndrome.
    explanation: Neonatal treatment-resistant meningitis from a rectothecal fistula as the presenting feature.
  - reference: PMID:15216552
    reference_title: Malignant degeneration of presacral teratoma in the Currarino anomaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sepsis and meningitis are frequent serious problems related to the
      anterior meningomyelocele, whilst malignant transformation of presacral
      teratoma is a rare, severe complication in CA.
    explanation: Meningitis is attributed to the anterior meningocele.
  - reference: ORPHA:1552
    reference_title: Currarino syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: HP:0001287 | Meningitis | Very rare (<4-1%)
    explanation: Orphanet frequency for meningitis.
- category: Neoplasm
  name: Presacral Neuroendocrine Neoplasm
  description: >-
    Malignant transformation of the presacral mass is rare. Most reported
    malignancies are presacral neuroendocrine tumours, some metastatic, in
    adults with familial disease; malignant change has also been reported in
    childhood. Tumours examined in one family carried no second somatic MNX1
    hit, arguing against MNX1 acting as a tumour suppressor. The malignancy
    risk of the Currarino presacral teratoma appears lower than that of
    neonatal sacrococcygeal teratoma.
  phenotype_term:
    preferred_term: Presacral neuroendocrine tumour
    term:
      id: HP:0100634
      label: Neuroendocrine neoplasm
  evidence:
  - reference: PMID:33650152
    reference_title: Presacral neuroendocrine tumors associated with the Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presacral masses are typically benign; however, malignant
      degeneration can occur, and presacral neuroendocrine tumors (NETs) have
      been reported in six cases.
    explanation: Presacral neuroendocrine tumours as the malignant complication.
  - reference: PMID:15216552
    reference_title: Malignant degeneration of presacral teratoma in the Currarino anomaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this kindred a 22-year-old man died of a neuroendocrine tumor,
      probably related to malignant change in a presacral teratoma.
    explanation: Fatal neuroendocrine tumour probably arising in a presacral teratoma.
  - reference: PMID:21915987
    reference_title: Currarino syndrome with pelvic neuroendocrine tumor diagnosed by post-mortem genetic analysis of tissue specimens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the clinical case of a 44-year-old Caucasian woman with
      malignant neuroendocrine transformation of a pre-sacrococcygeal mass
      combined with bicornuate uterus, dermoid cyst of the ovaries, and
      chronic constipation.
    explanation: Malignant neuroendocrine transformation in an MNX1-positive adult.
  - reference: PMID:33650152
    reference_title: Presacral neuroendocrine tumors associated with the Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of a second, somatic mutation in the tumors from family 491
      argues against MNX1 acting as a tumor suppressor, and the absence of a
      germline MNX1 mutation in family 342 suggests that other genetic and
      anatomic factors contribute to the development of presacral NETs.
    explanation: No second MNX1 hit in the tumours.
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with sacrococcygeal teratoma had a lower malignancy-free
      survival than patients with a presacral teratoma associated with CS (58%
      versus 100% after two years).
    explanation: Lower malignancy risk of the Currarino presacral teratoma than of sacrococcygeal teratoma.
- category: Neurodevelopmental
  name: Global Developmental Delay
  description: >-
    Developmental delay or intellectual disability is not a feature of
    intragenic MNX1 disease and points to a larger 7q36 deletion that removes
    neighbouring genes.
  phenotype_term:
    preferred_term: Developmental delay (7q36 deletion carriers)
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:10749657
    reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only genotype-phenotype correlation appeared to be the occurrence of
      developmental delay in the case of three patients with microdeletions.
    explanation: Developmental delay was confined to microdeletion carriers.
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental delay may also be present and is a clue to a cytogenetic
      anomaly involving 7q36.3
    explanation: Developmental delay indicates a 7q36.3 cytogenetic anomaly.
diagnosis:
- name: Sacral Radiography and Spinal-Pelvic MRI
  description: >-
    A plain radiograph of the sacrum showing the crescent-shaped (scimitar)
    defect is the recommended first screening test, including for relatives
    of an index patient, since it is abnormal even in many asymptomatic
    carriers. Lumbosacral and pelvic MRI then defines the presacral mass,
    its relation to the spinal canal, and the associated tethered cord,
    lipoma or syrinx, and is essential before surgery.
  diagnosis_term:
    preferred_term: plain sacral radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:16080925
    reference_title: "The Currarino triad: the variable expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presence of a crescent-shaped defect of the sacral bone may be used as
      initial screening method.
    explanation: Sacral radiography as the initial screen.
  - reference: PMID:30095346
    reference_title: "Currarino syndrome: repair of the dysraphic anomalies and resection of the presacral mass in a combined neurosurgical and general surgical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lumbosacral MRI is an essential investigation when CS is suspected.
    explanation: MRI to define the presacral mass and spinal anomalies.
  - reference: PMID:35282111
    reference_title: Characterization of complete Currarino syndrome in pediatrics-a comparison between CT and MRI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While CT was better than MRI in displaying sacral anomaly (P<0.05), MRI
      was more sensitive than CT at detecting presacral mass, spinal
      dysraphism, and congenital anal atresia (P<0.05).
    explanation: CT shows the bony defect best; MRI is more sensitive for the mass, dysraphism and anorectal malformation.
- name: MNX1 Sequencing and Copy Number Analysis
  description: >-
    Patients with the classic triad and normal growth, development and facial
    appearance should have MNX1 sequencing first, followed by dosage
    analysis (MLPA or chromosomal microarray) if sequencing is negative,
    because whole-gene deletions occur. When developmental delay, growth
    delay or dysmorphism are present, chromosomal microarray should come
    first to detect a 7q36 deletion. Molecular testing identifies asymptomatic
    carriers in a family, but a negative result does not exclude the
    diagnosis in a sporadic patient.
  diagnosis_term:
    preferred_term: MNX1 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25691298
    reference_title: Phenotype analysis impacts testing strategy in patients with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with the classic Currarino triad of malformations but normal
      growth, intellect, and facial appearance should have MNX1 sequencing
      first, and only in the event of a normal result should the clinician
      proceed with chromosomal microarray testing.
    explanation: Testing algorithm for patients without extra features.
  - reference: PMID:25691298
    reference_title: Phenotype analysis impacts testing strategy in patients with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, if growth delay and/or facial dysmorphy and/or intellectual
      disability are present, chromosomal microarray should be the first
      method of choice for genetic testing.
    explanation: Microarray first when features suggest a 7q deletion.
  - reference: PMID:23370340
    reference_title: A 5.8 kb deletion removing the entire MNX1 gene in a Norwegian family with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work underscores the importance of dosage analysis of MNX1 when
      Sanger sequencing is negative.
    explanation: Dosage analysis is needed when sequencing is negative.
treatments:
- name: Combined Resection of Presacral Mass, Anorectal Repair and Spinal Untethering
  description: >-
    Surgery is the main treatment. The presacral mass is excised, the
    anorectal malformation is corrected, usually through a posterior sagittal
    approach, and the dysraphic spinal anomalies are repaired with
    untethering of the cord. These can be done in a single combined
    neurosurgical and general surgical operation, in which the spinal canal
    is opened through a midline laminoplasty and the incision extended to a
    posterior sagittal approach to the presacral mass; this approach has been
    reported without recurrence, retethering or cerebrospinal fluid fistula.
    Early resection is advised because of the risks of infection, meningitis
    and malignant transformation of an undiagnosed presacral mass.
    Constipation and neurogenic bladder dysfunction often persist afterwards.
    A neonate presenting with obstruction may first need a colostomy, with
    the definitive operation staged later. Anal stenosis in this syndrome
    responds poorly to dilatation alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: presacral mass resection with anorectoplasty and spinal cord untethering
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:30095346
    reference_title: "Currarino syndrome: repair of the dysraphic anomalies and resection of the presacral mass in a combined neurosurgical and general surgical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases, the lumbosacral spinal canal was accessed via a midline
      approach with laminoplasty, allowing spinal cord untethering and repair
      of the dysraphic anomalies.
    explanation: Neurosurgical untethering and dysraphism repair in a combined operation.
  - reference: PMID:30095346
    reference_title: "Currarino syndrome: repair of the dysraphic anomalies and resection of the presacral mass in a combined neurosurgical and general surgical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following dural closure, the incision was extended inferiorly to
      incorporate a posterior sagittal approach to resect the presacral mass.
    explanation: Posterior sagittal resection of the presacral mass in the same operation.
  - reference: PMID:16410121
    reference_title: New clinical and therapeutic perspectives in Currarino syndrome (study of 29 cases).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-five patients underwent surgery with a single-stage operation for
      7, on both the intestinal and the presacral malformations, and, when
      required, the spinal cord anomalies.
    explanation: Surgical treatment of intestinal, presacral and spinal anomalies in 25 of 29 patients.
  - reference: PMID:28065719
    reference_title: "The Currarino triad: What pediatric surgeons need to know."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used posterior sagittal approach to correct anorectal anomalies, and
      excise presacral cysts that were subjected to histopathological
      examination.
    explanation: Posterior sagittal anorectal correction and presacral excision.
  - reference: PMID:15359381
    reference_title: "Currarino syndrome: proposal of a diagnostic and therapeutic protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis and treatment are essential to avoid morbidity and
      mortality from an undiagnosed presacral mass.
    explanation: Rationale for early treatment of the presacral mass.
  - reference: PMID:12847376
    reference_title: "Currarino triad with dual pathology in the presacral mass: report of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Colostomy was done in the neonatal period, and the presacral mass was
      excised by posterior sagittal perineal approach at the age of six
      months.
    explanation: Staged management with neonatal colostomy followed by posterior sagittal excision.
  - reference: PMID:42489929
    reference_title: "Rethinking congenital anal stenosis: a systematic review with histological observations toward a revised conceptual framework."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, 20 cases (28.6%) associated with Currarino syndrome showed
      poor response to conservative treatment and frequently required
      treatment of associated presacral lesions or more invasive procedures.
    explanation: >-
      Anal stenosis in Currarino syndrome responds poorly to dilatation and
      usually needs surgery, including treatment of the presacral lesion.
  target_mechanisms:
  - target: Presacral Teratoma
    description: Excision removes the mass and with it the substrate for malignant transformation.
  - target: Anterior Sacral Meningocele
    description: Disconnection and closure of the meningocele removes the route for rectothecal infection.
  - target: Tethered Cord
    description: Untethering releases the cord; it does not reverse established bladder dysfunction.
  - target: Anal Stenosis
    description: Anorectoplasty corrects the anorectal malformation.
- name: Management of Meningitis from an Infected Anterior Meningocele
  description: >-
    Meningitis from an enterothecal fistula is treated with intravenous
    broad-spectrum antibiotics and faecal diversion, followed by neurosurgical
    disconnection of the anterior meningocele from the thecal sac and
    evacuation of any empyema, usually through a posterior sacral approach.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: neurosurgical disconnection of anterior sacral meningocele
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  evidence:
  - reference: PMID:30968178
    reference_title: "Severe bacterial meningitis due to an enterothecal fistula in a 6-year-old child with Currarino syndrome: evaluation of surgical strategy with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial treatment consisted of broad-spectrum intravenous antibiotic
      therapy and laparoscopic construction of a deviating double-loop
      ileostomy.
    explanation: Antibiotics and faecal diversion as initial management.
  - reference: PMID:30968178
    reference_title: "Severe bacterial meningitis due to an enterothecal fistula in a 6-year-old child with Currarino syndrome: evaluation of surgical strategy with review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was followed by an elective posterior neurosurgical approach with a
      sacral laminectomy, evacuation of the empyema, and securing the
      disconnection of the anterior meningocele from the thecal sac, 10 days
      after initial hospital admission.
    explanation: Definitive neurosurgical disconnection of the meningocele.
  target_mechanisms:
  - target: Meningitis
    description: Treats the infection and removes its source by closing the fistula route into the thecal sac.
- name: Genetic Counselling and Family Screening
  description: >-
    Because penetrance is incomplete and carriers may be asymptomatic, first
    degree relatives of an index patient are offered clinical evaluation,
    sacral radiography and, where a familial MNX1 variant is known, testing.
    Carriers found this way, including asymptomatic ones, can be screened by
    MRI for an occult presacral mass.
  treatment_term:
    preferred_term: genetic counselling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29731315
    reference_title: Multiple neurosurgical treatments for different members of the same family with Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A geneticist evaluation must be offered to the patient in the case of a
      CS as well as a clinical evaluation of the relatives (parents,
      siblings).
    explanation: Recommends genetic evaluation and assessment of relatives.
  - reference: PMID:16080925
    reference_title: "The Currarino triad: the variable expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the penetration of the genetic defect is variable, DNA screening is
      the only method to fully exclude the triad.
    explanation: DNA testing of relatives because of variable penetrance.
  - reference: PMID:21763840
    reference_title: "Mutation analysis of the motor neuron and pancreas homeobox 1 (MNX1, former HLXB9) gene in Swedish patients with Currarino syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All mutation carriers had presacral tumors, although 2 were asymptomatic.
    explanation: Asymptomatic carriers can harbour presacral tumours, which is the reason to screen relatives.
  - reference: PMID:23466002
    reference_title: "Currarino syndrome: variable imaging features in three siblings with HLXB9 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that magnetic resonance imaging should be used as a screening
      tool in the members of a CS family with genetic mutation in order to
      avoid morbidity and mortality from an undiagnosed presacral mass.
    explanation: MRI screening of carrier relatives.
animal_models:
- name: Hlxb9 (Mnx1) knockout mouse
  species: Mouse
  genotype: Hlxb9-/- (constitutive null); Hlxb9+/- heterozygotes
  publication: PMID:10471502
  description: >-
    Two independent Hlxb9-null lines were reported in 1999. Homozygous null
    mice lack the dorsal pancreatic lobe and have small, abnormal islets, and
    the gene is also required for motor neuron development. Neither line, nor
    heterozygous mice, shows any sacral, hindgut, anorectal or presacral
    abnormality, so no mouse model of Currarino syndrome exists for MNX1
    itself. Conversely, pancreatic agenesis has never been seen in patients.
  evidence:
  - reference: PMID:10471502
    reference_title: Pancreas dorsal lobe agenesis and abnormal islets of Langerhans in Hlxb9-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice homologous for a null mutation of Hlxb9, the dorsal lobe of the
      pancreas fails to develop.
    explanation: The phenotype of the knockout is pancreatic.
  - reference: PMID:10471501
    reference_title: Selective agenesis of the dorsal pancreas in mice lacking homeobox gene Hlxb9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In absence of Hlxb9 expression, the dorsal region of the gut epithelium
      fails to initiate a pancreatic differentiation program.
    explanation: Independent knockout with the same pancreatic phenotype.
  modeled_mechanisms:
  - target: Caudal Notochord and Dorsal-Ventral Patterning Defect
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Homozygous and heterozygous Hlxb9 mutant mice show no sacral or hindgut
      defect, so the caudal patterning defect behind the human triad is not
      reproduced.
    limitations: >-
      Neither the heterozygous genotype matching patients nor the homozygous
      null produces any feature of the triad. Mouse and human MNX1 expression
      differ in time and place, which may explain the difference, and the
      model cannot be used to study how MNX1 dosage causes the caudal
      malformation.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        Mouse Hlxb9 is expressed in a different spatial and temporal pattern
        from human MNX1 in early development, and loss of the mouse gene
        affects pancreas and motor neurons rather than the caudal axis; the
        mouse caudal embryo does not depend on Hlxb9 dosage the way the human
        one appears to.
    evidence:
    - reference: PMID:33836786
      reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As mentioned above, Mnx1 knockout mice described so far showed
        anomalies in pancreatic and motor-neuron development but did not
        reflect any feature of CS, in particular disruption of sacral or
        hindgut development.
      explanation: Review synthesis of all reported Mnx1 knockouts showing no Currarino feature.
    - reference: PMID:33836786
      reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: MODEL_ORGANISM
      snippet: Mnx1−/+ heterozygote mice showed no discernible phenotype
      explanation: The patient-matched heterozygous genotype has no phenotype in mice.
    - reference: PMID:10749657
      reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Significant spatial and temporal expression differences were evident
        when compared with expression of the mouse Hlxb9 gene, which may partly
        explain the significant human-mouse differences in mutant phenotype.
      explanation: Human embryo expression study offering an explanation for the species difference.
discussions:
- discussion_id: mnx1_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#MNX1 Haploinsufficiency
  - pathophysiology#Caudal Notochord and Dorsal-Ventral Patterning Defect
  - animal_models#Mouse
  prompt: >-
    Why does losing one copy of MNX1 malform the human caudal embryo when
    losing both copies of Hlxb9 leaves the mouse sacrum, hindgut and anorectum
    normal, and where in the human tail bud is MNX1 needed?
  rationale: >-
    The human genetics is strong: truncating variants, homeodomain missense
    variants and a deletion of MNX1 alone all cause the triad, which points to
    haploinsufficiency. The mouse evidence exists and is negative: no Hlxb9
    mutant, heterozygous or null, shows any feature of the triad, while the
    null loses its dorsal pancreas, an organ that is normal in patients. So
    the only model organism for the gene models different tissues. The human
    embryo expression data add a second problem: MNX1 was found in the basal
    plate of the spinal cord, the foregut derivatives and the pancreas, but
    not in the tail bud notochord where the embryological model places the
    primary defect. Species differences in expression, a different human
    protein function, and a non-null effect of human variants have all been
    proposed. Until the caudal requirement for MNX1 is located in human
    tissue, the link from MNX1 dosage to the notochord defect is inferred.
  evidence:
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: >-
      Here, the authors were consistently unable to detect MNX1 expression in
      tail bud notochord from CS12 onward or in more anterior regions of the
      notochord.
    explanation: MNX1 is not detected where the embryological model puts the primary defect.
  - reference: PMID:10749657
    reference_title: Mutation analysis and embryonic expression of the HLXB9 Currarino syndrome gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Signal was detected in the basal plate of the spinal cord and hindbrain
      and in the pharynx, esophagus, stomach, and pancreas.
    explanation: Sites of MNX1 expression in human embryos from Carnegie stage 12.
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking MNX1 show a selective agenesis of the dorsal pancreas and
      abnormal islets of Langerhans, whereas a pancreatic agenesis has yet
      never been observed in CS patients.
    explanation: The organ affected in the mouse is spared in patients.
  proposed_experiments:
  - experiment_id: human_caudal_mnx1_expression_map
    name: MNX1 expression in early human caudal embryo and tail bud models
    description: >-
      Map MNX1 transcript and protein in human embryos before Carnegie stage
      12 and in human pluripotent stem cell models of the tail bud and
      neuromesodermal progenitors, with heterozygous MNX1 loss-of-function
      lines, to find where and when the caudal axis depends on MNX1 dosage.
- discussion_id: mnx1_negative_currarino
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: >-
    What causes Currarino syndrome in the roughly two thirds of sporadic
    patients with no MNX1 variant or deletion?
  rationale: >-
    Pooled data find no MNX1 alteration in 68% of sporadic and 7.7% of
    familial patients. Proposed explanations are somatic mosaicism below the
    detection limit (one mosaic adult is reported), non-coding or regulatory
    variants, other loci, and clinical misdiagnosis; many MNX1-negative
    patients have subtly different phenotypes and fewer have the complete
    triad. None of these is established, so this entry keeps MNX1-negative
    patients within the disease without a separate subtype.
  evidence:
  - reference: PMID:33836786
    reference_title: "Currarino syndrome: a comprehensive genetic review of a rare congenital disorder."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, MNX1 mutation analysis was successful in only 57.4% of all CS
      patients investigated, with no mutation detected in 7.7% of the familial
      and 68% of the sporadic patients.
    explanation: Size of the unexplained fraction.
  - reference: PMID:34156759
    reference_title: The first case of mosaic MNX1 mutation in an adult female with features of Currarino syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lower detection rate of MNX1 mutations in sporadic cases could
      similarly be explained by somatic mosaicism, mutations occurring outside
      the coding regions, or genetic heterogeneity.
    explanation: Candidate explanations for MNX1-negative sporadic cases.
  - reference: PMID:18449898
    reference_title: Spectrum of HLXB9 gene mutations in Currarino syndrome and genotype-phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic heterogeneity is suspected, since at least 19 of the 24 patients
      without HLXB9 gene mutation harbor subtle phenotypic variations.
    explanation: MNX1-negative patients often differ subtly in phenotype.
  - reference: PMID:28689883
    reference_title: "Currarino syndrome: does the presence of a genetic anomaly correlate with a more severe phenotype? A multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The group of patients who resulted positive for a MNX1 mutation
      comprised a higher number (56.5%) of Complete CS cases than the group of
      patients that did not carry any MNX1 mutation (13%) (p = 0.0085).
    explanation: MNX1-positive patients more often have the complete triad.

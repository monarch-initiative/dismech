name: Invasive Candidiasis
creation_date: "2026-08-08T00:00:00Z"
category: Infectious Disease
synonyms:
- Invasive candidosis
- Systemic candidiasis
description: >-
  Invasive candidiasis is infection by Candida species in a normally sterile
  body compartment. Candidemia, in which Candida is recovered from the
  bloodstream, is its most common named form. The entry focuses narrowly on the
  conserved fungal-cell-wall target that explains why echinocandins are used:
  Fks glucan synthase, encoded principally by FKS1 with FKS2 additionally
  relevant in species such as Candida glabrata, produces beta-1,3-glucan, and
  anidulafungin inhibits that enzyme to compromise the Candida cell wall.
disease_term:
  preferred_term: invasive candidiasis
  term:
    id: MONDO:0044067
    label: candidiasis, invasive
parents:
- Candidiasis
- Invasive fungal infection
has_subtypes:
- name: Candidemia
  subtype_term:
    preferred_term: candidemia
    term:
      id: MONDO:0044070
      label: candidemia
  description: >-
    Bloodstream infection with Candida species; candidemia is a form of
    invasive candidiasis and the principal clinical setting represented by the
    echinocandin evidence in this entry.
infectious_agent:
- name: Candida species
  infectious_agent_term:
    preferred_term: Candida
    term:
      id: NCBITaxon:5475
      label: Candida
  description: >-
    Multiple species in the genus Candida cause invasive candidiasis, so the
    infectious-agent anchor is intentionally genus-level.
  evidence:
  - reference: PMID:31159914
    reference_title: Invasive Fungal Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      guidelines on the diagnosis and treatment of invasive fungal infections
      caused by Candida spp., Aspergillus spp., Mucorales, and Fusarium spp.
    explanation: >-
      The review explicitly identifies Candida species as causes of invasive
      fungal infection. Evidence source is OTHER because this is a review.
pathophysiology:
- name: Candida beta-1,3-Glucan Synthesis by Fks Glucan Synthase
  description: >-
    The Candida plasma-membrane glucan-synthase complex uses the catalytic
    subunit encoded principally by FKS1; FKS2 supplies additional catalytic
    capacity in species such as Candida glabrata. The complex synthesizes
    beta-1,3-glucan, an essential structural polymer of the fungal cell wall.
    This fungus-specific activity
    is the direct therapeutic vulnerability inhibited by echinocandins. The
    node is intentionally target-only: it does not assert that normal wall
    synthesis positively causes the intervention-conditional wall failure that
    follows pharmacologic inhibition.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    fungal_cell_wall_glucan_synthesis_inhibition#beta-1,3-Glucan Synthesis at
    the Plasma Membrane by Fks Glucan Synthase
  biological_processes:
  - preferred_term: beta-1,3-Glucan Biosynthesis
    term:
      id: GO:0006075
      label: (1->3)-beta-D-glucan biosynthetic process
  molecular_functions:
  - preferred_term: 1,3-beta-D-Glucan Synthase Activity
    term:
      id: GO:0003843
      label: 1,3-beta-D-glucan synthase activity
  evidence:
  - reference: PMID:26190298
    reference_title: Mechanisms of echinocandin antifungal drug resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They are the first cell wall-active agents and target the fungal-specific
      enzyme glucan synthase, which catalyzes the biosynthesis of β-1,3-glucan,
      a key cell wall polymer.
    explanation: >-
      Establishes the fungal-specific glucan-synthase activity and its
      beta-1,3-glucan product as the conserved echinocandin target. Evidence
      source is OTHER because this is a review.
treatments:
- name: Anidulafungin Echinocandin Therapy
  description: >-
    Intravenous anidulafungin is an echinocandin used as initial therapy for
    candidemia and other invasive Candida infections. It directly inhibits
    fungal beta-1,3-glucan synthase.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anidulafungin
      term:
        id: CHEBI:55346
        label: anidulafungin
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Candida beta-1,3-Glucan Synthesis by Fks Glucan Synthase
    treatment_effect: INHIBITS
    description: >-
      Anidulafungin inhibits the Candida glucan-synthase complex, reducing
      production of the beta-1,3-glucan required for cell-wall integrity.
    evidence:
    - reference: PMID:21694887
      reference_title: Anidulafungin and its role in candida infections.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Anidulafungin and all echinocandins inhibit glucan synthase thus
        inhibiting the formation of 1,3-β-D-glucan which is an essential
        component of the fungal cell wall.
      explanation: >-
        Directly supports anidulafungin inhibiting glucan synthase and thereby
        reducing the essential beta-1,3-glucan cell-wall polymer. Evidence
        source is OTHER because this is a review.
  evidence:
  - reference: PMID:21694887
    reference_title: Anidulafungin and its role in candida infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because of its spectrum of activity, fungicidal nature, and tolerability
      it is an attractive first-line therapeutic choice for treating candidemia
      in both non-neutropenic and neutropenic patients.
    explanation: >-
      Supports anidulafungin as a first-line option in candidemia. Evidence
      source is OTHER because this is a review.

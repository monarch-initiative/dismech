diagnosis:
- name: Candida Blood Culture
  description: >-
    Isolation of Candida from blood culture remains the diagnostic gold standard
    for candidemia, but sensitivity is limited and turnaround can be slow.
  evidence:
  - reference: PMID:36135696
    reference_title: "Performance of Multiplex PCR and β-1,3-D-Glucan Testing for the Diagnosis of Candidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis remains challenging, with the current gold standard—isolation
      from blood culture (BC)—being limited by low sensitivity and long
      turnaround time.
    explanation: Directly defines blood culture as the current standard while documenting its limitations.
- name: Serum Beta-1,3-D-Glucan Assay
  description: >-
    Serum beta-1,3-D-glucan is a nonculture adjunct that can support earlier
    candidemia diagnosis but does not identify the Candida species and must be
    interpreted with clinical context.
  evidence:
  - reference: PMID:36135696
    reference_title: "Performance of Multiplex PCR and β-1,3-D-Glucan Testing for the Diagnosis of Candidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, BDG testing demonstrated several advantages over PCR
      testing for the diagnosis of candidemia, including higher sensitivity and
      earlier diagnosis. However, BC remains essential, as BDG does not allow
      for species differentiation.
    explanation: Supports BDG as an adjunct and records the species-identification limitation.
treatments:
- name: Anidulafungin Echinocandin Therapy
  description: >-
    Intravenous anidulafungin is an echinocandin used as initial therapy for
    candidemia and other invasive Candida infections. It directly inhibits
    fungal beta-1,3-glucan synthase.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anidulafungin
      term:
        id: CHEBI:55346
        label: anidulafungin
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Candida beta-1,3-Glucan Synthesis by Fks Glucan Synthase
    treatment_effect: INHIBITS
    description: >-
      Anidulafungin inhibits the Candida glucan-synthase complex, reducing
      production of the beta-1,3-glucan required for cell-wall integrity.
    evidence:
    - reference: PMID:21694887
      reference_title: Anidulafungin and its role in candida infections.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Anidulafungin and all echinocandins inhibit glucan synthase thus
        inhibiting the formation of 1,3-β-D-glucan which is an essential
        component of the fungal cell wall.
      explanation: >-
        Directly supports anidulafungin inhibiting glucan synthase and thereby
        reducing the essential beta-1,3-glucan cell-wall polymer. Evidence
        source is OTHER because this is a review.
  evidence:
  - reference: PMID:21694887
    reference_title: Anidulafungin and its role in candida infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because of its spectrum of activity, fungicidal nature, and tolerability
      it is an attractive first-line therapeutic choice for treating candidemia
      in both non-neutropenic and neutropenic patients.
    explanation: >-
      Supports anidulafungin as a first-line option in candidemia. Evidence
      source is OTHER because this is a review.
review_notes: >-
  This conformance tranche uses the reviewer-directed minimum-content route
  because no Invasive Candidiasis deep-research artifact was available. Clinical
  manifestations, diagnosis, epidemiologic context, risk factors, and a connected
  invasion-to-dissemination pathograph were therefore added from primary studies
  and the already-cached clinical review. Anidulafungin remains the representative
  treatment with direct target and first-line candidemia evidence; caspofungin,
  micafungin, and rezafungin are named in the shared class module but require
  their own disease-specific evidence before separate treatment records are added.

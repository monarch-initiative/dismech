pathophysiology:
- name: Candida beta-1,3-Glucan Synthesis by Fks Glucan Synthase
  description: >-
    The Candida plasma-membrane glucan-synthase complex uses the catalytic
    subunit encoded principally by FKS1; FKS2 supplies additional catalytic
    capacity in species such as Candida glabrata. The complex synthesizes
    beta-1,3-glucan, an essential structural polymer of the fungal cell wall.
    This fungus-specific activity
    is the direct therapeutic vulnerability inhibited by echinocandins. The
    node is intentionally target-only: it does not assert that normal wall
    synthesis positively causes the intervention-conditional wall failure that
    follows pharmacologic inhibition.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    fungal_cell_wall_glucan_synthesis_inhibition#beta-1,3-Glucan Synthesis at
    the Plasma Membrane by Fks Glucan Synthase
  biological_processes:
  - preferred_term: beta-1,3-Glucan Biosynthesis
    term:
      id: GO:0006075
      label: (1->3)-beta-D-glucan biosynthetic process
  molecular_functions:
  - preferred_term: 1,3-beta-D-Glucan Synthase Activity
    term:
      id: GO:0003843
      label: 1,3-beta-D-glucan synthase activity
  evidence:
  - reference: PMID:26190298
    reference_title: Mechanisms of echinocandin antifungal drug resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They are the first cell wall-active agents and target the fungal-specific
      enzyme glucan synthase, which catalyzes the biosynthesis of β-1,3-glucan,
      a key cell wall polymer.
    explanation: >-
      Establishes the fungal-specific glucan-synthase activity and its
      beta-1,3-glucan product as the conserved echinocandin target. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Candida Cell-Wall Integrity and Viability
    causal_link_type: DIRECT
    description: Beta-1,3-glucan is an essential structural component of the Candida cell wall and supports fungal viability.
    evidence:
    - reference: PMID:21694887
      reference_title: Anidulafungin and its role in candida infections.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Anidulafungin and all echinocandins inhibit glucan synthase thus
        inhibiting the formation of 1,3-β-D-glucan which is an essential
        component of the fungal cell wall.
      explanation: Establishes the direct structural link from glucan synthesis to cell-wall integrity.
- name: Candida Cell-Wall Integrity and Viability
  biological_scale: CELLULAR
  role: effector
  description: >-
    The beta-1,3-glucan-rich cell wall maintains Candida structural integrity
    and viability. This normal fungal function is upstream of the organism's
    ability to persist and invade; pharmacologic glucan depletion instead causes
    osmotic lysis.
  downstream:
  - target: Candida Invasion of Normally Sterile Compartments
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A viable opportunistic Candida population can breach host barriers and
      establish infection in normally sterile sites, although this entry does
      not claim that cell-wall integrity alone is sufficient for invasion.
    evidence:
    - reference: PMID:36135696
      reference_title: "Performance of Multiplex PCR and β-1,3-D-Glucan Testing for the Diagnosis of Candidemia."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, as an opportunistic pathogen, this fungus can also cause a
        variety of infections ranging from superficial and local infections,
        such as thrush or vulvovaginitis, to invasive systemic infections,
        including Candida bloodstream infection (BSI).
      explanation: Supports opportunistic progression to systemic invasion but not a single sufficient molecular cause.
- name: Candida Invasion of Normally Sterile Compartments
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Under permissive host conditions, Candida crosses epithelial barriers or
    barriers associated with devices and establishes infection in blood or deep
    sterile tissues, distinguishing invasive disease from colonization or mucosal
    candidiasis.
  downstream:
  - target: Candidemia and Hematogenous Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Invasion into the bloodstream produces candidemia and enables hematogenous seeding of distant organs.
    evidence:
    - reference: PMID:22431804
      reference_title: "Performance of Candida real-time polymerase chain reaction, β-D-glucan assay, and blood cultures in the diagnosis of invasive candidiasis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients with IC had candidemia (n = 17), deep-seated candidiasis (n = 33), or both (n = 5).
      explanation: A prospective clinical cohort directly documents bloodstream and deep-seated invasive presentations.
- name: Candidemia and Hematogenous Dissemination
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Candida bloodstream infection causes high-morbidity systemic disease and
    may seed ocular, hepatic, splenic, and other deep sites.
  evidence:
  - reference: PMID:36135696
    reference_title: "Performance of Multiplex PCR and β-1,3-D-Glucan Testing for the Diagnosis of Candidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bloodstream infections caused by Candida yeasts (candidemia) are associated with high morbidity and mortality.
    explanation: Directly identifies candidemia as a severe Candida bloodstream infection.
  downstream:
  - target: Fungal sepsis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24157707
      reference_title: Invasive candidiasis as a cause of sepsis in the critically ill patient.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Candida species are by far the predominant agent of fungal sepsis
      explanation: Supports Candida bloodstream invasion as a cause of fungal sepsis.
  - target: Hepatic candidiasis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hematogenous seeding of the liver
    evidence:
    - reference: PMID:27709545
      reference_title: Hepatosplenic candidasis, a fatal disease?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The diagnosis was established by demonstration of multiple abscesses in liver and spleen on ultrasound and computed tomography.
      explanation: Human cases document hepatic and splenic abscesses in disseminated candidiasis.
  - target: Fungal splenic abscess
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hematogenous seeding of the spleen
    evidence:
    - reference: PMID:27709545
      reference_title: Hepatosplenic candidasis, a fatal disease?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The diagnosis was established by demonstration of multiple abscesses in liver and spleen on ultrasound and computed tomography.
      explanation: Human cases document hepatic and splenic abscesses in disseminated candidiasis.
  - target: Candida chorioretinitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hematogenous seeding of the choroid and retina
    evidence:
    - reference: PMID:21765074
      reference_title: Ocular manifestations of candidemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of these patients, probable Candida eye infection was diagnosed in 40
        patients (6 with endophthalmitis, 34 with chorioretinitis), and possible
        Candida eye infection in 20 (all with chorioretinitis).
      explanation: Prospective candidemia data document chorioretinitis and endophthalmitis after bloodstream infection.

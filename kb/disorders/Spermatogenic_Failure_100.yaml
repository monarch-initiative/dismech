genetic:
- name: DNAH12
  association: Causal
  gene_term:
    preferred_term: DNAH12
    term:
      id: hgnc:2943
      label: DNAH12
  notes: >-
    Biallelic DNAH12 variants cause SPGF100. Reported alleles include
    stop-gain, frameshift, splice-site and missense variants. The homozygous
    stop-gain p.Gln2077Ter is reported in a sporadic Chinese patient in
    PMID:40146200 and in a Chinese proband in PMID:39071892, so the two
    reports may describe the same individual. PMID:39071892 classified all
    five of its alleles as variants of uncertain significance under ACMG
    criteria. An earlier candidate report (PMID:34089056) of two DNAH12
    missense variants in one MMAF patient could not establish biallelic
    status.
  evidence:
  - reference: PMID:40146200
    reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we unveiled six biallelic mutations in DNAH12 that co-segregate recessively with male infertility in the studied families"
    explanation: Primary gene-disease report.
  - reference: PMID:39071892
    reference_title: "Further evidence from DNAH12 supports favorable fertility outcomes of infertile males with dynein axonemal heavy chain gene family variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified one homozygous variant and two compound heterozygous variants in DNAH12 from three infertile Chinese men"
    explanation: Independent replication.
  - reference: PMID:42321500
    reference_title: "Biallelic loss-of-function variants in DNAH12 cause inner dynein arm defects and sperm head abnormalities leading to male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two novel homozygous loss-of-function (LoF) variants in DNAH12 (c.5442dupT and c.6286C > T) were identified"
    explanation: Further loss-of-function alleles.
  - reference: PMID:34791246
    reference_title: "Whole-exome sequencing of a cohort of infertile men reveals novel causative genes in teratozoospermia that are chiefly related to sperm head defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dynein axonemal heavy chain 12 (DNAH12: 1/67 patients, 1.49%) in patients with MMAF"
    explanation: An earlier cohort report of a DNAH12 variant in an MMAF patient (abstract only; genotype not given in the abstract).
animal_models:
- name: Dnah12 knockout mouse
  species: Mouse
  genotype: Dnah12-/- (knockout), homozygous
  publication: PMID:40146200
  description: >-
    Dnah12-/- males are infertile, with completely immotile sperm and axonemal
    defects. Females and their motile cilia are normal. A knock-in model
    carrying a patient missense variant (Dnah12mut/mut) reproduced the same
    reproductive defects.
  modeled_mechanisms:
  - target: Inner Dynein Arm and Central Pair Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knockout reproduces the patient axonemal lesion.
    evidence:
    - reference: PMID:40146200
      reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mouse models (Dnah12-/- and Dnah12mut/mut) were generated and recapitulated the reproductive defects in the patients."
      explanation: The authors' statement that the mouse recapitulates the human defect.
  - target: Reduced sperm motility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Sperm are fully immotile, but the mouse also has a sharp fall in sperm
      number that has not been reported in patients.
    limitations: >-
      Epididymal sperm count falls to about 2% of wild type in the knockout,
      whereas one human cohort reports normal sperm concentration. The mouse
      therefore has a more severe spermatogenic defect than reported human
      cases.
    evidence:
    - reference: PMID:40146200
      reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the average number of sperm per epididymis of Dnah12-/- mice dramatically decreased to approximately 2% of that of Dnah12+/+ mice"
      explanation: Records the sperm-count reduction specific to the mouse.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the defect. The lesion affects flagellar motility and form,
    not the sperm nucleus, and the acrosome and head markers are preserved.
    Fertilization and embryo development after ICSI are reported in
    patients from three studies and in knockout mice. Numbers are small: in
    one three-couple series, one couple had a live birth, one a clinical
    pregnancy, and one was still awaiting embryo transfer.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:42522280
      reference_title: "Genotype-based management of fertilization and cleavage failure: case-series evidence from DNAH10, DNAH12, CFAP47 , and PLCZ1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ICSI restored fertilization in DNAH10/DNAH12 deficiency"
      explanation: Human case series showing ICSI success in DNAH12 deficiency.
  evidence:
  - reference: PMID:39071892
    reference_title: "Further evidence from DNAH12 supports favorable fertility outcomes of infertile males with dynein axonemal heavy chain gene family variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Favorable fertility outcomes were achieved through ICSI in three human individuals and Dnah12 knock-out mice."
    explanation: ICSI outcomes in patients.
  - reference: PMID:42321500
    reference_title: "Biallelic loss-of-function variants in DNAH12 cause inner dynein arm defects and sperm head abnormalities leading to male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients achieved normal fertilization and embryo development following ICSI."
    explanation: Further ICSI success.

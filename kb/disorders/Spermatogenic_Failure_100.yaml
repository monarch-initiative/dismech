- name: Defective Manchette Organization During Spermiogenesis
  description: >-
    In Dnah12-/- mice, elongating spermatids have an abnormal manchette and
    misshapen heads, and more seminiferous tubules contain apoptotic cells.
    This is the only proposed route to the sperm head abnormality. It has
    been shown only in mice, and how loss of an axonemal dynein disturbs the
    manchette is unknown.

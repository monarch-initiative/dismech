name: Spermatogenic Failure 100
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
synonyms:
- SPGF100
- spermatogenic failure 100
- DNAH12-related asthenoteratozoospermia
- DNAH12-related multiple morphological abnormalities of the sperm flagella
description: >-
  Spermatogenic failure 100 (SPGF100) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in DNAH12. DNAH12 encodes an
  unusual inner dynein arm heavy chain: it is the shortest member of the
  axonemal dynein heavy chain family and lacks a typical microtubule-binding
  domain. Affected men have severe asthenoteratozoospermia. The ejaculate
  contains a mixture of absent, short, coiled, bent and irregular-caliber
  flagella (multiple morphological abnormalities of the sperm flagella, MMAF),
  and many sperm also have abnormal heads. Electron microscopy shows loss of
  the inner dynein arms and of the central pair of microtubules.

  DNAH12 binds the inner-arm components DNALI1 and DNAH1 and is required to
  bring them into the sperm axoneme. It also binds the radial spoke head
  proteins RSPH1, RSPH9 and DNAJB13, which helps keep the central pair
  stable. Its loss affects the sperm flagellum but not motile cilia
  elsewhere. Reported patients had no respiratory disease or situs inversus,
  and Dnah12 knockout mice have normal tracheal and oviductal cilia. So
  SPGF100 is an isolated sperm flagellar disorder, not primary ciliary
  dyskinesia. Fertility can be achieved: ICSI gave normal fertilization and
  embryo development in patients and in knockout mice.
disease_term:
  preferred_term: spermatogenic failure 100
  term:
    id: MONDO:0978302
    label: spermatogenic failure 100
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  No GeneReviews chapter covers this disease (checked with just
  check-genereviews). Since 2024, three independent groups have reported
  biallelic DNAH12 variants with knockout mouse support; the gene-disease
  link has no ClinGen classification. MONDO cross-references the phenotype
  as OMIM 621209 (the DNAH12 gene entry is OMIM 603340). One candidate
  report describes azoospermia in a man with two heterozygous DNAH12 splice
  variants of unknown phase (PMID:39267058). Its authors call for more cases,
  so azoospermia is not recorded as a phenotype of this disease.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic DNAH12 variants. Reported genotypes include
    homozygous stop-gain and missense variants in consanguineous Pakistani
    families, and homozygous or compound heterozygous variants in Chinese
    men.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40146200
    reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we unveiled six biallelic mutations in DNAH12 that co-segregate recessively with male infertility in the studied families"
    explanation: Recessive co-segregation in six families establishes the inheritance mode.
pathophysiology:
- name: Loss of the DNAH12 Inner-Arm Dynein Heavy Chain
  description: >-
    Truncating, splice and missense alleles all lead to loss of DNAH12 protein
    in patient sperm. DNAH12 has no microtubule-binding domain, so it is
    thought to work with other inner-arm dyneins rather than as an
    independent motor.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAH12
    term:
      id: hgnc:2943
      label: DNAH12
  downstream:
  - target: Failed Recruitment of DNAH1 and DNALI1 to the Inner Dynein Arm
    causal_link_type: DIRECT
    description: >-
      DNAH12 binds DNALI1 and DNAH1; without it these subunits are not
      incorporated into the sperm axoneme.
    evidence:
    - reference: PMID:40146200
      reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, DNAH12 was confirmed to interact with two other IDA components DNALI1 and DNAH1, while disruption of DNAH12 leads to failed recruitment of DNALI1 and DNAH1 to IDAs and compromised sperm development."
      explanation: Interaction plus loss-of-recruitment data link the lesion to the next step.
    - reference: PMID:36792588
      reference_title: "DNALI1 deficiency causes male infertility with severe asthenozoospermia in humans and mice by disrupting the assembly of the flagellar inner dynein arms and fibrous sheath."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MS identified both DNAH1 and DNAH12 as potential interacting proteins of DNALI1"
      explanation: An independent group recovered DNAH12 with DNALI1 from human sperm, supporting the physical association behind the recruitment step.
  - target: Defective Manchette Organization During Spermiogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown only in knockout mice. The link from an axonemal dynein to
      manchette organization is not explained.
  evidence:
  - reference: PMID:40146200
    reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sperm lysate from a fertile control but not in P9 with the homozygous stop-gain mutation M4, P10 with a homozygous missense mutation M5, and P11 with compound heterozygous mutations M6 and M7, indicating these mutations possibly lead to the disruption of the DNAH12 protein"
    explanation: Western blot shows loss of DNAH12 protein in patient sperm across stop-gain, missense and compound heterozygous genotypes.
  - reference: PMID:40146200
    reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Notably, it is the shortest member and lacks a typical microtubule-binding domain (MTBD) in the DNAH family."
    explanation: Domain analysis behind the view that DNAH12 acts as an assembly component, not an independent motor.
- name: Failed Recruitment of DNAH1 and DNALI1 to the Inner Dynein Arm
  description: >-
    Without DNAH12, the inner-arm heavy chain DNAH1 and the light
    intermediate chain DNALI1 are missing from sperm flagella. Patient sperm
    also lose the radial spoke head protein RSPH9 and the central-pair
    protein SPAG6.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Inner dynein arm
    term:
      id: GO:0036156
      label: inner dynein arm
  biological_processes:
  - preferred_term: Inner dynein arm assembly
    term:
      id: GO:0036159
      label: inner dynein arm assembly
    modifier: DECREASED
  downstream:
  - target: Inner Dynein Arm and Central Pair Loss
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42321500
    reference_title: "Biallelic loss-of-function variants in DNAH12 cause inner dynein arm defects and sperm head abnormalities leading to male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAH12 deficiency in patient sperm was accompanied by loss of DNAH1, DNALI1, RSPH9, and SPAG6 and disruption of the classical \"9 + 2\" axonemal structure."
    explanation: Independent human confirmation that DNAH12 loss removes DNAH1 and DNALI1 from sperm.
  - reference: PMID:39071892
    reference_title: "Further evidence from DNAH12 supports favorable fertility outcomes of infertile males with dynein axonemal heavy chain gene family variants."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results revealed that the expression levels of DNAH1 and DNAI2 were predominantly normal, whereas the expression of SAPG6 was mostly absent"
    explanation: >-
      In patient AY0749, DNAH12 was absent but flagellar DNAH1 was retained,
      which contradicts the claim that DNAH1 recruitment always fails. The
      central-pair protein SPAG6 was still lost. Allele, assay or sample
      differences may explain the discrepancy.
- name: Inner Dynein Arm and Central Pair Loss
  description: >-
    The sperm axoneme loses its inner dynein arms and its central pair of
    microtubules, so the 9+2 arrangement is broken. DNAH12 binds the radial
    spoke head proteins, which is the proposed reason the central pair is
    also lost.

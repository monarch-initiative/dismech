mechanistic_hypotheses:
- hypothesis_group_id: flagellum_specific_dnah12_requirement
  hypothesis_label: DNAH12 is required in the sperm flagellum but not in motile cilia, which is why SPGF100 is not primary ciliary dyskinesia
  status: EMERGING
  description: >-
    DNAH12 is expressed in trachea as well as testis, but its loss spares
    motile cilia in both patients and mice. The proposed explanation is that
    DNAH12 is needed to assemble a flagellum-specific inner-arm
    configuration. The human evidence is the absence of reported respiratory
    disease, not a systematic ciliary assessment such as nasal nitric oxide
    or ciliary beat analysis.
  evidence:
  - reference: PMID:40146200
    reference_title: "Deficiency in DNAH12 causes male infertility by impairing DNAH1 and DNALI1 recruitment in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Noteworthy, DNAH12 deficiency did not show effects on cilium organization and function."
    explanation: Mouse evidence that motile cilia are spared.
  - reference: PMID:39071892
    reference_title: "Further evidence from DNAH12 supports favorable fertility outcomes of infertile males with dynein axonemal heavy chain gene family variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no signs of pulmonary infection and situs inversus were detected in the imaging testing"
    explanation: Human patients showed no laterality or respiratory ciliary disease.

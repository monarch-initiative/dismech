- name: Complementation and knockout functional studies
  description: >-
    Because the recurrent COA5 missense allele is not supported by in-silico
    prediction, functional confirmation carries the pathogenicity argument:
    retroviral complementation with wild-type COA5 restores Complex IV activity
    in patient fibroblasts, and a CRISPR/Cas9 COA5 knockout reproduces the same
    isolated Complex IV defect.

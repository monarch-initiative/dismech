    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histochemical analysis of skeletal muscle cryosections from the patient indicated a moderate CIV deficiency in all fibres"
    explanation: >-
      The assembly block translates into measurably deficient Complex IV

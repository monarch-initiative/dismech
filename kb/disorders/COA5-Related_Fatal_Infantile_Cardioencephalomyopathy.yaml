differential_diagnoses:
- name: SCO2-Related Fatal Infantile Cardioencephalomyopathy
  disease_term:
    preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
    term:
      id: MONDO:0011451
      label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 1
  description: >-
    SCO2-related disease overlaps COA5 deficiency in infantile hypertrophic cardiomyopathy and COX deficiency.
    Molecular testing distinguishes the causal genes.
  distinguishing_features:
  - >-
    The SCO2 report describes hypertrophic cardiomyopathy with encephalopathy. Neurological involvement
    in COA5 deficiency remains incompletely characterized; normal imaging in one patient is not an exclusion
    rule.
  - >-
    SCO2 and COA5 participate in complex IV biogenesis through distinct assembly-factor functions; a simple
    ordering of COA5 one step before SCO2 is not established.
  evidence:
  - reference: PMID:10749987
    reference_title: Mutations in SCO2 are associated with a distinct form of hypertrophic cardiomyopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These data indicate that mutations in SCO2 cause a fatal infantile mitochondrial disorder characterized by hypertrophic cardiomyopathy and encephalopathy
    explanation: >-
      Supports the clinical overlap and the SCO2-specific neurological phenotype.
- name: Other nuclear-type mitochondrial complex IV deficiencies
  description: >-
    Other nuclear complex IV assembly disorders can produce overlapping biochemical defects. The abnormal
    complex IV assay alone does not identify COA5.
  distinguishing_features:
  - >-
    A molecular result identifying biallelic COA5 variants distinguishes the gene-defined disorder; clinical
    features alone do not establish the causal assembly factor.
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: To date, pathogenic mutations leading to a mitochondrial disorder have been identified in only seven of the corresponding human genes.
    explanation: >-
      The 2011 introduction describes multiple nuclear assembly-factor causes; its historical gene count
      is not used as a current count.
- name: Ethylmalonic encephalopathy (ETHE1)
  description: >-
    Ethylmalonic encephalopathy overlaps in ethylmalonic acid elevation and reduced muscle cytochrome
    c oxidase activity.
  distinguishing_features:
  - >-
    ETHE1-related disease prominently affects brain, gastrointestinal tract and peripheral vessels. The
    reported COA5 cases are dominated by neonatal cardiomyopathy; gene testing resolves the etiologic
    distinction.
  evidence:
  - reference: PMID:14732903
    reference_title: "Ethylmalonic encephalopathy is caused by mutations in ETHE1, a gene encoding a mitochondrial matrix protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Ethylmalonic encephalopathy (EE) is a devastating infantile metabolic disorder affecting the brain, gastrointestinal tract, and peripheral vessels. High levels of ethylmalonic acid are detected in the body fluids, and cytochrome c oxidase activity is decreased in skeletal muscle.
    explanation: >-
      Supports the biochemical overlap and distinguishing organ-system pattern of ETHE1 disease.
- name: Primary mitochondrial DNA disease
  description: >-
    Mitochondrial DNA variants are an alternative cause considered during evaluation of respiratory-chain
    disease. The 2025 COA5 patient had negative mitochondrial genome analysis.
  distinguishing_features:
  - >-
    Biallelic nuclear COA5 variants with carrier parents establish a nuclear recessive etiology. Negative
    mitochondrial genome sequencing does not alone exclude every mitochondrial disorder or nuclear cause
    of mtDNA depletion.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic testing eliminated pathogenic mitochondrial DNA (mtDNA) variants after a complete analysis of the mitochondrial genome."
    explanation: >-
      Documents mtDNA testing in the reported patient, without prescribing a mandatory order of investigations.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
discussions:
- discussion_id: coa5_encephalopathy_not_documented
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Hypertrophic Myocardial Remodeling"
  - "phenotypes#Hypertrophic Cardiomyopathy"
  prompt: >-
    The disease is named a cardioencephalomyopathy, but is there any documented
    central nervous system involvement in COA5 deficiency?
  rationale: >-
    The disease name includes encephalomyopathy, but the available clinical descriptions emphasize neonatal
    cardiomyopathy and the 2025 patient had normal brain imaging. Normal structural imaging does not exclude
    functional or later neurological involvement. The neurological spectrum remains unresolved in this
    small, early-lethal case series.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging of the brain was normal."
    explanation: >-
      Documents normal brain imaging in one patient; it does not establish absence of encephalopathy in
      the disorder.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: coa5_submitochondrial_localisation_and_metallochaperone_role
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Arrested Early Complex IV Assembly"
  prompt: >-
    Where does human COA5 sit within the mitochondrion, and does it act purely as
    an assembly factor at the MTCO1-to-MTCO2 transition or also as a regulator of
    the copper and haem metallochaperone modules?
  rationale: >-
    COA5 knockout experiments implicate both early MTCO1-to-MTCO2 assembly and COX2 metallochaperone interactions.
    The 2022 study supports a dynamic apo-metallochaperone complex-stabilizing role in engineered human
    cells, while the 2025 study leaves the precise structural role and localization for further investigation.
    How p.Ala53Pro affects these interactions is unresolved; yeast import findings do not establish human
    import dependence.
  evidence:
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified the twin CX9C protein PET191/COA5 as a key contributor in human cells"
    explanation: >-
      Places COA5 in the copper-centre biogenesis machinery in human knockout
      cells, which is the alternative role this question is about.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:18503002
    reference_title: Pet191 is a cytochrome c oxidase assembly factor in Saccharomyces cerevisiae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The import of Pet191 differs from that of other twin-Cx(9)C motif class of proteins in being independent of the Mia40 pathway."
    explanation: >-
      Evidence about the yeast orthologue Pet191, not about human COA5. It is
      cited only to substantiate why yeast import and localisation data cannot be
      read across to the human protein.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Furthermore, SCO1, COA6, and COX16 failed to interact with the newly synthesized COX2 in the absence of PET191
    explanation: >-
      Immunoprecipitation in PET191/COA5 knockout human cells identifies loss of these COX2 interactions.
      This has not been measured in patient cells.
- discussion_id: coa5_founder_allele_unverified
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "genetic#COA5 pathogenic variants causing CEMCOX3 (MC4DN9)"
  - "prevalence#Worldwide"
  prompt: >-
    Is COA5 c.157G>C (p.Ala53Pro) a Turkish founder allele, or has the same
    variant arisen independently?
  rationale: >-
    The two reported Turkish families share homozygous p.Ala53Pro. The authors propose a founder effect
    but explicitly require haplotype analysis to establish it. Recurrence alone is insufficient.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this could point towards the likelihood of the variant being a founder pathogenic variant within the Turkish population"
    explanation: >-
      States the founder hypothesis as a possibility, in the authors' own hedged
      terms, which is exactly the epistemic status recorded here.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
notes: >-
  The clinical evidence base consists of the 2011 sibling report and the 2025 unrelated child. Phenotype
  frequencies, penetrance, broader allelic diversity and long-term outcomes cannot be estimated from these
  reports. The human null-cell experiments resolve assembly-factor biology but do not establish identical
  molecular effects or clinical severity for the patient missense allele. COA5 is a gene-defined member
  of the Mitochondrial Complex IV Deficiency grouping; it is not interchangeable with the broader fatal
  infantile COX-deficiency syndrome.

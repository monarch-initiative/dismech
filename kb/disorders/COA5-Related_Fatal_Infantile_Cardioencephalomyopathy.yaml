    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: When assessing complex III subunits, a complete loss of the supercomplexes III2+IV (Ss) was observed in the COA5KO cell line
    explanation: >-
      Directly documents loss of III2+IV in the engineered U2OS line.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO

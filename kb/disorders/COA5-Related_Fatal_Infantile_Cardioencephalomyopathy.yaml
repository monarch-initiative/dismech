  - target: Hypertrophic Myocardial Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired mitochondrial energy production plausibly contributes to myocardial remodeling. The tissue-specific

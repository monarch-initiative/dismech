differential_diagnoses:
- name: SCO2-Related Fatal Infantile Cardioencephalomyopathy
  disease_term:
    preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
    term:
      id: MONDO:0011451
      label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 1
  description: >-
    The closest mimic, and the one that matters most here: the same syndrome
    name, the same neonatal hypertrophic cardiomyopathy with isolated COX
    deficiency, and the same class of lesion (a nuclear COX assembly factor).
    Nothing in the clinical presentation reliably separates the two, so the
    distinction is molecular. Papers about SCO2 are not evidence about COA5 and
    must not be read across.
  distinguishing_features:
  - >-
    SCO2 is a copper metallochaperone that builds the CuA centre of MTCO2, so its
    lesion is in cofactor delivery. COA5 acts one step earlier, at the transition
    between MTCO1 maturation and MTCO2 incorporation, and has no established
    copper-delivery role in patient cells.
  - >-
    SCO2 disease has a large published cohort with a recurrent p.E140K allele and
    a genotype-graded spectrum that includes delayed-onset Leigh-like disease with
    SMA-like neurogenic atrophy. COA5 disease has three reported patients, one
    allele, and no reported neurogenic atrophy or Leigh phenotype.
  - >-
    SCO2 is on chromosome 22, COA5 at 2q11.2. Nothing in the neonatal
    presentation separates the two, so only sequencing distinguishes them at the
    bedside.
  evidence:
  - reference: PMID:10749987
    reference_title: Mutations in SCO2 are associated with a distinct form of hypertrophic cardiomyopathy and cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Sco2 protein is thought to function as a copper chaperone."
    explanation: >-
      States the copper-chaperone role that distinguishes the SCO2 lesion from
      the COA5 assembly-transition lesion.
- name: Other nuclear-type mitochondrial complex IV deficiencies
  description: >-
    SURF1, COX10, COX15, COX20, COX11, COX16, PET100, PET117, COA3, COA8, TACO1
    and the nuclear structural-subunit genes all produce isolated Complex IV
    deficiency and overlap biochemically with COA5 disease. Several - COX15 and
    COX16 in particular - include neonatal hypertrophic cardiomyopathy in their
    spectrum.
  distinguishing_features:
  - >-
    These are separated by gene, not by phenotype, so a panel or exome covering
    the nuclear COX-assembly genes rather than single-gene testing is the
    appropriate molecular approach to an infant with isolated Complex IV
    deficiency.
  - >-
    Within this group, a brain-dominant Leigh phenotype points away from COA5,
    whose reported presentation is cardiac-dominant with normal neuroimaging in
    the one patient assessed.
- name: Ethylmalonic encephalopathy (ETHE1)
  description: >-
    Raised because the reported COA5 patient excreted ethylmalonic acid, which is
    the biochemical hallmark of ETHE1-related ethylmalonic encephalopathy - a
    disorder that also causes cytochrome c oxidase deficiency.
  distinguishing_features:
  - >-
    Ethylmalonic encephalopathy is caused by ETHE1 (sulphur dioxygenase)
    deficiency, not by a Complex IV assembly defect, and is defined by massive,
    persistent ethylmalonic aciduria with orthostatic acrocyanosis, petechiae and
    chronic diarrhoea.
  - >-
    The ethylmalonic acid elevation reported in COA5 disease accompanies the
    metabolic decompensation and is not the defining finding; the cardiac
    phenotype is.
- name: Primary mitochondrial DNA disease
  description: >-
    mtDNA-encoded COX subunit variants and mtDNA depletion syndromes produce
    infantile cardiomyopathy with lactic acidosis and COX deficiency and are the
    first alternative excluded in practice.
  distinguishing_features:
  - >-
    Complete mtDNA analysis was negative in the reported COA5 patient before
    nuclear exome sequencing was undertaken, and excluding mtDNA disease is a
    standard step on the way to a nuclear assembly-factor diagnosis.
  - >-
    Maternal inheritance, heteroplasmy and a mosaic pattern of COX-negative
    fibres favour mtDNA disease, whereas uniform COX deficiency in all fibres
    with recessive segregation favours a nuclear assembly-factor defect.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic testing eliminated pathogenic mitochondrial DNA (mtDNA) variants after a complete analysis of the mitochondrial genome."
    explanation: >-
      Exclusion of mtDNA disease was a necessary step before the nuclear
      diagnosis in the reported patient.
discussions:
- discussion_id: coa5_encephalopathy_not_documented
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling"
  - "phenotypes#Hypertrophic Cardiomyopathy"
  prompt: >-
    The disease is named a cardioencephalomyopathy, but is there any documented
    central nervous system involvement in COA5 deficiency?
  rationale: >-
    The MONDO and OMIM labels both carry "cardioencephalomyopathy", inherited
    from the SCO2-defined syndrome that the name was coined for. The published
    COA5 phenotype does not currently support the "encephalo-" half. The founding
    report describes fatal neonatal cardiomyopathy; the OMIM summary of the
    disorder describes neonatal hypertrophic cardiomyopathy resulting in death in
    early infancy; and in the only patient with imaging reported, neuroimaging of
    the brain was normal. This entry therefore records no encephalopathy
    phenotype. The gap is a genuine absence of evidence, not evidence of absence:
    with three patients, two of whom died as neonates, the disorder may simply
    not have had time or opportunity to express neurological features. It matters
    because importing encephalopathy from the SCO2 or Leigh-syndrome literature
    would be a Named Entity Confusion error, and because a future patient
    surviving beyond infancy would be the first real test.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging of the brain was normal."
    explanation: >-
      Directly refutes structural brain involvement in the one COA5 patient in
      whom neuroimaging is reported, which is the basis for not curating an
      encephalopathy phenotype.
- discussion_id: coa5_submitochondrial_localisation_and_metallochaperone_role
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#COA5 Loss and Arrested Early Complex IV Assembly"
  prompt: >-
    Where does human COA5 sit within the mitochondrion, and does it act purely as
    an assembly factor at the MTCO1-to-MTCO2 transition or also as a regulator of
    the copper and haem metallochaperone modules?
  rationale: >-
    Two lines of human work point in partly different directions. Complexome
    profiling of a COA5 knockout places the defect squarely at the transition
    between MTCO1 maturation and MTCO2 incorporation. Separately, a suppressor
    screen in COX11-knockout human cells identified PET191/COA5 as a contributor
    to copper-centre biogenesis and placed it among the twin-CX9C proteins that
    regulate dynamic metallochaperone modules. These are compatible - MTCO2
    incorporation requires its CuA centre - but they are not the same claim, and
    no antibody robust enough for routine western blotting exists, so the
    protein's submitochondrial localisation is still unresolved. The yeast
    orthologue Pet191 is a further complication rather than a resolution: its
    import is independent of the Mia40 pathway, unlike most twin-CX9C proteins,
    so yeast localisation data cannot be transferred to the human protein.
  evidence:
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified the twin CX9C protein PET191/COA5 as a key contributor in human cells"
    explanation: >-
      Places COA5 in the copper-centre biogenesis machinery in human knockout
      cells, which is the alternative role this question is about.
  - reference: PMID:18503002
    reference_title: Pet191 is a cytochrome c oxidase assembly factor in Saccharomyces cerevisiae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The import of Pet191 differs from that of other twin-Cx(9)C motif class of proteins in being independent of the Mia40 pathway."
    explanation: >-
      Evidence about the yeast orthologue Pet191, not about human COA5. It is
      cited only to substantiate why yeast import and localisation data cannot be
      read across to the human protein.
- discussion_id: coa5_founder_allele_unverified
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "genetic#COA5 pathogenic variants causing CEMCOX3 (MC4DN9)"
  - "prevalence#Worldwide"
  prompt: >-
    Is COA5 c.157G>C (p.Ala53Pro) a Turkish founder allele, or has the same
    variant arisen independently?
  rationale: >-
    Every reported patient carries the same homozygous allele and both families
    are of Turkish descent, which is the pattern a founder variant makes. The
    authors who noticed it say so explicitly and equally explicitly say it is
    unverified: haplotype analysis would require samples from the 1990s-era
    founding family. The answer changes carrier-screening strategy in the Turkish
    population and would change how the ultra-rare occurrence estimate should be
    read, so this entry records the observation without asserting founder status.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this could point towards the likelihood of the variant being a founder pathogenic variant within the Turkish population"
    explanation: >-
      States the founder hypothesis as a possibility, in the authors' own hedged
      terms, which is exactly the epistemic status recorded here.
notes: >
  Lump/split. Curated as a standalone Disease entry rather than a subtype or a
  grouping. MONDO:0014667 is a gene-defined Mendelian leaf built on the
  disease_series_by_gene pattern (its definition is "any fatal infantile
  encephalocardiomyopathy in which the cause of the disease is a mutation in the
  COA5 gene"), it has no MONDO descendants, and a single causal gene. Its parent
  is MONDO:0015487, a gene-agnostic umbrella that dismech decided in issue #5060
  / PR #5064 not to curate as a Disease entry, redirecting the content into the
  Mitochondrial_Complex_IV_Deficiency grouping. Following that decision, COA5
  gets its own gene-defined entry and MONDO:0015487 stays uncurated as a Disease.
  The design-decisions default level for a Mendelian entry is the gene-defined
  disease, and there is no biomarker/therapy stratum, stage, or variant tier here
  to promote or demote.

  Grouping membership. Added as a member of the Mitochondrial_Complex_IV_Deficiency
  grouping. That grouping's single membership criterion is
  NECESSARY_AND_SUFFICIENT conformance to
  complex_iv_assembly_deficiency#Complex IV Biogenesis Failure, and this entry's
  first pathophysiology node declares exactly that conformance. Note the MONDO
  placement is the same outside-the-subtree case the grouping's own consistency
  note already describes for SCO2-Related Fatal Infantile Cardioencephalomyopathy,
  COX15-Related COX Deficiency and COX4I2-Related Pancreatic
  Insufficiency-Anemia-Hyperostosis Syndrome: MONDO:0014667 is a child of
  MONDO:0015487 (a clinical-syndrome node), not of MONDO:0033885 (nuclear type),
  even though MONDO's own synonym list for it includes "mitochondrial complex IV,
  deficiency, nuclear type 9". Membership rests on module conformance, not on the
  MONDO subtree.

  Evidence base and its limits. The human literature is three patients in two
  families: Huigsloot et al., 2011 (Am J Hum Genet; PMID:21457908), which reported
  two siblings and identified C2orf64/COA5, and Tang et al., 2025 (Life Sci
  Alliance; PMID:39779219), which reported one further child and localized the
  COA5 step by complexome profiling in a CRISPR/Cas9 knockout. Nývltová et al.,
  2022 (Nat Commun; PMID:35750769) is human cell-line work on metal-centre
  biogenesis that assigns COA5/PET191 a role among the twin-CX9C regulators;
  Khalimonchuk et al., 2008 (Eukaryot Cell; PMID:18503002) is yeast work on the
  orthologue Pet191 and is cited only where the yeast-human difference is itself
  the point. Claims that could not be sourced to COA5 specifically were dropped
  rather than supported from the general Complex IV or Leigh-syndrome literature.
  MedGen lists three HPO features against this concept: HP:0001639, HP:0008347
  and HP:0031320 (cardiomyocyte mitochondrial proliferation). The first two are
  curated here with quoted evidence. HP:0031320 is not: searching every
  occurrence of "proliferat", "ultrastruct" and "electron microscop" across all
  four cached references returns nothing about cardiomyocyte mitochondria (the
  sole "ultrastructure" hit is a MeSH keyword on the yeast paper), so the
  ultrastructural finding presumably comes from a part of PMID:21457908 that is
  behind the paywall. It is recorded here rather than curated as an unevidenced
  phenotype.

  Identifiers. MONDO:0014667 maps to OMIM:616500 (MITOCHONDRIAL COMPLEX IV
  DEFICIENCY, NUCLEAR TYPE 9), MedGen C4225154, DOID:0080359, GARD:0018572. The
  COA5 gene is OMIM:613920, hgnc:33848, at 2q11.2. The disorder abbreviations
  CEMCOX3 and MC4DN9 both refer to this concept.

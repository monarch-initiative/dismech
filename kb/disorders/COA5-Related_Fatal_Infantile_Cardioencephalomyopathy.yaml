prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2011 and 2025 reports together describe three affected individuals from two families: a sibling
    pair with fatal neonatal cardiomyopathy and one unrelated child. Both families are of Turkish descent
    and carry homozygous COA5 c.157G>C (p.Ala53Pro). These reports do not provide a population prevalence
    estimate.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the rare c.157G>C, p.Ala53Pro variant was found only in two incidences where both patients were of Turkish ethnicity"
    explanation: >-
      Establishes that as of 2025 the causal allele had been observed in only two
      independent instances, both in patients of Turkish ethnicity, which is the
      basis for the ultra-rare, case-count-only occurrence record.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In this report, a homozygous mutation in C2orf64 is described in two siblings affected by fatal neonatal cardiomyopathy.
    explanation: >-
      The first report contributes two affected siblings.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here, we present an unrelated family in which a clinically affected child harbours the identical COA5 missense variant
    explanation: >-
      The second report contributes one unrelated affected child; together the reports describe three
      children.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  description: >-
    The homozygous COA5 p.Ala53Pro variant segregates with disease in the reported families, with heterozygous
    carrier parents in the 2025 family. Three affected children from two families do not establish population
    penetrance or the range of expressivity. The founding siblings died as neonates and the later patient
    at three months.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing conducted at the Exeter Genomics Laboratory identified a previously reported COA5 variant (c.157G>C, p.Ala53Pro), confirming both parents to be heterozygous carriers"
    explanation: >-
      Homozygosity in the affected child with both parents heterozygous carriers
      is the segregation pattern of autosomal recessive inheritance.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A female neonate born to second cousins of Turkish descent presented with tachypnoeic episodes on the first day of life"
    explanation: >-
      Parental consanguinity is consistent with recessive inheritance; it does not establish a founder
      effect.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
progression:
- phase: Neonatal presentation
  age_range: First days of life
  notes: >-
    Presentation is in the neonatal period. The 2025 patient had tachypnoeic
    episodes on day one with elevated blood lactate and was found on
    echocardiography to have biventricular hypertrophic cardiomyopathy; she
    required intubation and inotropic support at 11 days and was discharged at 6
    weeks. The two siblings in the founding report had fatal neonatal
    cardiomyopathy.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of worsening respiratory distress, she was intubated and given inotropic support at 11 d after birth before being discharged at 6 wk."
    explanation: >-
      Describes the neonatal course, its severity, and the point at which
      intensive support was required.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- phase: Fatal decompensation
  age_range: First days to 3 months
  notes: >-
    The two siblings in the 2011 report died as neonates. The 2025 patient was discharged at six weeks,
    readmitted a month later with worsening respiratory distress concurrent with rhinovirus infection,
    poor cardiac function and severe lactic acidosis, and died at three months. These reports do not establish
    outcomes for other genotypes or longer-term survivors.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A month later, she was readmitted with further deterioration of respiratory distress concurrent with a rhinovirus infection, poor cardiac function, and severe lactic acidosis, and finally passed away at 3 mo of age."
    explanation: >-
      Readmission occurred a month after the preceding discharge at six weeks; the infection was concurrent
      with terminal deterioration.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings affected by fatal neonatal cardiomyopathy"
    explanation: >-
      Establishes the fatal neonatal course in the founding family.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
pathophysiology:
- name: Impaired COA5 Assembly-Factor Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous COA5 p.Ala53Pro impairs assembly-factor function. Wild-type COA5 complementation restores
    complex IV activity in patient fibroblasts. This functional defect does not establish complete absence
    of the missense protein; the null cell models are distinct experimental perturbations.
  genes:
  - preferred_term: COA5
    term:
      id: hgnc:33848
      label: COA5
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
    explanation: >-
      Complementation with wild-type COA5 restores Complex IV activity in patient
      cells, establishing loss of COA5 function as the direct molecular lesion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:
  - target: Arrested Early Complex IV Assembly
    causal_link_type: DIRECT
    description: >-
      Loss of functional COA5 impairs early complex IV assembly; patient-cell rescue attributes the defect
      to COA5.
    evidence:
    - reference: PMID:21457908
      reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
      explanation: >-
        Complementation with wild-type COA5 restores Complex IV activity in patient
        cells, establishing loss of COA5 function as the direct molecular lesion.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Disrupted COX2 Metallochaperone Interactions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of COA5/PET191 disrupts COX2 assembly-factor interactions in engineered HEK293T cells. Transfer
      of this precise intermediate to p.Ala53Pro patient cells remains provisional.
- name: Disrupted COX2 Metallochaperone Interactions
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In PET191/COA5 knockout HEK293T cells, newly synthesized COX2 fails to interact with SCO1, COA6 and
    COX16. These experiments support a COA5-dependent metallochaperone assembly function, but do not establish
    that p.Ala53Pro disrupts each interaction identically.
  evidence:
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Furthermore, SCO1, COA6, and COX16 failed to interact with the newly synthesized COX2 in the absence of PET191
    explanation: >-
      Immunoprecipitation in PET191/COA5 knockout human cells identifies loss of these COX2 interactions.
      This has not been measured in patient cells.
  downstream:
  - target: Arrested Early Complex IV Assembly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired recruitment of COX2 maturation factors provides a candidate explanation for failure to
      incorporate mature MTCO2. The exact connection to the patient missense assembly defect remains unresolved.
- name: Arrested Early Complex IV Assembly
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts accumulate an early COX1/MTCO1-containing intermediate lacking COX2, COX4 and
    COX5b, with reduced mature complex IV. In COA5 knockout U2OS cells, complexome profiling places the
    block between MTCO1 maturation and MTCO2 incorporation. Complete loss of the holocomplex in knockout
    cells should not be equated with complete loss in patient fibroblasts.
  cellular_components:
  - preferred_term: mitochondrial respiratory chain complex IV
    term:
      id: GO:0045277
      label: respiratory chain complex IV
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Detailed analysis of complex IV assembly intermediates in patient fibroblasts by 2D-BN PAGE revealed the accumulation of a small assembly intermediate containing subunit COX1 but not the COX2, COX4, or COX5b subunits, indicating that C2orf64 is involved in an early step of the complex IV assembly process."
    explanation: >-
      Directly localizes the COA5/C2orf64 lesion to an early step of Complex IV
      assembly, with a COX1-containing intermediate that fails to acquire COX2.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial complexome profiling pinpointed a role of COA5 in early CIV assembly, more specifically, its involvement in the stage between MTCO1 maturation and the incorporation of MTCO2"
    explanation: >-
      Complexome profiling of a CRISPR/Cas9 COA5 knockout cell line places the
      COA5-dependent step precisely between MTCO1 maturation and MTCO2
      incorporation.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: CIV protein subunits exhibited a statistically significant decrease in protein abundance up to almost fourfold, whereas CI, CII, CIII, and CV protein abundance remained unchanged
    explanation: >-
      Proteomic profiling of immortalised patient fibroblasts supports selective reduction of CIV protein
      abundance.
  downstream:
  - target: Reduced Complex IV Activity
    causal_link_type: DIRECT
    description: >-
      Impaired formation of mature complex IV reduces cytochrome c oxidase activity. Wild-type COA5 restores
      complex IV activity in patient fibroblasts.
    evidence:
    - reference: PMID:21457908
      reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
      explanation: >-
        Complementation with wild-type COA5 restores Complex IV activity in patient
        cells, establishing loss of COA5 function as the direct molecular lesion.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Loss of Complex IV-Containing Supercomplexes
    causal_link_type: DIRECT
    description: >-
      Failure to assemble mature complex IV limits its incorporation into respiratory supercomplexes in
      COA5 knockout U2OS cells.
- name: Reduced Complex IV Activity
  biological_scale: CELLULAR
  description: >-
    Cytochrome c oxidase activity is deficient in patient-derived fibroblasts and skeletal muscle. Reduced
    terminal oxidase function is expected to limit oxidative energy production, but the cited clinical
    studies do not directly measure myocardial ATP synthesis or prove its complete collapse.
  biological_processes:

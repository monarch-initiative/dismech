  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: >-
    Biventricular hypertrophic cardiomyopathy with septal hypertrophy and a
    non-compaction appearance of the myocardium.
  markers: Ventricular wall thickness; myocardial trabeculation and compaction
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subsequent echocardiography indicated significant biventricular hypertrophic cardiomyopathy with septal hypertrophy and non-compaction appearance of the myocardium"
    explanation: >-
      Echocardiography is what established the cardiac phenotype in the reported

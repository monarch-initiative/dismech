    preferred_term: functional molecular analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Complex IV activity restored by wild-type COA5 in patient fibroblasts; the
    isolated Complex IV assembly defect is reproduced in a COA5 knockout cell
    line.
  markers: Complex IV activity and assembly after wild-type COA5 re-expression
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
    explanation: >-
      The complementation experiment is the functional evidence that establishes
      variant pathogenicity for this gene.
treatments:
- name: Supportive and Metabolic Care
  description: >
    No disease-modifying therapy exists. Management is supportive: inotropic and
    respiratory support during cardiac and metabolic decompensation, treatment of
    lactic acidosis, cardiac surveillance, and anticipatory guidance. In the
    2025 patient, care was explicitly directed to symptomatic management once the
    mitochondrial diagnosis was made, and intercurrent viral infection
    precipitated the fatal decompensation - so infection prevention and early
    escalation during intercurrent illness are the practical priorities.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Lactic Acidosis and Metabolic Decompensation
    description: >-
      Supportive care is directed at the metabolic decompensation rather than at
      the assembly defect that causes it.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical care was directed to symptomatic management only when a presumptive diagnosis of mitochondrial disorder with hypertrophic cardiomyopathy was made"
    explanation: >-
      Documents that management in the reported patient was symptomatic only,
      which is the state of therapy for this disorder.
- name: Genetic Counseling and Carrier Testing
  description: >
    Autosomal recessive inheritance with a 25% recurrence risk for future
    pregnancies of carrier parents. Both reported families were consanguineous or
    closely related, and the same allele has recurred in two unrelated families
    of Turkish descent, so targeted carrier testing of at-risk relatives is
    straightforward once the familial variant is known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirming both parents to be heterozygous carriers"
    explanation: >-
      Carrier status of both parents is what makes recurrence-risk counseling and
      targeted carrier testing applicable.

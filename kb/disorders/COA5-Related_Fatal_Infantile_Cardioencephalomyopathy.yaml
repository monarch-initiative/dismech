  cell_source: Patient skin biopsy (homozygous COA5 c.157G>C, p.Ala53Pro)
  publication: PMID:21457908
  modeled_mechanisms:
  - target: Arrested Early Complex IV Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Patient fibroblasts accumulate an early COX1-containing intermediate and have reduced mature complex
      IV. Wild-type COA5 restores complex IV activity.
    limitations: >-
      Fibroblasts are not an affected tissue in this cardiac-dominant disorder,
      so nothing about the cardiomyopathy can be read out here. The cells also
      grow poorly, which the 2025 authors identify as a practical limit on
      further experimentation.
    readouts:
    - name: Complex IV assembly intermediates on 2D-BN PAGE
      target: Arrested Early Complex IV Assembly
      direction: INCREASED
      interpretation: >-
        Accumulation of a small COX1-containing intermediate lacking COX2, COX4
        and COX5b is the direct structural readout of the arrested assembly step.
      evidence:
      - reference: PMID:21457908
        reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Detailed analysis of complex IV assembly intermediates in patient fibroblasts by 2D-BN PAGE revealed the accumulation of a small assembly intermediate containing subunit COX1 but not the COX2, COX4, or COX5b subunits, indicating that C2orf64 is involved in an early step of the complex IV assembly process."
        explanation: Reports the measurement and its direction in this model system.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Complex IV activity after wild-type COA5 re-expression
      target: Arrested Early Complex IV Assembly
      direction: RESTORED
      interpretation: >-
        Full restoration of Complex IV activity on complementation is what
        attributes the deficiency to COA5 rather than to background.
      evidence:
      - reference: PMID:21457908
        reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
        explanation: Reports the rescue measurement in the patient fibroblast model.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:39779219
      reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: CIV protein subunits exhibited a statistically significant decrease in protein abundance up to almost fourfold, whereas CI, CII, CIII, and CV protein abundance remained unchanged
      explanation: >-
        Proteomic profiling of immortalised patient fibroblasts supports selective reduction of CIV protein
        abundance.
  notes: >-
    Both primary and immortalised patient fibroblasts showed arrested growth in culture; proteomic profiling
    used immortalised derivatives.
- name: CRISPR/Cas9 COA5 knockout U2OS cell line
  experimental_model_type: CELL_LINE
  description: >
    A homozygous COA5 knockout (7-bp deletion, c.287_290+3del) engineered in the
    human U2OS osteosarcoma line, with an isogenic wild-type control from the
    same nucleofected population. Built specifically because the patient
    fibroblasts grow too poorly for extended biochemistry, it is the system in
    which complexome profiling localized the COA5-dependent step.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: U2OS human osteosarcoma cell line, CRISPR/Cas9-edited, with isogenic control
  publication: PMID:39779219
  modeled_mechanisms:
  - target: Arrested Early Complex IV Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The knockout reproduces the patients' isolated Complex IV defect and
      resolves it further: MTCO1-containing subcomplexes accumulate, MTCO2 is
      absent, and the holoenzyme is lost, placing the COA5 step between MTCO1
      maturation and MTCO2 incorporation.
    limitations: >-
      U2OS is a heterologous osteosarcoma line. The engineered c.287_290+3del deletion causes undetectable
      COA5 protein on complexome profiling, unlike the patient missense genotype. Cardiac remodeling and
      infantile lethality lie outside this cellular model.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The model carries an engineered deletion with loss of detectable COA5 protein, rather than the
        patient p.Ala53Pro substitution. It does not establish that the missense allele is a complete
        null.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Cardiomyocytes, the myocardium, and the whole organism lie outside the
        model boundary, so the hypertrophic remodeling and infantile lethality
        that define the clinical disorder cannot arise in it. Its claims are
        restricted to the molecular assembly step.
    readouts:
    - name: Steady-state MTCO2 subunit level
      target: Arrested Early Complex IV Assembly
      direction: DECREASED
      interpretation: >-
        Loss of MTCO2 is a readout of the early complex IV assembly defect.
      evidence:
      - reference: PMID:39779219
        reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The COA5KO cells successfully replicated the isolated complex IV deficiency observed in the reported patients by indicating an evident loss of MTCO2 protein"
        explanation: Reports the MTCO2 measurement and its direction in the knockout line.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Fully assembled complex IV holocomplex on complexome profiling

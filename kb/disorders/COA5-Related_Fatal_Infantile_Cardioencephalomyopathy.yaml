name: COA5-Related Fatal Infantile Cardioencephalomyopathy
category: Mendelian
creation_date: "2026-09-07T00:00:00Z"
synonyms:
- CEMCOX3
- Cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 3
- Mitochondrial complex IV deficiency, nuclear type 9
- MC4DN9
- COA5 fatal infantile encephalocardiomyopathy
- C2orf64 deficiency
description: >-
  COA5-related fatal infantile cardioencephalomyopathy (CEMCOX3; mitochondrial complex IV deficiency nuclear
  type 9, MC4DN9) is an ultra-rare autosomal recessive disorder of cytochrome c oxidase assembly caused
  by biallelic COA5 variants. Patient fibroblasts accumulate early MTCO1-containing assembly intermediates
  and have reduced mature complex IV. COA5 knockout cells localize the assembly defect between MTCO1 maturation
  and MTCO2 incorporation. The 2011 and 2025 clinical reports describe three affected children in two
  Turkish families, all homozygous for c.157G>C (p.Ala53Pro). Neonatal hypertrophic cardiomyopathy and
  infantile death dominate the reported course. The 2025 patient also had respiratory insufficiency, lactic
  acidosis, urinary lactate and ethylmalonic acid elevation, and hepatic abnormalities. Normal brain imaging
  in that patient does not exclude neurological involvement in the wider disorder. The small case series
  cannot establish penetrance, phenotype frequencies, or the full clinical spectrum.

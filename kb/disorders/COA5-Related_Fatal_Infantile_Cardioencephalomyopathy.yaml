genetic:
- name: COA5 pathogenic variants causing CEMCOX3 (MC4DN9)
  gene_term:
    preferred_term: COA5
    term:
      id: hgnc:33848
      label: COA5
  variant_origin: GERMLINE
  features: >
    All three reported patients, in two unrelated families of Turkish descent,
    are homozygous for the same COA5 missense allele NM_001008215.3:c.157G>C
    (p.Ala53Pro). The substituted alanine lies within the coiled-coil-helix
    twin-CX9C domain. Notably, the residue is not broadly conserved across
    species and the REVEL meta-predictor score falls below the usual pathogenic
    threshold, so in-silico prediction alone does not carry this variant - the
    supporting evidence is functional (complementation rescue in patient
    fibroblasts and phenocopy by a CRISPR/Cas9 COA5 knockout).

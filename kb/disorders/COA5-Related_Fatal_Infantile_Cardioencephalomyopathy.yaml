  - name: COA5 c.157G>C (p.Ala53Pro)
    description: >
      Homozygous missense variant in the twin-CX9C domain of COA5, the only
      pathogenic COA5 allele reported to date. Recorded in ClinVar as pathogenic
      for isolated cytochrome c oxidase deficiency. Its recurrence in two
      unrelated Turkish families raises but does not establish the possibility of
      a founder allele; haplotype analysis has not been performed.

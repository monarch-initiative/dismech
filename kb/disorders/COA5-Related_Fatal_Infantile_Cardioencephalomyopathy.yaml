diagnosis:
- name: Respiratory-chain enzyme assay on skeletal muscle biopsy
  description: >-
    Histochemical and spectrophotometric assessment of cytochrome c oxidase
    activity in a skeletal muscle biopsy is the step that establishes an
    isolated Complex IV deficiency and directs molecular testing toward the
    nuclear COX assembly genes. In the reported patient, COX histochemistry
    showed deficiency in all fibres and quadruple OXPHOS immunofluorescence
    showed loss of MTCO1 with normal complex I subunit levels.
  diagnosis_term:
    preferred_term: skeletal muscle biopsy for respiratory chain enzymology
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  results: >-
    Reduced cytochrome c oxidase activity in all fibres with preserved complex I,
    II, III and V activity - an isolated Complex IV deficiency.
  markers: Cytochrome c oxidase (Complex IV) enzyme activity relative to citrate synthase
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histochemical analysis of skeletal muscle cryosections from the patient indicated a moderate CIV deficiency in all fibres"
    explanation: >-
      The muscle biopsy histochemistry is what demonstrated the Complex IV
      deficiency in the reported patient.
- name: Blood and urine lactate measurement
  description: >-
    Serial blood lactate and urinary organic-acid analysis are the first-line
    biochemical screen. In COA5 disease the blood lactate is elevated but
    fluctuating, so a single normal value does not exclude the diagnosis, and
    the urinary profile shows lactate with ethylmalonic acid.
  diagnosis_term:
    preferred_term: blood lactate measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  results: >-
    Blood lactate elevated and fluctuating (2.5-11 mmol/L in the reported
    patient); urinary lactate and ethylmalonic acid elevated.
  markers: Blood lactate concentration; urinary lactate and ethylmalonic acid
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood lactate was elevated at variable levels between 2.5 and 11 mmol/litre."
    explanation: >-
      Documents the magnitude and the variability of the lactate elevation that
      this diagnostic step detects.
- name: Echocardiography
  description: >-
    Echocardiography defines the cardiac phenotype that dominates this disorder

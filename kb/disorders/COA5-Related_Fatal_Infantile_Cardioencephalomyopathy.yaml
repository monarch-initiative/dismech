prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three affected individuals in two unrelated families have been reported: two
    siblings with fatal neonatal cardiomyopathy (Huigsloot et al., 2011) and one
    further female neonate (Tang et al., 2025). Both families are of Turkish
    descent and all three patients are homozygous for the same c.157G>C
    (p.Ala53Pro) allele. No population prevalence estimate exists.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the rare c.157G>C, p.Ala53Pro variant was found only in two incidences where both patients were of Turkish ethnicity"
    explanation: >-
      Establishes that as of 2025 the causal allele had been observed in only two
      independent instances, both in patients of Turkish ethnicity, which is the
      basis for the ultra-rare, case-count-only occurrence record.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  description: >-
    Both reported families are consanguineous or closely related and segregate a
    homozygous COA5 missense allele with heterozygous, unaffected parents.
    Penetrance and expressivity are recorded as UNKNOWN rather than complete and
    consistent: with three affected individuals from two families, all carrying
    the same genotype, there is no unaffected-homozygote observation that could
    establish complete penetrance and no genotype contrast that could establish
    consistent expressivity. Course was fatal in all three, but the age at death
    differed markedly - the two siblings in the founding report died as neonates,
    whereas the 2025 patient survived to 3 months - which is a hint of
    variability rather than evidence against it.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing conducted at the Exeter Genomics Laboratory identified a previously reported COA5 variant (c.157G>C, p.Ala53Pro), confirming both parents to be heterozygous carriers"
    explanation: >-
      Homozygosity in the affected child with both parents heterozygous carriers
      is the segregation pattern of autosomal recessive inheritance.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A female neonate born to second cousins of Turkish descent presented with tachypnoeic episodes on the first day of life"
    explanation: >-
      Parental consanguinity in the second reported family is consistent with a
      recessive disorder caused by a homozygous founder-type allele.
progression:
- phase: Neonatal presentation
  age_range: First days of life
  notes: >-
    Presentation is in the neonatal period. The 2025 patient had tachypnoeic
    episodes on day one with elevated blood lactate and was found on
    echocardiography to have biventricular hypertrophic cardiomyopathy; she
    required intubation and inotropic support at 11 days and was discharged at 6
    weeks. The two siblings in the founding report had fatal neonatal
    cardiomyopathy.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of worsening respiratory distress, she was intubated and given inotropic support at 11 d after birth before being discharged at 6 wk."
    explanation: >-
      Describes the neonatal course, its severity, and the point at which
      intensive support was required.
- phase: Fatal decompensation
  age_range: First days to 3 months
  notes: >-
    All three reported patients died in infancy. Death was neonatal in the
    founding sibling pair; the 2025 patient deteriorated at around 1 month with
    an intercurrent rhinovirus infection and died at 3 months. No surviving
    patient has been reported, so nothing is known about a later course.
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she was readmitted with further deterioration of respiratory distress concurrent with a rhinovirus infection, poor cardiac function, and severe lactic acidosis, and finally passed away at 3 mo of age"
    explanation: >-
      Documents the terminal decompensation, its infectious trigger, and the age
      at death in the second reported family.
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings affected by fatal neonatal cardiomyopathy"
    explanation: >-
      Establishes the fatal neonatal course in the founding family.
pathophysiology:
- name: COA5 Loss and Arrested Early Complex IV Assembly
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  description: >
    Biallelic COA5 (C2orf64) variants remove a small twin-CX9C Complex IV
    assembly factor that acts between maturation of the mitochondrially encoded
    core subunit MTCO1 and the incorporation of MTCO2 into the nascent enzyme.
    Patient fibroblasts accumulate a small assembly intermediate containing COX1
    but lacking COX2, COX4 and COX5b, and steady-state MTCO2 is selectively
    reduced in patient fibroblasts and skeletal muscle, so the holoenzyme is
    never completed. The lesion is confined to Complex IV biogenesis: the other
    oxidative-phosphorylation complexes are unaffected.
  genes:
  - preferred_term: COA5
    term:
      id: hgnc:33848
      label: COA5
  cellular_components:
  - preferred_term: mitochondrial respiratory chain complex IV
    term:
      id: GO:0045277
      label: respiratory chain complex IV
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Detailed analysis of complex IV assembly intermediates in patient fibroblasts by 2D-BN PAGE revealed the accumulation of a small assembly intermediate containing subunit COX1 but not the COX2, COX4, or COX5b subunits, indicating that C2orf64 is involved in an early step of the complex IV assembly process."
    explanation: >-
      Directly localizes the COA5/C2orf64 lesion to an early step of Complex IV
      assembly, with a COX1-containing intermediate that fails to acquire COX2.
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complex IV activity can be fully restored by retroviral transduction of wild-type C2orf64 in patient-derived fibroblasts"
    explanation: >-
      Complementation with wild-type COA5 restores Complex IV activity in patient
      cells, establishing loss of COA5 function as the direct molecular lesion.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial complexome profiling pinpointed a role of COA5 in early CIV assembly, more specifically, its involvement in the stage between MTCO1 maturation and the incorporation of MTCO2"
    explanation: >-
      Complexome profiling of a CRISPR/Cas9 COA5 knockout cell line places the
      COA5-dependent step precisely between MTCO1 maturation and MTCO2
      incorporation.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Decreased steady-state levels were only observed in the CIV subunit, MTCO2, whereas other OXPHOS complex subunits were unaffected in whole-cell lysates of both patient-derived fibroblasts and skeletal muscle biopsy"
    explanation: >-
      The selective loss of MTCO2 with sparing of the other complexes is the
      biochemical signature of the arrested MTCO1-to-MTCO2 assembly step.
  downstream:
  - target: Impaired Terminal Electron Transfer and ATP Synthesis
    causal_link_type: DIRECT
    description: >-
      An incompletely assembled, MTCO2-deficient Complex IV cannot accept
      electrons from cytochrome c, so terminal electron transfer and the coupled
      proton pumping fail.
    evidence:
    - reference: PMID:39779219
      reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Histochemical analysis of skeletal muscle cryosections from the patient indicated a moderate CIV deficiency in all fibres"
      explanation: >-
        The assembly block translates into measurably deficient Complex IV
        activity in patient muscle, the functional consequence asserted by this
        edge.
- name: Impaired Terminal Electron Transfer and ATP Synthesis
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  biological_scale: CELLULAR
  description: >
    Loss of assembled Complex IV blocks electron transfer from cytochrome c to
    molecular oxygen and the proton pumping coupled to it, collapsing oxidative
    ATP synthesis. In COA5 knockout cells the supercomplex containing complexes
    III2 and IV is lost entirely, leaving only complex I plus III2 assemblies, so
    the respirasome cannot form.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was corroborated by quadruple OXPHOS immunofluorescence assay, which showed a marked loss of MTCO1 immunoreactivity (Fig 2B), whereas NDUFB8 (complex I subunit) protein levels were normal"
    explanation: >-
      Single-fibre analysis of patient muscle shows the deficiency is confined to
      Complex IV, with complex I intact, i.e. an isolated terminal-oxidase defect.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When assessing complex III subunits, a complete loss of the supercomplexes III2+IV (Ss) was observed in the COA5KO cell line"
    explanation: >-
      Loss of the III2+IV supercomplex in the COA5 knockout shows that the
      electron-transfer architecture downstream of complex III is abolished.
  downstream:
  - target: Lactic Acidosis and Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      With oxidative ATP synthesis blocked, pyruvate is shunted to lactate and
      the cell relies on anaerobic glycolysis.
  - target: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic energy deficit in the highest-demand tissue, the neonatal
      myocardium, drives hypertrophic remodeling. The intervening steps between
      the bioenergetic deficit and the hypertrophic phenotype are not established
      for COA5.
- name: Lactic Acidosis and Metabolic Decompensation
  conforms_to: "complex_iv_assembly_deficiency#Lactic Acidosis and Metabolic Decompensation"
  biological_scale: ORGANISM
  description: >
    The block in oxidative phosphorylation shifts pyruvate toward lactate,
    producing fluctuating and ultimately severe systemic lactic acidosis with
    lactic aciduria and, in the 2025 patient, ethylmalonic aciduria and abnormal
    liver function. Terminal decompensation was precipitated by an intercurrent
    viral infection.
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood lactate was elevated at variable levels between 2.5 and 11 mmol/litre."
    explanation: >-
      Documents the systemic lactate elevation that this node asserts, with the
      fluctuating pattern typical of a compensated then decompensating
      bioenergetic block.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focused metabolic biochemical investigations identified elevated urinary lactate and ethylmalonic acid."
    explanation: >-
      Confirms the urinary organic-acid correlate of the same metabolic block.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: DIRECT
    description: Accumulated circulating lactate produces the measured acidosis.
  - target: Lacticaciduria
    causal_link_type: DIRECT
    description: Renal excretion of the accumulated lactate load.
  - target: Ethylmalonic Aciduria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Elevated urinary ethylmalonic acid accompanies the metabolic
      decompensation. The route from the Complex IV block to ethylmalonate
      excretion is not established in COA5 disease.
  - target: Abnormal Hepatic Echogenicity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hepatic involvement, with abnormal liver function tests and increased
      hepatic echogenicity, accompanies the systemic metabolic decompensation.
- name: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
  conforms_to: "complex_iv_assembly_deficiency#High-Energy Tissue Dysfunction"
  biological_scale: TISSUE
  description: >
    The neonatal myocardium is the tissue that fails first and hardest in COA5
    deficiency. All reported patients developed cardiomyopathy; in the 2025 case
    it was biventricular and hypertrophic with septal hypertrophy and a
    non-compaction appearance of the myocardium, progressing to poor cardiac
    function and death. This cardiac dominance, rather than the encephalopathy
    that the disease name implies, is what distinguishes the COA5 phenotype
    within nuclear-type Complex IV deficiency.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:21457908
    reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation in C2orf64 is described in two siblings affected by fatal neonatal cardiomyopathy"
    explanation: >-
      The founding report establishes cardiomyopathy as the defining organ
      manifestation of COA5 deficiency.
  - reference: PMID:39779219
    reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subsequent echocardiography indicated significant biventricular hypertrophic cardiomyopathy with septal hypertrophy and non-compaction appearance of the myocardium"
    explanation: >-
      Characterizes the cardiac phenotype in the second reported family as
      biventricular hypertrophic cardiomyopathy with non-compaction morphology.
  downstream:
  - target: Hypertrophic Cardiomyopathy
    causal_link_type: DIRECT
    description: The remodeling response is expressed as hypertrophic cardiomyopathy.
  - target: Ventricular Septal Hypertrophy
    causal_link_type: DIRECT
    description: Septal hypertrophy is a component of the hypertrophic remodeling.
  - target: Noncompaction Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A non-compaction appearance of the myocardium accompanied the hypertrophy
      in the 2025 patient. Whether it reflects arrested compaction during
      cardiac development or secondary remodeling is not established.

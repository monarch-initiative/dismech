  - target: Decreased Activity of Mitochondrial Complex IV
    causal_link_type: DIRECT
    description: >-
      The enzymatic defect is measured as reduced cytochrome c oxidase activity.
- name: Loss of Complex IV-Containing Supercomplexes
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    COA5 knockout U2OS cells lose the III2+IV supercomplex and accumulate I+III2 assemblies. This respiratory-chain
    reorganization is an experimental consequence of COA5 deletion; its extent and functional contribution
    in patient myocardium are unknown.
  evidence:

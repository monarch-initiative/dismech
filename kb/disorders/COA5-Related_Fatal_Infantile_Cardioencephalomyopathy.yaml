name: COA5-Related Fatal Infantile Cardioencephalomyopathy
category: Mendelian
creation_date: "2026-09-07T00:00:00Z"
synonyms:
- CEMCOX3
- Cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 3
- Mitochondrial complex IV deficiency, nuclear type 9
- MC4DN9
- COA5 fatal infantile encephalocardiomyopathy
- C2orf64 deficiency
description: >
  COA5-related fatal infantile cardioencephalomyopathy (CEMCOX3; mitochondrial
  complex IV deficiency nuclear type 9, MC4DN9) is an ultra-rare autosomal
  recessive nuclear form of isolated cytochrome c oxidase (COX, Complex IV)
  deficiency caused by biallelic variants in COA5 (formerly C2orf64), the human
  orthologue of yeast Pet191. COA5 is a small twin-CX9C Complex IV assembly
  factor that acts at an early stage of holoenzyme biogenesis: patient cells
  accumulate an MTCO1-containing subassembly that fails to incorporate MTCO2, so
  the fully assembled holoenzyme is lost while the other respiratory-chain
  complexes are spared. Every patient reported to date is homozygous for the same
  missense allele, c.157G>C (p.Ala53Pro), and both reported families are of
  Turkish descent, raising the possibility of a founder allele. The presentation
  is cardiac-dominant and neonatal: hypertrophic cardiomyopathy with septal
  hypertrophy and a non-compaction appearance of the myocardium, elevated blood
  and urinary lactate, abnormal liver function tests, and death within the first
  months of life. Despite the "cardioencephalomyopathy" in the disease name,
  documented central nervous system involvement is limited - neuroimaging was
  normal in the one patient in whom it is reported - and this entry records that
  discrepancy rather than importing encephalopathy claims from the wider Complex
  IV deficiency literature. The entry conforms to the conserved Complex IV
  assembly/biogenesis-deficiency mechanism, with the lesion localized to the
  MTCO1-to-MTCO2 transition of early assembly.

- name: Trio whole-exome sequencing with mitochondrial genome analysis
  description: >-
    Molecular confirmation requires demonstrating biallelic COA5 variants.
    Because the clinical and biochemical picture overlaps primary mtDNA disease,
    complete mtDNA analysis is done alongside or before nuclear sequencing; in
    the reported patient it was negative, and trio exome sequencing then

name: Epilepsy with Generalized Tonic-Clonic Seizures Alone
creation_date: "2026-08-09T00:00:00Z"
category: Complex
description: >-
  Epilepsy with generalized tonic-clonic seizures alone (EGTCA) is the fourth of
  the four idiopathic generalized epilepsy syndromes recognized by the ILAE,
  alongside childhood absence epilepsy, juvenile absence epilepsy, and juvenile
  myoclonic epilepsy. It is defined negatively as much as positively: generalized
  tonic-clonic seizures are the sole seizure type, and the presence of absence or
  myoclonic seizures moves the diagnosis to one of the sibling syndromes. Onset is
  typically in the second decade. Seizures cluster shortly after awakening,
  independent of clock time, which is why the syndrome was historically called
  awakening epilepsy or grand mal on awakening, and sleep deprivation is the
  best-documented precipitant. The EEG background is normal and carries
  generalized spike-wave and polyspike-wave discharges; neuroimaging shows no
  lesion. The mechanism is a heritable, polygenic cortico-thalamocortical
  hyperexcitability whose seizure output is gated by sleep-wake state.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - EGTCA
  - EGTCSA
  - epilepsy with generalized tonic-clonic seizures alone
  - epilepsy with grand mal on awakening
  - awakening epilepsy
  - Aufwach-Epilepsie

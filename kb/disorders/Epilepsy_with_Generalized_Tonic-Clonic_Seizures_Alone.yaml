notes: >-
  Scope note. This entry completes the ILAE idiopathic generalized epilepsy
  tetrad in the knowledge base, joining the existing Childhood_Absence_Epilepsy,
  Juvenile_Absence_Epilepsy, and Juvenile_Myoclonic_Epilepsy entries. EGTCA is
  defined partly by exclusion, so the entry deliberately curates the *absence* of
  absence and myoclonic seizures as a diagnostic boundary rather than silently
  omitting them.

  Evidence-level note. Most genomic and network-physiology evidence in the
  literature is at the level of the idiopathic/genetic generalized epilepsy class
  rather than EGTCA specifically. Where a claim rests on class-level rather than
  syndrome-level data, the evidence item is marked PARTIAL and the explanation
  says so. The one place this is unusually well documented is the GWAS: the 2023
  ILAE meta-analysis stratified by IGE subtype and found no genome-wide
  significant locus for EGTCA, which is curated here as a positive statement
  about sample size and polygenicity rather than quietly generalized from the
  pooled result.

  Module conformance note. Five nodes declare conformance to
  epilepsy_excitation_inhibition_imbalance. The EGTCA graph adds a state-gating
  arm the generic module does not carry: sleep-wake transition physiology acts as
  a modulator on the hyperexcitable network rather than as a step in the causal
  chain from channel lesion to seizure. That arm is modeled as its own node with
  an edge into seizure generation, because the circadian clustering is the single
  most distinctive clinical feature of this syndrome and collapsing it into the
  generic chain would lose it.

  Dataset note. This entry deliberately carries no `datasets:` block. Dataset
  discovery was run and returned twelve candidates, none of which survived
  relevance triage: the CLCN2-keyed hits are about corn snake skin pigmentation,
  familial hyperaldosteronism, leukodystrophy, and retinal degeneration, because
  CLCN2 is famous for diseases other than this one; the name-keyed hits are
  audiogenic-seizure rodent strains, an HCN1 mouse developmental and epileptic
  encephalopathy, a temporal lobe epilepsy model, and, via the historical synonym
  "grand mal epilepsy", an autism blood-expression study. Every one of those
  accessions resolves perfectly and would have passed the automated verifier, so
  the exclusion is a curatorial judgement rather than a tooling result. No omics
  dataset specific to EGTCA was identified.

  Drug-aggravation caveat. The blanket "avoid sodium channel blockers in IGE"
  teaching is weaker for EGTCA than for its sibling syndromes, and the entry says
  so rather than repeating the generalization. The primary aggravation evidence
  concerns myoclonic and absence seizures, which EGTCA patients do not have by
  definition; in the oxcarbazepine series the effect on generalized tonic-clonic
  seizures was explicitly described as less dramatic. This is recorded as an open
  discussion rather than resolved in either direction.
inheritance:
  - name: Polygenic susceptibility
    description: >-
      EGTCA is heritable but not Mendelian. Liability is distributed across many
      common variants of small effect together with rarer variants in ion channel
      and neurotransmitter receptor genes shared across the idiopathic generalized
      epilepsies. Relatives of an EGTCA proband who are affected typically have
      some other generalized epilepsy phenotype rather than EGTCA itself, which is
      the expected behavior of a shared polygenic liability rather than
      syndrome-specific transmission. Routine single-gene testing is
      correspondingly not part of clinical evaluation.
    inheritance_term:
      preferred_term: Polygenic inheritance
      term:
        id: HP:0010982
        label: Polygenic inheritance
    evidence:
      - reference: PMID:37653029
        reference_title: >-
          GWAS meta-analysis of over 29,000 people with epilepsy identifies 26
          risk loci and subtype-specific genetic architecture.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          suggesting that the signals are primarily driven by polygenicity
        explanation: >-
          The consortium's own reading of its linkage-disequilibrium score
          regression intercepts is that the generalized epilepsy association
          signal is polygenic rather than driven by a few large-effect loci, which
          is the architecture this inheritance block asserts.
      - reference: PMID:19191339
        reference_title: >-
          Two novel CLCN2 mutations accelerating chloride channel deactivation are
          associated with idiopathic generalized epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, the incomplete segregation of the mutations among affected
          members and the transmission by unaffected parents suggests that these
          CLCN2 mutations alone are not sufficient to induce epilepsy.
        explanation: >-
          A worked demonstration of non-Mendelian behavior in the leading
          candidate gene: variants that do not segregate with disease and are
          transmitted by unaffected parents are susceptibility factors, not
          causative alleles.
pathophysiology:
  - name: Polygenic Susceptibility to Generalized Epilepsy
    biological_scale: MOLECULAR
    role: trigger
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
    description: >-
      Susceptibility is conferred by many common variants of individually small
      effect together with rarer variants in genes encoding neuronal ion channels
      and neurotransmitter receptors, in particular voltage-gated calcium and
      chloride channels and GABA-A receptor subunits. No single gene is necessary
      or sufficient. The net effect is a lowered seizure threshold in
      cortico-thalamocortical circuits rather than a discrete molecular lesion,
      which is why the node is a distributed liability rather than a named
      mutation.
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: Regulation of Membrane Potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
      - preferred_term: Chemical Synaptic Transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
    downstream:
      - target: Cortico-Thalamocortical Excitation-Inhibition Imbalance
    evidence:
      - reference: PMID:37653029
        reference_title: >-
          GWAS meta-analysis of over 29,000 people with epilepsy identifies 26
          risk loci and subtype-specific genetic architecture.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our 'GGE' meta-analysis uncovered a total of 25 independent genome-wide
          significant signals across 22 loci, of which 13 loci are new.
        explanation: >-
          Establishes a many-loci common-variant architecture for genetic
          generalized epilepsy, the class to which EGTCA belongs, which is the
          distributed liability this node models.
      - reference: PMID:37653029
        reference_title: >-
          GWAS meta-analysis of over 29,000 people with epilepsy identifies 26
          risk loci and subtype-specific genetic architecture.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We did not find any genome-wide significant loci for JAE (n = 671),
          GTCSA (n = 499)
        explanation: >-
          The syndrome-stratified analysis found no EGTCA-specific locus at the
          available sample size. Marked PARTIAL because this is an absence of
          evidence at n = 499 rather than evidence that no such locus exists; it
          supports the polygenic framing while bounding how confidently any
          particular gene can be attached to this syndrome.
  - name: Cortico-Thalamocortical Excitation-Inhibition Imbalance
    biological_scale: CELLULAR
    role: amplifier
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    description: >-
      The susceptibility alleles shift the balance between glutamatergic
      excitation and GABAergic inhibition within reciprocally connected cortical
      and thalamic populations toward net excitation. The thalamic reticular
      nucleus, whose GABAergic output paces thalamocortical relay neurons, is the
      inhibitory element whose dysfunction is most consistently implicated across
      the idiopathic generalized epilepsies.
    cell_types:
      - preferred_term: GABAergic Neuron
        term:
          id: CL:0000617
          label: GABAergic neuron
      - preferred_term: Thalamic Relay Neuron
        term:
          id: CL:4023068
          label: thalamic excitatory neuron
    biological_processes:
      - preferred_term: GABA Signaling Pathway
        term:
          id: GO:0007214
          label: gamma-aminobutyric acid signaling pathway
        modifier: ABNORMAL
    locations:
      - preferred_term: Thalamic Reticular Nucleus
        term:
          id: UBERON:0001903
          label: thalamic reticular nucleus
      - preferred_term: Cerebral Cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
    downstream:
      - target: Generalized Hypersynchronous Discharge
    evidence:
      - reference: PMID:28752060
        reference_title: >-
          Sleep onset uncovers thalamic abnormalities in patients with idiopathic
          generalised epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          As interactions between thalamic sub-regions are indirect and mediated
          by the inhibitory thalamic reticular nucleus (TRN), the results suggest
          abnormal TRN function in patients with IGE
        explanation: >-
          Human EEG-fMRI evidence implicating the inhibitory thalamic reticular
          nucleus in idiopathic generalized epilepsy. Marked PARTIAL because the
          cohort is IGE-wide rather than EGTCA-specific, and because the TRN
          inference is indirect, drawn from intra-thalamic connectivity rather
          than measured directly.
      - reference: PMID:38165295
        reference_title: >-
          Idiopathic Generalized Epilepsy: Misunderstandings, Challenges, and
          Opportunities.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Genetic, electrophysiologic, and neuroimaging studies provide insights
          into pathophysiology, including overlaps and differences from focal
          epilepsies.
        explanation: >-
          Supports a network-level rather than lesional pathophysiology for the
          IGE class. Marked PARTIAL, and evidence_source OTHER, because this is a
          review synthesizing across syndromes rather than primary EGTCA data.
  - name: Generalized Hypersynchronous Discharge
    biological_scale: TISSUE
    role: intermediate
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Net excitatory bias permits large populations of cortical and thalamic
      neurons to fire in phase, producing the bilaterally synchronous generalized
      spike-wave and polyspike-wave discharges that are the electrographic
      signature of the syndrome. Between discharges the background is normal,
      which is what separates this from the encephalopathic generalized
      epilepsies.
    cell_types:
      - preferred_term: Cortical Pyramidal Neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
      - preferred_term: Corticothalamic Projection Neuron
        term:
          id: CL:4023013
          label: corticothalamic-projecting glutamatergic cortical neuron
    biological_processes:
      - preferred_term: Regulation of Membrane Potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Recruitment of Motor Systems into Tonic-Clonic Output
    evidence:
      - reference: PMID:21269293
        reference_title: Functional connectivity in patients with idiopathic generalized epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although GSWDs are the result of highly synchronized activity in the
          thalamocortical network, EEG without GSWDs is believed to represent
          normal brain activity.
        explanation: >-
          States both halves of this node's claim: the discharges reflect highly
          synchronized thalamocortical activity, and the network is otherwise
          normal between them. Marked PARTIAL because the study population is
          IGE-wide rather than EGTCA-specific.
      - reference: PMID:21269293
        reference_title: Functional connectivity in patients with idiopathic generalized epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The results underscore the paroxysmal nature of GSWDs: Although GSWDs
          are characterized by highly synchronized activity in the thalamocortical
          network, the functional connectivity in areas involved during GSWDs does
          not demonstrate abnormality in GSWD-free periods.
        explanation: >-
          Supports modeling the hypersynchrony as a paroxysmal event on an
          otherwise normal network rather than a continuously abnormal state,
          which is why this node sits downstream of a susceptibility node rather
          than describing a persistent lesion.
  - name: Sleep-Wake State Gating of Seizure Threshold
    biological_scale: ORGANISM
    role: modulator
    description: >-
      The distinctive feature of EGTCA is not that seizures occur but when. The
      transition out of sleep, and sleep deprivation preceding it, transiently
      lower the threshold at which the hyperexcitable network converts into a
      clinical seizure, concentrating seizures in the hour or two after awakening
      independent of clock time. This node is deliberately modeled as a modulator
      acting on seizure generation rather than as a step in the causal chain,
      because it changes the probability and timing of the output without being
      required to produce it.
    biological_processes:
      - preferred_term: Circadian Sleep/Wake Cycle
        term:
          id: GO:0042745
          label: circadian sleep/wake cycle
        modifier: ABNORMAL
    downstream:
      - target: Recruitment of Motor Systems into Tonic-Clonic Output
    evidence:
      - reference: PMID:10996562
        reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Awakening epilepsy (AE) is an age related syndrome of idiopathic
          generalized epilepsy (IGE) characterized by generalized tonic clonic
          seizures (GTCS) occurring predominantly on awakening (independent of the
          time of day) or at leisure time (almost at evening).
        explanation: >-
          The defining description of the awakening-linked seizure timing by the
          clinician who delineated the syndrome, and the basis for treating
          sleep-wake state as a distinct modulating input.
      - reference: PMID:10996562
        reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The common denominator of external seizures precipitating influences is
          lack of sleep.
        explanation: >-
          Identifies sleep deprivation as the unifying precipitant, which is the
          threshold-lowering mechanism this node asserts.
      - reference: PMID:24632482
        reference_title: Seizure precipitants (triggering factors) in patients with epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients with idiopathic generalized epilepsy seemed to be more
          sensitive to seizures during awakening and sleep deprivation
        explanation: >-
          Independent clinic-cohort confirmation that awakening and sleep
          deprivation are differentially potent precipitants in idiopathic
          generalized epilepsy. Marked PARTIAL because the comparison is across
          broad epilepsy categories rather than within EGTCA, and the authors
          themselves hedge with "seemed to be".
  - name: Recruitment of Motor Systems into Tonic-Clonic Output
    biological_scale: ORGANISM
    role: consequence
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
    description: >-
      When hypersynchronous activity crosses the threshold at which it recruits
      motor cortex and brainstem tonic and clonic generators, the clinical output
      is a generalized tonic-clonic seizure rather than the behavioral arrest of
      an absence or the brief jerk of a myoclonic seizure. Why the same class of
      network abnormality produces convulsive output alone in this syndrome, and
      absence or myoclonus in its siblings, is not established; it is curated here
      as a difference in network engagement rather than a distinct etiology, and
      the uncertainty is recorded as an explicit knowledge gap.
    biological_processes:
      - preferred_term: Chemical Synaptic Transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
    downstream:
      - target: Recurrent Unprovoked Generalized Tonic-Clonic Seizures
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The goal of this paper is to delineate the four syndromes comprising the
          IGEs, namely childhood absence epilepsy, juvenile absence epilepsy,
          juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic
          seizures alone.
        explanation: >-
          Establishes EGTCA as a distinct ILAE syndrome whose seizure output
          differs from its siblings despite a shared mechanism class. Evidence
          source is OTHER because this is an expert-consensus position statement
          rather than a primary study.
  - name: Recurrent Unprovoked Generalized Tonic-Clonic Seizures
    biological_scale: ORGANISM
    role: outcome
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The established clinical disease: recurrent unprovoked generalized
      tonic-clonic seizures with no other seizure type, normal cognition, and
      normal imaging. Seizures are typically infrequent, respond well to
      antiseizure medication, and carry the injury and sudden-death risk inherent
      to convulsive seizures rather than the cognitive burden of the
      encephalopathic epilepsies.
    downstream:
      - target: Seizure-Related Injury
    evidence:
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A GTC recurred in 14% of patients treated with ASM compared with 73% of
          untreated patients (p < 0.00001).
        explanation: >-
          Establishes that untreated EGTCA is a recurrent seizure disorder in the
          large majority of patients, and that treatment substantially changes
          that, in a prospective cohort diagnosed by explicit ILAE criteria.
  - name: Seizure-Related Injury
    biological_scale: ORGANISM
    role: consequence
    description: >-
      Because every seizure in this syndrome is convulsive by definition, the
      morbidity is dominated by physical injury sustained during the seizure
      rather than by interictal cognitive impairment. This is the mechanistic
      reason the syndrome is not benign despite low seizure frequency and good
      treatment response.
    evidence:
      - reference: PMID:32030724
        reference_title: >-
          Tonic-clonic seizures in idiopathic generalized epilepsies: Prevalence,
          risk factors, and outcome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Generalized tonic-clonic seizures were significantly associated with
          experiencing seizure-related injuries.
        explanation: >-
          Directly links the convulsive seizure type, which is the only seizure
          type in EGTCA, to injury risk within an idiopathic generalized epilepsy
          cohort.
phenotypes:
  - category: Neurological
    name: Generalized Tonic-Clonic Seizures
    frequency: OBLIGATE
    description: >-
      Generalized tonic-clonic seizures are the defining and, by diagnostic
      definition, the only seizure type. Onset is typically in the second decade,
      with a median age at onset of 16 to 18 years across cohorts. Seizures are
      usually infrequent compared with the daily absences of childhood absence
      epilepsy or the frequent myoclonus of juvenile myoclonic epilepsy.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure
      term:
        id: HP:0002069
        label: Bilateral tonic-clonic seizure
      onset:
        onset_category: JUVENILE
        mean_age_years: 16.0
        notes: >-
          Median age at onset 16 years in a prospective ILAE-criteria cohort and
          18 years in a long-follow-up adolescent-onset cohort, with onset
          characteristically in the second decade.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic
          seizures alone
        explanation: >-
          The syndrome name itself asserts generalized tonic-clonic seizures as
          the sole seizure type, which is the basis for the OBLIGATE frequency.
          Evidence source is OTHER because this is a consensus position statement.
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Eighty-nine patients with a median age of 16 years were included,
          constituting 31% of those diagnosed with an idiopathic generalized
          epilepsy.
        explanation: >-
          Provides the median age at onset in a cohort assembled against mandatory
          ILAE criteria for EGTCA.
  - category: Neurological
    name: Seizure Clustering After Awakening
    frequency: FREQUENT
    description: >-
      Seizures occur predominantly within one to two hours of awakening,
      independent of the time of day, with a secondary evening peak during
      relaxation. This circadian signature is the historical basis for the names
      awakening epilepsy and grand mal on awakening. A minority of patients have
      exclusively nocturnal seizures, and a mixed diurnal-nocturnal pattern
      carries prognostic weight.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure
      term:
        id: HP:0002069
        label: Bilateral tonic-clonic seizure
      temporality: RECURRENT
    evidence:
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Regarding the circadian distribution of seizures, 59.6% of patients
          exclusively experienced diurnal seizures, 12.4% exclusively nocturnal,
          and 28.1% experienced both diurnal and nocturnal seizures.
        explanation: >-
          Quantifies the circadian distribution in an EGTCA cohort. The 59.6%
          exclusively diurnal figure falls in the 30-79% band and is the basis for
          the FREQUENT frequency qualifier.
      - reference: PMID:10996562
        reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          generalized tonic clonic seizures (GTCS) occurring predominantly on
          awakening (independent of the time of day) or at leisure time (almost at
          evening)
        explanation: >-
          Establishes the awakening-linked timing and the secondary evening peak,
          and specifically that the timing tracks awakening rather than clock
          time.
  - category: Electrophysiological
    name: Generalized Spike-Wave and Polyspike-Wave Discharges
    frequency: VERY_FREQUENT
    diagnostic: true
    description: >-
      The interictal EEG shows bilaterally synchronous generalized spike-wave and
      polyspike-wave discharges on a normal background. Discharges were present on
      the very first EEG in 88% of patients in a prospective cohort using
      sleep-deprived recordings. Slow spike-wave below 2.5 Hz is not part of this
      syndrome and its presence should prompt reconsideration of the diagnosis.
    phenotype_term:
      preferred_term: EEG with spike-wave complexes
      term:
        id: HP:0010850
        label: EEG with spike-wave complexes
    evidence:
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Generalized spike-wave discharges (GSWD) were present in the initial EEG
          of 88% of patients.
        explanation: >-
          Directly quantifies generalized spike-wave discharges in an EGTCA
          cohort. 88% falls in the 80-100% band supporting VERY_FREQUENT.
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          with 2.5-5.5 Hz generalized spike-wave
        explanation: >-
          Gives the ILAE frequency band for the generalized spike-wave activity
          expected across this syndrome group. Marked PARTIAL because the sentence
          it comes from defines the residual genetic generalized epilepsy category
          rather than EGTCA specifically, though the same discharge band applies.
  - category: Electrophysiological
    name: Photoparoxysmal EEG Response
    frequency: OCCASIONAL
    description: >-
      A photoparoxysmal response to intermittent photic stimulation is present in
      a minority of patients, more often than in the general epilepsy population
      but less often than in juvenile myoclonic epilepsy. It is one route by which
      photic stimulation acts as a seizure precipitant.
    phenotype_term:
      preferred_term: EEG with photoparoxysmal response
      term:
        id: HP:0010852
        label: EEG with photoparoxysmal response
    evidence:
      - reference: PMID:11442158
        reference_title: >-
          Photosensitivity in relation to epileptic syndromes: asurvey from an
          epilepsy center in Japan.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PPR accounted for 17.4% (p < 0.01) of the patients with juvenile
          myoclonic epilepsy, 7.6% (p < 0.01) of those with grand mal on
          awakening, and 6.1% (p < 0.01) of those with symptomatic occipital lobe
          epilepsy.
        explanation: >-
          Gives a syndrome-specific photoparoxysmal response rate for grand mal on
          awakening, the historical name for EGTCA. The 7.6% figure falls in the
          5-29% band supporting OCCASIONAL, and the same sentence shows the rate
          is roughly half that of juvenile myoclonic epilepsy.
  - category: Neurological
    name: Normal Interictal Neurological and Cognitive Status
    frequency: VERY_FREQUENT
    description: >-
      Development, neurological examination, and global cognition are normal, and
      the EEG background is normal between discharges. This is a defining negative
      feature separating the idiopathic generalized epilepsies from the
      developmental and epileptic encephalopathies, and it is curated explicitly
      because its absence should trigger a search for an alternative diagnosis.
      Subtle executive and attentional differences are described across the IGE
      class but are not part of the syndrome definition.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure
      term:
        id: HP:0002069
        label: Bilateral tonic-clonic seizure
    notes: >-
      The phenotype_term binding here is imperfect. HPO has no positive term for
      "normal interictal status", so the descriptor reuses the syndrome's seizure
      term and the substantive claim lives in the description. Recorded rather
      than papered over.
    evidence:
      - reference: PMID:38165295
        reference_title: >-
          Idiopathic Generalized Epilepsy: Misunderstandings, Challenges, and
          Opportunities.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Emerging evidence reveals that patients with IGE may go undiagnosed or
          misdiagnosed with focal epilepsy if EEG or semiology have asymmetric or
          focal features.
        explanation: >-
          Supports the diagnostic importance of the expected normal, symmetric,
          non-focal picture by describing what happens when it is departed from.
          Marked PARTIAL because it evidences the diagnostic consequence rather
          than directly quantifying normal cognition, and evidence_source is OTHER
          because this is a review.
  - category: Neurological
    name: Absence of Absence and Myoclonic Seizures
    frequency: OBLIGATE
    diagnostic: true
    description: >-
      The defining exclusion. Patients have no absence seizures and no myoclonic
      jerks; their presence reclassifies the patient as juvenile absence epilepsy,
      juvenile myoclonic epilepsy, childhood absence epilepsy, or unclassified
      genetic generalized epilepsy. This negative criterion is curated as an
      explicit phenotype rather than left implicit because it is what makes EGTCA
      a separate entity, and because it is what makes the sodium-channel-blocker
      aggravation literature apply differently here than in the sibling syndromes.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure
      term:
        id: HP:0002069
        label: Bilateral tonic-clonic seizure
    notes: >-
      As with the normal-status node, HPO offers no term for the absence of a
      phenotype, so the descriptor reuses the syndrome's seizure term and the
      exclusion is carried in the description.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Patients that do not fulfill criteria for one of these syndromes, but
          that have one, or a combination, of the following generalized seizure
          types: absence, myoclonic, tonic-clonic and myoclonic-tonic-clonic
          seizures, with 2.5-5.5 Hz generalized spike-wave should be classified as
          having GGE.
        explanation: >-
          Establishes that seizure-type combination is what partitions this
          syndrome group, and that patients falling outside the four defined
          syndromes go to the residual GGE category rather than into EGTCA.
          Evidence source is OTHER because this is a consensus position statement.
genetic:
  - name: CLCN2
    relationship_type: SUSCEPTIBILITY
    gene_term:
      preferred_term: CLCN2
      term:
        id: hgnc:2020
        label: CLCN2
    notes: >-
      CLCN2 encodes the voltage-gated chloride channel ClC-2 and is the most
      frequently discussed candidate gene in the idiopathic generalized epilepsy
      literature, including generalized tonic-clonic phenotypes. Its role is
      genuinely contested and is curated as susceptibility rather than causation:
      identified missense variants accelerate channel deactivation, but they fail
      to segregate with disease and are transmitted by unaffected parents, and an
      independent screening series found no definite mutations. An early
      CLCN2-epilepsy report was subsequently retracted. This entry cites the gene
      as a susceptibility factor with the disconfirming evidence attached rather
      than omitting it.
    evidence:
      - reference: PMID:19191339
        reference_title: >-
          Two novel CLCN2 mutations accelerating chloride channel deactivation are
          associated with idiopathic generalized epilepsy.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: >-
          Functional characterization of mutant channels using heterologous
          expression in mammalian cells and whole-cell patch-clamp recordings
          revealed faster deactivation kinetics as the major phenotype of both
          missense mutations.
        explanation: >-
          Establishes a measured functional consequence for the candidate
          variants. Marked PARTIAL and IN_VITRO because the electrophysiology was
          done in a heterologous expression system and demonstrates an altered
          channel property, not a contribution to human EGTCA.
      - reference: PMID:19191339
        reference_title: >-
          Two novel CLCN2 mutations accelerating chloride channel deactivation are
          associated with idiopathic generalized epilepsy.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          They may instead represent susceptibility factors among other so far
          undetected genetic alterations in the respective families.
        explanation: >-
          The authors' own conclusion refutes a causative reading of these
          variants and supports the SUSCEPTIBILITY typing used here.
      - reference: PMID:16932951
        reference_title: >-
          Mutations in the CLCN2 gene are a rare cause of idiopathic generalized
          epilepsy syndromes.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We conclude that mutations in the CLCN2 gene are only a rare cause of
          idiopathic generalized epilepsy.
        explanation: >-
          An independent screening series that found no definite mutations,
          bounding how much of the syndrome CLCN2 can explain.
environmental:
  - name: Sleep deprivation
    description: >-
      Insufficient or irregular sleep is the best-documented precipitant of
      seizures in this syndrome and the practical target of lifestyle counseling.
      It acts by transiently lowering seizure threshold in an already
      hyperexcitable network rather than by causing the underlying epilepsy.
    influences_mechanisms:
      - target: Sleep-Wake State Gating of Seizure Threshold
        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: >-
          Sleep loss is the unifying external precipitant across awakening
          epilepsy, acting on the sleep-wake state modulation of seizure
          threshold.
        evidence:
          - reference: PMID:10996562
            reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              The common denominator of external seizures precipitating
              influences is lack of sleep.
            explanation: >-
              Names sleep loss as the common denominator among precipitating
              influences in this syndrome, which is the exacerbating edge asserted
              here.
    evidence:
      - reference: PMID:24632482
        reference_title: Seizure precipitants (triggering factors) in patients with epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of 104 patients, 97% cited at least one precipitant. Stress, sleep
          deprivation, and fatigue were the most frequently reported precipitants.
        explanation: >-
          Establishes sleep deprivation among the most commonly reported seizure
          precipitants in an epilepsy clinic population.
  - name: Habitual late and unstable sleep pattern
    description: >-
      Beyond acute sleep loss, patients with awakening epilepsy have been
      characterized as late sleepers and late risers whose habitual schedule
      predisposes to chronic sleep debt, with polygraphic evidence of less stable
      sleep. This is a chronic predisposing exposure distinct from an acute
      precipitant, which is why it is typed PREDISPOSES rather than EXACERBATES.
    influences_mechanisms:
      - target: Sleep-Wake State Gating of Seizure Threshold
        environmental_effect: PREDISPOSES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          A habitually late and unstable sleep schedule maintains a chronic sleep
          deficit that keeps the state-gated seizure threshold persistently lower.
        evidence:
          - reference: PMID:10996562
            reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              The sleep habits of patients with AE who could roughly be
              characterized as late sleepers and late risers may dispose them to a
              chronic sleep deficit.
            explanation: >-
              Directly asserts the predisposing role of habitual sleep timing,
              hedged by the source's own "may dispose", which the PREDISPOSES
              typing preserves.
treatments:
  - name: Valproate
    description: >-
      Sodium valproate is the most effective single agent for generalized
      tonic-clonic seizures in the idiopathic generalized epilepsies and remains
      the comparator against which alternatives are judged. In a randomized
      non-inferiority trial in newly diagnosed generalized and unclassifiable
      epilepsy, levetiracetam failed to demonstrate non-inferiority to valproate.
      Its use is constrained by teratogenicity, so it is avoided in people of
      childbearing potential where an alternative is viable, and that trade-off is
      a shared decision rather than an automatic exclusion.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
    target_mechanisms:
      - target: Recurrent Unprovoked Generalized Tonic-Clonic Seizures
        treatment_effect: INHIBITS
        description: >-
          Valproate suppresses the clinical seizure output rather than correcting
          the underlying polygenic susceptibility, which is why relapse is common
          on withdrawal.
        evidence:
          - reference: PMID:32030724
            reference_title: >-
              Tonic-clonic seizures in idiopathic generalized epilepsies:
              Prevalence, risk factors, and outcome.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Valproate reduced the risk of experiencing GTCSs significantly (OR:
              0.58; 95% CI: 0.34-0.99; P = .04).
            explanation: >-
              Quantifies the reduction in generalized tonic-clonic seizure risk
              attributable to valproate within an idiopathic generalized epilepsy
              cohort.
    evidence:
      - reference: PMID:33838758
        reference_title: >-
          The SANAD II study of the effectiveness and cost-effectiveness of
          valproate versus levetiracetam for newly diagnosed generalised and
          unclassifiable epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Levetiracetam did not meet the criteria for non-inferiority in the ITT
          analysis of time to 12-month remission
        explanation: >-
          Randomized trial evidence that the leading alternative failed to match
          valproate, which is the basis for retaining valproate as the reference
          first-line agent.
      - reference: PMID:33838758
        reference_title: >-
          The SANAD II study of the effectiveness and cost-effectiveness of
          valproate versus levetiracetam for newly diagnosed generalised and
          unclassifiable epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Valproate is a first-line treatment for patients with newly diagnosed
          idiopathic generalised or difficult to classify epilepsy, but not for
          women of child-bearing potential because of teratogenicity.
        explanation: >-
          States the teratogenicity constraint that governs prescribing. Marked
          PARTIAL because this is the trial's background framing rather than a
          teratogenicity result generated by the trial itself.
  - name: Levetiracetam
    description: >-
      Levetiracetam is the most commonly used alternative to valproate and is
      preferred in people of childbearing potential because of its substantially
      lower teratogenic risk. The honest framing is that this is a trade-off
      rather than an equivalence: SANAD II found levetiracetam neither
      non-inferior nor cost-effective against valproate, so the choice buys
      reproductive safety at some cost in seizure control.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Recurrent Unprovoked Generalized Tonic-Clonic Seizures
        treatment_effect: INHIBITS
        description: >-
          Suppression of clinical seizure output, with the same
          non-disease-modifying caveat as valproate.
        evidence:
          - reference: PMID:38819591
            reference_title: >-
              Prospective study of epilepsy with generalized tonic-clonic seizures
              alone: Clinical features, response to treatment, and likelihood of
              medication withdrawal.
            supports: PARTIAL
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              A GTC recurred in 14% of patients treated with ASM compared with 73%
              of untreated patients (p < 0.00001).
            explanation: >-
              Demonstrates that antiseizure medication as a class suppresses
              seizure recurrence in EGTCA specifically. Marked PARTIAL because the
              comparison is treated versus untreated rather than
              levetiracetam-specific.
    evidence:
      - reference: PMID:33838758
        reference_title: >-
          The SANAD II study of the effectiveness and cost-effectiveness of
          valproate versus levetiracetam for newly diagnosed generalised and
          unclassifiable epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          For girls and women of child-bearing potential, these results inform
          discussions about benefit and harm of avoiding valproate.
        explanation: >-
          Frames the levetiracetam choice as a benefit-harm discussion rather than
          a straightforward substitution. Marked PARTIAL because it supports the
          decision framing rather than establishing levetiracetam efficacy.
  - name: Lamotrigine
    description: >-
      Lamotrigine is an alternative broad-spectrum option for generalized
      tonic-clonic seizures with low teratogenic risk, requiring slow titration
      because of rash risk and dose adjustment when combined with valproate, which
      inhibits its metabolism.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: lamotrigine
          term:
            id: CHEBI:6367
            label: lamotrigine
    notes: >-
      No EGTCA-specific efficacy trial was identified for lamotrigine during
      curation, so this treatment carries a description and an agent binding but
      no evidence item asserting syndrome-level efficacy. Recorded as a curation
      gap rather than propped up with a citation that does not make the claim.
  - name: Sleep hygiene and precipitant avoidance counseling
    description: >-
      Regularizing sleep schedule, avoiding sleep deprivation, and moderating
      alcohol are the non-pharmacological cornerstone of management, and follow
      directly from the syndrome's defining sensitivity to sleep-wake state. This
      is the one intervention that acts on the modulating input rather than on the
      seizure output.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Sleep-Wake State Gating of Seizure Threshold
        treatment_effect: INHIBITS
        description: >-
          Removing the precipitant removes the transient threshold reduction that
          converts a hyperexcitable network into a clinical seizure.
        evidence:
          - reference: PMID:10996562
            reference_title: Epilepsy with grand mal on awakening and sleep-waking cycle.
            supports: PARTIAL
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              The common denominator of external seizures precipitating
              influences is lack of sleep.
            explanation: >-
              Identifies the modifiable precipitant that this intervention
              targets. Marked PARTIAL because no trial evidence was identified
              showing that counseling changes seizure outcomes in EGTCA.
progression:
  - phase: Early treatment response
    age_range: Adolescence to young adulthood
    notes: >-
      EGTCA is among the more manageable idiopathic generalized epilepsies. Most
      patients respond promptly to antiseizure medication and drug resistance is
      uncommon, but a substantial minority follow a relapsing-remitting course
      rather than a clean remission, so the syndrome should not be described as
      uniformly benign.
    evidence:
      - reference: PMID:37872695
        reference_title: >-
          Epilepsy with generalized tonic-clonic seizures alone: Electroclinical
          features and prognostic patterns.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          GTCA could be considered a relatively easily manageable IGE syndrome,
          with a low rate of drug resistance and a high prevalence of early
          response to treatment.
        explanation: >-
          Multicenter confirmation of the favorable treatment-response profile in
          a cohort defined by the 2022 ILAE criteria.
      - reference: PMID:37872695
        reference_title: >-
          Epilepsy with generalized tonic-clonic seizures alone: Electroclinical
          features and prognostic patterns.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Nevertheless, a considerable proportion of patients experience relapsing
          patterns of seizure control, highlighting the need for appropriate
          counseling and lifestyle recommendations.
        explanation: >-
          Bounds the favorable framing by documenting the relapsing-remitting
          subgroup.
  - phase: Attempted medication withdrawal
    age_range: Young adulthood onward
    notes: >-
      Lifelong treatment is not always necessary, but relapse after withdrawal is
      frequent enough that how and when withdrawal is attempted materially changes
      the outcome. Patient-initiated tapering and a mixed diurnal-nocturnal
      seizure pattern independently predict recurrence, while longer seizure
      freedom and absence of generalized spike-wave on EEG favor success. The
      circadian predictor links prognosis directly back to the sleep-wake gating
      mechanism curated in the pathophysiology.
    evidence:
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          ASM discontinuation was attempted in 50 patients after a median
          treatment duration of 3 years, with 44% experiencing a recurrence.
        explanation: >-
          Quantifies relapse risk on withdrawal in an EGTCA-specific prospective
          cohort.
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patient-initiated taper and a mixed circadian seizure pattern
          independently predicted a higher likelihood of recurrence post-ASM
          discontinuation.
        explanation: >-
          Identifies the two independent predictors of relapse, including the
          circadian pattern that ties prognosis to the sleep-wake gating node.
  - phase: Long-term outcome
    age_range: Adulthood to late adulthood
    notes: >-
      Over decades of follow-up, long-term seizure outcome in EGTCA is very
      similar to that of the other adolescent-onset generalized genetic
      epilepsies, with most patients reaching terminal remission. Age at first
      seizure is the feature that most clearly separates EGTCA from juvenile
      absence and juvenile myoclonic epilepsy, being several years later.
    evidence:
      - reference: PMID:28464258
        reference_title: Long-term outcome in adolescent-onset generalized genetic epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Age at first seizure was significantly higher in EGTCS patients (median
          18 years) than in patients with JAE or JME (14 years each; p ≤ 0.001).
        explanation: >-
          Establishes the later onset of EGTCA relative to its sibling syndromes
          in a cohort with a median 42.5-year follow-up.
      - reference: PMID:28464258
        reference_title: Long-term outcome in adolescent-onset generalized genetic epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Long-term outcome was shown to be highly similar across all subsyndromes
          of adolescent-onset GGE.
        explanation: >-
          Supports curating long-term prognosis at the adolescent-onset GGE level
          rather than asserting an EGTCA-specific long-term trajectory.
prevalence:
  - population: Patients diagnosed with an idiopathic generalized epilepsy
    measure_type: POINT_PREVALENCE
    prevalence_class: UNKNOWN
    notes: >-
      Recorded as a share of idiopathic generalized epilepsy diagnoses rather than
      as a population rate. Reported proportions vary widely across cohorts and
      diagnostic eras, so no population rate is asserted here; the 31% figure is
      from a single prospective center applying mandatory ILAE criteria and should
      not be read as a general population estimate.
    evidence:
      - reference: PMID:38819591
        reference_title: >-
          Prospective study of epilepsy with generalized tonic-clonic seizures
          alone: Clinical features, response to treatment, and likelihood of
          medication withdrawal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Eighty-nine patients with a median age of 16 years were included,
          constituting 31% of those diagnosed with an idiopathic generalized
          epilepsy.
        explanation: >-
          Gives the syndrome's share of idiopathic generalized epilepsy diagnoses
          in a prospective multicenter cohort using mandatory ILAE criteria.
  - population: All epilepsies
    measure_type: POINT_PREVALENCE
    prevalence_class: UNKNOWN
    notes: >-
      Class-level context only. The idiopathic generalized epilepsies as a group
      account for roughly a fifth of all epilepsies; EGTCA is one of four
      syndromes within that fifth, and no reliable syndrome-level population rate
      was identified during curation.
    evidence:
      - reference: PMID:38165295
        reference_title: >-
          Idiopathic Generalized Epilepsy: Misunderstandings, Challenges, and
          Opportunities.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          The idiopathic generalized epilepsies (IGE) make up a fifth of all
          epilepsies, but <1% of epilepsy research.
        explanation: >-
          Establishes the class-level share of all epilepsies. Marked PARTIAL
          because it covers the four-syndrome group rather than EGTCA alone, and
          evidence_source is OTHER because this is a review.
differential_diagnoses:
  - name: Focal epilepsy with focal to bilateral tonic-clonic seizures
    description: >-
      The most consequential differential, because the two are treated
      differently. Focal epilepsy is distinguished by focal EEG onset, aura or
      focal semiology, and a structural lesion when one is present. The error runs
      in both directions: idiopathic generalized epilepsy is itself misdiagnosed
      as focal epilepsy when EEG or semiology carry asymmetric or focal features.
    evidence:
      - reference: PMID:38165295
        reference_title: >-
          Idiopathic Generalized Epilepsy: Misunderstandings, Challenges, and
          Opportunities.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Emerging evidence reveals that patients with IGE may go undiagnosed or
          misdiagnosed with focal epilepsy if EEG or semiology have asymmetric or
          focal features.
        explanation: >-
          Documents the misdiagnosis risk in the generalized-to-focal direction,
          which is the less commonly taught half of this differential. Evidence
          source is OTHER because this is a review.
  - name: Juvenile myoclonic epilepsy and juvenile absence epilepsy
    description: >-
      The sibling idiopathic generalized epilepsy syndromes, separated from EGTCA
      solely by the presence of myoclonic jerks or absence seizures. Because
      myoclonus may be underreported unless specifically asked about, the
      distinction depends on the quality of the history as much as on the EEG.
    evidence:
      - reference: PMID:35503716
        reference_title: >-
          ILAE definition of the Idiopathic Generalized Epilepsy Syndromes:
          Position statement by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The goal of this paper is to delineate the four syndromes comprising the
          IGEs, namely childhood absence epilepsy, juvenile absence epilepsy,
          juvenile myoclonic epilepsy, and epilepsy with generalized tonic-clonic
          seizures alone.
        explanation: >-
          Establishes the four syndromes as separate entities requiring
          differentiation from one another. Evidence source is OTHER because this
          is a consensus position statement.
  - name: Drug-resistant generalized epilepsy outside the IGE definition
    description: >-
      A meaningful proportion of patients who meet the 2022 IGE criteria on paper
      have refractory seizures or atypical features, and whether these lie inside
      the syndrome's spectrum or represent a distinct entity is unsettled. This
      matters for EGTCA because drug resistance is otherwise uncommon here, so a
      refractory course should prompt reconsideration rather than escalation
      alone.
    evidence:
      - reference: PMID:38508955
        reference_title: >-
          Drug-resistant generalized epilepsies: Revisiting the frontiers of
          idiopathic generalized epilepsies.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Indeed, among patients presenting with a syndrome compatible with the
          2022 definition of IGEs, we still observe a significant proportion of
          patients presenting with specific clinical features, refractory
          seizures, or drug-resistant epilepsies.
        explanation: >-
          Documents the boundary problem directly. Evidence source is OTHER
          because this is a review article.
discussions:
  - discussion_id: egtca_seizure_type_divergence
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does a shared cortico-thalamocortical mechanism produce generalized
      tonic-clonic seizures alone in EGTCA, but absence or myoclonic seizures in
      its sibling syndromes?
    attaches_to:
      - "pathophysiology#Recruitment of Motor Systems into Tonic-Clonic Output"
    rationale: >-
      The four idiopathic generalized epilepsy syndromes are curated as sharing a
      polygenic thalamocortical mechanism, yet they are separated clinically by
      seizure type alone. No mechanistic account was identified during curation
      that explains why the same class of network abnormality yields convulsive
      output alone here and absence or myoclonus elsewhere. The entry therefore
      asserts a difference in network engagement without specifying it, and this
      node is the honest location of that gap.
    proposed_experiments:
      - experiment_id: egtca_cross_syndrome_network_imaging
        name: Cross-syndrome ictal network comparison
        description: >-
          Compare ictal and interictal network dynamics across EGTCA, juvenile
          absence epilepsy, and juvenile myoclonic epilepsy cohorts using one
          shared EEG-fMRI or MEG protocol, testing whether motor-system
          recruitment differs at the point of seizure onset rather than only in
          clinical output.
      - experiment_id: egtca_powered_subtype_gwas
        name: Adequately powered EGTCA-stratified GWAS
        description: >-
          Syndrome-stratified genetic analysis at sample sizes large enough to
          detect an EGTCA-specific locus, given that the 2023 ILAE meta-analysis
          was underpowered for this syndrome at n = 499.
  - discussion_id: egtca_sodium_channel_blocker_caution
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Does the sodium-channel-blocker aggravation caution that applies across the
      idiopathic generalized epilepsies actually apply to EGTCA, where absence and
      myoclonic seizures are absent by definition?
    attaches_to:
      - "pathophysiology#Recurrent Unprovoked Generalized Tonic-Clonic Seizures"
    rationale: >-
      The evidence base for aggravation by carbamazepine and oxcarbazepine
      concerns myoclonic and absence seizures. In the oxcarbazepine series the
      effect on generalized tonic-clonic seizures was explicitly described as less
      dramatic, with no worsening in half the patients. Since EGTCA patients have
      no myoclonic or absence seizures to aggravate, the standard blanket caution
      may not transfer, but no EGTCA-specific study was identified either way. The
      entry records the uncertainty rather than repeating the generalization or
      asserting safety.
    evidence:
      - reference: PMID:15461683
        reference_title: >-
          Worsening of seizures by oxcarbazepine in juvenile idiopathic
          generalized epilepsies.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The effects of OXC on GTCSs were less dramatic, with no worsening in
          frequency in three and a slight increase in three.
        explanation: >-
          Shows that the aggravation signal is much weaker for generalized
          tonic-clonic seizures than for the myoclonic and absence seizures that
          drive the caution. Marked PARTIAL because the series contained no EGTCA
          patients, so this bounds the inference rather than resolving it.
      - reference: PMID:15461683
        reference_title: >-
          Worsening of seizures by oxcarbazepine in juvenile idiopathic
          generalized epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Aggravation consisted of a clear aggravation of myoclonic jerks (five
          cases) or de novo myoclonic jerks (one case).
        explanation: >-
          Identifies the seizure types actually aggravated, none of which occur in
          EGTCA by definition, which is the basis for questioning the transfer.
  - discussion_id: egtca_absence_model_mismatch
    kind: HUMAN_MODEL_MISMATCH
    status: OPEN
    prompt: >-
      Can absence-epilepsy rodent models be used as mechanistic evidence for
      EGTCA, when they reproduce spike-wave discharge with behavioral arrest
      rather than the awakening-triggered convulsive phenotype that defines the
      syndrome?
    attaches_to:
      - "pathophysiology#Cortico-Thalamocortical Excitation-Inhibition Imbalance"
    rationale: >-
      The rodent models that underpin thalamocortical hypersynchrony theory are
      absence models producing spike-wave discharge with behavioral arrest, and
      none reproduces either the generalized-tonic-clonic-alone seizure output or
      the awakening-linked circadian pattern. Their evidence therefore bears on
      the shared network mechanism, not on what makes EGTCA a distinct syndrome.
      This entry deliberately cites no model-organism evidence for any node, which
      is why the mismatch is recorded here rather than attached to a citation.
    proposed_experiments:
      - experiment_id: egtca_rodent_circadian_convulsive_screen
        name: Circadian convulsive-phenotype screen in GGE rodent lines
        description: >-
          Characterize whether any existing genetic generalized epilepsy rodent
          line shows convulsive seizures clustering around the wake transition,
          and if so whether the circadian gating is separable from the underlying
          spike-wave mechanism.

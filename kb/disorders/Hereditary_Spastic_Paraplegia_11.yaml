notes: >-
  SPG11 and SPG15 are the two commonest autosomal recessive HSPs and converge on
  the same molecular step, autophagic lysosome reformation. When curating either,
  keep the mechanism at reformation rather than at degradation: lysosomal
  enzymatic function and pH are preserved in spatacsin-null cells, so this is a
  disorder of lysosome supply and is not a lysosomal storage disease, even though
  undegraded material accumulates.


  The causal chain from lysosome depletion to selective neuronal death is the
  authors' proposal from a knockout mouse, not an established human finding, and
  the pathophysiology node states it as such. The two neuronal populations that
  degenerate in that mouse - cortical motor neurons and Purkinje cells - do match
  the corticospinal and cerebellar features of the human disease, which is
  supporting but not confirmatory.

- name: Progressive Complicated Spastic Paraplegia
  conforms_to: "corticospinal_tract_axonopathy#Progressive Lower-Limb Spasticity and Weakness"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: progressive spasticity and weakness of the lower limbs
    with onset mainly in infancy or adolescence, though the reported range runs
    from age 1 to 31 years and rarely as late as 60. Most affected individuals
    become wheelchair bound one or two decades after onset. SPG11 is a
    complicated rather than a pure HSP, so the paraparesis is accompanied by
    cognitive impairment, peripheral neuropathy, pseudobulbar involvement, and
    upper-limb hyperreflexia, with cerebellar signs, retinal degeneration, and
    parkinsonism as less frequent additions.
  evidence:
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spastic paraplegia 11 (SPG11) is characterized by progressive spasticity
      and weakness of the lower limbs frequently associated with the following:
      mild intellectual disability with learning difficulties in childhood and/or
      progressive cognitive decline; peripheral neuropathy; pseudobulbar
      involvement; and increased reflexes in the upper limbs.
    explanation: >-
      States the core paraparesis and the accompanying features that make this a
      complicated rather than a pure HSP.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset occurs mainly during infancy or adolescence (range: age 1-31 years)
      and in rare cases as late as age 60 years. Most affected individuals become
      wheelchair bound one or two decades after disease onset.
    explanation: >-
      Supplies the age-of-onset range and the tempo to loss of ambulation
      recorded in this node.
  downstream:
  - target: Spastic paraplegia
    description: >-
      Progressive lower-limb spasticity and paraparesis form the defining motor
      manifestation.
  - target: Loss of ambulation
    description: >-
      Progressive spastic paraparesis leads to wheelchair dependence within one
      to two decades of symptom onset in most patients.
  - target: Pes cavus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pes cavus foot deformity occurs as a less frequent musculoskeletal
      complication of chronic motor involvement in SPG11.

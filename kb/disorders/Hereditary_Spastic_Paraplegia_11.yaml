pathophysiology:
- name: Spatacsin Loss of Function
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in SPG11 abolish spatacsin. Spatacsin is
    an essential component of autophagic lysosome reformation, the pathway that
    regenerates free lysosomes out of autolysosomes once autophagic degradation
    is complete, and it acts in the same step as spastizin, the product of the
    other common autosomal recessive HSP gene SPG15. Both proteins are required
    for the initiation of the lysosomal tubulation that pinches off new
    lysosomes. This places SPG11 in the endolysosomal and membrane-traffic
    category of HSP genes, alongside the AP-4 and AP-5 complex disorders.
  gene:
    preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  biological_processes:
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we have demonstrated that the two most common autosomal recessive
      hereditary spastic paraplegia gene products, the SPG15 protein spastizin
      and the SPG11 protein spatacsin, are pivotal for autophagic lysosome
      reformation (ALR), a pathway that generates new lysosomes.
    explanation: >-
      Identifies the molecular function lost in this node and places spatacsin in
      the same pathway step as the SPG15 protein. Evidence source is IN_VITRO
      because the pathway assignment rests on cell-based loss-of-function
      experiments.
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, spastizin and spatacsin were essential components for the
      initiation of lysosomal tubulation.
    explanation: >-
      Specifies the step within autophagic lysosome reformation that requires
      spatacsin, giving the node a mechanism rather than an association.
  downstream:
  - target: Failure of Autophagic Lysosome Reformation and Lysosome Depletion
    description: >-
      Without spatacsin, new lysosomes are not regenerated from autolysosomes.

- name: Failure of Autophagic Lysosome Reformation and Lysosome Depletion
  biological_scale: CELLULAR
  description: >-
    Loss of spatacsin depletes the pool of free lysosomes that are competent to
    fuse with incoming autophagosomes, while autolysosomes accumulate - the
    signature of a blocked reformation step rather than a blocked degradation
    step. Lysosomal function per se is largely preserved: cathepsin D processing
    and lysosomal pH are normal in spatacsin-null cells, and what is reduced is
    the number of lysosomes, not their competence. The distinction matters,
    because it makes SPG11 a disorder of lysosome supply rather than a classical
    lysosomal storage disease.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of spastizin or spatacsin resulted in depletion of free lysosomes,
      which are competent to fuse with autophagosomes, and an accumulation of
      autolysosomes, reflecting a failure in ALR.
    explanation: >-
      States both halves of this node - free lysosomes depleted, autolysosomes
      accumulated - which is what identifies the block as being at reformation.
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Though distinct parameters of lysosomal function like processing of
      cathepsin D and lysosomal pH are preserved, lysosome numbers are reduced in
      knockout MEFs and the recovery of lysosomes during sustained starvation
      impaired consistent with a defect of autophagic lysosome reformation.
    explanation: >-
      Supports the specific claim that lysosomal function is preserved while
      lysosome number falls, which is why this entry curates lysosome supply
      rather than lysosomal storage. Evidence source is MODEL_ORGANISM because
      the measurements are in knockout mouse embryonic fibroblasts.
  downstream:
  - target: Accumulation of Undegraded Autolysosomal Material in Vulnerable Neurons
    description: >-
      Fewer lysosomes available for fusion means autophagic substrate is not
      cleared.

- name: Accumulation of Undegraded Autolysosomal Material in Vulnerable Neurons
  biological_scale: CELLULAR
  description: >-
    Impaired autolysosomal clearance leaves undegraded material inside neurons.
    In spatacsin-knockout mice the degenerating neurons accumulate autofluorescent
    material that stains for the lysosomal protein Lamp1 and for p62, the marker
    of substrate destined for autophagic degradation, and lipidated LC3 is raised
    - a generalized autophagy defect rather than a lysosome-specific one. The
    burden falls on particularly sensitive neurons, and the two populations that
    degenerate in the mouse are cortical motor neurons and cerebellar Purkinje
    cells, which correspond to the corticospinal and cerebellar features of the
    human disease.
  cell_types:
  - preferred_term: cortical motor neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Degenerating neurons accumulate autofluorescent material, which stains for
      the lysosomal protein Lamp1 and for p62, a marker of substrate destined to
      be degraded by autophagy, and hence appears to be related to autolysosomes.
    explanation: >-
      Identifies the accumulated material as autolysosomal by two independent
      markers, in the neurons that are actually degenerating.
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because lysosomes are reduced in cortical neurons and Purkinje cells in
      vivo, we propose that the decreased number of lysosomes available for
      fusion with autophagosomes impairs autolysosomal clearance, results in the
      accumulation of undegraded material and finally causes death of
      particularly sensitive neurons like cortical motoneurons and Purkinje cells
      in knockout mice.
    explanation: >-
      States the proposed causal chain from lysosome depletion through impaired
      clearance to selective neuronal death, and names the two vulnerable
      populations. Curated as the authors' proposal, which is why the node
      description attributes it rather than asserting it as established in human
      tissue.
  downstream:
  - target: Dying-Back Corticospinal Axon Degeneration
    description: >-
      Failure of autophagic clearance in cortical motor neurons drives
      degeneration of their long descending axons.

- name: Dying-Back Corticospinal Axon Degeneration
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  biological_scale: TISSUE
  description: >-
    The corticospinal axons degenerate from their distal ends back toward the
    cell body, the dying-back pattern shared across the hereditary spastic
    paraplegias. Thinning of the corpus callosum, the imaging hallmark of SPG11,
    reflects the same process acting on a different long-axon population, and it
    is what makes the diagnosis suspectable on MRI before genetic testing.
  cell_types:
  - preferred_term: cortical motor neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: neuron projection maintenance
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary spastic paraplegia (HSP) is characterized by a dying back
      degeneration of corticospinal axons which leads to progressive weakness and
      spasticity of the legs. SPG11 is the most common autosomal-recessive form
      of HSPs and is caused by mutations in SPG11.
    explanation: >-
      States the dying-back corticospinal degeneration this node models and
      identifies SPG11 as the commonest recessive HSP. Evidence source is OTHER
      because this framing sentence summarizes the established clinical
      neuropathology rather than reporting the paper's own experiment.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characteristic brain MRI features that include thinning of the corpus
      callosum
    explanation: >-
      Documents the thin corpus callosum, the long-axon imaging correlate that
      makes SPG11 recognizable radiologically.
  downstream:
  - target: Progressive Complicated Spastic Paraplegia
    description: >-
      Loss of descending corticospinal input produces spastic weakness of the
      legs, with the extra-corticospinal features of the complicated form.

- name: Progressive Complicated Spastic Paraplegia
  conforms_to: "corticospinal_tract_axonopathy#Progressive Lower-Limb Spasticity and Weakness"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: progressive spasticity and weakness of the lower limbs
    with onset mainly in infancy or adolescence, though the reported range runs
    from age 1 to 31 years and rarely as late as 60. Most affected individuals
    become wheelchair bound one or two decades after onset. SPG11 is a
    complicated rather than a pure HSP, so the paraparesis is accompanied by
    cognitive impairment, peripheral neuropathy, pseudobulbar involvement, and
    upper-limb hyperreflexia, with cerebellar signs, retinal degeneration, and
    parkinsonism as less frequent additions.
  evidence:
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spastic paraplegia 11 (SPG11) is characterized by progressive spasticity
      and weakness of the lower limbs frequently associated with the following:
      mild intellectual disability with learning difficulties in childhood and/or
      progressive cognitive decline; peripheral neuropathy; pseudobulbar
      involvement; and increased reflexes in the upper limbs.
    explanation: >-
      States the core paraparesis and the accompanying features that make this a
      complicated rather than a pure HSP.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset occurs mainly during infancy or adolescence (range: age 1-31 years)
      and in rare cases as late as age 60 years. Most affected individuals become
      wheelchair bound one or two decades after disease onset.
    explanation: >-
      Supplies the age-of-onset range and the tempo to loss of ambulation
      recorded in this node.

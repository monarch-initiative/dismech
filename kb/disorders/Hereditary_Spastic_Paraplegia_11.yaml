pathophysiology:
- name: Spatacsin Loss of Function
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in SPG11 abolish spatacsin. Spatacsin is
    an essential component of autophagic lysosome reformation, the pathway that
    regenerates free lysosomes out of autolysosomes once autophagic degradation
    is complete, and it acts in the same step as spastizin, the product of the
    other common autosomal recessive HSP gene SPG15. Both proteins are required
    for the initiation of the lysosomal tubulation that pinches off new
    lysosomes. This places SPG11 in the endolysosomal and membrane-traffic
    category of HSP genes, alongside the AP-4 and AP-5 complex disorders.
  gene:
    preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  biological_processes:
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we have demonstrated that the two most common autosomal recessive
      hereditary spastic paraplegia gene products, the SPG15 protein spastizin
      and the SPG11 protein spatacsin, are pivotal for autophagic lysosome
      reformation (ALR), a pathway that generates new lysosomes.
    explanation: >-
      Identifies the molecular function lost in this node and places spatacsin in
      the same pathway step as the SPG15 protein. Evidence source is IN_VITRO
      because the pathway assignment rests on cell-based loss-of-function
      experiments.
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, spastizin and spatacsin were essential components for the
      initiation of lysosomal tubulation.
    explanation: >-
      Specifies the step within autophagic lysosome reformation that requires
      spatacsin, giving the node a mechanism rather than an association.
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      they are present in a common protein complex that also includes the
      heterotetrameric adaptor protein complex AP-5
    explanation: >-
      Summarizes biochemical complex-isolation findings showing that spatacsin
      associates in a common complex with spastizin and AP-5.
  - reference: PMID:37871017
    reference_title: Spatacsin regulates directionality of lysosome trafficking by promoting the degradation of its partner AP5Z1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that spatacsin promotes the degradation of its partner
      AP5Z1, which regulates the relative amount of spastizin and AP5Z1 at
      lysosomes.
    explanation: >-
      Cell-culture and mouse-embryonic-fibroblast experiments demonstrating that
      spatacsin regulates AP5Z1 degradation and spastizin/AP5Z1 balance at
      lysosomes to control tubular lysosome trafficking.
  downstream:
  - target: Failure of Autophagic Lysosome Reformation and Lysosome Depletion
    description: >-
      Without spatacsin, new lysosomes are not regenerated from autolysosomes.

- name: Failure of Autophagic Lysosome Reformation and Lysosome Depletion
  biological_scale: CELLULAR
  description: >-
    Loss of spatacsin depletes the pool of free lysosomes that are competent to
    fuse with incoming autophagosomes, while autolysosomes accumulate - the
    signature of a blocked reformation step rather than a blocked degradation
    step. Lysosomal function per se is largely preserved: cathepsin D processing
    and lysosomal pH are normal in spatacsin-null cells, and what is reduced is
    the number of lysosomes, not their competence. The distinction matters,
    because it makes SPG11 a disorder of lysosome supply rather than a classical
    lysosomal storage disease.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:25365221
    reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of spastizin or spatacsin resulted in depletion of free lysosomes,
      which are competent to fuse with autophagosomes, and an accumulation of
      autolysosomes, reflecting a failure in ALR.
    explanation: >-
      States both halves of this node - free lysosomes depleted, autolysosomes
      accumulated - which is what identifies the block as being at reformation.
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Though distinct parameters of lysosomal function like processing of
      cathepsin D and lysosomal pH are preserved, lysosome numbers are reduced in
      knockout MEFs and the recovery of lysosomes during sustained starvation
      impaired consistent with a defect of autophagic lysosome reformation.
    explanation: >-
      Supports the specific claim that lysosomal function is preserved while
      lysosome number falls, which is why this entry curates lysosome supply
      rather than lysosomal storage. Evidence source is MODEL_ORGANISM because
      the measurements are in knockout mouse embryonic fibroblasts.
  downstream:
  - target: Accumulation of Undegraded Autolysosomal Material in Vulnerable Neurons
    description: >-
      Fewer lysosomes available for fusion means autophagic substrate is not
      cleared.

- name: Accumulation of Undegraded Autolysosomal Material in Vulnerable Neurons
  biological_scale: CELLULAR
  description: >-
    Impaired autolysosomal clearance leaves undegraded material and unexported
    lysosomal lipids inside neurons. In spatacsin-knockout mice the degenerating
    neurons accumulate autofluorescent material that stains for the lysosomal
    protein Lamp1 and for p62, the marker of substrate destined for autophagic
    degradation, lipidated LC3 is raised, and lipid clearance from lysosomes is
    perturbed. The burden falls on particularly sensitive neurons, including
    cortical motor neurons, cerebellar Purkinje cells, hippocampal neurons, and
    spinal motor neurons in knockout mice, corresponding to the central and
    peripheral features of the human disease.
  cell_types:
  - preferred_term: cortical motor neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Degenerating neurons accumulate autofluorescent material, which stains for
      the lysosomal protein Lamp1 and for p62, a marker of substrate destined to
      be degraded by autophagy, and hence appears to be related to autolysosomes.
    explanation: >-
      Identifies the accumulated material as autolysosomal by two independent
      markers, in the neurons that are actually degenerating.
  - reference: PMID:26284655
    reference_title: In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because lysosomes are reduced in cortical neurons and Purkinje cells in
      vivo, we propose that the decreased number of lysosomes available for
      fusion with autophagosomes impairs autolysosomal clearance, results in the
      accumulation of undegraded material and finally causes death of
      particularly sensitive neurons like cortical motoneurons and Purkinje cells
      in knockout mice.
    explanation: >-
      States the proposed causal chain from lysosome depletion through impaired
      clearance to selective neuronal death, and names the two vulnerable
      populations. Curated as the authors' proposal, which is why the node
      description attributes it rather than asserting it as established in human
      tissue.
  - reference: PMID:28237315
    reference_title: Loss of spatacsin function alters lysosomal lipid clearance leading to upper and lower motor neuron degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Examination of the cellular alterations observed in this model suggests
      that the loss of spatacsin leads to the accumulation of lipids in
      lysosomes by perturbing their clearance from these organelles.
    explanation: >-
      Shows that impaired lysosomal lipid clearance contributes to neuronal
      storage and degeneration across cortical, cerebellar, hippocampal, and
      spinal motor neurons in Spg11 knockout mice.
  downstream:
  - target: Dying-Back Corticospinal Axon Degeneration
    description: >-
      Failure of autophagic and lysosomal lipid clearance in cortical motor
      neurons drives dying-back degeneration of their long descending
      corticospinal axons.
  - target: Corpus Callosum Thinning and Interhemispheric Axonopathy
    description: >-

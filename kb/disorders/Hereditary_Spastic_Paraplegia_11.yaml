name: Hereditary Spastic Paraplegia 11
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- SPG11
- spastic paraplegia 11
- HSP-TCC
- autosomal recessive spastic paraplegia with mental impairment and thin corpus callosum
- SPG11 hereditary spastic paraplegia
- spastic paraplegia 11, autosomal recessive
description: >-
  Hereditary spastic paraplegia 11 (SPG11) is the most common autosomal recessive
  form of hereditary spastic paraplegia. It is caused by biallelic loss-of-function
  variants in SPG11, which encodes spatacsin. Spatacsin, together with the SPG15
  protein spastizin, is required for autophagic lysosome reformation - the pathway
  that regenerates free lysosomes from autolysosomes after autophagy has run. Its
  loss depletes the pool of lysosomes competent to fuse with incoming
  autophagosomes, so undegraded autolysosomal material accumulates and the neurons
  with the longest and most metabolically exposed axons die back. The clinical
  picture is a complicated spastic paraplegia: progressive lower-limb spasticity
  and weakness with childhood learning difficulty or progressive cognitive
  decline, peripheral neuropathy, pseudobulbar involvement, and upper-limb
  hyperreflexia, on a background of the characteristic MRI finding of a thin
  corpus callosum. Onset is usually in infancy or adolescence, and most affected
  individuals become wheelchair bound one or two decades later.

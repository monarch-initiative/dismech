name: Hereditary Spastic Paraplegia 11
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Hereditary spastic paraplegia 11 (SPG11) is the most common autosomal recessive complex
  hereditary spastic paraplegia, caused by biallelic loss-of-function variants in SPG11,
  encoding spatacsin. Spatacsin forms a complex with spastizin (SPG15/ZFYVE26) and the AP-5
  adaptor complex (SPG48/AP5Z1) that regulates autophagic lysosome reformation and neuronal
  lipid/ganglioside clearance; its loss causes lysosome depletion, lipofuscin and ganglioside
  accumulation, and length-dependent degeneration of the corticospinal tract and other long
  axonal tracts. SPG11 characteristically presents with childhood/adolescent-onset progressive
  spastic paraplegia, thinning of the corpus callosum, mild intellectual disability or
  progressive cognitive decline, and peripheral neuropathy, with most affected individuals
  becoming wheelchair-bound one to two decades after onset.
synonyms:
- SPG11
- Spastic Paraplegia 11
- Autosomal Recessive Spastic Paraplegia Type 11
- Spastic Paraplegia-Intellectual Disability-Thin Corpus Callosum Syndrome
- HSP-TCC
- Nakamura-Osame Syndrome

pathophysiology:
- name: SPG11/Spatacsin Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants (nonsense, frameshift-causing insertions/deletions)
    in SPG11 abolish spatacsin, a large scaffolding protein expressed most prominently in
    the cerebellum, cerebral cortex, hippocampus, and pineal gland, which forms a complex
    with spastizin (SPG15/ZFYVE26) and the AP-5 adaptor complex (SPG48/AP5Z1).
  gene:
    preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  evidence:
  - reference: PMID:17322883
    reference_title: "Mutations in SPG11, encoding spatacsin, are a major cause of spastic paraplegia with thin corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations were \neither nonsense or insertions and deletions leading to a frameshift, suggesting \na loss-of-function mechanism."
    explanation: Establishes that SPG11 pathogenic variants act through a loss-of-function mechanism.
  downstream:
  - target: Autophagic Lysosome Reformation Defect
    description: >-
      Loss of the spatacsin-spastizin-AP5 complex impairs autophagic lysosome
      reformation (ALR), the pathway that regenerates free lysosomes from
      autolysosomes.
- name: Autophagic Lysosome Reformation Defect
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >-
    Spatacsin and spastizin are pivotal for autophagic lysosome reformation (ALR), the
    pathway that regenerates free lysosomes competent to fuse with autophagosomes. Loss of
    spatacsin depletes free lysosomes and causes accumulation of autolysosomes in vitro and
    in vivo (cortical neurons and cerebellar Purkinje cells in Spg11 knockout mice).
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: ABNORMAL
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:25365221
    reference_title: "Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome reformation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of spastizin or spatacsin \nresulted in depletion of free lysosomes, which are competent to fuse with \nautophagosomes, and an accumulation of autolysosomes, reflecting a failure in \nALR."
    explanation: Direct cell-biological demonstration that spatacsin loss causes an autophagic lysosome reformation defect.
  - reference: PMID:26284655
    reference_title: "In Vivo Evidence for Lysosome Depletion and Impaired Autophagic Clearance in Hereditary Spastic Paraplegia Type SPG11."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "disruption of Spatacsin in mice indeed \ncauses hereditary spastic paraplegia-like phenotypes with loss of cortical \nneurons and Purkinje cells."
    explanation: In vivo confirmation in Spg11 knockout mice that spatacsin loss causes lysosome depletion and neurodegeneration consistent with an ALR defect.
  downstream:
  - target: Lysosomal Lipid and Ganglioside Accumulation
    description: >-
      Failure of autophagic lysosome reformation impairs lysosomal clearance of
      lipids and gangliosides.
- name: Lysosomal Lipid and Ganglioside Accumulation
  biological_scale: CELLULAR
  description: >-
    Spatacsin acts downstream of clathrin and recruits dynamin to enable lysosomal membrane
    recycling and clearance of gangliosides from lysosomes; loss of spatacsin causes
    accumulation of lipids and gangliosides within lysosomes of mouse and human SPG11
    neurons, contributing to neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: ganglioside metabolic process
    term:
      id: GO:0001573
      label: ganglioside metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29949766
    reference_title: "Inhibition of Lysosome Membrane Recycling Causes Accumulation of Gangliosides that Contribute to Neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "spatacsin, which is required for lysosome recycling and whose loss of \nfunction leads to hereditary spastic paraplegia 11 (SPG11), promotes clearance \nof gangliosides from lysosomes in mouse and human SPG11 models."
    explanation: Demonstrates the specific mechanism by which spatacsin loss causes ganglioside accumulation in lysosomes, contributing to neurodegeneration.
  - reference: PMID:28237315
    reference_title: "Loss of spatacsin function alters lysosomal lipid clearance leading to upper and lower motor neuron degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the loss of spatacsin \nleads to the accumulation of lipids in lysosomes by perturbing their clearance \nfrom these organelles."
    explanation: Spg11 knockout mouse model shows spatacsin loss perturbs lysosomal lipid clearance, causing lipid accumulation.
  downstream:
  - target: Corticospinal and Long-Tract Axonal Degeneration
    description: >-
      Accumulation of undegraded lysosomal material in particularly vulnerable
      neurons (cortical motor neurons, Purkinje cells, spinal motor neurons)
      drives length-dependent axonal degeneration.
- name: Corticospinal and Long-Tract Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    Length-dependent degeneration of the corticospinal tract, callosal fibers, and
    peripheral nerves, with progressive brain atrophy and loss of neurons in the primary
    motor cortex, cerebellum, and hippocampus, underlies the progressive spastic
    paraplegia, thin corpus callosum, cognitive decline, and peripheral neuropathy of
    SPG11.
  evidence:
  - reference: PMID:28237315
    reference_title: "Loss of spatacsin function alters lysosomal lipid clearance leading to upper and lower motor neuron degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These behavioral deficits \nwere associated with progressive brain atrophy with the loss of neurons in the \nprimary motor cortex, cerebellum and hippocampus, as well as with accumulation \nof dystrophic axons in the corticospinal tract. Spinal motor neurons also \ndegenerated"
    explanation: Spg11 knockout mice recapitulate progressive corticospinal and long-tract axonal degeneration with cortical, cerebellar, and hippocampal neuronal loss.
  downstream:
  - target: Spastic paraplegia
    description: Corticospinal tract degeneration produces progressive lower-limb spasticity and weakness.
  - target: Thin corpus callosum
    description: Degeneration of callosal projection fibers produces thinning of the corpus callosum on neuroimaging.
  - target: Peripheral neuropathy
    description: Length-dependent peripheral axonal degeneration produces sensorimotor neuropathy.
  - target: Cognitive impairment
    description: Cortical, hippocampal, and white-matter involvement beyond the corticospinal tract contributes to intellectual disability and progressive cognitive decline.

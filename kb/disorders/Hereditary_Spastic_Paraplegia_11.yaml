    with onset mainly in infancy or adolescence (range age 1-31 years, rarely as late as
    age 60) and most affected individuals becoming wheelchair-bound one to two decades
    after onset.
  phenotype_term:
    preferred_term: Spastic paraplegia
    term:
      id: HP:0001258
      label: Spastic paraplegia
    clinical_course: PROGRESSIVE
  evidence:

genetic:
- name: SPG11 pathogenic variants
  gene_term:
    preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  association: Causative
  notes: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in SPG11
    are the most common cause of autosomal recessive complex HSP with thin corpus
    callosum. The gene was mapped and identified via linkage analysis in 12 ARHSP-TCC
    families.
  evidence:
  - reference: PMID:20301389
    reference_title: "Spastic Paraplegia 11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SPG11 is established in a proband with \ncharacteristic clinical and MRI findings and biallelic pathogenic variants in \nSPG11 identified on molecular genetic testing."
    explanation: Biallelic SPG11 variants are diagnostic and causative for SPG11.
  - reference: PMID:17322883
    reference_title: "Mutations in SPG11, encoding spatacsin, are a major cause of spastic paraplegia with thin corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed 12 ARHSP-TCC \nfamilies, refined the SPG11 candidate interval and identified ten mutations in a \npreviously unidentified gene"
    explanation: Original identification of SPG11 mutations as the cause of ARHSP-TCC.

    explanation: Supports POLR3A-related disease as the more severe end of the 4H/POLR3-related leukodystrophy spectrum.
pathophysiology:
- name: Biallelic POLR3A Loss of Function
  description: >-
    Biallelic pathogenic variants in POLR3A (the largest, catalytic subunit of
    RNA polymerase III) reduce POLR3A protein abundance in fibroblasts and
    autopsied brain tissue and impair Pol III, the enzyme that transcribes many
    small non-coding RNAs including tRNAs and 5S rRNA. This is the proximal
    molecular lesion of HLD7.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  molecular_functions:
  - preferred_term: DNA-directed RNA polymerase activity
    term:
      id: GO:0003899
      label: DNA-directed RNA polymerase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: transcription by RNA polymerase III
    term:
      id: GO:0006383
      label: transcription by RNA polymerase III
    modifier: DECREASED
  evidence:
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblots on 4H fibroblasts and on the autopsied brain of an individual diagnosed with 4H documented a significant decrease in POLR3A levels"
    explanation: Demonstrates reduced POLR3A protein levels in patient fibroblasts and autopsied 4H brain tissue.
  - reference: PMID:38561452
    reference_title: "Clinical phenotype and genetic function analysis of a family with hypomyelinating leukodystrophy-7 caused by POLR3A mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "overexpression of wild-type POLR3A protein significantly enhanced Pol III transcription of 5S rRNA and tRNA Leu-CAA."
    explanation: Establishes POLR3A as a determinant of Pol III transcription, the activity impaired by HLD7 variants.
  - reference: PMID:36140376
    reference_title: "Identification of a Novel Missense Mutation of POLR3A Gene in a Cohort of Sicilian Patients with Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive mutations in the POLR3A gene cause POLR3-HLD (the second-most-common form of childhood-onset hypomyelinating leukodystrophy), a neurodegenerative disorder featuring deficient cerebral myelin formation."
    explanation: Supports recessive POLR3A variants as the cause of POLR3-HLD with deficient myelin formation.
  downstream:
  - target: Impaired Pol III Transcript Output
    description: Defective Pol III lowers production of its small non-coding RNA transcripts (tRNAs, 5S rRNA, BC200).
- name: Impaired Pol III Transcript Output
  description: >-
    The mutant POLR3A protein fails to support normal Pol III activity, causing
    a global reduction in nuclear-encoded precursor tRNAs and selective
    down-regulation of type 2 Pol III transcripts including the brain-enriched
    translational regulator BC200 RNA (BCYRN1), linking transcriptional
    dysfunction to reduced myelin basic protein expression.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  biological_processes:
  - preferred_term: tRNA transcription by RNA polymerase III
    term:
      id: GO:0042797
      label: tRNA transcription by RNA polymerase III
    modifier: DECREASED
  evidence:
  - reference: PMID:30898877
    reference_title: "Leukodystrophy-associated POLR3A mutations down-regulate the RNA polymerase III transcript and important regulatory RNA BC200."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, these results provide the first evidence that a leukodystrophy-causing POLR3A mutation causes a global reduction in transcription levels of nuclear-encoded tRNA genes."
    explanation: CRISPR-edited POLR3A mutant human cells show global reduction of nuclear-encoded precursor tRNA transcription.
  - reference: PMID:38561452
    reference_title: "Clinical phenotype and genetic function analysis of a family with hypomyelinating leukodystrophy-7 caused by POLR3A mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pol III transcription function was frustrated (POLR3A, BC200, and tRNA Leu-CAA expression decreased), and MBP and 18S rRNA expressions were decreased."
    explanation: Directly links the POLR3A p.Cys767Phe variant to reduced Pol III transcripts and decreased myelin basic protein expression.
  - reference: PMID:37915380
    reference_title: "Biallelic pathogenic variants in POLR3D alter tRNA transcription and cause a hypomyelinating leukodystrophy: A case report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pol III transcription was also shown to be aberrant, with a significant decrease in 7SK RNA and several distinct tRNA genes"
    explanation: Supports reduced Pol III tRNA output as a shared mechanism across POLR3-related leukodystrophies.
  downstream:
  - target: Oligodendrocyte and Myelin Dysfunction
    description: Reduced Pol III transcript supply perturbs oligodendrocyte translation and myelin production.
  - target: Oligodontia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: POLR3A-related Pol III transcriptional deficiency underlies oligodontia, although the intermediate mechanism linking Pol III dysfunction to dental anomalies remains unresolved.
  - target: Delayed Dentition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: POLR3A-related Pol III transcriptional deficiency is associated with delayed tooth eruption, although the intermediate developmental mechanism remains unresolved.
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: POLR3A-related Pol III transcriptional deficiency underlies hypogonadotropic hypogonadism, although the intermediate mechanism linking Pol III dysfunction to endocrine involvement remains unresolved.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: POLR3A-related Pol III transcriptional deficiency is associated with short stature with or without growth hormone deficiency, although the intermediate mechanism remains unresolved.
  - target: Myopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: POLR3A-related Pol III transcriptional dysfunction is associated with progressive, often severe myopia, although the intermediate mechanism remains unresolved.
- name: Oligodendrocyte and Myelin Dysfunction
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"
  description: >-
    Reduced Pol III transcript supply impairs oligodendrocyte differentiation
    and lowers MBP expression during oligodendroglial maturation, compromising
    the high translational demand of myelin protein synthesis and yielding
    deficient central nervous system myelination.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: ABNORMAL
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:30898877
    reference_title: "Leukodystrophy-associated POLR3A mutations down-regulate the RNA polymerase III transcript and important regulatory RNA BC200."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MBP mRNA levels were significantly decreased in POLR3AM852V cells compared with WT cells after 4 and 6 days of differentiation (Fig. 7), showing that POLR3A mutations impair the expression of an important marker of mature oligodendrocytes."
    explanation: Demonstrates that pathogenic POLR3A mutation impairs MBP expression during human oligodendroglial cell differentiation.
  - reference: PMID:36140376
    reference_title: "Identification of a Novel Missense Mutation of POLR3A Gene in a Cohort of Sicilian Patients with Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a neurodegenerative disorder featuring deficient cerebral myelin formation."
    explanation: Supports deficient cerebral myelin formation as the cellular/tissue-level consequence in POLR3-HLD.
  - reference: PMID:37755363
    reference_title: "Molecular Pathogenic Mechanisms of Hypomyelinating Leukodystrophies (HLDs)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An increasing number of studies have reported genetic mutations that cause protein misfolding, protein dysfunction, and/or mislocalization associated with HLD."
    explanation: Supports protein dysfunction as the mechanistic theme underlying hypomyelinating leukodystrophies including POLR3-related disease.
  downstream:
  - target: Central Nervous System Hypomyelination
    description: Oligodendrocyte and myelin dysfunction manifests as diffuse CNS hypomyelination.
- name: Central Nervous System Hypomyelination
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  description: >-
    Diffuse hypomyelination of central nervous system white matter, with relative
    preservation of early-myelinating structures, is the defining tissue-level
    output and produces the characteristic brain MRI pattern and progressive
    cerebellar, pyramidal, extrapyramidal, and cognitive dysfunction of
    POLR3-related leukodystrophy.
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the combination of hypomyelination with relative T2 hypointensity of the ventrolateral thalamus, optic radiation, globus pallidus, and dentate nucleus, cerebellar atrophy, and thinning of the corpus callosum suggests the diagnosis."
    explanation: Describes the diffuse hypomyelination pattern that defines the disease at the tissue/imaging level.
  - reference: PMID:37915380
    reference_title: "Biallelic pathogenic variants in POLR3D alter tRNA transcription and cause a hypomyelinating leukodystrophy: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her MRI was notable for diffuse hypomyelination with myelin preservation of early myelinating structures, characteristic of POLR3-related leukodystrophy."
    explanation: Supports diffuse hypomyelination with preservation of early-myelinating structures as characteristic of POLR3-related leukodystrophy.
  downstream:
  - target: CNS Hypomyelination
    description: Diffuse deficiency of CNS white-matter myelin directly manifests as CNS hypomyelination on brain MRI.
  - target: Ataxia
    description: Hypomyelination and associated cerebellar white-matter and vermian involvement produce progressive cerebellar ataxia.
  - target: Spasticity
    description: Corticospinal tract hypomyelination leads to pyramidal dysfunction and spasticity.
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: CNS hypomyelination in POLR3-related leukodystrophy is associated with extrapyramidal motor dysfunction manifesting as dystonia, although the specific intermediate pathway remains unresolved.
  - target: Tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: CNS hypomyelination and progressive cerebellar dysfunction in POLR3-related leukodystrophy produce intention tremor, although the specific intermediate pathway remains unresolved.
  - target: Dysarthria
    description: Cerebellar and corticobulbar white-matter involvement produces progressive dysarthria.
  - target: Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Progressive neurologic motor dysfunction in POLR3-related hypomyelinating leukodystrophy leads to worsening swallowing difficulties (dysphagia).
  - target: Cognitive Decline
    description: Progressive cerebral white-matter and callosal involvement leads to cognitive decline.
  - target: Developmental Regression
    description: Childhood-onset CNS hypomyelination manifests clinically as gross motor delay and developmental regression.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    HLD7 is inherited in an autosomal recessive manner caused by homozygous or
    compound heterozygous pathogenic variants in POLR3A, with a 25% recurrence
    risk in siblings of an affected individual and variable clinical
    expressivity ranging from early-childhood motor regression to attenuated
    adolescent- or adult-onset presentations.
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLR3-related leukodystrophy is inherited in an autosomal recessive manner. At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews documents autosomal recessive inheritance and Mendelian sibling recurrence risk.
  - reference: PMID:38561452
    reference_title: "Clinical phenotype and genetic function analysis of a family with hypomyelinating leukodystrophy-7 caused by POLR3A mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband and her two living brothers (IV2 and IV4) were detected to carry a homozygous mutation of the POLR3A (NM_007055.4) gene c. 2300G > T (p.Cys767Phe), and her consanguineous married parents (III1 and III2) were p.Cys767Phe heterozygous carriers."
    explanation: Confirms autosomal recessive segregation of a homozygous POLR3A variant in an affected sibship with heterozygous carrier parents.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Population-based birth or point prevalence has not been established.
    POLR3-related leukodystrophy is recognized as the second most common form of
    childhood-onset hypomyelinating leukodystrophy; a multinational
    cross-sectional study characterized 105 mutation-proven 4H leukodystrophy
    cases, and an earlier referral cohort of 37 POLR3-related leukodystrophy
    patients identified POLR3A mutations (HLD7) in 27/37 cases (with 19
    POLR3A-mutated individuals in the initial gene-discovery cohort).
  evidence:
  - reference: PMID:36140376
    reference_title: "Identification of a Novel Missense Mutation of POLR3A Gene in a Cohort of Sicilian Patients with Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive mutations in the POLR3A gene cause POLR3-HLD (the second-most-common form of childhood-onset hypomyelinating leukodystrophy), a neurodegenerative disorder featuring deficient cerebral myelin formation."
    explanation: Establishes POLR3-HLD as the second most common childhood-onset hypomyelinating leukodystrophy.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a multinational cross-sectional observational study of the clinical, radiologic, and molecular characteristics of 105 mutation-proven cases."
    explanation: Documents the largest multinational cohort of 105 mutation-proven 4H leukodystrophy cases caused by POLR3A or POLR3B variants.
  - reference: PMID:23355746
    reference_title: "Mutations in POLR3A and POLR3B are a major cause of hypomyelinating leukodystrophies with or without dental abnormalities and/or hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, our group has described 37 patients, of whom 27 have mutations in POLR3A and 10 in POLR3B, respectively."
    explanation: Documents 27 molecularly confirmed POLR3A (HLD7) cases among 37 POLR3-related leukodystrophy patients in a referral cohort.
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 14 recessive mutations were found in 19 individuals with TACH, 4H, or LO, establishing that these leukodystrophies are allelic."
    explanation: Documents the initial series of 19 individuals with recessive POLR3A mutations across allelic HLD7 presentations.
progression:
- phase: Early-childhood onset with motor delay or regression
  age_range: "<6 years in the majority; >10 years in ~10%"
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients presented before 6 years with gross motor delay or regression. Ten percent had an onset beyond 10 years."
    explanation: Defines typical onset before age 6 years with gross motor delay or regression and later childhood/adolescent onset in ~10%.
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age of onset is typically in early childhood but later-onset cases have also been reported."
    explanation: Confirms early childhood as the typical age of onset with recognized later-onset presentations.
- phase: Attenuated adolescent or adult-onset presentation
  age_range: "19-41 years in reported late-onset cases"
  evidence:
  - reference: PMID:32600288
    reference_title: "A novel POLR3A genotype leads to leukodystrophy type-7 in two siblings with unusually late age of onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study provides the first evidence of unusually late age of onset in HL, describing two siblings with a novel POLR3A genotype which showed the first symptoms at the age of 41 and 19, respectively."
    explanation: Documents adult-onset HLD7 presenting at ages 19 and 41 years with progressive cognitive and motor impairment.
- phase: Progressive neurological and bulbar deterioration
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Swallowing difficulties will progress over time and dystonia should be monitored and treated to prevent complications and improve the quality of life."
    explanation: Documents progressive bulbar dysfunction (dysphagia) and evolving extrapyramidal features over the disease course.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in POLR3A are associated with a more severe clinical course."
    explanation: Establishes that POLR3A-mutated (HLD7) patients experience more rapid neurological progression than POLR3B-mutated patients.

genetic:
- name: POLR3A
  gene_term:
    preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  association: Causative
  features: >-
    Biallelic (homozygous or compound heterozygous) pathogenic variants in
    POLR3A, encoding the largest catalytic subunit of RNA polymerase III, cause
    HLD7. Reported variant classes include missense, splice-region, frameshift,
    and in-frame insertion variants.
  inheritance:
  - name: Autosomal recessive inheritance
    evidence:
    - reference: PMID:22855961
      reference_title: "POLR3-Related Leukodystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "POLR3-related leukodystrophy is inherited in an autosomal recessive manner."
      explanation: GeneReviews establishes autosomal recessive inheritance.
  evidence:
  - reference: PMID:38561452
    reference_title: "Clinical phenotype and genetic function analysis of a family with hypomyelinating leukodystrophy-7 caused by POLR3A mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband and her two living brothers (IV2 and IV4) were detected to carry a homozygous mutation of the POLR3A (NM_007055.4) gene c. 2300G > T (p.Cys767Phe), and her consanguineous married parents (III1 and III2) were p.Cys767Phe heterozygous carriers."
    explanation: Documents a homozygous POLR3A variant segregating recessively in an HLD7 family with consanguineous parents.
  - reference: PMID:33597727
    reference_title: "Genetic analysis of 20 patients with hypomyelinating leukodystrophy by trio-based whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "splice variant POLR3A c.1770 + 5 G > C was proved to disrupt the normal splicing of intron 13 and led to a premature stop codon at position 618 (p.(P591Vfs*28))."
    explanation: Functionally confirms a POLR3A splice variant identified by trio-based whole-exome sequencing.
diagnosis:
- name: Characteristic Brain MRI Pattern
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain MRI pattern recognition is central to diagnosis: diffuse hypomyelination
    with relative T2 hypointensity of the ventrolateral thalamus, optic radiation,
    globus pallidus, and dentate nucleus, cerebellar atrophy, and thinning of the
    corpus callosum.
  results: >-
    The characteristic hypomyelination pattern, especially when cardinal
    non-neurologic features are absent, suggests POLR3-related leukodystrophy.
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI characteristics are helpful in addressing the diagnosis, especially if patients lack the cardinal non-neurologic features."
    explanation: Supports MRI pattern recognition as a key diagnostic tool.
  - reference: PMID:29179231
    reference_title: "4H Leukodystrophy: Lessons from 3T Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel MRI findings were myelin islets, closed eye sign, and a cyst-like lesion in the splenium."
    explanation: Adds higher-field 3T MRI features that aid diagnosis of 4H leukodystrophy.
- name: Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is confirmed by detecting biallelic pathogenic variants in POLR3A
    (or POLR3B/POLR1C), typically via exome or trio-based whole-exome sequencing.
  results: >-
    Biallelic pathogenic POLR3A variants confirm HLD7.
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLR3-related leukodystrophy is diagnosed by the combination of classic clinical findings, typical brain MRI features, and the presence of biallelic pathogenic variants in POLR3A, POLR3B, or POLR1C."
    explanation: GeneReviews defines the molecular diagnostic criteria.
  - reference: PMID:33597727
    reference_title: "Genetic analysis of 20 patients with hypomyelinating leukodystrophy by trio-based whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It emphasizes the heterogenicity of HLDs, the diagnostic power of trio-based WES for HLDs."
    explanation: Supports trio-based whole-exome sequencing as an effective diagnostic approach.
differential_diagnoses:
- name: Pelizaeus-Merzbacher disease (HLD1, PLP1-related)
  disease_term:
    preferred_term: Pelizaeus-Merzbacher disease
    term:
      id: MONDO:0010714
      label: Pelizaeus-Merzbacher spectrum disorder
  description: >-
    Classic X-linked hypomyelinating leukodystrophy (HLD1) caused by PLP1
    duplications or point variants that shares diffuse CNS hypomyelination,
    ataxia, spasticity, and tremor with HLD7.
  distinguishing_features:
  - X-linked inheritance due to PLP1 variants rather than autosomal recessive POLR3A variants
  - Brainstem T2 hyperintensity of the medial lemniscus and pyramidal tracts in PMD, whereas HLD7 preserves myelination of the medial lemniscus ("closed eye sign") and early-myelinating structures
  - Absence of the 4H dental (hypodontia/oligodontia) and endocrine (hypogonadotropic hypogonadism) triad
  evidence:
  - reference: PMID:22422208
    reference_title: "Pelizaeus-Merzbacher disease, Pelizaeus-Merzbacher-like disease 1, and related hypomyelinating disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Various types of mutations of the X-linked proteolipid protein 1 gene (PLP1) that include copy number changes, point mutations, and insertions or deletions of a few bases lead to a clinical spectrum from the most severe connatal PMD, to the least severe spastic paraplegia 2 (SPG2). Signs of PMD include nystagmus, hypotonia, tremors, titubation, ataxia, spasticity, athetotic movements and cognitive impairment; the major findings in SPG2 are leg weakness and spasticity. A diffuse pattern of hypomyelination is seen on magnetic resonance imaging (MRI) of PMD/SPG2 patients."
    explanation: Establishes PLP1-related PMD as the prototype X-linked diffuse hypomyelinating leukodystrophy in the differential diagnosis of HLD7.
  - reference: PMID:29179231
    reference_title: "4H Leukodystrophy: Lessons from 3T Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As in PMD, the hypomyelination in 4H leukodystrophy also affects the brain stem. However, in 4H leukodystrophy there is clearly better myelination of the medial lemniscus, which is not present in PMD."
    explanation: Identifies relative preservation of medial lemniscus myelination on 3T MRI as a neuroimaging feature distinguishing 4H leukodystrophy from PMD.
- name: POLR3B-related hypomyelinating leukodystrophy (HLD8)
  description: >-
    Locus-heterogeneous POLR3-related 4H leukodystrophy caused by biallelic
    pathogenic variants in POLR3B, encoding the second largest subunit of RNA
    polymerase III, with overlapping hypomyelination, cerebellar ataxia,
    oligodontia, and hypogonadotropic hypogonadism.
  distinguishing_features:
  - Biallelic pathogenic variants in POLR3B rather than POLR3A on molecular genetic testing
  - Generally milder clinical progression than POLR3A-related HLD7, particularly in patients carrying the recurrent c.1568T>A POLR3B allele
  evidence:
  - reference: PMID:22036172
    reference_title: "Recessive mutations in POLR3B, encoding the second largest subunit of Pol III, cause a rare hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We uncovered in three cases without POLR3A mutation recessive mutations in POLR3B, which codes for the second largest subunit of Pol III. Mutations in genes coding for Pol III subunits are a major cause of childhood-onset hypomyelinating leukodystrophies with prominent cerebellar dysfunction, oligodontia, and hypogonadotropic hypogonadism."
    explanation: Establishes POLR3B-related HLD8 as the principal locus-heterogeneous mimic of POLR3A-related HLD7.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease course was milder in patients with POLR3B than in patients with POLR3A mutations."
    explanation: Differentiates POLR3B-related HLD8 from POLR3A-related HLD7 by its milder clinical trajectory and molecular etiology.
- name: POLR1C-related hypomyelinating leukodystrophy (HLD11)
  description: >-
    Autosomal recessive POLR3-related hypomyelinating leukodystrophy caused by
    biallelic pathogenic variants in POLR1C (a shared Pol I/Pol III subunit)
    that presents with typical 4H clinical and brain MRI features.
  distinguishing_features:
  - Biallelic pathogenic variants in POLR1C rather than POLR3A on multi-gene panel or exome sequencing
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLR3-related leukodystrophy is diagnosed by the combination of classic clinical findings, typical brain MRI features, and the presence of biallelic pathogenic variants in POLR3A, POLR3B, or POLR1C."
    explanation: Identifies POLR1C as the third Pol III subunit gene whose biallelic variants produce the same clinical-radiologic 4H leukodystrophy syndrome and require molecular differentiation from POLR3A.
- name: POLR3A-related hereditary spastic ataxia
  description: >-
    Allelic autosomal recessive adolescent- or adult-onset spastic ataxia most
    commonly driven by compound heterozygosity for the deep-intronic POLR3A
    variant c.1909+22G>A, presenting with progressive spastic ataxia, intention
    tremor, central sensory tract involvement, and dental/periodontal
    abnormalities.
  distinguishing_features:
  - Absence of the classic diffuse cerebral hypomyelination MRI pattern of HLD7, showing bilateral T2 hyperintensities along the superior cerebellar peduncles instead
  - Enrichment for the hypomorphic deep-intronic splice variant c.1909+22G>A in compound heterozygosity
  evidence:
  - reference: PMID:28459997
    reference_title: "Hypomorphic mutations in POLR3A are a frequent cause of sporadic and recessive spastic ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Instead of the typical hypomyelination magnetic resonance imaging pattern associated with classical POLR3A mutations, cases carrying c.1909+22G>A demonstrated hyperintensities along the superior cerebellar peduncles."
    explanation: Distinguishes allelic c.1909+22G>A POLR3A spastic ataxia from classical HLD7 by the absence of diffuse hypomyelination and presence of superior cerebellar peduncle hyperintensities.
- name: Wiedemann-Rautenstrauch syndrome
  disease_term:
    preferred_term: Wiedemann-Rautenstrauch syndrome
    term:
      id: MONDO:0009910
      label: Wiedemann-Rautenstrauch syndrome
  description: >-
    Allelic autosomal recessive neonatal progeroid syndrome caused by biallelic
    truncating and/or splicing variants in POLR3A, characterized by intrauterine
    growth restriction, poor postnatal weight gain, triangular progeroid facies,
    widened fontanelles, pseudohydrocephalus, prominent scalp veins,
    generalized lipodystrophy, and natal or hypoplastic teeth.
  distinguishing_features:
  - Neonatal progeroid habitus with severe intrauterine/postnatal growth failure and lipodystrophy rather than childhood-onset progressive leukodystrophy
  - Predominance of biallelic truncating and splicing POLR3A combinations distinct from the missense-enriched genotypes of HLD7
  evidence:
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic missense variants in POLR3A have been associated with phenotypes distinct from WRS: hypogonadotropic hypogonadism and hypomyelinating leukodystrophy with or without oligodontia. Our findings confirm the association of bi-allelic POLR3A variants with WRS, expand the clinical phenotype of WRS, and suggest specific POLR3A genotypes associated with WRS and hypomyelinating leukodystrophy."
    explanation: Establishes Wiedemann-Rautenstrauch syndrome as an allelic POLR3A disorder clinically and genotypically distinct from HLD7.
treatments:
- name: Multidisciplinary Supportive Care
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    Management is supportive and symptom-directed via a multidisciplinary team
    (neurology, genetics, physiotherapy, occupational therapy, speech-language
    pathology, neuropsychology, rehabilitation, dentistry, endocrinology,
    ophthalmology, ENT). Particular caution is needed managing dysphagia, which
    can vary widely even within a single day, and dystonia should be monitored
    and treated to prevent complications.
  target_phenotypes:
  - preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  - preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  - preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  - preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individualized care by a multidisciplinary team including a pediatric neurologist, clinical geneticist, physiotherapist, occupational therapist, speech and language pathologist, neuropsychologist, rehabilitation physician, dentist, endocrinologist, ophthalmologist, ear-nose-and-throat specialist, and primary care physician is recommended."
    explanation: GeneReviews specifies multidisciplinary supportive management.
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Special caution needs to be taken when managing dysphagia in this disorder as it is known to vary widely, even in a single day."
    explanation: Captures the GeneReviews dysphagia management caution.
- name: Genetic Counseling
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Genetic counseling is appropriate given autosomal recessive inheritance; each
    sib of an affected individual has a 25% risk. Carrier testing for at-risk
    relatives and prenatal diagnosis are possible when both familial variants are
    known.
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carrier testing for at-risk relatives and prenatal diagnosis for pregnancies at increased risk are possible if both pathogenic variants in the family are known."
    explanation: GeneReviews supports carrier testing and prenatal diagnosis within genetic counseling.

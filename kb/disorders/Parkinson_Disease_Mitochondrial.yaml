name: Parkinson Disease, Mitochondrial
creation_date: "2026-08-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Parkinson disease, mitochondrial
  term:
    id: MONDO:0010796
    label: Parkinson disease, mitochondrial
description: >-
  A rare, maternally (mitochondrially) inherited form of Parkinson disease
  (OMIM:556500) defined molecularly by a heteroplasmic point mutation in the
  mitochondrially encoded 12S ribosomal RNA gene (m.T1095C in MT-RNR1). In the
  originally described pedigree the variant co-segregated with a distinctive
  triad of levodopa-responsive parkinsonism, sensorineural
  (aminoglycoside-sensitive) hearing loss, and peripheral neuropathy. The
  mutation disrupts a highly conserved loop of the small-subunit mitochondrial
  rRNA important for the initiation of mitochondrial protein synthesis,
  producing an oxidative phosphorylation defect (notably reduced cytochrome c
  oxidase / complex IV activity, and reduced complex II/III activity with
  mitochondrial glutathione depletion in transmitochondrial cybrids) and
  markedly increased aminoglycoside-induced apoptosis. This entry is
  deliberately scoped to the
  maternally inherited MT-RNR1 entity and is distinct from idiopathic Parkinson
  disease (MONDO:0005180) and from the nuclear-gene Mendelian forms already
  curated in dismech (e.g. PRKN/PARK2, PARK7/DJ-1, PINK1); the broader role of
  mitochondrial dysfunction in idiopathic PD (complex I deficiency, POLG/TWNK
  mtDNA-maintenance disease, PINK1-Parkin mitophagy, mtDNA haplogroup risk)
  belongs on those entries rather than here.
inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    Maternal (mitochondrial DNA) transmission of the heteroplasmic MT-RNR1
    m.T1095C variant is the defining feature of this entity, distinguishing it
    from the nuclear-gene Mendelian forms of Parkinson disease. Heteroplasmy —
    the coexistence of mutant and wild-type mtDNA within one individual, with
    allele frequency able to shift between generations — underlies the variable
    expressivity characteristic of mitochondrial disease.
  evidence:
  - reference: PMID:32187761
    reference_title: "Inheritance of mitochondrial DNA in humans: implications for rare and common diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of both mutated and wild-type variant alleles within the same individual (heteroplasmy) and rapid shifts in allele frequency can lead to offspring with variable severity of disease."
    explanation: >-
      Supports the heteroplasmy claim in this block: mixed mutant/wild-type
      mtDNA and generational shifts in mutant load are what produce variable
      severity among maternally related carriers. Review article, hence
      evidence_source OTHER.
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel, heteroplasmic, maternally inherited 12SrRNA point mutation (T1095C) was found in the pedigree."
    explanation: >-
      Establishes the maternally inherited, heteroplasmic mitochondrial (12S
      rRNA) basis of the disorder.

name: Parkinson Disease, Mitochondrial
creation_date: "2026-08-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Parkinson disease, mitochondrial
  term:
    id: MONDO:0010796
    label: Parkinson disease, mitochondrial
description: >-
  A maternally inherited (mitochondrially inherited) form of Parkinson disease
  (OMIM:556500) in which the underlying defect segregates with mitochondrial DNA
  rather than a nuclear PARK gene. It is characterized clinically by the
  cardinal parkinsonian features (bradykinesia, resting tremor, rigidity) and
  mechanistically by deficiency of mitochondrial respiratory chain complex I
  (NADH:ubiquinone oxidoreductase), the same electron-transport-chain lesion
  demonstrated in the substantia nigra in Parkinson disease and shown by
  transmitochondrial cybrid studies to be transferable with patient mitochondrial
  DNA. This entry is distinct from idiopathic Parkinson disease
  (MONDO:0005180) and from the autosomal recessive/dominant nuclear-gene forms
  (e.g. PRKN/PARK2, PARK7/DJ-1, PINK1) already curated in dismech.
inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    Maternal (mitochondrial DNA) transmission is the defining feature of this
    entity, distinguishing it from the nuclear-gene Mendelian forms of Parkinson
    disease.
phenotypes:
- name: Parkinsonism
  category: Clinical
  description: >-
    Cardinal parkinsonian motor syndrome comprising bradykinesia with resting
    tremor and/or rigidity.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
- name: Bradykinesia
  category: Clinical
  description: Slowness of movement, a cardinal feature required for parkinsonism.
  phenotype_term:
    preferred_term: Bradykinesia
    term:
      id: HP:0002067
      label: Bradykinesia
- name: Resting Tremor
  category: Clinical
  description: Tremor of a limb at rest, typically 4-6 Hz.
  phenotype_term:
    preferred_term: Resting tremor
    term:
      id: HP:0002322
      label: Resting tremor
- name: Rigidity
  category: Clinical
  description: Increased muscle tone with resistance to passive movement.
  phenotype_term:
    preferred_term: Rigidity
    term:
      id: HP:0002063
      label: Rigidity
pathophysiology:
- name: Mitochondrial Complex I Deficiency
  biological_scale: MOLECULAR
  description: >-
    Deficiency of mitochondrial respiratory chain complex I (NADH:ubiquinone
    oxidoreductase) impairs electron transport from NADH to ubiquinone, reducing
    ATP synthesis and increasing reactive oxygen species. In this maternally
    inherited form the complex I defect segregates with mitochondrial DNA.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone

    Exposure to aminoglycoside antibiotics in MT-RNR1 m.T1095C carriers is a
    pharmacological trigger of apoptosis and hearing loss. (No specific ECTO
    "exposure to aminoglycoside" term exists; ECTO was searched and only
    unrelated antibiotic-exposure classes were found, so the exposure is left
    ontology-unbound with this note.)
  exposure_term:
    preferred_term: exposure to aminoglycoside antibiotic
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "maternally inherited sensorineural deafness, levodopa-responsive parkinsonism, and neuropathy"
    explanation: >-
      Establishes the clinical deafness phenotype in the pedigree that the
      aminoglycoside exposure acts on; the companion cybrid study
      (PMID:22735573) shows the same 12S rRNA mutation confers aminoglycoside
      hypersensitivity, which is why this exposure is recorded for this entity
      at all.
  - reference: PMID:22735573
    reference_title: "The mitochondrial T1095C mutation increases gentamicin-mediated apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "when exposed to an aminoglycoside antibiotic these cells responded with a ten-fold increase in the number of apoptotic cells compared to controls"
    explanation: >-
      Establishes aminoglycoside antibiotics as a genuine exposure of interest
      for m.T1095C carriers: mutant cybrids exposed to the drug show a ten-fold
      increase in apoptosis relative to controls.
  influences_mechanisms:
  - target: Aminoglycoside-Sensitized Apoptosis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Aminoglycoside exposure precipitates the sensitized apoptotic response in
      mutation-carrying cells.
    evidence:
    - reference: PMID:22735573
      reference_title: "The mitochondrial T1095C mutation increases gentamicin-mediated apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results support a pathogenic role for the T1095C mutation and indicate that the mutation increases the risk for aminoglycoside-induced toxicity."
      explanation: >-
        Directly links aminoglycoside exposure to increased toxicity in carriers
        of the mutation.

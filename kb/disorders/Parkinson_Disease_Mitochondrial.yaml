discussions:
- discussion_id: mtrnr1_t1095c_nigral_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can a primary mtDNA point mutation such as MT-RNR1 m.T1095C cause
    nigrostriatal dopaminergic degeneration, given imaging evidence that nigral
    involvement in mitochondrial disease tracks with mtDNA
    replication/maintenance defects rather than point mutations?
  attaches_to:
  - "pathophysiology#Selective Dopaminergic Neuronal Vulnerability"
  rationale: >-
    The path from the OXPHOS defect to the motor phenotype in this entry runs
    through selective nigrostriatal dopaminergic vulnerability, but that node is
    inferred from the clinical, levodopa-responsive parkinsonism rather than
    demonstrated — the pedigree's functional data come from lymphocytes and
    cybrids, not from nigral tissue or dopaminergic imaging. Tzoulis et al.
    (PMID:26979109) found nigrostriatal degeneration exclusively in patients
    with defective mtDNA replication and maintenance and in none of the patients
    carrying primary mtDNA point mutations, which argues against the mechanism
    as stated. Resolving this matters beyond the entity: it decides whether
    m.T1095C parkinsonism is nigral-degenerative at all, or arises by another
    route.
  proposed_experiments:
  - experiment_id: mtrnr1_t1095c_dat_imaging
    name: Dopamine transporter imaging in MT-RNR1 m.T1095C carriers
    description: >-
      DAT-SPECT or equivalent presynaptic dopaminergic imaging in affected and
      unaffected maternal-line carriers, with heteroplasmy quantified in an
      accessible tissue, to test for presynaptic nigrostriatal denervation.
    decision_criterion: >-
      Reduced striatal DAT binding in affected carriers would establish nigral
      degeneration and place this entity outside the Tzoulis generalization;
      normal binding despite clinical parkinsonism would indicate a non-nigral
      or non-degenerative mechanism and require the pathophysiology chain to be
      rerouted.
- discussion_id: mtrnr1_t1095c_single_pedigree_generalizability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is MT-RNR1 m.T1095C a generalizable cause of maternally inherited
    parkinsonism-deafness-neuropathy, or is the association confined to the
    single reported pedigree?
  attaches_to:
  - "pathophysiology#MT-RNR1 m.T1095C Impairs Mitochondrial Translation"
  rationale: >-
    OMIM 556500 rests on one well-characterized family (Thyagarajan et al.,
    2000) with functional cybrid confirmation (Muyderman et al., 2012). No
    independent pedigrees establishing recurrence of the same variant-phenotype
    correlation have been curated here, so penetrance, expressivity, sex ratio,
    and prevalence remain unquantified. The heteroplasmic nature of the variant
    further complicates genotype-phenotype prediction.
  proposed_experiments:
  - experiment_id: mtrnr1_t1095c_case_ascertainment
    name: Independent case ascertainment for MT-RNR1 m.T1095C
    description: >-
      Systematic review of mtDNA-sequenced parkinsonism cohorts and mitochondrial
      disease registries (e.g. MITOMAP/MSeqDR) for additional carriers of
      m.T1095C, recording parkinsonism, hearing loss, neuropathy, and
      heteroplasmy level.
    decision_criterion: >-
      Identification of additional unrelated carriers with the concordant triad
      would support generalizability; persistent confinement to one family keeps
      the entity as a single-pedigree observation.

genetic:
- name: MT-RNR1 m.T1095C
  gene_term:
    preferred_term: MT-RNR1
    term:
      id: hgnc:7470
      label: MT-RNR1
  association: >-
    A novel heteroplasmic, maternally inherited point mutation (m.T1095C) in the
    mitochondrially encoded 12S rRNA gene MT-RNR1. Secondary-structure modeling
    predicts disruption of a highly conserved small-subunit rRNA loop important
    for the initiation of mitochondrial protein synthesis, producing an
    oxidative phosphorylation defect. The variant was absent from 270 ethnically
    diverse controls, supporting pathogenicity.
  subtype: MT-RNR1 m.T1095C
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was not found in 270 controls of diverse ethnic origins."
    explanation: >-
      Absence in 270 diverse controls supports pathogenicity of the m.T1095C
      variant.
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that this mutation is pathogenic and causes an oxidative phosphorylation defect by interfering with mitochondrial protein synthesis."
    explanation: >-
      States the pathogenic mechanism: an OXPHOS defect arising from impaired
      mitochondrial protein synthesis.
has_subtypes:
- name: MT-RNR1 m.T1095C
  display_name: MT-RNR1 m.T1095C 12S rRNA maternally inherited parkinsonism
  description: >-
    The single molecularly defined form of this entity: the heteroplasmic
    MT-RNR1 m.T1095C 12S rRNA mutation reported in one pedigree with
    parkinsonism, sensorineural deafness, and neuropathy.
diagnosis:
- name: Mitochondrial DNA sequencing with heteroplasmy quantification
  description: >-
    Sequencing of the mitochondrially encoded genes identifies the m.T1095C 12S
    rRNA (MT-RNR1) variant. Because the variant is heteroplasmic, a quantitative
    assay is required to establish and measure the mutant load rather than
    merely detect the base change; in the defining pedigree a PCR-based
    restriction assay with mismatched primers served this purpose.
  diagnosis_term:
    preferred_term: mitochondrial DNA sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A polymerase chain reaction-based restriction enzyme assay with mismatched primers was employed to show heteroplasmy of a novel 12SrRNA mutation in the proband"
    explanation: >-
      Documents the molecular assay used to establish the diagnosis and to
      demonstrate heteroplasmy of the 12S rRNA variant.
- name: Respiratory chain enzyme analysis
  description: >-
    Spectrophotometric respiratory chain enzyme assays on cultured lymphocytes
    (or muscle) demonstrate the biochemical oxidative phosphorylation defect,
    characteristically a reduction in cytochrome c oxidase (complex IV)
    activity. This is a supporting biochemical finding rather than a
    variant-specific test.
  diagnosis_term:
    preferred_term: respiratory chain enzyme activity measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain enzyme analysis in cultured lymphocytes from the proband revealed a significant reduction in cytochrome c oxidase activity."
    explanation: >-
      Reports the respiratory chain enzymology finding that corroborates the
      oxidative phosphorylation defect in the proband.
pathophysiology:
- name: MT-RNR1 m.T1095C Impairs Mitochondrial Translation
  biological_scale: MOLECULAR
  description: >-
    The heteroplasmic m.T1095C mutation lies in the mitochondrially encoded 12S
    rRNA (MT-RNR1) and is predicted to disrupt a highly conserved loop of the
    small ribosomal subunit that is important for initiation of mitochondrial
    protein synthesis, impairing mitochondrial translation of respiratory-chain
    subunits.
  genes:
  - preferred_term: MT-RNR1
    term:
      id: hgnc:7470
      label: MT-RNR1
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary structure predicts that this mutation disrupts a highly conserved loop in the small subunit ribosomal RNA, which is important in the initiation of mitochondrial protein synthesis."
    explanation: >-
      Grounds the initiating molecular lesion as disruption of small-subunit
      rRNA structure required for mitochondrial protein synthesis.
  downstream:
  - target: Respiratory Chain (Oxidative Phosphorylation) Deficiency
    description: >-
      Impaired mitochondrial translation of respiratory-chain subunits produces
      a downstream oxidative phosphorylation defect.
- name: Respiratory Chain (Oxidative Phosphorylation) Deficiency
  biological_scale: MOLECULAR
  description: >-
    The translation defect produces a respiratory-chain / oxidative
    phosphorylation deficiency. In the proband, respiratory-chain enzymology
    showed a significant reduction in cytochrome c oxidase (complex IV) activity;
    transmitochondrial cybrids carrying the mutation additionally showed reduced
    complex II/III activity and selective depletion of mitochondrial glutathione,
    with attendant oxidative stress.
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:11079536
    reference_title: "A novel mitochondrial 12SrRNA point mutation in parkinsonism, deafness, and neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain enzyme analysis in cultured lymphocytes from the proband revealed a significant reduction in cytochrome c oxidase activity."
    explanation: >-
      Direct patient-derived evidence of the complex IV (cytochrome c oxidase)
      deficiency produced by the mutation.
  - reference: PMID:22735573
    reference_title: "The mitochondrial T1095C mutation increases gentamicin-mediated apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a transmitochondrial cybrid line derived from the proband of this family shows selective depletion of mitochondrial glutathione and decreases in the activity of complex II/III"
    explanation: >-
      Cybrid transfer of the patient mtDNA reproduces the respiratory-chain
      deficiency and glutathione depletion, confirming the mtDNA-borne defect.
  downstream:
  - target: Aminoglycoside-Sensitized Apoptosis
    description: >-
      Respiratory-chain deficiency and glutathione depletion sensitize cells to
      aminoglycoside-induced apoptosis.
  - target: Selective Dopaminergic Neuronal Vulnerability
    description: >-
      Energy deficit and oxidative stress render high-demand neurons selectively
      vulnerable.
  - target: Peripheral Neuropathy
    description: >-
      The oxidative phosphorylation deficit in metabolically demanding
      peripheral nerve is the inferred basis of the sensory neuropathy; it is
      not separately demonstrated at the nerve level in the reported pedigree.
- name: Aminoglycoside-Sensitized Apoptosis
  biological_scale: CELLULAR
  description: >-
    Because m.T1095C lies in the same 12S rRNA gene (MT-RNR1) that harbors the
    classic aminoglycoside-ototoxicity variants, mutant cells are hypersensitive
    to aminoglycoside antibiotics, responding with a ~10-fold increase in
    apoptosis. This links the mutation to the aminoglycoside-sensitive
    sensorineural deafness and underlies the pharmacogenomic contraindication.
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:22735573
    reference_title: "The mitochondrial T1095C mutation increases gentamicin-mediated apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "when exposed to an aminoglycoside antibiotic these cells responded with a ten-fold increase in the number of apoptotic cells compared to controls"
    explanation: >-
      Quantifies the aminoglycoside hypersensitivity (ten-fold increased
      apoptosis) conferred by the mutation. The cybrid-derived measurement is
      not hair-cell-specific; the cochlear hair cell is the illustrative
      target tissue for the aminoglycoside-sensitive deafness.
  downstream:
  - target: Sensorineural Hearing Impairment
    description: >-
      Aminoglycoside-triggered apoptosis in cochlear hair cells is the basis of
      the aminoglycoside-sensitive sensorineural hearing loss.
- name: Selective Dopaminergic Neuronal Vulnerability
  biological_scale: CELLULAR
  description: >-
    The bioenergetic deficit and oxidative stress preferentially affect
    metabolically demanding nigrostriatal dopaminergic neurons, producing the
    levodopa-responsive parkinsonism of the syndrome. Nigral dopaminergic
    involvement is inferred from the clinical, levodopa-responsive parkinsonism
    rather than directly demonstrated in this pedigree, whose functional data
    derive from proband lymphocytes and transmitochondrial cybrids.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:26979109
    reference_title: "Mitochondrial DNA homeostasis is essential for nigrostriatal integrity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Nigrostriatal degeneration occurred exclusively in patients with defective mtDNA replication and maintenance."
    explanation: >-
      Direct counter-evidence to this node as stated. DAT imaging across 21
      patients with mitochondrial disease found nigrostriatal degeneration only
      where mtDNA replication/maintenance was defective, and none in carriers of
      primary mtDNA point mutations — the class m.T1095C belongs to. It does not
      refute the levodopa-responsive parkinsonism observed in the pedigree, but
      it does argue that a primary point mutation is not by itself sufficient to
      produce nigral degeneration, so the inferred route from OXPHOS deficiency
      to the motor phenotype here remains unconfirmed. Recorded as REFUTE rather
      than removed so the tension stays visible; see the
      mtrnr1_t1095c_nigral_mechanism discussion.
  downstream:
  - target: Parkinsonism
    description: >-
      Selective nigrostriatal dopaminergic vulnerability produces the
      levodopa-responsive parkinsonian syndrome.
  - target: Bradykinesia
    description: Manifests as bradykinesia, a cardinal parkinsonian sign.
  - target: Resting Tremor
    description: Manifests as resting tremor, a cardinal parkinsonian sign.
  - target: Rigidity
    description: Manifests as rigidity, a cardinal parkinsonian sign.

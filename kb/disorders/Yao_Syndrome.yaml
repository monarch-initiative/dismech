  description: >-
    YAOS does not follow a simple Mendelian pattern. Disease is associated with
    low-penetrance NOD2 susceptibility variants (chiefly IVS8+158 and R702W),
    is sporadic in the large majority of patients, and is thought to require
    additional genetic background (including digenic/oligogenic combinations
    with other autoinflammatory genes) and environmental triggers for clinical
    expression. Familial clustering occurs in a minority of families.
  evidence:

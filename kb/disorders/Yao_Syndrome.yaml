histopathology:
- name: Nongranulomatous spongiotic dermatitis
  description: >-
    Skin biopsies characteristically show spongiotic dermatitis with a sparse
    mixed lymphocytic and neutrophilic infiltrate and no non-caseating
    granulomas or vasculitis, which is a key contrast with Blau syndrome and
    sarcoidosis. The findings are supportive rather than diagnostic.
  evidence:
  - reference: PMID:39006711
    reference_title: "Canakinumab in Yao Syndrome: Insights From a Comprehensive Case Report and Literature Review ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "presenting as erythematous plaques and patches that may persist for days to weeks, often histologically identified as spongiotic dermatitis"
    explanation: Review documents spongiotic dermatitis as the typical skin histology.
  - reference: PMID:36186408
    reference_title: Treatment of refractory Yao syndrome with canakinumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sparse superficial polymorphic inflammatory infiltrate consisting mainly of lymphocytes; few eosinophils and neutrophils. No evidence of vasculitis."
    explanation: Case biopsy shows a mixed, non-vasculitic, non-granulomatous infiltrate.
  - reference: PMID:42388282
    reference_title: "Yao syndrome: Report of 3 cases with a family history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "on histopathology YAOS typically presents with nonspecific spongiotic dermatitis"
    explanation: Independent series confirms the nonspecific spongiotic pattern.
diagnosis:

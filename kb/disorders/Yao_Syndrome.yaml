clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Chronic relapsing-remitting flares cause substantial morbidity and chronic
    pain, but the disease uncommonly damages solid organs and has not been
    associated with increased mortality in reported cohorts.
  evidence:
  - reference: PMID:27984003
    reference_title: A Systematic Analysis of Treatment and Outcomes of NOD2-Associated Autoinflammatory Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "13% of the 52 patients had somewhat physical impairment, and there was no mortality during the follow-up."
    explanation: Quantifies moderate functional impairment without excess mortality.
epidemiology:
- name: Female and white predominance in referral cohorts
  description: >-
    North American cohorts report roughly 70-80% women and near-exclusively
    white patients; a Chinese cohort reported a more balanced sex ratio,
    indicating that the demographic skew is at least partly ascertainment.
  evidence:
  - reference: PMID:27984003
    reference_title: A Systematic Analysis of Treatment and Outcomes of NOD2-Associated Autoinflammatory Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 52 Yao syndrome patients, all were white, and 72% were women."
    explanation: Cleveland Clinic cohort demographics.
  - reference: PMID:39430755
    reference_title: "Clinical phenotype, NOD2 genotypes, and treatment observations in Yao syndrome: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen patients (81.8%) were female and twenty (90.9%) were White."
    explanation: Independent Mayo Clinic series reproduces the demographic skew.
  - reference: PMID:39290705
    reference_title: Expanding clinical characteristics and genotypic profiling of Yao syndrome in Chinese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to the Caucasian cohort, our cohort exhibited a more balanced gender ratio"
    explanation: The Chinese cohort shows a different sex ratio, arguing for ascertainment effects.
- name: Adult onset with long diagnostic delay
  description: >-
    Mean or median onset age is reported between about 24 and 42 years across
    cohorts, with a median disease duration of roughly a decade before
    diagnosis.
  evidence:
  - reference: PMID:26070941
    reference_title: "NOD2-associated autoinflammatory disease: a large cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset was 33.5 years and the median disease duration at diagnosis was 10.7 years."
    explanation: Founding cohort onset age and diagnostic delay.
  - reference: PMID:39278218
    reference_title: "Yao Syndrome: An Overview of Genotypic Associations, Clinical Manifestations, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mean age of disease onset is between 36 and 42 years."
    explanation: Pooled review figure across Yao and non-Yao authored series.
progression:
- phase: Relapsing-remitting flares
  notes: >-
    Flares last days to weeks and are separated by asymptomatic intervals of
    weeks to months; each episode is self-limited.
  evidence:
  - reference: PMID:30159790
    reference_title: A Chinese case series of Yao syndrome and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent fever occurred in all patients and each febrile episode lasted several days to several weeks, and asymptomatic intervals ranged from several weeks to several months."
    explanation: Describes flare duration and inter-flare intervals.
- phase: Long-term outcome
  notes: >-
    No mortality was observed in the largest treatment-outcome cohort, but a
    minority develop chronic pain and physical impairment.
  evidence:
  - reference: PMID:27984003
    reference_title: A Systematic Analysis of Treatment and Outcomes of NOD2-Associated Autoinflammatory Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a systemic disease, Yao syndrome uncommonly affects the solid internal organs, but it can be complicated with chronic pain syndrome and even disability."
    explanation: Solid-organ involvement is uncommon; chronic pain and disability are the main long-term burden.
pathophysiology:
- name: NOD2 Low-Penetrance Susceptibility Variants
  description: >-
    Germline low-frequency, low-penetrance NOD2 variants - chiefly the
    deep-intronic IVS8+158 and the missense R702W, alone or co-inherited, with
    additional L1007fs and V955I - are the genetic substrate of YAOS. They are
    modeled as susceptibility rather than deterministic alleles because they are
    common in the general population and most carriers never develop disease.
    YAOS-associated coding variants cluster in and around the central
    nucleotide-binding domain, distinct from the LRR-region variants that
    predispose to Crohn disease.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  gene:
    preferred_term: NOD2
    term:
      id: hgnc:5331
      label: NOD2
  downstream:
  - target: Aberrant NOD2 Pathway Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered NOD2 transcript level and signaling responsiveness in innate immune cells
  evidence:
  - reference: PMID:26070941
    reference_title: "NOD2-associated autoinflammatory disease: a large cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Associated NOD2 variants were primarily IVS8(+158) or compound IVS8(+158) and R702W."
    explanation: Establishes the characteristic YAOS genotype profile.
  - reference: PMID:23352252
    reference_title: "Nucleotide-binding oligomerization domain containing 2: structure, function, and diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the variants in the nucleotide-binding domain (NBD) and in between the NBD and LRR are associated with Blau syndrome and NAID, respectively."
    explanation: Locates the NAID/YAOS-associated variants in the NBD region, distinct from Crohn LRR variants.
  - reference: PMID:42169997
    reference_title: "Not getting the nod: The case against Yao syndrome."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Approximately one in five people is heterozygous for c.2717+158C>T in the gnomAD database, while one in 12 is heterozygous for p.Arg702Trp in gnomAD."
    explanation: The population carrier frequency of the defining alleles far exceeds any plausible disease prevalence, arguing against them being disease-defining.
- name: Aberrant NOD2 Pathway Activation
  description: >-
    NOD2 senses bacterial muramyl dipeptide and signals through RIP2 to activate
    p38 MAPK and canonical NF-kappaB. In YAOS peripheral blood mononuclear cells
    NOD2 transcript level and basal p38 MAPK activity are elevated, and
    phospho-RIP2, p65 and p38 are increased in patient cells and tissues.
    Signaling is genotype-divergent: MDP-stimulated NF-kappaB activity and TNF
    secretion are suppressed in the IVS8+158/R702W haplotype, so the disease
    cannot be reduced to uniform NOD2 gain of function.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

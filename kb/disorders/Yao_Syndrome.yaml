    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the workup including stool testing, gastrointestinal-related bloodwork, and endoscopic examinations with biopsies was normal."
    explanation: Documents that the exclusionary GI workup is characteristically normal in YAOS.
differential_diagnoses:
- name: Blau syndrome
  disease_term:
    preferred_term: Blau syndrome
    term:
      id: MONDO:0008523
      label: Blau syndrome
  description: >-
    The Mendelian NOD2 disorder. Distinguished from YAOS by childhood onset,
    autosomal dominant high-penetrance NACHT-domain variants, non-caseating
    granulomas, and the granulomatous dermatitis-arthritis-uveitis triad.
  distinguishing_features:
  - Childhood onset with autosomal dominant, high-penetrance inheritance
  - Non-caseating granulomas on biopsy, absent in YAOS
  - Granulomatous uveitis and the classic triad
  evidence:
  - reference: PMID:41678017
    reference_title: NOD2-Related Multisystem Inflammatory Disorders and Recent Advances.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Blau syndrome is an autosomal dominant disease primarily occurring in children and is caused by highly penetrant NOD2 variants."
    explanation: Contrasts the high-penetrance Mendelian genetics of Blau syndrome with YAOS.
  - reference: PMID:36186408
    reference_title: Treatment of refractory Yao syndrome with canakinumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, BS is primarily a pediatric disease characterized by a triad of granulomatous dermatitis, uveitis, and inflammatory arthritis."
    explanation: Gives the pediatric granulomatous triad that distinguishes Blau syndrome.
- name: Crohn disease
  disease_term:
    preferred_term: Crohn disease
    term:
      id: MONDO:0005011
      label: Crohn disease
  description: >-
    Shares the three main NOD2 susceptibility variants but is a granulomatous,
    transmural inflammatory bowel disease; endoscopy and biopsy separate it from
    the nonspecific GI symptoms of YAOS.
  distinguishing_features:
  - Endoscopic and transmural granulomatous bowel disease
  - Bloody diarrhea more typical of Crohn disease
  - YAOS endoscopy and biopsies are typically normal
  evidence:
  - reference: PMID:36186408
    reference_title: Treatment of refractory Yao syndrome with canakinumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of bloody diarrhea may be more indicative of YAOS."
    explanation: Names a clinical feature separating YAOS GI symptoms from Crohn disease.
  - reference: PMID:26070941
    reference_title: "NOD2-associated autoinflammatory disease: a large cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It differs phenotypically from Crohn's disease with a distinct genotype profile."
    explanation: The founding cohort explicitly separates the two on phenotype and genotype.
- name: Familial Mediterranean fever
  disease_term:
    preferred_term: familial Mediterranean fever
    term:
      id: MONDO:0018088
      label: familial Mediterranean fever
  description: >-
    A MEFV-associated periodic fever syndrome that YAOS can mimic; patients are
    often treated with colchicine before the correct diagnosis, and both
    genotypes occasionally co-occur.
  distinguishing_features:
  - MEFV pathogenic variants and colchicine responsiveness
  - Colchicine produces minimal response in YAOS
  evidence:
  - reference: PMID:36467985
    reference_title: "NOD2 Versus MEFV: Differential Diagnosis of Yao Syndrome and Familial Mediterranean Fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients were initially thought to have MEditerranean FeVer (MEFV)-negative FMF and received treatment with colchicine."
    explanation: Documents the diagnostic confusion with FMF in a YAOS case series.
- name: Sarcoidosis
  disease_term:
    preferred_term: sarcoidosis
    term:
      id: MONDO:0019338
      label: sarcoidosis
  description: >-
    Adult sarcoidosis is granulomatous and has no established NOD2 variant
    association, unlike YAOS, which is non-granulomatous.
  distinguishing_features:
  - Non-caseating granulomas on tissue biopsy
  - No established NOD2 variant association in adult sarcoidosis
  evidence:
  - reference: PMID:23352252
    reference_title: "Nucleotide-binding oligomerization domain containing 2: structure, function, and diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No disease association with the gene variants has been found in rheumatoid arthritis, systemic lupus erythematosus, ankylosing spondylitis, psoriasis/psoriatic arthritis, adult sarcoidosis, granulomatous polyangiitis, or multiple sclerosis."
    explanation: States the absence of a NOD2 association in adult sarcoidosis.
- name: Sjogren syndrome
  disease_term:
    preferred_term: Sjogren syndrome
    term:
      id: MONDO:0010030
      label: Sjogren syndrome
  description: >-
    Primary Sjogren syndrome produces sicca symptoms but with high-titer
    anti-SSA/SSB autoantibodies, whereas YAOS sicca-like symptoms occur with a
    negative autoantibody workup.
  distinguishing_features:
  - High-titer anti-SSA/SSB autoantibodies in Sjogren syndrome
  - Negative autoantibody workup is an exclusion criterion for YAOS
  evidence:
  - reference: PMID:21914217
    reference_title: A new category of autoinflammatory disease associated with NOD2 gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All seven patients had negative tests for autoantibodies but carried the NOD2 gene mutation IVS8+158 with four having concurrent R702W mutation."
    explanation: Negative autoantibody testing is intrinsic to the YAOS definition, separating it from Sjogren syndrome.
genetic:
- name: NOD2
  gene_term:
    preferred_term: NOD2
    term:
      id: hgnc:5331
      label: NOD2
  association: Low-penetrance susceptibility variants
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  features: >-
    NOD2 (CARD15) on 16q12.1 encodes a cytosolic pattern-recognition receptor for
    bacterial muramyl dipeptide. YAOS is associated with a small set of
    low-frequency, low-penetrance variants: the deep-intronic IVS8+158
    (c.2717+158C>T, rs5743289) and the missense R702W (historically
    p.Arg702Trp; MANE NM_001370466.1 reannotates it c.2023C>T p.Arg675Trp),
    frequently co-inherited in cis, plus L1007fs (c.3019dup) and V955I
    (c.2863G>A). Many patients carry two or more variants, and
    digenic/oligogenic combinations with other autoinflammatory genes are
    common. These are largely the same variants that predispose to Crohn
    disease, which is part of why the gene-disease relationship is contested.
    relationship_type is SUSCEPTIBILITY rather than CAUSATIVE for that reason.
  variants:
  - name: IVS8+158
    description: >-
      Deep-intronic NOD2 c.2717+158C>T (rs5743289), the most prevalent single
      YAOS-associated variant, alone or compound with R702W. It does not alter
      intron-8 splicing, and it is common in the general population.
    evidence:
    - reference: PMID:26070941
      reference_title: "NOD2-associated autoinflammatory disease: a large cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Associated NOD2 variants were primarily IVS8(+158) or compound IVS8(+158) and R702W."
      explanation: Identifies IVS8+158, alone or with R702W, as the principal genotype.
  - name: R702W
    description: >-
      Missense p.Arg702Trp, a common Crohn-associated allele that co-occurs with
      IVS8+158 in a YAOS haplotype and is associated with suppressed
      MDP-stimulated NF-kappaB activity and TNF secretion.
    evidence:
    - reference: PMID:29471675
      reference_title: "Alterations in nucleotide-binding oligomerization domain-2 expression, pathway activation, and cytokine production in Yao syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "all YAOS patients were heterozygous for the NOD2 IVS8+158 variant (IVS8+158) and four patients also carried a concurrent NOD2 R702W variant (IVS8+158/R702W haplotype)."
      explanation: Defines the IVS8+158/R702W haplotype that was studied functionally.
  - name: L1007fs and V955I
    description: >-
      Additional YAOS-associated variants (L1007fs c.3019dup; V955I c.2863G>A),
      usually seen in combination with IVS8+158.
    evidence:
    - reference: PMID:39372397
      reference_title: "Comprehensive clinical phenotype, genotype and therapy in Yao syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "individual patients were often identified to carry two or more variants that usually included IVS8 + 158/R702W, IVS8 + 158/L1007fs, IVS8 + 158/V955I, IVS8 + 158/other, or NOD2/variants in other SAID genes."
      explanation: Lists the recurrent multi-variant combinations including L1007fs and V955I.
  - name: Q902K and other rare variants
    description: >-
      Rare missense variants, including Q902K, R541P and Y514H, were identified
      in Chinese patients whose phenotype differed from the Caucasian cohorts.
      Q902K did not increase NF-kappaB reporter activity in a reconstitution
      assay, so its functional consequence is unresolved.
    evidence:
    - reference: PMID:30159790
      reference_title: A Chinese case series of Yao syndrome and literature review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three variants in NOD2 were identified, including Q902K, R541P, and Y514H."
      explanation: Documents the rare variants found outside Caucasian cohorts.
  evidence:
  - reference: PMID:26070941
    reference_title: "NOD2-associated autoinflammatory disease: a large cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study underscores the NOD2 genotype association with NAID, which is a genetically complex multisystem disorder."
    explanation: Frames the NOD2 relationship as an association in a genetically complex disorder rather than Mendelian causation.
  - reference: PMID:41207643
    reference_title: Utilization of the All of Us Research Program in a study of genetics in Yao syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that NOD2 variant IVS8 + 158 (JW1) was significantly more prevalent in the patient population (odds ratio [OR] = 1.32, P = .006)."
    explanation: Case-control genetics against 128,196 population controls supports enrichment, with a modest odds ratio.
  - reference: PMID:37928541
    reference_title: Implications of combined NOD2 and other gene mutations in autoinflammatory diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic variant combinations in SAID patients were digenic in 66% (NOD2/MEFV, NOD2/NLRP12, NOD2/NLRP3, and NOD2/TNFRSF1A) and oligogenic in 34% of cases."
    explanation: Supports frequent digenic and oligogenic co-inheritance with other autoinflammatory genes.
  - reference: PMID:42169997
    reference_title: "Not getting the nod: The case against Yao syndrome."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "However, to date, there is insufficient evidence to link the broad phenotypes described in Yao syndrome to variants in NOD2."
    explanation: A peer-reviewed argument that the gene-disease relationship is not established.
environmental:
- name: SARS-CoV-2 infection

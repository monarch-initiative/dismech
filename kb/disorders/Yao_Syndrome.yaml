treatments:
- name: Glucocorticoid therapy
  description: >-
    Systemic glucocorticoids are a first-line option that rapidly reduces flare
    severity and duration. By contrast colchicine and NSAIDs, useful in other
    periodic fever syndromes, produce minimal response in YAOS.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NAID was sporadic in 93% of cases."
    explanation: The founding cohort establishes that the disease is overwhelmingly sporadic rather than Mendelian.
  - reference: PMID:42388282
    reference_title: "Yao syndrome: Report of 3 cases with a family history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family of a mother, daughter, and son presented to dermatology with varying symptoms in relation to confirmed NOD2 mutations."
    explanation: Documents the minority of familial cases with shared NOD2 variants.

- name: Systemic Autoinflammation
  description: >-
    Cytokine-driven sterile innate-immune inflammation produces recurrent
    self-limited multi-organ flares affecting skin, joints, gastrointestinal
    tract, serosal surfaces and periorbital and distal-limb soft tissue,
    together with fever and elevated acute-phase reactants, without high-titer
    autoantibodies. Flares generally do not progress to irreversible organ
    damage.
  biological_scale: ORGANISM

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Yao syndrome (YAOS), a recently reported novel disease, possesses characteristic clinical pattern or constellation of recurrent fever, dermatitis, arthralgia, distal leg swelling, gastrointestinal, sicca-like symptoms, and eyelid swelling among others."
    explanation: Recent review enumerating the multi-organ constellation modeled by this node.
mechanistic_hypotheses:
- hypothesis_group_id: yaos_nod2_dysregulated_signaling
  hypothesis_label: NOD2-RIP2-MAPK/IL-6 dysregulated-signaling model
  status: EMERGING
  description: >-
    The leading mechanistic model holds that YAOS-associated NOD2 variants
    produce a dysregulated state of NOD2-RIP2-MAPK and IL-6 signaling in innate
    immune cells rather than a simple loss or gain of function. Support comes
    from patient PBMC, synovial and mucosal studies, but the model is unproven:
    genotype effects are heterogeneous (Q902K did not raise NF-kappaB reporter
    activity; IVS8+158/R702W suppresses NF-kappaB and TNF), the studies involve
    very few patients, and no variant has an established deterministic
    functional consequence.
  evidence:
  - reference: PMID:29471675
    reference_title: "Alterations in nucleotide-binding oligomerization domain-2 expression, pathway activation, and cytokine production in Yao syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our study demonstrates for the first time that NOD2 expression and pathway activation are aberrant in YAOS, and specific NOD2 genotypes result in distinct NOD2 expression and cytokine profiles."
    explanation: First functional evidence that NOD2 signaling is aberrant and genotype-dependent in patient cells.
  - reference: PMID:38395960
    reference_title: Identifying functional dysregulation of NOD2 variant Q902K in patients with Yao syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NOD2-RIP2-MAPK pathway might play a pivotal role in the pathogenesis of YAOS."
    explanation: Proposes the NOD2-RIP2-MAPK axis as pivotal, in hedged terms.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with HCs, P-RIP2, p-p65, p-p38, p-ERK, and p-JNK notably increased in PBMCs of a patient with YAOS."
    explanation: Shows hyperphosphorylation across the NOD2-RIP2-MAPK/NF-kappaB cascade.
  - reference: PMID:38395960

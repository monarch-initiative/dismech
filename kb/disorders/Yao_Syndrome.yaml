    explanation: Supports whole-gene NOD2 sequencing rather than limited hotspot testing.
- name: Yao clinical, molecular and exclusion criteria
  description: >-
    Diagnosis integrates major clinical features (periodic fever, dermatitis),
    minor features (arthritis or distal leg swelling, GI symptoms, sicca-like
    symptoms, serositis), a molecular NOD2 criterion, and exclusion of
    autoimmune disease, inflammatory bowel disease, Blau syndrome, sarcoidosis
    and other monogenic autoinflammatory syndromes.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:39006711
    reference_title: "Canakinumab in Yao Syndrome: Insights From a Comprehensive Case Report and Literature Review ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis of Yao syndrome is contingent upon the recurrence of specific symptoms, the identification of characteristic genetic mutations, and the exclusion of other autoinflammatory disorders"
    explanation: Summarizes the three-part structure of the diagnostic criteria.
- name: Endoscopic and stool evaluation to exclude inflammatory bowel disease
  description: >-
    Because GI symptoms are near-universal and NOD2 variants overlap with Crohn
    disease, endoscopy with biopsy and stool studies are used to exclude IBD;
    in YAOS this workup is typically normal.
  diagnosis_term:

        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "NOD2 transcript level and basal p38 mitogen-activated protein kinase (MAPK) activity were significantly elevated in PBMCs from IVS8+158 YAOS patients."
        explanation: Reports the measurement behind this readout.
    evidence:

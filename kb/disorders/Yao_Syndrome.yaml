    explanation: A reconstitution assay found no NF-kappaB gain of function for Q902K, qualifying any simple activating-allele model.
  - reference: PMID:24324812
    reference_title: Nod2 activates NF-kB in CD4+ T cells but its expression is dispensable for T cell-induced colitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Nod2 stimulation with muramyl dipeptide (MDP) led to a nuclear accumulation of c-Rel NF-kB subunit."
    explanation: Model-organism evidence that NOD2 engages NF-kappaB, supporting the pathway node rather than the human phenotype.
- name: Dysregulated Proinflammatory Cytokine Production
  description: >-
    Aberrant NOD2 signaling drives excess proinflammatory cytokine production,
    most prominently IL-6, with contributions from IL-1beta and TNF. Basal and
    MDP-enhanced IL-6 secretion is elevated in IVS8+158 carriers, providing the
    rationale for IL-6 and IL-1 blockade. Resting plasma cytokine levels can be
    normal, so the dysregulation is most evident on cellular stimulation rather
    than as a persistent systemic elevation.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

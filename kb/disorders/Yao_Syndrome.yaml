notes: >-
  Lump/split: curated as ONE Disease entry. YAOS is a single clinical syndrome
  defined by the Yao criteria plus NOD2 susceptibility variants; the genotype
  groups (IVS8+158 alone, IVS8+158/R702W, IVS8+158/L1007fs, IVS8+158/V955I, and
  rare alleles such as Q902K) are modeled as variants and as a mechanistic
  branch rather than as has_subtypes, because they share one phenotype
  definition and one management pathway and no cohort treats them as distinct
  clinical entities. Kept clearly distinct from the sibling Mendelian NOD2
  disorder Blau syndrome (kb/disorders/Blau_Syndrome.yaml): Blau is
  childhood-onset, autosomal dominant, high-penetrance and granulomatous,
  whereas YAOS is adult-onset, non-Mendelian, low-penetrance and
  non-granulomatous, and the two are separated in the differential_diagnoses
  block. Causality is recorded honestly rather than assumed: relationship_type
  is SUSCEPTIBILITY (not CAUSATIVE), the signaling mechanism is an EMERGING
  mechanistic hypothesis, mechanism nodes carry mechanism_confidence
  PROVISIONAL, and the dispute over whether the entity exists at all is a
  CONTROVERSY discussion carrying REFUTE evidence from PMID:42169997. category
  is Complex rather than Mendelian to reflect the genetically transitional,
  multifactorial architecture. No GeneReviews chapter exists for Yao syndrome or
  NOD2 (PubMed search for "Yao syndrome GeneReviews[All Fields]" returned zero
  results), so no GeneReviews baseline was mined or tagged. Environmental triggers reported in
  the literature (COVID-19 infection or vaccination, gastrointestinal surgery)
  are modeled in the environmental section, each linked to the Systemic
  Autoinflammation node with environmental_effect TRIGGERS and cited to the
  full text of PMID:39372397. Only the SARS-CoV-2 infection exposure could be
  bound to an ontology term (ECTO:3000001, exposure to virus); ECTO carries no
  term for vaccination or for surgery, and the per-entry notes record which
  searches were run.
review_notes: >-
  Curated from a Perplexity deep-research report treated strictly as leads.
  That report's own Term Validation flagged 20 mislabelled CURIEs and 2
  unresolved ones, so no CURIE was copied from it; every term here was resolved
  independently with OAK against OLS, and hgnc:5331 was checked against
  cache/hgnc/terms.csv. Specifically rejected from the report: HP:0004430
  (report called it "Autoinflammatory disease"; HPO calls it Severe combined
  immunodeficiency), HP:0002108 ("Pleuritis"; actually Spontaneous
  pneumothorax - the correct Pleuritis term is HP:0002102), HP:0001634
  ("Pericarditis"; actually Mitral valve prolapse - correct term HP:0001701),
  HP:0002619 ("Peripheral edema"; actually Varicose veins), HP:0001065
  ("Erythematous skin patches"; actually Striae distensae), HP:0001742 ("Ankle
  swelling"; actually Nasal congestion), NCIT:C34588 ("Sulfasalazine"; actually
  Enuresis), NCIT:C20396 ("Tumor Necrosis Factor alpha"; actually Protein
  Phosphatase 2A Subunit Gene), GO:1900746 ("positive regulation of p38 MAPK
  cascade"; actually a VEGF signaling term - the p38 term used here is
  GO:0038066), and the unresolved HP:0001570 and HP:0001565. R702W is written
  with its historical p.Arg702Trp label; MANE NM_001370466.1 reannotates it as
  c.2023C>T p.Arg675Trp, which is recorded in the genetic features text.
  Several references were fetched during curation but could not be cited
  because the retrieved PubMed records carry no abstract text, leaving no
  quotable sentence; their caches were therefore not committed: PMID:23584365,
  PMID:24085756, PMID:24255163, PMID:27039238, PMID:27851691, PMID:30601168,
  PMID:31541750, PMID:36858152, PMID:37124443, PMID:39151691, PMID:40449031
  and PMID:42624807. PMID:26509073 resolved with an abstract but was dropped as
  redundant with stronger sources, and the 2024 Frontiers cohort is cited by
  PMID (PMID:39372397) rather than by its DOI.

  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.5
  rate_low: 1.0
  rate_high: 10.0
  notes: >-
    Estimated at 1-10 per 100,000 in the adult population, with female and
    white predominance; ascertainment is biased toward North American referral
    centers and no population-based study exists.

  description: >-
    Targeted NOD2 sequencing, usually within an autoinflammatory or periodic
    fever gene panel, to demonstrate a susceptibility variant such as IVS8+158,
    R702W, L1007fs or V955I. A molecular criterion is required for diagnosis,
    and whole-gene rather than hotspot sequencing is recommended.

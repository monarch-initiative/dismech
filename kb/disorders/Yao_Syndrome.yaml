  evidence:
  - reference: PMID:21914217
    reference_title: A new category of autoinflammatory disease associated with NOD2 gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients characteristically presented with periodic fever, dermatitis and inflammatory polyarthritis."

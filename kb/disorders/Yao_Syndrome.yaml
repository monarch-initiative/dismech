- name: NOD2 Q902K reporter transfection in HEK293T cells
  experimental_model_type: CELL_LINE
  description: >-
    HEK293T cells transfected with wild-type or Q902K NOD2 plus an NF-kappaB
    luciferase reporter, used to test whether the Q902K variant activates
    NF-kappaB. It did not, which is a negative result for a simple
    activating-allele model of this variant.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38395960
  modeled_mechanisms:
  - target: Aberrant NOD2 Pathway Activation
    relationship: FAILS_TO_RECAPITULATE
    model_scale: MOLECULAR
    description: >-
      The reconstitution assay did not reproduce increased NF-kappaB activation
      for the Q902K variant, so it does not support this node for that allele.
    limitations: >-
      Transient overexpression in a non-immune cell line lacks the endogenous
      regulation, myeloid context and co-inherited variants of patient cells, so
      a negative reporter result does not exclude a pathogenic effect in vivo;
      it does show that Q902K is not a straightforward NF-kappaB-activating
      allele.
    evidence:
    - reference: PMID:38395960
      reference_title: Identifying functional dysregulation of NOD2 variant Q902K in patients with Yao syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We initially conducted dual luciferase assays to further investigate the function of NOD2 Q902K in HEK293T cells and found that Q902K did not affect the NF-κB transcription factor."
      explanation: The negative reporter result that this link records.
  evidence:
  - reference: PMID:38395960
    reference_title: Identifying functional dysregulation of NOD2 variant Q902K in patients with Yao syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NOD2 Q902K-transfected cells did not demonstrate an increase in basal and MDP-stimulated NF-κB activity when compared to wild-type NOD2"
    explanation: Establishes the negative finding for which this model is cited.
discussions:
- discussion_id: controversy_yaos_entity_validity
  prompt: >-
    Is Yao syndrome a genuine NOD2-associated disease entity, or an association
    with variants too common in the population to establish causation?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#NOD2
  - pathophysiology#NOD2 Low-Penetrance Susceptibility Variants
  rationale: >-
    The defining variants are carried by a large fraction of the general
    population (roughly 1 in 5 for IVS8+158, 1 in 12 for R702W in gnomAD), which
    exceeds any plausible disease prevalence, and no adequately powered
    association study has established the link. A 2026 review argues the
    diagnosis should not be used; a 2025 case-control study against 128,196 All
    of Us participants reports significant but modest enrichment (OR 1.32). This
    entry therefore models NOD2 as SUSCEPTIBILITY and the signaling mechanism as
    EMERGING rather than asserting causation.
  evidence:
  - reference: PMID:42169997
    reference_title: "Not getting the nod: The case against Yao syndrome."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "As a result, given the current lack of evidence for the existence of Yao syndrome, this diagnosis should not be used."
    explanation: The strongest published statement against the entity's validity.
  - reference: PMID:42169997
    reference_title: "Not getting the nod: The case against Yao syndrome."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Demonstrating such a link would require large-scale association studies, which have not been performed."
    explanation: Identifies the specific evidential gap behind the dispute.
  - reference: PMID:41207643
    reference_title: Utilization of the All of Us Research Program in a study of genetics in Yao syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings confirm and further expand the association of these individual and combined NOD2 variants with Yao syndrome."
    explanation: The case-control study offering support for the association.
- discussion_id: gap_yaos_first_line_therapy
  prompt: Which treatment should be first-line for Yao syndrome, given the absence of controlled trials?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  rationale: >-
    All treatment evidence is from retrospective cohorts and case reports with
    no randomized trials, and cohorts disagree (for example anti-TNF response
    was frequent in a Chinese cohort and poor in a Greek one). First-line choice
    therefore rests on uncontrolled experience.
  evidence:
  - reference: PMID:41122186
    reference_title: "Managing Yao Syndrome: A Case of Beneficial Treatment with Upadacitinib and Leflunomide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first-line treatment options remain unknown due to limited knowledge of the pathophysiology and the absence of robust literature."
    explanation: States the therapeutic knowledge gap directly.
- discussion_id: gap_yaos_gi_symptom_mechanism
  prompt: >-
    Are the near-universal gastrointestinal symptoms of Yao syndrome driven by
    NOD2-mediated mucosal inflammation or by non-inflammatory dysmotility?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Systemic Autoinflammation
  - phenotypes#Chronic gastrointestinal symptoms
  rationale: >-
    GI symptoms occur in essentially every patient, yet endoscopy, biopsy and
    stool studies are typically normal while anorectal manometry is abnormal in
    all tested patients, pointing to dyssynergic defecation rather than mucosal
    inflammation. The causal edge from systemic autoinflammation to GI symptoms
    is therefore recorded as indirect with unknown intermediates.
  evidence:
  - reference: PMID:40711739
    reference_title: Gastrointestinal Manifestations of Yao Syndrome (NOD2-Associated Autoinflammatory Disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bloating and constipation may be driven by dyssynergic defecation."
    explanation: Proposes a non-inflammatory mechanism for the dominant GI symptoms.
  - reference: PMID:40711739
    reference_title: Gastrointestinal Manifestations of Yao Syndrome (NOD2-Associated Autoinflammatory Disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal symptoms of YAOS are universal and severe, and symptoms may arise from both inflammatory and non-inflammatory mechanisms."
    explanation: The study explicitly leaves the mechanism open.

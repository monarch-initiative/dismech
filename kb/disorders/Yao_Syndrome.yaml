name: Yao Syndrome
creation_date: "2026-09-05T06:37:27Z"
category: Complex
description: >-
  Yao syndrome (YAOS), formerly named NOD2-associated autoinflammatory disease
  (NAID), is a systemic autoinflammatory disease characterized by recurrent
  fever, nongranulomatous dermatitis, oligo/polyarthralgia or inflammatory
  arthritis with distal lower-extremity swelling, chronic gastrointestinal
  symptoms, sicca-like symptoms, eyelid swelling, and occasional serositis. It
  is genetically associated with specific low-frequency, low-penetrance NOD2
  variants, most consistently the deep-intronic IVS8+158 (c.2717+158C>T,
  rs5743289) and the Crohn-associated missense R702W (p.Arg702Trp), often
  co-inherited, with additional contributions from L1007fs and V955I. Unlike
  the Mendelian NOD2 disorder Blau syndrome, YAOS is adult-onset,
  non-granulomatous, sporadic in most cases, and does not follow a Mendelian
  pattern; it has been framed as a genetically transitional disease between
  monogenic and polygenic disease. Because the associated variants are common
  in the general population, whether NOD2 is genuinely causal or a low-effect
  susceptibility factor remains contested and unresolved.

- name: Chronic non-spherocytic hemolytic anemia
  biological_scale: ORGANISM
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Hemolytic Anemia"
  description: >
    The defining and universal clinical consequence. It presents neonatally with
    anemia, reticulocytosis and jaundice, may require transfusion in the newborn
    period, and settles into a chronic mild anemia in patients without
    neurological involvement.
  evidence:
  - reference: PMID:28571779
    reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GCL deficiency can be an underdiagnosed cause of hemolytic anemia, thus awareness may aid in early diagnosis, appropriate genetic counseling, and management."
    explanation: Frames hemolytic anemia as the presenting and diagnostically decisive manifestation.
- name: Progressive neurological dysfunction
  biological_scale: ORGANISM
  description: >
    A minority of reported patients - 4 of the 12 in the published literature -
    develop progressive neurological disease. The reported constellation spans
    spinocerebellar degeneration with cerebellar atrophy, ataxia, lower-limb
    spasticity, motor-sensory peripheral neuropathy, cognitive impairment and
    myopathy, and may not appear until adulthood. Some of these patients also
    have generalized aminoaciduria, consistent with the gamma-glutamyl cycle's
    role in amino-acid transport. No GCLC genotype has been shown to predict the
    neurological arm, and the mechanism connecting glutathione depletion to
    neurodegeneration in this disorder is unresolved (see the knowledge-gap
    discussion). The node is therefore modelled as a consequence with unknown
    intermediates rather than being wired into a specific neurodegeneration
    module.
  evidence:
  - reference: PMID:28571779
    reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All presented with hemolytic anemia and 4 had additional neurological manifestations including cognitive impairment, neuropathy, ataxia, and myopathy."
    explanation: Enumerates the neurological manifestations and their restriction to a subset of patients.
  - reference: PMID:39359943
    reference_title: "Clinical and Biochemical Analysis of Glutamate-Cysteine Ligase Deficiency Presented with Late-Onset Spinocerebellar Ataxia and Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, no specific GCLC gene mutation has been attributed to the reported neurological constellation of symptoms."
    explanation: Establishes the absence of a genotype-phenotype correlation for the neurological arm.
  - reference: PMID:18024385
    reference_title: "Chronic non-spherocytic hemolytic anemia associated with severe neurological disease due to gamma-glutamylcysteine synthetase deficiency in a patient of Moroccan origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He presented with chronic haemolytic anaemia, delayed psychomotor development and progressive motor sensitive neuropathy of lower extremities."
    explanation: Case documenting the combined hemolytic and progressive neuropathic presentation.

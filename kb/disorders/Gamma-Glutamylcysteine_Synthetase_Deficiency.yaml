    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They all had normal development and neurological examination."
    explanation: >-
      The children homozygous for c.514T>A had normal neurological examinations,
      whereas the same allele was later reported in an adult with spinocerebellar
      degeneration - direct support for the absence of genotype-phenotype
      correlation.
discussions:
- discussion_id: gclc_neurological_arm_mechanism
  prompt: >-
    Why do only some patients with glutamate-cysteine ligase deficiency develop
    progressive spinocerebellar and neuromuscular disease, and by what mechanism
    does glutathione depletion injure the nervous system in this disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive neurological dysfunction
  rationale: >-
    Only 4 of the 12 published patients have neurological involvement, and no
    GCLC genotype predicts it - the same c.514T>A allele appears in children with
    normal neurological examinations and in an adult with late-onset
    spinocerebellar degeneration. The causal edge from glutathione depletion to
    neurodegeneration is therefore curated with unknown intermediates, and this
    node is deliberately not wired to cerebellar_purkinje_degeneration or
    peripheral_axonal_degeneration: asserting conformance would claim a
    mechanistic route the literature does not yet supply. Candidate explanations
    include a modifier locus, tissue-specific residual GCL activity, and
    cumulative oxidative injury that only becomes clinically apparent after
    decades - none of which has been tested.
  proposed_experiments:
  - experiment_id: exp_gclc_neuro_natural_history
    name: Prospective neurological surveillance of a GCLC deficiency cohort
    description: >-
      Follow every genetically confirmed patient with serial neurological
      examination, nerve conduction studies and brain MRI, since the reported
      late-onset case shows a normal childhood examination cannot exclude the
      neurological arm. Pair with tissue-accessible glutathione measurement to
      test whether residual GCL activity outside the erythrocyte, rather than
      genotype, stratifies risk.
  evidence:
  - reference: PMID:39359943
    reference_title: "Clinical and Biochemical Analysis of Glutamate-Cysteine Ligase Deficiency Presented with Late-Onset Spinocerebellar Ataxia and Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, no specific GCLC gene mutation has been attributed to the reported neurological constellation of symptoms."
    explanation: Directly states the unresolved genotype-phenotype question this gap records.
notes: >-
  Curated for IEMbase metabolic work-package WP-006 row 2.1.01.01 (issue #5561).
  NEC preflight: MONDO:0009259 carries `RO:0004003 HGNC:4311 ! GCLC` and
  `xref OMIM:230450`, both matching the seed row, and `RO:0004021 GO:0004357`
  matching the curated molecular function.


  Two modelling decisions worth flagging. First, the neurological arm is
  deliberately left as an INDIRECT_UNKNOWN_INTERMEDIATES edge with a
  KNOWLEDGE_GAP discussion rather than being wired to
  cerebellar_purkinje_degeneration or peripheral_axonal_degeneration. The
  literature reports the association and its restriction to a minority of
  patients, but supplies no mechanism and no genotype correlation, so
  conformance would assert more than the evidence carries. Second, the
  variant-level heterogeneity found in vitro (impaired catalysis for
  Arg127Cys/His370Leu/Pro414Leu versus impaired heterodimer-dependent stability
  for Pro158Leu) is curated as its own upstream node rather than collapsed into
  the enzyme-deficiency node, because it is the target of the only mechanistic
  therapeutic proposal in the literature - promoting GCLC-GCLM heterodimer
  formation.


  Differential note: the closest disorder is glutathione synthetase deficiency
  (GSS), the other glutathione biosynthetic defect, which also causes hemolytic
  anemia. The two are separated by gamma-glutamylcysteine - low here (the block
  is upstream of it) and high in GSS deficiency, where it is cyclised to
  5-oxoproline to give 5-oxoprolinuria and metabolic acidosis. Neither
  5-oxoprolinuria nor metabolic acidosis is a feature of this disorder, and its
  absence is curated as a discriminating point on the "Reduced erythrocyte
  gamma-glutamylcysteine" biochemical record rather than as a phenotype.

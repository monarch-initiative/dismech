prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    Ultra-rare. A 2024 review of the published literature counted 12 cases from
    6 independent families worldwide; a 2025 case report using a different
    counting convention gives nine patients from seven families. No
    population-based prevalence estimate exists, so the published case count is
    the meaningful figure and no numeric rate is asserted.
  evidence:
  - reference: PMID:39359943
    reference_title: "Clinical and Biochemical Analysis of Glutamate-Cysteine Ligase Deficiency Presented with Late-Onset Spinocerebellar Ataxia and Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GCLC deficiency manifesting with hemolysis has been reported in 12 cases worldwide from 6 independent families, with only 4 cases having additional neurological manifestations."
    explanation: Gives the published worldwide case count and the fraction with neurological involvement.
  - reference: PMID:40277844
    reference_title: "Hemolytic Anemia Due to Gamma-Glutamylcysteine Synthetase Deficiency: A Rare Novel Case in an Arab-Muslim Israeli Child."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Gamma-glutamylcysteine synthetase deficiency is a very rare condition that has so far been detected so far in nine patients from seven families worldwide."
    explanation: >-
      A later report gives a lower case count than the 2024 review; marked
      PARTIAL because the two published tallies disagree and neither is a
      population-based estimate.
progression:
- phase: Neonatal-onset hemolytic anemia
  notes: >
    Presentation is typically in the neonatal period with hemolytic anemia,
    reticulocytosis and jaundice, sometimes severe enough to require transfusion.
    In the mild non-neurological form the hemolysis abates after the neonatal
    period, leaving a chronic compensated or mild anemia.
  evidence:
  - reference: PMID:28571779
    reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the children presented with neonatal hemolytic anemia. Beyond the neonatal period, they did not have jaundice or hemolysis, but continued to have mild anemia."
    explanation: Documents neonatal onset followed by a chronic mild anemia in the non-neurological form.
- phase: Divergence into a non-neurological and a neurological course
  notes: >
    Two clinical courses are recognised. Most patients have hemolytic anemia
    alone with normal development. A minority develop progressive neurological
    disease, which in the most recently reported case did not become manifest
    until the sixth decade, so the neurological arm cannot be excluded by a
    normal childhood examination.
  evidence:
  - reference: PMID:28571779
    reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GCL deficiency can have a mild non-neurological phenotype or a more severe phenotype with neurological manifestations."
    explanation: States the two-course clinical division explicitly.
  - reference: PMID:39359943
    reference_title: "Clinical and Biochemical Analysis of Glutamate-Cysteine Ligase Deficiency Presented with Late-Onset Spinocerebellar Ataxia and Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 55-year-old female patient with progressive late-onset ataxia, lower limb spasticity, and chronic hemolytic anemia found to have a GCLC pathogenic variant and low glutathione level."
    explanation: Documents late-onset (sixth-decade) emergence of the neurological arm.
pathophysiology:
- name: Destabilized GCLC-GCLM holoenzyme
  biological_scale: MOLECULAR
  description: >
    Glutamate-cysteine ligase is a heterodimer of a catalytic subunit (GCLC) and
    a regulatory/modifier subunit (GCLM), the latter enhancing catalytic
    efficiency on heterodimer formation. Recombinant characterization of the
    clinical GCLC missense alleles shows that they do not all fail the same way:
    Arg127Cys, His370Leu and Pro414Leu have intrinsically compromised catalysis
    that is largely rescued by adding GCLM, whereas Pro158Leu has near-wild-type
    kinetic constants and is instead inferred to be destabilized in vivo through
    failure to form or persist as the heterodimer. This node captures that
    variant-specific, holoenzyme-level lesion upstream of the measured enzyme
    deficiency.
  genes:
  - preferred_term: GCLC
    term:
      id: hgnc:4311
      label: GCLC
  - preferred_term: GCLM
    term:
      id: hgnc:4312
      label: GCLM
  molecular_functions:
  - preferred_term: glutamate-cysteine ligase activity
    term:
      id: GO:0004357
      label: glutamate-cysteine ligase activity
    modifier: DECREASED
  genetic_context:
    description: >
      Biallelic hypomorphic missense variants in GCLC; reported patients are
      homozygous, frequently in consanguineous kindreds. Complete loss of GCLC
      has not been observed in patients.
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:21657237
    reference_title: "Enzymatic defects underlying hereditary glutamate cysteine ligase deficiency are mitigated by association of the catalytic and regulatory subunits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Kinetic characterizations of the recombinant GCLC mutants indicated that the Arg127Cys, His370Leu, and Pro414Leu mutants have compromised enzymatic activity that can largely be rescued by the addition of GCLM. Interestingly, the Pro158Leu mutant has kinetic constants comparable to those of wild-type GCLC, suggesting that heterodimer formation is needed for stability in vivo."
    explanation: >-
      Establishes two distinct molecular failure modes among the clinical GCLC
      alleles - impaired catalysis versus impaired heterodimer-dependent
      stability - and the modifier role of GCLM.
  - reference: PMID:28571779
    reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GCL is composed of a catalytic subunit encoded by the GCLC gene and a regulatory subunit encoded by the GCLM gene."
    explanation: Establishes the two-subunit composition of the affected holoenzyme.
  downstream:
  - target: Reduced glutamate-cysteine ligase activity
    causal_link_type: DIRECT
    description: >
      Loss of catalytic competence or of heterodimer-dependent stability reduces
      measurable glutamate-cysteine ligase activity.
    evidence:
    - reference: PMID:21657237
      reference_title: "Enzymatic defects underlying hereditary glutamate cysteine ligase deficiency are mitigated by association of the catalytic and regulatory subunits."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The four mutant transfectants each had significantly lower levels of glutathione relative to that of the wild type, with the Pro414Leu mutant being most compromised."
      explanation: Transfection of each clinical allele into GCLC-null cells reduces glutathione output, the functional consequence of the enzyme lesion.
- name: Reduced glutamate-cysteine ligase activity
  biological_scale: MOLECULAR
  description: >
    Glutamate-cysteine ligase catalyses the first and rate-limiting step of
    glutathione biosynthesis, the ATP-dependent ligation of glutamate and
    cysteine to gamma-glutamylcysteine. Erythrocyte enzyme activity in affected
    homozygotes has been measured at under 2% of normal, with heterozygous
    relatives at roughly half-normal activity. Because the block is at the first
    step, both gamma-glutamylcysteine and glutathione fall - the biochemical
    signature that separates this disorder from glutathione synthetase
    deficiency, in which gamma-glutamylcysteine instead accumulates.
  genes:
  - preferred_term: GCLC
    term:
      id: hgnc:4311
      label: GCLC
  molecular_functions:
  - preferred_term: glutamate-cysteine ligase activity
    term:
      id: GO:0004357

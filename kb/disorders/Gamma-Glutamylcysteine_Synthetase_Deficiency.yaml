      evidence_source: IN_VITRO
      snippet: "Transfection studies showed that the mutation is associated with decreased GSH production, and binding studies using purified recombinant protein showed that the mutant protein has markedly decreased enzymatic activity compared to wild type."
      explanation: Functional expression confirms a disease missense allele reduces both enzyme activity and glutathione output.
  - name: Homozygous family-specific alleles in consanguineous kindreds
    description: >
      Reported families are frequently consanguineous, and affected sibships are
      homozygous for a single family-specific allele - c.1772G>A (p.Ser591Asn)
      and c.514T>A (p.Ser172Thr) in two consanguineous families, c.379C>T
      (p.Arg127Cys) in an Arab-Muslim Israeli child.
    evidence:
    - reference: PMID:28571779
      reference_title: "Clinical and molecular characterization of 6 children with glutamate-cysteine ligase deficiency causing hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The affected children from the first family had the homozygous mutation c.1772G>A (p.S591N) and the second family had the homozygous mutation c.514T>A (p.S172T) in GCLC."
      explanation: Documents family-specific homozygous alleles in consanguineous kindreds.
  features: >
    Only six pathogenic GCLC alleles have been reported worldwide. Genotype does
    not predict whether a patient develops the neurological phenotype: c.514T>A
    (p.Ser172Thr) has been reported both in children with normal neurological
    examinations and in an adult with late-onset spinocerebellar degeneration.

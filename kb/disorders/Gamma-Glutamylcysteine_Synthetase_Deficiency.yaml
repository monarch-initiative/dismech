  variants:
  - name: Biallelic GCLC missense variants
    description: >
      All disease alleles reported to date are missense and hypomorphic
      (partial loss of function). The published set is c.379C>T (p.Arg127Cys),
      c.473C>T (p.Pro158Leu), c.514T>A (p.Ser172Thr), c.1109A>T (p.His370Leu),
      c.1241C>T (p.Pro414Leu) and c.1772G>A (p.Ser591Asn). Complete loss of GCLC
      is not observed in patients.
    evidence:
    - reference: PMID:39359943
      reference_title: "Clinical and Biochemical Analysis of Glutamate-Cysteine Ligase Deficiency Presented with Late-Onset Spinocerebellar Ataxia and Hemolytic Anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Previously reported mutations encompassing c.379C > T (p.R127C), c.1109A > T (p.H370L), c.473C > T (p.P158L), c.1241C > T (p.P414L), c.1772G > A (p.S591N), c.514T > A (p.S172T)."
      explanation: Enumerates the reported pathogenic GCLC alleles.
    - reference: PMID:12663448
      reference_title: "A novel missense mutation in the gamma-glutamylcysteine synthetase catalytic subunit gene causes both decreased enzymatic activity and glutathione production."

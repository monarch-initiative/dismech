- name: Reduced erythrocyte gamma-glutamylcysteine
  presence: DECREASED
  context: >
    Because the block is at the first biosynthetic step, the immediate product
    gamma-glutamylcysteine is low - the opposite of glutathione synthetase
    deficiency, where it accumulates and is cyclised to 5-oxoproline. This
    contrast is the key discriminating biochemistry between the two disorders,
    and explains why 5-oxoprolinuria is absent here.

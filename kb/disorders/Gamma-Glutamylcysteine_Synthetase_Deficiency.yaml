    reference_title: "Three cases of hereditary nonspherocytic hemolytic anemia associated with red blood cell glutathione deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "marked deficiency of red blood cell (RBC) reduced glutathoine (GSH) (4.4%, 13.1%, and 6.9% of normal, respectively)"
    explanation: Quantifies erythrocyte glutathione depletion in patients with red-cell glutathione-synthesis defects.
  - reference: PMID:21657237
    reference_title: "Enzymatic defects underlying hereditary glutamate cysteine ligase deficiency are mitigated by association of the catalytic and regulatory subunits."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glutamate cysteine ligase (GCL) deficiency is a rare autosomal recessive trait that compromises production of glutathione, a critical redox buffer and enzymatic cofactor."
    explanation: >-
      States the role of glutathione as redox buffer and cofactor whose
      production is compromised. Marked OTHER because this framing sentence
      summarizes the disorder rather than reporting this paper's own experiment.
  downstream:
  - target: Oxidative erythrocyte injury
    causal_link_type: DIRECT
    description: >
      Loss of the erythrocyte's principal antioxidant leaves haemoglobin and the
      red-cell membrane exposed to oxidative damage.
    evidence:
    - reference: PMID:21657237
      reference_title: "Enzymatic defects underlying hereditary glutamate cysteine ligase deficiency are mitigated by association of the catalytic and regulatory subunits."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Patients have markedly reduced levels of erythrocyte glutathione, leading to hemolytic anemia and, in some cases, impaired neurological function."
      explanation: States the causal step from erythrocyte glutathione depletion to hemolysis.
  - target: Progressive neurological dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      In a minority of patients, systemic glutathione depletion is associated
      with progressive neuromuscular and spinocerebellar disease. The
      intermediate steps, and why only some patients are affected, are unknown;
      no GCLC genotype has been shown to predict it.
    evidence:
    - reference: PMID:17397529
      reference_title: "Inborn errors in the metabolism of glutathione."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Gamma-glutamylcysteine synthetase deficiency is also associated with hemolytic\nanemia, and some patients with this disorder show defects of neuromuscular\nfunction and generalized aminoaciduria."
      explanation: >-
        Review records the association with neuromuscular dysfunction; marked
        PARTIAL because it states an association only, with no mechanism.
- name: Oxidative erythrocyte injury
  biological_scale: CELLULAR
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Oxidative and Membrane Injury"
  description: >
    Without glutathione the erythrocyte cannot reduce peroxides or maintain
    protein and membrane sulfhydryls, so reactive oxygen species progressively
    damage haemoglobin and the red-cell membrane. This is the disease-specific
    amplification step in a red cell that is otherwise structurally and
    enzymatically normal - the peripheral smear, Coombs test, G6PD assay and
    spherocytosis screen are all normal in these patients, which is why the
    diagnosis is easily missed.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:40277844
    reference_title: "Hemolytic Anemia Due to Gamma-Glutamylcysteine Synthetase Deficiency: A Rare Novel Case in an Arab-Muslim Israeli Child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation for common causes of hemolytic anemia was negative (peripheral blood smear was normal, and he had a negative Coombs test, normal G6PD, and normal flow cytometry spherocytosis)."
    explanation: >-
      Documents that the standard hemolysis workup is normal, supporting an
      oxidative-antioxidant lesion rather than a membrane, immune or glycolytic
      defect.
  - reference: PMID:18024385
    reference_title: "Chronic non-spherocytic hemolytic anemia associated with severe neurological disease due to gamma-glutamylcysteine synthetase deficiency in a patient of Moroccan origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The activity of glycolytic enzymes were found to be normal in the propositus"
    explanation: Excludes a glycolytic-enzyme cause, isolating the antioxidant defect as the operative red-cell lesion.
  downstream:
  - target: Premature erythrocyte destruction
    causal_link_type: DIRECT
    description: >
      Oxidatively injured erythrocytes are cleared prematurely from the
      circulation.
    evidence:
    - reference: PMID:12663448
      reference_title: "A novel missense mutation in the gamma-glutamylcysteine synthetase catalytic subunit gene causes both decreased enzymatic activity and glutathione production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hereditary deficiency of gamma-GCS has been reported in a small number of patients and is associated with low erythrocyte levels of gamma-GCS and GSH leading to hemolytic anemia."
      explanation: States the causal chain from low erythrocyte enzyme and glutathione to hemolytic anemia.
- name: Premature erythrocyte destruction
  biological_scale: TISSUE
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >
    Oxidatively damaged red cells are destroyed before their normal lifespan,
    producing chronic non-spherocytic hemolytic anemia with reticulocytosis and
    jaundice, and hepatosplenomegaly in some patients. Severity is variable, from
    a compensated hemolysis discovered in a 68-year-old proband to
    transfusion-dependent neonatal anemia.
  cell_types:

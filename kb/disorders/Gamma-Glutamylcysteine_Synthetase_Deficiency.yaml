    modifier: DECREASED
  evidence:
  - reference: PMID:12663448
    reference_title: "A novel missense mutation in the gamma-glutamylcysteine synthetase catalytic subunit gene causes both decreased enzymatic activity and glutathione production."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gamma-glutamylcysteine synthetase (gamma-GCS) catalyzes the first and rate-limiting step in glutathione (GSH) biosynthesis: the adenosine triphosphate (ATP)-dependent ligation of glutamate and cysteine."
    explanation: Defines the catalysed reaction and its rate-limiting position in glutathione biosynthesis.
  - reference: PMID:10733484
    reference_title: "A missense mutation in the heavy subunit of gamma-glutamylcysteine synthetase gene causes hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme defect was confirmed and GCS activity was found to be less than 2% of normal in the erythrocytes of both patients."
    explanation: Quantifies the residual erythrocyte enzyme activity in affected patients.
  - reference: PMID:10515893
    reference_title: "The molecular basis of a case of gamma-glutamylcysteine synthetase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient with hemolytic anemia and low red blood cell glutathione levels was found to have a deficiency of gamma-glutamylcysteine synthetase activity."
    explanation: >-
      The first molecular characterization of the disorder, tying measured
      enzyme deficiency to hemolytic anemia with low red-cell glutathione.
  downstream:
  - target: Cellular glutathione depletion
    causal_link_type: DIRECT
    description: >
      Blockade of the rate-limiting biosynthetic step lowers cellular
      glutathione, most conspicuously in the erythrocyte.
    evidence:
    - reference: PMID:10733484
      reference_title: "A missense mutation in the heavy subunit of gamma-glutamylcysteine synthetase gene causes hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hereditary deficiency of GCS has been reported in 6 patients with hemolytic anemia and low erythrocyte levels of glutathione and gamma-glutamylcysteine."
      explanation: Directly links the enzyme deficiency to low erythrocyte glutathione and gamma-glutamylcysteine.
- name: Cellular glutathione depletion
  biological_scale: CELLULAR
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity"
  description: >
    Glutathione is the erythrocyte's principal sulfhydryl antioxidant and a
    general cellular redox buffer and enzyme cofactor. Affected patients have
    markedly reduced erythrocyte glutathione - measured at 4-13% of normal in
    one series and effectively absent in a severely affected proband - which
    removes the red cell's main defence against oxidative injury. This is the
    disease-specific substitution for the module's generic intrinsic erythrocyte
    lesion.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: glutathione metabolic process
    term:
      id: GO:0006749
      label: glutathione metabolic process
    modifier: DECREASED
  - preferred_term: cell redox homeostasis

name: Gamma-Glutamylcysteine Synthetase Deficiency
category: Mendelian
creation_date: '2026-08-17T00:00:00Z'
synonyms:
- Glutamate-cysteine ligase deficiency
- GCL deficiency
- GCLC deficiency
- Gamma-GCS deficiency
- Hemolytic anemia due to gamma-glutamylcysteine synthetase deficiency
- Anemia, congenital, nonspherocytic hemolytic, 7
description: >
  Gamma-glutamylcysteine synthetase deficiency (glutamate-cysteine ligase, GCL,
  deficiency) is an ultra-rare autosomal recessive inborn error of the
  gamma-glutamyl cycle caused by biallelic variants in GCLC, the catalytic
  subunit of glutamate-cysteine ligase. GCL catalyses the first and
  rate-limiting step of glutathione biosynthesis, the ATP-dependent ligation of
  glutamate and cysteine to form gamma-glutamylcysteine; the holoenzyme is a
  heterodimer of the GCLC catalytic subunit and the GCLM regulatory subunit.
  Loss of activity depletes cellular glutathione, and because the erythrocyte
  depends on glutathione as its principal antioxidant, the constant and defining
  manifestation is chronic non-spherocytic hemolytic anemia, typically presenting
  in the neonatal period. A minority of reported patients additionally develop
  progressive neurological disease (spinocerebellar degeneration, ataxia,
  spasticity, peripheral neuropathy, cognitive impairment, myopathy) and
  generalized aminoaciduria; no genotype has been shown to predict that
  neurological arm, and its mechanism is unresolved. The disorder is
  distinguished from glutathione synthetase deficiency, the other glutathione
  biosynthetic defect, by the absence of 5-oxoprolinuria: because the enzymatic
  block is at the first step, gamma-glutamylcysteine is not overproduced and
  cannot be cyclised to 5-oxoproline.

pathophysiology:
- name: Biallelic ATP1A2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  description: >-
    Two ATP1A2 alleles carrying nonsense, frameshift or canonical splice-site
    variants, or rarely a missense change behaving as a functional null,
    inherited from heterozygous carrier parents.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ATP1A2
    term:
      id: hgnc:800
      label: ATP1A2
  evidence:
  - reference: PMID:31608932
    reference_title: A novel lethal recognizable polymicrogyric syndrome caused by ATP1A2 homozygous truncating variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all affected cases, exome sequencing showed a pathogenic homozygous
      nonsense ATP1A2 variant.
    explanation: >-
      Identifies homozygous truncating ATP1A2 variants as the cause in the index
      families.
  - reference: CGGV:assertion_fb2e7696-8d5d-48a2-892f-c8fad53c65f8-2025-07-01T160000.000Z
    reference_title: "ATP1A2 / fetal akinesia, respiratory insufficiency, microcephaly, polymicrogyria, and dysmorphic facies (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presumed mechanism of disease is loss of function with affected
      probands harboring biallelic nonsense, frameshift, or canonical splice
      variants with only a single missense variant reported at the time of
      curation.
    explanation: >-
      ClinGen's allele spectrum and mechanism statement for this gene-disease
      pair.
  downstream:
  - target: Absence of Na+/K+-ATPase Alpha-2 Subunit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Nonsense-mediated decay of the mutant transcript
    description: >-
      Truncating alleles are degraded by nonsense-mediated decay, leaving no
      alpha-2 protein.
    evidence:
    - reference: PMID:39046620
      reference_title: The lethal homozygous variant in the ATP1A2 gene is associated with FARIMPD syndrome phenotypes in newborns.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The expression analysis also showed significant mRNA degradation in the
        newborns compared to heterozygous and healthy individuals, due to
        Nonsense-mediated mRNA Decay phenomena.
      explanation: >-
        Demonstrates nonsense-mediated decay of the mutant transcript in
        affected newborns.

    description: >-
      With chloride-dependent inhibition lost, the medullary network cannot
      sustain the inhibitory patterning that respiratory rhythm generation
      requires.
    evidence:
    - reference: PMID:15564586
      reference_title: "Malfunction of respiratory-related neuronal activity in Na+, K+-ATPase alpha2 subunit-deficient mice is attributable to abnormal Cl- homeostasis in brainstem neurons."
      supports: SUPPORT

name: Fetal Akinesia Respiratory Insufficiency Microcephaly Polymicrogyria And Dysmorphic Facies
creation_date: "2026-11-20T14:20:00Z"
category: Mendelian
synonyms:
- FARIMPD
- FARIMPD syndrome
- biallelic ATP1A2 deficiency
- lethal recognizable polymicrogyric syndrome
- hydrops fetalis, microcephaly, arthrogryposis and extensive cortical malformations
description: >-
  A lethal, prenatal-onset autosomal recessive syndrome (FARIMPD) caused by
  biallelic loss-of-function variants in ATP1A2, which encodes the alpha-2
  catalytic subunit of the Na+/K+-ATPase. Affected brains contain no
  immunodetectable ATP1A2 protein, so the disorder is a true protein-null state
  rather than a hypomorph. The fetus neither moves nor breathes: absent
  spontaneous movement produces a fetal akinesia deformation sequence with
  arthrogryposis, polyhydramnios, hydrops and a compressed dysmorphic facies,
  and absent respiratory drive is lethal within hours to days of birth. The
  brain carries a reproducible and recognisable pattern of injury at autopsy -
  meningeal arterial calcification, necrotic and calcified basal ganglia,
  dentato-olivary dysplasia, severe hypoplasia or agenesis of the pyramidal
  tracts, and diffuse polymicrogyria.
  The mechanism follows from what the alpha-2 pump does. It maintains the local
  transmembrane Na+ and K+ gradients that Na+-dependent secondary transporters
  consume, and two of those consumers are demonstrated to fail in the
  Atp1a2-null mouse: the K-Cl cotransporter KCC2, which co-immunoprecipitates
  with the alpha-2 subunit and which neurons use to extrude chloride, and the
  glutamate and GABA reuptake transporters. Chloride accumulates in
  ventrolateral medullary neurons, inhibitory patterning in the brainstem
  respiratory network fails, and respiratory motoneuron output is defective
  before birth. In parallel, impaired transmitter reuptake leaves neurons
  hyperactive, with c-Fos induction followed by selective apoptosis.
  ATP1A2 carries a dual mode of transmission, and this entry is the recessive
  arm. Heterozygous ATP1A2 variants cause familial hemiplegic migraine type 2
  and an alternating hemiplegia / developmental and epileptic encephalopathy
  spectrum, which ClinGen curates as a separate Definitive gene-disease
  relationship; parents of FARIMPD probands have themselves reported migraine.
notes: >-
  Scope and the dual transmission mode. This entry covers only the biallelic,
  prenatal-lethal arm of ATP1A2 disease (MONDO:0859204 / OMIM 619602). The
  dominant arm is a different entity with its own ClinGen Definitive record -
  "hemiplegic migraine-developmental and epileptic encephalopathy spectrum",
  MONDO:0100539, curated by the Epilepsy GCEP - and is deliberately not
  modelled here, as a subtype or otherwise. The two are linked by the fact that
  carrier parents of FARIMPD probands report migraine, which is recorded in the
  inheritance block rather than as a phenotype of this disease.
  No GeneReviews chapter. Checked offline against the committed Bookshelf index
  (cache/bookshelf/genereviews.csv, snapshot 2026-09-10, 958 chapters) for
  "akinesia", "polymicrogyria" and "ATP1A2": the only match is a retired
  Polymicrogyria Overview (PMID:20301504, NBK1329), which is withdrawn content
  and not a baseline, and there is no gene-scoped ATP1A2 chapter. Phenotype
  content here therefore comes from the primary case reports.
  The vascular branch is not drawn as a causal chain. Meningeal arterial
  calcification is a demonstrated autopsy finding and is curated as a phenotype
  row, with no inbound causal edge, because the mechanism that would explain it
  is the knowledge gap below rather than something this entry asserts. The
  mechanism proposed for it - alpha-2 loss driving the sodium-calcium exchanger
  into reverse mode in pericytes and arterial smooth muscle, raising cytosolic
  calcium and myogenic tone, and so reducing cerebral perfusion - is recorded as
  a knowledge gap rather than as edges. The deep-research report marks this
  branch inferred for the human homozygous fetus, and the paper it cites for the
  arterial physiology (PMID:21048395) is a review of salt-induced hypertension in
  which the alpha-2 heterozygous artery result appears; citing a hypertension
  review for a fetal brain malformation mechanism would overstate it, and the
  report's own relevance assessment flagged that reference off-topic. It is
  listed under references as a lead instead.
  Four phenotypes are left without an inbound causal edge, deliberately.
  Microcephaly, seizure and congenital diaphragmatic hernia are reported
  features for which no source read here states a mechanism in this disorder: a
  reader can guess that the grey-matter injury produces the microcephaly or that
  the cortical lesion produces the seizures, but neither is asserted by a cited
  paper, and writing those edges would put an inference in the graph where the
  literature has none. Meningeal calcification is unconnected for the different
  reason given above - its mechanism is the vascular branch, which this entry
  carries as a knowledge gap. The remaining ten of fifteen phenotypes are
  causally connected, the deformation-sequence features through `sequelae` on
  the fetal akinesia sequence and neonatal death from the respiratory
  insufficiency that the sources name as its cause.
  Terms not taken from the deep-research report. The report's term validation
  recorded 16 of 69 checked labels as mismatched, including every NCIT treatment
  term it proposed and every UBERON anatomical term: among others it offered
  NCIT:C15346 as "Physical therapy" (that identifier is Vaccination),
  NCIT:C53555 as "Comfort care" (Luminal B Breast Carcinoma), NCIT:C15285 as
  "Genetic counselling" (Nursing Research), UBERON:0002634 as "Pyramidal tract"
  (anterior nucleus of hypothalamus), UBERON:0002129 as "Dentate nucleus"
  (cerebellar cortex) and UBERON:0013694 as "Inferior olivary complex" (brain
  endothelium). It also offered HP:0002803 for arthrogryposis multiplex
  congenita, which is Congenital contracture - the right concept one identifier
  away from the right term. None of those identifiers is used. Every CURIE in
  this entry was read from the committed term caches or resolved against OLS or
  the Alliance in the step it was written.
  Deep-research provenance. The OpenScientist report contributed the OMIM
  identifier (619602, which the research brief could not record because OLS was
  unreachable at run time), the isoform-partitioning argument against paralogue
  compensation from Human Protein Atlas expression data, gnomAD v4 constraint
  showing ATP1A2 is loss-of-function tolerant while ATP1A1 and ATP1A3 are
  strictly haploinsufficient, a predicted biallelic birth prevalence of 1 in 25
  to 70 million, and a transmembrane-helix clustering prior for pathogenic
  missense variants. Those are database-derived findings rather than claims from
  a citable publication and were not independently re-derived in this session,
  so they are recorded here as deep-research output and are not used as evidence
  items. The report also records correcting its own iteration-1 citation of OMIM
  618185, written from memory, which is periventricular nodular heterotopia 8
  (ARF1) and a different disease.

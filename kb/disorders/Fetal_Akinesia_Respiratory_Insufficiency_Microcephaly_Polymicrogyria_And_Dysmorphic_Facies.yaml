inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Biallelic ATP1A2 loss of function is required, and penetrance in biallelic
    individuals appears complete: every reported patient has been affected and
    all but one died in the neonatal period. Heterozygous carriers are not
    merely unaffected but have their own dominant phenotype - several parents of
    probands report migraine - so the gene carries a dual mode of transmission
    and the two arms must not be conflated.
  evidence:
  - reference: PMID:31608932
    reference_title: A novel lethal recognizable polymicrogyric syndrome caused by ATP1A2 homozygous truncating variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four cases from two independent families sharing a common
      recognizable lethal syndromic polymicrogyria of autosomal recessive
      inheritance.
    explanation: >-
      Establishes autosomal recessive inheritance in the index families.
  - reference: PMID:31608932
    reference_title: A novel lethal recognizable polymicrogyric syndrome caused by ATP1A2 homozygous truncating variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we emphasize the possibility of dual mode of transmission for
      disease-causing genes
    explanation: >-
      The authors' own framing of ATP1A2 as a gene with both a dominant and a
      recessive disease, which is why this entry covers only the recessive arm.

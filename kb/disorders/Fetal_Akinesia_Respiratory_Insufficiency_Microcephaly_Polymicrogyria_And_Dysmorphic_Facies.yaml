discussions:
- discussion_id: farimpd_no_model_for_cortical_malformation
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Basal Ganglia and Dentato-Olivary Grey Matter Necrosis
  - phenotypes#Polymicrogyria
  prompt: >-
    Why does the Atp1a2-null mouse reproduce the akinesia and the fatal
    respiratory failure but none of the structural brain malformations that
    define the human disorder, and what system could model them?
  rationale: >-
    The mismatch is specific and load-bearing rather than a general caveat about
    mice. The null mouse is a faithful model of the functional arm: it is
    akinetic, it dies of respiratory failure at birth, and the chloride and
    transmitter reuptake mechanisms were demonstrated in it. It does not
    reproduce polymicrogyria, meningeal arterial calcification, dentato-olivary
    dysplasia or pyramidal tract agenesis - the four features that make the human
    syndrome recognisable at autopsy, and the ones a mechanism for the
    malformation would have to explain. So the malformation arm of this disease
    currently has no animal model, and the human evidence for it is autopsy
    morphology alone. Any proposed mechanism for the cortical malformation,
    including the vascular hypothesis recorded separately, cannot be tested in
    the existing line.
  evidence:
  - reference: PMID:12805306
    reference_title: Degeneration of the amygdala/piriform cortex and enhanced fear/anxiety behaviors in sodium pump alpha2 subunit (Atp1a2)-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice homozygous for the alpha2 mutation died just after birth and
      displayed selective neuronal apoptosis in the amygdala and piriform cortex.
    explanation: >-
      The mouse neuropathology, which is regionally different from the human
      pattern and does not include a cortical malformation.
  - reference: PMID:31608932
    reference_title: A novel lethal recognizable polymicrogyric syndrome caused by ATP1A2 homozygous truncating variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathological examination revealed a common pattern associating meningeal
      arterial calcifications, necrotic and calcified areas in basal ganglia,
      dentato-olivary dysplasia and severe hypoplasia/agenesis of the pyramidal
      tracts
    explanation: >-
      The human pattern that the mouse does not reproduce.
- discussion_id: farimpd_vascular_branch
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Collapse of Local Sodium and Potassium Gradients
  - pathophysiology#Basal Ganglia and Dentato-Olivary Grey Matter Necrosis
  prompt: >-
    Does loss of the alpha-2 pump in brain pericytes and arterial smooth muscle
    drive the sodium-calcium exchanger into reverse mode, raising mural cell
    calcium and myogenic tone, and is the resulting hypoperfusion what produces
    the meningeal arterial calcification and the clastic cortical injury?
  rationale: >-
    Meningeal arterial calcification is a demonstrated autopsy finding and sits
    oddly in a disorder otherwise explained by neuronal ion handling, so a
    vascular contribution is an attractive explanation for the clastic
    appearance of the cortical injury. The components exist: alpha-2 is reported
    to be concentrated in brain pericytes, and alpha-2 loss in cultured
    astrocytes raises cytosolic calcium through the sodium-calcium exchanger in
    the membrane microdomains overlying the endoplasmic reticulum. What is
    missing is any measurement in the human homozygous fetus, or in any
    homozygous animal, linking mural cell calcium to cerebral perfusion. The
    arterial physiology result most often cited for this branch comes from
    heterozygous mouse arteries in a review of salt-induced hypertension, which
    is too far from a fetal brain to carry the claim. No causal edge is drawn for
    this branch in the pathograph, and the deep-research report marks it
    inferred.
  evidence:
  - reference: PMID:12763872
    reference_title: Regulation of Ca2+ signaling by Na+ pump alpha-2 subunit expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      This correlates with alpha2 Na(+) pump and Na(+)/Ca(2+) exchanger (NCX)
      localization in plasma membrane (PM) microdomains that overlie the ER.
    explanation: >-
      Establishes the alpha-2 and sodium-calcium exchanger colocalisation in
      plasma-membrane microdomains that the proposed calcium coupling rests on,
      in cultured astrocytes. It does not establish the vascular or perfusion
      steps, which is why the branch is a gap rather than a chain. A sentence
      quoting the measured sodium and calcium concentrations was tried first and
      could not be used: the validator strips bracketed spans before matching,
      and bridging them would have dropped the ion identities the claim depends
      on.

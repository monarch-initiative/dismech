  downstream:
  - target: Collapse of Local Sodium and Potassium Gradients
    causal_link_type: DIRECT
    description: >-
      Without the pump, the local transmembrane Na+ and K+ gradients in the
      membrane microdomains where alpha-2 is concentrated are not maintained.
    evidence:
    - reference: PMID:30690204
      reference_title: "Biallelic loss of function variants in ATP1A2 cause hydrops fetalis, microcephaly, arthrogryposis and extensive cortical malformations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        The Na+/K+- ATPase acts as an ion pump maintaining the essential plasma
        membrane potential in all mammalian cell types, and is essential for
        many cellular functions.
      explanation: >-
        States the pump's function, from which loss of the gradient follows.
        Quoted from the paper's introduction, where it restates established
        physiology rather than a result of this study.
- name: Collapse of Local Sodium and Potassium Gradients
  biological_scale: MOLECULAR
  node_class: TRANSPORT_ACTIVITY
  description: >-
    The Na+ and K+ electrochemical gradients that Na+-dependent secondary
    transporters consume are lost in the alpha-2 microdomains. Two consumers are
    demonstrated to fail in the null mouse - KCC2-mediated chloride extrusion
    and glutamate/GABA reuptake - and the mechanism branches here.
  biological_processes:
  - preferred_term: regulation of membrane potential
    modifier: DECREASED
    term:
      id: GO:0042391
      label: regulation of membrane potential
  evidence:
  - reference: PMID:30690204
    reference_title: "Biallelic loss of function variants in ATP1A2 cause hydrops fetalis, microcephaly, arthrogryposis and extensive cortical malformations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The α2-isoform is encoded by ATP1A2 and evidence supports its utmost
      importance in Cl- homeostasis in neurons, and in the function of
      respiratory neurons at birth.
    explanation: >-
      Names the two downstream dependencies - neuronal chloride homeostasis and
      respiratory neuron function - that this node branches into.
  downstream:
  - target: KCC2-Dependent Chloride Extrusion Failure
    causal_link_type: DIRECT
    description: >-
      KCC2 uses the K+ gradient to extrude chloride, and the alpha-2 subunit
      co-immunoprecipitates with it in the synaptic membrane, so loss of the
      pump removes the driving force for chloride extrusion.
    evidence:
    - reference: PMID:15564586
      reference_title: "Malfunction of respiratory-related neuronal activity in Na+, K+-ATPase alpha2 subunit-deficient mice is attributable to abnormal Cl- homeostasis in brainstem neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The alpha2 subunit and a neuron-specific K-Cl cotransporter KCC2 were
        coimmunoprecipitated in a purified synaptic membrane fraction of
        wild-type fetuses.
      explanation: >-
        Demonstrates the physical coupling between the alpha-2 subunit and KCC2
        that the functional dependency rests on.
  - target: Impaired Glutamate and GABA Reuptake
    causal_link_type: DIRECT
    description: >-
      Na+-dependent excitatory amino acid and GABA transporters lose the Na+
      gradient they use for reuptake.
    evidence:
    - reference: PMID:12805306
      reference_title: Degeneration of the amygdala/piriform cortex and enhanced fear/anxiety behaviors in sodium pump alpha2 subunit (Atp1a2)-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        re-uptake of glutamic acid and GABA into P2 fraction containing crude
        synaptosome was impaired
      explanation: >-
        Demonstrates impaired transmitter reuptake in the alpha-2-null mouse.
- name: KCC2-Dependent Chloride Extrusion Failure
  biological_scale: CELLULAR
  node_class: TRANSPORT_ACTIVITY
  description: >-
    Neuronal chloride extrusion fails and intracellular chloride rises,
    demonstrated directly in ventrolateral medullary neurons of the null mouse.
    Raised intracellular chloride shifts GABA-A and glycine responses away from
    hyperpolarising, so inhibitory patterning is lost.

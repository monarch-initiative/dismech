experimental_models:
- name: Isogenic OPTN(E50K) human pluripotent stem cell-derived retinal ganglion cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >
    Human pluripotent stem cell lines in isogenic pairs - patient-derived iPSCs
    with the E50K mutation corrected, and an H7 embryonic line with E50K
    introduced by CRISPR/Cas9 - differentiated through retinal organoids into
    purified retinal ganglion cells. Because the comparison is isogenic, the
    phenotype is attributable to the OPTN genotype rather than to line
    background, and because the cells are human ganglion cells it addresses
    the species limitations of the mouse models directly. Mutant cells show
    impaired autophagic-lysosomal degradation, AMPK activation, reduced mTORC1
    signalling and neurodegenerative features; mTOR-independent autophagy
    induction rescues neurite outgrowth.
  evidence:
  - reference: PMID:39425218
    reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we leveraged an isogenic hPSC model with a glaucoma-associated mutation in the Optineurin (OPTN) protein, which plays a prominent role in autophagy"
    explanation: >
      Establishes the isogenic human stem-cell model described here.
  modeled_mechanisms:
  - target: Impaired Autophagic Flux in Retinal Ganglion Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Human retinal ganglion cells with the disease genotype reproduce the
      autophagic-lysosomal degradation block, in an isogenic comparison.
    evidence:
    - reference: PMID:39425218
      reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, these results highlighted that autophagy disruption resulted in increased autophagic demand which was associated with downregulated signaling through mTORC1, contributing to the degeneration of RGCs."
      explanation: >
        The study's own conclusion that this human model demonstrates the
        autophagy-disruption node it is linked to.
    limitations: >
      hPSC-derived retinal ganglion cells are developmentally immature relative
      to the adult neurons that degenerate in a disease of middle age, and they
      are cultured without the optic nerve head, lamina cribrosa, glia and
      vasculature of the intact eye. The model therefore speaks to the
      cell-autonomous proteostatic lesion, not to the tissue-level
      neuropathy.
    readouts:
    - name: Autophagic-lysosomal degradation and mTORC1 signalling
      target: Impaired Autophagic Flux in Retinal Ganglion Cells
      direction: DECREASED
      interpretation: >
        Reduced degradative flux with concurrent AMPK activation and lowered
        mTORC1 signalling in mutant human ganglion cells.
      evidence:
      - reference: PMID:39425218
        reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We identified an impairment of autophagic-lysosomal degradation and decreased mTORC1 signaling via activation of the stress sensor AMPK, along with subsequent neurodegeneration in OPTN(E50K) RGCs differentiated from hPSCs"
        explanation: >
          Reports both measurements recorded in this readout.
    - name: Neurite outgrowth after mTOR-independent autophagy induction
      target: Impaired Autophagic Flux in Retinal Ganglion Cells
      direction: RESTORED
      interpretation: >
        Rescue on forcing flux, which is what makes the flux block causal for
        the degenerative phenotype rather than merely correlated with it.
      evidence:
      - reference: PMID:39425218
        reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the mTOR-independent induction of autophagy reduced protein accumulation and restored neurite outgrowth in diseased OPTN(E50K) RGCs"
        explanation: >
          Reports the rescue that this readout measures.
discussions:
- discussion_id: optn_mouse_overexpression_fidelity
  prompt: >
    Do the optineurin mouse models, which all rely on mutant overexpression or
    homozygosity, faithfully represent a heterozygous human missense disease
    that spares the outer retina?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Retinal Ganglion Cell Apoptosis"
  - "pathophysiology#Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure"
  rationale: >
    Human OPTN-related glaucoma is a heterozygous, ganglion-cell-selective optic
    neuropathy. None of the three mouse models matches that genotype-phenotype
    pairing. The original transgenic line overexpresses mutant optineurin
    globally and degenerates panretinally, losing photoreceptors and non-RGC
    cells - features explicitly noted as not observed in human POAG. The BAC
    line was built to fix that, and does express near-physiologically, but its
    phenotype is an enhancement of an age-related decline detectable only at 18
    months and still rests on a human transgene over an intact mouse Optn
    background. The knock-in line has the right allele at the right locus but
    is reported as homozygous. Mouse retina additionally has no macula and the
    mouse optic nerve head no lamina cribrosa, removing the biomechanical
    setting in which human glaucomatous cupping develops. The consequence is
    concrete: neuroprotection results and phenotype-selectivity claims from
    these lines should not be transferred to patients without independent
    corroboration.
  evidence:
  - reference: PMID:25818176
    reference_title: "Visual impairment in an optineurin mouse model of primary open-angle glaucoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mouse improves the design and phenotype of currently available optineurin mice, which showed high global overexpression."
    explanation: >
      The authors of the BAC line state explicitly that the pre-existing
      optineurin mice suffered from high global overexpression and needed
      improvement, which is the design mismatch this discussion is about.
  - reference: PMID:20388642
    reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "E50K mice also showed massive apoptosis and degeneration of entire retina, leading to approximately a 28% reduction of the retina thickness."
    explanation: >
      Quantifies the panretinal degeneration produced by the overexpression
      model - a whole-retina phenotype rather than the ganglion-cell-selective
      optic neuropathy of the human disease.
  proposed_experiments:
  - experiment_id: optn_heterozygous_knockin_comparison
    name: Heterozygous knock-in comparison
    description: >
      Characterize heterozygous Optn E50K knock-in mice alongside homozygotes
      for ganglion cell survival, autophagic flux and outer retinal integrity,
      to establish whether the ganglion-cell selectivity of human disease is a
      dosage effect.
  - experiment_id: optn_human_retina_validation
    name: Human retinal organoid and post-mortem tissue validation
    description: >
      Test whether the autophagic-flux block and any outer-retinal involvement
      seen in mice are present in OPTN(E50K) human retinal organoids and in
      post-mortem retina from genotyped patients.
- discussion_id: optn_allele_population_specificity
  prompt: >
    Why do the causative and susceptibility OPTN alleles differ so sharply
    between populations, and what does that imply for genetic testing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#OPTN Missense Variant and Optineurin Misfolding"
  rationale: >
    The OPTN alleles reported as risk-conferring or disease-causing in
    Caucasian cohorts were not detected in Japanese glaucoma patients, while
    M98K shows a robust association with POAG and NTG in Japanese and other
    East Asian series and is not replicated in Caucasians. Normal-tension
    glaucoma is itself more prevalent in East Asian populations. Whether this
    reflects genuinely different allelic architecture, differing linkage
    disequilibrium around a shared functional variant, or ascertainment
    differences between cohorts is unresolved, and it directly affects how an
    OPTN result should be interpreted in a given patient.
  evidence:
  - reference: PMID:14755458
    reference_title: "Mutations in the optineurin gene in Japanese patients with primary open-angle glaucoma and normal tension glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current results suggest that there may be certain racial differences between Japanese and Caucasians with respect to OPTN genotypes."
    explanation: >
      The primary observation of population-differing OPTN genotypes that this
      discussion is about.
  proposed_experiments:
  - experiment_id: optn_cross_ancestry_sequencing
    name: Cross-ancestry OPTN sequencing with matched phenotyping
    description: >
      Sequence OPTN in large, uniformly phenotyped normal-tension glaucoma
      cohorts across ancestries with shared IOP and disc-imaging protocols, to
      separate allelic architecture from ascertainment.
- discussion_id: optn_glaucoma_als_convergence
  prompt: >
    Do OPTN-related glaucoma and OPTN-related ALS share one pathological
    mechanism differing only in the neuron affected, or are they distinct
    diseases that happen to involve the same gene?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired Autophagic Flux in Retinal Ganglion Cells"
  rationale: >
    OPTN mutations cause both normal-tension glaucoma and ALS, and TBK1 lesions
    likewise cause both. In general the glaucoma-associated alleles are
    missense and the ALS-associated alleles include deletions and nonsense
    changes, with essentially no overlap - which argues for distinct molecular
    consequences. Against that, aged Optn E50K knock-in mice develop spinal
    cord TDP-43 accumulation and motor dysfunction as well as retinal disease,
    and TDP-43 mishandling is the canonical ALS lesion. Resolving this matters
    for whether therapeutic results should be expected to transfer between the
    two diseases.
  evidence:
  - reference: PMID:29875767
    reference_title: "Dysfunction of Optineurin in Amyotrophic Lateral Sclerosis and Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, mutations in OPTN, encoding optineurin, are associated with both ALS and glaucoma."
    explanation: >
      Establishes the shared-gene fact that makes this question worth asking.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:29951055
    reference_title: "Altered Functions and Interactions of Glaucoma-Associated Mutants of Optineurin."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Glaucoma-associated mutations of OPTN are mostly missense mutations."
    explanation: >
      Graded PARTIAL: supports the allele-class asymmetry argued in the
      rationale (glaucoma alleles are predominantly missense) but does not by
      itself state the ALS allele spectrum. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:33723228
    reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, we also observed increased cytoplasmic TDP-43 in the spinal cord and motor dysfunction in 24-month-old OPTN (E50K) mice, indicating that TDP-43 accumulation may be the common pathological mechanism of glaucoma and amyotrophic lateral sclerosis (ALS)."
    explanation: >
      The counter-observation: a glaucoma allele producing ALS-like spinal
      pathology in aged mice, which is the argument for shared mechanism.
diagnosis:
- name: Glaucoma Workup with Documented Normal Intraocular Pressure
  description: >
    The diagnosis is made the same way normal-tension glaucoma is: demonstrate
    a genuinely glaucomatous optic neuropathy, demonstrate an open anterior
    chamber angle, and demonstrate that intraocular pressure stays below
    21 mmHg. Goldmann applanation tonometry (with diurnal assessment where
    peaks are suspected), gonioscopy, slit lamp biomicroscopy, optical
    coherence tomography of the peripapillary nerve fibre layer, and standard
    automated perimetry are the core investigations. Pachymetry matters because
    a thin cornea causes tonometry to underestimate the true pressure and so
    can manufacture an apparent normal-tension case.
  diagnosis_term:
    preferred_term: Tonometry
    term:
      id: NCIT:C120543
      label: Tonometry
  evidence:
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Goldmann applanation tonometry, gonioscopy, slit lamp biomicroscopy, optical coherence tomography and visual field analysis are the main tools of investigation for the diagnosis of NTG."
    explanation: >
      Names the diagnostic battery this entry records. Evidence source is
      OTHER because this is a narrative review.
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Normal tension glaucoma (NTG) is labelled when typical glaucomatous disc changes, visual field defects and open anterior chamber angles are associated with intraocular pressure (IOP) constantly below 21 mmHg."
    explanation: >
      Gives the three diagnostic criteria - disc changes, field defects, open
      angle - together with the sub-21 mmHg pressure requirement. Evidence
      source is OTHER because this is a narrative review.
- name: Gonioscopy
  description: >
    Gonioscopy establishes that the drainage angle is open, which is what
    separates this entity and the rest of the open-angle group from
    angle-closure glaucoma.
  diagnosis_term:
    preferred_term: Gonioscopy
    term:
      id: NCIT:C93195
      label: Gonioscopy
  evidence:
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "open anterior chamber angles on gonioscopy and maximum intraocular pressure (IOP) below 21 mmHg"
    explanation: >
      Establishes gonioscopic confirmation of an open angle as part of the
      diagnostic definition. Evidence source is OTHER because this is a
      narrative review.
- name: Optical Coherence Tomography of the Retinal Nerve Fiber Layer
  description: >
    OCT quantifies peripapillary retinal nerve fibre layer and macular
    ganglion cell complex thickness, and is the structural measure by which
    progression is tracked. It is the clinical readout closest to the
    pathophysiology curated here, since it measures ganglion cell axon loss
    directly.
  diagnosis_term:
    preferred_term: Optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  evidence:
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "progressive retinal nerve fiber layer thinning, characteristic visual field defects, open anterior chamber angles on gonioscopy"
    explanation: >
      Identifies progressive nerve fibre layer thinning as a defining,
      trackable feature. Evidence source is OTHER because this is a narrative
      review.
- name: OPTN Genetic Testing
  description: >
    Molecular confirmation. A multigene glaucoma panel is generally preferred
    over isolated OPTN sequencing when the familial variant is unknown, because
    familial normal-tension glaucoma is genetically heterogeneous and TBK1
    copy-number gain - which single-gene sequencing will miss - is a
    differential cause. Where a pathogenic familial variant is already known,
    targeted testing of that variant supports cascade screening of relatives,
    who then need lifelong ophthalmic surveillance because penetrance is
    age-dependent.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 2% of NTG cases are caused primarily by mutations in single genes, optineurin (OPTN), TANK binding kinase 1 (TKB1), or myocilin (MYOC)."
    explanation: >
      Establishes the genetic heterogeneity of familial normal-tension
      glaucoma that motivates panel rather than single-gene testing.
  notes: >
    The pre-test probability is low in unselected normal-tension glaucoma
    (~1% for OPTN), so genetic testing is most informative in familial,
    early-onset, or otherwise atypical disease.
differential_diagnoses:
- name: TBK1-related normal tension glaucoma
  description: >
    Clinically indistinguishable normal-tension glaucoma caused by copy-number
    gain at TBK1 rather than by OPTN missense change. It is the closest
    mechanistic neighbour - TBK1 is the kinase through which mutant optineurin
    acts, and both converge on autophagy dysregulation - and it is the reason
    a genetic evaluation should include copy-number analysis rather than OPTN
    sequencing alone.
  distinguishing_features:
  - >
      Distinguished only by genotype: TBK1 duplication on copy-number testing
      versus an OPTN missense variant on sequencing. Note that a
      sequencing-only panel will miss the TBK1 duplication entirely.
  evidence:
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 2% of NTG cases are caused primarily by mutations in single genes, optineurin (OPTN), TANK binding kinase 1 (TKB1), or myocilin (MYOC)."
    explanation: >
      Lists TBK1 alongside OPTN as a single-gene cause of normal-tension
      glaucoma, which is what makes it the primary differential.
- name: Non-Mendelian normal tension glaucoma
  description: >
    The great majority of normal-tension glaucoma has no single-gene cause.
    Vascular and haemodynamic factors dominate the proposed pathogenesis -
    chronic low ocular perfusion, Raynaud phenomenon, migraine, nocturnal
    systemic hypotension, and over-treated systemic hypertension. Because
    single-gene disease accounts for only about 2% of normal-tension glaucoma,
    this is by far the most likely diagnosis in an unselected patient, and it
    is what an OPTN-related diagnosis has to be positively distinguished from.
  distinguishing_features:
  - >
      Absence of a pathogenic OPTN, TBK1 or MYOC variant; typically older age at
      presentation than the E50K mean of about 41 years, less severe cupping at
      diagnosis, and a lower rate of progression to filtration surgery.
      Vasospastic and nocturnal-hypotension features are commonly present.
  evidence:
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic low vascular perfusion, Raynaud's phenomenon, migraine, nocturnal systemic hypotension and over-treated systemic hypertension are the main causes of normal tension glaucoma."
    explanation: >
      Names the non-genetic causal factors that characterize the far more
      common non-Mendelian form. Evidence source is OTHER because this is a
      narrative review.
- name: Primary open angle glaucoma with unrecognized intraocular pressure peaks
  description: >
    Ordinary high-tension open-angle glaucoma can masquerade as
    normal-tension disease when the pressure elevation is intermittent and
    missed by office-hours tonometry, or when a thin cornea causes applanation
    tonometry to underestimate the true pressure. This is a measurement
    artefact rather than a distinct disease, but it is the commonest reason a
    normal-tension label is wrong.
  distinguishing_features:
  - >
      Diurnal or nocturnal tonometry revealing pressure above 21 mmHg;
      pachymetry showing a thin central cornea that has caused underestimation.
      Normal-tension patients also show wider diurnal pressure fluctuation than
      healthy individuals, so a single normal reading settles nothing.
  evidence:
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IOP spikes may occur at night, and thus IOPs measured during office hours may miss nocturnal spikes in many patients."
    explanation: >
      States the measurement failure mode that produces this differential.
      Evidence source is OTHER because this is a narrative review.
- name: Non-glaucomatous optic neuropathy
  description: >
    Compressive, ischaemic, inflammatory, hereditary (e.g. OPA1-related
    dominant optic atrophy) and mitochondrial optic neuropathies can produce
    optic disc changes and visual field loss without glaucoma. This matters
    for an OPTN entry in particular, because a diagnosis reached partly on the
    grounds of "glaucoma at normal pressure" has already given up the
    pressure criterion and rests more heavily on the pattern of disc and field
    change.
  distinguishing_features:
  - >
      Optic disc pallor exceeding cupping, marked dyschromatopsia, field defects
      respecting the vertical meridian, rapid decline, pain, or accompanying
      neurological signs - any of which should prompt neuroimaging and a
      neuro-ophthalmic assessment rather than glaucoma management.
progression:
- phase: Presymptomatic carrier
  notes: >
    Carriers may have entirely normal optic discs and visual fields well into
    adulthood: seven E50K carriers aged 23-58 years in the Moorfields families
    had no signs of glaucoma at the time of study. Penetrance is age-dependent,
    so surveillance rather than reassurance is the correct response to a
    normal examination in a young carrier.
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, seven E50K mutation-carrying individuals in two families (age range, 23-58 years) presented with normal optic discs and visual fields and, as yet, no signs of glaucoma."
    explanation: >
      Documents the presymptomatic carrier phase this record describes.
- phase: Established glaucoma at presentation
  notes: >
    Presentation is at a mean of about 41 years with already-advanced
    structural damage - mean cup-disc ratio 0.86 and reduced neuroretinal rim
    area - which is worse than mutation-negative normal-tension glaucoma at
    diagnosis. The disease has therefore usually been running silently for
    some time before it is found.
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subjects with E50K presented at a younger age (40.8 +/- 15 years, P = 0.0001) and had more advanced optic disc cupping (mean cup-disc ratio +/- SD 0.86 +/- 0.1, P = 0.001) and smaller neuroretinal rim area"
    explanation: >
      Quantifies age and structural damage at presentation for this phase.
- phase: Progressive visual field loss
  notes: >
    All E50K patients in the Moorfields series had progressing visual fields,
    and nearly three quarters required filtration surgery for that
    progression. In a separate four-generation pedigree followed for a mean of
    17 years, progression appeared to stabilize once intraocular pressure was
    brought below 10 mmHg - the practical basis for a very low target
    pressure. Ganglion cell loss is irreversible, so treatment preserves
    remaining function rather than recovering lost vision.
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of filtration surgery performed for progressive visual field loss in those with and without the E50K mutation was 72.7% and 25.3%, respectively (P = 0.003), and all subjects with E50K were found to have progressing visual fields."
    explanation: >
      Establishes universal progression and the resulting surgical rate in
      this phase.
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive visual field loss which appeared to stabilize once an IOP of less than 10 mm Hg was achieved"
    explanation: >
      Supports the stabilization-at-very-low-pressure observation recorded for
      this phase.
datasets:
- accession: geo:GSE145069
  title: Differential gene expression and pathway analysis by RNA sequencing in human OPTN(E50K) retinal ganglion cells
  description: >
    RNA-seq of human pluripotent stem cell-derived retinal ganglion cells
    carrying the OPTN(E50K) mutation versus isogenic controls. Genotype- and
    cell-type-specific for this entity: the disease allele in the disease cell
    type, in a human system.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 8
  publication: PMID:32531194
  notes: >
    Located by GEO DataSets search on "optineurin E50K" rather than on the
    disease name; accession, title, sample count and organism are GEO's own
    values, retrieved 2026-08-20. Relevance triage: this is one of only two
    accessions found that are specific to the OPTN(E50K) genotype rather than
    to glaucoma generally - a disease-name search returns trabecular meshwork
    and generic POAG datasets that resolve perfectly but are about the wrong
    entity. Carries no evidence block: an evidence item needs an exact quote
    from the cited abstract, and this record's provenance is the repository
    metadata plus its own linked publication.
- accession: geo:GSE173129
  title: Differential gene expression and pathway analysis by RNA sequencing in human OPTN(E50K) astrocytes
  description: >
    RNA-seq of human stem cell-derived astrocytes carrying OPTN(E50K), from the
    study of non-cell-autonomous contributions to ganglion cell degeneration.
    Complements the ganglion-cell dataset above by covering the glial side of
    the same genotype.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 8
  publication: PMID:35714595
  notes: >
    Located by GEO DataSets search on "optineurin E50K"; accession, title,
    sample count and organism are GEO's own values, retrieved 2026-08-20.
    Note that the astrocyte arm is NOT modeled in this entry's pathophysiology,
    which is curated as a cell-autonomous ganglion cell lesion; a
    non-cell-autonomous glial contribution is plausible but not yet curated
    here. Carries no evidence block for the same reason as the record above.
notes: >
  Scope. This entry covers the Mendelian, OPTN-caused entity. Generic adult
  primary open-angle glaucoma - including the trabecular meshwork outflow
  mechanism and IOP-lowering drug classes - lives in `Glaucoma.yaml`, whose
  `genetic:` section already carries an OPTN record; the two should be read
  together. `Juvenile_Open_Angle_Glaucoma.yaml` covers the mechanistically
  distinct MYOC/CYP1B1 juvenile-onset entity. TBK1-related normal-tension
  glaucoma is a separate concept and is not curated here.

  What is deliberately absent. No `biochemical` markers are curated: there is
  no validated biochemical or imaging biomarker specific to OPTN-related
  disease beyond the structural glaucoma measures already captured as
  phenotypes. The two `datasets` records are deliberately
  restricted to accessions specific to the OPTN(E50K) genotype. A disease-name
  search returns many trabecular meshwork and generic POAG datasets that
  resolve perfectly and are about the wrong entity, since the outflow arm is
  precisely what does not apply here; those were excluded on relevance triage,
  not for lack of candidates.

  role: consequence
  description: >
    Cumulative ganglion cell and axon loss produces the clinical entity: deep
    optic disc cupping, retinal nerve fibre layer thinning, and progressive
    visual field loss, with an open and unremarkable drainage angle and
    intraocular pressures at or below 21 mmHg. The defining feature relative to
    the rest of the glaucoma family is that this endpoint is reached without
    the elevated-IOP step: E50K carriers in the Moorfields series had mean
    presenting and peak diurnal IOP of about 15 and 17 mmHg, and E50K mice
    develop retinal degeneration at intraocular pressures statistically
    indistinguishable from wild-type littermates. Relative to mutation-negative
    normal-tension glaucoma the course is more aggressive - younger age at
    presentation, deeper cupping and smaller rim area at diagnosis, and a much
    higher rate of filtration surgery for progressive field loss.
  cell_types:
  - preferred_term: Retinal Ganglion Cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: Optic Nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  - preferred_term: Optic Disc
    term:
      id: UBERON:0001783
      label: optic disc
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 11 subjects had normal tension glaucoma (NTG), with presenting and highest IOP of 15.3 +/- 3.0 and 16.5 +/- 2.5 mm Hg (+/-SD) on diurnal testing."
    explanation: >
      Quantifies the normal intraocular pressures at which the optic
      neuropathy occurs in E50K carriers, which is the defining claim of this
      node.
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of filtration surgery performed for progressive visual field loss in those with and without the E50K mutation was 72.7% and 25.3%, respectively (P = 0.003), and all subjects with E50K were found to have progressing visual fields."
    explanation: >
      Supports the more aggressive course relative to mutation-negative
      normal-tension glaucoma asserted in this node.
  - reference: PMID:23669351
    reference_title: "Enhanced optineurin E50K-TBK1 interaction evokes protein insolubility and initiates familial primary open-angle glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The optineurin (OPTN) E50K mutation was first identified in familial primary open-angle glaucoma (POAG), the onset of which is not associated with intraocular pressure (IOP) elevation, and is classified as normal-tension glaucoma (NTG)."
    explanation: >
      States the IOP-independence of onset that separates this node from the
      module's elevated-IOP arm.
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common features of OPTN -associated NTG due to Glu50Lys mutation included early onset of disease with an IOP <21 mm Hg, marked optic disc cupping, and progressive visual field loss"
    explanation: >
      Independent long-follow-up pedigree series describing the same clinical
      triad of early onset, sub-21 mmHg IOP, marked cupping and progressive
      field loss.
  notes: >
    This node deliberately does NOT declare conformance to
    `glaucoma_optic_neuropathy#Elevated Intraocular Pressure` or to the
    module's Trabecular Meshwork Outflow Dysfunction trigger. The module's own
    notes flag normal-tension glaucoma as the partial exception in which
    ganglion cell loss occurs at statistically normal IOP, and this entity is
    that exception.
phenotypes:
- name: Open Angle Glaucoma
  category: Ophthalmological
  diagnostic: true
  description: >
    Glaucomatous optic neuropathy with an open, gonioscopically normal drainage
    angle, arising in adulthood.
  phenotype_term:
    preferred_term: Open angle glaucoma
    term:
      id: HP:0012108
      label: Open angle glaucoma
    onset:
      onset_category: ADULT
      mean_age_years: 40.8
      notes: >
        Adult onset, but at the young end of the adult range: mean age at
        presentation 40.8 years (SD 15) in the Moorfields E50K series,
        significantly younger than mutation-negative normal-tension glaucoma
        controls. Still adult-onset, which distinguishes this entity from
        juvenile open-angle glaucoma.
  evidence:
  - reference: PMID:11834836
    reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a study of 54 families with autosomal dominantly inherited adult-onset POAG, we identified the causative gene on chromosome 10p14 and designated it OPTN (for \"optineurin\")."
    explanation: >
      The gene was identified in families with adult-onset primary open-angle
      glaucoma, establishing the open-angle phenotype for this entity.
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subjects with E50K presented at a younger age (40.8 +/- 15 years, P = 0.0001) and had more advanced optic disc cupping (mean cup-disc ratio +/- SD 0.86 +/- 0.1, P = 0.001) and smaller neuroretinal rim area"
    explanation: >
      Supports the age-at-presentation figure recorded on the onset descriptor
      and its significant difference from mutation-negative NTG controls.
- name: Normal Intraocular Pressure at Presentation
  category: Ophthalmological
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >
    Unlike most open-angle glaucoma, OPTN-related disease characteristically
    presents with intraocular pressure inside the statistically normal range
    (21 mmHg or less) - the normal-tension glaucoma presentation. All 11
    E50K-carrying patients in the best-characterized clinical series had normal
    tension glaucoma. Because there is no HPO term for normal-tension glaucoma
    and the relevant clinical observation is the ABSENCE of ocular
    hypertension, no `phenotype_term` is bound here rather than binding an
    inapt one; the finding is carried by the description and its evidence.
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 11 subjects had normal tension glaucoma (NTG), with presenting and highest IOP of 15.3 +/- 3.0 and 16.5 +/- 2.5 mm Hg (+/-SD) on diurnal testing."
    explanation: >
      Reports that all E50K carriers in the series had normal-tension glaucoma
      with quantified normal presenting and peak diurnal pressures, supporting
      the VERY_FREQUENT band in this cohort.
- name: Increased Cup-to-Disc Ratio
  category: Ophthalmological
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >
    Marked optic disc cupping, deeper at diagnosis than in mutation-negative
    normal-tension glaucoma (mean cup-disc ratio 0.86 in the E50K series, with
    correspondingly smaller neuroretinal rim area).
  phenotype_term:
    preferred_term: Increased cup-to-disc ratio
    term:
      id: HP:0012796
      label: Increased cup-to-disc ratio
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subjects with E50K presented at a younger age (40.8 +/- 15 years, P = 0.0001) and had more advanced optic disc cupping (mean cup-disc ratio +/- SD 0.86 +/- 0.1, P = 0.001) and smaller neuroretinal rim area"
    explanation: >
      Quantifies the cupping in E50K carriers and its significant excess over
      mutation-negative NTG controls, supporting both the phenotype and the
      VERY_FREQUENT band.
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common features of OPTN -associated NTG due to Glu50Lys mutation included early onset of disease with an IOP <21 mm Hg, marked optic disc cupping, and progressive visual field loss"
    explanation: >
      Independent pedigree series listing marked optic disc cupping among the
      common features of Glu50Lys disease.
- name: Glaucomatous Visual Field Defect
  category: Ophthalmological
  frequency: VERY_FREQUENT
  description: >
    Progressive glaucomatous visual field loss. In the Moorfields series every
    E50K-carrying patient had progressing fields, and progression appeared to
    stabilize in a separate long-follow-up pedigree only once intraocular
    pressure was brought below 10 mmHg.
  phenotype_term:
    preferred_term: Glaucomatous visual field defect
    term:
      id: HP:0007854
      label: Glaucomatous visual field defect
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of filtration surgery performed for progressive visual field loss in those with and without the E50K mutation was 72.7% and 25.3%, respectively (P = 0.003), and all subjects with E50K were found to have progressing visual fields."
    explanation: >
      All E50K subjects had progressing visual fields, supporting both the
      VERY_FREQUENT band and the PROGRESSIVE course.
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive visual field loss which appeared to stabilize once an IOP of less than 10 mm Hg was achieved"
    explanation: >
      Supports the progressive course and the observation about stabilization
      at very low intraocular pressure quoted in the description.
- name: Abnormal Retinal Nerve Fiber Layer Morphology
  category: Ophthalmological
  description: >
    Thinning of the retinal nerve fibre layer follows ganglion cell axon loss.
    Directly demonstrated in E50K mouse retina, where nerve fibre layer
    thinning at the optic nerve head occurs at normal intraocular pressure;
    this phenotype is therefore supported here by model-organism evidence and
    is annotated without a frequency band.
  phenotype_term:
    preferred_term: Abnormal retinal nerve fiber layer morphology
    term:
      id: HP:0020119
      label: Abnormal retinal nerve fiber layer morphology
  evidence:
  - reference: PMID:20388642
    reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "After 16 months, histological abnormalities were exclusively observed in the retina of E50K mutant mice with loss of RGCs and connecting synapses in the peripheral retina leading to a thinning of the nerve fiber layer at the optic nerve head at normal IOP."
    explanation: >
      Demonstrates nerve fibre layer thinning at normal IOP in the E50K mouse.
      Graded PARTIAL because this is model-organism evidence standing in for a
      human phenotype claim.
genetic:
- name: OPTN
  gene_term:
    preferred_term: OPTN
    term:
      id: hgnc:17142
      label: OPTN
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:11834836
      reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a study of 54 families with autosomal dominantly inherited adult-onset POAG, we identified the causative gene on chromosome 10p14 and designated it OPTN (for \"optineurin\")."
      explanation: >
        OPTN was identified as causative in autosomal dominantly inherited
        pedigrees.
  variants:
  - name: OPTN p.Glu50Lys (E50K)
    description: >
      The recurrent missense allele of OPTN in normal-tension glaucoma, and
      the most common glaucoma-associated OPTN mutation. Acts by toxic gain of
      function: it strengthens the OPTN-TBK1 interaction, renders optineurin
      insoluble and covalently cross-linked, and blocks autophagic flux.
    gene:
      preferred_term: OPTN
      term:
        id: hgnc:17142
        label: OPTN
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24983867
      reference_title: "Oligomerization of optineurin and its oxidative stress- or E50K mutation-driven covalent cross-linking: possible relationship with glaucoma pathology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In cells expressing OPTN bearing the most common glaucoma-associated mutation, E50K, covalent oligomers were formed even without H2O2 stimulation."
      explanation: >
        Identifies E50K as the most common glaucoma-associated OPTN mutation
        and characterizes its biophysical consequence.
    - reference: PMID:27693724
      reference_title: "Significance of optineurin mutations in glaucoma and other diseases."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "we focus on the OPTN E50K mutation, the most common mutation for NTG"
      explanation: >
        Independent review confirming E50K as the most common OPTN mutation in
        normal-tension glaucoma. Evidence source is OTHER because this is a
        review article.
  evidence:
  - reference: PMID:11834836
    reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence alterations in OPTN were found in 16.7% of families with hereditary POAG, including individuals with normal intraocular pressure."
    explanation: >
      Establishes OPTN sequence alterations as the cause in a defined fraction
      of hereditary POAG families, including normal-pressure cases.
  - reference: PMID:11834836
    reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optineurin is expressed in trabecular meshwork, nonpigmented ciliary epithelium, retina, and brain, and we speculate that it plays a neuroprotective role."
    explanation: >
      Documents the retinal expression that makes a ganglion-cell-autonomous
      mechanism plausible, and the originally proposed neuroprotective role.
  - reference: PMID:29951055
    reference_title: "Altered Functions and Interactions of Glaucoma-Associated Mutants of Optineurin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glaucoma-associated mutations of OPTN are mostly missense mutations."
    explanation: >
      Supports the statement that the glaucoma-causing OPTN allele class is
      predominantly missense. Evidence source is OTHER because this is a
      review article.
  variant_origin: GERMLINE
  notes: >
    OPTN (optineurin) at the GLC1E locus on 10p14 is the causative gene for
    this entity. Glaucoma-associated OPTN changes are predominantly missense;
    the recurrent p.Glu50Lys (E50K) allele segregates with disease in large
    pedigrees and accounts for essentially all of the well-characterized
    mechanistic work. It is a heterozygous germline change acting by toxic
    gain of function rather than by haploinsufficiency - the mutant protein
    acquires abnormal TBK1 binding, insolubility and covalent cross-linking
    rather than merely losing wild-type activity - which is consistent with
    the dominant inheritance. Optineurin is expressed in retina as well as in
    trabecular meshwork and nonpigmented ciliary epithelium, but the
    disease-relevant lesion in this entity is the retinal one.

    The related Mendelian normal-tension glaucoma gene TBK1 is not curated as a
    gene of this entity. TBK1 copy-number gain causes its own normal-tension
    glaucoma and belongs to a separate disease concept; TBK1 appears here only
    as the interacting kinase through which mutant optineurin acts, and as a
    drug target.
- name: OPTN p.Met98Lys (M98K)
  gene_term:
    preferred_term: OPTN
    term:
      id: hgnc:17142
      label: OPTN
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  features: >
    M98K is a common OPTN sequence variant repeatedly reported as associated
    with open-angle and normal-tension glaucoma in East Asian cohorts, with
    roughly threefold to fourfold odds ratios in a Japanese case-control
    series, but not replicated in Caucasian populations. It is curated as a
    susceptibility allele, explicitly NOT as a Mendelian cause of this entity:
    the causative-allele evidence in this entry rests on E50K. Mechanistic work
    reports that M98K perturbs autophagy in the opposite direction to E50K -
    enhancing it, with Rab12-dependent transferrin receptor degradation and
    apoptotic retinal cell death - so it is not a milder version of the same
    lesion.
  evidence:
  - reference: PMID:15226658
    reference_title: "Molecular genetic analysis of optineurin gene for primary open-angle and normal tension glaucoma in the Japanese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of the missense Met98Lys variant was higher in the POAG and NTG groups than in the control group (16.9% versus 5%, 15.4% versus 5%; P = 0.009 and P = 0.029, and odds ratio 3.85 and 3.45, respectively, for the dominant effect of the OPTN A allele)."
    explanation: >
      Quantifies the association of M98K with POAG and NTG in a Japanese
      case-control series, supporting the SUSCEPTIBILITY typing.
  - reference: PMID:26302410
    reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A polymorphism of optineurin, M98K, associated with glaucoma, causes enhanced autophagy leading to transferrin receptor degradation and apoptotic death of retinal cells."
    explanation: >
      Supports the claim that M98K acts through enhanced rather than impaired
      autophagy, the opposite direction to E50K.
  notes: >
    The population-specificity of this association cuts both ways and is
    recorded as an open discussion below: the Caucasian-derived causative
    alleles were themselves absent from Japanese glaucoma cohorts.
mechanistic_hypotheses:
- hypothesis_group_id: autophagy_block_model
  hypothesis_label: Autophagic-lysosomal flux block as the primary lesion
  status: CANONICAL
  description: >
    The dominant model: mutant optineurin blocks autophagic flux in retinal
    ganglion cells, undegraded cargo accumulates, and the cells die by
    apoptosis. Supported by concordant LC3-II/p62 accumulation in knock-in
    mice, in E50K-expressing retinal cells, and in isogenic human stem
    cell-derived retinal ganglion cells, and by rescue on pharmacological
    induction of autophagy.
  evidence:
  - reference: PMID:31238079
    reference_title: "Mendelian genes in primary open angle glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPTN and TBK1 cause a dysregulation of autophagy which may directly cause retinal ganglion cell damage and normal tension glaucoma."
    explanation: >
      States the autophagy-dysregulation model as the accepted explanation for
      OPTN-related normal-tension glaucoma.
  - reference: PMID:39425218
    reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mTOR-independent induction of autophagy reduced protein accumulation and restored neurite outgrowth in diseased OPTN(E50K) RGCs"
    explanation: >
      The rescue-on-induction result that upgrades this from an association to
      a causal model.
- hypothesis_group_id: vesicle_trafficking_model
  hypothesis_label: Rab8-dependent vesicle trafficking failure as a parallel lesion
  status: ALTERNATIVE
  description: >
    An alternative or contributory model in which the disease-relevant
    consequence of E50K is loss of the optineurin-Rab8 interaction and the
    consequent failure of Golgi-to-membrane vesicle transport and receptor
    recycling, with autophagic changes secondary. Demonstrated biochemically
    and in transgenic mouse retina, but without an equivalent rescue
    experiment tying it to ganglion cell survival.
  evidence:
  - reference: PMID:20388642
    reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "At the molecular level, introduction of the E50K mutation disrupts the interaction between Optn and Rab8 GTPase, a protein involved in the regulation of vesicle transport from Golgi to plasma membrane."
    explanation: >
      Graded PARTIAL: establishes the trafficking lesion this model rests on,
      but does not by itself show that trafficking failure rather than the
      accompanying autophagy defect causes ganglion cell death.
treatments:
- name: Intraocular Pressure Lowering
  description: >
    All established glaucoma therapy works by lowering intraocular pressure,
    and that remains the only evidence-based intervention for OPTN-related
    disease even though the pressure is not elevated to begin with. In a
    four-generation Glu50Lys pedigree followed for a mean of 17 years, visual
    field progression appeared to stabilize only once IOP was brought below
    10 mmHg, so the target pressure is substantially lower than in ordinary
    open-angle glaucoma. This is an observational pedigree finding, not a
    randomized result.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prostaglandin analogue
      term:
        id: NCIT:C78568
        label: Prostaglandin Analogue
    - preferred_term: betaxolol
      term:
        id: CHEBI:3082
        label: betaxolol
    - preferred_term: brimonidine
      term:
        id: CHEBI:3175
        label: brimonidine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive visual field loss which appeared to stabilize once an IOP of less than 10 mm Hg was achieved"
    explanation: >
      The observation behind the very low target pressure recommended for
      OPTN-related normal-tension glaucoma.
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Betaxolol, brimonidine, prostaglandin analogues, trabeculectomy (in refractory cases), systemic calcium channel blockers (such as nifedipine) and 24-hour monitoring of blood pressure are considered in the management of NTG."
    explanation: >
      Source for the agent classes bound in therapeutic_agent. Graded PARTIAL
      and tagged OTHER deliberately: this is a narrative review of
      normal-tension glaucoma in general, NOT of OPTN-related disease, so it
      establishes what is used in NTG management and not that any of these
      agents has OPTN-specific evidence. Calcium channel blockers are named in
      the quote but deliberately not bound as agents here - they target the
      vascular-dysregulation model of non-Mendelian NTG, which is not this
      entity's mechanism.
  - reference: PMID:27413503
    reference_title: "Update on Normal Tension Glaucoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Treatment is generally aimed to lower IOP by 30% from pre-existing levels to 12-14 mmHg."
    explanation: >
      The general NTG pressure target, for contrast with the sub-10 mmHg
      target the OPTN-specific pedigree evidence above supports. Graded PARTIAL
      because it is a general-NTG figure, not an OPTN-specific one.
  notes: >
    The agents bound here are the standard normal-tension glaucoma
    pharmacotherapy classes, carried because management of this entity follows
    NTG algorithms. None of them has OPTN-specific efficacy evidence, and none
    addresses the autophagy lesion; they lower pressure in an eye whose
    pressure was never high. That is the therapeutic gap the two
    investigational entries below are aimed at.
- name: Filtration Surgery
  description: >
    Filtering surgery for progressive visual field loss is required far more
    often in E50K carriers than in mutation-negative normal-tension glaucoma
    (72.7% versus 25.3% in the Moorfields series). This reflects the aggressive
    natural history rather than a mutation-specific surgical indication.
  treatment_term:
    preferred_term: Surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rate of filtration surgery performed for progressive visual field loss in those with and without the E50K mutation was 72.7% and 25.3%, respectively (P = 0.003)"
    explanation: >
      Quantifies the excess rate of filtration surgery in E50K carriers.
- name: TBK1 Inhibition (Investigational)
  description: >
    Because the E50K lesion works through an abnormally strong OPTN-TBK1
    interaction, inhibiting TBK1 is the mechanistically obvious intervention.
    The TBK1 inhibitor BX795 reverses the aberrant insolubility of the E50K
    protein in cells, and amlexanox has been reported to protect retinal
    ganglion cells in Optn E50K knock-in mice. INVESTIGATIONAL ONLY - this is
    preclinical cell and mouse data with no human trial evidence, and it must
    not be curated or read as established therapy.

    Only amlexanox is bound in therapeutic_agent. BX795 has no CHEBI or NCIT
    term, and it is deliberately NOT stood in for by a broad drug class: what
    matters mechanistically here is TBK1 selectivity, which a class covering
    every kinase inhibitor does not express. BX795's identity is carried by
    this description and by the cited evidence instead.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amlexanox
      term:
        id: NCIT:C47395
        label: Amlexanox
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: OPTN Missense Variant and Optineurin Misfolding
    treatment_effect: INHIBITS
    description: >
      TBK1 inhibition targets the kinase whose enhanced binding to mutant
      optineurin produces the insolubility that initiates this pathway.
    evidence:
    - reference: PMID:23669351
      reference_title: "Enhanced optineurin E50K-TBK1 interaction evokes protein insolubility and initiates familial primary open-angle glaucoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with a TBK1 inhibitor, BX795, abrogated the aberrant insolubility of the E50K mutant."
      explanation: >
        Shows that inhibiting TBK1 reverses the specific molecular defect
        modeled by the target node.
  evidence:
  - reference: PMID:27693724
    reference_title: "Significance of optineurin mutations in glaucoma and other diseases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show for the first time that amlexanox protects RGCs in Optn E50K knock-in mice."
    explanation: >
      Reports retinal ganglion cell protection by a TBK1 inhibitor in an E50K
      knock-in mouse - the strongest in vivo support for this approach, and
      still preclinical.
  - reference: PMID:29951055
    reference_title: "Altered Functions and Interactions of Glaucoma-Associated Mutants of Optineurin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TBK1 protein kinase, which mediates E50K-OPTN and M98K-OPTN induced cell death, is emerging as a potential drug target."
    explanation: >
      Review identifying TBK1 as an emerging drug target for OPTN-mutant
      glaucoma. Evidence source is OTHER because this is a review article.
- name: Autophagy Induction (Investigational)
  description: >
    If the primary lesion is a block in autophagic flux, forcing flux should
    rescue the cells. Rapamycin reduced TDP-43 aggregation and increased
    ganglion cell number and visual function in OPTN(E50K) mice, and
    mTOR-independent autophagy induction restored neurite outgrowth in isogenic
    OPTN(E50K) human stem cell-derived ganglion cells. INVESTIGATIONAL ONLY -
    preclinical mouse and human-cell data with no clinical trial evidence.
    Note also that the human-cell work found mTORC1 signalling already
    DECREASED in mutant cells, which is an argument against mTOR inhibitors
    specifically and in favour of mTOR-independent inducers.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rapamycin (sirolimus)
      term:
        id: CHEBI:9168
        label: sirolimus
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Autophagic Flux in Retinal Ganglion Cells
    treatment_effect: ACTIVATES
    description: >
      Pharmacological induction of autophagy is directed at restoring flux
      through the pathway blocked by mutant optineurin.
    evidence:
    - reference: PMID:39425218
      reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the mTOR-independent induction of autophagy reduced protein accumulation and restored neurite outgrowth in diseased OPTN(E50K) RGCs"
      explanation: >
        Direct rescue of the target node's consequences by inducing autophagy
        in human OPTN(E50K) retinal ganglion cells.
  evidence:
  - reference: PMID:33723228
    reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, rapamycin increased the RGC number and visual function of E50K mice."
    explanation: >
      In vivo rescue of ganglion cell number and visual function by an
      autophagy inducer in an E50K mouse.
animal_models:
- name: Optn E50K knock-in mouse (CRISPR/Cas9 point mutation)
  species: Mouse
  genotype: Optn p.Glu50Lys knock-in
  publication: PMID:33723228
  description: >
    A CRISPR/Cas9 point-mutation knock-in mouse carrying the human-equivalent
    E50K change at the endogenous Optn locus - the closest genetic match to the
    human disease among the available models, since it avoids the
    supraphysiological expression of the transgenic lines. It shows retinal
    ganglion cell loss, retinal thinning, reduced visual function and raised
    cleaved caspase-3, together with blocked autophagic flux and cytoplasmic
    TDP-43 accumulation, at intraocular pressures indistinguishable from
    wild-type littermates. Aged animals also develop spinal cord TDP-43
    pathology and motor dysfunction, mirroring the OPTN link to ALS.
  evidence:
  - reference: PMID:33723228
    reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "OPTN (E50K) mutant mice were generated and analysed for genotype and phenotype."
    explanation: >
      Establishes the existence and characterization of the knock-in model
      described here.
  modeled_mechanisms:
  - target: Retinal Ganglion Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Ganglion cell loss with apoptotic markers at normal intraocular
      pressure, from the endogenous mutant allele.
    evidence:
    - reference: PMID:33723228
      reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The glaucoma-associated E50K mutation in optineurin (OPTN) is known to affect autophagy and cause the apoptosis of retinal ganglion cells (RGCs)"
      explanation: >
        Establishes that this model is informative for the ganglion cell
        apoptosis node it is linked to.
    limitations: >
      The reported animals are homozygous for the knock-in change, whereas
      human disease is heterozygous, so gene dosage is not matched. Mouse
      retina lacks a macula and the mouse optic nerve head has no lamina
      cribrosa, so the biomechanical context of human glaucomatous cupping is
      absent.
    readouts:
    - name: Viable retinal ganglion cell count (NeuN immunolabelling)
      target: Retinal Ganglion Cell Apoptosis
      direction: DECREASED

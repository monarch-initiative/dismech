name: OPTN-related Open Angle Glaucoma
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
parents:
- Glaucoma
disease_term:
  preferred_term: OPTN-related open angle glaucoma
  term:
    id: MONDO:0100553
    label: OPTN-related open angle glaucoma
synonyms:
- "glaucoma 1, open angle, E"
- GLC1E
- OPTN-related normal tension glaucoma
- optineurin-associated normal tension glaucoma
description: >
  Adult-onset open-angle glaucoma caused by heterozygous variants in optineurin
  (OPTN, the GLC1E locus on chromosome 10p14), inherited as an autosomal
  dominant Mendelian trait. OPTN was the second gene identified as a Mendelian
  cause of primary open-angle glaucoma, and the recurrent p.Glu50Lys (E50K)
  missense change is by far its best-characterized allele. What distinguishes
  this entity from the trabecular-outflow glaucomas is that the optic
  neuropathy develops at intraocular pressures within the statistically normal
  range: affected individuals characteristically present with normal-tension
  glaucoma, and the disease-causing lesion sits in the retinal ganglion cell
  rather than in the aqueous drainage apparatus. Mutant optineurin, an
  autophagy receptor, binds TBK1 abnormally tightly, becomes insoluble and
  covalently cross-linked, and blocks autophagic-lysosomal flux and
  OPTN-dependent mitophagy in retinal ganglion cells, driving their apoptotic
  loss and a progressive glaucomatous optic neuropathy. Compared with
  mutation-negative normal-tension glaucoma, E50K carriers present younger,
  with deeper optic disc cupping and a much higher rate of progression to
  filtration surgery. This entry is scoped to the OPTN-caused Mendelian entity
  and deliberately does not re-derive the generic IOP-driven adult POAG content
  held in `Glaucoma.yaml`; the shared downstream neurodegeneration is expressed
  by conformance to the `glaucoma_optic_neuropathy` module rather than by
  duplicating its outflow arm, which does not apply here.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC

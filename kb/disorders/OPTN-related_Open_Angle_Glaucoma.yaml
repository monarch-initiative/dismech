inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    OPTN-related glaucoma segregates as an autosomal dominant trait in the
    multigeneration pedigrees in which the gene was discovered and in
    subsequently reported E50K families. Penetrance is age-dependent and
    incomplete at younger ages: in the Moorfields series seven E50K carriers
    aged 23-58 years had normal discs and fields at the time of study, so an
    unaffected examination in a young carrier does not exclude later disease.
  evidence:
  - reference: PMID:11834836
    reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a study of 54 families with autosomal dominantly inherited adult-onset POAG, we identified the causative gene on chromosome 10p14 and designated it OPTN (for \"optineurin\")."
    explanation: >
      The gene-discovery study established OPTN as the causative gene in
      autosomal dominantly inherited adult-onset POAG pedigrees.
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, seven E50K mutation-carrying individuals in two families (age range, 23-58 years) presented with normal optic discs and visual fields and, as yet, no signs of glaucoma."
    explanation: >
      Documents age-dependent, incomplete penetrance among carriers in the two
      studied families, supporting the penetrance caveat in the description.
prevalence:
- population: Familial adult-onset primary open-angle glaucoma (54 pedigrees, gene-discovery cohort)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >
    Not a population prevalence. This is the proportion of hereditary POAG
    families carrying an OPTN sequence alteration in the original gene-discovery
    cohort (16.7%), an ascertainment-enriched familial series; later unselected
    cohorts give far lower figures (see the normal-tension glaucoma record
    below). Recorded here because it is the number most often quoted for this
    entity and is frequently misread as a population figure.
  evidence:
  - reference: PMID:11834836
    reference_title: "Adult-onset primary open-angle glaucoma caused by mutations in optineurin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence alterations in OPTN were found in 16.7% of families with hereditary POAG, including individuals with normal intraocular pressure."
    explanation: >
      Source of the 16.7%-of-families figure and of the observation that
      carriers include individuals with normal intraocular pressure.
- population: Primary open-angle glaucoma with IOP 21 mmHg or less (normal tension glaucoma)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >
    OPTN mutation accounts for roughly 1% of normal-tension glaucoma; OPTN,
    TBK1 and MYOC together account for approximately 2% of NTG cases. This is a
    fraction-of-cases figure, not a population rate, so no rate_per_100000 is
    recorded.
  evidence:
  - reference: PMID:31238079
    reference_title: "Mendelian genes in primary open angle glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while mutations in OPTN, TBK1, and MYOC each cause ∼1% of POAG with IOP ≤21 mmHg, i.e. normal tension glaucoma"
    explanation: >
      Gives the ~1% share of normal-tension glaucoma attributable to OPTN
      mutation.
  - reference: PMID:37353142
    reference_title: "Familial normal tension glaucoma genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 2% of NTG cases are caused primarily by mutations in single genes, optineurin (OPTN), TANK binding kinase 1 (TKB1), or myocilin (MYOC)."
    explanation: >
      Independent review giving the combined single-gene share of NTG, which
      bounds the OPTN-specific figure.
pathophysiology:
- name: OPTN Missense Variant and Optineurin Misfolding
  biological_scale: MOLECULAR
  role: trigger
  description: >
    A heterozygous missense change in OPTN - most commonly p.Glu50Lys (E50K),
    the recurrent allele in normal-tension glaucoma pedigrees - alters the
    biophysical behaviour of optineurin. Mutant OPTN binds TANK-binding kinase 1
    (TBK1) abnormally strongly, which blocks the normal oligomerization and
    solubility that optineurin needs for its intracellular transitions, and the
    insoluble protein accumulates in the endoplasmic reticulum. Independently,
    E50K drives formation of covalently cross-linked optineurin oligomers of the
    kind normally seen only under oxidative stress. This is a toxic
    gain-of-function lesion rather than simple haploinsufficiency, which is why
    heterozygosity suffices and why TBK1 is a tractable drug target one step
    downstream.
  molecular_functions:
  - preferred_term: protein kinase binding
    term:
      id: GO:0019901
      label: protein kinase binding
    modifier: INCREASED
  evidence:
  - reference: PMID:23669351
    reference_title: "Enhanced optineurin E50K-TBK1 interaction evokes protein insolubility and initiates familial primary open-angle glaucoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The E50K mutant strongly interacted with TANK-binding kinase 1 (TBK1), which prohibited the proper oligomerization and solubility of OPTN, both of which are important for OPTN intracellular transition."
    explanation: >
      Establishes the enhanced E50K-TBK1 interaction and the resulting loss of
      proper oligomerization and solubility that define this node.
  - reference: PMID:23669351
    reference_title: "Enhanced optineurin E50K-TBK1 interaction evokes protein insolubility and initiates familial primary open-angle glaucoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Over-expression of E50K in HEK293 cells indicated accumulation of insoluble OPTN in the endoplasmic reticulum (ER)."
    explanation: >
      Localizes the insoluble mutant protein to the endoplasmic reticulum.
  - reference: PMID:24983867
    reference_title: "Oligomerization of optineurin and its oxidative stress- or E50K mutation-driven covalent cross-linking: possible relationship with glaucoma pathology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cells expressing OPTN bearing the most common glaucoma-associated mutation, E50K, covalent oligomers were formed even without H2O2 stimulation."
    explanation: >
      Shows that E50K alone drives the covalent cross-linked oligomer state
      that wild-type optineurin adopts only under oxidative stress, supporting
      the misfolding characterization of this node.
  downstream:
  - target: Impaired Autophagic Flux in Retinal Ganglion Cells
    causal_link_type: DIRECT
    description: >
      The misfolded, TBK1-bound mutant protein is itself the autophagy
      receptor, so its aberrant state directly disables the flux it should
      support.
    evidence:
    - reference: PMID:26302410
      reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A glaucoma-associated mutant of optineurin, E50K, impairs autophagy as well as vesicle trafficking, leading to death of retinal cells by apoptosis."
      explanation: >
        States the E50K-to-impaired-autophagy step that this edge asserts.
  - target: Disrupted Rab8-Dependent Vesicle Trafficking
    causal_link_type: DIRECT
    description: >
      The same substitution abolishes the optineurin-Rab8 interaction that
      supports Golgi-to-membrane vesicle transport.
    evidence:
    - reference: PMID:20388642
      reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At the molecular level, introduction of the E50K mutation disrupts the interaction between Optn and Rab8 GTPase, a protein involved in the regulation of vesicle transport from Golgi to plasma membrane."
      explanation: >
        Directly evidences the E50K-to-Rab8-disruption step that this edge
        asserts.
- name: Impaired Autophagic Flux in Retinal Ganglion Cells
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  biological_scale: CELLULAR
  role: central_effector
  description: >
    Optineurin is a selective autophagy receptor: it binds polyubiquitinated
    cargo through its ubiquitin-binding domain and delivers it to nascent
    autophagosomes through its LC3-interacting region, and it links
    autophagosomes to lysosomes via myosin VI. Retinal ganglion cells express
    optineurin highly and, as long-lived post-mitotic neurons with an
    exceptional axonal maintenance burden, depend heavily on autophagic
    quality control. Mutant optineurin blocks flux through this pathway.
    In OPTN(E50K) mice and in E50K-expressing retinal cells, LC3-II and
    p62/SQSTM1 both accumulate - the signature of a downstream block rather
    than reduced initiation - and undegraded substrates including TDP-43
    aggregate in the cytoplasm. In isogenic OPTN(E50K) human stem cell-derived
    retinal ganglion cells the same lesion is accompanied by AMPK activation
    and reduced mTORC1 signalling, and mTOR-independent induction of autophagy
    restores neurite outgrowth, showing the block is the proximate cause of the
    neurodegenerative phenotype rather than a bystander. This node conforms to
    the `disabled_macroautophagy` module's central effector: the failure point
    here is selective cargo recognition by the receptor itself, not the core
    ATG machinery, and it is genetic rather than age-associated, but the
    resulting loss of cytoplasmic quality control is the conserved state that
    module models.
  cell_types:
  - preferred_term: Retinal Ganglion Cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  - preferred_term: Autophagosome-Lysosome Fusion
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
    modifier: DECREASED
  - preferred_term: mTORC1 Signalling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:26302410
    reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Optineurin was identified as an autophagy receptor that directly interacts with autophagosomal protein, LC3, and ubiquitin."
    explanation: >
      Establishes the normal autophagy-receptor role of optineurin that this
      node describes being lost.
  - reference: PMID:26302410
    reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Optineurin interacts with a motor protein, myosinVI, and this interaction is involved in mediating fusion of autophagosomes with lysosomes."
    explanation: >
      Supports the autophagosome-lysosome fusion step annotated on this node
      as an optineurin-dependent function.
  - reference: PMID:33723228
    reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased p62/SQSTM1 and LC3-II levels indicated that autophagic flux was inhibited and contributed to TDP-43 aggregation in vivo and in vitro."
    explanation: >
      Provides the direct flux measurement (LC3-II and p62 both up) behind the
      DECREASED macroautophagy annotation, in an E50K knock-in mouse and in
      E50K-expressing retinal cells.
  - reference: PMID:39425218
    reference_title: "Acquisition of neurodegenerative features in isogenic OPTN(E50K) human stem cell-derived retinal ganglion cells associated with autophagy disruption and mTORC1 signaling reduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified an impairment of autophagic-lysosomal degradation and decreased mTORC1 signaling via activation of the stress sensor AMPK, along with subsequent neurodegeneration in OPTN(E50K) RGCs differentiated from hPSCs"
    explanation: >
      Human isogenic stem-cell-derived retinal ganglion cell evidence for both
      the autophagic-lysosomal block and the reduced mTORC1 signalling
      annotated on this node.
  - reference: PMID:31238079
    reference_title: "Mendelian genes in primary open angle glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPTN and TBK1 cause a dysregulation of autophagy which may directly cause retinal ganglion cell damage and normal tension glaucoma."
    explanation: >
      States the autophagy-to-RGC-damage causal chain at the level of the human
      disease, complementing the cellular and mouse evidence above.
  downstream:
  - target: Impaired Mitophagy and Mitochondrial Dysfunction
    causal_link_type: DIRECT
    description: >
      Mitophagy is one of the selective-autophagy programmes optineurin
      serves, so a receptor-level lesion propagates into it.
    evidence:
    - reference: PMID:26142952
      reference_title: "Optineurin: The autophagy connection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It is involved in xenophagy, mitophagy, aggrephagy, and tumor suppression."
      explanation: >
        Places mitophagy among the optineurin-dependent selective-autophagy
        programmes, which is what makes this edge follow. Evidence source is
        OTHER because this is a review.
  - target: Retinal Ganglion Cell Apoptosis
    causal_link_type: DIRECT
    description: >
      Loss of autophagic quality control in a long-lived post-mitotic neuron
      leads to its apoptotic death; forcing flux rescues the phenotype, which
      is what makes this edge causal rather than correlative.
    evidence:
    - reference: PMID:26302410
      reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, an optimum level of optineurin-mediated autophagy is crucial for survival of retinal cells, and impaired autophagy is likely to contribute to glaucoma pathogenesis."
      explanation: >
        States the autophagy-to-retinal-cell-survival dependency that this
        edge asserts.
    - reference: PMID:33723228
      reference_title: "The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and leads to RGC apoptosis in vivo and in vitro."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, rapamycin increased the RGC number and visual function of E50K mice."
      explanation: >
        Rescue by an autophagy inducer, the intervention evidence that the
        flux block is causal for ganglion cell loss rather than a bystander.
- name: Impaired Mitophagy and Mitochondrial Dysfunction
  biological_scale: CELLULAR
  role: amplifier
  description: >
    Optineurin is one of the principal mitophagy receptors of the PINK1/Parkin
    pathway, and it initiates mitophagy by an unconventional route: rather than
    recruiting FIP200 and the ULK1/2 complex as NDP52, TAX1BP1 and p62 do,
    OPTN uses TBK1 bound directly to the class III PI3K complex I. Because that
    initiation step runs through the very kinase whose interaction E50K
    perturbs, the mitophagy arm is not simply a special case of the general
    autophagy block but a mechanistically distinct point of vulnerability.
    Failure to clear damaged mitochondria leaves retinal ganglion cells -
    among the most energetically demanding neurons in the body, with long
    unmyelinated intraretinal axons - carrying a dysfunctional mitochondrial
    pool. This node is curated as an amplifier of, not a substitute for, the
    autophagic-flux lesion.
  cell_types:
  - preferred_term: Retinal Ganglion Cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  - preferred_term: Mitochondrion Organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:37207627
    reference_title: "Unconventional initiation of PINK1/Parkin mitophagy by Optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we uncover an unconventional path of PINK1/Parkin mitophagy initiation by OPTN that does not begin with FIP200 binding or require the ULK1/2 kinases."
    explanation: >
      Establishes the distinct, TBK1-dependent route by which optineurin
      initiates mitophagy, which is the mechanistic basis for treating this as
      a separate node from bulk autophagy.
  - reference: PMID:37207627
    reference_title: "Unconventional initiation of PINK1/Parkin mitophagy by Optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using gene-edited cell lines and in vitro reconstitutions, we show that OPTN utilizes the kinase TBK1, which binds directly to the class III phosphatidylinositol 3-kinase complex I to initiate mitophagy."
    explanation: >
      Names TBK1 as the initiating kinase for OPTN-driven mitophagy, linking
      this node back to the E50K-TBK1 lesion in the trigger node.
  - reference: PMID:26142952
    reference_title: "Optineurin: The autophagy connection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is involved in xenophagy, mitophagy, aggrephagy, and tumor suppression."
    explanation: >
      Review confirming mitophagy as one of the selective-autophagy functions
      of optineurin. Evidence source is OTHER because this is a review.
  notes: >
    The mitophagy work cited here is mechanistic cell biology in gene-edited
    non-neuronal lines, not a demonstration in OPTN-mutant human retina. The
    node is curated because the initiation route is TBK1-dependent and so is
    mechanistically continuous with the trigger lesion, but the strength of
    the claim should not be read as equal to the autophagic-flux node above.
  downstream:
  - target: Retinal Ganglion Cell Apoptosis
    causal_link_type: DIRECT
    description: >
      Accumulation of damaged mitochondria in an energetically demanding
      neuron with long unmyelinated intraretinal axons contributes to its
      death.
    evidence:
    - reference: PMID:29951055
      reference_title: "Altered Functions and Interactions of Glaucoma-Associated Mutants of Optineurin."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Glaucoma-associated mutants of OPTN, E50K, and M98K, cause defective vesicle trafficking, autophagy, and signaling that contribute to death of retinal ganglion cells (RGCs)."
      explanation: >
        Graded PARTIAL: the review supports autophagy-family defects
        contributing to ganglion cell death but does not isolate the mitophagy
        arm specifically, which is why this node is curated as an amplifier.
        Evidence source is OTHER because this is a review.
- name: Disrupted Rab8-Dependent Vesicle Trafficking
  biological_scale: CELLULAR
  role: modifier
  description: >
    Beyond autophagy, optineurin acts as an effector and adaptor for the Rab8
    GTPase, coupling Rab8 to myosin VI and to its GTPase-activating protein
    TBC1D17 to control Golgi-to-plasma-membrane vesicle transport and
    transferrin receptor recycling. The E50K substitution disrupts the
    Optn-Rab8 interaction. This trafficking arm is curated as a modifier
    rather than a second central effector: it is well demonstrated
    biochemically and in transgenic mouse retina, but the pathway from
    disturbed vesicle transport to ganglion cell death is less directly
    evidenced than the autophagic route.
  cell_types:
  - preferred_term: Retinal Ganglion Cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Intracellular Protein Transport
    term:
      id: GO:0006886
      label: intracellular protein transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20388642
    reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At the molecular level, introduction of the E50K mutation disrupts the interaction between Optn and Rab8 GTPase, a protein involved in the regulation of vesicle transport from Golgi to plasma membrane."
    explanation: >
      Directly demonstrates loss of the Optn-Rab8 interaction as a consequence
      of E50K, in the transgenic mouse study that first reported it.
  - reference: PMID:29951055
    reference_title: "Altered Functions and Interactions of Glaucoma-Associated Mutants of Optineurin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glaucoma-associated mutants of OPTN, E50K, and M98K, cause defective vesicle trafficking, autophagy, and signaling that contribute to death of retinal ganglion cells (RGCs)."
    explanation: >
      Review placing defective vesicle trafficking alongside autophagy as a
      contributor to retinal ganglion cell death. Evidence source is OTHER
      because this is a review article.
  downstream:
  - target: Retinal Ganglion Cell Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Trafficking failure is reported as a contributor to ganglion cell death,
      but the intermediate steps between disturbed vesicle transport and
      apoptosis are not established, hence an indirect edge.
    evidence:

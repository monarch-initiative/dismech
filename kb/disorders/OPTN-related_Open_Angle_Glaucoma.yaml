- name: E50K optineurin transgenic mouse (global overexpression)
  species: Mouse
  genotype: Transgenic overexpression of E50K-mutated optineurin
  publication: PMID:20388642
  description: >
    The first optineurin glaucoma mouse: transgenic global overexpression of
    E50K-mutant optineurin, alongside wild-type and other mutant constructs as
    controls. At 16 months, histological abnormalities were confined to the
    retina in the E50K line, with ganglion cell and synapse loss, nerve fibre
    layer thinning at the optic nerve head, and about a 28% reduction in
    retinal thickness - all at normal intraocular pressure. It is also the
    study that first showed E50K disrupts the Optn-Rab8 interaction.
  evidence:
  - reference: PMID:20388642
    reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we describe the phenotypic characteristics of transgenic mice overexpressing wild-type (Wt) or mutated optineurin (Optn)."
    explanation: >
      Establishes the transgenic overexpression design of this model.
  modeled_mechanisms:
  - target: Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      Reproduces the defining feature - retinal ganglion cell and nerve fibre
      layer loss occurring at normal intraocular pressure - in the correct
      tissue and with a progressive course.
    evidence:

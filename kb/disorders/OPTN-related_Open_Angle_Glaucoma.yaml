- name: BAC E50K optineurin transgenic mouse (near-physiological expression)
  species: Mouse
  genotype: BAC transgenic human optineurin locus carrying E50K
  publication: PMID:25818176
  description: >
    A bacterial artificial chromosome transgenic line carrying the human
    optineurin locus with its own promoter, designed specifically to avoid the
    global overexpression that made the earlier transgenic line degenerate
    panretinally. At 18 months, mutant animals show enhanced axonal
    degeneration and reduced ganglion cell survival over the age-related
    decline seen in non-transgenic controls, with visual evoked potentials

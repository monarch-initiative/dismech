      reference_title: "Overexpression of optineurin E50K disrupts Rab8 interaction and leads to a progressive retinal degeneration in mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that alternation of the Optn sequence can initiate significant retinal degeneration in mice."
      explanation: >
        The authors' own summary claim for this model. Graded PARTIAL because
        the claim is for retinal degeneration generally rather than for the
        ganglion-cell-selective optic neuropathy this node describes, which is
        exactly the limitation recorded on the link.
    limitations: >
      The phenotype extends to massive apoptosis and degeneration of the
      entire retina with roughly 28% overall retinal thinning, which is a
      panretinal degeneration rather than the ganglion-cell-selective optic
      neuropathy seen in patients. A later study attributes this to the high
      global overexpression of the transgene and reports diffuse loss of
      photoreceptors and non-RGC cells, features not observed in human POAG.
      Selectivity claims should not be drawn from this line.
    readouts:
    - name: Retinal nerve fiber layer thickness at the optic nerve head
      target: Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
      direction: DECREASED

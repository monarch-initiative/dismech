treatments:
- name: Antibiotic Prophylaxis
  description: >-
    Long-term antibacterial prophylaxis reduces the burden of invasive pyogenic
    infection and, together with vaccination and IgG replacement, had a
    beneficial impact through the vulnerable childhood years.
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotic prophylaxis (n = 34), antipneumococcal vaccination (n = 31),
      and/or IgG infusion (n = 19), when instituted, had a beneficial impact on patients
      until the teenage years, with no seemingly detectable impact thereafter."
    explanation: Reports the beneficial impact of antibiotic prophylaxis during childhood.
- name: Antipneumococcal Vaccination
  description: >-
    Vaccination against Streptococcus pneumoniae, the leading pathogen, is part
    of the preventive regimen used in the childhood risk window.
  treatment_term:
    preferred_term: antipneumococcal vaccination

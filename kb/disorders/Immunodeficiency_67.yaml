name: Immunodeficiency 67
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: IRAK4 deficiency
  term:
    id: MONDO:0011888
    label: immunodeficiency 67
synonyms:
- IRAK4 deficiency
- IRAK-4 deficiency
- immunodeficiency due to interleukin-1 receptor-associated kinase-4 deficiency
- IRAK4D
- IPD1
- invasive pneumococcal disease, recurrent isolated, 1
description: >-
  Immunodeficiency 67 is IRAK-4 deficiency: an autosomal recessive inborn error
  of innate immunity caused by biallelic loss-of-function variants in IRAK4,
  which encodes interleukin-1 receptor-associated kinase 4, the kinase recruited
  immediately downstream of the adaptor MyD88 in Toll-like receptor (TLR) and
  interleukin-1 receptor (IL-1R) family signaling. Without functional IRAK-4,
  cells cannot transduce signals from the MyD88-dependent TLRs (all TLRs except
  TLR3) and from the IL-1R family, so they fail to activate NF-kappaB and MAPK
  and do not mount the proinflammatory cytokine response that normally follows
  detection of a pyogenic organism.

  The clinical consequence is a strikingly narrow susceptibility. Affected
  children suffer invasive, life-threatening infection with a small set of
  pyogenic bacteria - above all Streptococcus pneumoniae, and to a lesser extent
  Staphylococcus aureus and Pseudomonas aeruginosa - while resistance to fungi,
  parasites and most other bacteria is essentially intact. This redundancy is
  the finding the disease exists to demonstrate: the TIR-IRAK pathway turns out
  to be crucial for immunity to a few bacteria and dispensable against nearly
  everything else. The one recognized qualification to the "antiviral immunity
  preserved" rule is TLR7: because TLR7-dependent type I interferon production by
  plasmacytoid dendritic cells is MyD88- and IRAK-4-dependent, these patients are
  also at high risk of severe, hypoxemic SARS-CoV-2 pneumonia.

  Two features make the disease dangerous out of proportion to its narrow
  spectrum. First, the inflammatory response to infection is characteristically
  weak or delayed - fever and acute-phase signs are often blunted - so severe
  invasive disease can advance with deceptively few warning signs. Second,
  susceptibility is age-dependent: the risk of invasive infection is
  concentrated in infancy and early childhood and falls sharply with age, so
  that with prophylaxis most survivors improve markedly in adolescence.

  IRAK-4 deficiency is clinically and immunologically indistinguishable from
  MyD88 deficiency (immunodeficiency 68), which lies one step upstream in the
  same pathway; the two are curated as distinct entities rather than as subtypes
  of one another.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic loss-of-function IRAK4 variants; heterozygous
    carriers are healthy. The defect and its inheritance are shared with MyD88
    deficiency, the adjacent step in the same signaling pathway.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive interleukin-1 receptor-associated kinase (IRAK)-4
      and myeloid differentiation factor (MyD)88 deficiencies impair Toll-like receptor
      (TLR)- and interleukin-1 receptor-mediated immunity."
    explanation: States the autosomal recessive inheritance and the impaired TLR/IL-1R
      immunity that defines the disease.
genetic:
- name: IRAK4
  gene_term:
    preferred_term: IRAK4
    term:
      id: hgnc:17967
      label: IRAK4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    IRAK4 encodes interleukin-1 receptor-associated kinase 4, the proximal
    serine/threonine kinase of the Myddosome that assembles on MyD88 after a
    MyD88-dependent TLR or an IL-1R family receptor is engaged. Reported
    disease alleles are germline biallelic loss-of-function variants (nonsense,
    frameshift and splice) that abolish kinase function, so the gene-disease
    relationship is recorded as causative with an autosomal recessive,
    loss-of-function mechanism.
  variants:
  - name: Biallelic loss-of-function IRAK4 variants
    description: >-
      The reported alleles are germline null or loss-of-function variants
      (nonsense, frameshift, and splice-site) carried in the homozygous or
      compound-heterozygous state, abolishing IRAK-4 kinase activity and
      MyD88-dependent signaling.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:12637671
      reference_title: "Pyogenic bacterial infections in humans with IRAK-4 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe three unrelated children with inherited IRAK-4 deficiency."
      explanation: Establishes inherited IRAK-4 deficiency as the cause in the founding
        patient series.
  evidence:
  - reference: PMID:12637671
    reference_title: "Pyogenic bacterial infections in humans with IRAK-4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their blood and fibroblast cells did not activate nuclear factor kappaB
      and mitogen-activated protein kinase (MAPK) and failed to induce downstream cytokines
      in response to any of the known ligands of TIR-bearing receptors."
    explanation: Demonstrates that loss of IRAK-4 abolishes NF-kB/MAPK activation and
      cytokine induction downstream of TIR-bearing receptors, the functional basis of
      the gene-disease relationship.
pathophysiology:
- name: IRAK4 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic loss-of-function IRAK4 variants eliminate functional IRAK-4
    kinase. IRAK-4 is the first kinase recruited to the MyD88 adaptor to form
    the Myddosome, so its loss removes the proximal signaling node shared by the
    MyD88-dependent TLRs and the IL-1R family.
  genetic_context:
    genes:
    - preferred_term: IRAK4
      term:
        id: hgnc:17967
        label: IRAK4
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline biallelic null/loss-of-function IRAK4 variants (nonsense,
      frameshift, splice) abolishing IRAK-4 kinase activity.
  evidence:
  - reference: PMID:12637671
    reference_title: "Pyogenic bacterial infections in humans with IRAK-4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe three unrelated children with inherited IRAK-4 deficiency."
    explanation: Identifies inherited IRAK-4 deficiency as the molecular lesion in the
      index patients.
  - reference: PMID:30679311
    reference_title: "Conformational flexibility and inhibitor binding to unphosphorylated interleukin-1 receptor-associated kinase 4 (IRAK4)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon ligand binding and via its N-terminal death domain, IRAK4 is recruited
      to an oligomeric receptor that is proximal to the Myddosome signaling complex,
      inducing IRAK4 kinase domain dimerization, autophosphorylation, and activation."
    explanation: Structural work establishing IRAK-4 as the proximal Myddosome kinase
      whose recruitment, dimerization and autophosphorylation are lost when the kinase
      is absent.
  downstream:
  - target: Impaired MyD88-Dependent TLR and IL-1R Signaling
    causal_link_type: DIRECT
    description: >-
      Loss of the proximal Myddosome kinase directly abolishes signal
      transduction through the MyD88-dependent TLRs and the IL-1R family.
- name: Impaired MyD88-Dependent TLR and IL-1R Signaling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells cannot transduce signals through the MyD88-dependent Toll-like
    receptors (all TLRs except TLR3) or the IL-1R family. The TLR3 and
    TLR4-interferon-alpha/beta arms, which do not require IRAK-4, are spared, so
    most antiviral immunity is preserved. The important exception is TLR7, an
    endosomal single-stranded-RNA sensor that is itself MyD88- and
    IRAK-4-dependent: its signaling is lost, which underlies the recently
    recognized susceptibility to severe viral pneumonia (see the TLR7 branch
    below).
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: MyD88-dependent toll-like receptor signaling pathway
    term:
      id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
  - preferred_term: interleukin-1-mediated signaling pathway
    term:
      id: GO:0070498
      label: interleukin-1-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human interleukin (IL) 1 receptor-associated kinase 4 (IRAK-4) deficiency
      is a recently discovered primary immunodeficiency that impairs Toll/IL-1R immunity,
      except for the Toll-like receptor (TLR) 3- and TLR4-interferon (IFN)-alpha/beta
      pathways."
    explanation: States that IRAK-4 deficiency impairs Toll/IL-1R signaling while sparing
      the TLR3 and TLR4-IFN pathways.
  downstream:
  - target: Defective NF-kappaB and MAPK Activation
    causal_link_type: DIRECT
    description: >-
      MyD88-dependent TLR/IL-1R signaling normally converges on NF-kB and MAPK
      activation, which cannot occur without the proximal IRAK-4 step.
  - target: Impaired TLR7-Dependent Type I Interferon Production
    causal_link_type: DIRECT
    description: >-
      TLR7 is a MyD88- and IRAK-4-dependent endosomal RNA sensor, so its type I
      interferon output in plasmacytoid dendritic cells is lost along with the
      other MyD88-dependent TLRs.
- name: Defective NF-kappaB and MAPK Activation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Patient blood and fibroblast cells fail to activate NF-kappaB and MAPK in
    response to MyD88-dependent TLR and IL-1R agonists.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:12637671
    reference_title: "Pyogenic bacterial infections in humans with IRAK-4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their blood and fibroblast cells did not activate nuclear factor kappaB
      and mitogen-activated protein kinase (MAPK) and failed to induce downstream cytokines
      in response to any of the known ligands of TIR-bearing receptors."
    explanation: Directly documents the failure of NF-kB and MAPK activation downstream
      of TIR-bearing receptors in patient cells.
  downstream:
  - target: Blunted Proinflammatory Cytokine Production
    causal_link_type: DIRECT
    description: >-
      NF-kB and MAPK drive transcription of proinflammatory cytokines; without
      their activation the cytokine response is not induced.
- name: Blunted Proinflammatory Cytokine Production
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Patient leukocytes do not induce the proinflammatory cytokines normally
    produced on TLR/IL-1R stimulation. Ku et al. found that peripheral blood
    mononuclear cells failed to induce 11 non-interferon cytokines on activation
    with TLR agonists other than the TLR3-specific poly(I:C).
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  biological_processes:
  - preferred_term: positive regulation of cytokine production
    term:
      id: GO:0001819
      label: positive regulation of cytokine production
    modifier: DECREASED
  evidence:
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' peripheral blood mononuclear cells (PBMCs) did not induce
      the 11 non-IFN cytokines tested upon activation with TLR agonists other than the
      nonspecific TLR3 agonist poly(I:C)."
    explanation: Documents the failure to produce proinflammatory cytokines in response
      to MyD88-dependent TLR agonists while the TLR3 response is retained.
  downstream:
  - target: Impaired Inflammatory Response to Pyogenic Bacteria
    causal_link_type: DIRECT
    description: >-
      Loss of the proinflammatory cytokine burst cripples the acute innate
      inflammatory and antibacterial response to pyogenic organisms.
- name: Impaired Inflammatory Response to Pyogenic Bacteria
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Without cytokine-driven inflammation the host cannot contain invasive
    pyogenic bacteria, and the systemic signs that normally flag infection are
    weak or delayed. The susceptibility is narrow: viral, fungal and parasitic
    defenses are intact and most bacteria are handled normally.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  evidence:
  - reference: PMID:12637671
    reference_title: "Pyogenic bacterial infections in humans with IRAK-4 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that, in humans, the TIR-IRAK signaling pathway
      is crucial for protective immunity against specific bacteria but is redundant against
      most other microorganisms."
    explanation: States that the pathway is essential for protection against specific
      (pyogenic) bacteria and redundant otherwise, explaining the narrow susceptibility.
  downstream:
  - target: Invasive Pyogenic Bacterial Infection
    causal_link_type: DIRECT
    description: >-
      Failure to mount protective inflammation permits invasive infection by
      pyogenic bacteria.
  - target: Weak or Delayed Systemic Inflammation
    causal_link_type: DIRECT
    description: >-
      The same cytokine deficit blunts fever and the acute-phase response, so
      systemic signs of infection are attenuated.
- name: Invasive Pyogenic Bacterial Infection
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The dominant clinical event is invasive infection with pyogenic bacteria,
    led by invasive pneumococcal disease and followed by Staphylococcus aureus
    and Pseudomonas aeruginosa. Infections are frequently recurrent and
    concentrated in infancy and early childhood.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The leading threat was invasive pneumococcal disease, documented in 41
      patients (68%) and causing 72 documented invasive infections (52.2%)."
    explanation: Quantifies invasive pneumococcal disease as the leading invasive infection
      in the largest reported cohort.
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients (22 out of 28; 79%) suffered from invasive pneumococcal
      disease, which was often recurrent (13 out of 22; 59%)."
    explanation: Independent cohort confirming the high frequency and recurrence of invasive
      pneumococcal disease.
  downstream:
  - target: Recurrent systemic pyogenic infections
    causal_link_type: DIRECT
  - target: Recurrent streptococcus pneumoniae infections
    causal_link_type: DIRECT
  - target: Recurrent Staphylococcus aureus infections
    causal_link_type: DIRECT
  - target: Sepsis
    causal_link_type: DIRECT
  - target: Meningitis
    causal_link_type: DIRECT
- name: Weak or Delayed Systemic Inflammation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    A clinically important and dangerous feature: fever and acute-phase signs
    of inflammation are characteristically weak or delayed, so severe invasive
    infection can progress with few warning signs.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic signs of inflammation were usually weak or delayed."
    explanation: Documents the blunted systemic inflammatory response, the basis for
      this node and the associated diagnostic pitfall.
  - reference: PMID:24596024
    reference_title: "Fatal pneumococcal meningitis in a 7-year-old girl with interleukin-1 receptor activated kinase deficiency (IRAK-4) despite prophylactic antibiotic and IgG responses to Streptococcus pneumoniae vaccines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IRAK-4 deficiency causes IL-1R and TLR signaling failure, resulting in
      minimal clinical features despite invasive bacterial infection."
    explanation: A case report reinforcing that invasive infection can proceed with
      minimal clinical signs, the danger that follows from the blunted inflammatory response.
  downstream:
  - target: Decreased inflammatory response
    causal_link_type: DIRECT
- name: Impaired TLR7-Dependent Type I Interferon Production
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A recently recognized branch that qualifies the classic teaching that
    antiviral immunity is intact. TLR7 is a MyD88- and IRAK-4-dependent
    endosomal single-stranded-RNA sensor, so plasmacytoid dendritic cells cannot
    mount TLR7-driven type I interferon in response to SARS-CoV-2. The evidence
    comes from a combined cohort of autosomal recessive MyD88 or IRAK-4
    deficiency, so the finding is attributed to the shared pathway rather than
    to IRAK-4 alone.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: DECREASED
  evidence:
  - reference: PMID:36880831
    reference_title: "Humans with inherited MyD88 and IRAK-4 deficiencies are predisposed to hypoxemic COVID-19 pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' susceptibility to SARS-CoV-2 can be attributed to impaired
      TLR7-dependent type I IFN production by pDCs, which do not sense SARS-CoV-2 correctly."
    explanation: Attributes the SARS-CoV-2 susceptibility of these patients to loss of
      TLR7-dependent type I interferon production by plasmacytoid dendritic cells.
  downstream:
  - target: Severe viral infection
    causal_link_type: DIRECT
    description: >-
      Loss of the pDC type I interferon response to SARS-CoV-2 predisposes to
      hypoxemic COVID-19 pneumonia.

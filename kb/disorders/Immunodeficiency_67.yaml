      and vaccination.
diagnosis:
- name: Clinical recognition of recurrent invasive pyogenic infection with blunted inflammation
  description: >-
    IRAK-4 deficiency is suspected in a child with recurrent or invasive infection
    by a narrow set of pyogenic bacteria - above all Streptococcus pneumoniae, and
    less often Staphylococcus aureus and Pseudomonas aeruginosa - in whom the
    systemic inflammatory response is characteristically weak or delayed. Poor or
    absent fever and low serum C-reactive protein during severe invasive infection
    are a recognized diagnostic pitfall that delays recognition, so empiric
    antibacterial treatment and urgent evaluation are advised whenever infection is
    suspected.
  diagnosis_term:
    preferred_term: clinical recognition of recurrent invasive pyogenic infection
  markers: C-reactive protein (CRP), fever/body temperature, acute-phase response
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic signs of inflammation were usually weak or delayed."
    explanation: >-
      Documents the blunted systemic inflammatory response that is the central
      diagnostic pitfall when evaluating a suspected infection in these patients.
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, most patients have weak or delayed acute inflammatory responses in vivo (low serum CrP levels in particular) (34, 71)."
    explanation: >-
      Identifies low serum C-reactive protein as a specific in vivo marker of the
      blunted acute-phase response, so a normal CRP does not exclude invasive
      infection in these patients.
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "empiric antibacterial treatment and immediate medical consultation are strongly recommended in cases of suspected infection or moderate fever."
    explanation: >-
      States the clinical corollary of the diagnostic pitfall: because signs are
      blunted, even moderate fever warrants empiric treatment and urgent review.
- name: Cellular responses to TLR and IL-1R agonists (functional immunology)
  description: >-
    Functional testing of patient blood cells provides the immunological
    confirmation. Whole blood cells or peripheral blood mononuclear cells fail to
    produce the major proinflammatory cytokines (TNF-alpha, IL-6, IL-12) on
    stimulation with MyD88-dependent TLR agonists, and fail to secrete IL-6 in
    response to IL-1beta (and IFN-gamma in response to IL-18), reflecting the
    IRAK-4 block in MyD88-dependent signaling. The response to the TLR3-specific
    agonist poly(I:C) is spared, which distinguishes the pattern from a global
    signaling defect.
  diagnosis_term:
    preferred_term: TLR and IL-1R agonist cellular stimulation assay
  markers: TNF-alpha, IL-6, IL-12 (whole blood / PBMC cytokine induction on TLR and IL-1R stimulation)
  evidence:
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "do not induce the production of major inflammatory cytokines (TNF-α, IL-6, and IL-12) and growth factors (G-CSF and GM-CSF) in whole blood cells and PBMCs"
    explanation: >-
      The abolished proinflammatory cytokine response of whole blood cells and
      PBMCs to MyD88-dependent TLR agonists is the functional diagnostic readout.
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the patients' whole blood cells or PBMCs do not respond to IL-1β, in terms of IL-6 secretion"
    explanation: >-
      The absent IL-6 response to IL-1beta demonstrates the parallel IL-1R-family
      arm of the functional assay used to confirm IRAK-4 deficiency.
- name: IRAK4 gene sequencing
  description: >-
    Molecular confirmation rests on identifying biallelic loss-of-function IRAK4
    variants (nonsense, frameshift, splice-site, or deletion) by sequencing the
    IRAK4 coding exons and flanking regions, or by exome sequencing. The reported
    disease alleles are predicted null and are carried in the homozygous or
    compound-heterozygous state; where no material is available (for example, a
    deceased relative), the diagnosis may rest on clinical grounds instead.
  diagnosis_term:
    preferred_term: IRAK4 sequencing
  results: Identifies biallelic loss-of-function IRAK4 variants
  evidence:
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All IRAK4 exons, flanking intron regions, and, when appropriate, entire introns, were sequenced in 24 patients"
    explanation: >-
      Documents comprehensive IRAK4 sequencing as the molecular diagnostic method
      in the reference cohort.
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "owing to the inheritance of two loss-of-expression, loss-of-function IRAK4 alleles."
    explanation: >-
      Confirms that the molecular diagnosis is biallelic loss-of-function IRAK4
      alleles, the finding sequencing is used to establish.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest cohort documented 48 patients with IRAK-4 deficiency from 37
    kindreds in 15 countries; the disease is ultra-rare.
  evidence:
  - reference: PMID:21057262
    reference_title: "Clinical features and outcome of patients with IRAK-4 and MyD88 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We documented the clinical features and outcome of 48 patients with IRAK-4
      deficiency and 12 patients with MyD88 deficiency, from 37 kindreds in 15 countries."
    explanation: Gives the size and geographic spread of the largest reported IRAK-4
      deficiency cohort.
discussions:
- discussion_id: age_dependent_improvement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does susceptibility to invasive pyogenic infection in IRAK-4 deficiency
    wane sharply with age despite a persistent, lifelong signaling defect?
  attaches_to:
  - pathophysiology#Invasive Pyogenic Bacterial Infection
  rationale: >-
    Invasive infection and death are concentrated in early childhood: no death
    and no invasive infection were reported after the ages of 8 and 14 years,
    respectively, in the two largest cohorts. The IRAK-4 signaling defect is
    constitutive and does not resolve, so the improvement is presumed to reflect
    maturation of adaptive immunity and acquisition of protective antibody with
    age rather than any change in the innate lesion. The precise mechanism of
    the age-dependent narrowing is not established, which is why it is recorded
    as a knowledge gap. The improvement is also not absolute: fatal breakthrough
    pneumococcal meningitis has been reported at age 7 in a prophylaxed,
    vaccinated child, driven by an antibiotic-resistant serotype.
  evidence:
  - reference: PMID:17893200
    reference_title: "Selective predisposition to bacterial infections in IRAK-4-deficient children: IRAK-4-dependent TLRs are otherwise redundant in protective immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No death and no invasive infection occurred in patients older than 8 and
      14 yr, respectively."
    explanation: Documents the age-dependent fall in invasive infection and death that
      motivates this knowledge gap.
  - reference: PMID:24596024
    reference_title: "Fatal pneumococcal meningitis in a 7-year-old girl with interleukin-1 receptor activated kinase deficiency (IRAK-4) despite prophylactic antibiotic and IgG responses to Streptococcus pneumoniae vaccines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "even older IRAK-4-deficient patients are at high risk of rapidly fatal
      infection due to emergence of antibiotic resistance."
    explanation: Qualifies the age-dependent improvement - a fatal infection still occurred
      at age 7 despite prophylaxis and vaccination, so the improvement is not absolute.
notes: >-
  Scope. This entry is IRAK-4 deficiency (immunodeficiency 67, MONDO:0011888).
  MyD88 deficiency (immunodeficiency 68) sits one step upstream in the same
  MyD88-dependent TLR/IL-1R pathway and is clinically and immunologically
  indistinguishable, but it is a distinct gene-disease entity and is not curated
  here as a subtype. Where a cited cohort reports IRAK-4 and MyD88 patients
  together, only the IRAK-4 figures are used for disease-specific claims.

  Mechanism confidence. The molecular chain - IRAK4 loss of function, abolished
  MyD88-dependent TLR/IL-1R signaling, failed NF-kB/MAPK activation, and absent
  proinflammatory cytokine induction - is directly measured in patient cells and
  is graded established. The TLR3 and TLR4-IFN-alpha/beta arms are spared, which
  accounts for the preserved antiviral immunity.

  Evidence base. The entry rests on the founding series (Picard 2003), the
  detailed immunophenotyping cohort (Ku 2007), and the large clinical-outcome
  cohort (Picard 2010), with the structural basis of the Myddosome kinase step
  (PMID:30679311), a fatal-breakthrough case report (PMID:24596024), and the
  combined MyD88/IRAK-4 SARS-CoV-2 cohort establishing the TLR7 viral branch
  (PMID:36880831). No GeneReviews chapter for IRAK-4 deficiency was found in
  PubMed at the time of curation. A single deep-research report was run: the
  requested provider (Falcon/Edison) was out of credits (HTTP 402), so the run
  fell back to OpenScientist, whose report validated cleanly
  (18/18 references resolved, no confabulated terms) and corroborated this
  entry; its leads were verified against the primary abstracts before use.

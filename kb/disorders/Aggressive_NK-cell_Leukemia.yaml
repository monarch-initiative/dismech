differential_diagnoses:
- name: EBV-Driven Hemophagocytic Lymphohistiocytosis Without Neoplasia
  description: >-
    EBV-HLH can be the initial presentation of ANKL, but EBV-HLH without a
    malignant NK/T-cell population is a key differential diagnosis during early
    evaluation.
  distinguishing_features:
  - Detection of an atypical CD3-negative, CD56-positive NK-cell population in marrow supports ANKL rather than isolated EBV-HLH.
  evidence:
  - reference: DOI:10.3389/frhem.2024.1413794
    reference_title: "Case report: Aggressive natural killer cell leukemia and refractory hemophagocytic lymphohistiocytosis in an adolescent"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case highlights the diagnostic challenges of ANKL given the lack of
      standardized diagnostic criteria, the importance of considering T/NK cell
      malignancies in the differential diagnosis of EBV-HLH, and adds to the
      literature on this rare disease.
    explanation: >-
      This case report explicitly states that T/NK malignancies must be
      considered in the differential diagnosis of EBV-HLH.
  - reference: DOI:10.3389/frhem.2024.1413794
    reference_title: "Case report: Aggressive natural killer cell leukemia and refractory hemophagocytic lymphohistiocytosis in an adolescent"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bone marrow biopsy demonstrated an atypical CD3-/CD56+ natural killer
      (NK) cell population with diminished CD7 expression consistent with EBV+
      ANKL.
    explanation: >-
      The case directly supports identifying an aberrant NK-cell population in
      marrow when ANKL presents as EBV-HLH.
- name: Extranodal NK/T-Cell Lymphoma
  description: >-
    Extranodal NK/T-cell lymphoma is another EBV-associated NK/T malignancy with
    overlapping immunophenotypic, molecular, and clinical features. ANKL should
    not be modeled simply as a more advanced leukemic form of extranodal NK/T-cell
    lymphoma; integrated anatomic and clinicopathologic assessment is required.
  distinguishing_features:
  - A systemic leukemic blood-and-marrow presentation supports ANKL, but no single recurrent mutation reliably resolves the boundary.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      arguing against the hypothesis that ANKL would represent a more advanced
      form of NKTCL.
    explanation: >-
      Comparative genomic analysis argues against treating ANKL as merely an
      advanced form of extranodal NK/T-cell lymphoma.
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ANKL diagnosis was made according to the WHO classi ﬁcation, with a
      surface immunophenotype characteristic of NK cells (CD2+CD3−CD56+),
      systemic involvement including bone marrow and/or per- ipheral blood and
      an aggressive clinical course as minimum requirements for diagnosis.
    explanation: >-
      The study's WHO-based inclusion criteria support the systemic blood or
      marrow presentation used to distinguish ANKL.
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      closely related extranodal NK/T-cell lymphoma, nasal type (NKTCL), an
      extranodal lymphoma commonly presenting in the nasal cavity
    explanation: >-
      The comparative discussion supports the characteristic extranodal nasal
      presentation of NKTCL.
- name: Chronic NK-Cell Lymphoproliferative Disorder (NK-LGLL/CLPD-NK)
  description: >-
    Chronic NK-cell lymphoproliferative disorder is a distinct, relatively
    indolent NK-cell proliferation that should not be conflated with fulminant
    ANKL.
  distinguishing_features:
  - A chronic indolent NK-cell lymphocytosis favors NK-LGLL/CLPD-NK; fulminant systemic leukemia with organ involvement and HLH-like inflammation favors ANKL.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gain-of-function STAT3 mutations have also been previously described in
      diseases of varying aggressiveness, such as NKTCL and the relatively
      indolent T-LGLL and CLPD-NK
    explanation: >-
      The study explicitly treats T-LGLL/CLPD-NK as relatively indolent
      comparators rather than synonyms for fulminant ANKL.
- name: Chronic Active EBV Disease and Other EBV-Positive T/NK Lymphoproliferative Disorders
  description: >-
    Chronic active EBV disease and related EBV-positive T/NK lymphoproliferative
    disorders can precede or mimic ANKL, particularly during prolonged systemic
    symptoms. Age, tempo, morphology, immunophenotype, and demonstration of a
    malignant NK-cell population must be integrated.
  distinguishing_features:
  - A chronic EBV-associated course without a demonstrable aggressive leukemic NK-cell neoplasm favors chronic active EBV disease; abrupt fulminant systemic leukemia favors ANKL.
  evidence:
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAEBV is an indolent disease primarily affecting children and young adults4.
      While ANKL usually presents a relatively acute disease mainly occurs in
      the middle-aged population, even though a subacute clinical course may
      manifest in a subset of patients.
    explanation: >-
      The cohort discussion contrasts the usual age and tempo of CAEBV and ANKL
      while acknowledging a prolonged-course ANKL subset.
discussions:
- discussion_id: ankl_proposed_subacute_course_reproducibility
  prompt: >-
    Does the prolonged infectious mononucleosis-like prodrome reported in one
    retrospective cohort define a reproducible biological subgroup, or a
    cohort-specific clinical-course pattern within ANKL?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Cohort-Proposed Prolonged Prodromal Course in a Subset
  rationale: >-
    Treating the proposed “subacute ANKL” course as an established subtype would
    overstate evidence from 18 of 113 Han Chinese patients and could obscure
    differences among later cohorts and classification systems.
  evidence:
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these data suggested that patients with prolonged prodromal phases,
      whom we define here as “subacute ANKL”, may represent a clinical subtype
      of ANKL which differed from the others, whom we define here as “classic
      ANKL”.
    explanation: >-
      The authors explicitly present the subgroup as a proposed interpretation.
- discussion_id: ankl_ebv_positive_negative_mechanistic_relationship
  prompt: >-
    Which mechanisms distinguish EBV-positive and EBV-negative ANKL, and which
    molecular lesions are shared across both contexts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#EBV-Positive Neoplastic Context
  - pathophysiology#JAK-STAT Pathway Activation
  - pathophysiology#DDX3X Alteration
  rationale: >-
    EBV is frequent but not obligatory, and recurrent STAT3/DDX3X lesions occur
    in EBV-negative disease. Resolving shared versus EBV-specific dependencies is
    necessary before assigning EBV an initiating causal role.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations recurrent among our EBV-positive cases, such as STAT3 and DDX3X,
      have also been reported to occur in EBV- negative cases
    explanation: >-
      Shared recurrent lesions motivate direct comparison of EBV-positive and
      EBV-negative disease mechanisms.
- discussion_id: ankl_nk_lgll_nktcl_boundary
  prompt: >-
    How should ANKL nomenclature and diagnostic boundaries be reconciled with
    indolent NK-LGLL/CLPD-NK and extranodal NK/T-cell lymphoma?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Malignant NK-Cell Survival and Expansion
  rationale: >-
    A historical MONDO synonym can be read as the distinct indolent NK-LGLL
    entity, while comparative genomics argues against treating ANKL as merely an
    advanced extranodal NK/T-cell lymphoma. Integrated classification should
    preserve these clinical boundaries.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gain-of-function STAT3 mutations have also been previously described in
      diseases of varying aggressiveness, such as NKTCL and the relatively
      indolent T-LGLL and CLPD-NK
    explanation: >-
      The comparative discussion supports keeping indolent LGL disorders
      distinct from ANKL despite shared molecular features.

progression:
- phase: Cohort-Proposed Prolonged Prodromal Course in a Subset
  duration: more than 90 days in the reported cohort
  notes: >-
    A retrospective Han Chinese cohort described an infectious
    mononucleosis-like prodrome in 18 of 113 patients and proposed, rather than
    established, a “subacute ANKL” clinical subtype. This entry records a
    cohort-specific course pattern and is not modeled as a WHO/ICC subtype.
  evidence:
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intriguingly, a subacute clinical course was demonstrated in 18 ANKL
      patients (15.93%, 18/113).
    explanation: >-
      The cohort quantifies the proposed prolonged-prodrome subset.
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these data suggested that patients with prolonged prodromal phases,
      whom we define here as “subacute ANKL”, may represent a clinical subtype
      of ANKL which differed from the others, whom we define here as “classic
      ANKL”.
    explanation: >-
      The authors explicitly frame the classification as a proposal.
- phase: Fulminant Presentation and Early Mortality
  duration: often weeks to months
  notes: >-
    ANKL remains highly lethal. Median survival of two months and 55 days came
    from a 12-case clinicopathologic series and a 2003–2016 Han Chinese cohort,
    respectively, and should not be treated as timeless universal estimates.
    The ANKL22 study, published in 2026, analyzed 108 evaluable patients
    diagnosed during 2000–2021 and reported median overall survival of 5.5
    months and two-year survival of 18.7%, with better outcomes associated with
    SMILE and allogeneic HSCT.
  evidence:
  - reference: DOI:10.1097/pas.0000000000001518
    reference_title: Genomic and Immunophenotypic Landscape of Aggressive NK-Cell Leukemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had very poor outcomes despite intensive chemotherapy, with a
      median survival of 2 months.
    explanation: >-
      The 12-case series directly supports very poor prognosis and short median
      survival.
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median OS was only 55 days (Supplementary Tables S2) and 1-year
      survival rate was only 4.42% (5/113; Supplementary Fig. S1B), which
      indicated a dismal outcome of ANKL.
    explanation: >-
      The historical 113-patient cohort supports very poor survival in its
      specific population and treatment era.
  - reference: PMID:41501503
    reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We retrospectively collected 126 ANKL patients diagnosed between 2000 and
      2021 from 71 institutes; 108 were evaluable for analysis to characterize
      the recent advances.
    explanation: >-
      The study dates the diagnosis interval and identifies the 108-patient
      evaluable cohort.
  - reference: PMID:41501503
    reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median overall survival (OS) was 5.5 months, with a 2-year OS of 18.7%.
    explanation: >-
      The 2026 multicenter cohort provides a treatment-era prognosis estimate.
  - reference: PMID:41501503
    reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients treated with SMILE had significantly better OS than others
      (2-year OS 30.1% vs. 7.0%; P < 0.001). Prognosis further improved with
      allogeneic hematopoietic stem cell transplantation (HSCT) (2-year OS
      37.2% vs 3.5%; P < 0.001).
    explanation: >-
      Cohort comparisons support association of SMILE and allogeneic HSCT with
      improved survival in the treatment-era cohort without establishing
      randomized treatment effects.
diagnosis:
- name: Integrated Clinicopathologic Assessment
  description: >-
    ANKL diagnosis integrates the systemic clinical course, blood and marrow
    morphology, and NK-cell immunophenotype while excluding other mature
    T/NK-cell neoplasms and reactive HLH. EBV studies and molecular findings may
    provide adjunctive context; no defining molecular lesion is required.
  results: >-
    A systemic leukemic NK-cell neoplasm supported by concordant morphology and
    immunophenotype favors ANKL; EBV positivity refines the disease context but
    is not required.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a surface immunophenotype characteristic of NK cells
      (CD2+CD3−CD56+), systemic involvement including bone marrow
    explanation: >-
      The study states the NK-cell immunophenotype and systemic marrow
      involvement used among the ANKL-specific diagnostic requirements for its
      human cohort.
  - reference: PMID:37870698
    reference_title: Updates in the Classification of T-cell Lymphomas and Lymphoproliferative Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      WHO-HAEM5 and ICC share basic concepts in classification of T/NK-cell
      neoplasms, emphasizing integration of clinical presentation, pathology,
      immunophenotype, and genetics.
    explanation: >-
      The current classification review supports an integrated diagnostic
      approach for mature T/NK-cell neoplasms.
- name: NK-Cell Flow Cytometry and Immunophenotyping
  description: >-
    Diagnosis requires identifying an abnormal NK-cell population and excluding
    T-cell lineage by immunophenotyping. A typical pattern is CD56/CD94-positive
    and surface CD3/CD5/CD57-negative.
  diagnosis_term:
    preferred_term: flow cytometry immunophenotyping
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  results: >-
    An atypical CD3-/CD56+ or CD56+/CD94+ NK-cell population in marrow or blood
    supports ANKL in the appropriate clinicopathologic context.
  evidence:
  - reference: DOI:10.1097/pas.0000000000001518
    reference_title: Genomic and Immunophenotypic Landscape of Aggressive NK-Cell Leukemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neoplastic cells were positive for CD56 and CD94, and negative for
      surface CD3, CD5, and CD57 in all cases assessed.
    explanation: >-
      This case series supports the core diagnostic immunophenotype.
  - reference: DOI:10.3389/frhem.2024.1413794
    reference_title: "Case report: Aggressive natural killer cell leukemia and refractory hemophagocytic lymphohistiocytosis in an adolescent"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bone marrow biopsy demonstrated an atypical CD3-/CD56+ natural killer
      (NK) cell population with diminished CD7 expression consistent with EBV+
      ANKL.
    explanation: >-
      The case report demonstrates diagnostic recognition of ANKL by marrow
      biopsy and NK-cell immunophenotyping.
- name: EBER In Situ Hybridization
  description: >-
    EBER testing identifies the frequent but non-universal EBV-positive branch
    of ANKL.
  diagnosis_term:
    preferred_term: EBER in situ hybridization
    term:
      id: NCIT:C138177
      label: Epstein-Barr Encoding Region in situ Hybridization
  results: >-
    EBER positivity supports EBV-positive ANKL; a negative result does not exclude
    ANKL because not every case in the cited series was EBER-positive.
  evidence:
  - reference: DOI:10.1097/pas.0000000000001518
    reference_title: Genomic and Immunophenotypic Landscape of Aggressive NK-Cell Leukemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were also positive for CD2 (10/12), c-MYC (6/8), BCL2 (6/8), CD16
      (5/7), EBER (9/12), CD7 (6/11), pSTAT3Tyr705 (3/8), CD8 (2/6), PD-L1
      (2/8), CD4 (2/11), CD8 (2/6), and CD158 (1/5).
    explanation: >-
      The 12-case series reports EBER positivity in nine of twelve cases,
      demonstrating frequent but non-universal positivity.
treatments:
- name: L-Asparaginase-Containing Chemotherapy (Including SMILE)
  action_category: THERAPEUTIC
  description: >-
    There is no universally standardized initial regimen. Retrospective cohorts
    support L-asparaginase-containing induction, with a recent cohort reporting
    higher response and survival with SMILE than with comparator regimens.
    Selection remains individualized because the evidence is non-randomized and
    ANKL is rare.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: Asparaginase
      term:
        id: NCIT:C286
        label: Asparaginase
  target_mechanisms:
  - target: Malignant NK-Cell Survival and Expansion
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic L-asparaginase-containing induction is intended to reduce the
      malignant NK-cell burden.
    evidence:
    - reference: PMID:41501503
      reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first-line regimens included SMILE (n = 38, 42%), CHOP(-like) (n = 26, 29%), DeVIC (n = 15, 17%), and other L-asparaginase-containing regimens (n = 8, 9%), with the overall response rates of 66%, 31%, 33%, and 50%, respectively."  # codespell:ignore-line
      explanation: >-
        Clinical response rates support reduction of disease burden by
        L-asparaginase-containing regimens.
  evidence:
  - reference: PMID:41501503
    reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients treated with SMILE had significantly better OS than others (2-year
      OS 30.1% vs. 7.0%; P < 0.001).
    explanation: >-
      The 2026 retrospective multicenter cohort associates SMILE with improved
      survival.
  - reference: PMID:29263371
    reference_title: "Aggressive NK-cell leukemia: clinical subtypes, molecular features, and treatment outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further subgroup analysis for patients receiving chemotherapy alone

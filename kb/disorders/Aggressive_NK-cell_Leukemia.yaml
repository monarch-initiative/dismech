mechanistic_hypotheses:
- hypothesis_group_id: multihit_nk_neoplasia_model
  hypothesis_label: Multihit NK-Cell Neoplasia Model
  status: EMERGING
  description: >-
    Recurrent JAK-STAT, RAS-MAPK, DDX3X, TP53/checkpoint, and epigenetic-regulator
    alterations co-occur and are implicated in malignant NK-cell survival and
    expansion. No single recurrent pathway is sufficient to explain the fulminant
    phenotype.
  evidence:
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that deregulated JAK-STAT signaling alone is unlikely to
      explain the aggressive course of ANKL
    explanation: >-
      The genomic study explicitly argues against a single-pathway model and
      supports a cautious multihit interpretation without proving functional
      cooperation among the observed alterations.
  - reference: DOI:10.3390/cancers12102900
    reference_title: "Aggressive NK Cell Leukemia: Current State of the Art"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular abnormalities that occur in ANKL can be divided into three
      major groups: JAK/STAT pathway activation, epigenetic dysregulation, and
      impairment of TP53 and DNA repair.
    explanation: >-
      The review supports multiple recurrent molecular axes in ANKL.
- hypothesis_group_id: ebv_positive_superimposed_branch
  hypothesis_label: EBV-Positive Superimposed Branch
  status: ALTERNATIVE
  description: >-
    EBV-positive disease can superimpose an EBV-associated inflammatory context
    on the multihit neoplastic program. This conditional branch is not an
    obligatory initiating mechanism because EBV-negative ANKL is recognized.
  evidence:
  - reference: DOI:10.3389/frhem.2024.1413794
    reference_title: "Case report: Aggressive natural killer cell leukemia and refractory hemophagocytic lymphohistiocytosis in an adolescent"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present a case of ANKL in a patient presenting with EBV-HLH.
    explanation: >-
      The case supports an EBV-positive inflammatory presentation branch without
      establishing EBV as obligatory transformation evidence.
  - reference: DOI:10.1038/s41467-018-03987-2
    reference_title: Aggressive natural killer-cell leukemia mutational landscape and drug profiling highlight JAK-STAT signaling as therapeutic target
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations recurrent among our EBV-positive cases, such as STAT3 and DDX3X,
      have also been reported to occur in EBV- negative cases
    explanation: >-
      Recurrent molecular lesions in EBV-negative cases show that the neoplastic
      program is not restricted to EBV-positive ANKL.

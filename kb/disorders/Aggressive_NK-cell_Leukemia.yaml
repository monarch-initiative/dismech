name: Aggressive NK-cell Leukemia
creation_date: "2026-05-11T17:49:12Z"
description: >-
  Aggressive NK-cell leukemia is a rare, fulminant mature NK-cell hematologic
  malignancy. It commonly presents as an acute systemic inflammatory and
  leukemic illness with fever, hepatosplenomegaly, cytopenias, coagulopathy,
  hemophagocytic lymphohistiocytosis-like inflammation, and rapid multiorgan
  complications. EBV association is frequent but not obligatory. Molecular
  evidence supports a multihit model involving JAK-STAT and RAS-MAPK signaling,
  DDX3X, TP53/checkpoint impairment, and epigenetic-regulator alterations;
  JAK-STAT activation alone does not explain the aggressive course. There is no
  universally standardized initial regimen, but retrospective cohorts support
  L-asparaginase-containing chemotherapy, particularly SMILE, followed by
  allogeneic hematopoietic stem cell transplantation in responding eligible
  patients. Outcomes remain poor, although recent cohorts report longer survival
  than historical series.
categories:
- Hematologic Malignancy
- Mature NK-Cell Neoplasm
- Rare Cancer
synonyms:
- ANKL
- aggressive NK-cell leukemia/lymphoma
- aggressive natural killer cell leukemia

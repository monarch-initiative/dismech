- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  action_category: THERAPEUTIC
  description: >-
    Allogeneic hematopoietic stem cell transplantation is considered as
    consolidation for eligible patients who respond to induction therapy.
    Retrospective survival associations support this strategy, but do not define

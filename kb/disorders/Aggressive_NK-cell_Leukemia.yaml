      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:41501503
    reference_title: "Advances in the treatment and prognosis of aggressive NK-cell leukemia: results from the ANKL22 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis further improved with allogeneic hematopoietic stem cell
      transplantation (HSCT) (2-year OS 37.2% vs 3.5%; P < 0.001).
    explanation: >-
      The 2026 retrospective cohort associates allogeneic HSCT with improved

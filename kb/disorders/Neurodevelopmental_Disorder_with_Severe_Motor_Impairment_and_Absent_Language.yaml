      gain-of-function by inducing SG formation with concomitant global
      translation impairment even without endogenous or exogenous stressors.
    explanation: >-
      The authors' cellular interpretation: the stress-granule gain of function
      is constitutive, occurring without an applied stressor, which is what makes
      it a disease mechanism rather than an exaggerated stress response.
  downstream:
  - target: Global Translation Inhibition
    causal_link_type: DIRECT
    description: >-
      Sequestration of mRNA-protein complexes into stress granules withdraws
      transcripts from active translation.
- name: Global Translation Inhibition
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells expressing HCM missense DHX30 show reduced global protein synthesis,
    measured by puromycin incorporation. This is the cellular endpoint the
    discovery paper named in its title and is the best-established consequence
    of the severe-subtype alleles. Note the direction is variant-class specific:
    depleting DHX30 in cancer cells raises rather than lowers global translation,
    so translational inhibition here is a property of the mutant protein, not of
    reduced DHX30 dosage.

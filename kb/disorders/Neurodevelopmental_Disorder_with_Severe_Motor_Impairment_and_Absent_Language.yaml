- name: Disrupted Brain Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Structural brain anomalies are found on MRI in roughly two-thirds of
    severe-subtype individuals, and DHX30 is required for central-nervous-system
    development in mouse, where homozygous deletion is embryonic lethal with
    early CNS developmental defects. Expressing pathogenic DHX30 variants in
    zebrafish embryos causes developmental defects. The node is provisional
    because no consistent human malformation signature exists - MRI may be
    normal - and because the link from the cellular translational lesion to the
    tissue phenotype has not been traced in human neural tissue.

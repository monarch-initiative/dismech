genetic:
- name: DHX30
  gene_term:
    preferred_term: DHX30
    term:
      id: hgnc:16716
      label: DHX30
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    DHX30 (DExH-box helicase 30) at 3p21.31 is the single causal gene. Two
    allelic classes with different functional consequences produce two
    clinically distinct subtypes. Heterozygous missense variants inside the
    conserved helicase core motifs cause the severe classic phenotype; recurrent
    alleles include p.(Arg493His), p.(His562Arg), p.(Arg782Trp), p.(Arg785Cys)
    and p.(Arg785His). These impair ATPase and RNA-unwinding activity and
    additionally confer a detrimental gain of function in stress-granule
    assembly. The severe phenotype therefore requires the mutant protein to be
    present rather than merely the wild-type dosage to be halved - a mosaic
    carrier and four haploinsufficient individuals were all mild. No
    functional_impact_category is recorded here because that slot belongs to a
    per-variant GeneticContext and this entry does not curate variant-level
    allele/zygosity detail; the two allelic classes are instead modelled as
    separate pathophysiology nodes and has_subtypes entries. Causality rests on de novo recurrence
    across unrelated families, absence from gnomAD v2.1.1, extreme constraint
    (pLI 1, LOEUF 0.04), biochemical assays of ATPase and helicase activity,
    stress-granule and puromycin-incorporation assays in cultured cells, and
    developmental defects in zebrafish embryos expressing the human variants.
  evidence:
  - reference: PMID:29100085
    reference_title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified six different de novo missense mutations in DHX30 in
      twelve unrelated individuals affected by global developmental delay
      (GDD), intellectual disability (ID), severe speech impairment and gait
      abnormalities.
    explanation: >-
      Establishes the gene-disease relationship through de novo recurrence in
      twelve unrelated probands.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHX30 loss-of-function variants cause a milder phenotype whereas a severe
      phenotype is caused by HCM missense variants that, in addition to the loss
      of ATPase and helicase activity, lead to a detrimental gain-of-function
      with respect to SG formation.
    explanation: >-
      States the allele-class-to-mechanism-to-severity mapping that this genetic
      record encodes.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: As previously noted, DHX30 is one of the most missense-intolerant genes in the human genome
    explanation: >-
      Population-constraint evidence that missense variation in DHX30 is
      strongly selected against, consistent with missense alleles being the
      severe disease class.
animal_models:
- name: dhx30 CRISPR knockout zebrafish
  species: Zebrafish
  genotype: dhx30 8-bp frameshift deletion (premature stop at amino acid 107), homozygous and heterozygous
  publication: PMID:34020708
  description: >-
    A stable CRISPR/Cas9 dhx30 knockout zebrafish line generated to test the
    consequences of losing dhx30 rather than of expressing a mutant protein.
    Unlike the mouse null, it is viable and grossly normal, which is what makes
    it usable for behavioural work.
  modeled_mechanisms:
  - target: Excess Stress Granule Assembly
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Losing dhx30 impairs stress-granule assembly, establishing that dhx30 is
      a conserved positive factor in granule formation. This is the mirror image
      of the human disease allele, which drives excess granules.
    limitations: >-
      This is a loss-of-function model and therefore perturbs the node in the
      opposite direction from the human severe-subtype variant; it establishes
      that dhx30 acts on granule assembly, not that patients have too few
      granules.
    evidence:
    - reference: PMID:34020708
      reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, these data show that SG formation is compromised in the homozygous
        mutants and suggests an evolutionarily conserved role for DHX30 in SG
        assembly.
      explanation: >-
        The zebrafish-specific result behind the conservation claim: homozygous
        dhx30 mutants form fewer stress granules, establishing that this model
        perturbs the node.
  - target: Global Neurodevelopmental Impairment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      dhx30-deficient larvae show altered sleep-wake activity and reduced social
      preference, matching the sleep disturbance and autistic features seen in
      patients.
    limitations: >-
      Only the two behavioural domains are reproduced. The model is a null
      rather than an HCM missense allele, is viable and morphologically normal,
      and does not reproduce the defining severe motor impairment, absent
      language, or intellectual disability - which have no zebrafish
      counterpart in any case.
    readouts:
    - name: Larval sleep-wake activity over a 24-hour light-dark cycle
      target: Global Neurodevelopmental Impairment
      direction: ALTERED
      interpretation: >-
        Behavioural correlate of the sleep disturbance reported in about half of
        severe-subtype patients.
      evidence:
      - reference: PMID:34020708
        reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Behavioral characterization of dhx30-deficient zebrafish revealed
          altered sleep-wake activity and social interaction, partially
          resembling the human phenotype.
        explanation: Reports the sleep-wake measurement behind this readout.
    - name: Social preference index
      target: Global Neurodevelopmental Impairment
      direction: DECREASED
      interpretation: >-
        Behavioural correlate of the autistic features and impaired social
        communication reported in patients.
      evidence:
      - reference: PMID:34020708
        reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Behavioral characterization of dhx30-deficient zebrafish revealed
          altered sleep-wake activity and social interaction, partially
          resembling the human phenotype.
        explanation: Reports the social-interaction measurement behind this readout.
    evidence:
    - reference: PMID:34020708
      reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Behavioral characterization of dhx30-deficient zebrafish revealed
        altered sleep-wake activity and social interaction, partially
        resembling the human phenotype.
      explanation: >-
        The authors' own assessment that the model partially resembles the human
        phenotype supports treating it as informative for this node.
- name: DHX30 variant-expressing zebrafish embryos
  species: Zebrafish
  genotype: tuba1a-driven expression of wild-type or HCM-missense human DHX30 cDNA
  publication: PMID:34020708
  description: >-
    Human DHX30 cDNA carrying each candidate missense variant was expressed in
    one-cell-stage embryos under a neural promoter and embryos were scored for
    abnormal development. This is the in vivo arm of the variant-classification
    workflow, and it tests the mutant protein rather than gene loss.
  modeled_mechanisms:
  - target: Disrupted Brain Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Expressing the human disease alleles causes developmental defects in the
      embryo, directly connecting the molecular lesion to disturbed development
      in a vertebrate.
    limitations: >-
      Scored as gross embryonic developmental defects over 1-7 days post
      fertilisation under overexpression from a heterologous promoter, so
      neither the dosage nor the specific human cortical and cerebellar findings
      are modelled.
    evidence:
    - reference: PMID:34020708
      reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These variants impair the ATPase and helicase activity of DHX30, trigger
        SG formation, interfere with global translation, and cause developmental
        defects in a zebrafish model.
      explanation: >-
        The human disease alleles produce developmental defects in vivo,
        supporting this model as informative for the development node.
treatments:
- name: Augmentative and Alternative Communication
  description: >-
    Tablet, smartphone, and eye-gaze-driven communication systems. Reported by
    the largest cohort study to substantially reduce frustration-related
    behaviour in non-verbal individuals - the only intervention in this disorder
    for which a specific benefit has been described in the primary literature,
    though the observation is investigator communication with families rather
    than a controlled study.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: augmentative and alternative communication training
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Global Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Does not alter the underlying lesion; provides an expressive channel that
      bypasses the absent-speech component of the organism-level phenotype.
  evidence:
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is worth noting that the individuals highly benefit from communication
      devices (tablets, smartphones, and eye-driven tablet communication
      systems) which significantly reduced frustration-related behavior
    explanation: >-
      Directly reports benefit from augmentative communication devices in this
      patient group.
- name: Physical Therapy and Motor Rehabilitation
  description: >-
    Physiotherapy, positioning and mobility aids for the hypotonia, ataxia and
    joint hypermobility. Extrapolated from general management of severe
    neurodevelopmental motor disability; no DHX30-specific outcome data exist.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Global Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Symptomatic support of the motor phenotype; does not act on the
      translational lesion.
  evidence:
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In more detail, all individuals had an intellectual disability, only nine (47%) learned to walk, all with an ataxic gait.
    explanation: >-
      Establishes the severe ambulation deficit and ataxia that motor
      rehabilitation targets. It does not evaluate physiotherapy, which has no
      disease-specific trial evidence.
- name: Genetic Counseling
  description: >-
    Counselling centres on recurrence risk. The disorder is usually de novo, but
    documented parental gonadal mosaicism means that negative parental testing
    on blood does not reduce recurrence risk to the population background, and
    sibling recurrence has been reported more than once. Counselling should also
    convey that variant class predicts severity band.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37094863
    reference_title: "DHX30-Associated Neurodevelopmental Disorder with Severe Motor Impairment and Absent Language: First Korean Case in Two Siblings and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same variant was confirmed in two siblings but not in their parents,
      suggesting the possibility of de novo germline mosaicism.
    explanation: >-
      The sibling recurrence with negative parental testing is precisely the
      counselling scenario this entry flags.
definitions:
- definition_type: DIAGNOSTIC_CRITERIA
  name: Molecular diagnosis of DHX30-related neurodevelopmental disorder
  description: >-
    Diagnosis requires identification of a pathogenic or likely pathogenic DHX30
    variant, in practice by trio exome or genome sequencing. Chromosomal
    microarray detects only the deletion alleles. Because variant class predicts
    the severity band, classifying the variant as a helicase-core-motif missense
    versus a loss-of-function allele is part of the diagnostic assessment, as is
    evaluating parents for mosaicism when a sibling is affected.
  derivation_basis: ESTABLISHED_CRITERIA
  evidence:
  - reference: PMID:37094863
    reference_title: "DHX30-Associated Neurodevelopmental Disorder with Severe Motor Impairment and Absent Language: First Korean Case in Two Siblings and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing using genomic deoxyribonucleic acid
      isolated from buccal swabs, which revealed a heterozygous missense variant
      of DHX30: (c.2344C>T, p.Arg782Trp).
    explanation: >-
      Worked example of the diagnostic route: exome sequencing identifying the
      causal DHX30 variant.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classification the identified variants was based on the American College
      of Medical Genetics and Genomics (ACMG) guidelines
    explanation: >-
      Records the variant-classification standard applied in the defining
      cohort.
discussions:
- discussion_id: dhx30_mitochondrial_arm_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mitoribosomal-translation and mitochondrial-energy-metabolism
    function of DHX30, characterised entirely by depleting both isoforms in
    cancer cell lines, contribute to the human neurodevelopmental phenotype
    caused by helicase-core-motif missense alleles?
  rationale: >-
    The mismatch is directional as well as contextual. Every measurement
    supporting the mitochondrial arm comes from depleting DHX30 in HCT116, U2OS
    or MCF7 cells - the loss-of-function configuration, which in humans produces
    the mild subtype. The severe human phenotype is caused by a catalytically
    dead protein that is still expressed and still assembles into granules. The
    same study shows the two configurations diverge on the cytoplasmic readout,
    since depletion raises global translation while the missense variants lower
    it, so there is a positive reason not to assume the mitochondrial readout
    transfers either. No mitochondrial measurement has been made in a neuron, an
    NEDMIAL patient cell, or an HCM-variant-expressing system.
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Translation and Energy Metabolism
  proposed_experiments:
  - experiment_id: dhx30_mito_readout_in_hcm_variant_neurons
    name: Mitochondrial translation and respiration in HCM-variant neural cells
    description: >-
      Introduce a recurrent HCM missense allele (for example p.Arg782Trp) into
      human iPSC-derived neurons or neural progenitors at the endogenous locus,
      and measure mitoribosomal-transcript translational efficiency, mitochondrial
      protein synthesis and oxygen consumption rate against isogenic wild-type
      and DHX30-heterozygous-null controls. Including the heterozygous null arm
      is what separates a dosage effect from a mutant-protein effect.
    would_support:
    - pathophysiology#Impaired Mitochondrial Translation and Energy Metabolism
    supporting_outcome:
    - >-
      HCM-variant neurons show reduced mitoribosome translational efficiency and
      reduced oxygen consumption relative to isogenic wild-type controls.
    would_refute:
    - pathophysiology#Impaired Mitochondrial Translation and Energy Metabolism
    refuting_outcome:
    - >-
      Mitoribosomal translational efficiency and respiration are unchanged in
      HCM-variant neurons, or are altered only in the heterozygous-null arm,
      indicating the mitochondrial arm belongs to dosage loss and not to the
      severe disease mechanism.
- discussion_id: dhx30_no_patient_derived_neural_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What happens to stress-granule dynamics and translational output in human
    neurons carrying an endogenous DHX30 helicase-core-motif missense variant?
  rationale: >-
    The stress-granule and translation phenotypes were established by
    overexpressing GFP-tagged variant DHX30 in HEK293T and U2OS cells - a
    kidney line and an osteosarcoma line, at non-physiological levels. The step
    from the cellular translational lesion to impaired neuronal differentiation
    and circuit formation is the weakest link in the causal chain and is
    currently pure inference. No iPSC-derived neuron, organoid, or post-mortem
    study of an affected individual has been reported.
  attaches_to:
  - pathophysiology#Global Translation Inhibition
  - pathophysiology#Disrupted Brain Development
- discussion_id: dhx30_no_natural_history_or_prevalence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the population prevalence of DHX30-related neurodevelopmental
    disorder, and what is the natural history into adulthood?
  rationale: >-
    All reported individuals come from case series ascertained through
    diagnostic sequencing, GeneMatcher, and a Facebook family support group, so
    published feature frequencies are vulnerable to ascertainment bias and there
    is no denominator. Adult outcome data are limited to isolated reports. This
    matters practically: the 47% ambulation and 74% non-verbal figures are the
    numbers families are counselled with, and they derive from 19 people.
  attaches_to:
  - prevalence#Worldwide
  - phenotypes#Absent speech
notes: >-
  Lump/split decision: curated as a standalone DISEASE entry anchored on
  MONDO:0060622. DHX30 had no entry in dismech before this one. The two clinical
  subtypes that Mannucci et al. established - helicase-core-motif missense
  (severe) and haploinsufficiency/truncating (mild) - are modelled as
  has_subtypes within this single entry rather than as two entries, because the
  mild form has no separate MONDO or OMIM identity and the two share the same
  gene, the same core clinical axes, and one of the two mechanistic nodes.
  Phenotype frequency bands are scoped to the HCM missense subtype throughout,
  since that is the group the published numerators describe; the mild subtype's
  features are recorded in its subtype description rather than duplicated as
  separately banded phenotypes for a four-person group.

  Not the same disorder as Neurodevelopmental_Disorder_with_Hypotonia_and_Speech_Delay,
  which is the EIF4A2 entity NEDHSS (MONDO:0957541). The two are worth reading
  together as translational-machinery neurodevelopmental disorders - EIF4A2 is a
  DEAD-box helicase of translation initiation, DHX30 a DExH-box helicase - but
  they are different genes, different MONDO terms, and different mechanisms
  (initiation/miRNA repression versus stress-granule gain of function).

  The falcon deep-research report for this disease passed preflight-dr against
  MONDO:0060622 and was used only as a lead. It carried no PMIDs, so every
  reference here was independently searched on PubMed and fetched; the report's
  own citation keys were not used. Two PMIDs recalled from memory during
  drafting resolved to unrelated papers and were discarded rather than cited.

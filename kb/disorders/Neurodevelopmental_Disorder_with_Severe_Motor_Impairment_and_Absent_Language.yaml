      being loss-of-function intolerant (pLI) score of 1 and a loss-of-function
      observed/expected upper bound fraction (LOEUF) score of 0.04, extremely
      loss-of-function intolerant
    explanation: >-
      Constraint metrics computed over a population database establish that
      reduced DHX30 dosage is not tolerated, supporting haploinsufficiency as a
      genuine disease mechanism.
  downstream:
  - target: Global Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced DHX30 dosage produces the milder end of the clinical spectrum.
      The intervening cell-biological steps have not been characterised for this
      allelic class, which notably does not carry the stress-granule gain of
      function.
- name: Loss of DHX30 ATPase and RNA Helicase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    DHX30 is an ATP-dependent DExH-box RNA helicase that uses ATP hydrolysis to
    unwind RNA secondary structure. HCM missense variants were shown, in
    immunoprecipitated-protein ATPase assays and in a radiolabelled RNA-duplex
    unwinding assay with recombinant protein, to impair both the ATPase and the
    helicase activity of the protein. The 2021 study formally established DHX30
    as an ATP-dependent RNA helicase, so the activity being lost is a directly
    measured one rather than an annotation inherited from family membership.

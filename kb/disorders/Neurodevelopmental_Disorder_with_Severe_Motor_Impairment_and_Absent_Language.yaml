name: Neurodevelopmental Disorder with Severe Motor Impairment and Absent Language
creation_date: '2026-09-02T00:00:00Z'
category: Mendelian
synonyms:
- NEDMIAL
- DHX30-related neurodevelopmental disorder
- DHX30-associated neurodevelopmental disorder
- neurodevelopmental disorder with variable motor and language impairment
description: >-
  Neurodevelopmental disorder with severe motor impairment and absent language
  (NEDMIAL; OMIM:617804) is an ultra-rare Mendelian neurodevelopmental disorder
  caused by rare heterozygous variants in DHX30, which encodes an ATP-dependent
  DExH-box RNA helicase. The defining 2017 series described twelve unrelated
  individuals with global developmental delay, intellectual disability, severe
  speech impairment and gait abnormalities, all carrying de novo missense
  variants in highly conserved helicase core motifs (HCMs). A 2021 study of 25
  further individuals established that the DHX30 allelic spectrum splits into
  two clinically distinct subtypes keyed to variant class. HCM missense variants
  produce the classic severe phenotype: they impair ATPase and RNA-unwinding
  activity and, in addition, confer a detrimental gain of function with respect
  to stress-granule assembly, which interferes with global translation.
  Haploinsufficiency and protein-truncating alleles - and a mosaic HCM missense
  carrier - give a milder course in which affected individuals walk in the second
  year and acquire some speech. The mechanistic reading is therefore not a simple
  dosage lesion: the severe phenotype requires the acquired stress-granule
  property on top of the catalytic loss, which is why halving DHX30 dosage is
  better tolerated than a catalytically dead protein that still assembles into
  granules. DHX30 additionally exists as cytoplasmic and more abundant
  mitochondrially targeted isoforms and contributes to mitoribosomal translation
  and mitochondrial energy metabolism, but that arm has been characterised only
  in cancer-cell models and its contribution to the human neurodevelopmental
  phenotype remains inferred. There is no disease-modifying therapy; care is
  symptomatic, with augmentative communication reported to reduce
  frustration-related behaviour.

pathophysiology:
- name: Heterozygous DHX30 Helicase Core Motif Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The severe form of the disorder is initiated by a heterozygous missense
    substitution in one of the eight highly conserved helicase core motifs of
    DHX30. These motifs sit within the two RecA-like domains that jointly form
    the ATP- and RNA-binding surface of an SF2 helicase, so a substitution there
    is positioned to disrupt ATP binding and hydrolysis, RNA recognition, or the
    coupling between them. Recurrent alleles include p.(Arg493His),
    p.(His562Arg), p.(Arg782Trp), p.(Arg785Cys) and p.(Arg785His). None of the
    reported alterations occurs in gnomAD v2.1.1, and DHX30 is among the most
    missense-intolerant genes in the human genome.
  genes:
  - preferred_term: DHX30
    term:
      id: hgnc:16716
      label: DHX30
  evidence:
  - reference: PMID:29100085
    reference_title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All amino acid changes are located within highly conserved helicase motifs
      and were found to either impair ATPase activity or RNA recognition in
      different in vitro assays.
    explanation: >-
      Establishes that the causal substitutions fall inside the conserved
      helicase motifs and that this is where the functional lesion arises.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, none of these DHX30 alterations was present in the gnomAD dataset
      v2.1.1
    explanation: >-
      Population-database absence of every reported allele supports their
      causality rather than incidental rarity.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Within these two core helicase domains, eight highly conserved sequence
      elements, helicase core motifs (HCMs) play a role in either RNA binding,
      or ATP binding and hydrolysis.
    explanation: >-
      States the structural role of the motifs the disease variants occupy;
      this is a sequence/structure classification rather than a measurement.
  downstream:
  - target: Loss of DHX30 ATPase and RNA Helicase Activity
    causal_link_type: DIRECT
    description: >-
      Substitutions in the ATP- and RNA-binding motifs directly compromise the
      catalytic cycle of the helicase.
  - target: Excess Stress Granule Assembly
    causal_link_type: DIRECT
    description: >-
      The mutant proteins acquire an increased propensity to nucleate stress
      granules, a property that is not explained by loss of catalytic activity
      alone.
- name: DHX30 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A separate allelic class - frameshift, nonsense, whole-gene deletion, or
    in-frame multi-exon deletion - reduces the amount of functional DHX30
    produced rather than installing a catalytically dead protein. DHX30 is
    extremely loss-of-function intolerant in population data (pLI 1, LOEUF
    0.04), so this is a real lesion; but clinically it produces the milder
    subtype, which is the observation that separates dosage loss from the
    severe HCM missense mechanism.
  genes:
  - preferred_term: DHX30
    term:
      id: hgnc:16716
      label: DHX30
  evidence:
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we identified four individuals bearing likely pathogenic
      loss-of-function variants.
    explanation: >-
      Establishes the existence of a distinct loss-of-function allelic class in
      the DHX30 disorder.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT

- name: Excess Stress Granule Assembly
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    This is the node that distinguishes the severe subtype from simple dosage
    loss. Overexpressed HCM missense DHX30 protein nucleates cytoplasmic stress
    granules far more readily than wild-type protein, an acquired property that
    the authors classify as a detrimental gain of function layered on top of the
    catalytic loss. Wild-type DHX30 is itself an evolutionarily conserved factor
    in stress-granule assembly, and CRISPR DHX30-deficient HEK293T cells and
    zebrafish show impaired granule assembly - so the mutant proteins push a
    normal DHX30 function past its regulatory setpoint rather than doing
    something DHX30 never does.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cytoplasmic stress granule assembly
    term:
      id: GO:0034063
      label: cytoplasmic stress granule assembly
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:29100085
    reference_title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, protein variants exhibit an increased propensity to trigger
      stress granule (SG) formation resulting in global translation inhibition.
    explanation: >-
      Direct cellular demonstration that the disease variants drive excess
      stress-granule formation and that this is what inhibits translation.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

has_subtypes:
- name: HCM missense
  display_name: Helicase-core-motif missense subtype (severe)
  description: >-
    The classic, severe NEDMIAL phenotype, caused by a heterozygous missense
    variant within one of the highly conserved helicase core motifs. All 19
    individuals of this class in the 2021 cohort had global developmental delay,
    intellectual disability, severe speech impairment and gait abnormalities;
    fewer than half achieved independent walking and most were non-verbal. The
    mechanism combines loss of ATPase/helicase activity with a detrimental gain
    of function in stress-granule assembly.
  evidence:
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 19 individuals harboring heterozygous missense variants within
      helicase core motifs (HCMs) have global developmental delay, intellectual
      disability, severe speech impairment, and gait abnormalities.
    explanation: >-
      Defines the severe subtype by variant class and states its obligate
      clinical features in the 19-person group.
- name: Loss of function
  display_name: Haploinsufficiency / protein-truncating subtype (mild)
  description: >-
    A milder clinical course seen in individuals carrying alleles that reduce
    DHX30 dosage or truncate the protein - frameshift, nonsense, whole-gene
    deletion, or in-frame multi-exon deletion. These individuals walked in the
    second year of life, had only mild muscular hypotonia, and spoke at least 20
    words by age three. A de novo mosaic HCM missense carrier fell into the same
    milder band, consistent with the severe phenotype requiring a sufficient
    burden of the mutant protein rather than merely reduced wild-type dosage.
  evidence:
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 4 individuals harboring heterozygous variants resulting either in
      haploinsufficiency or truncated proteins presented with a milder clinical
      course, similar to an individual harboring a de novo mosaic HCM missense
      variant.
    explanation: >-
      Establishes the milder subtype, its variant classes, and the mosaic
      missense carrier who behaves like it.
  - reference: PMID:34020708
    reference_title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who all learned to walk in the second year of life, had a mild muscular
      hypotonia and spoke at least 20 words by the age of 3 years
    explanation: >-
      Gives the specific developmental milestones that distinguish the mild
      subtype from the severe one.
inheritance:
- name: Autosomal dominant, de novo
  description: >-
    Nearly all reported probands carry a heterozygous de novo DHX30 variant.
    Both the 2017 discovery series and the 2021 cohort are dominated by de novo
    missense alleles, and none of the reported alterations is present in gnomAD
    v2.1.1.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:29100085
    reference_title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identified six different de novo missense mutations in DHX30 in
      twelve unrelated individuals affected by global developmental delay
      (GDD), intellectual disability (ID), severe speech impairment and gait
      abnormalities.
    explanation: >-
      Establishes heterozygous de novo missense variants as the mode of
      inheritance in the defining cohort.
  - reference: PMID:34145223
    reference_title: A Japanese adult and two girls with NEDMIAL caused by de novo missense variants in DHX30.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NEDMIAL is characterized by severely delayed psychomotor development, which causes an autosomal dominant disorder.
    explanation: >-
      Independent statement that the entity is transmitted as an autosomal
      dominant disorder.
- name: Parental gonadal mosaicism
  description: >-
    Recurrence in siblings born to clinically unaffected, test-negative parents
    has been documented more than once, and is attributed to parental gonadal
    (germline) mosaicism. This is the main counselling caveat in an otherwise de
    novo disorder: negative parental testing on blood does not reduce recurrence
    risk to background. A heterozygous nonsense allele inherited from a mosaic
    mother has also been reported.
  inheritance_term:
    preferred_term: gonadal mosaicism in a clinically unaffected parent
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  evidence:
  - reference: PMID:37094863
    reference_title: "DHX30-Associated Neurodevelopmental Disorder with Severe Motor Impairment and Absent Language: First Korean Case in Two Siblings and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same variant was confirmed in two siblings but not in their parents,
      suggesting the possibility of de novo germline mosaicism.
    explanation: >-
      Documents sibling recurrence with negative parental testing, the
      observation that identifies parental germline mosaicism.
  - reference: PMID:34020708

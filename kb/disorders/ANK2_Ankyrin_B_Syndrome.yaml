genetic:
- name: Reported ANK2 monogenic LQTS and CPVT associations
  gene_term:
    preferred_term: ANK2
    term:
      id: hgnc:493
      label: ANK2
  association: Reported monogenic LQTS and CPVT associations
  relationship_type: DISPUTED
  features: >-
    Early reports connected ANK2 variants with type 4 long QT syndrome and
    catecholaminergic polymorphic ventricular tachycardia. Later gene-validity
    and population analyses disputed both monogenic relationships. Variant
    interpretation requires contemporary population, segregation,
    phenotype-specific, and functional evidence.
  evidence:
  - reference: PMID:15178757
    reference_title: "A cardiac arrhythmia syndrome caused by loss of ankyrin-B function."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A loss-of-function mutation of ankyrin-B identified in an extended kindred
      causes a dominantly inherited cardiac arrhythmia, initially described as
      type 4 long QT syndrome.
    explanation: >-
      Preserves the historical family-level association without generalizing it.
  - reference: PMID:15178757
    reference_title: "A cardiac arrhythmia syndrome caused by loss of ankyrin-B function."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Humans with ankyrin-B mutations display varying degrees of cardiac
      dysfunction including bradycardia, sinus arrhythmia, idiopathic
      ventricular fibrillation, catecholaminergic polymorphic ventricular
      tachycardia, and risk of sudden death.
    explanation: >-
      Preserves the early CPVT-like clinical report without treating it as a
      currently validated monogenic ANK2-CPVT relationship.
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Six genes, AKAP9, ANK2, KCNE2, KCNJ5, SCN4B, and SNTA1, were classified
      as disputed, defined as the absence of sufficient genetic evidence to
      support causation of LQTS (Figure 1).
    explanation: >-
      Refutes a broad monogenic ANK2-LQTS interpretation.
  - reference: PMID:34557911
    reference_title: "Evaluation of gene validity for CPVT and short QT syndrome in sudden arrhythmic death."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Three of the four disputed genes for CPVT (KCNJ2, PKP2, SCN5A) were deemed
      by the Expert Panel to be reported for phenotypes that were not
      representative of CPVT, while reported variants in a fourth gene (ANK2)
      were too common in the population to be disease-causing.
    explanation: >-
      Refutes a broad monogenic ANK2-CPVT interpretation.
  - reference: PMID:32164423
    reference_title: "Established Loss-of-Function Variants in ANK2-Encoded Ankyrin-B Rarely Cause a Concerning Cardiac Phenotype in Humans."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Established Loss-of-Function Variants in ANK2-Encoded Ankyrin-B Rarely
      Cause a Concerning Cardiac Phenotype in Humans.
    explanation: >-
      The title-only cached record provides limited modern counterevidence
      against inferring a concerning cardiac phenotype from established
      loss-of-function variation alone.
diagnosis:
- name: Phenotype-first LQTS evaluation with evidence-based gene interpretation
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: MAXO:0000900
      label: electrocardiography
  description: >-
    Cardiac evaluation should begin with the documented electrophysiologic
    phenotype. An ANK2 finding alone must not establish LQTS or direct clinical
    decisions when the gene-disease relationship is disputed.
  results: >-
    Interpret ECG and rhythm findings independently of ANK2 status; require new
    and sufficient variant-level genetic evidence before attributing LQTS to
    ANK2.
  evidence:
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic variants in these genes should not be used for clinical
      decision-making, unless accompanied by new and sufficient genetic
      evidence.
    explanation: >-
      The reappraisal explicitly warns against clinical use of variants in
      disputed or limited LQTS genes without sufficient new evidence.
notes: >-
  The cardiac and neurodevelopmental ANK2 records are intentionally split to
  prevent a cardiac-disputed relationship from being auto-wired to the
  definitive neurodevelopmental mechanisms. The Brugada assertion is retained
  only as an external disputed Gene2Phenotype record because the locally cached
  literature used here does not independently establish that classification.

inheritance:
- name: Historically reported autosomal dominant inheritance
  description: >-
    Dominant transmission was reported in the founding cardiac kindred, but
    penetrance and variant-level pathogenicity cannot be generalized across
    rare ANK2 variants.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15178757
    reference_title: "A cardiac arrhythmia syndrome caused by loss of ankyrin-B function."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A loss-of-function mutation of ankyrin-B identified in an extended kindred
      causes a dominantly inherited cardiac arrhythmia, initially described as
      type 4 long QT syndrome.
    explanation: >-
      The early kindred supports dominant inheritance for that reported
      variant-family relationship; later validity concerns prevent
      generalization to all ANK2 variants.
mechanistic_hypotheses:
- hypothesis_group_id: variant_specific_ankyrin_b_cardiac_model
  hypothesis_label: Variant-Specific Ankyrin-B Cardiac Trafficking Model
  status: EMERGING
  description: >-
    Functionally damaging ANK2 variants may impair ankyrin-B-dependent membrane
    organization in working cardiomyocytes or sinoatrial-node cells. Ventricular
    calcium-handling defects and sinoatrial pacing failure are modeled as
    parallel branches. The cellular mechanisms are experimentally supported,
    but their penetrance and applicability to individual human variants require
    independent genetic evidence.
  evidence:
  - reference: PMID:12571597
    reference_title: "Ankyrin-B mutation causes type 4 long-QT cardiac arrhythmia and sudden cardiac death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, we identify a new mechanism for cardiac arrhythmia due to abnormal
      coordination of multiple functionally related ion channels and transporters.
    explanation: >-
      The model-organism study supports the ankyrin-B trafficking mechanism,
      while not by itself establishing broad human variant validity.
pathophysiology:
- name: ANK2-Dependent Cardiac Membrane-Targeting Failure
  biological_scale: CELLULAR
  description: >-
    Reduced or variant-impaired ankyrin-B disrupts coordinated localization of
    the sodium pump, sodium-calcium exchanger, and inositol trisphosphate
    receptor at cardiomyocyte transverse-tubule and sarcoplasmic-reticulum
    membrane domains.

  - target: CaMKII-Dependent RyR2 Hyperphosphorylation
    description: >-
      Ankyrin-B deficiency produces abnormal CaMKII-dependent phosphorylation
      of the cardiac ryanodine receptor in the heterozygous mouse model.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

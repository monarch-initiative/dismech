diagnosis:
- name: Phenotype-first LQTS evaluation with evidence-based gene interpretation
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Cardiac evaluation should begin with the documented electrophysiologic
    phenotype. An ANK2 finding alone must not establish LQTS or direct clinical
    decisions when the gene-disease relationship is disputed.
  results: >-
    Interpret ECG and rhythm findings independently of ANK2 status; require new
    and sufficient variant-level genetic evidence before attributing LQTS to
    ANK2.
  evidence:
  - reference: PMID:31983240
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic variants in these genes should not be used for clinical
      decision-making, unless accompanied by new and sufficient genetic
      evidence.
    explanation: >-
      The reappraisal explicitly warns against clinical use of variants in
      disputed or limited LQTS genes without sufficient new evidence.
- name: Ambulatory Rhythm Monitoring
  diagnosis_term:
    preferred_term: Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  description: >-
    Ambulatory ECG monitoring can capture intermittent atrial or ventricular
    arrhythmia and sinus-node dysfunction that is absent on a resting tracing.
    Evidence here documents its use in a recent, genetically complex family and
    does not make an ANK2-specific diagnostic-performance claim.
  results: >-
    Interpret rhythm findings on their own clinical merits and do not attribute
    them to ANK2 without adequate variant and segregation evidence.
  evidence:
  - reference: DOI:10.2147/tacg.s438957
    reference_title: "A New Inherited Syndrome Causing Sudden Cardiac Death With Distinct ST-Segment Depression and Ankyrin-2-Mutation"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All available family members were seen and examined with our cardiology
      department and underwent resting and exercise ECGs, 24-hr Holter ECG
      monitoring and a standard transthoracic echocardiogram.
    explanation: >-
      Documents Holter monitoring in an ANK2-plus-MYO18B family evaluation;
      partial polarity preserves the oligogenic and case-based scope.
- name: Exercise Cardiac Stress Testing
  diagnosis_term:
    preferred_term: Exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  description: >-
    Exercise ECG can help reveal stress-associated arrhythmias in a
    phenotype-first assessment. It is not a test of ANK2 pathogenicity.
  results: >-
    Evaluate inducible ectopy or arrhythmia independently, then integrate any
    genetic finding using contemporary variant-level evidence.
  evidence:
  - reference: DOI:10.2147/tacg.s438957
    reference_title: "A New Inherited Syndrome Causing Sudden Cardiac Death With Distinct ST-Segment Depression and Ankyrin-2-Mutation"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All available family members were seen and examined with our cardiology
      department and underwent resting and exercise ECGs, 24-hr Holter ECG
      monitoring and a standard transthoracic echocardiogram.
    explanation: >-
      Documents exercise ECG in a genetically complex family investigation;
      it does not validate ANK2 as a stand-alone diagnostic marker.
- name: Echocardiographic Structural Assessment
  diagnosis_term:
    preferred_term: Echocardiography test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography assesses ventricular function and structural heart disease
    when cardiomyopathy is suspected or being excluded.
  results: >-
    Structural findings should be interpreted separately from electrical
    phenotypes and from the pathogenicity of an ANK2 variant.
  evidence:
  - reference: DOI:10.2147/tacg.s438957
    reference_title: "A New Inherited Syndrome Causing Sudden Cardiac Death With Distinct ST-Segment Depression and Ankyrin-2-Mutation"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All available family members were seen and examined with our cardiology
      department and underwent resting and exercise ECGs, 24-hr Holter ECG
      monitoring and a standard transthoracic echocardiogram.
    explanation: >-
      Documents structural imaging as one component of a family cardiac
      evaluation; partial polarity reflects the single-family evidence.
- name: Multigene Testing, Segregation, and Molecular Autopsy
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    In unresolved inherited-arrhythmia or sudden-death families, panel or exome
    testing, molecular autopsy, and segregation analysis may be used. Because
    ANK2 cardiac validity is disputed and oligogenic findings occur, an ANK2
    result alone must not establish diagnosis or guide predictive testing.
  results: >-
    Classify each variant with current population, segregation, functional, and
    phenotype evidence; evaluate other cardiac genes and avoid using an ANK2 VUS
    for cascade prediction.
  evidence:
  - reference: DOI:10.2147/tacg.s438957
    reference_title: "A New Inherited Syndrome Causing Sudden Cardiac Death With Distinct ST-Segment Depression and Ankyrin-2-Mutation"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A precise analysis was performed by an international multidisciplinary
      expert panel including autopsy of the index patient’s heart, molecular
      autopsy, whole-exome sequencing, analysis of the pedigree and examination
      of available family members.
    explanation: >-
      Documents a combined molecular-autopsy, exome, pedigree, and family
      evaluation in a case with ANK2 and MYO18B findings.
  - reference: DOI:10.2147/tacg.s438957
    reference_title: "A New Inherited Syndrome Causing Sudden Cardiac Death With Distinct ST-Segment Depression and Ankyrin-2-Mutation"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing of the index patients blood sample and in parts of the
      family was done. It was performed by sequencing in parallel 174 genes
      associated with inherited cardiac diseases on a MiSeq platform.
    explanation: >-
      Documents multigene panel testing rather than ANK2-only testing in the
      investigated family.
notes: >-
  The cardiac and neurodevelopmental ANK2 records are intentionally split to
  prevent a cardiac-disputed relationship from being auto-wired to the
  definitive neurodevelopmental mechanisms. The Brugada assertion is retained
  only as an external disputed Gene2Phenotype record because the locally cached
  literature used here does not independently establish that classification.

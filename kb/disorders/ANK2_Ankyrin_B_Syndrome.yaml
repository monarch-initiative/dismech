    reference_title: "Dysfunction in ankyrin-B-dependent ion channel and transporter targeting causes human sinus node disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped two families with highly penetrant and severe SND to the human
      ANK2 (ankyrin-B/AnkB) locus.
    explanation: >-
      Human families support a locus-level association with severe sinus-node
      dysfunction.
  - reference: PMID:18832177
    reference_title: "Dysfunction in ankyrin-B-dependent ion channel and transporter targeting causes human sinus node disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AnkB is essential for normal membrane organization of sinoatrial node
      cell channels and transporters, and AnkB is required for physiological
      cardiac pacing.
    explanation: >-
      Experimental evidence supports the channel-targeting and pacemaker
      mechanism.

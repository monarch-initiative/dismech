- name: CaMKII Inhibition for RyR2 Dysregulation (Preclinical)
  description: >-
    Genetic AC3I expression and pharmacologic KN-93 treatment rescued RyR2
    dysregulation and blunted arrhythmia in ankyrin-B-deficient mice. KN-93 is
    an experimental tool compound, not a clinical recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

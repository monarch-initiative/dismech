      reference_title: "CaMKII inhibition rescues proarrhythmic phenotypes in the model of human ankyrin-B syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The cardiac ryanodine receptor (RyR(2)), a validated target of
        kinase/phosphatase regulation in myocytes, displays abnormal
        CaMKII-dependent phosphorylation (pS2814 hyperphosphorylation) in
        ankyrin-B(+/-) heart.
      explanation: >-
        Directly supports CaMKII-dependent RyR2 hyperphosphorylation in the
        ankyrin-B-deficient model.

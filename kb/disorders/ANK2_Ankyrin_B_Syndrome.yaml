  - preferred_term: ANK2
    term:
      id: hgnc:493
      label: ANK2
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: protein localization to membrane
    term:
      id: GO:0072657
      label: protein localization to membrane
    modifier: DECREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:12571597
    reference_title: "Ankyrin-B mutation causes type 4 long-QT cardiac arrhythmia and sudden cardiac death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutation of ankyrin-B results in disruption in the cellular organization
      of the sodium pump, the sodium/calcium exchanger, and
      inositol-1,4,5-trisphosphate receptors (all ankyrin-B-binding proteins),
      which reduces the targeting of these proteins to the transverse tubules as
      well as reducing overall protein level.
    explanation: >-
      Demonstrates loss of ankyrin-B-dependent targeting in cardiomyocytes.
  - reference: PMID:15178757
    reference_title: "A cardiac arrhythmia syndrome caused by loss of ankyrin-B function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All mutations abolish ability of ankyrin-B to restore abnormal Ca(2+)
      dynamics and abnormal localization and expression of Na/Ca exchanger,
      Na/K ATPase, and InsP(3)R in ankyrin-B(+/-) cardiomyocytes.
    explanation: >-
      Cardiomyocyte rescue assays support functional impairment of the reported
      historical variants.
  downstream:
  - target: Ventricular Calcium-Handling Dysregulation
    description: >-
      Loss of coordinated transporter organization alters cardiomyocyte calcium
      signaling.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12571597
      reference_title: "Ankyrin-B mutation causes type 4 long-QT cardiac arrhythmia and sudden cardiac death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ankyrin-B mutation also leads to altered Ca2+ signalling in adult
        cardiomyocytes that results in extrasystoles, and provides a rationale
        for the arrhythmia.
      explanation: >-
        Directly links ankyrin-B mutation to abnormal calcium signaling in
        adult cardiomyocytes.
  - target: Sinoatrial Node Pacemaker Dysfunction
    description: >-
      Ankyrin-B-dependent targeting is also required in sinoatrial-node cells,
      creating a distinct bradyarrhythmia branch.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18832177
      reference_title: "Dysfunction in ankyrin-B-dependent ion channel and transporter targeting causes human sinus node disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, dysfunction in AnkB-based trafficking pathways causes abnormal
        sinoatrial node (SAN) electrical activity and SND.
      explanation: >-
        Supports a separate ankyrin-B trafficking route to sinoatrial-node
        dysfunction.
  - target: Prolonged QT Interval
    description: >-
      QT or QTU prolongation occurs in some early families and selected cases,
      but is not a consistent consequence of ANK2 dysfunction.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15178757
      reference_title: "A cardiac arrhythmia syndrome caused by loss of ankyrin-B function."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, a prolonged rate-corrected QT interval was not a consistent
        feature, indicating that ankyrin-B dysfunction represents a clinical
        entity distinct from classic long QT syndromes.
      explanation: >-
        Supports variable, family-specific QT prolongation while explicitly
        opposing a uniform classic-LQTS phenotype.
  - target: Atrial Cav1.3 Targeting Defect and Reentry Susceptibility
    description: >-
      Loss of atrial Cav1.3 membrane targeting provides a modeled substrate for
      atrial action-potential shortening and reentry.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23436330
      reference_title: "Atrial fibrillation and sinus node dysfunction in human ankyrin-B syndrome: a computational analysis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Our simulations predict that defective membrane targeting of the
        voltage-gated L-type Ca(2+) channel Cav1.3 leads to action potential
        shortening that reduces the critical atrial tissue mass needed to
        sustain reentrant activation.
      explanation: >-
        The computational study directly models the atrial consequence of
        ankyrin-B-dependent Cav1.3 mistargeting.
  - target: Beta-Catenin Localization and Signaling Disruption
    description: >-
      Ankyrin-B loss disrupts its structural interaction with beta-catenin and
      the normal localization of beta-catenin in cardiomyocytes.
    hypothesis_groups:
    - variant_specific_ankyrin_b_cardiac_model
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31264976
      reference_title: "Ankyrin-B dysfunction predisposes to arrhythmogenic cardiomyopathy and is amenable to therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human hearts from deceased ANK2 ARVC probands display aberrant β-catenin
        localization.
      explanation: >-
        Human ventricular tissue directly supports abnormal beta-catenin
        localization in selected ANK2-associated cardiomyopathy probands.
    - reference: PMID:31264976
      reference_title: "Ankyrin-B dysfunction predisposes to arrhythmogenic cardiomyopathy and is amenable to therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Desmosomal structure and function appeared preserved in diseased human
        and murine specimens in the presence of markedly abnormal β-catenin
        expression and patterning, leading to identification of a previously
        unknown interaction between ankyrin-B and β-catenin.
      explanation: >-
        The murine component supports the ankyrin-B/beta-catenin interaction;
        it is separated from the human-tissue evidence so each item has one
        experimental-system classification.
  - target: Loss of Local PP2A-B56alpha Regulation
    description: >-
      In the ANK2 p.Q1283H knock-in model, reduced ankyrin-B binding to the PP2A

      term:
        id: CHEBI:91460
        label: KN-93
  target_mechanisms:
  - target: CaMKII-Dependent RyR2 Hyperphosphorylation
    treatment_effect: INHIBITS
    description: >-
      CaMKII inhibition normalizes RyR2 behavior and reduces the proarrhythmic
      phenotype in the ankyrin-B-deficient model.
    evidence:
    - reference: PMID:23059182
      reference_title: "CaMKII inhibition rescues proarrhythmic phenotypes in the model of human ankyrin-B syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RyR(2) dysregulation is rescued in myocytes from ankyrin-B(+/-) mice
        overexpressing a potent CaMKII-inhibitory peptide (AC3I), and aberrant
        RyR(2) open probability observed in ankyrin-B(+/-) hearts is normalized
        by treatment with the CaMKII inhibitor KN-93.
      explanation: >-
        Directly supports genetic and pharmacologic rescue of this mechanism.
  evidence:
  - reference: PMID:23059182
    reference_title: "CaMKII inhibition rescues proarrhythmic phenotypes in the model of human ankyrin-B syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CaMKII inhibition is sufficient to rescue abnormalities in
      ankyrin-B(+/-) myocyte electrical dysfunction including cellular
      afterdepolarizations, and significantly blunts whole animal cardiac
      arrhythmias and sudden death in response to elevated sympathetic tone.
    explanation: >-
      Demonstrates rescue from cellular through organism scales in mice.

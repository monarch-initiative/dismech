name: Cardiac Arrhythmia, Ankyrin-B-Related
creation_date: '2026-04-04T00:00:00Z'
category: Genetic
description: >-
  Cardiac arrhythmia, ankyrin-B-related is a historically reported,
  variant-specific cardiac phenotype associated with rare ANK2 variants.
  Early families and selected probands had sinus-node dysfunction, bradycardia,
  ventricular tachyarrhythmia, or ventricular fibrillation, with inconsistent
  QT prolongation. Later evidence-based reappraisals classified ANK2 as disputed
  for monogenic long QT syndrome and found reported ANK2 variants for
  catecholaminergic polymorphic ventricular tachycardia too common to be
  disease-causing. This entry therefore preserves experimentally supported
  cardiac trafficking and calcium-handling models without treating every rare
  ANK2 variant as causative or diagnostically actionable. The definitive
  ANK2-related complex neurodevelopmental disorder is modeled separately.
synonyms:
- ankyrin-B syndrome
- LQT4
- long QT syndrome type 4

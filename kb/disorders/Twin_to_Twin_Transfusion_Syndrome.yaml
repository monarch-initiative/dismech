review_notes: >-
  Review checked the cached Falcon deep-research artifact against the intended
  MONDO:0019805 identity. Automated gene preflight returned SKIP because TTTS
  has no canonical causal gene; manual review confirmed that the report concerns
  the correct monochorionic placental transfusion entity, although its identifier
  discussion was stale and was not reused. Curated claims were therefore verified
  against repository-cached primary studies and clinical reviews. Frequencies
  were retained only for the obligatory diagnostic oligohydramnios,
  polyhydramnios, and defining intertwin transfusion; unsupported qualitative
  bands were removed. Fetal anemia, preterm birth, and fetal demise remain
  deliberately unwired where retained evidence establishes occurrence or outcome
  but not a sufficiently specific causal arrow. The verified GSE47394 dataset is
  disease-specific amniotic-fluid cell-free RNA data. No causal genetics or
  evidence-supported experimental/animal model was identified. The legacy
  references[].findings copies were removed deliberately because they duplicated
  the same quotes already represented as typed EvidenceItem records but lacked
  support calibration and evidence-source classification; no underlying citation
  or validated snippet was removed. Cellular/process descriptors on the placental
  vascular trigger were retained as structural grounding, while unsupported
  causal arrows were not introduced.

  description: >-
    NDUFA1 is X-chromosomal, which sets this entity apart from the largely
    autosomal recessive complex I series. Affected patients described first were
    hemizygous males, and the male preponderance of earlier complex I cohorts was
    itself the clue that led investigators to the X chromosome. Heterozygous
    female carriers were initially assumed unaffected, but that is not reliably
    true — see the skewed X-inactivation node.
  evidence:
  - reference: PMID:17262856
    reference_title: "X-linked NDUFA1 gene mutations associated with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

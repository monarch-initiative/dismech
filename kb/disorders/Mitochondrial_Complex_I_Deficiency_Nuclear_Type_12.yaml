      underlying genetic defect.
    explanation: >-
      Records the epidemiological observation that motivated the search for an
      X-linked cause.
  - reference: PMID:17262856
    reference_title: "X-linked NDUFA1 gene mutations associated with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two novel p.Gly8Arg and p.Arg37Ser hemizygous mutations in NDUFA1 were
      identified in two unrelated male patients presenting with Leigh's syndrome
      and with myoclonic epilepsy and developmental delay, respectively.
    explanation: >-
      Documents hemizygous male genotypes in the two index patients.

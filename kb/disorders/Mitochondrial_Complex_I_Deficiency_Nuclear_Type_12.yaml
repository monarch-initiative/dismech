- name: Complex I Assembly and Stability Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Two-dimensional blue native gel electrophoresis of patient fibroblasts shows
    reduced amounts of fully assembled complex I with no accumulation of
    lower-molecular-weight subcomplexes. That negative finding is the
    mechanistically informative one: an assembly pathway blocked at a defined
    intermediate would leave that intermediate behind, so its absence points to
    failure of assembly, destabilization of the assembled holoenzyme, or both,
    rather than a discrete arrest point.

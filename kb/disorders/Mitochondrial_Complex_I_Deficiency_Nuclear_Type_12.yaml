name: Mitochondrial Complex I Deficiency, Nuclear Type 12
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Mitochondrial complex I deficiency, nuclear type 12 is an X-linked
  mitochondrial encephalomyopathy caused by variants in NDUFA1, which encodes
  the small MWFE accessory subunit of respiratory chain complex I. Complex I is
  the entry point of the respiratory chain, oxidizing NADH and passing electrons
  to ubiquinone while pumping protons; NDUFA1 is not catalytic but is required
  for the holoenzyme to assemble and remain stable. Patient cells show reduced
  amounts of intact complex I with no accumulation of partial subcomplexes,
  the pattern expected when assembly stalls or the assembled enzyme is
  destabilized rather than arrested at a defined intermediate. The clinical
  result is the recognizable complex I phenotype — Leigh syndrome, or an
  encephalomyopathy with epilepsy, developmental delay and lactic acidosis.
  Its distinguishing feature within the largely autosomal recessive complex I
  series is that NDUFA1 sits on the X chromosome, so affected patients are
  typically hemizygous males, and heterozygous females can be affected when
  X-inactivation is skewed toward the mutant allele.
category: Mendelian
parents:
- hereditary disease
synonyms:
- MC1DN12
- NDUFA1 deficiency
- mitochondrial complex I deficiency, nuclear type 12
- MWFE subunit deficiency
- complex I deficiency due to NDUFA1 mutation

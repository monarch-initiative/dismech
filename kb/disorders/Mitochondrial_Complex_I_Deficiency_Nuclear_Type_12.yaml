biochemical:
- name: Elevated Beta-Hydroxybutyrate/Acetoacetate Ratio
  presence: PRESENT
  notes: >-
    A raised beta-hydroxybutyrate to acetoacetate ratio reflects a rise in the
    mitochondrial NADH/NAD+ ratio, which is exactly what a complex I block
    produces: NADH accumulates because the chain cannot reoxidize it. Together
    with lactic acidosis this points at the respiratory chain before any genetic
    result is available.
  evidence:
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a girl initially presenting with mild muscular hypotonia,
      a moderate lactic acidosis and an increased beta-hydroxybutyrate/acetoacetate
      ratio.
    explanation: >-
      Records the redox-ratio abnormality alongside the lactic acidosis.
- name: Reduced Complex I Amount and Activity in Muscle
  presence: PRESENT
  notes: >-
    Respiratory chain enzymology on a muscle biopsy shows a fall in both the
    quantity and the catalytic activity of complex I. Measuring both matters
    here, because an accessory-subunit defect reduces the amount of assembled
    enzyme rather than poisoning a catalytic site.
  evidence:
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical investigations of a muscle biopsy revealed a deficiency in the
      amount and activity of complex I.
    explanation: >-
      Documents the paired amount-and-activity deficit in patient muscle.
genetic:
- name: NDUFA1
  gene_term:
    preferred_term: NDUFA1
    term:
      id: hgnc:7683
      label: NDUFA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NDUFA1 (Xq24) encodes MWFE, an accessory subunit of complex I. It is one of
    only two X-chromosomal nuclear genes among the 58 that control complex I
    biogenesis — NDUFB11 is the other — which is what makes this entity's
    inheritance pattern unusual within the complex I series and offers a
    mechanism for sex-dependent variation in presentation. Reported alleles are
    missense: p.Gly8Arg, p.Arg37Ser, c.55C>T (hemizygous males) and p.Gly32Arg
    (affected heterozygous female).
  evidence:
  - reference: PMID:28506826
    reference_title: "An X-chromosome linked mouse model (Ndufa1(S55A)) for systemic partial Complex I deficiency for studying predisposition to neurodegeneration and other diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two of these are X-chromosome linked nuclear (nDNA) genes (NDUFA1 and
      NDUFB11), and 7 are mitochondrial (mtDNA, MT-ND1-6, -4L) genes, which may be
      responsible for sex-dependent variation in the presentation of mitochondrial
      diseases.
    explanation: >-
      Places NDUFA1 as one of only two X-linked nuclear complex I genes and links
      that to sex-dependent presentation.
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation screening of all structural subunits of complex I identified a
      heterozygous mutation c.94G>C, p.Gly32Arg in the X-chromosomal NDUFA1 gene.
    explanation: >-
      Identifies the allele found in the affected heterozygous female.
animal_models:
- name: Ndufa1 S55A knock-in mouse
  species: Mouse
  genotype: Ndufa1 S55A (serine-55-alanine knock-in, X-linked)
  publication: PMID:28506826
  description: >-
    A homologous-recombination knock-in introducing a point mutation in the 55th
    codon of Ndufa1, producing a systemic serine-55-alanine substitution in the
    MWFE protein. Described by its authors as the first genuine X-chromosome
    linked mouse model of systemic partial complex I deficiency.
  modeled_mechanisms:
  - target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces a systemic, partial (roughly 50%) complex I deficiency in both
      sexes, matching the partial rather than complete enzyme deficit inferred in
      patients.
    limitations: >-
      S55A is an engineered allele, not one of the human pathogenic variants
      (p.Gly8Arg, p.Arg37Ser, c.55C>T, p.Gly32Arg), so it models the consequence
      of MWFE dysfunction rather than any specific patient genotype. The
      phenotype is also dominated by metabolic and behavioural readouts rather
      than the Leigh syndrome or myoclonic epilepsy that define the human
      disease.
    readouts:
    - name: Complex I activity
      target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
      direction: DECREASED
      interpretation: >-
        Roughly 50% of wild-type complex I activity systemically, in both sexes.

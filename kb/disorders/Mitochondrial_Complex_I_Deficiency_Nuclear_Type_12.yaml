  - target: Mitochondrial Encephalomyopathy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model develops age-dependent Purkinje neuron degeneration, giving a
      neurodegenerative phenotype, but this is a late cerebellar degeneration
      rather than the subacute necrotizing encephalomyelopathy or myoclonic
      epilepsy that define the human presentations.
    limitations: >-
      The neuropathology does not match the human disease in either distribution
      or tempo: Leigh syndrome involves basal ganglia and brainstem lesions with
      infantile or early childhood onset, whereas this model shows age-dependent
      Purkinje cell loss. No seizure phenotype corresponding to the human
      myoclonic epilepsy presentation is reported.

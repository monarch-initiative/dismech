  downstream:
  - target: Mitochondrial Encephalomyopathy
- name: Skewed X-Inactivation in Heterozygous Females
  biological_scale: CELLULAR
  role: modifier
  mechanism_confidence: ESTABLISHED
  description: >-
    Because NDUFA1 is X-linked, a heterozygous female is a mosaic of cells
    expressing either the wild-type or the mutant allele, and her phenotype
    depends on which allele is active in the affected tissue. In the reported
    affected girl, 72% of NDUFA1 mRNA in muscle carried the mutation and 74% of
    the active allele in that muscle was the paternally inherited one — skewing
    toward the mutant allele in the very tissue that was biochemically deficient.
    This is why heterozygous females cannot be assumed to be unaffected carriers,
    and it modifies the whole chain rather than sitting at one point in it.
  evidence:
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the cDNA showed that 72% of the expressed mRNA was mutated in
      the muscle biopsy sample.
    explanation: >-
      Quantifies the allelic expression skew in the affected tissue.
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigation of the X-inactivation pattern demonstrated that 74% of the
      paternally inherited allele was active in the muscle.
    explanation: >-
      Directly demonstrates skewed X-inactivation as the reason a heterozygote is
      affected.
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report of an X-chromosomally inherited respiratory chain
      defect in a heterozygous female.
    explanation: >-
      Establishes that heterozygous females can manifest this respiratory chain
      defect.
  downstream:
  - target: Complex I Assembly and Stability Failure
- name: Mitochondrial Encephalomyopathy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint. Neurons and muscle are the tissues least able to
    tolerate reduced oxidative phosphorylation capacity, so the disease presents
    as encephalomyopathy: Leigh syndrome in one index patient, myoclonic epilepsy
    with developmental delay in the other, and muscular hypotonia with lactic
    acidosis in the affected heterozygous girl. Phenotypic variability between
    patients carrying different NDUFA1 alleles was noted from the outset.
  evidence:
  - reference: PMID:17262856
    reference_title: "X-linked NDUFA1 gene mutations associated with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the X-linked NDUFA1 gene result in complex I defect and
      encephalomyopathy.
    explanation: >-
      States the causal link from gene to clinical syndrome.
  - reference: PMID:17262856
    reference_title: "X-linked NDUFA1 gene mutations associated with mitochondrial encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assembly/stability analysis might give an explanation for the different
      clinical phenotypes and become useful for future diagnostic purposes.
    explanation: >-
      Records the authors' proposal that assembly/stability differences underlie
      the phenotypic variability between alleles.

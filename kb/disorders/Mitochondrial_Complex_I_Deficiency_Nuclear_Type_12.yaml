        partial Complex I deficiency, which shows age-dependent neurodegeneration.
      explanation: >-
        Supports a neurodegenerative phenotype while making clear it is
        age-dependent, unlike the infantile human encephalopathy.
diagnosis:
- name: Respiratory Chain Enzymology on Muscle Biopsy
  description: >-
    Measurement of complex I amount and activity in skeletal muscle establishes
    the biochemical diagnosis of complex I deficiency, before any gene is
    implicated.
  evidence:
  - reference: PMID:21596602
    reference_title: "Heterozygous mutation in the X chromosomal NDUFA1 gene in a girl with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical investigations of a muscle biopsy revealed a deficiency in the
      amount and activity of complex I.
    explanation: >-
      Describes the biochemical diagnostic step.
- name: Whole Exome Sequencing after Negative mtDNA Analysis
  description: >-
    Complex I deficiency can arise from either genome. Where whole mitochondrial
    DNA sequencing is negative or identifies only a non-pathogenic variant, exome
    sequencing of the nuclear genes is what reaches an NDUFA1 diagnosis — and a
    molecular diagnosis is what makes accurate genetic counselling possible,
    which matters especially here given X-linked transmission.
  evidence:
  - reference: PMID:25356405
    reference_title: "New MT-ND6 and NDUFA1 mutations in mitochondrial respiratory chain disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing and a complementation study of the latter patient
      identified a novel c.55C>T hemizygous missense mutation in the
      nuclear-encoded gene NDUFA1.
    explanation: >-
      Documents the diagnostic route by which a nuclear NDUFA1 allele was reached
      after mtDNA analysis.
  - reference: PMID:25356405
    reference_title: "New MT-ND6 and NDUFA1 mutations in mitochondrial respiratory chain disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate that it is important to perform whole mtDNA
      sequencing rather than only typing reported mutations.
    explanation: >-
      Supports the sequencing strategy in which nuclear testing follows
      comprehensive mtDNA analysis.
discussions:
- discussion_id: mc1dn12_allele_specific_phenotype_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the degree of complex I assembly or stability failure explain why one
    NDUFA1 allele causes Leigh syndrome and another causes myoclonic epilepsy
    with developmental delay?
  attaches_to:
  - "pathophysiology#Complex I Assembly and Stability Failure"
  - "pathophysiology#Mitochondrial Encephalomyopathy"
  rationale: >-
    The two index hemizygous patients had clearly different neurological
    syndromes from different NDUFA1 missense alleles, and the reporting authors
    proposed that assembly and stability analysis might explain the difference
    and become diagnostically useful. That proposal has not been tested across an
    allelic series. It matters because complex I deficiency is genetically
    heterogeneous and clinically unpredictable, and a biochemical assay that
    predicted phenotype from allele would be prognostically valuable. The
    difficulty is that only a handful of NDUFA1 patients have been reported, so
    an allele-to-phenotype correlation cannot presently be powered from clinical
    data alone.
  proposed_experiments:
  - experiment_id: exp_mc1dn12_allelic_series_assembly
    name: Assembly and stability profiling across the NDUFA1 allelic series
    description: >-
      Express each reported NDUFA1 allele in a common cellular background and
      quantify assembled complex I, subcomplex distribution and holoenzyme
      turnover by blue native electrophoresis and pulse-chase, then test whether
      the resulting ranking corresponds to the reported clinical severity.
- discussion_id: mc1dn12_female_carrier_ascertainment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How often are heterozygous NDUFA1 female carriers affected, and should they
    be investigated rather than assumed to be unaffected carriers?
  attaches_to:
  - "pathophysiology#Skewed X-Inactivation in Heterozygous Females"
  rationale: >-
    Heterozygous females were initially assumed unaffected, and one affected girl
    with demonstrably skewed X-inactivation overturned that assumption. Because
    the skew is tissue-specific and was measured in the biopsied muscle, the
    relationship between a blood-derived X-inactivation result and disease risk in
    brain or muscle is unclear. The practical consequence is a counselling
    question with no evidence base: a carrier mother cannot currently be given a
    quantitative risk of manifesting, and a symptomatic female relative may be
    dismissed as a carrier. Systematic biochemical assessment of obligate carriers
    has not been reported.
  proposed_experiments:
  - experiment_id: exp_mc1dn12_carrier_female_biochemical_survey
    name: Biochemical and X-inactivation survey of obligate female carriers
    description: >-
      Assess obligate NDUFA1 carrier females with muscle respiratory chain
      enzymology, allele-specific expression in muscle, and X-inactivation
      analysis in both blood and muscle, to establish how often carriers manifest
      and whether an accessible tissue predicts the affected one.
- discussion_id: mc1dn12_mouse_model_phenotype_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can the Ndufa1 S55A mouse, whose neurodegeneration is age-dependent Purkinje
    cell loss, model a human disease that presents as infantile Leigh syndrome or
    myoclonic epilepsy?
  attaches_to:
  - "pathophysiology#Mitochondrial Encephalomyopathy"
  rationale: >-
    Evidence exists in the model, but its translational validity to the human
    phenotype is the open question. The mouse reproduces the biochemistry well —
    systemic partial complex I deficiency of about 50%, in an X-linked
    architecture matching the human gene — yet its neurological phenotype is
    late-onset cerebellar Purkinje degeneration, whereas the human disease is an
    infantile or early childhood encephalopathy with basal ganglia and brainstem
    involvement or with myoclonic seizures. The engineered S55A allele is also not
    a human patient allele. The model may therefore be a good platform for the
    metabolic consequences of MWFE dysfunction while being a poor one for the
    neuropathology that defines the disease.
  proposed_experiments:
  - experiment_id: exp_mc1dn12_patient_allele_knockin
    name: Knock-in of a human NDUFA1 patient allele
    description: >-
      Generate mice carrying the human p.Gly8Arg or p.Arg37Ser allele rather than
      S55A and characterize brain neuropathology, seizure susceptibility and age
      of onset, to test whether allele identity rather than species accounts for
      the phenotype mismatch.
notes: >-
  Scope and boundaries. This entry covers the NDUFA1-anchored member of the
  nuclear-type mitochondrial complex I deficiency series (MONDO:0026720). It is
  distinct from nuclear type 11 (a different gene, separately claimed as issue
  #9058) and from the mitochondrially encoded complex I deficiencies. There is
  no Mitochondrial_Complex_I_Deficiency grouping in the knowledge base at
  present; if one is created, this entry is a natural member, alongside the
  existing Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1 entry which served
  as the shape precedent here.

  What makes this entity distinctive. Two things. First, NDUFA1 is one of only
  two X-chromosomal nuclear genes among the 58 controlling complex I biogenesis,
  so this is an X-linked disorder inside a predominantly autosomal recessive
  series — and the male preponderance of earlier complex I cohorts is what led
  investigators to the X chromosome in the first place. Second, MWFE is an
  accessory rather than catalytic subunit, so the lesion is loss of assembled
  enzyme rather than a poisoned active site; that is why the diagnostic
  enzymology measures complex I amount as well as activity.

  The absent-subcomplex finding is load-bearing. Blue native electrophoresis
  showed reduced intact complex I with no accumulation of lower-molecular-weight
  subcomplexes. A curator extending this entry should not restate that as a
  simple assembly block: the absence of a stalled intermediate is what makes
  assembly failure and holoenzyme destabilization indistinguishable on current
  data, and the entry's node is worded to preserve that.

  Treatment. No treatments block is curated. Nothing disease-modifying is
  established for NDUFA1 complex I deficiency, and management is the supportive
  care given across mitochondrial disease; curating that here would add no
  disease-specific information.

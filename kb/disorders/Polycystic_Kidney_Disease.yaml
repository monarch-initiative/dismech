- name: Defective Polycystin-1 Maturation in the Endoplasmic Reticulum
  biological_scale: MOLECULAR
  description: >-
    Polycystin-1 is a membrane protein, and its production depends on the
    glycan-processing and chaperone machinery of the endoplasmic reticulum. The
    minor dominant cystic-kidney genes act here rather than on the polycystin
    complex itself: GANAB encodes the alpha subunit of glucosidase II, ALG5 adds
    glucose and ALG9 adds mannose to the assembling N-glycan precursor, and
    DNAJB11 is a co-factor of the ER chaperone BiP. Loss of any of them leaves
    less mature polycystin-1 to reach the cell surface and the cilium. The
    presentation recorded for this arm is kidneys that stay normal in size, few or
    no liver cysts, and late end-stage kidney disease, reached from age 62 onwards
    in the ALG5 series.

  review_notes: >-
    MONDO's text definition of MONDO:0033004 reads "A autosomal dominant
    polycystic kidney disease that has material basis in mutation in the PKD4
    gene". The class is nonetheless asserted as a child of MONDO:0009889
    autosomal recessive polycystic kidney disease, and its OWL causal-gene axiom
    is hgnc:9016 PKHD1. Its cross-references are OMIM:263200 and
    MEDGEN:1621793, and MedGen defines that concept with the GeneReviews text for
    autosomal recessive polycystic kidney disease - PKHD1. HGNC records PKD4 as an
    alias of PKD2 and returns no gene for it as an approved symbol. The binding here follows the axiom, the asserted parent and the OMIM
    cross-reference rather than the definition text.
- name: PKD5
  display_name: Polycystic kidney disease 5 (DZIP1L)
  subtype_term:
    preferred_term: polycystic kidney disease 5
    term:
      id: MONDO:0033281
      label: polycystic kidney disease 5
  description: >-
    The DZIP1L-defined form of autosomal recessive polycystic kidney disease.
    DZIP1L localizes to centrioles and to the distal ends of basal bodies and
    interacts with septin2, which maintains the periciliary diffusion barrier at
    the ciliary transition zone. So this form reaches the same ciliary endpoint as
    the PKHD1 form by a different route: translocation of polycystin-1 and
    polycystin-2 into the ciliary membrane is compromised. Reported patients had
    polycystic, enlarged kidneys with reduced cortico-medullary differentiation,
    arterial hypertension and end-stage renal disease, and there was limited
    evidence for a liver phenotype in the reported cohort.
  genes:
  - preferred_term: DZIP1L
    term:
      id: hgnc:26551
      label: DZIP1L
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28530676
    reference_title: "Mutations in DZIP1L, which encodes a ciliary-transition-zone protein, cause autosomal recessive polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe mutations in DZIP1L, which encodes DAZ interacting protein 1-like, in patients with ARPKD."
    explanation: >-
      The report that established a second gene for the recessive form, in
      patients ascertained with ARPKD.
  - reference: CGGV:assertion_f1e2d1d2-b77c-4f1a-b185-31e3a95aae9b-2024-03-29T160000.000Z
    reference_title: "DZIP1L / autosomal recessive polycystic kidney disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with homozygous DZIP1L pathogenic variants were reported to exhibit polycystic kidneys, enlarged kidneys, reduced cortico-medullary differentiation, arterial hypertension and end-stage renal disease. Of note, there was limited evidence for a liver phenotype in this cohort of ARPKD patients."
    explanation: >-
      ClinGen's evidence summary is the source for the renal presentation and for
      the weaker hepatic involvement stated in this row's description.
  review_notes: >-
    ClinGen curated DZIP1L against MONDO:0009889 rather than against
    MONDO:0033281, noting no difference in molecular mechanism or inheritance
    pattern from the PKHD1 form, which is why this row is declared a child of the
    ARPKD row rather than a sibling of it.

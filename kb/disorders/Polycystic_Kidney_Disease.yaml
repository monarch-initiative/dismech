  - reference: PMID:20301501
    reference_title: Autosomal Recessive Polycystic Kidney Disease – PKHD1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The molecular diagnosis of ARPKD-PKHD1 is established in a proband with suggestive findings and biallelic pathogenic variants in PKHD1 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews chapter for this form states the biallelic requirement,

  evidence:
  - reference: PMID:31395617
    reference_title: "ALG9 Mutation Carriers Develop Kidney and Liver Cysts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Dominantly inherited polycystic kidney and liver diseases on the ADPKD spectrum are also caused by mutations in at least six other genes required for protein biogenesis in the endoplasmic reticulum, the loss of which results in defective production of the PKD1 gene product, the membrane protein polycystin-1 (PC1)."
    explanation: >-
      States the node's thesis: a second class of dominant cystic-kidney genes
      acts on ER protein biogenesis and converges on reduced polycystin-1.
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Analysis of GANAB-null cells showed an absolute requirement of GIIα for maturation and surface and ciliary localization of the ADPKD proteins (PC1 and PC2), and reduced mature PC1 was seen in GANAB(+/-) cells."
    explanation: >-
      Null and heterozygous cell lines place the GANAB requirement at
      polycystin maturation and at surface and ciliary delivery.
  - reference: PMID:29706351
    reference_title: "Monoallelic Mutations to DNAJB11 Cause Atypical Autosomal-Dominant Polycystic Kidney Disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Characterization of DNAJB11-null cells and kidney samples from affected individuals revealed a pathogenesis associated with maturation and trafficking defects involving the ADPKD protein, PC1, and ADTKD proteins, such as UMOD."
    explanation: >-
      Null cells and patient kidney tissue locate the DNAJB11 defect at PC1
      maturation and trafficking.
  - reference: PMID:35896117
    reference_title: "Monoallelic pathogenic ALG5 variants cause atypical polycystic kidney disease and interstitial fibrosis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "We also show that ALG5 is required for PC1 maturation and membrane and ciliary localization and that heterozygous loss of ALG5 affects PC1 maturation."
    explanation: >-
      Shows the requirement holds at a single-allele dose, which is what makes
      the dominant inheritance of this arm coherent.
  - reference: PMID:31395617
    reference_title: "ALG9 Mutation Carriers Develop Kidney and Liver Cysts."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In vitro assays showed that inactivation of Alg9 results in impaired maturation and defective glycosylation of PC1."
    explanation: >-
      Ties the ALG9 arm to the same readout, and to the glycosylation step the
      N-linked glycosylation binding on this node asserts.
  - reference: PMID:35896117
    reference_title: "Monoallelic pathogenic ALG5 variants cause atypical polycystic kidney disease and interstitial fibrosis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentation was consistent in the 23 affected members, with non-enlarged cystic kidneys and few or no liver cysts; 8 subjects reached end-stage kidney disease from 62 to 91 years of age."
    explanation: >-
      Source for the milder, later presentation this node's description
      attributes to the ER arm.
  downstream:
  - target: Ciliary Dysfunction
    causal_link_type: DIRECT
    description: >-
      Failure of polycystin-1 maturation in the ER is upstream of the ciliary
      defect: surface and ciliary localization of polycystin-1 depends on ER
      processing, and restoring that processing restores the localization.
    evidence:
    - reference: PMID:27259053
      reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "PC1 surface localization in GANAB(-/-) cells was rescued by wild-type, but not mutant, GIIα."
      explanation: >-
        Rescue by wild-type but not mutant glucosidase II establishes the
        direction of the link from ER processing to polycystin delivery.
- name: Ciliary Dysfunction
  conforms_to: "ciliopathy_dysfunction#Renal Tubular Cystic and Fibrotic Disease"
  description: >
    Primary cilia act as mechanosensors in renal tubular epithelial cells.
    Polycystin dysfunction impairs ciliary signaling, disrupting normal tubular
    architecture and promoting cyst formation through increased cAMP signaling.
    Cilium-dependent planar cell polarity (PCP) signaling further maintains
    tubular geometry via oriented cell division; its disruption drives tubular
    dilatation and cystogenesis, placing PKD within the renal cystic-fibrotic
    arm of the ciliopathies.
  evidence:
  - reference: PMID:24162855
    reference_title: "Wnt and planar cell polarity signaling in cystic renal disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PC-1 is a membrane receptor that localizes to the primary cilium in renal epithelial cells"
    explanation: Review establishes that polycystin-1 localizes to the primary cilium in renal epithelial cells, directly linking ciliary dysfunction to ADPKD pathogenesis.
  - reference: PMID:24162855
    reference_title: "Wnt and planar cell polarity signaling in cystic renal disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The localization of the PC-1/PC-2 complex in the primary cilium is proposed to be crucial for its function as a mechanosensory antenna of fluid flow in the kidney."
    explanation: Review describes the polycystin complex as a ciliary mechanosensor, supporting the ciliary dysfunction mechanism in PKD.
  - reference: PMID:24162855
    reference_title: "Wnt and planar cell polarity signaling in cystic renal disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "disruption of OCD resulted in dilated tubules and/or cystic kidneys in a number of animal models"
    explanation: Loss of cilium/PCP-dependent oriented cell division causes tubular dilatation and cystic kidneys in animal models, mechanistically linking ciliary dysfunction to cystogenesis and supporting conformance to the ciliopathy renal cystic-fibrotic module node.
  - reference: PMID:37905714
    reference_title: "The molecular structure and function of fibrocystin, the key gene product implicated in autosomal recessive polycystic kidney disease (ARPKD)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease is almost always caused by variations in the polycystic kidney and hepatic disease 1 gene, which encodes fibrocystin (FC), a very large, single-pass transmembrane glycoprotein found in primary cilia, urine and urinary exosomes."
    explanation: >-
      Places the PKHD1 product at the primary cilium, which is what puts the
      recessive form on this node alongside the polycystins.
  - reference: PMID:28530676
    reference_title: "Mutations in DZIP1L, which encodes a ciliary-transition-zone protein, cause autosomal recessive polycystic kidney disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In agreement with a defect in the diffusion barrier, we found that the ciliary-membrane translocation of the PKD proteins polycystin-1 and polycystin-2 is compromised in DZIP1L-mutant cells."
    explanation: >-
      DZIP1L-mutant cells fail to deliver polycystin-1 and polycystin-2 to the
      ciliary membrane, which is this node's defect reached from the transition
      zone.
  - reference: PMID:40972705
    reference_title: "Monoallelic IFT140 Variants Causing Childhood-Onset Autosomal Dominant Polycystic Kidney Disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "IFT140 is a component of the intraflagellar transport-complex A involved in retrograde ciliary trafficking of proteins into primary cilia."
    explanation: >-
      Identifies IFT140 as ciliary transport machinery, so its cystic phenotype
      belongs on this node rather than on the ER-maturation node.
  - reference: PMID:41720266
    reference_title: Disruption of the human cystin-1 myristoyl-electrostatic switch causes polycystic
      kidney disease that phenocopies autosomal recessive polycystic kidney disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Cys1 encodes cystin, a myristoylated protein that traffics to the primary cilium and nucleus."
    explanation: >-
      Identifies the CYS1 product as a ciliary protein. The gene-disease
      relationship itself is graded Limited by ClinGen, which the genetic section
      records.

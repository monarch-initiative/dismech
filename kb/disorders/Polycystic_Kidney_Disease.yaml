  - reference: PMID:28530676
    reference_title: "Mutations in DZIP1L, which encodes a ciliary-transition-zone protein, cause autosomal recessive polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Autosomal recessive polycystic kidney disease (ARPKD), usually considered to be a genetically homogeneous disease caused by mutations in PKHD1, has been associated with ciliary dysfunction."

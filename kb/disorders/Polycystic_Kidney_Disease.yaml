- name: PKD4
  display_name: Polycystic kidney disease 4 (PKHD1)
  subtype_term:
    preferred_term: polycystic kidney disease 4
    term:
      id: MONDO:0033004
      label: polycystic kidney disease 4
  description: >-
    The PKHD1-defined form of autosomal recessive polycystic kidney disease, and
    the form that accounts for most of it. Biallelic loss of function
    removes fibrocystin, a transmembrane glycoprotein of the primary cilium,
    from collecting-duct epithelium; the hepatic component is a ductal plate
    malformation producing congenital hepatic fibrosis.

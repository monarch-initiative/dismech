name: ACTA1-Related Nemaline Myopathy
creation_date: '2026-09-26T00:00:00Z'
category: Mendelian
description: >
  ACTA1-related nemaline myopathy is a congenital myopathy caused by pathogenic
  variants in ACTA1, encoding skeletal muscle alpha-actin, the principal thin
  filament protein of the sarcomere. Mutant alpha-actin disrupts thin filament
  assembly and actin polymerization, producing nemaline rods and weakness.
disease_term:
  preferred_term: ACTA1 nemaline myopathy
  term:
    id: MONDO:0008070
    label: congenital myopathy 2a, typical, autosomal dominant

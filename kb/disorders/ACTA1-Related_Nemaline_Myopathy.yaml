name: ACTA1-Related Nemaline Myopathy
creation_date: '2026-09-26T00:00:00Z'
category: Mendelian
description: >
  ACTA1-related nemaline myopathy (NEM3; OMIM 161800, renamed congenital myopathy 2A
  in OMIM's CMYO series) is a congenital myopathy caused by pathogenic variants in
  ACTA1, which encodes skeletal muscle alpha-actin, the principal protein of the
  sarcomeric thin filament. About 90% of ACTA1 variants act dominantly and most arise
  de novo; the remaining ~10% are genetic or functional null alleles causing recessive
  disease. In dominant disease the mutant actin is translated and incorporated into the
  thin filament as a "poison" peptide, disrupting actin-tropomyosin interaction,
  sarcomere organisation and force generation, and producing the Z-disk-derived
  nemaline rods that name the disease. ACTA1 is the second most common cause of
  nemaline myopathy after nebulin and is over-represented among severe congenital
  cases, which present at birth with profound hypotonia, bulbar and respiratory
  muscle weakness, feeding failure, and death in the first year from respiratory
  insufficiency. Milder childhood- and adult-onset presentations compatible with
  independent ambulation and normal lifespan occur with the same gene, sometimes
  within one family.
synonyms:
- ACTA1 nemaline myopathy
- NEM3
- nemaline myopathy type 3
- CMYO2A
- congenital myopathy 2a, typical, autosomal dominant
disease_term:
  preferred_term: ACTA1 nemaline myopathy
  term:
    id: MONDO:0008070
    label: congenital myopathy 2a, typical, autosomal dominant
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008070
      label: congenital myopathy 2a, typical, autosomal dominant
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >
      Primary MONDO identifier for this entry. MONDO:0008070 is the MONDO class for
      OMIM 161800 (NEM3 / CMYO2A); its textual definition is gene-level ("An inherited
      myopathy caused by mutations in the ACTA1 gene"), and MONDO files it beneath four
      severity bands of nemaline myopathy at once, which is the scope this entry takes.
  - term:
      id: MONDO:0100084
      label: alpha-actinopathy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      alpha-actinopathy is MONDO's umbrella for the whole ACTA1 phenotypic spectrum,
      including the non-nemaline histologies (actin filament aggregate myopathy,
      congenital fibre-type disproportion, core-like areas, cap myopathy, zebra body
      myopathy) that this entry does not cover.
  - term:
      id: MONDO:0018958
      label: nemaline myopathy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      The genetically heterogeneous parent disease curated at
      kb/disorders/Nemaline_Myopathy.yaml, which cuts the same patients on the
      severity axis rather than the gene axis.
parents:
- Nemaline Myopathy
- Congenital Structural Myopathy
- Thin Filament Myopathy
references:
- reference: PMID:20301465
  title: "Nemaline Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
  tags:
  - GeneReviews
  findings:
  - statement: >
      The only GeneReviews chapter covering this disease has been retired, so there is
      no current GeneReviews phenotype baseline for nemaline myopathy. The archived
      chapter is still the source of the six-category ENMC clinical classification, the
      surveillance schedule and the neuromuscular-blocking-agent warning quoted in this
      entry, and its content is disease-wide rather than ACTA1-specific.
    supporting_text: "NOTE: THIS PUBLICATION HAS BEEN RETIRED. THIS ARCHIVAL VERSION IS FOR HISTORICAL REFERENCE ONLY, AND THE INFORMATION MAY BE OUT OF DATE."
notes: >
  Lump/split decision. MONDO:0008070 was bound nowhere in kb/ before this entry, and
  it does not fit the axis kb/disorders/Nemaline_Myopathy.yaml already uses: that entry
  splits nemaline myopathy by clinical severity (severe congenital, typical,
  childhood-onset, adult-onset), while MONDO:0008070 is defined by its gene and is
  filed by MONDO beneath four of those severity bands simultaneously. Orphanet records
  the same crossing from the other direction: both ORPHA:171430 (severe congenital
  nemaline myopathy) and ORPHA:171436 (typical nemaline myopathy) list OMIM:161800 —
  the OMIM entry this MONDO class represents — as a *Broader* cross-reference. A gene
  row cannot be added to a severity-axis has_subtypes list without mixing two axes in
  one list, so this is curated as a separate gene-defined Disease entry that
  cross-references the severity entry through mappings and `parents`, following the
  pattern dismech already uses for gene-defined Mendelian entries. Two alternatives
  were weighed and rejected. (1) A has_subtypes row on Nemaline_Myopathy.yaml: rejected
  for the axis-mixing reason above. (2) Recording MONDO:0008070 only as a
  skos:narrowMatch on Nemaline_Myopathy.yaml, which was proposed in the claim issue
  thread: rejected because a narrowMatch mapping retires the concept from the curation
  queue (see CLAUDE.md, "Ontology Term Contract") while adding no ACTA1-specific
  pathograph, and the ACTA1 mechanism is not a severity variant of the parent entry's
  mechanism — the parent's causal chain is gene-agnostic thin-filament dysfunction,
  whereas dominant ACTA1 disease is a poison-peptide mechanism with a distinct
  recurrence risk, a distinct histological signature, and distinct experimental
  therapies. Nemaline_Myopathy.yaml was deliberately not edited in the same change.

  Scope. This entry covers nemaline myopathy caused by ACTA1. It does not cover the
  other congenital myopathies ACTA1 causes — actin filament aggregate (actin
  accumulation) myopathy, congenital fibre-type disproportion, and myopathy with
  core-like areas — even though the curation stub's synonym list mixed those names in,
  because they inherit the legacy OMIM 161800 synonym set. Those histologies sit under
  MONDO:0100084 alpha-actinopathy, recorded above as a broadMatch. Intranuclear rod
  myopathy is treated as in scope, because Laing et al. describe it as a variant of
  nemaline myopathy rather than a separate histology. The boundary is genuinely soft:
  the same review argues these entities may be a continuum and that single biopsies
  frequently show several of them at once.

  OMIM has since split ACTA1 disease three ways — CMYO2A (161800, typical, autosomal
  dominant, the class this entry is anchored on), CMYO2B (620265, severe infantile,
  autosomal recessive) and CMYO2C (620278, severe infantile, autosomal dominant).
  MONDO carries CMYO2B and CMYO2C as MONDO:0859517 and MONDO:0859523 but places
  neither under alpha-actinopathy or nemaline myopathy, so MONDO's own graph does not
  connect them to ACTA1. They are therefore left unmapped here rather than asserted as
  subtypes of this entry on an unsourced gene attribution; the severity-and-inheritance
  strata that this entry does model are recorded in has_subtypes on the inheritance
  axis instead.

  Evidence gaps. No population prevalence figure for ACTA1-related nemaline myopathy
  specifically could be sourced, so no `prevalence` block is recorded; the per-gene
  share of nemaline myopathy cohorts is captured in `genetic[].case_fractions`
  instead. Several phenotype frequencies come from mixed-genotype nemaline myopathy
  cohorts (Ryan 2001, Amburgey 2021) rather than ACTA1-only series, and each such
  evidence item says so in its `explanation`.
inheritance:
- name: Autosomal Dominant
  description: >
    About 90% of ACTA1 variants cause dominant disease, and most affected individuals
    are simplex cases carrying a de novo missense variant that is absent from parental
    blood. Recurrence in a sibship after an apparently de novo variant is a real risk
    because parental somatic and germline mosaicism has been documented, and a mildly
    affected or asymptomatic mosaic parent may carry the same allele that is lethal in
    the proband. Expressivity is variable: age at onset and severity differ markedly
    between carriers of the same variant, including between affected members of one
    family, so ACTA1 genotype alone does not predict the clinical course.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: '84% of sporadic patients with parental testing available'
  expressivity: VARIABLE
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most mutations are dominant and most patients have de novo mutations not present in the peripheral blood DNA of either parent. Only 10% of mutations are recessive and they are genetic or functional null mutations."
    explanation: States the dominant/recessive split and the predominance of de novo dominant variants.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where DNA has been available for testing from the parents of sporadic patients, 79/94 or 84% had de novo dominant mutations not present in the peripheral blood DNA of either parent, while only 16% had recessive ACTA1 mutations."
    explanation: Source of the 0.84 de novo rate recorded on this inheritance block.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There have been a number of instances where a severely affected proband was identified, and mildly affected or asymptomatic family members were found to carry the same dominant mutation. In at least three cases this can be explained by somatic mosaicism in one parent of a severely affected patient"
    explanation: Supports the parental-mosaicism recurrence risk that qualifies an apparently de novo result in counselling.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations appeared de novo and represent new dominant mutations. One proband subsequently had two affected children, a result consistent with autosomal dominant transmission."
    explanation: Documents vertical transmission from a proband whose own variant arose de novo, i.e. the 50% offspring risk that follows a dominant ACTA1 allele.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was marked variation in both age at onset and clinical severity in the three affected members of one family."
    explanation: Documents the intrafamilial variability recorded in the expressivity field.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intrafamilial variability suggests that alpha-actin genotype is not the sole determinant of phenotype."
    explanation: States that ACTA1 genotype does not determine phenotype, which is why a mildly affected parent's allele can be severe in a child.
- name: Autosomal Recessive
  description: >
    Roughly 10% of ACTA1 variants cause recessive disease. These are nonsense,
    frameshift or splice-site alleles, or one of four buried missense changes shown to
    be functional nulls, so affected individuals have no functional skeletal muscle
    alpha-actin. Heterozygous parents and siblings are clinically unaffected, and the
    sibling recurrence risk is 25%.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most recessive ACTA1 mutations are nonsense, frameshift or splice-site mutations, and are predicted to cause premature termination of translation, or the omission of entire exons from the mRNA, leading to absence of skeletal α-actin protein"
    explanation: Establishes the null-allele basis of recessive ACTA1 disease.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutation carriers (parents or siblings of patients with recessive ACTA1 mutations) were clinically unaffected, suggesting that expression from one intact copy of ACTA1 is sufficient for normal function"
    explanation: Supports unaffected-carrier status of heterozygous parents, and so a 25% sibling recurrence risk in recessive families.
has_subtypes:
- name: Dominant
  display_name: Dominant (poison mutant actin) ACTA1 disease
  description: >
    Approximately 90% of ACTA1 disease. A heterozygous, usually de novo, missense
    variant is expressed and the mutant protein is incorporated into the thin filament
    alongside wild-type alpha-actin, so the mechanism is a dominant-negative or "poison
    peptide" one rather than haploinsufficiency. Severity ranges from lethal neonatal
    disease to mild childhood-onset weakness and depends in part on the proportion of
    mutant protein present.
  evidence:
  - reference: PMID:22825594
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 200 different ACTA1 mutations have been identified, with 90 % resulting in dominant disease and 10 % resulting in recessive disease."
    explanation: Quantifies the dominant share of ACTA1 disease that defines this subtype.
  - reference: PMID:23736297
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dominant ACTA1 disease is caused by the presence of 'poison' mutant actin protein."
    explanation: States the poison-peptide mechanism that distinguishes this subtype from the recessive one.
- name: Recessive
  display_name: Recessive (null) ACTA1 disease
  description: >
    Approximately 10% of ACTA1 disease, caused by biallelic genetic or functional null
    alleles, so no functional skeletal muscle alpha-actin is made. Cardiac alpha-actin,
    which is 99% identical and is the predominant sarcomeric actin in fetal muscle,
    persists postnatally in these patients and is the basis of the isoform-replacement
    therapeutic strategy.
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with recessive ACTA1 disease therefore lack functional skeletal muscle α-actin"
    explanation: Defines this subtype as complete absence of functional skeletal muscle alpha-actin.
  - reference: PMID:23736297
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cardiac α-actin is 99% identical to skeletal muscle α-actin and the predominant actin isoform in fetal muscle."
    explanation: Supports the cardiac alpha-actin substitution rationale specific to the null subtype.
pathophysiology:
- name: ACTA1 Variant in Skeletal Muscle Alpha-Actin
  description: >
    A pathogenic variant in ACTA1 alters skeletal muscle alpha-actin, the predominant
    actin isoform of the adult sarcomeric thin filament. The gene is small — six coding
    exons over 2.8 kb — and variants are distributed across all of them without
    hotspots, so essentially any coding residue may be involved. The overwhelming
    majority are missense changes at residues conserved across the actin family.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: DOMINANT_NEGATIVE
    description: >
      Most dominant ACTA1 variants are de novo missense changes and act as
      dominant-negative "poison" alleles; the minority recessive alleles are instead
      genetic or functional nulls and are modelled by the separate node below.
  genes:
  - preferred_term: ACTA1
    term:
      id: hgnc:129
      label: ACTA1
  molecular_functions:
  - preferred_term: actin filament binding
    modifier: DYSREGULATED
    term:
      id: GO:0051015
      label: actin filament binding
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ACTA1 gene encodes skeletal muscle alpha-actin, which is the predominant actin isoform in the sarcomeric thin filaments of adult skeletal muscle, and essential, along with myosin, for muscle contraction."
    explanation: Establishes the gene product and its sarcomeric role, which is what the variant perturbs.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 177 mutations comprise 157 missense, 5 nonsense, 5 frameshift and 4 splice site mutations, 1 in-frame duplication, 1 insertion of a single amino-acid, 1 in-frame single amino-acid deletion and 3 mutations of the normal stop codon."
    explanation: Documents the predominance of missense alleles in the ACTA1 variant spectrum.
  downstream:
  - target: Incorporation of Mutant Alpha-Actin into the Thin Filament
    causal_link_type: DIRECT
    description: >
      The mutant allele is transcribed and translated, and the mutant protein enters
      the sarcomere rather than being degraded.
    evidence:
    - reference: PMID:17387733
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mass spectrometry and two-dimensional gel electrophoresis demonstrate that mutant actin accounts for 25 and 50% of alpha-skeletal actin in the skeletal muscle of patients with the P332S and D292V mutations, respectively, consistent with a dominant-negative disease mechanism."
      explanation: Directly measures mutant protein in patient muscle, establishing that the variant produces incorporated mutant actin.
- name: Incorporation of Mutant Alpha-Actin into the Thin Filament
  description: >
    Mutant alpha-actin polymerises into F-actin together with wild-type protein and is
    incorporated into the thin filament, where it acts as a poison peptide. In patient
    muscle the mutant species accounts for a quarter to a half of total alpha-skeletal
    actin, and the severity of dominant disease tracks with how much mutant protein is
    present.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACTA1
    term:
      id: hgnc:129
      label: ACTA1
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: DYSREGULATED
    term:
      id: GO:0030041
      label: actin filament polymerization
  evidence:
  - reference: PMID:23736297
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dominant ACTA1 disease is caused by the presence of 'poison' mutant actin protein."
    explanation: States the poison-peptide model for this node.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In skeletal muscle, actin function depends on the balance between monomeric G-actin (globular) and filamentous F-actin, a polymer of G-actin subunits. F-actin, together with tropomyosin, troponin, and nebulin, forms the thin filaments of the skeletal-muscle contractile apparatus."
    explanation: Describes the polymerisation step and thin-filament assembly that the mutant protein enters.
  downstream:
  - target: Defective Actin-Tropomyosin Interaction and Sarcomeric Disorganisation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17387733
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In vitro motility studies indicate that abnormal interactions between actin and tropomyosin are the likely principal cause of muscle weakness for D292V, with tropomyosin stabilized in the "switched off" position.'
      explanation: In vitro motility data link incorporated mutant actin to a specific defect in actin-tropomyosin regulation.
  - target: Nemaline Rod Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17387733
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We raise the possibility that the presence or absence of structural disorganization when mutant actin incorporates into sarcomeres may be an important determinant of whether the histological patterns of CFTD or NM develop in ACTA1 myopathy."
      explanation: Proposes that whether incorporated mutant actin disorganises the sarcomere determines whether rods form at all, which is the edge asserted here.
- name: Absence of Functional Skeletal Muscle Alpha-Actin
  description: >
    In recessive ACTA1 disease no functional skeletal muscle alpha-actin is produced.
    The sarcomere is not poisoned by an abnormal protein but is deprived of its
    principal thin-filament subunit, and cardiac alpha-actin — normally downregulated
    late in the second trimester — is the isoform available to substitute for it.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACTA1
    term:
      id: hgnc:129
      label: ACTA1
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most recessive ACTA1 mutations are nonsense, frameshift or splice-site mutations, and are predicted to cause premature termination of translation, or the omission of entire exons from the mRNA, leading to absence of skeletal α-actin protein"
    explanation: Establishes absence of the protein as the recessive mechanism.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although skeletal muscle α-actin is the predominant isoform in adult skeletal muscle, cardiac α-actin (the major actin isoform expressed in the adult heart) is the major actin expressed in skeletal muscle during early gestation, but is downregulated late in the second trimester, and usually at negligible levels by birth"
    explanation: Supports the developmental isoform switch that leaves the null sarcomere without a substitute after birth.
  downstream:
  - target: Defective Actin-Tropomyosin Interaction and Sarcomeric Disorganisation
    causal_link_type: DIRECT
    description: >
      Loss of the principal thin-filament subunit converges on the same contractile
      failure the poison-peptide route produces, by a different molecular route.
- name: Defective Actin-Tropomyosin Interaction and Sarcomeric Disorganisation
  description: >
    Abnormal actin-tropomyosin interaction leaves tropomyosin stabilised over the
    myosin-binding site, and in the more severely affected fibres the sarcomeric
    lattice itself is disorganised, with whorled thin filaments, myofibrillar
    disruption and mislocalised sarcomeric actin. Severity of the structural
    disorganisation, rather than the number of rods, is what tracks with the lethal
    phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: DECREASED
    term:
      id: GO:0045214
      label: sarcomere organization
  - preferred_term: muscle filament sliding
    modifier: DECREASED
    term:
      id: GO:0030049
      label: muscle filament sliding
  evidence:
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of fibers with rods did not correlate with clinical severity; however, the severe, lethal phenotype was associated with both severe, generalized disorganization of sarcomeric structure and abnormal localization of sarcomeric actin."
    explanation: Establishes sarcomeric disorganisation rather than rod burden as the correlate of severity.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common pathological features included abnormal fiber type differentiation, glycogen accumulation, myofibrillar disruption, and \"whorling\" of actin thin filaments."
    explanation: Documents the thin-filament and myofibrillar disorganisation described by this node.
  downstream:
  - target: Reduced Skeletal Muscle Force Generation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17387733
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'In vitro motility studies indicate that abnormal interactions between actin and tropomyosin are the likely principal cause of muscle weakness for D292V, with tropomyosin stabilized in the "switched off" position.'
      explanation: Names the actin-tropomyosin defect as the principal cause of weakness, which is this edge.
- name: Nemaline Rod Formation
  description: >
    Nemaline bodies are rod-shaped aggregates that arise from the sarcomeric Z-disk and
    are rich in alpha-actinin. In ACTA1 disease they may be sarcoplasmic, intranuclear,
    or both; intranuclear rod myopathy is a variant of nemaline myopathy defined by rods
    inside myonuclei and is often, though not always, severe. Rod burden does not
    predict clinical severity, so this node is the diagnostic lesion rather than a step
    on the causal path to weakness.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nemaline bodies (rods) are clearly detectable at the light-microscopy (LM) level, and, ultrastructurally, they originate from the Z-disks of the sarcomeres. One of the main components of rods is α-actinin 2, an actin-binding protein that localizes to the Z-disk"
    explanation: Establishes the Z-disk origin and alpha-actinin composition of the rods.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intranuclear rod myopathy is a variant of nemaline myopathy characterised histologically by rod-like bodies in the nuclei of muscle fibres"
    explanation: Supports treating intranuclear rod myopathy as in scope for this entry rather than as a separate ACTA1 entity.
  downstream:
  - target: Nemaline Bodies on Muscle Biopsy
    causal_link_type: DIRECT
    description: Rod formation is what the diagnostic biopsy finding observes.
- name: Reduced Skeletal Muscle Force Generation
  description: >
    The functional endpoint of both molecular routes is loss of contractile force. In
    the Acta1 p.Asp286Gly mouse, which carries a patient-derived dominant variant,
    contractile capacity at submaximal stimulation frequencies is reduced and can be
    pharmacologically increased with a fast skeletal troponin activator, which
    identifies reduced thin-filament calcium sensitivity as a tractable component of
    the deficit.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle contraction
    modifier: DECREASED
    term:
      id: GO:0003009
      label: skeletal muscle contraction
  evidence:
  - reference: PMID:38376469
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute and long-term tirasemtiv treatment significantly increased muscle contractile capacity at submaximal stimulation frequencies in both fast-twitch extensor digitorum longus and gastrocnemius muscle, and intermediate-twitch diaphragm muscle in vitro and in vivo."
    explanation: Demonstrates a reversible submaximal force deficit in a patient-variant mouse model of this node.
  downstream:
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Proximal Muscle Weakness
    causal_link_type: DIRECT
  - target: Facial Muscle Weakness
    causal_link_type: DIRECT
  - target: Neck Flexor Weakness
    causal_link_type: DIRECT
  - target: Respiratory Muscle Weakness and Ventilatory Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11558787
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thirty patients died, the majority during the first 12 months of life. All deaths were due to respiratory insufficiency, which was frequently underrecognized in older patients."
      explanation: Establishes respiratory muscle failure as the lethal consequence of the contractile deficit in a nemaline myopathy cohort that includes ACTA1 patients.
  - target: Bulbar Weakness and Feeding Difficulty
    causal_link_type: DIRECT
  - target: Motor Developmental Delay
    causal_link_type: DIRECT
- name: Respiratory Muscle Weakness and Ventilatory Failure
  description: >
    Weakness of the diaphragm, intercostal and accessory muscles produces neonatal
    respiratory distress in severe disease and nocturnal hypoventilation, restrictive
    lung disease and recurrent lower respiratory tract infection later. Respiratory
    failure is the cause of death in nemaline myopathy and is frequently
    under-recognised in older patients whose limb strength appears stable.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-five patients had significant respiratory disease during the first year of life, and 79 had feeding difficulties."
    explanation: Quantifies first-year respiratory morbidity in a 143-patient nemaline myopathy cohort.
  downstream:
  - target: Respiratory Insufficiency Due to Muscle Weakness
    causal_link_type: DIRECT
  - target: Neonatal Respiratory Distress
    causal_link_type: DIRECT
- name: Bulbar Weakness and Feeding Difficulty
  description: >
    Weakness of the facial, palatal, pharyngeal and tongue musculature impairs suck and
    swallow from birth, causing feeding failure, aspiration risk and poor weight gain.
    Bulbar function is abnormal in essentially every patient formally examined, and
    feeding morbidity, like respiratory infection morbidity, tends to diminish with age
    in survivors.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:33397769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Last, bulbar function was abnormal in all patients examined, as determined with a novel outcome measure."
    explanation: Establishes near-universal bulbar involvement on formal assessment in a nemaline myopathy cohort including 18 ACTA1 patients.
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morbidity from respiratory tract infections and feeding difficulties frequently diminished with increasing age."
    explanation: Supports the age-related improvement in feeding morbidity described by this node.
  downstream:
  - target: Feeding Difficulties
    causal_link_type: DIRECT
  - target: Bulbar Palsy
    causal_link_type: DIRECT
phenotypes:
- category: Musculoskeletal
  name: Hypotonia
  frequency: VERY_FREQUENT
  description: >
    Reduced muscle tone, presenting as a floppy infant in congenital-onset disease and
    accompanied by depressed or absent deep tendon reflexes.
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nemaline myopathy (referred to in this entry as NM) is characterized by weakness, hypotonia, and depressed or absent deep tendon reflexes."
    explanation: GeneReviews chapter establishing hypotonia as a cardinal feature of nemaline myopathy.
- category: Musculoskeletal
  name: Proximal Muscle Weakness
  frequency: VERY_FREQUENT
  description: >
    Weakness predominantly affects proximal limb musculature, and is typically most
    severe in the face, neck flexors and proximal limbs. Distribution is proximal
    rather than distal at presentation.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The weakness typically affects proximal musculature, with variable involvement of the facial, bulbar, and respiratory muscles. Cardiac muscle is usually spared."
    explanation: States the proximal distribution of weakness, and the usual sparing of cardiac muscle.
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness is usually most severe in the face, the neck flexors, and the proximal limb muscles."
    explanation: GeneReviews statement of the weakness distribution.
- category: Musculoskeletal
  name: Facial Muscle Weakness
  frequency: FREQUENT
  description: >
    Weakness of the facial musculature contributes to the elongated, expressionless
    myopathic facies and to impaired suck in infancy.
  phenotype_term:
    preferred_term: Weakness of facial musculature
    term:
      id: HP:0030319
      label: Weakness of facial musculature
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness is usually most severe in the face, the neck flexors, and the proximal limb muscles."
    explanation: Names the face as one of the most severely affected regions.
- category: Musculoskeletal
  name: Neck Flexor Weakness
  frequency: FREQUENT
  description: >
    Marked neck flexor weakness, with head lag on pull-to-sit in infancy, is
    characteristic of the congenital myopathies and of nemaline myopathy in particular.
  phenotype_term:
    preferred_term: Neck flexor weakness
    term:
      id: HP:0003722
      label: Neck flexor weakness
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness is usually most severe in the face, the neck flexors, and the proximal limb muscles."
    explanation: Names the neck flexors as one of the most severely affected muscle groups.
- category: Respiratory
  name: Respiratory Insufficiency Due to Muscle Weakness
  frequency: FREQUENT
  description: >
    Restrictive respiratory failure from weakness of the diaphragm and chest wall
    muscles. It is the cause of death in nemaline myopathy, and abnormal pulmonary
    function is common even among ambulant survivors, so it is under-recognised if
    sought only when a patient is symptomatic.
  phenotype_term:
    preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients died, the majority during the first 12 months of life. All deaths were due to respiratory insufficiency, which was frequently underrecognized in older patients."
    explanation: Establishes respiratory insufficiency as the universal cause of death in a mixed-genotype nemaline myopathy cohort in which 22 patients carried ACTA1 variants.
  - reference: PMID:33397769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 27 individuals completing PFTs, abnormal values were observed in 65%."
    explanation: Quantifies abnormal pulmonary function in a cross-sectional nemaline myopathy cohort including 18 ACTA1 patients.
- category: Respiratory
  name: Neonatal Respiratory Distress
  frequency: FREQUENT
  subtype: Dominant
  description: >
    Severe congenital ACTA1 disease presents at birth with respiratory distress
    requiring immediate support. Neonatal respiratory failure, together with
    arthrogryposis and failure to achieve early motor milestones, is one of the
    features associated with death in the first year.
  phenotype_term:
    preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seven patients exhibited marked clinical variability, ranging from severe congenital-onset weakness, with death from respiratory failure during the 1st year of life, to a mild childhood-onset myopathy, with survival into adulthood."
    explanation: Documents neonatal-onset respiratory failure at the severe end of the ACTA1 dominant spectrum described in this subtype.
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe neonatal respiratory disease and the presence of arthrogryposis multiplex congenita are associated with death in the first year of life."
    explanation: Establishes neonatal respiratory disease as a prognostic marker of first-year mortality.
- category: Gastrointestinal
  name: Feeding Difficulties
  frequency: FREQUENT
  description: >
    Impaired suck and swallow from birth, often requiring nasogastric or gastrostomy
    feeding. Feeding difficulty affected 79 of 143 patients in the largest clinical
    series, and tends to improve with age in survivors.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-five patients had significant respiratory disease during the first year of life, and 79 had feeding difficulties."
    explanation: Quantifies feeding difficulty in the 143-patient nemaline myopathy series.
- category: Neurologic
  name: Bulbar Palsy
  frequency: FREQUENT
  description: >
    Weakness of the bulbar musculature affecting speech, swallow and airway protection.
    It was abnormal in every patient formally assessed in a cross-sectional nemaline
    myopathy cohort, which makes it a required element of assessment rather than an
    occasional complication.
  phenotype_term:
    preferred_term: Bulbar palsy
    term:
      id: HP:0001283
      label: Bulbar palsy
  evidence:
  - reference: PMID:33397769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Last, bulbar function was abnormal in all patients examined, as determined with a novel outcome measure."
    explanation: Documents universal bulbar abnormality on formal testing in a cohort including 18 ACTA1 patients.
- category: Musculoskeletal
  name: Nemaline Bodies on Muscle Biopsy
  frequency: OBLIGATE
  diagnostic: true
  description: >
    Rod-shaped structures on Gomori trichrome staining of muscle, the defining
    histological lesion. Their presence is what makes the diagnosis nemaline myopathy
    rather than another ACTA1 congenital myopathy; their number does not predict
    severity.
  phenotype_term:
    preferred_term: Nemaline bodies
    term:
      id: HP:0003798
      label: Nemaline bodies
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on clinical findings and the observation of characteristic rod-shaped structures (nemaline bodies) on muscle biopsy stained with Gomori trichrome."
    explanation: Establishes nemaline bodies as the defining diagnostic lesion.
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of fibers with rods did not correlate with clinical severity"
    explanation: Supports the statement that rod burden is not a severity marker.
- category: Neurologic
  name: Hyporeflexia
  frequency: FREQUENT
  description: >
    Deep tendon reflexes are depressed or absent, which helps separate a congenital
    myopathy from a central cause of neonatal hypotonia at the bedside.
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nemaline myopathy (referred to in this entry as NM) is characterized by weakness, hypotonia, and depressed or absent deep tendon reflexes."
    explanation: States depressed or absent reflexes as a cardinal feature.
- category: Musculoskeletal
  name: Arthrogryposis Multiplex Congenita
  frequency: OCCASIONAL
  subtype: Dominant
  description: >
    Multiple congenital contractures from reduced fetal movement, seen in a minority of
    patients and, with neonatal respiratory failure, one of the features that predicts
    death in the first year.
  phenotype_term:
    preferred_term: Arthrogryposis multiplex congenita
    term:
      id: HP:0002804
      label: Arthrogryposis multiplex congenita
  evidence:
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atypical features in a minority of cases included arthrogryposis, central nervous system involvement, and congenital fractures."
    explanation: Places arthrogryposis among the minority features of the nemaline myopathy series.
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe neonatal respiratory disease and the presence of arthrogryposis multiplex congenita are associated with death in the first year of life."
    explanation: Establishes the prognostic weight of arthrogryposis.
- category: Developmental
  name: Motor Developmental Delay
  frequency: FREQUENT
  description: >
    Delayed acquisition of motor milestones. Independent ambulation before 18 months is
    the single best-documented favourable prognostic marker in nemaline myopathy, and
    failure to achieve early motor milestones is associated with early mortality — so
    milestone timing is prognostic information, not only a developmental observation.
  phenotype_term:
    preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Independent ambulation before age 18 months is predictive of survival. Most children with typical congenital NM are eventually able to walk."
    explanation: Establishes early ambulation as a survival predictor and the usual eventual ambulation in the typical form.
  - reference: PMID:11558787
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arthrogryposis, neonatal respiratory failure, and failure to achieve early motor milestones were associated with early mortality."
    explanation: Links failure of early milestones to mortality in the 143-patient series.
- category: Musculoskeletal
  name: Scoliosis
  frequency: OCCASIONAL
  description: >
    Progressive spinal deformity secondary to axial muscle weakness, and one of the
    features for which routine surveillance is recommended throughout childhood.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Routine assessment for respiratory function, scoliosis, joint contractures, and the need for assistive devices."
    explanation: GeneReviews surveillance recommendation identifying scoliosis as an expected complication to monitor.
histopathology:
- name: Sarcoplasmic and Intranuclear Nemaline Rods with Sarcomeric Disorganisation
  description: >
    Gomori trichrome staining shows rod-shaped nemaline bodies in the sarcoplasm;
    electron microscopy shows their Z-disk origin, and in a subset of ACTA1 cases rods
    are also present within myonuclei. Associated findings in ACTA1 muscle include
    abnormal fibre type differentiation, glycogen accumulation, myofibrillar disruption
    and whorling of actin thin filaments.
  context: ACTA1-related nemaline myopathy
  evidence:
  - reference: PMID:11333380
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common pathological features included abnormal fiber type differentiation, glycogen accumulation, myofibrillar disruption, and \"whorling\" of actin thin filaments."
    explanation: Lists the histological features accompanying rods in ACTA1 muscle.
  - reference: PMID:22825594
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Actin accumulations, nemaline and intranuclear bodies, fibre-type disproportion, cores, caps, dystrophic features and zebra bodies have all been seen in biopsies from patients with ACTA1 disease, with patients frequently presenting with multiple pathologies."
    explanation: Documents that ACTA1 biopsies frequently carry more than one structural lesion, which is why the histological boundary of this entry is soft.
genetic:
- name: ACTA1
  gene_term:
    preferred_term: ACTA1
    term:
      id: hgnc:129
      label: ACTA1
  association: Causative
  relationship_type: CAUSATIVE
  frequency: VERY_FREQUENT
  notes: >
    ACTA1 encodes skeletal muscle alpha-actin. The gene is small — seven exons, six of
    them coding, across 2.8 kb — and pathogenic variants are distributed across all
    coding exons in proportion to exon size, with no hotspot, so targeted testing of
    part of the gene is not adequate. Most variants are private to one family.
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTA1 mutations are the second most common cause of nemaline myopathy after mutations in nebulin, accounting for 20% to 30% of a cohort of nemaline myopathy patients"
    explanation: Establishes ACTA1 as the second most common cause of nemaline myopathy.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTA1 mutations are distributed throughout the six coding exons of the gene (Figure 1, Supp. Table S1). No mutations have as yet been found in the non-coding exon 1. The number of mutations in each exon correlates with the size of each exon (Table 1). Thus, there do not appear to be any particular mutation hotspots"
    explanation: Supports the absence of a mutation hotspot, and so the need to sequence the whole coding region.
  case_fractions:
  - population: Nemaline myopathy cohorts reviewed to 2009
    case_fraction_low: 20.0
    case_fraction_high: 30.0
    notes: Second most common nemaline myopathy gene after NEB, and over-represented among severe cases.
    evidence:
    - reference: PMID:19562689
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ACTA1 mutations are the second most common cause of nemaline myopathy after mutations in nebulin, accounting for 20% to 30% of a cohort of nemaline myopathy patients"
      explanation: Source of the 20-30% case fraction.
  - population: Australian nemaline myopathy cohort, 35 patients screened
    case_fraction_percent: 15.0
    cohort_size: 35
    notes: Earlier single-cohort estimate from the series that first defined the ACTA1 clinical spectrum.
    evidence:
    - reference: PMID:11333380
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified five novel missense mutations in ACTA1, which suggested that mutations in muscle alpha-skeletal actin account for the disease in approximately 15% of patients with NM."
      explanation: Source of the 15% single-cohort case fraction.
diagnosis:
- name: Muscle Biopsy with Gomori Trichrome Staining
  description: >
    Histological demonstration of nemaline bodies establishes the nemaline myopathy
    phenotype. Electron microscopy adds the Z-disk origin of the rods and detects
    intranuclear rods.
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on clinical findings and the observation of characteristic rod-shaped structures (nemaline bodies) on muscle biopsy stained with Gomori trichrome."
    explanation: States the histological basis of diagnosis.
- name: ACTA1 Sequencing
  description: >
    Sequencing of the whole ACTA1 coding region, in practice as part of a congenital
    myopathy gene panel or exome, is required to assign the genotype. Because there is
    no mutation hotspot and most variants are private, partial-gene testing is not
    adequate, and parental testing is needed to distinguish a de novo dominant variant
    from a recessive genotype — a distinction that changes the recurrence risk from
    50% to 25%.
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Where DNA has been available for testing from the parents of sporadic patients, 79/94 or 84% had de novo dominant mutations not present in the peripheral blood DNA of either parent, while only 16% had recessive ACTA1 mutations."
    explanation: Supports parental testing as the step that resolves inheritance mode, and quantifies how often each answer is found.
differential_diagnoses:
- name: NEB-Related Nemaline Myopathy
  description: >
    Nebulin is the most common cause of nemaline myopathy and is clinically hard to
    separate from ACTA1 disease: in a cross-sectional cohort the two genotypes were
    largely similar in phenotype. The distinction is genetic and matters mainly for
    recurrence risk, since NEB disease is recessive.
  distinguishing_features:
  - Recessive inheritance with a 25% sibling recurrence risk rather than a dominant de novo mechanism
  - No intranuclear rods or actin aggregates attributable to nebulin
  evidence:
  - reference: PMID:33397769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with pathogenic ACTA1 and NEB variants were largely similar in clinical phenotype."
    explanation: Establishes that the two commonest nemaline myopathy genotypes cannot be reliably separated clinically.
- name: Non-Nemaline ACTA1 Congenital Myopathies
  description: >
    The same gene causes intranuclear rod myopathy, actin filament aggregate myopathy,
    congenital fibre-type disproportion and myopathy with core-like areas. These are
    distinguished on biopsy rather than clinically, and a single biopsy may show several
    patterns at once, so the separation is a histological convention rather than a
    boundary between diseases.
  distinguishing_features:
  - Actin filament aggregates or fibre-type disproportion in place of, or alongside, nemaline rods
  - Attributed by MONDO to the alpha-actinopathy umbrella (MONDO:0100084) rather than to nemaline myopathy
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACTA1 mutations result in five overlapping congenital myopathies: nemaline myopathy; intranuclear rod myopathy; actin filament aggregate myopathy; congenital fiber type disproportion; and myopathy with core-like areas."
    explanation: Enumerates the ACTA1 histological entities that sit outside this entry's scope.
  - reference: PMID:17387733
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the D292V and P322S CFTD mutations are associated with normal sarcomeric structure on electron microscopy, which is atypical for severe NM."
    explanation: Gives the ultrastructural feature that separates ACTA1 fibre-type disproportion from severe ACTA1 nemaline myopathy.
treatments:
- name: Respiratory Surveillance and Ventilatory Support
  description: >
    Non-invasive ventilation for nocturnal hypoventilation, aggressive treatment of
    lower respiratory tract infections, and pre-operative pulmonary function assessment.
    Because respiratory failure is the cause of death and is frequently under-recognised
    in older patients whose limb strength looks stable, respiratory function is assessed
    on schedule rather than on symptoms.
  action_category: MONITORING
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: respiratory support and monitoring
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of manifestations: Aggressive treatment of lower respiratory tract infections, ventilator use for nocturnal hypoxia, preoperative assessment of pulmonary function to ensure optimal timing of surgical procedures and to minimize anesthetic risk, monitoring of nutritional status, special feeding techniques, standard care for gastroesophageal reflux, mobility and physical therapy to help prevent joint contractures, speech therapy, and assessment of cardiac status."
    explanation: GeneReviews management recommendation covering ventilatory and infection management.
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Routine assessment for respiratory function, scoliosis, joint contractures, and the need for assistive devices."
    explanation: Establishes scheduled respiratory surveillance rather than symptom-triggered assessment.
- name: Nutritional Support and Assisted Feeding
  description: >
    Nasogastric or gastrostomy feeding, attention to swallow safety, and management of
    gastro-oesophageal reflux, with monitoring of nutritional status. Bulbar involvement
    is near-universal on formal testing even when it is not the presenting complaint.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monitoring of nutritional status, special feeding techniques, standard care for gastroesophageal reflux"
    explanation: GeneReviews nutritional management recommendation.
- name: Physical Therapy and Contracture Prevention
  description: >
    Mobility work and physiotherapy to limit joint contractures, with orthopaedic
    surveillance for scoliosis and assistive device needs across childhood.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mobility and physical therapy to help prevent joint contractures, speech therapy, and assessment of cardiac status"
    explanation: GeneReviews recommendation for physiotherapy and contracture prevention.
- name: Avoidance of Neuromuscular Blocking Agents
  description: >
    Neuromuscular blocking agents are to be avoided because of a possible association
    with malignant hyperthermia susceptibility. This is an anaesthetic-safety warning
    that applies at every surgical or procedural encounter, and is one of the few
    actionable items a family can carry on a care plan.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: perioperative risk management
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301465
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Neuromuscular blocking agents, because of possible association with malignant hyperthermia susceptibility."
    explanation: GeneReviews agents-to-avoid warning, quoted directly.
- name: Genetic Counseling and Parental Testing
  description: >
    Counselling turns on which inheritance mode is operating. A de novo dominant variant
    carries a 50% risk to the proband's own offspring and a low but real sibling risk
    from parental mosaicism; a recessive genotype carries a 25% sibling risk and
    unaffected heterozygous parents. Parental testing is what distinguishes them, and a
    normal parental blood result does not exclude gonadal mosaicism.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There have been a number of instances where a severely affected proband was identified, and mildly affected or asymptomatic family members were found to carry the same dominant mutation. In at least three cases this can be explained by somatic mosaicism in one parent of a severely affected patient"
    explanation: Supports counselling for parental mosaicism after an apparently de novo dominant variant.
  - reference: PMID:19562689
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutation carriers (parents or siblings of patients with recessive ACTA1 mutations) were clinically unaffected, suggesting that expression from one intact copy of ACTA1 is sufficient for normal function"
    explanation: Supports the unaffected-carrier counselling message in recessive families.
- name: Fast Skeletal Muscle Troponin Activation (Investigational)
  description: >
    Small molecules that sensitise the thin filament to calcium increase submaximal
    force without changing the underlying genotype. Tirasemtiv improved contractile
    capacity in fast-twitch and diaphragm muscle of an Acta1 p.Asp286Gly mouse carrying
    a patient-derived dominant variant. This is preclinical: there is no approved
    disease-specific therapy for ACTA1 nemaline myopathy.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Reduced Skeletal Muscle Force Generation
    description: Increases submaximal thin-filament calcium sensitivity, partially offsetting the contractile deficit.
  evidence:
  - reference: PMID:38376469
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute and long-term tirasemtiv treatment significantly increased muscle contractile capacity at submaximal stimulation frequencies in both fast-twitch extensor digitorum longus and gastrocnemius muscle, and intermediate-twitch diaphragm muscle in vitro and in vivo."
    explanation: Preclinical efficacy of thin-filament calcium sensitisation in a patient-variant mouse model.
  - reference: PMID:22825594
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of small molecules to sensitise the contractile apparatus to Ca(2+) is a promising therapeutic for patients with various neuromuscular disorders, including ACTA1 disease."
    explanation: Review support for calcium sensitisation as a therapeutic strategy in ACTA1 disease.
- name: Cardiac Alpha-Actin Isoform Replacement (Investigational)
  description: >
    Cardiac alpha-actin is 99% identical to the skeletal isoform and is the predominant
    sarcomeric actin in fetal muscle, so re-expressing it postnatally can substitute for
    absent or poisoned skeletal alpha-actin. In mice it rescued the recessive null model
    and markedly reduced lethality in one dominant model but not another, so its benefit
    is allele-dependent rather than general. Preclinical only.
  action_category: THERAPEUTIC
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Absence of Functional Skeletal Muscle Alpha-Actin
    description: Supplies a near-identical sarcomeric actin isoform in place of the missing skeletal isoform.
  evidence:
  - reference: PMID:23736297
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We previously showed cardiac α-actin can substitute for skeletal muscle α-actin, preventing the early postnatal death of Acta1 knock-out mice, which model recessive ACTA1 disease."
    explanation: Establishes isoform substitution as effective in the recessive null model.
  - reference: PMID:23736297
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In one model, lethality of ACTA1(D286G). Acta1(+/-) mice was reduced from ∼59% before 30 days of age to ∼12%. In the other model, Acta1(H40Y), in which ∼80% of male mice die by 5 months of age, the cardiac α-actin transgene did not significantly improve survival."
    explanation: Documents the allele-dependent benefit, including the negative result, that qualifies this strategy.

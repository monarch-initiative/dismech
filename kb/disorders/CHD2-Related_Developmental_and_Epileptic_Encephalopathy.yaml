name: CHD2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-22T00:00:00Z"
category: Mendelian
synonyms:
- DEE94
- CHD2 myoclonic encephalopathy
- CHD2-related developmental and epileptic encephalopathy
- Childhood-onset epileptic encephalopathy, CHD2-related
description: >-
  CHD2-related developmental and epileptic encephalopathy (DEE94) is a
  childhood-onset neurodevelopmental disorder caused by de novo heterozygous
  loss-of-function variants in CHD2, which encodes chromodomain helicase
  DNA-binding protein 2, an ATP-dependent chromatin-remodeling enzyme. CHD2
  regulates nucleosome positioning and the accessibility of DNA to the
  transcriptional machinery, and is required for the coordinated gene-expression
  programs of neuronal development. Haploinsufficiency for CHD2 dysregulates
  chromatin remodeling and neuronal gene expression, producing a combination of
  developmental delay/intellectual disability and a characteristic epilepsy with
  prominent myoclonic and absence seizures, photosensitivity, and frequent
  developmental regression around seizure onset. Seizures usually begin in early
  childhood, are frequently fever-sensitive (reported in roughly one third of
  individuals), and are often refractory to treatment.

- name: Cortical Network Hyperexcitability
  description: >-
    Dysregulated expression of genes controlling neuronal excitability shifts the
    balance between excitation and inhibition in cortical networks, producing
    neuronal hyperexcitability and hypersynchrony that generate seizures,
    including photosensitive and myoclonic seizures. Human stem-cell models show
    that CHD2 loss selectively impairs the maturation of cortical inhibitory
    (GABAergic) interneurons while sparing excitatory neurons, providing a
    mechanistic substrate for the excitation-inhibition imbalance.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of membrane potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"

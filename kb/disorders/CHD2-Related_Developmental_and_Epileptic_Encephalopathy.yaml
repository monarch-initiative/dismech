    reference_title: "CHD2-Related Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHD2-related neurodevelopmental disorders are  characterized by early-onset epileptic encephalopathy"
    explanation: >-
      The disorder is characterized by epileptic encephalopathy, reflecting
      cortical network hyperexcitability.
  - reference: PMID:36115870
    reference_title: "Regulation of human cortical interneuron development by the chromatin remodeling protein CHD2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "delayed maturation of hESC-derived human cortical interneurons following either shRNA-based knockdown of CHD2 or CRISPR-based biallelic CHD2 knockout"
    explanation: >-
      In a human stem-cell model, CHD2 knockdown or knockout delays maturation of
      inhibitory interneurons, biasing cortical networks toward excitation.

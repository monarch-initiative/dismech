discussions:
- discussion_id: gap_chd2_target_genes_brain_restriction
  prompt: >-
    Which CHD2 target genes and downstream pathways translate the broad,
    ubiquitous chromatin-remodeling deficit into the specific, largely
    brain-restricted phenotype of photosensitive myoclonic epilepsy with
    developmental regression, and why is the developing brain selectively
    vulnerable despite CHD2 being expressed in most tissues?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Neuronal Gene Expression
  - pathophysiology#Cortical Network Hyperexcitability
  rationale: >-
    CHD2 is a general ATP-dependent chromatin remodeler expressed in most
    tissues, yet its haploinsufficiency produces a strikingly specific and
    brain-restricted epilepsy syndrome. The identity of the critical CHD2 target
    genes (e.g., neuronal excitability and developmental genes) that mediate the
    epilepsy phenotype, and the basis for the selective vulnerability of the
    developing brain, are unresolved. Answering this is prerequisite to
    mechanism-directed therapy, because a general chromatin-remodeler deficit is
    not directly druggable, whereas a defined downstream effector might be.
  proposed_experiments:
  - experiment_id: exp_chd2_target_gene_mapping
    name: CHD2 target-gene and chromatin-state mapping in human neurons
    description: >-
      In human iPSC-derived neurons and cortical organoids carrying patient CHD2
      loss-of-function variants, map genome-wide CHD2 binding, chromatin
      accessibility, and transcriptional changes across neurodevelopment, and
      test whether restoring specific dysregulated excitability genes rescues the
      hyperexcitability phenotype.
    evidence:
    - reference: PMID:36115870
      reference_title: "Regulation of human cortical interneuron development by the chromatin remodeling protein CHD2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We identified genome-wide CHD2 binding profiles during hcIN differentiation, defining direct CHD2 targets related to neurogenesis in hcIN progenitors and to neuronal function in hcINs.
      explanation: >-
        Existing genome-wide CHD2 binding maps establish the feasibility and
        relevance of extending target-gene and chromatin-state mapping in
        patient-derived neurons and organoids.
  evidence:
  - reference: PMID:29962935
    reference_title: "Chromatin Remodeling Proteins in Epilepsy: Lessons From CHD2-Associated Epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CHD2 has a unique role in human brain development and function."
    explanation: >-
      Despite ubiquitous expression, CHD2 has a brain-specific role, framing the
      open question of which brain target genes mediate the phenotype.
- discussion_id: gap_chd2_dosage_window_chaserr_upregulation
  prompt: >-
    Given that CHD2 is dosage-sensitive in both directions - haploinsufficiency
    causes this disorder while increased CHD2 abundance (as in CHASERR lncRNA
    deletion) causes a distinct, more severe neurodevelopmental disorder - can a
    CHD2-upregulating precision therapy (for example an antisense oligonucleotide
    targeting the CHD2-repressing lncRNA CHASERR) safely raise CHD2 toward normal
    without overshooting into the pathogenic overexpression range?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CHD2 Haploinsufficiency
  rationale: >-
    The natural therapeutic hypothesis for a haploinsufficiency disorder is to
    increase expression of the remaining functional allele. CHD2 is repressed by
    the adjacent long noncoding RNA CHASERR, making CHASERR a plausible
    antisense-oligonucleotide target for raising CHD2. However, the discovery
    that CHASERR deletion increases CHD2 abundance and causes a distinct, more
    severe disorder shows that CHD2 overexpression is itself pathogenic. Any
    upregulation strategy therefore has to thread a narrow therapeutic window,
    and the safe dosing range, durability, and developmental timing of such an
    approach are unknown. This is a preclinical hypothesis and no such therapy is
    approved or in clinical use.
  proposed_experiments:
  - experiment_id: exp_chd2_chaserr_aso_dose_window
    name: CHASERR-targeting ASO dose-window study in human neurons and mouse
    description: >-
      In CHD2-haploinsufficient human iPSC-derived neurons and in Chd2
      heterozygous mice, titrate CHASERR-targeting antisense oligonucleotides
      across a dose range, quantifying restoration of CHD2 protein toward the
      normal level, rescue of interneuron-maturation and network-excitability
      phenotypes, and any deleterious effects of overshoot into CHD2
      overexpression.
    evidence:
    - reference: PMID:39442041
      reference_title: "Neurodevelopmental Disorder Caused by Deletion of CHASERR, a lncRNA Gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the CHASERR deletion results in increased CHD2 protein abundance in patient-derived cell lines
      explanation: >-
        Patient-derived cells demonstrate that CHASERR loss raises CHD2 protein,
        motivating an explicit dose-window experiment before therapeutic
        upregulation is considered.
  evidence:
  - reference: PMID:31704914
    reference_title: "Regulation of CHD2 expression by the Chaserr long noncoding RNA gene is essential for viability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chaserr, a highly  conserved long noncoding RNA transcribed from a region near the transcription  start site of Chd2 and on the same strand, acts in concert with the CHD2 protein  to maintain proper Chd2 expression levels."
    explanation: >-
      CHASERR regulates CHD2 dosage, making it a candidate target for raising
      CHD2 in haploinsufficiency.
  - reference: PMID:39442041
    reference_title: "Neurodevelopmental Disorder Caused by Deletion of CHASERR, a lncRNA Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the CHASERR deletion results in  increased CHD2 protein abundance in patient-derived cell lines"
    explanation: >-
      CHASERR deletion raises CHD2 abundance and causes a distinct severe
      disorder, showing CHD2 overexpression is pathogenic and bounding any
      upregulation therapy.

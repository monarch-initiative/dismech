      snippet: "Studies that employed immunohistochemistry found ubiquitin and/or TDP-43-positive neuronal inclusions in the motor cortex and often in the extramotor neocortex."
      explanation: Demonstrates cortical ubiquitin/TDP-43 proteinopathy in PLS neuropathology.

- name: Cerebellar and Cerebro-Cerebellar Network Degeneration
  biological_scale: TISSUE
  description: >-
    Parallel infra-tentorial degeneration involving cerebellar cortical volume
    loss across vermis and hemispheres, dorsal dentate nuclear atrophy, and
    cerebello-frontal and cerebello-thalamic structural/functional
    disconnection; multimodal neuroimaging establishes its co-occurrence with
    upper motor neuron degeneration, though causal directionality between
    cortical and cerebellar pathology remains unestablished.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: dentate nucleus
    term:
      id: UBERON:0002132
      label: dentate nucleus
  evidence:
  - reference: DOI:10.1007/s00415-024-12261-z
    reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Volume reductions were identified in the vermis, anterior lobe, posterior lobe, and crura. Among the deep cerebellar nuclei, the dorsal dentate was atrophic."
    explanation: Demonstrates cerebellar cortical and dorsal dentate nuclear atrophy in a 43-patient PLS neuroimaging cohort.
  - reference: DOI:10.1007/s00415-024-12261-z
    reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebello-frontal, -temporal, -parietal, -occipital and cerebello-thalamic structural disconnection was detected at baseline based on radial diffusivity (RD) and cerebello-frontal decoupling was also evident based on fractional anisotropy (FA) alterations."
    explanation: Demonstrates widespread cerebro-cerebellar structural disconnection in PLS.
  downstream:
  - target: Gait imbalance
    description: Cerebellar and cerebro-cerebellar network dysfunction exacerbates gait and balance impairment in PLS.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: DOI:10.1007/s00415-024-12261-z
      reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cerebellar dysfunction in PLS is likely to exacerbate bulbar, gait and dexterity impairment and contribute to pseudobulbar affect."
      explanation: Supports cerebellar contribution to gait impairment in PLS.

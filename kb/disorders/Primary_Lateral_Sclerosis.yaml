description: >-
  Primary lateral sclerosis (PLS) is a predominantly sporadic, slowly
  progressive adult-onset upper motor neuron neurodegenerative disorder
  characterized by selective degeneration of the primary motor cortex and
  corticospinal and corticobulbar tracts with clinical sparing of lower motor
  neurons. Most autopsy-confirmed cases harbor ubiquitin- and TDP-43-positive
  neuronal inclusions in the motor and extramotor neocortex, accompanied on
  multimodal neuroimaging by transcallosal and cerebro-cerebellar degeneration,
  manifesting clinically with symmetric lower-limb spasticity, hyperreflexia,
  gait imbalance, spastic dysarthria, dysphagia, and pseudobulbar affect.

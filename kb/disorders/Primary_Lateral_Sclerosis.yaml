- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain and spine MRI to exclude structural or demyelinating lesions and
    evaluate precentral gyrus atrophy and corticospinal tract signal changes.
  presence: Exclusion of structural/demyelinating mimics, often with focal precentral gyrus atrophy or corticospinal tract changes
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging (MRI) may be normal but can show changes in the precentral gyrus or corticospinal tracts, although these findings are not specific to PLS."
    explanation: Describes characteristic precentral gyrus and corticospinal tract MRI findings in PLS.
differential_diagnoses:
- name: Amyotrophic lateral sclerosis
  description: >-
    Classical motor neuron disease involving both upper and lower motor neurons
    with a substantially faster clinical progression and shorter survival than
    PLS.
  disease_term:
    preferred_term: amyotrophic lateral sclerosis
    term:
      id: MONDO:0004976
      label: amyotrophic lateral sclerosis
  distinguishing_features:
  - Clinical and electromyographic lower motor neuron denervation meeting ALS diagnostic criteria and more rapid progression.
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course of PLS is typically more prolonged and benign than that of amyotrophic lateral sclerosis (ALS)."
    explanation: Distinguishes PLS from ALS by its slower clinical course and absence of lower motor neuron involvement.
- name: Hereditary spastic paraplegia
  description: >-
    Genetically heterogeneous group of inherited upper motor neuron disorders
    causing progressive lower-limb spasticity that can closely mimic lower-limb-onset
    PLS.
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  distinguishing_features:
  - Positive family history or pathogenic SPG gene variant, often earlier onset, and typically less prominent corticobulbar involvement.
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This condition is a diagnosis of exclusion. Therefore, other causes of upper motor neuron dysfunction, including hereditary spastic paraplegia, must be ruled out."
    explanation: Identifies hereditary spastic paraplegia as a key differential diagnosis that must be excluded.
treatments:
- name: Supportive Care
  description: >-
    Multidisciplinary symptomatic and supportive care aimed at preserving
    functional mobility and quality of life in the absence of approved
    disease-modifying therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Spasticity
    treatment_effect: MODULATES
    description: Symptomatic management reduces functional impairment from limb and bulbar spasticity.
  - target: Gait imbalance
    treatment_effect: MODULATES
    description: Supportive mobility interventions and fall prevention preserve ambulation and functional mobility.
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No cure or disease-modifying treatment has been established for PLS, and treatment is supportive with the primary goal of improving functional mobility."
    explanation: Establishes supportive management aimed at functional mobility as standard of care for PLS.
- name: Physical Therapy and Multidisciplinary Rehabilitation
  description: >-
    Physiotherapy, occupational therapy, and fall-prevention rehabilitation
    addressing upper motor neuron spasticity and cerebellar gait/dexterity
    impairment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Gait imbalance
    treatment_effect: MODULATES
    description: Physiotherapy and fall-prevention strategies address gait and balance impairment.
  - target: Spasticity
    treatment_effect: MODULATES
    description: Stretching and motor rehabilitation mitigate functional disability from spasticity.
  evidence:
  - reference: DOI:10.1007/s00415-024-12261-z
    reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, cerebellar components of motor disability should be considered in fall prevention, multidisciplinary rehabilitation, occupational, speech and physiotherapy."
    explanation: Supports physiotherapy, occupational therapy, and fall-prevention rehabilitation in PLS motor disability.
- name: Speech and Swallowing Therapy
  description: >-
    Speech-language rehabilitation targeting spastic dysarthria and bulbar
    dysphagia.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Dysarthria
    treatment_effect: MODULATES
    description: Speech therapy supports communication as corticobulbar and cerebellar speech impairment progresses.
  - target: Dysphagia
    treatment_effect: MODULATES
    description: Swallowing rehabilitation addresses bulbar dysphagia.
  evidence:
  - reference: DOI:10.1007/s00415-024-12261-z
    reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, cerebellar components of motor disability should be considered in fall prevention, multidisciplinary rehabilitation, occupational, speech and physiotherapy."
    explanation: Supports speech therapy as part of multidisciplinary rehabilitation for PLS bulbar and cerebellar motor disability.

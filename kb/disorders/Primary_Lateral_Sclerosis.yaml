diagnosis:
- name: 2020 International Consensus Diagnostic Criteria
  diagnosis_term:
    preferred_term: Clinical Diagnosis
    term:
      id: NCIT:C15607
      label: Clinical Diagnosis
  description: >-
    Consensus criteria require age >=25 years, progressive upper motor neuron
    dysfunction in at least two of three regions (lower extremity, upper
    extremity, bulbar) for at least 2 years, and absence of unexplained sensory
    symptoms, significant active lower motor neuron degeneration, or neuroimaging/biofluid
    mimics, stratifying certainty into probable PLS (2-4 years) and definite PLS
    (>=4 years).
  presence: Probable PLS at 2-4 years and definite PLS at >=4 years of pure progressive upper motor neuron dysfunction
  evidence:
  - reference: PMID:32029539
    reference_title: "Primary lateral sclerosis: consensus diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probable PLS is defined by the absence of significant active LMN degeneration 2–4 years from symptom onset."
    explanation: Defines the 2020 consensus threshold for probable PLS to enable earlier trial enrollment.
  - reference: PMID:32029539
    reference_title: "Primary lateral sclerosis: consensus diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Definite PLS is defined by the absence of significant active LMN degeneration 4 or more years from symptom onset."
    explanation: Defines the 4-year duration threshold for definite PLS in the absence of active lower motor neuron degeneration.
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "PLS is diagnosed after a detailed clinical history, physical exam, and diagnostic testing have excluded other causes."
    explanation: Establishes PLS as a clinical diagnosis of exclusion requiring thorough evaluation.
- name: Electromyography
  diagnosis_term:
    preferred_term: Electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Needle electromyography performed to confirm absence of widespread active or
    chronic lower motor neuron denervation that would indicate amyotrophic
    lateral sclerosis.
  presence: Normal electromyogram or minimal neurogenic changes in a few muscles not meeting El Escorial criteria for ALS
  evidence:
  - reference: PMID:26515619
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Electromyogram is normal, or only shows mild neurogenic findings in a few muscles, not meeting El Escorial criteria."
    explanation: Defines the characteristic EMG findings distinguishing PLS from ALS.
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Electromyography (EMG) is often normal but can aid in differentiating PLS from ALS when lower motor neuron dysfunction is observed."
    explanation: Confirms the diagnostic role of EMG in excluding lower motor neuron involvement.
- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain and spine MRI to exclude structural or demyelinating lesions and
    evaluate precentral gyrus atrophy and corticospinal tract signal changes.
  presence: Exclusion of structural/demyelinating mimics, often with focal precentral gyrus atrophy or corticospinal tract changes
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Brain magnetic resonance imaging (MRI) may be normal but can show changes in the precentral gyrus or corticospinal tracts, although these findings are not specific to PLS."
    explanation: Describes characteristic precentral gyrus and corticospinal tract MRI findings in PLS.
differential_diagnoses:
- name: Amyotrophic lateral sclerosis
  description: >-
    Classical motor neuron disease involving both upper and lower motor neurons
    with a substantially faster clinical progression and shorter survival than
    PLS; lower motor neuron degeneration and somatic sensory dysfunction are
    defining exclusions in PLS.
  disease_term:
    preferred_term: amyotrophic lateral sclerosis
    term:
      id: MONDO:0004976
      label: amyotrophic lateral sclerosis
  distinguishing_features:
  - Clinical and electromyographic lower motor neuron denervation meeting ALS diagnostic criteria and more rapid progression; Orphanet and consensus criteria exclude lower motor neuron morphology abnormalities and somatic sensory dysfunction in PLS.
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The clinical course of PLS is typically more prolonged and benign than that of amyotrophic lateral sclerosis (ALS)."
    explanation: Distinguishes PLS from ALS by its slower clinical course and absence of lower motor neuron involvement.
  - reference: ORPHA:35689
    reference_title: "Primary lateral sclerosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0002366 | Abnormal lower motor neuron morphology | Excluded (0%)"
    explanation: Orphanet explicitly excludes lower motor neuron morphological abnormalities (0%) in PLS, separating it from ALS.
  - reference: ORPHA:35689
    reference_title: "Primary lateral sclerosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0003474 | Somatic sensory dysfunction | Excluded (0%)"
    explanation: Orphanet explicitly excludes somatic sensory dysfunction (0%) in PLS.
- name: Hereditary spastic paraplegia
  description: >-
    Genetically heterogeneous group of inherited upper motor neuron disorders
    causing progressive lower-limb spasticity that can closely mimic lower-limb-onset
    PLS; genetic panel testing (such as SPAST, SPG7) and C9orf72 repeat screening
    help exclude hereditary mimics in symmetrical lower-limb or UMN-predominant
    presentations.
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  distinguishing_features:
  - Positive family history or pathogenic SPG gene variant, often earlier onset, and typically less prominent corticobulbar involvement.
  evidence:
  - reference: PMID:39536141
    reference_title: "Primary Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This condition is a diagnosis of exclusion. Therefore, other causes of upper motor neuron dysfunction, including hereditary spastic paraplegia, must be ruled out."
    explanation: Identifies hereditary spastic paraplegia as a key differential diagnosis that must be excluded.
  - reference: PMID:32029539
    reference_title: "Primary lateral sclerosis: consensus diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of panels for pathogenic genetic variants associated with spastic paraparesis (eg, SPAST) is warranted in cases of progressive UMN syndromes restricted to symmetrical lower limb involvement. It is reasonable to routinely exclude the most common hereditary cause of ALS in Caucasian populations, namely an expansion in C9orf72 which may present with an UMN-predominant phenotype."
    explanation: Consensus criteria recommend targeted exclusion of SPAST/HSP panels in symmetrical lower-limb disease and C9orf72 expansions in UMN-predominant presentations while treating classical PLS as sporadic.

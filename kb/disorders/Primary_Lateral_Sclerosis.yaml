      quote_role: REVIEW_SYNTHESIS
      snippet: "Primary lateral sclerosis (PLS) is a selective upper motor neuron disorder characterized by insidious onset of symptoms in the absence of lower motor neuron involvement."
      explanation: Defines PLS as a selective upper motor neuron neurological disorder.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      Neuropathological series demonstrate ubiquitin- and TDP-43-positive

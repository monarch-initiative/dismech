    evidence_source: HUMAN_CLINICAL
    snippet: "Volume reductions were identified in the vermis, anterior lobe, posterior lobe, and crura. Among the deep cerebellar nuclei, the dorsal dentate was atrophic."
    explanation: Demonstrates cerebellar cortical and dorsal dentate nuclear atrophy in a 43-patient PLS neuroimaging cohort.
  - reference: DOI:10.1007/s00415-024-12261-z
    reference_title: "Supra- and infra-tentorial degeneration patterns in primary lateral sclerosis: a multimodal longitudinal neuroradiology study"

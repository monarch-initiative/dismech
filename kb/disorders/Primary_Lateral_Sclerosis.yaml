  description: >-
    Accumulation of ubiquitin- and TDP-43-immunoreactive neuronal inclusions in
    upper motor neurons of the primary motor cortex and extramotor neocortex,
    with minimal lower motor neuron inclusion burden compared with classical
    amyotrophic lateral sclerosis.

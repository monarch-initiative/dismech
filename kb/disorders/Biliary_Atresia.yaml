- name: Impaired Extrahepatic Duct Elastic-Fiber Organization
  description: >-
    Adult Efemp1 heterozygous mouse ducts have fewer organized elastic fibers despite
    preserved total elastin,
    with altered responses to pressure. This suggests structural susceptibility involving
    fibulin-3, but neither
    spontaneous atresia nor the direction of effect of human EFEMP1 risk variants
    was established. A mechanical
    contribution to epithelial vulnerability remains a hypothesis without a demonstrated
    causal edge to injury.
    The molecular-function annotation identifies the linked protein’s normal activity;
    it does not establish
    the functional effect of each human susceptibility allele.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:39717503
    reference_title: Biliary atresia susceptibility gene EFEMP1 regulates extrahepatic bile duct elastic fiber formation and mechanics.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      in adult Efemp1 +/- mouse ducts, elastin organization into fibers is decreased
      by approximately half.
    explanation: >-
      Mouse matrix-organization phenotype.

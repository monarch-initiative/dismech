name: Biliary Atresia
creation_date: '2026-08-12T00:00:00Z'
category: Complex
disease_term:
  preferred_term: biliary atresia
  term:
    id: MONDO:0008867
    label: biliary atresia
description: >-
  Biliary atresia is an infantile fibro-obliterative cholangiopathy that obstructs
  bile drainage and causes
  conjugated hyperbilirubinemia, pale stools and progressive liver disease. Injury
  commonly begins before visible
  jaundice, and abnormal direct/conjugated bilirubin can be present shortly after
  birth. Clinical presentations
  include isolated disease, laterality-associated malformations and cystic biliary
  remnants. Genetic susceptibility,
  developmental abnormalities and dysregulated immune responses contribute to mechanistic
  models, while specific
  viral or toxin causes remain unproven in humans. Kasai portoenterostomy can restore
  drainage and prolong
  native-liver survival, but many patients develop continuing fibrosis, portal hypertension
  or recurrent cholangitis
  and require liver transplantation.

parents:
- Neonatal Cholestasis

classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
has_subtypes:
- name: Isolated BA
  display_name: Isolated (non-syndromic) biliary atresia
  description: >-
    Biliary atresia without a recognized associated malformation syndrome, comprising
    most cases. The historical
    term perinatal form describes presentation, not proof of postnatal acquisition:
    direct/conjugated bilirubin
    may already be abnormal in the first days of life.
  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the majority of cases, currently termed isolated BA, there are still too
      few clues as to aetiology
      or indeed pathogenesis.
    explanation: >-
      Review synthesis of this clinical subgroup; definitions and overlap vary.
    quote_role: REVIEW_SYNTHESIS
- name: BASM
  display_name: Biliary atresia splenic malformation syndrome
  description: >-
    Biliary atresia with splenic and other laterality-associated malformations, including
    polysplenia or asplenia,
    abnormal visceral situs, intestinal malrotation, preduodenal portal vein and interrupted
    inferior vena
    cava. Definitions vary between cohorts. It accounts for roughly 10–15% in some
    Western series but is much
    less frequent in some Asian series; prognosis depends on associated anatomy and
    clinical context.
  subtype_term:
    preferred_term: biliary atresia with splenic malformation syndrome
    term:
      id: MONDO:0016577
      label: biliary atresia with splenic malformation syndrome
  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The commonest of these is the Biliary Atresia Splenic Malformation (BASM) syndrome,
      which accounts for
      about 10–15% of European and American series ..., but is distinctly rare in
      Chinese and Japanese series
      (<2%) ....
    explanation: >-
      Review synthesis of this clinical subgroup; definitions and overlap vary.
    quote_role: REVIEW_SYNTHESIS
- name: CBA
  display_name: Cystic biliary atresia
  description: >-
    Biliary atresia with cystic dilatation of part of the extrahepatic remnant, sometimes
    detected prenatally.
    It must be distinguished from a choledochal cyst. Timely Kasai surgery often gives
    better jaundice-clearance
    outcomes than other biliary-atresia variants, although late deterioration can
    still occur.

  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Post-operatively, these infants have >75% chance of clearance of jaundice and
      native liver preservation,
      though their prognosis does appear to have a marked relationship with age at
      surgery ....
    explanation: >-
      Review synthesis of this clinical subgroup; definitions and overlap vary.
    quote_role: REVIEW_SYNTHESIS
- name: CMV-associated BA
  display_name: Cytomegalovirus-associated biliary atresia
  description: >-
    Clinical subgroup with evidence of CMV infection at presentation, often defined
    by CMV IgM. Associations
    with more severe disease and poorer outcomes have been reported, but seropositivity
    at diagnosis does not
    establish congenital infection, timing, or viral causation of biliary atresia.
  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Therefore, using CMV IgM antibodies as a marker of infection up to 30% of Chinese
      BA series have been
      positive ... compared to about 10% in a UK series ....
    explanation: >-
      Review synthesis of this clinical subgroup; definitions and overlap vary.
    quote_role: REVIEW_SYNTHESIS
- name: CABA
  display_name: Cardiac-associated biliary atresia
  description: >-
    A clinical risk subgroup with cardiac anomalies, partly overlapping BASM. The
    phenotype is heterogeneous
    and does not establish one common pathogenesis; hemodynamically important heart
    disease affects operative
    planning and prognosis.
  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Indeed, when we reviewed our experience of biliary atresia-associated cardiac
      anomalies (n = 37), features
      indicative of BASM were present in 48% ....
    explanation: >-
      Review synthesis of this clinical subgroup; definitions and overlap vary.
    quote_role: REVIEW_SYNTHESIS
inheritance:
- name: Non-Mendelian / multifactorial
  description: >-
    Usually sporadic and non-Mendelian. A systematic review of 35 reported twin pairs
    found 34 discordant pairs,
    but published cases do not provide a population recurrence or penetrance estimate.
    Common susceptibility
    alleles and rare candidate variants may contribute. Biallelic PKD1L1 variants
    in five of 67 broadly defined
    BASM cases support a candidate recessive contribution in some patients, not an
    established Mendelian explanation
    for BASM as a whole.
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  evidence:
  - reference: PMID:32504124
    reference_title: 'Biliary atresia in twins: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      97.1% twins were discordant, among 55.9% of which were monozygotic twin sets,
      indicating that BA may
      be related to genetic phenotype or penetrance.
    explanation: >-
      Published-case synthesis, with marked twin discordance; it does not estimate
      population penetrance or
      prove a particular environmental or epigenetic cause.

    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30664273
    reference_title: Identification of Polycystic Kidney Disease 1 Like 1 Gene Variants in Children With Biliary Atresia Splenic Malformation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Five BASM subjects harbored rare and potentially deleterious biallelic variants
      in polycystic kidney
      disease 1 like 1 (PKD1L1), a gene associated with ciliary calcium signaling
      and embryonic laterality
      determination in fish, mice, and humans.
    explanation: >-
      Candidate biallelic variants in a minority of the ascertained BASM cohort.

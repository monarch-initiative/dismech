- name: Reduced Cholangiocyte Glutathione Reserve
  description: >-
    In zebrafish, extrahepatic cholangiocytes have a relatively oxidized glutathione
    state and are susceptible
    to biliatresone-induced redox stress. Glutathione depletion sensitizes biliary
    cells, whereas NAC supplementation
    or Nrf2 activation reduces injury. This is a toxin-model mechanism; intrinsic
    glutathione deficiency has
    not been established as a general initiating human defect.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:27102575
    reference_title: Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      GSH depletion sensitized both EHCs and the otherwise resistant intrahepatic
      cholangiocytes to the toxin
    explanation: >-
      Manipulating antioxidant reserve changes susceptibility in fish.

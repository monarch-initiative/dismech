pathophysiology:
- name: Cholangiocyte Injury of the Bile Duct Epithelium
  biological_scale: CELLULAR
  description: >-
    Cholangiocyte epithelial damage is a central lesion. RRV infection and biliatresone
    exposure produce experimentally
    defined injury in mice and zebrafish, respectively; neither demonstrates the initiating
    cause in human
    disease. Immune attack and developmental susceptibility may contribute through
    distinct, incompletely resolved
    routes.
  cell_types:
  - preferred_term: extrahepatic cholangiocyte
    term:
      id: CL:0019020
      label: extrahepatic cholangiocyte
  - preferred_term: intrahepatic cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  biological_processes:
  - preferred_term: cholangiocyte apoptotic process
    modifier: INCREASED
    term:
      id: GO:1902488
      label: cholangiocyte apoptotic process
  evidence:
  - reference: PMID:23844248
    reference_title: Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      the amount of cholangiocyte epithelial damage and bile duct edema was significantly
      greater in the early
      infection group
    explanation: >-
      Histologic epithelial injury in the time-dependent RRV mouse model.
  - reference: PMID:27102575
    reference_title: Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in
      zebrafish larvae.
    explanation: >-
      The plant toxin biliatresone selectively injures extrahepatic cholangiocytes,
      demonstrating that a targeted cholangiocyte insult can initiate a BA-like
      extrahepatic cholangiopathy.
  downstream:
  - target: Immune-Mediated Periductal Inflammation
    description: >-
      Epithelial injury participates in the fibroinflammatory response; initial human
      triggers remain uncertain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

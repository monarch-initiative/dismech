  evidence:
  - reference: PMID:32518681
    reference_title: 'Biliary atresia: pathology, etiology and pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mild lymphocytic inflammation is usually present within portal tracts in BA.
      Other inflammatory cells,
      including eosinophils, plasma cells and macrophages, are also present.
    explanation: >-
      Human pathology synthesis describes mixed portal inflammation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:36333281
    reference_title: Single-cell and spatial transcriptomics reveal the fibrosis-related immune landscape of biliary atresia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Immune subpopulations inhabiting the 'fibrotic niche' (areas of scarring), comprising
      'intermediate'
      CD14++ CD16+ monocytes, scar-associated macrophages, natural killer T cells,
      transitional B cells and
      FCN3+ neutrophils were identified.
    explanation: >-
      Spatial association of immune populations with scar tissue, not a causal intervention.

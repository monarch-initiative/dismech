- name: Altered ADD3 Regulatory Activity
  description: >-
    At the human ADD3 susceptibility locus, H69 cholangiocyte reporter assays detect
    allele-dependent activity
    in four fragments: risk haplotypes increase activity at E2, E4 and E10 but decrease
    it at E9. The fragment
    containing lead marker rs17095355 has no significant allelic difference. These
    assays concern cloned regulatory
    elements; they do not establish endogenous expression changes, a causal nucleotide,
    or chromatin contacts
    in patient cholangiocytes. The molecular-function annotation identifies the linked
    protein’s normal activity;
    it does not establish the functional effect of each human susceptibility allele.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:41589307
    reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      four elements (E2, E4, E9 and E10) showed allele-specific reporter activity
      differences
    explanation: >-
      Direct reporter measurement in the H69 human cholangiocyte cell line.
  - reference: PMID:41589307
    reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Both overexpression and knockdown of add3a in zebrafish disrupted hepatobiliary
      function and development,
      resulting in gallbladder hypoplasia/agenesis and reduced intrahepatic bile duct
      density.
    explanation: >-
      Independent dosage perturbations provide a plausible bridge to biliary development,
      not the effect of
      the assayed human variants in their native locus.
  downstream:
  - target: Disrupted Biliary Morphogenesis
    description: >-
      Reporter effects and fish dosage experiments suggest a susceptibility mechanism;
      they do not trace one
      human allele through to disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Rectal Budesonide
  description: >-
    Off-label postoperative therapy evaluated in a retrospective cohort against historical
    and untreated controls.
    Reported jaundice-free native-liver survival associations favored treated nonsyndromic
    cases, but treatment
    selection and changes in care can confound the result. No randomized evidence
    establishes benefit, and
    the report contains inconsistent two-year percentages between its abstract and
    table.
  therapeutic_modality: SMALL_MOLECULE

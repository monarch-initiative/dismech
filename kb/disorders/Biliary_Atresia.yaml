- name: Excess Hedgehog Signaling in Developmental Models
  description: >-
    Gpc1 or add3a knockdown increases Hedgehog-pathway readouts in zebrafish. Cyclopamine
    partially rescues
    the associated biliary defects, supporting a model-specific contribution of excessive
    signaling. A uniform
    Hedgehog abnormality caused by each human susceptibility allele has not been demonstrated.
    The molecular-function
    annotation identifies the linked protein’s normal activity; it does not establish
    the functional effect
    of each human susceptibility allele.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:23336978
    reference_title: Evidence from human and zebrafish that GPC1 is a biliary atresia susceptibility gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Exposure of the gpc1 morphants to cyclopamine, a Hedgehog antagonist, partially
      rescued the gpc1-knockdown
      phenotype.
    explanation: >-
      Pharmacologic rescue in fish.
  - reference: PMID:27526058
    reference_title: Loss of a Candidate Biliary Atresia Susceptibility Gene, add3a, Causes Biliary Developmental Defects in Zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      MO-mediated knockdown of add3a also showed higher mRNA expression of hedgehog
      (Hh) targets. Inhibition
      of Hh signaling rescued biliary defects caused by add3a knockdown.
    explanation: >-
      An additional fish perturbation/rescue route.

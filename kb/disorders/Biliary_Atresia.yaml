- name: Disrupted Biliary Morphogenesis
  description: >-
    Susceptibility-gene perturbations can impair developing biliary networks. Gpc1,
    add3a, arf6 and pkd1l1
    studies provide distinct experimental routes, but sparse fish ducts are not equivalent
    to the human fibro-obliterated
    extrahepatic remnant. The molecular-function annotation identifies the linked
    protein’s normal activity;
    it does not establish the functional effect of each human susceptibility allele.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23336978
    reference_title: Evidence from human and zebrafish that GPC1 is a biliary atresia susceptibility gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Knockdown of gpc1 in zebrafish led to developmental biliary defects.
    explanation: >-
      Experimental biliary developmental phenotype.
  - reference: PMID:37675454
    reference_title: Loss of zebrafish pkd1l1 causes biliary defects that have implications for biliary atresia splenic malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      These data highlight the essential role of pkd1l1 in normal development and
      function of the zebrafish
      biliary system
    explanation: >-
      Fish loss-of-function data support developmental plausibility rather than variant-specific
      human causality.
  downstream:

- name: N-Acetylcysteine (post-Kasai)
  description: >-
    Experimental glutathione-precursor/choleretic strategy. A nonrandomized phase
    II pilot tested intravenous
    NAC for seven days after Kasai; none of 12 evaluable infants achieved total serum
    bile acids ≤10 µmol/L
    within 24 weeks, so the second stage did not open. Secondary outcomes did not
    differ from matched historical
    controls. One enrolled infant stopped treatment for worsening preexisting tachycardia,
    a serious event
    considered possibly drug-related in the full text. Longer courses remain unproven.
    A separate small Chinese
    pilot (ChiCTR2000040505; six treated and six untreated BA infants in the transcriptomic
    analysis) reported
    short-term bilirubin and immune-signature changes. This exploratory study used
    a different perioperative
    schedule and does not establish long-term clinical efficacy or contradict the
    US trial’s failure to meet
    its prespecified endpoint.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

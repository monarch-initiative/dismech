animal_models:
- name: Rhesus rotavirus (RRV) neonatal mouse model
  species: Mouse
  genotype: Wild-type BALB/c neonate infected with rhesus rotavirus
  description: >-
    Neonatal BALB/c infection with RRV produces age-dependent epithelial injury, inflammation
    and extrahepatic
    obstruction. Early and late infection have substantially different outcomes. This
    defined viral model tests
    selected injury mechanisms; it does not establish the cause or all subtypes of
    human disease.
  publication: PMID:23844248
  modeled_mechanisms:
  - target: Cholangiocyte Injury of the Bile Duct Epithelium
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Early infection produces biliary epithelial injury and obstruction.
    limitations: >-
      Susceptibility depends on mouse age and viral conditions; BASM developmental
      defects and human etiologic
      heterogeneity are not reproduced.
    evidence:
    - reference: PMID:23844248
      reference_title: Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        the amount of cholangiocyte epithelial damage and bile duct edema was significantly
        greater in the
        early infection group
      explanation: >-
        Histologic epithelial injury in the time-dependent RRV mouse model.
- name: Biliatresone zebrafish model
  species: Zebrafish
  genotype: Wild-type larvae exposed to the isoflavonoid toxin biliatresone
  description: >-
    Exposure of zebrafish larvae to the plant toxin biliatresone selectively
    injures the extrahepatic biliary epithelium, providing a toxin-driven model of
    the extrahepatic cholangiopathy of biliary atresia.
  publication: PMID:27102575
  modeled_mechanisms:
  - target: Cholangiocyte Injury of the Bile Duct Epithelium
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Biliatresone reproduces selective extrahepatic-cholangiocyte injury,
      modeling the toxin route to the cholangiocyte-injury node.
    limitations: >-
      Zebrafish biliary anatomy differs from the human extrahepatic tree, and the
      specific human relevance of biliatresone exposure remains unproven; the
      model captures the injury mechanism rather than human etiology.
    evidence:
    - reference: PMID:27102575
      reference_title: Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs)
        in zebrafish larvae.
      explanation: >-
        Demonstrates selective extrahepatic-cholangiocyte toxicity, grounding
        the toxin model of the injury node.

  - target: Reduced Cholangiocyte Glutathione Reserve
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Glutathione depletion increases toxin susceptibility, while antioxidant manipulations
      reduce injury.
    limitations: >-
      Experimental toxin exposure is not a demonstrated cause of human biliary atresia.
    evidence:
    - reference: PMID:27102575
      reference_title: Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        GSH depletion sensitized both EHCs and the otherwise resistant intrahepatic
        cholangiocytes to the toxin
      explanation: >-
        Manipulating antioxidant reserve changes susceptibility in fish.
- name: Gpc1 knockdown zebrafish
  species: Zebrafish
  genotype: gpc1 morpholino knockdown
  description: >-
    Knockdown impairs the biliary network; gpc1 mRNA rescue and partial cyclopamine
    rescue support specificity
    and Hedgehog involvement.
  publication: PMID:23336978
  modeled_mechanisms:
  - target: Disrupted Biliary Morphogenesis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Knockdown impairs the biliary network; gpc1 mRNA rescue and partial cyclopamine
      rescue support specificity
      and Hedgehog involvement.
    limitations: >-
      Morpholino perturbation is not a human deletion genotype; the model does not
      demonstrate penetrance or
      progressive human remnant fibrosis.
    evidence:
    - reference: PMID:23336978
      reference_title: Evidence from human and zebrafish that GPC1 is a biliary atresia susceptibility gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Knockdown of gpc1 in zebrafish led to developmental biliary defects.
      explanation: >-
        Experimental biliary developmental phenotype.
- name: Add3a dosage perturbation zebrafish
  species: Zebrafish
  genotype: add3a overexpression or knockdown
  description: >-
    Both increased and decreased add3a dosage perturb biliary development.
  publication: PMID:41589307
  modeled_mechanisms:
  - target: Disrupted Biliary Morphogenesis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Both increased and decreased add3a dosage perturb biliary development.
    limitations: >-
      Direct dosage manipulation does not reproduce the endogenous effect of a particular
      human enhancer allele.
    evidence:
    - reference: PMID:41589307
      reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Both overexpression and knockdown of add3a in zebrafish disrupted hepatobiliary
        function and development,
        resulting in gallbladder hypoplasia/agenesis and reduced intrahepatic bile
        duct density.
      explanation: >-
        Independent dosage perturbations provide a plausible bridge to biliary development,
        not the effect
        of
        the assayed human variants in their native locus.
- name: Arf6 knockdown zebrafish
  species: Zebrafish
  genotype: arf6 morpholino knockdown, with EGFR-inhibition and mRNA-rescue arms
  description: >-
    Perturbation and rescue test EGFR–ARF6 involvement in biliary network development.
  publication: PMID:26379158
  modeled_mechanisms:
  - target: Reduced EGFR-ARF6 Developmental Signaling
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Perturbation and rescue test EGFR–ARF6 involvement in biliary network development.
    limitations: >-
      The human associated noncoding alleles were not directly modeled.
    evidence:
    - reference: PMID:26379158
      reference_title: The Role of ARF6 in Biliary Atresia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Biliary defects were reproduced with the EGFR-blocker AG1478 alone or with
        Mo-arf6 at lower doses of
        each agent and rescued with arf6 mRNA.
      explanation: >-
        Perturbation and rescue support EGFR–ARF6 involvement in fish development.
- name: Pkd1l1 mutant zebrafish
  species: Zebrafish
  genotype: Maternal-zygotic pkd1l1 hsc117 four-base-pair deletion
  description: >-
    Mutants have laterality abnormalities, sparse intrahepatic biliary networks and
    impaired biliary transport;
    most retain a gallbladder.
  publication: PMID:37675454
  modeled_mechanisms:
  - target: Disrupted Biliary Morphogenesis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Mutants have laterality abnormalities, sparse intrahepatic biliary networks
      and impaired biliary transport;
      most retain a gallbladder.
    limitations: >-
      Fish loss of function does not validate each human PKD1L1 variant or reproduce
      the full BASM phenotype.
    evidence:
    - reference: PMID:37675454
      reference_title: Loss of zebrafish pkd1l1 causes biliary defects that have implications for biliary atresia splenic malformation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        These data highlight the essential role of pkd1l1 in normal development and
        function of the zebrafish
        biliary system
      explanation: >-
        Fish loss-of-function data support developmental plausibility rather than
        variant-specific human causality.
- name: Efemp1 heterozygous mouse duct mechanics
  species: Mouse
  genotype: Adult Efemp1 heterozygous loss
  description: >-
    Reduced organized elastic fibers accompany altered pressure-dependent duct mechanics.
  publication: PMID:39717503
  modeled_mechanisms:
  - target: Impaired Extrahepatic Duct Elastic-Fiber Organization
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Reduced organized elastic fibers accompany altered pressure-dependent duct mechanics.
    limitations: >-
      Adult heterozygous ducts did not establish neonatal atresia or the effect direction
      of human susceptibility
      alleles.
    evidence:
    - reference: PMID:39717503
      reference_title: Biliary atresia susceptibility gene EFEMP1 regulates extrahepatic bile duct elastic fiber formation and mechanics.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        in adult Efemp1 +/- mouse ducts, elastin organization into fibers is decreased
        by approximately half.
      explanation: >-
        Mouse matrix-organization phenotype.
- name: T-bet-deficient RRV mouse
  species: Mouse
  genotype: T-bet knockout with neonatal RRV infection
  description: >-
    T-bet loss preserves duct patency despite continued obstructive-cholangiopathy
    symptoms and unchanged mortality.
  publication: PMID:34943969
  modeled_mechanisms:
  - target: Th1-Associated Cytotoxic Inflammation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      T-bet loss preserves duct patency despite continued obstructive-cholangiopathy
      symptoms and unchanged
      mortality.
    limitations: >-
      Anatomic duct protection is not complete clinical or survival rescue.
    evidence:
    - reference: PMID:34943969
      reference_title: T-Bet Deficiency Attenuates Bile Duct Injury in Experimental Biliary Atresia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Even though the percentage of T-bet KO mice displaying symptoms of an obstructive
        cholangiopathy and
        overall mortality rate was not different compared to wild-type mice, the extrahepatic
        bile ducts of
        T-bet KO mice remained patent.
      explanation: >-
        The primary study distinguishes anatomic protection from survival benefit.
- name: Treg augmentation in RRV mouse
  species: Mouse
  genotype: RRV infection with JES6-1/IL-2-mediated Treg augmentation
  description: >-
    Treatment after infection expands Tregs, improves survival and reduces biliary
    inflammation.
  publication: PMID:39131670
  modeled_mechanisms:
  - target: Reduced Regulatory T-Cell Restraint
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Treatment after infection expands Tregs, improves survival and reduces biliary
      inflammation.
    limitations: >-
      Murine cytokine-complex treatment is not an established therapy for human infants.
    evidence:
    - reference: PMID:39131670
      reference_title: Regulatory T Cell (Treg) Cytotoxic T Lymphocyte-associated Antigen-4 Deficits in Biliary Atresia (BA) and Disease Rescue With Treg Augmentation in Murine BA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Treg augmentation in the murine model led to increased survival, decreased
        direct bilirubin levels
        and liver inflammation, and expansion of resident macrophages.
      explanation: >-
        Intervention result in RRV mice, not established human treatment efficacy.
- name: Cd177-deficient RRV mouse
  species: Mouse
  genotype: Cd177 knockout on BALB/c background with RRV infection
  description: >-
    Cd177 loss delays onset and reduces model morbidity and mortality.
  publication: PMID:35803543
  modeled_mechanisms:
  - target: Neutrophil Extracellular Trap Formation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Cd177 loss delays onset and reduces model morbidity and mortality.
    limitations: >-
      The human clinical effect of selectively interrupting NET formation remains
      unresolved.
    evidence:
    - reference: PMID:35803543
      reference_title: CD177(+) cells produce neutrophil extracellular traps that promote biliary atresia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Cd177-/- BALB/c mice exhibited delayed disease onset and reduced morbidity
        and mortality.
      explanation: >-
        Mouse genetic intervention.
- name: Low-dose prenatal biliatresone mouse exposure
  species: Mouse
  genotype: Wild-type offspring after maternal low-dose biliatresone exposure
  description: >-
    Offspring showed bile-acid and immune changes without histologic liver or duct
    injury or fibrosis at the
    measured neonatal time points.
  publication: PMID:38578745
  modeled_mechanisms:
  - target: Cholangiocyte Injury of the Bile Duct Epithelium
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      The tested prenatal exposure did not induce the histologic injury phenotype.
    limitations: >-
      This negative result is specific to the tested exposure schedule and P5/P21
      observations; it does not
      exclude all possible dose-dependent effects.
    evidence:
    - reference: PMID:38578745
      reference_title: 'Low-dose biliatresone treatment of pregnant mice causes subclinical biliary disease in their offspring: Evidence for a spectrum of neonatal injury.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Pups had no evidence of histological liver or bile duct injury or fibrosis
        at either timepoint. In
        addition, growth was normal.
      explanation: >-
        Prenatal low-dose model produced biochemical and immune changes rather than
        overt fibro-obliterative
        atresia.

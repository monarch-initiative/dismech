- name: Th1-Associated Cytotoxic Inflammation
  description: >-
    T-bet-dependent inflammatory and cytotoxic programs contribute to duct injury
    in the RRV mouse model. T-bet
    deletion reduces these programs and preserves duct patency in many mice, but cholestatic
    symptoms and mortality
    persist. Duct patency therefore does not establish complete disease rescue.
  biological_scale: CELLULAR
  evidence:

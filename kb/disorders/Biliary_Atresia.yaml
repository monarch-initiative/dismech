  - reference: PMID:39131670
    reference_title: Regulatory T Cell (Treg) Cytotoxic T Lymphocyte-associated Antigen-4 Deficits in Biliary Atresia (BA) and Disease Rescue With Treg Augmentation in Murine BA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with BA had decreased peripheral blood Treg frequency and lack of cytotoxic
      T lymphocyte-associated
      antigen-4 (CTLA-4) upregulation despite a highly activated, effector Treg phenotype.
    explanation: >-
      Human clinical sample phenotype, with stage and comparator limitations.
  - reference: PMID:39131670

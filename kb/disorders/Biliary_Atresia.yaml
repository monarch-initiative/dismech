- name: Reduced EGFR-ARF6 Developmental Signaling
  description: >-
    Arf6 knockdown and EGFR inhibition produce sparse intrahepatic biliary networks
    and impaired bile transport
    in zebrafish, with arf6 mRNA rescue. The human noncoding association does not
    directly establish deficient
    ARF6 expression or this complete pathway in affected infants. The molecular-function
    annotation identifies
    the linked protein’s normal activity; it does not establish the functional effect
    of each human susceptibility
    allele.

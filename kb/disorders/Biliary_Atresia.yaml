- name: Embryonic Patterning Disturbance
  description: >-
    The combination of biliary atresia with splenic, visceral-situs, vascular and
    cardiac malformations suggests
    disturbed embryonic patterning in BASM. CFC1, a NODAL coreceptor, and PKD1L1 are
    candidate links to left-right
    signaling in a subset, with supportive animal data; the underlying defect remains
    unresolved in most patients.
    The molecular-function annotation identifies the linked protein’s normal activity;
    it does not establish
    the functional effect of each human susceptibility allele.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:34884377
    reference_title: 'Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      As this biliary timeline is shared by the determination of visceral situs, spleen
      formation, evolution
      of the portal venous and caval venous system anomalies it is not too much to
      speculate that BASM is also
      an embryonic defect.
    explanation: >-
      Developmental interpretation of the BASM phenotype, not a proven single molecular
      cause.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:18162845
    reference_title: CFC1 gene involvement in biliary atresia with polysplenia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The heterozygous transition c.433G>A (Ala145Thr) located in exon 5 was identified
      in 5 patients, with
      a twice-higher frequency than in control patients.
    explanation: >-
      Small candidate-gene study; no Mendelian penetrance inference.

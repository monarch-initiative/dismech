- name: Reduced Regulatory T-Cell Restraint
  description: >-
    Human BA samples show reduced Treg frequency and inadequate CTLA-4 upregulation,
    including blood collected
    at transplantation; these observations do not establish an initiating neonatal
    defect. Treg augmentation
    after infection improves survival and biliary injury in the RRV mouse model, supporting
    a regulatory contribution
    to ongoing inflammation.
  biological_scale: CELLULAR

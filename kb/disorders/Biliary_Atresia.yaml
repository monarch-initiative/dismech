    reference_title: T-Bet Deficiency Attenuates Bile Duct Injury in Experimental Biliary Atresia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Even though the percentage of T-bet KO mice displaying symptoms of an obstructive
      cholangiopathy and

synonyms:
- BA
- Extrahepatic biliary atresia
histopathology:
- name: Portal ductular reaction
  description: >-
    Proliferating and anastomosing bile ductules at expanded portal-tract margins
    support large-duct obstruction.
    They are not unique to biliary atresia, and early biopsies may be nonspecific.
    An exact human histopathology
    ontology binding is still needed; the mouse/rat hyperplasia terms are not appropriate
    substitutes.
  evidence:
  - reference: PMID:32518681
    reference_title: 'Biliary atresia: pathology, etiology and pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Portal tracts show expansion and demonstrate edematous fibroplasia with bile
      ductular proliferation,
      consisting of anastomosing ductules located at the periphery of the portal tracts
    explanation: >-
      Characteristic portal architecture in the pathology review.
    quote_role: REVIEW_SYNTHESIS
  finding_term:
    preferred_term: Portal ductular reaction
- name: Bile plugs in ductules
  finding_term:
    preferred_term: Bile Plug
  description: >-
    Inspissated bile within ductular lumina is a useful obstructive histologic finding,
    interpreted alongside the clinical workup. A compatible histopathology ontology
    binding is needed; the specific NCIT Bile Plug concept is outside the current
    permitted hierarchy.
  evidence:
  - reference: PMID:32518681
    reference_title: 'Biliary atresia: pathology, etiology and pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Ductular cholestasis (inspissated bile plugs within ductular lumen) is commonly
      seen and represent a
      useful diagnostic feature.
    explanation: >-
      Direct microscopic finding described in the review.
    quote_role: REVIEW_SYNTHESIS
- name: Periportal fibrosis
  finding_term:
    preferred_term: Periportal Fibrosis
    term:
      id: NCIT:C172824
      label: Periportal Fibrosis
  description: >-
    Portal fibroplasia can progress to bridging fibrosis and biliary cirrhotic remodeling.
    Histologic severity
    reflects disease stage but is not an infallible predictor of native-liver survival.
  evidence:
  - reference: PMID:32518681
    reference_title: 'Biliary atresia: pathology, etiology and pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Higher stages of portal fibrosis have been associated with more severe portal
      hypertension and increased
      risk of LT
    explanation: >-
      Pathology review also notes conflicting prognostic studies.
    quote_role: REVIEW_SYNTHESIS
notes: >-
  Clinical phenotypic subgroups overlap and are not a mutually exclusive etiologic
  partition. BASM, CMV-associated
  disease and cardiac-associated disease have variable definitions; the separate surgical
  type I–III classification
  describes the level of duct obstruction. Candidate susceptibility genes and animal
  perturbations do not establish
  Mendelian recurrence risks or human toxin/viral causation.

  Source identification: the NASPGHAN-hosted PDF is the 2017 joint NASPGHAN/ESPGHAN
  infant cholestasis guideline
  (PMID:27429428). The PMC newborn-screening full text is Harpavat et al., JAMA 2020
  (PMID:32207797). The EU
  trial-results page is the sponsor-posted final EMBARK record (EudraCT 2020-000974-22;
  NCT04524390). The Ipsen
  announcement dated 24 July 2026 is the sponsor topline BOLD report, not a peer-reviewed
  full trial publication.
  Trial statuses were checked on 1 October 2026.

  The CD177/NET paper (PMID:35803543) has a corrigendum (PMID:40764185; DOI:10.1016/j.jhep.2025.06.013):
  duplicated
  representative flow-cytometry images in Figure 2D/E were corrected, with unchanged
  underlying statistical
  results according to the journal correction. The ClinicalTrials.gov API record for
  NCT05426733 supplies the
  BOLD-EXT detailed protocol description.
experimental_models:
- name: H69 ADD3 regulatory-element reporter assays
  experimental_model_type: CELL_LINE
  cell_source: Immortalized human H69 cholangiocytes
  description: >-
    Allelic fragments from the ADD3 susceptibility interval were cloned into reporters.
    Four showed differing
    haplotype activity, whereas the fragment containing the lead marker did not.
  publication: PMID:41589307
  modeled_mechanisms:
  - target: Altered ADD3 Regulatory Activity
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reports allelic transcriptional activity of cloned DNA fragments.
    limitations: >-
      Does not measure native enhancer-promoter contacts or endogenous expression
      in patients.
    evidence:
    - reference: PMID:41589307
      reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        four elements (E2, E4, E9 and E10) showed allele-specific reporter activity
        differences
      explanation: >-
        Direct reporter measurement in the H69 human cholangiocyte cell line.
- name: RRV-infected macrophage conditioned-medium assay
  experimental_model_type: CELL_LINE
  cell_source: Murine RAW264.7 macrophages and isolated neutrophils
  description: >-
    Conditioned medium from infected macrophages stimulates neutrophil chemotaxis;
    CXCL2 depletion abolishes
    the measured response.
  publication: PMID:20234283
  modeled_mechanisms:
  - target: Macrophage CXCL2-Dependent Neutrophil Chemotaxis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Tests the CXCL2 dependence of conditioned-medium chemotaxis.
    limitations: >-
      Does not demonstrate necessity for injury in an intact animal or a human infant.
    evidence:
    - reference: PMID:20234283
      reference_title: Macrophages are targeted by rotavirus in experimental biliary atresia and induce neutrophil chemotaxis by Mip2/Cxcl2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        addition of anti-Mip2/Cxcl2 antibodies depleted this chemokine in the conditioned
        media and completely
        prevented neutrophil chemotaxis.
      explanation: >-
        Conditioned-medium depletion experiment; the causal intervention is in vitro.

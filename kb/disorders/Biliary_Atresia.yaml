name: Biliary Atresia
creation_date: "2026-08-12T00:00:00Z"
category: Complex
disease_term:
  preferred_term: biliary atresia
  term:
    id: MONDO:0008867
    label: biliary atresia
description: >-
  Biliary atresia is a rare, progressive fibro-obliterative cholangiopathy of the
  intra- and extrahepatic bile ducts that presents in the neonatal/perinatal period
  with conjugated hyperbilirubinemia, pale (acholic) stools, and dark urine. It is
  the leading cause of neonatal cholestasis requiring surgery and the most common
  indication for pediatric liver transplantation. The etiology is heterogeneous and
  incompletely understood: proposed contributors include a perinatal viral trigger,
  a dysregulated/autoimmune inflammatory response directed at the bile duct
  epithelium, defective bile duct morphogenesis (particularly in the biliary atresia
  splenic malformation / laterality subtype), genetic susceptibility, and toxin
  exposure. These converge on cholangiocyte injury, periductal inflammation and
  fibrosis, progressive obliteration of the biliary tree, cholestasis, and — without
  timely restoration of bile flow — biliary cirrhosis, portal hypertension, and
  end-stage liver disease. First-line treatment is the Kasai hepatoportoenterostomy;
  most patients ultimately require liver transplantation.

parents:
  - Neonatal Cholestasis

classifications:
  harrisons_chapter:
    - classification_value: GASTROINTESTINAL

has_subtypes:
  - name: Isolated BA
    display_name: Isolated (non-syndromic) biliary atresia
    description: >-
      The most common form (roughly 70-85% of cases), presenting as isolated
      obliterative cholangiopathy without associated congenital anomalies. Often
      referred to as the perinatal form when jaundice appears after an initial
      anicteric period, implicating a postnatal/acquired inflammatory or infectious
      trigger.
  - name: BASM
    display_name: Biliary atresia splenic malformation syndrome
    description: >-
      An embryonic/fetal, syndromic form (~10-15% of cases) associated with
      laterality defects — polysplenia or asplenia, situs inversus/abdominal
      heterotaxy, a preduodenal portal vein, absent inferior vena cava, intestinal
      malrotation, and cardiac defects. Implicates disrupted left-right patterning
      and bile duct morphogenesis during embryogenesis; associated with earlier
      onset and worse outcome.
  - name: CBA
    display_name: Cystic biliary atresia
    description: >-
      A less common form in which the obliterated extrahepatic biliary tree contains
      a cyst; may be detected on prenatal or postnatal ultrasound and must be
      distinguished from a choledochal cyst, which has a much better prognosis.

inheritance:
  - name: Non-Mendelian / multifactorial
    description: >-
      Biliary atresia is overwhelmingly sporadic and non-Mendelian: twin studies
      show very high discordance (including monozygotic pairs) and familial
      recurrence is rare, implicating gene-environment, epigenetic, or stochastic
      contributions on top of genetic susceptibility. The syndromic BASM subtype
      with biallelic PKD1L1 variants is the exception, suggesting an autosomal
      recessive contribution in that specific form.
    inheritance_term:
      preferred_term: Non-Mendelian inheritance
      term:
        id: HP:0001426
        label: Non-Mendelian inheritance
    evidence:
      - reference: PMID:32504124
        reference_title: "Biliary atresia in twins: a systematic review and meta-analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "97.1% twins were discordant, among 55.9% of which were monozygotic twin sets, indicating that BA may be related to genetic phenotype or penetrance."
        explanation: >-
          High monozygotic-twin discordance argues against simple Mendelian
          inheritance, supporting a non-Mendelian/multifactorial model.

prevalence:
  - population: South Korea (nationwide birth cohort)
    measure_type: BIRTH_PREVALENCE
    prevalence_class: BAND_1_5_PER_10000
    rate_per_100000: 10.6
    notes: >-
      1.06 cases per 10,000 live births in Korea. Incidence is markedly higher in
      East Asia (Taiwan/Japan) than in Europe (~5-25 per 100,000). A female
      predominance is reported (adjusted prevalence ratio 1.68, 95% CI 1.33-2.12).
    evidence:
      - reference: PMID:28244293
        reference_title: "Epidemiology of Biliary Atresia in Korea."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The overall incidence of BA was 1.06 cases per 10,000 live births."
        explanation: >-
          National cohort birth prevalence/incidence figure for biliary atresia in
          an East-Asian population.
      - reference: PMID:35364097
        reference_title: "The Epidemiology of Biliary Atresia: Exploring the Role of Developmental Factors on Birth Prevalence."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Biliary atresia was positively associated with female sex (adjusted PR, 1.68; 95% CI, 1.33-2.12)"
        explanation: >-
          Documents the female predominance of biliary atresia birth prevalence.

pathophysiology:
  - name: Cholangiocyte Injury of the Bile Duct Epithelium
    biological_scale: CELLULAR
    description: >-
      The initiating lesion is injury to the cholangiocytes lining the extrahepatic
      (and later intrahepatic) bile ducts. Candidate insults include perinatal
      hepatotropic viral infection (cytomegalovirus, reovirus, rotavirus), exposure
      to a plant/environmental toxin (the isoflavonoid biliatresone, which causes an
      analogous extrahepatic cholangiopathy in livestock and zebrafish), and
      defective bile duct morphogenesis. Cholangiocyte apoptosis and loss of
      epithelial integrity expose ductal antigens and initiate the downstream
      inflammatory cascade.
    cell_types:
      - preferred_term: extrahepatic cholangiocyte
        term:
          id: CL:0019020
          label: extrahepatic cholangiocyte
      - preferred_term: intrahepatic cholangiocyte
        term:
          id: CL:0002538
          label: intrahepatic cholangiocyte
    biological_processes:
      - preferred_term: cholangiocyte apoptotic process
        modifier: INCREASED
        term:
          id: GO:1902488
          label: cholangiocyte apoptotic process
    evidence:
      - reference: PMID:23844248
        reference_title: "Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The murine model of BA, which mirrors the human disease, is based upon infection of newborn mice with rhesus rotavirus (RRV), leading to an obstructive cholangiopathy."
        explanation: >-
          The rhesus rotavirus murine model reproduces human BA by infecting neonatal
          cholangiocytes, supporting a perinatal viral cholangiocyte insult as an
          initiating mechanism.
      - reference: PMID:27102575
        reference_title: "Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in zebrafish larvae."
        explanation: >-
          The plant toxin biliatresone selectively injures extrahepatic cholangiocytes,
          demonstrating that a targeted cholangiocyte insult can initiate a BA-like
          extrahepatic cholangiopathy.
    downstream:
      - target: Immune-Mediated Periductal Inflammation
        description: >-
          Cholangiocyte injury exposes ductal antigens and releases danger signals
          that trigger the periductal innate and adaptive immune response.

  - name: Immune-Mediated Periductal Inflammation
    biological_scale: TISSUE
    description: >-
      Following the initial cholangiocyte insult, a Th1-polarized (interferon-gamma
      driven) and Th17-associated inflammatory response targets the bile duct
      epithelium. Portal tracts are infiltrated by CD4+ and cytotoxic CD8+ T cells,
      macrophages, and NK cells; a relative deficiency of regulatory T cells is
      thought to permit an autoimmune-like attack on the duct. This immune-mediated
      periductal inflammation amplifies and perpetuates the epithelial injury that
      began the disease.
    cell_types:
      - preferred_term: T-helper 1 cell
        term:
          id: CL:0000545
          label: T-helper 1 cell
      - preferred_term: cytotoxic T cell
        term:
          id: CL:0000910
          label: cytotoxic T cell
      - preferred_term: T-helper 17 cell
        term:
          id: CL:0000899
          label: T-helper 17 cell
      - preferred_term: macrophage
        term:
          id: CL:0000235
          label: macrophage
    biological_processes:
      - preferred_term: inflammatory response
        modifier: INCREASED
        term:
          id: GO:0006954
          label: inflammatory response
      - preferred_term: T cell mediated cytotoxicity
        modifier: INCREASED
        term:
          id: GO:0001913
          label: T cell mediated cytotoxicity
    evidence:
      - reference: PMID:39131670
        reference_title: "Regulatory T Cell (Treg) Cytotoxic T Lymphocyte-associated Antigen-4 Deficits in Biliary Atresia (BA) and Disease Rescue With Treg Augmentation in Murine BA."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Patients with BA had decreased peripheral blood Treg frequency and lack of cytotoxic T lymphocyte-associated antigen-4 (CTLA-4) upregulation despite a highly activated, effector Treg phenotype."
        explanation: >-
          Human BA patients show a regulatory T-cell deficit, supporting failed
          immune suppression permitting the autoimmune-like attack on the bile ducts.
      - reference: PMID:34943969
        reference_title: "T-Bet Deficiency Attenuates Bile Duct Injury in Experimental Biliary Atresia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Infection of newborn T-bet knockout (KO) pups with RRV resulted in a decreased Th1 inflammatory chemokine/cytokine profile when compared to infected wild-type mice."
        explanation: >-
          Genetic ablation of the Th1 master regulator T-bet blunts the Th1
          inflammatory profile, evidencing a Th1-driven mechanism of bile duct injury.
      - reference: PMID:20234283
        reference_title: "Macrophages are targeted by rotavirus in experimental biliary atresia and induce neutrophil chemotaxis by Mip2/Cxcl2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we detected the virus in hepatic macrophages and found that infected macrophages promoted neutrophil chemotaxis by release of Mip2/Cxcl2 in response to RRV."
        explanation: >-
          Rotavirus-targeted hepatic macrophages drive neutrophil chemotaxis, evidencing
          the innate-immune amplification arm of periductal inflammation.
    downstream:
      - target: Portal Mesenchymal Cell Activation
        description: >-
          Sustained periductal inflammation activates fibrogenic mesenchymal cells
          in the portal tract.

  - name: Portal Mesenchymal Cell Activation
    biological_scale: CELLULAR
    conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
    description: >-
      Sustained inflammation activates portal fibroblasts and transdifferentiates
      hepatic stellate cells into a myofibroblast-like, matrix-secreting phenotype —
      the organ-specific mesenchymal activation step of the conserved fibrotic
      response in the biliary atresia portal tract.
    cell_types:
      - preferred_term: hepatic stellate cell
        term:
          id: CL:0000632
          label: hepatic stellate cell
    biological_processes:
      - preferred_term: hepatic stellate cell activation
        modifier: INCREASED
        term:
          id: GO:0035733
          label: hepatic stellate cell activation
    downstream:
      - target: Fibro-obliteration of the Biliary Tree
        description: >-
          Activated mesenchymal cells deposit excess extracellular matrix, driving
          progressive fibro-obliteration of the ducts.

  - name: Fibro-obliteration of the Biliary Tree
    biological_scale: TISSUE
    conforms_to: "fibrotic_response#Excessive ECM Deposition"
    description: >-
      Activated portal myofibroblasts deposit excess extracellular matrix around and
      within the injured ducts, producing a fibro-obliterative process that
      progressively narrows and obliterates the extrahepatic biliary tree and damages
      the intrahepatic ducts, forming the characteristic fibrous remnant at the porta
      hepatis. This obliteration is the anatomic substrate that the Kasai
      portoenterostomy attempts to bypass.
    biological_processes:
      - preferred_term: collagen fibril organization
        modifier: INCREASED
        term:
          id: GO:0030199
          label: collagen fibril organization
    evidence:
      - reference: PMID:32518681
        reference_title: "Biliary atresia: pathology, etiology and pathogenesis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Histopathological findings in liver biopsies include the expansion of the portal tracts, with edematous fibroplasia and bile ductular proliferation, with bile plugs in duct lumen."
        explanation: >-
          Portal-tract fibroplasia and ductular reaction on biopsy evidence the
          fibro-obliterative remodeling of this node.
    downstream:
      - target: Cholestasis and Progression to Biliary Cirrhosis
        description: >-
          Obliteration of the biliary tree blocks bile flow, producing cholestasis
          that progresses to biliary cirrhosis and portal hypertension.

  - name: Cholestasis and Progression to Biliary Cirrhosis
    conforms_to: "cholestatic_liver_injury#Biliary Fibrosis Progressing to Biliary Cirrhosis"
    biological_scale: ORGANISM
    description: >-
      Obliteration of the biliary tree blocks bile flow, causing cholestasis with
      accumulation of conjugated bilirubin and bile acids. Retained bile constituents
      are hepatotoxic and, together with ongoing portal fibrosis, drive progression
      to biliary cirrhosis, portal hypertension, and ultimately end-stage liver
      disease. Even after a technically successful Kasai procedure, intrahepatic
      disease frequently progresses, which is why most patients eventually require
      liver transplantation.
    biological_processes:
      - preferred_term: bile acid secretion
        modifier: DECREASED
        term:
          id: GO:0032782
          label: bile acid secretion
    evidence:
      - reference: PMID:32518681
        reference_title: "Biliary atresia: pathology, etiology and pathogenesis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Biliary atresia is a progressive fibrosing obstructive cholangiopathy of the intrahepatic and extrahepatic biliary system, resulting in obstruction of bile flow and neonatal jaundice."
        explanation: >-
          Obstruction of bile flow producing neonatal jaundice is the cholestatic
          consequence modeled by this node, on the path to biliary cirrhosis.

phenotypes:
  - name: Conjugated hyperbilirubinemia
    description: >-
      Elevation of the direct (conjugated) bilirubin fraction due to obstructed bile
      flow; the biochemical hallmark of neonatal cholestasis and the finding that
      mandates urgent evaluation for biliary atresia.
    frequency: VERY_FREQUENT
    phenotype_term:
      preferred_term: Conjugated hyperbilirubinemia
      term:
        id: HP:0002908
        label: Conjugated hyperbilirubinemia

  - name: Prolonged neonatal jaundice
    description: >-
      Jaundice persisting beyond the first two weeks of life. In biliary atresia the
      jaundice is cholestatic (conjugated) rather than the benign unconjugated
      physiologic jaundice of the newborn.
    frequency: VERY_FREQUENT
    phenotype_term:
      preferred_term: Prolonged neonatal jaundice
      term:
        id: HP:0006579
        label: Prolonged neonatal jaundice
    evidence:
      - reference: PMID:34884377
        reference_title: "Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Biliary atresia (BA) is an obliterative condition of the biliary tract that presents with persistent jaundice and pale stools typically in the first few weeks of life."
        explanation: >-
          Persistent jaundice in the first weeks of life is the defining presenting
          feature of biliary atresia.

  - name: Acholic stools
    description: >-
      Pale, clay-colored stools reflecting the absence of bile pigment reaching the
      intestine; a key clinical sign prompting stool-color screening for biliary
      atresia.
    frequency: VERY_FREQUENT
    phenotype_term:
      preferred_term: Acholic stools
      term:
        id: HP:0011985
        label: Acholic stools
    evidence:
      - reference: PMID:34884377
        reference_title: "Biliary Atresia: Clinical Phenotypes and Aetiological Heterogeneity."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Biliary atresia (BA) is an obliterative condition of the biliary tract that presents with persistent jaundice and pale stools typically in the first few weeks of life."
        explanation: >-
          Pale (acholic) stools are part of the defining presenting signature of
          biliary atresia, reflecting absent bile pigment in the gut.

  - name: Dark urine
    description: >-
      Dark urine from renal excretion of conjugated bilirubin that cannot be
      excreted via the obstructed biliary route.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Dark urine
      term:
        id: HP:0040319
        label: Dark urine

  - name: Hepatomegaly
    description: >-
      Enlargement of the liver, typically firm, reflecting cholestasis and evolving
      fibrosis.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Hepatomegaly
      term:
        id: HP:0002240
        label: Hepatomegaly

  - name: Biliary cirrhosis
    description: >-
      Progressive secondary biliary cirrhosis resulting from persistent obstruction
      and cholestatic injury; may already be present at diagnosis and progresses
      despite surgery in many patients.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Biliary cirrhosis
      term:
        id: HP:0002613
        label: Biliary cirrhosis

  - name: Portal hypertension
    description: >-
      Elevated portal venous pressure secondary to hepatic fibrosis/cirrhosis,
      leading to splenomegaly, varices, and ascites.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Portal hypertension
      term:
        id: HP:0001409
        label: Portal hypertension

  - name: Splenomegaly
    description: >-
      Enlargement of the spleen, most often a consequence of portal hypertension;
      in the BASM subtype polysplenia may instead reflect a laterality defect.
    frequency: OCCASIONAL
    phenotype_term:
      preferred_term: Splenomegaly
      term:
        id: HP:0001744
        label: Splenomegaly

  - name: Failure to thrive
    description: >-
      Poor weight gain and growth from fat malabsorption (fat-soluble vitamin
      deficiency) and the metabolic demands of chronic liver disease.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Failure to thrive
      term:
        id: HP:0001508
        label: Failure to thrive

  - name: Polysplenia
    subtype: BASM
    description: >-
      Multiple small spleens, a defining feature of the biliary atresia splenic
      malformation (BASM) subtype, part of the laterality/heterotaxy phenotype.
    frequency: OCCASIONAL
    phenotype_term:
      preferred_term: Polysplenia
      term:
        id: HP:0001748
        label: Polysplenia

  - name: Situs inversus totalis
    subtype: BASM
    description: >-
      Mirror-image reversal of thoracic and abdominal organs, part of the laterality
      spectrum seen in the BASM subtype.
    frequency: OCCASIONAL
    phenotype_term:
      preferred_term: Situs inversus totalis
      term:
        id: HP:0001696
        label: Situs inversus totalis

  - name: Cholangitis
    description: >-
      Ascending bacterial cholangitis is a frequent complication after the Kasai
      portoenterostomy, in which the Roux limb provides a conduit for enteric
      bacteria to reach the residual intrahepatic ducts.
    frequency: FREQUENT
    phenotype_term:
      preferred_term: Cholangitis
      term:
        id: HP:0030151
        label: Cholangitis

biochemical:
  - name: Elevated conjugated (direct) bilirubin
    presence: Elevated
    context: >-
      Increased serum conjugated/direct bilirubin is the defining biochemical
      abnormality; a direct bilirubin above ~1.0 mg/dL (or >20% of total) in an
      infant warrants immediate evaluation for biliary atresia.

  - name: Elevated gamma-glutamyltransferase (GGT)
    presence: Elevated
    context: >-
      Serum GGT is characteristically high in biliary atresia, in contrast to the
      low-GGT cholestases (e.g. certain PFIC subtypes), helping to narrow the
      differential.

  - name: Elevated circulating hepatic transaminases
    presence: Elevated
    context: >-
      Mild to moderate elevation of ALT and AST reflecting hepatocellular injury
      accompanying the cholestasis.

  - name: Elevated serum matrix metalloproteinase-7 (MMP7)
    presence: Elevated
    context: >-
      Serum MMP7, secreted by injured extrahepatic cholangiocytes and involved in
      extracellular-matrix remodeling, is an emerging diagnostic biomarker that is
      elevated in biliary atresia and helps discriminate it from other causes of
      neonatal cholestasis.

diagnosis:
  - name: Abdominal ultrasonography (triangular cord sign)
    description: >-
      First-line imaging. The "triangular cord" sign — a triangular/tubular echogenic
      density cranial to the portal vein bifurcation representing the fibrotic biliary
      remnant — together with an absent, atretic, or non-contractile gallbladder is
      highly specific for biliary atresia.
    diagnosis_term:
      preferred_term: abdominal ultrasonography
      term:
        id: NCIT:C17230
        label: Ultrasound Imaging
    evidence:
      - reference: PMID:9396524
        reference_title: "A new diagnostic approach to biliary atresia with emphasis on the ultrasonographic triangular cord sign: comparison of ultrasonography, hepatobiliary scintigraphy, and liver needle biopsy in the evaluation of infantile cholestasis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Although 17 of 20 ultrasonographic examinations from infants who had BA denoted TC, 43 ultrasonographic examinations from infants with either neonatal hepatitis (NH) or other causes of cholestasis denoted no TC, showing a diagnostic accuracy of 95% with 85% sensitivity and 100% specificity."
        explanation: >-
          The triangular cord sign on ultrasound is highly specific for biliary
          atresia in the workup of infantile cholestasis.

  - name: Hepatobiliary scintigraphy (HIDA)
    description: >-
      Technetium-99m HIDA/DISIDA scintigraphy is highly sensitive but poorly specific:
      absence of tracer excretion into the gut occurs in biliary atresia but also in
      other cholestases, whereas demonstrated gut excretion effectively excludes it.

  - name: Intraoperative cholangiography
    description: >-
      The definitive confirmatory test, demonstrating non-patency of the extrahepatic
      biliary tree; performed at exploratory laparotomy, typically immediately before
      proceeding to the Kasai portoenterostomy.
    diagnosis_term:
      preferred_term: intraoperative cholangiography
      term:
        id: NCIT:C61508
        label: Cholangiography

  - name: Infant stool color card screening
    description: >-
      A parent-administered population screening tool comparing neonatal stool color
      to a reference card during the first month of life. National programs (e.g.
      Taiwan) using it achieve earlier Kasai surgery and improved transplant-free
      survival.
    evidence:
      - reference: PMID:27015203
        reference_title: "Infant Stool Color Card Screening Helps Reduce the Hospitalization Rate and Mortality of Biliary Atresia: A 14-Year Nationwide Cohort Study in Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Since 2004, Taiwan has implemented a national screening program that uses an infant stool color card (SCC) for the early detection of BA."
        explanation: >-
          Stool color card screening is a validated national program for early
          detection of biliary atresia.

genetic:
  - name: GPC1
    notes: >-
      Glypican-1 has been implicated as a susceptibility gene; rare variants and
      reduced dosage were associated with biliary atresia and with biliary
      developmental defects in zebrafish, linking Hedgehog signaling and bile duct
      development to disease risk. Biliary atresia is generally non-Mendelian, and
      identified genes act as susceptibility/modifier loci rather than single-gene
      causes.
    relationship_type: SUSCEPTIBILITY
    gene_term:
      preferred_term: GPC1
      term:
        id: hgnc:4449
        label: GPC1
    evidence:
      - reference: PMID:32315284
        reference_title: "Association of common variation in ADD3 and GPC1 with biliary atresia susceptibility."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Two GPC1 SNPs in high linkage disequilibrium (LD) showed nominal association with BA susceptibility (PAllele = 0.03 for rs6707262 and PAllele = 0.04 for rs6750380), and were eQTL of GPC1."
        explanation: >-
          The study's own finding is a nominal GPC1 association (and eQTL effect),
          supporting GPC1 as a susceptibility locus of modest effect.

  - name: ADD3
    notes: >-
      Variants at the ADD3 locus (adducin 3) were identified as a susceptibility
      signal in genome-wide association studies of biliary atresia, first in Asian
      populations. The high twin discordance rate underlines that BA susceptibility
      loci are modifiers of risk rather than Mendelian causes.
    relationship_type: SUSCEPTIBILITY
    gene_term:
      preferred_term: ADD3
      term:
        id: hgnc:245
        label: ADD3
    evidence:
      - reference: PMID:32315284
        reference_title: "Association of common variation in ADD3 and GPC1 with biliary atresia susceptibility."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Three SNPs in ADD3 were significantly associated with BA, and rs17095355 was the top SNP"
        explanation: >-
          ADD3 is the most strongly and reproducibly associated susceptibility locus,
          with rs17095355 the lead SNP across populations.
      - reference: PMID:32504124
        reference_title: "Biliary atresia in twins: a systematic review and meta-analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "97.1% twins were discordant, among 55.9% of which were monozygotic twin sets, indicating that BA may be related to genetic phenotype or penetrance."
        explanation: >-
          Near-universal twin discordance, mostly in monozygotic pairs, evidences the
          non-Mendelian, susceptibility-plus-trigger architecture of biliary atresia.

  - name: PKD1L1
    notes: >-
      Biallelic rare variants in PKD1L1, a ciliary calcium-signaling gene required for
      left-right axis determination, were identified in children with the biliary
      atresia splenic malformation (BASM) syndrome, and zebrafish pkd1l1 loss produces
      biliary defects — implicating disrupted laterality/ciliary signaling in the
      syndromic subtype.
    relationship_type: SUSCEPTIBILITY
    subtype: BASM
    gene_term:
      preferred_term: PKD1L1
      term:
        id: hgnc:18053
        label: PKD1L1
    evidence:
      - reference: PMID:30664273
        reference_title: "Identification of Polycystic Kidney Disease 1 Like 1 Gene Variants in Children With Biliary Atresia Splenic Malformation Syndrome."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "deleterious biallelic variants in polycystic kidney disease 1 like 1 (PKD1L1), a gene associated with ciliary calcium signaling and embryonic laterality determination in fish, mice, and humans."
        explanation: >-
          Whole-exome sequencing of BASM patients identified biallelic PKD1L1 variants,
          linking a ciliary laterality gene to the syndromic subtype.
      - reference: PMID:37675454
        reference_title: "Loss of zebrafish pkd1l1 causes biliary defects that have implications for biliary atresia splenic malformation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These data highlight the essential role of pkd1l1 in normal development and function of the zebrafish biliary system, supporting a role for this gene as a cause of BASM."
        explanation: >-
          Zebrafish pkd1l1 loss-of-function produces biliary defects, functionally
          validating the human BASM candidate gene.

  - name: CFC1
    notes: >-
      Heterozygous CFC1 (a NODAL co-receptor governing left-right patterning) variants
      were reported at increased frequency in polysplenia-syndrome BASM patients,
      proposed as a genetic predisposition to the syndromic laterality subtype.
    relationship_type: SUSCEPTIBILITY
    subtype: BASM
    gene_term:
      preferred_term: CFC1
      term:
        id: hgnc:18292
        label: CFC1
    evidence:
      - reference: PMID:18162845
        reference_title: "CFC1 gene involvement in biliary atresia with polysplenia syndrome."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These results suggest that heterozygous CFC1 mutation may represent a genetic predisposition to biliary atresia splenic malformation syndrome."
        explanation: >-
          Heterozygous CFC1 variants are proposed as a predisposing factor for the
          BASM laterality subtype.

environmental:
  - name: Perinatal hepatotropic viral infection
    exposure_term:
      preferred_term: viral infection
      term:
        id: ECTO:3000001
        label: exposure to virus
    description: >-
      Perinatal infection with a hepatotropic virus (cytomegalovirus, reovirus, or
      rotavirus) is a leading candidate trigger for the cholangiocyte injury and
      subsequent immune response, consistent with the seasonal clustering reported
      in some cohorts and with rotavirus induction of an experimental biliary atresia
      phenotype in newborn mice.
    evidence:
      - reference: PMID:23844248
        reference_title: "Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The murine model of BA, which mirrors the human disease, is based upon infection of newborn mice with rhesus rotavirus (RRV), leading to an obstructive cholangiopathy."
        explanation: >-
          Rotavirus infection of neonatal mice recapitulates human BA, supporting a
          perinatal viral trigger for the isolated form.
    influences_mechanisms:
      - target: Cholangiocyte Injury of the Bile Duct Epithelium
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          Perinatal hepatotropic viral infection of cholangiocytes is a candidate
          initiating insult of the disease chain.
        evidence:
          - reference: PMID:23844248
            reference_title: "Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "The murine model of BA, which mirrors the human disease, is based upon infection of newborn mice with rhesus rotavirus (RRV), leading to an obstructive cholangiopathy."
            explanation: >-
              Rotavirus infection of neonatal cholangiocytes initiates the obstructive
              cholangiopathy, acting on the cholangiocyte-injury node.

  - name: Biliatresone toxin exposure
    exposure_term:
      preferred_term: biliatresone toxin exposure
      term:
        id: ECTO:0000537
        label: exposure to toxin
    description: >-
      Biliatresone, an isoflavonoid isolated from Dysphania plants, causes an
      extrahepatic cholangiopathy resembling biliary atresia in livestock and in
      zebrafish/organoid models, providing proof of principle that an environmental
      toxin can selectively injure the extrahepatic biliary epithelium.
    evidence:
      - reference: PMID:27102575
        reference_title: "Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in zebrafish larvae."
        explanation: >-
          Biliatresone's selective extrahepatic-cholangiocyte toxicity establishes that
          an environmental toxin can produce a BA-like lesion.
      - reference: PMID:38578745
        reference_title: "Low-dose biliatresone treatment of pregnant mice causes subclinical biliary disease in their offspring: Evidence for a spectrum of neonatal injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "It likely results from a prenatal environmental exposure that spares the mother and affects the fetus."
        explanation: >-
          Low-dose prenatal biliatresone exposure in pregnant mice supports an in-utero
          environmental "hit" that affects the fetus without overt maternal illness.
    influences_mechanisms:
      - target: Cholangiocyte Injury of the Bile Duct Epithelium
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          The electrophilic toxin biliatresone selectively injures extrahepatic
          cholangiocytes, acting directly on the initiating injury node.
        evidence:
          - reference: PMID:27102575
            reference_title: "Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in zebrafish larvae."
            explanation: >-
              Biliatresone's selective extrahepatic-cholangiocyte toxicity is the toxin
              route to the cholangiocyte-injury node.

  - name: Prenatal maternal infection
    description: >-
      Population-based case-control data associate maternal intestinal and
      genitourinary tract infections during pregnancy — particularly in the third
      trimester — with an increased risk of biliary atresia in offspring, consistent
      with an in-utero inflammatory contribution to pathogenesis.
    evidence:
      - reference: PMID:38170523
        reference_title: "Maternal Prenatal Infections and Biliary Atresia in Offspring."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Results of this case-control study indicate an association between prenatal intestinal infection and genitourinary tract infection in mothers and BA occurrence in their offspring."
        explanation: >-
          A large Taiwanese case-control study links prenatal maternal gut and
          genitourinary infection to offspring biliary atresia risk.
    influences_mechanisms:
      - target: Cholangiocyte Injury of the Bile Duct Epithelium
        environmental_effect: PREDISPOSES
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Prenatal maternal infection is an epidemiologic risk factor thought to act
          indirectly (e.g. via maternal-fetal inflammation/dysbiosis) to predispose
          the fetal biliary epithelium to injury.
        evidence:
          - reference: PMID:38170523
            reference_title: "Maternal Prenatal Infections and Biliary Atresia in Offspring."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: "Results of this case-control study indicate an association between prenatal intestinal infection and genitourinary tract infection in mothers and BA occurrence in their offspring."
            explanation: >-
              Population-scale case-control evidence that maternal prenatal infection
              predisposes offspring to biliary atresia.

treatments:
  - name: Kasai Hepatoportoenterostomy
    description: >-
      The first-line surgical treatment: the fibrous biliary remnant at the porta
      hepatis is excised and a Roux-en-Y jejunal limb is anastomosed to the exposed
      surface to re-establish bile drainage. Outcome is strongly age-dependent —
      results are best when performed before ~60 days of life. It is palliative in
      many patients but can defer or avoid transplantation.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: surgical procedure
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Fibro-obliteration of the Biliary Tree
        treatment_effect: BYPASSES
        description: >-
          The portoenterostomy surgically bypasses the obliterated extrahepatic
          biliary tree, re-establishing bile drainage from the porta hepatis.
    evidence:
      - reference: PMID:36051179
        reference_title: "Biliary atresia and congenital disorders of the extrahepatic bile ducts."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "BA is always treated surgically, and performing the surgery before the age of 2 mo greatly increases its effectiveness and extends the time until the need for liver transplantation arises."
        explanation: >-
          Establishes the Kasai portoenterostomy as first-line surgery and its strong
          age-dependence (best before ~2 months).

  - name: Liver Transplantation
    description: >-
      Definitive treatment for patients who fail the Kasai procedure or progress to
      end-stage liver disease. Biliary atresia is the most common indication for
      pediatric liver transplantation worldwide.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: liver transplantation
      term:
        id: NCIT:C15271
        label: Liver Transplantation
    evidence:
      - reference: PMID:42486594
        reference_title: "Biliary Atresia: A Focus on the Patient Journey from Diagnosis to Transplant."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "It remains the leading indication for liver transplant in children without any disease-modifying medical therapies."
        explanation: >-
          Biliary atresia is the leading indication for pediatric liver
          transplantation, supporting transplant as the definitive therapy.

  - name: Ursodeoxycholic Acid
    description: >-
      A choleretic bile acid used adjunctively after the Kasai procedure to promote
      bile flow and reduce cholestatic injury.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: ursodeoxycholic acid
          term:
            id: CHEBI:9907
            label: ursodeoxycholic acid
    target_mechanisms:
      - target: Cholestasis and Progression to Biliary Cirrhosis
        treatment_effect: MODULATES
        description: >-
          As a choleretic bile acid, UDCA promotes bile flow and shifts the bile-acid
          pool to less hepatotoxic species, mitigating the cholestatic node.

  - name: Prophylactic Antibiotics for Cholangitis
    description: >-
      Antibiotic prophylaxis is commonly used after portoenterostomy to reduce the
      frequency of ascending bacterial cholangitis, and acute cholangitis episodes
      are treated with broad-spectrum antibiotics.
    treatment_term:
      preferred_term: antibiotic therapy
      term:
        id: NCIT:C15620
        label: Antibiotic Therapy

  - name: Fat-Soluble Vitamin and Nutritional Support
    description: >-
      Cholestasis causes fat malabsorption and deficiency of the fat-soluble
      vitamins A, D, E, and K; supplementation plus MCT-enriched high-calorie
      nutrition is a mainstay of supportive care to prevent deficiency and support
      growth.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: nutritional support
      term:
        id: NCIT:C15433
        label: Nutritional Support

  - name: Post-Kasai Corticosteroid Therapy
    description: >-
      High-dose corticosteroids after hepatoportoenterostomy have been trialed as an
      adjuvant to improve bile drainage, but the definitive multicenter START
      randomized trial found no statistically significant benefit in jaundice
      clearance and an association with earlier serious adverse events. Their use
      post-Kasai remains controversial and center-dependent.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: corticosteroid pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    evidence:
      - reference: PMID:24794368
        reference_title: "Use of corticosteroids after hepatoportoenterostomy for bile drainage in infants with biliary atresia: the START randomized clinical trial."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: "high-dose steroid therapy following surgery did not result in statistically significant treatment differences in bile drainage at 6 months, although a small clinical benefit could not be excluded."
        explanation: >-
          The definitive randomized trial found no significant benefit of post-Kasai
          steroids, tempering this adjuvant's evidence base.

  - name: Maralixibat (IBAT Inhibitor)
    description: >-
      Maralixibat is an oral, minimally-absorbed ileal bile acid transporter (IBAT)
      inhibitor that lowers hepatic bile acid concentration; it is approved for
      cholestatic pruritus in Alagille syndrome and is under investigation
      specifically in biliary atresia after Kasai portoenterostomy.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    evidence:
      - reference: PMID:32653991
        reference_title: "Ileal bile acid transporter inhibition as an anticholestatic therapeutic target in biliary atresia and other cholestatic disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "IBAT inhibitors may potentially lessen or delay liver damage associated with the hepatotoxicity and cholangiopathy of bile acid accumulation."
        explanation: >-
          Provides the mechanistic rationale for IBAT inhibition (maralixibat) as an
          anticholestatic strategy in biliary atresia.
    target_mechanisms:
      - target: Cholestasis and Progression to Biliary Cirrhosis
        treatment_effect: INHIBITS
        description: >-
          IBAT (ASBT/SLC10A2) inhibition blocks ileal bile-acid reuptake, lowering
          the hepatic bile-acid pool that drives the cholestatic-injury node.

  - name: N-Acetylcysteine (post-Kasai)
    description: >-
      Short-course intravenous N-acetylcysteine (150 mg/kg/day for 7 days starting
      post-Kasai) was evaluated in a Phase 2 minimax-design trial aiming to normalize
      total serum bile acids; the primary endpoint was not met, though NAC was
      well-tolerated. Its mechanistic rationale comes from single-cell RNA-seq showing
      NAC partially reverses hepatic CD177+ neutrophil immune dysfunction in BA.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: N-acetyl-L-cysteine
          term:
            id: CHEBI:28939
            label: N-acetyl-L-cysteine
    evidence:
      - reference: PMID:40489761
        reference_title: "A phase 2 trial of short-term intravenous N-acetylcysteine in biliary atresia after Kasai portoenterostomy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: "Although the primary endpoint was not met, NAC therapy was generally well-tolerated."
        explanation: >-
          A Phase 2 trial of post-Kasai NAC did not meet its bile-acid endpoint but
          established tolerability, tempering the evidence for this adjuvant.

clinical_trials:
  - name: NCT04524390
    phase: PHASE_II
    status: ACTIVE_NOT_RECRUITING
    description: >-
      Randomized, double-blind, placebo-controlled Phase 2 study of the IBAT inhibitor
      maralixibat in infants with biliary atresia after hepatoportoenterostomy
      (Breakthrough Therapy designation for biliary atresia).
    evidence:
      - reference: clinicaltrials:NCT04524390
        reference_title: "Randomized, Double-Blind, Placebo-Controlled Phase 2 Study to Evaluate the Efficacy and Safety of Maralixibat in the Treatment of Subjects With Biliary Atresia After Hepatoportoenterostomy"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "A study to evaluate the efficacy and safety of maralixibat in infants with Biliary Atresia (BA) after Hepatoportoenterostomy (HPE, also known as the Kasai procedure)."
        explanation: >-
          Registers the Phase 2 maralixibat post-Kasai trial referenced by the
          maralixibat treatment entry.

animal_models:
  - name: Rhesus rotavirus (RRV) neonatal mouse model
    species: Mouse
    genotype: Wild-type BALB/c neonate infected with rhesus rotavirus
    description: >-
      The canonical experimental model of biliary atresia: infection of newborn mice
      with rhesus rotavirus produces an obstructive extrahepatic cholangiopathy that
      mirrors the human disease, with cholangiocyte infection, periductal
      inflammation, and progressive duct obliteration.
    publication: PMID:23844248
    modeled_mechanisms:
      - target: Cholangiocyte Injury of the Bile Duct Epithelium
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Rotavirus replication in cholangiocytes initiates the obstructive
          cholangiopathy, reproducing the cholangiocyte-injury and duct-obliteration
          sequence of human biliary atresia.
        limitations: >-
          The model is driven by a single defined virus in an inbred neonatal mouse
          and is time-window restricted; it may not capture the etiologic
          heterogeneity or the developmental (BASM) forms of human disease.
        evidence:
          - reference: PMID:23844248
            reference_title: "Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "The murine model of BA, which mirrors the human disease, is based upon infection of newborn mice with rhesus rotavirus (RRV), leading to an obstructive cholangiopathy."
            explanation: >-
              Establishes the RRV neonatal-mouse model as recapitulating the human
              cholangiocyte-injury/obstruction mechanism.

  - name: Biliatresone zebrafish model
    species: Zebrafish
    genotype: Wild-type larvae exposed to the isoflavonoid toxin biliatresone
    description: >-
      Exposure of zebrafish larvae to the plant toxin biliatresone selectively
      injures the extrahepatic biliary epithelium, providing a toxin-driven model of
      the extrahepatic cholangiopathy of biliary atresia.
    publication: PMID:27102575
    modeled_mechanisms:
      - target: Cholangiocyte Injury of the Bile Duct Epithelium
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Biliatresone reproduces selective extrahepatic-cholangiocyte injury,
          modeling the toxin route to the cholangiocyte-injury node.
        limitations: >-
          Zebrafish biliary anatomy differs from the human extrahepatic tree, and the
          specific human relevance of biliatresone exposure remains unproven; the
          model captures the injury mechanism rather than human etiology.
        evidence:
          - reference: PMID:27102575
            reference_title: "Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in zebrafish larvae."
            explanation: >-
              Demonstrates selective extrahepatic-cholangiocyte toxicity, grounding
              the toxin model of the injury node.


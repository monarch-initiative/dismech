    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Biliary defects were reproduced with the EGFR-blocker AG1478 alone or with Mo-arf6
      at lower doses of
      each agent and rescued with arf6 mRNA.
    explanation: >-
      Perturbation and rescue support EGFR–ARF6 involvement in fish development.

- name: Newborn direct or conjugated bilirubin screening
  description: >-
    A two-stage strategy measures direct/conjugated bilirubin in the first 60 hours
    using laboratory-specific
    newborn reference intervals, then repeats abnormal results by the two-week visit.
    Rising values or repeat
    values above 1 mg/dL prompt further assessment. In 124,385 newborns, all seven
    known cases were detected,
    but sensitivity had a wide confidence interval and false-negative ascertainment
    was incomplete. A separate
    pre-post analysis associated implementation with younger Kasai age, not proof
    of a survival benefit.
  evidence:
  - reference: PMID:32207797
    reference_title: Diagnostic Yield of Newborn Screening for Biliary Atresia Using Direct or Conjugated Bilirubin Measurements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In stage 1, all newborns were tested within the first 60 hours of life, with
      a positive screening result
      defined as bilirubin levels exceeding derived 95th percentile reference intervals.
    explanation: >-
      First-stage screening as summarized in the abstract; full methods describe site-specific
      newborn reference
      intervals.
  - reference: PMID:32207797
    reference_title: Diagnostic Yield of Newborn Screening for Biliary Atresia Using Direct or Conjugated Bilirubin Measurements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In stage 2, infants who had a positive screening result in stage 1 were retested
      at or before the 2-week
      well-child visit, with a positive screening result defined as bilirubin levels
      greater than the stage
      1 result or greater than 1 mg/dL.
    explanation: >-
      Second-stage screen requires a rise or a value above 1 mg/dL.
  - reference: PMID:32207797
    reference_title: Diagnostic Yield of Newborn Screening for Biliary Atresia Using Direct or Conjugated Bilirubin Measurements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Newborn screening with direct or conjugated bilirubin measurements detected
      all known infants with biliary
      atresia in the study population, although the 95% CI around the sensitivity
      estimate was wide and the
      study design did not ensure complete ascertainment of false-negative results.
    explanation: >-
      The abstract explicitly qualifies sensitivity and incomplete ascertainment.
- name: Primary-care assessment at two to four weeks
  description: >-
    The 2025 AAP clinical report recommends assessing eye color, stool color and prior
    laboratory results at
    the two- to four-week visit to decide whether direct/conjugated bilirubin measurement
    is needed. Persistent
    jaundice or pale stools requires prompt evaluation.
  evidence:
  - reference: DOI:10.1542/peds.2024-070077
    reference_title: 'Guidance for the Primary Care Provider in Identifying Infants With Biliary Atresia by 2–4 Weeks of Life: Clinical Report'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The strategy involves examining every infant’s eye color, stool color, and prior
      laboratory results to
      determine whether measurement of a direct or conjugated bilirubin level is warranted.
    explanation: >-
      AAP clinical report, abstract available; full report retrieval was blocked.
    quote_role: REVIEW_SYNTHESIS
- name: Liver biopsy
  description: >-
    Portal expansion, ductular reaction and bile plugs support biliary obstruction,
    but early biopsy can be
    nonspecific and similar changes occur in other neonatal cholestases. Interpret
    expert histology alongside
    imaging and clinical evaluation rather than using a negative early biopsy to exclude
    biliary atresia.
  evidence:
  - reference: PMID:32518681
    reference_title: 'Biliary atresia: pathology, etiology and pathogenesis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Histopathological findings in liver biopsies include the expansion of the portal
      tracts, with edematous
      fibroplasia and bile ductular proliferation, with bile plugs in duct lumen.
    explanation: >-
      Disease-associated obstructive histology, interpreted in clinical context.
    quote_role: REVIEW_SYNTHESIS
genetic:
- name: GPC1
  notes: >-
    Candidate susceptibility gene supported by heterozygous 2q37.3 deletions overlapping
    GPC1 in 6/61 cases
    versus 4/5,088 controls and by zebrafish knockdown/rescue experiments. Reduced
    apical GPC1 staining also
    occurred in non-BA infantile cholestasis and was measured in different patients
    from the deletion carriers.
    Common GPC1 SNP associations in the 2020 Han Chinese study were nominal and did
    not survive its multiple-testing
    threshold; they are not definitive Mendelian pathogenic alleles.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: GPC1
    term:
      id: hgnc:4449
      label: GPC1
  evidence:
  - reference: PMID:32315284
    reference_title: Association of common variation in ADD3 and GPC1 with biliary atresia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two GPC1 SNPs in high linkage disequilibrium (LD) showed nominal association
      with BA susceptibility (PAllele
      = 0.03 for rs6707262 and PAllele = 0.04 for rs6750380), and were eQTL of GPC1.
    explanation: >-
      Nominal common-variant associations; neither P value survives correction for
      the tested markers.

  - reference: PMID:23336978
    reference_title: Evidence from human and zebrafish that GPC1 is a biliary atresia susceptibility gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We observed a statistically significant increase in deletions at 2q37.3 in patients
      with BA that resulted
      in deletion of one copy of GPC1
    explanation: >-
      Rare copy-number association, not proof of sufficiency or penetrance.
  - reference: PMID:23336978
    reference_title: Evidence from human and zebrafish that GPC1 is a biliary atresia susceptibility gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Exposure of the gpc1 morphants to cyclopamine, a Hedgehog antagonist, partially
      rescued the gpc1-knockdown
      phenotype.
    explanation: >-
      Developmental perturbation and rescue in zebrafish.
- name: ADD3
  notes: >-
    Common noncoding susceptibility variants at the ADD3 locus associate with biliary
    atresia, particularly
    in studied Asian populations. rs17095355 is a linked marker, not a demonstrated
    causal nucleotide. In 2026
    H69 reporter experiments, risk haplotypes at E2, E4 and E10 increased activity,
    E9 decreased it, and the
    lead-SNP E1 fragment showed no allelic difference. Reporter activity does not
    directly quantify endogenous
    ADD3 expression. Both overexpression and loss of add3a disrupt zebrafish biliary
    development, supporting
    dosage sensitivity rather than one universal directional effect of every human
    risk allele.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: ADD3
    term:
      id: hgnc:245
      label: ADD3
  evidence:
  - reference: PMID:32315284
    reference_title: Association of common variation in ADD3 and GPC1 with biliary atresia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three SNPs in ADD3 were significantly associated with BA, and rs17095355 was
      the top SNP
    explanation: >-
      Association in the studied cohort; the marker does not by itself establish causality
      or predict individual
      disease.
  - reference: PMID:41589307
    reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      four elements (E2, E4, E9 and E10) showed allele-specific reporter activity
      differences
    explanation: >-
      H69 cell reporter assays resolve functional differences among linked regulatory
      fragments.
  - reference: PMID:41589307
    reference_title: Multiple susceptibility enhancer variants increasing ADD3 expression predisposes to biliary atresia risk.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Both overexpression and knockdown of add3a in zebrafish disrupted hepatobiliary
      function and development,
      resulting in gallbladder hypoplasia/agenesis and reduced intrahepatic bile duct
      density.
    explanation: >-
      Bidirectional dosage perturbation in a model, distinct from the effect of any
      individual human allele.
- name: PKD1L1
  notes: >-
    Rare candidate biallelic variants were identified in five of 67 children selected
    using a broad BASM definition,
    including some without splenic malformation. Reported variants included missense,
    splice-site and truncating
    changes, with limited patient functional evidence. Zebrafish pkd1l1 loss supports
    a role in laterality
    and biliary development, but does not establish penetrance, causality of each
    human variant, or a general
    Mendelian form of BASM.
  relationship_type: SUSCEPTIBILITY
  subtype: BASM
  gene_term:
    preferred_term: PKD1L1
    term:
      id: hgnc:18053
      label: PKD1L1
  evidence:
  - reference: PMID:30664273
    reference_title: Identification of Polycystic Kidney Disease 1 Like 1 Gene Variants in Children With Biliary Atresia Splenic Malformation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      deleterious biallelic variants in polycystic kidney disease 1 like 1 (PKD1L1),
      a gene associated with
      ciliary calcium signaling and embryonic laterality determination in fish, mice,
      and humans.
    explanation: >-
      Candidate human variants from an ascertained cohort, requiring further functional
      and genetic validation.
  - reference: PMID:37675454
    reference_title: Loss of zebrafish pkd1l1 causes biliary defects that have implications for biliary atresia splenic malformation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data highlight the essential role of pkd1l1 in normal development and
      function of the zebrafish
      biliary system, supporting a role for this gene as a cause of BASM.
    explanation: >-
      Functional relevance of pkd1l1 to fish biliary development; this does not validate
      each human variant
      as pathogenic.

- name: CFC1
  notes: >-
    A small study of ten patients with biliary atresia and polysplenia identified
    heterozygous c.433G>A (p.Ala145Thr)
    in five, at approximately twice the control frequency. This is a candidate predisposition
    finding, not
    proof of a high-penetrance causal variant or a validated recurrence estimate.
  relationship_type: SUSCEPTIBILITY
  subtype: BASM
  gene_term:
    preferred_term: CFC1
    term:
      id: hgnc:18292
      label: CFC1
  evidence:
  - reference: PMID:18162845
    reference_title: CFC1 gene involvement in biliary atresia with polysplenia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The heterozygous transition c.433G>A (Ala145Thr) located in exon 5 was identified
      in 5 patients, with
      a twice-higher frequency than in control patients.
    explanation: >-
      Small candidate-gene study; no Mendelian penetrance inference.
- name: ARF6
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: ARF6
    term:
      id: hgnc:659
      label: ARF6
  notes: >-
    Candidate common-variant locus downstream of ARF6 in an initial European-ancestry
    study. The linked rs3126184
    and rs10140366 markers overlap a putative regulatory region; direct endogenous
    allelic effects were not
    established. Zebrafish arf6 knockdown and EGFR-inhibition experiments support
    a developmental role. The
    tested ARF6 signal did not replicate in the 2020 Han Chinese cohort, limiting
    generalization.
  evidence:
  - reference: PMID:26379158
    reference_title: The Role of ARF6 in Biliary Atresia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the SNPs rs3126184 and rs10140366 in a 3' flanking enhancer region for ARF6
      demonstrated higher minor
      allele frequencies
    explanation: >-
      Initial association study, with linked regulatory markers rather than proven
      causal variants.
  - reference: PMID:26379158
    reference_title: The Role of ARF6 in Biliary Atresia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Biliary defects were reproduced with the EGFR-blocker AG1478 alone or with Mo-arf6
      at lower doses of
      each agent and rescued with arf6 mRNA.
    explanation: >-
      Perturbation and rescue support the candidate pathway in zebrafish.
- name: EFEMP1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: EFEMP1
    term:
      id: hgnc:3218
      label: EFEMP1
  notes: >-
    Intronic common variants reached genome-wide significance in a meta-analysis of
    two European-American cohorts.
    The causal variant, regulatory target and direction of effect remain unresolved.
    Increased expression in
    diseased human liver also occurred in other cholestatic diseases, so it may reflect
    injury or fibrosis.
    Heterozygous Efemp1 loss in mice reduces organized extrahepatic-duct elastic fibers
    and changes duct mechanics;
    this is functional plausibility, not a knock-in model of the human risk alleles
    or spontaneous biliary
    atresia.
  evidence:
  - reference: PMID:30102696
    reference_title: A genome-wide association study identifies a susceptibility locus for biliary atresia on 2p16.1 within the gene EFEMP1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Meta-analysis revealed three genome-wide significant BA-associated SNPs on 2p16.1
    explanation: >-
      Association signal within EFEMP1; gene assignment and allelic mechanism remain
      candidate interpretations.
  - reference: PMID:39717503
    reference_title: Biliary atresia susceptibility gene EFEMP1 regulates extrahepatic bile duct elastic fiber formation and mechanics.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      in adult Efemp1 +/- mouse ducts, elastin organization into fibers is decreased
      by approximately half.
    explanation: >-
      Reduced elastic-fiber organization in heterozygous mouse ducts supports mechanical
      relevance.
environmental:
- name: Perinatal hepatotropic viral infection
  exposure_term:
    preferred_term: viral infection
    term:
      id: ECTO:3000001
      label: exposure to virus
  description: >-
    Viral exposure is a proposed trigger, not an established cause of human biliary
    atresia. Neonatal RRV infection
    induces an age-dependent obstructive cholangiopathy in mice. Human detection of
    viruses such as CMV is
    heterogeneous and cannot alone establish whether infection caused, followed, or
    modified the biliary disease.
  evidence:
  - reference: PMID:23844248
    reference_title: Rotavirus replication in the cholangiocyte mediates the temporal dependence of murine biliary atresia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Early RRV infection induced symptoms in 95% of pups with a mortality rate of
      80%. In contrast, late infection
      caused symptoms in only 50% of mice, and 100% of pups survived.
    explanation: >-
      Experimental susceptibility depends on neonatal timing; this does not establish
      human viral causation.
- name: Biliatresone toxin exposure
  exposure_term:
    preferred_term: biliatresone toxin exposure
    term:
      id: ECTO:0000537
      label: exposure to toxin
  description: >-
    Biliatresone is an experimental electrophilic toxin that selectively damages extrahepatic
    cholangiocytes
    in zebrafish. Human exposure as a cause of biliary atresia is unproven. Low-dose
    prenatal exposure in mice
    altered offspring bile-acid profiles and hepatic immune cells without producing
    histologic duct injury
    or fibrosis at the measured time points.
  evidence:
  - reference: PMID:27102575
    reference_title: Glutathione antioxidant pathway activity and reserve determine toxicity and specificity of the biliary toxin biliatresone in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in
      zebrafish larvae.
    explanation: >-
      Biliatresone selectively injures extrahepatic cholangiocytes in zebrafish larvae;
      human etiologic relevance
      is unproven.
  - reference: PMID:38578745
    reference_title: 'Low-dose biliatresone treatment of pregnant mice causes subclinical biliary disease in their offspring: Evidence for a spectrum of neonatal injury.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Pups had no evidence of histological liver or bile duct injury or fibrosis at
      either timepoint. In addition,
      growth was normal.
    explanation: >-
      Prenatal low-dose model produced biochemical and immune changes rather than
      overt fibro-obliterative
      atresia.
  - reference: PMID:38578745
    reference_title: 'Low-dose biliatresone treatment of pregnant mice causes subclinical biliary disease in their offspring: Evidence for a spectrum of neonatal injury.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      serum levels of glycocholic acid were elevated at P5, suggesting altered bile
      metabolism, and the serum
      bile acid profile became increasingly abnormal through P21
    explanation: >-
      Measured offspring bile-acid phenotype after prenatal exposure.
- name: Prenatal maternal infection
  description: >-
    A Taiwanese administrative-data case-control study associated recorded maternal
    intestinal and genitourinary
    infections with offspring biliary atresia. Diagnoses were code-based, pathogens
    were usually unspecified,
    and unmeasured genetic and environmental confounding remained. The findings do
    not demonstrate fetal infection,
    a causal injury pathway, or a prevention effect.
  evidence:
  - reference: PMID:38170523
    reference_title: Maternal Prenatal Infections and Biliary Atresia in Offspring.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results of this case-control study indicate an association between prenatal
      intestinal infection and
      genitourinary tract infection in mothers and BA occurrence in their offspring.
    explanation: >-
      A large Taiwanese case-control study links prenatal maternal gut and
      genitourinary infection to offspring biliary atresia risk.
treatments:
- name: Kasai Hepatoportoenterostomy
  description: >-
    Time-sensitive surgery excises the fibrotic extrahepatic remnant and connects
    a Roux-en-Y jejunal limb
    to the porta hepatis to establish bile drainage. Earlier intervention generally
    improves outcomes; age
    alone is not a universal cutoff for eligibility. Progressive intrahepatic disease
    can persist despite jaundice
    clearance, requiring long-term follow-up.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Fibro-obliteration of the Biliary Tree
    treatment_effect: BYPASSES
    description: >-
      The portoenterostomy surgically bypasses the obliterated extrahepatic
      biliary tree, re-establishing bile drainage from the porta hepatis.
    evidence:
    - reference: PMID:36051179
      reference_title: Biliary atresia and congenital disorders of the extrahepatic bile ducts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        In the 1950s, with the development of Kasai portoenterostomy by Dr. Morio
        Kasai, it became possible
        to treat BA surgically
      explanation: >-
        Surgical drainage bypasses the extrahepatic obstruction.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:36051179
    reference_title: Biliary atresia and congenital disorders of the extrahepatic bile ducts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BA is always treated surgically, and performing the surgery before the age of
      2 mo greatly increases
      its effectiveness and extends the time until the need for liver transplantation
      arises.
    explanation: >-
      Establishes the Kasai portoenterostomy as first-line surgery and its strong
      age-dependence (best before ~2 months).

    quote_role: REVIEW_SYNTHESIS
- name: Liver Transplantation
  description: >-
    Indicated after failed drainage or progressive liver disease, including decompensated
    cirrhosis, refractory
    portal-hypertensive complications, severe growth failure or recurrent severe cholangitis.
    Selected infants
    with advanced disease may undergo primary transplantation. Assessment depends
    on the clinical course, not
    a single universal age or laboratory threshold.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: PMID:42569433
    reference_title: Diagnostic and management guidelines for biliary atresia in 2025.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Indications for LT after KPE include poor bile drainage and unresolved jaundice,
      poor bile flow in the
      early stages, advanced development of cirrhosis despite good bile flow.
    explanation: >-
      Consensus guidance describes post-Kasai transplant indications.
    quote_role: REVIEW_SYNTHESIS
- name: Ursodeoxycholic Acid
  description: >-
    Commonly used empirically after Kasai to improve bile flow and biochemical indices.
    Evidence for improved
    native-liver survival is insufficient; dosing and duration vary between centers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  target_mechanisms:
  - target: Impaired Bile Drainage
    treatment_effect: MODULATES
    description: >-
      As a choleretic bile acid, UDCA promotes bile flow and shifts the bile-acid
      pool to less hepatotoxic species, mitigating the cholestatic node.

  evidence:
  - reference: PMID:42569433
    reference_title: Diagnostic and management guidelines for biliary atresia in 2025.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Currently, the use of these medications is largely empirical, with different
      medical facilities adopting
      varying dosing schedules. There are no definitive guidelines on when to discontinue
      treatment
    explanation: >-
      The guideline describes empirical use of bile-acid-modulating medication after
      Kasai.
    quote_role: REVIEW_SYNTHESIS
- name: Prophylactic Antibiotics for Cholangitis
  description: >-
    Post-Kasai prophylaxis is common and conditionally recommended in some guidance,
    but studies conflict and
    a reliable reduction in cholangitis or improved native-liver survival has not
    been established. Prophylaxis
    must be distinguished from treatment of a suspected acute episode.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy

  evidence:
  - reference: PMID:42569433
    reference_title: Diagnostic and management guidelines for biliary atresia in 2025.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Studies have produced conflicting results on the effectiveness of antibiotics
      in preventing postoperative
      cholangitis after KPE
    explanation: >-
      Evidence for preventive antibiotics is uncertain.
    quote_role: REVIEW_SYNTHESIS
- name: Fat-Soluble Vitamin and Nutritional Support
  description: >-
    Provide individualized energy-dense feeding, including medium-chain triglycerides
    while retaining essential
    long-chain fats, and monitor growth and fat-soluble vitamins A, D, E and K. Replace
    deficiencies and use
    tube feeding or, when necessary, parenteral nutrition if growth remains inadequate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support

  evidence:
  - reference: PMID:42569433
    reference_title: Diagnostic and management guidelines for biliary atresia in 2025.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Malnutrition is a common complication in children with BA, necessitating regular
      testing for fat-soluble
      vitamins and micronutrients, with supplementation of deficits as needed
    explanation: >-
      Consensus supports nutritional surveillance and supplementation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42569433
    reference_title: Diagnostic and management guidelines for biliary atresia in 2025.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      For children with cholestasis, formulas enriched with MCT (>30% of total fat)
      are recommended, while
      ensuring that at least 20% of energy intake comes from long-chain triglycerides
      (LCT) to prevent essential
      fatty acid deficiency (EFAD)
    explanation: >-
      MCT enrichment must preserve an adequate source of essential fatty acids.
    quote_role: REVIEW_SYNTHESIS
- name: Post-Kasai Corticosteroid Therapy
  description: >-
    Randomized trial findings differ. The multicenter double-blind START trial (140
    infants) did not significantly
    improve six-month bile drainage or two-year native-liver survival and produced
    earlier serious adverse
    events. A later single-center open-label randomized trial (200 type III cases)
    reported improved jaundice
    clearance and native-liver survival with 10–12 weeks of steroids. Differences
    in regimen, population and
    study design limit a universal treatment conclusion; use remains center-dependent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  evidence:
  - reference: PMID:24794368
    reference_title: 'Use of corticosteroids after hepatoportoenterostomy for bile drainage in infants with biliary atresia: the START randomized clinical trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high-dose steroid therapy following surgery did not result in statistically
      significant treatment differences
      in bile drainage at 6 months, although a small clinical benefit could not be
      excluded.
    explanation: >-
      START did not demonstrate a significant benefit for its tested regimen; its
      authors could not exclude
      a smaller clinical effect.

  - reference: PMID:35170539
    reference_title: 'Effect of Adjuvant Steroid Therapy in Type 3 Biliary Atresia: A Single-Center, Open-Label, Randomized Controlled Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The proportion of participants that are jaundice free without liver transplantation
      was significantly
      higher in the steroid group than in the control group at 6 months (54.1% vs
      31.0%, P = 0.0015).
    explanation: >-
      Later open-label randomized evidence differs from START; this does not establish
      equal benefit across
      regimens or populations.
- name: Maralixibat (IBAT Inhibitor)
  description: >-
    Investigational in biliary atresia. The completed 75-participant EMBARK randomized
    trial did not improve
    its primary 26-week total-bilirubin endpoint versus placebo. A separate uncontrolled
    six-patient compassionate-use
    series reported pruritus improvement, with inconsistent biochemical responses
    and two subsequent transplants.
    Symptomatic observations in selected children do not establish disease modification
    or native-liver survival
    benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: maralixibat
      term:
        id: CHEBI:748720
        label: maralixibat
  evidence:
  - reference: url:https://www.clinicaltrialsregister.eu/ctr-search/trial/2020-000974-22/results
    reference_title: EudraCT Number 2020-000974-22 - Clinical trial results - EU Clinical Trials Register
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Primary: Mean change in Total Serum Bilirubin ... Maralixibat v Placebo ...
      Number of subjects included
      in analysis ... 75 ... P-value ... = 0.7419 ... Parameter type ... Least-Square
      mean ... Point estimate
      ... -0.39 ... Confidence interval ... 95% ... -2.76 ... 1.97
    explanation: >-
      Sponsor-posted final EU registry results for NCT04524390: no significant primary
      bilirubin benefit at
      26 weeks; adjusted difference −0.39 mg/dL (95% CI −2.76 to 1.97).
  - reference: PMID:42666930
    reference_title: 'Real-world use of maralixibat in biliary atresia: a case series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All patients reported improved CSS with no increased usage of other antipruritic
      medications, and the
      medication was well tolerated.
    explanation: >-
      Six-patient retrospective compassionate-use series; no control group and short
      follow-up.
  target_mechanisms:
  - target: Impaired Bile Drainage
    treatment_effect: MODULATES
    description: >-
      IBAT inhibition reduces enterohepatic bile-acid recycling as a pharmacologic
      rationale. EMBARK did not
      establish a clinical improvement in post-Kasai cholestasis.

    evidence:
    - reference: PMID:32653991

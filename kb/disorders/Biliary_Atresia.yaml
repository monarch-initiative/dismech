- name: Immune-Mediated Periductal Inflammation
  biological_scale: TISSUE
  description: >-
    Periductal innate and adaptive immune activation accompanies biliary epithelial
    injury. Human tissue studies
    show inflammatory infiltrates and regulatory abnormalities; perturbation studies
    in neonatal RRV mice support
    contributions from Th1, Th17, B-cell and macrophage pathways. No single experimental
    immune mechanism establishes
    the cause of all human cases.
  cell_types:

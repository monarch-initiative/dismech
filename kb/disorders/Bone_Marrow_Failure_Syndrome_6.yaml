experimental_models:
- name: CRISPR/Cas9 MDM4-deleted healthy-donor HSPCs
  description: >
    MDM4 deleted in hematopoietic stem and progenitor cells from healthy
    donors, producing MDM4-haploinsufficient cells on an otherwise normal
    genetic background. This is the cleanest available test of dosage, since
    it isolates MDM4 copy number from patient genetic background.
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:41758987
  modeled_mechanisms:
  - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Human primary HSPCs with engineered MDM4 haploinsufficiency reproduce
      the p53 hyperactivity and the functional haematopoietic deficit.
    limitations: >-
      Engineered deletion is not the patient allelic spectrum: four of the six
      patient alleles are truncating, but two are missense, and a missense
      allele may retain partial function or act differently from a clean
      deletion. Engraftment is scored in immunodeficient mice, so the readout
      is a xenograft niche rather than a human marrow.
    readouts:
    - name: p53 transcriptional activity
      target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
      direction: INCREASED
      interpretation: Direct readout of the released p53 brake.
      evidence:
      - reference: PMID:41758987
        reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The resulting MDM4-haploinsufficient HSPCs exhibited increased p53 activity, impaired colony-forming capacity, and reduced engraftment potential in immunodeficient mice."
        explanation: Reports increased p53 activity in the edited HSPCs.
    - name: Colony-forming capacity
      target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
      direction: DECREASED
      interpretation: Functional cost of p53 hyperactivity to progenitor proliferation.
      evidence:
      - reference: PMID:41758987
        reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The resulting MDM4-haploinsufficient HSPCs exhibited increased p53 activity, impaired colony-forming capacity, and reduced engraftment potential in immunodeficient mice."
        explanation: Reports impaired colony formation in the edited HSPCs.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used CRISPR/Cas9 to delete MDM4 in healthy donor hematopoietic stem and progenitor cells (HSPCs)."
    explanation: >
      Establishes the model system and that it is built on healthy-donor human
      primary cells.

- name: Patient-variant knock-in iPSC-derived hematopoiesis
  description: >
    Patient-specific MDM4 variants introduced into induced pluripotent stem
    cells, explicitly to test variant effects in a confounder-free genetic
    background. Complements the CRISPR HSPC model by testing the actual
    patient alleles rather than a deletion.
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:41758987
  modeled_mechanisms:
  - target: Impaired HSPC Self-Renewal and Multilineage Output
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Reduced erythroid and myeloid output with elevated p21, reproducing the
      multilineage deficit attributable to p53 hyperactivity.
    limitations: >-
      iPSC-derived haematopoiesis is developmentally distinct from adult
      bone-marrow haematopoiesis and is generally biased toward primitive or
      yolk-sac-like programmes, so a differentiation deficit measured here is
      not straightforwardly a statement about adult marrow. The system also
      cannot model the marrow niche or the decades-long clonal dynamics that
      the somatic TP53 arm of this disease turns on.
    readouts:
    - name: Erythroid and myeloid cell output
      target: Impaired HSPC Self-Renewal and Multilineage Output
      direction: DECREASED
      interpretation: Multilineage differentiation deficit in the patient genotypes.
      evidence:
      - reference: PMID:41758987
        reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MDM4-mutant iPSCs yielded significantly reduced erythroid and myeloid cells and exhibited increased p53 activity, as evidenced by elevated p21 expression, confirming the role of MDM4 in regulating hematopoiesis through p53."
        explanation: Reports the reduced two-lineage output.
    - name: p21 expression
      target: Impaired HSPC Self-Renewal and Multilineage Output
      direction: INCREASED
      interpretation: p53 transcriptional-target readout confirming pathway activation.
      evidence:
      - reference: PMID:41758987
        reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MDM4-mutant iPSCs yielded significantly reduced erythroid and myeloid cells and exhibited increased p53 activity, as evidenced by elevated p21 expression, confirming the role of MDM4 in regulating hematopoiesis through p53."
        explanation: p21 elevation is the reported p53-activity readout.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To study variant effects in a confounder-free genetic background, we introduced patient-specific MDM4 variants into induced pluripotent stem cells (iPSCs)."
    explanation: >
      States the model and, usefully, the authors' reason for building it -
      isolating variant effect from patient background.

animal_models:
- name: p53 C-terminal truncation (p53 delta-31) mouse, Mdm4-dosage sensitized
  species: Mouse
  genotype: Trp53 delta-31 (C-terminal domain deletion), homozygous and heterozygous; Mdm4 dosage reduced
  publication: PMID:23770245
  description: >
    Not an MDM4 model in the first instance - it is a p53-activation model that
    was independently sensitized by lowering Mdm4. That makes it evidence
    about the axis rather than about the gene, which is why its fidelity is
    recorded as moderate and why its telomere findings are held in a
    HUMAN_MODEL_MISMATCH discussion rather than curated as human edges.
  modeled_mechanisms:
  - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      Reproduces the causal direction - increased p53 activity produces
      aplastic anaemia, and reducing Mdm4 makes it dramatically worse - but
      arrives there by truncating p53 rather than by an MDM4 variant.
    limitations: >-
      The primary lesion is in p53 itself, not MDM4; Mdm4 dosage enters as a
      modifier. The mouse also develops pulmonary fibrosis and short telomeres,
      neither of which has been reported in human BMFS6, so the model's
      phenotype is broader than the human disease as currently described.
    readouts:
    - name: Aplastic anemia
      target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
      direction: INCREASED
      interpretation: >-
        Marrow failure arising directly from increased p53 activity, the
        mouse counterpart of the human haematopoietic phenotype.
      evidence:
      - reference: PMID:23770245
        reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "homozygous mutant mice expressing p53Δ31, a p53 lacking the C-terminal domain, exhibit increased p53 activity and suffer from aplastic anemia and pulmonary fibrosis, hallmarks of syndromes caused by short telomeres"
        explanation: Reports the marrow phenotype in the p53-hyperactive mouse.
  evidence:
  - reference: PMID:23770245
    reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous p53+/Δ31 mice were only mildly affected, but decreased levels of Mdm4, a negative regulator of p53, led to a dramatic aggravation of their symptoms."
    explanation: >
      This is what makes the model informative for BMFS6 specifically: Mdm4
      dosage is the variable that converts a mild phenotype into a severe one.

genetic:
- name: MDM4
  gene_term:
    preferred_term: MDM4
    term:
      id: hgnc:6974
      label: MDM4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    MDM4 (MDM4 regulator of p53) encodes a negative regulator of p53 that acts
    through a p53-binding domain and a RING-finger domain, both of which
    complementation studies show are required for its haematopoietic function.
    Germline heterozygous loss-of-function alleles - four null and two missense
    across the defining cohort - cause haploinsufficiency, and the pathway
    consequence of losing a p53 antagonist is p53 activation.
  review_notes: >-
    `relationship_type: CAUSATIVE` is well supported here despite the disease
    being newly defined, because the human genetics are backed by two
    orthogonal engineered systems (CRISPR-edited primary HSPCs and
    patient-variant knock-in iPSCs) plus domain-level complementation. There
    is no ClinGen gene-disease validity assertion for MDM4 in BMFS6 to cite.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanistically, MDM4 mutations are loss-of-function mutations leading to enhanced p53 activation."
    explanation: >
      States both the gene and the direction of effect that defines the
      mechanism.
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies revealed both p53-binding and RING-finger domains as necessary for MDM4-mediated hematopoietic regulation."
    explanation: >
      Domain-level functional dissection supporting a specific, testable
      molecular role rather than a statistical association.

- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  features: >
    Somatically acquired loss-of-function TP53 mutations were found in one
    patient who progressed to MDS. TP53 is not a cause of BMFS6; it enters as
    the target of a somatic escape event on the germline background.
  notes: >
    Recorded as COOPERATING rather than CAUSATIVE or MODIFIER. The somatic
    event does not cause the disease and does not simply modify its severity -
    it relieves the germline mechanism while creating a new, worse risk, which
    is a cooperating alteration shaping disease behaviour.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 1 patient with MDS acquired loss-of-function TP53 mutations, suggesting maladaptive somatic rescue."
    explanation: >
      Documents the somatic TP53 event and its proposed interpretation.

diagnosis:
- name: Bone Marrow Examination
  description: >
    Establishes marrow hypocellularity and identifies dysplastic change, which
    together define the presenting phenotype in this cohort.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 6 unrelated individuals with variable BMF phenotypes and hypocellular MDS, presenting at a median age of 10 years (range, 4 weeks to 53 years)."
    explanation: >
      The presenting phenotype is defined on marrow cellularity and dysplasia.

- name: Germline Molecular Genetic Testing of MDM4
  description: >
    Confirmatory. Note that four of the six reported alleles are truncating
    and were confirmed at transcript level by RNA sequencing, so RNA-level
    confirmation is worth having for splice-region candidates rather than
    relying on DNA-level prediction alone.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic analysis revealed germ line heterozygous variants in mouse double minute 4 (MDM4), including 4 null (frameshift, nonsense, and splice site resulting in premature truncation confirmed by RNA sequencing) and 2 missense variants, of which 1 had previously been associated with a familial BMF syndrome."
    explanation: >
      Documents the diagnostic finding and the RNA-level confirmation step.

references:
- reference: PMID:41758987
  title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
- reference: PMID:23770245
  title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."

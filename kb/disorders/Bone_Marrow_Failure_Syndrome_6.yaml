name: Bone Marrow Failure Syndrome 6
creation_date: "2026-08-30T19:10:00Z"
category: Mendelian
disease_term:
  preferred_term: bone marrow failure syndrome 6
  term:
    id: MONDO:0030015
    label: bone marrow failure syndrome 6
description: >
  Bone marrow failure syndrome 6 (BMFS6; OMIM 618849) is an inherited bone
  marrow failure syndrome caused by germline heterozygous loss-of-function
  variants in MDM4, a negative regulator of p53. Its molecular basis was
  established in 2026 in a cohort of six unrelated individuals with variable
  bone marrow failure and hypocellular myelodysplastic syndrome, presenting at
  a median age of 10 years across a range from four weeks to 53 years.

  The mechanism inverts the usual reading of the p53 pathway in haematology.
  MDM4 restrains p53; halving MDM4 therefore does not damage a repair pathway,
  it removes a brake. The consequence is p53 hyperactivity in haematopoietic
  stem and progenitor cells, with impaired colony formation, reduced
  engraftment and reduced erythroid and myeloid output. The authors name the
  category directly: MDM4 deficiency is a TP53-activating syndrome. Two
  orthogonal engineered systems support the chain - CRISPR deletion of MDM4 in
  healthy-donor HSPCs, and patient-specific variants knocked into iPSCs - and
  complementation shows that both the p53-binding domain and the RING-finger
  domain are required for MDM4's haematopoietic function.

  The most striking single observation is evolutionary rather than
  developmental: one patient who progressed to MDS had acquired somatic
  loss-of-function TP53 mutations. Read against the germline lesion this is
  not a second hit in the ordinary tumour-suppressor sense but its opposite -
  a somatic event that relieves the very p53 hyperactivity the germline
  variant causes, buying clonal fitness at the cost of losing p53 tumour
  suppression. The source calls this maladaptive somatic rescue, and it is
  curated here as its own node.

synonyms:
  - BMFS6
  - MDM4 haploinsufficiency
  - MDM4 deficiency

parents:
  - Inherited bone marrow failure syndrome
  - Bone marrow failure syndrome


inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    All reported variants are germline and heterozygous, and the mechanism is
    haploinsufficiency, so a single altered allele is sufficient. Expressivity
    is markedly variable: presentation ranged from four weeks to 53 years of
    age within the same six-person cohort.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic analysis revealed germ line heterozygous variants in mouse double minute 4 (MDM4), including 4 null (frameshift, nonsense, and splice site resulting in premature truncation confirmed by RNA sequencing) and 2 missense variants, of which 1 had previously been associated with a familial BMF syndrome."
    explanation: >
      Documents germline heterozygous variants, including four null alleles,
      which together with the haploinsufficiency mechanism supports dominant
      inheritance.

notes: >
  Newly defined. The disease-establishing cohort is six unrelated individuals
  (Sharma et al., Blood 2026), so every count in this entry is out of six and
  no `frequency` values are set.

  Two care notes for future curators. First, MONDO records no causal gene
  (RO:0004003) for MONDO:0030015, so the `stubs/` entry for this disease
  carried no `genes:` block and the gene identity has to come from OMIM
  #618849 or the primary literature, not from the stub. Second, and relatedly,
  BMFS6 is easy to confuse with MECOM-associated radioulnar synostosis with
  amegakaryocytic thrombocytopenia, which is a different OMIM entity; the
  claim issue for this entry (#10170) was initially filed with that wrong gene
  and has been corrected.

  The telomere arm of the mouse literature is deliberately NOT asserted for
  human BMFS6 - see the HUMAN_MODEL_MISMATCH discussion below.

pathophysiology:
- name: Germline Heterozygous MDM4 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Four null alleles (frameshift, nonsense and splice-site variants producing
    premature truncation, confirmed at transcript level by RNA sequencing) and
    two missense alleles across six unrelated individuals. The direction of
    effect is loss of function, which for a p53 antagonist means the pathway
    consequence is activation rather than loss.
  genes:
  - preferred_term: MDM4
    term:
      id: hgnc:6974
      label: MDM4
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline heterozygous loss-of-function MDM4 alleles acting by
      haploinsufficiency.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic analysis revealed germ line heterozygous variants in mouse double minute 4 (MDM4), including 4 null (frameshift, nonsense, and splice site resulting in premature truncation confirmed by RNA sequencing) and 2 missense variants, of which 1 had previously been associated with a familial BMF syndrome."
    explanation: >
      Establishes the causal gene and the allelic spectrum, with RNA-level
      confirmation that the null alleles truncate the transcript.
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanistically, MDM4 mutations are loss-of-function mutations leading to enhanced p53 activation."
    explanation: >
      States the direction of effect explicitly, which is what makes this a
      p53-activating rather than a p53-losing syndrome.
  downstream:
  - target: Loss of MDM4-Mediated p53 Restraint
    description: Halved MDM4 dosage removes a negative regulator of p53.

- name: Loss of MDM4-Mediated p53 Restraint
  biological_scale: MOLECULAR
  description: >
    MDM4's normal job is to hold p53 down. Complementation studies establish
    that this function needs two distinct parts of the protein - the
    p53-binding domain and the RING-finger domain - so a variant disabling
    either one is sufficient, which is consistent with the mixed null and
    missense allelic spectrum.
  biological_processes:
  - preferred_term: negative regulation of signal transduction by p53 class mediator
    modifier: DECREASED
    term:
      id: GO:1901797
      label: negative regulation of signal transduction by p53 class mediator
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies revealed both p53-binding and RING-finger domains as necessary for MDM4-mediated hematopoietic regulation."
    explanation: >
      Identifies the two protein domains through which MDM4 exerts its
      haematopoietic function, both required.
  downstream:
  - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
    description: Releasing the brake raises p53 transcriptional output.

- name: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
  biological_scale: CELLULAR
  description: >
    The central node. MDM4-haploinsufficient HSPCs show increased p53
    activity; MDM4-mutant iPSCs show the same, read out as elevated p21
    expression; and transcriptome analysis of iPSC-derived haematopoietic
    cells shows upregulation of the p53 pathway. The authors' summary
    conclusion is that MDM4 deficiency is a TP53-activating syndrome.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting MDM4-haploinsufficient HSPCs exhibited increased p53 activity, impaired colony-forming capacity, and reduced engraftment potential in immunodeficient mice."
    explanation: >
      Direct demonstration in CRISPR-edited healthy-donor HSPCs that halving
      MDM4 raises p53 activity and costs haematopoietic function.
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptome analysis of iPSC-derived hematopoietic cells revealed upregulation of the p53 pathway."
    explanation: >
      Independent transcriptome-level confirmation of p53 pathway
      upregulation in a second engineered system.
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings establish MDM4 deficiency as a TP53-activating syndrome, with features of BMF and variable hematopoietic manifestations."
    explanation: >
      The authors' own classification of the disease category, which is the
      organising claim of this entry.
  downstream:
  - target: Impaired HSPC Self-Renewal and Multilineage Output
    description: p53 hyperactivity constrains progenitor proliferation and differentiation.
  - target: Somatic TP53 Loss-of-Function as Maladaptive Clonal Rescue
    description: >
      Sustained p53 pressure selects for clones that escape it, at the cost of
      losing p53 tumour suppression.

- name: Impaired HSPC Self-Renewal and Multilineage Output
  biological_scale: CELLULAR
  description: >
    The functional cost of p53 hyperactivity, measured three ways: impaired
    colony-forming capacity, reduced engraftment potential in immunodeficient
    mice, and significantly reduced erythroid and myeloid cell yield from
    MDM4-mutant iPSCs. The lesion is on proliferation and differentiation
    capacity rather than on a single lineage, which is what makes the clinical
    picture a trilineage marrow failure rather than a single cytopenia.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  - preferred_term: myeloid cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030099
      label: myeloid cell differentiation
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MDM4-mutant iPSCs yielded significantly reduced erythroid and myeloid cells and exhibited increased p53 activity, as evidenced by elevated p21 expression, confirming the role of MDM4 in regulating hematopoiesis through p53."
    explanation: >
      Demonstrates reduced output across two lineages in a
      confounder-free genetic background, with p21 as the p53-activity
      readout.
  downstream:
  - target: Bone Marrow Failure with Hypocellular Marrow
    description: Reduced progenitor output manifests as marrow hypocellularity and cytopenias.

- name: Bone Marrow Failure with Hypocellular Marrow
  biological_scale: TISSUE
  description: >
    The clinical endpoint of the developmental arm: variable bone marrow
    failure phenotypes with hypocellular myelodysplastic syndrome, presenting
    across a very wide age range.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 6 unrelated individuals with variable BMF phenotypes and hypocellular MDS, presenting at a median age of 10 years (range, 4 weeks to 53 years)."
    explanation: >
      Reports the clinical phenotype and its striking range of onset in the
      defining cohort.

- name: Somatic TP53 Loss-of-Function as Maladaptive Clonal Rescue
  biological_scale: CELLULAR
  description: >
    One patient who progressed to MDS acquired somatic loss-of-function TP53
    mutations. The natural reading, and the one the source gives, is rescue: a
    clone that inactivates p53 escapes the growth disadvantage the germline
    MDM4 lesion imposes, and outcompetes its neighbours. It is maladaptive
    because the escape route runs through the loss of p53 tumour suppression,
    which is the classic substrate for progression to MDS and leukaemia. This
    is the inverse of the usual two-hit picture - the somatic event relieves
    the germline mechanism rather than compounding it.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
    modifier: DECREASED
  genetic_context:
    description: >-
      Somatically acquired loss-of-function TP53 mutations in a patient who
      progressed to MDS, arising on the germline MDM4-haploinsufficient
      background.
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 1 patient with MDS acquired loss-of-function TP53 mutations, suggesting maladaptive somatic rescue."
    explanation: >
      Reports the somatic TP53 event and the authors' interpretation of it as
      maladaptive rescue of the germline p53-hyperactivity lesion.
  downstream:
  - target: Progression to Myelodysplastic Syndrome and Leukemia
    description: >
      Escaping p53 restraint also removes p53 tumour suppression from the
      escaping clone.

- name: Progression to Myelodysplastic Syndrome and Leukemia
  biological_scale: ORGANISM
  description: >
    Bone marrow failure syndromes in general carry a risk of evolution to
    myelodysplastic syndrome and leukaemia, and hypocellular MDS was part of
    the presenting phenotype in this cohort. Recorded as the shared endpoint
    of the two upstream arms.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow failure (BMF) syndromes are heterogeneous diseases characterized by impaired hematopoiesis and a risk of evolution to myelodysplastic syndrome (MDS) and leukemia."
    explanation: >
      Establishes MDS/leukaemia evolution as the recognised risk for this
      disease class. Note this is a class-level statement about BMF syndromes,
      not a quantified risk for BMFS6 specifically, which has not been
      reported.

mechanistic_hypotheses:
- hypothesis_group_id: p53_activating_bmf
  hypothesis_label: BMFS6 is a p53-activating syndrome rather than a DNA-repair or telomere syndrome
  status: EMERGING
  description: >
    The proposal is that the primary lesion is dosage of a p53 brake, not
    damage to a maintenance pathway. It predicts that the marrow phenotype
    should be rescuable by lowering p53 activity, that severity should track
    MDM4 dosage rather than accumulated damage, and that clonal evolution
    should preferentially select p53-pathway escape events - the last of which
    is exactly what the single reported somatic TP53 event looks like.

discussions:
- discussion_id: bmfs6_telomere_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
  prompt: >-
    Does the telomere shortening seen when p53 is hyperactivated in mice occur
    in human MDM4-haploinsufficient bone marrow failure, or is BMFS6 a
    p53-activating syndrome without a telomere component?
  rationale: >-
    The mouse genetics are strong and directly implicate Mdm4 dosage: p53
    hyperactive mice develop aplastic anaemia, pulmonary fibrosis and short
    telomeres with downregulation of Dyskerin, Rtel1, Tinf2 and Terf1, and
    heterozygotes that are only mildly affected become dramatically worse when
    Mdm4 levels are reduced. That is the same axis as human BMFS6, approached
    from the p53 side. But the human cohort report does not describe telomere
    length, telomere-maintenance gene expression, or pulmonary fibrosis, so
    the telomere arm is a model-derived expectation and not a human finding.
    Curating it as an edge would import a mouse phenotype into a human
    pathograph. It is recorded here instead, and the entry does not declare
    conformance to the telomere_attrition module.
  evidence:
  - reference: PMID:23770245
    reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous p53+/Δ31 mice were only mildly affected, but decreased levels of Mdm4, a negative regulator of p53, led to a dramatic aggravation of their symptoms."
    explanation: >-
      Establishes the mouse Mdm4-dosage/p53 interaction that motivates the
      question, in a model whose readout is a telomere syndrome.
  - reference: PMID:23770245
    reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, several genes involved in telomere metabolism were downregulated in p53Δ31/Δ31 cells, including Dyskerin, Rtel1, and Tinf2, which are mutated in dyskeratosis congenita, and Terf1, which is implicated in aplastic anemia."
    explanation: >-
      Gives the specific molecular telomere phenotype that would need to be
      looked for in human BMFS6 marrow to close this gap.

- discussion_id: bmfs6_p53_escape_surveillance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic TP53 Loss-of-Function as Maladaptive Clonal Rescue
  prompt: >-
    How often do MDM4-haploinsufficient patients acquire somatic TP53
    loss-of-function clones, and should they be screened for them?
  rationale: >-
    The observation is n=1 within a six-person cohort, and the source frames it
    as suggestive rather than established. It matters clinically out of
    proportion to its frequency: if p53-pathway escape is the routine
    evolutionary path in this disease, then serial somatic TP53 screening
    would be surveillance for the specific mechanism of leukaemic progression
    rather than a generic MDS work-up. Nothing yet supports a recommendation
    either way, and this entry makes none.
  evidence:
  - reference: PMID:41758987
    reference_title: "MDM4 haploinsufficiency leads to p53-mediated bone marrow failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 1 patient with MDS acquired loss-of-function TP53 mutations, suggesting maladaptive somatic rescue."
    explanation: >-
      The single observation the gap is about, including the source's own
      hedged framing.


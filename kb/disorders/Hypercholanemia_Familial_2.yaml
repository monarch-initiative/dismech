name: Hypercholanemia Familial 2
creation_date: "2026-09-17T15:25:00Z"
description: >-
  Familial hypercholanemia 2 is NTCP deficiency: the autosomal recessive disorder
  caused by biallelic SLC10A1 variants, which remove the sodium taurocholate
  cotransporting polypeptide from the basolateral membrane of the hepatocyte. NTCP
  is the major route by which conjugated bile salts are taken back up from portal
  plasma into the liver, so losing it strands them in the circulation. Plasma total
  bile salts reach concentrations that in any other context would signal severe
  cholestatic liver disease — up to 1,500 micromolar against a reference of under
  16.3 in the first reported patient.

  The interesting part is what does not follow. There is no cholestatic jaundice,
  no pruritus, no liver dysfunction in that patient; bile salt synthesis and
  intestinal bile salt signalling are normal on C4 and FGF19; and secondary bile
  salts are present in the circulation, which means the enterohepatic cycle is
  still turning through auxiliary transporters. NTCP is therefore the main importer
  but not the only one, and the disease is a transport defect with a striking
  laboratory signature rather than a liver disease.

  What the larger series add is a set of age-dependent associations rather than a
  progressive course. In 113 paediatric patients, hypercholanemia was near
  universal, and neonatal indirect hyperbilirubinemia, transient cholestatic
  jaundice, raised liver enzymes and vitamin D deficiency in early infancy were all
  more common than in controls — with uniformly favourable outcomes, and an
  explicit warning against over-investigation. In adults followed for five years the
  recurring findings were hypercholanemia, vitamin D deficiency, bone loss and
  gallbladder abnormalities. This entry keeps the biochemical phenotype and the
  clinical associations in separate registers, because the literature does.
synonyms:
- NTCP deficiency
- sodium taurocholate cotransporting polypeptide deficiency
- NTCPD
- SLC10A1 deficiency
- hypercholanemia, familial, 2

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SLC10A1 variants are required. The first patient was homozygous for
    p.R252H; the prevalent East Asian allele is p.S267F, found homozygous in most
    reported patients and in compound heterozygosity with others. Because p.S267F
    is common enough in some populations to be screened for directly, ascertainment
    in the large paediatric series is genotype-led, which matters when reading its
    phenotype frequencies.
  evidence:
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of the SLC10A1 gene revealed a single homozygous nonsynonymous point
      mutation in the coding sequence of the gene, resulting in an arginine to
      histidine substitution at position 252.
    explanation: The genotype of the first reported patient.
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SLC10A1 genotypes of all NTCPD patients were confirmed by screening for the
      prevalent variant c.800C>T and Sanger sequencing when necessary.
    explanation: >-
      States the ascertainment route in the largest series, which is what makes its
      frequencies genotype-led rather than clinically led.
prevalence:
- population: Paediatric patients diagnosed in a single Chinese case-control study
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    113 paediatric patients were diagnosed in one case-control study, which is by a
    wide margin the largest series and is the reason this disorder is better
    characterised than its rarity would suggest. No population prevalence has been
    published in any located source. The p.S267F allele is common in some East Asian
    populations, so the geographic distribution of reported patients reflects allele
    frequency and screening practice as much as anything else.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 113 paediatric NTCPD patients were diagnosed while c.374dupG and
      c.682_683delCT were detected as two novel pathogenic mutations.
    explanation: The size of the largest reported series.
progression:
- phase: Neonatal and early infancy
  notes: >-
    The age at which the clinical associations cluster. Indirect hyperbilirubinemia
    in neonates, and transient cholestatic jaundice, raised liver enzymes and vitamin
    D deficiency in early infancy, are all more common than in controls. "Transient"
    is the source's own word and is the reason this is a phase rather than an onset.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, transient cholestatic jaundice, elevated liver enzymes and
      25-hydroxyvitamin D (Vit D) deficiency during early infancy were more commonly
      observed in patients than in controls.
    explanation: >-
      The early-infancy cluster, with its comparator. The case-control design is what
      makes "more commonly than controls" a usable claim.
- phase: Favourable childhood outcome
  notes: >-
    All patients in the 113-patient series had favourable outcomes on symptomatic and
    supportive treatment, and the authors warn explicitly against over-investigation
    and over-intervention. That warning is a clinical finding about the disorder, not
    an aside.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All NTCPD patients exhibited favourable clinical outcomes as a result of
      symptomatic and supportive treatment.
    explanation: The outcome in the largest series.
- phase: Adult findings on five-year follow-up
  notes: >-
    In ten p.Ser267Phe homozygous adults followed for five years the recurring
    features were hypercholanemia, vitamin D deficiency, bone loss and gallbladder
    abnormalities. Ten individuals is a small denominator and the entry does not
    treat these as established complications.
  evidence:
  - reference: PMID:35937832
    reference_title: NTCP Deficiency Affects the Levels of Circulating Bile Acids and Induces Osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 5-year follow-up observation of 10 NTCP p.Ser267Phe homozygous
      adults, we found that the most common phenotypic features of NTCP deficiency in
      adults were hypercholanemia, vitamin D deficiency, bone loss, and gallbladder
      abnormalities.
    explanation: >-
      The adult findings with the cohort size and follow-up duration in the same
      sentence, so the denominator travels with the claim.
pathophysiology:
- name: NTCP Loss from the Hepatocyte Basolateral Membrane
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC10A1 variants remove functional NTCP from the hepatocyte basolateral
    membrane. The mechanism is not only reduced catalysis: for p.R252H, functional
    studies showed markedly reduced taurocholic acid uptake and the mutant protein was
    virtually absent from the plasma membrane, so this is a trafficking or stability
    defect as well as a transport one.
  genes:
  - preferred_term: SLC10A1
    term:
      id: hgnc:10905
      label: SLC10A1
  molecular_functions:
  - preferred_term: sodium-dependent bile acid transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0008508
      label: bile acid:sodium symporter activity
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Hepatic Conjugated Bile Salt Uptake
    causal_link_type: DIRECT
    description: >-
      NTCP is the major transporter of conjugated bile salts from plasma into the
      hepatocyte, so its absence from the membrane removes that route.
    evidence:
    - reference: PMID:24867799
      reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies showed that this mutation resulted in a markedly reduced
        uptake activity of taurocholic acid.
      explanation: >-
        Measures the transport consequence of the patient's own variant, rather than
        inferring it from the variant class.
  evidence:
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence studies and surface biotinylation experiments demonstrated
      that the mutant protein is virtually absent from the plasma membrane.
    explanation: >-
      Localises the defect to protein delivery rather than to catalytic activity
      alone, which is a different kind of loss of function.
- name: Failure of Hepatic Conjugated Bile Salt Uptake
  biological_scale: CELLULAR
  description: >-
    The sodium-dependent uptake arm of the enterohepatic circulation is lost. It is
    not the only arm: sodium-independent uptake by the organic anion transporting
    polypeptides remains, which is why the cycle continues at all.
  biological_processes:
  - preferred_term: bile acid and bile salt transport
    modifier: DECREASED
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Plasma Conjugated Bile Salt Accumulation
    causal_link_type: DIRECT
    description: >-
      Bile salts that cannot re-enter the hepatocyte remain in the plasma compartment.
    evidence:
    - reference: PMID:24867799
      reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Total bile salts in plasma were extremely elevated (up to 1,500 μM, ref. <16.3)
      explanation: >-
        The magnitude of the accumulation in the first patient, quoted with its
        reference interval so the scale is legible.
  - target: Residual Enterohepatic Cycling via Auxiliary Transporters
    causal_link_type: DIRECT
    description: >-
      Losing the main importer reveals the auxiliary ones. This is the compensatory
      branch and the reason the disorder is not a liver disease.
  evidence:
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Na(+)-taurocholate cotransporting polypeptide SLC10A1 (NTCP) plays a key
      role in this process as the major transporter of conjugated bile salts from the
      plasma compartment into the hepatocyte.
    explanation: >-
      Establishes NTCP's role in the cycle. It is this paper's background framing of
      established physiology rather than its own finding.
    quote_role: BACKGROUND
- name: Residual Enterohepatic Cycling via Auxiliary Transporters
  biological_scale: ORGANISM
  description: >-
    Secondary bile salts require intestinal bacterial modification and then return to
    the liver, so their presence in the circulation of an NTCP-deficient patient
    demonstrates that the enterohepatic cycle is still turning. Sodium-independent
    uptake by the organic anion transporting polypeptides is the presumed route. This
    node is why the disease has a laboratory signature out of all proportion to its
    clinical consequences, and it is the compensation that has to be invoked to
    explain the absence of cholestatic liver injury.
  genes:
  - preferred_term: SLCO1B1
    term:
      id: hgnc:10959
      label: SLCO1B1
  - preferred_term: SLCO1B3
    term:
      id: hgnc:10961
      label: SLCO1B3
  evidence:
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, the presence of secondary bile salts in the circulation suggested
      residual enterohepatic cycling of bile salts.
    explanation: >-
      The inference is the authors' own and is stated as a suggestion, which is how
      this entry records it.
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of NTCP deficiency confirms that this transporter is the main
      import system for conjugated bile salts into the liver but also indicates that
      auxiliary transporters are able to sustain the enterohepatic cycle in its absence.
    explanation: >-
      States both halves of the result: NTCP is the main importer, and it is not
      required to sustain the cycle.
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, organic anion transporter polypeptides (OATP) 1B1/1B3 were considered
      as the main molecular replacement mechanism, which were localized to the
      basolateral membrane of human hepatocytes and mediated the Na+‐independent
      uptake of bilirubin, bile salts and other organic anions.
    explanation: >-
      Names the transporters behind this node and the property that makes them able to
      substitute: OATP1B1 and OATP1B3 take up bile salts sodium-independently, so they
      are unaffected by the loss of the sodium-coupled importer. The authors state it
      as established transporter physiology, citing three earlier studies.
    quote_role: BACKGROUND
- name: Plasma Conjugated Bile Salt Accumulation
  biological_scale: ORGANISM
  description: >-
    The defining abnormality. Plasma total bile salts reached 1,500 micromolar
    against a reference of under 16.3 in the first patient, and in adults the serum
    bile acid profile is altered in composition as well as concentration, with both
    the proportion and the concentration of primary and conjugated species raised.
    Bile salt synthesis is not the problem: plasma C4 and FGF19 are normal, so
    production and intestinal feedback signalling are intact.
  chemical_entities:
  - preferred_term: conjugated bile salts
    modifier: INCREASED
    term:
      id: CHEBI:36277
      label: bile acid salt
  downstream:
  - target: Increased serum bile acid concentration
    causal_link_type: DIRECT
  - target: Neonatal unconjugated hyperbilirubinemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Indirect hyperbilirubinemia is commoner in affected neonates than in controls,
      and the source frames NTCP deficiency as a contributing factor rather than a
      cause. No mechanism connecting bile salt retention to unconjugated bilirubin is
      established in any located source.
  - target: Decreased circulating vitamin D concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vitamin D is fat-soluble and its absorption depends on the intestinal bile salt
      pool, which is the usual explanation offered. The located sources report the
      association, not the mechanism.
  - target: Cholestatic jaundice
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated liver enzymes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24867799
    reference_title: "Sodium taurocholate cotransporting polypeptide (SLC10A1) deficiency: conjugated hypercholanemia without a clear clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bile salt synthesis and intestinal bile salt signaling were not affected, as
      evidenced by normal plasma 7α-hydroxy-4-cholesten-3-one (C4) and FGF19 levels.
    explanation: >-
      Excludes overproduction and disordered feedback as the source of the
      accumulation, which is what makes it a retention phenomenon.
  - reference: PMID:35937832
    reference_title: NTCP Deficiency Affects the Levels of Circulating Bile Acids and Induces Osteoporosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The profile of bile acids (BAs) in the serum was significantly altered in these
      individuals and marked by both elevated proportion and concentration of primary
      and conjugated BAs.
    explanation: >-
      Shows the abnormality is compositional as well as quantitative, in the adult
      cohort.
phenotypes:

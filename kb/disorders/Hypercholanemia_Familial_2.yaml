    Hypercholanemia is the defining abnormality and is close to universal — 99.12% of
    113 paediatric patients. It is graded VERY_FREQUENT on that published figure
    rather than on an impression.

    Read the near-universality against the ascertainment: patients in that series were
    identified by SLC10A1 genotyping, so the cohort is genotype-defined and the
    biochemical phenotype is not being used to select it. That makes 99.12% a
    penetrance estimate rather than a circular one.

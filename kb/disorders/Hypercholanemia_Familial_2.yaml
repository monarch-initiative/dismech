animal_models:
- species: Mouse
  genotype: NTCP-global knockout
  publication: PMID:35937832
  description: >-
    Global NTCP knockout, used to test whether the human association between NTCP
    deficiency and bone loss is causal. It reproduced the biochemistry — raised serum
    bile acids and lowered vitamin D — and aggravated an oestrogen-withdrawal
    osteoporosis phenotype.
  modeled_mechanisms:
  - target: Reduced bone mineral density
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the bile acid and vitamin D changes and aggravates bone loss, which
      is the branch the human adult cohort could only report as an association.
    limitations: >-
      The osteoporosis was induced by oestrogen withdrawal and then aggravated by the
      knockout; the model does not show NTCP loss producing bone loss on its own. The
      human observation it supports is ten individuals in a single cohort, so this is a
      model result standing in for a small clinical denominator rather than confirming
      a well-established human finding.
    evidence:
    - reference: PMID:35937832
      reference_title: NTCP Deficiency Affects the Levels of Circulating Bile Acids and Induces Osteoporosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, the NTCP deficiency led to increased levels of serum BAs, decreased
        levels of vitamin D, and aggravated the osteoporotic phenotype induced by
        estrogen withdrawal in mice.
      explanation: >-
        The three measurements in the knockout, including the wording that makes the
        osteoporosis oestrogen-induced and knockout-aggravated rather than
        knockout-caused.
discussions:
- discussion_id: ntcp_hbv_resistance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do NTCP-deficient individuals resist hepatitis B and hepatitis D infection?
  attaches_to:
  - genetic#SLC10A1
  rationale: >-
    NTCP is the hepatocyte entry receptor for HBV and HDV, and the dismech Hepatitis_D
    entry already carries SLC10A1 in that role. A person with no functional NTCP is
    the natural experiment for whether receptor loss confers resistance, and the answer
    would bear directly on entry-inhibitor therapy. No source located for this entry
    reports HBV or HDV status in a genetically confirmed NTCP-deficient cohort. The
    question is recorded rather than answered because the inference is obvious and the
    evidence is absent, which is exactly the combination that invites an entry to
    overstate.
  evidence:
  - reference: PMID:36924318
    reference_title: "Bile acid increase during bulevirtide treatment of hepatitis D is not associated with a decline in HDV RNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bulevirtide (BLV) is an entry inhibitor blocking entry of HBsAg into hepatocytes
      by interfering with the bile acid transporter Na+-taurocholate co-transporting
      polypeptide.
    explanation: >-
      Establishes why the question is worth asking: a drug in clinical use for
      hepatitis D works by blocking the same transporter this disease abolishes, so
      bulevirtide treatment is the pharmacologic phenocopy of the genotype. Stated as
      the drug's established mechanism in the paper's opening rather than as its own
      finding.
    quote_role: BACKGROUND
  - reference: PMID:36924318
    reference_title: "Bile acid increase during bulevirtide treatment of hepatitis D is not associated with a decline in HDV RNA."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BLV-induced increases in bile salts do not correlate with HDV RNA declines
      suggesting that the inhibitory effects of BLV on NTCP differ between blocking
      bile acid transport and hindering HBsAg entry.
    explanation: >-
      Refutes the coupling the question assumes rather than the question itself. In 20
      treated patients the rise in bile salts, the readout of blocked bile acid
      transport, did not track the fall in HDV RNA, so the authors conclude the
      transport-blocking and entry-blocking effects on NTCP are separable. Losing bile
      acid uptake therefore does not license the inference that viral entry is lost
      with it, which is why this entry records the resistance question as open instead
      of answering it from the receptor's identity.
- discussion_id: ntcp_phenotype_attribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the reported clinical associations are consequences of NTCP deficiency,
    and which are findings of a genotype-screened cohort?
  attaches_to:
  - phenotypes#Neonatal unconjugated hyperbilirubinemia
  rationale: >-
    The largest series ascertained patients by SLC10A1 genotype and compared them with
    controls, which is the right design and is why its findings are usable at all. But
    the clinical associations it reports — indirect hyperbilirubinemia, transient
    cholestatic jaundice, raised enzymes, vitamin D deficiency — are common conditions
    of early infancy, all reported as "more common than controls" without effect sizes
    in the abstract, and the index patient in the founding report had none of them at
    bile salt concentrations approaching a hundred times the upper reference limit.
    Distinguishing a consequence from a co-occurrence here needs effect sizes and
    replication in a second population, and this entry's frequency bands should be read
    as provisional until it has them.
- discussion_id: ntcp_bone_causality
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does NTCP deficiency cause bone loss in humans, or only aggravate it when another
    insult is present?
  attaches_to:
  - phenotypes#Reduced bone mineral density
  rationale: >-
    The human evidence is bone loss among the common findings in ten adults. The causal
    evidence is a mouse in which osteoporosis was induced by oestrogen withdrawal and
    then aggravated by the knockout — which supports a modifying role, not an
    originating one. Whether an NTCP-deficient person with no other risk factor loses
    bone is not addressed by either. The distinction decides whether these patients
    need bone surveillance or only the surveillance their other risk factors warrant.
notes: >-
  The point of this entry is the gap between the laboratory picture and the clinical
  one, and it is built so that gap cannot be read away. Plasma total bile salts reach
  1,500 micromolar against a reference under 16.3 — numbers that in any other setting
  mean severe cholestatic liver disease — in a patient with no cholestatic jaundice,
  no pruritus and no liver dysfunction. That negative observation is curated as a
  REFUTE evidence item on the cholestatic jaundice phenotype rather than being left
  out, because an entry that listed cholestatic jaundice as a feature and omitted the
  index patient's absence of it would be a fair reading of the frequency data and a
  misleading portrait of the disease.

  Three things follow for how the phenotype section should be read. First, the
  frequencies come from a single Chinese case-control study of 113 genotype-ascertained
  patients; its design is the right one, but replication in another population has not
  happened. Second, most of the clinical associations are confined to early infancy and
  the source calls the jaundice transient; the disorder is not progressive on the
  available follow-up. Third, the adult findings rest on ten individuals.

  The compensation node is load-bearing and is not a hedge: secondary bile salts in
  the circulation demonstrate that the enterohepatic cycle still turns, and the
  founding paper concludes explicitly that auxiliary transporters sustain it. Without
  that branch the entry would have no account of why the liver is undamaged.

  NTCP is also the HBV and HDV entry receptor, which the Hepatitis_D entry already
  records. Whether NTCP-deficient people are protected from infection is an obvious
  question with no located evidence, and is filed as a knowledge gap rather than
  asserted.

  No GeneReviews chapter exists for this disorder; just check-genereviews reports
  NO_CHAPTER against the committed Bookshelf index.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All NTCPD patients exhibited favourable clinical outcomes as a result of
      symptomatic and supportive treatment.
    explanation: The outcome under supportive management in the largest series.
  - reference: PMID:34369070

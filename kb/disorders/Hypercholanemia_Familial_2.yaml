genetic:
- name: SLC10A1
  gene_term:
    preferred_term: SLC10A1
    term:
      id: hgnc:10905
      label: SLC10A1
  relationship_type: CAUSATIVE
  notes: >-
    Solute carrier family 10 member 1, encoding NTCP, expressed in the basolateral
    membrane of the hepatocyte. Biallelic variants cause this disorder.

    NTCP has a second identity that matters here: it is the cell-entry receptor for
    hepatitis B and hepatitis D virus, and the dismech Hepatitis_D entry already
    carries SLC10A1 in that role. The same loss of function that produces the
    hypercholanemia would be expected to affect susceptibility to viral entry, but no
    source located for this entry tests that in NTCP-deficient patients, so it is
    recorded as a knowledge gap rather than asserted.
  variants:
  - name: c.800C>T (p.S267F)
    description: >-
      The prevalent variant, common enough in some East Asian populations to be
      screened for directly; homozygous in most reported patients including the
      ten-adult follow-up cohort. A characterised loss-of-function allele.
  - name: c.755G>A (p.R252H)
    description: >-
      Homozygous in the first reported patient. Functional studies showed markedly
      reduced taurocholic acid uptake, and the mutant protein was virtually absent
      from the plasma membrane.
  - name: c.263T>C (p.I88T)
    description: >-
      Novel at the time of report, found in trans with p.S267F in a neonate, with an
      allele frequency of 0.67% (1/150) in healthy controls.
  - name: c.374dupG and c.682_683delCT
    description: >-
      Two further pathogenic variants detected in the 113-patient paediatric series.
  evidence:
  - reference: PMID:29290974
    reference_title: "Sodium taurocholate cotransporting polypeptide (NTCP) deficiency: Identification of a novel SLC10A1 mutation in two unrelated infants presenting with neonatal indirect hyperbilirubinemia and remarkable hypercholanemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sodium taurocholate cotransporting polypeptide (NTCP) is encoded by the gene
      SLC10A1 and expressed in the basolateral membrane of the hepatocyte, functioning
      to uptake bile acids from plasma.
    explanation: >-
      The gene, its product, and its location and function. Background framing in this
      paper rather than its own result.
    quote_role: BACKGROUND
  - reference: PMID:29290974
    reference_title: "Sodium taurocholate cotransporting polypeptide (NTCP) deficiency: Identification of a novel SLC10A1 mutation in two unrelated infants presenting with neonatal indirect hyperbilirubinemia and remarkable hypercholanemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Having not been reported in any databases, the c.263T>C (p.I88T) variant
      demonstrated an allele frequency of 0.67% (1/150) in healthy controls.
    explanation: >-
      The control allele frequency for the novel variant, which is the evidence offered
      for its rarity.
diagnosis:
- name: SLC10A1 genotyping
  description: >-
    Molecular confirmation, and the only test that makes the diagnosis. In the largest
    series one variant, c.800C>T (p.Ser267Phe), carried 94.5% of mutated alleles, so a
    targeted assay for it resolves most cases in the population that series drew on;
    Sanger sequencing of the rest of the gene is reserved for the patients in whom it
    accounts for one allele or neither. A screen-then-sequence order is therefore a
    statement about allele frequency in a particular population, not a general
    protocol.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SLC10A1 genotypes of all NTCPD patients were confirmed by screening for the
      prevalent variant c.800C>T and Sanger sequencing when necessary.
    explanation: >-
      The two-stage genotyping strategy as the series performed it.
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cases with single or no mutated SLC10A1 allele detected, Sanger sequencing
      was performed to explore the hidden causative variant.
    explanation: >-
      States when the second stage is triggered, which is what makes the first stage a
      screen rather than the whole test.
- name: Serum total bile acid measurement
  description: >-
    The biochemical finding that brings the patient to attention, and the one that is
    almost always present: hypercholanemia in 99.12% of 113 paediatric patients. It is
    not specific, being the finding shared with every cholestatic liver disease, so
    its diagnostic value here is as the trigger for SLC10A1 analysis rather than as
    confirmation. The threshold is age-dependent.
  markers: >-
    Serum total bile acids (TBA), with serum cholylglycine (CG) tracking it.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypercholanemia was observed in 99.12% of the patients.
    explanation: >-
      The positive rate of the finding in genotype-confirmed patients.
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, hypercholanemia denoted serum TBA levels beyond 40 μmol/L in
      neonates and 10 μmol/L after the neonatal period.
    explanation: >-
      The operational thresholds, which differ between the neonatal period and after
      it.
- name: Diagnostic restraint once the genotype is known
  description: >-
    A negative recommendation, recorded here because it is the practical consequence
    of the whole entry. In the largest series eight infants underwent next-generation
    sequencing and five underwent surgery in pursuit of a cholestatic cause that the
    SLC10A1 genotype already explained. Establishing the genotype is what stops the
    workup, so the diagnostic action with the most clinical value here is not ordering
    the next test.
  evidence:
  - reference: PMID:34369070
    reference_title: "Clinical characterization of NTCP deficiency in paediatric patients : A case-control study based on SLC10A1 genotyping analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      considering the invasive exploratory operations and expensive genetic
      investigations as illustrated in Table S5, the avoidance of over investigation
      and intervention may be important in the management of cholestatic infants with
      NTCPD
    explanation: >-
      The authors' own conclusion, and they name the invasive operations and genetic
      investigations that prompted it.

treatments:
- name: Symptomatic and supportive care
  description: >-
    There is no disease-directed treatment. All 113 paediatric patients had favourable
    outcomes on symptomatic and supportive treatment, and the authors of that series
    conclude that over-investigation and over-intervention should be avoided — which
    in a disorder whose laboratory numbers look like severe cholestatic liver disease
    is an active clinical recommendation, not the absence of one.
  therapeutic_modality: OTHER
  treatment_term:

name: Platelet-type Bleeding Disorder 19
creation_date: "2026-09-03T21:50:00Z"
category: Mendelian
disease_term:
  preferred_term: platelet-type bleeding disorder 19
  term:
    id: MONDO:0014518
    label: platelet-type bleeding disorder 19
synonyms:
- BDPLT19
- severe autosomal recessive macrothrombocytopenia
- PRKACG-related macrothrombocytopenia
- isolated hereditary giant platelet disorder caused by mutation in PRKACG
description: >-
  A proposed autosomal recessive inherited macrothrombocytopenia described in a single
  consanguineous family, in which homozygous carriers of a PRKACG missense variant have
  severely reduced numbers of giant platelets together with a qualitative platelet defect,
  and bleed.

  PRKACG encodes the gamma catalytic subunit of cAMP-dependent protein kinase (PKA). The
  proposed mechanism is a biogenesis defect rather than a receptor or granule defect: the
  megakaryocyte cannot make proplatelets, filamin A is reduced in patient megakaryocytes
  and platelets, and reintroducing wild-type PRKACG into patient megakaryocytes restores
  proplatelet formation. A second, qualitative arm is reported alongside it - platelet
  activation and cytoskeletal reorganization are impaired in the same individuals - which
  is what makes this a bleeding disorder rather than a pure thrombocytopenia.

  This entry is curated with its gene-disease validity in front, not in a footnote. The
  ClinGen Hemostasis/Thrombosis Gene Curation Expert Panel classified the PRKACG-BDPLT19
  relationship as DISPUTED in May 2024. The reason is specific and worth understanding
  before using this entry: the experimental evidence is strong and includes a rescue
  experiment, but the case-level genetic evidence reduces to two siblings in one family,
  and the proband also carried a missense variant in GNE whose contribution was never
  evaluated because GNE was not a thrombocytopenia gene in 2014. It is one now. So the
  alternative that ClinGen declined to score is harder to dismiss than it was when the
  family was first reported - though nobody has gone back to the family to settle it
  either way, which is the actual state of the question.

  Everything downstream of that is curated as reported rather than as established: the
  mechanism nodes carry the evidence that exists, the gene entry is typed DISPUTED, and
  no prevalence, penetrance, or phenotype frequency is asserted, because a single family
  supports none of them.
parents:
- Inherited Thrombocytopenia
- Inherited Platelet Function Disorder

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists and none should be inferred. The disease is defined by
    one consanguineous family; ClinGen's 2024 review counted two homozygous siblings as
    the whole of the case-level genetic evidence. No second family has been reported.
  evidence:
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Case-level genetic evidence from the aforementioned study includes the identification of two siblings with a homozygous missense variant in PRKACG (c.222C>G, p.Ile74Met)."
    explanation: Bounds the entire genetic evidence base for this disease at two siblings in one family, which is why no population figure is given.


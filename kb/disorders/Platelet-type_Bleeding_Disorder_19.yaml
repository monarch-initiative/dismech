pathophysiology:

- name: Homozygous PRKACG p.Ile74Met Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Both PRKACG alleles carry the missense variant c.222C>G, p.Ile74Met, identified by
    exome sequencing in a consanguineous family and segregating with the
    macrothrombocytopenia. PRKACG is the gamma catalytic subunit of cAMP-dependent
    protein kinase; unlike the alpha and beta subunits it is expressed in a restricted
    set of tissues, which is the usual explanation offered for why a defect in a
    ubiquitous signalling module presents as an isolated platelet disease. That
    tissue-restriction argument is an inference from expression rather than something
    tested here, and is not curated as a mechanism node.
  genetic_context:
    gene:
      preferred_term: PRKACG
      term:
        id: hgnc:9382
        label: PRKACG
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Typed LOSS_OF_FUNCTION on the strength of the rescue experiment rather than on the
      substitution alone: wild-type PRKACG restored proplatelet formation in patient
      megakaryocytes while the mutant construct did not, which is a loss of the wild-type
      activity rather than a new one.
  downstream:
  - target: Impaired PKA Catalytic Activity
    causal_link_type: DIRECT
    description: >-
      The substituted residue reduces the catalytic output of the kinase, inferred in
      patients from a three- to five-fold rise in cAMP over controls.
  evidence:
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a c.222C>G mutation (missense p.74Ile>Met) in PRKACG"
    explanation: Identifies the variant that defines this disease.
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutated allele cosegregating with the macrothrombocytopenia"
    explanation: Cosegregation within the family, which is the extent of the genetic argument available from one pedigree.

- name: Impaired PKA Catalytic Activity
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Reduced catalytic activity of cAMP-dependent protein kinase in the affected lineage.
    The direct measurement reported is not of kinase activity but of its substrate pool:
    patients had cAMP levels three to five times those of controls, which is read as
    compromised PKA activity. Recorded here as the inference it is.
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Filamin A in Megakaryocytes and Platelets
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      PKA phosphorylates filamin A; loss of that phosphorylation is the proposed route to
      the reduced filamin A protein level measured in patient cells. The phosphorylation
      step itself was not measured in patients, so the edge is not marked direct.
  evidence:
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, patients exhibited elevated cAMP levels, three to five times higher than controls, hinting at compromised protein kinase A (PKA) activity due to the PRKACG mutation."
    explanation: The measurement behind this node, quoted with ClinGen's own hedge ("hinting at") intact.

- name: Reduced Filamin A in Megakaryocytes and Platelets
  role: mediator
  biological_scale: CELLULAR
  description: >-
    Filamin A protein is markedly reduced in mature patient megakaryocytes and in their
    platelets. Filamin A crosslinks actin and anchors the membrane skeleton, including the
    GPIb-IX-V complex, so its loss is the link between a kinase defect and a cytoskeletal
    one.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DECREASED
  downstream:
  - target: Defective Proplatelet Formation
    causal_link_type: DIRECT
    description: >-
      Proplatelet extension is an actin- and microtubule-driven remodelling of the
      megakaryocyte, so loss of a principal actin crosslinker blocks it.
  - target: Impaired Platelet Activation and Cytoskeletal Reorganization
    causal_link_type: DIRECT
    description: >-
      The same filamin A deficit is carried into the circulating platelet, where shape
      change on activation is likewise actin-dependent.
  evidence:
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that the p.74Ile>Met PRKACG mutation is associated with a marked defect in proplatelet formation and a low level in filamin A in megakaryocytes (MKs)."
    explanation: Reports both the filamin A deficit and the proplatelet defect in patient megakaryocytes.
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Experimental evidence highlights the Functional Alteration in patient cells, where Filamin A (FLNa) was significantly reduced in mature megakaryocytes (MKs) and platelets of patients carrying the homozygous mutation in PRKACG."
    explanation: ClinGen's independent restatement, which also establishes that the deficit is present in platelets and not only in megakaryocytes.

- name: Defective Proplatelet Formation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Patient megakaryocytes fail to extend proplatelets, the branched cytoplasmic
    processes from which platelets are released. This is the quantitative arm of the
    disease and the step the rescue experiment acts on.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  downstream:
  - target: Macrothrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Failure of the fragmentation step yields few platelets, and the ones released are
      abnormally large.
  - target: Giant platelets
    causal_link_type: DIRECT
    description: >-
      Platelet size is set at release, so a proplatelet-extension defect produces large
      platelets as well as few of them.
  evidence:
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We thus conclude that PRKACG is a new central actor in platelet biogenesis and a new gene involved in inherited thrombocytopenia with giant platelets associated with a thrombocytopathy."
    explanation: The authors' conclusion that the lesion is in platelet biogenesis, which is what places this node upstream of the platelet count.

- name: Impaired Platelet Activation and Cytoskeletal Reorganization
  role: effector
  biological_scale: CELLULAR
  description: >-
    Circulating platelets from homozygous individuals activate and reorganize their
    cytoskeleton abnormally. This is the qualitative arm - the thrombocytopathy - and it
    is what makes the bleeding worse than the platelet count alone would predict.

    Deliberately not characterised further, and this is a limit of what can be verified
    rather than a limit of what was measured. The primary report is available to the
    reference cache only as an abstract, and that abstract states the defect at exactly
    this level - impaired activation and cytoskeletal reorganization - without resolving
    it into granule secretion, integrin inside-out signalling, or agonist-specific
    aggregation. Those finer claims cannot be snippet-verified, so they are not curated,
    and this node does not declare `conforms_to` against the primary_hemostatic_plug_failure
    module. See the entry `notes`.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: DECREASED
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: DECREASED
  downstream:
  - target: Abnormal platelet function
    causal_link_type: DIRECT
    description: >-
      The clinically observed qualitative platelet defect is this node read out at the
      bedside.
  - target: Abnormal bleeding
    causal_link_type: DIRECT
    description: >-
      A qualitative platelet defect superimposed on the low count, which is why the
      bleeding is worse than the platelet count alone predicts.
  evidence:
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet activation and cytoskeleton reorganization were impaired in these homozygous patients."
    explanation: The whole of the published functional-platelet characterisation, quoted so the limits of the claim are visible.


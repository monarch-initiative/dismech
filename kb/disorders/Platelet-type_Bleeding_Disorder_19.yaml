experimental_models:
- name: Patient megakaryocyte culture with lentiviral wild-type PRKACG rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Patient-derived megakaryocytes from homozygous PRKACG p.Ile74Met individuals
  culture_system: Megakaryocyte culture transduced with a lentiviral vector expressing wild-type PRKACG
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  publication: PMID:25061177
  description: >-
    The single strongest piece of evidence in this disease, and the reason ClinGen graded
    the experimental arm favourably even while disputing the relationship overall.
    Reintroducing wild-type PRKACG into patient megakaryocytes restored proplatelet
    formation; the mutant construct did not. That is a within-patient-cell rescue, which
    controls for the patient's genetic background in a way that the pedigree cannot.
  modeled_mechanisms:
  - target: Defective Proplatelet Formation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Restores the mechanism node by supplying the missing wild-type activity, establishing
      that the proplatelet defect is downstream of PRKACG function rather than incidental
      to it.
    limitations: >-
      Overexpression from a lentiviral vector rather than physiological correction, in
      cultured megakaryocytes from the same two siblings that constitute the whole reported
      cohort. The rescue therefore speaks to causality within these cells; it does not
      supply the independent families that the ClinGen dispute turns on.
    readouts:
    - name: Proplatelet formation by patient megakaryocytes
      target: Defective Proplatelet Formation
      direction: RESTORED
      biological_processes:
      - preferred_term: platelet formation
        term:
          id: GO:0030220
          label: platelet formation
      interpretation: >-
        Proplatelet extension recovered with wild-type PRKACG and not with the mutant,
        which is the measurement the rescue claim rests on.
      evidence:
      - reference: PMID:25061177
        reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The defect in proplatelet formation was rescued in vitro by lentiviral vector-mediated overexpression of wild-type PRKACG in patient MKs."
        explanation: Reports the rescue and its direction in patient megakaryocytes.
    evidence:
    - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
      reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Rescue experiments in patient cells demonstrated that overexpressing wild-type PRKACG in MKs from patients with the PRKACG homozygous variant notably improved proplatelet (PPT) formation, in contrast to the null effects seen with the mutant PRKACG."
      explanation: ClinGen's independent reading of the same experiment, including the mutant-construct control that makes it informative for this node.

differential_diagnoses:
- name: GNE-related congenital macrothrombocytopenia
  description: >-
    Listed here because it is the specific alternative that ClinGen's dispute turns on, not
    as a routine differential. The proband in the founding family carried an unevaluated
    GNE missense variant, and GNE has since become an established cause of severe
    congenital macrothrombocytopenia. Distinguishing the two matters for anyone
    reinvestigating this family or a new candidate case. GNE was established as a cause of
    severe congenital thrombocytopenia by PMID:29941673 (Blood, 2018), four years after the
    PRKACG report and six years before ClinGen's review; that paper is indexed without an
    abstract, so it is listed in `references` rather than quoted as evidence.
  evidence:
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, the proband had a missense variant in the GNE gene, which at the time was not associated with thrombocytopenia, leaving the GNE variant's role in the condition unexplored. Therefore, this case has not been classified as providing genetic-level evidence."
    explanation: Establishes that the GNE variant exists in this family and was never evaluated.

discussions:
- discussion_id: prkacg_bdplt19_disputed_validity
  prompt: >-
    Does PRKACG cause platelet-type bleeding disorder 19, or is the single reported family
    explained by something else - and what evidence would settle it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#PRKACG p.Ile74Met (disputed)
  - pathophysiology#Homozygous PRKACG p.Ile74Met Variant
  rationale: >-
    The asymmetry here is unusual and worth recording as a gap rather than smoothing away.
    The mechanistic evidence is comparatively strong for a disease of this size - a filamin
    A deficit measured in patient cells, an elevated cAMP pool, and a within-patient-cell
    rescue with a mutant-construct control. The genetic evidence is two siblings in one
    consanguineous pedigree, with an unevaluated GNE variant in the proband. ClinGen's
    DISPUTED classification is a statement about the second of those, not the first.

    What would resolve it is not more mechanism but a second unrelated family, or a
    re-analysis of the original one that either excludes or implicates the GNE variant.
    Nothing in the published record does either, and no second family has appeared in the
    decade since.
  evidence:
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Case-level genetic evidence from the aforementioned study includes the identification of two siblings with a homozygous missense variant in PRKACG (c.222C>G, p.Ile74Met)."
    explanation: Quantifies the genetic evidence that the dispute rests on.

notes: >-
  Why this is not a member of the Inherited Platelet Function Disorders grouping, and does
  not declare `conforms_to`. That grouping's defining criterion is conformance to
  `primary_hemostatic_plug_failure`, and its scope note admits an inherited thrombocytopenia
  only when a qualitative functional defect is also curated. A functional defect is reported
  here - impaired platelet activation and cytoskeletal reorganization - but the primary
  report reaches the reference cache as an abstract only, and the abstract states the
  defect at exactly that level. The granule-secretion, integrin inside-out and
  agonist-specific claims that the module's arm node is built from cannot be
  snippet-verified, and asserting conformance would mean asserting them. The primary lesion
  is also platelet biogenesis, which is not one of the module's four arms. `Platelet-type
  Bleeding Disorder 20` (SLFN14) is curated the same way, and the grouping's own notes list
  both SLFN14 and PRKACG as known gaps rather than members.

  This one is worth revisiting rather than filing away. The deep-research report included in
  this PR reports, from the primary full text, that patient platelets showed absent
  P-selectin externalization, no rise in surface integrin alphaIIbbeta3 on stimulation, and
  reduced GPIb internalization - which is arm-level data of exactly the kind the module node
  wants. None of it is quotable from the cache, so none of it is curated. If the full text
  becomes retrievable, the conformance and the grouping membership should be added together,
  with the ClinGen DISPUTED classification stated at the point of membership so the grouping
  does not silently absorb a contested entity.

  What is deliberately absent. No frequency on any phenotype: a proportion computed from
  two siblings is not a disease frequency. No penetrance, no age of onset, no bleeding-score
  data, no treatment entries - the cached abstract and the ClinGen record say nothing about
  management, and platelet-transfusion or antifibrinolytic guidance copied from the
  inherited-thrombocytopenia literature generally would not be about this disease. No
  animal model: none has been reported for PRKACG in this context.

  Orphanet has a record for this concept (ORPHA:438207, "Severe autosomal recessive
  macrothrombocytopenia", MONDO:0014518 exact match) whose definition enumerates the
  bleeding pattern. It is not cited here because the pinned Orphadata snapshot in
  `data/orphadata/MANIFEST.yaml` could not be reproduced - upstream now serves a different
  `en_product1.xml` behind the same URL - so a cache file built today would carry a
  provenance line naming a release it was not built from. Repinning is a separate change.


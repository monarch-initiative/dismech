genetic:
- name: PRKACG p.Ile74Met (disputed)
  association: Reported causative in one consanguineous family; classified Disputed by ClinGen
  relationship_type: DISPUTED
  gene_term:
    preferred_term: PRKACG
    term:
      id: hgnc:9382
      label: PRKACG
  variant_origin: GERMLINE
  notes: >-
    Typed DISPUTED, matching the ClinGen Hemostasis/Thrombosis GCEP classification of
    2024-05-03 (SOP10). Reading ClinGen's own summary, the dispute is not about the
    experimental work - which includes a rescue - but about how little case-level genetic
    evidence there is and about an unevaluated confounder.

    The confounder deserves stating plainly, because it has aged badly in one direction.
    ClinGen discounted the family's case-level evidence in part because the proband also
    carried a missense variant in GNE whose role was left unexplored, GNE not having been
    a thrombocytopenia gene at the time of the 2014 report. GNE-related congenital
    macrothrombocytopenia is now an established entity, so the alternative explanation
    ClinGen declined to score is more live today than when the dispute was recorded.

    This is not a claim that the GNE variant explains the family - the point is that the
    question was never asked, not that it has been answered. Note also what is NOT
    established from any source that can be quoted here: ClinGen's summary describes "a
    missense variant in the GNE gene" without giving its identity or zygosity, and the
    Manchev abstract does not mention GNE at all, so the allele's zygosity is deliberately
    not asserted in this entry. Establishing it needs the primary full text, which is not
    retrievable into the reference cache.
  evidence:
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is disputed evidence to support this gene-disease relationship."
    explanation: The classification this record is typed from.
  - reference: CGGV:assertion_5d74cf9f-a082-4cca-9a70-d634c3d0078b-2024-05-03T170000.000Z
    reference_title: PRKACG / platelet-type bleeding disorder 19 (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, the proband had a missense variant in the GNE gene, which at the time was not associated with thrombocytopenia, leaving the GNE variant's role in the condition unexplored. Therefore, this case has not been classified as providing genetic-level evidence."
    explanation: The specific reason the family was not counted as genetic evidence, and the basis for the GNE point in the notes above.
  - reference: PMID:25061177
    reference_title: A new form of macrothrombocytopenia induced by a germ-line mutation in the PRKACG gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutated allele cosegregating with the macrothrombocytopenia"
    explanation: The evidence on the other side - the variant tracks with the phenotype within the pedigree.


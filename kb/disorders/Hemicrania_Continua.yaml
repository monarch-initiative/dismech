  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the cohort, 97% had at least one cranial autonomic feature during exacerbations: 73% had lacrimation, 51% nasal congestion, 46% conjunctival injection and 40% ptosis and facial flushing."
    explanation: >-
      Names nasal congestion directly at 51 per cent of the cohort.
- name: Ptosis
  category: Autonomic
  description: >-
    Drooping of the upper lid on the painful side, part of the partial
    Horner-like picture that can accompany exacerbations.
  phenotype_term:
    preferred_term: Ipsilateral ptosis
    term:
      id: HP:0000508
      label: Ptosis
  frequency: FREQUENT
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the cohort, 97% had at least one cranial autonomic feature during exacerbations: 73% had lacrimation, 51% nasal congestion, 46% conjunctival injection and 40% ptosis and facial flushing."
    explanation: >-
      Names ptosis directly at 40 per cent, reported together with facial
      flushing at the same rate.
- name: Miosis
  category: Autonomic
  description: >-
    Pupillary constriction on the painful side, the other half of the partial
    Horner-like picture.
  phenotype_term:
    preferred_term: Ipsilateral miosis
    term:
      id: HP:0000616
      label: Miosis
  notes: >-
    No frequency band, deliberately. The source names miosis in its list of other
    autonomic features without a percentage, unlike the four it does quantify.
    The same list also reports MYDRIASIS, which is worth holding onto rather than
    tidying away: a disorder producing both pupillary constriction and dilation
    is not showing a clean sympathetic lesion, and that untidiness is a fact
    about the autonomic disturbance rather than noise in the reporting.
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other cranial autonomic features included rhinorrhoea, forehead/facial sweating, itching eye, eyelid oedema, sense of aural fullness and periaural swelling, miosis, mydriasis and swelling of the cheek and face."
    explanation: >-
      Names miosis directly, in the unquantified tail of the autonomic list
      rather than among the four features given percentages.
- name: Restlessness or agitation
  category: Behavioral
  description: >-
    Pacing, rocking, an inability to keep still during an exacerbation. This is
    not incidental distress: ICHD-3 admits it as an alternative to cranial
    autonomic features in the diagnostic criteria, so a patient with no visible
    autonomic sign can still meet the definition on this alone. It also carries
    diagnostic weight in the other direction, since the migraine patient this
    disease is most often mistaken for characteristically lies still in the dark.
  phenotype_term:
    preferred_term: Restlessness during exacerbations
    term:
      id: HP:0000711
      label: Restlessness
  frequency: FREQUENT
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, about two-thirds were agitated or restless, or both, and about one-quarter were aggressive, mainly verbally, with severe pain."
    explanation: >-
      Quantifies the feature at about two-thirds of the cohort, which supports the
      FREQUENT band, and records the aggression at the severe end as well.
- name: Agitation
  category: Behavioral
  description: >-
    The agitated pole of the same restlessness, reported together with it in the
    source and separated here only because HPO codes the two distinctly.
  phenotype_term:
    preferred_term: Agitation during exacerbations
    term:
      id: HP:0000713
      label: Agitation
  frequency: FREQUENT
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, about two-thirds were agitated or restless, or both, and about one-quarter were aggressive, mainly verbally, with severe pain."
    explanation: >-
      PARTIAL because the source counts agitated OR restless OR both as one
      figure, so two-thirds is a combined rate rather than a rate for agitation
      alone. The band is an upper bound on this term.

name: Hemicrania Continua
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Hemicrania continua is a primary headache disorder consisting of continuous,
  strictly one-sided head pain with superimposed severe exacerbations, during
  which cranial autonomic features appear on the same side: tearing, nasal
  congestion, a drooping lid, a small pupil, sometimes agitation and restlessness
  rather than the stillness of migraine.

  What makes it unusual among diseases is not the pain but the definition. An
  absolute response to indomethacin is part of the diagnostic criteria, so the
  disease is identified by what it responds to rather than by what can be
  measured in it. That is a strong claim to build a nosology on, and it has two
  consequences worth stating plainly. It makes diagnosis a therapeutic trial: the
  patient must be given the drug in adequate dose to find out what they have. And
  it makes the disease definitionally treatable, which flatters the treatment
  literature, because anyone who does not respond has by definition been given a
  different diagnosis.

  Mechanistically it sits with the trigeminal autonomic cephalalgias, in which
  trigeminal nociceptive traffic and cranial parasympathetic outflow are coupled,
  plausibly through hypothalamic and brainstem circuitry. The account is
  systems-level and inferred from imaging and clinical phenomenology rather than
  demonstrated molecularly. There is no causal gene, no validated biomarker, and
  no accepted animal model, and this entry records those absences rather than
  filling them.

  A practical caution runs through the diagnostic literature: structural lesions
  can produce a syndrome indistinguishable from the primary disorder, so imaging
  is required before the label is applied.
category: Complex
disease_term:
  preferred_term: Hemicrania Continua
  term:
    id: MONDO:0018615
    label: hemicrania continua
synonyms:
- HC
- Continuous hemicrania
notes: >-
  A definitional peculiarity, curated deliberately because it distorts how the
  evidence should be read. Absolute indomethacin response is part of the
  diagnostic criteria for this disease. That makes every reported case a
  responder by construction, so the apparent efficacy of indomethacin here is not
  an outcome measurement and must not be read as one. It also means true
  non-responders are, by definition, outside the entity, which places an unknown
  number of people with an otherwise identical syndrome somewhere else in the
  nosology.

  Absences recorded rather than filled. No causal gene, no established inheritance
  pattern, no validated biomarker, no disease-specific omics signature, and no
  accepted animal model was identified. The entry has no genetic section for that
  reason, which is the honest representation rather than an omission.

  Provider note. Built from an Edison Falcon deep-research report, which cites by
  DOI and internal corpus keys rather than PMIDs; its DOIs were resolved to
  PubMed records and supplemented with primary literature, and every snippet is
  verified against a PMID. All ontology identifiers were verified independently
  against the ontologies rather than taken from the report, following
  real-but-wrong identifiers found in other Falcon entries in this batch.
pathophysiology:
- name: Trigeminal Autonomic Reflex Activation
  biological_scale: ORGANISM
  description: >-
    The systems-level mechanism shared across the trigeminal autonomic
    cephalalgias: trigeminal nociceptive input and cranial parasympathetic
    outflow are abnormally coupled, so pain and autonomic features arrive
    together and on the same side. The proposed substrate involves hypothalamic
    dysfunction together with trigeminovascular, trigeminocervical,
    trigeminoautonomic, circadian and nociceptive circuitry. This is an inferred
    systems account rather than a demonstrated molecular one, and the node is
    pitched at that level deliberately.
  evidence:
  - reference: PMID:34048396
    reference_title: "Cluster Headache and Other Trigeminal Autonomic Cephalalgias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The underlying pathophysiology of TACs is likely rooted in hypothalamic dysfunction and derangements in the interplay of circuitry involving trigeminovascular, trigeminocervical, trigeminoautonomic, circadian, and nociceptive systems"
    explanation: >-
      States the proposed mechanism and, in the word "likely", its epistemic
      status. The hedge is preserved rather than flattened into an assertion.
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemicrania continua (HC) is an indomethacin-responsive primary headache disorder which is currently classified under the heading of trigeminal autonomic cephalalgias (TACs)."
    explanation: >-
      Places this disease within the trigeminal autonomic cephalalgias, which is
      what licenses applying the shared mechanism above to it.
  downstream:
  - target: Continuous Unilateral Head Pain with Exacerbations
    causal_link_type: DIRECT
    description: >-
      Sustained trigeminal nociceptive activity with superimposed surges.
  - target: Ipsilateral Cranial Autonomic Activation
    causal_link_type: DIRECT
    description: >-
      Parasympathetic outflow coupled to the nociceptive traffic, producing
      autonomic signs on the painful side.
- name: Continuous Unilateral Head Pain with Exacerbations
  biological_scale: ORGANISM
  description: >-
    The background pain is continuous and does not remit, which distinguishes
    this from the episodic trigeminal autonomic cephalalgias, and severe
    exacerbations are superimposed on it. The pain is characteristically
    side-locked, though a small minority of patients have side-alternating pain,
    which is worth recording because side-locking is often treated as
    definitional.
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemicrania continua is an uncommon primary headache disorder, characterized by continuous unilateral pain, where pain exacerbations are associated with cranial autonomic features."
    explanation: >-
      Establishes the continuous background pain and the association of
      exacerbations with autonomic features, which is the structure this node
      describes.
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-six (92%) patients had side-locked pain and 3 (8%) had side-alternating pain."
    explanation: >-
      Quantifies the exception to side-locking. Curated because a feature
      described as characteristic is absent in roughly one patient in twelve, and
      a strict reading would misclassify them.
  downstream:
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      The clinical symptom.
- name: Ipsilateral Cranial Autonomic Activation
  biological_scale: ORGANISM
  description: >-
    Parasympathetic and sympathetic signs on the same side as the pain: tearing,
    conjunctival injection, nasal congestion, ptosis and miosis. Their
    ipsilateral confinement is mechanistically informative, since a systemic
    autonomic disturbance would not respect the midline, and it is what places
    the disorder among the trigeminal autonomic cephalalgias rather than among
    the migraines.
  evidence:
  - reference: PMID:37566220
    reference_title: "Hemicrania Continua: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemicrania Continua (HC) is a rare and disabling primary headache disorder that is characterized by persistent, unilateral headache with ipsilateral, cranial autonomic symptoms and restlessness or agitation."
    explanation: >-
      Names the ipsilateral confinement of the autonomic symptoms and the
      restlessness that accompanies exacerbations.
  downstream:
  - target: Lacrimation abnormality
    causal_link_type: DIRECT
    description: >-
      Parasympathetic activation of the lacrimal gland.
  - target: Nasal congestion
    causal_link_type: DIRECT
    description: >-
      Parasympathetic nasal mucosal vasodilation and secretion.
  - target: Ptosis
    causal_link_type: DIRECT
    description: >-
      Sympathetic involvement producing a partial Horner-like picture.
  - target: Miosis
    causal_link_type: DIRECT
    description: >-
      The pupillary component of the same sympathetic involvement.

diagnosis:
- name: Recognition of the diagnosis
  description: >-
    Not a test, and included as a diagnostic entry because in this disease the
    binding constraint is recognition rather than investigation. The diagnostic
    tool exists, costs almost nothing, and is decisive; patients nonetheless wait
    an average of eight years. That gap is the single most actionable fact in the
    entry, and it follows from the disease looking like chronic migraine on
    almost every feature a clinician screens for.
  evidence:
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled mean delay of diagnosis of HC is 8.0 ± 7.2 years"
    explanation: >-
      Quantifies the delay and, in the size of its standard deviation, shows how
      variable it is: a spread of that width means some patients are diagnosed
      quickly and others wait a decade and a half.
- name: Indomethacin trial as a diagnostic criterion
  description: >-
    The defining diagnostic step, and an unusual one: the disease is identified by
    an absolute response to adequate doses of indomethacin, which is written into
    the criteria rather than being merely characteristic. The practical
    consequence is that diagnosis requires giving the drug, so a patient with a
    compatible syndrome cannot be diagnosed without a therapeutic trial. The
    logical consequence is that the entity is constructed to contain only
    responders.
  evidence:
  - reference: PMID:37566220
    reference_title: "Hemicrania Continua: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis requires patients to experience an absolute response to therapeutic doses of indomethacin."
    explanation: >-
      States the requirement explicitly, including that the response must be
      absolute and to therapeutic doses.
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmark of this condition is the absolute response to indometacin."
    explanation: >-
      Independent statement of the same defining property from a clinical series.
- name: Neuroimaging to exclude secondary mimics
  description: >-
    Required before the primary label is applied, because structural lesions can
    reproduce the syndrome closely. This is not a formality: a significant
    proportion of trigeminal autonomic cephalalgia presentations have secondary
    causes, and the indomethacin response does not reliably distinguish them,
    since a secondary lesion producing the same circuitry disturbance can respond
    too.
  evidence:
  - reference: PMID:34048396
    reference_title: "Cluster Headache and Other Trigeminal Autonomic Cephalalgias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant proportion of TAC presentations may have secondary causes."
    explanation: >-
      Establishes the frequency of secondary causes in this syndrome class, which
      is the justification for imaging before diagnosis.
treatments:
- name: Indomethacin
  description: >-
    Simultaneously the treatment and the diagnostic test, which is why its
    apparent efficacy must be read carefully. Response is characteristically
    rapid and complete. But because an absolute response is part of the case
    definition, every diagnosed patient is a responder by construction, and the
    literature reporting near-universal efficacy is describing the definition
    rather than measuring an effect. The drug is genuinely effective; the
    evidence for it is circular, and both things are true.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: indometacin
      term:
        id: CHEBI:49662
        label: indometacin
  target_mechanisms:
  - target: Trigeminal Autonomic Reflex Activation
    treatment_effect: MODULATES
    description: >-
      Acts on the mechanism rather than the symptom, though how is not
      established. Indomethacin's distinctive activity in this disorder is not
      shared by other non-steroidal anti-inflammatory drugs, which argues that
      cyclo-oxygenase inhibition alone does not account for it.
    evidence:
    - reference: PMID:37566220
      reference_title: "Hemicrania Continua: An Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The diagnosis requires patients to experience an absolute response to therapeutic doses of indomethacin."
      explanation: >-
        Establishes the completeness of the response, which is what makes this a
        mechanism-level effect rather than analgesia.
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmark of this condition is the absolute response to indometacin."
    explanation: >-
      The efficacy claim, quoted from a clinical series. Note the circularity
      recorded in the description: this is also the criterion by which the series
      was assembled.
- name: COX-2 Inhibitors and Other Indomethacin Alternatives
  description: >-
    The treatment question that matters in practice, and the one an
    indomethacin-only entry hides. Indomethacin works, but between a fifth and
    three-quarters of patients develop side effects on it, and it is not a safe
    drug to take indefinitely. So the real clinical problem is not whether
    indomethacin works, it is what to do for the substantial fraction who cannot
    keep taking it. The alternatives are COX-2 inhibitors, a piroxicam
    derivative, and topiramate, with melatonin as an adjunct. All of them are
    supported by case reports and open-label series rather than trials, and none
    responds predictably in an individual patient, which is a real limitation and
    not a hedge.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: celecoxib
      term:
        id: CHEBI:41423
        label: celecoxib
    - preferred_term: topiramate
      term:
        id: CHEBI:63631
        label: topiramate
  target_mechanisms:
  - target: Trigeminal Autonomic Reflex Activation
    treatment_effect: MODULATES
    description: >-
      Directed at the same mechanism as indomethacin without reproducing its
      completeness of effect. That partial, inconsistent response is itself
      evidence about the mechanism, and it is what the entry's knowledge gap
      turns on.
    evidence:
    - reference: PMID:28721092
      reference_title: "Hemicrania continua: clinical review, diagnosis and management."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "However, the effects of all these drugs are not uniform and consistent in each patient."
      explanation: >-
        PARTIAL by the source's own statement: these drugs work in some patients
        and not others, and which is which cannot be predicted.
  evidence:
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The COX-2 inhibitors (celecoxib and rofecoxib,), piroxicam derivative and topiramate are the main drugs found to be effective in patients with HC."
    explanation: >-
      Names the alternatives and identifies COX-2 inhibitors as the main
      effective class.
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence and prevalence of indomethacin-related side effects in patients with HC vary between 20% and 75%."
    explanation: >-
      The reason alternatives are needed at all, and the figure that makes
      indomethacin-only management untenable for a large minority.
  notes: >-
    Two safety points from the same source that belong with any recommendation
    here: celecoxib and rofecoxib carry increased vascular risk and need
    caution, and topiramate brings glaucoma, renal stones and depression that
    require monitoring. Rofecoxib is named in the source but was withdrawn from
    the market and is not curated as a therapeutic_agent.
clinical_trials:
- name: NCT04303845
  phase: NOT_APPLICABLE
  status: TERMINATED
  description: >-
    A trial of erenumab, a CGRP receptor antibody, in hemicrania continua. It
    matters here despite, or because of, being terminated with almost no
    enrolment: the difficulty of running a trial in this disease is itself a
    consequence of the mechanism this entry curates. A disorder defined by an
    absolute response to a drug already in hand, and diagnosed on average eight
    years late, offers very few untreated patients willing to be randomised to
    something else.
  target_phenotypes:
  - preferred_term: Continuous unilateral headache
    term:
      id: HP:0002315
      label: Headache
  notes: >-
    Recorded as a negative result about feasibility, not about efficacy. A trial
    stopped at minimal enrolment says nothing whatever about whether erenumab
    works, and this entry does not claim it does.
  evidence:
  - reference: clinicaltrials:NCT04303845
    reference_title: "Erenumab For Treatment of Hemicrania Continua"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This research is being conducting to learn if the study drug erenumab is successful in treating hemicrania continua."
    explanation: >-
      States the trial objective. Quoted verbatim including the registry's own
      grammatical error.
- name: NCT01842763
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    A French registry of occipital nerve stimulation across refractory chronic
    headache disorders, hemicrania continua among them. Observational rather than
    interventional, and included because neuromodulation is the practical option
    left for the patient who can neither tolerate indomethacin nor respond
    reliably to the alternatives, which the treatments section now records as a
    substantial minority.
  target_phenotypes:
  - preferred_term: Continuous unilateral headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: clinicaltrials:NCT01842763
    reference_title: "French Database of Occipital Nerves Stimulation in the Treatment of Refractory Chronic Headache Disorders"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this non interventional research is to set up a French database, initially for 3 years, of patients suffering from refractory chronic headache disorders (chronic migraine, cluster headache, chronic paroxysmal hemicranias, SUNCT syndrome, hemicrania continua, cervicogenic headache disorders), and treated by occipital nerves stimulation."
    explanation: >-
      PARTIAL: names hemicrania continua among the disorders covered, but this is
      a multi-disorder observational registry, so it establishes that the
      intervention is used in this disease rather than that it works in it.
discussions:
- discussion_id: hc_indomethacin_circularity
  prompt: >-
    Because absolute indomethacin response is part of the diagnostic criteria,
    what happens to patients with an otherwise identical syndrome who do not
    respond, and is hemicrania continua a mechanism or a drug-response category?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Trigeminal Autonomic Reflex Activation
  - treatments#Indomethacin
  rationale: >-
    A definition built on a therapeutic response has a blind spot by
    construction. Patients with continuous unilateral headache, ipsilateral
    cranial autonomic features and no indomethacin response are excluded from the
    entity, and where they go is unclear: they may have a distinct disorder, a
    variant of the same mechanism with a different pharmacology, or the same
    disease inadequately dosed. This is not merely taxonomic. If the underlying
    mechanism is what the trigeminal autonomic account describes, then
    indomethacin responsiveness is a property of one subgroup and the entity is
    narrower than the biology. Resolving it would require studying the excluded
    patients, who by definition are not in any hemicrania continua cohort.
  proposed_experiments:
  - experiment_id: hc_nonresponder_phenotyping
    name: Phenotyping of indomethacin non-responders with an otherwise typical syndrome
    description: >-
      Prospectively characterise patients meeting every hemicrania continua
      criterion except the indomethacin response, with imaging, autonomic
      testing, and where available functional imaging, and compare them with
      responders. If they are indistinguishable other than by drug response, the
      criterion is selecting on pharmacology rather than on disease.
- discussion_id: hc_indomethacin_mechanism
  prompt: >-
    Why does indomethacin abolish hemicrania continua when other non-steroidal
    anti-inflammatory drugs do not?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Indomethacin
  rationale: >-
    The selectivity is the clue and it is unexplained. State it carefully,
    because an earlier revision of this rationale overstated it and its own
    cached source contradicted it. Other cyclo-oxygenase inhibitors are NOT
    inert here: COX-2 inhibitors are described as the main effective
    alternatives for patients who cannot tolerate indomethacin. What they do not
    reproduce is the ABSOLUTE and predictable response that defines the disease,
    since their effects are explicitly not uniform or consistent between
    patients. So the puzzle is not that the class does nothing, it is that one
    member of the class does something categorically different from the rest.
    Proposed explanations have included effects on nitric oxide signalling, on
    intracranial pressure, and on cerebral blood flow, none established. This matters beyond curiosity: the mechanism of the defining
    drug is the most direct available probe of the mechanism of the disease, and
    a disorder identified by a drug response with no account of why that drug
    works has a hole at its centre.
  proposed_experiments:
  - experiment_id: hc_nsaid_comparative_challenge
    name: Comparative NSAID challenge with mechanistic readouts
    description: >-
      Challenge diagnosed patients with indomethacin and with comparator
      non-steroidal drugs matched for cyclo-oxygenase inhibition, measuring
      headache response alongside candidate mediators, to establish whether the
      distinguishing property is pharmacodynamic rather than class-based.
differential_diagnoses:
- name: Secondary hemicrania continua from structural lesion
  description: >-
    The differential that matters most, and the reason imaging precedes the
    diagnosis. Structural pathology can produce a syndrome closely resembling the
    primary disorder, and a significant proportion of trigeminal autonomic
    cephalalgia presentations prove secondary. An indomethacin response does not
    exclude this, since a lesion disturbing the same circuitry may respond
    similarly.
  evidence:
  - reference: PMID:34048396
    reference_title: "Cluster Headache and Other Trigeminal Autonomic Cephalalgias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant proportion of TAC presentations may have secondary causes."
    explanation: >-
      Quantifies the concern that motivates imaging every case before applying
      the primary label.
- name: Chronic migraine
  description: >-
    The commonest misdiagnosis, and the reason diagnostic delay in this disease is
    measured in years. Migrainous features including photophobia, phonophobia and
    nausea are frequent in hemicrania continua, so the syndromes overlap
    substantially. Distinguished by strict side-locking, by continuous rather than
    episodic pain, by cranial autonomic features, and definitively by the
    indomethacin response.
- name: Chronic paroxysmal hemicrania
  description: >-
    The other indomethacin-responsive trigeminal autonomic cephalalgia, and the
    closest relative. Distinguished by its temporal pattern: discrete attacks
    lasting minutes with pain-free intervals, rather than a continuous background
    with exacerbations.
- name: Chronic cluster headache
  description: >-
    Shares the strictly unilateral pain with prominent ipsilateral autonomic
    features and agitation, but occurs in discrete attacks with pain-free periods
    and does not respond absolutely to indomethacin.
prevalence:
- population: Patients attending headache or neurology clinics
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    HC accounts for 1.7 per cent of headache-clinic attenders, with a reported
    range of 1.3 to 2.3 per cent. Recorded with measure_type UNKNOWN and no
    rate_per_100000 deliberately. This is a proportion of an already-selected
    referral population, not a population prevalence, and encoding it in the
    structured prevalence slots would assert a general-population rate roughly
    twenty times the community estimate below. Downstream tooling reads the
    slots, not this note, which is why the caveat cannot live in prose alone.
    An earlier revision of this entry recorded 1.8 per cent, which appears
    nowhere in the source; the figure 1.8 in that reference is the female-to-male
    ratio.
  evidence:
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HC represents 1.7% (range 1.3%–2.3%) of total headache patients attending headache or neurology clinic."
    explanation: >-
      Gives the clinic-based proportion and its reported range, and states the
      denominator explicitly as headache or neurology clinic attenders.
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a highly misdiagnosed and underreported primary headache."
    explanation: >-
      Supports treating any reported frequency as a lower bound.
- population: General community (Vaga study)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    A community study of 1838 parishioners found 18 people, 1.0 per cent, with
    clinical features RESEMBLING hemicrania continua. The qualifier matters and is
    preserved: these were not confirmed diagnoses, and confirmation would have
    required demonstrating an absolute indomethacin response in each, which a
    community survey does not do. This is nonetheless the only population-based
    figure available, and it is recorded as such because the entry previously and
    wrongly stated that no general-population prevalence had been identified,
    when this study sits in the same cached reference.

    rate_per_100000 is deliberately empty here too, on the reviewer's prompting
    and on reflection correctly. The source says in the adjacent sentence that
    this is not a prevalence of definite hemicrania continua, so putting 1000 per
    100,000 into a slot that downstream tooling reads as a disease rate would
    reproduce, one level down, exactly the error the clinic record above was
    corrected for. The class band carries the order of magnitude without
    asserting a measurement the source disclaims.
  evidence:
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "noted 18 patients (1.0%) with clinical features resembling HC in 1838 parishioners in the Vågå study."
    explanation: >-
      PARTIAL because the study identifies features resembling the disease rather
      than confirmed cases, so it bounds the community frequency without
      establishing it.
  - reference: PMID:28721092
    reference_title: "Hemicrania continua: clinical review, diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It makes it hard to find out the prevalence of (definite) HC in any general population."
    explanation: >-
      States why a definite population prevalence is unavailable, which is a
      direct consequence of the diagnostic criteria requiring a therapeutic trial:
      you cannot confirm the diagnosis in a survey without treating everyone.

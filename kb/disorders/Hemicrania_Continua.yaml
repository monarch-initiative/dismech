- name: Phonophobia
  category: Neurological
  description: >-
    Sound sensitivity, and one of the two features that make this disease look
    like chronic migraine. Its presence is a large part of why patients wait
    years for the diagnosis, so it belongs in the phenotype list rather than only
    in the differential.
  phenotype_term:
    preferred_term: Phonophobia
    term:
      id: HP:0002183
      label: Phonophobia
  frequency: FREQUENT
  evidence:
  - reference: PMID:20558416
    reference_title: "Hemicrania continua: a clinical study of 39 patients with diagnostic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-one (79%) had phonophobia, which was unilateral in 14 (48%); 29 (74%) had photophobia, which was unilateral in 14 (48%); and 27 (69%) had motion sensitivity."
    explanation: >-
      Puts phonophobia at 79 per cent, the commonest feature in the cohort after
      the pain itself. Note the detail that it was UNILATERAL in about half:
      unilateral phonophobia is not a migraine feature, so the same symptom that
      causes the misdiagnosis can, examined properly, help undo it.
- name: Photophobia

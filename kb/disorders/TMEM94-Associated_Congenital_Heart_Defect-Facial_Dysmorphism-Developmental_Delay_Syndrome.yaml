mechanistic_hypotheses:
- hypothesis_group_id: er_magnesium_deficiency
  hypothesis_label: >-
    Loss of ERMA-mediated Mg2+ uptake into the endoplasmic reticulum causes the
    cardiac, craniofacial and neurodevelopmental defects
  status: EMERGING
  description: >-
    Patient TMEM94 variants abolish ER Mg2+ uptake when expressed in mouse
    embryonic fibroblasts and hepatocytes, and Tmem94 knockout embryos have
    cardiac, craniofacial and neuronal migration defects. The step between
    these, that low ER Mg2+ is what disturbs heart, face and brain
    development, is proposed by the authors of the ERMA studies and has not
    been tested in a developmental model. Edges that belong to it carry
    hypothesis_groups: [er_magnesium_deficiency].
  evidence:
  - reference: PMID:42384784
    reference_title: "Structural and mutational insights define ERMA as the ER Mg(2+) ATPase and reservoir gatekeeper."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Together, these findings integrate functional, structural, and pathological insights, defining ERMA as a phosphorylation-gated Mg2+ pump whose pathogenic mutations are likely associated with ERMg2+ deficiency, which leads to systemic developmental failure"
    explanation: >-
      The authors propose that ER Mg2+ deficiency links the pathogenic
      variants to the developmental phenotype; their data are cell-based.
pathophysiology:
- name: TMEM94 Biallelic Loss of Function
  description: >-
    Biallelic frameshift, nonsense and splice-site variants truncate TMEM94
    (ERMA) and reduce its expression in patient cells. ERMA is an endoplasmic
    reticulum P-type ATPase with actuator, nucleotide-binding and
    phosphorylation domains and a C-terminal GMN motif. When patient alleles
    (W266Pfs30, R265Sfs7, A300Q328del, R922stop) are expressed in cells, they
    lose ATP-dependent Mg2+ uptake almost completely.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TMEM94
    term:
      id: hgnc:28983
      label: TMEM94
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:

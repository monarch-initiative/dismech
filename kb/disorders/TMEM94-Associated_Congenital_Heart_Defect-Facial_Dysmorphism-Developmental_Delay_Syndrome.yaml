      reference_title: "Structural and mutational insights define ERMA as the ER Mg(2+) ATPase and reservoir gatekeeper."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional assays demonstrated that frameshift (W266Pfs30 and R265Sfs7), in-frame deletion (A300Q328del), and truncation (R922stop) mutants cause a near-complete loss of ATP-dependent Mg2+ uptake in both WT hepatocytes and Erma−/− MEFs"
      explanation: Patient-derived ERMA alleles cannot take up Mg2+ into the ER of knockout or wild-type cells.
    - reference: PMID:42384784
      reference_title: "Structural and mutational insights define ERMA as the ER Mg(2+) ATPase and reservoir gatekeeper."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of human ERMA disease–associated mutant constructs in WT hepatocytes markedly suppressed ERMg2+ uptake, consistent with these variants conferring a loss-of-function phenotype."
      explanation: The patient alleles behave as loss-of-function alleles in hepatocytes.

- name: Aberrant Cardiomyocyte Calcium Cycling
  description: >-
    Cardiomyocytes isolated from heterozygous Erma mice have irregular
    spontaneous Ca2+ transients, and siRNA knockdown of ERMA in human
    iPSC-derived cardiomyocytes abolishes their Mg2+ oscillations and disturbs
    Ca2+ cycling. Cytosolic Mg2+ modulates cardiac Ca2+ handling, which is the
    proposed link. Ca2+ cycling has not been studied in patient-derived
    cardiomyocytes.
  biological_scale: CELLULAR

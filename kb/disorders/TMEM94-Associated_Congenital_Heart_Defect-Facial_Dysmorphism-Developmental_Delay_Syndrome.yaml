genetic:
- name: TMEM94
  association: Causal
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TMEM94
    term:
      id: hgnc:28983
      label: TMEM94
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_9053be11-f8c6-4c9a-8efa-487e07abf52e-2024-06-05T160000.000Z
    evidence:
    - reference: CGGV:assertion_9053be11-f8c6-4c9a-8efa-487e07abf52e-2024-06-05T160000.000Z
      reference_title: "TMEM94 / intellectual developmental disorder with cardiac defects and dysmorphic facies (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TMEM94 | HGNC:28983 | intellectual developmental disorder with cardiac defects and dysmorphic facies | MONDO:0032672 | AR | Definitive | SOP10 | Syndromic Disorders Gene Curation Expert Panel"
      explanation: ClinGen classifies TMEM94 as Definitive for this disease, autosomal recessive.
  notes: >-
    ClinGen counts ten distinct variants (six frameshift, one nonsense, three
    splice-site) in 12 probands. Reported alleles include c.606dupG
    (p.Ile203AspfsTer4) and c.2729-2A>G (NM_014738.6) in two Saudi families,
    and c.2598_2599insC in a developmental delay exome cohort. TMEM94 is
    also called ERMA.
  evidence:
  - reference: PMID:30526868
    reference_title: "Bi-allelic TMEM94 Truncating Variants Are Associated with Neurodevelopmental Delay, Congenital Heart Defects, and Distinct Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe ten similarly affected individuals from six unrelated families of different ethnic origins having bi-allelic truncating variants in TMEM94"
    explanation: The founding report of TMEM94 as a disease gene.
  - reference: PMID:32825426
    reference_title: "Fetal Anomalies Associated with Novel Pathogenic Variants in TMEM94."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "we used trio-exome sequencing (trio-ES) in conjunction with chromosomal microarray analysis (CMA) to identify two novel homozygous loss of function variants in the TMEM94 gene (c.606dupG and c.2729-2A>G) in two unrelated Saudi Arabian families"
    explanation: Two further families with homozygous loss-of-function variants.
  - reference: PMID:39853208
    reference_title: "Novel mutations found in genes involved in global developmental delay and intellectual disability by whole-exome sequencing, homology modeling, and systems biology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, three were classified as pathogenic (DNMT1:c.856dup, KCNQ2:c.1635_1636insT, and TMEM94:c.2598_2599insC), and six were likely pathogenic."
    explanation: A pathogenic TMEM94 frameshift in a patient with developmental delay or intellectual disability.
  - reference: CGGV:assertion_9053be11-f8c6-4c9a-8efa-487e07abf52e-2024-06-05T160000.000Z
    reference_title: "TMEM94 / intellectual developmental disorder with cardiac defects and dysmorphic facies (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ten unique variants (6 frameshift, 1 nonsense, 3 splice-site) that have been reported in 12 probands with IDDCDF in 7 publications are included in this curation"
    explanation: ClinGen's count of variants and probands.
animal_models:
- name: Tmem94 knockout mouse
  species: Mouse
  genotype: Tmem94 -/- (CRISPR/Cas9 knockout)
  publication: PMID:30526868
  description: >-
    Homozygous loss of Tmem94 generated with CRISPR/Cas9 is embryonic lethal.
    The embryos have craniofacial and cardiac abnormalities and an abnormal
    neuronal migration pattern.
  modeled_mechanisms:
  - target: Abnormal Heart Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Knockout embryos have cardiac abnormalities, as patients have structural heart defects.
    limitations: >-
      The null embryos die before birth while patients survive, and the
      specific cardiac lesions in the embryos are not described in the cited
      abstract, so they cannot be matched to the human septal defects.
    evidence:
    - reference: PMID:30526868
      reference_title: "Bi-allelic TMEM94 Truncating Variants Are Associated with Neurodevelopmental Delay, Congenital Heart Defects, and Distinct Facial Dysmorphism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Tmem94 in mouse model generated by CRISPR/Cas9 was embryonic lethal and led to craniofacial and cardiac abnormalities and abnormal neuronal migration pattern, suggesting that this gene is important in craniofacial, cardiovascular, and nervous system development."
      explanation: Cardiac abnormalities in knockout embryos.
  - target: Abnormal Craniofacial Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Knockout embryos have craniofacial abnormalities, as patients have a recognizable face.
    limitations: >-
      Embryonic craniofacial abnormalities in a lethal null cannot be compared
      feature by feature with the facial gestalt of surviving patients.
    evidence:
    - reference: PMID:30526868
      reference_title: "Bi-allelic TMEM94 Truncating Variants Are Associated with Neurodevelopmental Delay, Congenital Heart Defects, and Distinct Facial Dysmorphism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Tmem94 in mouse model generated by CRISPR/Cas9 was embryonic lethal and led to craniofacial and cardiac abnormalities and abnormal neuronal migration pattern, suggesting that this gene is important in craniofacial, cardiovascular, and nervous system development."
      explanation: Craniofacial abnormalities in knockout embryos.
  - target: Abnormal Neuronal Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Knockout embryos show an abnormal neuronal migration pattern.
    limitations: >-
      Embryonic lethality prevents study of postnatal brain function, and
      whether patients have a neuronal migration defect has not been shown.
    evidence:
    - reference: PMID:30526868
      reference_title: "Bi-allelic TMEM94 Truncating Variants Are Associated with Neurodevelopmental Delay, Congenital Heart Defects, and Distinct Facial Dysmorphism."

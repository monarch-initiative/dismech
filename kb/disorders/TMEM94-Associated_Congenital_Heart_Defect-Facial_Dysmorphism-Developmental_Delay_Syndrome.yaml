- name: Endoplasmic Reticulum Mg2+ Uptake Deficiency
  description: >-
    ERMA pumps Mg2+ from the cytosol into the ER lumen, which is a major store
    of free intracellular Mg2+. Knockdown in HepG2 cells and knockout in mouse
    embryonic fibroblasts lower resting ER Mg2+, and the uptake defect is
    independent of SERCA and of ER Ca2+ handling. ERMA binds TUSC3, the product
    of another recessive intellectual disability gene, in an ER Mg2+ transport
    complex. The earliest reports described TMEM94 as a nuclear membrane
    protein; subcellular fractionation places it with SERCA2 in the ER. All
    measurements are from cell lines, mouse embryonic fibroblasts and primary
    hepatocytes; ER Mg2+ has not been measured in patient cells.
  biological_scale: CELLULAR

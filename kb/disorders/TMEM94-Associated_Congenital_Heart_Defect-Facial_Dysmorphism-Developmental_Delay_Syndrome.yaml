discussions:
- discussion_id: tmem94_heterozygous_dosage
  prompt: >-
    Heterozygous Erma mice develop cardiomyocyte Ca2+ cycling defects and
    reduced contractility, yet the human disease is recessive. Are heterozygous
    human carriers spared, or do they have a mild cardiac change that has not
    been examined?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant Cardiomyocyte Calcium Cycling
  - pathophysiology#Impaired Cardiac Contractile Function
  rationale: >-
    Loss of one Erma allele is enough to disturb Ca2+ transients in isolated
    mouse cardiomyocytes and to lower fractional shortening in older mice,
    while every reported patient carries two TMEM94 loss-of-function alleles
    and the cited sources report no cardiac assessment of carrier parents.
    Either mouse heart function is more sensitive to ERMA dosage than human
    heart function, or carriers have a subclinical change. Which is true
    decides whether the heterozygous mouse is a fair model for the patients'
    heart disease. Cardiac imaging of carrier parents, and Ca2+ handling in
    heterozygous and biallelic patient iPSC-derived cardiomyocytes, would
    separate the two.
  evidence:
  - reference: PMID:38513662
    reference_title: "ERMA (TMEM94) is a P-type ATPase transporter for Mg(2+) uptake in the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, estimated LV mass was ~30% lower and the fractional shortening was also lower in the older Erma+/− mice"
    explanation: A heterozygous cardiac phenotype in mice.
  - reference: PMID:30526868
    reference_title: "Bi-allelic TMEM94 Truncating Variants Are Associated with Neurodevelopmental Delay, Congenital Heart Defects, and Distinct Facial Dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe ten similarly affected individuals from six unrelated families of different ethnic origins having bi-allelic truncating variants in TMEM94"
    explanation: The human disease requires biallelic variants.

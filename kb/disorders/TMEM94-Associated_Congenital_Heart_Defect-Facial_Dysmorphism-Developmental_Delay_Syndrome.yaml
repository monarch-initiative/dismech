name: TMEM94-Associated Congenital Heart Defect-Facial Dysmorphism-Developmental Delay Syndrome
creation_date: "2026-11-11T22:16:54Z"
category: Mendelian
synonyms:
- intellectual developmental disorder with cardiac defects and dysmorphic facies
- IDDCDF
description: >-
  TMEM94-associated congenital heart defect-facial dysmorphism-developmental
  delay syndrome, listed by OMIM as intellectual developmental disorder with
  cardiac defects and dysmorphic facies (IDDCDF), is an autosomal recessive
  syndrome caused by biallelic frameshift, nonsense and splice-site variants
  in TMEM94. Affected individuals have global developmental delay with
  intellectual disability and speech delay, structural congenital heart
  defects in nearly all cases (atrial and ventricular septal defects,
  atrioventricular septal defect, tetralogy of Fallot), and a recognizable
  face with a triangular shape, thick arched eyebrows, deep-set and widely
  spaced eyes, a broad nasal root and tip with anteverted nostrils, a pointed
  chin, and hypertrichosis. Birth weight is usually in the upper normal range.
  Prenatally detected cases have shown septal defects, hydrops and a thickened
  nuchal fold. TMEM94, renamed ERMA, encodes an endoplasmic reticulum P-type
  ATPase that pumps Mg2+ from the cytosol into the ER lumen; patient variants
  abolish this activity when expressed in cells, and Tmem94 knockout mice die
  as embryos with cardiac, craniofacial and neuronal migration defects.
  Whether the loss of ER Mg2+ uptake causes the developmental defects has not
  been tested directly.
disease_term:
  preferred_term: intellectual developmental disorder with cardiac defects and dysmorphic facies
  term:
    id: MONDO:0032672
    label: intellectual developmental disorder with cardiac defects and dysmorphic facies
parents:
- Mendelian Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 618316 and Orphanet 562569. The
  entry is named with the Orphanet label, which MONDO carries as an exact
  synonym, because the OMIM title describes a combination of features that
  other genetic causes also produce. The founding cohort report
  (PMID:30526868) has no open full text, so per-feature frequencies are not
  recorded except for congenital heart defects (all but one of ten
  individuals). ClinGen counts 12 probands from 7 publications; several of
  these are diagnostic exome cohorts that list the TMEM94 findings only in
  supplementary tables, so they are not quoted here. Palmgren, Morth and
  Nissen (PMID:38879951) argued that TMEM94 should not be called a P-type
  ATPase; PubMed has no abstract for that letter, so it is not quoted. The
  later cryo-electron microscopy study (PMID:42384784) reports a P-type ATPase
  fold for human and mouse ERMA. No GeneReviews chapter covers this disease.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals carry biallelic TMEM94 loss-of-function variants,
    homozygous in most, often from consanguineous families; parents are
    heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

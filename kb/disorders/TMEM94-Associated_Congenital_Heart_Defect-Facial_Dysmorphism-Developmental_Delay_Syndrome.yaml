    snippet: "Trio-ES detected a novel homozygous splice site mutation in the fetus (TMEM94: NM_014738.6: exon21: c.2729-2A>G) which was present in its heterozygous state in both parents"
    explanation: A homozygous affected fetus with two heterozygous carrier parents.

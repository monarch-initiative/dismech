diagnosis:
- name: Lymphocyte immunophenotyping with surface TCR/CD3 quantitation
  description: >-
    Flow cytometry of peripheral blood measuring absolute T-cell counts together
    with surface TCRalphabeta and CD3 density. The characteristic result is
    normal or near-normal T-cell numbers with reduced receptor expression, which
    is what distinguishes this disorder from the CD3delta, CD3epsilon and
    CD3zeta deficiencies.
  results: >-
    Normal absolute T-cell number with reduced surface TCRalphabeta/CD3
    expression; often reduced naive and regulatory T-cell proportions.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      that assessment of abTCR and CD3 z surface expression may represent a useful diagnostic marker in patients with suspected CD3g
    explanation: >-
      Proposes exactly this measurement as the diagnostic marker.
- name: CD3G sequencing
  description: >-
    Molecular confirmation by gene panel, exome or genome sequencing. Because
    the phenotype ranges from a CVID-like adult presentation to infantile
    SCID-like disease, the gene is reached by different panels in different
    patients.
  results: Biallelic loss-of-function CD3G variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-genome sequencing was used to identify pathogenic CD3G variants, and protein expression was assessed by Western blot analysis.
    explanation: >-
      Documents the sequencing route to diagnosis.
differential_diagnoses:
- name: CD3delta, CD3epsilon and CD3zeta deficiencies
  description: >-
    The other CD3 chain defects. They share the biochemical lesion - an
    incomplete TCR/CD3 complex - but block thymocyte development and present as
    T-B+NK+ severe combined immunodeficiency in infancy rather than as a
    variable combined immunodeficiency with autoimmunity.
  disease_term:
    preferred_term: severe combined immunodeficiency
    term:
      id: MONDO:0015974
      label: severe combined immunodeficiency
  distinguishing_features:
  - Complete block in T-cell development rather than preserved T-cell numbers
  - Early-onset life-threatening infection rather than immune dysregulation
  - Surface CD3 essentially absent rather than reduced
  evidence:
  - reference: PMID:16264327
    reference_title: CD3 deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in CD3D and CD3E genes lead to a complete block in T-cell development and thus to an early-onset severe combined immunodeficiency phenotype. Thymic studies have shown that the defect in T-cell development occurs at the transition between 'double-negative' and 'double-positive' thymocytes. These results contrast with the partial T-cell immunodeficiency caused by a deficiency in CD3G.
    explanation: >-
      States the developmental block that separates the other CD3 deficiencies
      from CD3gamma deficiency.
- name: Common variable immunodeficiency
  description: >-
    The label two adult CD3gamma-deficient patients carried before genetic
    diagnosis. Hypogammaglobulinaemia with reduced switched memory B cells and
    autoimmune cytopenias is compatible with both; reduced surface TCR/CD3 with
    impaired mitogen responses is not typical of common variable
    immunodeficiency and points to the T-cell lesion.
  disease_term:
    preferred_term: common variable immunodeficiency
    term:
      id: MONDO:0015517
      label: common variable immunodeficiency
  distinguishing_features:
  - Reduced surface TCRalphabeta and CD3 expression
  - Impaired proliferative response to mitogens
  - Biallelic CD3G variants on sequencing
  evidence:
  - reference: PMID:31921117
    reference_title: "A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient had the common variable immunodeficiency (CVID) phenotype and received regular immunoglobulin infusions over 20-years; he gradually developed nodular regenerative hyperplasia over a 5-year period.
    explanation: >-
      A CD3gamma-deficient adult managed for two decades as common variable
      immunodeficiency.
animal_models:
- name: Cd3g-deficient mouse
  species: Mouse
  genotype: Cd3g null (selective loss of CD3gamma expression)
  publication: PMID:9524111
  description: >-
    Mice engineered to lack CD3gamma while retaining CD3delta, CD3epsilon,
    CD3zeta, pTalpha and TCRbeta. They were made to test the role of CD3gamma in
    the pre-TCR, and they answer that question, but they do not reproduce the
    human disease: thymic cellularity falls below one per cent of normal and
    peripheral T cells to two to five per cent, which is a severe combined
    immunodeficiency rather than the preserved-T-cell disorder seen in patients.
  modeled_mechanisms:
  - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse does reproduce the receptor-expression defect: surface TCR and
      CD3epsilon are severely reduced on thymocytes and peripheral T cells.
    limitations: >-
      The reduction is more severe than in patients, and it occurs in a thymus
      that is nearly empty, so the mouse cannot be used to study the mature
      T-cell receptor deficit that defines the human disorder.
    readouts:
    - name: Surface TCR and CD3epsilon expression on thymocytes and peripheral T cells
      target: Impaired TCR/CD3 Complex Assembly and Surface Expression
      direction: DECREASED
      interpretation: >-
        The receptor-expression component of the human lesion is present in the
        mouse.
      evidence:
      - reference: PMID:9524111
        reference_title: The CD3gamma chain is essential for development of both the TCRalphabeta and TCRgammadelta lineages.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, absence of CD3gamma results in a severe reduction in the level of TCR and CD3epsilon expression at the cell surface of thymocytes and peripheral T cells.
        explanation: >-
          Direct measurement of the surface receptor deficit in the model.
    evidence:
    - reference: PMID:9524111
      reference_title: The CD3gamma chain is essential for development of both the TCRalphabeta and TCRgammadelta lineages.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We generated mice selectively lacking expression of CD3gamma, in which expression of CD3delta, CD3epsilon, CD3zeta, pTalpha and TCRbeta remained undisturbed.
      explanation: >-
        Establishes that the model isolates loss of CD3gamma, the same lesion as
        in patients.
  - target: Distorted Thymic Selection and Self-Reactive Repertoire
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      In patients, weakened TCR signalling lets self-reactive thymocytes through
      selection and yields a polyclonal but skewed peripheral repertoire. The
      mouse has no such repertoire to skew: development arrests at the
      CD44-CD25+ double-negative stage and both the alpha-beta and gamma-delta
      lineages fail.
    limitations: >-
      Thymocyte number falls to under one per cent of normal and peripheral
      T cells to two to five per cent, so the mouse models a developmental block
      that human patients do not have. The species difference has a known
      structural basis: the human gamma-delta TCR incorporates CD3delta and the
      mouse one does not, so CD3delta can substitute for missing CD3gamma in
      patients but not in mice. Nothing about the human autoimmune phenotype -
      the dominant clinical problem - can be studied in this model.
    evidence:
    - reference: PMID:9524111
      reference_title: The CD3gamma chain is essential for development of both the TCRalphabeta and TCRgammadelta lineages.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The number of cells in the thymus is reduced to <1% of that in normal mice, and the large majority of thymocytes lack CD4 and CD8 and are arrested at the CD44-CD25+ double negative (DN) stage of development.
      explanation: >-
        Documents the developmental arrest that human patients do not have.
    - reference: PMID:33215322
      reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined Immunodeficiency with Autoimmunity Rather than SCID.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similarly, Cd3g−/− mice show complete loss of T cell development and SCID [7].
      explanation: >-
        States the mouse phenotype that is contrasted with the human one.
    - reference: PMID:17923503
      reference_title: Different composition of the human and the mouse gammadelta T cell receptor explains different phenotypes of CD3gamma and CD3delta immunodeficiencies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A human, but not a mouse, CD3delta transgene rescues gammadelta T cell development in mice lacking both mouse CD3delta and CD3gamma chains.
      explanation: >-
        The transgenic rescue experiment that identifies the species difference
        responsible for the discordant phenotypes.
  evidence:
  - reference: PMID:17923503
    reference_title: Different composition of the human and the mouse gammadelta T cell receptor explains different phenotypes of CD3gamma and CD3delta immunodeficiencies.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      gammadelta T cells do not develop in CD3gamma-deficient mice, whereas human patients lacking CD3gamma have abundant peripheral blood gammadelta T cells expressing high gammadelta TCR levels.
    explanation: >-
      States the discordance that limits how far this model informs the human
      disorder.
experimental_models:
- name: CD3G-knockdown human Jurkat T cells and the CD3gamma-negative JGN line
  description: >-
    Human T-cell lines in which CD3gamma is absent or knocked down: the JGN
    variant of Jurkat, which lacks CD3gamma and has no surface TCR, and
    stable short-hairpin knockdowns of CD3G in Jurkat E6-1. They are the systems
    in which the assembly and signalling roles of individual CD3gamma domains
    have been dissected, using domain-swap chimeras with CD3delta.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Immortalized human T-cell leukaemia lines (Jurkat E6-1, JGN)
  culture_system: Two-dimensional suspension culture with lentiviral shRNA knockdown or retroviral domain-swap reconstitution
  publication: PMID:34249896
  modeled_mechanisms:
  - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Removing CD3gamma from a human T-cell line reproduces the assembly defect:
      complexes are retained in the endoplasmic reticulum, lack the zeta-zeta
      dimer, and barely reach the surface. Domain-swap reconstitution localises
      the requirement to the CD3gamma extracellular domain, which the
      corresponding CD3delta domain cannot replace.
    limitations: >-
      The quantitative severity does not match the patients. Surface receptor in
      the knockdown lines falls below 11% of control, whereas mature T cells from
      CD3gamma-deficient patients express more than 30%. The authors attribute
      this to plasticity available to developing thymocytes that a mature
      transformed line does not have, so the line overstates the severity of the
      human lesion.
    readouts:
    - name: Surface TCR expression in CD3G-knockdown Jurkat cells
      target: Impaired TCR/CD3 Complex Assembly and Surface Expression
      direction: DECREASED
      interpretation: >-
        Confirms that CD3gamma loss impairs receptor export in a purely human
        system, while showing the magnitude is model-dependent.
      evidence:
      - reference: PMID:34249896
        reference_title: "CD3G or CD3D Knockdown in Mature, but Not Immature, T Lymphocytes Similarly Cripples the Human TCRαβ Complex."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, both defective TCR ensembles were strongly retained in the ER, lacked ζζ/CD2472, and barely reached the T-cell surface (<11% of normal controls) in any of the CD3 KD cells.
        explanation: >-
          The measurement of residual surface receptor in the knockdown lines.
    evidence:
    - reference: PMID:34249896
      reference_title: "CD3G or CD3D Knockdown in Mature, but Not Immature, T Lymphocytes Similarly Cripples the Human TCRαβ Complex."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        This is in sharp contrast to human CD3γ ID, whose mature T cells express higher levels of surface TCR (>30% vs. normal controls).
      explanation: >-
        The authors' own statement of the gap between the line and the patients,
        which is why this link is partial rather than full recapitulation.
  - target: Attenuated T-Cell Receptor Signaling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reconstituting the CD3gamma-negative JGN line with chimeric CD3gamma/CD3delta
      constructs measures which signalling outputs require which CD3gamma domain.
    limitations: >-
      A transformed leukaemia line with a transfected receptor; the readouts are
      cytokine and activation-marker induction rather than the in vivo T-cell
      responses that matter clinically.
    readouts:
    - name: TCR-induced IL-2, TNF-alpha and CD69 induction
      target: Attenuated T-Cell Receptor Signaling
      direction: DECREASED
      interpretation: >-
        Locates the signalling contribution of CD3gamma to its intracellular
        domain.
      evidence:
      - reference: PMID:36119034
        reference_title: The role of the different CD3γ domains in TCR expression and signaling.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, an IC domain at CD3γ was required for TCR-induced IL-2 and TNF-α production and CD69 expression, indicating that a TCR without a CD3γ IC domain has altered signalling capabilities.
        explanation: >-
          The measured signalling deficits attributable to the CD3gamma
          intracellular domain.
    evidence:
    - reference: PMID:36119034
      reference_title: The role of the different CD3γ domains in TCR expression and signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Expression of γγγ, γγδ, γδδ or γγ- in the γ- T cell line JGN, which lacks surface TCR, demonstrated that cell surface TCR levels in JGN were dependent on the EC domain of CD3γ and could not be replaced by the one of CD3δ.
      explanation: >-
        Establishes the system and what it is able to resolve.
discussions:
- discussion_id: mismatch_cd3g_mouse_vs_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of CD3gamma cause severe combined immunodeficiency in mice but
    a comparatively mild, autoimmunity-dominated combined immunodeficiency in
    humans, and can any available model be used to study the human autoimmune
    phenotype?
  attaches_to:
  - pathophysiology#Distorted Thymic Selection and Self-Reactive Repertoire
  - pathophysiology#Multisystem Autoimmunity
  rationale: >-
    The Cd3g-null mouse is not a mild model of a mild disease; it is a severe
    model of a mild disease. Thymic cellularity falls below one per cent of
    normal and both T-cell lineages fail, whereas patients keep normal T-cell
    numbers and their dominant problem is autoimmunity. Part of the difference
    has a definite structural explanation: the human gamma-delta TCR incorporates
    CD3delta while the mouse one does not, so CD3delta can substitute for the
    missing chain in patients, and a human but not a mouse CD3delta transgene
    rescues gamma-delta development in doubly deficient mice. That accounts for
    the gamma-delta compartment. It does not by itself establish that the same
    substitution explains the preserved alpha-beta compartment, and the human
    cell-line models do not close the gap either: CD3G-knockdown Jurkat cells
    express under 11% of normal surface TCR while patient T cells express over
    30%, which the authors attribute to developmental plasticity that a mature
    transformed line lacks. The practical consequence is that the feature which
    dominates the human disorder - multisystem autoimmunity arising from
    distorted thymic selection and defective regulatory T cells - currently has
    no model system in which it can be studied.
  evidence:
  - reference: PMID:17923503
    reference_title: Different composition of the human and the mouse gammadelta T cell receptor explains different phenotypes of CD3gamma and CD3delta immunodeficiencies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, our results indicate that the different gammadelta T cell phenotypes between CD3gamma-deficient humans and mice can be explained by differences in their gammadelta TCR composition.
    explanation: >-
      The structural explanation for the species difference, stated for the
      gamma-delta lineage.
  - reference: PMID:34249896
    reference_title: "CD3G or CD3D Knockdown in Mature, but Not Immature, T Lymphocytes Similarly Cripples the Human TCRαβ Complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite the high sequence homology between CD3γ and CD3δ, the clinical consequences of the corresponding immunodeficiencies (ID) in humans are very different (mild and severe, respectively), and mouse models do not recapitulate findings in human ID.
    explanation: >-
      States plainly that the mouse models do not reproduce the human findings.
- discussion_id: gap_cd3g_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a person homozygous for a null CD3G allele dies in
    infancy of infection and enteropathy or reaches late adulthood with
    hypogammaglobulinaemia and autoimmune cytopenias?
  attaches_to:
  - genetic#CD3G
  - pathophysiology#Multisystem Autoimmunity
  rationale: >-
    Patients homozygous for the same CD3G allele have had opposite outcomes,
    including within a single family, so the variant itself does not explain the
    course. Residual CD3gamma protein has been excluded as the explanation for
    the disorder's mildness generally, since at least one allele is a
    demonstrated transcript-and-protein null. Two candidate correlates have been
    proposed - the amount of residual surface TCR/CD3, and whether regulatory
    T-cell suppressive function is preserved - but each rests on a handful of
    patients assayed by different methods, and eighteen reported cases is too few
    to test either. Until it is settled there is no basis for predicting course
    at diagnosis, which is precisely the question that determines whether to
    offer transplant.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients carrying identical deleterious variants exhibited substantial variability in clinical presentation and outcomes, indicating that no obvious genotype-phenotype correlation could be established based on the currently available data.
    explanation: >-
      States the absence of a genotype-phenotype correlation and the reason.
  - reference: PMID:33215322
    reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined Immunodeficiency with Autoimmunity Rather than SCID.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these results demonstrate biallelic CD3G c.1 A > G mutation results in the complete loss of CD3G mRNA transcripts and CD3γ protein translation.
    explanation: >-
      Excludes residual protein as the explanation for the mild phenotype in at
      least one allele.

notes: >-
  Phenotype review used the complete Falcon report as navigation, with direct primary-source and whole-paper
  context taking precedence. The official NCBI Genetic Testing Registry CD3G gene page lists GeneReviews
  as not available; no CD3G-specific chapter was identified. Other CD3-chain SCID sources were not imported
  as CD3G phenotype evidence. The UCM author-hosted PDF URL and PMID:29653965 are the same Rowe study,
  not independent cohorts.


  The web-readable 2014 full text reports bone-density abnormalities, gastrointestinal Giardia, and additional
  clinical findings that could not all be quoted from the prescribed fetched abstract. Reported osteopenia
  (Z −1.4) was not upgraded to pediatric osteoporosis; the separate osteoporosis case had severe hyperthyroidism.
  Table/narrative inconsistencies affect respiratory infections, T-cell/NK counts and untested-family
  autoimmunity, so no carrier penetrance or universal mitogen deficit is inferred. Giardia is retained
  as an infection observation rather than forced into HPO terms requiring recurrent, persistent or severe
  infection not established by the available quotation.


  Evidence grades follow each claim: direct patient observations are HUMAN_CLINICAL, cultured/engineered
  functional experiments are IN_VITRO, mouse perturbations MODEL_ORGANISM, and mechanistic interpretations
  or diagnostic proposals OTHER. Literal quotations retain fetched extraction artifacts. Clinical immune-deficiency
  findings and experimental assay readouts are distinct; reports_on records observed readouts without
  identity-like causal arrows.


  The disease remains a gene-specific combined immunodeficiency within the existing IUIS classification.
  No additional grouping or conserved mechanism module is introduced: the reviewed changes concern variable
  CD3G-dependent receptor/tolerance behavior and case-specific complications, not a newly established
  shared disease union or reusable pathway implementation. The candidate germinal-center-reaction module
  was considered, but the proposed CD40L/memory-B relation does not establish the full reaction defect;
  the cDC1 tolerogenic module requires a distinct EPOR/DC pathway not demonstrated here. The general erythrocyte-destruction
  module does not match the current broad tolerance node, which retains a qualified organ-specific AIHA
  route without asserting a measured clearance pathway.

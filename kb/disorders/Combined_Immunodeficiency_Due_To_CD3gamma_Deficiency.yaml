      suppressive function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TRB repertoire of Tconv cells from patients with CD3G deficiency was enriched for hydrophobic
      amino acids at positions 6 and 7 of the CDR3, a biomarker of self-reactivity.
    explanation: >-
      Peripheral repertoire sequencing found enrichment of hydrophobic CDR3 residues associated with self-reactivity;
      this surrogate does not directly demonstrate clone-specific autoantigen recognition or thymic negative-selection
      failure.

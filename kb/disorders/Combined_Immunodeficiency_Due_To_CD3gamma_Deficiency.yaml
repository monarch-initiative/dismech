    snippet: >-
      CD3γ deficiency is an ultrarare autosomal recessive inborn error of immunity characterized by immune dysregulation and variable immunodeficiency.
    explanation: >-
      States the autosomal recessive mode of inheritance and the defining
      combination of immune dysregulation with variable immunodeficiency.
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT

name: Combined immunodeficiency due to CD3gamma deficiency
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
synonyms:
- CD3gamma deficiency
- CD3-gamma deficiency
- CD3 deficiency
- immunodeficiency 17
- immunodeficiency type 17
- IMD17
- immunodeficiency 17, CD3 gamma deficient
- SCID-like immunodeficiency, T cell-partial, B cell-positive, NK cell-positive
description: >-
  Combined immunodeficiency due to CD3gamma deficiency is an ultra-rare
  autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in CD3G, the gene encoding the CD3gamma invariant
  chain of the T-cell receptor (TCR)/CD3 complex. Loss of CD3gamma impairs
  assembly and surface expression of the TCR/CD3 complex, so mature T cells
  carry fewer receptors and signal less strongly through them.

  The disorder is defined as much by what it is not as by what it is. Deficiency
  of the other CD3 chains - CD3delta, CD3epsilon and CD3zeta - blocks thymocyte
  development and produces T-B+NK+ severe combined immunodeficiency. CD3gamma
  deficiency does not: patients typically have normal absolute T-cell numbers
  with reduced surface TCR/CD3, and the dominant clinical problem is often
  immune dysregulation rather than infection. Reported patients span a
  remarkable range, from failure to thrive with intractable diarrhoea and early
  death in infancy to an adult first recognised in middle age because of
  hypogammaglobulinaemia and autoimmune cytopenias. Individuals carrying the
  same homozygous variant have had markedly different courses, so no
  genotype-phenotype rule has been established.

  Autoimmunity is the most consistent thread: autoimmune thyroiditis, autoimmune
  haemolytic anaemia and immune thrombocytopenia together account for most
  reported manifestations. The mechanistic account offered for this is that
  weakened TCR signalling distorts thymic selection and leaves a regulatory
  T-cell compartment that is reduced in number, restricted in repertoire
  diversity and impaired in suppressive function, alongside a conventional
  T-cell repertoire enriched for self-reactive specificities.

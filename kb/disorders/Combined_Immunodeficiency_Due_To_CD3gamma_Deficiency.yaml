biochemical:
- name: Serum IgG
  context: >-
    Low IgG is variable: the detailed child had IgG 338 mg/dL and impaired vaccine responses, and the
    Taiwanese adult had profound deficiency before replacement. The 9/18 aggregate combines hypo- and
    dysgammaglobulinemia and is not an IgG-specific frequency.
  biomarker_term:
    preferred_term: IgG
    term:
      id: NCIT:C568
      label: IgG
  presence: Decreased
  notes: >-
    Reference intervals and treatment state differ across reports. Subsequent normal IgG values in the
    Taiwanese patient were measured during regular replacement; glucocorticoids and nephrotic protein
    loss can further confound serum values. No pooled reference interval is inferred.
  evidence:
  - reference: PMID:33215322
    reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined
      Immunodeficiency with Autoimmunity Rather than SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Reduced numbers of switched and unswitched memory B cells, hypogammaglobulinemia (IgG 338 mg/dL), and impaired vaccination response to Haemophilus influenzae type B and Pneumococcus were also present (Table 1).
    explanation: >-
      The child had several directly documented humoral defects before replacement therapy.
- name: CD4+ T-lymphocyte count
  context: >-
    Absolute CD4 counts can be low despite preserved total T-cell counts; other patients have normal counts.
    The 2021 report calls 627 cells/μl lymphopenic, whereas the earlier cohort table used a different
    reference interval. Age, laboratory ranges and receptor-dependent gating require attention.
  biomarker_term:
    preferred_term: Absolute Helper T Lymphocyte Count
    term:
      id: NCIT:C201183
      label: Absolute Helper T Lymphocyte Count
  presence: Decreased
  evidence:
  - reference: PMID:33215322
    reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined
      Immunodeficiency with Autoimmunity Rather than SCID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunological evaluations revealed a combined immunodeficiency with normal absolute CD3+ T cell
      numbers, CD4+ T cell lymphopenia (627 cells/μl) with a reduced proportion of naïve T cells and T
      regulatory cells, increased frequency of memory CD4+, CD8+ cells, and CD45RA+CCR7− CD8+ T cells
      (TEMRA).
    explanation: >-
      This report labels the child's measured CD4 count as low; it does not establish universal lymphopenia
      or universal normal total T-cell numbers.
genetic:
- name: CD3G
  association: Causal biallelic variant
  gene_term:
    preferred_term: CD3G
    term:
      id: hgnc:1675
      label: CD3G
  notes: >-
    Reported variants include c.80-1G>C, initiation-codon and truncating changes. The original Spanish
    siblings were compound heterozygotes involving c.1A>G and a splice-site variant; a different child
    was homozygous for c.1A>G. Identical homozygous variants can produce markedly different courses, and
    protein-null status has not been measured for every allele.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization
      of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients carrying identical deleterious variants exhibited substantial variability in clinical
      presentation and outcomes, indicating that no obvious genotype-phenotype correlation could be established
      based on the currently available data.
    explanation: >-
      States the absence of a genotype-phenotype correlation.
  - reference: PMID:24910257
    reference_title: CD3G gene defects in familial autoimmune thyroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three new CD3gamma-deficient siblings from a consanguineous family with a combined T-B+NK+
      immunodeficiency and their variable clinical and cellular phenotypes despite the same homozygous
      mutation of the CD3G gene (c.80-1G>C).
    explanation: >-
      Documents variable phenotype within a single family sharing one homozygous
      allele.

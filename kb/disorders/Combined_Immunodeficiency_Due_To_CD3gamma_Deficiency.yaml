experimental_models:
- name: CD3G-knockdown human Jurkat T cells and the CD3gamma-negative JGN line
  description: >-
    Human T-cell lines in which CD3gamma is absent or knocked down: the JGN
    variant of Jurkat, which lacks CD3gamma and has no surface TCR, and
    stable short-hairpin knockdowns of CD3G in Jurkat E6-1. They are the systems
    in which the assembly and signalling roles of individual CD3gamma domains
    have been dissected, using domain-swap chimeras with CD3delta.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Immortalized human T-cell leukaemia lines (Jurkat E6-1, JGN)
  culture_system: Two-dimensional suspension culture with lentiviral shRNA knockdown or retroviral
    domain-swap reconstitution
  publication: PMID:34249896
  modeled_mechanisms:
  - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Jurkat knockdown measures receptor assembly, ER retention and low surface export. In JGN, the CD3gamma
      extracellular domain is required for rescue, whereas patient-derived T-cell rescue differs. Domain
      requirements are therefore interpreted within each cellular system.
    limitations: >-
      Knockdown lines have less than 11% surface expression, compared with greater than 30% in congenital
      patient-derived cells. Developmental adaptation is proposed, but the immature thymic-organ-culture
      perturbation used shCD3D, not shCD3G. JGN may carry additional mutations; patient-cell limitations
      restricted biochemical/nanocluster analyses to JGN.
    readouts:
    - name: Surface TCR expression in CD3G-knockdown Jurkat cells
      target: Impaired TCR/CD3 Complex Assembly and Surface Expression
      direction: DECREASED
      interpretation: >-
        Confirms that CD3gamma loss impairs receptor export in a purely human
        system, while showing the magnitude is model-dependent.
      evidence:
      - reference: PMID:34249896
        reference_title: "CD3G or CD3D Knockdown in Mature, but Not Immature, T Lymphocytes Similarly
          Cripples the Human TCRαβ Complex."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, both defective TCR ensembles were strongly retained in the ER, lacked ζζ/CD2472, and
          barely reached the T-cell surface (<11% of normal controls) in any of the CD3 KD cells.
        explanation: >-
          The measurement of residual surface receptor in the knockdown lines.
    evidence:
    - reference: PMID:34249896
      reference_title: CD3G or CD3D Knockdown in Mature, but Not Immature, T Lymphocytes Similarly
        Cripples the Human TCRαβ Complex.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: |-
        However, both defective TCR ensembles were strongly retained in the ER, lacked ζζ/CD2472, and barely reached the T-cell surface (<11% of normal controls) in any of the CD3 KD cells.
      explanation: >-
        The assembly/export defect was measured in engineered Jurkat knockdowns; the paper separately
        documents a milder defect in patient-derived cells.
  - target: Attenuated T-Cell Receptor Signaling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Reconstituting the CD3gamma-negative JGN line with chimeric CD3gamma/CD3delta
      constructs measures which signalling outputs require which CD3gamma domain.
    limitations: >-
      JGN is a mutagenized leukemia-derived line with possible additional defects. Cytokine/nanocluster
      experiments were limited to JGN; proximal signaling and CD69 can remain intact despite impaired
      cytokine production, and these results are not clinical cytokine measurements.
    readouts:
    - name: TCR-induced IL-2 and TNF-alpha production
      target: Attenuated T-Cell Receptor Signaling
      direction: DECREASED
      interpretation: >-
        The intracellular-domain-truncated construct had reduced cytokine production, while CD69 induction
        was normal/highest. The two response classes are not a single uniformly reduced activation readout.
      evidence:
      - reference: PMID:36119034
        reference_title: The role of the different CD3γ domains in TCR expression and signaling.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: |-
          Quantification of IL-2 and TNF-α showed differences among the constructs, with γγ- inducing a very poor response compared to γγγ, γγδ or γδδ.
        explanation: >-
          The Results specifically support reduced cytokine output by the truncated construct.
      - reference: PMID:36119034
        reference_title: The role of the different CD3γ domains in TCR expression and signaling.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: |-
          In contrast to cytokine synthesis, CD69 expression and TCR internalization after TCR engagement were normal for all constructs including γγ-, which scored highest for CD69 induction, indicating that it was capable of some functional signal transduction.
        explanation: >-
          The full Results qualify the abstract: the intracellular-domain-truncated construct retained
          CD69 induction; cytokine secretion and CD69 cannot be bundled as uniformly reduced.
    evidence:
    - reference: PMID:36119034
      reference_title: The role of the different CD3γ domains in TCR expression and signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: |-
        In contrast to cytokine synthesis, CD69 expression and TCR internalization after TCR engagement were normal for all constructs including γγ-, which scored highest for CD69 induction, indicating that it was capable of some functional signal transduction.
      explanation: >-
        The full Results qualify the abstract: the intracellular-domain-truncated construct retained CD69
        induction; cytokine secretion and CD69 cannot be bundled as uniformly reduced.
discussions:
- discussion_id: mismatch_cd3g_mouse_vs_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which developmental and receptor-composition differences explain retained human T cells, and how faithfully
    do these systems reproduce human tolerance defects?
  attaches_to:
  - pathophysiology#Distorted Thymic Selection and Self-Reactive Repertoire
  - pathophysiology#Impaired TCR/CD3 Complex Assembly and Surface Expression
  rationale: >-
    Cd3g-null mice retain only 2–5% of normal peripheral T cells. Human CD3delta rescues gamma-delta development
    in double-deficient mice, but this does not reconstruct the human alpha-beta/Treg pathway. Mature
    Jurkat knockdown and congenital patient-derived cells also differ; the immature-organ-culture perturbation
    in the 2021 study was CD3D. None of these observations proves that autoimmunity is absent from every
    model or that no model can study it.
  evidence:
  - reference: PMID:9524111
    reference_title: The CD3gamma chain is essential for development of both the TCRalphabeta and
      TCRgammadelta lineages.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: |-
      Peripheral lymphoid organs are also practically devoid of T cells, with absolute numbers of peripheral T cells reduced to only 2-5% of those in normal mice.
    explanation: >-
      The model retains a small peripheral population; the result must not be described as complete absence.
  - reference: PMID:17923503
    reference_title: Different composition of the human and the mouse gammadelta T cell receptor
      explains different phenotypes of CD3gamma and CD3delta immunodeficiencies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: |-
      A human, but not a mouse, CD3delta transgene rescues gammadelta T cell development in mice lacking both mouse CD3delta and CD3gamma chains.
    explanation: >-
      The perturbation demonstrates lineage-specific structural compensation in a mouse model; it does
      not by itself resolve human alpha-beta/Treg biology.
- discussion_id: gap_cd3g_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which modifiers account for different clinical courses among relatives sharing a CD3G variant?
  attaches_to:
  - genetic#CD3G
  - pathophysiology#Multisystem Autoimmunity
  rationale: >-
    Identical variants accompany divergent infection and autoimmune outcomes. Demonstrated protein loss
    for particular alleles shows that residual CD3gamma is not required for all retained human T-cell
    development; it does not exclude allele-specific effects across the whole spectrum. Preserved Taiwanese
    Treg function and variable age/stimulus-dependent proliferation are correlates, not validated prognostic
    rules.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization
      of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients carrying identical deleterious variants exhibited substantial variability in clinical
      presentation and outcomes, indicating that no obvious genotype-phenotype correlation could be established
      based on the currently available data.
    explanation: >-
      States the absence of a genotype-phenotype correlation.
  - reference: PMID:31921117
    reference_title: A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function
      Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and
      Phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: |-
      Treg cells isolated from the CD3 γ Del 213A T cells of the patient
      were able to suﬃciently suppress the proliferation of Teﬀ cells
      upon stimulation
    explanation: >-
      The Taiwanese adult retained suppression in the reported coculture conditions, qualifying universal
      Treg-dysfunction claims.
- discussion_id: interpretation_cd3g_cohorts
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should overlapping case counts and contradictions between primary reports and later summary tables
    be interpreted?
  attaches_to:
  - phenotypes#Autoimmune thyroiditis
  - phenotypes#Decreased circulating immunoglobulin concentration
  - phenotypes#Impaired PHA-induced T-cell proliferation
  rationale: >-
    The 2026 18-patient aggregation overlaps the 2014 families, 2018 mechanistic cohort and detailed later
    case reports. It is not an independent prevalence sample. Its 9/18 antibody category combines hypo-
    and dysgammaglobulinemia, and its 11/11 mitogen category is not PHA-specific. The detailed 2021 child
    had homozygous c.1A>G and died after transplantation; the later table assigns a different variant/alive
    status to that report. Normal Taiwanese IgG measurements were during replacement. The earlier 2007
    sibling VI3 was presumed affected rather than molecularly tested. Frequencies therefore retain reported-series
    scope and detailed primary narratives take precedence for patient facts.
  evidence:
  - reference: PMID:31921117
    reference_title: A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function
      Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and
      Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      this was compatible with hypogammaglobulinemia, but normal PHA-lymphocyte proliferation.
    explanation: >-
      The Taiwanese patient is an explicitly scoped exception to universal PHA impairment, not a disease-level
      absence annotation.
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization
      of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 16 predominantly pediatric cases have been reported. Here, we describe two additional
      adult patients with CD3γ deficiency and provide a comprehensive reevaluation of all previously published
      cases.
    explanation: >-
      The authors give the literature count and two new cases; this provides no population denominator.

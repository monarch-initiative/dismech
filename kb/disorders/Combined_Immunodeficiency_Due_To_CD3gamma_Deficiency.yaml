      that assessment of abTCR and CD3 z surface expression may represent a useful diagnostic marker in
      patients with suspected CD3g
    explanation: >-
      The authors propose surface expression as a diagnostic marker; this is interpretive guidance, not
      a validated sensitivity/specificity estimate.
- name: CD3G sequencing
  description: >-
    Molecular confirmation by gene panel, exome or genome sequencing. Because
    the phenotype ranges from a CVID-like adult presentation to infantile
    SCID-like disease, the gene is reached by different panels in different
    patients.
  results: Biallelic loss-of-function CD3G variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

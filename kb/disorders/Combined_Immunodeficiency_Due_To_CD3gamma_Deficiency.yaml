  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CD3G variants. Almost all reported patients are homozygous, and
    parental consanguinity is common; two siblings from one non-consanguineous
    Spanish family were compound heterozygous.
  evidence:

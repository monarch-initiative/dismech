notes: >-
  Evidence-source convention used throughout this entry: measurements made
  directly on patient samples (flow cytometry, repertoire sequencing, clinical
  course) are graded HUMAN_CLINICAL; measurements requiring culture, expansion
  or an engineered line (phytohaemagglutinin-driven T-cell blasts, regulatory
  T-cell suppression co-cultures, Jurkat and JGN cell lines) are graded
  IN_VITRO; mouse data are graded MODEL_ORGANISM.

  Snippets taken from the 2026 Frontiers in Immunology review are quoted from
  the cached text of that article. Where the cached PDF extraction renders Greek
  letters as Latin characters, for example "CD3 g" for CD3gamma and "abTCR" for
  alpha-beta TCR, the snippet reproduces the cached text verbatim as exact-quote
  validation requires; entry prose uses the spelled-out Greek names.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists. A 2026 review that reassessed the whole
    literature counted 18 genetically confirmed patients, 16 previously reported
    plus the two adults it described.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 16 predominantly pediatric cases have been reported. Here, we describe two additional adult patients with CD3γ deficiency and provide a comprehensive reevaluation of all previously published cases.
    explanation: >-
      The published case count, standing in for a population prevalence estimate
      that has never been made.
pathophysiology:
- name: Biallelic CD3G Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Splice-site, nonsense, frameshift and initiation-codon variants in CD3G on
    both alleles. The reported alleles are predicted or shown to abolish protein
    production rather than to produce a partially functional chain: the
    c.1A>G initiation-codon change eliminates the transcript as well as the
    protein, and a homozygous frameshift in the oldest reported patient
    abolishes CD3gamma expression on Western blot. The mildness of the disorder
    relative to the other CD3 chain deficiencies is therefore not explained by
    residual CD3gamma protein.
  genes:
  - preferred_term: CD3G
    term:
      id: hgnc:1675
      label: CD3G
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants included splice-site, nonsense, and frameshift mutations predicted to result in loss of function
    explanation: >-
      Describes the class of CD3G alleles reported across the literature.
  - reference: PMID:33215322
    reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined Immunodeficiency with Autoimmunity Rather than SCID.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these results demonstrate biallelic CD3G c.1 A > G mutation results in the complete loss of CD3G mRNA transcripts and CD3γ protein translation.
    explanation: >-
      Establishes, in patient-derived T-cell blasts, that a reported allele is a
      true null rather than a hypomorph.
  downstream:
  - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
    description: >-
      Absence of the CD3gamma chain removes one of the invariant CD3 dimers
      required to assemble and export the receptor.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42661620
      reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One patient, currently the oldest reported individual with CD3γ deficiency, harbored a novel homozygous frameshift variant in CD3G (c.213dupA, p.(Trp72Metfs*6)) resulting in complete loss of CD3γ expression.
      explanation: >-
        Links a biallelic CD3G variant directly to loss of the CD3gamma chain
        that the complex needs.
- name: Impaired TCR/CD3 Complex Assembly and Surface Expression
  biological_scale: MOLECULAR
  description: >-
    The alpha-beta TCR reaches the cell surface as an octamer of TCRalphabeta
    with the CD3gamma-epsilon, CD3delta-epsilon and zeta-zeta dimers, assembled
    in the endoplasmic reticulum. Without CD3gamma, assembly is inefficient and
    surface receptor density falls. It does not fall to zero: in patients CD3delta
    can substitute for CD3gamma in the complex, and the residual receptor is
    enough to support T-cell development. Reduced surface TCR/CD3 with preserved
    absolute T-cell numbers is the characteristic laboratory signature of the
    disorder and the feature that separates it from the other CD3 chain defects.
  protein_complexes:
  - preferred_term: alpha-beta T cell receptor complex
    modifier: DECREASED
    term:
      id: GO:0042105
      label: alpha-beta T cell receptor complex
  cell_types:
  - preferred_term: mature alpha-beta T cell
    term:
      id: CL:0000791
      label: mature alpha-beta T cell
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is reduced surface expression of the TCR/CD3 complex despite preserved absolute T cell numbers. In contrast, patients with other forms of CID may retain normal abTCR and CD3z expression.
    explanation: >-
      States the defining laboratory finding of reduced surface receptor with
      normal T-cell counts.
  - reference: PMID:36119034
    reference_title: The role of the different CD3γ domains in TCR expression and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Since protein homology explains these results better than domain structure, we conclude that CD3γ contributes conformational cues that improve surface TCR expression, likely at the assembly or membrane transport steps.
    explanation: >-
      Domain-swap experiments in a CD3gamma-negative human T-cell line locate
      the defect at receptor assembly or transport.
  downstream:
  - target: Attenuated T-Cell Receptor Signaling
    description: >-
      Fewer receptors on the surface, and receptors lacking the CD3gamma
      cytoplasmic tail, transmit a weaker signal on engagement.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33215322
      reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined Immunodeficiency with Autoimmunity Rather than SCID.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        recent data from our group suggest a model where human CD3γ deficiency alters but does not abrogate surface expression of CD3 and TCR molecules, reducing TCR signaling strength and thereby affecting T cell development, thymus selection, and fate [8].
      explanation: >-
        States the proposed causal chain from altered surface expression to
        reduced signalling strength.
- name: Attenuated T-Cell Receptor Signaling
  biological_scale: CELLULAR
  description: >-
    Signalling through the residual receptor is reduced rather than abolished.
    Proximal responses such as tyrosine phosphorylation are largely preserved in
    CD3gamma-deficient T cells, but responses requiring the CD3gamma
    cytoplasmic domain are lost, including cytokine production and CD69
    induction, and activation-induced cell death is increased. The clinically
    visible consequence is a blunted proliferative response to mitogens.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  evidence:
  - reference: PMID:36119034
    reference_title: The role of the different CD3γ domains in TCR expression and signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, an IC domain at CD3γ was required for TCR-induced IL-2 and TNF-α production and CD69 expression, indicating that a TCR without a CD3γ IC domain has altered signalling capabilities.
    explanation: >-
      Identifies the specific effector responses that fail without the CD3gamma
      intracellular domain.
  - reference: PMID:12407027
    reference_title: Contribution of CD3 gamma to TCR regulation and signaling in human mature T lymphocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that CD3 gamma contributes essential specialized signaling functions to certain mature T cell responses.
    explanation: >-
      Establishes that CD3gamma loss selectively impairs a subset of mature
      T-cell responses rather than abolishing signalling.
  downstream:
  - target: Distorted Thymic Selection and Self-Reactive Repertoire
    description: >-
      Signal strength at the TCR is the variable that thymic positive and
      negative selection reads, so reducing it changes which thymocytes survive.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33215322
      reference_title: Complete Absence of CD3γ Protein Expression Is Responsible for Combined Immunodeficiency with Autoimmunity Rather than SCID.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        recent data from our group suggest a model where human CD3γ deficiency alters but does not abrogate surface expression of CD3 and TCR molecules, reducing TCR signaling strength and thereby affecting T cell development, thymus selection, and fate [8].
      explanation: >-
        Names thymic selection as the step affected by the reduced signalling
        strength.
  - target: Impaired T-Cell Proliferative Response
    description: >-
      Mitogens act by cross-linking TCR-associated glycoproteins, so a weaker
      receptor signal translates directly into reduced proliferation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42661620
      reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        reduced proliferation is likely a direct consequence of impaired TCR/CD3-mediated signaling resulting from defective CD3 g expression
      explanation: >-
        States the causal link from defective CD3gamma expression through
        impaired receptor signalling to the reduced proliferative response.
- name: Distorted Thymic Selection and Self-Reactive Repertoire
  biological_scale: CELLULAR
  description: >-
    Thymocytes that would normally be deleted survive a weakened selection
    signal. Deep sequencing of the TCR beta repertoire in patients shows
    conventional CD4+ T cells enriched for hydrophobic residues at CDR3
    positions 6 and 7, a published biomarker of self-reactivity, and clonotypes
    bearing cysteines at the CDR3 apex. The repertoire is polyclonal but its
    diversity is reduced and it carries prominent clonal expansions.
  biological_processes:
  - preferred_term: thymic T cell selection
    modifier: DECREASED
    term:
      id: GO:0045061
      label: thymic T cell selection
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  evidence:
  - reference: PMID:29653965
    reference_title: "Patients with CD3G mutations reveal a role for human CD3γ in T(reg) diversity and suppressive function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TRB repertoire of Tconv cells from patients with CD3G deficiency was enriched for hydrophobic amino acids at positions 6 and 7 of the CDR3, a biomarker of self-reactivity.
    explanation: >-
      Direct repertoire evidence that the surviving conventional T-cell pool is
      enriched for self-reactive specificities.
  downstream:
  - target: Regulatory T-Cell Deficiency and Impaired Suppression
    description: >-
      Regulatory T-cell selection depends on the same TCR signal, and the
      regulatory compartment in patients is reduced in number and diversity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29653965
      reference_title: "Patients with CD3G mutations reveal a role for human CD3γ in T(reg) diversity and suppressive function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Integrity of the T-cell receptor/CD3 complex is crucial for positive and negative selection of T cells in the thymus and for effector and regulatory functions of peripheral T lymphocytes.
      explanation: >-
        States the dependence of both thymic selection and peripheral regulatory
        function on an intact TCR/CD3 complex.
  - target: Multisystem Autoimmunity
    description: >-
      A repertoire enriched for self-reactive specificities is one of the two
      proposed contributors to the autoimmunity that dominates this disorder.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29653965
      reference_title: "Patients with CD3G mutations reveal a role for human CD3γ in T(reg) diversity and suppressive function."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data demonstrate that the T-cell repertoire of patients with CD3G mutations is characterized by a molecular signature that may contribute to the increased rate of autoimmunity associated with this condition.
      explanation: >-
        The authors state the link as a contribution that may explain the
        autoimmunity, not as a demonstrated mechanism, which is why this edge is
        marked indirect with unknown intermediates.
- name: Regulatory T-Cell Deficiency and Impaired Suppression
  biological_scale: CELLULAR
  description: >-
    Patients have reduced regulatory T-cell proportions, and the regulatory
    cells they do have are restricted in repertoire diversity, more clonal, and
    less able to suppress proliferation of conventional T cells in vitro. This
    is not universal: one adult with a CVID-like presentation and no
    autoimmunity retained normal regulatory T-cell suppressive function, which
    is the closest thing the literature has to an explanation for why some
    patients escape autoimmunity.
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  evidence:
  - reference: PMID:29653965
    reference_title: "Patients with CD3G mutations reveal a role for human CD3γ in T(reg) diversity and suppressive function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treg cells of patients with CD3G defects had reduced diversity, increased clonality, and reduced suppressive function.
    explanation: >-
      Records the three regulatory T-cell abnormalities, the suppressive-function
      measurement being a suppression co-culture assay.
  - reference: PMID:31921117
    reference_title: "A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and Phenotypes."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      However, sufficient Treg suppression function was maintained so that he remained free of autoimmune thyroiditis (AIT), inflammatory bowel disease (IBD), and autoimmune pancytopenia.
    explanation: >-
      A counter-example in which preserved regulatory T-cell suppressive function
      accompanied absence of autoimmunity, which is why this node is not
      described as an invariant feature.
  downstream:
  - target: Multisystem Autoimmunity
    description: >-
      Failure of dominant peripheral tolerance permits the autoimmune
      manifestations that dominate the reported phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31921117
      reference_title: "A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and Phenotypes."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Our patient with the novel CD3G mutation presented with predominant B-cell deficiency overlapping with the CVID phenotype but without recognizable autoimmunity, which was consistent with his normal Treg suppression function.
      explanation: >-
        Correlative rather than experimental support for the regulatory-cell
        route to autoimmunity, which is why the edge is indirect.
- name: Impaired T-Cell Proliferative Response
  biological_scale: CELLULAR
  description: >-
    Reduced proliferation on stimulation with phytohaemagglutinin, concanavalin
    A and other mitogens. Among the reported patients in whom it was tested this
    was the one functional abnormality found without exception, which makes it
    the most reliable functional marker of the disorder even though it is not
    specific to it.
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while reduced response to mitogens was consistently reported in all 11 tested patients
    explanation: >-
      Records that impaired mitogen response was present in every patient tested.
  downstream:
  - target: Susceptibility to Recurrent and Chronic Infection
    description: >-
      Defective T-cell effector expansion is the proposed basis of the infection
      susceptibility, which in the severe patients includes opportunistic and
      chronic viral infection.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18482219
      reference_title: Hematopoietic stem cell transplantation in a CD3 gamma-deficient infant with inflammatory bowel disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient had suffered from intractable diarrhea, recurrent pulmonary infections and oral moniliasis since two months of age.
      explanation: >-
        Documents the infectious phenotype in a CD3gamma-deficient infant. The
        step from the measured proliferative defect to clinical infection is
        inferred rather than demonstrated, which is why this edge is indirect
        with unknown intermediates.
  - target: Humoral Immune Failure
    description: >-
      Impaired T-cell help limits B-cell class switching and antibody
      production, though the humoral phenotype is heterogeneous.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42661620
      reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overall, hypogammaglobulinemia or a form of dysgammaglobulinemia was reported in 9/18 patients (50%, Table 2). Defects in memory B cells and the presence of multiple autoantibodies were frequently observed.
      explanation: >-
        The humoral consequence is real but variable and its mechanism is not
        worked out, which is why this edge is indirect with unknown
        intermediates.
- name: Humoral Immune Failure
  biological_scale: ORGANISM
  description: >-
    Hypogammaglobulinaemia or dysgammaglobulinaemia in half of reported
    patients, with reduced switched and unswitched memory B cells and impaired
    responses to polysaccharide and protein vaccines. In two adults the humoral
    defect was the presenting problem and the diagnosis was initially common
    variable immunodeficiency.
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: DECREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, hypogammaglobulinemia or a form of dysgammaglobulinemia was reported in 9/18 patients (50%, Table 2). Defects in memory B cells and the presence of multiple autoantibodies were frequently observed.
    explanation: >-
      Quantifies the humoral defect across the reported cohort.
  downstream:
  - target: Susceptibility to Recurrent and Chronic Infection
    description: >-
      Antibody deficiency contributes the sinopulmonary component of the
      infection burden and is the component that immunoglobulin replacement
      addresses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31921117
      reference_title: "A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function Presenting With the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and Phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we report the case of a 36-year-old male who presented with recurrent sinopulmonary infections without opportunistic infections; this was compatible with hypogammaglobulinemia, but normal PHA-lymphocyte proliferation.
      explanation: >-
        A patient in whom the antibody deficiency, not the T-cell defect,
        produced the infection phenotype.
- name: Multisystem Autoimmunity
  biological_scale: ORGANISM
  description: >-
    The most consistent clinical theme. Autoimmune thyroiditis and autoimmune
    haemolytic anaemia are each reported in about two in five patients and
    immune thrombocytopenia in about one in five; autoimmune enteropathy,
    autoimmune hepatitis, nephrotic syndrome, vitiligo and lupus-like disease
    have each been reported. Some patients have autoimmunity with no significant
    infection history at all.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently reported autoimmune manifestations included autoimmune thyroiditis (7/18, 38.9%), AIHA (7/18, 38.9%), and ITP (4/18, 22.2%)
    explanation: >-
      Quantifies the three commonest autoimmune manifestations across all
      reported patients.
  - reference: PMID:23590417
    reference_title: "Variable presentation of primary immune deficiency: two cases with CD3 gamma deficiency presenting with only autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present two siblings from non-consanguineous family with autoimmunity including Evans syndrome, autoimmune hepatitis, nephrotic syndrome, and Hashimoto's thyroiditis and with no previous history of infections.
    explanation: >-
      Documents patients in whom autoimmunity was the entire presentation.
- name: Susceptibility to Recurrent and Chronic Infection
  biological_scale: ORGANISM
  description: >-
    Recurrent respiratory tract infection, protracted diarrhoea and failure to
    thrive in the severe infantile presentations, with opportunistic and chronic
    viral infection in the most severely affected. Patients who experienced
    opportunistic infection, life-threatening infection requiring transplant, or
    inflammatory-bowel-disease-like diarrhoea had significantly higher mortality
    than those who did not.

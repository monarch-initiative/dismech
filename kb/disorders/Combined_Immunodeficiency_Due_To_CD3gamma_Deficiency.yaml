genetic:
- name: CD3G
  association: Causal biallelic variant
  gene_term:
    preferred_term: CD3G
    term:
      id: hgnc:1675
      label: CD3G
  notes: >-
    The reported allelic spectrum is small and recurrent: the splice variant
    c.80-1G>C accounts for most Turkish alleles and the initiation-codon change
    c.1A>G for the original Spanish family. Patients homozygous for the same
    allele have had very different courses, so the variant does not predict the
    phenotype and the modifiers responsible are unknown.
  evidence:
  - reference: PMID:42661620
    reference_title: "Expanding the clinical spectrum of CD3γ deficiency: comprehensive characterization of adult-onset disease and integrated reevaluation of all reported patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients carrying identical deleterious variants exhibited substantial variability in clinical presentation and outcomes, indicating that no obvious genotype-phenotype correlation could be established based on the currently available data.
    explanation: >-
      States the absence of a genotype-phenotype correlation.
  - reference: PMID:24910257
    reference_title: CD3G gene defects in familial autoimmune thyroiditis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three new CD3gamma-deficient siblings from a consanguineous family with a combined T-B+NK+ immunodeficiency and their variable clinical and cellular phenotypes despite the same homozygous mutation of the CD3G gene (c.80-1G>C).
    explanation: >-
      Documents variable phenotype within a single family sharing one homozygous
      allele.

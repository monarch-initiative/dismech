name: Interstitial Lung Disease 2
creation_date: "2026-11-07T11:30:26Z"
category: Mendelian
description: >-
  Interstitial lung disease 2 (ILD2) is an autosomal dominant, adult-onset
  form of familial pulmonary fibrosis caused by heterozygous germline missense
  variants in SFTPA2, which encodes surfactant protein A2 (SP-A2), a collectin
  made by alveolar type II cells. The reported variants change conserved
  residues of the carbohydrate-recognition domain. The mutant protein misfolds,
  is retained in the endoplasmic reticulum and is not secreted; in cell models
  it raises endoplasmic reticulum stress and drives secretion of latent TGF-beta1,
  which in turn causes epithelial-to-mesenchymal transition and epithelial cell
  death. Patients develop idiopathic pulmonary fibrosis, usually with a usual
  interstitial pneumonia pattern, and carriers and their relatives have a high
  rate of lung adenocarcinoma. Penetrance is incomplete and expressivity
  variable. There is no gene-specific treatment; lung transplantation is used
  for end-stage disease. ClinGen classifies SFTPA2 as Definitive for autosomal
  dominant ILD2.

    explanation: Supports the TGFB1, LTBP1 and LTBP4 gene annotations.
  - reference: PMID:23223528
    reference_title: Mutant surfactant A2 proteins associated with familial pulmonary fibrosis and lung cancer induce TGF-β1 secretion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that bronchoalveolar lavage fluid from humans heterozygous
      for a missense mutation in the gene encoding surfactant protein (SP)-A2
      (SFTPA2) contains more TGF-β1 than control samples.
    explanation: Raised TGF-beta1 in carrier lavage fluid is the human correlate of the cell findings.
  downstream:
  - target: Alveolar Epithelial-to-Mesenchymal Transition
    causal_link_type: DIRECT
    description: >-
      Blocking the TGF-beta loop reverses the epithelial-to-mesenchymal
      transition caused by mutant SP-A2.
    evidence:
    - reference: PMID:23223528
      reference_title: Mutant surfactant A2 proteins associated with familial pulmonary fibrosis and lung cancer induce TGF-β1 secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Inhibition of the TGF-β autocrine positive feedback loop by a
        pan-TGF-β-neutralizing antibody, a TGF-β receptor antagonist, or LTBP
        gene silencing results in the reversal of TGF-β-mediated
        epithelial-to-mesenchymal transition and cell death.
      explanation: Reversal by TGF-beta blockade places TGF-beta signalling upstream of the transition.
  - target: Alveolar Type II Cell Apoptosis

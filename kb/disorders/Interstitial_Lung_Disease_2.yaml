notes: >-
  Entry type: a standalone gene-defined disease (OMIM 178500, MONDO:0800497)
  rather than a subtype of idiopathic pulmonary fibrosis. MONDO lists generic
  IPF names (familial idiopathic pulmonary fibrosis, cryptogenic fibrosing
  alveolitis, usual interstitial pneumonitis) as synonyms of this term because
  OMIM 178500 was the historical familial IPF entry; this entry covers only
  SFTPA2-caused disease, and those generic names are not carried as synonyms
  here. Idiopathic_Pulmonary_Fibrosis records SFTPA2 as a rare familial
  subset gene, which is consistent with this entry. The sibling disease
  caused by SFTPA1 is Interstitial_Lung_Disease_1; several cited cohorts pool
  SFTPA1 and SFTPA2 carriers or all surfactant genes, and the items that rely
  on them say so. The mechanism chain from ER retention through the unfolded
  protein response, TGF-beta1 secretion, epithelial-to-mesenchymal
  transition and epithelial cell death comes from cell models expressing the
  mutant protein, with raised lavage TGF-beta1 and normal lavage SP-A in
  carriers as the human correlates. No edge to lung adenocarcinoma is drawn
  because no cited source establishes how the variants cause cancer. The
  imaging, physiological and symptom phenotypes are recorded without an
  inbound edge because the cited sources describe them but do not attribute
  them to a mechanism. No animal model carrying an SFTPA2 disease variant was
  found, so animal_models is left empty. No GeneReviews chapter is titled for
  ILD2 or SFTPA2 (just check-genereviews, Bookshelf index snapshot
  2026-09-10).

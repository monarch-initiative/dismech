inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Heterozygous SFTPA2 missense variants segregate with pulmonary fibrosis,
    lung adenocarcinoma, or both in multigenerational families. Some carriers
    are asymptomatic, and some patients have neither a personal nor a family
    history of lung cancer or fibrosis. No SFTPA2-specific penetrance figure is
    given because the published counts pool SFTPA1 and SFTPA2 carriers.
  evidence:
  - reference: PMID:19100526
    reference_title: Genetic defects in surfactant protein A2 are associated with pulmonary fibrosis and lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have used linkage to map another disease-causing gene in a large
      family with IPF and adenocarcinoma of the lung to a 15.7 Mb region on
      chromosome 10.
    explanation: >-
      Linkage in a large kindred, which led to the identification of SFTPA2,
      establishes transmission of the disease through the family.
  - reference: PMID:32602668
    reference_title: Identification and functional characterization of a novel surfactant protein A2 mutation (p.N207Y) in a Chinese family with idiopathic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we analyzed an IPF pedigree from the central southern
      region of China. An autosomal dominant inheritance pattern was identified
      in this family.
    explanation: An independent SFTPA2 family shows autosomal dominant transmission.
  - reference: CGGV:assertion_a990f191-a08c-4429-88b4-9a9b455f37f0-2023-06-20T160000.000Z
    reference_title: "SFTPA2 / interstitial lung disease 2 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is definitive evidence supporting the relationship
      between SFTPA2 and autosomal dominant ILD.
    explanation: ClinGen curates the gene-disease pair in the autosomal dominant mode.
  - reference: PMID:32855221
    reference_title: Functional assessment and phenotypic heterogeneity of SFTPA1 and SFTPA2 mutations in interstitial lung diseases and lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 28 SFTPA1 or SFTPA2 mutation carriers, the mean age at ILD
      onset was 45 years (range 0.6-65 years) and 48% underwent lung
      transplantation (mean age 51 years). Seven carriers were asymptomatic.
    explanation: >-
      Asymptomatic carriers in a combined SFTPA1/SFTPA2 series show incomplete
      penetrance; the series does not report the figure by gene.
  - reference: PMID:36135709
    reference_title: Rare surfactant-related variants in familial and sporadic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that SFTPA2 variants may be more common in unselected
      IPF cohorts and may manifest in the absence of personal/family history of
      lung cancer or IPF.
    explanation: >-
      SFTPA2 carriers found in an unselected IPF cohort lacked lung cancer and
      often a family history, showing variable expressivity.
pathophysiology:
- name: SFTPA2 Carbohydrate-Recognition Domain Missense Variant
  description: >-
    Disease-associated SFTPA2 variants are germline heterozygous missense
    changes at invariant residues of the C-terminal carbohydrate-recognition
    domain (CRD) of SP-A2, including the founding p.Gly231Val and p.Phe198Ser
    and the later p.Asn207Tyr. They are predicted to disrupt the structure of
    the domain.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SFTPA2
    term:
      id: hgnc:10799
      label: SFTPA2
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: SP-A2 carbohydrate-recognition domain carbohydrate binding
    term:
      id: GO:0030246
      label: carbohydrate binding
  notes: >-
    The molecular function is bound without a modifier. The variants lie in
    the carbohydrate-recognition domain, but the cited studies measure
    misfolding and loss of secretion, not loss of carbohydrate binding, so no
    change in this activity is asserted.
  evidence:
  - reference: PMID:19100526
    reference_title: Genetic defects in surfactant protein A2 are associated with pulmonary fibrosis and lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both mutations involve invariant residues in the highly conserved
      carbohydrate-recognition domain of the protein and are predicted to
      disrupt protein structure.
    explanation: The two founding variants lie at invariant CRD residues.
  - reference: PMID:32602668
    reference_title: Identification and functional characterization of a novel surfactant protein A2 mutation (p.N207Y) in a Chinese family with idiopathic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel mutation (NM_001098668.4: c.619A>T; NP_001092138.1: p.N207Y) in
      surfactant protein A2 (SFTPA2,), having not been previously reported to
      be a mutation, was identified and co-separated with all affected
      individuals in the IPF family.
    explanation: A further CRD missense variant co-segregates with disease in a second family.
  downstream:
  - target: Misfolded SP-A2 Retention in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Recombinant SP-A2 carrying each tested CRD variant is retained in the
      endoplasmic reticulum and not secreted.
    evidence:
    - reference: PMID:19100526
      reference_title: Genetic defects in surfactant protein A2 are associated with pulmonary fibrosis and lung cancer.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Recombinant proteins carrying these mutations are retained in the
        endoplasmic reticulum and are not secreted.
      explanation: Expression studies show that the founding variants trap SP-A2 in the ER.
    - reference: PMID:32602668
      reference_title: Identification and functional characterization of a novel surfactant protein A2 mutation (p.N207Y) in a Chinese family with idiopathic pulmonary fibrosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional research further revealed that the novel mutation affects
        the secretion of SFTPA2 protein and induces endoplasmic reticulum
        stress as well as apoptosis in A549 cells.
      explanation: The p.Asn207Tyr variant also impairs SP-A2 secretion in A549 cells.
- name: Misfolded SP-A2 Retention in the Endoplasmic Reticulum
  description: >-
    Mutant SP-A2 is made but forms fewer dimers and trimers, is partly
    insoluble, is unstable to proteolysis, and is degraded by ER-associated
    degradation instead of being secreted. In patient lung tissue the SP-A
    staining pattern is altered. Total SP-A in bronchoalveolar lavage of
    heterozygous carriers is normal, so the disease is not attributed to a lack
    of secreted SP-A.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar type II cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  - preferred_term: ER-associated degradation of mutant SP-A2
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: INCREASED
  genes:
  - preferred_term: SFTPA2
    term:
      id: hgnc:10799
      label: SFTPA2
  evidence:
  - reference: PMID:20466729
    reference_title: Surfactant protein A2 mutations associated with pulmonary fibrosis lead to protein instability and endoplasmic reticulum stress.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that, in contrast with all other SP-A2 variants, the mutant
      proteins are not secreted into the medium with wild-type SP-A isoforms,
      form fewer intracellular dimer and trimer oligomers, are partially
      insoluble in 0.5% Nonidet P-40 lysates of transfected A549 cells, and
      demonstrate greater protein instability in chymotrypsin proteolytic
      digestions.
    explanation: >-
      In A549 and primary type II cells the mutant proteins are unstable,
      poorly oligomerized and not secreted, unlike the common SP-A2 variants.
  - reference: PMID:20466729
    reference_title: Surfactant protein A2 mutations associated with pulmonary fibrosis lead to protein instability and endoplasmic reticulum stress.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both the G231V and F198S mutant SP-A2 proteins are destroyed via the ER-association degradation pathway.
    explanation: Supports the ERAD process annotation.
  - reference: PMID:32855221
    reference_title: Functional assessment and phenotypic heterogeneity of SFTPA1 and SFTPA2 mutations in interstitial lung diseases and lung cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the 11 identified mutations, protein production was preserved but secretion was abolished.
    explanation: >-
      A diagnostic series that includes SFTPA2 alleles found secretion
      abolished with production preserved for every variant tested.
  - reference: PMID:20466729
    reference_title: Surfactant protein A2 mutations associated with pulmonary fibrosis lead to protein instability and endoplasmic reticulum stress.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human bronchoalveolar wash samples from individuals who are heterozygous
      for the G231V mutation have similar levels of total SP-A as normal family
      members, which suggests that the mechanism of disease does not involve an
      overt lack of secreted SP-A but instead involves an increase in ER stress
      of resident type II alveolar epithelial cells.
    explanation: >-
      Normal lavage SP-A in carriers argues against haploinsufficiency and for
      a toxic effect of the retained protein.
  downstream:
  - target: Alveolar Type II Cell Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: >-
      Expression of the mutant proteins activates the unfolded protein
      response.
    evidence:
    - reference: PMID:20466729
      reference_title: Surfactant protein A2 mutations associated with pulmonary fibrosis lead to protein instability and endoplasmic reticulum stress.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Expression of the mutant proteins increases the transcription of a
        BiP-reporter construct, expression of BiP protein, and production of
        an ER stress-induced XBP-1 spliced product.
      explanation: Mutant SP-A2 expression induces BiP and XBP-1 splicing, markers of ER stress.
- name: Alveolar Type II Cell Endoplasmic Reticulum Stress
  description: >-
    Retained mutant SP-A2 induces the unfolded protein response, with
    increased BiP and spliced XBP-1. This has been shown in A549 cells and
    primary type II cells expressing the mutant protein, not in patient
    tissue.

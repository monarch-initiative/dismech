  downstream:
  - target: Latent TGF-beta1 Secretion and Autocrine TGF-beta Signaling
    causal_link_type: DIRECT
    description: >-
      The unfolded protein response is required for the full TGF-beta1
      secretion induced by mutant SP-A2. The effect is specific to the mutants:
      common SP-A2 variants and other misfolded proteins that raise ER stress
      do not induce it.
    evidence:
    - reference: PMID:23223528
      reference_title: Mutant surfactant A2 proteins associated with familial pulmonary fibrosis and lung cancer induce TGF-β1 secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Activation of the unfolded protein response is necessary for maximal TGF-β1 secretion
      explanation: >-
        Silencing the unfolded protein response transducers reduced mutant
        SP-A2-driven TGF-beta1 secretion by about half.
    - reference: PMID:23223528
      reference_title: Mutant surfactant A2 proteins associated with familial pulmonary fibrosis and lung cancer induce TGF-β1 secretion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TGF-β1 secretion is not observed in lung epithelial cells expressing
        the common SP-A2 variants or other misfolded proteins capable of
        increasing cellular endoplasmic reticulum stress.
      explanation: >-
        ER stress is necessary but not sufficient; the TGF-beta1 response is
        specific to the disease mutants.
  - target: Alveolar Type II Cell Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cells expressing the p.Asn207Tyr variant show raised ER stress and
      apoptosis markers together; the authors infer that the stress causes
      the apoptosis but did not test it separately.
    evidence:
    - reference: PMID:32602668
      reference_title: Identification and functional characterization of a novel surfactant protein A2 mutation (p.N207Y) in a Chinese family with idiopathic pulmonary fibrosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        The results revealed that the expression of endoplasmic reticulum (ER)
        stress-related genes and apoptosis-related genes was both obviously
        higher in cells harboring the p.N207Y mutation (Figure 2b), suggesting
        that the mutation (p.N207Y) of SFTPA2 may induce ER stress and cell
        apoptosis.
      explanation: >-
        ER stress and apoptosis markers rise together in mutant-expressing
        cells; the causal order is the authors' inference.
- name: Latent TGF-beta1 Secretion and Autocrine TGF-beta Signaling
  description: >-
    Mutant SP-A2 raises expression of TGF-beta1 and of the latent TGF-beta
    binding proteins LTBP-1 and LTBP-4, and epithelial cells secrete latent
    TGF-beta1 that acts in an autocrine and paracrine loop. Lavage fluid from
    heterozygous carriers contained more TGF-beta1 than controls.

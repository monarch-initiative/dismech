name: Klebsiella Pneumonia
creation_date: "2026-09-25T22:18:26Z"
category: Infectious Disease
description: >-
  Klebsiella pneumonia is acute bacterial pneumonia caused by Klebsiella
  pneumoniae, an encapsulated Gram-negative ESKAPE pathogen that causes
  healthcare-associated pneumonia, bloodstream infection, and
  carbapenem-resistant invasive disease, and whose hypervirulent capsule and
  siderophore lineages can disseminate to liver and other organs.
disease_term:
  preferred_term: Klebsiella pneumonia
  term:
    id: MONDO:0030602
    label: Klebsiella pneumonia
parents:
- Bacterial Pneumonia
- Klebsiella Infectious Disease
synonyms:
- pneumonia due to Klebsiella pneumoniae
- Klebsiella caused pneumonia
- Friedlander pneumonia
infectious_agent:
- name: Klebsiella pneumoniae
  description: >-
    Encapsulated Gram-negative bacterium that can colonize mucosal reservoirs,
    cause human neonatal sepsis and hospital-acquired pneumonia, and acquire
    carbapenemase or hypervirulence plasmids that intensify invasive disease.
  infectious_agent_term:
    preferred_term: Klebsiella pneumoniae
    term:
      id: NCBITaxon:573
      label: Klebsiella pneumoniae
  evidence:
  - reference: PMID:42127138
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Klebsiella pneumoniae is the leading cause of sepsis among neonates in
      low- and middle-income countries (LMICs) in Africa and Asia, contributing
      substantially to the overall burden of antimicrobial-resistant infections
      and mortality among neonates globally.
    explanation: >-
      Establishes K. pneumoniae as a human invasive pathogen in a
      genomics-supported neonatal-sepsis cohort.
transmission:
- name: Aspiration of colonised oropharyngeal secretions
  description: >-
    Klebsiella pneumonia is usually autoinfection. The organism already
    colonising the upper airway reaches the alveoli when oropharyngeal
    secretions are aspirated, which is why impaired swallowing and a depressed
    cough reflex are the proximate risks rather than contact with a case.
  evidence:
  - reference: PMID:39536943
    reference_title: "Bacteriology of Aspiration Pneumonia: The Lung Microbiome and the Changing Microbial Etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aspiration pneumonia refers to the process of alveolar inflammation induced by the inhalation of oropharyngeal secretions into the lower respiratory tract."
    explanation: >-
      Defines the aspiration route by which colonising upper-airway flora
      reaches the lower respiratory tract.
  - reference: PMID:39536943
    reference_title: "Bacteriology of Aspiration Pneumonia: The Lung Microbiome and the Changing Microbial Etiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Accumulating evidence projects a fading contribution of anaerobic bacteria in aspiration pneumonia at the expense of Gram-negative bacilli, with Escherichia coli, Klebsiella pneumoniae, and Pseudomonas aeruginosa, becoming the predominant organisms recovered from respiratory specimens."
    explanation: >-
      Places K. pneumoniae among the predominant organisms recovered by this
      route, tying the general aspiration mechanism to this agent.
- name: Mucosal carriage as the endogenous reservoir
  description: >-
    The strain that causes disease is normally one the patient already carries.
    Klebsiella pneumoniae is carried asymptomatically in the gastrointestinal
    tract of a sizeable minority of healthy adults, and that reservoir is what
    later seeds invasive infection.
  evidence:
  - reference: PMID:34160234
    reference_title: "Measurement of Klebsiella Intestinal Colonization Density To Assess Infection Risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "patients frequently become infected with their intestinal colonizing strain."
    explanation: >-
      States the endogenous route directly: the infecting organism is the
      colonising strain the patient already carries.
  - reference: PMID:34182896
    reference_title: "Gastrointestinal carriage of Klebsiella pneumoniae in a general adult population: a cross-sectional study of risk factors and bacterial genomic diversity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "gastrointestinal carriage is an established risk factor for subsequent infections during hospitalization."
    explanation: >-
      Establishes gut carriage as the antecedent of later infection, which is
      what makes carriage the reservoir for this route.
  - reference: PMID:34182896
    reference_title: "Gastrointestinal carriage of Klebsiella pneumoniae in a general adult population: a cross-sectional study of risk factors and bacterial genomic diversity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevalence of K. pneumoniae gastrointestinal carriage was 16.3%"
    explanation: >-
      Quantifies the size of that reservoir in a population-based sample of
      community-dwelling adults.
- name: Healthcare-associated acquisition
  description: >-
    The second route is acquisition of a new strain in a healthcare setting, by
    which patients come to carry and then be infected by hospital lineages;
    ventilated patients are affected disproportionately, and genomic clustering
    shows that much neonatal Klebsiella disease is acquired this way rather than
    brought in.
  evidence:
  - reference: PMID:42127138
    reference_title: "Contribution of nosocomial transmission to Klebsiella pneumoniae neonatal sepsis in Africa and South Asia: An observational study of infection clusters inferred from pathogen genomics and temporal data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we estimate at least 879 (57.7%) infections were acquired via nosocomial transmission."
    explanation: >-
      Genomic and temporal clustering attributes the majority of K. pneumoniae
      infections in these units to in-hospital acquisition.
  - reference: PMID:42439974
    reference_title: "Epidemiology, Molecular Characteristics, Treatment Patterns, and Outcomes of Carbapenem-Resistant Enterobacterales Infections in a Tertiary Hospital in Southern Saudi Arabia: A Retrospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the infections were hospital-acquired, with ventilator-associated pneumonia (31.7%) and bloodstream infections (27.8%) being the most prevalent."
    explanation: >-
      A tertiary-hospital cohort in which most Klebsiella infections were
      hospital-acquired and the commonest syndrome was ventilator-associated
      pneumonia.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:42178970
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Among the most-concerning multidrug-resistant (MDR) pathogens are the
        ESKAPE organisms (Enterococcus faecium, Staphylococcus aureus,
        Klebsiella pneumoniae, Acinetobacter baumannii, Pseudomonas aeruginosa,
        and Enterobacter spp.)
      explanation: >-
        Frames K. pneumoniae as a clinically important bacterial infectious
        pathogen rather than a model-only inoculum.
environmental:
- name: Prior broad-spectrum antibiotic and carbapenem exposure
  description: >-
    Antibiotic selection pressure, especially prior carbapenem, quinolone,
    glycopeptide, or beta-lactam/beta-lactamase-inhibitor exposure, is the
    dominant modifiable risk context for carbapenem-resistant K. pneumoniae
    infection.
  influences_mechanisms:
  - target: Carbapenemase-Mediated Antibiotic Resistance
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Antibiotic exposure selects carbapenemase-carrying lineages in colonized
      patients and thereby predisposes to infection that resists empiric
      carbapenem therapy.
    evidence:
    - reference: PMID:31525540
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        carbapenem exposure, 3.99 (2.86-5.56); quinolone exposure, 1.75
        (1.38-2.22); glycopeptide exposure, 3.08 (1.93-4.91)
      explanation: >-
        A 30-study meta-analysis quantified prior antibiotic classes as risk
        factors for CRKP infection.
  evidence:
  - reference: PMID:31525540
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunosuppression, ICU admission, antibiotic exposure (including
      carbapenems, quinolones, glycopeptides and BL/BLIs), surgery, mechanical
      ventilation, central venous catheterisation, indwelling catheter and
      nasogastric intubation were identified as risk factors for CRKP infection
      and should to be considered in clinical practice.
    explanation: >-
      Summarizes the meta-analysis evidence that healthcare antibiotic exposure
      and device-intensive care predispose to CRKP infection.
- name: Neonatal-unit nosocomial transmission
  description: >-
    K. pneumoniae sepsis in African and South Asian neonatal units is frequently
    transmitted in nosocomial clusters, linking hospital contact networks to the
    mucosal reservoirs that seed invasive neonatal infection.
  influences_mechanisms:
  - target: Mucosal Reservoir and Sterile-Site Invasion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Transmission in neonatal units introduces resistant K. pneumoniae clones
      into vulnerable hosts, after which colonization can progress to invasive
      sepsis.
    evidence:
    - reference: PMID:42127138
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overall, we estimated that 1,035 neonatal infections (68.0%) were part
        of nosocomial transmission clusters.
      explanation: >-
        Quantifies hospital-linked neonatal infections as part of nosocomial
        clusters inferred from pathogen genomes and timing.
  evidence:
  - reference: PMID:42127138
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nosocomial transmission contributes to a substantial proportion of K.
      pneumoniae sepsis in neonatal care units in Africa and South Asia.
    explanation: >-
      The cohort conclusion supports neonatal-unit transmission as a documented
      context for invasive K. pneumoniae disease.

pathophysiology:
- name: Mucosal Reservoir and Sterile-Site Invasion
  role: trigger
  description: >-
    K. pneumoniae establishes mucosal or device-associated reservoirs in
    healthcare settings, and transmitted or selected clones can breach barriers
    into sterile compartments such as the lower respiratory tract and blood.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Capsule and Siderophore Immune Evasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Once K. pneumoniae reaches a normally sterile site, capsule and
      siderophore programs help the bacterium survive complement,
      phagocytosis, and iron limitation.
  - target: Pulmonary Klebsiella Bacterial Burden
    causal_link_type: DIRECT
    description: >-
      Invasion of the lower airway seeds an expanding pulmonary bacterial
      burden.
  evidence:
  - reference: PMID:42127138
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we estimate at least 879 (57.7%) infections were acquired via nosocomial
      transmission.
    explanation: >-
      Genomic clustering in neonatal units supports hospital transmission of
      K. pneumoniae that progresses to invasive sterile-site disease.

- name: Capsule and Siderophore Immune Evasion
  role: amplifier
  description: >-
    Hypervirulent K. pneumoniae can acquire plasmid-encoded regulators of
    mucoid phenotype and siderophore loci that increase capsule production,
    hypermucoviscosity, iron acquisition, and resistance to early innate
    clearance.
  biological_scale: CELLULAR
  downstream:
  - target: Pulmonary Klebsiella Bacterial Burden
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Capsule-mediated antiphagocytic activity lets virulent clones persist and
      replicate at infected tissue sites.
  - target: Hypervirulent Liver Abscess and Metastatic Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypervirulent plasmids carrying capsule and siderophore functions enable
      invasive clones to cause pyogenic liver abscess and metastatic spread.
    evidence:
    - reference: PMID:42021129
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genomic analysis identified a 181 kb IncHI1B/IncFIB virulence plasmid
        encoding rmpADC and the salmochelin cluster (iroBCDN), but lacking iuc
        and rmpA2.
      explanation: >-
        Identifies the virulence plasmid carried by a human hvKp liver-abscess
        isolate.
  evidence:
  - reference: PMID:42021129
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays demonstrated that plasmid curing abolished the
      hypermucoviscous phenotype, reduced capsule production
    explanation: >-
      CRISPR plasmid curing in the human isolate functionally links the plasmid
      to hypermucoviscosity and capsule abundance.
  - reference: PMID:42021129
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      completely attenuated virulence in murine models, confirming the plasmid
      as the principal driver of hypervirulence
    explanation: >-
      Mouse infection experiments showed that the cured derivative lost the
      virulence phenotype, complementing the in-vitro capsule and viscosity
      assays.

- name: Carbapenemase-Mediated Antibiotic Resistance
  role: amplifier
  description: >-
    Carbapenem-resistant K. pneumoniae bloodstream isolates frequently encode
    KPC, NDM, or OXA-48 carbapenemases, making invasive infection harder to
    eradicate and shifting therapy away from ordinary carbapenems.
  biological_scale: MOLECULAR
  downstream:
  - target: Bacteremia and Sepsis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Resistance delays or limits active antibiotic therapy and thereby
      increases the chance that bloodstream infection persists and progresses.
  evidence:
  - reference: PMID:42734011
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 88.9% (48/54) isolates were detected with KPC carbapenemase,
      followed by NDM carbapenemase at 7.4% (4/54).
    explanation: >-
      Quantifies KPC and NDM carbapenemases in a CRKP bloodstream-infection
      cohort.
  - reference: PMID:42439974
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OXA-48 was identified as the predominant carbapenemase, occurring in
      50.4% of cases, followed by combinations involving New Delhi
      metallo-beta-lactamase (NDM) and Klebsiella pneumoniae carbapenemase
      (KPC).
    explanation: >-
      Shows that OXA-48 and NDM/KPC combinations also contribute to CRE
      epidemiology in K. pneumoniae-dominated cohorts.

- name: Klebsiella FMN Riboswitch-Gated Riboflavin Supply (Investigational Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_riboswitch_targeting#Riboswitch-Gated Essential Gene Expression (Riboswitch Target)"
  description: >-
    K. pneumoniae depends on a flavin mononucleotide riboswitch to gate
    expression of its riboflavin biosynthesis genes, and that regulatory RNA is a
    candidate antibacterial target rather than a mechanism of disease. It is
    recorded here because the vulnerability is specific to this organism in a way
    that does not generalize: the FMN riboswitch aptamer is poorly conserved
    across Gram-negative genera, and K. pneumoniae sits at 90 percent identity to
    the E. coli element while Acinetobacter baumannii sits at 61 percent, which is
    why the riboswitch-ligand compound series reaches Enterobacteriaceae and not
    the other Gram-negative ESKAPE pathogens. Entirely investigational: the
    evidence is in vitro susceptibility of multidrug-resistant clinical isolates,
    no riboswitch-targeting compound has entered clinical development, and
    nothing here is a treatment option. The resistance frequency reported for this
    target in K. pneumoniae is of the same order as in E. coli, so target-site
    mutation is an expected liability rather than a remote one.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Extensive panels of MDR clinical isolates of E. coli (n=42) and K.
      pneumoniae (n=54) were assessed for their susceptibility to (-)3, also
      called Ribocil C-PA.
    explanation: >-
      Establishes that a riboswitch-targeting compound was tested against a large
      panel of multidrug-resistant K. pneumoniae clinical isolates, which is the
      basis for recording this organism's FMN riboswitch as a candidate target.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      sequence identity of aptamer relative to E. coli): K. pneumoniae (90%); E.
      cloacae (87%); P. aeruginosa (72%); A. baumannii (61%)
    explanation: >-
      Gives the aptamer conservation figures behind this node's claim that the
      vulnerability is genus-specific and that K. pneumoniae is among the
      reachable organisms.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Significant target-based resistance was observed in all of these strains
    explanation: >-
      Supports the resistance caveat in this node; the cited experiment selected
      resistant mutants in K. pneumoniae ATCC 27736 alongside two E. coli
      strains.
  downstream:
  - target: Riboswitch Target-Site Resistance in Klebsiella
    description: >-
      Because the target is the regulatory RNA itself, mutation of the aptamer or
      expression platform escapes the compound without disabling riboflavin
      synthesis.

- name: Riboswitch Target-Site Resistance in Klebsiella
  role: adaptive_escape
  conforms_to: "bacterial_riboswitch_targeting#Riboswitch Target-Site Resistance"
  description: >-
    Selection of K. pneumoniae mutants resistant to the riboswitch-ligand
    compound series yields target-based resistance at a frequency of the same
    order as in E. coli, and the resistance maps to the regulatory RNA rather
    than to a biosynthetic enzyme. This is recorded as an anticipated liability of
    the investigational target, not as a clinical resistance mechanism of this
    disease: no riboswitch-targeting compound is in use, so there is no treatment
    for an isolate to be resistant to. It is distinct from the carbapenemase
    resistance modelled elsewhere in this entry, which is a present-day clinical
    problem.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Response to Antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      this experiment was conducted in E. coli BW25113, K. pneumoniae ATCC 27736
    explanation: >-
      Establishes that the resistance-selection experiment included K.
      pneumoniae, which is what makes this node a claim about this organism
      rather than an inference from E. coli.
  - reference: PMID:32432858
    reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Significant target-based resistance was observed in all of these strains
    explanation: >-
      Reports that target-based resistance arose in every strain selected,
      K. pneumoniae among them, which is this node's claim. The reported
      frequencies at eight times the minimum inhibitory concentration are of the
      same order in K. pneumoniae as in E. coli; they are not quoted here because
      the source writes them with characters that do not survive quoting.

- name: Pulmonary Klebsiella Bacterial Burden
  role: trigger
  description: >-
    Klebsiella pneumoniae reaches the lower respiratory tract, grows as a
    bacterial burden in lung tissue, and initiates Gram-negative pneumonia.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: NLRC4-Dependent IL-1beta Production
    causal_link_type: DIRECT
    description: >-
      Intrapulmonary K. pneumoniae challenge induces NLRC4-dependent IL-1beta
      and chemokine production in the infected lung.
  evidence:
  - reference: PMID:42439974
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the infections were hospital-acquired, with
      ventilator-associated pneumonia (31.7%) and bloodstream infections
      (27.8%) being the most prevalent.
    explanation: >-
      Documents K. pneumoniae-dominated CRE infections that commonly presented
      as ventilator-associated pneumonia.

- name: NLRC4-Dependent IL-1beta Production
  role: amplifier
  description: >-
    The pulmonary response to K. pneumoniae requires the NLRC4 inflammasome for
    IL-1beta production, neutrophil chemoattractant expression, and survival
    after lung infection.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: interleukin-1 production
    term:
      id: GO:0032612
      label: interleukin-1 production
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Neutrophil-Mediated Lung Inflammation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22547706
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        NLRC4 is essential for K. pneumoniae-induced production of IL-1β,
        IL-17A, and neutrophil chemoattractants (keratinocyte cell-derived
        chemokines, MIP-2, and LPS-induced CXC chemokines) in the lungs.
      explanation: >-
        Directly connects K. pneumoniae-induced NLRC4 signaling to IL-1beta and
        neutrophil-chemoattractant production in infected lungs.
  evidence:
  - reference: PMID:22547706
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NLRC4 is essential for K. pneumoniae-induced production of IL-1β, IL-17A,
      and neutrophil chemoattractants (keratinocyte cell-derived chemokines,
      MIP-2, and LPS-induced CXC chemokines) in the lungs.
    explanation: >-
      Shows that NLRC4 controls IL-1beta and chemoattractant production after
      K. pneumoniae lung infection.

- name: Neutrophil-Mediated Lung Inflammation
  role: effector
  description: >-
    K. pneumoniae infection elicits innate phagocyte recruitment and
    neutrophil-mediated inflammatory pneumonia in lung tissue.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
  - target: Bacteremia and Sepsis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      If lung infection is not contained, viable organisms can disseminate into
      blood and drive systemic inflammatory organ dysfunction.
  evidence:
  - reference: PMID:22547706
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this article, we report that NLRC4 is important for host survival and
      bacterial clearance, as well as neutrophil-mediated inflammation in the
      lungs following Klebsiella pneumoniae infection.
    explanation: >-
      Identifies neutrophil-mediated lung inflammation as a response to
      K. pneumoniae infection in the pulmonary model.

- name: Bacteremia and Sepsis
  role: outcome
  description: >-
    Invasive K. pneumoniae infection can enter the bloodstream, where resistant
    strains and delayed active therapy are associated with septic physiology,
    coagulopathy, and high in-hospital mortality.
  biological_scale: ORGANISM
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Sepsis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42518856
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 222 patients (156 male, 70.3%; mean age 66.4 ± 13.6 years)
      were enrolled. Among them, 106 (47.7%) died during hospitalization.
    explanation: >-
      Quantifies mortality in a human K. pneumoniae bloodstream-infection
      cohort.

- name: Hypervirulent Liver Abscess and Metastatic Infection
  role: outcome
  description: >-
    Hypervirulent K. pneumoniae causes pyogenic liver abscess and can
    disseminate to eye, lung, and central nervous system sites, producing a
    metastatic invasive syndrome distinct from ordinary nosocomial pneumonia.
  biological_scale: ORGANISM
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Liver abscess
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41356976
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Metastatic infection occurred in 36% of cases, most commonly
      endophthalmitis (36%), followed by pulmonary (19%) and central nervous
      system involvement (15%).
    explanation: >-
      A systematic review of hvKp liver abscess cases documents frequent
      metastatic spread beyond the liver.

phenotypes:
- name: Pneumonia
  description: >-
    Hospital-acquired or ventilator-associated bacterial pneumonia can be caused
    by K. pneumoniae, including carbapenem-resistant isolates.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:42439974
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the infections were hospital-acquired, with
      ventilator-associated pneumonia (31.7%) and bloodstream infections
      (27.8%) being the most prevalent.
    explanation: >-
      Reports ventilator-associated pneumonia as the most prevalent CRE
      infection syndrome in a cohort where K. pneumoniae caused almost all
      infections.
- name: Sepsis
  description: >-
    K. pneumoniae causes neonatal and adult bloodstream infection that can
    progress to life-threatening sepsis and in-hospital mortality.
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  evidence:
  - reference: PMID:42127138
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Klebsiella pneumoniae is the leading cause of sepsis among neonates in
      low- and middle-income countries (LMICs) in Africa and Asia, contributing
      substantially to the overall burden of antimicrobial-resistant infections
      and mortality among neonates globally.
    explanation: >-
      Establishes sepsis as a major human manifestation of invasive neonatal
      K. pneumoniae infection.
- name: Liver abscess
  description: >-
    Hypervirulent K. pneumoniae can cause pyogenic liver abscess with disabling
    metastatic complications such as endophthalmitis.
  phenotype_term:
    preferred_term: Liver abscess
    term:
      id: HP:0100523
      label: Liver abscess
  evidence:
  - reference: PMID:41356976
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hypervirulent Klebsiella pneumoniae (hvKp) is an emerging cause of
      pyogenic liver abscess (PLA), characterized by virulence genes, such as
      rmpA and rmpA2, as well as capsular types K1/K2 that enhance mucoviscosity
      and invasiveness.
    explanation: >-
      The hvKp systematic review identifies pyogenic liver abscess as a
      characteristic human syndrome of hypervirulent K. pneumoniae.

treatments:
- name: Susceptibility-Guided Antibiotic Therapy
  description: >-
    Directed antibacterial treatment is selected after species identification
    and susceptibility or resistance testing, especially for extended-spectrum
    beta-lactamase-producing or carbapenem-resistant Enterobacterales.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Pulmonary Klebsiella Bacterial Burden
    treatment_effect: INHIBITS
    description: >-
      Antibiotics are chosen to eradicate the identified K. pneumoniae isolate
      according to its susceptibility profile.
  - target: Bacteremia and Sepsis
    treatment_effect: INHIBITS
    description: >-
      Rapid active therapy clears bloodstream organisms and reduces the chance
      of persistent septic physiology.
  evidence:
  - reference: PMID:35439291
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Preferred and alternative treatment recommendations are provided with
      accompanying rationales, assuming the causative organism has been
      identified and antibiotic susceptibility results are known.
    explanation: >-
      IDSA guidance frames therapy for resistant Enterobacterales around
      organism identification and antibiotic-susceptibility results, which is
      the core treatment decision for resistant K. pneumoniae pneumonia.
- name: Ceftazidime-avibactam for carbapenem-resistant Enterobacterales bacteremia
  description: >-
    Ceftazidime-avibactam is an active beta-lactam/beta-lactamase-inhibitor
    option for susceptible CRE bloodstream infection, particularly KPC-producing
    isolates.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
    - preferred_term: avibactam
      term:
        id: CHEBI:85984
        label: avibactam
  target_mechanisms:
  - target: Carbapenemase-Mediated Antibiotic Resistance
    treatment_effect: INHIBITS
    description: >-
      The avibactam component restores activity against susceptible
      beta-lactamase-producing Enterobacterales that would otherwise resist
      carbapenem therapy.
  - target: Bacteremia and Sepsis
    treatment_effect: INHIBITS
    description: >-
      Active therapy accelerates bloodstream clearance of CRE bacteremia.
  evidence:
  - reference: PMID:42708480
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAZ-AVI showed higher rapid negative conversion for CRE bacteremia in
      patients with hematologic malignancy, compared to the alternative
      antibiotics.
    explanation: >-
      A retrospective hematologic-malignancy cohort found faster negative blood
      culture conversion with ceftazidime-avibactam than with alternative
      antibiotics.
- name: Intravenous fosfomycin-containing combination regimens
  description: >-
    Intravenous fosfomycin is used as part of combination therapy for severe
    carbapenem-resistant Gram-negative infections, including K. pneumoniae
    hospital-acquired pneumonia, bacteremia, sepsis, and complicated urinary
    tract infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fosfomycin
      term:
        id: CHEBI:28915
        label: fosfomycin
  target_mechanisms:
  - target: Pulmonary Klebsiella Bacterial Burden
    treatment_effect: INHIBITS
    description: >-
      Fosfomycin-containing combinations help treat severe carbapenem-resistant
      K. pneumoniae infection at pulmonary and bloodstream sites.
  - target: Bacteremia and Sepsis
    treatment_effect: INHIBITS
    description: >-
      Combination therapy aims to clear carbapenem-resistant Gram-negative
      bacteremia and sepsis.
  evidence:
  - reference: PMID:42599357
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, clinical success was achieved in 79.4% of patients, while the
      successful clinical response and microbiological cure rates were 87.5%
      and 81.3% at the end of FOS treatment, respectively.
    explanation: >-
      Shows favorable clinical and microbiological outcomes in a
      carbapenem-resistant Gram-negative infection cohort in which most
      patients received fosfomycin as part of combination therapy and
      K. pneumoniae predominated.

diagnosis:
- name: MALDI-TOF species identification
  description: >-
    Matrix-assisted laser desorption/ionization time-of-flight mass spectrometry
    rapidly identifies cultured K. pneumoniae isolates from clinically relevant
    specimens.
  diagnosis_term:
    preferred_term: MALDI-TOF mass spectrometry
  evidence:
  - reference: PMID:27239799
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 174 K. pneumoniae isolates obtained from clinically relevant
      material were correctly identified by Bruker MALDI-TOF MS with log (score)
      >2.0.
    explanation: >-
      Demonstrates MALDI-TOF identification of K. pneumoniae in a 174-isolate
      diagnostic study.
- name: Blood-culture molecular pathogen and KPC detection
  description: >-
    Rapid molecular panels on positive blood cultures can identify bloodstream
    pathogens and detect resistance determinants such as blaKPC before slower
    conventional susceptibility workflows finish.
  diagnosis_term:
    preferred_term: blood culture identification panel
  evidence:
  - reference: PMID:32305272
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 100 positively flagged blood cultures, 94% of FilmArray BCID
      panel results were consistent with the MALDI Biotyper results.
    explanation: >-
      Supports rapid molecular identification from positive blood cultures as
      concordant with MALDI-TOF in a comparative diagnostic study.
- name: MALDIxin colistin-resistance detection
  description: >-
    MALDIxin detects lipid A modifications that mediate K. pneumoniae colistin
    and polymyxin resistance and can distinguish chromosomal from plasmid MCR
    mechanisms.
  diagnosis_term:
    preferred_term: MALDIxin lipid A resistance test
  evidence:
  - reference: PMID:31580426
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The optimized method allowed the rapid (<30 min) identification of
      l-Ara4N- and pEtN-modified lipid A of K. pneumoniae, which are known to
      be the real triggers of polymyxin resistance.
    explanation: >-
      Shows that MALDIxin can rapidly detect lipid A modifications that confer
      polymyxin resistance in K. pneumoniae.

animal_models:
- name: Intrapulmonary C57BL/6J mouse K. pneumoniae pneumonia model
  species: Mus musculus
  background: C57BL/6J
  category: Pulmonary challenge model
  description: >-
    Male C57BL/6J mice inoculated intrapulmonarily with K. pneumoniae ATCC 43816
    develop bronchopneumonia, pulmonary bacterial burden, innate leukocyte
    recruitment, and survival changes that measure local antibacterial immunity
    after TLR4 agonist pretreatment.
  modeled_mechanisms:
  - target: Pulmonary Klebsiella Bacterial Burden
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Measures viable K. pneumoniae in lung tissue after controlled
      intrapulmonary challenge.
    limitations: >-
      The model uses a defined intrapulmonary inoculum in otherwise healthy
      male mice; it does not reproduce chronic human colonization,
      device-associated ventilator pneumonia, or resistant plasmid ecology.
  evidence:
  - reference: PMID:36018281
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice received intrapulmonary 3D PHAD (20 μg) or vehicle for 2 consecutive
      days before challenge with intrapulmonary Klebsiella pneumoniae (2.3 × 10
      3 colony-forming units).
    explanation: >-
      Describes the controlled intrapulmonary mouse challenge used to model
      K. pneumoniae pneumonia and TLR4 agonist pretreatment.

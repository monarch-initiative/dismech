    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pneumonia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22547706
    reference_title: NLRC4 inflammasome-mediated production of IL-1β modulates mucosal immunity in the lung against gram-negative bacterial infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this article, we report that NLRC4 is important for host survival and
      bacterial clearance, as well as neutrophil-mediated inflammation in the
      lungs following Klebsiella pneumoniae infection.
    explanation: >-
      Identifies neutrophil-mediated lung inflammation as a response to
      K. pneumoniae infection in the pulmonary model.
phenotypes:
- name: Pneumonia
  description: Acute bacterial pneumonia caused by K. pneumoniae lung infection.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:36018281
    reference_title: INTRAPULMONARY TREATMENT WITH A NOVEL TLR4 AGONIST CONFERS PROTECTION AGAINST KLEBSIELLA PNEUMONIA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intrapulmonary treatment with 3D PHAD decreased lung K. pneumoniae
      colony-forming units and pneumonia severity with an associated improvement
      in survival compared with mice treated with vehicle.
    explanation: >-
      Reports experimental K. pneumoniae pneumonia severity after lung challenge.
treatments:
- name: Susceptibility-Guided Antibiotic Therapy
  description: >-
    Directed antibacterial treatment is selected after species identification
    and susceptibility or resistance testing, especially for extended-spectrum
    beta-lactamase-producing or carbapenem-resistant Enterobacterales.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Pulmonary Klebsiella Bacterial Burden
    description: >-
      Antibiotics are chosen to eradicate the identified K. pneumoniae isolate
      according to its susceptibility profile.
  evidence:
  - reference: PMID:35439291
    reference_title: "Infectious Diseases Society of America 2022 Guidance on the Treatment of Extended-Spectrum β-lactamase Producing Enterobacterales (ESBL-E), Carbapenem-Resistant Enterobacterales (CRE), and Pseudomonas aeruginosa with Difficult-to-Treat Resistance (DTR-P. aeruginosa)."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Preferred and alternative treatment recommendations are provided with
      accompanying rationales, assuming the causative organism has been
      identified and antibiotic susceptibility results are known.
    explanation: >-
      IDSA guidance frames therapy for resistant Enterobacterales around
      organism identification and antibiotic-susceptibility results, which is the
      core treatment decision for resistant K. pneumoniae pneumonia.

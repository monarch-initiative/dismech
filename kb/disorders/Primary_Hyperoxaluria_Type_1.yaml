datasets:
- accession: geo:GSE226019
  title: Restored glyoxylate metabolism in induced-hepatocytes after CRISPR/Cas-mediated AGXT gene correction and direct cell reprogramming of Primary Hyperoxaluria Type 1 fibroblasts
  description: Primary Hyperoxaluria Type 1 (PH1) is a rare inherited metabolic disorder characterized by oxalate overproduction in the liver, resulting in renal damage. It is caused by mutations in the AGXT gene. Combined liver and kidney transplantation is currently the only permanent curative treatment. We combined locus-specific gene correction and hepatic direct cell reprogramming to generate autologous healthy induced hepatocytes (iHeps) from PH1 patient-derived fibroblasts.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 39
  publication: PMID:38577102
  notes: Identified by GEO DataSets index search for Primary Hyperoxaluria Type 1 (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE245791
  title: Efficient and Safe Therapeutic Use of Paired Cas9-Nickases for Primary Hyperoxaluria Type 1
  description: The therapeutic use of adeno-associated viral vector (AAV)-mediated gene disruption using CRISPR-Cas9 is limited by potential off-target modifications and the risk of uncontrolled integration of vector genomes into CRISPR-mediated double-strand breaks. To address these concerns, we explored the use of AAV-delivered paired Staphylococcus aureus nickases (D10ASaCas9) to target the Hao1 gene for the treatment of primary hyperoxaluria type 1 (PH1). Our study demonstrated effective Hao1 gene disruption, a significant decrease in glycolate oxidase expression, and a therapeutic effect in PH1 mice.

differential_diagnoses:
- name: Other potassium-channel developmental and epileptic encephalopathies
  description: >-
    DEEs from other voltage-gated potassium channel genes (KCNQ2, KCNB1, KCNT1,
    KCNA1) overlap through early-onset epilepsy and developmental impairment and
    are distinguished by molecular testing and channel-specific
    electrophysiology.
  distinguishing_features:
  - A de novo pathogenic KCNA2 variant favors this disorder.
  - A causal variant in a different potassium-channel gene favors that channelopathy.
  evidence:
  - reference: PMID:29542386
    reference_title: "Potassium Channel Gain of Function in Epilepsy: An Unresolved Paradox."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we describe the current state of the field regarding the gain-of-function
      potassium channel variants associated with epilepsy (KCNA2, KCNB1, KCND2,
      KCNH1, KCNH5, KCNJ10, KCNMA1, KCNQ2, KCNQ3, and KCNT1)
    explanation: >-
      Lists the potassium-channel epilepsy genes that constitute the molecular
      differential diagnosis.
- name: Dravet syndrome and myoclonic-atonic epilepsy
  description: >-
    The loss-of-function KCNA2 presentation with febrile and focal seizures can
    resemble Dravet syndrome (SCN1A) or myoclonic-atonic epilepsy, but focal
    seizures and sleep-activated multifocal discharges are atypical for those
    syndromes and molecular testing distinguishes them.
  distinguishing_features:
  - Multifocal epileptiform discharges strongly activated by sleep favor KCNA2.
  - An SCN1A variant favors Dravet syndrome.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Kcna2 loss-of-function (Pingu) and Kcna2 knockout
  description: >-
    The Pingu mouse, carrying a Kcna2 loss-of-function mutation close to the
    human P405L residue, shows ataxia and growth retardation, and Kcna2 knockout
    mice have severe seizures and premature death — recapitulating the
    hyperexcitability predicted for the loss-of-function arm of the human
    disease.
  evidence:
  - reference: PMID:25751627
    reference_title: "De novo loss- or gain-of-function mutations in KCNA2 cause epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the Pingu mouse presenting with ataxia and growth retardation carries a
      Kcna2 loss-of-function mutation, p.Ile402Thr, in close proximity to P405L;
      Kcna2 knock-out mice present with severe seizures and premature death
    explanation: >-
      Mouse Kcna2 loss-of-function and knockout models reproduce ataxia and
      seizures, supporting the loss-of-function hyperexcitability mechanism.
progression:
- phase: Infancy to Early Childhood
  notes: >-
    Onset is typically in infancy or early childhood with epilepsy and evolving
    developmental impairment; severe gain-and-loss-of-function presentations may
    begin in the neonatal period.
  evidence:
  - reference: PMID:29050392
    reference_title: "Clinical spectrum and genotype-phenotype associations of KCNA2-related encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study thus indicates well represented genotype-phenotype associations
      between three subgroups of patients with KCNA2 encephalopathy according to
      the electrophysiological features of the mutations.
    explanation: >-
      The three functional subgroups differ in onset and severity, framing the
      disease trajectory.
- phase: Childhood onward
  notes: >-
    In milder loss-of-function disease seizures may remit in childhood while
    intellectual disability and ataxia persist; gain-of-function disease tends
    to a more severe, progressive course with cerebellar or whole-brain atrophy.
  evidence:
  - reference: PMID:29050392
    reference_title: "Clinical spectrum and genotype-phenotype associations of KCNA2-related encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more severe epilepsy, developmental problems and ataxia, and atrophy of
      the cerebellum or even the whole brain in about half of the patients with
      gain-of-function mutations
    explanation: >-
      Documents the more severe, atrophy-associated trajectory of the
      gain-of-function subgroup.
treatments:
- name: 4-Aminopyridine (Gain-of-Function Precision Therapy)
  description: >-
    For patients carrying gain-of-function KCNA2 variants, the potassium-channel
    blocker 4-aminopyridine (fampridine) is a mechanism-tailored therapy: it
    antagonizes the gain-of-function defect in vitro and, in n-of-1 trials,
    benefitted 9 of 11 patients with gain-of-function variants, improving
    seizures, gait, ataxia, alertness, cognition, or speech. It is not
    appropriate for loss-of-function variants, where blocking residual Kv1.2
    current would be expected to worsen hyperexcitability.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-aminopyridine
      term:
        id: CHEBI:34385
        label: 4-aminopyridine
  evidence:
  - reference: PMID:34516822
    reference_title: "4-Aminopyridine is a promising treatment option for patients with gain-of-function KCNA2-encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show for KCNA2-encephalopathy that the K+ channel blocker
      4-aminopyridine can antagonize gain-of-function defects caused by variants
      in the KV1.2 subunit in vitro, by reducing current amplitudes and negative
      shifts of steady-state activation and increasing the firing rate of
      transfected neurons.
    explanation: >-
      Demonstrates the mechanistic rationale — 4-aminopyridine antagonizes the
      gain-of-function Kv1.2 defect in vitro.
  - reference: PMID:34516822
    reference_title: "4-Aminopyridine is a promising treatment option for patients with gain-of-function KCNA2-encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In n-of-1 trials carried out in nine different centers, 9 of 11 patients
      carrying such variants benefitted from treatment with 4-aminopyridine.
    explanation: >-
      Documents clinical benefit of 4-aminopyridine in gain-of-function KCNA2
      patients.
- name: Antiseizure Medication

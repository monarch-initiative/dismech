  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  results: May show cerebellar or whole-brain atrophy, especially with gain-of-function variants.
  evidence:
  - reference: PMID:29050392
    reference_title: "Clinical spectrum and genotype-phenotype associations of KCNA2-related encephalopathies."

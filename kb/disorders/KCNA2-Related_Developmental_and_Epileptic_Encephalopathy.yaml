      c.1120A > G (p.Thr374Ala).
    explanation: >-
      Illustrates molecular genetic (exome) confirmation of a de novo KCNA2
      variant establishing the diagnosis.
- name: EEG and Seizure Phenotyping
  description: >-
    EEG documents the epileptic encephalopathy and helps distinguish the
    functional subgroups — multifocal discharges with prominent sleep activation
    in loss-of-function disease versus generalized discharges in gain-of-function
    disease.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: MAXO:0000932
      label: electroencephalography
  results: Multifocal sleep-activated (loss-of-function) or generalized (gain-of-function) epileptiform discharges.
  evidence:

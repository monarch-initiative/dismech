  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic KCNA2
    variant, typically de novo, in a child with early-onset epileptic
    encephalopathy, intellectual disability, and often ataxia. Functional
    classification of the variant (loss versus gain of function) informs
    prognosis and, for gain-of-function variants, candidacy for
    4-aminopyridine.

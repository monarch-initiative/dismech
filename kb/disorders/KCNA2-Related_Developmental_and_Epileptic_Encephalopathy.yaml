- name: Neuronal Membrane Hyperexcitability
  description: >-
    Impaired repolarization from reduced delayed-rectifier Kv1.2 current leaves
    the neuronal membrane hyperexcitable and prone to repetitive, prolonged
    firing. This is the classic loss-of-function route to hyperexcitability
    shared with other potassium-channelopathies and corroborated by the seizure
    phenotype of the Kcna2 knockout mouse.

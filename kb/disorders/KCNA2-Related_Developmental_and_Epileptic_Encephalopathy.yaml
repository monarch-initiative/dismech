name: KCNA2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-25T00:00:00Z"
description: >-
  A developmental and epileptic encephalopathy (DEE 32) caused by de novo
  heterozygous variants in KCNA2, which encodes the pore-forming alpha subunit
  of the voltage-gated potassium channel Kv1.2, a delayed-rectifier channel that
  drives neuronal repolarization after an action potential. KCNA2-related
  disease is a distinctive bidirectional channelopathy: some variants cause
  dominant-negative loss of Kv1.2 current, producing hyperexcitable neuronal
  membranes and repetitive firing, whereas others cause a gain of function with
  permanently open channels that hyperpolarize and electrically silence
  neurons. The two functional classes map onto partly distinct clinical
  pictures — loss-of-function variants tend to produce predominantly focal
  seizures with sleep-activated multifocal discharges and milder outcome, while
  gain-of-function variants tend to produce a more severe, ataxia-prominent
  encephalopathy with generalized seizures and cerebellar or whole-brain
  atrophy, and a third gain-and-loss-of-function group has the most severe,
  earliest-onset phenotype. Affected individuals present in infancy or early
  childhood with epilepsy, intellectual disability, delayed speech, and ataxia.
  The gain-of-function arm has become an early example of precision epilepsy
  therapy, as the potassium-channel blocker 4-aminopyridine can antagonize the
  gain-of-function defect and has benefitted patients carrying such variants.
category: Mendelian
parents:

  downstream:
  - target: Network Excitation-Inhibition Imbalance and Seizures
    causal_link_type: DIRECT
- name: Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
  description: >-
    Gain-of-function variants (e.g. R297Q, L298F) shift voltage-dependent
    activation strongly in the hyperpolarizing direction and increase current
    amplitude, leaving Kv1.2 channels permanently open at physiological
    membrane potentials. The excess potassium conductance hyperpolarizes the
    membrane and electrically silences the affected neuron. Because Kv1.2 is
    expressed in both excitatory and inhibitory neurons, silencing of inhibitory
    interneurons is the leading hypothesis for how a potassium-channel gain of
    function paradoxically produces network hyperexcitability and severe
    epilepsy.

    snippet: >-
      we identified four different de novo mutations in KCNA2, encoding the
      potassium channel KV1.2, in six isolated patients with epileptic
      encephalopathy
    explanation: >-
      Establishes de novo KCNA2 variants affecting the Kv1.2 channel as the
      molecular trigger of the disorder.
  - reference: PMID:25751627
    reference_title: "De novo loss- or gain-of-function mutations in KCNA2 cause epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results establish KCNA2 as a new gene involved in human
      neurodevelopmental disorders through two different mechanisms, predicting
      either hyperexcitability or electrical silencing of KV1.2-expressing
      neurons.
    explanation: >-
      Defines the two divergent functional mechanisms (loss versus gain of
      function) that branch from this trigger.
  downstream:
  - target: Dominant-Negative Loss of Kv1.2 Delayed-Rectifier Current
    causal_link_type: DIRECT
  - target: Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
    causal_link_type: DIRECT
- name: Dominant-Negative Loss of Kv1.2 Delayed-Rectifier Current
  description: >-
    Loss-of-function variants (e.g. P405L, I263T) reduce delayed-rectifier
    potassium current, and because the mutant subunit poisons the tetramer they
    act dominant-negatively, lowering current below the level expected from
    simple haploinsufficiency. Kv1.2 normally enables efficient repolarization
    of the neuronal membrane after each action potential, so its loss impairs
    repolarization.

discussions:
- discussion_id: gap_kcna2_gof_seizure_paradox
  prompt: >-
    How does a gain of function of the Kv1.2 potassium channel — which
    hyperpolarizes and electrically silences individual neurons — paradoxically
    produce a more severe epilepsy than the loss-of-function variants, and is
    preferential silencing of inhibitory interneurons the correct explanation at
    the network level?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
  - pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
  rationale: >-
    At the single-neuron level, increased Kv1.2 conductance hyperpolarizes and
    silences neurons, yet clinically the gain-of-function variants cause more
    severe, generalized epilepsy than the loss-of-function variants that produce
    classic hyperexcitability. The leading resolution is that gain of function
    preferentially silences inhibitory interneurons, disinhibiting the network,
    but this cell-type-specific mechanism has not been definitively established
    in human cortical circuits and remains, in the words of the review
    literature, an unresolved paradox with direct consequences for whether
    channel-blocking (4-aminopyridine) versus channel-opening strategies are
    appropriate for a given variant.
  evidence:
  - reference: PMID:29542386
    reference_title: "Potassium Channel Gain of Function in Epilepsy: An Unresolved Paradox."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This development has been difficult to understand as traditionally
      potassium channel loss-of-function, not gain-of-function, has been
      associated with hyperexcitability disorders.
    explanation: >-
      States the core paradox that gain-of-function potassium-channel variants
      cause epilepsy despite the traditional loss-of-function view of
      hyperexcitability.
  - reference: PMID:29542386
    reference_title: "Potassium Channel Gain of Function in Epilepsy: An Unresolved Paradox."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A surprising finding of these efforts is the recognition that gain of
      function potassium channel variants are actually associated with certain
      types of epilepsy, such as malignant migrating partial seizures of infancy
      or early-onset epileptic encephalopathy.
    explanation: >-
      Confirms the association of potassium-channel gain of function with
      early-onset epileptic encephalopathy, the phenomenon requiring a
      network-level explanation.
  proposed_experiments:
  - experiment_id: exp_kcna2_gof_interneuron_silencing
    name: Cell-type-resolved test of interneuron silencing in KCNA2 gain of function
    description: >-
      In human iPSC-derived or mouse cortical networks expressing a KCNA2
      gain-of-function variant, measure firing and intrinsic excitability
      separately in excitatory neurons and inhibitory interneurons, and test
      whether interneurons are preferentially silenced and whether the resulting
      network is hyperexcitable, with reversal by 4-aminopyridine.
    experiment_type:
      preferred_term: cell-type-resolved electrophysiology experiment
    perturbations:
    - name: KCNA2 gain-of-function expression
      target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
      genes:
      - preferred_term: KCNA2
        term:
          id: hgnc:6220
          label: KCNA2
      description: >-
        Express a gain-of-function KCNA2 variant (e.g. R297Q or L298F) across a
        cortical network with excitatory and inhibitory neurons distinguished.
    readouts:
    - name: Interneuron versus principal-neuron firing and network activity
      target: pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
      biological_processes:
      - preferred_term: regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
      assays:
      - preferred_term: patch-clamp recording
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Wild-type KCNA2
      description: Wild-type Kv1.2 expressed in the same network.
    - name: 4-aminopyridine versus vehicle
      description: Matched networks treated with 4-aminopyridine or vehicle.
    decision_criterion: >-
      Preferential interneuron silencing is supported if inhibitory interneurons
      show disproportionately reduced firing while the network becomes
      hyperexcitable, and if 4-aminopyridine restores interneuron firing and
      network balance.
    would_support:
    - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
    - pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
- discussion_id: gap_kcna2_4ap_generalization
  prompt: >-
    Does the benefit of 4-aminopyridine generalize across all gain-of-function
    KCNA2 variants and to the gain-and-loss-of-function subgroup, and can
    functional variant classification prospectively predict which patients
    respond?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
  rationale: >-
    The n-of-1 4-aminopyridine trials showed benefit in 9 of 11 gain-of-function
    patients, but two did not benefit and one worsened, and the
    gain-and-loss-of-function subgroup — which combines an activation shift with
    reduced amplitude — was not clearly addressed. Whether response can be
    predicted prospectively from the precise biophysical fingerprint of each
    variant, and whether the gain-and-loss group behaves like the gain group for
    treatment selection, is not established, yet it determines who should receive
    channel-blocking therapy.
  evidence:
  - reference: PMID:34516822
    reference_title: "4-Aminopyridine is a promising treatment option for patients with gain-of-function KCNA2-encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In n-of-1 trials carried out in nine different centers, 9 of 11 patients
      carrying such variants benefitted from treatment with 4-aminopyridine.
    explanation: >-
      Documents the incomplete response rate that motivates the need for
      prospective response prediction.
  - reference: PMID:29050392
    reference_title: "Clinical spectrum and genotype-phenotype associations of KCNA2-related encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study thus indicates well represented genotype-phenotype associations
      between three subgroups of patients with KCNA2 encephalopathy according to
      the electrophysiological features of the mutations.
    explanation: >-
      Establishes the three functional subgroups, including the
      gain-and-loss-of-function group whose treatment response is uncertain.
  proposed_experiments:
  - experiment_id: exp_kcna2_4ap_variant_response_map
    name: Biophysical response map for 4-aminopyridine across KCNA2 variants
    description: >-
      Across a panel of KCNA2 variants spanning pure gain, gain-and-loss, and
      loss of function, quantify the biophysical fingerprint (activation shift,
      amplitude, inactivation) and the in-vitro rescue by 4-aminopyridine, then
      correlate with clinical response in treated patients to build a
      prospective response predictor.
    experiment_type:
      preferred_term: genotype-response correlation study
    perturbations:
    - name: KCNA2 variant panel expression
      target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
      genes:
      - preferred_term: KCNA2
        term:
          id: hgnc:6220
          label: KCNA2
      description: >-
        Express each KCNA2 variant class and characterize its biophysical
        fingerprint and 4-aminopyridine sensitivity.
    readouts:
    - name: Channel biophysics and 4-aminopyridine rescue
      target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
      biological_processes:
      - preferred_term: potassium ion transmembrane transport
        term:
          id: GO:0071805
          label: potassium ion transmembrane transport
        modifier: INCREASED
      assays:
      - preferred_term: voltage-clamp recording
      direction: NEGATIVE
    controls:
    - name: Wild-type KCNA2
      description: Wild-type Kv1.2 characterized under identical conditions.
    decision_criterion: >-
      A predictor is supported if the in-vitro 4-aminopyridine rescue of a
      variant's biophysical defect correlates with clinical response across the
      treated cohort, and if the gain-and-loss group segregates predictably.
    would_support:
    - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing

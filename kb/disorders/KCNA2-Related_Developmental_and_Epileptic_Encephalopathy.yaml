pathophysiology:
- name: KCNA2 Variant and Altered Kv1.2 Channel Function
  description: >-
    A de novo heterozygous KCNA2 variant alters the voltage-gated potassium
    channel Kv1.2, the pore-forming subunit of a delayed-rectifier channel
    expressed across excitatory and inhibitory neurons. Because Kv1.2 assembles
    as a tetramer, a single variant subunit co-assembles with wild-type
    subunits and modifies the whole channel, producing either loss or gain of
    channel function depending on the variant. This is the shared trigger of a
    bidirectional channelopathy.
  role: trigger
  cell_types:

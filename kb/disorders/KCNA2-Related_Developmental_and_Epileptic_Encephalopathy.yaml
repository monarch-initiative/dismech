    Seizures are managed with antiseizure medications with variable response.
    Choice may be informed by the functional variant class; response is often
    incomplete, and some loss-of-function patients become seizure-free over
    childhood.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

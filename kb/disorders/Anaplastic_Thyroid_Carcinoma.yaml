name: Anaplastic Thyroid Carcinoma
creation_date: '2026-04-12T05:11:48Z'
description: >-
  Anaplastic thyroid carcinoma (ATC) is a highly aggressive undifferentiated
  follicular-cell-derived thyroid malignancy that typically emerges through
  stepwise dedifferentiation of papillary or follicular thyroid carcinoma. Its
  biology is defined by MAPK-pathway driver alterations with superimposed TP53,
  TERT, and PI3K/AKT pathway abnormalities, leading to rapid local invasion,
  airway and esophageal compression, early distant metastasis, and loss of
  radioiodine avidity.
categories:
- Endocrine Cancer
- Solid Tumor
parents:
- thyroid carcinoma
prevalence:
- population: General population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.1
  rate_high: 0.2
  notes: >-
    ATC accounts for approximately 1-2 new cases per million people per year;
    this is an incidence measure rather than point prevalence.
  evidence:
  - reference: PMID:22783225
    reference_title: Anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of ATC is estimated at one to two cases per million
      population per year
    explanation: >-
      Directly reports an annual population incidence of 1-2 cases per million,
      equivalent to 0.1-0.2 cases per 100,000 per year.
progression:
- phase: Rapidly progressive disease after diagnosis
  duration: Median survival approximately 5 months
  notes: >-
    ATC usually follows an exceptionally rapid clinical course, with death
    commonly caused by uncontrolled local invasion or distant metastasis.
  evidence:
  - reference: PMID:38179406
    reference_title: Update on current diagnosis and management of anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is the most aggressive form of thyroid carcinoma, with a median
      survival of 5 mo
    explanation: >-
      Directly characterizes the aggressive course and reports median survival
      of five months.
pathophysiology:
- name: MAPK-Activating Truncal Driver Alteration
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  description: >-
    ATC commonly arises from a pre-existing follicular-cell-derived thyroid
    carcinoma that already carries a truncal MAPK-pathway driver alteration.
    This initiating event establishes the core oncogenic signaling axis that is
    later exploited therapeutically in molecularly selected tumors.
  evidence:
  - reference: PMID:40396891
    reference_title: >-
      NOVEL INSIGHTS IN ADVANCED THYROID CARCINOMA: FROM MECHANISMS TO
      TREATMENTS: Molecular insights into the origin, biology, and treatment of
      anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The sequence of events leading to the development of ATC commonly begins
      with a tumorigenic mutation that constitutively activates the
      mitogen-activated protein kinase (MAPK) pathway, giving rise to indolent
      entities such as well-differentiated papillary or follicular thyroid
      carcinomas.
    explanation: >-
      Supports ATC initiation from MAPK-activating precursor lesions derived
      from follicular thyroid carcinoma.
  - reference: PMID:31583077
    reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Constitutive activation of the signaling pathways can be caused by
      mutations along the pathway, such as BRAF, RAS, PI3K, AKT, or mammalian
      target of rapamycin (mTOR), mutations in tumor suppressor genes, such as
      neurofibromin 1 (NF1) or phosphatase and tensin homolog (PTEN) mutations,
      or fusion RTKs, such as those in RET, neurotropic tropomyosin receptor
      kinase (NTRK), or anaplastic lymphoma kinase (ALK).
    explanation: >-
      Directly supports BRAF mutations and RET fusions as constitutive pathway
      activators in thyroid cancer, justifying both gene links on this mechanism.

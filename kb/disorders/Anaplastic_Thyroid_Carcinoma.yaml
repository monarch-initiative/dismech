    evidence:
    - reference: PMID:31583077
      reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: stage IVC (distant metastatic disease at presentation)
      explanation: Directly defines ATC stage IVC.
  evidence:

stages:
- name: AJCC/UICC Stage IV disease
  description: >-
    ATC is classified as stage IV even when distant metastases are absent; local
    extent and distant metastatic status remain essential for treatment planning.
  substages:
  - name: Stage IVA
    description: Intrathyroidal, surgically resectable disease without distant metastasis.
    evidence:
    - reference: PMID:31583077
      reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        IV A (intrathyroidal and surgically resectable without distant metastatic
        disease)
      explanation: Directly defines ATC stage IVA.
  - name: Stage IVB
    description: Extrathyroidal disease, with or without nodal metastasis, but without distant metastasis.
    evidence:
    - reference: PMID:31583077
      reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        stage IVB (extrathyroidal, with or without lymph node metastases but

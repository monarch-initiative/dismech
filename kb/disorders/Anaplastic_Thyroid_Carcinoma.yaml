diagnosis:
- name: Tissue diagnosis by fine-needle aspiration or core needle biopsy
  description: >-
    Rapid tissue confirmation is required. Fine-needle aspiration is commonly
    used, while core needle biopsy provides greater sensitivity and specificity
    when cytology is limited or nondiagnostic.
  diagnosis_term:
    preferred_term: biopsy procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: >-
    Cytologic or histologic confirmation of an undifferentiated thyroid carcinoma,
    interpreted with clinical, imaging, and immunohistochemical context.
  evidence:
  - reference: PMID:30844206
    reference_title: Anaplastic Thyroid Cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is typically made by fine needle aspiration cytology,
      although a core needle biopsy is more sensitive and specific.
    explanation: >-
      Directly supports both common sampling routes and the relative diagnostic
      advantage of core needle biopsy.
  - reference: PMID:41748947
    reference_title: >-
      Anaplastic thyroid carcinoma: Clinicopathologic and immunohistochemical
      study of 144 cases with special emphasis on the spectrum of histologic
      features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cytokeratins, PAX8 and TTF1 were of limited utility and showed inconsistent
      results emphasizing the importance of clinicopathologic correlation for
      the diagnosis.
    explanation: >-
      Directly cautions that commonly used epithelial and thyroid-lineage stains
      are inconsistent and cannot replace clinicopathologic correlation.
- name: Cross-sectional and metabolic staging imaging
  description: >-
    Ultrasound and cross-sectional imaging define thyroid and aerodigestive
    involvement; CT or MRI and FDG-PET/CT assess regional and distant disease.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Defines locoregional invasion, airway compromise, nodal disease, distant
    metastases, and resectability for urgent multidisciplinary planning.
  evidence:
  - reference: PMID:38179406
    reference_title: Update on current diagnosis and management of anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      high-resolution ultrasound, computed tomography, magnetic resonance imaging
    explanation: >-
      Directly lists the imaging modalities used in early ATC diagnosis and
      staging.
differential_diagnoses:
- name: Primary thyroid lymphoma
  disease_term:
    preferred_term: thyroid lymphoma
    term:
      id: MONDO:0019962
      label: thyroid lymphoma
  description: >-
    Thyroid lymphoma can also present as a rapidly enlarging thyroid or neck mass;
    hematolymphoid morphology and lineage testing distinguish it from ATC.
  distinguishing_features:
  - Hematolymphoid lineage and absence of an anaplastic epithelial tumor favor lymphoma.
  - Flow cytometry and lymphoma-directed tissue studies may be required when suspected.
  evidence:
  - reference: PMID:31583077
    reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of ATC includes lymphoma, poorly differentiated
      thyroid carcinoma (PDTC), poorly differenti - ated medullary thyroid
      carcinoma (MTC), squamous cell carcinoma from an adjacent site, and
      metastasis from other solid tumors.
    explanation: >-
      Directly identifies lymphoma as a differential diagnosis of ATC.
- name: Poorly differentiated thyroid carcinoma
  disease_term:
    preferred_term: poorly differentiated thyroid gland carcinoma
    term:
      id: MONDO:0006382
      label: poorly differentiated thyroid gland carcinoma
  description: >-
    Poorly differentiated thyroid carcinoma retains more follicular-cell
    differentiation than ATC but may overlap clinically, morphologically, and
    molecularly in high-grade or limited samples.
  distinguishing_features:
  - Retained thyroid differentiation and lower-grade morphology favor poorly differentiated carcinoma.
  - Thorough sampling is needed because differentiated and anaplastic components may coexist.
  evidence:
  - reference: PMID:31583077
    reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of ATC includes lymphoma, poorly differentiated
      thyroid carcinoma (PDTC), poorly differenti - ated medullary thyroid
      carcinoma (MTC), squamous cell carcinoma from an adjacent site, and
      metastasis from other solid tumors.
    explanation: >-
      Directly identifies poorly differentiated thyroid carcinoma as an ATC
      differential.
- name: Poorly differentiated medullary thyroid carcinoma
  disease_term:
    preferred_term: medullary thyroid gland carcinoma
    term:
      id: MONDO:0015277
      label: medullary thyroid gland carcinoma
  description: >-
    Poorly differentiated medullary thyroid carcinoma may mimic ATC in a limited
    or high-grade sample but retains parafollicular C-cell differentiation.
  distinguishing_features:
  - Calcitonin and neuroendocrine-lineage findings favor medullary thyroid carcinoma.
  - Integration with morphology and molecular findings is needed in poorly differentiated tumors.
  evidence:
  - reference: PMID:31583077
    reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of ATC includes lymphoma, poorly differentiated
      thyroid carcinoma (PDTC), poorly differenti - ated medullary thyroid
      carcinoma (MTC), squamous cell carcinoma from an adjacent site, and
      metastasis from other solid tumors.
    explanation: >-
      Directly identifies poorly differentiated medullary thyroid carcinoma as
      an ATC differential.
- name: Head and neck squamous cell carcinoma
  disease_term:
    preferred_term: head and neck squamous cell carcinoma
    term:
      id: MONDO:0010150
      label: head and neck squamous cell carcinoma
  description: >-
    Squamous carcinoma from an adjacent aerodigestive site can invade the thyroid
    and resemble squamoid ATC; establishing the anatomic primary and integrating
    morphology are essential.
  distinguishing_features:
  - A mucosal primary at an adjacent head-and-neck site favors squamous cell carcinoma.
  - Squamous differentiation can occur in ATC and is not independently diagnostic of an adjacent-site primary.
  evidence:
  - reference: PMID:31583077
    reference_title: Recent advances and emerging therapies in anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of ATC includes lymphoma, poorly differentiated
      thyroid carcinoma (PDTC), poorly differenti - ated medullary thyroid
      carcinoma (MTC), squamous cell carcinoma from an adjacent site, and
      metastasis from other solid tumors.
    explanation: >-
      Directly identifies adjacent-site squamous cell carcinoma as an ATC
      differential.
- name: Sarcomatoid renal cell carcinoma metastatic to thyroid
  disease_term:
    preferred_term: sarcomatoid renal cell carcinoma
    term:
      id: MONDO:0003012
      label: sarcomatoid renal cell carcinoma
  description: >-
    Metastatic sarcomatoid renal cell carcinoma can closely mimic ATC and share
    CD10, cytokeratin, and PAX8 expression; renal imaging and clinical history are
    decisive when this immunophenotype is present.
  distinguishing_features:
  - Evidence of a renal primary or other metastatic disease favors renal cell carcinoma.
  - PAX8, cytokeratin, and CD10 coexpression is not specific for thyroid origin.
  evidence:
  - reference: PMID:41748947
    reference_title: >-
      Anaplastic thyroid carcinoma: Clinicopathologic and immunohistochemical
      study of 144 cases with special emphasis on the spectrum of histologic
      features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that sarcomatoid renal cell carcinoma can also express CD10,
      cytokeratins, and PAX8, anaplastic tumors bearing this constellation of
      markers can easily be mistaken for metastasis from renal cell cancer.
    explanation: >-
      Directly identifies the immunophenotypic overlap and resulting diagnostic
      pitfall.
- name: Soft tissue sarcoma involving the thyroid
  disease_term:
    preferred_term: soft tissue sarcoma
    term:
      id: MONDO:0018078
      label: soft tissue sarcoma
  description: >-
    Spindle/pleomorphic ATC may resemble a primary or metastatic sarcoma;
    epithelial differentiation, thyroid context, and exclusion of an extra-thyroid
    primary help resolve the diagnosis.
  distinguishing_features:
  - Cytokeratin or PAX8 positivity supports epithelial or thyroid-lineage differentiation but may be focal or absent in ATC.
  - A known extra-thyroid soft tissue primary favors metastatic sarcoma.
  evidence:
  - reference: PMID:41748947
    reference_title: >-
      Anaplastic thyroid carcinoma: Clinicopathologic and immunohistochemical
      study of 144 cases with special emphasis on the spectrum of histologic
      features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histological appearance of this tumor can be highly variable but has
      traditionally been associated with a close resemblance to undifferentiated
      pleomorphic soft tissue sarcomas.
    explanation: >-
      Directly establishes that ATC can closely resemble an undifferentiated
      pleomorphic soft tissue sarcoma, creating the differential diagnosis.
- name: Thyroid angiosarcoma
  disease_term:
    preferred_term: angiosarcoma
    term:
      id: MONDO:0016982
      label: angiosarcoma
  description: >-
    Pseudoangiosarcomatous ATC can form vessel-like spaces and mimic true thyroid
    angiosarcoma, especially in a small biopsy.
  distinguishing_features:
  - Conventional spindle or epithelioid ATC areas support anaplastic carcinoma.
  - Endothelial-lineage evaluation and adequate sampling help exclude true angiosarcoma.
  evidence:
  - reference: PMID:41748947
    reference_title: >-
      Anaplastic thyroid carcinoma: Clinicopathologic and immunohistochemical
      study of 144 cases with special emphasis on the spectrum of histologic
      features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      atypical cells closely resembling angiosarcoma.
    explanation: >-
      Directly describes the morphologic resemblance that creates this
      diagnostic pitfall.
biochemical:
- name: Comprehensive genomic profiling
  notes: >-
    Broad molecular testing is essential in unresectable or metastatic ATC to
    identify BRAF V600E and rarer actionable fusions or biomarkers that may
    expand systemic treatment options.
  evidence:
  - reference: PMID:38044137
    reference_title: >-
      The frequency of mutations in advanced thyroid cancer in Japan: a
      single-center study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, 58.8% of ATC, 93.8% of PTC, and 42.9% of PDTC had genetic
      alterations linked to therapeutic agents. Active gene panel testing is
      required to increase treatment options.
    explanation: >-
      Supports routine genomic profiling in advanced ATC because actionable
      alterations are common enough to change treatment selection.
- name: Radioiodine avidity
  notes: >-
    ATC is typically radioiodine refractory because dedifferentiation impairs
    thyroid-specific iodide handling rather than preserving differentiated
    thyroid-cell function.
  evidence:
  - reference: PMID:41462994
    reference_title: >-
      Dedifferentiation and Redifferentiation of Follicular-Cell-Derived
      Thyroid Carcinoma: Mechanisms and Therapeutic Implications.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These alterations promote the loss of thyroid-specific functions,
      including iodide metabolism, and correlate with poor clinical
      outcomes.
    explanation: >-
      Supports loss of iodide handling (i.e. loss of radioiodine avidity)
      as a functional consequence of ATC dedifferentiation.
genetic:

    reference_title: Anaplastic thyroid carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All ATCs are considered stage IV by the International Union Against Cancer
      (UICC) – TNM staging and American Joint Commission on Cancer (AJCC) system.

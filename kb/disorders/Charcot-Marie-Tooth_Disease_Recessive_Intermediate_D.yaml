animal_models:
- name: Cox6a1-null mouse
  species: Mouse
  genotype: Constitutive Cox6a1 knockout
  publication: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
  description: The null model shows absent COX6A1, impaired walking and rotarod performance, thin sciatic nerves, neurogenic muscle changes, reduced liver COX activity and ATP, and delayed sciatic motor conduction. Histology and behavior were assessed at 7–8 weeks and conduction at 7–10 weeks.
  modeled_mechanisms:
  - target: Reduced Cytochrome c Oxidase Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reduced enzyme activity in liver mitochondrial fractions.
    limitations: Liver biochemistry does not establish enzyme deficiency in nerve or reproduce either human allele.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
      reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: the null mice showed statistically significant reductions in COX activity and ATP contents in liver cells (p < 0.001; Figures 4A and 4B) and delayed motor NCV (p < 0.01; Figure 4C) relative to control animals.
      explanation: COX activity and ATP were measured in liver, whereas motor conduction was measured in sciatic nerve.
  - target: Reduced Cellular ATP Content
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reduced ATP in liver homogenates.
    limitations: A complete null in mice differs from the human splice-region and stop-loss alleles; no nerve ATP measurement was reported.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
      reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: the null mice showed statistically significant reductions in COX activity and ATP contents in liver cells (p < 0.001; Figures 4A and 4B) and delayed motor NCV (p < 0.01; Figure 4C) relative to control animals.
      explanation: COX activity and ATP were measured in liver, whereas motor conduction was measured in sciatic nerve.
  - target: Motor Conduction Slowing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Delayed sciatic motor NCV relative to controls.
    limitations: Species, age and null genotype limit translation to human axonal versus mixed electrophysiology.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
      reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: the null mice showed statistically significant reductions in COX activity and ATP contents in liver cells (p < 0.001; Figures 4A and 4B) and delayed motor NCV (p < 0.01; Figure 4C) relative to control animals.
      explanation: COX activity and ATP were measured in liver, whereas motor conduction was measured in sciatic nerve.
  - target: Distal Neurogenic Muscle Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Small angular fibers and small-group atrophy accompany thin sciatic nerves and motor impairment.
    limitations: The authors found no remarkable neurodegeneration; the model does not establish extensive human-like axonal loss.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
      reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Histological examinations revealed that the null mice had thinned sciatic nerves (Figure 3C) and neurogenic muscular changes including small angular fiber and small group atrophy (Figure 3D), although no remarkable neurodegeneration was found.
      explanation: The null model has thin nerves and neurogenic muscle changes, but the authors explicitly did not find remarkable neurodegeneration.
discussions:
- discussion_id: cmtrid_nosology_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How does the early severe COX6A1 phenotype relate to neuropathy-predominant CMTRID?
  attaches_to:
  - pathophysiology#COX6A1 Stop-Loss Variant
  - phenotypes#Global Developmental Delay
  rationale: 'The three primary clinical reports describe five affected individuals in four families: three Japanese deletion cases, one Czech deletion case and one stop-loss child. The child had developmental delay, elevated lactate and death after febrile illness at 3.5 years. These observations cannot establish whether broader involvement reflects allele severity, modifiers or a distinct nosological boundary. Frequency estimates are not justified.'
  evidence:
  - reference: PMID:41044399
    reference_title: A novel homozygous COX6A1 variant causes axonal charcot-marie-tooth disease, developmental delays and mitochondrial dysfunction.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Here we report a 2-year-4-month-old girl who presented with global developmental delay, axonal CMT disease, and elevated lactate levels.
    explanation: A single child with the homozygous stop-loss allele had these findings; age at presentation does not establish onset age or disease-wide frequency.
  - reference: PMID:41044399
    reference_title: A novel homozygous COX6A1 variant causes axonal charcot-marie-tooth disease, developmental delays and mitochondrial dysfunction.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The patient experienced rapid decompensation and died following febrile illness at the age of 3.5 years.
    explanation: The severe outcome belongs to the single stop-loss case.
- discussion_id: cmtrid_isoform_sparing_hypothesis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does COX6A2 compensate for COX6A1 deficiency in patient muscle?
  attaches_to:
  - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
  rationale: Forced COX6A2 expression rescues HEK293 knockdown cells, but physiological compensation in patients remains unmeasured. The null mouse has liver COX and ATP measurements and sciatic conduction measurements; a matched biochemical comparison of nerve, skeletal muscle and heart remains informative. Residual COX6A1 function and differential tissue vulnerability are alternative explanations.
  evidence:
  - reference: PMID:20307258
    reference_title: Novel insights into the assembly and function of human nuclear-encoded cytochrome c oxidase subunits 4, 5a, 6a, 7a and 7b.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The ectopic expression of the heart/muscle-specific isoform of the Cox6 subunit (COX6A2) resulted in restoration of both CcO holoenzyme and activity in COX6A1-knockdown cells.
    explanation: Forced isoform substitution rescues an engineered cell model; this does not establish endogenous compensation in patient tissues.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
    reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: the null mice showed statistically significant reductions in COX activity and ATP contents in liver cells (p < 0.001; Figures 4A and 4B) and delayed motor NCV (p < 0.01; Figure 4C) relative to control animals.
    explanation: COX activity and ATP were measured in liver, whereas motor conduction was measured in sciatic nerve.
  proposed_experiments:
  - experiment_id: cmtrid_tissue_resolved_cox_activity
    name: Tissue-resolved complex IV activity in the Cox6a1-null mouse
    description: Compare COX activity and COX6A2 abundance in sciatic nerve, dorsal root ganglion, skeletal muscle and heart of null and wild-type mice, with liver as a measured reference tissue.
    would_support:
    - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
    supporting_outcome:
    - Relative preservation of enzyme activity in tissues expressing COX6A2 would support compensation, without proving causality.
    would_refute:
    - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
    refuting_outcome:
    - Comparable loss of activity despite high COX6A2 expression would argue against simple isoform substitution as the explanation.
- discussion_id: cmtrid_intermediate_designation
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  resolved_date: '2026-11-06T14:00:00Z'
  prompt: Does CMTRID meet a fixed electrophysiological definition of intermediate CMT?
  attaches_to:
  - pathophysiology#Motor Conduction Slowing
  rationale: The historical intermediate label can obscure the axonal and mixed patterns observed across patients.
  resolution_note: 'Full primary reports provide the previously missing measurements: the founding siblings had motor NCVs below 38 m/s at ages 30–39 and sural onion bulbs, whereas the Czech case had median motor NCV 46.4 m/s and ulnar NCV 44 m/s with low CMAPs at age 24. The entry therefore records variable axonal or mixed physiology and does not impose a fixed intermediate range. Larger longitudinal studies remain desirable, but absence of published human NCVs is not a valid knowledge gap.'
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
    reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The affected siblings of family 1 initially had slightly reduced median motor nerve conduction velocities (NCVs) and onion bulb formation in the sural nerve at young ages, but they had motor NCVs below 38 m/s when they were aged 30–39 years, indicating mixed CMT
    explanation: The founder report provides human conduction measurements and sural pathology, documenting an age-dependent mixed pattern in two siblings.
  - reference: url:https://www.c-m-t.cz/wp-content/uploads/2016/01/COX6A1-mutation-causes-axonal-hereditary-motor-and-sensory-neuropathy-%E2%80%93-the-confirmation-of-the-primary-report.pdf
    reference_title: COX6A1 mutation causes axonal hereditary motor and sensory neuropathy -- the confirmation of the primary report
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Ulnaris (Lt) 1.1 44 Medianus (Lt) 1.2 46.4 Tibialis (Lt) Not evoked Peroneus (Lt) Not evoked
    explanation: Table 1 gives motor CMAP amplitudes in mV and conduction velocities in m/s for the Czech patient.

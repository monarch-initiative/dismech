discussions:
- discussion_id: cmtrid_nosology_spectrum
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is CMTRID one disease, or the neuropathy-predominant end of a broader
    COX6A1-related mitochondrial disorder?
  attaches_to:
  - pathophysiology#Biallelic COX6A1 Loss of Function
  - phenotypes#Global Developmental Delay
  rationale: >-
    The founding families had an adult-compatible peripheral neuropathy and no
    reported encephalopathy or lactate elevation. The 2025 case had global
    developmental delay, raised lactate and death after a febrile decompensation at
    3.5 years - the natural history of an infantile mitochondrial disease, not of CMT.
    Two genotypes and three families is not enough to say whether that is allelic
    severity, a modifier, or a different entity that happens to share a gene. The
    answer determines whether the developmental and metabolic phenotypes in this entry
    belong here at all, which is why they are recorded as OCCASIONAL and flagged
    rather than folded into the core description.
- discussion_id: cmtrid_isoform_sparing_hypothesis
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does COX6A2 expression in mature muscle actually spare that tissue in
    COX6A1-deficient patients, or is muscle involvement simply under-investigated?
  attaches_to:
  - pathophysiology#Isoform-Restricted Tissue Vulnerability
  rationale: >-
    The isoform-substitution evidence is strong but entirely non-human-disease: COX6A2
    rescues holoenzyme and activity in COX6A1-knockdown HEK293 cells, and the
    ubiquitous-to-muscle-specific switch is documented in maturing mouse muscle. What
    has never been done is the measurement in the disease: no CMTRID patient tissue has
    been examined for COX6A2 content, and the Cox6a1-null mouse's COX activity was
    reported without a tissue breakdown. The mismatch is specific rather than general -
    the model organism that carries the relevant genotype was never asked the question
    that the cell model was built to answer. Recorded as HUMAN_MODEL_MISMATCH rather
    than as a plain knowledge gap because the evidence exists and is good; what is
    missing is its translation to the human disease.

    Note the rescue experiment also constrains what a therapy could look like: if
    COX6A2 substitutes functionally, inducing it in nerve is a coherent therapeutic
    hypothesis, and the same paper reports that COX6A2 mRNA did not rise on its own in
    the knockdown cells - so the substitution would have to be forced rather than
    coaxed.
  proposed_experiments:
  - experiment_id: cmtrid_tissue_resolved_cox_activity
    name: Tissue-resolved complex IV activity in the Cox6a1-null mouse
    description: >-
      Measure COX activity and COX6A2 protein side by side in sciatic nerve, dorsal
      root ganglion, gastrocnemius and heart of Cox6a1-null and wild-type mice.
    would_support:
    - pathophysiology#Isoform-Restricted Tissue Vulnerability
    supporting_outcome:
    - >-
      COX activity is reduced in nerve and ganglion but preserved in muscle and heart,
      and the preserved tissues are the ones expressing COX6A2.
    would_refute:
    - pathophysiology#Isoform-Restricted Tissue Vulnerability
    refuting_outcome:
    - >-
      COX activity falls equally across nerve and muscle, so isoform substitution does
      not account for the tissue selectivity and another explanation is required.
- discussion_id: cmtrid_intermediate_designation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does CMTRID meet the electrophysiological definition of intermediate CMT?
  attaches_to:
  - pathophysiology#Peripheral Nerve Degeneration with Mixed Conduction Slowing
  rationale: >-
    The disease is catalogued as recessive intermediate D, but the founding paper
    calls the phenotype axonal or mixed and both subsequent descriptions call it
    axonal. No paper reports the median motor conduction velocities that the
    intermediate category is defined by. The label may be a nosological artefact, and
    a curator matching patients to this entry on the strength of the word
    "intermediate" could be misled.

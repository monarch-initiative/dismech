  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy exists. Management follows general CMT practice -
    physiotherapy, orthoses and foot surgery for deformity - and no treatment has been
    reported specifically in CMTRID. This entry deliberately records no drug therapy
    rather than importing a generic mitochondrial cocktail: no cofactor or antioxidant
    has been reported to change the course of this disease, and asserting one would be
    unsupported.

  - reference: PMID:36961412
    reference_title: Switching ubiquitous and muscle-specific isoforms of mitochondrial respiratory complex IV in skeletal muscle fine-tunes complex IV activity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found extensive CIV-containing supramolecular organization in murine
      musculature at advanced developmental stages, while a switch in the expression
      from ubiquitous to muscle-specific isoforms of CIV was also detected.
    explanation: >-
      Documents that the isoform switch actually occurs in maturing muscle, which is
      what makes the rescue experiment above relevant in vivo. INDIRECT: the
      observation is in normal mouse muscle, and the inference to human nerve versus
      muscle is the curator's.
  - reference: PMID:36961412
    reference_title: Switching ubiquitous and muscle-specific isoforms of mitochondrial respiratory complex IV in skeletal muscle fine-tunes complex IV activity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We also found that the enzymatic activity of CIV containing the muscle-specific
      isoform COX6A2 was higher than that with COX6A1 in engineered HEK293T cells.
    explanation: >-
      Shows the two isoforms are not functionally interchangeable, which is what makes
      the substitution argument non-trivial rather than a restatement of paralogy.

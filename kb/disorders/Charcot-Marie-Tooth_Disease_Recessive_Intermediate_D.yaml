inheritance:
- name: Autosomal recessive
  description: Autosomal recessive inheritance is supported by homozygous COX6A1 variants in the Japanese founding families, an independent Czech case and the stop-loss child. Consanguinity was present in the Japanese families; the Czech patient reported that her parents were unrelated. When both parents carry a pathogenic variant in COX6A1, the recurrence risk for an affected child is 25% per pregnancy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
    reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Those data indicated that COX6A1 mutation causes the autosomal-recessive axonal or mixed CMT.
    explanation: The founder study concludes recessive inheritance from its genetic and functional findings.
  - reference: PMID:41044399
    reference_title: A novel homozygous COX6A1 variant causes axonal charcot-marie-tooth disease, developmental delays and mitochondrial dysfunction.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'WES revealed a rare homozygous COX6A1 variant (NM_004373.4: c.329 A > T, p.110Leuext41) that is absent in population databases.'
    explanation: The stop-loss variant was homozygous in the reported child; database absence is the authors' report for this allele.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: General autosomal recessive CMT counseling applies when both parents are carriers; this is not an empirical CMTRID recurrence estimate.
pathophysiology:
- name: COX6A1 Intronic Splice-Region Deletion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: The recurrent five-base deletion removes part of the intron 2 polypyrimidine tract adjacent to exon 3. The founding representation was NM_004373.3:c.247-10_247-6delCACTC; the confirmation report applies the HGVS 3-prime rule as NM_004373.2:c.247-7_247-3del. These designate the same lesion.
  genes:
  - preferred_term: COX6A1
    term:
      id: hgnc:2277
      label: COX6A1
  genetic_context:
    genes:
    - preferred_term: COX6A1
      term:
        id: hgnc:2277
        label: COX6A1
    zygosity: HOMOZYGOUS
    variant_type: deletion
    genomic_contexts:
    - intron
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
    reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A disease-specific 5 bp deletion (c.247−10_247−6delCACTC) in the pyrimidine tract near to the splicing acceptor near to the third exon of COX6A1.
    explanation: The original variant lies in the intron 2 splice-region polypyrimidine tract; this is the original, unnormalized representation.
  downstream:
  - target: Reduced Normally Spliced COX6A1 RNA
    causal_link_type: DIRECT
- name: Reduced Normally Spliced COX6A1 RNA
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Normally spliced COX6A1 RNA was below one fifth of control levels in blood from two affected siblings. Reduced RNA was also observed in their EBV-transformed B-cell lines. Alternative splicing with possible nonsense-mediated decay was proposed; decay itself was not demonstrated.
  genes:
  - preferred_term: COX6A1
    term:
      id: hgnc:2277
      label: COX6A1
  evidence:

notes: The historical CMTRID name is retained for the MONDO-defined COX6A1 neuropathy. The severe stop-loss presentation is represented as an allele-associated spectrum expansion from one case. Phenotype frequencies, prevalence and penetrance are not estimated from the small published evidence base. The recurrent intronic deletion has two published HGVS representations of the same lesion. No dedicated COX6A1 GeneReviews chapter was identified; the full CMT Overview is used only for general supportive management and recessive counseling, not as direct phenotype evidence. The PMID abstract of that Overview is not a clinical baseline. Clinical phenotypes come from the founder and confirmation papers and the stop-loss case. No COX6A1-specific interventional trial was identified in the ClinicalTrials.gov query; generic CMT trials are not evidence of efficacy in CMTRID.

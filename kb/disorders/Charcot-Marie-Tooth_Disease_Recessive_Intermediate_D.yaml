- name: Peripheral Nerve Degeneration with Mixed Conduction Slowing
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Length-dependent degeneration of peripheral motor and sensory axons, producing the
    classic CMT picture of distal weakness, wasting, sensory loss and areflexia. The
    electrophysiology is what puts this entity in the "intermediate" category: the
    founding report describes the phenotype as axonal or mixed, meaning conduction
    velocities that fall between the demyelinating and axonal ranges rather than
    clearly into one. Curators should note the tension - the entity is named
    intermediate but the primary description says "axonal or mixed", and both later
    reports call it axonal.

    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Both reported genotypes are homozygous in consanguineous or presumed-related
      pedigrees. Compound heterozygosity has not been reported, which is a statement
      about the small number of families described rather than about the allele
      requirement.

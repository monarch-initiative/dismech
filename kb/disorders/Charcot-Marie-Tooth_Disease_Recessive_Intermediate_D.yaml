    explanation: COX activity and ATP were measured in liver, whereas motor conduction was measured in sciatic nerve.
- name: Distal Neurogenic Muscle Atrophy
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: Human distal amyotrophy accompanies the neuropathy. Small angular fibers and small-group atrophy in the null mouse support a neurogenic mechanism, although remarkable nerve degeneration was not observed in that model.
  evidence:
  - reference: url:https://www.c-m-t.cz/wp-content/uploads/2016/01/COX6A1-mutation-causes-axonal-hereditary-motor-and-sensory-neuropathy-%E2%80%93-the-confirmation-of-the-primary-report.pdf
    reference_title: COX6A1 mutation causes axonal hereditary motor and sensory neuropathy -- the confirmation of the primary report
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Profound muscle atrophies of the forearm and hand muscles are present.
    explanation: Direct clinical observation in the Czech adult.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/
    reference_title: A Mutation of COX6A1 Causes a Recessive Axonal or Mixed Form of Charcot-Marie-Tooth Disease
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Histological examinations revealed that the null mice had thinned sciatic nerves (Figure 3C) and neurogenic muscular changes including small angular fiber and small group atrophy (Figure 3D), although no remarkable neurodegeneration was found.
    explanation: The null model has thin nerves and neurogenic muscle changes, but the authors explicitly did not find remarkable neurodegeneration.
- name: Possible COX6A2-Mediated Tissue Compensation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: Substitution by the muscle-specific paralogue COX6A2 is one proposed explanation for tissue selectivity. Forced expression rescues COX6A1-knockdown cells, and an isoform switch occurs during mouse muscle development. Neither observation demonstrates muscle protection or absence of compensation in patient nerve. Residual COX6A1 and other tissue-specific vulnerabilities remain alternative explanations.
  evidence:
  - reference: PMID:20307258
    reference_title: Novel insights into the assembly and function of human nuclear-encoded cytochrome c oxidase subunits 4, 5a, 6a, 7a and 7b.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The ectopic expression of the heart/muscle-specific isoform of the Cox6 subunit (COX6A2) resulted in restoration of both CcO holoenzyme and activity in COX6A1-knockdown cells.
    explanation: Forced isoform substitution rescues an engineered cell model; this does not establish endogenous compensation in patient tissues.
  - reference: PMID:36961412
    reference_title: Switching ubiquitous and muscle-specific isoforms of mitochondrial respiratory complex IV in skeletal muscle fine-tunes complex IV activity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: We found extensive CIV-containing supramolecular organization in murine musculature at advanced developmental stages, while a switch in the expression from ubiquitous to muscle-specific isoforms of CIV was also detected.
    explanation: Developmental isoform switching in mouse muscle is indirect evidence for the proposed patient tissue-compensation mechanism.

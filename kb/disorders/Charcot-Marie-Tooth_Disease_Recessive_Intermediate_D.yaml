    The single causative gene. COX6A1 encodes the ubiquitously expressed 6A subunit
    of cytochrome c oxidase; the paralogue COX6A2 is muscle-specific and is not known
    to cause disease. Only two pathogenic alleles have been described - the intron 2
    polypyrimidine-tract deletion and a stop-loss substitution - so the allelic
    spectrum should be read as barely sampled rather than as narrow.

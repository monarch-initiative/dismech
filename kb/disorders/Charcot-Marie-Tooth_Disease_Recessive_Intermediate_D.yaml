- name: Impaired Terminal Electron Transfer and ATP Synthesis
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Less functional cytochrome c oxidase means less electron transfer from reduced
    cytochrome c to oxygen and less proton pumping, so oxidative ATP synthesis falls.
    In this disease the deficit is partial rather than complete - patients survive to
    adulthood in the founding families - which is consistent with a subunit that is
    reduced rather than absent.

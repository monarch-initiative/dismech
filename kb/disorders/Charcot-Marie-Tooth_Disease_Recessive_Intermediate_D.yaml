- name: Isoform-Restricted Tissue Vulnerability
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The candidate explanation for why a defect in a housekeeping respiratory subunit
    presents as a peripheral neuropathy. Adult cardiac and skeletal muscle switch
    their complex IV 6A subunit from the ubiquitous COX6A1 to the muscle-specific
    COX6A2, so those high-demand tissues carry a substitute for the missing subunit.
    Peripheral nerve does not, and long axons have both the highest ATP cost per cell
    and no capacity for compensatory isoform switching, which would leave them the
    tissue at risk.

    The substitution step is not speculative: forced expression of COX6A2 in
    COX6A1-knockdown human cells restores both holoenzyme and activity, so the two
    isoforms are interchangeable at the level of the complex. What is unproven is the
    step from there to the human disease - nobody has shown that endogenous COX6A2
    expression is what protects muscle in a COX6A1-deficient patient, and no CMTRID
    patient tissue has been compared for COX6A2 content. The node is therefore kept
    at HYPOTHETICAL: the biochemistry is established, the explanation of the clinical
    tissue selectivity is not. It is curated rather than omitted because it is the
    mechanism a reader would otherwise supply silently, and naming it makes it
    falsifiable.

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A disease-specific 5 bp deletion (c.247−10_247−6delCACTC) in the pyrimidine tract near to the splicing acceptor near to the third exon of COX6A1.
    explanation: The original variant lies in the intron 2 splice-region polypyrimidine tract; this is the original, unnormalized representation.

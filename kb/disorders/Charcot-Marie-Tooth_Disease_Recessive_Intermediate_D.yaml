- name: Neurogenic Muscular Atrophy
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Distal muscle wasting secondary to denervation rather than to a primary myopathy.
    The distinction matters here because the causative gene is a respiratory chain
    subunit, so a primary mitochondrial myopathy would be the competing explanation;
    the Cox6a1-null mouse settles it in that model by showing the atrophy is
    neurogenic.
  evidence:
  - reference: PMID:25152455
    reference_title: A mutation of COX6A1 causes a recessive axonal or mixed form of Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

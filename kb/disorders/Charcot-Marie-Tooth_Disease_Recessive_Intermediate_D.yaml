notes: >-
  Lump/split decision. Curated as its own Disease entry rather than as a subtype of a
  broader CMT or complex IV entry. It has its own MONDO term and its own gene, and its
  pathograph is genuinely distinct from both of its parents: it is the only CMT entity
  in this KB whose trigger node is a respiratory chain subunit, and it is the only
  complex IV deficiency in this KB whose dominant tissue is peripheral nerve rather
  than brain, heart or muscle. It conforms to the complex_iv_assembly_deficiency
  module at three nodes rather than duplicating that cascade.

  Evidence base, stated plainly. This entry rests on three human families across two
  papers, plus one mouse model, plus one isoform-biology paper that is not about this
  disease. There is no case series, no natural history study, no prevalence estimate,
  and no reported nerve conduction velocity values - which is why this entry carries
  no prevalence block and why several phenotypes are supported only by a
  group-level CMT definition rather than by CMTRID-specific observation. Those are
  marked with directness: INDIRECT rather than presented as established for this
  disease. The gait phenotype is supported only by the mouse and is graded
  MODEL_ORGANISM accordingly; per the KB's evidence policy this is not sufficient
  support for a human phenotype on its own, and it is retained because the
  corresponding human feature is implied by the CMT diagnosis in the same families
  rather than because the mouse establishes it.

  Named-entity-confusion check. Three collisions to watch. COX6A1 and COX6A2 are
  different genes - the second is the muscle-specific paralogue and is not associated
  with this disease. "CMTRID" abbreviates recessive intermediate D, not
  "CMT-related intermediate disease", and is distinct from CMTDID (dominant
  intermediate D). And PMID:26556829, cited here twice, is a paper about SPG11: it is
  cited for the CMT phenotype definition and for listing CMTRID/COX6A1 in its
  screening panel, not for any COX6A1 result.

  A nomenclature trap worth recording, because a deep-research report walked into it.
  The OpenScientist report generated for this entry cites PMID:7687470 in support of
  COX6A1 being "the ubiquitous/liver-type isoform". That paper is titled "Structural
  organization of the bovine gene for the heart/muscle isoform of cytochrome c oxidase
  subunit VIa" and calls that heart/muscle gene COX6A1 throughout - 1993 bovine
  nomenclature in which the numbering is the reverse of the modern human one, where
  COX6A1 is ubiquitous and COX6A2 is the heart/muscle isoform. The citation therefore
  supports the opposite of the claim it is attached to. PMID:7687470 is deliberately
  not cited in this entry; the isoform claim rests on PMID:20307258 and PMID:36961412,
  both of which use current nomenclature.

  Two further things the same report supplied that this entry could not use. It
  reports that the HPO annotation set for OMIM:616039 includes onion bulb formation
  (HP:0003400), which if correct would be the pathological basis for the intermediate
  classification and would largely answer the third knowledge gap below. It is not
  curated here because the claim's provenance is an HPO disease annotation, and this
  KB has no reference prefix that can cite one with a verifiable quote - there is no
  underlying PMID in the report to check it against. It also reports gnomAD constraint
  metrics for COX6A1 (pLI 0.0023, LOEUF 0.875) consistent with tolerated heterozygous
  loss of function, which is exactly what a recessive disease predicts; that is
  likewise uncitable here for want of a quotable source. If the founding paper's full
  text turns out to describe nerve pathology, the onion-bulb annotation becomes citable
  and would largely resolve the third knowledge gap below - worth revisiting then.

  One review suggestion deliberately not taken: neurotoxic-agent avoidance (vincristine
  and similar) is standard Charcot-Marie-Tooth guidance, but nothing about it is
  CMTRID-specific and no source ties it to this entity. Adding it would put
  group-level management advice in an entry whose whole discipline is separating what is
  known about this disease from what is known about the group.

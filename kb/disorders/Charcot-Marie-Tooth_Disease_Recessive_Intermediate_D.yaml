    snippet: quantitative RT-PCR assay detected the significantly reduced (<1/5 of controls; p < 0.001) expression of the normally spliced form of COX6A1 in peripheral white blood cells from two affected members of family 1
    explanation: Normally spliced RNA was quantified in fresh patient blood; this is a human-sample measurement, separate from the transformed cell assays.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4157141/

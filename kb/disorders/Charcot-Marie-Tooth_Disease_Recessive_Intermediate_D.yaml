name: Charcot-Marie-Tooth Disease Recessive Intermediate D
creation_date: "2026-08-29T17:10:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease recessive intermediate D (CMTRID) is an autosomal
  recessive peripheral neuropathy caused by biallelic variants in COX6A1, which
  encodes the ubiquitously expressed 6A isoform of mitochondrial respiratory complex
  IV (cytochrome c oxidase). It is one of the few CMT entities whose primary lesion
  is in oxidative phosphorylation rather than in myelin, axonal transport or the
  cytoskeleton, and MONDO places it under both the intermediate CMT and the
  mitochondrial oxidative phosphorylation disorder branches for that reason.

  The disease was mapped in two consanguineous Japanese families to a five-base
  deletion in the polypyrimidine tract of COX6A1 intron 2, which disrupts splicing of
  exon 3. Patients showed reduced COX6A1 expression in peripheral leukocytes and
  reduced cytochrome c oxidase activity in lymphoblastoid lines, and a Cox6a1-null
  mouse reproduced both the enzymatic defect and a neurogenic muscular atrophy with
  impaired walking. A second allelic mechanism has since been reported: a homozygous
  stop-loss variant extending the protein by 41 residues and reducing steady-state
  protein levels.

  Why a complex IV subunit defect should present as a peripheral neuropathy rather
  than as the encephalopathy or cardiomyopathy typical of COX deficiency is the
  mechanistically interesting question here, and the isoform biology offers a
  partial answer: mature cardiac and skeletal muscle switch from the ubiquitous
  COX6A1 to the muscle-specific COX6A2 isoform, so those tissues have a substitute
  that peripheral nerve does not. That is an inference from isoform expression data
  rather than something demonstrated in this disease, and it is recorded as such.

  The phenotype is not settled. The founding report described an axonal or mixed
  neuropathy, and the entity is nevertheless catalogued as "intermediate"; the most
  recent case adds global developmental delay, elevated lactate and death after a
  febrile decompensation at 3.5 years - a presentation that reads more like a
  mitochondrial disease with neuropathy than like CMT. Whether CMTRID names one
  disease or the neuropathic end of a broader COX6A1-related spectrum is an open
  nosological question, curated here as a knowledge gap rather than resolved.

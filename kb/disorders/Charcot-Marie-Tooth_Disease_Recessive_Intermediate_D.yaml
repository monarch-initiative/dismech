- name: Genetic Counseling
  therapeutic_modality: OTHER
  description: When both parents are carriers, each pregnancy has a 25% risk of an affected child. Family-specific variant identification enables carrier testing and reproductive counseling. Consanguinity is not required for the diagnosis.

- name: COX6A1-knockdown HEK293 cells
  experimental_model_type: CELL_LINE
  cell_source: Human embryonic kidney HEK293 cells with stable COX6A1 RNA interference
  publication: PMID:20307258
  description: Stable knockdown reduces holoenzyme and dimers, increases subcomplexes and lowers enzyme activity. Ectopic COX6A2 restores holoenzyme and activity.
  modeled_mechanisms:
  - target: Complex IV Biogenesis Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Subunit depletion disrupts assembled complex IV.
    limitations: Engineered non-neural cells do not establish assembly defects in either patient allele.
    evidence:
    - reference: PMID:20307258
      reference_title: Novel insights into the assembly and function of human nuclear-encoded cytochrome c oxidase subunits 4, 5a, 6a, 7a and 7b.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Knockdown of Cox4, Cox5a and Cox6a resulted in reduced CcO activity, diminished affinity of the residual enzyme for oxygen, decreased holoCcO and CcO dimer levels, increased accumulation of CcO subcomplexes and gave rise to an altered pattern of respiratory supercomplexes.
      explanation: COX6A1 knockdown in HEK293 cells supports an assembly mechanism; patient-allele assembly was not directly tested.
  - target: Possible COX6A2-Mediated Tissue Compensation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Forced COX6A2 expression rescues the deficient cells.
    limitations: Endogenous COX6A2 mRNA did not rise after knockdown; rescue does not demonstrate physiological compensation in patient muscle or nerve.
    evidence:
    - reference: PMID:20307258
      reference_title: Novel insights into the assembly and function of human nuclear-encoded cytochrome c oxidase subunits 4, 5a, 6a, 7a and 7b.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The ectopic expression of the heart/muscle-specific isoform of the Cox6 subunit (COX6A2) resulted in restoration of both CcO holoenzyme and activity in COX6A1-knockdown cells.
      explanation: Forced isoform substitution rescues an engineered cell model; this does not establish endogenous compensation in patient tissues.

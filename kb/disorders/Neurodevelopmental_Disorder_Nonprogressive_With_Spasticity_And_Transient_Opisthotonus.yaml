name: Neurodevelopmental Disorder Nonprogressive With Spasticity And Transient Opisthotonus
creation_date: "2026-11-20T14:20:00Z"
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic variants in
  TNR, which encodes tenascin-R, an extracellular matrix glycoprotein expressed only
  in the central nervous system and required for the assembly of the perineuronal nets
  that ensheath inhibitory interneurons. The core reported presentation is spastic
  para- or tetraparesis with axial muscular hypotonia, developmental delay, and an
  opisthotonus that begins in early infancy and later subsides; the course is
  nonprogressive, and affected individuals are frequently given a cerebral palsy
  label before a genetic diagnosis is reached. A 2026 sibling pair extends the
  spectrum downward to isolated dystonia and to a biallelic individual who was
  asymptomatic apart from adult-onset restless legs, so variable expressivity and
  reduced penetrance are part of the entity rather than exceptions to it.
category: Mendelian
synonyms:
- NEDSTO
- TNR-related neurodevelopmental disorder
disease_term:
  preferred_term: neurodevelopmental disorder, nonprogressive, with spasticity and transient opisthotonus
  term:
    id: MONDO:0859212
    label: neurodevelopmental disorder, nonprogressive, with spasticity and transient opisthotonus
parents:
- Neurodevelopmental Disorder
notes: >-
  Entry name. The descriptive MONDO/OMIM/ClinGen label is kept rather than a
  gene-related dyad. The entry-naming rule asks for a gene-related name only where
  one is established, and none of the five routes supplies one here: MONDO:0859212
  carries no synonyms at all (OLS, 2026-11-20), the ClinGen-preferred label is the
  same descriptive string, OMIM:619653 is the only xref besides MedGen and UMLS, and
  `just check-genereviews` reports NO_CHAPTER against the committed Bookshelf index
  (snapshot 2026-09-10), with no candidate or gene-scoped hit for TNR either.
  PMID:41233622 writes "TNR-related disease" once,
  in passing, which is a single use rather than recurring literature use; it is
  recorded in `synonyms` instead. The descriptive name is arguably now narrower than
  the entity, since PMID:41233622 reports biallelic individuals with neither
  spasticity nor opisthotonus, and that tension is recorded in the
  `variable_expressivity_vs_definitive_validity` discussion.

  Full text availability. PMID:32099069, the paper that established the gene, is
  cached abstract-only; `just fetch-reference PMID:32099069 --force` was run and the
  record still returns `content_type: abstract_only` with
  `full_text_declined: access_type:publisher_free`. Every quotation from it in this
  entry is therefore drawn from the structured abstract, and the deeper per-patient
  detail that paper carries is not curated here because it could not be verified. The
  same applies to PMID:28334938, which ClinGen counts as the third publication
  supporting this gene-disease pair: its abstract is a leukoencephalopathy cohort
  summary that does not name TNR anywhere, so no claim in this entry is sourced from
  it.

  TNR has no GO molecular function annotation. QuickGO returns zero
  molecular_function annotations for UniProtKB:Q92752 (checked 2026-11-20); the
  curated annotations are seven biological processes and eight cellular components,
  one of which is GO:0072534 perineuronal net. The variant node is therefore bound to
  GO:0005201 extracellular matrix structural constituent, read off the sources' own
  wording: PMID:32099069 calls tenascin-R "an extracellular matrix glycoprotein" and
  PMID:22730557 calls it "an important constituent of the perineural nets". Binding
  activities such as GO:0050839 cell adhesion molecule binding were considered and
  rejected: they are neither annotated to TNR nor what this node claims, which is the
  loss of a structural matrix component rather than the loss of a binding event.
review_notes: >-
  Deliberate omissions, so a later curator does not read them as oversights. No
  myelination mechanism node is curated. ClinGen records brain myelination anomalies
  as a phenotype, and PMID:22730557 states in its discussion that tenascin-R clusters
  around myelinated axons and nodes of Ranvier, but nothing in the verifiable sources
  connects the two, and the one patient whose MRI is described in full had normal
  myelination at three months. The phenotype is curated with a knowledge gap attached
  instead of an invented edge. Eleven of the seventeen phenotypes carry no explaining
  causal edge for the same reason: the mechanism by which a perineuronal net defect
  produces spasticity is explicitly a conjecture in the only source that offers one,
  and is curated as an EMERGING hypothesis rather than as a settled chain.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Biallelic TNR variants segregate as an autosomal recessive trait: the reported
    families include homozygous loss-of-function alleles in consanguineous pedigrees
    and compound heterozygous missense pairs, and heterozygous relatives are
    unaffected. Expressivity is variable within a sibship as well as between
    families. The 2026 report describes two siblings with the same compound
    heterozygous missense pair in which the brother had dystonia and the sister was
    asymptomatic apart from adult-onset restless legs, with normal development and
    intellect in both, and reads the whole published series as showing reduced
    penetrance.
  evidence:
  - reference: PMID:32099069
    reference_title: Loss of TNR causes a nonprogressive neurodevelopmental disorder with spasticity and transient opisthotonus.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We establish TNR as a disease gene for an autosomal recessive nonprogressive
      neurodevelopmental disorder with spasticity and transient opisthotonus and
      highlight the role of central nervous system extracellular matrix proteins in
      the pathogenicity of spastic disorders.
    explanation: >-
      The gene-establishing cohort states the mode of inheritance for this disorder
      directly.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents and the unaffected sister carried a single-copy deletion of the
      same region, consistent with the finding that the deletion in the proband was
      homozygous (figure 2).
    explanation: >-
      Segregation in the first reported family: three unaffected heterozygotes against
      one affected homozygote, which is the recessive pattern.
  - reference: PMID:41233622
    reference_title: Biallelic variants in TNR cause neurodevelopmental disorders with variable expressivity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 15 patients, including 13 previously reported patients, showed diverse
      phenotypic variability and severity, even among individuals sharing the same
      variants, indicating variable expressivity and reduced penetrance possibly
      influenced by genetic or environmental modifiers.
    explanation: >-
      Source for incomplete penetrance and variable expressivity, assessed across the
      whole published series rather than within one family.

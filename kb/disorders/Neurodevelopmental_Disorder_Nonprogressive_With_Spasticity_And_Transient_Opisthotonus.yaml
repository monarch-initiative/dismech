      label: long-term synaptic potentiation
  evidence:
  - reference: PMID:12882316
    reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, a two-way active avoidance test (shuttle box) revealed a severe
      deficit in associative learning in TN-R-deficient mice.
    explanation: >-
      The behavioural correlate of the plasticity deficit, measured in the null mouse.
  - reference: PMID:12882316
    reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results support important functions of TN-R in vivo in the central nervous
      system, in particular in the cerebellum and the hippocampus.
    explanation: >-
      The authors' localization of the deficit to the hippocampus and cerebellum, which
      is what this node's name claims.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A plasticity deficit of this kind is the mechanism the first reported case
      invokes for the patient's broad developmental delay. The inference runs from
      rodent slice physiology to a human developmental outcome and is not directly
      demonstrated.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The global developmental delay observed in our patient with the homozygous TNR
        deletion is consistent with a broad dysfunction of learning and memory.

animal_models:
- name: Tenascin-R-deficient (Tnr-null) mouse
  species: Mouse
  genotype: Tnr homozygous null
  publication: PMID:12882316
  genes:
  - preferred_term: Tnr
    term:
      id: MGI:99516
      label: Tnr
  description: >-
    The constitutive tenascin-R knockout mouse, which is the system behind the
    experimental support ClinGen counts for this gene-disease relationship. It is
    viable and fertile, reproduces the perineuronal net defect and the
    learning/plasticity deficits, and does not reproduce the spasticity or the
    opisthotonus that define the human disorder.
  associated_phenotypes:
  - Compromised motor coordination on the rota-rod, read by the authors as a cerebellar deficit
  - Severe associative-learning deficit in two-way active avoidance
  - Abnormal spatial-navigation strategy in the Morris water maze
  modeled_mechanisms:
  - target: Defective Perineuronal Net Assembly around Inhibitory Interneurons
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The net defect is the mechanism this model establishes. Nets form on schedule but
      are histologically abnormal in the adult, with matrix accumulating at the soma
      and dendrites sparsely covered.
    limitations: >-
      The defect is characterized in hippocampus and forebrain; nothing is reported for
      the spinal and basal ganglia circuits the human motor phenotype would implicate.
    readouts:
    - name: Histological appearance of perineuronal nets in adult brain
      target: Defective Perineuronal Net Assembly around Inhibitory Interneurons
      direction: ALTERED
      interpretation: >-
        Structural rather than quantitative. The nets are present and appear on time,
        but are wrongly distributed.
      evidence:
      - reference: PMID:25225104
        reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: However, the histological appearance of PNs is abnormal in adult tn-r(-/-) mice.
        explanation: The measurement behind this readout.
    - name: Dendritic perineuronal net formation after tenascin-R protein application
      target: Defective Perineuronal Net Assembly around Inhibitory Interneurons
      direction: RESTORED
      interpretation: >-
        A rescue arm. Adding back the protein improves dendritic net formation in
        culture, which is what makes the defect attributable to tenascin-R itself
        rather than to a secondary consequence of the null background.
      evidence:
      - reference: PMID:25225104
        reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: >-
          However, formation of dendritic PNs in cultures was improved by the
          application of tenascin-R protein and rescued by polyclonal antibodies to
          aggrecan and a bivalent, but not monovalent form of the lectin Wisteria
          floribunda agglutinin.
        explanation: >-
          The rescue result. Note the source says "improved" for the protein arm and
          reserves "rescued" for the antibody and lectin arms.
    evidence:
    - reference: PMID:25225104
      reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results show that tenascin-R and aggrecan are decisive contributors to
        formation and stabilization of PNs and that tenascin-R may implement these
        functions by clustering of aggrecan.
      explanation: Supports treating this model as informative for the perineuronal net node.
  - target: Impaired Hippocampal Synaptic Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Hippocampal long-term potentiation is defective in slices from null animals, and
      the whole animal shows a severe associative-learning deficit and an abnormal
      spatial-navigation strategy.
    limitations: >-
      The plasticity measurements are rodent hippocampal slice physiology; there is no
      human counterpart, and the first reported patient's cognitive phenotype was
      linked to them only by inference.
    readouts:
    - name: Two-way active avoidance learning
      target: Impaired Hippocampal Synaptic Plasticity
      direction: DECREASED
      interpretation: Behavioural readout of the associative-learning deficit.
      evidence:
      - reference: PMID:12882316
        reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, a two-way active avoidance test (shuttle box) revealed a severe
          deficit in associative learning in TN-R-deficient mice.
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        In vitro assays of TNR-null hippocampal slices indicate impaired synaptic
        plasticity with significant defects of long-term potentiation that may underlie
        the observed impairment in learning and memory.
      explanation: Supports treating this model as informative for the plasticity node.
  - target: Loss of Perineuronal Inhibitory Control of Motor Circuits
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not reproduce the motor phenotype this node is proposed to
      explain. Reflexes and motor capability are reported as normal apart from a
      rota-rod coordination deficit read as cerebellar, and the opisthotonic posturing
      and choreoathetosis seen in patients have not been described in any animal model.
    limitations: >-
      This is the central translational limit of the model. The only published
      mechanism for the human motor phenotype cannot be tested in the system that
      carries all the other experimental support for the gene, so the hypothesis
      remains EMERGING rather than being either confirmed or discarded.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: INVALIDATING
      description: >-
        A mouse can be spastic, hyperreflexic and dystonic, so nothing about the
        species prevents these features; the null animal simply does not show them. Its
        reflexes and motor capability are reported as normal apart from rota-rod
        incoordination, and the human opisthotonus and choreoathetosis are absent from
        the model literature entirely. This is incompleteness, not a structural species
        mismatch.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Every patient allele other than the whole-gene deletion is a missense,
        frameshift or nonsense change at a specific position, whereas the model is a
        constitutive whole-gene null. The reported within-sibship discordance for one
        missense pair suggests allele-specific and modifier effects that a single null
        genotype cannot represent.
    readouts:
    - name: Reflexes and gross motor capability
      target: Loss of Perineuronal Inhibitory Control of Motor Circuits
      direction: UNCHANGED
      interpretation: >-
        A negative result, recorded as such. The motor examination that would show
        spasticity or hyperreflexia was normal in the null mouse.
      evidence:
      - reference: PMID:12882316
        reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
        supports: REFUTE
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: The general state, gross sensory functions, reflexes and motoric capabilities appeared normal.
        explanation: >-
          Refutes the claim that this model reproduces the human motor phenotype, which
          is what a FAILS_TO_RECAPITULATE link asserts.
    evidence:
    - reference: PMID:12882316
      reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: The general state, gross sensory functions, reflexes and motoric capabilities appeared normal.
      explanation: >-
        The substantiation the negative claim requires: the motor phenotype is absent on
        direct examination of the null animal.
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: REFUTE
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the opisthotonic posturing and choreaoathetosis observed in our
        patient have not been described in animal models, it is conceivable that they
        may be related to deficits in perineural inhibition, especially at the level of
        the spinal cord and basal ganglia.
      explanation: >-
        The clinicians' own statement that the hyperkinetic features are absent from
        animal models, made while proposing the mechanism those models would be used to
        test.
  notes: >-
    The rota-rod deficit is recorded in `associated_phenotypes` as free text rather
    than bound to an HPO term. No HPO term names rodent rota-rod performance, and
    binding the nearest human sign would assert a patient phenotype that no source
    reports.

    A second line bears on this model's interpretation. A quadruple extracellular
    matrix knockout (brevican, neurocan, tenascin-C, tenascin-R) shows severe fear
    memory impairment with reduced perineuronal net density, while the single tenascin
    knockouts behave normally on the same task, which indicates redundancy among matrix
    molecules for at least some net-dependent functions.
  evidence:
  - reference: PMID:12882316
    reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, motor coordination on the rota-rod was compromised in these mice,
      indicating a deficit in cerebellar functions.
    explanation: >-
      The one motor abnormality reported in the null mouse, and the authors'
      localization of it.
  - reference: PMID:39953103
    reference_title: Combined loss of brevican, neurocan, tenascin-C and tenascin-R leads to impaired fear retrieval due to perineuronal net loss.
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: In contrast, tenascin single KOs showed intact fear behavior and memory compared to their control groups.
    explanation: >-
      A negative result for the single Tnr knockout on a net-dependent behavioural task,
      which bounds how much of the human phenotype this model can be expected to show.
  - reference: PMID:15034584
    reference_title: Tenascin-R mediates activity-dependent recruitment of neuroblasts in the adult mouse forebrain.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we report that the extracellular matrix glycoprotein tenascin-R, expressed
      in the adult mouse olfactory bulb, initiates both the detachment of neuroblasts
      from chains and their radial migration.
    explanation: >-
      One of the model-system publications ClinGen counts toward this gene-disease
      relationship. It establishes a migration role for tenascin-R in the adult mouse
      brain; no human phenotype in this entry is attributed to it.
discussions:
- discussion_id: tnr_null_mouse_lacks_the_motor_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  posed_by: "dismech curation (claim issue 18543)"
  posed_date: "2026-11-20T00:00:00Z"
  attaches_to:
  - pathophysiology#Loss of Perineuronal Inhibitory Control of Motor Circuits
  - animal_models#Mouse
  prompt: >-
    Does the tenascin-R-null mouse's failure to show spasticity, hyperreflexia or
    opisthotonus mean that the perineuronal net defect is not the route to the human
    motor phenotype, or that the mouse does not express the relevant circuit
    dependence?
  rationale: >-
    The mismatch is sharp and sits exactly where the disorder is defined. The null
    mouse reproduces the perineuronal net defect well and the plasticity and learning
    deficits convincingly, and ClinGen's experimental support for the gene rests on
    it. What it does not reproduce is the phenotype the disease is named for. Reflexes
    and motor capability are reported as normal, and the clinicians who proposed the
    inhibitory-failure mechanism noted in the same sentence that the hyperkinetic
    features have never been described in an animal model. So the one branch of the
    pathograph that reaches the defining features is also the one branch the model
    cannot test. The mismatch is mechanistically meaningful rather than cosmetic,
    because the proposed circuits are spinal and basal ganglia, while every reported
    net measurement in the model is hippocampal or forebrain.
  evidence:
  - reference: PMID:12882316
    reference_title: Severe cognitive and motor coordination deficits in tenascin-R-deficient mice.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: The general state, gross sensory functions, reflexes and motoric capabilities appeared normal.
    explanation: The absence of the human motor phenotype in the model, on direct examination.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the opisthotonic posturing and choreaoathetosis observed in our patient
      have not been described in animal models, it is conceivable that they may be
      related to deficits in perineural inhibition, especially at the level of the
      spinal cord and basal ganglia.
    explanation: States the mismatch and the untested hypothesis in one sentence.
- discussion_id: perineuronal_net_to_spasticity_step_unmeasured
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation (claim issue 18543)"
  posed_date: "2026-11-20T00:00:00Z"
  attaches_to:
  - pathophysiology#Loss of Perineuronal Inhibitory Control of Motor Circuits
  - phenotypes#Spastic tetraparesis
  prompt: >-
    Has perineuronal net integrity, or perineuronal-net-dependent inhibition, ever been
    measured in spinal cord or basal ganglia in a tenascin-R-deficient human or animal?
  rationale: >-
    Every net measurement available in the verifiable sources is hippocampal or
    forebrain, from culture, organotypic slice or adult brain histology. The mechanism
    proposed for the motor phenotype locates the defect in spinal cord and basal
    ganglia, and no measurement in either site is reported. Until one exists, the motor
    branch of this pathograph is an argument from anatomy rather than a measured chain,
    which is why its edges are typed as indirect with unknown intermediates and carry a
    hypothesis group.
  evidence:
  - reference: PMID:25225104
    reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we investigated whether similar defects are also seen in dissociated and
      organotypic cultures from hippocampus and forebrain of tn-r(-/-) mice and whether
      the structure of PNs could be normalized.
    explanation: >-
      Names the sites the net defect has been studied in, which are not the sites the
      motor hypothesis implicates.
- discussion_id: myelination_anomaly_mechanism_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation (claim issue 18543)"
  posed_date: "2026-11-20T00:00:00Z"
  attaches_to:
  - phenotypes#Abnormal myelination
  prompt: >-
    How do biallelic TNR variants produce the brain myelination anomalies ClinGen
    records, and how often are they present?
  rationale: >-
    The ingredients of a mechanism are present but unconnected. Tenascin-R is made by
    oligodendrocytes and their precursors and clusters around myelinated axons and
    nodes of Ranvier; the cohort paper lists myelination among the protein's functions;
    ClinGen records myelination anomalies as a phenotype. Nothing links them in a
    reported observation, and the one patient whose MRI is described in detail had
    normal myelination at three months despite being a complete TNR-null. No mechanism
    node is curated for this branch on purpose. Resolving it needs the per-patient
    imaging in PMID:32099069, whose full text could not be retrieved.
  evidence:
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is produced abundantly by oligodendrocytes and their precursors, and clusters
      around myelinated axons, particularly around nodes of Ranvier.
    explanation: The anatomical premise for a myelination mechanism that has not been demonstrated.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Head and cervical spine MRI at 3 months of age revealed mild hypoplasia of the
      inferior cerebellar vermis, but otherwise normal structure and myelination.
    explanation: >-
      The counterobservation that keeps this a gap rather than a curated mechanism, a
      null patient with normal myelination.
- discussion_id: variable_expressivity_vs_definitive_validity
  kind: CONTROVERSY
  status: OPEN
  posed_by: "dismech curation (claim issue 18543)"
  posed_date: "2026-11-20T00:00:00Z"
  attaches_to:
  - disease#Neurodevelopmental Disorder Nonprogressive With Spasticity And Transient Opisthotonus
  - genetic#TNR
  prompt: >-
    Is the entity defined by its spasticity-and-opisthotonus phenotype, or by the
    genotype, now that a biallelic individual has been reported who is asymptomatic
    apart from adult-onset restless legs?
  notes: >-
    This is a question about the scope of the entry, not a doubt about the gene. The
    ClinGen Definitive classification stands; what is in question is whether the
    disease name still describes everyone who has the genotype.
  rationale: >-
    The ClinGen Cerebral Palsy Gene Curation Expert Panel classified TNR for this
    disease as Definitive on 2 January 2025, over sixteen probands in three
    publications. PMID:41233622 then reported two Japanese siblings sharing a compound
    heterozygous missense pair in which one had dystonia alone and the other was
    asymptomatic apart from adult-onset restless legs, with normal development and
    intellect in both, and concluded across the whole published series of fifteen that
    there is variable expressivity and reduced penetrance. Both things are true at
    once. The gene-disease relationship is well established, and the phenotype label
    the relationship is filed under does not fit part of the reported series. Three
    consequences are curated rather than left implicit. The entry keeps the descriptive
    name, since no gene-related name is established. The inheritance block records
    penetrance as incomplete on the strength of the 2026 series rather than complete on
    the strength of the cohort. And the ClinGen assertion carries a note that it
    predates the asymptomatic case. Whether ClinGen revisits the classification, or the
    field moves to a gene-defined label, is not something this entry should pre-empt.
  evidence:
  - reference: CGGV:assertion_fe529d03-c7e4-4638-8ce5-de4400a34fb0-2025-01-02T170000.000Z
    reference_title: TNR / neurodevelopmental disorder, nonprogressive, with spasticity and transient opisthotonus (Definitive)
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      In summary, there is definitive evidence supporting the relationship between TNR
      and autosomal recessive NEDSTO.
    explanation: >-
      One side of the tension, the classification as it currently stands.
  - reference: PMID:41233622
    reference_title: Biallelic variants in TNR cause neurodevelopmental disorders with variable expressivity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 15 patients, including 13 previously reported patients, showed diverse
      phenotypic variability and severity, even among individuals sharing the same
      variants, indicating variable expressivity and reduced penetrance possibly
      influenced by genetic or environmental modifiers.
    explanation: >-
      The other side, reduced penetrance and variable expressivity assessed across the
      whole series, after the classification date.
  - reference: PMID:41233622
    reference_title: Biallelic variants in TNR cause neurodevelopmental disorders with variable expressivity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Their development and intellect were normal.
    explanation: >-
      The specific observation that strains the disease label, biallelic siblings with
      normal development and intellect.

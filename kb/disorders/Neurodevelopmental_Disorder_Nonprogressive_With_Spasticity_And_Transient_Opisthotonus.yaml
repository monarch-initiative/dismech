    timing, could not be retrieved.
- phase: Childhood onward
  description: >-
    Nonprogressive. The persisting spasticity, hypotonia and developmental delay do
    not worsen over time, which is the feature that distinguishes the disorder from a
    leukodystrophy or a hereditary spastic paraplegia and is carried in its name.
  evidence:
  - reference: PMID:32099069
    reference_title: Loss of TNR causes a nonprogressive neurodevelopmental disorder with spasticity and transient opisthotonus.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We establish TNR as a disease gene for an autosomal recessive nonprogressive
      neurodevelopmental disorder with spasticity and transient opisthotonus and
      highlight the role of central nervous system extracellular matrix proteins in
      the pathogenicity of spastic disorders.
    explanation: >-
      The cohort's conclusion, which states the nonprogressive course as part of the
      entity definition.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-

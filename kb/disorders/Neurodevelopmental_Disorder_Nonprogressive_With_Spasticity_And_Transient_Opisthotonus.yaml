      knowledge rather than its own result, hence the BACKGROUND quote role.
  downstream:
  - target: Tenascin-R Deficiency in the Central Nervous System Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Biallelic loss-of-function alleles leave no functional tenascin-R to be secreted
      into the central nervous system matrix.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The homozygous deletion of the protein-coding regions of TNR would result in
        the lack of a functional TNR protein.
      explanation: >-

- name: Tenascin-R Deficiency in the Central Nervous System Extracellular Matrix
  node_class: PROTEIN_ABUNDANCE_LOSS
  biological_scale: MOLECULAR
  description: >-
    Absence or functional loss of tenascin-R from the extracellular matrix of the
    central nervous system. The deficit is confined to the central nervous system
    because tenascin-R is expressed nowhere else, and it is most consequential after
    birth, when the protein's expression peaks and perineuronal nets are being built.
    Oligodendrocytes and their precursors are the principal source.
  cellular_components:
  - preferred_term: central nervous system extracellular matrix
    modifier: DECREASED
    term:
      id: GO:0031012
      label: extracellular matrix
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:32099069
    reference_title: Loss of TNR causes a nonprogressive neurodevelopmental disorder with spasticity and transient opisthotonus.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tenascin-R is exclusively expressed in the central nervous system with highest
      expression after birth.
    explanation: >-
      Establishes that the deficit is restricted to the central nervous system and
      that its timing is postnatal, which is why this is a neurodevelopmental disorder
      with infantile onset.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is produced abundantly by oligodendrocytes and their precursors, and clusters
      around myelinated axons, particularly around nodes of Ranvier.
    explanation: >-
      Source for the oligodendrocyte binding on this node. Quoted from the case
      report's discussion, where it restates established cell biology rather than the
      report's own finding.
  - reference: PMID:8626505
    reference_title: "Human tenascin-R. Complete primary structure, pre-mRNA alternative splicing and gene localization on chromosome 1q23-q24."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We have established the primary structure of human tenascin-R (TN-R), a
      component of the extracellular matrix of the central nervous system, by
      sequencing cDNA clones which cover its complete coding region.
    explanation: >-
      One of the expression-level publications ClinGen counts toward this gene-disease
      relationship; identifies the human protein as a central nervous system matrix
      component.
  downstream:
  - target: Defective Perineuronal Net Assembly around Inhibitory Interneurons
    causal_link_type: DIRECT
    description: >-
      Tenascin-R cross-links aggrecan in the perineuronal net, so its absence leaves
      the net structurally abnormal even though the net still forms on schedule.
    evidence:
    - reference: PMID:25225104
      reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results show that tenascin-R and aggrecan are decisive contributors to
        formation and stabilization of PNs and that tenascin-R may implement these
        functions by clustering of aggrecan.
      explanation: >-
        The mechanistic step: tenascin-R is required for net assembly, and the proposed
        means is aggrecan clustering.
    - reference: PMID:32099069
      reference_title: Loss of TNR causes a nonprogressive neurodevelopmental disorder with spasticity and transient opisthotonus.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: The protein is crucial in the formation of perineuronal nets that ensheath interneurons.
      explanation: >-
        The gene-establishing paper's own framing of the step, graded OTHER because the
        sentence names no study system.
- name: Defective Perineuronal Net Assembly around Inhibitory Interneurons
  node_class: CELLULAR_EFFECT
  biological_scale: CELLULAR
  description: >-
    Perineuronal nets still appear on the normal developmental schedule in
    tenascin-R-deficient animals, but their architecture is wrong: matrix accumulates
    on the soma while dendritic coverage is sparse, and the nets around
    parvalbumin-expressing GABAergic interneurons are markedly underdeveloped. The
    claim curated here is a structural and distributional defect in the net, not a
    failure of the net to form at all.
  cellular_components:
  - preferred_term: perineuronal net
    modifier: DECREASED
    term:
      id: GO:0072534
      label: perineuronal net
  biological_processes:
  - preferred_term: perineuronal net extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  cell_types:
  - preferred_term: parvalbumin-expressing GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
  - preferred_term: inhibitory interneuron
    term:
      id: CL:0000498
      label: inhibitory interneuron
  evidence:
  - reference: PMID:25225104
    reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: However, the histological appearance of PNs is abnormal in adult tn-r(-/-) mice.
    explanation: The structural defect in vivo, in the tenascin-R-null mouse.
  - reference: PMID:25225104
    reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In tn-r(-/-) cultures, accumulations of several extracellular matrix molecules
      were mostly associated with somata, whereas dendrites were sparsely covered,
      compared with tn-r(+/+) mice.
    explanation: >-
      The specific form of the defect, and the reason this node is curated as
      mislocalized rather than absent matrix.
  - reference: PMID:25225104
    reference_title: Tenascin-R promotes assembly of the extracellular matrix of perineuronal nets via clustering of aggrecan.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Perineuronal nets (PNs) in the brains of tenascin-R-deficient (tn-r(-/-)) mice
      develop in temporal concordance with those of wild-type (tn-r(+/+)) mice.
    explanation: >-
      The timing control. Quoted because it bounds the claim: the defect is not a delay
      in net formation, which is what this node would otherwise be read as asserting.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Although gross anatomy and histology are normal, perineuronal nets associated
      with parvalbumin-expressing GABAergic neurons, which have a role in the
      regulation of interneuronal excitability, are significantly less developed.
    explanation: >-
      Source for the parvalbumin-expressing GABAergic interneuron binding, and for the
      contrast between normal gross neuroanatomy and a specific net defect. Reviewed in
      the case report's discussion rather than measured there.
  downstream:
  - target: Impaired Hippocampal Synaptic Plasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hippocampal slices from tenascin-R-null animals show defective long-term
      potentiation. The steps between an abnormal perineuronal net and the plasticity
      deficit are not established.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        In vitro assays of TNR-null hippocampal slices indicate impaired synaptic
        plasticity with significant defects of long-term potentiation that may underlie
        the observed impairment in learning and memory.
      explanation: >-
        Reports the plasticity deficit in the null model. The source's own "may
        underlie" is why this edge is not curated as DIRECT.
  - target: Loss of Perineuronal Inhibitory Control of Motor Circuits
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - perineuronal_inhibitory_failure
    description: >-
      A conjectured step, not an established one: that the net defect reduces
      perineuronal inhibition at the level of the spinal cord and basal ganglia. The
      only source that proposes it says so in conditional terms.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the opisthotonic posturing and choreaoathetosis observed in our
        patient have not been described in animal models, it is conceivable that they
        may be related to deficits in perineural inhibition, especially at the level of
        the spinal cord and basal ganglia.
      explanation: >-
        The only published mechanistic proposal for the motor phenotype. It is
        explicitly a conjecture, and it also records that the animal model does not show
        these features, which is why this branch is a hypothesis group.
- name: Impaired Hippocampal Synaptic Plasticity
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  biological_scale: CELLULAR
  description: >-
    Defective long-term potentiation in hippocampal slices lacking tenascin-R, with
    corresponding associative-learning and spatial-representation deficits in the

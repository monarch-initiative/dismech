- name: Loss of Perineuronal Inhibitory Control of Motor Circuits
  node_class: NEURAL_CIRCUIT_AND_NETWORK_DYSFUNCTION
  biological_scale: TISSUE
  description: >-
    A proposed failure of perineuronal-net-dependent inhibition in spinal and basal
    ganglia motor circuits, offered as the explanation for the spasticity and the
    transient hyperkinetic features. This node exists to carry a hypothesis, not a
    finding: no measurement of inhibitory control in these circuits has been reported
    in a tenascin-R-deficient human or animal.
  evidence:
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient's phenotype was characterised by global developmental delay,
      cognitive deficit, transient hyperkinetic movement disorder (opisthotonic
      posturing and choreoathetosis), central hypotonia and peripheral spasticity.
    explanation: >-
      The clinical pattern this hypothesized node is meant to explain, stated by the
      report that proposes the mechanism.
  downstream:

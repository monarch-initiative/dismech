  - reference: CGGV:assertion_fe529d03-c7e4-4638-8ce5-de4400a34fb0-2025-01-02T170000.000Z
    reference_title: TNR / neurodevelopmental disorder, nonprogressive, with spasticity and transient opisthotonus (Definitive)
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Ten variants (missense, frameshift, nonsense, large deletion) that have been
      reported in 16 probands in 3 publications (PMIDs: 22730557, 28334938, 32099069)
      are included in this curation.
    explanation: Source for the reported allele classes and the proband count.
  variants:
  - name: 1q25.1 homozygous deletion encompassing TNR
    variant_type: copy number variation
    clinical_significance: PATHOGENIC
    description: >-
      An approximately 394 kb two-copy loss at 1q25.1 removing all protein-coding
      exons of TNR, in the first reported patient. The interval also removes the
      untranslated portion of the neighbouring gene KIAA0040, which the authors argue
      is unlikely to contribute because that gene is barely expressed in the central
      nervous system.
    evidence:
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Array genomic hybridisation revealed a homozygous deletion involving only two
        genes, including TNR.
      explanation: Identifies the allele and its extent.
    - reference: PMID:22730557
      reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the deletion in our proband contained in addition to TNR, part of a
        second gene, KIAA0040, the deletion of TNR is most likely responsible for the
        phenotype.
      explanation: >-
        The authors' attribution of the phenotype to TNR rather than to the co-deleted
        gene, which is the reason this allele can be read as a TNR-null.
  - name: p.(Asp595Asn)
    variant_type: single nucleotide variant
    description: >-
      One of a novel compound heterozygous missense pair reported in two Japanese
      siblings, in trans with p.(Arg1256Cys).
    evidence:
    - reference: PMID:41233622
      reference_title: Biallelic variants in TNR cause neurodevelopmental disorders with variable expressivity.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we describe two Japanese siblings sharing novel compound heterozygous TNR
        missense variants ... identified by exome and Sanger sequencing.
      explanation: >-
        Reports the variant pair and the sequencing method that found it. The HGVS
        string the source prints between these two clauses is bridged with the
        validator's ellipsis form, because bracketed spans are stripped before
        matching; it reads
        NM_003285.3:c.[1783 G greater than A];[3766 C greater than T]
        p.[(Asp595Asn)];[(Arg1256Cys)] in the source, and each allele is named in the
        `name` of its own variant record rather than being carried inside the quote.
  - name: p.(Arg1256Cys)
    variant_type: single nucleotide variant
    description: >-
      The second allele of the compound heterozygous pair in the reported Japanese
      sibship, in trans with p.(Asp595Asn). The two siblings carry the same pair and
      differ markedly in phenotype.
    evidence:
    - reference: PMID:41233622
      reference_title: Biallelic variants in TNR cause neurodevelopmental disorders with variable expressivity.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The elder brother had dystonia, while the younger sister was asymptomatic
        except for adult-onset restless legs syndrome.
      explanation: >-
        The within-sibship discordance for this allele pair, which is the basis of the
        reduced-penetrance claim.

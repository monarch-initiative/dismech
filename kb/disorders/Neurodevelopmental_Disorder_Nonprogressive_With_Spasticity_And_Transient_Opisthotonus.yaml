mechanistic_hypotheses:
- hypothesis_group_id: perineuronal_inhibitory_failure
  hypothesis_label: Perineuronal net failure reduces inhibitory control in spinal and basal ganglia motor circuits
  status: EMERGING
  description: >-
    The proposal that the spasticity and the transient hyperkinetic features of this
    disorder follow from loss of perineuronal-net-dependent inhibition in spinal cord
    and basal ganglia circuits. It is the only mechanism published for the motor
    phenotype, it was advanced as a conjecture in the first case report, and it has
    not been tested: the tenascin-R-null mouse, which is the obvious test system, does
    not reproduce either feature.
  evidence:
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the opisthotonic posturing and choreaoathetosis observed in our patient
      have not been described in animal models, it is conceivable that they may be
      related to deficits in perineural inhibition, especially at the level of the
      spinal cord and basal ganglia.
    explanation: The origin and the exact strength of the hypothesis.
  - reference: PMID:22730557
    reference_title: Homozygous deletion of Tenascin-R in a patient with intellectual disability.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Although gross anatomy and histology are normal, perineuronal nets associated
      with parvalbumin-expressing GABAergic neurons, which have a role in the
      regulation of interneuronal excitability, are significantly less developed.
    explanation: >-
      The premise the hypothesis rests on: the nets whose loss is proposed to
      disinhibit motor circuits are those of interneurons that regulate excitability.

      snippet: "More than 90% of bladder carcinomas are classified as urothelial carcinoma (UC), which arise from the urothelium."
      explanation: Establishes urothelial carcinoma as an epithelial malignancy of the urinary tract managed within oncology, which encompasses the FGFR-altered molecular subset.
has_subtypes:
- name: FGFR3-Mutant Urothelial Carcinoma
  description: >-
    Most common FGFR alteration class in urothelial carcinoma, driven by somatic
    activating point mutations in FGFR3 (including S249C, Y373C, R248C, and
    G370C) that induce aberrant disulfide-mediated or transmembrane receptor
    dimerization and constitutive kinase signaling.
- name: FGFR2/3-Fusion Positive Urothelial Carcinoma
  description: >-
    Urothelial carcinomas harboring somatic oncogenic rearrangements of FGFR3 or
    FGFR2 (most frequently FGFR3-TACC3), in which fusion partner oligomerization
    domains drive constitutive kinase trans-phosphorylation and downstream MAPK
    and PI3K-AKT signaling.
pathophysiology:
- name: FGFR3 Constitutive Activation
  description: >-
    Somatic activating point mutations in FGFR3 (most commonly extracellular
    cysteine substitutions such as S249C, R248C, and Y373C) create intermolecular
    disulfide bonds that drive ligand-independent receptor dimerization and
    constitutive receptor tyrosine kinase phosphorylation in urothelial cells of
    the bladder and upper urinary tract.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"

animal_models:
- name: UPFL murine FGFR3-S249C/Trp53-R270H bladder cancer model
  species: Mus musculus
  genotype: "Upk3a-CreERT2; Trp53LSL-R270H/+; Col1a1-LSL-FGFR3S249C/+; Rosa26LSL-Luc/+"
  category: Genetically engineered conditional knock-in mouse model
  publication: DOI:10.1172/jci169241
  description: >-
    Tamoxifen-inducible urothelial mouse model co-expressing human FGFR3 S249C
    and murine Trp53 R270H in Upk3a-positive urothelial cells, producing
    autochthonous papillary high-grade non-muscle-invasive bladder and upper
    tract urothelial tumors with luminal-papillary (LumP / UROMOL class 1)
    transcriptomes. Syngeneic UPFL1 allografts are sensitive to erdafitinib and
    exhibit Treg-associated hyperprogression on single-agent anti-PD-1 that is
    reversed by combined erdafitinib plus anti-PD-1 blockade.
  genes:
  - preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  modeled_mechanisms:
  - target: FGFR3 Constitutive Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Conditional knock-in of human hotspot FGFR3 S249C in adult Upk3a+
      urothelium drives luminal transcriptional programming and erdafitinib
      sensitivity.
    evidence:
    - reference: DOI:10.1172/jci169241
      reference_title: "FGFR inhibition augments anti–PD-1 efficacy in murine FGFR3-mutant bladder cancer by abrogating immunosuppression"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this work, we report a mouse model (UPFL) that demonstrates cooperativity between the activating hotspotFGFRS249Cmutation and theTrp53R270Hmutation, to reliably produce high-grade NMIBC when expressed in uroplakin 3a–expressing (Upk3a-expressing) cells."
      explanation: Establishes the conditional human FGFR3 S249C knock-in mouse model of FGFR3-driven urothelial tumorigenesis.
  - target: Uncontrolled Urothelial Cell Proliferation and Tumor Growth
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      UPFL mice form papillary luminal-papillary bladder and upper tract tumors,
      and syngeneic UPFL1 tumors shrink on erdafitinib and show synergistic
      tumor control when erdafitinib abrogates anti-PD-1-induced regulatory
      T-cell expansion.
    evidence:
    - reference: DOI:10.1172/jci169241
      reference_title: "FGFR inhibition augments anti–PD-1 efficacy in murine FGFR3-mutant bladder cancer by abrogating immunosuppression"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In aggregate, our work establishes that dualFGFR3andTrp53alteration initiates high-grade, non–muscle-invasive, autochthonous murine bladder tumors with an intermediate T cell–inflamed phenotype and that erdafitinib cooperates with PD-1 checkpoint blockade to reverse anti–PD-1–induced Treg expansion and to block progression."
      explanation: Demonstrates autochthonous FGFR3-driven urothelial tumor formation and cooperative tumor growth suppression by erdafitinib plus PD-1 blockade.
  evidence:
  - reference: DOI:10.1172/jci169241
    reference_title: "FGFR inhibition augments anti–PD-1 efficacy in murine FGFR3-mutant bladder cancer by abrogating immunosuppression"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recapitulating human disease,UPFLtumors are papillary in histology and transcriptionally similar to both UROMOL class 1 and consensus LumP molecular subtypes (11,16)."
    explanation: Confirms histological and transcriptomic fidelity of the UPFL mouse model to human luminal-papillary FGFR3-mutant urothelial carcinoma.

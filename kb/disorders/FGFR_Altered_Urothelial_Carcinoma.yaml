- name: On-Target Secondary FGFR3 Kinase-Domain Mutation
  description: >-
    Under selective pressure from FGFR tyrosine kinase inhibition with
    erdafitinib, urothelial carcinomas acquire second-site kinase-domain
    mutations in FGFR3 that sterically or conformationally impair inhibitor
    binding and restore receptor tyrosine kinase phosphorylation alongside
    downstream MAPK and PI3K-AKT signaling.

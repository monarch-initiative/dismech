  - reference: DOI:10.37349/etat.2024.00240
    reference_title: "Landscape of targeted therapies for advanced urothelial carcinoma"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Erdafitinib (JNJ42756493), targeting the RTK family of FGF, is the first FDA-approved targeted therapy for aUC patients who have received platinum-based chemotherapy and have activating FGFR2 or FGFR3 mutations or fusions [27]."
    explanation: Confirms activating FGFR2 fusions/mutations as part of the molecularly defined target population for FGFR-directed therapy in advanced urothelial carcinoma.
treatments:
- name: Erdafitinib
  description: >-
    Selective pan-FGFR1-4 small-molecule tyrosine kinase inhibitor approved for
    locally advanced or metastatic urothelial carcinoma with susceptible FGFR3 or
    FGFR2 genetic alterations following prior systemic therapy, achieving a 40%
    confirmed response rate in BLC2001 and significantly prolonging overall
    survival over chemotherapy in phase 3 THOR Cohort 1 (median 12.1 vs 7.8
    months). On-target hyperphosphatemia from renal FGFR1 inhibition is the most
    common treatment-related adverse event (77% in BLC2001) and guides
    pharmacodynamic dose titration alongside stomatitis, diarrhea, and central
    serous retinopathy monitoring.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erdafitinib
      term:
        id: NCIT:C103273
        label: Erdafitinib
  target_mechanisms:
  - target: FGFR3 Constitutive Activation
    treatment_effect: INHIBITS
    description: Erdafitinib competitively inhibits constitutively active mutant FGFR3 kinase phosphorylation, suppressing downstream FRS2 and ERK1/2 signaling.
    evidence:
    - reference: DOI:10.37349/etat.2024.00240
      reference_title: "Landscape of targeted therapies for advanced urothelial carcinoma"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Additionally, in FGFR-altered cell lines, FGFR, FGFR substrate 2 (FRS2), phospholipase C γ1 (PLCγ1), and ERK1/2 phosphorylation levels are consistently reduced by deficient nanomolar erdafitinib concentrations, which results in the inhibition of proliferation of various FGFR-positive tumor cell lines [27]."
      explanation: Demonstrates direct inhibition of FGFR kinase phosphorylation and downstream FRS2/ERK1/2 signaling by erdafitinib.
  - target: FGFR2/3 Gene Fusion Kinase Activation
    treatment_effect: INHIBITS
    description: Erdafitinib inhibits the intracellular kinase domain of oncogenic FGFR2 and FGFR3 fusion proteins.
    evidence:
    - reference: DOI:10.37349/etat.2024.00240
      reference_title: "Landscape of targeted therapies for advanced urothelial carcinoma"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Erdafitinib (JNJ42756493), targeting the RTK family of FGF, is the first FDA-approved targeted therapy for aUC patients who have received platinum-based chemotherapy and have activating FGFR2 or FGFR3 mutations or fusions [27]."
      explanation: Establishes erdafitinib targeting of activating FGFR2/3 fusions as well as point mutations in advanced urothelial carcinoma.
  evidence:
  - reference: PMID:31340094
    reference_title: "Erdafitinib in Locally Advanced or Metastatic Urothelial Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of erdafitinib was associated with an objective tumor response in 40% of previously treated patients who had locally advanced and unresectable or metastatic urothelial carcinoma with FGFR alterations."
    explanation: Phase 2 BLC2001 trial demonstrating 40% objective tumor response to erdafitinib in FGFR-altered locally advanced or metastatic urothelial carcinoma.
  - reference: DOI:10.1007/s10147-024-02583-3
    reference_title: "Phase 3 THOR Japanese subgroup analysis: erdafitinib in advanced or metastatic urothelial cancer and fibroblast growth factor receptor alterations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In the THOR trial (NCT03390504) Cohort 1, erdafitinib demonstrated significantly prolonged overall survival (OS) (median 12.1 versus 7.8 months) and reduced risk of death by 36% (hazard ratio 0.64, P = 0.005) compared with chemotherapy in metastatic urothelial carcinoma (mUC) patients with FGFR alterations who progressed after ≥ 1 prior treatments, including anti-PD-(L)1."
    explanation: Randomized phase 3 THOR trial Cohort 1 survival benefit of erdafitinib over chemotherapy after prior anti-PD-(L)1 therapy.
  - reference: DOI:10.3389/fimmu.2023.1258388
    reference_title: "Treatment approaches for FGFR-altered urothelial carcinoma: targeted therapies and immunotherapy"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most common adverse events of any grade include: hyperphosphatemia (77%), stomatitis (58%), diarrhea (51%), dry mouth (46%), decreased appetite (38%), dysgeusia (37%), fatigue (32%), dry skin (32%) and alopecia (29%). Ocular toxicities of any grade occurred in 51% of patients including: central serous retinopathy (21%), dry eye (19%), blurred vision (17%), cataracts (6%), and keratitis (5%)."
    explanation: Documents the characteristic on-target hyperphosphatemia, mucosal, gastrointestinal, and ocular toxicity profile of erdafitinib in BLC2001.
- name: Platinum-Based Chemotherapy
  description: >-
    Cisplatin- or carboplatin-based cytotoxic combination regimens (such as
    gemcitabine plus cisplatin) serve as standard systemic backbone chemotherapy
    for advanced urothelial carcinoma prior to biomarker-directed FGFR inhibition.

  evidence:
  - reference: DOI:10.1172/jci169241
    reference_title: "FGFR inhibition augments anti–PD-1 efficacy in murine FGFR3-mutant bladder cancer by abrogating immunosuppression"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Upwards of 70% of low-grade NMIBC and 15% of MIBC have genetic alterations in the fibroblast growth factor receptor 3 (FGFR3) gene, including activating point mutations or gene fusions (3–6)."
    explanation: Summarizes the prevalence of somatic activating FGFR3 point mutations and gene fusions across human non-muscle-invasive and muscle-invasive bladder urothelial carcinomas.
  - reference: DOI:10.1158/1078-0432.ccr-23-1283
    reference_title: "Clinical and Genomic Landscape of FGFR3-Altered Urothelial Carcinoma and Treatment Outcomes with Erdafitinib: A Real-World Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGFR3 alterations predictive of erdafitinib sensitivity were identified in 39% (199/504) of patients with non-muscle invasive, 14% (75/526) with muscle-invasive, 43% (81/187) with localized upper tract, and 26% (59/228) with metastatic specimens."
    explanation: Quantifies the prevalence of sensitizing somatic FGFR3 alterations across bladder, upper tract, and metastatic urothelial carcinoma cohorts.
  downstream:

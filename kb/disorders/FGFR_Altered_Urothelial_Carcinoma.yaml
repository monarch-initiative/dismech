genetic:
- name: FGFR3
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  association: Somatic Activating Mutations and Fusions
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic activating FGFR3 hotspot point mutations (including S249C, Y373C,
    R248C, and G370C) and rearrangements (most commonly FGFR3-TACC3) represent
    the predominant oncogenic driver in FGFR-altered urothelial carcinoma,
    occurring in ~26% of metastatic and ~39-43% of non-muscle-invasive and upper
    tract specimens. No ClinGen gene-disease validity assertion exists for
    MONDO:0040679 because these alterations are somatic oncogenic drivers.
  evidence:
  - reference: PMID:31264434
    reference_title: "Evolving Role of Genomics in Genitourinary Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Specific mutations have been identified that predict response to therapy including ERCC2 mutations and cisplatin, DNA damage and repair mutations and checkpoint inhibitors, and FGFR3 mutations and FGFR tyrosine kinase inhibitors such as erdafitinib."
    explanation: Establishes somatic FGFR3 mutations as clinically actionable predictive drivers for FGFR tyrosine kinase inhibitor therapy in urothelial carcinoma.
  - reference: DOI:10.1158/1078-0432.ccr-23-1283
    reference_title: "Clinical and Genomic Landscape of FGFR3-Altered Urothelial Carcinoma and Treatment Outcomes with Erdafitinib: A Real-World Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGFR3 alterations predictive of erdafitinib sensitivity were identified in 39% (199/504) of patients with non-muscle invasive, 14% (75/526) with muscle-invasive, 43% (81/187) with localized upper tract, and 26% (59/228) with metastatic specimens."
    explanation: Quantifies somatic sensitizing FGFR3 mutations and fusions across clinical stages of urothelial carcinoma.

      reference_title: "Treatment approaches for FGFR-altered urothelial carcinoma: targeted therapies and immunotherapy"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Alterations and fusions of FGFR3 have been shown to activate downstream pathways such as the MAPK and PI3K/AKT pathways which play roles in cancer development and progression (23)."
      explanation: Directly links activating FGFR3 mutations and fusions to downstream MAPK pathway activation in urothelial carcinoma.
  - target: PI3K-AKT Pathway Activation
    causal_link_type: DIRECT
    description: Constitutively phosphorylated FGFR3 engages adaptor complexes that recruit PI3K and activate AKT signaling.

    directness: INDIRECT
    snippet: "The first-line therapy for aUC patients is cisplatin-based chemotherapy."
    explanation: Confirms standard frontline platinum-based chemotherapy in advanced urothelial carcinoma.
- name: Immune Checkpoint Inhibitors
  description: >-
    PD-1/PD-L1 immune checkpoint blockade (including pembrolizumab, alone or
    combined with enfortumab vedotin) is standard systemic immunotherapy in
    advanced urothelial carcinoma and is sequenced prior to erdafitinib in
    FGFR-altered metastatic disease; in phase 3 THOR Cohort 2, PD-(L)1-naive
    patients with FGFR-altered metastatic urothelial cancer had comparable
    overall survival with erdafitinib and pembrolizumab (10.9 vs 11.1 months).
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: Pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: Uncontrolled Urothelial Cell Proliferation and Tumor Growth
    treatment_effect: INHIBITS
    description: PD-1 checkpoint blockade restores antitumor T-cell cytotoxicity to restrain FGFR-altered urothelial tumor growth.
    evidence:
    - reference: PMID:38346808
      reference_title: "Advances in diagnosis and treatment of bladder cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In this cohort, 351 pretreated, PDL1 naive patients with advanced or metastatic urothelial cancer with select FGFR alterations were randomized in a 1:1 ratio to receive erdafitinib daily versus pembrolizumab. With a median follow-up of 33 months, median overall survival with erdafitinib and pembrolizumab was 10.9 and 11.1 months, respectively, with a hazard ratio of 1.18 (95% confidence interval 0.92 to 1.51, p=0.18)."
      explanation: Demonstrates clinical antitumor activity of PD-1 blockade with pembrolizumab comparable to erdafitinib in PD-(L)1-naive FGFR-altered metastatic urothelial carcinoma.
  evidence:
  - reference: PMID:38346808
    reference_title: "Advances in diagnosis and treatment of bladder cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this cohort, 351 pretreated, PDL1 naive patients with advanced or metastatic urothelial cancer with select FGFR alterations were randomized in a 1:1 ratio to receive erdafitinib daily versus pembrolizumab. With a median follow-up of 33 months, median overall survival with erdafitinib and pembrolizumab was 10.9 and 11.1 months, respectively, with a hazard ratio of 1.18 (95% confidence interval 0.92 to 1.51, p=0.18)."
    explanation: Summarizes randomized phase 3 THOR Cohort 2 outcomes comparing pembrolizumab immunotherapy against erdafitinib in FGFR-altered advanced urothelial carcinoma.

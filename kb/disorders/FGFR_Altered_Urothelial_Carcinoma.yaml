notes: >-
  No GeneReviews chapter covers FGFR-altered urothelial carcinoma in the NCBI
  Bookshelf index. MONDO:0040679 (urothelial carcinoma) is anchored as
  disease_term with skos:broadMatch in mappings.mondo_mappings because MONDO
  does not currently mint a separate child term for the somatic FGFR2/3-altered
  molecular stratum. Bladder-arising tumors within this molecular stratum
  overlap anatomically with Bladder_Urothelial_Carcinoma (MONDO:0005611,
  bladder transitional cell carcinoma), whereas this entry captures the
  pan-urothelial (bladder and upper urinary tract) FGFR2/3-driven molecular
  stratum selected for FGFR kinase inhibitor therapy.

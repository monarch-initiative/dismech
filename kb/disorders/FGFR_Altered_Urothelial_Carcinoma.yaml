name: FGFR-Altered Urothelial Carcinoma
creation_date: '2026-01-26T02:55:13Z'
synonyms:
- FGFR2/3-altered urothelial carcinoma
- FGFR3-altered urothelial carcinoma
- FGFR-mutant or fusion-positive urothelial carcinoma
description: >-
  FGFR-altered urothelial carcinoma is a molecularly defined subset of urinary
  bladder and upper urinary tract carcinomas harboring somatic activating
  alterations in fibroblast growth factor receptor genes, predominantly FGFR3 and
  less commonly FGFR2. Activating FGFR3 hotspot point mutations (such as S249C,
  Y373C, R248C, and G370C) and FGFR2/3 gene fusions (most commonly FGFR3-TACC3)
  occur across non-muscle-invasive, muscle-invasive, upper tract, and roughly
  15-26% of locally advanced or metastatic urothelial carcinomas, with strong
  enrichment in luminal-papillary tumors. These alterations drive
  ligand-independent receptor dimerization, constitutive tyrosine kinase
  autophosphorylation, and downstream RAS-MAPK and PI3K-AKT signaling to sustain
  urothelial tumor proliferation and survival, and confer clinical sensitivity to
  selective FGFR tyrosine kinase inhibition with erdafitinib.
categories:
- Genitourinary Cancer
- Molecularly-Defined Cancer
parents:
- urothelial carcinoma
disease_term:
  preferred_term: urothelial carcinoma
  term:
    id: MONDO:0040679
    label: urothelial carcinoma
mappings:
  mondo_mappings:

genetic:
- name: NBN
  gene_term:
    preferred_term: NBN
    term:
      id: hgnc:7652
      label: NBN
  association: Causal biallelic hypomorphic variant
  notes: >-
    Nijmegen breakage syndrome is caused by pathogenic variants in NBN (also
    known as NBS1), which encodes the DNA damage response protein nibrin. The
    disease alleles are biallelic hypomorphic variants rather than complete
    nulls, and a Slavic founder mutation (c.657_661del5) accounts for the
    disease being encountered most frequently among Slavic populations.
  evidence:
  - reference: PMID:22373003
    reference_title: Nijmegen breakage syndrome (NBS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Due to a founder mutation in the underlying NBN gene (c.657_661del5) the disease is encountered most frequently among Slavic populations."
    explanation: Documents the NBN founder allele and the resulting Slavic population enrichment.
  - reference: PMID:22373003
    reference_title: Nijmegen breakage syndrome (NBS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "biallelic hypomorphic mutations in the NBN gene"
    explanation: >-
      The diagnostic laboratory-findings list specifies biallelic hypomorphic
      NBN mutations, supporting the hypomorphic (not complete loss-of-function)
      characterization of the disease alleles.
  - reference: DOI:10.3390/cells11050802
    reference_title: Impaired p53-Mediated DNA Damage Response Contributes to Microcephaly in Nijmegen Breakage Syndrome Patient-Derived Cerebral Organoids
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nijmegen Breakage Syndrome (NBS) is a rare autosomal recessive genetic disorder caused by mutations within nibrin (NBN), a DNA damage repair protein."
    explanation: This directly supports NBN as the causal gene in NBS.
  - reference: CGGV:assertion_de6fa1fe-a86e-4f0d-8da8-7690debe9aec-2022-06-21T170000.000Z
    reference_title: "NBN / Nijmegen breakage syndrome (Definitive)"

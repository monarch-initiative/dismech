name: Nijmegen breakage syndrome
creation_date: "2026-04-13T22:47:36Z"
description: >-
  Nijmegen breakage syndrome is a rare NBN-related DNA damage response disorder
  characterized by chromosomal instability, progressive microcephaly, growth
  retardation, immunodeficiency, and marked cancer susceptibility. Available
  mechanistic data support defective DNA repair with delayed p53-mediated DNA
  damage response and abnormal neurogenesis.
category: Mendelian
parents:
- hereditary disease
- chromosomal instability syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive chromosomal-instability syndrome caused by
      biallelic NBN variants.
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Marked cancer susceptibility — lymphoma above all — is a core clinical
      domain of the disease (see the Lymphoma phenotype in this entry).
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Microcephaly, dysmorphic facies; lymphomas and solid tumors"
      explanation: >-
        The IUIS 2022 Table 2 row for Nijmegen breakage syndrome lists
        lymphomas and solid tumors among its associated features, supporting
        the oncologic classification axis.
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      IUIS 2022 classification of inborn errors of immunity (Tangye et al.,
      PMID:35748970), Table 2 "Combined immunodeficiencies with associated or
      syndromic features", section 2 "DNA Repair Defects Other Than Those
      Listed in Table 1", row "Nijmegen breakage syndrome" (listed under the
      gene symbol NBS1, the older alias of NBN; AR, OMIM 602667).
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Nijmegen breakage syndrome NBS1 AR 602667 Progressive decrease; may have low TRECs and T cells by NBS"
      explanation: >-
        Table 2 section 2 row identifying Nijmegen breakage syndrome (NBS1 =
        NBN) among combined immunodeficiencies with associated or syndromic
        features; the quote joins the row's wrapped lines in the cached PDF
        extraction.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No reliable prevalence estimate exists. The disease occurs worldwide but is
    distinctly enriched in Central and Eastern European (Slavic) populations,
    where the carrier frequency of the founder allele c.657_661del5
    (p.K219fsX19) is estimated at about 1 per 177 newborns.
  evidence:
  - reference: PMID:22373003
    reference_title: Nijmegen breakage syndrome (NBS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nijmegen breakage syndrome is a rare disease and there are no reliable estimates of its prevalence."
    explanation: The review states directly that no reliable prevalence estimate exists.
  - reference: PMID:22373003
    reference_title: Nijmegen breakage syndrome (NBS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "c.657_661del5 (p.K219fsX19), estimated to be 1 case per 177 newborns, clearly the result of a founder effect"
    explanation: Quantifies the founder-allele carrier frequency behind the Slavic population enrichment.

  evidence:
  - reference: PMID:26669662
    reference_title: "Genes for spinocerebellar ataxia with blindness and deafness (SCABD/SCAR3, MIM# 271250 and SCABD2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the course of this project, we identified a clinically similar family
      with a homozygous missense mutation in PEX6, which is located in 6p21.
      Therefore, despite false linkage in the initial family, SCABD1/SCAR3 is
      located in 6p21 and is caused by PEX6 mutations.
    explanation: >-
      Establishes PEX6 as the cause of the ataxia-blindness-deafness
      (SCAR3/SCABD1) presentation that MONDO:0013931 subsumes under PBD4B.
  - reference: PMID:25079577
    reference_title: Late-onset Zellweger spectrum disorder caused by PEX6 mutations mimicking X-linked adrenoleukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a new patient with late-onset Zellweger spectrum disorder
      caused by PEX6 mutations who presented with an acute neurodegenerative
      disease course mimicking X-linked adrenoleukodystrophy.
    explanation: >-
      Documents the complementary late-onset neurodegenerative presentation of
      non-classic PEX6 disease.
  - reference: ORPHA:95433
    reference_title: Autosomal recessive spinocerebellar ataxia-blindness-deafness syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cerebral MRI shows alterations of the cerebellar white matter without

name: Peroxisome Biogenesis Disorder 4B
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 4B (PBD4B) is the non-classic ("B", milder)
  end of the PEX6-related Zellweger spectrum - the PEX6 counterpart of PBD1B.
  PEX6 is the obligate partner of PEX1 in the heterohexameric AAA-ATPase
  receptor export module that recycles the peroxisomal matrix-protein import
  receptor PEX5, and PEX6 defects are the second most common cause of Zellweger
  spectrum disease after PEX1. As with PEX1, alleles that preserve residual
  peroxin function shift disease away from the lethal neonatal presentation of
  PBD4A toward a slowly progressive degenerative course. PBD4B is distinguished
  from its PEX1 counterpart chiefly by two features. First, it subsumes the
  neurogenetic entity formerly catalogued separately as autosomal recessive
  spinocerebellar ataxia 3 (SCAR3/SCABD1) - early-onset cerebellar ataxia with
  sensorineural hearing loss and visual loss, cerebellar white matter change
  without cerebellar atrophy, and demyelinating peripheral motor neuropathy -
  so PBD4B is regularly encountered first as a syndromic inherited ataxia or as
  an X-linked adrenoleukodystrophy mimic rather than as a metabolic disease.
  Second, PEX6 uniquely harbours a dosage mechanism with no PEX1 equivalent: the
  c.2578C>T (p.Arg860Trp) allele can cause disease in the heterozygous state
  when allelic expression imbalance overrepresents it relative to the wild-type
  allele, producing apparently dominant transmission at a canonically recessive
  locus.

      label: peroxisome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:24016303
    reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell lines displaying peroxisomal mosaicism, peroxisome biogenesis can
      be improved when these are cultured at 30°C.
    explanation: >-
      Documents partial, temperature-reversible import failure as the cellular
      phenotype of mild PEX-gene missense alleles, including PEX6.
  - reference: PMID:29220678
    reference_title: Allelic Expression Imbalance Promoting a Mutant PEX6 Allele Causes Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression models confirmed that the overrepresentation of the
      pathogenic PEX6 c.2578T variant compared to wild-type PEX6 c.2578C results
      in a peroxisome biogenesis defect and thus constitutes the cause of
      disease in the affected individuals.
    explanation: >-
      Shows experimentally that the peroxisome biogenesis defect scales with the
      relative dose of mutant versus wild-type PEX6.
  downstream:
  - target: Attenuated Peroxisomal Metabolic Block
    description: >-
      Residual import of beta-oxidation, alpha-oxidation, ether-lipid and bile
      acid enzymes leaves a partial rather than complete metabolic block.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24016303
      reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Peroxisome biogenesis and function in fibroblasts with mild missense
        mutations in PEX1, 6 and 12 can be improved by arginine.
      explanation: >-
        Improvement of peroxisomal function together with restored biogenesis in
        PEX6-mutant cells shows the metabolic block tracks residual import
        capacity.
- name: Attenuated Peroxisomal Metabolic Block
  biological_scale: MOLECULAR
  description: >-
    Peroxisomal beta-oxidation of very-long-chain fatty acids, alpha-oxidation of
    phytanic acid, bile acid side-chain shortening and ether-phospholipid
    synthesis are impaired but incompletely. The resulting very-long-chain fatty
    acid elevation is the finding that most often brings PBD4B to attention, and
    it is also the source of a characteristic diagnostic trap: it is
    indistinguishable on first pass from X-linked adrenoleukodystrophy, so
    patients can be misassigned to ABCD1 disease until sequencing intervenes.
  biological_processes:

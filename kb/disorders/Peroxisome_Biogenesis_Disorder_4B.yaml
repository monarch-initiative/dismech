notes: >-
  Curation level. PBD4B is curated as a distinct entry, in parallel with
  Peroxisome Biogenesis Disorder 1B, because the "A"/"B" split within a PEX
  complementation group is a mechanistic statement about residual peroxin
  function rather than a bare severity label, and because the causal gene
  differs. The gene-agnostic downstream cascade shared by the whole spectrum
  (loss of peroxisomal beta-/alpha-oxidation, ether-lipid synthesis and bile
  acid side-chain shortening, and the resulting multisystem disease) is curated
  once on the Zellweger Spectrum Disorders entry rather than duplicated here;
  this entry carries what is PEX6- and non-classic-specific.

  Nomenclature and named-entity-confusion check. MONDO:0013931 carries both the
  peroxisomal-nosology label (PBD4B, OMIM 614863) and the neurogenetic label
  (SCAR3/SCABD1, OMIM 271250). These are genuinely co-referent rather than a
  name collision, but the history is tangled and worth recording: SCAR3/SCABD
  was originally mapped to 6p21-p23 in an Arab Israeli consanguineous family,
  and that original family was later shown by exome sequencing to carry an
  SLC52A2 variant (8qter) - a distinct, riboflavin-responsive entity now called
  SCABD2 and allelic to Brown-Vialetto-Van Laere syndrome type 2. The 6p21
  SCAR3/SCABD1 locus was nevertheless confirmed, in a clinically similar family,
  to be PEX6. Curators should therefore treat older SCAR3 literature with care:
  reports anchored on the original family describe SLC52A2 disease, not PBD4B.

  Heimler syndrome 2 (OMIM 616617), the mildest PEX6-related presentation, sits
  below PBD4B on the same allelic series and holds separate OMIM/MONDO identity;
  it is referenced here but intentionally not modeled as a subtype.

  Recorded disagreement with a deep-research provider. The Edison/falcon report
  generated for this entry
  (research/Peroxisome_Biogenesis_Disorder_4B-deep-research-falcon.md) asserts
  that "SCAR3/SCABD1 is not supported as a synonym"
  and recommends not loading it. That conclusion is not adopted here, because it
  reflects the provider's retrieval set (Open Targets gene-disease scoring)
  rather than the nomenclature record: MONDO:0013931 carries SCAR3, SCABD and
  the ataxia-blindness-deafness labels as exact synonyms; Orphanet ORPHA:95433
  maps to MONDO:13931 as an exact match; and PMID:26669662 states in primary
  literature that "SCABD1/SCAR3 is located in 6p21 and is caused by PEX6
  mutations." The synonyms are retained and the underlying primary source cited.
  The same report also gives HGNC:8856 for PEX6, which is wrong - OAK confirms
  hgnc:8859 is PEX6 (hgnc:8858 is PEX3) - a reminder to verify every provider
  identifier.

  Ascertainment note. Mild PEX6 disease reaches genetics services under at least
  three non-metabolic labels: syndromic inherited ataxia (SCAR3/SCABD1), an
  X-linked adrenoleukodystrophy mimic, and Perrault syndrome (hearing loss with
  premature ovarian insufficiency). Only the first two are modeled as synonyms;
  the Perrault presentation is recorded under genetics because Perrault syndrome
  is a separate, genetically heterogeneous entity that PEX6 can phenocopy rather
  than a name for this disorder.
inheritance:
- name: Autosomal recessive
  description: >-
    PBD4B usually results from biallelic PEX6 pathogenic variants, with at least
    one allele retaining partial function.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD is typically inherited in an autosomal recessive manner
    explanation: >-
      GeneReviews states the autosomal recessive inheritance of Zellweger
      spectrum disorders, of which PBD4B is the PEX6 non-classic end.
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The autosomal recessive Zellweger syndrome spectrum (ZSS) disorders
      comprise a main subgroup of the peroxisome biogenesis disorders.
    explanation: >-
      The PEX6 mutation survey confirms autosomal recessive inheritance for the
      Zellweger spectrum group it characterizes.
- name: Apparently dominant transmission via allelic expression imbalance
  description: >-
    A mechanistically distinctive exception to the recessive rule at this locus.
    The PEX6 c.2578C>T (p.Arg860Trp) allele can cause Zellweger spectrum disease
    in the heterozygous state when a common 3' UTR polyadenylation-site variant
    on the wild-type allele skews expression toward the mutant transcript.
    Asymptomatic parents carrying the same coding variant without the imbalance
    are unaffected, so the pedigree can look dominant while the underlying
    mechanism is allele dosage.
  evidence:
  - reference: PMID:29220678
    reference_title: Allelic Expression Imbalance Promoting a Mutant PEX6 Allele Causes Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified seven unrelated individuals affected with an apparent
      dominant ZSD in whom a heterozygous mutant PEX6 allele
    explanation: >-
      Directly documents apparently dominant Zellweger spectrum disease arising
      from a single heterozygous PEX6 allele.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One PEX6 variant, p.Arg860Trp, has been associated with ZSD in the
      heterozygous state due to allelic expression imbalance dependent on
      allelic background.
    explanation: >-
      GeneReviews records the same PEX6-specific exception to autosomal
      recessive inheritance.
pathophysiology:
- name: PEX6 Variants with Residual Peroxin-6 Function
  biological_scale: MOLECULAR
  description: >-
    PEX6 is an AAA ATPase with two tandem AAA cassettes, encoded by a 17-exon
    gene in which pathogenic variants are scattered across all exons; a survey of
    75 PEX6 complementation group patients found 77 distinct mutations. PBD4B
    arises from the subset of genotypes that retain partial peroxin-6 function -
    typically missense alleles, or a missense allele in trans with a null - in
    contrast to the biallelic truncating genotypes that produce classic
    Zellweger syndrome (PBD4A). At the extreme mild end of the same allelic
    series, hypomorphic PEX6 alleles produce Heimler syndrome, with peroxisomal
    dysfunction so slight that routine biochemical screening does not flag it.
  genes:
  - preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The encoded protein PEX6 belongs to the AAA ATPase family and contains two
      AAA cassettes and an AAA protein family signature.
    explanation: >-
      Establishes the domain architecture of the protein whose partial loss
      defines PBD4B.
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the PEX6 genes of 75 patients assigned to the PEX6
      complementation group. We identified a total of 77 different mutations of
      which 47 mutations have not been reported previously, and 14 polymorphic
      variants.
    explanation: >-
      Documents the allelic heterogeneity across which the PBD4A/PBD4B severity
      split is drawn.
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that each HS-affected family has at least one hypomorphic
      allele that results in extremely mild peroxisomal dysfunction.
    explanation: >-
      Establishes residual-function (hypomorphic) PEX6 alleles as the driver of
      the mild end of the PEX6 series.
  downstream:
  - target: Receptor Export Module Insufficiency
    description: >-
      Reduced peroxin-6 lowers the amount of functional PEX1-PEX6 AAA-ATPase
      motor available to reset the matrix protein import machinery.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29884772
      reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PEX1 and PEX6 are two members of the ATPases associated with diverse
        cellular activities (AAA) family and the core components of the receptor
        export module of the peroxisomal matrix protein import machinery.
      explanation: >-
        Identifies PEX6 as an obligate core component of the receptor export
        module, so reduced PEX6 directly reduces module capacity.
- name: Receptor Export Module Insufficiency
  biological_scale: MOLECULAR
  description: >-
    PEX6 heterohexamerizes with PEX1 to form the ATP-driven motor that extracts
    monoubiquitinated PEX5 from the peroxisomal membrane docking/translocation
    module by processive threading and unfolding, returning the receptor to the
    cytosol for reuse. Because the two ATPases are obligate partners, a PEX6
    lesion and a PEX1 lesion converge on the identical rate-limiting step - the
    reason PBD4B and PBD1B are phenotypically overlapping despite different
    genes.
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:29884772
    reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Their role is to extract monoubiquitinated PEX5, the peroxisomal
      protein-shuttling receptor, from the peroxisomal membrane
      docking/translocation module (DTM), so that a new cycle of protein
      transportation can start.
    explanation: >-
      Defines the specific PEX1/PEX6 step that is rate-limited in PBD4B.
  - reference: PMID:29884772
    reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recent data have shown that PEX1 and PEX6 form a heterohexameric complex
      that unfolds substrates by processive threading.
    explanation: >-
      Supports the obligate PEX1-PEX6 partnership that makes PEX6 loss
      mechanistically equivalent to PEX1 loss at this step.
  - reference: PMID:31652724
    reference_title: "A Mechanistic Perspective on PEX1 and PEX6, Two AAA+ Proteins of the Peroxisomal Protein Import Machinery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the peroxisomal matrix protein import machinery relies on a regulated
      self-assembly mechanism for this purpose and uses ATP hydrolysis only to
      reset its components
    explanation: >-
      Establishes that ATP-dependent PEX1/PEX6 activity is required to reset,
      not to drive, matrix protein import.
  downstream:
  - target: Partial Peroxisomal Matrix Protein Import Failure
    description: >-
      Slowed PEX5 recycling limits the number of import cycles, so peroxisomes
      import a reduced complement of matrix enzymes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29884772
      reference_title: Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Their role is to extract monoubiquitinated PEX5, the peroxisomal
        protein-shuttling receptor, from the peroxisomal membrane
        docking/translocation module (DTM), so that a new cycle of protein
        transportation can start.
      explanation: >-
        Failure to reset the receptor prevents subsequent cycles of matrix
        protein import.
- name: Partial Peroxisomal Matrix Protein Import Failure
  biological_scale: CELLULAR
  description: >-
    Import of PTS1- and PTS2-targeted matrix enzymes is reduced but not
    abolished. Fibroblasts carrying mild PEX6 missense alleles show peroxisomal
    mosaicism whose severity is conformation-dependent, improving at reduced
    temperature or with a chemical chaperone - the same cellular signature seen
    with mild PEX1 alleles.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:

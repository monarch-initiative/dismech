- name: Genetic Counseling
  description: >-
    Counseling normally covers the 25% sibling recurrence risk of autosomal
    recessive inheritance, but must additionally account for the PEX6-specific
    allelic expression imbalance mechanism, in which an apparently dominant
    pedigree arises from a single overrepresented mutant allele.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One PEX6 variant, p.Arg860Trp, has been associated with ZSD in the
      heterozygous state due to allelic expression imbalance dependent on
      allelic background.
    explanation: >-
      GeneReviews flags the PEX6 heterozygous-state exception that genetic
      counseling for this disorder must accommodate.
  - reference: PMID:29220678
    reference_title: Allelic Expression Imbalance Promoting a Mutant PEX6 Allele Causes Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AEI promoting the overrepresentation of a mutant allele might also play a
      role in other autosomal-recessive disorders, in which only one heterozygous
      pathogenic variant is identified.
    explanation: >-
      Supports counseling and testing implications when only one PEX6 pathogenic
      variant is found.

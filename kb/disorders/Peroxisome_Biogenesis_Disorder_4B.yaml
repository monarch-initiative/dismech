      Elevated plasma very long chain fatty acid levels were suggestive of
      X-linked adrenoleukodystrophy, but his ABCD1 gene had normal coding
      sequence and dosage.
    explanation: >-
      Documents both the very-long-chain fatty acid elevation of PEX6-related
      disease and the X-linked adrenoleukodystrophy misassignment it invites.
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C26:0-lysoPC in DBS is a sensitive and useful marker for VLCFA
      accumulation in patients with a ZSD.
    explanation: >-
      Confirms very-long-chain fatty acid accumulation as the measurable output
      of the peroxisomal beta-oxidation block across the spectrum.
  downstream:
  - target: Progressive Cerebellar, Sensory and Peripheral Nerve Degeneration
    description: >-
      Chronic partial deficiency of peroxisomal lipid metabolism drives the
      degenerative cerebellar, sensory and peripheral nerve disease that
      dominates the PBD4B phenotype.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - very-long-chain fatty acid accumulation
    - plasmalogen (ether phospholipid) deficiency
    evidence:
    - reference: PMID:20301621
      reference_title: Zellweger Spectrum Disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with intermediate/milder ZSD do not have congenital
        malformations, but rather progressive peroxisome dysfunction variably
        manifest as sensory loss (secondary to retinal dystrophy and
        sensorineural hearing loss), neurologic involvement (ataxia,
        polyneuropathy, and leukodystrophy), liver dysfunction, adrenal
        insufficiency, and renal oxalate stones.
      explanation: >-
        GeneReviews defines the non-classic phenotype as progressive peroxisome
        dysfunction, the clinical expression of an attenuated metabolic block.
- name: Progressive Cerebellar, Sensory and Peripheral Nerve Degeneration
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint that gives PBD4B its distinctive neurogenetic face.
    Cerebellar ataxia with sensorineural hearing loss and visual loss, cerebellar
    white matter change, and demyelinating peripheral motor neuropathy constitute
    the SCAR3/SCABD1 presentation that led PEX6 disease to be catalogued as a
    syndromic inherited ataxia before its peroxisomal basis was recognized. A
    complementary presentation is an acute, X-linked-adrenoleukodystrophy-like
    neurodegenerative course with symmetric leukodystrophy after years of normal
    development.

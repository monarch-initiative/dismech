genetic:
- name: PEX6
  gene_term:
    preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  association: >-
    Biallelic PEX6 pathogenic variants cause the PEX6 complementation group,
    the second most common genetic cause of Zellweger spectrum disease after
    PEX1. PBD4B corresponds to the genotypes preserving residual peroxin-6
    function. Two features are specific to this locus. First, the c.2578C>T
    (p.Arg860Trp) allele can act in the heterozygous state when a 3' UTR
    polyadenylation-site variant produces allelic expression imbalance in its
    favour, so an apparently dominant pedigree does not exclude PEX6 disease.
    Second, the same gene's hypomorphic alleles extend below PBD4B to Heimler
    syndrome 2, the mildest recognized peroxisome biogenesis phenotype.
  evidence:
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Defects in the PEX6 gene are the second most common cause for ZSS
      disorders.
    explanation: >-
      Establishes the rank of PEX6 among causes of Zellweger spectrum disease.
  - reference: PMID:26669662
    reference_title: "Genes for spinocerebellar ataxia with blindness and deafness (SCABD/SCAR3, MIM# 271250 and SCABD2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, despite false linkage in the initial family, SCABD1/SCAR3 is
      located in 6p21 and is caused by PEX6 mutations.
    explanation: >-
      Attributes the SCAR3/SCABD1 ataxia-blindness-deafness entity, one of this
      disorder's synonyms, to PEX6.
  - reference: PMID:29220678
    reference_title: Allelic Expression Imbalance Promoting a Mutant PEX6 Allele Causes Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrated that AEI of PEX6 is a common phenomenon and is correlated
      with heterozygosity for a frequent variant in the 3' untranslated region
      (UTR) of the mutant allele, which disrupts the most distal of two
      polyadenylation sites.
    explanation: >-
      Defines the cis-regulatory mechanism that allows a single PEX6 allele to
      cause disease.
  - reference: PMID:29220678
    reference_title: Allelic Expression Imbalance Promoting a Mutant PEX6 Allele Causes Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic parents, who were heterozygous for PEX c.2578C>T, did not
      show AEI and were homozygous for the 3' UTR variant.
    explanation: >-
      Shows that the coding variant alone is insufficient, so pathogenicity
      depends on the expression-imbalance background.
  - reference: PMID:26387595
    reference_title: Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, our findings define HS as a mild PBD, expanding the
      pleiotropy of mutations in PEX1 and PEX6.
    explanation: >-
      Places Heimler syndrome on the same PEX6 hypomorphic allelic series,
      below PBD4B in severity.
  - reference: PMID:32399598
    reference_title: "Genomic sequencing highlights the diverse molecular causes of Perrault syndrome: a peroxisomal disorder (PEX6), metabolic disorders (CLPP, GGPS1), and mtDNA maintenance/translation disorders (LARS2, TFAM)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, we show that pathogenic variants in PEX6 can present
      clinically as Perrault syndrome.
    explanation: >-
      Extends the PEX6 ascertainment problem beyond ataxia and
      adrenoleukodystrophy mimicry: mild PEX6 disease can also be labelled
      Perrault syndrome, i.e. sensorineural hearing loss with premature ovarian
      insufficiency.
diagnosis:
- name: Molecular genetic testing of PEX6
  description: >-
    Because PBD4B presents as a syndromic ataxia or as an X-linked
    adrenoleukodystrophy mimic rather than as an obvious metabolic disease,
    molecular testing is what closes the diagnosis. PEX6 belongs both on
    Zellweger spectrum panels and on syndromic inherited ataxia panels, and a
    normal ABCD1 result in a child with leukodystrophy and elevated
    very-long-chain fatty acids should prompt PEX gene sequencing.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:26669662
    reference_title: "Genes for spinocerebellar ataxia with blindness and deafness (SCABD/SCAR3, MIM# 271250 and SCABD2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both SLC52A2 and PEX6 should be included in screening panels for the
      diagnosis of syndromic inherited ataxias
    explanation: >-
      Directly recommends PEX6 inclusion on syndromic ataxia diagnostic panels.
  - reference: PMID:25079577
    reference_title: Late-onset Zellweger spectrum disorder caused by PEX6 mutations mimicking X-linked adrenoleukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding provides an additional reason that molecular confirmation is
      important for the genetic counseling and management of patients with a
      clinical and biochemical diagnosis of X-linked adrenoleukodystrophy.
    explanation: >-
      Supports molecular testing to resolve the X-linked adrenoleukodystrophy
      mimicry that characterizes non-classic PEX6 disease.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive
      clinical and biochemical findings above by identification of biallelic
      pathogenic variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews makes biallelic PEX gene variant identification the
      diagnostic standard.

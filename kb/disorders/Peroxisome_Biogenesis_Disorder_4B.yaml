- name: Dicarboxylic acylcarnitines
  presence: Increased
  context: >-
    Plasma very-long-chain dicarboxylic acylcarnitines (C20-DC, C22-DC) are
    elevated across PEX1/PEX6 peroxisome biogenesis disorders and, unlike
    very-long-chain fatty acids, are NOT substantially elevated in X-linked
    adrenoleukodystrophy - which makes them directly useful against the
    diagnostic trap that characterizes non-classic PEX6 disease.
  readouts:
  - target: Attenuated Peroxisomal Metabolic Block
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Accumulating dicarboxylic acylcarnitines report diversion of fatty acids
      to omega-oxidation when peroxisomal beta-oxidation is impaired, and
      discriminate peroxisome biogenesis failure from the isolated transport
      defect of X-linked adrenoleukodystrophy.
    evidence:
    - reference: PMID:37567036
      reference_title: Dicarboxylic acylcarnitine biomarkers in peroxisome biogenesis disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similar to prior studies, we failed to detect substantial dicarboxylic
        acylcarnitine abnormalities in blood spot cards from patients with
        x-linked adrenoleukodystrophy (x-ald) indicating that these biomarkers
        may have utility in quickly narrowing the differential diagnosis in
        patients with a positive newborn screen for x-ald.
      explanation: >-
        Establishes the discriminating value of this readout precisely where
        PBD4B is most often misassigned.
  evidence:
  - reference: PMID:37567036
    reference_title: Dicarboxylic acylcarnitine biomarkers in peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best performing plasma acylcarnitine biomarkers, C20-DC and C22-DC,
      were detected at elevated levels in 100% and 68% of PBD patients but were
      rarely elevated in patients that did not have a PBD.
    explanation: >-
      Quantifies performance in a cohort of PEX1- or PEX6-deficient patients
      spanning lethal neonatal to mild late-onset forms.
  - reference: PMID:37567036
    reference_title: Dicarboxylic acylcarnitine biomarkers in peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We extended our analysis to residual newborn screening blood spot cards
      and were able to detect dicarboxylic acylcarnitine abnormalities in a
      newborn with a PBD caused by PEX6 deficiency.
    explanation: >-
      Demonstrates the marker specifically in PEX6 deficiency and on a
      newborn-screening specimen.

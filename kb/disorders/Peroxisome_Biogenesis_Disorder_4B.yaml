    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implementation of C26:0-lysoPC measurement in the diagnostic work-up when
      suspecting a ZSD is advised.
    explanation: >-
      Supports very-long-chain fatty acid based testing as the recommended
      first-line biochemical work-up for suspected Zellweger spectrum disease.
- name: Fibroblast peroxisomal function studies
  description: >-
    Cultured skin fibroblasts support complementation analysis and functional
    confirmation of PEX6 variants of uncertain significance, though the mildest
    alleles may not be flagged by routine fibroblast assays.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:25079577
    reference_title: Late-onset Zellweger spectrum disorder caused by PEX6 mutations mimicking X-linked adrenoleukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional studies of cultured skin fibroblasts were consistent with
      Zellweger spectrum disorder.
    explanation: >-
      Documents fibroblast peroxisomal studies redirecting the diagnosis from
      X-linked adrenoleukodystrophy to Zellweger spectrum disease.
treatments:
- name: Multidisciplinary Supportive Care and Surveillance
  description: >-
    No curative therapy exists. Management is symptomatic and anticipatory:
    gastrostomy feeding, hearing aids, cataract removal and refractive
    correction, fat-soluble vitamin supplementation, anti-seizure medication,
    adrenal replacement, vitamin D with consideration of bisphosphonates, dental
    care, and sclerosing therapy for varices, on a schedule of annual audiology,
    ophthalmology, hepatic, adrenal, renal and neuroimaging surveillance.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide
      adequate calories, hearing aids, cataract removal, glasses to correct
      refractive errors, supplementation of fat-soluble vitamins, and cholic
      acid supplementation; varices can be treated with sclerosing therapies
    explanation: >-
      GeneReviews specifies the symptomatic management package for Zellweger
      spectrum disease.
- name: Cholic Acid
  description: >-
    Oral cholic acid suppresses the accumulation of hepatotoxic C27 bile acid
    intermediates that peroxisome-deficient hepatocytes cannot process, and is
    used adjunctively for the hepatic and fat-malabsorption manifestations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  target_mechanisms:
  - target: Attenuated Peroxisomal Metabolic Block
    treatment_effect: INHIBITS
    description: >-
      Cholic acid suppresses endogenous synthesis of the atypical C27 bile acid
      intermediates that accumulate because peroxisomal bile acid side-chain
      shortening is blocked.
    evidence:
    - reference: PMID:28644367
      reference_title: Oral Cholic Acid Is Efficacious and Well Tolerated in Patients With Bile Acid Synthesis and Zellweger Spectrum Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cholic acid significantly improved urine bile acid metabolite scores (P
        < 0.0001) and serum aspartate aminotransferase and alanine
        aminotransferase (P < 0.0001) in patients with SED and ZSD.
      explanation: >-
        The fall in atypical urinary bile acid metabolites is the direct
        evidence that cholic acid acts on the blocked bile acid arm.
  evidence:
  - reference: PMID:28644367
    reference_title: Oral Cholic Acid Is Efficacious and Well Tolerated in Patients With Bile Acid Synthesis and Zellweger Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cholic acid significantly improved urine bile acid metabolite scores (P <
      0.0001) and serum aspartate aminotransferase and alanine aminotransferase
      (P < 0.0001) in patients with SED and ZSD.
    explanation: >-
      Phase 3 open-label data show biochemical and hepatic benefit of cholic
      acid in Zellweger spectrum disorders.
- name: Chaperone-Mediated Stabilization of Mutant Peroxin (investigational)
  description: >-
    Mild PEX6 missense alleles behave as folding/stability mutants, so
    chaperone-like stabilization is a mechanistically targeted strategy for the
    non-classic end. The chemical chaperone arginine improved peroxisome
    biogenesis and function in fibroblasts including a PEX6 patient line. This
    is preclinical, in-vitro evidence only; no clinical efficacy has been
    demonstrated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: arginine
      term:
        id: CHEBI:29016
        label: arginine
  target_mechanisms:
  - target: PEX6 Variants with Residual Peroxin-6 Function
    treatment_effect: ACTIVATES
    description: >-
      Chaperone-mediated stabilization increases the amount of correctly folded
      mutant peroxin-6 available to assemble into the receptor export module.
    evidence:
    - reference: PMID:24016303
      reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We have studied if the function of mutant PEX1, PEX6 and PEX12 can be
        improved by promoting protein folding using the chemical chaperone
        arginine.
      explanation: >-
        States the target relationship directly: the intervention acts by
        promoting folding of the mutant peroxin, including PEX6.
  evidence:
  - reference: PMID:24016303
    reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from three PEX1 patients, one PEX6 and one PEX12 patient were
      cultured in the presence of different concentrations of arginine.
    explanation: >-
      Confirms that a PEX6 patient cell line was among those tested for
      chaperone rescue.
  - reference: PMID:24016303
    reference_title: Arginine improves peroxisome functioning in cells from patients with a mild peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Peroxisome biogenesis and function in fibroblasts with mild missense
      mutations in PEX1, 6 and 12 can be improved by arginine.
    explanation: >-
      Demonstrates chaperone rescue of peroxisome biogenesis in cells carrying
      mild PEX6 alleles.
- name: Hearing Aid Usage
  description: >-

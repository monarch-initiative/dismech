inheritance:
- name: Genetically heterogeneous
  description: >
    CSNB is inherited as an autosomal recessive trait (most complete and
    incomplete Schubert-Bornschein forms), X-linked recessive (NYX in cCSNB,
    CACNA1F in icCSNB), or autosomal dominant (several Riggs-form genes,
    including gain-of-function RHO and GNAT1 alleles). Mode of inheritance
    therefore does not identify the mechanistic arm and cannot substitute for
    electroretinography.
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mode of inheritance can be autosomal dominant (adCSNB), autosomal recessive (arCSNB) or X-chromosomal (XLCSNB)."
    explanation: >
      States the three inheritance modes across the CSNB group. Evidence source
      is OTHER because this is a review.
pathophysiology:
- name: Rod Phototransduction Cascade Defect (Riggs Arm)
  description: >
    In the Riggs form the causative variant sits in the rod phototransduction
    cascade itself - the visual pigment (RHO), the transducin subunits (GNAT1,
    GNB3), the phosphodiesterase (PDE6B), or the sodium-calcium exchanger that
    sets the outer-segment ion balance (SLC24A1). Some are loss-of-function and
    the rod cannot mount a response; some, notably the RHO G90D and T94I
    substitutions, are gain-of-function changes that keep the pigment
    constitutively active in darkness so the rod behaves as though it were
    permanently light-adapted. Either way the rod's own light response is
    abolished or desensitized, and the electroretinographic a-wave goes with it.
    GUCY2D, the retinal guanylyl cyclase that resynthesizes the cGMP the cascade
    hydrolyses, belongs to the same photoreceptor-intrinsic arm: biallelic
    hypomorphic GUCY2D alleles leave rod electroretinographic components
    undetectable or severely reduced with a stable course, although that
    phenotype is not conventionally labelled Riggs and carries macular changes of
    its own (see the CSNB1I subtype).
  role: trigger
  biological_scale: MOLECULAR

name: Congenital Stationary Night Blindness
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Congenital stationary night blindness (CSNB) is a genetically heterogeneous
  group of non-progressive inherited retinal disorders in which the retina is
  structurally normal on fundus examination but cannot signal in dim light. Its
  importance to disease modelling is that a single clinical label covers two
  mechanistically opposite lesions, and the electroretinogram tells them apart.
  In the Riggs form the defect is inside the rod photoreceptor, in the
  phototransduction cascade itself: the rod cannot generate a light response,
  the a-wave is lost, and the b-wave falls with it. In the far commoner
  Schubert-Bornschein form the photoreceptor works and the defect lies at the
  synapse onto the depolarizing (ON) bipolar cell: the a-wave is preserved while
  the b-wave is selectively lost, giving the electronegative waveform. The
  Schubert-Bornschein group divides again by electroretinogram into a complete
  form, in which only the ON pathway fails, and an incomplete form, in which
  both ON and OFF pathways are affected and daytime acuity suffers too. Beyond
  night blindness, patients commonly have high myopia, nystagmus, strabismus and
  reduced acuity. Because the disease is stationary and recessive, the retina
  remains available to treat throughout life, and gene augmentation restores
  function in mature animals rather than only in developing ones.
disease_term:
  preferred_term: congenital stationary night blindness
  term:
    id: MONDO:0016293
    label: congenital stationary night blindness
synonyms:
- CSNB
- night blindness, congenital stationary
- Schubert-Bornschein congenital stationary night blindness
- Riggs congenital stationary night blindness
notes: >-
  SUBTYPE STRUCTURE. This entry now carries two layers of subtype row, and the
  distinction matters. The first four rows (cCSNB, icCSNB, Riggs, Oguchi) are
  mechanistic arms: cCSNB, icCSNB and Riggs are electroretinographic classes with
  no MONDO term of their own and are deliberately left unbound, while Oguchi
  disease does have one (MONDO:0019152) and carries it. The remaining rows are the
  individual numbered loci, each bound to its own MONDO term, each carrying the
  gene it names, and each assigned to one of the arms through the `subtype:`
  foreign keys on the `genetic:` records. An earlier version of this entry bound a
  numbered leaf on each of the three arms (CSNB1A on cCSNB, CSNB2A on icCSNB,
  CSNBAD1 on Riggs), which asserted that the arm was that one locus; those
  bindings were moved onto their own rows.

  MONDO DESCENDANT RECONCILIATION (OLS4, 2026-09-25). MONDO:0016293 has 18
  hierarchical descendants. Seventeen are curated here as bound subtype rows. The
  eighteenth, MONDO:0044749 X-linked congenital stationary night blindness, is a
  mode-of-inheritance grouping over the two X-linked loci that already have rows
  (CSNB1A/NYX and CSNB2A/CACNA1F), so it is not curated separately.

  Two of those seventeen are not in this issue's gap list because MONDO records no
  causal gene edge on them, and both are nonetheless gene-defined in the
  literature: MONDO:0032811 (CSNB1I) has no gene edge but is filed under
  MONDO:0100453 GUCY2D-related recessive retinopathy, and MONDO:0019152 (Oguchi
  disease) is the umbrella over the two gene-bearing Oguchi leaves. A gene-keyed
  diff against MONDO therefore under-reports this entry's genetics rather than
  over-reporting it.

  DOUBLE-BOUND MONDO TERMS. Two terms bound on rows here are also bound on subtype
  rows of gene-scoped entries: MONDO:0010241 (CSNB2A) in CACNA1F-Related_Retinopathy
  and MONDO:0012498 (CSNBAD1) in RHO-Related_Retinopathy. That is deliberate - this
  entry models the CSNB phenotype across genes and those entries model one gene's
  allelic spectrum across phenotypes - and each row says so, but it is a lump/split
  decision a reviewer should see rather than infer.
parents:
- Ophthalmological Disease
- Inherited retinal dystrophy
has_subtypes:
- name: cCSNB
  display_name: Complete CSNB (Schubert-Bornschein, ON pathway)
  description: >
    The complete Schubert-Bornschein form, caused by loss of a component of the
    mGluR6 signalplex at the dendritic tips of depolarizing (ON) bipolar cells -
    NYX, GRM6, TRPM1, GPR179 or LRIT3. Rod signalling to the ON pathway is
    abolished, the ON-pathway b-wave is absent, and the OFF pathway is spared.
    Night blindness is profound; there is no retinal degeneration. This is an
    electroretinographic class rather than a MONDO class, so it is left unbound
    here; the numbered loci that compose it carry the MONDO terms on the CSNB1A,
    CSNB1B, CSNB1C, CSNB1E and CSNB1F rows below.
  review_notes: >
    MONDO has no class term for the complete form as such. Synonym-inclusive OLS4
    searches of MONDO for "complete congenital stationary night blindness" return
    only the numbered leaves CSNB1A to CSNB1F, whose own synonyms embed the word
    "complete" (for example MONDO:0009758 carries "night blindness, congenital
    stationary (complete), 1B, autosomal recessive"); a search for
    "Schubert-Bornschein" returns nothing. Run 2026-09-25.
  evidence:
  - reference: PMID:42471459
    reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These genes include NYX, GRM6, TRPM1, GPR179, and LRIT3, and the resulting cCSNB phenotype is characterized by abnormally low-light vision, myopia, and nystagmus, but does not include retinal degeneration."
    explanation: >
      Names the five cCSNB signalplex genes and states the defining absence of
      retinal degeneration that separates this from the dystrophies.
- name: icCSNB
  display_name: Incomplete CSNB (Schubert-Bornschein, ON and OFF pathways)
  description: >
    The incomplete Schubert-Bornschein form, caused most often by CACNA1F
    variants affecting the Cav1.4 calcium channel at the photoreceptor ribbon
    synapse, or by CABP4. Because the lesion is presynaptic it impairs
    transmitter release to both ON and OFF bipolar pathways, so daytime acuity
    and cone function are affected as well as scotopic vision - the reason
    "incomplete" describes a broader, not a milder, deficit. As with the complete
    form this is an electroretinographic class with no MONDO term of its own; the
    CSNB2A and CSNB2B rows below carry the MONDO terms.
  evidence:
  - reference: PMID:24466230
    reference_title: "Photoreceptor degeneration in two mouse models for congenital stationary night blindness type 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in the human CACNA1F gene encoding the α1F subunit of Cav1.4 channels cause an incomplete form of X-linked congenital stationary night blindness (CSNB2)."
    explanation: >
      Assigns CACNA1F to the incomplete form and identifies the channel subunit
      involved.
- name: Riggs
  display_name: Riggs CSNB (rod phototransduction cascade)
  description: >
    The rarer Riggs form, in which the lesion is inside the rod photoreceptor
    rather than at its synapse - RHO, GNAT1, PDE6B, GNB3 or SLC24A1 - and the
    rod phototransduction cascade cannot generate or cannot terminate a light
    response. The a-wave is lost with the b-wave, distinguishing it
    electrophysiologically from the Schubert-Bornschein forms, and the fundus
    and daytime vision are normal. Like the two Schubert-Bornschein classes this
    is an electroretinographic grouping with no MONDO term of its own; the
    CSNBAD1, CSNBAD2, CSNBAD3, CSNB1D, CSNB1G and CSNB1H rows below carry the
    MONDO terms.
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "genes, mutated in patients with the Riggs form of CSNB have an important role in the rod phototransduction cascade"
    explanation: >
      Assigns the Riggs form specifically to the rod phototransduction cascade,
      which is what justifies conforming only this arm to the phototransduction
      module. Evidence source is OTHER because this is a review.
- name: Oguchi
  display_name: Oguchi disease (failure of rhodopsin shut-off)
  subtype_term:
    preferred_term: Oguchi disease
    term:
      id: MONDO:0019152
      label: Oguchi disease
  description: >
    A recessive form in which the rod generates a light response but cannot
    terminate it, because the two proteins that shut off activated rhodopsin are
    lost: rhodopsin kinase (GRK1) and arrestin (SAG). Dark adaptation of rods is
    extremely retarded while cone adaptation proceeds normally. Oguchi disease is
    the one arm of this entry in which the fundus is not normal: it shows the
    Mizuo-Nakamura phenomenon, a golden or gray-white retinal discolouration that
    appears on light adaptation and disappears in the dark-adapted state, so it is
    an explicit exception to the normal-fundus generalization the disease-level
    endpoint node records.
  genes:
  - preferred_term: SAG
    term:
      id: hgnc:10521
      label: SAG
  - preferred_term: GRK1
    term:
      id: hgnc:10013
      label: GRK1
  evidence:
  - reference: PMID:9020843
    reference_title: Defects in the rhodopsin kinase gene in the Oguchi form of stationary night blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As rhodopsin kinase works with arrestin in shutting off rhodopsin after it has been activated by a photon of light, it is reasonable to propose that some cases of Oguchi disease might be caused by defects in rhodopsin kinase."
    quote_role: BACKGROUND
    explanation: >
      States the shared shut-off function of the two Oguchi genes, which is what
      makes this a single mechanistic arm rather than two unrelated loci.
  - reference: PMID:7670478
    reference_title: A homozygous 1-base pair deletion in the arrestin gene is a frequent cause of Oguchi disease in Japanese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The course of dark adaptation of rod photoreceptors is extremely retarded in Oguchi disease while that of cones appears to proceed normally."
    quote_role: BACKGROUND
    explanation: >
      Establishes the rod-selective delay in dark adaptation that distinguishes
      this arm from a failure of response generation.
  - reference: PMID:7670478
    reference_title: A homozygous 1-base pair deletion in the arrestin gene is a frequent cause of Oguchi disease in Japanese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A typical clinical feature of the disorder is a golden or gray-white discolouration of the fundus which disappears in the dark-adapted state and reappears shortly after the onset of light"
    quote_role: BACKGROUND
    explanation: >
      The fundus finding that makes this arm an exception to the normal-fundus
      generalization the rest of the entry rests on.

    reference_title: "A Novel Heterozygous Missense Mutation in GNAT1 Leads to Autosomal Dominant Riggs Type of Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only few mutations in genes coding for proteins of the phototransduction cascade lead to this condition; most of these gene defects cause progressive rod-cone dystrophy."
    explanation: >
      Supports the general point that only a minority of phototransduction-gene
      alleles give stationary rather than degenerative disease, which is what
      distinguishes the CSNB-causing RHO variants from the far commoner
      RP-causing ones. The citation makes the cascade-wide point rather than
      naming the specific RHO alleles, so it supports the claim indirectly.
- name: SAG
  association: Biallelic loss-of-function variants causing Oguchi disease type 1
  subtype: Oguchi
  gene_term:
    preferred_term: SAG
    term:
      id: hgnc:10521
      label: SAG
  relationship_type: CAUSATIVE
  notes: >
    SAG encodes arrestin-1, which quenches photoactivated rhodopsin after
    rhodopsin kinase has phosphorylated it. A 1147delA frameshift is a founder
    allele accounting for most reported Japanese cases. Because the lesion is in
    the shutoff rather than the activation arm of the cascade, the rod response is
    generated and then fails to terminate, which is why Oguchi disease is
    curated here as a fourth mechanistic arm rather than inside the Riggs arm.
  evidence:
  - reference: PMID:7670478
    reference_title: A homozygous 1-base pair deletion in the arrestin gene is a frequent cause of Oguchi disease in Japanese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "in five out of six unrelated Japanese patients with Oguchi disease, we have identified a homozygous deletion of nucleotide 1147 (1147delA) in codon 309 of the arrestin gene"
    explanation: >
      The gene-discovery report, and the source of the founder-allele statement
      in the notes.
  - reference: PMID:7670478
    reference_title: A homozygous 1-base pair deletion in the arrestin gene is a frequent cause of Oguchi disease in Japanese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "arrestin, an intrinsic rod photoreceptor protein implicated in the recovery phase of light transduction"
    explanation: Sources the recovery-phase role the notes attribute to arrestin.
- name: GRK1
  association: Biallelic loss-of-function variants causing Oguchi disease type 2
  subtype: Oguchi
  gene_term:
    preferred_term: GRK1
    term:
      id: hgnc:10013
      label: GRK1
  relationship_type: CAUSATIVE
  notes: >
    GRK1 encodes rhodopsin kinase, the enzyme that phosphorylates photoactivated
    rhodopsin and so allows arrestin to bind it. HGNC records RHOK as a previous
    symbol for this gene, which is worth knowing when reading the older Oguchi
    literature. Loss of either GRK1 or SAG produces the same failure to quench,
    which is why the two loci share one mechanistic arm.
  evidence:
  - reference: PMID:9020843
    reference_title: Defects in the rhodopsin kinase gene in the Oguchi form of stationary night blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Our results indicate that null mutations in the rhodopsin kinase gene are a cause of Oguchi disease and extend the known genetic heterogeneity in congenital stationary night blindness."
    explanation: The gene-discovery report establishing GRK1 as the second Oguchi locus.
  - reference: PMID:9020843
    reference_title: Defects in the rhodopsin kinase gene in the Oguchi form of stationary night blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "As rhodopsin kinase works with arrestin in shutting off rhodopsin after it has been activated by a photon of light, it is reasonable to propose that some cases of Oguchi disease might be caused by defects in rhodopsin kinase."
    explanation: Sources the shared shut-off function that unites the two Oguchi loci.
- name: SLC24A1
  association: Biallelic loss-of-function variants causing CSNB1D
  subtype: Riggs
  gene_term:
    preferred_term: SLC24A1
    term:
      id: hgnc:10975
      label: SLC24A1
  relationship_type: CAUSATIVE
  notes: >
    SLC24A1 encodes NCKX1, the sodium-calcium-potassium exchanger that is thought
    to extrude from the rod outer segment the calcium admitted through the
    cGMP-gated channels. The mouse knockout has malformed outer-segment disks,
    reduced CNG channel function and a hundredfold reduction in rod responses with
    cone responses preserved, and its authors propose that the compensating loss
    of CNG channel function is what keeps the disorder stationary rather than
    degenerative.
  evidence:
  - reference: PMID:20850105
    reference_title: A mutation in SLC24A1 implicated in autosomal-recessive congenital stationary night blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sequencing of all the coding exons identified a 2 bp deletion in exon 2: c.1613_1614del, which is predicted to result in a frame shift that leads to premature termination of SLC24A1 (p.F538CfsX23) and segregates with the disorder under an autosomal-recessive model."
    explanation: The gene-discovery report, with recessive segregation in a multigeneration family.
  - reference: PMID:26246500
    reference_title: A new mouse model for stationary night blindness with mutant Slc24a1 explains the pathophysiology of the associated human disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The compensating loss of CNG channel function in the absence of NCKX1-mediated Ca(2+) extrusion may prevent toxic Ca(2+) buildup and provides an explanation for the stationary nature of the associated disorder in humans."
    explanation: >
      The authors' proposed account of why this locus is stationary, recorded in
      the notes as their proposal rather than as an established mechanism.
- name: PDE6B
  association: Heterozygous variants causing autosomal dominant CSNB (CSNBAD2)
  subtype: Riggs
  gene_term:
    preferred_term: PDE6B
    term:
      id: hgnc:8786
      label: PDE6B
  relationship_type: CAUSATIVE
  notes: >
    PDE6B encodes the beta catalytic subunit of rod cGMP phosphodiesterase. The
    dominant CSNB alleles are exceptional for this gene: the Rambusch p.His258Asn
    substitution desensitizes rods, and a truncating allele reported in a French
    family yields a product that still binds the inhibitory gamma subunit and so
    relieves inhibition of the normal catalytic subunits. Both leave the cascade
    constitutively active. HGNC records CSNBAD2 as an alias symbol for this gene,
    and PDEB as a previous symbol.
  evidence:
  - reference: PMID:24760071
    reference_title: A truncated form of rod photoreceptor PDE6 β-subunit causes autosomal dominant congenital stationary night blindness by interfering with the inhibitory activity of the γ-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The unique adCSNB-associated PDE6B mutation found in the Rambusch pedigree, the substitution p.His258Asn, leads to rod photoreceptors desensitization."
    explanation: Names the classical dominant allele and its effect on the rod.
  - reference: PMID:24760071
    reference_title: A truncated form of rod photoreceptor PDE6 β-subunit causes autosomal dominant congenital stationary night blindness by interfering with the inhibitory activity of the γ-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here, we report a three-generation French family with adCSNB harboring a novel PDE6B mutation"
    explanation: The second dominant PDE6B family, establishing the locus beyond one pedigree.
  - reference: PMID:24760071
    reference_title: A truncated form of rod photoreceptor PDE6 β-subunit causes autosomal dominant congenital stationary night blindness by interfering with the inhibitory activity of the γ-subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We hypothesize that in affected family members the p.Tyr314Cysfs*50 change results in the production of the truncated protein, which binds Pγ and causes constitutive activation of the phototransduction thus leading to the absence of rod adaptation."
    explanation: >
      The authors' mechanistic account of the truncating allele, which the notes
      records as their hypothesis.
- name: GUCY2D
  association: Biallelic hypomorphic variants causing CSNB1I, a rod-dominant dysfunction only partly matching CSNB
  gene_term:
    preferred_term: GUCY2D
    term:
      id: hgnc:4689
      label: GUCY2D
  relationship_type: CAUSATIVE
  notes: >
    MONDO records GUCY2D as the causal gene of MONDO:0032811 congenital stationary
    night blindness type 1I (OMIM:618555), and the clinical series behind that
    term is real: six patients from five families with longstanding night
    blindness, biallelic GUCY2D variants, absent or severely reduced rod
    electroretinographic components, and a stable course. Two reservations are
    recorded rather than resolved here. First, the authors describe the phenotype
    as a rod-cone dysfunction only similar to rare forms of stationary night
    blindness, and their patients had central macular hypopigmentation and
    temporal vascular attenuation, so the normal fundus that defines the rest of
    this entry does not hold. Second, an earlier biochemical study of the
    CSNB-associated alleles concluded that the loss of guanylyl cyclase activation
    it measured cannot account for a rod-selective deficit, so the mechanism
    linking these alleles to a rod-only phenotype is unexplained. No subtype
    foreign key is set because this locus belongs to none of the four
    electroretinographic arms this entry models. The Leber congenital amaurosis
    and CORD6 arms of GUCY2D disease are curated in GUCY2D-Related_Retinopathy.
  evidence:
  - reference: PMID:40478561
    reference_title: "Clinical and Biochemical Characterization of Specific GUCY2D Alleles Associated With a Rare Form of Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Molecular analyses revealed biallelic variants of GUCY2D in all patients, four of which are clinically and biochemically characterized for the first time, to our knowledge."
    explanation: >
      Establishes the gene-phenotype association in the case series that defines
      this locus clinically.
  - reference: PMID:40478561
    reference_title: "Clinical and Biochemical Characterization of Specific GUCY2D Alleles Associated With a Rare Form of Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The apparent lack of retinal degeneration, clinical features, predominant and severe rod photoreceptor involvement, and relatively high degree of ERG stability are similar to rare forms of SNB."
    explanation: >
      The authors' framing is a similarity claim, which is what the first
      reservation in the notes records.
  - reference: PMID:33109612
    reference_title: "GUCY2D mutations in retinal guanylyl cyclase 1 provide biochemical reasons for dominant cone-rod dystrophy but not for stationary night blindness."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The observed biochemical changes can explain the dominant CORD6 blindness and recessive LCA1 blindness, both of which affect rods and cones, but they cannot explain the selective loss of rod function in recessive CSNB."
    explanation: >
      Refutes the mechanistic half of this record's claim, not the association:
      the measured loss of guanylyl cyclase activation by GCAPs accounts for the
      cone-rod and LCA phenotypes but not for a rod-selective one, so a
      phototransduction-activation account of CSNB1I is unsupported.
treatments:
- name: Refractive Correction and Low-Vision Support
  description: >
    Because CSNB is stationary and does not degenerate, management is
    supportive: correction of the frequently high myopia, management of
    strabismus and amblyopia risk, low-vision aids where acuity is reduced, and
    counselling about night-time and low-light safety. There is no approved
    disease-modifying therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional ocular signs can be myopia, hyperopia, strabismus, nystagmus and reduced visual acuity."
    explanation: >
      Identifies the refractive and ocular-motor problems that constitute the
      substance of supportive management in this condition.
- name: AAV Gene Augmentation of the ON-Bipolar Signalplex (Investigational)
  description: >
    Subretinal AAV delivery of the missing signalplex component. Because the
    retina does not degenerate, the therapeutic window is not closed by
    childhood: LRIT3 delivered to mature Lrit3-null mouse retina reassembles the
    depolarizing bipolar cell signalling complex and rescues both retinal
    function and cortical visual acuity, and functional recovery has been
    sustained for up to 32 months in a canine LRIT3 model. That canine work also
    documented off-target transgene expression outside bipolar cells despite an
    engineered capsid and an ON-bipolar-specific promoter, which the authors
    identify as requiring optimization before clinical translation. Preclinical
    only; no human trial.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
    treatment_effect: RESTORES
    description: >
      Supplying the missing signalplex member reassembles the complex at the
      ON-bipolar dendritic tip, acting on the trigger lesion of the complete
      form.
    evidence:
    - reference: PMID:42471459
      reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that gene augmentation by expressing LRIT3 in Lrit3-/- retinas of mature mice restores the DBC synaptic signaling complex and is sufficient to rescue retinal function and improve visual acuity."
      explanation: >
        Demonstrates restoration of the signalling complex itself, not merely a
        functional readout, and does so in mature retina.
  evidence:
  - reference: PMID:37220680
    reference_title: "Extended functional rescue following AAV gene therapy in a canine model of LRIT3-congenital stationary night blindness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While the long-term therapeutic potential of AAVK9#4-shGRM6-cLRIT3-WPRE is promising, we highlight the necessity for further optimization of AAV-LRIT3 therapy in the canine CSNB model prior to its clinical application."
    explanation: >
      The authors' own conclusion: durable large-animal rescue, but explicit
      need for further optimization before clinical use. It establishes
      preclinical promise rather than clinical efficacy.
animal_models:
- name: Lrit3-null mouse model of complete CSNB
  species: Mouse
  genotype: Lrit3-/-
  description: >
    Loss of LRIT3 disassembles the depolarizing bipolar cell signalplex,
    reproducing the complete CSNB phenotype. Used to show that gene augmentation
    in the mature retina, rather than during development, is sufficient to
    restore function.
  publication: PMID:42471459
  modeled_mechanisms:
  - target: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
    relationship: RESCUES
    fidelity: MODERATE
    description: >
      Subretinal AAV-LRIT3 in mature Lrit3-null retina restores the signalplex
      and rescues retinal function and cortical visual acuity, establishing that
      the defect is correctable after development is complete.
    limitations: >
      Rescue was achieved by expressing LRIT3 in photoreceptors rather than in
      the ON-bipolar cells where the human signalplex sits, and the mouse lacks
      a fovea, so the acuity endpoints do not correspond to human central
      vision.

has_subtypes:
- name: cCSNB
  display_name: Complete CSNB (Schubert-Bornschein, ON pathway)
  subtype_term:
    preferred_term: congenital stationary night blindness 1A
    term:
      id: MONDO:0010690
      label: congenital stationary night blindness 1A
  description: >
    The complete Schubert-Bornschein form, caused by loss of a component of the
    mGluR6 signalplex at the dendritic tips of depolarizing (ON) bipolar cells -
    NYX, GRM6, TRPM1, GPR179 or LRIT3. Rod signalling to the ON pathway is
    abolished, the ON-pathway b-wave is absent, and the OFF pathway is spared.
    Night blindness is profound; there is no retinal degeneration.
  evidence:
  - reference: PMID:42471459
    reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These genes include NYX, GRM6, TRPM1, GPR179, and LRIT3, and the resulting cCSNB phenotype is characterized by abnormally low-light vision, myopia, and nystagmus, but does not include retinal degeneration."
    explanation: >
      Names the five cCSNB signalplex genes and states the defining absence of
      retinal degeneration that separates this from the dystrophies.
- name: icCSNB
  display_name: Incomplete CSNB (Schubert-Bornschein, ON and OFF pathways)
  subtype_term:
    preferred_term: congenital stationary night blindness 2A
    term:
      id: MONDO:0010241
      label: congenital stationary night blindness 2A
  description: >
    The incomplete Schubert-Bornschein form, caused most often by CACNA1F
    variants affecting the Cav1.4 calcium channel at the photoreceptor ribbon
    synapse, or by CABP4. Because the lesion is presynaptic it impairs
    transmitter release to both ON and OFF bipolar pathways, so daytime acuity
    and cone function are affected as well as scotopic vision - the reason
    "incomplete" describes a broader, not a milder, deficit.
  evidence:
  - reference: PMID:24466230
    reference_title: "Photoreceptor degeneration in two mouse models for congenital stationary night blindness type 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in the human CACNA1F gene encoding the α1F subunit of Cav1.4 channels cause an incomplete form of X-linked congenital stationary night blindness (CSNB2)."
    explanation: >
      Assigns CACNA1F to the incomplete form and identifies the channel subunit
      involved.
- name: Riggs
  display_name: Riggs CSNB (rod phototransduction cascade)
  subtype_term:
    preferred_term: congenital stationary night blindness autosomal dominant 1
    term:
      id: MONDO:0012498
      label: congenital stationary night blindness autosomal dominant 1
  description: >
    The rarer Riggs form, in which the lesion is inside the rod photoreceptor
    rather than at its synapse - RHO, GNAT1, PDE6B, GNB3 or SLC24A1 - and the
    rod phototransduction cascade cannot generate or cannot terminate a light
    response. The a-wave is lost with the b-wave, distinguishing it
    electrophysiologically from the Schubert-Bornschein forms, and the fundus
    and daytime vision are normal.
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "genes, mutated in patients with the Riggs form of CSNB have an important role in the rod phototransduction cascade"
    explanation: >
      Assigns the Riggs form specifically to the rod phototransduction cascade,
      which is what justifies conforming only this arm to the phototransduction
      module. Evidence source is OTHER because this is a review.
inheritance:
- name: Genetically heterogeneous
  description: >
    CSNB is inherited as an autosomal recessive trait (most complete and
    incomplete Schubert-Bornschein forms), X-linked recessive (NYX in cCSNB,
    CACNA1F in icCSNB), or autosomal dominant (several Riggs-form genes,
    including gain-of-function RHO and GNAT1 alleles). Mode of inheritance
    therefore does not identify the mechanistic arm and cannot substitute for
    electroretinography.
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mode of inheritance can be autosomal dominant (adCSNB), autosomal recessive (arCSNB) or X-chromosomal (XLCSNB)."
    explanation: >
      States the three inheritance modes across the CSNB group. Evidence source
      is OTHER because this is a review.
pathophysiology:
- name: Rod Phototransduction Cascade Defect (Riggs Arm)
  description: >
    In the Riggs form the causative variant sits in the rod phototransduction
    cascade itself - the visual pigment (RHO), the transducin subunits (GNAT1,
    GNB3), the phosphodiesterase (PDE6B), or the sodium-calcium exchanger that
    sets the outer-segment ion balance (SLC24A1). Some are loss-of-function and
    the rod cannot mount a response; some, notably the RHO G90D and T94I
    substitutions, are gain-of-function changes that keep the pigment
    constitutively active in darkness so the rod behaves as though it were
    permanently light-adapted. Either way the rod's own light response is
    abolished or desensitized, and the electroretinographic a-wave goes with it.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Phototransduction
    term:
      id: GO:0007602
      label: phototransduction
    modifier: ABNORMAL
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "genes, mutated in patients with the Riggs form of CSNB have an important role in the rod phototransduction cascade"
    explanation: >
      Directly assigns the Riggs-form genes to the rod phototransduction
      cascade, which is the claim this node and its module conformance rest on.
      Evidence source is OTHER because this is a review.
  - reference: PMID:27063057
    reference_title: "Biallelic Mutations in GNB3 Cause a Unique Form of Autosomal-Recessive Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Riggs CSNB demonstrates selective rod photoreceptor dysfunction and occurs due to mutations in genes encoding proteins involved in rod phototransduction cascade"
    explanation: >
      Independent confirmation, in a gene-discovery paper, that the Riggs form
      is a selective rod photoreceptor cascade defect.
  downstream:
  - target: Loss of Rod Light-Response Generation
    causal_link_type: DIRECT

- name: Loss of Rod Light-Response Generation
  description: >
    The rod fails to convert absorbed photons into the graded hyperpolarization
    that drives the rest of the visual pathway. Because the defect is inside the
    photoreceptor, the summed rod response that generates the scotopic a-wave is
    lost, and the b-wave falls secondarily for want of an input - the pattern
    that distinguishes this arm from the Schubert-Bornschein forms, where the
    a-wave survives.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Detection of light stimulus involved in visual perception
    term:
      id: GO:0050908
      label: detection of light stimulus involved in visual perception
    modifier: DECREASED
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  evidence:
  - reference: PMID:29850563
    reference_title: "A Novel Heterozygous Missense Mutation in GNAT1 Leads to Autosomal Dominant Riggs Type of Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant congenital stationary night blindness (adCSNB) is rare and results from altered phototransduction giving a Riggs type of electroretinogram (ERG) with loss of the rod a-wave and small b-waves."
    explanation: >
      Ties altered phototransduction to the a-wave-dominant electroretinographic
      signature this node asserts, in a molecularly confirmed adCSNB family.
  downstream:
  - target: Impaired Scotopic Vision with Normal Fundus
    causal_link_type: DIRECT

- name: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
  description: >
    The complete Schubert-Bornschein arm, and mechanistically NOT a
    phototransduction defect. In darkness photoreceptors release glutamate
    tonically onto depolarizing (ON) bipolar cells, where the metabotropic
    receptor GRM6 keeps the TRPM1 cation channel closed; light, by reducing
    glutamate release, opens TRPM1 and depolarizes the bipolar cell - a
    sign-inverting synapse. NYX, GRM6, TRPM1, GPR179 and LRIT3 form a single
    interdependent signalplex at the ON-bipolar dendritic tip, so loss of any
    one of them disassembles the complex and abolishes the inversion. The
    photoreceptor upstream is entirely normal.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ON-bipolar cell
    term:
      id: CL:0000749
      label: ON-bipolar cell
  biological_processes:
  - preferred_term: G protein-coupled glutamate receptor signaling pathway
    term:
      id: GO:0007216
      label: G protein-coupled glutamate receptor signaling pathway
    modifier: DECREASED
  - preferred_term: Synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37220680
    reference_title: "Extended functional rescue following AAV gene therapy in a canine model of LRIT3-congenital stationary night blindness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One type of CSNB is associated with defects in genes (NYX, GRM6, TRPM1, GPR179, and LRIT3) involved in the mGluR6 signaling cascade at the ON-BC dendritic tips."
    explanation: >
      Localizes the five complete-CSNB genes to the mGluR6 cascade at the
      ON-bipolar dendritic tip, which is the anatomical claim separating this
      node from the Riggs arm.
  - reference: PMID:42471459
    reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complete congenital stationary night blindness (cCSNB) is a genetically heterogeneous inherited retinal disease caused by mutations in one of several genes that are part of a large, interdependent depolarizing bipolar cell (DBC) signalplex required for normal synaptic signaling with photoreceptors."
    explanation: >
      Supports the specific claim that these genes act as one interdependent
      complex, which is why losing any single member produces the same
      phenotype.
  downstream:
  - target: Failure of Photoreceptor-to-Bipolar Signal Transmission
    causal_link_type: DIRECT

- name: Presynaptic Calcium Channel Defect at the Photoreceptor Ribbon Synapse
  description: >
    The incomplete Schubert-Bornschein arm. Cav1.4, encoded by CACNA1F, sits at
    the photoreceptor ribbon synapse and does two jobs: it gates the calcium
    influx that drives tonic glutamate release, and it organizes the synapse
    structurally. A loss-of-function variant therefore starves both the ON and
    the OFF bipolar pathways of input, which is why the incomplete form
    compromises daytime acuity and cone function as well as night vision. The
    lesion is presynaptic but still postphototransduction: the rod's light
    response itself is intact.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: DECREASED
  - preferred_term: Neurotransmitter secretion
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:24466230
    reference_title: "Photoreceptor degeneration in two mouse models for congenital stationary night blindness type 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Light-dependent conductance changes of voltage-gated Cav1.4 channels regulate neurotransmitter release at photoreceptor ribbon synapses."
    explanation: >
      Establishes the presynaptic function whose loss defines this node, and
      locates it at the ribbon synapse rather than in the outer segment.
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Genes mutated in patients with icCSNB, code for proteins important for glutamate neurotransmitter release at the synaptic cleft of the photoreceptors."
    explanation: >
      Assigns the incomplete-form genes specifically to presynaptic glutamate
      release, distinguishing them from the postsynaptic signalplex genes of the
      complete form. Evidence source is OTHER because this is a review.
  downstream:
  - target: Failure of Photoreceptor-to-Bipolar Signal Transmission
    causal_link_type: DIRECT

- name: Failure of Photoreceptor-to-Bipolar Signal Transmission
  description: >
    Both Schubert-Bornschein arms converge here: the photoreceptor generates a
    normal light response that fails to reach the inner retina. Because the
    a-wave is generated by the photoreceptor and the b-wave by the bipolar cells
    downstream, the result is the electronegative electroretinogram - a b-wave
    that falls below the a-wave. This waveform localizes the lesion to the inner
    retina or the photoreceptor-bipolar synapse, and it is the single most
    informative bedside test in CSNB because it partitions the disease group by
    mechanism before any sequencing is done. It is not specific to CSNB: X-linked
    retinoschisis and KCNV2-associated disease produce it too, by their own
    routes.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ON-bipolar cell
    term:
      id: CL:0000749
      label: ON-bipolar cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:42106701
    reference_title: "Electronegative electroretinography in inherited retinal disease: a systematic review of genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The electronegative electroretinogram (ERG)-in which the dark-adapted bright-flash b-wave amplitude falls below the a-wave (b: a ratio < 1.0)-localizes dysfunction to the inner retina or photoreceptor-bipolar synapse."
    explanation: >
      Defines the waveform quantitatively and states the anatomical
      localization this node asserts. Evidence source is OTHER because this is a
      systematic review.
  - reference: PMID:42106701
    reference_title: "Electronegative electroretinography in inherited retinal disease: a systematic review of genotype-phenotype correlations."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The most frequently reported associations were with genes causing congenital stationary night blindness (NYX, CACNA1F, TRPM1, GRM6, GPR179, CABP4, LRIT3), X-linked retinoschisis (RS1), and cone dystrophy with supernormal rod responses (KCNV2)."
    explanation: >
      Supports the discriminating value of the waveform while establishing the
      specificity caveat this node states. Marked PARTIAL because the same
      review rates the underlying evidence as high risk of bias.
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While the Riggs form represents a dysfunction of the rods, a signal transmission defect from photoreceptors to bipolar cell is described in patients with the more frequently occurring Schubert-Bornschein form."
    explanation: >
      States the transmission-versus-photoreceptor contrast that this node's
      placement, and the entry's selective module conformance, depend on.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Impaired Scotopic Vision with Normal Fundus
    causal_link_type: DIRECT

- name: Impaired Scotopic Vision with Normal Fundus
  description: >
    The shared clinical endpoint. Vision in dim light is impaired from birth and
    stays that way - the disease is stationary, and the fundus is essentially
    normal, which is why CSNB is missed or misattributed when
    electroretinography is not done. Accompanying signs are common and are what
    usually bring the child to attention: high myopia, nystagmus, strabismus and
    reduced acuity, the last most marked in the incomplete form where the cone
    pathway is involved too. There is no retinal degeneration, which both
    defines the group and, because the retina stays intact, keeps it treatable
    into adulthood.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  conforms_to: "phototransduction_cascade_dysfunction#Congenital Non-Progressive Photoreceptor Dysfunction"
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional ocular signs can be myopia, hyperopia, strabismus, nystagmus and reduced visual acuity."
    explanation: >
      Enumerates the accompanying ocular signs this node lists. Evidence source
      is OTHER because this is a review.
  - reference: PMID:42471459
    reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These genes include NYX, GRM6, TRPM1, GPR179, and LRIT3, and the resulting cCSNB phenotype is characterized by abnormally low-light vision, myopia, and nystagmus, but does not include retinal degeneration."
    explanation: >
      Supports the combination of impaired low-light vision with myopia and
      nystagmus, and the explicit absence of degeneration that this node treats
      as defining.

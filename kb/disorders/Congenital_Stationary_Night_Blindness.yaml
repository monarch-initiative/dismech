        reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We show that gene augmentation by expressing LRIT3 in Lrit3-/- retinas of mature mice restores the DBC synaptic signaling complex and is sufficient to rescue retinal function and improve visual acuity."
        explanation: >
          Reports the readout and its restoration directly.
    evidence:
    - reference: PMID:42471459
      reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Because of the non-progressive and recessive nature of cCSNB, we investigated the potential of a gene augmentation approach in the mature retina to improve retinal function and cortical visual acuity."
      explanation: >
        States the rationale that makes this model informative for the human
        mechanism: a stationary recessive disease leaves an intact retina to

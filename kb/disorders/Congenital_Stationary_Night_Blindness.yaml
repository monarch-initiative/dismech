    explanation: >
      Establishes the presynaptic function whose loss defines this node, and
      locates it at the ribbon synapse rather than in the outer segment.
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Genes mutated in patients with icCSNB, code for proteins important for glutamate neurotransmitter release at the synaptic cleft of the photoreceptors."
    explanation: >
      Assigns the incomplete-form genes specifically to presynaptic glutamate
      release, distinguishing them from the postsynaptic signalplex genes of the
      complete form. Evidence source is OTHER because this is a review.
  downstream:
  - target: Failure of Photoreceptor-to-Bipolar Signal Transmission

    follow-up to 32 months.
  publication: PMID:37220680
  modeled_mechanisms:
  - target: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
    relationship: RESCUES
    fidelity: MODERATE
    description: >
      Subretinal ON-bipolar-targeted AAV-LRIT3 produced durable functional
      recovery and restored the signalplex member TRPM1 in the outer plexiform
      layer of the treated area.

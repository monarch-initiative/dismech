- name: CSNB1D
  display_name: CSNB1D - SLC24A1 (OMIM:613830)
  subtype_term:
    preferred_term: congenital stationary night blindness 1D
    term:
      id: MONDO:0013450
      label: congenital stationary night blindness 1D
  description: >
    Autosomal recessive CSNB caused by biallelic SLC24A1 variants. SLC24A1
    encodes NCKX1, the exchanger thought to extrude from the rod outer segment
    the calcium admitted through the cGMP-gated channels, so the lesion is inside
    the photoreceptor rather than at the bipolar synapse and this locus is placed
    in the Riggs arm here. Note that OMIM and MONDO number it within the
    "complete" series - its MONDO synonym reads "night blindness, congenital
    stationary (complete), 1D, autosomal recessive" - and that numbering reflects
    series position rather than the mGluR6 cascade mechanism the other 1-series
    loci share.
  genes:
  - preferred_term: SLC24A1
    term:
      id: hgnc:10975
      label: SLC24A1
  evidence:
  - reference: PMID:20850105
    reference_title: A mutation in SLC24A1 implicated in autosomal-recessive congenital stationary night blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of all the coding exons identified a 2 bp deletion in exon 2: c.1613_1614del, which is predicted to result in a frame shift that leads to premature termination of SLC24A1 (p.F538CfsX23) and segregates with the disorder under an autosomal-recessive model."
    quote_role: PRIMARY_RESULT
    explanation: >
      The gene-discovery report: a truncating SLC24A1 allele segregating
      recessively in a multigeneration night-blindness family.
  - reference: PMID:26246500
    reference_title: A new mouse model for stationary night blindness with mutant Slc24a1 explains the pathophysiology of the associated human disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is thought that the concentration of Ca(2+) in rod outer segments is controlled by a dynamic balance between influx via cGMP-gated (CNG) channels and extrusion via Na(+)/Ca(2+), K(+) exchangers (NCKX1)."
    quote_role: BACKGROUND
    explanation: >
      The source of the hedged statement about NCKX1's role in the rod outer
      segment; the authors present it as the prevailing view rather than as a
      result of their own.
  - reference: PMID:26246500
    reference_title: A new mouse model for stationary night blindness with mutant Slc24a1 explains the pathophysiology of the associated human disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that the deletion of NCKX1 in mice results in malformed outer segment disks, suppressed expression and function of rod CNG channels and a subsequent 100-fold reduction in rod responses, while preserving normal cone responses."
    quote_role: PRIMARY_RESULT
    explanation: >
      Locates the lesion in the rod outer segment and shows cone responses are
      spared, which is why this row is placed in the Riggs arm despite its
      position in the numbered "complete" series.

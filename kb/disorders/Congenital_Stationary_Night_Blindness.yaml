      evidence_source: OTHER
      snippet: "While patients with cCSNB show a dysfunction of the ON-signaling pathway, patients with icCSNB show a dysfunction of the ON- and OFF-signaling pathways, affecting visual acuity as well."
      explanation: >
        States that acuity is affected in the incomplete form specifically, and
        attributes it to the joint ON and OFF involvement this node produces.

      is OTHER because this is a review.
  - reference: PMID:20301423
    reference_title: "X-Linked Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "X-linked congenital stationary night blindness (CSNB) is characterized by non-progressive retinal findings of reduced visual acuity ranging from 20/30 to 20/200; defective dark adaptation; refractive error, most typically myopia"
    explanation: >
      GeneReviews supplies the acuity range and confirms the non-progressive
      character and normal fundus that define this node, for the X-linked forms.
      Evidence source is OTHER because GeneReviews is an expert-curated clinical
      synthesis rather than a primary study.
  - reference: PMID:42471459
    reference_title: "Gene augmentation therapy successfully treats mice with complete congenital stationary night blindness (cCSNB), improving retinal function and visual acuity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These genes include NYX, GRM6, TRPM1, GPR179, and LRIT3, and the resulting cCSNB phenotype is characterized by abnormally low-light vision, myopia, and nystagmus, but does not include retinal degeneration."
    explanation: >
      Supports the combination of impaired low-light vision with myopia and
      nystagmus, and the explicit absence of degeneration that this node treats
      as defining.
  downstream:
  - target: Night Blindness
    causal_link_type: DIRECT
    description: >
      The shared clinical endpoint of the Riggs and both Schubert-Bornschein arms
      presents as impaired vision in dim light.
    evidence:
    - reference: PMID:37220680
      reference_title: "Extended functional rescue following AAV gene therapy in a canine model of LRIT3-congenital stationary night blindness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Congenital stationary night blindness (CSNB) is a group of inherited retinal diseases in which either rod-to-ON-bipolar cell (ON-BC) signaling, or rod function is affected leading to impaired vision under low light conditions."
      explanation: >
        States that both the transmission and the rod-function lesions lead to
        impaired low-light vision, which is the edge this asserts.

- name: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
  description: >
    The complete Schubert-Bornschein arm, and mechanistically NOT a
    phototransduction defect. In darkness photoreceptors release glutamate
    tonically onto depolarizing (ON) bipolar cells, where the metabotropic
    receptor GRM6 keeps the TRPM1 cation channel closed; light, by reducing
    glutamate release, opens TRPM1 and depolarizes the bipolar cell - a
    sign-inverting synapse. NYX, GRM6, TRPM1, GPR179 and LRIT3 form a single
    interdependent signalplex at the ON-bipolar dendritic tip, so loss of any
    one of them disassembles the complex and abolishes the inversion. The
    photoreceptor upstream is entirely normal.

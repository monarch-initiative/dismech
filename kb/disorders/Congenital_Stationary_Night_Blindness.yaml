    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Congenital stationary night blindness (CSNB) is a group of inherited retinal diseases in which either rod-to-ON-bipolar cell (ON-BC) signaling, or rod function is affected leading to impaired vision under low light conditions."
    explanation: >
      States impaired low-light vision as the defining consequence common to
      both mechanistic arms. VERY_FREQUENT is a Pattern C mapping of that
      definitional framing (docs/frequency-evidence-guidelines.md); no
      proportion is reported, and the band is defensible because impaired
      low-light vision is what defines membership of the group.

  - target: Reduced Visual Acuity
    causal_link_type: DIRECT
    description: >
      Because the lesion starves the OFF as well as the ON bipolar pathway, the
      incomplete form compromises daytime acuity, which the complete and Riggs
      forms generally spare.
    evidence:
    - reference: PMID:29390235
      reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."

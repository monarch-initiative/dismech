- name: Impaired Scotopic Vision with Normal Fundus
  description: >
    The shared clinical endpoint. Vision in dim light is impaired from birth and
    stays that way - the disease is stationary, and the fundus is essentially
    normal, which is why CSNB is missed or misattributed when
    electroretinography is not done. Accompanying signs are common and are what
    usually bring the child to attention: high myopia, nystagmus, strabismus and
    reduced acuity, the last most marked in the incomplete form where the cone
    pathway is involved too. There is no retinal degeneration, which both
    defines the group and, because the retina stays intact, keeps it treatable
    into adulthood.

    This node deliberately carries NO conforms_to. It is the shared endpoint of
    all three arms - the Riggs cascade lesion above it and both
    Schubert-Bornschein transmission lesions - so wiring it to
    phototransduction_cascade_dysfunction would silently readmit the very forms
    that module's scope note excludes, and would assert "photoreceptor
    dysfunction" of arms in which the photoreceptor is intact and the synapse is
    what fails. Module conformance for this entry is therefore confined to the
    two Riggs-arm nodes upstream, which is where the module's key conformance
    target sits.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional ocular signs can be myopia, hyperopia, strabismus, nystagmus and reduced visual acuity."
    explanation: >

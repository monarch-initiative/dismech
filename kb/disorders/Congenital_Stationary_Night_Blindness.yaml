- name: Failure of Rhodopsin Shut-Off in the Rod Outer Segment
  description: >
    The Oguchi arm, and the mirror image of the Riggs arm above: the rod
    generates a light response but cannot terminate it. Rhodopsin kinase (GRK1)
    phosphorylates photoactivated rhodopsin and arrestin (SAG) then quenches it,
    and the two work together, so a null allele in either leaves the pigment
    signalling after the stimulus has ended. The lesion is in the shutoff arm of
    the cascade rather than in its activation arm, which is why the
    electroretinographic and dark-adaptation signature differs from both the
    Riggs and the Schubert-Bornschein forms.

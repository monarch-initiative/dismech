- name: Canine LRIT3-CSNB model
  species: Dog
  genotype: LRIT3 loss of function
  description: >
    A naturally occurring large-animal model of complete CSNB, used for
    long-term evaluation of ON-bipolar-targeted AAV-LRIT3 gene therapy with
    follow-up to 32 months.
  publication: PMID:37220680
  modeled_mechanisms:
  - target: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
    relationship: RESCUES
    fidelity: MODERATE
    description: >
      Subretinal ON-bipolar-targeted AAV-LRIT3 produced durable functional
      recovery and restored the signalplex member TRPM1 in the outer plexiform
      layer of the treated area.
    limitations: >
      RNA in situ hybridization revealed off-target transgene expression in
      photoreceptors and in the inner nuclear and ganglion cell layers despite a
      mutant capsid and an improved ON-bipolar promoter, so the observed rescue
      cannot be attributed to ON-bipolar transduction alone.
    readouts:
    - name: TRPM1 restoration in the outer plexiform layer of the treated area
      target: mGluR6 Signalplex Defect at the ON-Bipolar Dendritic Tip
      direction: RESTORED
      interpretation: >
        Molecular evidence that supplying one signalplex member restores
        another, confirming the interdependence this mechanism node asserts.
      evidence:
      - reference: PMID:37220680
        reference_title: "Extended functional rescue following AAV gene therapy in a canine model of LRIT3-congenital stationary night blindness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Following subretinal administration of the therapeutic vector, expression of the LRIT3 transgene, as well as restoration of mGluR6 signaling cascade member TRPM1, were confirmed in the outer plexiform layer (OPL) of the treated area."
        explanation: >
          Reports the readout and its restoration in the treated retina.
    evidence:
    - reference: PMID:37220680
      reference_title: "Extended functional rescue following AAV gene therapy in a canine model of LRIT3-congenital stationary night blindness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Herein, we demonstrate long-term functional recovery and molecular restoration following subretinal injection of the ON-BC targeting AAV-LRIT3 vector in all eight treated eyes for up to 32 months."
      explanation: >
        Establishes durable rescue in all treated eyes, supporting this model as
        informative for the human mechanism.
discussions:
- discussion_id: csnb_stationary_label_versus_progressive_alleles
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is "stationary" a safe description of every CSNB genotype, given that some
    alleles in CSNB genes produce progressive photoreceptor degeneration?
  attaches_to:
  - "pathophysiology#Presynaptic Calcium Channel Defect at the Photoreceptor Ribbon Synapse"
  - "pathophysiology#Impaired Scotopic Vision with Normal Fundus"
  rationale: >-
    The absence of degeneration is treated as definitional for CSNB and is the
    basis for the claim that the retina remains treatable into adulthood. Yet
    both mouse models of CSNB2 - a loss-of-function Cacna1f line and a
    gain-of-function I756T line - showed progressive photoreceptor loss, worse
    in the gain-of-function line, and CACNA1F variants in humans present either
    as incomplete CSNB or as progressive cone-rod dystrophy. GNAT1 shows the
    same allelic split between stationary and degenerative outcomes. If
    stationarity is an allele-level rather than a gene-level property, then a
    CSNB diagnosis alone does not license indefinite deferral of intervention,
    and the therapeutic window argument needs qualifying per genotype.
  proposed_experiments:
  - experiment_id: csnb_longitudinal_oct_by_allele_class
    name: Longitudinal outer-retinal imaging in CSNB stratified by allele class
    description: >
      Follow molecularly defined CSNB cohorts with serial optical coherence
      tomography of the outer nuclear layer and ellipsoid zone, stratified by
      whether the variant is predicted loss of function or gating-altering, to
      test whether measurable photoreceptor loss occurs in any subgroup over a
      decade.

- name: Presynaptic Calcium Channel Defect at the Photoreceptor Ribbon Synapse
  description: >
    The incomplete Schubert-Bornschein arm. Cav1.4, encoded by CACNA1F, sits at
    the photoreceptor ribbon synapse and does two jobs: it gates the calcium
    influx that drives tonic glutamate release, and it organizes the synapse

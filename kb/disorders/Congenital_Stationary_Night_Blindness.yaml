- name: Failure of Photoreceptor-to-Bipolar Signal Transmission
  description: >
    Both Schubert-Bornschein arms converge here: the photoreceptor generates a
    normal light response that fails to reach the inner retina. Because the
    a-wave is generated by the photoreceptor and the b-wave by the bipolar cells
    downstream, the result is the electronegative electroretinogram - a b-wave
    that falls below the a-wave. This waveform localizes the lesion to the inner
    retina or the photoreceptor-bipolar synapse, and it is the single most
    informative bedside test in CSNB because it partitions the disease group by
    mechanism before any sequencing is done. It is not specific to CSNB: X-linked
    retinoschisis and KCNV2-associated disease produce it too, by their own
    routes.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ON-bipolar cell
    term:
      id: CL:0000749
      label: ON-bipolar cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:42106701
    reference_title: "Electronegative electroretinography in inherited retinal disease: a systematic review of genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The electronegative electroretinogram (ERG)-in which the dark-adapted bright-flash b-wave amplitude falls below the a-wave (b: a ratio < 1.0)-localizes dysfunction to the inner retina or photoreceptor-bipolar synapse."
    explanation: >
      Defines the waveform quantitatively and states the anatomical
      localization this node asserts. Evidence source is OTHER because this is a
      systematic review.
  - reference: PMID:42106701
    reference_title: "Electronegative electroretinography in inherited retinal disease: a systematic review of genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most frequently reported associations were with genes causing congenital stationary night blindness (NYX, CACNA1F, TRPM1, GRM6, GPR179, CABP4, LRIT3), X-linked retinoschisis (RS1), and cone dystrophy with supernormal rod responses (KCNV2)."
    explanation: >
      Supports the discriminating value of the waveform while establishing the
      specificity caveat this node states. The same review rates the underlying
      evidence as at high risk of bias, so read it as a consistency claim rather
      than a precision estimate.
  - reference: PMID:29390235
    reference_title: "[Overview of Congenital Stationary Night Blindness with Predominantly Normal Fundus Appearance]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While the Riggs form represents a dysfunction of the rods, a signal transmission defect from photoreceptors to bipolar cell is described in patients with the more frequently occurring Schubert-Bornschein form."
    explanation: >
      States the transmission-versus-photoreceptor contrast that this node's
      placement, and the entry's selective module conformance, depend on.
      Evidence source is OTHER because this is a review.
  - reference: PMID:42106701
    reference_title: "Electronegative electroretinography in inherited retinal disease: a systematic review of genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Electronegative ERG patterns were commonly described across the CSNB and XLRS literature, with the greatest consistency for complete CSNB and KCNV2."
    explanation: >
      Supports the edge from this node to the electronegative waveform, and
      records that the association is most consistent for the complete form.
      Evidence source is OTHER because this is a systematic review.
  - reference: PMID:20301423
    reference_title: "X-Linked Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic ERG findings can help distinguish between complete X-linked CSNB and incomplete X-linked CSNB."
    explanation: >
      Confirms independently that electroretinography, not genotype or symptom
      profile, is what separates the complete from the incomplete form - the
      claim this entry rests its subtype structure on. Evidence source is OTHER
      because GeneReviews is an expert-curated clinical synthesis.
  downstream:
  - target: Impaired Scotopic Vision with Normal Fundus
    causal_link_type: DIRECT
  - target: Electronegative Electroretinogram
    causal_link_type: DIRECT
    description: >
      The b-wave is generated downstream of the transmission failure while the
      a-wave is generated upstream of it, so the waveform inverts and the
      bright-flash b:a ratio falls below one.

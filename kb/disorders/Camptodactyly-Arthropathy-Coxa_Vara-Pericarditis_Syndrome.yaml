      explanation: Lubricin is undetectable in the blood of patients with CACP, confirming systemic absence of the protein.
- name: Lubricin Deficiency at Joint, Tendon and Serosal Surfaces
  biological_scale: MOLECULAR
  description: >-
    Lubricin is normally secreted by synovial lining fibroblasts and
    superficial zone chondrocytes into synovial fluid and onto the cartilage
    surface, and is also present on tendons and tendon sheaths and in the
    pericardial and pleural cavities. In CACP it is absent from these sites,
    removing boundary lubrication, an anti-adhesive surface coating, and a
    brake on synoviocyte growth.

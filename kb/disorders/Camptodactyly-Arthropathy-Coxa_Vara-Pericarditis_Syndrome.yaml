      snippet: "including the first case of homozygous complete deletion of exon 1 in the PRG4 gene"
      explanation: Reports the exon 1 deletion.
  - name: c.915delC
    description: Homozygous frameshift deletion in a boy whose presentation lacked camptodactyly.
    clinical_significance: PATHOGENIC
    type: frameshift_variant
    evidence:
    - reference: PMID:41780543
      reference_title: "Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome without Camptodactyly: A Pediatric Case and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing confirmed homozygous proteoglycan 4 (c.915delC) mutation."
      explanation: Reports the homozygous frameshift.
  - name: NM_005807.6:c.1910_1911delCT p.(Pro637ArgfsTer9)
    description: Previously described frameshift deletion, homozygous in two unrelated Turkish patients.
    clinical_significance: PATHOGENIC
    type: frameshift_variant
    evidence:
      - reference: PMID:40475173
        reference_title: "Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome Caused by Truncating Mutations in the Prg4 Gene: Case Series and Literature Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "A previously described deletion was detected in case 2 and case 3 in the homozygous state in the PRG4 gene (NM_005807.6: c.1910_1911delCT, p.Pro637ArgfsTer9, chr1-186276761-CT)."
        explanation: Reports the recurrent frameshift in two patients.
  - name: c.3756dup
    description: Homozygous duplication creating a premature stop codon, in Brazilian siblings.
    clinical_significance: PATHOGENIC
    type: frameshift_variant
    evidence:
      - reference: PMID:41626297
        reference_title: "From Misdiagnosis to Genetic Confirmation: A Brazilian Familial Report of Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome-A Case-Based Review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Whole-genome sequencing identified a homozygous c.3756dup mutation in the PRG4 gene, introducing a premature stop codon and truncating lubricin."
        explanation: Reports the truncating duplication.
  - name: c.4104T>A p.(Tyr1368Ter)
    description: Homozygous nonsense variant classified pathogenic by ACMG/AMP criteria.
    clinical_significance: PATHOGENIC
    type: nonsense_variant
    evidence:
      - reference: PMID:42482035
        reference_title: "Camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome masquerading as juvenile idiopathic arthritis: a case series with a novel PRG4 variant and emphasis on bone health."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "a homozygous nonsense variant (c.4104T > A; p.Tyr1368Ter) in the second which was absent from ClinVar and Varsome (accessed April 2026) and it was classified as pathogenic by ACMG/AMP"
        explanation: Reports the nonsense variant and its classification.
  evidence:
  - reference: PMID:10545950
    reference_title: "CACP, encoding a secreted proteoglycan, is mutated in camptodactyly-arthropathy-coxa vara-pericarditis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional-candidate approach, we identified mutations in a gene (CACP) encoding a secreted proteoglycan as the cause of CACP."
    explanation: The founding gene-disease association.
  - reference: PMID:38856641
    reference_title: "Thirteen Indians with camptodactyly-arthropathy-coxa vara-pericarditis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is caused by biallelic loss-of-function variants in PRG4"
    explanation: States the biallelic loss-of-function mechanism.
  - reference: PMID:16429407
    reference_title: "Novel PRG4 mutations underlie CACP in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No genotype/phenotype association was observed."
    explanation: Clinical variability is not explained by the PRG4 allele.
diagnosis:
- name: PRG4 sequencing
  description: >-
    Diagnosis is confirmed by finding biallelic PRG4 variants, usually by
    exome sequencing, often after years of treatment for presumed juvenile
    idiopathic arthritis.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38856641
    reference_title: "Thirteen Indians with camptodactyly-arthropathy-coxa vara-pericarditis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to elucidate disease-causing variants in all the probands."
    explanation: Exome sequencing identified the PRG4 variants in all probands.
- name: Normal inflammatory markers
  description: >-
    Erythrocyte sedimentation rate, C-reactive protein, rheumatoid factor and
    antinuclear antibodies are normal, which separates the syndrome from
    inflammatory arthritis.
  evidence:
  - reference: PMID:23290693
    reference_title: "Camptodactyly-arthropathy-coxavara-pericarditis syndrome in Saudi Arabia: clinical and molecular genetic findings in 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had normal inflammatory markers and the result for rheumatoid factor test was negative."
    explanation: Normal inflammatory markers in all 22 patients.
  - reference: PMID:41780543
    reference_title: "Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome without Camptodactyly: A Pediatric Case and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The erythrocyte sedimentation rate, C-reactive protein level, and antinuclear antibody test results were normal."
    explanation: Normal inflammatory and autoimmune markers in a further patient.
- name: Synovial fluid analysis
  description: >-
    Synovial fluid is non-inflammatory: viscous, clear to honey-coloured,
    sterile and with a low white cell count.
  evidence:
  - reference: PMID:41637065
    reference_title: "From Synovial Fluid to Musculoskeletal Ultrasound: A Portrayal of Joint Involvement in Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Synovial fluid was gelatinous, viscous, clear to honey-colored, and sterile."
    explanation: Describes the non-inflammatory synovial fluid of six genetically confirmed patients.
  - reference: PMID:41626297
    reference_title: "From Misdiagnosis to Genetic Confirmation: A Brazilian Familial Report of Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome-A Case-Based Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests showed normal inflammatory markers, and synovial fluid revealed low white cell counts."
    explanation: Low synovial white cell count with normal inflammatory markers.
- name: Pelvic radiography
  description: >-
    Radiographs show coxa vara, short broad femoral necks, flattened femoral
    heads, increased joint space and absence of erosions; large acetabular
    cysts are considered pathognomonic.
  diagnosis_term:
    preferred_term: pelvic radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:16037531
    reference_title: "Camptodactyly-arthropathy-coxa vara-pericarditis syndrome versus juvenile idiopathic arthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CACP syndrome should be considered in all patients who present with a noninflammatory arthropathy or with \"atypical juvenile idiopathic arthritis,\" particularly if radiographs reveal an absence of erosions."
    explanation: Radiographic absence of erosions points to CACP in a child with arthropathy.
- name: Musculoskeletal ultrasound
  description: >-
    Symmetric large-joint and tendon sheath effusions with hyperechoic foci
    and no intrasynovial Doppler signal favour CACP over polyarticular juvenile
    idiopathic arthritis.
  diagnosis_term:
    preferred_term: musculoskeletal ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:42327906
    reference_title: "Musculoskeletal ultrasound discriminating camptodactyly-arthropathy-coxa vara-pericarditis syndrome and juvenile idiopathic arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CACP is characterised by symmetrical large-joint effusions with hyperechoic foci and absence of intrasynovial DM signal, in contrast to inflammatory findings in JIA."
    explanation: Ultrasound features that separate CACP from juvenile idiopathic arthritis.
  - reference: PMID:41637065
    reference_title: "From Synovial Fluid to Musculoskeletal Ultrasound: A Portrayal of Joint Involvement in Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed marked grade 3 synovial effusion, circumferential synovial hypertrophy, and synovial thickening in all patients, without the power Doppler activity"
    explanation: Knee ultrasound in six patients shows effusion and synovial hypertrophy without Doppler activity.
- name: Lubricin assay in synovial fluid or blood
  description: >-
    Lubricin is absent from synovial fluid and blood of patients; a
    competition ELISA has been proposed as a blood test, but it is a research
    assay.
  evidence:
  - reference: PMID:25642942
    reference_title: "Anti-lubricin monoclonal antibodies created using lubricin-knockout mice immunodetect lubricin in several species and in patients with healthy and diseased joints."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating blood can be used in a diagnostic test for patients suspected of having CACP"
    explanation: Proposes blood lubricin measurement as a diagnostic test.
differential_diagnoses:
- name: Juvenile idiopathic arthritis
  description: >-
    The main misdiagnosis. Juvenile idiopathic arthritis shows inflammatory
    markers and Doppler hypervascularity; CACP has normal markers, no
    erosions, early camptodactyly and coxa vara, and does not respond to
    antirheumatic therapy.
  evidence:
  - reference: PMID:23290693
    reference_title: "Camptodactyly-arthropathy-coxavara-pericarditis syndrome in Saudi Arabia: clinical and molecular genetic findings in 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The referral diagnosis was inaccurate in all patients; juvenile idiopathic arthritis (JIA) was the referral diagnosis in majority of the patients."
    explanation: Most patients were first diagnosed with juvenile idiopathic arthritis.
  - reference: PMID:29397575
    reference_title: "Genotype-phenotype investigation of 35 patients from 11 unrelated families with camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen of our patients presented were referred for genetic evaluation with the initial diagnosis of JIA."
    explanation: Sixteen of 35 patients were initially diagnosed with juvenile idiopathic arthritis.
  - reference: PMID:40475173
    reference_title: "Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome Caused by Truncating Mutations in the Prg4 Gene: Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were exposed to biologic therapy due to recalcitrant JIA."
    explanation: All three Turkish patients received biologics under a juvenile idiopathic arthritis diagnosis.
- name: Tuberculous pericarditis
  description: >-
    When serosal disease comes first, constrictive pericarditis or pericardial
    effusion in a child may be attributed to tuberculosis before the joint
    disease appears.
  evidence:
  - reference: PMID:38955384
    reference_title: "Camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elder sister had pericardial effusion with constrictive pericarditis, underwent pericardiectomy and received empirical treatment for suspected tuberculosis."
    explanation: The pericardial disease was first treated as tuberculosis; CACP was recognised only after knee swelling developed.
treatments:
- name: Nonsteroidal anti-inflammatory drugs
  description: >-
    NSAIDs and simple analgesics give mild pain relief only; they do not alter
    the course of the arthropathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nonsteroidal anti-inflammatory drug
      term:
        id: NCIT:C257
        label: Nonsteroidal Antiinflammatory Drug
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Arthralgia
  evidence:
  - reference: PMID:23290693
    reference_title: "Camptodactyly-arthropathy-coxavara-pericarditis syndrome in Saudi Arabia: clinical and molecular genetic findings in 22 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, treatment was ineffective apart from mild pain relief."
    explanation: Treatment, including NSAIDs, gave only mild pain relief.
- name: Antirheumatic and biologic therapy
  description: >-
    Corticosteroids, methotrexate and TNF inhibitors are often given under a
    mistaken diagnosis of juvenile idiopathic arthritis and are ineffective,
    as the arthropathy is not inflammatory.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: etanercept
      term:
        id: CHEBI:4875
        label: etanercept
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Non-inflammatory arthropathy
  evidence:
  - reference: PMID:23290693
    reference_title: "Camptodactyly-arthropathy-coxavara-pericarditis syndrome in Saudi Arabia: clinical and molecular genetic findings in 22 patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "10 patients used antirheumatic drugs (prednisone and methotrexate) and two patients were treated with etanercept. In all patients, treatment was ineffective apart from mild pain relief."
    explanation: Antirheumatic drugs and etanercept were ineffective, which refutes their use for the arthropathy.
  - reference: PMID:41780543
    reference_title: "Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome without Camptodactyly: A Pediatric Case and Review of the Literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially diagnosed with polyarticular juvenile idiopathic arthritis, he received methotrexate and etanercept. Due to progressive gait issues and radiographic coxa vara, diagnosis was revised."
    explanation: Disease progressed on methotrexate and etanercept.
  - reference: PMID:40830943
    reference_title: "Juvenile idiopathic arthritis or skeletal dysplasia: first case report of camptodactyly-arthropathy-coxa vara-pericarditis from Iran."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite receiving treatment modalities such as non-steroidal anti-inflammatory drugs (NSAIDs), methotrexate, and corticosteroids, the patient experienced minimal improvement."
    explanation: Minimal improvement on NSAIDs, methotrexate and corticosteroids.
  - reference: PMID:42482035
    reference_title: "Camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome masquerading as juvenile idiopathic arthritis: a case series with a novel PRG4 variant and emphasis on bone health."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Both received multiple disease-modifying and biologic agents without clinical response."
    explanation: No response to disease-modifying and biologic agents in two further patients.
- name: Yttrium-90 radiosynovectomy
  description: A single intra-articular yttrium-90 injection was safe but gave no benefit in a small prospective series.
  treatment_term:
    preferred_term: intra-articular radiosynovectomy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Fibroblast-Like Synoviocyte Overgrowth
  evidence:
  - reference: PMID:28291008
    reference_title: "The Efficacy of Yttrium-90 Radiosynovectomy in Patients with Camptodactyly-Arthropathy-Coxa Vara-Pericarditis Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Yttrium-90 radiosynovectomy seems to be a safe and well tolerated procedure, however, it did not show a beneficial therapeutic effect in arthropathy of CACP syndrome with the given dosage and interval."
    explanation: No therapeutic benefit was observed.
- name: Physiotherapy
  description: Range-of-motion exercise to preserve joint mobility.
  treatment_term:
    preferred_term: physiotherapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Limitation of joint mobility
  evidence:
  - reference: PMID:27748313
    reference_title: "Pathognomonic acetabular cysts in camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight months after the first visit, there was slight improvement in the range of motion of knees and hips."
    explanation: Single case with slight improvement in range of motion after physiotherapy.
- name: Total hip arthroplasty
  description: Hip replacement for debilitating hip arthropathy, including in adolescents.
  treatment_term:
    preferred_term: total hip arthroplasty
    term:
      id: NCIT:C157876
      label: Hip Replacement
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Progressive Cartilage Wear and Precocious Joint Failure
  evidence:
  - reference: PMID:22386609
    reference_title: "Total hip arthroplasty in adolescents with severe hip arthropathy and dysplasia associated with camptodactyly-arthropathy-coxa vara-pericarditis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we feel that total hip arthroplasty is a reasonable treatment option for adolescents with debilitating hip arthropathy associated with CACP syndrome"
    explanation: Good postoperative outcome in adolescent siblings.
- name: Pericardiectomy
  description: Surgical removal of the pericardium for constrictive pericarditis, also used to stop secondary protein-losing enteropathy.
  treatment_term:
    preferred_term: Pericardiectomy
    term:
      id: NCIT:C51643
      label: Pericardiectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Constrictive pericarditis
  evidence:
  - reference: PMID:27224999
    reference_title: "Protein-losing enteropathy in camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As constrictive pericarditis with subsequent PLE was the best explanation for the excessive IgG losses, pericardiectomy was performed with good results."
    explanation: Pericardiectomy was performed with good results.
- name: Recombinant lubricin supplementation (preclinical)
  description: >-
    Intra-articular recombinant human PRG4 restores boundary lubrication and
    reduces chondrocyte apoptosis in lubricin-null mice and cartilage
    explants. It has not been tested in patients.
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Loss of Cartilage Boundary Lubrication and Increased Joint Friction
  - target: Friction-Induced Superficial Chondrocyte Apoptosis
  evidence:
  - reference: PMID:28604608
    reference_title: "Friction-Induced Mitochondrial Dysregulation Contributes to Joint Deterioration in Prg4 Knockout Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "intra-articular injection of human PRG4 in vivo in Prg4-/- mice prevented caspase-3 activation in superficial zone chondrocytes and was associated with a modest decrease in whole joint friction measured ex vivo"
    explanation: Recombinant PRG4 reduces chondrocyte apoptosis and friction in the knockout.
  - reference: PMID:35457064
    reference_title: "Quadruped Gait and Regulation of Apoptotic Factors in Tibiofemoral Joints following Intra-Articular rhPRG4 Injection in Prg4 Null Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There were significantly fewer caspase-3-positive chondrocytes in tibiofemoral cartilage from rhPRG4-injected mice."
    explanation: Replicates the anti-apoptotic effect of injected rhPRG4.
  - reference: PMID:23530215
    reference_title: "Role of lubricin and boundary lubrication in the prevention of chondrocyte apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the bovine explant system, the addition of lubricin as a test lubricant significantly lowered the static coefficient of friction and number of apoptotic chondrocytes."
    explanation: Added lubricin lowers friction and chondrocyte apoptosis in explants.
  - reference: PMID:28129516
    reference_title: "Intra-articular Recombinant Human Proteoglycan 4 Mitigates Cartilage Damage After Destabilization of the Medial Meniscus in the Yucatan Minipig."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The rhPRG4 group had significantly less macroscopic cartilage damage in the medial tibial plateau compared with the PBS group"
    explanation: In a large-animal post-traumatic model, intra-articular rhPRG4 reduced cartilage damage; indirect for CACP because the minipigs were not lubricin deficient.
animal_models:
- name: Prg4-null mouse (Rhee 2005)
  species: Mouse
  genotype: Prg4 homozygous null
  publication: PMID:15719068
  description: >-
    Viable and fertile, with normal joints at birth; with age develops
    cartilage surface protein deposits, loss of superficial chondrocytes,
    cartilage deterioration, synovial intimal hyperplasia, and tendon sheath
    changes with calcification.
  modeled_mechanisms:
  - target: Fibroblast-Like Synoviocyte Overgrowth
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    evidence:
    - reference: PMID:15719068
      reference_title: "The secreted glycoprotein lubricin protects cartilage surfaces and inhibits synovial cell overgrowth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "intimal cells in the synovium surrounding the joint space became hyperplastic, which further contributed to joint failure"
      explanation: The knockout reproduces synovial hyperplasia.
  - target: Progressive Cartilage Wear and Precocious Joint Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    evidence:
    - reference: PMID:15719068
      reference_title: "The secreted glycoprotein lubricin protects cartilage surfaces and inhibits synovial cell overgrowth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition to cartilage surface changes and subsequent cartilage deterioration"
      explanation: The knockout reproduces progressive cartilage deterioration.
  - target: Tendon and Tendon Sheath Surface Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Tendon changes were described at the ankle; finger flexor tendons and camptodactyly were not reported in the mouse.
    evidence:
    - reference: PMID:15719068
      reference_title: "The secreted glycoprotein lubricin protects cartilage surfaces and inhibits synovial cell overgrowth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tendon and tendon sheath involvement was present in the ankle joints, where morphologic changes and abnormal calcification of these structures were observed."
      explanation: Tendon and sheath lesions in the knockout.
- name: Prg4-null mouse (Coles 2010, hip)
  species: Mouse
  genotype: Prg4 homozygous null
  publication: PMID:20191580
  description: Femoral head cartilage of a Prg4-null line shows an age-dependent rise in friction, loss of stiffness and osteoarthritis-like degeneration.
  modeled_mechanisms:
  - target: Loss of Cartilage Boundary Lubrication and Increased Joint Friction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    evidence:
    - reference: PMID:20191580
      reference_title: "Loss of cartilage structure, stiffness, and frictional properties in mice lacking PRG4."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Friction was significantly higher on cartilage of Prg4(-/-) mice at age 16 weeks, but statistically significant differences in friction were not detected at younger ages."
      explanation: Increased cartilage friction in the knockout hip.
notes: >-
  No GeneReviews chapter exists for this disease (PubMed searches for
  camptodactyly[TI], PRG4 and CACP, each restricted to genereviews[book],
  returned no records). The broader Camptodactyly entry covers camptodactyly
  as a sign across syndromes and also discusses PRG4; this entry is the
  disease-level record for CACP syndrome. A congenital cataract reported in
  one Emirati patient (PMID:22678705) is a single observation and is not
  listed as a phenotype. MONDO also lists the eponym Jacobs syndrome as a
  synonym; it is left out of the synonyms here because the same name is in
  common use for 47,XYY syndrome (the StatPearls chapter titled Jacobs
  Syndrome is about 47,XYY). Mitral stenosis requiring commissurotomy has
  been reported in a single child (PMID:38523390) and is not listed as a
  phenotype.

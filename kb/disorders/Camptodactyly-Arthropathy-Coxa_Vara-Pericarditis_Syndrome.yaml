- name: Loss of Cartilage Boundary Lubrication and Increased Joint Friction
  biological_scale: TISSUE
  description: >-
    Without lubricin, the articular surface loses its boundary lubricant and
    proteins deposit on the cartilage. Whole-joint and cartilage-surface
    friction rise, and the surface layer becomes enlarged, fragmented and
    roughened. Joints are normal at birth and the changes accumulate with age.
  biological_processes:
  - preferred_term: cartilage homeostasis
    modifier: DECREASED
    term:
      id: GO:1990079
      label: cartilage homeostasis
  evidence:
  - reference: PMID:17968947
    reference_title: "Association between friction and wear in diarthrodial joints lacking lubricin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Joints of lubricin-null mice showed early wear and higher friction than joints from their wild-type counterparts."
    explanation: Direct measurement of increased friction and early wear in lubricin-null joints.
  - reference: PMID:20191580
    reference_title: "Loss of cartilage structure, stiffness, and frictional properties in mice lacking PRG4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Friction was significantly higher on cartilage of Prg4(-/-) mice at age 16 weeks, but statistically significant differences in friction were not detected at younger ages."
    explanation: An independent Prg4-null line shows an age-dependent rise in cartilage friction.
  - reference: PMID:15719068
    reference_title: "The secreted glycoprotein lubricin protects cartilage surfaces and inhibits synovial cell overgrowth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As the mice aged, we observed abnormal protein deposits on the cartilage surface and disappearance of underlying superficial zone chondrocytes."
    explanation: Surface protein deposition and loss of superficial chondrocytes develop with age in lubricin-null joints.
  downstream:
  - target: Friction-Induced Superficial Chondrocyte Apoptosis
    causal_link_type: DIRECT
    evidence:

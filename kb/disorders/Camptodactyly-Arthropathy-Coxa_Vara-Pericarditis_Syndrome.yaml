- name: Fibroblast-Like Synoviocyte Overgrowth
  biological_scale: CELLULAR
  description: >-
    The synovial lining becomes hypercellular. Proliferating cells are
    fibroblastic synoviocytes, and the lining is infiltrated by CD68-positive
    macrophages including multinucleated giant cells; lymphocytes and
    neutrophils are sparse, so the synovitis is proliferative rather than
    inflammatory.

    reference_title: "The camptodactyly-arthropathy-coxa vara-pericarditis syndrome: clinical features and genetic mapping to human chromosome 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genome-wide search for linkage identified homozygosity for a series of genetic markers on human chromosome 1q in all affected patients."
    explanation: Homozygosity mapping in consanguineous kindreds is the segregation pattern of a recessive disorder.

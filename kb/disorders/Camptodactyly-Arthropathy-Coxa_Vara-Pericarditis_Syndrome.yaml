pathophysiology:
- name: PRG4 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Disease-causing PRG4 alleles are almost all frameshift or nonsense
    variants, with a whole-exon-1 deletion also reported, found in homozygous
    or compound heterozygous state. Synovial fluid from patients with
    truncating alleles contains no detectable lubricin. One stop-gain in the
    last exon is predicted to escape nonsense-mediated decay, but the
    truncated protein is not processed normally.
  genes:
  - preferred_term: PRG4
    term:
      id: hgnc:9364
      label: PRG4
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:10545950
    reference_title: "CACP, encoding a secreted proteoglycan, is mutated in camptodactyly-arthropathy-coxa vara-pericarditis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional-candidate approach, we identified mutations in a gene (CACP) encoding a secreted proteoglycan as the cause of CACP."
    explanation: Identifies PRG4 (originally named CACP) as the disease gene.
  - reference: PMID:16429407
    reference_title: "Novel PRG4 mutations underlie CACP in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because all mutations reported in CACP patients thus far predict premature truncation"
    explanation: The disease alleles are truncating, consistent with loss of function.
  - reference: PMID:16000300
    reference_title: "Consequences of disease-causing mutations on lubricin protein synthesis, secretion, and post-translational processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the antiserum did not detect lubricin in synovial fluid or cultured synoviocytes from several patients with frameshift or nonsense mutations in PRG4."
    explanation: Truncating alleles result in absent lubricin protein in patient synovial fluid and synoviocytes.
  - reference: PMID:16000300
    reference_title: "Consequences of disease-causing mutations on lubricin protein synthesis, secretion, and post-translational processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "one disease-causing mutation that removes the last 8 amino acids of the protein, including a conserved cysteine residue, was not cleaved within the hemopexin-like domain when expressed in COS-7 cells"
    explanation: A last-exon truncation that may escape decay still yields abnormally processed protein.
  - reference: PMID:29397575
    reference_title: "Genotype-phenotype investigation of 35 patients from 11 unrelated families with camptodactyly-arthropathy-coxa vara-pericarditis (CACP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort, our molecular screening identified six frame shift mutations, two nonsense mutations, and the first case of homozygous deletion of exon 1."
    explanation: Extends the truncating allele spectrum and adds a whole-exon deletion.
  downstream:

  biological_scale: TISSUE
  description: >-
    In a minority of patients the pericardium and pleura develop
    non-inflammatory effusions, and the pericardium can thicken and constrict.
    Ascites also occurs. The mechanism is presumed to parallel the joint
    disease, with loss of the anti-adhesive serosal lubricant, but it has not
    been investigated directly.

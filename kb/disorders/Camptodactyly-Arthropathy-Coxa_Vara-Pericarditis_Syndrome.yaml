      reference_title: "Role of lubricin and boundary lubrication in the prevention of chondrocyte apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we observed a direct correlation between coefficient of friction and chondrocyte apoptosis in the superficial layers of cartilage"
      explanation: In a cartilage-on-cartilage explant system, friction tracks chondrocyte apoptosis in the superficial layers.
- name: Friction-Induced Superficial Chondrocyte Apoptosis
  biological_scale: CELLULAR
  conforms_to: "osteoarthritis_cartilage_degradation#Mechanical Overload and Chondrocyte Stress"
  description: >-
    Unlubricated loading stresses superficial and upper intermediate zone
    chondrocytes, which undergo intrinsic (mitochondrial) apoptosis with
    caspase-9 and caspase-3 activation and accumulation of peroxynitrite and
    superoxide. In the conserved osteoarthritis cascade this is the
    chondrocyte stress step; here the trigger is loss of boundary lubrication
    rather than malalignment or injury.
  cell_types:

- name: ATP1A3-Dependent Cardiac Conduction Dysfunction
  biological_scale: TISSUE
  description: >-
    ATP1A3 is expressed in cardiac conduction tissue in addition to neurons.
    A multicenter cohort found frequent resting and Holter ECG repolarization
    or conduction abnormalities across the ATP1A3-related syndrome spectrum
    (AHC, RDP, CAPOS), with dynamic serial-ECG changes and normal
    echocardiography (a primary electrical, not structural, disease). An
    Atp1a3 knock-in mouse showed baseline intracardiac conduction delay that
    progressed to heart block or complete sinus arrest during induced
    seizures, causing sudden death - a seizure-triggered mechanism for sudden
    cardiac death that parallels the human life-threatening-arrhythmia risk
    identified in this cohort.
  locations:
  - preferred_term: cardiac conduction system
    term:
      id: UBERON:0002350
      label: conducting system of heart
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:32913013
    reference_title: "Cardiac phenotype in ATP1A3-related syndromes: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first Holter ECG was abnormal in 24 of 65 (37%) cases with AHC and RDP with either repolarization or conduction abnormalities."
    explanation: >-
      Documents frequent conduction/repolarization ECG abnormalities across
      the ATP1A3-related syndrome spectrum, consistent with a shared
      pump-driven cardiac conduction lesion.
  - reference: PMID:32913013
    reference_title: "Cardiac phenotype in ATP1A3-related syndromes: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the mouse model, resting ECGs showed intracardiac conduction delay; during induced seizures, heart block or complete sinus arrest led to death."
    explanation: >-
      An Atp1a3 knock-in mouse model directly demonstrates the causal
      mechanism linking seizures to fatal cardiac conduction failure,
      distinct from the human cohort's ECG association data.
  downstream:
  - target: Abnormal EKG
    causal_link_type: DIRECT
    description: >-
      Impaired Na+/K+-ATPase function in cardiac conduction tissue produces
      resting and Holter ECG abnormalities.

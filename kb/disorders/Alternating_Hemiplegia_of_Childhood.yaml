- name: Cardiac conduction surveillance
  action_category: MONITORING
  description: >-
    Given the risk of life-threatening cardiac rhythm abnormalities
    identified in a multicenter ATP1A3-related-syndrome cohort, periodic
    electrocardiographic evaluation is warranted to identify patients at
    higher risk of conduction-related sudden cardiac death who may benefit
    from a pacemaker or implantable cardioverter-defibrillator.
  treatment_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clarification of the genetic status of apparently asymptomatic older and younger at-risk relatives is appropriate to identify as early as possible those who should be evaluated for cardiac conduction abnormalities and who should be advised about agents/circumstances to avoid."
    explanation: >-
      GeneReviews recommends evaluation for cardiac conduction abnormalities
      in ATP1A3-related disorder, supporting periodic ECG assessment.
  - reference: PMID:32913013
    reference_title: "Cardiac phenotype in ATP1A3-related syndromes: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide guidance to identify patients potentially at higher risk of sudden cardiac death who may benefit from insertion of a pacemaker or implantable cardioverter-defibrillator."
    explanation: >-
      Provides the clinical rationale for ECG-based cardiac surveillance:
      identifying AHC patients at higher risk of sudden cardiac death who
      may need device therapy.

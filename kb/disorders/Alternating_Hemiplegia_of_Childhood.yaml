- name: Abnormal EKG
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    A multicenter ATP1A3-related-syndrome cohort found frequent resting ECG
    abnormalities in AHC, with dynamic changes on serial ECGs and a small but

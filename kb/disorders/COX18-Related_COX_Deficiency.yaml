      disease name rather than a reported observation.
genetic:
- name: COX18 pathogenic variants causing COX deficiency
  gene_term:
    preferred_term: COX18
    term:
      id: hgnc:26801
      label: COX18
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:37468577
      reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Whole exome sequencing allowed the prioritization of the unreported homozygous substitution NM_001297732.2:c.667 G > C p.(Asp223His) in COX18.
      explanation: >-
        Reports the homozygous COX18 substitution in the single proband, which is
        consistent with autosomal recessive inheritance; parental segregation is
        not stated in the abstract.
  features: >
    A biallelic COX18 variant impairs COX2 maturation, causing isolated Complex
    IV deficiency with neonatal encephalo-cardio-myopathy and axonal sensory
    neuropathy.
  evidence:
  - reference: PMID:37468577
    reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole exome sequencing allowed the prioritization of the unreported homozygous substitution NM_001297732.2:c.667 G > C p.(Asp223His) in COX18.
    explanation: Identifies the specific homozygous COX18 variant establishing COX18 as the causal gene in this disorder.

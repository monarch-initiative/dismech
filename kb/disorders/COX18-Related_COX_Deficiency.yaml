name: COX18-Related COX Deficiency
category: Mendelian
creation_date: "2026-05-30T00:00:00Z"
synonyms:
- COX18 deficiency
- COX18-related cytochrome c oxidase deficiency
- Isolated complex IV deficiency due to COX18
- mitochondrial complex 4 deficiency, nuclear type 25
- MC4DN25
description: >
  COX18-related COX deficiency is a nuclear form of isolated cytochrome c
  oxidase (COX, Complex IV) deficiency caused by biallelic variants in COX18, an
  assembly factor required for maturation and membrane insertion of the
  mtDNA-encoded subunit COX2 (MT-CO2). Reported in 2023 in a single patient, it
  presents as a neonatal encephalo-cardio-myopathy with hypertrophic
  cardiomyopathy, infantile myopathy, axonal sensory neuropathy, and failure to
  thrive. It conforms to the conserved Complex IV assembly deficiency mechanism,
  with the defect localized to COX2 maturation.
disease_term:
  preferred_term: COX18-related COX deficiency (MC4DN25)
  term:
    id: MONDO:0980970
    label: mitochondrial complex 4 deficiency, nuclear type 25
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian, autosomal recessive nuclear-gene mitochondrial disorder; Harrison's
      covers primary mitochondrial disease under the genetics/environment Part.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of energy metabolism (isolated respiratory chain Complex IV
      deficiency) presenting with lactic acidosis.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      Nuclear-encoded defect of mitochondrial respiratory chain Complex IV
      biogenesis; a primary mitochondrial disease.
  icimd_category:
  - classification_value: complex_iv_subunits_and_assembly_factors
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nuclear-encoded complex IV
      subunit and assembly factor defects" under category "Disorders of
      nuclear-encoded oxidative phosphorylation". COX18 is a nuclear-encoded COX
      assembly factor required for maturation and membrane insertion of the
      mtDNA-encoded COX2 subunit.
pathophysiology:
- name: COX18 Loss and Defective COX2 Maturation
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  description: >
    Biallelic COX18 variants impair maturation and membrane insertion of the
    mtDNA-encoded COX2 subunit, preventing assembly of a functional Complex IV
    holoenzyme.
  genes:
  - preferred_term: COX18
    term:
      id: hgnc:26801
      label: COX18
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:37468577
    reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biochemical and enzymatic studies in patient's myoblasts and in HEK293 cells after COX18 silencing showed a severe impairment of both COX activity and assembly.
    explanation: Reports the direct biochemical measurement of impaired COX assembly in cultured patient myoblasts and an independent HEK293 COX18-silencing arm.
  downstream:
  - target: Impaired Terminal Electron Transfer and ATP Synthesis
    causal_link_type: DIRECT
    description: Failure to mature COX2 prevents formation of a catalytically competent enzyme.
    evidence:
    - reference: PMID:37468577
      reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Biochemical and enzymatic studies in patient's myoblasts and in HEK293 cells after COX18 silencing showed a severe impairment of both COX activity and assembly.
      explanation: Loss of COX18 impairs both assembly and catalytic COX activity, linking the biogenesis defect directly to loss of terminal electron transfer.
- name: Impaired Terminal Electron Transfer and ATP Synthesis
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  description: >
    Loss of functional COX blocks electron transfer from cytochrome c to oxygen
    and proton pumping, collapsing oxidative ATP synthesis, with prominent
    cardiac, muscle, and peripheral nerve involvement.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  - preferred_term: ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  evidence:
  - reference: PMID:10545952
    reference_title: "Fatal infantile cardioencephalomyopathy with COX deficiency and mutations in SCO2, a COX assembly gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mammalian cytochrome c oxidase (COX) catalyses the transfer of reducing equivalents from cytochrome c to molecular oxygen and pumps protons across the inner mitochondrial membrane.
    explanation: Defines the terminal electron-transfer function lost in COX18-related COX deficiency.
  downstream:
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy failure in cardiomyocytes drives hypertrophic cardiomyopathy.
    evidence:
    - reference: PMID:19682572
      reference_title: "Cytochrome c oxidase deficiency: patients and animal models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Human diseases associated with COX deficiency including encephalomyopathies, Leigh syndrome, hypertrophic cardiomyopathies, and fatal lactic acidosis are caused by mutations in COX subunits or assembly factors.
      explanation: Review establishes hypertrophic cardiomyopathy as a recognised consequence of COX (Complex IV) deficiency arising from assembly-factor mutations.
  - target: Peripheral neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bioenergetic deficit in peripheral nerve produces axonal sensory neuropathy.
    evidence:
    - reference: PMID:37468577
      reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The proband is a 19-months old female displaying hypertrophic cardiomyopathy at birth and myopathy with axonal sensory neuropathy and failure to thrive developing in the first months of life.
      explanation: Documents the axonal sensory neuropathy directly as an observed finding in the COX18 proband, rather than as a stated aim of the study.
  - target: Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Bioenergetic failure in nervous tissue contributes to neonatal encephalopathy in COX18-related disease.
    evidence:
    - reference: PMID:37468577
      reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Pathogenic variants impacting upon assembly of mitochondrial respiratory chain Complex IV (Cytochrome c Oxidase or COX) predominantly result in early onset mitochondrial disorders often leading to CNS, skeletal and cardiac muscle manifestations.
      explanation: Places CNS manifestations downstream of Complex IV assembly failure, the mechanism operating in COX18-related disease.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Severe multisystem energy failure in neonatal COX18-related disease contributes to failure to thrive.
    evidence:
    - reference: PMID:37468577
      reference_title: "A biallelic variant in COX18 cause isolated Complex IV deficiency associated with neonatal encephalo-cardio-myopathy and axonal sensory neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The proband is a 19-months old female displaying hypertrophic cardiomyopathy at birth and myopathy with axonal sensory neuropathy and failure to thrive developing in the first months of life.
      explanation: Documents failure to thrive developing alongside the multisystem energy-failure phenotype in the COX18 proband.

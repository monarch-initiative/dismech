notes: >-
  Scope note on the mechanism graph. This entry deliberately carries a node whose
  content is an acknowledged unknown. In most patients no coding material is lost,
  so there is no causal gene to name, and the graph runs from the ring itself to
  a hub node representing cortical network dysfunction whose molecular basis has
  not been established. Two specific candidate explanations have been actively
  tested and disfavoured, deletion of candidate genes on chromosome 20 and
  altered peritelomeric gene expression, and both are recorded with REFUTE
  evidence in the discussions block rather than being quietly dropped. Modeling
  the gap explicitly is preferable to inventing a plausible molecular chain that
  the literature does not support.

  No genetic section. Because the syndrome has no established causal gene, and
  because typing a refuted candidate as SUSCEPTIBILITY or CAUSATIVE would
  misrepresent the evidence, this entry has no genetic block. The chromosomal
  lesion is modeled in pathophysiology, and the candidate-gene question lives in
  the discussions block where the refuting evidence can be typed as such.

  Sourcing note. The entry was drafted from the primary literature and the
  consensus management review, then cross-checked against a deep-research report
  generated with the claude_code provider, committed here as
  research/Ring_Chromosome_20_Syndrome-deep-research-claude_code.md. The
  cross-check added one genuinely new mechanism, the nigrostriatal
  seizure-termination arm, which is what distinguishes this syndrome from a
  generic drug-resistant focal epilepsy and which the first draft missed
  entirely. It also replaced several single-series frequency estimates with a
  192-patient systematic review, and supplied the unexplained female excess now
  recorded as a knowledge gap. Two of its suggestions were declined: no OMIM
  identifier is cited because none exists, and the macrocephaly in the MONDO
  definition is not curated as a phenotype because the primary literature does not
  support it.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance, at the hyperexcitability and
  recurrent-seizure nodes. The entry does not claim conformance to the module's
  ion-channel trigger node, since the upstream lesion here is chromosomal and its
  route to altered excitability is exactly what is unknown. The module's
  Excitation-Inhibition Imbalance node is skipped for a related but distinct
  reason: conforming to it would assert that the network abnormality is an
  imbalance between excitation and inhibition, and nothing in the r(20) literature
  establishes which side of that balance is disturbed, or that the framing applies
  at all. What has actually been measured is a rhythmic slow-wave pattern with
  sparse spikes and a nigrostriatal seizure-termination deficit, and neither is an
  excitation-inhibition claim.
inheritance:
  - name: Sporadic, usually postzygotic
    description: >-
      The ring almost always arises de novo. In the common mosaic form it forms
      after fertilization, which is why a normal cell line persists alongside the
      ring line and why the ring fraction differs between tissues and between
      patients. The rarer non-mosaic form, which does carry terminal deletions,
      is consistent with an origin in meiosis. Familial recurrence is the
      exception rather than the rule, but it is not absent: four families are on
      record in which a mosaic mother transmitted the ring to her children, also
      in a mosaic state. In every one of those families the children carried a
      higher proportion of ring-bearing cells than the mother did, and that higher
      ratio went with earlier seizure onset. The counselling position is therefore
      that recurrence risk is low but not zero, that transmission when it occurs is
      maternal and mosaic-to-mosaic, and that an affected child may be more
      severely affected than the parent who transmitted the ring.
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    evidence:
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The mosaic nature of these rings suggests a postzygotic origin with
          formation of the ring by fusion of the telomeric regions with no
          apparent loss of subtelomeric or telomeric DNA.
        explanation: >-
          Establishes the postzygotic origin of the common mosaic form, which is
          what makes the syndrome sporadic rather than transmitted.
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The non-mosaic nature of these rings is consistent with a meiotic
          origin.
        explanation: >-
          Establishes the contrasting meiotic origin of the rarer non-mosaic form,
          which is why this entry models two distinct upstream nodes.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          However, four familial cases have been reported thus far. In all the
          families a mosaic mother transmitted r(20) to the offspring in a mosaic
          state
        explanation: >-
          Documents the exception to sporadic occurrence, which is counselling
          relevant and is why the block no longer says familial recurrence is not a
          feature.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          In all the familial cases, the percentage of cells containing the ring
          was higher in the offspring compared to the mothers and correlated with
          an earlier epilepsy onset
        explanation: >-
          Supports the anticipation-like pattern across the transmitting families,
          which is the specific thing a counselled family needs to know.
pathophysiology:
  - name: Telomere-Telomere Fusion Forming Ring Chromosome 20
    biological_scale: MOLECULAR
    description: >-
      The short and long arms of chromosome 20 join end to end, converting a
      normally rod-shaped chromosome into a closed circle. The defining and
      counterintuitive feature is that this can happen with no loss of coding
      sequence: patients are symptomatic even when nothing has been deleted. That
      single fact is what rules out a straightforward gene-dosage account and
      forces the rest of this graph to be modeled around an unresolved step.
    biological_processes:
      - preferred_term: telomere maintenance
        term:
          id: GO:0000723
          label: telomere maintenance
        modifier: ABNORMAL
    downstream:
      - target: Postzygotic Mosaic Ring Without Detectable Deletion
      - target: Meiotic Non-Mosaic Ring With Terminal Deletion
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The disease is caused by fusion of the long and short arms of
          chromosome 20. Patients are symptomatic even if there is no loss of
          genetic material.
        explanation: >-
          States both the physical lesion and the crucial observation that it
          causes disease without deleting anything.
      - reference: PMID:28127864
        reference_title: >-
          Continuing role for classical cytogenetics: Case report of a boy with
          ring syndrome caused by complete ring chromosome 4 and review of
          literature.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A complete ring chromosome without loss of genetic material results
          from fusion of subtelomeric regions or telomere-telomere fusion.
        explanation: >-
          Describes the physical mechanism of complete ring formation. Marked
          PARTIAL because the case reported is a ring chromosome 4, so it
          establishes the general cytogenetic principle rather than a chromosome
          20 observation.
  - name: Postzygotic Mosaic Ring Without Detectable Deletion
    biological_scale: CELLULAR
    description: >-
      In the majority of patients the ring is present in only a proportion of
      cells, with two structurally normal chromosome 20s in the rest, and neither
      cell line shows any detectable deletion or duplication. This is the group
      that defines the mechanistic problem, and it is also the group that a
      chromosomal microarray will call normal, because there is no copy number
      change to find. The proportion of ring-bearing cells, the ring ratio,
      behaves like a dose: a higher ratio goes with earlier seizure onset and
      worse cognition.
    biological_processes:
      - preferred_term: chromosome segregation
        term:
          id: GO:0007059
          label: chromosome segregation
        modifier: ABNORMAL
    downstream:
      - target: Mitotic Ring Instability and Dynamic Mosaicism
      - target: Ring Ratio-Dependent Cortical Network Dysfunction
    evidence:
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          However, in the majority of cases the ring is present in only a
          proportion of cells, with two normal 20's in the remaining cells
          (mosaicism), and in these cases, no deletions of chromosome 20 have been
          observed.
        explanation: >-
          Establishes that the common form is mosaic and carries no deletion,
          which is the premise of this node.
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Group 1 (N=21) was mosaic for the r(20) and a normal cell line with no
          detectable deletions or duplications of chromosome 20 in either cell
          line.
        explanation: >-
          Quantifies the mosaic group in a molecularly characterized cohort and
          confirms the absence of copy number change by array analysis.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The age of onset of seizures correlates with the percentage of cells
          with the ring in mosaic patients.
        explanation: >-
          Supports the dose-like behaviour of the ring ratio that this node
          asserts and that the downstream hub node depends on.
  - name: Meiotic Non-Mosaic Ring With Terminal Deletion
    biological_scale: CELLULAR
    description: >-
      A minority of patients carry the ring in every cell examined, and in these
      the ring is almost always accompanied by deletion of the terminal segments
      of one or both arms near the fusion point. This group behaves worse: seizure
      onset is several years earlier and comorbidities are more extensive. The
      contrast is informative rather than incidental, because it shows the
      syndrome is molecularly heterogeneous, and it means findings from one group
      should not be assumed to hold in the other.
    downstream:
      - target: Ring Ratio-Dependent Cortical Network Dysfunction
    evidence:
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Group 2 (N=7) had non-mosaic ring chromosomes with a deletion at one or
          both ends of the chromosome, near the ring fusion point.
        explanation: >-
          Defines the non-mosaic group and its associated terminal deletions.
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The age of onset of seizures was significantly lower in the non-mosaic
          patients (group 2, median age of onset 2.1 years) than in the mosaic
          patients (group 1, median age of onset 6.0 years).
        explanation: >-
          Quantifies the phenotypic difference between the two structural groups,
          which is why they are modeled as separate nodes.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          In some patients, the ring (20) is found in all cells analyzed and in
          these cases, the ring is almost always accompanied by deletions of
          20pter and/or 20qter.
        explanation: >-
          Independent confirmation that the non-mosaic form carries terminal
          deletions.
  - name: Mitotic Ring Instability and Dynamic Mosaicism
    biological_scale: CELLULAR
    description: >-
      A circular chromosome is mechanically awkward at mitosis. Sister chromatid
      exchange within a ring produces interlocked or double-sized rings that
      segregate badly, so ring-bearing lineages continuously generate secondary
      aberrations and cells that have lost the ring entirely. This continuous
      reshuffling is called dynamic mosaicism, and it is the accepted explanation
      for the growth failure of the general ring syndrome. Whether it is also what
      drives the ring 20 epilepsy is proposed rather than established, which is
      why the arrow from here into the hub node is one of the open questions
      recorded in the discussions block.
    biological_processes:
      - preferred_term: chromosome segregation
        term:
          id: GO:0007059
          label: chromosome segregation
        modifier: ABNORMAL
    downstream:
      - target: Ring Ratio-Dependent Cortical Network Dysfunction
    evidence:
      - reference: PMID:28127864
        reference_title: >-
          Continuing role for classical cytogenetics: Case report of a boy with
          ring syndrome caused by complete ring chromosome 4 and review of
          literature.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ring syndrome is thought to be caused by "dynamic mosaicism" due to ring
          instability.
        explanation: >-
          States the dynamic mosaicism hypothesis. Marked PARTIAL because it is
          offered for the general ring syndrome in a ring chromosome 4 case, not
          demonstrated for the ring 20 epilepsy phenotype.
      - reference: PMID:33207017
        reference_title: Transcriptome analysis of a ring chromosome 20 patient cohort.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          there may be genome-wide chromosomal instability affecting gene
          expression
        explanation: >-
          Raises genome-wide instability as a confounder and candidate mechanism
          in ring 20 specifically. Marked PARTIAL because the authors raise it as
          an interpretive caution rather than measuring it.
  - name: Ring Ratio-Dependent Cortical Network Dysfunction
    biological_scale: TISSUE
    description: >-
      The unresolved step. Something about carrying the ring makes cortex
      epileptogenic, in proportion to how many cells carry it, without any lesion
      visible on imaging and without a neurological deficit on examination before
      seizures start. Two concrete candidate mechanisms have been tested and
      disfavoured: deletion of candidate genes on chromosome 20, which cannot
      apply to the mosaic majority who delete nothing, and altered expression of
      genes near the fusion point, which a patient transcriptome study looked for
      and did not find. This node exists so that the graph does not paper over
      that gap; it is a placeholder for a real biological step whose content is
      unknown, not a claim.
    locations:
      - preferred_term: frontal lobe
        term:
          id: UBERON:0016525
          label: frontal lobe
    downstream:
      - target: Frontally Predominant Cortical Hyperexcitability
    evidence:
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          While the underlying etiology of the phenotype is still not understood,
          evidence is accumulating which suggests the deletion of candidate genes
          on chromosome 20 is not responsible.
        explanation: >-
          States both halves of what this node encodes: that the step is
          unexplained, and that the obvious gene-deletion explanation has been
          disfavoured.
      - reference: PMID:33207017
        reference_title: Transcriptome analysis of a ring chromosome 20 patient cohort.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the mechanism by which individuals with complete ring chromosomes
          develop seizures and other phenotypic abnormalities is not understood
        explanation: >-
          Confirms independently and more recently that the step modeled by this
          node has no established molecular content.
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Neurological examination results were normal, and neuroimaging studies
          often failed to disclose a brain lesion.
        explanation: >-
          Establishes that the dysfunction is not accompanied by a structural
          lesion, which is why it is modeled as a network-level abnormality rather
          than as a malformation.
  - name: Frontally Predominant Cortical Hyperexcitability
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Whatever the upstream cause, the network output is a hyperexcitable,
      hypersynchronous cortex with a frontal accent. The electroencephalographic
      signature is not the brief spike-wave of the generalized epilepsies but
      long-lasting bilateral high-voltage slow waves with only occasional spike
      components, often rhythmic theta with frontal predominance. The relative
      poverty of the spike component, alongside seizures that are clinically
      subtle relative to how dramatic the tracing looks, is a recurring
      observation and the seed of a genuine dispute about whether this pattern is
      ictal at all.
    cell_types:
      - preferred_term: pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: regulation of postsynaptic membrane potential
        term:
          id: GO:0060078
          label: regulation of postsynaptic membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Nigrostriatal Seizure-Termination Failure
      - target: Drug-Resistant Focal Epilepsy
    evidence:
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          an ictal EEG pattern of long-lasting bilateral paroxysmal high-voltage
          slow waves with occasional spikes
        explanation: >-
          Describes the characteristic electrographic pattern that defines this
          node.
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Electroencephalogram recordings showed rhythmic theta waves with frontal
          predominance and non-convulsive status epilepticus (NCSE).
        explanation: >-
          Supports the frontal predominance asserted in this node's name.
  - name: Nigrostriatal Seizure-Termination Failure
    biological_scale: TISSUE
    description: >-
      The most distinctive thing about r(20) seizures is not that they start but
      that they will not stop, and this node is the reason to think that is a
      separate defect rather than just severe ictogenesis. Basal ganglia circuits,
      and striatal dopaminergic transmission in particular, are thought to
      interrupt seizures rather than generate them. In r(20), fluorodopa uptake is
      significantly reduced in both putamen and caudate, and functional imaging
      during an actual seizure shows the substantia nigra and striatum lighting up
      alongside frontal cortex. Notably the dopaminergic reduction does not track
      the ring ratio, so it behaves like a property of the syndrome rather than a
      dose effect. A seizure-stopping system that works poorly is exactly what a
      syndrome defined by days-long nonconvulsive status looks like from the
      inside.
    locations:
      - preferred_term: substantia nigra
        term:
          id: UBERON:0002038
          label: substantia nigra
      - preferred_term: striatum
        term:
          id: UBERON:0002435
          label: striatum
    downstream:
      - target: Prolonged Nonconvulsive Status Epilepticus
    evidence:
      - reference: PMID:15249613
        reference_title: >-
          PET evidence for a role of the basal ganglia in patients with ring
          chromosome 20 epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Striatal dopamine is modulated in r(20) epilepsy; dysfunction of this
          neurotransmission may impair the mechanisms that interrupt seizures.
        explanation: >-
          States the seizure-termination hypothesis that this node encodes, from
          the study that measured it.
      - reference: PMID:15249613
        reference_title: >-
          PET evidence for a role of the basal ganglia in patients with ring
          chromosome 20 epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This reduction was equal for both nuclei and was not correlated to the
          percentage of cells with r(20).
        explanation: >-
          Shows the dopaminergic deficit is independent of ring ratio, which is why
          it is modeled as its own node rather than as another consequence of ring
          burden.
      - reference: PMID:22738216
        reference_title: >-
          Ictal involvement of the nigrostriatal system in subtle seizures of ring
          chromosome 20 epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We observed ictal BOLD increments in a cortical-subcortical network
          involving substantia nigrastriatum and frontal cortex.
        explanation: >-
          Functional imaging during an actual seizure showing the nigrostriatal
          system engaged, which is the direct observation behind this node. Single
          patient, so the node is supported rather than established.
  - name: Prolonged Nonconvulsive Status Epilepticus
    biological_scale: ORGANISM
    description: >-
      The most characteristic clinical event: a long confusional state, sometimes
      lasting days, during which awareness fluctuates and the patient may still
      respond to speech. It is easy to mistake for a behavioural change or a bad
      day, which is why the consensus advice is to have a low threshold for
      video-electroencephalography whenever behaviour or alertness shifts. It
      recurs, it is refractory to the drugs that do control the overt focal
      seizures, and it is the main driver of the encephalopathic decline.
    downstream:
      - target: Cognitive Decline and Behavioural Disturbance
    evidence:
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          frequent seizures consisting of a prolonged confusional state, with or
          without additional motor seizures
        explanation: >-
          Defines the cardinal clinical event modeled by this node.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Twenty-four-hour video/EEG telemetry recorded during the NCSE showed
          fluctuating consciousness between overt unresponsiveness and normal
          awareness.
        explanation: >-
          Documents the fluctuating awareness that makes the episodes hard to
          recognize clinically.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          often evolving into epileptic encephalopathy associated with
          non-convulsive status epilepticus (11 patients)
        explanation: >-
          Links the status epilepticus to the encephalopathic outcome that this
          node feeds.
  - name: Drug-Resistant Focal Epilepsy
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Alongside the status episodes, patients have recurrent focal seizures:
      dyscognitive seizures, focal motor seizures often arising from sleep, and
      characteristically terrifying hallucinations at onset in childhood. Later in
      the course focal seizures with motor and autonomic features and eyelid
      myoclonia appear. Drug resistance is close to the rule, and the current
      consensus is that families should be told at diagnosis that the seizures are
      likely to be lifelong.
    downstream:
      - target: Cognitive Decline and Behavioural Disturbance
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          When seizure onset occurred in childhood (21 patients), terrifying
          hallucinations associated with focal motor seizures, often sleep-related
          (8 patients), or dyscognitive seizures (13 patients), were prominent
          features
        explanation: >-
          Enumerates the focal seizure semiology this node asserts, in the largest
          single series.
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All patients presented with pharmacoresistant frontal lobe complex
          partial seizures.
        explanation: >-
          Supports both the focal frontal character and the drug resistance.
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          if patients are diagnosed with epilepsy, they and their families should
          be counseled that seizures are likely to be drug-resistant and life-long
        explanation: >-
          States the expert consensus on prognosis, which is the practical content
          of drug resistance here.
  - name: Cognitive Decline and Behavioural Disturbance
    biological_scale: ORGANISM
    description: >-
      Children who were developing normally lose ground after seizures begin,
      accumulating intellectual disability and behavioural problems, and the
      severity tracks both the ring ratio and how early the seizures started. That
      pattern is what earns the syndrome its classification as a developmental and
      epileptic encephalopathy. The classification is not unchallenged: behavioural
      disturbance has been reported to begin before the first seizure in some
      patients, which would make part of the cognitive phenotype a parallel effect
      of the ring rather than a consequence of the epilepsy. That dispute is
      recorded in the discussions block.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          r(20) syndrome is characterized by a recognizable epileptic phenotype
          with typical EEG pattern, intellectual disability manifesting after
          seizure onset in otherwise normally developing children, and behavioral
          changes.
        explanation: >-
          States the post-seizure-onset timing of the cognitive decline that
          underpins the encephalopathy framing.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The r(20) ratio and severity of cognitive impairment appear to be
          directly related to each other and inversely correlated with the age at
          epilepsy onset.
        explanation: >-
          Quantifies the relationship between ring burden, seizure onset age, and
          cognitive outcome that this node depends on.
phenotypes:
  - category: Neurologic
    name: Drug-resistant focal epilepsy
    description: >-
      Childhood-onset focal seizures that persist through adult life and respond
      poorly to antiseizure medication. Frontal lobe semiology predominates.
    phenotype_term:
      preferred_term: Focal impaired awareness seizure
      term:
        id: HP:0002384
        label: Focal impaired awareness seizure
      clinical_course: PROGRESSIVE
    frequency: FREQUENT
    evidence:
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Focal seizures with impaired consciousness were most common (n = 94/187,
          50.3%).
        explanation: >-
          94 of 187 pooled patients, which is 50.3 percent and falls in the
          FREQUENT band, and establishes this as the commonest single seizure type.
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The median number of ASMs tried was 4 (2,7); most patients (80%, n =
          92/115) were drug-resistant.
        explanation: >-
          Quantifies the drug resistance asserted in this phenotype's name across
          the pooled literature.
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All patients presented with pharmacoresistant frontal lobe complex
          partial seizures.
        explanation: >-
          Documents focal impaired-awareness seizures with drug resistance in
          every patient of the series.
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The seizures were resistant to antiepileptic drug therapy.
        explanation: >-
          Independent confirmation of drug resistance in the founding case series.
  - category: Neurologic
    name: Nonconvulsive status epilepticus
    description: >-
      Recurrent prolonged confusional states with fluctuating awareness and a
      long-lasting rhythmic slow-wave electroencephalographic pattern. The single
      most characteristic feature of the syndrome.
    phenotype_term:
      preferred_term: Non-convulsive status epilepticus without coma
      term:
        id: HP:0032671
        label: Non-convulsive status epilepticus without coma
      temporality: RECURRENT
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Information on non-convulsive status epilepticus (NCSE) was available in
          143 cases; 126 had experienced NCSE (88%).
        explanation: >-
          126 of 143 patients across 71 studies, which is 88 percent and falls in
          the VERY_FREQUENT band. The denominator is all r(20) patients with the
          information available rather than a status-selected subgroup, so the
          estimate is not circular. This systematic review supersedes the smaller
          single-series estimate for the purpose of the band.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          often evolving into epileptic encephalopathy associated with
          non-convulsive status epilepticus (11 patients)
        explanation: >-
          Eleven of 25 in a single series, which is lower than the pooled figure.
          Marked PARTIAL because a single centre series is a weaker basis for the
          band than the systematic review, and it is retained to show the spread
          between reports rather than to set the band.
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          as there is a high incidence of non-convulsive status epilepticus
          (NCSE), there should be a low threshold for video-EEG monitoring if
          patients have a change in behavior or level of consciousness
        explanation: >-
          Corroborates the high frequency and states its clinical consequence for
          monitoring.
  - category: Neurologic
    name: EEG abnormality with long-lasting rhythmic slow waves
    description: >-
      A distinctive tracing: prolonged bilateral high-voltage slow waves with only
      occasional spike components, often rhythmic theta with frontal predominance,
      lasting far longer than an ordinary electrographic seizure.
    phenotype_term:
      preferred_term: EEG abnormality
      term:
        id: HP:0002353
        label: EEG abnormality
    evidence:
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          an ictal EEG pattern of long-lasting bilateral paroxysmal high-voltage
          slow waves with occasional spikes
        explanation: >-
          Describes the characteristic pattern.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The EEG consisted of long-lasting generalized rhythmic 3-5 Hz sharp or
          slow waves with a few spikes, lasting several days.
        explanation: >-
          Quantifies the frequency band and the extraordinary duration.
  - category: Neurologic
    name: Intellectual disability
    description: >-
      Mild to severe cognitive impairment that typically emerges after seizure
      onset in children who were developing normally, with severity tracking the
      ring ratio and inversely tracking age at seizure onset.
    phenotype_term:
      preferred_term: Intellectual disability
      term:
        id: HP:0001249
        label: Intellectual disability
      clinical_course: PROGRESSIVE
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          intellectual disability manifesting after seizure onset in otherwise
          normally developing children
        explanation: >-
          States the characteristic timing of the cognitive impairment.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We found statistically significant correlations between age at epilepsy
          onset and cognitive level.
        explanation: >-
          Supports the relationship between seizure onset age and cognitive
          outcome.
  - category: Behavioral
    name: Behavioural disturbance
    description: >-
      Behavioural problems are a consistent part of the syndrome and, importantly,
      have been reported to begin before the first seizure in a substantial
      fraction of patients, which is one of the arguments against reading the whole
      cognitive-behavioural phenotype as a consequence of the epilepsy.
    phenotype_term:
      preferred_term: Atypical behavior
      term:
        id: HP:0000708
        label: Atypical behavior
    evidence:
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There were three patients out of six with behavioral disturbances before
          the onset of seizures.
        explanation: >-
          Documents behavioural disturbance preceding seizure onset, the
          observation that motivates the encephalopathy controversy in the
          discussions block.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Ring Chromosome 20 syndrome is a rare chromosomal disorder characterized
          by refractory epilepsy, with seizures in wakefulness and sleep,
          behavioral problems and mild to severe cognitive impairment.
        explanation: >-
          Establishes behavioural problems as a defining component of the
          syndrome.
  - category: Neurologic
    name: Ictal fear
    description: >-
      Fear as the seizure itself rather than as a reaction to it. It is the single
      most characteristic subjective feature of r(20) seizures, reported in nearly
      three quarters of patients for whom the information exists, and it is a
      frequent reason these children are sent to psychiatry before anyone orders a
      karyotype.
    phenotype_term:
      preferred_term: ictal fear
      term:
        id: HP:0032739
        label: Focal emotional seizure with fear/anxiety/panic
    frequency: FREQUENT
    evidence:
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Seventy-eight patient reports reported the presence of ictal fear, which
          was present in 56 cases (72%).
        explanation: >-
          56 of 78 patients for whom the feature was reported, which is 72 percent
          and falls in the FREQUENT band. The denominator is restricted to reports
          that addressed ictal fear at all, which is stated here because that is a
          narrower base than the full 192-patient cohort.
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ring chromosome 20 is characterized by childhood-onset drug-resistant
          epilepsy, predominantly focal with ictal fear and NCSE.
        explanation: >-
          States ictal fear as one of the three defining features of the epilepsy
          phenotype.
  - category: Neurologic
    name: Hallucinations at seizure onset
    description: >-
      Terrifying hallucinations at the start of a seizure are a distinctive and
      clinically memorable feature of childhood-onset cases, and are among the
      reasons the syndrome is sometimes first referred to psychiatry.
    phenotype_term:
      preferred_term: Hallucinations
      term:
        id: HP:0000738
        label: Hallucinations
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          terrifying hallucinations associated with focal motor seizures, often
          sleep-related (8 patients), or dyscognitive seizures (13 patients), were
          prominent features
        explanation: >-
          Documents ictal hallucinations as a prominent feature of childhood-onset
          cases.
  - category: Neurologic
    name: Focal motor seizure
    description: >-
      Focal motor seizures, frequently arising out of sleep, occurring alongside
      the dyscognitive events. Later in the course focal seizures acquire motor and
      autonomic features.
    phenotype_term:
      preferred_term: Focal motor seizure
      term:
        id: HP:0011153
        label: Focal motor seizure
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In the long-term, progressive stabilization of drug resistant epilepsy
          associated with non-convulsive status epilepticus, focal seizures with
          motor and autonomic features, and eyelid myoclonia were noticed.
        explanation: >-
          Documents focal motor seizures in the long-term course of the syndrome.
  - category: Neurologic
    name: Eyelid myoclonia seizure
    description: >-
      Rapid jerking of the eyelids as a seizure type appearing in the long-term
      course, a feature the syndrome shares with several generalized epilepsies and
      one that can misdirect the diagnosis.
    phenotype_term:
      preferred_term: Eyelid myoclonia seizure
      term:
        id: HP:0032678
        label: Eyelid myoclonia seizure
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In the long-term, progressive stabilization of drug resistant epilepsy
          associated with non-convulsive status epilepticus, focal seizures with
          motor and autonomic features, and eyelid myoclonia were noticed.
        explanation: >-
          Documents eyelid myoclonia in the long-term seizure repertoire.
prevalence:
  - population: Published cases worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      No population-based prevalence estimate exists. About 200 children and adults
      had been reported in the literature as of 2020, roughly five decades after
      the first case; the 2012 count of more than 100 is retained alongside it to
      show the trajectory. The count is almost certainly an undercount, because the
      mosaic majority is invisible to
      chromosomal microarray and the syndrome carries no dysmorphic signature to
      prompt a karyotype.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          about 200 pediatric and adult individuals with r(20) syndrome have been
          reported in the literature
        explanation: >-
          The current published case count, from the 2020 review, superseding the
          2012 figure below.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          More than 100 cases have been published since the initial report in
          1972.
        explanation: >-
          Gives the published case count that this record reports.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Cytogenetic analysis, rather than chromosomal microarray analysis is
          recommended for diagnosis of this syndrome, as the mosaic cases do not
          have copy number alterations and are therefore not identified by
          array-based analysis.
        explanation: >-
          Supports the ascertainment argument in the notes, that the diagnostic
          pathway systematically misses mosaic cases.
progression:
  - phase: Seizure onset in a normally developing child
    age_range: Early childhood to adolescence
    notes: >-
      Onset is typically around school age in mosaic patients and several years
      earlier in the non-mosaic group, with a higher ring ratio predicting earlier
      onset. Development is normal beforehand, and there is usually neither
      dysmorphism nor a brain lesion, which is why the diagnosis is often delayed
      for years.
    evidence:
      - reference: PMID:20972251
        reference_title: >-
          Molecular analysis of ring chromosome 20 syndrome reveals two distinct
          groups of patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The age of onset of seizures was significantly lower in the non-mosaic
          patients (group 2, median age of onset 2.1 years) than in the mosaic
          patients (group 1, median age of onset 6.0 years).
        explanation: >-
          Provides the onset ages for both structural groups.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Facial dysmorphism or other congenital malformations are rarely reported
          making it difficult to diagnose the syndrome based on clinical findings
          alone.
        explanation: >-
          Supports the diagnostic delay described in this phase.
  - phase: Evolution to epileptic encephalopathy with recurrent status
    age_range: Childhood into adult life
    notes: >-
      Childhood-onset cases commonly evolve into an epileptic encephalopathy with
      recurrent nonconvulsive status epilepticus and cognitive decline. Onset in
      adolescence carries a milder course with dyscognitive seizures and status
      episodes but without cognitive decline, so age at onset is the main
      prognostic variable.
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epilepsy onset in adolescence (3 patients) was accompanied by a milder
          developmental course, dyscognitive seizures and non-convulsive status
          epilepticus, and no cognitive decline.
        explanation: >-
          Documents the milder adolescent-onset trajectory that contrasts with the
          childhood-onset encephalopathy.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In ring(20) syndrome, epilepsy has an age dependent course and a worse
          outcome when age at seizure onset is earlier.
        explanation: >-
          States the age-dependence of outcome that defines this phase.
  - phase: Long-term persistence with rare remission
    age_range: Adulthood
    notes: >-
      Epilepsy continues through adult life and stabilizes rather than remits.
      Seizure freedom of more than five years was reached by only three of 25
      patients in the largest series, all of them older, so remission is possible
      but should not be expected.
    evidence:
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Only three older patients became seizure free (>5 years)
        explanation: >-
          Quantifies how rarely long-term seizure freedom is achieved.
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The ring chromosome 20 syndrome is characterized by childhood-onset
          refractory epilepsy continuing throughout adult life, mental disability,
          and behavioral disturbances which can originate before seizure onset.
        explanation: >-
          Supports persistence of the epilepsy into adult life.
treatments:
  - name: Oral antiseizure medication
    description: >-
      First-line treatment is an oral antiseizure medication, but expectations
      should be set low. Notably, drugs can substantially reduce the overt focal
      seizures while leaving the electrographic status pattern untouched, a
      dissociation that is clinically important and is also one of the arguments in
      the dispute over whether that pattern is really ictal.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
        - preferred_term: lamotrigine
          term:
            id: CHEBI:6367
            label: lamotrigine
    target_mechanisms:
      - target: Frontally Predominant Cortical Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          initial epilepsy treatment should be with an oral anti-seizure
          medication
        explanation: >-
          States the consensus first-line recommendation, which is deliberately
          agent-agnostic.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          In our experience, valproic acid and lamotrigine, often in combination,
          are generally the most effective antiepileptic drugs (AEDs) for treating
          seizures in r(20)
        explanation: >-
          Names the two agents recorded in therapeutic_agent. Marked PARTIAL
          because it is explicitly expert experience rather than trial evidence,
          which is the standard of evidence available for drug choice in this
          syndrome.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Oral AEDs decreased more than 75% of the overt CPS episodes in both
          patients at 22 and 26 months of follow-up but had no effect on the
          natural history of electrical NCSE.
        explanation: >-
          Documents the partial and selective response that this treatment record
          describes. Marked PARTIAL because it is a two-patient observation and
          shows benefit for one seizure type only.
  - name: Home rescue medication for prolonged seizures
    description: >-
      Because prolonged seizures and nonconvulsive status are expected rather than
      exceptional, the consensus is to supply a rescue medication for use at home
      rather than relying on emergency presentation each time.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Prolonged Nonconvulsive Status Epilepticus
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          home rescue medication should be considered given the risk for prolonged
          seizures and NCSE
        explanation: >-
          States the consensus recommendation and its rationale.
  - name: Ketogenic diet
    description: >-
      A non-pharmacological option offered when medications fail. It is
      recommended on the strength of expert consensus and small reports rather
      than controlled data, a limitation the consensus statement is explicit
      about.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Ketogenic Diet
      term:
        id: NCIT:C173168
        label: Ketogenic Diet
    target_mechanisms:
      - target: Frontally Predominant Cortical Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          for patients with drug-resistant epilepsy, ketogenic diet, vagus nerve
          stimulation, or deep brain stimulation could all be considered
        explanation: >-
          Names the ketogenic diet as a consensus option for drug-resistant cases.
          Marked PARTIAL because the same review states the evidence base is
          weak.
  - name: Vagus nerve stimulation
    description: >-
      Implanted neurostimulation offered for drug-resistant seizures. As with the
      other second-line options, the recommendation rests on consensus and case
      experience, and it should be offered with the caveat that its efficacy in
      this syndrome specifically is described in the literature as controversial
      rather than established.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: vagus nerve stimulation
      term:
        id: NCIT:C49236
        label: Therapeutic Procedure
    target_mechanisms:
      - target: Frontally Predominant Cortical Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          for patients with drug-resistant epilepsy, ketogenic diet, vagus nerve
          stimulation, or deep brain stimulation could all be considered
        explanation: >-
          Names vagus nerve stimulation as a consensus option. Marked PARTIAL
          because no controlled evidence in this syndrome is cited. NCIT has no
          specific vagus nerve stimulation clinical-action term, so the generic
          Therapeutic Procedure term is used with a specific preferred_term.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          the efficacy of vagal nerve stimulation is controversial
        explanation: >-
          Qualifies the consensus recommendation. Marked PARTIAL because it
          reports disagreement in the literature rather than a negative result, but
          it is the reason this record does not read as an established option.
  - name: Deep brain stimulation
    description: >-
      Deep brain stimulation is listed alongside vagus nerve stimulation as an
      option for drug-resistant seizures, and is of particular interest here
      because the epilepsy has no resectable focus, ruling out the surgical route
      that helps other drug-resistant focal epilepsies.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: Deep Brain Stimulation
      term:
        id: NCIT:C21024
        label: Deep Brain Stimulation
    target_mechanisms:
      - target: Frontally Predominant Cortical Hyperexcitability
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          for patients with drug-resistant epilepsy, ketogenic diet, vagus nerve
          stimulation, or deep brain stimulation could all be considered
        explanation: >-
          Names deep brain stimulation as a consensus option. Marked PARTIAL for
          the same reason as the other second-line recommendations.
  - name: Multidisciplinary allied health support
    description: >-
      Because the disability is cognitive and behavioural as much as it is
      seizure-related, the consensus is that care should be delivered by a team
      including speech, occupational, physical, and psychological therapy rather
      than by an epileptologist alone. Caregiver burnout is explicitly named as
      something to screen for.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The care team should be multidisciplinary and include at least an
          epileptologist and allied health specialists (e.g., speech therapist,
          occupational therapist, physiotherapist, psychologist)
        explanation: >-
          States the consensus recommendation on care organization.
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          caregiver burnout and stress should be screened for and supports
          provided
        explanation: >-
          Supports the caregiver component of the recommendation.
  - name: Genetic counselling
    description: >-
      Referral for genetic counselling is recommended for all patients and
      families. The counselling content is unusual for a chromosomal disorder,
      since the ring is nearly always de novo and postzygotic and the ring fraction
      rather than any deleted gene is what predicts severity.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Genetic Counseling
      term:
        id: NCIT:C15240
        label: Genetic Counseling
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          patients and families should be referred for genetic counseling
        explanation: >-
          States the consensus recommendation.
diagnosis:
  - name: Karyotype with adequate cell counts
    description: >-
      The diagnostic test, and a rare instance in modern practice where the older
      technology is the correct one. Because most patients are mosaic and carry no
      copy number change, a chromosomal microarray returns normal. Enough
      metaphase cells must be scored to detect a low ring fraction and to estimate
      the ring ratio, which is itself prognostically informative.
    diagnosis_term:
      preferred_term: Karyotyping
      term:
        id: NCIT:C16768
        label: Karyotyping
    results: >-
      A ring chromosome 20 replacing one normal chromosome 20, typically in a
      fraction of cells, reported with the proportion of ring-bearing metaphases.
    evidence:
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Cytogenetic analysis, rather than chromosomal microarray analysis is
          recommended for diagnosis of this syndrome, as the mosaic cases do not
          have copy number alterations and are therefore not identified by
          array-based analysis.
        explanation: >-
          States the diagnostic recommendation and the reason microarray fails.
      - reference: PMID:25957205
        reference_title: Ring (20) chromosome epileptic syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          we emphasize the importance of early G-banding chromosomal analysis when
          patients present with unexplainable severe seizures and repetitive NCSE,
          even in the absence of any dysmorphic features suggestive of a
          chromosomal disorder
        explanation: >-
          States the clinical trigger for ordering the karyotype, which is the
          practical diagnostic message of this record.
  - name: Video-electroencephalography during behavioural change
    description: >-
      Prolonged video-electroencephalography is how nonconvulsive status is caught,
      and the threshold for ordering it should be low, because the clinical
      presentation is a change in behaviour or alertness rather than anything that
      looks like a seizure.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Long-lasting bilateral high-voltage rhythmic slow waves at roughly 3 to 5
      hertz with sparse spike components, sometimes persisting for days, with
      fluctuating clinical responsiveness.
    evidence:
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          as there is a high incidence of non-convulsive status epilepticus
          (NCSE), there should be a low threshold for video-EEG monitoring if
          patients have a change in behavior or level of consciousness
        explanation: >-
          States the consensus indication for the test.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The EEG consisted of long-lasting generalized rhythmic 3-5 Hz sharp or
          slow waves with a few spikes, lasting several days.
        explanation: >-
          Provides the electrographic findings reported in the results field.
differential_diagnoses:
  - name: Lennox-Gastaut Syndrome
    disease_term:
      preferred_term: Lennox-Gastaut syndrome
      term:
        id: MONDO:0016532
        label: Lennox-Gastaut syndrome
    description: >-
      The commonest misdiagnosis, because both present as drug-resistant
      childhood-onset epilepsy with cognitive decline and frequent nonconvulsive
      status. The route out is the karyotype, not the clinical picture.
    distinguishing_features:
      - Slow spike-wave at 1.5 to 2.5 hertz and generalized paroxysmal fast activity, rather than long-lasting rhythmic slow waves with sparse spikes.
      - Tonic seizures in sleep are a defining feature and are not characteristic of ring 20.
      - Frequently follows an identifiable structural or genetic cause; ring 20 has neither a lesion nor a causal gene.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The Authors report that the differential diagnosis might be challenging
          especially with: (1) Frontal Lobe Seizures; (2) Rolandic Epilepsy treated
          with sodium channel blockers (NCSE during wakefulness); and (3)
          Lennox-Gastaut syndrome (LGS).
        explanation: >-
          Names Lennox-Gastaut syndrome explicitly as one of the three hardest
          differentials for this syndrome, rather than merely establishing that
          differentials exist.
  - name: Familial Sleep Related Hypermotor Epilepsy
    disease_term:
      preferred_term: familial sleep-related hypermotor epilepsy
      term:
        id: MONDO:0000030
        label: familial sleep-related hypermotor epilepsy
    description: >-
      Shares frontal lobe seizures arising from sleep, and is additionally
      confusable because its first identified gene, CHRNA4, sits on distal
      chromosome 20q and was for that reason a natural candidate for ring 20.
      The candidate did not survive scrutiny, since the mosaic majority delete
      nothing.
    distinguishing_features:
      - Autosomal dominant family history rather than a de novo chromosomal event.
      - Normal cognition and normal interictal electroencephalogram between events.
      - No nonconvulsive status epilepticus and no long-lasting rhythmic slow-wave pattern.
      - Karyotype is normal.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These features are often present in frontal lobe seizures of different
          etiologies (83), but the absence of NCSE and of the typical EEG features
          of r(20) syndrome are helpful in the diagnosis.
        explanation: >-
          Names the two features that separate ring 20 from other frontal lobe
          epilepsies, which is precisely the discriminating information this
          differential needs.
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Ring Chromosome 20 syndrome is a rare chromosomal disorder characterized
          by refractory epilepsy, with seizures in wakefulness and sleep,
          behavioral problems and mild to severe cognitive impairment.
        explanation: >-
          Documents that ring 20 seizures occur in both wakefulness and sleep and
          are accompanied by cognitive impairment, which is what separates it from
          a pure sleep-related frontal epilepsy with preserved cognition.
  - name: Ring Chromosome 14 Syndrome
    disease_term:
      preferred_term: ring chromosome 14
      term:
        id: MONDO:0014708
        label: ring chromosome 14
    description: >-
      The nearest structural analogue: another ring chromosome syndrome with
      drug-resistant epilepsy, intellectual disability, behavioural change,
      frequent status, and the same correlation between ring ratio and severity.
      It is the natural control for any theory of why rings cause epilepsy, since
      whatever explains r(20) has to explain why r(14) differs and why r(2) and
      r(4) produce no epilepsy at all.
    distinguishing_features:
      - Seizures usually begin in the first months or years of life rather than at school age.
      - A distinctive facial appearance is present, whereas ring 20 characteristically has none.
      - Ocular manifestations occur that have never been reported in ring 20.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Status epilepticus is frequent, but seizures usually start in the first
          months/years of life, unlike in r(20) syndrome. Moreover, individuals
          with r(14) usually present with a distinctive facial appearance
          (epicanthic folds, down-slanting palpebral fissures, flat nasal bridge,
          upturned nares, and large low-set ears) and exhibit ocular manifestations
          that have never been reported in r(20) syndrome, thus facilitating
          distinguishing these two conditions
        explanation: >-
          Supports all three distinguishing features directly: the earlier onset,
          the facial appearance, and the ocular findings absent from ring 20.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          However, even if patients with different ring chromosomes such as r(14)
          or r(17) manifest epilepsy, their seizures differ from those of r(20)
          patients
        explanation: >-
          Establishes that the epilepsies of the two ring syndromes are
          distinguishable, which is also a constraint on any generic ring
          mechanism.
  - name: Phelan-McDermid Syndrome
    disease_term:
      preferred_term: Phelan-McDermid syndrome
      term:
        id: MONDO:0011652
        label: Phelan-McDermid syndrome
    description: >-
      Another chromosomal disorder that pairs mild dysmorphism with intellectual
      disability, psychiatric symptoms, and seizures activated in sleep, so the
      clinical gestalt overlaps. The discriminator is the course of the epilepsy
      rather than its appearance at any one moment.
    distinguishing_features:
      - Epilepsy follows a benign course, whereas ring 20 seizures are usually drug-resistant.
      - Caused by 22q13.3 deletion, which chromosomal microarray detects and which ring 20 mosaicism does not resemble.
      - Interictal abnormalities are multifocal over frontal-central and frontal-temporal regions rather than the long rhythmic slow-wave pattern of ring 20.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Although the typical EEG abnormalities seen in patients with
          Phelan-McDermid syndrome consist of multifocal paroxysmal anomalies that
          are prevalent over the frontal-central and frontal-temporal regions and
          are activated during sleep, epilepsy shows a benign course in these
          patients, unlike r(20) where seizures are usually drug-resistant
        explanation: >-
          Supports both the electrographic distinction and the decisive one, which
          is that the epilepsy is benign here and drug-resistant in ring 20.
  - name: Epilepsy with Myoclonic Atonic Seizures
    disease_term:
      preferred_term: epilepsy with myoclonic atonic seizures
      term:
        id: MONDO:0014633
        label: epilepsy with myoclonic atonic seizures
    description: >-
      Another childhood epileptic encephalopathy that enters the differential when
      a previously normal child develops drug-resistant seizures with cognitive
      regression and episodes of nonconvulsive status.
    distinguishing_features:
      - Myoclonic-atonic drop attacks are the defining seizure type and are not typical of ring 20.
      - Generalized rather than frontal focal semiology.
      - Often remits, whereas ring 20 epilepsy persists into adult life.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Despite the distinctive phenotype, many patients still lack a
          diagnosis-especially in the genomic era-and the pathomechanisms of ring
          formation are poorly understood.
        explanation: >-
          Supports the claim that ring 20 is routinely missed and therefore
          confused with other childhood epileptic encephalopathies. Marked PARTIAL
          because it does not name this specific alternative diagnosis.
discussions:
  - discussion_id: r20_unexplained_female_excess
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why are patients with mosaic ring chromosome 20 disproportionately female,
      when the ring arises postzygotically and involves an autosome?
    attaches_to:
      - pathophysiology#Postzygotic Mosaic Ring Without Detectable Deletion
      - pathophysiology#Telomere-Telomere Fusion Forming Ring Chromosome 20
    rationale: >-
      Chromosome 20 is an autosome and the mosaic ring forms after fertilization,
      so there is no obvious route by which sex should matter. Yet the sex ratio
      is consistently skewed: a systematic review of 192 patients found only 40
      percent male, and the skew has been reported specifically in the mosaic group
      rather than the non-mosaic one. Several explanations are available and none
      has been tested. It could be ascertainment, if girls with unexplained
      cognitive and behavioural decline are investigated differently from boys. It
      could be survival, if male embryos tolerate the ring and its ongoing
      instability less well, which would predict an excess of male losses rather
      than a female excess among survivors. It could reflect a genuine
      sex-dependent difference in tolerance of aneuploid or ring-bearing lineages
      during early development, which is testable. Or it could be a real but
      modest effect inflated by publication bias across a literature made almost
      entirely of case reports and small series. Which of these is right matters
      for whether the ratio is telling us something about ring biology or only
      about how the syndrome gets found.
    proposed_experiments:
      - experiment_id: exp_r20_unbiased_ascertainment_sex_ratio
        name: Sex ratio in a diagnostically unbiased ascertainment stream
        description: >-
          Determine the sex ratio among ring 20 cases found by routine karyotyping
          of all children meeting a pre-specified clinical trigger, such as
          drug-resistant focal epilepsy with recurrent confusional episodes,
          rather than among published cases. Prospective registry ascertainment
          with a fixed testing rule removes the referral asymmetry that the case
          literature cannot exclude.
        decision_criterion: >-
          A sex ratio near parity under a fixed testing rule would identify the
          published excess as ascertainment bias. A persistent female excess would
          make it a biological finding needing a mechanism.
    evidence:
      - reference: PMID:42468067
        reference_title: >-
          Delineating the epilepsy phenotype of ring chromosome 20: A systematic
          literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Seventy-one studies were included (192 patients), 40.4% (n = 67/166)
          were male.
        explanation: >-
          Quantifies the sex skew across the pooled published literature, which is
          the observation this gap is about. It also shows the base is published
          cases, which is precisely why ascertainment cannot be excluded.
  - discussion_id: r20_mechanism_without_deletion
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      If most ring 20 patients lose no genetic material, what does the ring
      actually do to make cortex epileptogenic, and why has every concrete
      candidate mechanism tested so far failed?
    attaches_to:
      - pathophysiology#Ring Ratio-Dependent Cortical Network Dysfunction
      - pathophysiology#Mitotic Ring Instability and Dynamic Mosaicism
      - pathophysiology#Postzygotic Mosaic Ring Without Detectable Deletion
    rationale: >-
      This is the central unsolved problem of the syndrome and the reason the
      mechanism graph carries an explicitly empty hub node. Two candidate accounts
      have been put to the test and both came back negative. The first was gene
      dosage: distal chromosome 20q carries plausible epilepsy genes, notably the
      nicotinic receptor subunit CHRNA4 implicated in sleep-related frontal
      epilepsy, so deletion at the fusion point looked promising. It cannot be the
      general answer, because the mosaic majority have no detectable deletion in
      either cell line, and a review of the accumulated evidence concluded that
      candidate gene deletion is not responsible. The second was a position effect:
      circularizing a chromosome moves formerly telomeric regions into a new
      context and might silence or derepress genes near the join. A transcriptome
      study of a patient cohort looked specifically for that and found no altered
      expression in peritelomeric or other chromosome 20 regions, concluding that
      peritelomeric altered transcription is not the likely pathogenic mechanism.
      A third candidate has since been tested and also failed. If circularizing the
      chromosome silences subtelomeric genes through telomeric heterochromatin
      spreading, that silencing should show up as altered methylation; a
      genome-wide methylation screen in r(20) patients found no shared epigenetic
      signature anywhere, and specifically none at CHRNA4 or KCNQ2. The authors
      note the array covers subtelomeric regions poorly, so this is a strong
      negative rather than a conclusive one. There is also a cleaner argument
      against dosage than the absence of deletions: people who carry terminal
      deletions of chromosome 20 on an ordinary linear chromosome do not develop
      this epilepsy. Losing the material is not sufficient; the ring is doing
      something the deletion does not. What remains are less tractable hypotheses.
      Dynamic mosaicism, in which ring instability continuously generates secondary
      aberrations and ring-loss cells, is the accepted explanation for the growth
      failure of ring syndromes generally but has not been shown to drive the ring
      20 epilepsy, and it has a problem of its own: only 12 of 35 evaluated
      patients had secondary aberrations above a five percent threshold, so r(20)
      may simply not be unstable enough for the mechanism to bear the weight. A
      further constraint on any generic ring-based account is that ring chromosome
      2 and ring chromosome 4 patients do not develop epilepsy at all, so whatever
      the ring does, it does it in a chromosome-specific way. Genome-wide
      chromosomal instability affecting expression of genes not on chromosome 20 is
      raised by the same transcriptome study, which found candidate differences
      across many genes rather than a localized signal. Nuclear architecture is a
      third possibility that has barely been tested, since a ring occupies a
      different territory and has different lamina contacts than a rod. There is
      also a real methodological obstacle underlying all of this: the accessible
      tissue is blood, the diseased tissue is brain, and mosaicism means the two may
      differ in ring content, so a negative result in blood does not settle the
      question for cortex.
    proposed_experiments:
      - experiment_id: exp_r20_brain_versus_blood_ring_content
        name: Ring content and expression in brain versus blood from the same individuals
        description: >-
          Single-cell karyotype-informed sequencing and transcriptome profiling of
          postmortem or surgically obtained cortical tissue alongside matched blood
          from ring 20 donors, comparing ring fraction and gene expression between
          the two tissues.
        decision_criterion: >-
          A substantially higher cortical than blood ring fraction, or a cortical
          expression signature absent from blood, would show that blood-based
          negative studies were underpowered by tissue choice rather than wrong in
          principle. Matching ring fractions and expression would strengthen the
          case that the mechanism is not transcriptional at all.
      - experiment_id: exp_r20_nuclear_architecture_profiling
        name: Nuclear architecture profiling of ring versus rod chromosome 20
        description: >-
          Chromosome conformation capture and lamina-association mapping in
          patient-derived neurons carrying the ring, comparing the ring-bearing
          and normal cell lines from the same mosaic individual, which provides an
          internally controlled comparison.
        decision_criterion: >-
          Reproducible differences in chromosome 20 compartment or lamina
          association between the ring-bearing and normal lines of the same patient
          would support a nuclear architecture mechanism. Indistinguishable
          architecture would push the field toward instability-based accounts.
    evidence:
      - reference: PMID:22406087
        reference_title: Ring chromosome 20.
        supports: REFUTE
        evidence_source: OTHER
        snippet: >-
          While the underlying etiology of the phenotype is still not understood,
          evidence is accumulating which suggests the deletion of candidate genes
          on chromosome 20 is not responsible.
        explanation: >-
          Refutes the candidate-gene deletion hypothesis, which is why no genetic
          section names CHRNA4 or any other chromosome 20 gene as causal.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Enrichment analysis of SEM did not show any suggestive or highly shared
          epigenetic signature on either chromosome 20 or other chromosomes. No
          differences in methylation levels were found in the two main candidate
          genes CHRNA4 and KCNQ2.
        explanation: >-
          Refutes the epigenetic-silencing hypothesis, the third concrete candidate
          mechanism, using a genome-wide methylation screen designed to test it.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          However, given the relatively low coverage of subtelomeric regions on the
          450K array, a refinement of the analysis by a custom-targeted methylation
          assay may be necessary to exclude epigenetic silencing of the genes
          located in the p and q subtelomeric regions in r(20) patients.
        explanation: >-
          The authors' own limitation on that negative result. Marked PARTIAL
          because it means the silencing hypothesis is disfavoured rather than
          excluded, and it names the assay that would settle it.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: REFUTE
        evidence_source: OTHER
        snippet: >-
          In addition, patients carrying terminal deletions of the short or long
          arm of a linear chromosome 20 do not show the same epilepsy of r(20)
          syndrome patients
        explanation: >-
          The cleanest single argument against the gene-dosage account: losing the
          same material without forming a ring does not produce the disease, so the
          ring is contributing something the deletion does not.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Our retrospective literature analysis shows that only 12 out of 35
          patients who were evaluated had secondary aberrations in more than 5% of
          the cells
        explanation: >-
          Weighs against the dynamic-mosaicism hypothesis by showing r(20) is often
          not measurably unstable. Marked PARTIAL because the authors also note the
          secondary changes may partly be an in vitro artefact, which cuts the other
          way.
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Moreover, non-supernumerary r(2) and r(4) patients do not exhibit
          epilepsy (56, 57), suggesting that the phenotype is likely dependent on
          the specific chromosome involved.
        explanation: >-
          Constrains any purely generic ring-instability account, since other rings
          formed the same way do not cause epilepsy. Whatever the mechanism is, it
          has to be chromosome 20 specific.
      - reference: PMID:33207017
        reference_title: Transcriptome analysis of a ring chromosome 20 patient cohort.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our findings nevertheless suggest that peritelomeric altered
          transcription is not the likely pathogenic mechanism in ring 20.
        explanation: >-
          Refutes the position-effect hypothesis directly, from a study designed to
          test it.
      - reference: PMID:33207017
        reference_title: Transcriptome analysis of a ring chromosome 20 patient cohort.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Geographic analysis did not identify altered expression in peritelomeric
          or other specific chromosome 20 regions.
        explanation: >-
          The primary negative result underlying that refutation.
      - reference: PMID:33207017
        reference_title: Transcriptome analysis of a ring chromosome 20 patient cohort.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Underlying genetic mechanisms are likely complex and may involve
          differential expression of many genes, the majority of which may not be
          located on chromosome 20.
        explanation: >-
          States the surviving distributed-mechanism hypothesis that the proposed
          experiments are designed to probe.
      - reference: PMID:28127864
        reference_title: >-
          Continuing role for classical cytogenetics: Case report of a boy with
          ring syndrome caused by complete ring chromosome 4 and review of
          literature.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ring syndrome is thought to be caused by "dynamic mosaicism" due to ring
          instability.
        explanation: >-
          States the surviving instability hypothesis. Marked PARTIAL because it is
          asserted for ring syndromes in general, in a ring chromosome 4 case, and
          has not been demonstrated for the ring 20 epilepsy.
  - discussion_id: r20_is_the_rhythmic_pattern_ictal
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      Is the long-lasting rhythmic slow-wave pattern of ring 20 genuinely
      nonconvulsive status epilepticus, or an encephalopathic rhythm that is not
      itself seizure activity, and should it therefore be treated aggressively?
    attaches_to:
      - pathophysiology#Prolonged Nonconvulsive Status Epilepticus
      - pathophysiology#Frontally Predominant Cortical Hyperexcitability
    rationale: >-
      The pattern is called ictal by convention, but several features sit awkwardly
      with that reading. It can persist for days, far beyond what status epilepticus
      usually means. Its spike content is sparse, and a direct comparison found that
      ring 20 patients in nonconvulsive status had a less prominent spike component
      than patients in nonconvulsive status without the ring. Patients often remain
      partly responsive during it, sometimes answering questions, and in one
      reported pair daily activities were minimally affected while the discharges
      continued. Most telling, oral medication reduced the overt focal seizures by
      more than three quarters in those patients while leaving the electrical
      pattern entirely unchanged, a dissociation that would be surprising if the
      two shared a generator. The authors of that report state plainly that the
      mechanism of the continuous rhythmic waves may be unrelated to epilepsy. The
      opposing evidence is also real: the pattern accompanies confusional states
      that patients and families recognize as events, it is closely associated with
      cognitive decline in longitudinal series, and the current consensus treats it
      as status and recommends aggressive detection. The stake is direct and
      clinical. If it is status, prolonged episodes justify escalating treatment and
      possibly anaesthesia; if it is an encephalopathic rhythm, that escalation
      carries risk with no benefit, and the target of treatment should be the overt
      seizures instead.
    proposed_experiments:
      - experiment_id: exp_r20_metabolic_imaging_during_rhythmic_pattern
        name: Metabolic and cerebral blood flow imaging during the rhythmic pattern
        description: >-
          Ictal-interictal comparison using perfusion or metabolic imaging acquired
          during a prolonged rhythmic slow-wave episode and again in the same
          patient at baseline, testing whether the pattern is accompanied by the
          regional hypermetabolism and hyperperfusion that characterize genuine
          ictal activity.
        decision_criterion: >-
          Focal or regional hypermetabolism time-locked to the pattern would
          support a true ictal process and justify aggressive treatment. Absent or
          reduced metabolic change would support the encephalopathic-rhythm reading
          and argue against escalation.
      - experiment_id: exp_r20_cognitive_timelock_during_pattern
        name: Time-locked cognitive testing during and between rhythmic episodes
        description: >-
          Standardized within-patient cognitive testing performed during the
          rhythmic pattern and during matched pattern-free periods, quantifying
          whether measurable performance falls while the pattern is running.
        decision_criterion: >-
          A reproducible performance drop during the pattern would establish it as
          functionally disabling regardless of its label. Preserved performance
          would show the pattern is electrographic in a strong sense and would
          shift the treatment target to the overt seizures.
    evidence:
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The electroclinical correlations in our cases raise the possibility that
          the mechanism of continuous rhythmic waves in this syndrome may be
          unrelated to epilepsy.
        explanation: >-
          States the sceptical position explicitly.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Despite the continuous discharges, the patients had relatively subtle
          clinical episodes of seizures, during which they were sometimes
          responsive to verbal stimuli.
        explanation: >-
          Documents the preserved responsiveness that is hard to reconcile with
          ongoing status epilepticus.
      - reference: PMID:16128150
        reference_title: >-
          Ring chromosome 20 with nonconvulsive status epilepticus:
          electroclinical correlation of a rare epileptic syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Oral AEDs decreased more than 75% of the overt CPS episodes in both
          patients at 22 and 26 months of follow-up but had no effect on the
          natural history of electrical NCSE.
        explanation: >-
          Documents the pharmacological dissociation between the overt seizures and
          the electrical pattern.
      - reference: PMID:9217679
        reference_title: >-
          Ring chromosome 20 and nonconvulsive status epilepticus. A new epileptic
          syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the group with the chromosomal anomaly had more frequent, comparatively
          brief episodes of confusion associated with a less prominent spike
          component on the EEG
        explanation: >-
          The controlled comparison showing that the ring 20 pattern differs
          electrographically from ordinary nonconvulsive status, which is part of
          what raises the question.
      - reference: PMID:42096279
        reference_title: >-
          Management of ring chromosome 20 syndrome: Narrative review and
          consensus recommendations.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          as there is a high incidence of non-convulsive status epilepticus
          (NCSE), there should be a low threshold for video-EEG monitoring if
          patients have a change in behavior or level of consciousness
        explanation: >-
          Represents the prevailing position, that the pattern is status and should
          be actively sought. Marked PARTIAL because it is a consensus
          recommendation rather than evidence bearing on whether the pattern is
          ictal.
  - discussion_id: r20_encephalopathy_versus_parallel_effect
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      Is the intellectual disability of ring 20 caused by the epilepsy, making this
      a true developmental and epileptic encephalopathy, or is it a parallel
      consequence of carrying the ring that would occur regardless of seizure
      control?
    attaches_to:
      - pathophysiology#Cognitive Decline and Behavioural Disturbance
      - pathophysiology#Prolonged Nonconvulsive Status Epilepticus
    rationale: >-
      The encephalopathy reading rests on a genuinely striking observation:
      children develop normally and only then lose ground, with intellectual
      disability manifesting after seizure onset. It is reinforced by the finding
      that earlier seizure onset predicts worse cognitive outcome. But the
      correlation is confounded, because a higher ring ratio predicts both earlier
      seizure onset and worse cognition, so seizure timing may be a marker of ring
      burden rather than the cause of the cognitive outcome. Two further
      observations cut against the pure encephalopathy account. Behavioural
      disturbance has been reported to begin before the first seizure in a
      substantial minority, which no seizure-driven mechanism can explain. And
      adolescent-onset patients had a milder developmental course with no cognitive
      decline despite having both dyscognitive seizures and nonconvulsive status,
      suggesting the vulnerable window matters more than seizure burden. The
      question is not academic: if the epilepsy drives the cognitive outcome, then
      aggressive early seizure control is cognitively protective and worth its side
      effects, whereas if cognition tracks ring burden independently, that
      aggressive approach buys less than it appears to and families deserve to know
      that.
    proposed_experiments:
      - experiment_id: exp_r20_ring_ratio_adjusted_cognitive_modeling
        name: Ring-ratio-adjusted modeling of cognitive outcome in a multicentre cohort
        description: >-
          Pooled multicentre longitudinal cohort with ring ratio, age at seizure
          onset, seizure and status burden, and serial standardized cognitive
          testing, modeling cognitive trajectory with ring ratio and seizure burden
          entered as separate predictors rather than examined pairwise.
        decision_criterion: >-
          An independent effect of seizure and status burden after adjustment for
          ring ratio would support the encephalopathy model. Cognitive outcome
          explained by ring ratio alone, with seizure burden adding nothing, would
          support the parallel-effect model.
      - experiment_id: exp_r20_prospective_preseizure_developmental_assessment
        name: Prospective developmental assessment of ring carriers before seizure onset
        description: >-
          Systematic developmental and behavioural assessment of individuals found
          to carry a ring 20 before epilepsy has begun, including relatives and
          incidental findings, establishing whether measurable deficits precede the
          first seizure.
        decision_criterion: >-
          Detectable pre-seizure developmental or behavioural deviation would show
          part of the phenotype is seizure-independent. Genuinely normal
          pre-seizure development across a series would strengthen the
          encephalopathy model.
    evidence:
      - reference: PMID:33363513
        reference_title: >-
          Ring Chromosome 20 Syndrome: Genetics, Clinical Characteristics, and
          Overlapping Phenotypes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          intellectual disability manifesting after seizure onset in otherwise
          normally developing children
        explanation: >-
          The core observation supporting the encephalopathy reading.
      - reference: PMID:22424860
        reference_title: >-
          Ring chromosome 20 syndrome: electroclinical description of six patients
          and review of the literature.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There were three patients out of six with behavioral disturbances before
          the onset of seizures.
        explanation: >-
          Refutes the claim that the whole neurobehavioural phenotype follows the
          seizures, since half of this series showed disturbance beforehand.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The r(20) ratio and severity of cognitive impairment appear to be
          directly related to each other and inversely correlated with the age at
          epilepsy onset.
        explanation: >-
          Documents the three-way correlation that makes seizure onset age and ring
          ratio impossible to separate without adjusted modeling, which is the
          confound this discussion turns on.
      - reference: PMID:27816898
        reference_title: Epilepsy in ring chromosome 20 syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epilepsy onset in adolescence (3 patients) was accompanied by a milder
          developmental course, dyscognitive seizures and non-convulsive status
          epilepticus, and no cognitive decline.
        explanation: >-
          Shows that nonconvulsive status can occur without cognitive decline when
          onset is later, which argues that the developmental window matters
          independently of seizure burden.

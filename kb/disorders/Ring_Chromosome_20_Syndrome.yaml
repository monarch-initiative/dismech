name: Ring Chromosome 20 Syndrome
creation_date: "2026-08-05T00:00:00Z"
category: Genetic
description: >-
  Ring chromosome 20 syndrome is a rare chromosomal epilepsy syndrome in which
  the two ends of chromosome 20 fuse into a circle, usually in only a fraction
  of cells. It is unusual and mechanistically interesting because most patients
  lose no genetic material at all in the process, yet develop a severe,
  drug-resistant childhood-onset epilepsy dominated by prolonged confusional
  episodes that carry a distinctive long-lasting rhythmic slow-wave pattern on
  the electroencephalogram. Children typically develop normally until seizures
  begin, then decline cognitively and behaviourally. There is usually no
  dysmorphism, no brain lesion on imaging, and no abnormality on chromosomal
  microarray, so the diagnosis is missed unless someone orders an old-fashioned
  karyotype. How a ring that deletes nothing produces epilepsy is genuinely
  unresolved, and the two leading candidate explanations, loss of nearby genes
  and altered expression of genes near the fusion point, have each been tested
  and found wanting.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - r(20) syndrome
  - ring 20 syndrome
  - ring chromosome 20
  - ring (20) chromosome epilepsy syndrome

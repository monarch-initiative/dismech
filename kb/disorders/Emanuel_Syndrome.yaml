progression:
- phase: Infancy through adulthood
  age_range: 9 months to 33 years in the reported cohort
  notes: >-
    Early mortality and long-term survival both occur, and the balance between
    them is not established. The largest cohort reports five deaths among 63
    individuals, four of them in the first five months and one at 33 years,
    while the surviving 58 ranged from 9 months to 33 years. The cohort paper
    states plainly that the true infant mortality rate is unknown and that
    long-term survival is possible, so this section records a range of outcomes
    rather than a prognosis. The two ascertainment biases that limit the cohort
    are quoted here as well, because they are what stops these figures being
    read as a survival estimate.
  evidence:
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the true infant mortality rate in Emanuel syndrome is unknown, long-term survival is possible."
    explanation: >-
      The source's own statement of what is and is not known about survival,
      and the reason no mortality rate is recorded here.
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five respondents had a child who was deceased. Of the deceased, the age at death was less than one month (n=2), 5 months (n=2) and 33 years (n=1)."
    explanation: Gives the deaths and ages at death in the cohort.
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining 58 respondents ranged in age from 9 months to 33 years."
    explanation: Gives the age range of the surviving cohort members.
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is possible that parents of the more severely affected children are more likely to seek this type of support. This would bias our results in favor of a poorer prognosis."
    explanation: >-
      The authors' own statement of the first ascertainment bias, which runs
      toward a worse apparent outcome.
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of those participating in this study have a child with Emanuel syndrome still living, which excludes parents whose children died earlier in life. Thus, our findings apply primarily to long-term survivors, who in general may have had fewer life-threatening congenital anomalies."
    explanation: >-
      The authors' own statement of the second ascertainment bias, which runs
      the other way — it is why these outcomes describe survivors rather than
      everyone born with the syndrome.
diagnosis:
- name: Chromosome analysis demonstrating the supernumerary der(22)
  description: >-
    Diagnosis rests on demonstrating duplication of 22q10-22q11 together with
    duplication of 11q23-qter carried on a supernumerary derivative chromosome
    22. Karyotype identifies the extra marker chromosome; array or FISH defines
    the duplicated intervals. Parental karyotyping follows, because in essentially
    every case one parent carries the balanced translocation and their recurrence
    risk and their relatives' carrier risk both depend on finding it.
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    47 chromosomes with a supernumerary der(22)t(11;22), and a balanced
    t(11;22)(q23;q11.2) in one parent.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Emanuel syndrome is established in a proband by detection of a duplication of 22q10-22q11 and duplication of 11q23-qter on a supernumerary derivative chromosome 22 [der(22)]."
    explanation: States the diagnostic criterion.
treatments:
- name: Multidisciplinary supportive and surgical management
  description: >-
    There is no treatment directed at the chromosomal imbalance. Management is
    the standard care of each malformation, delivered by a multidisciplinary team:
    gastroesophageal reflux and nutrition, anal atresia or stenosis, inguinal
    hernias, cardiac defects, cleft palate, hip dysplasia, hearing loss,
    cryptorchidism or micropenis, and ophthalmologic problems, alongside ongoing
    physical, occupational and speech therapy and alternative communication
    methods.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:

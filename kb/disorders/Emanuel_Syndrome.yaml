inheritance:
- name: Balanced parental translocation with 3:1 meiotic malsegregation
  description: >-
    Emanuel syndrome is not inherited in a Mendelian pattern. In more than 99 per
    cent of cases one parent is a phenotypically normal balanced carrier of
    t(11;22)(q23;q11.2), usually having inherited it from their own parent, and
    the affected child receives the der(22) as a supernumerary chromosome through
    3:1 malsegregation at meiosis. Carriers are typically ascertained through
    recurrent miscarriage, infertility, or the birth of an affected child. The
    recurrence risk differs by which parent carries the translocation.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In more than 99% of cases, one of the parents of a proband with Emanuel syndrome is a balanced carrier of a t(11;22)(q23;q11.2) and is phenotypically normal."
    explanation: >-
      Establishes the balanced carrier parent as the origin in essentially all
      cases, and that the carrier state is itself silent.
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risks vary depending on whether the mother or father of a proband is the balanced translocation carrier."
    explanation: >-
      Records the sex-of-carrier effect on recurrence risk, which is what genetic
      counselling for these families turns on.
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carriers of the balanced t(11;22)(q23.3;q11.2) translocation have up to a 10% chance of conceiving a child with this syndrome who survives to term"
    explanation: >-
      Quantifies the risk to a carrier couple of a liveborn affected child.
pathophysiology:
- name: Cruciform Extrusion at Palindromic AT-rich Repeats
  biological_scale: MOLECULAR
  description: >-
    The breakpoints of the recurrent t(11;22) lie at the centre of palindromic
    AT-rich repeats on 11q23 and 22q11. Palindromic sequence of this kind can
    extrude cruciform secondary structure, and the repeat regions carry a
    measurably elevated rate of double-strand breakage in both mitotic and
    meiotic cells. This is the reason the same translocation arises independently
    in unrelated families instead of tracing to a single ancestral event, and it
    is the true upstream cause of the syndrome.
  evidence:
  - reference: PMID:33258468
    reference_title: Double strand breaks (DSBs) as indicators of genomic instability in PATRR-mediated translocations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These breakpoints occur at the center of palindromic AT-rich repeats (PATRRs), which suggests that the structure of the DNA may play a contributory role, potentially through the formation of secondary cruciform structures."
    explanation: >-
      States the structural hypothesis and locates the breakpoints within the
      repeats, naming t(11;22) among the translocations concerned.
  - reference: PMID:33258468
    reference_title: Double strand breaks (DSBs) as indicators of genomic instability in PATRR-mediated translocations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, these experiments demonstrate an elevated rate of DSBs at PATRR regions, an indication that the structure of PATRR containing DNA may lead to increased breakage in multiple cellular environments."
    explanation: >-
      Supplies the measured double-strand break excess at the repeat regions,
      which is the evidence that the structure actually predisposes to breakage
      rather than merely being present at the breakpoints.
  downstream:
  - target: Recurrent Constitutional t(11;22) Translocation
    description: >-
      Breakage at both repeats and reciprocal exchange creates the balanced
      translocation.
- name: Recurrent Constitutional t(11;22) Translocation
  biological_scale: MOLECULAR
  description: >-
    The reciprocal exchange produces a balanced t(11;22)(q23;q11.2) carrier. The
    carrier is phenotypically normal, because gene dosage is unchanged, and is
    usually identified only through reproductive difficulty. This node is the
    silent intermediate that separates the molecular lesion from the disease: the
    person who carries the rearrangement is not the person who has the syndrome.
  evidence:
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin of this imbalance is 3:1 malsegregation of a parental balanced translocation between chromosomes 11 and 22, which is the most common recurrent reciprocal translocation in humans."
    explanation: >-
      Establishes the balanced parental translocation as the origin and records
      that it is the most common recurrent reciprocal translocation in humans.
  downstream:
  - target: 3:1 Meiotic Malsegregation Producing a Supernumerary der(22)
    description: >-
      At meiosis the quadrivalent can segregate three-to-one, sending the der(22)
      into a gamete alongside a full haploid set.
- name: "3:1 Meiotic Malsegregation Producing a Supernumerary der(22)"
  biological_scale: CELLULAR
  description: >-
    In a balanced carrier the two normal chromosomes and the two derivatives pair
    as a quadrivalent at meiosis I. Tertiary trisomy arises when this segregates
    three-to-one, so a gamete receives the der(22) in addition to a complete
    haploid complement. Most malsegregant conceptuses are lost; the der(22)
    product is the one that is compatible with survival to term, which is why this
    particular imbalance is the one seen clinically.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "possible outcomes of future pregnancies of the proband's parents include: normal chromosomes, supernumerary der(22) syndrome, balanced t(11;22) carrier, and spontaneous abortion as a result of supernumerary der(22) or another meiotic malsegregant"
    explanation: >-
      Enumerates the segregation outcomes, including the pregnancy losses, which
      is what makes the liveborn der(22) a selected subset rather than the
      commonest product.
  downstream:
  - target: Partial Trisomy 11q23-qter and 22q11
    description: >-
      The extra derivative chromosome adds a third copy of both duplicated
      segments.
- name: Partial Trisomy 11q23-qter and 22q11
  biological_scale: MOLECULAR
  description: >-
    The zygote carries 47 chromosomes: two normal 11s, two normal 22s, and the
    der(22). The consequence is a third copy of distal 11q and of proximal 22q.
    This is a contiguous-gene dosage lesion rather than the disruption of any one
    gene, and no single gene in either interval has been shown to account for the
    phenotype.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Emanuel syndrome is established in a proband by detection of a duplication of 22q10-22q11 and duplication of 11q23-qter on a supernumerary derivative chromosome 22 [der(22)]."
    explanation: >-
      Defines the duplicated intervals that constitute the dosage lesion, and is
      simultaneously the diagnostic criterion.
  downstream:
  - target: Multisystem Developmental Disruption from Trisomic Gene Dosage
    description: >-
      Excess dosage across both intervals perturbs development in several organ
      systems at once.
- name: Multisystem Developmental Disruption from Trisomic Gene Dosage
  biological_scale: ORGANISM
  description: >-
    Trisomic dosage across the two duplicated segments disrupts craniofacial,
    cardiac, renal, genital and central nervous system development, together with
    prenatal and postnatal growth. The pattern is a recognisable syndrome rather
    than a random collection of malformations, but the mapping from individual
    genes in the duplicated intervals to individual features is not established.
    The resulting developmental disability is static rather than progressive;
    morbidity and mortality are driven by the structural malformations and are
    concentrated in infancy.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Emanuel syndrome is characterized by pre- and postnatal growth deficiency, microcephaly, hypotonia, severe developmental delays, ear anomalies, preauricular tags or pits, cleft or high-arched palate, congenital heart defects, kidney abnormalities, and genital abnormalities in males."
    explanation: >-
      Enumerates the multisystem outcome that the dosage imbalance produces.

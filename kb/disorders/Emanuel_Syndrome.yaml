diagnosis:
- name: Chromosome analysis demonstrating the supernumerary der(22)
  description: >-
    Diagnosis rests on demonstrating duplication of 22q10-22q11 together with
    duplication of 11q23-qter carried on a supernumerary derivative chromosome
    22. Karyotype identifies the extra marker chromosome; array or FISH defines
    the duplicated intervals. Parental karyotyping follows, because in essentially
    every case one parent carries the balanced translocation and their recurrence
    risk and their relatives' carrier risk both depend on finding it.
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    47 chromosomes with a supernumerary der(22)t(11;22), and a balanced
    t(11;22)(q23;q11.2) in one parent.
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Emanuel syndrome is established in a proband by detection of a duplication of 22q10-22q11 and duplication of 11q23-qter on a supernumerary derivative chromosome 22 [der(22)]."
    explanation: States the diagnostic criterion.
treatments:
- name: Multidisciplinary supportive and surgical management
  description: >-
    There is no treatment directed at the chromosomal imbalance. Management is
    the standard care of each malformation, delivered by a multidisciplinary team:
    gastroesophageal reflux and nutrition, anal atresia or stenosis, inguinal
    hernias, cardiac defects, cleft palate, hip dysplasia, hearing loss,
    cryptorchidism or micropenis, and ophthalmologic problems, alongside ongoing
    physical, occupational and speech therapy and alternative communication
    methods.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Care by a multidisciplinary team is usually necessary; standard management of gastroesophageal reflux, nutrition, anal atresia (or stenosis), inguinal hernias, cardiac defects, cleft palate, hip dysplasia, other skeletal complications, hearing loss, cryptorchidism and/or micropenis, refractive errors, and strabismus or other ophthalmologic issues; ongoing physical, occupational, and speech therapies; alternative communication methods to facilitate communication."
    explanation: >-
      Enumerates the management the GeneReviews chapter recommends, which is the
      whole of available treatment.
- name: Airway precautions during sedation and anaesthesia
  description: >-
    A specific, actionable precaution rather than general supportive care:
    micrognathia and hypotonia make airway management hazardous, and the
    recommendation is that sedation or operative procedures happen where paediatric
    anaesthesia is available.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attention to the airway during sedation and/or operative procedures in an institution with pediatric anesthesiologists."
    explanation: >-
      States the airway precaution as a prevention-of-complications
      recommendation.
- name: Genetic counselling and prenatal testing for carrier families
  description: >-
    Because the recurrence risk sits with the balanced-carrier parent rather than
    with the affected child, counselling is directed at the parents and the wider
    family. Prenatal testing is available once the rearrangement has been
    confirmed in the family.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301440
    reference_title: Emanuel Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal testing for a pregnancy at increased risk is possible if the chromosome abnormality has been confirmed in the family."
    explanation: >-
      Establishes the availability of prenatal testing conditional on prior
      familial confirmation, which is why parental karyotyping is part of the
      diagnostic pathway.
notes: >-
  GeneReviews scope. The GeneReviews chapter for this disease (PMID:20301440) is
  tagged in `references` and is quoted for clinical characteristics, diagnosis,
  management and genetic counselling. Its cached record carries the chapter's
  structured summary sections rather than the full text, so quotations here are
  drawn from those summaries; statements attributed to the full chapter in
  secondary sources have not been used unless they also appear in the cached
  record.

  Motor outcome, and a discrepancy worth knowing about. This entry states the
  figure from the largest reported cohort, in which over 70 per cent of
  individuals eventually learned to walk with support. Secondary summaries of the
  GeneReviews chapter give a considerably more pessimistic account, to the effect
  that only a small number learn to walk. That more pessimistic statement is not
  present in the cached GeneReviews record and so is not cited here, and the two
  claims are not reconciled. The cohort figure came from a family-recruited
  questionnaire study through an online support group, which is a real
  ascertainment difference and could plausibly bias toward better-functioning
  individuals. A curator with the full GeneReviews text should check this rather
  than assume the cohort figure supersedes it.

name: Emanuel Syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Chromosomal
description: >-
  Emanuel syndrome is a chromosomal disorder caused by a supernumerary
  derivative chromosome 22, der(22)t(11;22), which carries duplicated material
  from distal 11q and proximal 22q on top of a normal diploid complement. The
  result is partial trisomy for 11q23-qter and for 22q11, and the clinical
  picture is pre- and postnatal growth deficiency, microcephaly, hypotonia,
  severe developmental delay, ear anomalies with preauricular tags or pits,
  cleft or high-arched palate, congenital heart defects, kidney abnormalities,
  and genital abnormalities in males.

  What makes the entity mechanistically interesting, and worth a mechanism entry
  rather than a list of duplicated genes, is that the underlying rearrangement is
  not a random accident. The t(11;22)(q23;q11.2) is the most common recurrent
  constitutional reciprocal translocation in humans, and it recurs because both
  breakpoints sit at the centre of palindromic AT-rich repeats. Those repeats can
  extrude cruciform secondary structures and carry an elevated rate of
  double-strand breakage, so the same exchange arises independently in unrelated
  families rather than descending from one ancestral event. The upstream cause is
  therefore curatable as DNA structure, which is unusual for a contiguous-gene
  syndrome. In more than 99 per cent of cases a phenotypically normal parent
  carries the balanced translocation, and the affected child arises through 3:1
  meiotic malsegregation that delivers the der(22) as an extra chromosome.

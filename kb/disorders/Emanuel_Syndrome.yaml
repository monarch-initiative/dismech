- category: Neurologic
  name: Severe developmental delay and intellectual disability
  description: >-
    Psychomotor development is uniformly delayed. Language and self-care ability
    are severely impaired, and alternative communication methods are usually
    needed.
  phenotype_term:
    preferred_term: Severe global developmental delay
    term:
      id: HP:0011344
      label: Severe global developmental delay
  frequency: OBLIGATE
  evidence:
  - reference: PMID:19606488
    reference_title: "Phenotypic delineation of Emanuel syndrome (supernumerary derivative 22 syndrome): Clinical features of 63 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychomotor development is uniformly delayed, however the majority of individuals (over 70%) eventually learn to walk with support."
    explanation: >-
      Establishes the universality of the developmental delay in the largest
      reported cohort, and simultaneously records the motor outcome.

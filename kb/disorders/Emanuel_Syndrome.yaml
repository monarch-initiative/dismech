discussions:
- discussion_id: emanuel_11q_versus_22q_dosage_asymmetry
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of Emanuel syndrome's features are driven by the trisomic 11q23-qter
    segment and which by the 22q11 segment, and why is the evidence so much
    thinner on the 11q side?
  rationale: >-
    The entry's dosage node says no single gene in either interval accounts for
    the phenotype, which is true but flattens something informative. The two
    duplicated segments are not equally understood. The proximal 22q11 segment
    overlaps the DiGeorge and velocardiofacial critical region, where dosage of
    genes including TBX1 has been studied in mouse models and connects
    plausibly to the cardiac and craniofacial features; dismech already curates
    22q11.2 Duplication Syndrome, so that is a live cross-reference rather than
    a hypothetical one. The 11q23-qter segment has no comparable dissection, and
    the neurodevelopmental, renal and growth features attributed to it rest on
    the correlation between having the segment in triplicate and having the
    phenotype.

    The gap is worth recording because the asymmetry is easy to mistake for a
    finding. A reader encountering TBX1 in the literature on this region may take
    the cardiac branch as mechanistically explained and the rest as merely not
    yet written up, when the actual position is that one half has candidate genes
    and the other half has none. Closing it needs per-gene dosage evidence for
    the 11q interval of the kind that exists for 22q11, and this entry
    deliberately does not name candidate genes on either side, because doing so
    from review literature rather than from dosage studies would manufacture the
    symmetry the gap is about.
  attaches_to:
  - pathophysiology#Partial Trisomy 11q23-qter and 22q11
  - pathophysiology#Multisystem Developmental Disruption from Trisomic Gene Dosage
notes: >-
  GeneReviews scope. The GeneReviews chapter for this disease (PMID:20301440) is
  tagged in `references` and is quoted for clinical characteristics, diagnosis,
  management and genetic counselling. Its cached record carries the chapter's
  structured summary sections rather than the full text, so quotations here are
  drawn from those summaries; statements attributed to the full chapter in
  secondary sources have not been used unless they also appear in the cached
  record.

  Motor outcome, and a discrepancy worth knowing about. This entry states the
  figure from the largest reported cohort, in which over 70 per cent of
  individuals eventually learned to walk with support. Secondary summaries of the
  GeneReviews chapter give a considerably more pessimistic account, to the effect
  that only a small number learn to walk. That more pessimistic statement is not
  present in the cached GeneReviews record and so is not cited here, and the two
  claims are not reconciled.

  On which way the cohort is biased, the paper answers for itself, and not with
  the one-directional answer this note previously gave. Recruitment through an
  online support group could over-represent severely affected children, which
  the authors say would bias the results toward a poorer prognosis; and because
  most participating families had a living child, the cohort excludes those
  whose children died earlier, so the authors state their findings apply
  primarily to long-term survivors. Both sentences are quoted on the
  progression section. The two biases run in opposite directions and the paper
  does not net them out, so the discrepancy stands open rather than resolving in
  the cohort's favour. A curator with the full GeneReviews text should still
  check it.

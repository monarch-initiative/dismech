name: Sialuria
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Sialuria
  term:
    id: MONDO:0010028
    label: sialuria
synonyms:
- sialuria, French type
- French type sialuria
- UDP-GlcNAc 2-epimerase, feedback-resistant
description: >-
  Sialuria is an ultra-rare autosomal dominant inborn error of sialic acid
  metabolism, and it is the mechanistic mirror image of the far better known
  recessive GNE myopathy: both are caused by variants in GNE, the bifunctional
  UDP-N-acetylglucosamine 2-epimerase / N-acetylmannosamine kinase that runs the
  first, rate-limiting steps of sialic acid biosynthesis, but where GNE myopathy
  is a hypomorphic loss of function that starves tissue of sialic acid, sialuria
  is a gain of function that floods it. The lesion is exquisitely specific. A
  single heterozygous missense change at the allosteric CMP-N-acetylneuraminic
  acid (CMP-Neu5Ac) feedback site in the epimerase domain — clustered at two
  arginine residues, historically numbered Arg263 and Arg266 and now Arg294 and
  Arg297 — leaves the enzyme catalytically normal but deaf to the end-product
  feedback that normally shuts it off. The result is a constitutively active
  epimerase that overproduces free (unconjugated) N-acetylneuraminic acid, which
  accumulates in the cytoplasm (not the lysosome, which is what separates it from
  the recessive free sialic acid storage disorders ISSD and Salla disease, caused
  by SLC17A5) and spills into the urine in gram quantities. Clinically it is a
  mild and easily missed disorder: mildly coarse facies, hepatomegaly, variable
  developmental delay, prolonged neonatal jaundice, and recurrent infections in
  infancy, with substantial improvement over childhood — one of the diagnostic
  adults was ascertained only because her son was affected. Fewer than a dozen
  patients have been reported worldwide, and the true prevalence is thought to be
  grossly underestimated because urinary free sialic acid is not routinely
  assayed.
pathophysiology:
- name: GNE Allosteric-Site Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous missense variant in GNE at the allosteric CMP-Neu5Ac
    binding (feedback) site of the UDP-GlcNAc 2-epimerase domain. Reported changes
    cluster at two arginine residues, R263 and R266 in the original NM_005476
    numbering (R266W, R266Q, R263L), now designated Arg294 and Arg297. Crystallography
    of the epimerase domain places these residues at the dimer-dimer interface where
    the carboxyl group of the Neu5Ac moiety of the inhibitor is coordinated, which is
    why single substitutions at Arg263/Arg266 abolish feedback binding.
  genes:
  - preferred_term: GNE
    term:
      id: hgnc:23657
      label: GNE
  genetic_context:
    genes:
    - preferred_term: GNE
      term:
        id: hgnc:23657
        label: GNE
    allele_type: missense (allosteric CMP-Neu5Ac feedback site)
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      A heterozygous missense variant at the allosteric feedback site that leaves
      catalysis intact but abolishes CMP-Neu5Ac feedback inhibition, a gain of
      function acting in the heterozygous state.
  downstream:
  - target: Loss of CMP-Neu5Ac Feedback Inhibition of UDP-GlcNAc 2-Epimerase
    causal_link_type: DIRECT
    description: >-
      The substitution sits in the allosteric site, so it directly disrupts
      inhibitor binding rather than catalysis.
    evidence:
    - reference: PMID:26980148
      reference_title: "Mechanism and inhibition of human UDP-GlcNAc 2-epimerase, the key enzyme in sialic acid biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the CMP-Neu5Ac binding mode clearly elucidates why mutations in Arg263 and Arg266 can cause sialuria."
      explanation: >-
        The epimerase crystal structure localizes the sialuria variants to the
        inhibitor-binding site, establishing this edge from variant to loss of
        feedback binding.
  evidence:
  - reference: PMID:10330343
    reference_title: "Mutations in the human UDP-N-acetylglucosamine 2-epimerase gene define the disease sialuria and the allosteric site of the enzyme."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their heterozygote mutations, R266W, R266Q, and R263L, indicate that the allosteric site of the epimerase resides in the region of codons 263-266."
    explanation: >-
      The gene-defining study identifying the heterozygous allosteric-site variants
      in sialuria patients.
  - reference: PMID:29923088
    reference_title: "Sialuria: Ninth Patient Described Has a Novel Mutation in GNE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, eight cases had been published worldwide, all with heterozygous missense variants at the allosteric site, specifically at Arginine 294 (formerly 263) and Arginine 297 (formerly 266) of GNE."
    explanation: >-
      Confirms that all reported variants are heterozygous allosteric-site missense
      changes and records the current residue renumbering.
- name: Loss of CMP-Neu5Ac Feedback Inhibition of UDP-GlcNAc 2-Epimerase
  biological_scale: MOLECULAR
  description: >-
    The mutant epimerase retains normal catalytic activity but is no longer
    inhibitable by its downstream product CMP-Neu5Ac. Normal fibroblast epimerase
    is inhibited 79-100% by 100 microM CMP-Neu5Ac; sialuria enzyme is inhibited
    only 19-27%, and in some patients not at all. Because feedback inhibition is
    the enzyme's sole regulatory brake and does not affect the ManNAc kinase
    activity, its loss leaves a constitutively active, rate-limiting enzyme even in
    the heterozygous state — the biochemical basis of the dominant inheritance.
  molecular_functions:
  - preferred_term: UDP-N-acetylglucosamine 2-epimerase activity (feedback-resistant)
    term:
      id: GO:0008761
      label: UDP-N-acetylglucosamine 2-epimerase activity
    modifier: GAIN_OF_FUNCTION
  chemical_entities:
  - preferred_term: CMP-N-acetylneuraminic acid (allosteric feedback inhibitor)
    term:
      id: CHEBI:16556
      label: CMP-N-acetyl-beta-neuraminic acid
  downstream:
  - target: Unregulated Overproduction of Free N-Acetylneuraminic Acid
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, even in the heterozygous state, the mutant allele produces a constitutively active, rate-limiting enzyme that achieves sufficient NeuAc synthesis to cause overproduction of free sialic acid."
    explanation: >-
      States the qualitative gain of function: loss of feedback control yields a
      constitutively active enzyme in the heterozygote.
  - reference: PMID:10356312
    reference_title: "Sialuria in a Portuguese girl: clinical, biochemical, and molecular characteristics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "fibroblast UDP-GlcNAc 2-epimerase activity was only 26% inhibited by 100 microM CMP-Neu5Ac (normal, 79%)."
    explanation: >-
      Quantifies the loss of feedback inhibition in a patient's fibroblasts.
  - reference: PMID:26980148
    reference_title: "Mechanism and inhibition of human UDP-GlcNAc 2-epimerase, the key enzyme in sialic acid biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The feedback inhibition is highly positively cooperative and it does not affect the ManNAc kinase activity"
    explanation: >-
      Establishes that CMP-Neu5Ac feedback acts specifically on the epimerase, so
      its loss deregulates the epimerase step while leaving kinase activity intact.
  - reference: PMID:21436238
    reference_title: "Enhanced sialylation of recombinant human erythropoietin in Chinese hamster ovary cells by combinatorial engineering of selected genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GNE/MNK-R263L-R266Q mutant showed 93.6% relative activity compared with wild type and did not display feedback inhibition."
    explanation: >-
      An engineered GNE carrying the two sialuria residues loses feedback inhibition
      while retaining near-normal catalytic activity, isolating loss of feedback
      (not loss of catalysis) as the lesion.
- name: Unregulated Overproduction of Free N-Acetylneuraminic Acid
  biological_scale: MOLECULAR
  description: >-
    With feedback removed, the epimerase runs unchecked and the sialic acid
    biosynthetic pathway overproduces free N-acetylneuraminic acid (Neu5Ac).
    Patients synthesize sialic acid in gram quantities.
  biological_processes:
  - preferred_term: N-acetylneuraminate biosynthetic process
    term:
      id: GO:0046380
      label: N-acetylneuraminate biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: free N-acetylneuraminic acid
    term:
      id: CHEBI:17012
      label: N-acetylneuraminic acid
    modifier: INCREASED
  downstream:
  - target: Cytoplasmic Free Sialic Acid Accumulation
    causal_link_type: DIRECT
  - target: Massive Urinary Free Sialic Acid Excretion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10330343
    reference_title: "Mutations in the human UDP-N-acetylglucosamine 2-epimerase gene define the disease sialuria and the allosteric site of the enzyme."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overproduction of NeuAc is believed to result from loss of feedback inhibition of uridinediphosphate-N-acetylglucosamine 2-epimerase (UDP-GlcNAc 2-epimerase) by cytidine monophosphate-N-acetylneuraminic acid (CMP-Neu5Ac)."
    explanation: >-
      States that overproduction of free sialic acid follows from the loss of
      feedback inhibition.
  - reference: PMID:16137682
    reference_title: "The intracellular concentration of sialic acid regulates the polysialylation of the neural cell adhesion molecule."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of the sialuria-mutated GNE leads to a dramatic increase of both cellular sialic acid and polysialic acid on NCAM."
    explanation: >-
      Direct in vitro demonstration that a sialuria GNE variant increases cellular
      sialic acid.
  - reference: PMID:40413313
    reference_title: "Expression of GNE mutant proteins increases CHO intracellular CMP-Neu5Ac levels without impact on bioprocess performance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutant protein dramatically increased the intracellular concentrations of CMP-Neu5Ac, reaching the maximal level as with the addition of ManNAc."
    explanation: >-
      A sialuria-type GNE mutant engineered into CHO cells raises intracellular
      activated sialic acid, confirming increased pathway flux.
  - reference: PMID:21436238
    reference_title: "Enhanced sialylation of recombinant human erythropoietin in Chinese hamster ovary cells by combinatorial engineering of selected genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CMP-sialic acid concentration of engineered cells was significantly (>10-fold) increased by sialuria-mutated GNE/MNK (R263L-R266Q) expression."
    explanation: >-
      Expressing a sialuria-mutated GNE raises intracellular activated sialic acid
      more than tenfold, quantifying the gain of pathway flux.
- name: Cytoplasmic Free Sialic Acid Accumulation
  biological_scale: CELLULAR
  description: >-
    The overproduced free Neu5Ac accumulates in the cytoplasm of cells, not in the
    lysosome. In patient fibroblasts about 59% of recovered free NeuAc is in the
    soluble cytoplasmic fraction. This cytoplasmic (as opposed to intralysosomal)
    localization is the cell-biological feature that distinguishes sialuria from
    the recessive lysosomal free sialic acid storage disorders (ISSD and Salla
    disease), which are caused by defective lysosomal egress via SLC17A5, a
    different gene and mechanism.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Hepatomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Increased NCAM Polysialylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only 21% of the recovered NeuAc was found in the lysosomes, and 59% of the recovered NeuAc was in the soluble fraction representing the cytoplasm"
    explanation: >-
      Quantifies the cytoplasmic (non-lysosomal) distribution of accumulated free
      sialic acid in patient fibroblasts.
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the intracellular distribution of NeuAc primarily in the cytoplasm, as opposed to its intralysosomal accumulation in ISSD cells"
    explanation: >-
      Establishes the cytoplasmic localization as the feature distinguishing sialuria
      from the lysosomal free sialic acid storage disorders.
- name: Massive Urinary Free Sialic Acid Excretion
  biological_scale: ORGANISM
  description: >-
    The overproduced free sialic acid is excreted in the urine in gram quantities
    (greater than 1 g/day), the biochemical hallmark of the disorder and the basis
    of its name. Urinary free NeuAc is markedly elevated (reported to thousands of
    micromol per mmol creatinine, against a control of less than 74).
  chemical_entities:
  - preferred_term: free N-acetylneuraminic acid (urinary)
    term:
      id: CHEBI:17012
      label: N-acetylneuraminic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "urinary excretion of large quantities (>1 g/d) of free N-acetylneuraminic acid (NeuAc)."
    explanation: >-
      Documents the gram-scale urinary excretion that defines sialuria.
  - reference: PMID:29923088
    reference_title: "Sialuria: Ninth Patient Described Has a Novel Mutation in GNE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytoplasmic accumulation and urinary excretion of gram quantities of free sialic acid"
    explanation: >-
      Independent statement of the gram-scale urinary excretion.
- name: Increased NCAM Polysialylation
  biological_scale: MOLECULAR
  description: >-
    The enlarged intracellular sialic acid pool increases polysialylation of the
    neural cell adhesion molecule (NCAM). This has been shown both in cells
    expressing sialuria-mutated GNE and in the brains of a transgenic sialuria
    mouse, and is a proposed (not established) route to the developmental delay
    seen in patients.
  biological_processes:
  - preferred_term: protein sialylation (NCAM polysialylation)
    term:
      id: GO:0097503
      label: sialylation
    modifier: INCREASED
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ncam_polysialylation_delay
    description: >-
      A proposed link from increased NCAM polysialylation to the neurodevelopmental
      phenotype, supported so far only by model systems.
  evidence:
  - reference: PMID:27966821
    reference_title: "Increased Polysialylation of the Neural Cell Adhesion Molecule in a Transgenic Mouse Model of Sialuria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analyzing the (poly)sialylation of neural cell adhesion molecule (NCAM) revealed increased polysialylation in brains of transgenic mice compared to wild-type."
    explanation: >-
      Demonstrates increased NCAM polysialylation in a sialuria mouse model.
  - reference: PMID:16137682
    reference_title: "The intracellular concentration of sialic acid regulates the polysialylation of the neural cell adhesion molecule."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of the sialuria-mutated GNE leads to a dramatic increase of both cellular sialic acid and polysialic acid on NCAM."
    explanation: >-
      In vitro confirmation that sialuria-type GNE raises NCAM polysialylation.
mechanistic_hypotheses:
- hypothesis_group_id: ncam_polysialylation_delay
  hypothesis_label: NCAM polysialylation as a route to developmental delay
  status: EMERGING
  description: >-
    The hypothesis that increased intracellular sialic acid drives increased NCAM
    polysialylation, which in turn contributes to the developmental delay of
    sialuria. Support is currently limited to a transgenic mouse and cell models;
    the transgenic-mouse authors frame it explicitly as a possibility ("could play
    a role"). No direct human evidence links NCAM polysialylation to the delay.
  evidence:
  - reference: PMID:27966821
    reference_title: "Increased Polysialylation of the Neural Cell Adhesion Molecule in a Transgenic Mouse Model of Sialuria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that the intracellular sialic acid concentration regulates polysialylation on NCAM in vivo; this could play a role in the manifestation of the developmental delays in sialuria patients."
    explanation: >-
      The model-organism study proposing, tentatively, the NCAM-polysialylation
      route to developmental delay.

  description: >-
    Primary fibroblasts from an R266Q sialuria patient, used to test allele-specific
    knockdown. A synthetic siRNA targeting the mutant c.797G>A (p.R266Q) allele
    lowered mutant transcript, reduced free sialic acid to within the normal range,
    and restored CMP-sialic acid feedback inhibition of GNE-epimerase — a rescue
    experiment that both confirms the causal mechanism and is a therapeutic
    proof-of-concept for the dominant allele.

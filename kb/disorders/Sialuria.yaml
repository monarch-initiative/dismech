biochemical:
- name: Urinary free N-acetylneuraminic acid
  notes: >-
    Markedly elevated urinary excretion of free (unconjugated) N-acetylneuraminic
    acid is the biochemical hallmark of sialuria; gram-per-day quantities are
    excreted. Unlike sialidosis, the excreted sialic acid is free rather than
    bound in glycoconjugates, and unlike ISSD/Salla disease it reflects cytoplasmic
    overproduction rather than lysosomal storage.
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "urinary excretion of large quantities (>1 g/d) of free N-acetylneuraminic acid (NeuAc)."
    explanation: >-
      Establishes gram-scale urinary free sialic acid as the biochemical marker.
- name: Reduced CMP-Neu5Ac inhibition of fibroblast UDP-GlcNAc 2-epimerase
  notes: >-
    A confirmatory enzymatic assay: patient fibroblast UDP-GlcNAc 2-epimerase shows
    greatly reduced inhibition by CMP-Neu5Ac (19-27%, and in some patients none)
    versus 79-100% in controls.
  evidence:
  - reference: PMID:10356312
    reference_title: "Sialuria in a Portuguese girl: clinical, biochemical, and molecular characteristics."
    supports: SUPPORT
    evidence_source: IN_VITRO

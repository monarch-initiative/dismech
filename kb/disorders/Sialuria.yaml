genetic:
- name: GNE allosteric feedback-site variant
  gene_term:
    preferred_term: GNE
    term:
      id: hgnc:23657
      label: GNE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Sialuria is caused by a single heterozygous missense variant in GNE (9p13.3)
    affecting the allosteric CMP-Neu5Ac feedback site of the UDP-GlcNAc 2-epimerase
    domain. Reported variants cluster tightly at two arginine codons: R266W, R266Q,
    and R263L in the original NM_005476 numbering, now designated Arg297 and Arg294
    respectively (a 31-residue offset relative to the longer NM_001128227 transcript,
    the same offset seen in the GNE myopathy literature). The variant is a gain of
    function: it leaves catalysis intact but abolishes end-product feedback
    inhibition, so a single mutant allele suffices to deregulate the pathway. Most
    cases arise de novo as new dominant mutations; one family has confirmed
    parent-to-child transmission. The functional consequence is recorded on the
    GNE Allosteric-Site Missense Variant pathophysiology node as
    functional_impact_category GAIN_OF_FUNCTION.
  evidence:
  - reference: PMID:10330343
    reference_title: "Mutations in the human UDP-N-acetylglucosamine 2-epimerase gene define the disease sialuria and the allosteric site of the enzyme."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterozygous nature of the mutant allele in all three patients reveals a dominant mechanism of inheritance for sialuria."
    explanation: >-
      Establishes the heterozygous, dominant genetic basis.
  - reference: PMID:26980148
    reference_title: "Mechanism and inhibition of human UDP-GlcNAc 2-epimerase, the key enzyme in sialic acid biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sialuria is an autosomal dominant disorder which is related to GNE mutation in one of the two arginine residues 263 and 266 (R263L, R266Q or R266W)"
    explanation: >-
      Enumerates the recurrent allosteric-site arginine substitutions.
  - reference: PMID:29923088
    reference_title: "Sialuria: Ninth Patient Described Has a Novel Mutation in GNE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specifically at Arginine 294 (formerly 263) and Arginine 297 (formerly 266) of GNE."
    explanation: >-
      Records the current residue numbering for the recurrent variants.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. The dominance has a biochemical basis: a single mutant
    allele produces a constitutively active, feedback-resistant enzyme, which
    overproduces sialic acid regardless of the normal allele. Most affected
    individuals were thought to represent new (de novo) mutations; parent-to-child
    transmission was confirmed in one family, in which the affected mother was
    diagnosed retrospectively after her son.
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heterozygous R266Q mutation was detected in the patient's mother, who has similarly increased urinary levels of free NeuAc, thereby confirming, for the first time, the dominant mode of inheritance of this inborn error."
    explanation: >-
      Confirms dominant inheritance through documented vertical transmission.
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sialuria is an autosomal dominant disorder and that affected individuals represent new mutations"
    explanation: >-
      Records the earlier inference that most cases are de novo dominant mutations.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Nine cases had been reported worldwide as of 2019 (eight previously
    published plus the ninth). The true prevalence is thought to be grossly
    underestimated because the phenotype is mild and variable and urinary free
    sialic acid is not routinely assayed.
  evidence:
  - reference: PMID:29923088
    reference_title: "Sialuria: Ninth Patient Described Has a Novel Mutation in GNE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present the ninth case of sialuria diagnosed in a child investigated because of clinical signs and symptoms and furthermore describe a novel pathogenic variant in the associated gene, GNE."
    explanation: >-
      Establishes the reported case count (ninth patient) as of 2019.
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of sialuria is probably grossly underestimated."
    explanation: >-
      States that the disorder is likely underdiagnosed.
treatments:
- name: Supportive care and multisystem monitoring
  description: >-
    There is no disease-specific therapy for sialuria. Management is supportive and
    directed at the individual manifestations, with recommended longitudinal
    monitoring of liver and pulmonary function given the reported hepatomegaly,
    transaminase elevation, and small-airway obstruction.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:11486897
    reference_title: "Clinical course and biochemistry of sialuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend close monitoring of liver and pulmonary function in sialuria patients."
    explanation: >-
      Basis for the recommended supportive monitoring.
- name: Genetic counseling
  description: >-
    Genetic counseling for an autosomal dominant disorder, addressing the 50%
    transmission risk for an affected parent and the possibility of de novo
    mutation, and the mild and variable expressivity that can leave carriers
    undiagnosed.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heterozygous R266Q mutation was detected in the patient's mother, who has similarly increased urinary levels of free NeuAc, thereby confirming, for the first time, the dominant mode of inheritance of this inborn error."
    explanation: >-
      Documents dominant transmission, the basis for counseling on recurrence risk.
- name: Allele-specific RNA interference (investigational)
  description: >-
    Investigational, not clinically available. Because sialuria is a dominant
    gain-of-function disorder, silencing only the mutant allele while leaving the
    normal allele to provide regulated enzyme is a rational strategy. In R266Q
    patient fibroblasts, a mutant-allele-specific siRNA lowered free sialic acid to
    the normal range and restored feedback inhibition, a cell-culture proof of
    concept only — no in vivo or clinical data exist.
  therapeutic_modality: SIRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:18653764
    reference_title: "Allele-specific silencing of the dominant disease allele in sialuria by RNA interference."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings indicate that allele-specific silencing of a mutated allele is a viable therapeutic strategy for autosomal dominant diseases, including sialuria."
    explanation: >-
      Establishes allele-specific silencing as a proposed therapeutic strategy,
      demonstrated so far only in patient fibroblasts.
diagnosis:
- name: Urine free sialic acid measurement
  description: >-
    Markedly elevated urine free (unconjugated) sialic acid is the screening
    biomarker. It is shared with the SLC17A5 free sialic acid storage disorders
    (ISSD/Salla), so it identifies the biochemical class rather than the specific
    gene; a non-specific elevation can also occur in acute pneumococcal sepsis,
    an important false-positive caveat.
  diagnosis_term:
    preferred_term: urine free sialic acid measurement
  evidence:
  - reference: PMID:36000484
    reference_title: "Free urinary sialic acid levels may be elevated in patients with pneumococcal sepsis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine free sialic acid (UFSA) is an important diagnostic biomarker for sialuria (GNE variants) and infantile sialic acid storage disease/Salla disease (SLC17A5 variants)."
    explanation: >-
      Establishes urine free sialic acid as the screening biomarker shared by
      sialuria and the SLC17A5 storage disorders.
  - reference: PMID:36000484
    reference_title: "Free urinary sialic acid levels may be elevated in patients with pneumococcal sepsis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three cases of increased UFSA detected by UMSMS screening that were secondary to S. pneumoniae sepsis."
    explanation: >-
      Records the pneumococcal-sepsis false-positive caveat on the hallmark
      urinary biomarker.
- name: Fibroblast subcellular fractionation
  description: >-
    Subcellular fractionation of cultured fibroblasts localizes the accumulated
    free sialic acid to the cytoplasm rather than the lysosome, discriminating
    sialuria from the lysosomal free sialic acid storage disorders (ISSD/Salla).
  diagnosis_term:
    preferred_term: fibroblast subcellular fractionation
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the intracellular distribution of NeuAc primarily in the cytoplasm, as opposed to its intralysosomal accumulation in ISSD cells"
    explanation: >-
      Cytoplasmic (non-lysosomal) localization on fractionation is the
      compartment discriminator from ISSD/Salla.
- name: CMP-Neu5Ac feedback-inhibition enzyme assay
  description: >-
    Assay of fibroblast UDP-GlcNAc 2-epimerase inhibition by CMP-Neu5Ac
    confirms the loss of feedback inhibition (greatly reduced % inhibition versus
    controls) that is the biochemical lesion of sialuria.
  diagnosis_term:
    preferred_term: CMP-Neu5Ac feedback-inhibition enzyme assay
  evidence:
  - reference: PMID:10356312
    reference_title: "Sialuria in a Portuguese girl: clinical, biochemical, and molecular characteristics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "fibroblast UDP-GlcNAc 2-epimerase activity was only 26% inhibited by 100 microM CMP-Neu5Ac (normal, 79%)."
    explanation: >-
      The reduced CMP-Neu5Ac inhibition of the patient enzyme confirms loss of
      feedback control.
- name: GNE allosteric-site sequencing
  description: >-
    Targeted sequencing of the GNE epimerase-domain allosteric codons (the
    Arg263/Arg266, now Arg294/Arg297, cluster) provides the molecular diagnosis.
  diagnosis_term:
    preferred_term: GNE allosteric-codon sequencing
  evidence:
  - reference: PMID:10330343
    reference_title: "Mutations in the human UDP-N-acetylglucosamine 2-epimerase gene define the disease sialuria and the allosteric site of the enzyme."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their heterozygote mutations, R266W, R266Q, and R263L, indicate that the allosteric site of the epimerase resides in the region of codons 263-266."
    explanation: >-
      Identifies the recurrent allosteric-site GNE variants that molecular
      testing targets.
differential_diagnoses:
- name: Free sialic acid storage disorders (ISSD/Salla disease)
  disease_term:
    preferred_term: free sialic acid storage disorder (SLC17A5; ISSD/Salla)
    term:
      id: MONDO:0019366
      label: free sialic acid storage disease
  distinguishing_features:
  - >-
    Both show elevated urine free sialic acid, but the storage disorders are
    autosomal recessive SLC17A5 defects with lysosomal (not cytoplasmic)
    accumulation from defective lysosomal egress; sialuria is dominant GNE
    overproduction with cytoplasmic localization on fibroblast fractionation.
  evidence:
  - reference: PMID:11326336
    reference_title: "Dominant inheritance of sialuria, an inborn error of feedback inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the intracellular distribution of NeuAc primarily in the cytoplasm, as opposed to its intralysosomal accumulation in ISSD cells"
    explanation: >-
      The cytoplasmic-vs-lysosomal localization distinguishes sialuria from ISSD.
- name: GNE myopathy
  disease_term:
    preferred_term: GNE myopathy
    term:
      id: MONDO:0011603
      label: GNE myopathy
  distinguishing_features:
  - >-
    The other GNE disease, but its mechanistic mirror image: recessive
    loss-of-function reducing sialic acid with adult-onset distal myopathy,
    versus sialuria's dominant gain-of-function overproducing sialic acid in
    infancy without myopathy.
  evidence:
  - reference: PMID:26980148
    reference_title: "Mechanism and inhibition of human UDP-GlcNAc 2-epimerase, the key enzyme in sialic acid biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sialuria is an autosomal dominant disorder which is related to GNE mutation in one of the two arginine residues 263 and 266 (R263L, R266Q or R266W)"
    explanation: >-
      Anchors sialuria to the dominant allosteric-site GNE variants, distinct
      from the recessive loss-of-function of GNE myopathy.
progression:
- phase: Course
  notes: >-
    The course is generally mild and non-progressive, with substantial clinical
    improvement over childhood; some retrospectively diagnosed adults considered
    themselves unaffected. This relatively benign, improving course helps
    distinguish sialuria prognostically from the free sialic acid storage
    disorders.
  evidence:
  - reference: PMID:11486897
    reference_title: "Clinical course and biochemistry of sialuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although he has coarse features and massive hepatomegaly, he has shown normal growth and relatively normal development."
    explanation: >-
      Documents the relatively benign course on longitudinal follow-up.

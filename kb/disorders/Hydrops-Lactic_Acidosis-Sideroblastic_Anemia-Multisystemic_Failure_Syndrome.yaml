name: Hydrops-Lactic Acidosis-Sideroblastic Anemia-Multisystemic Failure Syndrome
category: Mendelian
creation_date: "2026-09-22T00:00:00Z"
synonyms:
- HLASA
- hydrops, lactic acidosis, and sideroblastic anemia
- hydrops, lactic acidosis, and sideroblastic anaemia
- LARS2-related hydrops-lactic acidosis-sideroblastic anemia
disease_term:
  preferred_term: hydrops-lactic acidosis-sideroblastic anemia-multisystemic failure syndrome
  term:
    id: MONDO:0014869
    label: hydrops-lactic acidosis-sideroblastic anemia-multisystemic failure syndrome
description: >-
  HLASA is the severe end of the LARS2 allelic spectrum: a perinatal presentation of non-immune
  hydrops, extreme lactic acidosis and sideroblastic anaemia with multi-organ failure, caused by
  biallelic variants in the mitochondrial leucyl-tRNA synthetase. Four patients have been
  published — the index proband in 2015, who died at five days, and three further males from two
  families in 2020, two of whom survived the neonatal crisis.

  LARS2 charges leucine onto mitochondrial tRNA-Leu, so a hypomorphic enzyme starves
  mitochondrial translation of a charged substrate and the thirteen mtDNA-encoded
  respiratory-chain subunits are made less well. The aminoacylation defect is measured rather
  than assumed: recombinant enzyme carrying the index proband's two alleles loses 18-fold and
  9-fold of its catalytic efficiency, and in the 2020 series the HLASA-associated alleles were
  the most severely affected of all LARS2 variants tested. That is the quantitative basis for
  treating this entity as the same disease as Perrault syndrome 4 at a lower residual activity,
  rather than as a separate mechanism.

  The diagnostic trap is that the respiratory chain looks nearly normal. The index proband's
  muscle and liver enzymology was reduced but not to a level anyone would call diagnostic, her
  fibroblasts showed no LARS2 reduction, no respiratory-chain protein reduction and no
  mitochondrial protein-synthesis defect at all, and the authors conclude the variants affect
  only tissues with high energy demand. An entity defined by a mitochondrial translation defect
  can therefore be missed by the two assays a mitochondrial service would run first. What did
  show the lesion was immunoblotting of the affected tissues — LARS2 at about half of control in
  liver, complex I at about a quarter.

  The relationship between the anaemia and the hydrops is the part that is inferred rather than
  shown. Ring sideroblasts were seen on the proband's marrow and dyserythropoiesis in her liver,
  and mitochondrial iron accumulation is the shared mechanism across the congenital sideroblastic
  anaemias, but nobody has measured erythroblast iron handling, heme synthesis or iron-sulfur
  cluster assembly in a LARS2 patient. The chain from fetal anaemia to hydrops is likewise the
  standard reading of non-immune hydrops rather than a finding in this disease, and both are
  carried here as indirect edges with the gap recorded.

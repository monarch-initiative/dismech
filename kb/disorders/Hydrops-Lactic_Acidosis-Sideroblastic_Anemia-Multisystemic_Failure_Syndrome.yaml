inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic and compound heterozygous in every published family. In the index case the mother
    carried one allele and the father the other, which is the segregation that establishes
    recessive inheritance; the parents were non-consanguineous and of Pakistani origin. The 2020
    HLASA cases come from two unrelated families. LARS2 is nuclear and autosomal, so despite the
    mitochondrial biochemistry there is no maternal transmission and the sibling recurrence risk
    is 25 percent.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The mother was heterozygous for the c.1289C>T variant and the father heterozygous for the c.1565C>A variant, consistent with the expectation of recessive inheritance."
    explanation: Biparental transmission of the two alleles, which is what makes this recessive rather than de novo.
pathophysiology:
- name: Biallelic Hypomorphic LARS2 Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The index proband carries c.1289C>T, p.Ala430Val in trans with c.1565C>A, p.Thr522Asn. The
    second allele is the same one reported homozygously in Perrault syndrome, which is the
    single most informative fact about this entity: the severe and the mild phenotype share an
    allele, so severity is a property of the allele combination rather than of the variant.

    The two residues sit in different parts of the enzyme. Thr522 is in the catalytic domain
    where the 3-prime end of the tRNA binds, and Ala430 is in the CP1 connective-peptide domain,
    which in cytosolic synthetases is an editing domain. LARS2's editing domain is present but
    not functional, and the authors tested that directly — no mischarging with isoleucine was
    detectable for wild-type or variant enzyme. So the Ala430Val effect is on aminoacylation
    rather than on proofreading, which is worth recording because the domain's name invites the
    opposite inference.

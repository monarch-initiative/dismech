  icimd_category:
  - classification_value: mitochondrial_aminoacyl_trna_synthetases
    notes: >-
      The lesion is in a mitochondrial aminoacyl-tRNA synthetase rather than in the mitoribosome,
      a respiratory-chain subunit or an assembly factor. That places it beside the AARS2, YARS2
      and HARS2 disorders, which is the comparison the founding paper draws.

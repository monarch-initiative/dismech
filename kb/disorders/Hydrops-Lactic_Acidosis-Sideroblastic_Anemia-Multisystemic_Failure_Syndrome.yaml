- name: Sideroblastic Anaemia
  category: Hematologic
  description: >-
    Ring sideroblasts on Perls iron staining of the marrow, with vacuolated proerythroblasts on
    May-Grunwald-Giemsa, and dyserythropoietic extramedullary haematopoiesis in the liver showing
    irregular crenated nuclei and binucleate forms. The fetus was already anaemic in utero.

    This is the feature that sends the patient to haematology rather than to metabolic medicine,
    and it is why the differential runs through the congenital sideroblastic anaemia panel —
    ALAS2, SLC25A38, GLRX5, YARS2, PUS1, ABCB7 — rather than through a mitochondrial panel.

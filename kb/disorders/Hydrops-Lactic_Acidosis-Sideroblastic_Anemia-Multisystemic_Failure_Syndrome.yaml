prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four patients: the index proband reported in 2015 and three from two unrelated families in
    2020. No population estimate exists. All four were ascertained through diagnostic sequencing
    of a severe neonatal phenotype, so the denominator is unknown by construction and
    rate_per_100000 is left unset rather than computed from four cases.

    One figure worth recording as a negative: the founding group screened LARS2 by Sanger
    sequencing in fourteen further probands with syndromic sideroblastic anaemia and found no
    variants. That is a small but real upper bound on how much of the syndromic sideroblastic
    anaemia population this gene accounts for.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We did not identify LARS2 variants in fourteen other probands with syndromic sideroblastic anemia."
    explanation: >-
      The negative screen, which is the only quantitative statement anyone has made about how
      common this gene is in the phenotype it presents as.
progression:
- phase: Antenatal
  notes: >-
    Hydrops, fetal anaemia, growth restriction and oligohydramnios are present before birth, and
    the cord blood gas already shows metabolic acidosis. The disease is therefore established in
    utero, which bears on what any postnatal intervention could hope to achieve.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her arterial cord pH was 7.27 and base excess was −6.7 mEq/L, indicative of metabolic acidosis."
    explanation: >-
      Metabolic acidosis at the moment of delivery, which places the onset before birth rather
      than in the neonatal course.
- phase: Neonatal crisis, with two outcomes
  notes: >-
    The index proband deteriorated over five days to withdrawal of care. Two of the three 2020
    patients survived the same neonatal multisystem illness. So the entity is not uniformly
    lethal despite being described as infantile-lethal, and the fork happens within the first
    days.

    What separates the two outcomes is not established. With four patients and no published
    allele-by-allele comparison across them, the obvious candidate — residual aminoacylation
    activity of the specific allele pair — is untested for this fork specifically, even though
    it is the established explanation for severity across the wider LARS2 spectrum.
  evidence:
  - reference: PMID:32442335
    reference_title: "The expanding LARS2 phenotypic spectrum: HLASA, Perrault syndrome with leukodystrophy, and mitochondrial myopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Two survived multisystem disease in the neonatal period"
    explanation: >-
      That survival is possible, which is the fact most likely to be lost if this entity is
      summarised as lethal.
genetic:
- name: LARS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: LARS2
    term:
      id: hgnc:17095
      label: LARS2
  notes: >-
    The single causal gene, and one whose phenotypes span an unusually wide range: Perrault
    syndrome 4 at the mild end, deafness with ovarioleukodystrophy, a reversible infantile
    mitochondrial myopathy, and HLASA at the severe end. The unifying variable is residual
    aminoacylation activity.

    A note on the identifier. The deep-research report committed alongside this entry gives
    LARS2 as HGNC:21353, which is KLHL31, an unrelated kelch-family gene. The correct identifier
    is hgnc:17095. The report's own term-validation step could not catch it because the research
    recipe passes --term-skip-prefix HGNC, and the KB-side check compares a CURIE against its own
    label rather than against the gene the entry names — the failure mode recorded in dismech
    issue #10948. It was caught here only because this entry writes the label out and the label
    disagreed.
  evidence:
  - reference: PMID:32442335
    reference_title: "The expanding LARS2 phenotypic spectrum: HLASA, Perrault syndrome with leukodystrophy, and mitochondrial myopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here we describe five patients with a range of phenotypes, in whom we identified biallelic LARS2 variants: three patients with a HLASA-like phenotype, an individual with Perrault syndrome whose affected siblings also had leukodystrophy, and an individual with a reversible mitochondrial myopathy, lactic acidosis, and developmental delay."
    explanation: >-
      The full allelic series in one sentence, and the basis for treating this entity as one end
      of a spectrum rather than as an isolated disease.
diagnosis:
- name: Respiratory chain enzymology in muscle and liver
  presence: ABSENT
  description: >-
    Recorded as a negative because it is the trap. In the index proband, complexes I and IV were
    low in muscle and complex IV low in liver, and the authors judged none of it low enough to
    diagnose a respiratory-chain disorder — the muscle values being what premature infants show
    anyway. Citrate synthase was raised in both tissues, with no premature-infant normative data
    to compare against.

    An entity caused by a mitochondrial translation defect can therefore have a non-diagnostic
    respiratory-chain panel. Immunoblotting of the same tissues is what showed the lesion.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Complex IV activity was also reduced in liver (Table 1), but again, not to a level that would support the diagnosis of a mitochondrial RC disorder."
    explanation: The authors' own judgement that their enzymology was not diagnostic.
- name: Fibroblast studies
  presence: ABSENT
  description: >-
    Also a negative, and a stronger one. The proband's fibroblasts showed normal LARS2 protein,
    normal respiratory-chain complex protein, and no defect in mitochondrial protein synthesis.
    Fibroblasts are the standard cell for functional confirmation of a suspected mitochondrial
    disease, and in this disease they are uninformative.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Immunoblotting of patient fibroblasts showed no change in LARS2 protein level and no effect on mitochondrial RC complex protein levels relative to pediatric control fibroblasts"
    explanation: >-
      The negative fibroblast result, which is what makes the tissue restriction of this disease
      a practical diagnostic problem rather than a curiosity.
- name: Bone marrow aspirate with Perls iron stain
  description: >-
    Ring sideroblasts are the finding that names the entity and, in the index case, the finding
    that steered the exome analysis: the authors prioritised genes previously implicated in
    sideroblastic anaemia alongside MitoCarta mitochondrial genes, and that filter is what
    surfaced LARS2.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Due to the severity of the phenotype and the presence of ringed sideroblasts, we prioritized variants that were: (1) rare, with less than 1% frequency"

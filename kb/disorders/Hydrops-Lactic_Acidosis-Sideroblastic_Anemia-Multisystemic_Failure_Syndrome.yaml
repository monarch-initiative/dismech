- name: Reduced Leucyl-tRNA Aminoacylation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Less charged mitochondrial tRNA-Leu is available to the mitoribosome. The kinetics show the
    loss is in catalytic rate rather than in substrate affinity: k-cat falls roughly fourteen-fold
    for p.Ala430Val and ninefold for p.Thr522Asn while K-m barely moves. An enzyme that binds its
    substrate normally and turns it over slowly is a hypomorph whose output scales with how much
    of it there is, which is the basis for expecting tissue-dependent severity.

    Across the 2020 series the HLASA alleles were the most severely impaired of all LARS2
    variants assayed, which extends the relationship from one family to the spectrum.

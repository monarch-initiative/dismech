- name: Whole exome sequencing
  description: >-
    The diagnostic route in every published case. In the index patient it followed a negative
    targeted screen of YARS2, the gene whose MLASA2 phenotype the presentation most resembled,
    and mitochondrial DNA sequencing and copy-number testing of liver, both normal.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patient DNA was then analyzed by whole exome sequencing, identifying two heterozygous variants in a related gene, LARS2."
    explanation: The diagnostic step that found the gene, and that it came after the targeted screen failed.
experimental_models:
- name: Recombinant LARS2 aminoacylation assay
  experimental_model_type: OTHER
  description: >-
    Purified recombinant human LARS2, wild-type and each patient variant, assayed for leucylation
    of an E. coli tRNA-Leu transcript with carbon-14 leucine, with kinetic parameters from
    Lineweaver-Burk plots. Deacylation and misacylation controls were run in the same system.

    This is the only functional model of the disease that exists, and it is a purified-enzyme
    assay rather than a cell or animal model.
  modeled_mechanisms:
  - target: Reduced Leucyl-tRNA Aminoacylation
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Quantifies the catalytic consequence of each allele: 18-fold and 9-fold losses of
      efficiency, driven by k-cat rather than K-m.
    limitations: >-
      The tRNA substrate is bacterial, not human mitochondrial tRNA-Leu, and the authors note
      that their wild-type kinetic values differ from previously published ones for exactly this
      reason — a different tRNA substrate was used. So the fold-changes are internally comparable
      and the absolute constants are not transferable. The assay also tests each variant enzyme
      alone, where the patient is compound heterozygous and carries both.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is leucylation of an E. coli tRNA-Leu transcript. The quantity that
        matters in the patient is leucylation of human mitochondrial tRNA-Leu, which has two
        isoacceptors and a different structure.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The mitochondrial matrix, the import machinery that delivers LARS2 there, and the
        mitoribosome that consumes the charged tRNA are all outside the assay. The model reports
        catalysis and nothing about supply.
    readouts:
    - name: Catalytic efficiency of leucylation
      target: Reduced Leucyl-tRNA Aminoacylation
      direction: DECREASED
      interpretation: >-
        Both patient alleles retain measurable activity, which is the observation that makes this
        a hypomorphic rather than a null genotype.
      evidence:
      - reference: PMID:26537577
        reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: "LARS2 p.Ala430Val demonstrated an 18-fold loss of catalytic efficiency and LARS2 p.Thr522Asn showed a 9-fold reduction compared to WT LARS2, essentially due to decreased catalytic rates"
        explanation: >-
          The two fold-changes and the kinetic parameter they come from, which is what
          distinguishes a slow enzyme from one that cannot find its substrate.
    evidence:
    - reference: PMID:26537577
      reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Kinetic parameters were determined from Lineweaver–Burk plots in the presence of 3–30 nM WT or variant LARS2 and concentrations of E. coli tRNALeu transcript ranging from 0.3 to 5.6 μM."
      explanation: The assay design, quoted so a reader can see what the model does and does not contain.
  notes: >-
    The editing controls matter for interpreting the Ala430Val allele. Ala430 sits in the CP1
    connective-peptide domain, which in cytosolic synthetases edits mischarged tRNA, so a reader
    might expect an editing defect. The authors tested it: no isoleucine-charged tRNA-Leu was
    detectable with wild-type or variant enzyme, and all three enzymes were inactive in
    deacylation. LARS2's editing domain is present but not functional, so the allele's effect is
    on aminoacylation.
treatments:
- name: Neonatal Intensive Supportive Care
  therapeutic_modality: OTHER
  description: >-
    What was given to the index proband: ventilation from birth, sodium bicarbonate for the
    acidosis, fresh-frozen plasma and cryoprecipitate for the coagulopathy, albumin for the low
    albumin, and multiple anticonvulsants for the seizures. None of it altered the lactate, which
    stayed at 13 mmol/L through bicarbonate infusion.

    Two of the three 2020 patients survived the neonatal period on comparable support, so
    supportive care is not futile in this entity even though it is not disease-modifying. What
    decides the outcome is not known.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Severe Lactic Acidosis
    description: >-
      Bicarbonate buffers the acidosis without touching its cause, and in this patient did not
      lower the lactate. Recorded against the phenotype rather than a mechanism node for exactly
      that reason.
  evidence:
  - reference: PMID:26537577
    reference_title: "LARS2 Variants Associated with Hydrops, Lactic Acidosis, Sideroblastic Anemia, and Multisystem Failure."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The acidosis continued with lactate of 13 mmol/L, despite management with sodium bicarbonate infusions"
    explanation: >-
      Graded REFUTE against the claim that this treatment controls the acidosis. It is the only
      treatment-outcome observation in this literature and it is a negative one; recording it as
      support would invert what the source says.
  notes: >-
    No disease-modifying therapy exists and none has been trialled. The deep-research report
    committed alongside this entry discusses a metabolic rescue combination — glucose, nicotinic
    acid and N-acetylcysteine — from a C. elegans and zebrafish complex I screen. That work is
    not about LARS2, was not done in this disease, and has never been given to a patient with it,
    so it is deliberately not curated here as a treatment. It is recorded in the discussions
    section as what it is: a lead.
discussions:
- discussion_id: hlasa_sideroblast_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a mitochondrial leucyl-tRNA synthetase defect produce ring sideroblasts, and is the
    route the same one that operates in the heme-synthesis and iron-sulfur-cluster sideroblastic
    anaemias?
  rationale: >-
    Sideroblastic anaemia is one of the three features this entity is named for, and it is the
    one with no mechanism measured in it. The accepted account — mitochondrial protein synthesis
    failure impairing heme synthesis and iron-sulfur cluster assembly, stranding iron inside the
    mitochondrion — is imported from the congenital sideroblastic anaemia group as a whole. No
    one has measured erythroblast iron, heme intermediates, ALAS2 function or iron-sulfur cluster
    assembly in a LARS2 patient.

    The gap is not academic. Whether the erythroid phenotype follows from the general translation
    defect or from something specific about leucine supply in erythroblasts decides whether it
    should be expected in the milder LARS2 phenotypes, where nobody looks for it. The 2020 series
    reports HLASA and Perrault syndrome in the same paper without reporting marrow findings for
    the Perrault patients.

    Erythroblasts are accessible. A marrow sample from a surviving patient, or a differentiated
    CD34-positive culture carrying the alleles, would answer it.
  attaches_to:
  - pathophysiology#Erythroblast Mitochondrial Iron Accumulation
  - phenotypes#Sideroblastic Anaemia
- discussion_id: hlasa_severity_determinant
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why did one patient die at five days while two others survived the same neonatal multisystem
    illness?
  rationale: >-
    Across the LARS2 spectrum, severity tracks residual aminoacylation activity, and the 2020
    series shows the HLASA alleles are the most severely impaired of all LARS2 variants tested.
    That explains why HLASA is worse than Perrault syndrome. It does not explain the fork inside
    HLASA.

    Nothing published separates the fatal from the surviving cases. The index proband was born
    at 29 weeks weighing 1010 g, so prematurity is an obvious confounder and might be the whole
    answer; the 2020 abstract does not give gestations. Nor is there an allele-by-allele
    comparison across the four patients — the 2020 aminoacylation data are reported as a group
    statement rather than per patient.

    With four patients this may not be answerable. It is recorded because an entity described in
    the literature as infantile-lethal has a 50 percent survival rate in its published series,
    and anyone using this entry for counselling needs to know that both the survival and its
    unexplained variability are real.
  attaches_to:
  - progression#Neonatal crisis, with two outcomes
  - pathophysiology#Biallelic Hypomorphic LARS2 Variants
- discussion_id: hlasa_metabolic_rescue_lead
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the glucose, nicotinic acid and N-acetylcysteine combination that rescues complex I
    dysfunction in worm and fish models worth testing in a mitochondrial aminoacyl-tRNA
    synthetase disease?
  rationale: >-
    The openscientist report committed with this entry raises a preclinical combination that
    produced synergistic rescue of mitochondrial membrane potential in C. elegans and zebrafish
    complex I models. It is deliberately not curated as a treatment in this entry: that work is
    not about LARS2, was not done in this disease, and has never been given to a patient with it.

    It is recorded as a lead rather than dropped because the logic is not absurd — the endpoint
    in HLASA is a complex I deficiency, which is what those models have. The reasons to be
    cautious are specific rather than general. The models are chemically or genetically induced
    complex I lesions, not translation defects, so the step this disease actually fails is
    upstream of what they model. And the therapeutic window in HLASA is antenatal or the first
    days of life, which is not where a nutritional combination is easy to deploy.

    Anyone acting on this should note that the chain from the cited preclinical work to this
    disease runs through two inferences, and that this entry has made neither of them.
  attaches_to:
  - treatments#Neonatal Intensive Supportive Care
  - pathophysiology#Reduced Respiratory Chain Complex I in Liver and Muscle
notes: >-
  Naming and scope. This entry covers HLASA specifically — the severe, perinatal end of the
  LARS2 allelic series. Perrault syndrome 4, LARS2 deafness with ovarioleukodystrophy and the
  reversible infantile mitochondrial myopathy are separate entities in the same series, and the
  2020 paper reports all of them together. The entity is kept separate because its presentation,
  its differential and its timing share almost nothing with the others, while the gene and the
  mechanism are identical — which is the lump-versus-split case that `has_subtypes` handles badly
  and a grouping handles well. `Perrault Syndrome` is listed as a parent to make the relationship
  navigable.

  Patient count and denominators. Four published patients: the index proband in PMID:26537577
  (2015) and three from two unrelated families in PMID:32442335 (2020). Only the index case is
  described clinically in any detail; the 2020 report is available here as an abstract, which
  reports its three cases as a group. That is why most phenotype denominators in this entry read
  "1 of 1 patient described in detail" rather than a fraction of four. It is a limit of what can
  be quoted, not a claim that the features are rare.

  The gene identifier, and how it was nearly wrong. The openscientist report committed alongside
  this entry gives LARS2 as HGNC:21353. That identifier is KLHL31, an unrelated kelch-family
  gene. The correct one is hgnc:17095. Neither validation lane catches this by itself: the
  research recipe passes `--term-skip-prefix HGNC`, so gene CURIEs are unchecked where they are
  emitted, and `just validate-terms` compares a CURIE against its own canonical label rather than
  against the gene the surrounding text names — the failure mode recorded in dismech issue
  #10948. It surfaced only because this entry writes `label:` out, and the label disagreed with
  the CURIE. A curator who had copied the identifier and left the label blank, or filled it in
  from the ontology, would have committed a binding that validates cleanly and names the wrong
  gene.

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index (snapshot 2026-09-10). There is a GeneReviews
  chapter for Perrault syndrome, which is a different entity in this gene's series and does not
  name this one.

  What the enzymology negative means for anyone reading a report. Two standard confirmatory
  assays are recorded here under `diagnosis` with `presence: ABSENT`: respiratory-chain
  enzymology, which the authors judged non-diagnostic, and fibroblast studies, which were
  entirely normal. Both are recorded as negatives rather than omitted because a service
  laboratory running either one on a future patient will get the same answer, and an entry that
  listed only the assays that worked would be teaching the wrong lesson.

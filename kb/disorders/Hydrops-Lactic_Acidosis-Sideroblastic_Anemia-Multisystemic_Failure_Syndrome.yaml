- name: Impaired Mitochondrial Translation in High-Demand Tissues
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Translation of the thirteen mtDNA-encoded respiratory-chain subunits depends on a supply of
    charged tRNA-Leu, and a hypomorphic synthetase restricts it. The tissue qualifier is not
    decoration: in the index proband's fibroblasts and induced myotubes, LARS2 protein was
    normal, respiratory-chain proteins were normal, and an in vitro mitochondrial protein
    synthesis assay found no defect at all. The authors conclude the variants affect only tissues
    with higher energy demands.

    Graded PROVISIONAL because the translation defect itself was never demonstrated in an
    affected tissue. What was demonstrated in liver and muscle is reduced LARS2 protein and
    reduced complex I protein; the translation step between them is inferred from the enzyme's
    known function. The one assay that could have shown it was run in the tissue where the
    disease is absent.

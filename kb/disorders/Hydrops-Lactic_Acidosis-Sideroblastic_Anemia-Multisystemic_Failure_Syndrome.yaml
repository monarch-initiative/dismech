- name: Multi-Organ Failure
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The proband's course was simultaneous rather than sequential failure: hyaline membrane
    disease, impaired cardiac function, coagulopathy with low albumin requiring plasma,
    cryoprecipitate and albumin, pulmonary hypertension, rising creatinine with haematuria on
    structurally normal kidneys, and clinical and electrical seizures on a diffusely abnormal
    EEG with normal cranial ultrasound.

    Normal structure with abnormal function, repeated across kidney and brain, is the signature
    of an energetic rather than a structural lesion, and it is what makes the multi-organ picture
    one disease rather than a list of complications of prematurity.

    notes: >-
      PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION is the measured position: recombinant
      p.Ala430Val retains about a eighteenth of wild-type catalytic efficiency and p.Thr522Asn
      about a ninth, so neither allele is a null. A complete loss of mitochondrial leucyl-tRNA
      synthetase is presumed incompatible with life, and the residual activity is what the
      genotype-phenotype relationship in this gene is built on.

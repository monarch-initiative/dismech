- name: Erythroblast Mitochondrial Iron Accumulation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Ring sideroblasts are erythroblasts whose perinuclear mitochondria are loaded with iron, and
    the proband had them on Perls staining of her marrow, alongside vacuolated proerythroblasts
    and, in the liver, dyserythropoietic extramedullary haematopoiesis with irregular crenated
    nuclei and binucleate forms.

    The node is graded HYPOTHETICAL because everything above the histology is borrowed. The
    accepted account of ring sideroblast formation — mitochondrial protein synthesis failure
    impairing heme synthesis and iron-sulfur cluster assembly, leaving iron that entered the
    mitochondrion with nowhere to go — comes from the congenital sideroblastic anaemias as a
    group. Nobody has measured any of it in a LARS2 erythroblast. What is observed here is the
    endpoint; the mechanism is the group's.

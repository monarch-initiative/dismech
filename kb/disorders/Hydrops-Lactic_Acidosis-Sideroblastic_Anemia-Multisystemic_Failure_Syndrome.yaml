- name: Bioenergetic Failure in High-Demand Organs
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    A respiratory chain that cannot keep up forces glycolysis, and in this patient the result was
    among the most extreme recorded: arterial pH fell to 6.8 with lactate at 16 mmol/L against a
    reference of 0.7 to 2.0, and lactate stayed at 13 despite bicarbonate infusion, normal blood
    pressure and adequate perfusion.

    That last clause is the one that matters clinically. Lactate at 16 in a sick premature
    neonate is usually read as tissue hypoperfusion; here the haemodynamics were normal, so the
    lactate is metabolic rather than circulatory. The distinction is what should prompt
    mitochondrial investigation rather than escalating inotropes.

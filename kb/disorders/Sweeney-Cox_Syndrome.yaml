      dimer combinations
    explanation: >-
      Identifies the dimer species a Glu117 subunit can be incorporated into,
      which is what makes an antimorphic effect possible.
  - reference: PMID:32179550
    reference_title: TWIST1 Homodimers and Heterodimers Orchestrate Lineage-Specific Differentiation.
    supports: SUPPORT

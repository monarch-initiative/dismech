- category: Craniofacial
  name: Coronal Craniosynostosis
  frequency: OCCASIONAL
  description: >-
    Not a cardinal feature, and its absence is what distinguishes Sweeney-Cox
    from Saethre-Chotzen syndrome. One reported patient with the p.Glu117Asp
    allele nonetheless had bilateral coronal suture synostosis, which is the
    principal evidence that the two TWIST1 phenotypes overlap.
  phenotype_term:
    preferred_term: Coronal craniosynostosis
    term:
      id: HP:0004440
      label: Coronal craniosynostosis
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review showed that Sweeney-Cox syndrome appears to share many
      characteristics with Barber-Say syndrome and ablepharon-macrostomia
      syndrome except for craniosynostosis, which is a cardinal feature of
      Saethre-Chotzen syndrome.
    explanation: >-
      Establishes that craniosynostosis is not typical of Sweeney-Cox, supporting
      the OCCASIONAL frequency and the boundary with Saethre-Chotzen.
  notes: >-
    Frequency basis: this band comes from the source's qualitative characterisation of the feature, which is the mapping the curation guidance sanctions, and not from a patient count. The 46 HPOA-derived phenotypes in this entry carry no band for the complementary reason - their provenance is a count out of two patients and nothing else. Where a count would suggest a different band, the prose governs and the disagreement is stated. Here the source states explicitly that craniosynostosis is not a
    cardinal feature of this syndrome, which is what OCCASIONAL encodes. Note
    that the raw count runs the other way - one of the three reported patients
    had bicoronal synostosis, which as a fraction would fall in the FREQUENT
    band. The qualitative statement is preferred because a denominator of three
    cannot distinguish 33 percent from 5 percent, and because the source is
    making a claim about the syndrome rather than tallying its own series.

genetic:
- name: TWIST1
  gene_term:
    preferred_term: TWIST1
    term:
      id: hgnc:12428
      label: TWIST1
  association: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    Heterozygous de novo missense substitutions restricted to codon Glu117 in the
    basic DNA-binding domain. Three alleles are reported: p.Glu117Val and
    p.Glu117Gly in the two index subjects, and p.Glu117Asp in a third patient.
    Because glutamate and aspartate are the only negatively charged residues and
    even the conservative Glu117Asp substitution produced the syndrome, any
    substitution at this codon is expected to be pathogenic or lethal.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a new clinical entity, Sweeney-Cox syndrome, associated with
      distinct de novo amino acid substitutions (p.Glu117Val and p.Glu117Gly) at
      a highly conserved glutamic acid residue located in the basic DNA binding
      domain of TWIST1, in two subjects with frontonasal dysplasia and additional
      malformations.
    explanation: Identifies TWIST1 Glu117 as the causal locus and lists two alleles.
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that any amino acid substitutions at Glu117 would likely lead
      to the Sweeney-Cox syndrome phenotype or lethality.
    explanation: >-
      Supports the claim that the pathogenic constraint is on the codon itself
      rather than on a particular substituting residue.
  - reference: PMID:42059179
    reference_title: Evidence-based classification of genes implicated in craniosynostosis disorders using the ClinGen curation framework.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three rare but clinically defined and distinguishable gene-disease pairs
      were found to have Limited evidence ranging from 3 to 4 points to support
      the relationship by the Cranio GCEP: FGFR1-related osteoglophonic
      dysplasia (OMIM:166250), TWIST1-related Sweeney-Cox syndrome
      (OMIM:617746)
    explanation: >-
      The ClinGen Craniofacial GCEP classifies the TWIST1-Sweeney-Cox
      gene-disease relationship as Limited. Graded PARTIAL deliberately: the
      classification is a formal statement that the case count is too small to
      reach Moderate, not a doubt about the mechanism, and the entry should not
      present this relationship with Definitive-level confidence.
  notes: >-
    ClinGen's Craniofacial GCEP rates this gene-disease relationship Limited
    (3-4 points), constrained by the number of reported cases rather than by the
    quality of the functional evidence. The mechanistic work is strong; the
    clinical series is three patients.

    Nomenclature discrepancy on the third allele: the Takenouchi report states
    c.351C>G p.Glu117Asp, while ClinVar represents the same protein change as
    c.351G>T (VCV002572412). Against NM_000474.4 the ClinVar form is the
    internally consistent one, since GAG to GAT yields Asp whereas the published
    cDNA change does not. The published string is quoted verbatim in the
    evidence snippet above and deliberately left uncorrected there, because a
    snippet belongs to the cited paper; the reconciliation is recorded here
    instead.

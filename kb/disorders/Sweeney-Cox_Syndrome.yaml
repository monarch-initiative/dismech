name: Sweeney-Cox Syndrome
synonyms:
- SWCOS
- Sweeney-Cox syndrome
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Sweeney-Cox syndrome is a de novo autosomal dominant craniofacial disorder
  caused by missense substitutions at a single highly conserved glutamic acid
  residue, Glu117, in the basic DNA-binding domain of TWIST1. It presents as
  frontonasal dysplasia — marked hypertelorism with severe deficiency of the
  frontal bones and hypoplasia of the nose and facial bones — together with
  ablepharon or underdevelopment of the eyelids and cheek pads beside the
  corners of the mouth.

  The disorder is mechanistically the counterpoint to Saethre-Chotzen syndrome,
  which arises from haploinsufficiency of the same gene. Roughly a hundred
  loss-of-function TWIST1 alleles cause Saethre-Chotzen with craniosynostosis,
  yet none of them touch the Glu117 codon. The Glu117 substitutions act
  antimorphically instead — a conclusion drawn from a Caenorhabditis elegans
  allelic series, not from biochemistry on the human protein. Losing half the
  TWIST1 dose and interfering with the whole pool are different lesions, and
  they produce different diseases: a non-synostotic frontonasal phenotype here,
  premature coronal suture fusion there.

  The frontonasal phenotype is explained by what TWIST1 does in cranial neural
  crest. In mouse, neural-crest-specific loss of Twist1 collapses frontonasal
  development and fails to activate the ectomesenchyme programme — Alx1, Alx3
  and Alx4 — in the frontonasal prominence, and Twist1 occupies a distal
  enhancer that drives Alx1 specifically in periocular and frontonasal
  mesenchyme. The same enhancer explains why the eyelids are involved:
  periocular mesenchyme is the tissue TWIST1 patterns alongside the midface.

  Phenotypically the syndrome sits with the TWIST2 paralogue disorders rather
  than with Saethre-Chotzen. Barber-Say and ablepharon-macrostomia syndromes
  arise from substitutions at Glu75, the residue paralogous to TWIST1 Glu117,
  and share the ablepharon, hypertelorism and cheek-pad facies. Craniosynostosis
  is the feature that separates the group from Saethre-Chotzen — though one
  reported Glu117Asp patient had bilateral coronal synostosis, which is the
  strongest evidence that the two TWIST1 phenotypes are ends of a spectrum
  rather than disjoint entities.

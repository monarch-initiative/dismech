- name: Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    TWIST1 is expressed in migratory cranial neural crest and maintained in the
    crest-derived mesenchyme of the frontonasal prominence, where it switches on
    the ectomesenchyme programme. In mouse, neural-crest-specific inactivation of
    Twist1 disrupts frontonasal development and fails to activate Alx1, Alx3 and
    Alx4 in the frontonasal prominence; Twist1 occupies a conserved element in a
    distal Alx1 enhancer and drives Alx1 reporter expression specifically in
    periocular and frontonasal mesenchyme. Deleting that enhancer alone
    reproduces frontonasal and ocular defects.

    Curated as PROVISIONAL: the enhancer and target-gene work is mouse
    conditional-knockout and reporter biology, so it establishes what TWIST1 does
    in this tissue, not that a human Glu117 allele acts through this particular
    enhancer. The inference from an antimorphic allele to this specific
    regulatory step has not been made in patient tissue.

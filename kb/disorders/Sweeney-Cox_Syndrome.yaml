  - reference: PMID:41850652
    reference_title: A Twist1-regulated distal enhancer crucial for Alx1 gene expression and function during craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice with neural crest lineage-specific inactivation of Twist1 resulted in
      dramatic disruption of frontonasal development accompanied by failure of
      activation of many ectomesenchyme genes, including Alx1, Alx3, and Alx4, in
      the FNP
    explanation: >-
      Establishes that TWIST1 is required to switch on the frontonasal
      ectomesenchyme programme, the transcriptional output lost here.
  - reference: PMID:41850652
    reference_title: A Twist1-regulated distal enhancer crucial for Alx1 gene expression and function during craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      exhibits high enrichment of Twist1 transcription factor occupancy in mouse
      embryonic frontonasal tissues and drove Twist1-dependent reporter transgene
      expression specifically in the developing periocular and frontonasal
      mesenchyme in transgenic mice
    explanation: >-
      Identifies a direct TWIST1-occupied enhancer active in exactly the two
      tissues affected in this syndrome — periocular and frontonasal mesenchyme.
  - reference: PMID:19414008
    reference_title: Requirement for Twist1 in frontonasal and skull vault development in the mouse embryo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of Twist1 in neural crest cells and their derivatives impairs
      skeletogenic differentiation and leads to the loss of bones of the snout,
      upper face and skull vault.
    explanation: >-
      Shows the skeletal consequence of losing TWIST1 function in cranial neural
      crest, matching the frontal-bone and nasal deficiency seen in patients.
  - reference: PMID:38262408
    reference_title: DNA-guided transcription factor cooperativity shapes face and limb mesenchyme.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coordinator guides cooperative and selective binding between the bHLH
      family mesenchymal regulator TWIST1 and a collective of HD factors
      associated with regional identities in the face and limb.
    explanation: >-
      Identifies the composite motif through which TWIST1 acts in face
      mesenchyme, showing that the E-box contact lost by a Glu117 substitution
      is the one this regulatory system depends on.
  - reference: PMID:38262408
    reference_title: DNA-guided transcription factor cooperativity shapes face and limb mesenchyme.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TWIST1 is required for HD binding and open chromatin at Coordinator sites
    explanation: >-
      Shows TWIST1 occupancy is upstream of homeodomain-factor binding and
      chromatin accessibility in this tissue, so losing TWIST1 DNA contact
      disables the wider regulatory programme rather than one target.
  - reference: PMID:35781329
    reference_title: TWIST1 interacts with beta/delta-catenins during neural tube development and regulates fate transition in cranial neural crest cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Twist1 suppresses Irf6 and other epithelial genes in CNCCs during the
      epithelial-to-mesenchymal transition (EMT) process and cell migration.
      Conversely, a loss of Twist1 leads to a sustained expression of epithelial
      and cell adhesion markers in migratory CNCCs.
    explanation: >-
      Adds a second TWIST1-dependent step upstream of the ectomesenchyme
      programme: releasing cranial neural crest from its epithelial state.
      Graded PARTIAL because it is loss-of-function mouse work and no Glu117
      allele has been tested for this function, so whether an antimorphic allele
      impairs the EMT step as well as the later patterning step is unknown.

  - reference: PMID:32179550
    reference_title: TWIST1 Homodimers and Heterodimers Orchestrate Lineage-Specific Differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      proteomic profiling of human TWIST1-expressing cell lines and transcriptome

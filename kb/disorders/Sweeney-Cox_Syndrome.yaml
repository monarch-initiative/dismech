- name: Periocular Mesenchyme and Eyelid Morphogenesis Failure
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Eyelid development requires patterned periocular mesenchyme, and the eyelids
    are the second tissue in which the TWIST1-dependent frontonasal enhancer is
    active. Clinically this presents as ablepharon or underdevelopment of the
    eyelids, a feature Sweeney-Cox shares with the TWIST2 Glu75 disorders and
    which is not part of Saethre-Chotzen syndrome.

    PROVISIONAL because the enhancer evidence establishes TWIST1 activity in
    periocular mesenchyme but no study has traced a Glu117 allele through eyelid
    morphogenesis; the causal chain from transcriptional lesion to ablepharon is
    inferred from tissue overlap.

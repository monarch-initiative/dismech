  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in two subjects with frontonasal dysplasia and additional malformations
    explanation: >-
      The syndrome was delineated on two subjects, establishing it as reportable
      at case-series scale only.
animal_models:
- name: hlh-8 Glu29 allelic series (C. elegans)
  species: Caenorhabditis elegans
  genotype: hlh-8 Glu29 substitutions equivalent to the five human TWIST1/TWIST2 disease alleles
  publication: PMID:28369379
  description: >-
    All five human disease-associated substitutions — the TWIST1 Glu117 and
    TWIST2 Glu75 alleles — were engineered into the equivalent Glu29 residue of
    hlh-8, the single Twist homolog in C. elegans. The resulting allelic series
    graded in severity by gene expression and cellular phenotype, which is the
    evidence base for the dominant-negative model and for ranking the four human
    syndromes against each other.
  modeled_mechanisms:
  - target: Antimorphic Interference with TWIST1 bHLH Complexes
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the antimorphic behaviour of the substitutions in a single-Twist
      genetic background, where dominant-negative action can be separated from
      loss of dosage.
    limitations: >-
      C. elegans has one Twist homolog and no craniofacial skeleton, so the model
      speaks to the molecular character of the allele and to relative severity,
      not to the tissue phenotype. The M-lineage cellular readout has no
      counterpart in cranial neural crest.
    evidence:
    - reference: PMID:28369379
      reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This allelic series revealed that different substitutions exhibit graded
        severity, in terms of both gene expression and cellular phenotype, which
        we incorporate into a model explaining the various human disease
        phenotypes.
      explanation: >-
        Reports the graded-severity result that grounds the antimorphic model for
        this node.
- name: Neural-crest conditional Twist1 knockout mouse
  species: Mouse
  genotype: Twist1 conditional deletion in neural crest cells (Cre-mediated)
  publication: PMID:19414008
  description: >-
    Cre-mediated deletion of Twist1 in neural crest cells and their derivatives,
    used to dissect the requirement for Twist1 in craniofacial skeletal
    morphogenesis.
  evidence:
  - reference: PMID:19414008
    reference_title: Requirement for Twist1 in frontonasal and skull vault development in the mouse embryo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a Cre-mediated conditional deletion approach, we have dissected the
      function of Twist1 in the morphogenesis of the craniofacial skeleton.
    explanation: >-
      Establishes the conditional-knockout design and its craniofacial scope,
      supporting its use as a model for this disorder's mechanism.
  modeled_mechanisms:
  - target: Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the frontonasal and skull vault consequences of losing TWIST1
      function in cranial neural crest, including the failure to activate the
      ectomesenchyme programme in the frontonasal prominence.
    limitations: >-
      This is a conditional null, not a Glu117 knock-in, so it models loss of
      TWIST1 function rather than the antimorphic allele that causes the human
      disease — precisely the distinction that separates Sweeney-Cox from
      Saethre-Chotzen. Homozygous deletion in the crest lineage is also a more
      severe lesion than the human heterozygous state.
    readouts:
    - name: Snout, upper face and skull vault bone formation
      target: Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
      direction: DECREASED
      interpretation: >-
        Skeletal correlate of the lost ectomesenchyme programme in this model.
      evidence:
      - reference: PMID:19414008
        reference_title: Requirement for Twist1 in frontonasal and skull vault development in the mouse embryo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Loss of Twist1 in neural crest cells and their derivatives impairs
          skeletogenic differentiation and leads to the loss of bones of the
          snout, upper face and skull vault.
        explanation: Reports the skeletal measurement behind this readout.
    evidence:
    - reference: PMID:41850652
      reference_title: A Twist1-regulated distal enhancer crucial for Alx1 gene expression and function during craniofacial development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mice with neural crest lineage-specific inactivation of Twist1 resulted in
        dramatic disruption of frontonasal development accompanied by failure of
        activation of many ectomesenchyme genes, including Alx1, Alx3, and Alx4,
        in the FNP
      explanation: >-
        Supports treating the neural-crest conditional knockout as informative
        for the frontonasal ectomesenchyme node.

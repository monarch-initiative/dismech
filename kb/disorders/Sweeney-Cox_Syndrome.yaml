- name: Antimorphic Interference with TWIST1 bHLH Complexes
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    TWIST1 acts as homodimers and as heterodimers with the TCF3, TCF4 and TCF12
    E-proteins, and it is the basic region of each partner that grips the E-box.
    Substituting Glu117 alters a DNA-contacting residue while leaving the
    helix-loop-helix dimerisation surface untouched, so the expected consequence
    is a subunit that still enters complexes but cannot read their targets. The
    genetic evidence supports that reading: engineering the five human alleles
    into the equivalent Glu29 residue of hlh-8, the single Twist homolog in
    Caenorhabditis elegans, produced a graded severity series rather than a
    simple null, and the analysis favours a predominantly dominant-negative
    mechanism.

    Two caveats belong on this node. The dimerisation-retained,
    DNA-binding-lost model is inferred from where the residue sits in the
    domain — no biochemistry on the human Glu117 protein has been reported, so
    it is not known directly whether these subunits still dimerise or still
    occupy chromatin. And "predominantly" is the source's own word: the C.
    elegans series does not exclude a partial loss-of-function component.

    What is established is that this step is where Sweeney-Cox parts from
    Saethre-Chotzen. Reducing TWIST1 to one functional copy leaves the remaining
    protein competent; an antimorphic allele does not.

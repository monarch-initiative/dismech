discussions:
- discussion_id: swcos_glu117_allele_specific_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does a TWIST1 Glu117 knock-in reproduce the human frontonasal and ablepharon
    phenotype, and does it act through the Alx1 distal enhancer?
  attaches_to:
  - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
  rationale: >-
    Every mechanistic model of this disorder is currently an allele mismatch. The
    C. elegans series carries the right substitution but has no craniofacial
    skeleton; the mouse work has the right tissue but uses conditional nulls,
    which model haploinsufficiency-like loss rather than the antimorphic allele.
    The whole clinical point of Sweeney-Cox is that those two lesions give
    different diseases, so no existing model tests the step that actually
    distinguishes it from Saethre-Chotzen. Whether the enhancer route is the one
    a Glu117 allele travels is therefore inference from tissue overlap, not a
    result.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we engineered all five disease-associated alleles into the equivalent
      Glu29 residue encoded by hlh-8, the single Twist homolog present in
      Caenorhabditis elegans
    explanation: >-
      Documents that the only allele-correct model is an invertebrate with no
      craniofacial skeleton, which is the mismatch this discussion records.
  proposed_experiments:
  - experiment_id: swcos_glu117_knockin_mouse
    name: Twist1 Glu117 knock-in mouse with frontonasal enhancer readout
    description: >-
      Generate a mouse carrying the Glu117 substitution at the endogenous locus
      and compare its craniofacial phenotype and Alx1 distal-enhancer activity
      against a Twist1 heterozygous null.
    would_support:
    - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
    supporting_outcome:
    - >-
      The knock-in shows frontonasal and periocular defects with reduced Alx1
      enhancer activity, while the heterozygous null does not, separating the
      antimorphic route from simple dosage loss.
    refuting_outcome:
    - >-
      The knock-in phenocopies the heterozygous null, indicating the Glu117
      allele acts by dosage reduction and that the antimorphic model does not
      explain the distinct human phenotype.
- discussion_id: swcos_saethre_chotzen_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are Sweeney-Cox and Saethre-Chotzen syndromes disjoint entities or ends of
    one TWIST1 phenotypic spectrum?
  attaches_to:
  - phenotypes#Craniosynostosis
  rationale: >-
    Craniosynostosis is the stated discriminator, but the p.Glu117Asp patient had
    bilateral coronal synostosis alongside the ablepharon and cheek-pad facies,
    and that report argued the conservative Glu-to-Asp change exerts only a mild
    antimorphic effect resembling haploinsufficiency. If severity of antimorphic
    interference is continuous, the discriminator is quantitative rather than
    categorical, and the lump/split status of these two entries depends on which
    it is. With three reported patients there is not enough phenotypic range to
    settle it.
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present observation suggests that a localized TWIST1 basic domain
      substitution, that is, p.Glu117Asp, in TWIST1 may exert a mild antimorphic
      effect similar to that of haploinsufficiency, leading to craniosynostosis
      and ablepharon.
    explanation: >-
      States the graded-antimorphism argument that makes the boundary between the
      two syndromes uncertain.
- discussion_id: swcos_no_management_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the management of Sweeney-Cox syndrome, and does the antimorphic
    mechanism change it relative to Saethre-Chotzen syndrome?
  attaches_to:
  - treatments#
  rationale: >-
    The treatments section is deliberately empty. With three reported patients
    there is no management literature specific to this syndrome — no series, no
    surgical protocol, and no ophthalmological guidance for the ablepharon, which
    is the feature most likely to need early intervention for corneal protection.
    Extrapolating craniofacial management from Saethre-Chotzen would be
    mechanistically unsound in the one respect that matters here: Saethre-Chotzen
    care is organised around craniosynostosis, which is not a cardinal feature of
    this disorder. The gap is recorded rather than filled with borrowed content.
- discussion_id: swcos_allelic_ascertainment_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the three reported patients represent the survivable tail of the Glu117
    allelic series, with more severe substitutions going unascertained?
  attaches_to:
  - pathophysiology#TWIST1 Glu117 Basic-Domain Substitution
  - prevalence#Worldwide
  rationale: >-
    The C. elegans series showed graded severity across substitutions at this
    residue, and the clinical literature explicitly raises lethality as an
    alternative outcome of substituting Glu117. If some substitutions are
    embryonic-lethal or lethal in the neonatal period, the reported phenotype is
    conditioned on survival and the three living patients are a biased sample.
    This matters for two curated claims at once: the severity range recorded in
    the phenotypes section, and the case count recorded under prevalence, which
    is also the constraint behind ClinGen's Limited gene-disease classification.
    Prenatal or perinatal-loss sequencing series covering TWIST1 would be the
    way to test it; nothing of the sort has been reported.
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that any amino acid substitutions at Glu117 would likely lead
      to the Sweeney-Cox syndrome phenotype or lethality.
    explanation: >-
      Raises lethality as an outcome of substitution at this codon, which is the
      ascertainment concern recorded here.
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This allelic series revealed that different substitutions exhibit graded
      severity, in terms of both gene expression and cellular phenotype, which we
      incorporate into a model explaining the various human disease phenotypes.
    explanation: >-
      Establishes that severity varies by substituting residue, which is what
      makes a lethal tail plausible.
  notes: >-
    The curated phenotype list is also limited by source availability: the index
    report's detailed malformation list sits in full text that is not in the
    reference cache, so only features quotable from cached abstracts are curated
    here. Additional malformations are described in the literature and this entry
    under-represents them.

diagnosis:
- name: Molecular Confirmation of the TWIST1 Codon-117 Variant
  description: >-
    Diagnosis rests on identifying a heterozygous missense substitution at TWIST1
    codon 117. Reporting the gene alone is not enough here, because TWIST1
    variants cause two different diseases by two different mechanisms: a
    loss-of-function allele anywhere in the gene indicates Saethre-Chotzen
    syndrome, whereas a substitution at Glu117 indicates this disorder. The
    report has to name the variant, not just the gene.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42059179
    reference_title: Evidence-based classification of genes implicated in craniosynostosis disorders using the ClinGen curation framework.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      According to ACMG technical standards, genes classified as Moderate,
      Strong, or Definitive are eligible for inclusion in diagnostic testing
      panels
    explanation: >-
      Carries the practical diagnostic consequence of the Limited classification
      recorded in the genetic section: under ACMG technical standards a Limited
      gene-disease relationship sits below the threshold for panel inclusion, so
      the diagnosis may depend on exome or genome sequencing rather than on a
      craniosynostosis gene panel. Graded PARTIAL because the paper states the
      general standard and the Limited classification separately, and does not
      itself say this disease is absent from panels.
  notes: >-
    The three reported alleles are p.Glu117Val, p.Glu117Gly and p.Glu117Asp, all
    de novo. See the genetic section for the cDNA nomenclature discrepancy
    between the published c.351C>G and ClinVar's c.351G>T for the third.
- name: Abdominal Ultrasound for Asplenia
  description: >-
    Asplenia is an annotated feature of this syndrome and is invisible on the
    craniofacial examination that brings these children to attention, so it has
    to be looked for deliberately. Finding it changes management immediately,
    because it moves the child into lifelong infection prophylaxis.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  notes: >-
    Curated without an evidence item, on the same basis as the HPOA-derived
    phenotypes. The asplenia annotation comes from the HPO disease annotation for
    OMIM:617746; no published source recommends abdominal imaging in Sweeney-Cox
    syndrome specifically, so the indication is inferred from the curated
    phenotype and recorded as such rather than attached to a source that does not
    say it.
- name: Craniofacial CT with Three-Dimensional Reconstruction
  description: >-
    Cross-sectional imaging of the craniofacial skeleton defines the frontal-bone
    deficiency and midfacial hypoplasia that the clinical examination can only
    suggest, and establishes whether the sutures are patent. That last point
    carries the differential weight in this syndrome: craniosynostosis is the
    feature that separates Saethre-Chotzen from Sweeney-Cox, and one reported
    Glu117 patient did have bicoronal synostosis, so its presence or absence
    cannot be assumed from the molecular result.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  notes: >-
    Curated without an evidence item, on the same basis as the abdominal
    ultrasound entry. No source recommends this imaging in Sweeney-Cox syndrome
    specifically; the indication follows from the curated skeletal phenotypes and
    from the craniosynostosis question, and is recorded as inferred rather than
    attached to a source that does not say it.
- name: Ophthalmic Examination
  description: >-
    Assessment of eyelid closure and corneal integrity is the examination that
    decides whether corneal protection is needed and how urgently. It is listed
    separately from the craniofacial assessment because the eyelid phenotype
    carries the preventable-harm risk in this syndrome, and because the finding
    that matters is functional lid closure rather than a structural measurement.
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  notes: >-
    Curated without an evidence item, on the same basis as the other inferred
    diagnostic entries. The indication follows from the curated eyelid phenotypes
    and from the corneal-protection treatment, both of which are cited; no source
    states an ophthalmic examination schedule for this syndrome.
mechanistic_hypotheses:
- hypothesis_group_id: glu117_interference_dosage_continuum
  hypothesis_label: Graded antimorphism places Sweeney-Cox and Saethre-Chotzen on one continuum
  status: EMERGING
  description: >-
    Under this model the substituting residue at Glu117 sets how strongly the
    mutant subunit interferes with the wild-type pool, and the resulting
    phenotype moves along a continuum rather than falling into one of two
    categories. A conservative substitution such as Glu117Asp interferes weakly
    and behaves closer to haploinsufficiency, which is the reading offered for
    the one patient who had both the Sweeney-Cox facies and bicoronal
    craniosynostosis; stronger substitutions produce the non-synostotic
    frontonasal phenotype, and the C. elegans series ordered all five human
    alleles by severity rather than separating them into classes.

    If correct, the distinction between this entry and Saethre-Chotzen syndrome
    is quantitative, and the craniosynostosis discriminator is a threshold
    effect rather than a categorical feature. The competing model is that the
    two disorders are mechanistically disjoint because the alleles differ in
    kind, not degree. Three patients, one per allele, cannot separate these.
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present observation suggests that a localized TWIST1 basic domain
      substitution, that is, p.Glu117Asp, in TWIST1 may exert a mild antimorphic
      effect similar to that of haploinsufficiency, leading to craniosynostosis
      and ablepharon.
    explanation: >-
      Proposes graded antimorphism explicitly, and is the only clinical
      observation bearing on it.
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This allelic series revealed that different substitutions exhibit graded
      severity, in terms of both gene expression and cellular phenotype, which we
      incorporate into a model explaining the various human disease phenotypes.
    explanation: >-
      Provides the experimental grading of the same allele set that the
      continuum model rests on.

treatments:
- name: Corneal Protection for Eyelid Coloboma
  therapeutic_modality: DEVICE
  description: >-
    Ocular surface protection is the management step with the clearest
    preventable-harm argument in this syndrome, because the curated eyelid
    phenotypes leave the cornea exposed. Reported practice in large neonatal
    upper eyelid coloboma escalates from lubrication and a moisture chamber to a
    customised scleral contact lens, which can maintain ocular surface health
    long enough for eyelid tissue to grow before oculoplastic reconstruction.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Upper eyelid coloboma
    term:
      id: HP:0000636
      label: Upper eyelid coloboma
  - preferred_term: Ablepharon
    term:
      id: HP:0011224
      label: Ablepharon
  evidence:
  - reference: PMID:34570047
    reference_title: Scleral Contact Lens as Initial Management in a Neonate With a Large Upper Eyelid Coloboma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After failing lubrication and a moisture chamber, he was fit with a
      customized scleral contact lens that protected the ocular surface. It was
      tolerated well, and ocular surface health was maintained for 13 months to
      permit the growth of eyelid tissue for future oculoplastic surgery.
    explanation: >-
      Documents the escalation of corneal protection in a neonate with large
      upper eyelid coloboma. Graded PARTIAL because it is a single case in
      isolated eyelid coloboma, not in Sweeney-Cox syndrome; it is cited as
      phenotype-directed management for a feature this entry curates, not as
      disease-specific evidence.
  notes: >-
    Phenotype-directed rather than disease-specific. No management literature
    exists for Sweeney-Cox syndrome itself, so this treatment is attached to the
    curated eyelid phenotypes and the cited source is about that phenotype in
    other contexts. Recorded this way instead of borrowed wholesale from
    Saethre-Chotzen care, which is organised around craniosynostosis and does
    not address the eyelid.
- name: Infection Prophylaxis for Asplenia
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Asplenia is an annotated feature of this syndrome and carries lifelong risk
    of fulminant infection with encapsulated organisms. Standard paediatric
    asplenia care is timely vaccination, antibacterial prophylaxis where
    indicated, and urgent evaluation of febrile episodes. This matters
    disproportionately here because asplenia in a child ascertained for a
    craniofacial phenotype can go unrecognised.
  treatment_term:
    preferred_term: Antibiotic Prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  target_phenotypes:
  - preferred_term: Asplenia
    term:
      id: HP:0001746
      label: Asplenia
  evidence:
  - reference: PMID:38691084
    reference_title: Updated Recommendations on the Prevention and Treatment of Infections in Children With Asplenia/Hyposplenism.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current practice focuses on preventing severe infections with timely
      administration of vaccinations, antibacterial prophylaxis when indicated,
      and urgent evaluation and treatment of febrile events.
    explanation: >-
      States the standard of care for children with asplenia. Graded PARTIAL
      because it is a general paediatric asplenia recommendation, not evidence
      about Sweeney-Cox syndrome; it is cited because asplenia is a curated
      phenotype of this entry.
  notes: >-
    Phenotype-directed rather than disease-specific, on the same basis as the
    corneal-protection entry. The asplenia annotation comes from the HPO
    disease annotation for OMIM:617746 and carries no cached quote of its own.
- name: Vaccination Against Encapsulated Organisms
  therapeutic_modality: VACCINE
  description: >-
    In asplenia, vaccination against encapsulated organisms is the cornerstone of
    prevention rather than an adjunct to antibiotics, and the cited recommendation
    names it first. It is curated separately from antibacterial prophylaxis
    because the two are different modalities with different schedules, and
    collapsing them into one treatment would lose that.
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_phenotypes:
  - preferred_term: Asplenia
    term:
      id: HP:0001746
      label: Asplenia
  evidence:
  - reference: PMID:38691084
    reference_title: Updated Recommendations on the Prevention and Treatment of Infections in Children With Asplenia/Hyposplenism.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current practice focuses on preventing severe infections with timely
      administration of vaccinations, antibacterial prophylaxis when indicated,
      and urgent evaluation and treatment of febrile events.
    explanation: >-
      Names timely vaccination first among the preventive measures for children
      with asplenia. Graded PARTIAL because it is a general paediatric asplenia
      recommendation and not evidence about Sweeney-Cox syndrome.
  notes: >-
    Phenotype-directed rather than disease-specific, on the same basis as the
    other two treatments in this entry.

discussions:
- discussion_id: swcos_glu117_allele_specific_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does a TWIST1 Glu117 knock-in reproduce the human frontonasal and ablepharon
    phenotype, and does it act through the Alx1 distal enhancer?
  attaches_to:
  - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
  rationale: >-
    Every mechanistic model of this disorder is currently an allele mismatch. The
    C. elegans series carries the right substitution but has no craniofacial
    skeleton; the mouse work has the right tissue but uses conditional nulls,
    which model haploinsufficiency-like loss rather than the antimorphic allele.
    The whole clinical point of Sweeney-Cox is that those two lesions give
    different diseases, so no existing model tests the step that actually
    distinguishes it from Saethre-Chotzen. Whether the enhancer route is the one
    a Glu117 allele travels is therefore inference from tissue overlap, not a
    result.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we engineered all five disease-associated alleles into the equivalent
      Glu29 residue encoded by hlh-8, the single Twist homolog present in
      Caenorhabditis elegans
    explanation: >-
      Documents that the only allele-correct model is an invertebrate with no
      craniofacial skeleton, which is the mismatch this discussion records.
  proposed_experiments:
  - experiment_id: swcos_glu117_knockin_mouse
    name: Twist1 Glu117 knock-in mouse with frontonasal enhancer readout
    description: >-
      Generate a mouse carrying the Glu117 substitution at the endogenous locus
      and compare its craniofacial phenotype and Alx1 distal-enhancer activity
      against a Twist1 heterozygous null.
    would_support:
    - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
    supporting_outcome:
    - >-
      The knock-in shows frontonasal and periocular defects with reduced Alx1
      enhancer activity, while the heterozygous null does not, separating the
      antimorphic route from simple dosage loss.
    refuting_outcome:
    - >-
      The knock-in phenocopies the heterozygous null, indicating the Glu117
      allele acts by dosage reduction and that the antimorphic model does not
      explain the distinct human phenotype.
- discussion_id: swcos_saethre_chotzen_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are Sweeney-Cox and Saethre-Chotzen syndromes disjoint entities or ends of
    one TWIST1 phenotypic spectrum?
  attaches_to:
  - phenotypes#Coronal Craniosynostosis
  - mechanistic_hypotheses#glu117_interference_dosage_continuum
  rationale: >-
    Craniosynostosis is the stated discriminator, but the p.Glu117Asp patient had
    bilateral coronal synostosis alongside the ablepharon and cheek-pad facies,
    and that report argued the conservative Glu-to-Asp change exerts only a mild
    antimorphic effect resembling haploinsufficiency. If severity of antimorphic
    interference is continuous, the discriminator is quantitative rather than
    categorical, and the lump/split status of these two entries depends on which
    it is. With three reported patients there is not enough phenotypic range to
    settle it.
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present observation suggests that a localized TWIST1 basic domain
      substitution, that is, p.Glu117Asp, in TWIST1 may exert a mild antimorphic
      effect similar to that of haploinsufficiency, leading to craniosynostosis
      and ablepharon.
    explanation: >-
      States the graded-antimorphism argument that makes the boundary between the
      two syndromes uncertain.
- discussion_id: swcos_no_management_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any Sweeney-Cox-specific management evidence, and does the
    antimorphic mechanism change care relative to Saethre-Chotzen syndrome?
  attaches_to:
  - treatments#
  rationale: >-
    Both curated treatments are phenotype-directed, not disease-directed: they
    cite sources about eyelid coloboma and about paediatric asplenia in general,
    because with three reported patients there is no series, no surgical
    protocol and no ophthalmological guidance for this syndrome. Nothing here
    tells a clinician whether the timing or escalation of corneal protection
    should differ in a child whose eyelid defect is part of a TWIST1
    developmental lesion. Borrowing the rest of craniofacial management from
    Saethre-Chotzen would be unsound in the respect that matters: that care is
    organised around craniosynostosis, which is not a cardinal feature here.
- discussion_id: swcos_allelic_ascertainment_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the three reported patients represent the survivable tail of the Glu117
    allelic series, with more severe substitutions going unascertained?
  attaches_to:
  - pathophysiology#TWIST1 Glu117 Basic-Domain Substitution
  - prevalence#Worldwide
  rationale: >-
    The C. elegans series showed graded severity across substitutions at this
    residue, and the clinical literature explicitly raises lethality as an
    alternative outcome of substituting Glu117. If some substitutions are
    embryonic-lethal or lethal in the neonatal period, the reported phenotype is
    conditioned on survival and the three living patients are a biased sample.
    This matters for two curated claims at once: the severity range recorded in
    the phenotypes section, and the case count recorded under prevalence, which
    is also the constraint behind ClinGen's Limited gene-disease classification.
    Prenatal or perinatal-loss sequencing series covering TWIST1 would be the
    way to test it; nothing of the sort has been reported.
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that any amino acid substitutions at Glu117 would likely lead
      to the Sweeney-Cox syndrome phenotype or lethality.
    explanation: >-
      Raises lethality as an outcome of substitution at this codon, which is the
      ascertainment concern recorded here.
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This allelic series revealed that different substitutions exhibit graded
      severity, in terms of both gene expression and cellular phenotype, which we
      incorporate into a model explaining the various human disease phenotypes.
    explanation: >-
      Establishes that severity varies by substituting residue, which is what
      makes a lethal tail plausible.
  notes: >-
    Ascertainment cuts differently from evidence availability, and the two should
    not be confused. The malformation list itself is curated: 46 features come
    from the HPO disease annotation for OMIM:617746, which records each as a
    count out of the two index subjects. What that annotation cannot say is
    whether those two subjects, plus the later Glu117Asp patient, span the
    phenotype of Glu117 substitution or only its survivable part. A feature
    absent from a two-patient annotation may be genuinely rare, or may belong to
    a substitution that was never ascertained.

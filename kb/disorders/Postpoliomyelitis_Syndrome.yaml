  evidence:
  - reference: PMID:37092507
    reference_title: "Post-Polio Syndrome Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "PPS afflicts between 25% and 40% of \npoliomyelitis survivors"
    explanation: >-
      States the proportion of prior paralytic-polio survivors who develop post-polio
      syndrome.
diagnosis:
- name: Clinical Diagnostic Criteria and Exclusion of Alternative Causes
  diagnosis_term:
    preferred_term: neurologic examination
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  description: >-
    Clinical diagnosis requires a documented history of acute paralytic poliomyelitis, partial
    or complete neurological recovery followed by a stable interval (typically >=15 years),
    persistent new muscle weakness or abnormal muscle fatigability, and thorough exclusion of
    alternative neurological, medical, or orthopedic causes.
  evidence:
  - reference: PMID:15599928
    reference_title: "Post-poliomyelitis syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The primary criteria necessary for the diagnosis of PPS are a history of
      paralytic poliomyelitis, partial or complete recovery of neurological
      function followed by a period of stability (usually several decades),
      persistent new muscle weakness or abnormal muscle fatigability, and the
      exclusion of other causes of new symptoms.
    explanation: >-
      Establishes the core clinical diagnostic criteria for PPS.
- name: Electromyography and Neurophysiological Evaluation
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Concentric needle electromyography and single-fiber electromyography (SFEMG) confirm
    chronic reinnervation with giant motor unit potentials alongside active motor unit
    instability (increased jitter, blocking, increased fiber density, and spontaneous
    activity), while nerve conduction and imaging studies help exclude radiculopathy,
    entrapment neuropathies, or amyotrophic lateral sclerosis.
  evidence:
  - reference: PMID:20494327
    reference_title: "Management of postpolio syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis is based on the presence of a lower motor neuron disorder that is
      supported by neurophysiological findings, with exclusion of other disorders as
      causes of the new symptoms.
    explanation: >-
      Supports neurophysiological testing to confirm lower motor neuron involvement and
      exclude mimicking conditions.
  - reference: PMID:2286169
    reference_title: "Disintegration of the motor unit in post-polio syndrome. Part II. Electrophysiological findings in patients with post-polio syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The quantitative concentric needle EMG and a single fiber EMG techniques
      were employed. Spontaneous activity, the parameters of individual motor
      units potentials (MUP), number of complex potentials and their stability,
      jitter and blocking as well as fiber density (FD) have been evaluated.
    explanation: >-
      Demonstrates quantitative concentric needle EMG and single-fiber EMG assessment of
      motor unit disintegration in PPS.
treatments:
- name: Individualized Rehabilitation and Energy Conservation
  description: >-
    Multidisciplinary rehabilitation incorporating pacing, energy conservation strategies,
    orthotic evaluation, and individually tailored non-fatiguing physical activity is the
    cornerstone of PPS management, avoiding both disuse and deleterious overuse of overloaded
    motor units.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Chronic Motor Neuron and Terminal Axon Metabolic Overload
    treatment_effect: MODULATES
    description: >-
      Energy conservation, pacing, and avoidance of muscular overuse reduce excessive
      metabolic demand on enlarged post-polio motor units while preventing disuse
      deconditioning.
    evidence:
    - reference: PMID:20494327
      reference_title: "Management of postpolio syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Patients with postpolio syndrome should be advised to avoid \nboth inactivity and overuse of weak muscles."
      explanation: >-
        Supports pacing and avoidance of overuse to mitigate chronic stress on weak,
        overextended motor units.
  evidence:
  - reference: PMID:20494327
    reference_title: "Management of postpolio syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rehabilitation in patients with postpolio syndrome should \ntake a multiprofessional and multidisciplinary approach, with an emphasis on \nphysiotherapy, including enhanced or individually modified physical activity, \nand muscle training."
    explanation: Lancet Neurology review endorses multidisciplinary rehabilitation with individualized physical activity and muscle training.
  - reference: PMID:20494327
    reference_title: "Management of postpolio syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with postpolio syndrome should be advised to avoid \nboth inactivity and overuse of weak muscles."
    explanation: Guidance to avoid both inactivity and overuse of weak muscles is a core management principle.
- name: Physical Therapy
  description: >-
    Supervised physiotherapy, including submaximal muscle strengthening within symptom
    tolerance and management of pain and fatigue, supports functional mobility in PPS.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the mainstay of therapy centers on symptomatic relief and individualized \nrehabilitation strategies such as energy conservation and muscle strengthening \nexercise regimes."
    explanation: Frontiers review states the therapeutic mainstay is symptomatic relief and individualized rehabilitation including muscle strengthening exercise.
- name: Non-Invasive Mechanical Ventilation and Respiratory Support
  description: >-
    Nocturnal or daytime non-invasive ventilation (NIV) and lung volume recruitment assist
    ventilation and airway clearance in PPS patients who develop respiratory insufficiency or
    sleep-related hypoventilation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: non-invasive mechanical ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory Insufficiency
    treatment_effect: BYPASSES
    description: >-
      Non-invasive positive-pressure ventilation and lung volume recruitment mechanically
      assist alveolar ventilation to compensate for weakened respiratory musculature.
    evidence:
    - reference: PMID:31379723
      reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "PPS patients who suffer from respiratory compromise and sleep related breathing disorders benefit from lung volume recruitment (LVR) (164) and non-invasive ventilation (NIV)"
      explanation: Supports mechanical ventilatory assistance to address respiratory insufficiency in PPS.
  evidence:
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "PPS patients who suffer from respiratory compromise and sleep related breathing disorders benefit from lung volume recruitment (LVR) (164) and non-invasive ventilation (NIV)"
    explanation: Supports non-invasive mechanical ventilation and lung volume recruitment for respiratory compromise in PPS.
- name: Intravenous Immunoglobulin
  description: >-
    Intravenous immunoglobulin (IVIg) has been evaluated in uncontrolled studies and two
    randomized controlled trials in PPS, showing reductions in serum and CSF pro-inflammatory
    cytokines and modest improvements in pain control and vitality, while effects on muscle
    strength and physical function remain inconsistent.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Low-grade Neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      IVIg therapy reduces elevated serum and cerebrospinal fluid TNF-alpha and IFN-gamma
      levels associated with low-grade neuroinflammation in PPS.
    evidence:
    - reference: PMID:31379723
      reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Furthermore, TNF-α and IFN-γ levels respond to IVIg therapy in PPS, and remain unchanged in controls (37, 38, 40)."
      explanation: Demonstrates immunomodulatory reduction of TNF-alpha and IFN-gamma levels during IVIg treatment in PPS.
  evidence:
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Improved pain control and overall vitality (192, 196) seem to be the main benefit of intravenous immunoglobulin (IVIg) treatment."
    explanation: Summarizes pain and vitality benefits observed in clinical studies of IVIg in PPS.
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Two small uncontrolled trials (38, 194) and two larger RCTs (40, 65) arrived to similar
      conclusions with regards to pain control and improvement in serum and CSF inflammatory
      markers.
    explanation: Summarizes randomized and uncontrolled clinical trial findings for IVIg on pain and inflammatory markers in PPS.
- name: Fatigue Pharmacotherapy (Negative Clinical Trials)
  description: >-
    Randomized controlled trials of high-dose prednisone, amantadine, and modafinil showed no
    superiority over placebo for PPS-related fatigue, and trials of pyridostigmine yielded
    conflicting results without consistent benefit on muscle strength or fatigue.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "High-dose prednisone (183), amantadine (184), and modafinil (187, 188) showed no superiority to placebo in the management of fatigue."
    explanation: Randomized controlled trials refute efficacy of high-dose prednisone, amantadine, and modafinil over placebo for PPS fatigue.
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The evidence for the benefit of pyridostigmine therapy remains conflicting. Some studies (185) identified no benefit on muscle function while others reported a slight improvement in walking performance (186)."
    explanation: Clinical trials have not established consistent functional or anti-fatigue efficacy for pyridostigmine in PPS.
- name: Perioperative Anesthetic Precautions
  description: >-
    Patients with PPS have heightened sensitivity to neuromuscular blocking agents and
    anesthetics, with risks of prolonged postoperative weakness, somnolence, and respiratory
    arrest requiring tailored anesthetic selection and postoperative respiratory monitoring.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: anesthesia management
    term:
      id: NCIT:C15181
      label: Anesthesia Procedure
  evidence:
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adverse reactions to certain anesthetic agents are well-documented in PPS.
      Post-anesthesia fatigue, somnolence, and weakness are well-recognized, and fatal
      outcomes due to respiratory arrest have also been reported (200, 201).
    explanation: Documents heightened risk of postoperative weakness, somnolence, and respiratory arrest following anesthesia in PPS.
  - reference: PMID:31379723
    reference_title: "Post-polio Syndrome: More Than Just a Lower Motor Neuron Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of PPS needs to be carefully discussed with the anaesthesiologists, so the
      appropriate muscle relaxants and anesthetics can be used, and patients should be advised
      of the possibility of a prolonged post-operative phase (202).
    explanation: Supports perioperative anesthetic planning and neuromuscular relaxant precautions in PPS.
differential_diagnoses:
- name: Amyotrophic Lateral Sclerosis
  description: >-
    PPS mimics motor neuron disease and must be distinguished from ALS, which features
    combined upper and lower motor neuron degeneration and a far more rapid, fatal course.
  disease_term:
    preferred_term: amyotrophic lateral sclerosis
    term:
      id: MONDO:0004976
      label: amyotrophic lateral sclerosis
  evidence:
  - reference: PMID:37092507
    reference_title: "Post-Polio Syndrome Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "mimics motor neuron diseases (MNDs), such as \namyotrophic lateral sclerosis (ALS), due to its selective impairment, \ndegeneration, or death of motor neurons in the brainstem and spinal cord."
    explanation: PPS clinically mimics ALS and other motor neuron diseases, making ALS a key differential.
- name: Compressive and Orthopedic Causes of New Weakness
  description: >-
    New weakness in a polio survivor may stem from radiculopathy, entrapment neuropathy,
    spinal stenosis, or degenerative joint disease; diagnosis of PPS requires exclusion of
    such alternative neuromuscular, medical, and orthopedic causes.
  evidence:
  - reference: PMID:15599928
    reference_title: "Post-poliomyelitis syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "persistent new muscle weakness or abnormal muscle \nfatigability, and the exclusion of other causes of new symptoms."
    explanation: Diagnosis of PPS requires exclusion of other causes of new symptoms, including orthopedic and compressive conditions.
notes: >-
  Orphanet's annotation set for ORPHA:2942 also lists broad Pain (HP:0012531,
  Very frequent) and Muscle weakness (HP:0001324, Very frequent), which are
  represented more specifically in this entry by Myalgia (HP:0003326),
  Arthralgia (HP:0002829), and Progressive Muscle Weakness (HP:0003323).

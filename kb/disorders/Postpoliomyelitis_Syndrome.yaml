  - target: Skeletal Muscle Atrophy
    description: Chronic muscle fiber denervation outpacing reinnervation causes progressive neurogenic muscle wasting.
  - target: Fasciculations
    description: Instability and spontaneous discharge of degenerating distal motor units produce visible muscle fasciculations.
  - target: Myalgia
    description: Overuse of denervated and biomechanically strained muscle groups produces cramping and myalgia.
  - target: Difficulty climbing stairs
    description: Progressive lower-extremity motor unit loss and muscle weakness impair stair climbing and ambulation.
  - target: Cold Intolerance
    description: Chronic denervation and muscle wasting in affected limbs are accompanied by peripheral cold intolerance.
  - target: Dysphagia
    description: Late distal motor unit decompensation in bulbar cranial motor nuclei impairs pharyngeal and esophageal swallowing musculature.
  - target: Dysarthria
    description: Bulbar lower motor neuron denervation weakens speech articulatory muscles, causing dysarthria.
  - target: Respiratory Insufficiency
    description: Progressive denervation of diaphragmatic, intercostal, and accessory respiratory motor units impairs alveolar ventilation.
  - target: Excessive daytime somnolence
    description: Sleep-disordered breathing and nocturnal neuromuscular symptoms in post-polio motor unit decompensation contribute to excessive daytime somnolence.

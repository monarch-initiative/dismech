- name: Distal Axonal Sprout Degeneration and Progressive Denervation
  biological_scale: TISSUE
  description: >-
    Progressive degeneration of the distal terminal sprouts of enlarged post-polio motor
    units produces ongoing muscle fiber denervation. Because overburdened surviving motor
    neurons can no longer fully compensate, denervation outpaces reinnervation, causing net
    loss of functioning motor units across spinal and bulbar myotomes. Electrophysiologically
    this manifests as increased jitter, blocking, increased fiber density, and spontaneous
    activity in newly weakened muscles.
  role: intermediate
  cell_types:

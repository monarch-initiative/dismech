name: Postpoliomyelitis Syndrome
creation_date: "2026-06-26T00:00:00Z"
category: Complex
synonyms:
- post-polio syndrome
- postpolio syndrome
- postpoliomyelitic syndrome
- post-polio muscular atrophy
- postpolio sequelae
- polio late effects
description: >-
  Postpoliomyelitis syndrome (PPS, post-polio syndrome) is a slowly progressive
  lower motor neuron disorder characterized by new, persistent muscle weakness,
  abnormal muscle fatigability, generalized fatigue, muscle atrophy, fasciculations,
  myalgia, arthralgia, cold intolerance, and bulbar or respiratory dysfunction
  that develop decades (typically 15 to 40 years) after recovery from acute
  paralytic poliomyelitis, following a prolonged interval of stable
  neuromuscular function. During recovery from acute poliovirus infection,
  surviving anterior-horn lower motor neurons reinnervated orphaned muscle
  fibers through terminal and collateral axonal sprouting, creating markedly
  enlarged motor units. Over decades, chronic metabolic overload of these
  overextended motor units leads to distal degeneration of terminal sprouts and
  progressive denervation that outpaces compensatory reinnervation, compounded
  by aging-related motor neuron attrition, overuse, disuse, and possible
  low-grade neuroinflammation rather than poliovirus reactivation. Diagnosis
  is clinical, supported by electromyography and exclusion of alternative
  neuromuscular or orthopedic causes.

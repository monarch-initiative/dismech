      explanation: >-
        Elevated pro-inflammatory cytokines accompany ongoing denervation and may feed back
        on motor unit failure.
  - target: Lower motor neuron disorder
    description: Loss of terminal motor axon sprouts and overburdened anterior horn cells produces clinical and electrophysiological lower motor neuron dysfunction.
  - target: Progressive Muscle Weakness

- name: Low-grade Neuroinflammation
  biological_scale: TISSUE
  description: >-
    Post-mortem spinal cord perivascular and parenchymal inflammation, together with
    increased serum and CSF levels of pro-inflammatory cytokines (TNF-alpha, IFN-gamma) and
    mild myopathic inflammatory changes, point to a low-grade inflammatory component that may
    exacerbate motor unit dysfunction, fatigue, and pain without representing poliovirus
    reactivation.

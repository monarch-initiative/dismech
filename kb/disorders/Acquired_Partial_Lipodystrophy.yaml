      The current US prescribing information establishes the jurisdictional
      limitation for partial lipodystrophy.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metreleptin may be considered for hypoleptinemic ... patients with partial
      lipodystrophy and severe metabolic derangements.
    explanation: >-
      The guideline limits consideration to a metabolically severe selected
      partial-lipodystrophy subgroup.
  - reference: PMID:27642538
    reference_title: "Efficacy and Safety of Metreleptin in Patients with Partial Lipodystrophy: Lessons from an Expanded Access Program."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Study FHA101 (ClinicalTrials.gov identifier: NCT00677313) was an
      open-label, expanded-access, long-term clinical effectiveness and safety
      study in 23 patients with partial lipodystrophy and diabetes and/or
      hypertriglyceridemia with no prespecified leptin level.
    explanation: >-
      The expanded-access cohort directly studied metreleptin in partial
      lipodystrophy with metabolic complications, but was not specific to
      classic APL/BSS.
  - reference: PMID:26139569
    reference_title: Acquired partial lipodystrophy is associated with increased risk for developing metabolic abnormalities.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, contrary to what we observed in patients with congenital
      generalized lipodystrophy (CGL), we did not detect consistently very low
      leptin levels in APL patients.
    explanation: >-
      APL leptin levels are heterogeneous, supporting individualized selection
      rather than routine metreleptin use.

notes: >-
  This entry models classic non-HIV Barraquer-Simons syndrome rather than every
  acquired regional lipoatrophy. Complement dysregulation is strongly
  associated with disease, but current evidence does not establish a complete
  causal explanation for depot-selective fat loss. No monogenic cause or
  therapy proven to arrest the lipoatrophy has been established.

- name: Complement-Mediated Glomerular Disease Risk
  description: >-
    APL/BSS is associated with glomerular disease, classically C3
    glomerulopathy (dense-deposit disease or C3GN) with an MPGN pattern.
    Contemporary biopsy series also include other glomerulonephritides, so an
    MPGN label should not automatically be equated with C3G. Renal involvement
    may produce proteinuria, hematuria, hypertension, or kidney failure.
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    modifier: INCREASED
    term:
      id: GO:0006957
      label: complement activation, alternative pathway

discussions:
- discussion_id: gap_apl_hla_lmnb2_susceptibility
  prompt: >-
    Are HLA-DRB1*11:03 enrichment and rare LMNB2 variation reproducible
    susceptibility signals, and does either connect mechanistically to
    complement dysregulation or adipose injury?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Alternative Complement Pathway Dysregulation
  - phenotype#Progressive Upper-Body Lipoatrophy
  rationale: >-
    Small cohorts report HLA enrichment and a single LMNB2 variant, but neither
    establishes a causal gene-disease relationship. The largest cohort found no
    family history, supporting an acquired, non-Mendelian model. These signals
    remain hypotheses rather than structured causal genes.
  evidence:
  - reference: PMID:38061004
    reference_title: "Clinical Characteristics of Patients With Acquired Partial Lipodystrophy: A Multicenter Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HLA-DRB1 11:03 had higher allelic frequencies compared with the general
      population. A single variant in the LMNB2 gene was found in 1 patient.
    explanation: >-
      The multicenter cohort documents association signals without proving
      causality.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12712982/
    reference_title: Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer–Simons Syndrome) - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, none of our patients had a family history of APL, so our
      data strongly speak against monogenic inheritance among patients with
      APL.
    explanation: >-
      The largest cohort argues against a monogenic inheritance model.
- discussion_id: gap_apl_complement_depot_selectivity
  prompt: >-
    Why does alternative-complement dysregulation cause cranio-caudal,
    depot-selective adipose loss in only a small subset of C3NeF-positive
    people?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#C3 Nephritic Factor-Mediated Convertase Stabilization
  - pathophysiology#Adipose Complement-Directed Injury
  rationale: >-
    NeF sera can lyse rat adipocytes and complement is present in one affected
    human biopsy, but C3NeF is also common in immune glomerulonephritis without
    lipodystrophy. No current evidence explains anatomical selectivity or why
    most complement-dysregulated patients retain adipose tissue.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12712982/
    reference_title: Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer–Simons Syndrome) - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, C3NeF is commonly positive in immune-related
      glomerulonephritis but these patients rarely develop lipodystrophy
    explanation: >-
      This observation defines the unresolved specificity and penetrance gap.

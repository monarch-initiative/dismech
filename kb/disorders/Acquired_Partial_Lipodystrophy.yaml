diagnosis:
- name: Clinical fat-distribution assessment
  description: >-
    Diagnosis begins with recognition of the characteristic acquired and
    progressive upper-body fat-loss pattern with lower-extremity sparing.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Progressive loss of face, neck, upper-limb, thoracic, and abdominal
    subcutaneous fat with lower-extremity sparing or relative accumulation,
    absent familial pattern, and an acquired course support classic APL/BSS.
  evidence:
  - reference: PMID:14747765
    reference_title: "Clinical features and metabolic and autoimmune derangements in acquired partial lipodystrophy: report of 35 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the essential diagnostic criterion for APL is the gradual onset of
      bilaterally symmetrical loss of subcutaneous fat from the face, neck,
      upper extremities, thorax, and abdomen, in the "cephalocaudal" sequence,
      sparing the lower extremities.
    explanation: >-
      The 35-patient series and pooled review define the classic diagnostic
      fat-distribution pattern.
- name: DXA body-composition assessment
  description: >-
    Skinfold measurements and regional body-composition assessment can make the
    upper-versus-lower-body fat contrast objective when physical examination is
    equivocal.
  diagnosis_term:
    preferred_term: Dual-energy X-ray absorptiometry procedure
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  results: >-
    Reduced upper-limb relative to lower-limb fat mass supports APL/BSS; DXA is
    supportive and does not replace clinical assessment.
  evidence:
  - reference: PMID:38061004
    reference_title: "Clinical Characteristics of Patients With Acquired Partial Lipodystrophy: A Multicenter Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among various anthropometric measures, the ratio between the proportion
      of fat mass in upper limbs and lower limbs showed the best predictive
      value for diagnosis.
    explanation: >-
      The multicenter cohort supports regional upper-to-lower limb fat-mass
      ratio as a diagnostic aid.
  - reference: PMID:38061004
    reference_title: "Clinical Characteristics of Patients With Acquired Partial Lipodystrophy: A Multicenter Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skinfold thickness measurements and fat assessment by dual energy X-ray
      absorptiometry are useful tools to identify the disease.
    explanation: >-
      The study conclusion supports skinfold and DXA assessment.
- name: Complement biomarker analysis
  description: >-
    Serum C3 and C4, C3NeF, and selected complement autoantibodies can support
    diagnosis and renal risk assessment. Normal results do not exclude APL,
    and factor D/adipsin remains a research-stage candidate rather than a
    standard diagnostic test.
  diagnosis_term:
    preferred_term: biomarker analysis
    term:
      id: NCIT:C63333
      label: Biomarker Analysis
  results: >-
    Low C3 and C3NeF positivity are supportive, not obligatory or specific.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum complement levels and autoantibodies may support diagnosis of
      acquired lipodystrophy syndromes.
    explanation: >-
      The multisociety guideline defines these tests as supportive.
  - reference: PMID:38061004
    reference_title: "Clinical Characteristics of Patients With Acquired Partial Lipodystrophy: A Multicenter Retrospective Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C3 hypocomplementemia and the presence of autoantibodies may be used as
      additional diagnostic supportive criteria but the prevalence of C3
      hypocomplementemia may be lower than previously reported.
    explanation: >-
      The multicenter cohort reinforces supportive, rather than required,
      interpretation.
- name: Renal surveillance for complement-mediated glomerular disease
  description: >-
    Surveillance for renal involvement is important because C3 glomerulopathy
    and membranoproliferative glomerulonephritis are mechanistically linked to
    complement dysregulation and may present with proteinuria or kidney
    dysfunction.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Proteinuria, hematuria, hypertension, kidney failure, or persistent low C3
    should prompt nephrology evaluation and diagnosis-specific management;
    renal biopsy may distinguish C3G from other glomerulonephritides.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine protein should be measured annually using 24-hour urine collection
      or spot urine protein-to-creatinine ratio.
    explanation: >-
      The multisociety guideline supports annual proteinuria surveillance.
  - reference: PMID:38076230
    reference_title: "C3 glomerulopathies: dense deposit disease and C3 glomerulonephritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presenting features of these diseases are variable and may include
      proteinuria, hematuria, hypertension, or kidney failure.
    explanation: >-
      C3 glomerulopathy review evidence supports renal surveillance endpoints.
  - reference: PMID:38076230
    reference_title: "C3 glomerulopathies: dense deposit disease and C3 glomerulonephritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A common finding in these diseases is low serum C3 levels with normal
      serum C4 levels.
    explanation: >-
      The review supports complement testing as part of renal evaluation.
- name: Metabolic complication surveillance
  description: >-
    Screen longitudinally for dysglycemia, dyslipidemia, fatty liver, and blood
    pressure abnormalities. Contemporary APL cohorts show meaningful metabolic
    risk despite older descriptions of infrequent complications.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Abnormal fasting glucose/HbA1c, triglycerides, liver enzymes, or hepatic
    imaging can identify metabolic complications requiring treatment.
  evidence:
  - reference: PMID:27710244
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with most lipodystrophy syndromes should be screened for
      diabetes, dyslipidemia, and liver, kidney, and heart disease annually.
    explanation: >-
      The multisociety guideline supports annual multisystem surveillance.
  - reference: PMID:40435301
    reference_title: "Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer-Simons Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data reveal high risk of metabolic comorbidities and drusen in
      patients with APL, with earlier onset of these complications in those
      with C3 hypocomplementemia.
    explanation: >-
      APL-specific cohort data support ongoing metabolic surveillance.
- name: Retinal screening and ophthalmologic surveillance
  description: >-
    APL-associated drusen can arise before the usual age for age-related
    macular degeneration and may progress to retinal atrophy or choroidal
    neovascularization. The largest cohort recommends baseline screening in the
    20s to 30s and annual follow-up thereafter.
  diagnosis_term:
    preferred_term: ophthalmologist evaluation
    term:
      id: NCIT:C38060
      label: Eye Examination
  results: >-
    Fundus examination may detect early macular drusen even in asymptomatic
    patients; abnormal findings warrant ophthalmology-directed monitoring.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12712982/
    reference_title: Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer–Simons Syndrome) - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, patients with APL should undergo a screening retinal
      examination starting in their 20s to 30s and then annually thereafter.
    explanation: >-
      The largest cohort provides explicit retinal-screening guidance.
- name: Emotional-wellbeing surveillance
  description: >-
    Visible fat redistribution can cause social isolation, anxiety, depression,
    or disordered eating. Emotional wellbeing should be assessed at routine
    visits and prompt appropriate mental-health support.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Identified distress or psychiatric symptoms should prompt timely behavioral
    health evaluation and support.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12712982/
    reference_title: Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer–Simons Syndrome) - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lastly, the body disfigurement among patients with APL led to social
      isolation, anxiety, and depression, thus emotional well-being should be
      evaluated at every appointment.
    explanation: >-
      The cohort conclusion supports routine emotional-wellbeing surveillance.
differential_diagnoses:
- name: Familial partial lipodystrophy
  description: >-
    FPLD is usually inherited and preferentially affects the limbs, buttocks,
    and hips around puberty, unlike the acquired cranio-caudal pattern from
    face and neck toward the trunk and complement abnormalities of classic APL.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FPLD is a group of usually autosomal dominant disorders characterized by
      loss of fat affecting the limbs, buttocks, and hips
    explanation: >-
      The guideline contrasts the inherited lower-body-predominant FPLD pattern
      with APL.
- name: Acquired generalized lipodystrophy
  description: >-
    AGL produces progressive near-generalized fat loss, including the palms and
    soles, and typically has more severe metabolic complications than classic
    partial Barraquer-Simons disease.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AGL is more common in females (females:males, 3:1) and appears usually
      before adolescence (but may develop at any time in life) with progressive
      loss of fat affecting the whole body including palms and soles
    explanation: >-
      Generalized distribution distinguishes AGL from classic APL.
- name: Severe weight-loss states
  description: >-
    Malnutrition, uncontrolled diabetes, thyrotoxicosis, adrenal insufficiency,
    cancer cachexia, HIV-associated wasting, and chronic infection cause
    generalized weight or fat loss rather than the characteristic acquired,
    symmetric cranio-caudal distribution.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnosis should include conditions presenting with severe
      weight loss (malnutrition, anorexia nervosa, uncontrolled diabetes
      mellitus, thyrotoxicosis, adrenocortical insufficiency, cancer cachexia,
      HIV-associated wasting, chronic infections).
    explanation: >-
      The guideline lists major generalized weight-loss mimics.
- name: Other acquired or localized lipoatrophy
  description: >-
    HIV/antiretroviral-associated, injection-associated, panniculitis-related,
    post-transplant, and localized facial lipoatrophy are distinct acquired
    entities. This record models classic non-HIV Barraquer-Simons syndrome, not
    every acquired regional fat-loss phenotype.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This practice guideline will not discuss lipodystrophy in HIV infected
      patients or localized lipodystrophy (eg, from injectable drugs).
    explanation: >-
      The guideline treats HIV-associated and injection-related localized
      lipodystrophy as separate scopes from classic syndromic APL.
treatments:
- name: Lifestyle and complication-directed metabolic therapy
  action_category: THERAPEUTIC
  description: >-
    Balanced energy-appropriate nutrition and regular physical activity are the
    foundation of care. Treat detected dysglycemia with standard agents such as
    metformin or insulin and dyslipidemia with statins, fibrates, or omega-3
    therapy as clinically indicated. In selected patients, off-label
    thiazolidinedione therapy may improve metabolic complications, but evidence
    is for partial lipodystrophy broadly rather than classic APL and regional
    fat excess can increase. This manages complications but does not regrow lost
    adipose tissue or arrest the complement process.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Abnormal glucose homeostasis
    term:
      id: HP:0011014
      label: Abnormal glucose homeostasis
  - preferred_term: Hypertriglyceridemia
    term:
      id: HP:0002155
      label: Hypertriglyceridemia
  - preferred_term: Hepatic steatosis
    term:
      id: HP:0001397
      label: Hepatic steatosis
  evidence:
  - reference: PMID:27710244
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diet is essential for the management of metabolic complications of
      lipodystrophy. Metreleptin therapy is effective for metabolic
      complications in hypoleptinemic patients with generalized lipodystrophy
      and selected patients with partial lipodystrophy. Other treatments not
      specific for lipodystrophy may be helpful as well (eg, metformin for
      diabetes, and statins or fibrates for hyperlipidemia).
    explanation: >-
      The multisociety guideline supports diet and standard
      complication-directed pharmacotherapy.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with lipodystrophy should be encouraged to exercise in the
      absence of specific contraindications.
    explanation: >-
      The full guideline supports regular physical activity when safe.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5155679/
    reference_title: "The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline - PMC"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with partial lipodystrophy, thiazolidinediones improved HbA1c,
      triglycerides, hepatic volume, and steatosis but may increase regional fat
      excess
    explanation: >-
      The guideline supports thiazolidinediones as an individualized metabolic
      option in partial lipodystrophy, while the evidence is not specific to
      classic acquired partial lipodystrophy and includes a fat-redistribution
      caveat.
- name: Metreleptin pharmacotherapy for severe metabolic complications
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Metreleptin is a recombinant leptin analogue for selected patients with
    severe metabolic complications despite standard therapy. In the EU,
    Myalepta is authorized for confirmed partial lipodystrophy, including
    Barraquer-Simons syndrome, from age 12 after standard treatments fail. The
    current US label is limited to generalized lipodystrophy and states that
    safety and effectiveness in partial lipodystrophy are not established.
    APL-specific efficacy remains uncertain because published cohorts combine
    partial-lipodystrophy subtypes; treatment does not restore fat distribution.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metreleptin
      term:

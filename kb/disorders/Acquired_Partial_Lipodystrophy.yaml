    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      adults and children above the age of 12 years with partial (localised)
      lipodystrophy (including Barraquer-Simons syndrome), when standard
      treatments have failed.
    explanation: >-
      The EMA indication explicitly includes Barraquer-Simons syndrome with an
      age threshold and failure-of-standard-treatment condition.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d3b50bbd-140b-425c-b5ec-d4682aad62bc
    reference_title: DailyMed - MYALEPT- metreleptin injection, powder, lyophilized, for solution
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The safety and effectiveness of MYALEPT for the treatment of

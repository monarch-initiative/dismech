progression:
- phase: Progressive cephalocaudal fat loss
  age_range: Usually childhood; reported from age 2 to 51 years
  notes: >-
    Fat loss usually begins in the face and neck and spreads symmetrically to
    the upper extremities and trunk. Lower-body adipose tissue is preserved,
    and some patients develop relative fat accumulation in the hips, buttocks,
    or legs. Adult-onset disease is documented and should not be excluded.
  evidence:
  - reference: PMID:40435301
    reference_title: "Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer-Simons Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of onset of lipodystrophy was 7 years (range, 2-51 years).
    explanation: >-
      The largest APL cohort establishes typical childhood onset while
      documenting a wide age range that includes adults.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12712982/
    reference_title: Clinical Features, Metabolic and Autoimmune Derangements in Acquired Partial Lipodystrophy (Barraquer–Simons Syndrome) - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all participants in whom we could define the pattern of fat loss ...
      lost subcutaneous fat starting from the face and neck,
      spreading to the upper part of the body, and sparing the lower part of
      the body.
    explanation: >-
      Full-text cohort data quantify the characteristic cephalocaudal pattern.
pathophysiology:
- name: C3 Nephritic Factor-Mediated Convertase Stabilization
  description: >-
    C3 nephritic factor (C3NeF) is an autoantibody that stabilizes the
    alternative-pathway C3 convertase and promotes persistent complement
    activation. It is common but not universal in APL and is not specific for
    the disorder.
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    modifier: INCREASED
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
  evidence:
  - reference: PMID:31924231
    reference_title: Immunological features of patients affected by Barraquer-Simons syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C3 hypocomplementemia and the presence of C3 nephritic factor (C3NeF), an
      autoantibody causing complement system over-activation, are common
      features among most patients affected by Barraquer-Simons syndrome (BSS),
      an acquired form of partial lipodystrophy.
    explanation: >-
      The APL cohort identifies C3NeF as an upstream autoantibody that promotes
      complement overactivation.
  - reference: PMID:38076230
    reference_title: "C3 glomerulopathies: dense deposit disease and C3 glomerulonephritis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In acquired forms of DDD and C3GN, the dysregulation of the alternative
      pathway is commonly induced by the presence of C3 nephritic factors
      (C3NeFs), which are autoantibodies that stabilize C3 convertase.
    explanation: >-
      Complement-disease review evidence defines the convertase-stabilizing
      mechanism of C3NeF.
  downstream:
  - target: Alternative Complement Pathway Dysregulation
    causal_link_type: DIRECT
    description: >-
      C3-convertase stabilization by C3NeF can produce persistent alternative
      pathway activation and C3 consumption.
    evidence:
    - reference: PMID:8496694
      reference_title: Complement-mediated adipocyte lysis by nephritic factor sera.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        nephritic factor (NeF) which leads to enhanced alternative pathway
        activation in vivo.
      explanation: >-
        The experimental study describes NeF as an upstream driver of enhanced
        alternative-pathway activation.
  - target: C3 nephritic factor positivity
    causal_link_type: DIRECT
    description: >-
      Detection of C3NeF is the clinical readout of this autoantibody state.
    evidence:
    - reference: PMID:31924231
      reference_title: Immunological features of patients affected by Barraquer-Simons syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        C3NeF was the most frequently found autoantibody (69.2% of cases),
        followed by anti-C3 (38.5%), and anti-P and anti-FB (30.8% each).
      explanation: >-
        The cohort quantifies C3NeF positivity in APL/BSS.
- name: Alternative Complement Pathway Dysregulation
  description: >-
    Acquired partial lipodystrophy is strongly associated with alternative
    complement pathway dysregulation. C3NeF specifically stabilizes the C3
    convertase; other reported complement autoantibodies have variable or
    incompletely defined functional effects. Persistent activation consumes C3
    and produces the characteristic low-serum-C3 state.
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    modifier: INCREASED
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
  - preferred_term: complement activation

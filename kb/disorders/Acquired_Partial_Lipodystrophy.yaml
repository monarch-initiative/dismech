definitions:
- name: Clinical fat-loss pattern
  definition_type: CASE_DEFINITION
  description: >-
    Acquired partial lipodystrophy is recognized by gradual loss of upper-body
    subcutaneous adipose tissue, especially face, neck, upper limbs, thorax, and
    trunk, with sparing of the lower extremities.
  scope: Clinical recognition of classic Barraquer-Simons syndrome
  evidence:
  - reference: PMID:32890433
    reference_title: "Evidence of ongoing complement activation on adipose tissue from an 11-year-old girl with Barraquer-Simons syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Barraquer-Simons syndrome (BSS), a form of acquired partial lipodystrophy,
      is a rare condition characterized by gradual loss of adipose tissue from
      the upper body, keeping intact the white adipose tissue of the lower
      extremities.
    explanation: >-
      This human tissue case report gives a compact clinical definition of the
      acquired partial lipodystrophy fat-loss pattern.
  - reference: PMID:32404319
    reference_title: Lipotransfer provides effective soft tissue replacement for acquired partial lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is a rare disease characterised by a gradual and progressive onset of
      lipoatrophy limited to the face, neck, upper limbs, thorax and abdomen
      and sparing the lower extremities.
    explanation: >-
      This case report independently supports the characteristic regional
      distribution and progression of lipoatrophy.
epidemiology:
- name: Ultra-rare disorder with marked female predominance
  description: >-
    APL is an ultra-rare acquired lipodystrophy. A Spanish national
    reference-center study estimated 0.34 diagnosed cases per million people;
    this is a country-specific referral estimate, not a worldwide prevalence.
    Clinical cohorts consistently show female predominance and a median onset
    near 7 to 8 years, although adult onset occurs.
  evidence:
  - reference: PMID:38034001
    reference_title: Natural history and comorbidities of generalised and partial lipodystrophy syndromes in Spain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      0.34 cases/
      million for APL
    explanation: >-
      This national reference-center cohort provides a country-specific
      diagnosed prevalence estimate for APL.
  - reference: PMID:14747765
    reference_title: "Clinical features and metabolic and autoimmune derangements in acquired partial lipodystrophy: report of 35 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the pooled data revealed that female patients were affected
      approximately 4 times more often than males. The median age of the onset
      of lipodystrophy was 7 years.
    explanation: >-
      The 35-patient series plus pooled literature review supports female
      predominance and typical childhood onset.

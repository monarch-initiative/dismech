name: Acquired Partial Lipodystrophy
category: Complex
creation_date: "2026-05-11T00:00:00Z"
description: >-
  Acquired partial lipodystrophy, also called Barraquer-Simons syndrome, is a
  ultra-rare acquired disorder with progressive, usually childhood-onset
  cephalocaudal loss of subcutaneous adipose tissue from the face and neck to
  the upper limbs and trunk, while lower-body fat is spared or increased.
  Alternative-complement dysregulation is a central disease association:
  C3 nephritic factor and other complement autoantibodies, persistent C3
  consumption, and low serum C3 are common. Experimental adipocyte lysis and a
  single human adipose-biopsy study support, but do not prove, a
  complement-mediated mechanism for depot-selective fat loss. Important
  complications include dysglycemia, hypertriglyceridemia, fatty liver,
  autoimmune disease, early macular drusen, and complement-associated renal
  disease. Recent cohorts show that metabolic burden is greater than older
  descriptions suggested, but varies substantially between referral cohorts.

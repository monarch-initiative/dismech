diagnosis:
- name: Gram stain, culture, and conjunctival NAAT
  description: >-
    Purulent conjunctival exudate can be assessed by Gram stain for
    intracellular Gram-negative diplococci, culture to recover N. gonorrhoeae
    and obtain antimicrobial susceptibility data, and locally validated
    nucleic-acid amplification assays for rapid organism detection from ocular
    swabs.
  evidence:
  - reference: PMID:42429409
    reference_title: "Diagnosis of chlamydial and gonococcal conjunctivitis: performance evaluation of a nucleic acid amplification test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among the 12 NG-positive samples, 11 were confirmed (seven by culture,
      four by LSPQ testing). Of 12 NG-negative controls, 11 were clinically
      confirmed. Sensitivity and specificity were 87% and 98% for CT, and both
      were 92% for NG.
    explanation: >-
      Supports conjunctival NAAT as a high-performing molecular adjunct for
      ocular N. gonorrhoeae detection in a retrospective validation study.
  - reference: PMID:42429409
    reference_title: "Diagnosis of chlamydial and gonococcal conjunctivitis: performance evaluation of a nucleic acid amplification test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No regulatory agency-approved nucleic acid amplification tests (NAATs)
      exist for detecting Chlamydia trachomatis (CT) or Neisseria gonorrhoeae
      (NG) in conjunctival samples, necessitating validation, including
      performance analysis.
    explanation: >-
      Adds the diagnostic caveat that ocular NAAT use requires local validation
      because approved conjunctival-sample assays are lacking.

treatments:
- name: Systemic ceftriaxone-based eradication plus ocular lavage
  description: >-
    Suspected or confirmed ocular gonorrhea is treated urgently with systemic
    gonococcal antibiotics, typically ceftriaxone-based therapy selected with
    attention to antimicrobial susceptibility, plus saline lavage and local
    ocular adjuncts to clear purulent discharge.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Type IV Pilus and Opa Adhesion
    treatment_effect: INHIBITS
    description: >-
      Systemic antibiotic therapy kills the gonococci maintaining mucosal
      adhesion and invasion.
  - target: Purulent Neutrophilic Conjunctivitis
    treatment_effect: INHIBITS
    description: >-
      Eradication removes the bacterial trigger for the purulent neutrophilic
      ocular response.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most common systemic treatment was IV ceftriaxone, alone or in
      combination with another antibiotic (6/15; 40%), followed by IM
      ceftriaxone, alone or in combination with another antibiotic (5/15; 33%).
    explanation: >-
      Documents ceftriaxone-centered systemic treatment in a recent ocular
      gonococcal case series.
  - reference: PMID:24210280
    reference_title: "[Gonococcal conjunctivitis in a young woman]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      management included lavage of the infected eye, systemic antibiotic
      treatment with erythromycin and topical antibiotic treatment with
      azithromycin
    explanation: >-
      Supports the combination of systemic antibiotics and ocular lavage in
      gonococcal conjunctivitis management.
- name: Tectonic or therapeutic keratoplasty
  description: >-
    Corneal perforation after gonococcal keratoconjunctivitis is managed with
    lamellar, penetrating, or tectonic corneal transplantation in combination
    with antimicrobial therapy to re-form the globe and preserve vision.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Corneal Transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  target_mechanisms:
  - target: Corneal Perforation and Visual Threat
    treatment_effect: RESTORES
    description: >-
      Keratoplasty replaces perforated corneal tissue and restores structural
      integrity after stromal melt.
  evidence:
  - reference: PMID:18064057
    reference_title: Surgical management of corneal perforation secondary to gonococcal keratoconjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Corneal perforations were treated with lamellar or penetrating
      keratoplasty using cryopreserved or fresh corneal grafts.
    explanation: >-
      Supports keratoplasty as a salvage procedure for gonococcal corneal
      perforation.
- name: Neonatal ocular antimicrobial prophylaxis
  description: >-
    Routine neonatal ocular prophylaxis (historically silver nitrate, with
    povidone-iodine and erythromycin ointment as alternatives) is applied at
    birth to prevent gonococcal ophthalmia neonatorum acquired through the
    maternal genital tract.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Neonatal ocular antimicrobial prophylaxis
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_mechanisms:
  - target: Conjunctival Gonococcal Inoculation
    treatment_effect: INHIBITS
    description: >-
      Topical antimicrobial prophylaxis at birth blocks establishment of
      N. gonorrhoeae on the neonatal conjunctival surface.
  evidence:
  - reference: PMID:8771523
    reference_title: The influence of perinatal infective factors on ophthalmia neonatorum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In a randomized prospective study of ophthalmia neonatorum in Kenya, we
      studied the effect of prophylaxis with povidone-iodine, silver nitrate,
      and erythromycin in 3117 neonates.
    explanation: >-
      Identifies povidone-iodine, silver nitrate and erythromycin as the ocular
      prophylaxis agents evaluated against ophthalmia neonatorum, which includes
      the gonococcal form, in a 3,117-neonate randomized trial.

animal_models:
- name: Human-CEACAM transgenic mouse (Opa-CEACAM mucosal infection)
  species: Mouse
  genotype: Transgenic for human CEACAM1/CEACAM3/CEACAM5/CEACAM6
  publication: PMID:29760215
  modeled_mechanisms:
  - target: Opa-CEACAM Epithelial Uptake
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Mice expressing human CEACAMs reconstitute Opa-CEACAM-dependent gonococcal
      association with and penetration of human-CEACAM-bearing epithelium, the
      mechanism of the uptake node.
    limitations: >-
      The model is of the female reproductive tract, not the ocular surface, and
      native murine CEACAMs do not bind gonococcal Opa proteins, so the
      interaction exists only through the human transgene.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The conjunctival and corneal surface in which ocular gonococcal uptake
        occurs lies outside the model boundary; transgenic uterine and vaginal
        epithelium stands in for CEACAM-bearing mucosal epithelium in general,
        so the model constrains the Opa-CEACAM step but is silent on
        ocular-surface-specific features.
    evidence:
    - reference: PMID:29760215
      reference_title: Specific Binding to Differentially Expressed Human Carcinoembryonic Antigen-Related Cell Adhesion Molecules Determines the Outcome of Neisseria gonorrhoeae Infections along the Female Reproductive Tract.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Using transgenic mouse lines expressing human CEACAMs in a manner that
        reflects this differential pattern, we considered the impact of
        Opa-CEACAM interactions during uncomplicated lower genital tract
        infections versus during pelvic inflammatory disease.
      explanation: >-
        Establishes the human-CEACAM transgenic mouse as the system in which
        Opa-CEACAM-dependent gonococcal tissue interactions are modeled.

experimental_models:
- name: Gonococcus-human epithelial cell in vitro interaction assay
  description: >-
    Ex vivo and monoculture assays of N. gonorrhoeae interacting with a
    representative human epithelial cell line, used to dissect adhesins,
    invasins, and their human receptors.
  experimental_model_type: CELL_LINE
  modeled_mechanisms:
  - target: Opa-CEACAM Epithelial Uptake
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Human epithelial monocultures reproduce the gonococcal adhesin-receptor
      interactions underlying CEACAM-mediated uptake.
    limitations: >-
      A monoculture of a single human cell line lacks the conjunctival tissue
      architecture, tear film, and neutrophil influx of the infected ocular
      surface.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The ocular-surface microenvironment -- conjunctival epithelial
        architecture, tear film, and recruited neutrophils -- lies outside the
        monoculture boundary, so the assay constrains the molecular uptake step
        only.
    evidence:
    - reference: PMID:31119630
      reference_title: Basic Methods for Examining Neisseria gonorrhoeae Interactions with Host Cells In Vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In this chapter, readers are provided with protocols for examining the
        basic interactions between gonococci and a representative human cell
        line.
      explanation: >-
        Describes the in vitro human-cell interaction system used to study
        gonococcal adhesion and uptake.


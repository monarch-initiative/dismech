name: Gonococcal Conjunctivitis
creation_date: "2026-09-30T08:37:14Z"
description: >-
  Gonococcal conjunctivitis is a hyperacute ocular gonorrheal infection in
  which Neisseria gonorrhoeae is inoculated onto conjunctival epithelium,
  adheres through type IV pili and Opa-family adhesins, invades epithelial
  surfaces through human CEACAM receptors, and provokes a purulent neutrophilic
  conjunctivitis that can extend to the cornea with stromal melting,
  ulceration, perforation, and visual loss unless systemic antibiotic treatment
  is started promptly.
category: Infectious Disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:35489793
      reference_title: Neisseria gonorrhoeae physiology and pathogenesis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Neisseria gonorrhoeae is an obligate human pathogen that is the cause
        of the sexually transmitted disease gonorrhoea.
      explanation: >-
        Identifies the bacterial species that causes the broader gonorrheal
        infection from which ocular disease arises.
disease_term:
  preferred_term: gonococcal conjunctivitis
  term:
    id: MONDO:0015455
    label: gonococcal conjunctivitis
parents:
- gonorrhea
synonyms:
- gonococcal ophthalmia
- gonococcal ophthalmia neonatorum
- gonococcal keratoconjunctivitis
- gonorrheal conjunctivitis
infectious_agent:
- name: Neisseria gonorrhoeae
  description: >-
    Neisseria gonorrhoeae is the Gram-negative, human-restricted diplococcus
    that causes gonococcal conjunctivitis after ocular inoculation from genital
    secretions or an infected birth canal.
  infectious_agent_term:
    preferred_term: Neisseria gonorrhoeae
    term:
      id: NCBITaxon:485
      label: Neisseria gonorrhoeae
  evidence:
  - reference: PMID:31119630
    reference_title: Basic Methods for Examining Neisseria gonorrhoeae Interactions with Host Cells In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition, gonococci can infect the anorectal, pharyngeal, and
      gingival mucosae and epithelial cells of the conjunctiva.
    explanation: >-
      Places conjunctival epithelium among the human mucosal surfaces that
      N. gonorrhoeae can infect.

transmission:
- name: Direct ocular inoculation
  description: >-
    In sexually active adults, ocular infection usually follows direct transfer
    of genital secretions carrying N. gonorrhoeae onto the conjunctival surface,
    making adult disease typically unilateral.
  evidence:
  - reference: PMID:41222259
    reference_title: Unusual Bilateral Self-Sealing Corneal Flaps in Neisseria gonorrhoeae Keratitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adult gonococcal conjunctivitis (GC) typically occurs by direct
      inoculation and is usually unilateral.
    explanation: >-
      Summarizes the usual acquisition route and unilateral presentation in
      adults.
- name: Perinatal conjunctival exposure
  description: >-
    Neonatal gonococcal ophthalmia follows birth through a maternal genital
    tract carrying N. gonorrhoeae and can occur despite ocular prophylaxis when
    prenatal screening or antimicrobial coverage fails.
  evidence:
  - reference: PMID:8771523
    reference_title: The influence of perinatal infective factors on ophthalmia neonatorum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      with regard to venereal ophthalmia neonatorum, the 26 infants born to
      mothers with vaginitis had a relative risk 5.1 times that of the rest of
      the infants
    explanation: >-
      Supports maternal genital infection as a perinatal risk context for
      venereal and gonococcal ophthalmia neonatorum.

environmental:
- name: Sexual or perinatal exposure to infected genital secretions
  description: >-
    Exposure of the conjunctiva to gonococcus-containing genital secretions,
    either by adult hand-to-eye or sexual inoculation or during delivery, is the
    prerequisite for this ocular infection.
  influences_mechanisms:
  - target: Conjunctival Gonococcal Inoculation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Contact with infected secretions deposits gonococci on conjunctival
      epithelium.
  evidence:
  - reference: PMID:41222259
    reference_title: Unusual Bilateral Self-Sealing Corneal Flaps in Neisseria gonorrhoeae Keratitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Adult gonococcal conjunctivitis (GC) typically occurs by direct
      inoculation and is usually unilateral.
    explanation: >-
      Supports direct ocular inoculation as the common adult exposure.

pathophysiology:
- name: Conjunctival Gonococcal Inoculation
  role: trigger
  biological_scale: TISSUE
  description: >-
    Direct ocular or intrapartum exposure seeds viable N. gonorrhoeae onto the
    conjunctival mucosa, where human epithelial cells provide the initial
    attachment surface.
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  downstream:
  - target: Type IV Pilus and Opa Adhesion
    causal_link_type: DIRECT
    description: >-
      Deposited organisms use type IV pili, PorB, and Opa outer-membrane
      proteins to attach and stabilize microcolonies on mucosal epithelium.
  evidence:
  - reference: PMID:31119630
    reference_title: Basic Methods for Examining Neisseria gonorrhoeae Interactions with Host Cells In Vitro.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The obligate human pathogen Neisseria gonorrhoeae colonizes primarily the
      mucosal columnar epithelium of the male urethra and the female
      endocervix.
    explanation: >-
      Establishes N. gonorrhoeae as a mucosal epithelial pathogen, consistent
      with conjunctival inoculation as the initiating ocular event.
- name: Type IV Pilus and Opa Adhesion
  biological_scale: CELLULAR
  description: >-
    Type IV pili initiate gonococcal attachment and microcolony formation on
    mucosal cells, while PorB and phase-variable Opa proteins provide
    additional intimate adhesion.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Opa-CEACAM Epithelial Uptake
    causal_link_type: DIRECT
    description: >-
      Opa-expressing bacteria bind CEACAM-family epithelial receptors and can
      be internalized.
  evidence:
  - reference: PMID:35489793
    reference_title: Neisseria gonorrhoeae physiology and pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The gonococcus initially colonises and adheres to host mucosal surfaces
      utilising a type IV pilus that helps with microcolony formation.
    explanation: >-
      Supports type IV pilus-mediated mucosal adhesion as the early
      colonization step.
  - reference: PMID:35489793
    reference_title: Neisseria gonorrhoeae physiology and pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other adhesion strategies include the porin, PorB, and the phase variable
      outer membrane protein Opa.
    explanation: >-
      Identifies PorB and Opa as additional gonococcal adhesins.
- name: Opa-CEACAM Epithelial Uptake
  biological_scale: CELLULAR
  description: >-
    Opa adhesins bind human CEACAM receptors on epithelial cells, routing
    gonococci into cholesterol-rich membrane-microdomain uptake pathways that
    promote cell association, invasion, and tissue penetration.
  biological_processes:
  - preferred_term: symbiont entry into host
    modifier: INCREASED
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Purulent Neutrophilic Conjunctivitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Epithelial invasion exposes pathogen-associated ligands that recruit
      neutrophils and amplify ocular surface inflammation.
  evidence:
  - reference: PMID:17517873
    reference_title: Opa proteins of pathogenic neisseriae initiate Src kinase-dependent or lipid raft-mediated uptake via distinct human carcinoembryonic antigen-related cell adhesion molecule isoforms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our results point to two mechanistically different uptake pathways
      triggered by either epithelial CEACAMs (CEACAM1, CEA, and CEACAM6) or the
      granulocyte-specific CEACAM3.
    explanation: >-
      Demonstrates that epithelial CEACAM isoforms trigger a gonococcal uptake
      route distinct from the granulocyte CEACAM3 pathway.
  - reference: PMID:29760215
    reference_title: Specific Binding to Differentially Expressed Human Carcinoembryonic Antigen-Related Cell Adhesion Molecules Determines the Outcome of Neisseria gonorrhoeae Infections along the Female Reproductive Tract.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Opa protein binding to CEACAM1 on uterine epithelia enhances gonococcal
      association and penetration into these tissues.
    explanation: >-
      Supports Opa-CEACAM epithelial binding as a mechanism for gonococcal
      association with and penetration of mucosal tissue.
- name: Purulent Neutrophilic Conjunctivitis
  biological_scale: TISSUE
  description: >-
    Invasion of the conjunctival surface triggers hyperacute neutrophil-rich
    inflammation with copious purulent discharge, hemorrhagic conjunctival
    injection, chemosis, eyelid edema, and adjacent preseptal cellulitis.
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:
      id: GO:0050900
      label: leukocyte migration
  downstream:
  - target: Corneal Keratitis and Stromal Melting
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe gonococcal keratoconjunctivitis can extend from conjunctiva to the
      cornea, where epithelial invasion and neutrophil-mediated injury drive
      ulceration and stromal melt.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most common presenting features included purulent discharge (14/15; 93%),
      haemorrhagic conjunctivitis (10/15; 67%) and pre-septal cellulitis (9/15;
      60%).
    explanation: >-
      Quantifies the dominant purulent and inflammatory ocular findings in an
      adult culture-confirmed case series.
- name: Corneal Keratitis and Stromal Melting
  biological_scale: TISSUE
  description: >-
    A subset of infections involve the cornea, producing keratitis, ulceration,
    and stromal collagenolysis that can progress even after the conjunctival
    diagnosis is clinically suspected.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal Perforation and Visual Threat
    causal_link_type: DIRECT
    description: >-
      Progressive stromal loss thins the infected cornea until perforation
      compromises globe integrity.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Corneal involvement was documented in 5 (33%), with marginal ulceration
      in 1 (7%) but none had corneal perforation.
    explanation: >-
      Shows that corneal extension and ulceration occur in a substantial
      minority of culture-confirmed ocular gonorrhea cases.
  - reference: PMID:32787586
    reference_title: Rapid polymerase chain reaction test for the early diagnosis of gonococcal keratoconjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A 26-year-old woman presented to our emergency department with severe
      perilimbal stromal melting in both eyes and profuse purulent discharge
      for one day.
    explanation: >-
      Documents the stromal-melting complication in gonococcal
      keratoconjunctivitis.
- name: Corneal Perforation and Visual Threat
  biological_scale: TISSUE
  description: >-
    Untreated or delayed gonococcal keratitis can perforate the cornea within
    days, flatten the anterior chamber, and require tectonic or optical
    keratoplasty to preserve or restore vision.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:18064057
    reference_title: Surgical management of corneal perforation secondary to gonococcal keratoconjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      corneal perforation occurred with a mean duration of 11 days after
      development of conjunctivitis.
    explanation: >-
      Quantifies the rapid time course from conjunctivitis onset to corneal
      perforation in a keratoplasty case series.

phenotypes:
- name: Hyperacute purulent conjunctivitis
  phenotype_term:
    preferred_term: Conjunctivitis
    term:
      id: HP:0000509
      label: Conjunctivitis
  frequency: OBLIGATE
  description: >-
    Gonococcal conjunctivitis presents as abrupt conjunctival inflammation with
    copious purulent discharge and hemorrhagic injection.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most common presenting features included purulent discharge (14/15; 93%),
      haemorrhagic conjunctivitis (10/15; 67%) and pre-septal cellulitis (9/15;
      60%).
    explanation: >-
      Supports purulent conjunctivitis as the dominant clinical phenotype.
- name: Corneal ulceration
  phenotype_term:
    preferred_term: Corneal ulceration
    term:
      id: HP:0012804
      label: Corneal ulceration
  description: >-
    Gonococcal corneal extension can produce marginal or stromal ulceration as
    part of keratoconjunctivitis.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Corneal involvement was documented in 5 (33%), with marginal ulceration
      in 1 (7%) but none had corneal perforation.
    explanation: >-
      Documents ulcerative corneal involvement in a culture-confirmed adult
      series.
- name: Corneal perforation
  phenotype_term:
    preferred_term: Corneal perforation
    term:
      id: HP:0100583
      label: Corneal perforation
  description: >-
    Severe or delayed infections can perforate the cornea and threaten globe
    integrity.
  evidence:
  - reference: PMID:18064057
    reference_title: Surgical management of corneal perforation secondary to gonococcal keratoconjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      To report five cases of gonococcal keratoconjunctivitis with severe
      corneal involvement treated with therapeutic keratoplasty.
    explanation: >-
      Establishes corneal perforation severe enough for keratoplasty as a
      recognized complication of gonococcal keratoconjunctivitis.

diagnosis:
- name: Gram stain, culture, and conjunctival NAAT
  description: >-
    Purulent conjunctival exudate can be assessed by Gram stain for
    intracellular Gram-negative diplococci, culture to recover N. gonorrhoeae
    and obtain antimicrobial susceptibility data, and locally validated
    nucleic-acid amplification assays for rapid organism detection from ocular
    swabs.
  evidence:
  - reference: PMID:42429409
    reference_title: "Diagnosis of chlamydial and gonococcal conjunctivitis: performance evaluation of a nucleic acid amplification test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among the 12 NG-positive samples, 11 were confirmed (seven by culture,
      four by LSPQ testing). Of 12 NG-negative controls, 11 were clinically
      confirmed. Sensitivity and specificity were 87% and 98% for CT, and both
      were 92% for NG.
    explanation: >-
      Supports conjunctival NAAT as a high-performing molecular adjunct for
      ocular N. gonorrhoeae detection in a retrospective validation study.
  - reference: PMID:42429409
    reference_title: "Diagnosis of chlamydial and gonococcal conjunctivitis: performance evaluation of a nucleic acid amplification test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No regulatory agency-approved nucleic acid amplification tests (NAATs)
      exist for detecting Chlamydia trachomatis (CT) or Neisseria gonorrhoeae
      (NG) in conjunctival samples, necessitating validation, including
      performance analysis.
    explanation: >-
      Adds the diagnostic caveat that ocular NAAT use requires local validation
      because approved conjunctival-sample assays are lacking.

treatments:
- name: Systemic ceftriaxone-based eradication plus ocular lavage
  description: >-
    Suspected or confirmed ocular gonorrhea is treated urgently with systemic
    gonococcal antibiotics, typically ceftriaxone-based therapy selected with
    attention to antimicrobial susceptibility, plus saline lavage and local
    ocular adjuncts to clear purulent discharge.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Type IV Pilus and Opa Adhesion
    treatment_effect: INHIBITS
    description: >-
      Systemic antibiotic therapy kills the gonococci maintaining mucosal
      adhesion and invasion.
  - target: Purulent Neutrophilic Conjunctivitis
    treatment_effect: INHIBITS
    description: >-
      Eradication removes the bacterial trigger for the purulent neutrophilic
      ocular response.
  evidence:
  - reference: PMID:34211138
    reference_title: Five-year review of ocular Neisseria gonorrhoeae infections presenting to ophthalmology departments in Greater Glasgow & Clyde, Scotland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most common systemic treatment was IV ceftriaxone, alone or in
      combination with another antibiotic (6/15; 40%), followed by IM
      ceftriaxone, alone or in combination with another antibiotic (5/15; 33%).
    explanation: >-
      Documents ceftriaxone-centered systemic treatment in a recent ocular
      gonococcal case series.
  - reference: PMID:24210280
    reference_title: "[Gonococcal conjunctivitis in a young woman]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      management included lavage of the infected eye, systemic antibiotic
      treatment with erythromycin and topical antibiotic treatment with
      azithromycin
    explanation: >-
      Supports the combination of systemic antibiotics and ocular lavage in
      gonococcal conjunctivitis management.
- name: Tectonic or therapeutic keratoplasty
  description: >-
    Corneal perforation after gonococcal keratoconjunctivitis is managed with
    lamellar, penetrating, or tectonic corneal transplantation in combination
    with antimicrobial therapy to re-form the globe and preserve vision.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Corneal Transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  target_mechanisms:
  - target: Corneal Perforation and Visual Threat
    treatment_effect: RESTORES
    description: >-
      Keratoplasty replaces perforated corneal tissue and restores structural
      integrity after stromal melt.
  evidence:
  - reference: PMID:18064057
    reference_title: Surgical management of corneal perforation secondary to gonococcal keratoconjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Corneal perforations were treated with lamellar or penetrating
      keratoplasty using cryopreserved or fresh corneal grafts.
    explanation: >-
      Supports keratoplasty as a salvage procedure for gonococcal corneal
      perforation.


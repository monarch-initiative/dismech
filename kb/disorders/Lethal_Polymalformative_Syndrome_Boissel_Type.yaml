external_assertions:
- name: GenCC FTO gene-disease validity submissions
  source: GenCC
  assertion_type: gene_disease_relationship
  external_id: HGNC:24678
  url: https://search.thegencc.org/genes/HGNC:24678
  description: >-
    Four GenCC submitters classify the FTO-MONDO:0013050 relationship, all as
    autosomal recessive, and they do not agree: Labcorp Genetics Strong,
    PanelApp Australia Strong, Orphanet Supportive, G2P Limited. The split
    tracks how much of the literature each submission counted rather than a
    disagreement about the same evidence. The two Strong submissions cite five
    and ten PMIDs including the 2016 case reports; the Supportive and Limited
    submissions each cite only the 2009 index report, and the G2P classification
    is dated 2015, before two of the five published families were reported.
  notes: >-
    Read from the GenCC submissions export on 2026-09-03. GenCC has no CURIE
    prefix that this repository's reference validator resolves, so this record is
    a citation to the registry rather than an evidence item with a verified
    snippet; the classifications above are reported, not quoted.
- name: OMIM growth retardation, developmental delay, coarse facies, and early death
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:612938
  description: >-
    The OMIM phenotype entry for this disease. Its title names early death but
    not lethality as a defining criterion, which is closer to the reported
    outcomes than the MONDO label is.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About a dozen patients from five families, published between 2009 and 2023.
    Nine of them are siblings in the single consanguineous Palestinian Arab
    pedigree of the index report, so the case count is not a count of independent
    observations. No prevalence, incidence, or carrier frequency has been
    estimated for this disease and none is inferred here.
  evidence:
  - reference: PMID:37529081
    reference_title: "Case report: A novel biallelic FTO variant causing multisystem anomalies with severe epilepsy, widening the spectrum of FTO syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenically viable human variants in FTO appear to be exceedingly rare, with only 11 cases of FTO malformation syndrome currently reported in the literature.
    explanation: >-
      The published case count as of 2023, which with the 2023 patient gives the
      dozen recorded here.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients are homozygous for a missense FTO allele, and most are
    from consanguineous unions. Heterozygous carriage is not associated with the
    syndrome: a survey of 2,866 lean and obese adults found catalytically dead
    FTO alleles, including the same R322Q later reported homozygous in an
    affected family, present heterozygously in unaffected people on both sides of
    the weight distribution.
  evidence:
  - reference: PMID:19559399
    reference_title: Loss-of-function mutation in the dioxygenase-encoding FTO gene causes severe growth retardation and multiple malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that a R316Q mutation, inactivating FTO enzymatic activity, is responsible for an autosomal-recessive lethal syndrome.
    explanation: >-
      Establishes the recessive mode in the index pedigree.
  - reference: PMID:19833892
    reference_title: Prevalence of loss-of-function FTO mutations in lean and obese individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      R322Q was unable to catalyze the conversion of 2-oxoglutarate to succinate in the presence or absence of 3-methylthymidine.
    explanation: >-
      Demonstrates that R322Q abolishes catalysis. This variant was found here
      heterozygously in adults without the syndrome, and was later reported
      homozygously in an affected family, which is the strongest available
      evidence that a single inactive allele is tolerated.
pathophysiology:
- name: Biallelic FTO missense variant
  biological_scale: MOLECULAR
  description: >-
    Five homozygous missense alleles have been reported: R316Q, S319F and R322Q
    in the catalytic domain, and R96P in the substrate-recognition lid outside
    the catalytic site. Each has been shown biochemically to reduce or abolish
    FTO demethylase activity, so the alleles converge on the same molecular
    consequence from two different parts of the protein.
  genes:
  - preferred_term: FTO
    term:
      id: hgnc:24678
      label: FTO
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: SNV
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous missense alleles with demonstrated loss of enzymatic function.
      No truncating or null allele has been reported in this disease, which
      leaves open whether complete absence of FTO protein is compatible with
      human life.
  evidence:
  - reference: PMID:26697951
    reference_title: FTO variant associated with malformation syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed that the p.R316Q, p.S219F, and p.R322Q variants render the FTO protein inactive.
    explanation: >-
      Establishes that three of the reported catalytic-domain alleles inactivate
      the protein in the same assay. Note the sentence writes p.S219F where the
      variant reported elsewhere in the same abstract is p.S319F.
  - reference: PMID:37529081
    reference_title: "Case report: A novel biallelic FTO variant causing multisystem anomalies with severe epilepsy, widening the spectrum of FTO syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss-of-function resulting from the patient's R96P missense variant was demonstrated with in vitro biochemical characterization of demethylase activity, resulting in a 90% reduction in function of the fat mass and obesity-associated protein compared to wild-type.
    explanation: >-
      Shows that an allele outside the catalytic site reaches the same functional
      endpoint, which is why this node is defined by loss of activity rather than
      by domain location.
  downstream:
  - target: Loss of FTO 2-oxoglutarate-dependent demethylase activity
    description: >-
      Each reported allele reduces or abolishes the enzyme's catalytic output.
    causal_link_type: DIRECT
- name: Loss of FTO 2-oxoglutarate-dependent demethylase activity
  biological_scale: MOLECULAR
  description: >-
    FTO is an Fe(II)- and 2-oxoglutarate-dependent dioxygenase of the AlkB
    family. Which of its substrates matters for this disease is not established:
    the 2009 index report assayed 3-methylthymidine turnover in single-stranded
    DNA, predating the identification of FTO as the first mRNA m6A demethylase,
    while the 2023 report assayed m6A. No study has shown which activity the
    malformation phenotype depends on.
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
  biological_processes:
  - preferred_term: oxidative demethylation
    modifier: DECREASED
    term:
      id: GO:0070989
      label: oxidative demethylation
  evidence:
  - reference: PMID:26378117
    reference_title: Identification of a pathogenic FTO mutation by next-generation sequencing in a newborn with growth retardation and developmental delay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical studies reveal that p.(Ser319Phe) FTO has reduced 2-oxoglutarate turnover and N-methyl-nucleoside demethylase activity.
    explanation: >-
      Measures both the cosubstrate turnover and the demethylase output for a
      second disease allele.
  - reference: PMID:22002720
    reference_title: "N6-methyladenosine in nuclear RNA is a major substrate of the obesity-associated FTO."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report here that fat mass and obesity-associated protein (FTO) has efficient oxidative demethylation activity targeting the abundant N6-methyladenosine (m(6)A) residues in RNA in vitro.
    explanation: >-
      Identifies the substrate that later reports assay. Cited to establish the
      substrate ambiguity described on this node rather than to make a claim
      about the disease; this paper is not about the malformation syndrome.
  downstream:
  - target: Wnt pathway imbalance and defective ciliogenesis
    description: >-
      The one mechanistic route between loss of FTO and a developmental
      phenotype that has been worked out, though only in model systems.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired fibroblast proliferation and premature senescence
    description: >-
      The one cellular phenotype reported for patient cells, and the one that a
      later report failed to reproduce.
    causal_link_type: UNKNOWN
  - target: Failure of central nervous system and cardiovascular development
    description: >-
      The index report concludes that FTO is essential for development of these
      two systems, on the basis of the malformations observed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Wnt pathway imbalance and defective ciliogenesis
  biological_scale: CELLULAR
  description: >-
    Loss of Fto shifts the balance between the two branches of Wnt signalling -
    canonical signalling falls because beta-catenin fails to translocate to the
    nucleus, while the non-canonical Wnt/calcium branch is activated through
    CaMKII and PKC-delta - and produces short, absent or disorganised cilia. In
    zebrafish this is accompanied by growth retardation, craniofacial
    dysmorphism, aberrant neural crest cell migration, microcephaly, situs
    inversus and renal cystogenesis, and Fto knockout mice show tissue-specific
    ciliary abnormality. This is the only worked-out route from FTO loss to a
    developmental phenotype, and it has been shown only in model systems: no
    patient tissue has been examined for either the Wnt shift or the ciliary
    defect.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  - preferred_term: Wnt signaling pathway, calcium modulating pathway
    modifier: INCREASED
    term:
      id: GO:0007223
      label: Wnt signaling pathway, calcium modulating pathway
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  - preferred_term: neural crest cell migration
    modifier: ABNORMAL
    term:
      id: GO:0001755
      label: neural crest cell migration
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  evidence:
  - reference: PMID:24503721
    reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that loss of Fto leads to developmental defects such as growth retardation, craniofacial dysmorphism and aberrant neural crest cells migration in Zebrafish.
    explanation: >-
      The developmental phenotype in the zebrafish model, which is the closest
      any model comes to the human malformation syndrome.
  - reference: PMID:24503721
    reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Canonical Wnt signalling is down regulated by abrogated β-Catenin translocation to the nucleus whilst non-canonical Wnt/Ca(2+) pathway is activated via its key signal mediators CaMKII and PKCδ.
    explanation: >-
      The directional Wnt result behind the two Wnt process bindings on this
      node. Graded IN_VITRO because this sentence reports the Fto-null MEF and
      HEK293T work; the zebrafish arm is graded separately above.
  - reference: PMID:24503721
    reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, we demonstrate that loss of Fto results in short, absent or disorganised cilia leading to situs inversus, renal cystogenesis, neural crest cell defects and microcephaly in Zebrafish.
    explanation: >-
      The ciliary result and the organ phenotypes it is said to produce,
      including microcephaly, which is also a human phenotype in this entry.
  downstream:
  - target: Failure of central nervous system and cardiovascular development
    description: >-
      Proposed route to the human malformations. The link is drawn from model
      systems only; no patient tissue has been examined.
    causal_link_type: UNKNOWN
- name: Impaired fibroblast proliferation and premature senescence
  biological_scale: CELLULAR
  description: >-
    Cultured skin fibroblasts from the index family showed impaired proliferation
    and accelerated senescence. A later patient's fibroblasts showed no
    difference in morphology, proliferation or apoptosis against parental and
    unrelated controls; that report did not test senescence. The two results are
    not reconciled, and the second patient also carried a nonsense CETP variant,
    so this node is retained with both results attached rather than treated as an
    established step.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  - preferred_term: cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  notes: >-
    No conforms_to declaration to the cellular_senescence module. A single
    positive report contradicted on the proliferation arm by a second report is
    below what a conformance claim should rest on.
  evidence:
  - reference: PMID:19559399
    reference_title: Loss-of-function mutation in the dioxygenase-encoding FTO gene causes severe growth retardation and multiple malformations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cultured skin fibroblasts from affected subjects showed impaired proliferation and accelerated senescence.
    explanation: >-
      The original cellular result, from the index pedigree.
  - reference: PMID:26740239
    reference_title: A patient with a novel homozygous missense mutation in FTO and concomitant nonsense mutation in CETP.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Although we did not test senescence, we were not able to detect any abnormalities in either morphology or proliferation in the patient fibroblast cultures compared to either parent or control fibroblasts.
    explanation: >-
      A direct negative result on the proliferation and morphology arm in a
      second patient's fibroblasts, with parental controls. REFUTE applies to
      proliferation and morphology only; the same sentence states senescence was
      not tested, which is why the senescence claim rests on the index report
      alone.
- name: Failure of central nervous system and cardiovascular development
  biological_scale: ORGANISM
  description: >-
    The index report's conclusion, drawn from the pattern of malformations rather
    than from a demonstrated developmental mechanism. Nothing published fills in
    the steps between loss of demethylase activity and a septal defect or a
    lissencephalic cortex, and this entry does not invent them.
  biological_processes:
  - preferred_term: central nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007417
      label: central nervous system development
  - preferred_term: heart development
    modifier: ABNORMAL
    term:
      id: GO:0007507
      label: heart development
  evidence:
  - reference: PMID:19559399
    reference_title: Loss-of-function mutation in the dioxygenase-encoding FTO gene causes severe growth retardation and multiple malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that FTO is essential for normal development of the central nervous and cardiovascular systems in human and establish that a mutation in a human member of the AlkB-related dioxygenase family results in a severe polymalformation syndrome.
    explanation: >-
      The authors' own conclusion, which is the level at which this node is
      asserted. Note it is an inference from phenotype, not a mechanism.
  downstream:
  - target: Global developmental delay
    description: Disturbed CNS development presents as severe psychomotor delay.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    description: Reduced brain growth is part of the CNS phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of the cardiovascular system
    description: Cardiac malformation follows from disturbed cardiovascular development.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Failure to thrive
    description: >-
      Severe postnatal growth failure. The route from demethylase loss to growth
      failure is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal facial shape
    description: The coarse facial gestalt reported across the families.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

name: Lethal Polymalformative Syndrome, Boissel Type
creation_date: "2026-09-03T23:59:00Z"
category: Mendelian
description: >-
  An autosomal recessive multisystem malformation syndrome caused by biallelic
  FTO missense variants that inactivate the FTO Fe(II)/2-oxoglutarate-dependent
  demethylase. Reported features are severe growth retardation, global
  developmental delay, a coarse facial gestalt, microcephaly, brain and cardiac
  malformations, and sensory impairment; death in early childhood was the
  outcome in the index pedigree, though later-reported patients have survived
  beyond infancy. The whole published evidence base is about a dozen patients
  from five consanguineous or unrelated families. FTO's much larger literature
  concerns common intron-1 obesity-associated variants that act on neighbouring
  genes, not on FTO protein function, and is not evidence about this disease.

animal_models:
- name: fto-deficient zebrafish
  species: Zebrafish
  genotype: fto loss of function
  publication: PMID:24503721
  description: >-
    Loss of fto in zebrafish produces growth retardation, craniofacial
    dysmorphism, aberrant neural crest cell migration, microcephaly, situs
    inversus and renal cystogenesis, with short, absent or disorganised cilia.
    This is the only model that reproduces the malformation arm of the human
    phenotype.
  modeled_mechanisms:
  - target: Wnt pathway imbalance and defective ciliogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model in which the Wnt and ciliary mechanism was established, and in
      which it is linked to organ-level malformation.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because the perturbation is loss of
      function in a fish, whereas every human patient carries a homozygous
      missense allele with residual protein, and because two of the fish
      phenotypes - situs inversus and renal cystogenesis - are not reported in
      the human syndrome. Nothing has been shown in patient tissue: no human
      sample has been examined for either the Wnt shift or the ciliary defect.
    evidence:
    - reference: PMID:24503721
      reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we demonstrate that loss of Fto results in short, absent or disorganised cilia leading to situs inversus, renal cystogenesis, neural crest cell defects and microcephaly in Zebrafish.
      explanation: >-
        The organ-level phenotypes the ciliary defect produces in this model,
        including microcephaly, which the human syndrome shares.
  - target: Failure of central nervous system and cardiovascular development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Craniofacial dysmorphism, growth retardation and microcephaly in the fish
      correspond to human features; no cardiac malformation is reported in the
      model.
    limitations: >-
      The cardiovascular half of this node has no counterpart in the fish
      phenotype as reported, and the fish also shows situs inversus and renal
      cystogenesis, which the human syndrome does not. The correspondence is
      partial in both directions.
    evidence:
    - reference: PMID:24503721
      reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that loss of Fto leads to developmental defects such as growth retardation, craniofacial dysmorphism and aberrant neural crest cells migration in Zebrafish.
      explanation: >-
        The developmental features that do correspond to the human phenotype.
  evidence:
  - reference: PMID:24503721
    reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, we present the first evidence that FTO plays a role in development and cilia formation/function.
    explanation: >-
      The claim this model is informative for, stated by its authors.
- name: Fto-null mouse
  species: Mouse
  genotype: Fto knockout
  publication: PMID:19234441
  description: >-
    Global Fto knockout mice are viable and show postnatal growth retardation
    with reduced adipose and lean mass. They were made to test FTO's role in
    energy homeostasis, not to model this disease.
  modeled_mechanisms:
  - target: Failure of central nervous system and cardiovascular development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The null mouse reproduces the growth-failure arm of the human phenotype and
      not the malformation arm.
    limitations: >-
      Homozygous Fto-null mice are viable and their reported phenotype is growth
      retardation with altered body composition and energy expenditure. No central
      nervous system or cardiovascular malformation is reported, and the animals
      do not show the early lethality that defines the human index pedigree. The
      mouse is also a complete null, whereas every human patient carries a
      missense allele retaining some protein, so the comparison is not
      allele-matched in either direction.
    evidence:

progression:
- phase: Early childhood mortality
  age_range: First 30 months of life in the index pedigree
  notes: >-
    In the index consanguineous pedigree every affected child died within the
    first 30 months. That is not the outcome across the reported series: the 2016
    patient was alive at about 24 months and the 2023 patient at 16 months,
    ventilator-dependent. So the MONDO label "lethal polymalformative syndrome"
    describes the index family rather than the whole published series, and the
    OMIM title, which names early death without asserting uniform lethality, is
    closer to what has been reported. No survival analysis is possible from a
    dozen patients across five families, and none is attempted here.

    Mortality is recorded here rather than as a phenotype because HP:0003819
    ("Death in childhood") sits under Age of death, within Clinical modifier,
    rather than under Phenotypic abnormality, and so is not a valid
    phenotype_term in this schema. The same reasoning is recorded in
    DTYMK-Related_Neurodegeneration and
    Neurodevelopmental_Disorder_with_Epilepsy_Spasticity_and_Brain_Atrophy.
  evidence:
  - reference: PMID:26740239
    reference_title: A patient with a novel homozygous missense mutation in FTO and concomitant nonsense mutation in CETP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all affected individuals, death occurred within the first 30 months of life.
    explanation: >-
      The lethality observed in the index pedigree, quoted from a later paper's
      summary because the index report's own abstract does not state age at
      death.
  - reference: PMID:26378117
    reference_title: Identification of a pathogenic FTO mutation by next-generation sequencing in a newborn with growth retardation and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated a 21-month-old girl who presented distinctive facial features, failure to thrive, global developmental delay, left ventricular cardiac hypertrophy, reduced vision and bilateral hearing loss.
    explanation: >-
      A patient alive and being investigated at 21 months, which is why uniform
      early lethality is not asserted for the disease.

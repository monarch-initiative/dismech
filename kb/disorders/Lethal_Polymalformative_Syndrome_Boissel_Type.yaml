  evidence:
  - reference: PMID:26378117
    reference_title: Identification of a pathogenic FTO mutation by next-generation sequencing in a newborn with growth retardation and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated a 21-month-old girl who presented distinctive facial features, failure to thrive, global developmental delay, left ventricular cardiac hypertrophy, reduced vision and bilateral hearing loss.
    explanation: >-
      Records failure to thrive in the second reported family.
  - reference: PMID:26740239
    reference_title: A patient with a novel homozygous missense mutation in FTO and concomitant nonsense mutation in CETP.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected family members suffered from postnatal growth retardation, head and face dysmorphisms, severe psychomotor delay, functional cognitive deficits, and, in some patients, brain malformations, cardiac defects, genital abnormalities, and cleft palates.
    explanation: >-
      A later paper's summary of the index pedigree's phenotype, cited because
      the index report's own abstract does not enumerate features. Evidence source

        Here we show that the loss of Fto in mice leads to postnatal growth retardation and a significant reduction in adipose tissue and lean body mass.
      explanation: >-
        The full reported phenotype of the null mouse, which contains the growth
        arm and not the malformation arm. The absence of malformation is what
        makes this a failure to recapitulate this node.
  evidence:
  - reference: PMID:19234441
    reference_title: Inactivation of the Fto gene protects from obesity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The leanness of Fto-deficient mice develops as a consequence of increased energy expenditure and systemic sympathetic activation, despite decreased spontaneous locomotor activity and relative hyperphagia.
    explanation: >-
      What the model was built to show, which is an energy-homeostasis mechanism
      rather than a developmental one.
discussions:
- discussion_id: controversy_fto_gene_disease_validity_split
  prompt: >-
    Is the FTO-MONDO:0013050 gene-disease relationship established? Four GenCC
    submitters classify it as Strong, Strong, Supportive and Limited.
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#FTO
  - pathophysiology#Biallelic FTO missense variant
  rationale: >-
    The disagreement is real and is recorded rather than resolved, but it is worth
    stating precisely what it is. Reading the GenCC submissions, the split tracks
    how much of the literature each submission counted, not a disagreement about
    the same evidence: the two Strong submissions cite five and ten PMIDs
    including the 2016 reports, while the Supportive and Limited submissions each
    cite only the 2009 index report, and the Limited classification is dated 2015,
    before two of the five published families were reported. There is no ClinGen
    gene-disease validity curation. What would settle it is a formal ClinGen
    curation counting all five families and the four independently
    characterised alleles; this entry does not pre-empt that, and describes the
    relationship as reported rather than as definitive.
  notes: >-
    GenCC classifications were read from the submissions export on 2026-09-03.
    They cannot be carried as evidence items because no reference prefix in this
    repository resolves a GenCC submission, so they live in external_assertions.
- discussion_id: interpretation_fto_obesity_locus_is_a_different_molecule
  prompt: >-
    Is the large FTO obesity literature relevant evidence for this disease?
  kind: INTERPRETATION
  status: RESOLVED
  resolution_note: >-
    No. It is evidence about a different molecule and should not be cited here.
  attaches_to:
  - genetic#FTO
  rationale: >-
    Recorded because it is the retrieval trap this entry exists inside, and
    because the next curator will hit it. Searching FTO returns overwhelmingly
    the common intron-1 variants associated with body mass index. Those variants
    do not act on FTO protein function: the obesity-associated interval is a
    long-range regulatory landscape for the neighbouring homeobox genes IRX3 and
    IRX5, and the obesity-associated SNPs correlate with IRX3 expression rather
    than FTO expression in human brain. So an obesity-locus citation is not weak
    evidence for this disease; it is evidence about a regulatory element that
    happens to sit inside this gene. This is marked RESOLVED rather than OPEN
    because the question has an answer, and the answer is what governed which
    citations this entry accepts.
  evidence:
  - reference: PMID:24646999
    reference_title: "Obesity-associated variants within FTO form long-range functional connections with IRX3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with this, obesity-associated single nucleotide polymorphisms are associated with expression of IRX3, but not FTO, in human brains.
    explanation: >-
      The cleanest statement of the point: the obesity variants track IRX3
      expression and not FTO expression. This is why an obesity citation cannot
      support a claim about FTO protein function.
  - reference: PMID:26287746
    reference_title: "FTO Obesity Variant Circuitry and Adipocyte Browning in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The rs1421085 T-to-C single-nucleotide variant disrupts a conserved motif for the ARID5B repressor, which leads to derepression of a potent preadipocyte enhancer and a doubling of IRX3 and IRX5 expression during early adipocyte differentiation.
    explanation: >-
      The mechanism worked out to the level of a single base and a repressor
      motif, confirming the obesity association operates through IRX3 and IRX5
      rather than through FTO.
- discussion_id: gap_fto_substrate_responsible_for_malformation
  prompt: >-
    Which FTO demethylase activity does the malformation phenotype depend on -
    3-methylthymidine in single-stranded DNA, N6-methyladenosine in mRNA, or
    something else?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of FTO 2-oxoglutarate-dependent demethylase activity
  rationale: >-
    The assay used has changed with the field rather than with the disease. The
    2009 index report assayed 3-methylthymidine turnover in single-stranded DNA,
    following the 2007 characterisation of FTO, and predates the 2011
    identification of FTO as the first mRNA m6A demethylase. The 2023 report
    assayed m6A. No study has tested which activity the developmental phenotype
    requires, and the alleles do not separate the question because they reduce
    both. This matters for whether the disease belongs with the epitranscriptomic
    disorders or with the nucleic-acid repair dioxygenases, which are different
    mechanistic neighbourhoods, and it is the reason no module conformance is
    declared on the enzymatic node.
  proposed_experiments:
  - experiment_id: exp_fto_substrate_separating_alleles
    name: Substrate-separating FTO allele series in a developmental model
    description: >-
      Identify or engineer FTO variants that dissociate m6A RNA demethylase
      activity from 3-methylthymidine DNA demethylase activity, then express each
      in a human developmental model alongside the patient alleles and a null,
      and compare transcriptome-wide m6A, DNA methyl-lesion burden, and
      developmental readouts.
    would_support:
    - pathophysiology#Loss of FTO 2-oxoglutarate-dependent demethylase activity
    supporting_outcome:
    - >-
      A developmental phenotype tracking one activity and not the other would
      identify the substrate the disease depends on and would let the enzymatic
      node be bound to a specific molecular function rather than the generic
      dioxygenase term.
    refuting_outcome:
    - >-
      A phenotype requiring loss of both activities would show the question is
      malformed and that FTO's developmental role is not reducible to one
      substrate.
    decision_criterion: >-
      Segregation of the developmental readout with one activity resolves the
      gap; a requirement for both leaves the enzymatic node correctly generic.
  evidence:
  - reference: PMID:17991826
    reference_title: The obesity-associated FTO gene encodes a 2-oxoglutarate-dependent nucleic acid demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that recombinant murine Fto catalyzes the Fe(II)- and 2OG-dependent demethylation of 3-methylthymine in single-stranded DNA, with concomitant production of succinate, formaldehyde, and carbon dioxide.
    explanation: >-
      The characterisation the 2009 index report's assay followed. Cited to date
      the state of knowledge, not as evidence about the disease.
  - reference: PMID:22002720
    reference_title: "N6-methyladenosine in nuclear RNA is a major substrate of the obesity-associated FTO."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report here that fat mass and obesity-associated protein (FTO) has efficient oxidative demethylation activity targeting the abundant N6-methyladenosine (m(6)A) residues in RNA in vitro.
    explanation: >-
      The later substrate identification that the 2023 report's assay follows.
      Cited to date the shift in what is measured, not as evidence about the
      disease.
- discussion_id: mismatch_fto_null_mouse_lacks_malformations
  prompt: >-
    Fto-null mice are viable with growth retardation and no reported central
    nervous system or cardiovascular malformation, while homozygous human
    missense carriers have a severe malformation syndrome. Is the difference
    species-specific, or an artefact of comparing a complete null with a
    hypomorphic missense allele?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of central nervous system and cardiovascular development
  - animal_models#Mouse
  - animal_models#Zebrafish
  rationale: >-
    The mouse reproduces the growth arm of the human phenotype and not the
    malformation arm, which is the arm this entry's central pathophysiology node
    asserts. The zebrafish, by contrast, does reproduce the malformation arm -
    growth retardation, craniofacial dysmorphism, microcephaly and neural crest
    defects - so the mismatch is not simply "no model shows malformations". It is
    that the two models disagree with each other, and the mouse disagrees with
    itself: the same Fto knockouts that show no reported CNS or cardiovascular
    malformation do show tissue-specific ciliary abnormality. Three readings are
    open and nobody has separated them. The developmental requirement for FTO may
    differ across species; the mouse comparison may be wrong in kind, since every
    human patient carries a missense allele with residual protein and no human
    null has ever been reported; or mouse malformations may simply not have been
    looked for, since the null was made and phenotyped to study energy
    homeostasis. The absence of any reported human null allele is itself notable
    and could mean complete FTO loss is not viable in humans. No knock-in animal
    carrying a patient missense allele has been reported in any species.
  proposed_experiments:
  - experiment_id: exp_fto_patient_allele_knockin_mouse
    name: Knock-in mouse carrying a patient FTO missense allele
    description: >-
      Generate mice homozygous for an orthologous R316Q or R96P allele and
      compare them with Fto nulls and wild-type littermates for survival, growth,
      brain and cardiac morphology, and craniofacial measurements.
    would_support:
    - pathophysiology#Failure of central nervous system and cardiovascular development
    supporting_outcome:
    - >-
      Malformations in the knock-in that are absent from the null would show the
      comparison, not the species, was the problem, and would make the missense
      alleles something other than simple loss of function.
    refuting_outcome:
    - >-
      A knock-in phenotype indistinguishable from the null, with no malformation
      in either, would locate the difference in the species and would mean mouse
      is not a usable model for the developmental arm of this disease.
    decision_criterion: >-
      Divergence between knock-in and null in malformation readouts resolves
      towards an allele-comparison artefact; convergence resolves towards a
      species difference.
  evidence:
  - reference: PMID:19234441
    reference_title: Inactivation of the Fto gene protects from obesity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the loss of Fto in mice leads to postnatal growth retardation and a significant reduction in adipose tissue and lean body mass.
    explanation: >-
      The reported null-mouse phenotype, which contains growth retardation and
      not malformation. This is the observation the mismatch rests on.
  - reference: PMID:24503721
    reference_title: Loss of FTO antagonises Wnt signaling and leads to developmental defects associated with ciliopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Congruently, Fto knockout mice display aberrant tissue specific cilia.
    explanation: >-
      The reason the mouse cannot simply be called uninformative: the same
      knockout does show a ciliary abnormality, which is the mechanism proposed
      for the malformations. What is absent is the malformation itself, or a
      report of anyone having looked.
datasets: []
clinical_trials: []
notes: >-
  The FTO obesity literature is not evidence about this disease, and the reason
  is stronger than scale. The common FTO variants associated with body mass index
  lie in intron 1 and act on the neighbouring developmental genes IRX3 and IRX5
  rather than on FTO protein function. So the large literature that a search for
  "FTO" returns is about a regulatory element that happens to sit inside this
  gene. A citation about the FTO obesity locus is not weak evidence for this
  disease; it is evidence about a different molecule. FTO already appears in
  seven other entries in this knowledge base and in every one of them it is a
  BMI or obesity susceptibility locus. Every citation in this entry was checked
  to confirm it concerns the coding-variant malformation syndrome. Two exceptions
  are cited deliberately and labelled as such: PMID:17991826 and PMID:22002720
  are FTO enzymology papers, cited only to date what was known about FTO's
  substrates when each disease report chose its assay, and PMID:19833892 is a
  lean-versus-obese sequencing survey, cited only because it independently
  characterised R322Q as catalytically dead and found inactive alleles
  heterozygously in unaffected adults.

  What is unknown and is not inferred. No prevalence, incidence, carrier
  frequency, or penetrance estimate exists. Every phenotype in this entry is
  recorded without a FrequencyEnum value: the counts available in the literature
  are intra-familial, mostly from the nine affected siblings of one pedigree, so
  a denominator drawn from them is a denominator for that family and not for the
  disease. Two features are explicitly single-patient observations and say so.

  The MONDO label overstates the outcome. "Lethal polymalformative syndrome"
  describes the index pedigree, where every affected child died within 30 months.
  Two later patients were alive past a year. The OMIM title, "growth retardation,
  developmental delay, coarse facies, and early death", is closer to the reported
  series, which is why it is recorded in external_assertions and why the
  Death in childhood phenotype description states the limit explicitly.

  What the review of the mechanism literature changed. The first pass of this
  entry had only the enzymatic and fibroblast-senescence nodes and treated the
  step from demethylase loss to malformation as entirely unfilled. Osborn 2014
  (PMID:24503721) does fill part of it: loss of Fto shifts the balance between
  canonical and non-canonical Wnt signalling and produces defective cilia, and in
  zebrafish that produces growth retardation, craniofacial dysmorphism,
  microcephaly and neural crest defects. That is curated as its own
  pathophysiology node and its own zebrafish model, with the edge into the human
  malformation node left as causal_link_type UNKNOWN: no patient tissue has been
  examined for either the Wnt shift or the ciliary defect, and the fish also
  shows situs inversus and renal cystogenesis, which the human syndrome does not.

  Modules considered and rejected. cellular_senescence is the obvious candidate
  and is not declared: the senescence result comes from one report and the
  proliferation half of it was contradicted by a second patient's fibroblasts.
  epigenetic_machinery_neurodevelopmental_dysregulation is scoped to chromatin
  writers, erasers and remodelers with a causal chain through chromatin state;
  FTO is an RNA demethylase and the chain would run through the transcriptome, so
  conforming would silently widen the module. oncometabolite_dioxygenase_inhibition
  shares the enzyme superfamily and the 2-oxoglutarate site but is reached from
  the opposite direction - metabolite-mediated inhibition of many dioxygenases in
  cancer, versus germline loss of one - and is a cross-reference rather than a
  conformance target.

treatments:
- name: Dolutegravir-Based Antiretroviral Therapy
  description: >-
    Combination antiretroviral therapy built around the second-generation
    integrase strand-transfer inhibitor dolutegravir, now the recommended
    first-line regimen and rolled out in the settings carrying most of the
    burden. It suppresses plasma virus below the limit of detection and halts
    progression, but does not clear the reservoir, so it is lifelong.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiretroviral therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dolutegravir
      term:
        id: CHEBI:76010
        label: dolutegravir
  target_mechanisms:
  - target: Integrase Strand Transfer into Host Chromatin
    treatment_effect: INHIBITS
    description: >-
      Dolutegravir blocks the strand-transfer step, so reverse-transcribed
      viral DNA is not inserted into host chromatin and no new provirus is
      established. It does nothing to proviruses already integrated, which is
      why the reservoir persists on therapy.
    evidence:
    - reference: PMID:36560595
      reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "To counteract these resistant mutants, second-generation INSTI drugs have been developed: Dolutegravir (DTG), Cabotegravir (CAB), and Bictegravir (BIC)."
      explanation: Identifies dolutegravir as a second-generation inhibitor of the step this link targets.
  evidence:
  - reference: PMID:29884404
    reference_title: "Dolutegravir for first-line antiretroviral therapy in low-income and middle-income countries: uncertainties and opportunities for implementation and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In studies from predominantly high-income settings, dolutegravir-based regimens had superior efficacy, tolerability, and durability compared with existing first-line regimens."
    explanation: The comparative basis for dolutegravir as first-line therapy, with the setting limitation stated in the same sentence.
  - reference: PMID:29884404
    reference_title: "Dolutegravir for first-line antiretroviral therapy in low-income and middle-income countries: uncertainties and opportunities for implementation and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Increasing access to viral load testing to monitor the effectiveness of dolutegravir remains crucial, but the best strategy to manage patients with viraemia is unclear."
    explanation: Records the monitoring requirement and an open management question, rather than presenting the regimen as settled.
- name: Lenacapavir Pre-Exposure Prophylaxis
  description: >-
    Long-acting pre-exposure prophylaxis: a capsid inhibitor given by
    subcutaneous injection every six months to people who are HIV-negative, to
    prevent acquisition. In a phase 3 trial in adolescent girls and young women
    it prevented every infection in the treated arm, which is the prevention
    counterpart of the treat-all policy rather than a treatment of established
    infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lenacapavir
      term:
        id: CHEBI:234519
        label: Lenacapavir
  dosing_interval: once every 26 weeks
  dosing_interval_days: 182.5
  evidence:
  - reference: PMID:39046157
    reference_title: Twice-Yearly Lenacapavir or Daily F/TAF for HIV Prevention in Cisgender Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "0 infections among 2134 participants in the lenacapavir group"
    explanation: The phase 3 PURPOSE-1 result establishing that twice-yearly lenacapavir prevented incident HIV in the treated arm.
  - reference: PMID:39046157
    reference_title: Twice-Yearly Lenacapavir or Daily F/TAF for HIV Prevention in Cisgender Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIV incidence with lenacapavir was significantly lower than background HIV incidence"
    explanation: States the efficacy comparison against the screened-population background incidence, the trial's primary efficacy measure.
- name: Voluntary Medical Male Circumcision
  description: >-
    A one-time surgical intervention that reduces the risk of female-to-male
    sexual HIV acquisition, deployed as a population prevention measure in
    high-burden settings rather than as a treatment of infection.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: voluntary medical male circumcision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:17321311
    reference_title: "Male circumcision for HIV prevention in men in Rakai, Uganda: a randomised trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Male circumcision reduced HIV incidence in men without behavioural disinhibition."
    explanation: The randomised trial's conclusion that circumcision lowers HIV acquisition in men, the basis for recommending it as prevention.
  - reference: PMID:17321311
    reference_title: "Male circumcision for HIV prevention in men in Rakai, Uganda: a randomised trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIV incidence over 24 months was 0.66 cases per 100 person-years in the intervention group and 1.33 cases per 100 person-years in the control group"
    explanation: Quantifies the acquisition-risk reduction behind the intervention, a halving of incidence over the trial period.
progression:
- phase: Established infection on no therapy
  notes: >-
    Ongoing replication with progressive CD4-positive T cell loss. This is the
    phase antiretroviral therapy is started in at diagnosis, regardless of CD4
    count, because progression tracks untreated replication.
  evidence:
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ART reduces plasma virus levels to below the clinical detection limit (20-50 copies of HIV-1 RNA/ml) and halts disease progression"
    explanation: The phase boundary this record describes, between untreated progression and suppressed disease.
- phase: Acquired immune deficiency syndrome
  notes: >-
    The phase reached when untreated CD4-positive T cell loss has progressed
    far enough for the AIDS-defining opportunistic infections and neoplasms
    to occur. Those are curated as separate diseases that cross-link here
    rather than being absorbed into this entry. The phase is reversible in
    the sense that suppression restores immune function and nearly removes
    the risk of entering it, which is why it is a phase of this disease
    rather than a separate one.
  evidence:
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated HIV replication causes progressive CD4(+) T cell loss and a wide range of immunological abnormalities, leading to an increased risk of infectious and oncological complications."
    explanation: The progression from untreated replication to the infectious and oncological complications that define this phase.
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Viral suppression enables immune recovery and the near elimination of the risk for developing acquired immune deficiency syndrome (AIDS)."
    explanation: Names acquired immune deficiency syndrome as the phase, and records that suppression nearly removes the risk of reaching it.
- phase: Virologically suppressed on therapy
  notes: >-
    Plasma virus below the limit of detection, progression halted, and the
    reservoir intact. Suppression is maintained only while therapy continues,
    which is what makes this a phase rather than a cure.
  evidence:
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HIV persists within the body despite successful suppression of virus replication with antiretroviral therapy (ART)."
    explanation: Defines this phase as suppression with persistence rather than clearance.
discussions:
- discussion_id: gap_hiv_reservoir_eradication
  prompt: >-
    What determines the size and composition of the latent reservoir, and can
    a reservoir maintained by immunological memory and clonal expansion be
    eradicated without eliminating the memory compartment that maintains it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Latent Reservoir in Resting Memory CD4-Positive T Cells
  rationale: >-
    The reservoir node records that persistence is maintained by normal memory
    physiology rather than by ongoing replication, which is precisely what
    makes cure hard: the processes to be targeted are the ones that provide
    immunological memory. The cited reviews state that effective eradication
    strategies and the means to measure their impact both require knowledge of
    the reservoir that is not yet available, and that proviral integration
    into growth-associated host genes may itself drive the proliferation
    sustaining it. A conforming entry should treat reservoir size as an
    observed quantity rather than a derived one.
  evidence:
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Constructing effective strategies for HIV eradication and measuring their impact will require a sophisticated knowledge of the HIV reservoir."
    explanation: States the gap as the field's own open requirement.
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recent evidence suggests that in some infected cells, proliferation is a consequence of proviral integration into host genes associated with cell growth."
    explanation: A candidate mechanism for reservoir maintenance that is stated as suggested rather than established.

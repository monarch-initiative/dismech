name: HIV Infectious Disease
disease_term:
  preferred_term: HIV infectious disease
  term:
    id: MONDO:0005109
    label: HIV infectious disease
category: Disease
creation_date: "2026-10-08T00:00:00Z"
description: >-
  Chronic infection by human immunodeficiency virus 1, a retrovirus whose
  defining feature is that it converts its RNA genome to DNA and splices that
  DNA into the host chromosome. Integration is what makes the infection
  lifelong: the provirus becomes part of the genome of a cell that may then
  return to a resting state, so a transcriptionally silent reservoir forms in
  resting memory CD4-positive T cells and is maintained by the ordinary
  physiology of immunological memory rather than by ongoing replication.
  Progressive depletion of CD4-positive T cells produces the immunodeficiency
  that defines AIDS, with opportunistic infection as its clinical expression.
  Antiretroviral therapy suppresses plasma virus below detection and halts
  progression, and first-line regimens are now built around an integrase
  strand-transfer inhibitor, but therapy does not clear the reservoir and
  viraemia rebounds rapidly after interruption. Forty million people were
  living with HIV in 2021.
notes: >-
  Overlap with Acquired_Immunodeficiency_Syndrome, unresolved. That entry
  exists, is bound to MONDO:0012268 AIDS, and models ten pathophysiology
  nodes that include persistent HIV infection and replication, progressive
  CD4 T-cell depletion, the persistent cellular reservoir and opportunistic
  infection susceptibility. This entry is bound to MONDO:0005109 and models
  the replication-and-reservoir chain and its treatment. The two therefore
  describe the same agent, the same reservoir and the same CD4 depletion
  from different starting points, and the boundary between them is not
  settled: under the infectious-disease ladder in design decisions section
  3e, AIDS is a phase of HIV infection rather than a separate disease, which
  would argue for one entry, while the two files were curated independently
  and neither is a subtype of the other as curated. Nothing here resolves
  that. Whether this entry stands, merges into Acquired_Immunodeficiency_Syndrome,
  or the two are separated along a stated axis is a lump/split decision a
  maintainer has to take. This note records the overlap from this side only:
  Acquired_Immunodeficiency_Syndrome carries no pointer back to this entry,
  and adding one belongs with whoever resolves the split, since that decision
  changes what the pointer should say.

  Scope and granularity. Acute infection, chronic infection and AIDS are
  phases of one disease under the infectious-disease ladder in design
  decisions section 3e, so they belong in `progression` rather than in
  separate entries. That section records the untreated, AIDS and
  virologically suppressed phases. It does not yet record acute or primary
  infection: none of the references cited here describes that phase in a
  quotable sentence, and the entry's scope note below already excludes the
  response to acute infection for the same reason. The AIDS-defining opportunistic infections and
  HIV-associated neoplasms are separate diseases that cross-link to this one;
  Cryptococcal_Meningitis, curated in the same session, is the worked example,
  and this entry does not absorb them.

  HIV-2 is deliberately not modelled. It is a distinct virus with lower
  transmissibility and slower progression, and the sources cited here are
  about HIV-1; whether it earns a separate entry or a subtype row is left
  open, and the agent block carries only the organism this entry's evidence
  describes.

  The entry is scoped to the replication-and-reservoir mechanism and its
  treatment, which is what the two modules it conforms to cover. Mucosal
  transmission biology, the innate and adaptive response to acute infection,
  immune activation as a driver of non-AIDS morbidity, and the
  HIV-tuberculosis interaction are all real and all absent: each needs its own
  sources rather than an extrapolation from these. The pathophysiology here
  therefore runs from reverse transcription to the reservoir and its
  consequences, and stops.

  Reverse transcriptase and protease inhibitors are not curated as separate
  treatments even though the regimen includes a nucleoside backbone. Modules
  for those targets exist, and a treatment record for each needs a source
  about that drug class rather than about the combination; the integrase
  inhibitor is curated because the trial and resistance literature cited here
  is specifically about it.
infectious_agent:
- name: Human immunodeficiency virus 1
  infectious_agent_term:
    preferred_term: Human immunodeficiency virus 1
    term:
      id: NCBITaxon:11676
      label: Human immunodeficiency virus 1
  description: >-
    A lentivirus of the Retroviridae whose replication cycle runs from entry
    into a CD4-positive target cell through reverse transcription of the RNA
    genome into DNA, integration of that DNA into host chromatin, and release
    of new infectious particles.
  evidence:
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "HIV replication is composed of many steps from the viral entry into the target cells to the release of newly infectious viral particles."
    explanation: The replication cycle whose integration step this entry's pathophysiology follows.
transmission:
- name: Sexual, blood-borne and vertical transmission
  description: >-
    Transmitted sexually, through blood and blood products including shared
    injecting equipment, and from mother to child in pregnancy, at delivery or
    through breastfeeding. The populations at risk differ by route, which is
    why treatment rollout in the settings carrying most of the burden has to
    work for women of reproductive age.
  evidence:
  - reference: PMID:29884404
    reference_title: "Dolutegravir for first-line antiretroviral therapy in low-income and middle-income countries: uncertainties and opportunities for implementation and research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "where most people with HIV are women of reproductive age, tuberculosis prevalence can be high, and access to viral load and HIV drug resistance testing is limited"
    explanation: Establishes the demographic shape of the epidemic in the settings carrying most of the burden, which the vertical route follows from.
pathophysiology:
- name: Reverse Transcription of the Viral RNA Genome
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "viral_integrase_inhibition#Reverse Transcription of the Viral RNA Genome into cDNA"
  description: >-
    After entry into a CD4-positive target cell, viral reverse transcriptase
    copies the RNA genome into double-stranded DNA. This is the step that
    makes the rest of the chain possible and the one the nucleoside backbone
    of therapy targets; the DNA it produces is the substrate integrase acts
    on.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: RNA-templated DNA biosynthetic process
    term:
      id: GO:0006278
      label: RNA-templated DNA biosynthetic process
  evidence:
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The reverse transcription (RT) step is the first to occur; it converts the viral RNA into a linear viral DNA molecule"
    explanation: States the step this node represents - reverse transcriptase converting the viral RNA genome into linear viral DNA - and that it is the first step of the cycle, which is what the trigger role records.
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following entry, reverse transcription of the viral RNA genome into DNA and integration of the resulting provirus into host cell DNA occur within hours"
    explanation: Names this node and the integration step it feeds, and puts the two within hours of entry, which is the edge below.
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The latent HIV reservoir is a natural consequence of the life cycle of HIV, with integration of HIV into the genomes of cells that are or later enter the resting state, resulting in transcriptionally quiescent provirus."
    explanation: States the dependency running through this node to integration and then to the reservoir, which is this entry's whole chain in one sentence.
  downstream:
  - target: Integrase Strand Transfer into Host Chromatin
    causal_link_type: DIRECT
    description: >-
      The viral DNA produced here is the substrate integrase inserts into the
      host chromosome.
- name: Integrase Strand Transfer into Host Chromatin
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "viral_integrase_inhibition#Integrase Strand Transfer into Host Chromatin"
  description: >-
    Viral integrase inserts the reverse-transcribed DNA into host chromatin,
    and the strand-transfer step is the point first- and second-generation
    integrase inhibitors block. It is a step unique to the retroviruses, which
    is what makes it a selective drug target rather than a shared one, and it
    is irreversible for the infected cell.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: viral genome integration into host DNA
    term:
      id: GO:0044826
      label: viral genome integration into host DNA
  evidence:
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Integrase Strand Transfer Inhibitors (INSTIs) are currently used as the most effective therapy in the treatment of human immunodeficiency virus (HIV) infections."
    explanation: Establishes this step as the target of the most effective current therapy, which is what the therapeutic_vulnerability role records.
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Therefore, INSTI compounds inhibit specifically the strand-transfer reaction and not the 3′ processing step"
    explanation: Names the specific reaction the inhibitor class blocks, which is the step this node represents and what makes it the therapeutic vulnerability rather than the 3 prime processing step before it.
  downstream:
  - target: Establishment of the Integrated Provirus
    causal_link_type: DIRECT
    description: >-
      A completed strand transfer leaves the provirus permanently in the host
      genome.
  - target: Integrase Inhibitor Resistance
    causal_link_type: DIRECT
    description: >-
      Selection pressure at this step is what resistance mutations in
      integrase respond to.
- name: Establishment of the Integrated Provirus
  role: effector
  biological_scale: CELLULAR
  conforms_to: "viral_integrase_inhibition#Establishment of the Integrated Provirus"
  description: >-
    The provirus becomes a permanent part of the infected cell's genome and is
    replicated with it. Integration is therefore not just a replication step
    but the commitment that makes the infection irreversible at the level of
    that cell, and it is also what positions the virus to become latent if the
    cell stops dividing.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: establishment of integrated proviral latency
    term:
      id: GO:0075713
      label: establishment of integrated proviral latency
  evidence:
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The latent HIV reservoir is a natural consequence of the life cycle of HIV, with integration of HIV into the genomes of cells that are or later enter the resting state, resulting in transcriptionally quiescent provirus."
    explanation: States integration into the host genome as this node's content, and the route from it to latency.
  downstream:
  - target: Latent Reservoir in Resting Memory CD4-Positive T Cells
    causal_link_type: DIRECT
    description: >-
      A provirus in a cell that is or becomes resting is transcriptionally
      silent, which is the reservoir.
  - target: Progressive CD4-Positive T Cell Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Untreated infection depletes CD4-positive T cells; this entry does not
      model the mechanisms, so the edge records the sequence rather than
      explaining it.
- name: Latent Reservoir in Resting Memory CD4-Positive T Cells
  role: effector
  biological_scale: CELLULAR
  conforms_to: "viral_latency_reservoir_persistence#Establishment of a Latent or Archival Viral Genome"
  description: >-
    Resting memory CD4-positive T cells carrying a transcriptionally quiescent
    provirus form a remarkably stable reservoir that is invisible both to the
    immune response and to antiretroviral drugs, which act on replication. Its
    stability is not explained by replenishment from new infection but by the
    normal physiology of immunological memory, including proliferation that
    clonally expands already-infected cells. Smaller cellular reservoirs exist
    beyond this compartment.
  cell_types:
  - preferred_term: resting memory CD4-positive T cell
    term:
      id: CL:0000813
      label: memory T cell
  biological_processes:
  - preferred_term: establishment of viral latency
    term:
      id: GO:0019043
      label: establishment of viral latency
  - preferred_term: viral latency
    term:
      id: GO:0019042
      label: viral latency
  evidence:
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The principal barrier to cure is a remarkably stable reservoir of latent HIV-1 in resting memory CD4(+) T cells."
    explanation: Names the cell type this node binds and the reservoir's significance.
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Stability does not appear to reflect replenishment from new infection events but rather normal physiologic processes that provide for immunologic memory."
    explanation: The mechanism of persistence, and the reason suppressing replication does not shrink the reservoir.
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Resting CD4 T cells comprise the majority of the latent reservoir, although new evidence points to additional, smaller cellular reservoirs of latent HIV."
    explanation: Confirms the dominant reservoir compartment while recording that it is not the only one.
  downstream:
  - target: Antiviral Suppression Without Reservoir Eradication
    causal_link_type: DIRECT
    description: >-
      A reservoir that replication-targeting drugs cannot reach is what
      survives otherwise effective therapy.
- name: Antiviral Suppression Without Reservoir Eradication
  role: intrinsic_resistance
  biological_scale: ORGANISM
  conforms_to: "viral_latency_reservoir_persistence#Antiviral Suppression Without Eradication of the Reservoir"
  description: >-
    Antiretroviral therapy drives plasma virus below the limit of detection
    and halts disease progression, yet the virus persists, because the drugs
    act on steps of replication that a quiescent provirus is not performing.
    This node is why therapy is lifelong rather than curative, and it
    separates virological suppression from cure as clinical states.
  biological_processes:
  - preferred_term: viral latency
    term:
      id: GO:0019042
      label: viral latency
  evidence:
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HIV persists within the body despite successful suppression of virus replication with antiretroviral therapy (ART)."
    explanation: States exactly what this node claims, that suppression is achieved while persistence is unaffected.
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ART reduces plasma virus levels to below the clinical detection limit"
    explanation: The suppression half of the node, measured as plasma viral load.
  downstream:
  - target: Viral Rebound on Treatment Interruption
    causal_link_type: DIRECT
    description: >-
      Because the reservoir is intact, removing suppression restores viraemia.
- name: Viral Rebound on Treatment Interruption
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "viral_latency_reservoir_persistence#Reactivation and Viral Rebound on Treatment Interruption"
  description: >-
    Stopping antiretroviral therapy is followed by rapid return of plasma
    viraemia from the reservoir, even after years of undetectable virus. This
    is the clinical demonstration that suppression is not cure.
  biological_processes:
  - preferred_term: release from viral latency
    term:
      id: GO:0019046
      label: release from viral latency
  evidence:
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, even with prolonged suppression of viral replication with ART, viremia rebounds rapidly after treatment interruption. Thus, ART is not curative."
    explanation: The rebound phenomenon this node records, and the conclusion drawn from it.
  - reference: PMID:30030793
    reference_title: HIV Persistence on Antiretroviral Therapy and Barriers to a Cure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HIV lurks in latent and active reservoirs, leading to rebound of virus spread if ART is interrupted."
    explanation: The same dependency stated independently, and the distinction between latent and active reservoirs.
- name: Pyroptotic Death of Abortively Infected Resting CD4-Positive T Cells
  role: driver
  biological_scale: CELLULAR
  description: >-
    Most CD4-positive T cells lost in lymphoid tissue are not the productively
    infected ones. Quiescent cells that HIV enters but cannot complete its
    cycle in die by caspase-1-mediated pyroptosis, an inflammatory programmed
    death that releases IL-1beta and other cytokines. Those signals recruit
    more susceptible cells to the site, so the death of bystander cells both
    drives the progressive CD4 loss and feeds the chronic immune activation
    that marks the disease.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: pyroptosis
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:24356306
    reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The remaining over 95% of quiescent lymphoid CD4 T cells die by caspase-1-mediated pyroptosis triggered by abortive viral infection."
    explanation: States that pyroptosis of abortively infected quiescent cells, not death of productively infected ones, accounts for the great majority of CD4 loss. Measured in ex vivo human lymphoid aggregate culture.
  - reference: PMID:24356306
    reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings are further supported by analysis of fresh lymph nodes from subjects infected with R5-tropic HIV, where caspase-1 and IL-1β are detected in the paracortical zone rich in resting CD4 T cells"
    explanation: Confirms the pyroptotic pathway in tissue from infected patients, with caspase-1 in the paracortical zone rich in resting cells, so the mechanism is not only an ex vivo artefact.
  - reference: PMID:24356306
    reference_title: Cell death by pyroptosis drives CD4 T-cell depletion in HIV-1 infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This death pathway thus links the two signature events in HIV infection-CD4 T-cell depletion and chronic inflammation-and creates a pathogenic vicious cycle in which dying CD4 T cells release inflammatory signals that attract more cells to die."
    explanation: Supports the self-amplifying loop in the node description, in which pyroptotic cytokine release recruits further cells to die.
  downstream:
  - target: Progressive CD4-Positive T Cell Depletion
    causal_link_type: DIRECT
    description: >-
      Pyroptosis of the much larger pool of abortively infected resting cells
      is the dominant quantitative contributor to the progressive fall in CD4
      count.
- name: Progressive CD4-Positive T Cell Depletion
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Untreated infection progressively depletes CD4-positive T cells, and the
    resulting immunodeficiency is what the AIDS-defining opportunistic
    infections exploit. Antiretroviral therapy halts progression, which is why
    therapy is now started at diagnosis regardless of the CD4 count rather
    than at a threshold.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell homeostasis
    term:
      id: GO:0043029
      label: T cell homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated HIV replication causes progressive CD4(+) T cell loss and a wide range of immunological abnormalities, leading to an increased risk of infectious and oncological complications."
    explanation: States the progressive CD4-positive T cell loss this node represents, and that untreated replication is what drives it.
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Viral suppression enables immune recovery and the near elimination of the risk for developing acquired immune deficiency syndrome (AIDS)."
    explanation: Supports the claim that therapy halts progression at this node rather than only slowing it.
  - reference: PMID:27382129
    reference_title: "The Latent Reservoir for HIV-1: How Immunologic Memory and Clonal Expansion Contribute to HIV-1 Persistence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Optimal patient outcomes are achieved by initiating combination antiretroviral therapy (ART) as soon infection is diagnosed, regardless of the CD4+ T cell count"
    explanation: The treat-at-diagnosis policy named in the last sentence of this node's description. It supports that clause alone, not the depletion itself.
  downstream:
  - target: Immunodeficiency
    causal_link_type: DIRECT
    description: >-
      Loss of CD4-positive T cells is the immunodeficiency that defines AIDS.
- name: Integrase Inhibitor Resistance
  role: adaptive_escape
  biological_scale: MOLECULAR
  conforms_to: "viral_integrase_inhibition#Integrase Strand-Transfer Inhibitor Resistance"
  description: >-
    Integrase mutations reduce susceptibility to strand-transfer inhibitors.
    First-generation agents select resistance readily and cross-resist
    extensively; second-generation agents are more robust but not immune, and
    R263K and G118R predominate in people who have not previously had an
    integrase inhibitor. Resistance is why the rollout of dolutegravir-based
    first-line therapy is paired with viral-load and resistance surveillance.
  notes: >-
    No biological process is bound here. The node was previously bound to
    GO:0009410 response to xenobiotic stimulus, which is defined as a change
    in the state or activity of a cell or organism as a result of a
    xenobiotic stimulus - an induced response. Integrase inhibitor resistance
    is not that: it is a selected change in the viral target protein that
    reduces inhibitor binding, present before the drug acts on it. Searched
    GO for drug resistance, response to drug and antiviral resistance terms;
    the nearest hits are GO:2001023 regulation of response to drug and its
    directional children, which describe regulating a drug response rather
    than a resistant target, and nothing in GO covers viral drug resistance.
    The module node this conforms to, viral_integrase_inhibition#Integrase
    Strand-Transfer Inhibitor Resistance, still carries GO:0009410.
  evidence:
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Raltegravir (RAL) and Elvitegravir (EVG), the first generation of INSTIs used successfully in clinical treatment, are susceptible to the emergence of viral resistance and have a high rate of cross-resistance."
    explanation: The first-generation resistance problem that motivated the second generation.
  - reference: PMID:36560595
    reference_title: Different Pathways Conferring Integrase Strand-Transfer Inhibitors Resistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, HIV is also able to develop resistance mechanisms against the second-generation of INSTIs."
    explanation: Records that the second generation is more robust rather than resistance-proof.
  - reference: PMID:31280314
    reference_title: A systematic review of the genetic mechanisms of dolutegravir resistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common INSTI resistance mutations in persons with VF on a dolutegravir-containing regimen were R263K, G118R, N155H and Q148H/R, with R263K and G118R predominating in previously INSTI-naive persons."
    explanation: The specific mutations this node names, from a systematic review of virological failure on dolutegravir.
phenotypes:
- name: Immunodeficiency
  category: Clinical
  description: >-
    Acquired immunodeficiency from CD4-positive T cell depletion, expressed
    clinically as the AIDS-defining opportunistic infections, which this
    knowledge base curates as separate diseases that cross-link here.
  phenotype_term:
    preferred_term: acquired immunodeficiency
    term:
      id: HP:0002721
      label: Immunodeficiency
  evidence:
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated HIV replication causes progressive CD4(+) T cell loss and a wide range of immunological abnormalities, leading to an increased risk of infectious and oncological complications."
    explanation: Names the immunological abnormality this phenotype records and the increased risk of infectious complications that expresses it clinically.
  - reference: PMID:27188527
    reference_title: HIV infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Viral suppression enables immune recovery and the near elimination of the risk for developing acquired immune deficiency syndrome (AIDS)."
    explanation: Names acquired immune deficiency syndrome as the state this phenotype reaches when untreated, and records that it is reversible on suppression.
prevalence:
- population: Worldwide, 2021
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 500.0
  notes: >-
    Forty million people living with HIV in 2021, normalized against a world
    population of about 8 billion. The figure to read is the absolute count in
    the evidence below, together with 1.65 million new infections and 718,000
    deaths in the same year; the rate here is a whole-population average over
    an epidemic that is highly concentrated geographically.
  evidence:
  - reference: PMID:39608393
    reference_title: "Global, regional, and national burden of HIV/AIDS, 1990-2021, and forecasts to 2050, for 204 countries and territories: the Global Burden of Disease Study 2021."
    supports: SUPPORT

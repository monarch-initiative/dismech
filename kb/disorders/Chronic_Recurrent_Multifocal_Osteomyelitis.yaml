    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some patients will develop sequalae which can include vertebral compression
      fractures"
    explanation: >-
      Names vertebral compression fracture as a documented sequela. No denominator is
      given, so no frequency band is asserted.

- category: Gastrointestinal

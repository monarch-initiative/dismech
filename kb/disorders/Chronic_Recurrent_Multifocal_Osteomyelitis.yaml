- category: Musculoskeletal
  name: Vertebral Compression Fracture
  description: >-
    The sequela that makes vertebral involvement the highest-stakes distribution in this
    disease. Curated as a phenotype rather than only as a treatment indication because it
    is structural and irreversible, and it occurs despite the otherwise good prognosis
    under experienced care.
  phenotype_term:

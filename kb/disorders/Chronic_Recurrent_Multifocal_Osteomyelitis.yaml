genetic:
- name: FBLIM1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: FBLIM1
    term:
      id: hgnc:24686
      label: FBLIM1
  association: >-
    The only susceptibility gene reported for sporadic CNO, and the reason the entry does
    not claim the disease has no genetic component - it has no established Mendelian
    cause, which is a different statement. Two biallelic hits in the filamin-binding
    domain were found by exome sequencing in unrelated South Asian patients. FBLIM1 is
    proposed to act as an anti-inflammatory brake on bone remodelling through regulation
    of RANKL activation, which places it on the same osteoclast arm the bisphosphonates
    target.
  evidence:
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the filamin-binding domain of the FBLIM1 gene were detected in unrelated
      CNO patients from South Asia"
    explanation: >-
      Establishes FBLIM1 as a reported CNO susceptibility gene. Curated as SUSCEPTIBILITY
      rather than causal: two unrelated probands is not an established Mendelian cause,
      and the review itself frames sporadic CNO as having no causal gene.

- name: IL10
  relationship_type: MODIFIER
  gene_term:
    preferred_term: IL10
    term:
      id: hgnc:5962
      label: IL10
  association: >-
    Promoter haplotypes at rs1800896/rs1800871/rs1800872 set IL-10 expression capacity,
    and IL-10 drives STAT3, which in turn regulates FBLIM1 - so the two genetic findings
    in this disease sit on one axis rather than two. The direction of the cohort finding
    is counterintuitive and is curated as reported: high-expression (GCC) haplotypes were
    the ones over-represented in CRMO, not low-expression ones.
  evidence:
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-10 expression is predetermined by genetic variants within the IL10
      proximal promoter region."
    explanation: Establishes the IL10 promoter haplotypes as determinants of IL-10 expression.
  notes: >-
    Two tensions are left visible rather than resolved. First, the entry curates IL-10
    production as DECREASED at the cellular level while this cohort reports
    over-representation of high-expression germline haplotypes; these are different
    measurements - monocyte output in disease versus promoter capacity - but the tension
    is real. Second, the review's own reconciliation, that low-expression carriers may
    present as other inflammatory conditions and so never be diagnosed as CNO, is
    explicitly flagged there as an unconfirmed hypothesis, so it is recorded as such and
    not curated as mechanism.

definitions:
- name: EULAR/ACR 2025 classification criteria for paediatric chronic nonbacterial osteomyelitis
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Jointly developed EULAR/ACR classification criteria for paediatric CNO. The structure
    mirrors the disease's diagnostic problem: an obligatory entry requirement of typical
    radiographic or MRI findings plus bone pain, then explicit exclusion of malignancy,
    infection, vitamin C deficiency and hypophosphatasia, and only then additive weighted
    scoring across five clinical domains (site and pattern of bone lesions, age at onset,
    coexisting conditions, fever) and four pathology/laboratory domains (bone biopsy
    findings if performed, anaemia, C-reactive protein, erythrocyte sedimentation rate).
    A total score of at least 55 classifies as CNO.

    These are classification criteria, developed for research cohort definition, not
    diagnostic criteria for individual patient care - a distinction the entry preserves
    because they are not interchangeable.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Weights and threshold were refined in a development cohort of 441 patients and
      tested in a separate validation cohort of 514 patients, achieving 82% sensitivity
      and 98% specificity. The high specificity relative to sensitivity is consistent with
      criteria built around exclusion.
    evidence:
    - reference: PMID:39966038
      reference_title: "EULAR/ACR classification criteria for paediatric chronic nonbacterial osteomyelitis (CNO)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The new criteria had a sensitivity of 82% and specificity of 98% in the
        validation cohort."
      explanation: Reports the validation performance in an independent cohort.
  evidence:
  - reference: PMID:39966038
    reference_title: "EULAR/ACR classification criteria for paediatric chronic nonbacterial osteomyelitis (CNO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new EULAR/ACR classification criteria for CNO require typical
      radiographic or magnetic resonance imaging findings and bone pain as an obligatory
      entry criterion and exclusion criteria of malignancy, infection, vitamin C
      deficiency, and hypophosphatasia, followed by additive weighted criteria in 5
      clinical (site of bone lesions, pattern of bone lesions, age at onset, coexisting
      conditions, fever) and 4 pathology/laboratory domains (bone biopsy findings if done,
      anaemia, C-reactive protein level, and erythrocyte sedimentation rate)."
    explanation: The full structure of the criteria, including entry, exclusion and scoring domains.
  - reference: PMID:39966038
    reference_title: "EULAR/ACR classification criteria for paediatric chronic nonbacterial osteomyelitis (CNO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refinement of weights and threshold score in a development cohort of 441
      patients and validation in another cohort of 514 patients"
    explanation: Documents the development and validation cohorts underlying the criteria.

diagnosis:
- name: Diagnosis of Exclusion
  description: >-
    Until the 2025 classification criteria there were no prospectively tested, widely
    accepted diagnostic criteria and no disease biomarker, so CNO was and largely remains
    a diagnosis of exclusion. Infection and malignancy are the two exclusions that matter
    most - a solitary lesion in particular can be indistinguishable from bacterial
    osteomyelitis or from a bone tumour without biopsy. The absence of a biomarker is not
    a gap in this entry's sourcing; it is a stated property of the disease.
  diagnosis_term:
    preferred_term: diagnosis of exclusion
  evidence:
  - reference: PMID:33870159
    reference_title: "Chronic nonbacterial osteomyelitis (CNO) and chronic recurrent multifocal osteomyelitis (CRMO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of prospectively tested and widely accepted diagnostic
      criteria or disease biomarkers, CNO remains a diagnosis of exclusion, and infections,
      malignancy and other differentials require consideration"
    explanation: >-
      States directly that CNO is a diagnosis of exclusion and names the differentials that
      must be considered.

- name: Radiographic and MRI Assessment
  description: >-
    Typical radiographic or MRI findings are an obligatory entry criterion for
    classification. Whole-body MRI additionally reveals clinically silent lesions, which
    is what establishes multifocality in a patient with one painful site.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39966038
    reference_title: "EULAR/ACR classification criteria for paediatric chronic nonbacterial osteomyelitis (CNO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new EULAR/ACR classification criteria for CNO require typical
      radiographic or magnetic resonance imaging findings and bone pain as an obligatory
      entry criterion"
    explanation: Establishes imaging as obligatory for classification.

treatments:
- name: Nonsteroidal Anti-Inflammatory Therapy
  description: >-
    First-line, and effective at least partially in most patients. Note the framing in the
    cited review: no medication is licensed for CNO at all, so every treatment listed here
    is used off-label. That is a property of the disease's evidence base rather than a
    gap in this entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Sterile Osteoinflammation
    treatment_effect: INHIBITS
    description: >-
      Anti-inflammatory therapy suppresses the sterile bone inflammation without
      addressing the upstream innate signalling defect.
    evidence:
    - reference: PMID:33870159
      reference_title: "Chronic nonbacterial osteomyelitis (CNO) and chronic recurrent multifocal osteomyelitis (CRMO)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most patients show at least some response to nonsteroidal anti-inflammatory
        drugs"
      explanation: Documents the first-line response that grounds this treatment link.
  evidence:
  - reference: PMID:33870159
    reference_title: "Chronic nonbacterial osteomyelitis (CNO) and chronic recurrent multifocal osteomyelitis (CRMO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, no medications are licensed for the use in CNO."
    explanation: >-
      Establishes that all pharmacotherapy in this disease is off-label, which is the
      context for every treatment curated here.

- name: Escalation Therapy
  description: >-
    For patients who do not respond adequately to NSAIDs: corticosteroids,
    disease-modifying anti-rheumatic drugs and cytokine-blocking agents. Corticosteroids
    control inflammatory activity quickly but rarely induce long-term remission, so they
    function as a bridge rather than as maintenance. Anti-TNF agents are reported to be
    highly effective in a significant percentage of patients, though every report is
    retrospective and small, which is why the evidence base - not the drug class - is the
    limiting factor here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33870159
    reference_title: "Chronic nonbacterial osteomyelitis (CNO) and chronic recurrent multifocal osteomyelitis (CRMO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "others require more aggressive treatment that can include corticosteroids,
      cytokine-blocking agents and/or bisphosphonates"
    explanation: Documents the escalation options used when NSAIDs are insufficient.
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In NSAID-refractory cases, treatment can be escalated with corticosteroids."
    explanation: >-
      Establishes corticosteroids as the first escalation step after NSAID failure.
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment with pamidronate or anti-TNF agents has been reported to be highly
      effective in a significant percentage of CNO/CRMO patients, inducing long-lasting
      remission in a large subset of patients"
    explanation: >-
      Documents reported anti-TNF efficacy in sporadic CNO/CRMO. Recorded explicitly
      because the same review reports the opposite for the monogenic mimic Majeed
      syndrome, and the two must not be conflated.

- name: Bisphosphonate Therapy
  description: >-
    Curated as its own node rather than folded into generic escalation because its target
    differs from the rest of the escalation ladder: bisphosphonates act on the
    osteoclast-mediated bone resorption arm rather than on cytokine signalling. It is
    prioritised where vertebral bodies are involved, which is also where the disease does
    its irreversible structural damage. As with every treatment here the evidence is
    retrospective and small - the cited review states plainly that large prospective
    trials to determine the best medication are lacking.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
  target_mechanisms:
  - target: Sterile Osteoinflammation
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonates suppress the osteoclastic bone resorption driven by the
      pro-inflammatory cytokine milieu, without correcting the upstream innate signalling
      defect.
    evidence:
    - reference: PMID:29080202
      reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "treatment with pamidronate or anti-TNF agents has been reported to be highly
        effective in a significant percentage of CNO/CRMO patients, inducing long-lasting
        remission in a large subset of patients"
      explanation: Grounds the therapeutic link between bisphosphonate exposure and remission.
  evidence:
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with vertebral body involvement and structural damage,
      aggressive treatment should be discussed initially, e.g., with bisphosphonates"
    explanation: >-
      Establishes vertebral involvement as the setting in which bisphosphonates are
      prioritised over stepwise escalation.

differential_diagnoses:
- name: Bacterial osteomyelitis
  description: >-
    The differential the disease is named against. Imaging and histology can look
    identical, and it is an explicit exclusion criterion in the 2025 classification
    criteria. Distinguishing them is what the entire diagnostic workup exists to do, and
    getting it wrong in either direction is harmful - antibiotics for CNO, or
    immunosuppression for an untreated infection.
  distinguishing_features:
  - No causative organism is isolated in CNO
  - CNO lesions do not respond to antibiotics
  - CNO is typically multifocal and symmetrical with a waxing and waning course
  evidence:
  - reference: PMID:39966038
    reference_title: "EULAR/ACR classification criteria for paediatric chronic nonbacterial osteomyelitis (CNO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exclusion criteria of malignancy, infection, vitamin C deficiency, and
      hypophosphatasia"
    explanation: Establishes infection as a formal exclusion criterion for classification.

- name: Malignancy involving bone
  description: >-
    Leukaemia and primary bone tumours can present with bone pain and lytic lesions in the
    same age group, and are the exclusion with the highest cost of error. Also a formal
    exclusion criterion.
  distinguishing_features:
  - Formal exclusion criterion in the EULAR/ACR classification criteria
  - Biopsy is included as a scoring domain when performed, largely to address this differential
  evidence:
  - reference: PMID:33870159
    reference_title: "Chronic nonbacterial osteomyelitis (CNO) and chronic recurrent multifocal osteomyelitis (CRMO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNO remains a diagnosis of exclusion, and infections, malignancy and other
      differentials require consideration"
    explanation: Names malignancy among the differentials requiring exclusion.

- name: Majeed syndrome
  description: >-
    A monogenic autoinflammatory syndrome (LPIN2) whose features include CRMO alongside
    congenital dyserythropoietic anaemia and, in some patients, a neutrophilic dermatosis.
    It is the reason a child with CRMO plus unexplained anaemia should be considered for
    genetic evaluation rather than treated as sporadic disease.
  distinguishing_features:
  - Majeed syndrome pairs CRMO with congenital dyserythropoietic anaemia from early infancy
  - Monogenic and inherited, versus sporadic CNO with no established causal gene
  - Onset is characteristically early with a lifelong course
  - >-
    Treatment response separates the two: Majeed is an IL-1-beta-mediated disease that
    responds to IL-1 blockade while TNF-alpha blockers have almost no effect, whereas in
    sporadic CNO/CRMO anti-TNF agents are reported to be highly effective in a significant
    percentage of patients
  evidence:
  - reference: PMID:29080202
    reference_title: "Chronic Recurrent Multifocal Osteomyelitis (CRMO): Presentation, Pathogenesis, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNFα blockers have almost no effect"
    explanation: >-
      Curated here, on the Majeed differential, because that is the disease this sentence
      is about - it sits inside the review's monogenic-syndromes section, several pages
      above the "Sporadic" CNO/CRMO section, which reports the opposite. The
      TNF-responsiveness asymmetry is a discriminating feature between the two, not a
      property of sporadic disease.
  - reference: PMID:20301735
    reference_title: "Majeed Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Majeed syndrome is characterized by: Chronic recurrent multifocal
      osteomyelitis (CRMO) that is of early onset with a lifelong course; and Congenital
      dyserythropoietic anemia (CDA)"
    explanation: >-
      Establishes the CRMO-plus-anaemia combination that distinguishes Majeed syndrome.
      Note this GeneReviews chapter is formally retired - see notes - so it is cited only
      for this stable definitional statement.

discussions:
- discussion_id: gap_crmo_molecular_pathophysiology_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Innate Immune Signalling Dysregulation
  prompt: >-
    What is the molecular defect in sporadic CNO/CRMO, and why does no single
    cytokine-blocking strategy define the disease the way IL-1 blockade defines its
    monogenic mimics?
  rationale: >-
    Both cited reviews state that the pathophysiology is not understood - one calls it
    "somewhat elusive", the other "not fully understood" - and neither identifies a causal
    gene for sporadic disease. What is established is downstream and cellular: monocytes
    show inflammasome activation and a pro- versus anti-inflammatory cytokine imbalance.
    The contrast with the monogenic mimics is the informative part. Majeed syndrome has a
    single defined cytokine dependency - it responds to IL-1-beta blockade and not to TNF
    blockade - and DIRA resolves on recombinant IL-1 receptor antagonist. Sporadic CNO has
    no such signature: NSAIDs, corticosteroids, anti-TNF agents and bisphosphonates are all
    reported effective in some patients and insufficient in others, and every report is
    retrospective with small numbers. That heterogeneity of response is what a mechanistic
    account has to explain, and it is equally consistent with one poorly characterised
    pathway and with sporadic CNO being several diseases under one name.
  proposed_experiments:
  - experiment_id: exp_cno_monocyte_pathway_stratification
    name: Stratify CNO monocyte signalling defects against treatment response
    description: >-
      Profile TLR4/MAPK/inflammasome signalling and cytokine output in monocytes from a
      prospectively followed CNO cohort, and score each patient's profile against their
      documented response to NSAIDs, corticosteroids, TNF blockade and bisphosphonates. The
      discriminating result is whether response tracks a signalling subgroup: if it does,
      sporadic CNO is more than one disease and should eventually be curated as such, and
      the retrospective series reporting partial efficacy for every agent are averaging
      over that structure. A prospective design is the point - the existing evidence base
      is explicitly retrospective and small.

notes: >-
  Dual identity. MONDO:0009813 carries xref HP:0002754, so this concept has both a
  disease and a phenotype identifier - the pattern the knowledge base handles as a
  "disease-like phenotype". It is curated here as a Disease, and HP:0002754 is used
  separately as the phenotype term for the bone lesions themselves. Both usages are
  deliberate rather than a conflation.

  No GeneReviews baseline applies. A GeneReviews search for chronic recurrent multifocal
  osteomyelitis returns exactly one chapter, PMID:20301735, which was fetched and read: it
  is "Majeed Syndrome" - a different, monogenic disease in which CRMO is one feature - and
  it is additionally marked "RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY". It is
  therefore not used as a phenotype baseline for sporadic CNO/CRMO. It is cited once, in
  the Majeed differential, for a definitional statement about that syndrome, with its
  retired status recorded there and here.

  Frequency bands are assigned only where the source gives a number. Inflammatory bowel
  disease and severe acne are each cited at 10%, which maps to OCCASIONAL. Bone pain
  carries no band because it is obligatory for classification rather than reported as a
  proportion; osteomyelitis and vertebral compression fracture carry none because the
  reviews describe them qualitatively.

  Category is Complex rather than Mendelian: no causal gene is established for sporadic
  CNO/CRMO, and the monogenic diseases in which CRMO appears - Majeed syndrome, IL1RN
  deficiency - are curated as differentials rather than as subtypes of this entry.


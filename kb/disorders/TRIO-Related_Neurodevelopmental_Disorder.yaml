pathophysiology:
- name: TRIO GEFD1 Loss-of-Function and RAC1 Hypoactivation
  description: >
    TRIO encodes a RhoGEF whose first GEF domain (GEFD1) directly activates RAC1. In MRD44,
    missense variants clustering in GEFD1 (e.g. Arg1428Gln, Pro1461Thr) and truncating
    variants reduce TRIO-mediated activation of RAC1. Because RAC1 signaling drives
    actin-cytoskeleton remodeling and neurite outgrowth, reduced activation impairs neuronal
    development and brain growth, consistent with the reduced brain size seen when Trio is
    deleted in the mouse nervous system.
  gene:
    preferred_term: TRIO
    description: >
      Rho guanine nucleotide exchange factor; GEFD1-domain missense and truncating variants
      reduce catalytic activation of RAC1 (loss of function).
    modifier: DECREASED
    term:
      id: hgnc:12303
      label: TRIO

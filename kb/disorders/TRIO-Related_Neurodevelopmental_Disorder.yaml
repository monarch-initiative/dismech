name: TRIO-Related Neurodevelopmental Disorder
creation_date: "2026-07-11T18:00:00Z"
category: Mendelian
description: >-
  TRIO-related neurodevelopmental disorder is an autosomal dominant
  neurodevelopmental condition caused by heterozygous pathogenic variants in
  TRIO (trio Rho guanine nucleotide exchange factor). TRIO is a large, highly
  conserved RhoGEF that uses its first GEF domain (GEFD1) to activate the small
  GTPase RAC1 (and RHOG) and its second GEF domain (GEFD2) to activate RHOA,
  thereby controlling actin cytoskeleton dynamics during neuronal migration,
  axon outgrowth and guidance, dendritic arborization, and synaptogenesis. The
  entry is curated as a single lumped disorder with two head-size subtypes
  because the opposing phenotypes are explained by one shared axis: the
  direction in which a variant perturbs TRIO-mediated RAC1 activity. Missense
  variants cluster into two hotspots with opposite functional consequences.
  Loss-of-function variants in the RAC1-activating GEFD1 (and protein-truncating
  variants across the gene) reduce RAC1 activation and are associated with
  milder intellectual disability and microcephaly (MRD44). Missense variants in
  the seventh spectrin repeat release autoinhibition and hyperactivate RAC1,
  producing more severe intellectual disability with macrocephaly (MRD63). A
  striking correlation is observed between RAC1 activation level and head size,
  so the same gene gives rise to two seemingly divergent clinical syndromes.
  Shared features across the spectrum include developmental delay, speech and
  language delay, a neurobehavioral phenotype (attention problems, autistic
  traits, aggression, stereotypies), and variable skeletal/hand and dental
  anomalies; seizures occur in a minority.
parents:
- Intellectual disability
- Neurodevelopmental disorder
notes: >-
  No single disease-level disease_term is assigned because TRIO-related disease
  is curated as a lumped entry spanning two distinct OMIM/MONDO entities that
  differ in the direction of effect on RAC1 and in head-size phenotype: MRD44
  (intellectual developmental disorder, autosomal dominant 44, with
  microcephaly; OMIM 617061; MONDO:0014892) and MRD63 (intellectual
  developmental disorder, autosomal dominant 63, with macrocephaly; OMIM 618825;
  MONDO:0032939). Both MONDO terms are recorded in mappings and on the
  corresponding subtypes. Initial curation scaffold created in response to issue
  issue 6107 (routed from lit-scan issue 6041); anchored on the genotype-phenotype cohort
  literature (Pengelly 2016, Schultz-Rogers 2020, Barbosa 2020) rather than the
  single-case seed lead.

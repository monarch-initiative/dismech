notes: >-
  TRIO-related neurodevelopmental disorder is a lumped, gene-anchored entry covering two
  distinct OMIM/MONDO disorders that share TRIO (hgnc:12303) causation but differ by variant
  class and direction of effect on RAC1: MRD44 (OMIM 617061; MONDO:0014892; microcephaly;
  GEFD1 loss-of-function / truncating variants -> RAC1 hypoactivation) and MRD63
  (OMIM 618825; MONDO:0032939; macrocephaly; seventh-spectrin-repeat and second-SH3-domain
  gain-of-function variants -> RAC1 hyperactivation). The top-level disease_term is anchored
  to the MRD44 MONDO class as the flagship/first-described TRIO disorder; each arm carries its
  own subtype_term. Head circumference tracks the level of RAC1 activation, making this a
  textbook example of opposite-direction, domain-specific genotype-phenotype correlation.
  Preclinical work suggests that pharmacological targeting of the TRIO-RAC1-PAK axis (e.g.
  PAK1 inhibition) could be an avenue for the RAC1-hyperactivation (macrocephaly) arm, but
  this is not an established therapy.

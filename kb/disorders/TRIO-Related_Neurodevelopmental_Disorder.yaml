    RAC1 activation and cause MRD44 (microcephaly); gain-of-function missense variants in
    the seventh spectrin repeat (recurrent Thr1075/Arg1078/Asn1080) and a second-SH3-domain
    variant hyperactivate RAC1 and cause MRD63 (macrocephaly). RAC1 activation level
    correlates with head size.

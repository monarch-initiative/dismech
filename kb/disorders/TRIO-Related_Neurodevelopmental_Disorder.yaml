name: TRIO-Related Neurodevelopmental Disorder
creation_date: '2026-07-11T12:00:00Z'
category: Mendelian
description: >
  TRIO-related neurodevelopmental disorder is an autosomal dominant condition caused by
  pathogenic variants in TRIO, which encodes a Rho-family guanine nucleotide exchange
  factor (RhoGEF) that activates the small GTPases RAC1 and RHOA and thereby controls
  actin cytoskeleton remodeling, neurite outgrowth, and dendritic spine / glutamatergic
  synapse morphogenesis during neuronal development. Distinct classes of variant modulate
  TRIO-mediated RAC1 activity in opposite directions, producing two clinically recognizable
  disorders with a striking genotype-phenotype correlation on head size. Loss-of-function
  and hypomorphic missense variants clustering in the first GEF domain (GEFD1, the
  RAC1-activating domain), together with truncating variants, reduce RAC1 activation and
  cause intellectual developmental disorder 44 with microcephaly (MRD44). In contrast,
  gain-of-function missense variants clustering in the seventh spectrin repeat, and a
  reported variant in the second SH3 domain, hyperactivate RAC1 and cause the more severe
  intellectual developmental disorder 63 with macrocephaly (MRD63). Both arms converge on
  dysregulated dendritic spine and glutamatergic synaptic development, producing
  intellectual disability, developmental delay, speech delay, and neurobehavioral features
  (autistic behavior, hyperactivity/ADHD, aggression, stereotypies), with head size
  tracking the direction of RAC1 dysregulation.

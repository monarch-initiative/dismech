discussions:
- discussion_id: gap_trio_hetero_model_headsize_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do heterozygous mouse models of NDD-associated TRIO variants faithfully
    reproduce the human variant-class-specific, RAC1-direction-dependent
    head-size phenotypes (microcephaly for GEFD1 loss-of-function vs
    macrocephaly for spectrin-repeat gain-of-function)?
  rationale: >-
    Complete Trio knockout is embryonic lethal and nervous-system-specific
    knockout mice show reduced brain size, so null models capture the
    loss-of-function/microcephaly arm but not the gain-of-function/macrocephaly
    arm. Recent heterozygous knock-in models of specific NDD variants show
    distinct, variant-dependent effects on behavior, brain size, and dendritic
    arbors, but their fidelity to the human genotype-phenotype correlation
    across both arms remains to be established.
  attaches_to:
  - pathophysiology#Seventh Spectrin Repeat Gain-of-Function and RAC1 Hyperactivation
  proposed_experiments:
  - experiment_id: exp_trio_allelic_knockin_headsize
    experiment_design: TARGETED_PERTURBATION
    name: Allelic heterozygous knock-in comparison of TRIO GEFD1 vs spectrin variants
    description: >-
      Compare occipitofrontal/brain size, cortical neuron output, dendritic
      arborization, and RAC1 activation across allelic heterozygous knock-in
      mice carrying GEFD1 loss-of-function versus seventh spectrin repeat
      gain-of-function TRIO variants, benchmarked against the human head-size
      and ID severity data.
- discussion_id: gap_trio_id_severity_asymmetry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is intellectual disability consistently more severe in individuals with
    seventh spectrin repeat (gain-of-function) variants than in those with GEFD1
    (loss-of-function) variants, despite both perturbing the same TRIO-RAC1
    axis?
  rationale: >-
    The cohort literature reports that ID severity is greater with spectrin
    variants than with GEFD1 variants, but the mechanistic basis for the
    asymmetry between hyper- and hypo-activation of RAC1 is not resolved.
  attaches_to:
  - pathophysiology#Impaired Dendritic and Synaptic Morphogenesis

- name: Impaired Dendritic and Synaptic Morphogenesis
  biological_scale: CELLULAR
  description: >-
    Both the hypo- and hyper-activation of RAC1 converge on abnormal actin-based
    remodeling of dendritic and synaptic structures. Dysregulated RAC1 control
    of actin polymerization at glutamatergic synapses disturbs dendritic
    arborization, spine morphogenesis, and excitatory synaptic transmission,
    providing a shared cellular substrate for the intellectual disability,
    speech delay, and neurobehavioral phenotype seen across TRIO-related disease
    despite the opposing head-size outcomes.

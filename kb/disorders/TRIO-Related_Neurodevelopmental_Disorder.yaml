genetic:
- name: TRIO
  gene_term:
    preferred_term: TRIO
    term:
      id: hgnc:12303
      label: TRIO
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous pathogenic variants in TRIO cause both MRD44 and MRD63. A
    genotype-phenotype correlation is defined by variant class and its
    direction of effect on RAC1 activity: (1) GEFD1 missense variants and
    protein-truncating (nonsense/frameshift) variants act by loss-of-function
    (reduced RAC1 activation) and associate with microcephaly and milder ID
    (MRD44); (2) seventh spectrin repeat missense variants act by
    gain-of-function (increased RAC1 activation via released autoinhibition) and
    associate with macrocephaly and more severe ID (MRD63). The reported
    p.Ile2580Phe second-SH3 case is retained as a proposed, unreplicated extension
    of the MRD63 arm rather than being folded into the established
    spectrin-repeat mechanism.
  evidence:
  - reference: PMID:32109419
    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first GEF domain (GEFD1) regulates RAC1 and RHOG activity, and the second GEF domain (GEFD2) regulates RHOA activity."
    explanation: Establishes TRIO domain architecture underlying the variant-class genotype-phenotype correlation.
  - reference: PMID:33167890
    reference_title: "Novel loss-of-function variants in TRIO are associated with neurodevelopmental disorder: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is hypothesized that missense variants in this domain cause hyperactivation of RAC1 leading to the observed macrocephaly phenotype"
    explanation: Documents the spectrin-domain gain-of-function hyperactivation-macrocephaly correlation.
  variants:
  - name: "NM_007118.4:c.7738A>T (p.Ile2580Phe), reported second SH3 domain"
    description: >-
      Novel missense variant reported in a male infant with developmental delay
      and macrocephaly and positioned by the authors in the second SH3 domain of
      TRIO. It is curated as a proposed extension of the MRD63/macrocephaly arm
      beyond the established seventh-spectrin-repeat hotspot, not as evidence for
      a new domain-level mechanism. The cached report does not document de novo
      occurrence and supplies no functional assay. Pathogenicity rests on
      bioinformatic prediction and three-dimensional protein modelling, so the
      classification is LIKELY_PATHOGENIC and no functional effect is asserted.
    clinical_significance: LIKELY_PATHOGENIC
    type: missense variant
    gene:
      preferred_term: TRIO
      term:
        id: hgnc:12303
        label: TRIO
    evidence:
    - reference: PMID:42421094
      reference_title: "Identification and growth features of developmental delay with macrocephaly caused by a novel TRIO variant affecting the second SH3 domain."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified a novel TRIO missense variant (NM_007118.4: c.7738 A >
        T, p.I2580F; chr5:14492781 A > T/hg19) in the patient, and the variant
        was positioned in the second Src homology 3 (SH3) domain.
      explanation: >-
        Primary report of the variant, its transcript-level and genomic
        coordinates, and the authors' domain assignment.
    - reference: PMID:42421094
      reference_title: "Identification and growth features of developmental delay with macrocephaly caused by a novel TRIO variant affecting the second SH3 domain."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Bioinformatic and three-dimensional protein modeling evidence all
        support the p.I2580F variant as likely pathogenic.
      explanation: >-
        Basis for the LIKELY_PATHOGENIC call. The assessment is in silico; no
        functional assay of GEF activity or Rho GTPase signalling was performed.

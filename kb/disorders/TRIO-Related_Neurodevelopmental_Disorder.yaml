- name: Seventh Spectrin Repeat Gain-of-Function and RAC1 Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    Missense variants clustering in the seventh spectrin repeat domain of TRIO
    disrupt the intramolecular autoinhibition of the GEF1 domain by the spectrin
    repeats, producing increased RAC1 activation with enhanced neurite outgrowth
    and lamellipodia formation. This TRIO-mediated RAC1 hyperactivation is
    proposed to underlie the macrocephaly and the more severe intellectual
    disability of the MRD63 arm, with a striking correlation observed between
    RAC1 activation level and head size.

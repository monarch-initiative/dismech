    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, all the variants we identified in the TRIO spectrin repeat (Thr1075Ile, Arg1078Trp/Gly/Gln, and Asn1080Ile) have a strong TRIO-activating effect, inducing hyperactivation of RAC1."
    explanation: Spectrin-repeat variants hyperactivate RAC1, the gain-of-function arm underlying the macrocephaly (MRD63) phenotype.
  - reference: PMID:42421094
    reference_title: "Identification and growth features of developmental delay with macrocephaly caused by a novel TRIO variant affecting the second SH3 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and the variant was positioned in the second Src homology 3 (SH3) domain."
    explanation: A novel TRIO missense variant (p.I2580F) in the second SH3 domain was identified in an infant with developmental delay and macrocephaly, extending the macrocephaly-associated variant landscape beyond the spectrin-repeat hotspot.
  downstream:
  - target: Dysregulated Dendritic Spine and Glutamatergic Synaptic Development
  - target: Excess Brain Growth and Macrocephaly
- name: Dysregulated Dendritic Spine and Glutamatergic Synaptic Development
  description: >
    Both loss- and gain-of-function TRIO variants converge on abnormal RAC1-dependent
    regulation of dendritic spine morphogenesis and glutamatergic synaptic transmission.
    Tight control of TRIO-RAC1 signaling is required for normal excitatory synapse
    formation and function; both under- and over-activation perturb glutamatergic
    neurotransmission and synaptic development, producing the shared neurodevelopmental
    impairment.
  cell_types:
  - preferred_term: Glutamatergic neuron

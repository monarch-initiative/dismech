    explanation: TRIO variants perturb glutamatergic synaptic transmission, linking RAC1 dysregulation to excitatory synaptic dysfunction as a shared mechanism.
  downstream:
  - target: Neurodevelopmental Impairment
- name: Reduced Brain Growth and Microcephaly
  description: >
    In the GEFD1 / loss-of-function (MRD44) arm, reduced RAC1 activation is associated with
    reduced brain growth and microcephaly. Head size tracks the direction of RAC1
    dysregulation: microcephaly is seen in essentially all individuals with GEFD1 variants.
  evidence:
  - reference: PMID:32109419
    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly, which is defined by a head circumference two SD below the mean, was seen in 100% of group 2 patients"
    explanation: Microcephaly is a defining feature of the GEFD1 (group 2) / MRD44 arm.
  - reference: PMID:32109419
    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mimicking a GEFD1 variant in Xenopus produces microcephaly"
    explanation: A GEFD1-type variant modeled in Xenopus tropicalis reproduces microcephaly, supporting the causal link between reduced TRIO/RAC1 activity and small head size.
- name: Excess Brain Growth and Macrocephaly
  description: >
    In the spectrin-repeat / SH3 gain-of-function (MRD63) arm, RAC1 hyperactivation is
    associated with excess brain growth and macrocephaly. The strong, recurrent
    genotype-phenotype correlation (multiple unrelated individuals with the same
    hyperactivating residue all showing macrocephaly) links RAC1 overactivation to
    increased head size.
  evidence:
  - reference: PMID:32109419
    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data show that the different RAC1 activation levels dependent on the mutation are well correlated to the head size of the affected individuals."
    explanation: Directly ties the level of RAC1 activation to head size, the mechanistic basis for the microcephaly/macrocephaly split.
- name: Neurodevelopmental Impairment
  description: >
    The shared clinical outcome of both arms: intellectual disability, developmental and
    speech delay, and neurobehavioral features. Severity is greater in the spectrin-repeat
    (macrocephaly) arm than in the GEFD1 (microcephaly) arm.
  evidence:
  - reference: PMID:32109419
    reference_title: "Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the level of intellectual disability was more severe among individuals with a pathogenic variant within the spectrin repeat domain (group 1) than in individuals with a variant in GEFD1 (group 2)."
    explanation: Establishes the severity gradient between the two arms of the disorder.

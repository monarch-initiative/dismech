    snippet: "For the GEFD1 mutants on which there have been functional studies, the majority show a reduction in TRIO-mediated activation of RAC1"
    explanation: GEFD1 missense variants reduce TRIO-mediated RAC1 activation, the loss-of-function arm underlying the microcephaly (MRD44) phenotype.
  - reference: PMID:27418539
    reference_title: "Mutations specific to the Rac1 GEF domain of TRIO cause intellectual disability and microcephaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "total knockout or specific deletion of Trio in the mouse nervous system is embryonically lethal; embryos display defects in brain organisation and reduced brain size."
    explanation: Loss of Trio in the mouse nervous system reduces brain size, supporting reduced RAC1 signaling as a mechanism for microcephaly.
  downstream:
  - target: Dysregulated Dendritic Spine and Glutamatergic Synaptic Development
  - target: Reduced Brain Growth and Microcephaly
- name: TRIO Spectrin-Repeat and SH3 Gain-of-Function and RAC1 Hyperactivation
  description: >
    In MRD63, missense variants clustering in the seventh spectrin repeat (recurrent
    Thr1075, Arg1078, Asn1080 residues) have a strong TRIO-activating effect, inducing
    hyperactivation of RAC1; a variant in the second SH3 domain has similarly been
    associated with macrocephaly. Although the spectrin repeats do not directly catalyze
    RAC1 exchange, these variants are thought to relieve intramolecular autoinhibition of
    GEFD1, so RAC1 hyperactivation remains GEFD1-dependent. Excess RAC1 signaling enhances
    neurite outgrowth and drives increased brain growth.
  gene:
    preferred_term: TRIO
    description: >
      Spectrin-repeat and second-SH3-domain missense variants relieve autoinhibition of
      GEFD1 and hyperactivate RAC1 (gain of function).
    modifier: INCREASED

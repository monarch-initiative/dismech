pathophysiology:
- name: TRIO GEF Regulation of RAC1 Signaling
  biological_scale: MOLECULAR
  description: >-
    TRIO is a Dbl-family Rho guanine nucleotide exchange factor and a major
    regulator of neuronal development. Through its first GEF domain (GEFD1) it
    catalyzes GDP-to-GTP exchange on RAC1 (and RHOG), while its second GEF
    domain (GEFD2) activates RHOA. By controlling RAC1 activity and actin
    cytoskeleton remodeling, TRIO governs neuronal migration, axon outgrowth and
    guidance, dendritic arborization, and excitatory synaptogenesis. Tight
    bidirectional control of TRIO-RAC1 signaling is required for normal cortical
    development, and pathogenic TRIO variants perturb this axis in opposite
    directions depending on the affected domain.
  genes:

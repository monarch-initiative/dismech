    explanation: >-
      Confirms the deficit in patient cells rather than only in recombinant
      protein, and adds reduced protein abundance to reduced specific activity.
- name: Reduced Hypusination of eIF5A
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: peptidyl-hypusine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0008612
      label: peptidyl-hypusine biosynthetic process
  description: >-
    The proximate biochemical defect. Hypusine exists nowhere else in the
    proteome, so DHPS has exactly one substrate and a reduction in its activity
    has exactly one direct consequence. In patient cells the effect is visible
    as a shift in which modified form of eIF5A predominates: less of the
    cytoplasmic hypusinated form, more of the nuclear acetylated form.
  downstream:
  - target: Impaired eIF5A-Dependent Translation Elongation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the p.Tyr305_Ile306del and p.Asn173Ser variants resulted in reduced hypusination of eIF5A compared to wild-type DHPS enzyme.
    explanation: >-
      Directly measures reduced eIF5A hypusination as the consequence of each
      patient allele.
  - reference: PMID:37333770
    reference_title: Deoxyhypusine synthase mutations alter the post-translational modification of eukaryotic initiation factor 5A resulting in impaired human and mouse neural homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observe a shift in the abundance of the post-translationally modified forms of eIF5A; specifically, an increase in the nuclear localized acetylated form (eIF5AAcK47) and concomitant decrease in the cytoplasmic localized hypusinated form (eIF5AHYP).
    explanation: >-
      Shows the defect is a redistribution between eIF5A's modified states in
      patient cells, not simply less total protein.
- name: Impaired eIF5A-Dependent Translation Elongation
  biological_scale: CELLULAR
  description: >-
    Hypusinated eIF5A binds the ribosome between the P and E sites and its
    hypusine side chain stabilises peptidyl-tRNA, letting the ribosome read
    through stalling motifs such as polyproline runs. Less hypusinated eIF5A
    therefore does not shut translation down globally; it biases which mRNAs
    are translated well, which is why the consequence is a specific set of
    proteins rather than general cell failure.
  biological_processes:
  - preferred_term: translational elongation
    modifier: DECREASED
    term:
      id: GO:0006414
      label: translational elongation
  downstream:
  - target: Altered Expression of Proteins Required for Neuronal Development
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34688659
    reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The hypusine side chain of eIF5A stabilizes the binding of the peptidyl tRNA to the 80S ribosome and facilitates peptide bond synthesis.
    explanation: >-
      The molecular role of hypusine on the ribosome. Graded OTHER because it is
      a statement of established biochemistry in the paper's introduction rather
      than a result the paper reports.
  - reference: PMID:39334388
    reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      suppressing ribosomal stalling by stabilizing tRNA-ribosomal P-site interaction, facilitating peptide bond formation for consecutive polyprolines and other tripeptide motifs
    explanation: >-
      Names the stalling motifs that make the effect sequence-selective rather
      than global. Graded OTHER for the same reason - review-style background.
- name: Altered Expression of Proteins Required for Neuronal Development
  biological_scale: CELLULAR
  description: >-
    In a brain-specific Dhps knockout mouse, ribosome profiling and quantitative
    mass spectrometry show the translation defect resolving into altered
    abundance of proteins needed for neuronal development and function. This is
    the step that turns a translational bias into a neurodevelopmental disease,
    and it is the best-evidenced step in the chain that is not from patient
    cells.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired Neurite Outgrowth and Neuronal Survival
    causal_link_type: DIRECT
  - target: Reduced GABAergic Interneuron Arborization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:37333770
    reference_title: Deoxyhypusine synthase mutations alter the post-translational modification of eukaryotic initiation factor 5A resulting in impaired human and mouse neural homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Generation and characterization of a mouse model with a genetic deletion of Dhps in the brain at birth shows that loss of hypusine biosynthesis impacts neuronal function due to impaired eIF5AHYP-dependent mRNA translation; this translation defect results in altered expression of proteins required for proper neuronal development and function.
    explanation: >-
      States the full step - hypusine loss, impaired eIF5A-dependent
      translation, altered neuronal protein expression - in a brain-specific
      mouse deletion.
- name: Impaired Neurite Outgrowth and Neuronal Survival
  biological_scale: CELLULAR
  description: >-
    Reducing hypusinated eIF5A pharmacologically or by RNAi attenuates neurite
    outgrowth and neuronal survival in neuronal cell culture. This is a cell
    biology result rather than a patient one, but it is the mechanism that makes
    a translation defect specifically neurodevelopmental.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34688659
    reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      a reduction of hypusinated eIF5A by using a DHPS inhibitor or DHPS RNAi attenuated neurite outgrowth and neuronal survival
    explanation: >-
      The cellular phenotype of reduced hypusination in neurons. Indirect:
      pharmacological and RNAi knockdown in PC12 cells and rat hippocampal
      culture, not patient alleles.
- name: Reduced GABAergic Interneuron Arborization
  biological_scale: TISSUE
  description: >-
    The zebrafish knockdown supplies a circuit-level explanation for the
    seizures that the mouse and cell work do not: inhibitory interneurons have
    reduced arborization, and the larvae show increased epileptiform activity.
    An excitation-inhibition imbalance arising from underdeveloped inhibitory
    connectivity is a coherent route from a translation defect to epilepsy.

    It is also the least direct claim in this entry. The lesion is a morpholino
    knockdown in zebrafish, and no comparable interneuron analysis has been done
    in the mouse model or in patient tissue.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39334388
    reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In dhps knockdown larvae, electrophysiological analysis showed increased epileptiform activity, and confocal microscopy analysis revealed reduced arborisation of GABAergic neurons.
    explanation: >-
      Pairs the electrophysiological and anatomical findings that make this a
      circuit mechanism. Indirect: morpholino knockdown in zebrafish larvae, not
      a patient allele in a mammal.

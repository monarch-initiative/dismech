    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:37333770
    reference_title: Deoxyhypusine synthase mutations alter the post-translational modification of eukaryotic initiation factor 5A resulting in impaired human and mouse neural homeostasis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deoxyhypusine synthase (DHPS) deficiency is a rare, autosomal recessive disorder characterized by biallelic pathogenic variants in the DHPS gene that are associated with neurodevelopmental issues including seizures, developmental delay/intellectual disability, and hypotonia.
    explanation: >-
      Establishes the deficits that developmental therapy addresses. Indirect:
      the paper characterises the phenotype, it does not evaluate therapy.
diagnosis:
- name: Exome or genome sequencing
  description: >-
    The only route to diagnosis. There is no metabolite biomarker, no newborn
    screen, and no clinically available hypusination assay - the eIF5A
    two-dimensional gel and enzyme assays that established the mechanism are
    research methods. A patient is identified by genotype and confirmed by
    phenotype fit, not the other way round.
  results: >-
    Biallelic DHPS variants, in practice c.518A>G p.(Asn173Ser) in trans with a
    near-null allele.
  evidence:
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing, we identified rare biallelic, recurrent, predicted likely pathogenic variants in DHPS segregating with disease in five affected individuals from four unrelated families.
    explanation: >-
      The diagnostic route by which every reported patient was found.
- name: Research-level assessment of eIF5A hypusination
  description: >-
    Not a clinical test, but the assay that would be needed to call a novel DHPS
    missense variant hypomorphic. Two-dimensional gel electrophoresis of
    patient-derived cells separates the hypusinated from the acetylated form of
    eIF5A and shows the shift between them.
  results: >-
    Decreased cytoplasmic hypusinated eIF5A with increased nuclear acetylated
    eIF5A; reduced recombinant enzyme activity for the tested allele.
  evidence:
  - reference: PMID:37333770
    reference_title: Deoxyhypusine synthase mutations alter the post-translational modification of eukaryotic initiation factor 5A resulting in impaired human and mouse neural homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observe a shift in the abundance of the post-translationally modified forms of eIF5A; specifically, an increase in the nuclear localized acetylated form (eIF5AAcK47) and concomitant decrease in the cytoplasmic localized hypusinated form (eIF5AHYP).
    explanation: >-
      The measurement this assessment would make, and the direction of the
      expected result.
differential_diagnoses:
- name: DOHH deficiency
  description: >-
    The sibling disorder at the next step of the same pathway. DOHH catalyses
    the hydroxylation that converts deoxyhypusine to hypusine, so biallelic DOHH
    variants stall eIF5A one step further along and produce a similar
    neurodevelopmental phenotype. Only sequencing separates them - and
    microcephaly is a listed core feature there while it appears in one of five
    DHPS patients.
  notes: >-
    Deliberately left without a disease_term. MONDO carries the DOHH gene
    (HGNC:28662) but a search of the 2026 release returned no disease term for
    the DOHH-related neurodevelopmental disorder, which was described only in
    2022. Rather than bind a plausible-looking neighbouring CURIE, the binding
    is omitted and the disorder is identified by gene and by the citation. Add
    the term when MONDO mints one.
  distinguishing_features:
  - Biallelic DOHH rather than DHPS
  - Accumulation of the deoxyhypusine intermediate rather than reduced deoxyhypusine formation
  - Microcephaly listed as a core feature
  evidence:
  - reference: PMID:35858628
    reference_title: "Bi-allelic variants in DOHH, catalyzing the last step of hypusine biosynthesis, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DOHH variants are associated with a neurodevelopmental phenotype that is similar to phenotypes caused by DHPS or EIF5A variants and includes global developmental delay, intellectual disability, facial dysmorphism, and microcephaly.
    explanation: >-
      States the phenotypic similarity to the DHPS disorder explicitly, which is
      what makes this a differential rather than a related curiosity.
  - reference: PMID:35858628
    reference_title: "Bi-allelic variants in DOHH, catalyzing the last step of hypusine biosynthesis, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      and a reduction in the hypusinated eIF5A in fibroblasts derived from affected individuals, providing biochemical evidence for deficiency of DOHH activity in cells carrying the bi-allelic DOHH variants.
    explanation: >-
      The biochemical demonstration of the DOHH defect in patient fibroblasts.
      The accompanying accumulation of deoxyhypusine-containing eIF5A, which is
      the feature that distinguishes DOHH deficiency from DHPS deficiency, is
      described in the differential's own text rather than quoted, because the
      source writes it with bracketed notation that the snippet matcher strips.
- name: EIF5A-related neurodevelopmental disorder
  description: >-
    The third member of the group, and the one with a different inheritance
    pattern: heterozygous de novo EIF5A variants affect the substrate itself.
    Facial dysmorphism is universal and microcephaly common in the reported
    patients, which is a somewhat stronger dysmorphic picture than DHPS
    deficiency.
  disease_term:
    preferred_term: Faundes-Banka syndrome
    term:
      id: MONDO:0859163
      label: Faundes-Banka syndrome
  distinguishing_features:
  - Heterozygous de novo EIF5A rather than biallelic DHPS
  - Facial dysmorphism in all reported patients
  - Microcephaly in the majority
  evidence:
  - reference: PMID:34688659
    reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the seven EIF5A variant patients, all display facial dysmorphism and five of them with microcephaly.
    explanation: >-
      The per-feature counts in the EIF5A cohort, quoted so the comparison with
      the DHPS counts in this entry is like for like.
experimental_models:
- name: Patient-derived DHPS cortical organoid with CRISPR-corrected isogenic control
  description: >-
    Cortical organoids grown from iPSCs reprogrammed from a patient carrying
    c.518A>G and c.1014+1G>A, alongside a double CRISPR-corrected isogenic line
    from the same patient. This is the entry's only human, patient-allele
    model, and the isogenic correction is what makes it informative: the control
    differs from the mutant at the two DHPS positions and nowhere else, so a
    difference between them is attributable to the alleles rather than to donor
    background.
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    iPSCs reprogrammed from a patient with biallelic DHPS variants
    (c.518A>G; c.1014+1G>A), with a double CRISPR-corrected isogenic line
    derived from the same patient as control.
  culture_system: Semi-guided cortical organoid protocol, suspension culture.
  publication: PMID:42239796
  modeled_mechanisms:
  - target: Altered Expression of Proteins Required for Neuronal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Mutant organoids are significantly smaller than their isogenic controls,
      which is a developmental phenotype in human neural tissue carrying the
      patient alleles.
    limitations: >-
      Organoid diameter is a gross morphological readout, not a measurement of
      which proteins are altered, so the model demonstrates that the alleles
      impair human neurodevelopment without identifying the mechanism at this
      node. The authors also state the system lacks vascularization, immune
      components and long-range connectivity, and models early development only.
    readouts:
    - name: Cortical organoid diameter
      target: Altered Expression of Proteins Required for Neuronal Development
      direction: DECREASED
      interpretation: >-
        Reduced growth of mutant organoids relative to the isogenic control.
      evidence:
      - reference: PMID:42239796
        reference_title: "A gene therapy strategy for Deoxyhypusine Synthase (DHPS) syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Significantly decreased organoid growth was observed in the mutants compared to controls, highlighting DHPS's role in neurodevelopment.
        explanation: >-
          The measurement behind this readout, in the isogenic comparison.
  evidence:
  - reference: PMID:42239796
    reference_title: "A gene therapy strategy for Deoxyhypusine Synthase (DHPS) syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we generated human brain organoids from patient-derived induced pluripotent stem cells (iPSCs) and their CRISPR-corrected isogenic controls.
    explanation: >-
      Establishes the model and its isogenic control, which is what makes it the
      human counterpart to the animal models below.
  notes: >-
    This is the system the entry's neuronal-selectivity knowledge gap calls for.
    It exists; what has not been done in it is ribosome profiling or an
    equivalent translational-output measurement, which is why that gap remains
    OPEN in narrowed form rather than being retired.

animal_models:
- name: Brain-specific Dhps knockout mouse (Emx1-Cre)
  species: Mouse
  genotype: Dhps conditional deletion driven by Emx1-Cre, from E9.5 in cortex and hippocampus
  publication: PMID:34688659
  description: >-
    Embryonic-onset deletion in cortex and hippocampus. It produces the most
    severe phenotype of the mouse series and establishes that DHPS is required
    for forebrain development, but it is a null in the affected tissue rather
    than a hypomorph.
  modeled_mechanisms:
  - target: Altered Expression of Proteins Required for Neuronal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Forebrain development is grossly defective, with reduced growth and
      premature death.
    limitations: >-
      Conditional null, not the hypomorphic genotype patients carry, and the
      phenotype is correspondingly far more severe than the human disease -
      gross forebrain defects and premature death against a static encephalopathy
      with preserved survival. The growth failure in particular is much worse
      than the short stature seen in two of four affected females.
    evidence:
    - reference: PMID:34688659
      reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The conditional deletion of Dhps or Eif5a by Emx1 promotor-driven Cre expression (E9.5, in the cortex and hippocampus) led to gross defects in forebrain development, reduced growth, and premature death.
      explanation: >-
        The phenotype of the embryonic-onset deletion.
- name: Postnatal hippocampal Dhps knockout mouse (Camk2a-Cre)
  species: Mouse
  genotype: Dhps conditional deletion driven by Camk2a-Cre, postnatal, mainly hippocampal CA1
  publication: PMID:34688659
  description: >-
    The more informative of the two mouse models for the human disease, because
    deleting after development separates the cognitive phenotype from the
    malformation. These animals develop normally and are still impaired on
    learning and memory.
  modeled_mechanisms:
  - target: Impaired Neurite Outgrowth and Neuronal Survival
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Postnatal deletion spares gross development but produces severe spatial
      and contextual learning and memory deficits.
    limitations: >-
      Still a null rather than a hypomorph, and restricted to hippocampal CA1,
      so it addresses learning and memory rather than the global developmental
      delay that defines the human disorder. It also says nothing about seizures,
      which are the other core feature.
    readouts:
    - name: Morris water maze and contextual learning performance
      target: Impaired Neurite Outgrowth and Neuronal Survival
      direction: DECREASED
      interpretation: >-
        Behavioural readout of hippocampal dysfunction after Dhps loss in
        otherwise normally developed animals.
      evidence:
      - reference: PMID:34688659
        reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          these KO animals exhibited severe impairment in spatial learning, contextual learning, and memory when subjected to the Morris water maze and a contextual learning test.
        explanation: >-
          The behavioural measurement behind this readout.
    evidence:
    - reference: PMID:34688659
      reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In both models, the Dhps-KO mice displayed more severe impairment than their Eif5a-KO counterparts.
      explanation: >-
        Worth recording because it is mechanistically informative rather than
        merely comparative: losing the modifying enzyme is worse than losing the
        substrate, which is hard to explain if the only consequence of DHPS loss
        is unhypusinated eIF5A.
- name: dhps morpholino knockdown zebrafish
  species: Zebrafish
  genotype: dhps exon2/intron2 splice-site antisense morpholino knockdown
  publication: PMID:39334388
  description: >-
    The only model that addresses the seizures. Knockdown larvae show
    epileptiform activity on electrophysiology together with reduced arborization
    of GABAergic interneurons, which is a circuit-level mechanism neither mouse
    model provides.
  modeled_mechanisms:
  - target: Reduced GABAergic Interneuron Arborization
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reduced inhibitory interneuron arborization with increased epileptiform
      activity, offering excitation-inhibition imbalance as the route to
      seizures.
    limitations: >-
      Morpholino knockdown rather than a genetic allele, with the usual
      off-target and transient-knockdown caveats and no stable mutant line. The
      knockdown is also dose-dependent and produces microcephaly, axis truncation
      and body curvature - a general developmental toxicity in which a specific
      interneuron phenotype is harder to attribute. Fidelity is recorded LOW for
      that reason, not because the finding is uninteresting.
    readouts:
    - name: GABAergic interneuron arborization
      target: Reduced GABAergic Interneuron Arborization
      direction: DECREASED
      interpretation: >-
        Anatomical correlate of the inhibitory deficit proposed to underlie the
        seizures.
      evidence:
      - reference: PMID:39334388
        reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          confocal microscopy analysis revealed reduced arborisation of GABAergic neurons
        explanation: >-
          The imaging measurement behind this readout.
    - name: Epileptiform electrophysiological activity
      target: Reduced GABAergic Interneuron Arborization
      direction: INCREASED
      interpretation: >-
        Functional correlate, measured in the same larvae as the anatomical
        deficit.
      evidence:
      - reference: PMID:39334388
        reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In dhps knockdown larvae, electrophysiological analysis showed increased epileptiform activity
        explanation: >-
          The electrophysiological measurement behind this readout.
    evidence:
    - reference: PMID:39334388
      reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings confirm that hypusination of eIF5A by DHPS is needed for early brain development, and zebrafish with an antisense knockdown of dhps model features of DHPS deficiency syndrome.
      explanation: >-
        The authors' own claim for the model - that it reproduces features of
        the syndrome - stated as "features of" rather than the syndrome itself.
  - target: Impaired eIF5A-Dependent Translation Elongation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Dose-dependent developmental delay and dysmorphology follow dhps
      knockdown, consistent with a translational deficit but not measured as one.
    limitations: >-
      No translational readout was measured in this model - no ribosome
      profiling, no polysome analysis, no hypusinated eIF5A quantification.
      The link to the translation node is inferred from the enzyme's known
      function rather than demonstrated here, which is why the relationship is
      partial and the fidelity low.
    evidence:
    - reference: PMID:39334388
      reference_title: "Deoxyhypusine synthase deficiency syndrome zebrafish model: aberrant morphology, epileptiform activity, and reduced arborization of inhibitory interneurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        dhps knockdown embryos exhibited dose-dependent developmental delay and dysmorphology, including microcephaly, axis truncation, and body curvature.
      explanation: >-
        The organism-level phenotype, including the non-specific features that
        limit what can be attributed to a translational mechanism.
discussions:
- discussion_id: gap_dhps_neuronal_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which mRNAs actually fail to be translated when hypusinated eIF5A is
    reduced in a human neuron, and is that set what makes the disease
    neurological rather than systemic?
  attaches_to:
  - pathophysiology#Impaired eIF5A-Dependent Translation Elongation
  - pathophysiology#Altered Expression of Proteins Required for Neuronal Development
  rationale: >-
    eIF5A is required in every cell, DHPS is ubiquitously expressed, and yet the
    disease is a static encephalopathy with largely preserved systemic health.
    The standing explanation is that eIF5A-dependent elongation is
    sequence-selective - polyproline and other stalling motifs - so reduced
    hypusination biases rather than abolishes translation, and neurons happen to
    depend on the biased-against transcripts. The brain-specific mouse knockout
    supports the shape of this with ribosome profiling and mass spectrometry, but
    the specific proteins have not been connected to the specific clinical
    features.

    The human system this gap originally called for now exists. Patient-derived
    iPSCs carrying the two DHPS alleles, with CRISPR-corrected isogenic controls,
    have been differentiated into cortical organoids, and the mutant organoids
    are significantly smaller - so a human, patient-allele, isogenically
    controlled neural model is available and shows a developmental phenotype.
    What has not been done in it is the measurement. No ribosome profiling or
    equivalent translational-output assay has been reported in that system, so
    the transcripts whose elongation actually fails in a human neuron carrying
    patient alleles remain unidentified, and the link from any particular
    protein to any particular clinical feature is still unmade. Until that
    measurement exists, the entry's central step is a mechanism class rather
    than a mechanism. Ribosome profiling of the existing patient-versus-isogenic
    organoid pair is the experiment.
- discussion_id: mismatch_dhps_null_models_vs_hypomorphic_disease
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every animal model of DHPS loss is a null or a knockdown, while every patient
    is a hypomorph with roughly a fifth of normal enzyme activity. Does the null
    phenotype describe the same disease?
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic DHPS Variants
  - animal_models#Brain-specific Dhps knockout mouse (Emx1-Cre)
  - animal_models#dhps morpholino knockdown zebrafish
  rationale: >-
    The mismatch is not incidental, it is forced: Dhps-null mice die as embryos,
    so a whole-animal model of complete loss cannot exist, and conditional nulls
    are what the field has instead. The consequence is a systematic severity gap
    that the literature itself notices - the mouse models show severe growth
    failure and premature death, while patients have a static encephalopathy with
    preserved survival and short stature in two of four females. The zebrafish
    knockdown adds a different problem: it is dose-dependent and produces axis
    truncation and body curvature alongside the interneuron phenotype, so the
    specific finding sits inside general developmental toxicity.

    There is also a result in the mouse series that no current model explains.
    Deleting Dhps produced more severe impairment than deleting Eif5a, in both
    the embryonic and the postnatal model. If the only consequence of losing DHPS
    were unhypusinated eIF5A, losing eIF5A itself should be at least as bad. It
    was not, which suggests either a second DHPS function or a contribution from
    eIF5A2, and neither has been followed up.

    A knock-in of p.Asn173Ser in trans with a null, in mouse, would test whether
    the hypomorphic state reproduces the human phenotype at the severity
    patients actually have.
  proposed_experiments:
  - experiment_id: exp_dhps_n173s_compound_heterozygous_knockin_mouse
    name: p.Asn173Ser / null compound heterozygous knock-in mouse
    description: >-
      Knock in the recurrent human missense allele at the orthologous murine
      residue and cross to a Dhps null allele, reproducing the patient genotype
      rather than a conditional null, then phenotype survival, growth, seizure
      susceptibility and learning into adulthood.
    would_support:
    - pathophysiology#Biallelic Hypomorphic DHPS Variants
    - pathophysiology#Reduced Deoxyhypusine Synthase Activity
    supporting_outcome:
    - >-
      Compound heterozygotes are viable with normal growth, show spontaneous or
      induced seizures and learning deficits, and have reduced hypusinated eIF5A
      - matching the human severity rather than the conditional-null severity.
    refuting_outcome:
    - >-
      Compound heterozygotes are unaffected, which would mean roughly a fifth of
      normal activity is sufficient in mouse and the human phenotype depends on
      something beyond residual enzyme activity.
  - experiment_id: exp_dhps_second_function_vs_eif5a2
    name: Test whether Dhps loss exceeds Eif5a loss because of a second substrate or eIF5A2
    description: >-
      Repeat the conditional deletions with an Eif5a/Eif5a2 double knockout arm,
      and search for non-eIF5A DHPS substrates by proteomics, to explain why
      Dhps-null animals were consistently worse than Eif5a-null animals.
    would_support:
    - pathophysiology#Reduced Hypusination of eIF5A
    supporting_outcome:
    - >-
      Eif5a/Eif5a2 double deletion is as severe as Dhps deletion, placing the
      excess severity on the redundant substrate rather than on a second DHPS
      function.
    refuting_outcome:
    - >-
      Dhps deletion remains more severe than combined substrate deletion, which
      would mean DHPS does something beyond hypusinating eIF5A and the entry's
      single-substrate framing is incomplete.
notes: >-
  Three notes for anyone working on this entry.

  The name is ambiguous in a way that matters for literature searching. DHPS is
  the gene symbol for deoxyhypusine synthase, and it is also the standard
  abbreviation for bacterial dihydropteroate synthase, the sulfonamide target,
  which has its own substantial literature and its own dismech mechanism module
  (bacterial_folate_synthesis_inhibition). A keyword search on DHPS returns
  both. Every reference in this entry was checked to be about the human enzyme.

  The frequency statements are quoted rather than paraphrased on purpose. With
  five patients, "four of five have clinical seizures" and "two of four affected
  females have short stature" are the actual evidence, and rounding them to
  "frequent" or "variable" would discard the only quantitative information the
  literature has. Note that the per-feature tally is quoted from a 2021 review of
  the cohort rather than from the founding clinical report, which did not break
  the features down that way.

  The model evidence is systematically about a more severe lesion than the
  disease. Every model is a null or a knockdown; every patient is a hypomorph
  with roughly 20 percent residual activity. This is recorded as a
  HUMAN_MODEL_MISMATCH rather than absorbed into the fidelity ratings, because
  the severity gap is structural - Dhps-null mice die as embryos, so the
  matching model does not exist and cannot simply be built as a null.

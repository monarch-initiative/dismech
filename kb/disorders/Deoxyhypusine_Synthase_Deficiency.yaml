genetic:
- name: DHPS
  association: Causal biallelic variant
  gene_term:
    preferred_term: DHPS
    term:
      id: hgnc:2869
      label: DHPS
  frequency: The only gene associated with this disorder.
  notes: >-
    Two things about interpreting a DHPS result.

    The recurrent allele matters more than its recurrence suggests. Every one of
    the five reported individuals carries c.518A>G p.(Asn173Ser) on one allele.
    That is not a founder effect established by haplotype - it has not been
    tested - but it does mean the disease as described is essentially the
    phenotype of one specific hypomorphic enzyme, and a patient with two
    different hypomorphs might look different.

    A biallelic-null genotype should not be expected and, if seen, should prompt
    a rethink. Dhps-null mice die as embryos, and the residual activity in
    reported patients comes from the missense allele. The name DHPS is also
    shared with bacterial dihydropteroate synthase, the sulfonamide target,
    which is a live source of literature-search confusion and has nothing to do
    with this gene.
  evidence:
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that rare biallelic variants in DHPS result in reduced enzyme activity that limits the hypusination of eIF5A and are associated with a neurodevelopmental disorder.
    explanation: >-
      The gene-disease claim in the authors' own words, phrased as they phrased
      it - "suggest" and "associated with", which is the strength appropriate to
      five individuals.
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypusine is formed post-translationally from lysine and is found in a single cellular protein, eukaryotic translation initiation factor-5A (eIF5A), and its homolog eIF5A2.
    explanation: >-
      Establishes that DHPS has exactly one substrate, which is why the gene's
      loss has such a narrow biochemical consequence. Graded OTHER: background
      biochemistry, not a result of this study.
treatments:
- name: AAV9-delivered DHPS gene replacement (preclinical)
  description: >-
    Preclinical only. There is no clinical trial and no treated patient. DHPS
    cDNA packaged in an AAV serotype 9 vector restored hypusination in
    patient-derived human cortical organoids, and in a brain-specific Dhps
    mouse knockout the same strategy restored growth and metabolic health and
    improved survival. Recorded because it is the only intervention reported to
    act on the entry's central mechanistic step rather than on a symptom, and
    because gene replacement is mechanistically coherent here: the patient
    alleles are hypomorphic and the enzyme has exactly one substrate, so adding
    functional enzyme addresses the defect directly.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Reduced Hypusination of eIF5A
    description: >-
      Restoring DHPS expression restores the hypusination step itself, which is
      the node the rest of the pathograph descends from.
    evidence:
    - reference: PMID:42239796
      reference_title: "A gene therapy strategy for Deoxyhypusine Synthase (DHPS) syndrome."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The gene therapy strategy successfully restored hypusination in human brain cells.
      explanation: >-
        The rescue is measured on the hypusination step this link targets, in
        human cells carrying the patient alleles.
  evidence:
  - reference: PMID:42239796
    reference_title: "A gene therapy strategy for Deoxyhypusine Synthase (DHPS) syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We assessed our gene therapy in a mouse model of brain-specific DHPS loss and successfully restored growth, metabolic health, and reduced premature death.
    explanation: >-
      The in vivo arm, and the reason this is recorded as a candidate therapy
      rather than a cell-culture observation. Indirect for the human disease on
      two counts the authors state themselves: the model is a brain-specific
      deletion rather than a hypomorph, and survival and growth in a mouse are
      not the clinical endpoints that matter in a static encephalopathy.
- name: Anti-seizure medication
  description: >-
    Symptomatic seizure control. No agent has been evaluated in this disorder
    and none is indicated by the mechanism; the choice is made on seizure
    semiology as it would be in any structural or genetic epilepsy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:34688659
    reference_title: "Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments in growth, viability, neurodevelopment, and cognitive functions in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      among the five DHPS variant patients, four have facial dysmorphism, one has microcephaly, and four have clinical seizures.
    explanation: >-
      Recorded as the basis for the indication - four of five patients have
      clinical seizures - rather than as evidence that any drug works. Indirect
      and deliberately so: no anti-seizure medication has been evaluated in this
      disorder.
- name: Developmental and rehabilitative therapy
  description: >-
    Physical, occupational and speech therapy for the motor and language
    impairment. Standard of care for a static encephalopathy, with no
    disorder-specific evidence.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:

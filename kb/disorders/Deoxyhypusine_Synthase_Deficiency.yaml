pathophysiology:
- name: Biallelic Hypomorphic DHPS Variants
  biological_scale: MOLECULAR
  description: >-
    A recurrent missense allele, c.518A>G p.(Asn173Ser), in trans with a
    near-null second allele - a splice-site change, an in-frame deletion
    p.(Tyr305_Ile306del), or a start-loss. The genotype is not incidental. The
    p.Asn173Ser enzyme retains roughly a fifth of normal activity while the
    in-frame deletion is inactive, so a patient's residual capacity comes almost
    entirely from the missense allele, and a patient homozygous for two nulls
    would not be born.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: DHPS
    term:
      id: hgnc:2869
      label: DHPS
  downstream:
  - target: Reduced Deoxyhypusine Synthase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37333770
    reference_title: Deoxyhypusine synthase mutations alter the post-translational modification of eukaryotic initiation factor 5A resulting in impaired human and mouse neural homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The splice site and initiation codon variants are predicted to disrupt proper DHPS protein synthesis and thus enzyme activity.
    explanation: >-
      Characterises the second allele in each patient as near-null, which is
      what makes the genotype hypomorph-over-null rather than simply biallelic.
      The variant-level detail is in the description; it is not quoted here
      because the source writes every allele with bracketed protein-change
      notation, which the snippet matcher strips before comparing.
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cDNA studies demonstrated that the c.1014+1G>A variant causes aberrant splicing.
    explanation: >-
      Confirms the splice allele's consequence at the RNA level rather than by
      prediction.
  - reference: PMID:30661771
    reference_title: "Recessive Rare Variants in Deoxyhypusine Synthase, an Enzyme Involved in the Synthesis of Hypusine, Are Associated with a Neurodevelopmental Disorder."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DHPS is also highly conserved and is essential for life, as Dhps-null mice are embryonic lethal.
    explanation: >-
      Supports the claim that the human alleles must be hypomorphic. Indirect:
      it is an inference from mouse lethality to what a surviving patient can
      carry, not a measurement in patients.

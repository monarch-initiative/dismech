name: Deoxyhypusine Synthase Deficiency
creation_date: "2026-09-11T11:40:00Z"
category: Mendelian
synonyms:
- DHPS deficiency
- DHPS deficiency syndrome
- NEDSSWI
- neurodevelopmental disorder with seizures and speech and walking impairment
description: >-
  Deoxyhypusine synthase deficiency is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic hypomorphic DHPS variants. It
  presents as a static encephalopathy with global developmental delay,
  intellectual disability and seizures, with variable hypotonia, microcephaly,
  short stature and mild facial dysmorphism.

  What makes it mechanistically unusual is the narrowness of the enzyme's job.
  DHPS catalyses the first committed step in making hypusine, an amino acid that
  exists in exactly one cellular protein: eukaryotic translation initiation
  factor 5A. Hypusination is what activates eIF5A, and eIF5A - despite its name
  - works mainly in translation elongation, stabilising peptidyl-tRNA on the
  ribosome so that stalling motifs such as polyproline runs can be read through.
  So a single missing post-translational modification on a single protein
  produces a disease of the developing brain.

  Every reported patient carries a hypomorphic combination, and that is a
  structural feature rather than ascertainment bias: Dhps-null mice are
  embryonic lethal, so complete loss of function cannot produce a living
  patient. All five individuals in the founding cohort shared the same
  recurrent missense allele, p.Asn173Ser, which retains roughly a fifth of
  normal activity, in trans with a near-null second allele.

  The disorder sits in a small family of conditions that converge on the same
  molecule: biallelic DOHH variants disable the second hypusination step, and
  heterozygous EIF5A variants disable the substrate itself, both producing a
  similar neurodevelopmental phenotype. It is also one of the polyaminopathies,
  which is how it relates to Bachmann-Bupp syndrome - an ODC1 gain-of-function
  disorder dismech already carries, upstream in polyamine metabolism but
  phenotypically distinct.

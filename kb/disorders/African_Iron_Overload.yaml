biochemical:
- name: Non-transferrin-bound Iron
  notes: Circulating NTBI was detected in a biopsy-characterized African dietary iron-overload study and associated with liver-test abnormalities after adjustment for hepatic iron grade, inflammation and diet. It is a candidate mediator of injury; the observational study does not demonstrate toxicity or establish a routine diagnostic threshold.
  evidence:
  - reference: PMID:10029292
    reference_title: Non-transferrin-bound iron and hepatic dysfunction in African dietary iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The independent relationship between NTBI and elevated liver function tests suggests that it may be part of a pathway leading to hepatic injury.
    explanation: The disease-specific study identifies an iron fraction associated with hepatic dysfunction, while retaining uncertainty about causality.

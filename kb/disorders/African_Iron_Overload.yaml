    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Indirect measurements of iron status (serum ferritin concentration and transferrin saturation) are useful in the diagnosis of African dietary iron overload.
    explanation: A biopsy-confirmed clinical series supports these measurements as diagnostic indicators.
- name: Hepatic Iron Assessment
  description: Liver histology can establish the distribution of iron and accompanying fibrosis; direct hepatic iron measurement documents tissue loading.
  evidence:
  - reference: PMID:10403742
    reference_title: Iron overload in urban Africans in the 1990s.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histological assessment, hepatocellular iron grading, and dry weight non-haem iron concentration were determined
    explanation: The study used direct tissue measurements to characterize hepatic iron loading.
treatments:
- name: Reduction of Dietary Iron Exposure
  action_category: THERAPEUTIC
  description: Fermenting traditional beer in iron-free containers reduces the avoidable dietary iron source. A prevention review specifically recommends this measure for African dietary iron overload; it does not quantify an intervention effect or establish reversal of existing organ injury.
  evidence:
  - reference: PMID:20526004
    reference_title: Prevention of hepatocellular carcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: in African dietary iron overload by fermenting the home-brewed beer in iron-free containers.
    explanation: The review identifies a disease-specific preventive measure that addresses the environmental iron source.
  target_mechanisms:
  - target: Systemic Iron Loading
    treatment_effect: INHIBITS
    description: Reducing the dietary iron source limits further iron loading.
- name: Therapeutic Phlebotomy
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  description: Iron depletion by phlebotomy is an approach to iron overload when clinically tolerated. The supporting review concerns iron overload generally and does not establish a controlled trial or a disease-specific schedule for African iron overload.
  evidence:
  - reference: PMID:7917009
    reference_title: Etiologies, consequences, and treatment of iron overload.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: aggressive therapy with phlebotomy or iron chelation to remove excess iron from the body prevents organ damage and prolongs life.
    explanation: General iron-overload treatment rationale; benefit and regimen are not quantified specifically for African iron overload.
  target_mechanisms:
  - target: Systemic Iron Loading
    treatment_effect: INHIBITS
    description: Removal of blood depletes excess body iron.
notes: This entry covers OMIM:601195 / MONDO:0011012 / ORPHA:139507. The historical name Bantu siderosis is retained only as a search synonym. Family segregation studies support a gene–environment contribution without identifying a definitive causal locus. HFE-related hemochromatosis and established SLC40A1-related ferroportin disorders remain separate entities. The 2026-09-10 Bookshelf snapshot contains no matching GeneReviews chapter (name and synonyms checked). Orphanet phenotype frequencies are source bands, not estimates inferred from the selected clinical series. Broad organ-abnormality rows and the nonspecific chronic-infection row are not modeled as specific manifestations. Viral hepatitis is treated as a potentially co-existing infection, not a consequence of iron overload; the separate Hepatitis annotation is retained without assigning its etiology. The Orphanet increased-cortisol row is deferred because the disease-specific 30-case/30-control study (PMID:14515008) found higher group means but values within reference ranges. This does not establish pathological hypercortisolism or universal absence of endocrine involvement.

biochemical:
- name: Non-transferrin-bound Iron
  notes: Circulating NTBI was detected in a biopsy-characterized African dietary iron-overload study and associated with liver-test abnormalities after adjustment for hepatic iron grade, inflammation and diet. It is a candidate mediator of injury; the observational study does not demonstrate toxicity or establish a routine diagnostic threshold.
  evidence:
  - reference: PMID:10029292
    reference_title: Non-transferrin-bound iron and hepatic dysfunction in African dietary iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The independent relationship between NTBI and elevated liver function tests suggests that it may be part of a pathway leading to hepatic injury.
    explanation: The disease-specific study identifies an iron fraction associated with hepatic dysfunction, while retaining uncertainty about causality.
progression:
- phase: Observed Clinical Outcomes
  description: In a selected cohort of 22 biopsy-confirmed subjects, six died during a median follow-up of 19 months. Mortality correlated with hepatic iron and serum ferritin concentrations.
  notes: This small clinical and family-study cohort does not provide a population survival estimate or establish that every death was caused by iron overload.
  evidence:
  - reference: PMID:10554633
    reference_title: Measurements of iron status and survival in African iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After a median follow-up of 19 months, 6 (26%) of the subjects had died.
    explanation: The study directly documents follow-up mortality in 22 subjects with biopsy-confirmed iron overload; the count is retained without generalizing its risk to all affected individuals.
- phase: Clinical Onset
  age_range: Adult to elderly
  evidence:
  - reference: ORPHA:139507
    reference_title: Dietary iron overload disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '- Age of onset: Adult'
    explanation: Orphanet records adult onset.
  - reference: ORPHA:139507
    reference_title: Dietary iron overload disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '- Age of onset: Elderly'
    explanation: Orphanet also records onset in older adults.
discussions:
- discussion_id: dietary-iron-and-tuberculosis
  kind: EMERGING_HYPOTHESIS
  prompt: Does increased dietary iron contribute to susceptibility to active pulmonary tuberculosis?
  rationale: A rural Zimbabwean case-control study associated dietary iron exposure with active tuberculosis (estimated odds ratio 3.5, 95% CI 1.4–8.9). This exposure association does not establish that African iron overload causes tuberculosis. The mortality association with dietary iron was not statistically significant (P=.2).
  evidence:
  - reference: PMID:11528590
    reference_title: Association of pulmonary tuberculosis with increased dietary iron.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings are consistent with the hypothesis that elevated dietary iron may increase the risk of active pulmonary tuberculosis.
    explanation: The authors frame the association as a susceptibility hypothesis, not proof of an infection phenotype caused by iron overload.
  - reference: PMID:8605366
    reference_title: "Associations of iron overload in Africa with hepatocellular carcinoma and tuberculosis: Strachan's 1929 thesis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Splenic iron was the variable most significantly associated with death from tuberculosis
    explanation: Reanalysis of historical necropsy data associated high splenic iron with tuberculosis death (odds ratio 16.9; 95% CI 4.8–59.9). Tissue iron at necropsy is a different exposure measure from dietary intake; selection and retrospective measurement limit causal inference.

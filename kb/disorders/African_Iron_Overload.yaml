    reference_title: Iron overload in Africa. Interaction between a gene and dietary iron content.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: increased iron was present in both hepatocytes and cells of the mononuclear-phagocyte system.
    explanation: Histology of the index subjects demonstrated mixed parenchymal and phagocyte iron deposition.

discussions:
- discussion_id: dietary-iron-and-tuberculosis
  kind: EMERGING_HYPOTHESIS
  prompt: Does increased dietary iron contribute to susceptibility to active pulmonary tuberculosis?
  rationale: A rural Zimbabwean case-control study associated dietary iron exposure with active tuberculosis (estimated odds ratio 3.5, 95% CI 1.4–8.9). This exposure association does not establish that African iron overload causes tuberculosis. The mortality association with dietary iron was not statistically significant (P=.2).
  evidence:
  - reference: PMID:11528590
    reference_title: Association of pulmonary tuberculosis with increased dietary iron.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings are consistent with the hypothesis that elevated dietary iron may increase the risk of active pulmonary tuberculosis.
    explanation: The authors frame the association as a susceptibility hypothesis, not proof of an infection phenotype caused by iron overload.

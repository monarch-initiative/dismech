treatments:
- name: Therapeutic Phlebotomy
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  description: Iron depletion by phlebotomy is an approach to iron overload when clinically tolerated. The supporting review concerns iron overload generally and does not establish a controlled trial or a disease-specific schedule for African iron overload.
  evidence:
  - reference: PMID:7917009
    reference_title: Etiologies, consequences, and treatment of iron overload.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: aggressive therapy with phlebotomy or iron chelation to remove excess iron from the body prevents organ damage and prolongs life.
    explanation: General iron-overload treatment rationale; benefit and regimen are not quantified specifically for African iron overload.
  target_mechanisms:
  - target: Systemic Iron Loading
    treatment_effect: INHIBITS
    description: Removal of blood depletes excess body iron.
notes: This entry covers OMIM:601195 / MONDO:0011012 / ORPHA:139507. The historical name Bantu siderosis is retained only as a search synonym. Family segregation studies support a gene–environment contribution without identifying a definitive causal locus. HFE-related hemochromatosis and established SLC40A1-related ferroportin disorders remain separate entities. The 2026-09-10 Bookshelf snapshot contains no matching GeneReviews chapter (name and synonyms checked). Orphanet phenotype frequencies are source bands, not estimates inferred from the selected clinical series. Broad organ-abnormality rows and associated viral hepatitis are not modeled as specific consequences of iron overload. The initial Asta retrieval was mostly general iron-overload literature; unrelated thalassemia, NBIA, renal-disease and veterinary results were excluded from disease-specific claims.

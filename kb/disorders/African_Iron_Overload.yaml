    explanation: A biopsy-confirmed clinical series supports these measurements as diagnostic indicators.
- name: Hepatic Iron Assessment
  description: Liver histology can establish the distribution of iron and accompanying fibrosis; direct hepatic iron measurement documents tissue loading.
  evidence:
  - reference: PMID:10403742
    reference_title: Iron overload in urban Africans in the 1990s.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histological assessment, hepatocellular iron grading, and dry weight non-haem iron concentration were determined

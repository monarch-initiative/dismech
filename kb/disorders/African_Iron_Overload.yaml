  - target: Portal Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic hepatic iron loading contributes to fibrotic liver injury; intermediate cellular mechanisms are not resolved in the disease-specific sources.

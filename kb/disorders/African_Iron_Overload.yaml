  evidence:
  - reference: ORPHA:139507
    reference_title: Dietary iron overload disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: iron overload due to excess dietary iron intake and possibly genetic factors, leading to hepatic portal fibrosis and micronodular cirrhosis.
    explanation: Orphanet links dietary iron exposure and possible genetic susceptibility to systemic iron loading.
  - reference: PMID:9446671
    reference_title: Evidence of genetic transmission in African iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This segregation analysis provides further evidence for a genetic influence on iron overload in Africans.
    explanation: Family segregation analysis supports a genetic contribution but does not identify a causal locus or establish a clinical Mendelian subtype.
  downstream:
  - target: Hepatic Iron Deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Systemic loading includes deposition of excess iron in hepatic cells.

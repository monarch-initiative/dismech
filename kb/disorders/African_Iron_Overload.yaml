genetic:
- name: SLC40A1
  gene_term:
    preferred_term: SLC40A1
    term:
      id: hgnc:10909
      label: SLC40A1
  relationship_type: DISPUTED
  association: The Q248H polymorphism has been investigated as a contributor to African iron overload; it is not an established monogenic cause.
  notes: Curator assessment of the proposed causal relationship, not an external ClinGen classification. Increased ferritin associated with Q248H does not establish that it causes the disease. No Mendelian inheritance mode is assigned.
  evidence:
  - reference: PMID:14636642
    reference_title: Iron overload in Africans and African-Americans and a common mutation in the SCL40A1 (ferroportin 1) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that the Q248H mutation is a common polymorphism in the ferroportin 1 gene in African populations that may be associated with mild anemia and a tendency to iron loading.
    explanation: The exploratory study suggested a tendency to iron loading, not an established monogenic cause; it provides the earlier positive association context for the subsequent negative family study.
  - reference: PMID:16336444
    reference_title: Ferroportin (Q248H) mutations in African families with dietary iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: failed to show evidence that the ferroportin (Q248H) mutation is responsible for the condition.
    explanation: The 19-family study did not establish Q248H as the causal variant.
environmental:
- name: Excess Dietary Iron from Traditional Beer
  description: Consumption of traditional beer brewed in iron-containing vessels can provide a large dietary iron load.
  disease_effect: PREDISPOSES
  causal_role: RISK_FACTOR
  evidence:
  - reference: PMID:2872439
    reference_title: Dietary iron overload persists in rural sub-Saharan Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: iron overload was found almost exclusively among men who consumed traditional beer brewed in steel drums.
    explanation: The rural Zimbabwean survey directly linked iron loading to this dietary exposure.
  influences_mechanisms:
  - target: Systemic Iron Loading
    environmental_effect: TRIGGERS
    description: Excess dietary iron contributes to iron loading in susceptible individuals; this does not imply that every exposed person develops overload.
    evidence:
    - reference: ORPHA:139507
      reference_title: Dietary iron overload disease
      supports: SUPPORT
      evidence_source: OTHER
      snippet: iron overload due to excess dietary iron intake and possibly genetic factors
      explanation: The disease definition directly attributes iron loading to dietary exposure while retaining possible genetic contributions.

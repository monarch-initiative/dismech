name: Dietary Iron Overload Disease
creation_date: '2026-11-27T23:36:20Z'
category: Complex
disease_term:
  preferred_term: African iron overload
  term:
    id: MONDO:0011012
    label: African iron overload
synonyms:
- African iron overload
- Bantu siderosis
description: Dietary iron overload disease, also known as African iron overload, is an iron-loading disorder described particularly in sub-Saharan African populations exposed to iron-rich traditional beer. Excess dietary iron and incompletely defined host susceptibility contribute to iron accumulation in both macrophages and hepatocytes. Hepatic fibrosis and micronodular cirrhosis are major consequences. The disorder is distinct from HFE-related hemochromatosis; neither membership in OMIMPS:235200 nor a common SLC40A1 polymorphism establishes a Mendelian cause.
parents:
- Iron Metabolism Disorders
- Environmental Diseases
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    evidence:
    - reference: ORPHA:139507
      reference_title: Dietary iron overload disease
      supports: SUPPORT
      evidence_source: OTHER
      snippet: iron overload due to excess dietary iron intake and possibly genetic factors, leading to hepatic portal fibrosis and micronodular cirrhosis.
      explanation: The definition identifies hepatic fibrosis and cirrhosis as principal outcomes.
  - classification_value: ENVIRONMENTAL_EXPOSURES
    evidence:
    - reference: ORPHA:139507
      reference_title: Dietary iron overload disease
      supports: SUPPORT
      evidence_source: OTHER
      snippet: iron overload due to excess dietary iron intake and possibly genetic factors, leading to hepatic portal fibrosis and micronodular cirrhosis.
      explanation: Excess dietary iron is an environmental determinant of this disorder.

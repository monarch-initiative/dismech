  - reference: PMID:9620327
    reference_title: Dietary iron overload as a risk factor for hepatocellular carcinoma in Black Africans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that dietary iron overload may contribute to the development of HCC in Black Africans.
    explanation: In 24 cancer patients and 48 hospital controls, the adjusted odds ratio was 10.6 (95% CI 1.5–76.8), accounting for alcohol, viral hepatitis and aflatoxin exposure. The small observational study supports an association, not proof of causation.
  notes: A retrospective liver-biopsy study found an adjusted association with hepatocellular carcinoma (odds ratio 3.1; 95% CI 1.05–9.4), but could not control viral hepatitis or aflatoxin exposure. A separate case-control study addressed these confounders and also found an association, with wide confidence limits. Neither study establishes that iron alone caused the malignancy.

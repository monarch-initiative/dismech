  description: >-
    A minority branch, and the reason DNAJC30 belongs on a Leigh syndrome gene
    panel as well as an optic neuropathy panel. Patients present with dystonia,
    ataxia, gait disturbance and hemiparesis, and imaging shows symmetric or
    asymmetric hyperintensities and necrosis in the putamen, other basal
    ganglia nuclei, thalamus and brainstem. Optic involvement may follow, may
    accompany it, or may be absent altogether. Blood lactate is normal or only
    moderately raised, so a normal lactate does not exclude the diagnosis. The
    branch occurs on the same founder genotype that elsewhere produces isolated
    optic neuropathy, and also on truncating alleles.
  locations:
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:37397562
    reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) showed bilateral basal ganglion
      and thalamic hyperintensities concerning putaminal necrosis.
    explanation: >-
      Documents the imaging lesion that defines this branch, in a patient with
      a homozygous DNAJC30 nonsense variant.
  - reference: PMID:35861300
    reference_title: "Expanding the phenotype of DNAJC30-associated Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNAJC30-associated LS is characterized by variable age at onset, movement
      disorder phenotype and normal or moderately elevated blood lactate level.
    explanation: >-
      Characterises the branch, including the clinically important point that
      lactate may be normal.
  - reference: PMID:35861300
    reference_title: "Expanding the phenotype of DNAJC30-associated Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, DNAJC30 pathogenic variants should be suspected in patients
      with LS irrespective of optic nerve involvement.
    explanation: >-
      Establishes that the Leigh branch can occur without any optic phenotype.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No extra-ocular manifestation were found in our DNAJC30-linked patients
      with arLHON.
    explanation: >-
      Bounds the size of this branch rather than denying it. Thirty-five
      DNAJC30 patients in a Central European cohort had purely ocular disease,
      so the Leigh presentation is a minority route and should not be expected
      in a patient presenting with optic neuropathy.

phenotypes:
- category: Ophthalmological
  name: Reduced Visual Acuity
  description: >-
    Subacute, painless loss of central visual acuity is the presenting feature
    in the great majority of patients. Onset is typically in the second or
    third decade and is earlier than in the mitochondrial form. One eye is
    usually affected first with the fellow eye following within days to months,
    though bilateral onset at presentation is more common in arLHON than in
    mtLHON.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients' first symptom of LHON was the deterioration or loss of
      visual acuity.
    explanation: >-
      In a series of 46 Polish patients all carrying DNAJC30 variants, loss of
      visual acuity was the presenting symptom in most, supporting the
      VERY_FREQUENT band.
  - reference: PMID:38107630
    reference_title: "Case report: Mutations in DNAJC30 causing autosomal recessive Leber hereditary optic neuropathy are common amongst Eastern European individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report the cases of three Eastern European individuals presenting with
      bilateral painless visual loss, one of whom was also exhibiting motor
      symptoms
    explanation: >-
      Documents the painless bilateral character of the visual loss in three
      genetically confirmed arLHON patients.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical investigation of the patients with arLHON revealed a younger age
      of onset, a more frequent bilateral onset and an increased clinically
      relevant recovery compared with LHON associated with disease-causing
      variants in the mitochondrial DNA.
    explanation: >-
      Establishes the three clinical respects in which arLHON differs from the
      mitochondrial form.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at onset of the disease was 18.5 years (range 9.5–45.1).
      All patients showed involvement of both eyes. Bilateral onset was
      observed in 40% (n=8).
    explanation: >-
      Quantifies age at onset and establishes that involvement becomes
      bilateral in every patient, with simultaneous bilateral onset in 40
      percent.

- category: Ophthalmological
  name: Optic Atrophy
  description: >-
    The structural endpoint of retinal ganglion cell axon loss. The optic disc
    becomes pale, initially in the temporal sector, and the peripapillary
    retinal nerve fibre layer thins on optical coherence tomography. It is
    bilateral even when the two eyes were affected sequentially.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the course of the disease, mostly temporally accentuated papillary
      atrophy was observed in 91.7% (n=22).
    explanation: >-
      Quantifies optic atrophy in the Central European DNAJC30 cohort at 91.7
      percent, supporting the VERY_FREQUENT band, and records its
      characteristic temporal accentuation.
  - reference: PMID:37397562
    reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He also showed acute bilateral optic atrophy, subacute central vision
      loss, and abnormal brain MRI.
    explanation: >-
      Documents bilateral optic atrophy in the second of two unrelated patients
      homozygous for the same DNAJC30 nonsense allele.
  - reference: PMID:36388184
    reference_title: "Case report: Long-term follow-up of two patients with LHON caused by DNAJC30:c.152G>A pathogenic variant-case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both experienced further deterioration several months after the onset
      accompanied by thinning of the peripapillary retinal nerve fiber layer
      (RNFL).
    explanation: >-
      Documents the structural correlate of optic atrophy in two genetically
      confirmed arLHON patients.

- category: Ophthalmological
  name: Centrocecal Scotoma
  description: >-
    The characteristic visual field defect, reflecting selective loss of the
    papillomacular bundle. It is central or centrocecal, enlarges as visual
    acuity falls, and in patients who recover it breaks up into islands of
    preserved vision within the scotoma rather than shrinking uniformly from
    the edge.
  phenotype_term:
    preferred_term: Centrocecal scotoma
    term:
      id: HP:0000576
      label: Centrocecal scotoma
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT

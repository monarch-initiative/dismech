      or gain-of-function effect.
  downstream:
  - target: Impaired Complex I N-Module Subunit Exchange
    causal_link_type: DIRECT
    description: >-
      Loss of the co-chaperone removes the activity that presents oxidatively
      damaged N module subunits to the degradation machinery for replacement.
    evidence:
    - reference: PMID:33465056
      reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The patient-derived fibroblast cell lines (n = 6), spanning all 3
        DNAJC30 mutations, demonstrated a significant decrease in the turnover
        of N-module subunits in assembled complex I
      explanation: >-
        Directly links the patient genotype to slowed exchange of the N module
        subunits.

- name: Impaired Complex I N-Module Subunit Exchange
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Complex I subunits do not all turn over at the same rate. Those of the N
    module, where NADH is oxidized and reactive oxygen species are generated,
    are exchanged individually and rapidly, which maintains a functional enzyme
    at a fraction of the energetic cost of rebuilding it. In control
    fibroblasts five subunits (NDUFV3, NDUFS4, NDUFS6, NDUFA6 and NDUFA7) turn
    over more than a quarter of their pool in twelve hours, against under a
    tenth for the rest of the complex. Four of those five are direct
    interaction partners of DNAJC30 in protein interaction data, and in patient
    fibroblasts and in a DNAJC30 knockout line their turnover is selectively
    and significantly slowed. The selectivity is the load-bearing observation:
    of 145 protein complexes surveyed in the knockout, only complex I, and
    within it only the N module, showed altered turnover. The proposal is that
    DNAJC30 hands damaged subunits to the CLPXP protease, with which it
    co-occurs evolutionarily.
  biological_processes:
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
  protein_complexes:
  - preferred_term: NADH dehydrogenase complex
    term:
      id: GO:0030964
      label: NADH dehydrogenase complex
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together, these data indicate that the interaction of DNAJC30 with
      specific complex I subunits facilitates the high turnover of complex I
      N-module subunits in a complex I repair mechanism.
    explanation: >-
      States the mechanism this node asserts, in the words of the study that
      measured it.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we verified that among all captured protein complexes (n = 145), only
      mitochondrial complex I, and specifically the complex I N-module, had
      significantly altered turnover due to the knockout of DNAJC30
    explanation: >-
      Establishes that the turnover defect is confined to the complex I N
      module rather than being a general proteostasis defect.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This defect was not found in mtLHON (n = 3) and is therefore specific to
      arLHON
    explanation: >-
      Distinguishes the arLHON mechanism from that of the mitochondrial form,
      which shares the clinical phenotype but not this repair defect.
  downstream:
  - target: Accumulation of Functionally Impaired Complex I
    causal_link_type: DIRECT
    description: >-
      Subunits damaged by reactive oxygen species are no longer replaced, so
      they remain incorporated in the assembled enzyme.
    evidence:
    - reference: PMID:33465056
      reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        in the absence of DNAJC30 the complex I N-module subunits may no longer
        be readily exchangeable, resulting in an accumulation of complex I with
        lower function
      explanation: >-
        States the causal step from failed exchange to accumulation of
        low-function enzyme.

- name: Accumulation of Functionally Impaired Complex I
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    The consequence is unusual among complex I disorders and is what separates
    this entity from the nuclear subunit deficiencies. The amount of assembled
    complex I is not reduced; if anything patient fibroblasts show a slight
    increase in complex I subunit abundance, without a matching rise in
    transcript levels, which is itself the signal that the problem is
    degradation rather than synthesis. What is lost is the quality of the
    enzyme that is present: the complex accumulates with damaged N module
    subunits still in place and reduced catalytic competence. Complex I
    activity is specifically affected while complex IV and complex V activities
    are not, so the lesion is not a general respiratory chain failure.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although the quantitative proteomic data in patient-derived fibroblast
      cell lines indicates a subtle increase in complex I subunit abundance due
      to DNAJC30 defect, RNA sequencing did not reveal a corresponding increase
      in complex I subunit expression
    explanation: >-
      Shows the enzyme is present in normal or slightly raised amount, so the
      defect is not one of assembly, and points to impaired degradation.
  - reference: PMID:37397562
    reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that DNAJC30 depletion specifically decreased enzyme
      activity of complex I but not complex IV or V
    explanation: >-
      Independent confirmation, in a knockout cell model, that the enzymatic
      deficit is confined to complex I.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The subtlety of the complex I–dependent respiration defect in the
      patient-derived fibroblast cell lines reflects the role of DNAJC30 in
      maintenance rather than in the structure or assembly of complex I
    explanation: >-
      The authors' own framing of why the biochemical defect is mild in
      fibroblasts and why it is a maintenance rather than an assembly defect.
  downstream:
  - target: Mitochondrial Bioenergetic Failure and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      Reduced complex I catalytic competence lowers electron flux and proton
      pumping and raises electron leak.
    evidence:
    - reference: PMID:37397562
      reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        DNAJC30 depletion caused a decrease in oxygen consumption rate
        concerning basal, ATP production, and maximum conditions
      explanation: >-
        Links the complex I defect to a measured fall in respiration.

- name: Mitochondrial Bioenergetic Failure and Oxidative Stress
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells lacking DNAJC30 respire less, hold a lower mitochondrial membrane
    potential, and generate more reactive oxygen species at both the cellular
    and the mitochondrial level. This closes a loop: the N module is damaged by
    reactive oxygen species in the first place, and failure to repair it raises
    reactive oxygen species production further. The combination of falling ATP
    supply and rising oxidative load is the proximate insult delivered to the
    cell types that fail in this disease.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:37397562
    reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found that DNAJC30 depletion decreased mitochondrial membrane
      potential (Fig. 1H; Fig. S2A) while increasing cellular and mitochondrial
      ROS levels
    explanation: >-
      Measures the two components of this node, falling membrane potential and
      rising reactive oxygen species, in a DNAJC30 knockout line.
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It results in low ATP synthesis and high levels of reactive oxygen
      species, which causes the degeneration of retinal ganglion cells.
    explanation: >-
      States the bioenergetic and oxidative consequence and its target cell, as
      understood in the arLHON literature.
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: DIRECT
    description: >-
      Retinal ganglion cells, and the unmyelinated small-calibre axons of the
      papillomacular bundle in particular, are the cells that fail first.
    evidence:

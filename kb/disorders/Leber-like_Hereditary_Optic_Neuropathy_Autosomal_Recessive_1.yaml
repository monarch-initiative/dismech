      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It results in low ATP synthesis and high levels of reactive oxygen
        species, which causes the degeneration of retinal ganglion cells.
      explanation: >-
        States the causal step from the bioenergetic lesion to retinal ganglion
        cell degeneration.
  - target: Subacute Necrotizing Encephalopathy of Basal Ganglia and Brainstem
    causal_link_type: DIRECT
    description: >-
      In a minority of patients the same biochemical lesion produces the
      Leigh syndrome pattern of symmetric basal ganglia and brainstem necrosis

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic DNAJC30 variants, most often homozygosity for the p.(Tyr51Cys)
    founder allele but also compound heterozygosity with a second rare allele.
    Segregation and allelic cloning have confirmed true biallelism in
    compound heterozygotes. The recessive mode is the whole point of the
    entity: it removes the maternal family history that had been treated as a
    prerequisite for a LHON diagnosis, and it changes recurrence counselling
    from maternal-line risk to a one-in-four sibling risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe biallelic mutations in a nuclear encoded gene, DNAJC30, in 33
      unsolved patients from 29 families and establish an autosomal recessive
      mode of inheritance for LHON (arLHON), which to date has been a prime
      example of a maternally inherited disorder.
    explanation: >-
      The founding demonstration of autosomal recessive transmission for a
      phenotype previously defined as maternally inherited.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation and allelic cloning confirmed the expected recessive mode of
      inheritance and true biallelism.
    explanation: >-
      Independent confirmation that the two variants in compound heterozygotes
      lie on opposite alleles.

pathophysiology:
- name: DNAJC30 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    DNAJC30 is a single-exon nuclear gene encoding a DnaJ/HSP40 family
    co-chaperone expressed mainly in neurons. Disease alleles are biallelic and
    are dominated by one founder missense change, c.152A>G p.(Tyr51Cys), which
    lies in the J domain; the rarer p.(Pro78Ser), p.(Leu101Gln) and
    p.(His77del) alleles lie in the same domain, while p.(Glu204*) truncates
    upstream of the transmembrane domain. Truncating alleles are informative
    about the mechanism because they abolish the protein outright: the
    p.(Trp8*) nonsense allele produced no detectable DNAJC30 protein in
    transfected cells, so the disease state is loss of the chaperone, not a
    gain of an aberrant activity. Heterozygous carriers, including carriers of
    outright loss-of-function alleles in population databases, are healthy.
  genes:
  - preferred_term: DNAJC30
    term:
      id: hgnc:16410
      label: DNAJC30
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Biallelic germline DNAJC30 variants, most often homozygosity for the
      Eastern European founder allele c.152A>G p.(Tyr51Cys), less often
      compound heterozygosity or homozygosity for a truncating allele.
  molecular_functions:

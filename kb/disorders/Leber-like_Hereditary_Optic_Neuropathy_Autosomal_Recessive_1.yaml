  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taking the allele frequency of the variant (0.125%) and applying the
      Hardy-Weinberg equation with adjustment for the observed incomplete

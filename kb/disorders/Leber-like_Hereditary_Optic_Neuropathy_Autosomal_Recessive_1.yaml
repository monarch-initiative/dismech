genetic:
- name: DNAJC30
  notes: >-
    The single causative gene. It has one exon, which makes Sanger sequencing
    of the whole coding region cheap and is the practical argument for testing
    it in parallel with the mitochondrial genome in any unsolved LHON. The
    founder allele c.152A>G p.(Tyr51Cys) accounts for the overwhelming majority
    of disease alleles across Eastern and Central Europe; the contribution of
    the gene to the LHON caseload therefore varies sharply with ancestry,
    from roughly 3 percent of an unsolved Central European optic neuropathy
    cohort to over a fifth of molecularly solved LHON in Moscow, and in one
    Polish series it exceeded the mitochondrial form.
  gene_term:
    preferred_term: DNAJC30
    term:
      id: hgnc:16410
      label: DNAJC30
  relationship_type: CAUSATIVE
  case_fractions:
  - population: Central European cohort with clinical LHON or other inherited optic atrophy, previously genetically unsolved
    case_fraction_percent: 2.9
    cohort_size: 1202
    notes: >-
      Detection rate across the whole screened cohort of 800 LHON and 402 optic
      atrophy patients. Within the LHON subgroup alone the rate was 3.6 percent.
    evidence:
    - reference: PMID:35091433
      reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified likely pathogenic variants in 35/1202 patients,
        corresponding to a detection rate of 2.9%.
      explanation: >-
        Quantifies the share of a previously unsolved Central European cohort
        explained by DNAJC30.
  - population: Molecularly confirmed LHON patients, Research Centre for Medical Genetics, Moscow
    case_fraction_percent: 20.9
    cohort_size: 86
    notes: >-
      Founder-population estimate. The remaining 79.1 percent carried pathogenic
      mtDNA mutations.
    evidence:
    - reference: PMID:33465056
      reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of 86 molecularly confirmed LHON patients investigated by full mtDNA
        sequencing and WES in the Research Centre for Medical Genetics in
        Moscow, 18 (20.9%) harbored the homozygous p.Tyr51Cys DNAJC30 mutation
      explanation: >-
        Quantifies the much higher share of LHON attributable to DNAJC30 within
        the founder population.
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that the majority of the patients originate from Russia, Poland,
      Romania, and Ukraine, the p.Tyr51Cys DNAJC30 variant is ascribed to an
      Eastern European founder event.
    explanation: >-
      Establishes the founder origin and geographic distribution of the
      dominant disease allele.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The previously described missense variant c.152A>G;p.(Tyr51Cys) accounts
      for 90% of disease-associated alleles in our cohort and we confirmed a
      strong founder effect.
    explanation: >-
      Independent confirmation of the founder effect and of the allele's
      dominance of the mutational spectrum.
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on our data, the autosomal recessive form of LHON caused by DNAJC30
      gene mutations is more frequent than the mitochondrial form in Polish
      patients.
    explanation: >-
      Shows that in one national series the nuclear form outnumbers the
      mitochondrial form, which is the strongest statement of ancestry
      dependence available.

prevalence:
- population: Worldwide, derived from the founder allele frequency
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.109
  notes: >-
    Estimated from the gnomAD allele frequency of the p.(Tyr51Cys) founder

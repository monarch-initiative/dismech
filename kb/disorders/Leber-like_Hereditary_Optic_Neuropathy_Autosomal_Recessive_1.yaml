    explanation: >-
      States the derivation and the value normalised here to 0.109 per 100,000.

treatments:
- name: Idebenone
  description: >-
    Idebenone is a short-chain benzoquinone that, once reduced, can accept
    electrons and deliver them to complex III, routing around the defective
    complex I. It is authorised for LHON by the European Medicines Agency and
    is given at 900 mg per day. Its use here is not merely inherited from the
    mitochondrial form: the arLHON cohorts report a treated recovery rate above
    that reported for mtLHON, which makes reaching a DNAJC30 diagnosis
    prognostically as well as genetically consequential. The important
    qualification is that the reported benefit is in the optic phenotype. In
    the one published patient with DNAJC30-associated Leigh syndrome treated
    with idebenone, the drug neither halted neurological progression nor
    prevented new lesions on imaging.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Accumulation of Functionally Impaired Complex I
    treatment_effect: BYPASSES
    description: >-
      Reduced idebenone donates electrons to complex III, so electron flux and
      downstream ATP synthesis are partly restored without the damaged complex
      I being repaired. The predicate is BYPASSES rather than RESTORES because
      the drug does not act on the chaperone defect or on the retained damaged
      subunits.
    evidence:
    - reference: PMID:33465056
      reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Idebenone therapy was received by 18 patients, as a potent antioxidant
        and electron donor approved for LHON by EMA
      explanation: >-
        States the drug's mechanism of action and its regulatory status in the
        arLHON cohort that received it.
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 36 treated and 26 untreated eyes, CRR was reported in 29 (80.6%)
      and 13 (50.0%), respectively.
    explanation: >-
      Quantifies clinically relevant recovery in treated versus untreated eyes
      in the founding arLHON cohort. This is an uncontrolled within-cohort
      comparison, not a randomised trial.
  - reference: PMID:35148383
    reference_title: "DNAJC30 defect: a frequent cause of recessive Leber hereditary optic neuropathy and Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The autosomal recessive LHON patients demonstrate an earlier age of
      disease onset and a higher rate of idebenone-treated and spontaneous
      recovery of vision in comparison to reported figures for maternally
      inherited disease.
    explanation: >-
      Independent replication that treated recovery in arLHON exceeds published
      figures for the mitochondrial form. Note it also reports higher
      spontaneous recovery, so the treated figure cannot be attributed to the
      drug alone.
  - reference: PMID:39132756
    reference_title: "Effects of idebenone treatment in a patient with DNAJC30-associated Leigh Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As evidenced in our case, idebenone did not halt progression of the
      disease, nor induce any neuroprotective effect apparent in neuroimaging.
    explanation: >-
      Refutes the extension of idebenone benefit from the optic phenotype to
      the Leigh branch, in a patient carrying the same founder allele as the
      responsive optic cases.
  - reference: PMID:39132756
    reference_title: "Effects of idebenone treatment in a patient with DNAJC30-associated Leigh Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, despite the significant efficacy of idebenone in arLHON,
      its benefit in LS remains uncertain.
    explanation: >-
      The authors' own framing: efficacy in the optic phenotype is accepted,
      benefit in the Leigh branch is unresolved on a single case.

diagnosis:
- name: Parallel Sequencing of Mitochondrial DNA and the Single-Exon DNAJC30 Gene
  description: >-
    The diagnostic recommendation that follows from the entity's existence. A
    patient with a convincing LHON phenotype and a negative mtDNA result used
    to be left unsolved, sometimes for years. Because DNAJC30 has a single
    exon, Sanger sequencing of the whole gene is inexpensive, so it can be run
    alongside full mtDNA sequencing rather than after it. In founder
    populations the argument is stronger still: in one Polish series the
    nuclear form outnumbered the mitochondrial form, which inverts the usual
    testing order.
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore recommend parallel sequencing of the complete mtDNA sequence
      and the 1-exon gene DNAJC30 to close the diagnostic gap in LHON.
    explanation: >-
      The explicit diagnostic recommendation made by the study that defined the
      entity.
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of our study suggest that Sanger sequencing of the
      single-exon DNAJC30 gene should be a method of choice applied to identify
      a molecular background of clinically confirmed LHON in Polish patients.
    explanation: >-
      Extends the recommendation to first-line testing in a founder population.

discussions:
- discussion_id: arlhon_sex_dependent_incomplete_penetrance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a recessive disease with a defined biallelic genotype show
    incomplete penetrance and a strong male predominance, and what is the
    modifier?
  attaches_to:
  - "pathophysiology#DNAJC30 Loss of Function"
  - "pathophysiology#Retinal Ganglion Cell Degeneration"
  rationale: >-
    This is the entity's most conspicuous anomaly. Incomplete penetrance and a
    sex bias are expected in the mitochondrial form and are among the oldest
    puzzles in LHON, but they are not what a biallelic recessive genotype
    normally produces. Here they are not merely present but more extreme than
    in the mitochondrial form: roughly 97 percent of homozygous males but only
    43 percent of homozygous females expressed a phenotype in the founding
    cohort, a ten to one ratio of affected males to affected females against
    five to one in mtLHON. Asymptomatic homozygous carriers exist and have been
    confirmed in a second cohort.

    Three explanations were tested and eliminated in the founding study. The
    amount of DNAJC30 protein and message does not differ by sex, so it is not
    a dosage effect on the chaperone itself. Whole exome data from patients
    carried no rare biallelic variants in other complex I subunit or assembly
    genes, so a second nuclear locus was not detected. No rare mtDNA variants
    were found either. The one positive association is with mitochondrial
    haplogroup J, which was over-represented among arLHON patients relative to
    the European background, mirroring its role in the mitochondrial form; but
    that is a partial and correlative finding on small numbers, not a
    mechanism.

    The gnomAD allele frequency of the founder variant is equal in males and
    females, which is the observation that makes the sex bias a downstream
    phenomenon rather than an ascertainment artefact. So the modifier acts
    somewhere between having the genotype and losing vision, and it is
    unidentified. Note also that the penetrance figures are acknowledged
    overestimates, drawn from a small number of pedigrees with few unaffected
    siblings of known carrier status.
  proposed_experiments:
  - experiment_id: arlhon_biobank_penetrance
    name: Population-based penetrance estimate from unselected founder-population biobank genotypes
    description: >-
      Identify p.(Tyr51Cys) homozygotes in an unselected Eastern European
      biobank rather than through affected probands, and determine visual
      status and age. This is the design that removes the ascertainment bias
      the founding authors flag, and it is the only way to get a penetrance
      figure that is not an overestimate.
  - experiment_id: arlhon_rgc_modifier_assay
    name: Hormonal and oxidative-stress modifier testing in patient-derived retinal ganglion cells
    description: >-
      Differentiate retinal ganglion cells from patient and control induced
      pluripotent stem cells and test whether oestrogen exposure, or graded
      oxidative challenge, shifts the complex I N module turnover defect or
      cell survival. A sex-hormone effect acting downstream of the chaperone
      would fit both the equal allele frequency between sexes and the absence
      of a sex difference in DNAJC30 expression.
  evidence:
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 30 of 31 (96.8%) homozygous carrier males and just 3 of 7
      (42.9%) homozygous carrier females express a phenotype.
    explanation: >-
      Quantifies the sex-dependent penetrance that this gap is about.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, akin to mtLHON, the factor influencing sex-dependent
      penetrance remains elusive at this time.
    explanation: >-
      The authors' explicit statement that the modifier is unidentified.
  - reference: PMID:33465056
    reference_title: "Impaired complex I repair causes recessive Leber's hereditary optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we measured DNAJC30 expression on the RNA and protein level in over 75
      and 100 controls, respectively; however, we did not detect a significant
      difference
    explanation: >-
      Eliminates chaperone dosage as the explanation for the sex bias.
  - reference: PMID:35148383
    reference_title: "DNAJC30 defect: a frequent cause of recessive Leber hereditary optic neuropathy and Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This collection of unreported variant carriers confirms sex-dependent
      incomplete penetrance of the homozygous variant given a significant male
      predominance of disease and the report of asymptomatic homozygous variant
      carriers.
    explanation: >-
      Independent replication of both the sex bias and the existence of
      asymptomatic homozygotes.

- discussion_id: arlhon_leigh_branch_determinant
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What decides whether a patient with biallelic DNAJC30 variants develops an
    isolated optic neuropathy or Leigh syndrome, and does that also explain why
    idebenone helps the first and not the second?
  attaches_to:
  - "pathophysiology#Subacute Necrotizing Encephalopathy of Basal Ganglia and Brainstem"
  - "pathophysiology#Mitochondrial Bioenergetic Failure and Oxidative Stress"
  rationale: >-
    The same p.(Tyr51Cys) homozygous genotype produces isolated adult-onset
    optic neuropathy in most patients and childhood Leigh syndrome in a few, and
    the two branches respond to treatment differently. The leading hypothesis is
    digenic: a heterozygous variant in another complex I gene supplies a second
    hit that tips the phenotype. That hypothesis has direct support in one
    report, where two siblings with the Leigh presentation carried a novel
    heterozygous NDUFS8 variant in addition to their DNAJC30 alleles.

    The evidence against treating it as settled is equally direct. In the one
    DNAJC30 Leigh patient given idebenone, reanalysis of genome sequencing and
    mtDNA found no second variant in any gene linked to Leigh syndrome, LHON or
    the respiratory chain complexes, and the drug failed. The authors offer two
    alternatives that the data cannot distinguish: an undetected second hit in a
    gene not yet associated with mitochondrial disease or missed because
    filtering targets rare variants, or a genuine difference in cellular biology
    between the two phenotypes that has nothing to do with a second locus.

    Truncating alleles complicate the picture further. Both patients homozygous
    for the p.(Trp8*) nonsense variant had a Leigh-like course with markedly
    earlier onset than the missense cohort, which suggests residual chaperone
    function may matter independently of any second gene. Whether allele
    severity and a second hit are competing or additive explanations is
    untested.
  proposed_experiments:
  - experiment_id: arlhon_leigh_second_hit_search
    name: Systematic second-hit search across all DNAJC30 Leigh cases
    description: >-
      Apply uniform genome sequencing with relaxed allele-frequency filtering,
      plus copy-number and mitochondrial heteroplasmy analysis, to every
      reported DNAJC30 Leigh patient and to matched DNAJC30 optic-only
      patients. The digenic hypothesis predicts an excess of heterozygous
      complex I variants in the Leigh group; the current evidence for it rests
      on a single sibling pair.
  - experiment_id: arlhon_allelic_series_repair_assay
    name: Genotype-stratified complex I repair assay across the allelic series
    description: >-
      Measure N module subunit turnover and complex I activity in cells
      carrying missense, in-frame deletion and truncating DNAJC30 alleles, and
      test whether residual repair capacity separates the optic-only from the
      Leigh cases independently of any second variant.
  evidence:
  - reference: PMID:35861300
    reference_title: "Expanding the phenotype of DNAJC30-associated Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a candidate heterozygous variant in NDUFS8 supports the
      hypothesis of digenic inheritance.
    explanation: >-
      The positive evidence for the digenic hypothesis, in two siblings with
      the Leigh presentation.
  - reference: PMID:39132756
    reference_title: "Effects of idebenone treatment in a patient with DNAJC30-associated Leigh Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Re-analysis of GS and mtDNA sequencing data showed no other potential
      variants in genes linked with LS, LHON, or the respiratory chain enzyme
      complexes.
    explanation: >-
      A Leigh patient in whom no second hit was found despite a targeted
      search, which is why the digenic hypothesis cannot be treated as the
      general explanation.
  - reference: PMID:37397562
    reference_title: "A homozygous nonsense mutation in DNAJC30 causes Leber's hereditary optic neuropathy with Leigh-like phenotypes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, our patients experienced markedly earlier onset of symptoms
      containing rapid progression of bilateral optic atrophy and severe motor
      difficulties
    explanation: >-
      Suggests allele severity as a competing explanation, since both patients
      with the complete loss-of-function nonsense allele had earlier and more
      severe disease than the missense cohort.

notes: >-
  Relationship to the existing dismech LHON entry. Leber Hereditary Optic
  Neuropathy in this knowledge base models the maternally inherited mtDNA form
  and carries an arLHON subtype bound to the parent term MONDO:0030309, which
  lumps DNAJC30 together with NDUFS2, MCAT and NDUFA12. This entry is the
  DNAJC30-specific child concept, MONDO:0958183 and OMIM 619382, curated
  separately because its mechanism is not a variant of the mtDNA one: mtLHON is
  a defect in complex I subunits, and this is a defect in the machinery that
  repairs an intact complex, a distinction the founding study demonstrated
  directly by showing the turnover defect is absent in mtLHON cells. Curators
  editing either entry should keep the mechanism claims separate.

  Not curated here, and why. Williams syndrome is a 7q11.23 deletion that
  removes DNAJC30 along with 25 or more other genes, and DNAJC30 has been
  proposed to contribute to its neuronal phenotype; the founding arLHON study
  found no Williams features in homozygous or heterozygous DNAJC30 variant
  carriers, so the two are not modelled as related here. An earlier report
  attributed to DNAJC30 an interaction with complex V that facilitates ATP
  synthesis; the arLHON study found no effect of the defect on complex V
  function, abundance, or subunit turnover, and a knockout study independently
  found complex I activity affected while complex IV and V were not, so the
  complex V role is not carried into this entry's mechanism. Environmental
  triggers such as tobacco and alcohol are well established for the
  mitochondrial form but no source examined here reports them in DNAJC30
  patients, so no environmental section is curated.

  GeneReviews has no chapter for this entity. The Nuclear Gene-Encoded Leigh
  Syndrome Spectrum overview does not list DNAJC30, and searches for a
  DNAJC30 or arLHON GeneReviews chapter returned none, so the phenotype
  baseline for this entry comes from the primary cohorts and case series
  instead.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 33 subjects, 29 harbored the same NM_032317.2 c.152A>G
      (7:73097602, NP_115693.2 p.Tyr51Cys) homozygous variant
    explanation: >-
      Records the founder allele that accounts for the great majority of
      patients, and its homozygous state.
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

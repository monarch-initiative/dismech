    snippet: >-
      Visual field defects (figure 4) were central or cecocentral in 96.6%
      (n=28).
    explanation: >-
      Quantifies the field defect in the Central European DNAJC30 cohort at
      96.6 percent, which places it in the VERY_FREQUENT band.
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients reported centrocecal scotoma or other visual field defects,
      and some patients noticed impaired color perception.
    explanation: >-
      Independent replication in the 46-patient Polish DNAJC30 series.
  - reference: PMID:36388184
    reference_title: "Case report: Long-term follow-up of two patients with LHON caused by DNAJC30:c.152G>A pathogenic variant-case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The visual loss was characterized by centrocecal scotoma, abnormal PERG
      N95 and VEP, and retinal nerve fiber thinning on the OCT.
    explanation: >-
      Characterises the field defect in two patients homozygous for the founder
      allele.

- category: Ophthalmological
  name: Color Vision Defect
  description: >-
    Impaired colour perception accompanies the visual loss and is often an
    early sign. In arLHON it may be relatively preserved in the early phase,
    which the reporting authors note is atypical for the mitochondrial form,
    and it can recover substantially alongside visual acuity.
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  frequency: FREQUENT
  evidence:
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Colour vision disturbances were observed in 68.8% (n=11) and were
      non-specific.
    explanation: >-
      Quantifies colour vision disturbance in the Central European DNAJC30
      cohort at 68.8 percent, which falls in the FREQUENT band.
  - reference: PMID:36388184
    reference_title: "Case report: Long-term follow-up of two patients with LHON caused by DNAJC30:c.152G>A pathogenic variant-case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, pain in eye movements was present in Case 1, and color
      vision seemed to be preserved in early phases in both, which is not
      typical for mtLHON.
    explanation: >-
      Records that early colour vision may be relatively preserved in arLHON,
      unlike the mitochondrial form.

- category: Ophthalmological
  name: Optic Disc Hyperemia in the Acute Phase
  description: >-
    During the acute phase the optic disc is hyperaemic and swollen, often with
    peripapillary telangiectatic microangiopathy, and there is no leakage on
    fluorescein angiography. The appearance is regularly mistaken for optic
    neuritis, and the absence of angiographic leakage is what distinguishes it.
    The pallor of the chronic phase follows months later.
  phenotype_term:
    preferred_term: Abnormal optic disc morphology
    term:
      id: HP:0012795
      label: Abnormal optic disc morphology
    temporality: ACUTE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35091433
    reference_title: "DNAJC30 disease-causing gene variants in a large Central European cohort of patients with suspected Leber's hereditary optic neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial papillary microangiopathy (figure 4) was common and occurred in
      94.1% (n=16).
    explanation: >-
      Quantifies the acute-phase peripapillary microangiopathy in the Central
      European DNAJC30 cohort at 94.1 percent, supporting the VERY_FREQUENT
      band.
  - reference: PMID:38139324
    reference_title: "DNAJC30 Gene Variants Are a Frequent Cause of a Rare Disease: Leber Hereditary Optic Neuropathy in Polish Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fundus examination showed hyperemic optic nerves during the acute phase
      of LHON in most patients.
    explanation: >-
      Reports acute-phase disc hyperaemia in the DNAJC30 Polish series.
  - reference: PMID:36388184
    reference_title: "Case report: Long-term follow-up of two patients with LHON caused by DNAJC30:c.152G>A pathogenic variant-case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had hyperemic optic disks (PNO) and central scotoma in their visual
      fields.
    explanation: >-
      Documents the acute-phase disc appearance in two genetically confirmed
      patients.
  notes: >-
    Bound to the parent term HP:0012795 because HPO has no term for optic disc
    hyperaemia or for acute-phase disc swelling with preserved angiography;
    HP:0000543 Optic disc pallor describes the opposite, chronic appearance and

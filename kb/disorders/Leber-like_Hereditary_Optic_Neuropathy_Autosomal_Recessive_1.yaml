name: Leber-like Hereditary Optic Neuropathy, Autosomal Recessive 1
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Leber-like hereditary optic neuropathy, autosomal recessive 1 (LHONAR1,
  arLHON) is caused by biallelic variants in the nuclear gene DNAJC30. It
  matters because of what it overturned. Leber hereditary optic neuropathy had
  been the textbook example of maternal transmission, defined since 1988 by
  point mutations in mitochondrial DNA, and a patient with a convincing LHON
  phenotype and no mtDNA mutation had no diagnosis to be given. In 2021 a
  single-exon nuclear gene accounted for 33 such patients from 29 families, and
  the resulting entity recapitulated every hallmark of the mitochondrial form:
  subacute painless bilateral central visual loss in young adults, incomplete
  penetrance, marked male predominance, and responsiveness to idebenone. LHON
  is therefore a clinical description independent of the mode of transmission,
  and the entity divides into mtLHON and arLHON.

  The mechanism is not a defect of complex I structure or assembly, which is
  what mtDNA LHON and the nuclear complex I subunit deficiencies produce.
  DNAJC30 is a chaperone that services complex I after it has been built.
  Subunits of the complex I N module sit closest to the site of electron entry
  and take the highest oxidative damage, and the cell exchanges them
  individually rather than rebuilding the whole enzyme, which is far cheaper in
  energy. DNAJC30 is what makes that exchange happen. Tracking protein turnover
  in patient fibroblasts and in a DNAJC30 knockout cell line showed the turnover
  of exactly those N module subunits to be selectively slowed, so damaged
  subunits are retained and the cell accumulates assembled complex I of reduced
  catalytic quality. This is a disease of impaired repair rather than of
  impaired construction, and it was the first such disease described for a
  respiratory chain complex.

  The genetics are dominated by one allele. The missense variant
  c.152A>G p.(Tyr51Cys) is an Eastern European founder allele carried by the
  great majority of patients, common enough in Russia, Poland, Ukraine and
  Romania that DNAJC30 accounts for a fifth of molecularly solved LHON in a
  Moscow centre and outnumbers the mitochondrial form in a Polish series. Rarer
  alleles include p.(Pro78Ser), p.(Leu101Gln), p.(His77del), the nonsense
  p.(Glu204*) and p.(Trp8*), and the frameshift p.(Ser44ValfsTer8). Because the
  gene has a single exon, Sanger sequencing of DNAJC30 is cheap, and the
  practical recommendation is to sequence it in parallel with the full mtDNA in
  any unsolved LHON.

  Two features complicate the picture and are curated here as open questions
  rather than settled mechanism. The first is that a recessive disease should
  not show incomplete penetrance or a sex bias, and this one shows both, more
  strongly than the mitochondrial form does; DNAJC30 expression does not differ
  between sexes, so the modifier lies downstream and is unidentified. The
  second is a Leigh syndrome branch. A minority of patients, including some
  homozygous for the same founder allele, present instead with dystonia,
  ataxia and bilateral basal ganglia necrosis, with or without optic
  involvement, and in the one reported case treated with idebenone the drug did
  not arrest that course. Whether a second hit in another complex I gene
  explains the branch is proposed but not established.

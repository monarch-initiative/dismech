name: Metaphyseal dysplasia, Spahr type
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Metaphyseal dysplasia, Spahr type (MDST) is an autosomal recessive metaphyseal
  dysplasia caused by biallelic MMP13 variants. It was described in 1961 in four
  of five siblings with moderate short stature, metaphyseal irregularity and
  mild genu varum but entirely normal blood chemistry, and it kept that
  clinical-only definition for more than fifty years until exome sequencing
  identified MMP13 in 2014. MMP13 is the collagenase that remodels the
  cartilaginous matrix of the growing physis, and the reported disease alleles
  sit in the catalytic domain, disabling the enzyme rather than misregulating
  it. The clinical picture is dominated by how convincingly it imitates rickets:
  metaphyseal fraying, splaying and cupping with bowed legs, in a child whose
  calcium, phosphate, alkaline phosphatase and vitamin D are all normal.
  Distinguishing it matters because the treatments for rickets do nothing here,
  and because recurrence risk is recessive rather than dominant.
disease_term:
  preferred_term: metaphyseal chondrodysplasia, Spahr type
  term:
    id: MONDO:0009597
    label: metaphyseal chondrodysplasia, Spahr type
parents:
- hereditary disease
synonyms:
- MDST
- Spahr-type metaphyseal chondrodysplasia
- MMP13-related metaphyseal dysplasia, recessive type
classifications:
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 11 "Metaphyseal
      dysplasias", row NOS 11-0090 "Metaphyseal dysplasia Spahr, MMP13-related"
      (MIM 250400, autosomal recessive). The group's other MMP13 row, NOS
      11-0100 "Metaphyseal anadysplasia, MMP13-related" (MIM 602111), is the
      dominant entity and is curated on the Metaphyseal anadysplasia entry; the
      two are separated by inheritance and by where in MMP13 the variants fall.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MMP13 variants, reported both as homozygous variants in
    consanguineous families and as segregating homozygous variants in
    multiplex sibships.
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MDST phenotype is associated with recessive MMP13 mutations, confirming the importance of this metalloproteinase in the metaphyseal growth plate.
    explanation: >-
      Establishes the recessive mode and the causal gene in the family that
      originally defined the disease.
  - reference: PMID:27576021
    reference_title: >-
      Metaphyseal dysplasia, Spahr type; missense MMP13 mutations in two Iraqi siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two siblings of Iraqi descent with clinical and radiographic features of metaphyseal dysplasia, Spahr type (MDST), born to consanguineous unaffected parents. Molecular testing confirmed pathogenic mutations in MMP13.
    explanation: >-
      Independent recessive sibship with unaffected consanguineous parents.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists; about a dozen molecularly confirmed patients
    have been reported in total.
  evidence:
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMP13-related metaphyseal dysplasia Spahr type, is an extremely rare skeletal disorder, and only a dozen patients with a confirmed molecular diagnosis have been reported.
    explanation: >-
      Direct source for the count of molecularly confirmed cases.
pathophysiology:
- name: Biallelic MMP13 Catalytic-Domain Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The variants reported in MDST fall in the catalytic domain of MMP13. The
    founding family's p.Trp207Gly substitution disrupts a hydrogen bond in the
    calcium-binding region of that domain, disabling the collagenase. This is
    the mechanistic contrast with dominant metaphyseal anadysplasia, where the
    variants sit in the prodomain and cause premature autoactivation rather than
    simple inactivation.
  genes:
  - preferred_term: MMP13
    term:
      id: hgnc:7159
      label: MMP13
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The predicted non-conservative amino acid substitution, p.Trp207Gly, disrupts a crucial hydrogen bond in the calcium-binding region of the catalytic domain of the matrix metalloproteinase, MMP13.
    explanation: >-
      Structural modelling of the founding variant locating the lesion in the
      catalytic domain.
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we reinforce the dyadic naming system for the two groups of MMP13-related metaphyseal dysplasia, differentiated solely by their inheritance patterns, which also exhibit consistency with the location of the variants
    explanation: >-
      Supports the claim that the recessive and dominant MMP13 entities differ
      by variant location as well as by inheritance.
  downstream:
  - target: Failure of Physeal Collagen Remodelling
    description: >-
      Loss of MMP13 collagenase activity removes the enzyme that degrades
      collagen and other matrix proteins during physeal remodelling.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36873332
      reference_title: >-
        Metaphyseal Dysplasia, Spahr Type; A Case Report of Variable Expressivity in Non-Consanguineous Filipino Siblings.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This protein plays a role in the degradation of collagen and other proteins in the extracellular matrix with particular importance in the maturation and remodeling of the cartilaginous component of physes in growing children
      explanation: >-
        States the physeal remodelling function that the loss-of-function
        variants remove.
- name: Failure of Physeal Collagen Remodelling
  biological_scale: TISSUE
  description: >-
    Without MMP13, the cartilaginous matrix at the chondro-osseous junction is
    not degraded on schedule, so the orderly conversion of hypertrophic
    cartilage to metaphyseal bone is disrupted. In mice, ablation of Mmp13 alone
    or together with Mmp9 severely distorts the metaphyseal growth plate, which
    is the animal counterpart of the human lesion.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: collagen catabolic process
    modifier: DECREASED
    term:
      id: GO:0030574
      label: collagen catabolic process
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, ablation of Mmp9, Mmp13, or both Mmp9 and Mmp13 causes severe distortion of the metaphyseal growth plate.
    explanation: >-
      Mouse genetics establishing that loss of Mmp13 distorts the metaphyseal
      growth plate.
  downstream:
  - target: Metaphyseal Irregularity with Lower-Limb Deformity
    description: >-
      Disordered metaphyseal remodelling produces the fraying, splaying and
      cupping seen radiographically and the varus deformity that follows from
      asymmetric physeal growth.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40514045
      reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is characterized by mild short stature, genu varum, and metaphyseal irregularities including fraying, splaying, and cupping of the long bones.
      explanation: >-
        Describes the radiographic and clinical lesion this edge produces.
- name: Metaphyseal Irregularity with Lower-Limb Deformity
  biological_scale: ORGANISM
  description: >-
    The expressed disease: moderate short stature with disproportionate
    upper-to-lower segment ratio, genu varum, metaphyseal fraying, splaying and
    cupping, and coxa vara. Expressivity varies substantially even within a
    sibship, from a child with pain and deformity requiring surgery to a sibling
    with radiographic change alone. Extra-skeletal complications do not occur,
    but adults report persistent short stature and knee pain, so the disease is
    not regressive in the way metaphyseal anadysplasia is.
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MDST phenotype is associated with moderate short stature and knee pain in adults, while extra-skeletal complications are not observed.
    explanation: >-
      Long-term follow-up of the founding family establishing the persistent,
      skeletally confined adult phenotype.
  - reference: PMID:36873332
    reference_title: >-
      Metaphyseal Dysplasia, Spahr Type; A Case Report of Variable Expressivity in Non-Consanguineous Filipino Siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical consequences of these dysplastic changes are highly variable, but most uniformly include decreased stature, increased upper-to-lower segment proportions, genu varus, and knee pain.
    explanation: >-
      Source for the segment disproportion and the variability recorded in this
      node.

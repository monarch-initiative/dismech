discussions:
- discussion_id: gap_mdst_regressive_or_persistent
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is metaphyseal dysplasia, Spahr type regressive or persistent, and does the
    answer depend on which part of the phenotype is measured?
  attaches_to:
  - pathophysiology#Metaphyseal Irregularity with Lower-Limb Deformity
  - phenotypes#Disproportionate short stature
  rationale: >-
    The literature is not consistent. Long-term follow-up of the founding family
    reports moderate short stature and knee pain persisting in adults, while an
    independent sibship describes MDST as regressive. Both statements may be
    true of different components - radiographic metaphyseal change may resolve
    while stature and joint symptoms do not - but no series has separated them.
    Since regression is exactly the axis on which the nosology distinguishes this
    entity from dominant metaphyseal anadysplasia, resolving it would sharpen a
    classification boundary as well as prognostic counselling.
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MDST phenotype is associated with moderate short stature and knee pain in adults, while extra-skeletal complications are not observed.
    explanation: >-
      The persistence side of the disagreement, from adult follow-up of the
      founding family.
  - reference: PMID:27576021
    reference_title: >-
      Metaphyseal dysplasia, Spahr type; missense MMP13 mutations in two Iraqi siblings.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases confirm the phenotypic variability and regressive nature of MDST in addition to suggesting bone fragility as a feature.
    explanation: >-
      The regression side of the same disagreement, from an independent sibship.

biochemical:
- name: Serum calcium, phosphate, alkaline phosphatase and vitamin D
  presence: Normal
  context: >-
    All normal. This is the single most important laboratory observation in the
    disease, because it is what excludes the rickets that the radiographs
    otherwise suggest.
  evidence:
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical tests including calcium, phosphate, alkaline phosphatase, and vitamin D levels were all within normal ranges.
    explanation: >-
      Direct report of normal bone biochemistry in a molecularly confirmed
      patient.
genetic:
- name: MMP13
  association: Causal biallelic variant
  gene_term:
    preferred_term: MMP13
    term:
      id: hgnc:7159
      label: MMP13
  notes: >-
    Biallelic catalytic-domain variants. The founding family carried
    c.619T>G p.Trp207Gly; other families carry different missense and nonsense
    changes. Monoallelic prodomain variants in the same gene cause dominant
    metaphyseal anadysplasia instead.
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sequencing showed that MDST segregated with a c.619T>G single nucleotide transversion in MMP13.
    explanation: >-
      The segregating variant that established MMP13 as the causal gene.
  - reference: PMID:31413057
    reference_title: "Metaphyseal dysplasia, Spahr type: a mimicker of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of a 7-year-old boy, finally diagnosed with metaphyseal dysplasia, Spahr type (MDST) (OMIM # 250400) after his exome sequencing revealed novel variations in the MMP13 gene (OMIM * 600108).
    explanation: >-
      Independent confirmation of MMP13 in a separately ascertained patient.
environmental: []
treatments:
- name: Guided growth surgery for lower-limb deformity
  description: >-
    Physeal tethering of the distal femur and proximal tibia has been used for
    symptomatic varus deformity, with reduced pain at follow-up although the
    deformity itself persisted. No standard of care exists, and the evidence
    base is a handful of case reports.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Genu varum
    term:
      id: HP:0002970
      label: Genu varum
  target_mechanisms:
  - target: Metaphyseal Irregularity with Lower-Limb Deformity
    treatment_effect: MODULATES
    description: >-
      Redirects growth mechanically at the physis; it does nothing to the
      underlying collagenase deficiency.
    evidence:
    - reference: PMID:36873332
      reference_title: >-
        Metaphyseal Dysplasia, Spahr Type; A Case Report of Variable Expressivity in Non-Consanguineous Filipino Siblings.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At 16 months post tethering, she reports reduced pain although varus deformity persists.
      explanation: >-
        Reports symptomatic benefit without correction of the deformity, which
        is why the effect is recorded as partial.
  evidence:
  - reference: PMID:36873332
    reference_title: >-
      Metaphyseal Dysplasia, Spahr Type; A Case Report of Variable Expressivity in Non-Consanguineous Filipino Siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 presented at age 8 for medial ankle pain and bilateral lower extremity bowing of several years. Radiographs showed bilateral metaphyseal irregularities, and the patient underwent bilateral lateral distal femoral and proximal tibial physeal tethering at 9 years 11 months.
    explanation: >-
      The reported surgical intervention on which this treatment entry rests.
- name: Avoidance of unnecessary rickets treatment
  description: >-
    Because the disorder mimics rickets, affected children are commonly given
    vitamin D or phosphate before the diagnosis is made. Establishing MDST stops
    ineffective treatment and redirects care to orthopaedic follow-up.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we present a 39-month-old girl patient who was initially evaluated for rickets due to mild short stature, bowing of the lower extremities, and metaphyseal changes.
    explanation: >-
      Documents the initial rickets workup that molecular diagnosis redirects.
- name: Genetic counselling
  description: >-
    Recessive recurrence risk of 25% for siblings. Distinguishing MDST from
    dominant metaphyseal anadysplasia, which involves the same gene, changes the
    counselling entirely.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular confirmation of MDST allows distinction of it from dominant conditions (e.g., metaphyseal dysplasia, Schmid type; OMIM # 156500) and from more severe multi-system conditions (such as cartilage-hair hypoplasia; OMIM # 250250) and to give precise recurrence risks and prognosis.
    explanation: >-
      States that molecular confirmation is what enables accurate recurrence-risk
      counselling.
diagnosis:
- name: Skeletal radiography with normal bone biochemistry
  description: >-
    The diagnostic pattern is metaphyseal irregularity plus disproportionate
    short stature plus genu varum in a child whose bone biochemistry is normal.
    Advanced rather than delayed bone age further argues against rickets.
  results: >-
    Metaphyseal fraying, splaying and cupping with normal calcium, phosphate,
    alkaline phosphatase and vitamin D.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:36873332
    reference_title: >-
      Metaphyseal Dysplasia, Spahr Type; A Case Report of Variable Expressivity in Non-Consanguineous Filipino Siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Suspicion for MDST should be elevated in the setting of short-stature, upper-to-lower segment disproportionality, focal metaphyseal irregularities, and normal biochemical presentation.
    explanation: >-
      Explicit diagnostic-suspicion criteria from a clinical case series.
- name: MMP13 sequencing
  description: >-
    Exome or targeted sequencing confirms the diagnosis and, critically,
    assigns the mode of inheritance by showing whether the variants are
    biallelic and where in MMP13 they lie.
  results: >-
    Biallelic MMP13 variants, typically in the catalytic domain.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical exome sequencing identified a homozygous variant in the MMP13 gene, confirming the diagnosis of metaphyseal dysplasia Spahr type.
    explanation: >-
      Exome sequencing as the confirmatory diagnostic step.
differential_diagnoses:
- name: Rickets
  description: >-
    The dominant differential and the usual initial diagnosis. Clinical and
    radiological features overlap almost completely; biochemistry does not.
  distinguishing_features:
  - Calcium, phosphate, alkaline phosphatase and vitamin D are normal in MDST
  - Bone age may be advanced in MDST rather than delayed
  - No extra-skeletal complications
  evidence:
  - reference: PMID:40514045
    reference_title: "MMP13-related metaphyseal dysplasia: a differential diagnosis of rickets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is in the differential diagnosis of rickets, a relatively common disorder in childhood that shares similar clinical and radiological features with metaphyseal dysplasia.
    explanation: >-
      States the overlap that makes rickets the principal differential.
- name: Metaphyseal anadysplasia
  description: >-
    The dominant MMP13 entity, and the closest genetic mimic. It regresses
    spontaneously in childhood, whereas MDST persists.
  disease_term:
    preferred_term: metaphyseal anadysplasia
    term:
      id: MONDO:0015177

      id: MONDO:0060533
      label: microcephaly, short stature, and limb abnormalities
  display_name: Microcephaly, short stature, and limb abnormalities (MISSLA)
  description: >-
    The survivable presentation, with microcephaly and severe short stature
    alongside variable and generally milder limb findings - radial ray defects
    rather than limb reduction. Corresponds to OMIM 617604.
  genes:
  - preferred_term: DONSON
    term:
      id: hgnc:2993
      label: DONSON
- name: MGS-like
  display_name: DONSON-related Meier-Gorlin syndrome
  description: >-
    Neither an OMIM entry nor an ISDS row - a presentation, not a separate
    entity. Two apparently unrelated families homozygous for
    c.631C>T p.(Arg211Cys) had clinically typical Meier-Gorlin syndrome, and
    DONSON's later-established role in CMG helicase assembly explains why. No
    MONDO leaf exists for the DONSON-specific form, so this subtype carries no
    subtype_term; dismech also lists DONSON as a Meier-Gorlin gene in
    kb/disorders/Meier-Gorlin_Syndrome.yaml.
  genes:
  - preferred_term: DONSON
    term:
      id: hgnc:2993
      label: DONSON
  evidence:
  - reference: PMID:31407851
    reference_title: "Biallelic and De Novo Variants in DONSON Reveal a Clinical Spectrum of Cell Cycle-opathies with Microcephaly, Dwarfism and Skeletal Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two apparently unrelated families with identical homozygous c.631C > T p.(Arg211Cys) variant had clinical features typical of Meier-Gorlin syndrome (MGS), while two siblings with compound heterozygous c.346delG p.(Asp116Ile*62) and c.1349A > G p.(Lys450Arg) variants presented with Seckel-like phenotype."
    explanation: >-
      Establishes that a specific recurrent DONSON genotype produces a
      clinically typical Meier-Gorlin presentation, distinct from the
      Seckel-like presentation carried by other alleles in the same series.
- name: Seckel-like
  display_name: DONSON-related Seckel-like phenotype
  description: >-
    A third recognized presentation, again without its own OMIM or ISDS row.
    Reported in siblings compound heterozygous for a frameshift and a missense
    allele. Listed here so that the allele-to-presentation correspondence is
    recorded rather than collapsed into the spectrum label.
  genes:
  - preferred_term: DONSON
    term:
      id: hgnc:2993
      label: DONSON
  evidence:
  - reference: PMID:31407851
    reference_title: "Biallelic and De Novo Variants in DONSON Reveal a Clinical Spectrum of Cell Cycle-opathies with Microcephaly, Dwarfism and Skeletal Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings with compound heterozygous c.346delG p.(Asp116Ile*62) and c.1349A > G p.(Lys450Arg) variants presented with Seckel-like phenotype"
    explanation: >-
      The Seckel-like arm of the same four-family series.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0200 "Microcephalic osteodysplastic primordial
      dwarfism, or microcephaly-short stature-micromelia-limb abnormalities,
      DONSON-related" (AR, OMIM 251230 and 617604). The row itself already lumps
      two published entities under one heading, which is why this entry is bound
      to the MONDO spectrum term rather than to either leaf. Note that the
      DONSON-Meier-Gorlin association is not represented in that row: it
      postdates the table's close, and dismech curates DONSON as a
      Meier-Gorlin gene in kb/disorders/Meier-Gorlin_Syndrome.yaml. Both
      placements sit in group 21, so nothing about the classification turns on
      which name is used.

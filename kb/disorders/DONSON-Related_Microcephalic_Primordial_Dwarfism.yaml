    label: DONSON-related microcephaly-short stature-limb abnormalities spectrum
parents:
- Autosomal recessive disease
- Primordial dwarfism
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0200 "Microcephalic osteodysplastic primordial
      dwarfism, or microcephaly-short stature-micromelia-limb abnormalities,
      DONSON-related" (AR, OMIM 251230 and 617604). The row itself already lumps
      two published entities under one heading, which is why this entry is bound
      to the MONDO spectrum term rather than to either leaf. Note that the
      DONSON-Meier-Gorlin association is not represented in that row: it
      postdates the table's close, and dismech curates DONSON as a
      Meier-Gorlin gene in kb/disorders/Meier-Gorlin_Syndrome.yaml. Both
      placements sit in group 21, so nothing about the classification turns on
      which name is used.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population rate published. Twenty-nine individuals with microcephalic
    dwarfism were reported in the gene-discovery study, drawn from a screen of
    over 250 patients, which the authors describe as making DONSON a common
    cause of microcephalic dwarfism relative to other genes in this group.
  evidence:
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify downstream neighbor of SON (DONSON) as a novel fork protection factor and report biallelic DONSON mutations in 29 individuals with microcephalic dwarfism"
    explanation: >-
      Gives the cohort size behind the gene discovery.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic hypomorphic DONSON variants, homozygous or compound heterozygous.
    Complete loss would be expected to be lethal, since DONSON is essential for
    chromosome duplication.
  evidence:
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants segregated amongst family members in a manner consistent with an autosomal recessive trait"
    explanation: >-
      Segregation across the discovery families establishes recessive
      inheritance.
genetic:
- name: DONSON
  gene_term:
    preferred_term: DONSON
    term:
      id: hgnc:2993
      label: DONSON
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    DONSON (21q22.11, "Downstream neighbour of SON") encodes a replisome
    component. Disease alleles are hypomorphic and substantially reduce DONSON
    protein levels rather than abolishing them; a recurrent homozygous
    c.1297C>T (p.Pro433Ser) has been reported in a Meier-Gorlin-predominant
    presentation.
  evidence:
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomorphic mutations in DONSON substantially reduce DONSON protein levels and impair fork stability in cells from patients"
    explanation: >-
      Characterizes the disease alleles as hypomorphic and links them to the
      cellular defect.
  - reference: PMID:35298084
    reference_title: "Microcephalic primordial dwarfism with predominant Meier-Gorlin phenotype, ichthyosis, and multiple joint deformities-Further expansion of DONSON Cell Cycle-opathy phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing revealed a pathogenic homozygous variant c.C1297T (p.Pro433Ser) in the exon 8 of DONSON gene."
    explanation: >-
      A specific recurrent allele, in a case presenting at the Meier-Gorlin end
      of the spectrum.
pathophysiology:
- name: Reduced DONSON Protein Level
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic hypomorphic variants substantially reduce, but do not abolish,
    DONSON protein. The residual level matters: DONSON is essential for
    chromosome duplication, so only partial loss is compatible with development.
  genes:
  - preferred_term: DONSON
    term:
      id: hgnc:2993
      label: DONSON
  downstream:
  - target: Impaired CMG Helicase Assembly
  - target: Replication Fork Instability and Nucleolytic Collapse
  evidence:
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomorphic mutations in DONSON substantially reduce DONSON protein levels and impair fork stability in cells from patients, consistent with defective DNA replication underlying the disease phenotype"
    explanation: >-
      Quantifies the primary molecular lesion and links it to the disease.
- name: Impaired CMG Helicase Assembly
  biological_scale: MOLECULAR
  description: >-
    DONSON binds directly but transiently to CDC45-MCM-GINS during S phase and
    is essential for assembling the helicase. It is dispensable for loading the
    MCM2-7 core onto chromatin in G1 - so the defect is specifically at the
    conversion of loaded MCM2-7 double hexamers into active CMG, not at
    licensing. This is the step that places DONSON alongside the twelve other
    Meier-Gorlin genes.
  cellular_components:
  - preferred_term: CMG complex
    term:
      id: GO:0071162
      label: CMG complex
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  downstream:
  - target: Reduced Progenitor Proliferation and Prenatal Growth Failure
  evidence:
  - reference: PMID:37781960
    reference_title: "DONSON is required for CMG helicase assembly in the mammalian cell cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that DONSON binds directly but transiently to CDC45-MCM-GINS during S-phase and is essential for chromosome duplication"
    explanation: >-
      Establishes the direct interaction and the essentiality.
  - reference: PMID:37781960
    reference_title: "DONSON is required for CMG helicase assembly in the mammalian cell cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DONSON is dispensable for loading of the MCM2-7 helicase core onto chromatin during G1-phase, but instead is essential for CDC45-MCM-GINS assembly during S-phase"
    explanation: >-
      Localizes the defect to helicase assembly rather than to origin licensing,
      which is the distinction this node draws.
  - reference: PMID:37781960
    reference_title: "DONSON is required for CMG helicase assembly in the mammalian cell cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "provide a molecular explanation for why mutations in human DONSON are associated with Meier-Gorlin syndrome"
    explanation: >-
      Connects the assembly role to the Meier-Gorlin phenotype, which is what
      makes DONSON the thirteenth gene of that disorder.
- name: Replication Fork Instability and Nucleolytic Collapse
  biological_scale: CELLULAR
  description: >-
    The mechanism identified first, and distinct from the assembly defect:
    DONSON stabilizes forks during replication, and its loss causes severe
    replication-associated DNA damage arising from nucleolytic cleavage of
    stalled forks. ATR-dependent replication-stress signalling is also impaired,
    so checkpoint activity falls and chromosomal instability is potentiated -
    the cell both accumulates damage and fails to respond to it.
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
    modifier: DECREASED
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: ABNORMAL
  downstream:
  - target: Reduced Progenitor Proliferation and Prenatal Growth Failure
  evidence:
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of DONSON leads to severe replication-associated DNA damage arising from nucleolytic cleavage of stalled replication forks."
    explanation: >-
      The fork-collapse mechanism, stated directly.
  - reference: PMID:28191891
    reference_title: "Mutations in DONSON disrupt replication fork stability and cause microcephalic dwarfism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATR-dependent signaling in response to replication stress is impaired in DONSON-deficient cells, resulting in decreased checkpoint activity and the potentiation of chromosomal instability"
    explanation: >-
      Documents the second arm - a failed damage response on top of the damage
      itself.
- name: Reduced Progenitor Proliferation and Prenatal Growth Failure
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The organism-level endpoint: prenatal-onset microcephaly with short stature
    and, at the more severe end, limb reduction. Mouse work supports a
    progenitor-depletion route to the microcephaly specifically - Donson is
    essential for progenitors of both cortical glutamatergic and GABAergic
    neurons.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:33739968
    reference_title: "The microcephaly gene Donson is essential for progenitors of cortical glutamatergic and GABAergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Emx1-Cre-mediated Donson deletion in progenitors of cortical glutamatergic neurons caused extensive apoptosis in the early dorsomedial neuroepithelium, thus preventing formation of the neocortex and hippocampus."
    explanation: >-
      A conditional mouse deletion showing that removing Donson from cortical
      progenitors kills them and prevents neocortex formation - the
      progenitor-depletion route to microcephaly this node asserts.

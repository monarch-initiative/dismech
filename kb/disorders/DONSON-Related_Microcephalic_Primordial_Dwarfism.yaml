name: DONSON-Related Microcephalic Primordial Dwarfism
creation_date: "2026-08-27T04:30:00Z"
category: Mendelian
synonyms:
- DONSON-related microcephaly-short stature-limb abnormalities spectrum
- microcephaly-micromelia syndrome
- MIMIS
- microcephaly, short stature, and limb abnormalities
- MISSLA
- DONSON-related Meier-Gorlin syndrome
description: >-
  Biallelic DONSON variants cause a spectrum of microcephalic primordial
  dwarfism that the literature has named three times over:
  microcephaly-micromelia syndrome, microcephaly with short stature and limb
  abnormalities
  (MISSLA), and Meier-Gorlin syndrome - reflecting which cohort the patients
  were ascertained in rather than three distinct diseases. DONSON is a
  replisome component. Its function was established in two stages: first as a
  replication fork protection factor whose loss causes nucleolytic cleavage of
  stalled forks and impaired ATR-dependent replication-stress signalling, and
  later, unexpectedly, as an essential assembly factor for the CDC45-MCM-GINS
  (CMG) helicase during S phase. That second finding is what makes DONSON the
  thirteenth Meier-Gorlin gene: the other twelve encode CMG subunits or
  established CMG assembly factors, and DONSON turned out to belong to the same
  process despite having no orthologue in budding yeast, where replication
  initiation can be reconstituted without it.

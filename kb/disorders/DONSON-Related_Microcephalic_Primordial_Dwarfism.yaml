diagnosis:
- name: Molecular genetic testing of DONSON
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Biallelic hypomorphic DONSON variants
  description: >-
    There is no clinical criterion set, and there could not usefully be one:
    the same gene presents as microcephaly-micromelia syndrome, MISSLA,
    Meier-Gorlin syndrome, a Seckel-like phenotype, and in one instance
    Femoral-Facial syndrome, so the clinical label a patient arrives with does
    not predict the gene and the gene does not predict the label. Sequencing
    reached the diagnosis in every reported case. Two practical points: the
    variants are hypomorphic rather than null, so a result should not be
    dismissed for retaining residual protein; and while biallelic inheritance
    is the rule, a de novo heterozygous variant has been reported.
  evidence:
  - reference: PMID:31407851
    reference_title: "Biallelic and De Novo Variants in DONSON Reveal a Clinical Spectrum of Cell Cycle-opathies with Microcephaly, Dwarfism and Skeletal Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four unrelated families with five affected individuals having biallelic or de novo variants in DONSON presenting with a core phenotype of severe short stature (z score < -3 SD), additional skeletal abnormalities, and microcephaly."
    explanation: >-
      Establishes the core phenotype that prompts testing, and that both
      biallelic and de novo variants are found.
  - reference: PMID:31407851
    reference_title: "Biallelic and De Novo Variants in DONSON Reveal a Clinical Spectrum of Cell Cycle-opathies with Microcephaly, Dwarfism and Skeletal Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe novel biallelic and de novo variants that are associated with MGS, Seckel-like phenotype and FFS, the last of which has not been associated with any disease gene to date."
    explanation: >-
      The range of clinical labels a DONSON result can sit under, which is why
      the diagnosis is molecular rather than clinical.
discussions:
- discussion_id: donson_two_mechanisms
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired CMG Helicase Assembly
  - pathophysiology#Replication Fork Instability and Nucleolytic Collapse
  prompt: >-
    Are the CMG-assembly defect and the fork-protection defect two consequences
    of one molecular role for DONSON, or two separable functions? And which of
    them accounts for the phenotypic range from Meier-Gorlin syndrome to
    microcephaly-micromelia?
  rationale: >-
    The two mechanisms were established six years apart in different systems and
    have never been reconciled. Both are well evidenced, both would plausibly
    produce microcephalic dwarfism, and the entry curates them as parallel
    downstream nodes because nothing in the literature orders them. If the
    severity range across the DONSON spectrum tracks one mechanism more than the
    other, that would be the most useful thing to know about this gene, and it
    is not known.

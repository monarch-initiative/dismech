notes: >-
  IGF1 deficiency sits within the broader clinical category of severe primary
  IGF-1 deficiency (SPIGFD), which also includes growth hormone receptor (GHR)
  defects (Laron syndrome) and other GH-IGF axis gene defects. No GeneReviews
  chapter covers IGF1 deficiency. Orphanet HPO frequency tiers for ORPHA:73272
  derive from a very small number of published homozygous IGF1 probands, so
  findings from single early families carry high apparent percentage bands.
  Specific Orphanet HPO terms (Micrognathia HP:0000347, Delayed eruption of
  teeth HP:0000684, Clinodactyly of the 5th finger HP:0004209, Hyperactivity
  HP:0000752, Short attention span HP:0000736, and Atypical behavior
  HP:0000708) are curated in preference to coarse or overlapping Orphanet rows
  (Abnormal facial shape HP:0001999, Abnormality of the mouth HP:0000153,
  Clinodactyly HP:0030084, Attention deficit hyperactivity disorder HP:0007018,
  Small for gestational age HP:0001518, and severity- or onset-qualified
  duplicates of intrauterine/postnatal growth retardation, intellectual
  disability, and sensorineural hearing impairment); isolated perinatal
  findings from single case reports (Neonatal hyperbilirubinemia HP:0003265,
  Small placenta HP:0006266) are not separately modeled as core disease
  phenotypes.

  - target: Intellectual disability
    description: >-
      Impaired IGF-1-dependent neurodevelopment can produce intellectual
      disability.
  - target: Global developmental delay
    description: >-
      Impaired fetal and postnatal neural growth delays developmental
      milestones.
  - target: Delayed Skeletal Maturation
    description: >-
      Deficient IGF-1/IGF1R growth-plate signaling delays epiphyseal bone
      maturation.

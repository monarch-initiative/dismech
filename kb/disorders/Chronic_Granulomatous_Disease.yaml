    causal_link_type: DIRECT
    description: A non-functional NADPH oxidase cannot generate superoxide, abolishing the respiratory burst and downstream reactive oxygen species.
- name: Failed respiratory burst and ROS deficiency
  conforms_to: "phagocyte_oxidative_burst_failure#Failed Respiratory Burst and Phagosomal ROS Deficiency"
  description: >-
    The assembled NADPH oxidase normally catalyzes the respiratory (oxidative)
    burst, reducing molecular oxygen to superoxide, which is dismutated and
    converted to hydrogen peroxide, hypohalous acids, and other reactive oxygen
    species within the phagosome. In CGD this burst is absent or markedly
    reduced, so phagocytes ingest microbes but fail to generate the oxidants
    required for efficient microbicidal activity.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: respiratory burst
    term:
      id: GO:0045730
      label: respiratory burst
    modifier: DECREASED
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "resulting from impaired killing of bacteria and fungi"
    explanation: The oxidase defect produces impaired phagocyte killing of bacteria and fungi via loss of the oxidative burst.
  downstream:
  - target: Impaired microbial killing and recurrent infection
    causal_link_type: DIRECT
    description: Loss of oxidant-dependent killing leaves phagocytes unable to clear catalase-positive bacteria and fungi, producing recurrent severe infection.
  - target: Dysregulated inflammation and granuloma formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired resolution of inflammation
    - persistent macrophage activation
    description: Loss of ROS-dependent signaling impairs resolution of inflammation and drives exuberant granuloma formation and colitis.
  - target: Loss of oxidase-dependent mitochondrial ROS signaling
    causal_link_type: DIRECT
    description: >-
      The phagocyte oxidase does not only deliver oxidants into the phagosome; its
      activity is also the upstream signal that drives PPAR-gamma-dependent
      mitochondrial oxidant production. Losing the oxidase therefore removes that
      signal as well as the phagosomal oxidant itself.
    evidence:
    - reference: PMID:25498313
      reference_title: >-
        Pioglitazone restores phagocyte mitochondrial oxidants and bactericidal
        capacity in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the data support the hypothesis that signaling from the NADPH oxidase under
        normal circumstances governs phagocyte mtROS production and that such
        signaling is lacking in the absence of a functioning phagocyte oxidase
      explanation: >-
        States the directional claim this edge makes - oxidase activity governs
        mitochondrial ROS production, and that governance is lost when the oxidase
        is absent. Graded MODEL_ORGANISM because the conclusion rests on the
        gp91phox-null mouse experiments the same paper reports.
  - target: Defective phagosomal autophagy
    causal_link_type: DIRECT
    description: >-
      CGD phagocytes fail to recruit LC3 to the phagosome, so the autophagic arm of
      phagosome handling is defective alongside the oxidative one.
    evidence:
    - reference: PMID:27702670
      reference_title: >-
        Mammalian target of rapamycin inhibition counterbalances the inflammatory
        status of immune cells in patients with chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        phagocytes from patients with CGD display a defect in autophagy and a
        reactive oxygen species-independent activation of the inflammasome
      explanation: >-
        Ties the autophagy defect to the oxidase-deficient phagocyte, which is the
        step this edge asserts. Marked BACKGROUND because the sentence summarises
        prior studies rather than this paper's own result, and IN_VITRO because
        those studies measured patient phagocytes ex vivo.
- name: Loss of oxidase-dependent mitochondrial ROS signaling
  biological_scale: CELLULAR
  description: >-
    A second, non-phagosomal consequence of the same lesion. In normal phagocytes
    NADPH oxidase activity signals through PPAR-gamma to drive mitochondrial
    reactive oxygen species production; in CGD phagocytes that mitochondrial
    oxidant pool is itself deficient. This node is the target of PPAR-gamma
    agonism (pioglitazone), which raises mitochondrial oxidants without repairing
    the NADPH oxidase, and is therefore a separate point of intervention from the
    oxidase complex itself.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: mitochondrial reactive oxygen species production
    term:
      id: GO:1903409
      label: reactive oxygen species biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:25498313
    reference_title: >-
      Pioglitazone restores phagocyte mitochondrial oxidants and bactericidal
      capacity in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      although mitochondrial (mt)ROS were deficient in gp91(phox-/-) phagocytes,
      their restoration with treatment significantly enabled killing of S aureus
      both ex vivo and in vivo
    explanation: >-
      Establishes that the mitochondrial oxidant pool is deficient in
      oxidase-null phagocytes and that restoring it improves killing, which is
      what makes this a distinct node rather than a restatement of the phagosomal
      burst defect.
  - reference: PMID:26386811
    reference_title: >-
      Impaired efferocytosis in human chronic granulomatous disease is reversed by
      pioglitazone treatment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      We have shown that PPARγ activation occurs downstream of the activated NADPH
      oxidase and is lacking in CGD phagocytes, but can be restored by pioglitazone
    explanation: >-
      Names PPAR-gamma as the step between oxidase activity and the mitochondrial
      oxidant pool, and records that it is pharmacologically restorable. Marked
      BACKGROUND because the authors are restating their own earlier work in the
      discussion of this paper.
  downstream:
  - target: Impaired efferocytosis of apoptotic cells
    causal_link_type: DIRECT
    description: >-
      PPAR-gamma-dependent metabolic programming is what equips a macrophage to
      take up and digest dying cells, so the same lost signal leaves efferocytosis
      deficient.
  - target: Impaired microbial killing and recurrent infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - deficient mitochondrial oxidant delivery to the phagosome
    description: >-
      Restoring the mitochondrial oxidant pool pharmacologically improves killing
      of Staphylococcus aureus in the oxidase-null mouse, so its deficiency
      contributes to the killing defect on top of the absent phagosomal burst. The
      human counterpart of that benefit is not established.
- name: Impaired efferocytosis of apoptotic cells
  biological_scale: CELLULAR
  description: >-
    CGD monocytes and macrophages take up apoptotic cells poorly while ordinary
    phagocytosis of microbes is preserved. Because efferocytosis normally
    suppresses inflammatory mediator production, failing to clear dying cells
    leaves a persistent pro-inflammatory stimulus in tissue.
  cell_types:

discussions:
- discussion_id: ifn_gamma_mechanism_in_cgd
  prompt: >-
    Interferon gamma prophylaxis halves serious infections in CGD, yet the trial
    that showed this measured no change in phagocyte superoxide production. By what
    mechanism does it work, and which pathophysiology node should carry the edge?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failed respiratory burst and ROS deficiency
  - treatments#Interferon-gamma prophylaxis
  rationale: >-
    The tempting shortcut is to curate interferon gamma as an agent that restores
    the respiratory burst, because it is the one drug in standard CGD prophylaxis
    that acts on the host rather than on the microbe. The pivotal randomized trial
    rules that out explicitly: the clinical benefit was unambiguous and superoxide
    production did not move. So the edge in this entry is MODULATES on the
    downstream killing node rather than RESTORES on the oxidase, and the mechanism
    of benefit is left open rather than guessed at. The same question is recorded
    upstream in the phagocyte_oxidative_burst_failure module, which declines to put
    interferon gamma in its treatments block at all for this reason; this entry
    records the drug because it is standard care here, with the mechanism claim kept
    deliberately weak. Candidate answers include non-oxidative antimicrobial
    programmes and the metabolic rewiring reported in the transcriptomic dataset
    linked in this entry's datasets block, which is controlled-access and was not
    analysed here.
  evidence:
  - reference: PMID:1846940
    reference_title: >-
      A controlled trial of interferon gamma to prevent infection in chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there were no significant changes in the measures of superoxide
      production by phagocytes.
    explanation: >-
      The negative mechanistic result inside the positive clinical trial, which is the
      gap this discussion records.
  - reference: PMID:1846940
    reference_title: >-
      A controlled trial of interferon gamma to prevent infection in chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In terms of the time to the first serious infection, there was a clear benefit
      from interferon as compared with placebo (P = 0.0006).
    explanation: >-
      The other half of the puzzle: the clinical effect is clear, so the open question
      is the mechanism and not whether the drug works.

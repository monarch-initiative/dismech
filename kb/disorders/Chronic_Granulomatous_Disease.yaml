      than previous CRISPR nuclease and donor template approaches.
    explanation: >-
      The editing efficiency achieved in patient-derived hematopoietic stem and
      progenitor cells, which is the preclinical basis for the X-linked base-editing
      trial. Graded IN_VITRO because the measurement is in cultured human HSPCs; the
      same paper also reports persistence after transplantation into mice.
- name: Avoidance of high-risk exposures (agents/circumstances to avoid)
  description: >-
    Per GeneReviews, patients with CGD should avoid decayed organic matter
    (mulching, gardening, leaf raking, house demolition), because inhalation of
    fungal spores can cause fulminant pneumonitis, and should avoid live
    bacterial vaccines including bacille Calmette-Guerin (BCG) and Salmonella
    typhi vaccination.

    modifier: INCREASED
  evidence:
  - reference: PMID:20495074
    reference_title: >-
      Inflammasome activation in NADPH oxidase defective mononuclear phagocytes from
      patients with chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      mononuclear phagocytes from CGD patients activated caspase-1 and produced

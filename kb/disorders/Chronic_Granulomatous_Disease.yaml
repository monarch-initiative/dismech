      explanation: CGD is a Mendelian single-gene (NADPH oxidase subunit) disorder, supporting placement in Harrison's genetics Part.
  iuis_category:
    classification_value: phagocyte defect
    notes: >-
      IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970),
      Table 5 "Congenital defects of phagocyte number or function", section 3
      (Defects of Respiratory Burst). This entry covers all six Table 5
      respiratory-burst rows, one per NADPH oxidase component, and its
      has_subtypes list matches them exactly: CYBB (XL, MIM 306400), CYBA (AR,
      MIM 608508), CYBC1/EROS (AR, MIM 618334), NCF1 (AR, MIM 608512), NCF2
      (AR, MIM 608515) and NCF4 (AR, MIM 613960). The affected function is
      killing through faulty O2- production, on the functional rather than the
      quantitative axis of the table: phagocytes are present in normal numbers
      and cannot kill.

      The seventh row of that section, G6PD deficiency class I (MIM 305900),
      is a separate disease and is not covered here.
    evidence:
    - reference: PMID:22876374
      reference_title: "Chronic Granulomatous Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Chronic granulomatous disease (CGD) is a primary \nimmunodeficiency disorder of phagocytes"
      explanation: As a congenital defect of phagocyte function, CGD is classified in the IUIS "phagocyte defect" category (Table 5 lists CGD explicitly).
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "X-linked chronic granulomatous disease (CGD), gp91phox CYBB XL 306400"
      explanation: >-
        The Table 5 row for X-linked CGD, quoted verbatim from the IUIS
        classification itself with its gene, inheritance and OMIM number. Cites
        the source that makes the classification rather than a review that
        describes the disease.
prevalence:
- population: United States
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_low: 0.4
  rate_high: 0.5
  notes: >-
    A US national registry estimated a minimum birth incidence of roughly
    1/200,000 to 1/250,000 live births (0.4-0.5 per 100,000) for the period
    1980-1989; of 368 registered patients, the majority (259) had the X-linked
    form. Because the registry figure is explicitly a MINIMUM estimate from
    voluntary registration, the true birth prevalence is likely higher.
  evidence:

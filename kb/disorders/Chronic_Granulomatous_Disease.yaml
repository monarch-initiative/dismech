    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      freshly isolated monocytes from CGD subjects were significantly impaired in
      the ability to take up both apoptotic Jurkat cells and carboxylated beads in
      comparison to monocytes from normal healthy volunteers
    explanation: >-
      Measures the defect in patient monocytes directly. The same paper reports
      that uptake of killed Candida was unimpaired, which is why this node is
      scoped to apoptotic-cell clearance rather than to phagocytosis in general.
  downstream:
  - target: Dysregulated inflammation and granuloma formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Uncleared dying cells are a candidate driver of the prolonged, granulomatous
      inflammation of CGD. The link is stated as a hypothesis by the source rather
      than demonstrated, so it is recorded as indirect with unknown intermediates.
    evidence:
    - reference: PMID:26386811
      reference_title: >-
        Impaired efferocytosis in human chronic granulomatous disease is reversed by
        pioglitazone treatment.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Defects in efferocytosis, the process of clearing dying cells by
        macrophages, may contribute to the heightened, prolonged, and granulomatous
        inflammation in this disease
      explanation: >-
        The source's own wording is "may contribute", which is the strength of
        this edge: a proposed contribution, not an established one.
- name: Defective phagosomal autophagy
  biological_scale: CELLULAR
  description: >-
    CGD macrophages and monocytes recruit almost no LC3 to the phagosome, so
    LC3-associated phagosome handling is defective. This matters therapeutically
    because the autophagy defect is what links the oxidase lesion to excess IL-1
    beta release, and because both IL-1 receptor blockade and mTOR inhibition act
    at this point rather than on the oxidase.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:24550444
    reference_title: >-
      IL-1 receptor blockade restores autophagy and reduces inflammation in chronic
      granulomatous disease in mice and in humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      blood monocytes from CGD patients display minimal recruitment of
      microtubule-associated protein 1 light chain 3 (LC3) to phagosomes
    explanation: >-
      Measures the autophagy defect in patient monocytes. The same sentence reports
      the murine counterpart; only the human clause is quoted here so the graded
      evidence source matches the quote.
  downstream:
  - target: ROS-independent inflammasome activation and IL-1 beta release
    causal_link_type: DIRECT
    description: >-
      Failed autophagic handling of the phagosome is what permits the excess IL-1
      beta release, and restoring autophagy reduces it.
    evidence:
    - reference: PMID:24550444
      reference_title: >-
        IL-1 receptor blockade restores autophagy and reduces inflammation in chronic
        granulomatous disease in mice and in humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This defect in autophagy results in increased IL-1β release."
      explanation: >-
        States the causal direction of this edge in the authors' own words.
- name: ROS-independent inflammasome activation and IL-1 beta release
  biological_scale: CELLULAR
  description: >-
    Mononuclear phagocytes lacking a functional oxidase still activate caspase-1
    and release biologically active IL-1 beta, and do so more strongly than normal
    cells - so inflammasome activation in CGD proceeds without ROS rather than
    requiring it. This is the node that explains why a disease of absent oxidants
    is hyperinflammatory, and it is the target of IL-1 receptor blockade.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:

- name: Autologous hematopoietic stem cell gene therapy
  description: >-
    Ex vivo autologous CD34+ hematopoietic stem and progenitor cell lentiviral gene
    therapy (the self-inactivating G1XCGD vector for X-linked CGD) is an emerging
    curative approach for patients lacking a matched donor, restoring
    oxidase-positive neutrophils and functional superoxide production. The
    self-inactivating design exists because the first-generation gammaretroviral
    vectors, while clinically effective, caused insertional activation of
    MDS1-EVI1, PRDM16 and SETBP1 and clonal myeloid expansion.
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: NADPH oxidase (NOX2) complex assembly failure
    treatment_effect: RESTORES
    description: Ex vivo lentiviral correction of autologous stem cells restores functional NADPH oxidase (gp91phox) expression in the phagocyte lineage.
  evidence:
  - reference: PMID:31988463
    reference_title: "Lentiviral gene therapy for X-linked chronic granulomatous disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six of the seven surviving patients demonstrated \nstable vector copy numbers (0.4-1.8 copies per neutrophil) and the persistence \nof 16-46% oxidase-positive neutrophils"
    explanation: A multicenter trial showed lentiviral gene therapy restored persistent oxidase-positive neutrophils in X-CGD patients.
  - reference: PMID:31988463
    reference_title: "Lentiviral gene therapy for X-linked chronic granulomatous disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that autologous gene therapy is a \npromising approach for CGD patients"
    explanation: The trial concludes autologous gene therapy is a promising approach for CGD.
  - reference: PMID:16582916
    reference_title: >-
      Correction of X-linked chronic granulomatous disease by gene therapy, augmented
      by insertional activation of MDS1-EVI1, PRDM16 or SETBP1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large-scale retroviral integration site-distribution analysis showed activating
      insertions in MDS1-EVI1, PRDM16 or SETBP1 that had influenced regulation of
      long-term hematopoiesis by expanding gene-corrected myelopoiesis three- to
      four-fold in both individuals.
    explanation: >-
      The genotoxicity finding from the first gammaretroviral trial, which is why
      current vectors are self-inactivating. Cited as the historical basis for the
      design, not as support for using a gammaretroviral vector now.
- name: Autologous hematopoietic stem cell gene editing (prime and base editing)
  description: >-
    Gene editing corrects the patient's own mutation in situ rather than adding a
    transgene, which avoids both a donor and a randomly integrating vector. PM359
    corrects the recurrent NCF1 exon 2 GT deletion that causes most p47phox-deficient
    CGD by prime editing of autologous CD34+ cells: two treated participants engrafted
    promptly and showed NADPH oxidase activity in neutrophils within a month,
    sustained to last follow-up at six and four months. A separate adenine
    base-editing approach corrects the prototypical CYBB c.676C>T mutation in patient
    HSPCs at up to 70% efficiency and has entered a first-in-human trial. Both are
    early-phase: two participants and a few months of follow-up are a demonstration of
    engraftment and oxidase activity, not of clinical benefit or long-term safety.
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_EDITING
  target_mechanisms:
  - target: NADPH oxidase (NOX2) complex assembly failure
    treatment_effect: RESTORES
    description: >-
      Correcting the causal variant in autologous stem cells yields phagocytes that
      assemble a working oxidase, restoring the activity this node reports as lost -
      the same target as lentiviral gene addition and allogeneic transplantation,
      reached without a vector insertion or a donor.
    evidence:
    - reference: PMID:41358590
      reference_title: Prime Editing for p47(phox)-Deficient Chronic Granulomatous Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NADPH oxidase activity was observed in neutrophils within 1 month and was
        maintained for 6 months and 4 months as of the last follow-up visit in
        Participants 1 and 2, respectively.
      explanation: >-
        Measures restored oxidase activity in the treated patients' own neutrophils,
        which is the node-level effect this edge asserts, with the follow-up duration
        visible.
  evidence:
  - reference: PMID:41358590
    reference_title: Prime Editing for p47(phox)-Deficient Chronic Granulomatous Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We developed PM359, an autologous CD34+ hematopoietic stem-cell therapy in which
      prime editing is used to correct delGT.
    explanation: >-
      Identifies the product and the editing approach, and the specific NCF1 allele it
      corrects.
  - reference: PMID:41358590
    reference_title: Prime Editing for p47(phox)-Deficient Chronic Granulomatous Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support further investigation of prime editing of CD34+ cells to
      treat p47-CGD.
    explanation: >-
      The authors' conclusion, which claims support for further investigation rather

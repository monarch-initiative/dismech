- name: X-linked CYBB
  display_name: X-linked CGD (CYBB / gp91phox)
  subtype_term:
    preferred_term: granulomatous disease, chronic, X-linked
    term:
      id: MONDO:0010600
      label: granulomatous disease, chronic, X-linked
  description: >-
    The most common form (about two-thirds of cases), caused by hemizygous
    pathogenic variants in CYBB at Xp21.1, encoding gp91phox (NOX2), the
    catalytic membrane subunit. Typically the most severe form with earliest
    onset. A larger deletion extending into the neighbouring XK/Kell locus can
    additionally produce McLeod neuroacanthocytosis syndrome, curated separately
    in kb/disorders/McLeod_Neuroacanthocytosis_Syndrome.yaml. OMIM phenotype:
    306400 (MONDO:0010600).

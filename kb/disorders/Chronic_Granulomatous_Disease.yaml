biochemical:
- name: Residual neutrophil reactive oxygen intermediate production
  notes: >-
    The quantitative form of the diagnostic test. Rather than treating the
    oxidative burst as present or absent, residual reactive oxygen intermediate
    production is measured as a continuous variable (ferricytochrome c reduction,
    or percentage of dihydrorhodamine-positive neutrophils by flow cytometry) and
    tracks disease severity and survival independently of which subunit gene is
    affected. It is therefore both the diagnostic readout of the oxidase lesion and
    the single best prognostic marker in CGD. No LOINC code is bound: none was
    looked up and cached for this measurement in this curation pass, and a label
    typed from memory is not acceptable here.
  biomarker_term:
    preferred_term: residual reactive oxygen intermediate production by neutrophils
    term:
      id: NCIT:C80367
      label: Reactive Oxygen Species
  presence: Reduced or absent
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  readouts:
  - target: Failed respiratory burst and ROS deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The assay measures the output of the respiratory burst, so a low or absent
      value is the direct functional expression of this node. It does not identify
      which subunit is defective; that needs molecular testing.
    evidence:
    - reference: PMID:21190454
      reference_title: Residual NADPH oxidase and survival in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Residual ROI production was measured with the use of superoxide-dependent
        ferricytochrome c reduction and flow cytometry with dihydrorhodamine
        oxidation assays.
      explanation: >-
        Names the two assays that constitute this readout, in the study of 287
        patients that established its prognostic value.
  - target: Impaired microbial killing and recurrent infection
    relationship: PREDICTS
    direction: NEGATIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      More residual production means less severe illness and better survival; the
      relationship holds as a continuous variable and independently of the affected
      gene, so it is not a restatement of genotype. Mortality curves separate after
      adolescence rather than in childhood.
    evidence:
    - reference: PMID:21190454
      reference_title: Residual NADPH oxidase and survival in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Survival of patients with chronic granulomatous disease was strongly
        associated with residual ROI production as a continuous variable,
        independently of the specific gene affected.
      explanation: >-
        States the prognostic association and its independence from genotype, which
        is what this readout claims.
    - reference: PMID:21190454
      reference_title: Residual NADPH oxidase and survival in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After adolescence, mortality curves diverged according to the extent of
        residual ROI production.
      explanation: >-
        Records when the prognostic separation appears, which bears on how the
        marker is used in deciding the timing of curative therapy.
    - reference: PMID:41358590
      reference_title: Prime Editing for p47(phox)-Deficient Chronic Granulomatous Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        partial residual NADPH oxidase activity (20% DHR positive neutrophils) is
        sufficient to protect from severe infection
      explanation: >-
        Gives the threshold that gene-correction trials treat as the efficacy target,
        which is how this prognostic marker is used as a therapeutic endpoint.
        Marked BACKGROUND because the sentence is the trial report's framing, citing
        the prognostic study above.
  evidence:
  - reference: PMID:21190454
    reference_title: Residual NADPH oxidase and survival in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The production of residual ROI is predicted by the specific NADPH oxidase
      mutation, regardless of the specific gene affected, and it is a predictor of
      survival in patients with chronic granulomatous disease.
    explanation: >-
      Establishes the marker's two properties this entry relies on: it is set by the
      particular mutation rather than by which gene carries it, and it predicts
      survival.
inheritance:
- name: X-linked (CYBB)
  description: >-
    CGD due to a CYBB pathogenic variant is inherited in an X-linked manner; a
    heterozygous mother has a 50% chance of transmitting the variant in each
    pregnancy, and males who inherit it are affected.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CGD associated with a pathogenic variant in CYBB is \ninherited in an X-linked manner"
    explanation: GeneReviews states CYBB-associated CGD is X-linked.
- name: Autosomal recessive (CYBA/CYBC1/NCF1/NCF2/NCF4)
  description: >-
    CGD due to biallelic variants in CYBA, CYBC1, NCF1, NCF2, or NCF4 is
    inherited in an autosomal recessive manner; each sib of an affected
    individual has a 25% chance of being affected.

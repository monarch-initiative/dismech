datasets:
- accession: ega:EGAS00001005463
  title: 'Bruno et al.: Interferon gamma rebalances immunopathological signatures in Chronic Granulomatous Disease through metabolic rewiring'
  description: Chronic granulomatous disease (CGD) is a primary immunodeficiency characterized by recurrent life-threatening infections and hyperinflammatory complications. It is caused by mutations in the NADPH oxidase complex and the consequent loss of reactive oxygen species (ROS) production. Recombinant human interferon gamma (rIFN-γ) prophylaxis reduces the risk of severe infections, but the mechanisms behind its efficacy in CGD are still an open question, as it does not restore NADPH oxidase-dependent ROS production.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Chronic Granulomatous Disease"); description-level mentions were not accepted. EGA study_type: Transcriptome Analysis. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

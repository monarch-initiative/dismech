diagnosis:
- name: Neutrophil oxidative burst testing (DHR / NBT)
  description: >-
    The functional hallmark of CGD is an absent or markedly reduced phagocyte
    oxidative burst, demonstrated by dihydrorhodamine (DHR) flow cytometry
    (preferred) or the older nitroblue tetrazolium (NBT) slide test. Molecular
    genetic testing then confirms the specific subunit defect.
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Absent or markedly reduced neutrophil oxidative burst
  evidence:
  - reference: PMID:39836849
    reference_title: "Standardization of the use of opsonized zymosan as stimulus in the 1,2,3-dihydrorhodamine technique for the assessment of neutrophil respiratory burst."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1,2,3-dihydrorhodamine oxidation technique, with phorbol-12-myristate-13-acetate \nas a stimulus, is performed to diagnose the classic chronic granulomatous \ndisease"
    explanation: Establishes the dihydrorhodamine (DHR) oxidative-burst assay as the diagnostic test for classic CGD.
- name: Molecular genetic testing
  description: >-
    Definitive diagnosis is established by identifying pathogenic variant(s) in
    one of the six NADPH oxidase genes (CYBB, CYBA, CYBC1, NCF1, NCF2, NCF4).
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Pathogenic variant(s) in a NADPH oxidase subunit/assembly gene
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of CGD is established in a proband with \nsuggestive findings by identification of pathogenic variant(s) in one of six \ngenes"
    explanation: GeneReviews states molecular identification of a pathogenic variant in one of the six genes establishes the diagnosis.
treatments:
- name: Antibacterial prophylaxis (trimethoprim-sulfamethoxazole)
  description: >-
    Lifelong daily antibacterial prophylaxis, standardly with
    trimethoprim-sulfamethoxazole, is recommended to prevent infections. The
    retrospective NIH experience quantifies the benefit as roughly a
    three-to-fourfold fall in non-fungal infection rates in both autosomal and
    X-linked disease, with no increase in fungal infection - the concern that
    prompted that review. Pregnancy caution: trimethoprim (a folic acid
    antagonist) is discontinued during pregnancy because of the high risk for
    birth defects.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: Antibiotic prophylaxis
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
  target_mechanisms:
  - target: Impaired microbial killing and recurrent infection
    treatment_effect: BYPASSES
    description: >-
      Prophylactic antibiotics suppress bacterial infection that the
      oxidase-deficient phagocytes cannot clear; they do nothing to the oxidase
      lesion itself, which is why prophylaxis is lifelong.
    evidence:
    - reference: PMID:2117627
      reference_title: >-
        Trimethoprim-sulfamethoxazole prophylaxis in the management of chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Prophylaxis decreased the incidence of nonfungal infections from 7.1 to 2.4
        per 100 patient-months in patients with autosomal CGD
      explanation: >-
        Measures the effect of the drug on the infection burden this node produces,
        which is the claim the mechanism edge makes.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lifelong daily antibacterial and \nantifungal prophylaxis is recommended"
    explanation: GeneReviews recommends lifelong daily antibacterial prophylaxis.
  - reference: PMID:2117627
    reference_title: >-
      Trimethoprim-sulfamethoxazole prophylaxis in the management of chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMP-SMX prophylaxis is indicated for the management of patients with CGD and
      decreases the incidence of non-fungal infections without increasing the
      incidence of fungal infections.
    explanation: >-
      The study's own conclusion, and the one that settles the specific worry it
      was designed to test - that suppressing bacteria would unmask fungal disease.
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "trimethoprim, a folic acid antagonist, is \ndiscontinued during pregnancy because of the high risk for birth defects"
    explanation: GeneReviews documents the pregnancy drug-safety caution for trimethoprim.
- name: Antifungal prophylaxis (itraconazole)
  description: >-
    Lifelong daily antifungal prophylaxis, standardly with itraconazole, reduces
    invasive fungal infection. The pivotal evidence is a randomized,
    double-blind, placebo-controlled crossover trial in 39 patients; newer azoles
    (voriconazole, posaconazole, isavuconazole) have expanded therapeutic options
    for established fungal infection.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: once daily
  dosing_interval_days: 1
  treatment_term:
    preferred_term: Antifungal prophylaxis
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: itraconazole
      term:
        id: CHEBI:6076
        label: itraconazole
  target_mechanisms:
  - target: Impaired microbial killing and recurrent infection
    treatment_effect: BYPASSES
    description: >-
      Antifungal prophylaxis suppresses fungal infection (especially Aspergillus)
      that the oxidase-deficient phagocytes cannot clear.
    evidence:
    - reference: PMID:12802027
      reference_title: Itraconazole to prevent fungal infections in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One patient (who had not been compliant with the treatment) had a serious
        fungal infection while receiving itraconazole, as compared with seven who
        had a serious fungal infection while receiving placebo
      explanation: >-
        The trial's primary-endpoint result: the fungal infections this node
        produces were far fewer on drug than on placebo.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lifelong daily antibacterial and \nantifungal prophylaxis is recommended"
    explanation: GeneReviews recommends lifelong daily antifungal prophylaxis.
  - reference: PMID:12802027
    reference_title: Itraconazole to prevent fungal infections in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Itraconazole prophylaxis appears to be an effective and well-tolerated
      treatment that reduces the frequency of fungal infections in chronic
      granulomatous disease, but monitoring for long-term toxic effects is
      warranted.
    explanation: >-
      The trial's conclusion, including the monitoring caveat the authors attach to
      it.
  - reference: PMID:12802027
    reference_title: Itraconazole to prevent fungal infections in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients 13 years of age or older and all patients weighing at least 50 kg
      received a single dose of 200 mg of itraconazole per day
    explanation: >-
      Sources the once-daily dosing interval recorded on this treatment, and the
      weight- and age-banded dose the trial used.
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Newer azole drugs (voriconazole, \nposaconazole, isovuconazole) have expanded therapeutic options for fungal \ninfections"
    explanation: GeneReviews notes newer azoles have expanded antifungal therapy options.
- name: Posaconazole antifungal prophylaxis
  description: >-
    Posaconazole is used as an alternative to itraconazole for antifungal
    prophylaxis. Pediatric experience is limited and no dose is established from a
    trial; a weight-based twice-daily algorithm derived in children with CGD
    achieves adequate exposure. Recorded here as an alternative agent, not as a
    demonstrated reduction in fungal infection - no placebo-controlled prophylaxis
    trial of posaconazole in CGD is cited in this entry.
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: twice daily
  dosing_interval_days: 0.5
  treatment_term:
    preferred_term: Antifungal prophylaxis
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: posaconazole
      term:
        id: CHEBI:64355
        label: posaconazole
  target_mechanisms:
  - target: Impaired microbial killing and recurrent infection
    treatment_effect: BYPASSES
    description: >-
      Like itraconazole, an azole given to suppress the fungal infection the
      oxidase defect permits rather than to correct the defect.
  evidence:
  - reference: PMID:21772229
    reference_title: >-
      A twice daily posaconazole dosing algorithm for children with chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A twice daily dosing algorithm based on allometric scaling (body-weight
      based) for PSZ results in adequate exposure and appears to be safe in
      children with chronic granulomatous disease.
    explanation: >-
      Sources both the twice-daily interval and the limits of what is established -
      adequate exposure and apparent safety, not an infection-rate reduction.
  - reference: PMID:21772229
    reference_title: >-
      A twice daily posaconazole dosing algorithm for children with chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Posaconazole (PSZ) may be an attractive alternative for antifungal
      prophylaxis in children with chronic granulomatous disease.
    explanation: >-
      States posaconazole's place as an alternative prophylactic azole in CGD, in
      the source's own hedged terms.
- name: Interferon-gamma prophylaxis
  description: >-
    Immunomodulatory prophylaxis with recombinant interferon gamma-1b, given
    subcutaneously three times weekly, is part of the standard prophylactic
    regimen in many centers. The pivotal 128-patient randomized trial more than
    halved serious infections, and benefit was seen regardless of age, mode of
    inheritance, or concurrent antibiotic prophylaxis. Crucially, the same trial
    found no measurable improvement in phagocyte superoxide production, so the
    mechanism of benefit is not oxidase restoration and remains unsettled (see the
    ifn_gamma_mechanism_in_cgd discussion). A later meta-analysis supports a
    reduced risk of serious infection while judging the overall evidence base
    insufficient.
  therapeutic_modality: OTHER
  dosing_interval: three times a week
  dosing_interval_days: 2.33
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: CHEBI:5939
        label: Interferon gamma-1b
  target_mechanisms:
  - target: Impaired microbial killing and recurrent infection
    treatment_effect: MODULATES
    description: >-
      Interferon gamma prophylaxis reduces the frequency and severity of serious
      infections. The edge is MODULATES rather than RESTORES deliberately: the
      trial that established the clinical benefit measured no change in superoxide
      production, so the drug does not act by repairing the burst.
    evidence:
    - reference: PMID:1846940
      reference_title: >-
        A controlled trial of interferon gamma to prevent infection in chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the 63 patients assigned to interferon, 14 had serious infections, as
        compared with 30 of the 65 patients assigned to placebo
      explanation: >-
        The randomized comparison of serious infection counts, which is the
        clinical effect on this node.
  effect_modifiers:
  - effect_modifier_type: AGE
    stratum: trial participants by age (median age 15 years, range not stated in the abstract)
    modified_outcome: time to first serious infection and number of serious infections
    effect_in_stratum: NO_DIFFERENCE
    description: >-
      The trial reports benefit across age strata rather than a difference between
      them. A tested null, recorded so that a reader does not assume an age
      effect. The report does not say whether these subgroup analyses were
      prespecified or whether an interaction was formally tested, so
      modification_analysis and interaction_tested are left absent.
    evidence:
    - reference: PMID:1846940
      reference_title: >-
        A controlled trial of interferon gamma to prevent infection in chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interferon was beneficial regardless of age, the use or nonuse of
        prophylactic antibiotics, and the mode of inheritance (X-linked or
        autosomal recessive).
      explanation: >-
        One sentence states the null across all three strata; it is cited on each
        of the three effect_modifier records it covers.
  - effect_modifier_type: GENOTYPE
    stratum: X-linked CGD
    comparator_stratum: autosomal recessive CGD
    modified_outcome: time to first serious infection and number of serious infections
    effect_in_stratum: NO_DIFFERENCE
    description: >-
      Benefit did not differ by mode of inheritance in the pivotal trial. Note this
      is inheritance mode, not residual oxidase activity, which is the axis that
      does track with disease severity.
    evidence:
    - reference: PMID:1846940
      reference_title: >-
        A controlled trial of interferon gamma to prevent infection in chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interferon was beneficial regardless of age, the use or nonuse of
        prophylactic antibiotics, and the mode of inheritance (X-linked or
        autosomal recessive).
      explanation: >-
        States the null across inheritance modes, which is what this record claims.
  - effect_modifier_type: CONCOMITANT_TREATMENT
    stratum: patients taking prophylactic antibiotics
    comparator_stratum: patients not taking prophylactic antibiotics
    modified_outcome: time to first serious infection and number of serious infections
    effect_in_stratum: NO_DIFFERENCE
    description: >-
      Interferon gamma's benefit was present with or without concurrent
      antibacterial prophylaxis, which is why the two are given together rather
      than as alternatives.
    evidence:
    - reference: PMID:1846940
      reference_title: >-
        A controlled trial of interferon gamma to prevent infection in chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interferon was beneficial regardless of age, the use or nonuse of
        prophylactic antibiotics, and the mode of inheritance (X-linked or
        autosomal recessive).
      explanation: >-
        States the null across concurrent-antibiotic strata.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "immunomodulatory therapy with interferon \ngamma (IFN-gamma) is part of the prophylactic regimen in many centers"
    explanation: GeneReviews describes IFN-gamma as part of the prophylactic regimen in many centers.
  - reference: PMID:1846940
    reference_title: >-
      A controlled trial of interferon gamma to prevent infection in chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients received interferon gamma (50 micrograms per square meter of
      body-surface area) or placebo subcutaneously, three times a week for up to a
      year.
    explanation: >-
      Sources the three-times-weekly subcutaneous schedule recorded in the dosing
      interval, and the body-surface-area dose used in the trial.
  - reference: PMID:1846940
    reference_title: >-
      A controlled trial of interferon gamma to prevent infection in chronic
      granulomatous disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there were no significant changes in the measures of superoxide
      production by phagocytes.
    explanation: >-
      Refutes the natural reading of this treatment as a burst-restoring agent: the
      trial that proved the clinical benefit measured no change in superoxide
      production. This is why the mechanism edge is MODULATES and why an open
      discussion records the gap.
  - reference: PMID:15356785
    reference_title: Long-term interferon-gamma therapy for patients with chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of serious infections was 0.30 infections per patient-year; for
      serious bacterial infections, the incidence was 0.18 cases per patient-year,
      and for serious fungal infections, it was 0.12 cases per patient-year.
    explanation: >-
      Supplies the long-term (328.4 patient-year) infection rates under continued
      therapy, which is what makes lifelong use rather than a one-year course
      defensible. Uncontrolled and open-label, so it is a rate, not a comparison.
  - reference: PMID:36385358
    reference_title: >-
      Efficacy and Safety of Interferon-Gamma in Chronic Granulomatous Disease: a
      Systematic Review and Meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk ratio for serious infection was 0.56 (95%CI 0.35-0.90) under IFN-γ.
    explanation: >-
      Pools six studies and 324 patients; the aggregate risk ratio favours
      interferon gamma for prevention of serious infection.
  - reference: PMID:36385358
    reference_title: >-
      Efficacy and Safety of Interferon-Gamma in Chronic Granulomatous Disease: a
      Systematic Review and Meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found insufficient clinical evidence and believe more clinical trials are
      needed to better assess the efficacy and long-term safety of IFN-γ
    explanation: >-
      The same meta-analysis's caveat, kept beside its point estimate: the aggregate
      odds ratio crossed 1 and the evidence base rests largely on one trial.
- name: Corticosteroids for inflammatory complications
  description: >-
    Simultaneous administration of antimicrobials and corticosteroids can help
    resolve the heightened inflammatory response, including colitis and
    obstructing granulomas.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Dysregulated inflammation and granuloma formation
    treatment_effect: MODULATES
    description: Corticosteroids dampen the dysregulated hyperinflammatory response that drives colitis and granulomas.
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Simultaneous administration of antimicrobials and corticosteroids can help \nresolve the associated heightened inflammatory response, including colitis"
    explanation: GeneReviews supports corticosteroids for the inflammatory/colitis complications of CGD.
- name: High-dose corticosteroid management of staphylococcal liver abscess
  description: >-
    A distinct and counterintuitive use of steroids in CGD: hepatic abscesses were
    traditionally managed by open surgery or percutaneous drainage, and
    corticosteroids given with antibiotics resolve abscesses refractory to those
    measures. In the NIH series, time to a repeat hepatic intervention was longest
    in the corticosteroid-managed group. The rationale is that the lesion is
    substantially an inflammatory mass rather than drainable pus - which is why
    this is recorded against the inflammatory arm of the disease and not against
    the killing defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Liver abscess
    treatment_effect: MODULATES
    description: >-
      Corticosteroids given alongside antibiotics resolve staphylococcal hepatic
      abscesses that conventional therapy did not, and extend the interval to the
      next intervention.
    evidence:
    - reference: PMID:22157170
      reference_title: Corticosteroid therapy for liver abscess in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe 9 X-linked CGD patients with staphylococcal liver abscesses
        refractory to conventional therapy successfully treated with corticosteroids
        and antibiotics.
      explanation: >-
        The case series that established the approach, in refractory disease, which
        is the effect this edge claims on the liver-abscess phenotype.
  evidence:
  - reference: PMID:22157170
    reference_title: Corticosteroid therapy for liver abscess in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids may have a role in treatment of Staphylococcus aureus liver
      abscesses in CGD.
    explanation: >-
      The authors' own conclusion, hedged as a possible role on the strength of nine
      patients.
  - reference: PMID:29145578
    reference_title: >-
      The Changing Paradigm of Management of Liver Abscesses in Chronic Granulomatous
      Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Time to repeat intervention was extended in OS compared with IR (18.8 vs 9.5
      months, P = .04) and further increased in CM alone (median time to recurrence
      not met).
    explanation: >-
      Compares corticosteroid management (CM) with open surgery (OS) and
      interventional radiology (IR) in 26 patients with complete records; the
      steroid group did not reach median time to recurrence. Retrospective and
      non-randomized, with only eight patients in the steroid arm.
- name: Anti-TNF therapy for CGD-related inflammatory bowel disease (infliximab)
  description: >-
    Infliximab closes fistulae and achieves complete or partial remission in most
    treated patients with steroid-dependent or refractory CGD inflammatory bowel
    disease, but it does so at a real infectious cost in a host that already
    cannot kill catalase-positive organisms: severe infections with typical CGD
    pathogens, and two deaths in the five-patient NIH series. It is best
    understood as a short-term bridge in selected patients, usually to
    transplantation, under aggressive antimicrobial prophylaxis and surveillance.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  target_mechanisms:
  - target: Dysregulated inflammation and granuloma formation
    treatment_effect: INHIBITS
    description: >-
      Neutralizing TNF-alpha blocks one of the two cytokines driving the sterile
      inflammatory arm, which is the node this treatment acts on - it leaves the
      oxidase defect and therefore the infection risk untouched, and arguably
      worsens it.
    evidence:
    - reference: PMID:33150502
      reference_title: >-
        Infections in Patients with Chronic Granulomatous Disease Treated with Tumor
        Necrosis Factor Alpha Blockers for Inflammatory Complications.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Infliximab achieved complete (n = 2, 14.3%) or partial (n = 9, 64.3%)
        response in 11 (78.6%) patients.
      explanation: >-
        Quantifies the anti-inflammatory response rate in 14 patients, which is the
        effect on this node.
  evidence:
  - reference: PMID:21058909
    reference_title: >-
      Complications of tumor necrosis factor-α blockade in chronic granulomatous
      disease-related colitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infliximab administration predisposed patients to severe infections with
      typical CGD pathogens but not mycobacteria, as reported with infliximab in
      other conditions.
    explanation: >-
      Records the characteristic safety signal, and that its organism spectrum is
      the CGD spectrum rather than the mycobacterial one anti-TNF therapy causes in
      other diseases.
  - reference: PMID:21058909
    reference_title: >-
      Complications of tumor necrosis factor-α blockade in chronic granulomatous
      disease-related colitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infliximab-associated complications were associated with 2 deaths.
    explanation: >-
      The hardest endpoint in the series of five patients, and the reason this
      treatment is recorded with an explicit caution rather than as routine care.
  - reference: PMID:33150502
    reference_title: >-
      Infections in Patients with Chronic Granulomatous Disease Treated with Tumor
      Necrosis Factor Alpha Blockers for Inflammatory Complications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that anti-TNF-α treatment might be of short-term benefit in selected
      CGD patients with severe inflammatory complications awaiting hematopoietic stem
      cell transplantation.
    explanation: >-
      The authors' own framing of where this treatment belongs - a short-term bridge
      to transplantation, not durable control.
- name: Interleukin-1 receptor blockade (anakinra)
  description: >-
    Anakinra targets the IL-1 axis that is left running in CGD because the
    autophagy defect permits excess IL-1 beta release. In the oxidase-null mouse
    it reduces neutrophil recruitment and Th17 responses and protects against both
    colitis and invasive aspergillosis - unusually for an immunosuppressant in
    this disease, it did not worsen the infection arm in the model. Human
    experience is small: CGD patients with severe colitis treated with anakinra
    improved rapidly.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: CHEBI:231683
        label: Anakinra
  target_mechanisms:
  - target: ROS-independent inflammasome activation and IL-1 beta release
    treatment_effect: INHIBITS
    description: >-
      Blocking the IL-1 receptor interrupts the signalling of the IL-1 beta this
      node releases, and in CGD also feeds back to restore autophagy.
    evidence:
    - reference: PMID:24550444
      reference_title: >-
        IL-1 receptor blockade restores autophagy and reduces inflammation in chronic
        granulomatous disease in mice and in humans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Anakinra also increased Aspergillus-induced LC3 recruitment from 23% to 51%
        (P < 0.01) in vitro in monocytes from CGD patients.
      explanation: >-
        The human cellular measurement: IL-1 blockade restores the autophagic
        recruitment that is defective in these cells, which is the mechanistic
        effect this edge asserts.
  - target: Colitis
    treatment_effect: MODULATES
    description: >-
      Patients with severe CGD colitis treated with IL-1 receptor blockade improved
      rapidly and durably.
    evidence:
    - reference: PMID:24550444
      reference_title: >-
        IL-1 receptor blockade restores autophagy and reduces inflammation in chronic
        granulomatous disease in mice and in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical relevance of these findings was assessed by treating CGD patients
        who had severe colitis with IL-1 receptor blockade using anakinra.
      explanation: >-
        Establishes that the colitis effect was tested in patients rather than only in
        the mouse model; the uncontrolled design is why the edge is MODULATES.
  evidence:
  - reference: PMID:24550444
    reference_title: >-
      IL-1 receptor blockade restores autophagy and reduces inflammation in chronic
      granulomatous disease in mice and in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Blocking IL-1 with the receptor antagonist (anakinra) decreases neutrophil
      recruitment and T helper 17 responses and protects CGD mice from colitis and
      also from invasive aspergillosis.
    explanation: >-
      The murine result, and the one that distinguishes IL-1 blockade from other
      immunosuppressants here: protection against aspergillosis rather than
      increased susceptibility. Not yet shown in patients.
  - reference: PMID:20495074
    reference_title: >-
      Inflammasome activation in NADPH oxidase defective mononuclear phagocytes from
      patients with chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treatment with IL-1 receptor antagonist reduced IL-1 production in monocytes ex
      vivo and during medical therapy.
    explanation: >-
      An independent group reports the same pharmacodynamic effect in patient
      monocytes, supporting the target rather than the clinical outcome.
- name: Thalidomide for CGD-related inflammatory bowel disease
  description: >-
    The one randomized controlled trial of an anti-inflammatory agent for CGD-IBD.
    In a multicenter, double-blind, placebo-controlled phase II trial of eight male
    patients, thalidomide met its prespecified efficacy criterion with CGD-related
    infection rates comparable before and after treatment - the key question for any
    immunomodulator in this disease. The trial is very small, so the result
    establishes a signal and a safety impression rather than effectiveness.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thalidomide
      term:
        id: CHEBI:9513
        label: thalidomide
  target_mechanisms:
  - target: Dysregulated inflammation and granuloma formation
    treatment_effect: INHIBITS
    description: >-
      Thalidomide suppresses TNF-alpha-driven NF-kappaB activation and IL-1 beta
      secretion in CGD monocytes without blocking the cytokine response to
      lipopolysaccharide, which is the selectivity its use in this disease rests on.
    evidence:
    - reference: PMID:23583898
      reference_title: >-
        Thalidomide attenuates excessive inflammation without interrupting
        lipopolysaccharide-driven inflammatory cytokine production in chronic
        granulomatous disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        thalidomide suppressed TNF-α-induced NF-κB activation and ATP-induced IL-1β
        secretion, but did not interrupt the production of IL-1β, IL-6, IL-8, and
        TNF-α in response to lipopolysaccharide in CGD monocytes
      explanation: >-
        Measures the drug's effect on the two cytokine axes this node binds, in
        patient monocytes, and shows the antimicrobial cytokine response is spared.
  evidence:
  - reference: PMID:42344149
    reference_title: >-
      Thalidomide for CGD-related inflammatory bowel disease: A randomized,
      double-blind trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint was achieved by 1/3 of thalidomide patients versus 0/5 in
      the placebo group during the blinded phase, and by 5/8 in the extension phase.
    explanation: >-
      The trial's primary-endpoint result, with the eight-patient denominator visible
      so the reader can weigh it.
  - reference: PMID:42344149
    reference_title: >-
      Thalidomide for CGD-related inflammatory bowel disease: A randomized,
      double-blind trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thalidomide met the prespecified efficacy criterion with an acceptable safety
      profile in CGD-IBD, suggesting a promising therapeutic option that warrants
      further clinical studies.
    explanation: >-
      The authors' conclusion, including their own call for further study.
  - reference: PMID:42344149
    reference_title: >-
      Thalidomide for CGD-related inflammatory bowel disease: A randomized,
      double-blind trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CGD-related infection rates were comparable before and after treatment.
    explanation: >-
      The infection-safety finding, which is the specific risk that limits every
      immunosuppressant in CGD.
- name: Other biologics under investigation for CGD-related inflammatory bowel disease
  description: >-
    Ustekinumab (anti-IL-12/23 p40) and vedolizumab (anti-alpha4beta7 integrin) are
    used off-label for CGD inflammatory bowel disease on the strength of small case
    series, with the hope that gut-selective or non-TNF mechanisms carry less
    infectious risk than TNF blockade. This entry records them as investigational on
    the authority of a review; no controlled trial of either agent in CGD is cited
    here, and no mechanism edge is asserted because the reviewed evidence does not
    identify which node they act on.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
    - preferred_term: vedolizumab
      term:
        id: NCIT:C95798
        label: Vedolizumab
  evidence:
  - reference: PMID:38398405
    reference_title: Inflammatory Complications in Chronic Granulomatous Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Novel therapeutic agents, like anti-TNFa monoclonal antibodies, anakinra,
      ustekinumab, and vedolizumab offer promise for the future, while hematopoietic
      stem cell transplantation should also be considered in these patients.
    explanation: >-
      A review's placement of these agents as promising rather than established, which
      is exactly the strength of this record. Marked REVIEW_SYNTHESIS because the
      sentence is the review's own synthesis of case-level reports.
  - reference: PMID:38398405
    reference_title: Inflammatory Complications in Chronic Granulomatous Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Immunosuppressive agents have traditionally been used to treat these
      complications, but their use is hindered by the fact that CGD patients are
      predisposed to infection.
    explanation: >-
      States the constraint that governs every entry in this part of the treatment
      list, and the reason agents with narrower mechanisms are being sought.
- name: mTOR inhibition (sirolimus) for CGD inflammatory manifestations
  description: >-
    Rapamycin was tried in CGD as an autophagy inducer, on the reasoning that the
    disease's inflammatory arm is driven by defective autophagy and consequent
    inflammasome activation. In cells from 15 patients it reversed the CGD
    inflammatory profile across monocyte, T-cell and neutrophil compartments, and
    its effect on IL-1 beta secretion was enhanced by adding anakinra. This is an
    ex vivo result that opens a therapeutic approach; no clinical trial in CGD is
    cited here, and the autophagy-induction step itself was the rationale rather
    than the measured endpoint, so no edge is drawn to the autophagy node.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: ROS-independent inflammasome activation and IL-1 beta release
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibition lowered IL-1 beta content and secretion in patient mononuclear
      phagocytes, with an additive effect when IL-1 receptor blockade was combined
      with it.
    evidence:
    - reference: PMID:27702670
      reference_title: >-
        Mammalian target of rapamycin inhibition counterbalances the inflammatory
        status of immune cells in patients with chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also provide evidence for the enhancement of rapamycin's inhibitory effect
        on IL-1β secretion by the IL-1 receptor antagonist anakinra in phagocytes of
        patients with CGD.
      explanation: >-
        Names the measured effect on IL-1 beta secretion in patient phagocytes, which
        is the node this edge targets.
  evidence:
  - reference: PMID:27702670
    reference_title: >-
      Mammalian target of rapamycin inhibition counterbalances the inflammatory status
      of immune cells in patients with chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We document the reversion of CGD inflammatory status by the mammalian target of
      rapamycin inhibitor rapamycin on the different immune cell subsets.
    explanation: >-
      The study's central finding, in cells from 15 patients, and the basis for
      recording sirolimus as an investigational option.
  - reference: PMID:32524254
    reference_title: "Chronic Granulomatous Disease: a Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      New therapeutic approaches using immunomodulators for CGD-related inflammatory
      manifestations are under investigation, including pioglitazone, tamoxifen, and
      rapamycin.
    explanation: >-
      Places rapamycin (and pioglitazone, curated separately below) as under
      investigation rather than established. Tamoxifen is named in the same list but
      is not curated here, as no primary source for it is cited in this entry.
- name: PPAR-gamma agonism (pioglitazone)
  description: >-
    The most mechanistically interesting failed-so-far approach in CGD, and the
    reason two nodes in this entry exist. Pioglitazone bypasses the NADPH oxidase
    entirely: by activating PPAR-gamma it raises mitochondrial oxidant production
    and restores efferocytosis in oxidase-deficient phagocytes. In gp91phox-null
    mice that was enough to improve killing of Staphylococcus aureus, and in human
    CGD monocytes it restored efferocytosis both ex vivo and in two patients treated
    for inflammatory bowel disease. The one prospective clinical attempt, in three
    patients with severe infection, was stopped for futility: no improvement in
    infection severity and no rise in the DHR stimulation index.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pioglitazone
      term:
        id: CHEBI:8228
        label: pioglitazone
  target_mechanisms:
  - target: Loss of oxidase-dependent mitochondrial ROS signaling
    treatment_effect: ACTIVATES
    description: >-
      PPAR-gamma agonism substitutes for the missing oxidase-derived signal and
      raises mitochondrial oxidant production in phagocytes that cannot assemble an
      NADPH oxidase.
    evidence:
    - reference: PMID:25498313
      reference_title: >-
        Pioglitazone restores phagocyte mitochondrial oxidants and bactericidal
        capacity in chronic granulomatous disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        PPARγ agonism appears to bypass the need for the NADPH oxidase for enhanced
        mtROS production and partially restores host defense in CGD.
      explanation: >-
        States the bypass claim this edge makes, and qualifies the host-defense
        effect as partial.
  - target: Impaired efferocytosis of apoptotic cells
    treatment_effect: RESTORES
    description: >-
      Treating CGD monocytes with pioglitazone returned their efferocytic capability
      to healthy-control levels.
    evidence:
    - reference: PMID:26386811
      reference_title: >-
        Impaired efferocytosis in human chronic granulomatous disease is reversed by
        pioglitazone treatment.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        overnight culture of CGD monocytes with pioglitazone significantly enhanced
        efferocytic capability restoring it to levels seen for healthy control
        monocytes
      explanation: >-
        The measured restoration in patient cells, which is what RESTORES asserts on
        this node.
  evidence:
  - reference: PMID:25498313
    reference_title: >-
      Pioglitazone restores phagocyte mitochondrial oxidants and bactericidal
      capacity in chronic granulomatous disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      short-term treatment of gp91(phox-/-) mice with pioglitazone enhanced
      stimulated ROS production in neutrophils and monocytes from blood and
      neutrophils and inflammatory macrophages recruited to tissues
    explanation: >-
      The murine pharmacodynamic result across blood and tissue phagocytes.
  - reference: PMID:26386811
    reference_title: >-
      Impaired efferocytosis in human chronic granulomatous disease is reversed by
      pioglitazone treatment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whether pioglitazone will decrease inflammation in CGD, and whether
      pioglitazone-enhanced mitochondrial ROS will bolster host defense in human CGD,
      as it did in murine models
    explanation: >-
      The authors name both clinical questions as unanswered, which is the correct
      reading of this treatment's status.
  - reference: PMID:31745699
    reference_title: >-
      Low-Dose Pioglitazone does not Increase ROS Production in Chronic Granulomatous
      Disease Patients with Severe Infection.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3 patients experienced no improvement in severity of infection and
      stimulation index of the DHR did not also improve after receiving pioglitazone
      10, 45 and 90 days, respectively.
    explanation: >-
      Refutes the clinical translation of the preclinical result at the dose tested:
      neither the infection nor the oxidase readout moved, and the study was
      terminated after three patients. Low dose and three patients, so it bounds the
      claim rather than closing the question.
- name: Granulocyte transfusions for refractory infection
  description: >-
    Transfused donor granulocytes supply phagocytes that can mount an oxidative
    burst, as an adjunct to antimicrobials and surgery in severe or refractory
    infection. The NIH experience favours early, frequent and sustained courses.
    The cost is alloimmunization: in patients who later proceeded to transplantation
    or gene therapy, pre-procedure transfusions were associated with anti-HLA
    antibodies, primary graft failure and early immune-mediated cytopenia, so their
    use has to be weighed against a planned cellular therapy. Transfusions given
    after transplantation did not carry that association.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: granulocyte transfusion
    term:
      id: NCIT:C219703
      label: Granulocyte Transfusion
  target_mechanisms:
  - target: Impaired microbial killing and recurrent infection
    treatment_effect: BYPASSES
    description: >-
      Donor neutrophils with an intact oxidase perform the killing the patient's own
      phagocytes cannot, for as long as the transfused cells persist. It is a
      transient substitution, not a correction.
    evidence:
    - reference: PMID:28342916
      reference_title: >-
        Granulocyte transfusions in patients with chronic granulomatous disease and
        refractory infections: The NIH experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Granulocyte transfusions are a relatively safe adjunctive therapeutic option
        for patients with chronic granulomatous disease and severe/refractory
        bacterial or fungal infections.
      explanation: >-
        Places the intervention as adjunctive therapy for the refractory infections
        this node produces.
  evidence:
  - reference: PMID:28342916
    reference_title: >-
      Granulocyte transfusions in patients with chronic granulomatous disease and
      refractory infections: The NIH experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early initiation, high frequency and sustained therapy is associated with
      significantly better outcomes.
    explanation: >-
      The retrospective series' practical finding on how transfusions should be given.
      Association in a single-centre retrospective review, not a randomized
      comparison.
  - reference: PMID:35445907
    reference_title: >-
      Granulocyte Transfusions in Patients with Chronic Granulomatous Disease
      Undergoing Hematopoietic Cell Transplantation or Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      granulocyte transfusions pre-HCT or GT were associated with high rates of
      alloimmunization, primary graft failure, and early severe immune-mediated
      cytopenia post-HCT or GT
    explanation: >-
      The harm that constrains this treatment when a curative cellular therapy is
      planned, from a 27-patient retrospective survey.
  - reference: PMID:35445907
    reference_title: >-
      Granulocyte Transfusions in Patients with Chronic Granulomatous Disease
      Undergoing Hematopoietic Cell Transplantation or Gene Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Granulocyte transfusions post-HCT do not appear to confer an increased risk of
      graft failure.
    explanation: >-
      Separates the timing that carries the risk from the timing that does not, which
      is the clinically actionable half of the finding.
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    Allogeneic HSCT is the only established cure for CGD: it replaces the
    hematopoietic compartment with donor cells that assemble a functional NADPH
    oxidase, correcting both the killing defect and the inflammatory arm. A
    712-patient international study reports 3-year overall survival of 85.7%, and a
    prospective reduced-intensity-conditioning study - designed for adolescents,
    adults and high-risk patients, in whom graft failure and transplant-related
    mortality had been the obstacle - reports 93% overall survival at a median 21

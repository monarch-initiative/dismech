- name: Impaired microbial killing and recurrent infection
  conforms_to: "phagocyte_oxidative_burst_failure#Impaired Oxidant-Dependent Microbial Killing"
  description: >-
    Because oxidant-dependent killing is lost, phagocytes cannot efficiently
    clear catalase-positive organisms (which detoxify their own hydrogen
    peroxide) such as Staphylococcus aureus, Serratia marcescens, Burkholderia
    cepacia, Nocardia, and Aspergillus, producing the characteristic recurrent
    and severe pneumonias, abscesses, lymphadenitis, and osteomyelitis.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: DECREASED
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by severe recurrent bacterial and fungal infections"
    explanation: The killing defect produces the hallmark severe recurrent bacterial and fungal infections of CGD.
  - reference: PMID:32524254
    reference_title: "Chronic Granulomatous Disease: a Comprehensive Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neutrophils from patients with CGD are deficient in neutrophil extracellular
      traps (NETosis), autophagy, and apoptosis.
    explanation: >-
      Sources the NETosis arm of the killing defect, which is a distinct effector
      failure from phagosomal oxidative killing. Marked REVIEW_SYNTHESIS because
      this is a review's summary of the underlying cell studies.
  downstream:
  - target: Recurrent bacterial infections
    causal_link_type: DIRECT
    description: >-
      Catalase-positive organisms survive phagocytosis because the oxidative burst that would kill them never fires; the phagosome takes them up and cannot finish the job.
  - target: Recurrent fungal infections
    causal_link_type: DIRECT
    description: >-
      Aspergillus and other moulds are controlled by the same oxidative mechanism, which is why invasive fungal disease is a defining risk in this disease rather than an incidental one.
  - target: Pneumonia
    causal_link_type: DIRECT
    description: >-
      The commonest deep-organ site, and usually the first serious presentation.
  - target: Lymphadenitis
    causal_link_type: DIRECT
    description: >-
      Suppurative nodal infection, the drainage-site expression of the same killing defect.
  - target: Recurrent skin abscesses
    causal_link_type: DIRECT
    description: >-
      Cutaneous and subcutaneous abscess, the most superficial form.
  - target: Liver abscess
    causal_link_type: DIRECT
    description: >-
      Hepatic abscess, characteristically staphylococcal — one of the deep-organ infections that distinguishes CGD from ordinary recurrent infection.
  - target: Osteomyelitis
    causal_link_type: DIRECT
    description: >-
      Bone involvement, often by Serratia or Aspergillus, reflecting the same organism spectrum rather than a separate susceptibility.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Systemic dissemination, classically Salmonella. The life-threatening endpoint of a failure to kill intracellular organisms.
- name: Dysregulated inflammation and granuloma formation
  conforms_to: "phagocyte_oxidative_burst_failure#Loss of ROS-Dependent Immunoregulation"
  description: >-
    Independent of infection, NADPH oxidase deficiency dysregulates innate
    immune signaling and impairs the resolution of inflammation, driving
    persistent macrophage activation, exuberant granuloma formation that can
    obstruct hollow viscera (gastrointestinal and genitourinary tracts), and an
    inflammatory-bowel-disease-like colitis.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  evidence:
  - reference: PMID:22876374
    reference_title: "Chronic Granulomatous Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "dysregulated inflammatory responses resulting in granuloma formation and other \ninflammatory disorders such as colitis"
    explanation: Establishes the dysregulated-inflammation arm of CGD producing granulomas and colitis.
  - reference: PMID:23583898
    reference_title: >-
      Thalidomide attenuates excessive inflammation without interrupting
      lipopolysaccharide-driven inflammatory cytokine production in chronic
      granulomatous disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      half of the patients with CGD suffer from aseptic bowel inflammation (CGD
      colitis) due to dysregulated inflammation induced by TNF-α and IL-1β
    explanation: >-
      Names the two cytokines that drive the sterile inflammatory arm, which is why
      this node binds tumor necrosis factor production and why TNF blockade and
      IL-1 blockade both target it. Marked BACKGROUND because the sentence frames
      the paper rather than reporting its result.
  downstream:
  - target: Granulomatous inflammation
    causal_link_type: DIRECT
    description: >-
      The defining non-infectious feature, and the one the disease is named for: without ROS, inflammation is neither properly terminated nor resolved, so macrophages aggregate into exuberant granulomas.
  - target: Gastric outlet obstruction
    causal_link_type: DIRECT
    description: >-
      Antral and pyloric granulomas obstructing the stomach outlet — the mechanical consequence of granuloma formation at a narrow point, not of infection at that site.
  - target: Colitis
    causal_link_type: DIRECT
    description: >-
      An inflammatory-bowel-disease-like colitis. Drawn from the inflammatory arm rather than the infectious one because that is how the entry classifies it, and because it responds to immunosuppression rather than to antimicrobials.

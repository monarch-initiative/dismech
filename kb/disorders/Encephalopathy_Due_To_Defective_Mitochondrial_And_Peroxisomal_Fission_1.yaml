pathophysiology:
- name: Impaired DRP1 Assembly and GTP-Driven Constriction
  biological_scale: MOLECULAR
  description: >-
    DRP1 is recruited from the cytosol to receptors on the mitochondrial outer
    membrane, polymerises into a filament, and uses GTP hydrolysis to curl that
    filament into constricting rings. Disease variants cluster in the GTPase
    and middle (assembly) domains. The de novo missense alleles act
    dominant-negatively: the R403C assembly-region allele reduces DRP1
    oligomerization, mitochondrial recruitment and fission activity, less
    severely than the founding A395D allele, and expressing the founding allele
    in control cells reproduces the fission defect. The rarer biallelic alleles
    include frameshift and hypomorphic missense changes.
  genes:
  - preferred_term: DNM1L
    term:
      id: hgnc:2973
      label: DNM1L
  molecular_functions:
  - preferred_term: DRP1 GTPase activity driving filament constriction
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:29899447
    reference_title: Structural basis of mitochondrial receptor binding and constriction by DRP1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After co-assembly, GTP hydrolysis and exchange lead to MID receptor
      dissociation, filament shortening and curling of DRP1 oligomers into
      constricted and closed rings.
    explanation: >-
      DRP1's GTP hydrolysis converts the receptor-bound filament into the
      constricting ring that divides the organelle, the activity bound on this
      node.
  - reference: PMID:27145208
    reference_title: A novel de novo dominant negative mutation in DNM1L impairs mitochondrial fission and presents as childhood epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that our R403C mutation, which resides in the assembly
      region of DRP1, acts by a dominant-negative mechanism and reduces
      oligomerization, mitochondrial fission activity, and mitochondrial
      recruitment of DRP1, but to a lesser extent compared to the A395D
      mutation.
    explanation: >-
      A patient allele reduces DRP1 assembly and fission activity through a
      dominant-negative mechanism.
  - reference: PMID:17460227
    reference_title: A lethal defect of mitochondrial and peroxisomal fission.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of the mutant DLP1 in control cells reproduced the fission
      defect.
    explanation: >-
      The founding allele imposes the fission defect on cells that also carry
      wild-type DRP1, which is the dominant-negative action.
  downstream:
  - target: Failure of Mitochondrial and Peroxisomal Fission
    causal_link_type: DIRECT
    description: >-
      Without functional DRP1 rings neither organelle is divided.
- name: Failure of Mitochondrial and Peroxisomal Fission
  biological_scale: CELLULAR
  description: >-
    Mitochondria and peroxisomes are left elongated and undivided, the
    cellular signature shared with EMPF2, the disorder of the DRP1 receptor
    MFF. The defect is in organelle division rather than in a metabolic enzyme,
    so respiratory-chain and peroxisomal biochemistry can be normal or only
    mildly altered; the biallelic family showed neither lactic acidosis nor a
    respiratory-chain deficiency.
  biological_processes:
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: DECREASED
  - preferred_term: peroxisome fission
    term:
      id: GO:0016559
      label: peroxisome fission
    modifier: DECREASED
  evidence:
  - reference: PMID:17460227
    reference_title: A lethal defect of mitochondrial and peroxisomal fission.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a defect of the fission of both mitochondria and peroxisomes
    explanation: >-
      The founding patient's cells show the combined mitochondrial and
      peroxisomal fission defect.
  - reference: PMID:27328748
    reference_title: Biallelic Mutations in DNM1L are Associated with a Slowly Progressive Infantile Encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fluorescence microscopy revealed abnormally elongated mitochondria and
      aberrant peroxisomes in mutant fibroblasts, indicating impaired fission of
      these organelles.
    explanation: >-
      The same dual fission defect in fibroblasts from the biallelic patients.
  - reference: PMID:27328748
    reference_title: Biallelic Mutations in DNM1L are Associated with a Slowly Progressive Infantile Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we described a recessive disease caused by DNM1L mutations, with a
      clinical phenotype resembling mitochondrial disorders but without any
      biochemical features typical of these syndromes (lactic acidosis,
      respiratory chain complex deficiency) or indicating a peroxisomal
      disorder.
    explanation: >-
      The fission defect can occur without the biochemical markers of primary
      mitochondrial or peroxisomal enzyme disease.
  downstream:
  - target: Neuronal Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neurons depend on mitochondrial division for distribution and quality
      control; the steps from undivided organelles to neuronal failure are not
      resolved in patients.
  - target: Increased circulating lactate concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in the founding neonate, not in the biallelic family.
  - target: Increased circulating very long-chain fatty acid concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A mild rise in the founding neonate, consistent with undivided
      peroxisomes rather than a peroxisomal enzyme defect.
- name: Neuronal Dysfunction and Degeneration
  biological_scale: TISSUE
  description: >-
    The brain is the organ that fails. Presentations range from neonatal
    microcephaly with abnormal brain development and optic atrophy, through
    infantile slowly progressive encephalopathy, to normal early development
    followed by sudden refractory status epilepticus and rapid decline.
    Epilepsy and dystonia are the most frequent features in larger series, and
    middle-domain variants, chiefly p.Arg403Cys, can produce a
    hemiconvulsion-hemiplegia-epilepsy pattern.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:27145208
    reference_title: A novel de novo dominant negative mutation in DNM1L impairs mitochondrial fission and presents as childhood epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNM1L encodes dynamin-related protein 1 (DRP1/DLP1), a key component of
      the mitochondrial fission machinery that is essential for proper
      functioning of the mammalian brain.
    explanation: >-
      Ties the DRP1 fission machinery to brain function, the organ in which the
      disease presents.
  - reference: PMID:42687971
    reference_title: "Clinical phenotype spectrum and prognostic analysis of DNM1L-related disorders: a single-center cohort study of 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in the middle domain correlated with higher rates of
      neurological dysfunction and mortality.
    explanation: >-
      The neurological burden tracks the domain the variant hits.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic atrophy

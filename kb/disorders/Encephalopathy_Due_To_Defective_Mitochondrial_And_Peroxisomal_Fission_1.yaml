name: Encephalopathy Due To Defective Mitochondrial And Peroxisomal Fission 1
creation_date: "2026-11-25T19:00:00Z"
description: >
  EMPF1 is the neurological disorder caused by pathogenic variants in DNM1L,
  which encodes dynamin-related protein 1 (DRP1), the dynamin-family GTPase that
  assembles into constricting rings to divide both mitochondria and peroxisomes.
  Most reported patients carry a heterozygous de novo missense variant that acts
  dominant-negatively on the DRP1 oligomer; a minority carry biallelic variants.
  The founding patient was a newborn with microcephaly, abnormal brain
  development, optic atrophy, persistent lactic acidemia and mildly raised
  very-long-chain fatty acids, who died in infancy, which is why MONDO and OMIM
  label the disorder lethal. Later reports widened the spectrum to children who
  develop normally for years and then present with refractory focal status
  epilepticus followed by rapid neurological decline, and to a slowly
  progressive infantile encephalopathy in biallelic cases. Epilepsy, often
  super-refractory status epilepticus, and dystonia dominate the larger cohorts,
  and outcome is usually severe disability. The shared cellular lesion is
  elongated, undivided mitochondria and peroxisomes rather than a primary
  respiratory-chain or peroxisomal enzyme defect.
category: Mendelian

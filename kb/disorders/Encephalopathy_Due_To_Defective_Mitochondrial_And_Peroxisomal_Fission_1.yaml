      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Variants are predominantly de novo heterozygous missense changes in the
    GTPase and middle domains; p.Arg403Cys is recurrent and frequent in Chinese
    patients. ClinGen classifies DNM1L as Definitive (autosomal dominant) for
    encephalopathy due to mitochondrial and peroxisomal fission defect
    (MONDO:0054865), the parent class that also holds the MFF disorder, and as
    Limited for Leigh syndrome; neither is this entry's own MONDO term, so no
    tier is recorded here.
  evidence:
  - reference: PMID:17460227
    reference_title: A lethal defect of mitochondrial and peroxisomal fission.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a defect of the fission of both mitochondria and peroxisomes, as
      well as a heterozygous, dominant-negative mutation in the dynamin-like
      protein 1 gene (DLP1).
    explanation: The founding report of DNM1L as the gene of this disorder.
  - reference: PMID:27145208
    reference_title: A novel de novo dominant negative mutation in DNM1L impairs mitochondrial fission and presents as childhood epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously reported probands with de novo missense mutations in DNM1L
      presented in the first year of life with severe encephalopathy and
      refractory epilepsy, with several dying within the first several weeks
      after birth.
    explanation: Several independent de novo probands by 2016.
  - reference: PMID:30085106
    reference_title: Aberrant Drp1-mediated mitochondrial division presents in humans with variable outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the identification of five patients with pathogenic or
      likely pathogenic variants of DNM1L, including two novel variants.
    explanation: Five further patients with DNM1L variants.
  - reference: PMID:42687971
    reference_title: "Clinical phenotype spectrum and prognostic analysis of DNM1L-related disorders: a single-center cohort study of 18 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Literatures review confirmed DNM1L variants are predominantly missense,
      with the middle domain as a hotspot.
    explanation: Summarises the variant spectrum across the literature.
  - reference: PMID:27328748
    reference_title: Biallelic Mutations in DNM1L are Associated with a Slowly Progressive Infantile Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified compound heterozygous DNM1L variants in two brothers
      presenting with an infantile slowly progressive neurological impairment.
    explanation: The recessive form.

epidemiology:
- name: Case fatality rate
  description: >
    Overall mortality of Legionnaires' disease ranges from about 4% to 40%
    depending on clinical setting, reaching the upper end in ICU,
    immunocompromised, or nosocomial cases despite appropriate antimicrobial
    therapy.
  minimum_value: 4.0
  maximum_value: 40.0
  unit: "%"
  factors:
  - Infectious

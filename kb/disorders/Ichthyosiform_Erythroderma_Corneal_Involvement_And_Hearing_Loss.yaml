    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Reduced serum ceruloplasmin and total copper levels are common."
    explanation: States the biochemical finding across the reported population.
  - reference: PMID:31630791
    reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, our results expand the list of inborn errors of copper metabolism."
    explanation: >-
      The authors' own classification of the disorder, which is what places this entry with
      the copper disorders rather than with the ichthyoses.
  downstream:
  - target: Congenital Ichthyosiform Erythroderma
    description: >-
      The skin phenotype. Copper is a cofactor for enzymes of keratinisation and hair-shaft
      formation, which is the standard account, but no source cited here traces the route
      from the copper defect to the skin in this disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

name: Ichthyosiform Erythroderma, Corneal Involvement, and Hearing Loss
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
description: >-
  This is the autosomal recessive, AP1B1-related disorder variously called KIDAR
  (autosomal recessive keratitis-ichthyosis-deafness syndrome), Desmons syndrome, and most
  recently IDEDNIK syndrome. It is not the same disease as the dominant, GJB2-related KID
  syndrome it is named after, and getting that distinction right is the first job of
  anybody reading this entry.

  AP1B1 encodes the large beta-1 subunit of the AP-1 clathrin adaptor complex, which sorts
  cargo at the trans-Golgi network. The disease is an inborn error of copper metabolism
  reached through a trafficking defect rather than through a copper transporter itself:
  without a functional AP-1 complex, the copper-transporting ATPase ATP7A is mislocalised,
  and patient fibroblasts reproduce the ATP7A trafficking abnormality described in MEDNIK
  syndrome, the disorder caused by biallelic variants in the small sigma subunit of the
  same complex. Serum copper and ceruloplasmin are low. The clinical picture is a
  combination that only makes sense once the trafficking lesion is understood: ichthyosis
  with erythroderma and palmoplantar keratoderma, sensorineural deafness, keratitis with
  photophobia and corneal scarring, sparse brittle hair, and a severe enteropathy with
  failure to thrive that is a leading cause of early death.

  Two things about this entry deserve to be read before its content is used.

  First, the identity question is genuinely unsettled at the ontology level. MONDO carries
  both MONDO:0009440, which this entry binds and to which MONDO itself attaches AP1B1, and
  MONDO:0859278, "keratoderma-ichthyosis-deafness syndrome, autosomal recessive", which the
  existing dismech KID syndrome entry names as the identifier for KIDAR. Whether those are
  two labels for one disease is a question for MONDO rather than for a curator, and this
  entry records the situation rather than quietly picking a side.

  Second, the naming history is a trap. "KID syndrome" without qualification means the
  dominant GJB2 disease. AP1B1 disease shares the ichthyosis, keratitis and deafness and
  adds failure to thrive, developmental delay and the copper abnormality, and the two have
  no mechanism in common. The gene names are not similar and the inheritance differs, so
  the confusion is entirely driven by the shared clinical label.
synonyms:
- KIDAR
- keratitis-ichthyosis-deafness syndrome, autosomal recessive
- Desmons syndrome
- IDEDNIK syndrome
- ichthyosiform erythroderma, corneal involvement, and deafness
- MEDNIK-like syndrome

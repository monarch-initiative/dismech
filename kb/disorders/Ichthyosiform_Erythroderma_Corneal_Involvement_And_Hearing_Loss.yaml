  downstream:
  - target: Systemic Copper Handling Defect
    description: >-
      The cellular trafficking defect appears systemically as low circulating copper and
      ceruloplasmin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31630791
      reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similar to individuals with MEDNIK syndrome, the affected individuals we report
        display abnormal copper metabolism, evidenced by low plasma copper and
        ceruloplasmin, but lack evidence of copper toxicity in the liver.
      explanation: >-
        Gives the biochemical phenotype and, in the same sentence, a substantive negative:
        the hepatic copper toxicity arm of the MEDNIK picture was looked for in these
        patients and not found. The entry keeps that clause rather than trimming to the
        supportive half.
- name: Systemic Copper Handling Defect
  biological_scale: ORGANISM
  description: >-
    Low serum copper and low ceruloplasmin. Note the asymmetry with MEDNIK: the copper
    deficiency arm is present and the hepatic copper toxicity arm was not demonstrated in
    the founding AP1B1 patients, although later guidance describes zinc therapy aimed at
    liver copper overload. This entry does not resolve that tension and marks it as a
    knowledge gap.
  biological_processes:
  - preferred_term: copper ion homeostasis

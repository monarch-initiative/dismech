pathophysiology:
- name: Biallelic AP1B1 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous or compound heterozygous null variants in AP1B1. The reported allelic
    spectrum includes nonsense and frameshift alleles and at least two whole-exon
    deletions, which is why copy-number analysis is recommended alongside sequencing when
    the diagnosis is suspected.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: AP1B1
      term:
        id: hgnc:554
        label: AP1B1
    description: >-
      Null alleles, including at least two multi-exon deletions. No genotype-phenotype
      correlation has been established, which is unsurprising at this sample size.
  cellular_components:
  - preferred_term: AP-1 adaptor complex
    term:
      id: GO:0030121
      label: AP-1 adaptor complex
  evidence:
  - reference: PMID:31630791
    reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three individuals from two unrelated families in whom a MEDNIK-like
      phenotype segregates with two homozygous null variants in AP1B1, encoding the large
      beta subunit of the AP-1 complex.
    explanation: The founding gene-disease report, with segregation in two families.
  - reference: PMID:37657632
    reference_title: "Severe KIDAR syndrome caused by deletion in the AP1B1 gene: Report of a teenage patient and systematic review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive keratitis-ichthyosis-deafness syndrome (KIDAR MIM #242150) is a
      very rare disorder caused by pathogenic loss-of-function variants in the AP1B1 gene.
    explanation: >-
      Confirms the gene-disease relationship and, importantly for this entry, ties the
      KIDAR name and OMIM 242150 to AP1B1 rather than to GJB2.
  downstream:
  - target: AP-1 Adaptor Complex Dysfunction
    description: >-
      Losing the large beta-1 subunit disables the heterotetrameric adaptor that sorts
      cargo at the trans-Golgi network.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31630791
      reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Central to the pathogenesis of MEDNIK syndrome is abnormal AP-1-mediated
        trafficking of copper transporters; this abnormal trafficking results in a hybrid
        phenotype combining the copper-deficiency-related characteristics of Menkes disease
        and the copper-toxicity-related characteristics of Wilson disease.
      explanation: >-
        States the established pathogenesis for the sigma-subunit disorder. INDIRECT here
        on purpose: the sentence is about MEDNIK (AP1S1), and applying it to AP1B1 is the
        inference the founding paper then went on to test directly.
- name: AP-1 Adaptor Complex Dysfunction
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The AP-1 clathrin adaptor complex cannot perform its cargo-sorting role at the
    trans-Golgi network. Because the complex has several subunits and two of them now cause
    human disease, this node is where the AP1B1 and AP1S1 disorders converge, and it is why
    they share a phenotype and a treatment.
  cellular_components:
  - preferred_term: AP-1 adaptor complex
    term:
      id: GO:0030121
      label: AP-1 adaptor complex
  - preferred_term: trans-Golgi network
    term:
      id: GO:0005802
      label: trans-Golgi network
  evidence:
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of IDEDNIK syndrome is established in a proband by identification of
      biallelic pathogenic variants in AP1B1 or AP1S1 by molecular genetic testing.
    explanation: >-
      Establishes that the two subunit genes are curated as one clinical entity, which is
      the strongest available statement that the complex, rather than either subunit, is
      the operative level. Graded INDIRECT rather than DIRECT: the sentence states
      diagnostic criteria and does not assert that the complex fails to sort cargo. The
      step from "either subunit produces the same disease" to "the complex is the operative
      level" is an inference, and the explanation had already conceded as much while the
      grade said otherwise.
  downstream:
  - target: ATP7A Mislocalisation
    description: >-
      The copper-transporting ATPase ATP7A depends on AP-1 for its trafficking, and
      patient fibroblasts show the mislocalisation directly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31630791
      reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Functional characterization of fibroblasts derived from affected individuals closely
        resembles the abnormal ATP7A trafficking described in MEDNIK syndrome both at
        baseline and in response to copper treatment.
      explanation: >-
        Demonstrates the trafficking defect in AP1B1 patient cells rather than assuming it
        from the AP1S1 disease, and does so both at baseline and under copper challenge.
- name: ATP7A Mislocalisation
  biological_scale: CELLULAR
  description: >-
    ATP7A is not delivered to where it must be to move copper across membranes and into
    the secretory pathway. The functional consequence is the same as in MEDNIK: a systemic
    copper-handling defect produced without any variant in a copper transporter.
  cell_types:
  - preferred_term: fibroblast

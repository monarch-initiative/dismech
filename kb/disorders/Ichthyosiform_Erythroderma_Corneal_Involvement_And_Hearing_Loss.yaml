      mechanism-directed treatment link and it is the one most exposed to the unresolved
      copper-arm question: the founding AP1B1 report found copper deficiency rather than
      overload, so a therapy that further limits copper uptake is not obviously acting in
      the direction the pathograph node describes. Recorded as MODULATES rather than
      RESTORES for that reason.

genetic:
- name: AP1B1
  gene_term:
    preferred_term: AP1B1
    term:
      id: hgnc:554
      label: AP1B1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    Encodes the large beta-1 subunit of the AP-1 clathrin adaptor complex. The sibling
    disease at the small sigma subunit, AP1S1, is MEDNIK syndrome, and current
    GeneReviews treats the two genes as one clinical entity under the name IDEDNIK.
  evidence:
  - reference: PMID:31630791
    reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three individuals from two unrelated families in whom a MEDNIK-like
      phenotype segregates with two homozygous null variants in AP1B1, encoding the large
      beta subunit of the AP-1 complex.
    explanation: Establishes the gene-disease relationship with segregation data.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic AP1B1 loss-of-function variants. Note that at least one reported patient was
    born to non-consanguineous parents, so consanguinity should not be treated as a
    prerequisite for suspecting the diagnosis.
  evidence:
  - reference: PMID:37657632
    reference_title: "Severe KIDAR syndrome caused by deletion in the AP1B1 gene: Report of a teenage patient and systematic review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive keratitis-ichthyosis-deafness syndrome (KIDAR MIM #242150) is a
      very rare disorder caused by pathogenic loss-of-function variants in the AP1B1 gene.
    explanation: States the inheritance mode and the biallelic loss-of-function mechanism.
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for an AP1B1 or AP1S1 pathogenic variant,
      each sib of an affected individual has at conception a 25% chance of being affected, a
      50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and
      not a carrier.
    explanation: >-
      The recurrence risk genetic counselling turns on. Note the conditional the sentence
      opens with: it holds where both parents are known heterozygotes, which is not
      automatic here given that at least one reported patient was born to
      non-consanguineous parents.
progression:
- phase: Variable, from death before age two to survival into adulthood
  notes: >-
    Curated as one phase rather than as a sequence, because the reported outcome range is
    the striking fact and no staged natural history has been described at this sample size.
    The two named causes of early death are severe enteropathy and sepsis.
  evidence:
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Death prior to age two years occurs in some individuals due to severe enteropathy or
      sepsis; in others survival into adulthood is reported.
    explanation: >-
      States the outcome range and its causes. The absence of any predictor of which course
      a given patient will follow is recorded as a knowledge gap.
diagnosis:
- name: AP1B1 Sequencing with Copy-Number Analysis
  description: >-
    Molecular confirmation. Sequencing alone is not sufficient: at least two of the
    reported patients carry multi-exon deletions, and the systematic review recommends
    copy-number analysis alongside sequencing when the diagnosis is suspected.
  evidence:
  - reference: PMID:37657632
    reference_title: "Severe KIDAR syndrome caused by deletion in the AP1B1 gene: Report of a teenage patient and systematic review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggest copy number variation analysis to be performed alongside sequencing of the
      AP1B1 gene in case of suspicion
    explanation: >-
      The specific diagnostic recommendation, and the reason this row exists as its own
      entry rather than as generic gene sequencing.
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of IDEDNIK syndrome is established in a proband by identification of
      biallelic pathogenic variants in AP1B1 or AP1S1 by molecular genetic testing.
    explanation: >-
      The confirmatory-test statement, which is what this diagnostic row asserts. The same
      sentence appears on the AP-1 complex node supporting a weaker, inferential claim and
      is graded INDIRECT there; here it is DIRECT because the sentence is precisely about
      how the diagnosis is established.
- name: Serum Copper and Ceruloplasmin
  description: >-
    Low serum copper and ceruloplasmin in a child with congenital ichthyosis and deafness
    is what separates this disorder from the other congenital ichthyoses at the bedside,
    and it is a cheap test.
  evidence:
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Reduced serum ceruloplasmin and total copper levels are common."
    explanation: Establishes the biochemical finding that this test looks for.
treatments:
- name: Oral Zinc Acetate
  description: >-
    Targeted therapy aimed at reducing liver copper overload, reported to improve
    behavioural disturbance, skin manifestations and cognitive function in some
    individuals. It is the only mechanism-directed treatment described for this disorder,
    and it is important not to overstate it: GeneReviews says experience is limited, the
    benefit is reported in some patients rather than demonstrated in a trial, and its
    rationale involves liver copper overload, which the founding AP1B1 report specifically
    did not find in its patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

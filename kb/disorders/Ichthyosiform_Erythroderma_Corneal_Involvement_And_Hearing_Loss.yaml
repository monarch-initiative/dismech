    notes: An autosomal recessive Mendelian disorder of a vesicular trafficking complex.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism, and specifically of copper metabolism, reached
      through mislocalisation of a copper transporter rather than through a defect in the
      transporter itself.
  - classification_value: DERMATOLOGY
    notes: >-
      The presenting picture is dermatological: congenital ichthyosiform erythroderma with
      palmoplantar keratoderma.

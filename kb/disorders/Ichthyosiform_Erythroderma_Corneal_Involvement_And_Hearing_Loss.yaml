differential_diagnoses:
- name: KID syndrome (GJB2)
  description: >-
    The dominant, connexin-26 disease this disorder is named after and is routinely
    confused with. It shares keratitis, ichthyosis and deafness and shares no mechanism.
    dismech curates it separately as Keratitis-Ichthyosis-Deafness_Syndrome, whose own
    notes place the AP1B1 disorder out of its scope.
  distinguishing_features:
  - Autosomal dominant, mostly de novo, versus autosomal recessive here
  - Caused by gain-of-function GJB2 variants, versus AP1B1 null alleles here
  - No copper abnormality, no enteropathy, no failure to thrive
  - Elevated squamous cell carcinoma risk, not reported in the AP1B1 disorder
- name: MEDNIK syndrome (AP1S1)
  description: >-
    The sibling disorder at the small sigma subunit of the same adaptor complex.
    Mechanistically this is the closest relative, not a mimic: current GeneReviews treats
    AP1B1 and AP1S1 disease as one entity, IDEDNIK syndrome. The reported difference is
    that the AP1B1 patients showed the copper-deficiency arm without demonstrable hepatic
    copper toxicity.
  distinguishing_features:
  - Caused by AP1S1 rather than AP1B1
  - Peripheral neuropathy is part of the MEDNIK acronym and is not prominent in reported AP1B1 patients
  - Hepatic copper toxicity described in MEDNIK, looked for and not found in the founding AP1B1 patients
  evidence:
  - reference: PMID:31630791
    reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to individuals with MEDNIK syndrome, the affected individuals we report
      display abnormal copper metabolism, evidenced by low plasma copper and ceruloplasmin,
      but lack evidence of copper toxicity in the liver.
    explanation: >-
      The sentence that both links the two disorders and states the one reported
      difference.
- name: Menkes disease and Wilson disease
  description: >-
    The two classical copper disorders whose features the AP-1 adaptor diseases combine.
    Worth listing because a low copper and ceruloplasmin in an infant will usually prompt
    a Menkes work-up first, and the skin and hearing phenotype is what should redirect it.
  distinguishing_features:
  - Caused by ATP7A and ATP7B respectively, rather than by an adaptor complex
  - No congenital ichthyosis or enteropathy
  evidence:
  - reference: PMID:35144013
    reference_title: "Phenotypic spectrum of autosomal recessive Keratitis-Ichthyosis-Deafness Syndrome (KIDAR) due to mutations in AP1B1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Inborn errors in copper metabolism result in a diverse set of abnormalities such as
      Wilson disease and MEDNIK syndrome.
    explanation: Places the disorder in the copper-disease differential.
discussions:
- discussion_id: mondo_identity_0009440_vs_0859278
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Ichthyosiform Erythroderma, Corneal Involvement, and Hearing Loss
  prompt: >-
    Are MONDO:0009440 and MONDO:0859278 two identifiers for the same AP1B1 disease, and if
    so which should dismech bind?
  rationale: >-
    MONDO carries MONDO:0009440 "ichthyosiform erythroderma, corneal involvement, and
    hearing loss", with AP1B1 attached as its causal gene and with "KID syndrome, autosomal
    recessive" and "Desmons syndrome" among its synonyms; it also carries MONDO:0859278
    "keratoderma-ichthyosis-deafness syndrome, autosomal recessive", which the existing
    dismech Keratitis-Ichthyosis-Deafness_Syndrome entry names as the identifier for KIDAR.
    Note that MONDO:0859278 says kerato-derma where the AP1B1 literature says kerat-itis,
    so they may also be genuinely different concepts rather than duplicates. This entry
    binds MONDO:0009440 because that is the class MONDO itself associates with AP1B1, and
    records the alternative here rather than asserting an equivalence that dismech is not
    the right place to decide. This is an upstream question for MONDO.
- discussion_id: copper_defect_to_skin_and_gut
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Systemic Copper Handling Defect
  - phenotypes#Congenital Ichthyosiform Erythroderma
  - phenotypes#Severe Enteropathy
  prompt: >-
    Do the skin and gut phenotypes follow from the copper defect, or from AP-1 cargo other
    than ATP7A that has not been identified?
  rationale: >-
    The pathograph in this entry runs the skin and gut phenotypes downstream of the copper
    handling defect, and both of those edges carry unknown intermediates because nothing
    cited here traces the route. There is a live alternative: AP-1 sorts many cargoes, and
    the ichthyosis and the enteropathy could reflect mistrafficking of epidermal or
    intestinal proteins entirely unrelated to copper. The clinical fact that bears on this
    is that zinc therapy, which acts on copper, is reported to improve the skin - which
    favours the copper route - but that report is uncontrolled and in some patients only.
    The distinction determines whether copper-directed therapy is worth pursuing for the
    two features that dominate morbidity and mortality.
  evidence:
  - reference: PMID:39541497
    reference_title: "IDEDNIK Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Treatment with oral zinc acetate therapy to reduce liver copper overload has been
      reported to improve behavioral disturbances, skin manifestations, and cognitive
      function in some individuals.
    explanation: >-
      The one piece of evidence bearing on the copper route to the skin phenotype, and it
      is a therapeutic response rather than a mechanistic demonstration - so INDIRECT, and
      weak.
- discussion_id: hepatic_copper_arm_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Systemic Copper Handling Defect
  - treatments#Oral Zinc Acetate
  prompt: >-
    Does hepatic copper overload occur in AP1B1 disease, given that the only targeted
    therapy is aimed at reducing it and the founding report did not find it?
  rationale: >-
    The founding AP1B1 paper states plainly that the affected individuals lacked evidence
    of copper toxicity in the liver, which is the arm of the MEDNIK picture derived from
    Wilson disease. GeneReviews nonetheless describes zinc acetate therapy for IDEDNIK as
    acting to reduce liver copper overload. Both cannot be straightforwardly true of the
    same patients. The likeliest reconciliations are that hepatic overload develops with
    age and was absent in the young patients first reported, or that the GeneReviews
    rationale is carried over from AP1S1 disease, where it was established. Either way, a
    curator should not read the treatment rationale as evidence that the hepatic arm is
    present in AP1B1 disease.
  evidence:
  - reference: PMID:31630791
    reference_title: "Homozygous Loss-of-Function Mutations in AP1B1, Encoding Beta-1 Subunit of Adaptor-Related Protein Complex 1, Cause MEDNIK-like Syndrome."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar to individuals with MEDNIK syndrome, the affected individuals we report
      display abnormal copper metabolism, evidenced by low plasma copper and ceruloplasmin,
      but lack evidence of copper toxicity in the liver.
    explanation: >-
      Recorded as REFUTE against the presence of hepatic copper overload in AP1B1 disease.
      This is a negative finding that was looked for, not an absence of data.
notes: >-
  Lump/split decision: DISEASE. One gene, one adaptor complex, one conserved pathograph.
  The stub is retired accordingly. Nothing in kb/ binds MONDO:0009440, and the existing
  Keratitis-Ichthyosis-Deafness_Syndrome entry puts this disorder explicitly out of its own
  scope in its notes and carries it as a differential, so a separate entry is what that
  entry expects rather than a duplication of it.

  The MONDO:0009440 versus MONDO:0859278 question is recorded as a knowledge gap rather
  than decided. In short: MONDO attaches AP1B1 to MONDO:0009440, so that is what this entry
  binds; the KID entry names MONDO:0859278 for KIDAR; and MONDO:0859278's label says
  keratoderma rather than keratitis, so they may be distinct concepts. That belongs
  upstream. Concretely, the disagreement is with
  Keratitis-Ichthyosis-Deafness_Syndrome.yaml lines 36-39, whose own scope note names
  MONDO:0859278 as the AP1B1 disorder while MONDO itself attaches AP1B1 to MONDO:0009440.
  That entry has deliberately not been edited by this PR: which of the two identifiers is
  right is the open question, and writing an answer into a second entry would spread a
  guess rather than resolve it.

  THE DEEP-RESEARCH REPORT FOR THIS ENTRY WAS DISCARDED AND NONE OF ITS CONTENT WAS USED.
  It is committed under research/ for provenance, as the run required, but it researched
  the wrong disease. Given the label "Ichthyosiform Erythroderma, Corneal Involvement, and
  Hearing Loss" and MONDO:0009440, the openscientist run produced a thorough and internally
  competent report on the dominant GJB2 KID syndrome: it names GJB2 fourteen times and
  AP1B1 not once, describes the disease as autosomal dominant and mostly de novo, and
  builds its mechanism section on connexin-26 hemichannel gain of function. It even lists
  Desmons syndrome as a synonym of the GJB2 disease. This is Named Entity Confusion of the
  kind the dismech-references skill warns about, reached through a shared clinical label
  rather than through a gene name, and it is worth knowing that the MONDO ID was supplied
  to the provider and did not prevent it. Had the report been used, this entry would have
  duplicated the existing Keratitis-Ichthyosis-Deafness_Syndrome entry under a different
  name. Every reference here was found independently through PubMed and fetched into
  references_cache/; every snippet was verified against that cache.

  On the reference cache committed with this PR. Thirty of the thirty-four cached
  references are about the dominant GJB2 disease rather than about this one, because the
  deep-research run that fetched them researched that disease. Twenty-five mention GJB2,
  connexin or Cx26 and never mention AP1B1. They are committed because they are the
  citations of the report, which is committed for provenance, and they are real references
  about a real disease that dismech curates elsewhere - but they are not this entry's
  literature and citing them here would be an error rather than an improvement. The one
  genuinely relevant file the run happened to fetch, PMID:41453769, is cited and supplied
  the acitretin treatment row.

  A limitation of the curation. This disease has three names in three literatures -
  Desmons syndrome in the older dermatology reports, KIDAR in the genetics ones, IDEDNIK in
  current GeneReviews - and the evidence items here draw on all three. dismech has no slot
  that records which name a source used, so a reader cannot tell from the structure that
  the GeneReviews evidence describes AP1B1 and AP1S1 disease together under a joint name
  while the KIDAR evidence describes AP1B1 alone. Where that distinction bears on a claim,
  the explanation says so.

  Enteropathy carries a preferred_term with no HP binding. The HPO enteropathy classes are
  mechanism-specific in ways the cited sentence does not support, and no term beats a term
  that asserts a mechanism the source does not.

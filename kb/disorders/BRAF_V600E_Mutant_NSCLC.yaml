discussions:
- discussion_id: gap_braf_v600e_first_line_sequencing
  prompt: >-
    How should dabrafenib-trametinib, encorafenib-binimetinib, chemotherapy, and
    immune-checkpoint-based regimens be sequenced in first-line and later-line
    metastatic BRAF V600E NSCLC?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Dabrafenib Plus Trametinib
  - treatments#Encorafenib Plus Binimetinib
  rationale: >-
    Both targeted combinations have single-arm phase-II evidence, while
    chemotherapy and immunotherapy comparisons are retrospective and small.
    Cross-trial outcome differences cannot establish comparative superiority.
  evidence:
  - reference: PMID:40480428
    reference_title: Updated Efficacy and Safety From the Phase 2 PHAROS Study of Encorafenib Plus Binimetinib in Patients With BRAF V600E-Mutant Metastatic NSCLC-A Brief Report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this ongoing open-label, single-arm, phase 2 study, patients with BRAF
      V600E-mutant mNSCLC
    explanation: PHAROS is explicitly single-arm and therefore cannot answer the head-to-head sequencing question.
  - reference: PMID:40138888
    reference_title: "Prevalence, genetic variations and clinical outcomes of BRAF-V600 mutated advanced NSCLC in China: a retrospective real-world multi-centre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the low incidence of BRAF mutations, limited data is available
      about their prevalence and clinical characteristics. Moreover,
      comparative real-world efficacy of dabrafenib combined with trametinib
      versus other treatment regimens, especially in Chinese patients, is also
      lacking.
    explanation: The study itself identifies the comparative-evidence limitation.
- discussion_id: gap_braf_v600e_resistance_map
  prompt: >-
    Which genomic and lineage-state resistance mechanisms are recurrent,
    actionable, and causally sufficient after dual BRAF/MEK inhibition?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MAPK Reactivation and Bypass Resistance
  rationale: >-
    Prospective plasma profiling identifies multiple candidate mechanisms but
    explains only a subset of progression events. Tissue-based, longitudinal,
    and functional validation is needed to separate causal drivers from
    passenger alterations.
  evidence:
  - reference: PMID:32859654
    reference_title: Circulating Tumor DNA Genomics Reveal Potential Mechanisms of Resistance to BRAF-Targeted Therapies in Patients with BRAF-Mutant Metastatic Non-Small Cell Lung Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential drivers of resistance to either BRAF-TT monotherapy or BRAF/MEK
      combination were identified in 46% of patients
    explanation: The 46% yield directly demonstrates a substantial unexplained fraction.
- discussion_id: gap_braf_v600e_model_fidelity
  prompt: >-
    Which human lung epithelial cell states and cooperating lesions convert
    BRAF V600E initiation into invasive human NSCLC?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cooperating Tumor-Suppressor and Lineage-State Alterations
  - experimental_models#Isogenic BRAF V600E Knock-In BEAS-2B Lung Epithelial Cells
  rationale: >-
    Mouse models strongly support TP53, CDKN2A, PI3K, and NKX2-1 cooperation,
    while the human BEAS-2B knock-in model shows state changes but not complete
    carcinogenesis. Their relative importance in human tumors remains
    incompletely resolved.
  evidence:
  - reference: PMID:40439425
    reference_title: Proteomic and metabolomic dissection of the BRAF V600E mutation-induced cellular state transition in lung epithelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although the BRAF V600E mutation alone was not sufficient to drive lung
      carcinogenesis
    explanation: The human isogenic model explicitly exposes the incomplete-transformation gap.
- discussion_id: gap_braf_v600e_thromboembolism_signal
  prompt: >-
    Is thromboembolism, particularly cancer-related stroke, genuinely enriched
    in BRAF V600E-mutant NSCLC?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    A retrospective series observed a high event fraction, but it contained
    only ten patients and had a very wide confidence interval. The signal is
    hypothesis-generating and is not modeled as an established phenotype or
    subtype-specific incidence estimate.
  evidence:
  - reference: PMID:36697098
    reference_title: Cumulative Incidence of Thromboembolism and Prognostic Impact of Stroke in BRAF V600E-mutant Non-small-cell Lung Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 10 patients with BRAF-V600E mutant lung cancer, five developed a total
      of seven thromboembolic events, showing a 1-year cumulative incidence of
      43% (95% confidence interval=11-72%).
    explanation: The small sample and wide interval justify retaining the observation as an open question.


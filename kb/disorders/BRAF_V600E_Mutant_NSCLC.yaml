  description: >-
    Dual pathway inhibition suppresses sensitive cells while favoring survival
    and expansion of clones with on-pathway reactivation, bypass signaling, or
    altered cell state. This is a treatment-conditioned mechanism rather than
    part of untreated tumor initiation.
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    modifier: ABNORMAL
    term:

    explanation: The liquid-assay result supports complementary use while showing imperfect sensitivity even with sufficient ctDNA.
  - reference: PMID:42284541
    reference_title: "Liquid Biopsy Monitoring in BRAF V600E-Mutated Patients With Non-Small Cell Lung Cancer Treated With Dabrafenib Plus Trametinib: The Prospective, Multicenter LiBRA Study (GOIRC-03-2020)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

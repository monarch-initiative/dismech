name: BRAF V600E-Mutant Non-Small Cell Lung Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  BRAF V600E-mutant non-small cell lung cancer (NSCLC) is a molecularly defined
  lung-cancer subtype whose tumor cells carry the somatic BRAF c.1799T>A
  (p.Val600Glu) driver. The class-I mutant signals as a RAS-independent active
  monomer and sustains MEK-ERK output, creating a therapeutically actionable
  oncogene dependence. Most reported tumors are adenocarcinomas, but this entry
  remains scoped to NSCLC because BRAF V600E is a molecular classifier rather
  than a histology-exclusive entity. Dual BRAF/MEK inhibition with dabrafenib
  plus trametinib or encorafenib plus binimetinib has prospective phase-II
  evidence in metastatic disease. Acquired resistance can reactivate MAPK
  signaling or engage bypass pathways, so repeat molecular assessment at
  progression is clinically informative.
categories:
- Molecularly-Defined Cancer
- Lung Cancer Subtype
- Solid Tumor
- Oncogene-Driven Cancer
parents:
- non-small cell lung carcinoma
synonyms:
- BRAF V600E-positive NSCLC
- BRAF V600E-mutant lung cancer
- BRAF V600E-mutant lung adenocarcinoma

epidemiology:
- name: Rare, denominator-dependent molecular subtype
  description: >-
    The previously untreated dabrafenib-trametinib trial describes BRAF V600E
    in 1-2% of lung adenocarcinomas. A much larger Chinese molecular-testing
    cohort found any BRAF mutation in 3.56% of tested NSCLC and V600E in 24.6%
    of the BRAF-mutant subset. These are cohort proportions, not population
    point-prevalence estimates, and the V600E fraction varies with ancestry,
    histology, stage, and testing strategy.
  evidence:
  - reference: PMID:28919011
    reference_title: "Dabrafenib plus trametinib in patients with previously untreated BRAF(V600E)-mutant metastatic non-small-cell lung cancer: an open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BRAFV600E mutation occurs in 1-2% of lung adenocarcinomas and acts as an oncogenic driver.
    explanation: The phase-II report states the approximate lung-adenocarcinoma fraction and driver status.
  - reference: PMID:40138888
    reference_title: "Prevalence, genetic variations and clinical outcomes of BRAF-V600 mutated advanced NSCLC in China: a retrospective real-world multi-centre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Cohort I, of patients with NSCLC, 6249 (3.56%, 95% CI: 3.48%-3.65%)
      were confirmed to harbour a BRAF mutation. BRAF V600E accounted for 24.6%
      (1539/6249) of all patients with BRAF-mutated NSCLC.
    explanation: The large testing cohort supplies explicit overall-BRAF and within-BRAF V600E denominators.
- name: Adenocarcinoma and never-smoker enrichment
  description: >-
    In one 53-patient advanced-NSCLC cohort, 96.2% had adenocarcinoma and 64.2%
    were nonsmokers. These enrichments help characterize tested cohorts but are
    neither diagnostic criteria nor substitutes for molecular testing.
  evidence:
  - reference: PMID:35814395
    reference_title: "Clinical Characteristics, Co-Mutations, and Treatment Outcomes in Advanced Non-Small-Cell Lung Cancer Patients With the BRAF-V600E Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-three patients with BRAF V600E-mutant advanced NSCLC were included
      in the study, of which 64.2% were non-smokers, and the BRAF V600E mutation
      was more prevalent in men (52.8%). In addition, 96.2% of the patients had
      adenocarcinoma
    explanation: The molecularly selected cohort directly supports the stated histology and smoking-status proportions.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_braf_v600e_lung_tumor_model
  hypothesis_label: Canonical BRAF V600E Lung-Tumor Model
  status: CANONICAL
  description: >-
    Somatic BRAF V600E produces RAS-independent monomeric RAF activity and
    sustained MEK-ERK signaling. In a permissive lung epithelial context,
    cooperating loss of tumor-suppressor or lineage-control programs permits
    MAPK-driven proliferation and survival to progress to invasive NSCLC.
    BRAF V600E alone can initiate proliferation yet also provoke a
    senescence-like arrest, so the mutation is a driver but not a complete
    mechanistic explanation for malignant progression.
  evidence:
  - reference: PMID:17299132
    reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BRaf(VE) expression initially induced proliferation that was followed by
      growth arrest bearing certain hallmarks of senescence. Consistent with
      Ink4a/Arf and TP53 tumor suppressor function, BRaf(VE) expression combined
      with mutation of either locus led to cancer progression.
    explanation: The lung-specific model separates oncogene-driven initiation from cooperating malignant progression.
- hypothesis_group_id: acquired_braf_meck_resistance_model
  hypothesis_label: Acquired BRAF/MEK-Inhibitor Resistance Model
  status: CANONICAL
  description: >-
    Dual BRAF/MEK inhibition imposes treatment selection on heterogeneous tumor
    clones. Progression can arise through renewed MAPK output, PI3K-pathway
    signaling, receptor-kinase copy-number changes, or lineage-state changes.
    The class structure is established, but no single alteration explains every
    resistant tumor.
  evidence:
  - reference: PMID:32859654
    reference_title: Circulating Tumor DNA Genomics Reveal Potential Mechanisms of Resistance to BRAF-Targeted Therapies in Patients with BRAF-Mutant Metastatic Non-Small Cell Lung Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential drivers of resistance to either BRAF-TT monotherapy or BRAF/MEK
      combination were identified in 46% of patients and these included
      activating mutations in effectors of the MAPK and PI3K pathways, as well
      as alterations in U2AF1, IDH1, and CTNNB1.
    explanation: Prospective ctDNA profiling supports multiple genomic resistance classes and incomplete explanatory yield.

pathophysiology:
- name: Somatic BRAF p.Val600Glu Driver
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The tumor-acquired BRAF c.1799T>A substitution encodes p.Val600Glu in the
    kinase activation segment. BRAF V600 variants form class I: they are
    RAS-independent, signal as active monomers, and are susceptible to RAF
    monomer inhibitors. This disease entry concerns the V600E allele in NSCLC,
    not class-II or class-III non-V600 BRAF tumors.
  genes:
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    modifier: INCREASED
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  evidence:
  - reference: PMID:28783719
    reference_title: Tumours with class 3 BRAF mutants are sensitive to the inhibition of activated RAS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Class 1 BRAF mutations (BRAF V600 mutations) are RAS-independent, signal
      as monomers and are sensitive to current RAF ‘monomer’ inhibitors.
    explanation: The functional-classification study directly defines the signaling behavior of BRAF V600 mutations.
  - reference: PMID:28919011
    reference_title: "Dabrafenib plus trametinib in patients with previously untreated BRAF(V600E)-mutant metastatic non-small-cell lung cancer: an open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BRAFV600E mutation occurs in 1-2% of lung adenocarcinomas and acts as an oncogenic driver.
    explanation: The molecularly selected clinical trial identifies V600E as an oncogenic lung-cancer driver.
  downstream:
  - target: Sustained MEK-ERK Signaling
    causal_link_type: DIRECT
    description: Constitutive mutant BRAF kinase activity sustains MEK1/2-ERK1/2 pathway output.
    hypothesis_groups:
    - canonical_braf_v600e_lung_tumor_model
    evidence:
    - reference: PMID:17299132
      reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutationally activated BRAF(V600E) (BRAF(VE)) is detected in
        approximately 6% of human malignancies and promotes sustained
        MEK1/2-ERK1/2 pathway activation.
      explanation: The lung-model study directly connects BRAF V600E with sustained MEK-ERK activation.

- name: Sustained MEK-ERK Signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Persistent RAF output activates the MEK-ERK cascade independently of an
    upstream RAS requirement. In established tumors this pathway maintains
    growth and survival, while in normal lung epithelial contexts the same
    oncogenic signal can also trigger a growth-arrest barrier.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:17299132
    reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutationally activated BRAF(V600E) (BRAF(VE)) is detected in
      approximately 6% of human malignancies and promotes sustained
      MEK1/2-ERK1/2 pathway activation.
    explanation: The model establishes sustained MEK-ERK output downstream of the mutant kinase.
  downstream:
  - target: MAPK-Dependent Tumor-Cell Proliferation and Survival
    causal_link_type: DIRECT
    description: Sustained pathway activity maintains the proliferative and survival program of BRAF-driven lung tumor cells.
    hypothesis_groups:
    - canonical_braf_v600e_lung_tumor_model
    evidence:
    - reference: PMID:17299132
      reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, BRaf(VE)-induced lung tumors were prevented by
        pharmacological inhibition of MEK1/2.
      explanation: MEK inhibition preventing BRAF-driven lung tumors supports pathway dependence of the growth program.

- name: MAPK-Dependent Tumor-Cell Proliferation and Survival
  role: consequence
  biological_scale: CELLULAR
  description: >-
    BRAF-MEK-ERK activity promotes expansion and persistence of transformed lung
    epithelial cells. BRAF V600E alone does not invariably complete malignant
    transformation: experimental lung systems show an initial proliferative
    phase followed by arrest, making cooperating lesions and cell state
    important modifiers.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:17299132
    reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BRaf(VE) expression initially induced proliferation that was followed by
      growth arrest bearing certain hallmarks of senescence.
    explanation: The model directly demonstrates both the initial proliferative output and its intrinsic limitation.
  downstream:
  - target: Lung Adenocarcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - clonal expansion
    - escape from oncogene-induced growth arrest
    - malignant transformation
    description: >-
      In a permissive lung epithelial context, sustained growth and survival
      contribute to the predominantly adenocarcinoma tumor phenotype.
    hypothesis_groups:
    - canonical_braf_v600e_lung_tumor_model
    evidence:
    - reference: PMID:35814395
      reference_title: "Clinical Characteristics, Co-Mutations, and Treatment Outcomes in Advanced Non-Small-Cell Lung Cancer Patients With the BRAF-V600E Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In addition, 96.2% of the patients had adenocarcinoma
      explanation: The molecularly selected cohort supports adenocarcinoma as the dominant human tumor phenotype.

- name: Cooperating Tumor-Suppressor and Lineage-State Alterations
  role: modifier
  biological_scale: CELLULAR
  description: >-
    Loss of TP53 or CDKN2A can bypass the senescence-like arrest of
    BRAF-initiated lung lesions. PIK3CA activation can promote
    dedifferentiation, while NKX2-1 loss changes lineage identity and reduces
    cell-cycle exit during BRAF/MEK inhibition. These are experimentally
    supported cooperation routes, not lesions required in every human tumor.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  - preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  - preferred_term: NKX2-1
    term:
      id: hgnc:11825
      label: NKX2-1
  evidence:
  - reference: PMID:26001956
    reference_title: TP53 Silencing Bypasses Growth Arrest of BRAFV600E-Induced Lung Tumor Cells in a Two-Switch Model of Lung Tumorigenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      secondary genetic events can promote bypass of the senescence-like
      proliferative arrest displayed by BRAF(V600E)-induced lung adenomas,
      leading to malignant progression.
    explanation: The two-switch model directly supports tumor-suppressor cooperation in malignant progression.
  - reference: PMID:31452510
    reference_title: Mutationally-activated PI3'-kinase-α promotes de-differentiation of lung tumors initiated by the BRAF(V600E) oncoprotein kinase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cooperating alterations that activate PI3'-lipid signaling promote
      progression of BRAFV600E-driven benign tumors to malignant
      adenocarcinoma.
    explanation: The engineered model supports PI3K-pathway cooperation with BRAF V600E.
  - reference: PMID:33821796
    reference_title: An NKX2-1/ERK/WNT feedback loop modulates gastric identity and response to targeted therapy in lung adenocarcinoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NKX2-1-deficient, BRAFV600E-driven tumors resemble human IMA and exhibit
      a distinct response to BRAF/MEK inhibitors.
    explanation: The model connects lineage-factor loss to tumor identity and altered treatment response.
  downstream:
  - target: Lung Adenocarcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - bypass of senescence-like proliferative arrest
    - dedifferentiation or lineage-state change
    - malignant progression
    description: Cooperation permits BRAF-initiated lesions to progress to malignant lung adenocarcinoma.
    hypothesis_groups:
    - canonical_braf_v600e_lung_tumor_model
    evidence:
    - reference: PMID:26001956
      reference_title: TP53 Silencing Bypasses Growth Arrest of BRAFV600E-Induced Lung Tumor Cells in a Two-Switch Model of Lung Tumorigenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        secondary genetic events can promote bypass of the senescence-like
        proliferative arrest displayed by BRAF(V600E)-induced lung adenomas,
        leading to malignant progression.
      explanation: The experiment directly supports the cooperation-to-progression link.


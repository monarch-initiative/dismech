    explanation: Mature PHAROS follow-up directly supports long-term survival in the treatment-naive cohort.

- name: Platinum-Based Chemotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Platinum-based chemotherapy remains a systemic option when targeted therapy
    is unavailable, contraindicated, or after progression, according to the
    patient's stage and treatment history. Available subtype-specific
    comparisons are retrospective rather than randomized.
  treatment_term:

review_notes: >-
  MONDO does not provide a dedicated term for this exact molecular subtype, so
  disease_term binds the broader non-small cell lung carcinoma parent rather
  than the narrower lung-adenocarcinoma term. Adenocarcinoma predominance is
  represented in histopathology and phenotypes. The prior "BRAF non-V600 mutant
  NSCLC" child was removed because it is a sibling molecular class, not a
  subtype of V600E disease. No public dataset accession could be verified for
  the cited 2025 isogenic proteomic/metabolomic study; the reusable model is
  represented under experimental_models and datasets remains explicitly empty.


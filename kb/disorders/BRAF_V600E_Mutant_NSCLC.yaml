biochemical:
- name: Tumor BRAF V600E Detection
  presence: REQUIRED_FOR_SUBTYPE_ASSIGNMENT
  notes: >-
    Demonstration of BRAF V600E in tumor DNA defines this molecular subtype.
    Tissue comprehensive genomic profiling can identify the variant together
    with co-alterations and should distinguish V600E from mechanistically
    different non-V600 variants.
  evidence:
  - reference: PMID:42391424
    reference_title: Clinical validation of tissue and liquid companion diagnostics for BRAF V600E detection in non-small cell lung cancers from the PHAROS study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      F1CDx testing revealed a PPA of 93.2% (85.0%-97.0%), suggesting that F1CDx
      may robustly identify patients with BRAF V600E-mutant NSCLC
    explanation: The PHAROS bridging study clinically validates a tissue-based companion diagnostic.
- name: Plasma BRAF V600E Circulating Tumor DNA
  presence: VARIABLE
  notes: >-
    Plasma testing can provide a complementary detection and longitudinal
    monitoring route, but detectability depends on adequate tumor DNA shedding.
    A negative plasma result does not by itself exclude the subtype.
  evidence:
  - reference: PMID:42391424
    reference_title: Clinical validation of tissue and liquid companion diagnostics for BRAF V600E detection in non-small cell lung cancers from the PHAROS study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In samples with sufficient ctDNA (defined as tumor fraction ≥1%), F1LCDx

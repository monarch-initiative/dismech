differential_diagnoses:
- name: Non-V600 BRAF-Mutant NSCLC
  description: >-
    Class-II and class-III BRAF-mutant lung cancers share the NSCLC presentation
    but differ in RAS dependence, dimerization, kinase activity, and expected
    response to RAF monomer inhibitors.
  distinguishing_features:
  - Demonstrate the exact BRAF allele and assign its functional class rather than treating any BRAF mutation as V600E.
  - Class II signals as a RAS-independent dimer; class III has low or absent kinase activity and depends on activated RAS.
  evidence:
  - reference: PMID:28783719
    reference_title: Tumours with class 3 BRAF mutants are sensitive to the inhibition of activated RAS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Class 1 BRAF mutations (BRAF V600 mutations) are RAS-independent, signal
      as monomers and are sensitive to current RAF ‘monomer’ inhibitors. Class 2
      BRAF mutants are RAS-independent, signal as constitutive dimers and are
      resistant to vemurafenib.
    explanation: Functional classification distinguishes V600 from non-V600 mechanisms and inhibitor sensitivity.
- name: EGFR-Mutant NSCLC with Acquired BRAF V600E
  description: >-
    BRAF V600E can emerge during progression of an originally EGFR-driven tumor
    after EGFR-tyrosine-kinase inhibition. That acquired-resistance state should
    not be conflated with a de novo BRAF V600E-primary NSCLC because the clonal
    history and treatment logic differ.
  distinguishing_features:
  - Establish the pretreatment driver, longitudinal molecular history, and whether BRAF V600E was present at baseline or appeared after EGFR-TKI exposure.
  evidence:
  - reference: PMID:39830741
    reference_title: "EGFR inhibitors plus dabrafenib and trametinib in patients with EGFR-mutant lung cancer and resistance mediated by BRAF(V600E) mutation: a multi-center real-world experience in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 14 patients who were treated with a triple therapy regimen
      of EGFR-TKI plus dabrafenib and trametinib due to newly acquired BRAFV600E
      mutation after EGFR-TKI resistance.
    explanation: The longitudinal cohort directly documents acquired V600E after EGFR-TKI resistance.

progression:
- phase: Tumor initiation with constrained early progression
  notes: >-
    BRAF V600E initiates lung epithelial proliferation, but experimental
    expression alone commonly produces benign lesions followed by a
    senescence-like arrest. Cooperation with tumor-suppressor or lineage-state
    alterations permits malignant progression.
  evidence:
  - reference: PMID:17299132
    reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced lung tumors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      BRaf(CA) mice infected with an Adenovirus expressing Cre recombinase
      developed benign lung tumors that only rarely progressed to
      adenocarcinoma.
    explanation: The lung-specific model establishes an initiated but progression-constrained phase.
- phase: Advanced and metastatic NSCLC
  notes: >-
    Molecularly selected treatment cohorts are dominated by stage-IV disease;
    brain metastases occur in a clinically relevant subset.
  evidence:
  - reference: PMID:39616778
    reference_title: "Real-world efficacy of the dabrafenib-trametinib (D-T) combination in BRAF V600E-mutated metastatic non-small cell lung cancer (NSCLC): Results from the IFCT-2004 BLaDE cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At D-T initiation, 80.8 % of patients had a PS of 0/1, 78.6 % had stage IV
      disease, and 20.9 % had brain metastasis.
    explanation: The BRAF V600E-selected cohort directly characterizes advanced and brain-metastatic disease.
- phase: Molecular response and acquired progression during targeted therapy
  notes: >-
    Plasma BRAF V600E can clear early during response, while molecular
    progression and new resistance alterations can precede radiologic or
    clinical progression.
  evidence:
  - reference: PMID:42284541
    reference_title: "Liquid Biopsy Monitoring in BRAF V600E-Mutated Patients With Non-Small Cell Lung Cancer Treated With Dabrafenib Plus Trametinib: The Prospective, Multicenter LiBRA Study (GOIRC-03-2020)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 21 shedders evaluated at t1, 17 (81%) cleared the mutation.
    explanation: Prospective serial sampling supports an early molecular-response phase.
  - reference: PMID:42284541
    reference_title: "Liquid Biopsy Monitoring in BRAF V600E-Mutated Patients With Non-Small Cell Lung Cancer Treated With Dabrafenib Plus Trametinib: The Prospective, Multicenter LiBRA Study (GOIRC-03-2020)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biological PD anticipated radiologic/clinical PD by a median of 4.9 weeks
      (IQR, 1.4-9.8).
    explanation: Molecular progression preceding conventional progression defines the later resistant phase.

treatments:
- name: Dabrafenib Plus Trametinib
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Combined BRAF and MEK inhibition has prospective phase-II and long-term
    follow-up evidence in previously untreated and previously treated metastatic
    BRAF V600E-mutant NSCLC. Pyrexia is a common toxicity, and treatment
    selection requires stage, comorbidity, prior-therapy, toxicity, and access
    context.
  target_mechanisms:
  - target: Somatic BRAF p.Val600Glu Driver
    treatment_effect: INHIBITS
    description: Dabrafenib inhibits the disease-defining mutant BRAF kinase.
    evidence:
    - reference: PMID:28919011
      reference_title: "Dabrafenib plus trametinib in patients with previously untreated BRAF(V600E)-mutant metastatic non-small-cell lung cancer: an open-label, phase 2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients received oral dabrafenib 150 mg twice per day plus oral
        trametinib 2 mg once per day
      explanation: The biomarker-selected trial directly tests the BRAF/MEK combination in this disease.
  - target: Sustained MEK-ERK Signaling
    treatment_effect: INHIBITS

name: Cornelia de Lange Syndrome 4
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Cornelia de Lange syndrome 4 (CdLS4) is the RAD21-related form of the
  cohesinopathy spectrum, and it is defined as much by what it is milder than as
  by what it is. RAD21 encodes the kleisin subunit that closes the cohesin ring
  between SMC1A and SMC3 and recruits STAG1/STAG2, so a RAD21 lesion sits inside
  the ring itself rather than in the machinery that loads it — which is where
  NIPBL, the gene behind classic CdLS, acts. The disease-causing variants
  cluster at the RAD21 interfaces with its partner subunits, impair the cellular
  DNA damage response, and disrupt transcription; the resulting phenotype is an
  attenuated CdLS, with the facial and limb features present but muted and, most
  strikingly, cognition and behaviour far less affected than in NIPBL- or
  SMC1A-related disease. Two further things separate it from classic CdLS in
  practice. Variants are frequently familial rather than de novo, with striking
  variability between and within families, so an affected parent may never have
  been recognised. And RAD21 is dose- and zygosity-split: two RAD21 alleles do
  not give a more severe CdLS but a different disease entirely, Mungan syndrome,
  an enteric neuromyopathy with chronic intestinal pseudo-obstruction.

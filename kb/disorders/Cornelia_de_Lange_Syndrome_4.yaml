diagnosis:
- name: Molecular diagnosis after CdLS clinical scoring
  description: >-
    Diagnosis rests on identifying a heterozygous RAD21 variant. Whether the
    international CdLS consensus score reliably selects these patients for
    testing is the one place the two main sources disagree, and the disagreement
    is curated rather than resolved. The dedicated 49-individual RAD21 series
    found that every patient with full clinical data scored at least five, which
    is above the threshold of four that indicates molecular testing, and states
    outright that no RAD21 variant would have been missed by the consensus
    criteria. The later systematic review nonetheless had to exclude patients
    from its own statistics for scoring under four. Both authors also note that
    the clinical diagnosis is harder here than in classic CdLS. The practical
    reading is that the score is adequate as a gate to testing on present
    evidence, but that recognising CdLS clinically is not, and the attenuated
    presentation means it will more often be reached through broad sequencing
    than through a CdLS-shaped clinical suspicion.
  evidence:
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      No RAD21 variant would have been missed using the CdLS consensus criteria
      for molecular studies
    explanation: >-
      The authors' explicit finding that the consensus criteria do not
      under-select RAD21 patients for testing. This is the statement that
      prevents this entry from asserting the opposite, which the systematic
      review's exclusion rule would otherwise have suggested.
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The clinical diagnosis of CdLS may, therefore, be difficult.
    explanation: >-
      The same authors on clinical recognition, which they distinguish from the
      performance of the scoring criteria once CdLS is being considered.
  - reference: PMID:39286962
    reference_title: "Clinical Characteristics, Genetic Analysis, and Literature Review of Cornelia de Lange Syndrome Type 4 Associated With a RAD21 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with a clinical feature score less than 4 are not diagnosed with

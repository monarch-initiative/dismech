    patients. The frequency is near-universal but the degree is the point: it is
    much milder than in NIPBL-, SMC1A- or SMC3-related CdLS, and one reported
    patient had uncompromised intelligence with above-average school
    performance.
  frequency: VERY_FREQUENT

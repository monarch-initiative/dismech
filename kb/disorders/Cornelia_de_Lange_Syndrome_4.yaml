    directness: DIRECT
    snippet: >-
      Clinical features included verbal developmental delay and intellectual
      disorder observed in 94% of patients.
    explanation: >-
      94% falls in the VERY_FREQUENT band (80-99%).
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The majority of RAD21 patients (16/29, 55%) have normal or mildly impaired
      cognitive functioning (SMC1A group 32%; NIPBL group 7%)
    explanation: >-

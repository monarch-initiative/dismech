  - reference: PMID:20301283
    reference_title: Cornelia de Lange Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Individuals with a milder phenotype have less severe growth, cognitive,
      and limb involvement, but often have facial features consistent with CdLS.
    explanation: >-
      GeneReviews' description of the mild end of the CdLS spectrum, which is
      the position CdLS4 occupies. It matches the RAD21 series independently:
      growth, cognition and limbs attenuated, facial gestalt retained.
  - reference: PMID:37377026
    reference_title: "Genomic analyses in Cornelia de Lange Syndrome and related diagnoses: Novel candidate genes, genotype-phenotype correlations and common mechanisms."

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    Management follows the international CdLS consensus and is not
    RAD21-specific: growth, feeding, hearing, vision, neurodevelopmental,
    behavioural, orthopaedic, cardiac and renal surveillance. No treatment study
    specific to CdLS4 exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Autosomal dominant with a 50% recurrence risk to offspring. Counselling in
    CdLS4 differs from classic CdLS in three ways that follow from the data:
    variants are frequently inherited rather than de novo, expression varies
    strikingly within as well as between families, and a mildly affected parent
    may be identified only through the child.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The current study should be helpful when counseling families with a RAD21
      variation.
    explanation: >-
      The authors frame their genotype-phenotype findings as counselling
      material.
differential_diagnoses:
- name: Classic NIPBL-Related Cornelia de Lange Syndrome
  description: >-
    The principal differential and the comparison that defines CdLS4. NIPBL acts
    as the cohesin loading factor and its disease is a dosage problem; RAD21 sits
    inside the ring. Clinically, NIPBL-related disease has more severe facial
    morphology, limb anomalies and, especially, cognitive and behavioural
    involvement, and is overwhelmingly de novo where RAD21 variants are often
    familial. dismech curates the umbrella as Cornelia de Lange syndrome.
  evidence:
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Their phenotype is an attenuated CdLS phenotype compared to that caused by
      variants in NIPBL or SMC1A for facial morphology, limb anomalies, and
      especially for cognition and behavior.
    explanation: >-
      The contrast that separates CdLS4 from the classic form.
- name: Mungan Syndrome
  description: >-
    The other RAD21 disease, and the reason the gene cannot be reduced to a
    single CdLS subtype line. Biallelic RAD21 variants cause an enteric
    neuromyopathy with chronic intestinal pseudo-obstruction, megaduodenum,
    long-segment Barrett oesophagus and cardiac abnormalities. Its mechanism runs
    through RAD21's transcriptional targets rather than through a general cohesin
    dosage effect: the mutant protein fails to bind the APOB promoter, RUNX1
    expression falls in patient cells, and rad21a-knockdown zebrafish show
    delayed intestinal transit with greatly reduced enteric neuron numbers.
    Mungan syndrome is not curated in dismech.
  evidence:
  - reference: PMID:25575569
    reference_title: "Mutations in RAD21 disrupt regulation of APOB in patients with chronic intestinal pseudo-obstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified a homozygous mutation (p.622, encodes Ala>Thr) in RAD21 in
      patients from a consanguineous family with CIPO.
    explanation: >-
      Establishes the biallelic RAD21 disease as a distinct entity from CdLS4.
  - reference: PMID:25575569
    reference_title: "Mutations in RAD21 disrupt regulation of APOB in patients with chronic intestinal pseudo-obstruction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      rad21a Morpholino zebrafish had delayed intestinal transit and greatly
      reduced numbers of enteric neurons, similar to patients with CIPO.
    explanation: >-
      The enteric phenotype that separates the biallelic disease mechanistically
      from CdLS4.
- name: Other Cohesinopathies
  description: >-
    dismech curates several gene-level cohesinopathies as standalone entries
    alongside the CdLS umbrella: Mullegama-Klein-Martinez syndrome (STAG2),
    WAPL-related developmental disorder, CHOPS syndrome (AFF4),
    CTCF-related neurodevelopmental disorder and Warsaw breakage syndrome. CdLS4
    is placed the same way.
discussions:
- discussion_id: cdls4_attenuation_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Attenuated Cornelia de Lange Phenotype
  prompt: >-
    Why does a lesion in the cohesin ring itself produce a milder phenotype than
    reduced dosage of the factor that loads it?
  rationale: >-
    The attenuation is the best-replicated fact about CdLS4 — reported in the
    entity-defining paper and confirmed in the largest series — and it is
    counterintuitive. A structural subunit of the ring might be expected to
    matter at least as much as its loader. Two partial explanations are on the
    record and neither has been tested: that the missense-worse-than-LOF gradient
    means RAD21 haploinsufficiency is comparatively well tolerated while missense
    protein interferes actively, and that cohesin composition rather than dosage
    determines developmental outcome. No study has measured chromatin-bound
    cohesin or transcriptional output side by side in NIPBL and RAD21 patient
    cells, which is what would separate them.

    The RAD21 series offers one concrete lead, which this entry records but does
    not assert as mechanism: Deardorff found that RAD21 haploinsufficiency
    approximately halves RAD21 RNA in a patient cell line, whereas NIPBL
    haploinsufficiency is often accompanied by compensatory upregulation from
    the intact allele. RAD21 therefore appears simply more tolerant of reduced
    dosage than NIPBL is, despite having no compensatory mechanism -- which
    inverts the usual expectation and is the opposite of what a compensation
    argument would predict.
- discussion_id: cdls4_zygosity_split
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#RAD21
  prompt: >-
    Why do two RAD21 alleles give an enteric neuromyopathy rather than a more
    severe Cornelia de Lange syndrome?
  rationale: >-
    Dose-response is the usual expectation, and RAD21 does not follow it.
    Heterozygous variants give attenuated CdLS; biallelic variants give Mungan
    syndrome, whose reported mechanism runs through specific transcriptional
    targets — failure to bind the APOB promoter, reduced RUNX1 — and whose
    zebrafish phenotype is a deficit of enteric neurons. Whether the two
    presentations reflect different residual cohesin function, different
    tissue-specific target sets, or an allele-specific effect of the particular
    biallelic variant reported has not been addressed. No published work compares
    heterozygous and homozygous RAD21 patient material directly.
- discussion_id: cdls4_no_model_of_attenuation
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Zebrafish
  prompt: >-
    Does any model reproduce the attenuation that defines CdLS4?
  rationale: >-
    The one in vivo model reported for CdLS4 is the zebrafish transcription assay
    from the defining paper, which tests whether patient variants disrupt
    transcription and nothing else. There is no mouse, no knock-in at the
    endogenous locus, and no model in which the RAD21 phenotype has been compared
    with a Nipbl model under the same conditions. The defining clinical claim of
    this entity — milder than NIPBL disease, especially for cognition — therefore
    has no experimental counterpart at all, and the mechanism discussion above
    cannot be resolved without one.
notes: >-
  Entry type. Curated as a standalone Disease. The umbrella,
  kb/disorders/Cornelia_de_Lange_Syndrome.yaml, does bind RAD21 properly — the
  gene term hgnc:9811 appears both on its "Cohesin pathway gene disruption"
  pathophysiology node and on its own genetic record with the ClinGen Definitive
  assertion — so this is not the cblA situation of a gene named only in prose.
  Three things nonetheless argued for a separate entry rather than a subtype
  record.

  First, the umbrella has no has_subtypes block at all, so folding CdLS4 in would
  mean creating a subtype axis from scratch rather than filling an existing slot.
  Second, and more substantively, the umbrella's pathograph is a single generic
  node listing six cohesin genes together; it has no place to record that RAD21
  is inside the ring while NIPBL loads it, that missense alleles are worse than
  loss of function, or that the resulting phenotype is attenuated — and the
  attenuation is the whole content of this entity. Third, RAD21 carries a
  zygosity split: biallelic variants give Mungan syndrome, a different disease
  that is not a severe CdLS, and a one-paragraph subtype line has nowhere to put
  that. dismech already keeps gene-level cohesinopathies standalone —
  Mullegama-Klein-Martinez syndrome (STAG2), WAPL-related developmental disorder,
  CHOPS syndrome, CTCF-related neurodevelopmental disorder, Warsaw breakage
  syndrome — and this follows that pattern. The umbrella was not modified.

  The ClinGen assertion is cited for what it says and no more. CGGV
  assertion_30ad5023 is keyed to MONDO:0016033, the CdLS umbrella term, and
  contains no statement about the RAD21 phenotype. It is cited twice, for
  inheritance and for gene-disease validity, and both explanations say
  explicitly that it does not support the attenuation claim. The attenuation
  rests on PMID:22633399 and PMID:32193685.

  A claim this entry does not make. An earlier draft asserted that the CdLS
  consensus clinical score under-detects CdLS4, reasoning from the systematic
  review's exclusion of patients scoring under four. The dedicated RAD21 series
  says the opposite in as many words -- every cohort A patient scored at least
  five and no RAD21 variant would have been missed by the consensus criteria --
  so the claim was removed rather than kept as a plausible-sounding inference.
  What both sources do support is that clinical recognition of CdLS is harder in
  this group, and that is what the diagnosis node now says.

  Named entity confusion. preflight-dr returns PASS with RAD21 mentioned 73
  times and the next gene, NIPBL, at 8 — but that reflects the report, not the
  literature, and RAD21 has a large off-target body that was excluded by hand:

  1. Somatic RAD21 in cancer. RAD21 is a recurrent somatic mutation in AML and
  MDS and is amplified in solid tumours. None of that literature is cited. The
  one review used here, PMID:32687945, spans both the developmental and the
  cancer roles; only its statements about RAD21's normal function are quoted,
  and both are graded INDIRECT because they are protein biology rather than
  CdLS4 results.

  2. RAD21L, the meiotic paralog, is a different gene and nothing about it is
  used.

  3. The 8q23-q24 contiguous-gene deletions spanning RAD21 and EXT1 overlap
  Langer-Giedion syndrome. Those are not monogenic RAD21 disease and none of
  their phenotypes were imported.

  4. Mungan syndrome is RAD21 but is not this disease. It is curated only as a
  differential and in the genetic notes, with its own evidence, and none of its
  features appear in the phenotypes block.

  Facial features are one phenotype, not five. Long philtrum, thick eyebrows,
  long eyelashes, depressed nasal bridge and thin upper vermilion all fall in the
  same VERY_FREQUENT band from the same sentence of the same cohort. They are
  curated as a single "Characteristic Facial Morphology" record bound to the
  long philtrum term, with the full list and every individual frequency in the
  description and the quoted snippet, rather than as five records that would
  quote one sentence five times.

  MONDO placement worth reporting upstream. MONDO:0013864 has two parents:
  Cornelia de Lange syndrome, which is right, and non-syndromic limb reduction
  defect, which is not — CdLS4 is a syndromic multiple-anomaly condition and its
  limb involvement is mild brachydactyly rather than a reduction defect. Recorded
  here rather than propagated into the entry, in the same way #10260 recorded the
  cblA/cblB synonym bug. Not fixed here.

  Tooling. `just clingen-refresh` exits non-zero on a drifted sha256 against the
  pinned snapshot but downloads gene_validity.csv before failing, which is enough
  to confirm that RAD21 carries exactly one ClinGen assertion and that it is the
  umbrella-keyed one already committed to references_cache. The manifest was not
  repinned and no new ClinGen cache file was generated.

  Not curated. No progression block: no natural history study of CdLS4 exists,
  and the age-at-diagnosis distribution in the systematic review describes
  ascertainment rather than disease course. No biochemical or imaging block. No
  datasets block. Growth hormone response is tabulated in PMID:39286962 for the
  reviewed patients, but the cached text reports it as a summary column rather
  than as an analysed outcome, so no treatment claim is made from it. A
  Cohesinopathies grouping does not exist in kb/groupings/ and would be the
  natural home for this entry alongside the other five cohesinopathy entries;
  that is a separate piece of work.

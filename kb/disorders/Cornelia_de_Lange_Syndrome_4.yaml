inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous RAD21 variants, transmitted dominantly. Unlike classic
    NIPBL-related CdLS, which is overwhelmingly de novo, RAD21 variants are
    frequently inherited: 12 of 28 patients with a known transmission pattern in
    a systematic review carried a germline variant from a parent. That, together
    with the attenuated phenotype, means an affected parent may be recognised
    only after the child is diagnosed.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_30ad5023-6c68-42ab-b8ea-a601a134eaf6-2020-01-08T170000.000Z
    reference_title: "RAD21 / Cornelia de Lange syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "RAD21 | HGNC:9811 | Cornelia de Lange syndrome | MONDO:0016033 | AD | Definitive"
    explanation: >-
      ClinGen classifies the RAD21-CdLS gene-disease relationship as definitive
      with autosomal dominant inheritance. Note this assertion is keyed to the
      CdLS umbrella term MONDO:0016033 and makes no statement about the
      attenuated RAD21 phenotype; it is cited here only for inheritance and
      gene-disease validity.
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Variants were frequently familial, and genotype-phenotype analyses
      demonstrated striking interfamilial and intrafamilial variability.
    explanation: >-
      Establishes that RAD21 variants are often inherited rather than de novo,
      which is the counselling difference from classic CdLS.
pathophysiology:
- name: Heterozygous RAD21 Variant
  biological_scale: MOLECULAR
  description: >-
    A single altered RAD21 allele. The variant spectrum is dominated by
    frameshift alleles (36% of 36 published patients), followed by missense
    (19%) and nonsense (17%), with whole-gene and intragenic microdeletions also
    reported. Where variants have been mapped to protein domains, most fall in
    the RAD21-SMC1A interaction domain. The allelic gradient runs the opposite
    way to intuition for a structural subunit: dominant missense alleles cause
    worse structural and cognitive findings than loss-of-function alleles do,
    which argues that the missense protein interferes with the ring rather than
    simply failing to join it.
  genetic_context:
    gene:
      preferred_term: RAD21
      term:
        id: hgnc:9811
        label: RAD21
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:22633399
    reference_title: RAD21 mutations cause a human cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our data suggest that, compared to loss-of-function mutations, dominant
      missense mutations result in more severe functional defects and cause
      worse structural and cognitive clinical findings.
    explanation: >-
      The allelic gradient this node describes, in the paper that established
      RAD21 as a CdLS gene.
  - reference: PMID:39286962
    reference_title: "Clinical Characteristics, Genetic Analysis, and Literature Review of Cornelia de Lange Syndrome Type 4 Associated With a RAD21 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Frameshift variants constituted the predominant variant type, representing
      36% (13/36) of cases.
    explanation: >-
      Quantifies the variant spectrum across all published CdLS4 patients.
  downstream:
  - target: Disruption of the Cohesin Ring at the RAD21 Subunit Interfaces
    causal_link_type: DIRECT
    description: >-
      RAD21 is the subunit that bridges SMC1A, SMC3 and STAG, so a lesion in it
      acts on those interfaces.
- name: Disruption of the Cohesin Ring at the RAD21 Subunit Interfaces
  biological_scale: MOLECULAR
  description: >-
    RAD21 is the kleisin that closes the tripartite cohesin ring: its N-terminus
    engages SMC3, its C-terminus engages SMC1, and its central STAG domain
    recruits STAG1 or STAG2. CdLS4 variants act at those interfaces. This is the
    step that distinguishes CdLS4 from classic CdLS at the level of mechanism —
    NIPBL is the cohesin loading factor and NIPBL-related disease is a dosage
    problem in getting cohesin onto chromatin, whereas CdLS4 is a lesion in the
    ring itself.
  cellular_components:
  - preferred_term: cohesin complex
    term:
      id: GO:0008278
      label: cohesin complex
  evidence:
  - reference: PMID:22633399
    reference_title: RAD21 mutations cause a human cohesinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Mechanistically, these mutations act at the RAD21 interface with the other
      cohesin proteins STAG2 and SMC1A
    explanation: >-
      Localizes the lesion to the RAD21 subunit interfaces. Only the interface
      clause of the source sentence is quoted here; the sentence's other two
      claims are quoted separately on the nodes they belong to, because the
      transcription result is a zebrafish experiment and the DNA damage result
      is a cell-based one.
  - reference: PMID:39286962
    reference_title: "Clinical Characteristics, Genetic Analysis, and Literature Review of Cornelia de Lange Syndrome Type 4 Associated With a RAD21 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Among the patients, 41.9% (13 out of 31) had variants situated in the
      RAD21-SMC1A domain
    explanation: >-
      Shows that the variants patients actually carry concentrate in one of the
      subunit interaction domains.
  downstream:
  - target: Cohesin-Dependent Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      The developmental phenotype of the cohesinopathies is attributed primarily
      to cohesin's interphase role in transcription and genome organization.
  - target: Impaired DNA Damage Response
    causal_link_type: DIRECT
    description: >-
      Patient RAD21 variants impair the cellular response to DNA damage.
- name: Cohesin-Dependent Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    Beyond holding sister chromatids together, cohesin organizes the genome in
    interphase and regulates transcription, and it is this arm rather than
    mitotic cohesion failure that is held responsible for the developmental
    phenotype. Disrupted transcription was demonstrated directly for CdLS4
    variants in a zebrafish model.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: DYSREGULATED
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:22633399
    reference_title: RAD21 mutations cause a human cohesinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      and disrupt transcription in a zebrafish model
    explanation: >-
      The transcriptional consequence, demonstrated in zebrafish expressing the
      patient variants. Quoted as the zebrafish clause alone so this item and the
      cell-based items from the same sentence each carry one evidence_source.
  - reference: PMID:32687945
    reference_title: "Cohesin subunit RAD21: From biology to disease."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      In interphase, cohesin also functions in the control of gene expression by
      binding to numerous sites within the genome.
    explanation: >-
      Establishes the interphase transcriptional role this node depends on.
      Graded INDIRECT because it states cohesin biology generally rather than a
      CdLS4 result.
  downstream:
  - target: Attenuated Cornelia de Lange Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How transcriptional dysregulation produces the specific pattern of facial,
      limb, growth and cognitive features is not established for any
      cohesinopathy, let alone for RAD21 specifically.
- name: Impaired DNA Damage Response
  biological_scale: CELLULAR
  description: >-
    RAD21 is also a double-strand-break repair protein, and CdLS4 variants
    impair the cellular DNA damage response. This arm is well demonstrated
    biochemically but is not connected to any specific clinical feature of
    CdLS4, so it is curated as a consequence of the ring lesion without a
    downstream edge into the phenotype.
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: DECREASED
  evidence:
  - reference: PMID:22633399
    reference_title: RAD21 mutations cause a human cohesinopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      impair cellular DNA damage response
    explanation: >-
      The DNA damage response defect measured in cells carrying patient
      variants.
  - reference: PMID:32687945
    reference_title: "Cohesin subunit RAD21: From biology to disease."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      RAD21 (also known as KIAA0078, NXP1, HR21, Mcd1, Scc1, and hereafter
      called RAD21), an essential gene, encodes a DNA double-strand break (DSB)
      repair protein that is evolutionarily conserved in all eukaryotes from
      budding yeast to humans.
    explanation: >-
      Establishes the repair function whose impairment this node describes.
      Graded INDIRECT because it states the protein's role rather than a CdLS4
      measurement.
- name: Attenuated Cornelia de Lange Phenotype
  biological_scale: ORGANISM
  description: >-
    The clinical result is recognisably CdLS but muted. Compared with NIPBL- and
    SMC1A-related disease the facial morphology and limb anomalies are milder,
    and cognition and behaviour are considerably less affected — 14 of 26 scored
    patients were mild and only one severe on the CdLS severity score. Because
    the consensus clinical score is built around the classic phenotype, CdLS4
    patients score low on it, which is a diagnostic problem rather than a
    cosmetic difference.
  evidence:
  - reference: PMID:22633399
    reference_title: RAD21 mutations cause a human cohesinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Notably, unlike children with mutations in NIPBL, SMC1A, or SMC3, these
      individuals have much milder cognitive impairment than those with
      classical CdLS.
    explanation: >-
      The attenuation claim, in the paper that established the entity.
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Their phenotype is an attenuated CdLS phenotype compared to that caused by
      variants in NIPBL or SMC1A for facial morphology, limb anomalies, and
      especially for cognition and behavior.
    explanation: >-
      Independent confirmation of attenuation in the largest RAD21 series, and
      the source that specifies which domains are attenuated.
  - reference: PMID:39286962
    reference_title: "Clinical Characteristics, Genetic Analysis, and Literature Review of Cornelia de Lange Syndrome Type 4 Associated With a RAD21 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      it was found that among the 26 patients meeting the criteria, only 1 was
      classified as severe, 11 reached moderate levels, and 14 were considered
      mild
    explanation: >-
      Quantifies the severity distribution using the CdLS scoring system.
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Major limb malformation HP:0001180/HP:0009776 0/29 0 0/49 0 17/67 25
    explanation: >-
      The starkest single contrast in the comparison table: no major limb
      malformation in any of 29 RAD21 patients, against 25% of NIPBL patients.
      Limb reduction is one of the cardinal features of classic CdLS and it is
      absent here.
  downstream:
  - target: phenotypes#Intellectual Disability
    causal_link_type: DIRECT
    description: The cognitive component, attenuated relative to classic CdLS.
  - target: phenotypes#Delayed Speech and Language Development
    causal_link_type: DIRECT
    description: Verbal developmental delay, near-universal in reported patients.
  - target: phenotypes#Characteristic Facial Morphology
    causal_link_type: DIRECT
    description: >-
      The CdLS facial gestalt, present but muted.
  - target: phenotypes#Short Stature
    causal_link_type: DIRECT
    description: Growth restriction.
  - target: phenotypes#Short 5th Finger
    causal_link_type: DIRECT
    description: >-
      The limb component; reduction defects are milder than in classic CdLS.
  - target: phenotypes#Hearing Impairment
    causal_link_type: DIRECT
    description: Hearing loss in a third of reported patients.

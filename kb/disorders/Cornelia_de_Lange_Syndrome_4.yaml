prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence exists for CdLS4 specifically. Two overlapping
    published case counts bound it: 36 patients with confirmed RAD21 variants
    reported worldwide between May 2012 and March 2024, and 49 individuals from
    33 families in a dedicated RAD21 series that included 24 previously
    unpublished cases. CdLS overall has a reported prevalence of 1:30,000 to
    1:10,000 live births, and RAD21 accounts for a small minority of it; that
    umbrella figure is deliberately not converted into a rate for this entry,
    because the RAD21 share is a diagnostic-cohort proportion rather than a
    population one. Such a proportion does exist: a 716-proband cohort solved
    422 molecularly, of which six (about 1%) were RAD21. That figure sits in the
    full text of PMID:37377026 and not in its cached abstract, so it is recorded
    here rather than quoted as evidence; it also measures ascertainment through
    a CdLS-shaped clinical suspicion, which an attenuated phenotype passes less
    often.
  evidence:
  - reference: PMID:39286962
    reference_title: "Clinical Characteristics, Genetic Analysis, and Literature Review of Cornelia de Lange Syndrome Type 4 Associated With a RAD21 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We reviewed 36 patients with CdLS related to RAD21 gene variants reported
      worldwide from May 2012 to March 2024.
    explanation: >-
      The published case count on which the CASES_IN_LITERATURE measure rests.
  - reference: PMID:32193685
    reference_title: "Delineation of phenotypes and genotypes related to cohesin structural protein RAD21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We gathered a series of 49 individuals from 33 families with RAD21
      alterations
    explanation: >-
      The largest single RAD21 series, overlapping the 36-patient literature
      count rather than adding to it.
genetic:
- name: RAD21
  gene_term:
    preferred_term: RAD21
    term:
      id: hgnc:9811
      label: RAD21
  relationship_type: CAUSATIVE
  association: Heterozygous Pathogenic Variants
  notes: >-
    RAD21 is the only gene that causes CdLS4. The dosage axis matters clinically
    and is the reason this gene needs an entry rather than a subtype line:
    heterozygous variants give attenuated CdLS, whereas biallelic variants give
    Mungan syndrome, an enteric neuromyopathy with chronic intestinal
    pseudo-obstruction, which is not a severe CdLS and is not curated in dismech.
    Variants concentrate in exon 14 (30.6% of published cases) and in the
    RAD21-SMC1A interaction domain. Twelve of 28 patients with a known
    transmission pattern inherited the variant; sixteen were de novo.

genetic:
- name: ATP2A2
  notes: >-
    ATP2A2 encodes SERCA2, the sarco/endoplasmic reticulum calcium ATPase
    isoform 2. Familial AKV is associated with one recurrent heterozygous
    missense variant, p.(Pro602Leu), in the ATP-binding domain, and a second
    missense variant, p.(Ala698Val), has also been described in AKV; neither
    had been reported among Darier disease variants at the time. Some AKV
    families, notably in China, carry no ATP2A2 variant and show no linkage to
    12q23-q24, so AKV is genetically heterogeneous and the other gene or genes
    are unknown.
  gene_term:
    preferred_term: ATP2A2
    term:
      id: hgnc:812
      label: ATP2A2
  relationship_type: CAUSATIVE
  variants:
  - name: p.(Pro602Leu)
    description: >-
      Recurrent heterozygous missense variant (P602L) in exon 14, in the
      ATP-binding domain of SERCA2, segregating with AKV in several unrelated
      families; the expressed mutant has no calcium transport activity.
    evidence:
    - reference: PMID:28498512
      reference_title: "Recurrent ATP2A2 p.(Pro602Leu) mutation differentiates Acrokeratosis verruciformis of Hopf from the allelic condition Darier disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a family with AKV due to the p.(Pro602Leu) mutation and discuss implications for this recurrent mutation on knowledge of ATP2A2 structure and function."
      explanation: >-
        Reports the recurrent variant in a further family.
    - reference: PMID:12542527
      reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation segregates with the disease phenotype in the family and was not found in 50 controls."
      explanation: >-
        Co-segregation and absence from controls support pathogenicity.
  - name: p.(Ala698Val)
    description: >-
      Heterozygous missense variant (A698V) previously described in AKV.
    evidence:
    - reference: PMID:22814319
      reference_title: "Acrokeratosis verruciformis of Hopf showing P602L mutation in ATP2A2 and overlapping histopathological features with Darier disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation and a heterozygous A698V were previously described in AKV."
      explanation: >-
        Records A698V as a second AKV-associated ATP2A2 variant.
  evidence:
  - reference: PMID:12542527
    reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we studied a family affected with acrokeratosis verruciformis in six generations and identified a heterozygous P602L mutation in ATP2A2"
    explanation: >-
      Establishes ATP2A2 as the causal gene in familial AKV.
  - reference: PMID:22814319
    reference_title: "Acrokeratosis verruciformis of Hopf showing P602L mutation in ATP2A2 and overlapping histopathological features with Darier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations were not among the 162 mutations in ATP2A2, which were reported to date in DD."
    explanation: >-
      Supports the separation of the AKV variants from the Darier variant
      spectrum.
  - reference: PMID:16716163
    reference_title: "Genetic heterogeneity in acrokeratosis verruciformis of Hopf."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analysis showed no mutation in ATP2A2 among the AKV patients"
    explanation: >-
      In two Chinese AKV families and a sporadic case no ATP2A2 variant was
      found, so ATP2A2 does not account for every AKV family.
  - reference: PMID:16716163
    reference_title: "Genetic heterogeneity in acrokeratosis verruciformis of Hopf."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The genotyping and linkage analysis results revealed no linkage evidence of the locus at 12q23-12q24 in a large AKV family."
    explanation: >-
      Absence of linkage to the ATP2A2 locus in a large family supports a
      second AKV locus.

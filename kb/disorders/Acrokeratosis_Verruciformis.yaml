- name: Focal Suprabasal Acantholysis with Mild Dyskeratosis
  biological_scale: TISSUE
  description: >-
    Small suprabasal clefts with acantholytic, sometimes mildly dyskeratotic
    keratinocytes have been found in some genotyped AKV lesions on step
    sectioning, and Darier-like cytology including corps ronds and grains in
    another case. When present, acantholysis and dyskeratosis are minimal.
    Their absence has long been used to separate AKV from Darier disease, so
    this node records an inconstant finding that bears on that question rather
    than a defining feature.

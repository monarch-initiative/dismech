notes: >-
  No GeneReviews chapter covers acrokeratosis verruciformis; the phenotype
  baseline is the 2026 review PMID:42205461. Acral verruciform papules that
  occur as part of Darier disease belong to the Darier_Disease entry; this entry
  covers isolated AKV. No mechanism module is conformed to: the desmosomal
  adhesion-failure module that Darier disease conforms to requires
  acantholysis, which classic AKV lacks, and the cornification-failure module
  describes barrier failure in the ichthyoses rather than a circumscribed
  verrucous hyperplasia.

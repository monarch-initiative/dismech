      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "rare reports of malignant transformation, typically squamous cell carcinoma, arising in longstanding lesions have been documented"
      explanation: >-
        Places the carcinomas within longstanding lesions.

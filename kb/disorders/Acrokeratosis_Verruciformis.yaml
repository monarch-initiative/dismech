phenotypes:
- category: Dermatologic
  name: Acral Verrucous Papules
  diagnostic: true
  description: >-
    Multiple small, flat-topped, skin-coloured or slightly pigmented papules
    with a verrucous surface, resembling plane warts, on the dorsa of the hands,
    fingers and feet, sometimes extending to forearms, legs, knees and elbows.
    They appear in childhood or adolescence, occasionally at birth, and persist
    indefinitely. Seborrheic areas are usually spared, unlike Darier disease.
  phenotype_term:
    preferred_term: Acrokeratosis
    term:
      id: HP:0200016
      label: Acrokeratosis
    onset:
      onset_category: CHILDHOOD
      notes: >-
        Usually childhood or adolescence, sometimes at birth in familial cases;
        sporadic cases may begin as late as the sixth decade.
  sequelae:
  - target: Squamous Cell Carcinoma in Longstanding Lesions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Squamous cell carcinoma has been reported arising in longstanding AKV
      papules.
    evidence:

discussions:
- discussion_id: akv_distinct_entity_or_acral_darier
  prompt: >-
    Is acrokeratosis verruciformis a distinct disease, or a limited acral
    expression of Darier disease?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#Acrokeratosis Verruciformis
  - pathophysiology#Focal Suprabasal Acantholysis with Mild Dyskeratosis
  rationale: >-
    For a distinct entity: a distinct clinical picture confined to acral skin
    and sparing seborrheic areas, a recurrent variant (p.Pro602Leu) not seen in
    Darier disease, histology without acantholysis or dyskeratosis, separate
    MONDO and OMIM records, and AKV families with no ATP2A2 variant. For acral
    Darier disease: AKV-like papules are found in most adults with Darier
    disease, the two coexist in some patients, acral papules in Darier patients
    can show Darier histology, and step sections or cytology of genotyped AKV
    lesions can show focal acantholysis and dyskeratosis. This entry is
    curated as a separate disease allelic with Darier disease, following MONDO
    and the genotype data, and records the overlap here.
  evidence:
  - reference: PMID:28498512
    reference_title: "Recurrent ATP2A2 p.(Pro602Leu) mutation differentiates Acrokeratosis verruciformis of Hopf from the allelic condition Darier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Darier disease and Acrokeratosis Verruciformis of Hopf (AKV) are rare disorders of keratinization with autosomal dominant inheritance and very distinct clinical pictures."
    explanation: >-
      Position that the two are allelic but clinically distinct.
  - reference: PMID:22814319
    reference_title: "Acrokeratosis verruciformis of Hopf showing P602L mutation in ATP2A2 and overlapping histopathological features with Darier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These shared histopathological features of AKV with DD suggest that AKV and DD are allelic disorders with variable expression of the same disease, although identical mutations in ATP2A2 in AKV and DD were not reported to date."
    explanation: >-
      Position that AKV is variable expression of the same disease.
  - reference: PMID:1390140
    reference_title: "The phenotype of Darier's disease: penetrance and expressivity in adults and children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic nail lesions were found in 59 (99%), palmar pits and keratoses in 57 (95%), and acrokeratosis verruciformis in 44 (73%)."
    explanation: >-
      Acrokeratosis verruciformis-like papules occurred in 73% of adults with
      Darier disease in a population series.
  - reference: PMID:9378638
    reference_title: "[Acrokeratosis verruciformis-like changes in Darier disease]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathologically, the papules showed the distinctive structures of Darier's disease. Therefore, these lesions are regarded as an abortive form of keratosis follicularis."
    explanation: >-
      Acral verruciform papules in Darier patients showed Darier histology.
  - reference: PMID:15515213
    reference_title: "Coexistence of Darier's disease and acrokeratosis verruciformis of Hopf."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biopsy taken from the neck showed typical findings for Darier's disease. The biopsy from the dorsa of the left foot revealed the distinctive structures of acrokeratosis verruciformis."
    explanation: >-
      One patient with both histological patterns at different sites.
  - reference: PMID:28426487
    reference_title: "Brief Report: HPV-17 Infection in Darier Disease With Acrokeratosis Verrucosis of Hopf."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although, it has been shown that both diseases are associated with mutations in ATPA2 gene, it is yet to be determined if they are the same disease, or separate but allelic, or interlinked in some other fashion."
    explanation: >-
      States the three positions; ATPA2 is the source's own spelling.
- discussion_id: akv_genotype_phenotype_and_second_locus
  prompt: >-
    Why does ATP2A2 p.(Pro602Leu) produce an acral keratinization disorder
    largely without acantholysis, when other loss-of-function ATP2A2 variants
    produce Darier disease, and which gene causes AKV in families without an
    ATP2A2 variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ATP2A2 Pro602Leu Loss of SERCA2 Calcium Transport
  - pathophysiology#Disturbed Endoplasmic Reticulum Calcium Homeostasis in Acral Keratinocytes
  - genetic#ATP2A2
  rationale: >-
    The P602L pump has lost calcium transport in vitro, the same functional
    class as Darier alleles, so loss of transport alone does not explain the
    different phenotype. No study has examined calcium handling or desmosome
    assembly in AKV keratinocytes, and the second AKV locus excluded by linkage
    in Chinese families has not been identified.
  evidence:
  - reference: PMID:16716163
    reference_title: "Genetic heterogeneity in acrokeratosis verruciformis of Hopf."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings provide evidence for the genetic heterogeneity of AKV and demonstrate that mutations in genes other than ATP2A2 are responsible for AKV in a proportion of the Chinese population."
    explanation: >-
      Establishes that an unidentified second locus exists.

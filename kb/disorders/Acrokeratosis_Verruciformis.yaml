name: Acrokeratosis Verruciformis
creation_date: "2026-10-15T23:02:32Z"
description: >-
  Acrokeratosis verruciformis of Hopf (AKV) is a rare autosomal dominant
  genodermatosis of keratinization in which flat, skin-coloured, wart-like
  keratotic papules develop on the dorsa of the hands and feet, usually from
  early childhood, and persist without spontaneous regression. Familial AKV is
  caused by a recurrent heterozygous ATP2A2 missense variant, p.(Pro602Leu), in
  the ATP-binding domain of SERCA2, the sarco/endoplasmic reticulum calcium
  pump that is also mutated in Darier disease; the mutant pump has lost calcium
  transport activity. AKV is therefore allelic with Darier disease, but the
  two differ in phenotype: AKV spares the seborrheic areas, and its histology is
  a well-circumscribed verrucous epidermal hyperplasia with orthokeratotic
  hyperkeratosis, hypergranulosis, acanthosis and church-spire papillomatosis,
  without the suprabasal acantholysis and dyskeratosis that define Darier
  disease. Whether AKV is a distinct entity or a limited acral expression of
  Darier disease remains debated: AKV-like acral papules are common in Darier
  patients, the two conditions coexist in some individuals, and focal
  acantholysis has been found on step sectioning of AKV lesions, whereas some
  AKV families show no ATP2A2 variant and no linkage to its locus. The course is
  chronic and benign, with rare squamous cell carcinoma in longstanding lesions,
  and treatment is cosmetic and of modest benefit.
category: Mendelian

pathophysiology:
- name: ATP2A2 Pro602Leu Loss of SERCA2 Calcium Transport
  biological_scale: MOLECULAR
  description: >-
    The recurrent heterozygous ATP2A2 missense variant p.(Pro602Leu) replaces a
    proline in the ATP-binding domain of SERCA2. Expressed in vitro, the mutant
    pump has lost its ability to transport calcium into the sarco/endoplasmic
    reticulum. This is the same gene and the same functional class of lesion as
    in Darier disease, which is the basis for regarding the two as allelic.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: P-type calcium transporter activity
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: ATP2A2
      term:
        id: hgnc:812
        label: ATP2A2
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous p.(Pro602Leu) missense variant; the mutant protein shows no
      calcium transport in a functional assay.
  downstream:
  - target: Disturbed Endoplasmic Reticulum Calcium Homeostasis in Acral Keratinocytes
    description: >-
      Loss of pump activity from one allele reduces calcium uptake into the
      keratinocyte endoplasmic reticulum.
  evidence:
  - reference: PMID:12542527
    reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we studied a family affected with acrokeratosis verruciformis in six generations and identified a heterozygous P602L mutation in ATP2A2"
    explanation: >-
      Identifies the heterozygous P602L variant as the familial lesion.
  - reference: PMID:12542527
    reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, functional analysis of the P602L mutant showed that it has lost its ability to transport Ca2+."
    explanation: >-
      Functional assay of the expressed mutant pump showing loss of calcium
      transport, the molecular claim of this node.
  - reference: PMID:12542527
    reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation predicts a nonconservative amino acid substitution in the ATP binding domain of the molecule."
    explanation: >-
      Places the substitution in the ATP-binding domain of SERCA2.
  - reference: PMID:28498512
    reference_title: "Recurrent ATP2A2 p.(Pro602Leu) mutation differentiates Acrokeratosis verruciformis of Hopf from the allelic condition Darier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While hundreds of different missense and nonsense mutations cause Darier disease, only one missense mutation, p.(Pro602Leu), has been identified in families with AKV."
    explanation: >-
      An independent family confirms p.(Pro602Leu) as the recurrent AKV
      variant, contrasted with the broad Darier variant spectrum.
  - reference: PMID:22814319
    reference_title: "Acrokeratosis verruciformis of Hopf showing P602L mutation in ATP2A2 and overlapping histopathological features with Darier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous P602L mutation in ATP2A2 was identified as the underlying cause in this family."
    explanation: >-
      A third, 14-member family carries the same heterozygous variant.
- name: Disturbed Endoplasmic Reticulum Calcium Homeostasis in Acral Keratinocytes
  biological_scale: CELLULAR
  description: >-
    SERCA2 sequesters cytosolic calcium into the endoplasmic reticulum of
    keratinocytes, and this store supports keratinocyte differentiation and,
    indirectly, intercellular adhesion. Loss of pump activity is inferred to
    disturb that store in the affected acral epidermis. No study has measured
    keratinocyte calcium handling in AKV directly, and why the lesion is
    confined to acral skin, and why it largely spares adhesion here when it
    does not in Darier disease, is unexplained.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Abnormal Keratinocyte Differentiation with Verrucous Epidermal Hyperplasia
    description: >-
      The disturbed calcium store deranges terminal keratinocyte
      differentiation, the defining process in AKV.
  - target: Focal Suprabasal Acantholysis with Mild Dyskeratosis
    description: >-
      In some lesions the same disturbance also reaches keratinocyte adhesion,
      producing small foci of the Darier-type change; this arm is inconstant.
  evidence:
  - reference: PMID:42205461
    reference_title: "Acrokeratosis verruciformis of Hopf: Genetic, clinicopathologic and therapeutic features (Review)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "it encodes the calcium pump SERCA2, which is present in the membrane of the endo-sarcoplasmic reticulum and plays a key role in calcium transport, and indirectly in the intercellular adhesion of keratinocytes."
    explanation: >-
      States the endoplasmic reticulum calcium-transport role of SERCA2 in
      keratinocytes. The step from the AKV variant to a disturbed store is an
      inference from pump function, not a measurement in AKV keratinocytes.
  - reference: PMID:12542527
    reference_title: "Acrokeratosis verruciformis of Hopf is caused by mutation in ATP2A2: evidence that it is allelic to Darier's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "This result demonstrates loss of function of the sarco(endo)plasmic reticulum Ca2+ ATPase2 mutant in acrokeratosis verruciformis"
    explanation: >-
      Demonstrates loss of the reticulum calcium pump function in AKV, from
      which the disturbed store follows by inference.

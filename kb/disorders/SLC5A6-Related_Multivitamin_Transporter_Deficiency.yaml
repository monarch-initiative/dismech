- name: Impaired Intestinal Biotin and Pantothenate Absorption
  biological_scale: TISSUE
  description: >-
    SMVT is the only carrier-mediated route for biotin absorption in the
    intestine, so loss of its function limits dietary uptake of biotin and
    pantothenate. Intestine-specific Slc5a6 knockout mice lose carrier-mediated
    biotin uptake, become biotin deficient, fail to grow and develop small
    bowel and cecal inflammation and dysplasia, all prevented by high-dose
    biotin and pantothenic acid.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  biological_processes:
  - preferred_term: intestinal absorption
    modifier: DECREASED
    term:
      id: GO:0050892
      label: intestinal absorption
  evidence:
  - reference: PMID:23104561
    reference_title: "Conditional knockout of the Slc5a6 gene in mouse intestine impairs biotin absorption."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies provide the first in vivo confirmation in native intestine that SMVT is solely responsible for intestinal biotin uptake."
    explanation: Establishes that loss of intestinal SMVT abolishes carrier-mediated biotin absorption.
  - reference: PMID:23104561
    reference_title: "Conditional knockout of the Slc5a6 gene in mouse intestine impairs biotin absorption."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microscopic analysis showed histological abnormalities in the small bowel (shortened villi, dysplasia) and cecum (chronic active inflammation, dysplasia) of the KO mice."
    explanation: Intestinal SMVT loss also damages the intestinal mucosa.
  downstream:
  - target: Systemic Biotin and Pantothenate Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23104561
      reference_title: "Conditional knockout of the Slc5a6 gene in mouse intestine impairs biotin absorption."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Growth retardation, decreased bone density, decreased bone length, and decreased biotin status were observed in the KO mice."
      explanation: Intestinal knockout alone is sufficient to lower whole-body biotin status.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from the intestinal knockout mouse, whose growth failure is
      prevented by biotin and pantothenic acid oversupplementation.
    evidence:
    - reference: PMID:29669219
      reference_title: "Biotin and pantothenic acid oversupplementation to conditional SLC5A6 KO mice prevents the development of intestinal mucosal abnormalities and growth defects."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings showed that such a regimen prevents early death, as well as normalizes the growth rate, intestinal integrity, pathology, and inflammation in SMVT-cKO mice."
      explanation: Growth failure from intestinal SMVT loss is vitamin-dependent in mice.
- name: Reduced Vitamin Uptake at the Blood-Brain Barrier
  biological_scale: TISSUE
  description: >-
    SMVT is expressed on the luminal membrane of human brain capillary
    endothelium and carries most of the biotin and pantothenate uptake there,
    so its loss is expected to limit supply of these cofactors to the brain.
    This node is supported by transport studies in brain endothelial cells, not
    by measurements in patients.
  evidence:
  - reference: PMID:25809983
    reference_title: "Major involvement of Na(+) -dependent multivitamin transporter (SLC5A6/SMVT) in uptake of biotin and pantothenic acid by human brain capillary endothelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study is the first to confirm expression of SLC5A6 in human brain microvessels and to provide evidence that SLC5A6 is a major contributor to luminal uptake of biotin and pantothenic acid at the human blood-brain barrier."
    explanation: Places SMVT as the main route for biotin and pantothenate entry into the human brain.
  downstream:
  - target: Infantile Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Systemic Biotin and Pantothenate Deficiency
  biological_scale: ORGANISM
  description: >-
    Reduced absorption and cellular uptake produce low circulating biotin and
    pantothenate. Serum biotin was below the reference range in a COMNB patient
    tested, and untargeted metabolomics in a severe case showed reduced
    pantothenate and coenzyme A. Serum biotin is an unreliable marker of
    biotin status, so a normal value does not exclude the disorder.
  chemical_entities:

    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMVTD usually presents with various symptoms in multiple organs, such as gastrointestinal hemorrhage, brain atrophy, and global developmental delay, at birth or in infancy."
    explanation: Defines the multisystem infantile-onset presentation of the severe subtype.
  - reference: PMID:38012394
    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Without nutrient replacement therapy, SMVTD can be lethal in early childhood."
    explanation: Records the lethality of the untreated severe subtype.
  - reference: PMID:27904971
    reference_title: "Mutations in SLC5A6 associated with brain, immune, bone, and intestinal dysfunction in a young child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first reporting of mutations in the SLC5A6 gene in man"
    explanation: The founding case of the gene-disease relationship was an infant with multisystem disease.
- name: COMNB
  display_name: Childhood-onset biotin-responsive peripheral motor neuropathy (COMNB)
  subtype_term:
    preferred_term: peripheral motor neuropathy, childhood-onset, biotin-responsive
    term:
      id: MONDO:0859255
      label: peripheral motor neuropathy, childhood-onset, biotin-responsive
  description: >-
    The mild end of the spectrum. After normal early development, distal upper
    limb weakness with thenar, hypothenar and interosseous wasting begins at
    about 6 to 13 years, sometimes with distal leg weakness, absent ankle
    reflexes and gait difficulty. Nerve conduction findings are pleomorphic,
    with axonal and demyelinating features and sometimes asymmetry. The
    recurrent homozygous missense allele p.(Ser429Gly) accounts for most
    reported cases. A few patients also had dilated cardiomyopathy, premature
    hair graying or mild cerebellar and pyramidal signs.
  evidence:
  - reference: PMID:38012394
    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COMNB is clinically milder and has a later onset than SMVTD, at approximately 10 years of age. COMNB symptoms are mostly limited to peripheral motor neuropathy."
    explanation: Defines the mild subtype by onset age and restriction to motor neuropathy.
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We expand the phenotypic spectrum associated with biallelic SLC5A6 variants affecting function by reporting five individuals from three families with motor neuropathies."
    explanation: The founding report of the motor neuropathy presentation.
- name: SRDDBC
  display_name: Spontaneously remitting developmental delay with brain cysts (proposed)
  description: >-
    An intermediate presentation proposed from a single Japanese family of
    three affected siblings with compound heterozygous missense variants:
    congenital brain cysts on neonatal imaging and a mild motor developmental
    delay that resolved without vitamin treatment. The authors call for further
    cases before it is accepted as a distinct category, and MONDO has no term
    for it.
  evidence:
  - reference: PMID:38012394
    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From these findings we propose a new SLC5A6-related disorder, spontaneously remitting developmental delay with brain cysts (SRDDBC) whose phenotypic severity is between that of SMVTD and COMNB."
    explanation: States the proposed intermediate category and its place on the severity scale.
  - reference: PMID:38012394
    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients had congenital brain cysts on neonatal cranial imaging, but no other morphological abnormalities."
    explanation: The defining imaging finding of the proposed intermediate form.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients carry biallelic SLC5A6 variants, either homozygous
    (often in consanguineous families, as with p.(Ser429Gly) and the Maghreb
    intronic founder variant) or compound heterozygous, and parents tested are
    unaffected heterozygous carriers.
  evidence:
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the homozygous SLC5A6 variant in patients 1–1, 1–2, and 1–3, and also confirmed that each asymptomatic parent harbored the heterozygous variant"
    explanation: Homozygous affected siblings with unaffected heterozygous parents is the recessive segregation pattern.
  - reference: PMID:38348452
    reference_title: "Recurrent \"outsider\" intronic variation in the SLC5A6 gene causes severe mixed axonal and demyelinating neuropathy, cyclic vomiting and optic atrophy in 3 families from Maghreb."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients, born form consanguineous parents, were homozygous carriers of the same intronic variation, outside of canonical sites, in the SLC5A6 gene encoding SMVT."
    explanation: Homozygosity in consanguineous families supports recessive inheritance.

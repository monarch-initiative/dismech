has_subtypes:
- name: NERIB
  display_name: Infantile-onset multisystem SMVT deficiency (NERIB)
  subtype_term:
    preferred_term: neurodegeneration, infantile-onset, biotin-responsive
    term:
      id: MONDO:0033546
      label: neurodegeneration, infantile-onset, biotin-responsive
  description: >-
    The severe end of the spectrum and the first form described. Onset is at
    birth or in infancy, occasionally with prenatal ventriculomegaly, and
    disease is multisystem: failure to thrive, developmental delay or
    regression, seizures, brain atrophy, gastrointestinal hemorrhage, reflux
    and pseudo-obstruction, hypogammaglobulinemia and recurrent infections,
    osteopenia, metabolic acidosis with hypoglycemia, and cardiac failure in
    some infants. Untreated siblings have died in early childhood. Reported
    genotypes usually pair a null allele with a functionally impaired allele.
  evidence:

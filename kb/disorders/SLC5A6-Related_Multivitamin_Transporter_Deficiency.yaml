name: SLC5A6-Related Multivitamin Transporter Deficiency
creation_date: '2026-10-14T12:36:44Z'
category: Mendelian
description: >-
  Autosomal recessive disorder caused by biallelic SLC5A6 variants that reduce
  the activity of the sodium-dependent multivitamin transporter (SMVT), the
  carrier responsible for sodium-coupled uptake of biotin, pantothenic acid and
  lipoic acid in the intestine, at the blood-brain barrier and in other
  tissues. The clinical picture is a severity spectrum. At the severe end,
  infantile-onset multisystem disease (sodium-dependent multivitamin transporter
  deficiency, MONDO "neurodegeneration, infantile-onset, biotin-responsive")
  combines failure to thrive, developmental delay or regression, epileptic
  encephalopathy, brain atrophy, gastrointestinal bleeding and dysmotility,
  hypogammaglobulinemia, osteopenia, metabolic crises with biotinidase-like
  organic aciduria and, in some cases, cardiac failure, and is lethal in early
  childhood without treatment. At the mild end, a childhood-onset peripheral
  motor neuropathy (COMNB) presents at about 6 to 13 years with distal hand
  weakness and intrinsic hand muscle wasting, with mixed axonal and
  demyelinating motor nerve findings. Intermediate cases include a remitting
  developmental delay with congenital brain cysts and a progressive mixed
  sensorimotor neuropathy with optic atrophy and cyclic vomiting. All forms are
  treated with high-dose oral biotin, pantothenic acid and lipoic acid, and
  response is best when treatment starts early.
synonyms:
- sodium-dependent multivitamin transporter deficiency
- SMVT deficiency
- SMVTD
- NERIB
- neurodegeneration, infantile-onset, biotin-responsive
- biotin-responsive childhood-onset motor neuropathy
- peripheral motor neuropathy, childhood-onset, biotin-responsive
- COMNB
- SLC5A6-related disorder
parents:

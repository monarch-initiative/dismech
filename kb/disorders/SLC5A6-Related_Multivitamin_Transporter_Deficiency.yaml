- name: Impaired Biotin-Dependent Carboxylase Activity
  biological_scale: CELLULAR
  description: >-
    Biotin is the cofactor of the five mammalian carboxylases. Severe SMVT
    deficiency produces the organic acid and acylcarnitine pattern of multiple
    carboxylase deficiency (raised urinary 3-hydroxyisovaleric acid and plasma
    C5-OH carnitine), which can mimic biotinidase deficiency. In a COMNB
    patient, fibroblast pyruvate carboxylase activity was normal, but cultured
    skin cells are insensitive to biotin depletion, so this does not exclude a
    tissue deficit.
  molecular_functions:
  - preferred_term: pyruvate carboxylase activity
    modifier: DECREASED
    term:
      id: GO:0004736
      label: pyruvate carboxylase activity
  evidence:
  - reference: PMID:31392107
    reference_title: "Genetic defect of the sodium-dependent multivitamin transporter: A treatable disease, mimicking biotinidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in the SLC5A6 gene may lead to a metabolic disorder mimicking biotinidase deficiency that can be treated with supplementation of the vitamins biotin and pantothenic acid."
    explanation: The biochemical phenotype resembles the multiple carboxylase deficiency of biotinidase deficiency.
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "By measuring the activity of the biotin-dependent pyruvate carboxylase in fibroblasts of patient 1–2 we did not obtain evidence for biotin deficiency in this patient."
    explanation: >-
      In a COMNB patient, fibroblast pyruvate carboxylase activity was normal.
      The authors attribute this to the low sensitivity of skin cells to biotin
      depletion, so it argues against a measurable carboxylase deficit in
      fibroblasts rather than in nerve.

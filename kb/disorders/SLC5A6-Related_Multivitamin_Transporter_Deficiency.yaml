animal_models:
- name: Intestine-specific Slc5a6 conditional knockout mouse
  species: Mouse
  genotype: Intestine-specific Slc5a6 conditional knockout (Cre/lox)
  publication: PMID:23104561
  description: >-
    Cre/lox deletion of Slc5a6 restricted to the intestine. Mice lose
    carrier-mediated intestinal biotin uptake, become biotin deficient, show
    growth retardation, reduced bone density and length, small bowel and
    cecal inflammation and dysplasia, and about two thirds die between 6 and
    10 weeks. Biotin and pantothenic acid oversupplementation prevents these
    abnormalities.
  modeled_mechanisms:
  - target: Impaired Intestinal Biotin and Pantothenate Absorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Directly models loss of intestinal SMVT and the resulting absorption
      defect and biotin deficiency.
    limitations: >-
      Deletion is complete and confined to the intestine, whereas patients
      carry hypomorphic alleles that act in every tissue, including nerve and
      brain. No neuropathy readout was reported.
    evidence:
    - reference: PMID:23104561
      reference_title: "Conditional knockout of the Slc5a6 gene in mouse intestine impairs biotin absorption."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These studies provide the first in vivo confirmation in native intestine that SMVT is solely responsible for intestinal biotin uptake."
      explanation: The model reproduces the intestinal absorption defect.
- name: Cardiac-specific Slc5a6 knockout mouse
  species: Mouse
  genotype: Slc5a6cKO (cardiomyocyte-specific)
  publication: PMID:42228401
  description: >-
    Cardiomyocyte-restricted Slc5a6 deletion produces progressive cardiac
    dysfunction with hypertrophy, fibrosis, impaired coenzyme A synthesis and
    death by 26 weeks, prevented by vitamin supplementation from preconception.
  modeled_mechanisms:
  - target: Cardiomyocyte Mitochondrial Metabolic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Models cardiomyocyte SMVT loss and the metabolic and mitochondrial
      changes that precede cardiomyopathy.
    limitations: >-
      Complete tissue-restricted deletion rather than systemic hypomorphic
      loss, so it isolates the cell-autonomous cardiac effect and does not
      capture the contribution of systemic deficiency.
    evidence:
    - reference: PMID:42228401
      reference_title: "A Slc5a6-deficient mouse model reveals metabolically driven cardiomyopathy with therapeutic potential for vitamin-based intervention."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Proteomic analysis revealed early mitochondrial metabolic disruption and extracellular matrix protein upregulation at 8 weeks, preceding overt cardiac dysfunction."
      explanation: The model shows mitochondrial metabolic disruption ahead of cardiac failure.
differential_diagnoses:
- name: Biotinidase deficiency
  description: >-
    Severe SMVT deficiency produces the organic aciduria of multiple
    carboxylase deficiency and was first managed as biotinidase deficiency in
    some patients; both are biotin-responsive, and both can cause neuropathy
    and optic atrophy.
  disease_term:
    preferred_term: biotinidase deficiency
    term:
      id: MONDO:0009665
      label: biotinidase deficiency
  distinguishing_features:
  - Biotinidase activity is normal or only marginally reduced in SMVT deficiency.
  - SMVT deficiency also lowers pantothenate and lipoate and needs replacement of all three.
  evidence:
  - reference: PMID:31392107
    reference_title: "Genetic defect of the sodium-dependent multivitamin transporter: A treatable disease, mimicking biotinidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biotinidase activity in plasma showed only marginally decreased activity, which was considered insufficient explanation for her clinical symptoms."
    explanation: A patient first suspected of biotinidase deficiency had near-normal enzyme activity.
discussions:
- discussion_id: slc5a6_neuropathy_limiting_cofactor
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which SMVT substrate, biotin, pantothenate or lipoate, is limiting for
    peripheral nerve, and is the primary lesion in the motor axon or the
    Schwann cell?
  attaches_to:
  - "pathophysiology#Peripheral Motor Axon and Myelin Degeneration"
  - "pathophysiology#Systemic Biotin and Pantothenate Deficiency"
  rationale: >-
    The neuropathy has both axonal and demyelinating features and responds to
    combined replacement, so the cofactor and cell type driving it are
    unknown. Fibroblast carboxylase activity was normal in a COMNB patient, and
    no nerve-specific Slc5a6 model has been reported. Knowing the limiting
    cofactor could simplify treatment and explain the variable response.
- discussion_id: slc5a6_genotype_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does residual SMVT transport activity predict whether a patient develops
    the infantile multisystem disease, an intermediate form or the
    childhood-onset motor neuropathy?
  attaches_to:
  - "pathophysiology#SLC5A6 Biallelic Loss-of-Function Variants"
  - "has_subtypes#NERIB"
  - "has_subtypes#COMNB"
  rationale: >-
    Severe cases tend to carry a null allele with an impaired allele, and COMNB
    cases carry membrane-localized missense alleles, but transport has been
    measured for few alleles and in different systems. One review found no
    clear genotype-phenotype correlation but little intrafamilial variability
    in onset, which is what a residual-activity model would predict.
notes: >-
  Lump decision: the two MONDO terms for SLC5A6 disease, MONDO:0033546
  (neurodegeneration, infantile-onset, biotin-responsive; OMIM:618973) and
  MONDO:0859255 (peripheral motor neuropathy, childhood-onset, biotin-responsive;
  OMIM:619903), are curated as subtypes of this one gene-level entry. They
  share the gene, the transporter defect, the cofactor deficiency and the
  treatment; they differ in severity and organ involvement, and published
  cases fill the space between them (a remitting developmental delay with
  brain cysts, and a progressive sensorimotor neuropathy with optic atrophy and
  cyclic vomiting). MONDO has no class spanning the spectrum, so both terms are
  recorded as narrowMatch mappings and the entry has no disease_term. A further
  report of SLC5A6 neuropathy with 18 months of sustained improvement on
  targeted multivitamin therapy (PMID:42507522) returned no abstract text on
  the fetch made for this entry, so it is not cited as evidence. No
  GeneReviews chapter names this disorder in the committed Bookshelf index.

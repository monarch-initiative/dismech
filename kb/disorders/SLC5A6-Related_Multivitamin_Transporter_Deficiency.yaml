    explanation: Case count across the published literature at the time of the review.
pathophysiology:
- name: SLC5A6 Biallelic Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic SLC5A6 variants reduce SMVT function. Severe infantile
    cases have usually carried a null allele (for example p.(Arg94*) or an
    early frameshift) in trans with a functionally impaired allele. The motor
    neuropathy cases carry missense alleles such as p.(Ser429Gly) and
    p.(Tyr162Cys) that reach the plasma membrane but transport less, so
    residual activity is thought to set the severity. Patient fibroblasts
    carrying p.(Ser429Gly) take up about 90 percent less biotin than controls.
  genes:
  - preferred_term: SLC5A6
    term:
      id: hgnc:11041
      label: SLC5A6
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SLC5A6 missense variants p.(Tyr162Cys) and p.(Ser429Gly) did not affect plasma membrane localization of the ectopically expressed multivitamin transporter suggesting reduced but not abolished function, such as lower catalytic activity."
    explanation: The neuropathy alleles are hypomorphic rather than null.
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data suggest that the four reported patients with a multisystemic disease and/or near-fatal events carry a null allele in trans with a second allele that produces a functionally impaired SMVT transporter"
    explanation: Links the severe multisystem presentation to a null allele combined with an impaired allele.
  downstream:
  - target: Impaired Sodium-Dependent Multivitamin Uptake
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38816490
      reference_title: "Genome sequencing enables diagnosis and treatment of SLC5A6 neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biotin uptake studies on AII:1 fibroblasts, expressing the p.(Ser429Gly) variant, showed an ~90% reduction in uptake compared to controls."
      explanation: The recurrent neuropathy allele directly reduces biotin uptake in patient cells.
    - reference: PMID:27904971
      reference_title: "Mutations in SLC5A6 associated with brain, immune, bone, and intestinal dysfunction in a young child."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The results showed severe impairment in biotin uptake in cells expressing the mutants compared to those expressing wild-type hSMVT."
      explanation: The alleles of the first severe case abolish most biotin transport when expressed in intestinal and brain cell lines.
- name: Impaired Sodium-Dependent Multivitamin Uptake
  biological_scale: CELLULAR
  description: >-
    SMVT is the sodium-coupled carrier for biotin, pantothenate and lipoate.
    Loss of its activity reduces cellular uptake of all three cofactors, which
    is why the disease is a combined deficiency rather than a single-vitamin
    disorder.

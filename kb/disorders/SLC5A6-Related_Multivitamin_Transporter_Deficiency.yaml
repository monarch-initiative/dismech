- name: Impaired B Cell Terminal Differentiation
  biological_scale: CELLULAR
  description: >-
    In a family with compound heterozygous SLC5A6 variants and antibody
    deficiency, biotin deficiency impaired plasma cell maturation through
    altered mitochondrial respiration, and biotin restored antibody
    production in the patient and in a knock-in mouse carrying a patient
    variant. This is the proposed basis of the hypogammaglobulinemia and
    recurrent infections reported across the spectrum.

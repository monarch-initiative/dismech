- name: Infantile Neurodegeneration
  biological_scale: TISSUE
  description: >-
    In the severe subtype, normal or delayed early development is followed by
    regression, epileptic encephalopathy, progressive cerebral, cerebellar and
    brainstem atrophy and acquired microcephaly. Targeted vitamin replacement
    has produced neurocognitive and motor improvement. Prenatal ventriculomegaly
    in one infant suggests onset can begin before birth.

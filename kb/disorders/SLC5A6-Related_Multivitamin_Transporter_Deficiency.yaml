- name: Peripheral Motor Axon and Myelin Degeneration
  biological_scale: TISSUE
  description: >-
    The defining lesion of COMNB and a component of the severe forms. Motor
    nerve conduction studies show pleomorphic, sometimes asymmetric axonal and
    demyelinating abnormalities, and muscle shows chronic denervation with
    fiber type grouping. In the more severe and intermediate cases the
    neuropathy is sensorimotor. A neuropathy in a severe-form patient resolved
    on serial nerve conduction studies after vitamin replacement, so the lesion
    is at least partly reversible.

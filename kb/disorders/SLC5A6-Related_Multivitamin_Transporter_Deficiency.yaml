genetic:
- name: SLC5A6
  gene_term:
    preferred_term: SLC5A6
    term:
      id: hgnc:11041
      label: SLC5A6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Encodes the sodium-dependent multivitamin transporter (SMVT), a 13
    transmembrane helix member of the sodium:solute symporter family that
    transports biotin, pantothenate and lipoate (and iodide in vitro).
  notes: >-
    No ClinGen gene-disease validity assertion for SLC5A6 is cached in this
    repository, so gene_disease_validity is left absent.
  variants:
  - name: c.1285A>G p.(Ser429Gly)
    description: >-
      Recurrent missense allele in TM11, adjacent to a substrate-binding
      residue, found homozygous in most COMNB patients (Indian families
      sharing a haplotype) and in trans with a splice allele. It reaches the
      plasma membrane but reduces biotin uptake by about 90 percent in patient
      fibroblasts.
    evidence:
    - reference: PMID:38816490
      reference_title: "Genome sequencing enables diagnosis and treatment of SLC5A6 neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also report an unrelated female with peripheral neuropathy homozygous for the c.1285A>G p.(Ser429Gly) recurrent variant identified in seven reported cases, including this study."
      explanation: Establishes p.(Ser429Gly) as recurrent in the neuropathy presentation.
  evidence:
  - reference: PMID:38816490
    reference_title: "Genome sequencing enables diagnosis and treatment of SLC5A6 neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotype ranges from multisystem metabolic disorder to childhood-onset peripheral motor neuropathy."
    explanation: Biallelic SLC5A6 variants cause a single phenotypic range from multisystem disease to motor neuropathy.
  - reference: PMID:38012394
    reference_title: "Novel missense variants cause intermediate phenotypes in the phenotypic spectrum of SLC5A6-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic SLC5A6 variants cause sodium-dependent multivitamin transporter deficiency (SMVTD) and childhood-onset biotin-responsive peripheral motor neuropathy (COMNB), which both respond well to replacement therapy with the above three nutrients."
    explanation: Names both MONDO-level presentations as caused by the same gene and treated the same way.
diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis rests on finding biallelic SLC5A6 variants. Because the
    neuropathy form resembles other hereditary neuropathies and the severe form
    resembles biotinidase deficiency, most cases were found by exome or genome
    sequencing, and earlier genome sequencing was estimated to shorten the
    diagnostic odyssey and time to treatment by up to seven years. Deep
    intronic and splice variants (the Maghreb founder allele, c.393+2T>C) may
    need RNA studies to classify.
  diagnosis_term:
    preferred_term: exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38816490
    reference_title: "Genome sequencing enables diagnosis and treatment of SLC5A6 neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Health Economic analyses showed implementation of GS as an early investigation could have saved $ AUD 105,988 and shortened diagnostic odyssey and initiation of treatment by up to 7 years."
    explanation: Supports early genome sequencing as the diagnostic route.
  - reference: PMID:40396389
    reference_title: "SLC5A6 Mutations in Axonal Sensorimotor Polyneuropathy Patients Concurrent With Sodium Dependent Multivitamin Transporter Deficiency and Improved Effects by Multivitamin Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study performed whole exome sequencing to identify the genetic cause for two independent patients with early onset axonal sensorimotor polyneuropathy and SMVTD."
    explanation: Exome sequencing identified the cause in a neuropathy cohort.
- name: Nerve conduction studies and EMG
  description: >-
    Electrodiagnostic studies establish a motor-predominant neuropathy with
    mixed axonal and demyelinating features, sometimes asymmetric, and needle
    EMG shows chronic denervation.
  diagnosis_term:
    preferred_term: nerve conduction study
    term:
      id: NCIT:C154784
      label: Electroneurography
  evidence:
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings on NCS were sometimes asymmetric, suggesting that the nerve damage may be non-uniform in some instances."
    explanation: Nerve conduction studies define the neuropathy pattern.
- name: Biochemical screening and exclusion of biotinidase deficiency
  description: >-
    In the severe form, raised urinary 3-hydroxyisovaleric acid and plasma
    C5-OH carnitine with normal or near-normal biotinidase activity point to
    SMVT deficiency. Normal biotinidase activity was also documented in the
    COMNB patients. Serum biotin may be low but is an unreliable marker.
  evidence:
  - reference: PMID:38407570
    reference_title: "A new case of sodium-dependent multivitamin transporter defect occurring as a life-threatening condition responsive to early vitamin supplementation and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased and isolated excretion of urinary 3-hydroxyisovaleric acid may suggest, in the absence of markedly reduced biotinidase activity, a SMVT deficiency."
    explanation: The biochemical pattern that distinguishes SMVT deficiency from biotinidase deficiency.
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma biotinidase activity in all patients was normal (Table 3)."
    explanation: Biotinidase deficiency was excluded in the COMNB patients.
treatments:
- name: Triple vitamin replacement (biotin, pantothenic acid, lipoic acid)
  description: >-
    Lifelong high-dose oral biotin, pantothenic acid and lipoic acid, thought
    to work by bypassing the defective carrier through passive diffusion at
    pharmacological doses. Reported regimens vary widely, from biotin 10 mg
    twice daily up to 100 mg daily, with pantothenic acid 250 to 555 mg and
    lipoic acid 150 to 300 mg daily, and one patient received parenteral
    biotin, dexpanthenol and lipoic acid. Response is strongest when started
    early; in the defining COMNB cohort it was not uniform, with clear
    improvement in one patient and inconsistent change in others.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: biotin
      term:
        id: CHEBI:15956
        label: biotin
    - preferred_term: pantothenic acid
      term:
        id: CHEBI:7916
        label: pantothenic acid
    - preferred_term: lipoic acid
      term:
        id: CHEBI:16494
        label: lipoic acid
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Systemic Biotin and Pantothenate Deficiency
    treatment_effect: BYPASSES
    description: >-
      Pharmacological doses are proposed to enter cells by simple diffusion,
      restoring cofactor supply without the transporter.
    evidence:
    - reference: PMID:35013551
      reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "triple vitamin replacement therapy, likely via a simple diffusion mechanism, had beneficial effects in the three live patients"
      explanation: States the proposed bypass mechanism of high-dose replacement.
  target_phenotypes:
  - preferred_term: Distal upper limb muscle weakness
    term:
      id: HP:0008959
      label: Distal upper limb muscle weakness
  evidence:
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapeutic intervention yielded clinical improvement in four of the five patients."
    explanation: Most COMNB patients improved on targeted vitamin therapy.
  - reference: PMID:35013551
    reference_title: "Novel biallelic variants expand the SLC5A6-related phenotypic spectrum."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort, patient 2–1 showed unequivocal improvement with vitamin therapy; the patients in families 1 and 3 did not show consistent improvements, indicating that responses to vitamin therapy are not uniform."
    explanation: Response in the COMNB cohort was inconsistent, which qualifies any claim of uniform efficacy.
  - reference: PMID:38816490
    reference_title: "Genome sequencing enables diagnosis and treatment of SLC5A6 neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted treatment of AII:1 with biotin, pantothenic acid, and lipoic acid resulted in clinical improvement."
    explanation: Improvement of a motor axonal neuropathy patient on triple therapy.
  - reference: PMID:40396389
    reference_title: "SLC5A6 Mutations in Axonal Sensorimotor Polyneuropathy Patients Concurrent With Sodium Dependent Multivitamin Transporter Deficiency and Improved Effects by Multivitamin Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient 2, an oral regimen comprising biotin, lipoic acid, and pantothenic acid demonstrated significant therapeutic effects, including cessation of cyclic vomiting, resolution of skin lesions on the fingers, and improvements in muscle weakness affecting both the upper and lower extremities."
    explanation: Improvement of weakness and vomiting in an axonal sensorimotor neuropathy patient.
  - reference: PMID:31754459
    reference_title: "Identification and targeted management of a neurodegenerative disorder caused by biallelic mutations in SLC5A6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

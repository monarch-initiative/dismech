    explanation: Response of the first severe case.
  - reference: PMID:39898461
    reference_title: "Expanded Clinical Phenotype and the Role of Untargeted Metabolomics Analysis in Confirming the Diagnosis of Sodium-Dependent Multivitamin Transporter Deficiency."

      snippet: "CFAP65 staining was observed mainly at the equatorial segment of sperm head and the base of flagella in control spermatozoa, but the signal was only diffusely clustered in the acrosome of spermatozoa from men harboring hemizygous CFAP47 variants."
      explanation: CFAP65 is mislocalized in patient sperm.

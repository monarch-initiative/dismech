mechanistic_hypotheses:
- hypothesis_group_id: cfap47_phenotypic_spectrum
  hypothesis_label: CFAP47 deficiency spans MMAF and asthenozoospermia with normal sperm morphology
  status: EMERGING
  description: >-
    Six men with missense variants or a whole-gene deletion had MMAF, while
    two men with an exon 28-62 deletion or a nonsense variant had
    asthenozoospermia with normal morphology and an apparently normal 9+2
    axoneme, as do two independent Cfap47 knockout mouse lines. The
    determinants are unknown: allele class does not explain it, since the
    Australian whole-gene deletion gave MMAF, but that deletion also removed
    neighbouring Xp21.1 genes, and the cohorts were ascertained differently
    (MMAF cohorts versus an asthenozoospermia cohort).
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All men harboring hemizygous CFAP47 variants displayed typical MMAF phenotypes."
    explanation: The MMAF end of the spectrum.
  - reference: PMID:40473901
    reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, the significant truncation of the CFAP47 gene in Patient 1 and Patient 2 resulted in the ANM phenotype of sperm, mirroring the phenotypes observed in Cfap47-KO mice."
    explanation: The normal-morphology end of the spectrum.
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, the sperm phenotype of Cfap47-mutated male mice appears milder than the phenotype of men harboring hemizygous CFAP47 variants."
    explanation: A first knockout line also lacked full MMAF.
- hypothesis_group_id: cfap47_respiratory_involvement
  hypothesis_label: CFAP47 deficiency is restricted to sperm rather than causing primary ciliary dyskinesia
  status: EMERGING
  description: >-
    Men in the infertility cohorts had no PCD features, and Cfap47 knockout
    mice are otherwise healthy. Against this, three men with hemizygous
    missense variants and PCD-like disease (bronchiectasis, sinusitis, otitis
    media, low nasal nitric oxide and reduced or abnormal airway cilia) have
    been reported from one centre. That evidence is weak: the variants are
    missense, pathogenicity predictions were divergent for one, functional
    data are limited to reduced mRNA and staining, and one of the men
    fathered two children naturally.
  evidence:
  - reference: CGGV:assertion_5d2e51e3-fec5-4aa8-a093-d316c4feec02-2023-02-09T170000.000Z
    reference_title: "CFAP47 / spermatogenic failure, X-linked, 3 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While the number of patients published so far is quite small, all of them have been noted for the lack of phenotypes typically associated with primary ciliary dyskinesia, including absence of sinusitis, bronchitis, otitis media, and pneumonia (PMID: 33472045)."
    explanation: ClinGen summary of the absence of PCD features in the infertility probands.
  - reference: PMID:40473901
    reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While Cfap47-KO mice were otherwise healthy, males display drastically reduced fertility"
    explanation: Knockout mice have no extra-reproductive disease.
  - reference: PMID:37723893
    reference_title: "Mutations in CFAP47, a previously reported MMAF causative gene, also contribute to the respiratory defects in patients with PCD."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, our results indicate that CFAP47 hemizygous variants can result in PCD phenotypes both in lung and in sperm and that this gene is a novel PCD pathogenic gene."
    explanation: Two men with hemizygous missense variants and PCD-like disease.
  - reference: PMID:37723893
    reference_title: "Mutations in CFAP47, a previously reported MMAF causative gene, also contribute to the respiratory defects in patients with PCD."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had two naturally conceived healthy children."
    explanation: >-
      One of the two PCD probands was naturally fertile, which weakens the
      link between his variant and the sperm disease. Indirect: it bears on
      the claim only by weakening the opposing PCD evidence.
  - reference: PMID:40636384
    reference_title: "Case Report: Identification of a novel hemizygous CFAP47 variant in a primary ciliary dyskinesia patient with dual ciliary and flagellar defects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a male patient with suspected PCD who exhibited \"9 + 2\" ultrastructural abnormalities in both bronchial cilia and sperm flagella."
    explanation: A third man with airway and sperm axonemal defects.
  - reference: PMID:40636384
    reference_title: "Case Report: Identification of a novel hemizygous CFAP47 variant in a primary ciliary dyskinesia patient with dual ciliary and flagellar defects."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of this variant was assessed through multiple in silico tools, with divergent predictions."
    explanation: >-
      The PCD-associated variant in this case has uncertain pathogenicity.
      Indirect: it bears on the claim only by weakening the opposing PCD
      evidence.

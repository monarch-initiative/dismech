    reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CFAP47, the core structural component of the bridge, binds C1 through its N-terminal domains, interacts with HYDIN via its central CFAP47-ring, and anchors to C2 through its C-terminal region."
    explanation: >-
      Cryo-electron tomography of mouse sperm shows CFAP47 binds both central
      microtubules as a structural bridge, grounding the molecular functions.
- name: Loss of the C1-C2 Bridge of the Central Apparatus
  description: >-
    Without CFAP47 the bridge between the two central microtubules is hollow,
    weakening the C1-C2 connection and the force transmission of the
    central apparatus. In knockout mice and in two men with truncating
    alleles this gives asthenozoospermia with normal sperm morphology and an
    apparently normal 9+2 axoneme, with flagella beating at reduced curvature
    and amplitude.

- name: Mislocalization of CFAP65 in Sperm
  description: >-
    CFAP47 co-immunoprecipitates with CFAP65, the C2a projection protein
    mutated in spermatogenic failure 40. In men with CFAP47 variants CFAP65
    leaves the flagellar base and clusters in the acrosome, and conversely
    CFAP47 is reduced in sperm of men with CFAP65 variants.

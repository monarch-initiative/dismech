name: Spermatogenic Failure X-linked 3
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGFX3
- spermatogenic failure, X-linked, 3
- CFAP47-related multiple morphological abnormalities of the sperm flagella
- CFAP47-related asthenozoospermia
description: >-
  Spermatogenic failure X-linked 3 (SPGFX3) is X-linked recessive male
  infertility caused by hemizygous variants in CFAP47, a large X-chromosomal
  cilia- and flagella-associated protein. In the sperm axoneme CFAP47 is the
  core structural component of the bridge that links the C1 and C2
  microtubules of the central apparatus: it binds C1 through its N-terminal
  domains, HYDIN through a central ring, and C2 through its C-terminus. It
  also interacts with CFAP65, whose localization in sperm depends on it.

  Hemizygous men present with primary infertility and asthenozoospermia.
  Most reported men, carrying missense variants or a whole-gene deletion,
  have asthenoteratozoospermia with multiple morphological abnormalities of
  the sperm flagella (MMAF): absent, short, coiled and irregular-caliber
  flagella with missing central or peripheral microtubules, and in some men
  abnormal heads and sperm annulus. Two men with truncating variants had
  asthenozoospermia with normal sperm morphology and an apparently normal
  axoneme, as do Cfap47 knockout mice. Fertility has been achieved by
  intracytoplasmic sperm injection (ICSI), with assisted oocyte activation
  in one man with cleavage failure. Daughters of affected men are obligate
  carriers. Hemizygous CFAP47 missense variants have also been reported in
  three men with primary ciliary dyskinesia-like respiratory disease.
disease_term:
  preferred_term: spermatogenic failure, X-linked, 3
  term:
    id: MONDO:0025354
    label: spermatogenic failure, X-linked, 3
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 301059. ClinGen classifies
  CFAP47 in SPGFX3 as Limited (X-linked, 2023), scoring three hemizygous
  missense probands from PMID:33472045; it did not score the Australian
  proband's Xp21.1 deletion, whose breakpoints were undefined, and the second
  study it mentions was then unpublished (a recurrent missense variant,
  apparently PMID:37424856 in its published form, which is cited here). The
  Australian proband's deletion spans about 3.2 Mb of Xp21.1 and so removes
  other genes besides CFAP47. Separately, ClinGen classifies CFAP47 in
  X-linked polycystic kidney disease as Disputed (2025); kidney cysts are not
  part of SPGFX3. Hemizygous CFAP47 missense variants reported in men with
  primary ciliary dyskinesia-like disease (PMID:37723893, PMID:40636384) are
  recorded under the respiratory hypothesis rather than as phenotypes,
  because the variants are missense with limited functional data and one of
  those men fathered children naturally.
  No GeneReviews or StatPearls chapter covers this disorder.
inheritance:
- name: X-linked recessive
  description: >-
    Affected men are hemizygous for missense variants, truncating variants or
    a deletion of CFAP47 on Xp21.1; none of the reported families is
    consanguineous. Daughters of affected men conceived by ICSI are obligate
    heterozygous carriers, and their sons have a 50% risk.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, our experimental observations in humans and mice demonstrate that hemizygous mutations in CFAP47 can induce X-linked MMAF and asthenoteratozoospermia, for which good ICSI prognosis is suggested."
    explanation: Hemizygous X-linked inheritance in four unrelated men.
  - reference: CGGV:assertion_5d2e51e3-fec5-4aa8-a093-d316c4feec02-2023-02-09T170000.000Z
    reference_title: "CFAP47 / spermatogenic failure, X-linked, 3 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nevertheless, the molecular mechanism appears to be hemizygous loss-of-function with an X-linked mode of inheritance, characterized in at least some cases by variants predicted to trigger the absence of a gene product."
    explanation: ClinGen's summary of the mode of inheritance.
pathophysiology:
- name: Hemizygous Loss of CFAP47 Function
  description: >-
    Missense variants reduce CFAP47 mRNA and protein in sperm; a whole-gene
    deletion, an exon 28-62 deletion and a nonsense variant remove or
    truncate the protein. In wild-type mouse sperm CFAP47 forms the bridge
    between the C1 and C2 central-pair microtubules, binding both.
  biological_scale: MOLECULAR

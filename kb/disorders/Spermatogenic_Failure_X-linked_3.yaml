animal_models:
- name: Cfap47 frameshift mouse
  species: Mouse
  genotype: Cfap47 c.2559insT (p.Gly855Profs*8), hemizygous (Cfap47-/Y)
  publication: PMID:33472045
  description: >-
    Hemizygous males are sterile with reduced motility and bent flagella
    arising in the epididymis, normal sperm concentration and no gross
    axonemal defect; ICSI rescues fertilization.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Reproduces sterility and asthenozoospermia but only part of the MMAF phenotype.
    limitations: >-
      Mutant sperm show mainly bent flagella and no obvious axonemal
      ultrastructural defect, a milder phenotype than the full MMAF of most
      patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse sperm lacking CFAP47 keep their flagellar form and axoneme,
        whereas most hemizygous men have short, absent and coiled flagella
        with missing microtubules; the mouse models the motility defect
        better than the malformation.
    evidence:
    - reference: PMID:33472045
      reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, the sperm phenotype of Cfap47-mutated male mice appears milder than the phenotype of men harboring hemizygous CFAP47 variants."
      explanation: Authors' statement of the milder mouse phenotype.
- name: Cfap47 knockout mouse (exons 2-50 deletion)
  species: Mouse
  genotype: Cfap47 171.6-kb deletion of exons 2-50, hemizygous
  publication: PMID:40473901
  description: >-
    Knockout males are otherwise healthy, with normal sperm counts and
    morphology but reduced motility and fertility; the central apparatus
    lacks the CFAP47 bridge density.
  modeled_mechanisms:
  - target: Loss of the C1-C2 Bridge of the Central Apparatus
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Shows the structural lesion directly and reproduces the asthenozoospermia
      with normal morphology seen in men with truncating alleles.
    evidence:
    - reference: PMID:40473901
      reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cfap47-KO mice lack density associated with the CFAP47 and SPAG6 proteins in the bridge region of the CA structure."
      explanation: Bridge density is lost in knockout sperm.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: Knockout sperm have normal morphology, so MMAF is not reproduced.
    limitations: >-
      Normal sperm counts and morphology in knockout mice match the
      truncating-allele men but not the majority of reported men, who have
      MMAF.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse sperm without CFAP47 are motility-impaired but morphologically
        normal; whether human MMAF in CFAP47 men reflects a species difference,
        variant-specific effects or contributions from co-deleted genes is
        unknown.
    evidence:
    - reference: PMID:40473901
      reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This phenotype, characterized by asthenozoospermia with normal morphology, is hereafter referred to as ANM."
      explanation: Knockout sperm morphology is normal.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. Three of four couples in the first
    series achieved pregnancy (the fourth wife had poor oocyte quality), one
    man with an exon deletion obtained nine transferable embryos, and one
    couple with a recurrent missense variant did not conceive after one
    cycle. A man with c.8006C>T had cleavage failure after ICSI that improved
    with assisted oocyte activation (AOA), with ongoing pregnancy, and
    altered PLCZ1 localization in sperm.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion irrelevant to fertilization.
    evidence:
    - reference: PMID:33472045
      reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therefore, our studies strongly indicated that the damaged male fertility caused by hemizygous CFAP47 variants can be rescued by ICSI treatment."
      explanation: ICSI circumvents the flagellar defect.
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, three out of the four men harboring hemizygous CFAP47 variants in this study achieved good clinical outcomes after assisted reproductive therapy by ICSI (Table 3)."
    explanation: Good ICSI outcomes in three of four couples.
  - reference: PMID:40473901
    reference_title: "In situ structure of the mouse sperm central apparatus reveals mechanistic insights into asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assisted reproductive technology, specifically intracytoplasmic sperm injection (ICSI) for Patient 1 and his wife, resulted in successful fertilization of 11 metaphase II (MII) oocytes, yielding 9 transferable embryos"
    explanation: Successful fertilization for a man with a truncating deletion.
  - reference: PMID:37424856
    reference_title: "A novel mutation in CFAP47 causes male infertility due to multiple morphological abnormalities of the sperm flagella."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Regrettably, his wife has not succeeded in pregnancy."
    explanation: An unsuccessful ICSI cycle; the authors could not exclude female factors.
  - reference: PMID:42522280
    reference_title: "Genotype-based management of fertilization and cleavage failure: case-series evidence from DNAH10, DNAH12, CFAP47 , and PLCZ1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management-matched genotype: ICSI restored fertilization in DNAH10/DNAH12 deficiency, whereas ICSI plus assisted oocyte activation (AOA) improved cleavage and yielded ongoing pregnancies in CFAP47/PLCZ1 deficiency."
    explanation: ICSI with AOA in a man with CFAP47-associated cleavage failure.
- name: Genetic Counseling
  description: >-
    X-linked recessive counselling. Daughters of an affected man are obligate
    carriers and his sons are unaffected; a carrier woman's sons each have a
    50% risk of infertility.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, for ICSI performed in case of X-linked CFAP47-associated MMAF, 100% of female (but no male) offspring will inherit heterozygous deleterious variants of CFAP47."
    explanation: The transmission risks that counselling must convey.

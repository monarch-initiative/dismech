  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblotting and immunofluorescence assays revealed obviously reduced levels of CFAP47 in spermatozoa from all three men harboring deleterious missense variants of CFAP47."
    explanation: Missense alleles reduce CFAP47 in patient sperm.
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, WES data from an additional cohort of severe asthenoteratozoospermic men originating from Australia permitted the identification of a hemizygous Xp21.1 deletion removing the entire CFAP47 gene."
    explanation: A whole-gene deletion in a further proband.

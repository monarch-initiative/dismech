- name: Semen Analysis
  description: >-
    Shows severely reduced progressive motility, usually with MMAF; sperm
    morphology can be normal with truncating alleles.
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A semen analysis indicated the severely reduced sperm motility in all of four men harboring hemizygous CFAP47 variants (Table 2)."
    explanation: Semen analysis findings.
- name: Transmission Electron Microscopy of Sperm Flagella
  description: >-
    Shows missing central or peripheral microtubules and disorganized outer
    dense fibers in men with MMAF; can be normal with truncating alleles.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the sperm flagella of men harboring hemizygous CFAP47 variants displayed a variety of ultrastructural defects, including disorganization of outer dense fibers, and absence of peripheral or central microtubules at the midpiece and principal piece of sperm flagella"
    explanation: TEM findings.
- name: Immunofluorescence of CFAP47 in Sperm
  description: >-
    Reduced or absent CFAP47 staining at the flagellar base, with displaced
    CFAP65, supports pathogenicity of missense variants.
  evidence:
  - reference: PMID:33472045
    reference_title: "Deleterious variants in X-linked CFAP47 induce asthenoteratozoospermia and primary male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP47 staining is concentrated at the base of sperm flagella from the control individual, but the signal was almost absent in the sperm flagella from men harboring hemizygous CFAP47 variants."
    explanation: Immunofluorescence demonstrates protein loss.

      evidence_source: MODEL_ORGANISM
      snippet: "In the sperm of Cfap47-knockout (KO) mice, a hollow bridge region within the CA structure was observed, correlating with abnormal sperm motility and confirming the essential role of CFAP47 in CA function."
      explanation: Knockout sperm lack the bridge density.
  - target: Mislocalization of CFAP65 in Sperm

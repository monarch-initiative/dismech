  - reference: DOI:10.1002/ajmg.a.62027
    reference_title: Progressive cerebral and coronary aneurysms in the original two patients with Kosaki overgrowth syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To prevent the progression of artery dilation, preventative and therapeutic
      medical measures using tyrosine kinase inhibitors may be necessary in addition
      to optimal control of the systemic blood pressure.
    explanation: >-
      Serial-imaging follow-up of the original KOGS patients proposes tyrosine kinase
      inhibition to slow progressive arterial dilation.
- name: Systemic Vascular Screening and Blood Pressure Control
  description: >-
    Regular systemic and neurovascular screening during follow-up examinations,
    combined with genetic and clinical counseling regarding vascular risks and
    optimal systemic blood pressure control, is recommended to monitor and
    mitigate progressive cerebral and coronary arterial aneurysms.

    reference_title: Progressive cerebral and coronary aneurysms in the original two patients with Kosaki overgrowth syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we conducted subsequent analyses of serial neurovascular imaging studies of two original patients with a de novo heterozygous mutation in PDGFRB, that is, p.Pro584Arg. The analysis showed the progressive dilation of basilar and vertebral arteries and coronary arteries commencing during the teenage years and early 20s."
    explanation: >-
      Demonstrates the utility of serial neurovascular imaging in detecting
      progressive basilar and vertebral artery dilation and aneurysms in KOGS.

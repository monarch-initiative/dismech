inheritance:
- name: Autosomal dominant
  description: >-
    Kosaki overgrowth syndrome follows an autosomal dominant pattern. Most
    reported individuals, including the original two patients with p.Pro584Arg
    and p.Trp566Arg variants, carry de novo heterozygous activating PDGFRB
    variants, although vertical transmission from an affected parent to
    offspring has also been documented.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: DOI:10.1002/ajmg.a.62027
    reference_title: Progressive cerebral and coronary aneurysms in the original two patients with Kosaki overgrowth syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Skeletal overgrowth accompanied by de novo heterozygous activating mutations in PDGFRB (platelet‐derived growth factor receptor beta), that is, p.Pro584Arg and p.Trp566Arg, defines Kosaki overgrowth syndrome (OMIM #616592).'
    explanation: Establishes that classic Kosaki overgrowth syndrome typically arises from de novo heterozygous activating variants in PDGFRB.
  - reference: PMID:35221873
    reference_title: "Kosaki Overgrowth Syndrome: Report of a Family with a Novel PDGFRB Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous activating missense variants of PDGFRB are associated with the phenotype of Kosaki overgrowth syndrome (KOGS). Here, we present a family including a father and 2 siblings with a novel variant, c.2567A>T (p.Asn856Ile), localized in the cytoplasmic tyrosine kinase domain, exhibiting a KOGS phenotype."
    explanation: Confirms heterozygous autosomal dominant vertical transmission of Kosaki overgrowth syndrome from an affected father to two siblings.
genetic:
- name: PDGFRB Gain-of-Function Mutations
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  association: Causative
  features: >-
    Heterozygous activating missense variants in PDGFRB cause constitutive receptor
    activation. The germline P584R mutant identified in overgrowth syndrome is a
    stronger oncogene than the germline R561C mutant associated with myofibromatosis,
    and this difference in potency may explain the distinct overgrowth phenotype.
    The two recurrent KOGS variants, p.(Pro584Arg) and p.(Trp566Arg), lie in the
    juxtamembrane autoinhibitory domain of PDGFRB that normally restrains receptor
    autoactivation.
  evidence:
  - reference: PMID:26455322
    reference_title: PDGFRB mutants found in patients with familial infantile myofibromatosis or overgrowth syndrome are oncogenic and sensitive to imatinib.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the germline mutant identified in overgrowth syndrome, P584R, was a stronger oncogene than the germline R561C mutant associated with myofibromatosis."
    explanation: Functional characterization shows P584R is a potent activating variant.
  - reference: PMID:35221873
    reference_title: "Kosaki Overgrowth Syndrome: Report of a Family with a Novel PDGFRB Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous activating missense variants of PDGFRB are associated with the phenotype of Kosaki overgrowth syndrome (KOGS)."
    explanation: Confirms activating PDGFRB variants cause KOGS.
  - reference: PMID:31710779
    reference_title: "Kosaki overgrowth syndrome: A newly identified entity caused by pathogenic variants in platelet-derived growth factor receptor-beta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two known types of pathogenic variants (p.(Pro584Arg) and p.(Trp566Arg)) of the PDGFRB that cause KOGS are exclusively located in the juxtaglomerular domain that regulates autoactivation/inhibition of PDGFRB."
    explanation: >-
      Both recurrent KOGS variants map to the juxtamembrane autoinhibitory region of
      PDGFRB that normally restrains receptor autoactivation ("juxtaglomerular domain"
      as termed in the source).

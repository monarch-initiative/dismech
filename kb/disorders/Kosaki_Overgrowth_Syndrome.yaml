notes: >-
  Macrocephaly, previously flagged as uncited, is now captured as a phenotype
  supported by DOI:10.1111/cge.13192 ("pronounced macrocephaly from birth" in the
  reported patient); it appears to be a variable rather than universal KOGS feature
  and is not mentioned in several other KOGS reports (PMID:35221873, PMID:26455322,
  PMID:34738614, PMID:32500973).

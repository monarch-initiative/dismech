prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    PAC is consistently described as a rare tumor that is nonetheless the second
    most common malignancy of the minor salivary glands, after adenoid cystic
    carcinoma. The sources reviewed state rarity and rank qualitatively rather
    than reporting a quotable population rate, so only the coarse class is
    recorded. A registry-derived numeric incidence remains a curation gap.
  evidence:
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although relatively rare, polymorphous adenocarcinoma (PAC) is likely the
      second most common malignancy of the minor salivary glands (MiSG).
    explanation: >-
      A dedicated review characterises PAC as relatively rare while ranking it
      second among minor salivary gland malignancies, supporting the qualitative
      RARE class without asserting a numeric rate.
  - reference: PMID:25240283
    reference_title: "Hotspot activating PRKD1 somatic mutations in polymorphous low-grade adenocarcinomas of the salivary glands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polymorphous low-grade adenocarcinoma (PLGA) is the second most frequent
      type of malignant tumor of the minor salivary glands.
    explanation: >-
      Independently corroborates the second-most-frequent ranking among minor
      salivary gland malignancies under the former PLGA name.
- population: Minor salivary gland PAC-spectrum cohort (37 tumors, central histopathologic review)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Site and demographic distribution rather than an occurrence rate: 95% of
    PAC-spectrum tumors arose in minor salivary glands, the palate was the most
    frequent site for every histologic subtype, median age was 61 years, and there
    was a roughly 2:1 female predominance.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority (95%; 35/37) of tumors originated in minor salivary glands,
      with the palate being the most frequent site of origin for all tumor types
    explanation: >-
      Quantifies the minor salivary gland and palatal predominance of the
      PAC spectrum in a centrally reviewed cohort.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors affected 12 males (32%) and 25 (68%) females
    explanation: >-
      Documents the female predominance of the PAC spectrum in the same cohort.
progression:
- phase: Long-term outcome after treatment
  notes: >-
    Behavior is indolent. Pooled systematic-review data give recurrence of 12.5%
    for cribriform adenocarcinoma versus 17.8% for PAC overall, distant
    metastasis of 4.1% versus 5.5%, and death from disease of 3% versus 2.7% —
    that is, comparable between the two, with the difference concentrated in
    regional nodal spread rather than in distant spread or mortality. Note the
    disagreement between sources on mortality: one systematic review reports
    around 3% death from disease while another reports no documented
    tumor-related deaths, so disease-specific mortality should be treated as very
    low but not established as zero.
  evidence:
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 groups show a similar biologic behavior in regards to incidence of
      distant metastasis (4.1 vs 5.5%), recurrence (12.5 vs 17.8%), and death
      from disease (3 vs 2.7%).
    explanation: >-
      Quantifies recurrence, distant metastasis, and disease-specific mortality
      and shows they are comparable between the cribriform subtype and PAC
      overall, isolating nodal spread as the real difference.
  - reference: PMID:42438055
    reference_title: "Polymorphous Adenocarcinoma and Cribriform Adenocarcinoma of Salivary Glands (Cribriform Subtype of PAC): PRKD Mutation, Diagnosis, and Prognosis-A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resection and adjuvant radiotherapy are the conventional and effective
      treatments, with no documented tumor-related deaths.
    explanation: >-
      A second systematic review reports no tumor-related deaths, which conflicts
      with the roughly 3% disease-specific mortality above; recorded as PARTIAL
      because the two pooled estimates disagree on this endpoint.
- phase: Follow-up in a genotyped PAC-spectrum cohort
  notes: >-
    In a centrally reviewed cohort followed for a median of 70 months, only three
    patients recurred and none died of disease, and recurrence-free survival did
    not differ between fusion-positive and hotspot-mutant tumors.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No death of disease was found during the follow-up period
    explanation: >-
      Documents absence of disease-specific death over extended follow-up in a
      genotyped cohort, consistent with indolent behaviour.
has_subtypes:
- name: Conventional
  display_name: Conventional (classic) polymorphous adenocarcinoma
  subtype_term:
    preferred_term: Salivary Gland Polymorphous Adenocarcinoma, Conventional Subtype
    term:
      id: NCIT:C201781
      label: Salivary Gland Polymorphous Adenocarcinoma, Conventional Subtype
  description: >-
    The classic form, overwhelmingly palatal, showing tubular, trabecular,
    microcystic, solid, and papillary-cystic architecture with mucinous, myxoid,
    or hyalinized stroma and frequent perineural involvement. It is the subtype
    enriched for the PRKD1 p.Glu710Asp hotspot mutation and rarely involves
    regional lymph nodes.
  genes:
  - preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  evidence:
  - reference: PMID:37595638
    reference_title: "Comprehensive Molecular Characterization of Polymorphous Adenocarcinoma, Cribriform Subtype: Identifying Novel Fusions and Fusion Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While conventional PACs are most associated with PRKD1 p.E710D hotspot
      mutations, the cribriform subtype is often associated with gene fusions in
      PRKD1, PRKD2, or PRKD3.
    explanation: >-
      States the genotype split between the conventional and cribriform subtypes
      that defines this subtype division.
- name: Cribriform
  display_name: Cribriform subtype (cribriform adenocarcinoma of salivary gland, CASG)
  subtype_term:
    preferred_term: Salivary Gland Polymorphous Adenocarcinoma, Cribriform Subtype
    term:
      id: NCIT:C201786
      label: Salivary Gland Polymorphous Adenocarcinoma, Cribriform Subtype
  description: >-
    A subtype with predominantly cribriform and multinodular architecture, a
    predilection for the base of tongue rather than the palate, and a markedly
    higher rate of regional lymph node metastasis at presentation. It is enriched
    for PRKD1/PRKD2/PRKD3 rearrangements rather than the PRKD1 hotspot mutation.
    Whether it is a subtype of PAC or a separate entity remains contested; the WHO
    classification places it under the PAC heading.
  genes:
  - preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  - preferred_term: PRKD2
    term:
      id: hgnc:17293
      label: PRKD2
  - preferred_term: PRKD3
    term:
      id: hgnc:9408
      label: PRKD3
  evidence:
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PAC and CAC both show median age of diagnosis in the sixth decade of life
      and a female predominance. CAC occurs most frequently in the tongue and PAC
      in the palate.
    explanation: >-
      Establishes the site difference (tongue versus palate) that distinguishes
      the cribriform subtype from conventional PAC.
pathophysiology:
- name: PRKD1 Hotspot Activating Mutation
  biological_scale: MOLECULAR
  description: >-
    A recurrent somatic missense mutation in PRKD1 encoding p.Glu710Asp occurs in
    the catalytic kinase domain of protein kinase D1 and is present in the
    majority of conventional polymorphous adenocarcinomas. Functional work showed
    the substitution is kinase-activating and behaves as a driver. The mutation is
    essentially absent from other salivary gland tumor types, making it both the
    initiating lesion and the most specific molecular diagnostic marker for this
    entity.
  genes:
  - preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:25240283
    reference_title: "Hotspot activating PRKD1 somatic mutations in polymorphous low-grade adenocarcinomas of the salivary glands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified PRKD1 hotspot mutations encoding p.Glu710Asp in 72.9% of PLGAs
      but not in other salivary gland tumors.
    explanation: >-
      The originating study establishes both the hotspot identity and its
      restriction to this tumor type among salivary gland neoplasms.
  - reference: PMID:25240283
    reference_title: "Hotspot activating PRKD1 somatic mutations in polymorphous low-grade adenocarcinomas of the salivary glands."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies demonstrated that this kinase-activating alteration
      likely constitutes a driver of PLGA.
    explanation: >-
      Functional assays support the mutation being kinase-activating and a driver
      rather than a passenger, justifying the INCREASED modifier on kinase
      activity.
  downstream:
  - target: Deregulated Protein Kinase D Signaling
    description: >-
      The activating substitution raises protein kinase D1 catalytic output,
      producing constitutive signaling through the pathway.
    causal_link_type: DIRECT
- name: PRKD Family Gene Rearrangement
  biological_scale: MOLECULAR
  description: >-
    Rearrangements involving PRKD1, PRKD2, or PRKD3 generate fusion genes that
    place a PRKD kinase domain under new regulatory control. First identified as
    ARID1A-PRKD1 and DDX3X-PRKD1 fusions in cribriform adenocarcinoma, the
    partner repertoire is unusually diverse for a salivary gland malignancy, with
    ARID1A and ARID1B the most common partners. These rearrangements are the
    characteristic driver of the cribriform subtype and are mutually exclusive
    with the PRKD1 hotspot mutation, representing a parallel route to the same
    deregulated kinase output.
  genes:
  - preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  - preferred_term: PRKD2
    term:
      id: hgnc:17293
      label: PRKD2
  - preferred_term: PRKD3
    term:
      id: hgnc:9408
      label: PRKD3
  - preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  - preferred_term: ARID1B
    term:
      id: hgnc:18040
      label: ARID1B
  - preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RNAseq of 2 CAMSGs showed ARID1A-PRKD1 and DDX3X-PRKD1 fusions,
      respectively, while no fusion candidates were identified in two PLGAs.
    explanation: >-
      The originating study identifies the first two PRKD1 fusion partners and
      the enrichment of fusions in cribriform rather than classic tumors.
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six additional cases each showed PRKD2 and PRKD3 rearrangements.
    explanation: >-
      Extends the rearrangement spectrum from PRKD1 to the paralogues PRKD2 and
      PRKD3, supporting a gene-family rather than single-gene lesion.
  - reference: PMID:37595638
    reference_title: "Comprehensive Molecular Characterization of Polymorphous Adenocarcinoma, Cribriform Subtype: Identifying Novel Fusions and Fusion Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common partners for the PRKD genes were ARID1A and ARID1B.
    explanation: >-
      Next-generation sequencing of 51 cases identifies ARID1A and ARID1B as the
      predominant fusion partners.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In agreement with previous reports, PRKD1 E710D hotspot mutations were
      mutually exclusive with rearrangements in PRKD1/2/3
    explanation: >-
      Establishes mutual exclusivity of the two driver classes, supporting them as
      parallel routes to one pathway rather than cooperating lesions.
  downstream:
  - target: Deregulated Protein Kinase D Signaling
    description: >-
      PRKD fusion proteins place a kinase domain under new regulatory control,
      converging on the same constitutive protein kinase D signaling output as the
      hotspot mutation.
    causal_link_type: DIRECT
- name: Deregulated Protein Kinase D Signaling
  biological_scale: CELLULAR
  description: >-
    Both driver classes converge on deregulated protein kinase D activity in the
    neoplastic ductal epithelium. The PRKD kinases are diacylglycerol-activated
    serine/threonine kinases acting in the diacylglycerol and protein kinase C
    signal transduction pathway, and the shared membership of PRKD1, PRKD2, and
    PRKD3 in that pathway is what makes lesions in any of the three
    interchangeable drivers. Genetic alterations targeting PRKD genes are present
    in roughly four fifths of tumors across the PAC histologic spectrum,
    supporting a convergent phenotype driven by one pathway.
  cell_types:
  - preferred_term: salivary gland cell
    term:
      id: CL:0009005
      label: salivary gland cell
  biological_processes:
  - preferred_term: protein kinase C signaling
    term:
      id: GO:0070528
      label: protein kinase C signaling
    modifier: INCREASED
  - preferred_term: positive regulation of cell population proliferation
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As PRKD2 and PRKD3 share similar functions with PRKD1 in the diacylglycerol
      and protein kinase C signal transduction pathway, we expanded the
      investigation for these genes by FISH.
    explanation: >-
      Names the shared pathway that makes PRKD1, PRKD2, and PRKD3 lesions
      interchangeable drivers, which is the rationale for this convergence node.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified genetic alterations targeting PRKD genes in the majority
      (78.4%) of tumors in the histologic spectrum of polymorphous adenocarcinoma
      included in this study.
    explanation: >-
      Quantifies PRKD pathway involvement across the histologic spectrum,
      supporting convergence on this node.
  downstream:
  - target: Architecturally Polymorphous Infiltrative Growth
    description: >-
      Constitutive protein kinase D signaling in ductal epithelium drives the
      proliferation and infiltrative growth that produce the tumor's
      characteristic multipattern architecture.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      The transcriptional and cytoskeletal effectors linking protein kinase D
      activation to the specific multipattern architecture of this tumor have not
      been defined.
- name: Architecturally Polymorphous Infiltrative Growth
  biological_scale: TISSUE
  description: >-
    The transformed cells form a single tumor displaying multiple coexisting
    architectural patterns (tubular, trabecular, cribriform, papillary, solid,
    single-file) while remaining cytologically bland and uniform, and infiltrate
    surrounding tissue with an unencapsulated advancing border. The dissociation
    of architectural variability from cytological uniformity is the defining
    morphological property of the entity and the origin of the name.
  cell_types:
  - preferred_term: salivary gland cell
    term:
      id: CL:0009005
      label: salivary gland cell
  downstream:
  - target: Perineural Invasion
    description: >-
      Infiltrative growth extends into perineural spaces, where the tumor forms
      characteristic concentric cuffs around nerve fascicles.
    causal_link_type: DIRECT
  - target: Regional Lymph Node Metastasis
    description: >-
      Invasive growth permits lymphatic spread to cervical nodes, a step strongly
      conditioned by which PRKD lesion class is present.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Lymphatic invasion and nodal colonisation steps have not been characterised
      specifically in this tumor type.
- name: Perineural Invasion
  biological_scale: TISSUE
  description: >-
    Tumor cells stream circumferentially around small nerves in concentric,
    targetoid whorls. Neurotropism is frequent, yet in the largest published
    series it coexisted with excellent long-term outcome after surgical excision
    alone.
  notes: >-
    The often-repeated contrast with adenoid cystic carcinoma — that perineural
    invasion is not an adverse prognostic factor here as it is there — is placed
    in notes rather than asserted as a curated claim, because no source cited in
    this entry tests perineural invasion as a prognostic variable within PAC. What
    the evidence supports is weaker and indirect: neurotropism is frequent, and
    the same series reports about 97.6% of patients alive or dead without disease
    at an average of 115 months, so frequent neurotropism plainly does not carry
    the outcome that ACC's does. The 164-case series does state that PAC must be
    separated from adenoid cystic carcinoma for prognostic reasons, but attributes
    that to the entity, not specifically to perineural invasion.
  evidence:
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors were infiltrative and characterized by a polymorphous growth
      pattern, with individual tumors demonstrating multiple patterns, including
      solid, ductotubular, cribriform, trabecular, and single file growth.
      Neurotropism was identified frequently.
    explanation: >-
      The largest published series reports frequent neurotropism, supporting
      perineural invasion as a characteristic feature.
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At an average of 115.4 months after presentation, approximately 97.6% of all
      patients were either alive or had died without evidence of recurrent disease
      after treatment with surgical excision only.
    explanation: >-
      Establishes excellent long-term outcome in the same cohort in which
      neurotropism was frequent. PARTIAL because the series does not analyse
      perineural invasion as an independent prognostic variable, so this bounds
      rather than proves the claim that it is not adverse here.
- name: Regional Lymph Node Metastasis
  biological_scale: ORGANISM
  description: >-
    Spread to cervical lymph nodes is the principal clinically actionable
    difference within the entity. Fusion-positive tumors metastasized to nodes in
    50% of cases at primary resection whereas hotspot-mutation-positive tumors did
    so in none, and pooled review data show nodal metastasis in about half of
    cribriform tumors against a much lower rate across PAC as a whole. This is why
    subtype and genotype assignment carries surgical consequences for neck
    management.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 37 tested tumors, 9 (24%) were associated with nodal metastasis at
      the time of primary resection, including 8 of 16 (50%) fusion-positive
      tumors, 0 of 14 (0%) mutation-positive tumors
    explanation: >-
      Directly quantifies the genotype-conditioned difference in nodal metastasis
      that this node records.
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was an increased incidence of nodal metastasis in CAC (53%) as
      compared with that in PAC of all subtypes
    explanation: >-
      A systematic review independently corroborates the elevated nodal metastasis
      rate of the cribriform subtype.
mechanistic_hypotheses:
- hypothesis_group_id: prkd_convergent_spectrum
  hypothesis_label: Single PRKD-Driven Spectrum Model
  status: CANONICAL
  description: >-
    Conventional PAC, cribriform adenocarcinoma, indeterminate tumors, and
    papillary-predominant tumors form one biological spectrum unified by
    alterations of the PRKD gene family, with the specific lesion (hotspot
    mutation versus rearrangement) explaining the morphological and nodal-risk
    differences rather than marking separate diseases. This is the position taken
    by the WHO classification, which places cribriform adenocarcinoma under the
    PAC heading, and is supported by the shared PRKD genotype across the spectrum
    and by the mutual exclusivity of the two lesion classes.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings show that polymorphous adenocarcinoma, cribriform
      adenocarcinoma, tumor with indeterminate features and tumor with predominant
      papillary pattern display marked genetic overlap, and suggest that they may
      represent a spectrum of lesions driven by PRKD gene alterations, rather than
      separate entities.
    explanation: >-
      States the single-spectrum conclusion from shared PRKD genotype across all
      four histologic categories.
- hypothesis_group_id: prkd_pathogenetic_dichotomy
  hypothesis_label: Two-Entity (Pathogenetic Dichotomy) Model
  status: ALTERNATIVE
  description: >-
    Classic PAC and cribriform adenocarcinoma are distinct entities that happen to
    involve the same gene family: the near-restriction of rearrangements to
    cribriform tumors and of the hotspot mutation to classic tumors, combined with
    their different primary sites and sharply different nodal metastasis rates,
    is read as a pathogenetic dichotomy rather than intra-entity variation. The
    original rearrangement study raised exactly this reading, and the naming
    change that folded cribriform adenocarcinoma into PAC was contested on the
    grounds of these clinical behaviour differences. The disagreement is
    unresolved and is not merely nomenclatural, because nodal risk drives whether
    neck dissection is considered.
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Controversy exists as to whether these tumors represent separate entities or
      variants of one spectrum, as they appear to have significant overlap, but
      also clinicopathologic differences.
    explanation: >-
      Frames the two-entity question as genuinely open, supporting ALTERNATIVE
      status for this model.
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This approach raised controversy, predominantly because of possible
      differences in clinical behaviour.
    explanation: >-
      Documents that the WHO decision to group cribriform adenocarcinoma under PAC
      was contested specifically on clinical behaviour grounds.
histopathology:
- name: Cytological Uniformity with Architectural Diversity
  diagnostic: true
  description: >-
    The defining feature: multiple architectural patterns coexist within one
    tumor while the individual cells remain bland, small to medium sized, and
    monomorphic. Diagnosis rests on recognising this dissociation, since no single
    pattern is specific.
  evidence:
  - reference: PMID:35507302
    reference_title: "Immunohistochemical Profile of Polymorphous Adenocarcinoma of Minor Salivary Gland: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of its architectural diversity, histological diagnosis of PAC can be
      difficult especially for small biopsies, and immunohistochemistry is of
      great help in differentiating it from its histologic mimics.
    explanation: >-
      Confirms that architectural diversity is the defining and diagnostically
      problematic feature, and the reason immunohistochemistry is needed on small
      biopsies.
- name: Cribriform Pattern
  finding_term:
    preferred_term: Cribriform Pattern
    term:
      id: NCIT:C35920
      label: Cribriform Pattern
  description: >-
    Sieve-like arrangement of tumor cells. Prominent and multinodular in the
    cribriform subtype, from which it takes its name, but also present focally in
    conventional tumors; notably, the measured proportion of cribriform area does
    not by itself predict the underlying PRKD lesion.
- name: Tubular Pattern
  finding_term:
    preferred_term: Tubular Pattern
    term:
      id: NCIT:C35925
      label: Tubular Pattern
  description: >-
    Small ducts and tubules lined by uniform cells, a common component of
    conventional PAC.
- name: Trabecular Pattern
  finding_term:
    preferred_term: Trabecular Pattern
    term:
      id: NCIT:C35913
      label: Trabecular Pattern
  description: >-
    Cords and trabeculae of tumor cells, frequently including single-file
    streaming, which is more characteristic of hotspot-mutant tumors than of
    fusion-positive ones.
- name: Papillary Growth Pattern
  finding_term:
    preferred_term: Papillary Growth Pattern
    term:
      id: NCIT:C35911
      label: Papillary Growth Pattern
  description: >-
    Papillary and papillary-cystic architecture. Papillary growth is
    significantly more common in fusion-positive tumors and has been associated
    with worse outcome, which is the basis for recommending that the percentage of
    papillae be reported.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such evidence suggests that the percentage of papillae may be predictive of
      the underlying genetic alteration in PRKD genes as well as the clinical
      outcome.
    explanation: >-
      Links papillary proportion to both PRKD genotype and outcome, supporting the
      reporting recommendation.
- name: Solid Growth Pattern
  finding_term:
    preferred_term: Solid Growth Pattern
    term:
      id: NCIT:C36182
      label: Solid Growth Pattern
  description: >-
    Sheets of uniform cells without duct formation, one of the coexisting patterns
    of conventional PAC.
- name: Multinodular Pattern
  finding_term:
    preferred_term: Multinodular Pattern
    term:
      id: NCIT:C35900
      label: Multinodular Pattern
  description: >-
    Multiple discrete tumor nodules, a feature of the cribriform subtype.
- name: Perineural Invasion
  finding_term:
    preferred_term: Perineural Invasion
    term:
      id: NCIT:C48260
      label: Perineural Invasion
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Concentric, targetoid cuffing of small nerves by tumor. Frequent enough to be
    a useful diagnostic clue, though it is shared with adenoid cystic carcinoma
    and so does not discriminate between them on its own.
  notes: >-
    See the Perineural Invasion pathophysiology node for why this entry does not
    curate the common claim that perineural invasion is prognostically benign in
    PAC: no cited source analyses it as an independent prognostic variable within
    this entity.
  evidence:
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors were infiltrative and characterized by a polymorphous growth
      pattern, with individual tumors demonstrating multiple patterns, including
      solid, ductotubular, cribriform, trabecular, and single file growth.
      Neurotropism was identified frequently.
    explanation: >-
      Supports the FREQUENT frequency band for perineural invasion in a 164-case
      series.
- name: Absence of a Distinct Myoepithelial Component
  diagnostic: true
  description: >-
    PAC lacks the true dual luminal/myoepithelial population of adenoid cystic
    carcinoma and pleomorphic adenoma. This underpins the p63-positive but
    p40-negative immunophenotype, because p40 recognises a p63 isoform specific
    for true myoepithelial differentiation.
  evidence:
  - reference: PMID:24969705
    reference_title: "Polymorphous low grade adenocarcinoma has a consistent p63+/p40- immunophenotype that helps distinguish it from adenoid cystic carcinoma and cellular pleomorphic adenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLGAs do not harbor a myoepithelial component
    explanation: >-
      States the absence of a myoepithelial component, which is the mechanistic
      basis for the discriminating p63+/p40- pattern.
phenotypes:
- name: Palatal Mass
  category: Clinical
  description: >-
    The characteristic presentation is a slowly enlarging, usually painless
    submucosal swelling of the palate, the single most common site of origin for
    conventional PAC.
  phenotype_term:
    preferred_term: Palatal mass
    term:
      id: HP:0031366
      label: Palate neoplasm
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:42438055
    reference_title: "Polymorphous Adenocarcinoma and Cribriform Adenocarcinoma of Salivary Glands (Cribriform Subtype of PAC): PRKD Mutation, Diagnosis, and Prognosis-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicopathological findings show that the tumor is most common in women and
      on the palate.
    explanation: >-
      A systematic review identifies the palate as the most common site,
      supporting a FREQUENT frequency band for palatal presentation.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutation-positive tumors most frequently originated from the palate (10/14,
      71%) and rarely occurred in base of tongue (1/14, 7%)
    explanation: >-
      Quantifies palatal origin in 71% of hotspot-mutant tumors, supporting the
      FREQUENT band for the conventional subtype.
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients usually presented clinically with a palatal mass
    explanation: >-
      A 164-case series reports palatal mass as the usual presentation,
      independently supporting the FREQUENT band.
- name: Salivary Gland Neoplasm
  category: Clinical
  description: >-
    PAC is a neoplasm of salivary gland tissue, overwhelmingly of the minor
    salivary glands; major salivary gland (parotid) primaries occur but are
    uncommon and in reported cases have been fusion-positive.
  phenotype_term:
    preferred_term: Salivary gland neoplasm
    term:
      id: HP:0100684
      label: Salivary gland neoplasm
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority (95%; 35/37) of tumors originated in minor salivary glands,
      with the palate being the most frequent site of origin for all tumor types
    explanation: >-
      Confirms salivary gland origin with minor gland predominance.
- name: Neoplasm of the Oral Cavity
  category: Clinical
  description: >-
    Because the minor salivary glands are distributed through the oral mucosa, PAC
    presents as an intraoral malignancy, and is the second most common intraoral
    malignant salivary gland carcinoma after adenoid cystic carcinoma.
  phenotype_term:
    preferred_term: Neoplasm of the oral cavity
    term:
      id: HP:0100649
      label: Neoplasm of the oral cavity
  evidence:
  - reference: PMID:29266837
    reference_title: "The PRKD1 E710D hotspot mutation is highly specific in separating polymorphous adenocarcinoma of the palate from adenoid cystic carcinoma and pleomorphic adenoma on FNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is the second most common intraoral malignant salivary gland carcinoma after
      adenoid cystic carcinoma (ACC) and carries an excellent prognosis.
    explanation: >-
      Establishes the intraoral location and the ranking among intraoral salivary
      malignancies.
- name: Neoplasm of the Tongue
  category: Clinical
  description: >-
    The cribriform subtype arises preferentially at the base of tongue rather than
    the palate, a site difference that is one of the strongest arguments for
    treating it as distinct from conventional PAC.
  phenotype_term:
    preferred_term: Base of tongue neoplasm
    term:
      id: HP:0100648
      label: Neoplasm of the tongue
  subtype: Cribriform
  evidence:
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAC occurs most frequently in the tongue and PAC in the palate.
    explanation: >-
      Directly supports the tongue predilection of the cribriform subtype.
- name: Cervical Lymphadenopathy from Nodal Metastasis
  category: Clinical
  description: >-
    Regional neck node metastasis, uncommon in conventional PAC but present in
    roughly half of cribriform/fusion-positive tumors at primary resection.
  phenotype_term:
    preferred_term: Cervical lymph node metastasis
    term:
      id: HP:0025289
      label: Cervical lymphadenopathy
  subtype: Cribriform
  evidence:
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLGA (PAC, classical variant) only rarely metastasizes, whereas CAMSG often
      shows metastases to the neck lymph nodes.
    explanation: >-
      Contrasts the rare metastasis of classical PAC with frequent neck nodal
      metastasis in the cribriform subtype, supporting the subtype restriction on
      this phenotype.
biochemical:
- name: PRKD1 E710D Hotspot Mutation Testing
  biomarker_term:
    preferred_term: PRKD1 p.E710D hotspot variant
    term:
      id: NCIT:C202963
      label: PRKD1 NP_002733.2:p.E710D
  notes: >-
    Sanger sequencing of the PRKD1 hotspot is the most specific molecular test for
    PAC and works on fine-needle aspiration material, but its sensitivity is only
    moderate, so a negative result does not exclude the diagnosis. Interpretation
    must be hotspot-specific: PRKD1 mutations outside the hotspot argue against
    PAC and towards adenoid cystic carcinoma.
  evidence:
  - reference: PMID:29266837
    reference_title: "The PRKD1 E710D hotspot mutation is highly specific in separating polymorphous adenocarcinoma of the palate from adenoid cystic carcinoma and pleomorphic adenoma on FNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The specificity of the PRKD1 hotspot mutation for identifying PAC among ACC
      and PA cases was 100% whereas the sensitivity was 50%.
    explanation: >-
      Quantifies both the perfect specificity and the limited sensitivity that
      govern how this test is used.
  - reference: PMID:29266837
    reference_title: "The PRKD1 E710D hotspot mutation is highly specific in separating polymorphous adenocarcinoma of the palate from adenoid cystic carcinoma and pleomorphic adenoma on FNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alternative PRKD1 mutations exclude PAC, and are more suggestive of ACC.
    explanation: >-
      Supports the requirement that interpretation be restricted to the hotspot
      rather than any PRKD1 variant.
- name: PRKD1/2/3 Rearrangement Testing
  biomarker_term:
    preferred_term: PRKD1 gene rearrangement
    term:
      id: NCIT:C201783
      label: PRKD1 Gene Rearrangement
  notes: >-
    Break-apart FISH for PRKD1, PRKD2, and PRKD3 detects the fusion class, but
    leaves partners unknown and misses some fusions, so next-generation sequencing
    is preferable in difficult cases given the unusually wide partner repertoire.
    Because fusion status tracks nodal risk, preoperative testing has been
    proposed to inform neck management.
  evidence:
  - reference: PMID:37595638
    reference_title: "Comprehensive Molecular Characterization of Polymorphous Adenocarcinoma, Cribriform Subtype: Identifying Novel Fusions and Fusion Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The wide variety of involved genes is unlike in other salivary gland
      malignancies and warrants a broader strategy of sequencing for molecular
      confirmation for particularly challenging cases, as our NGS study shows.
    explanation: >-
      Supports preferring broad sequencing over break-apart FISH because of the
      unusually diverse partner repertoire.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      molecular testing for PRKD1/2/3 fusion may be of clinical relevance
      pre-operatively to risk-stratify patients
    explanation: >-
      Supports the proposed preoperative use of fusion testing for nodal risk
      stratification.
- name: p63-Positive, p40-Negative Immunophenotype
  biomarker_term:
    preferred_term: TP63 Gene Product
    term:
      id: NCIT:C128297
      label: TP63 Gene Product
  notes: >-
    The discordant p63-positive/p40-negative pattern is the most useful routine
    immunohistochemical discriminator from adenoid cystic carcinoma and cellular
    pleomorphic adenoma, which show concordant p63/p40 staining. p63 alone is not
    discriminating because all three tumors are frequently p63-positive.
  evidence:
  - reference: PMID:24969705
    reference_title: "Polymorphous low grade adenocarcinoma has a consistent p63+/p40- immunophenotype that helps distinguish it from adenoid cystic carcinoma and cellular pleomorphic adenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 11 PLGAs (100 %) were positive for p63 but completely negative for p40.
    explanation: >-
      Documents the consistent discordant staining pattern in all PAC cases
      tested.
  - reference: PMID:24969705
    reference_title: "Polymorphous low grade adenocarcinoma has a consistent p63+/p40- immunophenotype that helps distinguish it from adenoid cystic carcinoma and cellular pleomorphic adenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLGA consistently exhibits a p63+/p40- immunophenotype that can help
      distinguish it from adenoid cystic carcinoma and cellular pleomorphic
      adenoma
    explanation: >-
      States the diagnostic utility of the pattern against the two principal
      mimics.
  - reference: PMID:35507302
    reference_title: "Immunohistochemical Profile of Polymorphous Adenocarcinoma of Minor Salivary Gland: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, > 90% positivity was observed for pan-cytokeratin (CK) (97.3%),
      CK7 (96.8%), CK7/8 (97.4%), E-cadherin (90.0%), Vimentin (92.5%), S100
      (97.0%), p63 (91.7%), and SOX10 (100%), while little to no positivity was
      observed for CK20 (0.0%), p40 (0.0%), and GFAP (5.0%).
    explanation: >-
      A meta-analysis of 409 cases quantifies the discordant pattern at scale,
      with p63 positive in 91.7% and p40 positive in 0.0%, far exceeding the
      11-case series above.
- name: S100, CK7, and SOX10 Expression
  biomarker_term:
    preferred_term: S100 Calcium Binding Protein
    term:
      id: NCIT:C29924
      label: S100 Calcium Binding Protein
  notes: >-
    The supportive positive profile is CK7-positive, CK20-negative,
    S100-positive, vimentin-positive, SOX10-positive, and GFAP-negative. SOX10
    was positive in every case assessed and S100 in 97.0%, but none of these is
    specific on its own, so they support the diagnosis in combination rather than
    individually. GFAP negativity helps exclude pleomorphic adenoma.
  evidence:
  - reference: PMID:35507302
    reference_title: "Immunohistochemical Profile of Polymorphous Adenocarcinoma of Minor Salivary Gland: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of this systematic review indicate that CK7+/CK20-, p63+/p40-,
      S100+, Vimentin+, and GFAP- immunophenotype have diagnostic value for PAC.
    explanation: >-
      States the composite immunophenotype of diagnostic value, pooled across 32
      studies and 409 cases.
  - reference: PMID:42438055
    reference_title: "Polymorphous Adenocarcinoma and Cribriform Adenocarcinoma of Salivary Glands (Cribriform Subtype of PAC): PRKD Mutation, Diagnosis, and Prognosis-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CK7 and S100 IHC markers consistently test positive.
    explanation: >-
      An independent systematic review corroborates consistent CK7 and S100
      positivity.
- name: Low Ki-67 (MIB-1) Proliferation Index
  biomarker_term:
    preferred_term: Ki-67 Labeling Index
    term:
      id: NCIT:C157250
      label: Ki-67 Labeling Index
  notes: >-
    Proliferative activity is low, with a pooled average MIB-1 labeling index
    under 4%. This is the quantitative correlate of the tumor's indolent
    behaviour and supports the diagnosis against higher-grade mimics, though it
    does not by itself separate PAC from other low-grade salivary carcinomas.
  evidence:
  - reference: PMID:35507302
    reference_title: "Immunohistochemical Profile of Polymorphous Adenocarcinoma of Minor Salivary Gland: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average MIB-1 labeling index was 3.78%.
    explanation: >-
      Quantifies the low proliferation index pooled across the meta-analysis
      cohort.
diagnosis:
- name: Incisional biopsy
  description: >-
    Diagnosis is established primarily on incisional biopsy of the lesion, ahead
    of definitive resection.
  diagnosis_term:
    preferred_term: incisional biopsy
    term:
      id: NCIT:C15386
      label: Incisional Biopsy
  evidence:
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis is mainly based on an incisional biopsy.
    explanation: >-
      Identifies incisional biopsy as the principal diagnostic procedure.
- name: Immunohistochemical panel
  description: >-
    Immunohistochemistry is the main adjunct to morphology, and is most valuable
    on small biopsies where architectural diversity cannot be appreciated. The
    discriminating result is the discordant p63-positive/p40-negative pattern; the
    supporting profile is CK7-positive, CK20-negative, S100-positive,
    vimentin-positive, SOX10-positive, GFAP-negative, with a low Ki-67 index.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:35507302
    reference_title: "Immunohistochemical Profile of Polymorphous Adenocarcinoma of Minor Salivary Gland: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of its architectural diversity, histological diagnosis of PAC can be
      difficult especially for small biopsies, and immunohistochemistry is of
      great help in differentiating it from its histologic mimics.
    explanation: >-
      Establishes immunohistochemistry as the adjunct that resolves the
      small-biopsy problem created by architectural diversity.
- name: PRKD1 hotspot sequencing
  description: >-
    Targeted sequencing of the PRKD1 exon 15 hotspot can be run on fine-needle
    aspiration material as well as resection specimens. It is perfectly specific
    but only moderately sensitive, so it confirms rather than excludes, and only
    the hotspot substitution counts.
  diagnosis_term:
    preferred_term: dideoxy chain termination DNA sequencing
    term:
      id: NCIT:C19641
      label: Dideoxy Chain Termination DNA Sequencing
  evidence:
  - reference: PMID:29266837
    reference_title: "The PRKD1 E710D hotspot mutation is highly specific in separating polymorphous adenocarcinoma of the palate from adenoid cystic carcinoma and pleomorphic adenoma on FNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The specificity of the PRKD1 hotspot mutation for identifying PAC among ACC
      and PA cases was 100% whereas the sensitivity was 50%.
    explanation: >-
      Quantifies the confirm-but-do-not-exclude character of hotspot sequencing as
      a diagnostic test.
- name: PRKD1/2/3 rearrangement testing
  description: >-
    Break-apart FISH detects the fusion class but leaves partners unidentified and
    misses some fusions; RNA-based next-generation sequencing is preferable in
    difficult cases because the partner repertoire is unusually wide. Relevant
    beyond diagnosis because fusion status tracks nodal risk.
  diagnosis_term:
    preferred_term: next generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:37595638
    reference_title: "Comprehensive Molecular Characterization of Polymorphous Adenocarcinoma, Cribriform Subtype: Identifying Novel Fusions and Fusion Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The wide variety of involved genes is unlike in other salivary gland
      malignancies and warrants a broader strategy of sequencing for molecular
      confirmation for particularly challenging cases, as our NGS study shows.
    explanation: >-
      Supports preferring broad sequencing over break-apart FISH for molecular
      confirmation in challenging cases.
genetic:
- name: PRKD1
  gene_term:
    preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic PRKD1 alterations are the principal driver. The p.Glu710Asp kinase
    domain hotspot mutation dominates conventional PAC; PRKD1 rearrangement is an
    alternative, mutually exclusive lesion enriched in the cribriform subtype.
    These are somatic events in a sporadic tumor, not germline predisposition.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In agreement with previous reports, PRKD1 E710D hotspot mutations were
      mutually exclusive with rearrangements in PRKD1/2/3
    explanation: >-
      Supports the two PRKD1 lesion classes being alternative rather than
      cooperating events in the same tumor.
  case_fractions:
  - population: Polymorphous low-grade adenocarcinoma (original discovery cohort)
    case_fraction_percent: 72.9
    notes: >-
      PRKD1 p.Glu710Asp hotspot mutation frequency in the study that identified
      the lesion.
    evidence:
    - reference: PMID:25240283
      reference_title: "Hotspot activating PRKD1 somatic mutations in polymorphous low-grade adenocarcinomas of the salivary glands."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified PRKD1 hotspot mutations encoding p.Glu710Asp in 72.9% of
        PLGAs but not in other salivary gland tumors.
      explanation: >-
        Directly reports the 72.9% hotspot mutation share in PLGA.
  - population: Conventional polymorphous adenocarcinoma, centrally reviewed cohort
    case_fraction_percent: 56.0
    cohort_size: 9
    notes: >-
      PRKD1 E710D frequency in histologically classic polymorphous adenocarcinoma
      (5/9), against 20% (2/10) in cribriform adenocarcinoma in the same cohort.
    evidence:
    - reference: PMID:31492931
      reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        polymorphous adenocarcinoma, cribriform adenocarcinoma, and tumor with
        indeterminate features harbored PRKD1 E710D hotspot mutations in 56%
        (5/9), 20% (2/10) and 43% (6/14) of cases, respectively
      explanation: >-
        Reports the per-subtype hotspot mutation shares including the 56% figure
        for conventional PAC.
- name: PRKD2
  gene_term:
    preferred_term: PRKD2
    term:
      id: hgnc:17293
      label: PRKD2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    PRKD2 rearrangement is an alternative driver lesion within the same pathway,
    detected in cribriform and indeterminate tumors and rarely in classic PAC.
    Somatic mutations in the PRKD2 kinase domain, by contrast, were not found in
    PRKD1-wild-type classic tumors, so PRKD2 contributes through rearrangement
    rather than point mutation.
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six additional cases each showed PRKD2 and PRKD3 rearrangements.
    explanation: >-
      Documents PRKD2 rearrangement as a recurrent lesion in this tumor family.
  - reference: PMID:26426580
    reference_title: "Lack of PRKD2 and PRKD3 kinase domain somatic mutations in PRKD1 wild-type classic polymorphous low-grade adenocarcinomas of the salivary gland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PLGAs lacking PRKD1 somatic mutations or PRKD gene family rearrangements are
      unlikely to harbour somatic mutations in the kinase domains of PRKD2 or
      PRKD3.
    explanation: >-
      Establishes that PRKD2 involvement is via rearrangement, not kinase domain
      point mutation.
- name: PRKD3
  gene_term:
    preferred_term: PRKD3
    term:
      id: hgnc:9408
      label: PRKD3
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    PRKD3 rearrangement is the third interchangeable driver lesion, functionally
    equivalent because PRKD3 shares pathway membership with PRKD1 and PRKD2. As
    with PRKD2, kinase domain point mutations were not found in PRKD1-wild-type
    classic tumors.
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As PRKD2 and PRKD3 share similar functions with PRKD1 in the diacylglycerol
      and protein kinase C signal transduction pathway, we expanded the
      investigation for these genes by FISH.
    explanation: >-
      Gives the pathway rationale for PRKD3 being an interchangeable driver.
- name: ARID1A
  gene_term:
    preferred_term: ARID1A
    term:
      id: hgnc:11110
      label: ARID1A
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  notes: >-
    ARID1A is the prototypical and, with ARID1B, the most common fusion partner
    for the PRKD genes. It contributes the regulatory context of the fusion rather
    than acting as an independent driver here.
  evidence:
  - reference: PMID:37595638
    reference_title: "Comprehensive Molecular Characterization of Polymorphous Adenocarcinoma, Cribriform Subtype: Identifying Novel Fusions and Fusion Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common partners for the PRKD genes were ARID1A and ARID1B.
    explanation: >-
      Identifies ARID1A among the two most common PRKD fusion partners.
- name: DDX3X
  gene_term:
    preferred_term: DDX3X
    term:
      id: hgnc:2745
      label: DDX3X
  relationship_type: COOPERATING
  variant_origin: SOMATIC
  notes: >-
    DDX3X was one of the two originally described PRKD1 fusion partners in
    cribriform adenocarcinoma.
  evidence:
  - reference: PMID:24942367
    reference_title: "Novel PRKD gene rearrangements and variant fusions in cribriform adenocarcinoma of salivary gland origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The RNAseq of 2 CAMSGs showed ARID1A-PRKD1 and DDX3X-PRKD1 fusions,
      respectively, while no fusion candidates were identified in two PLGAs.
    explanation: >-
      Documents DDX3X-PRKD1 as one of the two founding fusions of this entity.
treatments:
- name: Wide Surgical Excision
  description: >-
    Complete surgical excision with clear margins is the mainstay of treatment and
    is usually definitive: in the largest series, treatment with excision alone
    left about 97.6% of patients alive or dead without disease at an average of
    115 months. Sources differ on how wide is wide enough — one review specifies
    wide excision, while the 164-case series recommends conservative but complete
    excision — so the shared commitment is completeness of removal rather than a
    particular margin width.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Architecturally Polymorphous Infiltrative Growth
    treatment_effect: INHIBITS
    description: >-
      Resection with clear margins removes the infiltrative tumor mass; the
      unencapsulated advancing border is the reason wide rather than enucleating
      excision is required.
  evidence:
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The optimal treatment comprises wide surgical excision, often with adjuvant
      radiotherapy. In general, PAC has a good prognosis.
    explanation: >-
      Establishes wide surgical excision as the optimal primary treatment and the
      generally good prognosis.
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conservative but complete surgical excision is the treatment of choice for
      these slow-growing tumors with a low proliferation index; adjuvant therapy
      does not appear to alter the prognosis.
    explanation: >-
      The largest series names complete surgical excision as the treatment of
      choice, and is the source of the conservative-versus-wide tension noted in
      the description.
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At an average of 115.4 months after presentation, approximately 97.6% of all
      patients were either alive or had died without evidence of recurrent disease
      after treatment with surgical excision only.
    explanation: >-
      Quantifies the durability of excision alone, supporting surgery as usually
      definitive.
- name: Adjuvant Radiotherapy
  description: >-
    Radiotherapy is used adjunctively, conventionally for adverse features such as
    positive or close margins or recurrent disease. Its benefit is not
    established: one systematic review reports resection with adjuvant
    radiotherapy as conventional and effective with no documented tumor-related
    deaths, but the 164-case series states directly that adjuvant therapy does not
    appear to alter the prognosis, and reports about 97.6% freedom from disease
    after excision alone. Against so high a surgical cure rate there is little
    room for an adjuvant effect to show, so this entry records radiotherapy as
    conventionally used rather than as demonstrated to improve outcome.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:42438055
    reference_title: "Polymorphous Adenocarcinoma and Cribriform Adenocarcinoma of Salivary Glands (Cribriform Subtype of PAC): PRKD Mutation, Diagnosis, and Prognosis-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resection and adjuvant radiotherapy are the conventional and effective
      treatments, with no documented tumor-related deaths.
    explanation: >-
      Supports resection plus adjuvant radiotherapy as the conventional effective
      approach and documents the absence of tumor-related deaths.
  - reference: PMID:10421256
    reference_title: "Polymorphous low grade adenocarcinoma: a clinicopathologic study of 164 cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conservative but complete surgical excision is the treatment of choice for
      these slow-growing tumors with a low proliferation index; adjuvant therapy
      does not appear to alter the prognosis.
    explanation: >-
      The largest series finds no prognostic benefit from adjuvant therapy,
      directly opposing the claim that adjuvant radiotherapy improves outcome;
      recorded as REFUTE so the disagreement is machine-visible rather than
      averaged away in prose.
- name: Neck Dissection for Fusion-Positive or Cribriform Disease
  description: >-
    Regional lymph node dissection is considered when nodal risk is high, that is
    for cribriform-subtype or fusion-positive tumors, in which nodal metastasis is
    present in roughly half of cases at primary resection. This is the one place
    where subtype and genotype assignment changes surgical management, and it is
    the practical reason the one-entity versus two-entity question matters.
    Conventional hotspot-mutant palatal tumors do not warrant elective neck
    treatment on current evidence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: neck dissection
    term:
      id: NCIT:C15643
      label: Neck Dissection
  target_mechanisms:
  - target: Regional Lymph Node Metastasis
    treatment_effect: INHIBITS
    description: >-
      Neck dissection addresses established or high-risk regional nodal disease in
      the fusion-positive/cribriform group.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fusion-positive tumors, however, appear to be more aggressive clinically and
      may require additional treatments (e.g. neck dissection).
    explanation: >-
      Directly supports considering neck dissection specifically for
      fusion-positive tumors.
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these tumors likely comprise a significant portion of the cases of PAC with
      poor outcomes and are deserving of attention and consideration for
      escalation in oncologic treatment.
    explanation: >-
      Supports treatment escalation for the cribriform subgroup on the basis of
      its worse regional behaviour.
discussions:
- discussion_id: pac_prkd_wildtype_driver_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What drives the substantial minority of polymorphous adenocarcinomas that
    carry neither the PRKD1 hotspot mutation nor a PRKD1/2/3 rearrangement?
  attaches_to:
  - pathophysiology#Deregulated Protein Kinase D Signaling
  rationale: >-
    Roughly one fifth of tumors across the PAC spectrum have no detectable PRKD
    alteration, and the obvious candidate explanation has been actively excluded:
    kinase domain sequencing of PRKD2 and PRKD3 in PRKD1-wild-type classic tumors
    found no mutations. Whether these cases are driven by non-hotspot PRKD1
    lesions, by cryptic rearrangements missed by break-apart FISH, by epigenetic
    activation of the same pathway, or by a genuinely different mechanism is
    unresolved. This matters for the convergence claim in this entry: if the
    wild-type cases are driven by something other than protein kinase D, then PAC
    is not a single-pathway disease.
  proposed_experiments:
  - experiment_id: exp_pac_wgs_rnaseq_prkd_wildtype
    name: Whole-genome and RNA sequencing of PRKD-wild-type PAC
    description: >-
      Apply whole-genome and RNA sequencing to tumors lacking both the PRKD1
      hotspot mutation and PRKD1/2/3 rearrangements, which prior studies could not
      do for want of frozen material, to detect non-hotspot PRKD1 variants,
      cryptic fusions, and alternative drivers.
  - experiment_id: exp_pac_pathway_activity_readout
    name: Direct protein kinase D pathway activity readout across genotypes
    description: >-
      Measure protein kinase D substrate phosphorylation in hotspot-mutant,
      fusion-positive, and wild-type tumors to test whether wild-type cases
      nonetheless show pathway activation, which would support convergence by a
      non-genetic route.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not identify genetic alterations in PRKD genes in 21.6% (n=7) of the
      cases studied.
    explanation: >-
      Quantifies the PRKD-wild-type fraction that constitutes this gap.
  - reference: PMID:26426580
    reference_title: "Lack of PRKD2 and PRKD3 kinase domain somatic mutations in PRKD1 wild-type classic polymorphous low-grade adenocarcinomas of the salivary gland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further studies are warranted to define the driver genetic events
    explanation: >-
      The study that excluded PRKD2/PRKD3 kinase domain mutations explicitly
      leaves the driver of these cases undefined.
- discussion_id: pac_casg_entity_boundary
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Should cribriform adenocarcinoma of salivary gland be curated as a subtype of
    polymorphous adenocarcinoma or as a separate disease entity?
  attaches_to:
  - pathophysiology#Regional Lymph Node Metastasis
  rationale: >-
    This entry follows the WHO classification and NCIT in modeling cribriform
    adenocarcinoma as a subtype, and records the competing reading as an
    ALTERNATIVE mechanistic hypothesis rather than silently resolving it. The
    disagreement is empirically grounded on both sides: shared PRKD genotype and a
    continuum of indeterminate cases favour one spectrum, while different primary
    site, different lesion class, and a roughly ten-fold difference in nodal
    metastasis rate favour two entities. It is also not purely academic, because
    nodal risk determines whether neck dissection is considered. Should dismech
    later split these into separate Disease entries, the natural structure would be
    two entries plus a Grouping with SHARED_PATHWAY basis.
  evidence:
  - reference: PMID:29761209
    reference_title: "Polymorphous adenocarcinoma of the salivary glands: reappraisal and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, PAC was referred to as polymorphous low-grade adenocarcinoma
      (PLGA), but the new WHO classification of salivary gland tumours has also
      included under the PAC subheading, the so-called cribriform adenocarcinoma
      of minor salivary glands (CAMSG).
    explanation: >-
      Documents the WHO decision this entry follows in treating cribriform
      adenocarcinoma as a subtype.
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, histologic grade was removed from salivary tumor nomenclature by
      the WHO to include disease of higher grade.
    explanation: >-
      Explains why "low-grade" was dropped from the name: the entity as now
      defined admits higher-grade disease, which is the same widening that
      brought cribriform adenocarcinoma under the PAC heading.
  - reference: PMID:34023291
    reference_title: "How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate to Polymorphous Adenocarcinoma and Survival: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One such entity, cribriform adenocarcinoma (CAC), is an aggressive group of
      polymorphous adenocarcinoma (PAC), with frequent nodal metastasis and
      locoregional recurrence.
    explanation: >-
      Characterises cribriform adenocarcinoma as an aggressive group within PAC;
      counted as PARTIAL because the source adopts the subtype reading rather
      than adjudicating between the one-entity and two-entity models.
- discussion_id: pac_prkd_prognostic_significance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do PRKD alterations carry independent prognostic information, or are they only
    diagnostic and subtype-defining markers?
  attaches_to:
  - pathophysiology#Regional Lymph Node Metastasis
  rationale: >-
    Fusion status correlates strongly with nodal metastasis, yet recurrence-free
    survival did not differ between fusion-positive and mutation-positive tumors
    in the cohort where that comparison was made, and the authors attribute this to
    limited power given how rare recurrence is. A recent systematic review
    concludes that the prognostic significance of PRKD alterations remains
    inconclusive while their diagnostic value is established. Because
    tumor-related death is essentially absent, any prognostic endpoint must be
    regional control or recurrence rather than survival, which makes adequately
    powered studies difficult.
  proposed_experiments:
  - experiment_id: exp_pac_multicentre_genotype_outcome
    name: Multicentre genotype-stratified outcome study with regional-control endpoints
    description: >-
      Pool genotyped PAC-spectrum cases across centres with sufficient follow-up
      to test whether PRKD lesion class predicts regional recurrence and
      nodal relapse independently of histologic subtype and papillary proportion.
  evidence:
  - reference: PMID:42438055
    reference_title: "Polymorphous Adenocarcinoma and Cribriform Adenocarcinoma of Salivary Glands (Cribriform Subtype of PAC): PRKD Mutation, Diagnosis, and Prognosis-A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRKD alterations serve primarily as diagnostic markers, and their prognostic
      significance remains inconclusive.
    explanation: >-
      A systematic review states directly that the prognostic role is unresolved
      while the diagnostic role is established.
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our study may have a limited statistical power to assess the prognostic
      significance of PRKD1 E710D hotspot mutations or PRKD1/2/3 rearrangements in
      predicting clinical outcomes
    explanation: >-
      The authors explicitly identify limited power as the reason the prognostic
      question is unresolved.
- discussion_id: pac_no_model_systems_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is there no experimental model of polymorphous adenocarcinoma, and what
    would one have to reproduce to be useful?
  attaches_to:
  - pathophysiology#Deregulated Protein Kinase D Signaling
  - pathophysiology#Architecturally Polymorphous Infiltrative Growth
  rationale: >-
    This entry carries no experimental_models, animal_models, or
    computational_models, and that is a statement about the field rather than an
    omission in curation: no established cell line, organoid, or genetically
    engineered animal model of PAC is in routine use. The consequence is visible
    in the pathograph itself — the step from protein kinase D activation to the
    tumor's characteristic multipattern architecture is
    INDIRECT_UNKNOWN_INTERMEDIATES precisely because there is no system in which
    to interrogate it. Even primary material is scarce: the study that defined the
    PRKD-wild-type subset could not pursue it for want of frozen tissue. A useful
    model would need to reproduce the defining dissociation of architectural
    diversity from cytological uniformity, not merely express the mutant kinase.
  proposed_experiments:
  - experiment_id: exp_pac_e710d_salivary_organoid
    name: PRKD1 E710D knock-in salivary gland organoids
    description: >-
      Introduce the E710D hotspot substitution into human salivary gland
      epithelial organoids and test whether activated protein kinase D alone
      produces multipattern architecture with retained cytological uniformity, or
      whether additional context is required.
  - experiment_id: exp_pac_fusion_vs_hotspot_comparison
    name: Side-by-side fusion versus hotspot models of nodal propensity
    description: >-
      Build matched models carrying a PRKD fusion and the PRKD1 hotspot mutation
      and compare invasive and lymphatic behaviour, to test whether the 50%
      versus 0% nodal metastasis difference is intrinsic to the lesion class
      rather than a correlate of tumor site.
  - experiment_id: exp_pac_conditional_knockin_mouse
    name: Conditional salivary-epithelial Prkd1 E710D knock-in mouse
    description: >-
      Restrict expression of the activating allele to salivary gland epithelium to
      test whether a whole-organism model develops an indolent, neurotropic
      palatal tumor resembling human PAC.
  evidence:
  - reference: PMID:31492931
    reference_title: "Histologic spectrum of polymorphous adenocarcinoma of the salivary gland harbor genetic alterations affecting PRKD genes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      regrettably, representative frozen samples from these PRKD1/2/3 wild-type
      tumors were unavailable
    explanation: >-
      Documents that even primary tissue is limiting for mechanistic follow-up in
      this tumor; PARTIAL because it evidences scarcity of material rather than
      the absence of model systems as such, which is an absence no single
      publication asserts.
- discussion_id: pac_mondo_term_gap
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    MONDO lacks a class for polymorphous adenocarcinoma, so what should anchor
    disease_term?
  rationale: >-
    Searching MONDO labels and exact synonyms returns no polymorphous
    adenocarcinoma class, and no MONDO term cross-references NCIT:C35702 or its
    parent NCIT:C8021 (Salivary Gland Adenocarcinoma). disease_term is therefore
    anchored to the nearest MONDO superclass, salivary gland carcinoma
    (MONDO:0000521), with exact identity carried in ncit_mappings as
    skos:exactMatch. This is a deliberate broadMatch-by-necessity, not an
    assertion of equivalence between PAC and salivary gland carcinoma. A MONDO
    term request for polymorphous adenocarcinoma, with the two NCIT subtypes,
    would let disease_term be tightened.
  evidence:
  - reference: PMID:29266837
    reference_title: "The PRKD1 E710D hotspot mutation is highly specific in separating polymorphous adenocarcinoma of the palate from adenoid cystic carcinoma and pleomorphic adenoma on FNA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PAC demonstrates cytological overlap with 2 other salivary gland tumors
      frequently encountered in the same location, namely ACC and pleomorphic
      adenoma (PA).
    explanation: >-
      Establishes that PAC is a distinct entity requiring separation from named
      mimics, which is why a dedicated ontology class is warranted rather than
      reliance on a broad parent.

mappings:
  ncit_mappings:
  - term:
      id: NCIT:C35702
      label: Salivary Gland Polymorphous Adenocarcinoma
    mapping_predicate: skos:exactMatch
    mapping_source: NCIT
    mapping_justification: >-
      NCIT is the only ontology in the dismech constrained set that codes this
      entity. MONDO has no polymorphous adenocarcinoma class (searched labels and
      exact synonyms), so disease_term is anchored to the nearest MONDO
      superclass, salivary gland carcinoma, and exact entity identity is carried
      here. The MONDO gap is recorded as an open discussion.
description: >-
  Polymorphous adenocarcinoma (PAC) is a low-grade malignant epithelial neoplasm
  of salivary gland origin with a striking predilection for the minor salivary
  glands of the palate. It is probably the second most common malignancy of the
  minor salivary glands, after adenoid cystic carcinoma (ACC). The name refers to
  architectural, not cytological, diversity: a single tumor displays tubular,
  trabecular, cribriform, papillary, solid, and single-file patterns and
  characteristically streams into concentric whorls around nerves, while the
  constituent cells remain bland and monomorphic. That combination of cytological
  uniformity with architectural variability is the diagnostic signature, and the
  basis for separating PAC from ACC and pleomorphic adenoma, which occupy the same
  anatomic site and overlap cytologically. Most conventional PAC is driven by a
  recurrent activating hotspot mutation in PRKD1 (p.Glu710Asp), while
  rearrangements of PRKD1, PRKD2, or PRKD3 characterize the cribriform subtype;
  the two lesion classes are mutually exclusive and converge on deregulated
  protein kinase D signaling, placing PAC among the tumors defined by a single
  pathway rather than a single mutation. Behavior is indolent, with frequent
  perineural invasion that does not carry the adverse prognostic weight it does in
  ACC, low rates of distant metastasis, and very low disease-specific mortality
  (pooled series report figures from around 3% down to none). The principal
  clinically actionable split within the entity is
  nodal risk: fusion-positive/cribriform tumors metastasize to neck nodes at a
  much higher rate than hotspot-mutant/classic tumors.
synonyms:
- PAC
- polymorphous adenocarcinoma
- polymorphous low-grade adenocarcinoma
- PLGA
- terminal duct adenocarcinoma
- PmA

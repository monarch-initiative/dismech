    reference_title: Identification of a Tbx1/Tbx2/Tbx3 genetic pathway governing pharyngeal and arterial pole morphogenesis.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "whereas Tbx2 and Tbx3 function redundantly upstream of Tbx1 and Hh ligand expression in pharyngeal endoderm"
    explanation: Places Tbx2 upstream of Tbx1, the major 22q11.2 deletion gene, in pharyngeal endoderm.
  - reference: PMID:22116936
    reference_title: Identification of a Tbx1/Tbx2/Tbx3 genetic pathway governing pharyngeal and arterial pole morphogenesis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of two of the three genes results in severe pharyngeal hypoplasia and heart tube extension defects"
    explanation: Compound loss of Tbx2 with Tbx1 or Tbx3 causes pharyngeal hypoplasia in mice; applying this to human TBX2 heterozygosity is an inference step.
  downstream:
  - target: Impaired Thymus Development
    causal_link_type: DIRECT
  - target: Hypoparathyroidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Abnormal Outflow Tract and Atrioventricular Canal Morphogenesis
  description: >-
    Tbx2 is expressed in non-chamber myocardium of the outflow tract and
    atrioventricular canal, where it represses chamber differentiation. Tbx2-null
    mice have atrioventricular canal patterning defects and defective
    outflow-tract septation, and Tbx2/Tbx3 compound mutants fail to form
    atrioventricular cushions, the precursors of valves and septa. These
    requirements match the conotruncal (double outlet right ventricle), septal,
    arterial-pole, and valvular defects reported in patients. Heterozygous null
    mice appear normal, so the patient defects imply that the human missense
    alleles fall below a dosage threshold the mouse heterozygote does not reach,
    or interact with other loci.
  biological_scale: TISSUE

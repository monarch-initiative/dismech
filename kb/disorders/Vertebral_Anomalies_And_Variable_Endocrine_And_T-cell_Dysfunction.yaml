- name: Impaired Palatal Shelf Outgrowth
  description: >-
    Tbx2 is expressed in palatal shelf mesenchyme. Tbx2-null mice and
    Tbx2/Tbx3 double heterozygotes have cleft palate because the palatal
    shelves form but are small, grow slowly and fail to meet, with increased
    proliferation, apoptosis and Bmp4 and Cyclin D1 expression in the shelves.

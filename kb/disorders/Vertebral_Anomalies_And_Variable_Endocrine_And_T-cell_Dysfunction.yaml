- name: Abnormal Vertebral Segmentation
  description: >-
    Patients have congenital vertebral segmentation and fusion defects
    (Klippel-Feil anomaly, thoracic fusions, hemivertebrae, rib fusions, and
    Sprengel deformity) with secondary scoliosis and kyphosis. TBX2 is expressed
    in developing bone and cartilage, but no model has shown how reduced TBX2
    dosage disrupts somite segmentation or vertebral formation. This node
    records the human observation; its upstream link to TBX2 rests on the
    genotype-phenotype association.
  biological_scale: TISSUE

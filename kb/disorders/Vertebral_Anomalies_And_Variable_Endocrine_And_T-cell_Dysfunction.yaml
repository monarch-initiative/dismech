    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.R20Q variant is shared by three affected family members in an autosomal dominant manner; the fourth unrelated individual has a de novo p.R305H mutation."
    explanation: Establishes autosomal dominant transmission and de novo occurrence of heterozygous TBX2 variants in the defining cohort.
prevalence:
- population: Published literature worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The phenotype was defined from four individuals in two families. No
    population-based prevalence estimate exists.
  evidence:
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report four individuals with an overlapping spectrum of craniofacial dysmorphisms, cardiac anomalies, skeletal malformations, immune deficiency, endocrine abnormalities and developmental impairments, reminiscent of DiGeorge syndrome, who are heterozygotes for TBX2 variants."
    explanation: The defining report describes four affected individuals, placing the disorder in the ultra-rare, literature-case range.
pathophysiology:
- name: TBX2 Partial Loss of Function
  description: >-
    Heterozygous missense variants p.Arg20Gln (N-terminal) and p.Arg305His
    (near the T-box) reduce TBX2 protein levels and its transcriptional
    repressor activity, and behave as partial loss-of-function (hypomorphic)
    alleles in Drosophila heterologous expression assays. The disorder is
    therefore attributed to reduced TBX2 dosage during embryonic development.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TBX2
    term:
      id: hgnc:11597
      label: TBX2
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "In vitro transcriptional assays in cultured cells show that both variants result in reduced transcriptional repressor activity of TBX2. We also show that the variants result in reduced protein levels of TBX2."
    explanation: Cell-based assays show both patient variants reduce TBX2 repressor activity and protein abundance.
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterologous over-expression studies in Drosophila demonstrate that both p.R20Q and p.R305H function as partial loss-of-function alleles."
    explanation: In vivo Drosophila assays classify both variants as hypomorphic (partial loss-of-function) alleles.
  downstream:
  - target: Impaired Pharyngeal Apparatus Development
    causal_link_type: DIRECT
  - target: Abnormal Outflow Tract and Atrioventricular Canal Morphogenesis
    causal_link_type: DIRECT
  - target: Impaired Palatal Shelf Outgrowth
    causal_link_type: DIRECT
  - target: Abnormal Vertebral Segmentation
- name: Impaired Pharyngeal Apparatus Development
  description: >-
    In the mouse, Tbx2 and Tbx3 act redundantly upstream of Tbx1 and hedgehog
    ligand expression in pharyngeal endoderm, and loss of two of the three
    genes produces severe pharyngeal hypoplasia. The pharyngeal pouches give
    rise to the thymus and parathyroid glands, so reduced TBX2 dosage is
    proposed to produce the DiGeorge-like thymic and parathyroid deficits seen
    in patients. That the human thymic aplasia arises this way is an inference
    from the mouse network, not a direct observation.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: pharyngeal system development
    modifier: DECREASED
    term:
      id: GO:0060037
      label: pharyngeal system development
  evidence:
  - reference: PMID:22116936
    reference_title: Identification of a Tbx1/Tbx2/Tbx3 genetic pathway governing pharyngeal and arterial pole morphogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "whereas Tbx2 and Tbx3 function redundantly upstream of Tbx1 and Hh ligand expression in pharyngeal endoderm"
    explanation: Places Tbx2 upstream of Tbx1, the major 22q11.2 deletion gene, in pharyngeal endoderm.
  - reference: PMID:22116936
    reference_title: Identification of a Tbx1/Tbx2/Tbx3 genetic pathway governing pharyngeal and arterial pole morphogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "loss of two of the three genes results in severe pharyngeal hypoplasia and heart tube extension defects"
    explanation: Compound loss of Tbx2 with Tbx1 or Tbx3 causes pharyngeal hypoplasia in mice; applying this to human TBX2 heterozygosity is an inference step.
  downstream:
  - target: Impaired Thymus Development
  - target: Hypoparathyroidism
- name: Abnormal Outflow Tract and Atrioventricular Canal Morphogenesis
  description: >-
    Tbx2 is expressed in non-chamber myocardium of the outflow tract and
    atrioventricular canal, where it represses chamber differentiation. Tbx2-null
    mice have atrioventricular canal patterning defects and defective
    outflow-tract septation, and Tbx2/Tbx3 compound mutants fail to form
    atrioventricular cushions, the precursors of valves and septa. These
    requirements match the conotruncal (double outlet right ventricle), septal
    and valvular defects reported in patients. Heterozygous null mice appear
    normal, so the patient defects imply that the human missense alleles fall
    below a dosage threshold the mouse heterozygote does not reach, or interact
    with other loci.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: outflow tract septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003148
      label: outflow tract septum morphogenesis
  - preferred_term: atrioventricular valve morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003181
      label: atrioventricular valve morphogenesis
  - preferred_term: pulmonary valve morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003184
      label: pulmonary valve morphogenesis
  evidence:
  - reference: PMID:15459098
    reference_title: Tbx2 is essential for patterning the atrioventricular canal and for morphogenesis of the outflow tract during heart development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphological defects are observed in development of the atrioventricular canal and septation of the outflow tract."
    explanation: Tbx2-null embryos show atrioventricular canal and outflow-tract septation defects, the cardiac structures affected in patients.
  - reference: PMID:22130515
    reference_title: Tbx2 and Tbx3 induce atrioventricular myocardial development and endocardial cushion formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutant mice lacking 3 or 4 functional alleles of Tbx2 and Tbx3 failed to form atrioventricular cushions, precursors of the valves and septa"
    explanation: Shows Tbx2 dosage, together with Tbx3, is required for the cushions that form cardiac valves and septa.
  downstream:
  - target: Conotruncal Heart Defects
  - target: Atrial septal defect
  - target: Pulmonic stenosis
- name: Impaired Palatal Shelf Outgrowth
  description: >-
    Tbx2 is expressed in palatal shelf mesenchyme. Tbx2-null mice and
    Tbx2/Tbx3 double heterozygotes have cleft palate because the palatal
    shelves form but are small, grow slowly and fail to meet, with increased
    proliferation, apoptosis and Bmp4 and Cyclin D1 expression in the shelves.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: secondary palate development
    modifier: DECREASED
    term:
      id: GO:0062009
      label: secondary palate development
  evidence:
  - reference: PMID:19769959
    reference_title: Expression and requirement of T-box transcription factors Tbx2 and Tbx3 during secondary palate development in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous mutant for Tbx2 and mice double heterozygous for Tbx2 and Tbx3 exhibit a cleft palate phenotype arguing for an important contribution of Tbx2 and Tbx3 to palatogenesis."
    explanation: Establishes that reduced Tbx2 dosage causes cleft palate in mice.
  - reference: PMID:19769959
    reference_title: Expression and requirement of T-box transcription factors Tbx2 and Tbx3 during secondary palate development in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Tbx2-deficient embryos, the bilateral primordial palatal shelves form but are smaller and retarded in the outgrowth process. They do not make contact but retain the potential to fuse."
    explanation: Identifies the step at which Tbx2 deficiency disrupts palatogenesis.
  downstream:
  - target: Cleft palate
  - target: High palate
- name: Abnormal Vertebral Segmentation
  description: >-
    Patients have congenital vertebral segmentation and fusion defects
    (Klippel-Feil anomaly, thoracic fusions, hemivertebrae, rib fusions) with
    secondary scoliosis and kyphosis. TBX2 is expressed in developing bone and
    cartilage, but no model has shown how reduced TBX2 dosage disrupts somite
    segmentation or vertebral formation. This node records the human
    observation; its upstream link to TBX2 rests only on the genotype-phenotype
    association.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: embryonic skeletal system morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
  evidence:
  - reference: PMID:35311234
    reference_title: A Novel Osteochondrodysplasia With Empty Sella Associates With a TBX2 Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The other three individuals harbored a variant p.Arg20Gln and similarly had multi-organ defects, facial dysmorphisms and cleft palate, Klippel–Feil vertebral anomalies and congenital absence of the thymus"
    explanation: Summarizes the vertebral segmentation (Klippel-Feil) anomalies in the p.Arg20Gln family from the defining report.
  downstream:
  - target: Vertebral fusion
  - target: Hemivertebrae
  - target: Rib fusion
  - target: Scoliosis
  - target: Kyphosis
- name: Impaired Thymus Development
  description: >-
    The thymus fails to form in the p.Arg20Gln family. Because the thymus is
    the site of T-cell maturation, its absence is the presumed basis of the
    immune deficiency named in the disorder. The defining report describes
    Individual 1 as lacking a thymus and functional T cells; numeric T-cell
    counts are not given in its main text.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: thymus development
    modifier: DECREASED
    term:
      id: GO:0048538
      label: thymus development
  evidence:
  - reference: PMID:35311234
    reference_title: A Novel Osteochondrodysplasia With Empty Sella Associates With a TBX2 Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Klippel–Feil vertebral anomalies and congenital absence of the thymus"
    explanation: Reports congenital thymic absence in the p.Arg20Gln family.
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "congenital absence of the thymus and lack of functional T cells"
    explanation: The defining report describes the p.R20Q proband (Individual 1) as having no thymus and no functional T cells.
  downstream:
  - target: Aplasia of the thymus
  - target: Immunodeficiency

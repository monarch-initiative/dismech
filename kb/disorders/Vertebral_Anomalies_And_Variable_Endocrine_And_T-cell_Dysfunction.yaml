pathophysiology:
- name: TBX2 Partial Loss of Function
  description: >-
    Heterozygous missense variants p.Arg20Gln (N-terminal) and p.Arg305His
    (near the T-box) reduce TBX2 protein levels and its transcriptional
    repressor activity, and behave as partial loss-of-function (hypomorphic)
    alleles in Drosophila heterologous expression assays. The disorder is
    therefore attributed to reduced TBX2 dosage during embryonic development.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TBX2
    term:
      id: hgnc:11597
      label: TBX2
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "In vitro transcriptional assays in cultured cells show that both variants result in reduced transcriptional repressor activity of TBX2. We also show that the variants result in reduced protein levels of TBX2."
    explanation: Cell-based assays show both patient variants reduce TBX2 repressor activity and protein abundance.
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterologous over-expression studies in Drosophila demonstrate that both p.R20Q and p.R305H function as partial loss-of-function alleles."
    explanation: In vivo Drosophila assays classify both variants as hypomorphic (partial loss-of-function) alleles.

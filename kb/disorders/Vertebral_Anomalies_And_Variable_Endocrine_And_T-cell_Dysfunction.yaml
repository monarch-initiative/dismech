name: Vertebral Anomalies And Variable Endocrine And T-cell Dysfunction
synonyms:
- VETD
- TBX2-related multisystem developmental disorder
creation_date: '2026-10-15T15:10:30Z'
category: Mendelian
description: >-
  Vertebral anomalies and variable endocrine and T-cell dysfunction (VETD; OMIM
  618223) is an ultra-rare autosomal dominant multisystem developmental disorder
  caused by heterozygous partial loss-of-function missense variants in TBX2, a
  T-box transcriptional repressor. It was defined from four individuals (a
  three-member family carrying p.Arg20Gln and an unrelated person with de novo
  p.Arg305His) whose findings overlap the 22q11.2 deletion (DiGeorge) spectrum:
  vertebral segmentation and fusion defects with scoliosis and kyphosis,
  craniofacial dysmorphism with cleft or high-arched palate, conotruncal and
  septal heart defects, thymic aplasia with immune deficiency, and variable
  endocrine dysfunction (hypoparathyroidism, autoimmune thyroiditis, growth
  hormone deficiency), with variable neurodevelopmental involvement. Mouse
  genetics place Tbx2 upstream of Tbx1 in pharyngeal endoderm and require it for
  outflow-tract, atrioventricular-canal and palatal-shelf development, which
  may account for the DiGeorge-like pattern. How TBX2 deficiency produces the
  vertebral defects is not established.

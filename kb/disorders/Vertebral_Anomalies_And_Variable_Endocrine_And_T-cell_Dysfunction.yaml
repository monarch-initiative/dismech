genetic:
- name: TBX2
  gene_term:
    preferred_term: TBX2
    term:
      id: hgnc:11597
      label: TBX2
  association: Heterozygous partial loss-of-function variants
  relationship_type: CAUSATIVE
  notes: >-
    Reported causal variants are p.Arg20Gln (inherited, three relatives) and
    p.Arg305His (de novo). No ClinGen gene-disease validity assertion exists
    for TBX2 and this disease, and the defining report calls TBX2 a candidate
    gene. CAUSATIVE records that TBX2 variants define this disease (OMIM
    618223), not a ClinGen Definitive or Strong validity tier. Other heterozygous TBX2 variants have been
    reported with different phenotypes that are not curated here: p.Thr300Met
    in an autosomal dominant osteochondrodysplasia with empty sella
    (PMID:35311234), a de novo p.Lys177* nonsense variant in severe
    chondrodysplasia with developmental delay (PMID:36733940), and frameshift
    variants in progressive sensorineural hearing loss with variable nystagmus
    (PMID:40962492).
  evidence:
  - reference: PMID:29726930
    reference_title: Functional variants in TBX2 are associated with a syndromic cardiovascular and skeletal developmental disorder.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, these and other data suggest that TBX2 is a novel candidate gene for a new multisystem malformation disorder."
    explanation: The defining study proposes TBX2 as the causal gene. The claim is candidate-level and rests on four individuals, which is why the relationship carries no validity tier.
animal_models:
- name: Tbx2 null mouse
  species: Mouse
  genotype: Tbx2 targeted null allele
  publication: PMID:15459098
  description: >-
    Homozygous Tbx2-null embryos have atrioventricular canal and outflow-tract
    septation defects and hindlimb digit anomalies; heterozygotes appear normal.
  modeled_mechanisms:
  - target: Abnormal Outflow Tract and Atrioventricular Canal Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Reproduces the cardiac developmental defects seen in patients, but only in the homozygous null.
    limitations: >-
      Patients are heterozygous for hypomorphic missense alleles, whereas mouse
      heterozygotes for a null allele appear normal, so the model shows that
      Tbx2 is required but not the human dosage threshold.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cardiac phenotype appears only in homozygous null mice, while one
        hypomorphic allele causes disease in humans, so mouse and human differ
        in their sensitivity to Tbx2 dosage.
    evidence:
    - reference: PMID:15459098
      reference_title: Tbx2 is essential for patterning the atrioventricular canal and for morphogenesis of the outflow tract during heart development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice heterozygous for a Tbx2 null mutation appear normal but homozygous embryos reveal a crucial role for Tbx2 during cardiac development."
      explanation: States both the cardiac requirement and the normal heterozygote, which limits the model's fidelity to the heterozygous human disorder.

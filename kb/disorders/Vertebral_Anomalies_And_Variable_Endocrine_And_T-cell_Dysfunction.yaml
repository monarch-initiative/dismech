discussions:
- discussion_id: vetd_tbx2_dosage_mouse_mismatch
  prompt: >-
    Patients carry one partial loss-of-function TBX2 allele, yet mice
    heterozygous for a Tbx2 null allele appear normal. Is the human phenotype
    caused by a lower dosage threshold, a dominant effect of the missense
    proteins, or interaction with other loci such as TBX3 or TBX1?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#TBX2 Partial Loss of Function
  - animal_models#Mouse
  rationale: >-
    The proposed mechanism is reduced TBX2 dosage, but the only mouse genotypes
    that show the cardiac, palatal and pharyngeal defects are the homozygous
    null or compound Tbx2/Tbx3 or Tbx1/Tbx2 genotypes.
- discussion_id: vetd_vertebral_mechanism_gap
  prompt: >-
    How does reduced TBX2 dosage cause vertebral fusion and hemivertebrae? No
    model has linked Tbx2 to somite segmentation or vertebral body formation.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Vertebral Segmentation
  rationale: >-
    Vertebral anomalies name the disorder, but the pathograph node for them has
    no mechanistic upstream support beyond the genotype-phenotype association
    in four individuals.
notes: >-
  No GeneReviews chapter covers this disorder. Most clinical features are
  quoted from the comparison table and discussion of PMID:35311234, a full-text
  article that summarizes the patients of the defining report (PMID:29726930).
  The defining report's full text is cached; it gives immune findings only
  qualitatively and does not report the outcome of the thymic transplant, so
  the treatment is recorded without an efficacy claim. Its supplementary text,
  which holds the detailed immune evaluations, was not available.

name: Mandibular Hypoplasia, Deafness, Progeroid Features, and Lipodystrophy Syndrome
creation_date: "2026-11-13T04:30:00Z"
category: Mendelian
description: >-
  Mandibular hypoplasia, deafness, progeroid features, and lipodystrophy
  syndrome (MDPL; OMIM 615381) is an ultra-rare autosomal dominant segmental
  progeroid disorder caused by heterozygous, usually de novo, variants in
  POLD1, which encodes the catalytic p125 subunit of DNA polymerase delta, the
  lagging-strand replicative polymerase. Most patients carry the recurrent
  in-frame deletion c.1812_1814del (p.Ser605del) in motif A of the polymerase
  active site; this allele abolishes DNA polymerase activity while largely
  preserving the 3'-5' proofreading exonuclease. A smaller group carries
  missense variants (p.Arg507Cys, p.Arg507His, and a cluster in the C-terminal
  CysB zinc-finger region), usually with a milder, atypical presentation.

  Children are of normal birth weight. Progressive loss of subcutaneous fat
  begins in childhood and evolves from partial to generalized lipodystrophy
  with relative preservation or increase of visceral fat, and is accompanied
  by insulin resistance, hypertriglyceridemia, hepatic steatosis and, in a
  third to a half of patients, diabetes mellitus. The facial gestalt combines
  mandibular hypoplasia, a beaked nose, prominent eyes, a small mouth and
  crowded teeth. Sensorineural hearing loss usually begins in the first or
  second decade. Males have undescended testes and primary hypogonadism;
  females often have poor breast development. Scleroderma-like skin tightening,
  telangiectasia, joint contractures, reduced limb muscle mass and osteoporosis
  are common. No cancer predisposition has been established, in contrast to
  POLD1 exonuclease-domain variants, which cause polyposis and colorectal and
  endometrial cancer predisposition.

  Patient fibroblasts and induced pluripotent stem cell-derived mesenchymal
  stem cells show the cellular hallmarks of the progeroid laminopathies and of
  DNA repair disorders: nuclear envelope abnormalities, prelamin A
  accumulation, micronuclei, slowed proliferation with G0/G1 arrest, cellular
  senescence, delayed repair of induced DNA damage, accelerated telomere
  shortening and mitochondrial dysfunction. How a ubiquitously required
  polymerase defect produces the selective adipose, cochlear, gonadal and
  craniofacial phenotype is not established.

      reference_title: "POLD1 / mandibular hypoplasia-deafness-progeroid syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "POLD1 | HGNC:9175 | mandibular hypoplasia-deafness-progeroid syndrome | MONDO:0014157 | AD | Definitive"
      explanation: ClinGen Monogenic Diabetes GCEP classification, 2025.
  variants:
  - name: c.1812_1814del (p.Ser605del)
    description: >-
      Recurrent in-frame deletion of one serine in motif A of the polymerase
      active site, arising de novo; it accounts for most cases and gives the
      typical, more severe phenotype. The mutant enzyme has no detectable
      polymerase activity and largely preserved exonuclease activity.
    evidence:
    - reference: PMID:23770608
      reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An in-frame deletion (c.1812_1814del, p.S605del) of a single serine residue in the polymerase active site of POLD1 was identified in both probands but in none of their four parents."
      explanation: Gene discovery.
    - reference: PMID:41742372
      reference_title: Genotype-phenotype heterogeneity among patients with lipodystrophy harboring rare POLD1 variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals with the heterozygous POLD1 p.Ser605del variant had typical MDPL with more severe phenotype compared to those with missense variants with atypical MDPL."
      explanation: Genotype-phenotype correlation.
  - name: c.1519C>T (p.Arg507Cys)
    description: >-
      Recurrent missense variant away from the polymerase active site; found
      in sporadic and familial cases and in patients first diagnosed with
      Werner syndrome.
    evidence:
    - reference: PMID:25131834
      reference_title: Identification of a novel mutation in the polymerase delta 1 (POLD1) gene in a lipodystrophic patient affected by mandibular hypoplasia, deafness, progeroid features (MDPL) syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis of the entire coding region of the POLD1 gene, disclosed a novel heterozygous mutation in exon 13 (R507C)."
      explanation: First report of the allele.
  - name: CysB-region missense variants (p.Gln1062Arg, p.Ile1070Asn, p.Thr1072Pro, p.Ser1073Arg)
    description: >-
      De novo missense variants in the C-terminal CysB zinc-finger region that
      binds an iron-sulphur cluster. Severity ranges from mild
      (p.Ser1073Arg) to a very severe progeria-like presentation
      (p.Ile1070Asn).
    evidence:
    - reference: PMID:28521875
      reference_title: Exome sequencing reveals a de novo POLD1 mutation causing phenotypic variability in mandibular hypoplasia, deafness, progeroid features, and lipodystrophy syndrome (MDPL).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "predicted to cause the missense change p.Ile1070Asn in the ZnF2 (Zinc Finger 2) domain of the protein"
      explanation: Severe de novo CysB variant.
    - reference: PMID:35590056
      reference_title: Mild MDPL in a patient with a novel de novo missense variant in the Cys-B region of POLD1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report concerns a novel de novo missense variant in the CysB region, c.3219 G > C, (p.(Ser1073Arg)) in a male child with a milder phenotype."
      explanation: Mild de novo CysB variant.
    - reference: PMID:34517090
      reference_title: Child to adulthood clinical description of MDPL syndrome due to a novel variant in POLD1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a novel de novo c.3214A>C p.(Thr1072Pro) variant in POLD1 in a 28-year-old male with MDPL syndrome."
      explanation: Further de novo CysB variant.
    - reference: PMID:36280868
      reference_title: A likely pathogenic POLD1 variant associated with mandibular hypoplasia, deafness, progeroid features, and lipodystrophy syndrome in a Chinese patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing and bioinformatics analysis revealed a de novo missense variant in the POLD1 gene"
      explanation: De novo p.Gln1062Arg in a Chinese child.
  evidence:
  - reference: PMID:23770608
    reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation causes a distinct multisystem disorder that includes subcutaneous lipodystrophy, deafness, mandibular hypoplasia and hypogonadism in males."
    explanation: Gene discovery.
  - reference: PMID:26350127
    reference_title: Mandibular hypoplasia, deafness, progeroid features and lipodystrophy (MDPL) syndrome in the context of inherited lipodystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article reports the 5th MDPL (Mandibular hypoplasia, deafness, progeroid features, and lipodystrophy syndrome) patient with the same de novo p.S605del mutation in POLD1."
    explanation: Independent replication of the recurrent de novo allele.
  - reference: PMID:28791128
    reference_title: The first Japanese patient with mandibular hypoplasia, deafness, progeroid features and lipodystrophy diagnosed via POLD1 mutation detection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted exome sequencing identified a known POLD1 mutation ... that diagnosed him as the first Japanese/East Asian MDPL case."
    explanation: The recurrent allele across ancestries.
diagnosis:
- name: Molecular genetic testing of POLD1
  description: >-
    Exome sequencing or POLD1 sequencing (exon 15 for p.Ser605del) confirms
    the diagnosis. Testing should be considered in patients with lipodystrophy
    and sensorineural hearing loss and in WRN-negative and LMNA-negative
    progeroid patients, since several POLD1 carriers were first diagnosed with
    Werner syndrome.
  evidence:
  - reference: PMID:28521875
    reference_title: Exome sequencing reveals a de novo POLD1 mutation causing phenotypic variability in mandibular hypoplasia, deafness, progeroid features, and lipodystrophy syndrome (MDPL).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results also suggest that POLD1 gene testing should be considered in patients presenting with severe progeroid features."
    explanation: Recommendation for POLD1 testing.
  - reference: PMID:26172944
    reference_title: POLD1 Germline Mutations in Patients Initially Diagnosed with Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, we identified POLD1 mutations in patients initially diagnosed with WS."
    explanation: POLD1 should be tested in WRN-negative progeroid patients.
  - reference: PMID:30023403
    reference_title: A De Novo POLD1 Mutation Associated With Mandibular Hypoplasia, Deafness, Progeroid Features, and Lipodystrophy Syndrome in a Family With Werner Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the unusual convergence of 2 rare progeroid disorders in the same family: the proband displayed sporadic MDPL syndrome, while 3 brothers had classical autosomal recessive WS."
    explanation: Exome sequencing resolved MDPL in a proband from a Werner syndrome family.

animal_models:
- name: Pold1 L604K heterozygous mouse
  species: Mouse
  genotype: Pold1 +/L604K (motif A polymerase active-site substitution)
  description: >-
    Mice heterozygous for a lysine substitution at L604 in motif A, adjacent to
    the residue equivalent to human Ser605, are viable but have an 18% shorter
    life span and genome instability; homozygotes die in utero. Lipodystrophy
    was not reported. This is not the MDPL allele.
  publication: PMID:17785453
  modeled_mechanisms:
  - target: Impaired DNA Replication and Repair
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Heterozygous polymerase active-site mutation causes genome instability and shortened life span.
    limitations: >-
      Different substitution (L604K rather than the Ser605 deletion), in mouse;
      lipodystrophy, deafness and the other MDPL features were not reported.
    evidence:
    - reference: PMID:17785453
      reference_title: Mutation at the polymerase active site of mouse DNA polymerase delta increases genomic instability and accelerates tumorigenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The life spans of wild-type and heterozygous Pold1(+/L604G) mice did not differ, while that of Pold1(+/L604K) mice was reduced by 18%."
      explanation: Shortened life span in the heterozygous L604K mouse.
  evidence:
  - reference: PMID:17785453
    reference_title: Mutation at the polymerase active site of mouse DNA polymerase delta increases genomic instability and accelerates tumorigenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous Pold1(L604G/L604G) and Pold1(L604K/L604K) mice died in utero."
    explanation: Polymerase activity is essential; only heterozygotes are viable.
differential_diagnoses:
- name: Werner Syndrome
  description: >-
    Shares progressive limb lipodystrophy with insulin resistance, joint
    contractures, scleroderma-like skin, hypogonadism and a pinched nose.
    Several POLD1 carriers were first diagnosed with Werner syndrome.
  distinguishing_features:
  - Werner syndrome is autosomal recessive (biallelic WRN) with adolescent or adult onset.
  - Short stature, premature balding and greying and bilateral cataracts favor Werner syndrome.
  - Sensorineural hearing loss, prominent telangiectasias and preserved scalp hair favor MDPL.
  - Werner syndrome carries a cancer predisposition; none is established for MDPL.
  disease_term:
    preferred_term: Werner syndrome
    term:
      id: MONDO:0010196
      label: Werner syndrome
  evidence:
  - reference: PMID:23770608
    reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, MDP syndrome patients lack several key signs of Werner syndrome including short stature, premature balding/greying and cataracts"
    explanation: Clinical distinction from Werner syndrome.
  - reference: PMID:42888013
    reference_title: "Recognizing Mandibular Hypoplasia, Deafness, Progeroid Features, and Lipodystrophy Syndrome Through Its Cutaneous Manifestations: Distinction From Werner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it can be distinguished by its earlier onset, preserved scalp hair, prominent telangiectasias, sensorineural hearing loss, an absence of cataracts, and a lack of a recognized predisposition to malignancy"
    explanation: Clinical distinction from Werner syndrome.
- name: Mandibuloacral Dysplasia
  description: >-
    The LMNA (type A) and ZMPSTE24 (type B) mandibuloacral dysplasias, and the
    MTX2-associated form, share mandibular hypoplasia, a beaked nose, stiff
    joints, sclerodermatous skin and lipodystrophy.
  distinguishing_features:
  - Clavicular hypoplasia and acro-osteolysis are features of mandibuloacral dysplasia and absent in MDPL.
  - Sensorineural hearing loss is a feature of MDPL and absent in mandibuloacral dysplasia.
  - Mandibuloacral dysplasia is autosomal recessive; MDPL is dominant and usually de novo.
  disease_term:
    preferred_term: mandibuloacral dysplasia
    term:
      id: MONDO:0016584
      label: mandibuloacral dysplasia
  evidence:
  - reference: PMID:23770608
    reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MDP patients do not have short stature, premature hair loss, clavicle hypoplasia or acroosteolysis and MAD patients do not have hearing loss."
    explanation: Clinical distinction from mandibuloacral dysplasia.
  - reference: PMID:20631028
    reference_title: "A novel syndrome of mandibular hypoplasia, deafness, and progeroid features associated with lipodystrophy, undescended testes, and male hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the patients did not harbor any disease causing variants in LMNA or ZMPSTE24 and showed distinct characteristics such as sensorineural hearing loss and absence of clavicular hypoplasia and acroosteolysis."
    explanation: Original separation of MDPL from mandibuloacral dysplasia.
- name: POLD1-Related Polyposis and Colorectal Cancer Syndrome
  description: >-
    Heterozygous POLD1 missense variants in the exonuclease (proofreading)
    domain predispose to colorectal and endometrial cancer, without the MDPL
    phenotype. Allelic with MDPL but a separate disease with a different
    mechanism.
  distinguishing_features:
  - Exonuclease-domain missense variants cause cancer predisposition; polymerase-site variants cause MDPL.
  - No cancer was diagnosed in the MDPL gene-discovery series or the original clinical series.
  disease_term:
    preferred_term: POLD1-related polyposis and colorectal cancer syndrome
    term:
      id: MONDO:0012953
      label: POLD1-related polyposis and colorectal cancer syndrome
  evidence:
  - reference: PMID:23770608
    reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas missense mutations in the proofreading domain of POLD1 predispose to cancer, our data show that a single amino acid deletion in the polymerase active site of POLD1 causes a markedly different phenotype including lipodystrophy"
    explanation: Allelic distinction by protein domain.
notes: >-
  The entry name follows the OMIM title. No established gene-related (dyadic)
  name exists: the MONDO label and its synonyms carry none, and no GeneReviews
  chapter covers the disease (just check-genereviews --online, NO_CHAPTER). The ClinGen
  evidence summary uses "POLD1 - related mandibular hypoplasia-deafness-progeroid
  syndrome", kept as a synonym. Phenotype frequencies are the p.Ser605del
  column of the pooled literature-plus-cohort comparison in PMID:41742372,
  which reports missense carriers separately; the p.Ser605del group defines
  typical MDPL. Cancer risk in MDPL is unresolved: none was reported in the
  early series, but one POLD1 carrier first diagnosed with Werner syndrome
  died of ovarian cancer (PMID:26172944).

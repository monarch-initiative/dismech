mechanistic_hypotheses:
- hypothesis_group_id: polymerase_defect_genome_instability_senescence
  hypothesis_label: Loss of POLD1 polymerase activity causes replication stress, genome instability and premature cellular senescence
  status: EMERGING
  description: >-
    The p.Ser605del polymerase binds DNA but cannot extend a primer. The
    gene-discovery authors proposed that this stalls replication forks, leading
    to DNA breaks, genome instability, checkpoint activation and senescence.
    Patient fibroblasts and iPSC-derived mesenchymal stem cells do show delayed
    DNA damage repair, telomere attrition, micronuclei, nuclear envelope
    abnormalities and senescence, and a heterozygous mouse polymerase
    active-site mutant shows chromosome instability. Whether this cellular
    phenotype, in progenitors of fat, bone and muscle, explains the selective
    tissue involvement of MDPL has not been tested.
  evidence:
  - reference: PMID:23770608
    reference_title: An in-frame deletion at the polymerase active site of POLD1 causes a multisystem disorder with lipodystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This is likely to result in an increase in stalled replication forks, which are associated with double stranded DNA breaks, genomic instability, cell cycle checkpoint response and cell senescence and death"
    explanation: The gene-discovery study proposes the replication-stress mechanism from the biochemistry of the mutant enzyme.
  - reference: PMID:33618333
    reference_title: "Functional analysis of POLD1 p.ser605del variant: the aging phenotype of MDPL syndrome is associated with an impaired DNA repair capacity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest an alteration in DNA replication/repair function of POLD1 as a primary pathogenetic cause of MDPL."
    explanation: Patient-fibroblast study proposing the same mechanism.
pathophysiology:
- name: POLD1 Polymerase Active-Site Defect
  biological_scale: MOLECULAR
  description: >-
    The recurrent p.Ser605del removes one serine from motif A of the POLD1
    polymerase active site. The mutant holoenzyme cannot extend a primer, while
    its 3'-5' exonuclease activity is reduced only 1.7- to 2.5-fold, so it still
    binds DNA. Molecular dynamics predicts impaired dNTP binding at the
    DNA-binding site. Preserved DNA binding raised the possibility that the
    mutant competes with the wild-type polymerase, which has not been tested.
    Missense alleles map near the exonuclease-polymerase interface (Arg507) or
    to the C-terminal CysB iron-sulphur cluster region.

epidemiology:
- name: Associated systemic disease
  description: >-
    Associated systemic disease is frequent in pyoderma gangrenosum, but the
    reported proportion depends strongly on the setting. A UK population-based
    primary-care cohort found associations in 33% of patients (IBD 20.2%,
    rheumatoid arthritis 11.8%, hematological disorders 3.9%), whereas a
    hospital inpatient series found 47.8%. Both figures are curated with their
    populations rather than collapsed into the commonly quoted single "~50%"
    claim, because they are not measuring the same thing.
  evidence:
  - reference: PMID:22534879
    reference_title: "Incidence, mortality, and disease associations of pyoderma gangrenosum in the United Kingdom: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease associations were present in 110 (33%) participants: IBD, n=67
      (20.2%); RA, n=39 (11.8%); and hematological disorders, n=13 (3.9%).
    explanation: >-
      Provides the population-based breakdown of associated systemic disease.
  - reference: PMID:25374597
    reference_title: "Pyoderma gangrenosum: a review of clinical features and outcomes of 23 cases requiring inpatient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Associated systemic diseases were observed in 11 patients (47.8%).
    explanation: >-
      Provides the higher hospital-inpatient estimate, contrasted with the
      population-based figure.
- name: Pooled prevalence of underlying systemic disease (meta-analysis)
  description: >-
    The strongest single estimate comes from a systematic review and
    meta-analysis of 21 studies comprising 2611 patients: pooled prevalence of
    an associated systemic disease 56.8% (95% CI 45.5-67.4), led by
    inflammatory bowel disease (17.6%), arthritis (12.8%), hematological
    malignancies (8.9%) and solid malignancies (7.4%). This reconciles the
    range seen between the population-based (33%) and inpatient (47.8%)
    figures above, and is the number closest to the frequently quoted
    "about half of patients". Heterogeneity between the pooled studies was
    high, so the authors advise interpreting with caution.
  evidence:
  - reference: PMID:29721816
    reference_title: "Underlying Systemic Diseases in Pyoderma Gangrenosum: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall random-effects pooled prevalence of associated systemic
      diseases was 56.8% (95% confidence interval 45.5-67.4).
    explanation: >-
      Provides the pooled meta-analytic estimate across 21 studies and 2611
      patients.
  - reference: PMID:29721816
    reference_title: "Underlying Systemic Diseases in Pyoderma Gangrenosum: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The leading underlying disease was inflammatory bowel disease (17.6%;
      95% confidence interval 13.0-22.7), followed by arthritis (12.8%; 95%
      confidence interval 9.2-16.9), hematological malignancies (8.9%; 95%
      confidence interval 6.5-11.6), and solid malignancies (7.4%; 95%
      confidence interval 5.8-9.1).
    explanation: >-
      Breaks the pooled prevalence down by associated disease category.
- name: Solid malignancy is not an associated risk
  description: >-
    Despite solid malignancies appearing at 7.4% in the meta-analytic
    breakdown, a dedicated population-based cohort and case-control study found
    no association in either direction: the prevalence of preexisting solid
    malignancy was comparable in PG patients and matched controls, the odds of
    PG after a solid malignancy diagnosis were not increased, and PG patients
    were not more likely to develop one. The authors conclude that routine
    solid-malignancy screening in new-onset PG is unnecessary. This is curated
    as an explicit negative because the hematologic association is real and is
    easily over-generalized to malignancy as a whole.
  evidence:
  - reference: PMID:34076886
    reference_title: "Is pyoderma gangrenosum associated with solid malignancies? Insights from a population-based cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SM is not associated with provoking PG, and patients with PG are not at
      an increased risk of developing SM.
    explanation: >-
      Directly refutes a bidirectional association between solid malignancy and
      pyoderma gangrenosum.
  - reference: PMID:34076886
    reference_title: "Is pyoderma gangrenosum associated with solid malignancies? Insights from a population-based cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of a preexisting SM was comparable in patients with PG and
      controls (7.5% vs. 8.8%, respectively; P = 0.490).
    explanation: >-
      Quantifies the absence of excess preexisting solid malignancy in PG
      versus matched controls.
- name: Mortality
  description: >-
    Pyoderma gangrenosum carries substantially increased mortality — three
    times that of matched general population controls, and still 72% higher
    than that of matched inflammatory-bowel-disease controls, indicating the
    excess is not merely attributable to the associated systemic disease.
  evidence:
  - reference: PMID:22534879
    reference_title: "Incidence, mortality, and disease associations of pyoderma gangrenosum in the United Kingdom: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of death was three times higher than that for general controls
      (adjusted hazard ratio=3.03, 95% CI 1.84-4.73, P<0.001)
    explanation: Quantifies the substantially increased mortality of PG.
  - reference: PMID:22534879
    reference_title: "Incidence, mortality, and disease associations of pyoderma gangrenosum in the United Kingdom: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      72% higher than that for IBD controls (adjusted hazard ratio=1.72, 95% CI
      1.17-2.59, P=0.013)
    explanation: >-
      Shows the mortality excess persists against IBD-matched controls, so it
      is not solely explained by the associated systemic disease.
- name: Age and sex distribution
  description: >-
    In the UK population-based cohort of 313 patients the median age was 59
    years (interquartile range 41-72) and 59% were female.
  evidence:
  - reference: PMID:22534879
    reference_title: "Incidence, mortality, and disease associations of pyoderma gangrenosum in the United Kingdom: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all there were 313 people with the median age of 59 (interquartile
      range 41-72) years, and of them 185 (59%) were female.
    explanation: Reports the age and sex distribution of PG in a population cohort.

diagnosis:
- name: Positive diagnosis using validated scoring systems
  description: >-
    Pyoderma gangrenosum was historically a diagnosis of exclusion, a status
    explicitly criticized as incompatible with clinical decision making and
    trial recruitment. Two validated instruments now permit a positive
    diagnosis: the Delphi consensus criteria for ulcerative PG (one major
    criterion plus at least 4 of 8 minor criteria) and the PARACELSUS score
    (a 10-criterion score, with 10 or more points indicating high likelihood).
    Exclusion of infection and consideration of relevant differential diagnoses
    remain formal components of both instruments rather than being superseded
    by them.
  evidence:
  - reference: PMID:37610614
    reference_title: "Pyoderma Gangrenosum: Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the limited understanding of the pathogenesis, it is no longer a
      diagnosis of exclusion, as it can now be made on the basis of validated
      scoring systems.
    explanation: >-
      States directly that validated scoring systems have replaced diagnosis by
      exclusion.
  - reference: PMID:19470075
    reference_title: "Pyoderma gangrenosum: an updated review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis, mainly based on the clinical presentation and course, is
      confirmed through a process of elimination of other causes of cutaneous
      ulcers.
    explanation: >-
      Documents the historical diagnosis-of-exclusion approach that the
      validated scores were developed to replace.
- name: Exclusion of mimickers and the misdiagnosis rate
  description: >-
    Rigorous exclusion of alternative causes of severe cutaneous ulceration is
    the substance of the diagnosis, and the cost of getting it wrong is
    measurable: in a consecutive series, 15 of 157 patients (10%) treated for
    presumed PG had another diagnosis — vascular occlusive or venous disease,
    vasculitis, cancer, primary infection, drug-induced or exogenous tissue
    injury, or another inflammatory disorder. Among misdiagnosed patients whose
    course was documented, 12% had ulcers actively exacerbated by PG-directed
    treatment, which is the clinical harm this exclusion step exists to
    prevent.
  evidence:
  - reference: PMID:12409543
    reference_title: "Skin ulcers misdiagnosed as pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These 64 included 15 of the 157 consecutive patients treated for pyoderma
      gangrenosum at our institution (10 percent).
    explanation: >-
      Quantifies the misdiagnosis rate in a consecutive series of patients
      treated for presumed PG.
  - reference: PMID:12409543
    reference_title: "Skin ulcers misdiagnosed as pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The final diagnoses were vascular occlusive or venous disease,
      vasculitis, cancer, primary infection, drug-induced or exogenous tissue
      injury, and other inflammatory disorders.
    explanation: >-
      Enumerates the mimicker categories that the exclusion work-up must cover.
  - reference: PMID:12409543
    reference_title: "Skin ulcers misdiagnosed as pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those in 8 (12 percent) were exacerbated by such treatment
    explanation: >-
      Documents active harm from PG-directed treatment given on a mistaken
      diagnosis.
- name: Evaluation for associated systemic disease
  description: >-
    Because a substantial proportion of patients have an associated systemic
    disease, evaluation should include assessment for inflammatory bowel
    disease, inflammatory/rheumatologic arthritis, paraproteinemia, and
    hematologic malignancy. A bullous (atypical) presentation in particular
    should prompt hematologic evaluation including blood and bone marrow
    examination.
  evidence:
  - reference: PMID:19470075
    reference_title: "Pyoderma gangrenosum: an updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyoderma gangrenosum often occurs in association with a systemic disease
      such as inflammatory bowel disease, rheumatologic disease,
      paraproteinaemia, or haematological malignancy.
    explanation: >-
      Enumerates the associated systemic diseases that the work-up should
      address.
  - reference: PMID:10773715
    reference_title: "Pyoderma gangrenosum as an early revelator of acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the importance of regular blood and bone marrow examinations in patients
      with atypical bullous pyoderma gangrenosum
    explanation: >-
      Supports hematologic work-up specifically in the bullous variant.

definitions:
- name: Delphi consensus diagnostic criteria for ulcerative pyoderma gangrenosum
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Criteria were validated against peer-reviewed established cases of
      pyoderma gangrenosum and mimickers using k-fold cross-validation with
      multiple imputation. Receiver operating characteristic analysis showed
      that requiring 4 of 8 minor criteria maximized discrimination, giving
      sensitivity 86% and specificity 90%.
    evidence:
    - reference: PMID:29450466
      reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Receiver operating characteristic analysis revealed that 4 of 8 minor
        criteria maximized discrimination, yielding sensitivity and specificity
        of 86% and 90%, respectively.
      explanation: >-
        Reports the operating characteristics establishing the criteria as
        validated against a reference case/mimicker set.
  description: >-
    An international Delphi consensus (RAND/UCLA Appropriateness Method)
    yielding one major criterion — biopsy of the ulcer edge demonstrating a
    neutrophilic infiltrate — plus eight minor criteria: exclusion of
    infection; pathergy; history of inflammatory bowel disease or inflammatory
    arthritis; history of a papule, pustule, or vesicle ulcerating within 4 days
    of appearing; peripheral erythema, undermining border, and tenderness at the
    ulceration site; multiple ulcerations with at least one on an anterior lower
    leg; cribriform or "wrinkled paper" scars at healed ulcer sites; and
    decreased ulcer size within 1 month of starting immunosuppressive therapy.
    The major criterion plus at least 4 minor criteria supports the diagnosis.
    Scope is explicitly the ULCERATIVE variant; it is not validated for bullous,
    pustular, or vegetative PG.
  scope: Ulcerative pyoderma gangrenosum
  criteria_sets:
  - name: Major criterion
    minimum_required: 1
    description: >-
      Biopsy of the ulcer edge demonstrating a neutrophilic infiltrate.
  - name: Minor criteria
    minimum_required: 4
    description: >-
      Four or more of the eight minor criteria are required alongside the major
      criterion.
  evidence:
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8 minor criteria: (1) exclusion of infection; (2) pathergy; (3) history
      of inflammatory bowel disease or inflammatory arthritis
    explanation: >-
      Enumerates the leading minor criteria of the validated Delphi definition.
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This Delphi exercise produced 1 major criterion and 8 minor criteria for
      the diagnosis of ulcerative pyoderma gangrenosum.
    explanation: Establishes the overall structure of the criteria set.
- name: Su criteria (2004)
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  validation_status:
    status: UNVALIDATED
    rationale: >-
      The Su criteria are the historical two-major-plus-two-minor criteria set
      and remain one of the three diagnostic rating tools in current use, but
      unlike Delphi and PARACELSUS their sensitivity and specificity have not
      been reported in the literature. Curated as UNVALIDATED on that basis.
    evidence:
    - reference: PMID:41923959
      reference_title: "The utility of biopsy in pyoderma gangrenosum: a retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the Su method (specific sensitivity and specificity data remain
        unreported in the existing literature)
      explanation: >-
        States directly that operating characteristics for the Su criteria are
        unreported, which is why this definition is UNVALIDATED while the other
        two are VALIDATED_AGAINST_GOLD_STANDARD.
  description: >-
    The Su et al. (2004) clinicopathologic criteria, the historical
    predecessor of the Delphi and PARACELSUS instruments and still one of the
    three rating tools in contemporary use. Curated for completeness alongside
    the other two. Note the cited abstract is unusually thin — it announces
    that criteria are proposed without enumerating them — so this entry
    deliberately does not reproduce a criteria list that cannot be verified
    from the cached record; the criteria themselves are in the full text.
  evidence:
  - reference: PMID:15533059
    reference_title: "Pyoderma gangrenosum: clinicopathologic correlation and proposed diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we suggest diagnostic criteria and some historical perspectives
      on the diagnosis of pyoderma gangrenosum.
    explanation: >-
      Establishes this publication as the source of the proposed Su diagnostic
      criteria set.
  - reference: PMID:41923959
    reference_title: "The utility of biopsy in pyoderma gangrenosum: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three scoring tools are available for the diagnosis of pyoderma
      gangrenosum: PARACELSUS, Su and Delphi.
    explanation: >-
      Confirms Su remains one of the three diagnostic rating tools in current
      use alongside the two curated above.
- name: PARACELSUS score
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Developed and assessed retrospectively against 60 participants with
      previously confirmed PG of the lower extremity and a control cohort of 50
      patients with venous leg ulcers, evaluated by expert teams at two tertiary
      wound-care centres. A total score of 10 or more points indicates high
      likelihood of PG and discriminates PG from venous leg ulcers. The control
      group was venous leg ulcers specifically, so discrimination against other
      mimickers is not established by this study.
    evidence:
    - reference: PMID:29388188
      reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A total score value of 10 points or higher indicates a high likelihood
        of PG and differentiates PG from venous leg ulcers.
      explanation: >-
        States the validated threshold and the comparator against which the
        score was assessed.
  description: >-
    A 10-criterion diagnostic score whose criteria initials form the acronym
    PARACELSUS. Three major criteria: rapidly progressing disease, assessment
    of relevant differential diagnoses, and a reddish-violaceous wound border
    (present in 98% of PG patients). Four minor criteria (evident in 61-95% of
    patients): amelioration by immunosuppressant drugs, characteristically
    irregular ulcer shape, extreme pain above 4/10 on a visual analogue scale,
    and localization of the lesion at the site of trauma (pathergy). Three
    additional criteria (up to 60% of patients): suppurative inflammation on
    histopathology, undermined wound borders, and an associated systemic
    disease. Unlike the Delphi criteria it does not require a biopsy, which is
    useful when biopsy itself risks pathergy.
  criteria_sets:
  - name: Major criteria
    description: >-
      Rapidly progressing disease; assessment of relevant differential
      diagnoses; reddish-violaceous wound border.
  - name: Minor criteria
    description: >-
      Amelioration by immunosuppressant drugs; irregular ulcer shape; extreme
      pain > 4/10 on a visual analogue scale; localization at a site of trauma.
  - name: Additional criteria
    description: >-
      Suppurative inflammation on histopathology; undermined wound borders;
      associated systemic disease.
  evidence:
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three major diagnostic criteria are rapidly progressing disease,
      assessment of relevant differential diagnoses and a reddish-violaceous
      wound border (prevalent in 98% of patients with PG).
    explanation: Enumerates the three major criteria of the score.
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Minor criteria (evident in 61-95% of patients with PG) include
      amelioration by immunosuppressant drugs, characteristically irregular
      shape of ulceration
    explanation: >-
      Enumerates the minor criteria tier and its prevalence range in PG
      patients.

differential_diagnoses:
- name: Sweet syndrome
  description: >-
    Sweet syndrome is the other prototypic neutrophilic dermatosis and shares
    the sterile dermal neutrophilic infiltrate, pathergy, and paraneoplastic
    potential, but produces abrupt tender edematous erythematous plaques and
    nodules that heal without scarring, rather than the deep, undermined,
    violaceous, cribriform-scarring ulcers of pyoderma gangrenosum. The two are
    kept as distinct dismech entities. Comparative protein-array profiling of
    the two diseases found chemokine-mediated signals lower in Sweet syndrome
    than in PG, which the authors propose explains PG's stronger local
    aggressiveness.
  distinguishing_features:
  - "Pyoderma gangrenosum: painful ulcers with undermined violaceous borders, cribriform scarring, strong pathergy"
  - "Sweet syndrome: abrupt tender edematous plaques/nodules with fever and neutrophilia, heal without scarring"
  disease_term:
    preferred_term: Sweet syndrome
    term:
      id: MONDO:0011959
      label: sweet syndrome
  evidence:
  - reference: PMID:24903614
    reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differences in expression profile of inflammatory effectors between
      these two disorders may explain the stronger local aggressiveness in PG
      than SS.
    explanation: >-
      Provides a mechanistic basis for the clinical distinction between PG and
      its closest differential, Sweet syndrome.
- name: Venous leg ulcer
  description: >-
    Venous leg ulceration is the single most important clinical mimic, because
    both favor the lower leg and are chronic. It was the explicit control
    cohort against which the PARACELSUS score was validated. Venous ulcers lack
    the rapidly progressing course, the reddish-violaceous undermined border,
    and the extreme disproportionate pain of PG.
  distinguishing_features:
  - "Pyoderma gangrenosum: rapidly progressing, reddish-violaceous undermined border, extreme pain, improves on immunosuppression"
  - "Venous leg ulcer: chronic indolent course, sloping non-undermined margin, venous insufficiency signs, improves with compression"
  evidence:
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a control cohort of 50 patients with venous leg ulcers
    explanation: >-
      Confirms venous leg ulcer as the principal comparator mimic in the
      score's validation study.
- name: Cutaneous infection and necrotizing soft tissue infection
  description: >-
    Infective ulceration is the critical exclusion, and misdiagnosis runs in
    both directions: an infected ulcer treated as PG with immunosuppression, or
    PG debrided as though it were necrotizing infection, which triggers
    pathergy. Exclusion of infection is a formal minor criterion in the Delphi
    definition; PG lesions are culture-negative and do not respond to
    antibiotics.
  distinguishing_features:
  - "Pyoderma gangrenosum: sterile/culture-negative, no response to antibiotics, worsens with debridement (pathergy), responds to immunosuppression"
  - "Cutaneous/necrotizing infection: positive cultures, responds to antibiotics, requires surgical debridement"
  evidence:
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8 minor criteria: (1) exclusion of infection; (2) pathergy
    explanation: >-
      Establishes exclusion of infection as a formal diagnostic criterion,
      making infective ulceration the key differential.
- name: Behcet disease
  description: >-
    Behcet disease is a variable-vessel vasculitis on the neutrophilic/
    autoinflammatory spectrum that also displays pathergy and can produce
    cutaneous ulceration, but is defined by recurrent oral and genital
    ulceration with ocular inflammation in a chronic relapsing multisystem
    course.
  distinguishing_features:
  - "Pyoderma gangrenosum: cutaneous ulcers with undermined violaceous borders, no obligate oral/genital ulceration"
  - "Behcet disease: recurrent oral and genital ulcers, uveitis, multisystem variable-vessel vasculitis"
  disease_term:
    preferred_term: Behcet disease
    term:
      id: MONDO:0007191
      label: Behcet disease

treatments:
- name: Systemic corticosteroids
  description: >-
    Systemic corticosteroids (prednisolone, typically 0.75 mg/kg/day) are one of
    the two first-line systemic therapies. In the STOP GAP randomised trial they
    did not differ from ciclosporin on speed of healing or any other objective
    or patient-reported outcome, with 47% of ulcers healed by six months in each
    arm; however serious adverse reactions, especially infections, were more
    common with prednisolone, so the choice between the two is driven by side
    effect profile and patient preference rather than efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Sterile Neutrophilic Dermal Inflammation and Tissue Destruction
    treatment_effect: INHIBITS
    description: >-
      Broad immunosuppression suppresses the neutrophilic dermal inflammatory
      process driving ulceration.
  evidence:
  - reference: PMID:26071094
    reference_title: "Comparison of the two most commonly used treatments for pyoderma gangrenosum: results of the STOP GAP randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By six months, ulcers had healed in 28/59 (47%) participants in the
      ciclosporin group compared with 25/53 (47%) in the prednisolone group.
    explanation: >-
      Quantifies six-month healing under prednisolone in the largest randomised
      trial in PG.
  - reference: PMID:26071094
    reference_title: "Comparison of the two most commonly used treatments for pyoderma gangrenosum: results of the STOP GAP randomised controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serious adverse reactions, especially infections, were more common in the
      prednisolone group
    explanation: >-
      Documents the safety signal that differentiates prednisolone from
      ciclosporin despite equivalent efficacy.
- name: Ciclosporin
  description: >-
    Ciclosporin (4 mg/kg/day, maximum 400 mg/day) is the other first-line
    systemic therapy and, together with corticosteroids, remains the systemic
    treatment of choice for most patients. The STOP GAP randomised controlled
    trial found no difference from prednisolone across objective and
    patient-reported outcomes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciclosporin
      term:
        id: CHEBI:4031
        label: cyclosporin A
  target_mechanisms:
  - target: Th17/Th1-Skewed Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      Calcineurin inhibition suppresses T-cell cytokine production, damping the
      Th17/Th1 amplification layer.
  evidence:
  - reference: PMID:26071094
    reference_title: "Comparison of the two most commonly used treatments for pyoderma gangrenosum: results of the STOP GAP randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prednisolone and ciclosporin did not differ across a range of objective
      and patient reported outcomes.
    explanation: >-
      Establishes therapeutic equivalence of ciclosporin and prednisolone in a
      randomised controlled trial.
  - reference: PMID:37610614
    reference_title: "Pyoderma Gangrenosum: Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids and/or cyclosporine remain the systemic therapeutics of
      choice for most patients.
    explanation: >-
      Confirms corticosteroids and ciclosporin as the systemic therapies of
      choice.
- name: Infliximab (anti-TNF biologic therapy)
  description: >-
    Infliximab, a monoclonal antibody against tumour necrosis factor alpha, is
    the only agent with randomised placebo-controlled evidence in pyoderma
    gangrenosum. In the Brooklyn trial — the first randomised placebo-controlled
    trial of any drug for PG — a single 5 mg/kg infusion produced clinical
    improvement at week 2 in 46% versus 6% on placebo. Anti-TNF therapy is
    particularly relevant where PG coexists with inflammatory bowel disease, and
    achieved the highest medical complete-resolution rate (63%) in a peristomal
    PG cohort.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  target_mechanisms:
  - target: Th17/Th1-Skewed Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      TNF neutralization removes a principal cytokine of the amplification
      layer driving neutrophil recruitment.
    evidence:
    - reference: PMID:16188920
      reference_title: "Infliximab for the treatment of pyoderma gangrenosum: a randomised, double blind, placebo controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study has demonstrated that infliximab at a dose of 5 mg/kg is
        superior to placebo in the treatment of PG.
      explanation: >-
        Randomised placebo-controlled demonstration that TNF blockade
        therapeutically modifies the disease, supporting TNF as mechanistically
        operative.
  evidence:
  - reference: PMID:16188920
    reference_title: "Infliximab for the treatment of pyoderma gangrenosum: a randomised, double blind, placebo controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At week 2, significantly more patients in the infliximab group had
      improved (46% (6/13)) compared with the placebo group (6% (1/17); p =
      0.025).
    explanation: >-
      Reports the primary endpoint of the only placebo-controlled randomised
      trial in PG.
  - reference: PMID:32383278
    reference_title: "Risk factors and treatment outcomes of peristomal pyoderma gangrenosum in patients with inflammatory bowel disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher rates of complete resolution were reported with anti-tumour
      necrosis factor (TNF) agents (63%) and surgical interventions (80%).
    explanation: >-
      Quantifies anti-TNF response in peristomal PG, the highest medical
      complete-resolution rate in that cohort.
- name: Interleukin-1 blockade
  description: >-
    IL-1 inhibition (anakinra, an IL-1 receptor antagonist; canakinumab and
    gevokizumab, anti-IL-1beta antibodies) is a mechanism-directed therapy
    targeting the inflammasome/IL-1 node that is the proximal lesion in PG —
    IL-1 beta and its receptor I are directly over-expressed in PG lesional
    skin — and the proven molecular defect in PSTPIP1-driven PAPA syndrome.
    IMPORTANT NEGATIVE QUALIFIER: mechanistic rationale has not translated into
    demonstrated efficacy. All three registered gevokizumab (anti-IL-1beta)
    trials in PG were terminated (NCT02315417, NCT02326740 and the open-label
    safety extension NCT02318914, all Phase 3), and the canakinumab study
    (NCT01302795) was an open-label Phase 2 pilot with no control arm. No
    randomised controlled trial has shown IL-1 blockade to be effective in PG.
    This treatment is therefore curated as a mechanistically motivated but
    unproven option, NOT as established therapy — see the
    `pg_trial_attrition` discussion.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: CHEBI:231683
        label: Anakinra
  target_mechanisms:
  - target: Inflammasome Activation and IL-1 Overproduction
    treatment_effect: INHIBITS
    description: >-
      IL-1 receptor antagonism blocks signaling from the overproduced IL-1 that
      initiates the neutrophil-recruiting cascade. Note the cited evidence
      establishes that the drug target is over-expressed in PG lesional skin,
      which is the mechanistic rationale; it is not itself evidence of clinical
      efficacy.
    evidence:
    - reference: PMID:24903614
      reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The expressions of interleukin (IL)-1 beta and its receptor I were
        significantly higher in PG
      explanation: >-
        Establishes the drug target (IL-1 beta and its receptor I) as
        over-expressed in PG lesional skin, the mechanistic rationale for
        targeting this node.
  evidence:
  - reference: PMID:37610614
    reference_title: "Pyoderma Gangrenosum: Treatment Options."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an increasing number of studies on the positive effects of biologic
      therapies such as inhibitors of tumour necrosis factor
    explanation: >-
      Supports the biologic class including IL-1 inhibitors as having reported
      positive effects; graded PARTIAL because this sentence groups IL-1
      blockade with other biologics rather than reporting a trial of it.
- name: Adalimumab (anti-TNF biologic therapy)
  description: >-
    Adalimumab is a TNF-alpha inhibitor approved for pyoderma gangrenosum in
    Japan on the basis of the Phase 3 open-label trial NCT03311464. A 52-week
    multicentre prospective postmarketing observational study of 67 patients
    reported Physician Global Assessment (total lesions) scores of 0/1 in 36.0%
    at week 12, 46.2% at week 26 and 57.7% at week 52, with infections reported
    as adverse drug reactions in 14.9% and serious ADRs in 9.0%. Effectiveness
    was seen across PG subtypes and in patients on concomitant systemic
    steroids.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  target_mechanisms:
  - target: Th17/Th1-Skewed Cytokine Amplification
    treatment_effect: INHIBITS
    description: >-
      TNF neutralization removes a principal cytokine of the amplification
      layer driving neutrophil recruitment.
  evidence:
  - reference: PMID:42107018
    reference_title: "Safety and Effectiveness of Adalimumab for the Treatment of Pyoderma Gangrenosum: A 52-Week Real-World Prospective Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proportions of patients with a PGA score (total lesions) of 0/1 at
      weeks 12, 26, and 52 were 36.0%, 46.2%, and 57.7%, respectively
    explanation: >-
      Quantifies adalimumab effectiveness over 52 weeks in a prospective
      multicentre PG cohort.
  - reference: PMID:42107018
    reference_title: "Safety and Effectiveness of Adalimumab for the Treatment of Pyoderma Gangrenosum: A 52-Week Real-World Prospective Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support its use as a standard treatment for PG, including
      in patients receiving concomitant systemic steroid therapy.
    explanation: >-
      The authors' conclusion supporting adalimumab as a standard PG treatment.
- name: Topical corticosteroid therapy (clobetasol propionate)
  description: >-
    Topical therapy — most commonly clobetasol propionate 0.05%, sometimes
    topical tacrolimus — is a genuine first-line option for limited disease,
    not merely an adjunct. In a prospective cohort of 66 UK patients whose PG
    was judged suitable for topical treatment, 43.8% of ulcers healed by 6
    months with a median time to healing of 145 days. It avoids the adverse
    effects of systemic immunosuppression, though whether more severe disease
    responds adequately to topical therapy alone remains unclear, and the study
    had no randomized comparator.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clobetasol propionate
      term:
        id: CHEBI:31414
        label: clobetasol propionate
  target_mechanisms:
  - target: Sterile Neutrophilic Dermal Inflammation and Tissue Destruction
    treatment_effect: INHIBITS
    description: >-
      Locally delivered high-potency corticosteroid suppresses the neutrophilic
      dermal inflammatory process at the lesion itself.
  evidence:
  - reference: PMID:27502313
    reference_title: "Clinical outcomes and response of patients applying topical therapy for pyoderma gangrenosum: A prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 28 of 66 (43.8%) ulcers healed by 6 months.
    explanation: >-
      Quantifies healing under topical therapy in a prospective PG cohort.
  - reference: PMID:27502313
    reference_title: "Clinical outcomes and response of patients applying topical therapy for pyoderma gangrenosum: A prospective cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Topical therapy is potentially an effective first-line treatment for PG
      that avoids the possible side effects associated with systemic therapy.
    explanation: >-
      Supports topical therapy as a first-line option; graded PARTIAL because
      the study was a single-arm cohort without a randomized comparator.
- name: Complement C5a blockade (vilobelimab)
  description: >-
    Vilobelimab is a C5a-neutralizing monoclonal antibody targeting the
    complement node this entry models as the proximal driver of NETosis, and is
    the most direct test of that mechanism to date. IMPORTANT NEGATIVE
    QUALIFIER: the exploratory open-label Phase IIa trial (NCT03971643, OPTIMA)
    completed, but the subsequent randomised, double-blind, placebo-controlled
    Phase III trial in ulcerative PG (NCT05964413) was TERMINATED and the
    registry records the reason as futility. This treatment is curated because
    the target is mechanistically well evidenced in human PG wound fluid, NOT
    because efficacy is established — on current evidence it is a failed Phase
    III. Note the primary mechanistic paper itself anticipated a reason this
    might happen: C5a blockade alone may not suffice, because other neutrophil
    chemokines (IL-8, CXCL2) are independently over-expressed in PG lesional
    skin.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vilobelimab
      term:
        id: NCIT:C172643
        label: Vilobelimab
  target_mechanisms:
  - target: Complement C5a Generation and C5aR1 Signalling
    treatment_effect: INHIBITS
    description: >-
      C5a neutralization removes the ligand for C5aR1, the proximal driver of
      NET release in PG.
  evidence:
  - reference: PMID:37516310
    reference_title: "NETosis Is Induced by Complement Component 5a: Implications in the Pathogenesis of Pyoderma Gangrenosum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NETosis induction by C5a provides a molecular basis for targeting C5a in
      PG therapy.
    explanation: >-
      States the mechanistic rationale for C5a-directed therapy in PG, which is
      why this treatment is curated despite the negative trial result.
  - reference: PMID:37516310
    reference_title: "NETosis Is Induced by Complement Component 5a: Implications in the Pathogenesis of Pyoderma Gangrenosum."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      However, C5a blockade alone may not be sufficient to block neutrophil
      infiltration in PG because other neutrophil chemokines such as IL-8 and
      CXCL2 are also overexpressed in PG lesional skin.
    explanation: >-
      The primary mechanistic paper's own caveat, which anticipates the
      redundancy that may underlie the Phase III futility result.
- name: JAK inhibition (tofacitinib, baricitinib)
  description: >-
    JAK inhibitors target the JAK/STAT node overactivated in PG lesions. In
    vitro, tofacitinib suppresses STAT phosphorylation in myeloid and T cells,
    myeloid NETosis, and IL-17A production — hitting three processes this
    pathograph models. Computational multi-omics work nominates baricitinib for
    the PG-IBD comorbid setting via the shared JAK2/STAT3 hub. EVIDENCE LEVEL:
    investigational only. Support is in vitro plus case reports and small
    series; the authors of the tofacitinib work describe their own evidence as
    preliminary, and the baricitinib nomination is a docking and
    systems-modelling prediction with no experimental validation. No controlled
    trial is curated, and no JAK inhibitor is approved for PG.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tofacitinib
      term:
        id: CHEBI:71200
        label: tofacitinib
  target_mechanisms:
  - target: JAK-STAT Pathway Overactivation
    treatment_effect: INHIBITS
    description: >-
      JAK inhibition suppresses STAT phosphorylation, damping the myeloid
      NETosis and Th17 arms downstream of this node.
    evidence:
    - reference: PMID:42603447
      reference_title: "Preliminary exploration of effects of the JAK inhibitor tofacitinib on pyoderma gangrenosum: In vitro inhibition of NETs and Th17 differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro cell experiments further demonstrated that the JAK inhibitor
        tofacitinib suppresses STAT phosphorylation in myeloid and T cells,
        myeloid NETosis, and IL-17A production.
      explanation: >-
        Directly demonstrates the drug acting on this node and its two
        downstream arms, in vitro.
  evidence:
  - reference: PMID:42603447
    reference_title: "Preliminary exploration of effects of the JAK inhibitor tofacitinib on pyoderma gangrenosum: In vitro inhibition of NETs and Th17 differentiation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      provide preliminary in vitro evidence supporting potential inhibitory
      effects of tofacitinib on key pathological processes of PG
    explanation: >-
      The authors' own characterization of the evidence as preliminary and in
      vitro, which is why this is curated as investigational.
  - reference: PMID:42123319
    reference_title: "Integrative Multi-Omics Analysis and Computational Modeling Identifying Shared Inflammatory Pathways and JAK Inhibitor Targets in PG and IBD."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Although this study provides multiscale computational simulation
      evidence, the lack of direct experimental validation of these predicted
      results necessitates further confirmation through in vitro and in vivo
      experiments.
    explanation: >-
      The computational study's own statement that its JAK-inhibitor
      predictions lack experimental validation.
- name: Wound care, pain control and avoidance of debridement
  description: >-
    Concomitant topical therapy, wound management and pain control should
    always be addressed alongside systemic treatment. Critically, because of
    pathergy, surgical debridement and defect closure may exacerbate the injury,
    so aggressive debridement of an active PG ulcer is generally avoided and
    surgery — where required for reconstruction — is undertaken only under
    adequate immunosuppression. Note that the peristomal cohort reported high
    resolution rates with surgical intervention (80%), so the caution is
    against reflexive debridement of misdiagnosed active disease rather than an
    absolute prohibition on surgery. A retrospective inpatient series makes the
    same point from the other direction: all three patients who underwent split
    skin grafting under immunosuppressive cover had no postoperative graft
    failure or pathergy, and the authors conclude surgery should be considered
    alongside immunosuppressive (and hyperbaric) therapy once disease is
    quiescent. The operative principle is therefore "not on active disease
    without cover", not "never".
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37610614
    reference_title: "Pyoderma Gangrenosum: Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, concomitant topical pharmacologic therapy, wound management
      and pain control should always be addressed.
    explanation: >-
      Establishes wound management and pain control as standard adjunctive
      care.
  - reference: PMID:38250211
    reference_title: "Postsurgical Pyoderma Gangrenosum Requiring Plastic Surgical Intervention: A Practical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accurate diagnosis of PSPG, prevention of further surgical injury, and
      timely medical management are vital for improving patient outcomes.
    explanation: >-
      Supports prevention of further surgical injury as a management principle
      driven by pathergy.
  - reference: PMID:23903083
    reference_title: "Inpatient management of pyoderma gangrenosum: treatments, outcomes, and clinical implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 3 patients who underwent split skin grafting under immunosuppressive
      cover (with 2 having hyperbaric oxygen therapy) had no postoperative graft
      failure or pathergy.
    explanation: >-
      Counterweight to blanket surgical avoidance: grafting under
      immunosuppressive cover did not trigger pathergy. PARTIAL because n=3.
  - reference: PMID:23903083
    reference_title: "Inpatient management of pyoderma gangrenosum: treatments, outcomes, and clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery should be considered in conjunction with combined hyperbaric and
      immunosuppressive therapy once the disease is quiescent
    explanation: >-
      States the conditional-surgery principle curated in this treatment's
      description.
- name: Treatment of associated systemic disease
  description: >-
    Because a third to nearly half of patients have an associated systemic
    disease — most often inflammatory bowel disease, inflammatory arthritis, or
    a hematologic disorder — identification and treatment of that disease is
    part of managing the dermatosis, and in some settings determines the choice
    of systemic agent (for example anti-TNF therapy where PG coexists with
    IBD).
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25374597
    reference_title: "Pyoderma gangrenosum: a review of clinical features and outcomes of 23 cases requiring inpatient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study also highlights the importance of early and aggressive
      treatment of patients admitted with PG as well as treating associated
      systemic diseases and wound infections.
    explanation: >-
      Directly recommends treating associated systemic disease as part of PG
      management.

animal_models:
- name: PG-serum transfer mouse (wild-type and GSDMD-knockout)
  species: Mouse
  genotype: Wild-type C57BL/6 and GSDMD-/-
  publication: PMID:40034857
  description: >-
    The only animal model of pyoderma gangrenosum curated here. Serum from PG
    patients is injected into the dorsal skin of wild-type mice, producing
    localized cutaneous ulcers with increased NETs and GSDMD in lesional skin
    and serum. Repeating the model in GSDMD-knockout mice significantly reduces
    ulcer severity, which is what makes it a perturbation experiment on the
    NETosis node rather than only a descriptive lesion model.
  modeled_mechanisms:
  - target: GSDMD-Dependent NETosis
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      GSDMD knockout removes the regulator of NET formation and attenuates
      ulceration, directly testing this node's causal contribution.
    limitations: >-
      Ulcers are induced by passive transfer of patient serum rather than
      arising spontaneously, so the model reproduces an effector arm rather
      than the upstream disease trigger. It does not recapitulate pathergy,
      the undermined violaceous border, cribriform scarring, the associated
      systemic diseases, or the corticosteroid/ciclosporin responsiveness that
      define human PG, and the knockout is constitutive rather than
      neutrophil-restricted.
    readouts:
    - name: Skin ulcer severity in GSDMD-knockout versus wild-type mice
      target: GSDMD-Dependent NETosis
      direction: DECREASED
      interpretation: >-
        Loss of GSDMD attenuates ulceration, indicating GSDMD-dependent NETosis
        contributes causally to lesion severity in this model.
      evidence:
      - reference: PMID:40034857
        reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In GSDMD -/- mice, the severity of skin ulcers after modeling was
          significantly diminished.
        explanation: Reports the knockout-versus-wild-type ulcer severity result.
    evidence:
    - reference: PMID:40034857
      reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, our findings shed light on the role of GSDMD in regulating the
        production of NETs by neutrophils and the release of inflammatory
        factors in the pathogenesis of PG and establish an animal model for
        studying PG.
      explanation: >-
        The authors' own framing of the system as an animal model informative
        for GSDMD-regulated NET production in PG.
  - target: Progressive Cutaneous Ulceration with Undermined Violaceous Border
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Serum transfer produces localized cutaneous ulceration, but only the
      bare fact of ulcer formation — none of the features that make a PG ulcer
      diagnostically recognizable.
    limitations: >-
      The model yields localized ulcers without the undermined,
      erythematous-violaceous border, rapid centrifugal progression,
      disproportionate pain, or cribriform scarring that define the human
      lesion and constitute the major diagnostic criteria. Ulceration here is
      an induced endpoint, not a spontaneous relapsing disease course.
    readouts:
    - name: Cutaneous ulcer formation after PG-serum injection
      target: Progressive Cutaneous Ulceration with Undermined Violaceous Border
      direction: INCREASED
      interpretation: >-
        PG patient serum is sufficient to induce cutaneous ulceration in
        wild-type mouse skin.
      evidence:
      - reference: PMID:40034857
        reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Injection of serum from PG patients into the dorsal skin of wild-type
          mice led to the formation of localized cutaneous ulcers.
        explanation: Reports the induced ulceration endpoint of the model.
    evidence:
    - reference: PMID:40034857
      reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Injection of serum from PG patients into the dorsal skin of wild-type
        mice led to the formation of localized cutaneous ulcers.
      explanation: >-
        Supports treating the model as informative for the ulceration node,
        with the fidelity caveats recorded in `limitations`.


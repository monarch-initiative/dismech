discussions:
- discussion_id: pg_ibd_comorbidity_edge
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the pyoderma gangrenosum-inflammatory bowel disease association be
    promoted to a structured comorbidity entry linking this entry to the
    existing Crohn_Disease and Ulcerative_Colitis entries?
  rationale: >-
    Inflammatory bowel disease is the single commonest systemic association of
    pyoderma gangrenosum (20.2% of patients in a UK population-based cohort),
    and PG appears reciprocally as an extraintestinal manifestation of IBD
    (1.2% of Crohn disease patients in a population-based study). PG is already
    curated as a phenotype inside Crohn_Disease.yaml. The Disease class has no
    comorbidities slot, so the relationship is recorded here rather than
    inline; a dedicated kb/comorbidities/ entry carrying the directional
    association and its EHR/cohort statistics is the natural follow-up, and is
    deliberately left out of scope of this entry's creation PR.

    The mechanistic content of that future edge is now partly specified. A
    multi-omics study reports Mendelian-randomization evidence that IBD is a
    causal risk factor for PG (not merely correlated), identifies six shared
    genetic loci, and finds a cross-tissue conserved inflammatory module
    centred on JAK-STAT with JAK2 and STAT3 as hubs — giving the gut-skin axis
    a candidate molecular substrate and a shared druggable target. That study
    is entirely computational and says so, so the causal direction is curated
    here as a computational finding rather than as settled fact; it is the
    strongest available specification of what a PG-IBD comorbidity entry should
    assert, and the reason the `JAK-STAT Pathway Overactivation` node exists in
    this entry.
  evidence:
  - reference: PMID:42123319
    reference_title: "Integrative Multi-Omics Analysis and Computational Modeling Identifying Shared Inflammatory Pathways and JAK Inhibitor Targets in PG and IBD."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      The results revealed that genetic analysis confirmed IBD as a causal risk
      factor for PG, precisely identifying six shared genetic loci.
    explanation: >-
      Provides a directional (IBD to PG) causal claim from Mendelian
      randomization plus shared loci — the substance of the proposed comorbidity
      edge. PARTIAL/COMPUTATIONAL because the study is in silico throughout.
  - reference: PMID:22534879
    reference_title: "Incidence, mortality, and disease associations of pyoderma gangrenosum in the United Kingdom: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease associations were present in 110 (33%) participants: IBD, n=67
      (20.2%); RA, n=39 (11.8%); and hematological disorders, n=13 (3.9%).
    explanation: >-
      Quantifies IBD as the commonest systemic association of PG in a
      population-based cohort.
  - reference: PMID:11316157
    reference_title: "The prevalence of extraintestinal diseases in inflammatory bowel disease: a population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyoderma gangrenosum was more common in Crohn's (1.2%) with no gender
      predilection.
    explanation: >-
      Quantifies the reciprocal direction — PG prevalence among IBD patients —
      supporting a bidirectional comorbidity edge.
- discussion_id: pg_papa_entity_boundary
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should the boundary between sporadic pyoderma gangrenosum and the
    monogenic PAPA/PASH/PAPASH spectrum be modeled?
  rationale: >-
    PSTPIP1-driven PAPA syndrome (MONDO:0011462) provides the clean Mendelian
    demonstration that inflammasome-dependent IL-1beta overproduction can cause
    pyoderma gangrenosum, and PG is PAPA's cutaneous hallmark. But common
    sporadic PG is not a Mendelian disease and no causal gene is asserted for
    it here. This entry therefore curates PSTPIP1 as a mechanism-anchoring
    MODIFIER-typed gene rather than a causal gene of sporadic PG, and models
    the monogenic arm as an upstream pathophysiology node feeding the shared
    IL-1 node. PAPA syndrome itself remains an open curation stub and should be
    curated as its own Disease entry rather than folded in here; the PASH
    (PG, acne, suppurative hidradenitis) and PAPASH extensions overlap the
    existing Hidradenitis_Suppurativa entry and are likewise out of scope.
  attaches_to:
  - PSTPIP1 Dysfunction (Monogenic PAPA Arm)
  evidence:
  - reference: PMID:21532836
    reference_title: "Clinical, Molecular, and Genetic Characteristics of PAPA Syndrome: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is a clear molecular feature of PAPA syndrome
    explanation: >-
      Supports treating the monogenic arm as a demonstration of the IL-1
      mechanism while keeping PAPA a distinct entity.
- discussion_id: pg_trial_attrition
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Why has every late-phase targeted trial in pyoderma gangrenosum failed or
    been terminated, and what does that imply for how this entry's mechanism
    nodes should be read?
  rationale: >-
    The curated trial record is dominated by attrition, and that negative
    pattern is itself the curated fact rather than an absence of data. Of the
    nine trials in this entry, five are terminated: all three gevokizumab
    (anti-IL-1beta) registrations (NCT02315417, NCT02326740, NCT02318914), the
    vilobelimab (anti-C5a) Phase III NCT05964413 — explicitly stopped for
    futility — and the spesolimab Phase II NCT06092216, which is the one
    non-futility termination (the sponsor redirected to a multicentre trial).
    Only infliximab (placebo-controlled, positive) and STOP GAP
    (prednisolone versus ciclosporin, no difference) reached informative
    completion, and adalimumab is approved on an open-label single-arm Phase 3.

    Three non-exclusive readings are worth holding open. (1) Mechanistic
    redundancy: the pathograph has multiple parallel neutrophil-recruiting
    inputs (C5a, IL-8/CXCL8, CXCL1/2/3, IL-36), so blocking any single one may
    be insufficient — the C5a primary paper anticipates exactly this. (2)
    Trial-design difficulty: PG had no validated diagnostic criteria until 2018
    and still has no validated response criteria, so cohorts may be
    heterogeneous and endpoints insensitive; the Delphi authors give patient
    selection for trials as an explicit motivation for their criteria. (3) The
    mechanism nodes may be correct as descriptions of the inflammatory state
    while being wrong as rate-limiting therapeutic targets — a node can be
    genuinely active in disease and still not be the lever.

    Curation consequence: no targeted agent in this entry may be presented as
    established therapy on mechanistic grounds alone. The IL-1 blockade and C5a
    blockade treatments both carry explicit negative qualifiers for this reason.
  attaches_to:
  - Complement C5a Generation and C5aR1 Signalling
  - Inflammasome Activation and IL-1 Overproduction
  evidence:
  - reference: PMID:37516310
    reference_title: "NETosis Is Induced by Complement Component 5a: Implications in the Pathogenesis of Pyoderma Gangrenosum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, C5a blockade alone may not be sufficient to block neutrophil
      infiltration in PG because other neutrophil chemokines such as IL-8 and
      CXCL2 are also overexpressed in PG lesional skin.
    explanation: >-
      Supports the mechanistic-redundancy reading of the trial failures, stated
      by the authors of the C5a mechanism paper itself.
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is a "diagnosis of exclusion," a definition not compatible with
      clinical decision making or inclusion for clinical trials
    explanation: >-
      Supports the trial-design reading: the absence of usable diagnostic
      criteria was itself recognized as an obstacle to trial recruitment.
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low-evidence studies and a lack of validated diagnostic and response
      criteria have hindered the discovery and validation of new effective
      treatments for pyoderma gangrenosum.
    explanation: >-
      Directly attributes the failure to discover effective PG treatments to
      low-evidence studies and missing validated criteria.
- discussion_id: pg_biopsy_diagnostic_utility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is biopsy of the ulcer edge genuinely required for the diagnosis of
    pyoderma gangrenosum, given that it is the sole major Delphi criterion yet
    is nonspecific, insensitive, and itself risks pathergy?
  rationale: >-
    This entry curates the ulcer-edge neutrophilic infiltrate as `diagnostic:
    true` histopathology because it is the single MAJOR criterion of the
    validated Delphi definition. That position is genuinely contested and the
    tension is recorded here rather than silently resolved in favour of either
    side. Against it: histological findings in PG are nonspecific, a
    retrospective cohort found that of 58 patients only 26 (45%) were biopsied
    and only 10 of those (38%) had a biopsy that contributed to the diagnosis,
    and the biopsy procedure itself can trigger pathergy — the mechanism this
    entry models as a causal edge. The PARACELSUS score was deliberately
    designed not to require biopsy, which is part of its practical appeal. For
    it: exclusion of infection and of the many mimickers is essential, and
    10% of patients treated for PG in a consecutive series turned out to have
    something else. The open question is not whether tissue is ever useful but
    whether a mandatory biopsy criterion improves or degrades net diagnostic
    accuracy once pathergy risk is priced in.
  attaches_to:
  - Pathergy - Trauma-Induced Lesion Initiation
  evidence:
  - reference: PMID:41923959
    reference_title: "The utility of biopsy in pyoderma gangrenosum: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 58 patients, 26 (45%) underwent biopsies, with only 10 (38%)
      contributing to a PG diagnosis.
    explanation: >-
      Quantifies the low diagnostic yield of biopsy in a consecutive PG cohort.
  - reference: PMID:41923959
    reference_title: "The utility of biopsy in pyoderma gangrenosum: a retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given risk of pathergy, nonspecific histopathological findings and low
      sensitivity, in our opinion, based on this small sample size, biopsies
      have limited diagnostic value for PG.
    explanation: >-
      States the contrary position directly, including the pathergy risk that
      makes this a mechanistically loaded question rather than a purely
      operational one.
  - reference: PMID:12409543
    reference_title: "Skin ulcers misdiagnosed as pyoderma gangrenosum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These 64 included 15 of the 157 consecutive patients treated for pyoderma
      gangrenosum at our institution (10 percent).
    explanation: >-
      Quantifies the misdiagnosis rate that argues for rigorous exclusion of
      mimickers, the consideration on the other side of this question.
- discussion_id: pg_pathogenesis_knowledge_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the initiating trigger of sporadic pyoderma gangrenosum, and is
    there an animal model that reproduces the integrated disease rather than
    one effector arm?
  rationale: >-
    Contemporary reviews state explicitly that the exact pathogenesis of
    pyoderma gangrenosum is not yet fully understood. The upstream trigger of
    sporadic disease is unknown and the follicular unit is only "increasingly
    recognized" as a putative initial target. An animal model now exists and is
    curated here (the PG-serum transfer mouse), but it reproduces the
    NETosis effector arm rather than the integrated syndrome: ulcers are
    induced by passive serum transfer, and the model shows neither pathergy,
    the undermined violaceous border, cribriform scarring, the associated
    systemic diseases, nor corticosteroid/ciclosporin responsiveness. So the
    gap is narrower than it was but not closed. Mechanistic understanding
    otherwise rests on human cohort, tissue and cytokine studies plus
    extrapolation from the monogenic PAPA arm. The low-evidence base is itself
    called out in the literature as having hindered discovery and validation of
    new treatments. The complement C5a/C5aR1 and MMP-2/MMP-9 effector arms
    previously tracked here as uncurated enrichment targets have since been
    curated as full nodes from primary sources, so they are no longer gaps. What
    remains genuinely open is upstream and therapeutic rather than descriptive:
    what initiates complement activation and inflammasome priming in sporadic PG
    in the first place, and why a pathograph this well characterized has yielded
    no successful targeted therapy — see `pg_trial_attrition`.
  attaches_to:
  - Inflammasome Activation and IL-1 Overproduction
  evidence:
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low-evidence studies and a lack of validated diagnostic and response
      criteria have hindered the discovery and validation of new effective
      treatments for pyoderma gangrenosum.
    explanation: >-
      Documents the weak evidence base that constitutes this knowledge gap.


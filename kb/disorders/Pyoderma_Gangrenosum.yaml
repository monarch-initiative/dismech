- name: Sterile Neutrophilic Dermal Inflammation and Tissue Destruction
  biological_scale: TISSUE
  description: >-
    A dense, sterile (culture-negative) neutrophilic infiltrate accumulates in
    the dermis, most conspicuously at the advancing ulcer edge, and destroys
    dermal tissue. Over-expressed Fas/Fas ligand and CD40/CD40 ligand systems
    contribute to that tissue damage in PG. The absence of a causative organism
    is central: the inflammation is aseptic, which is why antibiotics do not
    resolve the lesion and why exclusion of infection is a formal diagnostic
    criterion. Biopsy of the ulcer edge demonstrating a neutrophilic infiltrate
    is the single major criterion in the Delphi consensus definition.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Progressive Cutaneous Ulceration with Undermined Violaceous Border
    description: >-
      Neutrophil-mediated dermal destruction manifests as the rapidly enlarging
      painful ulcer with an undermined violaceous border.
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
  evidence:
  - reference: PMID:24903614
    reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      contributing to tissue damage and inflammation
    explanation: >-
      Attributes tissue damage in PG to the over-expressed Fas/Fas ligand and
      CD40/CD40 ligand effector systems measured in lesional skin.
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8 minor criteria: (1) exclusion of infection; (2) pathergy; (3) history
      of inflammatory bowel disease or inflammatory arthritis
    explanation: >-
      That exclusion of infection is a formal diagnostic criterion establishes
      the sterile (non-infectious) character of the neutrophilic infiltrate
      modeled by this node.
- name: Progressive Cutaneous Ulceration with Undermined Violaceous Border
  biological_scale: ORGANISM
  description: >-
    The converging neutrophilic process manifests clinically as the defining
    lesion: a painful, rapidly evolving cutaneous ulcer with undermined,
    irregular, erythematous-violaceous edges and a mucopurulent or hemorrhagic
    exudate. Rapid progression and a reddish-violaceous wound border are two of
    the three major criteria of the PARACELSUS diagnostic score, the border
    being present in 98% of patients. Healing characteristically leaves a
    cribriform scar, and the disease carries substantially increased mortality.
  evidence:
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinically characterized by painful, rapidly evolving cutaneous ulcers
      with undermined, irregular, erythematous-violaceous edges
    explanation: >-
      Documents the clinical output of the pathophysiologic cascade — the
      painful, rapidly evolving undermined violaceous ulcer.
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three major diagnostic criteria are rapidly progressing disease,
      assessment of relevant differential diagnoses and a reddish-violaceous
      wound border (prevalent in 98% of patients with PG).
    explanation: >-
      Quantifies the violaceous wound border at 98% of patients and confirms
      rapid progression as a defining feature of the lesion.
- name: Pathergy - Trauma-Induced Lesion Initiation
  biological_scale: TISSUE
  description: >-
    Pathergy is the induction of new lesions, or the marked enlargement of
    existing ones, at sites of minor cutaneous trauma — needle sticks, biopsies,
    surgical incisions, or chronic mechanical irritation such as an ostomy
    appliance. Mechanistically it represents a lowered threshold for triggering
    the neutrophilic inflammatory cascade in already primed skin, so trauma
    locally initiates the same pathway rather than causing a distinct process.
    This node is clinically load-bearing rather than merely descriptive: it is
    why surgical debridement and defect closure can exacerbate the injury, and
    why postsurgical pyoderma gangrenosum is a recognized entity. Pathergy is a
    minor criterion in the Delphi consensus definition and appears in the
    PARACELSUS score as localization of the lesion at a site of trauma.
  downstream:
  - target: Sterile Neutrophilic Dermal Inflammation and Tissue Destruction
    description: >-
      Minor cutaneous trauma locally triggers the neutrophilic inflammatory
      cascade, initiating or enlarging a lesion at the injured site.
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
    evidence:
    - reference: PMID:38250211
      reference_title: "Postsurgical Pyoderma Gangrenosum Requiring Plastic Surgical Intervention: A Practical Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pyoderma gangrenosum is a neutrophilic dermatosis characterized by
        immune dysfunction and pathergy.
      explanation: >-
        Directly links pathergy to the neutrophilic dermatosis process, which
        is the causal edge this link asserts.
    - reference: PMID:38250211

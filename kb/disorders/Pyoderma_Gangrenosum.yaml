        alter its participation in activation of the
      explanation: >-
        States the causal edge directly: PSTPIP1 variants alter inflammasome
        activation, which the same sentence ties to interleukin-1 production.
  evidence:
  - reference: PMID:11971877
    reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Yeast two-hybrid assays demonstrate severely reduced binding between PTP
      PEST and both the E250Q and A230T mutant proteins.
    explanation: >-
      Documents the molecular consequence of the PAPA-causing PSTPIP1/CD2BP1
      variants — loss of PTP PEST binding — in a yeast two-hybrid assay.
  - reference: PMID:21532836
    reference_title: "Clinical, Molecular, and Genetic Characteristics of PAPA Syndrome: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is a clear molecular feature of PAPA syndrome
    explanation: >-

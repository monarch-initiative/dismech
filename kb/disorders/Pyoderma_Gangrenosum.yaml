- name: PSTPIP1 Dysfunction (Monogenic PAPA Arm)
  biological_scale: MOLECULAR
  description: >-
    In PAPA syndrome (pyogenic arthritis, pyoderma gangrenosum, and acne), an
    autosomal dominant autoinflammatory disease, missense variants in
    PSTPIP1/CD2BP1 (E250Q, A230T) severely reduce binding of the PSTPIP1
    adaptor to PEST-type protein tyrosine phosphatase. The resulting
    hyper-phosphorylated PSTPIP1 protein alters its participation in
    inflammasome activation, and overproduction of IL-1beta is a clear
    molecular feature of the syndrome. This is the clean Mendelian arm that
    links a defined molecular lesion to the same IL-1/inflammasome node that
    drives sporadic pyoderma gangrenosum, of which PG is the cutaneous
    hallmark. Note this node models the mechanistic arm only: PAPA syndrome
    itself (MONDO:0011462) is a distinct disease entity and is not curated
    here.
  molecular_functions:
  - preferred_term: PSTPIP1 binding to PEST-type protein tyrosine phosphatase
    term:
      id: GO:0001784
      label: phosphotyrosine residue binding
    modifier: DECREASED
  downstream:
  - target: Inflammasome Activation and IL-1 Overproduction
    description: >-
      Hyper-phosphorylated PSTPIP1 alters inflammasome participation, producing
      IL-1beta overproduction.
    causal_link_type: DIRECT

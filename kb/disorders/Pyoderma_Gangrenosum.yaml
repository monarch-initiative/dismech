notes: >-
  Entry created for issue #9069. Curated from primary literature retrieved via
  the PubMed E-utilities API; every PMID was fetched with `just fetch-reference`
  and every snippet independently verified as an exact substring of the cached
  reference.

  DEEP RESEARCH. A `claude_code` deep-research run
  (research/Pyoderma_Gangrenosum-deep-research-claude_code.md) completed after
  the entry had already been drafted from primary literature, and was used only
  as a cross-check and lead source, not as the basis of the entry. Its own
  reference validation is clean (124/124 references resolved, 0 unresolved,
  2/2 quoted claims found in source, 0 off topic). `just preflight-dr` returns
  SKIP because MONDO records no causal gene (RO:0004003) for MONDO:0018824 —
  correct, since sporadic PG is not Mendelian — so the manual NEC preflight was
  run instead: `runoak -i sqlite:obo:mondo info MONDO:0018824 -O obo` confirms
  the label `pyoderma gangrenosum`, the Orphanet:48104 xref, and the two parents
  MONDO:0002922 (pyoderma) and MONDO:0019751 (autoinflammatory syndrome). The
  report's top gene is PSTPIP1 (19 mentions), which is the correct
  PG-associated gene, and the single OMIM it cites (604416) is PAPA syndrome,
  discussed correctly as the monogenic anchor rather than as PG itself — so no
  named entity confusion. The one substantive lead taken from the report was
  PMID:24903614 (Marzano 2014), which the report cited with a `[paraphrase]`
  marker; the real abstract was fetched and quoted verbatim instead.
  Following the PR #9115 review the report was consumed considerably more
  deeply: the GSDMD-dependent NETosis node, the PG-serum-transfer animal model,
  the susceptibility-gene set (MEFV/NLRP3/NOD2), adalimumab, topical
  clobetasol, the Su criteria, the biopsy-utility controversy, the
  systemic-disease meta-analysis, and the refuted infectious-etiology and
  solid-malignancy claims were all added — each from an independently fetched
  source quoted verbatim, never from the report's own paraphrases.

  A third review round closed the two effector arms that had been deferred. The
  earlier deferral reason recorded here — that no primary source had been
  "fetched and verified in this pass" — was an *effort* statement dressed as a
  scoping decision, and the reviewer was right to reject it: declining a claim
  because it is unsupported is legitimate, declining it because the work was not
  done is not. Both arms are now curated from disease-specific primary sources —
  `Complement C5a Generation and C5aR1 Signalling` (PMID:37516310: C5a is the
  most potent NETosis inducer among the candidates expressed in PG, acts through
  C5aR1 and ERK, and is more than 6-fold elevated in PG wound fluid) and
  `MMP-Mediated Extracellular Matrix Destruction` (PMID:20636397) — together
  with a `JAK-STAT Pathway Overactivation` node (PMID:42603447, PMID:42123319).
  The same round added the Phase II/III trial landscape. Nothing from the DR
  report is asserted on the report's own authority.

  TRIAL EVIDENCE DISCIPLINE. Five of the nine curated trials are terminated, and
  that negative record is curated as fact rather than omitted: the vilobelimab
  Phase III (NCT05964413) was stopped for futility and all three gevokizumab
  registrations were terminated. Consequently the C5a-blockade and IL-1-blockade
  treatments carry explicit negative qualifiers and must NOT be read as
  established therapy — a mechanism node can be genuinely active in disease and
  still not be the therapeutic lever, which is the point of the
  `pg_trial_attrition` discussion. Trial phase and status were taken from the
  ClinicalTrials.gov API rather than from the review or the DR report; that
  check found NCT02318914 is the open-label safety *extension* of the
  gevokizumab programme rather than a third independent randomised trial, and it
  is described as such.

  ENTITY SHAPE. MONDO:0018824 has four `is_a` children — MONDO:0035235 classic
  (exact synonym "Ulcerative pyoderma gangrenosum"), MONDO:0035236 pustular,
  MONDO:0035237 bullous, and MONDO:0035238 vegetative — and each of those four
  `has_subtypes` entries is bound to its MONDO term via `subtype_term`. The
  Peristomal subtype is correctly left unbound: MONDO has no term for it.
  (An earlier revision of this entry asserted that MONDO:0018824 had no
  children and rested the single-entry decision on that; the claim was false
  and has been removed rather than softened — see PR #9115 review and the
  correction on issue #9069.)

  The decision to model these as `has_subtypes` on one Disease entry rather
  than as four separate Disease entries does NOT rest on that ontology claim.
  It rests on the variants being differences of morphology, site and course
  within one disease process — the discriminator-expressible case — sharing a
  single pathograph, one set of diagnostic instruments, and one treatment
  ladder. Four of the five carry a real `subtype:` back-reference on a
  phenotype claim that actually differs by variant (issue #7082): Ulcerative
  (border/site/scarring), Bullous (hemorrhagic bullae, hematologic
  association), Pustular (sterile pustules), Peristomal (peristomal
  ulceration). Vegetative still has no phenotype back-reference — the sources
  available enumerate and quantify it without characterizing a distinguishing
  morphological feature in quotable form — but it is no longer bare: it now
  carries its MONDO binding, a quantified `subtype_frequency` (2 of 67), and
  its own evidence item.

  FRAMING. PG is curated as autoinflammatory, not infectious — MONDO's
  MONDO:0019751 parent is the mechanistically informative one and drives the
  pathograph. The name is a historical misnomer: the lesion is sterile, is not
  gangrene, and exclusion of infection is a formal diagnostic criterion.

  EVIDENCE DISCIPLINE. Greek letters and middle-dot decimal separators were
  avoided inside snippets where the cached rendering is ambiguous (PMID:29742056
  renders "(IL)- 1beta" with an interior space; PMID:24903614 uses "P = 0·0001"
  with a middle dot; PMID:21532836 uses a Unicode beta), so descriptions say
  "IL-1beta" while snippets quote only spans that are unambiguously present in
  the cached text. The ~50% associated-systemic-disease figure commonly quoted
  for PG is NOT asserted as a single number: the population-based cohort gives
  33% and a hospital inpatient series 47.8%, and both are curated with their
  populations because they are not measuring the same thing.

  SCOPE. PAPA syndrome (MONDO:0011462, PSTPIP1) is an open curation stub and is
  deliberately NOT curated here — it is cross-referenced as the monogenic arm
  only. A kb/comorbidities/ entry for the PG-IBD relationship is likewise left
  as tracked follow-up in `discussions`. No existing mechanism module was a
  clean fit: the closest conceptual neighbours (`granuloma_formation`,
  `fibrotic_response`) model different processes, and a neutrophilic-dermatosis
  or IL-1/inflammasome module does not exist, so no `conforms_to` is declared.
  Sweet_Syndrome already lists pyoderma gangrenosum as a differential diagnosis;
  this entry reciprocates, and the two are kept as distinct entities.

has_subtypes:
- name: Ulcerative
  display_name: Classic ulcerative pyoderma gangrenosum
  subtype_term:
    preferred_term: Classic (ulcerative) pyoderma gangrenosum
    term:
      id: MONDO:0035235
      label: classic pyoderma gangrenosum
  description: >-
    The classic and by far most common variant: a deep, rapidly enlarging,
    exquisitely painful ulcer with an undermined, irregular,
    erythematous-violaceous border, most often on the lower leg, healing with a
    cribriform ("wrinkled paper") scar. This is the variant for which the
    Delphi consensus diagnostic criteria and the PARACELSUS score were
    developed and validated. MONDO:0035235 carries "Ulcerative pyoderma
    gangrenosum" as an exact synonym, which is why this subtype is named
    Ulcerative here.
  subtype_frequency: >-
    Predominant variant: 62 of 67 patients (93%) in a Japanese multicentre
    adalimumab cohort had ulcerative PG.
  evidence:
  - reference: PMID:42107018
    reference_title: "Safety and Effectiveness of Adalimumab for the Treatment of Pyoderma Gangrenosum: A 52-Week Real-World Prospective Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PG subtypes among the enrolled patients were ulcerative (n = 62),
      pustular (n = 2), vegetative (n = 2), and bullous (n = 1).
    explanation: >-
      Quantifies the ulcerative variant as overwhelmingly predominant (62 of
      67) in a prospective multicentre PG cohort.
- name: Bullous
  display_name: Bullous (atypical) pyoderma gangrenosum
  subtype_term:
    preferred_term: Bullous (atypical) pyoderma gangrenosum
    term:
      id: MONDO:0035237
      label: bullous pyoderma gangrenosum
  description: >-
    An atypical, more superficial variant presenting with rapidly extending
    hemorrhagic bullae, and characteristically associated with
    myeloproliferative and other hematologic disorders — so its recognition
    should prompt hematologic evaluation.
- name: Pustular
  display_name: Pustular pyoderma gangrenosum
  subtype_term:
    preferred_term: Pustular pyoderma gangrenosum
    term:
      id: MONDO:0035236
      label: pustular pyoderma gangrenosum
  description: >-
    A variant in which discrete painful sterile pustules arise and may remain
    pustular without progressing to frank ulceration; classically described in
    the setting of active inflammatory bowel disease.
- name: Vegetative
  display_name: Vegetative (superficial granulomatous) pyoderma gangrenosum
  subtype_term:
    preferred_term: Vegetative (superficial granulomatous) pyoderma gangrenosum
    term:
      id: MONDO:0035238
      label: vegetative pyoderma gangrenosum
  description: >-
    A localized, superficial and more indolent variant, recognized both by
    MONDO as a distinct child concept and in clinical cohorts alongside the
    ulcerative, bullous and pustular forms, where it is uncommon (2 of 67
    patients in a prospective multicentre series). Its milder course has a
    measured mechanistic correlate: myeloperoxidase, IL-8 and MMP-9 are
    expressed significantly less in vegetative PG than in the ulcerative and
    bullous variants, i.e. less neutrophil-effector and MMP-mediated matrix
    destruction.
  subtype_frequency: >-
    Uncommon: 2 of 67 patients (3%) in a Japanese multicentre adalimumab
    cohort.
  evidence:
  - reference: PMID:42107018
    reference_title: "Safety and Effectiveness of Adalimumab for the Treatment of Pyoderma Gangrenosum: A 52-Week Real-World Prospective Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PG subtypes among the enrolled patients were ulcerative (n = 62),
      pustular (n = 2), vegetative (n = 2), and bullous (n = 1).
    explanation: >-
      Documents and quantifies the vegetative variant as a recognized but
      uncommon clinical form in a prospective PG cohort.
- name: Peristomal
  display_name: Peristomal pyoderma gangrenosum
  description: >-
    PG arising in the skin immediately surrounding an abdominal stoma,
    predominantly in patients with inflammatory bowel disease who have had an
    ostomy. Chronic mechanical irritation from the appliance is a plausible
    pathergic trigger, and appliance-related risk factors (pouch belt use,
    higher BMI) are associated with its development.

mechanistic_hypotheses:
- hypothesis_group_id: autoinflammatory_neutrophil_model
  hypothesis_label: Autoinflammatory inflammasome/IL-1-driven neutrophil recruitment
  status: CANONICAL
  description: >-
    Pyoderma gangrenosum is modeled as an autoinflammatory disease of the
    innate immune system rather than an infection or a classical
    autoantibody-mediated autoimmune disease. Exaggerated inflammasome activation in
    genetically predisposed individuals drives interleukin-1 overproduction,
    which — amplified by a T helper 17/T helper 1-skewed adaptive layer
    supplying TNF, IL-8, IL-17, IL-23 and IL-36 — recruits and activates
    neutrophils into the dermis, producing the sterile neutrophil-dominant
    infiltrate that destroys tissue and yields the characteristic ulcer.
    Direct protein-array measurement in PG lesional skin supports the
    framework, but the primary literature is explicit that the exact
    pathogenesis is not yet fully understood.
  evidence:
  - reference: PMID:24903614
    reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over-expression of cytokines/chemokines and molecules amplifying the
      inflammatory network supports the view that PG and SS are
      autoinflammatory diseases.
    explanation: >-
      Direct measurement in PG lesional skin supporting the autoinflammatory
      classification that this hypothesis group models.
  - reference: PMID:33033263
    reference_title: "Pyoderma gangrenosum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cause of PG is not well understood, but PG is generally considered an
      autoinflammatory disorder.
    explanation: >-
      The authoritative Nature Reviews Disease Primers overview endorses the
      autoinflammatory framing while stating the cause is not well understood —
      supporting the model and its hedging simultaneously.
  - reference: PMID:33033263
    reference_title: "Pyoderma gangrenosum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies have focused on the role of T cells, especially at the wound
      margin; these cells may support the destructive autoinflammatory response
      by the innate immune system.
    explanation: >-
      Records the adaptive (wound-margin T cell) contribution to an
      innate-driven process, the interface this hypothesis group models;
      PARTIAL because the source hedges with "may support".
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T helper 17/T helper 1-skewed inflammation and exaggerated inflammasome
      activation lead to a dysregulated neutrophil-dominant milieu
    explanation: >-
      States the inflammasome-driven, Th17/Th1-amplified neutrophil-dominant
      mechanism that this hypothesis group models.
  - reference: PMID:37610614
    reference_title: "Pyoderma Gangrenosum: Treatment Options."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the exact pathogenesis is not yet fully understood, various
      auto-inflammatory phenomena with increased neutrophil granulocyte
      activity have been demonstrated.
    explanation: >-
      Supports the autoinflammatory framing while recording explicitly that the
      pathogenesis remains incompletely established — the reason this is
      curated as a hypothesis rather than a settled chain.
- hypothesis_group_id: follicular_unit_initiation
  hypothesis_label: Follicular unit as the putative initiating target
  status: EMERGING
  description: >-
    An emerging refinement holds that the pilosebaceous (follicular) unit is
    the initial target of the inflammatory process in pyoderma gangrenosum,
    which would explain the frequent follicular-based onset of lesions as
    papules or pustules that then ulcerate, and the overlap of PG with other
    follicular neutrophilic diseases (acne, hidradenitis suppurativa) in the
    PASH/PAPASH spectrum. This is presented in the literature as increasingly
    recognized rather than established.
  evidence:
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      involves a profound dysregulation of components of both innate and
      adaptive immunity in genetically predisposed individuals, with the
      follicular unit increasingly recognized as the putative initial target
    explanation: >-
      Directly states the follicular unit as the putative initial target, with
      the hedging ("increasingly recognized as the putative") that justifies an
      EMERGING rather than CANONICAL status.

- hypothesis_group_id: infectious_etiology
  hypothesis_label: Infectious etiology (historical, refuted)
  status: DEPRECATED
  description: >-
    The name "pyoderma gangrenosum" encodes a historical hypothesis that the
    disease is a pyogenic infection producing gangrene. Both halves are wrong.
    PG was initially thought to be an infectious disease and was subsequently
    reclassified as an inflammatory one; the lesion is sterile, culture is
    negative, exclusion of infection is a formal minor criterion of the
    validated Delphi definition, and the disease responds to immunosuppression
    rather than to antibiotics. This hypothesis is curated explicitly, rather
    than silently omitted, because the misnomer actively misleads — it is why
    PG ulcers are debrided as though infected, which triggers pathergy.
  evidence:
  - reference: PMID:40034857
    reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, PG was thought to be an infectious disease and was later
      corrected to be an inflammatory skin disease.
    explanation: >-
      Directly records that the infectious hypothesis was held historically and
      has been corrected, refuting it as the current model.
  - reference: PMID:40034857
    reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyoderma gangrenosum (PG) is characterized by the agonizing necrotizing
      ulcers with non-infectious neutrophil infiltration.
    explanation: >-
      States the infiltrate is non-infectious, contradicting an infectious
      etiology.
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8 minor criteria: (1) exclusion of infection; (2) pathergy
    explanation: >-
      Exclusion of infection being a formal diagnostic criterion is
      incompatible with an infectious etiology.

pathophysiology:
- name: Inflammasome Activation and IL-1 Overproduction
  biological_scale: MOLECULAR
  description: >-
    The proximal molecular lesion in pyoderma gangrenosum is exaggerated,
    inappropriately triggered activation of the inflammasome in innate immune
    cells of genetically predisposed individuals, leading to overproduction of
    interleukin-1 (IL-1beta and IL-1alpha). Protein-array profiling of PG
    lesional skin shows significantly higher expression of IL-1 beta and its
    receptor I than in normal skin, and IL-1beta is the pivotal cytokine
    driving the downstream exaggerated production of cytokines and chemokines
    that recruit neutrophils. This node is the point at which the monogenic
    PAPA/PSTPIP1 arm and the far commoner sporadic disease converge, and it is
    the rationale for IL-1 blockade as therapy.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Inflammasome-mediated signaling pathway
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
    modifier: INCREASED
  - preferred_term: Interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  downstream:
  - target: Th17/Th1-Skewed Cytokine Amplification
    description: >-
      IL-1 overproduction drives the exaggerated secondary cytokine and
      chemokine output that amplifies the inflammatory response.
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
  evidence:
  - reference: PMID:24903614
    reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expressions of interleukin (IL)-1 beta and its receptor I were
      significantly higher in PG
    explanation: >-
      Direct measurement of IL-1 beta and IL-1 receptor I overexpression in PG
      lesional skin versus controls, grounding this node in PG-specific data
      rather than extrapolation.
  - reference: PMID:29742056
    reference_title: "A dermatologic perspective on autoinflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations cause an uncontrolled activation of the inflammasome
    explanation: >-
      Establishes uncontrolled inflammasome activation as the proximal
      mechanism in the IL-1-mediated autoinflammatory diseases of which PAPA
      syndrome (whose cutaneous hallmark is PG) is one.
  - reference: PMID:29742056
    reference_title: "A dermatologic perspective on autoinflammatory diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is the pivotal cytokine which is responsible for the exaggerated
      production of cytokines and chemokines that induce the recruitment of
      neutrophils, key cells in autoinflammation
    explanation: >-
      Identifies IL-1beta as the pivotal cytokine linking inflammasome
      activation to the downstream chemokine output and neutrophil recruitment
      modeled by the next nodes.
- name: Th17/Th1-Skewed Cytokine Amplification
  biological_scale: CELLULAR
  description: >-
    Downstream of IL-1, a T helper 17/T helper 1-skewed adaptive layer amplifies
    the innate signal, producing high levels of tumor necrosis factor-alpha,
    IL-1beta, IL-1alpha, IL-8/CXCL8, IL-12, IL-15, IL-17, IL-23 and IL-36. In PG
    lesional skin specifically, the chemokines IL-8, CXCL1/2/3, CXCL16 and
    RANTES are over-expressed, and this chemokine signal is stronger than in
    Sweet syndrome. This profile is the direct rationale for the biologic
    therapies used in PG — TNF, IL-1, IL-17, IL-23 and complement C5a
    inhibitors — and it is why pyoderma gangrenosum sits at the interface of
    innate autoinflammation and adaptive immunity rather than being purely
    innate.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  biological_processes:
  - preferred_term: Positive regulation of inflammatory response
    term:
      id: GO:0050729
      label: positive regulation of inflammatory response
    modifier: INCREASED
  downstream:
  - target: Neutrophil Recruitment to the Dermis
    description: >-
      The amplified cytokine/chemokine milieu (notably IL-8/CXCL8 and TNF)
      recruits neutrophils into the dermis.
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
  evidence:
  - reference: PMID:24903614
    reference_title: "Expression of cytokines, chemokines and other effector molecules in two prototypic autoinflammatory skin diseases, pyoderma gangrenosum and Sweet's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In PG, chemokines such as IL-8
    explanation: >-
      Reports over-expression of the neutrophil-recruiting chemokine IL-8 (and
      CXCL1/2/3, CXCL16, RANTES) in PG lesional skin, the amplification output
      this node models.
  - reference: PMID:35606650
    reference_title: "Pyoderma Gangrenosum: An Updated Literature Review on Established and Emerging Pharmacological Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T helper 17/T helper 1-skewed inflammation and exaggerated inflammasome
      activation lead to a dysregulated neutrophil-dominant milieu
    explanation: >-
      Documents the Th17/Th1-skewed amplification layer sitting between

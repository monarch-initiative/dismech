- name: JAK-STAT Pathway Overactivation
  biological_scale: MOLECULAR
  description: >-
    The JAK/STAT pathway is the common downstream transducer for most of the
    cytokines this entry already models (IL-6, IL-12, IL-23, interferons), and
    single-cell RNA sequencing with multiplex immunohistochemistry shows it
    significantly overactivated in PG lesions — particularly in advanced-stage
    lesions — driven chiefly by myeloid cells and T cells. The activation is
    associated with enhanced NET formation in myeloid cells and with aberrant
    Th17 / Th17.1 differentiation and plasticity, so it converges on two nodes
    already in this pathograph. Independent multi-omics work identifies JAK2 and
    STAT3 as the network hubs of an inflammatory module conserved between PG
    skin and IBD gut, which is the molecular candidate for the gut-skin axis
    behind PG's commonest systemic association. This node is the rationale for
    JAK inhibition (tofacitinib, baricitinib), which remains investigational.
  cell_types:
  - preferred_term: Myeloid cell
    term:
      id: CL:0000763
      label: myeloid cell
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: JAK-STAT cascade
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  downstream:
  - target: GSDMD-Dependent NETosis
    description: >-
      JAK/STAT overactivation in myeloid cells is associated with enhanced
      neutrophil extracellular trap formation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
    evidence:
    - reference: PMID:42603447
      reference_title: "Preliminary exploration of effects of the JAK inhibitor tofacitinib on pyoderma gangrenosum: In vitro inhibition of NETs and Th17 differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro cell experiments further demonstrated that the JAK inhibitor
        tofacitinib suppresses STAT phosphorylation in myeloid and T cells,
        myeloid NETosis, and IL-17A production.
      explanation: >-
        Pharmacological JAK inhibition suppresses myeloid NETosis, supporting a
        causal JAK/STAT to NETosis edge.
  - target: Th17/Th1-Skewed Cytokine Amplification
    description: >-
      JAK/STAT overactivation drives aberrant Th17 and Th17.1 differentiation
      and IL-17A production.
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoinflammatory_neutrophil_model
  evidence:
  - reference: PMID:42603447
    reference_title: "Preliminary exploration of effects of the JAK inhibitor tofacitinib on pyoderma gangrenosum: In vitro inhibition of NETs and Th17 differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified significant overactivation of the JAK/STAT pathway in PG
      lesions-particularly in advanced stages-which, in terms of immune
      inflammation, is primarily driven by myeloid cells and T cells.
    explanation: >-
      Single-cell and multiplex-IHC evidence of JAK/STAT overactivation in human
      PG lesional tissue, establishing this node in the disease itself.
  - reference: PMID:42123319
    reference_title: "Integrative Multi-Omics Analysis and Computational Modeling Identifying Shared Inflammatory Pathways and JAK Inhibitor Targets in PG and IBD."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Transcriptomic analysis identified a cross-tissue conserved inflammatory
      module centered on the JAK-STAT pathway, with JAK2 and STAT3 identified as
      network hubs.
    explanation: >-
      Independent multi-omics support for a JAK-STAT-centred module shared
      between PG and IBD; graded PARTIAL and COMPUTATIONAL because the study is
      entirely in silico and states it lacks experimental validation.
- name: Complement C5a Generation and C5aR1 Signalling
  biological_scale: MOLECULAR
  description: >-
    Complement activation generates the anaphylatoxin C5a, which signals through
    its receptor C5aR1 on neutrophils. In pyoderma gangrenosum this is the named
    proximal driver of NET release: among the candidate inducers expressed in PG
    (IL-1 beta, IL-6, IL-8 and C5aR1), C5a is the most potent inducer of NETosis,
    acting dose-dependently within 30 minutes and specifically through C5aR1 and
    ERK — C5aR blockade with avacopan and ERK inhibition each abolish it. The
    axis is active in human disease, not only in culture: C5a in PG wound fluid
    is more than 6-fold higher than in traumatic wound fluid, at concentrations
    sufficient to induce NETosis, and correlates with neutrophil elastase levels.
    C5a is also a classical neutrophil chemoattractant, so it plausibly
    contributes to recruitment as well as to NET release; only the NETosis arm is
    modeled as a causal edge here.
  cell_types:

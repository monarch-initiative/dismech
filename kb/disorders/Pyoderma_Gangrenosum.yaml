name: Pyoderma Gangrenosum
creation_date: "2026-08-20T00:00:00Z"
category: Complex
disease_term:
  preferred_term: Pyoderma gangrenosum
  term:
    id: MONDO:0018824
    label: pyoderma gangrenosum
parents:
- Neutrophilic dermatosis
- Autoinflammatory syndrome
description: >-
  Pyoderma gangrenosum (PG) is a rare, primarily sterile inflammatory
  neutrophilic dermatosis characterized by recurrent, rapidly progressive and
  exquisitely painful cutaneous ulceration with undermined, irregular
  violaceous borders and a mucopurulent or hemorrhagic exudate. Despite a name
  that implies infection and gangrene, PG is neither: it is an autoinflammatory
  disease of dysregulated innate immunity, and MONDO classifies it under both
  pyoderma and autoinflammatory syndrome. Pathogenesis centers on exaggerated
  inflammasome activation with interleukin-1 overproduction, amplified by a
  T helper 17/T helper 1-skewed cytokine milieu (TNF, IL-8, IL-17, IL-23,
  IL-36), producing a neutrophil-dominant sterile infiltrate that destroys
  dermal tissue. Pathergy — new or enlarging lesions at sites of minor trauma —
  is a defining and clinically load-bearing feature, because it is why surgical
  debridement can worsen the disease. Recognized clinical variants (classic
  ulcerative, bullous, pustular, vegetative, and peristomal) differ in
  morphology, site, course, and disease associations. A substantial minority to
  roughly half of patients have an associated systemic disease, most often
  inflammatory bowel disease, inflammatory arthritis, or a hematologic
  disorder/monoclonal gammopathy. The monogenic anchor for the mechanism is
  PAPA syndrome (pyogenic arthritis, pyoderma gangrenosum, and acne), caused by
  PSTPIP1/CD2BP1 variants that drive inflammasome-dependent IL-1beta
  overproduction. Diagnosis was historically one of exclusion; validated
  instruments (the Delphi consensus criteria for ulcerative PG and the
  PARACELSUS score) now allow a positive diagnosis.


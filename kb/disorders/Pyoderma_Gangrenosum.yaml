      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, both procedures may exacerbate the injury.
      explanation: >-
        Documents that surgical debridement and closure can worsen the lesion —
        the clinically load-bearing consequence of this pathergic edge.
  evidence:
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      extreme pain > 4/10 on a visual analogue scale and localization of lesion
      at the site of the trauma
    explanation: >-
      Records localization of the lesion at the site of trauma (pathergy) as a
      scored minor diagnostic criterion for PG.
  - reference: PMID:38250211
    reference_title: "Postsurgical Pyoderma Gangrenosum Requiring Plastic Surgical Intervention: A Practical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, it is frequently seen in patients with underlying systemic

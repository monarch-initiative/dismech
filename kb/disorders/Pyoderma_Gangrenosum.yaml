- name: MMP-Mediated Extracellular Matrix Destruction
  biological_scale: TISSUE
  description: >-
    Matrix metalloproteinases released within the neutrophil-rich infiltrate —
    principally MMP-2 and MMP-9, alongside neutrophil elastase from NETs —
    degrade dermal extracellular matrix and are the proximate effectors of
    tissue loss. Immunohistochemistry of PG lesions shows MMP-2 and MMP-9
    significantly elevated versus controls. Importantly this arm is
    subtype-graded rather than uniform: myeloperoxidase, IL-8 and MMP-9 are
    expressed more strongly in ulcerative and bullous PG than in vegetative PG,
    which is the mechanistic correlate of vegetative disease being the
    superficial, indolent, less destructive variant.

histopathology:
- name: Neutrophilic Infiltrate at the Ulcer Edge
  finding_term:
    preferred_term: Neutrophilic infiltrate on biopsy of the ulcer edge
    term:
      id: NCIT:C35978
      label: Inflammatory Infiltrate
  diagnostic: true
  description: >-
    Biopsy of the ulcer edge demonstrating a neutrophilic infiltrate is the
    single MAJOR criterion in the Delphi consensus diagnostic definition of
    ulcerative pyoderma gangrenosum. The infiltrate is sterile — cultures are
    negative and exclusion of infection is a separate minor criterion — which
    is what distinguishes it histologically and microbiologically from an
    infective ulcer. Suppurative inflammation on histopathology also features
    among the PARACELSUS criteria.
  evidence:
  - reference: PMID:29450466
    reference_title: "Diagnostic Criteria of Ulcerative Pyoderma Gangrenosum: A Delphi Consensus of International Experts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This Delphi exercise produced 1 major criterion and 8 minor criteria for
      the diagnosis of ulcerative pyoderma gangrenosum.
    explanation: >-
      Confirms the single-major-criterion structure whose major criterion is
      the ulcer-edge neutrophilic infiltrate.
  - reference: PMID:29388188
    reference_title: "The PARACELSUS score: a novel diagnostic tool for pyoderma gangrenosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three additional criteria (observed in up to 60% of patients with PG)
      encompass suppurative inflammation in histopathology, undermined wound
      borders and systemic disease associated.
    explanation: >-
      Documents suppurative (neutrophilic) inflammation on histopathology as a
      scored diagnostic feature, observed in up to 60% of PG patients.

genetic:
- name: PSTPIP1
  notes: >-
    PSTPIP1 (also CD2BP1) encodes a proline-serine-threonine phosphatase
    interacting adaptor protein. Autosomal dominant missense variants (E250Q,
    A230T) cause PAPA syndrome, in which pyoderma gangrenosum is the cutaneous
    hallmark, by disrupting binding to PEST-type protein tyrosine phosphatase
    and dysregulating inflammasome-dependent IL-1beta production. PSTPIP1 is
    the causal gene of the monogenic PAPA/PASH/PAPASH spectrum rather than of
    common sporadic pyoderma gangrenosum, which is not a Mendelian disease; it
    is curated here because it anchors the IL-1 mechanism, not as a cause of
    sporadic PG. Typed MODIFIER for that reason.
  gene_term:
    preferred_term: PSTPIP1
    term:
      id: hgnc:9580
      label: PSTPIP1
  relationship_type: MODIFIER
  variants:
  - name: PSTPIP1 p.Ala230Thr (A230T)
    description: >-
      Missense substitution in the CDC15-homologous domain, co-segregating with
      PAPA syndrome and severely reducing PSTPIP1 binding to PEST-type protein
      tyrosine phosphatase. Pathogenic for PAPA syndrome, not for sporadic PG.
    type: missense variant
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: PSTPIP1
      term:
        id: hgnc:9580
        label: PSTPIP1
    evidence:
    - reference: PMID:11971877
      reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        E250Q or A230T amino acid substitutions occur within a domain highly
        homologous to yeast cleavage furrow-associated protein CDC15.
      explanation: >-
        Identifies A230T as one of the two originally reported PAPA-causing
        substitutions and localizes it to the CDC15-homologous domain.
  - name: PSTPIP1 p.Glu250Gln (E250Q)
    description: >-
      Missense substitution in the CDC15-homologous domain, co-segregating with
      PAPA syndrome and severely reducing PSTPIP1 binding to PEST-type protein
      tyrosine phosphatase. Pathogenic for PAPA syndrome, not for sporadic PG.
    type: missense variant
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: PSTPIP1
      term:
        id: hgnc:9580
        label: PSTPIP1
    evidence:
    - reference: PMID:11971877
      reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Yeast two-hybrid assays demonstrate severely reduced binding between
        PTP PEST and both the E250Q and A230T mutant proteins.
      explanation: >-
        Demonstrates the functional consequence of E250Q — loss of PTP PEST
        binding — in a yeast two-hybrid assay.
  evidence:
  - reference: PMID:11971877
    reference_title: "Mutations in CD2BP1 disrupt binding to PTP PEST and are responsible for PAPA syndrome, an autoinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have now established this by the identification of co-segregating
      disease-causing mutations in the CD2-binding protein 1
    explanation: >-
      Establishes co-segregating disease-causing CD2BP1/PSTPIP1 mutations as
      the cause of PAPA syndrome.
  - reference: PMID:21532836
    reference_title: "Clinical, Molecular, and Genetic Characteristics of PAPA Syndrome: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is an autosomal dominant, hereditary auto-inflammatory disease arising
      from mutations in the PSTPIP1/CD2BP1 gene on chromosome 15q
    explanation: >-
      Confirms PSTPIP1/CD2BP1 as the gene of the autosomal dominant PAPA
      syndrome in which PG is a defining feature.
- name: MEFV
  notes: >-
    MEFV encodes pyrin, an inflammasome component that PSTPIP1 binds, so MEFV
    sits on the same IL-1/inflammasome axis this entry's pathograph models.
    Typed SUSCEPTIBILITY rather than causal: sporadic PG is not Mendelian, and
    the cited source reports these as reported susceptibility genes, not as
    proven monogenic causes of common PG.
  gene_term:
    preferred_term: MEFV
    term:
      id: hgnc:6998
      label: MEFV
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:40034857
    reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disease has genetic susceptibility, and genes related to the onset
      of PG reported in the literature include PTPN6, PSTPIP1, MEFV, NLRP3,
      NLRP12, LPIN2, and NOD2
    explanation: >-
      Lists MEFV among the reported genetic-susceptibility genes for pyoderma
      gangrenosum onset.
- name: NLRP3
  notes: >-
    NLRP3 encodes the sensor of the canonical NLRP3 inflammasome, the assembly
    that licenses IL-1beta maturation — the proximal node of this entry's
    pathograph. Typed SUSCEPTIBILITY for the same reason as MEFV.
  gene_term:
    preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:40034857
    reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disease has genetic susceptibility, and genes related to the onset
      of PG reported in the literature include PTPN6, PSTPIP1, MEFV, NLRP3,
      NLRP12, LPIN2, and NOD2
    explanation: >-
      Lists NLRP3 among the reported genetic-susceptibility genes for pyoderma
      gangrenosum onset.
- name: JAK2
  notes: >-
    JAK2 appears in the PG genetic literature from two independent directions.
    A systematic review of 208 articles describing 823 PG cases found two
    patients with JAK2 mutations (and two with MTHFR) — a very small share, so
    this is curated as a rare reported association, not a common determinant.
    Separately, computational multi-omics analysis identifies JAK2 (with STAT3)
    as a network hub of the inflammatory module shared between PG and IBD, and
    JAK2 is the target of the JAK inhibitors curated as investigational
    treatment. SCOPE CAUTION: the systematic review reports "mutations in JAK2"
    without specifying the allele or its somatic/germline origin, so this entry
    deliberately does NOT assert JAK2 V617F or a SOMATIC `variant_origin`,
    despite V617F being the canonical JAK2 allele in the myeloproliferative
    neoplasms that constitute part of PG's hematologic association. Asserting
    it would go beyond the cited sources.
  gene_term:
    preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:25350484
    reference_title: "The genetics of pyoderma gangrenosum and implications for treatment: a systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients had mutations in MTHFR and two had mutations in JAK2.
    explanation: >-
      Documents JAK2 mutations in PG, in 2 of 823 reviewed cases — supporting a
      rare association and nothing stronger.
  - reference: PMID:42123319
    reference_title: "Integrative Multi-Omics Analysis and Computational Modeling Identifying Shared Inflammatory Pathways and JAK Inhibitor Targets in PG and IBD."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      with JAK2 and STAT3 identified as network hubs
    explanation: >-
      Identifies JAK2 as a hub of the PG-IBD shared inflammatory module;
      COMPUTATIONAL because the study is entirely in silico.
- name: NOD2
  notes: >-
    NOD2 is the strongest Crohn disease susceptibility gene and is also
    reported among PG susceptibility genes — mechanistically interesting given
    that inflammatory bowel disease is PG's commonest systemic association.
    Typed SUSCEPTIBILITY.
  gene_term:
    preferred_term: NOD2
    term:
      id: hgnc:5331
      label: NOD2
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:40034857
    reference_title: "Gasdermin D-dependent neutrophil extracellular traps exacerbate cytokine storm contributing to pyoderma gangrenosum pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disease has genetic susceptibility, and genes related to the onset
      of PG reported in the literature include PTPN6, PSTPIP1, MEFV, NLRP3,
      NLRP12, LPIN2, and NOD2
    explanation: >-
      Lists NOD2 among the reported genetic-susceptibility genes for pyoderma
      gangrenosum onset.


animal_models:
- name: Bmp4 heterozygous null mouse
  species: Mouse
  genotype: Bmp4+/-
  publication: PMID:18925664
  modeled_mechanisms:
  - target: Disrupted Extraocular BMP4 Developmental Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Heterozygous null mice have polydactyly and ocular anterior segment abnormalities.
    limitations: >-
      Cited here only as restated in a human case report; the primary mouse study was not read for this entry, and the
      report does not say whether the mice have microphthalmia.
    evidence:
    - reference: PMID:18925664
      reference_title: "Heterozygous deletion at 14q22.1-q22.3 including the BMP4 gene in a patient with psychomotor retardation, congenital corneal opacity and feet polysyndactyly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: Bmp4 heterozygous null mice revealed skeletal abnormalities including polydactyly and ocular anterior segment abnormalities
      explanation: Secondary statement of the mouse haploinsufficiency phenotype.
notes: >-
  Scope follows ClinGen, which lumps every BMP4 case with ocular features into this entity. Non-syndromic orofacial
  clefting from BMP4 variants without eye involvement (OMIM orofacial cleft 11) is outside it and is carried as a subtype of
  the Cleft_Lip_Palate entry; the BMP4 "Stickler-like" family is inside it because its features are ocular. Deletions of
  14q22 may also remove OTX2, a separate cause of anophthalmia with pituitary involvement, so deletion phenotypes cannot all
  be credited to BMP4; the GMFB gene is a proposed contributor to developmental delay in one deletion. Bakrania et al. also
  report patients with low-penetrance variants in both BMP4 and SHH or PTCH1 (PMID:18252212), which suggests Hedgehog
  pathway modifiers but is not recorded as digenic inheritance. Coloboma rests on one case-level report, the
  Bakrania index proband as restated in PMID:21340693. The Stickler-like family's vitreoretinal, hearing and palatal findings
  are recorded but not wired into the pathograph: the source proposes a BMP4 interaction with TGF-beta and COL2A1 only as
  speculation, so no mechanism node is asserted for them. No GeneReviews chapter covers BMP4.

name: BMP4-Related Ocular Growth Disorder
description: >-
  Autosomal dominant developmental eye disorder caused by heterozygous loss-of-function variants in BMP4, or deletions of
  14q22 that remove it. BMP4 is a secreted TGF-beta superfamily morphogen expressed in the optic vesicle, developing retina
  and lens, pituitary region and digits. The ocular presentation ranges from anophthalmia and microphthalmia to sclerocornea,
  Peters anomaly, anterior segment malformation, retinal dystrophy and myopia; extraocular features include brain
  anomalies, pituitary hormone deficiency, postaxial polydactyly, growth delay, developmental delay, diaphragmatic hernia
  and renal dysplasia. Expressivity is highly variable and non-penetrance is documented, including carriers without
  microphthalmia. ClinGen lumps all BMP4 cases with ocular features, including OMIM syndromic microphthalmia 6, into this
  entity and classifies the relationship as Definitive. In mouse embryos the level of BMP4 signaling sets the dorso-ventral
  domains and growth of the optic cup.

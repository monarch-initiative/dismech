pathophysiology:
- name: BMP4 Haploinsufficiency
  description: >-
    Nonsense, frameshift and deletion alleles remove one functional copy of BMP4, halving the supply of a secreted
    morphogen whose dose matters during eye, pituitary and digit development.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: BMP4
      term:
        id: hgnc:1071
        label: BMP4
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: BMP4
    term:
      id: hgnc:1071
      label: BMP4
  molecular_functions:
  - preferred_term: BMP4 ligand (cytokine) activity
    modifier: DECREASED
    term:
      id: GO:0005125
      label: cytokine activity
  evidence:
  - reference: PMID:18925664
    reference_title: "Heterozygous deletion at 14q22.1-q22.3 including the BMP4 gene in a patient with psychomotor retardation, congenital corneal opacity and feet polysyndactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These previous reports support that a haplo-insufficiency of the BMP4 gene likely caused the congenital ocular and
      digit abnormalities.
    explanation: Haploinsufficiency inferred from a 14q22 deletion and earlier cases.
  - reference: PMID:21340693
    reference_title: BMP4 loss-of-function mutations in developmental eye disorders including SHORT syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss-of-function BMP4 mutations have never been reported in control populations
    explanation: Loss-of-function alleles are absent from controls.
  downstream:
  - target: Disrupted Dorso-Ventral Patterning of the Optic Cup
    description: The dorsal optic vesicle reads BMP4 dose to set its transcription factor domains.
    evidence:
    - reference: PMID:17173667
      reference_title: The level of BMP4 signaling is critical for the regulation of distinct T-box gene expression domains and growth along the dorso-ventral axis of the optic cup.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data show that the level of BMP4 signaling is critical for the regulation of distinct Tbx2, Tbx3, Tbx5 and Vax2
        gene expression domains along the dorso-ventral axis of the mouse optic cup.
      explanation: Dose dependence of optic cup patterning in mouse embryo culture.
  - target: Failed Optic Cup Formation and Lens Induction
    description: BMP4 is needed for the optic vesicle to become an optic cup and to induce the lens.
    evidence:
    - reference: PMID:19906857
      reference_title: Lhx2 links the intrinsic and extrinsic factors that control optic cup formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Of the signaling pathways examined, only BMP signaling is noticeably altered and Bmp4 and Bmp7 mRNAs are
        undetectable.
      explanation: Loss of Bmp4 expression accompanies arrest before optic cup formation in Lhx2-null mice.
  - target: Disrupted Extraocular BMP4 Developmental Signaling
    description: The same reduction acts in the pituitary region, digits and brain, where BMP4 is also expressed.
    evidence:
    - reference: PMID:18252212
      reference_title: "Mutations in BMP4 cause eye, brain, and digit developmental anomalies: overlap between the BMP4 and hedgehog signaling pathways."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we demonstrate expression of BMP4 in optic vesicle, developing retina and lens, pituitary region, and digits strongly
        supporting BMP4 as a causative gene for AM, pituitary, and poly/syndactyly
      explanation: Human embryo expression matches the tissues affected in patients.
- name: Disrupted Dorso-Ventral Patterning of the Optic Cup
  description: >-
    BMP4 from the dorsal optic vesicle forms a dorsal-high gradient that sets Tbx2, Tbx3, Tbx5 and Vax2 domains and opposes
    ventralizing Sonic hedgehog. Reduced BMP4 is expected to shift these domains and disturb optic cup growth; this step is
    shown in mouse and chick, not in patient tissue.
  biological_scale: TISSUE
  locations:
  - preferred_term: optic cup
    term:
      id: UBERON:0003072
      label: optic cup
  biological_processes:
  - preferred_term: dorsal/ventral pattern formation of the optic cup
    modifier: ABNORMAL
    term:
      id: GO:0009953
      label: dorsal/ventral pattern formation
  evidence:
  - reference: PMID:17173667
    reference_title: The level of BMP4 signaling is critical for the regulation of distinct T-box gene expression domains and growth along the dorso-ventral axis of the optic cup.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore we show that the correct level of BMP4 signaling is critical for normal growth of the mammalian embryonic
      eye.
    explanation: BMP4 dose controls optic cup growth as well as patterning.
  - reference: PMID:19854269
    reference_title: Sonic hedgehog is involved in formation of the ventral optic cup by limiting Bmp4 expression to the dorsal domain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      In the dorsal part of the developing retina, Bmp4 is expressed and antagonizes the ventralizing effects of Shh signaling
      through the activation of Tbx5 expression in chick and Xenopus.
    explanation: Background statement of BMP4's dorsal role opposing Shh.
  downstream:
  - target: Microphthalmia
  - target: Coloboma
  - target: Retinal dystrophy
  - target: Myopia
- name: Failed Optic Cup Formation and Lens Induction
  description: >-
    In Lhx2-null mouse embryos, loss of Bmp4 and Bmp7 expression accompanies arrest before optic cup formation, and BMP
    treatment restores lens-inducing determinants. This links BMP4 loss to absent or severely reduced eyes; the human step is
    inferred.
  biological_scale: TISSUE
  locations:
  - preferred_term: optic vesicle
    term:
      id: UBERON:0004128
      label: optic vesicle
  biological_processes:
  - preferred_term: optic cup formation
    modifier: DECREASED
    term:
      id: GO:0003408
      label: optic cup formation involved in camera-type eye development
  evidence:
  - reference: PMID:19906857
    reference_title: Lhx2 links the intrinsic and extrinsic factors that control optic cup formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Lhx2(-/-) optic vesicles and lens ectoderm upregulate Pax2, Fgf15 and Sox2 in response to BMP treatments
    explanation: BMP supplies the signal that restores lens-inducing gene expression.
  downstream:
  - target: Anophthalmia
  - target: Microphthalmia
  - target: Sclerocornea
  - target: Peters anomaly
  - target: Corneal opacity
  - target: Rieger anomaly
- name: Disrupted Extraocular BMP4 Developmental Signaling
  description: >-
    BMP4 is expressed in the human embryonic pituitary region and digits, and Bmp4 heterozygous mice have polydactyly and
    anterior segment abnormalities, so the same dose reduction is thought to produce the pituitary, digit, brain, growth
    and renal features. The link to each extraocular feature is inferred from expression and mouse data, and the
    contribution of neighbouring genes in 14q22 deletion cases is not excluded.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: embryonic digit morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
  - preferred_term: pituitary gland development
    modifier: ABNORMAL
    term:
      id: GO:0021983
      label: pituitary gland development
  evidence:
  - reference: PMID:18925664
    reference_title: "Heterozygous deletion at 14q22.1-q22.3 including the BMP4 gene in a patient with psychomotor retardation, congenital corneal opacity and feet polysyndactyly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: Bmp4 heterozygous null mice revealed skeletal abnormalities including polydactyly and ocular anterior segment abnormalities
    explanation: Mouse haploinsufficiency phenotype restated in a human case report.
  - reference: PMID:31120642
    reference_title: Loss of function BMP4 mutation supports the implication of the BMP/TGF-β pathway in the etiology of combined pituitary hormone deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: BMP4 signaling being critical to Rathke's pouch induction and maintenance during early stages of pituitary development
    explanation: Background statement of BMP4's role in pituitary development, learned from animal models.
  downstream:
  - target: Postaxial polydactyly
  - target: Hypopituitarism
  - target: Ectopic posterior pituitary
  - target: Abnormal brain morphology
  - target: Hydrocephalus
  - target: Macrocephaly
  - target: Global developmental delay
  - target: Growth delay
  - target: Renal dysplasia

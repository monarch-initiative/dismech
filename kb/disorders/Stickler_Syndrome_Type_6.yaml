  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activities such as contact sports that may lead to traumatic retinal detachment."

- category: Ocular
  name: Rhegmatogenous Retinal Detachment
  description: >
    Retinal detachment secondary to horseshoe retinal tears. Unlike COL2A1
    type 1 Stickler syndrome, the reported type IX recessive detachments were
    unilateral and not caused by giant retinal tears, which is why the
    prophylactic-retinopexy argument used in type 1 does not carry over.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Retinal detachment
    term:
      id: HP:0000541

    snippet: "early diagnosis would have a high impact for children with potentially dual sensory impairment"
    explanation: >
      Supports the specific claim that the dual sensory risk is what raises the
      stakes of audiologic management in the recessive forms.
- name: Retinal Detachment Surveillance and Case-by-Case Retinopexy
  description: >
    Annual vitreoretinal examination, education on the symptoms of retinal
    detachment, and laser therapy where indicated. The important qualification
    for STL6 is that routine prophylactic retinopexy is NOT recommended: the
    practice in COL2A1 type 1 Stickler syndrome rests on a high rate of
    bilateral giant-retinal-tear detachment, and the type IX recessive cohort
    showed neither bilateral detachment nor giant retinal tears. Prophylaxis
    should be offered case by case rather than by default.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retinal laser photocoagulation
    term:
      id: NCIT:C217424
      label: Laser Photocoagulation
  target_mechanisms:
  - target: Rhegmatogenous Retinal Detachment
    description: >
      Retinopexy aims to pre-empt detachment by sealing the peripheral retina;
      surveillance aims to catch it early.
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "laser therapy for prevention of retinal detachment"
    explanation: >
      GeneReviews management recommendation for detachment prevention across
      Stickler syndrome.
  - reference: PMID:39406934
    reference_title: "Retinal detachment in Type IX collagen recessive Stickler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylactic retinopexy should only be offered case-by-case for fellow eyes of patients presenting with GRT detachments in their first eye."
    explanation: >
      The type IX-specific qualification, and the reason this treatment is
      curated with a restriction rather than as a routine intervention.
  - reference: PMID:42518710
    reference_title: "Encircling Laser Prophylaxis for Retinal Detachment in Stickler Syndrome: The Impact on Visual Field."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is our purpose to address concerns regarding visual field loss as a barrier to optimal performance of encircling laser retinopexy as a prophylaxis for retinal detachment"
    explanation: >
      Establishes that the prophylaxis itself carries a visual-field cost, which
      is the other half of the case-by-case judgement: the intervention is not
      free, so a population with a lower detachment rate has a correspondingly
      weaker indication. The series is Stickler syndrome generally, not type IX
      recessive, hence INDIRECT.
- name: Avoidance of Contact Sports
  description: >
    GeneReviews lists contact sports and similar activities among the
    circumstances to avoid in Stickler syndrome, because of the risk of

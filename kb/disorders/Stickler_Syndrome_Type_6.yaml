  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "standard treatment of sensorineural and conductive hearing loss; prompt treatment of otitis media; consider myringotomy tubes for recurrent otitis media"
    explanation: >

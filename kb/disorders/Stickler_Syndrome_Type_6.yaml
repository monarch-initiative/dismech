animal_models:
- name: Labrador retriever oculoskeletal dysplasia (drd1, COL9A3 frameshift)
  species: Dog
  genotype: COL9A3 1-base insertion in exon 1, homozygous (drd1 locus)
  publication: PMID:20686772
  description: >
    A naturally occurring, autosomal recessive canine COL9A3 disorder combining
    short-limbed dwarfism with vitreous dysplasia, retinal detachment and
    cataract. It is the closest available animal counterpart of STL6: the same
    gene, a comparable loss-of-function allele, the same recessive inheritance,
    and both the ocular and skeletal arms of the human phenotype.
  modeled_mechanisms:
  - target: Biallelic COL9A3 Loss of Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      Homozygous frameshift in the same gene, arising spontaneously and
      segregating as a recessive trait in the breed.
    limitations: >
      The canine skeletal phenotype is short-limbed dwarfism, which is more
      severe than the mild epiphyseal dysplasia of human STL6, so the model
      overstates the skeletal arm. Hearing was not assessed in this study, so
      the model says nothing about the human disorder's most prominent feature.
    evidence:
    - reference: PMID:20686772
      reference_title: "COL9A2 and COL9A3 mutations in canine autosomal recessive oculoskeletal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Positional candidate gene analysis then led to the identification of a 1-base insertional mutation in exon 1 of COL9A3 that cosegregates with drd1"
      explanation: >
        Establishes that the canine trait is caused by a COL9A3 frameshift,
        which is what makes it a model of the human COL9A3 null state.
  - target: Vitreous Gel Hypoplasia and Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >
      Affected dogs have vitreous dysplasia with retinal detachment and
      cataract.
    limitations: >
      The canine vitreous lesion is reported as dysplasia with detachment and
      cataract rather than the specific hypoplastic gel architecture described
      in human patients, so the correspondence is at the level of "abnormal
      vitreous" rather than a matched phenotype.
    evidence:
    - reference: PMID:20686772
      reference_title: "COL9A2 and COL9A3 mutations in canine autosomal recessive oculoskeletal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ocular defects including vitreous dysplasia, retinal detachment and cataracts"
      explanation: >
        Records the ocular phenotype of the affected dogs.
  evidence:
  - reference: PMID:20686772
    reference_title: "COL9A2 and COL9A3 mutations in canine autosomal recessive oculoskeletal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Affected dogs exhibit short-limbed dwarfism and severe ocular defects."
    explanation: >
      Summarizes the model's phenotype, supporting its use as an informative
      whole-organism model of COL9A3 loss.
- name: Col9a1-null mouse
  species: Mouse
  genotype: Col9a1 knockout, homozygous (both alpha1(IX) isoforms absent)
  publication: PMID:8197187
  description: >
    A paralog knockout rather than a Col9a3 knockout. It earns its place because
    of a specific result: losing the alpha1(IX) chain functionally removes the
    entire collagen IX protein, since the heterotrimer cannot assemble without
    it. The mouse is therefore a collagen IX-null animal, which is the state a
    human COL9A3 null is also expected to produce.
  modeled_mechanisms:
  - target: Cartilage Matrix Long-Term Instability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >
      Normal at birth, then progressive non-inflammatory degenerative joint
      disease resembling human osteoarthritis -- the temporal shape of the human
      skeletal phenotype.
    limitations: >
      A different gene (Col9a1, not Col9a3) in a different species, so the
      correspondence rests on the obligate-heterotrimer argument rather than on
      matched genotypes. The mouse also shows no ocular or auditory phenotype
      in this report, which are the dominant features of the human disorder.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >
        Mouse cartilage and joint loading differ from human, and the human
        disorder's defining ocular and cochlear involvement is not reported
        here at all.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >
        The model's perturbed quantity is the alpha1(IX) chain; the disease's
        is the alpha3(IX) chain. They stand in for one another only through the
        separate finding that either loss abolishes the assembled trimer.
    evidence:
    - reference: PMID:8197187
      reference_title: "Mice lacking alpha 1 (IX) collagen develop noninflammatory degenerative joint disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice are viable and show no detectable abnormalities at birth but develop a severe degenerative joint disease resembling human osteoarthritis."
      explanation: >
        Reports the normal-at-birth, degenerative-later course that this link
        claims corresponds to the human cartilage phenotype.
  evidence:
  - reference: PMID:9252382
    reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "synthesis of alpha1(IX) polypeptides is essential for the assembly of heterotrimeric collagen IX molecules"
    explanation: >
      This is what licenses treating a Col9a1 knockout as a collagen IX-null
      model relevant to a COL9A3 null, rather than as an unrelated paralog.

diagnosis:
- name: COL9A3 Molecular Genetic Testing
  description: >
    Diagnosis rests on identifying biallelic pathogenic COL9A3 variants.
    Because hearing loss is often the presenting feature and is more severe
    than in the dominant forms, the type IX collagen genes have been proposed
    for inclusion in congenital hearing loss gene panels -- which is how several
    reported cases were actually ascertained.
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic pathogenic variants in COL9A1, COL9A2, or COL9A3 identified by molecular genetic testing"
    explanation: >
      GeneReviews diagnostic criterion for the recessive type IX collagen forms.
  - reference: PMID:31090205
    reference_title: "Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that COL9A1, COL9A2, and COL9A3 be added to genetic screening panels for patients with congenital hearing loss."
    explanation: >
      Supports the ascertainment-route claim about congenital hearing loss
      panels.
  - reference: PMID:41856555
    reference_title: "Diagnostic genetic testing indications and findings in type II, IX and XI collagenopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A retrospective review was undertaken of genetic tests including genes COL2A1, COL11A1, COL11A2, COL9A1, COL9A2 and COL9A3 from a clinical diagnostic laboratory."
    explanation: >
      Confirms that COL9A3 is carried on the commercial collagenopathy panels
      through which this diagnosis is made in practice.
differential_diagnoses:
- name: Stickler Syndrome Type 1
  description: >
    The commonest form, COL2A1-related and autosomal dominant. Separated from
    type 6 by inheritance, by a much higher retinal detachment risk driven by
    giant retinal tears, and by the presence of cleft palate.
  distinguishing_features:
  - Autosomal dominant COL2A1 haploinsufficiency rather than biallelic COL9A3 loss
  - Lifetime retinal detachment risk above 50%, much of it from giant retinal tears
  - Cleft palate is common, whereas it is unreported with type IX collagen variants
  - Hearing loss in about half of patients, versus 91.7% in the type IX recessive cohort
  evidence:
  - reference: PMID:35885918
    reference_title: "Autosomal Recessive Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cleft palate is associated with type XI collagen variants, as well as the non-collagen genes, but is so far unreported with type IX collagen variants."
    explanation: >
      The palate finding is the single cleanest clinical discriminator between
      the type IX recessive forms and the dominant type II/XI forms.
- name: COL9A1- and COL9A2-related recessive Stickler syndrome (types 4 and 5)
  description: >
    The sibling recessive type IX collagen forms. These are the hardest
    differential, because they are not reliably distinguishable on phenotype at
    all -- the literature analyses the three together and the largest series
    pools them. The distinction is molecular.
  distinguishing_features:
  - Biallelic COL9A1 (type 4) or COL9A2 (type 5) rather than COL9A3
  - No phenotypic discriminator has been established; separation is by gene panel or sequencing
  evidence:
  - reference: PMID:35885918
    reference_title: "Autosomal Recessive Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most commonly affected are the three genes for type IX collagen, COL9A1, COL9A2 and COL9A3"
    explanation: >
      Groups the three type IX genes as the common cause of recessive Stickler
      syndrome, which is why they are treated together clinically and why the
      differential is molecular rather than phenotypic.

discussions:
- discussion_id: collagen_ix_residual_trimer
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Type IX Collagen Heterotrimer Assembly
  prompt: >
    Does biallelic COL9A3 loss abolish collagen IX in human tissue, as the mouse
    Col9a1 knockout implies, or do the remaining alpha1 and alpha2 chains form
    an alternative heterotrimer that retains part of the function?
  rationale: >
    This entry's upstream mechanism is built on mouse data showing that removing
    one alpha chain functionally removes the whole protein. The translational
    step is doubly indirect: a different species and a different one of the three
    chains. A review of the human recessive cases argues the other way, reasoning
    that the skeletal phenotype of biallelic type IX collagen loss is milder than
    a true null should give, and proposing a partly functional residual trimer.
    The distinction is not academic. A true null predicts that COL9A1, COL9A2 and
    COL9A3 recessive disease should be equivalent, which is the assumption that
    licenses this entry's use of pooled type IX cohort statistics; a residual
    trimer predicts chain-specific differences, and would mean those pooled
    figures are averaging over genuinely different diseases.
  notes: >
    Resolving this needs human COL9A3-null tissue or cells, which no cited study
    reports. Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because
    the model evidence exists and is clear; what is uncertain is whether it
    transfers.
  evidence:
  - reference: PMID:35885918
    reference_title: "Autosomal Recessive Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic loss of any one of the α chains for type IX collagen results in the milder skeletal SS phenotype"
    explanation: >
      The human observation that motivates the mismatch -- the phenotype is
      milder than the mouse-derived null model predicts.
  - reference: PMID:9252382
    reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "synthesis of alpha1(IX) polypeptides is essential for the assembly of heterotrimeric collagen IX molecules"
    explanation: >
      The model-system finding whose transfer to human COL9A3 is the open
      question.

notes: >
  Scope. This entry covers the biallelic COL9A3 disorder that MONDO calls
  Stickler syndrome, type 6. The sibling recessive type IX forms -- COL9A1
  (type 4) and COL9A2 (type 5) -- are not curated. That is a real limitation of
  this entry rather than a claim of distinctness: the literature reports the
  three as clinically indistinguishable and generally analyses them together,
  and the largest series pools all three. Several evidence items here are
  therefore drawn from type IX collagen cohorts rather than COL9A3-only cohorts,
  and are marked as such in their explanations. If the sibling types are curated
  later, a grouping over the three would be the natural home for the pooled
  cohort data.

  Absence of cleft palate. Cleft palate is a familiar feature of Stickler
  syndrome and is genuinely absent here. It is recorded in the description and
  in the Midface Hypoplasia evidence rather than as a phenotype entry, because
  the schema has no way to assert a phenotype's absence and inventing a
  zero-frequency phenotype row would misrepresent it. The two sources are
  PMID:35885918 ("so far unreported with type IX collagen variants") and
  PMID:39406934 ("No patients had cleft palate").

  COL9A3 heterozygotes are not uniformly unaffected. The recessive/dominant
  split implied by the type-numbered nosology is not clean for this gene.
  Heterozygous COL9A3 alleles cause multiple epiphyseal dysplasia type 3
  (PMID:10090888, an in-frame exon-3 skip in the COL3 domain), contribute to
  lumbar disc disease risk (PMID:11308397), and in two families caused dominant
  peripheral vitreoretinal degeneration with retinal detachment (PMID:33633367)
  -- a phenotype overlapping the ocular arm of this entry. The mechanistic
  reading that reconciles this is allele class rather than dose: an in-frame
  altered chain is incorporated and acts dominant-negatively, whereas a null
  allele is silent in the heterozygote and only manifests when both copies are
  lost. This is better supported than "curator's inference" -- PMID:35885918
  says of those dominant COL9A3 families that the phenotype may represent a
  dominant negative effect on the heterotrimer, and PMID:33633367's own cDNA
  work shows they carry an in-frame COL2-domain deletion and a COL3-domain
  missense, exactly the incorporated-chain allele class the reading requires. It
  is recorded here rather than as a pathophysiology node because it concerns
  alleles this entry does not curate.

  Deliberate omissions. GeneReviews (PMID:20301479) is mined here for
  diagnosis, management, genetic counselling and two Clinical Characteristics
  items (degenerative joint disease, cataract), but not exhaustively: its
  characteristics are pan-Stickler and dominated by the COL2A1 form, so
  importing them wholesale would import dominant-form claims -- cleft palate
  above all, which is precisely what this subtype lacks. Midface Hypoplasia and
  Cataract are left with no upstream pathophysiology node because no cited
  source offers a mechanism for either in this disorder; both phenotypes are
  real and evidenced, the mechanisms are not known, and inventing nodes to
  connect them would be worse than the gap. Every other phenotype is reached
  from the causal chain.

  Prevalence. No rate estimate exists for COL9A3 specifically. The prevalence
  record therefore uses CASES_IN_LITERATURE with a reported-family count rather
  than converting a Stickler-wide figure, which would be wrong by orders of
  magnitude for this ultra-rare subtype.

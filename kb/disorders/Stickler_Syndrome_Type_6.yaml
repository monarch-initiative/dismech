name: Stickler Syndrome Type 6
creation_date: "2026-09-07T21:45:00Z"
category: Mendelian
description: >
  Stickler syndrome type 6 (STL6) is the COL9A3-related, autosomal recessive
  form of Stickler syndrome. Type IX collagen is a heterotrimer of three
  genetically distinct chains -- alpha1, alpha2 and alpha3, encoded by COL9A1,
  COL9A2 and COL9A3 -- that decorates the surface of type II collagen fibrils
  in vitreous, cartilage and the cochlear extracellular matrix. Biallelic
  loss-of-function variants in COL9A3 remove the alpha3 chain, and the
  fibril-surface function of collagen IX is lost or degraded. Whether the loss
  is total is genuinely unsettled: mouse work shows that removing one chain
  abolishes the whole protein, but a review of the human recessive cases argues
  the milder-than-expected skeletal phenotype may mean the remaining two chains
  form a partly functional alternative heterotrimer. Both readings are recorded
  below.
  This separates STL6 mechanistically from the two common dominant forms. Types
  1 and 2 arise from a single altered COL2A1 or COL11A1 allele acting through
  haploinsufficiency or a dominant-negative incorporated chain; STL6 is a
  recessive null state of a different, quantitatively minor collagen. The
  clinical consequence tracks that difference. High myopia with an abnormal,
  hypoplastic vitreous is near-universal, but sensorineural hearing loss is
  both more frequent and more severe than in the dominant forms -- moderate to
  severe and downsloping -- which is why the type IX collagen genes have been
  proposed for congenital hearing loss gene panels. Cleft palate, a familiar
  feature of the type II and type XI collagen forms, has not been reported with
  type IX collagen variants at all.
  Retinal detachment risk is the second point of divergence, and it matters
  clinically. Type 1 Stickler syndrome carries a lifetime detachment risk above
  50%, much of it from giant retinal tears, which is what justifies prophylactic
  retinopexy in that group. In the largest type IX recessive series the
  detachments were fewer, unilateral, and secondary to horseshoe tears rather
  than giant retinal tears, so the prophylaxis argument does not transfer.
  COL9A3 is allelic across several disorders and the inheritance is not a clean
  recessive/dominant split: heterozygous variants cause multiple epiphyseal
  dysplasia type 3, contribute to sensorineural hearing loss and lumbar disc
  disease, and -- in two reported families -- cause dominant peripheral
  vitreoretinal degeneration with retinal detachment. A naturally occurring
  canine model exists, the Labrador retriever drd1 allele, an autosomal
  recessive COL9A3 frameshift producing short-limbed dwarfism with vitreous
  dysplasia and retinal detachment.

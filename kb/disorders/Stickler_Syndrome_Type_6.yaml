genetic:
- name: COL9A3
  notes: >
    COL9A3 encodes the alpha3 chain of type IX collagen. Biallelic
    loss-of-function variants cause Stickler syndrome type 6. The gene is
    allelic across several distinct disorders, and the distinction is the kind
    of allele rather than the gene: an in-frame dominant-negative allele gives
    multiple epiphyseal dysplasia type 3, while a biallelic null gives this
    entry's phenotype.
  gene_term:
    preferred_term: COL9A3
    term:
      id: hgnc:2219
      label: COL9A3
  relationship_type: CAUSATIVE
  variants:
  - name: c.1176_1198del (p.Gln393Cysfs*25)
    description: >
      Homozygous 23-bp deletion causing a frameshift and premature termination.
      The index allele of COL9A3-related recessive Stickler syndrome.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:24273071
      reference_title: "Autosomal recessive Stickler syndrome due to a loss of function mutation in the COL9A3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we describe the first autosomal recessive Stickler family due to loss of function mutations (c.1176_1198del, p.Gln393Cysfs*25) of COL9A3 gene"
      explanation: >
        Names the allele and its loss-of-function consequence in the index
        family.
  - name: c.268C>T (p.Arg90Ter)
    description: >
      Nonsense allele, reported in trans with c.1729C>T in a compound
      heterozygous patient.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33570243
      reference_title: "Clinical and genetic characterization of autosomal recessive stickler syndrome caused by novel compound heterozygous mutations in the COL9A3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two undescribed mutations in the COL9A3 gene: c.268C>T (p.Arg90Ter) and c.1729C>T (p.Arg577Ter)"
      explanation: >
        Names both alleles of the compound heterozygous genotype.
  - name: c.1729C>T (p.Arg577Ter)
    description: >
      Nonsense allele, reported in trans with c.268C>T.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33570243
      reference_title: "Clinical and genetic characterization of autosomal recessive stickler syndrome caused by novel compound heterozygous mutations in the COL9A3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two undescribed mutations in the COL9A3 gene: c.268C>T (p.Arg90Ter) and c.1729C>T (p.Arg577Ter)"
      explanation: >
        Names both alleles of the compound heterozygous genotype.
  evidence:
  - reference: PMID:24273071
    reference_title: "Autosomal recessive Stickler syndrome due to a loss of function mutation in the COL9A3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe the first autosomal recessive Stickler family due to loss of function mutations (c.1176_1198del, p.Gln393Cysfs*25) of COL9A3 gene"
    explanation: >
      The index COL9A3 recessive Stickler family, establishing the gene-disease
      relationship and naming the causal frameshift allele.
  - reference: PMID:30450842
    reference_title: "Autosomal recessive Stickler syndrome resulting from a COL9A3 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the second case of autosomal recessive Stickler syndrome due to homozygosity for a loss of function mutation in COL9A3, which encodes the α3 chain of type IX procollagen."
    explanation: >
      Independent confirmation of the gene-disease relationship in a second
      family, and states the gene product.
  - reference: PMID:35241111
    reference_title: "Identification of three novel homozygous variants in COL9A3 causing autosomal recessive Stickler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report three unrelated families clinically diagnosed with STL carrying different novel biallelic loss of function variants in COL9A3."
    explanation: >

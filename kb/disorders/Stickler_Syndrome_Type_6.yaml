  description: >
    Standard treatment of sensorineural and conductive hearing loss, with
    prompt treatment of otitis media and consideration of myringotomy tubes for
    recurrent episodes. This carries more weight in STL6 than in the dominant
    forms, because hearing loss is both more frequent and more severe here and
    because these patients are frequently also visually impaired, so a dual
    sensory deficit is the realistic outcome of leaving it untreated.
  therapeutic_modality: OTHER
  treatment_term:

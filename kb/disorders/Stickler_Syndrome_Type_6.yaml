inheritance:
- name: Autosomal recessive inheritance
  description: >
    STL6 requires biallelic COL9A3 loss-of-function variants; reported families
    carry homozygous variants (frequently with parental consanguinity) or
    compound heterozygous nonsense variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301479
    reference_title: "Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stickler syndrome caused by pathogenic variants in COL9A1, COL9A2, or COL9A3 is inherited in an autosomal recessive manner"
    explanation: >
      GeneReviews states the recessive inheritance of the type IX collagen
      forms, of which the COL9A3-related type 6 curated here is one.
  - reference: PMID:39406934
    reference_title: "Retinal detachment in Type IX collagen recessive Stickler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "6/11 families exhibited previously undescribed genetic variants, and 7 had consanguineous parents."
    explanation: >
      Parental consanguinity in a majority of families in the largest type IX
      recessive series, consistent with recessive inheritance.
prevalence:
- population: Worldwide, families reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Counted as reported families rather than an estimated rate. As of the 2022
    Orphanet Journal of Rare Diseases report, four families with biallelic
    COL9A3 variants had been described; that paper added three more. The 2024
    NHS England Highly Specialised Stickler Syndrome Service series covers all
    three type IX collagen genes together (13 patients from 11 families) and
    does not break out COL9A3 separately, so no COL9A3-specific rate exists.
  evidence:
  - reference: PMID:35241111
    reference_title: "Identification of three novel homozygous variants in COL9A3 causing autosomal recessive Stickler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive STL is ultra-rare with only four families with biallelic COL9A3 variants reported to date."
    explanation: >
      States both the ultra-rare classification and the reported-family count
      that this record is based on.
pathophysiology:
- name: Biallelic COL9A3 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Both COL9A3 alleles carry loss-of-function variants -- reported as
    homozygous frameshift or nonsense changes, often with parental
    consanguinity, or as compound heterozygous nonsense changes. The alpha3(IX)
    chain is therefore absent or truncated, rather than being made in an
    altered form and incorporated into the protein.
  molecular_functions:
  - preferred_term: collagen binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005518
      label: collagen binding
  downstream:
  - target: Failure of Type IX Collagen Heterotrimer Assembly
    causal_link_type: DIRECT
    description: >
      With no intact alpha3(IX) chain available, the heterotrimer has no third
      constituent chain to recruit.
    evidence:
    - reference: PMID:24273071
      reference_title: "Autosomal recessive Stickler syndrome due to a loss of function mutation in the COL9A3 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Type IX collagen is a heterotrimeric molecule formed by three genetically distinct chains: α1, α2, and α3 encoded by the COL9A1, COL9A2, and COL9A3 genes."
      explanation: >
        Establishes that the COL9A3 product is one of three obligate chains of
        the heterotrimer, so its loss acts on trimer assembly.
  evidence:
  - reference: PMID:24273071
    reference_title: "Autosomal recessive Stickler syndrome due to a loss of function mutation in the COL9A3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe the first autosomal recessive Stickler family due to loss of function mutations (c.1176_1198del, p.Gln393Cysfs*25) of COL9A3 gene"
    explanation: >
      The index report of COL9A3-related recessive Stickler syndrome, naming the
      loss-of-function frameshift allele.
- name: Failure of Type IX Collagen Heterotrimer Assembly
  biological_scale: MOLECULAR
  description: >
    Assembly of the collagen IX heterotrimer is disrupted. How completely is
    contested, and this entry does not resolve it. The mouse evidence is that
    collagen IX is obligately heterotrimeric: Col9a1 inactivation abolished all
    collagen IX polypeptides even though Col9a2 and Col9a3 were transcribed
    normally, which would make a COL9A3 null a collagen IX null. Against that, a
    review of the human recessive cases notes that biallelic loss of any one
    alpha chain gives a milder skeletal phenotype than expected, and proposes
    that the remaining two chains may form an alternative heterotrimer retaining
    part of the function. The refuting item is recorded on this node, and the
    open question is carried as a HUMAN_MODEL_MISMATCH discussion.
  cellular_components:
  - preferred_term: collagen trimer
    modifier: DECREASED
    term:
      id: GO:0005581
      label: collagen trimer
  downstream:
  - target: Loss of Collagen IX from the Type II Fibril Surface
    causal_link_type: DIRECT
    description: >
      Collagen IX reaches the fibril only as an assembled trimer, so failure of
      assembly removes it from the fibril surface.
    evidence:
    - reference: PMID:9252382
      reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "the deficiency in alpha1(IX) chains leads to a functional knock-out of all polypeptides of collagen IX, whereas the Col9a2 and Col9a3 genes were normally transcribed"
      explanation: >
        Directly evidences this edge: losing one chain removes the whole protein
        even when the other two genes are transcribed normally, which is the
        step from assembly failure to absence of collagen IX. Shown for the
        alpha1 chain in mouse, so the transfer to alpha3 in human is an
        inference.
  evidence:
  - reference: PMID:9252382
    reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "synthesis of alpha1(IX) polypeptides is essential for the assembly of heterotrimeric collagen IX molecules"
    explanation: >
      Demonstrates the obligate-heterotrimer requirement, but for the alpha1(IX)
      chain in mouse rather than the alpha3(IX) chain in human -- the inference
      to COL9A3 is by the shared assembly requirement, hence INDIRECT.
  - reference: PMID:35885918
    reference_title: "Autosomal Recessive Stickler Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This may suggest that the remaining two α chains are able to form an alternative heterotrimer, which can fulfil some, but not all, of the functions of the normal heterotrimer."
    explanation: >
      Cuts against this node's stronger reading. Reviewing the human recessive
      cases, the authors argue from the milder-than-expected skeletal phenotype
      that losing one alpha chain may leave a partly functional alternative
      trimer rather than no collagen IX at all. REFUTE because it contradicts
      total assembly failure, which the mouse data supports.
- name: Loss of Collagen IX from the Type II Fibril Surface
  biological_scale: MOLECULAR
  description: >
    Collagen IX is not a structural core of the fibril but a fibril-associated
    (FACIT) collagen sitting on the surface of type II collagen fibrils, with a
    long arm cross-linked to collagen II and a short arm projecting into the
    perifibrillar space where it mediates interactions with other matrix
    components. Its loss therefore does not prevent fibrils from forming; mouse
    work found fibrils of normal shape and banding in collagen IX-deficient
    cartilage. What is lost is long-term tissue stability -- which is why the
    resulting disease is degenerative and progressive rather than a congenital
    failure of matrix formation.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Vitreous Gel Hypoplasia and Disorganization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33633367
      reference_title: "Heterozygous COL9A3 variants cause severe peripheral vitreoretinal degeneration and retinal detachment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "both indicating the critical role of Type IX collagen in the vitreous base of the eye"
      explanation: >
        Evidences this specific edge -- that collagen IX loss acts on the
        vitreous -- from human COL9A3 variants with vitreous pathology, rather
        than from the general matrix argument.
  - target: Cochlear Extracellular Matrix Instability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36140739
      reference_title: "Hearing Loss in Stickler Syndrome: An Update."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hearing loss in the rarer types of Stickler syndrome depends on the gene expression in the cochlea"
      explanation: >
        Supports the cochlea as the site where the collagen defect acts, by
        attributing the subtype-to-subtype severity gradient to cochlear
        expression of the affected gene.
  - target: Cartilage Matrix Long-Term Instability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9252382
      reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, cartilage fibrils of all shapes and banding patterns found in normal newborn, adolescent, or adult mice were formed in transgenic animals, although they lacked collagen IX."
      explanation: >
        Evidences the particular form this edge takes -- fibrils still form
        without collagen IX, so what the cartilage loses is durability rather
        than assembly. Mouse Col9a1 data, hence indirect for human COL9A3.
  evidence:
  - reference: PMID:8197187
    reference_title: "Mice lacking alpha 1 (IX) collagen develop noninflammatory degenerative joint disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Type IX molecules are localized on the surface of type II-containing fibrils"
    explanation: >
      Establishes the fibril-surface localization that this node's claim rests
      on. Stated for collagen IX generally in a mouse study, so the step to the
      human COL9A3 null is an inference.
  - reference: PMID:9252382
    reference_title: "Absence of the alpha1(IX) chain leads to a functional knock-out of the entire collagen IX protein in mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The protein is required, however, for long term tissue stability, presumably by mediating interactions between fibrillar and extrafibrillar macromolecules."
    explanation: >
      Supports the specific claim that the deficit is in long-term matrix
      stability rather than in fibril formation, which is what makes the
      downstream phenotypes degenerative.
- name: Vitreous Gel Hypoplasia and Disorganization
  biological_scale: TISSUE
  description: >
    The vitreous is a collagen II-based gel in which collagen IX is a normal
    surface constituent, and it is the tissue where the loss is most visible
    clinically. Affected individuals have an abnormal, hypoplastic vitreous gel
    with abnormal architecture, present from birth alongside congenital
    megalophthalmos. This is the type IX counterpart of the membranous (type 1)
    and beaded (type 2) vitreous phenotypes that separate the dominant forms.
  locations:
  - preferred_term: vitreous body
    term:
      id: UBERON:0001798
      label: vitreous body
  downstream:
  - target: Abnormal Vitreous Gel
    causal_link_type: DIRECT
  - target: High Myopia
    causal_link_type: DIRECT
  - target: Vitreoretinal Interface Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33633367
      reference_title: "Heterozygous COL9A3 variants cause severe peripheral vitreoretinal degeneration and retinal detachment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report describes two families with autosomal dominant inheritance and predominant features of peripheral vitreoretinal lattice degeneration and retinal detachment."
      explanation: >
        Ties COL9A3 disruption specifically to peripheral vitreoretinal
        degeneration in human eyes. These families are heterozygous rather than
        biallelic, so the edge is evidenced by a different allele class than
        this entry curates -- noted rather than glossed.
  evidence:
  - reference: PMID:31090205
    reference_title: "Homozygous Type IX collagen variants (COL9A1, COL9A2, and COL9A3) causing recessive Stickler syndrome-Expanding the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were highly myopic with congenital megalophthalmos and abnormal, hypoplastic vitreous gel, and all had sensorineural hearing loss."
    explanation: >
      Reports the hypoplastic, abnormal vitreous gel in every affected
      individual across four type IX collagen recessive Stickler pedigrees, one
      of which carried COL9A3 variants.
- name: Cochlear Extracellular Matrix Instability
  biological_scale: TISSUE
  description: >
    Collagen IX is expressed in the cochlea, and the severity of hearing loss
    across Stickler subtypes tracks which collagen gene is affected and how it
    is expressed there. The biallelic type IX collagen forms sit at the severe
    end, producing moderate to severe downsloping sensorineural loss, in
    contrast with the milder high-frequency loss of COL2A1-related type 1.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  downstream:
  - target: Sensorineural Hearing Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36140739
      reference_title: "Hearing Loss in Stickler Syndrome: An Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "moderate to severe downsloping hearing loss for Stickler syndrome caused by biallelic type IX collagen gene mutations"
      explanation: >
        Connects the biallelic type IX collagen defect to the specific
        audiometric phenotype, which is the claim this edge makes.
  evidence:
  - reference: PMID:36140739
    reference_title: "Hearing Loss in Stickler Syndrome: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate to severe downsloping hearing loss for Stickler syndrome caused by biallelic type IX collagen gene mutations"
    explanation: >
      Attributes the severe downsloping audiometric pattern specifically to the
      biallelic type IX collagen forms, and attributes the gradient across
      subtypes to cochlear gene expression.
- name: Cartilage Matrix Long-Term Instability
  biological_scale: TISSUE
  description: >
    In cartilage the same loss of fibril-surface collagen IX leaves the matrix
    able to form but not to endure. The skeletal consequence is a mild
    epiphyseal and spondyloepiphyseal dysplasia with early-onset degenerative
    arthropathy, rather than a severe congenital chondrodysplasia. Bowing of
    the long bones at birth has been reported in one family.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Epiphyseal Dysplasia
    causal_link_type: DIRECT
  - target: Spondyloepiphyseal Dysplasia
    causal_link_type: DIRECT
  - target: Congenital Long Bone Bowing
    causal_link_type: DIRECT
  - target: Early-Onset Arthropathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8197187
      reference_title: "Mice lacking alpha 1 (IX) collagen develop noninflammatory degenerative joint disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice are viable and show no detectable abnormalities at birth but develop a severe degenerative joint disease resembling human osteoarthritis."
      explanation: >
        Evidences the cartilage-instability-to-arthropathy step in a collagen
        IX-deficient animal. Indirect for this entry: a Col9a1 knockout in
        mouse, not a COL9A3 null in human.
  evidence:
  - reference: PMID:8197187
    reference_title: "Mice lacking alpha 1 (IX) collagen develop noninflammatory degenerative joint disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mutant mice are viable and show no detectable abnormalities at birth but develop a severe degenerative joint disease resembling human osteoarthritis."
    explanation: >
      The normal-at-birth, degenerative-later course in collagen IX-deficient
      mice is the model-organism counterpart of the progressive human
      arthropathy. Cited for the mechanism's shape, not for the human
      phenotype, and it is a Col9a1 rather than Col9a3 knockout.
- name: Vitreoretinal Interface Degeneration
  biological_scale: TISSUE
  description: >
    Degeneration at the vitreoretinal interface, most marked peripherally,
    follows from the abnormal vitreous. It is the lesion that generates retinal
    tears, and it is also the phenotype that heterozygous COL9A3 variants can
    produce on their own in a dominant pattern. Named distinctly from the
    phenotype it produces so the two do not collapse into one pathograph node.
  downstream:
  - target: Peripheral Vitreoretinal Degeneration
    causal_link_type: DIRECT
  - target: Rhegmatogenous Retinal Detachment
    causal_link_type: DIRECT
    description: >
      In the type IX recessive cohort, detachments arose from horseshoe retinal
      tears rather than the giant retinal tears characteristic of type 1.
    evidence:
    - reference: PMID:39406934
      reference_title: "Retinal detachment in Type IX collagen recessive Stickler syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "15.4% of patients developed RD secondary to horseshoe retinal tears, with no cases of bilateral RD or giant retinal tears (GRTs)."
      explanation: >
        Names the tear mechanism linking peripheral degeneration to detachment
        in this specific population, and its rate.
  evidence:
  - reference: PMID:33570243
    reference_title: "Clinical and genetic characterization of autosomal recessive stickler syndrome caused by novel compound heterozygous mutations in the COL9A3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features included severe sensorineural hearing loss, high myopia, vitreoretinal degeneration, and early-onset arthropathy of the lower limbs."
    explanation: >
      Records vitreoretinal degeneration in a molecularly confirmed compound
      heterozygous COL9A3 case.
phenotypes:
- category: Ocular
  name: High Myopia
  description: >
    Congenital high myopia with megalophthalmos. The two available figures
    disagree because they measure different populations against different
    thresholds: a review pooling type IX and type XI collagen patients calls it
    near-universal, while the type IX-only series scored 77% against a defined
    cut-off of worse than -6 dioptres. The band follows the narrower, type
    IX-specific number.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: High myopia
    term:
      id: HP:0011003
      label: High myopia
  evidence:
  - reference: PMID:35885918
    reference_title: "Autosomal Recessive Stickler Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High myopia is near-universal, and sensorineural hearing loss is very common in patients with variants in genes for type IX or XI collagen"
    explanation: >
      Review of 40 published recessive Stickler patients. It pools type IX with
      type XI collagen cases, so it establishes that high myopia dominates the
      recessive picture but does not on its own fix a type IX frequency band.
  - reference: PMID:39406934
    reference_title: "Retinal detachment in Type IX collagen recessive Stickler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High myopia (>−6): 10/13; 77%"
    explanation: >
      The type IX-specific figure, against an explicit dioptric threshold. This
      is what the FREQUENT band rests on; it is lower than the pooled review's
      "near-universal" because the population is narrower and the cut-off is
      defined.
